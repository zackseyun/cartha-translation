  text: 'Then he measured the wall of the house: six cubits[a]; and the width of the side chambers was four cubits all around the house on every side.'
translation:
  language: pt
  text: 'Então ele mediu a parede do templo: seis côvados; e a largura das câmaras laterais[a] era de quatro côvados, ao redor do templo, em toda a volta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da câmara lateral” ou “da estrutura lateral”. O termo hebraico se refere aos compartimentos construídos junto às laterais do edifício do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol de מדד dá continuidade à sequência narrativa da visão; “Então” expressa essa progressão com naturalidade.
- source_word: קִיר
  choice: parede
  rationale: O substantivo designa a parede estrutural do edifício.
- source_word: הַבַּיִת
  choice: o templo
  rationale: Embora בַּיִת signifique literalmente “casa”, neste contexto arquitetônico refere-se ao edifício do templo; “templo” torna o referente claro ao leitor moderno.
- source_word: שֵׁשׁ אַמּוֹת
  choice: seis côvados
  rationale: Mantém a antiga unidade de medida sem conversão conjectural.
- source_word: וְרֹחַב
  choice: e a largura
  rationale: Introduz naturalmente a segunda dimensão medida.
- source_word: הַצֵּלָע
  choice: as câmaras laterais
  rationale: Neste contexto arquitetônico, o substantivo singular pode ter sentido coletivo e designa os compartimentos anexos às laterais do templo.
- source_word: אַרְבַּע אַמּוֹת
  choice: quatro côvados
  rationale: Tradução direta da medida, preservando a unidade antiga.
- source_word: סָבִיב סָבִיב לַבַּיִת סָבִיב
  choice: ao redor de todo o templo
  rationale: Reproduz de modo natural a força distributiva e enfática da repetição de סָבִיב, indicando que as estruturas cercavam o edifício.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa simples. “Templo” foi preferido a “casa” para comunicar sem ambiguidade o referente arquitetônico neste contexto. O plural “câmaras laterais” explicita o sentido coletivo indicado pela disposição ao redor do edifício.
