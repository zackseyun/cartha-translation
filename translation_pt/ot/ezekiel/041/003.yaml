base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/003.yaml
  text: 'Then he went inside and measured the jambs of the entrance: two cubits[a]; the entrance: six cubits[b]; and the width of the entrance: seven cubits.'
translation:
  language: pt
  text: 'Então ele entrou e mediu as ombreiras da entrada: dois côvados[a]; a entrada: seis côvados[b]; e a largura da entrada: sete côvados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as pilastras da entrada” ou “os pilares laterais da entrada”.'
    reason: lexical_alternative
  - marker: b
    text: A referência arquitetônica dessas medidas é incerta; alguns entendem que se trata da largura de uma estrutura relacionada à entrada, e não apenas da abertura livre.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: Então ele entrou
  rationale: O verbo בוא com waw faz a narrativa avançar e, junto de לִפְנִימָה, descreve o movimento do guia para o interior.
- source_word: לִפְנִימָה
  choice: entrou
  rationale: O sentido de movimento para dentro é expresso naturalmente em português pelo verbo composto no contexto, sem especificar além do hebraico qual recinto interior estava em vista.
- source_word: וַיָּמָד
  choice: mediu
  rationale: Tradução direta e natural da ação no contexto da visão e das medições do templo.
- source_word: אֵיל הַפֶּתַח
  choice: os pilares laterais da entrada
  rationale: Em contexto arquitetônico, אֵיל pode designar um suporte saliente, pilastra ou ombreira. 'Pilares laterais' é claro ao leitor comum e conserva a referência estrutural; a alternativa mais técnica fica em nota.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: dois côvados
  rationale: Tradução direta da medida antiga, preservando a unidade do texto-fonte.
- source_word: וְהַפֶּתַח
  choice: a entrada
  rationale: Mantém a formulação concisa e formal do hebraico, sem acrescentar que se trata necessariamente da abertura propriamente dita.
- source_word: שֵׁשׁ אַמּוֹת
  choice: seis côvados
  rationale: Tradução direta da medida.
- source_word: וְרֹחַב הַפֶּתַח
  choice: e a largura da entrada
  rationale: Reproduz o sentido lexical mais natural, embora a relação arquitetônica entre as medidas permaneça difícil; essa dificuldade não é resolvida no corpo do texto.
- source_word: שֶׁבַע אַמּוֹת
  choice: sete côvados
  rationale: Tradução direta da medida.
