source:
  edition: WLC
  text: וּ/מָדַ֣ד אֹֽרֶךְ הַ֠/בִּנְיָן אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה אֲשֶׁ֨ר עַל אַחֲרֶ֧י/הָ ו/אתוקי/הא מִ/פּ֥וֹ וּ/מִ/פּ֖וֹ מֵאָ֣ה אַמָּ֑ה וְ/הַֽ/הֵיכָל֙ הַ/פְּנִימִ֔י וְ/אֻֽלַמֵּ֖י הֶ/חָצֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/015.yaml
  text: 'Then he measured the length of the building facing the separate area that was behind it[a], with its galleries on this side and on that side: one hundred cubits[b]; and the inner nave and the porches of the court.'
translation:
  language: pt
  text: 'Então ele mediu o comprimento do edifício voltado para a área separada que ficava atrás dele, com suas galerias[a] de um lado e do outro: cem côvados; mediu também o salão interno[b] e os pórticos do pátio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas colunatas”, ou ainda outra estrutura arquitetônica lateral; o termo hebraico é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o templo interno” ou “o santuário interno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: Então ele mediu
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa essa progressão com naturalidade.
- source_word: אֹרֶךְ הַבִּנְיָן
  choice: o comprimento do edifício
  rationale: Mantém os termos arquitetônicos gerais e diretos do hebraico.
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: voltado para a área separada
  rationale: “Voltado para” comunica a orientação espacial, enquanto “área separada” preserva o sentido de גִּזְרָה sem definir em excesso sua função exata.
- source_word: אֲשֶׁר עַל אַחֲרֶיהָ
  choice: que ficava atrás dele
  rationale: Expressa de modo natural a localização na parte posterior do edifício; o pronome retoma o edifício no fluxo da frase.
- source_word: וְאתוקיהא
  choice: com suas galerias
  rationale: O termo arquitetônico textual é obscuro; “galerias” é uma interpretação plausível, e a incerteza é explicitada em nota.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: de um lado e do outro
  rationale: Preserva a expressão distributiva e espacial dos dois lados.
- source_word: מֵאָה אַמָּה
  choice: cem côvados
  rationale: Conserva a unidade antiga, apropriada ao contexto visionário e arquitetônico.
- source_word: הַהֵיכָל הַפְּנִימִי
  choice: o salão interno
  rationale: הֵיכָל pode designar o salão principal do templo; “salão interno” é claro e evita confundi-lo automaticamente com todo o complexo ou com o Santo dos Santos.
- source_word: וְאֻלַמֵּי הֶחָצֵר
  choice: os pórticos do pátio
  rationale: “Pórticos” comunica de forma corrente estruturas de entrada ou cobertas associadas ao pátio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário arquitetônico compreensível. A repetição de “mediu” na segunda oração foi explicitada para que o fragmento final da frase seja inteligível em português, sem eliminar a forma enumerativa do hebraico. Todos os marcadores de nota aparecem no texto.
