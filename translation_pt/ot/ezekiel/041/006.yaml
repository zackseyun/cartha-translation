    text: 'Ou: “para ficarem presas... não ficavam presas na parede do templo”; ou: “para serem sustentadas... não eram sustentadas pela parede do templo”. O hebraico enfatiza que as câmaras ficavam seguras no lugar, mas preserva uma distinção arquitetônica cuja explicação exata é incerta.'
    reason: lexical_alternative
