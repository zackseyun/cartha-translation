base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/006.yaml
  text: And the side chambers were side chamber upon side chamber[a], three and thirty times; and they entered into the wall that belonged to the house for the side chambers all around, so that they might be supported[b], but they were not supported by the wall of the house.
translation:
  language: pt
  text: As câmaras laterais ficavam câmara junto a câmara, em três andares, trinta em cada andar; encaixavam-se na parede do templo, ao redor das câmaras laterais, para ficarem firmes, mas não ficavam firmadas na parede do templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para ficarem presas... não ficavam presas na parede do templo”; ou: “para serem sustentadas... não eram sustentadas pela parede do templo”. O hebraico enfatiza que as câmaras ficavam seguras no lugar, mas preserva uma distinção arquitetônica cuja explicação exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּלָעוֹת / צֵלָע
  choice: câmaras laterais
  rationale: No contexto arquitetônico do templo, o termo designa compartimentos ou estruturas laterais, não uma 'costela' literal.
- source_word: צֵלָע אֶל צֵלָע
  choice: umas sobre as outras
  rationale: Expressa em português natural a disposição sucessiva ou vertical indicada pela construção distributiva hebraica, sem excluir completamente outra compreensão arquitetônica.
- source_word: שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
  choice: em trinta e três posições
  rationale: Conserva o número e evita o sentido temporal enganoso de 'trinta e três vezes'; o referente exato da contagem permanece incerto.
- source_word: וּבָאוֹת בַּקִּיר אֲשֶׁר לַבַּיִת
  choice: penetravam na parede que pertencia ao templo
  rationale: Mantém o sentido espacial concreto do particípio e distingue essa parede da parede do próprio edifício mencionada no contraste final.
- source_word: לַצְּלָעוֹת סָבִיב סָבִיב
  choice: ao redor das câmaras laterais
  rationale: Reproduz a disposição circundante intensificada pela repetição de סָבִיב de modo corrente em português.
- source_word: לִהְיוֹת אֲחוּזִים / יִהְיוּ אֲחוּזִים
  choice: para que fossem firmadas / não eram firmadas
  rationale: O particípio passivo de אחז destaca que as estruturas eram presas ou mantidas firmes. A repetição do mesmo verbo em português preserva o contraste do hebraico.
- source_word: בְּקִיר הַבָּיִת
  choice: na parede do próprio templo
  rationale: A preposição 'na' preserva melhor a ideia de fixação na parede do que 'pela', enquanto 'próprio' torna claro o contraste arquitetônico já presente no verso.
