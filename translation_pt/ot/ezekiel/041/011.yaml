base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/011.yaml
  text: And the doorway of the side chamber was toward the free space[a], one doorway toward the north and one doorway toward the south; and the width of the free space was five cubits all around.
translation:
  language: pt
  text: 'A entrada da câmara lateral dava para o espaço livre[a]: uma entrada voltada para o norte e outra voltada para o sul. A largura do espaço livre era de cinco côvados em toda a volta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espaço aberto” ou “área desocupada”; o hebraico מֻנָּח refere-se à área deixada livre ao redor da estrutura.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶתַח
  choice: entrada
  rationale: No contexto arquitetônico, “entrada” expressa com naturalidade a abertura de acesso, sem exigir que houvesse uma porta instalada.
- source_word: הַצֵּלָע
  choice: a câmara lateral
  rationale: Em Ezequiel 41, o termo designa uma câmara anexa à estrutura principal; “câmara lateral” é preciso e mantém o caráter arquitetônico.
- source_word: לַמֻּנָּח / מְקוֹם הַמֻּנָּח
  choice: para o espaço livre / o espaço livre
  rationale: O particípio substantivado de נוח indica aqui a área deixada desocupada ao redor da estrutura, e não um lugar de repouso em sentido devocional.
- source_word: דֶּרֶךְ הַצָּפוֹן / לַדָּרוֹם
  choice: voltada para o norte / voltada para o sul
  rationale: A formulação comunica de modo idiomático a orientação espacial e preserva o paralelismo das duas entradas.
- source_word: רֹחַב
  choice: largura
  rationale: É o termo arquitetônico português corrente para a dimensão medida.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: Mantém a unidade antiga tradicionalmente usada nas traduções bíblicas e apropriada às medidas do templo.
- source_word: סָבִיב סָבִיב
  choice: em toda a volta
  rationale: A expressão transmite a ideia intensificada de extensão por todo o contorno, em português natural.
