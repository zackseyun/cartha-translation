  text: And the nave and the sanctuary each had two doors[a].
translation:
  language: pt
  text: Tanto o salão principal como o santuário tinham duas portas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁתַּיִם
  choice: duas
  rationale: O numeral cardinal feminino concorda com o substantivo feminino plural דְּלָתוֹת; a tradução simples e natural é «duas».
- source_word: דְּלָתוֹת
  choice: portas
  rationale: O plural designa portas. «Folhas de porta» ou «portas duplas» acrescentariam uma precisão interpretativa que o termo, por si só, não exige.
- source_word: הֵיכָל
  choice: salão principal
  rationale: No contexto da visão do templo, refere-se ao recinto principal do edifício, distinto do santuário interior. «Salão principal» é claro e corrente em português, sem recorrer ao termo arquitetônico menos acessível «nave».
- source_word: קֹּדֶשׁ
  choice: santuário
  rationale: Aqui designa o recinto sagrado contrastado com o salão principal. «Santuário» preserva o sentido sacro sem impor uma designação técnica mais específica.
- source_word: לַ/הֵיכָל וְ/לַ/קֹּדֶשׁ
  choice: Tanto o salão principal como o santuário tinham
  rationale: 'A frase hebraica não contém verbo expresso: literalmente, «e duas portas para o salão e para o santuário». A construção portuguesa explicita naturalmente a relação distributiva, indicando duas portas para cada recinto.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação «tanto... como...» comunica sem ambiguidade que cada um dos dois recintos tinha duas portas.
