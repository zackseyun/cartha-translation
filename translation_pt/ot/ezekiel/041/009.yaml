  text: The width of the wall that belonged to the side chambers on the outside was five cubits[a], and the open area between the side chambers of the house.
translation:
  language: pt
  text: A largura da parede externa das câmaras laterais era de cinco côvados; e havia um espaço livre destinado ao conjunto de câmaras laterais do templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da frase final é difícil. Também pode ser entendido como: “e o que fora deixado livre era o conjunto de câmaras laterais pertencente ao templo”, ou de modo semelhante. O versículo descreve a disposição das estruturas ao redor do edifício do templo.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹחַב הַקִּיר
  choice: a largura da parede
  rationale: Mantém a terminologia arquitetônica direta do hebraico e soa natural em português.
- source_word: אֲשֶׁר לַצֵּלָע
  choice: das câmaras laterais
  rationale: Neste contexto do templo, צֵלָע designa as dependências ou câmaras laterais; o singular hebraico tem sentido coletivo.
- source_word: אֶל הַחוּץ
  choice: do lado de fora
  rationale: Expressa de modo idiomático a localização ou orientação exterior da parede.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: Preserva a unidade de medida antiga usada na visão arquitetônica.
- source_word: וַאֲשֶׁר מֻנָּח
  choice: e havia um espaço livre
  rationale: O particípio indica algo deixado ou mantido livre; a formulação explicita o provável sentido espacial sem apresentar como certa uma reconstrução mais específica.
- source_word: בֵּית צְלָעוֹת
  choice: junto ao conjunto de câmaras laterais
  rationale: בֵּית pode indicar aqui a estrutura ou o conjunto das câmaras. A relação sintática com o espaço deixado livre é difícil; 'junto ao' oferece uma leitura arquitetônica natural sem acrescentar a ideia não expressa de 'entre'.
- source_word: אֲשֶׁר לַבָּיִת
  choice: do templo
  rationale: Embora בַּיִת signifique literalmente 'casa', neste contexto refere-se inequivocamente ao edifício do templo; 'templo' evita ambiguidade para o leitor moderno.
