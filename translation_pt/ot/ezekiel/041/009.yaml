- from: A largura da parede das câmaras laterais, do lado de fora, era de cinco côvados; e havia um espaço livre junto ao conjunto de câmaras laterais do templo.[a]
  to: A largura da parede externa das câmaras laterais era de cinco côvados; e havia um espaço livre destinado ao conjunto de câmaras laterais do templo.[a]
