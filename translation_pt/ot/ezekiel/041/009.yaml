  naturalness: O português é claro e de registro apropriado. «Parede externa das câmaras laterais» é mais direto e menos ambíguo do que «parede das câmaras laterais, do lado de fora». A reformulação da segunda cláusula permanece natural sem especificar indevidamente a relação espacial.
  terminology: «Câmaras laterais», «templo» e «côvados» são escolhas adequadas para o contexto arquitetônico. Mantém-se «espaço livre», com nota para a dificuldade do hebraico.
