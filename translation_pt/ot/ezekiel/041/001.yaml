base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/001.yaml
  text: 'Then he brought me into the nave and measured the jambs: six cubits wide on one side and six cubits wide on the other side—the width of the tent[a][b].'
translation:
  language: pt
  text: 'Então ele me levou ao salão principal[a] e mediu as ombreiras: seis côvados de largura de um lado e seis côvados de largura do outro — a largura da tenda[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuário”. O hebraico se refere ao recinto principal do edifício do templo, não a todo o complexo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “tenda”. Neste contexto da visão do templo, alguns entendem a palavra como uma designação arquitetônica técnica e traduzem “tabernáculo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  choice: salão principal
  rationale: No contexto da visão do templo, designa o recinto principal do edifício, distinto do santuário interior. “Salão principal” é claro em português atual e não sugere todo o complexo do templo.
- source_word: אֵילִים
  choice: ombreiras
  rationale: Neste contexto arquitetônico, refere-se aos elementos laterais estruturais da entrada. “Ombreiras” evita a ideia de colunas independentes.
- source_word: אַמּוֹת
  choice: côvados
  rationale: Mantém a unidade antiga de medida do texto-fonte, sem uma conversão moderna necessariamente aproximada.
- source_word: רֹחַב
  choice: largura / de largura
  rationale: Reproduz naturalmente tanto as medidas repetidas quanto a expressão nominal conclusiva.
- source_word: מִפּוֹ ... מִפּוֹ
  choice: de um lado ... do outro
  rationale: Expressa em português corrente os dois lados correspondentes da entrada.
- source_word: אֹהֶל
  choice: tenda
  rationale: Preserva o sentido lexical direto do hebraico, embora no contexto da visão possa funcionar como designação arquitetônica ou remeter ao tabernáculo.
- source_word: וַיְבִיאֵנִי
  choice: Então ele me levou
  rationale: O “Então” comunica a progressão narrativa do waw consecutivo; “levou” é natural para a entrada em um recinto.
- source_word: וַיָּמָד
  choice: mediu
  rationale: Tradução direta da ação de medir na visão.
theological_decisions:
- issue: Sentido de אֹהֶל no edifício visionário
  choice: Manter “tenda” no texto
  alternative: “tabernáculo” ou uma designação arquitetônica técnica
  rationale: A forma hebraica significa literalmente “tenda”; a tradução não deve eliminar a tensão entre essa palavra e o contexto de um templo construído.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega “salão principal” em vez de um tecnicismo pouco comum e conserva “côvados” e “tenda” para manter os traços históricos e a ambiguidade do hebraico.
