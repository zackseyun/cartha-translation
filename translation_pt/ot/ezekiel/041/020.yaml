  text: מֵ/הָ/אָ֨רֶץ֙ עַד מֵ/עַ֣ל הַ/פֶּ֔תַח הַ/כְּרוּבִ֥ים וְ/הַ/תִּֽמֹרִ֖ים עֲשׂוּיִ֑ם וְ/קִ֖יר הַׄ/הֵׄיׄכָֽׄלׄ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/020.yaml
  text: From the floor to above the entrance[a], cherubim and palm trees were made[b], and on the wall of the nave.
translation:
  language: pt
  text: Desde o chão[a] até acima da entrada, foram feitos querubins e palmeiras, também na parede do salão principal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde o solo” ou, mais literalmente, “desde a terra”; neste contexto arquitetônico, a ideia é o nível do chão.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico hêkhal provavelmente designa aqui o salão principal do templo, e não todo o complexo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָאָרֶץ
  choice: Desde o chão
  rationale: Embora אֶרֶץ geralmente signifique “terra” ou “solo”, no contexto arquitetônico indica o nível inferior do recinto; “chão” comunica naturalmente esse sentido sem ocultar a leitura mais literal, registrada em nota.
- source_word: עַד מֵעַל הַפֶּתַח
  choice: até acima da entrada
  rationale: Expressa a extensão vertical da ornamentação. “Entrada” é corrente e adequada ao referente arquitetônico, embora “porta” ou “vão da porta” também sejam possíveis.
- source_word: הַכְּרוּבִים
  choice: querubins
  rationale: Mantém o termo bíblico tradicional para esses seres associados à presença e ao trono divinos, sem sugerir os “anjinhos” da arte popular.
- source_word: וְהַתִּמֹרִים
  choice: e palmeiras
  rationale: Traduz diretamente as formas de palmeira representadas na decoração; o contexto deixa claro que se trata de motivos ornamentais.
- source_word: עֲשׂוּיִם
  choice: foram feitos
  rationale: Conserva a amplitude do particípio passivo hebraico. “Foram esculpidos” seria plausível no contexto, mas acrescentaria uma técnica específica não expressa nesta oração.
- source_word: וְקִיר הַהֵיכָל
  choice: também na parede do salão principal
  rationale: O hebraico apresenta uma expressão final coordenada e sem verbo explícito. “Também na” torna a relação sintática compreensível em português, enquanto “salão principal” distingue o הֵיכָל do complexo inteiro do templo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe ligeiramente completada para tornar inteligível a frase hebraica elíptica. Preservou-se a generalidade de “foram feitos” e registraram-se em notas as principais alternativas lexicais.
