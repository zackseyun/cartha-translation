base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/017.yaml
  text: Above the doorway[a], and as far as the inner house, and outside, and on all the wall all around, in the inner part and in the outer part[b], were measurements.
translation:
  language: pt
  text: Acima da entrada, até o templo interno[a], e do lado de fora, em toda a parede ao redor, tanto no interior como no exterior, havia medidas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a casa interior”. Nesta visão, “casa” frequentemente se refere ao edifício do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “dimensões”. O termo hebraico pode indicar medidas ou especificações dimensionais em um contexto arquitetônico.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל הַפֶּתַח
  choice: Acima da entrada
  rationale: Expressa a área situada sobre a abertura de acesso; “entrada” é natural em português e mantém o sentido arquitetônico.
- source_word: וְעַד הַבַּיִת הַפְּנִימִי
  choice: até a parte interna do templo
  rationale: No contexto da visão, בַּיִת designa o edifício do templo. A formulação portuguesa evita a expressão pouco natural “casa interior”, sem reduzir o referente a um cômodo específico.
- source_word: וְלַחוּץ
  choice: e do lado de fora
  rationale: Mantém o contraste espacial entre o exterior e a parte interna em português corrente.
- source_word: וְאֶל כָּל הַקִּיר סָבִיב סָבִיב
  choice: em toda a parede ao redor
  rationale: “Em” indica a relação com a superfície da parede, e “ao redor” comunica a ideia enfática de abrangência circundante da repetição סָבִיב סָבִיב.
- source_word: בַּפְּנִימִי וּבַחִיצוֹן
  choice: tanto na parte interna como na externa
  rationale: Os adjetivos substantivados distinguem as zonas interior e exterior; a construção correlativa é clara e natural em português.
- source_word: מִדּוֹת
  choice: havia medidas
  rationale: O substantivo plural pode indicar medidas ou dimensões. O verbo “havia” explicita de modo mínimo a oração elíptica do hebraico.
