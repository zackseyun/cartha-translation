  text: וְ/רָאִ֧יתִי לַ/בַּ֛יִת גֹּ֖בַהּ סָבִ֣יב סָבִ֑יב מיסדות הַ/צְּלָעוֹת֙ מְל֣וֹ הַ/קָּנֶ֔ה שֵׁ֥שׁ אַמּ֖וֹת אַצִּֽילָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/008.yaml
  text: And I saw that the house had a raised platform all around[a]; the foundations of the side chambers were a full reed of six cubits to the offset.
translation:
  language: pt
  text: Vi que o templo tinha uma base elevada em toda a volta[a]; os alicerces das câmaras laterais tinham a altura de uma cana inteira, isto é, seis côvados, até o ressalto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “havia altura para o templo em toda a volta”. A expressão parece indicar que o edifício estava sobre uma base elevada.
    reason: Esclarece a tradução contextual de גֹּבַהּ e preserva sua forma mais literal.
  - marker: b
    text: Ou “até o ponto de junção”, “até a saliência” ou, possivelmente, “na base”. O termo hebraico é arquitetonicamente obscuro.
    reason: Registra a incerteza lexical de אַצִּילָה e suas principais alternativas contextuais.
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Vi
  rationale: Forma narrativa na primeira pessoa do singular de ראה; o português dispensa a conjunção inicial para manter fluidez sem perder a sequência do relato.
- source_word: לַבַּיִת
  choice: o templo
  rationale: Embora בַּיִת signifique literalmente “casa”, neste contexto designa o edifício principal do templo; “templo” é claro e natural para o leitor moderno.
- source_word: גֹּבַהּ
  choice: tinha uma base elevada
  rationale: O substantivo denota altura ou elevação. No contexto arquitetônico, a elevação circundante é entendida como a base elevada do edifício; a formulação comunica essa relação sem especificar uma reconstrução mais detalhada.
- source_word: סָבִיב סָבִיב
  choice: em toda a volta
  rationale: A repetição intensifica a ideia de algo que circunda inteiramente o edifício; esta expressão a reproduz em português natural.
- source_word: מיסדות
  choice: os alicerces
  rationale: O termo plural designa as fundações ou estruturas de sustentação; “alicerces” é corrente e arquitetonicamente adequado.
- source_word: הַצְּלָעוֹת
  choice: das câmaras laterais
  rationale: No contexto da arquitetura do templo, צלעות se refere às estruturas ou câmaras anexas aos lados do edifício.
- source_word: מְלֹא הַקָּנֶה
  choice: uma cana inteira
  rationale: מְלֹא indica a medida completa, e קָנֶה é a cana de medir; a extensão é especificada em seguida.
- source_word: שֵׁשׁ אַמּוֹת
  choice: isto é, seis côvados
  rationale: A expressão esclarece em aposição o comprimento da cana; “isto é” torna explícita essa relação no português.
- source_word: אַצִּילָה
  choice: até o ressalto
  rationale: Termo arquitetônico raro e obscuro, possivelmente referente a um ressalto, ponto de junção ou base. “Ressalto” se ajusta ao contexto sem pretender certeza indevida; a incerteza é preservada em nota.
