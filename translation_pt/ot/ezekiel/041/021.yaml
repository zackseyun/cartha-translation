lexical_decisions:
- source_word: הֵיכָל
  choice: salão principal
  rationale: No contexto da visão do templo, designa o recinto principal diante do santuário interior, não todo o complexo. “Salão principal” é claro e arquitetonicamente apropriado.
- source_word: מְזוּזַת
  choice: moldura de porta
  rationale: O termo pode indicar a ombreira ou, por extensão neste contexto, a estrutura da porta. A forma quadrada descrita pelo adjetivo torna “moldura de porta” uma expressão natural em português.
- source_word: רְבֻעָה
  choice: quadrada
  rationale: Indica uma forma quadrada ou de quatro lados; “quadrada” é a expressão arquitetônica mais direta.
- source_word: וּפְנֵי
  choice: e a frente de
  rationale: Embora פָּנִים signifique literalmente “face”, em contexto arquitetônico refere-se à parte frontal ou fachada visível.
- source_word: הַקֹּדֶשׁ
  choice: o santuário
  rationale: Neste contexto, refere-se ao recinto santo; “santuário” preserva de modo claro o sentido sagrado e arquitetônico.
- source_word: הַמַּרְאֶה כַּמַּרְאֶה
  choice: tinha aparência semelhante
  rationale: O hebraico traz uma construção elíptica e repetitiva, literalmente “a aparência como a aparência”. A tradução preserva a comparação sem tentar especificar além do que o texto diz.
