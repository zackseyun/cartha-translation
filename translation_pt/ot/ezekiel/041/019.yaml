  text: with a human face toward the palm tree on one side[a], and a young lion’s face toward the palm tree on the other side. They were made all around the whole temple.
translation:
  language: pt
  text: com um rosto humano voltado para a palmeira de um lado[a] e um rosto de leão jovem voltado para a palmeira do outro lado. Esse trabalho foi feito ao redor de todo o templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rosto de um homem […] o rosto de um leão jovem”.'
    reason: Registra uma tradução mais literal das duas construções com פְנֵי e a alternativa lexical “homem” para אָדָם.
lexical_decisions:
- source_word: פְנֵי אָדָם
  choice: um rosto humano
  rationale: A expressão construta significa literalmente “rosto de humano/homem”. No contexto das figuras esculpidas, “rosto humano” expressa naturalmente o contraste com o rosto de leão sem sugerir um indivíduo específico.
- source_word: הַתִּמֹרָה
  choice: a palmeira
  rationale: Refere-se ao motivo ornamental de palmeira descrito nos versículos próximos; “palmeira” é direto e claro em português.
- source_word: מִפּוֹ
  choice: de um lado / do outro lado
  rationale: A repetição indica os lados opostos da palmeira. A formulação idiomática em português explicita essa relação espacial.
- source_word: פְנֵי כְפִיר
  choice: um rosto de leão novo
  rationale: כְּפִיר designa um leão jovem. “Leão novo” conserva essa nuance e evita a ideia possivelmente infantil de “filhote”.
- source_word: עָשׂוּי
  choice: Esse trabalho foi feito
  rationale: O particípio passivo está no singular e provavelmente resume coletivamente o trabalho ornamental. O demonstrativo torna claro o referente sem converter o singular hebraico em plural.
- source_word: אֶל כָּל הַבַּיִת
  choice: todo o templo
  rationale: Neste contexto visionário, בַּיִת designa o edifício do templo; “templo” comunica claramente o referente.
- source_word: סָבִיב סָבִיב
  choice: ao redor
  rationale: A expressão duplicada indica extensão circundante. Com “todo o templo”, “ao redor” transmite o sentido de maneira natural e sem redundância excessiva.
theological_decisions:
- issue: Sentido de אָדָם na representação ornamental
  choice: humano
  alternative: homem
  rationale: Aqui אָדָם identifica a espécie do rosto esculpido em contraste com o leão, não necessariamente o sexo de uma pessoa específica. “Humano” preserva essa função contextual sem eliminar uma distinção relevante.
- issue: Número do referente de עָשׂוּי
  choice: 'singular coletivo: “Esse trabalho foi feito”'
  alternative: 'plural: “Eles foram feitos”'
  rationale: A forma hebraica é singular masculina. A tradução mantém esse número e entende o referente como o conjunto do trabalho ornamental, evitando impor um antecedente plural não expresso.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção inicia em continuação sintática do versículo anterior, como no texto-fonte.
