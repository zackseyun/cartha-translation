base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/013.yaml
  text: 'Then he measured the temple: its length was a hundred cubits; and the separate area[a], the building, and its walls had a length of a hundred cubits.'
translation:
  language: pt
  text: 'Então ele mediu o templo: seu comprimento era de cem côvados; e a área separada[a], o edifício e suas paredes tinham cem côvados de comprimento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lugar separado”. O termo hebraico se refere a uma área distinta, reservada no complexo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: Então ele mediu
  rationale: O waw dá continuidade à sequência narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: הַבַּיִת
  choice: o templo
  rationale: No contexto da visão de Ezequiel, o termo designa o edifício do templo, não uma casa comum.
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: seu comprimento era de cem côvados
  rationale: Reproduz claramente a expressão hebraica de medida e conserva a unidade antiga.
- source_word: הַגִּזְרָה
  choice: a área separada
  rationale: Designa uma área distinta e reservada no complexo do templo, sem especificar além do que o hebraico permite.
- source_word: הַבִּנְיָה
  choice: o edifício
  rationale: Equivalente corrente e digno para a estrutura construída no contexto arquitetônico.
- source_word: קִירוֹתֶיהָ
  choice: suas paredes
  rationale: Mantém o plural e o sufixo feminino do hebraico; no contexto, o referente exato pode abranger a área ou estrutura anteriormente mencionada.
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: tinham cem côvados de comprimento
  rationale: Expressa naturalmente em português o predicado de medida repetido para o conjunto coordenado.
