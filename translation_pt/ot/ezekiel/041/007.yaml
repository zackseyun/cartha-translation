  to: As câmaras laterais se alargavam à medida que subiam e contornavam o templo[a], pois a estrutura em torno do templo se elevava cada vez mais, em toda a volta dele[b]. Por isso, o templo tinha maior largura nos níveis superiores; assim, subia-se do andar inferior ao superior, passando pelo andar do meio[c].
