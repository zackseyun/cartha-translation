base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/007.yaml
  text: And the side chambers became wider as they went around upward and upward[a], because the structure of the temple went around upward and upward all around the temple. Therefore the width of the temple increased upward[c][b], and so one went up from the lowest story to the highest by way of the middle story.
translation:
  language: pt
  text: As câmaras laterais se alargavam à medida que subiam e contornavam o templo[a], pois a estrutura em torno do templo se elevava cada vez mais, em toda a volta dele[b]. Por isso, o templo tinha maior largura nos níveis superiores; assim, subia-se do andar inferior ao superior, passando pelo andar do meio[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os compartimentos laterais”. O termo hebraico pode designar câmaras ou estruturas laterais anexas ao edifício principal.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é arquitetonicamente difícil. Pode referir-se a uma saliência, galeria, faixa ou recuo que circundava o templo.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico é condensado e sintaticamente difícil: menciona os níveis inferior, superior e intermediário. O sentido provável é que se subia do nível inferior ao superior passando pelo nível intermediário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲבָה
  choice: ficavam mais largas
  rationale: Expressa o valor resultativo/gradual de רחב e concorda naturalmente em português com o referente plural entendido, as câmaras laterais.
- source_word: וְנָסְבָה ... לְמַעְלָה לְמַעְלָה
  choice: à medida que subiam e contornavam o templo
  rationale: Conserva tanto o movimento ascendente progressivo quanto a ideia de circundar, evitando uma repetição pouco natural em português.
- source_word: לַצְּלָעוֹת
  choice: as câmaras laterais
  rationale: No contexto arquitetônico do templo, צלעות designa compartimentos ou estruturas laterais anexos ao edifício principal.
- source_word: כִּי מוּסַב הַבַּיִת
  choice: pois a estrutura do templo seguia ao redor
  rationale: Mantém deliberadamente genérica a difícil expressão arquitetônica ligada a סבב, sem defini-la como saliência, galeria ou recuo.
- source_word: לְמַעְלָה לְמַעְלָה ... סָבִיב סָבִיב
  choice: subindo cada vez mais, por todo o templo
  rationale: Reproduz a força intensiva e progressiva das repetições hebraicas em português natural.
- source_word: עַל כֵּן רֹחַב לַבַּיִת לְמָעְלָה
  choice: Por isso, a largura do templo aumentava nos níveis superiores
  rationale: 'Torna explícito o sentido elíptico da frase: havia maior largura à medida que a construção subia.'
- source_word: וְכֵן הַתַּחְתּוֹנָה יַעֲלֶה עַל הָעֶלְיוֹנָה לַתִּיכוֹנָה
  choice: assim, subia-se do andar inferior ao superior passando pelo andar do meio
  rationale: A construção impessoal evita impor um sujeito ausente no hebraico e comunica a progressão entre os três níveis.
- source_word: הַבַּיִת
  choice: o templo
  rationale: No contexto da visão de Ezequiel, 'templo' identifica com clareza o edifício referido por 'casa'.
