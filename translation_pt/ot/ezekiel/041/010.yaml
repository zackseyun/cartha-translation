  text: And between the chambers was a width of twenty cubits all around the temple[a], all around.
translation:
  language: pt
  text: E entre as câmaras havia uma largura de vinte côvados ao redor do templo[a], por toda a volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete três vezes o termo traduzido por “ao redor”, para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: E entre
  rationale: Preserva tanto a conjunção que liga o versículo ao contexto quanto a relação espacial expressa pela preposição.
- source_word: הַלְּשָׁכוֹת
  choice: as câmaras
  rationale: O termo designa compartimentos ou salas no conjunto do templo; “câmaras” mantém a correspondência lexical sem especificar além do hebraico.
- source_word: רֹחַב
  choice: uma largura
  rationale: Traduz diretamente a ideia de largura numa oração nominal, suprindo “havia” para produzir português natural.
- source_word: עֶשְׂרִים אַמָּה
  choice: vinte côvados
  rationale: Mantém a unidade antiga do texto-fonte, como é convencional em traduções bíblicas.
- source_word: סָבִיב לַבַּיִת
  choice: ao redor do templo
  rationale: “Templo” comunica naturalmente o referente de בַּיִת nesta visão arquitetônica, e “ao redor” expressa a extensão circundante.
- source_word: סָבִיב סָבִיב
  choice: ao redor por todos os lados
  rationale: Conserva no corpo do texto a ênfase da repetição, evitando uma sequência pouco natural de três ocorrências idênticas em português.
