base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/014.yaml
  text: And the width of the front of the temple and of the separate area toward the east was a hundred cubits[a][b][c].
translation:
  language: pt
  text: A largura da frente do templo e da área separada, para o leste, era de cem côvados[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “casa”; neste contexto da visão do templo, refere-se ao edifício do templo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em direção ao leste” ou “no lado leste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: largura
  rationale: O substantivo indica uma medida horizontal; “largura” é a forma natural em português no contexto arquitetônico.
- source_word: פְּנֵי
  choice: frente de
  rationale: Embora signifique literalmente “face de”, no uso espacial e arquitetônico designa a parte frontal.
- source_word: הַבַּיִת
  choice: templo
  rationale: No contexto da visão de Ezequiel, “a casa” designa o edifício do templo; “templo” torna o referente claro.
- source_word: הַגִּזְרָה
  choice: área separada
  rationale: O termo designa a área distinta e separada junto ao complexo do templo; a tradução preserva essa ideia sem especificar uma função não declarada.
- source_word: לַקָּדִים
  choice: no lado leste
  rationale: A expressão indica a orientação oriental da frente medida. A nota preserva a possibilidade de uma formulação mais estritamente direcional.
- source_word: מֵאָה אַמָּה
  choice: cem côvados
  rationale: Preserva diretamente a medida antiga e usa a formulação portuguesa corrente.
