  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשׂ֥וּי כְּרוּבִ֖ים וְ/תִֽמֹרִ֑ים וְ/תִֽמֹרָה֙ בֵּין כְּר֣וּב לִ/כְר֔וּב וּ/שְׁנַ֥יִם פָּנִ֖ים לַ/כְּרֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/018.yaml
  text: Cherubim and palm trees were made on it[a], with a palm tree between cherub and cherub; and each cherub had two faces.
translation:
  language: pt
  text: Nela foram feitos[a] querubins e palmeiras, com uma palmeira entre um querubim e outro; cada querubim tinha dois rostos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram esculpidos”; o hebraico diz literalmente “feitos”, mas, neste contexto arquitetônico, provavelmente se refere a figuras trabalhadas ou entalhadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּי
  choice: foram feitos nela
  rationale: O particípio passivo de עשה significa literalmente algo feito ou trabalhado. O plural concorda naturalmente em português com os elementos decorativos que seguem; “nela” é suprido pelo contexto arquitetônico.
- source_word: כְּרוּבִים
  choice: querubins
  rationale: Forma tradicional e amplamente reconhecida em português para o plural de querubim, adequada ao registro arquitetônico e visionário.
- source_word: וְתִמֹרִים
  choice: e palmeiras
  rationale: Neste contexto, designa motivos ornamentais em forma de palmeira; “palmeiras” é claro e natural, sem explicar em excesso.
- source_word: וְתִמֹרָה
  choice: uma palmeira
  rationale: 'Mantém o singular distributivo: havia uma palmeira entre cada querubim e o seguinte.'
- source_word: בֵּין כְּרוּב לִכְרוּב
  choice: entre um querubim e outro
  rationale: Expressa com naturalidade em português a construção distributiva hebraica, sem alterar seu sentido.
- source_word: וּשְׁנַיִם פָּנִים לַכְּרוּב
  choice: cada querubim tinha dois rostos
  rationale: É uma tradução idiomática do literal “e dois rostos para o querubim”; o valor distributivo, confirmado pelo contexto imediato, aplica a descrição a cada figura.
theological_decisions:
- issue: Natureza das imagens de querubins na decoração do templo
  choice: Apresentar os querubins e as palmeiras como elementos decorativos concretos, sem interpretação alegórica.
  alternative: Acrescentar uma interpretação simbólica ou tipológica das imagens.
  rationale: O versículo descreve a ornamentação arquitetônica e não explicita seu simbolismo; a tradução não deve importar uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Rostos” foi preferido a “faces” por ser mais corrente, sem perda de precisão. A redação preserva o caráter descritivo e a provável referência à superfície mencionada no contexto.
