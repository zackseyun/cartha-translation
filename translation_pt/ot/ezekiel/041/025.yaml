base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/025.yaml
  text: And cherubim and palm trees were made on them[a], on the doors of the nave, just as they were made on the walls[c][b]; and there was a wooden canopy before the front of the vestibule outside.
translation:
  language: pt
  text: Nelas[a], isto é, nas portas do salão do templo[b], foram feitos querubins e palmeiras, como os que foram feitos nas paredes. Havia também uma saliência de madeira[c] na frente do pórtico, do lado de fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «foram entalhados nelas». O verbo hebraico significa literalmente «foram feitos», mas o contexto descreve a decoração do templo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «as portas do santuário». O termo hebraico refere-se aqui ao salão principal do edifício do templo.'
    reason: lexical_alternative
  - marker: c
    text: O termo arquitetônico hebraico é incerto; pode indicar uma projeção, cobertura ou estrutura semelhante de madeira na frente do pórtico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשׂוּיָה אֲלֵיהֶן
  choice: Nelas ... foram feitos
  rationale: Mantém o verbo amplo עשה em construção passiva e explicita naturalmente em português que o referente são as portas; o contexto permite, mas não exige, o sentido mais específico de entalhar.
- source_word: דַּלְתוֹת הַהֵיכָל
  choice: as portas do salão do templo
  rationale: הֵיכָל designa aqui o salão principal do edifício do templo. A expressão é clara para leitores comuns e evita o tecnicismo potencialmente ambíguo «nave».
- source_word: כְּרוּבִים
  choice: querubins
  rationale: Emprega a forma portuguesa tradicional para os seres representados na decoração do templo.
- source_word: וְתִמֹרִים
  choice: e palmeiras
  rationale: Traduz diretamente as figuras de palmeiras; o contexto arquitetônico deixa claro que se trata de decoração.
- source_word: כַּאֲשֶׁר עֲשׂוּיִם לַקִּירוֹת
  choice: como os que haviam sido feitos nas paredes
  rationale: Preserva a comparação explícita e relaciona os motivos das portas aos já descritos nas paredes.
- source_word: וְעָב עֵץ
  choice: uma saliência de madeira
  rationale: עָב é um termo arquitetônico incerto. «Saliência» comunica uma estrutura projetada de madeira sem defini-la indevidamente como cobertura, viga ou soleira.
- source_word: אֶל פְּנֵי הָאוּלָם
  choice: diante da fachada do pórtico
  rationale: Representa a relação espacial de אֶל־פְּנֵי e entende אוּלָם como o pórtico ou vestíbulo diante do salão principal.
- source_word: מֵהַחוּץ
  choice: do lado de fora
  rationale: Indica com naturalidade que a estrutura ficava na parte exterior.
