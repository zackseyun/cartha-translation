  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente reorganizada para tornar inequívoco o referente feminino plural de אֲלֵיהֶן. «Salão do templo» e «pórtico» favorecem clareza arquitetônica; a incerteza de עָב foi preservada no texto e explicada em nota.
