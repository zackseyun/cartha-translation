base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/016.yaml
  text: the thresholds[a], the recessed windows, and the galleries all around on their three sides, opposite the threshold, were paneled with wood all around, from the floor up to the windows[c][b]; and the windows were covered.
translation:
  language: pt
  text: Os umbrais, as janelas de vão estreito[a] e as galerias[b], ao redor, pelos três lados[c], em frente ao umbral, eram revestidos de madeira[d] por toda parte, desde o piso até as janelas; e as janelas estavam cobertas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “janelas fechadas” ou “vedadas”. A expressão talvez designe um tipo arquitetônico fixo, como janelas estreitas, recuadas, gradeadas ou providas de postigos, e não apenas janelas fechadas naquele momento.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é raro e também pode indicar saliências, colunatas ou passagens elevadas.
    reason: lexical_alternative
  - marker: c
    text: O hebraico é conciso e pode ser entendido como “ao redor dos três” ou como referência a três níveis, em vez de três lados.
    reason: textual_ambiguity
  - marker: d
    text: A expressão hebraica é rara e pode ser traduzida como “uma cobertura de madeira”, “lambris de madeira” ou “revestimento de madeira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים / הַסַּף
  choice: os umbrais / o umbral
  rationale: סַף pode indicar o limiar, a soleira ou outra parte estrutural da entrada. “Umbral” mantém a referência arquitetônica concreta e permite a repetição do termo no plural e no singular.
- source_word: הַחַלּוֹנִים הָאֲטֻמוֹת
  choice: as janelas de vão estreito
  rationale: אֲטֻמוֹת sugere literalmente algo fechado ou vedado, mas, nesta descrição arquitetônica, provavelmente caracteriza um tipo fixo de janela. “De vão estreito” comunica essa função sem sugerir apenas que as janelas estavam temporariamente fechadas; a incerteza é registrada em nota.
- source_word: הָאַתִּיקִים
  choice: as galerias
  rationale: אַתִּיקִים é um termo arquitetônico raro. “Galerias” se ajusta ao contexto e permanece suficientemente amplo, enquanto outras possibilidades são preservadas em nota.
- source_word: סָבִיב לִשְׁלָשְׁתָּם
  choice: em volta, pelos seus três lados
  rationale: A expressão indica uma disposição ao redor relacionada a três partes ou lados. A tradução adota a leitura espacial mais provável, sem esconder em nota a ambiguidade da formulação hebraica.
- source_word: נֶגֶד הַסַּף
  choice: diante do umbral
  rationale: נֶגֶד expressa posição em frente ou defronte de algo. “Diante do umbral” é natural no contexto arquitetônico e não exige uma geometria mais precisa do que o hebraico fornece.
- source_word: שְׂחִיף עֵץ
  choice: eram revestidos de madeira
  rationale: שְׂחִיף é raro e provavelmente designa cobertura, lâmina ou revestimento. A formulação verbal produz português natural e comunica a provável presença de painéis ou cobertura de madeira.
- source_word: וְהָאָרֶץ עַד הַחַלּוֹנוֹת
  choice: desde o piso até as janelas
  rationale: Embora אֶרֶץ normalmente signifique terra ou chão, aqui o contexto interno favorece “piso”. A construção portuguesa explicita com naturalidade a extensão vertical do revestimento.
- source_word: וְהַחַלּוֹנוֹת מְכֻסּוֹת
  choice: e as janelas estavam cobertas
  rationale: מְכֻסּוֹת significa “cobertas”. Como o texto não especifica a natureza da cobertura, a tradução mantém a expressão simples e aberta.
