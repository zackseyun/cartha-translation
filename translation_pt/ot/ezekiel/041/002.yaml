base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/002.yaml
  text: 'And the width of the entrance was ten cubits[a], and the sidewalls of the entrance were five cubits on this side and five cubits on that side. Then he measured its length: forty cubits, and the width: twenty cubits.'
translation:
  language: pt
  text: 'A largura da entrada era de dez côvados, e as laterais da entrada[a] tinham cinco côvados de um lado e cinco côvados do outro. Então ele mediu o comprimento do recinto: quarenta côvados, e a largura: vinte côvados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os ombros da entrada”; isto é, as seções laterais que ladeavam a entrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: largura
  rationale: Termo arquitetônico natural em português para a dimensão medida.
- source_word: הַפֶּתַח
  choice: a entrada
  rationale: Designa a abertura arquitetônica; “entrada” é clara e não sugere apenas a porta física.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dez côvados
  rationale: Conserva a unidade de medida antiga e acompanha de perto o hebraico.
- source_word: כִתְפוֹת
  choice: as laterais
  rationale: O sentido literal é “ombros”, mas aqui se refere às seções que ladeavam a entrada; “laterais” comunica isso sem impor uma identificação arquitetônica excessivamente específica.
- source_word: מִפּוֹ ... מִפּוֹ
  choice: de um lado ... do outro
  rationale: Expressão distributiva natural em português que preserva a disposição bilateral.
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: Expressa com naturalidade o avanço da sequência narrativa marcado pelo waw consecutivo.
- source_word: אָרְכּוֹ
  choice: o comprimento do recinto
  rationale: O sufixo remete ao espaço interior em discussão; explicitar “do recinto” evita um pronome de referência pouco clara em português.
- source_word: אַרְבָּעִים אַמָּה
  choice: quarenta côvados
  rationale: Tradução direta da medida hebraica.
- source_word: וְרֹחַב עֶשְׂרִים אַמָּה
  choice: 'e a largura: vinte côvados'
  rationale: Mantém a formulação elíptica e concisa do registro de medidas, com pontuação clara em português.
