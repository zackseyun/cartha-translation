  text: 'And the doors had two leaves each[a], two turning leaves: two leaves for the one door and two leaves for the other.'
translation:
  language: pt
  text: 'E as portas tinham duas folhas cada uma, duas folhas que se voltavam[a]: duas folhas para uma porta e duas folhas para a outra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “duas folhas pivotantes” ou “duas folhas dobráveis”. O termo hebraico indica folhas que se voltavam, mas não especifica exatamente o mecanismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּלָתוֹת / דֶּלֶת
  choice: portas / porta / folhas
  rationale: O substantivo pode designar tanto a porta como um todo quanto cada folha ou painel móvel. A distinção contextual entre as duas portas e seus componentes favorece “portas” para as estruturas completas e “folhas” para as partes móveis.
- source_word: מוּסַבּוֹת
  choice: giratórias
  rationale: O termo indica que as folhas podiam virar ou girar, sem definir se o mecanismo era pivotante, dobrável ou simplesmente de abrir. “Giratórias” conserva essa amplitude.
- source_word: שְׁתַּיִם ... שְׁתַּיִם ... שְׁתַּיִם ... וּשְׁתֵּי
  choice: duas ... duas ... duas ... duas
  rationale: A repetição dos numerais foi mantida para reproduzir o estilo arquitetônico e a ênfase do hebraico na disposição em pares.
- source_word: לַדְּלָתוֹת
  choice: as portas tinham
  rationale: A preposição ל é expressa idiomaticamente como posse ou característica, evitando o pouco natural “para as portas”.
- source_word: לְדֶלֶת אֶחָת ... לָאַחֶרֶת
  choice: para uma porta ... para a outra
  rationale: A formulação distribui duas folhas a cada uma das duas portas mencionadas, preservando a estrutura contrastiva “uma ... a outra”.
