  text: הַ/מִּזְבֵּ֡חַ עֵ֣ץ שָׁלוֹשׁ֩ אַמּ֨וֹת גָּבֹ֜הַּ וְ/אָרְכּ֣/וֹ שְׁתַּֽיִם אַמּ֗וֹת וּ/מִקְצֹֽעוֹתָי/ו֙ ל֔/וֹ וְ/אָרְכּ֥/וֹ וְ/קִֽירֹתָ֖י/ו עֵ֑ץ וַ/יְדַבֵּ֣ר אֵלַ֔/י זֶ֚ה הַ/שֻּׁלְחָ֔ן אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/022.yaml
  text: The altar was of wood[a], three cubits high and two cubits long; its corners, its length, and its sides were of wood. And he said to me, “This is the table that is before Yahweh.”
translation:
  language: pt
  text: 'O altar era de madeira[a], com três côvados de altura e dois côvados de comprimento; seus cantos, seu comprimento e suas laterais eram de madeira. E ele me disse: “Esta é a mesa que está diante de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico começa com “o altar”, mas depois identifica o objeto como “a mesa”, possivelmente refletindo sua função tanto de altar quanto de mesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: O substantivo normalmente designa um altar. Mantém-se esse termo, apesar de o objeto ser depois identificado como mesa, para não eliminar a mudança lexical do hebraico.
- source_word: עֵץ
  choice: de madeira
  rationale: Expressa de modo natural e exato o material de que o objeto era feito.
- source_word: שָׁלוֹשׁ אַמּוֹת גָּבֹהַּ
  choice: com três côvados de altura
  rationale: Formulação dimensional clara e corrente em português.
- source_word: וְאָרְכּוֹ שְׁתַּיִם אַמּוֹת
  choice: e dois côvados de comprimento
  rationale: Preserva explicitamente a medida do comprimento em português natural.
- source_word: וּמִקְצֹעוֹתָיו לוֹ
  choice: seus cantos
  rationale: מִקְצֹעוֹת designa os cantos ou as partes angulares; o elemento לוֹ é absorvido como expressão de pertencimento.
- source_word: וְקִירֹתָיו
  choice: suas laterais
  rationale: Embora קִיר possa significar 'parede', 'laterais' é mais natural para as superfícies estruturais desse pequeno móvel de madeira.
- source_word: וַיְדַבֵּר אֵלַי
  choice: Então ele me disse
  rationale: Introdução narrativa natural para o discurso direto; 'então' representa adequadamente a progressão narrativa.
- source_word: זֶה הַשֻּׁלְחָן
  choice: Esta é a mesa
  rationale: Preserva a mudança explícita de 'altar' para 'mesa' existente no texto hebraico.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Reproduz a expressão espacial e mantém o nome divino pessoal presente no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome divino sem substituí-lo por um título.
- issue: Relação entre 'altar' e 'mesa'
  choice: manter os dois termos no texto principal
  alternative: uniformizar ambos como 'altar', 'mesa' ou 'altar-mesa'
  rationale: O hebraico emprega מִזְבֵּחַ e depois שֻׁלְחָן. A tradução conserva essa tensão lexical e funcional em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se 'côvado' como medida bíblica tradicional e a alternância deliberada entre 'altar' e 'mesa'.
