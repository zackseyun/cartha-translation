base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/004.yaml
  text: 'Then he measured its length: twenty cubits[a], and the width: twenty cubits, before the nave; and he said to me, “This is the Most Holy Place.”'
translation:
  language: pt
  text: 'Então ele mediu o comprimento do recinto: vinte côvados, e a largura: vinte côvados, diante do salão principal. E me disse: “Este é o Lugar Santíssimo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “Santo dos Santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol apresenta a ação seguinte na sequência narrativa; “Então” preserva essa progressão de modo natural em português.
- source_word: אָרְכּוֹ
  choice: o comprimento do recinto
  rationale: O sufixo masculino singular remete ao espaço interior que está sendo medido. A explicitação de “recinto” evita uma referência pronominal pouco clara em português.
- source_word: עֶשְׂרִים אַמָּה
  choice: vinte côvados
  rationale: Mantém a antiga unidade linear hebraica, reconhecível na tradição bíblica, sem impor uma conversão moderna aproximativa.
- source_word: וְרֹחַב
  choice: e a largura
  rationale: “Largura” é o equivalente moderno e direto de רֹחַב; o referente permanece claro pelo contexto.
- source_word: אֶל־פְּנֵי הַהֵיכָל
  choice: diante do salão principal
  rationale: A expressão indica a relação espacial com הֵיכָל, aqui o salão principal do santuário, distinguindo-o do recinto interior sem empregar o pouco usual “nave”.
- source_word: וַיֹּאמֶר אֵלַי
  choice: E me disse
  rationale: Reproduz de forma natural a fórmula narrativa hebraica e mantém a mudança da medição para a fala.
- source_word: זֶה קֹדֶשׁ הַקֳּדָשִׁים
  choice: Este é o Lugar Santíssimo
  rationale: A construção superlativa hebraica designa o recinto mais santo; esta forma é clara, digna e corrente em português.
theological_decisions:
- issue: Tradução de קֹדֶשׁ הַקֳּדָשִׁים
  choice: Lugar Santíssimo
  alternative: Santo dos Santos
  rationale: “Lugar Santíssimo” comunica diretamente a função superlativa da expressão hebraica. A forma tradicional, importante para reconhecimento e continuidade intertextual, é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Conserva “côvados” como unidade antiga; usa “salão principal” para distinguir o הֵיכָל do recinto interior e evita o tecnicismo arquitetônico “nave”.
