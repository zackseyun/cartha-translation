  text: ע֥וֹד זֹ֖את עָ֣שׂוּ לִ֑/י טִמְּא֤וּ אֶת מִקְדָּשִׁ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/038.yaml
  text: 'Moreover, they did this to me: they defiled my sanctuary on that same day, and they profaned my Sabbaths.'
translation:
  language: pt
  text: 'Além disso, fizeram-me isto: naquele mesmo dia, contaminaram o meu santuário e profanaram os meus sábados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד זֹאת
  choice: Além disso, ... isto
  rationale: A expressão acrescenta uma nova acusação e dá destaque ao ato mencionado; “Além disso” comunica naturalmente seu valor aditivo.
- source_word: עָשׂוּ לִי
  choice: fizeram isto contra mim
  rationale: Neste contexto de ofensa contra Deus, לִי indica que a ação foi dirigida contra ele. “Contra mim” torna explícito o caráter adversativo sem alterar o conteúdo.
- source_word: טִמְּאוּ
  choice: contaminaram
  rationale: O piel de טמא indica tornar ritualmente impuro. “Contaminaram” preserva o peso cultual e soa natural em relação ao santuário.
- source_word: מִקְדָּשִׁי
  choice: o meu santuário
  rationale: מִקְדָּשׁ designa o espaço santo e não precisa ser restringido ao edifício do templo; “santuário” preserva essa amplitude.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: O contexto aponta para o próprio dia dos atos anteriormente descritos. “Mesmo” explicita essa ligação contextual sem acrescentar uma ideia estranha ao texto.
- source_word: שַׁבְּתוֹתַי
  choice: os meus sábados
  rationale: A forma hebraica é plural e se refere aos tempos sabáticos pertencentes a Deus; o plural foi mantido.
- source_word: חִלֵּלוּ
  choice: profanaram
  rationale: O piel de חלל descreve tratar como comum aquilo que é santo. “Profanaram” é preciso e mantém o registro cultual.
theological_decisions:
- issue: Terminologia cultual referente ao espaço e ao tempo santos
  choice: Manter “santuário”, “sábados”, “contaminaram” e “profanaram”.
  alternative: Empregar termos mais gerais, como “templo” e “desrespeitaram”.
  rationale: A acusação envolve impureza ritual e violação da santidade do espaço e dos tempos de Deus. Termos genéricos reduziriam a força cultual e pactual do versículo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com terminologia bíblica cultual reconhecível. A ordem foi levemente ajustada para fluência, sem eliminar o paralelismo entre santuário e sábados.
