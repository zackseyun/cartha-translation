base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
translation:
  language: pt
  text: Ela desejou ardentemente os filhos da Assíria — governadores e oficiais próximos[a], vestidos com trajes requintados, cavaleiros montados em cavalos, todos eles jovens desejáveis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que estavam por perto” ou “os que estavam próximos”. O termo hebraico é difícil neste contexto e pode referir-se, de modo mais amplo, a pessoas em proximidade ou a serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָגָבָה
  choice: desejou ardentemente
  rationale: Expressa o forte desejo erótico do verbo no contexto da metáfora sexual, em linguagem clara e digna.
- source_word: בְּנֵי אַשּׁוּר
  choice: os filhos da Assíria
  rationale: Conserva a expressão hebraica literal, que neste contexto designa os assírios, sem perder inteligibilidade.
- source_word: פַּחוֹת
  choice: governadores
  rationale: Título administrativo para governantes regionais, traduzido sem impor terminologia histórica mais específica.
- source_word: וּסְגָנִים
  choice: oficiais
  rationale: Representa de modo amplo e natural o segundo título governamental coordenado com 'governadores'.
- source_word: קְרֹבִים
  choice: próximos
  rationale: Mantém o sentido lexical básico e a dificuldade do hebraico, evitando introduzir 'guerreiros', termo não explícito no texto.
- source_word: לְבֻשֵׁי מִכְלֹל
  choice: vestidos com trajes completos
  rationale: Preserva a ideia de vestimenta completa, refinada ou esplêndida sem restringi-la explicitamente a um uniforme militar.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: Designa naturalmente homens montados, provavelmente tropas de cavalaria.
- source_word: רֹכְבֵי סוּסִים
  choice: montados em cavalos
  rationale: Conserva o reforço descritivo do hebraico, embora produza uma repetição intencional após 'cavaleiros'.
- source_word: בַּחוּרֵי חֶמֶד
  choice: jovens desejáveis
  rationale: Mantém tanto a juventude quanto a avaliação de atração ou desejo dentro da metáfora erótica.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Preserva a ênfase conclusiva e abrangente da expressão hebraica.
