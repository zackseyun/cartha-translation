  terminology: “Governadores”, “oficiais”, “cavaleiros” e “jovens desejáveis” são escolhas adequadas. “Filhos da Assíria” preserva a formulação hebraica e continua inteligível. A incerteza de קְרֹבִים deve permanecer explicitamente assinalada, sem defini-la como referência a assessores do governante.
