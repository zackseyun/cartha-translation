base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/005.yaml
  text: Oholah played the prostitute while under me[a], and she lusted after her lovers[c][b], the Assyrians who were nearby.
translation:
  language: pt
  text: Oolá se prostituiu enquanto estava sob mim[a] e ardeu de desejo por seus amantes, os assírios que estavam perto[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sob mim”. A expressão ocorre no quadro da metáfora conjugal e evoca a relação de Oolá com o SENHOR.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “desejou ardentemente” ou “ficou obcecada por”. O verbo hebraico expressa desejo intenso, com conotação sexual neste contexto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os assírios, os que estavam próximos”. O hebraico pode destacar a proximidade deles sem definir se ela é apenas geográfica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזֶן
  choice: se prostituiu
  rationale: Mantém explicitamente a metáfora sexual de זנה, usada por Ezequiel para representar a infidelidade de aliança, sem recorrer a uma expressão arcaica.
- source_word: אָהֳלָה
  choice: Oolá
  rationale: Transliteração portuguesa inteligível do nome próprio hebraico, sem traduzir seu possível valor etimológico.
- source_word: תַּחְתָּי
  choice: enquanto estava sob o meu domínio
  rationale: Expressa a condição de Oolá sob a autoridade e proteção do SENHOR no quadro da metáfora conjugal, preservando o sentido temporal sugerido pelo contexto.
- source_word: וַתַּעְגַּב
  choice: ardeu de desejo por
  rationale: Reproduz a intensidade e a conotação sexual negativa do verbo עגב de modo natural em português atual.
- source_word: מְאַהֲבֶיהָ
  choice: seus amantes
  rationale: O particípio substantivado designa os parceiros ilícitos de Oolá na metáfora de adultério; “amantes” conserva essa imagem.
- source_word: אֶל אַשּׁוּר
  choice: os assírios
  rationale: No contexto, אַשּׁוּר é identificado com os parceiros estrangeiros; a forma plural de קְרוֹבִים favorece a referência aos assírios como pessoas.
- source_word: קְרוֹבִים
  choice: que estavam perto
  rationale: Mantém o sentido espacial básico do adjetivo plural sem decidir que se tratava de “vizinhos” em sentido político ou relacional.
theological_decisions:
- issue: Metáfora profética de prostituição para a infidelidade de Samaria e suas alianças estrangeiras
  choice: 'Conservar a linguagem sexual explícita: “se prostituiu” e “ardeu de desejo por seus amantes”.'
  alternative: Suavizar como “foi infiel” e “desejou aliados estrangeiros”.
  rationale: A linguagem deliberadamente chocante de Ezequiel representa idolatria e dependência política como infidelidade conjugal. Preservá-la mantém a força e a tensão teológica do hebraico.
- issue: Sentido de תַּחְתָּי na metáfora conjugal
  choice: “enquanto estava sob o meu domínio”
  alternative: “enquanto me pertencia” ou, literalmente, “sob mim”
  rationale: A formulação conserva a ideia de autoridade/proteção sem transformar a relação metafórica em mera posse nem especificar além do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a contundência sexual do original e usa “sob o meu domínio” para evitar a estranheza de “sob mim”, registrando a forma mais literal em nota. A aposição “os assírios” identifica naturalmente os amantes, e “que estavam perto” preserva a abertura semântica de קְרוֹבִים.
