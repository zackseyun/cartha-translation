  source_fidelity: A comparação dupla do hebraico é preservada em linhas gerais, mas «paixão» enfraquece o sentido sexualmente marcado de עַגְבָה, e «mais do que ela» deixa o referente comparativo desnecessariamente ambíguo em português.
  naturalness: A redação atual é compreensível, porém a sequência «corrompeu-se ainda mais do que ela em sua paixão» é pouco fluida e pode sugerir que Oolibá se corrompeu mais do que ela própria. Uma formulação paralela e explícita soa mais natural.
  terminology: «Lascívia» transmite melhor o teor de desejo sexual degradado de עַגְבָה do que «paixão». «Prostituições» mantém adequadamente a imagem sexual concreta do texto, sem reduzi-la de antemão a uma interpretação exclusivamente cultual.
