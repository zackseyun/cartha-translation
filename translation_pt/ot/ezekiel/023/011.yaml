  text: וַ/תֵּ֨רֶא֙ אֲחוֹתָ֣/הּ אָהֳלִיבָ֔ה וַ/תַּשְׁחֵ֥ת עַגְבָתָ֖/הּ מִמֶּ֑/נָּה וְ/אֶת תַּ֨זְנוּתֶ֔י/הָ מִ/זְּנוּנֵ֖י אֲחוֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/011.yaml
  text: When her sister Oholibah saw this[a], she became more corrupt in her lust than her sister, and in her prostitutions more than the prostitutions of her sister.
translation:
  language: pt
  text: Quando sua irmã Oolibá viu isso, corrompeu-se mais do que sua irmã em sua lascívia, e suas prostituições foram maiores do que as prostituições de sua irmã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quando ... viu isso
  rationale: O verbo significa “viu”; “isso” explicita em português o objeto implícito recuperado do contexto, e “quando” expressa com naturalidade a progressão narrativa.
- source_word: אֲחוֹתָהּ אָהֳלִיבָה
  choice: sua irmã Oolibá
  rationale: Mantém o nome próprio transliterado e a relação apositiva do hebraico, em ordem natural no português.
- source_word: וַתַּשְׁחֵת
  choice: corrompeu-se ainda mais
  rationale: O hifil, neste contexto de degradação moral e sexual, pode indicar agir de modo corrupto ou corromper-se. A construção comparativa pede aqui a ideia de ultrapassar a irmã em corrupção.
- source_word: עַגְבָתָהּ
  choice: sua paixão
  rationale: O substantivo designa desejo intenso e lascivo. “Paixão” conserva a intensidade sexual no contexto sem recorrer a formulação pouco natural; o teor moralmente negativo fica claro por “corrompeu-se” e “prostituições”.
- source_word: מִמֶּנָּה
  choice: mais do que ela
  rationale: A preposição marca comparação com a irmã anteriormente mencionada. O pronome evita repetição sem eliminar o referente.
- source_word: וְאֶת תַּזְנוּתֶיהָ
  choice: e, em suas prostituições
  rationale: Conserva a metáfora sexual explícita e supre a relação exigida pela comparação em português.
- source_word: מִזְּנוּנֵי אֲחוֹתָהּ
  choice: foi além das prostituições de sua irmã
  rationale: Expressa a comparação introduzida por מִן e mantém a linguagem concreta de prostituição empregada pelo texto profético.
theological_decisions:
- issue: Metáfora de infidelidade sexual para a deslealdade à aliança
  choice: Manter a linguagem sexual explícita (“paixão” e “prostituições”).
  alternative: Substituí-la por termos interpretativos como “infidelidade” ou “idolatria”.
  rationale: O hebraico emprega deliberadamente vocabulário sexual forte para retratar a traição de Jerusalém. Preservar a metáfora mantém a força retórica e a tensão teológica, sem reduzi-la antecipadamente a uma única explicação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção conserva o paralelismo comparativo do hebraico sem reproduzir sua sintaxe de modo artificial.
