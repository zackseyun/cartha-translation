  text: וַ/תִּזְנֶ֣ינָה בְ/מִצְרַ֔יִם בִּ/נְעוּרֵי/הֶ֖ן זָנ֑וּ שָׁ֚מָּ/ה מֹעֲכ֣וּ שְׁדֵי/הֶ֔ן וְ/שָׁ֣ם עִשּׂ֔וּ דַּדֵּ֖י בְּתוּלֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/003.yaml
  text: They prostituted themselves in Egypt[a]; in their youth they committed prostitution there. There their breasts were fondled[c][b], and there their virgin bosoms were handled.
translation:
  language: pt
  text: Elas se prostituíram no Egito[a]; na sua juventude, prostituíram-se ali. Ali lhes apertaram os seios, e ali lhes apalparam os seios de sua virgindade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Elas praticaram prostituição no Egito”. O verbo também é usado, nesta metáfora profética, para a infidelidade.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega imagens sexuais explícitas. A expressão final é literalmente próxima de “os seios da virgindade delas” e é incomum; os verbos descrevem atos de apertar e manusear, sem identificar os agentes.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶינָה / זָנוּ
  choice: se prostituíram / prostituíram-se
  rationale: Preserva a repetição enfática da raiz זנה e seu sentido sexual e metafórico, em linguagem portuguesa atual.
- source_word: בְמִצְרַיִם
  choice: no Egito
  rationale: Tradução locativa direta do topônimo.
- source_word: בִּנְעוּרֵיהֶן
  choice: desde a juventude
  rationale: Expressa de modo natural o período da juventude; no contexto, a infidelidade começou então.
- source_word: שָׁמָּה
  choice: ali
  rationale: Mantém as ocorrências do advérbio locativo e a ênfase retórica do hebraico.
- source_word: מֹעֲכוּ
  choice: apertaram
  rationale: O verbo מעך indica pressionar ou apertar; a forma ativa também preserva melhor a construção hebraica e a crueza da imagem.
- source_word: שְׁדֵיהֶן
  choice: os seus seios
  rationale: Equivalente anatômico comum e claro em português.
- source_word: עִשּׂוּ
  choice: apalparam
  rationale: No contexto sexual, comunica o manuseio do corpo sem fingir precisão quanto ao gesto exato do difícil uso de עשה.
- source_word: דַּדֵּי בְתוּלֵיהֶן
  choice: os peitos da sua virgindade
  rationale: Conserva a expressão corporal incomum e gráfica do hebraico e sua ligação explícita com a virgindade, sem normalizá-la silenciosamente.
theological_decisions:
- issue: Caráter da linguagem sexual na metáfora profética
  choice: Manter no texto principal a imagem sexual explícita.
  alternative: Suavizar com expressões como “foram acariciadas” ou simplesmente “foram corrompidas”.
  rationale: A linguagem deliberadamente gráfica integra a acusação profética de infidelidade; suavizá-la reduziria a força do texto.
- issue: Agência nas duas últimas cláusulas
  choice: Traduzir os verbos na terceira pessoa do plural ativa, com sujeito indeterminado pelo contexto imediato.
  alternative: 'Empregar a voz passiva: “seus seios foram apertados”.'
  rationale: As formas hebraicas מֹעֲכוּ e עִשּׂוּ são ativas; o sujeito não é expresso. A tradução evita converter silenciosamente a construção em passiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição, a construção ativa e a crueza intencional do hebraico foram preservadas; evitou-se linguagem arcaica e também a suavização eufemística.
