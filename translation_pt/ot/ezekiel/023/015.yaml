  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
translation:
  language: pt
  text: com cinturões presos à cintura e turbantes esvoaçantes sobre a cabeça, todos com aparência de oficiais[a], à semelhança dos filhos da Babilônia, dos caldeus, terra de seu nascimento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “capitães”. O termo hebraico pode designar militares de elite ou oficiais de alta patente; “oficiais” evita especificar demais o antigo título.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “filhos da Babilônia”, expressão que se refere aos babilônios. A frase final identifica os caldeus por sua terra de nascimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגוֹרֵי אֵזוֹר בְּמָתְנֵיהֶם
  choice: com cinturões presos à cintura
  rationale: Reproduz a imagem concreta de estarem cingidos com um cinto, usando linguagem portuguesa atual e evitando o arcaísmo “lombos”.
- source_word: סְרוּחֵי טְבוּלִים בְּרָאשֵׁיהֶם
  choice: turbantes esvoaçantes na cabeça
  rationale: Expressa o toucado pendente ou fluente indicado pela frase hebraica; “turbantes” é claro e tradicional neste contexto.
- source_word: מַרְאֵה שָׁלִשִׁים כֻּלָּם
  choice: Todos tinham aparência de oficiais[a]
  rationale: Mantém a ênfase de כֻּלָּם e traduz o título militar antigo de modo amplo, sem especificar uma patente incerta.
- source_word: דְּמוּת בְּנֵי בָבֶל
  choice: eram semelhantes aos filhos da Babilônia[b]
  rationale: Preserva tanto a ideia de semelhança quanto a expressão filial hebraica, esclarecida em nota.
- source_word: כַּשְׂדִּים אֶרֶץ מוֹלַדְתָּם
  choice: caldeus em sua terra natal
  rationale: Conserva a designação étnica “caldeus” e relaciona a expressão final à terra de origem deles, em português inteligível, sem fundi-la simplesmente com “babilônios”.
