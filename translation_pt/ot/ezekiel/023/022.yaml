source:
  edition: WLC
  text: לָ/כֵ֣ן אָהֳלִיבָ֗ה כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מֵעִ֤יר אֶת מְאַהֲבַ֨יִ/ךְ֙ עָלַ֔יִ/ךְ אֵ֛ת אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶ֑ם וַ/הֲבֵאתִ֥י/ם עָלַ֖יִ/ךְ מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/022.yaml
  text: 'Therefore[a], Oholibah, thus says the Lord GOD: Behold, I am stirring up your lovers against you, those from whom your soul has turned away, and I will bring them against you from every side.'
translation:
  language: pt
  text: 'Por isso, Oolibá, assim diz o Senhor Yahweh: “Eis que estou incitando contra você os seus amantes, aqueles de quem a sua alma se afastou[a], e os trarei contra você de todos os lados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aqueles que a sua alma passou a detestar” ou “aqueles dos quais você se tornou alienada”. O verbo hebraico pode indicar repulsa ou afastamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência judicial da denúncia anterior com naturalidade e força profética.
- source_word: אָהֳלִיבָה
  choice: Oolibá
  rationale: Transliteração portuguesa corrente do nome próprio, sem traduzir seu significado.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: assim diz o Senhor Yahweh
  rationale: Preserva a fórmula profética e distingue אֲדֹנָי, título, de יְהוָה, o nome divino.
- source_word: הִנְנִי מֵעִיר
  choice: Eis que estou incitando
  rationale: “Eis que” mantém a solenidade do anúncio, e a construção progressiva representa o particípio causativo como ação divina em curso ou iminente.
- source_word: מְאַהֲבַיִךְ
  choice: os seus amantes
  rationale: Mantém a metáfora sexual e política central em Ezequiel 23.
- source_word: אֵת אֲשֶׁר נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: aqueles de quem a sua alma se afastou
  rationale: Conserva “sua alma” como sujeito e deixa aberta a nuance entre afastamento, alienação e repulsa.
- source_word: וַהֲבֵאתִים עָלַיִךְ מִסָּבִיב
  choice: e os trarei contra você de todos os lados
  rationale: Expressa de modo idiomático a mobilização hostil e a ideia de cerco.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: “Yahweh” representa diretamente o nome da aliança, enquanto “Senhor” traduz o título אֲדֹנָי, evitando fundir os dois elementos.
- issue: Agência divina no ataque dos antigos aliados
  choice: estou incitando ... e os trarei
  alternative: vou despertar ... e fazê-los vir
  rationale: Mantém explícita a afirmação do texto de que o próprio Deus mobiliza e conduz os agentes do juízo, sem atenuar a tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. Emprega “você” porque a fala se dirige diretamente à figura feminina Oolibá; preserva a metáfora dos “amantes” e a expressão hebraica “sua alma”.
