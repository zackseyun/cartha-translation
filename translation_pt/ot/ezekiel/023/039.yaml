  text: וּֽ/בְ/שַׁחֲטָ֤/ם אֶת בְּנֵי/הֶם֙ לְ/גִלּ֣וּלֵי/הֶ֔ם וַ/יָּבֹ֧אוּ אֶל מִקְדָּשִׁ֛/י בַּ/יּ֥וֹם הַ/ה֖וּא לְ/חַלְּל֑/וֹ וְ/הִנֵּה כֹ֥ה עָשׂ֖וּ בְּ/ת֥וֹךְ בֵּיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/039.yaml
  text: For when they slaughtered their sons for their idols, they came into my sanctuary on that same day to defile it. Look—this is what they did within my house.
translation:
  language: pt
  text: Ao sacrificarem seus filhos aos seus ídolos, entraram no meu santuário naquele mesmo dia para profaná-lo. Eis o que fizeram dentro da minha casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשַׁחֲטָם
  choice: depois de sacrificarem
  rationale: O infinitivo שׁחט descreve o abate ritual dos filhos; “sacrificarem” comunica naturalmente esse sentido no contexto, enquanto “depois de” explicita a relação temporal com a entrada no santuário no mesmo dia.
- source_word: לְגִלּוּלֵיהֶם
  choice: aos seus ídolos
  rationale: גִּלּוּלִים é um termo depreciativo para ídolos; “ídolos” preserva o referente de modo claro, sem introduzir na tradução principal uma expressão portuguesa artificial.
- source_word: וְהִנֵּה
  choice: 'Vejam:'
  rationale: A partícula chama enfaticamente a atenção para a ação denunciada. “Vejam” mantém a força demonstrativa em português atual e dignificado.
- source_word: בְּתוֹךְ בֵּיתִי
  choice: dentro da minha casa
  rationale: Mantém a imagem de בַּיִת como a casa de Deus e a distinção em relação a “meu santuário” na oração anterior.
theological_decisions:
- issue: Natureza da morte dos filhos
  choice: sacrificarem seus filhos aos seus ídolos
  alternative: matarem seus filhos diante de seus ídolos
  rationale: O verbo denota abater, e o contexto imediato é de culto idólatra; “sacrificarem” torna clara essa associação sem especificar um rito além do que o texto sustenta.
- issue: Relação temporal entre o sacrifício e a profanação do santuário
  choice: depois de ... naquele mesmo dia
  alternative: quando ... naquele mesmo dia
  rationale: A construção com infinitivo e a sequência verbal indicam que elas entraram no santuário após o sacrifício, ainda no mesmo dia; a formulação preserva a gravidade dessa proximidade temporal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O plural inclusivo “Vejam” reproduz o apelo enfático do hebraico; “profaná-lo” mantém o vocabulário cultual apropriado.
