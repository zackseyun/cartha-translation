base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/042.yaml
  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
translation:
  language: pt
  text: E o som de uma multidão despreocupada se ouvia nela.[a] E, aos homens da multidão humana, foram trazidos beberrões do deserto.[b] Eles puseram braceletes nas mãos delas e uma coroa esplêndida sobre as cabeças delas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o som de uma multidão à vontade” ou “o som de uma multidão acomodada”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta oração é difícil. Também pode ser entendido como: “e, com os homens da multidão humana, foram trazidos beberrões do deserto”. A tradição textual lê “sabeus” em vez de “beberrões”.'
    reason: alternative_reading
  - marker: c
    text: “Uma coroa esplêndida” traduz literalmente “uma coroa de beleza” ou “uma coroa de esplendor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל הָמוֹן֮ שָׁלֵ֣ו
  choice: o som de uma multidão despreocupada
  rationale: “Som” abrange a cena audível sem restringir o sentido a voz ou ruído; “multidão” expressa o grupo numeroso, e “despreocupada” conserva a ideia de comodidade, segurança e possível complacência de שָׁלֵו.
- source_word: בָהּ
  choice: se ouvia nela
  rationale: A construção natural em português mantém o pronome feminino e, assim, a personificação da mulher/cidade presente no capítulo.
- source_word: אֲנָשִׁים מֵרֹב אָדָם
  choice: homens vindos da multidão humana
  rationale: “Homens” preserva o masculino específico do contexto, enquanto “multidão humana” mantém o elemento אָדָם e a expressão comprimida do hebraico sem impor uma identificação mais precisa.
- source_word: מוּבָאִים סובאים מִמִּדְבָּר
  choice: foram trazidos beberrões do deserto
  rationale: A forma passiva de בוא é mantida. “Beberrões” representa a leitura ligada à embriaguez, e “deserto” traduz de modo claro a procedência indicada por מִדְבָּר; a dificuldade textual e sintática é registrada em nota.
- source_word: צְמִידִים אֶל יְדֵיהֶן
  choice: braceletes nos pulsos delas
  rationale: Embora יָד seja literalmente “mão”, “nos pulsos” é a expressão portuguesa natural para o lugar onde se usam braceletes; “delas” explicita corretamente o referente feminino plural.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: uma coroa esplêndida
  rationale: A expressão construta significa literalmente “coroa de beleza/esplendor”; “coroa esplêndida” comunica esse sentido em português atual e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe incomum da oração intermediária foi mantida no texto para não eliminar a dificuldade real do hebraico, enquanto a nota apresenta uma alternativa. Os referentes femininos plurais foram explicitados por “delas” para preservar a imagem das duas mulheres no contexto.
