  text: עָשֹׂ֥ה אֵ֖לֶּה לָ֑/ךְ בִּ/זְנוֹתֵ/ךְ֙ אַחֲרֵ֣י גוֹיִ֔ם עַ֥ל אֲשֶׁר נִטְמֵ֖את בְּ/גִלּוּלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/030.yaml
  text: These things are done to you because of your prostitution after the nations[a], because you defiled yourself with their idols.
translation:
  language: pt
  text: Estas coisas são feitas a você porque se prostituiu seguindo as nações e porque se contaminou com os ídolos delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é deliberadamente depreciativo. Às vezes é parafraseado como “ídolos imundos” ou “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשֹׂה אֵלֶּה לָךְ
  choice: Estas coisas são feitas contra você
  rationale: A construção elíptica retoma os juízos anteriores sem declarar o agente. O passivo preserva essa ausência; “contra você” expressa em português natural o sentido adversativo que o contexto confere a לָךְ.
- source_word: בִּזְנוֹתֵךְ אַחֲרֵי גוֹיִם
  choice: porque se prostituiu, indo atrás das nações
  rationale: O infinitivo com בְּ tem valor causal. “Se prostituiu” mantém a metáfora sexual intencional, enquanto “indo atrás” conserva o sentido de perseguição ou busca presente em אַחֲרֵי.
- source_word: נִטְמֵאת
  choice: se contaminou
  rationale: O nifal pode indicar tornar-se impura ou contaminar-se. A forma reflexiva comunica tanto o estado de impureza quanto a responsabilidade da figura feminina no contexto.
- source_word: בְּגִלּוּלֵיהֶם
  choice: com os ídolos delas
  rationale: “Ídolos” é claro e natural; a preposição é adequadamente representada por “com”. O pronome feminino concorda em português com “nações”. A conotação depreciativa de גִּלּוּלִים é preservada em nota.
theological_decisions:
- issue: Metáfora sexual da infidelidade à aliança
  choice: porque se prostituiu
  alternative: por causa da sua infidelidade / por causa da sua idolatria
  rationale: Ezequiel emprega deliberadamente a prostituição como metáfora da ruptura da aliança. Substituí-la por uma explicação abstrata eliminaria a força e a tensão da imagem original.
- issue: Conotação depreciativa de גִּלּוּלִים
  choice: ídolos no texto, com explicação em nota
  alternative: ídolos imundos / ídolos de esterco
  rationale: A tradução principal permanece digna e compreensível, enquanto a nota registra o desprezo lexical do hebraico sem impor uma paráfrase gráfica ao texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A metáfora forte do original foi mantida, e a repetição causal foi organizada com “e porque” para clareza.
