  text: וַ/תִּתֵּ֤ן תַּזְנוּתֶ֨י/הָ֙ עֲלֵי/הֶ֔ם מִבְחַ֥ר בְּנֵֽי אַשּׁ֖וּר כֻּלָּ֑/ם וּ/בְ/כֹ֧ל אֲשֶׁר עָֽגְבָ֛ה בְּ/כָל גִּלּוּלֵי/הֶ֖ם נִטְמָֽאָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/007.yaml
  text: She lavished her prostitutions on them[a], all the choicest sons of Assyria; and with all those for whom she lusted[c][b], with all their idols she defiled herself.
translation:
  language: pt
  text: Ela lhes ofereceu os seus atos de prostituição, a todos os escolhidos dentre os filhos da Assíria[a]; e, com todos aqueles por quem sentiu desejo ardente[b], contaminou-se com todos os ídolos deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os homens seletos da Assíria” ou “os melhores dentre os assírios”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega imagens sexuais explícitas (“atos de prostituição”, “desejo ardente”) como metáfora profética da infidelidade política e religiosa e da idolatria.
    reason: cultural_note
  - marker: c
    text: A palavra hebraica traduzida por “ídolos” é o termo intensamente depreciativo que Ezequiel costuma empregar para eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן תַּזְנוּתֶיהָ עֲלֵיהֶם
  choice: lhes ofereceu seus atos de prostituição
  rationale: A expressão significa literalmente que ela “deu” suas prostituições sobre/a eles. “Ofereceu-lhes seus atos de prostituição” preserva sua ação deliberada e a imagem sexual, mas soa mais natural em português do que uma reprodução mecânica da preposição.
- source_word: מִבְחַר בְּנֵי אַשּׁוּר כֻּלָּם
  choice: a todos eles, a elite dos filhos da Assíria
  rationale: מִבְחַר indica o que é seleto ou melhor; “a elite” comunica esse valor com clareza. “Filhos da Assíria” mantém o substantivo masculino explícito בְּנֵי, adequado ao contexto sexual metafórico, e כֻּלָּם é representado por “a todos eles”.
- source_word: וּבְכֹל אֲשֶׁר עָגְבָה
  choice: e, com todos aqueles por quem sentiu desejo ardente
  rationale: עָגְבָה expressa desejo intenso com conotação erótica. “Sentiu desejo ardente” conserva essa força sem recorrer a uma formulação vulgar ou antiquada.
- source_word: בְּכָל גִּלּוּלֵיהֶם
  choice: com todos os ídolos deles
  rationale: גִּלּוּלִים é a designação fortemente depreciativa que Ezequiel emprega para ídolos. O texto principal usa o termo português claro “ídolos”, enquanto a nota registra a carga pejorativa difícil de reproduzir concisamente.
- source_word: נִטְמָאָה
  choice: contaminou-se
  rationale: O nifal descreve o estado de impureza resultante de seu próprio envolvimento. “Contaminou-se” comunica tanto a participação reflexiva quanto a dimensão moral e cultual da impureza.
theological_decisions:
- issue: Metáfora sexual para infidelidade política, religiosa e pactual
  choice: Manter no texto principal “atos de prostituição” e “desejo ardente”.
  alternative: Substituir a imagem por “infidelidade” ou “deslealdade”.
  rationale: A linguagem sexual explícita é parte da retórica deliberadamente chocante de Ezequiel. Suavizá-la apagaria a força do texto e resolveria no corpo da tradução uma metáfora que deve permanecer visível.
- issue: Sentido masculino de בְּנֵי na expressão assíria
  choice: Preservar “filhos da Assíria”.
  alternative: Usar “homens da Assíria” ou simplesmente “assírios”.
  rationale: O contexto retrata homens assírios como objetos do desejo da personagem, e o hebraico emprega explicitamente o termo masculino “filhos”; por isso, não há motivo contextual para neutralizá-lo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada e a aposição foi marcada por travessões para tornar clara a identificação dos parceiros, sem eliminar a repetição enfática de “todos”. A imagem sexual explícita e a terminologia cultual foram preservadas.
