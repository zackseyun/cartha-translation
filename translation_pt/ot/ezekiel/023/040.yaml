  text: וְ/אַ֗ף כִּ֤י תִשְׁלַ֨חְנָה֙ לַֽ/אֲנָשִׁ֔ים בָּאִ֖ים מִ/מֶּרְחָ֑ק אֲשֶׁ֨ר מַלְאָ֜ךְ שָׁל֤וּחַ אֲלֵי/הֶם֙ וְ/הִנֵּה בָ֔אוּ לַ/אֲשֶׁ֥ר רָחַ֛צְתְּ כָּחַ֥לְתְּ עֵינַ֖יִ/ךְ וְ/עָ֥דִית עֶֽדִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/040.yaml
  text: And moreover[a], they sent for men coming from far away, to whom a messenger had been sent; and behold, they came—to the one who had washed herself, painted her eyes, and adorned herself with jewelry.
translation:
  language: pt
  text: Além disso, elas mandaram chamar homens que vinham de longe, aos quais um mensageiro havia sido enviado. E eis que eles vieram. Para eles você se lavou, pintou os olhos com kohl[a] e se enfeitou com joias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kohl é um cosmético escuro usado para contornar ou pintar os olhos.
    reason: Esclarece um termo cultural específico correspondente ao verbo hebraico, que descreve a aplicação de pigmento escuro nos olhos.
lexical_decisions:
- source_word: וְאַף כִּי
  choice: Além disso
  rationale: Expressa o avanço enfático e aditivo da acusação de maneira natural em português.
- source_word: תִשְׁלַחְנָה
  choice: elas mandaram chamar
  rationale: A forma verbal é feminina plural e retoma as duas mulheres/cidades personificadas; “mandaram chamar” comunica o envio de um convite ou convocação.
- source_word: לַאֲנָשִׁים בָּאִים מִמֶּרְחָק
  choice: homens que vinham de longe
  rationale: Preserva tanto o referente masculino quanto a ideia participial de homens vindos de um lugar distante.
- source_word: אֲשֶׁר מַלְאָךְ שָׁלוּחַ אֲלֵיהֶם
  choice: aos quais um mensageiro havia sido enviado
  rationale: “Mensageiro” indica aqui um emissário humano, e o mais-que-perfeito explicita naturalmente que seu envio precedeu a chegada dos homens.
- source_word: וְהִנֵּה בָאוּ
  choice: E eis que eles vieram
  rationale: “Eis que” conserva a vivacidade dêitica e profética da expressão hebraica.
- source_word: לַאֲשֶׁר רָחַצְתְּ
  choice: Para eles você se lavou
  rationale: Mantém a mudança do plural feminino no início para a interpelação direta da mulher no singular; entende לַאֲשֶׁר em relação aos homens que chegaram, sem converter a segunda pessoa hebraica em terceira pessoa.
- source_word: כָּחַלְתְּ עֵינַיִךְ
  choice: pintou os olhos com kohl
  rationale: O verbo designa especificamente a aplicação de um cosmético escuro nos olhos; a formulação mantém essa precisão cultural e lexical.
- source_word: וְעָדִית עֶדִי
  choice: e se enfeitou com joias
  rationale: Traduz naturalmente a construção idiomática que descreve o ato de colocar adornos ou ornamentos pessoais.
theological_decisions:
- issue: Mudança entre o feminino plural e o singular no discurso profético
  choice: Traduzir o verbo inicial no plural (“elas mandaram”) e as ações de preparação como interpelação direta no singular (“você se lavou...”).
  alternative: Uniformizar todos os verbos no singular ou no plural.
  rationale: O hebraico passa das duas mulheres/cidades consideradas em conjunto para a mulher interpelada individualmente. Preservar a mudança conserva a retórica profética e evita harmonização interpretativa.
- issue: Relação de לַאֲשֶׁר com os homens que chegaram
  choice: “Para eles você se lavou”.
  alternative: “Eles vieram para aquela que se havia lavado”.
  rationale: Os verbos רָחַצְתְּ, כָּחַלְתְּ e עָדִית estão inequivocamente na segunda pessoa feminina singular. A tradução escolhida conserva essa interpelação direta e toma a expressão como indicação daqueles para quem ela se preparou.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “eis que” pelo tom profético vívido. O pronome “você” torna explícita a segunda pessoa feminina singular indicada pelas formas verbais hebraicas; “elas” preserva o feminino plural do verbo inicial.
