base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
translation:
  language: pt
  text: Eles expuseram a nudez dela[a]; levaram seus filhos e suas filhas e a mataram à espada. Assim, ela se tornou motivo de vergonha entre as mulheres[b], e eles executaram juízos contra ela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseram a nu a nudez dela”. A expressão hebraica também pode transmitir a ideia de expor publicamente à vergonha.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ela se tornou um nome entre as mulheres”; isto é, ficou conhecida por sua desonra.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “aplicaram sentenças contra ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלּוּ עֶרְוָתָהּ
  choice: expuseram a nudez dela
  rationale: Preserva a imagem concreta do hebraico e sua conotação de exposição pública e humilhação, em português natural.
- source_word: בָּנֶיהָ וּבְנוֹתֶיהָ לָקָחוּ
  choice: levaram seus filhos e suas filhas
  rationale: Mantém o sentido amplo de לקח sem especificar além do texto se foram capturados ou deportados.
- source_word: וְאוֹתָהּ בַּחֶרֶב הָרָגוּ
  choice: a mataram à espada
  rationale: Tradução direta e corrente que preserva tanto o ato de matar quanto o instrumento.
- source_word: וַתְּהִי שֵׁם לַנָּשִׁים
  choice: ela se tornou motivo de vergonha entre as mulheres
  rationale: Comunica o sentido contextual de reputação infame do idiomatismo literal 'tornou-se um nome', que seria opaco em português.
- source_word: וּשְׁפוּטִים עָשׂוּ בָהּ
  choice: executaram juízos contra ela
  rationale: Preserva o substantivo plural e a dimensão judicial da expressão, sem reduzi-la simplesmente a castigo.
theological_decisions:
- issue: Linguagem sexual metafórica referente a Samaria/Oolá
  choice: Manter a imagem de exposição da nudez.
  alternative: Traduzir de modo abstrato como 'a humilharam publicamente'.
  rationale: A metáfora sexualizada faz parte da força retórica e da representação profética do julgamento em Ezequiel 23; não deve ser suavizada.
- issue: Força da linguagem judicial na oração final
  choice: executaram juízos contra ela
  alternative: a castigaram
  rationale: O hebraico emprega explicitamente um substantivo plural referente a juízos; manter essa linguagem conserva a apresentação da violência como julgamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações acompanha de perto o hebraico; evitam-se tanto arcaísmos como explicações denominacionais.
