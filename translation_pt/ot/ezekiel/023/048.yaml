  text: וְ/הִשְׁבַּתִּ֥י זִמָּ֖ה מִן הָ/אָ֑רֶץ וְ/נִֽוַּסְּרוּ֙ כָּל הַ/נָּשִׁ֔ים וְ/לֹ֥א תַעֲשֶׂ֖ינָה כְּ/זִמַּתְ/כֶֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/048.yaml
  text: Thus I will put an end to lewdness in the land[a], and all women will be warned and will not act according to your lewdness.
translation:
  language: pt
  text: Assim, porei fim à devassidão na terra, e todas as mulheres serão advertidas[a] e não agirão segundo a devassidão de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão disciplinadas” ou “serão corrigidas”. O verbo hebraico pode indicar tanto a correção por meio de castigo quanto a advertência dada por um exemplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: porei fim
  rationale: O hifil de שׁבת expressa fazer cessar. “Porei fim” comunica de modo natural a força causativa.
- source_word: זִמָּה
  choice: devassidão
  rationale: No contexto sexual e moral de Ezequiel 23, “devassidão” preserva tanto a conotação sexual quanto a censura moral, sem reduzir o termo à maldade em geral.
- source_word: מִן הָאָרֶץ
  choice: na terra
  rationale: Com o verbo causativo e um objeto abstrato, a expressão indica a esfera da qual a devassidão será eliminada; “na terra” é natural em português e preserva esse sentido contextual.
- source_word: וְנִוַּסְּרוּ
  choice: serão advertidas
  rationale: O pual de יסר pode indicar disciplina, correção ou instrução mediante castigo. Aqui, a consequência — não repetirem a conduta — favorece o sentido de advertência pelo exemplo, sem excluir o aspecto corretivo, registrado em nota.
- source_word: כָּל הַנָּשִׁים
  choice: todas as mulheres
  rationale: A expressão hebraica é explicitamente feminina e plural. A tradução mantém essa forma sem ampliar nem restringir seu referente.
- source_word: וְלֹא תַעֲשֶׂינָה
  choice: e não agirão
  rationale: Embora עשה seja amplo, “agir” se ajusta ao contexto de conduta moral e mantém a sequência coordenada do hebraico.
- source_word: כְּזִמַּתְכֶנָה
  choice: segundo a devassidão de vocês
  rationale: A preposição כ expressa comparação ou conformidade. A formulação conserva a repetição de זִמָּה e a referência às destinatárias no plural.
theological_decisions:
- issue: Referente e função de “todas as mulheres” em um oráculo de juízo que emprega imagens femininas
  choice: Manter literalmente “todas as mulheres”, sem ampliar para “todas as pessoas” nem restringir às duas irmãs simbólicas.
  alternative: “Todas as mulheres da terra” ou “todos os povos representados como mulheres”.
  rationale: O hebraico declara expressamente “todas as mulheres”. O capítulo representa Samaria e Jerusalém como mulheres e faz de seu juízo um exemplo, mas o versículo não define com maior precisão a extensão do grupo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Devassidão” mantém o teor sexual-moral do contexto; “segundo” preserva a comparação sem produzir uma construção excessivamente literal.
