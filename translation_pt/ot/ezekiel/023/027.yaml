    text: 'Ou: “não olhará para eles”. A expressão hebraica “levantar os olhos para” pode indicar desejo, atenção ou dependência.'
    reason: lexical_alternative
  revision_rationale: A revisão mantém a força causativa de וְהִשְׁבַּתִּי (“farei desaparecer”), a remoção “de você”, a procedência egípcia da prostituição e a ambiguidade da expressão idiomática. Também restringe corretamente “mais” à lembrança do Egito, onde o hebraico emprega עוֹד.
