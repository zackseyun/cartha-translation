revisions:
- from: Assim, porei fim à sua conduta obscena, tirando-a de você, e à sua prostituição trazida da terra do Egito; você não levantará mais os olhos para eles[a] e não se lembrará mais do Egito.
  to: Assim, farei desaparecer de você a sua conduta obscena e a sua prostituição proveniente da terra do Egito; você não levantará os olhos para eles[a] e não se lembrará mais do Egito.
  rationale: A revisão mantém a força causativa de וְהִשְׁבַּתִּי (“farei desaparecer”), a remoção “de você”, a procedência egípcia da prostituição e a ambiguidade da expressão idiomática. Também restringe corretamente “mais” à lembrança do Egito, onde o hebraico emprega עוֹד.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:41:33Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a linguagem sexualizada e a imagem de “levantar os olhos”. Contudo, “trazida da terra do Egito” introduz uma formulação mais específica e menos natural do que o hebraico exige, e “mais” foi acrescentado indevidamente à cláusula sobre levantar os olhos; עוֹד (“mais”) ocorre apenas na cláusula final sobre lembrar-se do Egito.
  naturalness: O texto é geralmente claro e moderno, mas “à sua prostituição trazida da terra do Egito” soa pesado e pode sugerir que a prostituição foi transportada fisicamente. Uma formulação que expresse procedência/origem é mais idiomática.
  terminology: “Conduta obscena” e “prostituição” são escolhas adequadas para זִמָּה e זְנוּת neste contexto. “Eles” conserva corretamente a referência masculina plural aos egípcios/amantes figurados.
  issues:
  - severity: medium
    issue: “mais” em “você não levantará mais os olhos para eles”
    rationale: O hebraico não inclui עוֹד nesta cláusula; o termo aparece somente em “e não se lembrará mais do Egito”. A antecipação de “mais” altera desnecessariamente o escopo textual.
  - severity: low
    issue: “prostituição trazida da terra do Egito”
    rationale: “Trazida” é uma explicitação pouco natural e pode sugerir transporte. O sintagma hebraico indica a relação/origem da prostituição com a terra do Egito sem exigir essa imagem.
  revised_text: Assim, farei desaparecer de você a sua conduta obscena e a sua prostituição proveniente da terra do Egito; você não levantará os olhos para eles[a] e não se lembrará mais do Egito.
  revised_footnotes:
