  text: וְ/הִשְׁבַּתִּ֤י זִמָּתֵ/ךְ֙ מִמֵּ֔/ךְ וְ/אֶת זְנוּתֵ֖/ךְ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִשְׂאִ֤י עֵינַ֨יִ/ךְ֙ אֲלֵי/הֶ֔ם וּ/מִצְרַ֖יִם לֹ֥א תִזְכְּרִי עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/027.yaml
  text: So I will put an end to your lewdness from you[a], and your prostitution from the land of Egypt; and you will not lift up your eyes to them[b], and you will remember Egypt no more.
translation:
  language: pt
  text: Assim, farei desaparecer de você a sua conduta obscena e a sua prostituição proveniente da terra do Egito; você não levantará os olhos para eles[a] e não se lembrará mais do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não olhará para eles”. A expressão hebraica “levantar os olhos para” pode indicar desejo, atenção ou dependência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: porei fim
  rationale: 'Expressa de modo natural em português a força causativa do hifil de שׁבת: Deus fará cessar essa conduta.'
- source_word: זִמָּתֵךְ
  choice: sua conduta obscena
  rationale: No contexto sexualizado de Ezequiel, זִמָּה indica comportamento vergonhoso e depravado, não apenas maldade genérica.
- source_word: מִמֵּךְ
  choice: tirando-a de você
  rationale: Torna clara a ideia de remoção marcada pela preposição sem produzir a construção pouco natural 'pôr fim ... de você'.
- source_word: וְאֶת זְנוּתֵךְ מֵאֶרֶץ מִצְרָיִם
  choice: e à sua prostituição trazida da terra do Egito
  rationale: Mantém o segundo objeto de 'porei fim' e associa sua origem ao Egito. 'Trazida' é uma explicitação mínima exigida pela sintaxe portuguesa; a relação exata também pode ser entendida como início dessa prostituição no Egito.
- source_word: לֹא תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם
  choice: você não levantará mais os olhos para eles
  rationale: Preserva a imagem hebraica e sua ambiguidade entre desejo, atenção e dependência, sem reduzi-la a uma única interpretação.
- source_word: וּמִצְרַיִם לֹא תִזְכְּרִי עוֹד
  choice: e não se lembrará mais do Egito
  rationale: Reproduz claramente a cessação indicada por לֹא ... עוֹד e mantém Egito como objeto da lembrança.
theological_decisions:
- issue: Natureza da linguagem sexual no discurso profético
  choice: Manter diretamente a metáfora sexual com 'conduta obscena' e 'prostituição'.
  alternative: Suavizar para termos genéricos como 'imoralidade' ou 'infidelidade'.
  rationale: O hebraico emprega deliberadamente linguagem sexual forte para representar a infidelidade religiosa e político-aliançal de Jerusalém; generalizá-la reduziria a força profética.
- issue: Sentido de 'levantar os olhos para eles'
  choice: Preservar a expressão figurada sem definir um único sentido.
  alternative: Interpretar como 'procurar a ajuda deles' ou 'desejá-los'.
  rationale: A expressão pode indicar desejo, atenção ou dependência. A tradução conserva essa tensão genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a segunda pessoa feminina singular exigida pela personificação da cidade e conserva a contundência da metáfora profética sem recorrer a vocabulário arcaico.
