  text: וְ/נָתְנ֤וּ זִמַּתְ/כֶ֨נָה֙ עֲלֵי/כֶ֔ן וַ/חֲטָאֵ֥י גִלּוּלֵי/כֶ֖ן תִּשֶּׂ֑אינָה וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/049.yaml
  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
translation:
  language: pt
  text: Eles farão recair sobre vocês a devassidão de vocês, e vocês carregarão os pecados dos seus ídolos[a]. Então vocês saberão que eu sou o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é fortemente depreciativo e também pode ser expresso como “ídolos repugnantes” ou, de modo mais vívido, “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ ... עֲלֵיכֶן
  choice: farão recair sobre vocês
  rationale: Expressa de modo natural em português a construção נתן + עַל, mantendo a ideia judicial de fazer as consequências da conduta recaírem sobre as acusadas.
- source_word: זִמַּתְכֶנָה
  choice: a devassidão de vocês
  rationale: Em Ezequiel 23, זִמָּה tem forte sentido sexual e moral. “Devassidão” comunica a conduta sexual vergonhosa sem ampliar indevidamente o texto; a repetição “de vocês” evita a ambiguidade do possessivo “sua”.
- source_word: וַחֲטָאֵי
  choice: e ... os pecados
  rationale: Mantém o sentido comum de חַטָּאִים e a ligação explícita entre a idolatria e a culpa suportada.
- source_word: גִלּוּלֵיכֶן
  choice: dos seus ídolos
  rationale: “Ídolos” é claro e corrente no texto principal. O tom fortemente depreciativo do termo hebraico é registrado em nota.
- source_word: תִּשֶּׂאינָה
  choice: vocês carregarão
  rationale: Preserva a imagem concreta de נשׂא, isto é, carregar ou suportar os próprios pecados e suas consequências, sem reduzi-la apenas a “sofrer”.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: “Então” apresenta naturalmente a relação de sequência e resultado no encerramento da declaração de juízo.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor YHWH
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e conserva este último de forma transparente, sem substituir o nome por outro título.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי יְהוִה
  choice: o Senhor YHWH
  alternative: o Senhor Yahweh / o Soberano SENHOR
  rationale: A forma escolhida preserva a distinção presente no hebraico entre o título “Senhor” e o nome divino, sem impor uma vocalização reconstruída nem repetir “Senhor”.
- issue: Sentido de carregar os pecados
  choice: vocês carregarão os pecados
  alternative: vocês sofrerão o castigo pelos pecados
  rationale: A tradução mantém a tensão do hebraico entre carregar a culpa e suportar suas consequências, evitando resolver a expressão em uma explicação teológica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” reproduz o plural dirigido às duas figuras femininas do contexto, embora não marque gênero em português. A repetição “de vocês” é intencional para evitar a ambiguidade de “sua devassidão”.
