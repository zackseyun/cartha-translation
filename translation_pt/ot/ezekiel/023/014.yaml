  text: וַ/תּ֖וֹסֶף אֶל תַּזְנוּתֶ֑י/הָ וַ/תֵּ֗רֶא אַנְשֵׁי֙ מְחֻקֶּ֣ה עַל הַ/קִּ֔יר צַלְמֵ֣י כשדיים חֲקֻקִ֖ים בַּ/שָּׁשַֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/014.yaml
  text: Then she added to her acts of prostitution[a], and she saw men portrayed on the wall, images of Chaldeans portrayed in vermilion[b],
translation:
  language: pt
  text: Então ela acrescentou às suas prostituições e viu homens retratados na parede, imagens de caldeus[a] desenhadas em vermelhão[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “babilônios”; o hebraico diz “caldeus”, povo associado à Babilônia.
    reason: lexical_alternative
  - marker: b
    text: “Vermelhão” é um pigmento vermelho vivo; também se pode traduzir “pigmento vermelho”, possivelmente cinábrio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶל תַּזְנוּתֶיהָ
  choice: Então ela acrescentou ainda mais aos seus atos de prostituição
  rationale: Preserva a ideia hebraica de acrescentar à conduta anterior e mantém a metáfora sexual deliberadamente forte de Ezequiel, sem reduzi-la à abstração de simples infidelidade.
- source_word: וַתֵּרֶא אַנְשֵׁי מְחֻקֶּה עַל הַקִּיר
  choice: e viu homens representados na parede
  rationale: O verbo ראה significa diretamente “ver”, e מְחֻקֶּה indica figuras inscritas ou retratadas; “representados” comunica a imagem visual sem especificar indevidamente a técnica.
- source_word: צַלְמֵי כשדיים
  choice: imagens de caldeus
  rationale: Mantém o etnônimo do hebraico; “babilônios” é uma explicação contextual válida, registrada em nota.
- source_word: חֲקֻקִים
  choice: traçadas
  rationale: O particípio pode indicar imagens gravadas ou inscritas. Como há aplicação de pigmento, “traçadas” conserva a noção de delineamento sem pressupor exclusivamente entalhe em pedra.
- source_word: בַּשָּׁשַׁר
  choice: com vermelhão
  rationale: שָׁשַׁר designa um pigmento vermelho vivo, possivelmente cinábrio. “Vermelhão” é conciso e adequado, enquanto a incerteza material fica preservada em nota.
theological_decisions:
- issue: Linguagem sexual metafórica para a infidelidade da aliança
  choice: atos de prostituição
  alternative: infidelidade
  rationale: A imagem sexual chocante é intencional na profecia e representa tanto idolatria quanto alianças políticas; a tradução mantém sua força e não resolve a metáfora em uma interpretação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição ligada às imagens foi suavizada apenas o necessário para naturalidade, sem eliminar a distinção entre os homens representados e as imagens traçadas. A vírgula final acompanha a continuidade sintática para o versículo seguinte.
