id: EZK.23.45
reference: Ezekiel 23:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנָשִׁ֣ים צַדִּיקִ֗ם הֵ֚מָּה יִשְׁפְּט֣וּ אֽוֹתְ/הֶ֔ם מִשְׁפַּט֙ נֹֽאֲפ֔וֹת וּ/מִשְׁפַּ֖ט שֹׁפְכ֣וֹת דָּ֑ם כִּ֤י נֹֽאֲפֹת֙ הֵ֔נָּה וְ/דָ֖ם בִּֽ/ידֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/045.yaml
  text: But righteous men will judge them with the judgment of adulteresses and with the judgment of women who shed blood[a], because they are adulteresses[b], and blood is on their hands.
translation:
  language: pt
  text: Mas homens justos — eles mesmos — as julgarão segundo a sentença das adúlteras e a sentença das mulheres que derramam sangue[a], porque elas são adúlteras, e há sangue em suas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de acordo com a sentença prevista para as adúlteras e para as mulheres que derramam sangue”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “há sangue em suas mãos” indica culpa por derramamento de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲנָשִׁים צַדִּיקִים הֵמָּה
  choice: Mas homens justos — eles mesmos —
  rationale: אֲנָשִׁים é explicitamente masculino, e צַדִּיקִים reúne o sentido moral e judicial de 'justos'. O ו inicial admite valor adversativo no contexto. O pronome independente הֵמָּה recebe expressão enfática natural em português.
- source_word: יִשְׁפְּטוּ אוֹתְהֶם
  choice: as julgarão
  rationale: O imperfeito tem valor futuro no anúncio profético. Embora o sufixo hebraico seja formalmente masculino, o referente contextual são as duas mulheres/cidades, por isso o português exige o objeto feminino 'as'.
- source_word: מִשְׁפַּט נֹאֲפוֹת
  choice: segundo a sentença das adúlteras
  rationale: מִשְׁפָּט tem aqui sentido jurídico de julgamento ou sentença. A construção preserva a formulação compacta do hebraico sem decidir no corpo do texto se é a sentença pronunciada sobre elas ou a norma aplicada a essa categoria.
- source_word: וּמִשְׁפַּט שֹׁפְכוֹת דָּם
  choice: e a sentença das mulheres que derramam sangue
  rationale: O particípio feminino plural שֹׁפְכוֹת é explicitado com naturalidade e conserva a imagem concreta do derramamento de sangue.
- source_word: כִּי נֹאֲפֹת הֵנָּה
  choice: porque elas são adúlteras
  rationale: כִּי introduz a razão da sentença, e o predicado feminino plural é mantido como categoria moral e jurídica.
- source_word: וְדָם בִּידֵיהֶן
  choice: e há sangue em suas mãos
  rationale: A tradução conserva de perto a preposição ב, 'em', e a metáfora hebraica, deixando a nota esclarecer seu sentido de culpa por derramamento de sangue.
theological_decisions:
- issue: Identidade dos agentes do julgamento
  choice: Manter 'homens justos' como agentes humanos dentro da imagem judicial
  alternative: Entendê-los como agentes celestiais ou idealizados do juízo divino
  rationale: O hebraico diz literalmente 'homens justos'. A tradução não acrescenta uma identificação teológica que o versículo não explicita.
- issue: Natureza da sentença das adúlteras e das que derramam sangue
  choice: Preservar a formulação genitiva 'sentença das...' no texto, com esclarecimento em nota
  alternative: Explicitar diretamente 'a sentença prevista para...'
  rationale: A construção hebraica pode indicar a sentença própria ou destinada a essas culpadas. A redação e a nota preservam essa nuance jurídica sem sobreinterpretá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção enfática 'eles mesmos' reproduz הֵמָּה; 'sentença' mantém o campo jurídico. Todos os marcadores de nota aparecem no texto.
