  yaml_path: translation/ot/ezekiel/023/043.yaml
  text: Then I said of her, worn out by adulteries, ‘Now they will commit her prostitution with her, and she herself as well.’
translation:
  language: pt
  text: 'Então eu disse a respeito dela, desgastada pelos adultérios: “Agora praticarão com ela a prostituição dela, e ela também.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deste trecho é obscuro. Outra compreensão possível, completando a elipse final, é: “Agora se prostituirão com ela, e ela com eles.”'
    reason: Sinaliza a dificuldade sintática e a elipse final sem acrescentar a ideia de continuidade, que não está expressa no hebraico.
lexical_decisions:
- source_word: לַבָּלָה נִאֻפִים
  choice: a respeito dela, desgastada pelos adultérios
  rationale: Mantém a construção concisa e a imagem de alguém consumida ou exaurida por uma vida de adultérios, sem acrescentar um sujeito não expresso.
- source_word: תַזְנוּתֶהָ
  choice: a prostituição dela
  rationale: Reproduz o substantivo com o sufixo possessivo feminino, apesar da formulação incomum, em vez de reduzi-lo simplesmente a «prostituição».
- source_word: וָהִיא
  choice: e ela também
  rationale: Preserva a frase final elíptica do hebraico, sem completar de modo especulativo aquilo que o texto deixa implícito.
theological_decisions:
- issue: Agência e sentido da frase final
  choice: Preservar «e ela também» como expressão elíptica
  alternative: Explicitar «e ela se prostituirá com eles»
  rationale: O texto hebraico é sintaticamente difícil e termina apenas com «e ela»; explicitar a ação resolveria uma ambiguidade genuína sem apoio suficiente.
translation_notes:
  register: Português moderno, digno e acessível. A formulação deliberadamente incomum «a prostituição dela» acompanha de perto o hebraico; a nota registra a obscuridade do trecho.
