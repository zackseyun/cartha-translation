  text: וַ/יָּבֹ֨אוּ אֵלֶ֤י/הָ בְנֵֽי בָבֶל֙ לְ/מִשְׁכַּ֣ב דֹּדִ֔ים וַ/יְטַמְּא֥וּ אוֹתָ֖/הּ בְּ/תַזְנוּתָ֑/ם וַ/תִּ֨טְמָא בָ֔/ם וַ/תֵּ֥קַע נַפְשָׁ֖/הּ מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/017.yaml
  text: Then the sons of Babylon came to her[a], to the bed of love, and they defiled her with their prostitution; and she was defiled by them[c][b], and her soul was alienated from them.
translation:
  language: pt
  text: Então os filhos da Babilônia vieram até ela[a], para o leito de amores[b], e a contaminaram com a prostituição deles. Ela ficou contaminada por eles e passou a sentir repulsa por eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os babilônios” ou “os homens da Babilônia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para um leito de relações amorosas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “a alma dela se afastou deles” ou “ela passou a detestá-los”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בָבֶל
  choice: os filhos da Babilônia
  rationale: Mantém de modo inteligível a expressão hebraica formal; no contexto, designa os babilônios, provavelmente os homens da Babilônia.
- source_word: לְמִשְׁכַּב דֹּדִים
  choice: para o leito de amores
  rationale: Preserva a imagem de leito e o sentido erótico de דֹּדִים sem explicitar além do necessário.
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: a contaminaram
  rationale: Comunica com naturalidade a ideia de tornar impura ou profanar, preservando a força moral e ritual do verbo טמא.
- source_word: בְּתַזְנוּתָם
  choice: com a prostituição deles
  rationale: Mantém a metáfora sexual explícita de זְנוּת, que em Ezequiel também representa infidelidade política e religiosa.
- source_word: וַתִּטְמָא בָם
  choice: ela ficou contaminada por eles
  rationale: Conserva a repetição deliberada da raiz טמא e representa בָם como agência ou meio.
- source_word: וַתֵּקַע נַפְשָׁהּ מֵהֶם
  choice: passou a sentir repulsa por eles
  rationale: Expressa em português atual o movimento de aversão e afastamento contido no idioma hebraico com נֶפֶשׁ, sem reduzir a expressão a mera separação física.
theological_decisions:
- issue: Imagem sexual e moral na alegoria profética
  choice: Manter a metáfora explícita de prostituição e contaminação.
  alternative: Reformular o texto apenas como referência a alianças políticas.
  rationale: A retórica hebraica retrata deliberadamente a infidelidade política e espiritual por meio de linguagem sexual; suavizá-la eliminaria um elemento central do texto.
- issue: Sentido do afastamento final
  choice: Traduzir o idioma como repulsa, registrando em nota a formulação mais literal e a possibilidade de afastamento.
  alternative: Traduzir somente como alienação ou afastamento emocional.
  rationale: O paralelo em Ezequiel e o uso contextual indicam aversão, mas a construção hebraica também comporta a noção de afastamento; a nota preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “contaminar” reproduz a insistência do hebraico; “leito de amores” conserva o caráter poético e sexual da imagem profética.
