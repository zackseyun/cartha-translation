  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «YHWH»; tradicionalmente traduzido como «SENHOR» em muitas versões.'
    reason: Informa a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה, ligada por waw, introduz a sequência profética. Em português, a fórmula natural «A palavra ... veio» preserva o fluxo sem reproduzir literalmente «e aconteceu».
- source_word: דְבַר
  choice: a palavra
  rationale: דָּבָר, nesta fórmula profética, designa a palavra ou mensagem divina. «A palavra» conserva a expressão tradicional e a relação de construção com o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição com o sufixo da primeira pessoa indica que a palavra foi dirigida ao profeta; «a mim» é claro e idiomático.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala divina que vem em seguida. «Dizendo» mantém de modo conciso essa função.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, enquanto «SENHOR» o substitui por um título; «Jeová» representa outra forma tradicional.
translation_notes:
  register: Português moderno, claro e digno, com formulação profética reconhecível. O conectivo inicial hebraico não foi expresso separadamente, pois a fórmula «A palavra ... veio» transmite naturalmente sua função discursiva em português.
