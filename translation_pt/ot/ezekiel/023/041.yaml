base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/041.yaml
  text: You sat on a splendid couch[a], with a table set before it, and on it you placed my incense and my oil.
translation:
  language: pt
  text: Você se sentou num divã suntuoso, com uma mesa posta diante dele; sobre ela[a] você colocou o meu incenso e o meu óleo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, os sufixos em “diante dele” e “sobre ela” são femininos e têm referência algo ambígua. Podem ser entendidos de modo diferente, por exemplo, em relação à mulher, ao divã e à mesa.
    reason: alternative_reading
lexical_decisions:
- source_word: יָשַׁבְתְּ
  choice: você se sentou
  rationale: O qal perfeito na segunda pessoa feminina singular descreve diretamente a ação da mulher personificada; a forma pronominal é natural em português.
- source_word: מִטָּה כְבוּדָּה
  choice: leito suntuoso
  rationale: מִטָּה pode indicar cama ou lugar para reclinar-se, enquanto כְבוּדָּה comunica imponência e luxo. “Leito suntuoso” preserva tanto a dignidade do registro quanto a cena de opulência.
- source_word: שֻׁלְחָן עָרוּךְ
  choice: uma mesa posta
  rationale: O particípio passivo עָרוּךְ indica algo preparado ou arrumado; “mesa posta” é idiomático e mantém a imagem de uma mesa preparada.
- source_word: לְפָנֶיהָ
  choice: diante dele
  rationale: A tradução toma o sufixo como referência ao leito, formando a imagem espacial de uma mesa posta diante dele. O gênero gramatical português exige “dele”, embora o sufixo hebraico seja feminino.
- source_word: קְטָרְתִּי
  choice: o meu incenso
  rationale: O sufixo de primeira pessoa singular é preservado, destacando que o incenso pertencente a Deus foi usado nessa cena.
- source_word: שַׁמְנִי
  choice: o meu óleo
  rationale: Mantém a expressão hebraica concisa sem acrescentar a especificação “da unção”, que não aparece no texto.
- source_word: שַׂמְתְּ עָלֶיהָ
  choice: sobre ela você colocou
  rationale: A formulação preserva a ação concreta de colocar os objetos sobre a mesa, antecedente feminino natural em português.
theological_decisions:
- issue: Referência dos sufixos femininos em לְפָנֶיהָ e עָלֶיהָ
  choice: O primeiro é entendido como referência ao leito e o segundo, à mesa.
  alternative: Os sufixos podem ser relacionados à mulher ou distribuídos de outra maneira entre a mulher, o leito e a mesa.
  rationale: 'Essa leitura produz uma cena espacial coerente: a mesa está diante do leito, e o incenso e o óleo são colocados sobre a mesa. Como a sintaxe hebraica admite alguma ambiguidade, a alternativa é preservada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Leito suntuoso” mantém o tom elevado e a imagem de luxo; a ordem da última oração conserva a ênfase nos objetos pertencentes a Deus sem soar artificial.
