  text: וְ/אֶת תַּזְנוּתֶ֤י/הָ מִ/מִּצְרַ֨יִם֙ לֹ֣א עָזָ֔בָה כִּ֤י אוֹתָ/הּ֙ שָׁכְב֣וּ בִ/נְעוּרֶ֔י/הָ וְ/הֵ֥מָּה עִשּׂ֖וּ דַּדֵּ֣י בְתוּלֶ֑י/הָ וַ/יִּשְׁפְּכ֥וּ תַזְנוּתָ֖/ם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/008.yaml
  text: Yet she did not abandon her prostitutions from Egypt[a], for in her youth they had lain with her[b], and they fondled her virgin breasts and poured out their prostitution upon her.
translation:
  language: pt
  text: Contudo, ela não abandonou suas prostituições vindas do Egito[a], pois, na sua juventude, eles se deitaram com ela, apalparam os seus seios virginais[b] e derramaram sobre ela a prostituição deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas prostituições do Egito”. O hebraico emprega ao longo do versículo a mesma imagem de prostituição para representar infidelidade à aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “fizeram/apalparam os seios da sua virgindade”, imagem sexual explícita ligada à sua juventude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּזְנוּתֶיהָ
  choice: suas prostituições
  rationale: O substantivo plural retrata atos repetidos de prostituição e, na metáfora profética, a infidelidade à aliança; a formulação conserva a força chocante do hebraico.
- source_word: מִמִּצְרַיִם
  choice: vindas do Egito
  rationale: A preposição מן indica com naturalidade a origem dessas prostituições; explicitar 'vindas' torna essa relação clara em português.
- source_word: עָזָבָה
  choice: não abandonou
  rationale: Expressa que ela não deixou nem renunciou às práticas anteriores.
- source_word: שָׁכְבוּ אוֹתָהּ
  choice: eles se deitaram com ela
  rationale: Preserva o eufemismo sexual do hebraico de forma clara e digna em português atual.
- source_word: בִּנְעוּרֶיהָ
  choice: na sua juventude
  rationale: Mantém a expressão temporal e sua referência metafórica ao período inicial da história de Israel.
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֶיהָ
  choice: apalparam os seios da sua virgindade
  rationale: Conserva a imagem sexual explícita e objetificante, sem acrescentar detalhes que não estejam no hebraico; a construção incomum 'seios da sua virgindade' reflete a formulação original.
- source_word: וַיִּשְׁפְּכוּ
  choice: derramando
  rationale: Retém a metáfora concreta de 'derramar' e liga naturalmente a última oração às ações anteriores.
- source_word: תַזְנוּתָם
  choice: a prostituição deles
  rationale: Mantém a correspondência lexical com תַּזְנוּתֶיהָ e preserva a tensão da atribuição dessa prostituição aos homens.
- source_word: עָלֶיהָ
  choice: sobre ela
  rationale: É a equivalência portuguesa natural de עַל e preserva a imagem vívida.
theological_decisions:
- issue: Metáfora profética sexualizada para idolatria e alianças políticas
  choice: Manter explícitas no texto as imagens de prostituição, relações sexuais e contato com os seios.
  alternative: Substituí-las por termos abstratos como 'imoralidade' ou 'infidelidade'.
  rationale: Ezequiel emprega deliberadamente linguagem sexual gráfica para representar infidelidade à aliança e vínculos estrangeiros; suavizá-la apagaria parte essencial da retórica profética.
- issue: Possível conotação de exploração na juventude
  choice: Traduzir literalmente a ação sem inserir no corpo do versículo uma classificação jurídica ou psicológica.
  alternative: Explicitar 'abusaram dela' ou 'exploraram-na sexualmente'.
  rationale: O contexto e a imagem são objetificantes, mas o versículo não formula diretamente essa classificação; a tradução preserva a tensão sem resolver além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A linguagem gráfica do profeta foi preservada sem vulgarização. 'Contudo' mantém o contraste; 'se deitaram com ela' conserva o eufemismo sexual; as notas esclarecem as construções hebraicas incomuns.
