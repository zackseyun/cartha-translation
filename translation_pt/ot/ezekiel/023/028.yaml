source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִי֙ נֹֽתְנָ֔/ךְ בְּ/יַ֖ד אֲשֶׁ֣ר שָׂנֵ֑את בְּ/יַ֛ד אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Eis que estou entregando você nas mãos daqueles que você odeia, nas mãos daqueles de quem a sua alma se afastou[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “daqueles que a sua alma rejeitou com repulsa” ou “daqueles de quem a sua alma se desprendeu”. A expressão hebraica é vívida e pode indicar profundo afastamento, ruptura ou aversão.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva o caráter solene e enfático do anúncio profético em linguagem digna e ainda reconhecível no português atual.
- source_word: נֹתְנָךְ
  choice: estou entregando você
  rationale: A construção com הִנְנִי e o particípio apresenta uma ação iminente ou já posta em curso. “Estou entregando” comunica esse aspecto e, neste contexto, explicita naturalmente a transferência ao poder de inimigos.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a metáfora hebraica de ficar sob o controle de alguém, usando a forma idiomática corrente em português.
- source_word: אֲשֶׁר שָׂנֵאת
  choice: aqueles que você odeia
  rationale: O verbo está na segunda pessoa feminina singular e se dirige à personagem que representa Jerusalém. “Você odeia” transmite diretamente a relação hostil sem exigir marcação de gênero no pronome.
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: aqueles de quem a sua alma se afastou
  rationale: Preserva נֶפֶשׁ como “alma” e mantém a imagem vívida de profundo afastamento, sem decidir de modo excessivo entre estranhamento, ruptura e repulsa.
theological_decisions:
- issue: Representação do nome divino na fórmula אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva tanto o título “Senhor” quanto o nome pessoal divino Yahweh, refletindo os dois elementos distintos do hebraico e evitando ocultar o Tetragrama sob um título substituto.
- issue: Força do juízo expresso por נֹתְנָךְ בְּיַד
  choice: estou entregando você nas mãos
  alternative: estou dando você na mão
  rationale: “Entregando” expressa, sem acréscimo doutrinário, que Deus põe Jerusalém sob o poder daqueles que ela odeia; “nas mãos” mantém a metáfora de domínio presente no texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição “nas mãos daqueles” reproduz a ênfase retórica do hebraico. O tratamento por “você” torna a fala direta natural sem apagar que, no contexto, a destinatária gramatical é feminina.
