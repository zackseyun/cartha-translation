  naturalness: «Ao vê-los» é moderno e natural. «Ela teve desejo ardente por eles» comunica melhor a força erótica sem recorrer a formulação vulgar ou arcaica. «Enviou mensageiros a eles, para a Caldeia» mantém os dois complementos do hebraico e é mais claro do que «até eles, à Caldeia».
  terminology: «Mensageiros» é apropriado para מַלְאָכִים e preserva possível nuance diplomática sem a impor. «Caldeia» é uma designação geográfica adequada para כַּשְׂדִּימָה. A nota deve apresentar a leitura literal de לְמַרְאֵה עֵינֶיהָ como alternativa, não caracterizar «ao vê-los» como mera alternativa quando é a redação principal.
