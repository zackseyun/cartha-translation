  text: At the sight of her eyes[b][a], she lusted after them and sent messengers to them in Chaldea.
translation:
  language: pt
  text: Ao vê-los[a], ela teve desejo ardente por eles e enviou mensageiros a eles, para a Caldeia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «à vista de seus olhos»; também pode significar «ao vê-los».
    reason: lexical_alternative
  - marker: b
    text: Ou «aos caldeus» ou «à terra dos caldeus». A forma hebraica tem uma terminação que indica direção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגַּב עֲלֵיהֶם
  choice: ela se encheu de desejo por eles
  rationale: O verbo עגב, com עַל marcando o objeto, expressa desejo intenso e de caráter erótico neste contexto. A formulação mantém a força da metáfora de infidelidade sem recorrer a linguagem arcaica.
- source_word: לְמַרְאֵה עֵינֶיהָ
  choice: Ao vê-los
  rationale: A expressão é literalmente «à vista de seus olhos», mas funciona idiomaticamente como referência ao que ela viu. «Ao vê-los» comunica com naturalidade a ligação imediata entre visão e desejo.
- source_word: וַתִּשְׁלַח מַלְאָכִים
  choice: e enviou mensageiros
  rationale: מַלְאָכִים designa mensageiros e pode incluir emissários diplomáticos; «mensageiros» preserva o sentido amplo sem especificar uma função oficial não explicitada.
- source_word: אֲלֵיהֶם
  choice: até eles
  rationale: A preposição אֶל indica os destinatários em direção aos quais os mensageiros foram enviados.
- source_word: כַּשְׂדִּימָה
  choice: à Caldeia
  rationale: A terminação direcional indica movimento rumo à região ou ao território dos caldeus. «À Caldeia» expressa o destino de modo conciso, enquanto a nota registra a possível referência aos próprios caldeus.
theological_decisions:
- issue: Metáfora sexualizada da infidelidade política e religiosa
  choice: 'Manter linguagem explícita de desejo intenso: «se encheu de desejo por eles»'
  alternative: «ficou encantada com eles» ou «se apaixonou por eles»
  rationale: Ezequiel emprega deliberadamente imagens eróticas fortes para denunciar a infidelidade. Suavizá-las reduziria a força retórica e teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção preserva a intensidade erótica do original e registra em notas as formulações hebraicas cuja reprodução literal seria pouco natural.
