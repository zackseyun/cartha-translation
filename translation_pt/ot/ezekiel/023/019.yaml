  text: וַ/תַּרְבֶּ֖ה אֶת תַּזְנוּתֶ֑י/הָ לִ/זְכֹּר֙ אֶת יְמֵ֣י נְעוּרֶ֔י/הָ אֲשֶׁ֥ר זָנְתָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/019.yaml
  text: Yet she multiplied her prostitutions[a], remembering the days of her youth, when she prostituted herself in the land of Egypt.
translation:
  language: pt
  text: Contudo, ela multiplicou seus atos de prostituição[a], lembrando-se dos dias da sua juventude, quando se prostituiu na terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ela aumentou suas prostituições.”'
    reason: Alternativa lexical que conserva de modo mais formal a conjunção narrativa e o substantivo plural hebraico.
lexical_decisions:
- source_word: וַתַּרְבֶּה
  choice: Contudo, ela multiplicou
  rationale: O verbo רבה no hifil expressa aumento ou multiplicação. “Multiplicou” preserva sua força concreta; “contudo” comunica o valor adversativo que a conjunção narrativa assume no contexto, pois a conduta prossegue apesar do juízo anterior.
- source_word: תַּזְנוּתֶיהָ
  choice: seus atos de prostituição
  rationale: O substantivo plural derivado de זנה indica atos repetidos de prostituição e, na metáfora profética de Ezequiel, infidelidade política e pactual. A expressão é clara em português atual e mantém tanto a imagem explícita quanto o valor plural.
- source_word: לִזְכֹּר
  choice: lembrando-se
  rationale: O infinitivo com ל pode indicar circunstância concomitante ou finalidade. O gerúndio mantém essa relação aberta e liga naturalmente o aumento dos atos à recordação do passado.
- source_word: יְמֵי נְעוּרֶיהָ
  choice: os dias da sua juventude
  rationale: Preserva o idioma hebraico e a referência à fase inicial de sua história, sem restringir indevidamente o sentido a “meninice”.
- source_word: אֲשֶׁר זָנְתָה
  choice: quando se prostituiu
  rationale: Mantém o verbo-chave זנה e torna explícito, de modo idiomático em português, que ela própria praticou a prostituição.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Conserva a expressão geográfica hebraica e sua ressonância histórica, permanecendo natural e inteligível.
theological_decisions:
- issue: Metáfora sexual profética para idolatria e infidelidade política
  choice: Manter explicitamente a linguagem de prostituição
  alternative: Suavizar como “infidelidade” ou “imoralidade”
  rationale: Ezequiel emprega deliberadamente uma imagem sexual contundente para retratar apostasia pactual e política. Suavizá-la reduziria a força retórica do texto e ocultaria a metáfora, sem que a tradução precise acrescentar uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a imagem forte do hebraico sem arcaísmos; “atos de prostituição” soa mais natural do que o plural isolado “prostituições” no texto principal.
