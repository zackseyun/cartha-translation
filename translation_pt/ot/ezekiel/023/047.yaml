base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/047.yaml
  text: And the assembly will stone them with stones and cut them down with their swords. They will kill their sons and their daughters[a], and burn their houses with fire.
translation:
  language: pt
  text: E a assembleia as apedrejará com pedras e as retalhará[a] com suas espadas. Eles matarão seus filhos e suas filhas e queimarão suas casas com fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as abaterá” ou “as despedaçará com suas espadas”.'
    reason: Alternativa lexical para וּבָרֵא, cujo sentido pode envolver cortar, abater ou despedaçar.
lexical_decisions:
- source_word: וְרָגְמוּ עֲלֵיהֶן אֶבֶן
  choice: as apedrejará com pedras
  rationale: רגם indica apedrejamento ou ataque com pedras; אֶבֶן, embora singular, tem sentido coletivo e instrumental. Em português, “apedrejar com pedras” preserva a ênfase explícita do hebraico.
- source_word: קָהָל
  choice: a assembleia
  rationale: קָהָל designa um grupo reunido e, neste contexto punitivo, “assembleia” conserva melhor o tom formal do que “multidão”.
- source_word: וּבָרֵא אוֹתְהֶן
  choice: e as retalhará
  rationale: O Piel de ברא exprime cortar ou despedaçar. “Retalhar” comunica de modo claro a violência exercida com espadas, sem suavizar a imagem.
- source_word: בְּחַרְבוֹתָם
  choice: com suas espadas
  rationale: O בְּ é instrumental, e o sufixo masculino plural identifica as espadas dos integrantes da assembleia atacante.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: A tradução mantém a distinção explícita do hebraico entre filhos e filhas, em vez de reduzi-la ao termo genérico “filhos” ou “crianças”.
- source_word: יַהֲרֹגוּ
  choice: matarão
  rationale: הרג é o verbo comum para matar; “matarão” é direto, atual e adequado ao registro.
- source_word: וּבָתֵּיהֶן
  choice: suas casas
  rationale: בָּתִּים refere-se concretamente a casas; a escolha preserva a imagem material da destruição.
- source_word: בָּאֵשׁ יִשְׂרֹפוּ
  choice: queimarão suas casas no fogo
  rationale: A formulação mantém a menção enfática e explícita ao fogo presente no hebraico, embora o português também pudesse dizer simplesmente “incendiarão”.
theological_decisions:
- issue: Referente dos pronomes femininos plurais
  choice: Mantidos como “as” e “suas”, sem identificar novamente as mulheres no corpo do versículo
  alternative: Explicitar “essas mulheres”
  rationale: Os pronomes hebraicos retomam Oolá e Oolibá na alegoria. Preservar a referência pronominal mantém a coesão do texto-fonte e evita acrescentar identificação interpretativa ausente neste versículo.
- issue: Concordância com o coletivo קָהָל
  choice: Singular com “a assembleia” na primeira oração e plural implícito em “matarão” e “queimarão” nas seguintes
  alternative: Uniformizar todos os verbos no singular ou traduzir קָהָל por um substantivo plural
  rationale: O hebraico combina o substantivo coletivo singular com formas verbais plurais. A alternância portuguesa preserva essa tensão entre a assembleia como unidade e seus integrantes como agentes.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se o “E” inicial para refletir a continuidade do discurso. A violência concreta do original não foi atenuada.
