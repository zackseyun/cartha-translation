  terminology: “Assembleia”, “apedrejará”, “retalhará”, “filhos e filhas” e “casas” são escolhas adequadas. “Retalhar” é forte, mas condiz com a imagem violenta do contexto e com o campo semântico possível de ברא; a nota preserva alternativas menos específicas.
