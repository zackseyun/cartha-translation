  text: וַ/יָּב֣וֹא אֵלֶ֔י/הָ כְּ/ב֖וֹא אֶל אִשָּׁ֣ה זוֹנָ֑ה כֵּ֣ן בָּ֗אוּ אֶֽל אָֽהֳלָה֙ וְ/אֶל אָ֣הֳלִיבָ֔ה אִשֹּׁ֖ת הַ/זִּמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/044.yaml
  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
translation:
  language: pt
  text: Ele foi até ela[a] como quem vai a uma prostituta; assim eles foram até Oolá e Oolibá, mulheres de depravação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico começa com um verbo no singular, “Ele foi”, e depois passa ao plural, “eles foram”. Também se pode traduzir de modo regularizado: “Eles foram até ela como quem vai a uma prostituta; assim foram até Oolá e Oolibá”.'
    reason: textual_variant
  - marker: b
    text: Ou “mulheres de conduta obscena”. A expressão hebraica diz literalmente “mulheres de depravação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֣וֹא אֵלֶ֔יהָ / בָּ֗אוּ אֶל
  choice: Ele foi até ela / eles foram até
  rationale: בוא אל significa literalmente ir ou vir até alguém e, neste contexto, contém uma clara conotação sexual. A formulação portuguesa mantém o movimento expresso no hebraico sem recorrer a uma expressão artificial como “entrar a ela”.
- source_word: כְּב֖וֹא אֶל אִשָּׁ֣ה זוֹנָ֑ה
  choice: como quem vai a uma prostituta
  rationale: A construção comparativa com o infinitivo descreve a maneira da aproximação. “Como quem vai” supre naturalmente em português o sujeito indefinido implícito, e “prostituta” é o equivalente moderno e direto de זוֹנָה.
- source_word: כֵּ֣ן
  choice: assim
  rationale: Marca a correspondência entre a comparação e a ação seguinte; “assim” é claro, conciso e digno em português.
- source_word: אָֽהֳלָה֙ ... אָ֣הֳלִיבָ֔ה
  choice: Oolá ... Oolibá
  rationale: Adotam-se formas transliteradas naturais em português para os nomes próprios hebraicos, sem traduzir o significado dos nomes.
- source_word: אִשֹּׁ֖ת הַזִּמָּֽה
  choice: mulheres de depravação
  rationale: A expressão genitiva hebraica comunica conduta sexual infame, perversa ou obscena. “Mulheres de depravação” conserva sua forma e seu forte peso moral sem restringir indevidamente o termo a mero comportamento provocante.
theological_decisions:
- issue: Alternância de número no verbo inicial
  choice: Preservar no texto a passagem do singular (“Ele foi”) para o plural (“eles foram”)
  alternative: 'Regularizar toda a frase no plural: “Eles foram até ela... assim foram até Oolá e Oolibá”'
  rationale: O texto massorético começa inequivocamente com um verbo masculino singular e depois passa ao plural. Embora o contexto favoreça uma referência coletiva aos amantes, conservar a alternância evita apagar uma dificuldade real do hebraico; a nota explica a possibilidade de regularização.
- issue: Força sexual de בוא אל
  choice: Traduzir literalmente como “ir até”, deixando a comparação com a prostituta comunicar a conotação sexual
  alternative: Explicitar como “ter relações com” ou empregar “entrar a”
  rationale: A primeira alternativa resolveria por paráfrase uma expressão figurada do original; a segunda seria pouco natural no português atual. A redação escolhida preserva a imagem e continua compreensível no contexto.
translation_notes:
  register: Português moderno, claro e digno, com formas legíveis no Brasil e compreensíveis internacionalmente. A construção mantém a crueza moral do contexto sem recorrer a vocabulário arcaico ou gratuitamente vulgar. A mudança de singular para plural foi preservada por ser uma característica significativa e ambígua do texto hebraico.
