  text: וָ/אֵ֖רֶא כִּ֣י נִטְמָ֑אָה דֶּ֥רֶךְ אֶחָ֖ד לִ/שְׁתֵּי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/013.yaml
  text: And I saw that she had become unclean[b][a]; both of them followed the same way.
translation:
  language: pt
  text: E vi que ela havia se tornado impura[a]; as duas seguiam o mesmo caminho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia sido contaminada” ou “havia se contaminado”. O verbo hebraico pode indicar uma condição passiva ou o estado de impureza resultante de sua conduta.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “um só caminho para as duas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: E vi
  rationale: O wayyiqtol de ראה na primeira pessoa do singular dá continuidade à sequência narrativa; “E vi” preserva de modo natural tanto a conjunção quanto a percepção do profeta.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo daquilo que foi visto, sendo naturalmente expresso em português pela conjunção integrante “que”.
- source_word: נִטְמָאָה
  choice: ela havia se tornado impura
  rationale: O nifal perfeito de טמא admite valor passivo ou resultativo. “Havia se tornado impura” conserva o estado resultante sem impor uma leitura estritamente passiva nem reflexiva.
- source_word: דֶּרֶךְ אֶחָד
  choice: o mesmo caminho
  rationale: A expressão indica um único modo de proceder compartilhado pelas duas; “o mesmo caminho” preserva a metáfora e soa natural em português.
- source_word: לִשְׁתֵּיהֶן
  choice: as duas
  rationale: A forma refere-se às duas irmãs e indica que o mesmo caminho pertencia a ambas; “as duas” comunica isso com clareza e concisão.
theological_decisions:
- issue: Impureza metafórica na alegoria de Oolá e Oolibá
  choice: Expressar a condição resultante como “havia se tornado impura”, preservando a linguagem moral e cultual sem explicá-la no corpo do versículo.
  alternative: “havia se contaminado” ou “fora contaminada”
  rationale: O contexto associa a impureza à infidelidade das personagens, mas a forma hebraica permite nuance passiva ou resultativa. A formulação escolhida mantém essa tensão e evita determinar além do texto se a ênfase recai sobre ação reflexiva ou condição sofrida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça junto da expressão que esclarece.
