  text: וַ/תְּגַל֙ תַּזְנוּתֶ֔י/הָ וַ/תְּגַ֖ל אֶת עֶרְוָתָ֑/הּ וַ/תֵּ֤קַע נַפְשִׁ/י֙ מֵֽ/עָלֶ֔י/הָ כַּ/אֲשֶׁ֛ר נָקְעָ֥ה נַפְשִׁ֖/י מֵ/עַ֥ל אֲחוֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/018.yaml
  text: She uncovered her prostitutions and uncovered her nakedness[a]; then my soul was repulsed by her[c][b], just as my soul had been repulsed by her sister.
translation:
  language: pt
  text: Ela expôs suas prostituições[a] e expôs sua nudez. Então minha alma se afastou dela com repulsa[b], assim como minha alma havia se afastado de sua irmã[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “revelou seus atos de prostituição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “minha alma sentiu repulsa por ela” ou “minha alma se alienou dela”; o hebraico expressa forte aversão e afastamento.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, Samaria (Oolá), sua irmã na alegoria apresentada no contexto.
    reason: cross_reference
lexical_decisions:
- source_word: וַתְּגַל
  choice: expôs
  rationale: Preserva a imagem concreta de descobrir ou deixar à vista e mantém o paralelismo deliberado das duas ocorrências do verbo.
- source_word: תַּזְנוּתֶיהָ
  choice: suas prostituições
  rationale: Mantém o plural e a linguagem sexual contundente da metáfora profética, sem recorrer a vocabulário arcaico.
- source_word: עֶרְוָתָהּ
  choice: sua nudez
  rationale: É uma tradução direta e natural que conserva a exposição sexual sugerida pelo contexto sem especificar indevidamente a anatomia.
- source_word: וַתֵּקַע / נָקְעָה
  choice: sentiu repulsa / havia sentido repulsa
  rationale: Comunica a forte reação de rejeição e recuo emocional. O mais-que-perfeito na segunda ocorrência deixa clara a anterioridade da reação em relação à irmã.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Preserva o idioma hebraico, sua intensidade retórica e a repetição presente no texto, em vez de reduzi-lo simplesmente a “eu”.
- source_word: מֵעָלֶיהָ
  choice: por ela
  rationale: Com “sentiu repulsa”, esta é a regência mais natural em português para indicar quem provoca a reação, embora o hebraico também permita exprimir afastamento.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Marca com clareza a comparação entre a rejeição desta mulher e a rejeição anterior de sua irmã.
- source_word: אֲחוֹתָהּ
  choice: sua irmã
  rationale: Reproduz diretamente a relação familiar dentro da alegoria das duas irmãs.
theological_decisions:
- issue: Linguagem sexual como metáfora da infidelidade à aliança
  choice: Manter “prostituições” e “nudez” no texto principal
  alternative: Suavizar para “infidelidades” ou “vergonha”
  rationale: Ezequiel emprega de propósito imagens sexuais explícitas para denunciar idolatria e alianças políticas infiéis. Suavizá-las reduziria a força profética e substituiria tradução por interpretação.
- issue: Linguagem antropopática para a reação de Deus
  choice: Preservar “minha alma sentiu repulsa”
  alternative: Traduzir apenas “afastei-me dela” ou “rompi com ela”
  rationale: O hebraico atribui a Deus uma reação pessoal intensa. A formulação conserva essa tensão e vivacidade sem explicá-la ou atenuá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “expôs” e de “minha alma” foi mantida por seu valor retórico no hebraico. A linguagem explícita foi preservada sem intensificação nem eufemismo.
