  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הַעֲלֵ֤ה עֲלֵי/הֶם֙ קָהָ֔ל וְ/נָתֹ֥ן אֶתְ/הֶ֖ן לְ/זַעֲוָ֥ה וְ/לָ/בַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/046.yaml
  text: 'For thus says the Lord GOD: Bring up an assembly against them[a], and give them over to terror and plunder.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Faça vir contra elas uma multidão e entregue-as ao terror e ao saque[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entregue-as para horror e para saque”. O substantivo hebraico זַעֲוָה também pode ser traduzido por “horror”, destacando que elas se tornam objeto de espanto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e representa explicitamente o nome divino, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: הַעֲלֵה
  choice: Faça vir
  rationale: O imperativo hifil de עלה manda suscitar ou trazer uma força contra as mulheres; “faça vir” é natural em português e mantém o valor causativo.
- source_word: קָהָל
  choice: uma multidão
  rationale: קָהָל designa um grupo reunido. “Multidão” comunica um contingente reunido sem acrescentar explicitamente um caráter militar que o substantivo, por si só, não exige.
- source_word: וְנָתֹן
  choice: e entregue-as
  rationale: A forma prossegue a sequência de ordens. “Entregue-as” expressa de modo idiomático a ideia de colocá-las sob o juízo descrito.
- source_word: לְזַעֲוָה
  choice: ao terror
  rationale: זַעֲוָה pode indicar terror, horror ou aquilo que causa espanto. “Ao terror” preserva a formulação concisa e a ambiguidade entre experiência aterradora e estado de devastação.
- source_word: לָבַז
  choice: e ao saque
  rationale: בַּז significa despojo ou saque; neste contexto, “saque” comunica com clareza o destino de serem pilhadas.
- source_word: עֲלֵיהֶם / אֶתְהֶן
  choice: contra elas ... entregue-as
  rationale: O contexto identifica Oolá e Oolibá. O português permite tornar explícito o referente feminino, embora não reproduza a mudança do plural masculino em עֲלֵיהֶם para o feminino em אֶתְהֶן.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: “O Senhor Yahweh” distingue o título אֲדֹנָי do nome pessoal יהוה e preserva o nome da aliança sem introduzir uma interpretação denominacional.
- issue: Agente implícito dos imperativos
  choice: Manter as ordens na segunda pessoa sem identificar o destinatário
  alternative: Paráfrase impessoal, como “Que se faça vir”
  rationale: O hebraico contém imperativos, mas o destinatário não é nomeado neste versículo. A tradução conserva essa tensão em vez de determinar quem executará o juízo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A fala divina foi marcada por aspas; o feminino foi explicitado por causa das duas mulheres figurativas do contexto.
