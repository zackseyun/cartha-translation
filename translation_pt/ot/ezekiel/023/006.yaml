translation:
  language: pt
  text: vestidos de azul[a], governadores e altos funcionários[b], todos eles jovens atraentes[c], cavaleiros montados em cavalos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestidos de violeta” ou “vestidos de azul-púrpura”, pois תְכֵלֶת pode designar um tecido tingido de azul-violeta.
    reason: lexical_alternative
  - marker: b
    text: “Altos funcionários” também pode ser traduzido por “subgovernadores” ou “prefeitos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “jovens desejáveis” ou “jovens de escol”; o hebraico ressalta seu vigor e sua atratividade.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשֵׁי
  choice: vestidos de
  rationale: O particípio passivo de לבשׁ descreve a indumentária dos homens; “vestidos de” preserva sua função descritiva e soa natural em português.
- source_word: תְכֵלֶת
  choice: azul
  rationale: O termo designa tecido ou cor tingida em tom azul a azul-violeta. “Azul” é claro e corrente, enquanto a nota preserva a possível nuance cromática.
- source_word: פַּחוֹת
  choice: governadores
  rationale: Designa governantes ou altos administradores imperiais; “governadores” comunica a função sem impor um título técnico excessivamente específico.
- source_word: וּסְגָנִים
  choice: altos funcionários
  rationale: Refere-se a autoridades subordinadas de posição elevada. “Altos funcionários” distingue o grupo dos governadores e evita precisão administrativa indevida.
- source_word: בַּחוּרֵי חֶמֶד
  choice: jovens desejáveis
  rationale: בַּחוּרֵי indica jovens no vigor da idade, e חֶמֶד acrescenta a ideia de atração ou desejabilidade; a escolha conserva a nuance erótica do contexto.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Reproduz tanto a totalidade quanto o sufixo pronominal enfático do hebraico.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: É o termo português direto para homens montados, especialmente em contexto militar, sem recorrer ao tom mais técnico de “soldados de cavalaria”.
- source_word: רֹכְבֵי סוּסִים
  choice: montados em cavalos
  rationale: Mantém a expressão participial que especifica os cavaleiros, embora em português haja certa redundância semelhante à do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem descritiva do hebraico foi preservada, assim como a repetição entre “cavaleiros” e “montados em cavalos”. As alternativas lexicais relevantes aparecem em notas sem resolver além da evidência a tonalidade de תְכֵלֶת nem o título administrativo de סְגָנִים.
