base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/034.yaml
  text: You will drink it and drain it dry[a], and you will gnaw its shards, and tear off your breasts; for I have spoken, declares the Lord GOD.
translation:
  language: pt
  text: Você a beberá e a esvaziará por completo; roerá os seus cacos e arrancará os próprios seios. Pois eu falei — declara o Senhor DEUS.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁתִית אוֹתָהּ
  choice: Você a beberá
  rationale: O perfeito qal na segunda pessoa feminina singular, ligado por וְ no discurso profético, tem sentido futuro. O pronome feminino retoma a taça do contexto.
- source_word: וּמָצִית
  choice: e a esvaziará por completo
  rationale: O verbo מצה expressa extrair ou consumir todo o conteúdo. A formulação comunica de modo natural que nada ficará na taça.
- source_word: חֲרָשֶׂיהָ
  choice: os seus cacos
  rationale: O plural de חֶרֶשׂ designa pedaços quebrados de um recipiente de barro. “Cacos” é corrente em português e preserva claramente a imagem.
- source_word: תְּגָרֵמִי
  choice: roerá
  rationale: O piel de גרם descreve roer ou triturar algo duro. “Roerá” mantém a imagem grotesca e violenta do hebraico.
- source_word: וְשָׁדַיִךְ תְּנַתֵּקִי
  choice: e arrancará os próprios seios
  rationale: O piel de נתק significa puxar, separar ou arrancar. “Os próprios” explicita em português que a ação recai sobre os seios da mulher interpelada, sem suavizar a imagem de automutilação.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: Pois eu falei
  rationale: A oração causal fundamenta a certeza do juízo na palavra divina já proferida.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor DEUS
  rationale: נְאֻם é a fórmula profética “declara”. “Senhor DEUS” distingue אֲדֹנָי de יהוה e evita a repetição “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  alternative: o Senhor Yahweh
  rationale: A forma adotada preserva a distinção entre o título אֲדֹנָי e o nome יהוה por meio da capitalização tradicional, sem introduzir uma transliteração no texto principal.
translation_notes:
  register: Português moderno, direto e solene, com tratamento por “você” para a segunda pessoa feminina singular. A violência deliberada da imagem profética foi preservada sem eufemismo.
