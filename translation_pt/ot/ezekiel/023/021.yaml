base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/021.yaml
  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
translation:
  language: pt
  text: Assim, você voltou à devassidão da sua juventude[a], quando os egípcios[b] apalpavam seus seios[c], os seios da sua juventude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você se lembrou da devassidão da sua juventude”. O verbo hebraico pode significar “visitar”, “ocupar-se de” ou “trazer à memória”; neste contexto, parece incluir a ideia de retomar a conduta anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “do Egito”. A expressão é aqui traduzida como “os egípcios”, pois a oração os apresenta como agentes da ação.'
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica é sexualmente explícita e se refere ao toque erótico nos seios.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַתִּפְקְדִי
  choice: você voltou à
  rationale: O verbo פקד pode significar visitar, ocupar-se de ou trazer à memória. Neste contexto, a expressão indica não apenas lembrança, mas retomada da antiga conduta; “voltou à” preserva essa sobreposição sem explicar demais.
- source_word: זִמַּת
  choice: devassidão
  rationale: Em contexto sexual, זִמָּה designa conduta indecente ou depravada. “Devassidão” conserva tanto a dimensão sexual quanto a censura moral.
- source_word: נְעוּרַיִךְ
  choice: sua juventude
  rationale: Tradução natural do período da juventude, mantida nas duas ocorrências para preservar a repetição enfática do hebraico.
- source_word: בַּעֲשׂוֹת ... דַּדַּיִךְ
  choice: quando ... apalpavam seus seios
  rationale: A construção com o infinitivo de עשה é idiomática e descreve manipulação sexual explícita. “Apalpavam” comunica o contato erótico sem suavizar a imagem.
- source_word: מִמִּצְרַיִם
  choice: no Egito
  rationale: Embora מִן normalmente signifique “de/desde”, aqui a expressão identifica o contexto egípcio da ação. A formulação locativa é natural em português, enquanto a nota registra a forma hebraica.
- source_word: דַּדַּיִךְ / שְׁדֵי נְעוּרַיִךְ
  choice: seus seios / os seios da sua juventude
  rationale: Os termos anatômicos concretos e a repetição são preservados, mantendo a força explícita e poética da metáfora profética.
theological_decisions:
- issue: Metáfora sexual explícita na linguagem profética de julgamento
  choice: Manter “devassidão”, “apalpavam” e “seios” sem eufemismo.
  alternative: Suavizar com termos como “imoralidade”, “carícias” ou “encantos”.
  rationale: A imagem deliberadamente gráfica retrata a infidelidade de Jerusalém. Suavizá-la reduziria a força retórica da acusação profética.
- issue: 'Sentido de פקד: lembrança ou retomada da conduta'
  choice: “voltou à”, preservando a ideia contextual de retorno à antiga devassidão.
  alternative: “lembrou-se da”, que expressa mais diretamente a dimensão mental do verbo.
  rationale: O contexto imediato trata da renovação da ligação com o Egito. A tradução escolhida conserva essa força contextual, enquanto a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e direto, com leitura natural no Brasil e compreensão internacional. A segunda pessoa feminina singular é vertida por “você”, coerente com o referente personificado; a linguagem sexual explícita e a repetição hebraica são mantidas.
