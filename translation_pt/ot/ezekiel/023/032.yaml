  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a declaração profética, o cálice da irmã, seus atributos de grande capacidade e o resultado de escárnio. Contudo, a nota b afirma uma ambiguidade gramatical que o hebraico não apresenta: תִּהְיֶה é terceira pessoa feminina singular, não segunda pessoa feminina; o referente mais natural é o cálice, substantivo feminino em hebraico.'
  naturalness: O português é claro, digno e natural. “Profundo e largo” soa um pouco mais fluente do que “fundo e largo” para descrever um cálice, sem alterar o sentido.
  terminology: “Senhor Yahweh” mantém a distinção entre o título e o nome divino. “Cálice”, “riso” e “zombaria” preservam adequadamente a linguagem profética e o registro do versículo.
  issues:
  - severity: medium
    issue: A nota b descreve incorretamente o sujeito de “será” como ambíguo entre a mulher e o cálice.
    rationale: No texto hebraico, תִּהְיֶה é formalmente terceira pessoa feminina singular. A segunda pessoa feminina seria uma forma diferente (tipicamente תִּהְיִי). Embora o português sem sujeito expresso não crie dano no corpo do texto, a nota introduz uma ambiguidade inexistente e deve ser corrigida.
  revised_text: 'Assim diz o Senhor Yahweh: “Você beberá o cálice de sua irmã, profundo e largo[a]; será motivo de riso e zombaria[b], pois ele comporta muito.”'
