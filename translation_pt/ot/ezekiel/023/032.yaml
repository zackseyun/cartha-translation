base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/032.yaml
  text: 'Thus says the Lord GOD: You will drink your sister’s cup[a], deep and wide; it will be for laughter and for mockery[b], for it holds much.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Você beberá o cálice de sua irmã, profundo e largo[a]; será motivo de riso e zombaria[b], pois ele comporta muito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “profundo e amplo”.'
    reason: lexical_alternative
  - marker: b
    text: O cálice é uma imagem profética da porção de juízo que lhe cabe.
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Mantém distintos o título אֲדֹנָי (‘Senhor’) e o nome divino יהוה (‘Yahweh’), evitando a forma pouco clara ‘Senhor SENHOR’.
- source_word: כּוֹס אֲחוֹתֵךְ
  choice: o cálice de sua irmã
  rationale: Reproduz diretamente a construção hebraica e conserva a imagem profética do cálice como porção recebida.
- source_word: תִּשְׁתִּי
  choice: você beberá
  rationale: O imperfeito na declaração profética é expresso naturalmente pelo futuro, com sentido de acontecimento certo.
- source_word: הָעֲמֻקָּה וְהָרְחָבָה
  choice: fundo e largo
  rationale: Os adjetivos descrevem o cálice e ressaltam sua grande capacidade; a formulação é clara e natural em português.
- source_word: תִּהְיֶה לִצְחֹק וּלְלַעַג
  choice: será motivo de riso e zombaria
  rationale: Preserva a construção resultativa do hebraico sem resolver explicitamente a ambiguidade da forma verbal feminina, que pode apontar para a mulher ou para o cálice.
- source_word: מִרְבָּה לְהָכִיל
  choice: pois ele comporta muito
  rationale: Expressa a grande capacidade do cálice e entende a construção como explicativa, de modo conciso e idiomático.
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor Deus
  rationale: A escolha explicita o nome divino presente no hebraico e o distingue do título ‘Senhor’, sem acrescentar interpretação denominacional.
- issue: Referente de תִּהְיֶה (‘será’)
  choice: Manter o sujeito implícito em português
  alternative: ‘você será’ ou ‘o cálice será’
  rationale: A forma hebraica pode ser entendida como segunda pessoa feminina (‘você será’) ou terceira pessoa feminina (‘ela será’, referindo-se ao cálice). O sujeito não expresso em ‘será’ conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por ‘você’. A ordem foi ajustada para a fluidez do português, mas a metáfora central e a ambiguidade sintática do hebraico foram preservadas.
