base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/024.yaml
  text: They will come against you with troops, chariots, and wagons, and with an assembly of peoples. They will set shield and buckler and helmet against you on every side, and I will set judgment before them, and they will judge you by their judgments.
translation:
  language: pt
  text: Eles virão contra você com tropas, carros de guerra e carroças, e com uma assembleia de povos. Porão contra você, de todos os lados, escudos grandes e pequenos e capacetes. Porei diante deles o julgamento, e eles a julgarão segundo os julgamentos deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹצֶן
  choice: tropas
  rationale: O termo é raro e de sentido incerto. No contexto de uma força invasora e em consonância com uma interpretação lexical antiga e plausível, “tropas” comunica naturalmente um contingente militar sem introduzir a ideia menos segura de “armas”.
- source_word: רֶכֶב וְגַלְגַּל
  choice: carros de guerra e carroças
  rationale: רֶכֶב designa carros, aqui militares; גַלְגַּל, literalmente ligado a “roda”, é entendido no contexto como veículos de rodas ou carroças. A formulação distingue os dois elementos.
- source_word: צִנָּה וּמָגֵן
  choice: escudos grandes e pequenos
  rationale: Os dois termos indicam tipos distintos de escudo; explicitar o contraste de tamanho preserva a distinção em português corrente.
- source_word: וְנָתַתִּי לִפְנֵיהֶם מִשְׁפָּט
  choice: Eu entregarei seu julgamento a eles
  rationale: A expressão significa colocar a causa ou o julgamento diante deles, isto é, confiá-lo à decisão deles. Esta redação evita a pouco natural tradução literal “porei julgamento diante deles”.
- source_word: בְּמִשְׁפְּטֵיהֶם
  choice: segundo as leis deles
  rationale: O plural מִשְׁפָּטִים pode abranger normas, decisões ou padrões judiciais. “Leis” comunica que os invasores aplicarão seus próprios critérios jurídicos.
theological_decisions:
- issue: Deus entrega o julgamento de Jerusalém às nações invasoras
  choice: “Eu entregarei seu julgamento a eles”
  alternative: “Eu porei diante deles o julgamento”
  rationale: 'A tradução mantém a tensão do texto: Deus é quem autoriza o processo, enquanto os povos executam a sentença conforme seus próprios padrões, sem harmonizar moralmente as duas agências.'
translation_notes:
  register: Português moderno, claro e digno, com concordância feminina em “a julgarão” porque o discurso se dirige figuradamente à cidade/mulher. “Por todos os lados” foi antecipado para dar fluidez sem alterar seu alcance. A ambiguidade do raro הֹצֶן foi resolvida no texto como “tropas”, opção contextual plausível e alinhada à camada inglesa auditada.
