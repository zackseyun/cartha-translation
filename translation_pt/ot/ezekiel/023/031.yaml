  text: בְּ/דֶ֥רֶךְ אֲחוֹתֵ֖/ךְ הָלָ֑כְתְּ וְ/נָתַתִּ֥י כוֹסָ֖/הּ בְּ/יָדֵֽ/ךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/031.yaml
  text: You have walked in the way of your sister[a], so I will put her cup into your hand.
translation:
  language: pt
  text: Você seguiu o caminho de sua irmã; por isso, porei o cálice dela em sua mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o cálice destinado à sua irmã, como figura do juízo.
    reason: cultural_note
lexical_decisions:
- source_word: בְּדֶרֶךְ
  choice: o caminho
  rationale: דֶּרֶךְ pode indicar caminho, estrada ou modo de proceder. Aqui descreve metaforicamente a conduta; a construção «seguir o caminho» comunica o idioma hebraico de modo natural em português.
- source_word: אֲחוֹתֵךְ
  choice: sua irmã
  rationale: Mantém o termo literal de parentesco e preserva a metáfora alegórica do contexto.
- source_word: הָלָכְתְּ
  choice: seguiu
  rationale: O Qal de הלך significa andar ou ir. Com «caminho», «seguiu» expressa naturalmente em português a ideia de adotar a mesma conduta, sem explicitar além do texto.
- source_word: וְנָתַתִּי
  choice: por isso, porei
  rationale: נתן pode significar dar, pôr ou colocar. Com «cálice» e «em sua mão», «porei» é idiomático; «por isso» torna clara a força consequencial da conjunção no contexto.
- source_word: כוֹסָהּ
  choice: o cálice dela
  rationale: Preserva literalmente a metáfora profética do cálice e o sufixo feminino, sem substituir a imagem por uma explicação de juízo ou ira.
- source_word: בְּיָדֵךְ
  choice: em sua mão
  rationale: Reproduz de perto a preposição hebraica e, com «porei», forma uma expressão natural em português para entrega à posse da destinatária.
theological_decisions:
- issue: Metáfora do cálice de juízo
  choice: Manter «o cálice dela» no texto principal.
  alternative: «o cálice do castigo dela» ou «o cálice do juízo dela»
  rationale: O contexto identifica o cálice como figura do juízo destinado à irmã, mas o hebraico deste versículo diz apenas «o cálice dela». A tradução conserva a imagem e deixa a explicação para a nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Você» corresponde à segunda pessoa feminina singular do hebraico; «sua irmã» e «em sua mão» mantêm a referência direta. A metáfora profética é preservada, e o sentido judicial é explicado somente na nota.
