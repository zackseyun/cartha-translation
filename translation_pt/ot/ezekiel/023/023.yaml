  text: בְּנֵ֧י בָבֶ֣ל וְ/כָל כַּשְׂדִּ֗ים פְּק֤וֹד וְ/שׁ֨וֹעַ֙ וְ/ק֔וֹעַ כָּל בְּנֵ֥י אַשּׁ֖וּר אוֹתָ֑/ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּ/סְגָנִים֙ כֻּלָּ֔/ם שָֽׁלִשִׁים֙ וּ/קְרוּאִ֔ים רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/023.yaml
  text: the sons of Babylon and all the Chaldeans[a], Pekod and Shoa and Koa, all the sons of Assyria with them—desirable young men, all of them governors and officials, officers and men of renown[b], all of them riding on horses.
translation:
  language: pt
  text: 'os filhos da Babilônia e todos os caldeus — Pecode, Soa e Coa[a] —, e com eles todos os filhos da Assíria: jovens desejáveis, todos eles governadores e oficiais, comandantes e homens de renome[b], todos eles montados a cavalo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pecode, Soa e Coa provavelmente são nomes de povos ou regiões aliados à Babilônia; alguns, porém, entendem essas palavras como designações descritivas, tais como “oficiais, nobres e guerreiros”.
    reason: alternative_reading
  - marker: b
    text: Ou “homens distintos”; mais literalmente, “chamados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בָבֶל
  choice: os filhos da Babilônia
  rationale: Preserva o idioma hebraico e o paralelismo com “filhos da Assíria”, permanecendo compreensível em português.
- source_word: כַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação étnica convencional e não a funde com Babilônia.
- source_word: פְּקוֹד וְשׁוֹעַ וְקוֹעַ
  choice: Pecode, Soa e Coa
  rationale: A estrutura da enumeração favorece nomes próprios de povos ou regiões; a interpretação alternativa é preservada em nota.
- source_word: כָּל בְּנֵי אַשּׁוּר אוֹתָם
  choice: com eles todos os filhos da Assíria
  rationale: Mantém a expressão genealógico-étnica do hebraico, e אוֹתָם é entendido como acompanhamento no contexto.
- source_word: בַּחוּרֵי חֶמֶד
  choice: jovens desejáveis
  rationale: Conserva tanto a juventude quanto a nuance de atração e desejo apropriada à imagem do capítulo.
- source_word: פַּחוֹת וּסְגָנִים
  choice: governadores e oficiais
  rationale: Emprega títulos administrativos claros sem impor precisão burocrática incerta.
- source_word: שָׁלִשִׁים
  choice: comandantes
  rationale: Comunica posição militar elevada sem depender da etimologia ou de uma função técnica incerta.
- source_word: קְרוּאִים
  choice: homens de renome
  rationale: No contexto honorífico da lista, exprime pessoas reconhecidas ou distinguidas; a tradução mais literal é indicada em nota.
- source_word: רֹכְבֵי סוּסִים
  choice: montados a cavalo
  rationale: Reproduz de modo natural a construção participial descritiva.
- source_word: כֻּלָּם ... כֻּלָּם ... כֻּלָּם
  choice: todos ... todos eles ... todos eles
  rationale: Mantém a repetição enfática e cumulativa do hebraico, com leve ajuste para fluência em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação conserva os idiomas “filhos da Babilônia” e “filhos da Assíria”, a nuance desejante de בַּחוּרֵי חֶמֶד e a repetição enfática de כֻּלָּם. Travessões organizam a longa enumeração sem alterar suas relações sintáticas.
