  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִשְׁפּ֥וֹט אֶֽת אָהֳלָ֖ה וְ/אֶת אָהֳלִיבָ֑ה וְ/הַגֵּ֣ד לָ/הֶ֔ן אֵ֖ת תוֹעֲבוֹתֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/036.yaml
  text: Then Yahweh said to me, “Son of man, will you judge Oholah and Oholibah? Then declare to them their abominations.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “Filho do homem, você julgará Oolá e Oolibá? Declare-lhes as suas abominações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa de modo natural a sequência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma do tratamento divino característico dirigido a Ezequiel e é idiomático em português bíblico atual.
- source_word: הֲתִשְׁפּוֹט
  choice: você julgará?
  rationale: Mantém a forma interrogativa e o aspecto de incumbência profética do imperfeito hebraico, sem converter a pergunta diretamente em ordem.
- source_word: אָהֳלָה וְאֶת אָהֳלִיבָה
  choice: Oolá e Oolibá
  rationale: Transliteração portuguesa dos nomes próprios, com acentuação gráfica que favorece a pronúncia.
- source_word: וְהַגֵּד לָהֶן
  choice: Declare-lhes
  rationale: O imperativo pede uma proclamação direta; o pronome retoma naturalmente as duas figuras femininas.
- source_word: תוֹעֲבוֹתֵיהֶן
  choice: as suas abominações
  rationale: “Abominações” preserva a forte carga moral e cultual do termo profético; “suas” refere-se a Oolá e Oolibá.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem o substituir por um título.
- issue: Força de הֲתִשְׁפּוֹט
  choice: 'manter como pergunta: “você julgará?”'
  alternative: 'imperativo: “julgue”'
  rationale: A partícula interrogativa הֲ favorece formalmente uma pergunta, ainda que no contexto ela tenha força de convocação ou incumbência; manter a pergunta preserva essa tensão.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém “Filho do homem” como fórmula bíblica estabelecida e “abominações” pelo peso profético do original. Os nomes seguem formas portuguesas pronunciáveis: Oolá e Oolibá.'
