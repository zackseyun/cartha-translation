  text: וַֽ/תַּעְגְּבָ֔/ה עַ֖ל פִּֽלַגְשֵׁי/הֶ֑ם אֲשֶׁ֤ר בְּשַׂר חֲמוֹרִים֙ בְּשָׂרָ֔/ם וְ/זִרְמַ֥ת סוּסִ֖ים זִרְמָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/020.yaml
  text: She lusted after their paramours[a], whose flesh was like the flesh of donkeys[c][b], and whose emission was like the emission of horses.
translation:
  language: pt
  text: Ela desejou ardentemente os amantes deles[a], cuja carne era como a carne de jumentos[b], e cuja emissão era como a de cavalos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “as concubinas deles”. No contexto, o termo é geralmente entendido em sentido figurado como parceiros sexuais ou amantes.
    reason: lexical_alternative
  - marker: b
    text: “Carne” provavelmente funciona aqui como eufemismo sexual, isto é, “órgãos genitais”.
    reason: lexical_alternative
  - marker: c
    text: Ou, mais explicitamente, “sêmen”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגְּבָה עַל
  choice: desejou ardentemente
  rationale: O verbo עגב com עַל expressa intenso desejo erótico. “Desejou ardentemente” comunica essa força em português atual e digno, sem atenuar o contexto sexual.
- source_word: פִּלַגְשֵׁיהֶם
  choice: os amantes deles
  rationale: Embora פִּלֶגֶשׁ signifique literalmente “concubina”, neste contexto metafórico o plural se refere aos parceiros sexuais estrangeiros desejados por ela. “Amantes” é natural em português; a forma lexical incomum é preservada em nota.
- source_word: בְּשַׂר חֲמוֹרִים בְּשָׂרָם
  choice: cuja carne era como a carne de jumentos
  rationale: בָּשָׂר significa literalmente “carne”, mas aqui provavelmente funciona como eufemismo sexual. O texto principal conserva a imagem hebraica, e a nota esclarece o sentido provável.
- source_word: וְזִרְמַת סוּסִים זִרְמָתָם
  choice: e cuja emissão era como a de cavalos
  rationale: זִרְמָה denota fluxo ou descarga e, neste contexto, emissão seminal. “Emissão” mantém o caráter concreto, porém eufemístico, do hebraico; a nota oferece a formulação explícita.
