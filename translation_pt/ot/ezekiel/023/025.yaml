  text: וְ/נָתַתִּ֨י קִנְאָתִ֜/י בָּ֗/ךְ וְ/עָשׂ֤וּ אוֹתָ/ךְ֙ בְּ/חֵמָ֔ה אַפֵּ֤/ךְ וְ/אָזְנַ֨יִ/ךְ֙ יָסִ֔ירוּ וְ/אַחֲרִיתֵ֖/ךְ בַּ/חֶ֣רֶב תִּפּ֑וֹל הֵ֗מָּה בָּנַ֤יִ/ךְ וּ/בְנוֹתַ֨יִ/ךְ֙ יִקָּ֔חוּ וְ/אַחֲרִיתֵ֖/ךְ תֵּאָכֵ֥ל בָּ/אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/025.yaml
  text: I will set my jealousy against you[a], and they will deal with you in wrath. They will remove your nose and your ears, and your survivors will fall by the sword. They will take your sons and your daughters[b], and your remnant will be consumed by fire.
translation:
  language: pt
  text: Porei contra você o meu ciúme, e eles a tratarão com furor. Removerão seu nariz e suas orelhas[a], e os que restarem de você cairão à espada. Levarão seus filhos e suas filhas, e o que restar de você[b] será consumido pelo fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cortarão seu nariz e suas orelhas”. O verbo hebraico significa mais literalmente “remover”, embora o contexto provavelmente descreva mutilação.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode significar “seu fim”, “seu destino posterior” ou “o que restar de você”. Neste contexto, refere-se provavelmente ao que sobreviver à devastação inicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי קִנְאָתִי בָּךְ
  choice: Porei contra você o meu ciúme
  rationale: נתן admite “pôr/colocar”, e a construção dirige קִנְאָה contra a destinatária. “Ciúme” preserva a força relacional e conjugal do contexto.
- source_word: וְעָשׂוּ אוֹתָךְ בְּחֵמָה
  choice: eles a tratarão com furor
  rationale: Expressa de modo natural a ação hostil dos agentes contra a destinatária; “furor” conserva a intensidade de חֵמָה.
- source_word: אַפֵּךְ וְאָזְנַיִךְ יָסִירוּ
  choice: Removerão seu nariz e suas orelhas
  rationale: O hifil de סור significa literalmente “remover/tirar”. A mutilação por corte é provável no contexto, mas fica explicitada em nota por ser uma especificação do modo.
- source_word: וְאַחֲרִיתֵךְ
  choice: os que restarem de você / o que restar de você
  rationale: אַחֲרִית pode indicar “fim”, “destino posterior” ou “o restante”. Neste contexto de devastação, as duas formulações naturais distinguem sobreviventes humanos na primeira ocorrência e o remanescente em sentido mais amplo na segunda.
- source_word: בַּחֶרֶב תִּפּוֹל
  choice: cairão à espada
  rationale: Locução portuguesa tradicional e clara para morte em guerra ou execução, sem acrescentar um agente.
- source_word: הֵמָּה בָּנַיִךְ וּבְנוֹתַיִךְ יִקָּחוּ
  choice: Levarão seus filhos e suas filhas
  rationale: לקח significa amplamente “tomar/levar”; “levarão” comunica bem a captura no contexto de conquista sem definir além do texto o destino deles.
- source_word: תֵּאָכֵל בָּאֵשׁ
  choice: será consumido pelo fogo
  rationale: O nifal de אכל é passivo. “Consumido pelo fogo” preserva a imagem destrutiva e soa natural em português.
theological_decisions:
- issue: A emoção punitiva e relacional expressa por קִנְאָה
  choice: meu ciúme
  alternative: meu zelo
  rationale: No quadro alegórico de infidelidade conjugal, “ciúme” mantém a tensão relacional e pactual do termo, enquanto “zelo” tornaria o sentido mais geral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a destinatária feminina pelo pronome objeto “a”, coerente com a alegoria do capítulo, sem marcar gênero repetidamente onde o português não exige. As notas preservam tanto a literalidade de יָסִירוּ quanto a amplitude semântica de אַחֲרִית.
