  text: לָ/כֵ֥ן נְתַתִּ֖י/הָ בְּ/יַד מְאַֽהֲבֶ֑י/הָ בְּ/יַד֙ בְּנֵ֣י אַשּׁ֔וּר אֲשֶׁ֥ר עָגְבָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/009.yaml
  text: Therefore I gave her into the hand of her lovers[a], into the hand of the sons of Assyria[b], for whom she lusted.
translation:
  language: pt
  text: Por isso, eu a entreguei nas mãos de seus amantes, nas mãos dos filhos da Assíria[a], pelos quais ela ardia de desejo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assírios”. Literalmente, “filhos da Assíria”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelos quais ela estava intensamente apaixonada”. O verbo hebraico expressa desejo forte e, nesta metáfora de adultério, tem conotação sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência da acusação anterior com clareza e naturalidade, preservando a força inferencial do hebraico.
- source_word: נְתַתִּיהָ
  choice: eu a entreguei
  rationale: Neste contexto, נתן seguido de בְּיַד indica entregar alguém ao poder de outro; “entreguei” explicita naturalmente esse sentido em português.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: A expressão idiomática portuguesa comunica sujeição ao poder alheio e mantém a imagem concreta do hebraico; o plural é a forma mais natural em português.
- source_word: מְאַהֲבֶיהָ
  choice: seus amantes
  rationale: Preserva a metáfora de adultério usada por Ezequiel para descrever as alianças políticas ilícitas de Oolá/Samaria.
- source_word: בְּנֵי אַשּׁוּר
  choice: os filhos da Assíria
  rationale: Mantém a forma concreta da expressão hebraica, enquanto uma nota oferece o equivalente gentílico mais idiomático.
- source_word: אֲשֶׁר ... עֲלֵיהֶם
  choice: pelos quais
  rationale: Liga naturalmente os assírios ao objeto do forte desejo expresso pelo verbo hebraico.
- source_word: עָגְבָה עֲלֵיהֶם
  choice: ela ardia de desejo
  rationale: Expressa o desejo intenso e sexualmente carregado do verbo עגב sem enfraquecer a metáfora profética nem recorrer a linguagem vulgar.
theological_decisions:
- issue: Metáfora sexual profética para as alianças estrangeiras de Samaria/Oolá
  choice: Manter “amantes” e “ardia de desejo”
  alternative: Interpretar diretamente como “aliados” e “desejava”
  rationale: O hebraico descreve deliberadamente a infidelidade política mediante imagens de adultério e desejo sexual. Preservar essa tensão mantém a força da denúncia profética sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nas mãos de” usa o idioma natural português para a imagem hebraica de domínio; a repetição foi mantida para conservar a ênfase do original.
