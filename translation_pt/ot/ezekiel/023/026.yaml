  text: וְ/הִפְשִׁיט֖וּ/ךְ אֶת בְּגָדָ֑יִ/ךְ וְ/לָקְח֖וּ כְּלֵ֥י תִפְאַרְתֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/026.yaml
  text: They will strip you of your garments and take your splendid ornaments[a].
translation:
  language: pt
  text: Eles a despirão de suas roupas e levarão seus adornos esplêndidos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os objetos de seu esplendor”; literalmente, “os utensílios de sua beleza/seu esplendor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְשִׁיטוּךְ
  choice: a despirão
  rationale: O hifil de פשט com sufixo de segunda pessoa feminina singular indica tirar de alguém as roupas. “A despirão” é direto e evita acrescentar “por completo”, ideia não explicitada.
- source_word: בְּגָדָיִךְ
  choice: suas roupas
  rationale: בגד é o termo comum para roupas ou vestes. “Roupas” é natural e claro no português moderno.
- source_word: וְלָקְחוּ
  choice: e levarão
  rationale: לקח significa basicamente “tomar/pegar”. Neste contexto de despojo, “levarão” expressa naturalmente a retirada dos objetos sem intensificar o verbo como faria “saquearão”.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: seus adornos esplêndidos
  rationale: A construção significa literalmente “objetos de seu esplendor/beleza”. “Adornos esplêndidos” preserva a referência provável a objetos de ornamentação e mantém o tom elevado, sem restringi-los necessariamente a joias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O pronome oblíquo feminino preserva a referência à mulher personificada no contexto, e “adornos esplêndidos” mantém a amplitude e o tom de כְּלֵי תִפְאַרְתֵּךְ.
