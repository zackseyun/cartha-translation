  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן שָׁכַ֣חַתְּ אוֹתִ֔/י וַ/תַּשְׁלִ֥יכִי אוֹתִ֖/י אַחֲרֵ֣י גַוֵּ֑/ךְ וְ/גַם אַ֛תְּ שְׂאִ֥י זִמָּתֵ֖/ךְ וְ/אֶת תַּזְנוּתָֽיִ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/035.yaml
  text: 'Therefore thus says the Lord GOD: Because you have forgotten me and cast me behind your back[a], you also must bear your lewdness and your prostitutions.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: Porque você se esqueceu de mim e me lançou para trás das costas[a], você também terá de suportar sua devassidão e suas prostituições.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e me jogou para trás das costas”. A expressão hebraica indica rejeição ou desprezo deliberado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e representa diretamente o nome divino, evitando a repetição pouco natural «Senhor SENHOR».
- source_word: יַעַן
  choice: Porque
  rationale: Introduz com clareza a causa da sentença que vem em seguida.
- source_word: שָׁכַחַתְּ אֹתִי
  choice: você se esqueceu de mim
  rationale: O pretérito perfeito português expressa naturalmente a ação consumada que fundamenta a acusação.
- source_word: וַתַּשְׁלִיכִי אֹתִי אַחֲרֵי גַוֵּךְ
  choice: e me lançou para trás das costas
  rationale: Mantém a imagem concreta do hebraico e seu sentido idiomático de rejeição ou desprezo deliberado.
- source_word: וְגַם אַתְּ
  choice: você também
  rationale: Conserva a ênfase explícita no destinatário e liga sua conduta à consequência judicial.
- source_word: שְׂאִי
  choice: terá de suportar
  rationale: O imperativo funciona no contexto como sentença de consequência inevitável, mais do que como simples ordem.
- source_word: זִמָּתֵךְ
  choice: sua obscenidade
  rationale: No contexto sexualizado de Ezequiel, designa conduta indecente e moralmente ultrajante; «obscenidade» preserva essa força em português atual.
- source_word: תַּזְנוּתָיִךְ
  choice: suas prostituições
  rationale: Conserva o plural concreto e a metáfora recorrente da prostituição para a infidelidade, sem explicá-la dentro do texto.
theological_decisions:
- issue: Representação de יְהוָה no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida preserva o nome divino presente no hebraico e distingue os dois componentes do título, sem acrescentar uma interpretação denominacional.
- issue: Relação entre prostituição e infidelidade religiosa
  choice: manter «prostituições» sem explicitação no corpo do versículo
  alternative: parafrasear como «infidelidades»
  rationale: A metáfora sexual é deliberada e central ao capítulo; substituí-la por uma abstração reduziria sua força e eliminaria a tensão literária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem forte e a linguagem sexual do original sem arcaísmos nem suavização interpretativa.
