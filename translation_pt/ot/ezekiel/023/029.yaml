base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/029.yaml
  text: They will deal with you in hatred[a], and they will take all your wealth, and leave you naked and bare; and the nakedness of your prostitutions will be uncovered[c][b], your lewdness and your acts of prostitution.
translation:
  language: pt
  text: Eles a tratarão com ódio e tomarão tudo o que ela ganhou com seu trabalho[a]; deixarão-na nua e despida. Será exposta a nudez das suas prostituições[b] — sua devassidão e seus atos de prostituição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o fruto do seu trabalho”. O termo hebraico pode indicar o próprio trabalho ou aquilo que se obteve por meio dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a vergonha das suas prostituições”. Aqui, “nudez” implica exposição vergonhosa.'
    reason: lexical_alternative
  - marker: c
    text: 'Também é possível entender: “junto com sua devassidão e seus atos de prostituição”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְעָשׂוּ אוֹתָךְ בְּשִׂנְאָה
  choice: Eles a tratarão com ódio
  rationale: Reproduz de modo natural em português o idiomatismo עשה + objeto + בְּ, preservando o ódio como a maneira hostil de tratá-la.
- source_word: וְלָקְחוּ כָּל יְגִיעֵךְ
  choice: tomarão tudo o que ela conquistou com seu trabalho
  rationale: יְגִיעַ pode designar tanto o trabalho penoso quanto o fruto obtido por ele. No contexto de confisco, a formulação explicita o ganho do trabalho sem reduzi-lo genericamente a 'riqueza'.
- source_word: וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה
  choice: Eles a deixarão nua e despida
  rationale: Mantém o par intensificador hebraico e comunica tanto nudez quanto completa privação.
- source_word: וְנִגְלָה
  choice: então ficará exposta
  rationale: O perfeito com waw continua a sequência futura; 'ficará exposta' se ajusta à imagem pública de nudez e vergonha.
- source_word: עֶרְוַת זְנוּנַיִךְ
  choice: a nudez das suas prostituições
  rationale: Conserva o sentido concreto de עֶרְוָה e a metáfora sexual explícita de זְנוּנִים, sem suavizar a retórica profética.
- source_word: וְזִמָּתֵךְ
  choice: sua devassidão
  rationale: Neste contexto sexual, זִמָּה indica conduta depravada ou lasciva; 'devassidão' é atual, digna e semanticamente adequada.
- source_word: וְתַזְנוּתָיִךְ
  choice: seus atos de prostituição
  rationale: Preserva a acumulação hebraica de termos próximos, distinguindo este substantivo da ocorrência anterior de זְנוּנִים.
theological_decisions:
- issue: Metáfora sexual da infidelidade de Jerusalém/Samaria
  choice: Manter explicitamente a linguagem de prostituição
  alternative: Substituí-la por termos genéricos como 'infidelidade' ou 'imoralidade'
  rationale: Ezequiel emprega deliberadamente uma metáfora sexual forte para retratar a traição e a vergonha resultante. Suavizá-la reduziria a força do texto e resolveria interpretativamente sua tensão.
- issue: Relação sintática dos substantivos finais com 'a nudez das suas prostituições'
  choice: Apresentá-los como explicação em aposição, marcada por travessão
  alternative: Tratálos como itens adicionais coordenados, introduzidos por 'junto com'
  rationale: O verbo singular וְנִגְלָה concorda naturalmente com o sujeito singular עֶרְוַת; os substantivos finais podem explicar em que consiste essa exposição. O travessão preserva essa leitura sem excluir totalmente a coordenação possível.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O feminino singular foi expresso por pronomes de terceira pessoa para evitar o tratamento regionalmente variável de “tu/você”. A linguagem sexual explícita do hebraico foi preservada com vocabulário atual e digno.
