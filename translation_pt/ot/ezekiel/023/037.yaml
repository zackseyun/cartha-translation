revisions:
- from: Pois cometeram adultério, e há sangue nas mãos delas. Cometeram adultério com seus ídolos repugnantes e até fizeram seus filhos, que deram à luz para mim, passar pelo fogo[a], entregando-os a esses ídolos como alimento.[b]
  to: Pois cometeram adultério, e há sangue nas mãos delas; cometeram adultério com seus ídolos repugnantes e até fizeram seus filhos homens, a quem elas deram à luz para mim, passar pelo fogo[a] para esses ídolos, como alimento.[b]
  rationale: A revisão restaura a especificidade de «filhos homens», elimina uma ambiguidade sintática em «deram à luz» e substitui o particípio explicativo por uma sequência verbal mais próxima do hebraico. Mantém-se «ídolos repugnantes» como reprodução natural da tonalidade depreciativa de Ezequiel. A nota torna explícito que «pelo fogo» é uma explicitação contextual do idioma, não uma palavra presente no versículo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:41:40Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a repetição de «cometeram adultério», a imagem de sangue nas mãos e a acusação de sacrifício dos filhos. Contudo, «filhos» perde a especificidade de בְּנֵיהֶן («filhos homens»), e «entregando-os a esses ídolos» introduz um particípio explicativo que substitui a construção verbal direta do hebraico. A referência aos ídolos pode ser explicitada, mas é preferível manter a coordenação e a ambiguidade controlada da frase.
  naturalness: «Que deram à luz para mim» é compreensível, mas pode momentaneamente soar como se os filhos fossem o sujeito de «deram à luz». «A quem elas deram à luz para mim» torna a relação sintática clara e mantém a formulação relacional incomum do original. A frase final direta também soa mais firme e mais próxima do registro profético.
  terminology: «Ídolos repugnantes» comunica de modo adequado a carga pejorativa de גִּלּוּלִים, sem impor uma leitura doutrinária. «Filhos» substitui «filhos homens» para refletir בָּנִים. A nota sobre «pelo fogo» deve esclarecer que «fogo» não é uma palavra expressa neste versículo, embora a expressão seja entendida nesse contexto cultual.
