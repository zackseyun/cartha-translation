  text: כִּ֣י נִאֵ֗פוּ וְ/דָם֙ בִּֽ/ידֵי/הֶ֔ן וְ/אֶת גִּלּֽוּלֵי/הֶ֖ן נִאֵ֑פוּ וְ/גַ֤ם אֶת בְּנֵי/הֶן֙ אֲשֶׁ֣ר יָֽלְדוּ לִ֔/י הֶעֱבִ֥ירוּ לָ/הֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/037.yaml
  text: For they have committed adultery[a], and blood is on their hands; they have committed adultery with their idols, and they even made their sons, whom they bore to me[b], pass through the fire to them as food.
translation:
  language: pt
  text: Pois cometeram adultério, e há sangue nas mãos delas; cometeram adultério com seus ídolos repugnantes e até fizeram seus filhos homens, a quem elas deram à luz para mim, passar pelo fogo[a] para esses ídolos, como alimento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “fizeram passar”; “fogo” não está expresso neste versículo. Neste contexto, a expressão se refere ao sacrifício de crianças, tradicionalmente entendido como fazê-las passar pelo fogo.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “para eles, como alimento”. A frase retrata os filhos como consumidos numa oferta sacrificial aos ídolos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֵפוּ
  choice: cometeram adultério
  rationale: Preserva o sentido próprio de נאף e também sua força metafórica de infidelidade à aliança por meio da idolatria, além de manter a repetição do verbo no versículo.
- source_word: דָם בִּידֵיהֶן
  choice: há sangue nas mãos delas
  rationale: Expressão portuguesa natural que comunica culpa por derramamento de sangue e conserva a imagem jurídica e moral do hebraico.
- source_word: גִּלּוּלֵיהֶן
  choice: seus ídolos repugnantes
  rationale: גִּלּוּלִים é o termo depreciativo característico de Ezequiel para os ídolos. “Repugnantes” transmite essa carga de desprezo sem recorrer à tradução etimológica excessivamente gráfica.
- source_word: וְאֶת גִּלּוּלֵיהֶן נִאֵפוּ
  choice: cometeram adultério com seus ídolos repugnantes
  rationale: A preposição “com” expressa naturalmente em português o objeto da metáfora conjugal e preserva a acusação de infidelidade idólatra.
- source_word: בְּנֵיהֶן אֲשֶׁר יָלְדוּ לִי
  choice: seus filhos, que deram à luz para mim
  rationale: “Filhos” reflete בָּנִים, e “para mim” mantém a reivindicação divina sobre eles sem explicitar além do texto se a relação é possessiva ou pactual.
- source_word: הֶעֱבִירוּ
  choice: fizeram ... passar pelo fogo
  rationale: O hebraico diz literalmente “fizeram passar”; no contexto cultual de idolatria e sangue, trata-se da conhecida expressão para sacrifício de crianças. “Pelo fogo” torna inteligível o idioma, com transparência em nota.
- source_word: לָהֶם לְאָכְלָה
  choice: entregando-os a esses ídolos como alimento
  rationale: Explicita de modo natural o referente provável do pronome plural, os ídolos mencionados imediatamente antes, e conserva a imagem horrível de consumo sacrificial presente em לְאָכְלָה.
theological_decisions:
- issue: Explicitar o fogo e o caráter sacrificial da ação
  choice: fizeram seus filhos ... passar pelo fogo
  alternative: fizeram seus filhos passar
  rationale: Embora “fogo” não esteja expresso neste versículo, “fazer passar” funciona aqui como idioma cultual, em contexto de idolatria, sangue e oferta dos filhos como alimento. A tradução explicita o referente histórico sem reduzir a ação a um rito inofensivo.
- issue: Identidade do referente de לָהֶם
  choice: a esses ídolos
  alternative: a eles
  rationale: O antecedente textual mais próximo é “seus ídolos”. Torná-lo explícito evita ambiguidade pronominal pouco natural em português, sem introduzir uma entidade não presente no contexto.
- issue: Força de “que deram à luz para mim”
  choice: preservar a formulação relacional sem explicá-la
  alternative: filhos que me pertenciam
  rationale: O hebraico sustenta a reivindicação de Deus sobre os filhos, mas a natureza precisa dessa relação não é desenvolvida neste versículo; a tradução conserva essa tensão.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “cometeram adultério” foi mantida por sua importância retórica e teológica. “Ídolos repugnantes” conserva a tonalidade depreciativa peculiar de Ezequiel; “entregando-os” oferece uma ligação idiomática em português sem suavizar a violência do texto.
