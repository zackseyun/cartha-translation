  source_fidelity: O hebraico diz que a destinatária será cheia de embriaguez e pesar, e associa isso ao «cálice de horror e desolação», identificado como o cálice de sua irmã Samaria. «Embriaguez», «aflição», «horror» e «desolação» são escolhas semanticamente adequadas. Contudo, a relação do cálice com o enchimento fica mais explicitamente preservada com «com um cálice», como também reflete o audit trail inglês.
  naturalness: A redação é clara e de registro apropriado. O travessão seguido de «um cálice» é poeticamente possível, mas deixa a expressão como aposição algo abrupta e pode enfraquecer a ligação sintática presente na sequência hebraica. «Com um cálice» é natural, conciso e mantém a imagem.
  terminology: «Cálice» preserva a imagem profética de juízo. «Sua irmã Samaria» reproduz adequadamente o sufixo de segunda pessoa feminina e a identificação de Samaria como irmã figurada da destinatária.
