  choice: Você ficará cheia
  rationale: Reproduz a segunda pessoa feminina singular e a imagem de ser preenchida pelo conteúdo do cálice.
theological_decisions:
- issue: Relação sintática entre o enchimento e o cálice
  choice: Usar travessão para apresentar o cálice como explicação do que enche a destinatária
  alternative: “Você ficará cheia de embriaguez e aflição, com um cálice de horror...”
  rationale: O hebraico justapõe as expressões sem explicitar a relação; o travessão mantém a força poética e evita sugerir que ela apenas carrega o cálice.
