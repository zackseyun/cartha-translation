  text: וּ/שְׁמוֹתָ֗/ן אָהֳלָ֤ה הַ/גְּדוֹלָה֙ וְ/אָהֳלִיבָ֣ה אֲחוֹתָ֔/הּ וַ/תִּֽהְיֶ֣ינָה לִ֔/י וַ/תֵּלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/שְׁמוֹתָ֕/ן שֹׁמְר֣וֹן אָהֳלָ֔ה וִ/ירוּשָׁלִַ֖ם אָהֳלִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/004.yaml
  text: 'Their names were Oholah the elder and Oholibah her sister[a]. They became mine and bore sons and daughters. As for their names: Samaria is Oholah[b], and Jerusalem is Oholibah.'
translation:
  language: pt
  text: 'Seus nomes eram Aolá, a mais velha, e Aolibá, sua irmã.[a] Elas se tornaram minhas e deram à luz filhos e filhas. Quanto aos seus nomes: Samaria é Aolá, e Jerusalém é Aolibá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes Aolá e Aolibá provavelmente evocam expressões hebraicas que significam “a tenda dela” e “minha tenda está nela”, reforçando a alegoria.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמוֹתָן
  choice: Seus nomes eram
  rationale: Introduz de modo natural os nomes das duas mulheres, sem necessidade de reproduzir mecanicamente a conjunção hebraica inicial.
- source_word: אָהֳלָה
  choice: Oolá
  rationale: Translitera o nome próprio conforme uma forma portuguesa clara e preserva no texto principal o nome, deixando seu provável jogo de palavras para a nota.
- source_word: הַגְּדוֹלָה
  choice: a mais velha
  rationale: No contexto de duas irmãs, o adjetivo indica senioridade, não tamanho; esta é a expressão corrente e inequívoca em português.
- source_word: וְאָהֳלִיבָה אֲחוֹתָהּ
  choice: e Oolibá, sua irmã
  rationale: Preserva a sequência hebraica e explicita naturalmente a relação entre as duas mulheres.
- source_word: וַתִּהְיֶינָה לִי
  choice: Elas se tornaram minhas
  rationale: Conserva a ideia de entrada numa relação de pertencimento, sem inserir no texto principal o termo mais explícito 'esposas', ausente da frase hebraica.
- source_word: וַתֵּלַדְנָה
  choice: deram à luz
  rationale: Expressa com naturalidade moderna o sentido materno do verbo ילד.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a distinção explícita entre descendentes masculinos e femininos presente no hebraico.
- source_word: וּשְׁמוֹתָן
  choice: 'Quanto aos seus nomes:'
  rationale: A segunda ocorrência retoma os nomes para identificar as personagens com as cidades; a fórmula assinala claramente essa transição explicativa.
- source_word: שֹׁמְרוֹן אָהֳלָה
  choice: Samaria é Oolá
  rationale: Acrescenta a cópula exigida pelo português para tornar clara a identificação alegórica implícita na construção nominal hebraica.
- source_word: וִירוּשָׁלִַם אָהֳלִיבָה
  choice: e Jerusalém é Oolibá
  rationale: Torna clara em português a segunda identificação alegórica, paralela à de Samaria.
theological_decisions:
- issue: Sentido de וַתִּהְיֶינָה לִי na alegoria profética
  choice: Elas se tornaram minhas
  alternative: Elas eram minhas; Elas se tornaram minhas esposas
  rationale: O contexto amplo da alegoria é conjugal, mas a cláusula diz literalmente que elas vieram a ser 'para mim'. A tradução preserva a relação de pertencimento e sua tensão teológica sem acrescentar terminologia matrimonial explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “a mais velha” a uma formulação mais literária como “a mais velha das duas”; “deram à luz” mantém clareza e naturalidade. A pontuação destaca a retomada explicativa final.
