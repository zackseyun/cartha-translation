  yaml_path: translation/ot/ezekiel/024/008.yaml
  text: To stir up wrath[a], to take vengeance, I have set her blood on a bare rock[b], so that it would not be covered.
translation:
  language: pt
  text: Para despertar a ira, para tomar vingança, pus o sangue dela sobre uma rocha nua[a], para que não fosse coberto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O sangue dela” também pode transmitir, neste contexto, a ideia do sangue que ela derramou ou de culpa de sangue; o hebraico, porém, conserva literalmente a imagem do sangue dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת חֵמָה
  choice: Para despertar a ira
  rationale: O infinitivo causativo de עלה com חֵמָה expressa fazer surgir ira. “Despertar a ira” é natural em português e mantém o sentido causativo e judicial.
- source_word: לִנְקֹם נָקָם
  choice: executar vingança
  rationale: O infinitivo acompanhado do substantivo cognato intensifica a ideia verbal. “Executar vingança” comunica de modo idiomático a ação enfática, sem acrescentar um objeto ausente no hebraico.
- source_word: נָתַתִּי
  choice: pus
  rationale: Embora נתן normalmente signifique “dar”, com complemento locativo tem o sentido de pôr ou colocar. “Pus” é direto e preserva a primeira pessoa e o aspecto contextual da ação.
- source_word: דָּמָהּ
  choice: o sangue dela
  rationale: Mantém a imagem concreta do singular hebraico. No contexto, o termo pode evocar o sangue derramado ou a culpa de sangue, mas essas implicações não substituem a imagem textual.
- source_word: צְחִיחַ סָלַע
  choice: uma rocha nua
  rationale: A expressão indica uma superfície rochosa exposta, na qual o sangue fica visível em vez de ser absorvido ou ocultado.
- source_word: לְבִלְתִּי הִכָּסוֹת
  choice: para que não fosse coberto
  rationale: A construção expressa propósito ou resultado pretendido. A formulação portuguesa conserva a voz passiva e a referência ao sangue.
theological_decisions:
- issue: Agência e propósito judicial na exposição do sangue
  choice: O falante declara ter colocado deliberadamente o sangue de Jerusalém à vista, em conexão com ira e vingança.
  alternative: Entender a frase apenas como descrição do estado exposto do sangue, sem destacar a intencionalidade divina.
  rationale: A forma verbal de primeira pessoa נָתַתִּי e os infinitivos de propósito indicam ação deliberada no contexto de juízo. A tradução preserva essa agência sem explicitar além do que o versículo diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução segue equivalência ótima, preservando a imagem concreta do sangue exposto e a linguagem judicial. Evita arcaísmos e não resolve indevidamente a possível amplitude contextual de דָּמָהּ.
