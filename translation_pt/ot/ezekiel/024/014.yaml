source:
  edition: WLC
  text: אֲנִ֨י יְהוָ֤ה דִּבַּ֨רְתִּי֙ בָּאָ֣ה וְ/עָשִׂ֔יתִי לֹֽא אֶפְרַ֥ע וְ/לֹא אָח֖וּס וְ/לֹ֣א אֶנָּחֵ֑ם כִּ/דְרָכַ֤יִ/ךְ וְ/כַ/עֲלִילוֹתַ֨יִ/ךְ֙ שְׁפָט֔וּ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/014.yaml
  text: I[a], Yahweh, have spoken; it is coming[b], and I will do it. I will not hold back, nor will I spare, nor will I relent. According to your ways and according to your deeds they will judge you[c], declares the Lord GOD.
translation:
  language: pt
  text: 'Eu, Yahweh, falei: está chegando, e eu o farei. Não recuarei[a], não pouparei nem voltarei atrás[b]. De acordo com os seus caminhos e os seus atos, a julgarão[c] — declaração do Senhor Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não me retrairei” ou “não desistirei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não mudarei de ideia”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico diz literalmente “eles a julgarão”: o verbo está na terceira pessoa do plural, com sujeito não identificado, e o objeto é feminino singular, provavelmente a cidade de Jerusalém. O sujeito foi omitido em português para conservar essa indeterminação.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: O perfeito apresenta a declaração divina como concluída e irrevogável; o pretérito perfeito é natural em português.
- source_word: בָּאָה
  choice: isso está chegando
  rationale: O verbo feminino singular tem sujeito implícito, provavelmente a calamidade ou sentença anunciada. O pronome neutro mantém essa referência não expressa.
- source_word: וְעָשִׂיתִי
  choice: e eu o farei
  rationale: No encadeamento profético, o perfeito tem valor futuro/resultativo e aponta para a execução iminente do que foi anunciado.
- source_word: אֶפְרַע
  choice: recuarei
  rationale: Expressa não se retrair ou não desistir da execução do juízo, sem especificar além do hebraico.
- source_word: אָחוּס
  choice: pouparei
  rationale: Em contexto de juízo, o verbo indica deixar de executar a sentença por compaixão.
- source_word: אֶנָּחֵם
  choice: voltarei atrás
  rationale: Comunica a ideia contextual de não revogar a sentença anunciada, preservando a tensão do verbo sem sugerir arrependimento moral.
- source_word: כִּדְרָכַיִךְ
  choice: de acordo com os seus caminhos
  rationale: Mantém a metáfora hebraica dos caminhos como conduta ou modo de vida.
- source_word: וְכַעֲלִילוֹתַיִךְ
  choice: e com os seus atos
  rationale: Traduz de modo claro as ações moralmente relevantes que fundamentam o julgamento.
- source_word: שְׁפָטוּךְ
  choice: vocês a julgarão
  rationale: Preserva o plural ativo indefinido do hebraico e o objeto feminino singular; a forma portuguesa explicita apenas o gênero já marcado no original.
- source_word: אֲדֹנָי יְהֹוִה
  choice: Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome pessoal יְהוָה e evita reduzir o segundo a outro título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome próprio presente no texto hebraico; no composto final, 'Senhor Yahweh' mantém separadamente título e nome.
- issue: Sentido de נָחַם aplicado a Deus
  choice: não voltarei atrás
  alternative: não mudarei de ideia / não me arrependerei
  rationale: A escolha transmite a não revogação do juízo anunciado sem eliminar a amplitude semântica do verbo nem sugerir necessariamente erro moral.
- issue: Agente plural de שְׁפָטוּךְ
  choice: vocês a julgarão
  alternative: ela será julgada
  rationale: O hebraico usa terceira pessoa masculina plural com agente não identificado. A tradução ativa conserva essa indeterminação, em vez de convertê-la silenciosamente em passiva.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. O tratamento de segunda pessoa no trecho final é feminino singular no hebraico; em português, o pronome objeto “a” preserva essa marca. O plural indefinido foi mantido ativamente, embora possa soar menos habitual, para não apagar a forma do texto-fonte.
