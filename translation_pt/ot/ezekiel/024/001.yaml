id: EZK.24.1
reference: Ezekiel 24:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִי֩ דְבַר יְהוָ֨ה אֵלַ֜/י בַּ/שָּׁנָ֤ה הַ/תְּשִׁיעִית֙ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י בֶּ/עָשׂ֥וֹר לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/001.yaml
  text: And the word of Yahweh came to me in the ninth year[a], in the tenth month, on the tenth day of the month, saying,
translation:
  language: pt
  text: 'A palavra de Yahweh veio a mim no nono ano[a], no décimo mês, no décimo dia do mês, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “no nono ano”. O sistema de datação de Ezequiel geralmente toma como referência os anos do exílio do rei Joaquim.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: A palavra de Yahweh veio a mim
  rationale: Reproduz de modo natural em português a fórmula profética hebraica, preservando tanto o valor de דְבַר como “palavra” quanto o nome divino e a direção “a mim”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּשָּׁנָה הַתְּשִׁיעִית
  choice: no nono ano
  rationale: Mantém a formulação do hebraico sem acrescentar no corpo do texto o marco cronológico subentendido.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: no décimo mês
  rationale: Equivalência calendárica direta e natural para חֹדֶשׁ neste contexto.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no décimo dia do mês
  rationale: Explicita corretamente que se trata do dia dentro do mês, conforme o idioma hebraico.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Preserva a fórmula introdutória da fala que continua no versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino. “Yahweh” o preserva por transliteração, sem convertê-lo em título.
- issue: Referência cronológica de “nono ano”
  choice: Manter apenas “no nono ano” no texto e explicar em nota
  alternative: “no nono ano do exílio do rei Joaquim”
  rationale: O complemento é inferido do sistema de datação usado em Ezequiel, mas não está expresso neste versículo; mantê-lo na nota evita eliminar essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com estrutura profética reconhecível. Emprega “Yahweh” para o Tetragrama e conserva a concisão e a ambiguidade cronológica do original.
