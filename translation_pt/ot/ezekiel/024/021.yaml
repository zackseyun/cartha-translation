source:
  edition: WLC
  text: אֱמֹ֣ר לְ/בֵ֣ית יִשְׂרָאֵ֗ל כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מְחַלֵּ֤ל אֶת מִקְדָּשִׁ/י֙ גְּא֣וֹן עֻזְּ/כֶ֔ם מַחְמַ֥ד עֵֽינֵי/כֶ֖ם וּ/מַחְמַ֣ל נַפְשְׁ/כֶ֑ם וּ/בְנֵי/כֶ֧ם וּ/בְנֽוֹתֵי/כֶ֛ם אֲשֶׁ֥ר עֲזַבְתֶּ֖ם בַּ/חֶ֥רֶב יִפֹּֽלוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/021.yaml
  text: 'Say to the house of Israel[a], ‘Thus says the Lord GOD: Behold, I am about to profane my sanctuary, the pride of your strength, the delight of your eyes, and the desire of your soul[c][b]; and your sons and your daughters whom you left behind will fall by the sword.’'
translation:
  language: pt
  text: 'Diga à casa de Israel: “Assim diz o Senhor Yahweh: Eis que estou prestes a profanar o meu santuário[a], o orgulho da força de vocês, o deleite dos olhos de vocês[b] e aquilo que a alma de vocês estima[c]. Seus filhos e suas filhas, que vocês deixaram para trás, cairão à espada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dessacralizar” ou “tornar comum o meu santuário”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o desejo dos olhos de vocês”.'
    reason: lexical_alternative
  - marker: c
    text: A rara expressão hebraica também pode significar “aquilo de que a alma de vocês se compadece” ou “aquilo que a alma de vocês poupa”.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אֱמֹר לְבֵית יִשְׂרָאֵל
  choice: Diga à casa de Israel
  rationale: Mantém o imperativo singular dirigido a Ezequiel e conserva a expressão coletiva e pactual “casa de Israel”.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Preserva a fórmula profética e representa distintamente אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”.
- source_word: הִנְנִי מְחַלֵּל
  choice: Eis que estou prestes a profanar
  rationale: “Eis que” retém a solenidade da autoapresentação divina; “estou prestes a” comunica a iminência contextual do particípio.
- source_word: מִקְדָּשִׁי
  choice: o meu santuário
  rationale: É mais exato e abrangente que “templo”, embora o templo de Jerusalém esteja em vista.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: o orgulho da força de vocês
  rationale: Reproduz de perto a cadeia construta e indica que o santuário era objeto da confiança orgulhosa de Israel.
- source_word: מַחְמַד עֵינֵיכֶם
  choice: o encanto dos seus olhos
  rationale: Expressa com naturalidade aquilo que é precioso e deleitoso aos olhos, preservando a imagem hebraica.
- source_word: וּמַחְמַל נַפְשְׁכֶם
  choice: aquilo que a alma de vocês estima
  rationale: O substantivo raro relaciona-se a poupar, compadecer-se ou tratar como precioso. A formulação mantém o referente relativamente aberto sem reduzi-lo simplesmente a “desejo”.
- source_word: וּבְנֵיכֶם וּבְנוֹתֵיכֶם
  choice: Seus filhos e suas filhas
  rationale: Conserva o par explicitamente marcado no hebraico, em vez de generalizá-lo como “filhos” ou “crianças”.
- source_word: אֲשֶׁר עֲזַבְתֶּם
  choice: que vocês deixaram para trás
  rationale: A expressão comunica naturalmente que eles permaneceram em Jerusalém quando os ouvintes foram deslocados.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: cairão à espada
  rationale: Preserva o idioma hebraico tradicional para morte violenta pela guerra e o registro profético.
theological_decisions:
- issue: Representação de יהוה após אֲדֹנָי na fórmula profética
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor Deus
  rationale: “Senhor Yahweh” distingue os dois termos hebraicos, preserva o nome divino e evita ocultá-lo sob um título, sem confundir אֲדֹנָי e יהוה.
- issue: Agência divina na profanação do santuário
  choice: estou prestes a profanar o meu santuário
  alternative: permitirei que o meu santuário seja profanado
  rationale: O hebraico atribui diretamente a ação a Yahweh. A tradução não suaviza essa tensão teológica introduzindo mera permissão.
- issue: Sentido do raro מַחְמַל נַפְשְׁכֶם
  choice: aquilo que a alma de vocês estima
  alternative: o desejo da alma de vocês; aquilo de que a alma de vocês se compadece
  rationale: O termo admite associações com poupar, ter compaixão e estimar. A escolha conserva o valor afetivo no paralelismo e uma nota registra a incerteza lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural, mantém a fórmula profética e as imagens hebraicas, e usa notas somente onde há alternativas lexicais relevantes.
