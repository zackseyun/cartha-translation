  source_fidelity: A estrutura preditiva, a comparação com o ato anterior de Ezequiel e as duas negações futuras são bem preservadas. Contudo, «pão de outras pessoas» já explicita no texto principal a compreensão de alimento fornecido por terceiros; o hebraico lê literalmente «pão de homens/pessoas» e deixa essa relação idiomática menos definida.
  naturalness: «E vocês farão como eu fiz» e «não cobrirão o bigode» são naturais em português moderno. «O pão dos outros» é uma formulação idiomática, suficientemente clara e menos explicativa que «pão de outras pessoas».
  terminology: «Bigode» é uma opção concisa e defensável para שָׂפָם neste contexto; a nota esclarece a referência ao lábio superior e o costume. A nota sobre o pão deve conservar o sentido idiomático provável como possibilidade, não como conteúdo já imposto pelo texto principal.
