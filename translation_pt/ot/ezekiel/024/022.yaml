  text: וַ/עֲשִׂיתֶ֖ם כַּ/אֲשֶׁ֣ר עָשִׂ֑יתִי עַל שָׂפָם֙ לֹ֣א תַעְט֔וּ וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/022.yaml
  text: 'And you will do as I have done: you will not cover your mustache[b][a], and you will not eat the bread of men.'
translation:
  language: pt
  text: 'E vocês farão como eu fiz: não cobrirão o bigode[a] e não comerão o pão dos outros.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cobrir o bigode ou o lábio superior era um costume associado ao luto ou à impureza.
    reason: cultural_note
  - marker: b
    text: Ou, possivelmente, “o pão dos enlutados”, isto é, alimento levado por outras pessoas para consolar quem estava de luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: E vocês farão
  rationale: O perfeito com waw dá continuidade à previsão/instrução profética do contexto; o futuro é natural em português, e “E” preserva a ligação com o que precede.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: como eu fiz
  rationale: Compara a conduta futura do povo com o ato simbólico já realizado por Ezequiel; o pretérito perfeito é direto e natural em português.
- source_word: עַל שָׂפָם
  choice: o bigode
  rationale: שָׂפָם designa a região do bigode ou do lábio superior. Com o verbo “cobrir”, omitir uma tradução separada de עַל produz português mais natural sem perder o gesto descrito.
- source_word: לֹא תַעְטוּ
  choice: não cobrirão
  rationale: O verbo indica cobrir ou envolver. Aqui descreve um costume de luto; “cobrir” comunica o sentido sem especificar indevidamente o tecido ou o modo do gesto.
- source_word: לֶחֶם אֲנָשִׁים
  choice: o pão de outras pessoas
  rationale: 'Mantém os elementos explícitos “pão” e “pessoas”, enquanto “outras” esclarece a relação idiomática provável: alimento levado por terceiros aos enlutados. A nota preserva a alternativa lexical mais interpretativa.'
- source_word: לֹא תֹאכֵלוּ
  choice: não comerão
  rationale: O futuro corresponde à força preditiva no contexto e mantém o paralelismo com “não cobrirão”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo. A tradução conserva a estrutura preditiva e a expressão concreta “pão”, mas evita o pouco natural “pão de homens”.
