base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/017.yaml
  text: Groan silently[a]; do not make mourning for the dead. Bind your turban on yourself, and put your sandals on your feet. Do not cover over your mustache[b], and do not eat the bread of men.
translation:
  language: pt
  text: Geme em silêncio; não faça luto pelos mortos. Prenda o turbante à cabeça e calce as sandálias. Não cubra o bigode[a] e não coma o pão dos homens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não cubra o lábio superior”. O termo hebraico pode designar especificamente a região do lábio superior, e não o bigode como pelos faciais.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “pão de homens”. A expressão provavelmente se refere à comida levada por outras pessoas a quem estava de luto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאָנֵק דֹּם
  choice: Geme em silêncio
  rationale: O imperativo de אנק expressa um gemido de dor, enquanto דֹּם exige silêncio ou contenção. A formulação preserva a tensão intencional entre gemer e permanecer em silêncio, sem eliminar um dos elementos.
- source_word: מֵתִים אֵבֶל לֹא תַעֲשֶׂה
  choice: não faça luto pelos mortos
  rationale: A expressão עשה אבל se refere à prática do luto, incluindo seus costumes externos. A tradução mantém tanto a ideia de lamento quanto a de atos rituais, sem acrescentar uma interpretação específica.
- source_word: פְאֵרְךָ חֲבוֹשׁ עָלֶיךָ
  choice: Prenda o turbante à cabeça
  rationale: פְאֵר designa aqui uma cobertura de cabeça associada à apresentação normal ou digna, em contraste com os sinais de luto. חבש indica prendê-la ou envolvê-la; a menção à cabeça, implícita no hebraico, torna a instrução natural em português.
- source_word: וּנְעָלֶיךָ תָּשִׂים בְּרַגְלֶיךָ
  choice: calce as sandálias
  rationale: A forma idiomática portuguesa comunica com clareza a ordem literal de pôr as sandálias nos pés e o contraste com o costume de andar descalço durante o luto.
- source_word: וְלֹא תַעְטֶה עַל שָׂפָם
  choice: Não cubra a região do bigode
  rationale: שָׂפָם pode indicar o bigode ou, mais precisamente, a região do lábio superior. “Região do bigode” mantém a referência facial sem decidir em excesso entre essas possibilidades; a alternativa lexical é registrada em nota.
- source_word: וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל
  choice: não coma o pão oferecido por outras pessoas
  rationale: A expressão hebraica é literalmente compacta, “pão de pessoas”, e provavelmente se refere à comida levada por outros à pessoa enlutada. A tradução torna a relação compreensível em português, enquanto a nota conserva a literalidade e a incerteza contextual.
theological_decisions:
- issue: Descrição dos costumes de luto
  choice: Apresentar as ordens como proibições de sinais habituais de luto, sem atribuir a cada gesto um significado doutrinário específico.
  alternative: Interpretar os gestos exclusivamente como regulamentos sacerdotais ou apenas como sinais de impureza.
  rationale: O contexto descreve uma ação simbólica exigida de Ezequiel. O versículo enumera práticas concretas, mas não explica individualmente sua teologia; por isso, a tradução permanece descritiva.
- issue: Tensão entre gemer e guardar silêncio
  choice: Preservar ambos os imperativos na expressão “Geme em silêncio”.
  alternative: Entender דֹּם como uma ordem separada, “Geme; fica calado”, ou reduzir a frase a “Suspira em silêncio”.
  rationale: A construção hebraica admite que דֹּם qualifique o gemido ou funcione como ordem de contenção. A formulação escolhida conserva a tensão do texto e sua concisão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais como “calce as sandálias”. Mantém-se a concisão imperativa do hebraico e preservam-se em notas as ambiguidades de שָׂפָם e לֶחֶם אֲנָשִׁים.
