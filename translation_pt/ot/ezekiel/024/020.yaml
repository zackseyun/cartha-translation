  text: 'Então eu lhes disse: “A palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu lhes disse
  rationale: O wayyiqtol de אמר dá continuidade à sequência narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: אֲלֵיהֶם
  choice: lhes
  rationale: A preposição אֶל com sufixo de terceira pessoa masculina plural indica os destinatários da fala; o pronome “lhes” é claro e idiomático.
- source_word: דְּבַר יְהוָה
  choice: A palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e sua ligação intertextual, sem substituir “palavra” pela interpretação “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הָיָה אֵלַי
  choice: veio a mim
  rationale: Embora הָיָה tenha o sentido básico de “ser/estar”, na fórmula profética a expressão idiomática em português é “veio a mim”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva diretamente o infinitivo hebraico usado para introduzir a citação que continua no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa por transliteração e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com leve formalidade própria da fórmula profética. A oração termina com dois-pontos porque a mensagem divina continua no versículo seguinte.
