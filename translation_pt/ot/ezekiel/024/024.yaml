base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/024.yaml
  text: And Ezekiel will be a sign for you; according to all that he has done, you will do. When it comes, then you will know that I am the Lord GOD.
translation:
  language: pt
  text: Ezequiel será um sinal para vocês. Tudo o que ele fez, vocês também farão. Quando isso acontecer, vocês saberão que eu sou o Soberano SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹפֵת
  choice: sinal
  rationale: Expressa o ato simbólico e portentoso que Ezequiel encarna, em linguagem natural e fiel ao contexto profético.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה תַּעֲשׂוּ
  choice: Tudo o que ele fez, vocês também farão
  rationale: Mantém a correspondência enfática entre o comportamento do profeta e o futuro comportamento dos ouvintes.
- source_word: בְּבֹאָהּ
  choice: Quando isso acontecer
  rationale: O sufixo feminino singular tem referente contextual não explicitado; “isso” preserva a referência ampla ao acontecimento anunciado sem impor um antecedente específico.
- source_word: אֲדֹנָי יְהוִה
  choice: Soberano SENHOR
  rationale: Distingue o título Adonai do nome divino representado tradicionalmente por SENHOR e evita a formulação pouco natural “Senhor SENHOR”.
theological_decisions:
- issue: Natureza de Ezequiel como מוֹפֵת
  choice: Ezequiel será um sinal para vocês
  alternative: Ezequiel lhes servirá de presságio
  rationale: “Sinal” preserva a função profética encarnada sem restringi-la à ideia de mau agouro.
- issue: Identidade expressa por אֲדֹנָי יְהוִה
  choice: eu sou o Soberano SENHOR
  alternative: eu sou o Senhor YHWH
  rationale: A forma escolhida mantém título e nome divinos distintos em português bíblico corrente, sem vocalizar o Tetragrama de modo controverso.
translation_notes:
  register: Português moderno, digno e direto, com tratamento plural “vocês” para ampla legibilidade brasileira. A divisão em três frases torna clara a progressão do hebraico sem eliminar sua tensão profética.
