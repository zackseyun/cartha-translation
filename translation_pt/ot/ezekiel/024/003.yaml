  text: וּ/מְשֹׁ֤ל אֶל בֵּית הַ/מֶּ֨רִי֙ מָשָׁ֔ל וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה שְׁפֹ֤ת הַ/סִּיר֙ שְׁפֹ֔ת וְ/גַם יְצֹ֥ק בּ֖/וֹ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/003.yaml
  text: 'And speak a proverb to the rebellious house[a], and say to them, ‘Thus says the Lord GOD: Set on the pot; set it on, and also pour water into it.’'
translation:
  language: pt
  text: 'Apresente uma parábola à casa rebelde[a] e diga-lhes: ‘Assim diz o Senhor Yahweh: Ponha a panela; ponha-a, e derrame também água nela.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um provérbio” ou “uma fala figurada”. O hebraico מָשָׁל pode designar provérbio, parábola ou dito figurado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשֹׁל ... מָשָׁל
  choice: Apresente uma parábola
  rationale: 'O verbo e o substantivo da mesma raiz formam uma construção enfática: proferir ou apresentar um mashal. Como a imagem da panela constitui uma fala figurada desenvolvida, “parábola” é natural em português e preserva melhor o caráter figurativo do que “provérbio” neste contexto.'
- source_word: בֵּית הַמֶּרִי
  choice: à casa rebelde
  rationale: Mantém “casa”, expressão profética significativa em Ezequiel, e comunica de modo natural a obstinação do povo.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה, evitando a repetição artificial “Senhor SENHOR” e preservando o nome da aliança.
- source_word: שְׁפֹת הַסִּיר שְׁפֹת
  choice: Ponha a panela no fogo; ponha-a
  rationale: O verbo indica colocar a panela para cozinhar. “No fogo” explicita de maneira natural em português o cenário implícito, e a repetição do imperativo hebraico é preservada.
- source_word: וְגַם יְצֹק בּוֹ מָיִם
  choice: e derrame também água dentro dela
  rationale: Preserva tanto o valor aditivo de וְגַם como o sentido concreto de יצק, “derramar”, sem ampliar para “encher”.
theological_decisions:
- issue: Forma do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução mantém separadamente o título “Senhor” e o nome próprio “Yahweh”. Isso conserva a distinção do hebraico sem impor uma interpretação denominacional.
- issue: Identificação da “casa rebelde”
  choice: manter a expressão profética sem substituir seu referente no texto
  alternative: o povo rebelde
  rationale: “Casa” pode designar coletivamente Israel/Judá, mas conservar a metáfora histórica evita resolver no corpo do versículo algo que o idioma profético deixa expresso dessa forma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem imperativa e a repetição do hebraico foram preservadas; “no fogo” torna idiomática a ação de pôr a panela para cozinhar.
