base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/005.yaml
  text: Take the choicest of the flock[a], and also pile the bones under it; bring it to a boil, boil it well[b], and let its bones be cooked in it.
translation:
  language: pt
  text: Pegue o melhor do rebanho[a] e também amontoe os ossos debaixo da panela[b]. Faça-a ferver; ferva-a bem[c], e que os ossos dentro dela também cozinhem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pegue animais escolhidos do rebanho».'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por «amontoe» é raro, e seu sentido exato é incerto; neste contexto, refere-se a colocar os ossos debaixo da panela.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, literalmente, «faça ferver a sua fervura», expressão enfática que indica uma fervura intensa ou completa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְחַר הַצֹּאן
  choice: o melhor do rebanho
  rationale: מִבְחַר indica aquilo que é selecionado ou de melhor qualidade. A expressão portuguesa preserva tanto a ideia de escolha quanto o valor coletivo de הַצֹּאן.
- source_word: לָקֹוחַ
  choice: Pegue
  rationale: A forma verbal funciona como ordem no contexto da alegoria culinária; «Pegue» é direta, atual e natural.
- source_word: דּוּר הָעֲצָמִים תַּחְתֶּיהָ
  choice: amontoe os ossos debaixo da panela
  rationale: דּוּר é raro e seu sentido exato é incerto, mas o contexto aponta para dispor ou amontoar ossos sob a panela. A explicitação de «panela» torna claro o referente do pronome feminino sem alterar a cena.
- source_word: רַתַּח רְתָחֶיהָ
  choice: Faça-a ferver; ferva-a bem
  rationale: A construção com verbo e substantivo cognato intensifica a fervura. A repetição verbal em português conserva a ênfase de modo natural.
- source_word: גַּם בָּשְׁלוּ עֲצָמֶיהָ בְּתוֹכָהּ
  choice: e que os ossos dentro dela também cozinhem
  rationale: A formulação mantém o valor volitivo ou injuntivo mais provável na sequência de ordens, conserva גַּם («também») e evita acrescentar uma relação final explícita como «para que».
