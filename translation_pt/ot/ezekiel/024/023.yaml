source:
  edition: WLC
  text: וּ/פְאֵרֵ/כֶ֣ם עַל רָאשֵׁי/כֶ֗ם וְ/נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם לֹ֥א תִסְפְּד֖וּ וְ/לֹ֣א תִבְכּ֑וּ וּ/נְמַקֹּתֶם֙ בַּ/עֲוֺנֹ֣תֵי/כֶ֔ם וּ/נְהַמְתֶּ֖ם אִ֥ישׁ אֶל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/023.yaml
  text: Your turbans will be on your heads and your sandals on your feet[a]; you will not mourn and you will not weep[c][b], but you will waste away in your iniquities and groan to one another.
translation:
  language: pt
  text: Seus turbantes estarão sobre suas cabeças, e suas sandálias, nos pés.[a] Vocês não se lamentarão nem chorarão; antes, definharão em suas iniquidades[b] e gemerão, cada homem a seu irmão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus adornos de cabeça”; o termo hebraico indica um adorno ou cobertura ornamental da cabeça, provavelmente um turbante neste contexto de luto.
    reason: lexical_alternative
  - marker: b
    text: “Em suas iniquidades” também pode ser entendido como “por causa de suas iniquidades” ou “em sua culpa”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cada homem a seu irmão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְאֵרֵיכֶם
  choice: seus turbantes
  rationale: פְּאֵר pode designar um adorno ou cobertura ornamental da cabeça. Neste contexto de costumes de luto, “turbantes” expressa de modo concreto a cobertura que permaneceria sobre a cabeça.
- source_word: נַעֲלֵיכֶם
  choice: suas sandálias
  rationale: נַעַל é o termo comum para calçado; “sandálias” é natural em português e adequado ao contexto material do antigo Israel.
- source_word: תִסְפְּדוּ
  choice: não se lamentarão
  rationale: ספד denota lamentação ou pranto formal pelos mortos. “Lamentar-se” preserva a referência à prática de luto.
- source_word: תִבְכּוּ
  choice: nem chorarão
  rationale: בכה significa chorar ou derramar lágrimas; “chorar” é direto, corrente e solene.
- source_word: נְמַקֹּתֶם
  choice: definharão
  rationale: A forma de מקק comunica consumir-se, deteriorar-se ou definhar. “Definharão” preserva a imagem de desgaste progressivo sem torná-la indevidamente gráfica.
- source_word: בַּעֲוֺנֹתֵיכֶם
  choice: em suas iniquidades
  rationale: עָוֹן pode abranger iniquidade, culpa e consequência da iniquidade. A tradução mantém a preposição “em” e evita decidir silenciosamente entre condição, causa e culpa.
- source_word: נְהַמְתֶּם
  choice: gemerão
  rationale: נהם descreve um som baixo de aflição ou angústia; “gemer” corresponde bem ao sofrimento contido neste contexto.
- source_word: אִישׁ אֶל אָחִיו
  choice: cada um com seu irmão
  rationale: A expressão hebraica é literalmente “um homem para/com seu irmão”. A formulação portuguesa preserva o termo de parentesco masculino e comunica naturalmente a reciprocidade do gemido.
theological_decisions:
- issue: Linguagem relacional marcada pelo masculino
  choice: cada um com seu irmão
  alternative: uns com os outros
  rationale: O hebraico contém אִישׁ, “homem/cada um”, e אָחִיו, “seu irmão”. A tradução conserva “irmão” em vez de neutralizar integralmente a expressão, mas usa “cada um” para produzir português natural.
- issue: Amplitude semântica de עָוֹן no contexto de juízo
  choice: em suas iniquidades
  alternative: por causa de suas iniquidades; em sua culpa
  rationale: O termo pode apontar para o pecado, a culpa decorrente ou sua consequência punitiva. Manter “iniquidades” e a preposição “em” preserva essa tensão sem impor uma relação exclusivamente causal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem das imagens hebraicas foi preservada, enquanto a pontuação e a elipse de “estarão” antes de “nos pés” tornam o período natural. Os marcadores foram colocados junto às expressões que explicam.
