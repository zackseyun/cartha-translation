base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/007.yaml
  text: For her blood is in her midst[a]; she set it on a bare rock[b]. She did not pour it out on the ground to cover it with dust.
translation:
  language: pt
  text: Pois o sangue dela está no meio dela[a]; ela o pôs sobre uma rocha nua[b]. Não o derramou no chão para cobri-lo com pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a culpa de sangue dela”. O hebraico diz literalmente “o sangue dela”, usando a imagem concreta para expressar a culpa pela violência.'
    reason: lexical_alternative
  - marker: b
    text: Cobrir o sangue com terra alude ao dever de não deixar exposto o sangue derramado; aqui, ele permanece abertamente visível sobre a rocha nua.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação causal da imagem de julgamento precedente, de modo natural em português.
- source_word: דָמָהּ
  choice: o sangue dela
  rationale: Preserva o sentido concreto de 'sangue' e sua função central na imagem, embora no contexto também implique culpa por derramamento de sangue.
- source_word: בְּתוֹכָהּ הָיָה
  choice: está no meio dela
  rationale: Mantém a imagem locativa e corporativa da cidade; o presente comunica adequadamente o valor estativo e vívido da forma hebraica.
- source_word: עַל צְחִיחַ סֶלַע
  choice: sobre uma rocha nua
  rationale: Expressa uma superfície rochosa descoberta, na qual o sangue permanece exposto e não pode ser absorvido.
- source_word: שָׂמָתְהוּ
  choice: ela o pôs
  rationale: Tradução direta e natural do verbo שׂים com o sufixo de objeto.
- source_word: לֹא שְׁפָכַתְהוּ
  choice: Não o derramou
  rationale: Conserva o ato concreto de despejar o sangue, sem antecipar interpretativamente o sentido de matar ou cometer violência.
- source_word: עַל הָאָרֶץ
  choice: no chão
  rationale: Neste quadro físico, 'chão' é mais concreto e corrente do que 'terra' em português.
- source_word: לְכַסּוֹת עָלָיו עָפָר
  choice: para cobri-lo com pó
  rationale: Mantém a vívida referência ao sangue que normalmente seria coberto com pó ou terra.
theological_decisions:
- issue: Sentido da imagem do sangue exposto
  choice: Manter no texto principal a imagem concreta do sangue deixado descoberto, como sinal de culpa pública e contaminação.
  alternative: Traduzir de forma mais interpretativa como 'culpa de sangue' ou 'sangue derramado'.
  rationale: 'A força teológica do versículo está na própria imagem: a violência de Jerusalém permanece manifesta diante de Deus. A tradução literal conserva essa força sem explicitar mais do que o hebraico.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura e a imagem concreta do hebraico foram preservadas sem rigidez excessiva; os pronomes têm referentes claros e as notas mantêm as ambiguidades lexical e cultural relevantes.
