  text: בֶּן אָדָ֕ם הִנְ/נִ֨י לֹקֵ֧חַ מִמְּ/ךָ֛ אֶת מַחְמַ֥ד עֵינֶ֖י/ךָ בְּ/מַגֵּפָ֑ה וְ/לֹ֤א תִסְפֹּד֙ וְ/לֹ֣א תִבְכֶּ֔ה וְ/ל֥וֹא תָב֖וֹא דִּמְעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/016.yaml
  text: Son of man[a], behold, I am taking from you the delight of your eyes with a blow, yet you shall not mourn or weep[c][b], nor shall your tears come.
translation:
  language: pt
  text: Filho do homem, eis que vou tirar de você, com um golpe, o deleite dos seus olhos[a]. Você não fará luto, não chorará, e suas lágrimas não virão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o desejo dos seus olhos”. A expressão se refere à pessoa mais preciosa para Ezequiel; no contexto, sua esposa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e não virá a sua lágrima”.
    reason: literal_rendering
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma característica de tratamento dirigida a Ezequiel ao longo do livro e corresponde diretamente ao idioma hebraico.
- source_word: הִנְנִי לֹקֵחַ
  choice: eis que vou tirar
  rationale: A construção com הִנְנִי e o particípio apresenta uma ação iminente e solene; em português, 'eis que vou tirar' comunica essa iminência de modo natural e digno.
- source_word: מַחְמַד עֵינֶיךָ
  choice: o encanto dos seus olhos
  rationale: Mantém a imagem hebraica de algo ou alguém profundamente precioso, sem explicitar no corpo do versículo que se trata da esposa de Ezequiel.
- source_word: בְּמַגֵּפָה
  choice: com um golpe
  rationale: O substantivo pode designar golpe, flagelo ou praga. 'Com um golpe' preserva a ideia de uma ação devastadora sem especificar indevidamente doença ou causa médica.
- source_word: תִסְפֹּד
  choice: lamentará
  rationale: Expressa o luto, inclusive em sua manifestação formal, distinguindo-o do choro mencionado em seguida.
- source_word: תִבְכֶּה
  choice: chorará
  rationale: Equivalente português corrente que mantém a distinção em relação ao ato mais amplo ou formal de lamentar.
- source_word: וְלֹא תָבוֹא דִּמְעָתֶךָ
  choice: nem deixará suas lágrimas correrem
  rationale: Traduz naturalmente a imagem literal 'sua lágrima não virá', preservando a referência explícita às lágrimas.
theological_decisions:
- issue: Explicitar se 'o encanto dos seus olhos' é a esposa de Ezequiel
  choice: Manter o idioma no texto principal e explicar o referente em nota
  alternative: sua amada esposa
  rationale: O contexto identifica a esposa, mas este versículo emprega uma expressão figurada. Preservá-la evita acrescentar ao corpo do texto algo que a linha não declara diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o tom profético solene, preserva a metáfora central e evita tornar a expressão final excessivamente rígida em português.
