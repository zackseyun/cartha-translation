  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִפָּ֤תַח פִּ֨י/ךָ֙ אֶת הַ/פָּלִ֔יט וּ/תְדַבֵּ֕ר וְ/לֹ֥א תֵֽאָלֵ֖ם ע֑וֹד וְ/הָיִ֤יתָ לָ/הֶם֙ לְ/מוֹפֵ֔ת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/027.yaml
  text: On that day your mouth will be opened when the fugitive comes to you[a], and you will speak and no longer be mute. So you will be a sign to them, and they will know that I am Yahweh.
translation:
  language: pt
  text: Naquele dia, sua boca se abrirá quando o fugitivo chegar até você[a]; então você falará e não ficará mais mudo. Você será um sinal para eles, e saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o sobrevivente”. A expressão hebraica é difícil e pode indicar o momento em que o fugitivo chega trazendo a notícia.'
    reason: alternativa lexical e dificuldade sintática
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal profética corrente, natural em português e fiel ao hebraico.
- source_word: יִפָּתַח פִּיךָ
  choice: sua boca se abrirá
  rationale: Preserva a imagem hebraica e o sentido passivo/reflexivo do nifal, ligando o texto ao fim da mudez de Ezequiel.
- source_word: אֶת הַפָּלִיט
  choice: quando o fugitivo chegar até você
  rationale: A construção com אֶת é difícil. Pelo contexto de 24.26 e 33.21-22, expressa de modo natural a ligação temporal entre a chegada do mensageiro fugitivo e a abertura da boca do profeta, sem ocultar a dificuldade textual.
- source_word: וּתְדַבֵּר וְלֹא תֵאָלֵם עוֹד
  choice: então você falará e não ficará mais mudo
  rationale: אלם indica mudez, e não apenas silêncio voluntário. “Então” torna clara em português a sequência dos acontecimentos.
- source_word: וְהָיִיתָ לָהֶם לְמוֹפֵת
  choice: Você será um sinal para eles
  rationale: “Sinal” comunica com clareza a função simbólica de מוֹפֵת em Ezequiel sem restringi-la a “prodígio” ou “portento”.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: e saberão que eu sou Yahweh
  rationale: Mantém a fórmula recorrente de reconhecimento em Ezequiel e translitera o nome divino pessoal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Restauração da fala de Ezequiel
  choice: Fim literal da mudez profética ligado à chegada do fugitivo
  alternative: Fim geral do silêncio ou capacitação puramente metafórica para falar
  rationale: O contexto narrativo liga a chegada da notícia sobre Jerusalém ao término da condição de mudez do profeta, sem exigir uma explicação adicional sobre seu mecanismo.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Fugitivo” conserva a ideia de alguém que escapou; a nota registra “sobrevivente” e a ambiguidade da construção hebraica.
