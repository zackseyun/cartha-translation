    text: Isto é, retire todos os pedaços sem escolher nenhum deles por sorteio.
    reason: cultural_note
  revision_rationale: A revisão restaura na oração final a afirmação no passado e o pronome feminino singular do hebraico, preservando a tensão referencial da alegoria em vez de identificar explicitamente os pedaços como objeto do sorteio. Também torna mais fluida a descrição da crosta, sem reduzir o alcance lexical do termo hebraico.
