revisions:
- from: 'Por isso, assim diz o Senhor Yahweh: Ai da cidade sanguinária, da panela cuja crosta está nela e da qual a crosta não saiu! Retire dela os pedaços, um por um[a]; não se lance sorte sobre eles.'
  to: 'Por isso, assim diz o Senhor Yahweh: Ai da cidade sanguinária, da panela com a crosta nela, e da qual a crosta não saiu! Retire dela os pedaços, um por um[a]; não caiu sobre ela nenhuma sorte.'
  rationale: A revisão restaura na oração final a afirmação no passado e o pronome feminino singular do hebraico, preservando a tensão referencial da alegoria em vez de identificar explicitamente os pedaços como objeto do sorteio. Também torna mais fluida a descrição da crosta, sem reduzir o alcance lexical do termo hebraico.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:41:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz bem a fórmula profética, o lamento contra a cidade de derramamento de sangue, a metáfora da panela e a retirada sucessiva das porções. Contudo, a última oração hebraica usa pronome feminino singular: literalmente, «não caiu sobre ela sorte». A versão «não se lance sorte sobre eles» muda tanto o sujeito verbal (de afirmação para injunção) quanto o referente gramatical (de singular para plural), resolvendo uma tensão que o hebraico mantém.'
  naturalness: O registro é moderno e digno. «A panela cuja crosta está nela» é compreensível, mas algo pesado; «a panela com a crosta nela» é mais natural sem perder a imagem do depósito aderido. «Retire dela os pedaços, um por um» é claro no contexto culinário.
  terminology: «Senhor Yahweh» preserva adequadamente os dois elementos de אֲדֹנָי יְהוִה. «Cidade sanguinária», «panela», «crosta» e «sorte» são escolhas defensáveis. «Crosta» mantém a latitude de חֶלְאָה, que pode designar depósito impuro, corrosão ou ferrugem.
  issues:
  - severity: medium
    issue: A oração final altera número, referente e modalidade verbal.
    rationale: לֹא נָפַל עָלֶיהָ גּוֹרָל significa, de modo mais próximo, «não caiu sobre ela nenhuma sorte». O feminino singular pode remeter à panela/cidade na alegoria; não deve ser convertido em «eles» nem em uma ordem negativa.
  - severity: low
    issue: A construção «cuja crosta está nela» soa pouco idiomática.
    rationale: Embora fiel, a formulação é estilisticamente pesada em português. «Com a crosta nela» conserva a localização expressa no hebraico e melhora a fluidez.
  revised_text: 'Por isso, assim diz o Senhor Yahweh: Ai da cidade sanguinária, da panela com a crosta nela, e da qual a crosta não saiu! Retire dela os pedaços, um por um[a]; não caiu sobre ela nenhuma sorte.'
  revised_footnotes:
