source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אוֹי֮ עִ֣יר הַ/דָּמִים֒ סִ֚יר אֲשֶׁ֣ר חֶלְאָתָ֣/ה בָ֔/הּ וְ/חֶ֨לְאָתָ֔/הּ לֹ֥א יָצְאָ֖ה מִמֶּ֑/נָּה לִ/נְתָחֶ֤י/הָ לִ/נְתָחֶ֨י/הָ֙ הוֹצִיאָ֔/הּ לֹא נָפַ֥ל עָלֶ֖י/הָ גּוֹרָֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/006.yaml
  text: 'Therefore thus says the Lord GOD: Woe to the city of bloodshed[a], the pot whose rust is in it, and whose rust has not gone out from it! Bring it out piece by piece[b]; no lot has fallen on it.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: Ai da cidade sanguinária, da panela com a crosta nela, e da qual a crosta não saiu! Retire dela os pedaços, um por um[a]; não caiu sobre ela nenhuma sorte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, retire todos os pedaços sem escolher nenhum deles por sorteio.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a conclusão judicial introduzida pelo contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional de mensageiro em português claro e digno.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém os dois elementos do título hebraico e representa o nome divino como Yahweh.
- source_word: אוֹי עִיר הַדָּמִים
  choice: Ai da cidade sanguinária
  rationale: “Ai” conserva a força de lamento e condenação; “sanguinária” comunica a culpa por derramamento de sangue.
- source_word: סִיר
  choice: panela
  rationale: Termo concreto e corrente que mantém a metáfora culinária do capítulo.
- source_word: חֶלְאָה
  choice: crosta
  rationale: Abrange o depósito impuro ou corrosivo aderido à panela sem restringir indevidamente o sentido à ferrugem.
- source_word: לֹא יָצְאָה מִמֶּנָּה
  choice: não saiu dela
  rationale: Preserva a imagem verbal do depósito que não se desprendeu da panela.
- source_word: לִנְתָחֶיהָ לִנְתָחֶיהָ הוֹצִיאָהּ
  choice: Retire dela os pedaços, um por um
  rationale: A repetição hebraica tem força distributiva; a formulação portuguesa indica a retirada sucessiva de cada pedaço.
- source_word: לֹא נָפַל עָלֶיהָ גּוֹרָל
  choice: não se lance sorte sobre eles
  rationale: Conserva a imagem cultural do sorteio e explicita, pelo referente plural, que os pedaços não devem ser selecionados por sorte.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A opção preserva tanto אֲדֹנָי quanto o nome próprio יהוה, sem fundi-los nem substituir o nome por um título.
- issue: Referente do comando e do sorteio
  choice: os pedaços são retirados um por um, sem sorteio
  alternative: a panela/cidade é retirada e nenhuma sorte cai sobre ela
  rationale: O contexto imediato da panela cheia de porções favorece os pedaços como objeto semântico da retirada e do sorteio, embora os sufixos hebraicos femininos conservem alguma tensão referencial.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. “Crosta” evita que o raro חֶלְאָה seja reduzido apenas a ferrugem e mantém a imagem de um resíduo impuro aderido à panela.
