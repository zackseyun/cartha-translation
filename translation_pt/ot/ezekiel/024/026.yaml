  text: On that day the fugitive will come to you to make your ears hear[a].
translation:
  language: pt
  text: Naquele dia, o sobrevivente virá até você para que você ouça a notícia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para fazer os ouvidos ouvirem”. Também pode ser traduzido como “para lhe trazer a notícia” ou “para informar você”. A expressão hebraica enfatiza que o relato chegará diretamente aos ouvidos de Ezequiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal natural em português, preservando a referência demonstrativa a um dia futuro específico.
- source_word: יָבֹוא
  choice: virá
  rationale: O imperfeito qal tem sentido futuro no contexto; o futuro simples é claro e natural em português.
- source_word: הַפָּלִיט
  choice: o fugitivo
  rationale: Designa aquele que escapou e vem trazer a notícia; “fugitivo” conserva a ideia concreta de alguém que fugiu, embora o contexto também permita entendê-lo como sobrevivente.
- source_word: אֵלֶיךָ
  choice: até você
  rationale: Reproduz de modo natural a direção do movimento até Ezequiel, a quem se dirige a forma masculina singular.
- source_word: לְהַשְׁמָעוּת אָזְנָיִם
  choice: para lhe trazer a notícia
  rationale: A expressão hebraica é idiomática e literalmente ligada ao ato de os ouvidos ouvirem. Esta formulação comunica em português que o fugitivo fará a informação chegar diretamente a Ezequiel, enquanto a nota preserva a imagem auditiva.
