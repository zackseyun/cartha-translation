  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה א֖וֹי עִ֣יר הַ/דָּמִ֑ים גַּם אֲנִ֖י אַגְדִּ֥יל הַ/מְּדוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/009.yaml
  text: 'Therefore thus says the Lord Yahweh: Woe to the city of bloodshed! I also will make the firewood pile great[a][b].'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: “Ai da cidade sanguinária![a] Eu também aumentarei a pilha de lenha.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cidade dos sangues”, expressão que indica uma cidade marcada por derramamento de sangue ou culpa de sangue.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu também tornarei maior a fogueira”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Conjunção conclusiva que mantém a ligação lógica com o contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em português claro e solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Traduz אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”.
- source_word: אוֹי
  choice: Ai
  rationale: Interjeição natural em português que conserva tanto o tom de lamento quanto o anúncio de juízo.
- source_word: עִיר הַדָּמִים
  choice: cidade sanguinária
  rationale: Comunica de modo conciso uma cidade caracterizada por derramamento de sangue e culpa de sangue, sem reproduzir de maneira obscura o plural hebraico literal.
- source_word: גַּם אֲנִי
  choice: Eu também
  rationale: Mantém a ênfase na participação do próprio Deus na ação anunciada.
- source_word: אַגְדִּיל
  choice: aumentarei
  rationale: 'Expressa o sentido causativo do hifil de גדל: tornar maior, ampliar.'
- source_word: הַמְּדוּרָה
  choice: a pilha de lenha
  rationale: No contexto da panela sobre o fogo, apresenta de maneira concreta e compreensível o combustível acumulado, preservando em nota a possibilidade de entender o termo como fogueira.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e torna explícito o nome da aliança sem impor uma paráfrase confessional.
- issue: Agente divino no agravamento do juízo
  choice: Eu também aumentarei
  alternative: Eu, por minha vez, aumentarei
  rationale: Preserva a declaração explícita de que Yahweh intensificará o fogo do juízo, sem atenuar a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Cidade sanguinária” evita o pouco natural “cidade dos sangues”; “pilha de lenha” mantém a imagem concreta do contexto culinário e judicial.
