  text: Pile up the wood[a], kindle the fire, cook the flesh thoroughly, and boil the broth[d][c][b]; and let the bones be charred.
translation:
  language: pt
  text: Amontoe a lenha[a], acenda o fogo, cozinhe completamente a carne[b] e prepare o caldo[c]; e que os ossos fiquem carbonizados[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Aumente a quantidade de lenha”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cozinhe bem a carne”. O hebraico diz literalmente “a carne”.
    reason: lexical_alternative
  - marker: c
    text: Ou “misture a mistura” ou “ferva o ensopado”. O hebraico usa um verbo e um substantivo cognatos, ambos ligados à preparação de uma mistura.
    reason: lexical_alternative
  - marker: d
    text: Ou “sejam queimados” ou “fiquem chamuscados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה הָעֵצִים
  choice: Amontoe a lenha
  rationale: O imperativo causativo de רבה pede que se aumente a quantidade de madeira. Em português, “amontoe a lenha” expressa isso de modo natural e preserva a força da ordem.
- source_word: הַדְלֵק הָאֵשׁ
  choice: acenda o fogo
  rationale: O imperativo causativo de דלק significa fazer pegar fogo. “Acenda” é atual, claro e adequado à cena da panela.
- source_word: הָתֵם הַבָּשָׂר
  choice: cozinhe completamente a carne
  rationale: תמם indica completar ou levar ao fim; no contexto culinário, exige que a carne seja totalmente cozida. “Carne” traduz naturalmente בשר e ainda comporta a dureza corporal da imagem profética.
- source_word: וְהַרְקַח הַמֶּרְקָחָה
  choice: e prepare o caldo
  rationale: רקח e o substantivo cognato מרקחה descrevem a preparação ou composição de uma mistura. Na imagem culinária, “prepare o caldo” é natural, embora o hebraico também possa sugerir misturar ou ferver a mistura.
- source_word: וְהָעֲצָמוֹת יֵחָרוּ
  choice: e que os ossos fiquem carbonizados
  rationale: A forma de חרר descreve os ossos queimados ou chamuscados pelo calor intenso. “Que ... fiquem carbonizados” preserva tanto a nuance volitiva quanto o resultado severo da ação.
