base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/018.yaml
  text: So I spoke to the people in the morning[a], and my wife died in the evening. Then in the morning I did as I had been commanded.
translation:
  language: pt
  text: Falei ao povo pela manhã[a], e minha esposa morreu ao entardecer. Na manhã seguinte, fiz conforme me havia sido ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E falei ao povo pela manhã [...] e, pela manhã, fiz conforme me havia sido ordenado”. A narrativa hebraica emprega uma série de verbos ligados por waw; a tradução apresenta a sequência em português natural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: Assim, falei
  rationale: O verbo ligado por waw dá continuidade à narrativa. “Assim” expressa de modo natural a progressão ou consequência no contexto, sem reproduzir mecanicamente a repetição de “e”.
- source_word: אֶל הָעָם
  choice: ao povo
  rationale: עָם designa coletivamente o povo; com אֶל, “ao povo” é a formulação portuguesa natural.
- source_word: בַּבֹּקֶר
  choice: pela manhã / Na manhã seguinte
  rationale: A primeira ocorrência indica o período da manhã. Na segunda, após a morte à tarde, “Na manhã seguinte” torna explícita em português a sequência temporal já comunicada pela narrativa hebraica.
- source_word: וַתָּמָת
  choice: morreu
  rationale: מות é o verbo comum para morrer. A tradução direta preserva a sobriedade do hebraico sem recorrer a eufemismo.
- source_word: אִשְׁתִּי
  choice: minha esposa
  rationale: Neste contexto marital, אִשָּׁה com o sufixo de primeira pessoa significa claramente “minha esposa”.
- source_word: בָּעָרֶב
  choice: à tarde
  rationale: עֶרֶב pode designar o fim da tarde ou o começo da noite. “À tarde” é natural e preserva o contraste temporal com a manhã, embora “ao entardecer” também seja possível.
- source_word: וָאַעַשׂ
  choice: fiz
  rationale: עשה é empregado de maneira ampla para indicar que Ezequiel executou a ação ordenada; “fiz” mantém o objeto implícito como no hebraico.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Introduz conformidade com a ordem recebida; “conforme” é claro, natural e digno.
- source_word: צֻוֵּיתִי
  choice: me havia sido ordenado
  rationale: A forma passiva apresenta Ezequiel como destinatário da ordem. O mais-que-perfeito composto indica adequadamente que a ordem precedeu seu cumprimento.
