  text: בְּ/טֻמְאָתֵ֖/ךְ זִמָּ֑ה יַ֤עַן טִֽהַרְתִּי/ךְ֙ וְ/לֹ֣א טָהַ֔רְתְּ מִ/טֻּמְאָתֵ/ךְ֙ לֹ֣א תִטְהֲרִי ע֔וֹד עַד הֲנִיחִ֥/י אֶת חֲמָתִ֖/י בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/013.yaml
  text: In your uncleanness is lewdness[a]. Because I cleansed you, but you were not cleansed from your uncleanness[b], you will not be cleansed anymore until I have satisfied my wrath against you.
translation:
  language: pt
  text: Em sua impureza, há devassidão. Porque eu purifiquei você[a], mas você não ficou pura de sua impureza, você não será purificada de novo até que eu descarregue minha ira sobre você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência também pode ser entendida no sentido de “eu tentei purificar você” ou “eu quis purificar você”; literalmente, porém, o hebraico diz “eu purifiquei você”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “até que eu faça minha ira repousar sobre você”, expressão que indica que a ira foi inteiramente descarregada.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֻמְאָתֵךְ
  choice: Em sua impureza
  rationale: Preserva a preposição ב e o campo semântico de impureza moral e ritual característico de Ezequiel.
- source_word: זִמָּה
  choice: devassidão
  rationale: Expressa a perversidade vergonhosa, frequentemente de conotação sexual, sem reduzi-la a uma maldade genérica.
- source_word: יַעַן
  choice: Porque
  rationale: Introduz naturalmente em português o fundamento causal do juízo anunciado.
- source_word: טִהַרְתִּיךְ
  choice: eu purifiquei você
  rationale: Segue de perto a forma verbal hebraica, sem inserir no texto principal a noção interpretativa de mera tentativa; a tensão com a oração seguinte é preservada e explicada em nota.
- source_word: וְלֹא טָהַרְתְּ
  choice: mas você não ficou pura
  rationale: Representa o estado resultante expresso pelo verbo e mantém o gênero feminino da destinatária, Jerusalém.
- source_word: מִטֻּמְאָתֵךְ
  choice: de sua impureza
  rationale: A preposição מן indica afastamento da impureza; a repetição mantém a coesão lexical do hebraico.
- source_word: לֹא תִטְהֲרִי עוֹד
  choice: você não será purificada de novo
  rationale: Comunica a negação futura e o valor de עוֹד em português atual.
- source_word: עַד הֲנִיחִי אֶת חֲמָתִי בָּךְ
  choice: até que eu descarregue sobre você toda a minha ira
  rationale: Transmite idiomaticamente a ideia de fazer a ira chegar ao repouso depois de plenamente aplicada, preservando a ação divina e a direção do juízo.
theological_decisions:
- issue: Se a primeira declaração de purificação descreve uma ação concluída ou uma tentativa/oferta de purificação
  choice: eu purifiquei você
  alternative: eu tentei purificar você; eu quis purificar você
  rationale: A forma hebraica declara diretamente a ação divina. A tradução mantém a tensão com “você não ficou pura”, em vez de resolvê-la no texto; a possibilidade contextual de ação destinada à purificação, mas sem resultado na destinatária, é registrada em nota.
- issue: Como expressar o repouso da ira divina
  choice: até que eu descarregue sobre você toda a minha ira
  alternative: até que eu faça minha ira repousar sobre você; até que minha ira contra você se esgote
  rationale: A formulação comunica a execução completa do juízo sem sugerir uma doutrina técnica de expiação ou satisfação, que não é explicitada pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita solenidade artificial; “pura” mantém a referência feminina a Jerusalém. A repetição de “impureza” reproduz deliberadamente a coesão lexical do original.
