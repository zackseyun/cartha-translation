source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/ל֗וֹא בְּ/י֨וֹם קַחְתִּ֤/י מֵ/הֶם֙ אֶת מָ֣עוּזָּ֔/ם מְשׂ֖וֹשׂ תִּפְאַרְתָּ֑/ם אֶת מַחְמַ֤ד עֵֽינֵי/הֶם֙ וְ/אֶת מַשָּׂ֣א נַפְשָׁ֔/ם בְּנֵי/הֶ֖ם וּ/בְנוֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/025.yaml
  text: And you[a], son of man, will it not be that on the day when I take from them their stronghold, the joy of their glory, the delight of their eyes[b], and the desire of their soul—their sons and their daughters—
translation:
  language: pt
  text: E você, filho do homem, não será que, no dia em que eu lhes tirar a sua fortaleza, a alegria do seu esplendor, o encanto dos seus olhos[a] e o anseio da sua alma[b] — seus filhos e suas filhas —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o desejo dos seus olhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aquilo para o qual sua alma se eleva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a forma característica e recorrente do tratamento dirigido a Ezequiel, sem substituir o título por uma paráfrase interpretativa.
- source_word: הֲלוֹא
  choice: não será que
  rationale: Preserva a força de pergunta retórica que espera resposta afirmativa e permite a continuação da construção temporal no versículo seguinte.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Reproduz o marcador temporal hebraico em português natural.
- source_word: קַחְתִּי מֵהֶם
  choice: eu lhes tirar
  rationale: Expressa o sentido de tomar ou retirar algo deles no contexto de juízo, sem especificar além do hebraico o modo dessa perda.
- source_word: מָעוּזָּם
  choice: a sua fortaleza
  rationale: Conserva tanto a ideia concreta de lugar fortificado como a noção metafórica de fonte de segurança ou refúgio.
- source_word: מְשׂוֹשׂ תִּפְאַרְתָּם
  choice: a alegria do seu esplendor
  rationale: Mantém a compacta relação poética entre alegria e esplendor, evitando reduzi-la a uma única ideia interpretativa.
- source_word: מַחְמַד עֵינֵיהֶם
  choice: o encanto dos seus olhos
  rationale: Expressa de modo idiomático aquilo que é precioso, desejável e agradável aos olhos, preservando a imagem corporal.
- source_word: מַשָּׂא נַפְשָׁם
  choice: o anseio da sua alma
  rationale: Representa aquilo para o qual a alma se eleva ou que deseja intensamente; a expressão hebraica é incomum, por isso a alternativa é registrada em nota.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: Preserva a menção explícita aos dois grupos, em vez de generalizá-los como apenas 'filhos' ou 'crianças'.
theological_decisions:
- issue: Referente das expressões de valor e desejo
  choice: Manter a sequência poética sem inserir explicitamente 'templo' ou 'Jerusalém'.
  alternative: Identificar diretamente a fortaleza e o encanto como o templo ou Jerusalém.
  rationale: O contexto favorece essa identificação, mas o versículo usa imagens e não nomeia diretamente o referente; explicitá-lo eliminaria uma abertura presente no texto.
- issue: Relação de 'seus filhos e suas filhas' com a lista anterior
  choice: Preservar a aposição com travessões e a frase suspensa.
  alternative: Transformar os filhos e as filhas em uma oração explicativa completa ou encerrar a pergunta neste versículo.
  rationale: O hebraico acrescenta os filhos e as filhas àquilo que será tirado, e a sintaxe prossegue no versículo seguinte; a pontuação conserva essa tensão sem completar artificialmente o período.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pergunta retórica e a construção incompleta no fim do versículo foram preservadas porque o período continua no versículo seguinte. Os pronomes possessivos no singular coletivo traduzem as formas hebraicas plurais de modo natural em português.
