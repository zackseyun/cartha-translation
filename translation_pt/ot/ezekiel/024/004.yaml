  yaml_path: translation/ot/ezekiel/024/004.yaml
  text: Gather its pieces into it[a], every good piece—the thigh and the shoulder[b]; fill it with choice bones.
translation:
  language: pt
  text: Reúna dentro dela seus pedaços[a], cada pedaço bom — a coxa e a espádua[b]; encha-a com ossos escolhidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus cortes de carne”; o termo hebraico se refere a porções de carne cortada.
    reason: lexical_alternative
  - marker: b
    text: Ou “cada pedaço escolhido”; neste contexto, “bom” tem o sentido de desejável ou selecionado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹף
  choice: Junte
  rationale: Imperativo de אסף. “Junte” expressa de modo natural a ordem de reunir e colocar na panela os pedaços destinados ao cozimento.
- source_word: נְתָחֶיהָ
  choice: os seus pedaços
  rationale: נתח designa pedaços ou porções resultantes do corte da carne. “Pedaços” é conciso, enquanto a nota explicita o sentido culinário.
- source_word: אֵלֶיהָ
  choice: nela
  rationale: O pronome feminino retoma a panela do contexto anterior e a preposição indica movimento para dentro dela.
- source_word: כָּל נֵתַח טוֹב
  choice: cada pedaço bom
  rationale: Preserva o distributivo כָּל e o adjetivo טוֹב sem acrescentar grau superlativo; no contexto, trata-se de porções desejáveis ou selecionadas.
- source_word: יָרֵךְ וְכָתֵף
  choice: a coxa e a espádua
  rationale: Mantém as duas partes anatômicas específicas do animal. “Espádua” é termo corrente para o corte correspondente ao ombro em contexto de carne.
- source_word: מִבְחַר עֲצָמִים
  choice: ossos escolhidos
  rationale: O constructo expressa seleção ou qualidade superior, mas não exige um superlativo. “Ossos escolhidos” conserva essa nuance sem ampliar para “os melhores”.
- source_word: מַלֵּא
  choice: encha-a
  rationale: Imperativo de מלא; o pronome retoma naturalmente a panela, objeto implícito no hebraico.
