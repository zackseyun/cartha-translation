  text: With toil she has wearied herself[a], yet her abundant corrosion does not go out from her[b]; her corrosion remains in the fire.
translation:
  language: pt
  text: Ela se cansou com seus esforços[a], mas sua abundante incrustação[b] não sai dela; no fogo, sua incrustação permanece[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Com esforços ela se cansou”.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “ferrugem”, “crosta” ou “impureza”. O termo hebraico se refere à impureza incrustada na panela usada como metáfora.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico termina de forma elíptica, literalmente: “no fogo, sua incrustação”. “Permanece” foi explicitado para dar clareza ao sentido.'
