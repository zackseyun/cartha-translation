lexical_decisions:
- source_word: תְּאֻנִים
  choice: de tanto esforço
  rationale: O plural indica esforços ou trabalhos penosos. A expressão adverbial é natural em português e conserva a ideia de empenho extenuante.
- source_word: הֶלְאָת
  choice: ela se fatigou
  rationale: A forma verbal feminina singular, da raiz לאה, concorda com a panela/cidade personificada e comunica o resultado de todo o esforço.
- source_word: וְלֹא תֵצֵא מִמֶּנָּה
  choice: mas ... não saiu dela
  rationale: Mantém o sentido concreto de יצא, “sair”, dentro da imagem da panela, sem transformar explicitamente a frase em “não pôde ser removida”.
- source_word: רַבַּת
  choice: abundante
  rationale: Expressa a grande quantidade ou extensão da impureza, sem restringir o sentido à espessura.
- source_word: חֶלְאָתָהּ
  choice: sua incrustação
  rationale: O termo designa a impureza aderida à panela. “Incrustação” preserva a imagem de uma camada resistente sem limitar o referente estritamente à ferrugem.
- source_word: בְּאֵשׁ חֶלְאָתָהּ
  choice: no fogo, sua incrustação permanece
  rationale: A frase hebraica termina de modo elíptico, literalmente “no fogo, sua incrustação”. O verbo “permanece” é explicitado para produzir uma frase portuguesa inteligível, mantendo o sentido contextual de que nem o fogo elimina a incrustação.
