base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/002.yaml
  text: 'Son of man[a], write down for yourself the name of the day[c][b], this very day: the king of Babylon has laid siege against Jerusalem on this very day.'
translation:
  language: pt
  text: 'Filho do homem, escreva para si[a] o nome do dia, deste exato dia[b]: o rei da Babilônia pôs cerco a Jerusalém[c] neste exato dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “anote a data”. Literalmente, “escreva para si o nome do dia”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete a expressão “neste exato dia” para dar ênfase.
    reason: lexical_alternative
  - marker: c
    text: Ou, “avançou contra Jerusalém”. Neste contexto, o verbo hebraico se refere ao início do cerco babilônico.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma de tratamento hebraica convencional dirigida a Ezequiel e sua força representativa humana, sem reduzi-la a uma paráfrase genérica.
- source_word: כתוב לְךָ
  choice: escreva para você
  rationale: Traduz o imperativo כתוב e conserva a força pessoal de לְךָ. A construção é clara em português internacional e natural para leitores brasileiros.
- source_word: אֶת שֵׁם הַיּוֹם
  choice: o nome do dia
  rationale: Preserva a expressão concreta do hebraico; no contexto, ela equivale à identificação da data, esclarecida em nota.
- source_word: אֶת עֶצֶם הַיּוֹם הַזֶּה
  choice: deste exato dia
  rationale: O substantivo עֶצֶם, nessa expressão, intensifica a identidade e precisão do dia. “Exato” comunica essa ênfase sem ampliar o sentido.
- source_word: סָמַךְ
  choice: pôs cerco
  rationale: No contexto militar e com Jerusalém como alvo, o verbo indica o início do cerco babilônico. A expressão portuguesa é direta e idiomática.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução direta e consagrada da construção hebraica.
- source_word: אֶל יְרוּשָׁלִַם
  choice: a Jerusalém
  rationale: Com “pôs cerco”, a preposição “a” é a regência portuguesa natural e comunica a ação hostil sem precisar acrescentar “contra”.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: neste exato dia
  rationale: Conserva a repetição enfática do original e destaca a simultaneidade precisa entre a ordem profética e o acontecimento histórico.
