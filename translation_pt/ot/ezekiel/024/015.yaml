  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética וַיְהִי דְבַר־יְהוָה אֵלַי, o sentido idiomático é que a palavra divina chegou ao profeta; “veio” preserva a fórmula bíblica em português natural.
- source_word: דְבַר
  choice: a palavra
  rationale: Neste contexto, דָּבָר designa uma comunicação divina. “A palavra” é direta, tradicional e menos interpretativa que “a mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa diretamente o movimento da comunicação em direção a Ezequiel como seu destinatário.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala direta que começa no versículo seguinte; “dizendo” reproduz essa função de modo conciso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” o preserva explicitamente, sem substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e solene, com manutenção da fórmula profética hebraica. A conjunção inicial foi preservada por meio de “E”, ligando o versículo ao fluxo narrativo anterior.
