  text: וְ/הַעֲמִידֶ֥/הָ עַל גֶּחָלֶ֖י/הָ רֵקָ֑ה לְמַ֨עַן תֵּחַ֜ם וְ/חָ֣רָה נְחֻשְׁתָּ֗/הּ וְ/נִתְּכָ֤ה בְ/תוֹכָ/הּ֙ טֻמְאָתָ֔/הּ תִּתֻּ֖ם חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/011.yaml
  text: Then set it empty on its coals[a], so that it may become hot and its bronze may glow, and its uncleanness within it may be melted, and its corrosion consumed.
translation:
  language: pt
  text: Depois, coloque-a, vazia, sobre as suas brasas, para que se aqueça, e o seu bronze fique incandescente, e a impureza dentro dela se derreta, e a sua crosta seja consumida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sua corrosão», «sua ferrugem» ou «sua escuma». O termo hebraico pode indicar corrosão do metal ou um resíduo incrustado e, neste contexto, representa a impureza moral de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמִידֶהָ
  choice: Depois, coloque-a
  rationale: O hifil de עמד com sufixo feminino singular manda pôr a panela em posição; «Depois» expressa naturalmente a sequência indicada pelo waw no contexto.
- source_word: עַל גֶּחָלֶיהָ
  choice: sobre as suas brasas
  rationale: גחלים designa brasas ou carvões em brasa. O sufixo feminino é preservado literalmente, embora possa se referir às brasas associadas à panela.
- source_word: רֵקָה
  choice: vazia
  rationale: O adjetivo feminino descreve a panela depois da retirada do conteúdo.
- source_word: לְמַעַן תֵּחַם
  choice: para que fique bem quente
  rationale: A oração de finalidade com חם indica aquecimento intenso; «bem quente» é claro e idiomático sem exagerar a imagem.
- source_word: וְחָרָה נְחֻשְׁתָּהּ
  choice: até que o seu bronze fique incandescente
  rationale: חרה comunica calor ardente; aplicado ao bronze, «fique incandescente» transmite o metal levado a calor intenso. «Até que» integra em português a progressão pretendida pelo aquecimento.
- source_word: נְחֻשְׁתָּהּ
  choice: o seu bronze
  rationale: נחשת pode indicar cobre ou bronze; «bronze» é a designação tradicional e plausível do material da panela, sem generalizá-lo como simples metal.
- source_word: וְנִתְּכָה
  choice: se derreta
  rationale: נתך pode significar derreter ou ser derramado. No quadro de aquecimento e refino, «se derreta» preserva melhor a metáfora metalúrgica.
- source_word: בְתוֹכָהּ טֻמְאָתָהּ
  choice: a impureza dentro dela
  rationale: טֻמְאָה abrange impureza ritual e moral. «Impureza» preserva essa amplitude em português e mantém a localização concreta no interior da panela.
- source_word: תִּתֻּם
  choice: seja consumida
  rationale: A forma de תמם indica chegar ao fim ou ser inteiramente eliminada; «seja consumida» combina com a ação destrutiva do fogo.
- source_word: חֶלְאָתָהּ
  choice: a sua crosta
  rationale: חלאה pode designar ferrugem, corrosão, escória, crosta ou sujeira aderida. «Crosta» funciona naturalmente para o resíduo incrustado numa panela de bronze e sustenta a extensão simbólica à contaminação moral; a nota registra alternativas importantes.
theological_decisions:
- issue: Preservar simultaneamente a panela literal e a impureza moral simbolizada no ato profético
  choice: Manter a linguagem concreta de aquecimento do bronze, derretimento e crosta, juntamente com «impureza»
  alternative: Substituir a imagem por termos abstratos como «pecado» ou «culpa», ou reduzi-la a linguagem puramente culinária
  rationale: O hebraico faz a panela funcionar como sinal do juízo sobre Jerusalém. A tradução não deve resolver a tensão entre objeto físico e referente moral, mas conservar ambos.
- issue: Valor de חֶלְאָתָהּ no encerramento
  choice: Traduzir por «crosta» e registrar «corrosão», «ferrugem» e «escória» em nota
  alternative: Escolher exclusivamente «corrosão» ou «escória» no texto
  rationale: O termo admite tanto resíduo ou sujeira incrustada quanto deterioração do metal. «Crosta» é compreensível e adequada à panela, enquanto a nota conserva a ambiguidade lexical relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sintaxe acompanha a progressão do hebraico sem soar mecânica; o feminino dos pronomes retoma «panela» no contexto imediato.
