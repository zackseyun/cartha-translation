  text: וְ/לֹ֧א יִֽטַמְּא֣וּ ע֗וֹד בְּ/גִלּֽוּלֵי/הֶם֙ וּ/בְ/שִׁקּ֣וּצֵי/הֶ֔ם וּ/בְ/כֹ֖ל פִּשְׁעֵי/הֶ֑ם וְ/הוֹשַׁעְתִּ֣י אֹתָ֗/ם מִ/כֹּ֤ל מוֹשְׁבֹֽתֵי/הֶם֙ אֲשֶׁ֣ר חָטְא֣וּ בָ/הֶ֔ם וְ/טִהַרְתִּ֤י אוֹתָ/ם֙ וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/023.yaml
  text: They will no longer defile themselves with their idols[a], with their detestable things, or with any of their transgressions. I will save them from all their dwelling places in which they sinned, and I will cleanse them. Then they will be my people[b], and I will be their God.
translation:
  language: pt
  text: Eles não voltarão a se contaminar com seus ídolos[a], com suas coisas detestáveis nem com nenhuma de suas transgressões. Eu os salvarei de todos os seus lugares de habitação nos quais pecaram[b] e os purificarei. Eles serão o meu povo, e eu serei o seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é uma designação fortemente depreciativa para falsos deuses.
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico diz literalmente “de todos os seus lugares de habitação nos quais pecaram”. Alguns entendem a expressão de modo mais amplo, como libertação dos lugares ou das circunstâncias ligados ao pecado; outros propõem a leitura “de todas as suas apostasias com que pecaram”.
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַמְּאוּ
  choice: se contaminar
  rationale: A forma reflexiva indica que eles próprios se tornam impuros; a expressão preserva tanto a dimensão moral quanto a ritual.
- source_word: גִּלּוּלֵיהֶם
  choice: seus ídolos
  rationale: É a forma mais clara e natural em português; uma nota registra o tom fortemente depreciativo do termo hebraico.
- source_word: שִׁקּוּצֵיהֶם
  choice: suas coisas detestáveis
  rationale: Abrange objetos e práticas repugnantes, sobretudo de caráter idólatra, sem restringir indevidamente o referente.
- source_word: פִּשְׁעֵיהֶם
  choice: suas transgressões
  rationale: Mantém a ideia de violação e rebeldia contra a autoridade divina em linguagem bíblica ainda compreensível.
- source_word: וְהוֹשַׁעְתִּי
  choice: Eu os salvarei
  rationale: Expressa diretamente a ação divina de resgatar ou libertar, sem reduzir seu alcance ao exílio ou a uma categoria teológica posterior.
- source_word: מוֹשְׁבֹתֵיהֶם
  choice: todos os lugares onde habitam
  rationale: Traduz o sentido lexical de lugares de habitação de modo mais natural que o substantivo abstrato 'moradas', preservando a dificuldade contextual do texto massorético.
- source_word: אֲשֶׁר חָטְאוּ בָהֶם
  choice: nos quais pecaram
  rationale: Mantém a ligação gramatical da oração relativa com os lugares de habitação, sem substituir o texto por uma interpretação conjectural.
- source_word: וְטִהַרְתִּי
  choice: os purificarei
  rationale: Conserva as dimensões ritual e moral do verbo no contexto da restauração.
- source_word: וְהָיוּ לִי לְעָם
  choice: Eles serão o meu povo
  rationale: Reproduz naturalmente a fórmula da aliança.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: eu serei o seu Deus
  rationale: Mantém a segunda metade da fórmula da aliança em português claro e solene.
theological_decisions:
- issue: Relação entre salvação, pecado e os lugares de habitação
  choice: Conservar no texto principal a referência do texto massorético aos lugares onde o povo habita e peca.
  alternative: Entender a expressão como referência às apostasias ou, mais amplamente, às circunstâncias associadas ao pecado.
  rationale: O substantivo apresentado pelo WLC significa literalmente lugares de habitação. Embora a frase seja contextualmente difícil e exista uma interpretação baseada em uma leitura próxima que significa 'apostasias', substituí-la no texto principal resolveria uma tensão que o hebraico transmitido preserva. A nota informa a alternativa sem impor um sistema doutrinário.
- issue: Sequência de restauração
  choice: Preservar a ordem salvação, purificação e renovação da relação de aliança.
  alternative: Explicitar uma ordem soteriológica ou identificar exclusivamente a salvação com o retorno geográfico do exílio.
  rationale: O versículo atribui toda a iniciativa a Deus, mas não define aqui um esquema teológico completo nem limita o resgate a uma única dimensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês/eles' sem regionalismos; evita arcaísmos como 'abominações' e conserva a fórmula solene da aliança. Os marcadores [a] e [b] aparecem no ponto exato a que cada nota se refere.
