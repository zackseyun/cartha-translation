  to: Eles não voltarão a se contaminar com seus ídolos[a], com suas coisas detestáveis nem com nenhuma de suas transgressões. Eu os salvarei de todos os seus lugares de habitação nos quais pecaram[b] e os purificarei. Eles serão o meu povo, e eu serei o seu Deus.
