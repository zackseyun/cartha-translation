source:
  edition: WLC
  text: וְ/עַבְדִּ֤/י דָוִד֙ מֶ֣לֶךְ עֲלֵי/הֶ֔ם וְ/רוֹעֶ֥ה אֶחָ֖ד יִהְיֶ֣ה לְ/כֻלָּ֑/ם וּ/בְ/מִשְׁפָּטַ֣/י יֵלֵ֔כוּ וְ/חֻקֹּתַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֥וּ אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/024.yaml
  text: My servant David will be king over them[a], and there will be one shepherd for all of them. They will walk in my judgments[b], and they will keep my statutes and do them.
translation:
  language: pt
  text: Meu servo Davi[a] será rei sobre eles, e haverá um só pastor para todos eles.[b] Eles andarão segundo os meus juízos, guardarão os meus estatutos e os praticarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Davi” pode referir-se literalmente a Davi, a um futuro governante da linhagem de Davi ou, em sentido tipológico, ao Messias. A tradução mantém o nome hebraico sem decidir entre essas interpretações.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e ele será o único pastor de todos eles”. O hebraico permite entender que a oração sobre o pastor se refere diretamente a Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Neste contexto régio e pactual, עֶבֶד funciona como designação honrosa de Davi; “servo” preserva o sentido e o registro sem enfatizar indevidamente a condição de escravo.
- source_word: דָוִד
  choice: Davi
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ עֲלֵיהֶם
  choice: será rei sobre eles
  rationale: מֶלֶךְ designa especificamente um rei, e עַל com o sufixo expressa sua autoridade sobre o povo.
- source_word: וְרֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  choice: e haverá um só pastor para todos eles
  rationale: “Pastor” conserva a imagem pastoral e régia. A construção existencial com “haverá” é natural em português e mantém aberta a relação sintática da cláusula com Davi.
- source_word: וּבְמִשְׁפָּטַי יֵלֵכוּ
  choice: Eles andarão nos meus juízos
  rationale: “Andar” preserva a metáfora hebraica de conduta, enquanto “juízos” conserva a nuance jurídica de מִשְׁפָּט e sua distinção em relação a “estatutos”.
- source_word: וְחֻקֹּתַי יִשְׁמְרוּ
  choice: guardarão os meus estatutos
  rationale: “Guardar” é uma expressão corrente de observância pactual, e “estatutos” representa as prescrições de חֻקּוֹת.
- source_word: וְעָשׂוּ אוֹתָם
  choice: e os praticarão
  rationale: O verbo עשה indica pôr os estatutos em ação; “praticar” comunica isso em português natural e evita o pouco idiomático “fazê-los”.
theological_decisions:
- issue: Identidade de “Davi” no oráculo de restauração
  choice: Manter “Davi” no texto principal, sem explicação interpretativa.
  alternative: Traduzir ou expandir como “o Messias”, “um descendente de Davi” ou “o Davi ressuscitado”.
  rationale: O hebraico nomeia Davi diretamente. A tradução conserva essa formulação e deixa em aberto se a referência é ao Davi histórico, a um futuro governante davídico ou, em leitura tipológica, ao Messias.
- issue: Relação entre Davi e o único pastor
  choice: 'Traduzir a segunda oração de modo existencial: “haverá um só pastor”.'
  alternative: 'Explicitar Davi como sujeito: “ele será o único pastor de todos eles”.'
  rationale: O contexto favorece a identificação do rei com o pastor, mas a construção hebraica não contém pronome sujeito explícito. A formulação escolhida preserva a unidade da liderança sem tornar explícita uma ligação sintática apenas implícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Preservam-se as imagens pactuais de “andar”, “pastor”, “juízos” e “estatutos”, evitando tanto arcaísmos desnecessários quanto paráfrases interpretativas.
