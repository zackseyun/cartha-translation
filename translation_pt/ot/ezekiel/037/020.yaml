  text: And the sticks on which you write will be in your hand before their eyes[a].
translation:
  language: pt
  text: E os pedaços de madeira nos quais você escrever estarão em sua mão, diante dos olhos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os bastões”. O termo hebraico pode referir-se de modo mais amplo a madeira; neste ato simbólico, designa os objetos de madeira que Ezequiel segura e nos quais escreve.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: E ... estarão
  rationale: O perfeito qal com conjunção, neste contexto de instrução profética, descreve o resultado futuro da ação ordenada. “Estarão” expressa esse sentido naturalmente em português.
- source_word: הָעֵצִים
  choice: os pedaços de madeira
  rationale: עֵץ pode designar árvore, madeira ou um objeto de madeira. Neste ato simbólico, refere-se às peças que Ezequiel inscreve e segura; “pedaços de madeira” é claro e evita a possível imagem inadequada de gravetos.
- source_word: אֲשֶׁר תִּכְתֹּב עֲלֵיהֶם
  choice: nos quais você escrever
  rationale: Preserva a oração relativa e o valor de עַל, indicando a superfície em que se escreve, com formulação natural e digna em português.
- source_word: בְּיָדְךָ
  choice: em sua mão
  rationale: Mantém o singular do hebraico e comunica que os objetos estarão fisicamente na mão do profeta, não apenas que a ação será realizada por ele.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Conserva a imagem concreta do idioma hebraico e ressalta que o ato simbólico será realizado de modo visível diante do povo.
