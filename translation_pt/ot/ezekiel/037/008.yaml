  text: וְ/רָאִ֜יתִי וְ/הִנֵּֽה עֲלֵי/הֶ֤ם גִּדִים֙ וּ/בָשָׂ֣ר עָלָ֔ה וַ/יִּקְרַ֧ם עֲלֵי/הֶ֛ם ע֖וֹר מִ/לְ/מָ֑עְלָ/ה וְ/ר֖וּחַ אֵ֥ין בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/008.yaml
  text: And I looked[a], and behold, there were sinews on them, and flesh had come up, and skin covered them from above; but there was no breath in them.
translation:
  language: pt
  text: Olhei, e eis que havia tendões sobre eles; a carne cresceu, e a pele os cobriu por cima. Mas não havia neles sopro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico rúach pode significar “sopro”, “vento” ou “espírito”. Aqui, “sopro” combina com os corpos ainda sem vida, mas a passagem mais ampla joga com os três sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Olhei
  rationale: O verbo ראה pode significar ver ou olhar; no fluxo da visão, “Olhei” expressa naturalmente o ato atento de observação do profeta.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama a atenção para a cena que se apresenta. “E eis que” mantém sua vivacidade em registro bíblico digno e compreensível.
- source_word: גִּדִים
  choice: tendões
  rationale: גִּדִים designa os tecidos fibrosos que ligam a estrutura corporal. “Tendões” é preciso e mais corrente no português moderno do que “nervos” ou “sinews” em tradução literal.
- source_word: וּבָשָׂר עָלָה
  choice: a carne cresceu
  rationale: בָּשָׂר é a carne corporal, e עָלָה descreve seu surgimento ou crescimento sobre os ossos; “cresceu” comunica de modo natural essa etapa da recomposição.
- source_word: וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה
  choice: e a pele os cobriu por cima
  rationale: קרם descreve a formação de uma camada ou cobertura; “os cobriu por cima” conserva tanto o resultado quanto a indicação exterior de מִלְמָעְלָה sem tornar a frase excessivamente técnica.
- source_word: וְרוּחַ אֵין בָּהֶם
  choice: Mas não havia neles sopro
  rationale: Neste momento da visão, os corpos já estão recompostos, mas continuam sem vida; “sopro” se ajusta ao contexto imediato, enquanto a nota preserva os demais sentidos de רוּחַ.
theological_decisions:
- issue: Sentido de רוּחַ na visão do vale de ossos secos
  choice: sopro
  alternative: vento; espírito
  rationale: A oração descreve corpos recompostos que ainda não respiram, favorecendo “sopro”. Contudo, o capítulo explora deliberadamente a amplitude semântica de רוּחַ, de modo que “vento” e “espírito” não devem ser apagados.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “E eis que” preserva a força do marcador visionário; “tendões” evita uma formulação arcaica ou anatomicamente enganosa. O marcador da nota foi colocado junto de “sopro”, termo ao qual a explicação lexical se refere.
