  text: לָ/כֵן֩ הִנָּבֵ֨א וְ/אָמַרְתָּ֜ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י פֹתֵ֜חַ אֶת קִבְרֽוֹתֵי/כֶ֗ם וְ/הַעֲלֵיתִ֥י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּ֑/י וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/012.yaml
  text: 'Therefore prophesy and say to them[a], ‘Thus says the Lord GOD: Behold, I am opening your graves and will bring you up from your graves, my people[b], and I will bring you into the land of Israel.’'
translation:
  language: pt
  text: 'Portanto, profetize e diga-lhes: “Assim diz o Senhor DEUS: Eis que abrirei as suas sepulturas e farei vocês subirem das suas sepulturas, meu povo,[a] e levarei vocês à terra de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem pode descrever a restauração de Israel do exílio por meio da linguagem de abertura das sepulturas, ao mesmo tempo que ressoa com a esperança posterior de ressurreição.
    reason: cross_reference
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Preserva a ligação conclusiva com a visão e a ordem anteriores, em português natural e solene.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: Imperativo dirigido a Ezequiel; é o equivalente corrente e preciso do verbo נבא.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: e diga-lhes
  rationale: Reproduz de modo direto a fórmula introdutória do discurso profético.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula convencional do mensageiro profético, reconhecível em português bíblico atual.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Representa os dois elementos do título hebraico e evita a repetição pouco natural 'Senhor SENHOR'; DEUS em versaletes corresponde ao nome divino nesse título composto.
- source_word: הִנֵּה אֲנִי פֹתֵחַ
  choice: Eis que abrirei
  rationale: Eis que conserva a ênfase solene; o futuro comunica naturalmente em português a ação divina iminente expressa pelo particípio hebraico.
- source_word: קִבְרוֹתֵיכֶם
  choice: as suas sepulturas
  rationale: Sepulturas é uma tradução direta e digna de קבר, adequada à imagem de restauração com ressonância de ressurreição.
- source_word: וְהַעֲלֵיתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם
  choice: e farei vocês subirem delas
  rationale: Preserva o sentido causativo e o movimento ascendente de עלה sem explicitar além do hebraico uma interpretação doutrinária específica; 'delas' evita repetição pesada, com antecedente inequívoco.
- source_word: עַמִּי
  choice: meu povo
  rationale: Mantém a designação pactual em função de vocativo, destacada por vírgula.
- source_word: וְהֵבֵאתִי אֶתְכֶם אֶל אַדְמַת יִשְׂרָאֵל
  choice: e os levarei à terra de Israel
  rationale: Expressa com naturalidade a condução ao território de Israel no contexto da restauração.
theological_decisions:
- issue: Natureza da imagem da abertura das sepulturas
  choice: Conservar a linguagem concreta de abertura das sepulturas e subida delas, sem restringi-la a uma única leitura.
  alternative: Entendê-la exclusivamente como metáfora do retorno do exílio ou exclusivamente como predição direta da ressurreição corporal individual.
  rationale: No contexto, a imagem anuncia a restauração de Israel, mas sua linguagem concreta também ressoa com a esperança de ressurreição. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a cadência profética sem arcaísmos desnecessários. O marcador [a] aparece no texto junto à expressão interpretativamente relevante.
