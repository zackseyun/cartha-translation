source:
  edition: WLC
  text: וְ/יָשְׁב֣וּ עַל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָתַ֨תִּי֙ לְ/עַבְדִּ֣/י לְ/יַֽעֲקֹ֔ב אֲשֶׁ֥ר יָֽשְׁבוּ בָ֖/הּ אֲבֽוֹתֵי/כֶ֑ם וְ/יָשְׁב֣וּ עָלֶ֡י/הָ הֵ֠מָּה וּ/בְנֵי/הֶ֞ם וּ/בְנֵ֤י בְנֵי/הֶם֙ עַד עוֹלָ֔ם וְ/דָוִ֣ד עַבְדִּ֔/י נָשִׂ֥יא לָ/הֶ֖ם לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/025.yaml
  text: They will dwell in the land that I gave to my servant Jacob[a], where your fathers dwelt; and they will dwell on it, they and their sons and their sons' sons, forever[c][b]. And David my servant will be prince for them forever.
translation:
  language: pt
  text: Habitarão na terra que dei ao meu servo Jacó, na qual habitaram os pais de vocês[a]. Nela habitarão eles, seus filhos e os filhos de seus filhos, para sempre. E Davi[b], meu servo, será príncipe[c] para eles para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os antepassados de vocês”. O hebraico diz literalmente “os pais de vocês”.
    reason: lexical_alternative
  - marker: b
    text: “Davi” pode referir-se ao governante davídico prometido; o texto não especifica se se trata do Davi histórico restaurado ou de uma figura davídica futura.
    reason: alternative_reading
  - marker: c
    text: Ou “líder” ou “governante”. O termo hebraico é “príncipe”, não “rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: habitarão
  rationale: O verbo ישׁב, repetido no versículo, expressa morar ou estabelecer-se. “Habitarão” preserva a repetição e o tom da promessa da terra sem ser obscuro.
- source_word: עַל הָאָרֶץ / עָלֶיהָ
  choice: na terra / nela
  rationale: Embora עַל tenha o sentido básico de “sobre”, com ישׁב e “terra” o português idiomático pede “na terra” e “nela”; o referente territorial permanece claro.
- source_word: לְעַבְדִּי לְיַעֲקֹב
  choice: ao meu servo Jacó
  rationale: A preposição לְ marca o destinatário da dádiva, e “meu servo Jacó” mantém a designação pactual do texto.
- source_word: אֲבוֹתֵיכֶם
  choice: os pais de vocês
  rationale: Reproduz o substantivo masculino plural do hebraico em linguagem portuguesa atual; a nota registra o sentido representativo possível de “antepassados”.
- source_word: הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: eles, seus filhos e os filhos de seus filhos
  rationale: Mantém transparentemente a formulação hebraica “eles, seus filhos e os filhos de seus filhos”, sem substituí-la por “descendentes” ou “netos”.
- source_word: עַד עוֹלָם / לְעוֹלָם
  choice: para sempre
  rationale: A mesma expressão portuguesa comunica a permanência duradoura enfatizada nas duas ocorrências.
- source_word: וְדָוִד עַבְדִּי
  choice: E Davi, meu servo
  rationale: Conserva o nome sem explicação interpretativa e apresenta a aposição com pontuação natural em português.
- source_word: נָשִׂיא
  choice: príncipe
  rationale: Preserva a distinção entre נָשִׂיא e o termo hebraico para “rei”, sem definir além do texto a forma dessa liderança.
- source_word: לָהֶם
  choice: para eles
  rationale: Representa diretamente a preposição לְ e evita substituí-la por “sobre”; no contexto, a relação de governo continua evidente.
theological_decisions:
- issue: Identidade de “Davi, meu servo”
  choice: Manter “Davi” no texto principal sem expansão interpretativa.
  alternative: O Davi histórico restaurado; um futuro governante davídico; o Messias como rei davídico.
  rationale: O hebraico simplesmente nomeia Davi. A tradução não resolve se a referência é literal, tipológica ou messiânica.
- issue: Alcance de אֲבוֹתֵיכֶם
  choice: os pais de vocês
  alternative: os antepassados de vocês
  rationale: A escolha preserva a forma masculina plural do original, enquanto a nota apresenta o sentido genealógico mais amplo.
- issue: Título נָשִׂיא
  choice: príncipe
  alternative: líder; governante
  rationale: “Príncipe” conserva a terminologia própria de Ezequiel e não introduz “rei”, título que não aparece neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” em vez de “vossos” e conserva as repetições estruturais do hebraico sem produzir sintaxe artificial.
