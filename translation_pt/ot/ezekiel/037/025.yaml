  source_fidelity: 'A tradução representa com precisão a estrutura e os elementos centrais do hebraico: a dádiva da terra a Jacó, a morada dos pais/antepassados, a permanência das gerações e o título de Davi como «príncipe». «Na terra» e «nela» são traduções idiomáticas adequadas de עַל הָאָרֶץ e עָלֶיהָ no contexto de habitar. «Para eles» preserva de modo defensável o לָהֶם, sem o alterar para uma preposição de domínio não expressa diretamente.'
