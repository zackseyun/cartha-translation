  text: Then bring them near to each other for yourself as one stick[b][a], so that they may become one in your hand.
translation:
  language: pt
  text: Depois, aproxime-as uma da outra, formando para você uma só vara[a], e elas se tornarão uma só[b] em sua mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma só vara”. A construção hebraica pode indicar o resultado, “formando uma só vara”, ou o estado, “como uma só vara”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e elas serão por umas em sua mão”, expressão hebraica que indica que se tornam uma só.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַב
  choice: Depois, aproxime
  rationale: O imperativo de קרב manda Ezequiel pôr as duas peças perto uma da outra; “Depois” comunica naturalmente a sequência indicada pelo waw.
- source_word: אֹתָם
  choice: uma da outra
  rationale: O pronome retoma as duas varas do versículo anterior; em português, a construção recíproca explicita naturalmente o referente feminino.
- source_word: אֶחָד אֶל אֶחָד
  choice: uma da outra
  rationale: Reproduz de modo idiomático o sentido recíproco literal de “uma a uma/outra”.
- source_word: לְךָ
  choice: para você
  rationale: Conserva o dativo referente ao profeta sem acrescentar uma ideia reflexiva mais forte do que o hebraico exige.
- source_word: לְעֵץ אֶחָד
  choice: formando uma só vara
  rationale: No sinal profético, עֵץ designa cada objeto de madeira inscrito. “Formando” comunica a provável força resultativa de לְ, enquanto a nota registra a alternativa de estado.
- source_word: וְהָיוּ לַאֲחָדִים
  choice: e elas se tornarão uma só
  rationale: Expressa em português corrente o resultado previsto; o plural incomum de אֶחָד é vertido idiomaticamente, sem apagar sua forma da nota.
- source_word: בְיָדֶךָ
  choice: em sua mão
  rationale: Tradução direta que preserva a imagem concreta do ato simbólico.
theological_decisions:
- issue: Natureza da unidade simbolizada pelas duas varas
  choice: Descrever concretamente as varas tornando-se uma só na mão de Ezequiel.
  alternative: Interpretar no próprio versículo como a união política ou espiritual de Israel.
  rationale: O contexto posterior explica o significado do sinal; este versículo deve conservar a ação profética concreta sem antecipar nem restringir sua interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vara” mantém a continuidade com os objetos de madeira do contexto. Os marcadores aparecem junto às expressões que explicam, em ordem alfabética.
