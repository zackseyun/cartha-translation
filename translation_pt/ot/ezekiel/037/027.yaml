  text: וְ/הָיָ֤ה מִשְׁכָּנִ/י֙ עֲלֵי/הֶ֔ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵֽ/אלֹהִ֑ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/027.yaml
  text: My dwelling place will be over them[a], and I will be their God, and they will be my people.
translation:
  language: pt
  text: Minha morada estará sobre eles[a]; eu serei o Deus deles, e eles serão o meu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Meu tabernáculo estará sobre eles” ou “Minha habitação estará sobre eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: minha morada
  rationale: מִשְׁכָּן designa um lugar de habitação e também pode referir-se ao tabernáculo. “Minha morada” é natural em português moderno, mantém a imagem concreta e evita restringir indevidamente a referência ao tabernáculo mosaico.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: A preposição עַל significa mais diretamente “sobre”. A tradução preserva a imagem espacial do hebraico, sem a suavizar interpretativamente para “com eles”.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: eu serei o Deus deles
  rationale: A formulação portuguesa é idiomática e conserva a conhecida fórmula de aliança expressa pelo hebraico.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: eles serão o meu povo
  rationale: Esta tradução natural preserva a segunda parte da fórmula de aliança e sua ressonância bíblica.
- source_word: וְהָיָה
  choice: estará
  rationale: No contexto profético, a forma verbal exprime o futuro. Como o sujeito é “minha morada”, “estará” comunica com naturalidade tanto a existência quanto a posição indicada por “sobre eles”.
theological_decisions:
- issue: Linguagem da fórmula de aliança
  choice: “eu serei o Deus deles, e eles serão o meu povo”
  alternative: “eu lhes serei por Deus, e eles me serão por povo”
  rationale: A opção escolhida conserva de maneira reconhecível e natural a fórmula de aliança, sem acrescentar uma interpretação doutrinária ao texto.
- issue: Relação espacial da morada divina com o povo
  choice: “sobre eles”
  alternative: “com eles”
  rationale: Mantém-se o valor mais direto de עַל e a tensão da imagem hebraica, em vez de resolver a expressão como simples presença entre ou junto ao povo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação com ponto e vírgula articula as duas partes do versículo sem enfraquecer a sequência da fórmula de aliança.
