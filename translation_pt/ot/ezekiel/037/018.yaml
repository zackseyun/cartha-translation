  text: וְ/כַֽ/אֲשֶׁר֙ יֹאמְר֣וּ אֵלֶ֔י/ךָ בְּנֵ֥י עַמְּ/ךָ֖ לֵ/אמֹ֑ר הֲ/לֽוֹא תַגִּ֥יד לָ֖/נוּ מָה אֵ֥לֶּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/018.yaml
  text: And when the sons of your people say to you[a], ‘Will you not tell us what these things are to you?’
translation:
  language: pt
  text: 'E quando os filhos do seu povo lhe disserem: “Você não nos dirá o que essas coisas significam para você?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכַאֲשֶׁר
  choice: E quando
  rationale: Mantém tanto a ligação com a sequência narrativa quanto o valor temporal da expressão hebraica.
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: lhe disserem
  rationale: Traduz diretamente o verbo אָמַר e, com o futuro do subjuntivo, soa natural após “quando” em português.
- source_word: בְּנֵי עַמְּךָ
  choice: os filhos do seu povo
  rationale: Preserva a formulação masculina e a relação construta explícitas no hebraico, sem reduzi-las simplesmente a “seu povo”.
- source_word: לֵאמֹר
  choice: representado pelos dois-pontos e pela fala direta
  rationale: O infinitivo introduz o conteúdo da fala; em português, uma tradução separada como “dizendo” seria redundante neste contexto.
- source_word: הֲלוֹא
  choice: Você não
  rationale: Na pergunta “Você não nos dirá...?”, reproduz a expectativa retórica expressa pela combinação de partículas hebraicas.
- source_word: תַגִּיד לָנוּ
  choice: nos dirá
  rationale: O Hifil de נגד indica contar, declarar ou dar a conhecer; “nos dirá” é claro, atual e adequado à pergunta direta.
- source_word: מָה אֵלֶּה לָּךְ
  choice: o que essas coisas significam para você
  rationale: A formulação literal “o que são estas para você?” é um idioma contextual que pergunta pelo significado da ação simbólica de Ezequiel; esta versão comunica esse sentido naturalmente e mantém a orientação pessoal de לָּךְ.
theological_decisions:
- issue: Natureza da pergunta sobre a ação simbólica
  choice: Traduzir a expressão idiomática em termos de significado, sem explicar no corpo do versículo qual é esse significado.
  alternative: “o que são essas coisas para você?”
  rationale: A tradução esclarece que o povo pede a interpretação do gesto profético, mas não antecipa a explicação dada nos versículos seguintes nem acrescenta uma conclusão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de leitura natural no Brasil. A construção “os filhos do seu povo” conserva deliberadamente a expressão hebraica, embora seja menos coloquial.
