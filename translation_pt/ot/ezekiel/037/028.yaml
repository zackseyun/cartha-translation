reference: Ezekiel 37:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ הַ/גּוֹיִ֔ם כִּ֚י אֲנִ֣י יְהוָ֔ה מְקַדֵּ֖שׁ אֶת יִשְׂרָאֵ֑ל בִּ/הְי֧וֹת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/028.yaml
  text: Then the nations will know that I am Yahweh who sanctifies Israel[c][b][a], when my sanctuary is in their midst forever.
translation:
  language: pt
  text: Então[a] as nações saberão que eu sou Yahweh, que santifica[b] Israel, quando o meu santuário estiver no meio deles[c] para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E as nações saberão”. A conjunção hebraica pode ser traduzida simplesmente por “e”, mas aqui provavelmente indica uma consequência das promessas de restauração anteriores.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que torna Israel santo”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “entre eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Então ... saberão
  rationale: O perfeito de ידע com a conjunção ו, no discurso profético, expressa aqui um resultado futuro decorrente das promessas anteriores. “Então” explicita essa consequência; “saberão” traduz naturalmente o verbo.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Em Ezequiel, o termo costuma designar os povos que não são Israel. “As nações” é claro, abrangente e natural em português.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Preserva a fórmula de reconhecimento característica de Ezequiel e representa o nome divino יהוה como nome próprio.
- source_word: מְקַדֵּשׁ
  choice: que santifica
  rationale: O particípio apresenta a ação característica e contínua de Yahweh em relação a Israel. “Santifica” mantém a ligação temática com a santidade e com o santuário mencionado na mesma frase.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: O hebraico traz diretamente o nome próprio como objeto, sem exigir explicitação adicional.
- source_word: בִּהְיוֹת
  choice: quando ... estiver
  rationale: A construção com o infinitivo de היה indica a circunstância ou o tempo em que as nações reconhecerão Yahweh. O futuro do subjuntivo é idiomático após “quando” em português.
- source_word: מִקְדָּשִׁי
  choice: o meu santuário
  rationale: “Santuário” preserva o sentido de lugar santo sem restringir indevidamente o referente a um edifício chamado templo.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Expressa a presença localizada entre o povo e conserva a linguagem bíblica de presença no meio da comunidade.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: É a forma temporal direta e corrente para a duração contínua indicada no contexto da restauração.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome próprio. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Sentido de מְקַדֵּשׁ aplicado a Israel
  choice: que santifica Israel
  alternative: que torna Israel santo; que consagra Israel
  rationale: “Santifica” preserva tanto a ideia de tornar ou manter santo quanto a ligação verbal e teológica com o santuário, sem limitar o sentido à consagração ritual.
- issue: Relação de “que santifica Israel” com o nome divino
  choice: oração relativa que caracteriza Yahweh
  alternative: oração explicativa destacada por vírgulas
  rationale: A formulação sem vírgula depois de “Yahweh” liga naturalmente a ação de santificar ao sujeito da fórmula de reconhecimento, sem acrescentar uma distinção ausente do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “No meio deles” mantém a expressão bíblica sem soar arcaica; “estiver” segue o uso natural do futuro do subjuntivo após “quando”. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
