  naturalness: O texto é claro e de registro profético apropriado. «Peça de madeira» é um pouco mais fluente e menos repetitivo que «pedaço de madeira», sem especificar indevidamente o formato do objeto simbólico.
  terminology: «Senhor Yahweh» representa de modo transparente אֲדֹנָי יְהוִה. «Peça de madeira» traduz עֵץ neste ato simbólico sem sugerir uma árvore viva nem impor que seja uma vara de formato definido.
