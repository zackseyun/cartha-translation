  text: דַּבֵּ֣ר אֲלֵ/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י לֹקֵ֜חַ אֶת עֵ֤ץ יוֹסֵף֙ אֲשֶׁ֣ר בְּ/יַד אֶפְרַ֔יִם וְ/שִׁבְטֵ֥י יִשְׂרָאֵ֖ל חבר/ו וְ/נָתַתִּי֩ אוֹתָ֨/ם עָלָ֜י/ו אֶת עֵ֣ץ יְהוּדָ֗ה וַֽ/עֲשִׂיתִ/ם֙ לְ/עֵ֣ץ אֶחָ֔ד וְ/הָי֥וּ אֶחָ֖ד בְּ/יָדִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/019.yaml
  text: 'tell them[a], ‘Thus says the Lord GOD: Behold, I am taking the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and I will place them with it, with the stick of Judah, and make them one stick[b], and they will be one in my hand.’'
translation:
  language: pt
  text: 'Diga-lhes: “Assim diz o Senhor Yahweh: Eis que tomarei a peça de madeira de José, que está na mão de Efraim, e as tribos de Israel unidas a ele[a]; eu os porei sobre a peça de madeira de Judá[b] e farei deles uma só peça de madeira. Eles serão um só na minha mão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e as tribos de Israel, seus companheiros [ou associados]”. O hebraico pode referir-se às tribos associadas a José/Efraim.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “eu os porei sobre ele, a peça de madeira de Judá”. A formulação descreve a junção simbólica das duas peças de madeira. Também se pode entender: “eu os juntarei a ela, à peça de madeira de Judá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֲלֵהֶם
  choice: diga-lhes
  rationale: O imperativo introduz a mensagem profética direta; “diga-lhes” é natural e mantém a força da ordem.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Preserva a fórmula profética e distingue אֲדֹנָי, “Senhor”, do nome divino יהוה, transliterado “Yahweh”.
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: Eis que tomarei
  rationale: “Eis que” conserva a solenidade do marcador de atenção; o futuro comunica em português a ação divina iminente expressa pelo particípio hebraico.
- source_word: עֵץ
  choice: pedaço de madeira
  rationale: No contexto do ato simbólico, designa um objeto de madeira, não uma árvore viva. A expressão evita sugerir necessariamente um galho fino ou um bastão de formato específico.
- source_word: אֲשֶׁר בְּיַד אֶפְרַיִם
  choice: que está na mão de Efraim
  rationale: Mantém a imagem literal da mão, retomada de modo significativo no fim do versículo.
- source_word: וְשִׁבְטֵי יִשְׂרָאֵל חברו
  choice: e as tribos de Israel unidas a ele
  rationale: Entende חברו como referência às tribos associadas a José/Efraim, preservando o sentido relacional sem introduzir uma identificação mais específica.
- source_word: וְנָתַתִּי אוֹתָם עָלָיו אֶת עֵץ יְהוּדָה
  choice: eu os porei sobre o pedaço de madeira de Judá
  rationale: Segue de perto a construção hebraica e preserva a imagem concreta da colocação de um sobre o outro, deixando a nota esclarecer a sintaxe e o efeito simbólico.
- source_word: וַעֲשִׂיתִם לְעֵץ אֶחָד
  choice: e farei deles um só pedaço de madeira
  rationale: Expressa naturalmente em português a transformação simbólica dos dois elementos em um.
- source_word: וְהָיוּ אֶחָד בְּיָדִי
  choice: Eles serão um só na minha mão
  rationale: Preserva o predicativo singular “um” e a imagem teologicamente significativa da unidade na mão de Deus.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR / o Senhor DEUS
  rationale: Traduz אֲדֹנָי como “Senhor” e representa explicitamente o nome da aliança יהוה como “Yahweh”, sem fundir os dois termos.
- issue: Natureza da unidade prometida
  choice: manter a imagem “um só na minha mão”
  alternative: explicitar como reunificação política ou espiritual
  rationale: O texto declara a unidade por meio do sinal dos pedaços de madeira, mas este versículo isoladamente não exige que a tradução defina toda a extensão política, nacional ou espiritual dessa unidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Pedaço de madeira” foi preferido a “vara” para manter a referência concreta sem especificar além do hebraico. A repetição foi preservada por fazer parte do sinal profético.
