base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/007.yaml
  text: So I prophesied as I was commanded[a], and as I prophesied, there was a sound, and behold, a rattling, and the bones came together[b], bone to its bone.
translation:
  language: pt
  text: Então profetizei conforme me foi ordenado. Enquanto eu profetizava, ouviu-se um som; e eis que houve um ruído[a], e os ossos se juntaram, cada osso ao seu osso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um abalo”, “um tremor” ou “um chocalhar”. O termo hebraico רַעַשׁ pode ter esses sentidos; neste contexto, o movimento dos ossos favorece um ruído.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “osso ao seu osso”, expressão distributiva que indica que cada osso se juntou ao osso correspondente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֵּאתִי
  choice: profetizei
  rationale: O nifal de נבא em Ezequiel designa regularmente a fala profética; “profetizei” é natural, preciso e consagrado em português.
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  choice: conforme me foi ordenado
  rationale: Preserva a força passiva de צוה e expressa com clareza que Ezequiel agiu em obediência à ordem recebida.
- source_word: וַיְהִי קוֹל
  choice: ouviu-se um som
  rationale: Representa o surgimento do fenômeno audível sem fundir קוֹל com o termo seguinte, רַעַשׁ.
- source_word: כְּהִנָּבְאִי
  choice: enquanto eu profetizava
  rationale: O infinitivo construto com כ indica simultaneidade; esta formulação comunica naturalmente uma ação em andamento.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a função de chamar vividamente a atenção para o acontecimento subsequente e preserva o tom profético digno.
- source_word: רַעַשׁ
  choice: um estrondo
  rationale: O termo pode indicar tremor, abalo ou ruído forte. “Estrondo” mantém a vivacidade sonora no contexto dos ossos sem afirmar inequivocamente que ocorreu um terremoto.
- source_word: וַתִּקְרְבוּ עֲצָמוֹת
  choice: os ossos se juntaram
  rationale: קרב significa literalmente aproximar-se; no contexto, descreve os ossos movendo-se para sua posição correspondente, o que “se juntaram” expressa com naturalidade.
- source_word: עֶצֶם אֶל עַצְמוֹ
  choice: cada osso ao seu osso
  rationale: Preserva a construção distributiva singular e sua imagem incomum, indicando que cada osso se uniu ao osso que lhe correspondia.
