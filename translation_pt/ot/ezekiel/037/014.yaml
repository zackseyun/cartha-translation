review_pass:
  verdict: revise
  source_fidelity: 'A tradução representa bem a promessa de dar o Espírito, a vida, o estabelecimento na terra e o reconhecimento de Yahweh. No entanto, «Eu falei e o farei» altera o segundo perfeito hebraico וְעָשִׂיתִי («e fiz/tenho feito») para futuro. Embora o perfeito profético possa por vezes apontar para certeza futura, nesta fórmula conclusiva ambos os perfeitos devem ser mantidos paralelos, como também faz a auditoria inglesa: «I have spoken, and I have done it».'
  naturalness: O português é claro, moderno e apropriado para leitura pública. «Porei meu Espírito em vocês» é um pouco mais direto e idiomático do que «dentro de vocês», sem perder o valor de בָּכֶם.
  terminology: «Espírito», com nota para «sopro», «espírito» e «vento», preserva adequadamente a amplitude de רוּחַ no capítulo. «Yahweh» reproduz de modo consistente o nome divino. «Estabelecerei ... em sua própria terra» comunica adequadamente a restauração na terra deles.
  issues:
