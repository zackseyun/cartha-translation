revisions:
- from: Porei o meu Espírito dentro de vocês[a], e vocês viverão. Eu os estabelecerei em sua própria terra. Então vocês saberão que eu sou Yahweh. Eu falei e o farei — declara Yahweh.
  to: Porei meu Espírito em vocês[a], e vocês viverão. Eu os estabelecerei em sua própria terra. Então vocês saberão que eu sou Yahweh. Eu falei e fiz isso — declara Yahweh.
  rationale: A revisão limita-se a restaurar o perfeito de וְעָשִׂיתִי em paralelo com «Eu falei», usando «fiz isso» para explicitar de forma natural o objeto implícito. Também simplifica «dentro de vocês» para «em vocês» e elimina artigos possessivos dispensáveis, sem alterar o sentido. A nota é preservada, com ajuste estilístico mínimo.
