  text: וְ/נָתַתִּ֨י רוּחִ֤/י בָ/כֶם֙ וִ/חְיִיתֶ֔ם וְ/הִנַּחְתִּ֥י אֶתְ/כֶ֖ם עַל אַדְמַתְ/כֶ֑ם וִ/ידַעְתֶּ֞ם כִּי אֲנִ֧י יְהוָ֛ה דִּבַּ֥רְתִּי וְ/עָשִׂ֖יתִי נְאֻם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/014.yaml
  text: I will put my Spirit within you[a], and you will live, and I will settle you on your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
translation:
  language: pt
  text: Porei meu Espírito em vocês[a], e vocês viverão. Eu os estabelecerei em sua própria terra. Então vocês saberão que eu sou Yahweh. Eu falei e fiz isso — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu sopro” ou “meu espírito”; a palavra hebraica também pode significar “vento”. Ezequiel 37 explora intencionalmente essa variedade de sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: o meu Espírito
  rationale: רוּחַ pode significar espírito, sopro ou vento. Aqui, o sufixo de primeira pessoa ('meu') e a ação divina favorecem 'meu Espírito', enquanto a nota preserva a ressonância intencional com sopro e vento no capítulo.
- source_word: וִחְיִיתֶם
  choice: vocês viverão
  rationale: חיה expressa viver ou voltar à vida. A formulação concisa abrange tanto a imagem imediata de revivificação como a promessa mais ampla de restauração.
- source_word: וְהִנַּחְתִּי אֶתְכֶם עַל אַדְמַתְכֶם
  choice: Eu os estabelecerei em sua própria terra
  rationale: O verbo no Hifil comunica fazer repousar, colocar ou estabelecer. 'Estabelecerei' expressa instalação estável no contexto da restauração; 'em sua própria terra' traduz o possessivo de modo natural.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Então vocês saberão que eu sou Yahweh
  rationale: '''Então'' torna natural em português a sequência resultante indicada pelo contexto, e o nome יהוה é transliterado como ''Yahweh''.'
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: Eu falei e o farei
  rationale: Embora ambos os verbos estejam no perfeito hebraico, no discurso profético podem apresentar como certa uma ação ainda prometida. Em português, 'o farei' evita sugerir que o estabelecimento na terra já ocorreu e preserva a força da certeza profética.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Tradução idiomática da fórmula profética, preservando sua autoridade e o nome divino.
theological_decisions:
- issue: Se רוּחִי deve ser traduzido de modo impessoal ('meu sopro') ou com a força teológica de 'meu Espírito'
  choice: o meu Espírito
  alternative: o meu sopro; o meu espírito
  rationale: O capítulo explora deliberadamente a amplitude semântica de רוּחַ. A escolha principal reconhece o Espírito como dom divino no contexto da restauração, sem apagar na nota as imagens de sopro e vento.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Valor temporal de וְעָשִׂיתִי na declaração profética
  choice: o farei
  alternative: eu o fiz; eu o cumpri
  rationale: O perfeito profético ressalta a certeza da realização. Como a ação prometida no contexto é futura para os destinatários, o futuro em português comunica melhor a referência temporal sem perder essa certeza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. A divisão em frases curtas favorece a leitura pública. 'Estabelecerei' conserva tanto a ideia de colocação como a de permanência segura.
