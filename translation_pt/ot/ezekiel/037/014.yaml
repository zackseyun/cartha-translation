    issue: «Eu falei e o farei» traduz וְעָשִׂיתִי como futuro.
    rationale: 'O hebraico traz dois verbos no perfeito coordenados: «falei e fiz». Converter apenas o segundo em futuro rompe o paralelismo verbal e se afasta tanto da forma fonte quanto da decisão registrada na auditoria inglesa. A força de certeza profética pode ser preservada em português pelo perfeito, sem antecipar uma interpretação temporal.'
