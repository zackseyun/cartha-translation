  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética וַיְהִי דְבַר־יְהוָה, o português natural expressa o acontecimento dizendo que a palavra «veio», sem reproduzir de modo rígido «e aconteceu».
- source_word: דְבַר
  choice: A palavra
  rationale: Aqui דָּבָר designa a comunicação divina. «A palavra» conserva a fórmula profética e seu peso teológico, sendo menos interpretativo que «a mensagem».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com o sufixo de primeira pessoa e soa natural na construção «veio a mim».
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo do discurso divino; «dizendo» preserva a forma da fórmula hebraica e prepara naturalmente o versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino. «Yahweh» o preserva explicitamente, enquanto «SENHOR» segue a substituição tradicional por um título.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética foi suavizada apenas no necessário: omitiu-se a reprodução literal de וַיְהִי como «e aconteceu», mas conservaram-se «a palavra» e «dizendo».'
