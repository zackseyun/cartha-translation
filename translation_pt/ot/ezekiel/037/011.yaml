  text: וַ/יֹּאמֶר֮ אֵלַ/י֒ בֶּן אָדָ֕ם הָ/עֲצָמ֣וֹת הָ/אֵ֔לֶּה כָּל בֵּ֥ית יִשְׂרָאֵ֖ל הֵ֑מָּה הִנֵּ֣ה אֹמְרִ֗ים יָבְשׁ֧וּ עַצְמוֹתֵ֛י/נוּ וְ/אָבְדָ֥ה תִקְוָתֵ֖/נוּ נִגְזַ֥רְנוּ לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/011.yaml
  text: Then he said to me, “Son of man, these bones are the whole house of Israel. Look, they are saying, ‘Our bones have dried up, and our hope has perished; we are cut off.’”
translation:
  language: pt
  text: 'Então ele me disse: “Filho do homem, estes ossos são toda a casa de Israel. Vejam, eles dizem: ‘Nossos ossos secaram, nossa esperança se perdeu; fomos cortados.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Filho do homem
  rationale: Preserva a forma característica pela qual Deus se dirige a Ezequiel, com linguagem tradicional e compreensível.
- source_word: הִנֵּה
  choice: Eles dizem
  rationale: O hebraico introduz enfaticamente a fala; em português, o presente e a colocação direta da citação comunicam a vivacidade sem o pouco natural “eis que”.
- source_word: וְאָבְדָה תִקְוָתֵנוּ
  choice: nossa esperança se perdeu
  rationale: Reproduz o sentido de אבד, isto é, perder-se ou deixar de existir, sem ampliar para uma interpretação teológica específica.
- source_word: נִגְזַרְנוּ לָנוּ
  choice: fomos completamente separados
  rationale: נִגְזַרְנוּ expressa ser cortado ou separado; לָנוּ intensifica a condição dos próprios falantes. “Completamente separados” conserva a ideia sem exigir um complemento ausente no hebraico.
theological_decisions:
- issue: Identidade dos ossos
  choice: estes ossos são toda a casa de Israel
  alternative: estes ossos representam toda a casa de Israel
  rationale: Mantém a formulação metafórica direta do hebraico, sem explicá-la além do texto.
- issue: Objeto implícito em “separados”
  choice: fomos completamente separados
  alternative: fomos eliminados / fomos separados de Deus
  rationale: O texto não explicita de quem ou de quê Israel foi separado. A tradução preserva essa abertura e evita inserir uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem e o paralelismo do lamento foram preservados, evitando arcaísmos como “eis que” e explicitações não presentes no hebraico.
