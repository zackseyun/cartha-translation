  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם בְּרִ֥ית עוֹלָ֖ם יִהְיֶ֣ה אוֹתָ֑/ם וּ/נְתַתִּי/ם֙ וְ/הִרְבֵּיתִ֣י אוֹתָ֔/ם וְ/נָתַתִּ֧י אֶת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/026.yaml
  text: I will make with them a covenant of peace[a]; it will be an everlasting covenant with them. And I will place them and multiply them[c][b], and I will set my sanctuary in their midst forever.
translation:
  language: pt
  text: Farei com eles uma aliança de paz; será uma aliança eterna com eles. Eu os estabelecerei[a] e os multiplicarei, e porei o meu santuário no meio deles para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu os colocarei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: Farei ... uma aliança
  rationale: O hebraico usa a expressão idiomática “cortar uma aliança”. Em português, “fazer uma aliança” transmite naturalmente o ato de firmá-la sem reproduzir de modo opaco o idiomatismo hebraico.
- source_word: בְּרִית שָׁלוֹם
  choice: uma aliança de paz
  rationale: Mantém a linguagem explícita de aliança e traduz שָׁלוֹם por “paz”, termo que aqui pode abranger segurança, integridade e bem-estar.
- source_word: בְּרִית עוֹלָם
  choice: uma aliança eterna
  rationale: “Eterna” é uma formulação portuguesa natural para a duração expressa por עוֹלָם no contexto de uma aliança.
- source_word: יִהְיֶה אוֹתָם
  choice: será ... com eles
  rationale: Conserva a relação da aliança com o povo e segue de perto a construção hebraica, sem tornar explícita uma nuance exclusivamente benefativa.
- source_word: וּנְתַתִּים
  choice: Eu os estabelecerei
  rationale: O verbo נתן significa literalmente “dar, pôr, colocar”; tendo o povo como objeto neste contexto de restauração, “estabelecerei” comunica sua colocação estável, enquanto a nota preserva a alternativa mais literal.
- source_word: וְהִרְבֵּיתִי אוֹתָם
  choice: e os multiplicarei
  rationale: O hifil de רבה indica fazer aumentar em número. “Multiplicarei” é conciso e preserva a ressonância das promessas de crescimento do povo.
- source_word: מִקְדָּשִׁי
  choice: o meu santuário
  rationale: “Santuário” preserva a referência a um lugar santo sem restringi-la indevidamente ao termo mais específico “templo”.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Expressa naturalmente a presença corporativa do santuário entre o povo, evitando a possível leitura predominantemente interior e individual de “dentro deles”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Formulação portuguesa atual e natural para a duração contínua indicada pelo hebraico.
theological_decisions:
- issue: Força da linguagem da aliança no contexto da restauração
  choice: Manter “aliança de paz” e “aliança eterna” de modo explícito
  alternative: Parafrasear apenas como promessa de paz, segurança ou bênção
  rationale: A estrutura do versículo é claramente pactual; conservar “aliança” mantém o peso da relação vinculante estabelecida por Deus sem impor uma sistematização doutrinária posterior.
- issue: Localização do santuário de Deus
  choice: “no meio deles”, em sentido corporativo
  alternative: “dentro deles”, com possível ênfase em habitação interior individual
  rationale: בְּתוֹכָם indica mais naturalmente o santuário situado entre o povo como comunidade. A tradução preserva essa imagem sem negar associações teológicas posteriores, mas também sem introduzi-las no texto.
- issue: Sentido de וּנְתַתִּים na restauração do povo
  choice: “Eu os estabelecerei”, com nota para a tradução mais literal
  alternative: “Eu os colocarei” ou “Eu os porei”
  rationale: O contexto favorece a ideia de assentar ou estabelecer o povo restaurado, mas o verbo é amplo; a nota mantém visível a ambiguidade lexical em vez de tratá-la como resolvida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados, evitando tanto literalismo opaco quanto paráfrase teológica.
