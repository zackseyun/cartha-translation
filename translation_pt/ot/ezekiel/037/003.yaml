base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/003.yaml
  text: And he said to me[a], “Son of man, can these bones live?” And I said, “Lord GOD, you know.”
translation:
  language: pt
  text: 'E ele me disse: “Filho do homem, poderão estes ossos viver?” E eu disse: “Senhor Yahweh, tu sabes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: E ele me disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E” preserva esse fluxo, e “me disse” traduz naturalmente אֵלַי no português atual.
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém o modo recorrente como Deus se dirige a Ezequiel, preservando o idioma hebraico e sua força literária sem introduzir uma interpretação cristológica posterior neste contexto.
- source_word: הֲתִחְיֶינָה
  choice: poderão ... viver
  rationale: A forma interrogativa com o imperfeito permite uma pergunta sobre possibilidade ou resultado futuro. “Poderão ... viver?” conserva essa abertura sem transformar a pergunta apenas em previsão.
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: estes ossos
  rationale: Traduz exatamente os elementos presentes no versículo. Embora o contexto diga que os ossos estavam secos, “secos” não aparece nesta frase e não foi acrescentado.
- source_word: וָאֹמַר
  choice: Eu respondi
  rationale: No diálogo, “respondi” expressa naturalmente a função narrativa do verbo “disse” após uma pergunta, sem alterar o conteúdo da fala.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: “Senhor” traduz אֲדֹנָי, e “Yahweh” representa de modo transparente o nome divino יהוה, evitando a repetição artificial “Senhor SENHOR”.
- source_word: אַתָּה יָדָעְתָּ
  choice: tu sabes
  rationale: O perfeito de ידע tem aqui sentido estativo presente. O pronome explícito é preservado por “tu”, sem acrescentar “somente”, que não consta do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A opção conserva tanto o título אֲדֹנָי quanto o nome pessoal יהוה de forma reconhecível e evita esconder o elemento do nome divino sob um título genérico.
- issue: Sentido da pergunta הֲתִחְיֶינָה
  choice: poderão estes ossos viver?
  alternative: estes ossos viverão?
  rationale: O hebraico pode apontar para possibilidade ou resultado futuro. “Poderão ... viver?” preserva a tensão da pergunta e combina com a resposta deferente de Ezequiel, sem decidir antecipadamente se ela pede apenas uma previsão.
- issue: Sentido de בֶּן אָדָם em Ezequiel
  choice: Filho do homem
  alternative: Mortal
  rationale: A tradução mantém a fórmula característica do livro e sua ambiguidade literária, sem importar para esta passagem uma identificação cristológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “poderão estes ossos viver?” é levemente solene, mas natural no registro bíblico e mantém “estes ossos” em destaque. Emprega-se “tu” na fala dirigida a Deus para preservar o pronome hebraico explícito e o tom direto.
