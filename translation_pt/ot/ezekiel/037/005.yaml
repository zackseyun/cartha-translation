  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לָ/עֲצָמ֖וֹת הָ/אֵ֑לֶּה הִנֵּ֨ה אֲנִ֜י מֵבִ֥יא בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/005.yaml
  text: 'Thus says the Lord GOD to these bones: Behold[a], I am bringing breath into you, and you shall live.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh a estes ossos: Eis que farei entrar em vocês o sopro[a], e vocês viverão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica também pode significar «espírito» ou «vento». Aqui, «sopro» se ajusta à imagem imediata de ossos sem vida que recebem vida, mas a ambiguidade é significativa ao longo deste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética consagrada e natural em português, com valor declarativo presente apesar da forma verbal hebraica.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a repetição pouco clara «Senhor SENHOR».
- source_word: לָעֲצָמוֹת הָאֵלֶּה
  choice: a estes ossos
  rationale: A preposição marca aqui os destinatários da declaração; a construção é direta e idiomática em português.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força solene de chamada de atenção e introduz naturalmente o anúncio divino.
- source_word: אֲנִי מֵבִיא בָכֶם
  choice: farei entrar em vocês
  rationale: O particípio com הִנֵּה e אֲנִי anuncia uma ação iminente. Esta formulação expressa o movimento para dentro dos ossos e soa mais natural do que uma reprodução rígida do aspecto hebraico.
- source_word: רוּחַ
  choice: sopro
  rationale: No quadro imediato de ossos sem vida, «sopro» comunica melhor o agente da vivificação, sem eliminar a polissemia hebraica, registrada em nota.
- source_word: וִחְיִיתֶם
  choice: e vocês viverão
  rationale: Expressa com clareza o resultado futuro da ação divina e mantém o destinatário no plural, de modo amplamente compreensível em português.
theological_decisions:
- issue: Tradução do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva o título «Senhor» e representa explicitamente o nome pactual Yahweh, sem produzir a repetição «Senhor SENHOR».
- issue: Amplitude semântica de רוּחַ
  choice: sopro
  alternative: espírito ou vento
  rationale: «Sopro» se ajusta à vivificação dos ossos no contexto imediato, enquanto a nota preserva a ambiguidade significativa que percorre o capítulo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A fórmula «Assim diz» e a expressão «Eis que» preservam o tom profético solene sem recorrer a sintaxe arcaica. O pronome «vocês» explicita naturalmente o plural dirigido aos ossos.
