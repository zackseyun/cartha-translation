base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/010.yaml
  text: So I prophesied as he commanded me[a], and the breath entered into them, and they lived and stood on their feet, an exceedingly great army.
translation:
  language: pt
  text: 'Então profetizei como ele me ordenou. O sopro[a] entrou neles, e eles viveram e se puseram de pé: um exército muito, muito grande.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o espírito entrou neles”. A palavra hebraica רוּחַ pode significar “sopro”, “vento” ou “espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנַּבֵּאתִי
  choice: profetizei
  rationale: O hitpael de נבא descreve o ato profético de Ezequiel ao pronunciar a mensagem ordenada; “profetizei” é conciso, natural e coerente com o contexto.
- source_word: כַּאֲשֶׁר צִוָּנִי
  choice: como ele me havia ordenado
  rationale: Preserva a relação expressa por כַּאֲשֶׁר e mantém implícita a identidade daquele que ordenou, como no hebraico. O mais-que-perfeito torna clara em português a anterioridade da ordem.
- source_word: וַתָּבוֹא בָהֶם
  choice: entrou neles
  rationale: בוא com ב indica entrada; a formulação é direta e idiomática em português.
- source_word: הָרוּחַ
  choice: o sopro
  rationale: No contexto imediato, trata-se do sopro que anima os mortos. A polissemia de רוּחַ, que também pode significar “espírito” ou “vento”, é preservada em nota.
- source_word: וַיִּחְיוּ
  choice: eles viveram
  rationale: Representa de perto o qal de חיה e mantém a sequência narrativa simples do hebraico.
- source_word: וַיַּעַמְדוּ עַל רַגְלֵיהֶם
  choice: ficaram de pé
  rationale: Expressão portuguesa natural para o ato de passar a estar sobre os próprios pés, sem perder a imagem central.
- source_word: חַיִל
  choice: exército
  rationale: Neste cenário, חַיִל designa concretamente uma força militar reunida, e “exército” comunica isso com clareza.
- source_word: גָּדוֹל מְאֹד מְאֹד
  choice: imenso
  rationale: A repetição intensiva de מְאֹד é vertida de modo natural por um adjetivo de forte intensidade; “muito, muito grande” seria mais formalmente explícito, mas menos fluente neste sintagma.
theological_decisions:
- issue: A polissemia de רוּחַ na visão do vale
  choice: o sopro
  alternative: o espírito; o vento
  rationale: A função narrativa imediata é a entrada do sopro vivificante nos corpos. Como o capítulo também evoca vento e Espírito, a nota conserva a ambiguidade lexical e teológica em vez de a eliminar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide a longa cadeia hebraica em duas frases e usa travessão para apresentar o resultado visual culminante.
