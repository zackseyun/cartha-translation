id: EZK.37.21
reference: Ezekiel 37:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/דַבֵּ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֨ה אֲנִ֤י לֹקֵ֨חַ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/בֵּ֥ין הַ/גּוֹיִ֖ם אֲשֶׁ֣ר הָֽלְכוּ שָׁ֑ם וְ/קִבַּצְתִּ֤י אֹתָ/ם֙ מִ/סָּבִ֔יב וְ/הֵבֵאתִ֥י אוֹתָ֖/ם אֶל אַדְמָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/021.yaml
  text: 'Then say to them[a], ‘Thus says the Lord GOD: Behold, I am taking the children of Israel from among the nations where they have gone[b], and I will gather them from all around and bring them to their own land.’'
translation:
  language: pt
  text: 'Diga-lhes: “Assim diz o Senhor Yahweh: Eis que estou tomando os filhos de Israel[a] dentre as nações para onde foram. Eu os reunirei de todos os lados[b] e os levarei à sua própria terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os descendentes de Israel”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de toda parte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדַבֵּר אֲלֵיהֶם
  choice: Diga-lhes
  rationale: O imperativo introduz a continuação da instrução profética. Em português, “Diga-lhes” expressa naturalmente o sentido de falar a eles, sem exigir a reprodução mecânica da conjunção hebraica.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula solene e tradicional da mensagem profética em linguagem clara.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, “Senhor”, do nome divino יהוה, aqui transliterado “Yahweh”, evitando a expressão redundante “Senhor SENHOR”.
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: Eis que estou tomando
  rationale: “Eis que” mantém a chamada enfática à atenção, e o presente progressivo reproduz a vivacidade do particípio hebraico, que apresenta a ação divina como certa e em curso iminente.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a imagem familiar e pactual do hebraico, além de ser uma expressão bíblica compreensível em português.
- source_word: מִבֵּין הַגּוֹיִם
  choice: dentre as nações
  rationale: Indica que Israel será retirado do meio das diversas nações onde se encontra disperso.
- source_word: אֲשֶׁר הָלְכוּ שָׁם
  choice: para onde foram
  rationale: Expressa de modo idiomático o destino da dispersão indicado pelo relativo hebraico e pelo advérbio “ali”.
- source_word: וְקִבַּצְתִּי אֹתָם מִסָּבִיב
  choice: Eu os reunirei de todos os lados
  rationale: Comunica o recolhimento abrangente das várias direções sugerido por מִסָּבִיב.
- source_word: וְהֵבֵאתִי אוֹתָם אֶל אַדְמָתָם
  choice: e os levarei à sua própria terra
  rationale: “Terra” traduz adequadamente אַדְמָה neste contexto de retorno à pátria, enquanto “sua própria” explicita com naturalidade o sufixo possessivo.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A opção preserva tanto o título אֲדֹנָי quanto o nome pactual יהוה, sem fundi-los nem produzir a repetição pouco natural “Senhor SENHOR”.
- issue: Referente de “filhos de Israel”
  choice: Manter a expressão coletiva “filhos de Israel”
  alternative: o povo de Israel
  rationale: A formulação hebraica pode funcionar coletivamente, mas sua imagem genealógica e pactual é relevante; por isso, ela não foi reduzida a uma designação meramente política ou étnica.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e compreensão internacional. A fórmula profética e “Eis que” preservam a elevação do discurso; a sintaxe restante é direta e atual. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
source_grounding:
  english_pob_role: consult_only
