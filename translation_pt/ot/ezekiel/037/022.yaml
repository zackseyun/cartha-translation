  text: וְ/עָשִׂ֣יתִי אֹ֠תָ/ם לְ/ג֨וֹי אֶחָ֤ד בָּ/אָ֨רֶץ֙ בְּ/הָרֵ֣י יִשְׂרָאֵ֔ל וּ/מֶ֧לֶךְ אֶחָ֛ד יִֽהְיֶ֥ה לְ/כֻלָּ֖/ם לְ/מֶ֑לֶךְ וְ/לֹ֤א יהיה עוֹד֙ לִ/שְׁנֵ֣י גוֹיִ֔ם וְ/לֹ֨א יֵחָ֥צוּ ע֛וֹד לִ/שְׁתֵּ֥י מַמְלָכ֖וֹת עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/022.yaml
  text: And I will make them one nation in the land[a], on the mountains of Israel, and one king will be king over all of them. They will no longer be two nations[b], and they will no longer be divided into two kingdoms.
translation:
  language: pt
  text: Farei deles uma só nação na terra[a], nos montes de Israel, e um só rei será rei sobre todos eles. Já não serão duas nações, nem voltarão a ser divididos em dois reinos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na região montanhosa de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד
  choice: Farei deles uma só nação
  rationale: Expressa naturalmente em português a construção de fazer alguém em determinada condição, mantendo a ação divina e a unidade nacional.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto de Ezequiel, refere-se à terra de Israel, e não à terra inteira; a formulação preserva essa referência geográfica sem explicitá-la além do hebraico.
- source_word: בְּהָרֵי יִשְׂרָאֵל
  choice: nos montes de Israel
  rationale: Mantém a expressão característica de Ezequiel e sua transparência topográfica; 'região montanhosa' é uma alternativa possível.
- source_word: וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ
  choice: e um só rei será rei sobre todos eles
  rationale: Preserva a repetição enfática de 'rei' no hebraico e permanece natural em português.
- source_word: וְלֹא יִהְיֶה עוֹד לִשְׁנֵי גוֹיִם
  choice: Já não serão duas nações
  rationale: Usa o plural exigido pelo referente coletivo em português e comunica de forma idiomática o fim permanente da divisão.
- source_word: וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת עוֹד
  choice: nem voltarão a ser divididos em dois reinos
  rationale: Reflete o sentido passivo do nifal e a repetição de עוֹד, indicando que a divisão política não ocorrerá novamente.
theological_decisions:
- issue: Natureza da reunificação prometida a Israel
  choice: Traduzir a promessa diretamente em termos de uma nação, uma terra e um rei.
  alternative: Introduzir no texto uma identificação messiânica explícita ou espiritualizar a reunificação.
  rationale: O versículo descreve a reunificação nacional e régia sem identificar aqui o rei como Messias. A tradução preserva a formulação profética imediata e deixa a interpretação teológica ao contexto mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'rei' foi mantida para refletir a ênfase do hebraico; evitou-se acrescentar interpretação messiânica ao texto.
