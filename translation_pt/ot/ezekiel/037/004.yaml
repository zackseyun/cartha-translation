  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א עַל הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם הָ/עֲצָמוֹת֙ הַ/יְבֵשׁ֔וֹת שִׁמְע֖וּ דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/004.yaml
  text: Then he said to me[a], “Prophesy over these bones, and say to them, ‘Dry bones, hear the word of Yahweh.’”
translation:
  language: pt
  text: 'Então ele me disse: “Profetize sobre estes ossos e diga-lhes: ‘Ossos secos, ouçam a palavra de Yahweh[a]’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma consonantal do nome divino e a convenção tradicional alternativa.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente a sequência em português, enquanto “me disse” traduz diretamente a construção.
- source_word: הִנָּבֵא
  choice: Profetize
  rationale: O imperativo nifal de נבא é a ordem profética usual; “profetize” é preciso, corrente e não exige expansão explicativa.
- source_word: עַל הָעֲצָמוֹת הָאֵלֶּה
  choice: sobre estes ossos
  rationale: “Sobre” preserva a preposição עַל e se ajusta à cena visionária, na qual Ezequiel deve falar sobre os próprios ossos, sem a conotação hostil de “contra”.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: e diga-lhes
  rationale: Traduz de modo direto o verbo comum אמר e mantém os ossos como destinatários explícitos da fala.
- source_word: הָעֲצָמוֹת הַיְבֵשׁוֹת
  choice: Ossos secos
  rationale: A expressão é vocativa. Em português, “Ossos secos” comunica naturalmente o chamamento sem acrescentar a interjeição solene “ó”.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: O imperativo plural corresponde ao gênero gramatical dos ossos em hebraico e conserva tanto a ideia de ouvir quanto a força de atender à palavra proclamada.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” preserva a fórmula profética de דָּבָר, e “Yahweh” translitera o nome divino pessoal expresso pelo Tetragrama.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” representa o nome pessoal sem substituí-lo por um título; a nota registra a forma hebraica e a tradução tradicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega-se “profetize” e “ouçam” conforme o uso brasileiro corrente; “diga-lhes” mantém um tom bíblico moderado sem arcaísmo excessivo.
