source:
  edition: WLC
  text: הָיְתָ֣ה עָלַ/י֮ יַד יְהוָה֒ וַ/יּוֹצִאֵ֤/נִי בְ/ר֨וּחַ֙ יְהוָ֔ה וַ/יְנִיחֵ֖/נִי בְּ/ת֣וֹךְ הַ/בִּקְעָ֑ה וְ/הִ֖יא מְלֵאָ֥ה עֲצָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/001.yaml
  text: The hand of Yahweh was upon me[a], and he brought me out by the Spirit of Yahweh and set me down in the middle of the valley[b]; it was full of bones.
translation:
  language: pt
  text: A mão de Yahweh veio sobre mim, e ele me levou para fora pelo Espírito de Yahweh[a] e me colocou no meio do vale[b], que estava cheio de ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Espírito de Yahweh”. A expressão hebraica pode indicar tanto o meio ou agente (“pelo Espírito”) quanto a esfera ou o estado (“no Espírito”).'
    reason: lexical_alternative
  - marker: b
    text: “Vale” também pode ser traduzido por “planície” ou “vale amplo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  choice: A mão de Yahweh veio sobre mim
  rationale: Mantém a imagem concreta do hebraico e a expressão profética que comunica o poder ou impulso divino atuando sobre o profeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיּוֹצִאֵנִי
  choice: ele me levou para fora
  rationale: Preserva o sentido causativo do hifil de יצא em português natural.
- source_word: בְּרוּחַ יְהוָה
  choice: pelo Espírito de Yahweh
  rationale: O contexto de experiência e transporte proféticos favorece 'Espírito'; 'pelo' expressa agência instrumental, sem ocultar a possibilidade de esfera ou estado indicada em nota.
- source_word: וַיְנִיחֵנִי
  choice: e me colocou
  rationale: Expressa de modo natural o ato de fazer Ezequiel repousar ou ficar em determinado lugar, sem acrescentar detalhes ao movimento.
- source_word: בְּתוֹךְ הַבִּקְעָה
  choice: no meio do vale
  rationale: Traduz בְּתוֹךְ com clareza e usa 'vale' para בִּקְעָה, cujo alcance também inclui planície ou vale amplo.
- source_word: מְלֵאָה עֲצָמוֹת
  choice: estava cheio de ossos
  rationale: Conserva a descrição simples e contundente do hebraico; a concordância segue o substantivo masculino 'vale' em português.
theological_decisions:
- issue: Sentido de רוּחַ no transporte profético
  choice: Espírito de Yahweh
  alternative: vento de Yahweh
  rationale: Embora רוּחַ possa significar espírito, vento ou sopro, o contexto de ação divina sobre o profeta favorece 'Espírito', sem reduzir a expressão a uma força impessoal.
- issue: Valor da preposição בְּ em בְּרוּחַ יְהוָה
  choice: pelo Espírito de Yahweh
  alternative: no Espírito de Yahweh
  rationale: A leitura instrumental se integra naturalmente à sequência verbal, mas o hebraico também pode indicar a esfera ou o estado da experiência; essa ambiguidade legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção preserva as imagens concretas do hebraico e mantém em nota suas ambiguidades relevantes.
