  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם קַח לְ/ךָ֙ עֵ֣ץ אֶחָ֔ד וּ/כְתֹ֤ב עָלָי/ו֙ לִֽ/יהוּדָ֔ה וְ/לִ/בְנֵ֥י יִשְׂרָאֵ֖ל חבר/ו וּ/לְקַח֙ עֵ֣ץ אֶחָ֔ד וּ/כְת֣וֹב עָלָ֗י/ו לְ/יוֹסֵף֙ עֵ֣ץ אֶפְרַ֔יִם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל חבר/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/016.yaml
  text: And you[a], son of man, take for yourself one stick and write on it, ‘For Judah and for the sons of Israel, his companions.’ Then take one stick and write on it, ‘For Joseph, the stick of Ephraim, and all the house of Israel[c][b], his companions.’
translation:
  language: pt
  text: 'E você, filho do homem, pegue para si um pedaço de madeira[a] e escreva nele: “Para Judá e para os filhos de Israel[b], seus companheiros[c]”. Depois, pegue outro pedaço de madeira e escreva nele: “Para José — o pedaço de madeira de Efraim — e para toda a casa de Israel, seus companheiros”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “vara”, “madeira” ou, de modo mais interpretativo, “tábua de madeira”.
    reason: lexical_alternative
  - marker: b
    text: Ou “descendentes de Israel” ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
  - marker: c
    text: Ou “seus associados”, “os que estão unidos a ele” ou “seus aliados”. A mesma expressão ocorre no fim do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a forma hebraica de tratamento característica e repetida em Ezequiel, sem substituí-la pela interpretação “mortal”.
- source_word: קַח לְךָ
  choice: pegue para si
  rationale: Expressa a nuance pessoal do pronome לְךָ e permanece natural em português moderno.
- source_word: עֵץ
  choice: pedaço de madeira
  rationale: O termo pode designar madeira ou um objeto de madeira. No ato simbólico, trata-se de algo que o profeta pode pegar e no qual pode escrever; “pedaço de madeira” evita tanto a imagem possivelmente estreita de uma vara quanto a interpretação específica de uma tábua.
- source_word: וּכְתֹב עָלָיו
  choice: escreva nele
  rationale: Tradução direta e corrente do ato físico de escrever sobre o objeto.
- source_word: לִיהוּדָה
  choice: Para Judá
  rationale: Representa o לְ como parte do conteúdo da inscrição e indica a vinculação do objeto a Judá.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão masculina e genealógica explícita do hebraico, em vez de nivelá-la para o termo genérico “israelitas”.
- source_word: חברו / חֲבֵרָיו
  choice: seus companheiros
  rationale: Conserva a ideia de pessoas associadas ao grupo nomeado e o vínculo pronominal singular, sem especificar indevidamente se a associação é social, política ou tribal.
- source_word: לְיוֹסֵף
  choice: Para José
  rationale: Como no caso de Judá, traduz a expressão como o conteúdo da inscrição.
- source_word: עֵץ אֶפְרַיִם
  choice: o pedaço de madeira de Efraim
  rationale: Mantém a relação construta, identificando o objeto de José com Efraim, sem tratar os dois nomes como simples redundância.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Preserva a fórmula profética “casa de Israel” e traduz כָּל de modo natural.
theological_decisions:
- issue: Representação dos reinos divididos no ato simbólico
  choice: Manter Judá e José/Efraim como agrupamentos distintos, cada qual acompanhado por israelitas associados.
  alternative: Reduzir todas as designações a referências genéricas ao povo de Israel.
  rationale: A formulação hebraica contrapõe deliberadamente Judá a José/Efraim no sinal profético. A tradução conserva essa estrutura sem antecipar interpretações doutrinárias posteriores sobre a reunificação.
- issue: Referência dos sufixos em “seus companheiros”
  choice: Preservar a referência singular gramatical a Judá e a José, respectivamente.
  alternative: Reformular como “os companheiros deles” ou omitir os pronomes.
  rationale: O singular personifica cada agrupamento nomeado e faz parte da tensão da formulação hebraica; não deve ser nivelado silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A pontuação apresenta as palavras escritas como inscrições. “Depois” torna natural a sequência dos dois imperativos, e “outro pedaço” comunica a tomada de um segundo objeto sem alterar o contraste entre ambos.
