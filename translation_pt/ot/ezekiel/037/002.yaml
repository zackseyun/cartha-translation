base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/002.yaml
  text: And he led me around among them[a], all around; and behold, there were very many on the surface of the valley, and behold[b], they were very dry.
translation:
  language: pt
  text: Ele me fez passar por entre eles, por todos os lados; e eis que havia muitíssimos sobre a superfície do vale; e eis que estavam muito secos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱבִירַנִי
  choice: Ele me fez passar
  rationale: Preserva de modo natural o valor causativo do hifil de עבר, indicando que o profeta foi conduzido pelo vale.
- source_word: עֲלֵיהֶם
  choice: por entre eles
  rationale: No contexto dos ossos espalhados pelo vale, expressa a movimentação do profeta em relação a eles sem sugerir necessariamente que estivesse suspenso acima deles.
- source_word: סָבִיב סָבִיב
  choice: por todos os lados
  rationale: A repetição hebraica intensifica a ideia de percorrer o entorno; a expressão portuguesa comunica essa abrangência com clareza.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a função vívida da partícula, que chama a atenção para aquilo que o profeta percebe na visão.
- source_word: רַבּוֹת מְאֹד
  choice: muitíssimos
  rationale: Retoma naturalmente os ossos do versículo anterior e conserva a forte intensidade de מְאֹד.
- source_word: עַל־פְּנֵי הַבִּקְעָה
  choice: sobre a superfície do vale
  rationale: Preserva a imagem do hebraico, segundo a qual os ossos estavam espalhados pela face visível do vale.
- source_word: יְבֵשׁוֹת מְאֹד
  choice: completamente secos
  rationale: Comunica a condição extrema dos ossos em português corrente; a nota registra a tradução mais formal do intensificador.
