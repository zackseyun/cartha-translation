    rationale: A redação “e estavam” achata o novo chamamento de atenção no fim do versículo. “E eis que estavam” preserva a vivacidade narrativa sem prejudicar a fluência.
  revised_text: Ele me fez passar por entre eles, por todos os lados; e eis que havia muitíssimos sobre a superfície do vale; e eis que estavam muito secos.
