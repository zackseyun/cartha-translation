  source_fidelity: A tradução capta adequadamente o hifil de עבר, a relação espacial com os ossos, a abundância deles e sua localização no vale. Contudo, “completamente secos” intensifica o hebraico מעבר do que “muito secos”, e a segunda ocorrência de וְהִנֵּה deve ser preservada no texto principal.
  naturalness: O português é claro e moderno. A repetição de “e eis que” é deliberadamente marcada, mas é natural no registro visionário-profético e reproduz a ênfase do original.
  terminology: “Superfície do vale” é uma representação aceitável de עַל־פְּנֵי הַבִּקְעָה. “Muitíssimos” comunica bem רַבּוֹת מְאֹד, com “ossos” entendido a partir do versículo anterior.
