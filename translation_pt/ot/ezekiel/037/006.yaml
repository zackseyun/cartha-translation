source:
  edition: WLC
  text: וְ/נָתַתִּי֩ עֲלֵי/כֶ֨ם גִּדִ֜ים וְֽ/הַעֲלֵתִ֧י עֲלֵי/כֶ֣ם בָּשָׂ֗ר וְ/קָרַמְתִּ֤י עֲלֵי/כֶם֙ ע֔וֹר וְ/נָתַתִּ֥י בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶ֑ם וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/006.yaml
  text: I will put sinews on you[a], and I will bring flesh up over you, and I will cover you with skin, and I will put breath in you, and you will live. Then you will know that I am Yahweh.
translation:
  language: pt
  text: Porei tendões sobre vocês, farei crescer carne sobre vocês, cobrirei vocês com pele e porei em vocês o sopro[a]. Vocês viverão; então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito” ou “vento”. A palavra hebraica רוּחַ pode ter os três sentidos, e Ezequiel 37 explora essa amplitude de significado.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדִים
  choice: tendões
  rationale: No contexto da recomposição dos ossos, designa os tecidos fibrosos que os unem. “Tendões” é claro e corrente em português, sem o tom arcaico de “nervos” ou “tendões e ligamentos”.
- source_word: וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר
  choice: farei crescer carne sobre vocês
  rationale: Preserva o valor causativo de עלה e a imagem progressiva de a carne subir ou formar-se sobre os ossos, de modo mais natural em português do que uma reprodução literal rígida.
- source_word: וְקָרַמְתִּי עֲלֵיכֶם עוֹר
  choice: cobrirei vocês com pele
  rationale: Expressa com clareza a ação de revestir ou recobrir os corpos com pele.
- source_word: רוּחַ
  choice: sopro
  rationale: A consequência imediata é a vida dos corpos restaurados, favorecendo o sentido de sopro vital. “Sopro” também retém melhor que “respiração” a ligação semântica com espírito e vento explorada no capítulo.
- source_word: וִחְיִיתֶם
  choice: então vocês viverão
  rationale: Traduz diretamente o verbo חיה e torna explícita, de maneira natural, a sequência resultante indicada pelo contexto.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: e saberão que eu sou Yahweh
  rationale: Mantém a coordenação hebraica e a fórmula de reconhecimento, preservando o nome divino conforme a forma adotada pelo projeto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, em consonância com a camada de consulta fornecida e com a política indicada do projeto.
theological_decisions:
- issue: Sentido de רוּחַ no contexto da reanimação dos ossos
  choice: sopro
  alternative: espírito ou vento
  rationale: A colocação do רוּחַ dentro dos corpos leva diretamente a “vocês viverão”, o que favorece “sopro” no texto. Contudo, Ezequiel 37 explora deliberadamente os sentidos interligados de sopro, espírito e vento; por isso, as alternativas são preservadas em nota, sem resolver a tensão em favor de uma leitura doutrinária única.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A sequência anatômica foi mantida de forma vívida, e a ambiguidade central de רוּחַ foi sinalizada em nota.
