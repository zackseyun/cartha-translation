  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א אֶל הָ/ר֑וּחַ הִנָּבֵ֣א בֶן אָ֠דָם וְ/אָמַרְתָּ֨ אֶל הָ/ר֜וּחַ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה מֵ/אַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָ/ר֔וּחַ וּ/פְחִ֛י בַּ/הֲרוּגִ֥ים הָ/אֵ֖לֶּה וְ/יִֽחְיֽוּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/009.yaml
  text: 'Then he said to me[a], “Prophesy to the breath; prophesy, son of man, and say to the breath, ‘Thus says the Lord GOD: Come from the four winds, O breath, and breathe on these slain, so that they may live.’”'
translation:
  language: pt
  text: 'Então ele me disse: “Profetize ao sopro; profetize, filho do homem, e diga ao sopro: ‘Assim diz o Senhor DEUS: Venha dos quatro ventos, ó sopro,[a] e sopre sobre estes que foram mortos, para que vivam.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico רוּחַ pode significar “sopro”, “vento” ou “espírito”. Aqui, ele é traduzido por “sopro” no singular e por “ventos” na expressão “quatro ventos”; também se pode entender “espírito”, preservando as várias dimensões da imagem da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּבֵא
  choice: Profetize
  rationale: O imperativo de נבא dirige a Ezequiel um ato de fala profética; “profetize” é direto, corrente e preserva essa força.
- source_word: הָרוּחַ / רוּחוֹת
  choice: sopro / ventos
  rationale: רוּחַ pode significar sopro, vento ou espírito. “Sopro” se ajusta à revivificação dos mortos, enquanto “quatro ventos” é a expressão natural no plural; a nota preserva a polissemia.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a forma característica pela qual Ezequiel é interpelado e sua condição humana, sem transformar a expressão aqui em título cristológico.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  rationale: Reproduz a distinção do título composto e evita a repetição pouco natural “Senhor SENHOR”; DEUS em versaletes representa o nome divino neste composto.
- source_word: בֹּאִי
  choice: Venha
  rationale: Imperativo feminino singular que concorda com רוּחַ; “venha” é a invocação portuguesa natural.
- source_word: וּפְחִי
  choice: sopre sobre
  rationale: נפח significa soprar ou respirar; com a preposição ב, “sopre sobre” expressa diretamente a ação sobre os mortos sem introduzir a ideia mais específica de soprar para dentro.
- source_word: בַּהֲרוּגִים הָאֵלֶּה
  choice: sobre estes mortos
  rationale: הֲרוּגִים designa pessoas mortas violentamente. “Estes mortos” é natural e claro em português no cenário de campo de batalha, embora “estes que foram mortos” seja mais explícito.
- source_word: וְיִחְיוּ
  choice: para que vivam
  rationale: A construção expressa o propósito ou resultado da ordem e é vertida de modo conciso e natural.
theological_decisions:
- issue: Polissemia de רוּחַ na visão do vale
  choice: Traduzir o singular como “sopro” e o plural como “ventos”, registrando “espírito” na nota.
  alternative: Traduzir todas as ocorrências por “espírito” ou todas por “vento”.
  rationale: A escolha acompanha a ação imediata de comunicar vida e a expressão idiomática “quatro ventos”, sem eliminar a ressonância teológica e literária de “espírito”.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “profetize” e “sopro” foi mantida por ser estrutural e literariamente significativa no hebraico.
