  text: וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/פִתְחִ֣/י אֶת קִבְרֽוֹתֵי/כֶ֗ם וּ/בְ/הַעֲלוֹתִ֥/י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/013.yaml
  text: Then you will know that I am Yahweh[a], when I open your graves and bring you up from your graves[b], O my people.
translation:
  language: pt
  text: Então vocês saberão que eu sou Yahweh[a], quando eu abrir as sepulturas de vocês e fizer vocês subirem de suas sepulturas[b], ó meu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E vocês saberão que eu sou o SENHOR”.'
    reason: Registra tanto a possível tradução coordenativa de וִידַעְתֶּם quanto a substituição tradicional do nome divino por “o SENHOR”.
  - marker: b
    text: 'Ou: “e levantar vocês de suas sepulturas”. O verbo hebraico significa literalmente “fazer subir” ou “trazer para cima”.'
    reason: Apresenta uma alternativa idiomática com ressonância de ressurreição, sem torná-la obrigatória no texto principal.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O perfeito qal com waw, no discurso profético, tem aqui sentido futuro e resultante. “Então” explicita naturalmente a consequência no contexto, sem excluir a alternativa coordenativa “E”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo silenciosamente por um título.
- source_word: בְּפִתְחִי
  choice: quando eu abrir
  rationale: A preposição בְּ com infinitivo construto e sufixo tem valor temporal neste contexto; “quando eu abrir” é natural em português.
- source_word: קִבְרוֹתֵיכֶם
  choice: as sepulturas de vocês
  rationale: קֶבֶר designa sepultura, túmulo ou lugar de enterro. “Sepulturas” conserva a imagem concreta e evita uma formulação excessivamente técnica.
- source_word: וּבְהַעֲלוֹתִי
  choice: e fizer vocês subirem
  rationale: 'O hifil de עלה é causativo: “fazer subir” ou “trazer para cima”. A formulação mantém o movimento concreto para fora das sepulturas sem decidir se a imagem deve ser entendida apenas como restauração nacional ou como ressurreição corporal.'
- source_word: מִקִּבְרוֹתֵיכֶם
  choice: de suas sepulturas
  rationale: A preposição מִן marca origem ou procedência. A repetição de “sepulturas” acompanha a repetição enfática do hebraico.
- source_word: עַמִּי
  choice: ó meu povo
  rationale: A expressão funciona como vocativo e identifica os destinatários como o povo de Deus; “ó” assinala de modo claro e digno o chamamento direto.
theological_decisions:
- issue: Se a abertura das sepulturas deve ser interpretada explicitamente como mera restauração nacional ou como ressurreição corporal
  choice: Manter diretamente a linguagem concreta de abrir sepulturas e fazer o povo subir delas
  alternative: Parafrasear como retorno do exílio ou explicitar uma ressurreição corporal
  rationale: O hebraico emprega imagens semelhantes às de ressurreição dentro da visão de restauração. A tradução preserva essa tensão e não restringe o texto a uma única interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. A repetição de “sepulturas” e o vocativo “ó meu povo” preservam a força retórica do hebraico. A sintaxe permanece acessível sem apagar a imagem concreta nem sua ambiguidade teológica.
