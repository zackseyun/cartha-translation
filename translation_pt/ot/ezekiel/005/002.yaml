  text: שְׁלִשִׁ֗ית בָּ/א֤וּר תַּבְעִיר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר כִּ/מְלֹ֖את יְמֵ֣י הַ/מָּצ֑וֹר וְ/לָֽקַחְתָּ֣ אֶת הַ/שְּׁלִשִׁ֗ית תַּכֶּ֤ה בַ/חֶ֨רֶב֙ סְבִ֣יבוֹתֶ֔י/הָ וְ/הַ/שְּׁלִשִׁית֙ תִּזְרֶ֣ה לָ/ר֔וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/002.yaml
  text: A third you shall burn in the fire in the midst of the city[a], when the days of the siege are completed; and you shall take a third and strike it with the sword all around the city, and a third you shall scatter to the wind[c][b], and I will draw out a sword after them.
translation:
  language: pt
  text: Queime no fogo um terço do cabelo, no meio da cidade, quando se completarem os dias do cerco[a]; pegue um terço e golpeie-o com a espada ao redor da cidade; e espalhe um terço ao vento[b], e eu desembainharei uma espada atrás deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando os dias do cerco tiverem chegado ao fim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos ventos”; o hebraico emprega o singular, “vento”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sacarei uma espada atrás deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁית / הַשְּׁלִשִׁית
  choice: um terço / outro terço / o último terço
  rationale: O termo substantivado designa cada uma das três porções do cabelo dividido no versículo anterior. A variação natural em português mantém clara a estrutura tripartida sem sugerir objetos diferentes.
- source_word: בָּאוּר תַּבְעִיר
  choice: Queime no fogo
  rationale: O hifil de בער indica fazer arder ou queimar. A formulação conserva tanto a ação causativa quanto a referência explícita ao fogo.
- source_word: בְּתוֹךְ הָעִיר
  choice: no meio da cidade
  rationale: Expressão corrente e espacialmente vívida, correspondente ao sentido de interior ou centro da cidade.
- source_word: כִּמְלֹאת יְמֵי הַמָּצוֹר
  choice: quando se completarem os dias do cerco
  rationale: A construção infinitiva com כ tem valor temporal e apresenta o período do cerco chegando ao seu termo.
- source_word: תַּכֶּה בַחֶרֶב
  choice: golpeie-o com a espada
  rationale: נכה expressa o ato de golpear, e a preposição ב marca a espada como instrumento. O pronome explicita naturalmente em português que a ação recai sobre o terço do cabelo.
- source_word: סְבִיבוֹתֶיהָ
  choice: ao redor da cidade
  rationale: O sufixo feminino singular retoma a cidade. Repetir 'cidade' evita uma referência pronominal ambígua em português.
- source_word: תִּזְרֶה לָרוּחַ
  choice: Espalhe ... ao vento
  rationale: זרה pode significar espalhar ou joeirar. 'Espalhar ao vento' comunica com clareza a dispersão e preserva o singular רוּחַ.
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: e eu desembainharei a espada para persegui-los
  rationale: ריק com 'espada' forma a imagem de tirar a espada da bainha; אַחֲרֵיהֶם indica movimento hostil atrás deles. A tradução explicita a perseguição já implicada pelo idioma hebraico.
theological_decisions:
- issue: Mudança de locutor na oração final
  choice: 'Manter a primeira pessoa divina: ''eu desembainharei a espada'''
  alternative: Converter a oração em uma descrição impessoal do juízo
  rationale: אָרִיק está na primeira pessoa do singular e assinala a passagem das ordens dirigidas a Ezequiel para a ação direta de Deus. Preservar essa mudança mantém a força teológica do ato simbólico.
- issue: Referente plural de אַחֲרֵיהֶם
  choice: Traduzir por 'persegui-los', referindo-se às pessoas simbolizadas pelos cabelos dispersos
  alternative: Usar 'ir atrás deles' ou tratar o pronome como referência meramente gramatical aos cabelos
  rationale: O masculino plural ultrapassa a concordância imediata com a porção feminina e aponta para aqueles que o cabelo representa. A tradução conserva a dimensão simbólica sem identificar além do que o contexto permite.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos diretos. 'Cabelo' foi explicitado na primeira ocorrência para recuperar o objeto estabelecido em Ezequiel 5:1 e evitar que 'um terço' fique sem referente em leitura isolada. A sequência foi dividida em três frases para clareza, sem alterar a progressão do hebraico.
