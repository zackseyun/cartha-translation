  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם קַח לְ/ךָ֣ חֶ֣רֶב חַדָּ֗ה תַּ֤עַר הַ/גַּלָּבִים֙ תִּקָּחֶ֣/נָּה לָּ֔/ךְ וְ/הַעֲבַרְתָּ֥ עַל רֹאשְׁ/ךָ֖ וְ/עַל זְקָנֶ֑/ךָ וְ/לָקַחְתָּ֥ לְ/ךָ֛ מֹאזְנֵ֥י מִשְׁקָ֖ל וְ/חִלַּקְתָּֽ/ם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/001.yaml
  text: And you[a], son of man, take for yourself a sharp sword; take it as a barber’s razor, and pass it over your head and over your beard[b]. Then take for yourself scales for weighing and divide the hair.
translation:
  language: pt
  text: E você, filho do homem, pegue para si uma espada afiada; use-a como navalha de barbeiro e passe-a sobre sua cabeça e sua barba. Depois, pegue para si uma balança para pesar e divida os cabelos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva literalmente a fórmula de tratamento característica de Ezequiel e sua familiaridade bíblica, sem substituir a expressão por uma interpretação como “mortal”.
- source_word: חֶרֶב חַדָּה
  choice: uma espada afiada
  rationale: Tradução direta e natural do substantivo חֶרֶב e do adjetivo חַדָּה.
- source_word: תַּעַר הַגַּלָּבִים
  choice: navalha de barbeiro
  rationale: Expressa em português corrente a construção hebraica “navalha dos barbeiros” e mantém a imagem concreta do instrumento de barbear.
- source_word: תִּקָּחֶנָּה לָּךְ
  choice: use-a como
  rationale: No encadeamento das ordens, a repetição de לקח indica tomar a espada para fazê-la funcionar como navalha; “use-a como” transmite essa força funcional com naturalidade.
- source_word: וְהַעֲבַרְתָּ עַל רֹאשְׁךָ וְעַל זְקָנֶךָ
  choice: passe-a sobre a cabeça e sobre a barba
  rationale: Representa explicitamente o verbo עבר e a preposição עַל, deixando que o contexto da navalha comunique o ato de raspar.
- source_word: מֹאזְנֵי מִשְׁקָל
  choice: uma balança
  rationale: A expressão designa uma balança usada para pesar. Em português moderno, “balança” já comunica naturalmente essa função, reforçada pelo verbo “pese”.
- source_word: וְחִלַּקְתָּם
  choice: pese e divida os cabelos
  rationale: O sufixo plural retoma implicitamente os cabelos raspados. Explicitar “os cabelos” evita uma referência obscura em português; “pese” torna explícita a função indicada por מִשְׁקָל e prepara a divisão em porções.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a fórmula profética tradicional “filho do homem” e a sequência concreta das ações simbólicas. Não foram necessárias notas de rodapé.
