  yaml_path: translation/ot/ezekiel/005/003.yaml
  text: And you shall take from there a few in number and bind them in the folds of your garment[a].
translation:
  language: pt
  text: Você pegará dali apenas alguns e os amarrará nas abas de sua roupa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas pontas de sua veste”; literalmente, “em suas asas/extremidades”. Em relação a uma roupa, o hebraico se refere à sua aba, canto ou borda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: E você pegará
  rationale: O perfeito qal com conjunção dá sequência à instrução profética; o futuro em português preserva naturalmente sua força diretiva.
- source_word: מִשָּׁם
  choice: dali
  rationale: Traduz literalmente o advérbio e retoma, sem explicitação indevida, os cabelos mencionados no contexto anterior.
- source_word: מְעַט בְּמִסְפָּר
  choice: alguns poucos
  rationale: Preserva a ênfase quantitativa da expressão hebraica sem produzir a formulação menos natural 'poucos em número'.
- source_word: וְצַרְתָּ
  choice: os prenderá
  rationale: O verbo indica apertar, atar ou encerrar; 'prender' comunica com clareza a ação feita com os poucos fios de cabelo.
- source_word: אוֹתָם
  choice: os
  rationale: O pronome retoma os poucos fios de cabelo; em português, o objeto direto átono é natural e conciso.
- source_word: בִּכְנָפֶיךָ
  choice: nas dobras da sua roupa
  rationale: כָּנָף pode designar asa ou a extremidade de uma veste. Neste sinal encenado, refere-se à parte da roupa em que os fios poderiam ser guardados; 'dobras' é natural, enquanto a nota preserva as alternativas lexicais.
