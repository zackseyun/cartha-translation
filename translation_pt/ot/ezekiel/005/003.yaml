    issue: «nas dobras da sua roupa» para בִּכְנָפֶיךָ
    rationale: Embora uma dobra possa ser uma consequência física de uma veste, כָּנָף se refere lexicalmente à asa e, aplicada à roupa, à aba, ponta, canto ou extremidade. «Abas» conserva melhor essa imagem.
  - severity: low
    issue: «os prenderá» para וְצַרְתָּ
    rationale: «Prender» é possível, mas pode significar simplesmente fixar ou deter. «Amarrará» comunica de modo mais específico a ação de atar os poucos fios.
  revised_text: Você pegará dali apenas alguns e os amarrará nas abas de sua roupa[a].
