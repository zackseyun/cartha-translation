source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה יַ֤עַן הֲמָנְ/כֶם֙ מִן הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִיבֽוֹתֵי/כֶ֔ם בְּ/חֻקּוֹתַ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וְ/אֶת מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם לֹ֥א עֲשִׂיתֶֽם־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/007.yaml
  text: 'Therefore thus says the Lord GOD: Because you have been more turbulent than the nations that are around you[a], you have not walked in my statutes, and you have not carried out my judgments; and you have not even acted according to the judgments of the nations that are around you.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: “Visto que vocês foram mais turbulentos do que as nações ao seu redor[a], não viveram segundo os meus decretos nem cumpriram as minhas normas; nem sequer agiram conforme as normas das nações ao seu redor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês causaram mais tumulto”, “foram mais rebeldes” ou, possivelmente, “foram mais numerosos do que as nações ao seu redor”. O termo hebraico é difícil; a tradução no texto principal adota o sentido de agitação excessiva que melhor se ajusta ao contexto.
    reason: alternativa lexical
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי, “Senhor”, como o nome divino יהוה, transliterado “Yahweh”, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz com naturalidade a causa do juízo anunciado, mantendo a ligação sintática com a declaração profética precedente.
- source_word: הֲמָנְכֶם
  choice: vocês foram mais turbulentos
  rationale: O termo hebraico é difícil e parece indicar agitação, tumulto ou excesso em comparação com as nações vizinhas. “Mais turbulentos” conserva essa amplitude sem definir o sentido exclusivamente como rebeldia.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: do que as nações ao seu redor
  rationale: מִן possui valor comparativo neste contexto; a formulação portuguesa torna clara e concisa a comparação.
- source_word: בְּחֻקּוֹתַי לֹא הֲלַכְתֶּם
  choice: não viveram segundo os meus decretos
  rationale: “Viver segundo” comunica em português atual o idioma hebraico de “andar em” determinados estatutos, enquanto “decretos” representa חֻקּוֹת.
- source_word: מִשְׁפָּטַי
  choice: minhas normas
  rationale: “Normas” expressa aqui determinações que deveriam reger a conduta e permite manter a ligação lexical com as normas das nações na oração seguinte.
- source_word: לֹא עֲשִׂיתֶם
  choice: nem cumpriram
  rationale: No contexto das normas divinas, “cumprir” expressa de modo natural a obediência prática indicada por עשה.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם... לֹא עֲשִׂיתֶם
  choice: nem sequer agiram conforme as normas das nações ao seu redor
  rationale: “Conforme” representa o כ de conformidade, e “nem sequer” explicita a força retórica da acusação sem alterar a negação presente no texto massorético.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A opção escolhida distingue o título “Senhor” do nome pessoal divino e preserva explicitamente o nome יהוה.
- issue: A afirmação de que Jerusalém não agiu conforme as normas das nações
  choice: manter a negação do texto massorético
  alternative: “agiram conforme as normas das nações”, leitura conhecida por antigas testemunhas textuais
  rationale: A fonte indicada, o WLC, contém claramente לֹא, “não”. A tradução conserva essa leitura e sua tensão retórica, sem harmonizá-la com outras passagens.
translation_notes:
  register: Português moderno, claro e solene, com tratamento plural por “vocês”. O paralelismo entre as normas de Deus e as normas das nações foi preservado, assim como a difícil negação da última oração.
