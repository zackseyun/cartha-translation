  text: וְ/עָשִׂ֣יתִי בָ֗/ךְ אֵ֚ת אֲשֶׁ֣ר לֹֽא עָשִׂ֔יתִי וְ/אֵ֛ת אֲשֶֽׁר לֹֽא אֶעֱשֶׂ֥ה כָמֹ֖/הוּ ע֑וֹד יַ֖עַן כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/009.yaml
  text: And I will do in you what I have not done[a], and the like of which I will never do again, because of all your abominations.
translation:
  language: pt
  text: E farei em você o que nunca fiz[a] e jamais voltarei a fazer coisa semelhante, por causa de todas as suas abominações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra você” ou “a você”, em vez de “em você”. A preposição hebraica significa literalmente “em”, mas, neste contexto de juízo, pode ser traduzida de modo mais interpretativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: E farei
  rationale: O verbo עשה é amplo, com o sentido de “fazer”. A formulação mantém a força direta da ação divina sem especificar além do hebraico.
- source_word: בָךְ
  choice: em você
  rationale: Preserva o sentido básico da preposição ב e a imagem do juízo realizado dentro de Jerusalém; a alternativa mais interpretativa “contra você” fica registrada em nota.
- source_word: אֵת אֲשֶׁר לֹא עָשִׂיתִי
  choice: o que nunca fiz
  rationale: Expressa em português natural a negação de qualquer ação anterior desse tipo. “Nunca” torna explícito o valor temporal contextual sem reduzir a força da afirmação.
- source_word: וְאֵת אֲשֶׁר לֹא אֶעֱשֶׂה כָמֹהוּ עוֹד
  choice: e jamais voltarei a fazer coisa semelhante
  rationale: Reproduz conjuntamente a negação futura, o comparativo כָמֹהוּ e a ideia de repetição de עוֹד, em construção clara e idiomática.
- source_word: יַעַן
  choice: por causa de
  rationale: Introduz naturalmente a razão do juízo e se ajusta ao sintagma nominal seguinte.
- source_word: כָל תּוֹעֲבֹתָיִךְ
  choice: todas as suas abominações
  rationale: “Abominações” conserva o peso profético e teológico de תּוֹעֵבָה, que abrange práticas idolátricas e moralmente repulsivas.
theological_decisions:
- issue: Caráter sem precedente do juízo
  choice: 'Manter a linguagem absoluta: “o que nunca fiz” e “jamais voltarei a fazer coisa semelhante”.'
  alternative: Parafrasear apenas como um juízo extremamente severo.
  rationale: O texto enfatiza que o juízo anunciado não tem precedente nem paralelo futuro; suavizar essa formulação eliminaria sua tensão retórica e teológica.
- issue: Sentido da ação divina com בָךְ
  choice: Traduzir como “em você”.
  alternative: “contra você” ou “a você”.
  rationale: O hebraico permite conservar a imagem espacial do juízo executado no interior da cidade, sem decidir pela leitura relacional mais interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com concordância no singular feminino porque o discurso se dirige a Jerusalém. A expressão “coisa semelhante” evita uma construção excessivamente formal sem perder o comparativo enfático do hebraico.
