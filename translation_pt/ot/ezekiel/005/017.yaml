base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/017.yaml
  text: And I will send famine and wild beasts against you[a], and they will bereave you; and pestilence and bloodshed will pass through you, and I will bring a sword upon you. I, Yahweh[d][c][b], have spoken.
translation:
  language: pt
  text: E enviarei contra vocês fome e animais selvagens[a], e eles a deixarão sem filhos[b]; peste e derramamento de sangue[c] passarão pelo seu meio, e trarei a espada contra você. Eu, Yahweh, falei[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “animais ferozes” ou, mais literalmente, “animais maus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e eles causarão luto a você”. O verbo hebraico costuma indicar a perda de filhos.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “sangue”; aqui, provavelmente, no sentido de derramamento de sangue.'
    reason: lexical_alternative
  - marker: d
    text: 'O hebraico traz literalmente: “Eu, Yahweh, falei”. A ordem enfatiza que o próprio Yahweh garante o que foi anunciado.'
    reason: source_form
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי עֲלֵיכֶם
  choice: E enviarei contra você
  rationale: O piel com waw prossegue a sequência de juízos com valor futuro. Embora o hebraico passe aqui ao plural, Jerusalém é personificada no feminino singular no restante do versículo; o português mantém o referente coletivo com o singular natural.
- source_word: רָעָב
  choice: fome
  rationale: No contexto profético, indica fome coletiva e devastadora. Em português, “fome” é a expressão corrente e digna, sem necessidade de explicitar “carestia”.
- source_word: וְחַיָּה רָעָה
  choice: e animais selvagens
  rationale: A expressão literalmente qualifica os animais como maus ou nocivos; “animais selvagens” comunica de modo natural a ameaça, preservando em nota as alternativas mais literais.
- source_word: וְשִׁכְּלֻךְ
  choice: e eles a deixarão sem filhos
  rationale: O verbo שׁכל, no piel, denota causar perda de filhos ou tornar alguém desfilhado. A formulação explicita em português a força lexical, enquanto a nota registra a tradução mais concisa.
- source_word: וְדֶבֶר וָדָם
  choice: peste e derramamento de sangue
  rationale: דבר é doença epidêmica em listas de juízo; דם significa literalmente “sangue”, mas aqui provavelmente designa mortes violentas ou derramamento de sangue.
- source_word: יַעֲבָר בָּךְ
  choice: passarão pelo seu meio
  rationale: A expressão conserva a imagem dos juízos atravessando Jerusalém, com concordância plural natural em português para “peste e derramamento de sangue”.
- source_word: וְחֶרֶב אָבִיא עָלַיִךְ
  choice: e trarei a espada contra você
  rationale: Mantém a imagem concreta da espada como juízo, sem generalizá-la para guerra; “contra você” expressa naturalmente a força hostil da preposição.
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: Eu, Yahweh, falei
  rationale: Conserva o nome divino e a ênfase do pronome independente. O perfeito na fórmula profética expressa uma declaração solene e certa.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome de aliança sem substituí-lo por um título.
- issue: Sentido de שׁכל
  choice: a deixarão sem filhos
  alternative: a privarão dos filhos; causarão luto
  rationale: O verbo inclui lexicalmente a ideia de perda dos filhos. A tradução torna esse sentido claro, mas não especifica por qual agente ou mecanismo cada filho é perdido.
- issue: Sentido contextual de דם
  choice: derramamento de sangue
  alternative: sangue
  rationale: No catálogo de juízos, o substantivo provavelmente se refere à morte violenta. A nota conserva a forma literalmente mais próxima.
- issue: Referente e alternância de número gramatical
  choice: você / a
  alternative: vocês
  rationale: עֲלֵיכֶם está no plural, mas os sufixos seguintes são femininos singulares, dirigidos a Jerusalém personificada. O singular em português mantém essa personificação e evita uma alternância artificial, sem resolver em nota a irregularidade textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém a personificação feminina singular de Jerusalém, a imagem profética da espada e a fórmula solene final. Todos os marcadores de nota aparecem no texto principal.
