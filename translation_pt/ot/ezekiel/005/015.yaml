id: EZK.5.15
reference: Ezekiel 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה חֶרְפָּ֤ה וּ/גְדוּפָה֙ מוּסָ֣ר וּ/מְשַׁמָּ֔ה לַ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ בַּ/עֲשׂוֹתִ/י֩ בָ֨/ךְ שְׁפָטִ֜ים בְּ/אַ֤ף וּ/בְ/חֵמָה֙ וּ/בְ/תֹכְח֣וֹת חֵמָ֔ה אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/015.yaml
  text: And you shall become a reproach and a taunt[a], a warning and a horror, to the nations that are around you, when I execute judgments on you in anger and in wrath and with wrathful rebukes. I am Yahweh[c][b]; I have spoken.
translation:
  language: pt
  text: Você se tornará motivo de vergonha e zombaria, advertência[a] e horror[b] para as nações ao seu redor, quando eu executar juízos contra você com ira, furor e repreensões furiosas[c]. Eu, Yahweh, falei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrução”, “disciplina” ou “correção”; aqui, Jerusalém se torna uma lição para as nações vizinhas.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “motivo de horror”, “desolação” ou “espanto”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “repreensões de furor”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Você se tornará
  rationale: O verbo está no feminino singular e se refere diretamente a Jerusalém; a segunda pessoa preserva essa interpelação.
- source_word: חֶרְפָּה
  choice: motivo de vergonha
  rationale: Expressa tanto a desonra pública quanto o desprezo sofrido, de modo natural em português.
- source_word: גְדוּפָה
  choice: zombaria
  rationale: Denota fala injuriosa ou escarnecedora e mantém distinção em relação à vergonha.
- source_word: מוּסָר
  choice: advertência
  rationale: Neste contexto de juízo, Jerusalém passa a servir de lição exemplar às nações vizinhas.
- source_word: מְשַׁמָּה
  choice: horror
  rationale: Preserva a ideia de assombro causado pela devastação, sem excluir a nuance de desolação.
- source_word: לַגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: para as nações ao seu redor
  rationale: Reproduz com clareza a relação com os povos vizinhos.
- source_word: בַּעֲשׂוֹתִי בָךְ שְׁפָטִים
  choice: quando eu executar juízos contra você
  rationale: A construção é temporal, e 'executar juízos' conserva seu caráter judicial; 'contra' explicita a direção adversa do juízo neste contexto.
- source_word: בְּאַף וּבְחֵמָה
  choice: com ira, furor
  rationale: Dois termos distintos mantêm a intensificação do hebraico sem redundância artificial em português.
- source_word: וּבְתוֹכְחוֹת חֵמָה
  choice: e repreensões furiosas
  rationale: Formulação idiomática que conserva tanto as repreensões quanto sua qualificação pela fúria.
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: Eu, Yahweh, falei
  rationale: Mantém a fórmula enfática e verte diretamente o nome divino, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de מוּסָר na enumeração de juízos
  choice: advertência
  alternative: instrução; disciplina; correção
  rationale: Jerusalém se torna uma lição pública para as nações; 'advertência' comunica essa força exemplar sem apagar as demais possibilidades lexicais, registradas em nota.
- issue: Nuance de מְשַׁמָּה
  choice: horror
  alternative: desolação; espanto
  rationale: Na sequência daquilo que Jerusalém se tornará para as nações, destaca-se a reação horrorizada provocada por sua ruína, embora o termo também possa apontar para desolação ou espanto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência nominal foi mantida compacta, e as repetições intensificadoras do hebraico foram diferenciadas como 'ira' e 'furor'. Todos os marcadores de notas aparecem no texto principal.
