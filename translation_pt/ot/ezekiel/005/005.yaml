  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה זֹ֚את יְר֣וּשָׁלִַ֔ם בְּ/ת֥וֹךְ הַ/גּוֹיִ֖ם שַׂמְתִּ֑י/הָ וּ/סְבִיבוֹתֶ֖י/הָ אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/005.yaml
  text: 'Thus says the Lord GOD: This is Jerusalem. I have set her in the midst of the nations[a], with lands all around her.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Esta é Jerusalém. Eu a coloquei no meio das nações, com terras ao redor dela.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e solene a fórmula profética hebraica; o presente em português é idiomático nesse tipo de declaração.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição pouco natural «Senhor SENHOR».
- source_word: זֹאת יְרוּשָׁלִַם
  choice: Esta é Jerusalém
  rationale: Mantém a identificação enfática e dêitica expressa pelo demonstrativo hebraico.
- source_word: בְּתוֹךְ הַגּוֹיִם
  choice: no meio das nações
  rationale: Expressa a posição central indicada por בְּתוֹךְ com maior precisão do que o simples «entre».
- source_word: שַׂמְתִּיהָ
  choice: Eu a coloquei
  rationale: Traduz diretamente o perfeito de שׂים e o sufixo feminino referente a Jerusalém, sem impor ao aspecto hebraico um tempo composto desnecessário.
- source_word: וּסְבִיבוֹתֶיהָ אֲרָצוֹת
  choice: com terras ao redor dela
  rationale: Formula em português natural a construção nominal hebraica e preserva a imagem de terras circundando Jerusalém.
theological_decisions:
- issue: Tradução do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: Representa explicitamente o nome próprio יהוה e, ao mesmo tempo, conserva אֲדֹנָי como título; não transforma os dois elementos distintos em uma repetição de «Senhor».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência profética preservada. A tradução mantém a personificação gramatical de Jerusalém por meio de «a» e «dela», sem acrescentar uma marca tipográfica para o gênero.
