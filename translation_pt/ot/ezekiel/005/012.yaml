  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁלִשִׁתֵ֞/יךְ בַּ/דֶּ֣בֶר יָמ֗וּתוּ וּ/בָֽ/רָעָב֙ יִכְל֣וּ בְ/תוֹכֵ֔/ךְ וְ/הַ֨/שְּׁלִשִׁ֔ית בַּ/חֶ֖רֶב יִפְּל֣וּ סְבִיבוֹתָ֑יִ/ךְ וְ/הַ/שְּׁלִישִׁית֙ לְ/כָל ר֣וּחַ אֱזָרֶ֔ה וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/012.yaml
  text: A third of you will die by pestilence and be consumed by famine in your midst[a], and a third will fall by the sword all around you, and a third I will scatter to every wind[b], and I will draw out a sword after them.
translation:
  language: pt
  text: Um terço dos seus habitantes morrerá de peste e será consumido pela fome em seu meio; outro terço cairá à espada ao seu redor; e um terço eu espalharei a todos os ventos[a] e desembainharei a espada atrás deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a todo vento”; expressão que significa “em todas as direções”.
    reason: cultural_note
  - marker: b
    text: 'Ou: “sacarei a espada atrás deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁתֵיךְ / הַשְּׁלִשִׁית / הַשְּׁלִישִׁית
  choice: um terço / outro terço / o terço restante
  rationale: Mantém a divisão do juízo em três partes iguais. A primeira ocorrência explicita “dos seus habitantes” para tornar natural em português a referência à população da cidade personificada; as seguintes preservam a repetição estrutural sem redundância excessiva.
- source_word: דֶּבֶר
  choice: peste
  rationale: Designa doença epidêmica no contexto de juízo profético; “peste” é preciso, corrente e mantém a força concreta do termo.
- source_word: יָמוּתוּ
  choice: morrerá
  rationale: O futuro comunica o anúncio profético; o singular concorda naturalmente com o coletivo “um terço” em português.
- source_word: רָעָב
  choice: fome
  rationale: No contexto, refere-se à fome coletiva provocada pela escassez. “Fome” é mais corrente e amplamente compreensível em português do que “carestia”, sem reduzir o sentido ao mero apetite individual.
- source_word: יִכְלוּ
  choice: será consumido
  rationale: Preserva a ideia severa de ser inteiramente acabado ou eliminado, além de combinar naturalmente com a fome como agente.
- source_word: בְּתוֹכֵךְ
  choice: no seu meio
  rationale: Mantém a referência àquilo que acontece dentro da cidade, ainda tratada como interlocutora personificada.
- source_word: חֶרֶב
  choice: espada
  rationale: Conserva a imagem profética concreta, que funciona também como metonímia de morte violenta na guerra.
- source_word: יִפְּלוּ
  choice: cairá
  rationale: “Cair à espada” é uma formulação clara e digna para morrer em ação violenta, mantendo a imagem do verbo hebraico.
- source_word: סְבִיבוֹתָיִךְ
  choice: ao seu redor
  rationale: Expressa de modo natural que essa parte da população cairá nas áreas circundantes da cidade.
- source_word: לְכָל רוּחַ
  choice: a todos os ventos
  rationale: Preserva a imagem idiomática hebraica de dispersão em todas as direções; a nota esclarece seu sentido.
- source_word: אֱזָרֶה
  choice: espalharei
  rationale: Comunica claramente a dispersão, sem impor no texto principal a possível nuance figurada de joeirar.
- source_word: אָרִיק
  choice: desembainharei
  rationale: No uso com “espada”, o verbo forma uma expressão de sacar a arma. “Desembainharei” torna essa ação inequívoca, enquanto a nota registra uma alternativa que explicita a perseguição resultante.
theological_decisions:
- issue: Interlocutora personificada e referente do juízo
  choice: Manter a cidade como interlocutora na segunda pessoa, explicitando apenas “seus habitantes” para que a fração seja idiomática em português.
  alternative: Inserir o nome “Jerusalém” ou traduzir literalmente “um terço de você”.
  rationale: As formas hebraicas estão no feminino singular e dirigem-se à cidade personificada. Nomeá-la acrescentaria um substantivo ausente do versículo, enquanto “um terço de você” sugeriria em português a divisão física de uma pessoa ou cidade, e não de sua população.
- issue: Linguagem imagética do juízo
  choice: Conservar as imagens concretas de peste, espada e ventos.
  alternative: Substituí-las por abstrações como doença, guerra e todas as direções.
  rationale: As imagens são compreensíveis em português e carregam a força retórica do anúncio profético; a nota explica apenas o idioma potencialmente menos transparente.
- issue: Imagem final da espada
  choice: Entender אָרִיק com חֶרֶב como sacar ou desembainhar a espada, mantendo “atrás deles”.
  alternative: Explicitar o efeito como “farei a espada persegui-los”.
  rationale: A construção retrata perseguição e juízo continuado após a dispersão. O texto principal preserva mais de perto a ação e a relação espacial do hebraico, e a nota registra a formulação interpretativa possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A pontuação em três segmentos reforça a estrutura tripartida do hebraico. Evitaram-se arcaísmos, mas foram preservadas as imagens proféticas essenciais.
