  text: וְ/כָלָ֣ה אַפִּ֗/י וַ/הֲנִחוֹתִ֧י חֲמָתִ֛/י בָּ֖/ם וְ/הִנֶּחָ֑מְתִּי וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה דִּבַּ֨רְתִּי֙ בְּ/קִנְאָתִ֔/י בְּ/כַלּוֹתִ֥/י חֲמָתִ֖/י בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/013.yaml
  text: So my anger will be spent[a], and I will cause my wrath to rest on them, and I will be comforted. Then they will know that I, Yahweh, have spoken in my jealousy[b], when I spend my wrath against them.
translation:
  language: pt
  text: Assim, a minha ira se esgotará, farei o meu furor repousar sobre eles e serei consolado[a]. Então saberão que eu, Yahweh, falei no meu ciúme[b], quando eu tiver esgotado o meu furor contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terei alívio” ou “ficarei apaziguado”. O verbo hebraico pode indicar ser consolado ou encontrar alívio depois de concluído o juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou “no meu zelo”. O termo hebraico pode significar tanto “ciúme” como “zelo”; “ciúme” conserva aqui sua força relacional e pactual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָלָה אַפִּי
  choice: a minha ira se esgotará
  rationale: A construção com כלה apresenta a ira chegando ao fim depois de seguir todo o seu curso. “Esgotar-se” é natural em português e preserva o motivo de consumação repetido no fim do versículo.
- source_word: וַהֲנִחוֹתִי חֲמָתִי בָּם
  choice: farei o meu furor repousar sobre eles
  rationale: O hifil de נוח significa literalmente fazer repousar ou assentar. A formulação mantém a imagem hebraica de o furor divino ser posto sobre os julgados, sem reduzi-la à ideia interpretativa de mera satisfação.
- source_word: חֲמָתִי
  choice: o meu furor
  rationale: “Furor” comunica o calor e a intensidade de חֵמָה e o distingue de אַף, traduzido como “ira”.
- source_word: וְהִנֶּחָמְתִּי
  choice: serei consolado
  rationale: O nifal de נחם pode expressar ser consolado ou encontrar alívio. A tradução direta conserva a linguagem afetiva e sua tensão, enquanto a nota registra a alternativa contextual.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: “Então” expressa naturalmente o resultado ou a consequência da execução do juízo no encadeamento verbal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: בְּקִנְאָתִי
  choice: no meu ciúme
  rationale: קִנְאָה pode indicar ciúme ou zelo. “Ciúme” preserva aqui a força relacional e pactual, sem eliminar a alternativa “zelo”.
- source_word: בְּכַלּוֹתִי חֲמָתִי בָּם
  choice: quando eu esgotar contra eles o meu furor
  rationale: O infinitivo construto tem valor temporal, e “esgotar” retoma deliberadamente o verbo da primeira oração. “Contra eles” comunica o alvo hostil e judicial marcado por ב.
theological_decisions:
- issue: Linguagem afetiva divina no contexto do juízo
  choice: Manter de forma direta “ira”, “furor”, “ciúme” e “serei consolado”.
  alternative: Substituir por abstrações como “indignação”, “zelo” ou “minha justiça será satisfeita”.
  rationale: O hebraico atribui explicitamente essa linguagem afetiva a Yahweh. Preservá-la conserva a força profética e a tensão teológica, sem impor explicações sistemáticas ao texto.
- issue: Sentido de וְהִנֶּחָמְתִּי após a consumação do juízo
  choice: serei consolado
  alternative: terei alívio; ficarei apaziguado
  rationale: “Serei consolado” representa de perto a forma nifal e evita resolver silenciosamente a imagem. A nota oferece o sentido contextual possível de alívio ou apaziguamento.
- issue: Representação do Tetragrama
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A forma “Yahweh” torna visível o nome próprio presente no hebraico e o distingue de títulos divinos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções claras. A repetição de “esgotar” reproduz o motivo hebraico de consumação; “repousar sobre eles” mantém a imagem concreta da fonte, e as notas preservam ambiguidades lexicais genuínas.
