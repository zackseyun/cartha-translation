base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/016.yaml
  text: When I send against them the deadly arrows of famine[a], which are for destruction, which I will send to destroy you[b], then I will add famine upon you and break for you the staff of bread.
translation:
  language: pt
  text: Quando eu enviar contra eles as flechas mortíferas da fome[a], destinadas à destruição, flechas que enviarei para destruir vocês, acrescentarei fome sobre vocês e quebrarei o cajado do pão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as flechas nocivas da fome” ou “as flechas desastrosas da fome”.
    reason: Alternativas lexicais para הָרָעִים, que aqui descreve o efeito calamitoso das flechas.
  - marker: b
    text: Expressão hebraica que se refere ao suprimento de pão, isto é, ao alimento que sustenta a vida.
    reason: Esclarecimento do sentido idiomático de “cajado do pão”.
lexical_decisions:
- source_word: בְּשַׁלְּחִי
  choice: Quando eu lançar
  rationale: A preposição בְּ com o infinitivo construto de שׁלח introduz uma oração temporal. Em português, “quando eu lançar” é natural com “flechas” e mantém a ação divina explícita.
- source_word: חִצֵּי הָרָעָב הָרָעִים
  choice: as flechas mortíferas da fome
  rationale: Mantém a metáfora da fome como arma. “Mortíferas” expressa o efeito calamitoso de הָרָעִים neste contexto, sem atribuir maldade moral às flechas.
- source_word: בָּהֶם
  choice: contra eles
  rationale: Com o verbo de envio ou lançamento, indica os destinatários hostis das flechas. O pronome retoma as pessoas mencionadas no contexto anterior.
- source_word: אֲשֶׁר הָיוּ לְמַשְׁחִית
  choice: destinadas à destruição
  rationale: Expressa de modo conciso a finalidade ou o efeito destrutivo indicado por לְמַשְׁחִית.
- source_word: אֲשֶׁר אֲשַׁלַּח אוֹתָם לְשַׁחֶתְכֶם
  choice: as lançarei para destruir vocês
  rationale: Preserva a repetição deliberada do verbo שׁלח, ajustando o pronome ao gênero de “flechas”, e mantém sem atenuação o propósito expresso por לְשַׁחֶתְכֶם.
- source_word: וְרָעָב אֹסֵף עֲלֵיכֶם
  choice: Então aumentarei a fome contra vocês
  rationale: O hifil de יסף comunica acréscimo ou intensificação. “Contra vocês” torna natural em português a força adversativa de עֲלֵיכֶם no contexto de juízo.
- source_word: וְשָׁבַרְתִּי לָכֶם מַטֵּה לָחֶם
  choice: e quebrarei o cajado do pão
  rationale: Conserva a metáfora hebraica do pão como cajado que sustenta a vida; a nota esclarece o sentido idiomático.
theological_decisions:
- issue: Agência divina no juízo
  choice: 'Manter Deus como agente explícito: “eu lançar”, “as lançarei”, “aumentarei” e “quebrarei”.'
  alternative: Empregar construções impessoais, como “a fome virá”.
  rationale: O hebraico atribui repetidamente essas ações ao próprio Deus; suavizar essa agência alteraria a força teológica do oráculo.
- issue: Metáforas do juízo
  choice: Conservar “flechas da fome” e “cajado do pão” no texto principal.
  alternative: Substituí-las integralmente por “fome mortal” e “abastecimento de alimento”.
  rationale: As imagens são importantes para a retórica do texto. A metáfora menos transparente, “cajado do pão”, é explicada em nota sem ser eliminada.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A formulação preserva a mudança do hebraico de “eles” para “vocês”, a repetição da ação de lançar e as duas metáforas centrais.
