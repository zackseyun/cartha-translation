base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/004.yaml
  text: And from them you shall take some more[a], and throw them into the midst of the fire and burn them in the fire. From it a fire will go out to all the house of Israel.
translation:
  language: pt
  text: E você pegará ainda alguns deles, os lançará no meio do fogo e os queimará no fogo. Desse fogo sairá fogo para toda a casa de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵהֶם עוֹד תִּקָּח
  choice: E você pegará ainda alguns deles
  rationale: Expressa a ideia partitiva de מֵהֶם e o acréscimo indicado por עוֹד, mantendo o tom diretivo da ação simbólica em português natural.
- source_word: וְהִשְׁלַכְתָּ אוֹתָם אֶל תּוֹךְ הָאֵשׁ
  choice: os lançará no meio do fogo
  rationale: “Lançará” comunica com clareza o Hifil de שלך, enquanto “no meio do fogo” preserva o valor explícito de תּוֹךְ.
- source_word: וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ
  choice: e os queimará no fogo
  rationale: Tradução direta de שרף com a localização ou meio indicado por בָּאֵשׁ, sem ampliar a imagem.
- source_word: מִמֶּנּוּ
  choice: Daí
  rationale: O advérbio retoma a cena imediatamente anterior sem impor em português um antecedente gramatical específico ao sufixo singular hebraico; a ambiguidade é registrada em nota.
- source_word: תֵצֵא אֵשׁ
  choice: sairá fogo
  rationale: Preserva a imagem concreta de יצא, segundo a qual o fogo procede da ação simbólica.
- source_word: אֶל כָּל בֵּית יִשְׂרָאֵל
  choice: para toda a casa de Israel
  rationale: Traduz אֶל pelo sentido direcional comum, sem inserir explicitamente “contra”; “casa de Israel” conserva a expressão coletiva e pactual do hebraico.
theological_decisions:
- issue: Origem do fogo que alcança a casa de Israel
  choice: Manter aberta a referência exata de מִמֶּנּוּ por meio de “Daí”
  alternative: Explicitar que o fogo sai do próprio fogo ou dos cabelos queimados
  rationale: A ação simbólica anuncia que o juízo se estenderá a toda a casa de Israel, mas o texto não exige que a tradução determine com precisão o mecanismo simbólico ou o antecedente do sufixo.
- issue: Direção do fogo em relação a Israel
  choice: para toda a casa de Israel
  alternative: contra toda a casa de Israel
  rationale: O contexto é claramente de juízo, mas אֶל exprime aqui direção; a tradução evita acrescentar uma força hostil que o contexto já torna perceptível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O futuro mantém o tom de instrução profética dentro da sequência da ação simbólica; “lançará” evita arcaísmo excessivo, e “casa de Israel” preserva a formulação bíblica sem soar obscura.
