  naturalness: O português é claro e moderno. «Desse fogo sairá fogo» é natural no registro profético e reproduz, inclusive, a formulação enfática e aparentemente tautológica do hebraico.
  terminology: «Lançará», «queimará», «fogo» e «casa de Israel» são escolhas adequadas. «Você» é aceitável para a legibilidade brasileira pretendida e mantém a segunda pessoa da instrução.
