  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ גַּם אָ֑נִי וְ/עָשִׂ֧יתִי בְ/תוֹכֵ֛/ךְ מִשְׁפָּטִ֖ים לְ/עֵינֵ֥י הַ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I myself am against you, and I will execute judgments in your midst before the eyes of the nations.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh[a]: “Eis que eu mesmo estou contra você e executarei juízos em seu meio, diante dos olhos das nações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Adonai YHWH”. Tradicionalmente, a expressão é traduzida como “Senhor DEUS”, para evitar “Senhor SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz de modo natural a consequência da acusação anterior e preserva a relação inferencial do hebraico.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética de mensageiro em linguagem portuguesa corrente e solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יְהוִה e evita ocultar o nome próprio presente no texto hebraico.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva a força de apresentação e a solenidade do anúncio divino.
- source_word: עָלַיִךְ
  choice: contra você
  rationale: No contexto de juízo, a preposição expressa oposição hostil, não simples posição espacial; o feminino singular se refere a Jerusalém.
- source_word: גַּם אֲנִי
  choice: eu mesmo
  rationale: Comunica em português natural a ênfase na intervenção pessoal do próprio Deus.
- source_word: וְעָשִׂיתִי ... מִשְׁפָּטִים
  choice: executarei juízos
  rationale: Expressa idiomaticamente os atos judiciais concretos indicados pelo plural hebraico.
- source_word: בְתוֹכֵךְ
  choice: no meio de você
  rationale: Indica que os juízos ocorrerão dentro de Jerusalém, a destinatária personificada do discurso.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: diante dos olhos das nações
  rationale: Conserva a imagem hebraica e enfatiza o caráter público e visível do juízo.
theological_decisions:
- issue: Representação do nome divino יְהוִה no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução mantém explícito o nome divino presente no hebraico, enquanto a nota registra a convenção tradicional que evita a sequência equivalente a “Senhor SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência profética. “Você” retém o tratamento feminino singular dirigido a Jerusalém sem exigir uma explicitação interpretativa no corpo do versículo.
