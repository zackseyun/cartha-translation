reference: Ezekiel 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן אָב֞וֹת יֹאכְל֤וּ בָנִים֙ בְּ/תוֹכֵ֔/ךְ וּ/בָנִ֖ים יֹאכְל֣וּ אֲבוֹתָ֑/ם וְ/עָשִׂ֤יתִי בָ/ךְ֙ שְׁפָטִ֔ים וְ/זֵרִיתִ֥י אֶת כָּל שְׁאֵרִיתֵ֖/ךְ לְ/כָל רֽוּחַ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/010.yaml
  text: Therefore fathers will eat sons in your midst[a], and sons will eat their fathers[b]; and I will execute judgments on you and scatter all your remnant to every wind.
translation:
  language: pt
  text: Por isso, os pais comerão os filhos no seu meio, e os filhos comerão os seus pais. Executarei juízos contra você e espalharei todo o seu remanescente[a] a todos os ventos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus sobreviventes” ou “tudo o que restar de você”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a todo vento”, expressão que indica dispersão completa em todas as direções.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca de modo natural a conclusão decorrente da acusação e do anúncio de juízo anteriores.
- source_word: אָבוֹת
  choice: os pais
  rationale: Preserva o termo masculino de parentesco do hebraico e a terrível ruptura dos vínculos familiares; em português, o contexto recíproco esclarece o sentido.
- source_word: יֹאכְלוּ ... בָנִים
  choice: comerão os filhos
  rationale: Mantém o verbo comum 'comer', cuja referência ao canibalismo resulta claramente do contexto de fome e juízo, e conserva o termo familiar בָּנִים.
- source_word: בְּתוֹכֵךְ
  choice: no seu meio
  rationale: Expressão portuguesa natural para algo ocorrido dentro da cidade ou comunidade personificada e interpelada no feminino singular.
- source_word: וּבָנִים יֹאכְלוּ אֲבוֹתָם
  choice: e os filhos comerão os seus pais
  rationale: Conserva o paralelismo recíproco e os termos específicos de parentesco do texto hebraico.
- source_word: וְעָשִׂיתִי בָךְ שְׁפָטִים
  choice: Executarei juízos contra você
  rationale: Reproduz a força judicial da construção e comunica que os atos divinos de juízo recaem sobre a cidade interpelada.
- source_word: שְׁפָטִים
  choice: juízos
  rationale: Mantém a linguagem judicial característica de Ezequiel, sem reduzi-la apenas a 'castigos'.
- source_word: וְזֵרִיתִי
  choice: e espalharei
  rationale: Expressa com clareza a dispersão associada ao exílio, sem exigir que o leitor reconheça uma possível imagem de joeiramento.
- source_word: כָּל שְׁאֵרִיתֵךְ
  choice: todo o seu remanescente
  rationale: Preserva a ressonância lexical e teológica de שְׁאֵרִית, enquanto o contexto deixa claro que esse remanescente também será disperso.
- source_word: לְכָל רוּחַ
  choice: a todos os ventos
  rationale: Mantém a metáfora hebraica de dispersão total em todas as direções numa formulação portuguesa corrente.
theological_decisions:
- issue: Sentido de שְׁאֵרִית em um contexto de juízo
  choice: remanescente
  alternative: sobreviventes; os que restarem de você
  rationale: Embora 'remanescente' possa ter conotações de restauração em outros contextos, neste versículo ele é objeto de nova dispersão. A escolha conserva a ressonância bíblica do termo sem introduzir uma promessa de esperança que o versículo não declara.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A colocação dos marcadores foi ajustada para corresponder aos termos efetivamente explicados: [a] após “remanescente” e [b] após “ventos”.'
