  text: וַ/תֶּ֨מֶר אֶת מִשְׁפָּטַ֤/י לְ/רִשְׁעָה֙ מִן הַ/גּוֹיִ֔ם וְ/אֶ֨ת חֻקּוֹתַ֔/י מִן הָ/אֲרָצ֖וֹת אֲשֶׁ֣ר סְבִיבוֹתֶ֑י/הָ כִּ֤י בְ/מִשְׁפָּטַ/י֙ מָאָ֔סוּ וְ/חֻקּוֹתַ֖/י לֹא הָלְכ֥וּ בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/006.yaml
  text: And she rebelled against my judgments with wickedness more than the nations[a], and against my statutes more than the lands that are around her; for they rejected my judgments[b], and they did not walk in my statutes.
translation:
  language: pt
  text: Ela se rebelou perversamente contra os meus juízos, mais do que as nações[a], e contra os meus estatutos, mais do que as terras ao seu redor; pois rejeitaram os meus juízos e não andaram segundo os meus estatutos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela transformou os meus juízos em perversidade, mais do que as nações”. O verbo pode ser entendido como rebelião ou como alteração corruptora do que Deus havia dado; o texto principal segue o sentido de rebeldia no contexto da aliança.'
    reason: lexical_alternative
  - marker: b
    text: “Andar segundo” é uma expressão hebraica que significa viver de acordo com algo ou segui-lo.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֶּמֶר
  choice: ela se rebelou
  rationale: O verbo מרה normalmente expressa rebeldia ou desobediência em contextos de aliança. A forma feminina singular preserva a personificação profética de Jerusalém.
- source_word: לְרִשְׁעָה
  choice: perversamente
  rationale: O substantivo com ל descreve aqui o caráter perverso da rebelião. O advérbio produz português natural sem eliminar a ideia moral do hebraico.
- source_word: מִשְׁפָּטַי
  choice: meus juízos
  rationale: Preserva a força jurídica de מִשְׁפָּט e mantém sua distinção em relação a חֻקּוֹתַי.
- source_word: מִן הַגּוֹיִם
  choice: mais do que as nações
  rationale: 'O מִן tem valor comparativo neste contexto: a rebeldia de Jerusalém excedeu a das nações.'
- source_word: חֻקּוֹתַי
  choice: meus estatutos
  rationale: Termo formal e compreensível para prescrições estabelecidas, distinto de 'juízos'.
- source_word: מִן הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ
  choice: mais do que as terras ao seu redor
  rationale: Mantém o paralelismo comparativo e o sentido territorial amplo de אֲרָצוֹת, sem impor a noção moderna de Estado nacional.
- source_word: מָאָסוּ
  choice: rejeitaram
  rationale: מאס indica rejeição, muitas vezes com desprezo; 'rejeitaram' comunica claramente a ação sem ampliar indevidamente sua carga emocional.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: não andaram segundo os meus estatutos
  rationale: Conserva a metáfora hebraica de 'andar' e torna explícito, de modo natural, que se trata de conduzir a vida de acordo com os estatutos.
theological_decisions:
- issue: Personificação feminina de Jerusalém
  choice: Manter 'ela' como sujeito da primeira oração.
  alternative: Explicitar 'Jerusalém' ou usar uma construção impessoal.
  rationale: A forma verbal feminina singular representa a cidade como mulher; preservar essa personificação mantém a força literária do oráculo.
- issue: Mudança do singular para o plural
  choice: Manter 'ela se rebelou' e depois 'rejeitaram/não andaram'.
  alternative: Uniformizar todo o versículo no singular.
  rationale: O hebraico passa do feminino singular, referente à cidade personificada, ao plural, referente aos seus habitantes. A tradução conserva essa tensão gramatical significativa.
- issue: Distinção entre termos jurídicos da aliança
  choice: Traduzir מִשְׁפָּטַי por 'meus juízos' e חֻקּוֹתַי por 'meus estatutos'.
  alternative: Traduzir ambos por 'minhas leis'.
  rationale: O texto emprega dois termos distintos em paralelo; diferenciá-los evita achatar sua textura jurídica sem atribuir a cada um uma distinção doutrinária rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a personificação profética, o paralelismo jurídico e a comparação enfática, ao mesmo tempo que verte לְרִשְׁעָה de forma idiomática como 'perversamente'.
