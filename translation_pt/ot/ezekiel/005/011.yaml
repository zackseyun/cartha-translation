  to: Por isso, tão certo como eu vivo — declara o Senhor Yahweh —, por você ter profanado o meu santuário com todas as suas coisas repugnantes e todas as suas abominações, eu também a reduzirei[a]. Meus olhos não pouparão, e eu também não terei compaixão.
