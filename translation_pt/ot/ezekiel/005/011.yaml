  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א יַ֚עַן אֶת מִקְדָּשִׁ֣/י טִמֵּ֔את בְּ/כָל שִׁקּוּצַ֖יִ/ךְ וּ/בְ/כָל תּוֹעֲבֹתָ֑יִ/ךְ וְ/גַם אֲנִ֤י אֶגְרַע֙ וְ/לֹא תָח֣וֹס עֵינִ֔/י וְ/גַם אֲנִ֖י לֹ֥א אֶחְמֽוֹל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, surely because you have defiled my sanctuary with all your detestable things and with all your abominations, I also will diminish you; my eye will not spare, and I also will show no pity.
translation:
  language: pt
  text: Por isso, tão certo como eu vivo — declara o Senhor Yahweh —, por você ter profanado o meu santuário com todas as suas coisas repugnantes e todas as suas abominações, eu também a reduzirei[a]. Meus olhos não pouparão, e eu também não terei compaixão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “também diminuirei” ou “também cortarei”. O verbo hebraico é conciso, e seu objeto não está expresso.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente, em português, a conclusão judicial decorrente do contexto anterior.
- source_word: חַי אָנִי
  choice: tão certo como eu vivo
  rationale: Expressa com clareza e solenidade a fórmula hebraica de autojuramento divino.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Mantém a fórmula profética e distingue o título אֲדֹנָי do nome pessoal divino יהוה.
- source_word: אִם לֹא
  choice: expresso pela construção de juramento “tão certo como”
  rationale: No contexto de juramento, a expressão funciona como asseveração enfática, não como condição literal.
- source_word: יַעַן
  choice: por você ter
  rationale: Reproduz a relação causal e permite uma frase portuguesa fluente.
- source_word: מִקְדָּשִׁי
  choice: o meu santuário
  rationale: Preserva o sentido cultual do lugar santo sem restringi-lo indevidamente ao edifício inteiro.
- source_word: טִמֵּאת
  choice: profanado
  rationale: No contexto do santuário, comunica tanto a contaminação cultual quanto a violação da santidade.
- source_word: שִׁקּוּצַיִךְ
  choice: suas coisas repugnantes
  rationale: Conserva a referência ampla a objetos ou elementos detestáveis e evita igualar o termo seguinte.
- source_word: תּוֹעֲבוֹתָיִךְ
  choice: suas abominações
  rationale: Mantém o peso religioso e moral do termo e sua distinção lexical em relação a שִׁקּוּצַיִךְ.
- source_word: אֶגְרַע
  choice: reduzirei você
  rationale: Representa o sentido básico de diminuir ou cortar, suprindo em português o objeto sugerido pelo contexto; a concisão e a incerteza do hebraico são registradas em nota.
- source_word: לֹא תָחוֹס עֵינִי
  choice: O meu olhar não poupará
  rationale: Preserva a imagem do olho divino em forma natural para leitores modernos de português.
- source_word: לֹא אֶחְמוֹל
  choice: não terei compaixão
  rationale: Comunica diretamente a ausência de piedade e mantém o paralelismo sem repetir o verbo “poupar”.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome pessoal יהוה, sem produzir a repetição “Senhor SENHOR”.
- issue: Alcance do juízo expresso por אֶגְרַע
  choice: eu também reduzirei você
  alternative: eu também retirarei / eu também cortarei
  rationale: O verbo é breve e não traz objeto expresso. “Reduzirei você” comunica a ideia contextual de diminuição sem definir exatamente o modo do juízo, enquanto a nota conserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A fórmula de juramento foi vertida idiomaticamente; a imagem do olho foi mantida por meio de “olhar”. O pronome “você” torna explícito o destinatário feminino singular do hebraico no contexto, sem tentar reproduzir gênero gramatical inexistente nessa forma portuguesa.
