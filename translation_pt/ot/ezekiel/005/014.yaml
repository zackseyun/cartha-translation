source:
  edition: WLC
  text: וְ/אֶתְּנֵ/ךְ֙ לְ/חָרְבָּ֣ה וּ/לְ/חֶרְפָּ֔ה בַּ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ לְ/עֵינֵ֖י כָּל עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/014.yaml
  text: And I will make you a ruin and a reproach among the nations that are around you[b][a], in the sight of everyone who passes by.
translation:
  language: pt
  text: E farei de você uma ruína[a] e motivo de desprezo[b] entre as nações que estão ao seu redor, à vista de todos os que passarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma desolação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “motivo de afronta”; também pode significar “objeto de zombaria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵךְ
  choice: E farei de você
  rationale: Embora נתן signifique literalmente “dar”, “pôr” ou “colocar”, com os complementos seguintes expressa o resultado imposto à cidade. “Farei de você” comunica isso de modo natural e preserva a ação causativa.
- source_word: לְחָרְבָּה
  choice: uma ruína
  rationale: חָרְבָּה descreve o estado devastado de uma cidade. “Uma ruína” é concreto, claro e adequado ao contexto.
- source_word: וּלְחֶרְפָּה
  choice: e motivo de desprezo
  rationale: חֶרְפָּה pode indicar afronta, vergonha, desprezo ou objeto de zombaria. “Motivo de desprezo” expressa com naturalidade que a cidade se tornará alvo da desonra pública.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם se refere aqui aos povos circunvizinhos, sem exigir o sentido teológico específico de “gentios”.
- source_word: אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: que estão ao seu redor
  rationale: Mantém a oração relativa do hebraico e identifica claramente as nações que cercam a cidade.
- source_word: לְעֵינֵי
  choice: à vista de
  rationale: A expressão idiomática, literalmente relacionada aos “olhos”, indica algo público e visível. “À vista de” preserva esse aspecto visual.
- source_word: כָּל עוֹבֵר
  choice: todos os que passarem
  rationale: O particípio עוֹבֵר designa quem passa pelo lugar. O futuro do subjuntivo é idiomático em português para o conjunto indeterminado de pessoas que vierem a passar.
theological_decisions:
- issue: Personificação de Jerusalém no feminino singular
  choice: Manter a referência pronominal implícita em “você”, sem inserir “Jerusalém” no texto
  alternative: Explicitar “Jerusalém” no texto principal
  rationale: O hebraico dirige-se à cidade na segunda pessoa feminina singular. A tradução preserva a interpelação direta e evita acrescentar um nome ausente deste versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha sua ocorrência no texto. A formulação preserva a personificação da cidade e o caráter público do juízo.
