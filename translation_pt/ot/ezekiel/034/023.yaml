  text: וַ/הֲקִמֹתִ֨י עֲלֵי/הֶ֜ם רֹעֶ֤ה אֶחָד֙ וְ/רָעָ֣ה אֶתְ/הֶ֔ן אֵ֖ת עַבְדִּ֣/י דָוִ֑יד ה֚וּא יִרְעֶ֣ה אֹתָ֔/ם וְ/הֽוּא יִהְיֶ֥ה לָ/הֶ֖ן לְ/רֹעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/023.yaml
  text: And I will raise up over them one shepherd[a], my servant David, and he will shepherd them; he himself will shepherd them[c][b], and he himself will be their shepherd.
translation:
  language: pt
  text: Levantarei sobre elas um só pastor[a], o meu servo Davi[b], e ele as pastoreará; ele mesmo os pastoreará[c], e ele mesmo será o pastor delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estabelecerei sobre elas um só pastor” ou “Designarei para elas um só pastor”.'
    reason: lexical_alternative
  - marker: b
    text: “Davi” pode referir-se literalmente a Davi como figura régia idealizada ou, de modo mais amplo, a um futuro governante da linhagem de Davi.
    reason: alternative_reading
  - marker: c
    text: O hebraico repete o verbo ligado ao trabalho do pastor; ele também pode ser traduzido por “apascentar” ou “cuidar”. Neste ponto, o pronome hebraico é masculino, enquanto as formas correspondentes na primeira e na última oração são femininas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Levantarei
  rationale: O hifil de קום pode significar levantar, estabelecer ou designar. “Levantarei” conserva tanto a ação divina de suscitar quanto a ideia de constituir um líder, sem especificar indevidamente uma entronização.
- source_word: עֲלֵיהֶם
  choice: sobre elas
  rationale: A preposição עַל expressa aqui a colocação do pastor em posição de direção sobre o rebanho. O feminino retoma naturalmente as ovelhas do contexto.
- source_word: רֹעֶה אֶחָד
  choice: um só pastor
  rationale: A formulação preserva a ênfase de אֶחָד na singularidade e unidade da liderança, com naturalidade em português.
- source_word: וְרָעָה / יִרְעֶה
  choice: as pastoreará
  rationale: O verbo רעה abrange apascentar, cuidar e governar como pastor. “Pastoreará” mantém a metáfora e permite reproduzir sua repetição no hebraico.
- source_word: אֶתְהֶן / אֹתָם
  choice: elas / as
  rationale: O hebraico alterna formas pronominais femininas e masculinas, provavelmente por tratar simultaneamente do rebanho e do povo como coletividade. Em português, o feminino retoma de modo natural as ovelhas no contexto imediato.
- source_word: אֵת עַבְדִּי דָוִד
  choice: o meu servo Davi
  rationale: Mantém o nome próprio e o título relacional “meu servo” sem acrescentar uma identificação interpretativa.
- source_word: הוּא
  choice: ele mesmo
  rationale: O pronome independente tem valor enfático. “Ele mesmo” torna perceptível essa ênfase nas duas ocorrências, apesar da repetição deliberada.
- source_word: יִהְיֶה לָהֶן לְרֹעֶה
  choice: será o pastor delas
  rationale: Expressa de forma idiomática em português a função e a relação indicadas pela construção hebraica, preservando a imagem pastoral.
theological_decisions:
- issue: Identidade de “Davi” no contexto profético
  choice: Manter “Davi” no texto principal sem expansão interpretativa.
  alternative: Entender a referência como um futuro governante davídico ou como o Messias.
  rationale: O hebraico diz literalmente “Davi”. Traduzir por “Messias” ou “descendente de Davi” resolveria no texto uma questão interpretativa e teológica que a profecia deixa em tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “pastoreará” e de “ele mesmo” é intencional para conservar a estrutura e a ênfase do hebraico, ainda que produza uma solenidade incomum no português corrente.
