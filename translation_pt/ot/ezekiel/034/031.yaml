  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתֵּ֥ן צֹאנִ֛/י צֹ֥אן מַרְעִיתִ֖/י אָדָ֣ם אַתֶּ֑ם אֲנִי֙ אֱלֹ֣הֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/031.yaml
  text: And you[a], my flock, the flock of my pasture—you are men, and I am your God, declares the Lord GOD.
translation:
  language: pt
  text: E vocês, meu rebanho, rebanho do meu pasto, são seres humanos[a], e eu sou o seu Deus — declara o Senhor DEUS.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “vocês são adam”, isto é, “ser humano” ou “humanidade”. A expressão contrasta o rebanho figurado com a condição humana real do povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּן
  choice: E vocês
  rationale: Mantém o pronome destacado e a interpelação direta. O português não reproduz a forma feminina plural do hebraico sem acrescentar uma distinção de gênero estranha ao contexto.
- source_word: צֹאנִי
  choice: meu rebanho
  rationale: Expressa naturalmente o coletivo e preserva a metáfora pastoril.
- source_word: צֹאן מַרְעִיתִי
  choice: rebanho do meu pasto
  rationale: Conserva a repetição explicativa e a imagem do lugar em que Deus alimenta e conduz o rebanho.
- source_word: אָדָם אַתֶּם
  choice: são seres humanos
  rationale: Explicita a cópula implícita e comunica o sentido coletivo de אָדָם, contrastando a identidade humana do povo com a figura do rebanho, sem restringi-lo ao sexo masculino.
- source_word: אֲנִי אֱלֹהֵיכֶם
  choice: eu sou o seu Deus
  rationale: Formulação pactual clara e corrente, preservando a ênfase do pronome אֲנִי e a relação expressa pelo sufixo possessivo.
- source_word: נְאֻם
  choice: declara
  rationale: Verbo corrente e solene para a fórmula profética, sem a rigidez de uma tradução nominal como “oráculo de”.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Distingue os dois elementos do título composto e evita a repetição “Senhor SENHOR”; DEUS em versaletes representa o nome divino.
theological_decisions:
- issue: Sentido de אָדָם no encerramento da metáfora do rebanho
  choice: seres humanos
  alternative: homens; humanidade
  rationale: Aqui אָדָם identifica o rebanho metafórico como gente de fato. “Seres humanos” mantém o sentido abrangente do coletivo hebraico e o contraste retórico, enquanto a nota registra sua forma mais literal.
- issue: Representação do título אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  alternative: Soberano SENHOR; Senhor Yahweh
  rationale: A forma escolhida preserva tanto אֲדֹנָי quanto o nome divino sem produzir “Senhor SENHOR” nem inserir uma interpretação adicional de אֲדֹנָי.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” adequado à ampla compreensão internacional e especialmente claro para leitores brasileiros. A repetição “meu rebanho, rebanho do meu pasto” foi mantida por sua força poética e explicativa.
