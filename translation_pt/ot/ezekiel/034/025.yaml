id: EZK.34.25
reference: Ezekiel 34:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם וְ/הִשְׁבַּתִּ֥י חַיָּֽה רָעָ֖ה מִן הָ/אָ֑רֶץ וְ/יָשְׁב֤וּ בַ/מִּדְבָּר֙ לָ/בֶ֔טַח וְ/יָשְׁנ֖וּ בַּ/יְּעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/025.yaml
  text: I will make with them a covenant of peace[a], and I will remove harmful wild animals from the land[b], so that they may dwell securely in the wilderness and sleep in the forests.
translation:
  language: pt
  text: Farei com eles uma aliança de paz[a] e retirarei da terra os animais selvagens perigosos[b], para que habitem em segurança no deserto e durmam nas florestas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Paz” também pode incluir integridade, bem-estar e segurança, não apenas ausência de conflito.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “farei cessar da terra os animais selvagens perigosos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: Farei
  rationale: A expressão hebraica כרת ברית significa literalmente “cortar uma aliança”, mas “fazer uma aliança” é o equivalente idiomático natural em português e preserva o ato de instituí-la.
- source_word: בְּרִית שָׁלוֹם
  choice: uma aliança de paz
  rationale: Preserva a fórmula de aliança e a amplitude de שָׁלוֹם, que pode abranger paz, integridade, bem-estar e segurança.
- source_word: הִשְׁבַּתִּי
  choice: retirarei
  rationale: O hifil de שבת expressa fazer cessar. Com animais perigosos e a preposição “da terra”, “retirarei” comunica naturalmente o fim de sua presença sem afirmar necessariamente sua destruição.
- source_word: חַיָּה רָעָה
  choice: animais selvagens perigosos
  rationale: חַיָּה designa aqui animais selvagens, enquanto רָעָה os caracteriza pelo dano ou perigo que causam, não por maldade moral.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da restauração de Israel, indica o território ou país, não necessariamente o planeta inteiro; “a terra” mantém a linguagem bíblica natural em português.
- source_word: יָשְׁבוּ
  choice: habitem
  rationale: O verbo significa morar ou viver. “Habitem” combina com o cenário de restauração e permanência segura.
- source_word: בַמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר pode indicar deserto, região erma ou estepe. “Deserto” é claro e corrente, preservando a imagem surpreendente de segurança num lugar desabitado e vulnerável.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: A expressão denota segurança e ausência de temor; “em segurança” é direta e idiomática.
- source_word: יָשְׁנוּ
  choice: durmam
  rationale: Mantém o sentido concreto de dormir e a imagem vívida de completa segurança.
- source_word: בַּיְּעָרִים
  choice: nas florestas
  rationale: Traduz diretamente as áreas arborizadas indicadas por יְעָרִים e conserva o contraste entre lugares ameaçadores e repouso seguro.
theological_decisions:
- issue: Alcance da promessa em “aliança de paz”
  choice: Manter a fórmula de aliança sem reduzir “paz” à mera ausência de guerra nem expandi-la no texto principal para um sistema doutrinário posterior.
  alternative: Traduzir como simples paz política ou explicitar no texto principal toda a ideia de salvação e bênção integral.
  rationale: A expressão hebraica é teologicamente rica e inclui segurança e bem-estar, mas sua amplitude deve ser preservada sem impor uma formulação doutrinária mais desenvolvida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Aliança” conserva o registro bíblico reconhecível; “habitem em segurança” e “durmam nas florestas” mantêm as imagens concretas do hebraico. Os marcadores foram associados às expressões que efetivamente explicam.
