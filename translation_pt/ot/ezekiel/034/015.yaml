id: EZK.34.15
reference: Ezekiel 34:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִ֨י אֶרְעֶ֤ה צֹאנִ/י֙ וַ/אֲנִ֣י אַרְבִּיצֵ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
translation:
  language: pt
  text: Eu mesmo apascentarei o meu rebanho e eu mesmo o farei repousar — declaração do Senhor Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome independente, repetido nas duas orações, acrescenta ênfase; “eu mesmo” preserva a autoafirmação divina em português natural.
- source_word: אֶרְעֶה
  choice: apascentarei
  rationale: O verbo רעה abrange a ação do pastor de cuidar, conduzir e alimentar; “apascentarei” mantém a imagem pastoral sem reduzi-la apenas à alimentação.
- source_word: צֹאנִי
  choice: o meu rebanho
  rationale: צֹאן é um nome coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” expressa naturalmente esse sentido coletivo no contexto.
- source_word: וַאֲנִי
  choice: e eu mesmo
  rationale: A repetição explícita do pronome enfático foi mantida para reproduzir o paralelismo e a ênfase do hebraico.
- source_word: אַרְבִּיצֵם
  choice: o farei repousar
  rationale: O hifil de רבץ significa fazer o rebanho deitar-se ou acomodar-se. O singular coletivo “o” concorda com “rebanho”, e “repousar” comunica a imagem de descanso seguro sem apagar a causatividade.
- source_word: נְאֻם
  choice: declaração de
  rationale: Fórmula profética que apresenta o pronunciamento como palavra autorizada; “declaração de” é digna, clara e próxima da construção nominal hebraica.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: “Senhor” representa אֲדֹנָי, enquanto “Yahweh” representa diretamente o nome divino יהוה, evitando a repetição artificial “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus; Soberano SENHOR
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e preserva a ocorrência explícita do nome divino, sem inserir uma interpretação denominacional.
- issue: Agência divina enfática
  choice: Eu mesmo ... eu mesmo
  alternative: Eu ... eu
  rationale: A repetição mantém a ênfase do texto na ação pessoal de Deus, sem ampliá-la para “eu somente”, ideia que não está expressa lexicalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Apascentarei” conserva a metáfora central e é familiar no registro bíblico sem ser obscuro. A pontuação com travessão destaca naturalmente a fórmula profética final.
