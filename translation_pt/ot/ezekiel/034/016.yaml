  text: אֶת הָ/אֹבֶ֤דֶת אֲבַקֵּשׁ֙ וְ/אֶת הַ/נִּדַּ֣חַת אָשִׁ֔יב וְ/לַ/נִּשְׁבֶּ֣רֶת אֶחֱבֹ֔שׁ וְ/אֶת הַ/חוֹלָ֖ה אֲחַזֵּ֑ק וְ/אֶת הַ/שְּׁמֵנָ֧ה וְ/אֶת הַ/חֲזָקָ֛ה אַשְׁמִ֖יד אֶרְעֶ֥/נָּה בְ/מִשְׁפָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/016.yaml
  text: I will seek the lost[a], and I will bring back the strayed, and I will bind up the injured, and I will strengthen the sick; but the fat and the strong I will destroy. I will shepherd them with justice.
translation:
  language: pt
  text: Buscarei a perdida, trarei de volta a desgarrada, enfaixarei a ferida e fortalecerei a doente; mas destruirei a gorda e a forte. Eu as pastorearei com justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu as alimentarei com justiça” ou “Eu as apascentarei com justiça”. O verbo hebraico pode significar alimentar, apascentar ou pastorear.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹבֶדֶת
  choice: a perdida
  rationale: O particípio feminino singular refere-se à ovelha e funciona representativamente; “a perdida” preserva com naturalidade a imagem pastoral.
- source_word: אֲבַקֵּשׁ
  choice: buscarei
  rationale: בקש significa buscar ou procurar; “buscarei” é conciso e adequado à ação do pastor.
- source_word: הַנִּדַּחַת
  choice: a desgarrada
  rationale: נדח pode indicar quem foi afastado ou disperso; no contexto do rebanho, “desgarrada” exprime naturalmente a ovelha que se afastou, sem apagar por completo a ideia de deslocamento.
- source_word: אָשִׁיב
  choice: trarei de volta
  rationale: 'O hifil de שוב é causativo: fazer voltar, trazer de volta. A formulação se ajusta à recuperação da ovelha.'
- source_word: לַנִּשְׁבֶּרֶת
  choice: a ferida
  rationale: Embora שבר signifique literalmente “quebrar”, aqui descreve uma ovelha lesionada; “ferida” combina de modo idiomático com o ato de enfaixar.
- source_word: אֶחֱבֹשׁ
  choice: enfaixarei
  rationale: חבש, neste contexto, é tratar uma lesão envolvendo-a com uma faixa; “enfaixarei” é concreto e corrente.
- source_word: הַחוֹלָה
  choice: a doente
  rationale: חלה designa estar doente ou enfermo. “A doente” mantém a distinção em relação à ferida e à forte.
- source_word: אֲחַזֵּק
  choice: fortalecerei
  rationale: O piel de חזק significa fortalecer ou tornar forte, preservando o contraste restaurador do verso.
- source_word: הַשְּׁמֵנָה
  choice: a gorda
  rationale: A tradução literal conserva a imagem incisiva das ovelhas privilegiadas e bem alimentadas no contexto da denúncia de Ezequiel 34.
- source_word: הַחֲזָקָה
  choice: a forte
  rationale: O adjetivo significa “forte”; a escolha mantém o paralelismo com “a gorda” e o contraste com as ovelhas vulneráveis.
- source_word: אַשְׁמִיד
  choice: destruirei
  rationale: O hifil de שמד exprime destruição ou eliminação; “destruirei” mantém a força do juízo sem amplificação.
- source_word: אֶרְעֶנָּה
  choice: eu as pastorearei
  rationale: רעה pode significar alimentar, apascentar ou pastorear. “Pastorearei” abrange cuidado, direção e governo e se harmoniza com a metáfora dominante do capítulo.
- source_word: בְמִשְׁפָּט
  choice: com justiça
  rationale: משפט pode denotar justiça, juízo ou julgamento. “Com justiça” expressa a maneira justa de Deus conduzir o rebanho e preserva sua dimensão judicial.
theological_decisions:
- issue: Como traduzir a cláusula final que une cuidado pastoral e juízo
  choice: “Eu as pastorearei com justiça”
  alternative: “Eu as alimentarei em juízo” ou “Eu as apascentarei com justiça”
  rationale: 'A redação conserva a tensão do hebraico: Deus restaura as vulneráveis e julga as fortes e opressoras, exercendo sobre todo o rebanho um pastoreio justo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a metáfora das ovelhas no feminino singular coletivo e empregam-se futuros sintéticos para reproduzir a sequência enfática das ações divinas.
