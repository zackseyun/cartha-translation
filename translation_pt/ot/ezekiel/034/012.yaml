  text: כְּ/בַקָּרַת֩ רֹעֶ֨ה עֶדְר֜/וֹ בְּ/יוֹם הֱיוֹת֤/וֹ בְ/תוֹךְ צֹאנ/וֹ֙ נִפְרָשׁ֔וֹת כֵּ֖ן אֲבַקֵּ֣ר אֶת צֹאנִ֑/י וְ/הִצַּלְתִּ֣י אֶתְ/הֶ֗ם מִ/כָּל הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נָפֹ֣צוּ שָׁ֔ם בְּ/י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/012.yaml
  text: As a shepherd seeks out his flock on the day he is among his sheep when they have been scattered[a], so I will seek out my sheep[b], and I will rescue them from all the places where they were scattered on a day of clouds and thick darkness.
translation:
  language: pt
  text: Como um pastor procura seu rebanho no dia em que se encontra no meio de suas ovelhas dispersas, assim eu procurarei as minhas ovelhas[a] e as livrarei de todos os lugares onde foram espalhadas, num dia de nuvens e escuridão densa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido por “procura” e “procurarei” também pode transmitir a ideia de examinar atentamente ou cuidar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבַקָּרַת ... כֵּן אֲבַקֵּר
  choice: Como um pastor procura ... assim eu procurarei
  rationale: A repetição da raiz בקר estrutura a comparação entre o pastor e a ação divina. “Procurar” expressa bem, neste contexto de ovelhas dispersas, a busca atenta, sem eliminar totalmente o sentido mais amplo de examinar ou cuidar, registrado em nota.
- source_word: רֹעֶה עֶדְרוֹ
  choice: um pastor procura seu rebanho
  rationale: “Pastor” e “rebanho” mantêm a imagem pastoril de modo natural e claro em português.
- source_word: בְּיוֹם הֱיוֹתוֹ בְתוֹךְ צֹאנוֹ נִפְרָשׁוֹת
  choice: no dia em que se encontra no meio de suas ovelhas dispersas
  rationale: Preserva a construção temporal, a presença do pastor entre as ovelhas e o estado disperso delas, com sintaxe corrente em português.
- source_word: צֹאנִי
  choice: as minhas ovelhas
  rationale: Mantém a referência concreta aos animais e a força pessoal da metáfora divina.
- source_word: וְהִצַּלְתִּי אֶתְהֶם
  choice: e as livrarei
  rationale: O Hifil de נצל indica retirar do perigo ou resgatar. “Livrarei” é natural, digno e adequado ao contexto de recuperação do rebanho.
- source_word: מִכָּל הַמְּקוֹמֹת אֲשֶׁר נָפֹצוּ שָׁם
  choice: de todos os lugares para onde foram espalhadas
  rationale: A formulação preserva a totalidade dos lugares e expressa naturalmente o movimento implícito na dispersão.
- source_word: בְּיוֹם עָנָן וַעֲרָפֶל
  choice: num dia de nuvens e escuridão densa
  rationale: “Nuvens” comunica idiomaticamente עָנָן neste quadro, e “escuridão densa” conserva a intensidade de עֲרָפֶל sem suavizá-la para mera tristeza ou penumbra.
theological_decisions:
- issue: Imagem de Deus como pastor
  choice: Manter Deus como aquele que pessoalmente procura e livra suas ovelhas.
  alternative: Inserir na redação uma identificação messiânica ou cristológica explícita.
  rationale: O versículo apresenta a ação do próprio Deus por meio da imagem do pastor. A tradução conserva essa afirmação em seu contexto imediato e não incorpora ao texto uma interpretação canônica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “procura/procurarei” reproduz deliberadamente a repetição da mesma raiz hebraica. A ordem final mantém a possível ligação de “num dia de nuvens e escuridão densa” com o momento em que as ovelhas foram espalhadas.
