base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/018.yaml
  text: Is it too little for you to graze on the good pasture[a], that you must trample the rest of your pastures with your feet, and to drink clear water[b], that you must muddy what remains with your feet?
translation:
  language: pt
  text: É pouco para vocês pastarem no bom pasto e ainda pisotearem com os pés o restante de seus pastos? E é pouco beberem água límpida[a] e ainda turvarem com os pés a água restante[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água assentada”, isto é, água deixada em repouso e, por isso, límpida.
    reason: lexical_alternative
  - marker: b
    text: Ou “sujarem” ou “agitarem” a água restante; o verbo hebraico se refere a torná-la turva com os pés.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: É pouco para vocês
  rationale: Preserva a forma da pergunta retórica e seu tom de repreensão, em português corrente e claro.
- source_word: הַמִּרְעֶה הַטּוֹב
  choice: o bom pasto
  rationale: Mantém de modo natural a imagem pastoril de מִרְעֶה como lugar de pastagem.
- source_word: תִּרְעוּ
  choice: pastarem
  rationale: Expressa o ato dos animais se alimentarem no pasto e conserva a metáfora do rebanho.
- source_word: וְיֶתֶר מִרְעֵיכֶם
  choice: o restante de seus pastos
  rationale: Representa יֶתֶר como aquilo que resta e conserva o plural hebraico de מִרְעֵיכֶם.
- source_word: תִּרְמְסוּ בְּרַגְלֵיכֶם
  choice: pisoteiem com os pés
  rationale: Traduz diretamente o verbo רמס e retém a menção explícita aos pés, importante na repetição acusatória do versículo.
- source_word: וּמִשְׁקַע מַיִם
  choice: água límpida
  rationale: Comunica o sentido contextual de água assentada, deixada em repouso e, por isso, clara.
- source_word: הַנּוֹתָרִים
  choice: a que resta
  rationale: O referente é a água mencionada anteriormente; a formulação feminina singular é idiomática em português sem apagar a ideia de remanescente.
- source_word: תִּרְפֹּשׂוּן
  choice: turvem
  rationale: O verbo descreve tornar a água turva ao agitá-la com os pés; “turvar” é preciso, vívido e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição da pergunta foi explicitada para evitar uma coordenação ambígua em português, preservando o paralelismo, a força retórica da repreensão e a repetição de “com os pés” presente no hebraico.
