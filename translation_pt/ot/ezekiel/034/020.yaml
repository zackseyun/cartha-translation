base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/020.yaml
  text: 'Therefore thus says the Lord GOD to them: Behold[a], I myself will judge between the fat sheep and the lean sheep.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh a eles: “Eis que eu mesmo julgarei entre a ovelha gorda e a ovelha magra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre uma ovelha gorda e uma ovelha magra”. Os substantivos no singular provavelmente representam grupos dentro do rebanho.'
    reason: Esclarece o singular representativo da imagem hebraica sem substituí-lo no texto principal.
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz de modo claro e solene a consequência da denúncia anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional com linguagem natural e digna.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico, distinguindo אֲדֹנָי, “Senhor”, do nome divino יְהוִה, “Yahweh”.
- source_word: אֲלֵיהֶם
  choice: a eles
  rationale: A preposição introduz os destinatários da declaração divina; não é necessário antecipar aqui a ideia de juízo contra eles.
- source_word: הִנְנִי אָנִי
  choice: Eis que eu mesmo
  rationale: Conserva tanto a partícula de apresentação quanto a forte ênfase no próprio Deus como aquele que agirá.
- source_word: וְשָׁפַטְתִּי
  choice: julgarei
  rationale: Expressa adequadamente a ação judicial de avaliar e decidir entre os dois grupos do rebanho.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e ...
  rationale: É a forma idiomática portuguesa de reproduzir a estrutura contrastiva hebraica.
- source_word: שֶׂה בִרְיָה
  choice: a ovelha gorda
  rationale: Mantém o singular representativo e a imagem concreta de um animal robusto ou bem alimentado.
- source_word: שֶׂה רָזָה
  choice: a ovelha magra
  rationale: Mantém o singular representativo e o contraste direto com a ovelha gorda.
theological_decisions:
- issue: Forma do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução explicita o nome próprio יְהוִה como “Yahweh” e preserva separadamente o título אֲדֹנָי, sem fundir os dois termos.
- issue: Natureza do julgamento entre as ovelhas
  choice: julgarei entre
  alternative: farei justiça entre
  rationale: “Julgarei” preserva a amplitude do verbo שׁפט e não determina antecipadamente se a ênfase recai em condenação, vindicação ou governo.
translation_notes:
  register: Português moderno, claro e solene, com fórmula profética tradicional. O singular representativo foi mantido no texto para refletir de perto o hebraico; a nota esclarece seu provável alcance coletivo.
