id: EZK.34.30
reference: Ezekiel 34:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֧י יְהוָ֛ה אֱלֹהֵי/הֶ֖ם אִתָּ֑/ם וְ/הֵ֗מָּה עַמִּ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/030.yaml
  text: And they will know that I[a], Yahweh their God, am with them, and that they, the house of Israel, are my people, declares the Lord GOD.
translation:
  language: pt
  text: E saberão que eu, Yahweh, seu Deus, estou com eles[a], e que eles, a casa de Israel, são o meu povo, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou no meio deles”.'
    reason: Alternativa lexical e contextual possível para אִתָּם.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E saberão
  rationale: O perfeito com waw em discurso profético tem aqui força futura e resultativa; a formulação é natural e mantém a ligação com o contexto.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Israel saberá, não uma oração causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Equivalente idiomático em português para o construto com sufixo pronominal; 'seu' retoma coletivamente a casa de Israel.
- source_word: אִתָּם
  choice: estou com eles
  rationale: Reflete diretamente a preposição de companhia/presença e preserva a linguagem da presença da aliança.
- source_word: וְהֵמָּה
  choice: e que eles
  rationale: Mantém o pronome explícito e sua ênfase no segundo elemento da fórmula da aliança.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Expressão direta e natural que preserva a fórmula da aliança.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Conserva a expressão profética coletiva e sua nuance de identidade corporativa e pactual.
- source_word: נְאֻם
  choice: declara
  rationale: Reproduz de modo claro e solene a fórmula profética.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa ambos os elementos do hebraico: o título אֲדֹנָי e o nome divino יְהוָה, sem substituir o nome por ''SENHOR''.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome da aliança presente no texto hebraico e o distingue do título אֲדֹנָי.
- issue: Linguagem de presença da aliança em אִתָּם
  choice: estou com eles
  alternative: estou no meio deles
  rationale: A opção principal segue mais diretamente o hebraico e mantém aberta a amplitude da presença divina; a alternativa contextual legítima é registrada em nota.
- issue: Fórmula אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Yahweh; o Senhor DEUS
  rationale: A tradução conserva tanto o título quanto o nome pessoal, evitando apagar a ocorrência do Tetragrama ou impor uma interpretação adicional de אֲדֹנָי.
translation_notes:
  register: 'Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem da frase foi mantida próxima ao hebraico para realçar a fórmula recíproca da aliança: Yahweh está com Israel, e Israel é seu povo.'
