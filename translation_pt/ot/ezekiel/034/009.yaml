  text: לָ/כֵן֙ הָֽ/רֹעִ֔ים שִׁמְע֖וּ דְּבַר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/009.yaml
  text: 'Therefore, shepherds, hear the word of Yahweh:'
translation:
  language: pt
  text: 'Portanto, pastores, ouçam a palavra de Yahweh:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz a consequência da acusação anterior e preserva de modo natural a conexão lógica do hebraico.
- source_word: הָרֹעִים
  choice: pastores
  rationale: Mantém a metáfora central de Ezequiel 34 para os dirigentes de Israel, sem reduzi-la a uma interpretação como “líderes” nem lhe dar sentido eclesiástico específico.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: Imperativo plural que conserva a convocação profética solene, em português atual e amplamente compreensível.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, “a palavra” é uma tradução transparente e solene; “mensagem” seria possível, mas menos próxima da forma hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Se הָרֹעִים deve ser interpretado como dirigentes ou manter a metáfora
  choice: pastores
  alternative: líderes; governantes
  rationale: A imagem dos pastores estrutura todo o capítulo e possui importância retórica e teológica; mantê-la evita inserir a interpretação no texto principal.
translation_notes:
  register: Português moderno, digno e de leitura natural, com imperativo plural na forma brasileira amplamente inteligível. A ordem vocativa reproduz a concisão e a força da convocação profética.
