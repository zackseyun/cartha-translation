source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י אֶֽל הָ/רֹעִ֜ים וְֽ/דָרַשְׁתִּ֧י אֶת צֹאנִ֣/י מִ/יָּדָ֗/ם וְ/הִשְׁבַּתִּי/ם֙ מֵ/רְע֣וֹת צֹ֔אן וְ/לֹא יִרְע֥וּ ע֛וֹד הָ/רֹעִ֖ים אוֹתָ֑/ם וְ/הִצַּלְתִּ֤י צֹאנִ/י֙ מִ/פִּי/הֶ֔ם וְ/לֹֽא תִהְיֶ֥יןָ לָ/הֶ֖ם לְ/אָכְלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/010.yaml
  text: 'Thus says the Lord GOD: Behold[a], I am against the shepherds, and I will require my flock from their hand, and I will stop them from shepherding the flock. The shepherds will no longer shepherd them, and I will rescue my flock from their mouth[c][b], and it will no longer be food for them.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Eis que estou contra os pastores. Exigirei o meu rebanho das mãos deles[a][b] e os impedirei de apascentar o rebanho. Os pastores já não o apascentarão. Livrarei o meu rebanho da boca deles[c], e ele já não lhes servirá de alimento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “das mãos deles”, expressão que comunica tanto responsabilização quanto retomada daquilo que estava sob os cuidados deles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pedirei contas a eles pelo meu rebanho” ou “exigirei deles o meu rebanho”.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “da boca deles”, preservando a imagem dos pastores como devoradores, em vez de protetores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém os dois elementos do título composto e representa diretamente o nome divino יהוה como “Yahweh”, em português claro e solene.
- source_word: הִנְנִי אֶל
  choice: Eis que estou contra
  rationale: Preserva a força enfática da fórmula profética e expressa corretamente a postura de oposição divina.
- source_word: הָרֹעִים
  choice: os pastores
  rationale: Conserva a metáfora central do capítulo, sem substituí-la interpretativamente por “líderes” ou “governantes”.
- source_word: וְדָרַשְׁתִּי אֶת־צֹאנִי מִיָּדָם
  choice: Exigirei de suas mãos o meu rebanho
  rationale: Retém tanto a ideia de Deus reclamar seu rebanho quanto a linguagem judicial de responsabilização, preservando também a imagem hebraica das “mãos”.
- source_word: וְהִשְׁבַּתִּים מֵרְעוֹת צֹאן
  choice: os impedirei de continuar apascentando o rebanho
  rationale: Expressa o sentido causativo de fazer cessar e usa “apascentar” para abranger o cuidado próprio do pastor.
- source_word: וְלֹא יִרְעוּ עוֹד הָרֹעִים אוֹתָם
  choice: Os pastores já não o apascentarão
  rationale: Conserva a repetição temática da raiz רעה; o pronome singular em português retoma naturalmente “o rebanho”, coletivo no hebraico.
- source_word: וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם
  choice: Livrarei o meu rebanho da boca deles
  rationale: Mantém a imagem deliberadamente predatória dos pastores que devoram aquilo que deveriam proteger.
- source_word: וְלֹא תִהְיֶיןָ לָהֶם לְאָכְלָה
  choice: ele já não lhes servirá de alimento
  rationale: O singular “ele” concorda com “o meu rebanho” como coletivo e preserva a imagem de alimento ligada à boca dos pastores.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “Yahweh” torna visível o nome pessoal presente no texto hebraico, enquanto “Senhor” representa אֲדֹנָי; evita-se a duplicação “Senhor SENHOR”.
- issue: Responsabilização e retomada do rebanho em דָּרַשׁ ... מִיַּד
  choice: Exigirei de suas mãos o meu rebanho
  alternative: Pedirei contas a eles pelo meu rebanho
  rationale: A formulação escolhida conserva juntas a responsabilização dos pastores e a retomada do rebanho, sem reduzir a expressão a apenas uma dessas dimensões.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A metáfora pastoril e a imagem forte de devoração foram mantidas; a sintaxe foi naturalizada apenas onde isso não apagaria a ambiguidade judicial e possessiva do hebraico.
