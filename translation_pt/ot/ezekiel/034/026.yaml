  yaml_path: translation/ot/ezekiel/034/026.yaml
  text: And I will make them and the places around my hill a blessing[a], and I will send down the rain in its season; they will be showers of blessing.
translation:
  language: pt
  text: Farei deles e dos lugares ao redor do meu monte uma bênção[a]. Farei a chuva cair no tempo certo; serão chuvas de bênção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deles e dos arredores do meu monte”. O hebraico diz literalmente “arredores”; “lugares” torna explícita a referência espacial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Farei
  rationale: 'Neste contexto, נתן tem sentido resultativo: Deus fará deles e dos lugares ao redor do monte uma bênção.'
- source_word: אוֹתָם וּסְבִיבוֹת גִּבְעָתִי
  choice: deles e dos lugares ao redor do meu monte
  rationale: A expressão preserva tanto o pronome referente ao povo quanto a dimensão espacial de סְבִיבוֹת, sem identificar explicitamente o monte.
- source_word: בְּרָכָה
  choice: uma bênção
  rationale: O singular funciona como predicativo e é mantido de forma natural em português.
- source_word: וְהוֹרַדְתִּי
  choice: Farei ... cair
  rationale: O hifil de ירד expressa causação; esta formulação é idiomática para chuva e mantém a ação divina.
- source_word: הַגֶּשֶׁם בְּעִתּוֹ
  choice: a chuva ... no tempo certo
  rationale: בְּעִתּוֹ indica o tempo apropriado ou determinado; 'no tempo certo' comunica isso naturalmente.
- source_word: גִּשְׁמֵי בְרָכָה
  choice: chuvas de bênção
  rationale: Mantém o plural e a ligação lexical explícita com בְּרָכָה, sem transformar a expressão em mera abundância.
- source_word: יִהְיוּ
  choice: serão
  rationale: Conserva a predicação explícita da oração hebraica e sua concordância plural.
theological_decisions:
- issue: Referente de 'meu monte'
  choice: Manter 'meu monte' sem especificar sua identidade no texto principal.
  alternative: Identificá-lo como Sião, Jerusalém ou o lugar elevado do santuário restaurado.
  rationale: Embora o contexto provavelmente evoque Sião e o santuário, o hebraico diz apenas 'meu monte'; a tradução preserva essa abertura sem impor uma identificação teológica mais específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para o português brasileiro. A repetição de 'bênção' e a expressão literal 'meu monte' foram preservadas. A divisão em duas frases favorece a clareza sem alterar a progressão do hebraico.
