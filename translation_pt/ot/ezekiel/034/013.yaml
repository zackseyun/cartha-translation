base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/013.yaml
  text: And I will bring them out from the peoples[a], and gather them from the lands, and bring them into their own land; and I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land.
translation:
  language: pt
  text: Eu os tirarei do meio dos povos, eu os reunirei dentre as terras e os levarei para a sua própria terra. Eu os apascentarei nos montes de Israel, junto aos cursos de água[a] e em todos os lugares habitados da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos leitos dos rios”, “nas ravinas” ou “nos canais”. O termo hebraico pode designar leitos de correntes, canais ou ravinas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִים
  choice: Eu os tirarei
  rationale: 'O hifil de יצא expressa ação causativa: Deus fará com que saiam do meio dos povos. “Tirarei” é natural em português e conserva a possível ressonância do êxodo.'
- source_word: מִן הָעַמִּים
  choice: do meio dos povos
  rationale: עמים é plural e designa povos ou nações. “Povos” preserva o sentido étnico plural e evita repetir a ideia territorial expressa em seguida por “terras”.
- source_word: וְקִבַּצְתִּים
  choice: reunirei
  rationale: קבץ é o verbo habitual para reunir pessoas dispersas. “Reunirei” comunica com clareza a restauração do rebanho espalhado.
- source_word: מִן הָאֲרָצוֹת
  choice: dentre as terras
  rationale: O plural de ארץ refere-se aos diversos territórios de onde o povo será reunido. “Terras” mantém a forma plural e o paralelismo com “povos”.
- source_word: וַהֲבִיאֹתִים אֶל אַדְמָתָם
  choice: e os levarei para a sua própria terra
  rationale: O hifil de בוא significa fazer entrar ou levar a algum lugar; אדמתם é “terra deles”. “Sua própria terra” torna natural e explícita a força possessiva sem acrescentar uma interpretação doutrinária.
- source_word: וּרְעִיתִים
  choice: Eu os apascentarei
  rationale: רעה pode significar pastorear, alimentar ou levar ao pasto. “Apascentarei” preserva tanto a metáfora do pastor quanto a imagem concreta de alimentação do rebanho.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: nos montes de Israel
  rationale: Depois de רעה, אֶל indica a área em que o rebanho será apascentado. “Nos montes” é a formulação idiomática em português.
- source_word: בָּאֲפִיקִים
  choice: junto aos cursos de água
  rationale: אפיקים pode designar canais, leitos de corrente, ribeiros ou ravinas. No contexto pastoril, “cursos de água” comunica naturalmente a presença de canais ou correntes, enquanto a nota preserva a amplitude topográfica.
- source_word: וּבְכֹל מוֹשְׁבֵי הָאָרֶץ
  choice: e em todos os lugares habitados da terra
  rationale: מושבי הארץ refere-se aos lugares de habitação ou assentamentos existentes na terra. “Lugares habitados” é claro, abrangente e não restringe o sentido a cidades ou povoados formais.
theological_decisions:
- issue: Linguagem de restauração e força possessiva de אַדְמָתָם
  choice: sua própria terra
  alternative: sua terra
  rationale: O sufixo possessivo indica a terra pertencente a eles. “Sua própria terra” realça o retorno à terra natal no contexto imediato, sem importar afirmações teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos atos divinos foi mantida, mas a sequência verbal foi ajustada ao fluxo natural do português. O marcador da nota foi colocado junto a “cursos de água”, termo ao qual a alternativa lexical se refere.
