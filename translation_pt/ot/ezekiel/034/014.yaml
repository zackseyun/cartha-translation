    issue: «o lugar onde pastarão» não corresponde diretamente a נְוֵהֶם.
    rationale: נְוֵהֶם é um substantivo com sufixo possessivo, «o lugar de pastagem/repouso delas» ou «a morada delas», e não uma oração relativa. A redação atual introduz antecipadamente a ação expressa apenas mais adiante por תִּרְעֶינָה.
  - severity: low
