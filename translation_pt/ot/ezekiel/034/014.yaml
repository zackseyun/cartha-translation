revisions:
- from: Eu as apascentarei em boas pastagens, e nos altos montes de Israel ficará o lugar onde pastarão[a]. Ali elas se deitarão em um bom lugar de pastagem e pastarão em pastos férteis[b], nos montes de Israel.
  to: Eu as apascentarei em boas pastagens, e nos altos montes de Israel será o lugar de pastagem delas[a]. Ali elas se deitarão em um bom lugar de pastagem e pastarão em pastagem fértil[b], nos montes de Israel.
  rationale: A revisão restitui a forma nominal de נְוֵהֶם e preserva sua ambiguidade lexical por meio da nota, sem introduzir uma ação que o hebraico só expressa na cláusula final. Também ajusta as âncoras e torna a nota sobre שָׁמֵן mais literalmente precisa, mantendo português moderno e a imagem concreta do rebanho.
