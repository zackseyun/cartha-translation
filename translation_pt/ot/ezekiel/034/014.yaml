base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/014.yaml
  text: In good pasture I will pasture them[a], and on the high mountains of Israel their grazing place will be. There they will lie down in a good grazing place[b], and they will feed in rich pasture on the mountains of Israel.
translation:
  language: pt
  text: Eu as apascentarei em boas pastagens, e nos altos montes de Israel será o lugar de pastagem delas[a]. Ali elas se deitarão em um bom lugar de pastagem e pastarão em pastagem fértil[b], nos montes de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a morada delas”. O substantivo hebraico pode indicar uma morada ou habitação, bem como um lugar de pastagem.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pastagem gorda”, isto é, rica, abundante ou fértil.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִרְעֶה טּוֹב
  choice: em boas pastagens
  rationale: Expressa de modo natural a ideia de terreno bom para alimentar o rebanho, preservando a imagem pastoril.
- source_word: אֶרְעֶה אֹתָם
  choice: eu as apascentarei
  rationale: Mantém a ação concreta do pastor em relação às ovelhas; o pronome feminino concorda naturalmente com o referente contextual em português.
- source_word: הָרֵי מְרוֹם יִשְׂרָאֵל
  choice: os altos montes de Israel
  rationale: Preserva a ênfase de מְרוֹם na altura ou elevação, com formulação corrente e digna.
- source_word: נְוֵהֶם
  choice: o lugar onde pastarão
  rationale: No contexto do rebanho, comunica o sentido de lugar de pastagem, sem eliminar em nota a possibilidade lexical de morada ou habitação.
- source_word: תִּרְבַּצְנָה
  choice: elas se deitarão
  rationale: Conserva a imagem concreta de animais que se deitam, em vez de substituí-la pela ideia abstrata de descanso.
- source_word: בְּנָוֶה טּוֹב
  choice: em um bom lugar de pastagem
  rationale: Mantém a ligação lexical com נָוֶה e a ambientação pastoril, em português claro.
- source_word: מִרְעֶה שָׁמֵן
  choice: pastos férteis
  rationale: שָׁמֵן significa literalmente 'gordo', mas aplicado ao pasto indica abundância e riqueza; 'férteis' transmite isso naturalmente.
- source_word: תִּרְעֶינָה
  choice: pastarão
  rationale: Como o rebanho é o sujeito, 'pastar' expressa diretamente a ação das ovelhas.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: nos montes de Israel
  rationale: Neste contexto, אֶל tem valor locativo ligado à atividade de pastar; 'nos' é a forma idiomática em português.
theological_decisions:
- issue: Imagem pastoril do cuidado de Deus
  choice: Conservar as ações concretas de apascentar, deitar-se e pastar.
  alternative: Parafrasear como cuidar, dar segurança e sustentar.
  rationale: A imagem do pastor estrutura o oráculo; mantê-la evita substituir a metáfora textual por uma explicação teológica.
- issue: Amplitude semântica de נָוֶה
  choice: Adotar no texto o sentido pastoril de lugar de pastagem e registrar a alternativa em nota.
  alternative: Traduzir diretamente como morada ou habitação.
  rationale: O contexto favorece a referência ao lugar em que o rebanho pasta e repousa, mas o substantivo também pode indicar morada; a nota preserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição pastoril do hebraico foi preservada sem tornar a frase excessivamente rígida.
