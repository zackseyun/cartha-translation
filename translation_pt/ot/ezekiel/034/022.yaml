  yaml_path: translation/ot/ezekiel/034/022.yaml
  text: I will save my flock[a], and they will no longer be prey[b], and I will judge between sheep and sheep.
translation:
  language: pt
  text: Salvarei o meu rebanho, e ele não será mais presa[a]; julgarei entre uma ovelha e outra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele não será mais objeto de saque” ou “ele não será mais despojo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “entre ovelha e ovelha”, isto é, entre os integrantes do próprio rebanho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Salvarei
  rationale: O hifil de ישׁע expressa a ação de Deus ao livrar o rebanho do perigo e da opressão. “Salvarei” é claro e natural, preservando tanto o sentido concreto de resgate quanto o peso teológico do verbo.
- source_word: לְצֹאנִי
  choice: o meu rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. No contexto da metáfora pastoril, “rebanho” é a forma coletiva mais natural em português, e o sufixo de primeira pessoa é preservado por “meu”.
- source_word: וְלֹא תִהְיֶינָה עוֹד לָבַז
  choice: e ele não será mais presa
  rationale: A expressão indica literalmente que os animais não mais estarão destinados ao saque ou despojo. “Não será mais presa” comunica com naturalidade sua vulnerabilidade à exploração, mantendo a imagem pastoril. O singular “ele” concorda em português com o coletivo “rebanho”.
- source_word: וְשָׁפַטְתִּי
  choice: julgarei
  rationale: שׁפט descreve aqui a ação judicial de Deus ao decidir e fazer distinção entre integrantes do rebanho. “Julgarei” conserva a força jurídica e moral do original.
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: entre uma ovelha e outra
  rationale: A construção hebraica distributiva significa literalmente “entre ovelha e ovelha”. A formulação escolhida transmite esse sentido de maneira corrente em português e deixa claro que o julgamento ocorre entre indivíduos do próprio rebanho.
theological_decisions:
- issue: A linguagem de livramento divino dentro da metáfora do pastor
  choice: Salvarei o meu rebanho
  alternative: Resgatarei o meu rebanho; livrarei o meu rebanho
  rationale: O próprio Deus é apresentado como agente direto da salvação de seu povo. “Salvarei” preserva o sentido imediato de livramento e a ressonância teológica mais ampla sem introduzir especificações doutrinárias que não estejam expressas no versículo.
- issue: A natureza do julgamento de Deus dentro do rebanho
  choice: julgarei entre uma ovelha e outra
  alternative: julgarei entre ovelha e ovelha
  rationale: O texto fala não apenas de proteção contra ameaças externas, mas também de julgamento no interior da comunidade. A tradução mantém a tensão entre Deus salvar o rebanho coletivamente e julgar seus integrantes individualmente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O coletivo “rebanho” pede concordância no singular em português. A expressão distributiva hebraica foi vertida idiomaticamente no texto principal, enquanto sua forma literal foi preservada em nota.
