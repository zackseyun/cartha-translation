  text: יִשְׁגּ֤וּ צֹאנִ/י֙ בְּ/כָל הֶ֣/הָרִ֔ים וְ/עַ֖ל כָּל גִּבְעָ֣ה רָמָ֑ה וְ/עַ֨ל כָּל פְּנֵ֤י הָ/אָ֨רֶץ֙ נָפֹ֣צוּ צֹאנִ֔/י וְ/אֵ֥ין דּוֹרֵ֖שׁ וְ/אֵ֥ין מְבַקֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/006.yaml
  text: My sheep wandered on all the mountains and on every high hill[a]; my sheep were scattered over the whole face of the earth[b], with no one searching or seeking for them.
translation:
  language: pt
  text: Minhas ovelhas vagueavam por todos os montes e por todas as colinas altas[a]; minhas ovelhas foram espalhadas por toda a face da terra[b], e não havia quem as procurasse nem quem fosse buscá-las.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “andavam desgarradas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “toda a face da terra”. A palavra traduzida como “terra” também pode significar “país” ou “território”, conforme o alcance pretendido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  choice: vagueavam
  rationale: O verbo שׁגה descreve desviar-se ou andar sem rumo. “Vagueavam” é natural no contexto pastoril e mantém a possibilidade de estarem desgarradas sem explicá-la em excesso.
- source_word: צֹאנִי
  choice: minhas ovelhas
  rationale: Preserva a imagem pastoril concreta e a relação de pertença expressa pelo sufixo de primeira pessoa.
- source_word: בְּכָל הֶהָרִים
  choice: por todos os montes
  rationale: “Por” expressa de modo idiomático o movimento das ovelhas através da região montanhosa; “montes” é claro e digno em português bíblico atual.
- source_word: וְעַל כָּל גִּבְעָה רָמָה
  choice: e por toda colina alta
  rationale: Mantém os elementos “toda”, “colina” e “alta”, com construção portuguesa natural e paralela à frase anterior.
- source_word: וְעַל כָּל פְּנֵי הָאָרֶץ
  choice: por toda a face da terra
  rationale: Preserva o idioma hebraico “face da terra”, deixando em aberto se אֶרֶץ tem alcance mundial ou se designa a terra/região.
- source_word: נָפֹצוּ
  choice: foram espalhadas
  rationale: O nifal de פוץ indica dispersão sofrida pelas ovelhas; a forma passiva portuguesa conserva essa nuance.
- source_word: וְאֵין דּוֹרֵשׁ
  choice: e não havia quem as procurasse
  rationale: דּרשׁ aqui retrata a ausência de alguém que se ocupe de procurar as ovelhas perdidas. O objeto “as” é recuperado naturalmente do contexto.
- source_word: וְאֵין מְבַקֵּשׁ
  choice: nem quem fosse buscá-las
  rationale: Mantém o segundo verbo hebraico como ação distinta e próxima de “procurar”, evitando apagar o paralelismo enfático.
theological_decisions:
- issue: Referente de “minhas ovelhas”
  choice: Conservar sem explicitação a fala de Deus e a metáfora das ovelhas para o seu povo.
  alternative: Substituir ou explicar “ovelhas” como “Israel” ou “meu povo”.
  rationale: O contexto de Ezequiel 34 identifica o rebanho com o povo de Deus, mas o versículo formula isso metaforicamente; a tradução não deve resolver a imagem dentro do texto.
- issue: Alcance de הָאָרֶץ
  choice: “terra” no texto, com nota registrando também “país”.
  alternative: Traduzir diretamente como “país” ou “território”.
  rationale: אֶרֶץ admite tanto “terra” em sentido amplo quanto “país/território”. A formulação conserva a amplitude e a nota evita excluir a leitura mais localizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “minhas ovelhas” e o par “procurasse/buscá-las” foram mantidos para refletir a ênfase e o paralelismo do hebraico.
