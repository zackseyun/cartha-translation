  text: And my flock must graze on what your feet have trampled[b][a], and drink what your feet have muddied.
translation:
  language: pt
  text: E o meu rebanho tem de pastar no que os pés de vocês pisotearam[a] e beber a água que os pés de vocês turvaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais de perto: «pastar do pisoteio dos pés de vocês e beber do revolvimento causado pelos pés de vocês».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצֹאנִי
  choice: E o meu rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanho” preserva de modo natural a imagem pastoril e o sufixo de primeira pessoa.
- source_word: מִרְמַס רַגְלֵיכֶם
  choice: no que os pés de vocês pisotearam
  rationale: מִרְמַס pode indicar aquilo que foi pisoteado ou o ato/lugar de pisotear. A formulação escolhida é idiomática em português e mantém a imagem da pastagem estragada.
- source_word: תִּרְעֶינָה
  choice: tem de pastar
  rationale: O imperfeito qal significa “pastará/pastam”, mas o contexto apresenta a situação imposta ao rebanho como consequência do abuso. “Tem de pastar” expressa essa força resultante sem perder o sentido pastoril de רעה.
- source_word: וּמִרְפַּשׂ רַגְלֵיכֶם
  choice: e beber o que os pés de vocês deixaram turvo
  rationale: מִרְפַּשׂ refere-se ao que foi revolvido, enlameado ou turvado pelos pés. Com “beber”, a referência à água fica implícita e a expressão comunica claramente sua contaminação.
- source_word: תִּשְׁתֶּינָה
  choice: e beber
  rationale: O imperfeito qal de שׁתה significa “beber”. O valor modal de “tem de” rege naturalmente os dois infinitivos coordenados em português.
