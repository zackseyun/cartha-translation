id: EZK.34.28
reference: Ezekiel 34:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹא יִהְי֨וּ ע֥וֹד בַּז֙ לַ/גּוֹיִ֔ם וְ/חַיַּ֥ת הָ/אָ֖רֶץ לֹ֣א תֹאכְלֵ֑/ם וְ/יָשְׁב֥וּ לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/028.yaml
  text: They will no longer be plunder for the nations[a], and the wild animals of the land will not devour them. They will dwell securely[c][b], with no one to make them afraid.
translation:
  language: pt
  text: Já não serão saque para as nações[a], e os animais selvagens da terra[b] não os devorarão. Viverão em segurança[c], sem que ninguém os aterrorize.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “presa para as nações”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as feras da terra”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Habitarão seguros, e ninguém os amedrontará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּז
  choice: saque
  rationale: O substantivo designa aquilo que é tomado à força como despojo. “Saque” mantém o sentido político de exploração pelas nações e evita fundir esta imagem com a dos animais predadores na oração seguinte.
- source_word: לַגּוֹיִם
  choice: para as nações
  rationale: גּוֹיִם refere-se aqui aos povos ou nações ao redor, sem o sentido técnico posterior de “gentios”. A preposição ל é representada naturalmente por “para” na expressão “saque para as nações”.
- source_word: חַיַּת הָאָרֶץ
  choice: os animais selvagens da terra
  rationale: A expressão construta indica animais ou feras que representam uma ameaça. A formulação escolhida é clara em português moderno e conserva a imagem concreta do texto.
- source_word: תֹאכְלֵם
  choice: não os devorarão
  rationale: Embora אכל tenha o sentido básico de “comer”, diante de animais predadores e vítimas humanas “devorar” comunica de modo natural a violência implícita.
- source_word: וְיָשְׁבוּ
  choice: Viverão
  rationale: ישׁב pode significar sentar-se, habitar ou viver. Aqui “viverão” expressa naturalmente a residência estável prometida, sem a solenidade menos corrente de “habitarão”.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: A expressão comunica uma condição de segurança e ausência de ameaça. “Em segurança” é clara, corrente e adequada ao contexto de restauração.
- source_word: וְאֵין מַחֲרִיד
  choice: sem que ninguém os aterrorize
  rationale: O particípio causativo de חרד indica alguém que provoca temor ou terror. A construção preserva o agente pessoal e apresenta com naturalidade a ausência contínua dessa ameaça.
- source_word: עוֹד
  choice: Já não
  rationale: Com a negação, עוֹד assinala o fim de uma situação anterior. “Já não” é uma formulação idiomática e direta em português.
theological_decisions:
- issue: Natureza da segurança prometida
  choice: Apresentar o versículo como promessa concreta de restauração e segurança, mantendo lado a lado a opressão das nações e a ameaça dos animais selvagens.
  alternative: Interpretar todas as ameaças como símbolos de inimigos políticos, ou restringir a promessa exclusivamente a um cumprimento escatológico específico.
  rationale: O hebraico expõe as duas ameaças diretamente e não determina neste versículo se devem ser entendidas apenas de modo literal, simbólico ou escatológico. A tradução preserva essa abertura interpretativa sem importar um sistema teológico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Viverão em segurança” evita arcaísmo desnecessário, enquanto “devorarão” e “aterrorize” preservam a força das imagens hebraicas. Todos os marcadores de nota aparecem no texto principal.
