base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/021.yaml
  text: Because you push with side and shoulder, and gore all the weak ones with your horns until you have scattered them outside,
translation:
  language: pt
  text: Visto que vocês empurram com o flanco e com o ombro, e dão chifradas em todas as fracas, até dispersá-las para fora,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצַד
  choice: com o flanco
  rationale: No contexto da metáfora do rebanho, צַד designa o lado ou flanco do animal; “flanco” preserva a imagem concreta.
- source_word: תֶּהְדֹּפוּ
  choice: empurram
  rationale: Expressa a ação contínua e agressiva de impelir as ovelhas mais fracas.
- source_word: הַנַּחְלוֹת
  choice: as fracas
  rationale: O particípio/adjetivo feminino plural refere-se às ovelhas debilitadas ou fracas, em contraste com as fortes.
- source_word: תְּנַגְּחוּ
  choice: dão chifradas
  rationale: Verbo denominativo ligado ao uso dos chifres para atacar; a formulação é natural e mantém a metáfora animal.
- source_word: אֶל־הַחוּצָה
  choice: para fora
  rationale: Mantém a direção espacial do hebraico e evita ampliar o sentido para “por toda parte” ou “ao estrangeiro”.
theological_decisions:
- issue: Identidade das ovelhas fracas
  choice: todas as fracas
  alternative: todas as debilitadas
  rationale: Preserva o referente feminino implícito dentro da alegoria do rebanho, sem inserir explicitamente “ovelhas” nem restringir a fraqueza a doença física.
translation_notes:
  register: Português moderno, claro e digno, com imagem pastoril concreta. A oração permanece sintaticamente aberta, como no versículo hebraico, pois sua consequência é apresentada no versículo seguinte.
