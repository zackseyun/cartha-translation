  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente vertido por «SENHOR».
    reason: Identifica o Tetragrama e registra a tradução tradicional por um título, enquanto o texto principal conserva «Yahweh».
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: O waw consecutivo com היה introduz a sequência narrativa; em português, a fórmula natural «a palavra... veio» comunica esse fluxo sem o literalismo pouco idiomático de «e aconteceu».
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר־יְהוָה, «a palavra» conserva a expressão recorrente e designa uma comunicação divina específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com o sufixo da primeira pessoa do singular.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Conserva a fórmula hebraica que introduz o discurso direto e prepara naturalmente o conteúdo do versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. «Yahweh» o representa por transliteração, enquanto «SENHOR» o substitui por um título e «Jeová» reflete uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à expressão idiomática portuguesa, e a fórmula profética foi preservada.
