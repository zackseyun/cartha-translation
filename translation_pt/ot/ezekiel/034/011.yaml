  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִי אָ֕נִי וְ/דָרַשְׁתִּ֥י אֶת צֹאנִ֖/י וּ/בִקַּרְתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/011.yaml
  text: 'For thus says the Lord GOD: Behold[a], I myself will search for my sheep and seek them out.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Eis que eu mesmo procurarei as minhas ovelhas e cuidarei delas[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irei em busca delas”, “as examinarei” ou “tomarei conta delas”. O verbo hebraico pode indicar tanto procurar atentamente as ovelhas quanto inspecioná-las ou cuidar pessoalmente delas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a repetição pouco natural “Senhor SENHOR” e mantendo distinto o nome da aliança.
- source_word: הִנְנִי אָנִי
  choice: Eis que eu mesmo
  rationale: “Eis que” mantém o tom profético de הִנְנִי, enquanto “eu mesmo” comunica a ênfase de אָנִי e destaca a intervenção pessoal de Deus.
- source_word: וְדָרַשְׁתִּי
  choice: procurarei
  rationale: No contexto pastoril, דרש indica procurar ativamente as ovelhas. “Procurarei” é natural em português e preserva a imagem de busca.
- source_word: צֹאנִי
  choice: as minhas ovelhas
  rationale: Embora צֹאן possa designar coletivamente um rebanho ou animais de pequeno porte, “as minhas ovelhas” concretiza a metáfora pastoril e combina naturalmente com os verbos da frase.
- source_word: וּבִקַּרְתִּים
  choice: e cuidarei delas
  rationale: O verbo בקר nesta forma pode expressar examinar, atender ou cuidar pessoalmente. “Cuidarei delas” distingue o segundo verbo de דרש e ressalta que a ação divina inclui mais do que simplesmente localizar as ovelhas.
theological_decisions:
- issue: Tradução do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução mantém explicitamente o nome divino Yahweh e também preserva o título אֲדֹנָי, sem reduzir os dois elementos a um único título.
- issue: Alcance da intervenção divina em הִנְנִי אָנִי
  choice: Eis que eu mesmo
  alternative: Aqui estou; eu mesmo
  rationale: A formulação conserva a ênfase na atuação pessoal de Deus sem acrescentar uma interpretação sobre a forma específica dessa intervenção.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A construção conserva o tom profético e a ênfase do hebraico, sem tornar a frase excessivamente arcaica.
