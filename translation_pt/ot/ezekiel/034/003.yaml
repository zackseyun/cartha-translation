  text: אֶת הַ/חֵ֤לֶב תֹּאכֵ֨לוּ֙ וְ/אֶת הַ/צֶּ֣מֶר תִּלְבָּ֔שׁוּ הַ/בְּרִיאָ֖ה תִּזְבָּ֑חוּ הַ/צֹּ֖אן לֹ֥א תִרְעֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/003.yaml
  text: You eat the fat[a], you clothe yourselves with the wool, you slaughter the fattened sheep[b], but you do not shepherd the flock.
translation:
  language: pt
  text: Vocês comem a gordura[a], vestem-se com a lã, abatem o animal bem-alimentado[b], mas não pastoreiam o rebanho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o leite»; algumas traduções seguem aqui uma interpretação contextual ou a leitura de versões antigas, mas a palavra hebraica normalmente significa «gordura».
    reason: lexical_alternative
  - marker: b
    text: Ou «o animal gordo» ou «o animal escolhido»; o hebraico provavelmente se refere a um animal bem-alimentado do rebanho.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: חֵלֶב normalmente designa gordura ou porção gordurosa. A tradução concreta preserva a imagem da exploração do rebanho; a alternativa contextual «leite» é registrada em nota.
- source_word: הַצֶּמֶר
  choice: a lã
  rationale: צֶמֶר significa lã; esta é a forma natural e direta em português.
- source_word: תִּלְבָּשׁוּ
  choice: vestem-se com
  rationale: לבש expressa vestir ou cobrir-se. A construção pronominal comunica com naturalidade que os pastores usam a lã em benefício próprio.
- source_word: הַבְּרִיאָה
  choice: os animais bem-alimentados
  rationale: O adjetivo substantivado בריא se refere ao animal gordo, saudável ou bem-nutrido. Embora a forma hebraica seja singular, seu emprego no contexto pode ter sentido coletivo; a formulação evita restringir o gado miúdo apenas a ovelhas.
- source_word: תִּזְבָּחוּ
  choice: abatem
  rationale: זבח pode indicar sacrificar ou abater. Aqui não há foco explícito no culto, mas na exploração promovida pelos maus pastores; «abatem» preserva esse sentido.
- source_word: הַצֹּאן
  choice: o rebanho
  rationale: צֹאן designa coletivamente o gado miúdo, sobretudo ovelhas e cabras. «Rebanho» é idiomático e sustenta a metáfora pastoral.
- source_word: תִרְעוּ
  choice: pastoreiam
  rationale: רעה abrange apascentar, cuidar e atuar como pastor. «Pastoreiam» mantém a metáfora central e não reduz a acusação apenas ao ato de alimentar.
theological_decisions:
- issue: Força metafórica da linguagem pastoral aplicada aos líderes de Israel
  choice: «não pastoreiam o rebanho»
  alternative: «não alimentam as ovelhas» ou «não cuidam do rebanho»
  rationale: A linguagem explícita de pastoreio mantém a coerência literária e teológica do capítulo sem especificar além do texto a identidade ou as funções dos líderes.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural «vocês» torna explícita a segunda pessoa masculina plural do hebraico. «Pastoreiam» foi mantido para preservar a metáfora dominante do capítulo.
