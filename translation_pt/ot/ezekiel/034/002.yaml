source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵ֖א עַל רוֹעֵ֣י יִשְׂרָאֵ֑ל הִנָּבֵ֣א וְ/אָמַרְתָּ֩ אֲלֵי/הֶ֨ם לָ/רֹעִ֜ים כֹּ֥ה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה ה֤וֹי רֹעֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֤ר הָיוּ֙ רֹעִ֣ים אוֹתָ֔/ם הֲ/ל֣וֹא הַ/צֹּ֔אן יִרְע֖וּ הָ/רֹעִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/002.yaml
  text: 'Son of man[a], prophesy against the shepherds of Israel; prophesy and say to them, to the shepherds[b], ‘Thus says the Lord GOD: Woe to the shepherds of Israel who have been shepherding themselves! Should not the shepherds shepherd the flock?’'
translation:
  language: pt
  text: 'Filho do homem, profetize contra os pastores de Israel. Profetize e diga-lhes, aos pastores: “Assim diz o Senhor Yahweh: Ai dos pastores de Israel que apascentam a si mesmos![a] Não deveriam os pastores apascentar o rebanho?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que alimentam a si mesmos”. O hebraico emprega aqui o mesmo verbo ligado ao trabalho do pastor usado ao longo do versículo; a ideia é que os dirigentes de Israel cuidavam de si, em vez de cuidar do rebanho.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “as ovelhas” ou “o gado miúdo”; “o rebanho” expressa aqui o sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a fórmula hebraica característica com que Ezequiel é interpelado, mantendo sua força vocativa e seu caráter humano sem substituí-la por uma interpretação.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: É o equivalente corrente do imperativo hebraico; a repetição do verbo foi mantida para conservar a ênfase do texto.
- source_word: עַל
  choice: contra
  rationale: O contexto de denúncia e o oráculo de condenação que se segue dão à preposição sentido adversativo, e não apenas temático.
- source_word: רוֹעֵי יִשְׂרָאֵל / לָרֹעִים / הָרֹעִים
  choice: os pastores de Israel / aos pastores / os pastores
  rationale: Mantém a metáfora pastoral desenvolvida no próprio versículo, em vez de explicá-la antecipadamente como “líderes”.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Traduz אֲדֹנָי por “Senhor” e preserva o nome da aliança, יהוה, como “Yahweh”, evitando apagar a distinção entre os dois elementos do título.
- source_word: הוֹי
  choice: Ai
  rationale: Introduz de modo natural em português um pronunciamento profético de denúncia e juízo.
- source_word: אֲשֶׁר הָיוּ רֹעִים אוֹתָם
  choice: que apascentam a si mesmos
  rationale: O pronome retoma reflexivamente os próprios pastores. “Apascentam” conserva a mesma imagem verbal usada no restante da frase e comunica o cuidado egoísta dos dirigentes.
- source_word: הֲלוֹא
  choice: Não deveriam
  rationale: Expressa uma pergunta retórica que espera resposta afirmativa e preserva seu tom de repreensão.
- source_word: הַצֹּאן
  choice: o rebanho
  rationale: Representa naturalmente em português o substantivo coletivo referente às ovelhas ou ao gado miúdo e mantém a imagem pastoral.
- source_word: יִרְעוּ
  choice: apascentar
  rationale: Conserva a repetição da raiz רעה e sua ligação com “pastores”, sem reduzir o dever pastoral apenas ao ato de alimentar.
theological_decisions:
- issue: Forma portuguesa do título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor; o Senhor DEUS
  rationale: A opção distingue o título אֲדֹנָי do nome divino יהוה e preserva explicitamente o nome da aliança, sem fundir os dois termos.
- issue: Identidade dos “pastores”
  choice: manter a metáfora “pastores” no texto principal
  alternative: explicitar “líderes de Israel”
  rationale: Embora os pastores representem os dirigentes de Israel, o hebraico constrói deliberadamente uma metáfora contínua de pastores e rebanho; interpretá-la no texto principal reduziria sua textura literária e teológica.
- issue: Sentido reflexivo de רֹעִים אוֹתָם
  choice: apascentam a si mesmos
  alternative: alimentam a si mesmos
  rationale: A leitura reflexiva evidencia que os dirigentes usam sua função em benefício próprio. A formulação escolhida preserva também a repetição intencional do verbo pastoral.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “profetize”, “pastores” e “apascentar” é intencional, pois reproduz a ênfase e a coesão metafórica do hebraico. Os marcadores das notas foram colocados junto às expressões que efetivamente explicam.
