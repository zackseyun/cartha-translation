  text: וַ/תְּפוּצֶ֖ינָה מִ/בְּלִ֣י רֹעֶ֑ה וַ/תִּהְיֶ֧ינָה לְ/אָכְלָ֛ה לְ/כָל חַיַּ֥ת הַ/שָּׂדֶ֖ה וַ/תְּפוּצֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/005.yaml
  text: So they were scattered for lack of a shepherd[a], and they became food for every beast of the field, and they were scattered.
translation:
  language: pt
  text: Assim, elas se dispersaram por falta de pastor, tornaram-se alimento para todos os animais selvagens do campo e se dispersaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּפוּצֶינָה
  choice: elas se dispersaram
  rationale: O verbo פוץ descreve aqui a dispersão do rebanho. A forma pronominal é natural em português e conserva a repetição enfática no fim do versículo.
- source_word: מִבְּלִי
  choice: por falta de
  rationale: Expressa não só ausência, mas também a causa da dispersão; a formulação é idiomática e próxima do hebraico.
- source_word: רֹעֶה
  choice: pastor
  rationale: Mantém a metáfora central de Ezequiel 34, sem substituí-la por uma explicação como “líder”.
- source_word: וַתִּהְיֶינָה לְאָכְלָה
  choice: tornaram-se alimento
  rationale: Comunica a passagem ao estado resultante indicado por היה e traduz אָכְלָה de modo direto, sem interpretar mais especificamente como “presa”.
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: para todos os animais selvagens do campo
  rationale: O singular coletivo após כָל é expresso naturalmente pelo plural em português; “animais selvagens do campo” preserva a imagem hebraica em linguagem atual.
theological_decisions:
- issue: Metáfora do pastor para os líderes de Israel
  choice: Manter “pastor” e a imagem do rebanho disperso
  alternative: Traduzir explicativamente por “líder” ou “governante”
  rationale: O capítulo desenvolve de modo sustentado a figura dos governantes como pastores e do povo como rebanho; explicitar “líder” enfraqueceria a textura profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição final, estilisticamente marcada no hebraico, foi mantida. Não se incluiu a nota da camada inglesa porque ela não corresponde a uma variante lexical ligada a “pastor” nem a uma ambiguidade real do texto hebraico neste versículo.
