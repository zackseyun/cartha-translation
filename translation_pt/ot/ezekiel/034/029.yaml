  text: וַ/הֲקִמֹתִ֥י לָ/הֶ֛ם מַטָּ֖ע לְ/שֵׁ֑ם וְ/לֹֽא יִהְי֨וּ ע֜וֹד אֲסֻפֵ֤י רָעָב֙ בָּ/אָ֔רֶץ וְ/לֹֽא יִשְׂא֥וּ ע֖וֹד כְּלִמַּ֥ת הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/029.yaml
  text: And I will raise up for them a planting of renown[a], and they will no longer be consumed by famine in the land[b], nor will they bear the disgrace of the nations anymore.
translation:
  language: pt
  text: Farei surgir para eles uma plantação de renome[a]. Nunca mais serão consumidos pela fome[b] na terra, nem voltarão a carregar a desonra das nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma plantação para um nome”, isto é, uma plantação famosa ou renomada.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é difícil; mais literalmente, “recolhidos pela fome”, possivelmente no sentido de “vítimas da fome” ou “levados pela fome”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Farei surgir
  rationale: O hifil de קום expressa fazer surgir, levantar ou estabelecer. “Farei surgir” preserva a iniciativa divina e combina naturalmente com a imagem da plantação.
- source_word: מַטָּע
  choice: uma plantação
  rationale: O substantivo pode designar aquilo que é plantado, um plantio ou uma plantação. “Plantação” mantém a imagem agrícola sem determinar se a referência é à vegetação, à provisão restaurada ou a uma realidade figurada.
- source_word: לְשֵׁם
  choice: de renome
  rationale: Literalmente, “para um nome”; no contexto, indica fama ou boa reputação. “De renome” reproduz o sentido idiomático sem eliminar a expressão alternativa, registrada em nota.
- source_word: אֲסֻפֵי רָעָב
  choice: consumidos pela fome
  rationale: A expressão hebraica é incomum e literalmente envolve o particípio passivo “recolhidos” ou “levados” pela fome. “Consumidos pela fome” comunica de modo natural a ideia provável de pessoas vitimadas ou levadas pela fome, enquanto a dificuldade é preservada em nota.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Em Ezequiel, אֶרֶץ frequentemente se refere à terra de Israel. “Na terra” preserva essa provável referência sem explicitá-la além do texto.
- source_word: יִשְׂאוּ
  choice: carregar
  rationale: נשא significa levantar, levar ou carregar. Com “humilhação”, “carregar” preserva a metáfora hebraica e é compreensível em português.
- source_word: כְּלִמַּת
  choice: a humilhação
  rationale: O termo designa vergonha, desonra ou humilhação pública. “Humilhação” expressa adequadamente a afronta sofrida diante das nações.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Na literatura profética, גוים normalmente designa as nações ou povos ao redor de Israel. “As nações” é a tradução mais ampla e menos interpretativa.
theological_decisions:
- issue: Natureza da “plantação” prometida
  choice: Manter a imagem agrícola como “uma plantação de renome”, sem identificar explicitamente seu referente.
  alternative: Interpretá-la diretamente como uma figura messiânica, como o povo restaurado ou exclusivamente como fertilidade agrícola restaurada.
  rationale: A expressão hebraica não determina de forma inequívoca se a plantação representa uma pessoa, o povo restaurado ou a renovação produtiva da terra. A tradução conserva a imagem e sua tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva o paralelismo profético e a metáfora agrícola; “carregar a humilhação” mantém a imagem do hebraico. A expressão “imposta pelas nações” explicita a relação genitiva de modo natural, sem acrescentar uma identificação teológica específica.
