  text: לָ/כֵ֣ן רֹעִ֔ים שִׁמְע֖וּ אֶת דְּבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/007.yaml
  text: 'Therefore[a], shepherds, hear the word of Yahweh:'
translation:
  language: pt
  text: 'Portanto, pastores, ouçam a palavra de Yahweh[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH. Tradicionalmente traduzido como «SENHOR» em muitas versões portuguesas.'
    reason: Informa a forma do texto hebraico e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão lógica decorrente da acusação anterior e mantém um registro profético natural e digno.
- source_word: רֹעִים
  choice: pastores
  rationale: Preserva a metáfora central do capítulo para os líderes de Israel, sem substituí-la pela interpretação explícita «líderes» nem pelo uso eclesiástico mais restrito.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: Traduz o imperativo masculino plural de שׁמע e conserva a força da convocação profética.
- source_word: אֶת
  choice: '[sem tradução independente]'
  rationale: É o marcador hebraico de objeto direto e não tem equivalente lexical separado em português.
- source_word: דְּבַר
  choice: a palavra de
  rationale: A forma construta de דָּבָר integra a fórmula profética tradicional e textualmente transparente «a palavra de Yahweh».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, enquanto «SENHOR» o substitui por um título e «Jeová» reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora dos pastores e a fórmula profética foram preservadas. O marcador da nota foi colocado junto de «Yahweh», ao qual a nota efetivamente se refere.
