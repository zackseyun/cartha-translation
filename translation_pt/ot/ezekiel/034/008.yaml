source:
  edition: WLC
  text: חַי אָ֜נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם לֹ֣א יַ֣עַן הֱיֽוֹת צֹאנִ֣/י לָ/בַ֡ז וַ/תִּֽהְיֶינָה֩ צֹאנִ֨/י לְ/אָכְלָ֜ה לְ/כָל חַיַּ֤ת הַ/שָּׂדֶה֙ מֵ/אֵ֣ין רֹעֶ֔ה וְ/לֹֽא דָרְשׁ֥וּ רֹעַ֖/י אֶת צֹאנִ֑/י וַ/יִּרְע֤וּ הָֽ/רֹעִים֙ אוֹתָ֔/ם וְ/אֶת צֹאנִ֖/י לֹ֥א רָעֽוּ־׀־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/008.yaml
  text: As I live[a], declares the Lord GOD, surely because my flock has become plunder and my flock has become food for every wild beast of the field, since there was no shepherd, and my shepherds did not seek my flock[b], but the shepherds fed themselves and did not feed my flock—
translation:
  language: pt
  text: “Tão certo como eu vivo”, declara o Senhor Yahweh, “visto que o meu rebanho se tornou despojo[a] e alimento para todos os animais selvagens do campo, por não haver pastor, e os meus pastores não procuraram o meu rebanho, mas alimentaram a si mesmos[b] e não alimentaram o meu rebanho—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “presa”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “apascentaram a si mesmos”. A expressão indica que os pastores cuidaram dos próprios interesses em vez de cuidar do rebanho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֜נִי
  choice: Tão certo como eu vivo
  rationale: Preserva a fórmula solene de autojuramento profético em português natural e digno.
- source_word: נְאֻ֣ם אֲדֹנָ֣י יְהוִ֗ה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética; no título composto, אֲדֹנָי é traduzido por “Senhor” e o nome divino יהוה é representado por “Yahweh”.
- source_word: אִם לֹא
  choice: visto que
  rationale: Após a fórmula de juramento, אִם לֹא reforça solenemente a declaração. Como o conteúdo introduzido é a causa da sentença que prossegue no versículo seguinte, a construção portuguesa integra essa força ao período sem tratá-la como condição literal.
- source_word: יַעַן הֱיוֹת
  choice: visto que ... se tornou
  rationale: Expressa a relação causal e verte naturalmente a construção hebraica com infinitivo.
- source_word: צֹאנִי
  choice: o meu rebanho
  rationale: O substantivo coletivo se ajusta à metáfora pastoril e mantém a repetição enfática do hebraico.
- source_word: לָבַז
  choice: despojo
  rationale: Designa aquilo que é tomado à força. “Despojo” preserva essa ideia, enquanto “presa” permanece uma alternativa contextual genuína.
- source_word: לְאָכְלָה
  choice: alimento
  rationale: Tradução direta e idiomática do substantivo que designa aquilo que serve de comida.
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: para todos os animais selvagens do campo
  rationale: Comunica claramente que se trata de animais não domesticados e conserva a expressão espacial do texto.
- source_word: מֵאֵין רֹעֶה
  choice: por não haver pastor
  rationale: Mantém de forma concisa a circunstância causal da vulnerabilidade do rebanho.
- source_word: דָרְשׁוּ
  choice: procuraram
  rationale: Preserva o sentido básico de buscar ou procurar, sem ampliá-lo silenciosamente para “cuidar”.
- source_word: וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: os pastores ... alimentaram a si mesmos
  rationale: O contraste com a negligência do rebanho indica que os pastores usaram sua posição em benefício próprio. “Alimentaram” mantém a ligação semântica com a tarefa pastoral e prepara o contraste seguinte.
- source_word: וְאֶת צֹאנִי לֹא רָעוּ
  choice: não alimentaram o meu rebanho
  rationale: 'Reproduz o contraste verbal: os pastores sustentaram a si próprios, mas não sustentaram o rebanho sob sua responsabilidade.'
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: “Senhor Yahweh” distingue os dois elementos do título composto e torna explícito o nome divino, sem produzir a repetição “Senhor SENHOR”.
- issue: Identidade metafórica dos pastores
  choice: Preservar simplesmente “meus pastores”
  alternative: Explicitar “os líderes de Israel”
  rationale: O contexto identifica os responsáveis pelo povo, mas o versículo mantém a metáfora. A tradução não restringe além do que o texto declara.
- issue: Sentido de os pastores alimentarem a si mesmos
  choice: Manter a imagem e indicar o valor reflexivo
  alternative: Explicitar “cuidaram dos próprios interesses”
  rationale: A formulação escolhida conserva a acusação metafórica e o contraste do original sem substituir a imagem por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “meu rebanho” e o travessão final foram mantidos porque o juramento e sua sentença continuam no versículo seguinte.
