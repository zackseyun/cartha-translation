  text: וְ/אַתֵּ֣נָה צֹאנִ֔/י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י שֹׁפֵט֙ בֵּֽין שֶׂ֣ה לָ/שֶׂ֔ה לָ/אֵילִ֖ים וְ/לָ/עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/017.yaml
  text: 'And as for you[a], my flock, thus says the Lord GOD: Behold, I am judging between sheep and sheep, between the rams and the male goats.'
translation:
  language: pt
  text: 'Quanto a vocês, meu rebanho, assim diz o Senhor Yahweh: Eis que estou julgando entre uma ovelha e outra, entre os carneiros e os bodes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: Quanto a vocês
  rationale: O pronome independente anteposto marca uma mudança enfática de destinatário; esta formulação preserva o destaque com naturalidade em português.
- source_word: צֹאנִי
  choice: meu rebanho
  rationale: O substantivo coletivo com sufixo de primeira pessoa designa o rebanho como um todo e mantém a imagem pastoral.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Fórmula profética tradicional, concisa e próxima do hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, título, de יהוה, nome divino, evitando a repetição artificial 'Senhor SENHOR'.
- source_word: הִנְנִי שֹׁפֵט
  choice: Eis que estou julgando
  rationale: Preserva tanto a apresentação enfática de הִנְנִי quanto o valor atual ou iminente do particípio שֹׁפֵט.
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: entre uma ovelha e outra
  rationale: Expressa naturalmente o sentido distributivo — julgamento entre indivíduos do mesmo rebanho — sem sugerir que שֶׂה seja especificamente uma fêmea no hebraico.
- source_word: לָאֵילִים וְלָעַתּוּדִים
  choice: entre os carneiros e os bodes
  rationale: Mantém os dois termos masculinos específicos e a imagem animal ativa no contexto.
theological_decisions:
- issue: Representação de אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e torna visível no texto o nome divino presente no hebraico.
- issue: Natureza do julgamento dentro do rebanho
  choice: entre uma ovelha e outra
  alternative: entre ovelhas e ovelhas
  rationale: A formulação conserva o julgamento entre membros do próprio rebanho sem decidir antecipadamente os critérios morais desenvolvidos no contexto seguinte.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Conserva a solenidade da fórmula profética e a metáfora pastoral, evitando arcaísmos desnecessários.
