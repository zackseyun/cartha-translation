  text: וְ/נָתַן֩ עֵ֨ץ הַ/שָּׂדֶ֜ה אֶת פִּרְי֗/וֹ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן יְבוּלָ֔/הּ וְ/הָי֥וּ עַל אַדְמָתָ֖/ם לָ/בֶ֑טַח וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה בְּ/שִׁבְרִ/י֙ אֶת מֹט֣וֹת עֻלָּ֔/ם וְ/הִ֨צַּלְתִּ֔י/ם מִ/יַּ֖ד הָ/עֹבְדִ֥ים בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/027.yaml
  text: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
translation:
  language: pt
  text: As árvores do campo darão seu fruto, e a terra dará sua produção. Eles estarão seguros em sua terra e saberão que eu sou Yahweh, quando eu quebrar as barras do seu jugo e os livrar da mão dos que os escravizavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que os faziam servir” ou “os que os faziam trabalhar”. O particípio hebraico pode ser traduzido de modo mais literal, mas o contexto do jugo quebrado favorece o sentido mais forte de “escravizavam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן עֵץ הַשָּׂדֶה אֶת פִּרְיוֹ
  choice: As árvores do campo darão seu fruto
  rationale: O singular hebraico עֵץ הַשָּׂדֶה tem sentido coletivo. O plural em português expressa naturalmente essa referência geral à vegetação arbórea, enquanto “darão seu fruto” preserva a imagem e o valor futuro da promessa.
- source_word: וְהָאָרֶץ תִּתֵּן יְבוּלָהּ
  choice: e a terra dará sua produção
  rationale: יְבוּל designa a produção ou colheita da terra. “Produção” é claro, atual e adequado ao contexto agrícola.
- source_word: וְהָיוּ עַל אַדְמָתָם לָבֶטַח
  choice: Eles estarão seguros em sua terra
  rationale: A formulação preserva o verbo explícito “estar” e traduz לָבֶטַח como segurança, sem acrescentar “habitar”, que não aparece no hebraico desta oração.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: e saberão que eu sou Yahweh
  rationale: Mantém a coordenação hebraica e verte o tetragrama pelo nome próprio “Yahweh”, em vez de substituí-lo por um título.
- source_word: בְּשִׁבְרִי אֶת מֹטוֹת עֻלָּם
  choice: quando eu quebrar as barras do seu jugo
  rationale: A preposição בְּ com o infinitivo construto tem valor temporal. “Barras do seu jugo” conserva a metáfora concreta dos componentes de madeira do jugo opressor.
- source_word: וְהִצַּלְתִּים מִיַּד
  choice: e os livrar das mãos
  rationale: נצל comunica livramento ou resgate. O plural “das mãos” soa natural em português diante do grupo plural de opressores e preserva a metáfora hebraica de poder ou domínio.
- source_word: הָעֹבְדִים בָּהֶם
  choice: dos que os escravizavam
  rationale: O particípio de עבד com ב pode descrever quem sujeita outros ao trabalho. A imagem imediata do jugo rompido favorece “escravizavam”, sem ocultar alternativas mais literais, registradas em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título.
- issue: Intensidade da opressão em הָעֹבְדִים בָּהֶם
  choice: os que os escravizavam
  alternative: os que os faziam servir; os que os exploravam pelo trabalho
  rationale: O jugo rompido e o livramento do domínio alheio indicam sujeição opressiva. A nota conserva a amplitude lexical do particípio hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega futuro simples para a promessa profética, mantém a metáfora do jugo e usa plural natural para o singular coletivo “árvore do campo”. O marcador [a] foi colocado junto à expressão a que a nota realmente se refere.
