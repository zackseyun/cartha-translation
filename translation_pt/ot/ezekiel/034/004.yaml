  text: אֶֽת הַ/נַּחְלוֹת֩ לֹ֨א חִזַּקְתֶּ֜ם וְ/אֶת הַ/חוֹלָ֣ה לֹֽא רִפֵּאתֶ֗ם וְ/לַ/נִּשְׁבֶּ֨רֶת֙ לֹ֣א חֲבַשְׁתֶּ֔ם וְ/אֶת הַ/נִּדַּ֨חַת֙ לֹ֣א הֲשֵׁבֹתֶ֔ם וְ/אֶת הָ/אֹבֶ֖דֶת לֹ֣א בִקַּשְׁתֶּ֑ם וּ/בְ/חָזְקָ֛ה רְדִיתֶ֥ם אֹתָ֖/ם וּ/בְ/פָֽרֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/004.yaml
  text: You have not strengthened the weak[a], and you have not healed the sick, and you have not bound up the broken, and you have not brought back the strayed, and you have not sought the lost[c][b]; but with force and with harshness you have ruled them.
translation:
  language: pt
  text: Vocês não fortaleceram as fracas[a], não curaram as doentes, não cuidaram das feridas, não trouxeram de volta as desgarradas[b] nem procuraram as perdidas; mas governaram sobre elas à força e com dureza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as enfermas”. O termo hebraico pode indicar doença ou fraqueza; aqui, “fracas” o distingue da expressão seguinte, “as doentes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as que foram afastadas” ou “as que foram afugentadas”. O hebraico pode enfatizar que elas foram expulsas, e não apenas que se desgarraram.
    reason: lexical_alternative
  - marker: c
    text: Ou “com crueldade”. O termo hebraico indica severidade opressiva, capaz de esmagar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּחְלוֹת
  choice: as fracas
  rationale: O termo pode indicar doença ou debilidade. “Fracas” preserva a distinção em relação a הַחוֹלָה, “as doentes”, na frase seguinte, e corresponde naturalmente ao verbo “fortalecer”.
- source_word: חִזַּקְתֶּם
  choice: fortaleceram
  rationale: O piel de חזק significa “fortalecer, tornar forte”; a escolha mantém a relação direta com “as fracas”.
- source_word: הַחוֹלָה
  choice: as doentes
  rationale: Forma de חלה com sentido claro de enfermidade; distingue esta categoria da debilidade mencionada antes.
- source_word: רִפֵּאתֶם
  choice: curaram
  rationale: רפא é o verbo comum para curar e se encaixa tanto na imagem pastoril quanto em sua aplicação aos líderes.
- source_word: לַנִּשְׁבֶּרֶת
  choice: as feridas
  rationale: O particípio passivo de שבר significa literalmente “quebrada”. No contexto de cuidar do rebanho, “feridas” comunica em português natural as ovelhas lesionadas que precisavam ser enfaixadas, sem eliminar a imagem corporal.
- source_word: חֲבַשְׁתֶּם
  choice: enfaixaram
  rationale: חבש, em contexto médico ou pastoril, descreve o ato de atar ou enfaixar uma lesão. “Enfaixaram” é concreto e atual.
- source_word: הַנִּדַּחַת
  choice: as desgarradas
  rationale: נדח pode descrever aquilo que foi afastado, expulso ou disperso. “Desgarradas” é natural na imagem de um rebanho e deixa em aberto se o afastamento foi voluntário ou imposto.
- source_word: הֲשֵׁבֹתֶם
  choice: trouxeram de volta
  rationale: O hifil de שוב significa causar o retorno; esta formulação preserva o valor causativo.
- source_word: הָאֹבֶדֶת
  choice: as perdidas
  rationale: No contexto pastoril, אבד designa naturalmente as ovelhas perdidas, embora em outros contextos também possa ter o sentido de perecer.
- source_word: בִקַּשְׁתֶּם
  choice: procuraram
  rationale: בקש significa buscar ou procurar; “procuraram” é idiomático com o objeto “as perdidas”.
- source_word: וּבְחָזְקָה
  choice: à força
  rationale: A expressão indica domínio coercivo. “À força” comunica isso sem exigir que toda ocorrência envolva violência física explícita.
- source_word: רְדִיתֶם
  choice: governaram sobre
  rationale: רדה significa governar, exercer domínio. O verbo relativamente neutro permite que as expressões de modo carreguem a condenação do exercício opressivo do poder.
- source_word: וּבְפָרֶךְ
  choice: com dureza
  rationale: פרך expressa severidade opressiva e esmagadora. “Com dureza” é conciso e preserva o paralelismo com “à força”.
theological_decisions:
- issue: Registro metafórico do pastoreio
  choice: 'Preservar a imagem das ovelhas por meio de categorias femininas substantivadas: “as fracas”, “as doentes”, “as feridas”, “as desgarradas” e “as perdidas”.'
  alternative: Converter diretamente a metáfora em linguagem política sobre pessoas e líderes.
  rationale: O texto censura os dirigentes de Israel mediante uma metáfora pastoril contínua. Mantê-la conserva a força profética e as relações com outras passagens bíblicas sobre pastores.
- issue: Responsabilidade pelo afastamento das ovelhas
  choice: Usar “desgarradas” no texto e registrar em nota a possibilidade de “afastadas à força”.
  alternative: Traduzir diretamente como “expulsas” ou “afugentadas”.
  rationale: A raiz נדח pode destacar tanto o estado de dispersão quanto a ação que o causou. A tradução principal permanece natural no contexto pastoril, enquanto a nota preserva a possibilidade de afastamento imposto.
- issue: Força negativa da cláusula final
  choice: Manter o verbo “governaram” e expressar a opressão nos modificadores “à força e com dureza”.
  alternative: Intensificar o próprio verbo como “dominaram brutalmente” ou “oprimiram”.
  rationale: No hebraico, a avaliação negativa é explicitada pelas duas expressões preposicionais. Preservar essa distribuição evita intensificação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “não” conserva o ritmo acusatório do hebraico, enquanto a omissão de alguns “e” evita uma sequência artificial em português. “Pelo contrário” marca com naturalidade o contraste da cláusula final.
