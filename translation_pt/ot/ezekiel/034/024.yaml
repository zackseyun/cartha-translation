  text: וַ/אֲנִ֣י יְהוָ֗ה אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/עַבְדִּ֥/י דָוִ֖ד נָשִׂ֣יא בְ/תוֹכָ֑/ם אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/024.yaml
  text: And I[a], Yahweh, will be their God, and my servant David will be prince among them. I, Yahweh, have spoken.
translation:
  language: pt
  text: Eu, Yahweh, serei o Deus deles, e meu servo Davi[a] será príncipe no meio deles. Eu, Yahweh, falei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Meu servo Davi» pode referir-se, de modo tipológico ou profético, ao futuro governante davídico, isto é, ao Messias; o texto hebraico, porém, diz literalmente «Davi».
    reason: Leitura alternativa de reconhecida importância messiânica, apresentada sem substituir a redação explícita do hebraico.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: serei o Deus deles
  rationale: Expressa em português natural a fórmula de aliança hebraica, preservando tanto o valor futuro do verbo quanto a relação entre Deus e o povo.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto régio e davídico, o termo funciona como designação honrosa de serviço leal a Deus; «servo» conserva adequadamente esse registro.
- source_word: דָוִד
  choice: Davi
  rationale: Emprega a forma portuguesa convencional do nome próprio, sem inserir no texto principal uma identificação interpretativa.
- source_word: נָשִׂיא
  choice: príncipe
  rationale: Preserva a designação específica usada em Ezequiel e sua distinção possível em relação a «rei», sem determinar em excesso a função política.
- source_word: בְתוֹכָם
  choice: no meio deles
  rationale: Reproduz com clareza a expressão locativa hebraica e mantém a ideia de presença dentro da comunidade.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: Mantém a fórmula solene de declaração divina no perfeito hebraico; em português, o pretérito perfeito é a forma idiomática e enfática.
theological_decisions:
- issue: Identidade de «Davi» em «meu servo Davi»
  choice: Manter «Davi» no texto principal sem ampliação interpretativa.
  alternative: Entender a referência como o Davi histórico, um governante davídico futuro ou o Messias, filho maior de Davi.
  rationale: O hebraico diz literalmente «Davi». A tradução conserva essa formulação e registra em nota sua possível dimensão tipológica ou profética, sem resolver uma questão que o versículo deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe direta preserva a solenidade da fórmula profética e a repetição enfática de «Eu, Yahweh».
