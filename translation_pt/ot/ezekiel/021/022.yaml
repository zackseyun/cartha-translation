  text: וְ/גַם אֲנִ֗י אַכֶּ֤ה כַפִּ/י֙ אֶל כַּפִּ֔/י וַ/הֲנִחֹתִ֖י חֲמָתִ֑/י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/022.yaml
  text: And I too will strike my hands together[a], and I will satisfy my wrath. I, Yahweh[b], have spoken.
translation:
  language: pt
  text: Também eu baterei as mãos uma contra a outra[a] e farei repousar a minha ira[b]. Eu, Yahweh, falei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “baterei minha mão contra minha mão”; gesto enfático associado aqui ao juízo.
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, a ira será levada ao repouso por meio da execução plena do juízo. Também se pode traduzir: “satisfarei a minha ira”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Também eu
  rationale: Preserva tanto a ligação com o contexto quanto a força aditiva e enfática de גַם junto ao pronome אֲנִי, em português natural.
- source_word: אַכֶּה כַפִּי אֶל כַּפִּי
  choice: baterei as mãos uma contra a outra
  rationale: Comunica a ação enfática de bater uma mão contra a outra sem usar “aplaudir”, que poderia sugerir celebração. O plural idiomático em português torna natural a imagem hebraica de “minha mão contra minha mão”.
- source_word: וַהֲנִחֹתִי חֲמָתִי
  choice: farei a minha ira repousar
  rationale: 'Mantém a imagem causativa de נוח e sua tensão idiomática: a ira chega ao repouso quando o juízo é plenamente executado. A nota esclarece o sentido sem o resolver silenciosamente no texto.'
- source_word: חֲמָתִי
  choice: minha ira
  rationale: “Ira” é uma expressão atual e digna para a cólera intensa no contexto profético de juízo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: O perfeito integra a fórmula solene de declaração divina; “falei” é direto, enfático e idiomático em português.
theological_decisions:
- issue: Forma de expressar o repouso da ira divina
  choice: farei a minha ira repousar
  alternative: satisfarei a minha ira; farei cessar a minha ira
  rationale: A formulação escolhida preserva a metáfora hebraica e não reduz o sentido a mero apaziguamento emocional. No contexto, o repouso decorre da execução completa do juízo, como esclarece a nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto contém o nome pessoal divino. “Yahweh” preserva esse nome sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Também eu” conserva a ênfase do hebraico. A expressão incomum sobre a ira foi mantida no corpo do texto para preservar a imagem e a tensão do original, com esclarecimento em nota.
