base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/032.yaml
  text: A ruin[a], a ruin, a ruin—I will make it. This also shall not be, until he comes whose right it is[b], and I will give it to him.
translation:
  language: pt
  text: Ruína[a], ruína, ruína — eu a farei. Também isto não existirá até que venha aquele a quem pertence o direito[b], e eu entregarei isto a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Derrubada, derrubada, derrubada — assim a farei”. O hebraico repete três vezes um substantivo para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: “A quem pertence o direito” também pode ser traduzido por “a quem pertence o julgamento” ou “a quem pertence legitimamente”. Muitos entendem aqui uma alusão a Gênesis 49:10 e, portanto, uma referência messiânica.
    reason: alternative_reading
lexical_decisions:
- source_word: עַוָּה עַוָּה עַוָּה
  choice: Uma ruína, uma ruína, uma ruína
  rationale: Preserva a forma nominal e a repetição tríplice enfática, anunciando uma destruição total sem suavizar a força retórica do hebraico.
- source_word: אֲשִׂימֶנָּה
  choice: eu a farei
  rationale: Traduz de perto o verbo שׂים, “fazer, pôr, estabelecer”, e mantém o pronome feminino do texto hebraico sem explicitar indevidamente seu referente contextual.
- source_word: גַּם זֹאת לֹא הָיָה
  choice: Isso também não existirá
  rationale: Conserva a ênfase aditiva de גַּם e entende o perfeito no contexto profético com sentido futuro ou resultativo.
- source_word: עַד בֹּא
  choice: até que venha aquele
  rationale: Expressa naturalmente a oração temporal e torna explícito apenas o referente pessoal exigido pela oração relativa seguinte.
- source_word: אֲשֶׁר לוֹ הַמִּשְׁפָּט
  choice: a quem pertence o direito
  rationale: מִשְׁפָּט pode indicar julgamento, justiça ou direito legítimo. Aqui, “o direito” preserva a ideia de reivindicação legítima sem identificar quem é a pessoa.
- source_word: וּנְתַתִּיו
  choice: e eu lhe darei isso
  rationale: Reproduz o ato divino de dar ou transferir, usando “isso” porque o objeto está implícito e deve ser inferido do contexto.
theological_decisions:
- issue: Referente messiânico ou histórico imediato de “aquele a quem pertence o direito”
  choice: Manter no texto principal a referência aberta a um futuro detentor legítimo do direito.
  alternative: Identificá-lo explicitamente como o Messias davídico ou como um governante histórico mais próximo.
  rationale: A formulação pode evocar Gênesis 49:10 e ser entendida em sentido messiânico, mas o hebraico não identifica expressamente a pessoa. A tradução preserva essa abertura e registra a possibilidade na nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição profética foi mantida, assim como a ambiguidade do referente e do objeto implícito na frase final.
