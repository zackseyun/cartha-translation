lexical_decisions:
- source_word: חָלָל
  choice: traspassado
  rationale: Preserva a imagem de alguém ferido ou morto por golpe penetrante e a certeza profética da sentença, sem tornar incoerente o fato de a pessoa ainda estar sendo interpelada. A leitura «profano» permanece possível e é registrada em nota.
- source_word: רָשָׁע
  choice: perverso
  rationale: O termo é substantivado e integra a interpelação direta; «perverso» comunica de modo claro a condenação moral do hebraico.
- source_word: נְשִׂיא יִשְׂרָאֵל
  choice: príncipe de Israel
  rationale: Mantém o título formal e o tom profético de נְשִׂיא, sem reduzi-lo ao sentido mais geral de «líder».
- source_word: אֲשֶׁר בָּא יוֹמוֹ
  choice: cujo dia chegou
  rationale: Reproduz a imagem hebraica do dia determinado que finalmente chega, neste contexto, como dia de juízo.
- source_word: בְּעֵת
  choice: no tempo do
  rationale: Equivalência temporal direta, natural em português e apropriada ao registro solene.
- source_word: עֲוֺן קֵץ
  choice: castigo final
  rationale: עָוֹן pode designar tanto a culpa quanto a consequência punitiva dela. O contexto favorece «castigo», enquanto «final» expressa a ideia de קֵץ de forma clara e concisa.
theological_decisions:
- issue: Sentido de עֲוֺן na fórmula de juízo
  choice: castigo
  alternative: iniquidade ou culpa
  rationale: O contexto imediato é uma sentença contra o príncipe de Israel, o que favorece o sentido punitivo; a nota conserva a ambiguidade real entre a culpa e sua punição.
- issue: Sentido de חָלָל
  choice: traspassado
  alternative: profano; ferido de morte; morto
  rationale: A leitura ligada a ferimento e morte se ajusta ao oráculo de execução e preserva sua imagem judicial. Como a vocalização também permite que se defenda «profano», essa alternativa é explicitada sem resolver silenciosamente a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem vocativa foi mantida próxima do hebraico. «Você» torna a interpelação direta natural no português brasileiro contemporâneo, enquanto «príncipe de Israel» conserva o tom formal. A vírgula final foi preservada porque o versículo continua sintaticamente no contexto seguinte.
