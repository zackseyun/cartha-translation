base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/035.yaml
  text: Return to your sheath[a]. In the place where you were created, in the land of your origins[b], I will judge you.
translation:
  language: pt
  text: Volte para sua bainha[a]. No lugar onde você foi criada, na terra de suas origens[b], eu a julgarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seja recolocada em sua bainha”. O hebraico diz literalmente: “Volte para a bainha dela”, personificando a espada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na terra do seu nascimento” ou “da sua naturalidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁב
  choice: Volte
  rationale: Imperativo de שוב dirigido, no contexto, à espada personificada. “Volte” conserva a ordem direta e concisa.
- source_word: תַּעְרָהּ
  choice: para a sua bainha
  rationale: תער designa a bainha da espada. Embora o sufixo hebraico seja de terceira pessoa feminina, a tradução em segunda pessoa mantém de modo natural o discurso direto à espada personificada.
- source_word: בִּמְקוֹם
  choice: No lugar
  rationale: Expressão locativa simples que introduz o local do julgamento.
- source_word: נִבְרֵאת
  choice: você foi criado
  rationale: O nifal de ברא significa normalmente “ser criado”. Apesar de a referência a uma espada ser incomum, a formulação preserva a imagem e a possível alusão àquele que ela representa.
- source_word: בְּאֶרֶץ מְכֻרוֹתַיִךְ
  choice: na terra das suas origens
  rationale: מְכֻרוֹת pode indicar origens, nascimento ou naturalidade. “Origens” é atual, claro e adequado à ambiguidade entre a espada personificada e a entidade que ela simboliza.
- source_word: אֶשְׁפֹּט אֹתָךְ
  choice: eu o julgarei
  rationale: שפט com objeto direto é traduzido de modo direto por “julgar”. O pronome masculino segue a concordância de “você”, sem eliminar a personificação feminina presente no hebraico.
theological_decisions:
- issue: Referente do destinatário feminino no versículo
  choice: A ordem se dirige imediatamente à espada personificada, enquanto o julgamento recai, em última análise, sobre o povo ou entidade simbolizado por ela.
  alternative: O destinatário é diretamente a nação amonita ou seu governante, e não a espada.
  rationale: A menção da bainha e as formas femininas apoiam a espada como referente gramatical imediato. Preservar a metáfora evita resolver prematuramente a tensão profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a concisão do oráculo e a personificação da espada. Emprega-se “você” por naturalidade no português brasileiro, sem ampliar a interpretação do referente.
