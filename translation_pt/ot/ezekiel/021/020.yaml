base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/020.yaml
  text: so that the heart may melt and the stumbling blocks may be many[a]. At all their gates I have set the flash of the sword. Ah! It is made for lightning[b], drawn for slaughter.
translation:
  language: pt
  text: para que os corações se derretam e os tropeços se multipliquem[a]. Em todos os seus portões, coloquei o lampejo da espada. Ah! Ela foi feita para reluzir como um relâmpago, preparada para a matança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e muitos caiam”. O substantivo hebraico pode indicar tropeços ou ocasiões de queda, ou a própria queda resultante.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico da expressão final é difícil. “Preparada para a matança” também pode ser traduzido como “desembainhada para a matança”, “afiada para a matança” ou “polida para a matança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz propósito ou resultado e mantém a ligação com o contexto anterior em português natural.
- source_word: לָמוּג לֵב
  choice: os corações se derretam
  rationale: Preserva a metáfora hebraica de perda de coragem. O plural soa natural em português para o singular coletivo hebraico.
- source_word: וְהַרְבֵּה הַמִּכְשֹׁלִים
  choice: e muitos venham a cair
  rationale: Expressa com clareza a queda generalizada sugerida por מִכְשׁוֹל, sem ocultar em nota a possibilidade mais concreta de obstáculos ou tropeços.
- source_word: עַל כָּל שַׁעֲרֵיהֶם
  choice: Em todas as suas portas
  rationale: Indica o lugar onde a ameaça foi posta e é idiomático em português.
- source_word: נָתַתִּי
  choice: coloquei
  rationale: Verbo natural para a ação de pôr a ameaça da espada diante das portas.
- source_word: אִבְחַת חָרֶב
  choice: o lampejo da espada
  rationale: O substantivo raro provavelmente descreve o brilho súbito da espada; 'lampejo' preserva a imagem e se harmoniza com a referência seguinte ao relâmpago.
- source_word: אָח
  choice: Ah!
  rationale: Mantém a interjeição abrupta sem decidir se exprime sobretudo lamento, espanto ou intensidade.
- source_word: עֲשׂוּיָה לְבָרָק
  choice: Ela foi feita para reluzir como um relâmpago
  rationale: Torna explícita em português a comparação implícita entre o brilho da espada e o relâmpago, preservando a imagem de בָרָק.
- source_word: מְעֻטָּה לְטָבַח
  choice: preparada para a matança
  rationale: A forma hebraica é difícil; o contexto aponta para uma espada pronta para matar. A formulação evita fixar indevidamente se ela foi desembainhada, afiada ou polida.
