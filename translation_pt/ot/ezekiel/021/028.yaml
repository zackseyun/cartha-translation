  yaml_path: translation/ot/ezekiel/021/028.yaml
  text: And it will be to them like a false divination in their eyes; they have sworn sworn oaths to them[a], but he brings guilt to remembrance, so that they may be captured.
translation:
  language: pt
  text: E isso será para eles como uma adivinhação falsa aos olhos deles, apesar dos juramentos feitos a eles[a]; mas ele traz a culpa à memória, para que sejam capturados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “juramentos jurados a eles” ou, possivelmente, “juramentos sobre juramentos para eles”. A expressão é difícil e pode referir-se a juramentos solenes ou a obrigações confirmadas por juramento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E isso será
  rationale: O perfeito com waw em discurso profético admite sentido futuro ou resultante; a formulação mantém essa força de modo natural.
- source_word: כקסום שוא
  choice: como uma adivinhação falsa
  rationale: קסום designa adivinhação, e שוא acrescenta a ideia de falsidade, vazio ou inutilidade; “adivinhação falsa” é clara e adequada ao contexto.
- source_word: בְּעֵינֵיהֶם
  choice: aos olhos deles
  rationale: Preserva o idioma hebraico inteligível em português e destaca a avaliação subjetiva dos envolvidos.
- source_word: שְׁבֻעֵי שְׁבֻעוֹת לָהֶם
  choice: fizeram juramentos, juramentos a favor deles
  rationale: A expressão hebraica é comprimida e difícil. A repetição procura conservar sua forma enfática sem acrescentar explicitamente a noção interpretativa de obrigação vinculante; a alternativa é registrada em nota.
- source_word: וְהוּא
  choice: Mas ele
  rationale: O pronome provavelmente retoma o rei da Babilônia no contexto anterior, e “mas” expressa naturalmente o contraste.
- source_word: מַזְכִּיר עָוֺן
  choice: traz a culpa à memória
  rationale: Mantém a construção causativa de זכר e traduz עון como “culpa”, apropriado ao contexto judicial, sem excluir a ideia de iniquidade.
- source_word: לְהִתָּפֵשׂ
  choice: para que sejam capturados
  rationale: O infinitivo pode indicar propósito ou resultado; esta formulação preserva essa abertura e se ajusta ao contexto militar.
theological_decisions:
- issue: Identidade do sujeito em “ele traz a culpa à memória”
  choice: Manter apenas o pronome “ele” no texto
  alternative: Explicitar “o rei da Babilônia” ou entender Deus como sujeito
  rationale: O contexto imediato favorece o rei da Babilônia, mas o hebraico usa somente o pronome; não explicitar o referente evita eliminar uma possível tensão de agência humana e divina.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível ao público brasileiro e amplamente compreensível no mundo lusófono. A repetição incomum no segmento dos juramentos foi mantida para refletir a dificuldade e a ênfase do hebraico.
