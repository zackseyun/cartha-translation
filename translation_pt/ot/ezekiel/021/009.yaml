source:
  edition: WLC
  text: יַ֛עַן אֲשֶׁר הִכְרַ֥תִּי מִמֵּ֖/ךְ צַדִּ֣יק וְ/רָשָׁ֑ע לָ֠/כֵן תֵּצֵ֨א חַרְבִּ֧/י מִ/תַּעְרָ֛/הּ אֶל כָּל בָּשָׂ֖ר מִ/נֶּ֥גֶב צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/009.yaml
  text: Because I will cut off from you both the righteous and the wicked[b][a], therefore my sword will go out from its sheath against all flesh from south to north.
translation:
  language: pt
  text: Visto que eliminarei[a] de ti tanto o justo quanto o ímpio, a minha espada sairá da bainha contra toda carne[b], do sul ao norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «eliminei». A forma perfeita hebraica pode indicar uma ação já concluída ou, no contexto profético, uma ação futura apresentada como certa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «toda carne», expressão comum para todos os seres humanos mortais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Porque
  rationale: Introduz a causa do juízo anunciado de modo claro e natural, preservando a força causal da expressão hebraica.
- source_word: הִכְרַתִּי
  choice: eliminarei
  rationale: O verbo כרת significa literalmente “cortar” e, neste contexto judicial, “eliminar”. Embora esteja na forma perfeita, o discurso profético permite entendê-lo como ação futura apresentada como certa.
- source_word: מִמֵּךְ
  choice: do seu meio
  rationale: O sufixo feminino singular se dirige à terra personificada. “Do seu meio” comunica em português natural a ideia de retirar pessoas de dentro dela, sem alterar o referente.
- source_word: צַדִּיק וְרָשָׁע
  choice: tanto o justo como o perverso
  rationale: Mantém os dois polos morais e explicita de forma idiomática que ambos estão incluídos no alcance imediato do juízo.
- source_word: לָכֵן
  choice: por isso
  rationale: Expressa claramente a consequência decorrente da oração anterior em português moderno.
- source_word: תֵּצֵא חַרְבִּי
  choice: a minha espada sairá
  rationale: Preserva a imagem vívida e personificada do hebraico, em vez de substituí-la pela formulação mais interpretativa “será desembainhada”.
- source_word: מִתַּעְרָהּ
  choice: da bainha
  rationale: “Bainha” é o termo português comum e preciso para o estojo da espada; o sufixo hebraico feminino se refere à própria espada.
- source_word: אֶל כָּל בָּשָׂר
  choice: contra toda carne
  rationale: Conserva a expressão hebraica solene para todos os seres humanos mortais; “contra” deixa clara a ação hostil da espada.
- source_word: מִנֶּגֶב צָפוֹן
  choice: desde o sul até o norte
  rationale: Comunica a extensão geográfica total entre os dois extremos. Embora נגב também possa designar o Neguebe, aqui o contraste direcional com o norte está em primeiro plano.
theological_decisions:
- issue: O juízo alcança “tanto o justo como o perverso”
  choice: Manter sem atenuação que a espada atingirá o justo e o perverso no juízo histórico anunciado.
  alternative: Entender “justo” como apenas aparentemente justo ou inserir uma distinção explícita entre calamidade temporal e condenação final.
  rationale: O hebraico inclui diretamente os dois grupos no alcance da espada. A tradução deve conservar essa tensão sem acrescentar uma solução teológica ausente do versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sintaxe conserva a relação explícita entre causa e consequência, e as imagens concretas da espada, da bainha e de “toda carne” são mantidas.
