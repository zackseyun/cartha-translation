revisions:
- from: Porque eliminarei do seu meio tanto o justo como o perverso[a], por isso a minha espada sairá da bainha contra toda carne[b], desde o sul até o norte.
  to: Visto que eliminarei[a] de ti tanto o justo quanto o ímpio, a minha espada sairá da bainha contra toda carne[b], do sul ao norte.
  rationale: A revisão restaura a tradução direta de מִמֵּךְ («de ti»), melhora a fluência da relação causal, emprega o par terminológico bíblico «justo ... ímpio» e desloca a nota sobre a forma verbal para o termo a que ela se refere. Mantêm-se a ambiguidade temporal do perfeito hebraico, a imagem concreta da espada e a expressão «toda carne».
