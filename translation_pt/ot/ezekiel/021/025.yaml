revisions:
- from: Você traçará uma estrada para que a espada venha contra Rabá dos amonitas[a][b] e contra Judá, em Jerusalém fortificada.
  to: Trace uma estrada para a espada vir contra Rabá dos amonitas[a][b] e contra Judá, em Jerusalém, a fortificada.
  rationale: A revisão ajusta o registro da ordem e esclarece por pontuação que «a fortificada» qualifica Jerusalém. Mantém-se «contra» no texto principal como expressão natural da investida hostil da espada, enquanto a nota preserva a possibilidade sintática de «até/para». Os marcadores continuam ancorados corretamente após «Rabá».
