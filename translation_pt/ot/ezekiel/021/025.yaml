review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a imagem de preparar uma rota para a espada e apresenta Rabá e Judá/Jerusalém como alvos paralelos. «Contra» é uma explicitação contextual aceitável, desde que a alternativa direcional permaneça indicada em nota. A expressão final, porém, precisa de pontuação que reflita melhor בִירוּשָׁלַ͏ִם בְּצוּרָה, em que «fortificada» qualifica Jerusalém.
  naturalness: «Você traçará» é compreensível, mas «Trace» soa mais natural como instrução profética em português moderno digno, sem a oscilação entre uma ordem contextual e uma declaração dirigida a «você». «Jerusalém, a fortificada» evita a leitura pouco fluente de que Judá esteja simplesmente localizado dentro de uma «Jerusalém fortificada», mantendo a formulação compacta e algo solene do hebraico.
  terminology: «Rabá», «amonitas», «Judá», «Jerusalém» e «espada» estão adequados. A nota cultural é correta. A nota alternativa deve acompanhar a formulação revista e conservar tanto a leitura de direção quanto a de ataque.
  issues:
  - severity: medium
    issue: A formulação «Judá, em Jerusalém fortificada» é sintaticamente pouco natural e deixa obscura a relação de «fortificada» com Jerusalém.
    rationale: O hebraico descreve Jerusalém como fortificada. A aposição «Jerusalém, a fortificada» torna essa qualificação clara sem introduzir uma interpretação adicional sobre quem, em Judá, está em Jerusalém.
  - severity: low
    issue: «Você traçará» tem tom mais coloquial e declarativo do que a instrução profética no contexto.
    rationale: «Trace» comunica de modo mais direto a ordem contextual e mantém registro moderno e amplamente compreensível.
