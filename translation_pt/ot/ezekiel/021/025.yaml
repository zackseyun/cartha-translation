  text: דֶּ֣רֶךְ תָּשִׂ֔ים לָ/ב֣וֹא חֶ֔רֶב אֵ֖ת רַבַּ֣ת בְּנֵֽי עַמּ֑וֹן וְ/אֶת יְהוּדָ֥ה בִ/ירוּשָׁלִַ֖ם בְּצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/025.yaml
  text: You shall set a road for the sword to come to Rabbah of the Ammonites[b][a], and to Judah in fortified Jerusalem.
translation:
  language: pt
  text: Trace uma estrada para a espada vir contra Rabá dos amonitas[a][b] e contra Judá, em Jerusalém, a fortificada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até Rabá dos filhos de Amom e até Judá, em Jerusalém, a fortificada”. A construção hebraica pode indicar tanto movimento em direção a esses lugares quanto avanço hostil contra eles.'
    reason: alternative_reading
  - marker: b
    text: Rabá era a principal cidade dos amonitas.
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: uma estrada
  rationale: O substantivo indica uma rota ou via; “estrada” comunica naturalmente a rota militar que o profeta deve traçar.
- source_word: תָּשִׂים
  choice: você traçará
  rationale: Embora שׂים signifique literalmente “pôr/colocar”, no contexto de demarcar uma rota, “traçará” expressa com clareza a ação ordenada e preserva a força prospectiva da forma verbal.
- source_word: לָבוֹא חֶרֶב
  choice: para que a espada venha
  rationale: O infinitivo de בוא exprime finalidade ou resultado, e חֶרֶב personifica o avanço militar e o juízo.
- source_word: אֵת רַבַּת בְּנֵי עַמּוֹן
  choice: contra Rabá dos amonitas
  rationale: Rabá é a capital amonita; “dos amonitas” traduz de modo idiomático בְּנֵי עַמּוֹן. “Contra” explicita a direção hostil da espada, embora o hebraico também permita formular a ideia como movimento “até/para” o alvo.
- source_word: וְאֶת יְהוּדָה
  choice: e contra Judá
  rationale: Mantém Judá em paralelo com Rabá como segundo alvo possível da espada.
- source_word: בִירוּשָׁלַם בְּצוּרָה
  choice: em Jerusalém fortificada
  rationale: A preposição marca localização, e בְּצוּרָה descreve Jerusalém como fortificada.
theological_decisions:
- issue: Força sintática dos destinos introduzidos por אֵת após “a espada venha”
  choice: Rabá e Judá/Jerusalém são apresentados paralelamente como alvos do avanço da espada.
  alternative: 'Traduzir o movimento de modo menos explicitamente hostil: “até Rabá... e até Judá”.'
  rationale: O contexto é o sinal profético das duas rotas possíveis para a espada babilônica. “Contra” torna natural em português a hostilidade implícita, enquanto a nota preserva a possibilidade formal de direção ou movimento.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega “você” para a ordem profética e conserva a imagem personificada da espada. A ordem dos marcadores segue sua primeira ocorrência lógica no texto.
