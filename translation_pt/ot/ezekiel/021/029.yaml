  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ יַ֗עַן הַזְכַּרְ/כֶם֙ עֲוֺ֣נְ/כֶ֔ם בְּ/הִגָּל֣וֹת פִּשְׁעֵי/כֶ֗ם לְ/הֵֽרָאוֹת֙ חַטֹּ֣אותֵי/כֶ֔ם בְּ/כֹ֖ל עֲלִילֽוֹתֵי/כֶ֑ם יַ֚עַן הִזָּ֣כֶרְ/כֶ֔ם בַּ/כַּ֖ף תִּתָּפֵֽשׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/029.yaml
  text: 'Therefore thus says the Lord GOD: Because you have brought your guilt to remembrance by uncovering your transgressions[a], so that your sins are seen in all your deeds, because you have come to remembrance[b], you will be seized by the hand.'
translation:
  language: pt
  text: 'Portanto, assim diz o Soberano Yahweh: “Visto que vocês fizeram com que sua culpa fosse lembrada, ao serem reveladas suas transgressões, de modo que seus pecados são vistos em todos os seus atos; visto que vocês foram lembrados, vocês serão apanhados na mão[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Literalmente, “serão apanhados na palma da mão”. A expressão retrata alguém sendo capturado e ficando sob o poder de outro.
    reason: idiom_clarification
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Soberano Yahweh
  rationale: Preserva o nome divino Yahweh e traduz אֲדֹנָי por um título natural em português, evitando a repetição pouco clara de “Senhor”.
- source_word: יַעַן
  choice: visto que
  rationale: Introduz com clareza a causa do julgamento e funciona naturalmente nas duas ocorrências da construção causal.
- source_word: הַזְכַּרְכֶם עֲוֺנְכֶם
  choice: vocês fizeram com que a sua culpa fosse lembrada
  rationale: Mantém o valor causativo do hifil de זכר e traduz עָוֹן como “culpa”, adequado ao contexto em que transgressões e pecados ficam expostos.
- source_word: בְּהִגָּלוֹת פִּשְׁעֵיכֶם
  choice: ao deixarem suas transgressões expostas
  rationale: Expressa a circunstância ou o meio indicado por בְּ e preserva a imagem de revelação ou exposição, sem forçar uma voz passiva em português.
- source_word: לְהֵרָאוֹת חַטֹּאתֵיכֶם
  choice: de modo que os seus pecados aparecem
  rationale: Comunica o resultado da exposição e conserva o sentido de os pecados se tornarem visíveis.
- source_word: בְּכֹל עֲלִילוֹתֵיכֶם
  choice: em todos os seus atos
  rationale: “Atos” é uma equivalência ampla, clara e atual para as ações ou práticas abrangidas por עֲלִילוֹת.
- source_word: הִזָּכֶרְכֶם
  choice: vocês foram lembrados
  rationale: Conserva a forma passiva e a repetição retórica da raiz זכר, sem explicitar indevidamente quem se lembrou deles.
- source_word: בַּכַּף תִּתָּפֵשׂוּ
  choice: serão capturados pela mão
  rationale: Preserva tanto o sentido passivo de captura quanto a imagem concreta da mão ou palma, deixando a nota explicar o valor idiomático.
theological_decisions:
- issue: Forma portuguesa do título אֲדֹנָי יְהוִה
  choice: o Soberano Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha mantém explícito o nome próprio divino presente no hebraico e distingue esse nome do título אֲדֹנָי.
- issue: Agente implícito em “vocês foram lembrados”
  choice: não explicitar o agente
  alternative: vocês foram lembrados por Deus
  rationale: O contexto sugere lembrança diante de Deus para julgamento, mas o hebraico não nomeia o agente; a tradução preserva essa abertura.
- issue: Sentido da imagem “pela mão”
  choice: manter a imagem no texto e explicá-la em nota
  alternative: serão entregues ao poder do inimigo
  rationale: A paráfrase alternativa esclareceria o provável sentido, mas acrescentaria um agente não expresso neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do plural em “vocês”. A construção conserva a repetição retórica de “lembrar”, a linguagem judicial e a imagem concreta da mão, recorrendo a notas apenas onde a literalidade pode causar estranheza.
