  to: 'Portanto, assim diz o Soberano Yahweh: “Visto que vocês fizeram com que sua culpa fosse lembrada, ao serem reveladas suas transgressões, de modo que seus pecados são vistos em todos os seus atos; visto que vocês foram lembrados, vocês serão apanhados na mão[b].”'
