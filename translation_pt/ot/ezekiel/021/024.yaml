  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם שִׂים לְ/ךָ֣ שְׁנַ֣יִם דְּרָכִ֗ים לָ/בוֹא֙ חֶ֣רֶב מֶֽלֶךְ בָּבֶ֔ל מֵ/אֶ֥רֶץ אֶחָ֖ד יֵצְא֣וּ שְׁנֵי/הֶ֑ם וְ/יָ֣ד בָּרֵ֔א בְּ/רֹ֥אשׁ דֶּֽרֶךְ עִ֖יר בָּרֵֽא־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/024.yaml
  text: And you[a], son of man, set for yourself two roads for the sword of the king of Babylon to come by; both of them shall go out from one land. And make a signpost[b]; make it at the head of the road to the city.
translation:
  language: pt
  text: E você, filho do homem, trace para si duas estradas pelas quais venha a espada do rei da Babilônia; ambas sairão de uma só terra. Faça uma placa de direção[a]; faça-a no início da estrada que leva à cidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mão”. Aqui, provavelmente se refere a um marco que indicava a direção, talvez em forma de mão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no entroncamento da estrada para a cidade”. A expressão hebraica é literalmente “na cabeça da estrada da cidade” e pode indicar seu início ou o principal ponto de bifurcação.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a fórmula característica de tratamento dirigida a Ezequiel e o contraste entre a condição humana do profeta e Deus.
- source_word: שִׂים לְךָ שְׁנַיִם דְּרָכִים
  choice: trace duas estradas
  rationale: No contexto da ação simbólica, o imperativo pede que Ezequiel estabeleça ou represente duas rotas; 'trace' é natural em português e evita sugerir construção física.
- source_word: לָבוֹא חֶרֶב מֶלֶךְ בָּבֶל
  choice: pelas quais venha a espada do rei da Babilônia
  rationale: Mantém literalmente a imagem profética da espada, usada metonimicamente para a ofensiva militar, e expressa seu movimento pelas estradas.
- source_word: מֵאֶרֶץ אֶחָד יֵצְאוּ שְׁנֵיהֶם
  choice: ambas partirão da mesma terra
  rationale: Explicita que as duas estradas têm uma origem comum. 'Mesma' transmite naturalmente em português a força contextual de 'uma' terra.
- source_word: יָד
  choice: placa de direção
  rationale: Embora o sentido literal seja 'mão', aqui o termo provavelmente designa um marco indicador, talvez em forma de mão, colocado para apontar uma direção.
- source_word: בָּרֵא
  choice: faça
  rationale: O verbo raro neste uso pode significar preparar, formar ou talhar. 'Faça' preserva a amplitude sem especificar indevidamente o modo de produção.
- source_word: בְּרֹאשׁ דֶּרֶךְ עִיר
  choice: no início da estrada que leva à cidade
  rationale: Traduz רֹאשׁ de modo inteligível como o começo ou ponto principal da estrada e entende 'cidade' como destino, sem identificar antecipadamente qual cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe conserva a ação simbólica e a imagem da espada sem resolver além do necessário as ambiguidades de יָד e בְּרֹאשׁ דֶּרֶךְ.
