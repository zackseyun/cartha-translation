  text: כִּ֣י בֹ֔חַן וּ/מָ֕ה אִם גַּם שֵׁ֥בֶט מֹאֶ֖סֶת לֹ֣א יִֽהְיֶ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/018.yaml
  text: For there is a testing[b][a]; and what if even the scepter that despises will not remain? declares the Lord GOD.
translation:
  language: pt
  text: Pois há uma prova[a]. E que acontecerá se até o cetro[b] que despreza deixar de existir? — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois isto é uma prova”. O hebraico deste versículo é especialmente difícil, sobretudo a oração seguinte a respeito do cetro.'
    reason: alternative_reading
  - marker: b
    text: A palavra hebraica também pode significar “vara”, “bastão” ou “tribo”. Aqui se traduz por “cetro” por causa da possível imagem régia ou judicial no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou fundamentadora da conjunção em relação ao contexto anterior.
- source_word: בֹחַן
  choice: há uma prova
  rationale: Conserva a formulação breve e elíptica do hebraico, sem especificar indevidamente quem prova ou é provado.
- source_word: וּמָה אִם גַּם
  choice: E que acontecerá se até
  rationale: Expressa em português corrente a difícil pergunta retórica e sua força condicional e enfática.
- source_word: שֵׁבֶט
  choice: cetro
  rationale: O termo também pode significar vara, bastão ou tribo; 'cetro' se ajusta melhor à possível imagem régia ou judicial do contexto.
- source_word: מֹאֶסֶת
  choice: que despreza
  rationale: Traduz ativamente o particípio feminino de מאס e preserva sua ligação gramatical com שֵׁבֶט, sem identificar o objeto do desprezo.
- source_word: לֹא יִהְיֶה
  choice: deixar de existir
  rationale: Verte o literal 'não será' de modo inteligível no quadro da pergunta condicional, mantendo a ideia de cessação sem definir sua natureza.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Emprega uma fórmula profética natural e preserva o nome divino Yahweh no título composto.
theological_decisions:
- issue: Sentido e referente do cetro que despreza
  choice: Manter 'o cetro que despreza' sem identificar seu referente nem o objeto de seu desprezo
  alternative: Interpretá-lo explicitamente como a monarquia de Judá, uma vara de castigo ou uma tribo rebelde
  rationale: O hebraico é notoriamente difícil; explicitar um referente resolveria uma tensão que o texto não resolve.
- issue: Representação de יְהוָה em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome da aliança יְהוִה, evitando fundi-los em um único título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe deliberadamente incomum da pergunta conserva parte da obscuridade real do hebraico, esclarecida apenas o necessário nas notas.
