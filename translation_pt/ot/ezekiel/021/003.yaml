  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לְ/יַ֣עַר הַ/נֶּ֔גֶב שְׁמַ֖ע דְּבַר יְהוָ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה הִנְ/נִ֣י מַֽצִּית בְּ/ךָ֣ אֵ֡שׁ וְ/אָכְלָ֣ה בְ/ךָ֣ כָל עֵֽץ לַח֩ וְ/כָל עֵ֨ץ יָבֵ֤שׁ לֹֽא תִכְבֶּה֙ לַהֶ֣בֶת שַׁלְהֶ֔בֶת וְ/נִצְרְבוּ בָ֥/הּ כָּל פָּנִ֖ים מִ/נֶּ֥גֶב צָפֽוֹנָ/ה־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/003.yaml
  text: 'And say to the forest of the Negev[a], ‘Hear the word of Yahweh. Thus says the Lord GOD: Behold, I am kindling a fire in you, and it will consume in you every green tree and every dry tree. The blazing flame will not be quenched[b], and by it every face from south to north will be scorched.’'
translation:
  language: pt
  text: 'E diga à floresta do Neguebe[a]: ‘Ouça a palavra de Yahweh. Assim diz o Senhor Yahweh: Eis que estou acendendo em você um fogo, que consumirá em você toda árvore verde e toda árvore seca. A chama ardente não se apagará, e todos os rostos, desde o sul até o norte, serão chamuscados por ela.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à floresta do sul”. O hebraico négev pode significar “sul” ou “região do sul” e também designar especificamente o Neguebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַר הַנֶּגֶב
  choice: a floresta do Neguebe
  rationale: יַעַר significa “floresta” ou “bosque”, e הַנֶּגֶב pode designar tanto a região do Neguebe quanto o sul em sentido mais geral. “Neguebe” preserva a possível referência geográfica, enquanto a nota registra a alternativa.
- source_word: שְׁמַע דְּבַר יְהוָה
  choice: Ouça a palavra de Yahweh
  rationale: Mantém a força do imperativo profético em português atual e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa distintamente o título אֲדֹנָי e o nome divino יְהוָה, sem fundi-los.
- source_word: הִנְנִי מַצִּית
  choice: Eis que estou acendendo
  rationale: “Eis que” conserva a solenidade do anúncio divino, e a forma progressiva corresponde à construção com הִנְנִי e o particípio.
- source_word: וְאָכְלָה בְךָ
  choice: que consumirá em você
  rationale: O verbo feminino retoma “fogo”; “consumirá” é idiomático para a ação destrutiva do fogo, e “em você” preserva a formulação do hebraico.
- source_word: כָל עֵץ לַח וְכָל עֵץ יָבֵשׁ
  choice: toda árvore verde e toda árvore seca
  rationale: No contexto de árvores e incêndio, “verde” expressa naturalmente לַח, em contraste com “seca”, e ressalta a abrangência do juízo.
- source_word: לַהֶבֶת שַׁלְהֶבֶת
  choice: a chama ardente
  rationale: Reproduz de modo natural a expressão hebraica intensiva, sem enfraquecer sua força retórica.
- source_word: לֹא תִכְבֶּה
  choice: não se apagará
  rationale: É a expressão portuguesa mais natural para uma chama que não será extinta, preservando o sentido passivo ou intransitivo possível da forma hebraica.
- source_word: וְנִצְרְבוּ בָהּ כָּל פָּנִים
  choice: e todos os rostos ... serão chamuscados por ela
  rationale: “Chamuscados” comunica o efeito do calor intenso expresso pelo verbo; “rostos” conserva a imagem concreta e abrangente do original.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome divino, e a transliteração preserva a distinção entre esse nome e o título אֲדֹנָי.
- issue: Identidade da floresta e do fogo
  choice: Manter no texto principal as imagens concretas de floresta e fogo
  alternative: Explicitar a floresta como Judá e o fogo como juízo
  rationale: O versículo fala metaforicamente; interpretar os referentes dentro da tradução eliminaria a força da imagem e acrescentaria uma explicação que pertence ao contexto.
- issue: Abrangência de “árvore verde” e “árvore seca”
  choice: Preservar ambas literalmente, sem identificar grupos específicos
  alternative: Interpretá-las como justos e ímpios ou como diferentes classes do povo
  rationale: O contraste enfatiza a totalidade do incêndio, mas o próprio versículo não fornece uma identificação teológica inequívoca para cada tipo de árvore.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” foi mantido por sua função retórica no anúncio profético; as demais construções evitam arcaísmos desnecessários. A ambiguidade geográfica de négev é preservada por nota.
