  source_fidelity: 'A tradução reproduz com precisão a estrutura e os elementos centrais do hebraico: a dupla ordem dirigida ao «filho do homem», o título divino composto «Senhor Yahweh», os «filhos de Amom», a expressão ambígua sobre «a afronta deles» e a repetição enfática «uma espada, uma espada». «Desembainhada», «para a matança», «polida para devorar» e «para reluzir como um relâmpago» comunicam adequadamente a imagem da espada preparada e brilhante. A formulação sobre o relâmpago explicita de modo moderado uma elipse poética sem impor interpretação indevida.'
