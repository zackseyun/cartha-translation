  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנָּבֵ֤א וְ/אָֽמַרְתָּ֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה אֶל בְּנֵ֥י עַמּ֖וֹן וְ/אֶל חֶרְפָּתָ֑/ם וְ/אָמַרְתָּ֗ חֶ֣רֶב חֶ֤רֶב פְּתוּחָה֙ לְ/טֶ֣בַח מְרוּטָ֔ה לְ/הָכִ֖יל לְמַ֥עַן בָּרָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/033.yaml
  text: 'And you[a], son of man, prophesy and say, ‘Thus says the Lord GOD concerning the sons of Ammon and concerning their reproach’: And you shall say, ‘A sword, a sword, drawn for slaughter, polished for devouring[c][b], so that it flashes like lightning.’'
translation:
  language: pt
  text: 'E você, filho do homem, profetize e diga: “Assim diz o Senhor Yahweh a respeito dos filhos de Amom[a] e da afronta deles[b]”. Diga: “Uma espada, uma espada foi desembainhada para a matança, polida para devorar e para reluzir como um relâmpago[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos amonitas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do insulto deles”, “do escárnio deles” ou “da desonra deles”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico é conciso e também pode ser traduzido: “polida para consumir, a fim de faiscar como um relâmpago”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma recorrente pela qual Deus se dirige a Ezequiel e sua força literária, sem substituir o hebraísmo por uma interpretação.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico e conserva Yahweh como nome divino, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: בְּנֵי עַמּוֹן
  choice: filhos de Amom
  rationale: Mantém a expressão filial do hebraico; a nota oferece a forma portuguesa mais idiomática “amonitas”.
- source_word: חֶרְפָּתָם
  choice: a afronta deles
  rationale: חֶרְפָּה pode indicar afronta, insulto, escárnio ou desonra. “Afronta” preserva a amplitude e a severidade do termo sem determinar se a ênfase recai no insulto proferido ou na desonra sofrida.
- source_word: חֶרֶב חֶרֶב
  choice: Uma espada, uma espada
  rationale: Conserva a repetição enfática e poética do texto hebraico.
- source_word: פְּתוּחָה
  choice: desembainhada
  rationale: No contexto da espada, o particípio descreve uma lâmina tirada da bainha; “desembainhada” é preciso e natural em português.
- source_word: לְטֶבַח
  choice: para a matança
  rationale: Expressa de modo direto a finalidade violenta indicada pela preposição hebraica.
- source_word: מְרוּטָה
  choice: polida
  rationale: O termo descreve a espada brunida ou polida, ideia reforçada pela imagem subsequente do relâmpago.
- source_word: לְהָכִיל
  choice: para devorar
  rationale: No contexto destrutivo, o infinitivo tem o sentido de consumir ou devorar. “Devorar” mantém a personificação vigorosa da espada.
- source_word: לְמַעַן בָּרָק
  choice: para reluzir como um relâmpago
  rationale: A expressão hebraica é breve e elíptica. Esta formulação comunica o brilho semelhante ao relâmpago sem apresentar como explícitos elementos apenas subentendidos.
theological_decisions:
- issue: Representação do nome divino יהוה na combinação אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus; Soberano SENHOR
  rationale: “Senhor Yahweh” conserva tanto o título אֲדֹנָי quanto o nome da aliança יהוה, sem apagar o nome próprio nem produzir uma repetição artificial em português.
- issue: Referente de חֶרְפָּתָם
  choice: a afronta deles
  alternative: o insulto deles; a desonra deles
  rationale: O hebraico admite mais de uma nuance e não esclarece por si só se a expressão enfatiza o escárnio dos amonitas ou a afronta associada a eles. A tradução principal e a nota preservam essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição poética “uma espada, uma espada” e o tratamento tradicional “filho do homem” foram mantidos. A ordem das frases acompanha de perto o hebraico, mas a pontuação foi ajustada para leitura natural.
