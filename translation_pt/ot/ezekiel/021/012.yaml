source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמְר֣וּ אֵלֶ֔י/ךָ עַל מָ֖ה אַתָּ֣ה נֶאֱנָ֑ח וְ/אָמַרְתָּ֡ אֶל שְׁמוּעָ֣ה כִֽי בָאָ֡ה וְ/נָמֵ֣ס כָּל לֵב֩ וְ/רָפ֨וּ כָל יָדַ֜יִם וְ/כִהֲתָ֣ה כָל ר֗וּחַ וְ/כָל בִּרְכַּ֨יִם֙ תֵּלַ֣כְנָה מַּ֔יִם הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/012.yaml
  text: And it shall be[a], when they say to you, ‘Why are you groaning?’ that you shall say, ‘Because of the news, for it is coming.’ Then every heart will melt, all hands will grow weak, every spirit will faint, and all knees will run with water. Look, it is coming, and it will happen[b], declares the Lord GOD.
translation:
  language: pt
  text: 'E acontecerá que, quando lhe perguntarem: “Por que você está gemendo?”, você responderá: “Por causa da notícia[b], pois ela está chegando”. Então todo coração se derreterá, todas as mãos perderão as forças, todo espírito desfalecerá, e todos os joelhos escorrerão água.[a] Eis que ela está chegando, e acontecerá — declara o Senhor Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todos os joelhos escorrerão água”, imagem vívida de terror e colapso. Pode indicar joelhos enfraquecidos como água ou a perda do controle do corpo por causa do medo.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “por causa do relato”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָח
  choice: gemendo
  rationale: O particípio nifal de אנח indica um lamento audível. “Gemendo” conserva a dimensão física e emocional melhor do que “suspirando”.
- source_word: שְׁמוּעָה
  choice: notícia
  rationale: Refere-se à notícia ou ao relato temido que está para chegar. “Notícia” é natural no português atual; “relato” continua sendo uma alternativa possível.
- source_word: כִּי בָאָה
  choice: pois ela está chegando
  rationale: O verbo feminino concorda com שְׁמוּעָה. O pronome “ela” retoma “notícia”, e a forma progressiva comunica sua chegada iminente.
- source_word: וְנָמֵס כָּל לֵב
  choice: todo coração se derreterá
  rationale: Mantém a imagem hebraica da perda de coragem, ainda compreensível em português.
- source_word: וְרָפוּ כָל יָדַיִם
  choice: todas as mãos perderão as forças
  rationale: Expressa a incapacidade de agir sem eliminar a metáfora corporal das mãos.
- source_word: וְכִהֲתָה כָל רוּחַ
  choice: todo espírito desfalecerá
  rationale: רוּחַ designa aqui o espírito ou ânimo interior, e o verbo comunica o colapso da disposição e da coragem.
- source_word: וְכָל בִּרְכַּיִם תֵּלַכְנָה מַּיִם
  choice: todos os joelhos escorrerão água
  rationale: Conserva a imagem hebraica vívida e deliberadamente incomum, deixando em nota suas possíveis nuances.
- source_word: הִנֵּה בָאָה
  choice: Ela está chegando
  rationale: A formulação retoma a notícia e transmite a urgência de הִנֵּה sem recorrer ao arcaico “eis”.
- source_word: וְנִהְיָתָה
  choice: e acontecerá
  rationale: Confirma que o evento anunciado se realizará, em linguagem portuguesa corrente.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Distingue אֲדֹנָי, “Senhor”, do nome divino יהוה, transliterado “Yahweh”, evitando a repetição “Senhor SENHOR”.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR / Senhor DEUS
  rationale: A tradução conserva o título אֲדֹנָי e representa explicitamente o nome da aliança יהוה, sem importar uma interpretação denominacional.
- issue: Referente de “ela está chegando”
  choice: A notícia está chegando, ao mesmo tempo anunciando a chegada do desastre comunicado
  alternative: O desastre está chegando
  rationale: A concordância gramatical liga o verbo feminino a שְׁמוּעָה, “notícia”, mas o contexto permite que a chegada da notícia e a do acontecimento anunciado permaneçam estreitamente associadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe profética e as imagens corporais do hebraico foram preservadas sempre que continuam inteligíveis; a expressão incomum sobre os joelhos recebe explicação em nota.
