  text: וַ/יִּתֵּ֥ן אֹתָ֛/הּ לְ/מָרְטָ֖ה לִ/תְפֹּ֣שׂ בַּ/כָּ֑ף הִֽיא הוּחַ֤דָּה חֶ֨רֶב֙ וְ/הִ֣יא מֹרָ֔טָּה לָ/תֵ֥ת אוֹתָ֖/הּ בְּ/יַד הוֹרֵֽג־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/016.yaml
  text: It is given to be polished[a], to be grasped in the hand. It is sharpened—the sword—and it is polished[c][b], to put it into the hand of a slayer.
translation:
  language: pt
  text: Ela foi entregue para ser polida[a], para ser empunhada. Ela foi afiada — a espada — e foi polida, para ser posta na mão de quem mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brunida”; o termo hebraico descreve o polimento que torna a lâmina reluzente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָהּ
  choice: Ela foi entregue
  rationale: Embora a forma verbal seja ativa, o sujeito não é expresso. A construção passiva evita introduzir um agente ausente e mantém o foco na espada feminina em hebraico e em português.
- source_word: לְמָרְטָה
  choice: para ser polida
  rationale: מרט descreve o polimento ou brunimento da lâmina; “polida” é claro, natural e permite conservar a repetição retórica do hebraico.
- source_word: לִתְפֹּשׂ בַּכָּף
  choice: para ser empunhada
  rationale: A expressão indica tomar a espada na palma ou mão. “Ser empunhada” transmite naturalmente em português a finalidade de segurá-la para uso, sem exigir uma tradução literal pouco idiomática.
- source_word: הוּחַדָּה חֶרֶב
  choice: Ela foi afiada — a espada —
  rationale: O hophal expressa ação passiva. A aposição abrupta “a espada” preserva o estilo enfático e fragmentado do oráculo.
- source_word: וְהִיא מֹרָטָּה
  choice: e foi polida
  rationale: Mantém a segunda ocorrência de מרט e, assim, a insistência retórica na preparação da arma.
- source_word: לָתֵת אוֹתָהּ בְּיַד
  choice: para ser posta na mão
  rationale: נתן com ביד comunica colocação ou entrega à posse de alguém. A formulação conserva a imagem hebraica da mão.
- source_word: הוֹרֵג
  choice: quem mata
  rationale: O particípio ativo significa literalmente aquele que mata. A expressão é atual, forte e evita decidir entre artigo definido e indefinido onde o hebraico permite certa abertura.
theological_decisions:
- issue: Identidade do agente que entrega e do executante
  choice: 'Não identificar nenhum deles além do que o texto afirma: a espada é entregue a “quem mata”.'
  alternative: Explicitar Deus como agente ou traduzir הוֹרֵג como “o matador” definido.
  rationale: O versículo não nomeia o sujeito de וַיִּתֵּן, e o particípio הוֹרֵג não traz artigo. A tradução preserva essa indeterminação em vez de resolver a tensão pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Empunhada” é vocabulário comum no contexto de armas e condensa naturalmente a imagem literal da palma da mão. O travessão conserva a aposição abrupta e enfática do hebraico.
