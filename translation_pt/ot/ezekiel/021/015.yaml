source:
  edition: WLC
  text: לְמַ֨עַן טְבֹ֤חַ טֶ֨בַח֙ הוּחַ֔דָּה לְמַעַן הֱיֵה לָ֥/הּ בָּ֖רָק מֹרָ֑טָּה א֣וֹ נָשִׂ֔ישׂ שֵׁ֥בֶט בְּנִ֖/י מֹאֶ֥סֶת כָּל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/015.yaml
  text: So that it may slaughter a slaughter[a], it is sharpened; so that it may have a flash, it is polished[b]. Or shall we rejoice? The scepter of my son despises every tree.
translation:
  language: pt
  text: Para realizar grande matança, ela foi afiada; para ter um lampejo[b], foi polida. Ou haveremos de nos alegrar? O cetro de meu filho despreza toda árvore.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico da cláusula final é difícil. “Meu filho” segue o Texto Massorético; alguns intérpretes entendem a expressão de modo mais amplo, como referência a Judá ou ao meu povo. “Toda árvore” também pode significar todo bastão ou arma de madeira.
    reason: alternative_reading
  - marker: b
    text: Ou “para ter um relâmpago” ou “para reluzir”. A expressão hebraica é elíptica e descreve o brilho da espada depois de polida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן טְבֹחַ טֶבַח
  choice: Para realizar grande matança
  rationale: A construção com infinitivo e objeto cognato intensifica a ação. Em português, “realizar grande matança” preserva a ênfase sem produzir a formulação pouco natural “matar uma matança”.
- source_word: הוּחַדָּה
  choice: ela foi afiada
  rationale: O feminino retoma a espada do contexto. A forma passiva traduz diretamente o hebraico e o pronome torna a referência clara em português.
- source_word: לְמַעַן הֱיֵה לָהּ בָּרָק
  choice: para ter um lampejo
  rationale: A expressão hebraica é elíptica e descreve o brilho da espada. “Lampejo” conserva a imagem súbita e luminosa sem acrescentar explicitamente uma comparação.
- source_word: מֹרָטָה
  choice: foi polida
  rationale: O termo descreve uma lâmina alisada ou polida para brilhar. “Polida” é claro e corrente em português.
- source_word: אוֹ נָשִׂישׂ
  choice: Ou haveremos de nos alegrar?
  rationale: Mantém a transição abrupta introduzida por “ou” e expressa como pergunta retórica a forma verbal da primeira pessoa do plural.
- source_word: שֵׁבֶט
  choice: cetro
  rationale: “Cetro” comunica governo e autoridade no contexto régio, embora “vara” ou “bastão” também sejam possíveis.
- source_word: בְּנִי
  choice: meu filho
  rationale: Segue o Texto Massorético, apesar da dificuldade contextual, sem substituí-lo silenciosamente por uma interpretação como “meu povo” ou “Judá”.
- source_word: מֹאֶסֶת כָּל עֵץ
  choice: despreza toda árvore
  rationale: Preserva tanto a força de rejeição desdenhosa do verbo quanto a imagem concreta e ambígua de “toda árvore/madeira”.
theological_decisions:
- issue: A cláusula final, textual e sintaticamente difícil, dentro do oráculo de juízo
  choice: O cetro de meu filho despreza toda árvore.
  alternative: A vara de meu filho rejeita toda madeira; ou leituras interpretativas que entendem a frase como referência a Judá, ao povo de Deus ou a armas de madeira.
  rationale: A tradução mantém uma leitura próxima do Texto Massorético e deixa sua opacidade genuína visível. Como a incerteza não exige resolução doutrinária, as principais possibilidades são registradas em nota, sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A primeira metade foi vertida de modo natural, mas enfático; a cláusula final permaneceu deliberadamente próxima e difícil, por refletir uma dificuldade real do hebraico. Os marcadores foram colocados junto às expressões às quais as notas efetivamente se referem.
