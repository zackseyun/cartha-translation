base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/037.yaml
  text: You will be fuel for the fire; your blood will be in the midst of the land. You will not be remembered[a], for I, Yahweh, have spoken.
translation:
  language: pt
  text: Você será combustível para o fogo; seu sangue[a] estará no meio da terra. Você não será lembrada, pois eu, Yahweh, falei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua culpa de sangue”. O hebraico diz literalmente “seu sangue”, expressão que, neste contexto, pode também indicar derramamento de sangue ou culpa de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵשׁ תִּהְיֶה לְאָכְלָה
  choice: Você será combustível para o fogo
  rationale: A expressão hebraica diz literalmente que a destinatária será para o fogo como algo destinado ao consumo. “Combustível para o fogo” preserva a imagem de destruição e soa clara em português atual.
- source_word: דָּמֵךְ
  choice: seu sangue
  rationale: O sentido lexical direto é “seu sangue”. O contexto pode sugerir sangue derramado ou culpa de sangue, mas o texto principal mantém a imagem e a ambiguidade do hebraico.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: no meio da terra
  rationale: Reproduz o valor espacial de בְּתוֹךְ e mantém o sentido solene de o sangue permanecer exposto dentro da terra.
- source_word: לֹא תִזָּכֵרִי
  choice: Você não será lembrada
  rationale: O nifal de זכר tem sentido passivo. A flexão feminina preserva a destinatária personificada indicada pela forma verbal hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: O perfeito de דבר encerra a declaração profética com caráter definitivo. “Falei” é direto, solene e natural em português.
theological_decisions:
- issue: Como representar o nome divino יְהוָה
  choice: Yahweh
  alternative: Javé ou SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino. A transliteração preserva esse nome sem substituí-lo por um título.
- issue: Se דָּמֵךְ deve explicitar culpa de sangue
  choice: seu sangue
  alternative: sua culpa de sangue
  rationale: Embora o contexto de juízo permita entender culpa por derramamento de sangue, explicitar isso no corpo do versículo resolveria uma ambiguidade que o hebraico conserva. A alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com concordância no feminino para refletir a destinatária personificada. A formulação mantém o paralelismo profético e a imagem concreta do fogo sem ampliar indevidamente as implicações teológicas.
