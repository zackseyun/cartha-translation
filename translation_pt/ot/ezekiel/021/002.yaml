  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
translation:
  language: pt
  text: Filho do homem, volte o rosto para o sul, dirija sua mensagem ao sul[a] e profetize contra a floresta do campo no Neguebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega em sequência três termos ligados ao sul: temán, darom e Neguebe. O verbo traduzido por “dirija sua mensagem” significa literalmente “goteje” ou “deixe cair”, uma metáfora para o discurso profético.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma hebraica e a fórmula recorrente pela qual Deus se dirige a Ezequiel.
- source_word: שִׂים פָּנֶיךָ
  choice: volte o rosto
  rationale: Expressa em português natural o gesto hebraico de orientar-se deliberadamente para um alvo, mantendo a imagem corporal.
- source_word: דֶּרֶךְ תֵּימָנָה
  choice: para o sul
  rationale: תֵּימָנָה funciona aqui como indicação direcional; o contexto reúne três designações relacionadas ao sul.
- source_word: וְהַטֵּף
  choice: dirija sua mensagem
  rationale: O sentido literal é 'gotejar' ou 'deixar cair', metáfora hebraica para proferir uma mensagem profética; a formulação comunica o sentido sem apagar a imagem, que é registrada em nota.
- source_word: אֶל דָּרוֹם
  choice: ao sul
  rationale: Mantém o valor direcional possível de אֶל e evita explicitar indevidamente uma força adversativa, embora o anúncio seja de juízo.
- source_word: וְהִנָּבֵא
  choice: profetize
  rationale: Equivalente corrente e preciso do verbo נבא neste contexto de comissão profética.
- source_word: אֶל יַעַר הַשָּׂדֶה נֶגֶב
  choice: contra a floresta da região do Neguebe
  rationale: Conserva a imagem da floresta, entende הַשָּׂדֶה como área ou região aberta e toma נֶגֶב como nome da região meridional; 'contra' explicita o alvo hostil da profecia no contexto.
- source_word: נֶגֶב
  choice: Neguebe
  rationale: A transliteração distingue a região geográfica das duas referências direcionais anteriores ao sul e preserva a concentração retórica de termos meridionais.
