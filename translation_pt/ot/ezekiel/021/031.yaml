  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָסִיר֙ הַ/מִּצְנֶ֔פֶת וְ/הָרִ֖ים הָֽ/עֲטָרָ֑ה זֹ֣את לֹא זֹ֔את הַ/שָּׁפָ֣לָה הַגְבֵּ֔הַ וְ/הַ/גָּבֹ֖הַ הַשְׁפִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/031.yaml
  text: 'Thus says the Lord GOD: Remove the turban[a], and take off the crown. This will not remain the same: exalt the lowly[b], and humble the exalted.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Retire o turbante[a] e tire a coroa. Isto não continuará como está[b]: eleve o humilde e rebaixe o exaltado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “turbante” pode referir-se especificamente ao adorno sacerdotal para a cabeça, enquanto a “coroa” representa a autoridade real. O versículo anuncia a retirada desses símbolos de liderança.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Isto já não será assim” ou “Isto não será como era”. O hebraico é conciso e elíptico e enfatiza a inversão da ordem vigente.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Mantém a fórmula profética, distingue אֲדֹנָי do nome divino יְהוִה e evita a construção pouco natural “Senhor SENHOR”.
- source_word: הָסִיר הַמִּצְנֶפֶת
  choice: Retire o turbante
  rationale: O imperativo causativo exige a remoção; מִצְנֶפֶת designa uma peça de tecido enrolada na cabeça, frequentemente associada ao vestuário sacerdotal.
- source_word: וְהָרִים הָעֲטָרָה
  choice: e tire a coroa
  rationale: Embora רום signifique literalmente levantar, no contexto significa levantar para retirar. “Tire” expressa a ação com naturalidade, e עֲטָרָה é adequadamente traduzido por “coroa”.
- source_word: זֹאת לֹא זֹאת
  choice: Isto não continuará como está
  rationale: A expressão hebraica é abrupta e elíptica. A tradução comunica a descontinuidade e a reversão da ordem vigente sem definir em excesso o sentido.
- source_word: הַשָּׁפָלָה הַגְבֵּהַ
  choice: eleve o humilde
  rationale: Preserva a oposição entre o que é baixo ou humilde e o ato causativo de fazê-lo subir.
- source_word: וְהַגָּבֹהַ הַשְׁפִּיל
  choice: e rebaixe o exaltado
  rationale: 'Reproduz de modo paralelo a reversão: aquele que está alto ou exaltado deve ser posto em posição baixa.'
theological_decisions:
- issue: Tradução do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “Senhor Yahweh” preserva os dois elementos do título hebraico e apresenta explicitamente o nome divino, sem confundi-los numa repetição.
- issue: Sentido da frase elíptica זֹאת לֹא זֹאת
  choice: Isto não continuará como está
  alternative: Isto já não será assim; Isto não será como era
  rationale: A formulação mantém a ideia central de ruptura e inversão, mas a nota registra outras maneiras possíveis de completar a elipse hebraica.
- issue: Identidade do humilde e do exaltado
  choice: termos mantidos sem identificação explícita
  alternative: identificá-los diretamente com governantes, sacerdotes ou indivíduos específicos
  rationale: O contexto envolve símbolos de autoridade, mas o versículo formula a inversão de maneira geral. A tradução não restringe além do que o hebraico declara.
translation_notes:
  register: Português atual, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível. Os imperativos diretos preservam a força do anúncio profético; o paralelismo “eleve… rebaixe” conserva a estrutura de reversão do hebraico.
