base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/027.yaml
  text: 'In his right hand was the divination for Jerusalem: to set battering rams[a], to open the mouth with slaughter, to raise the voice with a battle cry, to set battering rams against the gates, to heap up a siege ramp[b], to build a siege wall.'
translation:
  language: pt
  text: 'Na sua mão direita estava a adivinhação para Jerusalém: posicionar aríetes[a], abrir a boca com matança[b], soltar um grito de guerra, posicionar aríetes contra os portões, levantar uma rampa de cerco e construir uma fortificação de cerco[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instalar máquinas de cerco”. O termo hebraico, repetido mais adiante no versículo, designa aqui aríetes ou, mais amplamente, equipamentos usados no ataque às defesas da cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “abrir a boca para a matança”. A expressão hebraica é incomum e talvez se refira ao brado ou à ordem que dá início ao ataque.
    reason: lexical_alternative
  - marker: c
    text: Ou “muro de cerco”, “baluarte” ou “torre de cerco”. O termo hebraico designa de modo geral uma obra de cerco, mas a estrutura exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימִינוֹ
  choice: Na sua mão direita
  rationale: Preserva a imagem concreta da cena de adivinhação e expressa naturalmente em português a localização do resultado na mão direita do rei.
- source_word: הַקֶּסֶם יְרוּשָׁלִַם
  choice: estava a adivinhação para Jerusalém
  rationale: Mantém de perto a construção nominal e a concisão do hebraico, sem explicar além do texto que o presságio apontava Jerusalém como alvo.
- source_word: לָשׂוּם כָּרִים
  choice: posicionar aríetes
  rationale: No contexto de cerco, כָּרִים designa aríetes; “posicionar” comunica sua colocação para o ataque e funciona nas duas ocorrências.
- source_word: לִפְתֹּחַ פֶּה בְּרֶצַח
  choice: abrir a boca para a matança
  rationale: Conserva a imagem incomum de abrir a boca e entende a preposição como introduzindo a finalidade violenta, sem reduzir a expressão a uma ordem explícita.
- source_word: לְהָרִים קוֹל בִּתְרוּעָה
  choice: soltar um grito de guerra
  rationale: Expressa em português corrente a elevação da voz em תְרוּעָה, que no contexto é um brado marcial.
- source_word: עַל שְׁעָרִים
  choice: contra os portões
  rationale: “Contra” explicita naturalmente a direção hostil dos aríetes no contexto do cerco.
- source_word: לִשְׁפֹּךְ סֹלְלָה
  choice: levantar uma rampa de cerco
  rationale: סֹלְלָה é um aterro ou rampa construído para o cerco; “levantar” é idiomático em português e preserva a ideia de acumular material.
- source_word: לִבְנוֹת דָּיֵק
  choice: construir uma fortificação de cerco
  rationale: O referente militar exato de דָּיֵק não é seguro; a formulação abrangente comunica uma obra de cerco sem identificar indevidamente uma estrutura específica.
