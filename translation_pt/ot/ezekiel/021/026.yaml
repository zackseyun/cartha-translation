source:
  edition: WLC
  text: כִּֽי עָמַ֨ד מֶלֶךְ בָּבֶ֜ל אֶל אֵ֣ם הַ/דֶּ֗רֶךְ בְּ/רֹ֛אשׁ שְׁנֵ֥י הַ/דְּרָכִ֖ים לִ/קְסָם קָ֑סֶם קִלְקַ֤ל בַּֽ/חִצִּים֙ שָׁאַ֣ל בַּ/תְּרָפִ֔ים רָאָ֖ה בַּ/כָּבֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/026.yaml
  text: 'For the king of Babylon stands at the mother of the road[a], at the head of the two roads, to practice divination: he shakes the arrows, he consults the teraphim[c][b], he examines the liver.'
translation:
  language: pt
  text: 'Pois o rei da Babilônia está na encruzilhada[a], no ponto de partida dos dois caminhos, para praticar adivinhação: sacode as flechas, consulta os terafins[b] e examina o fígado[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “na mãe do caminho”, expressão que indica o ponto de bifurcação ou a encruzilhada.
    reason: lexical_alternative
  - marker: b
    text: Ou “consulta os deuses domésticos”. Os terafins eram imagens cultuais usadas para adivinhação.
    reason: cultural_note
  - marker: c
    text: Isto é, procura obter um presságio inspecionando o fígado.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da cena anterior e preserva a força causal-explicativa do hebraico.
- source_word: עָמַד
  choice: está
  rationale: O perfeito hebraico apresenta vividamente a posição do rei na cena profética; o presente é natural em português.
- source_word: אֵם הַדֶּרֶךְ
  choice: na encruzilhada
  rationale: A expressão significa literalmente 'mãe do caminho', isto é, o lugar de onde os caminhos se bifurcam. 'Encruzilhada' comunica o sentido idiomático de modo claro.
- source_word: בְּרֹאשׁ שְׁנֵי הַדְּרָכִים
  choice: no ponto de partida dos dois caminhos
  rationale: Expressa a localização na 'cabeça' ou início dos dois caminhos sem produzir uma formulação opaca em português.
- source_word: לִקְסָם קָסֶם
  choice: para praticar adivinhação
  rationale: O infinitivo acompanhado do substantivo cognato enfatiza o ato; esta formulação preserva o sentido de maneira idiomática.
- source_word: קִלְקַל בַּחִצִּים
  choice: sacode as flechas
  rationale: Mantém a ação concreta ligada à prática divinatória, sem explicar além do que o texto afirma.
- source_word: שָׁאַל בַּתְּרָפִים
  choice: consulta os terafins
  rationale: Conserva o termo cultural transliterado para imagens cultuais usadas na adivinhação; 'consulta' corresponde ao contexto oracular.
- source_word: רָאָה בַּכָּבֵד
  choice: examina o fígado
  rationale: Traduz naturalmente a inspeção do fígado como meio de adivinhação, cuja natureza é esclarecida em nota.
theological_decisions:
- issue: Representação das práticas pagãs de adivinhação
  choice: Nomear concretamente as flechas, os terafins e o exame do fígado.
  alternative: Generalizar toda a sequência como 'busca presságios'.
  rationale: O hebraico enumera práticas específicas. Preservá-las mantém a força profética e o contexto histórico sem acrescentar juízo denominacional ou explicação ao corpo do texto.
- issue: Sentido da expressão אֵם הַדֶּרֶךְ
  choice: Traduzir idiomaticamente como 'encruzilhada' e registrar a imagem literal em nota.
  alternative: Manter no texto 'mãe do caminho'.
  rationale: A tradução literal seria pouco inteligível em português moderno; a nota preserva a imagem hebraica e sua possível relevância lexical.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A estrutura conserva a sequência vívida dos três atos divinatórios; os termos culturais e a imagem hebraica incomum são esclarecidos em notas.
