  text: וְ/יָֽדְעוּ֙ כָּל בָּשָׂ֔ר כִּ֚י אֲנִ֣י יְהוָ֔ה הוֹצֵ֥אתִי חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ לֹ֥א תָשׁ֖וּב עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/010.yaml
  text: And all flesh will know that I[a], Yahweh, have drawn my sword from its sheath; it will not return again.
translation:
  language: pt
  text: E toda carne[a] saberá que eu, Yahweh, tirei a minha espada da bainha; ela não voltará mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a humanidade” ou “todas as pessoas”; literalmente, “toda carne”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E ... saberá
  rationale: O perfeito qal com conjunção, no discurso profético, expressa aqui o resultado futuro. O singular concorda naturalmente em português com a expressão coletiva “toda carne”.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: Mantém o sentido literal e a força do conhecido hebraísmo bíblico, que abrange os seres humanos em geral e não apenas Israel; a nota oferece equivalentes mais explícitos.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu, Yahweh,
  rationale: A construção identifica enfaticamente o falante; as vírgulas apresentam “Yahweh” em aposição, sem acrescentar um verbo inexistente no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוֹצֵאתִי חַרְבִּי
  choice: tirei a minha espada
  rationale: O hifil de יצא significa fazer sair ou tirar. Com a menção da bainha, “tirei a minha espada” é claro e idiomático, preservando a imagem marcial.
- source_word: מִתַּעְרָהּ
  choice: da bainha
  rationale: “Bainha” é o termo corrente para o estojo da espada. O artigo definido é natural em português e evita a possível ambiguidade de “sua”, enquanto a relação com a espada permanece evidente.
- source_word: לֹא תָשׁוּב עוֹד
  choice: ela não voltará mais
  rationale: O pronome explicita que o verbo feminino se refere à espada. “Não voltará mais” preserva tanto a negação quanto o valor de עוֹד, sem intensificá-lo para “nunca”.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Alcance de כָּל בָּשָׂר
  choice: toda carne
  alternative: toda a humanidade; todas as pessoas
  rationale: A formulação literal conserva o caráter abrangente e a força retórica da expressão, sem restringi-la a Israel; a nota esclarece o sentido idiomático.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se o hebraísmo “toda carne” por sua força bíblica, acompanhado de nota explicativa.
