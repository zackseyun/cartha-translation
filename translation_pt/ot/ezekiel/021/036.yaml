  text: וְ/שָׁפַכְתִּ֤י עָלַ֨יִ/ךְ֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י אָפִ֣יחַ עָלָ֑יִ/ךְ וּ/נְתַתִּ֗י/ךְ בְּ/יַד֙ אֲנָשִׁ֣ים בֹּֽעֲרִ֔ים חָרָשֵׁ֖י מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/036.yaml
  text: And I will pour out my indignation on you[a]; with the fire of my wrath I will blow on you, and I will give you into the hand of brutal men[b], craftsmen of destruction.
translation:
  language: pt
  text: Derramarei sobre você a minha indignação; com o fogo da minha ira soprarei sobre você e entregarei você nas mãos de homens brutais[a], artífices da destruição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens ferozes”; literalmente, “homens ardentes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “peritos em destruir” ou “ferreiros da ruína”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Derramarei
  rationale: Preserva a metáfora profética comum de verter ou derramar a indignação divina, em português natural e solene.
- source_word: זַעְמִי
  choice: a minha indignação
  rationale: “Indignação” comunica ira com dimensão moral e judicial e mantém distinção lexical em relação a עֶבְרָה.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: com o fogo da minha ira
  rationale: Mantém a imagem intensificadora do fogo e o valor instrumental ou metafórico da preposição בְּ.
- source_word: אָפִיחַ
  choice: soprarei sobre
  rationale: O hifil de נפח significa soprar; aqui, a expressão provavelmente evoca o atiçamento do fogo do juízo, sem tornar explícita uma interpretação além do texto.
- source_word: וּנְתַתִּיךְ בְּיַד
  choice: entregarei você nas mãos de
  rationale: Traduz naturalmente o idioma hebraico de colocar alguém sob o poder de outros; o plural “nas mãos” é idiomático em português.
- source_word: אֲנָשִׁים בֹּעֲרִים
  choice: homens brutais
  rationale: O particípio significa literalmente “ardentes” ou “abrasadores”, mas no contexto caracteriza homens inflamados por violência destrutiva; “brutais” comunica esse sentido com clareza.
- source_word: חָרָשֵׁי מַשְׁחִית
  choice: artífices da destruição
  rationale: Preserva a metáfora de חָרָשׁ como artesão ou profissional habilidoso e a ligação nominal com a destruição.
theological_decisions:
- issue: Distinção entre os dois termos hebraicos para a ira divina
  choice: Traduzir זַעַם por “indignação” e עֶבְרָה por “ira”.
  alternative: Empregar o mesmo termo português nas duas ocorrências, como “ira” e “ira”.
  rationale: O hebraico reúne termos próximos, mas distintos, produzindo intensificação retórica. Vocábulos portugueses diferentes, porém semanticamente sobrepostos, preservam essa variação sem acrescentar uma distinção doutrinária rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “sobre você” acompanha a estrutura enfática do hebraico. Os marcadores foram posicionados junto às expressões a que suas respectivas alternativas lexicais se referem.
