  text: וְ/רָאוּ֙ כָּל בָּשָׂ֔ר כִּ֛י אֲנִ֥י יְהוָ֖ה בִּֽעַרְתִּ֑י/הָ לֹ֖א תִּכְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/004.yaml
  text: And all flesh will see that I[a], Yahweh, have kindled it; it will not be quenched.
translation:
  language: pt
  text: E toda carne[a] verá que eu, Yahweh, acendi esse fogo; ele não se apagará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as pessoas”; literalmente, “toda carne”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: verá
  rationale: O perfeito qal com waw, no contexto profético de juízo, tem sentido futuro. O singular concorda naturalmente com a expressão coletiva “toda carne” e preserva o sentido concreto de ver.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: Mantém o idiomatismo profético literal para todos os seres humanos e seus ecos bíblicos; uma nota oferece a formulação mais explícita “todas as pessoas”.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que toda carne reconhecerá ou verá, sem converter a oração em explicação causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בִּעַרְתִּיהָ
  choice: acendi esse fogo
  rationale: O verbo בער comunica fazer arder ou acender. A explicitação de “fogo”, implícito no sufixo feminino e no contexto imediato, produz português natural sem alterar a imagem.
- source_word: לֹא תִּכְבֶּה
  choice: ele não se apagará
  rationale: Expressa naturalmente o sentido intransitivo do verbo hebraico aplicado ao fogo, preservando a afirmação enfática de que continuará ardendo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o nome divino; “Yahweh” preserva-o como nome próprio sem substituí-lo pelo título “SENHOR”.
- issue: Alcance de כָּל בָּשָׂר
  choice: toda carne
  alternative: todas as pessoas
  rationale: A tradução mantém a amplitude e a força do idiomatismo hebraico sem especificar além do texto; a alternativa explicativa consta em nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. Conserva-se o idiomatismo bíblico “toda carne”, enquanto “esse fogo” explicita o referente contextual do sufixo hebraico para evitar uma referência pronominal obscura em português.
