  text: זְעַ֤ק וְ/הֵילֵל֙ בֶּן אָדָ֔ם כִּי הִיא֙ הָיתָ֣ה בְ/עַמִּ֔/י הִ֖יא בְּ/כָל נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל מְגוּרֵ֤י אֶל חֶ֨רֶב֙ הָי֣וּ אֶת עַמִּ֔/י לָ/כֵ֖ן סְפֹ֥ק אֶל יָרֵֽךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/017.yaml
  text: Cry out and wail[a], son of man, for it has come upon my people; it is upon all the princes of Israel. They are given over to the sword along with my people[b]; therefore strike your thigh.
translation:
  language: pt
  text: Clame e lamente, filho do homem, pois ela veio sobre o meu povo; ela está sobre todos os príncipes de Israel. Eles foram entregues à espada[a] junto com o meu povo. Por isso, bata na coxa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os terrores por causa da espada vieram sobre o meu povo”. O hebraico desta expressão é difícil, e o sentido exato de מְגוּרֵי é discutido.'
    reason: alternative_reading
  - marker: b
    text: Bater na coxa era um gesto de tristeza, choque ou lamentação.
    reason: cultural_note
lexical_decisions:
- source_word: זְעַק
  choice: Clame
  rationale: O imperativo expressa um forte grito de aflição; “clame” é natural, digno e mantém a intensidade.
- source_word: וְהֵילֵל
  choice: e lamente
  rationale: O verbo indica lamentação em voz alta. “Lamente” comunica o luto profético sem a conotação animal que “uive” pode ter no português atual.
- source_word: בֶּן אָדָם
  choice: filho do homem
  rationale: Mantém a forma característica pela qual Deus se dirige a Ezequiel e permanece clara no português bíblico contemporâneo.
- source_word: כִּי הִיא הָיְתָה בְעַמִּי
  choice: pois ela veio contra o meu povo
  rationale: O pronome feminino provavelmente retoma a espada no contexto. O português permite conservar esse pronome, enquanto “veio contra” comunica a chegada hostil do juízo sem definir além do texto.
- source_word: הִיא בְּכָל נְשִׂיאֵי יִשְׂרָאֵל
  choice: ela veio contra todos os príncipes de Israel
  rationale: Mantém o mesmo sujeito feminino implícito e traduz ב em sentido hostil, adequado ao contexto da espada.
- source_word: נְשִׂיאֵי
  choice: príncipes
  rationale: O termo designa autoridades governantes; “príncipes” conserva sua especificidade política e é amplamente compreensível.
- source_word: מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: Eles foram entregues à espada
  rationale: Adota a interpretação passiva/resultativa segundo a qual os príncipes ficam entregues à morte pela espada, sem ocultar em nota a dificuldade do hebraico.
- source_word: אֶת עַמִּי
  choice: junto com o meu povo
  rationale: Entende אֶת em sentido associativo, vinculando o destino dos príncipes ao do povo.
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a reação simbólica decorrente do juízo anunciado.
- source_word: סְפֹק אֶל יָרֵךְ
  choice: bata na coxa
  rationale: Preserva o gesto físico de luto e choque em linguagem portuguesa direta e atual.
theological_decisions:
- issue: Referente do pronome feminino הִיא
  choice: Conservar o pronome feminino “ela”, entendido contextualmente como referência provável à espada.
  alternative: Explicitar “a espada” ou empregar uma formulação impessoal referente ao juízo.
  rationale: O contexto favorece a espada, mas o versículo não repete o substantivo. O pronome feminino em português preserva melhor essa coesão e evita transformar uma inferência contextual em explicitação absoluta.
- issue: Sentido da expressão obscura מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: Entender os príncipes como entregues à espada.
  alternative: Entender a expressão como “os terrores da espada vieram sobre o meu povo”.
  rationale: A leitura principal produz uma sequência coerente com os príncipes mencionados imediatamente antes, mas a dificuldade lexical genuína é mantida em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Conserva “filho do homem” e “príncipes” por sua função característica em Ezequiel. A repetição de “ela veio contra” reproduz a ênfase do hebraico sem resolver indevidamente o referente feminino.
