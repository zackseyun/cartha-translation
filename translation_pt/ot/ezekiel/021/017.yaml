  terminology: «Filho do homem», «príncipes» e «espada» são escolhas consistentes com o uso em Ezequiel. A nota sobre a dificuldade de מְגוּרֵי é pertinente, mas sua âncora deve estar na expressão que ela esclarece; a nota cultural deve ser ancorada no gesto de bater na coxa.
