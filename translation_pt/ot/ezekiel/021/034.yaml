  text: while they see false visions for you and divine lies for you[a], to place you on the necks of the slain wicked[c][b], whose day has come at the time of the punishment of the end.
translation:
  language: pt
  text: enquanto veem visões falsas a seu respeito e adivinham mentiras a seu respeito[a], para pôr você sobre os pescoços dos perversos que foram mortos[b], cujo dia chegou, no tempo do castigo final[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando veem falsidade a seu respeito e adivinham mentira a seu respeito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre os pescoços dos perversos que foram mortos”, imagem difícil; possivelmente, pôr você entre os que já foram mortos.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no tempo da iniquidade do fim” ou “no tempo da culpa final”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲזוֹת לָךְ שָׁוְא
  choice: enquanto têm para você visões falsas
  rationale: O infinitivo construto com בְּ tem valor temporal, e o contexto fornece como sujeito implícito os videntes ou adivinhos. “Visões falsas” expressa o sentido contextual de שָׁוְא sem reduzir o termo a mera vacuidade.
- source_word: בִּקְסָם לָךְ כָּזָב
  choice: e fazem para você adivinhações mentirosas
  rationale: A construção é paralela à anterior. Em português, “fazer adivinhações” comunica naturalmente o ato de praticar adivinhação, e “mentirosas” preserva כָּזָב como falsidade deliberadamente enganosa.
- source_word: לָתֵת אוֹתָךְ
  choice: para pôr você
  rationale: נתן com objeto e complemento introduzido por אֶל indica colocação. “Pôr” é corrente, direto e mantém a finalidade expressa pelo infinitivo.
- source_word: אֶל צַוְּארֵי
  choice: sobre o pescoço de
  rationale: A imagem concreta e difícil do hebraico é preservada, sem substituí-la no texto principal por uma interpretação como “entre os mortos”.
- source_word: חַלְלֵי רְשָׁעִים
  choice: os perversos mortos
  rationale: A cadeia construta é entendida como referência a pessoas perversas que foram mortas. A formulação é clara e mantém tanto o caráter moral quanto o destino violento dos referentes.
- source_word: אֲשֶׁר בָּא יוֹמָם
  choice: cujo dia chegou
  rationale: Mantém a imagem profética explícita do “dia” como ocasião chegada do juízo.
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: no tempo do castigo final
  rationale: Neste contexto judicial, עָוֹן pode designar a consequência da culpa, isto é, o castigo. קֵץ é tomado como qualificador de caráter terminal, embora a nota preserve outras análises possíveis da expressão comprimida.
theological_decisions:
- issue: Sentido de עֲוֺן na fórmula de juízo
  choice: castigo
  alternative: culpa; iniquidade
  rationale: A chegada do “dia” dos perversos favorece o sentido consequencial de punição. Como o substantivo também pode significar culpa ou iniquidade, essa polissemia é registrada em nota.
- issue: Imagem de pôr a espada sobre o pescoço dos mortos
  choice: preservar a imagem concreta
  alternative: fazer cair entre os perversos mortos; colocar junto aos perversos mortos
  rationale: O referente feminino implícito é a espada mencionada no contexto, e a metáfora é obscura. O texto mantém a formulação concreta em vez de resolver silenciosamente a dificuldade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa referente à espada é vertida por “você”, natural no português brasileiro; o gênero do referente fica disponível pelo contexto. A ordem das notas segue os pontos correspondentes no texto, e a ambiguidade da cláusula final é preservada em nota.
