  source_fidelity: A tradução reconhece corretamente as duas ações paralelas de visionar e adivinhar, a imagem deliberadamente obscura dos pescoços e o sentido judicial possível de עָוֺן. Contudo, “têm para você visões falsas” não traduz adequadamente o verbo חזה (“ver, ter visões”) nem a relação de לָךְ; “a seu respeito” é a solução portuguesa natural sem eliminar a referência contextual à espada.
  naturalness: “Têm para você visões falsas” é pouco idiomático e pode sugerir posse de visões destinadas ao destinatário. “Veem visões falsas a seu respeito” é mais claro. “Perversos mortos” é compreensível, mas “perversos que foram mortos” evita a leitura de que “mortos” seja mera qualidade e explicita o particípio passivo.
  terminology: “Adivinham mentiras” preserva melhor o paralelismo verbal e o objeto כָּזָב do que “fazem ... adivinhações mentirosas”. “Castigo final” é uma opção contextual legítima, desde que as alternativas “iniquidade” e “culpa” permaneçam em nota. A nota sobre a imagem não deve introduzir “a espada” ou “fazer cair”, que são explicações contextuais e não estão expressas no hebraico do versículo.
