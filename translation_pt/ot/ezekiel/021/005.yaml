  text: וָ/אֹמַ֕ר אֲהָ֖הּ אֲדֹנָ֣/י יְהוִ֑ה הֵ֚מָּה אֹמְרִ֣ים לִ֔/י הֲ/לֹ֛א מְמַשֵּׁ֥ל מְשָׁלִ֖ים הֽוּא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/005.yaml
  text: Then I said[a], “Ah, Lord GOD! They are saying of me[b], ‘Is he not a speaker of parables?’”
translation:
  language: pt
  text: 'Então eu disse: “Ah, Soberano Yahweh! Eles dizem a meu respeito[a]: ‘Não é ele alguém que fala por parábolas[b]?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles dizem a mim”. O hebraico pode indicar tanto o que dizem a Ezequiel como o que dizem a respeito dele.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica também pode ser traduzida por “alguém que profere ditos figurados”; pode sugerir fala figurada ou enigmática.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O waw com a forma verbal narrativa dá sequência ao discurso; “Então eu disse” expressa essa progressão com naturalidade em português.
- source_word: אֲהָהּ
  choice: Ah
  rationale: Interjeição de aflição ou lamento. “Ah” é atual e sóbria, sem o sentido triunfante que “Ahá” poderia sugerir.
- source_word: אֲדֹנָי יְהוִה
  choice: Soberano Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה, evitando a combinação pouco natural “Senhor SENHOR” e preservando o nome pactual.
- source_word: הֵמָּה אֹמְרִים לִי
  choice: Eles dizem a meu respeito
  rationale: No contexto, a expressão introduz a maneira como o povo caracteriza Ezequiel. A preposição ל pode, porém, também ser entendida como “a mim”, possibilidade preservada em nota.
- source_word: הֲלֹא
  choice: Não é ele
  rationale: Introduz uma pergunta retórica que espera concordância e fica natural no registro profético em português.
- source_word: מְמַשֵּׁל מְשָׁלִים
  choice: um contador de parábolas
  rationale: Reproduz a construção verbal-nominal baseada em משל e a caracterização habitual do profeta, sem limitar o sentido a enigmas nem acrescentar explicitamente um valor como “apenas”.
- source_word: הוּא
  choice: ele
  rationale: O pronome aponta diretamente para Ezequiel na fala citada.
theological_decisions:
- issue: Forma portuguesa do título divino אֲדֹנָי יְהוִה
  choice: Soberano Yahweh
  alternative: Senhor DEUS
  rationale: “Soberano Yahweh” comunica o valor titular de אֲדֹנָי e translitera o nome divino, sem confundir os dois elementos nem produzir “Senhor Senhor”.
- issue: Natureza da fala atribuída a Ezequiel
  choice: parábolas
  alternative: enigmas
  rationale: משל abrange provérbios, comparações e linguagem figurada. “Parábolas” mantém a amplitude tradicional; “enigmas” resolveria indevidamente a expressão como fala necessariamente obscura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “contador de parábolas” preserva o caráter nominal da expressão hebraica, enquanto as notas mantêm suas ambiguidades sintática e lexical.
