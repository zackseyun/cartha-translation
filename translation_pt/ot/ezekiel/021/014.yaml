  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֖ה אָמַ֣ר אֲדֹנָ֑/י אֱמֹ֕ר חֶ֥רֶב חֶ֛רֶב הוּחַ֖דָּה וְ/גַם מְרוּטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/014.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Say, “A sword, a sword, sharpened and also polished.”’'
translation:
  language: pt
  text: 'Filho do homem, profetize e diga: “Assim diz o Senhor: Diga:


    ‘Uma espada! Uma espada!

    Foi afiada

    e também polida[a]!’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brunida”. O termo hebraico descreve uma lâmina alisada até ficar brilhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma característica com que Ezequiel é interpelado e corresponde diretamente ao hebraico, sem substituir a expressão por uma interpretação como “mortal”.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: É o imperativo do verbo נבא e expressa de modo claro e atual a ordem de proclamar uma mensagem profética.
- source_word: וְאָמַרְתָּ
  choice: e diga
  rationale: Traduz naturalmente a ordem coordenada que segue “profetize”, sem recorrer a uma construção excessivamente literal.
- source_word: כֹּה אָמַר אֲדֹנָי
  choice: Assim diz o Senhor
  rationale: Mantém a fórmula profética solene. O texto hebraico fornecido traz o título אֲדֹנָי, traduzido diretamente por “o Senhor”, sem acrescentar o nome divino.
- source_word: אֱמֹר
  choice: Diga
  rationale: Conserva a segunda ocorrência do verbo אמר e introduz a proclamação citada.
- source_word: חֶרֶב חֶרֶב
  choice: Uma espada! Uma espada!
  rationale: Mantém a repetição enfática; a pontuação exclamativa reproduz sua força poética e alarmante em português.
- source_word: הוּחַדָּה
  choice: Foi afiada
  rationale: 'Reproduz a forma passiva e o aspecto de ação concluída: a espada foi preparada e está pronta.'
- source_word: וְגַם
  choice: e também
  rationale: Preserva o sentido aditivo e cumulativo da expressão hebraica.
- source_word: מְרוּטָה
  choice: polida
  rationale: Indica que a lâmina foi alisada e ganhou brilho; “polida” é corrente, clara e adequada ao contexto de preparação da espada.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: o Soberano Senhor
  rationale: O hebraico apresentado contém אֲדֹנָי, sem o tetragrama. “O Senhor” traduz o título diretamente e evita acrescentar “Soberano” ou introduzir o nome divino onde ele não aparece no texto-fonte fornecido.
translation_notes:
  register: Português atual, solene e acessível, com boa legibilidade no Brasil e compreensão internacional. A disposição em versos e as exclamações preservam a intensidade poética e a repetição enfática do hebraico. As citações aninhadas distinguem a fórmula do mensageiro da proclamação sobre a espada.
