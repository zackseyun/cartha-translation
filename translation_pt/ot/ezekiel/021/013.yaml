  text: 'And the word of Yahweh came to me[a], saying:'
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “SENHOR”; alternativamente transliterado “Yahweh”.
    reason: Registra tanto a forma hebraica quanto a tradução tradicional e esclarece a opção adotada no texto.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética וַיְהִי דְבַר־יְהוָה, “veio” expressa de modo natural em português a chegada da palavra ao profeta, sem reproduzir de forma rígida o hebraísmo “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na construção דְבַר יְהוָה, “a palavra” é a tradução tradicional e precisa para a revelação profética; “mensagem” seria possível, mas reduziria a correspondência lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa diretamente o movimento da palavra em direção ao profeta e integra-se naturalmente à construção portuguesa “veio a mim”.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Preserva o infinitivo hebraico que introduz a fala divina subsequente e os dois-pontos sinalizam o início de seu conteúdo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal, enquanto “SENHOR” representa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima da fórmula profética hebraica. A colocação do marcador imediatamente após “Yahweh” identifica sem ambiguidade o termo explicado pela nota.
