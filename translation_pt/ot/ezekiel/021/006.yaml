lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה אלי, «veio» é natural em português e expressa adequadamente a chegada da revelação ao profeta.
- source_word: דְבַר
  choice: a palavra
  rationale: Preserva a fórmula profética tradicional e a ligação direta com a comunicação verbal divina; «mensagem» seria possível, mas mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com o sufixo de primeira pessoa e soa natural na construção «veio a mim».
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo introduz a fala divina que segue; «dizendo» conserva a forma da fórmula hebraica, e os dois-pontos cumprem naturalmente essa função em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. «Yahweh» o representa diretamente, enquanto «SENHOR» o substitui por um título e «Jeová» reflete uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com formulação profética reconhecível. A construção «veio a mim» mantém a direção expressa no hebraico sem rigidez excessiva.
