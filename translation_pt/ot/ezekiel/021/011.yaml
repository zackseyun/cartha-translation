base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/011.yaml
  text: And you[a], son of man, groan with breaking loins, and in bitterness you shall groan before their eyes.
translation:
  language: pt
  text: E você, filho do homem, geme com quebrantamento dos lombos[a] e, em amargura, gemerás diante dos olhos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os lombos quebrados” ou “com o rompimento dos lombos”. A imagem hebraica expressa intensa angústia física.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a forma consagrada e recorrente do tratamento divino dirigido a Ezequiel, sem lhe atribuir aqui um sentido messiânico.
- source_word: הֵאָנַח / תֵּאָנַח
  choice: gema / gema
  rationale: O verbo אנח expressa lamento audível e fisicamente intenso. A forma imperativa portuguesa comunica naturalmente a força injuntiva dos dois verbos hebraicos.
- source_word: בְּשִׁבְרוֹן מָתְנַיִם
  choice: com os lombos quebrantados
  rationale: Preserva a imagem corporal concreta de שִׁבְרוֹן, 'quebrantamento, fratura, esmagamento', e de מָתְנַיִם, 'lombos, cintura, quadris', em português digno e compreensível.
- source_word: וּבִמְרִירוּת
  choice: amargamente
  rationale: Traduz o modo do gemido com naturalidade, mantendo a ideia de amargura sem especificá-la indevidamente como uma emoção única, tal como tristeza ou desespero.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Conserva a expressão visual concreta do hebraico e indica que a ação deve ocorrer publicamente à vista deles.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “gema” preserva a insistência do hebraico; “lombos” mantém a imagem corporal antiga, esclarecida em nota.
