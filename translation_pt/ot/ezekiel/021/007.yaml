  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַטֵּ֖ף אֶל מִקְדָּשִׁ֑ים וְ/הִנָּבֵ֖א אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/007.yaml
  text: Son of man[a], set your face toward Jerusalem, and preach toward the sanctuaries, and prophesy against the land of Israel.
translation:
  language: pt
  text: Filho do homem, volte o rosto para Jerusalém, dirija sua proclamação aos santuários[a] e profetize contra a terra de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “deixe [suas palavras] gotejarem em direção aos santuários”; expressão profética que significa proclamar uma mensagem, neste caso de juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma idiomática hebraica usada repetidamente como tratamento dirigido a Ezequiel; aqui é uma designação vocacional, não necessariamente um título messiânico.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: volte o rosto para
  rationale: Expressa de modo natural a orientação deliberada e confrontadora da expressão hebraica, conservando sua imagem corporal.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: וְהַטֵּף אֶל
  choice: dirija sua proclamação aos
  rationale: נטף significa literalmente 'gotejar', mas aqui funciona como expressão profética para proferir uma mensagem. A preposição אֶל indica a direção aos santuários; o teor adversativo decorre do contexto de juízo, sem precisar ser imposto lexicalmente.
- source_word: מִקְדָּשִׁים
  choice: os santuários
  rationale: Mantém o plural hebraico e a referência abrangente a lugares ou recintos santos.
- source_word: וְהִנָּבֵא אֶל
  choice: profetize contra
  rationale: No contexto explícito de juízo, 'contra' comunica adequadamente a orientação hostil da profecia, embora אֶל por si só possa ter sentido direcional.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: a terra de Israel
  rationale: No contexto do oráculo, אֲדָמָה designa o território de Israel, não apenas o solo físico.
theological_decisions:
- issue: Sentido da expressão profética וְהַטֵּף אֶל em um oráculo de juízo
  choice: dirija sua proclamação aos santuários
  alternative: deixe suas palavras gotejarem contra os santuários
  rationale: A tradução principal comunica o ato profético de modo inteligível, enquanto a nota conserva a metáfora concreta do hebraico. 'Aos' preserva a direção gramatical sem apagar o contexto geral de juízo.
- issue: Valor de בֶּן אָדָם como forma de tratamento
  choice: Filho do homem
  alternative: mortal
  rationale: A formulação tradicional preserva o idioma hebraico e a função recorrente do tratamento a Ezequiel, sem transformá-lo aqui em título cristológico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura em três imperativos paralelos foi preservada; a metáfora incomum de נטף foi explicada em nota.
