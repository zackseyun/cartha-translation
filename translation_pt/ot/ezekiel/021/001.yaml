  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética וַיְהִי דְבַר־יְהוָה אֵלַי, «veio» expressa com naturalidade em português a chegada da comunicação divina, sem o artificialismo de uma tradução estritamente literal como «foi».
- source_word: דְבַר
  choice: A palavra
  rationale: Neste contexto, דָּבָר designa a comunicação divina falada. «A palavra» conserva a fórmula profética tradicional e seu peso teológico, enquanto «mensagem» seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Reproduz diretamente a preposição אֶל com o sufixo da primeira pessoa, indicando que a palavra foi dirigida ao profeta.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala divina subsequente; «dizendo» preserva a ligação sintática com o próximo versículo e é natural nessa fórmula solene.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. «Yahweh» preserva o nome pessoal em forma transliterada, sem substituí-lo pelo título «Senhor» nem adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência profética e a continuidade com a fala que começa no versículo seguinte. Não se incluiu a nota inglesa [a], pois ela apenas repete exatamente o sentido já expresso no texto e não documenta uma variante real.
