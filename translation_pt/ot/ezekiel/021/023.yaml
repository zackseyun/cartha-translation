  text: And the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה introduz a fórmula profética; em português, ela é expressa naturalmente pelo verbo “veio”, sem o literalismo desnecessário “e aconteceu”.
- source_word: דְבַר
  choice: a palavra de
  rationale: Na construção דְבַר יְהוָה, “a palavra de” preserva a fórmula profética tradicional e sua ressonância teológica; a determinação da expressão inteira torna natural o artigo definido em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a direção da palavra ao profeta e se ajusta à construção portuguesa “veio a mim”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo hebraico introduz a fala direta; “dizendo” conserva a fórmula e prepara naturalmente a declaração seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula profética reconhecível. O conectivo hebraico inicial não foi vertido por “E”, pois o versículo inicia uma nova unidade discursiva em português; os dois-pontos indicam que a fala divina vem a seguir.
