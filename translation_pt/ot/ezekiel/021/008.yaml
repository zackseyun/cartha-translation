  text: וְ/אָמַרְתָּ֞ לְ/אַדְמַ֣ת יִשְׂרָאֵ֗ל כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֣י אֵלַ֔יִ/ךְ וְ/הוֹצֵאתִ֥י חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ צַדִּ֥יק וְ/רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/008.yaml
  text: 'And say to the land of Israel[a], ‘Thus says Yahweh: Behold, I am against you, and I will draw my sword from its sheath and cut off from you both righteous and wicked.’'
translation:
  language: pt
  text: 'E diga à terra de Israel: “Assim diz Yahweh: Eis que estou contra você. Sacarei minha espada da bainha e eliminarei do seu meio tanto o justo como o perverso[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o justo e o perverso”. O hebraico nomeia explicitamente os dois grupos, ressaltando o alcance abrangente do juízo anunciado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: terra de Israel
  rationale: Embora אֲדָמָה possa designar o solo ou o chão, aqui a expressão dirige-se profeticamente ao território e, por extensão, aos seus habitantes; “terra de Israel” é natural e preserva essa personificação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הִנְנִי אֵלַיִךְ
  choice: Eis que estou contra você
  rationale: Preserva a ênfase de הִנְנִי e o sentido de oposição ou confronto transmitido por אֵלַיִךְ; “você” retoma naturalmente a terra personificada.
- source_word: וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  choice: Tirarei a minha espada da bainha
  rationale: Reproduz de modo idiomático a ação de fazer sair a espada de seu estojo, mantendo a imagem concreta do juízo divino.
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: e eliminarei do seu meio
  rationale: כרת no hifil significa cortar ou eliminar. Neste contexto, “eliminarei do seu meio” comunica com naturalidade a remoção de pessoas da terra personificada, sem reduzir a força judicial da expressão.
- source_word: צַדִּיק וְרָשָׁע
  choice: tanto o justo como o perverso
  rationale: Nomeia explicitamente as duas categorias e torna clara, em português corrente, a abrangência do juízo anunciado.
theological_decisions:
- issue: Alcance do juízo sobre “o justo e o perverso”
  choice: O juízo da espada atingirá tanto o justo como o perverso na terra.
  alternative: A frase pode ser entendida em sentido retórico ou coletivo, sem negar as distinções da justiça individual.
  rationale: O hebraico menciona diretamente as duas categorias. A tradução conserva essa tensão sem explicar ou harmonizar o enunciado com outros textos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula profética mantém solenidade sem arcaísmo excessivo; “Eis que” preserva a ênfase de apresentação, e “bainha” conserva a imagem concreta da espada.
