base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/021.yaml
  text: Gather yourself[a]; go to the right; set yourself to the left[c][b], wherever your face is appointed.
translation:
  language: pt
  text: Reúne-te[a]; vai para a direita; posiciona-te à esquerda, para onde quer que o teu rosto[b] esteja destinado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Une-te”, “Concentra-te” ou, neste contexto, “Agrupa-te”. O verbo hebraico é raro e reflexivo, provavelmente indicando concentração ou consolidação antes do ataque.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o teu rosto”. Em hebraico, a expressão também pode indicar a direção para a qual alguém está voltado.
    reason: lexical_alternative
  - marker: c
    text: Ou “esteja dirigido” ou “esteja voltado”.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְאַחֲדִי
  choice: Reúne-te
  rationale: Imperativo reflexivo feminino singular de uma forma rara. No contexto marcial, comunica concentração ou consolidação antes do golpe, preservando tanto a força reflexiva quanto a concisão do hebraico.
- source_word: הֵימִנִי
  choice: vai para a direita
  rationale: Imperativo derivado do termo para o lado direito. A formulação é uma ordem direcional clara e natural em português.
- source_word: הָשִׂימִי הַשְׂמִילִי
  choice: posiciona-te à esquerda
  rationale: A sequência combina o imperativo de שׂים, usado aqui reflexivamente, com a indicação do lado esquerdo. A tradução conserva o paralelismo direcional e o tom militar conciso.
- source_word: אָנָה
  choice: para onde quer que
  rationale: Advérbio interrogativo ou indefinido de direção; no contexto, introduz o destino para o qual a figura personificada deve voltar-se.
- source_word: פָּנַיִךְ
  choice: o teu rosto
  rationale: Mantém a imagem concreta do hebraico e a referência feminina singular do sufixo. Em linguagem direcional, “rosto” pode representar a direção para a qual alguém está voltado.
- source_word: מֻעָדוֹת
  choice: esteja designado
  rationale: Forma passiva de יעד, com a ideia de estar fixado, assinalado ou dirigido a um destino. “Designado” conserva a passividade sem especificar indevidamente quem determina a direção.
theological_decisions:
- issue: Destinatário personificado e imagem marcial
  choice: Manter os imperativos dirigidos à figura personificada sem acrescentar “ó espada” ao versículo.
  alternative: Explicitar “ó espada” ou interpretar as ordens como dirigidas a um exército.
  rationale: Os imperativos hebraicos estão no feminino singular, e o contexto imediato personifica a espada. Não nomear o destinatário neste versículo preserva a formulação abrupta do texto e evita inserir palavras ausentes do original.
- issue: Agente da direção designada
  choice: Preservar a construção passiva “esteja designado”.
  alternative: Explicitar que Deus dirige a espada, ou traduzir simplesmente “para onde estiveres voltada”.
  rationale: O texto não identifica aqui o agente da designação. A forma passiva conserva a tensão entre ordem, destino e determinação divina sem resolver além do que a fonte permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos na segunda pessoa para conservar a forma feminina singular e a personificação presentes no hebraico. A sintaxe permanece curta e marcial; “Reúne-te” e “posiciona-te” são transparentes, embora de registro ligeiramente elevado.
