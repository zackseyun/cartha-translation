base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/019.yaml
  text: And you[a], son of man, prophesy and strike palm to palm, and let the sword be doubled a third time—the sword of the slain. It is the sword of the great slain one[c][b], the one that presses in on them.
translation:
  language: pt
  text: E você, filho do homem, profetize e bata uma palma contra a outra[a]. Que a espada seja dobrada pela terceira vez[b] — a espada dos abatidos. É a espada do grande abatido, a que irrompe contra eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bata palmas”. O hebraico diz literalmente “bata palma contra palma” e descreve um gesto profético.
    reason: lexical_alternative
  - marker: b
    text: Ou “seja triplicada”. A expressão hebraica pode indicar que a espada age pela terceira vez ou que é intensificada de modo tríplice.
    reason: lexical_alternative
  - marker: c
    text: Ou “a que os penetra” ou “a que os cerca”. O particípio pode transmitir a ideia de entrar, irromper de modo opressivo ou cercar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a fórmula característica com que Ezequiel é interpelado e preserva de modo transparente o idioma hebraico.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: O imperativo expressa a comissão profética; como não há objeto explícito nesta oração, a forma simples é a mais adequada.
- source_word: וְהַךְ כַּף אֶל כָּף
  choice: e bata uma palma contra a outra
  rationale: Reproduz com naturalidade o gesto profético descrito literalmente no hebraico, sem reduzi-lo apenas à ideia comum de aplaudir.
- source_word: וְתִכָּפֵל חֶרֶב
  choice: Que a espada seja duplicada
  rationale: Preserva a voz passiva e o valor volitivo ou jussivo da forma verbal, mantendo a espada como sujeito.
- source_word: שְׁלִישִׁתָה
  choice: pela terceira vez
  rationale: Expressa a possível ideia de uma terceira ocorrência, sem ocultar que a forma também pode indicar uma intensificação tríplice.
- source_word: חֶרֶב חֲלָלִים
  choice: a espada dos mortos
  rationale: Mantém a construção nominal que associa a espada às pessoas abatidas por ela; 'mortos' é claro e corrente em português.
- source_word: חֶרֶב חָלָל הַגָּדוֹל
  choice: a espada do grande ferido de morte
  rationale: Conserva o singular concreto de חָלָל e comunica que se trata de alguém mortalmente ferido ou abatido, em vez de transformar a expressão em 'grande matança'.
- source_word: הַחֹדֶרֶת לָהֶם
  choice: a que avança contra eles
  rationale: Comunica o movimento hostil de penetração ou invasão sugerido pelo particípio, respeitando o uso da preposição ל sem impor uma imagem excessivamente gráfica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o ritmo imperativo e a imagem profética do original. As ambiguidades relativas à repetição tríplice da espada e ao sentido do particípio final são mantidas em notas, sem resolver além da evidência hebraica.
