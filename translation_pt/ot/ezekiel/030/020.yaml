  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/שִׁבְעָ֣ה לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/020.yaml
  text: And it happened in the eleventh year, in the first month, on the seventh day of the month, that the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'No décimo primeiro ano, no primeiro mês, no sétimo dia do mês, a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[incorporado na oração: “a palavra ... veio”]'
  rationale: A forma narrativa introduz o aviso profético datado. Em português, omitir um “aconteceu que” independente evita redundância e preserva com naturalidade a função discursiva.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: No décimo primeiro ano
  rationale: A construção cardinal hebraica tem valor ordinal na fórmula de datação; esta é a expressão idiomática em português.
- source_word: בָּרִאשׁוֹן
  choice: no primeiro mês
  rationale: O adjetivo substantivado se refere ao primeiro mês; explicitar “mês” dá clareza em português.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: no sétimo dia do mês
  rationale: Reproduz claramente a data indicada pelo idiomatismo hebraico, literalmente “no sete do mês”.
- source_word: הָיָה דְבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: É a forma portuguesa natural da fórmula profética, em que היה indica que a palavra divina chegou ao profeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Equivalente direto e natural da preposição com o sufixo de primeira pessoa.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula que introduz o discurso direto e sinaliza que a mensagem continua no versículo seguinte.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, sem o substituir pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. A ordem das expressões de data segue o hebraico, enquanto a construção inicial foi ajustada à sintaxe natural do português.
