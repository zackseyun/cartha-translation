base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/005.yaml
  text: Cush and Put and Lud and all the mixed people and Cub and the sons of the land of the covenant—with them they will fall by the sword[a][b][c].
translation:
  language: pt
  text: Cuxe, Pute, Lude, toda a população mista[a], Cube[b] e os filhos da terra da aliança[c] cairão com eles pela espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a Arábia”, “todos os mercenários” ou “toda a multidão mista”. O sentido do termo hebraico neste contexto é debatido.
    reason: lexical_alternative
  - marker: b
    text: “Cube” é um topônimo raro, cuja identificação é incerta. Também pode ser transliterado “Kub”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o povo da terra da aliança”. A expressão pode designar pessoas ligadas por tratado; alguns a entendem como referência a judeus que viviam no Egito.
    reason: alternative_reading
lexical_decisions:
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Transliteração portuguesa tradicional do nome etnogeográfico hebraico, sem o identificar de modo impreciso com a Etiópia moderna.
- source_word: פּוּט
  choice: Pute
  rationale: Forma aportuguesada corrente do nome próprio hebraico.
- source_word: לוּד
  choice: Lude
  rationale: Preserva o nome hebraico sem impor a identificação interpretativa com a Lídia ou os lídios.
- source_word: כָל הָעֶרֶב
  choice: toda a população mista
  rationale: Expressa de forma natural o provável sentido de um agrupamento populacional misto; a incerteza lexical é preservada em nota.
- source_word: כּוּב
  choice: Cube
  rationale: Transliteração portuguesa de um topônimo raro e de identificação incerta.
- source_word: בְנֵי אֶרֶץ הַבְּרִית
  choice: os filhos da terra da aliança
  rationale: Mantém de perto a formulação hebraica e sua ambiguidade quanto à identidade do grupo e à natureza da aliança.
- source_word: אִתָּם
  choice: com eles
  rationale: Reproduz diretamente a ideia de associação com os povos mencionados anteriormente.
- source_word: בַּחֶרֶב
  choice: pela espada
  rationale: Preserva a imagem hebraica convencional de morte em guerra ou juízo.
- source_word: יִפֹּלוּ
  choice: cairão
  rationale: Mantém o sentido literal e a força do idioma profético, no qual cair implica morrer em combate.
theological_decisions:
- issue: Identidade dos “filhos da terra da aliança”
  choice: Preservar a expressão ambígua no texto principal.
  alternative: Interpretar como aliados por tratado ou como judeus residentes no Egito.
  rationale: O hebraico não identifica inequivocamente o referente; explicitá-lo no corpo do texto resolveria uma incerteza genuína.
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais aportuguesadas dos nomes. A sintaxe conserva a enumeração solene do oráculo e mantém as ambiguidades do hebraico.
