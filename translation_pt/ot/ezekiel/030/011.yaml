base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/011.yaml
  text: He and his people with him—the ruthless of the nations—will be brought in to destroy the land[a]. They will draw their swords against Egypt and fill the land with the slain.
translation:
  language: pt
  text: Ele e seu povo com ele — os cruéis das nações — serão trazidos para devastar a terra. Eles desembainharão suas espadas contra o Egito e encherão a terra de mortos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Preserva o sentido comum de עַם sem especificar além do hebraico que se trata de um exército, embora o contexto seja militar.
- source_word: עָרִיצֵי גוֹיִם
  choice: os cruéis entre as nações
  rationale: עָרִיץ caracteriza pessoas violentas, implacáveis ou aterradoras. A formulação evita introduzir um superlativo inexistente no hebraico e é natural em português.
- source_word: מוּבָאִים
  choice: serão trazidos
  rationale: O particípio hofal de בוא exprime ação passiva causativa; o futuro corresponde ao contexto profético e aos verbos seguintes.
- source_word: לְשַׁחֵת
  choice: para devastar
  rationale: No contexto de uma invasão contra um território, שׁחת indica causar ruína ou destruição; “devastar” comunica naturalmente essa ação sobre a terra.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Aqui אֶרֶץ designa o território do Egito, não o planeta; “a terra” preserva a formulação hebraica e o referente contextual.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם עַל
  choice: Eles desembainharão suas espadas contra
  rationale: A expressão idiomática com ריק e “espadas” descreve sacar ou desembainhar as armas para atacar.
- source_word: מָלְאוּ אֶת־הָאָרֶץ חָלָל
  choice: encherão a terra de mortos
  rationale: חָלָל designa os mortos, especialmente os abatidos em combate; “mortos” é claro, digno e natural em português.
theological_decisions: []
