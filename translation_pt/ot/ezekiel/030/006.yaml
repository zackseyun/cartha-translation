  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה וְ/נָֽפְלוּ֙ סֹמְכֵ֣י מִצְרַ֔יִם וְ/יָרַ֖ד גְּא֣וֹן עֻזָּ֑/הּ מִ/מִּגְדֹּ֣ל סְוֵנֵ֗ה בַּ/חֶ֨רֶב֙ יִפְּלוּ בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/006.yaml
  text: 'Thus says Yahweh: The supporters of Egypt will fall[a], and the pride of her strength will come down. From Migdol to Syene they will fall by the sword within her[c][b], declares the Lord GOD.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Os que sustentam o Egito cairão, e o orgulho da sua força[a] descerá. De Migdol a Siene,[b] cairão à espada nela[c]”, declara o Senhor Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a majestade da sua força”.'
    reason: lexical_alternative
  - marker: b
    text: Migdol e Siene assinalam a extensão do Egito de norte a sul.
    reason: cultural_note
  - marker: c
    text: 'Ou: “nela cairão à espada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Reproduz a fórmula profética de mensageiro e translitera o nome divino, distinguindo-o do título אֲדֹנָי.
- source_word: סֹמְכֵי מִצְרַיִם
  choice: os que sustentam o Egito
  rationale: O particípio de סמך indica quem sustenta ou apoia; a formulação mantém o sentido ativo sem restringi-lo indevidamente a aliados militares.
- source_word: וְנָפְלוּ
  choice: cairão
  rationale: O futuro comunica naturalmente o anúncio profético de juízo.
- source_word: גְּאוֹן עֻזָּהּ
  choice: o orgulho da força dele
  rationale: Preserva a construção compacta entre גאון, que pode indicar orgulho, exaltação ou majestade, e עז, força ou poder. O pronome masculino decorre do gênero de “Egito” em português.
- source_word: וְיָרַד
  choice: será rebaixado
  rationale: Expressa idiomaticamente a descida figurada da posição elevada do Egito; embora o hebraico seja formalmente intransitivo, o português natural emprega aqui uma construção passiva sem identificar um agente.
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: De Migdol a Siene
  rationale: Os topônimos delimitam a extensão do Egito, do norte ao sul; “de... a...” comunica de modo conciso essa abrangência geográfica.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: É a expressão portuguesa tradicional e clara para morte em guerra ou execução de juízo.
- source_word: יִפְּלוּ בָהּ
  choice: cairão dentro dele
  rationale: Mantém a referência pronominal ao Egito como território. A mudança do feminino hebraico para o masculino português é exigida pelo gênero gramatical do nome do país.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Conserva tanto o título אֲדֹנָי quanto o nome divino יְהוִה, evitando fundi-los ou ocultar a repetição do nome pactual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva explicitamente o nome divino presente no hebraico e permite distinguir יְהוָה do título אֲדֹנָי na fórmula final.
- issue: Sentido de גְּאוֹן עֻזָּהּ
  choice: o orgulho da força dele
  alternative: a majestade do seu poder
  rationale: “Orgulho” se ajusta ao contexto de juízo contra a exaltação do Egito, mas a nota mantém visível a possibilidade lexical de majestade ou esplendor, sem eliminar a tensão do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “Egito” no masculino, conforme a gramática portuguesa, embora o referente seja feminino no hebraico. As aspas delimitam o oráculo e deixam a fórmula final de declaração fora da fala citada.
