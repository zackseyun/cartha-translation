revisions:
- from: 'Assim diz Yahweh: “Os que sustentam o Egito cairão, e o orgulho da força dele será rebaixado.[a] De Migdol a Siene,[b] cairão à espada dentro dele”,[c] declara o Senhor Yahweh.'
  to: 'Assim diz Yahweh: “Os que sustentam o Egito cairão, e o orgulho da sua força[a] descerá. De Migdol a Siene,[b] cairão à espada nela[c]”, declara o Senhor Yahweh.'
  rationale: A revisão restaura o valor intransitivo de וְיָרַד com «descerá», conserva a ambiguidade referencial de בָהּ por meio de «nela» e ajusta as âncoras e o teor das notas para que correspondam às alternativas efetivamente indicadas pelo hebraico. Não altera o sentido do anúncio profético.
