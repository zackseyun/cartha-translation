id: EZK.30.12
reference: Ezekiel 30:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י יְאֹרִים֙ חָֽרָבָ֔ה וּ/מָכַרְתִּ֥י אֶת הָ/אָ֖רֶץ בְּ/יַד רָעִ֑ים וַ/הֲשִׁמֹּתִ֞י אֶ֤רֶץ וּ/מְלֹאָ/הּ֙ בְּ/יַד זָרִ֔ים אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/012.yaml
  text: And I will make the Nile channels dry[a], and I will sell the land into the hand of evil men; and I will devastate the land and its fullness by the hand of foreigners. I am Yahweh[c][b]; I have spoken.
translation:
  language: pt
  text: Farei secar os canais do Nilo[a] e venderei a terra ao poder de homens maus[b]. Devastarei a terra e tudo o que nela há[c] por meio de estrangeiros. Eu, Yahweh, falei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os canais” ou “os rios”; no contexto do Egito, o termo provavelmente se refere às vias fluviais do Nilo.
    reason: lexical_alternative
  - marker: b
    text: Ou “entregarei a terra”; o verbo hebraico significa literalmente “vender” e, nesta imagem de juízo, indica entregar a terra ao domínio de inimigos.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a terra e a sua plenitude”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרִים
  choice: os canais do Nilo
  rationale: No contexto egípcio, o termo designa as vias fluviais do Nilo, incluindo seus canais e braços, e não rios em sentido genérico.
- source_word: חָרָבָה
  choice: secar
  rationale: Com נָתַתִּי, expressa tornar secos os canais; a construção verbal é natural e clara em português.
- source_word: וּמָכַרְתִּי
  choice: venderei
  rationale: Preserva a imagem concreta do verbo מכר, embora aqui ela signifique entregar a terra ao domínio hostil.
- source_word: בְּיַד רָעִים
  choice: ao poder de homens maus
  rationale: Traduz o sentido idiomático de 'na mão de' como sujeição ao poder de alguém, mantendo o valor substantivado do plural masculino רָעִים.
- source_word: וַהֲשִׁמֹּתִי
  choice: Devastarei
  rationale: Comunica de modo atual e vigoroso a força causativa do hifil de שמם.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: a terra e tudo o que nela há
  rationale: 'Expressa naturalmente o merismo hebraico: a terra juntamente com tudo o que a preenche.'
- source_word: בְּיַד זָרִים
  choice: por meio de estrangeiros
  rationale: Aqui בְּיַד indica o agente usado para executar a devastação; 'estrangeiros' comunica invasores de fora sem acrescentar uma identidade específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: Mantém a fórmula profética enfática e conclusiva em português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Imagem de Deus 'vendendo' a terra
  choice: venderei
  alternative: entregarei
  rationale: A tradução mantém a metáfora judicial forte e teologicamente tensa do hebraico, enquanto a nota esclarece seu sentido contextual sem apagá-la.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a metáfora de ''vender'', mas verte as expressões com בְּיַד de acordo com suas funções contextuais: domínio no primeiro caso e agência no segundo.'
