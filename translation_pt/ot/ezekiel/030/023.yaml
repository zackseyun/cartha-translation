- from: E espalharei o Egito entre as nações[a] e os dispersarei entre as terras.
  to: E espalharei o Egito entre as nações[a] e os dispersarei entre os países.
  rationale: A revisão limita-se a substituir “entre as terras” por “entre os países”, uma formulação mais idiomática em português para a dispersão entre vários territórios. Mantêm-se a metonímia “Egito” e a retomada plural “os”, explicitadas pela nota.
