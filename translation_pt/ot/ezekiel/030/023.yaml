  text: וַ/הֲפִצוֹתִ֥י אֶת מִצְרַ֖יִם בַּ/גּוֹיִ֑ם וְ/זֵרִיתִ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/023.yaml
  text: And I will scatter Egypt among the nations[a], and I will disperse them among the lands.
translation:
  language: pt
  text: E espalharei o Egito entre as nações[a] e os dispersarei entre os países.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Egito” na primeira oração e “os” na segunda; o nome da nação representa seu povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: espalharei
  rationale: O hifil de פוץ expressa a ação causativa de espalhar. Em português, “espalharei” comunica naturalmente a ação divina sem tornar a formulação pesada.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: O texto traz o nome da nação, que aqui representa metonimicamente seus habitantes. Mantê-lo preserva a formulação hebraica e a passagem posterior ao pronome plural.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם significa normalmente “nações”, e a preposição indica a dispersão no meio delas.
- source_word: וְזֵרִיתִם
  choice: e os dispersarei
  rationale: זרה pode significar “espalhar”, “dispersar” ou “joeirar”. “Dispersarei” preserva a variação verbal do paralelismo e explicita o sufixo masculino plural.
- source_word: בָּאֲרָצוֹת
  choice: entre as terras
  rationale: O plural אֲרָצוֹת refere-se a diversas terras ou países. “Entre as terras” acompanha a preposição hebraica e mantém o paralelismo com “entre as nações”.
theological_decisions:
- issue: Mudança do nome singular “Egito” para o sufixo pronominal plural
  choice: Manter “o Egito” na primeira oração e traduzir o sufixo plural por “os” na segunda.
  alternative: Traduzir desde o início como “os egípcios” para uniformizar a referência.
  rationale: A construção hebraica passa do nome da nação a um pronome plural, tratando o Egito como representante coletivo de seu povo. A tradução conserva essa característica sem resolver silenciosamente a mudança.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. O pronome “os” retoma os habitantes representados coletivamente por “o Egito”.
