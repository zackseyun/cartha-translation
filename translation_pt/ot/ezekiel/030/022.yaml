base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/022.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against Pharaoh king of Egypt, and I will break his arms, both the strong one and the broken one, and I will make the sword fall from his hand.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: “Eis que estou contra o faraó, rei do Egito. Quebrarei os seus braços, o braço forte e o braço quebrado, e farei a espada cair da mão dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente do juízo anunciado no contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem solene e reconhecível.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e preserva explicitamente o nome da aliança.
- source_word: הִנְנִי אֶל
  choice: Eis que estou contra
  rationale: Mantém a ênfase da autodeclaração divina e o sentido hostil da preposição neste contexto.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: o faraó, rei do Egito
  rationale: A construção apositiva é clara e natural em português.
- source_word: וְשָׁבַרְתִּי אֶת זְרֹעֹתָיו
  choice: Quebrarei os seus braços
  rationale: Conserva a imagem concreta dos braços como representação do poder militar, sem substituí-la por uma interpretação abstrata.
- source_word: אֶת הַחֲזָקָה וְאֶת הַנִּשְׁבָּרֶת
  choice: tanto o forte como o que já está quebrado
  rationale: Os qualificativos femininos singulares retomam cada braço. A forma passiva נִשְׁבָּרֶת descreve um braço em estado de quebrado; “já” torna natural o contraste contextual sem alterar a referência.
- source_word: וְהִפַּלְתִּי אֶת הַחֶרֶב מִיָּדוֹ
  choice: e farei a espada cair da mão dele
  rationale: Reproduz o valor causativo do hifil e a imagem vívida da perda da capacidade de combate.
theological_decisions:
- issue: Tradução do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR / o Senhor Deus
  rationale: A opção mantém separado o título “Senhor” do nome próprio Yahweh, evitando ocultar o tetragrama ou produzir a repetição “Senhor SENHOR”.
- issue: Sentido dos braços do faraó
  choice: manter a imagem literal de ambos os braços
  alternative: explicitar como poder ou força militar
  rationale: O texto associa diretamente braços, mão e espada. A metáfora comunica a destruição do poder militar sem precisar ser resolvida no corpo do versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sintaxe acompanha de perto a progressão do hebraico, mas usa pontuação e formas naturais em português. Não foi incluída nota, pois a retomada de “braços” por “o forte” e “o que já está quebrado” permanece compreensível no texto.
