  yaml_path: translation/ot/ezekiel/030/014.yaml
  text: I will make Pathros desolate[a], and I will set fire in Zoan[c][b], and I will execute judgments on No.
translation:
  language: pt
  text: Farei de Patros uma desolação[a], porei fogo em Zoã[b] e executarei juízos em Nô[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devastarei Patros”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “acenderei um fogo em Zoã”. Literalmente: “darei fogo em Zoã”.'
    reason: lexical_alternative
  - marker: c
    text: Nô é a cidade egípcia também conhecida como Tebas.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: Farei ... uma desolação
  rationale: O hifil de שׁמם exprime fazer com que um lugar fique desolado. A formulação preserva a força resultativa e o tom profético, em português natural.
- source_word: פַּתְרוֹס
  choice: Patros
  rationale: Nome geográfico transliterado segundo uma forma natural em português, sem traduzi-lo.
- source_word: וְנָתַתִּי אֵשׁ
  choice: porei fogo
  rationale: Literalmente, 'darei fogo'; trata-se de uma expressão para provocar um incêndio destrutivo. 'Porei fogo' conserva de perto a imagem e é idiomático em português.
- source_word: בְּצֹעַן
  choice: em Zoã
  rationale: A preposição בְּ indica aqui o local onde o fogo será posto. 'Zoã' é uma forma portuguesa estabelecida do topônimo.
- source_word: וְעָשִׂיתִי שְׁפָטִים
  choice: executarei juízos
  rationale: A expressão hebraica 'fazer juízos' denota a realização de atos judiciais punitivos. 'Executarei juízos' mantém a nuance forense e o registro solene.
- source_word: בְּנֹא
  choice: contra Nô
  rationale: No contexto de juízos punitivos, בְּ marca o alvo da ação. 'Contra' transmite essa direção sem eliminar a possível nuance locativa, registrada em nota.
theological_decisions:
- issue: Natureza da ação divina no oráculo de juízo
  choice: 'Apresentar as três ações na primeira pessoa como atos diretos: ''Farei... porei... executarei''.'
  alternative: Empregar linguagem mais branda que apresente Deus apenas como permitindo esses acontecimentos.
  rationale: O hebraico apresenta o próprio SENHOR como falante e agente direto. A tradução preserva essa força teológica, sem converter ação em mera permissão.
translation_notes:
  register: 'Português moderno, claro e solene, com boa legibilidade brasileira. Mantém o paralelismo das três ações divinas e usa formas portuguesas dos topônimos: Patros, Zoã e Nô.'
