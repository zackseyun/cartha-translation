  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַחֲזַקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וּ/זְרֹע֥וֹת פַּרְעֹ֖ה תִּפֹּ֑לְנָה וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בְּ/תִתִּ֤/י חַרְבִּ/י֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/נָטָ֥ה אוֹתָ֖/הּ אֶל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/025.yaml
  text: I will strengthen the arms of the king of Babylon[a], but Pharaoh’s arms will fall. Then they will know that I am Yahweh[b], when I put my sword into the hand of the king of Babylon and he stretches it out against the land of Egypt.
translation:
  language: pt
  text: Fortalecerei os braços do rei da Babilônia, mas os braços do faraó cairão[a]. Então saberão que eu sou Yahweh[b], quando eu puser minha espada na mão do rei da Babilônia, e ele a estender contra a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “e os braços do faraó fracassarão”. O hebraico diz literalmente “cairão”, preservando a imagem do colapso militar.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz YHWH, o nome divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲזַקְתִּי
  choice: Fortalecerei
  rationale: 'O hifil de חזק tem sentido causativo: Yahweh tornará fortes os braços do rei da Babilônia. “Fortalecerei” é claro e preserva a ação divina.'
- source_word: זְרֹעוֹת
  choice: os braços
  rationale: Mantém a imagem corporal concreta do hebraico, que representa poder militar e cria o contraste entre o fortalecimento da Babilônia e a queda do faraó.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução direta e natural da construção hebraica.
- source_word: וּזְרֹעוֹת פַּרְעֹה תִּפֹּלְנָה
  choice: mas os braços do faraó cairão
  rationale: “Mas” explicita o contraste contextual expresso pela conjunção, enquanto “cairão” conserva o verbo נפל e a imagem vívida do colapso militar.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: “Então” comunica naturalmente o resultado dos atos de juízo descritos, sem especificar um sujeito que o hebraico deixa implícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ בָּבֶל
  choice: quando eu puser minha espada na mão do rei da Babilônia
  rationale: Preserva a imagem de Yahweh entregando ao rei babilônico o instrumento de seu juízo; “puser” traduz naturalmente נתן neste contexto.
- source_word: חַרְבִּי
  choice: minha espada
  rationale: Mantém literalmente a metáfora do instrumento de juízo pertencente a Yahweh.
- source_word: וְנָטָה אוֹתָהּ
  choice: e ele a estender
  rationale: O pronome feminino retoma “espada”. “Estender” conserva o sentido concreto de נטה e evita a interpretação mais livre “brandir”.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: contra a terra do Egito
  rationale: Embora אֶל possa significar “em direção a”, o contexto militar favorece “contra”, que comunica o movimento hostil sem apagar a referência territorial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, enquanto a nota informa o leitor sobre a forma hebraica.
- issue: A Babilônia como agente do juízo divino
  choice: Yahweh põe sua espada na mão do rei da Babilônia, que a estende contra o Egito
  alternative: Uma formulação mais genérica que não mostre a relação instrumental
  rationale: A tradução mantém tanto a iniciativa de Yahweh quanto a atuação do rei babilônico, conforme a construção explícita do hebraico, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela dos “braços” e as imagens da espada, da mão e da queda foram preservadas. O sujeito de “saberão” permanece implícito, como no hebraico.
