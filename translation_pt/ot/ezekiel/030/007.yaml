  text: וְ/נָשַׁ֕מּוּ בְּ/ת֖וֹךְ אֲרָצ֣וֹת נְשַׁמּ֑וֹת וְ/עָרָ֕י/ו בְּ/תוֹךְ עָרִ֥ים נַחֲרָב֖וֹת תִּֽהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/007.yaml
  text: They will be desolated among desolated lands[a], and its cities will be among ruined cities.
translation:
  language: pt
  text: Eles serão devastados entre terras devastadas[a], e suas cidades estarão entre cidades arruinadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio de terras devastadas [...] no meio de cidades arruinadas”.'
    reason: alternativa lexical para בְּתוֹךְ, que pode ser traduzido de modo mais literal como “no meio de”
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: serão devastados
  rationale: O nifal de שׁמם expressa o estado ou resultado passivo de devastação. “Serão devastados” preserva essa força e é natural em português.
- source_word: בְּתוֹךְ
  choice: entre
  rationale: Neste contexto, indica posição no meio de um conjunto. “Entre” comunica isso de modo claro e conciso.
- source_word: אֲרָצוֹת נְשַׁמּוֹת
  choice: terras devastadas
  rationale: אֲרָצוֹת designa territórios ou países, e נְשַׁמּוֹת descreve seu estado de devastação. “Terras devastadas” mantém a ligação lexical com o verbo precedente.
- source_word: וְעָרָיו
  choice: e suas cidades
  rationale: O sufixo masculino singular retoma o Egito como entidade nacional. Em português, “suas” é a referência possessiva natural.
- source_word: עָרִים נַחֲרָבוֹת
  choice: cidades arruinadas
  rationale: A forma de חרב descreve cidades reduzidas à ruína. “Arruinadas” é corrente e distingue este termo da raiz שׁמם usada antes.
- source_word: תִּהְיֶינָה
  choice: estarão
  rationale: O verbo היה liga as cidades à sua posição futura entre outras cidades arruinadas. “Estarão” é mais natural em português para localização ou situação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “devastados/devastadas” preserva deliberadamente a recorrência da raiz hebraica שׁמם; “arruinadas” representa a raiz distinta חרב.
