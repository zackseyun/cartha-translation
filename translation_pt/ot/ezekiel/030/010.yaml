  yaml_path: translation/ot/ezekiel/030/010.yaml
  text: 'Thus says the Lord GOD: I will put an end to the multitude of Egypt by the hand of Nebuchadnezzar king of Babylon[a][b].'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Farei cessar a multidão do Egito pela mão de Nabucodonosor, rei da Babilônia.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é literalmente «pela mão de» e significa «por meio de».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «Nebucadrezar», forma mais próxima da grafia usada neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética tradicional em português corrente e solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Soberano Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה, evitando a repetição pouco natural de «Senhor» e preservando explicitamente o nome da aliança.
- source_word: וְהִשְׁבַּתִּי
  choice: Farei cessar
  rationale: Reproduz a força causativa do hifil de שׁבת e mantém o tom formal da declaração.
- source_word: הֲמוֹן מִצְרַיִם
  choice: a multidão do Egito
  rationale: Mantém a amplitude de הָמוֹן, que pode apontar para a massa populosa ou numerosa do Egito, sem restringi-lo indevidamente a tropas ou riquezas.
- source_word: בְּיַד
  choice: pela mão de
  rationale: Conserva o idioma hebraico de agência, cujo sentido contextual é «por meio de».
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida; a nota registra a forma mais próxima da grafia hebraica deste versículo.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e natural da cadeia construta que expressa título e domínio.
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: o Soberano Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha mantém visível o nome próprio divino e traduz אֲדֹנָי por um título distinto. «Soberano» comunica autoridade sem produzir «Senhor Senhor».
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe preserva a cadência da fórmula profética e o idioma de agência do hebraico; as notas esclarecem pontos que poderiam causar estranhamento.
