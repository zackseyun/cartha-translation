  to: Fortalecerei os braços do rei da Babilônia e porei a minha espada na mão dele; mas quebrarei os braços do faraó, e ele gemirá diante dele[a] como um homem mortalmente ferido.
  rationale: A revisão substitui uma perífrase menos idiomática por uma formulação portuguesa mais direta para a agonia expressa pelo verbo e seu cognato hebraicos. «Mortalmente ferido» mantém o campo semântico de vítima abatida ou trespassada em combate e evita a dificuldade de apresentar como já morto quem está gemendo. A nota preserva a ambiguidade real do pronome final.
