  text: וְ/חִזַּקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נָתַתִּ֥י אֶת חַרְבִּ֖/י בְּ/יָד֑/וֹ וְ/שָׁבַרְתִּי֙ אֶת זְרֹע֣וֹת פַּרְעֹ֔ה וְ/נָאַ֛ק נַאֲק֥וֹת חָלָ֖ל לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/024.yaml
  text: And I will strengthen the arms of the king of Babylon[a], and I will put my sword into his hand; but I will break the arms of Pharaoh, and he will groan before him with the groanings of a slain man.
translation:
  language: pt
  text: Fortalecerei os braços do rei da Babilônia e porei a minha espada na mão dele; mas quebrarei os braços do faraó, e ele gemirá diante dele[a] como um homem mortalmente ferido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante de mim”, caso se entenda que o pronome final se refere ao SENHOR, e não ao rei da Babilônia.
    reason: Leitura alternativa do referente pronominal em לְפָנָיו.
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: Fortalecerei
  rationale: O perfeito com waw em sequência no discurso profético tem aqui sentido futuro; “fortalecerei” conserva a imagem concreta de conferir poder militar.
- source_word: זְרֹעוֹת
  choice: os braços
  rationale: Mantém a metáfora corporal e militar, importante para o contraste entre fortalecer os braços do rei da Babilônia e quebrar os do faraó.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução direta da construção hebraica, sem acrescentar o nome do rei.
- source_word: וְנָתַתִּי אֶת חַרְבִּי בְּיָדוֹ
  choice: e porei a minha espada na mão dele
  rationale: Expressa de modo natural a entrega da espada como símbolo de autoridade delegada para executar juízo, preservando o possessivo “minha”.
- source_word: וְשָׁבַרְתִּי
  choice: mas quebrarei
  rationale: “Quebrarei” preserva o motivo recorrente do braço quebrado; “mas” explicita o contraste já marcado pela sequência entre o fortalecimento da Babilônia e a derrota do faraó.
- source_word: זְרֹעוֹת פַּרְעֹה
  choice: os braços do faraó
  rationale: Conserva a mesma metáfora usada na primeira parte do versículo e evita reduzi-la simplesmente a “poder”.
- source_word: וְנָאַק נַאֲקוֹת
  choice: e ele soltará ... gemidos
  rationale: A formulação portuguesa transmite o verbo e seu substantivo cognato sem recorrer à construção pouco natural “gemerá gemidos”.
- source_word: חָלָל
  choice: um homem ferido de morte
  rationale: O termo designa alguém traspassado ou abatido violentamente, sobretudo em batalha. “Ferido de morte” preserva a gravidade mortal e permite compreender naturalmente a imagem dos gemidos.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Mantém o pronome ambíguo do hebraico; no texto principal, o referente mais próximo e provável é o rei da Babilônia.
theological_decisions:
- issue: Referente do pronome em לְפָנָיו
  choice: No fluxo principal, “dele” é entendido como referência ao rei da Babilônia.
  alternative: O pronome pode referir-se ao SENHOR, indicando que o faraó geme diante de Deus.
  rationale: O rei da Babilônia é o antecedente masculino singular mais próximo, e o contexto destaca a humilhação do faraó perante o conquistador usado por Deus. Como a referência ao SENHOR continua sintaticamente possível, a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. A tradução conserva as imagens dos braços e da espada, evita paráfrases doutrinárias e reproduz a ambiguidade do pronome final por meio de nota.
