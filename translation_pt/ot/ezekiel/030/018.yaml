revisions:
- from: Em Tafnes, o dia escurecerá quando eu quebrar ali as cangas do Egito[a]; e nela cessará o orgulho da sua força. Quanto a ela, uma nuvem a cobrirá, e suas cidades dependentes irão para o cativeiro.[b]
  to: Em Tafnes, o dia escurecerá quando eu quebrar ali as barras do jugo do Egito[a], e nela cessará o orgulho de sua força. Quanto a ela, uma nuvem a cobrirá, e suas cidades dependentes irão para o cativeiro.[b]
  rationale: A revisão substitui «cangas» por «barras do jugo», formulação mais transparente em português atual e mais próxima da imagem plural de מוטות, sem interpretar a metáfora como simples «poder». A alternativa permanece documentada em nota. Também se regulariza a pontuação da primeira oração. O restante conserva a ambiguidade deliberada dos pronomes femininos e o valor idiomático de «filhas».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:41:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha adequadamente a sintaxe e as imagens do hebraico: a escuridão em Tafnes, a quebra dos מוטות do Egito, o cessar do orgulho de sua força, a nuvem que a cobre e o cativeiro de suas «filhas»/localidades dependentes. Convém, porém, tornar mais explícito no texto o valor concreto de מוטות como barras de jugo.'
  naturalness: «Cangas» pode designar o jugo em português, mas é menos transparente e, sobretudo no português brasileiro atual, tem sentidos correntes não pertinentes. «Barras do jugo» é claro, natural em registro bíblico e preserva melhor os dois componentes da metáfora. A vírgula é preferível ao ponto e vírgula antes de «e nela cessará».
  terminology: '«Tafnes», «cativeiro», «orgulho de sua força» e «cidades dependentes» são apropriados. A nota deve refletir a inversão da escolha principal: se o texto trouxer «barras do jugo», «cangas» passa a ser a alternativa.'
  issues:
  - severity: low
    issue: «Cangas do Egito» é potencialmente opaco no português contemporâneo.
    rationale: Embora etimológica e semanticamente defensável para barras de jugo, «canga» possui usos modernos concorrentes e não explicita tão bem o elemento «barras/varas» de מֹטוֹת. «Barras do jugo» conserva a metáfora hebraica com maior clareza.
  - severity: low
    issue: A nota a deve corresponder à opção adotada no texto.
    rationale: Ao preferir «barras do jugo», a nota não deve apresentar essa mesma formulação como alternativa; «cangas do Egito» pode ser registrada como alternativa lexical.
