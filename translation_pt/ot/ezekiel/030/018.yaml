base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/018.yaml
  text: And in Tahpanhes the day will grow dark when I break there the bars of Egypt[a], and the pride of her strength will cease in her. As for her, a cloud will cover her[b], and her daughters will go into captivity.
translation:
  language: pt
  text: Em Tafnes, o dia escurecerá quando eu quebrar ali as barras do jugo do Egito[a], e nela cessará o orgulho de sua força. Quanto a ela, uma nuvem a cobrirá, e suas cidades dependentes irão para o cativeiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as cangas do Egito”. A metáfora hebraica pode referir-se aos sustentáculos do poder ou do domínio egípcio.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “suas filhas”, expressão profética comum para cidades dependentes ou povoações vizinhas.
    reason: cultural_note
lexical_decisions:
- source_word: וּבִתְחַפְנְחֵס
  choice: Em Tafnes
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecível do topônimo, com a preposição locativa natural.
- source_word: חָשַׂךְ הַיּוֹם
  choice: o dia escurecerá
  rationale: Reproduz de modo natural a imagem ominosa de o dia tornar-se escuro, sem explicitar além do hebraico.
- source_word: בְּשִׁבְרִי שָׁם
  choice: quando eu quebrar ali
  rationale: Expressa o valor temporal do infinitivo com sufixo de primeira pessoa e preserva a ênfase local de שָׁם.
- source_word: מֹטוֹת מִצְרַיִם
  choice: as cangas do Egito
  rationale: מֹטוֹת pode designar barras ou varas de jugo; 'cangas' conserva em português a metáfora concreta do jugo e do domínio, sem reduzi-la genericamente a poder.
- source_word: וְנִשְׁבַּת בָּהּ
  choice: e nela cessará
  rationale: Mantém o sentido de cessar ou chegar ao fim e conserva o pronome feminino sem fixar explicitamente seu referente.
- source_word: גְּאוֹן עֻזָּהּ
  choice: o orgulho da sua força
  rationale: Preserva os dois substantivos da cadeia construta e a associação entre orgulho e poderio.
- source_word: הִיא עָנָן יְכַסֶּנָּה
  choice: Quanto a ela, uma nuvem a cobrirá
  rationale: '''Quanto a ela'' representa a ênfase do pronome independente הִיא; a segunda oração conserva literalmente a imagem da nuvem de juízo.'
- source_word: וּבְנוֹתֶיהָ
  choice: suas cidades dependentes
  rationale: Embora literalmente 'suas filhas', no idioma profético a expressão costuma indicar cidades ou povoações subordinadas; a tradução comunica esse sentido, registrando a forma literal em nota.
- source_word: בַּשְּׁבִי תֵלַכְנָה
  choice: irão para o cativeiro
  rationale: Preserva tanto o movimento expresso pelo verbo como o destino de deportação.
theological_decisions:
- issue: Referente dos pronomes femininos na segunda metade do versículo
  choice: Manter os pronomes femininos sem nomear novamente o referente
  alternative: Explicitar Tafnes ou entender os pronomes como referência mais ampla ao Egito personificado
  rationale: A proximidade de Tafnes e a linguagem de uma cidade com povoações dependentes favorecem a imagem urbana, mas o oráculo inteiro trata do Egito. A formulação mantém essa tensão referencial.
translation_notes:
  register: Português atual, digno e de leitura natural, com boa inteligibilidade brasileira. Conserva a imagem do jugo, a ênfase do pronome hebraico e a ambiguidade do referente feminino; traduz o idioma profético 'filhas' no texto e registra sua forma literal em nota.
