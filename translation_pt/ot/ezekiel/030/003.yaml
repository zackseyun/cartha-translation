  text: כִּֽי קָר֣וֹב י֔וֹם וְ/קָר֥וֹב י֖וֹם לַֽ/יהוָ֑ה י֣וֹם עָנָ֔ן עֵ֥ת גּוֹיִ֖ם יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/003.yaml
  text: For the day is near[a], yes, the day of Yahweh is near; it will be a day of clouds[c][b], a time of nations.
translation:
  language: pt
  text: Pois o dia está próximo; sim, está próximo o dia de Yahweh. Será um dia de nuvens,[a] um tempo das nações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “um dia de nuvem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o tempo das nações” ou “um tempo para as nações”. A expressão hebraica é concisa e pode indicar um período decisivo relacionado às nações.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação para o lamento e preserva a conexão com o contexto sem impor uma causalidade excessivamente rígida.
- source_word: קָרוֹב
  choice: está próximo
  rationale: Expressa de modo natural e urgente a proximidade temporal anunciada pelo adjetivo hebraico.
- source_word: יוֹם
  choice: dia
  rationale: Equivalente comum e direto; a repetição no texto preserva a ênfase profética.
- source_word: וְקָרוֹב
  choice: sim, está próximo
  rationale: A conjunção unida à repetição intensifica a declaração; “sim” comunica essa força em português corrente e digno.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: Na expressão profética, o ל marca a relação do dia com Yahweh; a formulação mantém o nome divino presente no hebraico.
- source_word: יוֹם עָנָן
  choice: um dia de nuvens
  rationale: Preserva a formulação nominal e a imagem ominosa, com plural idiomático em português.
- source_word: עֵת גּוֹיִם
  choice: um tempo das nações
  rationale: Mantém a expressão hebraica concisa e sua ambiguidade quanto a um período referente às nações, sem explicitar indevidamente julgamento, domínio ou oportunidade.
- source_word: יִהְיֶה
  choice: Será
  rationale: Verbo futuro que retoma “o dia” de maneira clara e natural em português.
theological_decisions:
- issue: Tradução da fórmula profética יוֹם לַיהוָה
  choice: o dia de Yahweh
  alternative: o dia do SENHOR; um dia pertencente a Yahweh
  rationale: Conserva o nome divino expresso pelo Tetragrama e a fórmula profética sem acrescentar uma interpretação denominacional.
- issue: Sentido de עֵת גּוֹיִם
  choice: um tempo das nações
  alternative: o tempo das nações; um tempo para as nações
  rationale: 'O hebraico é breve e admite mais de uma relação semântica. A opção escolhida preserva a tensão: trata-se de um período decisivo relacionado às nações, sem determinar exatamente de que modo.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A pontuação conserva a progressão enfática do hebraico, e as notas aparecem imediatamente após as expressões a que se referem.
