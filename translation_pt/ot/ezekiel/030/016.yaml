base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/016.yaml
  text: And I will set fire in Egypt[a]; Sin will writhe in anguish, and No will be broken open[d][c][b], and Noph will have enemies by day.
translation:
  language: pt
  text: Porei fogo no Egito; Sin[a] se contorcerá de angústia, Nô[b] será aberta à força, e Nofe[c] terá inimigos de dia.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sin é a cidade egípcia geralmente identificada com Pelúsio.
    reason: cross_reference
  - marker: b
    text: Nô é geralmente identificada com Tebas.
    reason: cross_reference
  - marker: c
    text: Nofe é geralmente identificada com Mênfis.
    reason: cross_reference
  - marker: d
    text: 'Ou: “Nofe terá adversários durante o dia”. A frase hebraica é concisa e pode destacar um ataque aberto ou contínuo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֵשׁ בְּמִצְרַיִם
  choice: Porei fogo no Egito
  rationale: O verbo נתן significa literalmente “dar/pôr”, mas, construído com “fogo” e um lugar, expressa naturalmente o ato de pôr ou atear fogo. “Porei fogo” é claro e mantém a ideia de juízo destrutivo dentro do Egito.
- source_word: חוּל תחיל
  choice: se contorcerá de angústia
  rationale: A forma intensiva baseada em חול pode descrever tremor, dores de parto ou movimentos convulsivos. A expressão escolhida conserva a imagem vívida de sofrimento sem restringi-la literalmente ao parto.
- source_word: סִין
  choice: Sin
  rationale: Mantém no texto o nome hebraico da cidade, enquanto sua identificação comum com Pelúsio fica em nota.
- source_word: תִּהְיֶה לְהִבָּקֵעַ
  choice: será aberta à força
  rationale: O nifal de בקע comunica ser fendida, rompida ou aberta por uma brecha. No contexto de uma cidade atacada, “aberta à força” preserva a imagem concreta e é compreensível em português corrente.
- source_word: וְנֹא
  choice: Nô
  rationale: Translitera o nome hebraico com acento gráfico para orientar a pronúncia em português; a identificação histórica com Tebas é apresentada em nota.
- source_word: וְנֹף
  choice: Nofe
  rationale: Emprega uma forma transliterada legível em português, em vez de substituir o topônimo hebraico pela identificação histórica Mênfis.
- source_word: צָרֵי יוֹמָם
  choice: terá inimigos em pleno dia
  rationale: צָרֵי é entendido como “inimigos/adversários”, e יוֹמָם como “de dia”. O verbo “terá” é suprido para formar uma oração natural; “em pleno dia” ressalta o caráter aberto do ataque sem eliminar a concisão do hebraico.
