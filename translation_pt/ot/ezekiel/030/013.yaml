revisions:
- from: 'Assim diz o Senhor Yahweh: “Destruirei os ídolos e acabarei com os falsos deuses de Nof[a]. Já não haverá um príncipe da terra do Egito[b], e porei medo na terra do Egito.”'
  to: 'Assim diz o Senhor Yahweh: “Destruirei os ídolos e acabarei com as imagens de Nof[a]. Já não haverá príncipe da terra do Egito[b], e porei medo na terra do Egito.”'
  rationale: A única correção necessária substitui “falsos deuses” por “imagens”, uma opção que reproduz melhor אֱלִילִים no contexto e mantém a distinção do hebraico entre os dois termos para objetos idólatras. Ajustou-se também a ausência de artigo em “príncipe” para uma formulação ligeiramente mais direta, sem mudança semântica. As âncoras e o conteúdo das notas permanecem completos e corretamente associados.
