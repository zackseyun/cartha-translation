  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה וְ/הַאֲבַדְתִּ֨י גִלּוּלִ֜ים וְ/הִשְׁבַּתִּ֤י אֱלִילִים֙ מִ/נֹּ֔ף וְ/נָשִׂ֥יא מֵ/אֶֽרֶץ מִצְרַ֖יִם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/נָתַתִּ֥י יִרְאָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/013.yaml
  text: 'Thus says the Lord GOD: I will destroy the idols and put an end to the images from Noph[a], and there will no longer be a prince from the land of Egypt[b]; and I will put fear in the land of Egypt.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Destruirei os ídolos e acabarei com as imagens de Nof[a]. Já não haverá príncipe da terra do Egito[b], e porei medo na terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof é o nome hebraico da cidade egípcia mais tarde conhecida, em grego, como Mênfis.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Já não haverá governante da terra do Egito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, sem confundir os dois elementos.
- source_word: וְהַאֲבַדְתִּי
  choice: Destruirei
  rationale: O hifil de אבד indica eliminação decisiva; “destruirei” é forte, claro e apropriado ao contexto de juízo.
- source_word: גִלּוּלִים
  choice: ídolos
  rationale: É a tradução portuguesa mais clara e corrente, embora o termo hebraico tenha matiz deliberadamente depreciativo.
- source_word: וְהִשְׁבַּתִּי
  choice: acabarei com
  rationale: 'Expressa de modo natural a força causativa de שׁבת: fazer cessar, pôr fim a.'
- source_word: אֱלִילִים
  choice: falsos deuses
  rationale: Distingue este termo de גִלּוּלִים na mesma frase e comunica sua ideia de divindades vãs ou sem valor, sem recorrer a uma formulação obscura.
- source_word: מִנֹּף
  choice: de Nof
  rationale: Translitera o nome hebraico da cidade; a identificação mais conhecida, Mênfis, é explicada em nota.
- source_word: וְנָשִׂיא מֵאֶרֶץ מִצְרַיִם לֹא יִהְיֶה עוֹד
  choice: Já não haverá um príncipe da terra do Egito
  rationale: Preserva נָשִׂיא como “príncipe” e mantém a construção com מִן, que pode sugerir um governante procedente do próprio Egito.
- source_word: וְנָתַתִּי יִרְאָה
  choice: porei medo
  rationale: Reproduz com clareza o idioma hebraico “dar/pôr medo” sem intensificá-lo necessariamente para “terror”.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Tradução direta da locução, sem acrescentar uma ideia distributiva como “por toda”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: “Senhor Yahweh” preserva tanto o título quanto o nome pessoal presentes no hebraico e evita substituir silenciosamente o Tetragrama por outro título.
- issue: Sentido de נָשִׂיא na promessa de cessação do governo egípcio
  choice: príncipe
  alternative: governante
  rationale: “Príncipe” conserva o sentido formal tradicional do termo, enquanto a nota registra a alternativa mais funcional, sem decidir além do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o paralelismo profético, distingue os dois termos hebraicos para objetos de culto e conserva a possível ênfase em um governante originário do Egito.
