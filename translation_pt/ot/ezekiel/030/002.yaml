base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/002.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Wail[b], “Alas for the day!”’'
translation:
  language: pt
  text: 'Filho do homem, profetize e diga: “Assim diz o Senhor Yahweh: ‘Lamentem[a]: Ai, por causa do dia[b]!’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “Uivem”. O verbo hebraico descreve um clamor intenso de dor ou aflição.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ah, pelo dia!” A interjeição hebraica exprime dor ou temor diante do dia que se aproxima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a expressão hebraica que funciona como a forma característica de Deus se dirigir a Ezequiel, sem substituí-la por uma interpretação como “mortal”.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: Equivalente direto e natural do imperativo de נבא, mantendo o registro profético.
- source_word: וְאָמַרְתָּ
  choice: e diga
  rationale: Mantém a sequência dos dois mandamentos no hebraico com formulação corrente em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula solene e recorrente do mensageiro profético.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a repetição pouco clara “Senhor SENHOR”.
- source_word: הֵילִילוּ
  choice: Lamentem
  rationale: Expressa o imperativo plural e a manifestação audível de dor; “Uivem” é lexicalmente possível, mas em português atual pode sugerir sobretudo o som de animais.
- source_word: הָהּ
  choice: Ai
  rationale: Interjeição portuguesa natural de aflição ou temor, adequada ao anúncio do dia de julgamento.
- source_word: לַיּוֹם
  choice: que dia
  rationale: A construção exclamativa “Ai, que dia!” comunica de modo natural o lamento dirigido ao dia iminente, sem explicitar além do hebraico a natureza desse dia.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O texto contém o nome próprio יהוה junto ao título אֲדֹנָי. “Senhor Yahweh” preserva os dois elementos e torna visível o nome da aliança, sem produzir “Senhor SENHOR”.
- issue: Sentido do lamento pelo “dia”
  choice: Ai, que dia!
  alternative: Ai daquele dia!
  rationale: A tradução mantém a exclamação de aflição e a referência ominosa ao dia, mas evita acrescentar o demonstrativo “aquele”, ausente do hebraico; o contexto subsequente esclarece que se trata de julgamento.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. Mantém-se a fórmula profética tradicional “Assim diz” e o vocativo recorrente “Filho do homem”; as aspas distinguem a fala divina e o clamor ordenado.
