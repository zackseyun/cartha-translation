  text: וַ/הֲפִצוֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצ֑וֹת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/026.yaml
  text: I will scatter Egypt among the nations[a], and I will disperse them through the lands. Then they will know that I am Yahweh.
translation:
  language: pt
  text: Espalharei o Egito entre as nações[a] e os dispersarei pelas terras. Então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Espalharei os egípcios entre as nações e os dispersarei pelos países”. O hebraico primeiro menciona “Egito” e depois se refere ao seu povo com um pronome plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: Espalharei
  rationale: O verbo פוץ expressa espalhar ou dispersar. “Espalharei” preserva a imagem do juízo e evita repetição com o verbo seguinte.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Mantém o nome coletivo presente no hebraico; o pronome plural posterior passa naturalmente do país para seus habitantes.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם significa normalmente “nações”, e a preposição indica dispersão no meio delas.
- source_word: וְזֵרִיתִי
  choice: e os dispersarei
  rationale: זרה pode significar peneirar ao vento, espalhar ou dispersar; neste contexto, “dispersarei” comunica com clareza a distribuição do povo por diversas regiões.
- source_word: אוֹתָם
  choice: os
  rationale: O pronome hebraico é plural e se refere aos egípcios, embora o antecedente explícito seja o nome coletivo “Egito”.
- source_word: בָּאֲרָצוֹת
  choice: por outras terras
  rationale: O plural אֲרָצוֹת denota terras ou países. “Por outras terras” torna explícito de modo natural que se trata de regiões distintas do Egito, sem alterar o sentido contextual.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: A conjunção liga o reconhecimento de Yahweh ao juízo anterior; “Então” expressa naturalmente essa sequência resultante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Mudança de “Egito” para um referente plural
  choice: Manter “o Egito” e depois usar “os”, referindo-se aos egípcios
  alternative: Traduzir desde o início como “os egípcios”
  rationale: A formulação conserva a mudança presente no hebraico entre o nome coletivo do país e o pronome plural referente ao povo, sem eliminar a tensão gramatical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o paralelismo hebraico e preserva a passagem do nome coletivo “Egito” ao pronome plural que designa seus habitantes.
