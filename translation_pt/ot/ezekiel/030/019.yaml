base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/019.yaml
  text: Thus I will execute judgments on Egypt[a], and they will know that I am Yahweh.
translation:
  language: pt
  text: Assim executarei juízos contra o Egito, e eles saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Assim executarei
  rationale: Com שְׁפָטִים como objeto, עשה expressa idiomaticamente executar ou realizar juízos. “Assim” representa a conjunção como transição conclusiva no contexto.
- source_word: שְׁפָטִים
  choice: juízos
  rationale: O plural designa atos judiciais ou punitivos de Deus; “juízos” preserva o sentido formal e o registro profético.
- source_word: בְּמִצְרָיִם
  choice: contra o Egito
  rationale: Embora בְּ possa ser locativo, neste contexto de ação punitiva indica o alvo dos juízos. “Contra” é natural em português e torna essa relação explícita.
- source_word: וְיָדְעוּ
  choice: e eles saberão
  rationale: Mantém a fórmula recorrente de reconhecimento em Ezequiel e preserva a força revelatória de ידע.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Reproduz diretamente a fórmula de reconhecimento e translitera o nome divino יהוה, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama diretamente. “Yahweh” preserva o nome da aliança e evita substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética concisa. A ordem das duas orações e a fórmula de reconhecimento foram preservadas.
