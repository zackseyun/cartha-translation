base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/008.yaml
  text: Then they will know that I am Yahweh[a], when I set fire to Egypt and all her helpers are broken.
translation:
  language: pt
  text: Então saberão que eu sou Javé, quando eu puser fogo no Egito e todos os que o ajudam[a] forem quebrados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus aliados”. O hebraico diz literalmente “todos os seus ajudantes” e pode se referir às nações ou forças que apoiavam o Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: O verbo significa “saber/conhecer”, e a conjunção introduz aqui o resultado do juízo anunciado; “Então” expressa naturalmente essa progressão.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Javé
  rationale: כִּי introduz o conteúdo do que será reconhecido. “Javé” representa em português o nome divino יהוה, em vez de substituí-lo por um título.
- source_word: בְּתִתִּי אֵשׁ בְּמִצְרַיִם
  choice: quando eu atear fogo no Egito
  rationale: A construção com בְּ e infinitivo indica circunstância temporal. “Atear fogo” é expressão portuguesa natural, e “no Egito” preserva o valor locativo da preposição hebraica.
- source_word: וְנִשְׁבְּרוּ
  choice: forem destroçados
  rationale: O nifal de שׁבר indica serem quebrados ou despedaçados; “forem destroçados” conserva a força da imagem e funciona naturalmente para forças ou nações derrotadas.
- source_word: כָּל עֹזְרֶיהָ
  choice: todos os que o ajudam
  rationale: A expressão significa literalmente “todos os ajudantes dela”. Como “Egito” é masculino em português, a formulação explicita o referente e preserva o sentido amplo, sem restringi-lo necessariamente a aliados políticos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Javé
  alternative: SENHOR; Iahweh
  rationale: O texto hebraico traz o nome próprio יהוה. “Javé” é uma forma portuguesa reconhecível e preserva o nome pessoal, sem o substituir pelo título “SENHOR”.
- issue: Identidade dos “ajudantes” do Egito
  choice: todos os que o ajudam
  alternative: todos os seus aliados
  rationale: O hebraico עֹזְרֶיהָ é lexicalmente mais amplo que “aliados” e pode abranger nações, forças ou outros apoiadores; a tradução mantém essa amplitude e registra a leitura contextual em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Atear fogo” oferece naturalidade sem perder a imagem do hebraico; “todos os que o ajudam” evita a ambiguidade do possessivo e mantém aberto o alcance de עֹזְרֶיהָ.
