source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֨וּ מַלְאָכִ֤ים מִ/לְּ/פָנַ/י֙ בַּ/צִּ֔ים לְ/הַחֲרִ֖יד אֶת כּ֣וּשׁ בֶּ֑טַח וְ/הָיְתָ֨ה חַלְחָלָ֤ה בָ/הֶם֙ בְּ/י֣וֹם מִצְרַ֔יִם כִּ֥י הִנֵּ֖ה בָּאָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/009.yaml
  text: On that day messengers will go out from before me in ships to terrify Cush[a], secure as she is, and trembling will come upon them on the day of Egypt, for behold[c][b], it is coming.
translation:
  language: pt
  text: Naquele dia, mensageiros[a] sairão de diante de mim em navios para aterrorizar Cuxe[b], que vive em segurança. O tremor tomará conta deles no dia do Egito[c], pois eis que está chegando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enviados”. A palavra hebraica também pode significar “anjos”, mas aqui provavelmente se refere a mensageiros humanos que levam a notícia da queda do Egito.
    reason: lexical_alternative
  - marker: b
    text: Também traduzido por “Etiópia”. Cuxe é o nome hebraico da região situada ao sul do Egito.
    reason: alternative_reading
  - marker: c
    text: Isto é, o dia em que o juízo virá sobre o Egito.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto geopolítico de juízo, o termo se refere mais naturalmente a mensageiros humanos que levarão a notícia da queda do Egito. “Mensageiros” também preserva a amplitude básica do hebraico.
- source_word: מִלְּפָנַי
  choice: de diante de mim
  rationale: Mantém a expressão hebraica de presença e apresenta os mensageiros saindo da presença do próprio falante divino.
- source_word: בַּצִּים
  choice: em navios
  rationale: O termo designa embarcações; “em navios” comunica de modo natural o meio pelo qual os mensageiros viajarão.
- source_word: לְהַחֲרִיד
  choice: para aterrorizar
  rationale: A forma causativa expressa provocar medo intenso ou tremor, adequado ao anúncio do juízo.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Translitera o topônimo hebraico em sua forma portuguesa tradicional, sem identificá-lo de maneira simplista com a Etiópia moderna.
- source_word: בֶּטַח
  choice: que vive em segurança
  rationale: Expressa o estado de confiança ou tranquilidade de Cuxe e preserva o contraste irônico com o terror que virá.
- source_word: חַלְחָלָה
  choice: o tremor
  rationale: Conserva tanto a dimensão física quanto a emocional da angústia convulsiva indicada pelo substantivo.
- source_word: בָהֶם
  choice: tomará conta deles
  rationale: Forma portuguesa natural para a ideia de uma experiência avassaladora que sobrevém ao povo; o plural reproduz a referência coletiva presente no hebraico.
- source_word: בְּיוֹם מִצְרַיִם
  choice: no dia do Egito
  rationale: Preserva a formulação compacta do hebraico, entendida no contexto como o dia em que o juízo alcança o Egito.
- source_word: כִּי הִנֵּה בָּאָה
  choice: pois eis que está chegando
  rationale: A construção sem sujeito expresso em português comunica iminência certa e evita determinar silenciosamente o referente do verbo feminino hebraico.
theological_decisions:
- issue: Perspectiva do falante divino no juízo profético
  choice: “de diante de mim” preserva o SENHOR como falante direto e origem do envio.
  alternative: “da minha parte” ou simplesmente “de mim”.
  rationale: A expressão hebraica contém linguagem de presença; mantê-la ressalta que o juízo procede da presença do próprio Deus, e não de forças históricas impessoais.
- issue: Referente do verbo feminino final בָאָה
  choice: Empregar “está chegando” sem sujeito expresso.
  alternative: Explicitar “o dia está chegando” ou “a calamidade está chegando”.
  rationale: O hebraico deixa o referente implícito, embora a ideia provável seja o acontecimento de juízo anunciado. A tradução conserva essa abertura em vez de escolher um antecedente não declarado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura mantém a solenidade profética sem rigidez excessiva. Os marcadores de nota aparecem junto aos termos ou expressões que explicam.
