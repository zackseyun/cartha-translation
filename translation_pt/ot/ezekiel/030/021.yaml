base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/021.yaml
  text: Son of man[a], I have broken the arm of Pharaoh king of Egypt, and behold, it has not been bound up to apply remedies, to put on a bandage, to bind it, to strengthen it so that it may grasp the sword.
translation:
  language: pt
  text: Filho do homem, quebrei o braço do faraó, rei do Egito; e eis que não foi enfaixado para se lhe aplicarem tratamentos, nem se lhe pôs uma atadura para envolvê-lo e fortalecê-lo, de modo que pudesse segurar a espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a expressão hebraica recorrente pela qual Deus se dirige ao profeta em Ezequiel, sem substituir a imagem por uma interpretação.
- source_word: זְרוֹעַ
  choice: braço
  rationale: Mantém a imagem concreta que representa a força política e militar do faraó.
- source_word: שָׁבָרְתִּי
  choice: quebrei
  rationale: O perfeito hebraico descreve uma ação já realizada, cujos efeitos persistem na condição atual do braço.
- source_word: וְהִנֵּה
  choice: E
  rationale: Em português corrente, a transição seguida pela descrição enfática da condição do braço comunica o destaque discursivo sem o arcaísmo de «eis que».
- source_word: חֻבְּשָׁה
  choice: foi enfaixado
  rationale: Expressa naturalmente a ação médica passiva aplicada a um membro quebrado.
- source_word: לָתֵת רְפֻאוֹת
  choice: para receber tratamento
  rationale: O plural רְפֻאוֹת designa aqui medidas curativas ou tratamento médico; a formulação portuguesa é concreta e natural, sem sugerir necessariamente cura consumada.
- source_word: חִתּוּל
  choice: uma atadura
  rationale: Designa o material usado para envolver e sustentar o braço ferido.
- source_word: לְחָבְשָׁהּ
  choice: envolvido
  rationale: No contexto, indica envolver o braço com a atadura; evita a repetição pouco natural de «enfaixar» sem perder a sequência médica.
- source_word: לְחָזְקָהּ
  choice: para fortalecê-lo
  rationale: 'Conserva a finalidade do tratamento: devolver firmeza e capacidade ao braço.'
- source_word: לִתְפֹּשׂ בֶּחָרֶב
  choice: a fim de que pudesse empunhar a espada
  rationale: Comunica a imagem de recuperar a capacidade militar; «empunhar» é idiomático para segurar uma arma pronta para uso.
theological_decisions:
- issue: Agente da quebra do poder do faraó
  choice: Primeira pessoa explícita em «quebrei»
  alternative: Construção impessoal ou passiva
  rationale: O hebraico atribui diretamente a ação ao próprio Deus; a tradução preserva essa afirmação sem explicação adicional.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora médica e militar é preservada. A coordenação hebraica foi levemente reorganizada para evitar uma sequência pesada de infinitivos, sem alterar a progressão: ausência de tratamento, atadura, fortalecimento e recuperação da capacidade de usar a espada.'
