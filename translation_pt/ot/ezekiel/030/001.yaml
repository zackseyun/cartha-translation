  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: Informa a forma hebraica do nome divino e sua tradução tradicional.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética, a forma narrativa de היה se integra naturalmente à expressão “a palavra ... veio”, sem recorrer ao arcaico “aconteceu que”. A continuidade indicada pelo waw fica suficientemente expressa pelo fluxo do contexto.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula דְבַר יְהוָה, “a palavra” preserva a expressão profética tradicional e designa uma comunicação divina específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa de modo direto e natural a direção da comunicação ao profeta.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da fala divina que vem no versículo seguinte; “dizendo” reproduz a fórmula hebraica de modo corrente e digno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a fórmula profética “A palavra de Yahweh veio a mim” e o particípio introdutório “dizendo”, pois a fala continua no versículo seguinte.
