  text: בַּח֥וּרֵי אָ֛וֶן וּ/פִי בֶ֖סֶת בַּ/חֶ֣רֶב יִפֹּ֑לוּ וְ/הֵ֖נָּה בַּ/שְּׁבִ֥י תֵלַֽכְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/017.yaml
  text: The young men of Aven and Pi-beseth will fall by the sword[b][a], and these cities will go into captivity.
translation:
  language: pt
  text: Os jovens de Áven[a] e de Pi-Besete[b] cairão à espada, e essas cidades irão para o cativeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Áven provavelmente se refere a Om, isto é, Heliópolis, no Egito.
    reason: alternative_reading
  - marker: b
    text: Pi-Besete é geralmente identificada com Bubástis.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּח֥וּרֵי
  choice: Os jovens de
  rationale: בַּחוּרִים designa normalmente jovens no vigor da vida; “os jovens” é natural em português e se ajusta ao contexto de guerra sem sugerir indevidamente uma tropa de elite.
- source_word: אָ֛וֶן
  choice: Áven
  rationale: Mantém o topônimo na forma hebraica transliterada, com acento gráfico para orientar a pronúncia em português; sua provável identificação com Om/Heliópolis é registrada em nota.
- source_word: וּ/פִי בֶ֖סֶת
  choice: e de Pi-Besete
  rationale: Preserva por transliteração a forma hebraica do topônimo; a preposição “de” explicita em português a relação de בַּחוּרֵי com ambos os lugares. A identificação comum com Bubástis é indicada em nota.
- source_word: בַּ/חֶ֣רֶב
  choice: à espada
  rationale: Expressão bíblica portuguesa natural para morte em guerra, preservando o valor instrumental da construção hebraica.
- source_word: יִפֹּ֑לוּ
  choice: cairão
  rationale: Conserva a imagem literal de נפל, que neste contexto funciona como expressão convencional para morrer em combate.
- source_word: וְ/הֵ֖נָּה
  choice: e essas cidades
  rationale: O pronome feminino plural retoma as cidades recém-mencionadas. A explicitação de “cidades” evita que o português atribua o pronome aos jovens.
- source_word: בַּ/שְּׁבִ֥י
  choice: para o cativeiro
  rationale: Expressa diretamente a condição de cativeiro e, em combinação com “irão”, comunica deportação sem substituir a formulação hebraica por uma passiva.
- source_word: תֵלַֽכְנָה
  choice: irão
  rationale: Preserva o sentido básico de הלך, “ir”, e concorda com o referente feminino plural entendido como as cidades e suas populações.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os topônimos hebraicos são preservados no texto, enquanto suas identificações históricas mais conhecidas aparecem em notas. A expressão “essas cidades irão para o cativeiro” mantém a personificação/metonímia do hebraico, entendida como referência às cidades e suas populações.
