  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שָׁפַכְתִּ֣י חֲמָתִ֔/י עַל סִ֖ין מָע֣וֹז מִצְרָ֑יִם וְ/הִכְרַתִּ֖י אֶת הֲמ֥וֹן נֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/015.yaml
  text: And I will pour out my wrath on Sin[a], the stronghold of Egypt[b], and I will cut off the multitude of No.
translation:
  language: pt
  text: Derramarei a minha ira sobre Sim[a], a fortaleza do Egito, e eliminarei a multidão de Nô[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sim é geralmente identificada com Pelúsio, cidade fortificada na fronteira nordeste do Egito.
    reason: cross_reference
  - marker: b
    text: Nô é geralmente identificada com Tebas.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Derramarei
  rationale: Preserva a metáfora hebraica de derramar a ira e expressa de modo natural a ação futura em português; a coordenação inicial pode ser omitida no versículo isolado sem perda da relação sintática essencial.
- source_word: חֲמָתִי
  choice: a minha ira
  rationale: “Ira” conserva a gravidade da linguagem profética de juízo e o caráter intenso de חֵמָה sem recorrer a uma formulação excessivamente emotiva.
- source_word: עַל
  choice: sobre
  rationale: Equivalente direto e natural da preposição hebraica no contexto de juízo dirigido contra uma cidade.
- source_word: סִין
  choice: Sim
  rationale: Translitera o topônimo hebraico em forma adequada ao português, sem substituí-lo pela identificação histórica tradicional, Pelúsio.
- source_word: מָעוֹז מִצְרָיִם
  choice: a fortaleza do Egito
  rationale: “Fortaleza” comunica com clareza a ideia de lugar fortificado ou baluarte e mantém a expressão em aposição a Sim.
- source_word: וְהִכְרַתִּי
  choice: e eliminarei
  rationale: Comunica a remoção decisiva expressa pelo hifil de כרת. Em português atual, “eliminarei” é mais natural neste objeto do que o decalque “cortarei”, sem especificar além do hebraico o modo da destruição.
- source_word: אֶת הֲמוֹן
  choice: a multidão
  rationale: Mantém o sentido coletivo provável de הָמוֹן, sem excluir por interpretação as nuances de massa populosa ou grande ajuntamento.
- source_word: נֹא
  choice: Nô
  rationale: Conserva o topônimo hebraico transliterado; sua identificação comum com Tebas fica explicitada em nota.
theological_decisions:
- issue: Linguagem da ação divina no juízo
  choice: Manter “a minha ira” e apresentar Deus como sujeito direto de “derramarei” e “eliminarei”
  alternative: Abrandar para “indignação” ou formular o juízo de modo indireto
  rationale: O hebraico atribui diretamente a YHWH ações intensas de juízo. A tradução preserva essa força sem acrescentar explicações doutrinárias.
- issue: Referente de הֲמוֹן
  choice: Traduzir de modo amplo como “a multidão”
  alternative: Especificar “habitantes”, “riquezas” ou “hordas”
  rationale: O termo admite mais de uma nuance. “Multidão” preserva a ambiguidade lexical relevante e evita definir indevidamente quem ou o que será eliminado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os topônimos seguem formas transliteradas adequadas ao português; as identificações históricas são mantidas nas notas. A formulação preserva a concisão e a severidade do oráculo hebraico.
