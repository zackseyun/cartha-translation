  text: וּ/בָאָ֥ה חֶ֨רֶב֙ בְּ/מִצְרַ֔יִם וְ/הָיְתָ֤ה חַלְחָלָה֙ בְּ/כ֔וּשׁ בִּ/נְפֹ֥ל חָלָ֖ל בְּ/מִצְרָ֑יִם וְ/לָקְח֣וּ הֲמוֹנָ֔/הּ וְ/נֶהֶרְס֖וּ יְסוֹדֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/004.yaml
  text: And a sword will come against Egypt[a], and there will be anguish in Cush, when the slain fall in Egypt, and they take away her wealth[c][b], and her foundations are torn down.
translation:
  language: pt
  text: Uma espada virá contra o Egito, e haverá angústia em Cuxe[a], quando os mortos em combate caírem no Egito. Levarão embora as suas riquezas[b], e os seus alicerces serão demolidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cuxe era a região ao sul do Egito, correspondente em termos gerais à antiga Núbia, e não deve ser simplesmente identificada com o atual Estado da Etiópia.
    reason: cultural_note
  - marker: b
    text: Ou “a sua multidão” ou “a sua abundância”. A palavra hebraica pode referir-se à população, à abundância ou às riquezas; aqui foi entendida como bens levados em saque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה
  choice: virá
  rationale: O perfeito qal com conjunção, no discurso profético, anuncia um acontecimento futuro; o futuro em português comunica isso naturalmente.
- source_word: חֶרֶב
  choice: uma espada
  rationale: Mantém a imagem hebraica da espada como instrumento e metonímia de guerra ou invasão.
- source_word: בְּמִצְרַיִם
  choice: contra o Egito
  rationale: Embora a preposição possa significar literalmente “em” ou “para dentro de”, com “vir” e “espada” neste contexto expressa uma incursão hostil.
- source_word: וְהָיְתָה חַלְחָלָה
  choice: haverá angústia
  rationale: חַלְחָלָה pode indicar tremor, contorção ou angústia diante da calamidade; “angústia” conserva a aflição física e emocional em português corrente.
- source_word: בְּכוּשׁ
  choice: em Cuxe
  rationale: Translitera o nome histórico, evitando identificá-lo de modo impreciso com um Estado moderno.
- source_word: בִּנְפֹל חָלָל
  choice: quando os mortos caírem
  rationale: A construção infinitiva tem valor temporal, e חָלָל designa normalmente os mortos em combate neste contexto.
- source_word: וְלָקְחוּ הֲמוֹנָהּ
  choice: Levarão embora as suas riquezas
  rationale: הָמוֹן pode significar multidão, abundância ou riqueza; no contexto de conquista, a referência às riquezas levadas como despojo é plausível, sem ocultar a alternativa lexical na nota.
- source_word: וְנֶהֶרְסוּ יְסוֹדֹתֶיהָ
  choice: os seus alicerces serão demolidos
  rationale: O nifal comunica demolição ou derrubada; “alicerces” preserva a imagem, que pode ser literal ou figurada.
