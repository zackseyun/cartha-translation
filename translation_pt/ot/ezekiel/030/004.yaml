  terminology: “Egito”, “Cuxe”, “espada”, “angústia”, “riquezas” e “alicerces” são escolhas adequadas. Convém registrar em nota a amplitude semântica de חַלְחָלָה, que também pode expressar tremor ou contorção perante o desastre.
