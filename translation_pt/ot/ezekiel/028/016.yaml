source:
  edition: WLC
  text: בְּ/רֹ֣ב רְכֻלָּתְ/ךָ֗ מָל֧וּ תוֹכְ/ךָ֛ חָמָ֖ס וַֽ/תֶּחֱטָ֑א וָ/אֶחַלֶּלְ/ךָ֩ מֵ/הַ֨ר אֱלֹהִ֤ים וָֽ/אַבֶּדְ/ךָ֙ כְּר֣וּב הַ/סֹּכֵ֔ךְ מִ/תּ֖וֹךְ אַבְנֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/016.yaml
  text: By the abundance of your trade[a], your midst was filled with violence, and you sinned; so I cast you as profane from the mountain of God, and I destroyed you, O guardian cherub[c][b], from the midst of the stones of fire.
translation:
  language: pt
  text: Pela abundância do seu comércio[a], o seu interior se encheu de violência, e você pecou. Por isso, eu o expulsei, como profano, do monte de Deus[b] e o destruí, ó querubim protetor[c], do meio das pedras de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das suas negociações” ou “do seu comércio de mercadorias”. O termo hebraico também pode ter o sentido de “tráfico”, sem necessariamente indicar comércio ilícito.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “eu o profanei do monte de Deus”. O verbo hebraico significa profanar ou tratar como não santo e, neste contexto, provavelmente envolve a expulsão do lugar sagrado.
    reason: lexical_alternative
  - marker: c
    text: Ou “querubim que cobre”. O particípio hebraico significa cobrir, resguardar ou fazer sombra; “protetor” expressa aqui essa função.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב רְכֻלָּתְךָ
  choice: Pela abundância do seu comércio
  rationale: A construção בְּ + רֹב introduz aqui a causa ou circunstância, enquanto רְכֻלָּה designa comércio, negociação ou tráfico de mercadorias. “Comércio” é amplo e natural, sem acrescentar a conotação necessariamente ilícita que “tráfico” costuma ter no português atual.
- source_word: מָל֧וּ תוֹכְךָ חָמָס
  choice: o seu interior se encheu de violência
  rationale: Embora מָל֧וּ seja formalmente uma forma verbal na terceira pessoa do plural, o agente não é expresso; a formulação resultativa com “se encheu” comunica o sentido sem inventar um sujeito. “Interior” preserva a imagem de תוֹךְ, e “violência” é o equivalente direto de חָמָס neste contexto.
- source_word: וַתֶּחֱטָא
  choice: e você pecou
  rationale: Tradução direta que conserva a sequência narrativa e a acusação moral explícita do hebraico.
- source_word: וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים
  choice: eu o expulsei, como profano, do monte de Deus
  rationale: O piel de חלל significa profanar, declarar ou tratar como não santo. Ligado à preposição “do monte”, o contexto aponta para a remoção de um lugar sagrado. A formulação portuguesa conserva tanto a condição de profano quanto a expulsão contextual, evitando o pouco natural “profanei você do monte”.
- source_word: וָאַבֶּדְךָ
  choice: e o destruí
  rationale: A forma causativa de אבד pode significar destruir, fazer perecer ou eliminar. “Destruí” mantém a força do verbo e não reduz a ação apenas a banimento.
- source_word: כְּרוּב הַסֹּכֵךְ
  choice: ó querubim protetor
  rationale: כְּרוּב está no singular. O particípio de סכך denota cobrir, resguardar ou dar proteção; “protetor” comunica em português corrente a função expressa pela imagem, enquanto a alternativa mais literal fica registrada em nota.
- source_word: מִתּוֹךְ אַבְנֵי אֵשׁ
  choice: do meio das pedras de fogo
  rationale: A tradução próxima da forma hebraica preserva deliberadamente a imagem enigmática, sem identificar ou explicar as pedras além do que o versículo afirma.
theological_decisions:
- issue: Identidade do destinatário chamado de querubim
  choice: Preservar o discurso direto e a imagem explícita do querubim sem identificar o destinatário com Satanás nem reduzir a linguagem a uma simples metáfora régia.
  alternative: Explicitar uma queda angelical primordial ou, no sentido oposto, eliminar a dimensão querúbica em favor de uma referência exclusivamente humana.
  rationale: O versículo combina acusação dirigida a “você” com imagens do monte de Deus, do querubim e das pedras de fogo. A tradução deve manter essa tensão interpretativa e não impor uma identificação que o próprio verso não formula.
- issue: Sentido cultual e espacial de וָאֶחַלֶּלְךָ
  choice: Expressar simultaneamente o tratamento como profano e a expulsão do espaço sagrado.
  alternative: Traduzir apenas “eu o profanei” ou apenas “eu o expulsei”.
  rationale: O verbo traz a noção cultual de profanação, enquanto “do monte de Deus” dá à ação uma clara dimensão espacial. A redação escolhida conserva ambos os aspectos sem convertê-los em uma afirmação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você/seu” para tornar claro o discurso direto, mas mantém formas objetivas como “o” e vocabulário bíblico reconhecível (“monte de Deus”, “querubim”, “pedras de fogo”). A sintaxe foi levemente desdobrada para comunicar naturalmente a força cultual e espacial de חלל sem apagar a ambiguidade das imagens.
