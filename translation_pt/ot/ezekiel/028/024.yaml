source:
  edition: WLC
  text: וְ/לֹֽא יִהְיֶ֨ה ע֜וֹד לְ/בֵ֣ית יִשְׂרָאֵ֗ל סִלּ֤וֹן מַמְאִיר֙ וְ/ק֣וֹץ מַכְאִ֔ב מִ/כֹּל֙ סְבִ֣יבֹתָ֔/ם הַ/שָּׁאטִ֖ים אוֹתָ֑/ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/024.yaml
  text: And the house of Israel will no longer have a brier that causes bitterness or a thorn that causes pain from all those around them who despise them[a]. Then they will know that I am the Lord GOD.
translation:
  language: pt
  text: E a casa de Israel já não terá nenhum espinheiro que cause amargura nem espinho que cause dor, da parte de todos os que estão ao seu redor e a desprezam.[a] Então saberão que eu sou o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma planta espinhosa que provoque irritação”; a imagem hebraica é a de vegetação pontiaguda e nociva, usada como metáfora dos vizinhos hostis.'
    reason: alternativa lexical
lexical_decisions:
- source_word: סִלּוֹן
  choice: espinheiro
  rationale: Designa uma planta ou formação vegetal espinhosa e nociva; “espinheiro” distingue a imagem do substantivo paralelo “espinho”.
- source_word: מַמְאִיר
  choice: que cause amargura
  rationale: O particípio qualifica o espinheiro e expressa seu efeito nocivo e amargurante, sem reduzi-lo simplesmente à dor física.
- source_word: קוֹץ
  choice: espinho
  rationale: Equivalente português natural para algo pontiagudo e doloroso, preservando o paralelismo com “espinheiro”.
- source_word: מַכְאִב
  choice: que cause dor
  rationale: A expressão torna explícita, em português corrente, a força causativa do particípio.
- source_word: מִכֹּל סְבִיבֹתָם
  choice: entre todos os que estão ao seu redor
  rationale: O contexto aponta para povos vizinhos hostis; “entre” comunica a procedência do dano sem converter a expressão em uma designação mais específica do que o hebraico.
- source_word: הַשָּׁאטִים אוֹתָם
  choice: e a desprezam
  rationale: O particípio indica desprezo hostil. O pronome feminino singular retoma naturalmente “a casa de Israel” em português.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a designação coletiva e pactual do texto hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, “Senhor”, do nome divino יהוה, aqui transliterado “Yahweh”, evitando a repetição artificial “Senhor SENHOR”.
- source_word: וְיָדְעוּ כִּי אֲנִי
  choice: Então saberão que eu sou
  rationale: “Então” comunica de modo natural a relação consequencial da promessa, enquanto o sujeito plural permanece implícito como no uso normal do português.
theological_decisions:
- issue: Tradução do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O hebraico reúne o título אֲדֹנָי e o nome próprio יהוה. “Senhor Yahweh” preserva ambos e evita ocultar o nome da aliança sob um título substitutivo.
- issue: Identidade dos que reconhecerão Yahweh
  choice: manter o sujeito plural implícito em “saberão”
  alternative: explicitar “eles” ou identificar o sujeito como Israel ou seus vizinhos
  rationale: A forma verbal hebraica é plural, mas o referente pode ser entendido pelo contexto; a tradução não resolve além do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção idiomática “terá” representa o hebraico existencial “não haverá mais para”. Mantiveram-se as duas imagens vegetais e seus efeitos distintos.
