revisions:
- from: E a casa de Israel já não terá nenhum espinheiro que cause amargura, nem espinho que cause dor, entre todos os que estão ao seu redor e a desprezam.[a] Então saberão que eu sou o Senhor Yahweh.
  to: E a casa de Israel já não terá nenhum espinheiro que cause amargura nem espinho que cause dor, da parte de todos os que estão ao seu redor e a desprezam.[a] Então saberão que eu sou o Senhor Yahweh.
  rationale: A revisão substitui “entre todos” por “da parte de todos”, a fim de refletir a procedência dos elementos nocivos a partir dos povos circundantes hostis. Também elimina a vírgula antes de “nem”, desnecessária numa coordenação simples. O restante é mantido, inclusive a ambiguidade do sujeito plural em “saberão” e a representação do nome divino.
