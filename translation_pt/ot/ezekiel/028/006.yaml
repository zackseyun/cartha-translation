  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֛עַן תִּתְּ/ךָ֥ אֶת לְבָבְ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/006.yaml
  text: 'Therefore thus says the Lord GOD: Because you have made your heart like the heart of a god,[a]'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor DEUS: “Visto que você fez seu coração como o coração de um deus,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como o coração de Deus”. O hebraico אֱלֹהִים pode significar “Deus”, “um deus” ou “deuses”, conforme o contexto.'
    reason: Leitura alternativa decorrente da amplitude semântica e da forma gramatical de אֱלֹהִים.
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência da acusação anterior de modo natural e mantém a força inferencial do hebraico.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem portuguesa corrente e digna.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Representa os dois elementos do título hebraico e evita a repetição pouco natural 'Senhor SENHOR'; as maiúsculas em DEUS sinalizam o nome divino.
- source_word: יַעַן
  choice: Visto que
  rationale: Expressa com clareza a relação causal que fundamenta a declaração divina e se ajusta bem à continuação da sentença.
- source_word: תִּתְּךָ אֶת לְבָבְךָ
  choice: você fez seu coração
  rationale: Mantém a imagem hebraica de fazer ou pôr o coração, sem substituir interpretativamente 'coração' por 'mente' ou 'íntimo'.
- source_word: לְבָבְךָ
  choice: seu coração
  rationale: Conserva a metáfora bíblica, que no hebraico abrange pensamento, vontade e interioridade.
- source_word: כְּלֵב אֱלֹהִים
  choice: como o coração de um deus
  rationale: No contexto da arrogância do governante de Tiro, a leitura indefinida comunica sua pretensão à divindade; a ambiguidade lexical de אֱלֹהִים é preservada em nota.
theological_decisions:
- issue: Sentido de אֱלֹהִים em כְּלֵב אֱלֹהִים
  choice: um deus
  alternative: Deus; deuses
  rationale: O contexto denuncia a autoexaltação de um ser humano, e 'um deus' expressa naturalmente a pretensão divina que está sendo condenada. Como o hebraico também permite 'Deus', essa possibilidade não é eliminada, mas registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por “você” é claro e corrente; a formulação conserva a solenidade profética e a metáfora hebraica do coração. A oração permanece aberta porque o versículo continua sintaticamente na declaração seguinte.
