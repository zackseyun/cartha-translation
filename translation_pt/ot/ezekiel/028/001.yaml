base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: E a palavra de Yahweh veio a mim, dizendo:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, nome divino tradicionalmente representado por «SENHOR»; em português, também ocorre a forma «Javé».
    reason: Informa a forma hebraica e as convenções de representação do nome divino.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה introduz a sequência e, em português natural, integra-se à fórmula «a palavra ... veio», sem recorrer ao arcaísmo «e aconteceu que».
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética, דָּבָר designa a palavra ou mensagem divina; «a palavra» preserva o modo tradicional e reconhecível de expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Reproduz diretamente a ideia de direção para o profeta e se encaixa com naturalidade na construção «veio a mim».
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala direta apresentada no versículo seguinte; «dizendo» mantém essa função de forma clara e convencional.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama como nome próprio. «Yahweh» preserva esse nome, enquanto «SENHOR» o substitui por um título e «Jeová» reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula profética tradicional «a palavra de ... veio a mim». O conectivo hebraico inicial não foi traduzido por «E», pois aqui marca a sequência narrativa e sua omissão produz uma abertura mais natural em português. O marcador [a] foi colocado após a fórmula completa para não interromper a leitura.
