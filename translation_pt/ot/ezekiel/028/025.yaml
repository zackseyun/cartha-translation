  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/קַבְּצִ֣/י אֶת בֵּ֣ית יִשְׂרָאֵ֗ל מִן הָֽ/עַמִּים֙ אֲשֶׁ֣ר נָפֹ֣צוּ בָ֔/ם וְ/נִקְדַּ֥שְׁתִּי בָ֖/ם לְ/עֵינֵ֣י הַ/גּוֹיִ֑ם וְ/יָֽשְׁבוּ֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לְ/עַבְדִּ֥/י לְ/יַעֲקֹֽב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/025.yaml
  text: 'Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they were scattered[a], and I show myself holy among them in the sight of the nations, then they will dwell on their own land that I gave to my servant Jacob.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Quando eu reunir a casa de Israel dentre os povos entre os quais foram dispersos e me mostrar santo no meio deles[a], à vista das nações, então habitarão na sua terra, que dei ao meu servo Jacó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “eu for santificado neles”; a expressão também pode significar “manifestar minha santidade por meio deles”.
    reason: Preserva a forma passiva do hebraico e a ambiguidade de בָם entre sentido locativo e instrumental.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título divino e apresenta explicitamente o nome da aliança, evitando a repetição pouco natural «Senhor SENHOR».
- source_word: בְּקַבְּצִי
  choice: Quando eu reunir
  rationale: O בְּ diante do infinitivo construto tem valor temporal; o futuro do subjuntivo é natural em português após «quando» para uma ação futura.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão corporativa e pactual do hebraico, sem reduzi-la simplesmente a «o povo de Israel».
- source_word: מִן הָעַמִּים אֲשֶׁר נָפֹצוּ בָם
  choice: dentre os povos entre os quais foram dispersos
  rationale: Distingue עַמִּים, «povos», do posterior גּוֹיִם, «nações», e expressa de modo idiomático a dispersão entre esses povos.
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: e me mostrar santo no meio deles
  rationale: Comunica que a santidade de Deus será publicamente manifestada, preservando em «no meio deles» a leitura locativa de בָם; a nota registra a forma passiva e a possível nuance instrumental.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: à vista das nações
  rationale: Reproduz a força pública e visual da expressão hebraica com uma formulação natural em português.
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  choice: então habitarão na sua terra
  rationale: יָשַׁב indica residência estabelecida; «então» explicita a sequência resultante natural no contexto.
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: que dei ao meu servo Jacó
  rationale: Mantém a designação pactual «meu servo» e a relação da oração com a terra.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A opção preserva tanto o título אֲדֹנָי quanto o nome próprio יהוה, sem ocultar o nome da aliança nem produzir «Senhor Senhor».
- issue: Sentido de וְנִקְדַּשְׁתִּי בָם
  choice: me mostrar santo no meio deles
  alternative: ser santificado neles / manifestar minha santidade por meio deles
  rationale: O nifal descreve Deus sendo reconhecido ou manifestado como santo, não adquirindo santidade. Como בָם admite nuance locativa ou instrumental, a tradução principal adota a leitura locativa e a nota preserva as demais possibilidades.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. «Casa de Israel» conserva o idioma bíblico pactual; «à vista das nações» mantém o caráter público da manifestação da santidade divina.
