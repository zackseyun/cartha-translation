  text: 'A palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה, o sentido idiomático é que a palavra divina “veio” ao profeta; evita-se o literalismo pouco natural “e aconteceu”.
- source_word: דְבַר
  choice: A palavra
  rationale: No contexto, דָּבָר designa a comunicação divina. “Palavra” conserva o caráter formular e o peso teológico do hebraico, sem explicitar demais como “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Identifica naturalmente Ezequiel como destinatário da palavra divina.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente convencional do infinitivo hebraico que introduz o conteúdo do discurso seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, não o título אֲדֹנָי. “Yahweh” preserva essa distinção e representa adequadamente o tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com formulação profética tradicional sem arcaísmos. A ordem foi ajustada naturalmente ao português, mantendo a estrutura e a abertura para a fala do versículo seguinte.
