base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/026.yaml
  text: They will dwell on it securely, and they will build houses and plant vineyards. They will dwell securely when I execute judgments on all those who treat them with contempt all around them. Then they will know that I am the LORD their God.
translation:
  language: pt
  text: Habitarão nela em segurança, construirão casas e plantarão vinhas. Habitarão em segurança quando eu executar juízos contra todos os que os tratam com desprezo ao redor deles. Então saberão que eu sou o SENHOR, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשְׁבוּ עָלֶיהָ לָבֶטַח
  choice: Habitarão nela em segurança
  rationale: Reproduz o sentido locativo de עָלֶיהָ, cujo referente é a terra no contexto, e traduz לָבֶטַח de modo natural e preciso.
- source_word: הַשָּׁאטִים אֹתָם
  choice: os que os tratam com desprezo
  rationale: O particípio שׁאט expressa atitude de desprezo ou desdém; a formulação preserva a ação dirigida contra Israel sem restringi-la a mera hostilidade militar.
- source_word: בַּעֲשׂוֹתִי שְׁפָטִים
  choice: quando eu executar juízos
  rationale: Mantém o caráter judicial de שְׁפָטִים e representa a construção temporal בַּעֲשׂוֹתִי.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes tipográficas, aqui indicadas por maiúsculas.
theological_decisions:
- issue: Relação entre segurança e juízo divino
  choice: “quando eu executar juízos”
  alternative: “depois que eu executar juízos”
  rationale: A preposição בְּ com o infinitivo construto pode ter valor temporal sem determinar rigidamente se a segurança começa apenas após a conclusão dos juízos; “quando” preserva essa abertura.
- issue: Identidade dos alvos do juízo
  choice: “todos os que os tratam com desprezo ao redor deles”
  alternative: “todos ao redor deles que os tratam com desprezo”
  rationale: A redação escolhida mantém הַשָּׁאטִים como caracterização essencial dos alvos, enquanto מִסְּבִיבוֹתָם indica sua localização circundante.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo preservado pela repetição de “Habitarão em segurança”. “Nela” retoma naturalmente a terra mencionada no contexto. Não há notas de rodapé necessárias para este versículo.
