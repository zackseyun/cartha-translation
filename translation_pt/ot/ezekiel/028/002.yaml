source:
  edition: WLC
  text: בֶּן אָדָ֡ם אֱמֹר֩ לִ/נְגִ֨יד צֹ֜ר כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן גָּבַ֤הּ לִבְּ/ךָ֙ וַ/תֹּ֨אמֶר֙ אֵ֣ל אָ֔נִי מוֹשַׁ֧ב אֱלֹהִ֛ים יָשַׁ֖בְתִּי בְּ/לֵ֣ב יַמִּ֑ים וְ/אַתָּ֤ה אָדָם֙ וְֽ/לֹא אֵ֔ל וַ/תִּתֵּ֥ן לִבְּ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/002.yaml
  text: 'Son of man[a], say to the prince of Tyre, ‘Thus says the Lord GOD: Because your heart is proud, and you say, “I am a god; I sit in the seat of gods in the heart of the seas,” yet you are a man and not a god[b], though you set your heart like the heart of gods.”'
translation:
  language: pt
  text: 'Filho do homem, diga ao governante de Tiro: “Assim diz o Senhor DEUS: Porque o seu coração se tornou arrogante e você diz: ‘Eu sou um deus; estou sentado no assento dos deuses, no coração dos mares’[a], você, porém, é homem, e não deus, embora tenha feito o seu coração semelhante ao coração dos deuses[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu sou Deus; estou sentado no assento de Deus, no coração dos mares”. Os termos hebraicos אֵל e אֱלֹהִים podem ser entendidos aqui em sentido singular.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “semelhante ao coração de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma característica com que Deus se dirige ao profeta em Ezequiel, preservando o conhecido idioma hebraico sem reduzi-lo a uma paráfrase genérica.
- source_word: לִנְגִיד צֹר
  choice: ao governante de Tiro
  rationale: נָגִיד designa um líder, dirigente ou príncipe. “Governante” é natural no português atual e evita identificá-lo aqui, de modo mais específico, como “rei”.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Traduz os dois elementos do título composto e evita a repetição “Senhor SENHOR”; as maiúsculas em “DEUS” sinalizam que o termo representa o nome divino יהוה.
- source_word: יַעַן גָּבַהּ לִבְּךָ
  choice: Porque o seu coração se tornou arrogante
  rationale: Expressa em português corrente o sentido idiomático de um coração que se elevou, mantendo tanto a imagem do coração quanto a relação causal introduzida por יַעַן.
- source_word: אֵל אֲנִי
  choice: Eu sou um deus
  rationale: אֵל pode designar genericamente uma divindade. No contexto, a frase exprime a arrogante pretensão divina do governante; a leitura singular definida, “Eu sou Deus”, continua possível e é registrada em nota.
- source_word: מוֹשַׁב אֱלֹהִים
  choice: o trono dos deuses
  rationale: מוֹשָׁב pode indicar assento, lugar de sentar ou morada. “Trono” comunica naturalmente aqui a imagem de autoridade e entronização reivindicada pelo governante, enquanto “dos deuses” conserva a leitura plural contextual de אֱלֹהִים.
- source_word: בְּלֵב יַמִּים
  choice: no coração dos mares
  rationale: Preserva a imagem vívida do hebraico para o centro ou meio dos mares, adequada à localização marítima de Tiro.
- source_word: וְאַתָּה אָדָם וְלֹא אֵל
  choice: você, porém, é homem, e não deus
  rationale: “Homem” é apropriado para o governante masculino individual e mantém o contraste retórico entre sua humanidade e sua pretensão à divindade.
- source_word: וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים
  choice: embora tenha feito o seu coração semelhante ao coração dos deuses
  rationale: Mantém a repetição enfática de “coração” e comunica a autoavaliação presunçosa do governante. A leitura singular de אֱלֹהִים é preservada em nota.
theological_decisions:
- issue: Se אֵל e אֱלֹהִים na pretensão do governante indicam genericamente divindade/deuses ou o único Deus
  choice: Traduzir no texto como “um deus” e “os deuses”.
  alternative: “Eu sou Deus; estou sentado no trono de Deus” e “o coração de Deus”.
  rationale: O contexto denuncia a autodeificação arrogante de um governante pagão, e os termos hebraicos admitem a leitura genérica ou plural. Contudo, אֱלֹהִים também pode ter sentido singular; por isso, a alternativa teologicamente significativa é explicitada nas notas, sem apagar a ambiguidade do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para dirigir-se com clareza ao governante individual, conserva as imagens hebraicas de “coração” e “mares” e usa “governante” em vez do mais histórico ou potencialmente ambíguo “príncipe”.
