source:
  edition: WLC
  text: בְּ/רֹ֧ב חָכְמָתְ/ךָ֛ בִּ/רְכֻלָּתְ/ךָ֖ הִרְבִּ֣יתָ חֵילֶ֑/ךָ וַ/יִּגְבַּ֥הּ לְבָבְ/ךָ֖ בְּ/חֵילֶֽ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/005.yaml
  text: By your great wisdom in your trade you increased your wealth[c][b][a], and your heart became proud because of your wealth.
translation:
  language: pt
  text: Com a sua grande sabedoria no comércio[a], você aumentou a sua riqueza[c], e o seu coração se encheu de orgulho[b] por causa da sua riqueza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas suas transações comerciais”. O termo hebraico se refere à atividade mercantil.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o seu coração se elevou”, expressão que indica orgulho ou arrogância.'
    reason: lexical_alternative
  - marker: c
    text: A palavra hebraica traduzida como “riqueza” também pode significar “recursos” e, em outros contextos, “força” ou “poder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: Com a sua grande
  rationale: A construção בְּ + רֹב indica meio ou circunstância, literalmente algo como “pela abundância de”. “Com a sua grande” é natural em português e conserva a ideia de magnitude.
- source_word: חָכְמָתְךָ
  choice: sabedoria
  rationale: חָכְמָה significa normalmente “sabedoria”, embora neste contexto comercial possa incluir habilidade prática ou perspicácia. “Sabedoria” preserva o núcleo lexical e deixa a nuance ao contexto.
- source_word: בִּרְכֻלָּתְךָ
  choice: no comércio
  rationale: רְכֻלָּה designa atividade mercantil, especialmente em Ezequiel. “No comércio” é claro, atual e evita sugerir apenas as mercadorias em si.
- source_word: הִרְבִּיתָ
  choice: você aumentou
  rationale: O hifil de רבה indica fazer crescer ou multiplicar. “Aumentou” combina naturalmente com “riqueza”.
- source_word: חֵילֶךָ
  choice: sua riqueza
  rationale: חַיִל pode significar força, poder, recursos ou riqueza. O contexto mercantil de Tiro favorece “riqueza” nas duas ocorrências.
- source_word: וַיִּגְבַּהּ לְבָבְךָ
  choice: o seu coração se encheu de orgulho
  rationale: A expressão hebraica diz literalmente que o coração “se elevou” e comunica orgulho ou arrogância. A formulação escolhida transmite o sentido idiomático em português corrente.
- source_word: בְּחֵילֶךָ
  choice: por causa da sua riqueza
  rationale: Aqui בְּ provavelmente indica causa ou ocasião. “Por causa da sua riqueza” explicita essa relação de modo natural.
theological_decisions:
- issue: Amplitude semântica de חֵיל entre riqueza, recursos, força e poder
  choice: riqueza
  alternative: poder, força ou recursos
  rationale: O oráculo trata do governante de Tiro em contexto de comércio e prosperidade. “Riqueza” oferece a melhor coerência contextual, enquanto a nota preserva os outros sentidos possíveis.
- issue: Tradução literal ou idiomática da elevação do coração
  choice: o seu coração se encheu de orgulho
  alternative: o seu coração se elevou
  rationale: A tradução idiomática comunica claramente a arrogância indicada pelo hebraico, e a nota mantém acessível a imagem original.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade brasileira e compreensão internacional ampla. A ordem das notas acompanha os termos correspondentes no texto; todas as marcas aparecem no corpo do versículo.
