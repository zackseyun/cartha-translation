base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/003.yaml
  text: Look[a], you are wiser than Danel; no hidden thing is obscure to you.
translation:
  language: pt
  text: 'Veja: você é mais sábio do que Danel[a]; nenhuma coisa oculta lhe é obscura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Danel”; tradicionalmente, “Daniel”. Aqui, a grafia não contém o yod presente na forma mais conhecida do nome, por isso o texto principal preserva a forma hebraica.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz uma afirmação enfática e preserva a força dêitica do hebraico em português atual, sem o tom arcaico de “Eis”.
- source_word: חָכָם ... מ/דנאל
  choice: mais sábio do que Danel
  rationale: Embora חָכָם seja formalmente “sábio”, a preposição מ־ diante do nome estabelece a comparação, expressa naturalmente em português por “mais sábio do que”.
- source_word: דנאל
  choice: Danel
  rationale: A forma consonantal no texto é דנאל, sem o yod da forma mais conhecida דניאל; por isso, o texto principal conserva “Danel” e registra a forma tradicional em nota.
- source_word: כָּל סָתוּם
  choice: nenhum mistério
  rationale: No âmbito da sabedoria, סָתוּם designa aquilo que está fechado, oculto ou secreto. “Nenhum mistério” comunica o sentido distributivo da construção com a negação seguinte de modo natural e digno.
- source_word: לֹא עֲמָמוּךָ
  choice: é obscuro para você
  rationale: O verbo sugere obscurecimento ou falta de clareza, não apenas ocultação. A formulação mantém a distinção entre o mistério e o fato de ele não permanecer obscuro ao destinatário.
theological_decisions:
- issue: Identidade de Danel
  choice: Preservar “Danel” sem identificar a personagem no corpo do versículo.
  alternative: Traduzir “Daniel” e identificar diretamente a personagem com o conhecido profeta bíblico.
  rationale: A grafia hebraica permite que se discuta se a referência é ao profeta Daniel ou a outra figura proverbialmente sábia. A tradução não deve resolver essa ambiguidade textual e histórica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Veja” dá ênfase sem arcaísmo; “você” torna a declaração direta e natural. A nota preserva a incerteza quanto ao nome sem sobrecarregar o texto principal.
