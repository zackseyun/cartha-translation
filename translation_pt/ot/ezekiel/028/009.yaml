  terminology: “Um deus” evita indevidamente identificar a pretensão do príncipe com o Deus de Israel e reproduz bem o contraste retórico. “Profanam” é terminologia semanticamente pertinente; a nota oferece de modo útil alternativas mais físicas ou mais gerais.
