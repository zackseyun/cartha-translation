  source_fidelity: O texto representa com precisão a pergunta enfática do infinitivo absoluto seguido de imperfeito (הֶאָמֹר תֹּאמַר) por “Será que você ainda dirá?”. Mantém adequadamente o contraste entre אָדָם (“homem”, referente ao governante) e אֵל (“um deus”), bem como a imagem de sujeição em “nas mãos”. “Os que o profanam” é uma opção lexical defensável para מְחַלְלֶיךָ e preserva a ironia contextual da falsa divindade humilhada.
