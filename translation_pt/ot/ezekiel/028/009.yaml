  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶ/אָמֹ֤ר תֹּאמַר֙ אֱלֹהִ֣ים אָ֔נִי לִ/פְנֵ֖י הֹֽרְגֶ֑/ךָ וְ/אַתָּ֥ה אָדָ֛ם וְ/לֹא אֵ֖ל בְּ/יַ֥ד מְחַלְלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/009.yaml
  text: Will you still say[a], ‘I am a god,’ before the one who kills you? But you are a man, and not a god[c][b], in the hand of those who wound you.
translation:
  language: pt
  text: 'Será que você ainda dirá[a]: “Eu sou um deus”, diante daquele que o mata? Mas você é homem, e não um deus[b], nas mãos dos que o profanam[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que você realmente continuará dizendo?” O hebraico intensifica o verbo por meio de uma construção enfática.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, um ser humano, em contraste com uma divindade.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dos que o ferem” ou “dos que o desonram”. O verbo hebraico pode transmitir a ideia de profanar ou dessacralizar, ressaltando a humilhação daquele que afirmava ser divino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמֹר תֹּאמַר
  choice: Será que você ainda dirá
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a pergunta. Esta formulação transmite em português a ênfase e o tom de desafio, sem reproduzir de modo artificial a repetição hebraica.
- source_word: אֱלֹהִים
  choice: um deus
  rationale: No contexto, o governante de Tiro reivindica condição divina. O indefinido expressa naturalmente em português essa pretensão, sem identificá-lo especificamente com o Deus de Israel.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva de modo natural a relação espacial e confrontadora da expressão hebraica.
- source_word: הֹרְגֶךָ
  choice: aquele que o mata
  rationale: A expressão agentiva mantém a força ativa do particípio e apresenta a morte como o desmentido concreto da alegação de divindade.
- source_word: אָדָם
  choice: homem
  rationale: Refere-se diretamente ao governante masculino e forma o contraste retórico com sua alegação de ser um deus.
- source_word: אֵל
  choice: um deus
  rationale: Retoma e nega a pretensão de divindade do governante; a forma indefinida é idiomática em português e adequada ao contexto.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Mantém a imagem hebraica de estar sob o poder de alguém, usando a forma idiomática corrente em português.
- source_word: מְחַלְלֶיךָ
  choice: os que o profanam
  rationale: A forma é entendida a partir de חלל no sentido de profanar, desonrar ou tratar como comum. A escolha preserva a ironia da humilhação daquele que se dizia divino, sem ocultar alternativas contextuais como ferir.
theological_decisions:
- issue: A alegação de divindade do governante
  choice: “Eu sou um deus” ... “você é homem, e não um deus”
  alternative: “Eu sou Deus” ... “você é homem, e não Deus”
  rationale: O contexto ridiculariza a autodeificação do governante de Tiro. O artigo indefinido comunica essa alegação sem sugerir necessariamente que ele se identifica pelo nome com o Deus de Israel.
- issue: Sentido de מְחַלְלֶיךָ
  choice: os que o profanam
  alternative: os que o ferem; os que o desonram
  rationale: '“Profanam” conserva o peso de dessacralização e a ironia teológica: quem reivindica divindade será humilhado e tratado como comum. A nota registra a possibilidade de um sentido físico no contexto da morte.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “você”, adequado à interpelação direta. “Nas mãos” soa mais idiomático em português que o singular literal e preserva a imagem de sujeição ao poder dos executores.
