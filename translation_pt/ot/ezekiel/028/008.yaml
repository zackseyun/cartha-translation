review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a descida causativa à cova, a localização «no coração dos mares» e o sentido de morte violenta. Contudo, «como morrem os que são mortos» transforma a expressão hebraica em uma comparação redundante e perde sua função idiomática intensiva.
  naturalness: «Eles o farão descer» e «você morrerá» são naturais e apropriados ao registro profético moderno. A formulação atual para מְמוֹתֵי חָלָל é artificial e tautológica; «morrerá de morte violenta» é idiomática em português e comunica o sentido pretendido.
  terminology: «Cova» mantém a imagem concreta de שַׁחַת sem impor uma leitura específica do além. «Morte violenta» traduz com clareza o valor idiomático de מְמוֹתֵי חָלָל; a nota conserva a informação sobre a construção hebraica.
  issues:
