base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/008.yaml
  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
translation:
  language: pt
  text: Eles o farão descer à cova[a], e você morrerá de morte violenta[b] no coração dos mares[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “à sepultura” ou “à destruição”; hebraico: “à cova”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “as mortes de alguém abatido”, uma expressão que indica morte violenta.
    reason: lexical_alternative
  - marker: c
    text: Ou “no meio dos mares”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשַּׁחַת
  choice: à cova
  rationale: Preserva a imagem concreta de descida a uma cova ligada à morte, sem especificar indevidamente uma doutrina do além.
- source_word: יוֹרִדוּךָ
  choice: o farão descer
  rationale: Expressa diretamente a forma causativa do verbo ירד e mantém o pronome masculino singular do destinatário.
- source_word: וָמַתָּה
  choice: e você morrerá
  rationale: Formulação moderna e clara que conserva a força futura da declaração profética.
- source_word: מְמוֹתֵי חָלָל
  choice: como morrem os que são mortos
  rationale: Traduz de modo natural o plural idiomático hebraico e preserva a imagem de morte violenta, sem reduzir toda a expressão a uma abstração.
- source_word: חָלָל
  choice: os que são mortos
  rationale: Representa o sentido usual de pessoas mortas violentamente ou abatidas.
- source_word: בְּלֵב יַמִּים
  choice: no coração dos mares
  rationale: Mantém a metáfora espacial vívida de לֵב e a forma plural 'mares', coerente com a linguagem marítima de Ezequiel.
theological_decisions:
- issue: Se שַׁחַת deve ser traduzido por um termo teologicamente específico para o mundo dos mortos
  choice: à cova
  alternative: à sepultura; à destruição; ao abismo
  rationale: O termo evoca morte, ruína e descida, mas não exige aqui uma concepção específica do além. 'Cova' conserva a imagem sem acrescentar precisão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'você morrerá' evita o registro arcaico de 'tu morrerás'; 'no coração dos mares' preserva a força poética do hebraico.
