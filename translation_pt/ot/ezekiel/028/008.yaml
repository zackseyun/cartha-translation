    issue: A expressão «como morrem os que são mortos» é redundante e altera a construção.
    rationale: O hebraico não diz que o destinatário morrerá «como» outras pessoas morrem, mas emprega uma expressão intensiva, literalmente «mortes de um morto/abatido», para caracterizar sua própria morte como violenta.
  - severity: low
    issue: A nota b diz «os mortos», sem explicitar a nuance de morte violenta de חָלָל.
    rationale: חָלָל designa alguém abatido ou morto violentamente, não apenas uma pessoa morta em sentido genérico.
  revised_text: Eles o farão descer à cova[a], e você morrerá de morte violenta[b] no coração dos mares[c].
