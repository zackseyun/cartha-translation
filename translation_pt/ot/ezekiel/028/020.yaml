lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה אלי, «veio» é a expressão natural em português e mantém o sentido de que a palavra divina foi dirigida ao profeta.
- source_word: דְבַר
  choice: a palavra
  rationale: Aqui, דָּבָר designa a palavra ou mensagem profética. «A palavra» preserva a fórmula consagrada e seu peso teológico sem explicitação interpretativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Indica Ezequiel como destinatário da palavra profética e reproduz naturalmente a construção hebraica.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz a fala divina do versículo seguinte, preservando a ligação sintática e discursiva do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» conserva o nome pessoal em transliteração e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com a fórmula profética preservada de modo natural. A coordenação inicial «E» e o particípio «dizendo» mantêm a continuidade explícita com o contexto seguinte.
