base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/014.yaml
  text: You were an anointed guardian cherub[a], and I placed you on the holy mountain of God[b]; you walked in the midst of stones of fire.
translation:
  language: pt
  text: Você[b] era um querubim ungido, protetor[a], e eu o coloquei no monte santo de Deus; você caminhou no meio das pedras de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “querubim ungido que cobre”; tradicionalmente, “querubim ungido, cobridor”.'
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico começa com uma forma feminina do pronome “você”, enquanto os verbos e sufixos do contexto estão no masculino; o sentido continua sendo o singular “você”.
    reason: textual_variant
lexical_decisions:
- source_word: כְּרוּב
  choice: querubim
  rationale: É o termo consagrado em português para a criatura celestial associada à guarda do espaço sagrado e preserva a imagem específica do hebraico.
- source_word: מִמְשַׁח
  choice: ungido
  rationale: O substantivo ligado à unção funciona aqui adjetivamente em relação a 'querubim', preservando a ideia de consagração.
- source_word: הַסּוֹכֵךְ
  choice: o protetor
  rationale: O particípio de סכך expressa cobrir ou abrigar; 'protetor' comunica naturalmente a função, enquanto a formulação mais literal é registrada em nota.
- source_word: וּנְתַתִּיךָ
  choice: e eu o coloquei
  rationale: נתן, neste contexto locativo, tem naturalmente o sentido de pôr ou colocar. O pronome objeto masculino retoma o destinatário sem resolver sua identidade teológica.
- source_word: בְּהַר קֹדֶשׁ אֱלֹהִים
  choice: no monte santo de Deus
  rationale: Reproduz com naturalidade a cadeia construta e mantém o cenário elevado e sagrado.
- source_word: בְּתוֹךְ אַבְנֵי אֵשׁ
  choice: no meio das pedras de fogo
  rationale: A tradução próxima da forma hebraica conserva a imagem poética vívida e enigmática.
- source_word: הִתְהַלָּכְתָּ
  choice: você andava
  rationale: O hitpael de הלך pode indicar deslocamento reiterado; o imperfeito português 'andava' expressa bem a ação contínua ou habitual no cenário descrito.
- source_word: אַתְּ
  choice: Você
  rationale: Embora a forma escrita do pronome seja feminina singular, os verbos e sufixos ao redor são masculinos singulares; o português emprega o pronome singular sem marcar essa irregularidade no corpo do texto.
theological_decisions:
- issue: Natureza do destinatário na lamentação sobre o rei de Tiro
  choice: Manter a elevada imagem querúbica sem definir a identidade além do que o versículo afirma.
  alternative: Entender a linguagem exclusivamente como metáfora régia, como referência a um ser sobrenatural ou como referência dupla/tipológica.
  rationale: O hebraico emprega linguagem sacral e elevada que admite tensão interpretativa. A tradução não deve impor uma identificação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar as imagens enigmáticas do original. Todos os marcadores de nota aparecem no texto principal.
