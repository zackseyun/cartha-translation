  text: בְּ/עֵ֨דֶן גַּן אֱלֹהִ֜ים הָיִ֗יתָ כָּל אֶ֨בֶן יְקָרָ֤ה מְסֻכָתֶ֨/ךָ֙ אֹ֣דֶם פִּטְדָ֞ה וְ/יָהֲלֹ֗ם תַּרְשִׁ֥ישׁ שֹׁ֨הַם֙ וְ/יָ֣שְׁפֵ֔ה סַפִּ֣יר נֹ֔פֶךְ וּ/בָרְקַ֖ת וְ/זָהָ֑ב מְלֶ֨אכֶת תֻּפֶּ֤י/ךָ וּ/נְקָבֶ֨י/ךָ֙ בָּ֔/ךְ בְּ/י֥וֹם הִבָּרַאֲ/ךָ֖ כּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/013.yaml
  text: 'You were in Eden[a], the garden of God; every precious stone was your covering: ruby, topaz, and diamond; beryl, onyx, and jasper; sapphire, turquoise, and emerald; and gold. The workmanship of your tambourines and your sockets was in you; on the day you were created[b], they were prepared.'
translation:
  language: pt
  text: 'Você estava no Éden, o jardim de Deus; toda pedra preciosa era sua cobertura: rubi, topázio e diamante; berilo, ônix e jaspe; safira, turquesa e esmeralda; e ouro.[a] O trabalho artesanal de seus tamborins e de seus encaixes[b] estava em você; no dia em que você foi criado, eles foram preparados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de várias pedras deste versículo é incerta, pois os nomes antigos das gemas nem sempre correspondem com precisão aos termos modernos. Entre outras possibilidades, “rubi” pode ser “cornalina”; “topázio” ou “berilo”, “crisólito”; “safira”, “lápis-lazúli”; e “turquesa” ou “esmeralda”, outra pedra de identificação incerta, como granada ou carbúnculo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “O trabalho artesanal de seus engastes e de suas armações estava em você”. Os termos hebraicos são difíceis e podem descrever o trabalho de joalheria, em vez de instrumentos musicais e encaixes.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵדֶן גַּן אֱלֹהִים
  choice: no Éden, o jardim de Deus
  rationale: Mantém Éden como nome próprio e preserva a aposição hebraica, com formulação natural e solene em português.
- source_word: כָּל אֶבֶן יְקָרָה מְסֻכָתֶךָ
  choice: toda pedra preciosa era sua cobertura
  rationale: Conserva a construção nominal e não define se a cobertura era vestimenta, adorno ou revestimento protetor.
- source_word: אֹדֶם פִּטְדָה וְיָהֲלֹם תַּרְשִׁישׁ שֹׁהַם וְיָשְׁפֵה סַפִּיר נֹפֶךְ וּבָרְקַת
  choice: rubi, topázio e diamante; berilo, ônix e jaspe; safira, turquesa e esmeralda
  rationale: Emprega identificações tradicionais e compreensíveis, mantendo a incerteza histórica dos nomes das gemas em nota.
- source_word: מְלֶאכֶת תֻּפֶּיךָ וּנְקָבֶיךָ
  choice: o trabalho artesanal de seus tamborins e de seus encaixes
  rationale: Traduz מְלֶאכֶת como trabalho artesanal e conserva os dois termos difíceis de modo relativamente formal; a possível leitura inteiramente ligada à joalheria é apresentada em nota.
- source_word: בְּיוֹם הִבָּרַאֲךָ כּוֹנָנוּ
  choice: no dia em que você foi criado, eles foram preparados
  rationale: Mantém explicitamente a linguagem de criação e entende o verbo plural como retomando os elementos mencionados na oração anterior.
theological_decisions:
- issue: Identidade do destinatário e alcance das imagens do Éden
  choice: Traduzir diretamente as imagens do Éden e da criação sem identificar o destinatário como sendo apenas o rei de Tiro, uma figura mítica ou Satanás.
  alternative: Explicitar na tradução uma referência exclusiva ao rei de Tiro ou uma referência tipológica ao querubim caído/Satanás.
  rationale: O versículo contém linguagem exaltada de Éden e criação, mas não resolve por si só a identidade em debate; a tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “você” para leitura natural no Brasil. A enumeração mantém o ritmo solene do hebraico; os marcadores foram colocados junto às expressões que as respectivas notas explicam.
