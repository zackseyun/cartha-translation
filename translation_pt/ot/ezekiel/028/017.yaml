  text: גָּבַ֤הּ לִבְּ/ךָ֙ בְּ/יָפְיֶ֔/ךָ שִׁחַ֥תָּ חָכְמָתְ/ךָ֖ עַל יִפְעָתֶ֑/ךָ עַל אֶ֣רֶץ הִשְׁלַכְתִּ֗י/ךָ לִ/פְנֵ֧י מְלָכִ֛ים נְתַתִּ֖י/ךָ לְ/רַ֥אֲוָה בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/017.yaml
  text: Your heart was lifted up because of your beauty[a]; you corrupted your wisdom because of your splendor. I cast you to the earth; I set you before kings[c][b], for them to look at you.
translation:
  language: pt
  text: Seu coração se encheu de orgulho por causa da sua beleza; você corrompeu a sua sabedoria por causa do seu esplendor. Eu lancei você por terra; coloquei você diante de reis, para que olhassem para você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como espetáculo para os reis verem”.'
    reason: A construção final pode realçar a exposição pública do destinatário diante dos reis, em vez de expressar de modo mais literal a finalidade de eles olharem para ele.
lexical_decisions:
- source_word: גָּבַהּ לִבְּךָ
  choice: Seu coração se encheu de orgulho
  rationale: Expressa em português natural o idiomatismo hebraico do coração que se torna elevado, preservando seu claro sentido moral de orgulho.
- source_word: בְּיָפְיֶךָ
  choice: por causa da sua beleza
  rationale: Entende ב em sentido causal, adequado ao contexto e natural em português.
- source_word: שִׁחַתָּ חָכְמָתְךָ
  choice: você corrompeu a sua sabedoria
  rationale: Mantém tanto a deterioração indicada pelo verbo quanto o sentido amplo de חָכְמָה como sabedoria prática e política.
- source_word: עַל יִפְעָתֶךָ
  choice: por causa do seu esplendor
  rationale: Toma עַל causalmente e traduz יִפְעָה por um termo digno que abrange brilho, imponência e aparência radiante.
- source_word: עַל אֶרֶץ הִשְׁלַכְתִּיךָ
  choice: Eu o lancei por terra
  rationale: A expressão portuguesa comunica com força e naturalidade o ato de derrubar ao chão, sem perder a imagem de juízo.
- source_word: לִפְנֵי מְלָכִים נְתַתִּיךָ
  choice: coloquei-o diante de reis
  rationale: Reproduz de perto a construção hebraica sem acrescentar prematuramente a ideia interpretativa de espetáculo.
- source_word: לְרַאֲוָה בָךְ
  choice: para que olhassem para você
  rationale: Traduz a finalidade expressa pelo infinitivo e apresenta naturalmente o destinatário implícito da ação de olhar.
theological_decisions:
- issue: Identidade do destinatário em Ezequiel 28:17
  choice: Manter a segunda pessoa singular e a linguagem elevada da lamentação dirigida ao rei de Tiro, sem identificar explicitamente uma figura sobrenatural.
  alternative: Interpretar o texto exclusivamente como referência a um governante humano ou como alusão adicional a um rebelde celestial.
  rationale: O versículo não resolve por si só essa questão; a tradução preserva a tensão e evita importar uma identificação teológica não expressa no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. O paralelismo poético e o tom profético de juízo foram preservados.
