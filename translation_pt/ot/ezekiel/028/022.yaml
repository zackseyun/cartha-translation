base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/022.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Sidon, and I will be glorified in your midst[b]. And they will know that I am Yahweh when I execute judgments in her and show myself holy in her.’'
translation:
  language: pt
  text: 'e diga: “Assim diz o Senhor Yahweh: Eis que estou contra você, Sidom. Serei glorificado em seu meio[a]. E saberão que eu sou Yahweh, quando eu executar juízos nela e me mostrarei santo nela[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ganharei glória em seu meio”. O verbo hebraico pode enfatizar tanto que Deus seja honrado quanto a manifestação de sua glória por meio do juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serei santificado nela” ou “manifestarei nela a minha santidade”. A expressão indica que a santidade de Yahweh é publicamente demonstrada e vindicada por seus atos de juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי e representa o nome divino יהוה como Yahweh, sem confundir os dois elementos da expressão hebraica.
- source_word: הִנְנִי עָלַיִךְ
  choice: Eis que estou contra você
  rationale: “Eis que” conserva a solenidade da declaração profética, e “contra você” comunica o sentido hostil de עַל neste contexto.
- source_word: צִידוֹן
  choice: Sidom
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: וְנִכְבַּדְתִּי
  choice: Serei glorificado
  rationale: O nifal de כבד expressa aqui que Deus será reconhecido em sua glória ou manifestará sua glória por meio do juízo; a forma mantém essa amplitude.
- source_word: בְּתוֹכֵךְ
  choice: no meio de você
  rationale: Reproduz a expressão locativa dirigida à cidade personificada no feminino, com formulação clara em português moderno.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: Preserva o sujeito plural não expresso da fórmula recorrente em Ezequiel; “então” torna natural a progressão resultante no contexto.
- source_word: בַּעֲשׂוֹתִי בָהּ שְׁפָטִים
  choice: quando eu executar juízos nela
  rationale: O infinitivo com בְּ tem valor temporal, e “executar juízos” conserva tanto o caráter judicial quanto os atos concretos de julgamento.
- source_word: וְנִקְדַּשְׁתִּי בָהּ
  choice: nela me mostrar santo
  rationale: Comunica que Yahweh manifesta e vindica publicamente sua santidade por seus atos, sem reduzir o nifal a uma santificação conferida por terceiros.
theological_decisions:
- issue: Fórmulas de glorificação e santificação divinas
  choice: Serei glorificado ... e nela me mostrar santo
  alternative: Ganharei glória ... e serei santificado nela
  rationale: A redação preserva a tensão entre o reconhecimento da glória de Deus e a manifestação pública de sua santidade por meio do juízo, sem transformar as expressões apenas em reputação humana.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o nome pessoal divino, distinguindo-o do título אֲדֹנָי.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” para a cidade personificada. A mudança de “você” para “nela” acompanha a mudança do hebraico da interpelação direta para a referência à cidade na terceira pessoa. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
