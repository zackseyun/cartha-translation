base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/021.yaml
  text: Son of man[a], set your face toward Sidon, and prophesy against her.
translation:
  language: pt
  text: “Filho do homem[a], volte o rosto para Sidom e profetize contra ela.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser humano” ou “mortal”. Em hebraico, “filho do homem”, forma comum de Deus dirigir-se a Ezequiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a expressão hebraica e sua repetição característica como forma de Deus se dirigir a Ezequiel; aqui designa o profeta como ser humano, sem impor sentido cristológico.
- source_word: שִׂים פָּנֶיךָ
  choice: volte o rosto
  rationale: Expressa em português natural a orientação deliberada indicada pelo imperativo e mantém a imagem concreta de 'rosto' do idioma profético hebraico.
- source_word: אֶל צִידוֹן
  choice: para Sidom
  rationale: אֶל indica direção neste idioma; 'para' evita antecipar a ideia adversativa, que aparece explicitamente na oração seguinte. 'Sidom' é a forma tradicional e corrente do topônimo em português bíblico.
- source_word: וְהִנָּבֵא
  choice: e profetize
  rationale: Equivalente direto e corrente do imperativo de נבא no contexto de uma comissão profética.
- source_word: עָלֶיהָ
  choice: contra ela
  rationale: No contexto de um oráculo de juízo, עַל com 'profetizar' tem sentido adversativo. O pronome feminino retoma a cidade de Sidom, de gênero feminino em português.
theological_decisions:
- issue: Sentido da forma de tratamento בֶּן אָדָם em Ezequiel
  choice: Filho do homem
  alternative: ser humano; mortal
  rationale: Trata-se da forma recorrente de Deus se dirigir a Ezequiel, destacando sua condição humana. A tradução conserva o idioma e a coerência literária sem transformá-lo aqui em título messiânico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação mantém o paralelismo conciso da ordem profética e a personificação feminina da cidade.
