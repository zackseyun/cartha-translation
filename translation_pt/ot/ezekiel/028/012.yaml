source:
  edition: WLC
  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
translation:
  language: pt
  text: 'Filho do homem, entoe uma lamentação pelo rei de Tiro e diga-lhe: “Assim diz o Senhor Yahweh: Você era[a] o selo da perfeição[b], cheio de sabedoria e perfeito em beleza.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Você é”; o hebraico não traz um verbo de ligação explícito, e o tempo verbal é suprido pelo contexto.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “o selo da perfeição”; também pode ser entendido como “o sinete da perfeição” ou “aquele que sela o modelo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma consagrada e o caráter recorrente dessa maneira de Yahweh dirigir-se a Ezequiel, sem transformar a expressão em título cristológico.
- source_word: שָׂא קִינָה
  choice: entoe uma lamentação
  rationale: Expressa naturalmente o idioma hebraico de levantar ou iniciar um lamento, preservando seu tom poético e solene.
- source_word: עַל מֶלֶךְ צֹר
  choice: pelo rei de Tiro
  rationale: Com linguagem de lamentação, “pelo” identifica de modo natural em português aquele que é objeto do lamento.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יְהוָה e preserva explicitamente o nome da aliança.
- source_word: אַתָּה
  choice: Você era
  rationale: O hebraico traz apenas o pronome, sem cópula explícita. O passado é suprido pelo contexto da lamentação e pela descrição subsequente da antiga grandeza do rei.
- source_word: חוֹתֵם תָּכְנִית
  choice: o selo da perfeição
  rationale: Oferece uma expressão portuguesa clara e elevada para uma construção hebraica difícil, conservando em nota as alternativas ligadas a sinete, modelo e ato de selar.
- source_word: מָלֵא חָכְמָה
  choice: cheio de sabedoria
  rationale: Tradução direta, clara e idiomática.
- source_word: וּכְלִיל יֹפִי
  choice: e perfeito em beleza
  rationale: Comunica a ideia de totalidade ou completude e preserva o paralelismo poético da descrição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: Mantém distinto o título “Senhor” e o nome próprio divino “Yahweh”, em vez de substituir o nome por um título.
- issue: Referente imediato da linguagem exaltada
  choice: Preservar a referência textual ao rei de Tiro sem acrescentar identificação sobrenatural
  alternative: Explicitar no texto uma referência a Satanás ou a outro ser sobrenatural
  rationale: O versículo dirige a lamentação ao rei de Tiro. A tradução não resolve antecipadamente possíveis leituras tipológicas ou teológicas do contexto mais amplo.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. Emprega “você” para a segunda pessoa singular por sua ampla compreensão contemporânea, enquanto conserva expressões bíblicas reconhecíveis como “Filho do homem” e o ritmo poético da lamentação.
