  source_fidelity: A declaração futura, a peste, o sangue, as vítimas mortas, o reconhecimento de Yahweh e a imagem do ataque de todos os lados foram preservados. Contudo, «quando a espada vier» torna a relação da espada com a queda dos mortos principalmente temporal, enquanto בְּחֶרֶב expressa o meio/instrumento. A revisão restitui essa relação sem perder a clareza.
  naturalness: «Sangue às suas ruas» é pouco natural em português atual. «Sangue em suas ruas» é claro e conserva o substantivo concreto e a localização urbana. «Pela espada que vier contra ela por todos os lados» é uma formulação fluente que deixa explícita em português a construção elíptica hebraica.
  terminology: «Peste» é apropriado para דֶּבֶר no registro profético; «os mortos» é aceitável para חָלָל neste contexto; e «Yahweh» preserva o Tetragrama. A nota mantém «sangue» no texto e registra a alternativa interpretativa «derramamento de sangue».
