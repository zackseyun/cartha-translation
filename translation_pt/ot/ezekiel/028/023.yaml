base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/023.yaml
  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
translation:
  language: pt
  text: Enviarei peste contra ela e sangue[a] em suas ruas; os mortos cairão no meio dela, pela espada que vier contra ela por todos os lados. Então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «derramamento de sangue em suas ruas». O hebraico diz literalmente «sangue», provavelmente referindo-se a mortes violentas na cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Enviarei
  rationale: O perfeito com waw em discurso profético expressa aqui uma declaração futura; a forma sintética é natural e solene em português.
- source_word: דֶּבֶר
  choice: peste
  rationale: No contexto profético de juízo, designa uma epidemia devastadora; “peste” é corrente, precisa e preserva a associação bíblica com o juízo.
- source_word: וָדָם בְּחוּצוֹתֶיהָ
  choice: e sangue às suas ruas
  rationale: Mantém o substantivo concreto “sangue” do hebraico e relaciona a expressão ao verbo “enviar”; no contexto, o sangue representa mortes violentas.
- source_word: וְנִפְלַל חָלָל
  choice: os mortos cairão
  rationale: Apesar da forma verbal incomum, a oração descreve vítimas fatais tombando. חָלָל indica mortos ou traspassados em combate.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: Expressa de modo claro e natural o interior da cidade personificada no feminino.
- source_word: בְּחֶרֶב עָלֶיהָ מִסָּבִיב
  choice: quando a espada vier contra ela por todos os lados
  rationale: Explicita a relação circunstancial e comunica o ataque armado que cerca a cidade, sem sugerir que os mortos sejam o agente da expressão “contra ela”.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: “Então” torna natural em português a consequência do juízo indicada pela conjunção no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome pessoal divino; “Yahweh” o preserva explicitamente e evita substituí-lo por um título.
- issue: Agência da espada e relação com os mortos
  choice: quando a espada vier contra ela por todos os lados
  alternative: os mortos cairão no meio dela pela espada ao redor dela
  rationale: A formulação conserva a imagem do ataque circundante e evita uma ligação sintática obscura em português, sem acrescentar uma identificação teológica do agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cidade é mantida no feminino, conforme a personificação hebraica. A estrutura profética de anúncio de juízo e reconhecimento de Yahweh é preservada.
