  text: כָּל יוֹדְעֶ֨י/ךָ֙ בָּֽ/עַמִּ֔ים שָׁמְמ֖וּ עָלֶ֑י/ךָ בַּלָּה֣וֹת הָיִ֔יתָ וְ/אֵינְ/ךָ֖ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/019.yaml
  text: All who know you among the peoples are appalled at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: pt
  text: Todos os que conhecem você entre os povos ficam horrorizados por sua causa; você se tornou um objeto de terror[a] e deixará de existir para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você se tornou um horror”. Literalmente: “terrores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: Expressa o alcance coletivo e distributivo do quantificador hebraico de modo natural em português.
- source_word: יוֹדְעֶיךָ
  choice: os que conhecem você
  rationale: O particípio qal com sufixo de segunda pessoa caracteriza aqueles que conhecem o destinatário, sem especificar indevidamente um tempo passado.
- source_word: בָּעַמִּים
  choice: entre os povos
  rationale: Preserva o sentido plural de עַמִּים e a relação espacial/social indicada pela preposição; “entre as nações” também é possível.
- source_word: שָׁמְמוּ
  choice: ficam horrorizados
  rationale: No contexto de juízo, o verbo descreve uma reação de espanto aterrador; esta formulação comunica a força emotiva em português corrente.
- source_word: עָלֶיךָ
  choice: por sua causa
  rationale: Com שׁמם, עַל pode indicar a pessoa ou situação que causa a reação. A expressão evita que “diante de você” sugira apenas localização.
- source_word: בַּלָּהוֹת
  choice: um objeto de terror
  rationale: Embora o substantivo esteja formalmente no plural, aqui funciona predicativamente para caracterizar o destinatário como causa ou objeto de terrores; a formulação é clara e preserva essa nuance.
- source_word: הָיִיתָ
  choice: você se tornou
  rationale: O perfeito apresenta a condição resultante como realizada ou certa no discurso profético.
- source_word: וְאֵינְךָ
  choice: e deixará de existir
  rationale: A construção existencial negativa significa que o destinatário já não será ou não existirá. O futuro comunica naturalmente a consequência definitiva no contexto do oráculo.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português corrente para a duração indefinida e irreversível expressa pela locução hebraica.
theological_decisions:
- issue: Força da fórmula final de desaparecimento no oráculo de juízo
  choice: “deixará de existir para sempre” como declaração enfática do fim irreversível do destinatário do oráculo
  alternative: “não existirá mais para sempre” ou “você não mais será, para sempre”
  rationale: A tradução mantém a retórica hebraica de desaparecimento total sem transformá-la numa afirmação doutrinária geral para além do juízo dirigido ao personagem do contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” para a segunda pessoa singular por naturalidade, mantendo a solenidade pelo vocabulário e pela estrutura. A nota preserva a forma plural e as possibilidades idiomáticas de בַּלָּהוֹת.
