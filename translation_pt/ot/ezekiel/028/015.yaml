  text: תָּמִ֤ים אַתָּה֙ בִּ/דְרָכֶ֔י/ךָ מִ/יּ֖וֹם הִבָּֽרְאָ֑/ךְ עַד נִמְצָ֥א עַוְלָ֖תָ/ה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/015.yaml
  text: You were blameless in your ways from the day you were created[a], until unrighteousness was found in you.
translation:
  language: pt
  text: Você era íntegro em seus caminhos desde o dia em que foi criado, até que foi encontrada injustiça em você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּמִים
  choice: íntegro
  rationale: No contexto moral, o termo indica inteireza ou irrepreensibilidade de conduta, sem necessariamente afirmar perfeição absoluta. “Íntegro” é natural em português e combina bem com “em seus caminhos”.
- source_word: בִּדְרָכֶיךָ
  choice: em seus caminhos
  rationale: Preserva a imagem hebraica e continua compreensível como referência à maneira de viver ou à conduta.
- source_word: מִיּוֹם הִבָּרְאָךְ
  choice: desde o dia em que foi criado
  rationale: Expressa de modo natural a construção temporal e o sentido passivo da forma hebraica.
- source_word: עַד
  choice: até que
  rationale: Marca a mudança temporal de condição e introduz naturalmente a oração seguinte em português.
- source_word: נִמְצָא
  choice: se achou
  rationale: Mantém o sentido de “foi encontrado” e preserva a ambiguidade quanto a a injustiça ter surgido ou sido descoberta.
- source_word: עַוְלָתָה
  choice: injustiça
  rationale: O substantivo designa injustiça, perversidade ou falta de retidão. “Injustiça” é corrente e preserva a amplitude moral do termo no contexto.
- source_word: בָּךְ
  choice: em você
  rationale: Tradução direta que mantém a localização interna indicada pela expressão hebraica.
theological_decisions:
- issue: Possível leitura de תָּמִים como perfeição absoluta em uma passagem associada a interpretações mais amplas sobre o rei de Tiro
  choice: íntegro
  alternative: perfeito
  rationale: “Íntegro” comunica a avaliação moral da conduta sem introduzir uma afirmação ontológica mais forte do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo temporal e a imagem hebraica dos “caminhos”, sem explicitar uma identificação além do referente literário do contexto.
