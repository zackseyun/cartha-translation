  text: מֵ/רֹ֣ב עֲוֺנֶ֗י/ךָ בְּ/עֶ֨וֶל֙ רְכֻלָּ֣תְ/ךָ֔ חִלַּ֖לְתָּ מִקְדָּשֶׁ֑י/ךָ וָֽ/אוֹצִא אֵ֤שׁ מִ/תּֽוֹכְ/ךָ֙ הִ֣יא אֲכָלַ֔תְ/ךָ וָ/אֶתֶּנְ/ךָ֤ לְ/אֵ֨פֶר֙ עַל הָ/אָ֔רֶץ לְ/עֵינֵ֖י כָּל רֹאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/018.yaml
  text: By the abundance of your iniquities[a], in the unrighteousness of your trade, you profaned your sanctuaries[c][b]; so I brought out fire from your midst—it consumed you—and I turned you to ashes on the earth in the sight of all who saw you.
translation:
  language: pt
  text: Por causa da abundância das suas iniquidades, você profanou os seus santuários por meio da injustiça do seu comércio[a][b]. Então, fiz sair fogo do seu meio[c]; ele consumiu você, e eu transformei você em cinzas sobre a terra, diante dos olhos de todos os que o viam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das suas negociações”. O termo hebraico designa atividade comercial e, neste contexto, pode abranger o conjunto das transações mercantis.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico está no plural: “seus santuários” ou “seus lugares santos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “fiz sair fogo do seu meio”. A imagem apresenta o fogo saindo do meio do destinatário como instrumento do juízo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵרֹב עֲוֺנֶיךָ
  choice: Por causa da abundância das suas iniquidades
  rationale: מִן com רֹב tem aqui força causal. “Iniquidades” conserva o plural e o peso moral de עָוֹן, termo que também pode abranger a culpa resultante.
- source_word: בְּעֶוֶל רְכֻלָּתְךָ
  choice: e da injustiça do seu comércio
  rationale: עֶוֶל denota injustiça ou perversidade, e רְכֻלָּה, no contexto de Ezequiel 27–28, refere-se à atividade comercial. A coordenação com “e” expressa em português corrente os dois fundamentos relacionados da profanação sem perder o vínculo causal.
- source_word: חִלַּלְתָּ מִקְדָּשֶׁיךָ
  choice: você profanou os seus santuários
  rationale: O piel de חלל significa profanar ou dessacralizar, e מִקְדָּשֶׁיךָ está no plural. “Santuários” mantém o sentido cultual sem definir o referente debatido.
- source_word: וָאוֹצִא אֵשׁ מִתּוֹכְךָ
  choice: Então fiz sair fogo do meio de você
  rationale: A forma narrativa faz avançar a consequência judicial. A tradução mantém o fogo sem artigo, como no hebraico, e preserva a imagem de ele sair do interior ou meio do destinatário.
- source_word: הִיא אֲכָלַתְךָ
  choice: ele o consumiu
  rationale: O pronome feminino hebraico retoma אֵשׁ, palavra gramaticalmente feminina. Em português, “fogo” é masculino, por isso “ele” mantém a referência natural.
- source_word: וָאֶתֶּנְךָ לְאֵפֶר
  choice: eu o transformei em cinzas
  rationale: A expressão literal, “dei você por/para cinza”, descreve o resultado do juízo. “Transformei em cinzas” comunica de modo natural a redução completa pelo fogo.
- source_word: עַל הָאָרֶץ לְעֵינֵי כָּל רֹאֶיךָ
  choice: sobre a terra, diante dos olhos de todos os que o viam
  rationale: “Sobre a terra” conserva a amplitude de אֶרֶץ, enquanto a formulação “diante dos olhos” mantém a ênfase hebraica na exposição pública do juízo.
theological_decisions:
- issue: O referente e a imagem de “seus santuários” na lamentação sobre o governante de Tiro
  choice: Manter o termo cultual plural “seus santuários” sem identificar de modo explícito o referente.
  alternative: Interpretar como lugares sagrados históricos de Tiro, como dignidade real metafórica ou como santuários celestiais ligados a um ser sobrenatural.
  rationale: O hebraico é claramente plural e cultual, mas o contexto não obriga a tradução a solucionar a identidade do personagem ou a natureza dos santuários. A formulação preserva a tensão interpretativa.
- issue: Origem do fogo como instrumento de juízo
  choice: Traduzir literalmente que Deus faz o fogo sair “do meio de você”.
  alternative: Explicitar que se trata de fogo interior, de destruição autogerada ou de outra realidade metafórica específica.
  rationale: A imagem hebraica indica a procedência do fogo do meio do destinatário, mas não explica sua natureza. A tradução evita impor uma leitura teológica ou psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção causal natural. Emprega “você” para representar o singular direto sem arcaísmo; os pronomes oblíquos “o” preservam a referência masculina. Mantém “iniquidades”, “profanou” e “santuários” por seu peso profético e cultual.
