  text: By your wisdom and by your understanding you made wealth for yourself[a], and you put gold and silver into your treasuries.
translation:
  language: pt
  text: Com sua sabedoria e entendimento, você acumulou riquezas para si[a] e ajuntou ouro e prata em seus depósitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obteve poder para si”. A palavra hebraica pode significar riqueza, força, poder ou recursos; aqui, a menção de ouro, prata e depósitos favorece “riquezas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָתְךָ
  choice: Com sua sabedoria
  rationale: A preposição בְּ tem sentido instrumental; “com” expressa de modo natural o meio pelo qual as riquezas foram obtidas.
- source_word: וּבִתְבוּנָתְךָ
  choice: e seu entendimento
  rationale: תְּבוּנָה denota entendimento, discernimento ou perspicácia. “Entendimento” forma um par natural com “sabedoria” sem eliminar a distinção semântica.
- source_word: עָשִׂיתָ לְךָ חָיִל
  choice: você acumulou riquezas para si
  rationale: Embora עָשָׂה seja literalmente “fazer”, em português “acumular riquezas” comunica melhor a aquisição de bens indicada pelo contexto. חַיִל pode significar riqueza, força ou recursos; a referência imediata a ouro, prata e tesouros favorece “riquezas”.
- source_word: וַתַּעַשׂ
  choice: e ajuntou
  rationale: O verbo עָשָׂה, nesta construção com ouro, prata e tesouros, descreve a formação ou acumulação de reservas. “Ajuntou” é idiomático e mantém a ideia de reunir bens.
- source_word: זָהָב וָכֶסֶף
  choice: ouro e prata
  rationale: Equivalentes diretos e correntes; juntos designam metais preciosos e riqueza material.
- source_word: בְּאוֹצְרוֹתֶיךָ
  choice: em seus tesouros
  rationale: אוֹצָר pode designar tanto os bens armazenados quanto o lugar onde são guardados. Aqui o plural com ouro e prata admite naturalmente “tesouros”, preservando a expressão concisa do hebraico.
theological_decisions:
- issue: Sentido de חַיִל na repreensão ao governante de Tiro
  choice: riquezas
  alternative: força, poder ou recursos
  rationale: O contexto imediato menciona ouro, prata e tesouros, favorecendo o sentido econômico. A nota preserva a amplitude genuína do termo hebraico sem deslocar o sentido principal do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” corresponde ao singular masculino dirigido ao governante de Tiro. A repetição literal de “com” antes de “seu entendimento” foi evitada por naturalidade, sem perda do valor instrumental compartilhado.
