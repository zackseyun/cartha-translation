  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא עָלֶ֨י/ךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל יְפִ֣י חָכְמָתֶ֔/ךָ וְ/חִלְּל֖וּ יִפְעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/007.yaml
  text: Therefore[a], behold, I am bringing strangers against you, the most ruthless of the nations; they will draw their swords against the beauty of your wisdom[c][b], and they will defile your splendor.
translation:
  language: pt
  text: Por isso, eis que estou trazendo contra você estrangeiros[a], os mais cruéis dentre as nações. Eles desembainharão[b] suas espadas contra a beleza da sua sabedoria e profanarão o seu esplendor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “forasteiros”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “esvaziarão suas espadas”, isto é, farão as espadas sair das bainhas.'
    reason: idiom_explanation
  - marker: c
    text: 'Ou: “profanarão o seu resplendor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de forma natural a inferência que introduz a consequência da acusação anterior.
- source_word: הִנְנִי מֵבִיא עָלֶיךָ
  choice: eis que estou trazendo contra você
  rationale: Preserva a fórmula profética solene e a força vívida e iminente do particípio hebraico.
- source_word: זָרִים
  choice: estrangeiros
  rationale: Comunica claramente pessoas de fora ou de outra nação; “estranhos” também é possível, mas pode sugerir apenas desconhecidos em português atual.
- source_word: עָרִיצֵי גּוֹיִם
  choice: os mais cruéis dentre as nações
  rationale: Reproduz idiomaticamente a ideia de povos especialmente violentos e implacáveis entre as nações.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם
  choice: Eles desembainharão suas espadas
  rationale: Equivalente idiomático da expressão cujo sentido literal é esvaziar ou fazer sair as espadas.
- source_word: עַל יְפִי חָכְמָתֶךָ
  choice: contra a beleza da sua sabedoria
  rationale: 'Mantém a construção poética do hebraico e sua ironia: a sabedoria celebrada do governante será atacada.'
- source_word: וְחִלְּלוּ יִפְעָתֶךָ
  choice: profanarão o seu esplendor
  rationale: “Profanar” preserva a forte ideia de aviltar ou tratar como não sagrado, enquanto “esplendor” abrange a aparência brilhante e majestosa indicada pelo substantivo.
theological_decisions:
- issue: Referente e tom do oráculo contra o governante de Tiro
  choice: Traduzir como anúncio profético de juízo contra o governante diretamente interpelado, sem acrescentar outra identificação teológica.
  alternative: Entender a linguagem também de modo tipológico, como alusão a uma queda cósmica.
  rationale: O versículo menciona invasores estrangeiros, espadas, sabedoria e esplendor no contexto imediato do juízo. A tradução preserva esse sentido histórico e deixa aberta qualquer leitura tipológica debatida.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível. “Eis que” conserva o tom profético elevado; “você” torna direta a interpelação singular sem recorrer a formas arcaicas.
