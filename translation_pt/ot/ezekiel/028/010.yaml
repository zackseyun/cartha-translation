  text: מוֹתֵ֧י עֲרֵלִ֛ים תָּמ֖וּת בְּ/יַד זָרִ֑ים כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/010.yaml
  text: You will die the death of the uncircumcised by the hand of foreigners[a], for I have spoken, declares the Lord GOD.
translation:
  language: pt
  text: Você morrerá a morte dos incircuncisos[a] pela mão de estrangeiros, pois eu falei — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “você morrerá as mortes dos incircuncisos”; a expressão indica uma morte como a deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹתֵי עֲרֵלִים תָּמוּת
  choice: Você morrerá a morte dos incircuncisos
  rationale: Reproduz de modo natural em português a construção enfática hebraica, em que o plural construto “mortes de” se combina com o verbo “morrer”. O singular em português comunica a espécie de morte, enquanto a nota preserva a forma literal.
- source_word: עֲרֵלִים
  choice: incircuncisos
  rationale: Mantém a referência concreta aos não circuncidados e sua carga de desonra no contexto do juízo, sem substituir o termo por uma interpretação mais genérica.
- source_word: בְּיַד
  choice: pela mão de
  rationale: Conserva a imagem hebraica de mão como agente ou instrumento e é uma expressão clara em português.
- source_word: זָרִים
  choice: estrangeiros
  rationale: Neste contexto, designa pessoas de outros povos que executariam o juízo; “estrangeiros” é mais específico do que “desconhecidos” ou “estranhos”.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: pois eu falei
  rationale: Expressa o fundamento e a certeza da sentença divina, preservando a força conclusiva do perfeito hebraico.
- source_word: נְאֻם
  choice: declara
  rationale: Verte a fórmula profética solene como verbo de elocução corrente e digno em português.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a combinação pouco clara “Senhor SENHOR”.
theological_decisions:
- issue: Forma do plural em “mortes dos incircuncisos”
  choice: a morte dos incircuncisos, com nota sobre o plural literal
  alternative: as mortes dos incircuncisos
  rationale: O plural hebraico integra uma construção idiomática que caracteriza a maneira desonrosa de morrer. O singular é natural em português, e a nota evita ocultar a forma do texto-fonte.
- issue: Tradução do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: A escolha mantém explícito o nome próprio divino e também preserva o título אֲדֹנָי, sem fundir os dois elementos nem produzir “Senhor SENHOR”.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe direta. A formulação conserva a imagem “pela mão de” e a tensão cultural e teológica de “incircuncisos”, sem explicá-la dentro do versículo.
