base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/020.yaml
  text: Yet you say[a], ‘The way of the Lord is not just.’ I will judge each of you according to his ways[b], O house of Israel.
translation:
  language: pt
  text: 'Mas vocês dizem[a]: “O caminho do Senhor não é justo.” Julgarei cada um de vocês segundo os seus caminhos[b], ó casa de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O caminho do Senhor não é correto” ou “O caminho do Senhor não é equitativo”. A expressão hebraica refere-se à alegação de que a maneira como Deus julga não é justa.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cada homem segundo os seus caminhos”. Embora o versículo se dirija à casa de Israel como um todo, ele ressalta a responsabilidade individual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Mas vocês dizem
  rationale: O waw dá continuidade ao discurso com valor contrastivo diante da defesa divina anterior; “mas” expressa isso naturalmente em português.
- source_word: לֹא יִתָּכֵן
  choice: não é justo
  rationale: O nifal de תכן nesta expressão indica aquilo que não é considerado correto, adequado ou equitativo. No contexto do juízo, “justo” preserva a dimensão moral e judicial.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: o caminho do Senhor
  rationale: Mantém a metáfora hebraica para a maneira de agir de Deus e usa a forma portuguesa tradicional e clara para אֲדֹנָי.
- source_word: אִישׁ כִּדְרָכָיו
  choice: cada um de vocês de acordo com os seus próprios caminhos
  rationale: 'אִישׁ tem força distributiva: cada membro da comunidade será julgado individualmente. “Seus próprios” esclarece que os caminhos pertencem a cada pessoa, sem tornar masculina uma referência distributiva genérica.'
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: julgarei cada um de vocês
  rationale: O verbo é judicial, e a formulação incorpora a força distributiva de אִישׁ ao objeto plural “vocês”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Ó casa de Israel
  rationale: Preserva a designação coletiva do povo e explicita o valor vocativo da expressão.
theological_decisions:
- issue: A acusação do povo contra a maneira divina de julgar
  choice: O caminho do Senhor não é justo
  alternative: O caminho do Senhor não é correto / não é imparcial
  rationale: “Justo” corresponde bem ao contexto judicial e à alegação de falta de equidade, enquanto a nota conserva alternativas legítimas.
- issue: Responsabilidade individual em uma interpelação coletiva
  choice: julgarei cada um de vocês de acordo com os seus próprios caminhos
  alternative: julgarei vocês, cada homem segundo os seus caminhos
  rationale: A tradução mantém tanto o destinatário coletivo, a casa de Israel, quanto a força distributiva singular de אִישׁ e כִּדְרָכָיו, em português natural e inclusivo quanto ao referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “Ó casa de Israel” conserva o tom profético; “vocês” evita regionalismo excessivo. Todos os marcadores de nota aparecem no texto.
