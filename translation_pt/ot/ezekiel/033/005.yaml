  text: אֵת֩ ק֨וֹל הַ/שּׁוֹפָ֤ר שָׁמַע֙ וְ/לֹ֣א נִזְהָ֔ר דָּמ֖/וֹ בּ֣/וֹ יִֽהְיֶ֑ה וְ/ה֥וּא נִזְהָ֖ר נַפְשׁ֥/וֹ מִלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/005.yaml
  text: He heard the sound of the trumpet and did not take warning[a]; his blood will be upon himself. But if he takes warning[b], he will save his life.
translation:
  language: pt
  text: Ouviu o som da trombeta, mas não deu atenção ao aviso; seu sangue estará sobre ele[a]. Porém, se der atenção ao aviso, salvará a sua vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu sangue estará sobre ele”; expressão hebraica que indica que ele é responsável pela própria morte.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “livrará a si mesmo”. Aqui, “vida” se ajusta ao contexto de escapar da morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  choice: o som da trombeta
  rationale: Preserva a construção hebraica com קוֹל, “som”, e traduz שׁוֹפָר pelo termo corrente para o instrumento de sinalização no contexto do vigia.
- source_word: שָׁמַע
  choice: ouviu
  rationale: Expressa diretamente a percepção auditiva do sinal de advertência.
- source_word: נִזְהָר
  choice: deu atenção ao aviso
  rationale: No contexto, o Nifal de זהר envolve receber e acatar a advertência. A formulação é natural em português e mantém a responsabilidade de reagir; a repetição preserva o vínculo entre as duas ocorrências.
- source_word: דָּמוֹ בּוֹ יִהְיֶה
  choice: seu sangue recairá sobre ele mesmo
  rationale: Mantém a metáfora hebraica de sangue e sua força jurídico-moral, comunicando que a responsabilidade pela morte recai sobre a própria pessoa.
- source_word: נַפְשׁוֹ
  choice: a sua vida
  rationale: נֶפֶשׁ pode significar vida, pessoa ou ser; aqui se refere à preservação diante da morte física.
- source_word: מִלֵּט
  choice: salvará
  rationale: O Piel indica livramento ou preservação bem-sucedida; “salvará a sua vida” é claro e idiomático.
- source_word: וְהוּא
  choice: Porém, se
  rationale: A conjunção introduz contraste, e a condição está implícita na oposição entre quem ignora e quem acata o aviso. “Porém, se” torna essa relação natural em português sem alterar o sentido.
theological_decisions:
- issue: Fórmula de responsabilidade em linguagem de juízo
  choice: seu sangue recairá sobre ele mesmo
  alternative: ele mesmo será responsável por sua morte
  rationale: A tradução conserva a imagem bíblica do sangue, em vez de substituí-la inteiramente por uma explicação, e a nota esclarece sua força de responsabilidade pessoal.
- issue: Sentido de נֶפֶשׁ no contexto
  choice: a sua vida
  alternative: a sua alma / a si mesmo
  rationale: O contexto trata de escapar da morte após atender ao sinal do vigia; “vida” representa o referente contextual sem impor uma distinção antropológica estranha ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a metáfora do sangue, evita linguagem excessivamente técnica e conserva o contraste e a condição implícita do hebraico.
