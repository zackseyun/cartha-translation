  text: כָּל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לֹ֥א תִזָּכַ֖רְנָה ל֑/וֹ מִשְׁפָּ֧ט וּ/צְדָקָ֛ה עָשָׂ֖ה חָי֥וֹ יִֽחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/016.yaml
  text: None of the sins that he committed will be remembered against him[a]; he has done justice and righteousness; he shall surely live.
translation:
  language: pt
  text: Nenhum dos pecados que ele cometeu será lembrado contra ele[a]. Ele praticou a justiça e a retidão; certamente viverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será levado em conta contra ele”. Em hebraico, literalmente, “será lembrado para ele”, expressão que tem sentido judicial neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חטאתו אֲשֶׁר חָטָא
  choice: Nenhum dos pecados que ele cometeu
  rationale: Embora חטאתו seja morfologicamente singular, כָּל e o verbo feminino plural תִזָּכַרְנָה dão à expressão sentido coletivo e distributivo. O plural em português comunica naturalmente que nenhum pecado individual será considerado.
- source_word: לֹא תִזָּכַרְנָה לוֹ
  choice: será lembrado contra ele
  rationale: 'O nifal de זכר com ל tem aqui sentido judicial: os pecados não serão trazidos à lembrança para serem usados contra a pessoa. A formulação preserva tanto a imagem hebraica da lembrança quanto sua força forense.'
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: a justiça e a retidão
  rationale: O par profético descreve conduta justa e moralmente correta. 'Justiça e retidão' distingue os termos sem enfraquecer seu peso ético e teológico.
- source_word: עָשָׂה
  choice: praticou
  rationale: '''Praticou a justiça e a retidão'' é natural em português e expressa a realização concreta dessas virtudes, sem sugerir meramente um sentimento ou uma declaração.'
- source_word: חָיוֹ יִחְיֶה
  choice: certamente viverá
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a afirmação. 'Certamente viverá' reproduz de modo claro e digno essa ênfase.
theological_decisions:
- issue: Força judicial do não lembrar dos pecados
  choice: será lembrado contra ele
  alternative: não lhe será imputado
  rationale: A escolha conserva a metáfora explícita de 'lembrar' presente no hebraico e, com 'contra ele', torna perceptível o contexto judicial, sem converter a expressão em uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi dividida em duas frases para fluidez. 'Retidão' evita a repetição pouco natural de dois termos próximos traduzidos ambos por 'justiça', enquanto 'certamente viverá' mantém a ênfase solene do hebraico.
