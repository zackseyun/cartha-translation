  text: בֶּן אָדָ֗ם דַּבֵּ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם אֶ֕רֶץ כִּֽי אָבִ֥יא עָלֶ֖י/הָ חָ֑רֶב וְ/לָקְח֨וּ עַם הָ/אָ֜רֶץ אִ֤ישׁ אֶחָד֙ מִ/קְצֵי/הֶ֔ם וְ/נָתְנ֥וּ אֹת֛/וֹ לָ/הֶ֖ם לְ/צֹפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/002.yaml
  text: Son of man[a], speak to the sons of your people and say to them, ‘If I bring a sword upon a land, and the people of the land take one man from among them and appoint him as their watchman,’
translation:
  language: pt
  text: 'Filho do homem, fale aos filhos do seu povo e diga-lhes: “Se eu trouxer uma espada contra uma terra, e o povo daquela terra escolher dentre eles um homem e o colocar como sentinela,”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Se eu trouxer a espada contra uma terra”. No hebraico, “espada” é uma imagem convencional de guerra ou juízo.'
    reason: Registra a alternativa de determinação do substantivo e esclarece a força convencional da imagem sem substituir a expressão no texto.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma consagrada da maneira característica como Deus se dirige a Ezequiel, sem transformar o vocativo em uma explicação como “mortal”.
- source_word: בְּנֵי עַמְּךָ
  choice: filhos do seu povo
  rationale: Preserva a expressão filial e masculina do hebraico, embora ela designe coletivamente os membros do povo do profeta.
- source_word: אֶרֶץ כִּי אָבִיא עָלֶיהָ חָרֶב
  choice: Se eu trouxer uma espada contra uma terra
  rationale: Expressa de modo natural a situação hipotética introduzida por כִּי, conserva אֶרֶץ como referência geral e mantém a imagem concreta da espada em vez de substituí-la interpretativamente por “guerra”.
- source_word: עַם הָאָרֶץ
  choice: o povo daquela terra
  rationale: Reproduz o sentido coletivo comum da expressão e usa “daquela” para retomar com clareza a terra já mencionada.
- source_word: אִישׁ אֶחָד מִקְצֵיהֶם
  choice: um homem dentre eles
  rationale: Mantém o masculino singular explícito de אִישׁ e traduz idiomaticamente מִקְצֵיהֶם como seleção feita no meio do próprio grupo.
- source_word: וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה
  choice: e o colocar como sentinela
  rationale: Comunica naturalmente a designação para a função de vigia. “Sentinela” é corrente e digna em português, além de preservar a função central de צֹפֶה no contexto.
theological_decisions:
- issue: Linguagem representativa marcada pelo gênero
  choice: Manter “filhos” e “um homem”
  alternative: “seu povo” e “uma pessoa”
  rationale: As formas hebraicas בְּנֵי e אִישׁ são explicitamente masculinas. A tradução preserva essa marca sem negar o alcance coletivo da primeira expressão.
- issue: Espada como imagem de guerra ou juízo
  choice: Conservar a imagem literal “uma espada”
  alternative: “guerra” ou “juízo”
  rationale: O hebraico deixa a imagem concreta falar no contexto; explicitar guerra ou juízo no corpo do texto resolveria uma dimensão metafórica que deve permanecer aberta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção condicional foi naturalizada, e o vocabulário bíblico essencial — “Filho do homem”, “espada” e “sentinela” — foi preservado. O marcador [a] foi colocado junto à oração a que a nota efetivamente se refere.
