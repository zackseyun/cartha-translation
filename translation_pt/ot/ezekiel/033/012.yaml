source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ צִדְקַ֣ת הַ/צַּדִּ֗יק לֹ֤א תַצִּילֶ֨/נּוּ֙ בְּ/י֣וֹם פִּשְׁע֔/וֹ וְ/רִשְׁעַ֤ת הָֽ/רָשָׁע֙ לֹֽא יִכָּ֣שֶׁל בָּ֔/הּ בְּ/י֖וֹם שׁוּב֣/וֹ מֵֽ/רִשְׁע֑/וֹ וְ/צַדִּ֗יק לֹ֥א יוּכַ֛ל לִֽ/חְי֥וֹת בָּ֖/הּ בְּ/י֥וֹם חֲטֹאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/012.yaml
  text: 'And you[a], son of man, say to the sons of your people: The righteousness of the righteous man will not deliver him in the day of his transgression, and the wickedness of the wicked man—he will not stumble by it in the day he turns from his wickedness[c][b]; and the righteous man will not be able to live by it in the day of his sin.'
translation:
  language: pt
  text: 'Quanto a você, filho do homem, diga aos filhos do seu povo[a]: A justiça do justo não o livrará no dia de sua transgressão; e, quanto à maldade do ímpio, ele não tropeçará por causa dela[b] no dia em que se afastar de sua maldade; e o justo não poderá viver por ela[c] no dia em que pecar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais natural, “ao seu povo”. O hebraico diz literalmente “aos filhos do seu povo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não cairá por causa dela”. O hebraico emprega a imagem de tropeçar; “dela” retoma a maldade anterior do ímpio.
    reason: lexical_alternative
  - marker: c
    text: Isto é, mais naturalmente, por sua justiça anterior. O hebraico mantém um pronome feminino singular, correspondente a “justiça”.
    reason: referent_clarification
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a fórmula hebraica característica pela qual Ezequiel é repetidamente interpelado, sem substituí-la pela explicação interpretativa “mortal”.
- source_word: בְּנֵי עַמְּךָ
  choice: os filhos do seu povo
  rationale: Mantém a expressão filial explícita do hebraico; uma nota registra a forma portuguesa mais dinâmica “seu povo”.
- source_word: צִדְקַת הַצַּדִּיק
  choice: a justiça do justo
  rationale: Conserva a repetição lexical e a relação entre a conduta ou condição justa e a pessoa justa. “Justiça” é corrente e digna neste contexto profético.
- source_word: תַצִּילֶנּוּ
  choice: não o livrará
  rationale: Expressa o sentido causativo de נצל, “livrar/resgatar”, e se ajusta ao contexto de juízo sem acrescentar conotações sistemáticas a “salvar”.
- source_word: בְּיוֹם פִּשְׁעוֹ
  choice: no dia de sua transgressão
  rationale: Preserva a construção nominal e o peso de פשע, que pode envolver transgressão ou rebelião.
- source_word: רִשְׁעַת הָרָשָׁע
  choice: a maldade do ímpio
  rationale: Representa tanto a qualidade ou conduta má quanto a pessoa caracterizada por ela. A repetição morfológica hebraica não pode ser reproduzida integralmente sem artificialidade em português.
- source_word: יִכָּשֶׁל בָּהּ
  choice: não tropeçará por causa dela
  rationale: Mantém a imagem de tropeçar e o pronome feminino, cujo antecedente imediato é “maldade”.
- source_word: בְּיוֹם שׁוּבוֹ מֵרִשְׁעוֹ
  choice: no dia em que se afastar de sua maldade
  rationale: שוב com מן indica voltar-se ou afastar-se de uma conduta anterior. Esta formulação é natural em português e não transforma o verbo em terminologia doutrinária adicional.
- source_word: לֹא יוּכַל לִחְיוֹת בָּהּ
  choice: não poderá viver por causa dela
  rationale: Representa explicitamente a incapacidade indicada por יכל e conserva o pronome feminino do texto, em vez de tornar seu referente incontestável no corpo do versículo.
- source_word: בְּיוֹם חֲטֹאתוֹ
  choice: no dia em que pecar
  rationale: Traduz naturalmente a expressão temporal hebraica, cujo sentido é o momento em que a pessoa justa comete pecado.
theological_decisions:
- issue: Se o versículo deve ser formulado como prova da perda irrevogável da salvação ou da perseverança garantida
  choice: Manter o princípio profético de que a justiça anterior não protege quem peca e de que a maldade anterior não condena quem se afasta dela.
  alternative: Reformular a declaração segundo uma doutrina sistemática posterior sobre perda da salvação ou perseverança dos santos.
  rationale: O texto trata do juízo divino em relação à conduta, ao pecado e ao afastamento da maldade; a tradução não deve resolver debates sistemáticos que o versículo não formula nesses termos.
- issue: Referente do pronome feminino בָּהּ na oração final
  choice: Preservar o pronome como “dela”, com nota indicando que seu referente mais natural é a justiça anterior do justo.
  alternative: Explicitar no texto “por causa de sua justiça” ou entender o pronome de modo geral como sua condição anterior.
  rationale: A forma feminina pode remeter a צִדְקָה, e a manutenção do pronome conserva a coesão e a tensão retórica do hebraico sem eliminar toda possível ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Quanto a você” reproduz o destaque contrastivo de וְאַתָּה sem recorrer ao menos corrente “tu”. A sintaxe semicolonada conserva os três movimentos paralelos do enunciado profético.
