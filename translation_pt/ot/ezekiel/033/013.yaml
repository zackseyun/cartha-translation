revisions:
- from: 'Quando eu disser ao justo: “Você certamente viverá”, mas ele confiar na sua própria justiça e praticar injustiça, nenhum dos seus atos de justiça será lembrado[a]; por causa da injustiça que praticou, ele morrerá[b].'
  to: 'Quando eu disser ao justo: “Você certamente viverá”, e ele confiar na sua justiça e praticar injustiça, nenhum dos seus atos de justiça será lembrado[a]; por causa da injustiça que praticou, ele morrerá[b].'
  rationale: A revisão resolve a construção sintaticamente truncada com “mas ele confiar”, usando coordenação natural em português e preservando a sequência hebraica. Também substitui “sua própria justiça” por “sua justiça”, que reproduz diretamente o possessivo hebraico sem acrescentar ênfase. As notas mantêm as alternativas relevantes para o plural de “justiças” e para a relação expressa por בְּ...בּוֹ.
  reviewer_model: gpt-5.6-terra
