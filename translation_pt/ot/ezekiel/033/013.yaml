base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/013.yaml
  text: When I say to the righteous man[a], ‘He shall surely live,’ and he trusts in his righteousness and does injustice, none of his righteous deeds will be remembered[b], but by the injustice that he has done he shall die.
translation:
  language: pt
  text: 'Quando eu disser ao justo: “Você certamente viverá”, e ele confiar na sua justiça e praticar injustiça, nenhum dos seus atos de justiça será lembrado[a]; por causa da injustiça que praticou, ele morrerá[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a sua justiça não será lembrada”. O plural hebraico pode designar coletivamente seus atos de justiça.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “nela morrerá” ou “por meio dela morrerá”, referindo-se à injustiça que praticou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Quando eu disser
  rationale: A construção com בְּ e a forma verbal com sufixo de primeira pessoa introduz uma oração temporal; esta formulação é natural em português e mantém a fala divina.
- source_word: לַצַּדִּיק
  choice: ao justo
  rationale: צַדִּיק designa uma pessoa justa. O substantivo adjetivado masculino singular é corrente em português e preserva a forma representativa do hebraico.
- source_word: חָיֹה יִחְיֶה
  choice: Você certamente viverá
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a afirmação. “Certamente” transmite essa ênfase de modo claro e atual.
- source_word: בָטַח עַל צִדְקָתוֹ
  choice: confiar na sua própria justiça
  rationale: בָטַח com עַל indica confiança ou dependência depositada em algo. “Própria” explicita que se trata da justiça dele, já expressa pelo sufixo hebraico, sem acrescentar uma categoria doutrinária.
- source_word: וְעָשָׂה עָוֶל
  choice: e praticar injustiça
  rationale: עָוֶל abrange injustiça, perversidade ou erro moral. “Praticar injustiça” é idiomático e permite repetir o mesmo campo lexical no final do versículo.
- source_word: כָּל צִדְקֹתָו
  choice: nenhum dos seus atos de justiça
  rationale: Sob a negação, a expressão formalmente plural, “todas as suas justiças”, comunica que nenhum de seus atos justos será lembrado. A tradução torna o sentido distributivo claro.
- source_word: לֹא תִזָּכַרְנָה
  choice: será lembrado
  rationale: O Nifal de זכר tem sentido passivo, “ser lembrado”. Mantém-se a linguagem judicial sem transformá-la explicitamente em linguagem de mérito ou contabilidade.
- source_word: וּבְעַוְלוֹ אֲשֶׁר עָשָׂה בּוֹ יָמוּת
  choice: por causa da injustiça que praticou, ele morrerá
  rationale: A preposição בְּ pode exprimir esfera, meio ou causa. Em português, “por causa de” comunica naturalmente a relação entre a injustiça praticada e a morte, enquanto a nota preserva as possibilidades mais formais.
theological_decisions:
- issue: Se a advertência deve ser formulada de modo a apoiar um sistema específico sobre perseverança ou apostasia
  choice: Traduzir diretamente a advertência judicial dirigida ao justo que passa a confiar na própria justiça e pratica injustiça.
  alternative: Enfatizar a perda de uma posição pactual específica ou tratar a advertência como meramente hipotética.
  rationale: 'O hebraico apresenta uma advertência real: os atos justos anteriores não serão lembrados quando o justo confia em sua justiça e pratica injustiça. A tradução preserva essa tensão sem resolver debates sistemáticos posteriores.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O discurso direto usa “você” por naturalidade; a narração retoma o referente com “ele”. A repetição de “justiça/injustiça” preserva o contraste lexical do hebraico.
