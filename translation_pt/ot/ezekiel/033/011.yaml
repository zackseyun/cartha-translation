  text: אֱמֹ֨ר אֲלֵי/הֶ֜ם חַי אָ֣נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם אֶחְפֹּץ֙ בְּ/מ֣וֹת הָ/רָשָׁ֔ע כִּ֣י אִם בְּ/שׁ֥וּב רָשָׁ֛ע מִ/דַּרְכּ֖/וֹ וְ/חָיָ֑ה שׁ֣וּבוּ שׁ֜וּבוּ מִ/דַּרְכֵי/כֶ֧ם הָ/רָעִ֛ים וְ/לָ֥/מָּה תָמ֖וּתוּ בֵּ֥ית יִשְׂרָאֵֽל־׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/011.yaml
  text: Say to them[a], ‘As I live,’ declares the Lord GOD, ‘I take no pleasure in the death of the wicked, but rather that the wicked turn from his way and live. Turn back, turn back from your evil ways! Why will you die[b], O house of Israel?’
translation:
  language: pt
  text: 'Diga-lhes: “Tão certo como eu vivo — declara o Senhor DEUS —, não tenho prazer na morte do perverso,[a] mas, sim, em que o perverso se volte do seu caminho e viva. Voltem-se, voltem-se[b] dos seus maus caminhos! Por que vocês haveriam de morrer, ó casa de Israel?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “não me agrada a morte do perverso” ou “não desejo a morte do perverso”. O verbo hebraico pode expressar prazer, agrado ou desejo.'
    reason: lexical_alternative
  - marker: b
    text: A repetição “Voltem-se, voltem-se” torna a ordem enfática. No hebraico, usa-se aqui o mesmo verbo empregado anteriormente para o perverso voltar-se do seu caminho.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Expressa em português natural a fórmula hebraica de juramento divino, preservando sua solenidade e força afirmativa.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor DEUS
  rationale: נְאֻם introduz uma declaração profética solene. A forma “Senhor DEUS” distingue os dois títulos e evita a sequência pouco natural “Senhor SENHOR”.
- source_word: אִם אֶחְפֹּץ בְּמוֹת הָרָשָׁע
  choice: não tenho prazer na morte do perverso
  rationale: No contexto do juramento, אִם comunica uma negação enfática. חפץ pode indicar prazer, agrado ou desejo; “ter prazer” conserva o sentido afetivo sem o ampliar indevidamente.
- source_word: כִּי אִם
  choice: mas, sim
  rationale: Marca o contraste enfático entre aquilo em que Deus não tem prazer e aquilo que ele quer ver acontecer.
- source_word: בְּשׁוּב רָשָׁע מִדַּרְכּוֹ
  choice: em que o perverso abandone o seu caminho
  rationale: “Abandone” comunica naturalmente em português o afastamento de uma conduta, embora a imagem hebraica básica seja a de voltar-se ou retornar; “caminho” preserva a metáfora da maneira de viver.
- source_word: וְחָיָה
  choice: e viva
  rationale: Mantém de modo conciso a sequência hebraica, sem decidir de forma excessiva se a vida é apresentada gramaticalmente como propósito ou resultado.
- source_word: שׁוּבוּ שׁוּבוּ
  choice: Voltem, voltem
  rationale: Preserva a repetição enfática dos imperativos e a imagem concreta de mudar de direção, sem substituí-la diretamente pelo termo teológico mais específico “arrependam-se”.
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: dos seus maus caminhos
  rationale: Reproduz a metáfora profética dos “caminhos” como conduta e mantém sua avaliação moral.
- source_word: וְלָמָּה תָמוּתוּ
  choice: Por que vocês haveriam de morrer
  rationale: Transmite a força da pergunta retórica e do apelo dirigido ao povo, sem sugerir que a morte já seja uma decisão consumada.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Conserva o vocativo e a expressão coletiva tradicional do texto profético.
theological_decisions:
- issue: A disposição divina diante da morte do perverso
  choice: Afirmar que Deus não tem prazer na morte do perverso, em contraste com o abandono do mau caminho e a vida.
  alternative: Traduzir חפץ mais fortemente por “desejo” ou explicar o enunciado mediante alguma distinção teológica sistemática entre diferentes aspectos da vontade divina.
  rationale: O texto declara diretamente a disposição de Deus no contexto de um apelo profético. A tradução preserva essa afirmação e sua tensão, sem encaixá-la em um sistema teológico posterior.
- issue: O singular representativo רָשָׁע e a posterior interpelação plural
  choice: Usar “o perverso” no singular e depois dirigir-se à coletividade com “vocês”.
  alternative: Uniformizar todo o versículo no singular ou no plural, ou substituir o singular por uma formulação neutra que apague a mudança gramatical.
  rationale: O hebraico passa do indivíduo representativo à exortação direta e plural à casa de Israel; a tradução conserva esse movimento.
- issue: A relação entre voltar-se e viver
  choice: Manter a coordenação simples “abandone o seu caminho e viva”.
  alternative: Explicitar “para que viva” ou “e assim viverá”.
  rationale: A forma hebraica permite uma relação de propósito ou resultado, mas não exige que a tradução a determine mais precisamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Vocês” explicita o plural do apelo; “ó casa de Israel” preserva o tom profético. A pontuação destaca a fórmula solene da declaração divina.
