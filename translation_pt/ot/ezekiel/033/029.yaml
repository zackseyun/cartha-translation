  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ֤/י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה עַ֥ל כָּל תּוֹעֲבֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/029.yaml
  text: Then they will know that I am Yahweh[b][a], when I make the land a desolation and a waste because of all the abominations that they have committed.
translation:
  language: pt
  text: Então[a] eles saberão que eu sou Yahweh, quando eu reduzir a terra a uma desolação e devastação[b], por causa de todas as suas abominações que cometeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles saberão”. A conjunção hebraica pode ser traduzida simplesmente por “e”, embora neste contexto provavelmente indique resultado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “desolação e horror”. O segundo substantivo hebraico pode destacar não apenas a ruína, mas também o espanto ou horror que ela provoca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Então eles saberão
  rationale: O וְ introduz, no contexto, o resultado do juízo descrito anteriormente. “Então” explicita essa força consequencial em português natural, sem excluir a tradução mais formal “E”.
- source_word: כִּי
  choice: que
  rationale: 'Aqui כִּי introduz o conteúdo do que eles reconhecerão: que aquele que age é Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּתִתִּי
  choice: quando eu reduzir
  rationale: A preposição בְּ com o infinitivo construto exprime circunstância temporal. Embora נתן signifique literalmente “dar/pôr”, com a terra e os predicativos de ruína a expressão comunica a ação de deixá-la nesse estado; “reduzir a” é idiomático em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto, refere-se à terra de Israel/Judá, não ao planeta inteiro; “a terra” preserva essa referência contextual.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: desolação e devastação
  rationale: Mantém a construção nominal e a intensificação formada pelos dois termos próximos. “Devastação” expressa a ruína, enquanto a nota registra a possível nuance de espanto ou horror do segundo substantivo.
- source_word: עַל כָּל תּוֹעֲבֹתָם
  choice: por causa de todas as abominações
  rationale: עַל indica aqui a causa ou o fundamento do juízo. “Abominações” conserva o peso da denúncia profética.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que cometeram
  rationale: Com “abominações”, “cometer” é mais idiomático em português do que o literal “fazer”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva o paralelismo enfático do hebraico e mantém explícito o nome divino.
