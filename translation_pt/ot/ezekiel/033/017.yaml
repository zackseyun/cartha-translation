review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a acusação de que o caminho do Senhor «não é justo» e a inversão retórica que a aplica ao caminho do povo. Contudo, «quando» enfraquece e altera a relação adversativa/enfática de וְהֵמָּה: o hebraico contrapõe diretamente o povo ao Senhor, não introduz principalmente uma circunstância temporal ou causal.'
  naturalness: O texto é claro e de registro apropriado. «Teu povo» é preferível a «seu povo», pois preserva sem ambiguidade a segunda pessoa dirigida ao profeta. A coordenação com «mas» torna o contraste final mais natural e direto em português.
  terminology: «Senhor» representa adequadamente אֲדֹנָי, e «justo» é uma boa escolha consistente para יִתָּכֵן neste contexto. Na nota, «equitativo» comunica melhor a alternativa «fair» do que «imparcial», que pode sugerir ausência de favoritismo em vez de justiça/equidade do procedimento.
  issues:
  - severity: medium
    issue: «quando é o próprio caminho deles» para וְהֵמָּה דַּרְכָּם
    rationale: '«Quando» tende a expressar tempo ou causa, ao passo que o pronome enfático com a conjunção estabelece uma contraposição: são eles, isto é, o caminho deles, que não é justo. «Mas é o caminho deles...» preserva melhor a reversão retórica.'
  - severity: low
    issue: «seu povo»
    rationale: Embora possível, «seu» é ambíguo no português moderno. «Teu» reproduz claramente o sufixo hebraico de segunda pessoa singular.
  - severity: low
    issue: «não é imparcial» na nota
    rationale: Como alternativa a «não é justo», «não é equitativo» corresponde mais precisamente ao sentido de justiça/fairness em discussão.
  revised_text: 'Contudo, os filhos do teu povo dizem: “O caminho do Senhor não é justo”, mas é o caminho deles que não é justo.[a]'
