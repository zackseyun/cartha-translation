- from: 'Contudo, os filhos do seu povo dizem: “O caminho do Senhor não é justo”, quando é o próprio caminho deles que não é justo.[a]'
  to: 'Contudo, os filhos do teu povo dizem: “O caminho do Senhor não é justo”, mas é o caminho deles que não é justo.[a]'
