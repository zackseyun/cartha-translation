  text: וְ/אָמְרוּ֙ בְּנֵ֣י עַמְּ/ךָ֔ לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י וְ/הֵ֖מָּה דַּרְכָּ֥/ם לֹֽא יִתָּכֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/017.yaml
  text: Yet the sons of your people say[a], ‘The way of the Lord is not just,’ though it is their own way that is not just.
translation:
  language: pt
  text: 'Contudo, os filhos do teu povo dizem: “O caminho do Senhor não é justo”, mas é o caminho deles que não é justo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não é correto” ou “não é equitativo”, nas duas ocorrências de “não é justo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Contudo, ... dizem
  rationale: A conjunção, no contexto, introduz leve contraste com a explicação divina anterior; “contudo” expressa esse valor adversativo sem exagerá-lo.
- source_word: בְּנֵי עַמְּךָ
  choice: os filhos do seu povo
  rationale: Preserva a expressão hebraica de modo inteligível em português, em vez de reduzi-la simplesmente a “seu povo”.
- source_word: לֹא יִתָּכֵן
  choice: não é justo
  rationale: O nifal de תכן indica aqui aquilo que não é correto, equitativo ou justo. “Não é justo” se ajusta à acusação moral feita no contexto e é repetido nas duas ocorrências para conservar a inversão retórica.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: O caminho do Senhor
  rationale: Tradução direta da construção hebraica, mantendo a formulação recorrente no contexto.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Representa o título divino אֲדֹנָי; aqui o texto não traz o tetragrama.
- source_word: וְהֵמָּה דַּרְכָּם
  choice: quando é o próprio caminho deles
  rationale: '“Próprio” comunica a ênfase contrastiva do pronome הֵמָּה: a acusação dirigida ao Senhor se aplica, na realidade, a eles.'
theological_decisions:
- issue: Avaliação moral do caminho do Senhor
  choice: Traduzir יִתָּכֵן por “é justo” nas duas cláusulas
  alternative: “é correto” ou “é imparcial”
  rationale: O contexto trata da justiça divina e da responsabilidade humana. A repetição de “justo” preserva a acusação e sua reversão sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura contrastiva e a repetição retórica do hebraico foram preservadas.
