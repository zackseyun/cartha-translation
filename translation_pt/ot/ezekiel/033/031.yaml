base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/031.yaml
  text: And they come to you as people come[a], and they sit before you as my people, and they hear your words, but they do not do them; for with their mouth they speak lustful things[b], while their heart goes after their unjust gain.
translation:
  language: pt
  text: Eles vêm até você como o povo costuma vir e se sentam diante de você como meu povo. Ouvem as suas palavras, mas não as põem em prática, pois, com a boca, dão expressão a desejos sensuais[a], enquanto o coração deles vai atrás do próprio ganho injusto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e pode significar “paixões”, “desejos sensuais” ou, possivelmente, “canções de amor”. A expressão talvez descreva o que dizem ou o modo como transformam as palavras do profeta em entretenimento.
    reason: lexical_alternative
  - marker: b
    text: “Ganho injusto” também pode ser traduzido por “lucro”, “ganância” ou “ganho cobiçado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְבוֹא עָם
  choice: como o povo costuma vir
  rationale: Preserva a comparação introduzida por כ־ e expressa em português natural a maneira habitual e pública de o povo vir para ouvir.
- source_word: עַמִּי
  choice: como meu povo
  rationale: 'Mantém a designação pactual e a ironia contextual: apresentam-se diante do profeta como povo de Deus, embora não obedeçam ao que ouvem.'
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: Ouvem as suas palavras
  rationale: Conserva o sentido básico de שמע e prepara o contraste com a falta de prática.
- source_word: וְאוֹתָם לֹא יַעֲשׂוּ
  choice: mas não as põem em prática
  rationale: Traduz de modo idiomático o hebraísmo de ‘fazer’ as palavras, sem enfraquecer a oposição entre ouvir e obedecer.
- source_word: עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים
  choice: com a boca, dão expressão a desejos sensuais
  rationale: Preserva o caráter performativo de עֹשִׂים, em vez de reduzi-lo simplesmente a ‘falar’, e mantém a incerteza do termo raro עֲגָבִים mediante nota.
- source_word: בִצְעָם
  choice: o próprio ganho injusto
  rationale: בצע costuma ter conotação moral de lucro cobiçado ou obtido injustamente; ‘ganho injusto’ conserva essa carga melhor que o neutro ‘lucro’.
- source_word: לִבָּם הֹלֵךְ אַחֲרֵי
  choice: o coração deles vai atrás
  rationale: Mantém a metáfora hebraica transparente de desejo, lealdade ou busca interior.
theological_decisions:
- issue: Caracterização moral da fala e dos desejos do povo
  choice: O texto retrata ouvintes hipócritas que expressam verbalmente desejos desordenados, enquanto interiormente buscam ganho injusto.
  alternative: A expressão pode indicar fala afetuosa ou lisonjeira, ou ainda que tratam as palavras de Ezequiel como uma canção de amor, em ligação com o versículo 32.
  rationale: O contexto imediato ressalta que eles ouvem, mas não obedecem. A tradução conserva o contraste entre boca e coração sem restringir o termo raro a um gênero específico, como uma canção.
translation_notes:
  register: Português moderno, digno e acessível, com construções naturais para leitores brasileiros e compreensão ampla no mundo lusófono. A formulação evita linguagem excessivamente técnica e preserva a ambiguidade lexical de עֲגָבִים em nota.
