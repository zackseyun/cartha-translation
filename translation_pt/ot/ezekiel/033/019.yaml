id: EZK.33.19
reference: Ezekiel 33:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/שׁ֤וּב רָשָׁע֙ מֵֽ/רִשְׁעָת֔/וֹ וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה עֲלֵי/הֶ֖ם ה֥וּא יִֽחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/019.yaml
  text: And when a wicked man turns from his wickedness and does justice and righteousness[a], by them he shall live.
translation:
  language: pt
  text: Mas, quando o ímpio se afastar da sua maldade e praticar a justiça e a retidão, por elas[a] viverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa delas” ou “sobre elas”. A expressão hebraica retoma “a justiça e a retidão” como a base sobre a qual ele viverá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  choice: Mas, quando ... se afastar
  rationale: A construção com infinitivo introduz uma oração temporal. O waw tem valor de contraste no contexto imediato, por isso “Mas, quando” comunica naturalmente a transição.
- source_word: רָשָׁע
  choice: o ímpio
  rationale: O adjetivo masculino singular é usado como substantivo. “O ímpio” preserva a forma representativa e o registro profético-jurídico.
- source_word: מֵ/רִשְׁעָת/וֹ
  choice: da sua maldade
  rationale: Mantém o vínculo lexical e moral com “ímpio”, em linguagem clara e corrente.
- source_word: וְ/עָשָׂה
  choice: e praticar
  rationale: Embora o verbo seja amplo (“fazer”), “praticar” é natural com qualidades éticas e destaca a conduta concreta.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Na associação ética com צְדָקָה, refere-se à conduta justa, não primariamente a uma sentença judicial.
- source_word: וּ/צְדָקָה
  choice: e a retidão
  rationale: “Retidão” distingue o termo de מִשְׁפָּט sem enfraquecer seu sentido ético-religioso e evita a repetição pouco natural “justiça e justiça”.
- source_word: עֲלֵי/הֶם
  choice: por elas
  rationale: O pronome plural retoma “justiça e retidão”. A preposição admite valor de base, causa ou meio; “por elas” preserva essa concisão e ambiguidade.
- source_word: הוּא יִחְיֶה
  choice: viverá
  rationale: O pronome hebraico dá ênfase ao sujeito, já recuperável em português pelo contexto e pela flexão verbal. O futuro expressa com naturalidade o resultado prometido.
theological_decisions:
- issue: Relação entre abandono da maldade, conduta justa e vida
  choice: O texto afirma que o ímpio que abandona sua maldade e pratica justiça e retidão viverá “por elas”.
  alternative: Explicitar que a vida depende apenas do arrependimento, ou interpretar toda a expressão como fidelidade à aliança.
  rationale: A formulação conserva a relação expressa no hebraico entre mudança de conduta, atos justos e vida, sem harmonizá-la com um sistema doutrinário posterior.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Ímpio”, “maldade”, “justiça” e “retidão” preservam o tom moral e profético sem linguagem excessivamente arcaica.
