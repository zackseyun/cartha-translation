source:
  edition: WLC
  text: כֹּֽה תֹאמַ֨ר אֲלֵ/הֶ֜ם כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֞א אֲשֶׁ֤ר בֶּֽ/חֳרָבוֹת֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וַֽ/אֲשֶׁר֙ עַל פְּנֵ֣י הַ/שָּׂדֶ֔ה לַ/חַיָּ֥ה נְתַתִּ֖י/ו לְ/אָכְל֑/וֹ וַ/אֲשֶׁ֛ר בַּ/מְּצָד֥וֹת וּ/בַ/מְּעָר֖וֹת בַּ/דֶּ֥בֶר יָמֽוּתוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
translation:
  language: pt
  text: 'Diga-lhes o seguinte: “Assim diz o Senhor Yahweh: Tão certo como eu vivo, os que estão nas ruínas[a] certamente cairão à espada; quem estiver em campo aberto, eu o entreguei aos animais selvagens para o devorarem[b]; e os que estiverem nas fortalezas e nas cavernas morrerão de peste[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos lugares desolados”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega um pronome no singular: “eu o entreguei para servir de alimento”. O singular provavelmente tem sentido distributivo, referindo-se a cada pessoa que estiver no campo.'
    reason: source_form
  - marker: c
    text: 'Ou: “epidemia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמַר ... כֹּה אָמַר
  choice: Portanto, diga-lhes ... Assim diz
  rationale: Mantém a fórmula profética de mensageiro com cadência solene e linguagem portuguesa natural.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e apresenta explicitamente o nome divino, evitando a repetição artificial “Senhor SENHOR”.
- source_word: חַי אָנִי אִם לֹא
  choice: Tão certo como eu vivo ... certamente
  rationale: Expressa a fórmula de juramento e a forte asseveração de אִם לֹא, que neste contexto não funciona como condição literal.
- source_word: אֲשֶׁר בֶּחֳרָבוֹת
  choice: os que estão nas ruínas
  rationale: חֳרָבוֹת designa lugares arruinados ou desolados; “ruínas” é concreto, claro e adequado ao contexto.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: cairão à espada
  rationale: Conserva a expressão idiomática hebraica e seu registro bíblico, sem perder clareza.
- source_word: אֲשֶׁר עַל פְּנֵי הַשָּׂדֶה
  choice: quem estiver em campo aberto
  rationale: Transmite de modo natural a ideia de estar exposto no campo, em contraste com fortalezas e cavernas.
- source_word: לַחַיָּה נְתַתִּיו לְאָכְלוֹ
  choice: eu o entreguei aos animais selvagens para o devorarem
  rationale: Preserva o pronome singular hebraico, que retoma distributivamente “quem”, e comunica com clareza a entrega como alimento aos animais.
- source_word: בַּמְּצָדוֹת וּבַמְּעָרוֹת
  choice: nas fortalezas e nas cavernas
  rationale: Traduz os dois tipos de refúgio sem especificar indevidamente sua forma ou localização.
- source_word: בַּדֶּבֶר יָמוּתוּ
  choice: morrerão de peste
  rationale: “Peste” é uma equivalência moderna e solene para דֶּבֶר como epidemia mortífera e agente de juízo.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR / o Senhor DEUS
  rationale: A forma escolhida preserva tanto אֲדֹנָי quanto o nome pessoal יהוה, sem substituir este por um título e sem criar a sequência pouco natural “Senhor SENHOR”.
- issue: Força da fórmula de juramento חַי אָנִי אִם לֹא
  choice: Tão certo como eu vivo ... certamente
  alternative: Pela minha vida / Se não
  rationale: No juramento divino, אִם לֹא é asseverativo; traduzi-lo como condição literal obscureceria o sentido, enquanto a redação adotada conserva a solenidade e a certeza enfática.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética e as imagens judiciais foram preservadas sem arcaísmos desnecessários. As alternativas relevantes e o singular distributivo do hebraico foram explicitados em notas.
