  text: וְ/יַד יְהוָה֩ הָיְתָ֨ה אֵלַ֜/י בָּ/עֶ֗רֶב לִ/פְנֵי֙ בּ֣וֹא הַ/פָּלִ֔יט וַ/יִּפְתַּ֣ח אֶת פִּ֔/י עַד בּ֥וֹא אֵלַ֖/י בַּ/בֹּ֑קֶר וַ/יִּפָּ֣תַח פִּ֔/י וְ/לֹ֥א נֶאֱלַ֖מְתִּי עֽוֹד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/022.yaml
  text: The hand of Yahweh had been upon me in the evening[a], before the fugitive came, and he opened my mouth until he came to me in the morning. So my mouth was opened, and I was no longer mute.
translation:
  language: pt
  text: A mão de Yahweh estivera sobre mim à tarde, antes que o fugitivo chegasse, e ele abriu a minha boca até que o fugitivo chegou a mim pela manhã. Então a minha boca foi aberta, e eu não fiquei mais mudo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַד יְהוָה הָיְתָה אֵלַי
  choice: A mão de Yahweh esteve sobre mim
  rationale: Preserva a expressão profética hebraica da mão divina atuando sobre o profeta e mantém o nome pessoal Yahweh. O pretérito perfeito é natural em português dentro da sequência narrativa.
- source_word: בָּעֶרֶב
  choice: à tarde
  rationale: Expressa de modo corrente o período vespertino indicado pelo hebraico, sem acrescentar um demonstrativo temporal ausente no texto.
- source_word: לִפְנֵי בּוֹא הַפָּלִיט
  choice: antes da chegada do fugitivo
  rationale: פָּלִיט designa alguém que escapou; “fugitivo” preserva a ideia de fuga, enquanto a nota registra a alternativa contextual “sobrevivente”.
- source_word: וַיִּפְתַּח אֶת פִּי
  choice: e ele abriu a minha boca
  rationale: Mantém a imagem concreta e sua ligação com a mudez anterior de Ezequiel. O sujeito masculino implícito é naturalmente Yahweh, pois “mão” é feminina em hebraico e a ação divina domina o contexto.
- source_word: עַד בּוֹא אֵלַי בַּבֹּקֶר
  choice: antes que o fugitivo chegasse até mim pela manhã
  rationale: Neste contexto, עַד בּוֹא assinala o limite temporal até o qual a abertura já havia ocorrido; a formulação portuguesa comunica naturalmente que isso aconteceu antes da chegada matinal, sem sugerir que a boca tornou a fechar depois.
- source_word: וַיִּפָּתַח פִּי
  choice: Assim, a minha boca se abriu
  rationale: A construção pronominal reproduz adequadamente o nifal e conserva a repetição enfática de “boca”.
- source_word: וְלֹא נֶאֱלַמְתִּי עוֹד
  choice: e eu não fiquei mais mudo
  rationale: Traduz diretamente o fim duradouro da condição de mudez em linguagem portuguesa natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal; a transliteração “Yahweh” o preserva em vez de substituí-lo por um título.
- issue: Agente de “abriu a minha boca”
  choice: O pronome “ele” se refere a Yahweh
  alternative: Construção impessoal ou passiva
  rationale: O verbo hebraico tem sujeito masculino singular, ao passo que “mão” é feminina; o contexto da mudez imposta e removida por Deus torna Yahweh o referente mais coerente.
- issue: Valor temporal de עַד בּוֹא
  choice: A boca foi aberta antes da chegada matinal do fugitivo
  alternative: “até que ele chegasse”, com possível impressão de que a boca permaneceu aberta somente até então
  rationale: A expressão marca o ponto-limite em que a ação já se encontrava realizada. “Antes que” evita em português a inferência indevida de que a capacidade de falar terminou na chegada, o que a cláusula seguinte contradiz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se a imagem hebraica da “mão” e da “boca”, evitando tanto uma paráfrase abstrata quanto uma construção temporal enganosa.
