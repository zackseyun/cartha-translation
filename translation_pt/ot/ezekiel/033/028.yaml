source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה וְ/נִשְׁבַּ֖ת גְּא֣וֹן עֻזָּ֑/הּ וְ/שָֽׁמְמ֛וּ הָרֵ֥י יִשְׂרָאֵ֖ל מֵ/אֵ֥ין עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/028.yaml
  text: And I will make the land a desolation and a waste[a], and the pride of its strength will cease, and the mountains of Israel will be desolate[b], with no one passing through.
translation:
  language: pt
  text: Farei da terra uma desolação e uma devastação[a]; cessará o orgulho da sua força[b], e os montes de Israel ficarão desolados, sem que ninguém passe por ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma desolação e um espanto”; o segundo termo hebraico também pode descrever algo cuja ruína causa horror ou espanto.
    reason: lexical_alternative
  - marker: b
    text: Ou “a majestade da sua força”. O termo hebraico pode significar tanto “orgulho” como “majestade”; neste contexto de juízo, “orgulho” parece mais adequado.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Farei
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, nesta construção com a terra e predicativos de ruína, “farei” expressa de modo natural o resultado causado.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: O contexto aponta para a terra de Israel/Judá, não para o planeta inteiro; “terra” preserva essa referência contextual.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: uma desolação e uma devastação
  rationale: A combinação mantém os dois substantivos hebraicos próximos em sentido, mas sem reduzi-los a uma repetição exata em português.
- source_word: וְנִשְׁבַּת
  choice: cessará
  rationale: O verbo comunica interrupção ou fim; “cessará” é conciso e preserva essa força.
- source_word: גְּאוֹן עֻזָּהּ
  choice: o orgulho da sua força
  rationale: גְּאוֹן pode indicar orgulho ou majestade, e עֹז designa força ou poder. No contexto de juízo, “orgulho da sua força” transmite a confiança exaltada que será encerrada, sem ocultar a alternativa lexical.
- source_word: וְשָׁמְמוּ הָרֵי יִשְׂרָאֵל
  choice: os montes de Israel ficarão desolados
  rationale: A formulação conserva a expressão recorrente de Ezequiel e entende o verbo no sentido geográfico de ficar devastado ou desolado.
- source_word: מֵאֵין עוֹבֵר
  choice: sem que ninguém passe por ali
  rationale: A expressão retrata abandono e ausência de trânsito humano; “por ali” fornece em português o referente espacial implícito sem acrescentar uma causa.
theological_decisions:
- issue: Conotação de גְּאוֹן no anúncio de juízo
  choice: orgulho
  alternative: majestade
  rationale: O contexto favorece a ideia negativa de exaltação e confiança na própria força. A nota preserva a possibilidade do sentido mais neutro “majestade”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém o paralelismo hebraico, a expressão temática “montes de Israel” e as ambiguidades lexicais relevantes em notas.
