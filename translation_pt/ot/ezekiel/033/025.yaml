  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵן֩ אֱמֹ֨ר אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה עַל הַ/דָּ֧ם תֹּאכֵ֛לוּ וְ/עֵינֵ/כֶ֛ם תִּשְׂא֥וּ אֶל גִּלּוּלֵי/כֶ֖ם וְ/דָ֣ם תִּשְׁפֹּ֑כוּ וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/025.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: You eat with the blood, and you lift up your eyes to your idols, and you shed blood[c][b]; shall you then possess the land?’'
translation:
  language: pt
  text: 'Por isso, diga a eles: “Assim diz o Senhor Yahweh: Vocês comem com o sangue[a], levantam os olhos para os seus ídolos[b] e derramam sangue; ainda assim, possuirão a terra?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “vocês comem sobre/com o sangue”, provavelmente uma referência a comer carne com sangue, contrariando a proibição relativa ao sangue.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “ídolos” é uma designação depreciativa usada com frequência por Ezequiel.
    reason: cultural_note
  - marker: c
    text: 'O hebraico também pode ser traduzido de modo mais formal: “e vocês possuirão a terra?”. No contexto, a frase funciona provavelmente como um desafio retórico indignado.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente em português a conclusão decorrente da declaração anterior.
- source_word: אֱמֹר אֲלֵיהֶם
  choice: diga a eles
  rationale: Preserva de modo claro e atual a comissão profética direta.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Mantém a fórmula profética e distingue אֲדֹנָי, 'Senhor', do nome divino יהוה, transliterado como Yahweh.
- source_word: עַל הַדָּם תֹּאכֵלוּ
  choice: Vocês comem carne com o sangue
  rationale: Explicita o objeto implícito 'carne' para produzir português natural, preservando a referência concreta à carne cujo sangue não foi retirado.
- source_word: וְעֵינֵיכֶם תִּשְׂאוּ אֶל גִּלּוּלֵיכֶם
  choice: levantam os olhos para os seus ídolos
  rationale: Conserva a imagem hebraica de dirigir os olhos aos ídolos, possivelmente com sentido de devoção ou dependência.
- source_word: גִּלּוּלֵיכֶם
  choice: seus ídolos
  rationale: É o equivalente português natural; uma nota registra o tom depreciativo peculiar do termo de Ezequiel.
- source_word: וְדָם תִּשְׁפֹּכוּ
  choice: e derramam sangue
  rationale: Reproduz a expressão hebraica usual para homicídio e violência sanguinária.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: ainda assim, possuirão a terra?
  rationale: Expressa como desafio retórico a incongruência entre as práticas denunciadas e a pretensão de possuir a terra.
theological_decisions:
- issue: Representação do nome divino na fórmula אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A transliteração preserva o nome próprio יהוה, enquanto 'Senhor' representa distintamente אֲדֹנָי, sem confundir os dois elementos.
- issue: Força da oração final וְהָאָרֶץ תִּירָשׁוּ
  choice: 'pergunta retórica: “ainda assim, possuirão a terra?”'
  alternative: 'declaração: “e vocês possuirão a terra”'
  rationale: O contexto de repreensão favorece uma pergunta indignada, embora a forma hebraica não contenha partícula interrogativa explícita; a nota preserva essa característica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas verbais de terceira pessoa do plural associadas a “vocês”. A ordem das acusações e a imagem de levantar os olhos foram preservadas; o ponto e vírgula marca a passagem da denúncia ao desafio retórico.
