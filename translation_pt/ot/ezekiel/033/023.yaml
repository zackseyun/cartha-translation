  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: O wayyiqtol de היה introduz a sequência narrativa; na fórmula profética, o português natural incorpora essa ideia ao verbo “veio”, sem o literalismo pouco idiomático “e aconteceu”.
- source_word: דְבַר
  choice: A palavra
  rationale: Na construção דְבַר יְהוָה, “a palavra” preserva a fórmula recorrente de revelação profética e mantém ligação formal com o hebraico; “a mensagem” seria possível, mas mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Reproduz diretamente a preposição com o sufixo de primeira pessoa singular em português atual e digno.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta que vem a seguir; “dizendo” conserva essa ligação formal sem antecipar ou interpretar seu conteúdo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fórmula profética foi mantida de modo próximo ao hebraico, sem exigir a conjunção inicial “E”, pois este versículo funciona como unidade independente na referência fornecida.
