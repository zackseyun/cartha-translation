  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹר֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֵּ֤ן אֲמַרְתֶּם֙ לֵ/אמֹ֔ר כִּֽי פְשָׁעֵ֥י/נוּ וְ/חַטֹּאתֵ֖י/נוּ עָלֵ֑י/נוּ וּ/בָ֛/ם אֲנַ֥חְנוּ נְמַקִּ֖ים וְ/אֵ֥יךְ נִֽחְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/010.yaml
  text: 'And you[a], son of man, say to the house of Israel, ‘Thus you have said: “Surely our transgressions and our sins are upon us, and in them we are wasting away; so how can we live?”’'
translation:
  language: pt
  text: 'E você, filho do homem, diga à casa de Israel: “Assim vocês dizem: ‘De fato, nossas transgressões e nossos pecados pesam sobre nós, e nelas estamos definhando[a]. Como, então, poderemos viver?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estamos nos consumindo” ou “estamos apodrecendo”. O verbo hebraico pode indicar definhamento, deterioração ou langor sob o peso da culpa e do juízo.
    reason: Alternativa lexical para נְמַקִּים, cujo campo semântico inclui consumição e deterioração.
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Conserva a forma característica de tratamento profético em Ezequiel e o conhecido idioma hebraico, embora seu sentido básico seja ‘ser humano’ ou ‘mortal’.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico, bem estabelecida no registro profético.
- source_word: כֵּן אֲמַרְתֶּם
  choice: Assim vocês têm dito
  rationale: Preserva a força demonstrativa de כֵּן e o aspecto retrospectivo do verbo, indicando aquilo que o povo vinha dizendo.
- source_word: פְשָׁעֵינוּ
  choice: nossas transgressões
  rationale: Preserva o sentido de infração ou rebelião deliberada e mantém a distinção em relação a ‘pecados’.
- source_word: חַטֹּאתֵינוּ
  choice: nossos pecados
  rationale: Equivalente direto e natural, preservando o par hebraico ‘transgressões e pecados’.
- source_word: עָלֵינוּ
  choice: pesam sobre nós
  rationale: Torna explícita, em português natural, a metáfora de culpa, responsabilidade e consequências que recaem sobre o povo.
- source_word: וּבָם
  choice: por causa deles
  rationale: Expressa a relação causal ou circunstancial provável no contexto. A tradução estritamente literal ‘neles’ seria pouco natural e obscura em português.
- source_word: נְמַקִּים
  choice: estamos definhando
  rationale: Comunica deterioração progressiva, abatimento e consumição sob o juízo, sem restringir o verbo à decomposição física.
- source_word: וְאֵיךְ נִחְיֶה
  choice: Como, então, poderemos viver?
  rationale: A formulação comunica naturalmente a inferência desesperada e a dúvida quanto à possibilidade de sobreviver.
theological_decisions:
- issue: Se a fala do povo deve soar apenas como confissão ou também como desespero sob o juízo
  choice: Uma admissão angustiada de culpa e de suas consequências, culminando em ‘Como, então, poderemos viver?’
  alternative: Uma confissão de pecado sem ênfase na desesperança
  rationale: O particípio ‘estamos definhando’ e a pergunta final apresentam não apenas reconhecimento de culpa, mas também desespero diante de suas consequências. A tradução conserva essa tensão sem antecipar a resposta divina do contexto seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se as expressões proféticas tradicionais ‘filho do homem’ e ‘casa de Israel’. O plural ‘vocês’ representa naturalmente o destinatário coletivo. O marcador da nota foi colocado junto de ‘definhando’, termo ao qual a nota lexical se refere.
