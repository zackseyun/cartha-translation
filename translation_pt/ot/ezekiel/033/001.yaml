  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: A construção narrativa com waw consecutivo e היה introduz uma nova unidade. Em português, a ligação simples por “E” e o verbo “veio” reproduzem naturalmente a fórmula, sem o peso de “E aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר־יְהוָה, “a palavra” mantém tanto a forma tradicional quanto a ressonância de revelação divina; “mensagem” seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto hebraico traz o nome divino, não um título. A transliteração “Yahweh” preserva essa distinção.
- source_word: אֵלַי
  choice: a mim
  rationale: Tradução direta da preposição com sufixo de primeira pessoa singular, em formulação corrente e digna.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala divina seguinte. “Dizendo” preserva a forma da fórmula profética e é claro em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega diretamente o tetragrama, “Yahweh” conserva o nome pessoal em vez de substituí-lo por um título. “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e solene, com preservação da fórmula profética hebraica. O uso de “a palavra de Yahweh veio a mim” é natural no registro bíblico sem recorrer a formas arcaicas.
