source:
  edition: WLC
  text: חֲבֹ֨ל יָשִׁ֤יב רָשָׁע֙ גְּזֵלָ֣ה יְשַׁלֵּ֔ם בְּ/חֻקּ֤וֹת הַֽ/חַיִּים֙ הָלַ֔ךְ לְ/בִלְתִּ֖י עֲשׂ֣וֹת עָ֑וֶל חָי֥וֹ יִֽחְיֶ֖ה לֹ֥א יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/015.yaml
  text: if the wicked man restores the pledge[a], repays what he has stolen, walks in the statutes of life without doing injustice, he shall surely live[b]; he shall not die.
translation:
  language: pt
  text: se o ímpio devolver o penhor[a], restituir o que roubou e andar nos estatutos da vida[b], sem cometer injustiça, certamente viverá; não morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devolver o que tomou como garantia”. O hebraico se refere à devolução de um bem retido como garantia de uma dívida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “andar nos estatutos que dão vida” ou “andar segundo os estatutos pelos quais se vive”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל
  choice: o penhor
  rationale: O termo designa um bem entregue ou retido como garantia de uma dívida. “Penhor” preserva com concisão o sentido jurídico e econômico do hebraico.
- source_word: יָשִׁיב
  choice: devolver
  rationale: No contexto de reparação, o verbo indica entregar de volta aquilo que estava retido. “Devolver” é natural e preciso em português.
- source_word: רָשָׁע
  choice: o ímpio
  rationale: O adjetivo substantivado está no masculino singular e representa o indivíduo culpado neste cenário profético-jurídico. “O ímpio” conserva a força moral do termo sem acrescentar uma qualificação ausente no hebraico.
- source_word: גְּזֵלָה
  choice: o que roubou
  rationale: O substantivo se refere ao que foi obtido por roubo ou apropriação violenta. A formulação verbal é clara e natural com o verbo de restituição.
- source_word: יְשַׁלֵּם
  choice: restituir
  rationale: A forma piel comunica pagamento, compensação ou restituição. “Restituir” expressa adequadamente a reparação do dano e combina naturalmente com “o que roubou”.
- source_word: בְּחֻקּוֹת הַחַיִּים
  choice: nos estatutos da vida
  rationale: 'A tradução relativamente formal preserva a relação genitiva ambígua: os estatutos podem ser caracterizados pela vida ou conduzir à vida. “Nos” acompanha com naturalidade a metáfora de andar.'
- source_word: הָלַךְ
  choice: andar
  rationale: “Andar” conserva a metáfora bíblica para a conduta habitual. No encadeamento condicional, a forma descreve o modo de vida daquele que abandona a maldade.
- source_word: לְבִלְתִּי עֲשׂוֹת עָוֶל
  choice: sem cometer injustiça
  rationale: A construção infinitiva indica abstenção de uma prática errada. A expressão é clara em português e mantém a nuance ética e jurídica.
- source_word: עָוֶל
  choice: injustiça
  rationale: Neste contexto de roubo, penhor e restituição, “injustiça” comunica melhor a ideia de conduta indevida do que termos mais abstratos como “iniquidade”.
- source_word: חָיוֹ יִחְיֶה
  choice: certamente viverá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da afirmação. “Certamente viverá” reproduz essa ênfase de forma natural e digna.
- source_word: לֹא יָמוּת
  choice: não morrerá
  rationale: A negação e o imperfeito são vertidos diretamente, em paralelo com a promessa enfática anterior.
theological_decisions:
- issue: Sentido de “vida” e “morte” na promessa e advertência da aliança
  choice: Manter a afirmação direta “certamente viverá; não morrerá”, sem definir a natureza dessa vida e morte.
  alternative: Especificar sobrevivência física, restauração da aliança ou vida escatológica.
  rationale: O hebraico permite dimensões existenciais e da aliança que podem se sobrepor. A tradução conserva essa tensão teológica em vez de restringir o sentido além do que o texto declara.
- issue: Relação entre os estatutos e a vida
  choice: “estatutos da vida”
  alternative: “estatutos que dão vida” ou “estatutos pelos quais se vive”
  rationale: A construção hebraica não determina explicitamente se os estatutos são caracterizados pela vida, conduzem à vida ou sustentam a vida. A formulação principal preserva essa abertura, e a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantém-se a metáfora bíblica de “andar” e o termo jurídico “penhor”, esclarecido em nota. A coordenação verbal foi ajustada ao português natural sem eliminar a estrutura condicional herdada do contexto anterior.
