  text: and he sees the sword coming against the land[a], and he blows the trumpet and warns the people,
translation:
  language: pt
  text: e ele vir a espada vindo contra a terra, tocar a trombeta[a] e avisar o povo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “chifre” ou “chifre de carneiro” (hebraico: shofar).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: e ele vir
  rationale: 'No contexto condicional iniciado no versículo anterior, o infinitivo pessoal em português liga naturalmente esta ação à condição: caso o atalaia veja a ameaça.'
- source_word: הַחֶרֶב
  choice: a espada
  rationale: Mantém a imagem concreta hebraica, que neste contexto representa metonimicamente guerra invasora ou juízo.
- source_word: בָּאָה עַל הָאָרֶץ
  choice: avançando contra a terra
  rationale: Expressa o movimento ameaçador de בוא + עַל com naturalidade, sem reduzir a expressão a uma paráfrase como 'começar uma guerra'.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se ao território ameaçado, não ao planeta inteiro; 'terra' preserva também a ressonância territorial do termo bíblico.
- source_word: וְתָקַע בַּשּׁוֹפָר
  choice: tocar a trombeta
  rationale: É a formulação portuguesa natural para a ação de emitir o sinal de alarme; evita o pouco idiomático 'soprar a trombeta'.
- source_word: שׁוֹפָר
  choice: trombeta
  rationale: '''Trombeta'' comunica com clareza a função de sinalização, enquanto a nota registra a natureza mais específica do instrumento.'
- source_word: וְהִזְהִיר
  choice: e avisar
  rationale: O hifil de זהר significa dar aviso ou advertir. 'Avisar' se ajusta naturalmente ao alarme público dado pelo atalaia.
- source_word: הָעָם
  choice: o povo
  rationale: Representa a coletividade que recebe o aviso e é a equivalência portuguesa normal de עָם neste contexto.
theological_decisions:
- issue: Força metonímica de 'a espada' no aviso profético
  choice: Conservar a imagem literal 'a espada' no texto principal.
  alternative: Traduzir interpretativamente como 'a guerra' ou 'um exército invasor'.
  rationale: O hebraico emprega חֶרֶב, e a imagem concreta preserva a força profética e a possível dimensão de juízo sem impor uma explicação no texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção depende sintaticamente da condição iniciada em Ezequiel 33:2; por isso, empregam-se infinitivos pessoais coordenados. A vírgula final preserva a continuidade para o versículo seguinte.
