base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/021.yaml
  text: And it happened in the twelfth year[a], in the tenth month, on the fifth day of the month of our exile, that the fugitive from Jerusalem came to me, saying[b], “The city has been struck down.”
translation:
  language: pt
  text: 'Aconteceu que, no décimo segundo ano, no décimo mês, no quinto dia do mês do nosso exílio, o sobrevivente[a] de Jerusalém veio até mim e disse: “A cidade foi golpeada”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fugitivo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “A cidade caiu”. Mais literalmente, o hebraico diz que a cidade “foi golpeada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz naturalmente um novo episódio narrativo e preserva a função discursiva da forma hebraica sem recorrer a uma expressão arcaica.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: no décimo segundo ano
  rationale: Forma idiomática e clara da fórmula hebraica de datação.
- source_word: בָּעֲשִׂרִי
  choice: no décimo mês
  rationale: O substantivo “mês” é explicitado em português com base na expressão seguinte, evitando uma data ambígua.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: no quinto dia do mês
  rationale: Reproduz com naturalidade a expressão hebraica de datação, explicitando “dia” como exige o uso corrente em português.
- source_word: לְגָלוּתֵנוּ
  choice: do nosso exílio
  rationale: “Exílio” expressa de modo atual e preciso a condição coletiva de deportação e deslocamento.
- source_word: הַפָּלִיט
  choice: o fugitivo
  rationale: Designa aquele que escapou de uma catástrofe; “sobrevivente” continua possível no contexto e é registrado em nota.
- source_word: מִירוּשָׁלַם
  choice: de Jerusalém
  rationale: Tradução direta da indicação de procedência.
- source_word: לֵאמֹר
  choice: e disse
  rationale: Converte o infinitivo hebraico introdutor de discurso direto numa construção portuguesa natural, sem alterar sua função.
- source_word: הֻכְּתָה
  choice: foi derrubada
  rationale: Preserva a voz passiva e a imagem de a cidade ter sido golpeada e abatida, evitando substituir silenciosamente o verbo por “caiu” ou pelo mais interpretativo “foi tomada”.
- source_word: הָעִיר
  choice: a cidade
  rationale: Mantém a designação do hebraico, embora o referente contextual seja Jerusalém.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A longa fórmula cronológica foi mantida, mas organizada com pontuação natural. Evitaram-se tanto o arcaísmo “sucedeu” quanto uma paráfrase excessivamente interpretativa da queda de Jerusalém.
