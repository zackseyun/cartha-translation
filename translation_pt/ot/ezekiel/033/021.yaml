revisions:
- from: 'Aconteceu que, no décimo segundo ano, no décimo mês, no quinto dia do mês do nosso exílio, o fugitivo[a] de Jerusalém veio até mim e disse: “A cidade foi derrubada”.[b]'
  to: 'Aconteceu que, no décimo segundo ano, no décimo mês, no quinto dia do mês do nosso exílio, o sobrevivente[a] de Jerusalém veio até mim e disse: “A cidade foi golpeada”[b].'
  rationale: A revisão substitui um termo potencialmente enganoso em português por «sobrevivente», preservando «fugitivo» como alternativa lexical, e torna a tradução de הֻכְּתָה mais diretamente fiel ao hebraico. A data, a referência ao exílio e a designação não explicitada da cidade são mantidas.
  reviewer_model: gpt-5.6-terra
