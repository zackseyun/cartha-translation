  text: וְ/שָׁמַ֨ע הַ/שֹּׁמֵ֜עַ אֶת ק֤וֹל הַ/שּׁוֹפָר֙ וְ/לֹ֣א נִזְהָ֔ר וַ/תָּ֥בוֹא חֶ֖רֶב וַ/תִּקָּחֵ֑/הוּ דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/004.yaml
  text: then if the one who hears hears the sound of the trumpet and does not take warning[a], and the sword comes and takes him away, his blood will be on his own head.
translation:
  language: pt
  text: então, se aquele que ouve o som da trombeta não der atenção ao aviso, e a espada vier e o levar, o sangue dele recairá sobre a sua própria cabeça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o sangue dele estará sobre a sua cabeça”, expressão que significa que ele será responsável pela própria morte.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמַע הַשֹּׁמֵעַ
  choice: então, se aquele que ouve
  rationale: O contexto dá continuidade à condição iniciada no versículo anterior. A formulação explicita essa relação em português, enquanto o particípio substantivado é traduzido naturalmente como “aquele que ouve”.
- source_word: קוֹל הַשּׁוֹפָר
  choice: o som da trombeta
  rationale: קוֹל designa aqui o sinal audível. “Som da trombeta” preserva a imagem e evita o literalismo pouco natural de “voz da trombeta”.
- source_word: וְלֹא נִזְהָר
  choice: não der atenção ao aviso
  rationale: O nifal de זהר pode indicar ser advertido ou acolher a advertência. Esta escolha comunica a falta de resposta responsável ao sinal sem pressupor que o aviso não tenha sido compreendido.
- source_word: חֶרֶב
  choice: a espada
  rationale: Mantém a imagem profética convencional da espada como instrumento de invasão, violência e morte.
- source_word: וַתִּקָּחֵהוּ
  choice: e o levar
  rationale: Traduz de modo conciso o sentido literal de לקח, deixando que o contexto da espada indique o resultado fatal.
- source_word: דָּמוֹ בְרֹאשׁוֹ יִהְיֶה
  choice: o sangue dele recairá sobre a sua própria cabeça
  rationale: Preserva o idioma hebraico de responsabilidade pessoal. “Própria” torna clara em português a referência reflexiva, e “recairá” expressa naturalmente a atribuição de responsabilidade.
theological_decisions:
- issue: Idioma de responsabilidade no contexto do juízo
  choice: o sangue dele recairá sobre a sua própria cabeça
  alternative: ele será responsável pela própria morte
  rationale: A tradução conserva a força concreta e retórica do idioma hebraico, ao mesmo tempo que a nota explica seu sentido, sem introduzir categorias doutrinárias adicionais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe condicional foi explicitada pelo contexto; a metáfora da espada e o idioma do sangue sobre a cabeça foram preservados.
