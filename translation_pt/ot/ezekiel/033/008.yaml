source:
  edition: WLC
  text: בְּ/אָמְרִ֣/י לָ/רָשָׁ֗ע רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א דִבַּ֔רְתָּ לְ/הַזְהִ֥יר רָשָׁ֖ע מִ/דַּרְכּ֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/008.yaml
  text: When I say to the wicked[a], ‘Wicked one, you shall surely die,’ and you do not speak to warn the wicked from his way, that wicked man shall die in his iniquity, but I will require his blood from your hand.
translation:
  language: pt
  text: 'Quando eu disser ao perverso: “Ó perverso, você certamente morrerá”, e você não falar para adverti-lo a abandonar seu caminho, esse perverso morrerá em sua iniquidade; mas cobrarei de você o sangue dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “requererei o sangue dele da sua mão”, isto é, considerarei você responsável pela morte dele.'
    reason: A nota preserva a imagem idiomática hebraica e esclarece seu sentido forense.
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Quando eu disser
  rationale: A preposição בְּ com a forma verbal introduz aqui uma oração temporal; o futuro do subjuntivo é natural em português nesse contexto prospectivo.
- source_word: לָרָשָׁע
  choice: ao perverso
  rationale: רָשָׁע designa uma pessoa moralmente perversa neste contexto; “perverso” mantém a categoria moral e é corrente em português.
- source_word: רָשָׁע
  choice: Ó perverso
  rationale: O termo é vocativo. “Ó” sinaliza com clareza a interpelação direta e conserva o tom solene.
- source_word: מוֹת תָּמוּת
  choice: você certamente morrerá
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a certeza da morte; “certamente” reproduz essa força em português natural.
- source_word: וְלֹא דִבַּרְתָּ
  choice: e você não falar
  rationale: No cenário temporal-condicional iniciado por “quando”, o futuro do subjuntivo comunica naturalmente a eventual omissão do sentinela, sem transformar וְ em contraste explícito.
- source_word: לְהַזְהִיר
  choice: para adverti-lo
  rationale: O Hifil de זהר significa advertir ou avisar; “advertir” preserva o tom sério e é amplamente compreensível.
- source_word: מִדַּרְכּוֹ
  choice: a abandonar o seu caminho
  rationale: Depois de “advertir”, o hebraico מִן indica afastamento de uma conduta. A formulação explicita de modo idiomático que a advertência visa fazê-lo deixar seu modo de vida, preservando a metáfora do “caminho”.
- source_word: הוּא רָשָׁע
  choice: esse perverso
  rationale: O pronome mais o substantivo retoma enfaticamente a pessoa mencionada; “esse perverso” reproduz a retomada sem peso artificial.
- source_word: בַּעֲוֺנוֹ
  choice: por causa da sua própria iniquidade
  rationale: עָוֹן abrange iniquidade e culpa. “Por causa de” expressa a relação causal presente no contexto, enquanto “própria” deixa claro, sem retirar a responsabilidade do sentinela, que a iniquidade pertence ao perverso.
- source_word: וְדָמוֹ
  choice: o sangue dele
  rationale: Mantém a imagem bíblica do sangue como representação da vida perdida e da responsabilidade por sua morte.
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  choice: cobrarei de você
  rationale: בקשׁ מן־יד é uma expressão de exigência de prestação de contas. “Cobrarei de você” é natural e conserva a força forense; a imagem literal da mão é registrada na nota.
theological_decisions:
- issue: Responsabilidade divina pela omissão do sentinela
  choice: O perverso morre por sua própria iniquidade, e o sentinela também presta contas por não adverti-lo.
  alternative: O sentinela assume a culpa do perverso em lugar dele, ou a ameaça contra o sentinela é apenas retórica.
  rationale: 'As duas afirmações do hebraico são mantidas juntas: o perverso morre em razão da própria iniquidade, mas Deus exige do sentinela responsabilidade pelo sangue derramado. A tradução não elimina nenhuma das duas.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Você” torna inequívoca a segunda pessoa singular dirigida ao sentinela; “perverso”, “iniquidade” e “caminho” preservam o peso moral e a linguagem metafórica do texto.
