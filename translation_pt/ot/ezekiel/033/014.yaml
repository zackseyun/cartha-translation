  text: וּ/בְ/אָמְרִ֥/י לָֽ/רָשָׁ֖ע מ֣וֹת תָּמ֑וּת וְ/שָׁב֙ מֵֽ/חַטָּאת֔/וֹ וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/014.yaml
  text: And when I say to the wicked man[a], ‘You shall surely die,’ and he turns from his sin and does justice and righteousness,
translation:
  language: pt
  text: 'E quando eu disser ao homem perverso: “Você certamente morrerá”, e ele se afastar do seu pecado e praticar o que é justo e correto,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאָמְרִי
  choice: E quando eu disser
  rationale: A construção com preposição, infinitivo e sufixo de primeira pessoa tem valor temporal; esta formulação é natural em português e preserva esse sentido.
- source_word: לָרָשָׁע
  choice: ao homem perverso
  rationale: O termo designa uma pessoa moralmente perversa e está no masculino singular; a tradução mantém tanto o sentido quanto a forma representativa.
- source_word: מוֹת תָּמוּת
  choice: Você certamente morrerá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da morte; “certamente” transmite a ênfase de modo claro e atual.
- source_word: וְשָׁב
  choice: e ele se afastar
  rationale: Embora שׁוּב possa significar “voltar”, com מִן indica aqui abandonar o pecado. Mantém-se a conjunção hebraica simples “e”, sem acrescentar contraste.
- source_word: מֵחַטָּאתוֹ
  choice: do seu pecado
  rationale: Reproduz diretamente o substantivo singular com sufixo masculino singular.
- source_word: וְעָשָׂה
  choice: e praticar
  rationale: Neste contexto ético, “praticar” expressa de maneira natural uma conduta efetiva, sem ampliar o significado do verbo.
- source_word: מִשְׁפָּט
  choice: o que é justo
  rationale: Aqui o termo se refere à conduta conforme a justiça, e não simplesmente a um julgamento ou veredito.
- source_word: וּצְדָקָה
  choice: e correto
  rationale: A expressão idiomática “o que é justo e correto” preserva os dois aspectos éticos do par hebraico em português natural.
theological_decisions:
- issue: Masculino singular representativo na referência ao perverso
  choice: ao homem perverso
  alternative: à pessoa perversa / ao perverso
  rationale: A escolha conserva o masculino singular explícito do hebraico sem negar seu possível valor representativo.
- issue: Tradução do par ético מִשְׁפָּט וּצְדָקָה
  choice: o que é justo e correto
  alternative: justiça e retidão
  rationale: A formulação escolhida comunica conduta concreta e mantém os dois componentes do par, sem transformar a frase em abstração ou fundi-los num único conceito.
- issue: Relação entre a sentença de morte e a mudança de conduta
  choice: e ele se afastar
  alternative: mas ele se afastar
  rationale: A conjunção é mantida como “e”, preservando a coordenação do hebraico e evitando explicitar um contraste que o texto deixa ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O futuro do subjuntivo em “se afastar” e “praticar” é exigido naturalmente pela estrutura temporal-condicional iniciada por “quando”. A frase termina com vírgula porque o versículo continua sintaticamente no contexto seguinte.
