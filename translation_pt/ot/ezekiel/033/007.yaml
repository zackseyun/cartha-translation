  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/007.yaml
  text: And you[a], son of man, I have made you a watchman for the house of Israel[b]; when you hear a word from my mouth, you shall warn them from me.
translation:
  language: pt
  text: Quanto a você, filho do homem[a], eu o constituí sentinela[b] para a casa de Israel; quando você ouvir uma palavra da minha boca, deverá adverti-los da minha parte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho do homem” é a forma recorrente de tratamento dirigida a Ezequiel; também pode ser entendida como “mortal” ou “ser humano”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “designei você como sentinela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém literalmente o modo recorrente como Deus se dirige a Ezequiel, preservando seu padrão literário e sua ressonância tradicional; “mortal” explicitaria o sentido, mas reduziria a força da expressão hebraica.
- source_word: צֹפֶה
  choice: sentinela
  rationale: Designa quem permanece de vigia e alerta diante do perigo. “Sentinela” comunica com clareza a metáfora profética em português atual e digno.
- source_word: נְתַתִּיךָ
  choice: eu o constituí
  rationale: Embora נתן signifique literalmente “dar”, nesta construção predicativa indica designação para uma função. “Constituí” preserva esse valor sem produzir o português artificial “dei você como sentinela”.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: A preposição marca a esfera ou o destinatário da missão confiada a Ezequiel. “Para” expressa naturalmente essa relação.
- source_word: וְשָׁמַעְתָּ
  choice: quando você ouvir
  rationale: O perfeito com waw integra a sequência da comissão. A construção temporal liga de modo natural o recebimento da palavra ao dever subsequente de advertir, sem alterar a relação lógica do hebraico.
- source_word: מִפִּי דָּבָר
  choice: uma palavra da minha boca
  rationale: Conserva a imagem antropomórfica e vívida do hebraico, enfatizando que a mensagem procede diretamente de Deus.
- source_word: וְהִזְהַרְתָּ אֹתָם
  choice: deverá adverti-los
  rationale: O hifil expressa o ato de dar advertência. “Deverá” comunica a força obrigatória da comissão, enquanto o pronome plural retoma o povo representado pela casa de Israel.
- source_word: מִמֶּנִּי
  choice: da minha parte
  rationale: Indica que a advertência tem Deus como fonte e autoridade. A expressão é idiomática em português e evita acrescentar a ideia mais específica de falar “em nome de” alguém.
theological_decisions:
- issue: Manutenção da forma recorrente de tratamento בֶן אָדָם em Ezequiel
  choice: filho do homem
  alternative: mortal; ser humano
  rationale: A tradução literal preserva o contraste entre Deus e o profeta humano, além do padrão literário característico do livro, sem impor uma interpretação cristológica ao contexto de Ezequiel.
- issue: Relação entre ouvir a palavra divina e advertir Israel
  choice: quando você ouvir ... deverá adverti-los
  alternative: você ouvirá ... e os advertirá
  rationale: A formulação temporal apresenta a advertência como obrigação decorrente do recebimento da palavra. Ela representa de modo natural uma relação permitida pela sequência verbal hebraica, sem transformar a comissão apenas em previsão.
- issue: Fonte e autoridade da advertência profética
  choice: da minha parte
  alternative: em meu nome; vinda de mim
  rationale: A tradução preserva Deus como fonte da advertência sem ampliar o texto com uma fórmula técnica de representação profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Quanto a você” reproduz a ênfase do pronome inicial; “sentinela” mantém a metáfora concreta; e a combinação de “você” com os pronomes oblíquos normativos “o/os” evita regionalismos excessivos.
