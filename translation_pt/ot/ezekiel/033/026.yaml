base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/026.yaml
  text: You stand on your sword[a], you commit abominations, and each of you defiles his neighbor’s wife[b]. Shall you then possess the land?
translation:
  language: pt
  text: Vocês se apoiam em suas espadas[a], praticam abominações, e cada um de vocês contamina a esposa de seu próximo. Ainda assim, possuirão a terra?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Vocês estão sobre suas espadas”. A expressão provavelmente significa confiar na violência ou no poder armado.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ainda assim, herdarão a terra?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמַדְתֶּם עַל חַרְבְּכֶם
  choice: Vocês se apoiam na espada
  rationale: A expressão diz literalmente que eles estão sobre a espada, mas provavelmente retrata confiança na violência ou no poder armado. “Se apoiam na espada” mantém a imagem concreta e comunica naturalmente essa dependência.
- source_word: חַרְבְּכֶם
  choice: na espada
  rationale: חֶרֶב designa especificamente a espada. O singular coletivo preserva a forma e a imagem do hebraico sem generalizá-la como mera arma.
- source_word: עֲשִׂיתֶן תּוֹעֵבָה
  choice: praticam coisas abomináveis
  rationale: Embora תּוֹעֵבָה esteja no singular, pode ter sentido coletivo. Esta formulação expressa conduta reiterada e mantém a forte censura moral do termo.
- source_word: וְאִישׁ
  choice: e cada um de vocês
  rationale: אִישׁ tem força distributiva no contexto. A expressão conserva a referência masculina implícita na acusação e se integra naturalmente ao tratamento na segunda pessoa do plural.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: a mulher do seu próximo
  rationale: רֵעַ pode significar próximo, companheiro ou semelhante. “Próximo” preserva a dimensão social da transgressão, e “mulher” traduz אִשָּׁה aqui no sentido contextual de esposa.
- source_word: טִמֵּאתֶם
  choice: contamina
  rationale: O Piel de טמא significa tornar impuro ou contaminar. “Contamina” preserva a linguagem de impureza e sua gravidade moral, sem reduzi-la apenas a desonra social.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: Ainda assim, possuirão a terra?
  rationale: ירש pode indicar tomar posse ou herdar. “Possuir” se ajusta à reivindicação territorial imediata, enquanto a pergunta retórica transmite a indignação profética sugerida pelo contexto.
theological_decisions:
- issue: Força da oração final
  choice: 'Pergunta retórica: “Ainda assim, possuirão a terra?”'
  alternative: 'Declaração: “e possuirão a terra”'
  rationale: O hebraico não contém partícula interrogativa explícita, mas o contexto é uma repreensão aos que reivindicam a terra apesar de sua violência e impureza. A pergunta retórica preserva melhor esse desafio profético.
- issue: Linguagem distributiva masculina
  choice: “cada um de vocês ... a mulher do seu próximo”
  alternative: Formulação plenamente neutra quanto ao gênero
  rationale: אִישׁ tem força distributiva masculina, e a transgressão descrita envolve a mulher de outro homem. A tradução mantém esse dado contextual sem tornar a frase pesada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por formas naturais no Brasil. O pronome “vocês” torna explícita a segunda pessoa plural; “ainda assim” evidencia a força retórica contextual sem eliminar a ambiguidade formal, registrada na decisão teológica. Os marcadores [a] e [b] aparecem junto às expressões que esclarecem.
