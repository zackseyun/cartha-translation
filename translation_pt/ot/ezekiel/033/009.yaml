source:
  edition: WLC
  text: וְ֠/אַתָּה כִּֽי הִזְהַ֨רְתָּ רָשָׁ֤ע מִ/דַּרְכּ/וֹ֙ לָ/שׁ֣וּב מִמֶּ֔/נָּה וְ/לֹא שָׁ֖ב מִ/דַּרְכּ֑/וֹ ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/009.yaml
  text: But if you warn a wicked man to turn from his way[a], and he does not turn from his way, he will die in his iniquity[b]; but you will have delivered your soul.
translation:
  language: pt
  text: Mas, se você advertir o ímpio para que se afaste do seu caminho, e ele não se afastar do seu caminho, ele morrerá na sua iniquidade[a]; mas você terá livrado a sua própria vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Morrerá na sua iniquidade” também pode ser entendido como “morrerá por causa da sua iniquidade”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “terá livrado a si mesmo”. O hebraico néfesh pode designar aqui a vida ou a própria pessoa, não necessariamente uma alma imaterial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: advertir
  rationale: O hifil de זהר significa dar aviso ou advertir. “Advertir” é natural, digno e adequado ao contexto da sentinela.
- source_word: רָשָׁע
  choice: o ímpio
  rationale: O adjetivo masculino singular substantivado designa a pessoa moralmente culpada. “O ímpio” preserva o valor moral e a forma singular do hebraico.
- source_word: מִדַּרְכּוֹ ... לָשׁוּב מִמֶּנָּה
  choice: para que se afaste do seu caminho
  rationale: שׁוב com מן indica afastar-se ou voltar atrás, deixando algo. “Caminho” mantém a metáfora hebraica referente à conduta.
- source_word: וְלֹא שָׁב מִדַּרְכּוֹ
  choice: e ele não se afastar do seu caminho
  rationale: A repetição de “do seu caminho” reproduz a ênfase do hebraico e mantém explícita a metáfora ética.
- source_word: בַּעֲוֺנוֹ
  choice: na sua iniquidade
  rationale: A preposição ב pode indicar a condição em que ele morre e também admitir nuance causal. A formulação preserva essa concisão e ambiguidade.
- source_word: נַפְשְׁךָ
  choice: a sua própria vida
  rationale: נֶפֶשׁ aqui se refere à vida ou à própria pessoa no contexto da responsabilidade da sentinela, sem exigir o sentido metafísico posterior de “alma”.
- source_word: הִצַּלְתָּ
  choice: terá livrado
  rationale: O hifil de נצל significa livrar ou resgatar. O futuro composto expressa naturalmente em português o resultado já assegurado após o cumprimento da advertência.
- source_word: וְאַתָּה ... וְאַתָּה
  choice: Mas, se você ... mas você
  rationale: Os pronomes explícitos são enfáticos. A construção portuguesa ressalta o contraste entre o destino do ímpio e a isenção de responsabilidade da sentinela.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na cláusula final
  choice: vida da sentinela, com possível sentido de sua própria pessoa
  alternative: sua alma
  rationale: O contexto trata da responsabilidade pela morte do advertido e do livramento da sentinela sob o juízo divino; não exige uma distinção metafísica entre corpo e alma.
- issue: Relação entre a morte e a iniquidade do ímpio
  choice: “morrerá na sua iniquidade”, preservando a formulação compacta
  alternative: “morrerá por causa da sua iniquidade”
  rationale: A tradução conserva tanto a ideia de morrer em estado de iniquidade quanto a possível nuance causal, sem resolver além do que permite a preposição hebraica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “você” comunica diretamente a segunda pessoa singular; “ímpio”, “iniquidade” e “livrado” mantêm um registro bíblico digno sem obscurecer o sentido.
