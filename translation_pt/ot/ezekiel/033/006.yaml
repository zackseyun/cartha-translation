  text: וְ֠/הַ/צֹּפֶה כִּֽי יִרְאֶ֨ה אֶת הַ/חֶ֜רֶב בָּאָ֗ה וְ/לֹֽא תָקַ֤ע בַּ/שּׁוֹפָר֙ וְ/הָ/עָ֣ם לֹֽא נִזְהָ֔ר וַ/תָּב֣וֹא חֶ֔רֶב וַ/תִּקַּ֥ח מֵ/הֶ֖ם נָ֑פֶשׁ ה֚וּא בַּ/עֲוֺנ֣/וֹ נִלְקָ֔ח וְ/דָמ֖/וֹ מִ/יַּֽד הַ/צֹּפֶ֥ה אֶדְרֹֽשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/006.yaml
  text: But if the watchman sees the sword coming and does not blow the trumpet[a], and the people are not warned, and the sword comes and takes a life from among them, that one is taken away in his iniquity[b], but I will require his blood from the watchman's hand.
translation:
  language: pt
  text: Mas, se o vigia vir a espada chegando e não tocar a trombeta, e o povo não for avisado[a], e a espada vier e tirar a vida de alguém dentre eles, essa pessoa será levada em sua iniquidade; contudo, cobrarei o sangue dela da mão do vigia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o povo não der ouvidos ao aviso”. O hebraico pode indicar tanto que o povo não foi avisado como que não acolheu o aviso; o texto principal acompanha a ênfase na falha do vigia em tocar a trombeta.'
    reason: lexical_alternative
  - marker: b
    text: “Cobrar o sangue da mão de alguém” é uma expressão jurídica que indica responsabilizá-lo por uma morte.
    reason: cultural_note
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: o vigia
  rationale: Designa quem observa e guarda. “Vigia” é natural em português e mantém a metáfora profética.
- source_word: כִּי יִרְאֶה
  choice: se ... vir
  rationale: כִּי introduz aqui uma situação condicional na exposição da responsabilidade do vigia.
- source_word: הַחֶרֶב בָּאָה
  choice: a espada chegando
  rationale: Preserva a imagem concreta da espada, embora ela represente ameaça violenta, guerra ou juízo.
- source_word: תָקַע בַּשּׁוֹפָר
  choice: tocar a trombeta
  rationale: Expressa de modo corrente o ato de soar o instrumento como sinal de alarme.
- source_word: וְהָעָם לֹא נִזְהָר
  choice: e o povo não for avisado
  rationale: O nifal de זהר admite tanto “ser avisado” como “dar ouvidos ao aviso”. O passivo se ajusta à ênfase contextual na omissão do vigia, sem ocultar a alternativa em nota.
- source_word: וַתִּקַּח מֵהֶם נָפֶשׁ
  choice: tirar a vida de alguém dentre eles
  rationale: נֶפֶשׁ refere-se aqui a uma pessoa ou vida individual; a formulação comunica com clareza que alguém do povo morre.
- source_word: בַּעֲוֺנוֹ נִלְקָח
  choice: será levada por causa de sua própria iniquidade
  rationale: A expressão conserva a responsabilidade moral da pessoa morta. “Por causa de” explicita em português a relação contextual, enquanto “iniquidade” mantém a densidade moral de עָוֹן.
- source_word: דָמוֹ מִיַּד הַצֹּפֶה אֶדְרֹשׁ
  choice: cobrarei o sangue dela das mãos do vigia
  rationale: Mantém a imagem jurídica hebraica segundo a qual Deus exige prestação de contas por uma morte.
theological_decisions:
- issue: Responsabilidade do vigia e da pessoa morta
  choice: A pessoa é levada por causa de sua própria iniquidade, mas o vigia também responde diante de Deus por não tê-la avisado.
  alternative: Entender que o vigia assume a culpa da vítima ou que a vítima morre unicamente pela omissão do vigia.
  rationale: O hebraico afirma simultaneamente a culpa própria da pessoa e a responsabilização do vigia. A tradução preserva essa tensão, sem converter uma responsabilidade na outra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vigia”, “espada” e a expressão sobre o sangue preservam as imagens do hebraico; as notas esclarecem a ambiguidade lexical e o idioma jurídico.
