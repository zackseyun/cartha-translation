base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/024.yaml
  text: Son of man, the inhabitants of these ruins on the land of Israel are saying, ‘Abraham was only one man, yet he possessed the land; but we are many—the land has been given to us as a possession.’
translation:
  language: pt
  text: 'Filho do homem, os moradores destas ruínas na terra de Israel estão dizendo: “Abraão era apenas um, e tomou posse da terra. Nós, porém, somos muitos; a terra nos foi dada como propriedade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי הֶחֳרָבוֹת
  choice: os moradores destas ruínas
  rationale: Reproduz naturalmente a referência aos que habitavam os lugares devastados, mantendo o demonstrativo do hebraico.
- source_word: וַיִּירַשׁ אֶת־הָאָרֶץ
  choice: e tomou posse da terra
  rationale: O verbo ירשׁ pode significar herdar ou tomar posse. Neste contexto, a alegação se concentra na posse da terra por Abraão, sem exigir a ideia técnica de recebê-la por herança.
- source_word: לְמוֹרָשָׁה
  choice: como propriedade
  rationale: Expressa uma posse duradoura ou hereditária e distingue o substantivo da forma verbal anterior sem impor uma formulação excessivamente técnica.
theological_decisions:
- issue: Relação lógica entre a singularidade de Abraão e sua posse da terra
  choice: “Abraão era apenas um, e tomou posse da terra”
  alternative: “Abraão era um só, contudo herdou a terra”
  rationale: O hebraico emprega uma conjunção simples, cuja força argumentativa emerge do contexto. “Apenas um” explicita o contraste já presente na alegação, enquanto “e” evita tornar a concessão mais explícita do que no texto-fonte.
- issue: Fundamento implícito da reivindicação dos sobreviventes
  choice: preservar a fala como alegação, sem explicação adicional
  alternative: explicitar que reivindicavam a terra com base no exemplo de Abraão
  rationale: O versículo registra o raciocínio dos moradores, mas não declara aqui que sua conclusão seja legítima nem explica todas as suas premissas.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com fluidez brasileira. A pontuação realça o contraste entre Abraão, que era um só, e os muitos moradores, sem acrescentar conteúdo ausente do hebraico.
