  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם בְּנֵ֣י עַמְּ/ךָ֗ הַ/נִּדְבָּרִ֤ים בְּ/ךָ֙ אֵ֣צֶל הַ/קִּיר֔וֹת וּ/בְ/פִתְחֵ֖י הַ/בָּתִּ֑ים וְ/דִבֶּר חַ֣ד אֶת אַחַ֗ד אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר בֹּֽאוּ נָ֣א וְ/שִׁמְע֔וּ מָ֣ה הַ/דָּבָ֔ר הַ/יּוֹצֵ֖א מֵ/אֵ֥ת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
translation:
  language: pt
  text: 'E você, filho do homem, os filhos do seu povo, que falam de você[a] junto aos muros e nas entradas das casas, falam uns com os outros, cada homem com seu irmão, dizendo: “Venham, por favor, e ouçam qual é a palavra que procede de Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falam com você”. O contexto, porém, indica mais provavelmente que conversavam entre si a respeito de Ezequiel.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que sai de junto de Yahweh”; isto é, a palavra profética que procede dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma consagrada e a força retórica do modo habitual como Ezequiel é chamado.
- source_word: בְּנֵי עַמְּךָ
  choice: os filhos do seu povo
  rationale: Mantém a expressão hebraica concreta e masculina, embora ela possa designar de modo amplo os membros do povo.
- source_word: הַנִּדְבָּרִים בְּךָ
  choice: falam de você
  rationale: No contexto, a construção com בְּ provavelmente indica que conversam sobre Ezequiel entre si; a alternativa 'falam com você' é preservada em nota.
- source_word: אֵצֶל הַקִּירוֹת
  choice: junto aos muros
  rationale: Expressa naturalmente a proximidade indicada por אֵצֶל.
- source_word: וּבְפִתְחֵי הַבָּתִּים
  choice: e às entradas das casas
  rationale: פִתְחֵי designa as aberturas ou entradas; 'entradas' é claro e natural no contexto doméstico.
- source_word: וְדִבֶּר חַד אֶת אַחַד
  choice: Cada um fala com o outro
  rationale: Reproduz o sentido distributivo e recíproco da conversa.
- source_word: אִישׁ אֶת אָחִיו
  choice: cada homem com seu irmão
  rationale: Conserva a formulação masculina e o termo familiar do hebraico, que também pode indicar um compatriota.
- source_word: בֹּאוּ נָא
  choice: Venham, por favor
  rationale: O plural é exigido pelo verbo hebraico, e 'por favor' transmite a nuance de convite ou exortação de נָא.
- source_word: וְשִׁמְעוּ
  choice: e ouçam
  rationale: Mantém o sentido direto de שׁמע e o registro profético.
- source_word: מָה הַדָּבָר
  choice: qual é a palavra
  rationale: Aqui דָּבָר é a palavra ou mensagem profética; 'palavra' mantém a transparência lexical.
- source_word: הַיּוֹצֵא מֵאֵת יְהוָה
  choice: que vem da parte de Yahweh
  rationale: Expressa de modo natural a procedência divina da palavra, preservando a ideia de algo que sai ou procede de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de הַנִּדְבָּרִים בְּךָ
  choice: falam de você
  alternative: falam com você
  rationale: O contexto descreve conversas do povo entre si a respeito de Ezequiel, mas a construção admite a alternativa, registrada em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração o preserva sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar um período excessivamente carregado, sem alterar as relações do hebraico. O imperativo plural foi explicitado por 'Venham' e 'ouçam'.
