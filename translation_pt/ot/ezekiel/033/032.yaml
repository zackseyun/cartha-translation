  text: וְ/הִנְּ/ךָ֤ לָ/הֶם֙ כְּ/שִׁ֣יר עֲגָבִ֔ים יְפֵ֥ה ק֖וֹל וּ/מֵטִ֣ב נַגֵּ֑ן וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/עֹשִׂ֥ים אֵינָ֖/ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/032.yaml
  text: Look[a], you are to them like a sensual song, with a beautiful voice and skillful playing; they hear your words, but they do not do them.
translation:
  language: pt
  text: Eis que, para eles, você é como alguém que canta canções sensuais[a], com bela voz e que toca bem. Eles ouvem as suas palavras, mas não as põem em prática.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “canções de amor”. A expressão hebraica pode indicar amores ou desejos apaixonados e sensuais; aqui, destaca que eles tratam a mensagem do profeta como entretenimento atraente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְּךָ
  choice: 'E veja: ... você é'
  rationale: הִנֵּה chama a atenção para a avaliação que segue. “Veja” preserva essa força de modo atual; o pronome sufixado fornece “você é”.
- source_word: לָהֶם
  choice: para eles
  rationale: 'A preposição ל expressa como Ezequiel é percebido pelo público: “para eles” ele se assemelha a uma canção.'
- source_word: כְּשִׁיר עֲגָבִים
  choice: como uma canção sensual
  rationale: עֲגָבִים pode indicar amores ou desejos apaixonados, com possível matiz sensual ou moralmente negativo. “Canção sensual” conserva o poder de atração e a censura contextual sem tornar a expressão excessivamente explícita.
- source_word: יְפֵה קוֹל
  choice: cantada com bela voz
  rationale: A expressão descreve a beleza da voz. A explicitação “cantada” liga naturalmente essa qualidade à canção em português.
- source_word: וּמֵטִב נַגֵּן
  choice: e tocada com habilidade
  rationale: A construção com o particípio de יטב e נגן indica boa execução musical. “Tocada com habilidade” comunica de forma idiomática a perícia do instrumentista.
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: Eles ouvem as suas palavras
  rationale: שׁמע indica que o público escuta as palavras do profeta, preparando o contraste com a ausência de obediência.
- source_word: וְעֹשִׂים אֵינָם אוֹתָם
  choice: mas não as põem em prática
  rationale: Embora literalmente próximo de “não as fazem”, o objeto são as palavras de Ezequiel; em português, “pôr em prática” expressa com clareza e naturalidade a ideia de cumpri-las.
theological_decisions:
- issue: Matiz moral de עֲגָבִים
  choice: canção sensual
  alternative: canção de amor
  rationale: O contexto censura os ouvintes por tratarem a mensagem profética como apresentação atraente, sem obedecer. “Sensual” preserva o possível matiz de desejo apaixonado ou impróprio, enquanto a nota registra a alternativa mais neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem musical e o contraste enfático entre ouvir e praticar.
