source:
  edition: WLC
  text: בְּ/שׁוּב צַדִּ֥יק מִ/צִּדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל וּ/מֵ֖ת בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/018.yaml
  text: When a righteous man turns from his righteousness and does injustice[b][a], he shall die because of them.
translation:
  language: pt
  text: Quando um justo se desviar da sua justiça e praticar injustiça[a], morrerá por causa dessas ações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “maldade”, “iniquidade” ou “o que é errado”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nelas” ou “por elas”; o sentido é que ele morre por causa das ações injustas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Quando ... se desviar
  rationale: 'A preposição בְּ com o infinitivo construto introduz uma oração temporal. Com מִן, שׁוּב expressa aqui afastamento: “quando ... se desviar de” comunica isso de modo natural em português.'
- source_word: צַדִּיק
  choice: um justo
  rationale: O adjetivo masculino singular é usado como substantivo para designar um indivíduo justo. O artigo indefinido preserva o caráter geral da afirmação.
- source_word: מִצִּדְקָתוֹ
  choice: da sua justiça
  rationale: צְדָקָה designa aqui a justiça ou conduta justa atribuída ao indivíduo. “Sua justiça” mantém a ligação lexical e a tensão do texto sem explicar além do hebraico.
- source_word: וְעָשָׂה
  choice: e praticar
  rationale: עָשָׂה com עָוֶל significa fazer ou cometer o que é injusto. “Praticar injustiça” é uma combinação idiomática, clara e digna em português.
- source_word: עָוֶל
  choice: injustiça
  rationale: O termo pode indicar injustiça, maldade, erro ou iniquidade. “Injustiça” preserva seu peso ético e o contraste com “justiça”.
- source_word: וּמֵת
  choice: morrerá
  rationale: A forma verbal expressa o resultado da mudança de conduta na formulação condicional. O futuro simples comunica com naturalidade a consequência solene.
- source_word: בָּהֶם
  choice: por causa dessas ações
  rationale: Literalmente, a expressão é “nelas” ou “por elas”. Neste contexto, o pronome plural aponta para as ações injustas; a formulação causal torna a relação inteligível em português sem alterar o sentido.
theological_decisions:
- issue: Se o versículo ensina perda da salvação ou trata de responsabilidade judicial e pactual em termos temporais
  choice: 'Manter a afirmação no nível do próprio texto: o justo que se afasta da sua justiça e pratica injustiça morrerá por causa dessas ações.'
  alternative: Interpretar explicitamente a morte como perda da salvação, ou limitá-la explicitamente à morte física e ao juízo temporal.
  rationale: O hebraico declara a reversão moral e a morte resultante, mas não define essas categorias doutrinárias posteriores. A tradução preserva a tensão sem impor uma conclusão denominacional.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Um justo” preserva o masculino singular do hebraico; “praticar injustiça” é corrente sem perder o peso moral e judicial do original.
