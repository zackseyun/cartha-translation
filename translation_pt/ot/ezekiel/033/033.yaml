  yaml_path: translation/ot/ezekiel/033/033.yaml
  text: When it comes—and look, it is coming—then they will know that a prophet has been among them.
translation:
  language: pt
  text: Quando isso vier — e eis que vem —, eles saberão que houve um profeta no meio deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: Quando isso vier
  rationale: O infinitivo com preposição expressa o momento em que o acontecimento anunciado chegar. “Isso” retoma de modo natural, em português, o anúncio profético pressuposto pelo contexto.
- source_word: הִנֵּה בָאָה
  choice: e eis que vem
  rationale: Mantém a força enfática de הִנֵּה e a repetição deliberada do verbo בוא, comunicando que o cumprimento é iminente ou já está a caminho.
- source_word: נָבִיא הָיָה בְתוֹכָם
  choice: houve um profeta no meio deles
  rationale: Reproduz a construção existencial hebraica e conserva a ideia de que a presença do profeta só será reconhecida plenamente quando a mensagem se cumprir.
theological_decisions:
- issue: Momento do reconhecimento da autenticidade profética
  choice: eles saberão que houve um profeta no meio deles
  alternative: eles saberão que há um profeta entre eles
  rationale: O hebraico usa הָיָה, “houve/esteve”, olhando retrospectivamente para a presença do profeta após o cumprimento, sem transformar a frase numa afirmação geral no presente.
translation_notes:
  register: Português moderno, claro e solene. A formulação conserva a repetição e a ênfase do hebraico sem acrescentar uma identificação explícita do acontecimento anunciado.
