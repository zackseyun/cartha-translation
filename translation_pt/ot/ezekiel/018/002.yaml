source:
  edition: WLC
  text: מַה לָּ/כֶ֗ם אַתֶּם֙ מֹֽשְׁלִים֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אָבוֹת֙ יֹ֣אכְלוּ בֹ֔סֶר וְ/שִׁנֵּ֥י הַ/בָּנִ֖ים תִּקְהֶֽינָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/002.yaml
  text: What do you mean, that you keep repeating this proverb in the land of Israel[a], saying, ‘The fathers eat sour grapes, and the children’s teeth are set on edge’?”
translation:
  language: pt
  text: '“O que vocês querem dizer ao continuar repetindo este provérbio na terra de Israel: ‘Os pais comem uvas verdes, e os dentes dos filhos ficam embotados[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficam ásperos” ou “ficam sensíveis”. O hebraico descreve o efeito nos dentes associado a uvas verdes ou ácidas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּכֶם
  choice: Por que vocês
  rationale: A expressão idiomática introduz uma repreensão ou contestação. Em português corrente, “Por que vocês” comunica naturalmente a censura dirigida à prática dos ouvintes, sem recorrer à formulação pouco idiomática “O que há com vocês?”.
- source_word: מֹשְׁלִים
  choice: continuam repetindo
  rationale: O particípio de משל descreve uma prática recorrente de proferir ou empregar um provérbio. “Continuam repetindo” preserva esse aspecto habitual e reiterado.
- source_word: הַמָּשָׁל הַזֶּה
  choice: este provérbio
  rationale: מָשָׁל designa aqui um dito proverbial, não uma parábola narrativa; “provérbio” é o equivalente preciso e natural.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: na terra de Israel
  rationale: Embora עַל possa significar “sobre” ou “a respeito de”, a expressão neste contexto indica o âmbito em que o provérbio circulava. “Na terra de Israel” é natural e preserva a referência territorial de אַדְמָה.
- source_word: אָבוֹת
  choice: os pais
  rationale: No provérbio, o plural masculino אָבוֹת refere-se aos pais da geração anterior. Em português, “pais” é a designação normal dos progenitores masculinos e mantém o contraste geracional.
- source_word: יֹאכְלוּ בֹסֶר
  choice: comem uvas verdes
  rationale: בֹסֶר são uvas ainda não maduras e, portanto, ácidas. “Uvas verdes” expressa isso de modo corrente em português; o imperfeito hebraico tem valor geral no provérbio e é vertido pelo presente.
- source_word: שִׁנֵּי הַבָּנִים
  choice: os dentes dos filhos
  rationale: בָּנִים significa formalmente “filhos” e, no contraste proverbial, representa os descendentes que sofrem a consequência. “Filhos” conserva a imagem familiar sem limitar necessariamente a referência apenas aos homens.
- source_word: תִּקְהֶינָה
  choice: ficam embotados
  rationale: O verbo descreve o efeito desagradável de perda de sensibilidade ou aspereza nos dentes provocado por alimento ácido. “Ficam embotados” mantém a imagem tradicional e semanticamente próxima; a nota esclarece o sentido.
theological_decisions:
- issue: Responsabilidade entre gerações sugerida pelo provérbio
  choice: Manter literalmente a relação entre os pais que comem e os filhos cujos dentes sofrem o efeito
  alternative: Explicitar no texto que os filhos sofrem pelas ações dos pais
  rationale: O versículo cita um provérbio que será contestado no contexto seguinte. A tradução não deve antecipar a resposta teológica nem transformar a figura em explicação.
- issue: Termos de parentesco no provérbio
  choice: “pais” e “filhos”
  alternative: “antepassados” e “descendentes”
  rationale: Os termos familiares concretos preservam a força imagética do hebraico. “Filhos” pode funcionar coletivamente em português, como בָּנִים no provérbio, sem necessidade de neutralização interpretativa.
- issue: Sentido de עַל אַדְמַת יִשְׂרָאֵל
  choice: “na terra de Israel”
  alternative: “a respeito da terra de Israel”
  rationale: A preposição admite mais de uma relação, mas o contexto favorece o local onde o dito é repetido. A opção não faz do território o assunto do provérbio, interpretação menos provável.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pergunta foi formulada como repreensão direta; o provérbio conserva sua concisão e seu paralelismo. “Embotados” é mantido no texto por sua precisão e tradição bíblica, com esclarecimento em nota.
