  text: וְ/אִ֖ישׁ כִּי יִהְיֶ֣ה צַדִּ֑יק וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/005.yaml
  text: But if a man is righteous and does justice and righteousness,[a]
translation:
  language: pt
  text: Mas, se um homem for justo e praticar a justiça e a retidão,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ora, se um homem” ou “E, se um homem”; a conjunção hebraica pode indicar simples continuação, e não necessariamente contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: Mas, se um homem
  rationale: אִישׁ é o substantivo masculino singular “homem”, aqui como caso representativo. A conjunção וְ pode indicar simples continuação ou, no fluxo do argumento, uma transição com leve contraste; “Mas” expressa bem essa função, sem excluir as alternativas registradas em nota.
- source_word: כִּי
  choice: se
  rationale: Com o imperfeito seguinte, כִּי introduz aqui a prótase de uma condição geral; “se” é a forma natural em português.
- source_word: יִהְיֶה
  choice: for
  rationale: O imperfeito de היה exprime o estado na condição geral. Depois de “se”, o futuro do subjuntivo “for” é idiomático em português.
- source_word: צַדִּיק
  choice: justo
  rationale: צַדִּיק descreve alguém justo ou íntegro. “Justo” preserva o sentido moral e jurídico e é natural no português atual.
- source_word: וְ/עָשָׂה
  choice: e praticar
  rationale: עשה com substantivos éticos como objetos significa fazer ou praticar. “Praticar” comunica de modo natural uma conduta efetiva, não apenas uma qualidade abstrata.
- source_word: מִשְׁפָּט
  choice: o que é justo
  rationale: מִשְׁפָּט neste par ético aponta para justiça, juízo correto ou aquilo que é justo. A expressão evita a formulação pouco natural “praticar justiça e justiça” diante da proximidade semântica dos dois termos.
- source_word: וּ/צְדָקָה
  choice: e correto
  rationale: 'צְדָקָה indica retidão ou justiça. “Correto” preserva a distinção contextual em relação a מִשְׁפָּט e produz uma expressão portuguesa clara: “o que é justo e correto”.'
theological_decisions:
- issue: Singular representativo marcado pelo gênero
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: O hebraico emprega אִישׁ, “homem”, no masculino singular. A tradução conserva essa forma como caso representativo, sem afirmar que o princípio moral se restrinja aos homens.
- issue: Relação entre מִשְׁפָּט e צְדָקָה
  choice: o que é justo e correto
  alternative: justiça e retidão; juízo e justiça
  rationale: 'Os dois termos correlatos permanecem distintos, mas são expressos numa construção natural em português. A formulação não reduz a justiça do homem a mera condição interior: o contexto enfatiza conduta concretamente praticada.'
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O futuro do subjuntivo é natural na oração condicional. A construção “praticar o que é justo e correto” evita repetição abstrata e preserva a dupla ênfase ética do hebraico.
