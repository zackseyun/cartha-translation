  text: בְּ/שׁוּב צַדִּ֧יק מִ/צִּדְקָת֛/וֹ וְ/עָ֥שָׂה עָ֖וֶל וּ/מֵ֣ת עֲלֵי/הֶ֑ם בְּ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/026.yaml
  text: When a righteous man turns away from his righteousness and does injustice[a], and dies because of them[b], he shall die for the injustice that he has done.
translation:
  language: pt
  text: Quando um justo se desvia da sua justiça e pratica a injustiça[a], e morre por causa dessas coisas[b], morrerá pela injustiça que praticou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pratica o mal” ou “comete perversidade”. O hebraico עָוֶל pode indicar injustiça, mal ou perversidade.'
    reason: lexical_alternative
  - marker: b
    text: “Dessas coisas” retoma os atos injustos mencionados; o hebraico emprega um pronome no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Quando ... se desvia
  rationale: A preposição בְּ com o infinitivo construto introduz uma oração temporal; com מִן, שׁוּב indica aqui afastar-se de uma condição anterior.
- source_word: צַדִּיק
  choice: um justo
  rationale: O adjetivo singular masculino é empregado substantivamente para apresentar um caso individual que expressa um princípio geral.
- source_word: מִצִּדְקָתוֹ
  choice: da sua justiça
  rationale: Mantém o vínculo lexical com צַדִּיק e o contraste ético entre a conduta justa anterior e a injustiça posterior.
- source_word: וְעָשָׂה עָוֶל
  choice: e pratica a injustiça
  rationale: עָוֶל abrange injustiça, mal e perversidade; esta formulação preserva a força ética e judicial da expressão sem recorrer a vocabulário arcaico.
- source_word: וּמֵת עֲלֵיהֶם
  choice: e morre por causa dessas coisas
  rationale: Traduz o valor causal de עַל e torna perceptível o pronome plural hebraico, cujo referente são os atos injustos mencionados.
- source_word: בְּעַוְלוֹ אֲשֶׁר עָשָׂה
  choice: pela injustiça que praticou
  rationale: Expressa naturalmente o valor causal de בְּ e preserva a oração relativa que destaca a responsabilidade pelo próprio ato.
- source_word: יָמוּת
  choice: morrerá
  rationale: O imperfeito apresenta a consequência certa do princípio enunciado; o futuro simples é natural e solene em português.
theological_decisions:
- issue: Se o versículo deve resolver debates posteriores sobre apostasia ou perseverança
  choice: 'Traduzir diretamente a advertência condicional: o justo que se desvia, pratica injustiça e morre por causa desses atos morrerá por sua injustiça.'
  alternative: Reformular o texto para enfatizar a apostasia definitiva ou para minimizar a realidade do desvio.
  rationale: O hebraico declara o princípio moral sem desenvolver uma conclusão sistemático-teológica sobre debates posteriores; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Um justo” é natural no registro bíblico sem ser arcaico; “dessas coisas” preserva explicitamente o plural hebraico.
