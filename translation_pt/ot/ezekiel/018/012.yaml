  text: עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנָ֔ה גְּזֵל֣וֹת גָּזָ֔ל חֲבֹ֖ל לֹ֣א יָשִׁ֑יב וְ/אֶל הַ/גִּלּוּלִים֙ נָשָׂ֣א עֵינָ֔י/ו תּוֹעֵבָ֖ה עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/012.yaml
  text: He has oppressed the poor and needy[a], committed robbery, not returned a pledge, lifted up his eyes to the idols, and done an abomination.
translation:
  language: pt
  text: Oprimiu o pobre e o necessitado, praticou roubos, não devolveu o penhor, levantou os olhos para os ídolos[a] e cometeu uma abominação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é deliberadamente depreciativo e pode transmitir a ideia de “ídolos imundos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי וְאֶבְיוֹן
  choice: o pobre e o necessitado
  rationale: A dupla expressão designa pessoas social e economicamente vulneráveis. A formulação é clara, corrente e conserva os dois termos hebraicos.
- source_word: הוֹנָה
  choice: oprimiu
  rationale: O verbo indica maus-tratos ou exploração, especialmente grave quando dirigida ao pobre e ao necessitado.
- source_word: גְּזֵלוֹת גָּזָל
  choice: praticou roubos
  rationale: A construção hebraica com substantivo e verbo da mesma raiz reforça a ideia de apropriação ilícita; o plural em português reflete o substantivo plural e soa natural.
- source_word: חֲבֹל לֹא יָשִׁיב
  choice: não devolveu o que recebeu como penhor
  rationale: חֲבֹל refere-se a um bem entregue como garantia de dívida. A expansão torna o sentido claro sem introduzir uma interpretação além do texto.
- source_word: וְאֶל־הַגִּלּוּלִים נָשָׂא עֵינָיו
  choice: levantou os olhos para os ídolos
  rationale: Conserva a imagem hebraica, que no contexto sugere atenção ou devoção idolátrica, sem explicitá-la como 'adorou'.
- source_word: הַגִּלּוּלִים
  choice: os ídolos
  rationale: É a equivalência clara no texto principal; a conotação depreciativa própria do termo de Ezequiel é registrada em nota.
- source_word: תּוֹעֵבָה עָשָׂה
  choice: cometeu uma abominação
  rationale: Preserva o peso moral e religioso de תּוֹעֵבָה em linguagem portuguesa digna e reconhecível.
theological_decisions:
- issue: Imagem de levantar os olhos e sua força idolátrica
  choice: levantou os olhos para os ídolos
  alternative: adorou os ídolos
  rationale: O contexto indica devoção idolátrica, mas o hebraico emprega a imagem de levantar os olhos. A tradução preserva essa imagem e evita resolver de modo explícito o que o texto exprime por meio do idioma.
- issue: Força moral de תּוֹעֵבָה
  choice: cometeu uma abominação
  alternative: fez algo detestável
  rationale: “Abominação” mantém a linguagem forte e a dimensão moral e cultual do termo, sem restringi-lo a apenas uma dessas esferas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura em sequência acompanha a lista hebraica de delitos; o sujeito permanece implícito, como é natural em português e compatível com o contexto.
