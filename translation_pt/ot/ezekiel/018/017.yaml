  text: מֵ/עָנִ֞י הֵשִׁ֣יב יָד֗/וֹ נֶ֤שֶׁךְ וְ/תַרְבִּית֙ לֹ֣א לָקָ֔ח מִשְׁפָּטַ֣/י עָשָׂ֔ה בְּ/חֻקּוֹתַ֖/י הָלָ֑ךְ ה֗וּא לֹ֥א יָמ֛וּת בַּ/עֲוֺ֥ן אָבִ֖י/ו חָיֹ֥ה יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/017.yaml
  text: He has withheld his hand from the poor[a], has not taken interest or profit, has carried out my judgments, and has walked in my statutes. He will not die for his father's iniquity[c][b]; he will surely live.
translation:
  language: pt
  text: Deixou de explorar o pobre[a], não cobrou juros nem recebeu acréscimo[b], praticou os meus juízos e andou segundo os meus estatutos. Não morrerá pela iniquidade de seu pai[c]; certamente viverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «reteve a sua mão do pobre». A expressão hebraica descreve deixar de prejudicar ou explorar o pobre.'
    reason: lexical_alternative
  - marker: b
    text: «Juros» e «acréscimo» traduzem dois termos hebraicos relacionados, referentes ao ganho obtido por meio de um empréstimo; tradicionalmente, «usura e acréscimo».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «não morrerá na iniquidade de seu pai». No contexto, o sentido é que ele não morrerá por causa da culpa de seu pai.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעָנִי הֵשִׁיב יָדוֹ
  choice: Retirou sua mão de sobre o pobre
  rationale: A expressão significa literalmente que ele fez sua mão voltar para longe do pobre. A formulação mantém a imagem hebraica e, com «de sobre», sugere que ele deixou de agir contra o pobre, em vez de insinuar que se recusou a ajudá-lo.
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: juros nem lucro
  rationale: Os dois termos relacionados designam, respectivamente, juros cobrados em empréstimo e acréscimo ou ganho obtido. A dupla moderna preserva a distinção sem restringir נֶשֶׁךְ ao sentido atual de juros excessivos.
- source_word: מִשְׁפָּטַי עָשָׂה
  choice: praticou os meus juízos
  rationale: Mantém o caráter jurídico de מִשְׁפָּט e reproduz a ideia hebraica de pôr em prática as determinações divinas.
- source_word: בְּחֻקּוֹתַי הָלָךְ
  choice: andou segundo os meus estatutos
  rationale: Preserva a metáfora bíblica de andar como descrição da conduta e mantém o registro pactual e jurídico.
- source_word: בַּעֲוֺן אָבִיו
  choice: pela iniquidade de seu pai
  rationale: A preposição pode marcar esfera ou causa. Neste contexto, «pela» comunica naturalmente que ele não morrerá por causa da culpa paterna, sem negar a alternativa mais literal registrada em nota.
- source_word: חָיֹה יִחְיֶה
  choice: certamente viverá
  rationale: O infinitivo absoluto seguido do verbo conjugado intensifica a afirmação; «certamente» expressa essa ênfase em português natural.
theological_decisions:
- issue: Responsabilidade individual e a iniquidade do pai
  choice: O filho não morrerá por causa da iniquidade do pai quando sua própria conduta é justa.
  alternative: «Não morrerá na iniquidade de seu pai», tradução mais formal da preposição בְּ.
  rationale: O argumento imediato de Ezequiel 18 trata da responsabilidade de cada pessoa por sua própria conduta. A tradução causal se ajusta ao contexto, enquanto a nota conserva a forma alternativa e a ambiguidade da preposição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais no Brasil. Preservam-se as metáforas de retirar a mão e andar segundo os estatutos, bem como o paralelismo jurídico. «Iniquidade» mantém o peso moral e teológico de עָוֹן; «certamente viverá» transmite a construção enfática hebraica.
