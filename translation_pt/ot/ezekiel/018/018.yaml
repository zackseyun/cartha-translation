  source_fidelity: 'A tradução preserva adequadamente a estrutura causal e o contraste contextual: o pai é responsabilizado por sua própria iniquidade. “Praticou opressão” comunica de forma fiel a construção enfática עָשַׁק עֹשֶׁק; “cometeu roubo contra um irmão” preserva tanto o ato quanto o substantivo אָח sem impor um possessivo ausente no hebraico. “Fez o que não era bom”, “no meio do seu povo”, “eis que” e “morrerá na sua própria iniquidade” refletem bem as expressões hebraicas e o perfeito profético de מֵת.'
