  text: אָבִ֞י/ו כִּֽי עָ֣שַׁק עֹ֗שֶׁק גָּזַל֙ גֵּ֣זֶל אָ֔ח וַ/אֲשֶׁ֥ר לֹא ט֛וֹב עָשָׂ֖ה בְּ/ת֣וֹךְ עַמָּ֑י/ו וְ/הִנֵּה מֵ֖ת בַּ/עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
translation:
  language: pt
  text: Quanto ao pai, porque praticou opressão, cometeu roubo contra um irmão[a] e fez o que não era bom no meio do seu povo, eis que morrerá na sua própria iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “roubou um irmão”. “Irmão” pode referir-se de modo geral a outro membro da comunidade. O hebraico combina verbo e substantivo da mesma raiz para dar ênfase ao roubo.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “eis que morre na sua própria iniquidade” ou “eis que está morto na sua própria iniquidade”. A forma verbal hebraica apresenta o desfecho como certo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  choice: Quanto ao pai
  rationale: Retoma o pai em contraste com o filho justo no contexto, mantendo explícita a relação familiar sem exigir em português o possessivo repetido.
- source_word: כִּי
  choice: porque
  rationale: Expressa com clareza a relação causal entre os atos do pai e sua morte.
- source_word: עָשַׁק עֹשֶׁק
  choice: praticou opressão
  rationale: A combinação cognata de verbo e substantivo dá ênfase ao ato; a formulação preserva o campo semântico amplo de exploração e opressão.
- source_word: גָּזַל גֵּזֶל אָח
  choice: cometeu roubo contra um irmão
  rationale: Reproduz, de modo natural, a ênfase da construção cognata e mantém a ausência de sufixo possessivo em אָח; 'irmão' pode designar outro membro da comunidade.
- source_word: וַאֲשֶׁר לֹא טוֹב עָשָׂה
  choice: e fez o que não era bom
  rationale: Preserva o modo deliberadamente indireto do hebraico, sem substituí-lo pela formulação mais forte 'fez o mal'.
- source_word: בְּתוֹךְ עַמָּיו
  choice: no meio do seu povo
  rationale: Mantém a localização social e comunitária do delito em linguagem portuguesa clara e digna.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva o marcador enfático e o tom profético do hebraico.
- source_word: מֵת
  choice: morrerá
  rationale: Embora formalmente perfeito, apresenta neste contexto judicial-profético um resultado certo; o futuro comunica isso naturalmente em português.
- source_word: בַּעֲוֹנוֹ
  choice: na sua própria iniquidade
  rationale: Mantém a preposição hebraica e o peso moral de עָוֹן; 'própria' torna natural e explícita em português a referência pessoal do sufixo, coerente com o contraste do capítulo.
theological_decisions:
- issue: Responsabilidade individual pelo pecado em Ezequiel 18
  choice: O pai morrerá na sua própria iniquidade, em consequência dos atos descritos.
  alternative: Entender a frase apenas como declaração geral de morte em estado de culpa, sem salientar a responsabilidade pessoal.
  rationale: Os sufixos pessoais e a estrutura causal do versículo vinculam a consequência à iniquidade do próprio pai. A tradução preserva isso sem acrescentar uma formulação doutrinária além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e profético. Mantêm-se o eufemismo hebraico 'não era bom', o marcador enfático 'eis que' e a linguagem moral 'iniquidade'. Os marcadores [a] e [b] aparecem no texto principal.
