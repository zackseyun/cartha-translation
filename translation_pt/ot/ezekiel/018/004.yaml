  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֤ן כָּל הַ/נְּפָשׁוֹת֙ לִ֣/י הֵ֔נָּה כְּ/נֶ֧פֶשׁ הָ/אָ֛ב וּ/כְ/נֶ֥פֶשׁ הַ/בֵּ֖ן לִ/י הֵ֑נָּה הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֥יא תָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/004.yaml
  text: Look[a], every life belongs to me. The life of the father is like the life of the son—both belong to me. The person who sins is the one who will die.
translation:
  language: pt
  text: 'Vejam: toda vida pertence a mim.[a] Tanto a vida do pai como a vida do filho pertencem a mim. A pessoa que pecar, essa morrerá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as almas são minhas [...] a alma que pecar morrerá”. O termo hebraico נֶפֶשׁ pode significar “alma”, “vida”, “ser” ou “pessoa”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Introduz uma declaração enfática e chama a atenção dos ouvintes em português atual, sem recorrer ao mais solene e menos corrente “Eis”.
- source_word: כָּל הַנְּפָשׁוֹת
  choice: toda vida
  rationale: נֶפֶשׁ pode designar vida, pessoa, ser ou alma. Neste contexto, “toda vida” expressa de modo distributivo que cada vida humana pertence a Deus, sem impor uma concepção técnica da alma.
- source_word: לִי הֵנָּה
  choice: pertence a mim
  rationale: Expressa naturalmente a posse indicada pelo hebraico, literalmente “são minhas”.
- source_word: כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן
  choice: Tanto a vida do pai como a vida do filho
  rationale: A construção correlativa põe pai e filho em condição igual diante de Deus; “tanto... como...” comunica essa equivalência com clareza.
- source_word: הַנֶּפֶשׁ
  choice: A pessoa
  rationale: Na conclusão, נֶפֶשׁ identifica o agente moral individual. “Pessoa” comunica melhor essa responsabilidade do que “alma”, que hoje pode sugerir apenas uma parte imaterial do ser humano.
- source_word: הַחֹטֵאת
  choice: que pecar
  rationale: Conserva a força verbal do particípio e formula naturalmente em português a condição geral daquele que comete pecado.
- source_word: הִיא
  choice: essa
  rationale: Retém a identificação enfática do pronome hebraico; seu gênero feminino é concordância gramatical com נֶפֶשׁ e não indica necessariamente uma pessoa do sexo feminino.
- source_word: תָמוּת
  choice: morrerá
  rationale: Expressa de modo direto e atual a consequência ou sentença anunciada pelo imperfeito hebraico.
theological_decisions:
- issue: Tradução de נֶפֶשׁ em uma passagem frequentemente relacionada à doutrina da alma
  choice: Traduzir נֶפֶשׁ conforme o contexto por “vida” nas declarações de pertença e por “pessoa” na declaração de responsabilidade
  alternative: Usar “alma” em todas as ocorrências
  rationale: O versículo destaca que todas as vidas pertencem a Deus e que cada indivíduo responde pelo próprio pecado; não apresenta uma antropologia técnica sobre uma alma imaterial. A variação contextual preserva esse ponto sem excluir a tradução tradicional, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vejam” preserva a função de chamar a atenção; “essa morrerá” mantém a ênfase do hebraico sem soar excessivamente arcaico.
