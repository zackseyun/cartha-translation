  text: בַּ/נֶּ֧שֶׁךְ נָתַ֛ן וְ/תַרְבִּ֥ית לָקַ֖ח וָ/חָ֑י לֹ֣א יִֽחְיֶ֗ה אֵ֣ת כָּל הַ/תּוֹעֵב֤וֹת הָ/אֵ֨לֶּה֙ עָשָׂ֔ה מ֣וֹת יוּמָ֔ת דָּמָ֖י/ו בּ֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/013.yaml
  text: He lends at interest and takes profit—and shall he live? He shall not live[a]. He has done all these abominations; he shall surely be put to death[c][b]; his blood shall be upon him.
translation:
  language: pt
  text: Empresta a juros e cobra lucro — acaso viverá? Não viverá.[a] Cometeu todas essas abominações; certamente será morto.[b] Seu sangue recairá sobre ele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir “com usura”. Os termos hebraicos se referem a juros ou ganhos obtidos de um empréstimo, especialmente no contexto de práticas exploratórias condenadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “certamente morrerá”. A expressão hebraica é uma sentença de morte enfática.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “seu sangue estará sobre ele”, expressão que indica que ele é responsável pela própria morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ
  choice: a juros
  rationale: נֶשֶׁךְ designa juros cobrados sobre empréstimo, sobretudo em contextos que condenam práticas exploratórias. “A juros” é claro e atual, sem restringir o sentido à noção moderna de juros excessivos.
- source_word: וְתַרְבִּית
  choice: lucro
  rationale: תַּרְבִּית forma par com נֶשֶׁךְ e indica ganho ou acréscimo obtido por meio do empréstimo. “Lucro” preserva a distinção aproximada entre os dois termos.
- source_word: וָחָי לֹא יִחְיֶה
  choice: acaso viverá? Não viverá
  rationale: A formulação mantém a força da pergunta retórica seguida de negação enfática, em vez de reduzi-la a uma declaração simples.
- source_word: אֵת כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: todas essas abominações
  rationale: תּוֹעֵבוֹת descreve atos detestáveis com forte peso moral e de aliança; “abominações” conserva a intensidade e o registro profético.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto seguido da forma passiva intensifica a sentença de morte. A tradução preserva tanto a ênfase quanto a voz passiva, sem especificar quem executa a sentença.
- source_word: דָּמָיו בּוֹ יִהְיֶה
  choice: Seu sangue recairá sobre ele
  rationale: A expressão idiomática atribui ao transgressor a responsabilidade pela própria morte. A formulação portuguesa mantém a imagem do sangue e comunica naturalmente essa responsabilidade.
theological_decisions:
- issue: Natureza da sentença de morte na retórica jurídico-profética
  choice: “certamente será morto” como sentença enfática em voz passiva
  alternative: “certamente morrerá”
  rationale: O hebraico sugere uma sentença de morte, mas não identifica neste versículo o agente nem o procedimento. A tradução conserva a força judicial e deixa essa tensão sem resolução adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica e a linguagem profética forte foram preservadas; evitou-se especificar qualquer mecanismo humano ou divino não declarado no versículo.
