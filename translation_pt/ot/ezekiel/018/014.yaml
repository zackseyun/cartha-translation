source:
  edition: WLC
  text: וְ/הִנֵּה֙ הוֹלִ֣יד בֵּ֔ן וַ/יַּ֕רְא אֶת כָּל חַטֹּ֥את אָבִ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּרְאֶ֕ה וְ/לֹ֥א יַעֲשֶׂ֖ה כָּ/הֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/014.yaml
  text: But behold[a], he fathers a son, and he sees all the sins that his father has done; he sees them[b], and he does not do likewise.
translation:
  language: pt
  text: Mas eis que ele gera um filho[a], e esse filho vê todos os pecados que seu pai cometeu; ele os vê[b], mas não faz o mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele tem um filho”. O hebraico expressa literalmente a geração do filho.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete “vê” para dar ênfase: “vê... ele os vê”.'
    reason: source_form
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Mas eis que
  rationale: Introduz com vivacidade um caso contrastante em relação ao exemplo anterior. “Eis que” preserva a força apresentativa de הִנֵּה, enquanto “mas” expressa a ligação contrastiva do וְ no contexto.
- source_word: הוֹלִיד בֵּן
  choice: ele gera um filho
  rationale: O hifil de ילד tem sentido causativo de gerar um descendente. “Gera um filho” é preciso, digno e compreensível em português atual.
- source_word: וַיַּרְא
  choice: esse filho vê
  rationale: A explicitação do sujeito evita que o leitor atribua a ação ao pai. O presente combina com o caráter ilustrativo e casuístico da passagem.
- source_word: כָּל חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה
  choice: todos os pecados que seu pai cometeu
  rationale: Expressa חַטֹּאת em sentido plural e liga claramente os pecados aos atos praticados pelo pai. “Cometeu” é a colocação portuguesa natural com “pecados”.
- source_word: וַיִּרְאֶה
  choice: ele os vê
  rationale: Conserva a repetição deliberada do verbo ראה, acrescentando apenas o pronome objeto necessário para a fluência em português.
- source_word: וְלֹא יַעֲשֶׂה כָּהֵן
  choice: mas não faz o mesmo
  rationale: Transmite de modo idiomático a ideia de não agir daquela maneira nem reproduzir os atos mencionados. O “mas” torna explícito o contraste entre ver os pecados e não imitá-los.
theological_decisions:
- issue: Responsabilidade moral individual no caso ilustrativo
  choice: O filho vê os pecados praticados pelo pai, mas não os imita.
  alternative: O filho incorre na culpa do pai apesar de agir de modo diferente.
  rationale: A sequência verbal contrapõe expressamente a observação da conduta paterna à recusa de repeti-la. A tradução mantém essa contraposição sem acrescentar conclusões doutrinárias além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva o tom profético sem tornar a frase arcaica; a repetição de “vê” preserva a ênfase do hebraico.
