  yaml_path: translation/ot/ezekiel/018/029.yaml
  text: Yet the house of Israel says[a], ‘The way of the Lord is not just.’ Are my ways not just, O house of Israel? Is it not your ways that are not just?
translation:
  language: pt
  text: 'Contudo, a casa de Israel diz[a]: “O caminho do Senhor não é justo.” Não são justos os meus caminhos, ó casa de Israel? Não são injustos os caminhos de vocês?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O caminho do Senhor não é correto” ou “não é equitativo”. O verbo hebraico se refere ao que é medido ou ordenado corretamente; aqui, diz respeito à retidão moral da maneira de o Senhor agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Contudo, ... diz
  rationale: A conjunção com o verbo introduz a objeção persistente do povo. O presente é natural no discurso argumentativo, e “contudo” expressa a força adversativa no contexto.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a designação coletiva e pactual do hebraico, sem reduzi-la simplesmente a “Israel”.
- source_word: לֹא יִתָּכֵן / לֹא יִתָּכְנוּ
  choice: não é justo / não são justos
  rationale: O verbo תכן, no nifal, evoca aquilo que está corretamente medido, ordenado ou avaliado. Neste debate moral, “justo” comunica adequadamente a acusação e a resposta, mantendo a mesma raiz conceitual nas três ocorrências.
- source_word: דֶּרֶךְ / דְּרָכַי / דַרְכֵיכֶם
  choice: caminho / meus caminhos / caminhos de vocês
  rationale: “Caminho” preserva a metáfora recorrente para a maneira de agir. Os plurais hebraicos são mantidos na resposta divina e no contraste com a conduta do povo.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Forma portuguesa tradicional e clara para o título divino, natural na expressão “o caminho do Senhor”.
- source_word: הֲלֹא
  choice: Não são ...? / Não são ... que ...?
  rationale: As perguntas retóricas esperam concordância e preservam o tom de repreensão do hebraico.
theological_decisions:
- issue: Termo de avaliação moral na acusação contra Deus
  choice: Traduzir יִתָּכֵן por “justo” em todas as ocorrências
  alternative: “correto”, “reto” ou “imparcial”
  rationale: “Justo” conserva a dimensão ética e judicial da discussão sobre o modo de Deus agir. A repetição mantém a simetria retórica sem estreitar o sentido à percepção subjetiva moderna de imparcialidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Casa de Israel” mantém a expressão bíblica coletiva; “caminhos de vocês” evita o regionalismo de “vossos caminhos”. A repetição de “justo” e “caminhos” preserva a estrutura argumentativa do original.
