base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/016.yaml
  text: He has not oppressed anyone[a], has not taken a pledge, and has not robbed[b]; he has given his bread to the hungry and covered the naked with a garment.
translation:
  language: pt
  text: Não oprimiu ninguém, não tomou nenhum bem como penhor[a] nem cometeu roubo; deu do seu pão ao faminto e cobriu com uma veste quem estava nu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, não tomou de um devedor um objeto como garantia da dívida.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ לֹא הוֹנָה
  choice: Não oprimiu ninguém
  rationale: אִישׁ sob negação tem sentido genérico, e הוֹנָה expressa oprimir ou maltratar. A formulação é natural em português e mantém o teor ético-social.
- source_word: חֲבֹל לֹא חָבָל
  choice: não tomou nenhum bem como penhor
  rationale: A construção cognata de חבל refere-se a tomar um objeto como garantia de dívida. A explicitação de “bem” torna o sentido econômico claro sem pressupor, além do texto, que a tomada tenha sido abusiva.
- source_word: וּגְזֵלָה לֹא גָזָל
  choice: nem cometeu roubo
  rationale: A combinação de substantivo e verbo da mesma raiz enfatiza o ato de roubar. “Cometeu roubo” reproduz melhor essa construção do que o simples “roubou”.
- source_word: לַחְמוֹ
  choice: do seu pão
  rationale: Mantém a imagem concreta de לֶחֶם e o pronome possessivo do hebraico, indicando que ele compartilhou seu próprio sustento.
- source_word: לְרָעֵב
  choice: ao faminto
  rationale: O adjetivo substantivado designa uma pessoa com fome; “ao faminto” é conciso, digno e claro.
- source_word: וְעֵרוֹם כִּסָּה בָגֶד
  choice: e cobriu com uma veste quem estava nu
  rationale: Preserva tanto a ação de cobrir quanto a menção concreta à veste, ao mesmo tempo que evita o substantivo potencialmente áspero “o nu”.
