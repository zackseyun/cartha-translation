  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל פְּשָׁעָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה לֹ֥א יִזָּכְר֖וּ ל֑/וֹ בְּ/צִדְקָת֥/וֹ אֲשֶׁר עָשָׂ֖ה יִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/022.yaml
  text: None of the transgressions that he has committed will be remembered against him[a]; by the righteousness that he has practiced[b], he will live.
translation:
  language: pt
  text: Nenhuma das transgressões que ele cometeu será lembrada contra ele[a]; pela justiça que praticou[b], ele viverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não será levada em conta contra ele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sua justiça” ou “por causa da sua justiça”; aqui, a preposição hebraica admite mais de um sentido estreitamente relacionado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא
  choice: Nenhuma
  rationale: Em português, a combinação do totalizador com o verbo negado é expressa naturalmente por “nenhuma ... será”, preservando a abrangência total do hebraico.
- source_word: פְּשָׁעָיו
  choice: das transgressões
  rationale: “Transgressões” mantém a força moral e jurídica de פשע, que pode designar atos de rebeldia, sem reduzi-los ao sentido mais genérico de “pecados”.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ele cometeu
  rationale: Com atos ilícitos ou pecaminosos, “cometer” é idiomático em português e transmite adequadamente o sentido de עשה.
- source_word: לֹא יִזָּכְרוּ לוֹ
  choice: será lembrada contra ele
  rationale: Preserva a forma passiva do nifal de זכר e explicita o valor judicial de לוֹ de maneira natural em português.
- source_word: בְּצִדְקָתוֹ
  choice: pela justiça
  rationale: “Pela” mantém aberta a relação causal, instrumental ou circunstancial possível da preposição בְּ, sem determinar mais do que o hebraico.
- source_word: אֲשֶׁר עָשָׂה
  choice: que praticou
  rationale: Com “justiça”, o verbo “praticar” expressa naturalmente uma conduta justa realizada, evitando o pouco idiomático “justiça que fez”.
- source_word: יִחְיֶה
  choice: ele viverá
  rationale: Mantém de modo claro e atual a força futura ou resultativa da promessa no contexto judicial e pactual do capítulo.
theological_decisions:
- issue: Se o versículo ensina autojustificação meritória ou formula o princípio pactual de responsabilidade individual e vida para quem passa a praticar a justiça
  choice: Traduzir diretamente a afirmação de que as transgressões não serão lembradas contra a pessoa e de que ela viverá pela justiça que praticou.
  alternative: Empregar linguagem forense posterior mais forte, ou reduzir “viverá” a simples bem-estar temporal.
  rationale: A tradução conserva os termos judiciais e pactuais próprios de Ezequiel e não resolve debates teológicos posteriores que o texto hebraico não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo e o tom judicial do original, sem arcaísmos nem acréscimos confessionais.
