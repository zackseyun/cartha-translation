  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A construção narrativa com היה introduz a chegada da revelação. Em português, incorporar seu valor ao verbo «veio» preserva naturalmente a sequência do discurso, sem o literalismo pouco idiomático «e aconteceu».
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר־יְהוָה, «a palavra» designa uma comunicação divina específica e mantém a formulação recorrente do texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com sufixo de primeira pessoa e é natural na expressão portuguesa «veio a mim».
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo introduz a fala direta que começa no versículo seguinte; «dizendo:» conserva essa função de modo claro e convencional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. «Yahweh» preserva o nome pessoal por transliteração, sem o substituir pelo título «SENHOR»; «Jeová» representa uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com formulação profética tradicional. O conectivo hebraico inicial não foi vertido por «E», pois o versículo abre uma nova unidade e, em português, a sequência permanece natural sem ele.
