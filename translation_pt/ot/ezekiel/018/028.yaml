base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/028.yaml
  text: Because he considered and turned back from all his transgressions that he had committed[a], he will surely live[b]; he will not die.
translation:
  language: pt
  text: Pois ele considerou[a] e se voltou[b] de todas as transgressões que havia cometido, certamente viverá; não morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “viu”. Também se pode traduzir o início por “E ele viu” ou “Porque ele viu”; neste contexto, “ver” provavelmente tem o sentido de perceber ou considerar.
    reason: lexical_alternative
  - marker: b
    text: Ou “voltou atrás” ou “se arrependeu”. O hebraico emprega o verbo “voltar/retornar”, preservando a imagem de uma mudança de direção para longe do pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶה
  choice: Pois ele percebeu
  rationale: רָאָה significa literalmente “ver”, mas aqui indica reconhecimento ou percepção que leva a uma mudança de conduta. “Percebeu” comunica esse sentido em português natural. O וַ inicial foi traduzido contextualmente por “Pois”, sem excluir a leitura simplesmente coordenativa indicada na nota.
- source_word: וישוב
  choice: e se afastou
  rationale: שׁוּב significa “voltar/retornar” e, com מִן, expressa afastar-se de algo. “Se afastou” preserva a ideia concreta de abandonar as transgressões sem substituir a imagem pelo termo teológico “arrepender-se”.
- source_word: מִכָּל פְּשָׁעָיו
  choice: de todas as transgressões
  rationale: פֶּשַׁע denota transgressão ou rebelião deliberada. “Transgressões” mantém a gravidade moral e é claro no registro bíblico moderno.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia cometido
  rationale: Embora עָשָׂה seja literalmente “fazer”, em português se “cometem” transgressões. O mais-que-perfeito situa naturalmente os atos antes do afastamento.
- source_word: חָיוֹ יִחְיֶה
  choice: certamente viverá
  rationale: A construção com infinitivo absoluto e verbo conjugado intensifica a afirmação. “Certamente viverá” reproduz essa ênfase de modo natural.
- source_word: לֹא יָמוּת
  choice: não morrerá
  rationale: Tradução direta da forma verbal negada, preservando o contraste enfático entre viver e morrer.
theological_decisions:
- issue: Alcance da promessa de vida e da declaração de que não morrerá
  choice: Manter a afirmação direta “certamente viverá; não morrerá” sem definir a natureza dessa vida e morte.
  alternative: Interpretar explicitamente como sobrevivência física, vida judicial no contexto da aliança, vida espiritual ou vida escatológica.
  rationale: O hebraico não restringe aqui a referência a uma única categoria teológica. A formulação direta preserva a força moral da promessa e sua tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo enfático final e evita definir além do texto o caráter da vida e da morte.
