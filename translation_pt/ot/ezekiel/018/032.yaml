  text: כִּ֣י לֹ֤א אֶחְפֹּץ֙ בְּ/מ֣וֹת הַ/מֵּ֔ת נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָשִׁ֖יבוּ וִֽ/חְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/032.yaml
  text: For I take no pleasure in the death of the one who dies[a], declares the Lord GOD[c][b]. Therefore turn back and live.
translation:
  language: pt
  text: Pois não tenho prazer na morte daquele que morre[a] — declara o Senhor Yahweh[b]. Portanto, voltem[c] e vivam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na morte daquele que está morrendo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: אֲדֹנָי יְהוִה, “Senhor Yahweh”; tradicionalmente, “Senhor DEUS”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “retornem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta o apelo anterior e mantém, em português natural, a força explicativa da conjunção.
- source_word: לֹא אֶחְפֹּץ
  choice: não tenho prazer
  rationale: חפץ pode expressar prazer, agrado ou desejo. A formulação preserva a disposição divina expressa no texto sem reduzir o sentido apenas a vontade ou intenção.
- source_word: בְּמוֹת הַמֵּת
  choice: na morte daquele que morre
  rationale: Mantém tanto a construção com מוֹת, “morte”, quanto o particípio הַמֵּת, “aquele que morre”, sem substituí-lo interpretativamente por “o perverso”.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente e solene da fórmula profética de pronunciamento.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Traduz אֲדֹנָי como “Senhor” e representa explicitamente o nome divino יהוה como “Yahweh”, evitando a combinação artificial “Senhor SENHOR”.
- source_word: וְהָשִׁיבוּ
  choice: Portanto, voltem
  rationale: O imperativo plural de שוב convoca os ouvintes a voltar ou mudar de direção. “Voltem” conserva a imagem verbal sem explicitar além do hebraico o conceito teológico mais amplo de arrependimento; “Portanto” torna clara a relação conclusiva.
- source_word: וִחְיוּ
  choice: e vivam
  rationale: Reproduz de modo direto o segundo imperativo plural e preserva a concisão enfática do apelo.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida traduz o título אֲדֹנָי e preserva o nome da aliança יהוה em vez de ocultá-lo sob um título substitutivo.
- issue: Identidade de הַמֵּת
  choice: daquele que morre
  alternative: do perverso
  rationale: Embora o contexto trate do perverso que deve abandonar seu caminho, o substantivo “perverso” não aparece nesta oração. A tradução mantém a formulação do versículo e sua tensão teológica sem estreitá-la por inferência contextual.
- issue: Força de שוב no apelo final
  choice: voltem
  alternative: arrependam-se
  rationale: “Voltem” preserva a metáfora e a amplitude lexical do verbo hebraico. “Arrependam-se” expressaria uma implicação contextual legítima, mas seria mais interpretativo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção “daquele que morre” é deliberadamente próxima do hebraico para conservar a participação verbal e evitar a interpretação contextual “o perverso”. O travessão destaca de modo natural a fórmula profética.
