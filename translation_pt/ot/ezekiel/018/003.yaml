reference: Ezekiel 18:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם יִֽהְיֶ֨ה לָ/כֶ֜ם ע֗וֹד מְשֹׁ֛ל הַ/מָּשָׁ֥ל הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/003.yaml
  text: As I live[a], declares the Lord GOD[b], this proverb shall no longer be used by you in Israel.
translation:
  language: pt
  text: “Tão certo como eu vivo[a]”, declara o Senhor Yahweh, “vocês não usarão mais[b] esse provérbio em Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Fórmula hebraica de juramento divino, literalmente: “Vivo eu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não citarão mais” ou “não repetirão mais”; o verbo hebraico se refere a empregar um provérbio ou dito proverbial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Reproduz de modo natural em português a fórmula hebraica de juramento divino, preservando a referência explícita à vida de Deus e a solenidade da declaração.
- source_word: נְאֻם
  choice: declara
  rationale: Expressa com naturalidade a fórmula profética que introduz uma declaração divina autorizada.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém distintos o título אֲדֹנָי, traduzido como “Senhor”, e o nome divino יהוה, transliterado “Yahweh”, evitando a repetição “Senhor SENHOR”.
- source_word: אִם יִהְיֶה ... עוֹד
  choice: não ... mais
  rationale: No contexto de um juramento, אִם introduz uma negação enfática elíptica; junto com עוֹד, indica que a prática cessará definitivamente.
- source_word: לָכֶם
  choice: vocês
  rationale: O dativo indica que o provérbio pertence ao uso dos destinatários. Em português, o sujeito explícito de “usarão” comunica esse valor com clareza.
- source_word: מְשֹׁל
  choice: usarão
  rationale: O infinitivo verbal refere-se a empregar ou repetir um provérbio. “Usarão” é amplo, natural e não restringe indevidamente o modo de sua circulação.
- source_word: הַמָּשָׁל הַזֶּה
  choice: esse provérbio
  rationale: מָשָׁל designa aqui o dito proverbial citado no contexto imediato. “Esse” aponta naturalmente, em português, para o provérbio já mencionado.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Preserva diretamente o âmbito locativo e social em que o provérbio circulava.
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A opção preserva tanto o título אֲדֹנָי quanto o nome próprio da aliança יהוה, sem fundi-los nem produzir a forma pouco natural “Senhor SENHOR”.
- issue: Força do juramento com אִם
  choice: 'declaração enfaticamente negativa: “não usarão mais”'
  alternative: 'forma literal e incompleta: “se ainda houver para vocês...”'
  rationale: Em fórmulas hebraicas de juramento, a consequência imprecatória fica subentendida, e אִם introduz aquilo que o falante solenemente nega que ocorrerá. A tradução explicita a força pragmática sem acrescentar uma ameaça não expressa.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível tanto no Brasil quanto em outros contextos lusófonos. “Vocês” evita uma forma regionalmente marcada de segunda pessoa plural; “esse provérbio” retoma naturalmente o dito apresentado no contexto anterior.
