source:
  edition: WLC
  text: בְּ/חֻקּוֹתַ֧/י יְהַלֵּ֛ךְ וּ/מִשְׁפָּטַ֥/י שָׁמַ֖ר לַ/עֲשׂ֣וֹת אֱמֶ֑ת צַדִּ֥יק הוּא֙ חָיֹ֣ה יִֽחְיֶ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/009.yaml
  text: He walks in my statutes and keeps my judgments[a], acting faithfully; he is righteous; he shall surely live, declares the Lord GOD.
translation:
  language: pt
  text: Anda nos meus estatutos e guarda os meus juízos, agindo com fidelidade[a]. Ele é justo; certamente viverá — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fazendo a verdade”, isto é, agindo com veracidade ou fidelidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקּוֹתַי
  choice: nos meus estatutos
  rationale: חֻקּוֹת designa prescrições ou decretos estabelecidos. A expressão mantém o sentido jurídico e pactual.
- source_word: יְהַלֵּךְ
  choice: anda
  rationale: הלך descreve aqui, de modo metafórico, a maneira habitual de viver. “Anda” preserva a imagem hebraica e é compreensível em português bíblico moderno.
- source_word: וּמִשְׁפָּטַי
  choice: e guarda os meus juízos
  rationale: מִשְׁפָּטִים tem sentido jurídico de decisões, normas ou ordenanças; “juízos” conserva esse matiz, enquanto שׁמר é adequadamente expresso por “guarda”.
- source_word: לַעֲשׂוֹת אֱמֶת
  choice: agindo com fidelidade
  rationale: Literalmente, a expressão pode ser entendida como “fazer a verdade”. No contexto ético, אֱמֶת comunica veracidade, integridade e fidelidade; a formulação escolhida soa natural sem ocultar a alternativa literal, registrada em nota.
- source_word: צַדִּיק
  choice: justo
  rationale: צַדִּיק caracteriza a pessoa como moral e juridicamente reta no argumento do capítulo. “Justo” preserva o termo teológico tradicional e é corrente em português.
- source_word: חָיֹה יִחְיֶה
  choice: certamente viverá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente viverá” reproduz a ênfase de maneira natural.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração divina solene. “Senhor Yahweh” distingue אֲדֹנָי do nome pactual יְהוִה e preserva este último como nome próprio.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי, “Senhor”, do nome divino יְהוִה, transliterado “Yahweh”, sem fundir os dois elementos.
- issue: Alcance da promessa חָיֹה יִחְיֶה
  choice: certamente viverá
  alternative: certamente permanecerá vivo
  rationale: A formulação mantém a enfática promessa de vida no argumento de Ezequiel sobre responsabilidade individual, sem definir além do contexto se a vida mencionada é apenas física ou possui alcance teológico mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve preservação da metáfora hebraica “anda” e da linguagem jurídica “estatutos” e “juízos”. A pontuação separa com clareza a conduta descrita, o veredito de justiça e a promessa enfática de vida.
