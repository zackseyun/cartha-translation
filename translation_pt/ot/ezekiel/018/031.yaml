  text: הַשְׁלִ֣יכוּ מֵ/עֲלֵי/כֶ֗ם אֶת כָּל פִּשְׁעֵי/כֶם֙ אֲשֶׁ֣ר פְּשַׁעְתֶּ֣ם בָּ֔/ם וַ/עֲשׂ֥וּ לָ/כֶ֛ם לֵ֥ב חָדָ֖שׁ וְ/ר֣וּחַ חֲדָשָׁ֑ה וְ/לָ֥/מָּה תָמֻ֖תוּ בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/031.yaml
  text: Cast away from yourselves all your transgressions by which you have transgressed[a], and make for yourselves a new heart and a new spirit. Why should you die, O house of Israel?
translation:
  language: pt
  text: Afastem de vocês todas as suas rebeldias, em que se rebelaram[a], e façam para si um coração novo e um espírito novo. Por que vocês haveriam de morrer, ó casa de Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as suas transgressões, em que transgrediram”. O hebraico repete a mesma raiz em “rebeldias” e “se rebelaram”, ressaltando a culpa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלִיכוּ מֵעֲלֵיכֶם
  choice: Lancem para longe de vocês
  rationale: Preserva a força do imperativo plural e a ideia de remover de sobre si aquilo que deve ser rejeitado, em formulação clara e solene.
- source_word: כָּל־פִּשְׁעֵיכֶם אֲשֶׁר פְּשַׁעְתֶּם בָּם
  choice: todas as suas transgressões com as quais transgrediram
  rationale: Mantém a repetição intencional da raiz hebraica פשע no substantivo e no verbo, ainda que a construção portuguesa seja enfática e menos comum.
- source_word: וַעֲשׂוּ לָכֶם
  choice: e façam para vocês mesmos
  rationale: Expressa diretamente o verbo עשה e o dativo reflexivo לָכֶם, sem transformar o mandamento em mera aquisição.
- source_word: לֵב חָדָשׁ
  choice: um coração novo
  rationale: Conserva a imagem central de Ezequiel para a disposição interior, sem reduzi-la a mente ou sentimentos.
- source_word: וְרוּחַ חֲדָשָׁה
  choice: um espírito novo
  rationale: Preserva o vocabulário teológico e a associação paralela entre coração e espírito.
- source_word: וְלָמָּה תָמֻתוּ
  choice: Por que vocês haveriam de morrer
  rationale: A construção comunica a força retórica e apelativa da pergunta, em vez de apresentá-la como simples previsão.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Mantém o vocativo coletivo e o tom solene do apelo profético.
theological_decisions:
- issue: Responsabilidade humana e ação divina na renovação do coração e do espírito
  choice: Manter o imperativo “façam para vocês mesmos um coração novo e um espírito novo”.
  alternative: Suavizar para “recebam” ou harmonizar explicitamente com a promessa de que Deus dará coração e espírito novos.
  rationale: O texto formula uma exigência direta dirigida a Israel. A tradução preserva, sem a resolver, a tensão genuína com passagens como Ezequiel 36, nas quais a renovação é apresentada como ação de Deus.
- issue: Repetição da raiz פשע
  choice: Usar “transgressões” e “transgrediram”.
  alternative: Usar “rebeldias” e “se rebelaram”.
  rationale: As duas opções são lexicalmente possíveis. “Transgressão” mantém a linguagem de violação culpável e permite reproduzir a repetição retórica do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A formulação deliberadamente enfática “transgressões com as quais transgrediram” conserva a repetição do hebraico; a nota oferece a alternativa lexical “rebeldias”. O vocativo “ó casa de Israel” mantém a solenidade profética.
