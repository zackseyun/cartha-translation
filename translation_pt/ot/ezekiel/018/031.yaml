revisions:
- from: Lancem para longe de vocês todas as suas transgressões com as quais transgrediram[a] e façam para vocês mesmos um coração novo e um espírito novo. Por que vocês haveriam de morrer, ó casa de Israel?
  to: Afastem de vocês todas as suas rebeldias, em que se rebelaram[a], e façam para si um coração novo e um espírito novo. Por que vocês haveriam de morrer, ó casa de Israel?
  rationale: A revisão substitui uma reprodução portuguesa pouco natural da construção cognata hebraica por “rebeldias, em que se rebelaram”. Assim, preserva-se a repetição retórica da raiz פשע e seu sentido de rebelião, enquanto a nota registra a alternativa “transgressões”. Os demais ajustes tornam os imperativos mais idiomáticos em português moderno, sem harmonizar nem interpretar a tensão entre a responsabilidade humana e a ação renovadora de Deus.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:41:30Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva os imperativos, a imagem de um coração e espírito novos, a pergunta retórica e o vocativo coletivo. Contudo, “com as quais transgrediram” é uma reprodução excessivamente literal da construção hebraica e soa semanticamente pouco natural em português. A relação cognata pode ser conservada de modo mais claro com “rebeldias em que se rebelaram”, alternativa plenamente sustentada por פשע como substantivo e verbo.
  naturalness: “Lancem para longe de vocês” é compreensível, mas algo pesado. “Afastem de vocês” comunica naturalmente a remoção exigida pelo hebraico em português moderno. A construção “façam para si” mantém o dativo reflexivo sem o peso coloquial de “para vocês mesmos”.
  terminology: “Coração” e “espírito” devem ser mantidos. Neste versículo, “rebeldias / se rebelaram” reproduz com maior naturalidade e transparência a repetição da raiz פשע do que “transgressões / transgrediram”, sem reduzir o sentido de violação contra a autoridade divina.
