  - severity: low
    issue: Formulações excessivamente literais no primeiro e no segundo imperativos
    rationale: “Lancem para longe de vocês” e “façam para vocês mesmos” são possíveis, mas “Afastem de vocês” e “façam para si” soam mais naturais, sem perda relevante de força ou de informação.
