  naturalness: O texto é geralmente claro e de registro apropriado. “Mas vocês dizem” corresponde mais diretamente ao verbo hebraico e introduz naturalmente a objeção. “Porque” explicita de modo fluente a relação explicativa que o contexto e a trilha de auditoria inglesa reconhecem.
  terminology: “Iniquidade”, “estatutos” e “certamente viverá” preservam bem o registro moral, legal e enfático. A substituição de “juízo” por “direito” evita ambiguidade moderna sem perder o par técnico מִשְׁפָּט וּצְדָקָה.
