base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/019.yaml
  text: Yet you say[a], ‘Why does the son not bear the iniquity of the father?’ Because the son has done justice and righteousness, has kept all my statutes, and has done them; he shall surely live.
translation:
  language: pt
  text: 'Mas vocês dizem: “Por que o filho não leva sobre si a iniquidade do pai[a]?” Porque o filho praticou o direito e a justiça, guardou todos os meus estatutos e os cumpriu; certamente viverá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a culpa do pai” ou “o castigo pela iniquidade do pai”. A expressão hebraica “levar sobre si a iniquidade” pode incluir tanto a culpa quanto suas consequências.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Mas vocês perguntam
  rationale: A conjunção com o perfeito na segunda pessoa do plural introduz a objeção dos ouvintes. “Mas” expressa a força adversativa do contexto, e “perguntam” introduz naturalmente a pergunta direta em português.
- source_word: לֹא נָשָׂא ... בַּעֲוֺן
  choice: não leva sobre si a iniquidade
  rationale: A expressão preserva o idioma hebraico de carregar a iniquidade, que pode abranger tanto a culpa quanto suas consequências, sem restringir o sentido a uma única interpretação.
- source_word: הַבֵּן / הָאָב
  choice: o filho / o pai
  rationale: Os artigos definidos apresentam pai e filho como representantes no contraste formulado pelo texto; a forma definida também preserva de perto o hebraico.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: o juízo e a justiça
  rationale: Mantém o par lexical característico de Ezequiel e seu sentido de conduta conforme os padrões de Deus.
- source_word: עָשָׂה
  choice: praticou
  rationale: “Praticou” comunica de modo natural uma conduta efetivamente realizada e combina bem, em português, com “juízo e justiça”.
- source_word: חֻקּוֹתַי
  choice: meus estatutos
  rationale: “Estatutos” conserva a terminologia jurídico-aliancista habitual do substantivo hebraico.
- source_word: שָׁמַר וַיַּעֲשֶׂה אֹתָם
  choice: guardou ... e os cumpriu
  rationale: Preserva a dupla ênfase hebraica em observar e efetivamente executar os estatutos, evitando em português a construção menos natural “fez os estatutos”.
- source_word: חָיֹה יִחְיֶה
  choice: certamente viverá
  rationale: O advérbio traduz a intensificação produzida pelo infinitivo absoluto seguido do verbo finito.
theological_decisions:
- issue: Sentido de “levar sobre si a iniquidade do pai”
  choice: Conservar a expressão abrangente “leva sobre si a iniquidade”
  alternative: “carrega a culpa do pai” ou “sofre o castigo pela iniquidade do pai”
  rationale: O substantivo עָוֹן pode indicar iniquidade, culpa ou a consequência punitiva da iniquidade. A formulação escolhida preserva a abrangência e a tensão do idioma hebraico no ensino sobre responsabilidade individual.
- issue: Relação lógica entre a pergunta e a afirmação seguinte
  choice: Ora
  alternative: Porque; mas
  rationale: O hebraico liga as orações por וְ, sem partícula causal explícita. “Ora” apresenta a resposta explicativa sem tornar gramaticalmente explícita uma causalidade que no original é inferida pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa plural do hebraico. A terminologia “iniquidade”, “juízo”, “justiça” e “estatutos” conserva o registro moral e jurídico do texto sem soar arcaica em excesso.
