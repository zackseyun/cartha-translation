  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ/רָשָׁ֗ע כִּ֤י יָשׁוּב֙ מִ/כָּל חטאת/ו אֲשֶׁ֣ר עָשָׂ֔ה וְ/שָׁמַר֙ אֶת כָּל חֻקּוֹתַ֔/י וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה חָיֹ֥ה יִחְיֶ֖ה לֹ֥א יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/021.yaml
  text: But if the wicked man turns back from all his sins that he has committed[a], and keeps all my statutes, and does justice and righteousness, he shall surely live; he shall not die.
translation:
  language: pt
  text: Mas, se o homem perverso se afastar[a] de todos os pecados que cometeu, guardar todos os meus estatutos e praticar a justiça e a retidão, certamente viverá; não morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se arrepender”. O verbo hebraico significa literalmente “virar-se” ou “voltar-se” e, aqui, descreve o afastamento do pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָשָׁע
  choice: o homem perverso
  rationale: Preserva a referência individual, masculina e singular do hebraico. “Perverso” expressa alguém caracterizado pela maldade sem recorrer ao tom mais tradicional de “ímpio”.
- source_word: כִּי
  choice: se
  rationale: Neste contexto, introduz uma condição; a conjunção precedente é representada por “Mas”.
- source_word: יָשׁוּב מִכָּל חטאתו
  choice: se afastar de todos os pecados
  rationale: O verbo שׁוּב contém a imagem concreta de virar-se ou voltar-se; com מִן e “pecados”, indica abandonar a conduta pecaminosa. “Se afastar de” é idiomático em português e evita substituir a imagem pelo termo teológico mais específico “arrepender-se”.
- source_word: אֲשֶׁר עָשָׂה
  choice: que cometeu
  rationale: Embora עשה signifique literalmente “fez”, em português os pecados são naturalmente “cometidos”.
- source_word: וְשָׁמַר אֶת כָּל חֻקּוֹתַי
  choice: guardar todos os meus estatutos
  rationale: שׁמר, em relação a preceitos, significa observar ou guardar. “Estatutos” mantém a nuance jurídico-aliancista de חֻקּוֹת.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: praticar a justiça e a retidão
  rationale: “Praticar” é natural com esses substantivos éticos em português, enquanto “justiça” e “retidão” preservam os dois conceitos distintos do texto hebraico.
- source_word: חָיֹה יִחְיֶה
  choice: certamente viverá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação; “certamente” comunica essa ênfase com clareza.
- source_word: לֹא יָמוּת
  choice: não morrerá
  rationale: Tradução direta do imperfeito negado, em equilíbrio com a declaração enfática anterior.
theological_decisions:
- issue: Se שׁוּב deve ser traduzido por linguagem teológica explícita
  choice: se afastar
  alternative: se arrepender
  rationale: A escolha conserva o movimento concreto de abandonar os pecados e não restringe o verbo ao uso teológico posterior; a alternativa é registrada em nota.
- issue: Se חָיֹה יִחְיֶה indica sobrevivência física, vida na aliança ou salvação escatológica
  choice: certamente viverá
  alternative: certamente permanecerá vivo
  rationale: A formulação mantém aberta a amplitude da linguagem de vida e morte em Ezequiel, sem reduzi-la a uma única interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o tom solene e condicional do discurso profético, sem arcaísmos desnecessários.
