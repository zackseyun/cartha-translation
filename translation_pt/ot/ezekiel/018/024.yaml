base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/024.yaml
  text: But when a righteous man turns away from his righteousness and does injustice[a], doing all the abominations that the wicked man does, shall he live? None of the righteous deeds that he has done will be remembered. In the treachery by which he has acted treacherously[c][b], and in the sin that he has committed—in them he shall die.
translation:
  language: pt
  text: Mas, quando um homem justo se desviar da sua justiça e praticar a injustiça, cometendo todas as abominações que o perverso pratica, acaso viverá? Nenhum dos atos justos que praticou será lembrado. Na infidelidade que cometeu[a] e no pecado que praticou — neles morrerá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “na sua infidelidade com que agiu infielmente”. O hebraico usa um substantivo e um verbo da mesma raiz, enfatizando a quebra de fidelidade; também pode ser traduzido por “traição” ou “transgressão”.
    reason: lexical_alternative
  - marker: b
    text: Lit. “neles morrerá”, isto é, na infidelidade e no pecado que acabam de ser mencionados. A expressão pode também ter nuance de causa no contexto.
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: Mas, se ... se desviar
  rationale: A construção introduz uma situação condicional-temporal, e שׁוב com מִן indica afastar-se de um estado anterior. “Mas” preserva o contraste com o versículo precedente.
- source_word: צַדִּיק
  choice: um homem justo
  rationale: O adjetivo substantivado masculino singular apresenta um caso representativo; a formulação conserva tanto a forma quanto a naturalidade em português.
- source_word: מִצִּדְקָתוֹ
  choice: da sua justiça
  rationale: Mantém a ligação lexical com “justo” e expressa a conduta ou condição moral da qual ele se afasta.
- source_word: וְעָשָׂה עָוֶל
  choice: e praticar a injustiça
  rationale: עָוֶל designa injustiça ou maldade. “Praticar a injustiça” é atual, claro e moralmente forte.
- source_word: כְּכֹל הַתּוֹעֵבוֹת
  choice: cometendo todas as abominações
  rationale: “Abominações” preserva a força do termo e sua ressonância moral e pactual em Ezequiel; “cometendo” expressa naturalmente a ação em português.
- source_word: הָרָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado contrasta diretamente com o homem justo. “Perverso” é natural e mantém o peso moral sem exigir repetição de “homem”.
- source_word: יַעֲשֶׂה וָחָי
  choice: acaso viverá?
  rationale: A pergunta retórica trata da sobrevivência diante do juízo. “Acaso” sinaliza sua força sem acrescentar uma resposta explícita.
- source_word: כָּל צדקתיו ... לֹא תִזָּכַרְנָה
  choice: Nenhum dos atos justos que praticou será lembrado
  rationale: A negação aplicada ao conjunto comunica que nem um só ato justo anterior será lembrado. “Atos justos” explicita o plural concreto no contexto.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: Por causa da infidelidade que cometeu
  rationale: A raiz מעל indica quebra de fidelidade ou traição. A formulação traduz o sentido causal da preposição no contexto e a repetição cognata é registrada em nota.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: e do pecado que praticou
  rationale: Expressa em português natural a construção cognata hebraica sem a repetição pouco idiomática “pecado que pecou”.
- source_word: בָּם יָמוּת
  choice: por causa deles morrerá
  rationale: O pronome plural retoma a infidelidade e o pecado. O valor causal é natural no contexto judicial, enquanto a forma mais literal é preservada em nota.
theological_decisions:
- issue: Se o texto ensina perda de mérito acumulado ou responsabilidade diante de Deus pela apostasia presente
  choice: Preservar a declaração judicial de que os atos justos anteriores não serão lembrados quando o justo abandona a justiça e pratica o mal.
  alternative: Interpretar explicitamente a passagem como perda de mérito salvífico ou atenuá-la como mera consequência social.
  rationale: O versículo afirma a responsabilidade moral individual e a morte decorrente da infidelidade e do pecado, sem resolver debates teológicos posteriores sobre mérito, perseverança ou salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o masculino singular representativo, a pergunta retórica e a tensão judicial do hebraico. As notas preservam a construção cognata de מעל e a expressão literal בָּם יָמוּת.
