  - severity: low
    issue: “Se” é aceitável, mas “quando” representa mais diretamente a construção temporal-condicional do infinitivo com בְ.
    rationale: No contexto contrastivo do versículo, “Mas, quando” soa natural em português e evita apresentar a cláusula apenas como hipótese abstrata.
