  text: וְ/הוֹלִ֥יד בֵּן פָּרִ֖יץ שֹׁפֵ֣ךְ דָּ֑ם וְ/עָ֣שָׂה אָ֔ח מֵ/אַחַ֖ד מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/010.yaml
  text: But if he fathers a violent son[a], one who sheds blood and does any one of these things,
translation:
  language: pt
  text: Mas, se ele gerar um filho violento[a], que derrama sangue e pratica contra um irmão qualquer uma destas coisas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E ele gera um filho violento, que derrama sangue e faz a um irmão uma destas coisas”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: וְהוֹלִיד
  choice: Mas, se ele gerar
  rationale: O hifil de ילד significa “gerar”. Embora וְ seja formalmente “e”, o contexto introduz, em contraste, uma nova hipótese; “Mas, se” expressa naturalmente essa relação sem alterar o conteúdo.
- source_word: בֵּן
  choice: um filho
  rationale: בֵּן designa especificamente um filho do sexo masculino, referência preservada em português.
- source_word: פָּרִיץ
  choice: violento
  rationale: O termo descreve alguém violento, brutal ou sem lei; “violento” é claro, conciso e combina com a menção imediata ao derramamento de sangue.
- source_word: שֹׁפֵךְ דָּם
  choice: que derrama sangue
  rationale: Mantém o particípio e o idiomatismo hebraico sem restringi-lo à categoria jurídica mais estreita de assassinato.
- source_word: וְעָשָׂה
  choice: e pratica
  rationale: Embora עשה seja o verbo comum “fazer”, “pratica” é mais natural em português para atos ofensivos e conserva o aspecto ativo da expressão.
- source_word: אָח מֵאַחַד מֵאֵלֶּה
  choice: qualquer uma dessas coisas
  rationale: A construção textual é difícil, mas no contexto aponta para uma dentre as ações mencionadas. “Qualquer uma” preserva a força singular e produz português inteligível.
theological_decisions:
- issue: Força condicional e adversativa da conjunção inicial
  choice: Mas, se ele gerar
  alternative: E ele gera
  rationale: A conjunção hebraica é formalmente “e”, porém o encadeamento contrasta o filho violento com o pai justo e desenvolve uma hipótese. A tradução explicita a lógica discursiva sem acrescentar uma conclusão teológica.
- issue: Extensão de שֹׁפֵךְ דָּם
  choice: que derrama sangue
  alternative: assassino
  rationale: A formulação idiomática conserva a amplitude do hebraico e evita decidir antecipadamente se toda ocorrência deve ser entendida apenas no sentido jurídico de homicídio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Gerar” preserva a referência masculina do verbo; “pratica” soa mais natural que “faz” diante de uma série de atos condenáveis. A vírgula final acompanha a continuação sintática do versículo seguinte.
