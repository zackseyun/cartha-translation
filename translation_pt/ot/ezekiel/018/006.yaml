reference: Ezekiel 18:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל וְ/אֶת אֵ֤שֶׁת רֵעֵ֨/הוּ֙ לֹ֣א טִמֵּ֔א וְ/אֶל אִשָּׁ֥ה נִדָּ֖ה לֹ֥א יִקְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/006.yaml
  text: he does not eat on the mountains[a], does not lift up his eyes to the idols of the house of Israel, does not defile his neighbor’s wife[c][b], and does not approach a woman during her menstrual impurity.
translation:
  language: pt
  text: não come nos montes[a], não ergue os olhos para os ídolos[b] da casa de Israel, não contamina a esposa do seu próximo e não se aproxima[c] de uma mulher durante a impureza menstrual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não come nos santuários dos montes”. A expressão se refere à participação em refeições sacrificiais nos lugares altos.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico traduzido por “ídolos” é fortemente depreciativo e expressa desprezo pelos falsos deuses.
    reason: lexical_alternative
  - marker: c
    text: “Aproximar-se” é um eufemismo hebraico para ter relações sexuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־הֶהָרִים ... אָכַל
  choice: come nos montes
  rationale: Preserva a imagem concreta e a formulação hebraica. No contexto de Ezequiel, a expressão alude à participação em refeições sacrificiais nos lugares altos; essa implicação cultual é esclarecida em nota sem ser incorporada à tradução principal.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: não ergue os olhos
  rationale: Mantém o idiomatismo hebraico, que aqui comunica atenção, confiança ou devoção dirigida aos ídolos.
- source_word: גִּלּוּלֵי
  choice: ídolos
  rationale: É a forma corrente e clara em português. O termo hebraico tem forte carga de desprezo, indicada em nota, enquanto traduções como “ídolos imundos” tornariam explícito no texto algo que está implícito na escolha lexical hebraica.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Conserva a expressão coletiva e o registro profético do hebraico.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: a esposa do seu próximo
  rationale: Expressa com clareza tanto אֵשֶׁת, “esposa de”, como רֵעַ, “próximo, companheiro”, em linguagem jurídica bíblica natural em português.
- source_word: לֹא טִמֵּא
  choice: não contamina
  rationale: Preserva a sobreposição entre transgressão sexual e linguagem de pureza, sem reduzir a expressão apenas a adultério ou violação.
- source_word: אִשָּׁה נִדָּה
  choice: uma mulher durante a impureza menstrual
  rationale: Comunica de modo claro o estado de impureza ritual associado à menstruação, sem recorrer a linguagem arcaica.
- source_word: לֹא יִקְרָב
  choice: não se aproxima
  rationale: Mantém o eufemismo hebraico para relações sexuais; a nota torna o sentido contextual explícito.
theological_decisions:
- issue: Explicitar ou não o contexto cultual de “comer nos montes” no texto principal
  choice: Manter “come nos montes” no texto principal
  alternative: “come nos santuários dos montes” ou “participa de refeições sacrificiais nos lugares altos”
  rationale: A tradução conserva a expressão profética hebraica e evita inserir no texto principal uma explicação contextual legítima, mas não lexicalmente explícita.
- issue: Traduzir a linguagem de pureza em termos apenas morais ou também rituais
  choice: Manter “contamina” e “impureza menstrual”
  alternative: “desonra” e “durante a menstruação”
  rationale: Essas escolhas preservam a tensão entre categorias morais, sexuais e rituais presente no versículo, sem nivelá-las em uma única categoria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe paralela reproduz a sequência de proibições do hebraico; os termos de pureza e o eufemismo sexual são preservados e esclarecidos por notas.
