  text: לָ/כֵן֩ אִ֨ישׁ כִּ/דְרָכָ֜י/ו אֶשְׁפֹּ֤ט אֶתְ/כֶם֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה שׁ֤וּבוּ וְ/הָשִׁ֨יבוּ֙ מִ/כָּל פִּשְׁעֵי/כֶ֔ם וְ/לֹֽא יִהְיֶ֥ה לָ/כֶ֛ם לְ/מִכְשׁ֖וֹל עָוֺֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/030.yaml
  text: Therefore I will judge each man according to his ways[a], O house of Israel, declares the Lord GOD. Repent and turn away from all your transgressions, so that iniquity may not become a stumbling block to you.
translation:
  language: pt
  text: Por isso, julgarei cada um de vocês segundo os seus caminhos, ó casa de Israel — declara o Senhor DEUS. Arrependam-se e afastem-se de todas as suas transgressões, para que a iniquidade não se torne uma pedra de tropeço para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que a sua iniquidade não leve vocês à ruína”. A expressão hebraica final é concisa e pode destacar tanto a iniquidade como pedra de tropeço quanto a ruína causada por ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a conclusão decorrente do argumento anterior com clareza e naturalidade em português.
- source_word: אִישׁ כִּדְרָכָיו אֶשְׁפֹּט אֶתְכֶם
  choice: julgarei cada um de vocês segundo os seus caminhos
  rationale: Mantém o caráter distributivo do singular אִישׁ dentro do destinatário coletivo e conserva a metáfora moral de 'caminhos'.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Preserva o vocativo profético e a designação coletiva tradicional.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor DEUS
  rationale: Traduz נְאֻם como fórmula profética de declaração e distingue os dois elementos do título divino אֲדֹנָי יְהוִה.
- source_word: שׁוּבוּ וְהָשִׁיבוּ
  choice: Arrependam-se e afastem-se
  rationale: No contexto moral, o primeiro verbo convoca a uma mudança de rumo; o segundo, seguido de מִן, explicita o afastamento das transgressões. A formulação evita repetição pouco natural sem perder o paralelismo.
- source_word: מִכָּל פִּשְׁעֵיכֶם
  choice: de todas as suas transgressões
  rationale: Transgressões conserva o peso de rebeldia e violação moral presente em פֶּשַׁע.
- source_word: לְמִכְשׁוֹל עָוֺן
  choice: a iniquidade não se torne uma pedra de tropeço para vocês
  rationale: Mantém visíveis tanto o sentido moral de עָוֺן quanto a imagem concreta de מִכְשׁוֹל, sem eliminar a concisão ambígua do hebraico.
theological_decisions:
- issue: Responsabilidade individual dentro do discurso dirigido à comunidade
  choice: cada um de vocês
  alternative: cada homem
  rationale: A expressão conserva a distribuição individual do juízo dentro da casa de Israel, mas emprega uma construção portuguesa corrente, sem sugerir indevidamente que a declaração se limita aos homens.
- issue: Sentido da expressão final לְמִכְשׁוֹל עָוֺן
  choice: a iniquidade não se torne uma pedra de tropeço para vocês
  alternative: a sua iniquidade não leve vocês à ruína
  rationale: O texto principal preserva os componentes lexicais e a metáfora hebraica; a nota registra a possível ênfase no resultado destrutivo da iniquidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O vocativo profético e a metáfora dos 'caminhos' foram preservados; formas verbais correntes evitam rigidez desnecessária.
