base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/008.yaml
  text: He does not lend at interest or take profit[a]; he keeps his hand back from injustice[c][b]; he executes true justice between one man and another.
translation:
  language: pt
  text: Não empresta com juros nem recebe lucro[a]; retira a mão da injustiça[b]; pronuncia um julgamento verdadeiro entre um homem e outro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não empresta com usura nem recebe acréscimo”. Os dois termos hebraicos se referem a ganhos cobrados sobre empréstimos.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “faz voltar sua mão da injustiça”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “entre um homem e um homem”, expressão jurídica que significa julgar com justiça entre duas partes.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ לֹא יִתֵּן
  choice: Não empresta com juros
  rationale: Embora יִתֵּן signifique literalmente “dá”, junto de נֶשֶׁךְ descreve conceder empréstimo a juros. A formulação é clara e atual.
- source_word: וְתַרְבִּית לֹא יִקָּח
  choice: nem recebe lucro
  rationale: תַרְבִּית indica ganho ou acréscimo obtido do empréstimo e é próximo de נֶשֶׁךְ. “Lucro” mantém alguma distinção entre os dois termos, sem afirmar uma diferença técnica precisa.
- source_word: מֵעָוֶל יָשִׁיב יָדוֹ
  choice: afasta a mão da injustiça
  rationale: Preserva a imagem hebraica de retirar a mão, isto é, abster-se de participar da injustiça, em português natural e digno.
- source_word: מִשְׁפַּט אֱמֶת יַעֲשֶׂה
  choice: pratica um julgamento verdadeiro
  rationale: A expressão mantém tanto o sentido judicial de מִשְׁפָּט quanto a qualidade de verdade ou fidelidade expressa por אֱמֶת; “pratica” traduz naturalmente o verbo comum “fazer” neste contexto ético.
- source_word: בֵּין אִישׁ לְאִישׁ
  choice: entre um homem e outro
  rationale: Conserva o masculino singular do texto e reproduz de modo natural o idioma jurídico que descreve o julgamento entre duas partes.
theological_decisions:
- issue: Relação entre נֶשֶׁךְ e תַרְבִּית
  choice: Termos relacionados vertidos como “juros” e “lucro”
  alternative: “usura” e “acréscimo”, ou “juros” para ambos
  rationale: O hebraico emprega dois termos próximos ligados ao ganho extraído de empréstimos. A tradução conserva a dupla expressão sem impor uma distinção técnica que o contexto não estabelece claramente.
- issue: Idioma jurídico masculino בֵּין אִישׁ לְאִישׁ
  choice: entre um homem e outro
  alternative: entre uma pessoa e outra; entre duas partes
  rationale: A redação preserva a forma masculina representativa do original, enquanto a nota esclarece sua função jurídica geral.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e direto. Mantém-se a metáfora da mão e a formulação masculina do idioma jurídico hebraico, com esclarecimentos em notas.
