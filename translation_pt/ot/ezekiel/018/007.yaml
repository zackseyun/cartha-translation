base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/007.yaml
  text: He does not oppress anyone[a], but restores the debtor’s pledge; he does not commit robbery[c][b]; he gives his bread to the hungry and covers the naked with a garment.
translation:
  language: pt
  text: Não oprime ninguém; devolve ao devedor o seu penhor[a]; não comete roubo; dá seu pão[b] ao faminto e cobre com uma veste quem está nu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devolve a garantia dada por uma dívida” ou “devolve ao devedor a garantia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu pão”; isto é, seu alimento.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dá roupa a quem está nu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנֶה
  choice: oprime
  rationale: O hifil de ינה indica opressão, exploração ou tratamento injusto, especialmente em contexto social e econômico.
- source_word: אִישׁ
  choice: ninguém
  rationale: Embora formalmente masculino singular, aqui o termo tem valor genérico como objeto da proibição; “ninguém” expressa isso com naturalidade em português.
- source_word: חֲבֹלָתוֹ חוֹב יָשִׁיב
  choice: devolve ao devedor o que recebeu como garantia de uma dívida
  rationale: A expressão descreve a devolução de um bem entregue ou tomado como garantia de uma obrigação. A formulação explicita a relação sem recorrer ao pouco corrente “penhor”.
- source_word: גְּזֵלָה לֹא יִגְזֹל
  choice: não comete roubo
  rationale: A construção com substantivo e verbo cognatos dá ênfase ao ato de roubar ou saquear; “não comete roubo” preserva essa força.
- source_word: לַחְמוֹ
  choice: seu pão
  rationale: Mantém a imagem concreta do hebraico, embora “pão” possa representar alimento em geral.
- source_word: לְרָעֵב
  choice: ao faminto
  rationale: O adjetivo substantivado designa a pessoa que passa fome; “ao faminto” é claro, digno e conciso.
- source_word: עֵירֹם
  choice: quem está nu
  rationale: O termo indica alguém nu ou sem roupa adequada. A expressão evita substantivar “o nu” e permanece natural.
- source_word: יְכַסֶּה בָּגֶד
  choice: cobre com uma veste
  rationale: Conserva o verbo “cobrir” e a referência explícita à peça de roupa, mantendo proximidade com a forma hebraica.
theological_decisions:
- issue: Sujeito ético masculino genérico
  choice: Mantém-se o sujeito masculino singular implícito nos verbos, em continuidade com o retrato do justo no contexto.
  alternative: Explicitar “essa pessoa” ou “tal homem” no início do versículo.
  rationale: O português permite omitir o pronome sem apagar a continuidade do sujeito singular nem transformar a descrição em uma afirmação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Preservam-se as imagens hebraicas de pão, cobertura e veste, enquanto a expressão jurídica sobre a garantia é formulada de modo acessível.
