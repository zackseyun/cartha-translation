  text: וּ/בְ/שׁ֣וּב רָשָׁ֗ע מֵֽ/רִשְׁעָת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יַּ֥עַשׂ מִשְׁפָּ֖ט וּ/צְדָקָ֑ה ה֖וּא אֶת נַפְשׁ֥/וֹ יְחַיֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/027.yaml
  text: And when a wicked man turns away from the wickedness that he has done and does justice and righteousness[a], he will preserve his life.
translation:
  language: pt
  text: Mas, quando o perverso se afasta da perversidade que praticou e pratica a justiça e a retidão, ele preservará a própria vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «manterá a si mesmo vivo» ou «salvará sua alma». O hebraico emprega néfesh, termo que, conforme o contexto, pode significar «vida», «pessoa» ou «alma».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  choice: Mas, quando ... se afasta
  rationale: A conjunção com o infinitivo construto introduz uma circunstância temporal, em contraste com o caso anterior. “Quando ... se afasta” expressa naturalmente a mudança de conduta.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo masculino singular substantivado designa o indivíduo caracterizado por sua perversidade. A forma mantém o singular representativo do hebraico.
- source_word: מֵֽ/רִשְׁעָת/וֹ אֲשֶׁר עָשָׂה
  choice: da perversidade que praticou
  rationale: A expressão refere-se à conduta perversa concretamente realizada. “Praticou” é natural em português com o substantivo abstrato “perversidade”.
- source_word: וַ/יַּ֥עַשׂ מִשְׁפָּט וּ/צְדָקָה
  choice: e faz o que é justo e correto
  rationale: 'A formulação comunica em português corrente o par ético hebraico sem fundir completamente seus dois elementos: מִשְׁפָּט aponta ao que é justo, e צְדָקָה ao que é correto ou reto.'
- source_word: הוּא אֶת נַפְשׁוֹ יְחַיֶּה
  choice: ele preservará a própria vida
  rationale: O piel de חיה significa manter vivo ou preservar, e נֶפֶשׁ, neste contraste entre vida e morte, refere-se naturalmente à vida ou à própria pessoa. “Própria” também reflete a ênfase do pronome explícito הוּא.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto moral e judicial
  choice: a própria vida
  alternative: a própria alma; a si mesmo
  rationale: O capítulo contrasta repetidamente viver e morrer como consequências do proceder humano diante do juízo de Deus. “Vida” preserva esse sentido contextual sem restringir a declaração à alma imaterial.
- issue: Relação entre mudança de conduta e vida
  choice: Preservar a formulação condicional-temporal do texto
  alternative: Explicitar uma doutrina sistemática sobre mérito, salvação ou arrependimento
  rationale: O versículo afirma que o perverso que abandona sua perversidade e passa a agir de modo justo preservará a vida. A tradução mantém essa tensão moral e judicial sem acrescentar uma explicação doutrinária ausente do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Perverso” mantém a caracterização moral forte de רָשָׁע; “o que é justo e correto” torna natural o par מִשְׁפָּט וּצְדָקָה. O marcador [a] aparece no texto principal.
