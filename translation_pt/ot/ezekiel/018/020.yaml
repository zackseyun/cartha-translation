source:
  edition: WLC
  text: הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֣יא תָמ֑וּת בֵּ֞ן לֹא יִשָּׂ֣א בַּ/עֲוֺ֣ן הָ/אָ֗ב וְ/אָב֙ לֹ֤א יִשָּׂא֙ בַּ/עֲוֺ֣ן הַ/בֵּ֔ן צִדְקַ֤ת הַ/צַּדִּיק֙ עָלָ֣י/ו תִּֽהְיֶ֔ה וְ/רִשְׁעַ֥ת רשע עָלָ֥י/ו תִּֽהְיֶֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/020.yaml
  text: The person who sins—he shall die[a]. A son shall not bear the iniquity of the father, and a father shall not bear the iniquity of the son. The righteousness of the righteous shall be upon him[b], and the wickedness of the wicked shall be upon him.
translation:
  language: pt
  text: A pessoa que pecar morrerá.[a] O filho não levará sobre si a iniquidade[b] do pai, e o pai não levará sobre si a iniquidade do filho. A justiça do justo estará sobre ele, e a perversidade do perverso estará sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “A alma que pecar, essa morrerá”. Aqui, “alma” (hebraico néfesh) se refere à pessoa individual.'
    reason: lexical_alternative
  - marker: b
    text: “Levar sobre si a iniquidade” é uma expressão jurídica hebraica que pode abranger tanto a culpa como a responsabilidade decorrente dela.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: a pessoa
  rationale: Neste contexto jurídico e moral, נֶפֶשׁ designa o indivíduo, não especificamente uma parte imaterial do ser humano. “Pessoa” comunica esse sentido com naturalidade.
- source_word: הַחֹטֵאת הִיא תָמוּת
  choice: que pecar, essa morrerá
  rationale: O particípio formula uma regra geral acerca de quem comete pecado; o pronome enfático הִיא é preservado por “essa”, e o futuro “morrerá” mantém a força declarativa da sentença.
- source_word: יִשָּׂא בַּעֲוֺן
  choice: levará sobre si a iniquidade
  rationale: A expressão hebraica envolve carregar a iniquidade e a responsabilidade decorrente dela. “Sobre si” torna o idioma compreensível sem reduzi-lo apenas a culpa ou punição.
- source_word: בֵּן / אָב
  choice: o filho / o pai
  rationale: Preserva os termos masculinos singulares e o paralelismo familiar da máxima jurídica hebraica.
- source_word: צִדְקַת הַצַּדִּיק
  choice: a justiça do justo
  rationale: Mantém a relação cognata e a simetria retórica do hebraico.
- source_word: עָלָיו תִּהְיֶה
  choice: ficará sobre ele
  rationale: Conserva a imagem de algo que recai ou permanece sobre a própria pessoa, em vez de explicá-la apenas como pertencimento.
- source_word: וְרִשְׁעַת רָשָׁע
  choice: e a perversidade do perverso
  rationale: “Perversidade” expressa a conduta moralmente má e mantém o paralelismo com “a justiça do justo”; a repetição cognata reproduz a formulação enfática do original.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: “Pessoa”, no texto principal
  alternative: “A alma que pecar”
  rationale: A afirmação trata da responsabilidade moral do indivíduo, sem definir a relação entre corpo e alma. A tradução evita impor ao termo uma antropologia técnica posterior.
- issue: Responsabilidade moral entre gerações
  choice: Manter a fórmula recíproca entre filho e pai
  alternative: Parafrasear como “ninguém será punido pelos pecados de outra pessoa”
  rationale: A paráfrase comunicaria a ideia geral, mas eliminaria as relações concretas e o paralelismo escolhidos pelo texto hebraico.
- issue: Amplitude jurídica de עָוֺן
  choice: “Levar sobre si a iniquidade”
  alternative: “Levar a culpa” ou “ser castigado pelo pecado”
  rationale: O termo pode envolver tanto a falta como sua responsabilidade ou consequência. A formulação escolhida preserva essa amplitude e não restringe o sentido somente à punição.
- issue: Força de עָלָיו nas cláusulas finais
  choice: “Ficará sobre ele”
  alternative: “Pertencerá a ele”
  rationale: A opção principal retém a metáfora hebraica e a tensão entre caráter, ato e responsabilidade pessoal, sem decidir exatamente como a justiça ou a perversidade está “sobre” alguém.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “essa morrerá” preserva a ênfase do pronome hebraico. “Iniquidade”, “justiça” e “perversidade” mantêm o peso moral e jurídico do verso; as repetições foram conservadas por seu valor retórico.
