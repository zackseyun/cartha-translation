  source_fidelity: A tradução preserva adequadamente as երեք negações coordenadas, a referência aos montes, aos ídolos da casa de Israel e à impureza sexual. Contudo, «a mulher do seu próximo» pode ser entendida em português simplesmente como uma mulher ligada ao próximo, enquanto אֵשֶׁת רֵעֵהוּ designa especificamente a esposa do próximo.
  naturalness: «Não comeu nos montes» é mais idiomático em português moderno do que «não comeu sobre os montes», sem perda relevante da imagem hebraica. «Não contaminou a esposa do seu próximo» mantém o registro solene e é compreensível, embora preserve deliberadamente a linguagem de impureza do original.
  terminology: «Ídolos da casa de Israel» conserva a expressão de Ezequiel; a nota comunica apropriadamente a carga pejorativa de גִּלּוּלִים. «Contaminou» é uma boa correspondência para טִמֵּא neste contexto e não introduz a noção de coerção.
