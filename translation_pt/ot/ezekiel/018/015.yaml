source:
  edition: WLC
  text: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ לֹ֥א טִמֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/015.yaml
  text: He has not eaten on the mountains[a], nor lifted up his eyes to the idols of the house of Israel[b]; he has not defiled his neighbor’s wife.
translation:
  language: pt
  text: Não comeu nos montes[a], nem levantou os olhos para os ídolos da casa de Israel[b]; não contaminou a esposa do seu próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “não comeu nos santuários dos montes”, isto é, não participou do culto idólatra.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “ídolos” é depreciativo e pode ter o sentido de “ídolos imundos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הֶהָרִים ... אָכָל
  choice: não comeu sobre os montes
  rationale: Preserva a imagem hebraica e a fórmula característica de Ezequiel, que neste contexto se refere à participação em refeições de culto nos lugares altos; a explicitação aparece em nota.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: nem levantou os olhos
  rationale: Mantém a expressão idiomática hebraica, compreensível em português, indicando atenção ou devoção dirigida aos ídolos.
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: os ídolos da casa de Israel
  rationale: “Ídolos” comunica com clareza o referente, enquanto a conotação fortemente depreciativa do termo hebraico é registrada em nota.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Conserva a designação nacional e pactual do hebraico e o estilo recorrente de Ezequiel.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: a mulher do seu próximo
  rationale: “Mulher”, no sentido contextual de esposa, e “próximo” reproduzem de modo natural e digno a relação expressa no hebraico.
- source_word: לֹא טִמֵּא
  choice: não contaminou
  rationale: Preserva o campo semântico de impureza moral e ritual no contexto de adultério, sem introduzir a ideia adicional de coerção que “violou” poderia sugerir.
theological_decisions:
- issue: Linguagem cultual de comer sobre os montes
  choice: A formulação literal é mantida no texto, com o sentido cultual esclarecido em nota.
  alternative: “Não comeu nos santuários dos montes.”
  rationale: No contexto de Ezequiel, a expressão designa participação em refeições ligadas ao culto idólatra nos lugares altos. A solução preserva a imagem original sem deixar o leitor sem esclarecimento.
- issue: Força moral da linguagem de impureza sexual
  choice: “não contaminou a mulher do seu próximo”
  alternative: “não violou a mulher do seu próximo”
  rationale: O hebraico descreve contaminação por adultério, mas não especifica coerção; “contaminou” preserva a categoria moral e cultual sem acrescentar essa ideia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe paralela e as imagens do hebraico foram preservadas, enquanto as nuances cultuais menos transparentes são esclarecidas em notas.
