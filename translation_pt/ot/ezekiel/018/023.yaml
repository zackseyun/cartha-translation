  rationale: A revisão preserva a pergunta retórica intensificada, a ambiguidade afetivo-volitiva de חפץ mediante «tenho algum prazer», a metáfora dos «caminhos» e a coordenação «voltar-se ... e viver». Ela também usa a convenção «o Senhor DEUS» para refletir adequadamente אֲדֹנָי יְהוִה e melhora a sintaxe portuguesa da pergunta final.
