base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/023.yaml
  text: Do I take any pleasure at all in the death of the wicked? declares the Lord GOD[c][b][a]. Is it not rather in his turning from his ways and living?
translation:
  language: pt
  text: “Acaso tenho algum prazer na morte do perverso?”, declara o Senhor DEUS[a]. “Não é antes no fato de ele se voltar dos seus caminhos e viver?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Senhor YHWH” (אֲדֹנָי יְהוִה). «DEUS», em maiúsculas, representa o nome divino YHWH neste título composto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não é antes quando ele se volta dos seus caminhos e vive?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָפֹץ אֶחְפֹּץ
  choice: Será que tenho algum prazer
  rationale: A construção intensiva com infinitivo absoluto e verbo finito é expressa naturalmente pela pergunta retórica com “algum prazer”, preservando a ênfase sem exagerá-la.
- source_word: מוֹת רָשָׁע
  choice: na morte do perverso
  rationale: “Morte” representa diretamente o substantivo hebraico, e “o perverso” conserva o singular representativo de רָשָׁע em linguagem corrente e digna.
- source_word: נְאֻם
  choice: declara
  rationale: Na fórmula profética, “declara” comunica com clareza o caráter autorizado do pronunciamento.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Soberano
  rationale: A expressão distingue e reúne אֲדֹנָי e o nome divino, evitando a repetição pouco natural “Senhor SENHOR”. A nota registra a forma hebraica e uma alternativa de tradução.
- source_word: הֲלוֹא
  choice: Não é, antes
  rationale: A pergunta espera resposta afirmativa; “antes” torna explícito em português o contraste retórico já presente na estrutura.
- source_word: בְּשׁוּבוֹ מִדְּרָכָיו
  choice: que ele se converta dos seus caminhos
  rationale: “Converter-se” comunica aqui a ideia de voltar-se ou abandonar a conduta anterior, enquanto “caminhos” preserva a metáfora hebraica. A nota oferece a formulação mais literal.
- source_word: וְחָיָה
  choice: e viva
  rationale: O verbo finito é preservado de modo natural e mantém aberta a relação entre conversão e vida, sem impor uma nuance causal ou final mais explícita.
theological_decisions:
- issue: A disposição divina diante da morte do perverso e de sua conversão
  choice: A pergunta retórica nega que Deus tenha prazer na morte do perverso e contrapõe a isso sua conversão e vida.
  alternative: Traduzir חפץ com sentido mais volitivo, como “desejo”, ou mais afetivo, como “deleito-me”.
  rationale: “Ter prazer” conserva a amplitude afetiva e volitiva de חפץ sem resolver o texto por meio de um sistema teológico externo. A tensão entre juízo, conversão e vida permanece na própria formulação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é solene sem arcaísmo; “perverso” mantém o valor moral de רָשָׁע, e “caminhos” preserva a metáfora bíblica.
