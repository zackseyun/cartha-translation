reference: Ezekiel 18:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י שִׁמְעוּ נָא֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/דַרְכִּ/י֙ לֹ֣א יִתָּכֵ֔ן הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/025.yaml
  text: 'Yet you say[a], ‘The way of the Lord is not just.’ Hear now, house of Israel: Is my way not just? Is it not your ways that are not just?'
translation:
  language: pt
  text: 'Contudo, vocês dizem[a]: “O caminho do Senhor não é justo.” Ouçam agora, casa de Israel: Acaso o meu caminho não é justo? Não são os caminhos de vocês que não são justos?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correto” ou “equitativo” em cada ocorrência de “justo”. O termo hebraico se refere ao que é apropriado ou equitativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Contudo, vocês dizem
  rationale: A conjunção, no contexto da contestação de Israel, tem força adversativa; “contudo” expressa naturalmente o contraste, e o presente “dizem” comunica a objeção em curso.
- source_word: יִתָּכֵן
  choice: é justo / são justos
  rationale: Neste debate sobre a equidade moral da conduta divina e humana, o nifal de תכן indica aquilo que é correto, próprio ou equitativo. “Justo” preserva o peso ético e judicial do termo.
- source_word: דֶּרֶךְ / דַרְכִּי / דַרְכֵיכֶם
  choice: caminho / meu caminho / caminhos de vocês
  rationale: “Caminho” conserva a metáfora hebraica para a maneira de agir. O singular referente ao Senhor e o plural referente a Israel foram mantidos.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Tradução tradicional e clara do título divino אֲדֹנָי, adequada ao registro profético.
- source_word: שִׁמְעוּ נָא
  choice: Ouçam agora
  rationale: O imperativo com נָא constitui um apelo enfático e imediato. “Ouçam agora” preserva sua urgência sem soar arcaico.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Mantém a forma corporativa e pactual do modo profético de se dirigir ao povo.
- source_word: הֲדַרְכִּי לֹא יִתָּכֵן
  choice: Acaso o meu caminho não é justo?
  rationale: “Acaso” assinala a pergunta retórica, que desafia os ouvintes a reconhecer a justiça do agir divino.
- source_word: הֲלֹא דַרְכֵיכֶם לֹא יִתָּכֵנוּ
  choice: Não são os caminhos de vocês que não são justos?
  rationale: 'A formulação mantém o plural hebraico e destaca a inversão retórica: o problema não está no caminho do Senhor, mas nos caminhos dos interlocutores.'
theological_decisions:
- issue: Caracterização moral da maneira de Deus agir diante da acusação de Israel
  choice: Traduzir יִתָּכֵן por “justo” em todas as ocorrências
  alternative: “correto”, “direito” ou “equitativo”
  rationale: O capítulo trata da justiça divina e da responsabilidade individual. “Justo” conserva a força moral e judicial da acusação e da resposta, sem reduzir a questão à mera percepção subjetiva de imparcialidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento plural “vocês” evita regionalismo excessivo; “casa de Israel” e “Ouçam agora” preservam o tom profético. A repetição de “não é justo” foi mantida para reproduzir a estrutura argumentativa do hebraico.
