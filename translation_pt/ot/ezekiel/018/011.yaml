source:
  edition: WLC
  text: וְ/ה֕וּא אֶת כָּל אֵ֖לֶּה לֹ֣א עָשָׂ֑ה כִּ֣י גַ֤ם אֶל הֶֽ/הָרִים֙ אָכַ֔ל וְ/אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/011.yaml
  text: But he has done none of all these things; instead, he has even eaten on the mountains and defiled his neighbor’s wife.
translation:
  language: pt
  text: Mas ele não fez nenhuma dessas coisas; pelo contrário, chegou até a comer nos montes[a] e contaminou a mulher do seu próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Provavelmente, participou de refeições ligadas ao culto nos lugares altos; veja o contexto de 18:6.
    reason: A expressão literal é concisa e pode ser obscura ao leitor moderno. A nota indica a conotação cultual provável no contexto, sem afirmá-la como conteúdo explícito da frase hebraica.
lexical_decisions:
- source_word: וְהוּא
  choice: Mas ele
  rationale: O waw introduz um contraste com a conduta justa anteriormente descrita; “mas ele” expressa naturalmente essa relação em português.
- source_word: אֶת כָּל אֵלֶּה לֹא עָשָׂה
  choice: não fez nenhuma dessas coisas
  rationale: Reproduz a negação abrangente e mantém a referência contextual às ações justas mencionadas antes.
- source_word: כִּי גַם
  choice: pelo contrário, chegou até a
  rationale: No contexto, a expressão reforça o contraste e acrescenta agravamento. Esta formulação preserva tanto a oposição quanto a força inclusiva de גַם.
- source_word: אֶל הֶהָרִים אָכַל
  choice: comeu nos montes
  rationale: Mantém a imagem concreta e o vocabulário cultual recorrente de Ezequiel sem inserir “sacrifícios” ou “ídolos” no corpo do texto.
- source_word: טִמֵּא
  choice: contaminou
  rationale: Conserva a linguagem de impureza do verbo hebraico, em vez de reduzi-la apenas a uma descrição jurídica ou sexual.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: a mulher do seu próximo
  rationale: Tradução direta que preserva o sentido relacional de רֵעַ e o registro bíblico natural em português.
theological_decisions:
- issue: Natureza da ação de comer nos montes
  choice: Manter “comeu nos montes” no texto e esclarecer sua provável conotação cultual em nota
  alternative: “comeu em santuários nos montes” ou “comeu alimentos oferecidos aos ídolos”
  rationale: O hebraico não explicita nesta frase o objeto da refeição nem menciona ídolos. A tradução evita tornar explícita uma interpretação contextual provável, mas não lexicalmente declarada.
- issue: Sentido de טִמֵּא em relação à mulher do próximo
  choice: “contaminou”
  alternative: “cometeu adultério com” ou “desonrou”
  rationale: “Contaminou” preserva a formulação teológica e ritual do texto. O contexto indica transgressão sexual, mas o verbo escolhido pelo hebraico é mais amplo e carregado de linguagem de impureza.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Próximo” preserva o tom bíblico sem soar excessivamente arcaico; “pelo contrário, chegou até a” torna explícita a progressão contrastiva da cláusula hebraica.
