  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por «SENHOR».'
    reason: Esclarecer a forma hebraica do nome divino e sua tradução tradicional.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה אלי, «veio» é natural em português e preserva a ideia de que a comunicação divina foi dirigida ao profeta.
- source_word: דְבַר
  choice: a palavra
  rationale: Nesta fórmula, דָּבָר designa uma comunicação divina. «A palavra» conserva a expressão profética recorrente e sua ressonância teológica sem explicitar demais como «mensagem».
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino expresso pelo tetragrama, em vez de substituí-lo pelo título tradicional «SENHOR».
- source_word: אֵלַי
  choice: a mim
  rationale: 'A preposição אֶל com o sufixo de primeira pessoa indica diretamente o destinatário: «a mim».'
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo לֵאמֹר introduz a fala direta que começa no versículo seguinte; «dizendo» mantém essa função de modo transparente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama como nome próprio. «Yahweh» preserva o nome no corpo do texto, enquanto a nota informa a tradição de substituí-lo por «SENHOR».
translation_notes:
  register: Português moderno, claro e digno, com formulação profética tradicional. Mantém-se «dizendo» porque a fala introduzida prossegue no versículo seguinte; a pontuação com dois-pontos torna essa relação natural em português.
