  text: הִנֵּ֥ה לָ/אֵ֖שׁ נִתַּ֣ן לְ/אָכְלָ֑ה אֵת֩ שְׁנֵ֨י קְצוֹתָ֜י/ו אָכְלָ֤ה הָ/אֵשׁ֙ וְ/תוֹכ֣/וֹ נָחָ֔ר הֲ/יִצְלַ֖ח לִ/מְלָאכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/004.yaml
  text: Look[a], it is given to the fire for fuel. The fire has consumed both of its ends, and its middle is charred[b]. Is it fit for any work?
translation:
  language: pt
  text: 'Vejam: a madeira é entregue ao fogo para ser consumida.[a] O fogo consumiu as duas extremidades, e o meio ficou chamuscado. Será que ela serve para algum trabalho?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para alimento” ou “para comer”, apresentando o fogo como quem consome a madeira.
    reason: lexical_alternative
  - marker: b
    text: Ou “é adequada para algum uso?” ou “serve para fazer alguma coisa?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Preserva a função dêitica e enfática da partícula, chamando a atenção para a ilustração em linguagem portuguesa atual.
- source_word: לָאֵשׁ נִתַּן
  choice: é entregue ao fogo
  rationale: Mantém a voz passiva de נתן e a ideia de destinação expressa por ל, sem especificar um agente ausente do hebraico.
- source_word: לְאָכְלָה
  choice: para ser consumida
  rationale: Expressa naturalmente a imagem hebraica de algo dado ao fogo 'para comer', preservando na nota a personificação literal.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: as duas extremidades
  rationale: Representa explicitamente os dois extremos da madeira e soa natural em português.
- source_word: אָכְלָה הָאֵשׁ
  choice: O fogo consumiu
  rationale: Traduz o uso metafórico comum de אכל para a ação destrutiva do fogo e mantém o aspecto concluído do contexto.
- source_word: וְתוֹכוֹ נָחָר
  choice: e o meio ficou chamuscado
  rationale: תוֹךְ indica a parte central, e נחר descreve o estado danificado pelo calor; 'ficou chamuscado' comunica claramente o resultado.
- source_word: הֲיִצְלַח לִמְלָאכָה
  choice: Será que ela ainda serve para algum trabalho?
  rationale: A pergunta retórica trata da utilidade ou aptidão da madeira. 'Ainda' explicita naturalmente em português a consequência do dano já descrito, sem alterar a lógica do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O substantivo “madeira”, implícito no hebraico deste versículo mas presente no contexto imediato, foi explicitado para evitar um pronome sem referente em uma citação isolada. Os tempos verbais distinguem a entrega apresentada na ilustração dos resultados já produzidos pelo fogo.
