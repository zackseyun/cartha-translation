base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/002.yaml
  text: Son of man[a], how is the wood of the vine better than any wood, the branch that is among the trees of the forest?
translation:
  language: pt
  text: “Filho do homem, que vantagem tem a madeira da videira sobre qualquer outra madeira — o ramo que está entre as árvores da floresta?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que é a madeira da videira, em comparação com qualquer outra madeira — o ramo que está entre as árvores da floresta?” O hebraico é elíptico e comparativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma de tratamento profética característica de Ezequiel e o idioma hebraico estabelecido; aqui é um vocativo dirigido ao profeta, não um título messiânico.
- source_word: מַה יִּהְיֶה
  choice: em que ... é melhor
  rationale: A construção hebraica é elíptica e comparativa. Esta formulação explicita em português a pergunta sobre a possível superioridade ou vantagem da madeira da videira.
- source_word: עֵץ הַגֶּפֶן
  choice: a madeira da videira
  rationale: Preserva o foco na madeira como material, essencial para a imagem desenvolvida nos versículos seguintes, em vez de se referir apenas à planta.
- source_word: מִכָּל עֵץ
  choice: do que qualquer outra madeira
  rationale: A preposição מִן assinala a comparação. “Qualquer outra madeira” é natural em português e deixa claro que a videira está sendo comparada com outras espécies de madeira.
- source_word: הַזְּמוֹרָה
  choice: o ramo
  rationale: O termo designa um ramo ou broto de videira. “O ramo” é claro e conciso, pois a referência à videira já foi estabelecida.
- source_word: אֲשֶׁר הָיָה בַּעֲצֵי הַיָּעַר
  choice: que está entre as árvores da floresta
  rationale: O presente exprime naturalmente a comparação genérica em português; “entre as árvores da floresta” representa com clareza a posição do ramo no conjunto das árvores.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a metáfora da madeira e a forma tradicional de tratamento “Filho do homem”, enquanto torna explícita no texto principal a comparação implícita no hebraico.
