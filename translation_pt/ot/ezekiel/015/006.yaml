source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה כַּ/אֲשֶׁ֤ר עֵץ הַ/גֶּ֨פֶן֙ בְּ/עֵ֣ץ הַ/יַּ֔עַר אֲשֶׁר נְתַתִּ֥י/ו לָ/אֵ֖שׁ לְ/אָכְלָ֑ה כֵּ֣ן נָתַ֔תִּי אֶת יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/006.yaml
  text: 'Therefore thus says the Lord GOD: As the wood of the vine among the trees of the forest[a], which I have given to the fire for fuel, so I have given the inhabitants of Jerusalem.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: “Assim como a madeira da videira entre as árvores da floresta, que entreguei ao fogo para ser consumida,[a] assim entreguei os habitantes de Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ao fogo para consumo”; isto é, para ser completamente queimada. Outra tradução possível: “ao fogo como combustível”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de modo natural a conclusão e a aplicação da comparação anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro e sua cadência solene, sem linguagem arcaica.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa אֲדֹנָי por “Senhor” e conserva o nome divino expresso pelo tetragrama.
- source_word: עֵץ הַגֶּפֶן
  choice: a madeira da videira
  rationale: Neste contexto, עֵץ designa a madeira como material, não simplesmente uma árvore viva; a expressão mantém a imagem concreta do combustível.
- source_word: בְּעֵץ הַיַּעַר
  choice: entre as árvores da floresta
  rationale: Entende a preposição בְּ em sentido locativo dentro da comparação, situando a madeira da videira entre as árvores da floresta.
- source_word: נְתַתִּיו
  choice: que entreguei
  rationale: “Entreguei” comunica que a madeira foi destinada ao fogo; o referente é a madeira da videira.
- source_word: לָאֵשׁ לְאָכְלָה
  choice: ao fogo para ser consumida
  rationale: Reproduz diretamente a imagem hebraica de algo entregue ao fogo para consumo, isto é, para ser queimado.
- source_word: כֵּן
  choice: assim
  rationale: Marca de forma concisa a segunda parte da comparação.
- source_word: נָתַתִּי
  choice: entreguei
  rationale: Mantém o paralelismo verbal com a madeira entregue ao fogo e apresenta o juízo como decidido.
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  choice: os habitantes de Jerusalém
  rationale: É uma formulação corrente e coletiva para o particípio hebraico, clara ao leitor moderno.
theological_decisions:
- issue: Tradução do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS; o Soberano Senhor
  rationale: A tradução conserva explicitamente o nome pactual representado por יהוה e distingue-o do título אֲדֹנָי, sem substituir nem duplicar “Senhor”.
- issue: Força do perfeito נָתַתִּי no anúncio de juízo
  choice: entreguei
  alternative: entregarei; estou entregando
  rationale: O perfeito hebraico apresenta a entrega como determinada ou consumada. O pretérito preserva essa força sem converter silenciosamente a forma em futuro, embora o contexto profético possa envolver execução ainda em curso ou por vir.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “entreguei” mantém o paralelismo retórico do hebraico; “madeira da videira” preserva a imagem material central do contexto.
