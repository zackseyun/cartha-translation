  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אֶת הָ/אָ֖רֶץ שְׁמָמָ֑ה יַ֚עַן מָ֣עֲלוּ מַ֔עַל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/008.yaml
  text: And I will make the land a desolation[a], because they have acted unfaithfully[b], declares the Lord GOD.
translation:
  language: pt
  text: Farei da terra uma desolação, porque eles cometeram grave infidelidade[a] — declara o Senhor Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cometeram uma infidelidade” ou “agiram de modo infiel”; o verbo e o substantivo da mesma raiz dão ênfase à expressão.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Adonai Yahweh”. Tradicionalmente, o título composto é traduzido como “o Senhor DEUS”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Farei
  rationale: Embora נָתַן signifique literalmente “dar”, “pôr” ou “colocar”, nesta construção com “a terra” e “desolação” expressa o resultado de tornar a terra desolada. “Farei” comunica o sentido idiomático com clareza.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ aqui designa o território submetido ao juízo, não o planeta inteiro. “A terra” preserva a formulação bíblica e é natural em português.
- source_word: שְׁמָמָה
  choice: uma desolação
  rationale: O substantivo indica estado de ruína e devastação. A tradução nominal preserva a forma e a força do hebraico.
- source_word: יַעַן
  choice: porque
  rationale: יַעַן introduz a causa do juízo; “porque” é o conector causal mais claro e direto.
- source_word: מָעֲלוּ מַעַל
  choice: cometeram grave infidelidade
  rationale: A combinação do verbo e do substantivo da mesma raiz intensifica a ideia de quebra de confiança ou deslealdade, frequentemente com dimensão pactual. “Grave infidelidade” conserva essa ênfase sem linguagem arcaica.
- source_word: נְאֻם
  choice: declara
  rationale: A fórmula profética assinala um pronunciamento divino solene. “Declara” é corrente, claro e digno.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: A tradução distingue אֲדֹנָי, “Senhor”, do nome divino יהוה, representado por “Yahweh”, evitando ocultar o nome próprio sob outro título.
theological_decisions:
- issue: Tradução do título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “O Senhor Yahweh” representa separadamente o título אֲדֹנָי e o nome divino יהוה. A forma tradicional “o Senhor DEUS” pode ser informada em nota, mas não substitui o nome presente no texto hebraico.
- issue: Força de מָעֲלוּ מַעַל
  choice: cometeram grave infidelidade
  alternative: agiram de modo infiel
  rationale: A repetição cognata hebraica dá ênfase à transgressão da confiança. “Grave” explicita essa intensificação sem definir de modo excessivamente estreito a natureza da aliança violada.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conservou-se a imagem nominal “uma desolação”, a ênfase da construção cognata hebraica e o nome divino Yahweh.
