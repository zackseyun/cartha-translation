  text: וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בָּ/הֶ֔ם מֵ/הָ/אֵ֣שׁ יָצָ֔אוּ וְ/הָ/אֵ֖שׁ תֹּֽאכְלֵ֑/ם וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/שׂוּמִ֥/י אֶת פָּנַ֖/י בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/007.yaml
  text: And I will set my face against them[a]. They have come out from the fire, but the fire will consume them. Then you will know that I am Yahweh[b], when I set my face against them.
translation:
  language: pt
  text: Voltarei o meu rosto contra eles[a]. Saíram do fogo, mas o fogo os consumirá. Então vocês saberão que eu sou Yahweh, quando eu voltar o meu rosto contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão idiomática hebraica que indica oposição decidida e juízo.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Porei
  rationale: נתן significa literalmente “dar, pôr, colocar”. No idioma com “meu rosto contra eles”, “porei” preserva a ação deliberada e a formulação hebraica.
- source_word: אֶת־פָּנַי בָּהֶם
  choice: o meu rosto contra eles
  rationale: A expressão hebraica indica oposição decidida e juízo. A formulação é compreensível em português e preserva a imagem do original.
- source_word: מֵהָאֵשׁ יָצָאוּ
  choice: Saíram do fogo
  rationale: יצא denota sair. A tradução não acrescenta a ideia de uma fuga bem-sucedida e mantém o contraste com o fogo que ainda os consumirá.
- source_word: וְהָאֵשׁ תֹּאכְלֵם
  choice: mas o fogo os consumirá
  rationale: Com fogo como sujeito, אכל significa consumir ou devorar. “Mas” explicita o contraste contextual sem alterar o sentido.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: A construção tem força consequencial no discurso profético. “Então” comunica o resultado do juízo, e “vocês” oferece legibilidade ampla em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּשׂוּמִי אֶת־פָּנַי בָּהֶם
  choice: quando eu puser o meu rosto contra eles
  rationale: A preposição בְּ com o infinitivo tem valor temporal aqui. A repetição do idioma mantém a moldura retórica do versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva sua função como nome próprio e corresponde de perto à forma hebraica reconstruída.
- issue: Força da expressão “pôr o rosto contra”
  choice: Preservar a imagem no texto principal
  alternative: Eu me oporei a eles; eu me voltarei contra eles
  rationale: A imagem comunica oposição intencional e juízo e possui peso literário no contexto profético. Preservá-la evita reduzir a expressão a uma paráfrase genérica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Mantém-se o paralelismo e a repetição do hebraico. O contraste entre sair do fogo e ainda ser consumido por ele permanece sem identificar se se trata do mesmo fogo ou de outro.
