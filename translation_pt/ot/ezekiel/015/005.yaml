base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
translation:
  language: pt
  text: Eis[a] que, quando estava intacta, não se fazia dela objeto algum. Quanto menos, depois que o fogo a consumiu e ela ficou carbonizada[c], se poderá ainda fazer dela algum objeto?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Veja” ou “Vejam”. A expressão hebraica chama a atenção para o argumento que segue.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico apresenta um argumento do menor para o maior: se a madeira não servia enquanto estava intacta, muito menos servirá depois de queimada.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “chamuscada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Preserva a força de chamar a atenção, em português atual e digno.
- source_word: בִּהְיוֹתוֹ תָמִים
  choice: quando estava inteira
  rationale: A construção é temporal, e תָמִים descreve a madeira intacta antes do dano pelo fogo, não uma qualidade moral.
- source_word: לֹא יֵעָשֶׂה לִמְלָאכָה
  choice: essa madeira não servia para fazer objeto algum
  rationale: 'Exprime o resultado prático do passivo de עשה no contexto: a madeira da videira, mesmo intacta, não podia ser transformada em objeto útil.'
- source_word: אַף כִּי
  choice: Quanto menos agora
  rationale: 'Torna explícito o argumento a fortiori: se a madeira intacta já não servia, depois de queimada servirá menos ainda.'
- source_word: אֵשׁ אֲכָלַתְהוּ
  choice: o fogo a consumiu
  rationale: Verbo natural para a ação destrutiva do fogo, preservando a força do hebraico אכל.
- source_word: וַיֵּחָר
  choice: ela ficou carbonizada
  rationale: Comunica o estado da madeira danificada pelo calor; 'chamuscada' permanece uma alternativa possível.
- source_word: וְנַעֲשָׂה עוֹד לִמְלָאכָה
  choice: poderá ainda servir para fazer algum objeto
  rationale: Mantém עוֹד como 'ainda' e apresenta como exclamação retórica a impossibilidade de uso depois do fogo.
theological_decisions:
- issue: Natureza da imagem
  choice: Manter a referência à madeira sem identificar diretamente Jerusalém ou Judá neste versículo.
  alternative: Inserir no texto principal a interpretação da madeira como Jerusalém/Judá.
  rationale: O versículo formula a comparação em linguagem figurada; o contexto fornece seu referente. A tradução não deve antecipar nem incorporar a interpretação à imagem.
- issue: Força retórica de אַף כִּי
  choice: 'Traduzir como argumento do menor para o maior: ''Quanto menos agora''.'
  alternative: Traduzir apenas como uma sequência temporal, por exemplo, 'depois que'.
  rationale: A construção contrasta a inutilidade da madeira intacta com sua inutilidade ainda maior após ser queimada, preservando a tensão lógica do hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. 'Essa madeira' explicita o referente implícito do contexto imediato, sem inserir a aplicação alegórica. A formulação evita o potencialmente ambíguo 'não foi feita para trabalho' e comunica o uso artesanal pretendido por מְלָאכָה.
