  yaml_path: translation/ot/ezekiel/015/003.yaml
  text: Is wood taken from it to make anything useful? Or do they take from it a peg to hang every kind of vessel on it?[a][b][c]
translation:
  language: pt
  text: Por acaso se tira dela madeira para fazer algum objeto útil[a]? Ou se tira dela um pino[b] para pendurar nele qualquer utensílio[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fazer algo destinado a algum trabalho”. A expressão hebraica enfatiza a utilidade prática.'
    reason: lexical_alternative
  - marker: b
    text: “Pino” também pode ser traduzido por “estaca” ou “prego”; aqui se refere a um suporte fixo no qual se penduram objetos.
    reason: lexical_alternative
  - marker: c
    text: “Utensílio” traduz um termo hebraico amplo, que pode designar objeto, instrumento, artigo ou recipiente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֻקַּח מִמֶּנּוּ עֵץ
  choice: Por acaso se tira dela madeira
  rationale: Mantém a pergunta retórica e a construção passiva/impessoal de לקח. O pronome feminino retoma naturalmente a videira mencionada no contexto, enquanto עֵץ designa aqui a madeira como material.
- source_word: לַעֲשׂוֹת לִמְלָאכָה
  choice: para fazer algum objeto útil
  rationale: A formulação expressa a produção de algo destinado a trabalho ou uso prático; “objeto útil” comunica essa finalidade sem restringir o tipo de artefato.
- source_word: אִם יִקְחוּ
  choice: Ou se tira
  rationale: אִם introduz a segunda pergunta retórica alternativa. A construção impessoal em português preserva o sentido sem introduzir um sujeito indefinido pesado.
- source_word: יָתֵד
  choice: uma estaca
  rationale: יָתֵד pode indicar estaca, pino ou prego. “Estaca” conserva o sentido de uma peça fixa usada como suporte e é clara no contexto.
- source_word: לִתְלוֹת עָלָיו
  choice: para pendurar nela
  rationale: Traduz diretamente a finalidade expressa pelo infinitivo de תלה. O feminino concorda com “estaca” em português.
- source_word: כָּל כֶּלִי
  choice: qualquer utensílio
  rationale: כְּלִי é um termo amplo para utensílio, objeto, instrumento ou recipiente; “qualquer utensílio” preserva tanto a abrangência de כָּל quanto o caráter funcional do substantivo.
