  text: And along the border of Manasseh[a], from the east side to the west side, Ephraim, one portion.
translation:
  language: pt
  text: Ao longo da fronteira de Manassés, desde o lado leste até o lado oeste, Efraim terá uma porção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “Efraim, uma”; pelo contexto, o sentido é “Efraim terá uma porção”.
