lexical_decisions:
- source_word: וְעַל
  choice: Ao longo de
  rationale: A preposição introduz a faixa seguinte em relação à fronteira de Manassés; “ao longo de” preserva com naturalidade o sentido espacial da fórmula.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto da distribuição da terra, o termo designa a linha divisória da porção tribal.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome tribal.
- source_word: מִפְּאַת קָדִימָה
  choice: desde o lado leste
  rationale: A expressão indica a extremidade oriental da faixa; “lado leste” é claro e corrente em português moderno.
- source_word: עַד פְּאַת יָמָּה
  choice: até o lado oeste
  rationale: A expressão completa a extensão de leste a oeste. יָמָּה tem origem na orientação pelo mar, mas aqui significa geograficamente “oeste”.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome tribal.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico traz literalmente “uma”, mas a fórmula de distribuição das terras no capítulo deixa implícito o substantivo “porção”; explicitá-lo produz português inteligível sem acrescentar conteúdo novo.
