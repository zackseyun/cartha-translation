  yaml_path: translation/ot/ezekiel/048/033.yaml
  text: 'On the south side[a], 4,500 cubits by measure, with three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.'
translation:
  language: pt
  text: 'No lado sul, 4.500 côvados[a] de medida, com três portões: um portão de Simeão, um portão de Issacar e um portão de Zebulom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “4.500 de medida”; “côvados” é suprido com base no contexto imediato das dimensões da cidade nesta seção.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/פְאַת נֶגְבָּ/ה
  choice: No lado sul
  rationale: פֵּאָה designa o lado, a borda ou o limite, e נֶגְבָּה indica a direção sul. A formulação é natural em português e a conjunção inicial é absorvida pelo fluxo da descrição.
- source_word: חֲמֵשׁ מֵאוֹת וְ/אַרְבַּעַת אֲלָפִים
  choice: '4.500'
  rationale: O numeral hebraico corresponde a quatro mil e quinhentos; algarismos favorecem a leitura clara de medidas arquitetônicas.
- source_word: מִדָּה
  choice: a medida era de 4.500 côvados
  rationale: מִדָּה expressa medida. A unidade 'côvados' é suprida com base no contexto imediato das dimensões da cidade, sem atribuí-la diretamente à palavra.
- source_word: וּ/שְׁעָרִים שְׁלֹשָׁה
  choice: com três portões
  rationale: A expressão introduz os três portões situados nesse lado; 'com' comunica naturalmente a função descritiva da construção hebraica.
- source_word: שַׁעַר שִׁמְעוֹן אֶחָד
  choice: um portão de Simeão
  rationale: Reproduz os elementos 'portão', nome tribal e 'um' em ordem natural no português.
- source_word: שַׁעַר יִשָּׂשכָר אֶחָד
  choice: um portão de Issacar
  rationale: Mantém o paralelismo da lista e a referência tribal do hebraico.
- source_word: שַׁעַר זְבוּלֻן אֶחָד
  choice: um portão de Zebulom
  rationale: Mantém o paralelismo da lista; 'Zebulom' é a forma portuguesa corrente do nome.
