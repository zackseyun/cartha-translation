  text: And those who serve the city shall serve it from all the tribes of Israel[a][b].
translation:
  language: pt
  text: E os que servem à cidade a servirão, dentre todas as tribos de Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E aquele que serve à cidade a servirá”. O particípio hebraico está no singular, mas pode ter sentido coletivo neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz literalmente “a servirão”, com um sufixo masculino singular. Pelo contexto, a referência é à cidade; por isso, em português usa-se o pronome feminino “a”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹבֵד הָעִיר
  choice: os que servem à cidade
  rationale: O particípio masculino singular com artigo pode ter sentido genérico ou coletivo. O plural em português comunica naturalmente o grupo encarregado de servir à cidade, sem restringir a expressão a um só indivíduo.
- source_word: יַעַבְדֻהוּ
  choice: trabalharão para ela
  rationale: O verbo עבד retoma a mesma raiz do particípio e denota trabalho ou serviço. Esta formulação evita a repetição pouco natural de 'servir... servir' e conserva a ideia de prestar trabalho em benefício da cidade.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: vindos de todas as tribos de Israel
  rationale: A preposição מן indica a procedência dos trabalhadores. A explicitação por 'vindos de' torna essa relação clara e natural em português.
