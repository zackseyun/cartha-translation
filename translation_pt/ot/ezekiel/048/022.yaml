  text: וּ/מֵ/אֲחֻזַּ֤ת הַ/לְוִיִּם֙ וּ/מֵ/אֲחֻזַּ֣ת הָ/עִ֔יר בְּ/ת֛וֹךְ אֲשֶׁ֥ר לַ/נָּשִׂ֖יא יִֽהְיֶ֑ה בֵּ֣ין גְּב֣וּל יְהוּדָ֗ה וּ/בֵין֙ גְּב֣וּל בִּנְיָמִ֔ן לַ/נָּשִׂ֖יא יִהְיֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/022.yaml
  text: And from the property of the Levites and from the property of the city[a], in the midst of what belongs to the prince, between the border of Judah and the border of Benjamin[b], it shall belong to the prince.
translation:
  language: pt
  text: E, a partir da propriedade dos levitas e da propriedade da cidade, no meio do que pertencerá ao príncipe, o que estiver entre o limite de Judá e o limite de Benjamim pertencerá ao príncipe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dentro do que será do príncipe». O hebraico apresenta uma descrição territorial condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחֻזַּת
  choice: propriedade
  rationale: O termo designa uma posse fundiária ou área atribuída. “Propriedade” é claro, atual e adequado ao contexto da distribuição territorial.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação convencional do grupo, preservando o artigo definido do hebraico.
- source_word: הָעִיר
  choice: a cidade
  rationale: Referência direta à cidade e à área que lhe foi atribuída no contexto imediato.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Mantém o sentido espacial de algo situado dentro da área maior destinada ao príncipe.
- source_word: אֲשֶׁר לַנָּשִׂיא יִהְיֶה
  choice: do que pertencerá ao príncipe
  rationale: Expressa de modo natural a relação possessiva do hebraico sem acrescentar uma interpretação específica sobre a natureza dessa porção.
- source_word: נָשִׂיא
  choice: príncipe
  rationale: Preserva o título político característico de Ezequiel e sua distinção em relação ao termo “rei”.
- source_word: בֵּין גְּבוּל יְהוּדָה וּבֵין גְּבוּל בִּנְיָמִן
  choice: entre o limite de Judá e o limite de Benjamim
  rationale: גְּבוּל pode indicar limite ou território; “limite” conserva aqui a imagem espacial das divisas tribais.
- source_word: לַנָּשִׂיא יִהְיֶה
  choice: pertencerá ao príncipe
  rationale: Torna clara em português a atribuição possessiva que encerra enfaticamente o versículo.
theological_decisions:
- issue: Sentido de נָשִׂיא na visão da terra restaurada
  choice: príncipe
  alternative: líder; governante
  rationale: “Príncipe” mantém a distinção lexical de Ezequiel entre esse dirigente e um rei, sem definir além do texto sua identidade política ou messiânica.
- issue: Sintaxe da descrição territorial
  choice: manter a construção espacial condensada no texto principal e registrar a incerteza em nota
  alternative: explicitar que as propriedades estão excluídas da porção do príncipe
  rationale: O hebraico é sintaticamente comprimido, e a função exata da preposição inicial admite mais de uma compreensão. A tradução evita transformar uma possibilidade geográfica em conclusão teológica ou exegética definitiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “príncipe” e “limite” foi mantida para refletir a ênfase e a estrutura do hebraico. A formulação deliberadamente conserva parte da dificuldade sintática do original, esclarecida por nota.
