  naturalness: O texto principal é compreensível em português moderno. A expressão «o que estiver entre» explicita de maneira moderada o referente territorial implícito e ajuda a tornar legível a sintaxe comprimida.
  terminology: «Propriedade», «levitas», «cidade», «limite» e «príncipe» são escolhas adequadas. «Príncipe» preserva corretamente o título נשיא, sem identificar o personagem além do que o texto permite.
