  text: פְּאַת יָ֗מָּ/ה חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים שַֽׁעֲרֵי/הֶ֖ם שְׁלֹשָׁ֑ה שַׁ֣עַר גָּ֞ד אֶחָ֗ד שַׁ֤עַר אָשֵׁר֙ אֶחָ֔ד שַׁ֥עַר נַפְתָּלִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/034.yaml
  text: 'On the west side[a], four thousand five hundred, with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali[b], one.'
translation:
  language: pt
  text: 'No lado oeste, quatro mil e quinhentos[a], com suas três portas[b]: uma porta de Gade, uma porta de Aser e uma porta de Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: «quinhentos e quatro mil».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «suas portas: três». O hebraico usa uma fórmula de enumeração sem verbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת יָמָּה
  choice: No lado oeste
  rationale: פְּאַת indica lado, extremidade ou limite, e יָמָּה é a direção oeste, literalmente «em direção ao mar». No contexto dos lados da cidade, «No lado oeste» é claro e natural.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatro mil e quinhentos
  rationale: O hebraico apresenta literalmente «quinhentos e quatro mil», mas o valor numérico é 4.500; a ordem portuguesa usual comunica esse valor sem ambiguidade.
- source_word: שַׁעֲרֵיהֶם שְׁלֹשָׁה
  choice: com seus três portões
  rationale: A expressão é uma fórmula nominal, sem verbo expresso. Esta tradução liga naturalmente os três portões ao lado mencionado e conserva o pronome possessivo plural.
- source_word: שַׁעַר גָּד אֶחָד
  choice: o portão de Gade, um
  rationale: Mantém a estrutura enumerativa «portão + nome tribal + um» do hebraico.
- source_word: שַׁעַר אָשֵׁר אֶחָד
  choice: o portão de Aser, um
  rationale: Preserva de modo consistente a fórmula enumerativa hebraica e usa a forma portuguesa tradicional do nome tribal.
- source_word: שַׁעַר נַפְתָּלִי אֶחָד
  choice: o portão de Naftali, um
  rationale: Preserva de modo consistente a fórmula enumerativa hebraica e usa uma forma portuguesa amplamente reconhecível do nome tribal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe principal é natural, mas a repetição «o portão de..., um» conserva deliberadamente o ritmo formal da lista hebraica. Os marcadores das notas foram colocados junto às expressões a que efetivamente se referem.
