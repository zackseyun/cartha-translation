base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/006.yaml
  text: And along the border of Ephraim[a], from the east side to the west side, Reuben[b], one portion.
translation:
  language: pt
  text: Ao longo da fronteira de Efraim, desde o lado leste até o lado oeste[a], Rúben terá uma porção.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “até o lado do mar”. “Mar” é a maneira hebraica usual de indicar o oeste.'
    reason: cultural_note
  - marker: b
    text: Literalmente, “Rúben, uma”. O termo “porção” está implícito no contexto das divisões territoriais deste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Ao longo de
  rationale: Neste contexto de distribuição territorial, עַל indica posição junto a uma linha de fronteira. “Ao longo de” expressa com naturalidade a relação espacial; o waw é integrado à sequência do texto sem exigir um “e” inicial em português.
- source_word: גְּבוּל
  choice: fronteira
  rationale: גְּבוּל designa aqui a linha divisória entre os territórios tribais. “Fronteira” é clara e idiomática em português.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: מִפְּאַת קָדִים
  choice: desde o lado leste
  rationale: פֵּאָה significa lado, extremidade ou limite, e קָדִים indica o leste. A formulação preserva a expressão geográfica recorrente do capítulo.
- source_word: וְעַד פְּאַת יָמָּה
  choice: até o lado oeste
  rationale: יָם significa literalmente “mar”, mas é também o termo hebraico convencional para “oeste”. Neste contexto geográfico, a direção é o sentido pretendido.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico traz apenas “uma”, em construção elíptica. O contexto do capítulo mostra que se trata de uma porção territorial destinada a uma tribo; o substantivo foi explicitado para produzir português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação geográfica natural. O verbo “terá” e o substantivo “porção” explicitam a construção nominal e elíptica do hebraico sem alterar o sentido da distribuição territorial.
