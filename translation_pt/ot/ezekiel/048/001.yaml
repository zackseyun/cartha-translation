source:
  edition: WLC
  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הַ/שְּׁבָטִ֑ים מִ/קְצֵ֣ה צָפ֡וֹנָ/ה אֶל יַ֣ד דֶּֽרֶךְ חֶתְלֹ֣ן לְֽבוֹא חֲמָ֡ת חֲצַ֣ר עֵינָן֩ גְּב֨וּל דַּמֶּ֤שֶׂק צָפ֨וֹנָ/ה֙ אֶל יַ֣ד חֲמָ֔ת וְ/הָיוּ ל֧/וֹ פְאַת קָדִ֛ים הַ/יָּ֖ם דָּ֥ן אֶחָֽד־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/001.yaml
  text: 'These are the names of the tribes: from the northern extremity[a], beside the way of Hethlon to Lebo-hamath, Hazar-enan, at the border of Damascus northward beside Hamath, and extending from the east side to the sea, Dan[b], one portion.'
translation:
  language: pt
  text: 'Estes são os nomes das tribos: desde a extremidade norte, junto ao caminho de Hetlom, até Lebo-Hamate[a], e Hazar-Enã, na fronteira de Damasco, ao norte, junto a Hamate: Dã terá uma porção que se estenderá do lado leste até o mar.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lebo-Hamate” é tradicionalmente entendido como nome de lugar; em sentido literal, a expressão pode significar “a entrada de Hamate”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta oração é condensado e também pode ser traduzido: “e seu lado irá do leste até o mar: Dã, uma porção”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: Introduz diretamente a lista, sem acrescentar um marcador temporal ausente no hebraico; a conjunção pode ficar implícita em português.
- source_word: שְׁמוֹת הַשְּׁבָטִים
  choice: os nomes das tribos
  rationale: Reproduz com clareza a cadeia construta e emprega o termo consagrado para as divisões de Israel.
- source_word: מִקְצֵה צָפוֹנָה
  choice: desde a extremidade norte
  rationale: קָצֶה designa a ponta ou extremidade; a formulação conserva o estilo de descrição territorial.
- source_word: אֶל יַד דֶּרֶךְ חֶתְלֹן
  choice: junto ao caminho de Hetlom
  rationale: אֶל יַד expressa adjacência, e דֶּרֶךְ pode designar caminho ou estrada; a tradução permanece próxima da fórmula topográfica.
- source_word: לְבוֹא חֲמָת
  choice: até Lebo-Hamate
  rationale: A expressão, literalmente relacionada à entrada de Hamate, funciona provavelmente como topônimo nesta lista geográfica; a preposição 'até' torna natural o traçado da fronteira.
- source_word: חֲצַר עֵינָן
  choice: Hazar-Enã
  rationale: Transliteração do topônimo em forma legível em português.
- source_word: גְּבוּל דַּמֶּשֶׂק צָפוֹנָה אֶל יַד חֲמָת
  choice: na fronteira de Damasco, ao norte, junto a Hamate
  rationale: Mantém a relação geográfica e a sequência do hebraico sem decidir de modo excessivo se 'ao norte' modifica Damasco ou o traçado da fronteira.
- source_word: וְהָיוּ לוֹ פְאַת קָדִים הַיָּם
  choice: estendendo-se do lado leste até o mar
  rationale: A oração hebraica é comprimida; a formulação comunica o alcance leste-oeste da faixa territorial sem esconder a dificuldade sintática.
- source_word: דָּן אֶחָד
  choice: Dã terá uma porção
  rationale: אֶחָד é elíptico no contexto da distribuição territorial. 'Uma porção' explicita apenas o substantivo exigido pelo sentido, e 'terá' conecta naturalmente a tribo à faixa descrita.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas toponímicas de boa legibilidade brasileira. A sintaxe foi levemente reorganizada para tornar compreensível a descrição de fronteira, mantendo a ambiguidade geográfica e assinalando em notas as duas principais dificuldades do hebraico.
