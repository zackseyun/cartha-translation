  text: וּ֠/לְ/אֵ֜לֶּה תִּהְיֶ֣ה תְרֽוּמַת הַ/קֹּדֶשׁ֮ לַ/כֹּֽהֲנִים֒ צָפ֜וֹנָ/ה חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים אֶ֗לֶף וְ/יָ֨מָּ/ה֙ רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/קָדִ֗ימָ/ה רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/נֶ֕גְבָּ/ה אֹ֕רֶךְ חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וְ/הָיָ֥ה מִקְדַּשׁ יְהוָ֖ה בְּ/תוֹכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/010.yaml
  text: 'And for these[a], the holy contribution shall belong to the priests: on the north, twenty-five thousand in length; on the west, ten thousand in width; on the east, ten thousand in width; and on the south, twenty-five thousand in length[b]; and the sanctuary of Yahweh shall be in its midst.'
translation:
  language: pt
  text: 'E, para estes — os sacerdotes —, será a porção sagrada: ao norte, vinte e cinco mil de comprimento; a oeste, dez mil de largura; a leste, dez mil de largura; e ao sul, vinte e cinco mil de comprimento; e o santuário de Yahweh ficará no meio dela.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: E para estes
  rationale: O לְ indica destinação ou atribuição, e o demonstrativo retoma os sacerdotes mencionados no contexto anterior; a expressão preserva a referência textual sem explicitá-la além do hebraico.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: a porção sagrada
  rationale: תְּרוּמָה designa aqui uma parcela de terra separada para uso sagrado, não apenas uma oferta móvel; 'porção sagrada' comunica naturalmente o sentido territorial e cultual.
- source_word: לַכֹּהֲנִים
  choice: destinada aos sacerdotes
  rationale: O dativo marca os destinatários da porção; 'destinada aos sacerdotes' expressa com clareza a atribuição.
- source_word: צָפוֹנָה ... וְיָמָּה ... וְקָדִימָה ... וְנֶגְבָּה
  choice: ao norte ... a oeste ... a leste ... ao sul
  rationale: Os direcionais descrevem os quatro lados da área; a formulação é idiomática e coerente em português.
- source_word: רֹחַב / אֹרֶךְ
  choice: largura / comprimento
  rationale: Os termos contrastantes descrevem as dimensões da parcela. No lado norte, 'comprimento' é suprido pelo paralelismo com o lado sul para tornar a medida clara em português.
- source_word: מִקְדַּשׁ יְהוָה
  choice: o santuário de Yahweh
  rationale: מִקְדָּשׁ é o santuário ou lugar santo, e o nome divino יהוה é transliterado como 'Yahweh', preservando-o como nome próprio.
- source_word: בְּתוֹכוֹ
  choice: no meio dela
  rationale: O sufixo masculino singular retoma semanticamente a área ou porção descrita; o feminino em português concorda naturalmente com 'porção'.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título, sem introduzir uma interpretação denominacional.
- issue: Natureza de תְּרוּמַת הַקֹּדֶשׁ
  choice: porção sagrada
  alternative: oferta sagrada; distrito sagrado; contribuição santa
  rationale: No contexto da divisão territorial de Ezequiel, trata-se de terra separada para uso sagrado. 'Porção' mantém o caráter de atribuição sem reduzir o termo a uma oferta cultual comum.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura solene da descrição territorial, mas emprega vocabulário corrente. As unidades não são especificadas no hebraico deste versículo e, por isso, não foram acrescentadas.
