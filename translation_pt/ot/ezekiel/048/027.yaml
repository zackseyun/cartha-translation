  yaml_path: translation/ot/ezekiel/048/027.yaml
  text: And along the border of Zebulun[a], from the east side to the west side, Gad, one portion.
translation:
  language: pt
  text: Junto à fronteira de Zebulom, desde o lado leste até o lado oeste, Gade terá uma porção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Gade, um”. A palavra “porção” é suprida com base na fórmula de distribuição repetida ao longo do capítulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Junto a
  rationale: Na fórmula de distribuição territorial, עַל introduz a faixa tribal situada ao lado da fronteira anterior; “junto a” expressa essa relação espacial com naturalidade em português.
- source_word: גְּבוּל
  choice: fronteira
  rationale: גְּבוּל designa aqui a linha divisória entre territórios; “fronteira” é claro e adequado à sequência geográfica do capítulo.
- source_word: זְבוּלֻן
  choice: Zebulom
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: מִ/פְּאַת קָדִימָה
  choice: desde o lado leste
  rationale: פֵּאָה indica lado ou extremidade, e קָדִימָה aponta para o leste. “Desde o lado leste” marca com clareza o início da extensão.
- source_word: עַד פְּאַת יָמָּה
  choice: até o lado oeste
  rationale: A expressão delimita a extensão até a extremidade ocidental; יָמָּה, literalmente na direção do mar, tem aqui o sentido geográfico de oeste.
- source_word: גָּד
  choice: Gade
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: אֶחָד
  choice: terá uma porção
  rationale: O hebraico traz apenas “um”, numa fórmula elíptica. O contexto repetido das distribuições tribais permite explicitar “porção”; “terá” torna a construção natural em português sem alterar a relação de atribuição.
