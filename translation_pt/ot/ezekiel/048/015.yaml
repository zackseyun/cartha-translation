  text: וַ/חֲמֵ֨שֶׁת אֲלָפִ֜ים הַ/נּוֹתָ֣ר בָּ/רֹ֗חַב עַל פְּנֵ֨י חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף חֹֽל ה֣וּא לָ/עִ֔יר לְ/מוֹשָׁ֖ב וּ/לְ/מִגְרָ֑שׁ וְ/הָיְתָ֥ה הָ/עִ֖יר ב/תוכ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/015.yaml
  text: And the remaining five thousand in width[a], along the face of the twenty-five thousand, shall be common land for the city, for dwelling, and for open land[c][b]; and the city shall be in its midst.
translation:
  language: pt
  text: A faixa restante de cinco mil de largura, ao longo dos vinte e cinco mil[a], será área comum[b] para a cidade, para moradia e para terreno aberto[c]; e a cidade ficará no meio dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto aos vinte e cinco mil”. A expressão hebraica significa literalmente “sobre a face de” e pode indicar, de maneiras próximas, a extensão de uma faixa de terra ao longo de outra.'
    reason: lexical_alternative
  - marker: b
    text: “Área comum” traduz um termo hebraico que indica terra não santa ou não consagrada, em contraste com as porções consagradas ao redor.
    reason: cultural_note
  - marker: c
    text: “Terreno aberto” pode indicar a terra ao redor da cidade destinada ao uso comum, possivelmente incluindo pastagens.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: restantes
  rationale: O particípio indica o que sobra depois das porções já distribuídas; “restantes” preserva de modo natural o sentido de remanescente.
- source_word: בָּרֹחַב
  choice: na largura
  rationale: רֹחַב designa largura ou dimensão transversal, apropriada ao contexto de medição territorial.
- source_word: עַל־פְּנֵי
  choice: ao longo dos
  rationale: A expressão espacial, literalmente “sobre/diante da face de”, indica aqui extensão junto ao lado da faixa de vinte e cinco mil, sem definir além do necessário a geometria exata.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: os vinte e cinco mil
  rationale: A expressão retoma a medida mencionada no contexto. A unidade não é repetida no hebraico e, por isso, não foi acrescentada ao texto principal.
- source_word: חֹל
  choice: área comum
  rationale: O termo contrasta com território santo ou consagrado. “Área comum” comunica o caráter não sagrado sem a conotação depreciativa que “profano” pode ter em português.
- source_word: לָעִיר
  choice: para a cidade
  rationale: A preposição marca destinação ou alocação, sem exigir uma interpretação administrativa mais específica.
- source_word: לְמוֹשָׁב
  choice: destinada a moradia
  rationale: מוֹשָׁב pode indicar habitação ou assentamento; “moradia” expressa com clareza a função residencial.
- source_word: וּלְמִגְרָשׁ
  choice: e a campo aberto
  rationale: מִגְרָשׁ designa terreno aberto ao redor de uma povoação, às vezes usado como pastagem. “Campo aberto” mantém essa amplitude.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: A expressão indica o interior ou centro da área; o pronome feminino retoma naturalmente “área” em português.
