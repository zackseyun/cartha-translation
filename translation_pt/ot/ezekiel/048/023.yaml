  text: וְ/יֶ֖תֶר הַ/שְּׁבָטִ֑ים מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה בִּנְיָמִ֥ן אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/023.yaml
  text: 'And for the rest of the tribes: from the eastern side to the western side[a], Benjamin, one portion.'
translation:
  language: pt
  text: 'Quanto ao restante das tribos: desde o lado leste até o lado oeste, Benjamim terá uma porção.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Benjamim, um”. “Terá uma porção” foi suprido porque, ao longo do capítulo, “um” é usado de modo elíptico para indicar uma porção territorial destinada a uma tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר הַשְּׁבָטִים
  choice: Quanto ao restante das tribos
  rationale: Introduz a nova seção relativa às tribos ainda não mencionadas, preservando o valor do conectivo e expressando com naturalidade a ideia de restante.
- source_word: מִפְּאַת קָדִימָה
  choice: desde o lado leste
  rationale: פֵּאָה pode indicar lado, extremidade ou limite; aqui a fórmula territorial aponta para o lado oriental.
- source_word: עַד פְּאַת יָמָּה
  choice: até o lado oeste
  rationale: יָם, com direção, designa o oeste, literalmente o lado do mar; a tradução explicita a orientação geográfica.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico diz literalmente 'um', usado de modo elíptico no capítulo para uma faixa ou porção territorial. O verbo 'terá' e o substantivo 'porção' são supridos para produzir uma frase portuguesa clara.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A formulação preserva a estrutura sucinta da lista territorial, esclarecendo apenas a elipse hebraica.
