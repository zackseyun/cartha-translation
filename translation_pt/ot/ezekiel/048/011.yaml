source:
  edition: WLC
  text: לַ/כֹּהֲנִ֤ים הַֽ/מְקֻדָּשׁ֙ מִ/בְּנֵ֣י צָד֔וֹק אֲשֶׁ֥ר שָׁמְר֖וּ מִשְׁמַרְתִּ֑/י אֲשֶׁ֣ר לֹֽא תָע֗וּ בִּ/תְעוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֥ר תָּע֖וּ הַ/לְוִיִּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/011.yaml
  text: It shall be for the priests who are consecrated from the sons of Zadok[a], who kept my charge, who did not go astray when the sons of Israel went astray[c][b], as the Levites went astray.
translation:
  language: pt
  text: Será destinada aos sacerdotes consagrados dentre os descendentes de Zadoque[a], os quais cumpriram o encargo que lhes confiei[b] e não se desviaram quando os filhos de Israel se desviaram[c], como os levitas se desviaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dentre os filhos de Zadoque”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão indica que eles desempenharam fielmente a responsabilidade que Deus lhes havia confiado, especialmente no serviço sacerdotal.
    reason: cultural_note
  - marker: c
    text: 'Ou: “quando o povo de Israel se desviou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּהֲנִים
  choice: destinada aos sacerdotes
  rationale: O ל prefixado indica destinação ou atribuição no contexto da distribuição da terra. A forma feminina de «destinada» retoma naturalmente a porção mencionada no contexto imediato.
- source_word: הַמְקֻדָּשׁ
  choice: que são consagrados
  rationale: O particípio passivo de קדשׁ indica pessoas separadas para serviço sagrado. A oração relativa preserva a construção pós-nominal hebraica e expressa claramente o sentido cultual.
- source_word: מִבְּנֵי צָדוֹק
  choice: dentre os descendentes de Zadoque
  rationale: «Descendentes» comunica em português atual a linhagem expressa pelo idioma hebraico «filhos de», enquanto «dentre» indica que esses sacerdotes procedem desse grupo.
- source_word: שָׁמְרוּ מִשְׁמַרְתִּי
  choice: cumpriram o encargo que lhes confiei
  rationale: A expressão descreve o desempenho fiel de uma responsabilidade confiada por Deus, especialmente no serviço sacerdotal. Esta formulação evita a pouco natural tradução literal «guardaram a minha guarda».
- source_word: לֹא תָעוּ
  choice: não se desviaram
  rationale: Neste contexto, תעה designa desvio moral e cultual, não simples deslocamento físico.
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל
  choice: quando os filhos de Israel se desviaram
  rationale: A preposição ב com o infinitivo construto marca a circunstância temporal. «Filhos de Israel» mantém a expressão de linhagem coletiva do hebraico, com uma alternativa idiomática indicada em nota.
- source_word: כַּאֲשֶׁר תָּעוּ הַלְוִיִּם
  choice: como fizeram os levitas
  rationale: כַּאֲשֶׁר introduz comparação. «Fizeram» retoma sem repetição pesada o verbo «se desviaram» e mantém o contraste entre os descendentes de Zadoque e os levitas.
theological_decisions:
- issue: Linhagem sacerdotal e fidelidade na visão do templo
  choice: O texto identifica sacerdotes consagrados dentre os descendentes de Zadoque e associa sua porção tanto à linhagem quanto à fidelidade no serviço confiado por Deus.
  alternative: Realçar dinamicamente apenas a recompensa pela lealdade, sem explicitar a linhagem sacerdotal.
  rationale: O hebraico menciona expressamente tanto a descendência de Zadoque quanto o cumprimento fiel do encargo divino. A tradução conserva os dois elementos sem projetar sobre eles uma doutrina sacerdotal posterior.
- issue: Referente da comparação final
  choice: «Como fizeram os levitas» retoma o ato de se desviar.
  alternative: «Como os levitas se desviaram», repetindo integralmente o verbo.
  rationale: Ambas as formas expressam a mesma comparação do hebraico. A escolha evita repetição excessiva sem atenuar a afirmação sobre o desvio dos levitas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. «Zadoque» segue a forma bíblica portuguesa corrente. A oração «que são consagrados» conserva a qualificação pós-nominal do hebraico; «encargo que lhes confiei» comunica com naturalidade a responsabilidade cultual. Todos os marcadores de nota aparecem no texto em ordem alfabética.
