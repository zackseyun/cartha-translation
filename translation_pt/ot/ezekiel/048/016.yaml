  text: וְ/אֵלֶּה֮ מִדּוֹתֶי/הָ֒ פְּאַ֣ת צָפ֗וֹן חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים וּ/פְאַת נֶ֕גֶב חֲמֵ֥שׁ חמש מֵא֖וֹת וְ/אַרְבַּ֣עַת אֲלָפִ֑ים וּ/מִ/פְּאַ֣ת קָדִ֗ים חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים וּ/פְאַת יָ֕מָּ/ה חֲמֵ֥שׁ מֵא֖וֹת וְ/אַרְבַּ֥עַת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/016.yaml
  text: 'And these are its measurements: the north side[a], four thousand five hundred; and the south side, four thousand five hundred; and from the east side, four thousand five hundred; and the west side, four thousand five hundred.'
translation:
  language: pt
  text: 'Estas são as suas medidas: o lado norte[a], quatro mil e quinhentos; o lado sul, quatro mil e quinhentos; do lado leste, quatro mil e quinhentos; e o lado oeste, quatro mil e quinhentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “quinhentos e quatro mil” em cada lado; a ordem foi invertida para seguir a forma usual de expressar números em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹתֶיהָ
  choice: suas medidas
  rationale: Refere-se às extensões medidas da cidade no contexto; “medidas” é claro, natural e mantém a referência feminina implícita a ela.
- source_word: פְּאַת
  choice: lado
  rationale: Neste contexto de demarcação, o termo designa cada lado ou limite da cidade; “lado” é a opção mais direta em português.
- source_word: צָפוֹן
  choice: norte
  rationale: Indica o ponto cardeal correspondente ao lado norte da cidade.
- source_word: נֶגֶב
  choice: sul
  rationale: Aqui funciona como direção cardinal em paralelo com norte, leste e oeste, não como o nome regional Neguebe.
- source_word: מִפְּאַת קָדִים
  choice: do lado leste
  rationale: A contração “do” conserva de modo natural a preposição hebraica מִן presente apenas nesta expressão, sem tornar a frase excessivamente rígida.
- source_word: קָדִים
  choice: leste
  rationale: Termo direcional que identifica o lado oriental.
- source_word: יָמָּה
  choice: oeste
  rationale: Embora relacionado literalmente ao mar, neste uso cardinal indica o oeste; a tradução direta evita obscuridade para leitores modernos.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatro mil e quinhentos
  rationale: Expressa o mesmo valor na ordem numérica normal do português; a medida é repetida para os quatro lados.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura enumerativa próxima do hebraico. A unidade de medida não é acrescentada, pois também não aparece explicitamente neste versículo.
