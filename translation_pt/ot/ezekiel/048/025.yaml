  text: וְ/עַ֣ל גְּב֣וּל שִׁמְע֗וֹן מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה יִשָׂשכָ֥ר אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
translation:
  language: pt
  text: 'E ao longo da fronteira de Simeão, desde o lado leste até o lado oeste[a], Issacar: uma porção.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “lado do mar”. Aqui, “mar” é o termo hebraico convencional para “oeste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Ao longo de
  rationale: No contexto da distribuição territorial, a expressão introduz a faixa contígua à anterior. “Ao longo de” comunica naturalmente sua relação com a fronteira.
- source_word: גְּבוּל
  choice: fronteira
  rationale: O substantivo designa a linha divisória do território tribal; “fronteira” expressa esse sentido sem ampliá-lo para todo o território.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome tribal.
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: desde o lado leste
  rationale: A expressão indica o ponto inicial no extremo oriental. A formulação é clara e combina com o paralelismo geográfico seguinte.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: até o lado oeste
  rationale: Embora יָם signifique literalmente “mar”, na linguagem geográfica hebraica designa com frequência o oeste. A tradução explicita a direção pretendida e registra o sentido literal em nota.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome tribal.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico traz literalmente “um/uma”, numa fórmula elíptica. “Porção” é suprido pelo contexto imediato das faixas territoriais e torna a frase compreensível sem determinar além do necessário a forma da área.
theological_decisions: []
translation_notes:
  register: 'Português atual, digno e acessível, com a concisão cadastral do original preservada por meio dos dois-pontos em “Issacar: uma porção”. O conectivo inicial não foi vertido isoladamente como “E”, pois a sequência e a continuidade já são expressas com naturalidade por “Ao longo”; não há implicação teológica nessa opção.'
