  text: זֹ֥את הָ/אָ֛רֶץ אֲשֶׁר תַּפִּ֥ילוּ מִֽ/נַּחֲלָ֖ה לְ/שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וְ/אֵ֨לֶּה֙ מַחְלְקוֹתָ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/029.yaml
  text: This is the land that you shall assign as an inheritance to the tribes of Israel[a], and these are their portions, declares the Lord GOD.
translation:
  language: pt
  text: Esta é a terra que vocês distribuirão como herança às tribos de Israel; estas são as suas porções[a] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as divisões delas” ou “os lotes delas”; “porções” refere-se às partes de terra atribuídas às tribos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: Esta é a terra
  rationale: O demonstrativo introduz uma declaração resumitiva; em português, a cópula torna a frase natural.
- source_word: תַּפִּילוּ
  choice: vocês distribuirão
  rationale: O hifil de נפל, no contexto da repartição territorial, designa a atribuição ou distribuição de lotes, e não uma queda literal.
- source_word: מִנַּחֲלָה
  choice: como herança
  rationale: נַחֲלָה refere-se a uma propriedade recebida por herança ou a uma parte territorial atribuída; a expressão portuguesa comunica sua função na distribuição da terra.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: entre as tribos de Israel
  rationale: Embora a preposição possa ser vertida por “às”, “distribuir entre” é idiomático em português e expressa com clareza a repartição entre os destinatários.
- source_word: מַחְלְקוֹתָם
  choice: as porções delas
  rationale: O termo indica as partes ou lotes territoriais resultantes da divisão; “porções” é claro e mantém o sentido distributivo.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente natural da fórmula profética que autentica a palavra como pronunciamento divino.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Preserva os dois elementos do título hebraico: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”.'
theological_decisions:
- issue: Forma do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS; o Soberano Yahweh
  rationale: A tradução mantém explicitamente o nome da aliança e distingue-o do título אֲדֹנָי, sem substituir יהוה por um título nem interpretar אֲדֹנָי como “Soberano”.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. O ponto e vírgula conserva a relação estreita entre a declaração resumitiva e a identificação final das partes territoriais.
