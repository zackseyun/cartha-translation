  rationale: Reproduz com clareza a fórmula geográfica que indica toda a extensão da faixa de leste a oeste.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida em português para o nome tribal.
- source_word: אֶחָד
  choice: receberá uma porção
  rationale: O hebraico traz literalmente apenas «Manassés, um», numa fórmula elíptica de distribuição territorial. O verbo e o substantivo são explicitados para produzir português natural, sem acrescentar conteúdo contextual novo.
