base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/013.yaml
  text: And alongside the territory of the priests[a], the Levites shall have twenty-five thousand cubits in length and ten thousand in width. The whole length shall be twenty-five thousand, and the width ten thousand.
translation:
  language: pt
  text: Ao lado do território dos sacerdotes, os levitas terão uma área de vinte e cinco mil côvados de comprimento e dez mil de largura.[a] O comprimento total será de vinte e cinco mil côvados, e a largura, de dez mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “vinte e cinco mil” e “dez mil”; a unidade “côvados” é suprida com base no contexto das medidas em Ezequiel 48.
    reason: cross_reference
lexical_decisions:
- source_word: לְעֻמַּת
  choice: ao lado de
  rationale: No contexto da distribuição territorial, indica correspondência espacial e adjacência à área dos sacerdotes; “ao lado de” é natural e claro em português.
- source_word: גְּבוּל
  choice: território
  rationale: Embora possa significar “limite” ou “fronteira”, aqui designa por metonímia a área delimitada destinada aos sacerdotes.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português usual para o plural hebraico neste contexto cultual e territorial.
- source_word: וְהַלְוִיִּם
  choice: os levitas terão uma área
  rationale: A construção hebraica é elíptica e não tem verbo expresso. O contexto trata da concessão de terras; a formulação explicita isso de modo natural sem alterar o sentido.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: vinte e cinco mil côvados
  rationale: O hebraico traz apenas o número, sem repetir a unidade. “Côvados” é suprido a partir do contexto das medidas territoriais do capítulo e sua ausência no original é indicada em nota.
- source_word: אֹרֶךְ
  choice: de comprimento
  rationale: Expressa com naturalidade a dimensão longitudinal da área.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: e dez mil de largura
  rationale: Mantém o paralelismo dimensional do hebraico em ordem idiomática portuguesa.
- source_word: כָּל אֹרֶךְ
  choice: O comprimento total
  rationale: Reproduz a recapitulação da medida longitudinal; “total” comunica de forma natural o valor de כָּל nesta construção.
