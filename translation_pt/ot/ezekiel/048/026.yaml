id: EZK.48.26
reference: Ezekiel 48:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל יִשָׂשכָ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה זְבוּלֻ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/026.yaml
  text: And along the border of Issachar[a], from the east side to the west side, Zebulun[b], one portion.
translation:
  language: pt
  text: 'E junto à fronteira de Issacar, desde o lado leste até o lado oeste[a], Zebulom: uma porção[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “lado do mar”; nesse uso geográfico, a expressão indica o oeste.
    reason: cultural_note
  - marker: b
    text: O hebraico traz apenas “uma”; “porção” é suprido com base na fórmula de distribuição de terras repetida neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: E junto a
  rationale: A conjunção e a preposição dão continuidade à sequência das faixas territoriais e situam esta porção junto à fronteira anterior.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto da divisão da terra, designa a linha limítrofe da porção de Issacar.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: מִפְּאַת קָדִימָה
  choice: desde o lado leste
  rationale: פֵּאָה indica lado ou extremidade, e קָדִימָה indica a direção leste; a formulação é clara e natural em português.
- source_word: עַד פְּאַת יָמָּה
  choice: até o lado oeste
  rationale: עַד marca o limite da extensão, enquanto יָמָּה, literalmente associado ao mar, funciona aqui como indicação geográfica do oeste.
- source_word: זְבוּלֻן
  choice: Zebulom
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico traz apenas “um/uma”, mas “porção” está elíptico na fórmula repetida de distribuição territorial do capítulo; explicitá-lo produz português inteligível sem alterar o sentido.
