lexical_decisions:
- source_word: וְ/עַל
  choice: Ao longo de
  rationale: Introduz a faixa seguinte na sequência e indica sua posição junto à fronteira de Dã; a formulação é natural em português.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto da divisão da terra, designa a linha que delimita o território.
- source_word: דָּן
  choice: Dã
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: מִ/פְּאַת קָדִים
  choice: desde o lado leste
  rationale: Preserva a ideia de lado ou extremidade e expressa claramente a orientação oriental.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: até o lado oeste
  rationale: Aqui, 'mar' funciona como termo direcional para oeste; a tradução comunica diretamente o sentido geográfico.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: אֶחָד
  choice: uma porção
  rationale: O numeral é elíptico neste contexto e se refere a uma das porções territoriais; o substantivo é explicitado para clareza.
