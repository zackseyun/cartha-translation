  text: וְ/הַ/נּוֹתָ֨ר בָּ/אֹ֜רֶךְ לְ/עֻמַּ֣ת תְּרוּמַ֣ת הַ/קֹּ֗דֶשׁ עֲשֶׂ֨רֶת אֲלָפִ֤ים קָדִ֨ימָ/ה֙ וַ/עֲשֶׂ֤רֶת אֲלָפִים֙ יָ֔מָּ/ה וְ/הָיָ֕ה לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ וְ/הָיְתָ֤ה תבואת/ה לְ/לֶ֔חֶם לְ/עֹבְדֵ֖י הָ/עִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/018.yaml
  text: And the remainder along the length[a], corresponding to the holy contribution, shall be ten thousand to the east and ten thousand to the west; it shall correspond to the holy contribution[b], and its produce shall be for food for the workers of the city.
translation:
  language: pt
  text: E a área restante, ao longo do comprimento, junto à contribuição sagrada, terá dez mil para o leste e dez mil para o oeste[a]. Ela ficará junto à contribuição sagrada, e sua produção servirá de alimento[b] para os trabalhadores da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, a expressão traduzida como “para o oeste” significa literalmente “em direção ao mar”, modo comum de indicar o oeste.
    reason: lexical_alternative
  - marker: b
    text: Ou “de pão”. Aqui, “pão” provavelmente se refere às provisões alimentares em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: E a área restante
  rationale: O termo designa aquilo que sobra depois das divisões anteriores; explicitar “área” torna natural a referência ao terreno sem acrescentar uma nova entidade ao texto.
- source_word: בָּאֹרֶךְ
  choice: ao longo do comprimento
  rationale: Conserva a dimensão longitudinal da faixa de terra e a linguagem de medição do contexto.
- source_word: לְעֻמַּת
  choice: paralela a
  rationale: No contexto de demarcação, indica alinhamento ou correspondência espacial. “Paralela a” comunica isso com clareza e pode ser repetido como no hebraico.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: a contribuição sagrada
  rationale: Preserva o sentido de uma porção separada e apresentada ou reservada, bem como a terminologia própria de תרומה, sem reduzi-la a uma simples divisão territorial.
- source_word: עֲשֶׂרֶת אֲלָפִים קָדִימָה
  choice: dez mil para o leste
  rationale: Mantém o número sem suprir uma unidade ausente neste versículo e expressa naturalmente a direção oriental.
- source_word: וַעֲשֶׂרֶת אֲלָפִים יָמָּה
  choice: e dez mil para o oeste
  rationale: ימה significa literalmente “em direção ao mar”, expressão direcional hebraica que, neste contexto geográfico, indica o oeste.
- source_word: וְהָיְתָה תבואתה
  choice: e sua produção servirá
  rationale: תבואה é a produção ou rendimento agrícola da terra. “Servirá” expressa de modo natural a finalidade marcada na continuação.
- source_word: לְלֶחֶם
  choice: de alimento
  rationale: Embora לֶחֶם possa significar literalmente “pão”, também designa alimento ou provisão em sentido mais amplo, adequado à produção agrícola destinada aos trabalhadores.
- source_word: לְעֹבְדֵי הָעִיר
  choice: para os trabalhadores da cidade
  rationale: O particípio de עבד refere-se aos que trabalham ou prestam serviço ligado à cidade, sem exigir aqui um sentido especificamente cultual.
