  text: וְ/שַׁעֲרֵ֣י הָ/עִ֗יר עַל שְׁמוֹת֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל שְׁעָרִ֥ים שְׁלוֹשָׁ֖ה צָפ֑וֹנָ/ה שַׁ֣עַר רְאוּבֵ֞ן אֶחָ֗ד שַׁ֤עַר יְהוּדָה֙ אֶחָ֔ד שַׁ֥עַר לֵוִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/031.yaml
  text: 'And the gates of the city shall be named after the tribes of Israel: three gates on the north side—one gate of Reuben[a], one gate of Judah, one gate of Levi.'
translation:
  language: pt
  text: 'As portas da cidade terão os nomes das tribos de Israel[a]: no lado norte, haverá três portas — uma porta de Rúben, uma porta de Judá e uma porta de Levi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: serão designadas de acordo com os nomes das tribos de Israel.'
    reason: Alternativa lexical que explicita a ideia de correspondência expressa por עַל שְׁמוֹת.
lexical_decisions:
- source_word: וְשַׁעֲרֵי הָעִיר
  choice: As portas da cidade
  rationale: O sintagma construto é traduzido diretamente; a conjunção hebraica funciona como ligação no contexto e não precisa ser representada por “E” em português para que a descrição soe natural.
- source_word: עַל שְׁמוֹת שִׁבְטֵי יִשְׂרָאֵל
  choice: terão os nomes das tribos de Israel
  rationale: A expressão indica correspondência ou designação pelos nomes tribais. “Terão os nomes” é natural em português e preserva a relação sem especificar além do texto se os nomes estarão inscritos ou apenas atribuídos.
- source_word: שְׁעָרִים שְׁלוֹשָׁה צָפוֹנָה
  choice: no lado norte, haverá três portas
  rationale: A forma direcional־locativa צָפוֹנָה descreve o lado norte da cidade; a construção com “haverá” torna explícita em português a oração nominal hebraica.
- source_word: שַׁעַר רְאוּבֵן אֶחָד
  choice: uma porta de Rúben
  rationale: Mantém a associação nominal da porta com a tribo de Rúben e reproduz o padrão enumerativo do hebraico.
- source_word: שַׁעַר יְהוּדָה אֶחָד
  choice: uma porta de Judá
  rationale: Mantém de forma consistente a construção usada para os nomes tribais da lista.
- source_word: שַׁעַר לֵוִי אֶחָד
  choice: uma porta de Levi
  rationale: Preserva Levi como nome tribal, sem ampliar o referente para “os levitas”.
