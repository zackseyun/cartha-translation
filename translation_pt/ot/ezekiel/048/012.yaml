  text: וְ/הָיְתָ֨ה לָ/הֶ֧ם תְּרוּמִיָּ֛ה מִ/תְּרוּמַ֥ת הָ/אָ֖רֶץ קֹ֣דֶשׁ קָדָשִׁ֑ים אֶל גְּב֖וּל הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/012.yaml
  text: And it shall be for them a special allotment from the contribution of the land[a], most holy[c][b], beside the territory of the Levites.
translation:
  language: pt
  text: E ela será para eles uma porção reservada dentre a contribuição da terra[a], santíssima[b], junto ao território dos levitas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da porção reservada da terra”. O termo hebraico está relacionado a uma contribuição ou oferta separada para uso sagrado.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: uma construção superlativa, também expressa por “santo dos santos”; aqui ela descreve a santidade da porção de terra.'
    reason: lexical_alternative
  - marker: c
    text: Ou “junto ao limite dos levitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: E ela será
  rationale: O perfeito com waw tem valor futuro neste contexto de distribuição territorial; o pronome retoma a porção destinada aos sacerdotes.
- source_word: לָהֶם
  choice: para eles
  rationale: A preposição ל indica destinação ou posse em favor dos sacerdotes mencionados no contexto imediato.
- source_word: תְּרוּמִיָּה
  choice: uma porção reservada
  rationale: Em Ezequiel 45–48, o termo designa uma área de terra separada para uso sagrado; esta tradução comunica o sentido territorial e conserva a ideia de separação.
- source_word: מִתְּרוּמַת הָאָרֶץ
  choice: da contribuição da terra
  rationale: A expressão identifica essa porção como parte da área maior oferecida ou separada dentre a terra.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A construção superlativa hebraica significa literalmente 'santo dos santos' ou 'sumamente santo'; no contexto, qualifica a própria porção de terra sem acrescentar o substantivo 'lugar'.
- source_word: אֶל
  choice: junto a
  rationale: Na descrição territorial, a preposição expressa adjacência.
- source_word: גְּבוּל הַלְוִיִּם
  choice: território dos levitas
  rationale: Embora גְּבוּל também possa significar 'limite' ou 'fronteira', em contextos de distribuição de terras pode designar a área delimitada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Porção reservada” esclarece o uso territorial de תְּרוּמִיָּה; “santíssima” preserva a força superlativa sem transformar explicitamente a área em um 'lugar' nem sugerir o recinto técnico do Santo dos Santos.
