  text: וְ/עַל֙ גְּב֣וּל יְהוּדָ֔ה מִ/פְּאַ֥ת קָדִ֖ים עַד פְּאַת יָ֑מָּ/ה תִּהְיֶ֣ה הַ/תְּרוּמָ֣ה אֲֽשֶׁר תָּרִ֡ימוּ חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֜לֶף רֹ֗חַב וְ/אֹ֜רֶךְ כְּ/אַחַ֤ד הַ/חֲלָקִים֙ מִ/פְּאַ֤ת קָדִ֨ימָ/ה֙ עַד פְּאַת יָ֔מָּ/ה וְ/הָיָ֥ה הַ/מִּקְדָּ֖שׁ בְּ/תוֹכֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/008.yaml
  text: 'Along the border of Judah[a], from the east side to the west side, shall be the contribution that you shall set apart: twenty-five thousand in width, and in length like one of the portions, from the east side to the west side[c][b]; and the sanctuary shall be in its midst.'
translation:
  language: pt
  text: 'Ao longo da fronteira de Judá, do lado leste ao lado oeste, ficará a porção que vocês separarão[a]: terá vinte e cinco mil de largura e o mesmo comprimento que uma das porções[b], do lado leste ao lado oeste[c]; e o santuário ficará no meio dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “a contribuição”, “a oferta” ou “a área reservada”. O termo hebraico designa algo especialmente separado, neste contexto uma porção de terra destinada a uso sagrado.
    reason: lexical_alternative
  - marker: b
    text: Isto é, terá o comprimento de uma das porções de terra atribuídas às tribos.
    reason: cultural_note
  - marker: c
    text: Literalmente, “desde a extremidade leste até a extremidade voltada para o mar”; aqui, a direção do mar corresponde ao oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto da distribuição territorial, o termo designa o limite entre as faixas de terra; “fronteira” é claro e natural em português.
- source_word: מִפְּאַת קָדִים ... עַד פְּאַת יָמָּה
  choice: desde o lado leste até o lado oeste
  rationale: פֵּאָה indica lado ou extremidade, e יָמָּה funciona aqui como direção ocidental; a formulação comunica com clareza a extensão de leste a oeste.
- source_word: הַתְּרוּמָה
  choice: a porção
  rationale: Em Ezequiel 45–48, o termo se refere à faixa de terra especialmente separada. “Porção”, junto de “que vocês separarão”, preserva esse sentido contextual sem sugerir exclusivamente uma oferta sacrificial.
- source_word: תָּרִימוּ
  choice: que vocês separarão
  rationale: O hifil de רוּם tem aqui o sentido idiomático de destinar ou separar uma área como contribuição consagrada.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: vinte e cinco mil
  rationale: O hebraico não repete neste versículo a unidade de medida; a tradução mantém essa ausência, como no texto-fonte.
- source_word: רֹחַב
  choice: de largura
  rationale: Expressa a dimensão transversal da faixa de terra em linguagem natural de medição.
- source_word: אֹרֶךְ
  choice: de comprimento
  rationale: Expressa a dimensão longitudinal e forma um par claro com “de largura”.
- source_word: כְּאַחַד הַחֲלָקִים
  choice: como uma das porções
  rationale: Mantém a referência contextual às demais faixas distribuídas sem acrescentar ao texto principal a palavra “tribais”, que está implícita, mas não expressa no hebraico.
- source_word: הַמִּקְדָּשׁ
  choice: o santuário
  rationale: É a designação ampla e usual para o lugar ou recinto santo.
- source_word: בְּתוֹכוֹ
  choice: no meio dela
  rationale: Indica a localização do santuário dentro da porção separada e retoma naturalmente o substantivo feminino “porção”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção direta e legível no Brasil e em âmbito lusófono. Emprega “vocês” para o plural de segunda pessoa e conserva o estilo técnico de medição e distribuição territorial. A unidade não explicitada no hebraico permanece não explicitada.
