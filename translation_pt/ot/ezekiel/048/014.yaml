  text: וְ/לֹא יִמְכְּר֣וּ מִמֶּ֗/נּוּ וְ/לֹ֥א יָמֵ֛ר וְ/לֹ֥א יעבור רֵאשִׁ֣ית הָ/אָ֑רֶץ כִּי קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/014.yaml
  text: They must not sell any of it[a], nor exchange it, nor shall this choice portion of the land pass over to another, for it is holy to Yahweh.
translation:
  language: pt
  text: Não venderão parte alguma dela, nem a trocarão, nem a porção seleta da terra[a] passará para outras mãos, pois ela é santa para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as primícias da terra” ou “a primeira porção da terra”. A expressão hebraica pode enfatizar a primeira ou a principal porção da terra, ou seu caráter consagrado, semelhante ao das primícias.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְכְּרוּ
  choice: venderão
  rationale: O verbo מכר expressa diretamente a venda; o futuro com negação funciona aqui como proibição legal.
- source_word: מִמֶּנּוּ
  choice: parte alguma dela
  rationale: O pronome retoma a porção consagrada já descrita; esta formulação comunica naturalmente que nenhuma parte pode ser vendida.
- source_word: יָמֵר
  choice: a trocarão
  rationale: O verbo מור indica trocar ou substituir; o pronome explicita em português que o objeto continua sendo a porção de terra.
- source_word: יעבור
  choice: passará para outras mãos
  rationale: עבר significa literalmente passar; no contexto de propriedade, a expressão portuguesa preserva essa imagem e comunica transferência de posse.
- source_word: רֵאשִׁית הָאָרֶץ
  choice: esta porção seleta da terra
  rationale: רֵאשִׁית pode indicar a primeira parte, a parte principal ou algo semelhante a primícias. No contexto da divisão territorial, 'porção seleta' evita impor uma imagem agrícola, sem eliminar a ambiguidade, registrada em nota.
- source_word: קֹדֶשׁ
  choice: santa
  rationale: O predicativo declara que a porção de terra foi consagrada; o feminino concorda naturalmente com 'porção'.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica dedicação ou pertença, e o nome divino יהוה é transliterado como 'Yahweh'.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Natureza de רֵאשִׁית הָאָרֶץ
  choice: porção seleta da terra
  alternative: primícias da terra; primeira porção da terra
  rationale: O contexto trata de uma porção territorial consagrada. A tradução principal reflete seu caráter principal ou escolhido, enquanto a nota conserva os sentidos possíveis de prioridade e de primícias.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe jurídica acessível. “Passará para outras mãos” torna natural o sentido de transferência de propriedade sem perder a imagem verbal hebraica.
