base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/017.yaml
  text: And the city's open land shall be two hundred fifty cubits to the north[a], two hundred fifty to the south, two hundred fifty to the east[b], and two hundred fifty to the west.
translation:
  language: pt
  text: 'A área aberta[b] destinada à cidade será de duzentos e cinquenta côvados em cada direção: ao norte, duzentos e cinquenta; ao sul, duzentos e cinquenta; a leste, duzentos e cinquenta; e a oeste, duzentos e cinquenta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico apresenta o número literalmente como «cinquenta e duzentos», isto é, duzentos e cinquenta.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida como «área aberta» também pode ser entendida como «pastagem» ou «área comum» da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: terá
  rationale: A forma verbal com conjunção dá continuidade à descrição visionária com valor futuro; em português, “terá” expressa de modo natural que a cidade disporá dessa área.
- source_word: מִגְרָשׁ
  choice: área aberta
  rationale: Designa o terreno reservado ao redor de uma localidade, que podia servir como pastagem ou área comum; “área aberta” evita o sentido moderno e urbano de “subúrbio”.
- source_word: לָעִיר
  choice: da cidade
  rationale: A preposição marca a relação da área com a cidade; a construção possessiva é clara e natural em português.
- source_word: צָפוֹנָה / וְנֶגְבָּה / וְקָדִימָה / וְיָמָּה
  choice: ao norte / ao sul / a leste / a oeste
  rationale: As formas direcionais indicam os quatro lados ou rumos cardeais. A tradução usa expressões correntes e mantém o paralelismo.
- source_word: חֲמִשִּׁים וּמָאתַיִם
  choice: cento e vinte e cinco metros
  rationale: O hebraico traz literalmente “cinquenta e duzentos”, isto é, 250 côvados. No texto principal, a medida foi convertida pela equivalência comum de aproximadamente 0,5 metro por côvado, com a unidade original preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. A repetição das medidas e dos quatro pontos cardeais preserva o caráter preciso da descrição territorial. A conversão métrica favorece a compreensão imediata, enquanto a nota conserva a medida hebraica original.
