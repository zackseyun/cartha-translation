base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/007.yaml
  text: And along the border of Reuben[a], from the eastern side to the western side, Judah[c][b], one portion.
translation:
  language: pt
  text: 'E ao longo da fronteira de Rúben, do lado leste até o lado oeste[b]: Judá, uma porção.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Judá, um”. A palavra “porção” está subentendida na fórmula de distribuição das terras usada neste capítulo.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente “lado do mar”; a expressão é usada como indicação da direção oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Junto a
  rationale: A expressão situa a nova faixa territorial ao lado da fronteira da porção anterior; “junto a” é natural em português e preserva a relação espacial.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto da divisão territorial, designa a linha limítrofe da porção tribal.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: מִ/פְּאַת קָדִים
  choice: desde o lado leste
  rationale: פְּאָה indica lado ou extremidade; a expressão funciona aqui como indicação do limite oriental.
- source_word: עַד פְּאַת יָמָּה
  choice: até o lado oeste
  rationale: Embora יָם signifique literalmente “mar”, nesta fórmula geográfica indica a direção oeste.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico traz apenas “uma”, mas “porção” está subentendido pela fórmula repetida de distribuição das terras no capítulo.
