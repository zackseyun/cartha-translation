translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos tradicionais. O formato conciso e nominal da lista territorial foi preservado; os dois-pontos tornam explícita a relação entre a localização e a porção de Judá sem acrescentar um verbo ausente no hebraico.
