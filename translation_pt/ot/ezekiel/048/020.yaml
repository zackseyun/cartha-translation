base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/020.yaml
  text: The whole contribution shall be twenty-five thousand by twenty-five thousand[a]; you shall set apart the holy contribution as a quarter of the city's property.
translation:
  language: pt
  text: Toda a porção reservada medirá vinte e cinco mil por vinte e cinco mil[a]. Vocês separarão a porção reservada sagrada como a quarta parte da propriedade da cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vinte e cinco mil côvados por vinte e cinco mil côvados”, se for suprida a unidade indicada pelo contexto ao redor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, possivelmente: “Vocês separarão a porção reservada sagrada como uma área quadrada, juntamente com a propriedade da cidade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּרוּמָה / תְּרוּמַת
  choice: porção reservada / porção
  rationale: Neste contexto de distribuição territorial, o termo designa uma área destacada do território, não um sacrifício levado ao altar. “Porção reservada” comunica com clareza tanto a separação quanto o caráter territorial.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף
  choice: vinte e cinco mil por vinte e cinco mil
  rationale: O hebraico apresenta as dimensões sem explicitar a unidade neste versículo. “Por” é a forma natural de expressar dimensões em português; a possível unidade, côvados, fica em nota.
- source_word: רְבִיעִית
  choice: como uma área quadrada
  rationale: No contexto imediato, em que as duas dimensões são iguais, a forma feminina é entendida naturalmente como indicação de uma área de quatro lados, isto é, quadrada. A leitura fracionária “como a quarta parte” permanece registrada em nota por ser lexicalmente possível.
- source_word: תָּרִימוּ
  choice: vocês separarão
  rationale: O hifil de רום, usado com תְּרוּמָה, exprime aqui a ação de destacar ou reservar uma área. O futuro com valor diretivo mantém o tom das instruções territoriais.
- source_word: הַקֹּדֶשׁ
  choice: sagrada
  rationale: O termo identifica a porção como pertencente ao domínio santo. “Sagrada” concorda naturalmente com “porção” e mantém o registro bíblico digno.
- source_word: אֶל
  choice: juntamente com
  rationale: Nesta construção, a preposição relaciona a porção sagrada à propriedade urbana. “Juntamente com” produz uma relação territorial natural sem impor uma ideia de posse ou de fração.
- source_word: אֲחֻזַּת הָעִיר
  choice: a propriedade da cidade
  rationale: אֲחֻזָּה designa uma posse ou propriedade territorial. A expressão portuguesa é clara e preserva a relação genitiva com a cidade.
