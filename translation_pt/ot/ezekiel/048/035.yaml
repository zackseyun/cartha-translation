  text: סָבִ֕יב שְׁמֹנָ֥ה עָשָׂ֖ר אָ֑לֶף וְ/שֵׁם הָ/עִ֥יר מִ/יּ֖וֹם יְהוָ֥ה שָֽׁמָּ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/035.yaml
  text: All around shall be eighteen thousand[a], and the name of the city from that day on shall be, Yahweh Is There.
translation:
  language: pt
  text: 'O perímetro todo será de dezoito mil[a]. E, daquele dia em diante, o nome da cidade será: “Yahweh Está Ali”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A unidade de medida, subentendida pelo contexto, não é repetida no hebraico deste versículo.
    reason: unidade implícita
lexical_decisions:
- source_word: סָבִיב
  choice: O perímetro todo
  rationale: No contexto das medidas da cidade, o termo resume a extensão ao redor. Esta formulação natural em português comunica que se trata da medida total do contorno.
- source_word: שְׁמֹנָה עָשָׂר אָלֶף
  choice: dezoito mil
  rationale: O hebraico declara apenas o número, sem repetir nesta oração a unidade subentendida pelo contexto; a tradução preserva essa concisão.
- source_word: וְשֵׁם הָעִיר
  choice: E [...] o nome da cidade será
  rationale: Reproduz com clareza e dignidade a fórmula hebraica de nomeação, acrescentando apenas a cópula exigida pelo português natural.
- source_word: מִיּוֹם
  choice: daquele dia em diante
  rationale: Expressa idiomaticamente o ponto inicial e a continuidade implícitos na construção hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: שָׁמָּה
  choice: Está Ali
  rationale: O advérbio tem força predicativa no nome simbólico da cidade; “ali” aponta naturalmente para a própria cidade em português.
theological_decisions:
- issue: Tradução do nome divino no nome simbólico da cidade
  choice: Yahweh Está Ali
  alternative: O SENHOR Está Ali; Jeová Está Ali
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “Está Ali” mantém o sentido predicativo de שָׁמָּה sem explicar além do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A pontuação destaca a fórmula final como o nome atribuído à cidade; mantém-se a concisão do hebraico quanto à unidade de medida.
