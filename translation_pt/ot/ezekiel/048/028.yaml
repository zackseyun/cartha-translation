  text: וְ/עַל֙ גְּב֣וּל גָּ֔ד אֶל פְּאַ֖ת נֶ֣גֶב תֵּימָ֑נָ/ה וְ/הָיָ֨ה גְב֜וּל מִ/תָּמָ֗ר מֵ֚י מְרִיבַ֣ת קָדֵ֔שׁ נַחֲלָ֖ה עַל הַ/יָּ֥ם הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/028.yaml
  text: And along the border of Gad[a], on the south side southward, the border shall run from Tamar to the waters of Meribath-kadesh, to the Wadi of Egypt[b], and on to the Great Sea.
translation:
  language: pt
  text: Ao longo da fronteira de Gade, no lado sul, em direção ao sul, a fronteira se estenderá desde Tamar até as águas de Meribá-Cades[a], até o uádi[b], até o Mar Grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser transliterado “Meribate-Cades”, forma mais próxima do hebraico.
    reason: Oferece a variante transliterada do topônimo, preservando a forma usada no texto principal.
  - marker: b
    text: Isto é, um vale ou leito de curso de água, muitas vezes sazonal. O hebraico diz apenas “o uádi”, sem “do Egito”.
    reason: Esclarece o termo geográfico e evita acrescentar uma identificação não expressa no texto-fonte.
lexical_decisions:
- source_word: וְעַל גְּבוּל גָּד
  choice: Junto à fronteira de Gade
  rationale: A preposição עַל, em linguagem de limites territoriais, indica aqui posição junto à fronteira; “junto à” é natural em português e evita o sentido físico de “sobre”.
- source_word: אֶל פְּאַת נֶגֶב תֵּימָנָה
  choice: no lado sul, em direção ao sul
  rationale: Preserva a acumulação hebraica de termos meridionais sem produzir uma formulação obscura em português.
- source_word: וְהָיָה גְבוּל
  choice: a fronteira irá
  rationale: Na fórmula de demarcação, היה + גְּבוּל descreve o percurso da linha divisória; “irá” comunica esse movimento de modo idiomático.
- source_word: מִתָּמָר
  choice: desde Tamar
  rationale: Mantém o topônimo e marca claramente o ponto inicial do limite.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: as águas de Meribá-Cades
  rationale: Trata a expressão como topônimo conhecido, mantendo em nota o sentido lexical subjacente e a forma transliterada mais estrita.
- source_word: נַחֲלָה
  choice: em direção ao uádi
  rationale: Neste contexto, a palavra é entendida como נַחַל, “uádi/leito de curso sazonal”, com ה direcional. Não se acrescenta “do Egito”, ausente no texto hebraico deste versículo.
- source_word: עַל הַיָּם הַגָּדוֹל
  choice: junto ao Mar Grande
  rationale: עַל indica que a linha chega à região junto ao mar; “Mar Grande” preserva a designação hebraica tradicional do Mediterrâneo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário geográfico preciso. A repetição direcional do hebraico foi preservada de forma natural. “Uádi” evita sugerir um riacho perene; a nota oferece a explicação necessária. Não se importou a expressão “do Egito”, pois ela não aparece no WLC fornecido.
