  text: הַ/תְּרוּמָ֕ה אֲשֶׁ֥ר תָּרִ֖ימוּ לַֽ/יהוָ֑ה אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֥רֶת אֲלָפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/009.yaml
  text: The contribution that you shall set apart for Yahweh shall be twenty-five thousand in length and ten thousand in width[a].
translation:
  language: pt
  text: A porção que vocês separarão para Yahweh terá vinte e cinco mil de comprimento e dez mil de largura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta” ou “porção separada”. O termo hebraico se refere a algo apresentado ou destinado como contribuição; neste contexto, indica a área sagrada separada da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרוּמָה
  choice: a porção
  rationale: תְּרוּמָה designa algo separado como contribuição ou oferta. Neste contexto territorial, “porção” comunica com naturalidade uma área consagrada sem sugerir apenas um sacrifício ritual.
- source_word: אֲשֶׁר תָּרִימוּ
  choice: que vocês separarão
  rationale: O hifil de רוּם, neste contexto, indica destinar ou separar algo como contribuição; “separarão” preserva esse sentido e se ajusta à distribuição da terra.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica dedicação, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome da aliança.
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: vinte e cinco mil de comprimento
  rationale: Expressa diretamente a primeira dimensão. Como o hebraico não declara a unidade neste versículo, nenhuma unidade é acrescentada.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: e dez mil de largura
  rationale: Mantém o paralelismo dimensional do hebraico e não supre a unidade implícita.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama. “Yahweh” preserva o nome próprio e segue a decisão doutrinária fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A formulação conserva as unidades não expressas no hebraico e mantém a ambiguidade lexical de תְּרוּמָה em nota.
