  text: וְ/אֶל פְּאַ֣ת קָדִ֗ימָ/ה חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים וּ/שְׁעָרִ֖ים שְׁלֹשָׁ֑ה וְ/שַׁ֨עַר יוֹסֵ֜ף אֶחָ֗ד שַׁ֤עַר בִּנְיָמִן֙ אֶחָ֔ד שַׁ֥עַר דָּ֖ן אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/032.yaml
  text: 'And on the east side[a], four thousand five hundred cubits, with three gates: the gate of Joseph, one; the gate of Benjamin, one; the gate of Dan, one.'
translation:
  language: pt
  text: 'No lado leste: quatro mil e quinhentos côvados[a], com três portões: um portão de José, um portão de Benjamim e um portão de Dã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “quatro mil e quinhentos”; “côvados” foi acrescentado com base no contexto das medidas da cidade neste capítulo.
    reason: cross_reference
lexical_decisions:
- source_word: פְּאַת קָדִימָה
  choice: lado leste
  rationale: פְּאַת indica lado, extremidade ou face, e קָדִימָה especifica a direção leste. “Lado leste” é natural e mantém a fórmula das medidas da cidade.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatro mil e quinhentos côvados
  rationale: A ordem literal hebraica é “quinhentos e quatro mil”, mas o valor idiomático é 4.500. A unidade “côvados” está implícita e é fornecida pelo contexto imediato das medidas da cidade.
- source_word: וּשְׁעָרִים שְׁלֹשָׁה
  choice: com três portões
  rationale: A expressão hebraica é uma construção descritiva sem verbo. “Com três portões” liga naturalmente a medida do lado à enumeração dos portões.
- source_word: שַׁעַר
  choice: portão
  rationale: Termo corrente e claro para as entradas da cidade mencionadas na visão.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal e tribal.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal e tribal.
- source_word: דָּן
  choice: Dã
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal e tribal.
- source_word: אֶחָד ... אֶחָד ... אֶחָד
  choice: um ... um ... um
  rationale: 'A repetição explícita preserva a enumeração enfática do hebraico: um portão para cada tribo nomeada.'
