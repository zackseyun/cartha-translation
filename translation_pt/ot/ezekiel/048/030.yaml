  yaml_path: translation/ot/ezekiel/048/030.yaml
  text: 'And these are the exits of the city: on the north side[b][a], four thousand five hundred measures.'
translation:
  language: pt
  text: 'E estas são as saídas[a] da cidade: do lado norte, quatro mil e quinhentas medidas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “extensões da cidade”. O termo hebraico pode indicar aquilo que sai para fora, incluindo as saídas ou os limites externos da cidade.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “quinhentos e quatro mil”. A ordem foi ajustada ao uso natural do português. A unidade de medida não é especificada neste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estas são
  rationale: Preserva a conjunção que liga esta seção à anterior e reproduz o caráter solene de uma enumeração, suprindo naturalmente a cópula implícita em português.
- source_word: תּוֹצְאֹת
  choice: as saídas
  rationale: O substantivo pode indicar saídas ou extensões para fora. “Saídas” é natural no contexto das portas enumeradas a seguir, sem substituir antecipadamente o termo por “portas”; a ambiguidade é registrada em nota.
- source_word: הָעִיר
  choice: da cidade
  rationale: Tradução direta do substantivo definido com a relação genitiva exigida em português.
- source_word: מִפְּאַת צָפוֹן
  choice: do lado norte
  rationale: פֵּאָה pode designar lado, borda ou extremidade; no levantamento do perímetro urbano, “lado” é claro e apropriado.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatro mil e quinhentos
  rationale: Reordena a expressão hebraica literalmente “quinhentos e quatro mil” segundo o uso numérico natural do português, sem alterar o total.
- source_word: מִדָּה
  choice: medindo
  rationale: O substantivo singular indica dimensão ou medida, mas não especifica aqui uma unidade. A forma verbal portuguesa expressa naturalmente a dimensão sem acrescentar “côvados” nem criar a construção pouco idiomática “de medida”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima da enumeração hebraica. “Medindo” evita inserir uma unidade ausente no texto e torna idiomática a expressão de dimensão.
