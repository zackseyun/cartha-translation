base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/003.yaml
  text: And alongside the border of Asher[a], from the eastern side to the western side, Naphtali, one portion.
translation:
  language: pt
  text: Junto à fronteira de Aser, desde o lado leste até o lado oeste, uma porção para Naftali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Naftali, um”. A palavra “porção” foi acrescentada para maior clareza com base no contexto da distribuição das terras neste capítulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Junto a
  rationale: No contexto da distribuição territorial, expressa a posição adjacente da faixa seguinte em relação à fronteira de Aser, com naturalidade em português.
- source_word: גְּבוּל
  choice: fronteira
  rationale: Designa a linha divisória entre os territórios; “fronteira” é clara e adequada à fórmula geográfica do capítulo.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: מִ/פְּאַת קָדִימָה
  choice: desde o lado leste
  rationale: פֵּאָה indica lado ou extremidade, e קָדִימָה indica a direção oriental; a formulação conserva o ponto inicial da extensão.
- source_word: וְ/עַד פְּאַת יָמָּה
  choice: até o lado oeste
  rationale: עַד marca o limite da extensão, enquanto יָמָּה, literalmente ligado ao mar, tem aqui o sentido geográfico de oeste.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico traz literalmente “um/uma”, mas o contexto de repartição das terras torna implícita uma porção territorial. O substantivo é suprido no texto para clareza e assinalado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para produzir uma frase natural em português, sem alterar a relação espacial nem a concisão da fórmula hebraica.
