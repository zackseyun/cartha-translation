- from: 'E o que restar pertencerá ao príncipe, de ambos os lados da contribuição sagrada e da propriedade da cidade: junto aos vinte e cinco mil[a] da contribuição, até a fronteira oriental, e, para o oeste, junto aos vinte e cinco mil, até a fronteira ocidental, em paralelo com as porções; isso pertencerá ao príncipe. A contribuição sagrada e o santuário do templo ficarão no meio dessa área.'
  to: 'E o que restar pertencerá ao príncipe, de ambos os lados da contribuição sagrada e da propriedade da cidade: junto aos vinte e cinco mil[a] da contribuição, até a fronteira oriental, e, para o oeste, junto aos vinte e cinco mil, até a fronteira ocidental, em correspondência com as porções, para o príncipe. A contribuição sagrada e o santuário do templo estarão no meio dessa área.'
  rationale: A revisão elimina o demonstrativo interpretativo e integra «para o príncipe» à descrição final, mais próxima da construção hebraica, sem atribuir as «porções» ao príncipe. Também substitui «ficarão» por «estarão» para uma descrição locativa mais natural. Mantêm-se a ambiguidade controlada de «dessa área» e a nota ancorada na primeira ocorrência da medida.
