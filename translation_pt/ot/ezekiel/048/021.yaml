source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֣ר לַ/נָּשִׂ֣יא מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לִ/תְרֽוּמַת הַ/קֹּ֣דֶשׁ וְ/לַ/אֲחֻזַּ֪ת הָ/עִ֟יר אֶל פְּנֵ֣י חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֥לֶף תְּרוּמָה֮ עַד גְּב֣וּל קָדִימָ/ה֒ וְ/יָ֗מָּ/ה עַל פְּ֠נֵי חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ עַל גְּב֣וּל יָ֔מָּ/ה לְ/עֻמַּ֥ת חֲלָקִ֖ים לַ/נָּשִׂ֑יא וְ/הָֽיְתָה֙ תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ וּ/מִקְדַּ֥שׁ הַ/בַּ֖יִת ב/תוכ/ה׀׀־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/021.yaml
  text: And what remains shall belong to the prince[a], on both sides of the holy contribution and of the city's property, alongside the twenty-five thousand of the contribution as far as the eastern border, and westward alongside the twenty-five thousand toward the western border, parallel to the portions for the prince. And the holy contribution and the sanctuary of the temple shall be in its midst.
translation:
  language: pt
  text: 'E o que restar pertencerá ao príncipe, de ambos os lados da contribuição sagrada e da propriedade da cidade: junto aos vinte e cinco mil[a] da contribuição, até a fronteira oriental, e, para o oeste, junto aos vinte e cinco mil, até a fronteira ocidental, em paralelo com as porções; isso pertencerá ao príncipe. A contribuição sagrada e o santuário do templo ficarão no meio dessa área.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “vinte e cinco mil”; a unidade de medida é subentendida pelo contexto das medições de terra em Ezequiel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַנּוֹתָר לַנָּשִׂיא
  choice: E o que restar pertencerá ao príncipe
  rationale: O particípio substantivado indica a terra restante, e o dativo לַנָּשִׂיא marca sua destinação ao príncipe. A formulação é natural e mantém o título característico de Ezequiel.
- source_word: מִזֶּה וּמִזֶּה
  choice: de ambos os lados
  rationale: A expressão idiomática descreve as duas áreas laterais em relação à contribuição sagrada e à propriedade da cidade.
- source_word: תְרוּמַת הַקֹּדֶשׁ
  choice: contribuição sagrada
  rationale: תְרוּמָה conserva a ideia cultual de algo oferecido e separado, embora neste contexto designe uma extensão de terra.
- source_word: אֲחֻזַּת הָעִיר
  choice: propriedade da cidade
  rationale: אֲחֻזָּה designa uma posse territorial; 'propriedade' comunica isso com clareza em português atual.
- source_word: אֶל פְּנֵי ... עַל פְּנֵי
  choice: junto aos
  rationale: Neste traçado territorial, as expressões indicam proximidade ou alinhamento espacial, não necessariamente posição frontal.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: vinte e cinco mil
  rationale: O hebraico não explicita aqui a unidade de medida; ela é deixada implícita no texto principal e explicada em nota.
- source_word: עַד גְּבוּל קָדִימָה ... עַל גְּבוּל יָמָּה
  choice: até a fronteira oriental ... até a fronteira ocidental
  rationale: A tradução expressa os limites leste e oeste da área, preservando o paralelismo geográfico.
- source_word: לְעֻמַּת חֲלָקִים לַנָּשִׂיא
  choice: em paralelo com as porções; isso pertencerá ao príncipe
  rationale: A sintaxe hebraica é compacta. A pontuação preserva a relação de alinhamento com as porções e liga לַנָּשִׂיא ao destino da área sem sugerir que as porções tribais pertencem ao príncipe.
- source_word: וּמִקְדַּשׁ הַבַּיִת
  choice: e o santuário do templo
  rationale: מִקְדָּשׁ é o santuário, enquanto הַבַּיִת, neste contexto, se refere ao complexo do templo.
- source_word: בְתוֹכָהּ
  choice: no meio dessa área
  rationale: O sufixo feminino pode retomar a contribuição sagrada ou, mais amplamente, a área descrita. 'Dessa área' evita um referente pronominal obscuro sem impor uma precisão geométrica ausente.
