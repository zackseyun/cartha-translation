base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/024.yaml
  text: 'Along the border of Benjamin[a], from the east side to the west side, Simeon: one portion.'
translation:
  language: pt
  text: 'Ao longo da fronteira de Benjamim, desde o lado leste até o lado oeste, Simeão: uma porção.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “Simeão, um”; o substantivo “porção” está implícito na fórmula de distribuição repetida neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Ao longo de
  rationale: A expressão situa a faixa seguinte junto à fronteira anterior e dá continuidade à sequência das distribuições; em português, “ao longo de” comunica naturalmente essa relação espacial.
- source_word: גְּבוּל
  choice: fronteira
  rationale: Neste contexto de repartição territorial, o termo designa a linha divisória da porção de uma tribo, não o território inteiro.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: desde o lado leste
  rationale: Preserva a referência espacial à extremidade oriental e inicia com naturalidade a fórmula que abrange toda a faixa.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: até o lado oeste
  rationale: Equilibra a expressão anterior e reproduz a extensão da porção de leste a oeste.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: אֶחָד
  choice: uma porção
  rationale: O hebraico traz apenas “um”, em construção elíptica; “porção” é inferido da fórmula repetida de distribuição territorial em Ezequiel 48 e torna o sentido claro em português.
theological_decisions: []
