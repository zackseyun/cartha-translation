base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/009.yaml
  text: And I looked[a], and behold, four wheels beside the cherubim, one wheel beside each cherub; and the appearance of the wheels was like beryl stone.
translation:
  language: pt
  text: Olhei e vi quatro rodas junto aos querubins, uma roda ao lado de cada querubim. A aparência das rodas era como a de uma pedra de Társis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pedra de Társis”. Não se sabe ao certo qual pedra preciosa é designada; pode ser berilo, crisólito ou outra gema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Olhei
  rationale: No relato visionário, expressa o ato de dirigir a atenção; evita a redundância menos natural de «vi, e eis» em português.
- source_word: וְהִנֵּה
  choice: e vi
  rationale: Transmite de modo natural e vívido a função apresentativa de הִנֵּה no português moderno.
- source_word: אַרְבָּעָה אוֹפַנִּים
  choice: quatro rodas
  rationale: Equivalente direto e habitual no contexto da visão de Ezequiel.
- source_word: אֵצֶל הַכְּרוּבִים
  choice: junto aos querubins
  rationale: Comunica proximidade sem especificar além do hebraico a posição exata.
- source_word: אוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד
  choice: uma roda ao lado de cada querubim
  rationale: Torna explícito em português o sentido distributivo da construção hebraica «uma... um», sem alterar seu conteúdo.
- source_word: וּמַרְאֵה הָאוֹפַנִּים
  choice: A aparência das rodas
  rationale: Preserva o foco na forma visível das rodas dentro do relato da visão.
- source_word: כְּעֵין אֶבֶן תַּרְשִׁישׁ
  choice: era como a de uma pedra de Társis
  rationale: Mantém a comparação visual e translitera תַּרְשִׁישׁ, evitando identificar com certeza uma pedra preciosa cujo tipo exato é discutido.
