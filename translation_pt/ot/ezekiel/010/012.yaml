  text: וְ/כָל בְּשָׂרָ/ם֙ וְ/גַבֵּ/הֶ֔ם וִֽ/ידֵי/הֶ֖ם וְ/כַנְפֵי/הֶ֑ם וְ/הָ/אֽוֹפַנִּ֗ים מְלֵאִ֤ים עֵינַ֨יִם֙ סָבִ֔יב לְ/אַרְבַּעְתָּ֖/ם אוֹפַנֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/012.yaml
  text: And all their bodies[a], their backs, their hands, their wings[b], and the wheels were full of eyes all around—the wheels belonging to the four of them.
translation:
  language: pt
  text: Todo o corpo deles[a], suas costas, suas mãos, suas asas e as rodas estavam cheios de olhos por todos os lados — as rodas pertencentes aos quatro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “toda a carne deles”.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão final também pode ser traduzida de modo mais compacto: “suas quatro rodas” ou “as rodas dos quatro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂרָם
  choice: o corpo deles
  rationale: Embora בָּשָׂר signifique literalmente “carne”, neste inventário das partes das criaturas, “corpo” comunica de modo mais natural o conjunto físico sem eliminar a concretude da imagem; a alternativa literal é preservada em nota.
- source_word: גַבֵּיהֶם
  choice: suas costas
  rationale: A sequência de partes corporais favorece o sentido anatômico “costas”, em vez de sentidos contextuais como bordas ou alturas.
- source_word: וִידֵיהֶם
  choice: suas mãos
  rationale: Mantém o sentido comum de יָד; o contexto não exige a ampliação para “braços”.
- source_word: וְכַנְפֵיהֶם
  choice: suas asas
  rationale: É a equivalência direta e corrente de כָּנָף na descrição das criaturas visionárias.
- source_word: הָאוֹפַנִּים / אוֹפַנֵּיהֶם
  choice: as rodas / as rodas pertencentes aos quatro
  rationale: Traduz concretamente אוֹפַן e conserva a retomada final do substantivo, explicitando em português a relação indicada pelo hebraico sem identificar além do necessário a natureza dessa relação.
- source_word: מְלֵאִים עֵינַיִם
  choice: estavam cheios de olhos
  rationale: Reproduz de perto a construção hebraica “cheios de olhos”; “cobertos de olhos” seria mais interpretativo.
- source_word: סָבִיב
  choice: por todos os lados
  rationale: Expressão portuguesa atual e idiomática para a ideia espacial de algo ao redor, em toda a volta.
- source_word: לְאַרְבַּעְתָּם
  choice: pertencentes aos quatro
  rationale: Explicita com naturalidade a relação associativa marcada pelo לְ, preservando que as rodas estão vinculadas às quatro criaturas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A enumeração e a repetição final de “rodas” foram mantidas para refletir a estrutura enfática e esclarecedora do hebraico.
