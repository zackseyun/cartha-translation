source:
  edition: WLC
  text: וַ/יָּ֤רָם כְּבוֹד יְהוָה֙ מֵ/עַ֣ל הַ/כְּר֔וּב עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּמָּלֵ֤א הַ/בַּ֨יִת֙ אֶת הֶ֣/עָנָ֔ן וְ/הֶֽ/חָצֵר֙ מָֽלְאָ֔ה אֶת נֹ֖גַהּ כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/004.yaml
  text: And the glory of Yahweh rose up from above the cherub to the threshold of the house[a], and the house was filled with the cloud[b], and the court was filled with the brightness of the glory of Yahweh.
translation:
  language: pt
  text: Então a glória de Yahweh se elevou de cima do querubim até o limiar do templo[a]. O templo se encheu da nuvem, e o pátio ficou cheio do brilho da glória de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o limiar da casa”. Neste contexto, “casa” designa o edifício do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָם
  choice: se elevou
  rationale: Expressa o movimento ascendente de רום sem especificar um agente externo, preservando a forma e a ambiguidade do hebraico.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Mantém a repetição enfática e verte o nome divino יְהוָה como Yahweh.
- source_word: מֵעַל הַכְּרוּב
  choice: de sobre o querubim
  rationale: Preserva tanto a ideia de movimento a partir de uma posição acima/sobre quanto o singular hebraico כְּרוּב.
- source_word: עַל מִפְתַּן הַבָּיִת
  choice: até a entrada do templo
  rationale: No contexto de movimento, עַל indica o destino; מִפְתָּן designa propriamente o limiar, aqui expresso no texto corrente pela forma portuguesa mais natural 'entrada', com a precisão indicada em nota.
- source_word: וַיִּמָּלֵא הַבַּיִת אֶת הֶעָנָן
  choice: O templo se encheu da nuvem
  rationale: Reproduz o sentido medio-passivo de מלא e conserva a nuvem definida, reconhecível no contexto da manifestação divina.
- source_word: וְהֶחָצֵר מָלְאָה
  choice: e o pátio ficou cheio
  rationale: Verte naturalmente a construção predicativa hebraica e usa 'pátio', termo corrente para a área aberta do complexo do templo.
- source_word: נֹגַהּ
  choice: brilho
  rationale: Termo claro e corrente para a luminosidade ou radiância associada à glória divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Representa diretamente o Tetragrama como nome próprio, sem substituí-lo por um título.
- issue: Natureza da כְּבוֹד יְהוָה
  choice: glória de Yahweh
  alternative: presença de Yahweh
  rationale: Mantém o termo concreto e teologicamente carregado do hebraico, sem reduzir ou explicar a glória apenas como 'presença'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente desdobrada em duas frases para clareza. 'Querubim' permanece no singular, como no hebraico; 'templo' explicita o referente contextual de 'casa'.
