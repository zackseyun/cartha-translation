source:
  edition: WLC
  text: וְ/אַרְבָּעָ֥ה פָנִ֖ים לְ/אֶחָ֑ד פְּנֵ֨י הָ/אֶחָ֜ד פְּנֵ֣י הַ/כְּר֗וּב וּ/פְנֵ֤י הַ/שֵּׁנִי֙ פְּנֵ֣י אָדָ֔ם וְ/הַ/שְּׁלִישִׁי֙ פְּנֵ֣י אַרְיֵ֔ה וְ/הָ/רְבִיעִ֖י פְּנֵי נָֽשֶׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/014.yaml
  text: 'And each one had four faces: the face of the first was the face of the cherub[a], and the face of the second was the face of a man, and the third the face of a lion[b], and the fourth the face of an eagle.'
translation:
  language: pt
  text: 'E cada um tinha quatro rostos: o rosto do primeiro era o rosto do querubim[a]; o rosto do segundo era o rosto de um homem; o terceiro, o rosto de um leão; e o quarto, o rosto de uma águia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ezequiel 1:10 descreve o rosto correspondente como o de um boi; aqui, o texto hebraico diz “o querubim”.
    reason: cross_reference
  - marker: b
    text: Ou “abutre”; o termo hebraico pode designar de modo mais amplo uma grande ave de rapina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים לְאֶחָד
  choice: E cada um tinha quatro rostos
  rationale: A frase hebraica não tem verbo e diz literalmente “e quatro rostos para cada um”. Em português, “cada um tinha quatro rostos” expressa com naturalidade e clareza o sentido distributivo.
- source_word: פְּנֵי הָאֶחָד
  choice: o rosto do primeiro
  rationale: הָאֶחָד tem função ordinal nesta sequência com “o segundo”, “o terceiro” e “o quarto”; por isso, “o primeiro” reproduz melhor a estrutura da enumeração.
- source_word: הַכְּרוּב
  choice: o querubim
  rationale: O substantivo vem com artigo definido. A tradução direta preserva também a diferença significativa em relação a Ezequiel 1:10, onde o rosto correspondente é descrito como rosto de boi.
- source_word: אָדָם
  choice: um homem
  rationale: Neste catálogo de rostos de seres vivos, אָדָם designa uma figura humana. “Rosto de um homem” é uma formulação portuguesa natural e semanticamente precisa.
- source_word: אַרְיֵה
  choice: um leão
  rationale: É a designação direta do animal, e “rosto de um leão” soa natural em português.
- source_word: נָשֶׁר
  choice: uma águia
  rationale: נָשֶׁר pode designar uma grande ave de rapina. “Águia” é a tradução tradicional e adequada à imagem visionária, enquanto a possibilidade de “abutre” é preservada em nota.
theological_decisions:
- issue: Relação entre “querubim” neste versículo e o rosto de “boi” em Ezequiel 1:10
  choice: Traduzir o texto como “o querubim”, sem harmonizá-lo com “boi”.
  alternative: Traduzir “querubim” como “boi” ou parafrasear como “boi semelhante a um querubim”.
  rationale: O texto hebraico deste versículo diz explicitamente “o querubim”. A tradução preserva a forma do texto recebido e deixa a tensão com Ezequiel 1:10 visível, explicando-a em nota em vez de resolvê-la por harmonização.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “rosto” foi mantida para refletir a estrutura enfática do hebraico; ponto e vírgula e elipses discretas tornam a enumeração natural sem apagar o paralelismo.
