  source_fidelity: A estrutura temporal e o movimento coordenado dos querubins e das rodas estão bem preservados. Contudo, «não se afastavam» traduz apenas o resultado espacial e deixa de explicitar o sentido de voltar-se/desviar-se de לֹא יִסַּבּוּ. Uma formulação com «desviavam» representa melhor o verbo hebraico sem perder a relação espacial.
