base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/016.yaml
  text: When the cherubim moved[a], the wheels moved beside them; and when the cherubim lifted up their wings to rise from the earth, the wheels also did not turn away from beside them.
translation:
  language: pt
  text: Quando os querubins se moviam, as rodas se moviam ao lado deles; e, quando os querubins erguiam as asas para se elevarem da terra, as rodas também não se desviavam de junto deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se afastavam de junto deles”. O hebraico ressalta que, quando os querubins levantavam as asas para se elevar da terra, as rodas não se desviavam de junto deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלֶכֶת ... יֵלְכוּ
  choice: Quando ... se moviam, ... se moviam
  rationale: A construção ב + infinitivo introduz uma oração temporal; “se moviam” expressa de modo natural o movimento coordenado na visão.
- source_word: הַכְּרוּבִים
  choice: os querubins
  rationale: Mantém a transliteração tradicional do plural hebraico e o registro próprio da visão.
- source_word: הָאוֹפַנִּים
  choice: as rodas
  rationale: אוֹפַנִּים designa claramente as rodas que acompanham os seres na visão.
- source_word: אֶצְלָם
  choice: ao lado deles
  rationale: Expressa a proximidade espacial indicada por אֵצֶל em português corrente.
- source_word: וּבִשְׂאֵת ... אֶת כַּנְפֵיהֶם
  choice: quando ... erguiam as asas
  rationale: A segunda construção temporal com ב + infinitivo descreve os querubins levantando as próprias asas.
- source_word: לָרוּם מֵעַל הָאָרֶץ
  choice: para se elevarem da terra
  rationale: Preserva a ideia de finalidade ou resultado e o movimento ascendente, com formulação natural em português.
- source_word: לֹא יִסַּבּוּ ... מֵאֶצְלָם
  choice: não se afastavam do lado deles
  rationale: No contexto, o giro implicaria separação; esta tradução comunica que as rodas permaneciam junto aos querubins, sem exigir uma referência explícita à mudança de direção.
- source_word: גַּם הֵם
  choice: também
  rationale: Mantém a ênfase na ação correspondente das rodas.
