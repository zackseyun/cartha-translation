base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/013.yaml
  text: As for the wheels[a], they were called “the whirling wheel” in my hearing.
translation:
  language: pt
  text: Quanto às rodas, ouvi chamá-las de “a roda giratória”[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a roda”. O termo hebraico aqui, גַּלְגַּל (galgal), é diferente da palavra traduzida por “rodas” no início do versículo e também pode sugerir algo que gira ou rodopia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֹופַנִּים
  choice: Quanto às rodas
  rationale: O לְ inicial introduz aqui o tópico a respeito do qual se faz a declaração; “quanto às” expressa essa função discursiva com naturalidade.
- source_word: לָהֶם קוֹרָא
  choice: ouvi chamá-las
  rationale: A construção hebraica é literalmente próxima de “a elas chamava/chamavam”. Em português, a formulação com sujeito indeterminado e o pronome retomando “rodas” comunica de modo claro o ato de dar um nome, sem identificar quem o pronunciou.
- source_word: הַגַּלְגַּל
  choice: a roda giratória
  rationale: גַּלְגַּל pode significar “roda” e também evocar movimento circular ou rodopiante. “Roda giratória” conserva o singular definido, distingue o termo de אֹופַנִּים e mantém a imagem dinâmica da visão.
- source_word: בְּאָזְנָי
  choice: ouvi
  rationale: A expressão idiomática “aos meus ouvidos” indica que Ezequiel escutou pessoalmente essa designação. “Ouvi” transmite isso em português atual e natural.
theological_decisions: []
translation_notes:
