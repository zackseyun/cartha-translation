source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הַ/כְּר֨וּב אֶת יָד֜/וֹ מִ/בֵּינ֣וֹת לַ/כְּרוּבִ֗ים אֶל הָ/אֵשׁ֙ אֲשֶׁר֙ בֵּינ֣וֹת הַ/כְּרֻבִ֔ים וַ/יִּשָּׂא֙ וַ/יִּתֵּ֔ן אֶל חָפְנֵ֖י לְבֻ֣שׁ הַ/בַּדִּ֑ים וַ/יִּקַּ֖ח וַ/יֵּצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/007.yaml
  text: Then the cherub stretched out his hand from among the cherubim to the fire that was among the cherubim[a], and he lifted it up and put it into the palms of the one clothed in linen[b], who took it and went out.
translation:
  language: pt
  text: Então o querubim estendeu a mão do meio dos querubins até o fogo que estava no meio deles[a], pegou-o e o pôs nas mãos em concha daquele que estava vestido de linho[b]. Ele o tomou e saiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “de entre os querubins” e “o fogo que estava entre os querubins”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao que estava vestido de linho”. No contexto, é a mesma figura anteriormente chamada de “o homem vestido de linho” (10:2, 6).
    reason: cross_reference
lexical_decisions:
- source_word: הַכְּרוּב
  choice: o querubim
  rationale: O substantivo está no singular e com artigo; o versículo destaca a ação de um dos querubins.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: estendeu a mão
  rationale: A expressão descreve o gesto físico de estender ou alcançar com a mão; esta formulação é natural e vívida em português.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: do meio dos querubins
  rationale: Expressa de modo natural a localização do querubim dentro do grupo, preservando o sentido espacial de 'entre/no meio de'.
- source_word: הָאֵשׁ אֲשֶׁר בֵּינוֹת הַכְּרֻבִים
  choice: o fogo que estava no meio deles
  rationale: Mantém a referência definida ao fogo e evita uma repetição pesada, sem perder a localização entre os querubins.
- source_word: וַיִּשָּׂא
  choice: pegou parte do fogo
  rationale: O objeto está implícito no hebraico. O contexto indica que o querubim tomou do fogo mencionado; 'parte do fogo' comunica isso sem especificar indevidamente brasas ou uma quantidade.
- source_word: וַיִּתֵּן
  choice: a pôs
  rationale: Embora o verbo possa significar 'dar', aqui descreve concretamente a transferência do fogo para as mãos do destinatário.
- source_word: חָפְנֵי
  choice: nas mãos em concha
  rationale: O termo indica as palmas ou mãos côncavas, preparadas para receber algo; 'mãos em concha' preserva essa imagem em português corrente.
- source_word: לְבֻשׁ הַבַּדִּים
  choice: daquele que estava vestido de linho
  rationale: O hebraico deste versículo não repete explicitamente 'homem'; a tradução mantém essa formulação mínima, enquanto o contexto identifica a figura.
- source_word: וַיִּקַּח וַיֵּצֵא
  choice: Ele a recebeu e saiu
  rationale: A mudança de sujeito é explicitada para clareza. 'Recebeu' distingue a ação do destinatário da ação anterior do querubim, embora o verbo básico seja 'tomou/pegou'.
theological_decisions:
- issue: Identidade daquele que recebe o fogo
  choice: daquele que estava vestido de linho
  alternative: do homem vestido de linho
  rationale: O contexto anterior o chama de homem vestido de linho (10:2,6), mas este versículo diz literalmente apenas 'vestido de linho'. O texto principal não acrescenta o substantivo ausente.
- issue: Natureza do material transferido
  choice: parte do fogo
  alternative: brasas
  rationale: O versículo menciona 'o fogo', ao passo que as brasas aparecem no contexto. A tradução não substitui o termo do versículo por uma identificação contextual mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva a sequência narrativa, explicita com moderação os referentes necessários e mantém em nota a redação espacial mais formal.
