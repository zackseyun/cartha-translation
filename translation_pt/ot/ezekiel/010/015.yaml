id: EZK.10.15
reference: Ezekiel 10:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּרֹ֖מּוּ הַ/כְּרוּבִ֑ים הִ֣יא הַ/חַיָּ֔ה אֲשֶׁ֥ר רָאִ֖יתִי בִּֽ/נְהַר כְּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/015.yaml
  text: And the cherubim rose up[a]. They were the living creature that I had seen by the Kebar Canal.
translation:
  language: pt
  text: Então os querubins se elevaram. Eram o ser vivente que eu tinha visto junto ao canal de Quebar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eram os seres viventes que eu tinha visto junto ao rio Quebar”. O hebraico traz no singular “o ser vivente”, provavelmente identificando os querubins coletivamente com os seres vistos antes. “Canal de Quebar” também pode ser traduzido como “rio Quebar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרֹמּוּ
  choice: se elevaram
  rationale: Expressa o movimento ascendente do verbo רוּם sem introduzir uma causa externa, como faria uma construção passiva. O verbo é natural e digno no contexto visionário.
- source_word: הַכְּרוּבִים
  choice: os querubins
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para o plural כְּרוּבִים.
- source_word: הִיא הַחַיָּה
  choice: Eram o ser vivente
  rationale: Mantém a referência plural aos querubins, mas preserva o predicativo singular do hebraico, que parece identificá-los coletivamente com o ser visionário visto antes.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que eu tinha visto
  rationale: O mais-que-perfeito composto deixa claro que a visão junto ao Quebar ocorreu anteriormente ao momento narrado.
- source_word: בִּנְהַר כְּבָר
  choice: junto ao canal de Quebar
  rationale: No contexto babilônico, נְהַר provavelmente designa um canal ou curso de água; 'junto a' comunica naturalmente a localização, e 'Quebar' é uma transliteração portuguesa reconhecível.
theological_decisions:
- issue: Identificação dos querubins com o ser ou os seres vistos em Ezequiel 1
  choice: Eram o ser vivente que eu tinha visto
  alternative: Eram os seres viventes que eu tinha visto
  rationale: O hebraico passa do sujeito plural 'os querubins' ao pronome e substantivo femininos singulares. A tradução conserva essa tensão gramatical e literária, em vez de regularizar silenciosamente o predicativo para o plural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação preserva deliberadamente o contraste entre o sujeito plural e o predicativo singular do hebraico; a nota registra a possível pluralização e a alternativa geográfica.
