revisions:
- from: Então os querubins levantaram as asas e se elevaram da terra diante dos meus olhos, ao saírem, com as rodas ao lado deles[a]. E aquilo parou à entrada do portão oriental da casa de Yahweh[b][c], enquanto a glória do Deus de Israel estava sobre eles, lá no alto.
  to: Então os querubins ergueram suas asas e se elevaram da terra diante dos meus olhos, ao saírem, com as rodas ao lado deles[a]. E ficou à entrada do portão oriental da casa de Yahweh[b][c]; e a glória do Deus de Israel estava sobre eles, do alto.
