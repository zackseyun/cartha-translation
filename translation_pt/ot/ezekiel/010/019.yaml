  text: וַ/יִּשְׂא֣וּ הַ/כְּרוּבִ֣ים אֶת כַּ֠נְפֵי/הֶם וַ/יֵּר֨וֹמּוּ מִן הָ/אָ֤רֶץ לְ/עֵינַ/י֙ בְּ/צֵאתָ֔/ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וַֽ/יַּעֲמֹ֗ד פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הַ/קַּדְמוֹנִ֔י וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/019.yaml
  text: Then the cherubim lifted up their wings and rose from the earth before my eyes as they went out[a], with the wheels beside them; and it stood at the entrance of the eastern gate of the house of Yahweh[c][b], and the glory of the God of Israel was above them, from above.
translation:
  language: pt
  text: Então os querubins ergueram suas asas e se elevaram da terra diante dos meus olhos, ao saírem, com as rodas ao lado deles[a]. E ficou à entrada do portão oriental da casa de Yahweh[b][c]; e a glória do Deus de Israel estava sobre eles, do alto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com as rodas diante deles” ou “alinhadas com eles”. A expressão hebraica indica uma posição correspondente.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido como “ficou” está no singular. O sujeito pode ser a estrutura composta do trono-carro, e não apenas os querubins.
    reason: alternative_reading
  - marker: c
    text: “Yahweh” representa o nome divino YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ הַכְּרוּבִים אֶת־כַּנְפֵיהֶם
  choice: os querubins levantaram as asas
  rationale: Mantém a ação concreta de נשׂא e a designação bíblica específica dos seres celestiais.
- source_word: וַיֵּרוֹמּוּ מִן־הָאָרֶץ
  choice: se elevaram da terra
  rationale: Expressa claramente o movimento ascendente sem impor uma causa externa não explicitada.
- source_word: לְעֵינַי בְּצֵאתָם
  choice: diante dos meus olhos, ao saírem
  rationale: Preserva tanto a perspectiva testemunhal de Ezequiel quanto a simultaneidade indicada pela construção temporal.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: com as rodas ao lado deles
  rationale: Comunica a posição correspondente das rodas em português natural; a possível nuance de oposição ou alinhamento é registrada em nota.
- source_word: וַיַּעֲמֹד
  choice: aquilo parou
  rationale: Preserva o singular masculino hebraico sem identificar indevidamente o sujeito como os querubins ou como uma pessoa; pode referir-se coletivamente à estrutura do trono-carro.
- source_word: פֶּתַח שַׁעַר בֵּית־יְהוָה הַקַּדְמוֹנִי
  choice: à entrada do portão oriental da casa de Yahweh
  rationale: Reproduz a imagem de casa/templo e entende קַדְמוֹנִי espacialmente como oriental.
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל עֲלֵיהֶם מִלְמָעְלָה
  choice: enquanto a glória do Deus de Israel estava sobre eles, lá no alto
  rationale: Mantém tanto עֲלֵיהֶם quanto o reforço adverbial מִלְמָעְלָה, evitando apagar a repetição espacial do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto, distinguindo-o de títulos e sem acrescentar uma interpretação denominacional.
- issue: Sujeito singular de וַיַּעֲמֹד
  choice: aquilo parou
  alternative: eles pararam; ele parou
  rationale: O verbo está no singular, embora os referentes anteriores sejam plurais. A formulação neutra conserva a tensão gramatical e permite que o referente seja a manifestação composta do trono-carro.
- issue: Reforço espacial מִלְמָעְלָה
  choice: lá no alto
  alternative: omitir por aparente redundância
  rationale: A expressão está presente no hebraico e intensifica a localização da glória; foi preservada em português compreensível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros. Conserva a imagética visionária, o singular inesperado do verbo e o reforço espacial final sem resolver silenciosamente suas ambiguidades.
