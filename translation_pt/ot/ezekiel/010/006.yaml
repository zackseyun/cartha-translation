base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/006.yaml
  text: And it happened[a], when he commanded the man clothed in linen, saying, “Take fire from between the wheelwork, from between the cherubim,” that he went in and stood beside the wheel.
translation:
  language: pt
  text: 'E aconteceu que, quando ele ordenou ao homem vestido de linho, dizendo: “Tire fogo de entre a estrutura de rodas[a], de entre os querubins”, o homem entrou e ficou em pé ao lado da roda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de entre a roda giratória”. O termo hebraico גַּלְגַּל pode indicar uma roda ou uma estrutura giratória de rodas nesta visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Reproduz a função narrativa da forma hebraica sem recorrer ao arcaico «e sucedeu».
- source_word: בְּצַוֺּתוֹ
  choice: quando ele ordenou
  rationale: O infinitivo com בְּ tem sentido temporal; mantém-se o pronome masculino sem explicitar um antecedente que o hebraico não repete.
- source_word: הָאִישׁ לְבֻשׁ הַבַּדִּים
  choice: o homem vestido de linho
  rationale: Formulação natural e digna que identifica a figura já conhecida da visão.
- source_word: קַח אֵשׁ
  choice: Pegue fogo
  rationale: Traduz diretamente o imperativo e o objeto, sem acrescentar uma quantidade não expressa.
- source_word: מִבֵּינוֹת לַגַּלְגַּל
  choice: do meio da estrutura de rodas
  rationale: No contexto da visão, גַּלְגַּל pode designar o conjunto ou mecanismo giratório; «estrutura de rodas» evita confundi-lo com אוֹפָן no fim do versículo.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: do meio dos querubins
  rationale: Conserva a repetição espacial enfática do hebraico em português natural.
- source_word: וַיָּבֹא
  choice: o homem entrou
  rationale: O contexto indica ingresso no espaço junto às rodas e aos querubins; a repetição de «o homem» evita a ambiguidade pronominal que surgiria em português.
- source_word: וַיַּעֲמֹד אֵצֶל הָאוֹפָן
  choice: ficou em pé ao lado da roda
  rationale: Mantém o singular de אוֹפָן e expressa com clareza tanto a postura quanto a relação espacial.
theological_decisions:
- issue: Identidade do sujeito que dá a ordem
  choice: Manter «ele» sem identificar a personagem
  alternative: Explicitar «o SENHOR» ou «aquele que estava no trono»
  rationale: A cláusula hebraica contém apenas um sufixo pronominal e não volta a nomear o sujeito; explicitá-lo resolveria interpretativamente uma referência que o texto deixa implícita.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém a solenidade narrativa sem arcaísmos. «Pegue» foi preferido a «tome» por clareza corrente; a repetição «o homem» esclarece a mudança de sujeito após a fala.
