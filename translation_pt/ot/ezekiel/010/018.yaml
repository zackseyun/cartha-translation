  text: וַ/יֵּצֵא֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַֽ/יַּעֲמֹ֖ד עַל הַ/כְּרוּבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/018.yaml
  text: Then the glory of Yahweh went out from above the threshold of the house and stood over the cherubim[a].
translation:
  language: pt
  text: Então a glória de Yahweh saiu de cima do limiar da casa[a] e se pôs sobre os querubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “templo”. Hebraico: “casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא descreve movimento para fora. “Saiu” preserva a ação concreta sem acrescentar a ideia teológica mais forte de abandono que “retirou-se” poderia sugerir.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Mantém a relação construta do hebraico e designa a glória manifesta de Yahweh na visão de Ezequiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵעַל
  choice: de cima de
  rationale: Expressa o afastamento de uma posição acima do limiar e conserva com naturalidade a imagem espacial da visão.
- source_word: מִפְתַּן
  choice: limiar
  rationale: É o termo português preciso e adequado ao registro para a soleira ou entrada do edifício.
- source_word: הַבָּיִת
  choice: a casa
  rationale: Preserva o termo concreto do hebraico, embora no contexto a referência seja ao templo.
- source_word: וַיַּעֲמֹד
  choice: se pôs
  rationale: Comunica que a glória passou a ocupar uma posição sobre os querubins; é natural em português e preserva o sentido de עמד sem sugerir simples repouso.
- source_word: עַל
  choice: sobre
  rationale: Representa de modo claro a relação espacial entre a glória e os querubins.
- source_word: הַכְּרוּבִים
  choice: os querubins
  rationale: Emprega a forma portuguesa tradicional para os seres específicos da visão de Ezequiel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o nome divino; “Yahweh” preserva-o como nome pessoal em vez de o substituir por um título.
- issue: Tradução de הַבָּיִת
  choice: a casa
  alternative: o templo
  rationale: Embora o referente contextual seja o templo, o hebraico diz literalmente “a casa”. O texto principal conserva essa formulação, e a nota esclarece a alternativa contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e a imagem espacial do hebraico foram preservadas sem tornar a frase excessivamente literal.
