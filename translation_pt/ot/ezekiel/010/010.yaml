  text: וּ/מַ֨רְאֵי/הֶ֔ם דְּמ֥וּת אֶחָ֖ד לְ/אַרְבַּעְתָּ֑/ם כַּ/אֲשֶׁ֛ר יִהְיֶ֥ה הָ/אוֹפַ֖ן בְּ/ת֥וֹךְ הָ/אוֹפָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/010.yaml
  text: As for their appearance[a], the four of them had one likeness[b], as when a wheel is within a wheel.
translation:
  language: pt
  text: 'Quanto à aparência delas, as quatro tinham a mesma forma[a]: era como uma roda dentro de outra roda.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma só forma para as quatro”; isto é, as quatro tinham aparência idêntica.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a roda dentro da roda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְאֵיהֶם
  choice: Quanto à aparência delas
  rationale: מַרְאֶה indica aparência ou forma visível. A construção topicalizada reproduz naturalmente a função discursiva da conjunção e explicita pelo gênero que o referente são as rodas do contexto.
- source_word: דְּמוּת אֶחָד
  choice: a mesma forma
  rationale: דְּמוּת pode significar semelhança, aspecto ou forma; com אֶחָד, destaca que as quatro possuíam uma configuração idêntica. Esta formulação é mais natural em português do que «uma semelhança».
- source_word: לְאַרְבַּעְתָּם
  choice: as quatro tinham
  rationale: A expressão aplica a única forma às quatro rodas. A construção portuguesa comunica com clareza esse valor compartilhado.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: era como
  rationale: A construção comparativa introduz uma analogia visual. «Era como» preserva a comparação em português corrente sem forçar o valor temporal do imperfeito hebraico.
- source_word: הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: uma roda dentro de outra roda
  rationale: Embora ambos os substantivos tenham artigo em hebraico, o português emprega naturalmente formas indefinidas nesta comparação; «outra roda» torna clara a relação entre as duas sem explicar a geometria da visão.
theological_decisions: []
