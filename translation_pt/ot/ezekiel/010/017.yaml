id: EZK.10.17
reference: Ezekiel 10:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/עָמְדָ֣/ם יַעֲמֹ֔דוּ וּ/בְ/רוֹמָ֖/ם יֵר֣וֹמּוּ אוֹתָ֑/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/017.yaml
  text: When they stood still[a], these stood still; and when they were lifted up, these were lifted up with them, for the spirit of the living creature was in them.
translation:
  language: pt
  text: Quando eles paravam, estas paravam; e, quando eles se elevavam, estas se elevavam com eles, pois o espírito do ser vivente estava nelas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o espírito de vida estava nelas”. A palavra hebraica traduzida como “espírito” também pode significar “sopro” ou “vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָמְדָם
  choice: quando eles paravam
  rationale: A preposição בְּ com o infinitivo construto e o sufixo de terceira pessoa do plural forma aqui uma oração temporal. “Paravam” comunica, no contexto, a interrupção do movimento.
- source_word: יַעֲמֹדוּ
  choice: estas paravam
  rationale: O sujeito implícito são as rodas, mencionadas no contexto; o demonstrativo feminino distingue as rodas dos seres viventes representados por “eles”.
- source_word: וּבְרוֹמָם
  choice: e, quando eles se elevavam
  rationale: A construção é paralela à primeira oração temporal e descreve movimento físico para cima, não exaltação honorífica.
- source_word: יֵרוֹמּוּ אוֹתָם
  choice: estas se elevavam com eles
  rationale: No contexto da visão, as rodas sobem juntamente com os seres viventes. “Com eles” expressa naturalmente a coordenação indicada pela construção hebraica incomum.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação do movimento coordenado e mantém um registro literário claro.
- source_word: רוּחַ
  choice: o espírito
  rationale: Pode significar espírito, sopro ou vento; neste contexto, “espírito” comunica melhor a força animadora ou orientadora, sem eliminar a amplitude semântica, registrada em nota.
- source_word: הַחַיָּה
  choice: do ser vivente
  rationale: Designa o ser visionário e pode ter valor singular coletivo. “Ser vivente” é digno, inteligível e evita a conotação cotidiana de “animal”.
- source_word: בָּהֶם
  choice: estava nelas
  rationale: Expressão locativa simples. O feminino em português concorda com “rodas”, referente contextual do pronome hebraico masculino.
theological_decisions:
- issue: Sentido de רוּחַ הַחַיָּה na visão
  choice: o espírito do ser vivente
  alternative: o espírito de vida; o sopro ou vento do ser vivente
  rationale: A leitura principal relaciona naturalmente o poder animador ao ser vivente e explica o movimento conjunto das rodas. A nota preserva a possibilidade de uma leitura mais abstrata e a polissemia de רוּחַ.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Os pronomes demonstrativos tornam explícita a alternância contextual entre os seres viventes (“eles”) e as rodas (“estas”), sem acrescentar os substantivos ao versículo.
