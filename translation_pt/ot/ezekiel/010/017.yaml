  source_fidelity: 'O texto reproduz adequadamente as duas ações coordenadas: quando os seres viventes paravam, as rodas também paravam; quando eles se elevavam, as rodas se elevavam com eles. “Pois” expressa corretamente o valor explicativo de כִּי, e “o espírito do ser vivente estava nelas” preserva a formulação singular/coletiva e a ambiguidade visionária de רוּחַ הַחַיָּה.'
