  text: הִ֣יא הַ/חַיָּ֗ה אֲשֶׁ֥ר רָאִ֛יתִי תַּ֥חַת אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּֽ/נְהַר כְּבָ֑ר וָ/אֵדַ֕ע כִּ֥י כְרוּבִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/020.yaml
  text: This was the living creature that I saw beneath the God of Israel by the Kebar Canal[a], and I knew that they were cherubim.
translation:
  language: pt
  text: Esta era a criatura vivente que vi debaixo do Deus de Israel, junto ao canal de Quebar[a], e reconheci que eram querubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao rio Quebar”; o termo hebraico pode designar um rio ou um canal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִיא הַחַיָּה
  choice: Este era o ser vivente
  rationale: O pronome feminino singular retoma o ser visionário já descrito. “Este era” funciona naturalmente como identificação retrospectiva, e “ser vivente” preserva o caráter sobrenatural sem sugerir um animal comum.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que eu tinha visto
  rationale: O mais-que-perfeito composto expressa com naturalidade que a visão junto ao Quebar antecedeu o reconhecimento narrado neste versículo.
- source_word: תַּחַת אֱלֹהֵי יִשְׂרָאֵל
  choice: debaixo do Deus de Israel
  rationale: Mantém a relação espacial da visão e o título definido “Deus de Israel”.
- source_word: בִּנְהַר כְּבָר
  choice: junto ao canal de Quebar
  rationale: נְהַר pode designar rio ou canal; no contexto babilônico, “canal” é geograficamente plausível. “Junto a” comunica o valor locativo, e “Quebar” segue uma transliteração portuguesa clara.
- source_word: וָאֵדַע
  choice: e reconheci
  rationale: Embora ידע signifique literalmente “saber/conhecer”, aqui descreve a identificação feita por Ezequiel; “reconheci” transmite esse sentido no contexto sem acrescentar conteúdo.
- source_word: כִּי כְרוּבִים הֵמָּה
  choice: que eram querubins
  rationale: כִּי introduz o conteúdo do reconhecimento. O plural “eram querubins” preserva a mudança do singular coletivo para a identificação plural dos seres.
theological_decisions:
- issue: Identificação dos seres do trono
  choice: Preservar a identificação explícita dos seres como “querubins”.
  alternative: Empregar apenas uma designação genérica, como “seres viventes”, sem destacar a identificação.
  rationale: O próprio versículo registra que Ezequiel reconheceu os seres vistos anteriormente como querubins; a tradução mantém esse desenvolvimento literário e teológico sem explicá-lo além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia visionária tradicional onde ela permanece clara. “Ser vivente” evita reduzir a figura a um animal comum; “querubins” conserva o termo bíblico corrente.
