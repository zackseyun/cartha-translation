revisions:
- from: Este era o ser vivente que eu tinha visto debaixo do Deus de Israel, junto ao canal de Quebar[a], e reconheci que eram querubins.
  to: Esta era a criatura vivente que vi debaixo do Deus de Israel, junto ao canal de Quebar[a], e reconheci que eram querubins.
  rationale: A revisão substitui uma formulação menos idiomática por “Esta era a criatura vivente”, conserva a terminologia visionária tradicional e troca o mais-que-perfeito por “vi”, correspondente mais direto do perfeito hebraico. Mantêm-se a ambiguidade lexical de נָהָר na nota e a identificação plural como “querubins”.
