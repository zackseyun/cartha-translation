base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/021.yaml
  text: Each one had four faces[a], and each one had four wings, and the likeness of human hands was under their wings.
translation:
  language: pt
  text: Cada um tinha quatro rostos e quatro asas, e debaixo das asas deles havia algo semelhante a mãos humanas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mãos de homem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה אַרְבָּעָה פָנִים לְאֶחָד
  choice: Cada um tinha quatro rostos
  rationale: A repetição distributiva do numeral, junto de לְאֶחָד, indica que cada criatura tinha quatro rostos; a formulação explicita esse sentido em português natural.
- source_word: וְאַרְבַּע כְּנָפַיִם לְאֶחָד
  choice: e quatro asas
  rationale: O sujeito distributivo “Cada um”, já expresso na primeira oração, continua valendo aqui e evita uma repetição pesada.
- source_word: וּדְמוּת
  choice: havia algo semelhante a
  rationale: דְּמוּת comunica semelhança, não necessariamente identidade exata. Esta construção preserva o caráter analógico da visão e completa naturalmente a oração nominal hebraica.
- source_word: יְדֵי אָדָם
  choice: mãos humanas
  rationale: אָדָם designa aqui a humanidade ou a forma humana, não especificamente um indivíduo do sexo masculino.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: debaixo das asas deles
  rationale: Mantém a relação espacial e deixa claro que as asas pertenciam às criaturas, sem sugerir que o possessivo retome as mãos.
theological_decisions:
- issue: Sentido de אָדָם em יְדֵי אָדָם
  choice: mãos humanas
  alternative: mãos de homem
  rationale: O contraste é entre a forma humana das mãos e os demais traços das criaturas, não uma afirmação sobre sexo masculino. “Humanas” expressa com precisão esse valor genérico.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Rostos” preserva o plural visionário; “algo semelhante a” mantém a linguagem cautelosa de comparação característica de Ezequiel. O marcador da nota foi colocado após “mãos humanas”, expressão à qual a variante lexical se refere.
