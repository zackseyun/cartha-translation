  naturalness: “Pátio externo”, “querubins” e “Deus Todo-Poderoso” são claros, dignos e naturais em português moderno. A repetição de “som” é idiomática neste versículo e preserva deliberadamente a repetição do hebraico.
  terminology: “Querubins” é a forma bíblica convencional. “Deus Todo-Poderoso” traduz apropriadamente אֵל שַׁדַּי como título, sem transformar Shaddai em nome próprio. A nota deve refletir “som”, e não “voz”, para corresponder ao texto hebraico e à tradução revista.
