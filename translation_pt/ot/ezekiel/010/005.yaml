  text: וְ/קוֹל֙ כַּנְפֵ֣י הַ/כְּרוּבִ֔ים נִשְׁמַ֕ע עַד הֶ/חָצֵ֖ר הַ/חִיצֹנָ֑ה כְּ/ק֥וֹל אֵל שַׁדַּ֖י בְּ/דַבְּרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/005.yaml
  text: And the sound of the wings of the cherubim was heard as far as the outer court[a], like the sound of God Almighty when he speaks.
translation:
  language: pt
  text: E o som das asas dos querubins foi ouvido até o pátio externo, como o som de Deus Todo-Poderoso quando ele fala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como o som de El Shaddai quando ele fala”. Aqui, “El Shaddai” é traduzido como “Deus Todo-Poderoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹל
  choice: E o som
  rationale: קוֹל pode significar “som” ou “voz”. Como primeiro se refere às asas, “som” é a opção natural; o וְ mantém a sequência narrativa.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: das asas dos querubins
  rationale: Preserva a imagem concreta e emprega “querubins”, forma bíblica convencional em português.
- source_word: נִשְׁמַע עַד
  choice: era ouvido até
  rationale: O nifal de שׁמע tem sentido passivo, e עַד indica o alcance do som. O imperfeito contextual é expresso naturalmente por “era ouvido”.
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: o pátio externo
  rationale: חָצֵר designa pátio ou átrio; “pátio externo” é claro para leitores comuns e adequado ao espaço do templo.
- source_word: כְּקוֹל
  choice: como a voz
  rationale: Na comparação com a fala divina, קוֹל admite naturalmente “voz”; isso mantém a repetição semântica do hebraico, embora varie a palavra em português conforme o referente.
- source_word: אֵל שַׁדַּי
  choice: Deus Todo-Poderoso
  rationale: Traduz o título divino em linguagem portuguesa consolidada e compreensível, sem tratar שַׁדַּי como nome próprio.
- source_word: בְּדַבְּרוֹ
  choice: quando ele fala
  rationale: A preposição בְּ com o infinitivo construto e sufixo exprime circunstância temporal; o presente caracteriza a voz divina na comparação.
theological_decisions:
- issue: Tradução do título divino אֵל שַׁדַּי
  choice: Deus Todo-Poderoso
  alternative: El Shaddai
  rationale: O título é traduzido para comunicar seu sentido tradicional, enquanto a nota preserva a forma hebraica e reconhece a alternativa de transliteração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pátio externo” evita um termo excessivamente técnico; “voz” no segundo uso de קוֹל combina naturalmente com “fala” e preserva a força da comparação.
