base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/022.yaml
  text: And the likeness of their faces was the same as the faces that I had seen by the Kebar River—their appearances and themselves[b][a]. Each one went straight ahead.
translation:
  language: pt
  text: A semelhança dos rostos deles era a dos rostos que eu tinha visto junto ao rio Quebar; seus aspectos e eles próprios eram os mesmos.[a] Cada um seguia diretamente em frente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os aspectos deles e eles próprios”, expressão condensada que enfatiza que eram as mesmas criaturas vistas anteriormente junto ao rio Quebar.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “cada um ia na direção do seu rosto”, isto é, avançava sem se virar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: A semelhança
  rationale: Preserva o vocabulário visionário recorrente de Ezequiel e o sentido de forma ou correspondência visual, sem reduzi-lo a mera impressão subjetiva.
- source_word: פְּנֵיהֶם / הַפָּנִים
  choice: dos rostos deles ... dos rostos
  rationale: Mantém a imagem concreta dos rostos das criaturas viventes, em vez de substituir o termo por uma abstração como “aparência”.
- source_word: הֵמָּה
  choice: era a mesma
  rationale: Expressa em português corrente a relação enfática de identidade estabelecida pelo pronome hebraico no contexto.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que eu tinha visto
  rationale: O mais-que-perfeito composto indica naturalmente que a visão junto ao Quebar ocorreu antes da cena narrada.
- source_word: עַל נְהַר כְּבָר
  choice: junto ao rio Quebar
  rationale: “Junto ao” comunica com naturalidade a localização indicada por עַל, e “Quebar” segue a forma portuguesa corrente do nome próprio.
- source_word: מַרְאֵיהֶם וְאוֹתָם
  choice: eram os mesmos tanto no aspecto como em si próprios
  rationale: 'Torna inteligível a formulação hebraica condensada e conserva sua ênfase: não apenas o aspecto, mas as próprias criaturas eram as mesmas da visão anterior.'
- source_word: אִישׁ אֶל עֵבֶר פָּנָיו יֵלֵכוּ
  choice: Cada um seguia diretamente para a frente
  rationale: Traduz o idiomatismo de ir na direção para a qual o rosto aponta, isto é, avançar sem se virar nem desviar.
