revisions:
- from: A semelhança dos rostos deles era a mesma dos rostos que eu tinha visto junto ao rio Quebar; eram os mesmos tanto no aspecto como em si próprios.[a] Cada um seguia diretamente para a frente.[b]
  to: A semelhança dos rostos deles era a dos rostos que eu tinha visto junto ao rio Quebar; seus aspectos e eles próprios eram os mesmos.[a] Cada um seguia diretamente em frente.[b]
  rationale: A revisão conserva o sentido da tradução proposta, mas aproxima a redação da coordenação enfática do hebraico em “seus aspectos e eles próprios”, usando o plural exigido por מַרְאֵיהֶם. Também torna a última oração mais idiomática em português, sem perder a ideia de movimento em linha reta.
