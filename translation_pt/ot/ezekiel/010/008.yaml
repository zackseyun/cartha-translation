  text: וַ/יֵּרָ֖א לַ/כְּרֻבִ֑ים תַּבְנִית֙ יַד אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/008.yaml
  text: And the cherubim appeared to have the form of a human hand under their wings[a].
translation:
  language: pt
  text: E nos querubins apareceu a forma de uma mão humana debaixo de suas asas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mão de homem”. Literalmente, “a forma de uma mão de homem”.'
    reason: Registra a forma mais literal de יַד אָדָם e sua possível tradução alternativa.
lexical_decisions:
- source_word: וַיֵּרָא לַכְּרֻבִים
  choice: nos querubins apareceu
  rationale: A construção com o nifal de ראה e ל descreve aquilo que se tornou visível nos querubins. Esta formulação preserva a percepção visual e evita transformar os querubins, de modo mais interpretativo, no sujeito de “pareciam ter”.
- source_word: תַּבְנִית
  choice: a forma de
  rationale: תַּבְנִית indica forma, configuração ou semelhança visível; “a forma de” é clara e adequada ao contexto da visão.
- source_word: יַד אָדָם
  choice: uma mão humana
  rationale: Literalmente, “mão de homem/ser humano”. Em português, “mão humana” expressa naturalmente o contraste anatômico pretendido, sem sugerir que a mão pertencesse a um homem específico.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: debaixo de suas asas
  rationale: Tradução espacial direta e idiomática; o pronome retoma os querubins.
theological_decisions:
- issue: Sentido de אָדָם na descrição anatômica visionária
  choice: uma mão humana
  alternative: uma mão de homem
  rationale: Aqui אָדָם identifica a forma da mão como humana, em contraste com a natureza dos querubins, e não necessariamente o sexo ou a identidade de um indivíduo. “Mão humana” comunica esse sentido de modo natural, enquanto a alternativa mais literal permanece registrada.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima à estrutura hebraica. “Querubins” segue o plural corrente em português; “debaixo de” é natural e preserva a relação espacial.
