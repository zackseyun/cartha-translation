  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה אֶל הָ/רָקִ֨יעַ֙ אֲשֶׁר֙ עַל רֹ֣אשׁ הַ/כְּרֻבִ֔ים כְּ/אֶ֣בֶן סַפִּ֔יר כְּ/מַרְאֵ֖ה דְּמ֣וּת כִּסֵּ֑א נִרְאָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/001.yaml
  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
translation:
  language: pt
  text: Então olhei, e eis que, sobre a expansão que estava acima das cabeças dos querubins, apareceu acima deles algo semelhante a uma pedra de safira[a], com a aparência da semelhança de um trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “uma pedra de lápis-lazúli”. O termo hebraico tradicionalmente traduzido por “safira” talvez designe uma pedra preciosa azul-escura identificada de outra forma na mineralogia moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Então olhei
  rationale: O waw consecutivo faz a narrativa avançar; “Então olhei” expressa com naturalidade a sequência e mantém o relato visual em primeira pessoa.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: A expressão chama vividamente a atenção para o que surge na visão e preserva o tom profético solene.
- source_word: הָרָקִיעַ
  choice: a expansão
  rationale: No cenário da visão do trono, designa a superfície ou plataforma estendida acima dos seres viventes. “Expansão” preserva a imagem concreta sem recorrer ao termo mais arcaico “firmamento”.
- source_word: אֲשֶׁר עַל רֹאשׁ הַכְּרֻבִים
  choice: que estava acima da cabeça dos querubins
  rationale: Reproduz a localização espacial e conserva o singular coletivo רֹאשׁ do hebraico.
- source_word: הַכְּרֻבִים
  choice: os querubins
  rationale: É a forma bíblica tradicional e amplamente reconhecida em português para essa classe de seres celestiais.
- source_word: כְּאֶבֶן סַפִּיר
  choice: algo semelhante a uma pedra de safira
  rationale: A formulação explicita de modo natural a comparação visionária. “Safira” mantém a tradução tradicional, enquanto a possível identificação como lápis-lazúli é registrada em nota.
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  choice: com a aparência da semelhança de um trono
  rationale: Mantém a acumulação deliberada de termos comparativos, que apresenta a realidade vista de modo aproximativo, sem identificá-la diretamente como um trono.
- source_word: נִרְאָה
  choice: apareceu
  rationale: Traduz naturalmente a forma nifal como aquilo que se tornou visível, mantendo o foco no fenômeno contemplado.
- source_word: עֲלֵיהֶם
  choice: acima deles
  rationale: O pronome retoma os querubins, e a expressão preserva a orientação vertical da visão.
theological_decisions:
- issue: Linguagem visionária e grau de identificação
  choice: 'Preservar as comparações sobrepostas: “algo semelhante... com a aparência da semelhança de um trono”.'
  alternative: Simplificar para “havia acima deles um trono de safira”.
  rationale: O hebraico evita identificar diretamente o objeto contemplado e acumula termos de aproximação. A tradução conserva essa reserva e a transcendência próprias do relato visionário.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a repetição espacial nem as camadas comparativas do hebraico. O marcador da nota foi colocado junto de “safira”, termo ao qual a nota lexical se refere.
