  text: וְ/הַ/כְּרֻבִ֗ים עֹֽמְדִ֛ים מִ/ימִ֥ין לַ/בַּ֖יִת בְּ/בֹא֣/וֹ הָ/אִ֑ישׁ וְ/הֶ/עָנָ֣ן מָלֵ֔א אֶת הֶ/חָצֵ֖ר הַ/פְּנִימִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/003.yaml
  text: The cherubim were standing on the right side of the house when the man went in[a], and the cloud filled the inner court.
translation:
  language: pt
  text: Os querubins estavam de pé do lado direito do templo[a] quando o homem entrou, e a nuvem encheu o pátio interno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do lado direito da casa”. Na orientação do templo, isso corresponde ao lado sul.'
    reason: Esclarece a referência espacial sem substituir no texto principal a formulação literal do hebraico.
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: os querubins
  rationale: Mantém o termo tradicional e reconhecível para esses seres celestiais, preservando o artigo definido e o plural.
- source_word: עֹמְדִים
  choice: estavam parados
  rationale: O particípio descreve uma postura contínua na cena; a construção progressiva-estativa em português expressa melhor essa duração.
- source_word: מִימִין לַבַּיִת
  choice: do lado direito do templo
  rationale: Preserva a expressão direcional do hebraico, literalmente relacionada ao lado direito, sem substituir no texto principal a referência explícita por sua interpretação espacial como lado sul. “Templo” comunica naturalmente o referente de הַבַּיִת neste contexto.
- source_word: בְּבֹאוֹ הָאִישׁ
  choice: quando o homem entrou
  rationale: O infinitivo construto com בְּ tem valor temporal. A formulação é natural em português e mantém a referência simples a “o homem”.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Não acrescenta no texto principal a identificação contextual como o homem vestido de linho, pois o hebraico deste versículo diz apenas “o homem”.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: Tradução direta com o artigo definido; a associação contextual com a glória divina não é explicitada no substantivo.
- source_word: מָלֵא
  choice: encheu
  rationale: O qatal apresenta a ação como completa e faz avançar a narrativa.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: o pátio interno
  rationale: Expressão clara e corrente para a área interna do complexo do templo, preservando a distinção espacial indicada pelo adjetivo.
theological_decisions:
- issue: Sentido direcional de מִימִין no contexto do templo
  choice: do lado direito do templo, com nota explicativa
  alternative: do lado sul do templo
  rationale: O texto hebraico diz “direito”, enquanto a orientação do templo permite entender esse lado como o sul. A tradução mantém a forma lexical e a nota informa a referência espacial sem eliminar a tensão interpretativa.
- issue: Identificação do homem
  choice: o homem
  alternative: o homem vestido de linho
  rationale: A identificação ampliada vem do contexto anterior, mas não é repetida no hebraico deste versículo; por isso, evita-se inseri-la no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Usa “querubins” como termo bíblico estabelecido, “templo” para tornar explícito o referente contextual de “casa” e “pátio interno” como linguagem arquitetônica corrente.
