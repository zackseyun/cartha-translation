  naturalness: «Estavam parados» pode sugerir que os querubins tinham cessado de se mover, em vez de descrever simplesmente sua posição. «Estavam de pé» é a formulação portuguesa mais natural para a postura durativa expressa pelo particípio.
  terminology: «Querubins», «o homem», «a nuvem» e «pátio interno» são claros, dignos e adequados. A nota direcional é útil, desde que diferencie a formulação hebraica («casa») da explicitação contextual adotada no texto («templo»).
