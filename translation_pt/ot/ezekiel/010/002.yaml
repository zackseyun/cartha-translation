base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/002.yaml
  text: And he said to the man clothed in linen[a], “Go in among the wheelwork, under the cherub, and fill your hands with coals of fire from among the cherubim, and scatter them over the city.” And he went in before my eyes.
translation:
  language: pt
  text: 'Então ele disse ao homem vestido de linho: “Entre no meio da estrutura de rodas[a], debaixo do querubim, encha as mãos com brasas de fogo tiradas do meio dos querubins e espalhe-as sobre a cidade”. E ele entrou diante dos meus olhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre as rodas”. O termo hebraico também pode se referir coletivamente ao conjunto formado pelas rodas, e não a uma única roda.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשׁ הַבַּדִּים
  choice: vestido de linho
  rationale: Identifica a figura por sua indumentária com uma expressão natural e digna em português, sem acrescentar elementos ausentes do hebraico.
- source_word: בֵּינוֹת לַגַּלְגַּל
  choice: no meio da estrutura de rodas
  rationale: גַּלְגַּל pode designar coletivamente o conjunto de rodas da carruagem-trono. A formulação preserva esse sentido possível sem ocultar a alternativa mais literal, registrada em nota.
- source_word: אֶל תַּחַת לַכְּרוּב
  choice: debaixo do querubim
  rationale: Mantém tanto a relação espacial quanto o singular do texto hebraico.
- source_word: וּמַלֵּא חָפְנֶיךָ
  choice: encha as mãos
  rationale: Expressa de modo idiomático o conteúdo das duas mãos juntas ou em concha, sem explicitação desnecessária.
- source_word: גַחֲלֵי אֵשׁ
  choice: brasas de fogo
  rationale: Preserva a imagem concreta e a construção enfática do hebraico, sem decidir se a ênfase recai nas brasas ou em seu estado incandescente.
- source_word: מִבֵּינוֹת לַכְּרֻבִים
  choice: tiradas do meio dos querubins
  rationale: Torna explícita em português a origem das brasas indicada pela preposição hebraica, mantendo o sentido espacial.
- source_word: וּזְרֹק עַל הָעִיר
  choice: espalhe-as sobre a cidade
  rationale: O pronome retoma naturalmente as brasas, objeto implícito em hebraico, e 'espalhe' comunica sua dispersão sobre a cidade.
- source_word: לְעֵינָי
  choice: diante dos meus olhos
  rationale: Conserva de perto a expressão hebraica e ressalta a perspectiva de testemunha ocular do profeta.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: disse
  rationale: A repetição hebraica introduz a fala, mas sua reprodução literal seria pesada e pouco natural em português; um único verbo comunica adequadamente a função da construção.
theological_decisions:
- issue: Natureza do ato de espalhar as brasas
  choice: Apresentar diretamente a ordem e sua imagem de juízo, sem explicar seu simbolismo no texto principal.
  alternative: Explicitar uma possível dimensão de purificação além do juízo.
  rationale: O contexto associa o ato ao juízo sobre Jerusalém, mas este versículo não interpreta expressamente as brasas. A tradução mantém a tensão simbólica sem impor uma leitura teológica adicional.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conservam-se a linguagem visionária, o singular “querubim” e a perspectiva ocular de Ezequiel; evita-se uma reprodução pouco natural da repetição de “disse”.
