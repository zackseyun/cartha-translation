review_pass:
  verdict: revise
  source_fidelity: A primeira frase preserva as quatro direções e a repetição de não se virarem. Contudo, «podiam seguir» introduz uma nuance de capacidade que o imperfeito hebraico não exige. Na segunda frase, «Seguiam para onde quer que a cabeça estivesse voltada» deixa de explicitar אַחֲרָיו, isto é, que seguiam a cabeça.
  naturalness: O texto é claro e de registro adequado. A revisão proposta mantém a fluência e torna explícita a relação expressa no hebraico sem identificar interpretativamente «a cabeça».
  terminology: «Cabeça» é uma reprodução apropriada de הָרֹאשׁ e conserva sua referência aberta. «Viravam-se» comunica bem a ausência de mudança de direção/orientação.
  issues:
  - severity: medium
    issue: «podiam seguir» acrescenta modalidade de capacidade.
    rationale: יִלְכוּ, no quadro descritivo do versículo, exprime o movimento habitual/iterativo, não a capacidade de mover-se; «iam» é mais direto.
  - severity: medium
    issue: A tradução omite o complemento de «seguiam» correspondente a אַחֲרָיו («atrás dele/dela»).
    rationale: O hebraico afirma que eles iam seguindo a cabeça para o lugar para o qual ela se voltava. Explicitá-lo como «seguiam a cabeça» preserva o vínculo sem resolver a ambiguidade de referente.
  revised_text: Quando avançavam, iam em qualquer uma das quatro direções; não se viravam enquanto avançavam, pois seguiam a cabeça para onde ela se voltava; não se viravam enquanto avançavam.
