base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/011.yaml
  text: When they went, they would go in any of their four directions; they did not turn as they went, for to the place where the head faced, they followed after it; they did not turn as they went.
translation:
  language: pt
  text: Quando avançavam, iam em qualquer uma das quatro direções; não se viravam enquanto avançavam, pois seguiam a cabeça para onde ela se voltava; não se viravam enquanto avançavam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל אַרְבַּעַת רִבְעֵיהֶם
  choice: em qualquer uma das quatro direções
  rationale: Expressa de modo natural que o movimento podia ocorrer para qualquer dos quatro lados correspondentes, sem exigir que as rodas se virassem.
- source_word: הָרֹאשׁ
  choice: a cabeça
  rationale: Mantém o sentido concreto e a ambiguidade referencial do hebraico, sem substituir por uma interpretação como “a parte da frente” ou “o querubim”.
- source_word: אַחֲרָיו יֵלֵכוּ
  choice: Seguiam
  rationale: No contexto, indica que os demais acompanhavam a direção da cabeça; a formulação evita o português pouco natural “seguiam atrás dela” sem acrescentar uma identificação não explícita.
- source_word: לֹא יִסַּבּוּ בְּלֶכְתָּם
  choice: não se viravam enquanto avançavam
  rationale: Preserva a repetição enfática e distingue mudar a orientação de simplesmente deslocar-se.
