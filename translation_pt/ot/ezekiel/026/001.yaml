  text: וַ/יְהִ֛י בְּ/עַשְׁתֵּֽי עֶשְׂרֵ֥ה שָׁנָ֖ה בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/001.yaml
  text: And it happened in the eleventh year[a], on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'No décimo primeiro ano, no primeiro dia do mês, a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: No décimo primeiro ano... a palavra... veio
  rationale: O wayyiqtol introduz um novo episódio profético datado. Em português, a construção temporal seguida diretamente da oração principal é natural e evita o pouco idiomático «e aconteceu que».
- source_word: בְּעַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: No décimo primeiro ano
  rationale: Reproduz com clareza a fórmula hebraica de datação.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: A expressão é literalmente «no primeiro do mês», fórmula usual que designa o primeiro dia; explicitar «dia» dá clareza em português sem alterar o sentido.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: a palavra de Yahweh veio a mim
  rationale: Embora הָיָה signifique literalmente «foi/aconteceu», esta fórmula profética indica que a palavra divina chegou ao profeta; «veio a mim» é idiomático e preserva essa imagem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de o substituir por um título.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz a fala direta que continua no versículo seguinte; os dois-pontos cumprem naturalmente essa função em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém o nome divino, não um título. «Yahweh» é uma transliteração amplamente reconhecida e mais próxima da reconstrução acadêmica usual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A fórmula narrativa inicial foi integrada à oração principal, e a cadência profética foi preservada.
