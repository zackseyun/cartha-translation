base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/015.yaml
  text: 'Thus says the Lord GOD to Tyre: Will not the coastlands quake at the sound of your fall[a], when the wounded groan[b], when the slaughter is carried out in your midst?'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh a Tiro: “Acaso as regiões costeiras[a] não tremerão ao som da sua queda, quando os feridos[b] gemerem, quando houver matança em seu meio?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as ilhas”. O termo hebraico pode designar ilhas ou, de modo mais amplo, regiões costeiras e terras marítimas.
    reason: lexical_alternative
  - marker: b
    text: “Os feridos” também pode ser traduzido por “os mortos” ou “os traspassados”. O termo hebraico pode indicar alguém traspassado ou mortalmente ferido; aqui, “os feridos” combina melhor com o fato de gemerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva o título אֲדֹנָי e representa diretamente o nome divino יהוה como “Yahweh”, evitando a formulação pouco natural “Senhor SENHOR”.
- source_word: לְצוֹר
  choice: a Tiro
  rationale: Emprega a forma portuguesa tradicional do nome da cidade fenícia.
- source_word: הֲלֹא
  choice: Acaso ... não
  rationale: Mantém a pergunta retórica hebraica, que espera resposta afirmativa, em português natural.
- source_word: מִקּוֹל מַפַּלְתֵּךְ
  choice: com o estrondo da sua queda
  rationale: קול pode indicar som, ruído ou estrondo; “estrondo” comunica naturalmente o impacto audível da queda da cidade, enquanto “com” expressa a causa ou ocasião do tremor.
- source_word: בֶּאֱנֹק חָלָל
  choice: quando os feridos gemerem
  rationale: Transforma o infinitivo hebraico em oração temporal natural. חָלָל pode designar alguém traspassado, ferido mortalmente ou morto; o ato de gemer favorece “feridos” no texto principal.
- source_word: בֵּהָרֵג הֶרֶג
  choice: a matança ocorrer
  rationale: A construção com infinitivo e substantivo cognato intensifica o ato de matar. “A matança ocorrer” preserva a violência enfática sem reproduzir uma redundância pouco natural em português.
- source_word: בְּתוֹכֵךְ
  choice: no meio de você
  rationale: Conserva a personificação e o tratamento direto da cidade, marcada no hebraico como feminino singular.
- source_word: יִרְעֲשׁוּ
  choice: tremerão
  rationale: Abrange tanto o abalo quanto a reação de temor sugeridos pelo verbo.
- source_word: הָאִיִּים
  choice: as regiões costeiras
  rationale: No contexto profético e marítimo, אִיִּים pode abranger ilhas, litorais e terras marítimas; “regiões costeiras” comunica melhor esse alcance amplo.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha mantém distinguíveis o título אֲדֹנָי e o nome divino יהוה, de acordo com a orientação fornecida, sem acrescentar uma interpretação denominacional.
- issue: Estado das vítimas designadas por חָלָל
  choice: os feridos
  alternative: os mortos / os que foram traspassados
  rationale: O campo semântico inclui vítimas fatalmente feridas ou mortas, mas a menção de gemidos favorece pessoas ainda vivas; a ambiguidade lexical é preservada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com pergunta retórica preservada. “No meio de você” mantém o discurso direto dirigido à cidade e soa mais corrente do que “em seu meio”. Os marcadores foram colocados junto aos termos aos quais as notas realmente se referem.
