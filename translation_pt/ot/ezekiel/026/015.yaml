  terminology: “O Senhor Yahweh” distingue apropriadamente o título אַדֹנָי do nome divino יהוה. “Regiões costeiras” é uma opção defensável para הָאִיִּים, com nota para “ilhas”. “Feridos” é contextual e apropriadamente qualificado pela nota.
