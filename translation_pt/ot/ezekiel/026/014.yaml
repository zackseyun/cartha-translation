  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/נְתַתִּ֞י/ךְ לִ/צְחִ֣יחַ סֶ֗לַע מִשְׁטַ֤ח חֲרָמִים֙ תִּֽהְיֶ֔ה לֹ֥א תִבָּנֶ֖ה ע֑וֹד כִּ֣י אֲנִ֤י יְהוָה֙ דִּבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
translation:
  language: pt
  text: E farei de você uma rocha nua; você será um lugar para estender redes de pesca. Não será mais reconstruída, pois eu, Yahweh[a], falei — declaração do Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz aqui o nome divino YHWH; tradicionalmente, muitas traduções o representam por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתִּיךְ
  choice: Eu farei de você
  rationale: Neste contexto, נתן seguido de complemento predicativo expressa a transformação de Tiro. A formulação comunica isso com naturalidade em português.
- source_word: לִצְחִיחַ סֶלַע
  choice: uma rocha nua
  rationale: A expressão descreve uma superfície rochosa despojada, exposta ou estéril. “Rocha nua” preserva a imagem concreta da remoção completa da cidade.
- source_word: מִשְׁטַח חֲרָמִים
  choice: um lugar para estender redes
  rationale: מִשְׁטַח indica uma superfície ou lugar de estender, e חֲרָמִים designa redes de pesca. A tradução mantém a imagem e soa natural.
- source_word: תִּהְיֶה
  choice: você será
  rationale: O futuro simples de היה liga Tiro ao predicativo seguinte. O pronome “você” oferece ampla legibilidade brasileira sem obscurecer que a cidade é a destinatária.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: Não será mais reconstruída
  rationale: O nifal de בנה tem sentido passivo, “ser reconstruída”, e עוֹד significa “mais, novamente”. A redação preserva a força temporal sem acrescentar uma formulação mais absoluta do que o hebraico.
- source_word: כִּי אֲנִי יְהוָה דִּבַּרְתִּי
  choice: pois eu, Yahweh, falei
  rationale: כִּי apresenta o fundamento da certeza do anúncio. O perfeito דִּבַּרְתִּי é vertido solenemente como “falei”, e o nome divino é transliterado.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם introduz a fórmula profética de declaração. “Senhor Yahweh” representa distintamente אֲדֹנָי e o nome próprio יְהוִה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva o caráter de nome próprio do tetragrama e evita substituí-lo silenciosamente por um título.
- issue: Representação da fórmula אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: 'A tradução conserva os dois elementos do hebraico: o título אֲדֹנָי e o nome divino יְהוִה. A alternativa tradicional evita a repetição de títulos, mas deixa menos explícito o nome próprio.'
translation_notes:
  register: Português moderno, digno e de leitura amplamente acessível, com preferência por “você” para a cidade personificada. A ordem e as imagens do hebraico foram mantidas sem rigidez artificial; “não será mais reconstruída” conserva a passiva e o valor temporal de עוֹד.
