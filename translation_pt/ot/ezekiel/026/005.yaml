base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/005.yaml
  text: She will become a place for spreading nets in the midst of the sea[a], for I have spoken, declares the Lord GOD, and she will become plunder for the nations.
translation:
  language: pt
  text: Ela se tornará um lugar para estender redes no meio do mar[a], pois eu falei, declara o Senhor Yahweh, e ela se tornará despojo para as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma superfície onde se estendem redes de pesca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁטַח חֲרָמִים
  choice: um lugar para estender redes
  rationale: מִשְׁטַח designa um lugar ou superfície onde algo é estendido; com חֲרָמִים, forma uma expressão referente ao local onde redes de pesca são abertas, provavelmente para secar. A formulação é natural em português e conserva a imagem.
- source_word: בְּתוֹךְ הַיָּם
  choice: no meio do mar
  rationale: Tradução direta e corrente da expressão espacial, mantendo 'mar' e o cenário marítimo da profecia.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: pois eu falei
  rationale: O perfeito fundamenta a certeza do juízo na palavra já proferida por Deus; 'pois eu falei' preserva de modo conciso essa relação.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם é uma fórmula profética que pode ser expressa nominalmente como 'declaração'. 'Yahweh' representa diretamente o nome divino, enquanto אֲדֹנָי é traduzido por 'Senhor'.
- source_word: וְהָיְתָה לְבַז
  choice: e se tornará despojo
  rationale: A construção indica que Tiro será entregue como presa de guerra. 'Despojo' é claro, digno e adequado ao contexto de saque pelas nações.
- source_word: לַגּוֹיִם
  choice: para as nações
  rationale: גּוֹיִם refere-se aqui aos povos ou nações que saquearão Tiro, sem exigir o sentido teológico posterior de 'gentios'.
- source_word: תִּהְיֶה ... וְהָיְתָה
  choice: Ela se tornará ... e se tornará
  rationale: Os verbos femininos retomam Tiro, cidade personificada no contexto. O pronome 'ela' preserva essa personificação em português.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A tradução mantém distintos o título אֲדֹנָי ('Senhor') e o nome próprio יְהוִה ('Yahweh'), evitando ocultar o nome divino ou produzir a repetição 'Senhor SENHOR'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação feminina de Tiro foi mantida. Os travessões delimitam a fórmula profética sem alterar sua relação sintática com a afirmação precedente.
