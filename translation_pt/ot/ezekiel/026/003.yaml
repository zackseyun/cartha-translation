base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/003.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against you, Tyre, and I will bring up many nations against you, as the sea brings up its waves.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh[a]: “Eis que estou contra você, Tiro, e farei subir contra você muitas nações, como o mar faz subir as suas ondas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Senhor Yahweh” (אֲדֹנָי יְהוִה). Yahweh representa o nome divino YHWH.'
    reason: Esclarece a composição do título divino e a representação do Tetragrama.
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a inferência que liga este anúncio de juízo ao contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em registro solene e reconhecível.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos do título composto e translitera o nome divino, evitando a repetição artificial 'Senhor SENHOR'.
- source_word: הִנְנִי עָלַיִךְ
  choice: Eis que estou contra você
  rationale: Mantém a ênfase solene de הִנְנִי e explicita o sentido hostil de עַל neste contexto de juízo.
- source_word: צֹר
  choice: Tiro
  rationale: Forma portuguesa consagrada do nome da cidade fenícia.
- source_word: וְהַעֲלֵיתִי עָלַיִךְ
  choice: e farei muitas nações avançarem contra você
  rationale: O hifil de עלה indica fazer subir ou avançar; 'avançarem' comunica naturalmente o movimento militar sem perder a ligação imagética com as ondas.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: É a correspondência adequada no contexto de forças internacionais mobilizadas contra Tiro.
- source_word: כְּהַעֲלוֹת הַיָּם לְגַלָּיו
  choice: como o mar faz subir as suas ondas
  rationale: Preserva a construção causativa e a imagem de ondas sucessivas levantadas pelo mar.
theological_decisions:
- issue: Representação do nome divino יְהוָה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida preserva tanto אֲדֹנָי, 'Senhor', quanto o nome pessoal divino YHWH, sem fundi-los nem produzir 'Senhor SENHOR'.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva a fórmula profética e a metáfora marítima, dirigindo-se à cidade personificada no feminino hebraico mediante o nome vocativo 'Tiro', sem tornar o gênero gramatical explícito em português.
