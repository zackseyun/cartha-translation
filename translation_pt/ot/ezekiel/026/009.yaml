  yaml_path: translation/ot/ezekiel/026/009.yaml
  text: He will direct the blow of his battering ram against your walls[a], and with his axes he will tear down your towers.
translation:
  language: pt
  text: Ele dirigirá contra as suas muralhas o golpe do seu aríete e derrubará as suas torres com as suas espadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «com os seus machados» ou «com as suas ferramentas de ferro», caso a expressão seja entendida de modo mais geral como referência a instrumentos de demolição usados no cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחִי
  choice: golpe
  rationale: O substantivo designa um golpe ou impacto; «golpe» preserva de modo natural a imagem do ataque.
- source_word: קָבַלּוֹ
  choice: seu aríete
  rationale: No contexto do cerco, refere-se a um engenho empregado para golpear muralhas; «aríete» é o termo português claro e específico.
- source_word: יִתֵּן
  choice: dirigirá
  rationale: Embora o verbo signifique literalmente «dará/porá», aqui descreve a aplicação do golpe contra a muralha; «dirigirá» comunica essa ação de modo idiomático.
- source_word: בְּחֹמוֹתַיִךְ
  choice: contra as suas muralhas
  rationale: A preposição, no contexto de um golpe hostil, é naturalmente expressa por «contra»; «muralhas» identifica as fortificações da cidade.
- source_word: וּמִגְדְּלֹתַיִךְ
  choice: as suas torres
  rationale: O substantivo indica as torres defensivas da cidade.
- source_word: יִתֹּץ
  choice: derrubará
  rationale: O verbo significa demolir ou pôr abaixo; «derrubará» é corrente, vívido e adequado à destruição durante um cerco.
- source_word: בְּחַרְבוֹתָיו
  choice: com as suas espadas
  rationale: O texto massorético traz a forma normalmente entendida como «suas espadas». A dificuldade contextual de derrubar torres com espadas é preservada, em vez de ser resolvida silenciosamente, e a alternativa instrumental é registrada em nota.
