  text: וְֽ/יָרְד֞וּ מֵ/עַ֣ל כִּסְאוֹתָ֗/ם כֹּ֚ל נְשִׂיאֵ֣י הַ/יָּ֔ם וְ/הֵסִ֨ירוּ֙ אֶת מְעִ֣ילֵי/הֶ֔ם וְ/אֶת בִּגְדֵ֥י רִקְמָתָ֖/ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת יִלְבָּ֨שׁוּ֙ עַל הָ/אָ֣רֶץ יֵשֵׁ֔בוּ וְ/חָֽרְדוּ֙ לִ/רְגָעִ֔ים וְ/שָׁמְמ֖וּ עָלָֽיִ/ךְ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/016.yaml
  text: Then all the princes of the sea will come down from their thrones[a], remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble moment by moment[b], and be appalled at you.
translation:
  language: pt
  text: Então todos os príncipes do mar[a] descerão de seus tronos, tirarão seus mantos e se despirão de suas roupas bordadas. Vestir-se-ão de tremores[b], sentarão no chão, tremerão a cada momento e ficarão horrorizados por sua causa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os líderes do mar”. A expressão hebraica é literalmente “todos os príncipes do mar” e se refere a governantes marítimos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “vestirão tremores”, uma imagem vívida do terror como roupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ מֵעַל כִּסְאוֹתָם
  choice: descerão de seus tronos
  rationale: Preserva o sentido de descer ou sair de uma posição elevada e a humilhação dos governantes que abandonam seus tronos.
- source_word: כֹּל נְשִׂיאֵי הַיָּם
  choice: todos os príncipes do mar
  rationale: Mantém a expressão hebraica e seu sentido político elevado, sem substituir a imagem por uma interpretação geográfica.
- source_word: מְעִילֵיהֶם
  choice: seus mantos
  rationale: מְעִיל designa uma veste exterior; “mantos” é claro, digno e adequado à indumentária de governantes.
- source_word: בִּגְדֵי רִקְמָתָם יִפְשֹׁטוּ
  choice: se despirão de suas roupas bordadas
  rationale: Expressa a retirada enfática das vestes luxuosas e conserva o valor de רִקְמָה como trabalho bordado.
- source_word: חֲרָדוֹת יִלְבָּשׁוּ
  choice: Vestirão tremores
  rationale: Conserva a metáfora vívida e o plural do hebraico, no qual os tremores são apresentados como roupa.
- source_word: עַל הָאָרֶץ יֵשֵׁבוּ
  choice: sentarão no chão
  rationale: No contexto de postura e humilhação, “chão” comunica naturalmente o sentido de הָאָרֶץ.
- source_word: וְחָרְדוּ לִרְגָעִים
  choice: tremerão a cada momento
  rationale: Representa o caráter repetido ou contínuo de לִרְגָעִים em português natural.
- source_word: וְשָׁמְמוּ עָלָיִךְ
  choice: ficarão horrorizados por sua causa
  rationale: שׁמם pode expressar espanto aterrorizado ou consternação; “por sua causa” torna explícita a relação indicada por עַל sem decidir se a reação é dirigida à cidade ou provocada por sua ruína.
