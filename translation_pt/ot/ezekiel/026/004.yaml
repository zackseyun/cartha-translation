translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação foi dividida em duas frases para tornar perceptível a mudança do sujeito plural (“eles”) para o divino “eu”, sem alterar a progressão do hebraico.
