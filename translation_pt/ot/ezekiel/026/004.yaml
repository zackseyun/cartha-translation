base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/004.yaml
  text: They will destroy the walls of Tyre and tear down her towers[a], and I will scrape her dust away from her and make her a bare rock.
translation:
  language: pt
  text: Eles destruirão as muralhas de Tiro e derrubarão suas torres, e eu rasparei o pó dela[a] e a transformarei numa rocha nua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «terra». O hebraico עָפָר pode significar pó, terra solta ou solo; a imagem é a de remover a camada superficial da cidade e deixar a rocha exposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁחֲתוּ
  choice: destruirão
  rationale: O verbo שׁחת descreve aqui a destruição das fortificações; “destruirão” é claro, natural e adequado ao objeto “muralhas”.
- source_word: חֹמוֹת צֹר
  choice: as muralhas de Tiro
  rationale: חֹמוֹת refere-se às muralhas defensivas da cidade, e “Tiro” é a forma portuguesa consagrada do topônimo צֹר.
- source_word: וְהָרְסוּ
  choice: derrubarão
  rationale: הרס indica pôr abaixo uma construção. “Derrubarão” preserva a ação concreta e distingue este verbo do anterior.
- source_word: מִגְדָּלֶיהָ
  choice: suas torres
  rationale: מִגְדָּל designa normalmente uma torre; no contexto, trata-se das torres defensivas de Tiro.
- source_word: וְסִחֵיתִי
  choice: removerei
  rationale: O verbo raro indica retirar ou raspar o material da superfície. “Removerei” comunica naturalmente o despojamento completo do local sem impor um instrumento ou método ausente no texto.
- source_word: עֲפָרָהּ מִמֶּנָּה
  choice: dela até o pó
  rationale: עָפָר pode indicar pó, terra solta ou solo. A formulação preserva “pó” e expressa idiomaticamente a remoção radical da camada que cobre a rocha.
- source_word: וְנָתַתִּי אוֹתָהּ
  choice: a transformarei
  rationale: נתן com predicativo descreve a produção de um estado resultante; “transformarei” é natural em português e mantém Tiro personificada no feminino.
- source_word: לִצְחִיחַ סָלַע
  choice: numa rocha nua
  rationale: A expressão retrata uma superfície rochosa exposta e despojada. “Rocha nua” conserva a imagem concreta e a desolação do original.
