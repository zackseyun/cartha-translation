  text: וּ/בְנוֹתֶ֨י/הָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/חֶ֖רֶב תֵּהָרַ֑גְנָה וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
translation:
  language: pt
  text: E suas filhas que estão no campo[a] serão mortas pela espada; então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Suas filhas” pode significar “suas cidades dependentes” ou “suas povoações”; “no campo” provavelmente se refere às povoações de Tiro situadas no continente ou na zona rural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  choice: suas filhas
  rationale: Preserva literalmente a personificação geográfica hebraica. No contexto, as “filhas” são provavelmente as povoações dependentes de Tiro; essa acepção é indicada em nota sem eliminar a imagem do texto.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: que estão no campo
  rationale: Mantém a expressão concreta do hebraico. Neste contexto, pode designar povoações situadas no continente ou na zona rural, em contraste com a cidade insular.
- source_word: בַּחֶרֶב
  choice: pela espada
  rationale: Expressão portuguesa natural que conserva o valor instrumental e a imagem convencional de morte em guerra.
- source_word: תֵּהָרַגְנָה
  choice: serão mortas
  rationale: Reproduz o nifal passivo feminino plural de הרג e concorda com “filhas”.
- source_word: וְיָדְעוּ
  choice: então saberão
  rationale: O waw introduz aqui o resultado do juízo anunciado. “Então” torna essa relação natural em português sem acrescentar uma interpretação teológica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente de “suas filhas” no oráculo contra Tiro
  choice: Manter no texto a expressão literal “suas filhas”, entendida contextualmente como povoações dependentes de Tiro.
  alternative: Traduzir diretamente como “suas cidades dependentes”, “suas povoações” ou tomar a expressão como descendentes femininas literais da cidade personificada.
  rationale: O uso geográfico profético de “filhas” pode indicar comunidades subordinadas a uma cidade principal. A tradução retém a metáfora e a nota esclarece a provável referência sem transformá-la em certeza textual.
- issue: Sentido de “no campo”
  choice: Preservar “no campo” no texto e registrar em nota a possível referência ao continente ou à zona rural.
  alternative: Traduzir diretamente como “no continente” ou “na zona rural”.
  rationale: O hebraico diz literalmente “no campo”; o contexto de Tiro favorece uma localização fora da cidade insular, mas não exige que essa inferência substitua a formulação original.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o caráter de nome próprio do Tetragrama.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. A metáfora “suas filhas” e a imagem “no campo” foram preservadas por transparência, enquanto a provável referência geográfica foi explicada em nota.
