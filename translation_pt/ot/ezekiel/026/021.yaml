base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/021.yaml
  text: I will make you a terror[a], and you will be no more. Though you are sought, you will never again be found[b], declares the Lord GOD.
translation:
  language: pt
  text: Farei de você um objeto de horror, e você não existirá mais. Embora seja procurada, nunca mais será encontrada[a], declara o Senhor Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você será procurada, mas nunca mais será encontrada”. O hebraico também permite entender a sequência como orações futuras coordenadas, sem valor concessivo explícito.'
    reason: leitura_alternativa
  - marker: b
    text: 'Hebraico: אֲדֹנָי יְהוִה (’Adonai YHWH), literalmente “Senhor Yahweh”.'
    reason: nome_divino
lexical_decisions:
- source_word: בַּלָּהוֹת
  choice: um objeto de horror
  rationale: O plural pode ter sentido abstrato ou intensivo. A expressão apresenta Tiro como algo que causa horror e soa natural em português.
- source_word: אֶתְּנֵךְ
  choice: Farei de você
  rationale: Embora נתן signifique literalmente “dar”, com um substantivo predicativo assume aqui o sentido idiomático de “fazer de” ou “tornar”.
- source_word: וְאֵינֵךְ
  choice: e você não existirá mais
  rationale: A oração negativa sem verbo indica que Tiro deixará de existir ou de estar presente; a formulação é clara e atual.
- source_word: וּתְבֻקְשִׁי
  choice: Ainda que procurem por você
  rationale: O passivo hebraico não identifica quem procura. A construção concessiva explicita naturalmente a relação contextual com a impossibilidade de encontrá-la, sem definir os agentes.
- source_word: וְלֹא תִמָּצְאִי עוֹד לְעוֹלָם
  choice: nunca mais será encontrada
  rationale: O nifal de מצא é passivo. “Nunca mais” transmite de modo idiomático a força combinada de עוֹד לְעוֹלָם, evitando a redundância de “nunca mais... para sempre”.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם introduz a fórmula profética. “Senhor Yahweh” preserva tanto o título אֲדֹנָי quanto o nome divino יְהוִה.
theological_decisions:
- issue: Relação sintática entre “ser procurada” e “não ser encontrada”
  choice: 'Leitura concessiva: “Ainda que procurem por você”'
  alternative: 'Leitura coordenada: “Você será procurada, mas não será encontrada”'
  rationale: A sequência hebraica usa conjunções coordenativas e permite uma tradução formalmente coordenada; no contexto, porém, a concessão exprime com naturalidade a ideia de que nem mesmo uma busca futura terá êxito. A nota preserva a ambiguidade.
- issue: Tradução do título composto אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus; Soberano SENHOR
  rationale: A escolha distingue o título אֲדֹנָי do nome próprio divino יְהוִה e evita substituir o nome por outro título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “você”. O feminino de “encontrada” retoma Tiro, a cidade personificada. “Objeto de horror” mantém a intensidade do plural hebraico sem produzir uma expressão artificial.
