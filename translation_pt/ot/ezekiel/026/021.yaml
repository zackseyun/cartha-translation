  naturalness: O português é claro, moderno e apropriado ao registro profético. “Declara o Senhor Yahweh” é uma fórmula mais direta e idiomática do que “— declaração do Senhor Yahweh”. A nota a, em sua redação atual, fica pouco natural por “novamente, para sempre”.
