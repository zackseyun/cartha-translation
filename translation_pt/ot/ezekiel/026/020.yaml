source:
  edition: WLC
  text: וְ/הוֹרַדְתִּי/ךְ֩ אֶת י֨וֹרְדֵי ב֜וֹר אֶל עַ֣ם עוֹלָ֗ם וְ֠/הוֹשַׁבְתִּי/ךְ בְּ/אֶ֨רֶץ תַּחְתִּיּ֜וֹת כָּ/חֳרָב֤וֹת מֵֽ/עוֹלָם֙ אֶת י֣וֹרְדֵי ב֔וֹר לְמַ֖עַן לֹ֣א תֵשֵׁ֑בִי וְ/נָתַתִּ֥י צְבִ֖י בְּ/אֶ֥רֶץ חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/020.yaml
  text: Then I will bring you down with those who go down to the pit[a], to the people of long ago; and I will make you dwell in the land below, like ruins from ancient times, with those who go down to the pit, so that you will not be inhabited[c][b]. But I will set beauty in the land of the living.
translation:
  language: pt
  text: Então farei você descer com os que descem à cova, para junto do povo de outrora. Farei você habitar nas regiões mais baixas da terra, como as ruínas de tempos remotos, com os que descem à cova, para que você não seja habitada.[a] E porei esplendor[b] na terra dos viventes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que você não habite”.'
    reason: O verbo hebraico está na forma ativa, mas, por se dirigir a uma cidade, pode ter o sentido contextual de ela não ser habitada.
  - marker: b
    text: 'Ou: “beleza” ou “glória”.'
    reason: צְבִי abrange as ideias de beleza, esplendor e glória, e o contexto não determina com precisão qual nuance predomina.
lexical_decisions:
- source_word: וְהוֹרַדְתִּיךְ
  choice: Então farei você descer
  rationale: O hifil de ירד com sufixo de segunda pessoa feminina singular é causativo. A formulação conserva esse valor e o movimento descendente dirigido à cidade.
- source_word: יֹרְדֵי בוֹר
  choice: os que descem à cova
  rationale: A expressão participial é vertida de modo natural, preservando a imagem concreta da cova e suas associações com a sepultura e o mundo dos mortos.
- source_word: עַם עוֹלָם
  choice: o povo de outrora
  rationale: Neste contexto, עוֹלָם aponta para um passado remoto, não para duração infinita. “De outrora” é conciso, digno e compreensível.
- source_word: וְהוֹשַׁבְתִּיךְ
  choice: Farei você habitar
  rationale: Mantém a força causativa do hifil de ישׁב e a segunda pessoa feminina singular, dirigida a Tiro.
- source_word: בְּאֶרֶץ תַּחְתִּיּוֹת
  choice: nas regiões mais baixas da terra
  rationale: Expressa o sentido espacial das partes inferiores sem impor ao texto um termo técnico posterior para o mundo dos mortos.
- source_word: כָּחֳרָבוֹת מֵעוֹלָם
  choice: como as ruínas de tempos remotos
  rationale: Conserva tanto a comparação introduzida por כ quanto a ideia temporal de antiguidade remota em מֵעוֹלָם.
- source_word: לְמַעַן לֹא תֵשֵׁבִי
  choice: para que você não seja habitada
  rationale: Embora o hebraico empregue a segunda pessoa feminina singular de ישׁב, a destinatária é uma cidade; em português, “ser habitada” comunica naturalmente o sentido contextual sem apagar a referência direta a ela.
- source_word: צְבִי
  choice: esplendor
  rationale: O substantivo pode indicar beleza, esplendor ou glória. “Esplendor” funciona naturalmente com “porei” e mantém amplitude sem definir de modo indevido o referente.
- source_word: בְּאֶרֶץ חַיִּים
  choice: na terra dos viventes
  rationale: Reproduz a expressão tradicional e clara para o âmbito da vida terrena, em contraste com a cova e as regiões inferiores.
theological_decisions:
- issue: Sentido e referente da oração final וְנָתַתִּי צְבִי בְּאֶרֶץ חַיִּים
  choice: E porei esplendor na terra dos viventes.
  alternative: E porei beleza — ou glória — na terra dos viventes.
  rationale: A frase hebraica é breve e não identifica em que consiste esse esplendor nem a quem ele se refere. A tradução preserva o contraste com a descida de Tiro à cova sem transformá-lo explicitamente em restauração, honra ou outra interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “os que descem à cova” foi mantida por refletir a estrutura enfática do hebraico. Evitou-se terminologia técnica como “mundo inferior” e não se explicitou o referente ambíguo do esplendor na oração final.
