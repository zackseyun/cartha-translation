  text: בֶּן אָדָ֗ם יַ֠עַן אֲשֶׁר אָ֨מְרָה צֹּ֤ר עַל יְרוּשָׁלִַ֨ם֙ הֶאָ֔ח נִשְׁבְּרָ֛ה דַּלְת֥וֹת הָ/עַמִּ֖ים נָסֵ֣בָּה אֵלָ֑/י אִמָּלְאָ֖ה הָחֳרָֽבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
translation:
  language: pt
  text: 'Filho do homem, visto que Tiro disse a respeito de Jerusalém: “Ah! Foram quebradas as portas dos povos[a]; elas se voltaram para mim. Ficarei cheia[b], agora que Jerusalém está devastada”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “os portões dos povos” ou, em sentido funcional, “a porta de entrada dos povos”. A expressão hebraica é condensada e pode apresentar Jerusalém como ponto de acesso para muitos povos.
    reason: lexical_alternative
  - marker: b
    text: Tiro espera beneficiar-se da queda de Jerusalém, provavelmente porque o comércio ou o acesso seriam redirecionados para ela.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a expressão hebraica usada repetidamente como forma de tratamento dirigida a Ezequiel, sem substituí-la por uma interpretação como “mortal”.
- source_word: יַעַן אֲשֶׁר
  choice: visto que
  rationale: Expressa com naturalidade a relação causal que introduz o motivo do oráculo.
- source_word: צֹּר
  choice: Tiro
  rationale: Forma tradicional e corrente em português para o nome da cidade fenícia.
- source_word: עַל יְרוּשָׁלִַם
  choice: a respeito de Jerusalém
  rationale: Com verbo de fala, עַל pode indicar o assunto da declaração; o caráter hostil já fica claro pelo conteúdo da fala.
- source_word: הֶאָח
  choice: Ah!
  rationale: Interjeição breve que, no contexto, comunica satisfação maliciosa diante da desgraça de Jerusalém.
- source_word: נִשְׁבְּרָה
  choice: foi quebrada
  rationale: Reproduz o sentido passivo e resultativo da forma hebraica.
- source_word: דַּלְתוֹת הָעַמִּים
  choice: a porta de entrada dos povos
  rationale: A expressão literalmente plural e condensada retrata Jerusalém como ponto de acesso para diversos povos. O singular coletivo produz uma imagem clara em português, enquanto a nota preserva as alternativas formais.
- source_word: נָסֵבָּה אֵלַי
  choice: ela se voltou para mim
  rationale: Mantém a imagem de algo que muda de direção em favor de Tiro; o pronome feminino concorda naturalmente com “porta de entrada”.
- source_word: אִמָּלְאָה
  choice: Ficarei cheia
  rationale: Preserva a metáfora de plenitude e a personificação feminina de Tiro, sem explicitar no texto principal que se trata de ganho comercial.
- source_word: הָחֳרָבָה
  choice: Jerusalém está devastada
  rationale: Explicita o referente feminino para evitar ambiguidade pronominal artificial em português e traduz o estado resultante de ruína.
theological_decisions:
- issue: Descrição metafórica de Jerusalém como דַּלְתוֹת הָעַמִּים
  choice: a porta de entrada dos povos
  alternative: as portas dos povos; os portões das nações
  rationale: A expressão é condensada e pode retratar Jerusalém como ponto estratégico de acesso, circulação ou comércio. A tradução mantém a metáfora sem determinar de modo excessivo qual dessas funções está em vista.
- issue: Sentido da plenitude esperada por Tiro
  choice: Ficarei cheia
  alternative: Ficarei enriquecida; prosperarei
  rationale: A forma literal preserva a metáfora e a tensão do texto. A provável expectativa de benefício econômico é explicada em nota, não inserida como única interpretação no corpo do versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala de Tiro conserva o tom de satisfação maliciosa, a personificação feminina da cidade e as metáforas hebraicas, enquanto as notas esclarecem sem eliminar a ambiguidade legítima.
