base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/019.yaml
  text: 'For thus says the Lord GOD: When I make you a ruined city[a], like the cities that are not inhabited, when I bring up the deep over you and the great waters cover you[b],'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: Quando eu fizer de você uma cidade devastada, como as cidades que não são habitadas, quando eu fizer subir sobre você o abismo, e as muitas águas cobrirem você,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: בְּתִתִּי אֹתָךְ עִיר נֶחֱרֶבֶת
  choice: Quando eu fizer de você uma cidade devastada
  rationale: O verbo נתן, nesta construção com predicativo, tem sentido efetivo de tornar ou fazer; “cidade devastada” preserva o estado resultante expresso pelo particípio passivo נֶחֱרֶבֶת.
- source_word: כֶּעָרִים אֲשֶׁר לֹא נוֹשָׁבוּ
  choice: como as cidades que não são habitadas
  rationale: Reproduz de perto a forma passiva de ישב e mantém a comparação com cidades desabitadas.
- source_word: בְּהַעֲלוֹת עָלַיִךְ אֶת תְּהוֹם
  choice: quando eu fizer subir sobre você as águas profundas
  rationale: A construção causativa indica que Deus faz תְּהוֹם subir sobre a cidade. “Águas profundas” comunica em português o abismo ou oceano profundo sem exigir uma leitura cosmológica específica.
- source_word: וְכִסּוּךְ הַמַּיִם הָרַבִּים
  choice: e as muitas águas cobrirem você
  rationale: “Muitas águas” conserva a formulação hebraica e sua imagem poética; רַבִּים também pode sugerir águas grandes ou poderosas.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha distingue o título אֲדֹנָי do nome próprio יהוה e torna explícito o nome pactual, sem acrescentar interpretação denominacional.
- issue: Natureza de תְּהוֹם
  choice: as águas profundas
  alternative: o abismo
  rationale: A tradução mantém a imagem de profundidade aquática exigida pelo paralelismo com “muitas águas”, sem decidir se o termo deve ser entendido em sentido estritamente cosmológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A pontuação preserva a sequência de orações temporais do hebraico; a vírgula final indica que a sentença prossegue no versículo seguinte.
