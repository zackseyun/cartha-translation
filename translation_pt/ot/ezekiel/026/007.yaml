source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֧י מֵבִ֣יא אֶל צֹ֗ר נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל מִ/צָּפ֖וֹן מֶ֣לֶךְ מְלָכִ֑ים בְּ/ס֛וּס וּ/בְ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים וְ/קָהָ֥ל וְ/עַם רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/007.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am bringing against Tyre Nebuchadnezzar king of Babylon from the north, king of kings, with horses and chariots and horsemen, and an assembly and a numerous people.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Eis que estou trazendo contra Tiro Nabucodonosor[a], rei da Babilônia, vindo do norte, rei de reis, com cavalos, carros de guerra e cavaleiros, com uma multidão e um povo numeroso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A grafia hebraica usada aqui corresponde mais de perto a “Nabucodrezar”; a tradição em português costuma usar “Nabucodonosor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Mantém a ligação explicativa com o contexto anterior e reproduz de modo natural e solene a fórmula profética de mensageiro.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, traduzido por “Senhor”, do nome divino יהוה, transliterado como “Yahweh”, evitando fundir os dois elementos do título.
- source_word: הִנְנִי מֵבִיא אֶל
  choice: Eis que estou trazendo contra
  rationale: “Eis que” conserva o anúncio divino solene; a construção progressiva comunica a ação iminente, e “contra” explicita o sentido hostil de אֶל no contexto militar.
- source_word: צֹר
  choice: Tiro
  rationale: Forma portuguesa tradicional e corrente do nome da cidade fenícia.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma portuguesa tradicional e reconhecível; a grafia mais próxima da forma hebraica deste versículo é registrada em nota.
- source_word: מִצָּפוֹן
  choice: vindo do norte
  rationale: Expressa naturalmente tanto a procedência do rei quanto a direção da invasão.
- source_word: מֶלֶךְ מְלָכִים
  choice: rei de reis
  rationale: Preserva a expressão appositiva sem artigo definido e indica supremacia imperial sem transformá-la em título teológico absoluto.
- source_word: בְּסוּס וּבְרֶכֶב וּבְפָרָשִׁים
  choice: com cavalos, carros de guerra e cavaleiros
  rationale: Verte os coletivos militares em plurais naturais; “carros de guerra” evita a ambiguidade moderna de “carros” isoladamente.
- source_word: וְקָהָל וְעַם רָב
  choice: com uma multidão e um povo numeroso
  rationale: Conserva os dois substantivos coordenados e a amplitude deliberada da descrição hebraica sem reduzir ambos a um único termo militar.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A escolha preserva explicitamente o nome da aliança e mantém distinto o título אֲדֹנָי. A alternativa tradicional é idiomática, mas substitui o nome próprio por um título.
- issue: Sentido de מֶלֶךְ מְלָכִים aplicado a Nabucodonosor
  choice: rei de reis
  alternative: o Rei dos reis
  rationale: A ausência de artigo e a função appositiva favorecem uma descrição de domínio imperial; evita-se importar para o rei babilônico o uso posterior da expressão como título divino absoluto.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem das imagens militares e o paralelismo final foram preservados; “carros de guerra” esclarece o referente antigo. O marcador da nota foi colocado junto ao nome a que efetivamente se refere.
