  text: בְּ/פַרְס֣וֹת סוּסָ֔י/ו יִרְמֹ֖ס אֶת כָּל חֽוּצוֹתָ֑יִ/ךְ עַמֵּ/ךְ֙ בַּ/חֶ֣רֶב יַהֲרֹ֔ג וּ/מַצְּב֥וֹת עֻזֵּ֖/ךְ לָ/אָ֥רֶץ תֵּרֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/011.yaml
  text: With the hoofs of his horses he will trample all your streets[a]; he will kill your people with the sword[b], and the pillars of your strength will come down to the ground.
translation:
  language: pt
  text: Com os cascos dos seus cavalos, ele pisoteará todas as suas ruas[a]; matará o seu povo à espada, e as colunas da sua força cairão por terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus lugares abertos” ou “todas as suas praças”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico também pode ser entendido como “os monumentos da sua força”, referindo-se possivelmente a colunas ou monumentos proeminentes associados ao poder de Tiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפַרְסוֹת סוּסָיו
  choice: Com os cascos dos seus cavalos
  rationale: A preposição בְּ indica o meio pelo qual ocorre o pisoteio; a formulação é natural em português e mantém a imagem concreta do hebraico.
- source_word: יִרְמֹס
  choice: pisoteará
  rationale: רמס expressa a ação de pisar repetidamente ou calcar; “pisoteará” preserva a força da imagem militar.
- source_word: כָּל חוּצוֹתָיִךְ
  choice: todas as suas ruas
  rationale: חוּצוֹת pode designar ruas, lugares abertos ou praças. “Ruas” é a opção mais abrangente e natural no contexto de uma cidade invadida, mantendo-se as alternativas em nota.
- source_word: עַמֵּךְ בַּחֶרֶב יַהֲרֹג
  choice: matará o seu povo à espada
  rationale: A tradução conserva a ordem e a imagem concreta do hebraico; “à espada” é uma expressão portuguesa corrente para morte violenta em guerra.
- source_word: וּמַצְּבוֹת עֻזֵּךְ
  choice: e as colunas da sua força
  rationale: מַצֵּבוֹת pode referir-se a colunas, pedras erguidas ou monumentos. A tradução formal “colunas da sua força” conserva a metáfora e evita decidir se eram estruturas arquitetônicas ou monumentos simbólicos.
- source_word: לָאָרֶץ תֵּרֵד
  choice: cairão por terra
  rationale: Embora ירד signifique literalmente “descer”, no contexto da derrubada de estruturas “cairão por terra” comunica com naturalidade o colapso. O plural em português concorda com “colunas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva o paralelismo profético e as imagens concretas do hebraico sem recorrer a vocabulário arcaico. A nota [a] preserva a amplitude semântica de חוּצוֹת, e a nota [b], colocada após a oração pertinente, preserva a incerteza de מַצְּבוֹת.
