base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/012.yaml
  text: They will plunder your wealth and loot your merchandise. They will tear down your walls and demolish your splendid houses. They will throw your stones[a], your timbers, and your dust into the midst of the waters.
translation:
  language: pt
  text: Eles saquearão suas riquezas e pilharão suas mercadorias. Derrubarão suas muralhas e demolirão suas casas magníficas. Lançarão suas pedras, suas madeiras e seu pó[a] no meio das águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua terra” ou “seus escombros”. A palavra hebraica pode significar pó ou terra e, neste contexto, pode se referir aos resíduos da cidade demolida.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְלוּ
  choice: saquearão
  rationale: Expressa naturalmente a tomada de bens como despojo de guerra.
- source_word: חֵילֵךְ
  choice: suas riquezas
  rationale: Embora חַיִל possa indicar força ou exército, o paralelismo com as mercadorias e o contexto comercial de Tiro favorecem o sentido econômico.
- source_word: בָזְזוּ
  choice: pilharão
  rationale: Mantém a ideia de apropriação violenta e reproduz a variação do hebraico em relação ao verbo anterior.
- source_word: רְכֻלָּתֵךְ
  choice: suas mercadorias
  rationale: Designa os bens comercializados e, neste contexto, tomados pelos invasores.
- source_word: הָרְסוּ חוֹמוֹתַיִךְ
  choice: derrubarão suas muralhas
  rationale: O verbo descreve a destruição de estruturas; “muralhas” explicita que se trata das fortificações urbanas.
- source_word: בָתֵּי חֶמְדָּתֵךְ
  choice: suas casas magníficas
  rationale: A expressão indica casas desejáveis, preciosas ou agradáveis; “magníficas” comunica seu caráter valioso e esplêndido em português natural.
- source_word: יִתֹּצוּ
  choice: demolirão
  rationale: נתץ descreve o desmantelamento ou a destruição de construções.
- source_word: אֲבָנַיִךְ
  choice: suas pedras
  rationale: Tradução direta das pedras pertencentes às construções da cidade destruída.
- source_word: עֵצַיִךְ
  choice: suas madeiras
  rationale: No conjunto de materiais de construção, refere-se à madeira ou ao madeiramento dos edifícios.
- source_word: עֲפָרֵךְ
  choice: seu pó
  rationale: Preserva o sentido lexical direto de עָפָר; no contexto da demolição, pode incluir terra ou resíduos pulverizados.
- source_word: בְּתוֹךְ מַיִם
  choice: no meio das águas
  rationale: Conserva o plural e a imagem espacial do hebraico; com “lançarão”, a direção do movimento fica clara.
