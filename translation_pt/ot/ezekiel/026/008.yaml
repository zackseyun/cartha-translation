base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/008.yaml
  text: He will kill your daughters in the field with the sword[a], set up a siege wall against you, throw up a siege ramp against you[b], and raise a large shield against you.
translation:
  language: pt
  text: Ele matará à espada as suas filhas no campo[a], levantará contra você uma obra de cerco, construirá contra você uma rampa de cerco e erguerá contra você um grande escudo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas cidades dependentes” ou “seus povoados no interior”. O hebraico diz literalmente “suas filhas no campo” e se refere a povoações subordinadas à cidade principal.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “grande escudo” pode referir-se mais especificamente a uma proteção de cerco, como um anteparo móvel ou uma cobertura escudada usada durante o ataque.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹתַיִךְ
  choice: as suas filhas
  rationale: Conserva a imagem literal e tradicional do hebraico. Neste contexto militar, porém, “filhas” provavelmente designa povoações dependentes de Tiro; essa acepção é esclarecida em nota sem apagar a expressão original.
- source_word: בַּשָּׂדֶה
  choice: que estão no campo
  rationale: Mantém o sentido básico de campo ou região aberta. No contexto de Tiro, pode referir-se às povoações no continente ou no interior, mas a tradução evita restringir indevidamente o referente.
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: matará à espada
  rationale: Expressa de modo natural em português o instrumento de morte em contexto de guerra e preserva o valor futuro da profecia.
- source_word: דָּיֵק
  choice: um muro de cerco
  rationale: O substantivo singular designa uma estrutura ou instalação de assédio. “Muro de cerco” comunica uma interpretação plausível e inteligível, embora o tipo exato da obra militar não seja inteiramente certo.
- source_word: סֹלְלָה
  choice: uma rampa de cerco
  rationale: Designa um aterro ou rampa acumulada contra uma cidade sitiada. O acréscimo “de cerco” torna clara sua função militar.
- source_word: צִנָּה
  choice: um grande escudo
  rationale: É o sentido lexical comum do termo. No contexto de um cerco, pode designar mais especificamente uma proteção móvel ou cobertura escudada, possibilidade preservada em nota.
- source_word: וְנָתַן ... וְשָׁפַךְ ... וְהֵקִים
  choice: levantará ... construirá ... erguerá
  rationale: A sequência profética tem valor futuro. Verbos variados e correntes em português representam naturalmente as respectivas operações de cerco.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação conserva a metáfora hebraica “filhas” e esclarece em nota seu provável sentido geopolítico. “Você” mantém a interpelação direta à cidade de Tiro sem recorrer a formas regionais ou arcaizantes.
