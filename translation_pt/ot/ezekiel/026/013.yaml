  text: וְ/הִשְׁבַּתִּ֖י הֲמ֣וֹן שִׁירָ֑יִ/ךְ וְ/ק֣וֹל כִּנּוֹרַ֔יִ/ךְ לֹ֥א יִשָּׁמַ֖ע עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/013.yaml
  text: And I will put an end to the noise of your songs[a], and the sound of your lyres will be heard no more.
translation:
  language: pt
  text: Farei cessar o ruído das suas canções, e o som das suas liras[a] nunca mais será ouvido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “harpas”. O hebraico כִּנּוֹר refere-se a um instrumento de cordas geralmente identificado como lira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Farei cessar
  rationale: 'O hifil de שׁבת tem sentido causativo: Deus fará com que a atividade cesse. A formulação é direta, natural e preserva a força do juízo.'
- source_word: הֲמוֹן
  choice: o tumulto
  rationale: Neste contexto musical, הֲמוֹן indica o volume ruidoso ou a agitação sonora, não uma multidão numérica. “Tumulto” comunica esse som intenso sem reduzir o termo ao simples “som” do membro paralelo.
- source_word: שִׁירָיִךְ
  choice: das suas canções
  rationale: O substantivo plural com sufixo feminino singular refere-se às canções de Tiro. “Canções” é claro e corrente em português.
- source_word: וְקוֹל
  choice: e o som
  rationale: Com um instrumento musical, קוֹל significa naturalmente “som”, em vez de “voz”.
- source_word: כִּנּוֹרָיִךְ
  choice: das suas liras
  rationale: כִּנּוֹר designa um instrumento de cordas geralmente identificado como lira. “Liras” é mais preciso do que o tradicional “harpas”, cuja possibilidade é registrada em nota.
- source_word: לֹא יִשָּׁמַע עוֹד
  choice: nunca mais será ouvido
  rationale: O nifal de שׁמע é passivo neste contexto, e עוֹד com a negação indica cessação permanente. A expressão portuguesa é idiomática e enfática.
