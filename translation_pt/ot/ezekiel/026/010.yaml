base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/010.yaml
  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
translation:
  language: pt
  text: Por causa da multidão dos seus cavalos, a poeira deles cobrirá você. Ao som dos cavaleiros, das rodas e dos carros de guerra, suas muralhas tremerão quando ele entrar pelos seus portões, como se entra numa cidade cujas muralhas foram rompidas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “como as entradas de uma cidade rompida”; a expressão descreve a entrada numa cidade cujas defesas foram rompidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשִּׁפְעַת סוּסָיו
  choice: Por causa da multidão dos seus cavalos
  rationale: שִׁפְעָה indica abundância ou grande quantidade; com מִן, o contexto favorece o sentido causal. “Multidão” comunica de modo natural a enorme quantidade de cavalos.
- source_word: יְכַסֵּךְ אֲבָקָם
  choice: a poeira deles cobrirá você
  rationale: Preserva o sentido concreto de כסה, “cobrir”, e identifica a poeira como aquela levantada pelos cavalos. “Você” mantém a interpelação direta à cidade personificada.
- source_word: מִקּוֹל פָּרַשׁ וְגַלְגַּל וָרֶכֶב
  choice: Ao som dos cavaleiros, das rodas e dos carros de guerra
  rationale: קוֹל é “som/ruído”; פָּרַשׁ tem valor coletivo no contexto militar, expresso naturalmente pelo plural “cavaleiros”. גַלְגַּל é “roda”, e רֶכֶב designa aqui carros de guerra ou a força de carros.
- source_word: תִּרְעַשְׁנָה חוֹמוֹתַיִךְ
  choice: suas muralhas tremerão
  rationale: רעשׁ descreve forte tremor ou abalo. “Muralhas” é mais específico e natural para as fortificações de uma cidade.
- source_word: בְּבֹאוֹ בִּשְׁעָרַיִךְ
  choice: quando ele entrar pelos seus portões
  rationale: O infinitivo com בְּ tem sentido temporal. Em português, entra-se “pelos portões”, formulação natural que preserva a imagem da invasão.
- source_word: כִּמְבוֹאֵי עִיר מְבֻקָּעָה
  choice: como se entra numa cidade aberta por uma brecha
  rationale: A formulação hebraica é compacta e literalmente menciona as “entradas” de uma cidade rompida. A tradução comunica a maneira de entrada sem ocultar a imagem da brecha.
