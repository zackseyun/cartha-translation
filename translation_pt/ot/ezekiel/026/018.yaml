  text: Now the coastlands will tremble on the day of your downfall[b][a], and the islands that are in the sea will be terrified at your departure.
translation:
  language: pt
  text: Agora, as terras costeiras tremerão no dia da sua queda, e as ilhas que estão no mar ficarão apavoradas com a sua partida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da sua saída” ou “desde que você saiu”; também pode significar “por causa da sua partida”. A expressão provavelmente se refere ao desaparecimento de Tiro em consequência do juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Mantém o advérbio temporal que introduz a consequência imediata da queda de Tiro.
- source_word: יֶחְרְדוּ
  choice: tremerão
  rationale: Preserva a força física e emocional do verbo חרד, que expressa tremor causado pelo medo.
- source_word: הָאִיִּן
  choice: as terras costeiras
  rationale: אִיִּים pode designar ilhas ou regiões marítimas; na primeira oração, o sentido abrangente de terras costeiras se ajusta ao uso profético.
- source_word: יוֹם מַפַּלְתֵּךְ
  choice: no dia da sua queda
  rationale: Reproduz naturalmente a construção temporal e o sentido da ruína de Tiro.
- source_word: וְנִבְהֲלוּ
  choice: ficarão apavoradas
  rationale: Expressa o estado de alarma intenso indicado pelo nifal de בהל, sem confundi-lo com o tremor da primeira oração.
- source_word: הָאִיִּים אֲשֶׁר בַּיָּם
  choice: as ilhas que estão no mar
  rationale: A qualificação 'que estão no mar' favorece aqui o sentido concreto de ilhas.
- source_word: מִצֵּאתֵךְ
  choice: com a sua partida
  rationale: Conserva a imagem literalmente ligada ao 'sair' de Tiro e sua provável referência ao desaparecimento da cidade, sem explicitar além do hebraico.
theological_decisions:
- issue: Sentido de מִצֵּאתֵךְ no contexto do juízo sobre Tiro
  choice: sua partida
  alternative: seu desaparecimento
  rationale: A tradução mantém a metáfora e a ambiguidade do hebraico, enquanto a nota esclarece sua provável referência contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A distinção contextual entre 'terras costeiras' na primeira oração e 'ilhas' na segunda preserva a amplitude semântica de אִיִּים. O pronome feminino singular refere-se a Tiro.
