base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
translation:
  language: pt
  text: 'Eles entoarão uma lamentação a seu respeito e lhe dirão: “Como você pereceu, ó habitada desde os mares,[a] cidade celebrada,[b] que era forte no mar, ela e seus habitantes, que espalhavam o terror[c] sobre todos os seus habitantes!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “habitada desde os mares”, expressão difícil. Pode indicar que a cidade era povoada ou abastecida por regiões marítimas; outras traduções entendem “situada à entrada do mar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cidade elogiada” ou “cidade renomada”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “davam o seu terror”, isto é, faziam outros sentir pavor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: entoarão uma lamentação
  rationale: Reproduz naturalmente em português o sentido idiomático de levantar ou proferir um lamento, mantendo o tom poético.
- source_word: אָבַדְתְּ
  choice: você pereceu
  rationale: Conserva a força exclamativa do lamento e o sentido de perecer ou ser destruída.
- source_word: נוֹשֶׁבֶת מִיַּמִּים
  choice: ó habitada a partir dos mares
  rationale: Mantém a difícil construção passiva e o plural 'mares' do texto massorético, sem adotar silenciosamente uma emenda ou interpretação geográfica específica.
- source_word: הָעִיר הַהֻלָּלָה
  choice: cidade celebrada
  rationale: Expressa o particípio passivo de הלל com naturalidade e dignidade; 'celebrada' preserva a ideia de uma cidade elogiada e afamada.
- source_word: חֲזָקָה בַיָּם
  choice: era forte no mar
  rationale: Segue de perto a preposição e o substantivo hebraicos, preservando o cenário marítimo de Tiro.
- source_word: הִיא וְיֹשְׁבֶיהָ
  choice: ela e seus habitantes
  rationale: Preserva a personificação feminina da cidade presente na gramática e na poesia hebraicas.
- source_word: נָתְנוּ חִתִּיתָם
  choice: espalhavam o terror
  rationale: Comunica em português corrente o idiomatismo 'davam o seu terror', isto é, faziam outros sentir pavor.
- source_word: לְכָל יוֹשְׁבֶיהָ
  choice: entre todos os habitantes dela
  rationale: Mantém o sufixo feminino do texto massorético e sua referência formal à cidade, embora a formulação produza uma dificuldade contextual genuína.
theological_decisions:
- issue: Personificação da cidade de Tiro
  choice: 'Manter a referência feminina: ''ela e seus habitantes'' e ''habitantes dela''.'
  alternative: Usar formas impessoais ou interpretar o último sufixo como referência a outras terras ou ao mar.
  rationale: O hebraico emprega formas femininas e a lamentação profética personifica a cidade. A tradução conserva essa característica sem resolver por conjectura a dificuldade do último pronome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por 'você' na apóstrofe à cidade. A expressão incomum 'habitada a partir dos mares' foi deliberadamente preservada e explicada em nota; a ordem poética mantém a personificação feminina e a tensão sintática do texto massorético.
