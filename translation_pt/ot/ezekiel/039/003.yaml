  text: And I will strike your bow from your left hand[a], and I will make your arrows fall from your right hand.
translation:
  language: pt
  text: E arrancarei o seu arco da sua mão esquerda e farei cair as suas flechas da sua mão direita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: E arrancarei
  rationale: O hifil de נכה descreve aqui um golpe que desaloja a arma. Em português, “arrancarei” expressa de modo natural o resultado do golpe sem tom arcaico.
- source_word: קַשְׁתְּךָ
  choice: o seu arco
  rationale: Equivalente corrente de קֶשֶׁת, com o sufixo masculino singular representado por “seu”.
- source_word: מִיַּד שְׂמֹאולֶךָ
  choice: da sua mão esquerda
  rationale: Reproduz de modo idiomático a imagem concreta do hebraico, literalmente “da mão da sua esquerda”.
- source_word: וְחִצֶּיךָ
  choice: e ... as suas flechas
  rationale: Mantém o substantivo plural, o sufixo de segunda pessoa masculina singular e a conjunção.
- source_word: מִיַּד יְמִינְךָ
  choice: da sua mão direita
  rationale: Preserva a imagem corporal e o paralelismo com “da sua mão esquerda”.
- source_word: אַפִּיל
  choice: farei cair
  rationale: 'O hifil de נפל é causativo: Deus fará com que as flechas caiam. A formulação é clara, natural e mantém essa causalidade.'
