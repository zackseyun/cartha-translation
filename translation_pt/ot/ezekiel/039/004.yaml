  text: עַל הָרֵ֨י יִשְׂרָאֵ֜ל תִּפּ֗וֹל אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֖ים אֲשֶׁ֣ר אִתָּ֑/ךְ לְ/עֵ֨יט צִפּ֧וֹר כָּל כָּנָ֛ף וְ/חַיַּ֥ת הַ/שָּׂדֶ֖ה נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/004.yaml
  text: On the mountains of Israel you will fall—you and all your troops and the peoples who are with you[b][a]. I have given you as food to every kind of bird of prey and to the wild animals of the field.
translation:
  language: pt
  text: Nos montes de Israel você cairá — você, todas as suas tropas[a] e os povos que estão com você. Eu o entreguei como alimento a toda espécie de ave de rapina[b] e aos animais selvagens do campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “todas as suas asas”; provavelmente uma metáfora para as divisões militares ou forças vinculadas a Gogue.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “às aves de rapina de toda asa”; a expressão hebraica enfatiza toda espécie de ave necrófaga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפּוֹל
  choice: você cairá
  rationale: Preserva o sentido concreto de נפל, que neste contexto de juízo implica derrota e morte sem explicitá-las além do hebraico.
- source_word: אֲגַפֶּיךָ
  choice: suas tropas
  rationale: Embora o termo signifique literalmente “suas asas”, aqui funciona provavelmente como metáfora militar para divisões, flancos ou forças vinculadas a Gogue.
- source_word: עַמִּים אֲשֶׁר אִתָּךְ
  choice: os povos que estão com você
  rationale: Mantém o plural étnico de עַמִּים e distingue esses povos das unidades militares mencionadas anteriormente.
- source_word: לְעֵיט צִפּוֹר כָּל כָּנָף
  choice: a toda espécie de ave de rapina
  rationale: Expressa em português natural a abrangência da construção hebraica, que inclui aves predadoras ou necrófagas de toda espécie.
- source_word: חַיַּת הַשָּׂדֶה
  choice: aos animais selvagens do campo
  rationale: Tradução clara e atual da expressão hebraica convencional para os animais selvagens terrestres.
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: Eu o entreguei como alimento
  rationale: “Entreguei” comunica que Deus o destina a ser devorado, enquanto o perfeito preserva a forma hebraica e a certeza profética do juízo.
theological_decisions:
- issue: Agência divina e valor temporal do perfeito profético
  choice: Eu o entreguei como alimento
  alternative: Eu o entregarei como alimento
  rationale: נְתַתִּיךָ é formalmente perfeito, “eu o dei/entreguei”. Em discurso profético pode descrever um ato futuro como já decretado e certo; a formulação escolhida conserva essa tensão sem apagar a referência futura do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por clareza referencial e mantém a imagem concreta do juízo. Os marcadores aparecem junto aos termos correspondentes, em ordem alfabética.
