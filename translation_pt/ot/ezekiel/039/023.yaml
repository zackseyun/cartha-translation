source:
  edition: WLC
  text: וְ/יָדְע֣וּ הַ֠/גּוֹיִם כִּ֣י בַ/עֲוֺנָ֞/ם גָּל֣וּ בֵֽית יִשְׂרָאֵ֗ל עַ֚ל אֲשֶׁ֣ר מָֽעֲלוּ בִ֔/י וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶ֑ם וָֽ/אֶתְּנֵ/ם֙ בְּ/יַ֣ד צָרֵי/הֶ֔ם וַ/יִּפְּל֥וּ בַ/חֶ֖רֶב כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/023.yaml
  text: And the nations will know that the house of Israel went into exile for their iniquity[a], because they acted unfaithfully against me; so I hid my face from them and gave them into the hand of their adversaries[b], and they all fell by the sword.
translation:
  language: pt
  text: E as nações saberão que a casa de Israel foi para o exílio por causa da sua iniquidade, porque foram infiéis a mim. Por isso, escondi deles o meu rosto, entreguei-os nas mãos dos seus adversários[a], e todos eles caíram à espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na mão dos seus adversários”, expressão hebraica que significa ser entregue ao poder de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E ... saberão
  rationale: O perfeito com conjunção em discurso profético tem aqui força futura ou resultativa; a formulação preserva o tema do reconhecimento recorrente em Ezequiel.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se às nações estrangeiras; esta é a expressão mais natural e contextualmente adequada em português.
- source_word: בַעֲוֺנָם
  choice: por causa da sua iniquidade
  rationale: עָוֺן abrange iniquidade e culpa. A escolha mantém o peso moral e judicial do termo.
- source_word: גָּלוּ
  choice: foi para o exílio
  rationale: O verbo indica ir para o exílio. A concordância no singular trata 'a casa de Israel' como coletivo, sem impor uma forma passiva ausente do verbo hebraico.
- source_word: בֵית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão coletiva e pactual característica de Ezequiel.
- source_word: עַל אֲשֶׁר
  choice: porque
  rationale: Introduz de modo claro a causa do exílio.
- source_word: מָעֲלוּ בִי
  choice: foram infiéis a mim
  rationale: מעל expressa quebra de fidelidade ou traição, especialmente no âmbito da relação pactual. A tradução comunica essa dimensão sem acrescentar terminologia confessional.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: Por isso, escondi deles o meu rosto
  rationale: Mantém a imagem bíblica significativa de esconder o rosto e torna explícita, de forma natural, a relação consequencial presente na sequência.
- source_word: וָאֶתְּנֵם בְּיַד צָרֵיהֶם
  choice: entreguei-os nas mãos dos seus adversários
  rationale: A expressão idiomática 'na mão de' indica poder ou domínio. O plural 'nas mãos' é idiomático em português e preserva a imagem essencial.
- source_word: וַיִּפְּלוּ בַחֶרֶב כֻּלָּם
  choice: e todos eles caíram à espada
  rationale: Preserva a expressão solene de morte em guerra ou juízo e a força totalizante de כֻּלָּם.
theological_decisions:
- issue: Relação causal entre o pecado de Israel, o ocultamento do rosto divino e o exílio ou juízo
  choice: O exílio e a derrota são apresentados como consequência da iniquidade e infidelidade de Israel, com agência divina explícita.
  alternative: Uma redação mais passiva que destaque apenas o acontecimento histórico do exílio, sem evidenciar o juízo divino.
  rationale: O hebraico liga diretamente o exílio à iniquidade de Israel, declara sua infidelidade a Deus e atribui a Deus tanto o esconder do rosto como a entrega do povo ao poder dos adversários. A tradução mantém juntas a responsabilidade humana e a ação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as expressões bíblicas importantes 'casa de Israel', 'escondi ... o meu rosto' e 'caíram à espada'. A ordem foi levemente ajustada para fluência, sem eliminar a sequência causal do hebraico.
