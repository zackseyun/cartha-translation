  text: וְֽ/יָצְא֞וּ יֹשְׁבֵ֣י עָרֵ֣י יִשְׂרָאֵ֗ל וּ/בִעֲר֡וּ וְ֠/הִשִּׂיקוּ בְּ/נֶ֨שֶׁק וּ/מָגֵ֤ן וְ/צִנָּה֙ בְּ/קֶ֣שֶׁת וּ/בְ/חִצִּ֔ים וּ/בְ/מַקֵּ֥ל יָ֖ד וּ/בְ/רֹ֑מַח וּ/בִעֲר֥וּ בָ/הֶ֛ם אֵ֖שׁ שֶׁ֥בַע שָׁנִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/009.yaml
  text: Then the inhabitants of the cities of Israel will go out and make fires with the weapons and burn them—the small shield and the large shield[a], the bow and the arrows[c][b], the hand-club and the spear—and they will make fires with them for seven years.
translation:
  language: pt
  text: 'Os habitantes das cidades de Israel sairão, acenderão fogo com as armas[a] e as queimarão: o escudo pequeno e o escudo grande,[b] o arco e as flechas, o bastão de mão[c] e a lança. Farão fogo com elas durante sete anos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “queimarão e acenderão fogo com as armas”. A construção hebraica é difícil; o contexto indica que as armas serão usadas como combustível.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega aqui dois termos para escudo, provavelmente um escudo menor e outro maior, que protegia mais amplamente o corpo.
    reason: cultural_note
  - marker: c
    text: Literalmente, “bastão de mão”. Em uma lista de armas, a expressão provavelmente designa uma arma de impacto empunhada com a mão.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: sairão
  rationale: Preserva o sentido básico de sair e a sequência futura da profecia.
- source_word: יֹשְׁבֵי עָרֵי יִשְׂרָאֵל
  choice: os habitantes das cidades de Israel
  rationale: Reproduz com clareza a construção concreta que se refere aos moradores das cidades.
- source_word: וּבִעֲרוּ וְהִשִּׂיקוּ בְּנֶשֶׁק
  choice: acenderão e alimentarão fogueiras com as armas
  rationale: Os dois verbos descrevem o uso das armas como combustível. A formulação é natural em português e mantém os dois aspectos verbais sem fingir que a difícil construção hebraica seja inequívoca.
- source_word: נֶשֶׁק
  choice: armas
  rationale: Equivalente coletivo claro e corrente para o armamento.
- source_word: מָגֵן וְצִנָּה
  choice: o escudo pequeno e o escudo grande
  rationale: Distingue os dois tipos de escudo indicados pelos termos hebraicos, sem recorrer a vocabulário militar arcaico.
- source_word: קֶשֶׁת וּבְחִצִּים
  choice: o arco e as flechas
  rationale: Equivalentes portugueses usuais e precisos.
- source_word: מַקֵּל יָד
  choice: o bastão de mão
  rationale: Conserva a forma concreta e algo incomum da expressão hebraica, cujo tipo exato de arma não é seguro.
- source_word: רֹמַח
  choice: a lança
  rationale: Equivalente militar comum e adequado.
- source_word: וּבִעֲרוּ בָהֶם אֵשׁ שֶׁבַע שָׁנִים
  choice: Farão fogo com elas durante sete anos
  rationale: Expressa naturalmente o valor instrumental de בָהֶם e mantém explícita a duração de sete anos.
