  text: וְ/נָתַתִּ֥י אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִ֑ם וְ/רָא֣וּ כָל הַ/גּוֹיִ֗ם אֶת מִשְׁפָּטִ/י֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/אֶת יָדִ֖/י אֲשֶׁר שַׂ֥מְתִּי בָ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/021.yaml
  text: And I will set my glory among the nations[a], and all the nations will see my judgment that I have executed[b], and my hand that I have laid on them.
translation:
  language: pt
  text: Porei a minha glória entre as nações, e todas as nações verão o meu juízo[a], que executei, e a minha mão[b], que pus sobre elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha justiça que realizei”.'
    reason: lexical_alternative
  - marker: b
    text: “Minha mão” é uma expressão hebraica para o poder ou a ação efetiva de Deus, especialmente em juízo.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Porei
  rationale: O verbo נָתַן pode significar “dar”, “pôr” ou “colocar”. “Porei” preserva sua concretude e combina naturalmente com “a minha glória entre as nações”.
- source_word: כְּבוֹדִי
  choice: a minha glória
  rationale: כָּבוֹד abrange glória, honra e majestade; aqui aponta para a majestade de Deus tornada pública por sua ação.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: A preposição ב, neste contexto, tem sentido locativo no meio dos povos; “nações” evita associações posteriores e mais específicas de “gentios”.
- source_word: מִשְׁפָּטִי
  choice: o meu juízo
  rationale: מִשְׁפָּט pode indicar juízo, justiça ou decisão judicial. “Juízo” mantém aqui o caráter judicial e punitivo da ação divina sem excluir a ideia de justiça.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que executei
  rationale: Embora עָשָׂה seja literalmente “fazer”, em português se executa um juízo; a formulação exprime com naturalidade a ação judicial do contexto.
- source_word: יָדִי
  choice: a minha mão
  rationale: A imagem hebraica da mão como poder ativo é preservada no texto, em vez de ser substituída pela interpretação “poder”.
- source_word: אֲשֶׁר שַׂמְתִּי בָהֶם
  choice: que pus sobre elas
  rationale: A expressão conserva a metáfora concreta de Deus pôr sua mão sobre as nações em ação de juízo. “Elas” retoma naturalmente “nações” em português.
theological_decisions:
- issue: Sentido da glória de Deus entre as nações
  choice: A majestade de Deus manifestada publicamente por seus atos de juízo
  alternative: A honra divina apenas em sentido abstrato
  rationale: O paralelismo com as nações vendo o juízo e a mão de Deus indica uma glória reconhecível em sua atuação histórica.
- issue: Sentido de “minha mão”
  choice: Metáfora do poder ativo de Deus em juízo, mantida literalmente
  alternative: Substituir a metáfora no texto por “meu poder” ou “minha ação”
  rationale: A imagem é clara e teologicamente expressiva; a nota explica seu valor idiomático sem eliminar a linguagem do original.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens do hebraico foram preservadas onde permanecem naturais. Os marcadores foram posicionados junto aos termos que efetivamente explicam: [a] após “juízo” e [b] após “mão”.'
