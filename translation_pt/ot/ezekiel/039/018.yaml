source:
  edition: WLC
  text: בְּשַׂ֤ר גִּבּוֹרִים֙ תֹּאכֵ֔לוּ וְ/דַם נְשִׂיאֵ֥י הָ/אָ֖רֶץ תִּשְׁתּ֑וּ אֵילִ֨ים כָּרִ֤ים וְ/עַתּוּדִים֙ פָּרִ֔ים מְרִיאֵ֥י בָשָׁ֖ן כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/018.yaml
  text: You will eat the flesh of mighty men[a], and you will drink the blood of the princes of the earth—rams, lambs, male goats, and bulls[b], all of them fattened ones of Bashan.
translation:
  language: pt
  text: Vocês comerão a carne dos guerreiros[a] e beberão o sangue dos príncipes da terra — carneiros, cordeiros, bodes e novilhos, todos eles cevados de Basã.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os animais mencionados a seguir — carneiros, cordeiros, bodes e novilhos — representam metaforicamente os governantes e guerreiros mortos, retratados como vítimas de um sacrifício.
    reason: cultural_note
  - marker: b
    text: 'Ou: “todos eles, os cevados de Basã”. Basã era conhecida por suas pastagens férteis e por seus animais bem alimentados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר
  choice: carne
  rationale: Designa carne corporal em sentido concreto e preserva a imagem crua do banquete sacrificial.
- source_word: גִּבּוֹרִים
  choice: guerreiros
  rationale: No contexto de exércitos derrotados, refere-se naturalmente a homens poderosos em combate; 'guerreiros' é claro e atual.
- source_word: תֹּאכֵלוּ
  choice: vocês comerão
  rationale: O imperfeito na segunda pessoa masculina plural funciona aqui como anúncio profético futuro.
- source_word: דַם
  choice: sangue
  rationale: Mantém sem suavização a imagem literal e grotesca do sacrifício de guerra.
- source_word: נְשִׂיאֵי הָאָרֶץ
  choice: príncipes da terra
  rationale: '''Príncipes'' conserva o registro elevado de נְשִׂיאֵי, e ''terra'' permite o alcance amplo e internacional sugerido pelo contexto.'
- source_word: תִּשְׁתּוּ
  choice: vocês beberão
  rationale: Assim como תֹּאכֵלוּ, é apresentado como declaração profética futura.
- source_word: אֵילִים
  choice: carneiros
  rationale: O sentido animal literal é exigido pela sequência de animais sacrificiais e sustenta sua função metafórica.
- source_word: כָּרִים
  choice: cordeiros
  rationale: Distingue o termo de אֵילִים e comunica de modo natural a ideia de ovinos jovens ou cevados.
- source_word: עַתּוּדִים
  choice: bodes
  rationale: Designa especificamente caprinos machos; 'bodes' é a forma portuguesa direta e corrente.
- source_word: פָּרִים
  choice: novilhos
  rationale: Refere-se a bovinos machos no catálogo sacrificial; 'novilhos' é idiomático no registro bíblico sem ser arcaico.
- source_word: מְרִיאֵי בָשָׁן
  choice: animais cevados de Basã
  rationale: Explicita o referente animal da expressão e evoca o gado bem alimentado das pastagens férteis de Basã, preservando a metáfora aplicada aos mortos.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Retoma coletivamente os animais enumerados de maneira clara e direta.
theological_decisions:
- issue: Se a lista de animais deve ser traduzida apenas como gado literal ou como aposição metafórica aos governantes e guerreiros mortos
  choice: Manter os nomes literais dos animais no texto e indicar sua função metafórica pela pontuação e por uma nota.
  alternative: Substituir ou explicar no próprio texto os animais como categorias de líderes humanos.
  rationale: O hebraico preserva uma lista concreta de animais sacrificiais que representa metaforicamente as vítimas humanas. Manter ambos os níveis evita reduzir a força da imagem de Ezequiel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa plural hebraica foi vertida por 'vocês', evitando o regionalismo de 'vós'. A formulação conserva a violência da imagem sacrificial e o alcance elevado de 'príncipes da terra'.
