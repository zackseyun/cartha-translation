  text: עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה תִּפּ֑וֹל כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/005.yaml
  text: You will fall on the open field[a], for I have spoken[c][b], declares the Lord GOD.
translation:
  language: pt
  text: Você cairá em campo aberto, pois eu falei — declaração do Senhor Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: A expressão idiomática, literalmente “sobre a face do campo”, indica a superfície exposta do campo; “em campo aberto” é natural em português e preserva esse sentido.
- source_word: תִּפּוֹל
  choice: você cairá
  rationale: O imperfeito qal na segunda pessoa masculina singular dirige-se a Gogue e, no contexto profético, anuncia sua queda futura.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão e a garantia da sentença anterior, mantendo um registro profético digno.
- source_word: דִבַּרְתִּי
  choice: eu falei
  rationale: O perfeito hebraico apresenta a palavra divina como proferida e, portanto, certa; o pretérito perfeito é direto e natural em português.
- source_word: נְאֻם
  choice: declaração de
  rationale: Na fórmula profética, identifica solenemente a origem divina do pronunciamento sem transformar o substantivo hebraico em discurso indireto.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: “Senhor” traduz אֲדֹנָי, e “Yahweh” representa diretamente o nome divino יהוה, evitando a combinação artificial “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR / Senhor DEUS
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome próprio יהוה e não apaga o nome divino presente no texto hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ordem sintática natural. A fórmula “declaração do Senhor Yahweh” conserva o caráter oracular de נְאֻם e evita acrescentar um verbo finito que não aparece nessa fórmula nominal hebraica.
