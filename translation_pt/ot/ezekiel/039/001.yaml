source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ הִנָּבֵ֣א עַל גּ֔וֹג וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/001.yaml
  text: 'And you[a], son of man, prophesy against Gog, and say: Thus says the Lord GOD: Behold, I am against you, Gog, prince of Rosh, Meshech, and Tubal.'
translation:
  language: pt
  text: '“E você, filho do homem, profetize contra Gogue e diga: Assim diz o Senhor Yahweh: ‘Eis que estou contra você, Gogue, príncipe principal de Meseque e Tubal[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “príncipe de Rôs, Meseque e Tubal”. A palavra hebraica rosh pode significar “principal” ou ser entendida como nome próprio.'
    reason: Leitura alternativa decorrente de ambiguidade lexical e sintática genuína no hebraico.
lexical_decisions:
- source_word: וְאַתָּה
  choice: E você
  rationale: Preserva o pronome explícito e enfático, dirigindo a ordem diretamente a Ezequiel, sem tornar a frase artificial em português.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a expressão hebraica característica pela qual Deus se dirige repetidamente a Ezequiel e conserva a continuidade literária do livro.
- source_word: הִנָּבֵא עַל
  choice: profetize contra
  rationale: O imperativo pede que Ezequiel profetize, e a preposição, neste oráculo de juízo, tem sentido adversativo.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Representa os dois elementos do título divino sem produzir a repetição pouco natural “Senhor SENHOR” e conserva o nome pessoal יהוה.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Eis que estou contra você
  rationale: “Eis que” preserva a ênfase solene da fórmula profética, enquanto “contra você” comunica seu sentido hostil neste contexto de juízo.
- source_word: נְשִׂיא רֹאשׁ
  choice: príncipe-chefe
  rationale: Toma רֹאשׁ como substantivo qualificativo, produzindo o sentido natural de um príncipe principal ou supremo, sem apagar a leitura alternativa como nome próprio.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Meseque e Tubal
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis desses nomes próprios.
theological_decisions:
- issue: Como representar o nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor Deus
  rationale: A formulação conserva tanto o título אֲדֹנָי quanto o nome da aliança יהוה, evitando fundi-los ou repetir “Senhor”.
- issue: Se רֹאשׁ é qualificativo de נְשִׂיא ou nome próprio
  choice: príncipe-chefe de Meseque e Tubal
  alternative: príncipe de Rôs, Meseque e Tubal
  rationale: A leitura como substantivo qualificativo se ajusta naturalmente à construção hebraica. Como a leitura “Rôs” é antiga e linguisticamente possível, ela é registrada em nota em vez de ser eliminada.
translation_notes:
  register: Português atual, solene e acessível, com legibilidade brasileira. “Eis que” mantém o tom profético elevado; “você” evita arcaísmo e corresponde ao pronome hebraico explícito. A pontuação distingue a introdução profética da fala divina.
