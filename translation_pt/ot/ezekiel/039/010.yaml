  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹֽא יִשְׂא֨וּ עֵצִ֜ים מִן הַ/שָּׂדֶ֗ה וְ/לֹ֤א יַחְטְבוּ֙ מִן הַ/יְּעָרִ֔ים כִּ֥י בַ/נֶּ֖שֶׁק יְבַֽעֲרוּ אֵ֑שׁ וְ/שָׁלְל֣וּ אֶת שֹׁלְלֵי/הֶ֗ם וּ/בָֽזְזוּ֙ אֶת בֹּ֣זְזֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/010.yaml
  text: They will not carry wood from the field[a], nor cut it from the forests, because they will make fires with the weapons. They will plunder those who plundered them and loot those who looted them[b], declares the Lord Yahweh.
translation:
  language: pt
  text: Não trarão lenha do campo nem cortarão lenha das florestas, porque farão fogo com as armas.[a] Saquearão os que os saquearam e pilharão os que os pilharam,[b] declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “com as armas queimarão fogo”; isto é, usarão as armas dos invasores como combustível.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete palavras da mesma raiz: “saquearão os seus saqueadores e pilharão os seus pilhadores”, enfatizando a inversão da situação e a retribuição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ עֵצִים
  choice: trarão lenha
  rationale: O verbo נשׂא com עֵצִים descreve levar ou trazer madeira para servir de combustível. “Trarão lenha” expressa essa ação de modo natural em português, sem acrescentar a ideia específica de recolhê-la.
- source_word: מִן הַשָּׂדֶה
  choice: do campo
  rationale: Mantém o singular definido do hebraico, que pode ter sentido coletivo neste contexto.
- source_word: יַחְטְבוּ מִן הַיְּעָרִים
  choice: cortarão lenha nas florestas
  rationale: חטב designa cortar, especialmente madeira, e יְעָרִים está no plural. A repetição de “lenha” torna a frase clara e natural em português.
- source_word: כִּי בַנֶּשֶׁק יְבַעֲרוּ אֵשׁ
  choice: porque farão fogo com as armas
  rationale: כִּי introduz a razão, e בַנֶּשֶׁק indica o meio empregado. A formulação comunica naturalmente que as armas dos invasores servirão de combustível, sem inserir essa explicação diretamente no texto.
- source_word: וְשָׁלְלוּ אֶת שֹׁלְלֵיהֶם
  choice: Saquearão os que os saquearam
  rationale: Preserva a repetição cognata entre o verbo e o particípio e ressalta a inversão da situação.
- source_word: וּבָזְזוּ אֶת בֹּזְזֵיהֶם
  choice: e pilharão os que os pilharam
  rationale: Mantém a segunda repetição cognata e a distingue do par anterior, refletindo os dois verbos hebraicos paralelos.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: “Declara” traduz a fórmula profética נְאֻם; “Senhor Yahweh” distingue o título אֲדֹנָי do nome divino יְהוִה e preserva este último como nome próprio.
theological_decisions:
- issue: Tradução do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva tanto o título אֲדֹנָי quanto o nome da aliança יְהוִה, evitando fundi-los ou substituir o nome por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações e o paralelismo do hebraico foram preservados, enquanto expressões pouco naturais como “queimar fogo” foram vertidas idiomaticamente. Os marcadores de nota foram colocados junto às expressões que explicam.
