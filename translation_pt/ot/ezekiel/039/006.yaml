source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מָג֔וֹג וּ/בְ/יֹשְׁבֵ֥י הָ/אִיִּ֖ים לָ/בֶ֑טַח וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/006.yaml
  text: And I will send fire on Magog and on those who live securely in the coastlands[a], and they will know that I am Yahweh.
translation:
  language: pt
  text: Enviarei fogo sobre Magogue e sobre os que habitam seguros nas terras costeiras[a]; e eles saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas ilhas”. O termo hebraico pode referir-se a ilhas ou, de modo mais amplo no uso profético, a terras costeiras distantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Enviarei
  rationale: O hifil perfeito com conjunção, no discurso profético, expressa naturalmente uma ação futura do falante divino. “Enviarei” é direto e idiomático com “fogo” como objeto.
- source_word: אֵשׁ
  choice: fogo
  rationale: Mantém o sentido lexical literal e a imagem profética de juízo sem acrescentar uma interpretação no texto principal.
- source_word: בְּמָגוֹג
  choice: sobre Magogue
  rationale: Com o envio de fogo destrutivo, a preposição בְּ pode ser vertida naturalmente por “sobre”, indicando o alvo. A forma portuguesa consagrada do nome é “Magogue”.
- source_word: וּבְיֹשְׁבֵי הָאִיִּים לָבֶטַח
  choice: e sobre os que habitam seguros nas terras costeiras
  rationale: יֹשְׁבֵי é um particípio substantivado, “os que habitam”, e לָבֶטַח qualifica mais naturalmente esses habitantes. “Terras costeiras” comunica o uso geográfico amplo de אִיִּים sem excluir a alternativa “ilhas”.
- source_word: הָאִיִּים
  choice: as terras costeiras
  rationale: O termo pode indicar ilhas ou regiões marítimas litorâneas distantes. No uso profético, “terras costeiras” preserva melhor essa amplitude; a alternativa literal é registrada em nota.
- source_word: לָבֶטַח
  choice: seguros
  rationale: Expressa o estado de segurança dos habitantes e concorda de modo natural com “os que habitam” em português.
- source_word: וְיָדְעוּ
  choice: e eles saberão
  rationale: Preserva a sequência coordenada simples do hebraico, sem inserir um “então” interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Alcance sintático de לָבֶטַח
  choice: 'Qualifica os habitantes: “os que habitam seguros”'
  alternative: 'Ligação mais solta com toda a oração: “em segurança”'
  rationale: A posição e a construção favorecem sua ligação com o particípio “habitantes/os que habitam”, descrevendo a segurança em que vivem antes do juízo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, mantendo a coordenação e as imagens do hebraico. “Habitam seguros” conserva o valor adverbial de לָבֶטַח sem resolver além do necessário a natureza dessa segurança.
