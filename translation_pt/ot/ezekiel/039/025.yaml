source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עַתָּ֗ה אָשִׁיב֙ אֶת שבית יַֽעֲקֹ֔ב וְ/רִֽחַמְתִּ֖י כָּל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/קִנֵּאתִ֖י לְ/שֵׁ֥ם קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/025.yaml
  text: 'Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob[a], and I will have compassion on the whole house of Israel[b], and I will be jealous for my holy name.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: Agora restaurarei a sorte de Jacó[a], terei compaixão de toda a casa de Israel e zelarei[b] pelo meu santo nome.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trarei de volta os cativos de Jacó”. A expressão hebraica pode referir-se especificamente ao retorno do cativeiro ou, de modo mais amplo, à restauração da condição de um povo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “mostrarei ciúme pelo meu santo nome”. O verbo hebraico expressa zelo intenso e exclusivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Expressa com clareza a conclusão decorrente do contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em português digno e corrente.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e mantém explícito o nome pactual presente no hebraico.
- source_word: עַתָּה
  choice: Agora
  rationale: Assinala a transição decisiva para a ação divina prometida.
- source_word: אָשִׁיב אֶת שבית יַעֲקֹב
  choice: restaurarei a sorte de Jacó
  rationale: Reproduz o sentido idiomático amplo de reverter a calamidade e restaurar a condição de um povo, sem limitar necessariamente a promessa ao retorno físico de cativos.
- source_word: וְרִחַמְתִּי
  choice: terei compaixão
  rationale: Comunica a profunda misericórdia expressa por רחם em linguagem natural.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Mantém a expressão coletiva e pactual do texto hebraico.
- source_word: וְקִנֵּאתִי
  choice: zelarei
  rationale: Em português, expressa de modo natural o zelo intenso e exclusivo de Deus, sem sugerir inveja pecaminosa; a nuance de ciúme é preservada em nota.
- source_word: לְשֵׁם קָדְשִׁי
  choice: pelo meu santo nome
  rationale: Indica que o zelo divino se dirige à honra e santidade do próprio nome.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O hebraico traz conjuntamente o título אֲדֹנָי e o nome próprio יהוה. A tradução mantém ambos distintos e torna visível o nome pactual.
- issue: Sentido da expressão de restauração אֶת שבית יעקב
  choice: restaurarei a sorte de Jacó
  alternative: trarei de volta os cativos de Jacó
  rationale: A expressão pode denotar tanto retorno do cativeiro quanto reversão mais ampla da calamidade. O texto principal mantém o sentido idiomático abrangente, e a nota conserva a leitura mais específica.
- issue: Nuance de קנא aplicada a Deus
  choice: zelarei pelo meu santo nome
  alternative: terei ciúme do meu santo nome
  rationale: O verbo comunica zelo ciumento e exclusivo pela santidade do nome divino. “Zelarei” é natural em português, enquanto a nota preserva a nuance lexical de ciúme sem a impor como inveja humana.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e a cadência proféticas foram preservadas sem sacrificar a naturalidade. O marcador da segunda nota foi colocado junto à expressão a que efetivamente se refere.
