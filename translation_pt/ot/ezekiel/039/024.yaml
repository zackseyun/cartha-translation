  text: כְּ/טֻמְאָתָ֥/ם וּ/כְ/פִשְׁעֵי/הֶ֖ם עָשִׂ֣יתִי אֹתָ֑/ם וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/024.yaml
  text: According to their uncleanness and according to their transgressions I dealt with them[a], and I hid my face from them.
translation:
  language: pt
  text: De acordo com a impureza deles e com as transgressões deles, eu os tratei e escondi deles o meu rosto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּטֻמְאָתָם
  choice: de acordo com a impureza deles
  rationale: O כ prefixado expressa conformidade ou medida. Em Ezequiel, טֻמְאָה pode abranger impureza ritual e moral; “impureza” conserva essa amplitude em português atual.
- source_word: וּכְפִשְׁעֵיהֶם
  choice: e as transgressões deles
  rationale: A preposição כ rege coordenadamente os dois substantivos, de modo que “de acordo com” se aplica também a “transgressões”. פֶּשַׁע comunica transgressão com forte componente de rebeldia contra Deus.
- source_word: עָשִׂיתִי אֹתָם
  choice: Eu os tratei
  rationale: Neste contexto, a construção idiomática עשה com objeto significa agir para com alguém ou tratá-lo, não fazê-lo ou criá-lo.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: e escondi deles o meu rosto
  rationale: Mantém a metáfora hebraica tradicional, que comunica a retirada da presença ou do favor divino em juízo sem limitar o sentido a uma única paráfrase.
theological_decisions:
- issue: Sentido da impureza em טֻמְאָה
  choice: impureza
  alternative: imundícia
  rationale: “Impureza” é natural e digna no português moderno e pode incluir tanto contaminação ritual quanto moral, preservando a amplitude do uso profético.
- issue: Metáfora divina de esconder o rosto
  choice: escondi deles o meu rosto
  alternative: retirei deles o meu favor
  rationale: A tradução conserva a imagem teologicamente significativa do hebraico e não reduz sua referência apenas a favor, presença ou proteção.
- issue: Força de פֶּשַׁע
  choice: transgressões
  alternative: rebeldias
  rationale: “Transgressões” preserva o caráter moral e pactual da falta sem exigir que cada ocorrência seja explicitada como rebelião aberta.
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A repetição hebraica da preposição foi condensada por coordenação, sem perda do alcance semântico: “de acordo com” rege tanto “impureza” quanto “transgressões”. Não há variantes que exijam nota.'
