  text: הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה ה֥וּא הַ/יּ֖וֹם אֲשֶׁ֥ר דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/008.yaml
  text: Behold[a], it is coming, and it will happen, declares the Lord GOD. This is the day of which I have spoken.
translation:
  language: pt
  text: Eis que vem e acontecerá — declara o Senhor Yahweh. Este é o dia do qual falei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Eis que chegou e aconteceu”. O hebraico emprega formas que podem apresentar o futuro como tão certo que se fala dele como já realizado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a partícula profética que chama a atenção para a certeza e a iminência do anúncio, em registro elevado mas compreensível.
- source_word: בָאָה
  choice: isso vem
  rationale: O perfeito hebraico feminino pode apresentar o acontecimento futuro como tão certo que já é contemplado como realizado. O pronome neutro evita introduzir em português um referente feminino não expresso.
- source_word: וְנִהְיָתָה
  choice: e acontecerá
  rationale: Expressa de modo natural o sentido de vir a ocorrer, mantendo a sequência entre aproximação e realização.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente e digno da fórmula profética de pronunciamento divino.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, título que significa 'Senhor', do nome divino יהוה, transliterado Yahweh, sem produzir a repetição artificial 'Senhor SENHOR'.
- source_word: הוּא הַיּוֹם
  choice: Este é o dia
  rationale: Comunica a força identificadora e enfática do pronome הוּא em português natural.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: do qual falei
  rationale: Mantém a referência à palavra divina anteriormente pronunciada e acompanha de perto a relação sintática do hebraico.
theological_decisions:
- issue: Representação do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O hebraico contém tanto o título אֲדֹנָי quanto o nome próprio יהוה. A tradução os distingue de forma transparente e evita ocultar o nome divino sob um título substitutivo.
- issue: Valor temporal dos perfeitos בָאָה e נִהְיָתָה
  choice: isso vem e acontecerá
  alternative: chegou e aconteceu
  rationale: No contexto profético, as formas perfeitas podem apresentar um evento futuro como absolutamente certo. O texto principal comunica essa referência futura, enquanto a nota preserva a forma mais estritamente formal e sua tensão retórica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Eis que” conserva o tom profético; a construção evita arcaísmos desnecessários. O marcador [a] aparece no texto principal e explica a ambiguidade temporal genuína.
