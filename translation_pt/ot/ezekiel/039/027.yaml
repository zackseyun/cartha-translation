  text: בְּ/שׁוֹבְבִ֤/י אוֹתָ/ם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֹתָ֔/ם מֵֽ/אַרְצ֖וֹת אֹֽיְבֵי/הֶ֑ם וְ/נִקְדַּ֣שְׁתִּי בָ֔/ם לְ/עֵינֵ֖י הַ/גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/027.yaml
  text: when I bring them back from the peoples and gather them from the lands of their enemies[a], and I am shown holy through them before the eyes of many nations.
translation:
  language: pt
  text: quando eu os trouxer de volta dentre os povos e os reunir das terras de seus inimigos, e manifestar por meio deles a minha santidade diante dos olhos de muitas nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e eu for santificado neles” ou “e me mostrar santo por meio deles”. A ideia é que a santidade do SENHOR será publicamente demonstrada pelo que ele fará com eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹבְבִי אוֹתָם
  choice: quando eu os trouxer de volta
  rationale: O infinitivo construto no hifil, com בְּ temporal e sufixo de primeira pessoa, indica a ocasião em que Deus fará o povo retornar; a formulação preserva o retorno geográfico do exílio.
- source_word: מִן הָעַמִּים
  choice: dentre os povos
  rationale: “Povos” conserva a distinção lexical entre עַמִּים aqui e גּוֹיִם no fim do versículo; “dentre” expressa com naturalidade a procedência do meio deles.
- source_word: וְקִבַּצְתִּי אֹתָם
  choice: e os reunir
  rationale: קבץ significa reunir ou ajuntar. Em português, o infinitivo coordenado com “trouxer” produz uma sequência temporal natural após “quando”.
- source_word: מֵאַרְצוֹת אֹיְבֵיהֶם
  choice: das terras de seus inimigos
  rationale: Mantém o plural geográfico de אֲרָצוֹת e a relação possessiva do hebraico.
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: e manifestar por meio deles a minha santidade
  rationale: O nifal de קדש, com Deus como sujeito, comunica que sua santidade será publicamente demonstrada, não que ele passará a ser santo. “Por meio deles” representa o valor instrumental possível de בָם.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Preserva a imagem hebraica de algo realizado de modo público e visível.
- source_word: הַגּוֹיִם רַבִּים
  choice: muitas nações
  rationale: גּוֹיִם designa aqui nações no cenário internacional, e רַבִּים indica sua grande quantidade.
theological_decisions:
- issue: Linguagem da santificação divina
  choice: manifestar por meio deles a minha santidade
  alternative: ser santificado neles / mostrar-me santo neles
  rationale: A tradução explicita a manifestação pública da santidade de Deus mediante seus atos em favor de Israel, sem sugerir mudança em sua santidade intrínseca. A nota preserva as formas mais literais e a ambiguidade de בָם entre “neles” e “por meio deles”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “manifestar a minha santidade” evita o sentido potencialmente enganoso de que Deus se torna santo, enquanto a nota conserva a forma passiva/reflexiva e a preposição do hebraico.
