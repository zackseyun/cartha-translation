  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם בְּ/הַגְלוֹתִ֤/י אֹתָ/ם֙ אֶל הַ/גּוֹיִ֔ם וְ/כִנַּסְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹֽא אוֹתִ֥יר ע֛וֹד מֵ/הֶ֖ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/028.yaml
  text: Then they will know that I am Yahweh their God[a], when I exiled them among the nations and then gathered them onto their own land, and I will leave none of them there any longer.
translation:
  language: pt
  text: Então eles saberão que eu sou Yahweh, o Deus deles[a], quando eu os tiver levado para o exílio entre as nações e depois os tiver reunido para a própria terra deles; não deixarei mais nenhum deles lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles saberão que eu sou Yahweh, o Deus deles, por tê-los levado para o exílio entre as nações e reunido para a própria terra deles.”'
    reason: O בְּ ligado ao infinitivo pode ser entendido temporalmente (“quando”) ou instrumentalmente (“por, mediante”).
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Então eles saberão
  rationale: O verbo expressa conhecer ou reconhecer. “Então” comunica naturalmente o resultado e a sequência do contexto, embora a conjunção também possa ser traduzida apenas por “e”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: o Deus deles
  rationale: Reproduz de modo claro a construção possessiva hebraica e evita a possível ambiguidade de “seu Deus” em português.
- source_word: בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם
  choice: quando eu os tiver levado para o exílio entre as nações
  rationale: A forma causativa de גלה indica que Deus os levou ao exílio. O futuro composto apresenta a ação como concluída no momento futuro em que reconhecerão Yahweh; a preposição בְּ também admite valor instrumental, registrado na nota.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos estrangeiros entre os quais Israel foi disperso, sem exigir a formulação teológica “gentios”.
- source_word: וְכִנַּסְתִּים
  choice: e depois os tiver reunido
  rationale: כנס significa reunir ou ajuntar. “Depois” explicita naturalmente a sequência entre exílio e restauração sem alterar a relação contextual.
- source_word: עַל אַדְמָתָם
  choice: na própria terra deles
  rationale: No contexto de restauração, אַדָמָה designa a terra pertencente ao povo. A formulação é idiomática e deixa explícita a posse.
- source_word: וְלֹא אוֹתִיר עוֹד מֵהֶם שָׁם
  choice: não deixarei mais nenhum deles lá
  rationale: A forma verbal expressa não deixar alguém remanescente. “Lá” retoma o lugar do exílio entre as nações, e “mais” traduz naturalmente עוֹד.
theological_decisions:
- issue: Valor da preposição בְּ antes do infinitivo em בְּהַגְלוֹתִי
  choice: 'Leitura temporal: “quando eu os tiver levado para o exílio”'
  alternative: 'Leitura instrumental: “por tê-los levado para o exílio”'
  rationale: A leitura temporal se encaixa bem na sequência projetada de exílio, reunião e reconhecimento, mas o hebraico permite entender as ações como o meio pelo qual eles reconhecerão Yahweh; essa possibilidade foi preservada em nota.
- issue: Referente de שָׁם (“lá”)
  choice: As nações, isto é, o lugar do exílio
  alternative: Uma referência locativa geral não especificada
  rationale: O contraste imediato é entre o exílio entre as nações e a reunião na terra do povo. Assim, a promessa é que nenhum deles permanecerá no exílio.
- issue: Perspectiva temporal das ações de exilar, reunir e não deixar
  choice: Exílio e reunião são apresentados como concluídos no ponto futuro do reconhecimento; “não deixarei” permanece como promessa futura
  alternative: 'Traduzir os perfeitos hebraicos com formas passadas: “levei... reuni”'
  rationale: A fala profética projeta o reconhecimento e a restauração, enquanto a forma imperfeita de אוֹתִיר sustenta naturalmente a promessa “não deixarei”. A escolha portuguesa mantém essa perspectiva sem apagar a anterioridade das duas primeiras ações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preferiu-se “o Deus deles” e “na própria terra deles” para evitar ambiguidades pronominais. O ponto e vírgula conserva a estreita ligação da promessa final com a frase anterior sem produzir um período excessivamente longo.
