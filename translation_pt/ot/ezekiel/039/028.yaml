  source_fidelity: 'A tradução preserva bem o sentido central: o reconhecimento de Yahweh, o exílio entre as nações, o ajuntamento do povo e a promessa de que ninguém permanecerá no lugar do exílio. O futuro composto é uma maneira defensável de expressar, em português, a anterioridade das ações de exilar e reunir em relação ao reconhecimento futuro. Contudo, “reunido na própria terra deles” pode sugerir apenas uma reunião já situada na terra, enquanto עַל אַדְמָתָם expressa mais diretamente o destino do ajuntamento: para a terra deles.'
  naturalness: O registro é moderno, claro e adequado. “Para a própria terra deles” é tão natural quanto a formulação atual e explicita melhor o movimento restaurador. Na nota, “por eu os ter levado” é gramatical, mas menos idiomático que “por tê-los levado”.
  terminology: “Yahweh”, “o Deus deles”, “exílio”, “nações” e “terra” são escolhas consistentes com o hebraico e com o registro solicitado. “Lá” mantém adequadamente a referência ao lugar do exílio, sem introduzir uma identificação indevida.
