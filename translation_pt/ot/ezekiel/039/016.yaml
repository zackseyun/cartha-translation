lexical_decisions:
- source_word: וְגַם
  choice: E ... também
  rationale: Preserva de modo natural a força aditiva da conjunção com o advérbio, ligando este detalhe ao contexto anterior.
- source_word: שֵׁם עִיר
  choice: o nome da cidade
  rationale: A construção hebraica indica o nome de uma cidade específica associada ao local de sepultamento.
- source_word: הֲמוֹנָה
  choice: Hamoná
  rationale: É um topônimo, portanto foi transliterado em vez de traduzido; a acentuação gráfica facilita a pronúncia em português.
- source_word: וְטִהֲרוּ
  choice: Assim, purificarão
  rationale: O perfeito piel com conjunção tem valor futuro/resultativo no contexto. “Assim” expressa a consequência do sepultamento, e “purificar” preserva o sentido de remover a impureza da terra.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se ao território em questão, especialmente à terra de Israel no contexto, e não necessariamente ao planeta inteiro.
