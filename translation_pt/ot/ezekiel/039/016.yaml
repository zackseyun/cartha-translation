  text: And the name of the city will also be Hamonah[a]. Thus they will cleanse the land.
translation:
  language: pt
  text: E o nome da cidade também será Hamoná[a]. Assim, purificarão a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hamoná é um nome de lugar provavelmente relacionado à palavra hebraica que significa “multidão” ou “horda”.
