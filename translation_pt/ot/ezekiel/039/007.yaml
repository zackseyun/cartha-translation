  text: וְ/אֶת שֵׁ֨ם קָדְשִׁ֜/י אוֹדִ֗יעַ בְּ/תוֹךְ֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/לֹֽא אַחֵ֥ל אֶת שֵׁם קָדְשִׁ֖/י ע֑וֹד וְ/יָדְע֤וּ הַ/גּוֹיִם֙ כִּי אֲנִ֣י יְהוָ֔ה קָד֖וֹשׁ בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/007.yaml
  text: And I will make my holy name known in the midst of my people Israel[a], and I will no longer let my holy name be profaned; and the nations will know that I am Yahweh[b], the Holy One in Israel.
translation:
  language: pt
  text: Farei meu santo nome conhecido no meio do meu povo Israel e não permitirei mais que meu santo nome seja profanado[a]. E as nações saberão que eu sou Yahweh, o Santo em Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não profanarei mais meu santo nome”. O verbo hebraico pode ser entendido dessa maneira, embora o contexto favoreça o sentido de que Yahweh não permitirá mais que seu nome seja profanado.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “que eu sou Yahweh, santo em Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם קָדְשִׁי
  choice: meu santo nome
  rationale: A construção hebraica significa idiomaticamente “meu santo nome”, abrangendo o nome revelado, a reputação e a santidade de Deus.
- source_word: אוֹדִיעַ
  choice: farei ... conhecido
  rationale: O hifil de ידע tem força causativa, e o objeto expresso é “meu santo nome”.
- source_word: בְּתוֹךְ עַמִּי יִשְׂרָאֵל
  choice: no meio do meu povo Israel
  rationale: Preserva a imagem concreta de presença dentro da comunidade e identifica Israel como o povo de Deus.
- source_word: אַחֵל
  choice: não permitirei ... que ... seja profanado
  rationale: O hifil de חלל admite sentido ativo ou causativo/permissivo. No contexto da vindicação do nome divino, a formulação permissiva é natural em português, sem eliminar a alternativa mais literal, registrada em nota.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos demais povos de modo amplo, não necessariamente ao contraste posterior expresso por “gentios”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: o Santo em Israel
  rationale: Conserva a possível força substantivada de קָדוֹשׁ e a relação espacial de בְּ, enquanto a leitura predicativa permanece em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada.
- issue: Agência em וְלֹא אַחֵל אֶת שֵׁם קָדְשִׁי עוֹד
  choice: não permitirei mais que meu santo nome seja profanado
  alternative: não profanarei mais meu santo nome
  rationale: O contexto favorece a ideia de que Deus deixará de permitir a profanação de seu nome, mas a forma hebraica também comporta a tradução ativa mais literal, mantida em nota para preservar a tensão.
- issue: Função de קָדוֹשׁ em קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: o Santo em Israel
  alternative: santo em Israel
  rationale: A ausência de artigo não impede uso predicativo ou substantivado em hebraico. O texto principal adota a leitura titular natural em português, e a nota conserva a leitura predicativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “No meio de” conserva a imagem hebraica; “profanado” mantém o vocabulário religioso necessário sem arcaísmo excessivo. Os marcadores [a] e [b] aparecem no texto principal.
