  text: וְ/הָיָ֣ה בַ/יּ֣וֹם הַ/ה֡וּא אֶתֵּ֣ן לְ/גוֹג֩ מְקֽוֹם שָׁ֨ם קֶ֜בֶר בְּ/יִשְׂרָאֵ֗ל גֵּ֤י הָ/עֹֽבְרִים֙ קִדְמַ֣ת הַ/יָּ֔ם וְ/חֹסֶ֥מֶת הִ֖יא אֶת הָ/עֹֽבְרִ֑ים וְ/קָ֣בְרוּ שָׁ֗ם אֶת גּוֹג֙ וְ/אֶת כָּל הֲמוֹנֹ֔/ה וְ/קָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/011.yaml
  text: And it will be in that day that I will give Gog a burial place there in Israel[a], the Valley of the Travelers, east of the sea; and it will block the travelers. There they will bury Gog and all his multitude[c][b], and they will call it the Valley of Hamon-gog.
translation:
  language: pt
  text: 'Naquele dia, darei a Gogue um lugar de sepultura ali em Israel: o Vale dos Viajantes[a], a leste do mar[b]. Esse vale impedirá a passagem dos viajantes. Ali sepultarão Gogue e toda a sua multidão; e chamarão o lugar de Vale de Hamom-Gogue[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o vale dos que passam” ou “o vale dos transeuntes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante do mar”; a expressão hebraica pode indicar orientação, e não necessariamente uma direção estritamente oriental.
    reason: lexical_alternative
  - marker: c
    text: Hamom-Gogue provavelmente significa “multidão de Gogue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Reproduz de modo natural e digno a fórmula profética hebraica, sem o arcaísmo de uma tradução como “e acontecerá naquele dia”.
- source_word: מְקוֹם שָׁם קֶבֶר
  choice: um lugar de sepultura ali
  rationale: Conserva os elementos “lugar”, “ali” e “sepultura”, com sintaxe portuguesa corrente.
- source_word: גֵּי הָעֹבְרִים
  choice: o Vale dos Viajantes
  rationale: O particípio substantivado designa os que passam ou atravessam. “Viajantes” é claro e natural e também funciona bem como parte de um topônimo; a alternativa mais literal é registrada em nota.
- source_word: קִדְמַת הַיָּם
  choice: a leste do mar
  rationale: Em uma descrição geográfica, קִדְמַת provavelmente indica a posição a leste do mar. A possibilidade de orientação espacial mais literal é mantida em nota.
- source_word: וְחֹסֶמֶת הִיא אֶת הָעֹבְרִים
  choice: Esse vale impedirá a passagem dos viajantes
  rationale: 'Expressa naturalmente em português o sentido de חסם, “bloquear, obstruir”, e deixa explícito apenas o que a construção implica: os viajantes ficarão impedidos de passar.'
- source_word: הֲמוֹנוֹ
  choice: toda a sua multidão
  rationale: “Multidão” mantém a amplitude sem acrescentar a conotação depreciativa ou militar mais forte de “horda”.
- source_word: גֵּיא הֲמוֹן גּוֹג
  choice: Vale de Hamom-Gogue
  rationale: A transliteração preserva a função de nome geográfico, enquanto a nota apresenta seu provável significado.
theological_decisions:
- issue: Traduzir semanticamente ou transliterar o nome final do vale
  choice: Transliterar como “Hamom-Gogue” no texto principal
  alternative: “Vale da Multidão de Gogue”
  rationale: A expressão funciona como um novo nome de lugar. A transliteração preserva esse caráter, sem ocultar seu sentido provável, explicado em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada para fluência sem apagar o “ali” do hebraico. Os topônimos recebem iniciais maiúsculas, e “Gog” foi aportuguesado como “Gogue”.
