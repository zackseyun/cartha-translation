id: EZK.39.20
reference: Ezekiel 39:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/שְׂבַעְתֶּ֤ם עַל שֻׁלְחָנִ/י֙ ס֣וּס וָ/רֶ֔כֶב גִּבּ֖וֹר וְ/כָל אִ֣ישׁ מִלְחָמָ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/020.yaml
  text: And you will be filled at my table with horse and chariot[a], mighty man and every man of war[b], declares the Lord GOD.
translation:
  language: pt
  text: E vocês se fartarão à minha mesa de cavalos e carros de guerra[a], de guerreiros valentes e de todos os homens de guerra[b] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cavalo e carro”; as formas no singular provavelmente têm sentido coletivo, referindo-se a cavalos e carros de guerra.'
    reason: lexical_alternative
  - marker: b
    text: “Guerreiros valentes” também pode ser traduzido por “homens poderosos” ou “valentes”; a expressão seguinte significa literalmente “todo homem de guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂבַעְתֶּם
  choice: E vocês se fartarão
  rationale: O verbo שׂבע indica comer até ficar saciado. “Fartar-se” expressa com naturalidade a saciedade resultante e mantém a imagem do banquete sacrificial.
- source_word: עַל שֻׁלְחָנִ/י
  choice: à minha mesa
  rationale: Embora עַל possa significar literalmente “sobre”, em português a expressão idiomática para comer em uma mesa é “à minha mesa”.
- source_word: סוּס וָ/רֶכֶב
  choice: cavalos e carros de guerra
  rationale: Os substantivos hebraicos estão no singular, mas funcionam coletivamente nesta enumeração. O plural natural em português torna explícito esse valor coletivo; “carros de guerra” evita a leitura moderna de automóveis.
- source_word: גִּבּוֹר
  choice: guerreiros valentes
  rationale: גִּבּוֹר designa alguém forte, valente ou poderoso, frequentemente no âmbito militar. A expressão preserva essa qualidade e a distingue parcialmente da designação mais geral seguinte.
- source_word: וְ/כָל אִישׁ מִלְחָמָה
  choice: e de todos os homens de guerra
  rationale: A expressão significa literalmente “todo homem de guerra” e se refere especificamente a combatentes do contexto militar antigo.
- source_word: נְאֻם
  choice: declara
  rationale: Na fórmula profética, “declara” comunica de modo atual e solene a introdução ou conclusão de um pronunciamento divino.
- source_word: אֲדֹנָ/י יְהוִה
  choice: o Senhor Yahweh
  rationale: “Senhor” traduz אֲדֹנָי, enquanto “Yahweh” representa o nome divino יהוה, preservando ambos os elementos do título sem produzir a repetição “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome pessoal יהוה e preserva no texto a presença explícita do nome divino.
- issue: Identidade dos convidados que se fartam
  choice: manter o sujeito apenas como “vocês”
  alternative: explicitar “aves e animais selvagens”
  rationale: O referente é fornecido pelo contexto anterior, mas não aparece neste versículo; por isso, não foi acrescentado ao texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “de” organiza naturalmente a enumeração dos seres devorados. “Carros de guerra” esclarece o sentido antigo de רֶכֶב. Os marcadores [a] e [b] aparecem junto aos trechos correspondentes.
