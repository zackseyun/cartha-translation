  text: וְ/אַנְשֵׁ֨י תָמִ֤יד יַבְדִּ֨ילוּ֙ עֹבְרִ֣ים בָּ/אָ֔רֶץ מְקַבְּרִ֣ים אֶת הָ/עֹבְרִ֗ים אֶת הַ/נּוֹתָרִ֛ים עַל פְּנֵ֥י הָ/אָ֖רֶץ לְ/טַֽהֲרָ֑/הּ מִ/קְצֵ֥ה שִׁבְעָֽה חֳדָשִׁ֖ים יַחְקֹֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/014.yaml
  text: And they will set apart men continually[a], who will pass through the land burying those who pass through, those left on the surface of the land, to cleanse it[c][b]. At the end of seven months they will make a search.
translation:
  language: pt
  text: E designarão homens para uma tarefa contínua[a]. Eles percorrerão a terra, enterrando os que a percorrem — os que ficaram sobre a superfície da terra —, a fim de purificá-la. Ao fim de sete meses, farão uma busca minuciosa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens designados regularmente”. O hebraico diz literalmente “homens de continuidade” e indica uma incumbência constante.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “investigarão cuidadosamente” ou “examinarão a fundo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי תָמִיד
  choice: homens para essa tarefa contínua
  rationale: A expressão construta significa literalmente “homens de continuidade”. A formulação portuguesa comunica uma incumbência permanente ou regular sem transformar a expressão em um título técnico.
- source_word: יַבְדִּילוּ
  choice: separarão
  rationale: O hifil de בדל significa separar ou pôr à parte. “Separarão” conserva o sentido formal de destinação, enquanto o complemento explicita que se trata de uma tarefa.
- source_word: עֹבְרִים בָּאָרֶץ
  choice: percorrerão a terra
  rationale: O particípio de עבר descreve os homens designados passando por toda a terra. Em português, a forma verbal finita produz uma sequência natural e clara.
- source_word: מְקַבְּרִים
  choice: enterrando
  rationale: O particípio expressa a ação concomitante realizada pelos que percorrem a terra.
- source_word: הָעֹבְרִים
  choice: os que a percorrem
  rationale: A tradução preserva a repetição difícil da raiz עבר, sem decidir silenciosamente se a expressão é uma designação dos mortos encontrados ou um eco deliberado da atividade dos encarregados.
- source_word: הַנּוֹתָרִים עַל־פְּנֵי הָאָרֶץ
  choice: os que ficaram sobre a superfície da terra
  rationale: A expressão retrata os que restaram expostos no terreno. “Terra” mantém o referente local, e “superfície” evita acrescentar explicitamente “corpos”, embora o contexto funerário o indique.
- source_word: לְטַהֲרָהּ
  choice: a fim de purificá-la
  rationale: “Purificar” preserva tanto a dimensão ritual da contaminação causada pelos cadáveres quanto a limpeza concreta da terra.
- source_word: מִקְצֵה שִׁבְעָה חֳדָשִׁים
  choice: Ao fim de sete meses
  rationale: A expressão marca o ponto em que começa a busca subsequente.
- source_word: יַחְקֹרוּ
  choice: farão uma busca minuciosa
  rationale: חקר indica procurar, examinar ou investigar cuidadosamente. A formulação transmite o caráter organizado e completo da busca.
theological_decisions:
- issue: Natureza da purificação da terra
  choice: “purificá-la”, preservando em conjunto os sentidos ritual e concreto
  alternative: Restringir a expressão exclusivamente à purificação cerimonial ou exclusivamente à remoção física dos cadáveres
  rationale: No contexto de Ezequiel, os mortos expostos contaminam a terra, mas o texto não separa a dimensão ritual da ação prática de enterrá-los.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma cadeia pesada de particípios, sem eliminar a repetição deliberadamente difícil de עבר. Os marcadores de nota aparecem junto às expressões que esclarecem.
