  terminology: “Designarão” comunica melhor neste contexto administrativo o hifil de בדל do que “separarão”, que em português pode sugerir mera segregação física. “Purificá-la” preserva adequadamente a abrangência ritual e concreta de לטהרה. As notas e seus marcadores estão completos e corretamente ancorados.
