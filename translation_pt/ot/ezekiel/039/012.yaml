  text: וּ/קְבָרוּ/ם֙ בֵּ֣ית יִשְׂרָאֵ֔ל לְמַ֖עַן טַהֵ֣ר אֶת הָ/אָ֑רֶץ שִׁבְעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/012.yaml
  text: The house of Israel will bury them for seven months[a], in order to cleanse the land.
translation:
  language: pt
  text: A casa de Israel os enterrará durante sete meses, a fim de purificar a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְבָרוּם
  choice: os enterrará
  rationale: O perfeito qal com conjunção tem sentido futuro na sequência profética; o pronome “os” preserva o sufixo de objeto, que remete aos cadáveres dos inimigos.
- source_word: בֵּית יִשְׂרָאֵל
  choice: A casa de Israel
  rationale: Mantém a expressão coletiva recorrente nos profetas e sua força corporativa, sem reduzi-la simplesmente a “os israelitas”.
- source_word: לְמַעַן
  choice: a fim de
  rationale: Expressa de modo claro e natural a finalidade indicada pela preposição hebraica.
- source_word: טַהֵר
  choice: purificar
  rationale: O piel de טהר indica tornar limpo, inclusive em sentido ritual. “Purificar” preserva aqui tanto a dimensão da impureza causada pelos cadáveres quanto a restauração da terra.
- source_word: אֶת־הָאָרֶץ
  choice: a terra
  rationale: No contexto, refere-se ao território de Israel contaminado pelos cadáveres, não necessariamente ao planeta inteiro.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: durante sete meses
  rationale: Traduz naturalmente o acusativo de duração e deixa claro o período pelo qual o sepultamento prosseguirá.
theological_decisions:
- issue: Natureza da purificação da terra
  choice: purificar a terra
  alternative: limpar a terra
  rationale: “Purificar” conserva a dimensão ritual e física da impureza causada por cadáveres sem introduzir um mecanismo doutrinário alheio ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada ao uso natural do português, mantendo a designação profética “casa de Israel” e a finalidade ritual do sepultamento.
