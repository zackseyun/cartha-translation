source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אֱמֹר֩ לְ/צִפּ֨וֹר כָּל כָּנָ֜ף וּ/לְ/כֹ֣ל חַיַּ֣ת הַ/שָּׂדֶ֗ה הִקָּבְצ֤וּ וָ/בֹ֨אוּ֙ הֵאָסְפ֣וּ מִ/סָּבִ֔יב עַל זִבְחִ֗/י אֲשֶׁ֨ר אֲנִ֜י זֹבֵ֤חַ לָ/כֶם֙ זֶ֣בַח גָּד֔וֹל עַ֖ל הָרֵ֣י יִשְׂרָאֵ֑ל וַ/אֲכַלְתֶּ֥ם בָּשָׂ֖ר וּ/שְׁתִ֥יתֶם דָּֽם־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/017.yaml
  text: 'And you[a], son of man, thus says the Lord GOD: Say to every bird of every wing and to every beast of the field, ‘Gather yourselves and come; assemble from all around to my sacrifice that I am sacrificing for you, a great sacrifice on the mountains of Israel[b], and you shall eat flesh and drink blood.’'
translation:
  language: pt
  text: 'Quanto a você, filho do homem, assim diz o Senhor Yahweh: “Diga a toda espécie de ave[a] e a todos os animais do campo: ‘Reúnam-se e venham! Ajuntem-se de todos os lados para o meu sacrifício[b], que ofereço para vocês — um grande sacrifício nos montes de Israel. Vocês comerão carne e beberão sangue.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a toda ave de toda asa”, expressão que abrange todas as aves.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para o banquete sacrificial que preparo para vocês”. O hebraico emprega o substantivo “sacrifício” com um verbo da mesma raiz, enfatizando a cena sacrificial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a forma de tratamento profética recorrente em Ezequiel e corresponde de perto à expressão hebraica, sem substituí-la por uma interpretação como “mortal”.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: 'Representa os dois elementos do título composto: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”, evitando fundi-los num único título.'
- source_word: צִפּוֹר כָּל כָּנָף
  choice: toda espécie de ave
  rationale: A expressão, literalmente relacionada a “ave de toda asa”, abrange todas as aves. A formulação escolhida comunica naturalmente em português seu valor distributivo universal.
- source_word: חַיַּת הַשָּׂדֶה
  choice: todos os animais do campo
  rationale: Expressão hebraica habitual para os animais selvagens terrestres. “Animais do campo” conserva a imagem bíblica e é compreensível no português atual.
- source_word: הִקָּבְצוּ ... הֵאָסְפוּ
  choice: Reúnam-se ... Ajuntem-se
  rationale: Preserva a sequência enfática de dois imperativos hebraicos quase sinônimos, usando verbos distintos e naturais em português.
- source_word: מִסָּבִיב
  choice: de todos os lados
  rationale: Expressa claramente a chegada proveniente de todas as direções ao redor.
- source_word: עַל זִבְחִי אֲשֶׁר אֲנִי זֹבֵחַ לָכֶם
  choice: para o meu sacrifício, que ofereço para vocês
  rationale: Conserva a direção indicada no contexto e a cena sacrificial. “Ofereço” evita uma repetição pouco natural em português, enquanto a nota registra o emprego hebraico do substantivo e do verbo cognato.
- source_word: זֶבַח גָּדוֹל
  choice: um grande sacrifício
  rationale: Mantém explícita a moldura sacrificial; o aspecto de banquete é comunicado pelo convite subsequente para comer e beber.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: os montes de Israel
  rationale: Equivalente direto e idiomático da expressão geográfica recorrente em Ezequiel.
- source_word: וַאֲכַלְתֶּם בָּשָׂר וּשְׁתִיתֶם דָּם
  choice: Vocês comerão carne e beberão sangue
  rationale: Mantém sem suavização a imagem deliberadamente chocante do juízo, dirigida às aves e aos animais.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor Deus
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e preserva este último de modo transparente, sem acrescentar uma interpretação denominacional.
- issue: Caráter sacrificial e de banquete de זֶבַח
  choice: sacrifício
  alternative: banquete sacrificial
  rationale: “Sacrifício” preserva diretamente a linguagem cultual e a tensão grotesca da cena de juízo; o sentido de refeição sacrificial permanece perceptível no ato de comer carne e beber sangue.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. Os imperativos plurais são vertidos com formas correntes; a repetição retórica do hebraico é preservada onde soa natural, e explicada em nota quando uma reprodução literal seria rígida.
