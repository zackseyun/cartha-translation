  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָבְר֤וּ הָ/עֹֽבְרִים֙ בָּ/אָ֔רֶץ וְ/רָאָה֙ עֶ֣צֶם אָדָ֔ם וּ/בָנָ֥ה אֶצְל֖/וֹ צִיּ֑וּן עַ֣ד קָבְר֤וּ אֹת/וֹ֙ הַֽ/מְקַבְּרִ֔ים אֶל גֵּ֖יא הֲמ֥וֹן גּֽוֹג־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
translation:
  language: pt
  text: Os que percorrerem a terra irão percorrê-la e, quando um deles vir um osso humano[a], colocará ao lado dele um sinal, até que os encarregados de sepultar o sepultem no vale de Hamom-Gogue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um osso de homem”. O hebraico usa adam, que pode significar “homem” ou referir-se genericamente a um ser humano; neste contexto, o sentido genérico parece mais adequado.'
    reason: lexical_alternative
  - marker: b
    text: Hamom-Gogue provavelmente significa “a multidão de Gogue” ou “a multidão pertencente a Gogue”; aqui, a expressão é mantida como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים
  choice: Os que percorrerem a terra irão percorrê-la
  rationale: Mantém, de forma compreensível em português, a repetição enfática ou iterativa da raiz עבר no verbo e no particípio substantivado.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: No contexto, designa o território que será inspecionado, não o planeta inteiro.
- source_word: וְרָאָה
  choice: quando um deles vir
  rationale: 'O singular masculino funciona de modo distributivo em relação ao grupo plural: qualquer indivíduo entre os que percorrem a terra.'
- source_word: עֶצֶם אָדָם
  choice: um osso humano
  rationale: אָדָם tem aqui sentido humano genérico, sem indicar necessariamente uma pessoa do sexo masculino.
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
  choice: colocará ao lado dele um sinal
  rationale: Embora בנה signifique literalmente construir, neste contexto צִיּוּן é um sinal ou marco erguido para indicar onde está o osso.
- source_word: עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים
  choice: até que os encarregados de sepultar o sepultem
  rationale: Expressa a função do grupo designado para o sepultamento e preserva a repetição da raiz קבר sem recorrer ao menos adequado 'coveiros'.
- source_word: אֶל גֵּיא הֲמוֹן גּוֹג
  choice: no vale de Hamom-Gogue
  rationale: Trata הֲמוֹן גּוֹג como topônimo e emprega 'no' de acordo com o uso idiomático português depois de 'sepultar'.
theological_decisions:
- issue: Sentido de אָדָם em עֶצֶם אָדָם
  choice: humano
  alternative: de homem
  rationale: O procedimento diz respeito a restos mortais humanos em geral; o contexto não restringe o referente a indivíduos do sexo masculino.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição inicial do hebraico foi preservada apesar de sua leve solenidade; evitou-se linguagem técnica ou denominacional.
