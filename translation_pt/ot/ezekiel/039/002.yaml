base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/002.yaml
  text: I will turn you around[a], lead you on, bring you up from the far north[b], and bring you against the mountains of Israel.
translation:
  language: pt
  text: Eu te farei voltar, te conduzirei adiante[a], te farei subir das regiões mais distantes do norte[b] e te levarei contra os montes de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo hebraico é difícil. Algumas traduções antigas entendem: “deixarei apenas a sexta parte de você”.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “das extremidades do norte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּיךָ
  choice: Eu o farei voltar
  rationale: O verbo expressa a ação causativa de fazer Gog mudar ou reverter seu curso. A formulação preserva o controle divino do movimento sem especificar um destino anterior.
- source_word: וְשִׁשֵּׁאתִיךָ
  choice: conduzirei você adiante
  rationale: O verbo é difícil, mas, no encadeamento de verbos de movimento, é plausível entendê-lo como conduzir ou impelir adiante. A redação mantém essa incerteza em nota.
- source_word: וְהַעֲלִיתִיךָ
  choice: farei você subir
  rationale: O hifil de עלה indica fazer subir. A tradução conserva tanto a causatividade quanto a direção do movimento.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: das regiões mais distantes do norte
  rationale: A expressão designa as extremidades ou partes remotas do norte; esta forma é clara e próxima da imagem hebraica.
- source_word: וַהֲבִאוֹתִיךָ עַל
  choice: e o levarei contra
  rationale: No contexto militar, עַל indica movimento hostil contra os montes de Israel, não apenas chegada neutra a eles.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: os montes de Israel
  rationale: Expressão geográfica profética preservada em formulação portuguesa corrente.
theological_decisions:
- issue: Sentido do verbo difícil וְשִׁשֵּׁאתִיךָ
  choice: 'verbo de movimento: “conduzirei você adiante”'
  alternative: “deixarei apenas a sexta parte de você”
  rationale: A sequência imediata reúne ações pelas quais Deus dirige o movimento de Gog. A leitura como verbo de movimento se ajusta melhor a esse fluxo, enquanto a leitura numérica, embora tradicional, é lexicalmente incerta; por isso é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Alterna pronomes átonos e “você” para evitar formas verbais ambíguas e manter a referência singular a Gog. A construção conserva a série enfática de ações divinas e explicita em notas as duas dificuldades lexicais.
