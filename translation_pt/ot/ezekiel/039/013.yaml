  text: וְ/קָֽבְרוּ֙ כָּל עַ֣ם הָ/אָ֔רֶץ וְ/הָיָ֥ה לָ/הֶ֖ם לְ/שֵׁ֑ם י֚וֹם הִכָּ֣בְדִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/013.yaml
  text: All the people of the land will bury them[a], and it will be to their renown on the day I glorify myself[b], declares the Lord GOD.
translation:
  language: pt
  text: Todo o povo da terra os sepultará, e isso lhes trará honra[a] no dia em que eu for glorificado[b], declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “isso será para eles para nome”; o idioma hebraico indica que o sepultamento lhes dará honra ou renome.
    reason: lexical_alternative
  - marker: b
    text: Ou “no dia em que eu me glorificar” ou “no dia em que eu manifestar a minha glória”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָבְרוּ
  choice: sepultará
  rationale: O perfeito com וְ em discurso profético tem sentido futuro neste contexto; o singular concorda naturalmente com o coletivo «todo o povo».
- source_word: כָּל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Refere-se mais naturalmente aos habitantes da terra em questão, no contexto local do sepultamento, e não a toda a humanidade.
- source_word: וְהָיָה לָהֶם לְשֵׁם
  choice: isso lhes trará honra
  rationale: A expressão literal «será para eles por nome» é um idioma ligado a nome, reputação ou renome; «trará honra» comunica seu sentido em português natural, mantendo em nota a forma mais literal.
- source_word: יוֹם הִכָּבְדִי
  choice: no dia em que eu manifestar a minha glória
  rationale: A forma hebraica permite a ideia de Deus mostrar sua glória, glorificar-se ou ser glorificado. A tradução principal é natural e preserva a manifestação pública da glória divina.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética «declara». אֲדֹנָי é vertido por «Senhor», enquanto o nome divino יהוה é preservado como «Yahweh», evitando confundir os dois termos.
theological_decisions:
- issue: Sentido de הִכָּבְדִי na manifestação da glória divina
  choice: eu manifestar a minha glória
  alternative: eu me glorificar; eu for glorificado
  rationale: O hebraico admite nuance reflexiva ou passiva. O texto principal expressa a autoapresentação da glória de Deus sem excluir as demais nuances, registradas em nota.
- issue: Representação do nome divino יהוה após אֲדֹנָי
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e preserva explicitamente o nome divino, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Sepultar» mantém o tom solene do contexto; «isso» retoma o ato coletivo do sepultamento. Os marcadores [a] e [b] aparecem no texto principal.
