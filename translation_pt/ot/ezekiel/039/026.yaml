source:
  edition: WLC
  text: וְ/נָשׂוּ֙ אֶת כְּלִמָּתָ֔/ם וְ/אֶת כָּל מַעֲלָ֖/ם אֲשֶׁ֣ר מָעֲלוּ בִ֑/י בְּ/שִׁבְתָּ֧/ם עַל אַדְמָתָ֛/ם לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/026.yaml
  text: They will bear their shame and all their unfaithfulness by which they were unfaithful to me[a], when they dwell securely on their land with no one to make them afraid.
translation:
  language: pt
  text: Eles carregarão[a] a sua vergonha e toda a infidelidade que cometeram contra mim, quando habitarem em segurança na sua terra, sem ninguém que os amedronte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles esquecerão a sua vergonha e toda a sua infidelidade.” Algumas traduções, influenciadas pelo contexto e por versões antigas, entendem o verbo nesse sentido; o hebraico, porém, diz mais diretamente “carregarão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָשׂוּ
  choice: carregarão
  rationale: O verbo נשׂא significa normalmente levantar, levar ou carregar. Com “vergonha” como objeto, “carregarão” preserva de modo transparente o sentido mais direto do hebraico, sem eliminar a tensão entre restauração e vergonha passada.
- source_word: כְּלִמָּתָם
  choice: a sua vergonha
  rationale: כְּלִמָּה denota vergonha, desonra ou humilhação. “Vergonha” é direto, corrente e adequado ao contexto.
- source_word: מַעֲלָם / מָעֲלוּ
  choice: toda a infidelidade que cometeram
  rationale: O substantivo e o verbo cognato da raiz מעל indicam quebra de lealdade ou de confiança, frequentemente no âmbito da aliança. “Infidelidade” preserva essa dimensão relacional; “que cometeram” evita em português a repetição pouco natural “com que foram infiéis”.
- source_word: בִי
  choice: contra mim
  rationale: Com מעל, a preposição ב identifica aquele contra quem se pratica a infidelidade. “Contra mim” expressa isso de modo claro e idiomático em português.
- source_word: בְּשִׁבְתָּם
  choice: quando habitarem
  rationale: 'O infinitivo construto com ב tem valor temporal ou circunstancial: “quando” ou “enquanto habitarem”.'
- source_word: עַל אַדְמָתָם
  choice: na sua terra
  rationale: אֲדָמָה pode significar solo, chão ou terra. “Na sua terra” é natural em português e conserva o tema da restauração à terra.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: A expressão adverbial indica uma condição de segurança e ausência de ameaça. “Em segurança” é clara e natural.
- source_word: וְאֵין מַחֲרִיד
  choice: sem ninguém que os amedronte
  rationale: A expressão indica que não haverá pessoa ou ameaça que lhes cause medo. A formulação preserva a possível referência a um agente e soa natural em português.
theological_decisions:
- issue: Sentido de וְנָשׂוּ no contexto de restauração e culpa anterior
  choice: Manter o sentido hebraico mais direto, “carregarão”, em vez de traduzir interpretativamente por “esquecerão”.
  alternative: “Eles esquecerão a sua vergonha e toda a sua infidelidade.”
  rationale: 'A forma hebraica aponta mais naturalmente para levar ou carregar. Embora o contexto de restauração e o testemunho de versões antigas tenham levado alguns a entender “esquecer”, manter “carregarão” deixa intacta a tensão teológica do texto: o povo restaurado ainda carrega a vergonha ligada à sua infidelidade passada.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita literalismo pouco natural na repetição da raiz מעל, mas preserva seu sentido relacional por meio de “infidelidade”. O marcador foi colocado imediatamente após o verbo ao qual a nota se refere.
