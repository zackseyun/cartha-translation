  text: וְ/לֹֽא אַסְתִּ֥יר ע֛וֹד פָּנַ֖/י מֵ/הֶ֑ם אֲשֶׁ֨ר שָׁפַ֤כְתִּי אֶת רוּחִ/י֙ עַל בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/029.yaml
  text: And I will no longer hide my face from them, when I have poured out my Spirit on the house of Israel, declares the Lord GOD.
translation:
  language: pt
  text: E não esconderei mais deles o meu rosto, quando eu derramar o meu Espírito sobre a casa de Israel, declara o Senhor DEUS.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אַסְתִּיר עוֹד פָּנַי מֵהֶם
  choice: E não esconderei mais deles o meu rosto
  rationale: Preserva a metáfora hebraica de esconder o rosto e a força futura de אַסְתִּיר, em português natural e digno.
- source_word: אֲשֶׁר שָׁפַכְתִּי
  choice: quando eu derramar
  rationale: אֲשֶׁר admite valor circunstancial no contexto; o perfeito profético שָׁפַכְתִּי apresenta a ação futura como certa. A tradução mantém a relação temporal adotada pelo texto de consulta sem converter a oração em causa.
- source_word: רוּחִי
  choice: o meu Espírito
  rationale: Mantém a referência possessiva e, pelo contexto da ação divina, usa a capitalização tradicional para o Espírito de Deus sem ampliar o conteúdo do hebraico.
- source_word: עַל בֵּית יִשְׂרָאֵל
  choice: sobre a casa de Israel
  rationale: Reproduz diretamente a preposição עַל e a expressão coletiva בית ישראל.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor DEUS
  rationale: נְאֻם é vertido pela fórmula profética natural «declara»; «Senhor DEUS» distingue אֲדֹנָי de יהוה e segue uma convenção portuguesa reconhecível para o nome divino.
theological_decisions:
- issue: Relação entre o não ocultar do rosto e o derramamento do Espírito
  choice: quando eu derramar
  alternative: porque derramei
  rationale: A construção com אֲשֶׁר pode ser entendida de mais de uma maneira. Aqui se preserva a leitura temporal e escatológica do contexto, sem afirmar explicitamente uma causalidade que o conector hebraico não exige.
- issue: Aspecto temporal de שָׁפַכְתִּי
  choice: 'futuro em português: «derramar»'
  alternative: 'pretérito perfeito: «derramei»'
  rationale: Embora a forma hebraica seja perfeita, no contexto de promessa pode apresentar um acontecimento futuro como realizado ou certo; o futuro português comunica essa orientação contextual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Conserva a metáfora bíblica «esconder o rosto», a expressão «casa de Israel» e a solenidade da fórmula profética, evitando arcaísmos desnecessários.
