  text: You will eat fat until you are full[a], and you will drink blood to drunkenness, from my sacrifice that I have sacrificed for you.
translation:
  language: pt
  text: Vocês comerão gordura até ficarem saciados e beberão sangue até se embriagarem, do meu sacrifício que sacrifiquei para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do meu banquete sacrificial que preparei para vocês”. O hebraico emprega literalmente linguagem de sacrifício (“meu sacrifício... sacrifiquei”), enquanto o contexto mais amplo deixa claro que se trata de um banquete sobre os mortos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: vocês comerão
  rationale: O wayyiqtol na segunda pessoa do plural integra o anúncio profético e aponta naturalmente para uma ação futura.
- source_word: חֵלֶב
  choice: gordura
  rationale: Equivalente direto que conserva a linguagem concreta e sacrificial.
- source_word: לְשָׂבְעָה
  choice: até ficarem saciados
  rationale: Expressa o resultado ou grau de satisfação plena em português natural e digno.
- source_word: וּשְׁתִיתֶם דָּם לְשִׁכָּרוֹן
  choice: e beberão sangue até se embriagarem
  rationale: Mantém explícita a imagem chocante do sangue e comunica de modo natural o resultado de intoxicação indicado pela expressão hebraica.
- source_word: מִזִּבְחִי
  choice: do meu sacrifício
  rationale: Preserva o substantivo sacrificial e sua relação com a primeira pessoa, sem reduzi-lo no texto principal a uma simples festa.
- source_word: אֲשֶׁר זָבַחְתִּי לָכֶם
  choice: que ofereci por vocês
  rationale: Em contexto sacrificial, 'ofereci' é uma forma portuguesa natural de verter o verbo זבח; 'por vocês' representa diretamente לָכֶם e conserva a finalidade em benefício dos animais convocados.
theological_decisions:
- issue: Linguagem sacrificial aplicada ao juízo divino
  choice: Manter no texto principal 'meu sacrifício' e a ideia de que Deus o ofereceu aos animais convocados.
  alternative: Traduzir como 'banquete sacrificial que preparei para vocês'.
  rationale: O contexto retrata o juízo sobre as forças de Gogue como um sacrifício consumido por aves e animais. A formulação principal conserva essa força teológica sem impor categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O pronome 'vocês' explicita o plural da convocação; 'saciados' preserva um registro digno, e 'até se embriagarem' apresenta com clareza o paralelismo de excesso.
