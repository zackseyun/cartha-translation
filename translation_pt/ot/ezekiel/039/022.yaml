  text: וְ/יָֽדְעוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם מִן הַ/יּ֥וֹם הַ/ה֖וּא וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/022.yaml
  text: And the house of Israel will know that I am Yahweh their God from that day onward[a].
translation:
  language: pt
  text: E a casa de Israel saberá que eu sou Yahweh, o seu Deus, daquele dia em diante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a partir daquele dia”.'
    reason: Alternativa lexical para a expressão temporal מִן הַיּוֹם הַהוּא וָהָלְאָה.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E ... saberá
  rationale: O perfeito qal com conjunção, neste discurso profético, tem força futura ou resultativa. “Saberá” é natural em português e preserva o sentido de reconhecimento da relação de aliança.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a designação coletiva e a ênfase corporativa da expressão hebraica, sem reduzi-la simplesmente a “Israel”.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que a casa de Israel saberá.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: o seu Deus
  rationale: A forma com sufixo plural refere-se coletivamente à casa de Israel; em português, o possessivo singular concorda naturalmente com esse sujeito coletivo.
- source_word: מִן הַיּוֹם הַהוּא
  choice: daquele dia
  rationale: Marca o ponto inicial de um estado contínuo, cujo prolongamento é expresso pelo advérbio seguinte.
- source_word: וָהָלְאָה
  choice: em diante
  rationale: Expressa de modo idiomático a continuidade temporal para além daquele dia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e pactual sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a expressão coletiva “casa de Israel” e a estrutura temporal do hebraico.
