    issue: “argamassa sem consistência” para טָחֵי תָפֵל
    rationale: A expressão sugere uma argamassa estrutural defeituosa, enquanto o contexto e o uso tradicional do termo apontam para um revestimento superficial de cal/caiação que encobre uma parede frágil. “Rebocam com cal” preserva o ato de rebocar e a imagem do revestimento enganoso.
  - severity: low
    issue: Formulação pouco idiomática de “vento de tempestade” e “a fenderá”
    rationale: As escolhas são compreensíveis, mas “vento tempestuoso” e “a partirá” oferecem português moderno mais fluente e mantêm respectivamente o vento violento e a ruptura estrutural expressos no hebraico.
