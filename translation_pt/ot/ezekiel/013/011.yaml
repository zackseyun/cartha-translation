  text: אֱמֹ֛ר אֶל טָחֵ֥י תָפֵ֖ל וְ/יִפֹּ֑ל הָיָ֣ה גֶּ֣שֶׁם שׁוֹטֵ֗ף וְ/אַתֵּ֜נָה אַבְנֵ֤י אֶלְגָּבִישׁ֙ תִּפֹּ֔לְנָה וְ/ר֥וּחַ סְעָר֖וֹת תְּבַקֵּֽעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/011.yaml
  text: Tell those who plaster it with whitewash that it will fall[a]. There will be a flooding rain, and you, O hailstones, will fall[b], and a windstorm will break it open.
translation:
  language: pt
  text: 'Diga aos que a rebocam com cal: “Ela cairá”. Virá uma chuva torrencial; e vocês, pedras de granizo, cairão; e um vento tempestuoso a partirá.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָחֵי תָפֵל
  choice: os que a rebocam com argamassa sem consistência
  rationale: טוח indica aplicar reboco ou argamassa. תָפֵל descreve aqui um revestimento inadequado, sem solidez; “argamassa sem consistência” comunica a fragilidade e a aparência enganosa sem reduzir necessariamente o termo a uma pintura de cal.
- source_word: וְיִפֹּל
  choice: Ela cairá
  rationale: O sujeito implícito é a parede mencionada no contexto anterior. O pronome feminino retoma naturalmente “parede” em português.
- source_word: גֶּשֶׁם שׁוֹטֵף
  choice: uma chuva torrencial
  rationale: שׁוֹטֵף sugere uma chuva impetuosa, transbordante e destrutiva; “torrencial” é claro e natural em português.
- source_word: וְאַתֵּנָה אַבְנֵי אֶלְגָּבִישׁ תִּפֹּלְנָה
  choice: e vocês, pedras de granizo, cairão
  rationale: Mantém o pronome feminino plural enfático e a apóstrofe vívida em que o discurso se dirige diretamente às pedras de granizo.
- source_word: וְרוּחַ סְעָרוֹת
  choice: e um vento de tempestade
  rationale: A expressão designa um vento violento de tormenta. “Vento de tempestade” conserva a composição da imagem e soa natural.
- source_word: תְּבַקֵּעַ
  choice: a fenderá
  rationale: O piel de בקע expressa partir ou fender. O objeto pronominal explicita a parede, claramente subentendida pelo contexto, e preserva a imagem de ruptura estrutural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a personificação das pedras de granizo e a força concreta da parede sendo fendida.
