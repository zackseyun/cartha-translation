review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a parede subentendida, a chuva destrutiva, a apóstrofe enfática às pedras de granizo e a ação final do vento. Contudo, “argamassa sem consistência” interpreta תָפֵל de modo excessivamente material e pouco idiomático; no contexto, o termo designa sobretudo a camada superficial enganosa, tradicionalmente “cal” ou “caiação”.
  naturalness: O texto é claro, mas “argamassa sem consistência” e, em menor medida, “vento de tempestade” soam pesados. “Rebocam com cal” e “vento tempestuoso” são mais naturais sem reduzir a força da imagem.
  terminology: “Pedras de granizo” mantém bem o hebraico literal e a personificação. “Fenderá” é semanticamente possível para תְּבַקֵּעַ, mas “a partirá” é mais corrente e comunica claramente a ruptura da parede.
  issues:
