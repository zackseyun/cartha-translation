base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
translation:
  language: pt
  text: 'Porque, sim, porque eles levaram o meu povo ao erro, dizendo: “Paz”, quando não há paz; e, quando alguém constrói um muro, eis que eles o rebocam com cal.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o revestem com cal”. Tradicionalmente: “o rebocam com argamassa não preparada”. O termo hebraico pode referir-se a uma camada superficial de cal ou reboco; seu sentido preciso é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן / וּבְיַעַן
  choice: Porque, sim, porque
  rationale: Preserva a expressão causal duplicada e sua ênfase, usando uma formulação natural em português.
- source_word: הִטְעוּ
  choice: desviaram
  rationale: Expressa a ideia causativa de fazer o povo sair do caminho, mantendo a força moral e religiosa do verbo.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Reproduz diretamente a expressão de pertencimento pactual.
- source_word: לֵאמֹר שָׁלוֹם וְאֵין שָׁלוֹם
  choice: 'dizendo: “Paz!”, quando não há paz'
  rationale: Mantém שָׁלוֹם como 'paz' e apresenta com clareza o contraste entre a proclamação e a realidade.
- source_word: וְהוּא בֹּנֶה
  choice: quando alguém constrói
  rationale: Comunica naturalmente em português o valor genérico ou indefinido da construção singular.
- source_word: חַיִץ
  choice: um muro
  rationale: Traduz o sentido concreto básico sem acrescentar ao substantivo a ideia interpretativa de fragilidade.
- source_word: וְהִנָּם
  choice: eis que eles
  rationale: Conserva a chamada enfática de atenção própria da retórica profética.
- source_word: טָחִים אֹתוֹ
  choice: o revestem
  rationale: Descreve de modo natural a aplicação de uma camada sobre o muro, sem perder a imagem de construção.
- source_word: תָּפֵל
  choice: de reboco inconsistente
  rationale: O termo é de sentido difícil neste contexto e pode indicar um revestimento sem consistência ou inadequadamente preparado. A escolha preserva a deficiência do material sem especificar indevidamente que seja cal branca.
theological_decisions:
- issue: Força metafórica da imagem do muro e do revestimento na denúncia profética
  choice: Manter a imagem concreta de construir um muro e revesti-lo de reboco inconsistente, sem explicar a metáfora no texto principal.
  alternative: Expandir interpretativamente para 'muro frágil', 'cobrem com mentiras' ou outra explicação explícita.
  rationale: O hebraico apresenta primeiro a imagem; explicitá-la na tradução eliminaria parte de sua força retórica e anteciparia sua interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição causal e o 'eis que' preservam a ênfase profética; a nota registra a incerteza lexical real de תָּפֵל.
