  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל בְּנ֣וֹת עַמְּ/ךָ֔ הַ/מִּֽתְנַבְּא֖וֹת מִֽ/לִּבְּ/הֶ֑ן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/017.yaml
  text: And you[a], son of man, set your face against the daughters of your people who prophesy out of their own hearts[b], and prophesy against them.
translation:
  language: pt
  text: E você, filho do homem, dirija o rosto contra as filhas do seu povo que profetizam do próprio coração delas[a] e profetize contra elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Do próprio coração delas” indica que a mensagem profética procede delas mesmas, e não do SENHOR.
    reason: cultural_note
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma consagrada e a força recorrente da maneira como Deus se dirige a Ezequiel.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: volte o rosto contra
  rationale: Mantém a imagem hebraica de orientar o rosto e explicita a oposição exigida pelo contexto de juízo.
- source_word: בְּנוֹת עַמְּךָ
  choice: as filhas do seu povo
  rationale: Reproduz o termo hebraico específico 'filhas', sem generalizá-lo para 'mulheres'.
- source_word: הַמִּתְנַבְּאוֹת
  choice: que profetizam
  rationale: Expressa naturalmente a atividade contínua ou característica indicada pelo particípio, sem acrescentar 'falsamente'.
- source_word: מִלִּבְּהֶן
  choice: segundo o próprio coração
  rationale: Conserva 'coração' como sede interior do pensamento e da intenção; a expressão indica que a mensagem procede delas mesmas.
- source_word: וְהִנָּבֵא עֲלֵיהֶן
  choice: e profetize contra elas
  rationale: Traduz diretamente a ordem e o sentido hostil de עַל neste contexto profético.
theological_decisions:
- issue: Natureza da atividade profética das mulheres
  choice: que profetizam
  alternative: que profetizam falsamente; que fingem profetizar
  rationale: Embora o contexto condene essas mulheres, o versículo não acrescenta um advérbio equivalente a 'falsamente'. A origem autônoma da mensagem e a ordem de profetizar contra elas comunicam a condenação sem ampliar o hebraico.
- issue: Origem das mensagens
  choice: segundo o próprio coração
  alternative: da própria mente; por inspiração própria
  rationale: A formulação preserva a imagem antropológica do hebraico e deixa clara, com apoio da nota, a oposição implícita entre uma mensagem surgida delas mesmas e uma palavra recebida do SENHOR.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção 'filhas do seu povo' foi mantida por fidelidade lexical; 'volte o rosto contra' conserva a imagem hebraica sem soar excessivamente rígida.
