  terminology: “Justo”, “falsidade”, “perverso”, “mau caminho” e “vida” são escolhas consistentes com o vocabulário profético e não introduzem interpretação confessional. O plural “vocês” comunica naturalmente o destinatário plural contextual. As notas refletem alternativas lexicais e sintáticas reais e seus marcadores estão corretamente ancorados.
