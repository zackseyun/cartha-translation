  source_fidelity: O texto traduz com precisão a relação causal de יַעַן, o valor causativo de הִכְאוֹת e הִכְאַבְתִּיו, a imagem de “fortalecer as mãos”, a não conversão do mau caminho e a finalidade ligada à vida. “Para preservar a própria vida” é uma solução idiomática adequada para לְהַחֲיֹתוֹ e mantém o alcance da expressão sem especificar um sentido doutrinário de “vida”.
