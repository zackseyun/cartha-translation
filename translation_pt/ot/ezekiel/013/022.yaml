id: EZK.13.22
reference: Ezekiel 13:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יַ֣עַן הַכְא֤וֹת לֵב צַדִּיק֙ שֶׁ֔קֶר וַ/אֲנִ֖י לֹ֣א הִכְאַבְתִּ֑י/ו וּ/לְ/חַזֵּק֙ יְדֵ֣י רָשָׁ֔ע לְ/בִלְתִּי שׁ֛וּב מִ/דַּרְכּ֥/וֹ הָ/רָ֖ע לְ/הַחֲיֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/022.yaml
  text: Because you have disheartened the heart of the righteous with falsehood[a], though I had not caused him grief, and because you have strengthened the hands of the wicked so that he does not turn from his evil way to preserve his life[b],
translation:
  language: pt
  text: Porque vocês causaram dor ao coração do justo com falsidade[a], embora eu não lhe tivesse causado dor, e fortaleceram as mãos do perverso, de modo que ele não se afaste do seu mau caminho para preservar a própria vida[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com mentiras”. O substantivo hebraico pode indicar tanto a falsidade em sentido abstrato quanto mentiras concretas.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que viva” ou “e viva”. O hebraico admite essas traduções mais literais.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: Porque
  rationale: Introduz a razão do juízo anunciado no contexto e conserva de modo natural a força causal.
- source_word: הַכְאוֹת לֵב צַדִּיק
  choice: vocês causaram dor ao coração do justo
  rationale: Expressa a forma causativa de כאב e mantém explicitamente לֵב como objeto, além de permitir a correspondência com a oração seguinte.
- source_word: שֶׁקֶר
  choice: com falsidade
  rationale: Traduz o substantivo abstrato e conserva seu valor instrumental; “com mentiras” também é possível.
- source_word: וַאֲנִי לֹא הִכְאַבְתִּיו
  choice: embora eu não lhe tivesse causado dor
  rationale: Preserva o contraste com a ação das falsas profetisas e a nuance causativa do verbo com o sufixo masculino singular.
- source_word: וּלְחַזֵּק יְדֵי רָשָׁע
  choice: e fortaleceram as mãos do perverso
  rationale: Mantém a imagem hebraica tradicional de dar força, apoio ou coragem a quem pratica o mal, sem reduzi-la a uma única paráfrase.
- source_word: לְבִלְתִּי שׁוּב
  choice: de modo que ele não se afaste
  rationale: Comunica a consequência ou finalidade negativa e preserva o sentido ético de abandonar um modo de vida.
- source_word: מִדַּרְכּוֹ הָרָע
  choice: do seu mau caminho
  rationale: Conserva a metáfora profética estabelecida de דרך para a conduta moral.
- source_word: לְהַחֲיֹתוֹ
  choice: para preservar a própria vida
  rationale: Expressa a orientação para a vida contida no infinitivo causativo, sem definir se a vida em vista é temporal, pactual ou escatológica.
theological_decisions:
- issue: Sentido e ligação sintática de לְהַחֲיֹתוֹ
  choice: para preservar a própria vida
  alternative: para que viva / e viva
  rationale: A formulação mantém amplo o sentido de vida e o vincula à conversão do mau caminho, sem impor uma leitura exclusivamente temporal ou de salvação eterna. A nota registra a tradução mais literal e a possível diferença de ligação sintática.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário feminino plural indicado pelas formas verbais no contexto, sem recorrer a uma marca de gênero pouco natural em português. A vírgula final conserva a continuidade sintática com o versículo seguinte.
