source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/בִקַּעְתִּ֥י רֽוּחַ סְעָר֖וֹת בַּֽ/חֲמָתִ֑/י וְ/גֶ֤שֶׁם שֹׁטֵף֙ בְּ/אַפִּ֣/י יִֽהְיֶ֔ה וְ/אַבְנֵ֥י אֶלְגָּבִ֖ישׁ בְּ/חֵמָ֥ה לְ/כָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/013.yaml
  text: 'Therefore thus says the Lord GOD: I will unleash a storm wind in my wrath[a], and there will be a flooding rain in my anger, and hailstones in fury to bring complete destruction.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: Farei irromper um vendaval na minha indignação[a]; haverá chuva torrencial na minha ira e pedras de granizo no meu furor, para causar destruição completa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «abrirei/romperei um vento de tempestades»; o sentido parece ser que Deus fará um vendaval irromper.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva o título אֲדֹנָי e representa diretamente o nome divino יְהוִה, evitando a repetição pouco natural «Senhor SENHOR».
- source_word: וּבִקַּעְתִּי
  choice: Farei irromper
  rationale: בקע significa literalmente abrir ou romper; nesta construção, Deus faz um vento violento romper e avançar. A formulação mantém a agência divina e parte da imagem original.
- source_word: רוּחַ סְעָרוֹת
  choice: um vendaval
  rationale: A construção designa um vento tempestuoso e violento. «Vendaval» é natural e vigoroso em português.
- source_word: בַּחֲמָתִי
  choice: na minha indignação
  rationale: חֵמָה expressa ira intensa ou furor. «Indignação» conserva o registro profético e permite representar a acumulação de termos de ira no verso sem uma repetição artificial.
- source_word: גֶּשֶׁם שֹׁטֵף
  choice: chuva torrencial
  rationale: שֹׁטֵף descreve algo transbordante ou impetuoso. «Chuva torrencial» comunica com naturalidade sua força destrutiva.
- source_word: בְּאַפִּי
  choice: na minha ira
  rationale: אַף significa literalmente nariz e, por extensão idiomática, ira. Aqui o sentido emocional é inequívoco.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: e pedras de granizo
  rationale: A expressão hebraica refere-se a granizo; «pedras de granizo» preserva a imagem concreta e solene do texto.
- source_word: בְּחֵמָה
  choice: no meu furor
  rationale: A segunda ocorrência do campo semântico de חֵמָה intensifica o juízo divino. «Furor» expressa essa força sem apagar a variação retórica do verso.
- source_word: לְכָלָה
  choice: para causar destruição completa
  rationale: כָּלָה pode indicar fim, consumação ou destruição total; a preposição לְ dá à expressão valor de propósito ou resultado.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução direta de יְהוִה como «Yahweh» conserva o nome próprio no composto, enquanto «Senhor» representa אֲדֹנָי. A alternativa tradicional «Senhor DEUS» evita repetição, mas substitui o nome por um título.
- issue: Relação entre a ira divina e os fenômenos destrutivos
  choice: manter as três expressões paralelas que vinculam vendaval, chuva e granizo à indignação, ira e furor de Deus
  alternative: condensar todas as expressões em uma única referência à ira divina
  rationale: O paralelismo repetido faz parte da intensidade teológica e poética do anúncio de juízo e não deve ser suavizado.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Registro profético digno e vigoroso; mantém o paralelismo e a intensificação do hebraico sem reproduzir mecanicamente construções pouco naturais.
