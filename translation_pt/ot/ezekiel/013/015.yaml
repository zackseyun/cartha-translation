base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/015.yaml
  text: So I will spend my wrath against the wall and against those who plastered it with whitewash[a], and I will say to you, ‘The wall is no more, and those who plastered it are no more,’
translation:
  language: pt
  text: 'Assim, esgotarei a minha ira contra o muro e contra os que o rebocaram com reboco sem liga[a]. Então direi a vocês: ‘O muro não existe mais, e não existem os que o rebocaram.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com caiação”. Tradicionalmente, “com argamassa não temperada”. O termo hebraico pode indicar um revestimento superficial ou defeituoso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלֵּיתִי
  choice: Assim, esgotarei
  rationale: O piel de כלה, tendo ‘minha ira’ como objeto, indica levar a ira até o fim ou despendê-la por completo. ‘Esgotarei’ expressa isso de modo natural e solene, sem sugerir que Deus seja consumido.
- source_word: חֲמָתִי
  choice: a minha ira
  rationale: חֵמָה denota ira ou furor intenso; ‘ira’ preserva a força judicial e profética do contexto.
- source_word: בַּקִּיר וּבַטָּחִים
  choice: contra o muro e contra os que
  rationale: Embora ב seja formalmente ampla, aqui introduz os alvos sobre os quais recai a ira divina; ‘contra’ torna essa relação clara em português.
- source_word: הַטָּחִים אֹתוֹ
  choice: os que o rebocaram
  rationale: טוח significa aplicar uma camada, rebocar ou revestir. ‘Rebocaram’ mantém concreta a imagem de construção e permite repetir o verbo na declaração final.
- source_word: תָּפֵל
  choice: argamassa sem consistência
  rationale: No contexto, תפל caracteriza um revestimento inadequado, sem a solidez necessária. A expressão preserva a imagem material e a ambiguidade entre reboco superficial e argamassa defeituosa; a alternativa tradicional é indicada em nota.
- source_word: וְאֹמַר לָכֶם
  choice: Então direi a vocês
  rationale: A conjunção conduz ao pronunciamento resultante. ‘Direi a vocês’ reproduz diretamente a primeira pessoa e usa forma corrente no português brasileiro, ainda amplamente compreensível.
- source_word: אֵין הַקִּיר וְאֵין הַטָּחִים אֹתוֹ
  choice: O muro já não existe, nem aqueles que o rebocaram
  rationale: אֵין afirma inexistência. ‘Já não existe’ comunica o resultado do juízo, e ‘nem’ preserva o paralelismo entre o desaparecimento do muro e o de seus rebocadores.
theological_decisions:
- issue: Força metafórica do muro e de seu revestimento
  choice: Manter no texto principal a imagem concreta do muro e da argamassa sem explicar diretamente sua referência aos falsos profetas.
  alternative: Substituir ou ampliar a imagem com uma referência explícita aos falsos profetas e às suas garantias enganosas.
  rationale: O contexto circundante interpreta a imagem, mas este versículo formula o juízo por meio dela. Conservá-la evita inserir no enunciado uma explicação teológica que não está lexicalmente presente aqui.
- issue: Objeto e consumação da ira divina
  choice: Traduzir a ira como plenamente esgotada contra os alvos do juízo.
  alternative: Traduzir כלה como ‘destruir’, fazendo do verbo uma afirmação direta da aniquilação dos alvos.
  rationale: Gramaticalmente, o objeto direto de וְכִלֵּיתִי é ‘a minha ira’; portanto, o texto enfatiza que ela chega ao seu pleno cumprimento, embora o resultado para o muro e seus rebocadores seja sua inexistência.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A redação mantém a metáfora concreta e o paralelismo hebraico. ‘Argamassa sem consistência’ foi preferido a ‘cal’ ou ‘caiação’ para não eliminar a ambiguidade lexical de תָּפֵל nem transformar o ato de rebocar em simples pintura.
