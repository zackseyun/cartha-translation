  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א עֲלִיתֶם֙ בַּ/פְּרָצ֔וֹת וַ/תִּגְדְּר֥וּ גָדֵ֖ר עַל בֵּ֣ית יִשְׂרָאֵ֑ל לַ/עֲמֹ֥ד בַּ/מִּלְחָמָ֖ה בְּ/י֥וֹם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/005.yaml
  text: You have not gone up into the breaches or built up a wall for the house of Israel[a], so that it might stand in the battle on the day of Yahweh.
translation:
  language: pt
  text: Vocês não subiram às brechas[a] nem ergueram um muro para a casa de Israel, para que ela pudesse resistir na batalha no dia de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às aberturas”. O hebraico se refere a rupturas numa muralha, dando continuidade à imagem defensiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלִיתֶם
  choice: subiram
  rationale: Preserva o sentido concreto de עלה, “subir”, e a imagem de ocupar os pontos rompidos da defesa.
- source_word: בַּפְּרָצוֹת
  choice: às brechas
  rationale: פרצות designa aberturas ou rupturas numa muralha; “brechas” mantém com clareza a imagem militar e defensiva.
- source_word: וַתִּגְדְּרוּ גָדֵר
  choice: ergueram um muro
  rationale: A construção com verbo e substantivo cognatos enfatiza a ação de fortificar; “ergueram um muro” soa natural e conserva a força da imagem.
- source_word: עַל בֵּית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: Neste contexto, עַל indica que o muro seria construído em favor ou para a proteção da casa de Israel, sem exigir que a tradução acrescente a ideia espacial de “ao redor”.
- source_word: לַעֲמֹד
  choice: para que ela pudesse resistir
  rationale: O infinitivo expressa finalidade. “Resistir” comunica naturalmente o sentido de permanecer firme diante do combate, e “ela” retoma a expressão coletiva “casa de Israel”.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: Mantém a imagem de uma confrontação concreta e corresponde ao substantivo definido no hebraico.
- source_word: בְּיוֹם יְהוָה
  choice: no dia de Yahweh
  rationale: Preserva a expressão profética referente ao momento da intervenção e do juízo divinos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Imagem militar aplicada à responsabilidade profética
  choice: Manter as imagens concretas de brechas, muro, batalha e dia de Yahweh.
  alternative: 'Parafrasear: “Vocês não protegeram Israel para que sobrevivesse ao juízo.”'
  rationale: O texto repreende os falsos profetas por meio de uma metáfora de fortificação. Preservá-la evita inserir no texto principal uma explicação interpretativa.
- issue: Referente implícito de לַעֲמֹד
  choice: “para que ela [a casa de Israel] pudesse resistir”
  alternative: “para que vocês pudessem resistir” ou “para resistir”
  rationale: A casa de Israel é o referente coletivo mais natural no contexto, mas a tradução mantém a formulação de finalidade sem explicar além do necessário.
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento plural explícito em “vocês”. A coordenação negativa foi vertida por “não... nem”, deixando claro que a negação abrange as duas ações. A metáfora militar foi preservada sem paráfrase denominacional.
