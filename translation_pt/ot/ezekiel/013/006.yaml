  text: חָ֤זוּ שָׁוְא֙ וְ/קֶ֣סֶם כָּזָ֔ב הָ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַֽ/יהוָ֖ה לֹ֣א שְׁלָחָ֑/ם וְ/יִֽחֲל֖וּ לְ/קַיֵּ֥ם דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/006.yaml
  text: They have seen falsehood and lying divination[a], those who say, ‘Declaration of Yahweh,’ though Yahweh has not sent them[b]; yet they hope for the fulfillment of the word.
translation:
  language: pt
  text: 'Eles tiveram visões falsas e adivinhações mentirosas, os que dizem: “Declaração de Yahweh”[a], embora Yahweh não os tenha enviado; ainda assim, esperam que a palavra se cumpra[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Oráculo de Yahweh” ou “Pronunciamento de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esperam que a palavra seja confirmada” ou “aguardam que a palavra se realize”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּ שָׁוְא
  choice: tiveram visões falsas
  rationale: O verbo חזה pertence ao campo da visão profética, e שָׁוְא aqui indica falsidade ou vazio. A formulação comunica o sentido profético com naturalidade em português.
- source_word: וְקֶסֶם כָּזָב
  choice: e adivinhações mentirosas
  rationale: קֶסֶם designa adivinhação, enquanto כָּזָב a caracteriza como falsa ou enganosa. O plural em português concorda naturalmente com a construção paralela, sem alterar o sentido coletivo.
- source_word: הָאֹמְרִים
  choice: eles que dizem
  rationale: O particípio substantivado identifica os mesmos falsos profetas por sua prática habitual de reivindicar autoridade divina.
- source_word: נְאֻם יְהוָה
  choice: Declaração de Yahweh
  rationale: Mantém a fórmula profética solene e deixa evidente a ironia de ela ser usada por pessoas que Yahweh não enviou.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא שְׁלָחָם
  choice: não os tenha enviado
  rationale: A forma verbal negada afirma diretamente que eles não receberam comissão divina; o subjuntivo composto é natural depois de 'embora'.
- source_word: וְיִחֲלוּ
  choice: ainda assim, esperam
  rationale: יחל pode expressar esperar ou aguardar com expectativa. 'Ainda assim' explicita o contraste contextual sem mudar a afirmação.
- source_word: לְקַיֵּם דָּבָר
  choice: que a palavra se cumpra
  rationale: A expressão significa fazer a palavra permanecer ou ser confirmada, isto é, vê-la realizar-se. A tradução preserva 'a palavra' sem acrescentar um possessivo ausente do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, e sua transliteração preserva a referência pessoal e pactual sem substituí-la por um título.
- issue: Uso da fórmula נְאֻם יְהוָה por falsos profetas
  choice: Declaração de Yahweh
  alternative: Oráculo de Yahweh; Palavra de Yahweh
  rationale: 'A fórmula é mantida para preservar a tensão do texto: os profetas alegam falar em nome de Yahweh, embora ele não os tenha enviado.'
- issue: Referente de דָּבָר
  choice: a palavra
  alternative: a palavra deles; sua mensagem
  rationale: O hebraico não traz pronome possessivo. Evitar 'deles' preserva a formulação aberta, embora o contexto aponte para a palavra que eles proclamaram.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “eles” preserva a identificação enfática dos falsos profetas. As formas “visões falsas” e “adivinhações mentirosas” mantêm o paralelismo e a acusação moral do hebraico.
