  text: וַ/תְּחַלֶּלְ֨נָה אֹתִ֜/י אֶל עַמִּ֗/י בְּ/שַׁעֲלֵ֣י שְׂעֹרִים֮ וּ/בִ/פְת֣וֹתֵי לֶחֶם֒ לְ/הָמִ֤ית נְפָשׁוֹת֙ אֲשֶׁ֣ר לֹֽא תְמוּתֶ֔נָה וּ/לְ/חַיּ֥וֹת נְפָשׁ֖וֹת אֲשֶׁ֣ר לֹא תִֽחְיֶ֑ינָה בְּ/כַ֨זֶּבְ/כֶ֔ם לְ/עַמִּ֖/י שֹׁמְעֵ֥י כָזָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/019.yaml
  text: And you have profaned me among my people for handfuls of barley and for pieces of bread[a], putting to death persons who should not die and keeping alive persons who should not live, by your lying to my people[b], who listen to lies.
translation:
  language: pt
  text: Vocês me profanam no meio do meu povo por punhados de cevada e por pedaços de pão[a], levando à morte pessoas[b] que não deveriam morrer e mantendo vivas pessoas que não deveriam viver, por mentirem ao meu povo, que dá ouvidos a mentiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por bocados de pão”. O hebraico se refere a pedaços partidos ou pequenas porções, ressaltando o pagamento insignificante pelo qual elas agiam.'
    reason: lexical_alternative
  - marker: b
    text: Em ambas as orações, o hebraico diz literalmente “vidas” ou “almas”; aqui, o termo se refere a pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחַלֶּלְנָה
  choice: Vocês me profanam
  rationale: O piel de חלל expressa profanar ou tratar como comum aquilo que é santo. “Profanam” preserva a força religiosa e pactual do verbo.
- source_word: אֹתִי אֶל־עַמִּי
  choice: me profanam no meio do meu povo
  rationale: Neste contexto, אֶל descreve a esfera relacional e pública em que Deus é profanado. “No meio do meu povo” é natural em português e não exclui a nuance de “diante do meu povo”.
- source_word: בְּשַׁעֲלֵי שְׂעֹרִים
  choice: por punhados de cevada
  rationale: שַׁעֲלֵי indica pequenas quantidades tomadas com a mão; “por” comunica que tais porções funcionam como pagamento trivial.
- source_word: וּבִפְתוֹתֵי לֶחֶם
  choice: e por pedaços de pão
  rationale: פְּתֹתֵי designa pedaços partidos ou pequenas porções. “Pedaços de pão” é claro e corrente; a alternativa “bocados” aparece em nota.
- source_word: לְהָמִית נְפָשׁוֹת
  choice: levando à morte pessoas
  rationale: נְפָשׁוֹת refere-se aqui a seres humanos ou vidas, não necessariamente a almas imateriais. A formulação mantém o sentido causativo sem afirmar obrigatoriamente execução física direta.
- source_word: אֲשֶׁר לֹא תְמוּתֶנָה
  choice: que não deveriam morrer
  rationale: O condicional “deveriam” preserva a dimensão judicial e moral da denúncia, sem transformar a frase em simples previsão nem especificar uma doutrina de predestinação.
- source_word: וּלְחַיּוֹת נְפָשׁוֹת
  choice: e mantendo vivas pessoas
  rationale: A forma causativa de חיה contrasta diretamente com “levar à morte”. “Mantendo vivas” conserva esse paralelismo ativo.
- source_word: אֲשֶׁר לֹא תִחְיֶינָה
  choice: que não deveriam viver
  rationale: A redação mantém o paralelismo judicial com “não deveriam morrer” e evita acrescentar uma explicação não expressa no hebraico.
- source_word: בְּכַזֶּבְכֶם
  choice: ao mentirem
  rationale: A preposição בְּ marca o meio pelo qual elas produzem esses resultados. “Ao mentirem” transmite a ação e concorda com o grupo feminino interpelado no contexto.
- source_word: שֹׁמְעֵי כָזָב
  choice: que dá ouvidos a mentiras
  rationale: O particípio indica receptividade habitual à falsidade, não mera percepção auditiva. “Dar ouvidos” expressa escuta acolhedora em português natural.
theological_decisions:
- issue: Sentido de נְפָשׁוֹת no contexto de julgamento
  choice: pessoas
  alternative: almas; vidas
  rationale: “Almas” poderia sugerir uma distinção antropológica que o hebraico não exige. O termo designa aqui pessoas vivas submetidas a decisões ou pronunciamentos de vida e morte.
- issue: Força das orações sobre morrer e viver
  choice: não deveriam morrer / não deveriam viver
  alternative: não morreriam / não viveriam; não deviam morrer / não deviam viver
  rationale: A construção denuncia a inversão de resultados ou veredictos apropriados. “Deveriam” conserva a tensão moral e judicial sem reduzir a linguagem a uma previsão factual.
- issue: Natureza de “levar à morte” e “manter vivas”
  choice: preservar a linguagem causativa sem definir o mecanismo
  alternative: interpretar como morte física direta; interpretar apenas como oráculos simbólicos
  rationale: O texto atribui às falsas profetisas efeitos de vida e morte, mas o versículo isolado não determina com precisão se isso ocorre por ação direta, condenação social ou pronunciamentos enganosos. A tradução mantém essa abertura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural “vocês” explicita a interpelação feminina plural indicada pelo hebraico e pelo contexto, sem recorrer a formas regionais como “vós”. O singular coletivo “meu povo, que dá” mantém a concordância natural. Foram preservados o paralelismo vida/morte, a força religiosa de “profanar” e a ambiguidade quanto ao modo concreto pelo qual as falsas profetisas produziam tais efeitos.
