  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ה֖וֹי עַל הַ/נְּבִיאִ֣ים הַ/נְּבָלִ֑ים אֲשֶׁ֥ר הֹלְכִ֛ים אַחַ֥ר רוּחָ֖/ם וּ/לְ/בִלְתִּ֥י רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/003.yaml
  text: 'Thus says the Lord GOD: Woe to the foolish prophets[a], who follow their own spirit and have seen nothing.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Ai dos profetas insensatos, que seguem o seu próprio espírito sem terem visto coisa alguma!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em português claro e solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando que os dois sejam fundidos numa única designação.
- source_word: הוֹי
  choice: Ai de
  rationale: Expressa a denúncia e a ameaça de juízo próprias do oráculo profético.
- source_word: הַנְּבִיאִים הַנְּבָלִים
  choice: os profetas insensatos
  rationale: ‘Insensatos’ comunica a falta de discernimento moral e espiritual de נבל, e não apenas pouca inteligência.
- source_word: אֲשֶׁר הֹלְכִים אַחַר רוּחָם
  choice: que seguem o seu próprio espírito
  rationale: Traduz naturalmente o idioma ‘ir atrás de’ e conserva רוּחַ como ‘espírito’, referindo-se ao impulso ou à inspiração que procede deles mesmos.
- source_word: וּלְבִלְתִּי רָאוּ
  choice: sem terem visto coisa alguma
  rationale: Representa a ausência de visão profética autêntica e liga naturalmente a afirmação à conduta descrita antes.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: O hebraico apresenta lado a lado o título Adonai e o nome próprio YHWH. ‘Senhor Yahweh’ preserva essa distinção e torna visível o nome divino.
- issue: Sentido de רוּחָם
  choice: o seu próprio espírito
  alternative: a sua própria inspiração
  rationale: ‘Espírito’ conserva a amplitude lexical e a tensão entre impulso interior e pretensa inspiração profética, sem interpretar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão e a força acusatória do oráculo hebraico.
