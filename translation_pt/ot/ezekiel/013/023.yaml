  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן שָׁ֚וְא לֹ֣א תֶחֱזֶ֔ינָה וְ/קֶ֖סֶם לֹא תִקְסַ֣מְנָה ע֑וֹד וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/023.yaml
  text: Therefore you will no longer see false visions or practice divination anymore, and I will deliver my people from your hand. Then you will know that I am the LORD.
translation:
  language: pt
  text: Portanto, vocês não terão mais visões falsas nem praticarão mais adivinhações. Livrarei o meu povo das mãos de vocês, e vocês saberão que eu sou o SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁוְא
  choice: falsas
  rationale: No contexto de חזה, caracteriza as visões como enganosas, vazias ou sem fundamento; “visões falsas” comunica naturalmente a acusação profética.
- source_word: קֶסֶם / תִקְסַמְנָה
  choice: adivinhações / praticarão
  rationale: O substantivo e o verbo cognato descrevem a prática de adivinhação; a formulação evita a repetição pouco natural “adivinhar adivinhações”.
- source_word: וְהִצַּלְתִּי
  choice: Livrarei
  rationale: Expressa diretamente a ação divina de resgatar o povo do poder dessas mulheres.
- source_word: מִיֶּדְכֶן
  choice: das mãos de vocês
  rationale: Preserva o idioma hebraico de poder ou controle e mantém o plural feminino no contexto, embora o português não marque gênero em “vocês”.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes/maiúsculas.
theological_decisions:
- issue: Reconhecimento de YHWH após o juízo e o livramento
  choice: “vocês saberão que eu sou o SENHOR”
  alternative: “então vocês reconhecerão que eu sou o SENHOR”
  rationale: Mantém a fórmula de reconhecimento característica de Ezequiel sem especificar se o conhecimento implica fé, submissão ou apenas reconhecimento forçado.
- issue: Natureza de שָׁוְא nas visões
  choice: “visões falsas”
  alternative: “visões vãs”
  rationale: “Falsas” se ajusta ao contexto de profecia enganosa, mas não acrescenta uma explicação doutrinária sobre a origem ou o mecanismo dessas visões.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O referente é um grupo feminino, indicado no hebraico pelas formas verbais e pronominais; “vocês” preserva o número, mas não explicita o gênero. A repetição de עוֹד é representada de modo idiomático por “mais” em cada membro coordenado.
