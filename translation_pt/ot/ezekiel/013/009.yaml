source:
  edition: WLC
  text: וְ/הָיְתָ֣ה יָדִ֗/י אֶֽל הַ/נְּבִיאִ֞ים הַ/חֹזִ֣ים שָׁוְא֮ וְ/הַ/קֹּסְמִ֣ים כָּזָב֒ בְּ/ס֧וֹד עַמִּ֣/י לֹֽא יִהְי֗וּ וּ/בִ/כְתָ֤ב בֵּֽית יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/009.yaml
  text: And my hand will be against the prophets who see falsehood and who practice lying divination[a]. They will not be in the council of my people, nor will they be written in the register of the house of Israel, nor will they enter the land of Israel[c][b]. Then you will know that I am the Lord Yahweh.
translation:
  language: pt
  text: Minha mão será contra os profetas que têm visões falsas e fazem adivinhações mentirosas. Eles não estarão no conselho do meu povo[a], não serão inscritos no registro da casa de Israel[b], nem entrarão na terra de Israel. Então vocês saberão que eu sou o Senhor Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na assembleia do meu povo” ou “no círculo íntimo do meu povo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na lista” ou “no registro escrito” da casa de Israel.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, אֲדֹנָי יְהוִה (Adonai YHWH); também pode ser traduzido como “o Senhor DEUS”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה יָדִי אֶל
  choice: Minha mão será contra
  rationale: A expressão idiomática comunica oposição ativa e juízo, não mera direção ou proximidade.
- source_word: הַחֹזִים שָׁוְא
  choice: que têm visões falsas
  rationale: Expressa em português natural a atividade visionária indicada pelo particípio חֹזִים e o caráter falso ou vazio de שָׁוְא.
- source_word: וְהַקֹּסְמִים כָּזָב
  choice: e fazem adivinhações mentirosas
  rationale: Mantém o paralelismo com a oração anterior e apresenta קֹסְמִים como prática de adivinhação marcada pela falsidade.
- source_word: בְּסוֹד עַמִּי
  choice: no conselho do meu povo
  rationale: סוֹד pode designar um círculo íntimo, conselho ou assembleia. “Conselho” preserva a ideia de participação reconhecida na comunidade sem impor o sentido de segredo.
- source_word: וּבִכְתָב בֵּית יִשְׂרָאֵל לֹא יִכָּתֵבוּ
  choice: não serão inscritos no registro da casa de Israel
  rationale: O passivo é preservado, enquanto “inscritos no registro” comunica com clareza o provável sentido de inclusão numa lista ou documento oficial.
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל לֹא יָבֹאוּ
  choice: nem entrarão na terra de Israel
  rationale: “Terra de Israel” é a forma natural de expressar aqui אַדְמַת יִשְׂרָאֵל no contexto de exclusão e retorno à terra.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: “Então” explicita o valor resultativo da conjunção no contexto; “vocês” torna visível o plural hebraico.
- source_word: אֲנִי אֲדֹנָי יְהוִה
  choice: eu sou o Senhor Yahweh
  rationale: Representa distintamente o título אֲדֹנָי e o nome divino יְהוִה, evitando a repetição pouco clara “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha conserva explicitamente o nome próprio divino e, ao mesmo tempo, traduz אֲדֹנָי como “Senhor”. A alternativa segue uma convenção tipográfica tradicional, mas torna menos transparente a presença de יְהוִה.
- issue: Natureza da exclusão expressa por בְּסוֹד עַמִּי
  choice: conselho do meu povo
  alternative: assembleia do meu povo; círculo íntimo do meu povo
  rationale: O termo סוֹד admite mais de uma nuance comunitária. O texto principal mantém a noção de pertencimento e participação reconhecida, e a nota preserva as alternativas sem definir indevidamente a instituição em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para tornar explícito o plural do verbo hebraico e mantém “casa de Israel” como expressão bíblica reconhecível. As notas preservam a amplitude semântica de סוֹד e כְּתָב e a alternativa tradicional para o título divino.
