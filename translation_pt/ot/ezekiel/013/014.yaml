source:
  edition: WLC
  text: וְ/הָ֨רַסְתִּ֜י אֶת הַ/קִּ֨יר אֲשֶׁר טַחְתֶּ֥ם תָּפֵ֛ל וְ/הִגַּעְתִּ֥י/הוּ אֶל הָ/אָ֖רֶץ וְ/נִגְלָ֣ה יְסֹד֑/וֹ וְ/נָֽפְלָה֙ וּ/כְלִיתֶ֣ם בְּ/תוֹכָ֔/הּ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/014.yaml
  text: I will tear down the wall that you plastered with whitewash[a], and bring it down to the ground, so that its foundation is laid bare. It will fall, and you will perish within it. Then you will know that I am Yahweh.
translation:
  language: pt
  text: Derrubarei o muro que vocês rebocaram com cal[a] e o reduzirei ao nível do chão; seu alicerce ficará exposto. Ele cairá, e vocês perecerão dentro dele. Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que vocês rebocaram com argamassa fraca”. O termo hebraico pode indicar tanto cal ou revestimento superficial quanto material impróprio e sem consistência; neste contexto, a imagem transmite uma cobertura enganosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרַסְתִּי
  choice: Derrubarei
  rationale: O verbo הרס descreve demolir ou pôr abaixo uma estrutura; “derrubarei” é direto, natural e preserva a força da imagem.
- source_word: הַקִּיר
  choice: o muro
  rationale: קִיר designa uma parede ou muro. “Muro” mantém a imagem concreta e combina naturalmente com a exposição de seus alicerces.
- source_word: טַחְתֶּם תָּפֵל
  choice: que vocês rebocaram com cal
  rationale: A expressão descreve a aplicação de um revestimento enganoso ou inadequado. “Rebocaram com cal” conserva a ação de revestir e comunica a aparência superficial; a alternativa lexical é registrada em nota.
- source_word: וְהִגַּעְתִּיהוּ אֶל הָאָרֶץ
  choice: e o reduzirei ao nível do chão
  rationale: O hifil de נגע com אֶל־הָאָרֶץ indica fazer o muro chegar ao chão; a formulação comunica sua demolição completa em português natural.
- source_word: וְנִגְלָה יְסֹדוֹ
  choice: seus alicerces ficarão expostos
  rationale: A forma de גלה expressa que a fundação será descoberta. O plural idiomático “alicerces” é natural em português e mantém a imagem estrutural.
- source_word: וְנָפְלָה
  choice: Ele cairá
  rationale: O verbo feminino singular retoma o muro no hebraico. Em português, o pronome masculino concorda com “muro” e preserva a sequência direta do juízo.
- source_word: וּכְלִיתֶם בְּתוֹכָהּ
  choice: e vocês perecerão dentro dele
  rationale: כלה aqui indica chegar ao fim ou ser destruído, enquanto בְּתוֹכָהּ conserva a ideia espacial de estar no interior do muro em colapso.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Então vocês saberão que eu sou Yahweh
  rationale: Mantém a fórmula recorrente de reconhecimento em Ezequiel e translitera diretamente o nome divino יהוה; “então” expressa naturalmente a consequência no contexto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Referente de בְּתוֹכָהּ na imagem do juízo
  choice: dentro dele, isto é, do muro
  alternative: no meio dela, possivelmente da cidade ou da estrutura figurada
  rationale: A concordância hebraica remete naturalmente a קִיר, termo feminino em hebraico. A tradução segue esse referente imediato sem explicitar além do texto a aplicação simbólica aos falsos profetas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e mantém a metáfora concreta do muro. A pontuação organiza os resultados sucessivos da demolição sem eliminar a tensão lexical de תָּפֵל, preservada na nota.
