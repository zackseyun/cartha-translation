base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/012.yaml
  text: And look[a], when the wall falls, will it not be said to you, ‘Where is the plaster with which you plastered it?’
translation:
  language: pt
  text: 'E vejam: quando o muro cair, não será dito a vocês: “Onde está o reboco[a] com que vocês o rebocaram?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a caiação”. O termo pode indicar um revestimento espalhado sobre o muro; neste capítulo, a imagem sugere um acabamento superficial enganoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E vejam
  rationale: Mantém a função vívida de chamar a atenção, em linguagem portuguesa atual, sem recorrer ao mais arcaizante «e eis que».
- source_word: נָפַל
  choice: quando ... cair
  rationale: Embora a forma hebraica seja perfeita, o contexto apresenta uma situação futura; o futuro do subjuntivo é a construção natural em português depois de «quando».
- source_word: הַקִּיר
  choice: o muro
  rationale: É o sentido comum de קִיר neste contexto de uma estrutura construída e preserva claramente a metáfora profética.
- source_word: הֲלוֹא יֵאָמֵר אֲלֵיכֶם
  choice: não será dito a vocês
  rationale: Conserva tanto a pergunta retórica que espera resposta afirmativa quanto a construção passiva e impessoal do hebraico, sem acrescentar um sujeito.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Traduz diretamente a pergunta pela localização ou existência do revestimento depois da queda do muro.
- source_word: הַטִּיחַ
  choice: o reboco
  rationale: Designa o material de revestimento aplicado ao muro. «Reboco» é claro e concreto; «caiação» expressa de modo mais interpretativo a ideia contextual de um acabamento superficial enganoso.
- source_word: אֲשֶׁר טַחְתֶּם
  choice: com que vocês o rebocaram
  rationale: Preserva a relação lexical entre o substantivo «reboco» e o verbo correspondente, bem como o objeto implícito, o muro.
