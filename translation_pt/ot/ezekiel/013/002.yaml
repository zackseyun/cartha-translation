  text: בֶּן אָדָ֕ם הִנָּבֵ֛א אֶל נְבִיאֵ֥י יִשְׂרָאֵ֖ל הַ/נִּבָּאִ֑ים וְ/אָֽמַרְתָּ֙ לִ/נְבִיאֵ֣י מִ/לִּבָּ֔/ם שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/002.yaml
  text: Son of man[a], prophesy against the prophets of Israel who are prophesying, and say to those who prophesy from their own hearts, ‘Hear the word of Yahweh.’
translation:
  language: pt
  text: 'Filho do homem, profetize contra os profetas de Israel que estão profetizando e diga aos que profetizam conforme o próprio coração[a]: “Ouçam a palavra de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “aos profetas que falam do coração deles”. A expressão hebraica indica que a mensagem procede deles mesmos, e não de Yahweh.
    reason: alternativa lexical e esclarecimento de idioma hebraico
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma característica pela qual Ezequiel é interpelado e mantém a continuidade literária do livro, sem substituir a expressão por uma interpretação como “mortal”.
- source_word: הִנָּבֵא אֶל
  choice: profetize contra
  rationale: Embora אֶל normalmente signifique “a/para”, o contexto de denúncia confere à comissão força adversativa; “contra” comunica isso naturalmente em português.
- source_word: נְבִיאֵי יִשְׂרָאֵל הַנִּבָּאִים
  choice: os profetas de Israel que estão profetizando
  rationale: Mantém a designação irônica “profetas de Israel” e representa o valor contínuo ou característico do particípio hebraico.
- source_word: וְאָמַרְתָּ
  choice: e diga
  rationale: A forma verbal dá continuidade à sequência de ordens; o imperativo é a expressão mais natural em português moderno.
- source_word: לִנְבִיאֵי מִלִּבָּם
  choice: aos que profetizam a partir do próprio coração
  rationale: Explicita de modo idiomático que a mensagem procede deles mesmos, preservando ao mesmo tempo a metáfora hebraica do coração como fonte do pensamento e da intenção.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural convoca os profetas a receber a mensagem com atenção.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” preserva a fórmula profética e sua continuidade intertextual; “Yahweh” translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Força da preposição אֶל no contexto de juízo
  choice: contra
  alternative: aos / para os
  rationale: O oráculo é dirigido aos profetas, mas seu conteúdo é de condenação. “Contra” transmite a força contextual sem acrescentar uma acusação alheia ao texto.
- issue: Origem da mensagem dos falsos profetas
  choice: aos que profetizam a partir do próprio coração
  alternative: aos profetas do coração deles
  rationale: A formulação escolhida torna inteligível o contraste entre uma mensagem produzida pelos próprios profetas e a palavra que vem de Yahweh, sem abandonar a imagem do coração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conserva a fórmula profética tradicional “Filho do homem” e a repetição deliberada de “profetas/profetizando”, presente no hebraico.
