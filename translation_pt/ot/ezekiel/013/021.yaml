  text: וְ/קָרַעְתִּ֞י אֶת מִסְפְּחֹֽתֵי/כֶ֗ם וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וְ/לֹֽא יִהְי֥וּ ע֛וֹד בְּ/יֶדְ/כֶ֖ן לִ/מְצוּדָ֑ה וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/021.yaml
  text: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
translation:
  language: pt
  text: Rasgarei as faixas mágicas de vocês[a] e livrarei o meu povo das mãos de vocês. Eles não estarão mais nas mãos de vocês como presas[b]. Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faixas”, “amuletos” ou, possivelmente, “véus”; o termo hebraico é raro, e não se sabe ao certo que objeto designa.
    reason: lexical_alternative
  - marker: b
    text: Ou “para a caça” ou “para serem capturados”; a expressão hebraica provavelmente retrata pessoas sujeitas a uma captura predatória.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַעְתִּי
  choice: Arrancarei
  rationale: O verbo קרע significa rasgar ou romper; neste contexto, “arrancar” expressa naturalmente a remoção violenta dos objetos usados pelas mulheres.
- source_word: מִסְפְּחֹתֵיכֶם
  choice: suas faixas mágicas
  rationale: O termo hebraico é raro e sua forma exata é incerta. “Faixas mágicas” comunica tanto um provável objeto físico quanto sua função no contexto de práticas condenadas, sem definir excessivamente sua forma.
- source_word: הִצַּלְתִּי
  choice: livrarei
  rationale: נצל aqui descreve libertar o povo do poder ou controle alheio; “livrarei” é corrente, digno e adequado ao contexto.
- source_word: עַמִּי
  choice: meu povo
  rationale: Reproduz diretamente a expressão hebraica e preserva seu sentido relacional.
- source_word: מִיֶּדְכֶן / בְּיֶדְכֶן
  choice: das mãos de vocês / nas mãos de vocês
  rationale: Mantém a metáfora hebraica de mão como poder ou controle, bem como sua repetição. O plural “mãos” soa mais natural em português ao se dirigir a várias mulheres.
- source_word: לִמְצוּדָה
  choice: ser presa
  rationale: O termo pode evocar caça, captura ou armadilha. No enunciado, “ser presa” transmite com clareza a sujeição à captura predatória, preservando a incerteza lexical em nota.
- source_word: וִידַעְתֶּן
  choice: Então vocês saberão
  rationale: O perfeito precedido de conjunção, no discurso profético, admite valor consequencial; “então” torna explícita essa relação natural no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Caracterização dos objetos usados pelas mulheres
  choice: faixas mágicas
  alternative: faixas, amuletos ou véus
  rationale: O contexto associa os objetos às práticas manipuladoras denunciadas, mas o substantivo raro não permite identificar com certeza sua forma. A tradução indica a função contextual e a nota conserva a incerteza.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de “vocês” representa naturalmente o feminino plural hebraico no discurso direto; o contexto identifica as destinatárias. A divisão em três frases evita uma coordenação pesada sem alterar a progressão do hebraico.
