  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י אֶל כִּסְּתוֹתֵי/כֶ֨נָה֙ אֲשֶׁ֣ר אַ֠תֵּנָה מְצֹדְד֨וֹת שָׁ֤ם אֶת הַ/נְּפָשׁוֹת֙ לְ/פֹ֣רְח֔וֹת וְ/קָרַעְתִּ֣י אֹתָ֔/ם מֵ/עַ֖ל זְרוֹעֹֽתֵי/כֶ֑ם וְ/שִׁלַּחְתִּי֙ אֶת הַ/נְּפָשׁ֔וֹת אֲשֶׁ֥ר אַתֶּ֛ם מְצֹדְד֥וֹת אֶת נְפָשִׁ֖ים לְ/פֹרְחֹֽת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against your magic bands with which you hunt the lives there like birds, and I will tear them from your arms[c][b], and I will let the lives go free—the ones you hunt like birds.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor DEUS: “Eis que estou contra as faixas mágicas[a] com as quais vocês caçam pessoas[b] ali, como se fossem aves[c]. Eu arrancarei essas faixas dos braços de vocês e libertarei as pessoas que vocês caçam como se fossem aves.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “almofadas”, “amuletos” ou “faixas para os pulsos”. O termo hebraico é raro, e não se sabe ao certo que objeto ritual as profetisas usavam.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “almas” ou “vidas”; aqui, a expressão se refere a pessoas como seres vivos.'
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “para voar”. O hebraico é difícil; a tradução entende uma comparação entre as pessoas caçadas e aves apanhadas numa armadilha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Mantém a distinção entre o título אֲדֹנָי e o nome divino יהוה; o uso de DEUS em maiúsculas evita a combinação pouco natural “Senhor SENHOR”.
- source_word: הִנְנִי אֶל
  choice: Eis que estou contra
  rationale: Preserva tanto a força apresentativa de הִנְנִי quanto a declaração enfática de oposição divina expressa por אֶל.
- source_word: כִּסְּתוֹתֵיכֶנָה
  choice: as faixas mágicas
  rationale: O substantivo é raro e seu referente exato é incerto. No contexto, designa provavelmente objetos rituais presos aos braços; “faixas mágicas” comunica sua provável função sem definir com precisão indevida seu formato.
- source_word: מְצֹדְדוֹת
  choice: vocês caçam
  rationale: O verbo pertence ao campo semântico de caçar ou apanhar em armadilha. “Caçam” conserva a imagem predatória e combina com a linguagem de aves do versículo.
- source_word: הַנְּפָשׁוֹת / נְפָשִׁים
  choice: vidas
  rationale: נֶפֶשׁ refere-se aqui a pessoas como seres vivos ameaçados. “Vidas” preserva essa dimensão concreta e evita impor ao texto uma definição posterior de “alma” como parte imaterial do ser humano.
- source_word: לְפֹרְחוֹת / לְפֹרְחֹת
  choice: como se fossem aves / como aves
  rationale: As formas derivadas de פרח evocam voar ou esvoaçar, mas a sintaxe é difícil. A formulação mantém a imagem de caça a aves e torna a metáfora compreensível em português, sem esconder a incerteza em nota.
- source_word: וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם
  choice: Eu arrancarei essas faixas dos braços de vocês
  rationale: “Arrancarei” preserva a força do juízo. A repetição explícita de “essas faixas” esclarece o antecedente do pronome hebraico e evita ambiguidade artificial em português.
- source_word: וְשִׁלַּחְתִּי
  choice: libertarei
  rationale: No contexto de pessoas apanhadas, o verbo expressa soltura ou liberação; “libertarei” transmite isso de modo direto e natural.
- source_word: שָׁם
  choice: ali
  rationale: Conserva o advérbio presente no hebraico, embora sua ligação sintática exata seja incerta.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto de predação ritual
  choice: vidas
  alternative: almas; pessoas
  rationale: O texto denuncia mulheres que, metaforicamente, caçam seres humanos. “Vidas” preserva a referência às pessoas vivas sem introduzir uma afirmação específica sobre uma alma imaterial.
- issue: Caráter dos objetos designados por כִּסְּתוֹת
  choice: faixas mágicas
  alternative: almofadas; amuletos; faixas para os pulsos
  rationale: O contexto indica objetos empregados em práticas condenadas, mas não permite determinar com segurança sua forma. A tradução comunica a função provável, enquanto a nota preserva a incerteza lexical.
- issue: Imagem expressa por פרח
  choice: como aves
  alternative: para fazê-las voar; as que voam
  rationale: A repetição ocorre dentro de uma metáfora de caça. A tradução apresenta a provável imagem aviária, e a nota registra a leitura mais literal para não eliminar a dificuldade do hebraico.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O plural “vocês” reflete a forma feminina plural do hebraico pelo contexto das profetisas, sem sobrecarregar a frase. A formulação conserva “ali”, apesar de sua ligação sintática incerta, e usa notas para preservar as principais ambiguidades lexicais.
