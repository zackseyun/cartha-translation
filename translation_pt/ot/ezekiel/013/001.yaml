  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por «SENHOR»; alternativamente transliterado «Yahweh».
    reason: Registra tanto a forma hebraica do nome divino quanto a tradução tradicional.
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: O wayyiqtol de היה introduz a sequência narrativa. Em português, a construção idiomática «a palavra ... veio» preserva sua função sem recorrer ao arcaizante «aconteceu que».
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר יְהוָה, «a palavra» mantém a imagem concreta da fala divina e a correspondência com a fórmula recorrente; «a mensagem» seria possível, mas mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino expresso pelo Tetragrama, em vez de substituí-lo silenciosamente por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com sufixo de primeira pessoa singular indica direção ao profeta. «Veio a mim» é natural e dignificado em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta. «Dizendo» conserva de modo compacto a forma da fórmula hebraica, sem convertê-la em um verbo finito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal; a nota registra a substituição tradicional por «SENHOR» sem impor essa tradição ao texto principal.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A fórmula profética foi mantida próxima do hebraico; os dois-pontos indicam que a fala direta vem em seguida.
