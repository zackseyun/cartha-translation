  text: נְבִיאֵ֣י יִשְׂרָאֵ֗ל הַֽ/נִבְּאִים֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַ/חֹזִ֥ים לָ֖/הּ חֲז֣וֹן שָׁלֹ֑ם וְ/אֵ֣ין שָׁלֹ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/016.yaml
  text: the prophets of Israel who prophesy concerning Jerusalem and who see for her a vision of peace[a], when there is no peace, declares the Lord GOD.
translation:
  language: pt
  text: os profetas de Israel que profetizam a Jerusalém e que veem uma visão de paz para ela[a], quando não há paz, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma visão de bem-estar”. O hebraico shalom pode incluir paz, integridade e bem-estar.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי יִשְׂרָאֵל
  choice: os profetas de Israel
  rationale: A cadeia construta designa naturalmente os profetas pertencentes ou associados a Israel.
- source_word: הַנִּבְּאִים אֶל יְרוּשָׁלַםִ
  choice: que profetizam a Jerusalém
  rationale: O particípio descreve a atividade contínua dos profetas, e אֶל conserva a direção da mensagem para Jerusalém sem acrescentar a ideia de oposição.
- source_word: וְהַחֹזִים לָהּ
  choice: e que têm para ela uma visão
  rationale: O verbo חזה denota ver uma visão. Em português, 'têm para ela uma visão' comunica com naturalidade tanto a experiência visionária quanto o dativo לָהּ, cujo referente é Jerusalém.
- source_word: חֲזוֹן שָׁלוֹם
  choice: uma visão de paz
  rationale: Mantém o substantivo 'visão' e preserva a repetição retórica de שָׁלוֹם na afirmação seguinte.
- source_word: וְאֵין שָׁלוֹם
  choice: quando não há paz
  rationale: Expressa o valor circunstancial da oração e o contraste entre a visão anunciada e a realidade.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente atual e digno para a fórmula profética de pronunciamento divino.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי ('Senhor') do nome divino יהוה ('Yahweh') e evita a repetição artificial 'Senhor SENHOR'.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida preserva o nome divino presente no hebraico e, ao mesmo tempo, traduz אֲדֹנָי como 'Senhor', sem importar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A estrutura conserva o contraste enfático entre a alegada visão de paz e a inexistência de paz.
