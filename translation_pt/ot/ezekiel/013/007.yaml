source:
  edition: WLC
  text: הֲ/ל֤וֹא מַֽחֲזֵה שָׁוְא֙ חֲזִיתֶ֔ם וּ/מִקְסַ֥ם כָּזָ֖ב אֲמַרְתֶּ֑ם וְ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַ/אֲנִ֖י לֹ֥א דִבַּֽרְתִּי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/007.yaml
  text: Have you not seen a false vision and spoken a lying divination[a], when you say, ‘Declares Yahweh,’ though I have not spoken?
translation:
  language: pt
  text: 'Acaso vocês não tiveram uma visão falsa e proferiram uma adivinhação mentirosa[a], quando dizem: “Declara Yahweh”, embora eu não tenha falado?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma visão vazia” e “uma adivinhação falsa”. Os termos hebraicos ressaltam tanto o vazio quanto a falsidade das revelações alegadas pelos profetas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Acaso vocês não
  rationale: Preserva a pergunta retórica, que espera resposta afirmativa, em português natural.
- source_word: מַחֲזֵה שָׁוְא
  choice: uma visão falsa
  rationale: מַחֲזֶה designa uma visão ou revelação vista, enquanto שָׁוְא pode expressar falsidade, vazio ou inutilidade; no contexto, “falsa” comunica claramente o caráter enganoso da alegada revelação.
- source_word: חֲזִיתֶם
  choice: tiveram
  rationale: Em português, “ter uma visão” é a colocação mais natural para o ato de receber ou experimentar uma visão; mantém o perfeito na segunda pessoa do plural.
- source_word: וּמִקְסַם כָּזָב
  choice: e proferiram uma adivinhação mentirosa
  rationale: מִקְסָם refere-se a adivinhação ou pronunciamento divinatório, e כָּזָב a mentira ou falsidade. “Proferiram” liga naturalmente o substantivo ao verbo אֲמַרְתֶּם.
- source_word: וְאֹמְרִים
  choice: quando dizem
  rationale: Expressa a ação concomitante e contínua do particípio, introduzindo de modo natural a fórmula que os falsos profetas alegam pronunciar.
- source_word: נְאֻם יְהוָה
  choice: “Declara Yahweh”
  rationale: Conserva a força da fórmula profética de pronunciamento divino e mantém o nome próprio יְהוָה como Yahweh.
- source_word: וַאֲנִי לֹא דִבַּרְתִּי
  choice: embora eu não tenha falado
  rationale: O pronome explícito אֲנִי cria forte contraste entre a alegação dos profetas e o fato de Yahweh não ter falado; “embora” comunica essa oposição com naturalidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” o apresenta como nome próprio, sem substituí-lo por um título.
- issue: Natureza das alegadas revelações proféticas
  choice: visão falsa e adivinhação mentirosa
  alternative: visão vazia e adivinhação falsa
  rationale: A tradução afirma a falsidade das alegações sem apagar as nuances de vazio e inutilidade presentes em שָׁוְא; a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural “vocês”, amplamente compreensível no Brasil e internacionalmente. A pergunta retórica e o contraste final foram preservados sem suavizar a acusação.
