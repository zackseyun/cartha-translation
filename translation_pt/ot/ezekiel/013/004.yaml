  text: כְּ/שֻׁעָלִ֖ים בָּ/חֳרָב֑וֹת נְבִיאֶ֥י/ךָ יִשְׂרָאֵ֖ל הָיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/004.yaml
  text: Your prophets, O Israel, have been like foxes[a] among ruins.
translation:
  language: pt
  text: Os teus profetas, ó Israel, têm sido como raposas[a] entre as ruínas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chacais”. O termo hebraico pode designar de modo mais amplo um canídeo selvagem semelhante à raposa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  choice: como raposas
  rationale: O termo hebraico designa raposas ou canídeos selvagens semelhantes. “Raposas” é a equivalência tradicional e natural em português; a identificação alternativa é preservada em nota.
- source_word: בָּחֳרָבוֹת
  choice: entre as ruínas
  rationale: O substantivo plural indica lugares arruinados ou desolados. “Entre as ruínas” expressa naturalmente o cenário em que esses animais circulam.
- source_word: נְבִיאֶיךָ
  choice: os seus profetas
  rationale: O plural construto com sufixo de segunda pessoa masculina singular indica os profetas pertencentes ao Israel diretamente interpelado. A tradução não acrescenta “falsos”, palavra ausente neste versículo.
- source_word: יִשְׂרָאֵל
  choice: ó Israel
  rationale: O nome funciona como vocativo. A partícula “ó” marca com clareza e dignidade a interpelação profética em português.
- source_word: הָיוּ
  choice: têm sido
  rationale: O perfeito apresenta como estabelecida a comparação acusatória. O perfeito composto mantém a relação da conduta passada com a situação presente do discurso.
theological_decisions:
- issue: Explicitar no texto principal que os profetas são falsos
  choice: Manter “os seus profetas” sem acrescentar “falsos”
  alternative: os seus falsos profetas
  rationale: Embora o contexto os condene, o hebraico deste versículo diz apenas “seus profetas”. Acrescentar “falsos” incorporaria ao texto uma explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a comparação, o vocativo e a ambiguidade lexical do animal.
