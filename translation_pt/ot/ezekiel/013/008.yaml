  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן דַּבֶּרְ/כֶ֣ם שָׁ֔וְא וַ/חֲזִיתֶ֖ם כָּזָ֑ב לָ/כֵן֙ הִנְ/נִ֣י אֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/008.yaml
  text: 'Therefore thus says the Lord GOD: Because you have spoken falsehood and seen a lie[a], therefore behold, I am against you, declares the Lord GOD.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh[a]: “Visto que vocês falaram falsidades e tiveram visões mentirosas, por isso, eis que estou contra vocês”, declara o Senhor Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Adonai YHWH”. Muitas traduções vertem essa expressão como “Senhor DEUS”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Mantém a relação causal nos dois usos do termo e soa natural em português atual.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional de transmissão da mensagem divina.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição pouco natural «Senhor SENHOR».
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz de modo claro e digno o fundamento da sentença divina.
- source_word: דַּבֶּרְכֶם שָׁוְא
  choice: vocês falaram falsidades
  rationale: Expressa diretamente a fala enganosa denunciada no contexto, sem recorrer ao sentido menos específico de «vaidade».
- source_word: וַחֲזִיתֶם כָּזָב
  choice: e tiveram visões mentirosas
  rationale: Torna explícito o sentido visionário de חזה no contexto profético e conserva a acusação de falsidade de כָּזָב.
- source_word: הִנְנִי אֲלֵיכֶם
  choice: eis que estou contra vocês
  rationale: Conserva a força solene da fórmula de ameaça divina e traduz אֲלֵיכֶם como oposição hostil.
- source_word: נְאֻם
  choice: declara
  rationale: Comunica com clareza a fórmula profética de autenticação e sua autoridade.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A opção principal mantém tanto o título «Senhor» quanto o nome pessoal divino, sem substituir o nome por outro título.
- issue: Natureza das alegadas visões
  choice: visões mentirosas
  alternative: viram uma mentira
  rationale: O contexto trata de pretensas revelações proféticas; a tradução deixa esse âmbito claro, mas não acrescenta uma explicação doutrinária sobre sua origem.
translation_notes:
  register: Português moderno, claro e solene, com «vocês» para o plural. A repetição de «por isso» foi mantida porque corresponde à estrutura causal enfática do hebraico.
