  text: עַל מַפַּלְתּ֥/וֹ יִשְׁכְּנ֖וּ כָּל ע֣וֹף הַ/שָּׁמָ֑יִם וְ/אֶל פֹּארֹתָ֣י/ו הָי֔וּ כֹּ֖ל חַיַּ֥ת הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/013.yaml
  text: On its fallen trunk all the birds of the heavens will dwell[b][a], and on its boughs will be all the beasts of the field.
translation:
  language: pt
  text: Sobre o seu tronco caído[a] habitarão todas as aves do céu, e sobre os seus grandes ramos[b] estarão todos os animais do campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sobre a sua queda”. O termo hebraico pode designar a queda ou ruína de modo mais abstrato; o contexto da árvore abatida favorece “tronco caído”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ramos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפַּלְתּוֹ
  choice: seu tronco caído
  rationale: O substantivo derivado de נפל pode indicar a queda ou aquilo que caiu. No contexto da imagem do cedro abatido, a formulação concreta preserva melhor a metáfora da árvore, sem ocultar na nota a possibilidade abstrata.
- source_word: יִשְׁכְּנוּ
  choice: habitarão
  rationale: שׁכן expressa habitar, estabelecer-se ou permanecer. “Habitarão” conserva a ideia de residência das aves e o paralelismo profético.
- source_word: עוֹף הַשָּׁמַיִם
  choice: todas as aves do céu
  rationale: “Aves do céu” é a expressão bíblica natural em português e representa com clareza o genitivo hebraico.
- source_word: פֹּארֹתָיו
  choice: seus grandes ramos
  rationale: O termo designa os ramos amplos ou principais de uma árvore. “Grandes ramos” mantém a imagem do cedro e é mais transparente ao leitor comum do que termos raros como “frondes” ou “galhos-mestres”.
- source_word: הָיוּ
  choice: estarão
  rationale: Embora a forma seja qatal, o contexto profético e o paralelismo com יִשְׁכְּנוּ favorecem valor futuro. “Estarão” também exprime naturalmente a presença dos animais sobre os ramos.
- source_word: חַיַּת הַשָּׂדֶה
  choice: todos os animais do campo
  rationale: Esta formulação mantém a expressão bíblica tradicional sem restringir indevidamente חַיָּה a feras nem introduzir uma distinção moderna entre campo e natureza selvagem.
- source_word: עַל ... וְאֶל
  choice: Sobre ... e sobre
  rationale: A repetição idiomática de “sobre” comunica a relação espacial das aves e dos animais com a árvore caída, evitando a tradução rígida de אֶל por “em direção a”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação profética. A ordem paralela do hebraico foi preservada, enquanto “aves do céu” e “animais do campo” mantêm expressões bíblicas naturais em português.
