source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה בְּ/י֨וֹם רִדְתּ֤/וֹ שְׁא֨וֹלָ/ה֙ הֶאֱבַ֜לְתִּי כִּסֵּ֤תִי עָלָי/ו֙ אֶת תְּה֔וֹם וָֽ/אֶמְנַע֙ נַהֲרוֹתֶ֔י/הָ וַ/יִּכָּלְא֖וּ מַ֣יִם רַבִּ֑ים וָ/אַקְדִּ֤ר עָלָי/ו֙ לְבָנ֔וֹן וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה עָלָ֥י/ו עֻלְפֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/015.yaml
  text: 'Thus says the Lord GOD: On the day he went down to Sheol[a], I caused mourning; I covered the deep because of him, and I restrained its rivers, and the many waters were stopped. I made Lebanon grow dark because of him[c][b], and all the trees of the field fainted because of him.'
translation:
  language: pt
  text: 'Assim diz o Senhor DEUS: No dia em que ele desceu ao Sheol[a], causei luto; cobri o abismo por causa dele, contive os seus rios, e muitas águas foram represadas. Fiz o Líbano escurecer por causa dele[b], e todas as árvores do campo desfaleceram por causa dele[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à sepultura» ou «ao mundo dos mortos». O hebraico Sheol designa o domínio dos mortos; o termo foi mantido transliterado para não restringir seu sentido.
    reason: lexical_alternative
  - marker: b
    text: Ou «escureci o Líbano por causa dele». O verbo hebraico pode indicar causar escuridão ou tristeza sombria, em harmonia com as imagens de luto do versículo.
    reason: lexical_alternative
  - marker: c
    text: Ou «ficaram prostradas por causa dele».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Mantém os dois elementos do título divino segundo a convenção portuguesa, usando DEUS em versaletes representadas por maiúsculas para evitar a repetição «Senhor SENHOR».
- source_word: בְּיוֹם רִדְתּוֹ שְׁאוֹלָה
  choice: No dia em que ele desceu ao Sheol
  rationale: Preserva explicitamente a oração temporal e translitera שְׁאוֹל, evitando reduzi-lo à sepultura física ou associá-lo diretamente a concepções posteriores de inferno.
- source_word: הֶאֱבַלְתִּי
  choice: fiz haver luto
  rationale: Expressa de modo natural em português a força causativa do hifil de אבל, embora o objeto ou sujeito do luto não esteja expresso no hebraico.
- source_word: כִּסֵּתִי עָלָיו אֶת תְּהוֹם
  choice: por causa dele, cobri o abismo
  rationale: Traduz כסה pelo sentido comum «cobrir» e entende עָלָיו em sentido causal, em harmonia com as demais ocorrências da expressão no versículo. «Abismo» preserva a imagem das águas profundas de תְּהוֹם.
- source_word: וָאֶמְנַע נַהֲרוֹתֶיהָ
  choice: e contive os seus rios
  rationale: מנע indica reter ou conter; o sufixo feminino remete ao abismo, aqui retomado por «seus».
- source_word: וַיִּכָּלְאוּ מַיִם רַבִּים
  choice: e as muitas águas foram represadas
  rationale: Conserva o resultado passivo do nifal de כלא e emprega um verbo corrente que comunica águas detidas ou impedidas de fluir.
- source_word: וָאַקְדִּר עָלָיו לְבָנוֹן
  choice: Por causa dele, cobri o Líbano de escuridão
  rationale: O hifil de קדר comunica causar escuridão ou tristeza sombria. A formulação mantém tanto a imagem visual quanto sua função de luto cósmico.
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: e todas as árvores do campo
  rationale: Tradução direta que conserva a imagem coletiva das árvores na alegoria.
- source_word: עָלָיו עֻלְפֶּה
  choice: desfaleceram
  rationale: Converte com naturalidade a expressão nominal hebraica em verbo português, preservando a imagem de abatimento e colapso; «por causa dele» já aparece no início da oração.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos; o inferno
  rationale: A transliteração preserva a amplitude do conceito hebraico do domínio dos mortos, sem restringi-lo a um túmulo físico nem importar noções posteriores de inferno.
- issue: Imagens de luto cósmico
  choice: Manter o abismo, o Líbano e as árvores participando poeticamente do luto
  alternative: Explicar tudo como desastre ambiental literal ou decodificar a imagem como alegoria política no texto principal
  rationale: O hebraico personifica elementos da criação no contexto da queda da grande árvore. A tradução conserva essa tensão poética sem impor uma interpretação explicativa.
- issue: Sentido de וָאַקְדִּר
  choice: cobri ... de escuridão
  alternative: entristeci; fiz ficar sombrio
  rationale: A escolha mantém a imagem concreta de trevas e, ao mesmo tempo, permite que o contexto comunique a tristeza, sem reduzir o verbo a uma única nuance emocional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações foi ajustada pontualmente para evitar ambiguidades referenciais, sem apagar o paralelismo hebraico. «Sheol» foi preservado como termo transliterado e explicado em nota.
