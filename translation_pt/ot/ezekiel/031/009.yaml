source:
  edition: WLC
  text: יָפֶ֣ה עֲשִׂיתִ֔י/ו בְּ/רֹ֖ב דָּֽלִיּוֹתָ֑י/ו וַ/יְקַנְאֻ֨/הוּ֙ כָּל עֲצֵי עֵ֔דֶן אֲשֶׁ֖ר בְּ/גַ֥ן הָ/אֱלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/009.yaml
  text: I made it beautiful with its many branches[a], and all the trees of Eden that were in the garden of God envied it.
translation:
  language: pt
  text: Eu o tornei belo com a abundância de seus ramos[a], e todas as árvores do Éden que estavam no jardim de Deus tiveram inveja dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela grande quantidade de seus ramos”.'
    reason: A preposição בְּ pode indicar o meio pelo qual o cedro foi embelezado ou descrever a característica em que consistia sua beleza.
lexical_decisions:
- source_word: יָפֶה
  choice: belo
  rationale: Adjetivo predicativo que descreve a beleza e o esplendor da árvore; “belo” é natural, digno e direto em português.
- source_word: עֲשִׂיתִיו
  choice: Eu o tornei
  rationale: O perfeito qal na primeira pessoa com sufixo masculino singular apresenta Deus como agente. O pronome “o” preserva tanto o gênero gramatical masculino de “cedro” quanto a possível referência figurada à Assíria.
- source_word: בְּרֹב
  choice: com a abundância de
  rationale: Mantém a ideia de grande quantidade e permite entender os muitos ramos como o meio ou aspecto pelo qual Deus tornou o cedro belo.
- source_word: דָּלִיּוֹתָיו
  choice: seus ramos
  rationale: “Ramos” é o termo moderno mais claro para as ramificações do cedro e preserva a imagem arbórea.
- source_word: וַיְקַנְאֻהוּ
  choice: tiveram inveja dele
  rationale: קנא expressa aqui inveja ou ciúme. “Tiveram inveja dele” é idiomático e mantém o sufixo masculino singular.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: todas as árvores do Éden
  rationale: Preserva a expressão coletiva e a evocação poética do Éden.
- source_word: אֲשֶׁר בְּגַן הָאֱלֹהִים
  choice: que estavam no jardim de Deus
  rationale: Reproduz claramente a oração relativa e conserva a expressão bíblica elevada “jardim de Deus”.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares no contexto metafórico
  choice: Usar “o/dele”, compatível em português com o cedro e com o referente político figurado.
  alternative: Usar “a/aquela árvore/dela” para salientar exclusivamente a imagem da árvore.
  rationale: Ao contrário do inglês, o português permite preservar naturalmente o masculino do hebraico porque “cedro” é masculino. Assim, o texto não precisa decidir entre a árvore metafórica e a Assíria ou seu governante.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom poético e elevado sem arcaísmos, preservando a personificação e a ambiguidade do referente.
