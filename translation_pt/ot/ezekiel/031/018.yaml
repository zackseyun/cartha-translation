  naturalness: O registro é em geral claro e digno. «A quem você se assemelhava assim» é mais fiel ao sentido comparativo, embora a colocação de «assim» seja algo marcada; «a quem você se assemelhava, em glória e grandeza» mantém uma formulação portuguesa natural, com a intensidade de כָּכָה absorvida na pergunta e na especificação subsequente. «À terra inferior» é mais direto e menos interpretativo do que «à terra das profundezas».
  terminology: «Glória», «grandeza», «árvores do Éden», «incircuncisos», «jazerá», «mortos à espada» e «Senhor Yahweh» são adequados. «Faraó» com inicial maiúscula funciona bem como designação do governante egípcio no resumo conclusivo.
