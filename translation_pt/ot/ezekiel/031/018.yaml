source:
  edition: WLC
  text: אֶל מִ֨י דָמִ֥יתָ כָּ֛כָה בְּ/כָב֥וֹד וּ/בְ/גֹ֖דֶל בַּ/עֲצֵי עֵ֑דֶן וְ/הוּרַדְתָּ֨ אֶת עֲצֵי עֵ֜דֶן אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֨וֹךְ עֲרֵלִ֤ים תִּשְׁכַּב֙ אֶת חַלְלֵי חֶ֔רֶב ה֤וּא פַרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/018.yaml
  text: Whom were you like in glory and greatness among the trees of Eden? Yet you shall be brought down with the trees of Eden to the land below; you shall lie among the uncircumcised, with those slain by the sword. This is Pharaoh and all his multitude[a], declares the Lord GOD.
translation:
  language: pt
  text: A quem você se assemelhava, em glória e grandeza, entre as árvores do Éden? Contudo, você será derrubado, junto com as árvores do Éden, à terra inferior[a]. Você jazerá entre os incircuncisos, com os mortos à espada. Este é o Faraó e toda a sua multidão, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à terra de baixo» ou «ao mundo dos mortos». O hebraico se refere à região abaixo, o domínio dos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָמִיתָ כָּכָה
  choice: você se comparava assim
  rationale: O verbo expressa semelhança ou comparação, e o advérbio כָּכָה é representado por “assim”, preservando a ênfase da pergunta retórica sem tornar a frase excessivamente rígida.
- source_word: כָבוֹד וּבְגֹדֶל
  choice: em glória e grandeza
  rationale: Mantém tanto a magnificência régia quanto a ideia de magnitude e posição elevada evocada pela metáfora das árvores.
- source_word: עֲצֵי עֵדֶן
  choice: as árvores do Éden
  rationale: Preserva literalmente a metáfora desenvolvida no capítulo, na qual poderes e governantes são retratados como árvores majestosas.
- source_word: וְהוּרַדְתָּ
  choice: você será levado para baixo
  rationale: Expressa o valor passivo-causativo do Hophal e o sentido futuro do perfeito em contexto profético de julgamento.
- source_word: אֶרֶץ תַּחְתִּית
  choice: a terra das profundezas
  rationale: Conserva a imagem espacial de uma região inferior associada ao domínio dos mortos, sem impor uma geografia doutrinária posterior.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: entre os incircuncisos
  rationale: Tradução direta e natural que retém a conotação de desonra presente na linguagem de julgamento de Ezequiel.
- source_word: תִּשְׁכַּב
  choice: você jazerá
  rationale: “Jazer” comunica com dignidade a imagem de estar deitado na morte e corresponde ao contexto funerário.
- source_word: חַלְלֵי חֶרֶב
  choice: os mortos à espada
  rationale: Equivalente português conciso e idiomático para os que foram mortos violentamente pela espada.
- source_word: הוּא פַרְעֹה וְכָל הֲמוֹנוֹ
  choice: Esse é o faraó e toda a sua multidão
  rationale: Mantém a construção identificadora que conclui e aplica a imagem ao faraó e ao conjunto de seus seguidores ou forças.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e preserva explicitamente o nome da aliança.
theological_decisions:
- issue: Sentido de אֶרֶץ תַּחְתִּית
  choice: a terra das profundezas
  alternative: a terra inferior; o mundo dos mortos
  rationale: A formulação mantém a imagem hebraica de descida ao domínio dos mortos sem identificá-lo de modo inequívoco com uma concepção teológica posterior.
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução distingue o título “Senhor” do nome próprio divino e representa diretamente o Tetragrama.
- issue: Valor temporal de וְהוּרַדְתָּ e תִּשְׁכַּב
  choice: 'futuro profético: “será levado” e “jazerá”'
  alternative: 'passado: “foi levado” e presente/futuro contextual'
  rationale: O contexto do oráculo apresenta o destino decretado do faraó; o futuro em português comunica adequadamente a certeza prospectiva do julgamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jazerá” preserva o tom solene e funerário; “você” mantém clara a interpelação direta sem arcaísmo. A pontuação explicita a estrutura retórica do hebraico sem desfazer sua metáfora.
