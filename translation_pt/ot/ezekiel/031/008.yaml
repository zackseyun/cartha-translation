base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
translation:
  language: pt
  text: No jardim de Deus[a], os cedros não lhe faziam sombra; os ciprestes não se comparavam aos seus galhos, e os plátanos não eram como os seus ramos[b]. Nenhuma árvore no jardim de Deus se comparava a ele em sua beleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no jardim divino”. O hebraico diz literalmente “no jardim de Deus”; a expressão evoca o Éden.
    reason: lexical_alternative
  - marker: b
    text: “Plátanos” é o sentido provável; traduções tradicionais muitas vezes trazem “castanheiros”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָזִים
  choice: os cedros
  rationale: Tradução corrente do plural de אֶרֶז, adequada ao paralelismo poético entre árvores majestosas.
- source_word: עֲמָמֻהוּ
  choice: não o ofuscavam
  rationale: O verbo pode indicar escurecer ou obscurecer. “Ofuscar” preserva a imagem concreta da copa que encobre e também a ideia contextual de não eclipsar sua grandeza.
- source_word: בְּגַן אֱלֹהִים
  choice: no jardim de Deus
  rationale: Mantém de modo transparente a construção hebraica e sua evocação do Éden sem explicitar essa identificação no texto principal.
- source_word: בְּרוֹשִׁים
  choice: os ciprestes
  rationale: Embora a espécie exata seja discutida, “ciprestes” é uma identificação moderna comum e natural nesta lista de árvores.
- source_word: דָמוּ
  choice: não se comparavam
  rationale: Expressa idiomaticamente a comparação indicada por דמה e comunica que essas árvores não igualavam os grandes galhos da árvore descrita.
- source_word: סְעַפֹּתָיו
  choice: seus grandes galhos
  rationale: O termo se refere às divisões maiores da árvore; “grandes galhos” distingue-o do termo posterior traduzido por “ramos”.
- source_word: עַרְמֹנִים
  choice: os plátanos
  rationale: “Plátanos” é a identificação favorecida por boa parte da lexicografia moderna, em vez da tradução tradicional “castanheiros”.
- source_word: פֹארֹתָיו
  choice: seus ramos
  rationale: Designa ramos ou crescimento frondoso; “ramos” é natural e preserva uma distinção em relação a סְעַפֹּתָיו.
- source_word: כָּל עֵץ
  choice: Nenhuma árvore
  rationale: Reformula a negação universal hebraica em português natural, sem alterar o sentido.
- source_word: דָמָה אֵלָיו
  choice: se comparava a ele
  rationale: Mantém a coerência com a ocorrência anterior de דמה e oferece uma formulação portuguesa fluente.
- source_word: בְּיָפְיוֹ
  choice: em beleza
  rationale: Preserva o valor da preposição ב, indicando o aspecto em que nenhuma árvore se igualava a ele.
theological_decisions:
- issue: Sentido de “jardim de Deus”
  choice: Manter “jardim de Deus” no texto principal
  alternative: Éden; paraíso de Deus
  rationale: A expressão evoca fortemente o Éden, mas o hebraico diz literalmente “jardim de Deus”. A tradução preserva a imagem e a tensão sem tornar explícita uma identificação mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com construção poética fluente. “Ofuscavam” conserva a metáfora arbórea e a noção de não eclipsar; “grandes galhos” e “ramos” distinguem os dois termos hebraicos próximos. O marcador [a] foi colocado após a primeira ocorrência da expressão comentada, e [b] após a oração referente aos plátanos.
