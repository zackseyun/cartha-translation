id: EZK.31.16
reference: Ezekiel 31:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/קּ֤וֹל מַפַּלְתּ/וֹ֙ הִרְעַ֣שְׁתִּי גוֹיִ֔ם בְּ/הוֹרִדִ֥/י אֹת֛/וֹ שְׁא֖וֹלָ/ה אֶת י֣וֹרְדֵי ב֑וֹר וַ/יִּנָּ֨חֲמ֜וּ בְּ/אֶ֤רֶץ תַּחְתִּית֙ כָּל עֲצֵי עֵ֔דֶן מִבְחַ֥ר וְ/טוֹב לְבָנ֖וֹן כָּל שֹׁ֥תֵי מָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/016.yaml
  text: At the sound of his fall I made nations quake[a], when I brought him down to Sheol with those who go down to the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water[c][b], were comforted in the earth beneath.
translation:
  language: pt
  text: Ao som de sua queda, fiz as nações tremerem; quando o fiz descer ao Sheol[a], junto com os que descem à cova, todas as árvores do Éden — as mais seletas e melhores do Líbano, todas as que bebem água — foram consoladas[b] nas profundezas da terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao mundo dos mortos” ou “à sepultura”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram confortadas” ou “encontraram consolo”. O sentido pode ser que as outras potências caídas encontraram um consolo sombrio quando essa grande árvore também desceu.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “na terra inferior”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל מַפַּלְתּוֹ
  choice: Ao som de sua queda
  rationale: Mantém a imagem concreta e sonora da queda da grande árvore, sem eliminar seu sentido metafórico de ruína política.
- source_word: הִרְעַשְׁתִּי גוֹיִם
  choice: fiz as nações tremerem
  rationale: 'Expressa de modo natural em português a força causativa do Hifil: Deus provoca o tremor das nações.'
- source_word: בְּהוֹרִדִי אֹתוֹ
  choice: quando o fiz descer
  rationale: A construção temporal preserva a forma causativa do verbo e se integra naturalmente ao período.
- source_word: שְׁאוֹלָה
  choice: ao Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos sem reduzi-lo apenas ao túmulo nem impor uma cosmologia posterior.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: junto com os que descem à cova
  rationale: Interpreta אֶת em sentido associativo, adequado ao contexto, e conserva a imagem tradicional da descida à cova da morte.
- source_word: וַיִּנָּחֲמוּ
  choice: foram consoladas
  rationale: Preserva a voz passiva do Nifal e a possível ironia de as potências já caídas receberem consolo com a queda desta grande árvore.
- source_word: בְּאֶרֶץ תַּחְתִּית
  choice: nas profundezas da terra
  rationale: Comunica em português corrente a localização inferior indicada pelo hebraico, mantendo a imagem espacial de descida.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: todas as árvores do Éden
  rationale: Conserva literalmente a metáfora arbórea que estrutura o capítulo e a alusão ao Éden.
- source_word: מִבְחַר וְטוֹב לְבָנוֹן
  choice: as mais seletas e melhores do Líbano
  rationale: Representa a qualidade excepcional das árvores do Líbano e mantém a expressão como descrição das árvores do Éden.
- source_word: כָּל שֹׁתֵי מָיִם
  choice: todas as que bebem água
  rationale: Preserva a personificação e a imagem das árvores bem irrigadas, central à alegoria do capítulo.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração mantém o referente hebraico aberto e evita reduzi-lo a um local de sepultamento ou defini-lo segundo uma doutrina posterior da vida após a morte.
- issue: O consolo das árvores nas profundezas da terra
  choice: Preservar a afirmação de que as árvores foram consoladas
  alternative: Explicitar que as nações caídas sentiram uma satisfação sombria com a queda da Assíria
  rationale: O texto personifica árvores que simbolizam poderes ou nações. A tradução conserva essa imagem e sua tensão sem decidir se a cena pretende descrever literalmente uma experiência consciente após a morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe de boa legibilidade brasileira. A metáfora das árvores e o termo cultural Sheol foram preservados; travessões delimitam a descrição extensa do sujeito sem alterar a estrutura lógica do hebraico.
