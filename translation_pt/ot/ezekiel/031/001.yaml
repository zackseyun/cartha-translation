reference: Ezekiel 31:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בַּ/שְּׁלִישִׁ֖י בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/001.yaml
  text: And it happened in the eleventh year[a], in the third month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'E aconteceu que, no décimo primeiro ano, no terceiro mês, no primeiro dia do mês, a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH. Tradicionalmente traduzido por «SENHOR»; outra forma: «Jeová».'
    reason: Explica a representação do nome divino e registra traduções tradicionais alternativas.
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa hebraica sem recorrer ao arcaísmo «e sucedeu».
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: no décimo primeiro ano
  rationale: Expressão ordinal natural em português para a fórmula hebraica de datação.
- source_word: בַּשְּׁלִישִׁי
  choice: no terceiro mês
  rationale: O substantivo «mês» está implícito no hebraico e é explicitado para clareza natural.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: Comunica com precisão e clareza a expressão calendárica hebraica.
- source_word: הָיָה דְבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: Reproduz de modo idiomático a fórmula profética que apresenta uma revelação dirigida ao profeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Identifica diretamente o profeta como destinatário da palavra divina.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a transição formal para o discurso direto que vem no versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. «Yahweh» preserva o nome próprio, enquanto «SENHOR» o representa por um título tradicional e «Jeová» reflete uma forma posterior.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula inicial foi mantida, e a datação recebeu a explicitação de «mês», implícita no hebraico. O marcador da nota foi colocado após «Yahweh», termo ao qual a nota efetivamente se refere.
