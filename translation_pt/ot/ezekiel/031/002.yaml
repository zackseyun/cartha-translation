  text: 'Son of man, say to Pharaoh king of Egypt and to his multitude: Whom are you like in your greatness?'
translation:
  language: pt
  text: 'Filho do homem, diga ao faraó, rei do Egito, e à sua multidão: “A quem você se compara em sua grandeza?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Filho do homem
  rationale: Mantém a forma recorrente do vocativo dirigido a Ezequiel e sua imagem hebraica.
- source_word: הֲמוֹנוֹ
  choice: sua multidão
  rationale: Conserva o sentido coletivo e a amplitude do hebraico, que pode abranger a numerosa população ou força associada ao faraó.
- source_word: דָּמִיתָ
  choice: você se compara
  rationale: Expressa naturalmente em português a pergunta de comparação, sem antecipar a figura desenvolvida nos versículos seguintes.
- source_word: בְגָדְלֶךָ
  choice: em sua grandeza
  rationale: Reproduz de modo direto a esfera ou condição na qual se faz a comparação.
theological_decisions:
- issue: Referente singular na pergunta
  choice: 'Tratar a pergunta como dirigida ao faraó no singular: “você”'
  alternative: Entender o sufixo singular como referência coletiva ao faraó e à sua multidão
  rationale: A morfologia de דָּמִיתָ e גָדְלֶךָ é masculina singular, e o faraó é o destinatário principal; a multidão é incluída na proclamação, mas não exige pluralizar a pergunta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “diga” e “você” para tornar explícita e natural a segunda pessoa singular, preservando o conteúdo e a tensão retórica do hebraico.
