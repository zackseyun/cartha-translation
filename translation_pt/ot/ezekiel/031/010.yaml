source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֕עַן אֲשֶׁ֥ר גָּבַ֖הְתָּ בְּ/קוֹמָ֑ה וַ/יִּתֵּ֤ן צַמַּרְתּ/וֹ֙ אֶל בֵּ֣ין עֲבוֹתִ֔ים וְ/רָ֥ם לְבָב֖/וֹ בְּ/גָבְהֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/010.yaml
  text: 'Therefore thus says the Lord GOD: Because you grew tall in stature[a], and set your top among the thick boughs, and his heart was lifted up in his height,'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor DEUS: Visto que você cresceu em altura e ele pôs sua copa entre a folhagem densa[a], e o coração dele se elevou em sua altura,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre as nuvens”. O termo hebraico pode referir-se a folhagem espessa ou a ramos densos; alguns o entendem aqui como uma alusão à altura extrema.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Preserva os dois elementos do título divino e segue uma convenção portuguesa clara, evitando a repetição “Senhor SENHOR”.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz de modo natural a causa do juízo anunciado, mantendo a força causal da expressão hebraica.
- source_word: גָּבַהְתָּ בְּקוֹמָה
  choice: você se elevou em altura
  rationale: Mantém a imagem concreta da árvore que se torna alta e também permite perceber a conotação de exaltação.
- source_word: וַיִּתֵּן צַמַּרְתּוֹ
  choice: e pôs sua copa
  rationale: נתן tem aqui o sentido de colocar, enquanto צַמֶּרֶת designa a parte superior ou copa da árvore. O sufixo hebraico é formalmente de terceira pessoa, mas foi vertido como “sua” no fluxo do discurso direto, conforme a referência contextual; a oscilação explícita reaparece na oração seguinte.
- source_word: אֶל בֵּין עֲבוֹתִים
  choice: entre a folhagem densa
  rationale: עֲבוֹתִים pode indicar vegetação espessa, ramos densos ou, segundo outra análise contextual, nuvens. A tradução principal mantém o sentido botânico mais direto e registra a alternativa em nota.
- source_word: וְרָם לְבָבוֹ
  choice: e o coração dele se ensoberbeceu
  rationale: Expressa em português corrente o idioma hebraico de um coração que se eleva, deixando clara a ideia de orgulho sem apagar a ligação com a imagem da altura.
- source_word: בְּגָבְהוֹ
  choice: por causa da sua altura
  rationale: A construção relaciona a soberba à altura alcançada. “Por causa da” comunica naturalmente essa relação causal em português.
theological_decisions:
- issue: Mudança de pessoa gramatical no versículo
  choice: Manter a passagem da segunda pessoa (“você”) para a terceira (“o coração dele”)
  alternative: Uniformizar todo o versículo na segunda ou na terceira pessoa
  rationale: O texto hebraico apresenta uma oscilação entre tratamento direto e descrição. Preservá-la torna a tradução transparente à forma do original e evita resolver silenciosamente a tensão.
- issue: Sentido de עֲבוֹתִים
  choice: folhagem densa
  alternative: nuvens
  rationale: O sentido botânico se ajusta diretamente à metáfora da árvore, mas a leitura “nuvens”, associada à altura extrema, permanece possível e é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário concreto que conserva a metáfora da árvore. A mudança de segunda para terceira pessoa foi mantida deliberadamente. O marcador [a] aparece no texto junto à expressão a que se refere.
