revisions:
- from: As águas o fizeram crescer; o abismo o elevou[a]. Seus rios corriam ao redor do lugar onde ele estava plantado, e o abismo enviava seus canais a todas as árvores do campo.
  to: As águas o fizeram crescer; o abismo o elevou[a]. Seus rios corriam ao redor de sua plantação, e o abismo enviou seus canais a todas as árvores do campo.
  rationale: A revisão substitui uma paráfrase espacial por «sua plantação», equivalente mais direto de מַטָּעָהּ, e ajusta «enviava» para «enviou» em conformidade com o perfeito שִׁלְחָה. Mantêm-se a ambiguidade metafórica, os referentes não políticos e a alternativa lexical para o segundo verbo.
