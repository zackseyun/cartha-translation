  text: מַ֣יִם גִּדְּל֔וּ/הוּ תְּה֖וֹם רֹֽמְמָ֑תְ/הוּ אֶת נַהֲרֹתֶ֗י/הָ הֹלֵךְ֙ סְבִיב֣וֹת מַטָּעָ֔/הּ וְ/אֶת תְּעָלֹתֶ֣י/הָ שִׁלְחָ֔ה אֶ֖ל כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/004.yaml
  text: Waters made it grow[a]; the deep made it rise high. Its rivers flowed all around its planting place[b], and it sent out its channels to all the trees of the field.
translation:
  language: pt
  text: As águas o fizeram crescer; o abismo o elevou[a]. Seus rios corriam ao redor de sua plantação, e o abismo enviou seus canais a todas as árvores do campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: o tornou alto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: As águas
  rationale: O plural hebraico pode funcionar como substantivo de massa, mas o plural em português preserva o tom poético e a imagem de águas abundantes.
- source_word: גִּדְּלוּהוּ
  choice: o fizeram crescer
  rationale: O causativo de גדל, com sufixo masculino singular, descreve naturalmente o crescimento do cedro na metáfora arbórea.
- source_word: תְּהוֹם
  choice: o abismo
  rationale: Designa as águas profundas ou o grande abismo aquático. «O abismo» é conciso, tradicional e adequado ao registro elevado.
- source_word: רֹמְמָתְהוּ
  choice: o elevou
  rationale: O causativo de רום comunica altura e grandeza. «Elevou» preserva essa dupla ressonância sem abandonar a imagem da árvore.
- source_word: נַהֲרֹתֶיהָ
  choice: Seus rios
  rationale: O sufixo feminino retoma תְּהוֹם, que é gramaticalmente feminino em hebraico. Em português, «seus» concorda com o correspondente masculino «abismo».
- source_word: הֹלֵךְ סְבִיבוֹת
  choice: corriam ao redor
  rationale: Embora הֹלֵךְ signifique literalmente «indo», «corriam» é idiomático para o movimento dos rios; «ao redor» reproduz o sentido circundante de סְבִיבוֹת.
- source_word: מַטָּעָהּ
  choice: o lugar onde ele estava plantado
  rationale: Expressa de modo claro a área de plantio associada à árvore, evitando o sentido moderno mais técnico de «plantação».
- source_word: תְּעָלֹתֶיהָ
  choice: seus canais
  rationale: O termo indica cursos ou canais de água, inclusive canais de irrigação. «Canais» mantém essa amplitude.
- source_word: שִׁלְחָה
  choice: o abismo enviava
  rationale: A forma verbal feminina singular tem תְּהוֹם como sujeito. Repetir «o abismo» em português elimina uma referência pronominal pouco natural sem alterar o sentido.
- source_word: אֶל כָּל עֲצֵי הַשָּׂדֶה
  choice: a todas as árvores do campo
  rationale: Tradução direta que preserva a imagem coletiva e a expressão bíblica «árvores do campo».
theological_decisions:
- issue: Referência dos pronomes na metáfora mista
  choice: Usar o pronome masculino «o/ele» para a árvore e nomear novamente «o abismo» como sujeito da última oração
  alternative: Usar formas femininas por referência genérica a «árvore», ou deixar o sujeito da última oração apenas implícito
  rationale: O sufixo masculino hebraico aponta para o cedro mencionado no contexto, substantivo também masculino em português. Já a forma verbal feminina retoma o hebraico תְּהוֹם; como seu equivalente português «abismo» é masculino, a concordância portuguesa deve seguir o gênero natural da tradução. A repetição esclarece os referentes sem identificar antecipadamente a árvore com seu correspondente político.
- issue: Amplitude de רֹמְמָתְהוּ
  choice: «o elevou», mantendo simultaneamente a imagem de altura e a conotação de grandeza
  alternative: «o tornou alto» ou «o exaltou»
  rationale: A formulação escolhida conserva a tensão entre a descrição concreta do cedro e sua função simbólica, sem reduzir o verbo a uma afirmação exclusivamente física ou política.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética moderada. A tradução mantém a metáfora arbórea e distingue cuidadosamente a árvore do abismo que a nutre.
