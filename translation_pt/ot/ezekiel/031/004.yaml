  source_fidelity: 'A tradução preserva adequadamente a imagem central: as águas e o abismo fazem o cedro crescer e elevar-se, e os cursos de água alcançam as demais árvores. Contudo, «o lugar onde ele estava plantado» explicita e reformula מַטָּעָהּ, que designa mais diretamente a plantação/área plantada. Além disso, o perfeito שִׁלְחָה é mais bem refletido por «enviou» do que pelo imperfeito «enviava».'
  naturalness: O português é claro, moderno e de registro apropriado. «Sua plantação» é uma forma natural e mais concisa para o termo hebraico, sem exigir a perífrase interpretativa «o lugar onde ele estava plantado».
  terminology: «Águas», «abismo», «rios», «canais» e «árvores do campo» correspondem bem ao vocabulário e ao tom da passagem. «O elevou» é uma opção legítima para רֹמְמָתְהוּ; a nota conserva a alternativa concreta «o tornou alto».
  issues:
