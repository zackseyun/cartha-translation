source:
  edition: WLC
  text: בִּ/סְעַפֹּתָ֤י/ו קִֽנְנוּ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/תַ֤חַת פֹּֽארֹתָי/ו֙ יָֽלְד֔וּ כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/בְ/צִלּ/וֹ֙ יֵֽשְׁב֔וּ כֹּ֖ל גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/006.yaml
  text: In its branches all the birds of the heavens nested[a], and under its boughs all the beasts of the field gave birth, and in its shade all the many nations dwelt.
translation:
  language: pt
  text: Em seus ramos, todas as aves do céu faziam ninhos; debaixo de seus ramos frondosos, todos os animais do campo davam à luz; e à sua sombra habitavam todas as numerosas nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּסְעַפֹּתָיו
  choice: em seus ramos
  rationale: סְעַפּוֹת designa as ramificações ou os grandes ramos da árvore. “Em seus ramos” é natural em português e se ajusta à imagem das aves fazendo ninhos.
- source_word: קִנְנוּ
  choice: faziam ninhos
  rationale: O verbo se refere especificamente ao ato de aves fazerem ou manterem ninhos; esta formulação preserva a imagem com clareza.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: todas as aves do céu
  rationale: עוֹף é coletivo e, neste contexto, indica aves. “Do céu” reproduz de modo idiomático a expressão hebraica.
- source_word: וְתַחַת פֹּארֹתָיו
  choice: debaixo de seus ramos frondosos
  rationale: פֹּארֹתָיו se refere aos ramos ou à ramagem frondosa. O qualificativo “frondosos” distingue o termo do anterior e realça a cobertura oferecida pela árvore.
- source_word: יָלְדוּ
  choice: davam à luz
  rationale: ילד significa dar à luz ou gerar. A expressão mantém a imagem reprodutiva explícita aplicada aos animais.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: todos os animais do campo
  rationale: A expressão hebraica designa coletivamente os animais terrestres, sobretudo os selvagens. A tradução conserva a fórmula bíblica sem recorrer ao termo potencialmente arcaizante “feras”.
- source_word: וּבְצִלּוֹ
  choice: à sua sombra
  rationale: צֵל pode indicar sombra ou lugar sombreado e, na metáfora, comunica abrigo e proteção. “À sua sombra” é corrente e preserva a figura.
- source_word: יֵשְׁבוּ
  choice: habitavam
  rationale: ישב, neste contexto, significa morar ou permanecer estabelecido. “Habitavam” mantém um registro digno e comunica residência, não simplesmente o ato de sentar-se.
- source_word: כֹּל גּוֹיִם רַבִּים
  choice: todas as numerosas nações
  rationale: A formulação conserva tanto a abrangência de כֹּל quanto a ideia de multiplicidade expressa por רַבִּים, em português compreensível.
theological_decisions:
- issue: Metáfora da árvore como abrigo imperial
  choice: Manter diretamente a imagem da árvore e das nações abrigadas à sua sombra.
  alternative: Identificar explicitamente a árvore com a Assíria ou com um império dentro do próprio versículo.
  rationale: O versículo integra uma metáfora extensa. A tradução deve preservar a imagem e deixar sua identificação ao contexto, sem inserir interpretação no texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “todos/todas” acompanha a estrutura enfática do hebraico; “ramos frondosos” permite distinguir os dois termos hebraicos relativos à ramagem sem tornar a frase técnica.
