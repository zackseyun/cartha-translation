  text: וְ/אֶ֨תְּנֵ֔/הוּ בְּ/יַ֖ד אֵ֣יל גּוֹיִ֑ם עָשׂ֤וֹ יַֽעֲשֶׂה֙ ל֔/וֹ כְּ/רִשְׁע֖/וֹ גֵּרַשְׁתִּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/011.yaml
  text: I gave him into the hand of a mighty one of the nations; he will surely deal with him[a]. According to his wickedness I drove him out.
translation:
  language: pt
  text: Eu o entreguei nas mãos de um poderoso dentre as nações[a]; ele certamente agirá contra ele. Conforme a sua maldade, eu o expulsei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um governante das nações” ou “um poderoso das nações”. A expressão hebraica pode designar um governante poderoso entre as nações.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאֶתְּנֵהוּ
  choice: Eu o entreguei
  rationale: A forma de נתן, com sujeito na primeira pessoa do singular e objeto masculino singular, é entendida no contexto como ação passada/perfectiva. “Entreguei” comunica naturalmente a transferência ao poder de outro.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Preserva a conhecida imagem hebraica de pôr alguém sob o poder ou controle de outra pessoa, em formulação natural em português.
- source_word: אֵיל גּוֹיִם
  choice: um poderoso entre as nações
  rationale: אֵיל designa aqui alguém forte ou poderoso. A formulação mantém a referência genérica e não identifica no texto o agente com um governante histórico específico.
- source_word: עָשׂוֹ יַעֲשֶׂה לוֹ
  choice: ele certamente o tratará como merece
  rationale: O infinitivo absoluto seguido do imperfeito de עשה intensifica a certeza da ação. A expressão portuguesa transmite a ênfase e, no contexto judicial, o sentido de agir contra ele.
- source_word: כְּרִשְׁעוֹ
  choice: por causa de sua maldade
  rationale: A expressão relaciona a expulsão à maldade do sujeito. Embora כ possa sugerir correspondência ou medida, esta formulação é clara e natural, sem negar a proporcionalidade implícita do juízo.
- source_word: גֵּרַשְׁתִּהוּ
  choice: Eu o expulsei
  rationale: גרש significa expulsar ou pôr para fora. “Expulsei” é direto, atual e adequado à remoção de posição e lugar descrita no contexto.
theological_decisions:
- issue: Identificação do agente chamado אֵיל גּוֹיִם
  choice: “um poderoso entre as nações”, sem identificação histórica explícita
  alternative: “o governante das nações” ou identificação direta com o rei da Babilônia
  rationale: O hebraico descreve genericamente o instrumento do juízo divino. Embora o referente histórico possa ser o rei da Babilônia, ele não é nomeado neste versículo.
- issue: Relação entre a maldade e a expulsão
  choice: A expulsão é apresentada como resposta à maldade, sem desenvolver uma doutrina específica de retribuição
  alternative: “conforme a sua maldade”, ressaltando mais explicitamente a correspondência proporcional
  rationale: A tradução conserva a relação judicial expressa pelo texto, mas evita acrescentar uma formulação teológica mais precisa do que o versículo exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nas mãos de” preserva a imagem hebraica; “um poderoso entre as nações” mantém a referência deliberadamente genérica. O marcador [a] aparece no texto principal.
