  source_fidelity: A tradução preserva bem a descida ao Sheol, a associação com os mortos à espada e a imagem da sombra. Contudo, os pronomes femininos («com ela», «sua sombra») afastam-se do referente gramatical masculino do hebraico, o cedro que figura a Assíria. Além disso, «eles, que eram o seu braço» explicita uma relação copulativa que o hebraico deixa metafórica e sintaticamente condensada.
  naturalness: O texto é claro e atual. A aposição «seu braço — os que viviam...» expressa em português, com boa legibilidade, o coletivo implícito no singular metafórico «braço» seguido de verbo plural, sem introduzir a afirmação adicional «eram».
  terminology: «Sheol» é adequadamente mantido. «Mortos à espada», «braço», «sombra» e «nações» são fiéis e apropriados ao registro profético. A nota sobre Sheol deve caracterizá-lo sem defini-lo de modo excessivamente fechado.
  issues:
