  text: גַּם הֵ֗ם אִתּ֛/וֹ יָרְד֥וּ שְׁא֖וֹלָ/ה אֶל חַלְלֵי חָ֑רֶב וּ/זְרֹע֛/וֹ יָשְׁב֥וּ בְ/צִלּ֖/וֹ בְּ/ת֥וֹךְ גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/017.yaml
  text: They too went down with it to Sheol[a], to those slain by the sword; its arm dwelt in its shade among the nations.
translation:
  language: pt
  text: Também eles desceram com ele ao Sheol[a], para junto dos que foram mortos à espada; seu braço — os que viviam à sua sombra entre as nações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sheol: termo hebraico associado ao mundo dos mortos.'
    reason: Esclarece o termo transliterado sem o reduzir à sepultura nem impor uma formulação doutrinária posterior.
  - marker: b
    text: Ou “sua força” ou “seus aliados”; literalmente, “seu braço”.
    reason: Preserva possibilidades da metáfora coletiva, indicada pelo verbo plural, sem identificar de modo definitivo o referente.
lexical_decisions:
- source_word: גַּם הֵם
  choice: Também eles
  rationale: Mantém a ênfase aditiva do hebraico e liga este grupo aos que já foram julgados.
- source_word: אִתּוֹ
  choice: com ela
  rationale: O referente contextual é a árvore que representa a Assíria; o feminino concorda naturalmente em português tanto com “árvore” quanto com “Assíria”.
- source_word: יָרְדוּ שְׁאוֹלָה
  choice: desceram ... ao Sheol
  rationale: Preserva o movimento descendente e mantém o termo hebraico para o domínio dos mortos, sem reduzi-lo a uma simples sepultura nem identificá-lo com uma formulação doutrinária posterior.
- source_word: אֶל חַלְלֵי חָרֶב
  choice: para junto dos que foram mortos à espada
  rationale: Expressa de modo natural o destino ou a associação indicada por אֶל e conserva a causa violenta da morte.
- source_word: וּזְרֹעוֹ
  choice: eles, que eram o seu braço
  rationale: Conserva a imagem literal de “braço”, entendida coletivamente à luz do verbo plural seguinte. A formulação explicita apenas a relação sintática implícita, sem decidir se o braço representa força, dependentes ou aliados.
- source_word: יָשְׁבוּ בְצִלּוֹ
  choice: viviam à sua sombra
  rationale: O plural “viviam” reflete יָשְׁבוּ e comunica a ideia de permanência e proteção dentro da metáfora da árvore.
- source_word: בְּתוֹךְ גּוֹיִם
  choice: entre as nações
  rationale: É uma forma idiomática e fiel de expressar a localização do grupo no cenário internacional de Ezequiel.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos
  rationale: A transliteração preserva a amplitude e a tensão do conceito veterotestamentário, sem o restringir ao túmulo físico nem o equiparar automaticamente ao inferno.
- issue: Identidade do “braço” da árvore/Assíria
  choice: manter a metáfora “seu braço”
  alternative: sua força; seus aliados; seus apoiadores
  rationale: O hebraico é metafórico e o plural יָשְׁבוּ sugere um referente coletivo. A tradução não seleciona silenciosamente uma única identificação histórica ou teológica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe clara. O travessão ajuda a indicar que a expressão final descreve o grupo que desceu, enquanto as notas preservam as ambiguidades de Sheol e da metáfora do braço.
