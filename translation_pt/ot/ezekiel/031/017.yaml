    issue: Pronomes femininos para o cedro
    rationale: O hebraico emprega sufixos masculinos em «com ele», «seu braço» e «sua sombra», em consonância com o cedro (אָרֶז), imagem dominante no contexto. Em português, «ele» mantém essa referência literária mais diretamente.
  - severity: medium
    issue: «eles, que eram o seu braço» acrescenta uma cópula explicativa
    rationale: A expressão hebraica mantém «seu braço» como metáfora coletiva seguida de verbo plural; não declara expressamente que os descendentes «eram» esse braço. Uma aposição preserva a ambiguidade metafórica com menor acréscimo interpretativo.
