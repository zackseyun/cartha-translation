source:
  edition: WLC
  text: וַ/יִּכְרְתֻ֧/הוּ זָרִ֛ים עָרִיצֵ֥י גוֹיִ֖ם וַֽ/יִּטְּשֻׁ֑/הוּ אֶל הֶ֠/הָרִים וּ/בְ/כָל גֵּ֨אָי֜וֹת נָפְל֣וּ דָלִיּוֹתָ֗י/ו וַ/תִּשָּׁבַ֤רְנָה פֹֽארֹתָי/ו֙ בְּ/כֹל֙ אֲפִיקֵ֣י הָ/אָ֔רֶץ וַ/יֵּרְד֧וּ מִ/צִּלּ֛/וֹ כָּל עַמֵּ֥י הָ/אָ֖רֶץ וַֽ/יִּטְּשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/012.yaml
  text: Foreigners[a], the ruthless of the nations, cut it down and left it. Its branches fell on the mountains and in every valley, and its boughs were broken in all the channels of the land[c][b]. Then all the peoples of the earth went down from its shade and left it.
translation:
  language: pt
  text: Estrangeiros, os violentos das nações, derrubaram-na e a abandonaram.[a] Seus ramos caíram sobre os montes e em todos os vales; seus galhos se quebraram em todos os cursos de água da terra.[b] Então todos os povos da terra desceram de debaixo da sua sombra e a abandonaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a deixaram”. O mesmo verbo hebraico reaparece no fim do versículo.'
    reason: lexical_alternative
  - marker: b
    text: “Cursos de água da terra” também pode ser traduzido por “leitos de rios da terra” ou “ravinas da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתֻהוּ
  choice: cortaram-na
  rationale: No contexto da metáfora arbórea, כרת descreve naturalmente o corte ou a derrubada da árvore. O pronome feminino acompanha “árvore” subentendida em português e mantém em primeiro plano a imagem do cedro.
- source_word: זָרִים
  choice: Estrangeiros
  rationale: זָרִים designa pessoas de fora ou estrangeiros; “estrangeiros” é claro e natural no contexto militar e internacional.
- source_word: עָרִיצֵי גוֹיִם
  choice: os violentos entre as nações
  rationale: עָרִיץ pode designar alguém violento, cruel ou tirânico. “Os violentos entre as nações” preserva a força da expressão sem introduzir um superlativo ausente no hebraico.
- source_word: וַיִּטְּשֻׁהוּ
  choice: a abandonaram
  rationale: נטש significa deixar ou abandonar. “Abandonaram” comunica com clareza a rejeição após o corte e permite reproduzir o verbo na conclusão do versículo.
- source_word: אֶל הֶהָרִים
  choice: sobre os montes
  rationale: Embora אֶל costume indicar direção, com נפל exprime aqui o lugar sobre o qual os ramos caíram.
- source_word: גֵּאָיוֹת
  choice: vales
  rationale: O termo denota vales, depressões ou desfiladeiros; “vales” é abrangente, claro e adequado ao paralelismo topográfico.
- source_word: דָלִיּוֹתָיו
  choice: ramos
  rationale: Refere-se a ramos ou ramagens pendentes. “Ramos” é a opção comum e legível.
- source_word: פֹארֹתָיו
  choice: galhos
  rationale: Designa galhos ou ramos frondosos. “Galhos” mantém alguma distinção lexical em relação a דָלִיּוֹתָיו, traduzido como “ramos”.
- source_word: אֲפִיקֵי הָאָרֶץ
  choice: cursos de água da terra
  rationale: אֲפִיקִים pode indicar canais, leitos de corrente ou cursos de água. A expressão escolhida comunica naturalmente a feição topográfica, sem excluir a possibilidade de leitos ou ravinas.
- source_word: וַיֵּרְדוּ מִצִּלּוֹ
  choice: saíram de debaixo da sua sombra
  rationale: A tradução estritamente espacial “desceram da sua sombra” seria pouco natural em português. “Saíram de debaixo da sua sombra” preserva a imagem de povos que deixam a proteção da árvore caída.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: todos os povos da terra
  rationale: עַמִּים significa “povos”; neste oráculo de alcance internacional, “da terra” comunica melhor a amplitude do que uma referência apenas local.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares na metáfora da árvore
  choice: Usar pronomes femininos referidos à árvore subentendida, mantendo em primeiro plano a imagem do cedro.
  alternative: Usar pronomes masculinos para destacar diretamente o governante ou a Assíria representados pela árvore.
  rationale: O versículo continua a metáfora extensa do cedro. Como “árvore” é feminina em português, “cortaram-na” e “a abandonaram” reproduzem naturalmente a imagem imediata, enquanto o contexto do capítulo identifica o referente político.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora arbórea, evita um superlativo não explícito em עָרִיצֵי גוֹיִם e traduz idiomaticamente o movimento dos povos para fora da sombra.
