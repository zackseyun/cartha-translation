  naturalness: O texto é em geral claro e digno. “Se eleve por sua altura” soa pouco idiomático em português; “se elevem em sua altura” conserva melhor a repetição enfática do hebraico e é mais natural. “Terra inferior” é mais corrente e solene que “terra de baixo”, sem perder a imagem espacial.
  terminology: “Copa”, “nuvens”, “morte”, “filhos do homem” e “cova” são escolhas adequadas. “As que bebem água” mantém de modo transparente a personificação/metáfora do hebraico. A ambiguidade da oração difícil deve permanecer assinalada sem acrescentar “outras” ao texto.
