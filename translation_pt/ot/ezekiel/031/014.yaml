source:
  edition: WLC
  text: לְמַ֡עַן אֲשֶׁר֩ לֹא יִגְבְּה֨וּ בְ/קוֹמָתָ֜/ם כָּל עֲצֵי מַ֗יִם וְ/לֹֽא יִתְּנ֤וּ אֶת צַמַּרְתָּ/ם֙ אֶל בֵּ֣ין עֲבֹתִ֔ים וְ/לֹֽא יַעַמְד֧וּ אֵלֵי/הֶ֛ם בְּ/גָבְהָ֖/ם כָּל שֹׁ֣תֵי מָ֑יִם כִּֽי כֻלָּ/ם֩ נִתְּנ֨וּ לַ/מָּ֜וֶת אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֛וֹךְ בְּנֵ֥י אָדָ֖ם אֶל י֥וֹרְדֵי בֽוֹר־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/014.yaml
  text: so that all the trees by the waters may not grow tall in their height[a], and may not set their treetop among the clouds, and that none of the water-drinkers may stand over them in their height; for all of them are given over to death, to the land below, among the sons of man[b], with those who go down to the pit.
translation:
  language: pt
  text: para que nenhuma árvore junto às águas se eleve em sua altura, nem coloque sua copa entre as nuvens[a], e para que nenhuma das que bebem água se mantenha elevada sobre elas, em sua altura[b]. Pois todas foram entregues à morte, à terra inferior, entre os filhos do homem, junto com os que descem à cova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no meio dos ramos densos” ou “entre a folhagem espessa”. O hebraico עֲבֹתִים também pode designar vegetação densa, em vez de nuvens.
    reason: lexical_alternative
  - marker: b
    text: O hebraico desta oração é difícil. Também pode ser entendido como “e que nenhuma das que bebem água permaneça ao lado delas em sua altura”; o sentido geral parece advertir as árvores bem irrigadas contra se exaltarem ao lado delas ou acima delas.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: para que
  rationale: Introduz finalidade ou resultado; “para que” conserva essa força de modo natural em português.
- source_word: יִגְבְּהוּ בְקוֹמָתָם
  choice: se eleve por sua altura
  rationale: גבהּ expressa tornar-se alto ou exaltado. A formulação mantém tanto a imagem da árvore elevada quanto a conotação de altivez.
- source_word: כָּל עֲצֵי מַיִם
  choice: nenhuma árvore junto às águas
  rationale: A construção é literalmente “todas as árvores de água(s)”. Com a negação, “nenhuma” é mais clara em português, e “junto às águas” preserva a imagem de árvores abundantemente irrigadas.
- source_word: יִתְּנוּ אֶת צַמַּרְתָּם
  choice: coloque sua copa
  rationale: צַמֶּרֶת designa a parte mais alta ou copa da árvore. “Coloque” mantém de perto o verbo נתן sem perder a naturalidade.
- source_word: אֶל בֵּין עֲבֹתִים
  choice: entre as nuvens
  rationale: עֲבֹתִים pode indicar nuvens ou vegetação densa. “Entre as nuvens” combina com a imagem de altura extrema, enquanto a alternativa é preservada em nota.
- source_word: וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם כָּל שֹׁתֵי מָיִם
  choice: e para que nenhuma das que bebem água se erga acima das outras por sua altura
  rationale: A sintaxe hebraica é difícil. A tradução comunica a provável advertência contra outras árvores bem irrigadas se exaltarem acima das demais, sem ocultar em nota a possibilidade de outra relação sintática.
- source_word: שֹׁתֵי מָיִם
  choice: as que bebem água
  rationale: Mantém a metáfora hebraica de árvores como “bebedoras de água” em português mais natural, sem decidir prematuramente se representam árvores, governantes ou nações.
- source_word: כִּי כֻלָּם נִתְּנוּ לַמָּוֶת
  choice: Pois todas foram entregues à morte
  rationale: O nifal de נתן indica serem entregues ou destinadas; a expressão preserva o tom solene e a voz passiva.
- source_word: אֶל אֶרֶץ תַּחְתִּית
  choice: à terra de baixo
  rationale: Tradução próxima de “terra inferior/de baixo”, preservando a imagem de descida sem impor uma concepção técnica do além.
- source_word: בְּתוֹךְ בְּנֵי אָדָם
  choice: no meio dos filhos do homem
  rationale: Conserva a forma antropológica hebraica e o contraste entre a altivez das árvores-nações e a mortalidade humana; a expressão é representativa da humanidade.
- source_word: יֹרְדֵי בוֹר
  choice: os que descem à cova
  rationale: בּוֹר é “cova/poço” e pode evocar sepultura ou mundo dos mortos. “Cova” preserva a imagem de descida sem reduzi-la a uma formulação doutrinária.
theological_decisions:
- issue: Sentido antropológico de בְּנֵי אָדָם
  choice: no meio dos filhos do homem
  alternative: no meio da humanidade; entre os mortais
  rationale: A forma mais próxima preserva o contraste literário com as árvores elevadas e enfatiza a condição mortal comum, sem limitar a referência ao sexo masculino.
- issue: Imagem da terra inferior e da cova
  choice: à terra de baixo... com os que descem à cova
  alternative: ao mundo dos mortos... com os que descem à sepultura
  rationale: A tradução mantém a linguagem espacial e poética do hebraico, evitando converter a imagem em uma definição teológica mais específica do estado dos mortos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora arbórea foi mantida, inclusive em “as que bebem água”. Evitaram-se termos técnicos para o além, e as duas ambiguidades principais do hebraico foram explicitadas em notas.
