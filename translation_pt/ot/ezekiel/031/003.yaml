base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/003.yaml
  text: Behold[a], Assyria was a cedar in Lebanon, beautiful in branches and a forest giving shade, and lofty in height[b]; its top was among the clouds.
translation:
  language: pt
  text: Eis que a Assíria era um cedro no Líbano[a], de belos ramos e de frondosa folhagem, que dava sombra, e de grande altura; sua copa estava entre as nuvens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um cedro do Líbano».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «entre os galhos espessos»; ou: «entre a folhagem densa».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força dêitica e a vivacidade da introdução profética em linguagem elevada, mas ainda compreensível.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: Emprega o nome português usual para a potência imperial retratada pela metáfora.
- source_word: אֶרֶז בַּלְּבָנוֹן
  choice: um cedro no Líbano
  rationale: Traduz diretamente a preposição como localização; a leitura idiomática «cedro do Líbano» é preservada em nota.
- source_word: יְפֵה עָנָף
  choice: de belos ramos
  rationale: Expressa naturalmente em português o singular coletivo hebraico e descreve a beleza da ramagem.
- source_word: וְחֹרֶשׁ מֵצַל
  choice: uma mata que dava sombra
  rationale: Mantém a imagem densa e exuberante de חֹרֶשׁ e o valor de provisão de sombra em מֵצַל, sem reduzi-los a uma única ramagem.
- source_word: וּגְבַהּ קוֹמָה
  choice: e de grande altura
  rationale: Reproduz de modo claro e digno a ideia de estatura elevada e imponente.
- source_word: וּבֵין עֲבֹתִים
  choice: entre as nuvens
  rationale: No clímax da descrição da altura, entende עֲבֹתִים como massas de nuvens; as leituras arbóreas igualmente possíveis são registradas em nota.
- source_word: צַמַּרְתּוֹ
  choice: sua copa
  rationale: Designa naturalmente a parte mais alta da árvore e conserva a imagem arbórea.
