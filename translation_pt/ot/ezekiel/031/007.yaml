base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/007.yaml
  text: So it was beautiful in its greatness[a], in the length of its branches, because its root was by abundant waters.
translation:
  language: pt
  text: Assim, ela era bela em sua grandeza e no comprimento de seus ramos, pois sua raiz estava junto a águas abundantes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «muitas águas».'
    reason: Alternativa lexical para o hebraico מַיִם רַבִּים.
lexical_decisions:
- source_word: וַיְּיִף
  choice: ela era bela
  rationale: O qal wayyiqtol de יפה descreve a beleza da árvore. O feminino retoma naturalmente a árvore implícita no contexto, e a formulação apresenta seu estado sem exigir a leitura aspectual «tornou-se bela».
- source_word: בְּגָדְלוֹ
  choice: em sua grandeza
  rationale: גדל expressa grandeza ou magnitude; a construção preserva o tom elevado e o valor descritivo da preposição ב.
- source_word: בְּאֹרֶךְ דָּלִיּוֹתָיו
  choice: pelo comprimento de seus ramos
  rationale: אֹרֶךְ indica comprimento, e דָּלִיּוֹתָיו designa os ramos ou galhos extensos. «Ramos» é atual e digno; «pelo» torna natural em português a relação entre a beleza e o comprimento, sem alterar a imagem.
- source_word: כִּי
  choice: pois
  rationale: Introduz a causa da beleza e do crescimento da árvore. «Pois» mantém com naturalidade o nexo explicativo-causal.
- source_word: הָיָה שָׁרְשׁוֹ אֶל
  choice: sua raiz estava junto a
  rationale: A expressão é literalmente «sua raiz estava para/em direção a». No contexto, «junto a» comunica proximidade e acesso à água sem acrescentar a ideia explícita de que a raiz se estendia até ela.
- source_word: מַיִם רַבִּים
  choice: águas abundantes
  rationale: A expressão pode ser literalmente «muitas águas», mas aqui descreve uma fonte hídrica copiosa. «Águas abundantes» transmite isso de modo idiomático e preserva o plural hebraico.
