  - severity: medium
    issue: Nota lexical imprecisa sobre בְּשַׁלְּחוֹ
    rationale: A nota deve preservar que o hebraico traz literalmente a ideia de ‘enviar/lançar’ sem objeto expresso. “Estender” pode comunicar o sentido contextual, mas não deve ser apresentado como equivalente literal do verbo.
