base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/005.yaml
  text: Therefore its height rose above all the trees of the field[a], and its boughs multiplied, and its branches grew long because of abundant waters as it spread out.
translation:
  language: pt
  text: Por isso, sua altura se elevou acima de todas as árvores do campo; seus ramos se multiplicaram, e seus galhos se alongaram por causa das águas abundantes, quando se estendia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando lançava seus brotos” ou “quando lançava seus ramos”. O hebraico diz literalmente “em seu lançar/enviar”, mas deixa implícito o objeto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהָא קֹמָתוֹ
  choice: sua altura se elevou
  rationale: Reproduz o crescimento vertical expresso por גבה e o sentido arbóreo de קומה, em português natural.
- source_word: מִכֹּל עֲצֵי הַשָּׂדֶה
  choice: acima de todas as árvores do campo
  rationale: Expressa o valor comparativo de מן e mantém a imagem profética tradicional e transparente de “árvores do campo”.
- source_word: סַרְעַפֹּתָיו
  choice: seus grandes ramos
  rationale: O termo designa a ramificação mais robusta da árvore; “grandes ramos” permite distingui-lo do termo seguinte sem recorrer a vocabulário raro.
- source_word: וַתִּרְבֶּינָה
  choice: se multiplicaram
  rationale: Conserva a ideia de aumento numérico expressa por רבה.
- source_word: פארתו
  choice: seus galhos
  rationale: Designa ramos ou brotos da árvore; “galhos” é claro e diferencia o termo de סַרְעַפֹּתָיו.
- source_word: וַתֶּאֱרַכְנָה
  choice: se alongaram
  rationale: Traduz diretamente a ideia de tornar-se longo e soa natural com “galhos”.
- source_word: מִמַּיִם רַבִּים
  choice: por causa das águas abundantes
  rationale: Torna explícito, de modo natural, o valor causal da preposição מן, preservando a imagem de uma grande provisão de água.
- source_word: בְּשַׁלְּחוֹ
  choice: à medida que se espalhava
  rationale: Comunica a expansão da árvore sem fornecer no texto principal o objeto que o hebraico deixa implícito; a alternativa mais literal consta na nota.
