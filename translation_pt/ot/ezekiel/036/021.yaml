  text: וָ/אֶחְמֹ֖ל עַל שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֤ר חִלְּל֨וּ/הוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אוּ שָֽׁמָּ/ה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/021.yaml
  text: But I had pity for my holy name[a], which the house of Israel had profaned among the nations where they had gone.
translation:
  language: pt
  text: Mas tive consideração pelo meu santo nome[a], que a casa de Israel profanou entre as nações para onde tinham ido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poupei o meu santo nome” ou “tive compaixão do meu santo nome”. O verbo hebraico pode indicar poupar ou ter compaixão; aqui, expressa a consideração do SENHOR pela honra de seu santo nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחְמֹל
  choice: tive consideração
  rationale: O verbo חמל pode expressar poupar, ter compaixão ou mostrar consideração. Como o objeto aqui é o santo nome de Deus, “tive consideração” comunica de modo natural sua preocupação zelosa pela santidade e honra desse nome, sem transformar Israel no objeto da compaixão.
- source_word: עַל
  choice: por
  rationale: Com חמל, a preposição עַל introduz o objeto da consideração ou compaixão; “consideração por” é idiomático em português.
- source_word: שֵׁם קָדְשִׁי
  choice: meu santo nome
  rationale: Preserva de perto a expressão hebraica e sua referência à identidade revelada e à reputação de Deus.
- source_word: אֲשֶׁר חִלְּלוּהוּ
  choice: que ... profanou
  rationale: No piel, חלל significa tratar como comum aquilo que é santo. “Profanou” mantém o contraste central entre santidade e profanação em Ezequiel. O singular coletivo concorda naturalmente com “a casa de Israel”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a designação profética recorrente e é clara em português bíblico moderno.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Refere-se aos povos estrangeiros entre os quais Israel se encontrava; “entre as nações” é natural e contextualmente preciso.
- source_word: אֲשֶׁר בָּאוּ שָׁמָּה
  choice: para onde foi
  rationale: Embora a construção seja literalmente “às quais veio ali”, o movimento do exílio é expresso com naturalidade em português por “para onde foi”. O singular retoma o coletivo “casa de Israel”.
theological_decisions:
- issue: A relação de Deus com “meu santo nome” em וָאֶחְמֹל
  choice: Deus demonstra consideração zelosa pela santidade e honra de seu nome.
  alternative: Deus poupou seu santo nome; Deus teve compaixão de seu santo nome; Deus agiu por compaixão em favor de seu santo nome.
  rationale: O objeto gramatical imediato de חמל é “meu santo nome”, e o contexto de Ezequiel 36:20–23 enfatiza a vindicação desse nome entre as nações. A tradução mantém esse foco sem fazer de Israel o objeto implícito da compaixão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa de Israel” e “profanou” preservam o registro profético e o vocabulário de santidade; “teve consideração por” evita a estranheza de atribuir literalmente pena ou compaixão a um nome, sem ocultar as alternativas hebraicas, registradas em nota.
