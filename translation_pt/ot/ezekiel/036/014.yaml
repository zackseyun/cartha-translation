  yaml_path: translation/ot/ezekiel/036/014.yaml
  text: Therefore you will no longer devour people[a], and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: pt
  text: Por isso, você não devorará mais pessoas nem fará sua nação tropeçar mais[a] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra vocalização ou tradição textual: “não deixará mais sua nação sem filhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão ligada ao contexto anterior.
- source_word: אָדָם
  choice: pessoas
  rationale: O substantivo tem sentido coletivo aqui, referindo-se aos habitantes que a terra personificada supostamente devorava.
- source_word: תֹאכְלִי
  choice: devorará
  rationale: Preserva a metáfora hebraica de a terra consumir seus habitantes, com naturalidade em português.
- source_word: עוֹד
  choice: mais / novamente
  rationale: Com a negação, indica que a situação não voltará a ocorrer; a variação evita rigidez sem alterar o sentido.
- source_word: וְגוֹיִךְ
  choice: sua nação
  rationale: Mantém o substantivo no singular e o sufixo feminino singular dirigido à terra personificada.
- source_word: תכשלי
  choice: fará sua nação tropeçar
  rationale: Segue o texto consonantal e a leitura massorética relacionada à raiz כשל, preservando a imagem de tropeço ou queda.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Traduz a fórmula profética com linguagem corrente e conserva tanto o título אֲדֹנָי como o nome divino יהוה.
theological_decisions:
- issue: Tradução do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: Conserva a distinção entre o título Adonai e o nome próprio divino, sem fundi-los ou ocultar o tetragrama.
- issue: Leitura do verbo תכשלי
  choice: fará sua nação tropeçar
  alternative: deixará sua nação sem filhos
  rationale: A tradução principal segue a vocalização massorética e a raiz כשל. A leitura alternativa, refletida por outra tradição textual ou vocalização e apoiada pelo contexto, é registrada em nota sem resolver indevidamente a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento direto da terra personificada no feminino implícito. A metáfora de devorar e a ambiguidade textual da segunda oração foram preservadas.
