source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/כֶם֙ לֵ֣ב חָדָ֔שׁ וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י אֶת לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשַׂרְ/כֶ֔ם וְ/נָתַתִּ֥י לָ/כֶ֖ם לֵ֥ב בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/026.yaml
  text: And I will give you a new heart[a], and I will put a new spirit within you; and I will remove the heart of stone from your flesh and give you a heart of flesh.
translation:
  language: pt
  text: Eu lhes darei um coração novo e porei dentro de vocês um espírito novo[a]. Tirarei da carne de vocês o coração de pedra e lhes darei um coração de carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito renovado”. Alguns entendem que “espírito” aqui antecipa a dádiva do Espírito de Deus mencionada no versículo seguinte.
    reason: Leitura alternativa e ambiguidade teológica.
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: É o equivalente tradicional e transparente no contexto da antropologia hebraica, abrangendo vontade, pensamento e disposição sem reduzir o sentido a “mente”.
- source_word: חָדָשׁ / חֲדָשָׁה
  choice: novo / nova
  rationale: Traduz diretamente o adjetivo hebraico e preserva a imagem de uma dádiva divina nova, sem introduzir a nuance interpretativa de “renovado”.
- source_word: רוּחַ
  choice: espírito
  rationale: No paralelismo com “coração novo”, refere-se naturalmente à dimensão ou disposição interior; “vento” e “sopro” não se ajustam ao contexto.
- source_word: בְּקִרְבְּכֶם
  choice: dentro de vocês
  rationale: Expressa com clareza a interioridade indicada pelo contexto de transformação do coração e do espírito, mantendo o plural coletivo do hebraico.
- source_word: וַהֲסִרֹתִי
  choice: tirarei
  rationale: Forma natural e atual em português para a ação de remover algo, adequada à imagem de substituição.
- source_word: לֵב הָאֶבֶן
  choice: o coração de pedra
  rationale: Preserva de modo direto a construção e a metáfora hebraicas.
- source_word: מִבְּשַׂרְכֶם
  choice: da carne de vocês
  rationale: Mantém o termo concreto “carne” e a imagem corporal do original, sem suavizá-lo para “corpo”.
- source_word: לֵב בָּשָׂר
  choice: um coração de carne
  rationale: Conserva o contraste deliberado com “coração de pedra”, evitando explicar a metáfora como “coração sensível”.
- source_word: וְנָתַתִּי ... אֶתֵּן ... וְנָתַתִּי
  choice: darei ... porei ... darei
  rationale: Mantém “dar” na primeira e na última ocorrência e usa “pôr” na oração central, combinação idiomática em português com “dentro de vocês”.
theological_decisions:
- issue: Sentido de “espírito novo”
  choice: um novo espírito ou disposição interior humana concedida por Deus
  alternative: o Espírito Santo
  rationale: O paralelismo imediato com “coração novo” favorece a dimensão interior humana, enquanto o versículo seguinte especifica “o meu Espírito”. A tradução usa “espírito” em minúscula, e a nota preserva a possível ligação com a dádiva do Espírito de Deus sem identificar silenciosamente as expressões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito que os sufixos hebraicos se dirigem coletivamente ao povo. A repetição de “coração” e o contraste concreto entre pedra e carne foram preservados.
