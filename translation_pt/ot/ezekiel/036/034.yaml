  text: And the desolate land will be cultivated instead of being a desolation in the sight of all who pass by[a].
translation:
  language: pt
  text: E a terra devastada será cultivada, em vez de ser uma desolação diante dos olhos de todos os que passam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A terra devastada será trabalhada, enquanto antes era uma desolação diante dos olhos de todos os que passavam.”'
    reason: Alternativa lexical para תֵּעָבֵד (“será trabalhada”) e alternativa sintática que explicita o contraste entre o cultivo futuro e a condição passada da terra.
lexical_decisions:
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da restauração em Ezequiel, refere-se ao território de Israel, não ao planeta inteiro.
- source_word: הַנְּשַׁמָּה
  choice: devastada
  rationale: O particípio passivo qualifica a terra e indica seu estado de ruína; “devastada” é natural e mantém o contraste com o futuro cultivo.
- source_word: תֵּעָבֵד
  choice: será cultivada
  rationale: O nifal de עבד é passivo e, aplicado à terra, expressa trabalho agrícola.
- source_word: תַּחַת אֲשֶׁר
  choice: em vez de continuar
  rationale: A construção estabelece contraste entre a restauração futura e a condição anterior; “continuar” torna natural em português a oposição contextual sem alterar seu sentido.
- source_word: הָיְתָה שְׁמָמָה
  choice: desolada
  rationale: Embora שְׁמָמָה seja substantivo no hebraico, o predicativo adjetival é mais idiomático em português e conserva a ideia de desolação.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Preserva a imagem concreta do hebraico e comunica que a desolação era publicamente visível.
- source_word: כָּל עוֹבֵר
  choice: todos os que passam por ela
  rationale: O particípio singular com כָּל tem sentido coletivo e genérico; o complemento “por ela” explicita naturalmente em português o referente espacial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição conceitual entre “devastada” e “desolada” reflete o contraste e o vocabulário do hebraico sem soar excessivamente rígida.
