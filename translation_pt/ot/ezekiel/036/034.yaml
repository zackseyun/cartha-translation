    issue: “continuar” não corresponde ao contraste temporal e sintático de תַּחַת אֲשֶׁר הָיְתָה שְׁמָמָה.
    rationale: A formulação sugere que a terra estaria em processo contínuo de permanecer desolada. O hebraico contrasta o cultivo vindouro com sua condição anterior de “desolação”, sem afirmar essa continuidade.
  - severity: low
    issue: “por ela” explicita um complemento ausente de כָּל עוֹבֵר.
    rationale: Embora seja inferência contextual plausível, “todos os que passam” preserva a concisão e a generalidade do particípio hebraico.
  revised_text: E a terra devastada será cultivada, em vez de ser uma desolação diante dos olhos de todos os que passam.[a]
