  revision_rationale: A revisão elimina a ideia não expressa de continuidade e restitui o contraste entre a futura terra cultivada e sua anterior condição de desolação. Também conserva o substantivo “desolação”, correspondente a שְׁמָמָה, e evita acrescentar um complemento espacial ao particípio “os que passam”.
