base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/032.yaml
  text: It is not for your sake that I am acting[a], declares the Lord GOD; let it be known to you. Be ashamed and humiliated because of your ways, O house of Israel.
translation:
  language: pt
  text: Não é em favor de vocês que estou agindo — declara o Senhor Yahweh. Que isso fique claro para vocês.[a] Envergonhem-se e sintam-se humilhados por causa dos seus caminhos, ó casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Que isso lhes seja conhecido”.'
    reason: A forma verbal hebraica é passiva e pode ter força jussiva; a nota preserva essa estrutura como alternativa à formulação idiomática do texto.
lexical_decisions:
- source_word: לְמַעַנְכֶם
  choice: por causa de vocês
  rationale: 'Expressa aqui consideração, interesse ou benefício: a ação divina não ocorre por mérito nem em favor de Israel. A formulação é natural em português e preserva a força da negação.'
- source_word: עֹשֶׂה
  choice: estou agindo
  rationale: O particípio de עשה descreve a atuação divina apresentada no contexto. “Estou agindo” comunica melhor essa intervenção do que o genérico “estou fazendo”.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética autorizada. “Senhor Yahweh” distingue o título אֲדֹנָי do nome divino יהוה sem produzir a construção pouco natural “Senhor SENHOR”.
- source_word: יִוָּדַע לָכֶם
  choice: Saibam disso
  rationale: O nifal pode ser representado mais formalmente por “seja isso conhecido por vocês”; o imperativo idiomático “Saibam disso” preserva a exigência de que Israel reconheça o motivo declarado por Deus.
- source_word: בֹּשׁוּ וְהִכָּלְמוּ
  choice: Envergonhem-se e sintam-se humilhados
  rationale: Mantém os dois imperativos e diferencia a vergonha moral (בוש) da desonra ou humilhação intensificadora (כלם).
- source_word: מִדַּרְכֵיכֶם
  choice: por causa dos seus caminhos
  rationale: Com verbos de vergonha, מן indica a causa ou ocasião. “Caminhos” conserva a metáfora hebraica para a conduta habitual.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: A partícula vocativa “ó” deixa clara a interpelação solene dirigida coletivamente a Israel.
theological_decisions:
- issue: Motivação da restauração divina
  choice: Não é por causa de vocês
  alternative: Não é para o benefício de vocês
  rationale: A tradução mantém a negação enfática de que a ação de Deus seja motivada por Israel, sem explicar no próprio versículo qual é a motivação positiva, apresentada no contexto.
- issue: Representação de אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome próprio divino יהוה e evita fundi-los em um único título genérico.
- issue: Força de יִוָּדַע לָכֶם
  choice: Saibam disso
  alternative: Seja isso conhecido por vocês
  rationale: A forma hebraica é passiva e admite uma nuance jussiva. A opção principal transmite naturalmente a exortação, enquanto a nota registra a forma mais literal sem decidir além da evidência.
translation_notes:
  register: Português moderno, solene e acessível, com pronomes de ampla legibilidade brasileira. A metáfora “caminhos” e o vocativo profético “ó casa de Israel” foram preservados. O paralelismo enfático dos dois verbos de vergonha foi mantido sem arcaísmos.
