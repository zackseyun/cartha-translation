id: EZK.36.23
reference: Ezekiel 36:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֞י אֶת שְׁמִ֣/י הַ/גָּד֗וֹל הַֽ/מְחֻלָּל֙ בַּ/גּוֹיִ֔ם אֲשֶׁ֥ר חִלַּלְתֶּ֖ם בְּ/תוֹכָ֑/ם וְ/יָדְע֨וּ הַ/גּוֹיִ֜ם כִּי אֲנִ֣י יְהוָ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/הִקָּדְשִׁ֥/י בָ/כֶ֖ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/023.yaml
  text: I will sanctify my great name[a], which has been profaned among the nations, which you have profaned among them. Then the nations will know that I am Yahweh, declares the Lord GOD[b], when I show myself holy through you before their eyes.
translation:
  language: pt
  text: Santificarei o meu grande nome[a], profanado entre as nações, o qual vocês profanaram no meio delas. Então as nações saberão que eu sou Yahweh — declara o Senhor Yahweh — quando eu me mostrar santo por meio de vocês[b], à vista delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Demonstrarei a santidade do meu grande nome”.'
    reason: Esclarece o sentido declarativo e público de “santificarei” sem substituir a forma mais direta do hebraico no texto.
  - marker: b
    text: 'Mais literalmente: “quando eu for santificado em vocês, à vista delas”.'
    reason: Preserva a construção nifal e a possível nuance local de בָכֶם, enquanto o texto principal expressa seu sentido contextual e instrumental.
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: Santificarei
  rationale: Preserva diretamente o piel de קדשׁ e sua relação lexical com a manifestação pública da santidade no fim do versículo; no contexto, significa afirmar e demonstrar como santo, não tornar santo algo antes não santo.
- source_word: שְׁמִי הַגָּדוֹל
  choice: o meu grande nome
  rationale: Reproduz naturalmente em português o substantivo com adjetivo e mantém as ideias de majestade e reputação ligadas ao nome divino.
- source_word: הַמְחֻלָּל
  choice: profanado
  rationale: O particípio pual descreve o nome divino tratado como comum ou desonrado; “profanado” é preciso e corrente no registro bíblico.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui os povos circundantes; “nações” evita importar a distinção posterior entre judeus e gentios.
- source_word: אֲשֶׁר חִלַּלְתֶּם בְּתוֹכָם
  choice: o qual vocês profanaram no meio delas
  rationale: O relativo retoma “nome”, e בְּתוֹכָם indica que a profanação ocorreu no meio das nações. “Vocês” comunica claramente o plural hebraico.
- source_word: וְיָדְעוּ
  choice: Então ... saberão
  rationale: A conjunção introduz o resultado da ação divina; “então” torna essa progressão natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם é uma fórmula profética de pronunciamento. A expressão conserva tanto o título אֲדֹנָי como o nome יְהוָה sem recorrer à convenção tipográfica inglesa “GOD”.
- source_word: בְּהִקָּדְשִׁי בָכֶם
  choice: quando eu me mostrar santo por meio de vocês
  rationale: O infinitivo nifal pode exprimir a manifestação pública da santidade divina. “Por meio de vocês” comunica o valor contextual de בָכֶם, isto é, por aquilo que Deus fará em relação a Israel, sem apagar a leitura mais formal registrada em nota.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos delas
  rationale: 'Mantém a imagem hebraica de uma demonstração pública e visível, com referente feminino plural natural em português: as nações.'
theological_decisions:
- issue: Sentido de קדשׁ aplicado ao nome de Deus
  choice: Santificarei o meu grande nome
  alternative: Demonstrarei a santidade do meu grande nome
  rationale: A tradução formal preserva o verbo hebraico e a tensão do texto. No contexto, não indica que ao nome de Deus falte santidade, mas que Deus fará sua santidade ser publicamente reconhecida após a profanação.
- issue: Valor de ב em בְּהִקָּדְשִׁי בָכֶם
  choice: quando eu me mostrar santo por meio de vocês
  alternative: quando eu for santificado em vocês
  rationale: O hebraico admite formulação mais local e passiva, mas o contexto aponta para Deus manifestando sua santidade às nações mediante o que fará com Israel. A alternativa formal é preservada em nota para não eliminar a ambiguidade.
- issue: Forma portuguesa de אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano Yahweh
  rationale: “Senhor Yahweh” distingue o título do nome pessoal e representa ambos os elementos hebraicos sem depender da convenção de versaletes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se “santificarei” e “profanado” por sua precisão bíblica, enquanto a sintaxe é simplificada. O nome divino é transliterado como “Yahweh”; “vocês” explicita naturalmente a segunda pessoa plural.
