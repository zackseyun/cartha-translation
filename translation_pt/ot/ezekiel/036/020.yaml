source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל הַ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וַֽ/יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י בֶּ/אֱמֹ֤ר לָ/הֶם֙ עַם יְהוָ֣ה אֵ֔לֶּה וּ/מֵ/אַרְצ֖/וֹ יָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/020.yaml
  text: And when they came to the nations where they went[a], they profaned my holy name, in that people said of them, ‘These are the people of Yahweh[b], and yet they had to go out of his land.’
translation:
  language: pt
  text: 'Quando chegaram às nações para onde foram, profanaram o meu santo nome, pois ali se dizia a respeito deles: “Estes são o povo de Yahweh, mas tiveram de sair da terra dele”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e saíram da terra dele”. O hebraico indica a desonra do exílio, mas não declara explicitamente quem os fez sair.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא אֶל־הַגּוֹיִם אֲשֶׁר־בָּאוּ שָׁם
  choice: Quando chegaram às nações para onde foram
  rationale: O verbo inicial está formalmente no singular, mas o contexto prossegue no plural e tem Israel como sujeito coletivo. O plural produz português natural sem apagar a construção coletiva hebraica.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos estrangeiros entre os quais Israel foi disperso; evita a conotação religiosa posterior de “gentios”.
- source_word: וַיְחַלְּלוּ
  choice: profanaram
  rationale: No piel, o verbo expressa tratar como profano aquilo que é santo; “profanaram” conserva a força teológica da oposição entre o santo nome e sua desonra.
- source_word: שֵׁם קָדְשִׁי
  choice: o meu santo nome
  rationale: Expressão portuguesa natural que preserva tanto a santidade quanto a dimensão da identidade e reputação divinas.
- source_word: בֶּאֱמֹר לָהֶם
  choice: pois ali se dizia a respeito deles
  rationale: A formulação impessoal comunica que essa fala circulava entre as nações. “A respeito deles” explicita o referente contextual, embora o hebraico diga literalmente “a eles”.
- source_word: עַם־יְהוָה אֵלֶּה
  choice: Estes são o povo de Yahweh
  rationale: Mantém a ênfase do demonstrativo e verte diretamente o nome divino; o singular coletivo “povo” é idiomático em português.
- source_word: וּמֵאַרְצוֹ יָצָאוּ
  choice: mas tiveram de sair da terra dele
  rationale: O hebraico declara que saíram da terra de Yahweh. “Tiveram de sair” torna perceptível a vergonha implícita do exílio sem acrescentar explicitamente que foram expulsos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança e segue a orientação do projeto.
- issue: Agente da profanação do nome divino
  choice: Israel permanece como sujeito de “profanaram”, enquanto a fala das nações mostra como isso ocorreu
  alternative: As próprias nações profanaram o nome ao pronunciar essas palavras
  rationale: O plural verbal aponta naturalmente para os israelitas no contexto, mas a sintaxe comprime a relação entre sua situação no exílio e o comentário das nações. A tradução conserva essa tensão.
- issue: Força adversativa na fala sobre a saída da terra
  choice: mas tiveram de sair
  alternative: e saíram; contudo saíram; foram expulsos
  rationale: 'A conjunção hebraica pode ser simples, mas o contexto comunica contraste e desonra: embora sejam o povo de Yahweh, estão fora da terra dele. A opção evita transformar a implicação em um passivo explícito.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem remover a ambiguidade contextual sobre a relação entre Israel, as nações e a profanação do nome divino.
