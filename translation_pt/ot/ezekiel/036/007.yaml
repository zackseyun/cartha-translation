base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/007.yaml
  text: 'Therefore thus says the Lord GOD: I have lifted up my hand in oath that surely the nations that are around you will bear their disgrace[a].'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: Levantei a mão em juramento[a]: certamente as nações que estão ao redor de vocês carregarão a sua desonra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico literalmente, “Levantei a mão”, uma expressão usada para prestar juramento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Preserva os dois elementos do título hebraico: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”, evitando a duplicação “Senhor SENHOR”.'
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: Levantei a mão e juro
  rationale: Mantém a imagem hebraica de levantar a mão e explicita, em português corrente, sua função idiomática de prestar juramento.
- source_word: אִם לֹא
  choice: que ... certamente
  rationale: Depois da fórmula de juramento, a expressão introduz enfaticamente o conteúdo jurado; não funciona aqui como uma condição simples.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Designa os povos estrangeiros vizinhos de Israel; “nações” é claro e não importa conotações posteriores de “gentios”.
- source_word: מִסָּבִיב
  choice: que estão ao redor de vocês
  rationale: Reproduz o sentido espacial e o referente plural do pronome hebraico.
- source_word: כְּלִמָּתָם
  choice: a própria desonra
  rationale: כְּלִמָּה pode indicar vergonha, desonra ou humilhação. “A própria desonra” deixa claro que o sufixo se refere às nações, sem reduzir o termo a um sentimento meramente interior.
- source_word: יִשָּׂאוּ
  choice: levarão sobre si
  rationale: Conserva a metáfora de נשׂא, “carregar/levar”, e comunica naturalmente a ideia de suportar a desonra ou suas consequências.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida torna visível o nome divino presente no hebraico e mantém distinto o título אֲדֹנָי, sem acrescentar uma interpretação denominacional.
- issue: Força da fórmula de juramento אִם לֹא
  choice: juro que ... certamente
  alternative: se não
  rationale: No contexto de uma mão levantada em juramento, a construção tem força asseverativa. A tradução comunica essa força sem tratar a declaração divina como uma condição incompleta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem concreta do hebraico, mas esclarece seu valor idiomático; “vocês” representa naturalmente o pronome plural dirigido aos montes de Israel no contexto.
