base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/025.yaml
  text: And I will sprinkle clean water on you[a], and you will be clean; from all your uncleannesses and from all your idols I will cleanse you.
translation:
  language: pt
  text: E aspergirei água pura sobre vocês, e vocês ficarão puros; de todas as suas impurezas e de todos os seus ídolos eu os purificarei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é deliberadamente depreciativo e pode ser entendido, mais literalmente, como “ídolos de esterco”; Ezequiel o emprega com frequência para demonstrar desprezo pelos ídolos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַקְתִּי
  choice: Então aspergirei
  rationale: Em contexto de purificação ritual, זרק significa aspergir. “Então” liga naturalmente esta promessa ao contexto imediato, embora o waw também possa ser traduzido simplesmente por “e”.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: Expressa de modo natural em português a direção da aspersão sobre pessoas.
- source_word: מַיִם טְהוֹרִים
  choice: água pura
  rationale: טָהוֹר denota pureza ou condição ritual de limpeza; “água pura” é idiomático e sustenta a repetição temática da purificação.
- source_word: וּטְהַרְתֶּם
  choice: e vocês ficarão puros
  rationale: A forma descreve o estado resultante dos destinatários. “Ficarão puros” distingue esse resultado da ação divina expressa depois por “eu os purificarei”.
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: de todas as suas impurezas
  rationale: O plural abrange diferentes estados ou formas de impureza e contaminação; “impurezas” é claro, atual e adequado tanto ao campo ritual quanto ao moral.
- source_word: וּמִכָּל גִּלּוּלֵיכֶם
  choice: e de todos os seus ídolos
  rationale: “Ídolos” comunica com clareza o referente. A força deliberadamente depreciativa do termo peculiar a Ezequiel é preservada em nota.
- source_word: אֲטַהֵר אֶתְכֶם
  choice: eu os purificarei
  rationale: O piel apresenta Deus como aquele que efetua a purificação. A formulação é direta e mantém a repetição da raiz טהר ao lado de “água pura” e “ficarão puros”.
theological_decisions:
- issue: Natureza da imagem de purificação
  choice: Preservar a linguagem de purificação ritual e moral sem determinar um mecanismo sacramental.
  alternative: Interpretar no texto principal a água como restauração nacional meramente metafórica ou como referência direta ao batismo.
  rationale: O hebraico promete que Deus removerá as impurezas e os ídolos no contexto da restauração. A redação mantém aberta a dimensão simbólica e tipológica sem inserir uma especificidade doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” representa com naturalidade o plural hebraico. A repetição de “pura/puros/purificarei” procura refletir a recorrência da raiz טהר no original sem tornar a frase artificial.
