  text: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙ כְּלִמַּ֣ת הַ/גּוֹיִ֔ם וְ/חֶרְפַּ֥ת עַמִּ֖ים לֹ֣א תִשְׂאִי ע֑וֹד ו/גוי/ך לֹא תַכְשִׁ֣לִי ע֔וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/015.yaml
  text: And I will no longer let you hear the disgrace of the nations[a], and you will no longer bear the reproach of the peoples, and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: pt
  text: E não farei mais que você ouça a humilhação vinda das nações; você não voltará a suportar a afronta dos povos, nem voltará a fazer sua nação tropeçar[a] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fará sua nação cair”; segundo outra tradição interpretativa, “deixará sua nação sem filhos”. O texto consonantal hebraico é difícil neste ponto; a vocalização massorética favorece “fará sua nação tropeçar”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁמִיעַ אֵלַיִךְ
  choice: farei você ouvir
  rationale: O hifil de שׁמע expressa causação. A construção portuguesa mantém esse valor e, com a negação, comunica que a terra personificada não ficará mais exposta à humilhação pronunciada pelas nações.
- source_word: כְּלִמַּת הַגּוֹיִם
  choice: a humilhação vinda das nações
  rationale: כְּלִמָּה indica vergonha ou humilhação pública. “Vinda das nações” explicita naturalmente a relação do construto sem transformar as nações no objeto da humilhação.
- source_word: חֶרְפַּת עַמִּים
  choice: a afronta dos povos
  rationale: חֶרְפָּה denota afronta, insulto ou opróbrio. “Afronta” é atual e digna, e “povos” preserva a distinção lexical em relação a גּוֹיִם, traduzido por “nações”.
- source_word: תִשְׂאִי
  choice: suportará
  rationale: Embora נשׂא signifique literalmente “carregar”, com “afronta” o sentido idiomático é suportá-la ou padecê-la.
- source_word: וְגוֹיִךְ
  choice: sua nação
  rationale: A forma apresentada no texto consonantal é entendida como גּוֹי com sufixo feminino singular, referindo-se à nação ligada à terra personificada.
- source_word: תַכְשִׁלִי
  choice: fará ... tropeçar
  rationale: O hifil de כשל normalmente significa causar tropeço ou queda. A tradução conserva a imagem e a forma causativa da vocalização massorética.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética. “Yahweh” preserva o nome divino, enquanto “Senhor” representa אֲדֹנָי.
theological_decisions:
- issue: Sentido da última cláusula
  choice: nem fará sua nação tropeçar novamente
  alternative: nem voltará a deixar sua nação sem filhos
  rationale: A vocalização massorética תַכְשִׁלִי sustenta “fazer tropeçar”. A alternativa “deixar sem filhos” decorre de outra leitura ou tradição interpretativa e, por isso, é registrada em nota sem substituir o texto-base.
- issue: Representação de אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução distingue os dois elementos do título e preserva explicitamente o nome pactual יהוה como “Yahweh”, sem fundi-lo com אֲדֹנָי.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A terra continua personificada pelo tratamento no feminino implícito no contexto, e o paralelismo profético entre “nações” e “povos”, bem como entre “humilhação” e “afronta”, foi preservado.
