  to: E não farei mais que você ouça a humilhação vinda das nações; você não voltará a suportar a afronta dos povos, nem voltará a fazer sua nação tropeçar[a] — declara o Senhor Yahweh.
  rationale: 'A revisão é limitada a duas melhorias seguras de precisão e fluidez: substitui-se a construção menos idiomática “não farei mais você ouvir” por “não farei mais que você ouça” e “novamente” por “voltará a”, que comunica com maior clareza a negação durativa de עוֹד. A nota, a leitura massorética principal e a ambiguidade textual permanecem preservadas.'
