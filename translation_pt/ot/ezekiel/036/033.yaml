  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/יוֹם֙ טַהֲרִ֣/י אֶתְ/כֶ֔ם מִ/כֹּ֖ל עֲוֺנֽוֹתֵי/כֶ֑ם וְ/הֽוֹשַׁבְתִּי֙ אֶת הֶ֣/עָרִ֔ים וְ/נִבְנ֖וּ הֶ/חֳרָבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/033.yaml
  text: 'Thus says the Lord GOD: On the day I cleanse you from all your iniquities[a], I will cause the cities to be inhabited[c][b], and the ruins will be rebuilt.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: No dia em que eu os purificar de todas as suas iniquidades, farei com que as cidades sejam habitadas, e as ruínas serão reconstruídas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, evitando a expressão pouco natural “Senhor SENHOR”.
- source_word: בְּיוֹם
  choice: No dia em que
  rationale: Preserva a imagem temporal do hebraico e, com “em que”, produz uma construção natural em português.
- source_word: טַהֲרִי
  choice: eu os purificar
  rationale: O piel de טהר indica tornar puro ou limpar de impureza; “purificar” comunica adequadamente o sentido moral e espiritual neste contexto.
- source_word: מִכֹּל עֲוֺנוֹתֵיכֶם
  choice: de todas as suas iniquidades
  rationale: “Iniquidades” conserva o peso moral de עָוֹן, enquanto “de” expressa o afastamento ou a libertação daquilo que contaminava.
- source_word: וְהוֹשַׁבְתִּי אֶת הֶעָרִים
  choice: farei com que as cidades sejam habitadas
  rationale: Reproduz o valor causativo do hiphil de ישׁב sem acrescentar um sujeito humano explícito ausente do hebraico.
- source_word: וְנִבְנוּ הֶחֳרָבוֹת
  choice: e as ruínas serão reconstruídas
  rationale: “Ruínas” traduz naturalmente os lugares devastados designados por חֳרָבוֹת, e a voz passiva corresponde a נִבְנוּ.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A escolha mantém distintos o título אֲדֹנָי e o nome pessoal יהוה, sem ocultar o nome divino nem produzir a repetição “Senhor SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém proximidade com o hebraico, mas evita construções artificiais. Não foram necessárias notas de rodapé, pois as principais relações lexicais podem ser expressas com clareza no texto.
