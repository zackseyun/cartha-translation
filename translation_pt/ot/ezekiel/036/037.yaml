  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ע֗וֹד זֹ֛את אִדָּרֵ֥שׁ לְ/בֵֽית יִשְׂרָאֵ֖ל לַ/עֲשׂ֣וֹת לָ/הֶ֑ם אַרְבֶּ֥ה אֹתָ֛/ם כַּ/צֹּ֖אן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Ainda nisto, deixarei que a casa de Israel me peça que eu faça isto por eles:[a] eu os multiplicarei como um rebanho de pessoas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serei buscado pela casa de Israel para fazer isto por eles” ou “permitirei que a casa de Israel me consulte para que eu faça isto por eles”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “como um rebanho de pessoas”; isto é, uma grande multidão de pessoas comparada a um rebanho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título divino e representa diretamente o nome pactual יהוה, evitando a repetição pouco natural «Senhor SENHOR».
- source_word: עוֹד זֹאת
  choice: Ainda quanto a isto
  rationale: «Ainda» conserva a ideia de continuação ou acréscimo, e «quanto a isto» remete à restauração anteriormente prometida.
- source_word: אִדָּרֵשׁ
  choice: deixarei que ... me peça
  rationale: O nifal de דרש pode expressar que Deus se deixa buscar ou consultar. A formulação é natural em português e mantém tanto a iniciativa da oração de Israel quanto a disposição divina de atendê-la.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: que eu faça isso por eles
  rationale: Expressa de modo claro o infinitivo «fazer por eles»; «isso» retoma as bênçãos prometidas no contexto, sem especificá-las além do texto.
- source_word: אַרְבֶּה אֹתָם
  choice: eu os multiplicarei
  rationale: O hifil de רבה indica tornar numerosos e ecoa a linguagem pactual de multiplicação do povo.
- source_word: כַּצֹּאן אָדָם
  choice: como um rebanho de gente
  rationale: Conserva a metáfora incomum do rebanho, enquanto «gente» comunica o sentido coletivo e humano de אָדָם em português corrente.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A opção adotada preserva o título אֲדֹנָי e o nome próprio יהוה sem transformar ambos no mesmo título português.
- issue: Relação entre a promessa divina e a súplica de Israel em אִדָּרֵשׁ
  choice: deixarei que a casa de Israel me peça
  alternative: serei consultado pela casa de Israel
  rationale: 'A tradução mantém a tensão do texto: Deus promete agir e, ao mesmo tempo, determina que Israel o busque para receber essa ação, sem reduzir o versículo nem à passividade divina nem à iniciativa humana autônoma.'
- issue: Sentido coletivo de אָדָם
  choice: gente
  alternative: homens
  rationale: Neste sintagma, אָדָם designa seres humanos coletivamente. «Gente» comunica essa abrangência sem apagar a forma incomum da metáfora, preservada em «rebanho».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavizada sem eliminar a ambiguidade do nifal אִדָּרֵשׁ nem a imagem deliberadamente incomum de כַּצֹּאן אָדָם.
