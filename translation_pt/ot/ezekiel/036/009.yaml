  text: כִּ֖י הִנְ/נִ֣י אֲלֵי/כֶ֑ם וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/נֶעֱבַדְתֶּ֖ם וְ/נִזְרַעְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/009.yaml
  text: For behold[a], I am for you, and I will turn to you, and you will be cultivated and sown.
translation:
  language: pt
  text: Pois eis que estou a favor de vocês[a]; eu me voltarei para vocês, e vocês serão cultivados e semeados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou voltado para vocês”. A expressão hebraica indica a disposição favorável do SENHOR para com a terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da promessa anterior e preserva a ligação explicativa com o contexto.
- source_word: הִנְנִי
  choice: eis que estou
  rationale: Mantém a força de chamada de atenção e a solenidade profética da fórmula hebraica, em português corrente e digno.
- source_word: אֲלֵיכֶם
  choice: a favor de vocês
  rationale: No contexto da restauração dos montes e da terra de Israel, expressa orientação favorável, não apenas movimento em direção a eles.
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: eu me voltarei para vocês
  rationale: Preserva a metáfora hebraica de voltar-se para alguém, aqui com o sentido contextual de atenção e ação favoráveis.
- source_word: וְנֶעֱבַדְתֶּם
  choice: vocês serão cultivados
  rationale: O nifal de עבד refere-se aqui ao trabalho agrícola realizado na terra; o plural concorda com os montes de Israel, destinatários do discurso.
- source_word: וְנִזְרַעְתֶּם
  choice: e semeados
  rationale: Reproduz diretamente o sentido passivo agrícola do nifal de זרע e mantém o paralelismo com 'cultivados'.
theological_decisions:
- issue: Orientação divina expressa por אֲלֵיכֶם depois de הִנְנִי
  choice: estou a favor de vocês
  alternative: estou voltado para vocês; aqui estou, vindo até vocês
  rationale: O contexto aponta para a renovação do favor de YHWH para com os montes e a terra de Israel. A formulação comunica essa disposição favorável sem acrescentar uma afirmação teológica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural 'vocês' retoma os montes de Israel personificados no contexto. 'Eis que' conserva o tom profético sem arcaísmo excessivo; os passivos agrícolas preservam a forma e a imagem do hebraico.
