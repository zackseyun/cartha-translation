source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א וְ/אָמַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֣עַן בְּ/יַ֡עַן שַׁמּוֹת֩ וְ/שָׁאֹ֨ף אֶתְ/כֶ֜ם מִ/סָּבִ֗יב לִֽ/הְיוֹתְ/כֶ֤ם מֽוֹרָשָׁה֙ לִ/שְׁאֵרִ֣ית הַ/גּוֹיִ֔ם וַ/תֵּֽעֲל֛וּ עַל שְׂפַ֥ת לָשׁ֖וֹן וְ/דִבַּת עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/003.yaml
  text: 'Therefore prophesy and say[a], Thus says the Lord GOD: Because, indeed because they have made you desolate and have snapped at you from every side, so that you became a possession for the remnant of the nations, and you have come up on the lips of the tongue and in the slander of the people[b],'
translation:
  language: pt
  text: 'Por isso, profetize e diga: Assim diz o Senhor Yahweh: Visto que, sim, visto que devastaram vocês e avançaram avidamente sobre vocês de todos os lados[a], para que se tornassem propriedade do restante das nações, e vocês se tornaram assunto de conversa e objeto da difamação do povo[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico é difícil. Também pode ser entendido como “ofegaram atrás de vocês”, “tentaram engolir vocês” ou “arremeteram contra vocês”; a expressão comunica a pressão hostil e predatória das nações ao redor.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “vocês subiram sobre o lábio da língua”; a expressão significa que se tornaram assunto da fala das pessoas. “Difamação” também pode ser traduzido como “calúnia”, “rumor maldoso” ou “relato infamante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a resposta profética como consequência do contexto anterior.
- source_word: הִנָּבֵא וְאָמַרְתָּ
  choice: profetize e diga
  rationale: Conserva a ordem composta dirigida a Ezequiel, em português atual e direto.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição artificial “Senhor SENHOR”.
- source_word: יַעַן בְּיַעַן
  choice: Visto que, sim, visto que
  rationale: Reproduz a duplicação enfática da expressão causal sem reduzir sua força retórica.
- source_word: שַׁמּוֹת
  choice: devastaram vocês
  rationale: Expressa a ação de deixar desolados os montes e a terra personificados no contexto.
- source_word: שָׁאֹף
  choice: avançaram avidamente sobre vocês
  rationale: O verbo é difícil; esta formulação comunica tanto a cobiça quanto a pressão hostil das nações vizinhas, sem fixar uma imagem lexical incerta.
- source_word: מִסָּבִיב
  choice: de todos os lados
  rationale: Equivalente idiomático claro para a ação vinda das regiões circundantes.
- source_word: לִהְיוֹתְכֶם מוֹרָשָׁה
  choice: para que se tornassem propriedade
  rationale: Preserva a possível nuance de propósito ou resultado e traduz מוֹרָשָׁה como algo tomado por posse.
- source_word: לִשְׁאֵרִית הַגּוֹיִם
  choice: do restante das nações
  rationale: Neste contexto, שְׁאֵרִית indica as demais nações ou as que restaram, sem necessariamente evocar um remanescente teológico.
- source_word: וַתֵּעֲלוּ עַל שְׂפַת לָשׁוֹן
  choice: vocês foram parar na boca de todos
  rationale: Transmite de modo natural o idiomatismo de se tornar assunto recorrente na fala das pessoas; a imagem literal é registrada em nota.
- source_word: וְדִבַּת עָם
  choice: e se tornaram alvo da difamação do povo
  rationale: דִבָּה denota relato infamante, calúnia ou rumor hostil; “alvo da difamação” integra naturalmente a expressão à frase.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: Mantém separadamente o título אֲדֹנָי e o nome pessoal יהוה, sem transformar o nome em outro título nem produzir uma repetição pouco natural.
- issue: Sentido de שְׁאֵרִית aplicado às nações
  choice: o restante das nações
  alternative: o remanescente das nações
  rationale: Evita atribuir automaticamente à expressão um sentido técnico ou salvífico; aqui ela identifica as nações restantes que procuram tomar a terra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” preserva o destinatário coletivo — os montes de Israel — e evita confundi-lo com Ezequiel, a quem os imperativos no singular são dirigidos.
