source:
  edition: WLC
  text: וְ/הִרְבֵּיתִי֙ אֶת פְּרִ֣י הָ/עֵ֔ץ וּ/תְנוּבַ֖ת הַ/שָּׂדֶ֑ה לְמַ֗עַן אֲ֠שֶׁר לֹ֣א תִקְח֥וּ ע֛וֹד חֶרְפַּ֥ת רָעָ֖ב בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/030.yaml
  text: And I will multiply the fruit of the tree and the produce of the field[a], so that you will no longer bear the reproach of famine among the nations.
translation:
  language: pt
  text: Farei aumentar o fruto das árvores e a produção dos campos, para que vocês nunca mais suportem, entre as nações, a humilhação da fome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que vocês nunca mais carreguem, entre as nações, o opróbrio da fome”.'
    reason: Alternativa mais formal para לֹא תִקְחוּ עוֹד חֶרְפַּת רָעָב, preservando a imagem de carregar e o termo tradicional “opróbrio”.
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Farei aumentar
  rationale: O hifil perfeito na primeira pessoa, neste discurso profético, expressa uma promessa futura e causativa de Deus. “Farei aumentar” comunica isso com naturalidade.
- source_word: פְּרִי הָעֵץ
  choice: o fruto das árvores
  rationale: O singular hebraico tem sentido coletivo. O plural “das árvores” é mais natural em português e mantém a referência à produção frutífera em geral.
- source_word: וּתְנוּבַת הַשָּׂדֶה
  choice: e a produção dos campos
  rationale: תְּנוּבָה denota produção ou rendimento agrícola. O plural “dos campos” expressa naturalmente em português o singular coletivo hebraico.
- source_word: לְמַעַן אֲשֶׁר
  choice: para que
  rationale: A locução introduz propósito ou resultado; “para que” preserva essa relação de modo claro e corrente.
- source_word: לֹא תִקְחוּ עוֹד
  choice: vocês nunca mais suportem
  rationale: Embora לקח signifique normalmente “tomar” ou “receber”, com חֶרְפָּה descreve experimentar ou carregar uma desonra. “Nunca mais suportem” conserva a ideia de padecer essa condição.
- source_word: חֶרְפַּת רָעָב
  choice: a humilhação da fome
  rationale: A cadeia construta associa a fome à desonra pública. “Humilhação” é clara no português atual e preserva a dimensão social da expressão.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: A expressão se refere aos povos ao redor que presenciavam a situação de Israel. “Entre as nações” corresponde bem à preposição e evita uma formulação anacronicamente neotestamentária.
theological_decisions:
- issue: Se a promessa destaca apenas prosperidade agrícola ou também a restauração da honra de Israel diante das nações
  choice: Preservar conjuntamente a abundância material e o fim da humilhação pública causada pela fome.
  alternative: Entender a promessa como exclusivamente econômica ou exclusivamente ligada à honra.
  rationale: O hebraico liga explicitamente o aumento da produção agrícola à remoção da humilhação diante das nações; a tradução não reduz nenhum dos dois aspectos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os plurais “árvores” e “campos” tornam naturais os singulares coletivos hebraicos. A colocação “entre as nações” mantém clara a dimensão pública da humilhação.
