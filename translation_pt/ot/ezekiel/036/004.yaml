  text: לָ/כֵן֙ הָרֵ֣י יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים וְ/לַ/גֵּאָי֗וֹת וְ/לֶ/חֳרָב֤וֹת הַ/שֹּֽׁמְמוֹת֙ וְ/לֶ/עָרִ֣ים הַ/נֶּעֱזָב֔וֹת אֲשֶׁ֨ר הָי֤וּ לְ/בַז֙ וּ/לְ/לַ֔עַג לִ/שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם אֲשֶׁ֥ר מִ/סָּבִֽיב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/004.yaml
  text: 'Therefore[a], mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys[b], to the desolate ruins and to the abandoned cities that have become plunder and mockery to the remnant of the nations that are all around:'
translation:
  language: pt
  text: 'Portanto, montes de Israel, ouçam a palavra do Senhor Yahweh. Assim diz o Senhor Yahweh aos montes e às colinas, às ravinas[a] e aos vales, às ruínas desoladas e às cidades abandonadas, que se tornaram saque e motivo de zombaria para o restante[b] das nações ao redor:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «canais» ou «leitos de rios».
    reason: lexical_alternative
  - marker: b
    text: Ou «o remanescente».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz naturalmente a consequência do oráculo anterior e preserva o valor inferencial do hebraico.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: montes de Israel
  rationale: Mantém a expressão em construção e a personificação das formas da terra, diretamente interpeladas.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: Imperativo plural, adequado à interpelação profética e claro no português atual.
- source_word: דְּבַר
  choice: a palavra
  rationale: Preserva a fórmula profética tradicional e representa diretamente o substantivo hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: 'Distingue os dois elementos do título hebraico: אֲדֹנָי como «Senhor» e o nome divino יהוה como «Yahweh», evitando a duplicação «Senhor SENHOR».'
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética consagrada, natural e digna em português.
- source_word: לֶהָרִים וְלַגְּבָעוֹת
  choice: aos montes e às colinas
  rationale: Conserva a coordenação e a repetição preposicional em português idiomático.
- source_word: אֲפִיקִים
  choice: canais
  rationale: O termo pode designar canais, leitos de cursos d’água ou ravinas; «canais» preserva sua referência topográfica sem pressupor água corrente.
- source_word: גֵּאָיוֹת
  choice: vales
  rationale: Equivalente amplo e natural para a forma topográfica mencionada.
- source_word: חֳרָבוֹת הַשֹּׁמְמוֹת
  choice: ruínas desoladas
  rationale: Representa tanto as ruínas quanto sua condição de desolação.
- source_word: עָרִים הַנֶּעֱזָבוֹת
  choice: cidades abandonadas
  rationale: Expressão moderna e clara para cidades deixadas ou desamparadas.
- source_word: לְבַז
  choice: saque
  rationale: Indica aquilo que foi tomado como despojo; «tornaram-se saque» mantém a construção predicativa.
- source_word: לְלַעַג
  choice: motivo de zombaria
  rationale: Em português, esta formulação expressa naturalmente que as cidades se tornaram objeto de escárnio.
- source_word: שְׁאֵרִית הַגּוֹיִם
  choice: o restante das nações
  rationale: No contexto, refere-se às demais ou restantes nações, sem impor ao termo um sentido teológico especializado.
- source_word: אֲשֶׁר מִסָּבִיב
  choice: que estão ao redor
  rationale: Preserva a oração relativa e a ênfase espacial da expressão hebraica.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR / Senhor Deus
  rationale: «Senhor Yahweh» representa separadamente o título אֲדֹנָי e o nome próprio יהוה, sem ocultar o nome divino nem produzir a repetição pouco natural «Senhor SENHOR».
- issue: Possível sentido teológico de שְׁאֵרִית
  choice: o restante das nações
  alternative: o remanescente das nações
  rationale: Aqui o contexto aponta para as nações restantes ao redor, não necessariamente para um remanescente com função salvífica. A nota conserva a alternativa lexical mais formal.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. Emprega «ouçam» para concordar com o vocativo plural e mantém a enumeração topográfica. As notas registram ambiguidades lexicais reais sem sobrecarregar o texto principal.
