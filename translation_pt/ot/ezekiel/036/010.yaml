  text: וְ/הִרְבֵּיתִ֤י עֲלֵי/כֶם֙ אָדָ֔ם כָּל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה וְ/נֹֽשְׁבוּ֙ הֶֽ/עָרִ֔ים וְ/הֶ/חֳרָב֖וֹת תִּבָּנֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/010.yaml
  text: And I will multiply people upon you—all the house of Israel[a], all of it. The cities will be inhabited[b], and the ruins will be rebuilt.
translation:
  language: pt
  text: Multiplicarei sobre vocês pessoas — toda a casa de Israel, toda ela. As cidades serão habitadas, e as ruínas[b] serão reconstruídas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “lugares devastados” ou “lugares desolados”, em vez de “ruínas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Multiplicarei
  rationale: O hifil de רבה indica fazer aumentar ou tornar numeroso. “Multiplicarei” preserva a força causativa e é claro no registro bíblico contemporâneo.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: A preposição עַל com sufixo plural retoma os montes de Israel, diretamente interpelados no contexto, e mantém a imagem da população espalhada sobre a terra.
- source_word: אָדָם
  choice: as pessoas
  rationale: Aqui אָדָם tem sentido coletivo de população humana. “As pessoas” comunica esse valor com naturalidade, sem restringi-lo ao sexo masculino.
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: toda a casa de Israel, toda ela
  rationale: A repetição de totalidade no hebraico é enfática; a tradução conserva tanto כָּל quanto כֻּלֹּה em vez de fundi-los numa única expressão.
- source_word: וְנֹשְׁבוּ הֶעָרִים
  choice: As cidades serão habitadas
  rationale: O nifal de ישׁב apresenta as cidades como novamente povoadas; a construção passiva em português preserva o sentido e a forma do original.
- source_word: וְהֶחֳרָבוֹת
  choice: as ruínas
  rationale: חֳרָבוֹת designa lugares devastados ou arruinados. “Ruínas” é conciso, vívido e se combina naturalmente com “reconstruídas”.
- source_word: תִּבָּנֶינָה
  choice: serão reconstruídas
  rationale: O nifal de בנה é passivo; como se trata de lugares antes arruinados, “reconstruídas” expressa naturalmente a restauração implícita no contexto.
theological_decisions:
- issue: Referente dos destinatários e natureza da restauração
  choice: O versículo se dirige aos montes ou à terra de Israel e promete uma restauração concreta da população e dos centros urbanos de Israel.
  alternative: Entender a linguagem apenas como restauração espiritual metafórica, desvinculada da terra.
  rationale: O contexto imediato interpela a terra e os montes, enquanto cidades, habitantes e ruínas reconstruídas formam imagens territoriais concretas. A tradução não espiritualiza nem amplia essa linguagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a interpelação plural aos montes (“vocês”), a imagem espacial de “sobre vocês” e a ênfase deliberadamente repetida de “toda... toda ela”.
