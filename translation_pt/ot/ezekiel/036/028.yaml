  text: וִ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֹֽתֵי/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/028.yaml
  text: You will dwell in the land that I gave to your fathers[a], and you will be my people, and I will be your God.
translation:
  language: pt
  text: Vocês habitarão na terra que dei a seus pais[a]. Vocês serão o meu povo, e eu serei o seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antepassados”. O hebraico diz literalmente “pais”, evocando as promessas da aliança feitas aos patriarcas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִישַׁבְתֶּם
  choice: Vocês habitarão
  rationale: O verbo ישׁב, nesta sequência profética, aponta para habitação futura. “Habitarão” conserva a ideia de residência estável e mantém um registro bíblico digno, sem acrescentar a noção específica de colonização implicada por “se estabelecerão”.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ designa aqui a terra vinculada às promessas ancestrais. “Terra” é a forma natural e preserva a dimensão geográfica e pactual.
- source_word: אֲשֶׁר נָתַתִּי
  choice: que dei
  rationale: O perfeito נָתַתִּי apresenta a dádiva como ato concluído. O pretérito perfeito simples é natural em português.
- source_word: לַאֲבֹתֵיכֶם
  choice: a seus pais
  rationale: O hebraico diz literalmente “a seus pais”. A escolha preserva a formulação masculina e a evocação das promessas feitas aos patriarcas; “antepassados” é registrado em nota como alternativa contextual.
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: Vocês serão o meu povo
  rationale: Trata-se da fórmula clássica da aliança. A construção possessiva é idiomática em português e preserva sua ressonância canônica.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: e eu serei o seu Deus
  rationale: A formulação traduz naturalmente a expressão pactual hebraica. O pronome explícito אָנֹכִי fica representado por “eu”, sem necessidade de intensificação interpretativa como “eu mesmo”.
theological_decisions:
- issue: Formulação da aliança
  choice: Vocês serão o meu povo, e eu serei o seu Deus.
  alternative: Vocês serão para mim um povo, e eu serei para vocês Deus.
  rationale: A redação escolhida é a forma idiomática consagrada da fórmula da aliança e preserva seu sentido e sua ligação com outras passagens bíblicas, sem resolver ou ampliar o conteúdo teológico.
- issue: Termo ancestral masculino
  choice: pais
  alternative: antepassados
  rationale: “Pais” corresponde formalmente a אֲבוֹת e conserva a referência às promessas patriarcais. Como “antepassados” pode comunicar melhor a abrangência genealógica em português atual, essa alternativa é apresentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural de segunda pessoa e preserva a fórmula pactual em redação natural. O ponto após a nota divide as duas declarações principais sem alterar a coordenação hebraica.
