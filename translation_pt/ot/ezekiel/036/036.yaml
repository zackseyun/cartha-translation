  text: וְ/יָדְע֣וּ הַ/גּוֹיִ֗ם אֲשֶׁ֣ר יִֽשָּׁאֲרוּ֮ סְבִיבוֹתֵי/כֶם֒ כִּ֣י אֲנִ֣י יְהוָ֗ה בָּנִ֨יתִי֙ הַ/נֶּ֣הֱרָס֔וֹת נָטַ֖עְתִּי הַ/נְּשַׁמָּ֑ה אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/036.yaml
  text: Then the nations that remain around you will know that I[a], Yahweh, have rebuilt the ruined places and planted what was desolate. I, Yahweh, have spoken, and I will do it.
translation:
  language: pt
  text: Então as nações que restarem ao redor de vocês saberão que eu, Yahweh, reconstruí os lugares arruinados e plantei o que estava desolado. Eu, Yahweh, falei e farei isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falei e fiz isso”. O último verbo está formalmente no perfeito em hebraico, mas aqui provavelmente expressa a certeza daquilo que Yahweh realizará.'
    reason: alternativa lexical e aspecto verbal
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Então ... saberão
  rationale: O waw dá continuidade ao resultado da restauração prometida; “Então” expressa naturalmente essa progressão, preservando o sentido futuro.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos ao redor de Israel; “nações” evita a conotação religiosa posterior de “gentios”.
- source_word: אֲשֶׁר יִשָּׁאֲרוּ סְבִיבוֹתֵיכֶם
  choice: que restarem ao redor de vocês
  rationale: O nifal de נשׁאר indica os que permanecerem ou forem deixados; o futuro do subjuntivo é natural em português para essa referência futura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּנִיתִי הַנֶּהֱרָסוֹת
  choice: reconstruí os lugares arruinados
  rationale: Embora o verbo signifique literalmente “construí”, o objeto já destruído e o contexto de restauração justificam “reconstruí”; “lugares arruinados” preserva o plural substantivado.
- source_word: נָטַעְתִּי הַנְּשַׁמָּה
  choice: plantei o que estava desolado
  rationale: “Plantei” representa diretamente נטע sem acrescentar o prefixo “re-”; a expressão neutra “o que estava desolado” mantém a amplitude do substantivo hebraico sem inserir explicitamente “terra”.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: falei e farei isso
  rationale: O primeiro perfeito declara a palavra já proferida; o último perfeito, na fórmula profética, pode apresentar como certo o cumprimento futuro. “Isso” explicita em português o objeto implícito.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração “Yahweh” o preserva sem substituí-lo por um título.
- issue: Valor temporal e modal de וְעָשִׂיתִי na declaração profética
  choice: farei isso
  alternative: fiz isso
  rationale: Embora a forma hebraica seja perfeita, ela pode expressar a certeza de uma ação ainda futura. A tradução principal comunica a promessa de cumprimento, enquanto a nota preserva a leitura formal alternativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural de segunda pessoa, evitando regionalismos marcados. O paralelismo e a repetição enfática de “Eu, Yahweh” foram preservados.
