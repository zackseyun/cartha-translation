revisions:
- from: Então vocês se lembrarão dos seus maus caminhos e das suas ações que não eram boas, e sentirão repulsa de si mesmos[a] por causa das suas iniquidades e das suas abominações.
  to: Então vocês se lembrarão dos seus maus caminhos e das suas ações que não eram boas, e terão nojo de si mesmos[a] por causa das suas iniquidades e das suas abominações.
  rationale: A revisão substitui uma formulação compreensível, porém menos idiomática, por “terão nojo de si mesmos”, que comunica naturalmente a forte aversão reflexiva do hebraico. Mantêm-se todos os demais elementos semânticos e o registro bíblico do rascunho; a nota é ajustada para enunciar de modo claro a alternativa ligada à imagem literal hebraica.
