  text: וּ/זְכַרְתֶּם֙ אֶת דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים וּ/מַעַלְלֵי/כֶ֖ם אֲשֶׁ֣ר לֹֽא טוֹבִ֑ים וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם עַ֚ל עֲוֺנֹ֣תֵי/כֶ֔ם וְ/עַ֖ל תּוֹעֲבֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/031.yaml
  text: Then you will remember your evil ways and your deeds that were not good[a], and you will loathe yourselves for your iniquities and your abominations.
translation:
  language: pt
  text: Então vocês se lembrarão dos seus maus caminhos e das suas ações que não eram boas, e terão nojo de si mesmos[a] por causa das suas iniquidades e das suas abominações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terão nojo de si mesmos aos seus próprios olhos”. A expressão hebraica contém literalmente a ideia de estar “diante de suas próprias faces”.'
    reason: A expressão hebraica בִּפְנֵיכֶם, associada ao verbo de repulsa, pode explicitar a perspectiva reflexiva como “aos seus próprios olhos”.
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: Então vocês se lembrarão
  rationale: O perfeito qal de segunda pessoa masculina plural com waw integra a sequência profética e, após as promessas de restauração, tem sentido futuro e consequencial. “Então” explicita essa relação contextual sem alterar o núcleo de “lembrar”.
- source_word: דַּרְכֵיכֶם הָרָעִים
  choice: seus maus caminhos
  rationale: “Caminhos” preserva a metáfora hebraica para a conduta, enquanto “maus” expressa claramente sua qualidade moral em português corrente.
- source_word: וּמַעַלְלֵיכֶם אֲשֶׁר לֹא טוֹבִים
  choice: suas ações que não eram boas
  rationale: “Ações” traduz מַעֲלָל de modo natural e concreto. A oração “não eram boas” mantém a formulação negativa explícita do hebraico, sem intensificá-la para “más”.
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: sentirão repulsa de si mesmos
  rationale: No contexto, נקט expressa forte aversão, e בִּפְנֵיכֶם funciona idiomaticamente com sentido reflexivo. A formulação comunica a repulsa moral por si próprios em português claro, preservando em nota a imagem mais literal.
- source_word: עַל עֲוֺנֹתֵיכֶם
  choice: por causa das suas iniquidades
  rationale: A locução “por causa de” transmite naturalmente o valor causal de עַל. “Iniquidades” conserva o peso moral e pactual de עָוֹן e seu número plural.
- source_word: וְעַל תּוֹעֲבֹתֵיכֶם
  choice: e das suas abominações
  rationale: “Abominações” preserva a força de תּוֹעֵבָה e seu registro bíblico, abrangendo atos moral e cultualmente detestáveis.
theological_decisions:
- issue: Natureza da resposta de Israel depois da restauração
  choice: O versículo descreve a lembrança dos pecados passados e a repulsa moral por eles e por si próprios como consequência da obra restauradora de Deus no contexto.
  alternative: Entender a reação como mero remorso psicológico ou, no outro extremo, inserir no versículo uma formulação doutrinária plenamente desenvolvida sobre o arrependimento.
  rationale: A tradução mantém a sequência contextual e a intensidade moral do hebraico sem reduzir a reação a uma emoção passageira nem acrescentar categorias teológicas que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. Mantêm-se imagens e termos bíblicos reconhecíveis, como “caminhos”, “iniquidades” e “abominações”, sem sacrificar a naturalidade.
