  yaml_path: translation/ot/ezekiel/036/035.yaml
  text: And they will say, ‘This land that was desolate has become like the garden of Eden, and the cities that were ruined, desolate, and torn down are fortified and inhabited.’
translation:
  language: pt
  text: 'E dirão: “Esta terra, que estava desolada, tornou-se como o jardim do Éden; e as cidades que estavam arruinadas, desoladas e demolidas estão fortificadas e habitadas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָרֶץ הַלֵּזוּ הַנְּשַׁמָּה
  choice: Esta terra, que estava desolada
  rationale: Reproduz de modo natural a caracterização da terra como anteriormente devastada, sem enfraquecer o estado descrito pelo hebraico.
- source_word: כְגַן עֵדֶן
  choice: como o jardim do Éden
  rationale: Mantém a comparação explícita e a referência tradicional a Éden.
- source_word: הֶחֳרֵבוֹת וְהַנְּשַׁמּוֹת וְהַנֶּהֱרָסוֹת
  choice: que estavam em ruínas, desoladas e demolidas
  rationale: 'Preserva a série cumulativa de três descrições: ruína, desolação e destruição física.'
- source_word: בְּצוּרוֹת יָשָׁבוּ
  choice: agora estão fortificadas e habitadas
  rationale: Expressa o estado restaurado das cidades; “agora” torna clara em português a transição implícita no contraste, sem acrescentar conteúdo teológico.
theological_decisions: []
