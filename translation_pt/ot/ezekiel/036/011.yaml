  source_fidelity: 'A primeira oração do rascunho perde a força causativa do hifil de רבה: «Multiplicarei sobre vocês» pode significar que o próprio Yahweh se multiplicará. Além disso, no contexto imediato, o pronome masculino plural se dirige aos montes/à terra de Israel (36:8–10), e o hifil de ישב significa que eles voltarão a ser habitados, não que o próprio destinatário humano voltará a habitar.'
  naturalness: 'A redação revista preserva a imagem hebraica incomum de população e animais sobre a terra, mas usa construções portuguesas claras: «farei multiplicar», «farei que vocês sejam habitados» e «lhes farei mais bem».'
  terminology: «Seres humanos e animais» representa adequadamente אדם ובהמה como coletivos contrastados; «Yahweh» preserva o Tetragrama. «Serem fecundos» mantém a linguagem de fertilidade sem restringir בהמה a gado.
