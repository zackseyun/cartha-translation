    issue: «Multiplicarei sobre vocês» não expressa inequivocamente o hifil causativo de רבה.
    rationale: O sujeito é Yahweh, que faz aumentar seres humanos e animais sobre os destinatários; em português, «multiplicarei sobre vocês» atribui a multiplicação ao próprio sujeito.
  - severity: high
    issue: «Farei com que vocês voltem a habitar» trata os destinatários como população humana e altera o referente contextual.
    rationale: No contexto, os montes de Israel são diretamente interpelados. O hifil de ישב declara que Yahweh fará com que sejam habitados novamente.
  - severity: medium
    issue: «No princípio» reduz o plural abstrato רִאשֹׁתֵיכֶם a um começo singular e pode sugerir o princípio absoluto.
    rationale: «Em seus primeiros tempos» conserva melhor a comparação com a condição anterior e o paralelismo com «tempos antigos».
