source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֧י עֲלֵי/כֶ֛ם אָדָ֥ם וּ/בְהֵמָ֖ה וְ/רָב֣וּ וּ/פָר֑וּ וְ/הוֹשַׁבְתִּ֨י אֶתְ/כֶ֜ם כְּ/קַדְמֽוֹתֵי/כֶ֗ם וְ/הֵטִֽבֹתִי֙ מֵ/רִאשֹׁ֣תֵי/כֶ֔ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/011.yaml
  text: And I will multiply upon you man and beast[a], and they will multiply and be fruitful; and I will settle you as in your former times, and I will do better for you than at your beginnings[c][b]. Then you will know that I am Yahweh.
translation:
  language: pt
  text: Farei multiplicar sobre vocês seres humanos e animais[a]; eles se multiplicarão e serão fecundos. Farei que vocês sejam habitados como em seus tempos antigos[b] e lhes farei mais bem do que em seus primeiros tempos[c]. Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «ser humano e animal», uma associação profética comum para a população humana e animal em conjunto. «Gado» também é possível para «animais».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «farei vocês habitar como em seus tempos antigos». O verbo hebraico é causativo e, no contexto, os destinatários são os montes de Israel, que voltarão a ser habitados.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «lhes farei bem mais do que em seus primeiros tempos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי עֲלֵיכֶם
  choice: Multiplicarei sobre vocês
  rationale: O hifil de רבה expressa aumento causativo, e עֲלֵיכֶם conserva a imagem de seres humanos e animais multiplicados sobre a terra ou os montes interpelados no contexto.
- source_word: אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  rationale: אָדָם é coletivo e designa a população humana em contraste com בְּהֵמָה, também coletivo. A formulação é clara e inclusiva sem restringir בְּהֵמָה apenas a animais domésticos.
- source_word: וְרָבוּ וּפָרוּ
  choice: eles se multiplicarão e serão fecundos
  rationale: Mantém os dois verbos de crescimento e fertilidade, incluindo a ressonância bíblica de פרה, com referente coletivo humano e animal.
- source_word: וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: Farei com que vocês voltem a habitar
  rationale: O hifil de ישב é causativo. O contexto de restauração justifica explicitar a ideia de retorno, enquanto a nota preserva alternativas mais concisas.
- source_word: כְּקַדְמֹתֵיכֶם
  choice: como nos tempos antigos
  rationale: Expressa a restauração a uma condição anterior sem sugerir necessariamente uma reprodução exata do começo remoto.
- source_word: וְהֵטִבֹתִי מֵרִאשֹׁתֵיכֶם
  choice: lhes farei mais bem do que no princípio
  rationale: Preserva o sentido benefativo de יטב e a comparação introduzida por מן; 'no princípio' verte naturalmente o substantivo plural abstrato רִאשֹׁת.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Então vocês saberão que eu sou Yahweh
  rationale: A relação resultante é expressa naturalmente por 'Então', e o nome divino é transliterado como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido coletivo de אָדָם no contraste entre humanos e animais
  choice: seres humanos
  alternative: homem; humanidade; pessoas
  rationale: Neste contexto, אָדָם representa a população humana coletivamente, não um indivíduo masculino; 'seres humanos' torna esse sentido inequívoco.
- issue: Alcance de בְּהֵמָה
  choice: animais
  alternative: gado; animais domésticos
  rationale: Embora o termo frequentemente inclua especialmente animais domesticados, o contexto não exige restringir seu alcance; a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a imagem espacial de “sobre vocês”, dirigida à terra ou aos montes no contexto, e preserva a sequência enfática de restauração, fecundidade e reconhecimento de Yahweh.
