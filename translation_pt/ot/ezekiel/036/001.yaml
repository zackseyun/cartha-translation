id: EZK.36.1
reference: Ezekiel 36:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֖א אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
translation:
  language: pt
  text: 'E você, filho do homem[a], profetize aos montes de Israel[b] e diga: “Montes de Israel, ouçam a palavra de Yahweh[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mortal” ou “ser humano”. A tradução principal preserva a forma de tratamento recorrente dirigida a Ezequiel.
    reason: lexical_alternative
  - marker: b
    text: Ou “região montanhosa de Israel”. O hebraico diz literalmente “montes de Israel” e os personifica como ouvintes.
    reason: lexical_alternative
  - marker: c
    text: O hebraico traz YHWH, o nome divino; tradicionalmente traduzido como “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: E você
  rationale: Preserva a conjunção e o pronome enfático que introduzem diretamente a comissão dada a Ezequiel.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a fórmula recorrente com que Ezequiel é interpelado e sua continuidade literária no livro, sem transformá-la em uma paráfrase interpretativa.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: O imperativo do verbo נבא expressa a comissão profética de modo direto e natural em português.
- source_word: אֶל
  choice: aos
  rationale: 'Neste contexto, a preposição indica o destinatário da fala: o profeta deve dirigir sua mensagem aos montes personificados.'
- source_word: הָרֵי יִשְׂרָאֵל
  choice: montes de Israel
  rationale: Reproduz a imagem geográfica personificada e a repetição intencional da expressão hebraica; “região montanhosa de Israel” é possível, mas menos adequada ao vocativo.
- source_word: וְאָמַרְתָּ
  choice: e diga
  rationale: Traduz naturalmente a continuação da ordem após “profetize”, preservando a coordenação hebraica.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: O imperativo plural concorda com os montes personificados e conserva a força solene do chamado profético.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional “a palavra de” e verte o Tetragrama como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome pessoal. “Yahweh” o representa diretamente, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma tradicional híbrida.
- issue: Sentido de בֶן אָדָם em Ezequiel
  choice: filho do homem
  alternative: mortal; ser humano
  rationale: Aqui a expressão é a forma recorrente de tratamento dirigida ao profeta. A tradução formal preserva essa função literária sem impor um sentido cristológico nem reduzir a expressão a uma explicação interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais compatíveis com o tratamento por “você”. A repetição de “montes de Israel” e a personificação geográfica foram preservadas por sua importância retórica.
