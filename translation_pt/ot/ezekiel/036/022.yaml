source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר לְ/בֵֽית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֧א לְמַעַנְ/כֶ֛ם אֲנִ֥י עֹשֶׂ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל כִּ֤י אִם לְ/שֵׁם קָדְשִׁ/י֙ אֲשֶׁ֣ר חִלַּלְתֶּ֔ם בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אתֶם שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/022.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: It is not for your sake that I am acting, O house of Israel, but for my holy name[b], which you have profaned among the nations where you went.’'
translation:
  language: pt
  text: 'Por isso, diga à casa de Israel: “Assim diz o Senhor Yahweh: Não é por causa de vocês que estou agindo, ó casa de Israel, mas por causa do meu santo nome, que vocês profanaram entre as nações para onde foram.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca de modo natural a conclusão decorrente do contexto anterior, preservando a conexão inferencial.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à casa de Israel
  rationale: Mantém a expressão hebraica coletiva e pactual, sem reduzi-la simplesmente a “Israel”.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em registro solene e corrente.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico e mantém explícito o nome divino יהוה.
- source_word: לֹא לְמַעַנְכֶם
  choice: Não é por causa de vocês
  rationale: Comunica claramente que a ação divina não se fundamenta no mérito ou interesse de Israel.
- source_word: אֲנִי עֹשֶׂה
  choice: estou agindo
  rationale: Expressa o valor presente ou iminente do particípio sem acrescentar um objeto que não aparece no hebraico.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Conserva a repetição enfática e torna explícito o vocativo em português.
- source_word: כִּי אִם לְשֵׁם קָדְשִׁי
  choice: mas por causa do meu santo nome
  rationale: Reproduz o contraste de motivação e preserva o conceito teológico do nome santo de Deus.
- source_word: אֲשֶׁר חִלַּלְתֶּם
  choice: que vocês profanaram
  rationale: '“Profanaram” conserva a força cultual e teológica do piel de חלל: tratar como comum aquilo que é santo.'
- source_word: בַּגּוֹיִם אֲשֶׁר בָּאתֶם שָׁם
  choice: entre as nações para onde foram
  rationale: “Nações” é a equivalência contextual mais transparente para גּוֹיִם; “para onde foram” comunica naturalmente o destino indicado pelo hebraico.
theological_decisions:
- issue: Forma de verter אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha mantém distintos o título אֲדֹנָי e o nome pactual יהוה, sem produzir a repetição “Senhor SENHOR”.
- issue: Motivação da restauração divina
  choice: Não é por causa de vocês ... mas por causa do meu santo nome
  alternative: Não é em benefício de vocês ... e sim pelo meu santo nome
  rationale: 'A formulação conserva sem atenuação a tensão teológica do texto: Deus age em consideração ao seu nome santo, não por mérito de Israel.'
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. O pronome “vocês” oferece clareza ampla no plural; o vocativo “ó casa de Israel” preserva a ênfase profética sem soar excessivamente arcaico.
