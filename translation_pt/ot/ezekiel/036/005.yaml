  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֠א בְּ/אֵ֨שׁ קִנְאָתִ֥/י דִבַּ֛רְתִּי עַל שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם וְ/עַל אֱד֣וֹם כֻּלָּ֑/א אֲשֶׁ֣ר נָתְנֽוּ אֶת אַרְצִ֣/י לָ֠/הֶם לְ/מ֨וֹרָשָׁ֜ה בְּ/שִׂמְחַ֤ת כָּל לֵבָב֙ בִּ/שְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖/הּ לָ/בַֽז־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/005.yaml
  text: 'Therefore thus says the Lord GOD: Surely in the fire of my jealousy I have spoken against the remnant of the nations and against all Edom[a], who gave my land to themselves as a possession with wholehearted joy and with contempt of soul[c][b], in order to make its pastureland plunder.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: “Certamente, no fogo do meu zelo falei contra o restante das nações e contra Edom inteiro, que, com alegria de todo o coração e profundo desprezo, tomaram para si a minha terra como propriedade, a fim de fazer de suas pastagens um despojo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico da frase final é difícil; também pode ser entendido como “a fim de expulsá-la para saque” ou “a fim de fazer de suas terras abertas um despojo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי como o nome divino יהוה, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: אִם לֹא
  choice: Tão certo como eu vivo
  rationale: A expressão introduz uma afirmação solene de caráter juramentado; a formulação portuguesa comunica sua força, embora a menção à vida esteja implícita, não expressa no hebraico.
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: no fogo do meu zelo
  rationale: Mantém a metáfora concreta do fogo e traduz קִנְאָה como zelo intenso e exclusivo; “ciúme” também seria possível, mas soaria menos natural neste contexto judicial.
- source_word: שְׁאֵרִית הַגּוֹיִם
  choice: o restante das nações
  rationale: Neste contexto, שְׁאֵרִית designa as demais nações ou aquilo que delas restou, sem exigir o sentido teológico positivo que “remanescente” pode sugerir.
- source_word: אֱדוֹם כֻּלָּהּ
  choice: todo o Edom
  rationale: Reproduz de modo direto o valor coletivo e abrangente da expressão hebraica.
- source_word: נָתְנוּ אֶת אַרְצִי לָהֶם לְמוֹרָשָׁה
  choice: tomaram para si a minha terra como propriedade
  rationale: Embora נָתְנוּ signifique literalmente “deram”, o hebraico descreve a apropriação da terra em benefício próprio; “tomaram para si” torna essa relação clara em português, e מוֹרָשָׁה é aqui uma posse apropriada, não necessariamente uma herança legítima.
- source_word: בְּשִׂמְחַת כָּל לֵבָב
  choice: com alegria de todo o coração
  rationale: Conserva a imagem hebraica do coração inteiro e expressa a satisfação plena dos agentes.
- source_word: בִּשְׁאָט נֶפֶשׁ
  choice: com profundo desprezo
  rationale: שְׁאָט indica desprezo ou desdém, e נֶפֶשׁ intensifica a atitude interior; a formulação é natural sem perder a força emocional.
- source_word: לְמַעַן מִגְרָשָׁהּ לָבַז
  choice: a fim de entregar suas terras abertas ao saque
  rationale: Entende מִגְרָשָׁהּ como “suas terras abertas/pastagens” e לָבַז como destinação ao saque. Como a construção hebraica é difícil, a ambiguidade é registrada em nota.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “Yahweh” representa diretamente o nome da aliança, enquanto “Senhor” traduz o título אֲדֹנָי; a alternativa segue uma convenção tradicional, mas encobre o nome próprio.
- issue: Valor de קִנְאָה aplicado a Deus
  choice: zelo
  alternative: ciúme
  rationale: “Zelo” comunica a paixão exclusiva e judicial de Yahweh sem sugerir insegurança humana; “ciúme” preservaria mais diretamente a dimensão relacional e continua sendo uma leitura legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A sintaxe profética solene e a metáfora do fogo foram preservadas; construções hebraicas obscuras foram esclarecidas apenas o necessário e acompanhadas de nota.
