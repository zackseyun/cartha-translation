reference: Ezekiel 36:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הוֹשַׁעְתִּ֣י אֶתְ/כֶ֔ם מִ/כֹּ֖ל טֻמְאֽוֹתֵי/כֶ֑ם וְ/קָרָ֤אתִי אֶל הַ/דָּגָן֙ וְ/הִרְבֵּיתִ֣י אֹת֔/וֹ וְ/לֹא אֶתֵּ֥ן עֲלֵי/כֶ֖ם רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/029.yaml
  text: I will save you from all your uncleannesses[a], and I will call for the grain and multiply it[b], and I will not bring famine upon you.
translation:
  language: pt
  text: Eu os salvarei de todas as suas impurezas[a]. Chamarei o cereal e o tornarei abundante[b], e não trarei fome sobre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de todas as suas contaminações” ou “de todas as suas imundícies”. O hebraico emprega linguagem de impureza que pode abranger tanto o âmbito ritual quanto o moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “convocarei o cereal e o multiplicarei”. O hebraico retrata Deus chamando o cereal, ressaltando seu domínio soberano sobre a abundância agrícola.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Eu os salvarei
  rationale: O hifil de ישׁע expressa a ação divina de livrar o povo. “Salvarei” é direto, natural e conserva a força teológica sem especificar indevidamente o modo do livramento.
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: de todas as suas impurezas
  rationale: טֻמְאָה pode abranger impureza ritual e moral em Ezequiel. “Impurezas” mantém o plural e essa amplitude sem reduzir o sentido apenas a pecados ou a contaminações cerimoniais.
- source_word: וְקָרָאתִי אֶל הַדָּגָן
  choice: Chamarei o cereal
  rationale: קרא אל retrata Deus chamando ou convocando a produção agrícola. A formulação conserva a personificação e o domínio soberano de Deus sobre a abundância da terra.
- source_word: הַדָּגָן
  choice: o cereal
  rationale: דגן designa genericamente a produção de grãos, não uma espécie específica. “Cereal” comunica essa abrangência em português corrente.
- source_word: וְהִרְבֵּיתִי אֹתוֹ
  choice: e o tornarei abundante
  rationale: O hifil de רבה significa fazer aumentar ou tornar abundante. Esta escolha é natural em português e evita a possível estranheza de “multiplicarei o cereal”.
- source_word: וְלֹא אֶתֵּן עֲלֵיכֶם רָעָב
  choice: e não trarei fome sobre vocês
  rationale: נתן על com רָעָב é uma expressão idiomática para impor ou trazer fome. A tradução preserva a agência divina e soa clara em português moderno.
theological_decisions:
- issue: Natureza da salvação no contexto
  choice: Livramento histórico e pactual da impureza e de suas consequências, com ressonância teológica mais ampla
  alternative: Salvação primordialmente espiritual do pecado; ou purificação exclusivamente ritual
  rationale: Ezequiel 36 reúne purificação, coração e espírito novos, restauração da terra e bênção agrícola. “Salvarei” mantém essa amplitude sem restringir o texto a uma categoria doutrinária posterior.
- issue: Terminologia de impureza
  choice: Manter a linguagem abrangente de impureza
  alternative: Resolver o termo como apenas “pecados”, “contaminações rituais” ou “imundícies”
  rationale: O termo hebraico pode incluir poluição ritual e moral em Ezequiel; “impurezas” preserva essa tensão genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” torna explícito o plural hebraico; “cereal” evita restringir דגן a uma cultura específica. A personificação em “Chamarei o cereal” foi preservada, com explicação em nota.
