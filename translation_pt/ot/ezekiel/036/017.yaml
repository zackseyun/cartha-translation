  text: בֶּן אָדָ֗ם בֵּ֤ית יִשְׂרָאֵל֙ יֹשְׁבִ֣ים עַל אַדְמָתָ֔/ם וַ/יְטַמְּא֣וּ אוֹתָ֔/הּ בְּ/דַרְכָּ֖/ם וּ/בַ/עֲלִֽילוֹתָ֑/ם כְּ/טֻמְאַת֙ הַ/נִּדָּ֔ה הָיְתָ֥ה דַרְכָּ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/017.yaml
  text: Son of man[a], when the house of Israel was dwelling on their own land, they defiled it by their way and by their deeds; their way before me was like the uncleanness of a menstruating woman.
translation:
  language: pt
  text: Filho do homem, quando a casa de Israel habitava em sua terra, eles a tornaram impura com sua conduta e suas ações. Diante de mim, a conduta deles era como a impureza da menstruação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como a impureza menstrual» ou «como a impureza de uma mulher menstruada». O hebraico compara a conduta de Israel à impureza ritual associada à menstruação.'
    reason: alternativa lexical e esclarecimento cultural
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma de tratamento profética característica de Ezequiel e sua continuidade literária.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico, em linguagem bíblica ainda compreensível.
- source_word: יֹשְׁבִים עַל אַדְמָתָם
  choice: habitava em sua terra
  rationale: O particípio indica residência contínua; o singular concorda naturalmente em português com o coletivo «casa de Israel».
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: eles a tornaram impura
  rationale: Conserva o campo ritual e moral de טמא e deixa claro que o referente feminino é a terra.
- source_word: בְּדַרְכָּם וּבַעֲלִילוֹתָם
  choice: com sua conduta e suas ações
  rationale: «Conduta» comunica naturalmente o uso metafórico de דרך, enquanto «ações» traduz de modo direto עלילות.
- source_word: כְּטֻמְאַת הַנִּדָּה
  choice: como a impureza da menstruação
  rationale: Explicita sem eufemismo a imagem hebraica de impureza ritual ligada à menstruação, sem atribuir impureza moral à mulher.
- source_word: הָיְתָה דַרְכָּם לְפָנָי
  choice: Diante de mim, a conduta deles era
  rationale: Preserva a ideia da presença e avaliação divinas expressa por לְפָנַי, com ordem natural em português.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: Preservar a comparação com a impureza ritual da menstruação como metáfora da conduta de Israel.
  alternative: Generalizar como «sujeira» ou «poluição», omitindo a referência menstrual.
  rationale: O texto emprega deliberadamente uma categoria cultual para descrever a profanação moral da terra; a tradução não deve suavizar nem transformar a comparação.
- issue: Força temporal da oração inicial
  choice: Introduzir «quando» para tornar explícita em português a função circunstancial do particípio.
  alternative: 'Manter uma construção participial rígida: «a casa de Israel, habitando em sua terra».'
  rationale: A oração participial hebraica estabelece o cenário temporal da ação seguinte; «quando» expressa essa relação sem acrescentar conteúdo teológico.
- issue: Referente da impureza comparada
  choice: Formular «impureza da menstruação», indicando uma condição ritual.
  alternative: «Impureza de uma mulher menstruada», que pode soar como uma afirmação depreciativa sobre a mulher.
  rationale: A formulação escolhida conserva a categoria levítica e o ponto da analogia, evitando sugerir que a menstruação constitua culpa moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém «Filho do homem» e «casa de Israel» por sua relevância literária, mas prefere «conduta» a um literalismo pouco natural como «caminho». O pronome explícito «eles» retoma o coletivo e evita ambiguidade na passagem para o plural.
