  text: וָ/אֶשְׁפֹּ֤ךְ חֲמָתִ/י֙ עֲלֵי/הֶ֔ם עַל הַ/דָּ֖ם אֲשֶׁר שָׁפְכ֣וּ עַל הָ/אָ֑רֶץ וּ/בְ/גִלּוּלֵי/הֶ֖ם טִמְּאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/018.yaml
  text: So I poured out my wrath upon them for the blood that they had poured out on the land[a], and because they had defiled it with their idols.
translation:
  language: pt
  text: Por isso, derramei sobre eles a minha ira, por causa do sangue que derramaram sobre a terra e porque a contaminaram com os seus ídolos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é fortemente depreciativo. Sua etimologia é debatida, mas pode evocar algo repugnante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: derramei
  rationale: O verbo שׁפך descreve o ato de derramar e é usado aqui metaforicamente para a ira; a escolha também preserva a repetição da mesma raiz na referência ao sangue.
- source_word: חֲמָתִי
  choice: a minha ira
  rationale: חֵמָה designa ardor, furor ou ira, especialmente em contextos de juízo divino. “Ira” mantém o tom solene e judicial.
- source_word: עַל הַדָּם אֲשֶׁר שָׁפְכוּ
  choice: por causa do sangue que derramaram
  rationale: “Por causa de” explicita o valor causal de עַל, enquanto “derramaram” conserva a repetição hebraica de שׁפך, embora “sangue que derramaram” seja uma formulação mais solene que a expressão corrente “sangue que derramaram/derramamento de sangue”.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: No contexto, הָאָרֶץ se refere provavelmente à terra de Israel. “A terra” preserva esse sentido territorial, e “sobre” reproduz a imagem do sangue derramado sobre ela.
- source_word: וּבְגִלּוּלֵיהֶם
  choice: e porque ... com os seus ídolos
  rationale: A construção liga uma segunda causa do juízo à primeira. “Ídolos” é clara no texto principal; uma nota registra a força depreciativa incomum de גִּלּוּלִים.
- source_word: טִמְּאוּהָ
  choice: a contaminaram
  rationale: O Piel de טמא significa tornar impuro ou profanar. “Contaminaram” comunica de modo natural a poluição religiosa e moral da terra; o pronome feminino retoma “a terra”.
theological_decisions:
- issue: Natureza da linguagem do juízo divino
  choice: '“a minha ira”, com as duas causas do juízo expressas: o sangue derramado e a contaminação por ídolos'
  alternative: “o meu furor” ou “a minha fúria”
  rationale: “Ira” mantém o caráter solene e judicial da resposta divina, sem reduzir a expressão a uma emoção impulsiva nem suavizar o juízo.
- issue: Referente de הָאָרֶץ
  choice: “a terra”
  alternative: “a Terra” ou “o país”
  rationale: O contexto de Ezequiel aponta para a terra de Israel, não para o planeta inteiro. “A terra” conserva a formulação bíblica e o tema territorial da aliança sem tornar explícito mais do que o hebraico.
- issue: Relação entre os dois fundamentos do juízo
  choice: “por causa ... e porque”
  alternative: tratar apenas a primeira expressão como causal e a segunda como simples instrumento
  rationale: 'A redação portuguesa deixa claros os dois motivos paralelos apresentados pelo versículo: o sangue derramado sobre a terra e sua contaminação mediante os ídolos.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “derramei/derramaram” conserva o jogo verbal hebraico. O marcador [a] foi colocado imediatamente após “ídolos”, termo ao qual a nota se refere.
