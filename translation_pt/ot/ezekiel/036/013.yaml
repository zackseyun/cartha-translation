    rationale: O texto hebraico traz literalmente «dizem a vocês». Embora a acusação diga respeito à terra, «a respeito de» altera a relação sintática expressa pelo dativo.
  - severity: medium
    issue: Alternância não esclarecida entre «vocês» e «Você»
    rationale: O hebraico combina לָכֶם, plural, com predicados femininos singulares dirigidos à terra. Em português, a alternância literal de pronomes soa como incoerência. Nomear a terra na fala citada preserva a referência e torna a construção legível.
