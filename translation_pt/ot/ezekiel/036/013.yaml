base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/013.yaml
  text: 'Thus says the Lord GOD: Because they say of you[b][a], ‘You devour people and have bereaved your nation,’'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Visto que dizem a vocês: ‘A terra devora pessoas[a] e tem privado sua nação de filhos[b],’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente, “devoradora de ser humano”; “ser humano” tem aqui sentido coletivo: pessoas ou humanidade.'
    reason: lexical_alternative
  - marker: b
    text: Ou “tem deixado sua nação sem filhos” ou “tem enlutado seu povo pela perda de filhos”.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה
  choice: Assim
  rationale: Mantém a fórmula profética tradicional em português corrente e digno.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título divino e representa o nome da aliança יהוה como Yahweh, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz com naturalidade a oração causal que fundamenta a declaração divina.
- source_word: אֹמְרִים לָכֶם
  choice: dizem a respeito de vocês
  rationale: O לָכֶם é plural e, no contexto, introduz o que se diz acerca dos montes ou da terra; “a respeito de” comunica melhor essa função do que o literal “a vocês”.
- source_word: אֹכֶלֶת אָדָם
  choice: Você devora pessoas
  rationale: O particípio feminino retrata a terra como devoradora de seus habitantes; “pessoas” expressa o sentido coletivo de אָדָם em português natural.
- source_word: וּמְשַׁכֶּלֶת גּוֹיִךְ הָיִית
  choice: e tem deixado sua nação sem filhos
  rationale: שׁכל no piel denota privar de filhos ou deixar sem filhos. O perfeito הָיִית sustenta aqui uma acusação com efeito persistente, bem expresso por “tem deixado”.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha conserva o título אֲדֹנָי e translitera explicitamente o nome da aliança יהוה, sem confundir os dois termos.
- issue: Agente da perda de filhos em וּמְשַׁכֶּלֶת
  choice: a terra deixa sua nação sem filhos
  alternative: a terra causa abortos em sua nação
  rationale: O verbo pode ser usado para aborto ou perda de filhos, mas o contexto acusa a terra de consumir sua população; a formulação mais ampla preserva essa tensão sem restringir o sentido a abortos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A mudança do plural “vocês” para o singular feminino “você” acompanha a mudança gramatical do hebraico, que passa dos destinatários coletivos à terra personificada. As marcas [a] e [b] aparecem junto às expressões que esclarecem.
