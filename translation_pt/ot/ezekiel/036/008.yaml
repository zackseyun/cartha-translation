  text: וְ/אַתֶּ֞ם הָרֵ֤י יִשְׂרָאֵל֙ עַנְפְּ/כֶ֣ם תִּתֵּ֔נוּ וּ/פֶרְיְ/כֶ֥ם תִּשְׂא֖וּ לְ/עַמִּ֣/י יִשְׂרָאֵ֑ל כִּ֥י קֵרְב֖וּ לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/008.yaml
  text: But you[a], mountains of Israel, shall put forth your branches and bear your fruit for my people Israel, for they are about to come.
translation:
  language: pt
  text: Mas vocês, montes de Israel, farão brotar seus ramos e produzirão seus frutos para o meu povo Israel, pois eles estão prestes a vir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois sua vinda está próxima”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: montes de Israel
  rationale: O construto designa literalmente os montes de Israel, personificando a terra, como ocorre repetidamente em Ezequiel.
- source_word: עַנְפְּכֶם תִּתֵּנוּ
  choice: farão brotar os seus ramos
  rationale: Embora נָתַן signifique literalmente “dar”, com “ramos” a expressão natural em português é “fazer brotar”, preservando a imagem de renovação vegetal.
- source_word: וּפֶרְיְכֶם תִּשְׂאוּ
  choice: produzirão os seus frutos
  rationale: נָשָׂא é literalmente “carregar/levar”, mas, em associação com frutos, significa produzi-los. A formulação mantém o paralelismo e soa natural em português.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: para o meu povo Israel
  rationale: A preposição לְ indica benefício ou destinação, e a tradução conserva tanto o possessivo da aliança quanto Israel em aposição a “meu povo”.
- source_word: כִּי קֵרְבוּ לָבוֹא
  choice: pois eles estão prestes a voltar
  rationale: A construção indica que o povo está próximo de vir. “Voltar” explicita naturalmente, no contexto do exílio e da terra, o movimento de retorno sem alterar o referente.
theological_decisions:
- issue: Referente do plural em קֵרְבוּ e sentido de לָבוֹא
  choice: O plural se refere ao “meu povo Israel”, e sua vinda é expressa como retorno à terra.
  alternative: 'Entender impessoalmente: “pois está próxima a sua vinda” ou, mais literalmente, “pois estão perto de vir”.'
  rationale: “Meu povo Israel” é o antecedente plural mais próximo e natural. O contexto trata da restauração da terra em vista do regresso dos exilados; ainda assim, a nota preserva a formulação nominal alternativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A coordenação futura mantém o tom profético; “vocês” corresponde ao pronome plural enfático dirigido aos montes personificados.
