base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/012.yaml
  text: And I will cause people—my people Israel—to walk upon you[a], and they will possess you, and you will be their inheritance[c][b], and you will no longer bereave them.
translation:
  language: pt
  text: Farei com que pessoas — o meu povo Israel — caminhem sobre vocês[a]. Elas tomarão posse de vocês[b], e vocês serão a herança delas; nunca mais as privarão de seus filhos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Trarei pessoas sobre vocês, isto é, o meu povo Israel”. Em hebraico, literalmente: “Farei o ser humano caminhar sobre vocês”; “o meu povo Israel” identifica quem está em vista.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Elas herdarão vocês”. O verbo hebraico pode significar tanto “tomar posse” como “herdar” em contextos relacionados à terra.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “nunca mais as tornarão sem filhos” ou “nunca mais as privarão de filhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: Farei com que ... caminhem
  rationale: O hifil de הלך tem força causativa. A formulação preserva essa força e, com 'sobre vocês', retrata o povo voltando a percorrer e habitar a terra.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: O referente são os montes de Israel, tratados no plural no contexto; por isso, o plural 'vocês' preserva a concordância e a personificação hebraicas.
- source_word: אָדָם
  choice: pessoas
  rationale: O singular coletivo אָדָם é especificado pela aposição 'o meu povo Israel'. 'Pessoas' comunica naturalmente o sentido coletivo sem ampliar o referente a toda a humanidade.
- source_word: אֶת עַמִּי יִשְׂרָאֵל
  choice: o meu povo Israel
  rationale: A expressão identifica as pessoas mencionadas anteriormente. Os travessões tornam clara essa relação explicativa.
- source_word: וִירֵשׁוּךָ
  choice: tomarão posse de vocês
  rationale: ירשׁ pode significar possuir ou herdar, sobretudo em contextos de terra. 'Tomar posse' é natural em português e mantém aberta em nota a alternativa 'herdar'.
- source_word: וְהָיִיתָ לָהֶם לְנַחֲלָה
  choice: vocês serão a herança delas
  rationale: נַחֲלָה é o termo corrente para 'herança'. Mantê-lo preserva a ressonância da terra concedida a Israel e o vínculo lexical com ירשׁ.
- source_word: וְלֹא תוֹסִף עוֹד
  choice: nunca mais
  rationale: A combinação hebraica intensifica a cessação e a não repetição. 'Nunca mais' expressa isso de modo idiomático, sem a redundância artificial de 'não mais novamente'.
- source_word: לְשַׁכְּלָם
  choice: as deixarão sem filhos
  rationale: O piel de שׁכל significa causar perda de filhos, tornar sem filhos ou desfilhar. A formulação explicita em português atual o sentido concreto do verbo.
theological_decisions:
- issue: Terminologia da terra como herança da aliança
  choice: vocês serão a herança delas
  alternative: vocês serão propriedade delas
  rationale: ‘Herança’ preserva a linguagem teológica e pactual ligada à concessão da terra a Israel, em vez de reduzir a frase à mera propriedade.
- issue: Personificação da terra e dos montes
  choice: vocês ... as deixarão sem filhos
  alternative: a terra ... os privará de seus filhos
  rationale: O texto se dirige diretamente aos montes de Israel no plural. Preservar a segunda pessoa mantém a força retórica e a personificação do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural 'vocês' preserva o destinatário plural hebraico — os montes de Israel —, enquanto pronomes femininos retomam 'pessoas'. A ordem dos marcadores segue a ordem das expressões anotadas no texto.
