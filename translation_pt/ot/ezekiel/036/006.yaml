review_pass:
  verdict: revise
  source_fidelity: A sequência e os principais termos hebraicos estão bem representados. Contudo, אֲפִיקִים designa canais, leitos ou ravinas, sem especificar rios; e a construção «a humilhação imposta pelas nações» resolve explicitamente uma relação que o genitivo «desonra das nações» deixa mais aberta.
  naturalness: O português é claro e mantém um registro profético apropriado. «Ravinas» é uma designação natural do relevo e evita a especificação indevida de «leitos dos rios».
  terminology: «Zelo», «furor» e «Senhor DEUS» preservam adequadamente a força e a distinção dos termos do texto-base. «Desonra das nações» reproduz de modo mais próximo e menos interpretativo o genitivo hebraico.
  issues:
  - severity: medium
    issue: «leitos dos rios» especifica «rios» em אֲפִיקִים.
    rationale: O hebraico refere-se a canais/cursos encaixados ou ravinas e não contém um termo para «rios». No elenco de acidentes geográficos, «ravinas» é uma tradução direta e idiomática.
  - severity: medium
    issue: «a humilhação imposta pelas nações» explicita o agente da desonra.
    rationale: Embora o contexto favoreça desonra causada pelas nações, כְּלִמַּת גּוֹיִם é literalmente uma construção genitiva. «A desonra das nações» mantém a concisão e a margem de relação semântica do original.
