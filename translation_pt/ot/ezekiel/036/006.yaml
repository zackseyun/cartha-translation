  text: לָ/כֵ֕ן הִנָּבֵ֖א עַל אַדְמַ֣ת יִשְׂרָאֵ֑ל וְ/אָמַרְתָּ֡ לֶ/הָרִ֣ים וְ֠/לַ/גְּבָעוֹת לָ/אֲפִיקִ֨ים וְ/לַ/גֵּאָי֜וֹת כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י בְ/קִנְאָתִ֤/י וּ/בַ/חֲמָתִ/י֙ דִּבַּ֔רְתִּי יַ֛עַן כְּלִמַּ֥ת גּוֹיִ֖ם נְשָׂאתֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/006.yaml
  text: 'Therefore prophesy concerning the land of Israel, and say to the mountains and the hills, to the ravines and the valleys, ‘Thus says the Lord GOD: Look, I have spoken in my jealousy and in my wrath, because you have borne the disgrace of the nations.’'
translation:
  language: pt
  text: 'Portanto, profetize a respeito da terra de Israel e diga aos montes e às colinas, às ravinas e aos vales: “Assim diz o Senhor DEUS: Eis que falei no meu zelo e no meu furor, porque vocês suportaram a desonra das nações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Preserva a conexão lógica explícita com o contexto anterior.
- source_word: אֲפִיקִים
  choice: leitos dos rios
  rationale: O termo designa canais ou leitos por onde correm águas; esta formulação é natural em português e o distingue de גֵּאָיוֹת.
- source_word: גֵּאָיוֹת
  choice: vales
  rationale: Equivalente corrente e adequado para as depressões do terreno às quais a profecia se dirige.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Conserva a partícula enfática e de chamada de atenção em registro bíblico digno, ainda compreensível.
- source_word: קִנְאָתִי
  choice: meu zelo
  rationale: Preserva a amplitude do hebraico, que neste contexto comunica ardor zeloso, sem reduzi-lo apenas a ciúme humano.
- source_word: חֲמָתִי
  choice: meu furor
  rationale: Expressa a intensidade da ira divina indicada pelo substantivo hebraico e evita fundi-lo com o termo anterior.
- source_word: כְּלִמַּת גּוֹיִם
  choice: a humilhação imposta pelas nações
  rationale: 'Torna clara a relação contextual: a terra suportou a desonra proveniente das nações, sem sugerir que a vergonha pertencia moralmente a elas.'
- source_word: נְשָׂאתֶם
  choice: vocês suportaram
  rationale: Mantém o plural dirigido aos acidentes geográficos personificados e o sentido de carregar ou suportar.
theological_decisions:
- issue: Nome/título divino אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  alternative: Soberano SENHOR; Senhor Yahweh
  rationale: Mantém a distinção tradicional entre Adonai e o Tetragrama por meio da tipografia, sem inserir uma opção confessional específica para a vocalização do nome.
- issue: Linguagem antropopática de zelo e furor
  choice: Preservar literalmente “meu zelo e meu furor”
  alternative: Suavizar como “minha indignação”
  rationale: O texto apresenta dois termos distintos e teologicamente fortes; a tradução não deve atenuar nem harmonizar essa tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém solenidade profética sem arcaísmos desnecessários; usa “vocês” porque os referentes personificados são plurais. A ordem das quatro formas do relevo segue o hebraico.
