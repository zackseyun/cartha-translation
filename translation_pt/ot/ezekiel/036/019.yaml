  text: וָ/אָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וַ/יִּזָּר֖וּ בָּ/אֲרָצ֑וֹת כְּ/דַרְכָּ֥/ם וְ/כַ/עֲלִילוֹתָ֖/ם שְׁפַטְתִּֽי/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/019.yaml
  text: So I scattered them among the nations[a], and they were dispersed through the lands; I judged them according to their ways and according to their deeds.
translation:
  language: pt
  text: Eu os espalhei entre as nações, e eles foram dispersos por diversas terras. Eu os julguei de acordo com os seus caminhos e as suas ações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָפִיץ
  choice: Eu os espalhei
  rationale: 'O hifil de פוץ expressa ação causativa: Deus fez com que fossem espalhados. A formulação é natural em português e mantém explícita a agência divina.'
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: No contexto do exílio, גּוֹיִם designa as nações estrangeiras entre as quais Israel foi espalhado. “Nações” evita associações posteriores que “gentios” poderia introduzir.
- source_word: וַיִּזָּרוּ
  choice: eles foram dispersos
  rationale: A forma passiva descreve o resultado da ação anterior e preserva a sobreposição semântica entre os dois verbos, evitando repetição estilística excessiva.
- source_word: בָּאֲרָצוֹת
  choice: por diversas terras
  rationale: O plural אֲרָצוֹת indica múltiplos territórios. “Por diversas terras” comunica naturalmente em português o sentido distributivo da dispersão.
- source_word: כְּדַרְכָּם
  choice: de acordo com os seus caminhos
  rationale: Mantém a metáfora profética de דֶּרֶךְ para o modo de vida ou a conduta, em linguagem compreensível e digna.
- source_word: וְכַעֲלִילוֹתָם
  choice: e as suas ações
  rationale: עֲלִילוֹת refere-se a atos ou feitos com dimensão moral. “Ações” é claro e natural, sem acrescentar uma avaliação não expressa pelo substantivo isoladamente.
- source_word: שְׁפַטְתִּים
  choice: Eu os julguei
  rationale: Preserva o sentido judicial básico de שׁפט. “Castiguei” restringiria o verbo à aplicação da pena, enquanto o hebraico apresenta a ação como julgamento conforme a conduta.
theological_decisions:
- issue: Relação entre o juízo divino e o exílio
  choice: A tradução atribui explicitamente a Deus tanto o espalhamento quanto o julgamento.
  alternative: Dar maior destaque ao estado passivo de dispersão, reduzindo a ênfase na agência divina.
  rationale: A primeira pessoa em וָאָפִיץ e שְׁפַטְתִּים torna explícita a agência de Deus. A tradução conserva essa afirmação e também a forma passiva da segunda oração, sem ampliar a explicação teológica além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; mantém o paralelismo profético e distingue “espalhei” de “foram dispersos”. Não foi incluída nota, pois “por diversas terras” incorpora de modo claro o plural e o valor distributivo de בָּאֲרָצוֹת.
