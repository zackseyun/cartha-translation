  text: וְ/אֶת רוּחִ֖/י אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וְ/עָשִׂ֗יתִי אֵ֤ת אֲשֶׁר בְּ/חֻקַּ/י֙ תֵּלֵ֔כוּ וּ/מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/027.yaml
  text: And I will put my Spirit within you[a], and I will cause you to walk in my statutes[b], and you will keep my judgments and do them.
translation:
  language: pt
  text: Porei o meu Espírito dentro de vocês e farei com que andem segundo os meus estatutos[a]. Vocês guardarão os meus juízos[b] e os praticarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus decretos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “minhas ordenanças” ou “minhas normas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: o meu Espírito
  rationale: No contexto da restauração e do novo coração (Ez 36:26), רוּחִי se refere ao próprio Espírito de Deus, não a vento ou respiração. A inicial maiúscula torna claro esse referente divino em português.
- source_word: בְּקִרְבְּכֶם
  choice: dentro de vocês
  rationale: A expressão indica o interior ou o íntimo dos destinatários. “Dentro de vocês” comunica com naturalidade a transformação interior e mantém o plural coletivo do hebraico.
- source_word: וְעָשִׂיתִי אֵת אֲשֶׁר
  choice: farei com que
  rationale: Neste enunciado, a construção com עשה expressa que Deus fará acontecer a conduta descrita a seguir. A formulação preserva sua forte agência sem explicar além do texto.
- source_word: בְּחֻקַּי תֵּלֵכוּ
  choice: andem segundo os meus estatutos
  rationale: “Andar” conserva a metáfora hebraica de conduta, enquanto “segundo” expressa de modo natural em português a ideia de viver em conformidade com os estatutos.
- source_word: חֻקַּי
  choice: meus estatutos
  rationale: חֻקִּים designa prescrições estabelecidas. “Estatutos” preserva o tom jurídico e distingue o termo de מִשְׁפָּטִים na oração seguinte.
- source_word: מִשְׁפָּטַי
  choice: meus juízos
  rationale: מִשְׁפָּטִים pode indicar decisões judiciais, normas ou ordenanças. “Juízos” mantém a nuance jurídica e a distinção lexical em relação a “estatutos”.
- source_word: תִּשְׁמְרוּ
  choice: guardarão
  rationale: Em contexto legal e pactual, שׁמר significa guardar ou observar. “Guardarão” mantém a imagem do original e é inteligível no registro bíblico moderno.
- source_word: וַעֲשִׂיתֶם
  choice: os praticarão
  rationale: O verbo final destaca a execução concreta dos juízos. “Os praticarão” evita a possível rigidez de “os farão” e preserva a progressão entre guardar e realizar.
theological_decisions:
- issue: Agência divina e obediência humana
  choice: farei com que andem segundo os meus estatutos
  alternative: farei que vocês vivam de acordo com os meus estatutos
  rationale: O hebraico apresenta a ação eficaz de Deus como causa da obediência do povo e, em seguida, descreve o próprio povo guardando e praticando seus juízos. A tradução conserva ambos os aspectos sem os enquadrar em um sistema doutrinário posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” explicita que os sufixos e verbos hebraicos estão no plural. A metáfora bíblica de “andar” foi preservada, e os termos jurídicos חֻקִּים e מִשְׁפָּטִים foram distinguidos como “estatutos” e “juízos”.
