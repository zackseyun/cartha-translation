  text: וְ/לָקַחְתִּ֤י אֶתְ/כֶם֙ מִן הַ/גּוֹיִ֔ם וְ/קִבַּצְתִּ֥י אֶתְ/כֶ֖ם מִ/כָּל הָ/אֲרָצ֑וֹת וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/024.yaml
  text: For I will take you from the nations[a], and gather you from all the lands[c][b], and bring you into your own land.
translation:
  language: pt
  text: Pois eu os tirarei dentre as nações, os reunirei de todas as terras e os levarei para a terra de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: eu os tirarei
  rationale: Neste contexto de restauração, לקח descreve a ação deliberada de Deus ao retirar o povo do meio das nações. “Tirarei” comunica naturalmente em português tanto a iniciativa divina quanto o ponto de origem expresso em seguida.
- source_word: מִן הַגּוֹיִם
  choice: dentre as nações
  rationale: גּוֹיִם significa aqui as nações estrangeiras entre as quais Israel foi disperso. “Dentre as nações” explicita de modo natural o sentido separativo de מִן sem recorrer a “gentios”, que poderia deslocar a ênfase geopolítica.
- source_word: וְקִבַּצְתִּי
  choice: os reunirei
  rationale: קבץ é um verbo característico da reunião de pessoas dispersas. “Reunirei” preserva esse sentido e soa natural no contexto da restauração do exílio.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: de todas as terras
  rationale: O plural אֲרָצוֹת designa as diversas terras onde o povo estava disperso. “Terras” mantém a correspondência lexical e a amplitude geográfica do hebraico; “países” também seria possível.
- source_word: וְהֵבֵאתִי
  choice: e os levarei
  rationale: No hifil, בוא significa fazer vir, trazer ou levar. Como o movimento é descrito da perspectiva dos destinatários rumo à terra deles, “levarei” é idiomático em português e não acrescenta o advérbio “de volta”, ausente do hebraico.
- source_word: אֶל אַדְמַתְכֶם
  choice: para a terra de vocês
  rationale: אַדָמָה pode significar solo, chão ou terra; aqui designa a terra natal de Israel. “A terra de vocês” expressa diretamente o sufixo possessivo e evita tornar mais explícita do que o original uma ideia de propriedade com “sua própria terra”.
theological_decisions:
- issue: Restauração e relação do povo com a terra
  choice: para a terra de vocês
  alternative: para a própria terra de vocês
  rationale: A tradução preserva a relação possessiva expressa pelo sufixo hebraico sem desenvolver essa relação em uma formulação teológica mais específica. O versículo afirma a ação divina de reunir e conduzir o povo à terra associada a ele, deixando o contexto mais amplo definir a natureza dessa relação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição dos pronomes mantém explícitos os objetos dos três verbos, enquanto a sequência coordenada reproduz o ritmo enfático das ações divinas no hebraico.
