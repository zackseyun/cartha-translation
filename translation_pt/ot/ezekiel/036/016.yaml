  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה אלי, «veio» expressa de modo natural em português a chegada da revelação ao profeta, evitando o literalismo pouco idiomático «foi para mim».
- source_word: דְבַר
  choice: a palavra
  rationale: Neste contexto, דָּבָר designa a palavra ou mensagem divina. «A palavra» mantém a formulação profética tradicional e continua clara no português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto hebraico traz diretamente o tetragrama, nome pessoal divino; a transliteração «Yahweh» preserva essa distinção em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo de primeira pessoa identifica o profeta como destinatário da revelação; «a mim» é direto e natural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo לֵאמֹר introduz o conteúdo da fala divina. «Dizendo» preserva formalmente a ligação com a declaração que vem a seguir.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega o tetragrama, o texto principal conserva o nome mediante a transliteração «Yahweh», sem trocá-lo por um título ou adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada ao uso natural do português, sem perda de nenhum elemento da fórmula profética hebraica.
