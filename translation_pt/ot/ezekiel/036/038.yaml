  text: כְּ/צֹ֣אן קָֽדָשִׁ֗ים כְּ/צֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּ/מ֣וֹעֲדֶ֔י/הָ כֵּ֤ן תִּהְיֶ֨ינָה֙ הֶ/עָרִ֣ים הֶ/חֳרֵב֔וֹת מְלֵא֖וֹת צֹ֣אן אָדָ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/038.yaml
  text: Like the holy flock[a], like the flock of Jerusalem at her appointed feasts, so the ruined cities will be filled with flocks of people. Then they will know that I am Yahweh.
translation:
  language: pt
  text: Como o rebanho consagrado[a], como o rebanho de Jerusalém nas suas festas determinadas, assim as cidades em ruínas ficarão cheias de rebanhos de gente. Então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «rebanho santo» ou «rebanho de animais consagrados». O hebraico pode referir-se a um rebanho destinado ao uso sagrado; o paralelo com Jerusalém em suas festas evoca os animais sacrificiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֹאן קָדָשִׁים
  choice: Como o rebanho consagrado
  rationale: צֹאן é um coletivo para animais de pequeno porte, aqui naturalmente “rebanho”; קָדָשִׁים indica seu caráter consagrado, provavelmente sacrificial, no contexto das festas de Jerusalém.
- source_word: כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶיהָ
  choice: como o rebanho de Jerusalém nas suas festas marcadas
  rationale: מוֹעֵד designa tempos determinados e, em contexto cultual, festas fixadas. “Festas marcadas” conserva tanto a ideia de calendário estabelecido quanto o contexto religioso; “suas” retoma Jerusalém.
- source_word: הֶעָרִים הֶחֳרֵבוֹת
  choice: as cidades em ruínas
  rationale: חֳרֵבוֹת descreve cidades devastadas ou desoladas; “em ruínas” é corrente e concreto em português.
- source_word: מְלֵאוֹת צֹאן אָדָם
  choice: ficarão cheias de rebanhos de gente
  rationale: A expressão literal “rebanho(s) de ser humano/gente” compara a população multiplicada aos numerosos animais consagrados reunidos em Jerusalém. “Rebanhos de gente” mantém a metáfora incomum sem restringir אָדָם ao sexo masculino.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: O waw introduz aqui o resultado do repovoamento prometido; “então” expressa essa consequência de modo natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o nome próprio divino; “Yahweh” preserva essa distinção em relação ao título אֲדֹנָי.
- issue: Sentido cultual de קָדָשִׁים
  choice: rebanho consagrado
  alternative: rebanho dos santos
  rationale: O paralelismo com os rebanhos de Jerusalém durante as festas favorece animais separados para uso sagrado ou sacrificial, não um grupo de pessoas santas.
- issue: Referência humana genérica de אָדָם
  choice: gente
  alternative: homens
  rationale: אָדָם refere-se coletivamente a seres humanos no interior da metáfora. “Gente” é genérico, natural e não acrescenta uma limitação masculina ausente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção correlativa “Como... assim...” e a imagem de “rebanhos de gente” preservam a forma e a tensão metafórica do hebraico.
