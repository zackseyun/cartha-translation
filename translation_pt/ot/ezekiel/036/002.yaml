  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן אָמַ֧ר הָ/אוֹיֵ֛ב עֲלֵי/כֶ֖ם הֶאָ֑ח וּ/בָמ֣וֹת עוֹלָ֔ם לְ/מֽוֹרָשָׁ֖ה הָ֥יְתָה לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/002.yaml
  text: 'Thus says the Lord GOD: Because the enemy said against you, ‘Aha!’ and, ‘The ancient heights have become our possession,’'
translation:
  language: pt
  text: 'Assim diz o Senhor DEUS: Visto que o inimigo disse a respeito de vocês: ‘Ah! E os antigos lugares altos se tornaram nossa propriedade’,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  rationale: Mantém a distinção tradicional entre o título אֲדֹנָי e o nome divino יהוה, representado por DEUS em versaletes.
- source_word: הָאוֹיֵב
  choice: o inimigo
  rationale: Tradução direta do substantivo singular coletivo, que no contexto representa os povos hostis.
- source_word: הֶאָח
  choice: Ah!
  rationale: Interjeição de satisfação maliciosa ou triunfo; a forma breve preserva sua força sem explicá-la em excesso.
- source_word: בָמוֹת עוֹלָם
  choice: os antigos lugares altos
  rationale: עוֹלָם pode indicar longa antiguidade ou duração indefinida; aqui, ligado a lugares geográficos reivindicados pelo inimigo, ‘antigos’ comunica melhor o sentido contextual sem sugerir necessariamente eternidade.
- source_word: לְמוֹרָשָׁה הָיְתָה לָּנוּ
  choice: se tornaram nossa propriedade
  rationale: Expressa a passagem à posse reivindicada; o plural em português concorda naturalmente com ‘lugares altos’, embora o hebraico use construção no singular.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  alternative: Soberano SENHOR / Senhor Yahweh
  rationale: Segue uma convenção bíblica reconhecível e distingue o nome divino do título sem introduzir uma vocalização específica no corpo do texto.
- issue: Sentido temporal de עוֹלָם
  choice: antigos
  alternative: eternos / perpétuos
  rationale: Preserva a leitura contextual de antiguidade atribuída às elevações, evitando transformar uma descrição geográfica em afirmação metafísica de eternidade.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem foi levemente naturalizada, e ‘até’ explicita a força aditiva de וּ antes de ‘lugares altos’. O versículo termina com vírgula porque a frase profética continua no versículo seguinte.
