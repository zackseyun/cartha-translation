  text: An end has come; the end has come. It has awakened against you; look, it is coming.
translation:
  language: pt
  text: O fim chegou; o fim chegou. Ele despertou contra você; veja, está chegando.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵץ
  choice: o fim
  rationale: Equivalente direto e natural, preservando a repetição enfática do hebraico.
- source_word: הֵקִיץ
  choice: despertou
  rationale: Mantém a personificação do fim e a imagem verbal do hebraico, sem explicá-la ou suavizá-la.
- source_word: אֵלָיִךְ
  choice: contra você
  rationale: Neste anúncio de juízo, a preposição indica movimento ou orientação hostil em direção à destinatária; o feminino singular se refere à terra de Israel no contexto.
- source_word: הִנֵּה
  choice: veja
  rationale: Interjeição atual que chama a atenção do leitor sem recorrer ao mais arcaico “eis”.
- source_word: בָּאָה
  choice: está chegando
  rationale: Expressa a iminência vívida da forma hebraica e concorda semanticamente com “o fim” como sujeito retomado.
theological_decisions:
- issue: Personificação do fim como agente que desperta
  choice: Ele despertou contra você
  alternative: Ele se levantou contra você
  rationale: A tradução conserva a imagem incomum e a tensão poética do texto hebraico, sem interpretá-la como simples começo ou levantamento.
translation_notes:
  register: Português moderno, claro e solene, com repetição e paralelismo preservados. O pronome “você” oferece ampla legibilidade brasileira; o referente feminino do hebraico é entendido pelo contexto, sem tornar a frase artificial em português.
