  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/מֶּ֣לֶךְ יִתְאַבָּ֗ל וְ/נָשִׂיא֙ יִלְבַּ֣שׁ שְׁמָמָ֔ה וִ/ידֵ֥י עַם הָ/אָ֖רֶץ תִּבָּהַ֑לְנָה מִ/דַּרְכָּ֞/ם אֶעֱשֶׂ֤ה אוֹתָ/ם֙ וּ/בְ/מִשְׁפְּטֵי/הֶ֣ם אֶשְׁפְּטֵ֔/ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/027.yaml
  text: The king will mourn[a], and the prince will clothe himself with desolation, and the hands of the people of the land will tremble. According to their way I will deal with them, and by their own judgments I will judge them[c][b]. Then they will know that I am Yahweh.
translation:
  language: pt
  text: O rei ficará de luto, o príncipe se vestirá de desolação[a], e as mãos do povo da terra tremerão de pavor[b]. Eu os tratarei de acordo com a conduta deles e os julgarei segundo os próprios julgamentos deles[c]. Então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se vestirá de horror” ou “ficará coberto de desolação”. O hebraico emprega uma metáfora de vestir-se com um substantivo que pode indicar desolação, horror ou ruína estarrecedora.'
    reason: lexical_alternative
  - marker: b
    text: “Povo da terra” é uma expressão hebraica que aqui pode designar a população em geral. O verbo também pode ser traduzido por “ficarão apavoradas” ou “entrarão em pânico”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os julgarei conforme os julgamentos deles”. O hebraico pode indicar que Deus os julgará segundo os critérios ou as práticas judiciais que eles mesmos adotaram.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ יִתְאַבָּל
  choice: O rei ficará de luto
  rationale: O verbo expressa luto ou lamentação. “Ficará de luto” é natural em português e comunica a reação à catástrofe anunciada.
- source_word: וְנָשִׂיא
  choice: o príncipe
  rationale: נָשִׂיא designa aqui uma autoridade elevada, um príncipe ou governante. “Príncipe” preserva o título distinto de “rei” sem reduzi-lo ao termo genérico “líder”.
- source_word: יִלְבַּשׁ שְׁמָמָה
  choice: se vestirá de desolação
  rationale: A tradução conserva a metáfora hebraica de vestir-se e mantém a amplitude de שְׁמָמָה, que pode evocar desolação, horror e ruína estarrecedora.
- source_word: וִידֵי עַם הָאָרֶץ תִּבָּהַלְנָה
  choice: as mãos do povo da terra tremerão de pavor
  rationale: “As mãos” representam a capacidade de agir; o verbo indica terror, perturbação ou pânico. A formulação mantém a imagem corporal e torna clara a causa do tremor.
- source_word: מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם
  choice: Eu os tratarei de acordo com a conduta deles
  rationale: דֶּרֶךְ, literalmente “caminho”, refere-se neste contexto à maneira de viver ou agir. “Conduta” comunica esse sentido ético com naturalidade.
- source_word: וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם
  choice: e os julgarei segundo os próprios julgamentos deles
  rationale: A repetição de “julgar/julgamentos” preserva o jogo lexical hebraico e sua ambiguidade forense, sem decidir silenciosamente se se trata dos critérios judiciais deles ou dos juízos que lhes correspondem.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Então saberão que eu sou Yahweh
  rationale: A formulação preserva a recorrente fórmula de reconhecimento de Ezequiel. “Então” explicita de modo natural a consequência contextual, e “Yahweh” representa diretamente o nome divino.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Sentido da fórmula de reconhecimento
  choice: Então saberão que eu sou Yahweh
  alternative: E saberão que eu sou Yahweh
  rationale: Neste contexto, a fórmula apresenta o reconhecimento como resultado do juízo. “Então” comunica essa relação sem acrescentar uma explicação doutrinária.
- issue: Reciprocidade do juízo divino
  choice: os tratarei de acordo com a conduta deles e os julgarei segundo os próprios julgamentos deles
  alternative: agirei com eles conforme o caminho deles e os julgarei conforme os juízos deles
  rationale: A tradução conserva a correspondência entre a conduta humana e o juízo recebido, mas não define além do hebraico se “julgamentos” são suas práticas judiciais, seus critérios ou os juízos correspondentes aos seus atos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem das três classes sociais foi mantida, assim como as imagens fortes do vestuário e das mãos. A sintaxe foi levemente naturalizada, sem eliminar a repetição judicial nem a ambiguidade do original.
