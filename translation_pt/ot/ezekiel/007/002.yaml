  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם כֹּה אָמַ֞ר אֲדֹנָ֧/י יְהוִ֛ה לְ/אַדְמַ֥ת יִשְׂרָאֵ֖ל קֵ֑ץ בָּ֣א הַ/קֵּ֔ץ עַל ארבעת כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/002.yaml
  text: 'And you[a], son of man, thus says the Lord GOD to the land of Israel: An end! The end has come upon the four corners of the land.'
translation:
  language: pt
  text: 'E você, filho do homem, assim diz o Senhor Yahweh à terra de Israel: “Um fim! O fim chegou sobre os quatro cantos da terra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre os quatro cantos da Terra”, isto é, do mundo inteiro. A expressão hebraica pode indicar as extremidades de uma região ou, em contexto mais amplo, o mundo inteiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a fórmula característica com que Ezequiel é interpelado, bem como a forma masculina singular do hebraico, em linguagem bíblica amplamente compreensível.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico e mantém Yahweh como nome divino, evitando a repetição artificial “Senhor SENHOR”.
- source_word: לְאַדְמַת יִשְׂרָאֵל
  choice: à terra de Israel
  rationale: A preposição introduz o destinatário ou alvo do oráculo. “Terra” é o equivalente natural de אֲדָמָה neste contexto de juízo profético, sem intensificar o texto com “contra”.
- source_word: קֵץ
  choice: Um fim!
  rationale: O substantivo sem artigo funciona como exclamação abrupta. “Um fim!” conserva sua distinção em relação ao substantivo definido que aparece imediatamente depois.
- source_word: בָּא הַקֵּץ
  choice: O fim chegou
  rationale: O perfeito hebraico apresenta a chegada como certa ou já realizada no anúncio profético. O pretérito perfeito comunica essa força sem convertê-la em mero futuro.
- source_word: אַרְבַּעַת כַּנְפוֹת הָאָרֶץ
  choice: os quatro cantos da terra
  rationale: כָּנָף significa literalmente “asa”, mas nesta expressão designa uma extremidade ou canto. O contexto imediato favorece a terra de Israel, e “quatro cantos” preserva a imagem de totalidade territorial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: A tradução conserva tanto אֲדֹנָי quanto o nome próprio יהוה, sem substituir silenciosamente o nome da aliança por um título.
- issue: Alcance de הָאָרֶץ na expressão final
  choice: terra, referindo-se provavelmente a toda a extensão da terra de Israel
  alternative: Terra, no sentido do mundo inteiro
  rationale: A referência imediatamente anterior à “terra de Israel” favorece o alcance local, mas o substantivo hebraico também pode designar a terra inteira; a nota preserva essa ambiguidade legítima.
translation_notes:
  register: Português atual, digno e de leitura natural, com vocabulário acessível em âmbito internacional e boa legibilidade brasileira. A repetição enfática e a exclamação abrupta do hebraico foram mantidas.
