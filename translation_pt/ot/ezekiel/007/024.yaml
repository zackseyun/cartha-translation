  text: וְ/הֵֽבֵאתִי֙ רָעֵ֣י גוֹיִ֔ם וְ/יָרְשׁ֖וּ אֶת בָּֽתֵּי/הֶ֑ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן עַזִּ֔ים וְ/נִחֲל֖וּ מְקַֽדְשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/024.yaml
  text: And I will bring the worst of the nations[a], and they will take possession of their houses. I will put an end to the pride of the strong[c][b], and their sanctuaries will be profaned.
translation:
  language: pt
  text: E trarei os piores dentre as nações[a], e eles tomarão posse das casas deles[b]. Porei fim ao orgulho dos poderosos, e os santuários deles serão profanados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os mais perversos dentre as nações”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “herdarão as casas deles”; o verbo hebraico pode significar herdar, possuir ou desapossar, conforme o contexto.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os lugares santos deles serão contaminados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: E trarei
  rationale: O hifil de בוא, na primeira pessoa, expressa naturalmente a ação causativa de trazer. O objeto implícito são os invasores mencionados em seguida.
- source_word: רָעֵי גוֹיִם
  choice: os piores dentre as nações
  rationale: 'רָעֵי, no construto plural, tem aqui força superlativa: os maus ou perversos em grau extremo entre as nações. A formulação escolhida é natural e mantém a severidade do juízo.'
- source_word: וְיָרְשׁוּ אֶת בָּתֵּיהֶם
  choice: e eles tomarão posse das casas deles
  rationale: ירשׁ pode significar herdar, possuir ou desapossar. No contexto de invasão, 'tomar posse' comunica ocupação conquistadora sem sugerir necessariamente uma herança legítima.
- source_word: וְהִשְׁבַּתִּי
  choice: Porei fim
  rationale: O hifil de שׁבת significa fazer cessar. 'Porei fim' conserva a força causativa em português corrente e digno.
- source_word: גְּאוֹן עַזִּים
  choice: ao orgulho dos poderosos
  rationale: גְּאוֹן pode indicar orgulho, exaltação ou majestade, enquanto עַזִּים designa os fortes ou poderosos. No oráculo de juízo, 'orgulho' preserva melhor o tom condenatório.
- source_word: וְנִחֲלוּ
  choice: serão profanados
  rationale: A forma passiva de חלל indica profanação ou violação do que é santo. 'Serão profanados' é a expressão cultual mais precisa neste contexto.
- source_word: מְקַדְשֵׁיהֶם
  choice: os santuários deles
  rationale: O plural de מִקְדָּשׁ refere-se a santuários ou lugares santos. 'Santuários' é conciso e mantém o sentido cultual sem especificar além do hebraico.
theological_decisions:
- issue: Nuance de גְּאוֹן no contexto de juízo
  choice: orgulho
  alternative: majestade ou exaltação
  rationale: O anúncio de humilhação divina favorece a nuance negativa 'orgulho', mas a nota de decisão reconhece que o termo também pode designar majestade ou exaltação.
- issue: Sentido de וְנִחֲלוּ מְקַדְשֵׁיהֶם
  choice: os santuários deles serão profanados
  alternative: os lugares santos deles serão contaminados
  rationale: O passivo cultual aponta para profanação. A tradução não identifica quais santuários estão em vista e, assim, preserva a abrangência do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram mantidos sem rigidez artificial. Os referentes de 'deles' permanecem tão abertos quanto no texto-fonte.
