id: EZK.7.12
reference: Ezekiel 7:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בָּ֤א הָ/עֵת֙ הִגִּ֣יעַ הַ/יּ֔וֹם הַ/קּוֹנֶה֙ אַל יִשְׂמָ֔ח וְ/הַ/מּוֹכֵ֖ר אַל יִתְאַבָּ֑ל כִּ֥י חָר֖וֹן אֶל כָּל הֲמוֹנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/012.yaml
  text: The time has come[a]; the day has arrived. Let not the buyer rejoice, and let not the seller mourn[b], for wrath is against all her multitude.
translation:
  language: pt
  text: Chegou o tempo; o dia chegou. O comprador não se alegre, e o vendedor não se lamente, pois a ira se volta contra toda a multidão dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “a multidão dela”, com um sufixo feminino cujo referente pode ser a terra, a cidade ou a comunidade personificada. Outra tradução possível é “toda a riqueza dela”, caso הֲמוֹנָהּ seja entendido no sentido de abundância ou bens.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא הָעֵת
  choice: Chegou o tempo
  rationale: O perfeito anuncia que o momento decisivo já chegou; a formulação é natural em português e mantém a concisão profética.
- source_word: הִגִּיעַ הַיּוֹם
  choice: o dia chegou
  rationale: Preserva o paralelismo enfático entre a chegada do tempo e a chegada do dia.
- source_word: הַקּוֹנֶה אַל יִשְׂמָח
  choice: O comprador não se alegre
  rationale: O particípio substantivado é traduzido pelo nome comum “comprador”, e אַל com o imperfeito mantém a força de proibição ou exortação.
- source_word: וְהַמּוֹכֵר אַל יִתְאַבָּל
  choice: e o vendedor não se lamente
  rationale: “Vendedor” corresponde naturalmente ao particípio substantivado; “não se lamente” comunica pesar e luto sem restringir o verbo ao luto por morte.
- source_word: חָרוֹן
  choice: ira
  rationale: O termo designa ira ardente no contexto do juízo divino; “ira” é corrente, solene e não acrescenta explicação ao texto.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: se volta contra toda a multidão dela
  rationale: “Contra” expressa a direção hostil da ira. “Multidão dela” conserva o sufixo feminino e evita decidir silenciosamente se o referente personificado é a terra, a cidade ou a comunidade.
theological_decisions:
- issue: Referente do sufixo feminino em הֲמוֹנָהּ
  choice: multidão dela
  alternative: sua multidão; toda a sua riqueza
  rationale: A construção mantém no texto a personificação feminina sem identificar de modo indevido o antecedente. A nota registra tanto essa indefinição quanto a possibilidade lexical de entender הָמוֹן como abundância ou riqueza.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. A expressão menos habitual “multidão dela” foi mantida deliberadamente para refletir o feminino do hebraico e sua referência não especificada; a nota esclarece a construção e a alternativa lexical.
