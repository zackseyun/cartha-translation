reference: Ezekiel 7:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמ֑וֹל כִּ/דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה מַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/009.yaml
  text: My eye will not spare[a], nor will I show pity. I will bring your ways upon you, and your abominations will be in your midst. Then you will know that I am Yahweh[c][b], who strikes.
translation:
  language: pt
  text: Meu olhar não terá compaixão[a], nem terei piedade. Farei recair sobre você os seus caminhos[b], e as suas abominações estarão em seu meio. Então vocês saberão que eu sou Yahweh[c], aquele que golpeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “meu olho não poupará”. O hebraico usa “olho” numa expressão relacionada a poupar ou olhar com compaixão.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tratarei você conforme a sua conduta”. Literalmente, “porei sobre você os seus caminhos”.'
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” representa o nome divino escrito em hebraico com as quatro consoantes YHWH.
    reason: cultural_note
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Meu olhar não terá compaixão
  rationale: A expressão hebraica combina “olho” com o verbo חוס, indicando olhar com compaixão e, por isso, poupar. “Meu olhar” conserva a imagem sem soar tão artificial em português quanto “meu olho não poupará”.
- source_word: אֶחְמוֹל
  choice: nem terei piedade
  rationale: חמל expressa compaixão ou piedade. A formulação distingue este verbo do anterior e mantém o paralelismo enfático.
- source_word: כִּדְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: Farei recair sobre você os seus próprios caminhos
  rationale: 'דרך se refere aqui à conduta. A redação conserva a imagem retributiva concreta do hebraico: os caminhos da destinatária recaem sobre ela.'
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: e as suas abominações
  rationale: תועבות é um termo profético forte para práticas repugnantes, muitas vezes idólatras. “Abominações” preserva esse peso moral e religioso.
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: estarão em seu meio
  rationale: A tradução mantém o sentido espacial do hebraico sem especificar se estão em vista as próprias práticas ou suas consequências.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O plural hebraico contrasta com as formas femininas singulares anteriores. “Então” expressa naturalmente o resultado do juízo, e “vocês” preserva a mudança para o plural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: מַכֶּה
  choice: aquele que golpeia
  rationale: O particípio identifica Yahweh como o agente que desfere o juízo. “Golpeia” conserva a ação forte sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva como nome e evita substituí-lo silenciosamente por um título.
- issue: Força da fórmula final מַכֶּה
  choice: aquele que golpeia
  alternative: que está golpeando; que fere
  rationale: A forma participial liga a identidade de Yahweh à sua ação judicial sem decidir além do texto se a ênfase é habitual, presente ou iminente.
- issue: Mudança do singular feminino para o plural
  choice: “você” nas cláusulas de juízo e “vocês” na fórmula de reconhecimento
  alternative: Uniformizar tudo no singular ou tudo no plural
  rationale: O hebraico dirige primeiro as formas possessivas e pronominais a uma destinatária feminina singular personificada, mas usa וִידַעְתֶּם no masculino plural. A tradução preserva essa tensão referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a imagem do olhar, a repetição enfática da ausência de compaixão, a metáfora retributiva dos caminhos que recaem sobre a destinatária e a mudança deliberada do singular para o plural.
