  text: וְ/לֹא תָח֥וֹס עֵינִ֛/י עָלַ֖יִ/ךְ וְ/לֹ֣א אֶחְמ֑וֹל כִּ֣י דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/004.yaml
  text: My eye will not spare you[a], nor will I have pity; for I will bring your ways upon you, and your abominations will be within you[b]. Then you will know that I am Yahweh.
translation:
  language: pt
  text: Meu olho não te poupará[a], nem terei compaixão, pois farei os teus caminhos recaírem sobre ti, e as tuas abominações estarão no teu meio[b]. Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu olho não terá compaixão de ti”. O hebraico usa uma expressão com “olho” para comunicar a ideia de poupar ou demonstrar compaixão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estarão dentro de ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Meu olho não te poupará
  rationale: Preserva a imagem idiomática hebraica do olho que poupa ou demonstra compaixão, sem reduzir a expressão a uma paráfrase.
- source_word: אֶחְמֹל
  choice: nem terei compaixão
  rationale: Distingue este verbo do anterior e conserva a duplicação retórica entre poupar e ter compaixão.
- source_word: דְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: farei os teus caminhos recaírem sobre ti
  rationale: Mantém a fórmula de retribuição e a metáfora de os próprios caminhos recaírem sobre a pessoa, sem acrescentar explicitamente a palavra 'castigo'.
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: e as tuas abominações
  rationale: Conserva a força profética e pactual do termo, que frequentemente designa práticas detestáveis, sobretudo idolátricas.
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: estarão no teu meio
  rationale: Reproduz de modo natural a linguagem espacial e a concisão do hebraico, sem determinar se a referência principal é aos atos ou às suas consequências.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O plural hebraico é preservado por 'vocês', apesar da mudança em relação ao destinatário feminino singular das orações anteriores; 'então' explicita naturalmente a relação de resultado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Linguagem de juízo e fórmula de retribuição
  choice: farei os teus caminhos recaírem sobre ti
  alternative: castigarei você por causa dos seus caminhos
  rationale: O hebraico apresenta os caminhos da destinatária sendo postos sobre ela, mas não usa explicitamente o verbo 'castigar'. A tradução conserva a imagem judicial sem resolver sua tensão por expansão interpretativa.
- issue: Mudança de número no destinatário
  choice: te/ti no singular, seguido de 'vocês saberão' no plural
  alternative: uniformizar todo o versículo no singular
  rationale: O texto hebraico passa de formas femininas singulares, dirigidas à cidade, para um verbo masculino plural. A tradução mantém essa mudança genuína em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de 'tu/ti' para refletir o destinatário feminino singular e 'vocês' para preservar a mudança posterior ao plural. A construção 'meu olho não te poupará' é deliberadamente marcada para conservar a imagem hebraica.
