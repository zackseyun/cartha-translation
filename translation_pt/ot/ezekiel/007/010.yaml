id: EZK.7.10
reference: Ezekiel 7:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֥ה הַ/יּ֖וֹם הִנֵּ֣ה בָאָ֑ה יָֽצְאָה֙ הַ/צְּפִרָ֔ה צָ֚ץ הַ/מַּטֶּ֔ה פָּרַ֖ח הַ/זָּדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/010.yaml
  text: Look[a], the day! Look, it comes! Doom has gone out; the rod has budded; arrogance has blossomed.
translation:
  language: pt
  text: Vejam, o dia! Vejam, ele vem! A ruína[a] irrompeu; a vara brotou; a arrogância floresceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a manhã irrompeu”; o termo hebraico é difícil e pode referir-se literalmente à manhã ou, em sentido figurado, à virada decisiva que chegou.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Partícula dêitica que exige atenção imediata. “Vejam” soa atual e mantém a urgência profética; a repetição preserva a força retórica.
- source_word: הַיּוֹם
  choice: o dia
  rationale: Tradução formal que conserva a expressão ominosa sem acrescentar “do juízo” ao texto.
- source_word: בָאָה
  choice: ele vem
  rationale: Embora a forma hebraica seja perfeita, no anúncio profético comunica chegada iminente e certa. O pronome retoma naturalmente “o dia”.
- source_word: יָצְאָה
  choice: irrompeu
  rationale: Expressa que aquilo que estava por vir já saiu ou se manifestou, com resultado presente, em português natural e vigoroso.
- source_word: הַצְּפִרָה
  choice: a ruína
  rationale: O termo é raro e difícil. No contexto do oráculo de julgamento, “ruína” comunica a calamidade destinada, sem eliminar a leitura literal possível “manhã”, registrada em nota.
- source_word: צָץ
  choice: brotou
  rationale: Preserva a metáfora vegetal e forma um paralelo natural com “floresceu”.
- source_word: הַמַּטֶּה
  choice: a vara
  rationale: Mantém a imagem concreta de um instrumento que pode servir para ferir ou castigar, sem especificar indevidamente um cetro real.
- source_word: פָּרַח
  choice: floresceu
  rationale: Conserva a imagem de crescimento vegetal em paralelo com “brotou”.
- source_word: הַזָּדוֹן
  choice: a arrogância
  rationale: Traduz a atitude de orgulho presunçoso e insolente em linguagem contemporânea.
theological_decisions:
- issue: Sentido de הַצְּפִרָה no oráculo de julgamento
  choice: “a ruína” no texto principal
  alternative: “a manhã” ou “a virada decisiva”
  rationale: O contexto imediato anuncia calamidade e favorece um sentido figurado ligado ao destino funesto. Como o vocábulo hebraico é discutido, a nota preserva a alternativa literal e a ambiguidade real.
translation_notes:
  register: Português moderno, solene e acessível, com forte cadência profética. A repetição inicial e as metáforas vegetais foram mantidas. “Ruína” é mais idiomático em português do que uma equivalência abstrata como “destino”, enquanto a nota conserva a dificuldade lexical.
