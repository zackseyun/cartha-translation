  text: וּ/נְתַתִּ֤י/ו בְּ/יַֽד הַ/זָּרִים֙ לָ/בַ֔ז וּ/לְ/רִשְׁעֵ֥י הָ/אָ֖רֶץ לְ/שָׁלָ֑ל ו/חלל/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/021.yaml
  text: And I will give it into the hand of foreigners for plunder[a], and to the wicked of the earth for spoil[b], and they will profane it.
translation:
  language: pt
  text: Eu o entregarei nas mãos de estrangeiros, para saque, e aos perversos da terra[a], como despojo; eles o profanarão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do país”. A palavra hebraica pode significar “terra” em sentido amplo ou uma terra ou região específica.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o contaminarão” ou “o tratarão como profano”. O verbo indica a violação daquilo que é santo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיו
  choice: Eu o entregarei
  rationale: O verbo נתן, com sujeito na primeira pessoa e objeto na terceira pessoa, expressa aqui uma declaração profética. “Entregarei” comunica naturalmente a transferência ao poder inimigo, sem explicitar além do hebraico qual é o referente do pronome.
- source_word: בְּיַד הַזָּרִים
  choice: nas mãos de estrangeiros
  rationale: A expressão בְּיַד indica domínio ou controle. O plural idiomático “nas mãos” é natural em português, e “estrangeiros” expressa que זָרִים são pessoas de fora no contexto da invasão.
- source_word: לָבַז
  choice: para saque
  rationale: בַּז designa bens tomados pela força. “Para saque” preserva a construção concisa e a ideia de finalidade ou resultado.
- source_word: וּלְרִשְׁעֵי הָאָרֶץ
  choice: e aos perversos da terra
  rationale: רִשְׁעֵי são pessoas perversas ou culpadas. “Terra” mantém a amplitude de הָאָרֶץ, que também pode designar uma terra ou região específica; a alternativa é registrada em nota.
- source_word: לְשָׁלָל
  choice: como despojo
  rationale: שָׁלָל é aquilo que se toma do inimigo. “Despojo” preserva a variação lexical e o paralelismo com בַּז, sem reduzir os dois termos a uma única palavra.
- source_word: וְחִלְּלוּהָ
  choice: eles o profanarão
  rationale: No piel, חלל significa tratar como comum ou violar aquilo que é santo. “Profanarão” conserva essa dimensão sacrílega; o pronome retoma em português o objeto entregue aos invasores.
theological_decisions:
- issue: Sentido de חלל em contexto de santidade
  choice: profanarão
  alternative: contaminarão; profanarão o que é santo
  rationale: “Profanar” preserva a oposição teológica entre santidade e uso comum ou sacrílego, central em Ezequiel, sem acrescentar uma explicação interpretativa ao corpo do texto.
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país; região
  rationale: O hebraico pode indicar a terra em sentido amplo ou uma terra específica. A tradução principal não restringe o referente, e a nota preserva a leitura contextual mais limitada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem paralela do hebraico foi preservada, enquanto “nas mãos” e “eles o profanarão” mantêm fluidez idiomática em português.
