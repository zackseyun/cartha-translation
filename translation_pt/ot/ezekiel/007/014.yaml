base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/014.yaml
  text: They have blown the trumpet and made everything ready[a], but no one goes to battle[b], for my wrath is against all her multitude.
translation:
  language: pt
  text: Tocaram a trombeta[a] e prepararam tudo, mas ninguém vai à batalha, porque a minha ira está contra toda a sua multidão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a corneta” ou “o chifre de carneiro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a sua abundância” ou “todas as suas riquezas”, se הֲמוֹנָהּ for entendido em sentido material, e não como referência à população.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקְעוּ בַתָּקוֹעַ
  choice: Tocaram a trombeta
  rationale: O verbo תקע, com o nome do instrumento, descreve o ato de fazê-lo soar. “Tocaram a trombeta” é natural em português e comunica claramente o sinal militar; o perfeito hebraico é preservado pelo pretérito perfeito.
- source_word: וְהָכִין הַכֹּל
  choice: e prepararam tudo
  rationale: O hifil de כון significa preparar ou deixar pronto. A formulação concisa preserva o alcance de הַכֹּל, “tudo”.
- source_word: וְאֵין הֹלֵךְ
  choice: mas ninguém vai
  rationale: A construção com אֵין e particípio indica que não há quem prossiga. “Mas” explicita o contraste contextual entre os preparativos concluídos e a ausência de combatentes.
- source_word: לַמִּלְחָמָה
  choice: à batalha
  rationale: מִלְחָמָה pode significar guerra ou batalha; neste contexto de convocação militar imediata, “batalha” expressa melhor o confronto concreto.
- source_word: כִּי חֲרוֹנִי
  choice: porque a minha ira
  rationale: כִּי introduz a causa, e חָרוֹן designa ira ardente. “A minha ira” mantém a força e a concisão do hebraico.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: está contra toda a sua multidão
  rationale: Com a ira como sujeito, אֶל tem sentido adversativo, “contra”. הָמוֹן pode indicar multidão ou abundância; “multidão” se ajusta ao contexto de juízo e mobilização, enquanto o pronome feminino “sua” preserva a indefinição do referente.
theological_decisions:
- issue: Referente do sufixo feminino em הֲמוֹנָהּ
  choice: “sua multidão”, sem identificar expressamente o antecedente
  alternative: “a multidão da cidade” ou “a multidão da terra”
  rationale: O sufixo hebraico é feminino singular, mas o antecedente não é explícito o bastante para inserir “Jerusalém”, “cidade” ou “terra” no texto.
- issue: Sentido de הֲמוֹנָהּ
  choice: “sua multidão”
  alternative: “sua abundância” ou “suas riquezas”
  rationale: O termo admite tanto um sentido populacional quanto material. O contexto favorece a população reunida, mas a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pretérito perfeito marca os preparativos já realizados, enquanto o presente em “ninguém vai” ressalta o resultado vigente. As notas foram posicionadas junto aos termos a que efetivamente se referem.
