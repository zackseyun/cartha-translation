base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/016.yaml
  text: And their survivors will escape and be on the mountains[a], like doves of the valleys, all of them moaning[c][b], each one in his iniquity.
translation:
  language: pt
  text: E os seus sobreviventes escaparão e estarão nos montes, como pombas dos vales[a], todos gemendo[b], cada um em sua iniquidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pombas dos desfiladeiros”. O termo hebraico pode referir-se a vales ou a ravinas/desfiladeiros.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos murmurando” ou “todos arrulhando”. O verbo hebraico evoca um som baixo e, neste contexto, pesar.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “cada um por causa de sua culpa” ou “cada um por seu castigo”. O termo hebraico pode indicar iniquidade, culpa ou a consequência da culpa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָלְטוּ
  choice: escaparão
  rationale: O verbo פלט indica escapar ou livrar-se de um perigo. O futuro traduz adequadamente o sentido profético sem especificar o modo da fuga.
- source_word: פְּלִיטֵיהֶם
  choice: os sobreviventes deles
  rationale: O substantivo designa os que escaparam. “Sobreviventes” expressa naturalmente o resultado de terem escapado do juízo, enquanto “deles” conserva a referência pronominal hebraica.
- source_word: וְהָיוּ אֶל־הֶהָרִים
  choice: e ficarão nos montes
  rationale: A expressão indica a localização dos sobreviventes depois da fuga. “Ficarão nos montes” é natural em português e evita acrescentar um movimento explícito que não está inequívoco no hebraico.
- source_word: כְּיוֹנֵי הַגֵּאָיוֹת
  choice: como pombas dos vales
  rationale: A comparação associa os sobreviventes às pombas dos vales ou desfiladeiros, evocando vulnerabilidade e seu som pesaroso. “Vales” é claro e acessível.
- source_word: כֻּלָּם הֹמוֹת
  choice: todos gemendo
  rationale: המה descreve a produção de um som baixo, como murmúrio, arrulho ou gemido. No contexto de juízo, “gemendo” comunica o pesar sem perder totalmente a ressonância sonora da comparação com pombas.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular distributivo se refere individualmente aos sobreviventes. “Cada um” é natural e não restringe desnecessariamente a referência apenas a homens.
- source_word: בַּעֲוֺנוֹ
  choice: por sua própria iniquidade
  rationale: עָוֹן pode indicar iniquidade, culpa ou a consequência punitiva da culpa. A preposição ב pode assumir valor causal neste contexto; “por” conserva alguma abertura entre pecado e culpa, explicitada na nota.
theological_decisions:
- issue: Amplitude semântica de עָוֹן em contexto de juízo
  choice: “por sua própria iniquidade”, com nota que preserva as nuances de culpa e castigo
  alternative: “em sua iniquidade”, “por causa de sua culpa” ou “por seu castigo”
  rationale: O termo hebraico pode designar o pecado, a culpa decorrente dele ou sua consequência penal. A tradução principal permanece natural em português, enquanto a nota evita reduzir a tensão teológica a apenas uma dessas ideias.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, preservando a sequência das imagens e o caráter distributivo da frase final.
