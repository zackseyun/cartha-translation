  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶ/חָמָ֥ס קָ֖ם לְ/מַטֵּה רֶ֑שַׁע לֹא מֵ/הֶ֞ם וְ/לֹ֧א מֵ/הֲמוֹנָ֛/ם וְ/לֹ֥א מֶ/הֱמֵ/הֶ֖ם וְ/לֹא נֹ֥הַּ בָּ/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/011.yaml
  text: Violence has arisen into a rod of wickedness[a]; none of them remains, none of their multitude, none of their wealth[b], and there is no eminence among them.
translation:
  language: pt
  text: A violência se levantou como vara da maldade; nada restará deles, nem da sua multidão, nem da sua riqueza[a], e não haverá entre eles nenhuma distinção[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo hebraico é incerto e também pode ser entendido como “abundância” ou “tumulto”. Toda a sequência é elíptica e difícil: mais literalmente, “não deles, nem da sua multidão, nem da sua abundância ou tumulto”.'
    reason: alternative_reading
  - marker: b
    text: A palavra hebraica é rara e obscura. “Distinção” também pode ser traduzida por “eminência” ou “preeminência”; há ainda outras interpretações da frase.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָמָס
  choice: A violência
  rationale: חָמָס designa violência, injustiça ou dano violento; o artigo hebraico é representado naturalmente em português, mantendo a força personificada do termo.
- source_word: קָם
  choice: se levantou
  rationale: O perfeito qal de קום expressa o ato de erguer-se ou surgir; “se levantou” preserva a imagem e soa natural no registro profético.
- source_word: לְמַטֵּה רֶשַׁע
  choice: como vara da maldade
  rationale: מַטֶּה significa vara, bastão ou tribo; no contexto de juízo, “vara” conserva a metáfora de um instrumento de castigo ou domínio. O לְ é entendido em sentido resultativo ou predicativo, aqui expresso por “como”, sem eliminar a possibilidade de “tornando-se”.
- source_word: לֹא מֵהֶם
  choice: nada restará deles
  rationale: A expressão hebraica é elíptica. O verbo “restará” é suprido pelo contexto de destruição total, enquanto “nada deles” reproduz de modo inteligível a construção negativa.
- source_word: וְלֹא מֵהֲמוֹנָם
  choice: nem da sua multidão
  rationale: הָמוֹן pode denotar multidão, abundância ou tumulto; “multidão” é adequado à referência ao povo, embora a polissemia permaneça relevante para as cláusulas seguintes.
- source_word: וְלֹא מֶהֱמֵהֶם
  choice: nem da sua riqueza
  rationale: A forma é obscura e pode apontar para abundância, bens ou tumulto. “Riqueza” produz uma sequência contextual coerente, mas a incerteza é explicitada em nota.
- source_word: וְלֹא נֹהַּ בָּהֶם
  choice: e não haverá entre eles nenhuma distinção
  rationale: נֹהַּ é raro e incerto. “Distinção” comunica a ideia possível de eminência ou preeminência sem sugerir apenas posição social formal; alternativas são registradas em nota.
theological_decisions:
- issue: Expressões elípticas e vocábulos obscuros num oráculo de juízo
  choice: Entender as cláusulas negativas como declaração de que nada restará do povo, de sua multidão, de sua riqueza ou de qualquer distinção entre eles.
  alternative: 'Manter literalmente a sequência opaca: “não deles, nem da sua multidão, nem da sua abundância ou tumulto; e nenhuma eminência entre eles”.'
  rationale: O contexto de Ezequiel 7 favorece a ideia de desaparecimento sob o juízo. A tradução supre apenas o verbo necessário à clareza e conserva em notas a incerteza lexical, sem transformar uma interpretação contextual em certeza textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe solene preserva o caráter abrupto do oráculo, enquanto as notas reconhecem a dificuldade real do hebraico.
