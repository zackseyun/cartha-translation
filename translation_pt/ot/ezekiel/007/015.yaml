  text: הַ/חֶ֣רֶב בַּ/ח֔וּץ וְ/הַ/דֶּ֥בֶר וְ/הָ/רָעָ֖ב מִ/בָּ֑יִת אֲשֶׁ֤ר בַּ/שָּׂדֶה֙ בַּ/חֶ֣רֶב יָמ֔וּת וַ/אֲשֶׁ֣ר בָּ/עִ֔יר רָעָ֥ב וָ/דֶ֖בֶר יֹאכֲלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
translation:
  language: pt
  text: A espada está do lado de fora, e a peste[a] e a fome estão do lado de dentro. Quem estiver no campo morrerá à espada, e quem estiver na cidade, a fome e a peste o devorarão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “epidemia”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a fome e a peste o comerão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  choice: a espada
  rationale: Preserva a imagem concreta hebraica e sua função metonímica de morte violenta na tríade profética de juízo.
- source_word: בַּחוּץ
  choice: do lado de fora
  rationale: Expressa naturalmente o contraste espacial com מִבָּיִת, sem restringir o sentido a uma rua específica.
- source_word: הַדֶּבֶר
  choice: a peste
  rationale: Termo corrente e digno para epidemia devastadora; mantém a linguagem tradicional de juízo sem sugerir apenas doença em sentido amplo.
- source_word: הָרָעָב
  choice: a fome
  rationale: No contexto, designa escassez coletiva e mortal. Em português, “fome” é a expressão bíblica natural e abrange tanto a calamidade quanto seus efeitos.
- source_word: מִבָּיִת
  choice: do lado de dentro
  rationale: Mantém a oposição com “do lado de fora” e evita acrescentar explicitamente “da casa”, substantivo não expresso de modo independente na construção.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: quem estiver no campo
  rationale: Reproduz de modo idiomático a construção relativa distributiva e a localização no campo ou espaço aberto.
- source_word: בַּחֶרֶב יָמוּת
  choice: morrerá à espada
  rationale: Conserva o idioma hebraico e a imagem da espada sem explicitar uma agência não declarada.
- source_word: וַאֲשֶׁר בָּעִיר
  choice: e quem estiver na cidade
  rationale: Preserva o singular distributivo e o contraste entre campo e cidade.
- source_word: רָעָב וָדֶבֶר
  choice: a fome e a peste
  rationale: Segue a ordem específica do segundo membro hebraico, sem harmonizá-la com a ordem anterior.
- source_word: יֹאכֲלֶנּוּ
  choice: o devorarão
  rationale: Mantém a personificação e a força metafórica de אָכַל (“comer”), em formulação natural e vívida em português.
theological_decisions:
- issue: Tríade profética de juízo
  choice: Manter “espada”, “peste” e “fome” como imagens concretas
  alternative: Generalizar como guerra, doença e escassez
  rationale: Os termos formam uma conhecida tríade de calamidades no discurso profético. Preservá-los mantém sua força literária e teológica sem inserir uma explicação doutrinária.
- issue: Singular distributivo e sufixo masculino singular
  choice: Traduzir por “quem... o”
  alternative: Pluralizar como “os que... eles” ou reformular integralmente no plural
  rationale: A construção hebraica é distributiva e singular, e o objeto de יֹאכֲלֶנּוּ está no masculino singular. A formulação portuguesa preserva esses dados sem limitar explicitamente o referente a homens.
- issue: Metáfora de comer
  choice: Conservar a personificação em “a fome e a peste o devorarão”
  alternative: Atenuar para “será consumido” ou “morrerá por causa da fome e da peste”
  rationale: A escolha retém a imagem hebraica e sua intensidade, sem transformar a afirmação em mera explicação causal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Os verbos “está/estão” são supridos naturalmente nas orações nominais hebraicas. O ponto e vírgula destaca o paralelismo entre campo e cidade, e “devorarão” conserva a metáfora sem soar artificial.
