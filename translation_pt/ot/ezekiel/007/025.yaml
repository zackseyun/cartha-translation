  text: קְפָ֖דָה בָ֑א וּ/בִקְשׁ֥וּ שָׁל֖וֹם וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/025.yaml
  text: Anguish has come[a], and they will seek peace, but there is none.
translation:
  language: pt
  text: A angústia chegou[a]; eles buscarão paz, mas não haverá paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O terror chegou”, “A calamidade chegou” ou “O horror chegou”. O substantivo hebraico é raro e pode enfatizar tanto o pavor em si quanto a condição desastrosa produzida pelo juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְפָדָה
  choice: angústia
  rationale: O substantivo raro descreve a aflição extrema ligada ao juízo. “Angústia” preserva sua força vivencial sem limitar o sentido a terror subjetivo ou calamidade objetiva; essas possibilidades são registradas em nota.
- source_word: בָא
  choice: chegou
  rationale: O qatal apresenta o acontecimento profético como já chegado ou certo e iminente. “Chegou” reproduz de modo natural essa declaração enfática.
- source_word: וּבִקְשׁוּ
  choice: eles buscarão
  rationale: Na sequência profética, a forma descreve a reação posterior à chegada da angústia e é naturalmente expressa pelo futuro em português.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” é o equivalente corrente e adequado, abrangendo aqui segurança e bem-estar, não apenas tranquilidade interior.
- source_word: וָאָיִן
  choice: mas ela não existe
  rationale: A expressão nega a existência da paz procurada. “Mas” explicita o valor adversativo da conjunção, e o pronome feminino retoma “paz” com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A formulação concisa conserva o paralelismo e a tensão do anúncio profético.
