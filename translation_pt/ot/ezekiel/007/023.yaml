source:
  edition: WLC
  text: עֲשֵׂ֖ה הָֽ/רַתּ֑וֹק כִּ֣י הָ/אָ֗רֶץ מָֽלְאָה֙ מִשְׁפַּ֣ט דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
translation:
  language: pt
  text: Prepare a corrente[a], pois a terra está cheia de crimes de sangue[b], e a cidade está cheia de violência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grilhão” ou “vínculo”. O termo hebraico provavelmente evoca contenção, prisão ou cativeiro sob juízo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “juízo de sangues”. A expressão pode indicar culpa de sangue, injustiça homicida ou crimes que merecem juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה
  choice: Faça
  rationale: Imperativo qal masculino singular de עשה. “Faça” preserva a ordem direta e se liga naturalmente ao objeto concreto.
- source_word: הָרַתּוֹק
  choice: a corrente
  rationale: O substantivo raro é entendido como corrente, grilhão ou instrumento de contenção. “Corrente” mantém a imagem concreta ligada ao juízo e ao cativeiro, sem especificar além do hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem precedente; “pois” é conciso e adequado ao discurso profético.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste contexto, indica o território sob juízo, provavelmente a terra de Israel/Judá, e não necessariamente o mundo inteiro.
- source_word: מָלְאָה
  choice: está cheia de
  rationale: Expressa naturalmente em português o estado resultante indicado pela forma perfeita.
- source_word: מִשְׁפַּט דָּמִים
  choice: crimes de sangue
  rationale: A expressão literalmente difícil, “juízo de sangues”, combina dimensão forense e derramamento de sangue. “Crimes de sangue” conserva ambas sem tornar o texto artificialmente obscuro.
- source_word: וְהָעִיר
  choice: e a cidade
  rationale: Reproduz a coordenação simples e a forma definida; no contexto, a cidade provavelmente é Jerusalém.
- source_word: חָמָס
  choice: violência
  rationale: Equivalente estabelecido que abrange brutalidade, opressão e injustiça social.
theological_decisions:
- issue: Sentido da imagem הָרַתּוֹק
  choice: Uma corrente literal ou simbólica associada ao juízo e ao cativeiro que se aproximam
  alternative: Um grilhão específico, preparativos gerais para aprisionamento ou uma ideia abstrata de amarração
  rationale: O contexto de Ezequiel 7 envolve invasão, punição e perda da segurança. A tradução concreta “corrente” preserva a imagem profética sem definir de modo indevido seu mecanismo exato.
- issue: Sentido de מִשְׁפַּט דָּמִים
  choice: Crimes violentos que acarretam culpa de sangue e juízo
  alternative: Perversão judicial marcada por derramamento de sangue, “juízo de sangues” ou simplesmente “derramamento de sangue”
  rationale: A formulação hebraica admite tensão entre delito, culpa de sangue e esfera judicial. O texto principal comunica essa convergência, enquanto a nota preserva a forma e as possibilidades do original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição “está cheia” foi mantida para refletir o paralelismo hebraico. Os marcadores [a] e [b] aparecem no texto principal.
