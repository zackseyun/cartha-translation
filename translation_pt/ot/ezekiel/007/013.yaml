  text: כִּ֣י הַ/מּוֹכֵ֗ר אֶל הַ/מִּמְכָּר֙ לֹ֣א יָשׁ֔וּב וְ/ע֥וֹד בַּ/חַיִּ֖ים חַיָּתָ֑/ם כִּֽי חָז֤וֹן אֶל כָּל הֲמוֹנָ/הּ֙ לֹ֣א יָשׁ֔וּב וְ/אִ֧ישׁ בַּ/עֲוֺנ֛/וֹ חַיָּת֖/וֹ לֹ֥א יִתְחַזָּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/013.yaml
  text: For the seller will not return to what was sold[a], though they are still alive; for the vision concerning all its multitude will not turn back[e][d][c][b], and no one will strengthen his life in his iniquity.
translation:
  language: pt
  text: Pois quem vendeu não voltará ao que foi vendido[a], ainda que continuem vivos[b]; porque a visão referente a toda a sua multidão[c] não voltará atrás[d], e ninguém conseguirá fortalecer a própria vida em sua iniquidade[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à venda”, isto é, à propriedade ou posse que foi vendida.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente, traz uma expressão comprimida: “enquanto ainda entre os vivos, a vida deles”. O sentido provável é que o vendedor não recuperará o que vendeu, mesmo que os envolvidos ainda estejam vivos.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dirigida contra toda a sua multidão”. A preposição hebraica pode indicar a direção da visão para toda a população sob juízo.'
    reason: alternative_reading
  - marker: d
    text: 'Ou: “não será revogada”. Isto é, o juízo anunciado não será revertido.'
    reason: alternative_reading
  - marker: e
    text: O hebraico da cláusula final é difícil. O sentido provável é que ninguém conseguirá assegurar a própria vida por meio de sua iniquidade.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹכֵר
  choice: quem vendeu
  rationale: O particípio substantivado designa o vendedor. Em português, “quem vendeu” mantém a imagem comercial e se liga naturalmente ao bem vendido.
- source_word: אֶל הַמִּמְכָּר
  choice: ao que foi vendido
  rationale: A expressão pode indicar a venda ou aquilo que foi vendido; esta formulação preserva a concisão sem especificar além do hebraico que se trata de terra ou propriedade.
- source_word: לֹא יָשׁוּב
  choice: não voltará
  rationale: Preserva o sentido comum de שוב e a ideia de que o vendedor não recuperará o bem alienado.
- source_word: וְעוֹד בַּחַיִּים חַיָּתָם
  choice: ainda que continuem vivos
  rationale: Torna inteligível a expressão hebraica comprimida, cujo sentido é que a recuperação não ocorrerá mesmo enquanto os envolvidos ainda estiverem vivos.
- source_word: חָזוֹן
  choice: a visão
  rationale: Termo corrente para revelação profética, preservando o registro e a imagem do texto.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: referente a toda a sua multidão
  rationale: אֶל pode marcar referência ou direção. “Referente a” mantém aberta a possibilidade de a visão ser dirigida contra a população, sem impor essa nuance no texto principal.
- source_word: לֹא יָשׁוּב
  choice: não voltará atrás
  rationale: Retém o eco verbal da primeira ocorrência de שוב e comunica que a visão anunciada não será revertida.
- source_word: וְאִישׁ
  choice: ninguém
  rationale: O singular distributivo hebraico tem aqui sentido geral; “ninguém” é natural e inclusivo em português.
- source_word: בַּעֲוֹנוֹ
  choice: por causa de sua iniquidade
  rationale: A preposição ב pode indicar esfera ou meio. A formulação expressa a relação da iniquidade com a tentativa inútil de assegurar a vida, sem tratá-la como meio eficaz.
- source_word: חַיָּתוֹ
  choice: a própria vida
  rationale: Refere-se à vida ou força vital do indivíduo; “a própria vida” esclarece a referência reflexiva em português.
- source_word: לֹא יִתְחַזָּקוּ
  choice: conseguirá fortalecer
  rationale: O hitpael plural ocorre em sintaxe difícil após אִישׁ. A formulação conserva a metáfora de força, enquanto “conseguirá” explicita o resultado negativo no contexto.
theological_decisions:
- issue: Sentido da cláusula final sobre iniquidade e vida
  choice: Ninguém conseguirá fortalecer ou assegurar a própria vida por causa de sua iniquidade.
  alternative: 'Ninguém fortalecerá a própria vida em sua iniquidade; ou: os que vivem em sua iniquidade não se fortalecerão.'
  rationale: A sintaxe hebraica é difícil, inclusive pela combinação de אִישׁ singular com verbo plural. A tradução principal oferece o sentido contextual mais coerente — a iniquidade não permitirá escapar do juízo — sem desenvolver uma categoria doutrinária posterior.
- issue: Caráter irrevogável da visão
  choice: A visão “não voltará atrás”.
  alternative: A visão “não será revogada” ou “não retornará”.
  rationale: A expressão mantém o verbo repetido do hebraico e sugere que o juízo anunciado não será revertido, sem apagar a formulação figurada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura causal repetida (“pois... porque...”) e a repetição de “voltar” preservam o movimento do hebraico. As ambiguidades relativas à preposição אֶל, à expressão sobre os vivos e à cláusula final são mantidas ou registradas em notas.
