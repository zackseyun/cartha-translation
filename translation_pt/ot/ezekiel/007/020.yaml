  text: וּ/צְבִ֤י עֶדְי/וֹ֙ לְ/גָא֣וֹן שָׂמָ֔/הוּ וְ/צַלְמֵ֧י תוֹעֲבֹתָ֛/ם שִׁקּוּצֵי/הֶ֖ם עָ֣שׂוּ ב֑/וֹ עַל כֵּ֛ן נְתַתִּ֥י/ו לָ/הֶ֖ם לְ/נִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/020.yaml
  text: And they made the beauty of his ornament into pride[a], and in it they made the images of their abominations, their detestable things[b]; therefore I have made it an unclean thing to them.
translation:
  language: pt
  text: E fez da beleza do seu adorno um motivo de orgulho; nele[a] fizeram as imagens das suas abominações, os seus objetos detestáveis. Por isso, fiz dele uma coisa impura[b] para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com ele fizeram”. A expressão hebraica pode indicar tanto o lugar quanto o material ou meio usado para fazer as imagens.
    reason: lexical_alternative
  - marker: b
    text: “Coisa impura” traduz um termo hebraico associado à impureza ritual; outra tradução possível é “algo a ser rejeitado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבִי עֶדְיוֹ
  choice: da beleza do seu adorno
  rationale: צְבִי expressa beleza ou esplendor, e עֲדִי designa adorno ou ornamento. A formulação mantém o singular e não especifica além do hebraico a identidade ou a natureza do objeto precioso.
- source_word: לְגָאוֹן שָׂמָהוּ
  choice: fizeram ... motivo de orgulho
  rationale: גָּאוֹן pode significar orgulho, exaltação ou majestade. No contexto de acusação e juízo, “orgulho” preserva melhor o sentido negativo; “motivo de” expressa em português natural a função resultante indicada pela construção.
- source_word: וְצַלְמֵי תוֹעֲבֹתָם
  choice: as imagens das suas abominações
  rationale: Mantém a cadeia nominal do hebraico e deixa amplo o referente de תּוֹעֵבָה, embora o contexto aponte para imagens idólatras.
- source_word: שִׁקּוּצֵיהֶם
  choice: os seus objetos detestáveis
  rationale: שִׁקּוּץ frequentemente designa algo detestável, em especial um ídolo. “Objetos detestáveis” conserva a distinção lexical em relação a “abominações” sem tornar explícito demais o referente.
- source_word: עָשׂוּ בוֹ
  choice: nele fizeram
  rationale: A preposição ב pode indicar localização ou meio/material. “Nele” segue de perto a forma hebraica e preserva essa relação pronominal; a alternativa instrumental é registrada em nota.
- source_word: נְתַתִּיו לָהֶם לְנִדָּה
  choice: fiz dele uma coisa impura para eles
  rationale: Embora נָתַן normalmente signifique “dar”, com o predicativo לְנִדָּה a construção tem o sentido de tornar ou fazer algo impuro. A tradução comunica a dimensão ritual e moral sem explicitar desnecessariamente a origem idiomática do termo.
theological_decisions:
- issue: Natureza da impureza expressa por לְנִדָּה
  choice: uma coisa impura
  alternative: algo a ser rejeitado
  rationale: A linguagem de impureza se ajusta à condenação do uso idólatra do adorno e conserva a dimensão cultual e moral do termo, sem reduzir a frase a mera rejeição nem explicitar sua associação específica com impureza menstrual.
- issue: Referente do adorno e dos pronomes masculinos
  choice: manter “seu adorno” e “dele” sem identificar expressamente o possuidor
  alternative: explicitar o templo, a cidade, a riqueza ou a prata e o ouro como referente
  rationale: O versículo isolado não identifica de modo inequívoco o referente pronominal. A tradução preserva essa abertura em vez de impor uma interpretação contextual específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Motivo de orgulho” evita uma construção artificial sem perder o valor negativo de גָּאוֹן. A repetição semântica entre “abominações” e “objetos detestáveis” foi mantida para refletir os dois termos hebraicos distintos.
