base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/017.yaml
  text: All hands will grow weak[a], and all knees will run with water.
translation:
  language: pt
  text: Todas as mãos perderão as forças, e todos os joelhos escorrerão água.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todos os joelhos escorrerão água”. Provavelmente é uma imagem de joelhos que cedem de terror, talvez incluindo a perda do controle do corpo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: todas / todos
  rationale: Mantém o quantificador abrangente nas duas ocorrências, com a concordância de gênero exigida em português.
- source_word: הַיָּדַיִם
  choice: mãos
  rationale: Tradução anatômica direta que preserva a imagem hebraica da perda de força e capacidade de agir.
- source_word: תִּרְפֶּינָה
  choice: perderão as forças
  rationale: Expressa em português natural o enfraquecimento ou relaxamento indicado por רפה, sem abandonar a imagem corporal.
- source_word: בִּרְכַּיִם
  choice: joelhos
  rationale: Correspondência anatômica direta, associada no contexto ao colapso causado pelo terror.
- source_word: תֵּלַכְנָה
  choice: escorrerão
  rationale: Embora o verbo básico signifique ir ou andar, junto de 'água' descreve de modo natural o movimento de líquido; 'escorrerão' conserva a imagem incomum sem a tornar ininteligível.
- source_word: מָּיִם
  choice: água
  rationale: Preserva o termo explícito do hebraico e evita substituir por 'urina' uma possível implicação que o texto não declara diretamente.
