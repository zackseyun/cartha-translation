  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רָעָ֛ה אַחַ֥ת רָעָ֖ה הִנֵּ֥ה בָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/005.yaml
  text: 'Thus says the Lord GOD: A disaster[a], a unique disaster—behold, it is coming.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Uma calamidade[a], uma única calamidade — eis que ela vem!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma calamidade, uma só calamidade”. O hebraico repete “calamidade” para dar ênfase, e “uma” pode destacar que ela é singular ou sem igual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética consagrada, preservada em português corrente e solene; o perfeito hebraico tem valor formular e é naturalmente expresso no presente.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a duplicação pouco clara “Senhor SENHOR”.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste anúncio de juízo, indica desgraça ou catástrofe, não maldade moral. “Calamidade” mantém o tom solene e é amplamente compreensível.
- source_word: רָעָה אַחַת רָעָה
  choice: Uma calamidade, uma única calamidade
  rationale: Conserva a repetição abrupta do hebraico e traduz אַחַת como “única”, realçando a singularidade ou intensidade sem eliminar a ambiguidade.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a urgência dêitica e o tom profético da expressão hebraica.
- source_word: בָאָה
  choice: ela vem
  rationale: O particípio feminino concorda com רָעָה e apresenta a calamidade como iminente; o presente português comunica essa aproximação com concisão.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva tanto o título “Senhor” quanto o nome próprio divino, sem os fundir nem produzir a repetição “Senhor SENHOR”.
- issue: Sentido de רָעָה no anúncio do juízo
  choice: calamidade
  alternative: mal
  rationale: O contexto fala do acontecimento destrutivo que se aproxima. “Mal” poderia sugerir, de modo indevido, maldade moral atribuída a Deus.
translation_notes:
  register: Português moderno, solene e acessível. A construção repetitiva foi mantida para refletir a força abrupta do hebraico, enquanto “eis que” preserva o caráter urgente do anúncio profético.
