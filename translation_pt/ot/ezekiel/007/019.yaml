  terminology: “Prata”, “ouro”, “impuro”, “livrá-los”, “ira de Yahweh”, “apetite”, “estômago” e “pedra de tropeço” são escolhas adequadas. “Yahweh” corresponde ao nome divino no texto hebraico. A nota sobre נִדָּה preserva apropriadamente a possível conotação de impureza menstrual sem a impor no texto principal.
