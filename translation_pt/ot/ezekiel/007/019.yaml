revisions:
- from: Eles lançarão sua prata nas ruas, e seu ouro se tornará uma coisa impura.[a] Sua prata e seu ouro não poderão livrá-los no dia da ira de Yahweh. Não saciarão seu apetite nem encherão seu estômago, pois sua riqueza se tornou a pedra de tropeço que os levou à iniquidade.[b]
  to: Eles lançarão sua prata nas ruas, e seu ouro se tornará algo impuro.[a] Sua prata e seu ouro não poderão livrá-los no dia da ira de Yahweh. Não saciarão seu apetite nem encherão seu estômago, pois isso se tornou a pedra de tropeço da sua iniquidade.[b]
  rationale: A revisão substitui a paráfrase causal “que os levou à iniquidade” por “isso se tornou a pedra de tropeço da sua iniquidade”. Assim, retém-se o referente final não especificado e a relação ambígua indicada pelo hebraico, como também se preserva na nota. A troca de “uma coisa impura” por “algo impuro” é apenas estilística e não altera o sentido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:37:30Z'
