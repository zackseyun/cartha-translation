source:
  edition: WLC
  text: כַּסְפָּ֞/ם בַּ/חוּצ֣וֹת יַשְׁלִ֗יכוּ וּ/זְהָבָ/ם֮ לְ/נִדָּ֣ה יִֽהְיֶה֒ כַּסְפָּ֨/ם וּ/זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה נַפְשָׁ/ם֙ לֹ֣א יְשַׂבֵּ֔עוּ וּ/מֵעֵי/הֶ֖ם לֹ֣א יְמַלֵּ֑אוּ כִּֽי מִכְשׁ֥וֹל עֲוֺנָ֖/ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/019.yaml
  text: They will throw their silver into the streets[a], and their gold will become an unclean thing. Their silver and their gold will not be able to deliver them in the day of Yahweh’s wrath. They will not satisfy their appetite, nor fill their stomachs, for it has become the stumbling block of their iniquity.
translation:
  language: pt
  text: Eles lançarão sua prata nas ruas, e seu ouro se tornará algo impuro.[a] Sua prata e seu ouro não poderão livrá-los no dia da ira de Yahweh. Não saciarão seu apetite nem encherão seu estômago, pois isso se tornou a pedra de tropeço da sua iniquidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “seu ouro será para impureza”. O termo hebraico pode evocar a impureza menstrual e, assim, algo ritualmente impuro e repulsivo.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “pois ele se tornou a pedra de tropeço da iniquidade deles”. O referente de “ele” não é explicitado e pode ser entendido como a riqueza mencionada, especialmente o ouro, ou coletivamente a prata e o ouro.
    reason: ambiguity
lexical_decisions:
- source_word: כַּסְפָּם
  choice: sua prata
  rationale: Embora כֶּסֶף também possa significar dinheiro, o paralelismo com “seu ouro” favorece o metal precioso e preserva a imagem concreta.
- source_word: בַּחוּצוֹת יַשְׁלִיכוּ
  choice: lançarão ... nas ruas
  rationale: חוּצוֹת designa ruas ou espaços abertos da cidade, e o verbo expressa o descarte vigoroso e público da riqueza.
- source_word: לְנִדָּה יִהְיֶה
  choice: se tornará uma coisa impura
  rationale: נִדָּה pode designar especificamente impureza menstrual, mas aqui caracteriza metaforicamente o ouro como algo impuro e repulsivo; a nota preserva a nuance lexical.
- source_word: לֹא יוּכַל לְהַצִּילָם
  choice: não poderão livrá-los
  rationale: O verbo singular hebraico trata o sujeito composto coletivamente. “Livrar” conserva o sentido de resgate diante do juízo sem impor uma acepção soteriológica mais estreita.
- source_word: נַפְשָׁם
  choice: seu apetite
  rationale: No paralelismo com encher o estômago, נֶפֶשׁ se refere ao desejo físico ou apetite, não necessariamente a uma alma imaterial.
- source_word: וּמֵעֵיהֶם
  choice: seu estômago
  rationale: מֵעֶה indica as partes internas ou o ventre; no contexto de saciedade alimentar, “estômago” é claro e natural.
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: a pedra de tropeço que os levou à iniquidade
  rationale: A formulação explicita de modo natural a relação entre o tropeço e a iniquidade, sem apagar a ambiguidade sobre aquilo a que o pronome implícito se refere.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Grau de explicitação de נִדָּה
  choice: uma coisa impura
  alternative: impureza menstrual; imundície
  rationale: A expressão principal comunica a impureza ritual sem tornar obrigatória a referência menstrual específica; essa possibilidade é mantida na nota.
- issue: Sentido contextual de נַפְשָׁם
  choice: seu apetite
  alternative: sua alma; sua vida; seu desejo
  rationale: O paralelismo corporal com o estômago aponta para fome e apetite, evitando introduzir uma afirmação antropológica que o contexto não exige.
- issue: Referente de הָיָה, “se tornou”
  choice: sua riqueza
  alternative: isso; seu ouro; sua prata e seu ouro
  rationale: O hebraico usa uma forma masculina singular cujo referente pode ser entendido de modo coletivo ou ligado à riqueza mencionada. “Sua riqueza” mantém a ligação contextual, enquanto a nota registra a forma mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a imagem profética do descarte da riqueza, o vocabulário de impureza e a tensão do referente final; uma leve explicitação no texto principal foi acompanhada de nota com a forma mais literal.
