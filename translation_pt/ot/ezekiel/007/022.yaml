  text: וַ/הֲסִבּוֹתִ֤י פָנַ/י֙ מֵ/הֶ֔ם וְ/חִלְּל֖וּ אֶת צְפוּנִ֑/י וּ/בָאוּ בָ֥/הּ פָּרִיצִ֖ים וְ/חִלְּלֽוּ/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/022.yaml
  text: I will turn my face away from them[a], and they will profane my treasured place[b]; violent men will enter it and profane it.
translation:
  language: pt
  text: Desviarei deles o meu rosto, e eles profanarão o meu lugar precioso[a]. Homens violentos[b] entrarão nele e o profanarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu tesouro”, “o meu lugar secreto” ou “aquilo que me é precioso”. O hebraico provavelmente se refere a algo precioso e protegido, talvez relacionado ao santuário.
    reason: lexical_alternative
  - marker: b
    text: Ou “homens cruéis”, “homens sem lei” ou “ladrões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִבּוֹתִי
  choice: Desviarei
  rationale: O hifil de סבב, no contexto profético de juízo, tem valor futuro. “Desviarei” expressa de modo natural o ato deliberado de voltar o rosto.
- source_word: פָנַי מֵהֶם
  choice: deles o meu rosto
  rationale: Preserva a imagem hebraica do rosto como sinal da atenção e do favor divinos, com uma construção natural em português.
- source_word: וְחִלְּלוּ
  choice: eles profanarão
  rationale: O piel de חלל indica tratar como comum ou violar aquilo que é santo. “Profanarão” mantém claramente o contraste com a santidade.
- source_word: צְפוּנִי
  choice: o meu lugar precioso
  rationale: A palavra pode designar algo escondido, guardado ou estimado. O contexto favorece uma referência ligada ao santuário, mas a formulação evita identificar de modo excessivamente específico o referente.
- source_word: וּבָאוּ בָהּ
  choice: entrarão nele
  rationale: Expressa idiomaticamente a entrada de invasores no lugar mencionado, sem acrescentar detalhes ausentes do hebraico.
- source_word: פָּרִיצִים
  choice: Homens violentos
  rationale: O termo descreve pessoas violentas, cruéis ou sem lei; esta opção mantém o sentido amplo sem reduzi-lo especificamente a ladrões.
- source_word: וְחִלְּלוּהָ
  choice: e o profanarão
  rationale: Repete o verbo anterior, como no hebraico, preservando a ênfase na profanação.
theological_decisions:
- issue: Referente de צְפוּנִי e do sufixo em בָהּ
  choice: Um lugar precioso ligado ao santuário, traduzido como “o meu lugar precioso” e retomado por “nele”.
  alternative: “meu tesouro”, “meu lugar secreto” ou “minha coisa preciosa”, possivelmente os tesouros ou o recinto do templo.
  rationale: A expressão hebraica é breve e ambígua. A profanação e a entrada de homens violentos favorecem um referente relacionado ao santuário, mas a tradução não determina qual objeto ou área sagrada está em vista.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “profanarão” preserva a ênfase do hebraico; a imagem “desviar o rosto” foi mantida por ser compreensível e teologicamente significativa.
