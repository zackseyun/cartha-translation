  text: עַתָּ֣ה מִ/קָּר֗וֹב אֶשְׁפּ֤וֹךְ חֲמָתִ/י֙ עָלַ֔יִ/ךְ וְ/כִלֵּיתִ֤י אַפִּ/י֙ בָּ֔/ךְ וּ/שְׁפַטְתִּ֖י/ךְ כִּ/דְרָכָ֑יִ/ךְ וְ/נָתַתִּ֣י עָלַ֔יִ/ךְ אֵ֖ת כָּל תּוֹעֲבוֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/008.yaml
  text: Now[a], soon I will pour out my wrath on you, and I will spend my anger against you; I will judge you according to your ways[b], and I will bring all your abominations upon you.
translation:
  language: pt
  text: Agora, em breve[a], derramarei sobre você o meu furor e levarei até o fim a minha ira contra você[b]. Julgarei você segundo os seus caminhos e farei recair sobre você todas as suas abominações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “daqui a pouco”. A expressão hebraica indica que o juízo está próximo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esgotarei a minha ira em você”. A expressão hebraica indica que a ira seguirá plenamente o seu curso contra a destinatária.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה מִקָּרוֹב
  choice: Agora, em breve
  rationale: Os dois elementos temporais comunicam a urgência e a proximidade do juízo. A formulação é natural em português e não acrescenta a intensidade de “muito em breve”.
- source_word: אֶשְׁפֹּךְ חֲמָתִי עָלַיִךְ
  choice: derramarei sobre você o meu furor
  rationale: Mantém a metáfora de derramar e expressa com clareza a intensidade da indignação divina.
- source_word: וְכִלֵּיתִי אַפִּי בָּךְ
  choice: levarei até o fim a minha ira contra você
  rationale: O verbo כָּלָה indica que a ira chegará ao seu curso completo. Esta formulação preserva o sentido sem recorrer à expressão pouco natural “esgotarei minha ira”.
- source_word: וּשְׁפַטְתִּיךְ
  choice: Julgarei você
  rationale: Preserva o sentido judicial fundamental do verbo, sem reduzi-lo antecipadamente a “punirei”.
- source_word: כִּדְרָכָיִךְ
  choice: segundo os seus caminhos
  rationale: Conserva a metáfora hebraica tradicional de “caminhos” para a conduta, compreensível no contexto profético.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  choice: farei recair sobre você todas as suas abominações
  rationale: Expressa o movimento judicial de trazer sobre a destinatária aquilo que corresponde às suas práticas, preservando “abominações” como termo forte de peso moral e religioso.
theological_decisions:
- issue: Distinção entre חֲמָה e אַף
  choice: furor e ira
  alternative: traduzir ambos pelo mesmo termo, como “ira”
  rationale: O hebraico emprega dois termos relacionados em paralelismo. Dois vocábulos portugueses preservam a variação retórica sem lhes atribuir uma distinção técnica rígida.
- issue: Natureza do julgamento segundo os caminhos
  choice: Julgarei você segundo os seus caminhos
  alternative: Punirei você conforme a sua conduta
  rationale: A tradução mantém tanto a linguagem judicial quanto a metáfora do original, deixando que o contexto comunique o resultado punitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita uma flexão regional marcada e corresponde ao sufixo feminino singular do hebraico sem precisar repetir explicitamente o referente. A pontuação divide o anúncio em duas frases para maior clareza oral.
