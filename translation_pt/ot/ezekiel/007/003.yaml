base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/003.yaml
  text: Now the end is upon you[a], and I will send my anger against you. I will judge you according to your ways, and I will bring all your abominations upon you.
translation:
  language: pt
  text: Agora, o fim está sobre você, e enviarei contra você a minha ira. Eu julgarei você segundo os seus caminhos e farei recair sobre você todas as suas abominações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «porei sobre você todas as suas abominações». O hebraico diz literalmente «darei/porei sobre você todas as suas abominações», expressão que pode indicar que as consequências dessas abominações recairão sobre o destinatário.'
    reason: Alternativa lexical e esclarecimento do idioma hebraico.
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a iminência do juízo anunciado e preserva a força abrupta do hebraico.
- source_word: הַקֵּץ
  choice: o fim
  rationale: O artigo definido favorece «o fim». A expressão mantém a gravidade profética sem impor uma interpretação escatológica cósmica.
- source_word: עָלַיִךְ
  choice: chegou sobre você
  rationale: A expressão hebraica é literalmente «o fim [está] sobre você». O verbo «chegou», suprido em português, torna explícita a chegada do fim sem perder a imagem de algo que sobrevém ao destinatário.
- source_word: וְשִׁלַּחְתִּי אַפִּי בָּךְ
  choice: enviarei contra você a minha ira
  rationale: «Enviarei» preserva o sentido básico de שׁלח, enquanto «ira» comunica de modo digno e corrente o uso idiomático de אַף no contexto do juízo divino.
- source_word: וּשְׁפַטְתִּיךְ
  choice: Eu julgarei você
  rationale: Tradução direta do verbo judicial, em construção natural e amplamente compreensível em português.
- source_word: כִּדְרָכָיִךְ
  choice: segundo os seus caminhos
  rationale: Mantém a metáfora profética dos «caminhos» como conduta, sem reduzi-la a uma paráfrase.
- source_word: וְנָתַתִּי עָלַיִךְ
  choice: farei recair sobre você
  rationale: Expressa naturalmente em português o sentido punitivo contextual de «pôr sobre», indicando que os atos abomináveis recaem sobre quem os praticou.
- source_word: אֵת כָּל תּוֹעֲבֹתָיִךְ
  choice: todas as suas abominações
  rationale: «Abominações» conserva a intensidade moral, cultual e profética de תּוֹעֵבָה.
theological_decisions:
- issue: Natureza de «o fim»
  choice: Anúncio histórico-profético de juízo iminente, traduzido simplesmente como «o fim».
  alternative: Entender a expressão como referência técnica ao fim escatológico e cósmico.
  rationale: O contexto imediato trata do juízo que sobrevém à terra e ao povo. A formulação preserva a solenidade e a possível amplitude da expressão sem acrescentar uma categoria doutrinária posterior.
- issue: Relação entre as abominações e o juízo
  choice: «Farei recair sobre você todas as suas abominações», preservando a imagem de que elas são postas sobre o destinatário.
  alternative: Explicitar no texto principal «farei recair sobre você as consequências de todas as suas abominações».
  rationale: O hebraico não inclui uma palavra explícita para «consequências». A tradução principal conserva a tensão da imagem; a nota esclarece a alternativa idiomática.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Você» representa o destinatário feminino singular do hebraico sem introduzir no versículo uma identificação que depende do contexto. A repetição de «você» mantém a acusação direta e enfática.
