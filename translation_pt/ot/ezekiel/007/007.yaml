base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/007.yaml
  text: Doom has come upon you[a], inhabitant of the land. The time has come; the day is near—panic[b], and not joyful shouting on the mountains.
translation:
  language: pt
  text: A ruína chegou sobre você[a], habitante da terra. Chegou o tempo; o dia está próximo — pânico[b], e não gritos de alegria nos montes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A virada chegou sobre você” ou “Chegou o seu destino”. O termo hebraico é raro e de sentido incerto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tumulto, e não eco nos montes”. A frase final é difícil; muitos a entendem como contraste entre o pânico e os habituais gritos de alegria ouvidos nos montes, talvez durante a colheita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִירָה
  choice: a ruína
  rationale: O substantivo é raro e de sentido incerto. No contexto de juízo, em paralelo com a chegada do tempo e a proximidade do dia, “ruína” comunica de modo natural a virada fatal que chegou, sem adotar a acepção pouco provável de “coroa”.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: habitante da terra
  rationale: O particípio singular funciona naturalmente como vocativo. “Terra” designa aqui o território e seu povo, sendo mais contextual do que “mundo”.
- source_word: הָעֵת
  choice: o tempo
  rationale: Tradução direta que preserva o anúncio temporal sem acrescentar explicitamente a ideia de tempo determinado.
- source_word: קָרוֹב הַיּוֹם
  choice: o dia está próximo
  rationale: Formulação natural em português que mantém a ênfase na iminência do dia de juízo.
- source_word: מְהוּמָה
  choice: pânico
  rationale: No contexto profético de juízo, o termo indica perturbação, confusão e terror; “pânico” expressa claramente sua força vivencial.
- source_word: הֵד
  choice: gritos de alegria
  rationale: Embora possa significar literalmente “eco” ou “clamor”, o contraste parece ser entre o tumulto do juízo e os gritos festivos normalmente ouvidos nos montes. A nota preserva a leitura mais literal.
- source_word: הָרִים
  choice: os montes
  rationale: “Montes” é uma tradução corrente e natural do plural hebraico e se ajusta ao cenário de onde se ouviriam clamores festivos.
