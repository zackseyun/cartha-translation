  text: וְ/חָגְר֣וּ שַׂקִּ֔ים וְ/כִסְּתָ֥ה אוֹתָ֖/ם פַּלָּצ֑וּת וְ/אֶ֤ל כָּל פָּנִים֙ בּוּשָׁ֔ה וּ/בְ/כָל רָאשֵׁי/הֶ֖ם קָרְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/018.yaml
  text: They will put on sackcloth, and horror will cover them; shame will be on every face, and baldness on all their heads.
translation:
  language: pt
  text: Eles se vestirão de pano de saco, e o horror os cobrirá; haverá vergonha em todos os rostos e calvície em todas as cabeças.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂקִּים
  choice: pano de saco
  rationale: Expressão portuguesa clara e tradicional para a veste áspera associada ao luto, à humilhação e à aflição.
- source_word: פַלָּצוּת
  choice: horror
  rationale: O substantivo raro denota terror ou horror intenso; “horror” preserva a força da imagem e se ajusta naturalmente ao verbo “cobrir”.
- source_word: בּוּשָׁה
  choice: vergonha
  rationale: Equivalente direto que mantém a dimensão pública da humilhação indicada pelos rostos.
- source_word: קָרְחָה
  choice: calvície
  rationale: Designa a ausência de cabelo, aqui como sinal visível de luto ou calamidade, sem explicitar no texto uma causa não declarada.
theological_decisions:
- issue: Sentido ritual da calvície
  choice: Manter apenas “calvície”, sem explicar sua função no corpo do versículo.
  alternative: “cabeças rapadas em sinal de luto”
  rationale: O hebraico apresenta a imagem, mas não explicita neste versículo se o cabelo foi rapado deliberadamente; a tradução preserva essa concisão e ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com paralelismo claro. “Eles se vestirão” comunica naturalmente o ato de cingir pano de saco; “em todos os rostos” e “em todas as cabeças” conservam a abrangência distributiva do hebraico.
