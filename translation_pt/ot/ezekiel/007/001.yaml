base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por «o SENHOR»; também vertido como «Yahweh».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: O waw consecutivo com היה introduz uma nova unidade profética; em português natural, seu valor é incorporado à fórmula «a palavra ... veio», sem o pouco idiomático «e aconteceu».
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר־יְהוָה, «a palavra» preserva a expressão recorrente de revelação e sua ligação formal com outras passagens; «a mensagem» seria possível, mas menos próxima do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino YHWH; «Yahweh» o representa diretamente, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo da primeira pessoa significa diretamente «a mim» e soa natural nesta fórmula.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo construto introduz a fala que vem a seguir. «Dizendo» conserva a estrutura hebraica, e os dois-pontos sinalizam naturalmente a continuação no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega diretamente o Tetragrama, a tradução mantém o nome pessoal na forma «Yahweh», sem convertê-lo silenciosamente no título «SENHOR».
translation_notes:
  register: Português moderno, claro e digno, com formulação profética tradicional sem arcaísmos. O início assindético em português evita um «E» dispensável, enquanto «veio» comunica o valor narrativo de וַיְהִי. A vírgula antes de «dizendo» acompanha a estrutura da fórmula, e os dois-pontos preparam a fala do versículo seguinte.
