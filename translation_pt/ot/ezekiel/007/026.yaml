  text: הֹוָ֤ה עַל הֹוָה֙ תָּב֔וֹא וּ/שְׁמֻעָ֥ה אֶל שְׁמוּעָ֖ה תִּֽהְיֶ֑ה וּ/בִקְשׁ֤וּ חָזוֹן֙ מִ/נָּבִ֔יא וְ/תוֹרָה֙ תֹּאבַ֣ד מִ/כֹּהֵ֔ן וְ/עֵצָ֖ה מִ/זְּקֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/026.yaml
  text: Disaster upon disaster will come[a], and rumor upon rumor will arise. They will seek a vision from a prophet, but instruction will perish from the priest[b], and counsel from the elders.
translation:
  language: pt
  text: Desastre após desastre virá, e notícia após notícia surgirá.[a] Buscarão uma visão da parte de um profeta, mas a instrução desaparecerá do sacerdote,[b] e o conselho dos anciãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rumor após rumor”. O termo hebraico pode significar notícia, relato ou rumor; aqui indica informes alarmantes que se sucedem.
    reason: lexical_alternative
  - marker: b
    text: Ou “a lei desaparecerá do sacerdote”. O hebraico torá pode significar instrução, ensino ou lei; neste contexto, refere-se provavelmente à instrução sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹוָה עַל הֹוָה
  choice: Desastre após desastre
  rationale: Preserva a repetição intensificadora e comunica uma sucessão acumulativa de calamidades em português natural.
- source_word: שְׁמֻעָה אֶל שְׁמוּעָה
  choice: notícia após notícia
  rationale: שְׁמוּעָה pode indicar notícia, relato ou rumor. “Notícia” mantém a ambiguidade quanto à confiabilidade dos informes e se ajusta ao paralelismo com a sucessão de desastres.
- source_word: וּבִקְשׁוּ חָזוֹן מִנָּבִיא
  choice: Buscarão uma visão da parte de um profeta
  rationale: Traduz diretamente a procura por revelação profética e preserva o caráter indefinido de נָבִיא, sem pressupor um profeta específico.
- source_word: וְתוֹרָה תֹּאבַד מִכֹּהֵן
  choice: a instrução desaparecerá do sacerdote
  rationale: Neste contexto, תּוֹרָה designa sobretudo a instrução ministrada pelo sacerdote. “Desaparecerá” expressa a perda ou ausência indicada por אבד de modo idiomático.
- source_word: וְעֵצָה מִזְּקֵנִים
  choice: e o conselho, dos anciãos
  rationale: A elipse verbal do hebraico é preservada por meio da vírgula, ligando “conselho” ao desaparecimento já expresso e mantendo a concisão solene do verso.
theological_decisions:
- issue: Sentido de תּוֹרָה no papel sacerdotal
  choice: instrução
  alternative: lei; ensino
  rationale: O verso apresenta o colapso das fontes reconhecidas de orientação — profeta, sacerdote e anciãos. “Instrução” abrange o ensino e a orientação sacerdotais sem restringir o termo a um código legal abstrato.
- issue: Força institucional dos substantivos de liderança
  choice: um profeta; o sacerdote; os anciãos
  alternative: o profeta; um sacerdote; anciãos
  rationale: O profeta permanece indefinido conforme o hebraico sem artigo; “o sacerdote” funciona genericamente para o ofício sacerdotal, enquanto o plural “anciãos” é mantido. A formulação não identifica indivíduos específicos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição paralela foi mantida, e a elipse final reproduz a concisão do hebraico sem soar artificial.
