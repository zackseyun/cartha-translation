source:
  edition: WLC
  text: וְ/זָכְר֨וּ פְלִֽיטֵי/כֶ֜ם אוֹתִ֗/י בַּ/גּוֹיִם֮ אֲשֶׁ֣ר נִשְׁבּוּ שָׁם֒ אֲשֶׁ֨ר נִשְׁבַּ֜רְתִּי אֶת לִבָּ֣/ם הַ/זּוֹנֶ֗ה אֲשֶׁר סָר֙ מֵֽ/עָלַ֔/י וְ/אֵת֙ עֵֽינֵי/הֶ֔ם הַ/זֹּנ֕וֹת אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָקֹ֨טּוּ֙ בִּ/פְנֵי/הֶ֔ם אֶל הָֽ/רָעוֹת֙ אֲשֶׁ֣ר עָשׂ֔וּ לְ/כֹ֖ל תּוֹעֲבֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/009.yaml
  text: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
translation:
  language: pt
  text: Então os sobreviventes de vocês se lembrarão de mim entre as nações para onde foram levados cativos, quando eu tiver quebrado[a] o coração deles, que se prostituiu e se afastou de mim, e os olhos deles, que se prostituíam[b] correndo atrás dos seus ídolos[c]. Eles sentirão nojo de si mesmos por causa das maldades que cometeram em todas as suas abominações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu tiver sido quebrantado pelo coração deles, que se prostituiu e se afastou de mim”. Alguns intérpretes entendem assim o verbo hebraico, destacando a dor do SENHOR diante da infidelidade do povo.'
    reason: alternative_reading
  - marker: b
    text: O hebraico emprega a imagem da prostituição — o coração e os olhos “se prostituem” — como metáfora da infidelidade à aliança e da idolatria.
    reason: cultural_note
  - marker: c
    text: “Ídolos” traduz um termo hebraico depreciativo usado com frequência por Ezequiel para os falsos deuses; pode ter uma nuance como “ídolos imundos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכְרוּ
  choice: Então ... se lembrarão
  rationale: O waw com a forma verbal perfeita em discurso profético pode dar sequência ao resultado anunciado. “Então” explicita essa progressão sem perder o sentido básico de lembrar.
- source_word: פְלִיטֵיכֶם
  choice: os sobreviventes de vocês
  rationale: O substantivo designa os que escaparam da destruição. “Sobreviventes” é claro, atual e adequado ao contexto de juízo.
- source_word: בַּגּוֹיִם אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: entre as nações para onde foram levados cativos
  rationale: גוים indica aqui os povos ou territórios estrangeiros do cativeiro, e o nifal de שבה expressa que eles foram capturados. A formulação portuguesa evita a redundância literal de “onde... ali”.
- source_word: אֲשֶׁר נִשְׁבַּרְתִּי אֶת לִבָּם
  choice: quando eu tiver quebrado o coração deles
  rationale: A leitura principal toma Deus como sujeito do verbo e “o coração deles” como objeto direto, em conformidade com a vocalização massorética e com אֶת. O futuro composto se ajusta à perspectiva futura de “se lembrarão” e apresenta a quebra como anterior ou concomitante ao resultado.
- source_word: לִבָּם הַזּוֹנֶה
  choice: o coração deles, que se prostituía
  rationale: A expressão conserva a forte metáfora sexual de זנה para a infidelidade à aliança, sem reduzi-la apenas a “infiel”. O singular acompanha “coração” no hebraico.
- source_word: אֲשֶׁר סָר מֵעָלַי
  choice: e se afastou de mim
  rationale: סר comunica afastamento ou desvio relacional. “Afastou-se de mim” é natural em português e preserva a ideia de apostasia.
- source_word: וְאֵת עֵינֵיהֶם הַזֹּנוֹת אַחֲרֵי גִּלּוּלֵיהֶם
  choice: e os olhos deles, que se prostituíam correndo atrás dos seus ídolos
  rationale: A tradução mantém a metáfora da prostituição aplicada aos olhos e verte אַחֲרֵי por uma expressão dinâmica de busca desejosa. “Ídolos” comunica com clareza o referente de גִּלּוּלִים, enquanto sua carga depreciativa é registrada em nota.
- source_word: וְנָקֹטּוּ בִפְנֵיהֶם
  choice: Eles sentirão nojo de si mesmos
  rationale: O idioma hebraico exprime repulsa voltada contra a própria pessoa. Esta formulação é mais natural em português do que uma reprodução formal de “diante do próprio rosto”.
- source_word: אֶל הָרָעוֹת אֲשֶׁר עָשׂוּ
  choice: por causa das maldades que cometeram
  rationale: A preposição introduz a causa ou objeto da repulsa. “Cometer maldades” é idiomático e conserva o peso moral de רָעוֹת.
- source_word: לְכֹל תּוֹעֲבֹתֵיהֶם
  choice: em todas as suas abominações
  rationale: “Abominações” preserva a forte carga pactual e retórica de תּוֹעֵבוֹת, frequentemente associada às práticas idólatras em Ezequiel.
theological_decisions:
- issue: Sentido de אֲשֶׁר נִשְׁבַּרְתִּי אֶת לִבָּם
  choice: Deus é o sujeito que quebra o coração prostituído do povo no juízo.
  alternative: Deus declara ter sido quebrantado ou ferido pelo coração prostituído do povo.
  rationale: A vocalização massorética e o marcador de objeto direto antes de “coração deles” favorecem a leitura ativa. Como a leitura ligada à dor divina é antiga e interpretativamente relevante, ela é preservada em nota em vez de ser eliminada.
- issue: Metáfora de prostituição
  choice: Manter “se prostituía” tanto para o coração como para os olhos.
  alternative: Suavizar para “era infiel” e “desejavam”.
  rationale: A linguagem deliberadamente chocante de Ezequiel retrata a idolatria como infidelidade à aliança. Preservar a metáfora mantém sua força teológica e retórica, com uma nota explicativa para evitar leitura meramente sexual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe evita literalismos obscuros, mas conserva a imagem áspera da prostituição, o termo teologicamente forte “abominações” e a ambiguidade relevante do verbo נִשְׁבַּרְתִּי por meio de nota.
