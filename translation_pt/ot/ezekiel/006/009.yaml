  terminology: “Sobreviventes”, “nações”, “levados cativos”, “ídolos” e “abominações” são escolhas adequadas. “Se prostituiu” preserva a imagem pactual sexualmente explícita de זנה sem introduzir interpretação denominacional. As notas sobre a leitura alternativa, a metáfora e o tom depreciativo de גלולים são pertinentes.
