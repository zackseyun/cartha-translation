source:
  edition: WLC
  text: בְּ/כֹל֙ מוֹשְׁב֣וֹתֵי/כֶ֔ם הֶ/עָרִ֣ים תֶּחֱרַ֔בְנָה וְ/הַ/בָּמ֖וֹת תִּישָׁ֑מְנָה לְמַעַן֩ יֶחֶרְב֨וּ וְ/יֶאְשְׁמ֜וּ מִזְבְּחֽוֹתֵי/כֶ֗ם וְ/נִשְׁבְּר֤וּ וְ/נִשְׁבְּתוּ֙ גִּלּ֣וּלֵי/כֶ֔ם וְ/נִגְדְּעוּ֙ חַמָּ֣נֵי/כֶ֔ם וְ/נִמְח֖וּ מַעֲשֵׂי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/006.yaml
  text: In all your dwelling places[a], the cities will be laid waste and the high places will be desolated, so that your altars may be laid waste and desolated, and your idols broken and brought to an end, and your incense altars cut down[b], and your works wiped out.
translation:
  language: pt
  text: Em todos os lugares onde vocês moram, as cidades serão devastadas, e os lugares altos ficarão desolados, para que os seus altares sejam devastados e desolados, os seus ídolos[a] sejam quebrados e eliminados, os seus altares de incenso[b] sejam derrubados, e as obras de vocês sejam apagadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é fortemente depreciativo e talvez evoque algo imundo ou relacionado a excremento.
    reason: lexical_alternative
  - marker: b
    text: Ou “as suas colunas solares” ou “as suas imagens do sol”. O termo hebraico designa um tipo discutido de objeto cultual, possivelmente associado ao culto solar.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: os lugares onde vocês moram
  rationale: Expressa naturalmente a ideia ampla de lugares de habitação, sem restringi-la administrativamente a povoações.
- source_word: הֶעָרִים תֶּחֱרַבְנָה
  choice: as cidades serão devastadas
  rationale: Comunica com clareza a ruína causada pelo juízo e preserva a força de חרב.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Mantém o termo técnico tradicional para os locais de culto, sem restringi-los necessariamente a santuários situados em colinas.
- source_word: תִּישָׁמְנָה
  choice: ficarão desolados
  rationale: Reproduz o estado de desolação indicado pelo verbo e soa natural em português.
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva a relação de propósito ou resultado sem resolver a possível sobreposição entre essas noções.
- source_word: יֶחֶרְבוּ וְיֶאְשְׁמוּ מִזְבְּחוֹתֵיכֶם
  choice: os seus altares sejam devastados e abandonados
  rationale: Traduz os dois verbos distintos, comunicando tanto ruína quanto desolação, sem repetição pouco natural.
- source_word: גִּלּוּלֵיכֶם
  choice: os seus ídolos
  rationale: É claro e corrente no texto principal; a carga fortemente depreciativa do hebraico é preservada em nota.
- source_word: וְנִשְׁבְּרוּ וְנִשְׁבְּתוּ
  choice: sejam quebrados e eliminados
  rationale: Distingue o ato de quebrar da ideia de fazer cessar ou pôr fim.
- source_word: חַמָּנֵיכֶם
  choice: os seus altares de incenso
  rationale: Oferece uma leitura cultual inteligível, mantendo em nota a incerteza sobre a natureza exata do objeto e sua possível associação solar.
- source_word: וְנִמְחוּ מַעֲשֵׂיכֶם
  choice: as obras de vocês sejam apagadas
  rationale: Preserva tanto a imagem de eliminação completa quanto a ambiguidade de מַעֲשֵׂיכֶם entre feitos e objetos produzidos.
theological_decisions:
- issue: Condenação dos locais e objetos de culto idólatra
  choice: Manter no texto termos concretos como “lugares altos”, “altares” e “ídolos”, com linguagem direta de juízo.
  alternative: Generalizar a passagem como condenação abstrata da religião falsa ou intensificar “ídolos” para “ídolos imundos” no texto principal.
  rationale: O hebraico denuncia locais e objetos cultuais específicos. A tradução conserva essa concretude e severidade, enquanto remete a nuance depreciativa de גִּלּוּלִים para a nota, evitando acrescentar uma interpretação única ao texto principal.
- issue: Relação introduzida por לְמַעַן
  choice: “para que”
  alternative: “de modo que”
  rationale: A construção pode envolver propósito e resultado. “Para que” conserva a forma final do hebraico sem explicar em excesso a relação teológica do juízo com a destruição dos objetos cultuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. O paralelismo da série de juízos foi preservado, evitando formulações excessivamente arcaicas. Todos os marcadores de nota aparecem junto aos termos pertinentes no texto principal.
