source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַכֵּ֨ה בְ/כַפְּ/ךָ֜ וּ/רְקַ֤ע בְּ/רַגְלְ/ךָ֙ וֶֽ/אֱמָר אָ֔ח אֶ֛ל כָּל תּוֹעֲב֥וֹת רָע֖וֹת בֵּ֣ית יִשְׂרָאֵ֑ל אֲשֶׁ֗ר בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר יִפֹּֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/011.yaml
  text: 'Thus says the Lord GOD: Strike your hand and stamp your foot[a], and say, “Alas!” because of all the evil abominations of the house of Israel, who will fall by the sword, by famine[c][b], and by pestilence.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Bata palmas[a] e bata o pé, e diga: ‘Ai!’[b], por causa de todas as abominações malignas da casa de Israel; pois eles cairão pela espada, pela fome e pela peste.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dê uma palmada”. O hebraico pode referir-se a um golpe enfático com a palma da mão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ah!”. Neste contexto, a interjeição hebraica provavelmente expressa lamento pelo juízo que se aproxima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יְהוָה e preserva o nome pactual em forma amplamente reconhecível.
- source_word: הַכֵּה בְכַפְּךָ
  choice: Bata com a palma da mão
  rationale: Conserva a imagem concreta do gesto enfático sem decidir de modo categórico que se trata de bater palmas.
- source_word: וּרְקַע בְרַגְלְךָ
  choice: sapateie
  rationale: Expressa de modo natural em português o ato enfático de bater o pé no chão.
- source_word: וֶאֱמָר אָח
  choice: 'e diga: ‘Ai!’'
  rationale: A interjeição אָח exprime aqui lamento diante do juízo vindouro, não celebração.
- source_word: אֶל כָּל תּוֹעֲבוֹת רָעוֹת
  choice: por causa de todas as abominações malignas
  rationale: אֶל introduz o motivo ou objeto do lamento; 'abominações' mantém a forte carga cultual e moral de תּוֹעֲבוֹת.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico.
- source_word: אֲשֶׁר ... יִפֹּלוּ
  choice: pois eles cairão
  rationale: Torna explícito que os integrantes da casa de Israel sofrerão o juízo e lê o relativo como explicativo ou causal, evitando a concordância pouco natural de um verbo plural com 'casa'.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: pela espada, pela fome e pela peste
  rationale: Preserva a tríade profética tradicional de meios de juízo em linguagem clara e solene.
theological_decisions:
- issue: Representação do nome divino יְהוָה na fórmula אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução mantém separado o título 'Senhor' do nome próprio divino e não oculta o tetragrama sob outro título.
- issue: Valor da interjeição אָח
  choice: 'lamento: ‘Ai!’'
  alternative: 'exclamação ambígua: ‘Ah!’'
  rationale: O contexto de queda pela espada, fome e peste favorece lamento, embora a forma hebraica isolada possa admitir uma exclamação menos específica.
translation_notes:
  register: Português atual, digno e de leitura ampla. 'Sapateie' comunica de forma concisa o gesto corporal; 'abominações malignas' preserva a intensidade do hebraico, e 'peste' mantém a formulação profética tradicional sem soar excessivamente arcaica.
