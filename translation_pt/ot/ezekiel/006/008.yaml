  text: וְ/הוֹתַרְתִּ֗י בִּ/הְי֥וֹת לָ/כֶ֛ם פְּלִ֥יטֵי חֶ֖רֶב בַּ/גּוֹיִ֑ם בְּ/הִזָּרֽוֹתֵי/כֶ֖ם בָּ/אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/008.yaml
  text: Yet I will leave a remnant[a], when some of you become escapees from the sword among the nations, when you are scattered through the lands.
translation:
  language: pt
  text: Contudo, deixarei um remanescente, quando alguns de vocês escaparem da espada[a] entre as nações, ao serem dispersos pelas terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobreviventes da espada” ou “os que escaparem da espada”.
    reason: Alternativas lexicais para a expressão hebraica פְּלִיטֵי חֶרֶב, “os que escapam/sobrevivem à espada”.
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: Contudo, deixarei um remanescente
  rationale: O hifil de יתר significa deixar restar, poupar ou preservar. “Contudo” explicita a força adversativa percebida no contexto do juízo, e “deixarei um remanescente” comunica de modo natural que alguns serão preservados.
- source_word: בִּהְיוֹת
  choice: quando
  rationale: O infinitivo construto de היה com ב introduz aqui uma circunstância temporal; “quando” é claro e natural em português.
- source_word: לָכֶם
  choice: alguns de vocês
  rationale: A construção de existência com o pronome dativo, literalmente “haver para vocês”, indica que haverá pessoas preservadas dentre o grupo ao qual Deus se dirige.
- source_word: פְּלִיטֵי חֶרֶב
  choice: escaparem da espada
  rationale: A expressão nominal designa fugitivos ou pessoas que escapam da espada. A formulação verbal é idiomática em português e mantém em primeiro plano a ideia de escapar, sem reduzi-la apenas à sobrevivência.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם refere-se aos povos estrangeiros entre os quais Israel seria disperso; “nações” é a equivalência corrente e adequada ao contexto.
- source_word: בְּהִזָּרוֹתֵיכֶם
  choice: ao serem dispersos
  rationale: O infinitivo construto de זרה com sufixo de segunda pessoa descreve a dispersão do povo. A forma passiva evita especificar na própria oração uma agência que a construção hebraica não explicita gramaticalmente.
- source_word: בָּאֲרָצוֹת
  choice: pelas terras
  rationale: O plural אֲרָצוֹת aponta para as diversas terras do exílio. “Pelas terras” expressa a amplitude da dispersão sem introduzir a noção política moderna de países.
theological_decisions:
- issue: A linguagem do remanescente em um anúncio de juízo
  choice: Contudo, deixarei um remanescente
  alternative: Contudo, pouparei alguns; Mas deixarei sobreviventes
  rationale: 'A tradução conserva a tensão entre juízo e preservação: a destruição não será total, pois alguns restarão. “Remanescente” é justificado pelo sentido de יתר, mas não acrescenta ao versículo uma elaboração doutrinária posterior.'
- issue: Relação entre o remanescente e os que escapam da espada
  choice: quando alguns de vocês escaparem da espada
  alternative: quando vocês tiverem sobreviventes da espada
  rationale: A formulação identifica os que restam como pessoas dentre os destinatários que escapam da guerra. Ela preserva a ideia concreta de fuga presente em פְּלִיטֵי, sem resolver além do texto como ocorre essa preservação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. “Remanescente” preserva a ressonância bíblica; “alguns de vocês escaparem” torna idiomática a construção hebraica de existência sem perder seu sentido partitivo.
