  text: And I will place the corpses of the sons of Israel before their idols[a], and I will scatter your bones around your altars.
translation:
  language: pt
  text: Porei os cadáveres dos filhos de Israel diante dos seus ídolos[a] e espalharei os ossos de vocês ao redor dos seus altares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico גִּלּוּלִים é a designação depreciativa que Ezequiel usa para os ídolos; pode conter uma nuance de desprezo como “ídolos imundos” ou até “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Porei
  rationale: נתן tem sentido amplo de dar, pôr ou colocar. Com cadáveres como objeto e uma expressão locativa, “porei” comunica de modo natural e concreto a ação anunciada.
- source_word: פִּגְרֵי
  choice: os cadáveres
  rationale: פגר designa cadáver ou corpo morto. “Cadáveres” preserva a força sombria do juízo e deixa claro que se trata de restos humanos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: A expressão hebraica significa literalmente “filhos de Israel” e funciona aqui como designação coletiva e pactual do povo.
- source_word: לִפְנֵי
  choice: diante de
  rationale: לִפְנֵי significa “diante de” ou “em frente de”. A escolha preserva a cena irônica de cadáveres postos perante os ídolos.
- source_word: גִּלּוּלֵיהֶם
  choice: dos seus ídolos
  rationale: גִּלּוּלִים é uma designação depreciativa usada por Ezequiel para ídolos. “Ídolos” identifica claramente o referente, enquanto a nuance de desprezo é registrada em nota.
- source_word: וְזֵרִיתִי
  choice: e espalharei
  rationale: זרה pode significar espalhar ou joeirar. Com ossos como objeto, “espalharei” é a formulação contextual mais clara.
- source_word: עַצְמוֹתֵיכֶם
  choice: os ossos de vocês
  rationale: A expressão preserva tanto o sentido direto de “ossos” quanto a mudança do discurso para a segunda pessoa do plural. “De vocês” oferece ampla legibilidade brasileira sem perder a referência plural.
- source_word: סְבִיבוֹת
  choice: ao redor de
  rationale: O termo indica a área circundante; “ao redor de” é claro e idiomático em português.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: dos seus altares
  rationale: מִזְבֵּחַ significa “altar”, e o sufixo de segunda pessoa plural atribui esses altares aos destinatários do anúncio profético.
theological_decisions:
- issue: Preservação da expressão étnica e pactual בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A forma literal conserva a textura hebraica e a designação coletiva tradicional, sem exigir que apenas homens estejam em vista.
- issue: Tradução do termo polêmico גִּלּוּלִים
  choice: ídolos
  alternative: ídolos imundos; ídolos de esterco
  rationale: “Ídolos” mantém o texto principal natural e inequívoco. Como a etimologia e a intensidade exata da nuance depreciativa são discutidas, a nota preserva essa informação sem impor no texto uma interpretação mais específica.
- issue: Mudança da terceira para a segunda pessoa
  choice: seus ídolos ... ossos de vocês ... seus altares
  alternative: ídolos deles ... vossos ossos ... vossos altares
  rationale: O hebraico passa de “os cadáveres dos filhos de Israel” e “seus ídolos” para uma interpelação direta, “ossos de vocês” e “altares de vocês”. A tradução conserva essa mudança retórica com formas naturais no português moderno.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para marcar naturalmente a segunda pessoa do plural, conserva “filhos de Israel” como expressão coletiva do original e mantém a linguagem gráfica do juízo.
