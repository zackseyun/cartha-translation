  text: וְ/נָפַ֥ל חָלָ֖ל בְּ/תֽוֹכְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/007.yaml
  text: The slain will fall in your midst[a], and you will know that I am Yahweh.
translation:
  language: pt
  text: Os mortos cairão no meio de vocês, e vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָפַל
  choice: cairão
  rationale: O perfeito qal com conjunção, no discurso profético, expressa aqui o resultado futuro do juízo; o plural concorda naturalmente em português com o coletivo «os mortos».
- source_word: חָלָל
  choice: os mortos
  rationale: Neste contexto de juízo, o substantivo designa pessoas mortas violentamente, não apenas feridas. O plural genérico transmite em português o valor coletivo do singular hebraico.
- source_word: בְּתוֹכְכֶם
  choice: no meio de vocês
  rationale: Indica que as vítimas cairão entre o próprio povo. A expressão é clara, natural e preserva o tom solene.
- source_word: וִידַעְתֶּם
  choice: vocês saberão
  rationale: Mantém a fórmula de reconhecimento recorrente em Ezequiel e seu sentido futuro/resultativo.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Traduz diretamente a fórmula hebraica e conserva o nome divino pessoal representado pelo Tetragrama.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama. «Yahweh» preserva o nome pessoal, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Vocês» explicita o plural de בְּתוֹכְכֶם e וִידַעְתֶּם. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
