  text: הָ/רָח֞וֹק בַּ/דֶּ֣בֶר יָמ֗וּת וְ/הַ/קָּרוֹב֙ בַּ/חֶ֣רֶב יִפּ֔וֹל וְ/הַ/נִּשְׁאָר֙ וְ/הַ/נָּצ֔וּר בָּ/רָעָ֖ב יָמ֑וּת וְ/כִלֵּיתִ֥י חֲמָתִ֖/י בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/012.yaml
  text: The one far away will die by pestilence[a], and the one nearby will fall by the sword, and the one left and besieged will die by famine[b]; and I will spend my wrath on them.
translation:
  language: pt
  text: Quem estiver longe morrerá de peste; quem estiver perto cairá à espada; e quem restar e estiver sitiado[a] morrerá de fome; e levarei até o fim a minha ira contra eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quem restar e ficar cercado”. O termo hebraico pode descrever alguém confinado por um cerco, sentido que combina com a morte pela fome.
    reason: lexical_alternative
  - marker: b
    text: Ou “esgotarei sobre eles a minha ira”. O verbo hebraico expressa a ideia de levar a ira à sua plena consumação no juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָחוֹק
  choice: quem estiver longe
  rationale: O adjetivo substantivado designa distributivamente a pessoa distante; a construção com “quem” é natural em português e mantém o contraste espacial.
- source_word: בַּדֶּבֶר
  choice: de peste
  rationale: דֶּבֶר indica peste ou epidemia como instrumento de juízo. Em português, “morrer de peste” é mais idiomático que “morrer por peste”.
- source_word: יָמוּת
  choice: morrerá
  rationale: O imperfeito anuncia profeticamente um acontecimento futuro.
- source_word: הַקָּרוֹב
  choice: quem estiver perto
  rationale: Mantém o paralelismo e o contraste com “quem estiver longe” em linguagem corrente.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Expressão portuguesa tradicional e inteligível para morte em guerra, preservando a imagem concreta da espada.
- source_word: יִפּוֹל
  choice: cairá
  rationale: Preserva a imagem hebraica convencional de cair em combate ou por morte violenta.
- source_word: הַנִּשְׁאָר
  choice: quem restar
  rationale: O particípio passivo indica aquele que permaneceu ou foi deixado; evita transformar a expressão no termo mais técnico “remanescente”.
- source_word: הַנָּצוּר
  choice: estiver sitiado
  rationale: No contexto de fome provocada por cerco, o sentido “cercado/sitiado” de צור é o mais provável, embora a forma admita discussão lexical.
- source_word: בָּרָעָב
  choice: de fome
  rationale: A locução idiomática portuguesa comunica a fome como causa da morte e corresponde à série de juízos.
- source_word: וְכִלֵּיתִי
  choice: levarei até o fim
  rationale: O Piel de כלה comunica completar, consumir ou esgotar; a expressão escolhida transmite a execução plena da ira sem soar artificial.
- source_word: חֲמָתִי
  choice: a minha ira
  rationale: חֵמָה denota ira intensa; “ira” preserva o peso do registro profético sem exagero interpretativo.
- source_word: בָּם
  choice: contra eles
  rationale: Com linguagem de ira e juízo, “contra eles” identifica naturalmente os alvos da ação em português.
theological_decisions:
- issue: Preservar sem atenuação a linguagem do juízo divino
  choice: levarei até o fim a minha ira contra eles
  alternative: esgotarei sobre eles a minha ira
  rationale: A formulação mantém a ideia de que a ira divina será plenamente executada, sem acrescentar uma explicação doutrinária nem resolver a imagem em categorias externas ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “quem estiver” preserva o paralelismo hebraico, enquanto “de peste”, “à espada” e “de fome” empregam regências naturais em português. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
