source:
  edition: WLC
  text: וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים ו/ל/גאית הִנְ/נִ֨י אֲנִ֜י מֵבִ֤יא עֲלֵי/כֶם֙ חֶ֔רֶב וְ/אִבַּדְתִּ֖י בָּמֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/003.yaml
  text: 'and say[a], ‘Mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys: Behold, I myself am bringing a sword upon you[b], and I will destroy your high places.’'
translation:
  language: pt
  text: 'e diga: “Montes de Israel, ouçam a palavra do Senhor Yahweh. Assim diz o Senhor Yahweh aos montes e às colinas, aos barrancos[a] e aos vales: Eis que eu mesmo trarei a espada contra vocês e destruirei os seus lugares altos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos canais”, “aos leitos de riachos” ou “aos uádis”.
    reason: lexical_alternative
  - marker: b
    text: “Lugares altos” eram locais de culto, muitas vezes situados em elevações e associados, nos profetas, ao culto ilícito ou idólatra.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: Montes de Israel
  rationale: Mantém o vocativo dirigido às regiões montanhosas personificadas, em formulação natural em português.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: Imperativo plural que preserva a convocação profética direta.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: a palavra do Senhor Yahweh
  rationale: Traduz דְּבַר no singular e preserva Yahweh como nome divino; 'Senhor Yahweh' evita ocultar o tetragrama.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Preserva a fórmula profética tradicional em registro solene e compreensível.
- source_word: לֶהָרִים וְלַגְּבָעוֹת
  choice: aos montes e às colinas
  rationale: Retém os dois elementos topográficos e a cadência da enumeração.
- source_word: לָאֲפִיקִים
  choice: aos barrancos
  rationale: No contexto topográfico, comunica depressões ou cortes do terreno associados a canais de água; a amplitude lexical é indicada em nota.
- source_word: וְלַגֵּאָיוֹת
  choice: aos vales
  rationale: Equivalente amplo e natural para as áreas baixas da enumeração.
- source_word: הִנְנִי אֲנִי
  choice: Eis que eu mesmo
  rationale: Preserva tanto a partícula apresentativa quanto a ênfase explícita do pronome, sem produzir uma construção artificial em português.
- source_word: מֵבִיא
  choice: trarei
  rationale: Expressa idiomaticamente a ação iminente indicada pela construção הִנְנִי com particípio; evita o pouco natural 'estou trazendo' neste anúncio profético.
- source_word: חֶרֶב
  choice: a espada
  rationale: Em português, o artigo definido é idiomático para a espada como instrumento de guerra e juízo neste contexto.
- source_word: וְאִבַּדְתִּי
  choice: e destruirei
  rationale: Comunica de modo direto a ação causativa de fazer perecer.
- source_word: בָּמוֹתֵיכֶם
  choice: os seus lugares altos
  rationale: Preserva o termo bíblico para locais de culto elevados, cujo sentido cultural é esclarecido em nota.
theological_decisions:
- issue: Tradução do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus
  rationale: Mantém visível o nome próprio divino presente no hebraico e distingue אֲדֹנָי, 'Senhor', de יְהוִה, 'Yahweh', sem acrescentar uma identificação ausente do texto.
- issue: Natureza dos 'lugares altos'
  choice: manter o termo e explicar sua função cultual em nota
  alternative: santuários idólatras
  rationale: O contexto profético é condenatório, mas a tradução não torna 'idólatras' parte explícita do substantivo; a nota preserva a associação frequente sem eliminar sua amplitude.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição topográfica e a fórmula profética foram preservadas; a ênfase de הִנְנִי אֲנִי foi vertida naturalmente por “Eis que eu mesmo”.
