  text: וְ/נָשַׁ֨מּוּ֙ מִזְבְּח֣וֹתֵי/כֶ֔ם וְ/נִשְׁבְּר֖וּ חַמָּֽנֵי/כֶ֑ם וְ/הִפַּלְתִּי֙ חַלְלֵי/כֶ֔ם לִ/פְנֵ֖י גִּלּוּלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
translation:
  language: pt
  text: Seus altares ficarão devastados, e seus objetos de culto associados ao sol[a] serão quebrados. Farei tombar os seus mortos diante dos seus ídolos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico hammânim, termo que se refere a objetos de culto associados ao sol. Também pode ser traduzido por “colunas solares”; sua forma e função exatas são incertas, e alguns o entendem como instalações ligadas ao incenso.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “ídolos” é fortemente depreciativo; também poderia ser vertido por “ídolos imundos” ou, mais literalmente, “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: ficarão devastados
  rationale: O nifal de שׁמם expressa o estado resultante de devastação ou desolação. A formulação conserva esse sentido e soa natural em português.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: seus altares
  rationale: Tradução direta e corrente de מִזְבֵּחַ, sem restringir indevidamente o referente.
- source_word: נִשְׁבְּרוּ
  choice: serão quebrados
  rationale: O nifal de שׁבר indica que os objetos serão quebrados. A escolha preserva a voz passiva e evita intensificação não exigida pelo texto.
- source_word: חַמָּנֵיכֶם
  choice: seus altares de incenso
  rationale: חַמָּנִים designa instalações cúlticas ligadas ao culto ilícito, possivelmente altares de incenso ou colunas associadas ao sol. A opção no texto é clara no contexto, e a incerteza quanto ao objeto exato é preservada em nota.
- source_word: הִפַּלְתִּי
  choice: farei tombar
  rationale: O hifil de נפל é causativo, literalmente 'farei cair'. 'Farei tombar' comunica a ação divina deliberada e mantém a imagem de queda.
- source_word: חַלְלֵיכֶם
  choice: os seus mortos
  rationale: חָלָל se refere aos mortos violentamente ou traspassados. 'Os seus mortos' é conciso e, junto de 'farei tombar', conserva o contexto de mortandade sem acrescentar gênero.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Representa o sentido espacial de 'perante, em frente de' e mantém a ironia de os mortos jazerem diante dos objetos de culto.
- source_word: גִּלּוּלֵיכֶם
  choice: seus ídolos
  rationale: Ídolos é a tradução clara e corrente, enquanto a forte carga depreciativa do termo peculiar a Ezequiel é explicitada em nota.
theological_decisions:
- issue: Força depreciativa do termo de Ezequiel para os ídolos
  choice: ídolos no texto principal, com nota explicativa
  alternative: ídolos imundos; ídolos de esterco
  rationale: גִּלּוּלִים é deliberadamente desdenhoso. 'Ídolos' oferece clareza e dignidade no texto principal, enquanto a nota conserva a força retórica sem impor uma expressão portuguesa excessivamente literal.
- issue: Identificação dos חַמָּנִים
  choice: altares de incenso no texto principal, com alternativa em nota
  alternative: colunas solares; pilares do sol
  rationale: A natureza exata desses objetos cúlticos é discutida. A tradução principal segue uma identificação plausível no contexto de culto ilícito, mas a nota preserva a possibilidade de associação solar.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A ordem das orações e o paralelismo do hebraico foram preservados, com divisão em duas frases para fluidez.
