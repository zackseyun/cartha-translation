base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, aqui transliterado como “Yahweh”.'
    reason: Esclarecer a forma hebraica por trás da transliteração do nome divino.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה integra-se naturalmente à fórmula profética “a palavra ... veio”, evitando o literalismo pouco idiomático “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר־יְהוָה, “a palavra” preserva o modo tradicional e transparente de apresentar a comunicação divina, sem explicá-la como “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa diretamente o movimento da palavra em direção ao profeta; “veio a mim” é claro e natural em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a fala divina apresentada no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino, não o título אֲדֹנָי. A transliteração preserva essa distinção sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e solene. A ordem da frase conserva a fórmula profética hebraica, enquanto “veio a mim” evita construções arcaicas. Os dois-pontos indicam que a fala começa no versículo seguinte.
