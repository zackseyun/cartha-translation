  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה לֹ֤א אֶל חִנָּם֙ דִּבַּ֔רְתִּי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם הָ/רָעָ֥ה הַ/זֹּֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/010.yaml
  text: Then they will know that I am Yahweh[b][a]; I did not speak in vain when I said I would bring this disaster upon them.
translation:
  language: pt
  text: Então saberão que eu sou Yahweh; não falei em vão[a] ao dizer que lhes traria esta desgraça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não falei por nada” ou “não falei sem motivo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “esta calamidade”; aqui a palavra se refere à calamidade ou desgraça trazida como juízo, não ao mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: O perfeito com conjunção, no discurso profético e após os anúncios de juízo, tem sentido futuro e resultativo. “Então” explicita naturalmente a consequência contextual.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Preserva a fórmula de reconhecimento característica de Ezequiel e translitera o nome divino conforme a orientação do projeto.
- source_word: לֹא אֶל חִנָּם
  choice: não foi em vão
  rationale: A expressão indica que a palavra de Yahweh não foi vazia, inútil ou sem efeito. A formulação portuguesa mantém a concisão e a ambiguidade entre falta de efeito e falta de razão.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: Mantém o sentido direto de “falar” e a ênfase na eficácia da palavra divina.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: em trazer sobre eles
  rationale: O hebraico é literalmente “fazer a eles”. Com o objeto seguinte, “trazer sobre eles” expressa em português natural a ação anunciada sem enfraquecer sua agência.
- source_word: הָרָעָה הַזֹּאת
  choice: esta desgraça
  rationale: Neste contexto, רָעָה designa calamidade infligida como juízo, e não maldade moral. “Desgraça” é clara, atual e preserva a gravidade do acontecimento.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o nome divino e segue a orientação declarada do projeto, sem substituir o nome por um título.
- issue: Sentido de הָרָעָה no juízo divino
  choice: desgraça
  alternative: mal; calamidade
  rationale: O termo descreve aqui um acontecimento danoso de juízo, não mal moral praticado por Deus. “Desgraça” evita essa confusão sem suavizar o juízo.
- issue: Relação do infinitivo לַעֲשׂוֹת com דִּבַּרְתִּי
  choice: falei em trazer
  alternative: falei para fazer; quando disse que traria
  rationale: A formulação mantém a ligação entre a fala divina e a ação anunciada, sem acrescentar explicitamente “quando disse”, palavras não presentes no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada apenas o necessário para fluência; a fórmula de reconhecimento, o nome divino e a força da declaração profética foram preservados.
