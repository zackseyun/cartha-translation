source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּֽ/הְי֣וֹת חַלְלֵי/הֶ֗ם בְּ/תוֹךְ֙ גִּלּ֣וּלֵי/הֶ֔ם סְבִיב֖וֹת מִזְבְּחֽוֹתֵי/הֶ֑ם אֶל֩ כָּל גִּבְעָ֨ה רָמָ֜ה בְּ/כֹ֣ל רָאשֵׁ֣י הֶ/הָרִ֗ים וְ/תַ֨חַת כָּל עֵ֤ץ רַֽעֲנָן֙ וְ/תַ֨חַת֙ כָּל אֵלָ֣ה עֲבֻתָּ֔ה מְק֗וֹם אֲשֶׁ֤ר נָֽתְנוּ שָׁם֙ רֵ֣יחַ נִיחֹ֔חַ לְ/כֹ֖ל גִּלּוּלֵי/הֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/013.yaml
  text: Then you will know that I am Yahweh[a], when their slain lie among their idols, all around their altars, on every high hill, on all the mountaintops, and under every green tree and under every leafy terebinth—the places where they offered a pleasing aroma to all their idols.
translation:
  language: pt
  text: Então vocês saberão que eu sou Yahweh, quando os seus mortos estiverem no meio dos seus ídolos[a], ao redor dos seus altares, em toda colina elevada, em todos os cumes dos montes, debaixo de toda árvore verdejante e debaixo de todo terebinto frondoso — lugares onde ofereceram aroma agradável a todos os seus ídolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é fortemente depreciativo e pode evocar algo imundo ou repugnante; mais literalmente, “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O perfeito qal com a conjunção, no discurso profético, tem sentido futuro e consequente; “Então” expressa naturalmente o resultado no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בִּהְיוֹת חַלְלֵיהֶם
  choice: quando os mortos deles estiverem caídos
  rationale: A construção infinitiva introduz a circunstância temporal. חַלְלֵיהֶם designa os mortos por violência; “estiverem caídos” torna explícita, de modo natural, a cena locativa sem enfraquecer o juízo.
- source_word: בְּתוֹךְ גִּלּוּלֵיהֶם
  choice: no meio de seus ídolos
  rationale: Preserva com clareza a imagem dos mortos entre os objetos de culto.
- source_word: גִּלּוּלֵיהֶם
  choice: seus ídolos
  rationale: “Ídolos” é claro e natural no texto principal; a forte carga depreciativa do termo hebraico é registrada em nota.
- source_word: סְבִיבוֹת מִזְבְּחוֹתֵיהֶם
  choice: ao redor de seus altares
  rationale: Reproduz a relação espacial dos mortos espalhados em torno dos altares.
- source_word: אֶל כָּל גִּבְעָה רָמָה
  choice: em toda colina elevada
  rationale: Na enumeração de locais de culto, אֶל tem função locativa; “em” é idiomático em português.
- source_word: בְּכֹל רָאשֵׁי הֶהָרִים
  choice: em todos os cumes dos montes
  rationale: “Cabeças dos montes” é uma expressão hebraica para os cumes; a tradução mantém a distribuição plural.
- source_word: תַחַת כָּל עֵץ רַעֲנָן
  choice: debaixo de toda árvore verdejante
  rationale: Mantém a imagem profética tradicional e comunica uma árvore viçosa, não apenas de cor verde.
- source_word: תַחַת כָּל אֵלָה עֲבֻתָּה
  choice: debaixo de todo terebinto frondoso
  rationale: אֵלָה provavelmente designa o terebinto, e עֲבֻתָּה descreve sua folhagem densa.
- source_word: מְקוֹם אֲשֶׁר
  choice: lugares onde
  rationale: Embora “lugar” esteja no singular hebraico, tem valor coletivo após uma série de locais; o plural produz português natural e conserva o sentido distributivo.
- source_word: נָתְנוּ שָׁם רֵיחַ נִיחֹחַ
  choice: ofereceram aroma agradável
  rationale: A expressão cultual indica a apresentação de uma oferta aromática. “Ofereceram” explicita a ação implícita de maneira natural, enquanto “aroma agradável” preserva a formulação, inclusive sua tensão irônica quando dirigida aos ídolos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Carga depreciativa de גִּלּוּלִים
  choice: “ídolos” no texto, com nota explicativa
  alternative: ídolos de esterco; ídolos imundos
  rationale: Uma tradução depreciativa literal seria chocante e pouco natural no texto principal, mas omitir totalmente a força retórica perderia um aspecto genuíno do hebraico; a nota conserva ambos.
- issue: A expressão cultual רֵיחַ נִיחֹחַ aplicada aos ídolos
  choice: aroma agradável
  alternative: aroma apaziguador; cheiro suave
  rationale: Mantém a linguagem convencional de oferta sem resolver ou suavizar a tensão teológica criada por sua aplicação ao culto idólatra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e preserva a enumeração solene dos locais de culto. A nota [a] aparece junto à primeira ocorrência relevante, embora o mesmo termo hebraico também se repita no fim do versículo.
