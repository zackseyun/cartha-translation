revisions:
- from: Estenderei a minha mão contra eles e farei da terra uma desolação e uma devastação, desde o deserto em direção a Diblá[a], em todos os lugares onde habitam[b]. Então saberão que eu sou Yahweh.
  to: Estenderei a minha mão contra eles e farei da terra uma desolação e uma devastação, desde o deserto, em direção a Diblata[a], em todos os lugares onde habitam[b]. Então saberão que eu sou Yahweh.
  rationale: A única alteração necessária é a correção de ‘Diblá’ para ‘Diblata’, preservando o ‘t’ do topônimo hebraico. A formulação cautelosa ‘em direção a’ e a nota mantêm explícita a incerteza textual e geográfica, sem adotar uma emenda.
