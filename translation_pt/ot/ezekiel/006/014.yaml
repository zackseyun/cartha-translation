  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a ação judicial expressa por ‘estender a mão contra’, o sentido causativo de ‘fazer da terra’, o dupleto intensificador ‘desolação e devastação’, a abrangência de todas as habitações e a fórmula de reconhecimento de Yahweh. Contudo, ‘Diblá’ não conserva integralmente o topônimo hebraico דִּבְלָתָה (Diblathah, com he direcional); ‘Diblata’ é uma transliteração portuguesa mais fiel da base do nome, sem alegar certeza quanto à localidade.
