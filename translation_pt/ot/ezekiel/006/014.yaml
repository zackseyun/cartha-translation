source:
  edition: WLC
  text: וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/נָתַתִּ֨י אֶת הָ/אָ֜רֶץ שְׁמָמָ֤ה וּ/מְשַׁמָּה֙ מִ/מִּדְבַּ֣ר דִּבְלָ֔תָ/ה בְּ/כֹ֖ל מוֹשְׁבֽוֹתֵי/הֶ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/014.yaml
  text: So I will stretch out my hand against them and make the land a desolation and a waste[a], from the wilderness toward Diblath, throughout all their settlements[b]. Then they will know that I am Yahweh.
translation:
  language: pt
  text: Estenderei a minha mão contra eles e farei da terra uma desolação e uma devastação, desde o deserto, em direção a Diblata[a], em todos os lugares onde habitam[b]. Então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome do lugar é incerto. Outra tradução possível é “desde o deserto até Diblata”; algumas propostas textuais relacionam o nome a Ribla.
    reason: textual_variant
  - marker: b
    text: 'Ou: “em todos os seus lugares de habitação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי אֶת־יָדִי עֲלֵיהֶם
  choice: Estenderei a minha mão contra eles
  rationale: Preserva a expressão profética de ação divina hostil e punitiva; “contra eles” comunica no contexto a força adversativa de עַל.
- source_word: וְנָתַתִּי אֶת־הָאָרֶץ
  choice: e farei da terra
  rationale: 'נתן seguido de complemento predicativo tem aqui sentido causativo: Deus fará com que a terra se torne desolada.'
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: uma desolação e uma devastação
  rationale: Mantém o par intensificador do hebraico sem reduzir os dois termos a um só; “devastação” expressa adequadamente a ruína da terra sem impor a possível nuance subjetiva de horror.
- source_word: מִמִּדְבַּר דִּבְלָתָה
  choice: desde o deserto em direção a Diblá
  rationale: Conserva a provável fórmula de extensão geográfica e o topônimo, mas “em direção a” evita afirmar precisão geográfica maior do que a leitura difícil permite.
- source_word: בְּכֹל מוֹשְׁבוֹתֵיהֶם
  choice: em todos os lugares onde habitam
  rationale: Expressa em português corrente o sentido de lugares de moradia ou assentamento, preservando a referência abrangente a todas as áreas habitadas por eles.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Então saberão que eu sou Yahweh
  rationale: “Então” explicita naturalmente o resultado do juízo nesta fórmula recorrente de Ezequiel, e o nome divino é transliterado.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e mantém intacta a fórmula de reconhecimento, sem substituí-lo por um título.
- issue: Interpretação de מִמִּדְבַּר דִּבְלָתָה
  choice: 'fórmula geográfica: “desde o deserto em direção a Diblá”'
  alternative: “desde o deserto até Diblá”; propostas textuais ligadas a Ribla; leitura como fórmula de desolação extrema
  rationale: O hebraico provavelmente contém um topônimo e descreve uma extensão, mas a identificação e a forma exata são incertas; a tradução retém essa tensão sem adotar silenciosamente uma emenda.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a solenidade profética sem arcaísmos desnecessários; as ambiguidades geográfica e lexical são preservadas em notas.
