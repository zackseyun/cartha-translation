  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/הִנָּבֵ֖א אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/002.yaml
  text: Son of man[a], set your face toward the mountains of Israel, and prophesy to them.
translation:
  language: pt
  text: Filho do homem, dirija o rosto para os montes de Israel e profetize contra eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “profetize-lhes”. A preposição hebraica pode ser entendida de maneira mais neutra, mas, neste contexto de juízo, a profecia é dirigida contra os montes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém literalmente a forma fixa de tratamento dirigida a Ezequiel e preserva sua força profética.
- source_word: שִׂים פָּנֶיךָ
  choice: volte o rosto
  rationale: Reproduz de modo natural em português a imagem hebraica de orientar o rosto deliberadamente para um alvo.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: para os montes de Israel
  rationale: אֶל é direcional neste primeiro sintagma; 'montes de Israel' conserva a referência concreta do hebraico.
- source_word: וְהִנָּבֵא
  choice: e profetize
  rationale: É a equivalência corrente e direta para o imperativo do verbo נבא.
- source_word: אֲלֵיהֶם
  choice: contra eles
  rationale: Embora a preposição normalmente possa significar 'a/para', o anúncio de juízo dirigido aos montes favorece aqui a força adversativa; a ambiguidade é preservada em nota.
theological_decisions:
- issue: Forma de tratamento בֶּן אָדָם
  choice: Filho do homem
  alternative: Ser humano; mortal
  rationale: A expressão é uma fórmula recorrente de tratamento a Ezequiel; não deve ser neutralizada nem interpretada além do que diz o texto.
- issue: Força de אֲלֵיהֶם no anúncio profético
  choice: contra eles
  alternative: a eles
  rationale: O contexto imediato é de juízo, o que dá força adversativa à profecia, mas a leitura mais neutra da preposição continua possível e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A imagem concreta do rosto e a fórmula profética tradicional foram preservadas.
