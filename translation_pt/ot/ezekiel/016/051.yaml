base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/051.yaml
  text: And Samaria did not sin half as much as you; you multiplied your abominations more than they[a], and by all your abominations that you committed, you made your sisters appear righteous.
translation:
  language: pt
  text: E Samaria não pecou nem a metade do que você pecou. Você multiplicou suas abominações mais do que elas multiplicaram as delas e, com todas as abominações que cometeu, fez suas irmãs parecerem justas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “justificou suas irmãs”. Em sentido mais literal, o hebraico permite essa tradução; no contexto, porém, a maldade maior de Jerusalém fez suas irmãs parecerem justas por comparação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma consagrada em português para a cidade personificada, que no contexto representa o reino do norte.
- source_word: כַּחֲצִי חַטֹּאתַיִךְ לֹא חָטָאָה
  choice: não pecou nem a metade do que você pecou
  rationale: 'Expressa com naturalidade a comparação enfática: os pecados de Samaria não chegaram à metade dos de Jerusalém.'
- source_word: וַתַּרְבִּי אֶת תּוֹעֲבוֹתַיִךְ
  choice: Você multiplicou suas abominações
  rationale: Mantém o sentido quantitativo de רבה e a força moral e cultual de תּוֹעֵבָה, termo recorrente em Ezequiel.
- source_word: מֵהֵנָּה
  choice: mais do que elas
  rationale: Preserva o comparativo e o referente feminino plural, isto é, as cidades-irmãs mencionadas no contexto.
- source_word: וַתְּצַדְּקִי אֶת אֲחוֹתַיִךְ
  choice: fez suas irmãs parecerem justas
  rationale: 'Comunica o efeito comparativo do Piel de צדק: diante da maldade maior de Jerusalém, suas irmãs parecem justas, sem implicar absolvição moral real.'
- source_word: בְּכָל תּוֹעֲבוֹתַיִךְ אֲשֶׁר עָשִׂית
  choice: com todas as abominações que cometeu
  rationale: Lê ב instrumentalmente e emprega 'cometeu', combinação idiomática em português para atos moralmente condenáveis.
theological_decisions:
- issue: Sentido de 'justificar as irmãs'
  choice: aparência comparativa de justiça, não absolvição efetiva
  alternative: você justificou suas irmãs
  rationale: 'O contexto emprega retórica comparativa: as abominações ainda maiores de Jerusalém fazem Samaria e Sodoma parecerem justas em contraste. A nota conserva a formulação mais literal e sua tensão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” deixa clara a interpelação feminina singular a Jerusalém sem recorrer a formas arcaicas; “abominações” preserva a severidade profética e a coerência lexical de Ezequiel.
