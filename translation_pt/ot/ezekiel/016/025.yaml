id: EZK.16.25
reference: Ezekiel 16:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶל כָּל רֹ֣אשׁ דֶּ֗רֶךְ בָּנִית֙ רָֽמָתֵ֔/ךְ וַ/תְּתַֽעֲבִי֙ אֶת יָפְיֵ֔/ךְ וַ/תְּפַשְּׂקִ֥י אֶת רַגְלַ֖יִ/ךְ לְ/כָל עוֹבֵ֑ר וַ/תַּרְבִּ֖י אֶת תזנת/ך־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/025.yaml
  text: At every street corner you built your high place[a], and you made your beauty detestable[b]. You spread your legs to every passerby and multiplied your prostitution.
translation:
  language: pt
  text: Em cada cruzamento[a], você construiu um lugar elevado[b], tornou detestável a sua beleza, abriu as pernas para todo aquele que passava e multiplicou a sua prostituição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em cada cabeça de caminho”. Também pode ser traduzido como “em cada esquina”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma plataforma elevada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ דֶּרֶךְ
  choice: cada cruzamento
  rationale: A expressão significa literalmente “cabeça de caminho” e indica o ponto destacado onde caminhos ou ruas se encontram. “Cruzamento” comunica de modo natural o caráter público do local.
- source_word: רָמָה
  choice: lugar elevado
  rationale: O substantivo indica uma elevação ou estrutura elevada e, neste contexto de idolatria retratada como prostituição, pode ter conotação cultual. “Lugar elevado” preserva essa possibilidade sem especificar além do hebraico.
- source_word: וַתְּתַעֲבִי אֶת יָפְיֵךְ
  choice: tornou detestável a sua beleza
  rationale: A construção apresenta a própria destinatária fazendo sua beleza tornar-se abominável ou repulsiva. A formulação mantém o valor causativo e o objeto explícito.
- source_word: וַתְּפַשְּׂקִי אֶת רַגְלַיִךְ
  choice: abriu as pernas
  rationale: O hebraico emprega uma imagem sexual deliberadamente explícita. A tradução direta conserva a contundência da acusação profética sem recorrer a eufemismos.
- source_word: לְכָל עוֹבֵר
  choice: para todo aquele que passava
  rationale: O particípio עוֹבֵר designa qualquer pessoa que passasse pelo local; esta formulação é clara e natural em português.
- source_word: וַתַּרְבִּי אֶת תַּזְנוּתֵךְ
  choice: multiplicou a sua prostituição
  rationale: רבה expressa aumento ou multiplicação, e תזנות denota prostituição, usada aqui na metáfora profética da infidelidade de Jerusalém.
theological_decisions:
- issue: Linguagem explícita na metáfora sexual da idolatria
  choice: Manter “abriu as pernas” e “prostituição” no texto principal
  alternative: Suavizar como “ofereceu-se” ou “entregou-se à imoralidade”
  rationale: A linguagem hebraica é intencionalmente chocante e retrata a idolatria e a infidelidade de Jerusalém como prostituição pública. Suavizá-la reduziria a força retórica do texto.
- issue: Natureza de רָמָה
  choice: Traduzir como “lugar elevado”, conservando a possível conotação cultual
  alternative: Traduzir como “plataforma elevada” ou simplesmente “elevação”
  rationale: O contexto combina práticas idólatras e prostituição metafórica. O hebraico permite entender uma estrutura ou local elevado, mas não exige que se elimine sua possível função cultual.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível tanto a leitores brasileiros quanto internacionais. A segunda pessoa com “você” mantém a acusação direta. A explicitude sexual do hebraico foi preservada, sem linguagem arcaica nem suavização eufemística.
