  - severity: low
    issue: Separação sintática da ação de defender a causa e dos pecados
    rationale: O hebraico vincula diretamente a defesa/vindicação irônica das irmãs aos pecados de Jerusalém. Reordenar levemente a frase torna essa relação mais transparente em português.
