  source_fidelity: A tradução preserva adequadamente o imperativo duplo de suportar a desonra, a comparação entre Jerusalém e suas irmãs e a ironia de que os pecados de Jerusalém as vindicam relativamente. Contudo, “elas se tornaram mais justas” introduz uma nuance temporal/processual que não é necessária no imperfeito hebraico; o sentido comparativo-forense é mais bem expresso por “elas são mais justas que você” (isto é, mostram-se mais justas em comparação).
  naturalness: O português é claro, moderno e de registro apropriado. A revisão proposta melhora a ligação sintática entre “defendeu a causa” e os pecados que produzem ironicamente esse efeito, sem perder fluência.
  terminology: “Desonra” distingue-se bem de “envergonhe-se”. “Defendeu a causa de suas irmãs” é uma opção prudente para a ambiguidade de פִּלַּלְתְּ לַאֲחוֹתֵךְ. “Justas” deve permanecer explicitamente comparativo, sem sugerir inocência absoluta.
