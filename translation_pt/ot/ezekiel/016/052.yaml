  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם אַ֣תְּ שְׂאִ֣י כְלִמָּתֵ֗/ךְ אֲשֶׁ֤ר פִּלַּלְתְּ֙ לַֽ/אֲחוֹתֵ֔/ךְ בְּ/חַטֹּאתַ֛יִ/ךְ אֲשֶׁר הִתְעַ֥בְתְּ מֵ/הֵ֖ן תִּצְדַּ֣קְנָה מִמֵּ֑/ךְ וְ/גַם אַ֥תְּ בּ֨וֹשִׁי֙ וּ/שְׂאִ֣י כְלִמָּתֵ֔/ךְ בְּ/צַדֶּקְתֵּ֖/ךְ אַחְיוֹתֵֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/052.yaml
  text: You also[a], bear your disgrace, because you pronounced judgment in favor of your sisters. By your sins in which you acted more abominably than they, they have become more righteous than you. So you too, be ashamed and bear your disgrace[b], because you made your sisters appear righteous.
translation:
  language: pt
  text: 'Você também[a], suporte sua desonra: por seus pecados, com os quais agiu de modo mais abominável que elas, defendeu a causa de suas irmãs; elas são mais justas que você[b]. Também você, envergonhe-se e suporte sua desonra, por ter feito suas irmãs parecerem justas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “julgou a favor de suas irmãs” ou “intercedeu por suas irmãs”. A expressão hebraica é irônica: pelos seus pecados, Jerusalém acabou favorecendo a causa delas.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, mais justas em comparação com você; não se afirma que elas fossem justas em sentido absoluto. Também se pode traduzir: “foram consideradas mais justas do que você”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאִי
  choice: carregue
  rationale: O imperativo de נשׂא, junto de כְלִמָּה, forma a ideia idiomática de carregar ou suportar a própria desonra. “Carregue” preserva a imagem hebraica e soa natural em português.
- source_word: כְלִמָּתֵךְ
  choice: a sua desonra
  rationale: כְּלִמָּה indica vergonha pública, desonra ou humilhação. “Desonra” mantém esse aspecto objetivo e permite que בּוֹשִׁי seja traduzido distintamente por “envergonhe-se”.
- source_word: פִּלַּלְתְּ לַאֲחוֹתֵךְ
  choice: defendeu a causa de suas irmãs
  rationale: O piel de פלל com ל pode expressar intervenção, intercessão ou julgamento em favor de alguém. A formulação escolhida conserva o tom forense e a ironia contextual sem limitar o verbo a uma intercessão verbal ou a uma sentença formal.
- source_word: בְּחַטֹּאתַיִךְ
  choice: por causa dos seus pecados
  rationale: O בְּ introduz aqui o meio ou a causa pela qual Jerusalém acabou favorecendo suas irmãs. A expressão torna explícita essa relação em português corrente.
- source_word: הִתְעַבְתְּ מֵהֵן
  choice: agiu de modo mais abominável do que elas
  rationale: A forma hitpael de תעב, acompanhada de מִן comparativo, descreve uma conduta mais abominável que a das irmãs.
- source_word: תִּצְדַּקְנָה מִמֵּךְ
  choice: elas se tornaram mais justas do que você
  rationale: A forma verbal e a comparação explícita apresentam as irmãs como mais justas em relação a Jerusalém. “Se tornaram” expressa o efeito retórico produzido pelos pecados dela, sem afirmar justiça absoluta.
- source_word: בּוֹשִׁי
  choice: envergonhe-se
  rationale: O imperativo de בוש exige uma resposta de vergonha e é traduzido de maneira direta e idiomática.
- source_word: בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ
  choice: por ter feito suas irmãs parecerem justas
  rationale: A construção atribui a Jerusalém a vindicação comparativa de suas irmãs. “Parecerem justas” comunica o resultado irônico sem sugerir uma declaração de justiça moral absoluta.
theological_decisions:
- issue: A linguagem de justiça comparativa aplicada às irmãs de Jerusalém
  choice: Apresentar as irmãs como mais justas do que Jerusalém por comparação, em consequência da conduta ainda pior desta.
  alternative: Entender que as irmãs eram absolutamente justas ou que receberam uma absolvição jurídica formal.
  rationale: O contexto de Ezequiel 16 e o comparativo מִמֵּךְ indicam vindicação relativa. A tradução preserva a força provocadora da afirmação sem transformar a comparação em declaração de inocência absoluta.
- issue: O sentido forense e intercessório de פִּלַּלְתְּ לַאֲחוֹתֵךְ
  choice: Traduzir por “defendeu a causa de suas irmãs”, mantendo juntas as ideias de intervenção e favorecimento judicial.
  alternative: “Intercedeu por suas irmãs” ou “julgou a favor de suas irmãs”.
  rationale: O hebraico admite essas nuances, e o contexto mostra que a própria perversidade de Jerusalém funcionou ironicamente em favor de suas irmãs. A escolha evita resolver além do necessário a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. O tratamento por “você” corresponde ao feminino singular dirigido a Jerusalém; evitou-se marcar gênero onde o português não o exige. “Desonra” e “envergonhe-se” distinguem os dois termos hebraicos próximos.
