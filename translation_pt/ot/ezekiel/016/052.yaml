revisions:
- from: Você também, carregue a sua desonra, pois defendeu a causa de suas irmãs[a]. Por causa dos seus pecados, nos quais agiu de modo mais abominável do que elas, elas se tornaram mais justas do que você[b]. Portanto, também você, envergonhe-se e carregue a sua desonra, por ter feito suas irmãs parecerem justas.
  to: 'Você também[a], suporte sua desonra: por seus pecados, com os quais agiu de modo mais abominável que elas, defendeu a causa de suas irmãs; elas são mais justas que você[b]. Também você, envergonhe-se e suporte sua desonra, por ter feito suas irmãs parecerem justas.'
  rationale: A revisão substitui “se tornaram mais justas” por “são mais justas”, evitando acrescentar um processo temporal e mantendo a vindicação relativa expressa pelo comparativo hebraico. Também aproxima, em português, os pecados da defesa irônica da causa das irmãs. As notas preservam as alternativas lexicais e a necessária ressalva contra uma leitura de justiça absoluta.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:41:37Z'
review_pass:
