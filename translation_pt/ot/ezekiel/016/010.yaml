base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/010.yaml
  text: I clothed you with embroidered cloth[a], put fine leather sandals on you, wrapped you in fine linen[b], and covered you with silk.
translation:
  language: pt
  text: Eu a vesti com tecido bordado, calcei-a com sandálias de couro fino[a], envolvi-a em linho fino e cobri-a com seda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תָּחַשׁ indica um material usado em calçados finos, mas não se sabe ao certo de que animal ou fonte ele provinha. Por isso, traduz-se aqui como «couro fino», em vez de identificá-lo de modo mais especulativo.
    reason: lexical_alternative
  - marker: b
    text: Ou «tecido precioso»; a identificação exata do termo hebraico é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִקְמָה
  choice: tecido bordado
  rationale: O substantivo designa material ou trabalho bordado. A expressão preserva a imagem têxtil sem especificar um tipo de roupa que o hebraico não explicita.
- source_word: תָּחַשׁ
  choice: couro fino
  rationale: A identificação exata do animal ou da origem do material é incerta. No contexto de calçados luxuosos, 'couro fino' comunica função e qualidade sem precisão zoológica especulativa.
- source_word: וָאֶנְעֲלֵךְ תָּחַשׁ
  choice: calcei seus pés com sandálias de couro fino
  rationale: A forma causativa de נעל indica pôr calçados em alguém. 'Sandálias' torna a imagem natural em português, e 'seus pés' explicita idiomaticamente a ação.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: שֵׁשׁ costuma indicar linho de alta qualidade, adequado ao contexto de luxo e adornamento.
- source_word: וָאֶחְבְּשֵׁךְ בַּשֵּׁשׁ
  choice: envolvi você em linho fino
  rationale: חבש pode significar atar, envolver ou cingir. Neste encadeamento de vestimenta, 'envolvi' é natural e evita uma conotação medicinal.
- source_word: מֶשִׁי
  choice: seda
  rationale: A palavra designa um tecido precioso, tradicionalmente entendido como seda; como a identificação não é totalmente segura, a alternativa é registrada em nota.
- source_word: וָאֲכַסֵּךְ
  choice: a cobri
  rationale: כסה significa cobrir. A tradução direta preserva a progressão das sucessivas camadas de vestimenta.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a fala em primeira pessoa dirigida à Jerusalém personificada no feminino, alternando pronomes naturais do português brasileiro sem perder o referente. As notas foram associadas aos termos corretos conforme o hebraico: תָּחַשׁ ao couro fino e מֶשִׁי à seda.'
