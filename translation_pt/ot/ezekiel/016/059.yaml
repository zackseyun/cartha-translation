  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ו/עשית אוֹתָ֖/ךְ כַּ/אֲשֶׁ֣ר עָשִׂ֑ית אֲשֶׁר בָּזִ֥ית אָלָ֖ה לְ/הָפֵ֥ר בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/059.yaml
  text: 'For thus says the Lord GOD: I will deal with you as you have done[a], because you despised the oath by breaking the covenant.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Eu tratarei você como você agiu, pois desprezou o juramento[a] ao quebrar a aliança.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “maldição”. O termo hebraico pode designar um juramento, especialmente um juramento que envolve uma maldição como sanção da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a forma redundante “Senhor SENHOR”.
- source_word: וְעָשִׂיתִי אוֹתָךְ
  choice: Farei com você
  rationale: A construção idiomática עשה + objeto significa fazer algo a alguém ou tratar alguém de determinada maneira; a formulação escolhida é direta e natural em português.
- source_word: כַּאֲשֶׁר עָשִׂית
  choice: como você fez
  rationale: Mantém a comparação direta e a correspondência judicial entre a conduta de Jerusalém e o que lhe sobrevirá.
- source_word: בָּזִית
  choice: desprezou
  rationale: Expressa de modo conciso a ideia de tratar algo com desprezo ou desdém.
- source_word: אָלָה
  choice: juramento
  rationale: No contexto da aliança, o termo designa um juramento vinculante, embora possa incluir a maldição associada à sua violação; essa nuance é preservada em nota.
- source_word: לְהָפֵר בְּרִית
  choice: ao quebrar a aliança
  rationale: הפר ברית é a expressão usual para violar ou romper uma aliança; “ao quebrar” apresenta naturalmente a ação pela qual o juramento foi desprezado.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução mantém separadamente o título divino e o nome da aliança presente no texto hebraico.
- issue: Sentido de אָלָה no contexto da aliança
  choice: juramento
  alternative: maldição
  rationale: “Juramento” se ajusta à acusação de quebrar a aliança, mas o termo também pode indicar a maldição sancionadora ligada ao juramento; a nota conserva essa ambiguidade legítima.
translation_notes:
  register: Português atual, claro e digno, com “você” para a Jerusalém personificada. A repetição “Farei com você como você fez” conserva deliberadamente a correspondência enfática do hebraico.
