  text: וַ/תִּזְנִ֧י אֶל בְּנֵֽי מִצְרַ֛יִם שְׁכֵנַ֖יִ/ךְ גִּדְלֵ֣י בָשָׂ֑ר וַ/תַּרְבִּ֥י אֶת תַּזְנֻתֵ֖/ךְ לְ/הַכְעִיסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/026.yaml
  text: You prostituted yourself with the sons of Egypt[a], your neighbors, great of flesh[b], and multiplied your prostitution to provoke me to anger.
translation:
  language: pt
  text: Você se prostituiu com os filhos do Egito[a], seus vizinhos bem-dotados[b], e multiplicou sua prostituição para me provocar à ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os egípcios”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “grandes de carne”, uma descrição sexual crua, provavelmente uma alusão aos órgãos genitais masculinos. “Bem-dotados” torna explícita essa alusão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: Você se prostituiu
  rationale: Mantém de modo claro e atual a metáfora sexual de זנה, usada aqui para retratar a infidelidade de Jerusalém, sem recorrer a linguagem arcaica.
- source_word: אֶל
  choice: com
  rationale: Embora a preposição indique literalmente direção, com o verbo de prostituir-se o português idiomático pede “com” para expressar a relação.
- source_word: בְּנֵי מִצְרַיִם
  choice: os filhos do Egito
  rationale: Preserva a expressão concreta do hebraico e continua inteligível; a alternativa mais idiomática, “os egípcios”, aparece em nota.
- source_word: שְׁכֵנַיִךְ
  choice: seus vizinhos
  rationale: Expressa diretamente a proximidade geográfica e política indicada pelo termo hebraico.
- source_word: גִּדְלֵי בָשָׂר
  choice: grandes de carne
  rationale: Reproduz a formulação crua e sexualmente sugestiva do hebraico sem fixar uma interpretação mais específica do que o texto.
- source_word: וַתַּרְבִּי
  choice: e multiplicou
  rationale: Conserva o sentido causativo de aumentar ou tornar numerosas as práticas descritas.
- source_word: תַּזְנֻתֵךְ
  choice: sua prostituição
  rationale: Mantém a ligação lexical com o verbo anterior e a imagem explícita escolhida pelo texto profético.
- source_word: לְהַכְעִיסֵנִי
  choice: para me provocar à ira
  rationale: Preserva tanto a ideia causativa de provocar quanto o resultado emocional expresso pelo verbo.
theological_decisions:
- issue: Metáfora sexual profética para idolatria e alianças estrangeiras
  choice: Manter no texto principal a imagem explícita da prostituição
  alternative: Suavizar como “foi infiel” ou “cometeu adultério”
  rationale: A retórica do capítulo emprega deliberadamente linguagem sexual chocante para retratar a infidelidade de Jerusalém; suavizá-la reduziria a força do hebraico.
- issue: Tradução de בְּנֵי מִצְרַיִם
  choice: os filhos do Egito
  alternative: os egípcios
  rationale: A tradução formal conserva a textura da expressão hebraica, enquanto a equivalência idiomática é registrada em nota.
- issue: Sentido de גִּדְלֵי בָשָׂר
  choice: grandes de carne
  alternative: bem-dotados ou lascivos
  rationale: A expressão hebraica é crua, mas não convém eliminar sua ambiguidade ao convertê-la sem ressalva em uma paráfrase sexual específica ou em uma descrição de desejo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a contundência e o paralelismo do hebraico. A formulação incomum “grandes de carne” é mantida deliberadamente e esclarecida em nota, sem eufemizar nem interpretar em excesso.
