  text: וְ/זָכַרְתִּ֨י אֲנִ֧י אֶת בְּרִיתִ֛/י אוֹתָ֖/ךְ בִּ/ימֵ֣י נְעוּרָ֑יִ/ךְ וַ/הֲקִמוֹתִ֥י לָ֖/ךְ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/060.yaml
  text: But I myself will remember my covenant with you in the days of your youth[b][a], and I will establish for you an everlasting covenant.
translation:
  language: pt
  text: Contudo, eu mesmo me lembrarei da minha aliança com você nos dias da sua juventude[b] e estabelecerei para você uma aliança perpétua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aliança eterna”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “minha aliança com você nos dias da sua juventude”, recordando a relação de aliança anterior sem especificar aqui qual aliança está em vista.
    reason: cross_reference
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Contudo, ... me lembrarei
  rationale: O qatal com conjunção tem sentido futuro no contexto. “Contudo” expressa a transição adversativa do juízo e da vergonha anteriores para a ação graciosa de Deus.
- source_word: אֲנִי
  choice: eu mesmo
  rationale: O pronome independente é enfático além da pessoa já indicada pelo verbo; “eu mesmo” conserva essa ênfase de modo natural.
- source_word: בְּרִיתִי
  choice: minha aliança
  rationale: Tradução direta de בְּרִית com o sufixo possessivo explicitamente preservado.
- source_word: אֶת ... אוֹתָךְ
  choice: com você
  rationale: Na construção “lembrar minha aliança com você”, o português pede a expressão relacional “com você”, sem reproduzir de forma rígida os marcadores hebraicos de objeto.
- source_word: בִּימֵי נְעוּרַיִךְ
  choice: nos dias da sua juventude
  rationale: Preserva a expressão temporal hebraica e sua conexão com a história figurada de Jerusalém ao longo do capítulo.
- source_word: וַהֲקִמוֹתִי
  choice: e estabelecerei
  rationale: O hifil de קום em linguagem de aliança pode indicar estabelecer, confirmar ou manter; “estabelecerei” é claro e preserva a formulação convencional.
- source_word: לָךְ
  choice: para você
  rationale: Mantém o valor dativo da preposição, literalmente “para/a você”, sem assimilá-la à formulação mais comum “com você”.
- source_word: בְּרִית עוֹלָם
  choice: uma aliança perpétua
  rationale: “Perpétua” comunica duração permanente em português atual e dignificado; a nota registra “eterna” como alternativa lexical legítima.
theological_decisions:
- issue: Linguagem de aliança no contexto de restauração
  choice: Manter “minha aliança” e “aliança perpétua” sem identificar a primeira exclusivamente com uma administração específica nem a segunda com um sistema teológico posterior.
  alternative: Interpretar explicitamente a referência como a aliança mosaica ou como a nova aliança.
  rationale: O versículo recorda a aliança dos dias da juventude de Jerusalém e promete uma aliança perpétua, mas não fornece aqui uma identificação mais estreita. A tradução conserva a tensão teológica do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tratamento “você” concorda com o feminino singular dirigido a Jerusalém; a linguagem permanece digna e acessível. Os marcadores foram posicionados junto às expressões que explicam.
