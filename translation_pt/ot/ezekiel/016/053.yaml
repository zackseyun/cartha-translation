  text: וְ/שַׁבְתִּי֙ אֶת שְׁבִ֣יתְ/הֶ֔ן אֶת שבית סְדֹם֙ וּ/בְנוֹתֶ֔י/הָ וְ/אֶת שבית שֹׁמְר֖וֹן וּ/בְנוֹתֶ֑י/הָ ו/שבית שְׁבִיתַ֖יִ/ךְ בְּ/תוֹכָֽ/הְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/053.yaml
  text: And I will restore their fortunes—the fortunes of Sodom and her daughters[a], and the fortunes of Samaria and her daughters—and your fortunes among them[b],
translation:
  language: pt
  text: 'Restaurarei a sorte delas[a]: a sorte de Sodoma e de suas filhas[b], a sorte de Samaria e de suas filhas, e a tua sorte no meio delas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «restaurarei o seu cativeiro» ou «trarei de volta os seus cativos». A expressão idiomática hebraica muitas vezes significa reverter a condição de um povo e, por isso, pode ser traduzida como «restaurar a sorte».'
    reason: lexical_alternative
  - marker: b
    text: Aqui, «filhas» são cidades, povoados ou outras localidades dependentes ou vizinhas associadas a Sodoma e Samaria.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: Restaurarei
  rationale: A forma causativa de שׁוב, em combinação com שְׁבִית/שבות, exprime reversão ou restauração, não apenas retorno físico.
- source_word: שְׁבִיתְהֶן / שבית / שְׁבִיתַיִךְ
  choice: a sorte
  rationale: A expressão idiomática hebraica indica a reversão da condição de um povo. «Restaurar a sorte» preserva a amplitude da fórmula e evita restringi-la indevidamente ao retorno de cativos.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: וּבְנוֹתֶיהָ
  choice: e de suas filhas
  rationale: Mantém a metáfora geográfica e familiar do hebraico; a nota esclarece que se trata de localidades dependentes ou vizinhas.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: בְּתוֹכָהְנָה
  choice: no meio delas
  rationale: Reproduz de modo natural a ideia espacial e relacional da expressão hebraica, associando a restauração de Jerusalém à das outras cidades.
theological_decisions:
- issue: Sentido da fórmula de restauração em um oráculo de juízo e restauração
  choice: Traduzir a expressão como restauração da sorte, isto é, reversão da condição.
  alternative: «restaurar o cativeiro» ou «trazer de volta os cativos»
  rationale: A fórmula hebraica tem alcance idiomático amplo. Como Sodoma também está incluída, uma referência estrita a repatriação ou retorno de cativos seria específica demais e poderia resolver uma ambiguidade que o texto não resolve.
- issue: Referente de «filhas» em relação a Sodoma e Samaria
  choice: Conservar a metáfora «filhas» no texto principal.
  alternative: «cidades», «povoados» ou «localidades dependentes»
  rationale: A metáfora integra a linguagem familiar e urbana do capítulo. Sua aplicação geográfica pode ser explicada em nota sem apagar a imagem original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva a metáfora «filhas» e a expressão profética «restaurar a sorte», esclarecendo em notas suas possíveis leituras. Os marcadores foram postos após a frase a que as duas notas dão esclarecimento; [a] trata da fórmula repetida «restaurar a sorte», e [b], de «filhas».
