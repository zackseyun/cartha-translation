base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/030.yaml
  text: How weak your heart is[a], declares the Lord GOD, when you do all these things, the deeds of a brazen prostitute,
translation:
  language: pt
  text: “Como é fraco o seu coração — declara o Senhor Yahweh — ao praticar todas estas coisas, atos de uma prostituta dominadora[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descarada”; o adjetivo hebraico pode indicar comportamento ousado, arrogante, dominador ou desavergonhado.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲמֻלָה לִבָּתֵךְ
  choice: Como está fraco o seu coração
  rationale: מָה introduz uma exclamação de grau; אֲמֻלָה indica fraqueza ou abatimento. A formulação preserva a imagem hebraica do coração como centro interior da vontade e dos afetos.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética de declaração. “Senhor” representa אֲדֹנָי, e “Yahweh” preserva o nome divino יהוה sem fundir os dois termos.
- source_word: בַּעֲשׂוֹתֵךְ אֶת כָּל אֵלֶּה
  choice: quando você faz todas essas coisas
  rationale: O infinitivo com בְּ admite valor temporal ou circunstancial; esta redação é natural em português e mantém a abrangência de כָּל אֵלֶּה.
- source_word: מַעֲשֵׂה אִשָּׁה זוֹנָה
  choice: atos de uma prostituta
  rationale: מַעֲשֵׂה caracteriza as ações anteriores, e זוֹנָה designa uma prostituta. “Atos” e “prostituta” são atuais, claros e preservam a força da metáfora profética.
- source_word: שַׁלָּטֶת
  choice: descarada
  rationale: O termo pode exprimir conduta ousada, arrogante, dominadora ou sem vergonha. “Descarada” comunica naturalmente, neste contexto, a audácia desavergonhada sem eliminar a alternativa lexical indicada em nota.
theological_decisions:
- issue: Representação de אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor; o Senhor DEUS
  rationale: A redação distingue o título אֲדֹנָי do nome pessoal יהוה e conserva explicitamente o nome da aliança, sem acrescentar uma interpretação denominacional.
- issue: Sentido moral da fraqueza do coração
  choice: manter a exclamação sem explicar a natureza da fraqueza
  alternative: explicitar como corrupção, desejo desenfreado ou falta de resolução
  rationale: O hebraico censura a condição interior de Jerusalém, mas não define aqui com precisão em que consiste essa fraqueza; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com construção exclamativa natural. O travessão isola a fórmula profética e mantém o fluxo da acusação. “Você” corresponde ao feminino singular dirigido à Jerusalém personificada; o gênero fica evidente em “prostituta”.
