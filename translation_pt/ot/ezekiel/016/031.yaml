  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּ/בְנוֹתַ֤יִ/ךְ גַּבֵּ/ךְ֙ בְּ/רֹ֣אשׁ כָּל דֶּ֔רֶךְ וְ/רָמָתֵ֥/ךְ עשיתי בְּ/כָל רְח֑וֹב וְ/לֹא הייתי כַּ/זּוֹנָ֖ה לְ/קַלֵּ֥ס אֶתְנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/031.yaml
  text: When you built your mound at the head of every road and made your high place in every square[a], you were not like a prostitute[c][b], in that you scorned payment.
translation:
  language: pt
  text: Quando você construiu seu montículo no começo de cada caminho[b] e fez seu lugar elevado em cada praça[a], não foi como uma prostituta[c], pois desprezou o pagamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em cada espaço aberto”. O termo hebraico costuma designar uma praça ou outro espaço público amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “em cada esquina”. Literalmente, “na cabeça de cada caminho”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, diferentemente de uma prostituta comum, Jerusalém não agia para receber pagamento; os versículos seguintes explicam que ela dava presentes em vez de recebê-los.
    reason: cross_reference
lexical_decisions:
- source_word: בִּבְנוֹתַיִךְ
  choice: Quando você construiu
  rationale: A preposição בְּ com o infinitivo construto de בנה introduz uma oração temporal; esta formulação é natural e preserva o valor circunstancial.
- source_word: גַּבֵּךְ
  choice: seu outeiro
  rationale: O substantivo indica uma estrutura elevada ligada à metáfora de prostituição do capítulo. “Outeiro” mantém a concretude sem definir em excesso sua arquitetura exata.
- source_word: בְּרֹאשׁ כָּל־דֶּרֶךְ
  choice: no início de cada caminho
  rationale: Preserva o sentido espacial de רֹאשׁ, “cabeça, começo, ponto principal”, sem reduzi-lo necessariamente a uma esquina.
- source_word: וְרָמָתֵךְ
  choice: seu lugar elevado
  rationale: No contexto, רָמָה designa provavelmente um local elevado de caráter cultual; a expressão mantém essa associação sem ocultar a imagem espacial.
- source_word: עשיתי
  choice: fez
  rationale: O qere fornece a segunda pessoa feminina singular, coerente com Jerusalém como destinatária; “fez” traduz diretamente עשה.
- source_word: בְּכָל רְחוֹב
  choice: em cada praça
  rationale: רְחוֹב costuma indicar um espaço público amplo ou praça urbana, não apenas uma rua.
- source_word: וְלֹא הָיִית כַּזּוֹנָה
  choice: não foi como uma prostituta
  rationale: 'Mantém a comparação explícita e o paradoxo retórico: Jerusalém diferia de uma prostituta comum no aspecto explicado pela oração final.'
- source_word: לְקַלֵּס
  choice: pois desprezou
  rationale: O infinitivo expressa a circunstância ou razão da comparação, e o verbo comunica desdém. “Pois” explicita a relação sem eliminar sua força circunstancial.
- source_word: אֶתְנָן
  choice: o pagamento
  rationale: No contexto da prostituição, o termo designa a remuneração recebida; “pagamento” é claro, atual e não arcaizante.
theological_decisions:
- issue: Metáfora de prostituição aplicada à infidelidade de Jerusalém
  choice: Manter diretamente “prostituta” e “pagamento”.
  alternative: Substituir por “idólatra” ou “mulher infiel”.
  rationale: A linguagem sexualmente explícita é parte deliberada da retórica profética e não deve ser suavizada em linguagem exclusivamente religiosa.
- issue: Sentido da oração final
  choice: Jerusalém não era como uma prostituta comum, pois desprezava o pagamento.
  alternative: Jerusalém não era como uma prostituta que procura ou aceita pagamento.
  rationale: A formulação preserva a ironia do hebraico e permite que os versículos seguintes expliquem que Jerusalém dava presentes em vez de recebê-los.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a segunda pessoa por meio de “você”, coerente com o tratamento direto de Jerusalém, e conserva-se a linguagem incisiva do profeta. Os marcadores foram colocados junto às expressões que explicam.
