source:
  edition: WLC
  text: וַ/תַּרְבִּ֧י אֶת תַּזְנוּתֵ֛/ךְ אֶל אֶ֥רֶץ כְּנַ֖עַן כַּשְׂדִּ֑ימָ/ה וְ/גַם בְּ/זֹ֖את לֹ֥א שָׂבָֽעַתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/029.yaml
  text: You multiplied your prostitution to the land of Canaan[a], to Chaldea; yet even with this you were not satisfied.
translation:
  language: pt
  text: Você multiplicou a sua prostituição em direção à terra de Canaã[a], até a Caldeia; mas nem mesmo com isso ficou satisfeita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “para a terra de Canaã, para os caldeus”, ou “para a terra de Canaã — a Caldeia”. A sintaxe hebraica é condensada: a expressão pode identificar figuradamente Canaã com a Caldeia/Babilônia ou descrever uma extensão desde Canaã até a Caldeia.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּרְבִּי
  choice: Você multiplicou
  rationale: O hifil de רבה expressa aqui aumento ou intensificação. “Multiplicou” preserva a força direta da imagem e soa natural em português.
- source_word: תַּזְנוּתֵךְ
  choice: a sua prostituição
  rationale: O substantivo derivado de זנה mantém a metáfora explícita da prostituição para a infidelidade de Jerusalém; uma formulação genérica enfraqueceria a retórica profética.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: em direção à terra de Canaã
  rationale: אֶל indica direção ou extensão. A formulação conserva esse valor sem resolver em excesso a sintaxe geográfica comprimida.
- source_word: כַּשְׂדִּימָה
  choice: até a Caldeia
  rationale: A terminação direcional indica movimento ou extensão. “Até a Caldeia” apresenta uma leitura natural do avanço geográfico, enquanto a nota preserva outras relações sintáticas possíveis.
- source_word: וְגַם בְּזֹאת
  choice: mas nem mesmo com isso
  rationale: 'No contexto, a combinação tem força enfática e concessiva: apesar dessa ampliação, Jerusalém continuou insatisfeita.'
- source_word: לֹא שָׂבָעַתְּ
  choice: ficou satisfeita
  rationale: שׂבע significa ficar saciado ou satisfeito. O feminino concorda com Jerusalém, a destinatária personificada do discurso.
theological_decisions:
- issue: Metáfora sexual profética da infidelidade à aliança
  choice: Manter “prostituição” de modo explícito
  alternative: “infidelidade” ou “imoralidade sexual”
  rationale: Ezequiel emprega deliberadamente uma imagem sexual forte para representar a idolatria e as alianças político-religiosas de Jerusalém. Suavizá-la reduziria a força lexical e retórica do texto.
- issue: Relação entre Canaã e Caldeia na sintaxe comprimida
  choice: “em direção à terra de Canaã, até a Caldeia” no texto, com alternativas em nota
  alternative: “para a terra de Canaã, para os caldeus” ou “para a terra de Canaã — a Caldeia”
  rationale: O hebraico permite mais de uma compreensão da relação entre os topônimos. A tradução principal comunica extensão geográfica, sem excluir em nota uma identificação figurada ou uma construção dirigida aos caldeus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O feminino de “satisfeita” explicita apenas a concordância já presente no hebraico com Jerusalém personificada. A imagem profética forte foi preservada sem arcaísmos.
