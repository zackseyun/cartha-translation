  text: לָ/כֵ֣ן זוֹנָ֔ה שִׁמְעִ֖י דְּבַר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/035.yaml
  text: Therefore[a], prostitute, hear the word of Yahweh.
translation:
  language: pt
  text: Por isso, prostituta[a], ouça a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meretriz”; o substantivo hebraico é uma metáfora direta e severa da infidelidade de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência das acusações anteriores e soa natural e conciso em português.
- source_word: זוֹנָה
  choice: prostituta
  rationale: O substantivo designa literalmente uma prostituta e, aqui, funciona como metáfora direta e severa da infidelidade de Jerusalém. A escolha é atual e clara, sem recorrer a vocabulário arcaico.
- source_word: שִׁמְעִי
  choice: ouça
  rationale: Imperativo feminino singular de שׁמע, concordando com a personagem feminina interpelada. “Ouça” preserva a fórmula profética e é amplamente compreensível.
- source_word: דְּבַר
  choice: a palavra
  rationale: Mantém a expressão profética tradicional דְּבַר יְהוָה sem substituir “palavra” pela formulação mais dinâmica “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração.
- issue: Linguagem sexual metafórica dirigida a Jerusalém
  choice: prostituta
  alternative: meretriz; mulher prostituída
  rationale: Preserva a dureza e a franqueza da acusação metafórica sem suavizá-la nem empregar uma forma arcaica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A frase conserva o tom incisivo da interpelação profética e o feminino singular do hebraico.
