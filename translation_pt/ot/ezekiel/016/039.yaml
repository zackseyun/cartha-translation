base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/039.yaml
  text: I will give you into their hand[a], and they will tear down your vaulted chamber and demolish your high places. They will strip you of your clothes, take your beautiful jewelry[b], and leave you naked and bare.
translation:
  language: pt
  text: Eu a entregarei nas mãos deles, e eles derrubarão sua estrutura abobadada[a] e demolirão seus lugares altos. Eles a despirão de suas roupas, tomarão suas belas joias[b] e a deixarão nua e descoberta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu aterro”, “seu santuário” ou “seu arco”. O termo hebraico é raro e provavelmente se refere a uma estrutura associada à representação da adoração ilícita de Jerusalém neste capítulo.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus ornamentos esplêndidos” ou “os objetos do seu esplendor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָךְ בְּיָדָם
  choice: Eu a entregarei nas mãos deles
  rationale: A expressão hebraica descreve a entrega de alguém ao poder de outros. “Entregarei” explicita naturalmente o sentido judicial, enquanto “nas mãos deles” preserva a imagem do original.
- source_word: גַבֵּךְ
  choice: seu recinto abobadado
  rationale: O termo é raro e parece designar uma estrutura construída ligada, neste capítulo, à adoração ilícita de Jerusalém. “Recinto abobadado” conserva o caráter arquitetônico sem defini-lo de modo excessivamente específico.
- source_word: וְהָרְסוּ
  choice: derrubarão
  rationale: O verbo indica pôr abaixo ou destruir uma construção; “derrubarão” é claro e concreto em português.
- source_word: וְנִתְּצוּ רָמֹתַיִךְ
  choice: demolirão seus lugares altos
  rationale: O verbo expressa destruição violenta de estruturas, e “lugares altos” é a designação tradicional e reconhecível dos locais de culto elevados mencionados pelos profetas.
- source_word: וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדַיִךְ
  choice: a despirão de suas roupas
  rationale: A formulação transmite de maneira natural a retirada forçada das roupas e mantém a imagem de humilhação pública.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: suas belas joias
  rationale: A expressão significa literalmente objetos ou artigos de esplendor. No contexto dos adornos dados à mulher, “belas joias” comunica com clareza o referente provável, enquanto a nota registra a amplitude lexical.
- source_word: וְהִנִּיחוּךְ עֵירֹם וְעֶרְיָה
  choice: e a deixarão nua e descoberta
  rationale: Os dois termos hebraicos formam uma expressão enfática de nudez e exposição completas. A tradução mantém os dois elementos sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Linguagem metafórica e cultual que retrata Jerusalém como uma mulher infiel
  choice: Manter as imagens concretas de destruição arquitetônica, despojamento e exposição.
  alternative: Parafrasear o versículo como uma declaração geral de juízo e desonra.
  rationale: A retórica profética une a idolatria de Jerusalém à metáfora de infidelidade conjugal. Preservar as imagens do hebraico mantém sua força e sua tensão sem substituí-las por uma interpretação doutrinária abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A referência feminina a Jerusalém é mantida pelos pronomes “a” e pelo adjetivo “nua”. “Lugares altos” preserva a terminologia cultual bíblica, e as notas mantêm visível a incerteza dos termos raros ou semanticamente amplos.
