base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/032.yaml
  text: The adulterous wife takes strangers instead of her husband[a].
translation:
  language: pt
  text: A esposa adúltera recebe estranhos em lugar de seu marido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A mulher que comete adultério recebe outros homens em lugar de seu marido”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: esposa
  rationale: Embora o substantivo possa significar “mulher” ou “esposa”, a expressão seguinte, “seu marido”, torna explícito o contexto conjugal.
- source_word: הַמְּנָאָפֶת
  choice: adúltera
  rationale: O particípio caracteriza a esposa por seu adultério; “adúltera” é conciso, atual e preserva a força atributiva.
- source_word: תַּחַת
  choice: em lugar de
  rationale: 'A preposição indica substituição, não posição espacial: os estranhos ocupam o lugar do marido.'
- source_word: אִישָׁהּ
  choice: do marido
  rationale: No contexto conjugal, אִישׁ com o sufixo feminino singular significa naturalmente “seu marido”; em português, o artigo definido com o possessivo implícito evita uma formulação pesada.
- source_word: תִּקַּח
  choice: recebe
  rationale: לקח pode significar “tomar” ou “receber”. Neste contexto sexual, “recebe” soa natural em português e mantém a mulher como sujeito da ação, sem acrescentar detalhes ausentes no hebraico.
- source_word: אֶת
  choice: '[marcador de objeto direto não representado na tradução]'
  rationale: אֶת é um marcador gramatical do objeto direto e não requer palavra correspondente em português.
- source_word: זָרִים
  choice: estranhos
  rationale: O termo designa pessoas de fora. “Estranhos” preserva essa amplitude sem impor a ideia mais especificamente étnica ou nacional de “estrangeiros”.
theological_decisions:
- issue: Retrato metafórico da infidelidade de Jerusalém por meio do adultério conjugal
  choice: 'Preservar diretamente a imagem matrimonial e sexual: “A esposa adúltera recebe estranhos em lugar do marido.”'
  alternative: “A mulher que comete adultério recebe outros homens em lugar do marido.”
  rationale: O versículo integra a metáfora extensa de Ezequiel sobre a infidelidade da aliança. A tradução mantém a contundência da acusação sem reduzir a imagem a uma explicação meramente espiritual nem intensificá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Esposa adúltera” mantém a concisão do hebraico; a nota registra a formulação verbal e explicita o referente masculino possível de זָרִים.
