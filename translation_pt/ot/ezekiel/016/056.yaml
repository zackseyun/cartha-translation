base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/056.yaml
  text: Was not Sodom your sister a byword in your mouth in the day of your pride?[a]
translation:
  language: pt
  text: Sodoma, sua irmã, não era assunto em sua boca no dia do seu orgulho?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algo de que se falava”, “notícia” ou “relato”. O hebraico provavelmente apresenta Sodoma como um exemplo notório mencionado por Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Não era
  rationale: A conjunção com a negação introduz, no contexto, uma pergunta retórica; a formulação portuguesa preserva a força da repreensão sem reproduzir rigidamente o 'e' inicial.
- source_word: הָיְתָה
  choice: era
  rationale: O perfeito qal de היה expressa aqui um estado no passado; 'era' é natural em português.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אֲחוֹתֵךְ
  choice: sua irmã
  rationale: Mantém a metáfora central das cidades-irmãs em Ezequiel 16.
- source_word: לִשְׁמוּעָה
  choice: motivo de comentário
  rationale: שְׁמוּעָה pode indicar notícia, relato ou algo de que se fala. Com 'em sua boca', a expressão aponta para Sodoma como assunto notório ou objeto de fala; a escolha conserva essa amplitude melhor do que uma interpretação exclusivamente proverbial ou zombeteira.
- source_word: בְּפִיךְ
  choice: em sua boca
  rationale: Preserva a imagem idiomática hebraica e continua clara em português, embora 'em seus lábios' também fosse possível.
- source_word: בְּיוֹם
  choice: no dia do
  rationale: Mantém a formulação temporal concreta do hebraico e o tom profético.
- source_word: גְּאוֹנָיִךְ
  choice: seu orgulho
  rationale: גאון denota aqui exaltação arrogante; 'orgulho' é claro, conciso e adequado ao contexto negativo.
theological_decisions:
- issue: Força retórica da declaração sobre Sodoma
  choice: 'Pergunta retórica: ''Não era Sodoma, sua irmã...?'''
  alternative: 'Declaração negativa: ''Sodoma, sua irmã, não era...'''
  rationale: A negação inicial seguida do verbo perfeito, no contexto de repreensão profética, é bem representada em português por uma pergunta retórica. Isso preserva a força confrontadora sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a pergunta retórica e as imagens de 'irmã', 'boca' e 'dia', enquanto a nota registra a amplitude lexical de שְׁמוּעָה.
