base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/005.yaml
  text: No eye pitied you enough to do for you even one of these things[a], to have compassion on you; instead, you were thrown out into the open field in loathing of your life on the day you were born.
translation:
  language: pt
  text: Olho nenhum teve pena de você a ponto de fazer por você sequer uma dessas coisas, por compaixão por você. Pelo contrário, no dia em que você nasceu, foi jogada em campo aberto, por repulsa à sua vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por repulsa a você mesma”. A expressão hebraica é compacta e pode se referir à vida da recém-nascida ou à própria recém-nascida como pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסָה עָלַיִךְ עַיִן
  choice: Olho nenhum teve pena de você
  rationale: Preserva a expressão antropomórfica hebraica, literalmente centrada no “olho”, em uma construção compreensível no português moderno. “Poupar” seria menos adequado, pois o contexto trata da omissão dos cuidados devidos à recém-nascida.
- source_word: לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה
  choice: para lhe fazer sequer uma dessas coisas
  rationale: Retoma os cuidados mencionados no versículo anterior; “sequer uma” comunica com naturalidade que nenhum deles foi realizado.
- source_word: לְחֻמְלָה עָלָיִךְ
  choice: e demonstrar compaixão por você
  rationale: Expressa a finalidade ou motivação compassiva sem acrescentar conotações pactuais. A coordenação com a oração anterior torna a relação clara em português.
- source_word: וַתֻּשְׁלְכִי
  choice: você foi jogada
  rationale: Reproduz a forma passiva e a violência do abandono. O feminino corresponde à figura de Jerusalém como recém-nascida.
- source_word: אֶל־פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: Comunica a exposição da criança na superfície do campo de modo mais natural do que uma tradução estritamente literal.
- source_word: בְּגֹעַל נַפְשֵׁךְ
  choice: por repulsa à sua vida
  rationale: Mantém a formulação compacta e dura do hebraico. נֶפֶשׁ pode designar a vida, a pessoa ou o próprio ser; por isso, a ambiguidade é indicada em nota.
- source_word: בְּיוֹם הֻלֶּדֶת אֹתָךְ
  choice: no dia em que nasceu
  rationale: Tradução temporal direta, clara e idiomática, preservando a imediatidade do abandono.
theological_decisions:
- issue: Referente de נַפְשֵׁךְ em בְּגֹעַל נַפְשֵׁךְ
  choice: à sua vida
  alternative: a você mesma / à sua pessoa
  rationale: O hebraico permite que נֶפֶשׁ indique tanto a vida quanto a própria pessoa. O texto principal conserva “vida”, enquanto a nota registra a leitura pessoal sem decidir além da evidência lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem hebraica de “olho nenhum”, evitando tanto arcaísmo excessivo quanto paráfrase que apagaria a expressão original.
