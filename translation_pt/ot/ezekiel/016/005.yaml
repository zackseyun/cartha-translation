  - severity: low
    issue: A elipse do sujeito em “no dia em que nasceu” pode momentaneamente deixar o referente menos explícito.
    rationale: Embora seja compreensível pelo contexto, “no dia em que você nasceu” mantém a segunda pessoa expressa e corresponde diretamente ao hebraico.
