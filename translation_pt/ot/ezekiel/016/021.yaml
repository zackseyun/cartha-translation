  text: You slaughtered my sons and gave them up to them by making them pass through the fire[a].
translation:
  language: pt
  text: Você degolou os meus filhos e os entregou a eles, fazendo-os passar pelo fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fazendo-os passar para eles”. Neste contexto, a expressão se refere a fazer crianças passar pelo fogo como sacrifício aos ídolos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁחֲטִי
  choice: você degolou
  rationale: O verbo שׁחט designa abate, muitas vezes sacrificial. “Degolou” conserva a violência concreta e a conotação ritual melhor que o genérico “matou”.
- source_word: בָּנַי
  choice: os meus filhos
  rationale: O hebraico diz literalmente “meus filhos”, preservando tanto a reivindicação divina expressa pelo possessivo quanto a forma masculina do substantivo.
- source_word: וַתִּתְּנִים
  choice: os entregou
  rationale: נתן, com o sufixo de objeto neste contexto, indica entregar ou pôr nas mãos de alguém. “Entregou” é natural em português e mantém o tom acusatório.
- source_word: בְּהַעֲבִיר אוֹתָם
  choice: fazendo-os passar pelo fogo
  rationale: A construção causativa de עבר, aplicada a crianças neste contexto cultual, é uma expressão associada ao sacrifício pelo fogo. A explicitação de “fogo” comunica ao leitor moderno o sentido contextual da expressão.
- source_word: לָהֶם
  choice: a eles
  rationale: O pronome retoma os ídolos mencionados no contexto. “A eles” preserva de modo direto a referência pronominal do hebraico.
theological_decisions:
- issue: Se o sentido sacrificial ligado ao fogo deve ser explicitado na expressão “fazê-los passar”
  choice: Explicitar “pelo fogo” no texto principal
  alternative: Traduzir apenas “fazendo-os passar a eles”
  rationale: Embora “fogo” não apareça expressamente nesta oração hebraica, o contexto imediato e o uso profético da expressão indicam sacrifício infantil pelo fogo. A explicitação evita que a acusação fique obscura, enquanto a nota registra a forma literal e preserva a transparência interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Degolou” mantém a força violenta e sacrificial do verbo hebraico; a nota torna transparente a explicitação contextual de “pelo fogo”.
