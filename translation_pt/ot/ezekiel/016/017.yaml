  text: וַ/תִּקְחִ֞י כְּלֵ֣י תִפְאַרְתֵּ֗/ךְ מִ/זְּהָבִ֤/י וּ/מִ/כַּסְפִּ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וַ/תַּעֲשִׂי לָ֖/ךְ צַלְמֵ֣י זָכָ֑ר וַ/תִּזְנִי בָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/017.yaml
  text: You took your beautiful jewels from my gold and my silver[a], which I had given to you, and made for yourself male images[c][b], and you prostituted yourself with them.
translation:
  language: pt
  text: Você tomou seus belos adornos, feitos do meu ouro e da minha prata[a], que eu lhe havia dado, e fez para si imagens masculinas[b]; com elas você se prostituiu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus objetos esplêndidos de ouro e prata”. O termo hebraico pode designar objetos, utensílios ou artigos em geral, mas aqui provavelmente se refere a adornos feitos de metais preciosos.
    reason: lexical_alternative
  - marker: b
    text: Ou “ídolos masculinos” ou “imagens em forma de homens”.
    reason: alternative_reading
  - marker: c
    text: A expressão “se prostituiu” traduz uma metáfora recorrente nos profetas para a infidelidade à aliança manifestada na idolatria.
    reason: cultural_note
lexical_decisions:
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: seus belos adornos
  rationale: כְּלִי é um termo amplo para objeto, utensílio ou artigo; neste contexto de ouro e prata usados como enfeites, “adornos” comunica com naturalidade o referente provável, enquanto תִפְאֶרֶת acrescenta a ideia de beleza ou esplendor.
- source_word: מִזְּהָבִי וּמִכַּסְפִּי
  choice: feitos do meu ouro e da minha prata
  rationale: 'A preposição מִן indica aqui a matéria de que os adornos provinham. A formulação mantém a ênfase possessiva: o ouro e a prata pertenciam ao Senhor e haviam sido dados a Jerusalém.'
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: que eu lhe havia dado
  rationale: A oração identifica o ouro e a prata como dádivas anteriores do Senhor; o mais-que-perfeito composto expressa naturalmente essa anterioridade na acusação retrospectiva.
- source_word: וַתַּעֲשִׂי לָךְ
  choice: e fez para si
  rationale: “Para si” preserva a força reflexiva de לָךְ e destaca o uso indevido, por Jerusalém, dos bens que recebera.
- source_word: צַלְמֵי זָכָר
  choice: imagens masculinas
  rationale: צֶלֶם significa “imagem” ou “figura”, e זָכָר especifica o sexo masculino. A tradução conserva a expressão explícita e incomum do hebraico sem substituir “imagens” pelo interpretativo “ídolos”.
- source_word: וַתִּזְנִי בָם
  choice: com elas você se prostituiu
  rationale: זנה mantém a metáfora sexual contundente pela qual Ezequiel retrata a infidelidade de Jerusalém; בָם é traduzido por “com elas”, retomando as imagens.
theological_decisions:
- issue: Metáfora profética sexual para a idolatria
  choice: Manter a linguagem explícita “você se prostituiu”.
  alternative: “você foi infiel” ou “praticou idolatria”
  rationale: Ezequiel emprega deliberadamente uma metáfora sexual chocante para a quebra da aliança. Preservá-la mantém a força retórica e evita reduzir o texto a uma explicação teológica genérica.
- issue: Natureza de צַלְמֵי זָכָר
  choice: Traduzir por “imagens masculinas” no texto principal.
  alternative: “ídolos masculinos” ou “imagens em forma de homens”
  rationale: O contexto indica idolatria, mas o substantivo hebraico significa propriamente “imagens”. A formulação escolhida preserva tanto a dimensão cultual contextual quanto a conotação sexual do enunciado, sem resolver além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O feminino gramatical dirigido a Jerusalém aparece naturalmente nos pronomes e na referência contextual, sem formas marcadas desnecessárias. A ordem da última oração foi ajustada para evitar ambiguidade no antecedente de “elas” e manter fluidez.
