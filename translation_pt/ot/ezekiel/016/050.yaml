  yaml_path: translation/ot/ezekiel/016/050.yaml
  text: They became haughty and committed abomination before me[b][a], so I removed them when I saw it.
translation:
  language: pt
  text: Elas se tornaram arrogantes[a] e cometeram uma abominação diante de mim; por isso, eu as removi quando vi isso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encheram-se de orgulho” ou “tornaram-se soberbas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “quando vi” ou “conforme vi”; o objeto “isso” está implícito e é retomado da oração anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְבְּהֶינָה
  choice: tornaram-se arrogantes
  rationale: O verbo גבהּ indica aqui elevação em sentido moral negativo, isto é, orgulho ou arrogância. A formulação é natural em português e preserva o tom de acusação.
- source_word: וַתַּעֲשֶׂינָה תוֹעֵבָה
  choice: cometeram uma abominação
  rationale: Embora עשה signifique em sentido amplo “fazer”, a combinação com תוֹעֵבָה é expressa naturalmente em português por “cometer uma abominação”, mantendo a forte carga moral e religiosa do termo.
- source_word: לְפָנָי
  choice: diante de mim
  rationale: Reproduz de modo direto a ideia de algo praticado na presença e sob o olhar de Deus, com sua dimensão judicial.
- source_word: וָאָסִיר אֶתְהֶן
  choice: por isso, eu as removi
  rationale: A forma causativa de סור comunica a retirada das referidas mulheres/cidades. “Por isso” torna explícita a relação consequencial indicada pelo encadeamento do hebraico.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: quando vi isso
  rationale: O hebraico diz literalmente “quando/conforme vi”, sem objeto expresso. “Isso” retoma naturalmente a abominação mencionada, enquanto a nota preserva a concisão e a ambiguidade da construção original.
theological_decisions:
- issue: Formulação do juízo divino
  choice: por isso, eu as removi
  alternative: e eu as tirei dali
  rationale: A tradução mantém a ação judicial direta atribuída a Deus sem suavizá-la nem acrescentar uma explicação doutrinária ausente do versículo.
- issue: Sentido de כַּאֲשֶׁר na conclusão
  choice: quando vi isso
  alternative: conforme vi
  rationale: A leitura temporal se ajusta ao contexto imediato, mas a nota conserva a possibilidade comparativa ou modal do hebraico, sem resolver indevidamente sua ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega “abominação” para preservar a força moral-religiosa do hebraico e mantém o feminino plural das cidades personificadas no contexto.
