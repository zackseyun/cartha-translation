  text: וַ/יְהִ֕י אַחֲרֵ֖י כָּל רָעָתֵ֑/ךְ א֣וֹי א֣וֹי לָ֔/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/023.yaml
  text: And it came about[a], after all your wickedness—woe[b], woe to you! declares the Lord GOD—
translation:
  language: pt
  text: E aconteceu que, depois de toda a sua maldade — ai, ai de você!, diz o Senhor Yahweh —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz o desenvolvimento seguinte do discurso e preserva a transição narrativa do hebraico em português natural.
- source_word: אַחֲרֵי כָּל רָעָתֵךְ
  choice: depois de toda a sua maldade
  rationale: Mantém o sentido temporal de אַחֲרֵי, a abrangência de כָּל e o peso moral de רָעָה no contexto da acusação profética.
- source_word: אוֹי אוֹי לָךְ
  choice: ai de você! Ai de você!
  rationale: Conserva a repetição enfática e a força conjunta de lamento e juízo da exclamação profética.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente e digno para a fórmula profética que apresenta um pronunciamento divino.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, 'Senhor', do nome divino יהוה, transliterado como Yahweh, evitando a forma ambígua 'Senhor SENHOR'.
theological_decisions:
- issue: Tradução do título divino composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida preserva tanto o título אֲדֹנָי quanto o nome pessoal divino יהוה, sem substituir silenciosamente este último por um título.
- issue: Força de אוֹי אוֹי לָךְ
  choice: ai de você! Ai de você!
  alternative: ó desgraça, desgraça para você!
  rationale: A expressão portuguesa mantém a tensão entre lamento e anúncio de juízo, sem restringir a interjeição a apenas uma dessas nuances.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação preserva o caráter parentético da exclamação e o travessão final, pois o versículo conduz diretamente à continuação sintática do versículo seguinte.
