translation:
  language: pt
  text: para que você carregue sua desonra e se envergonhe por tudo o que fez[a], ao consolá-las.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando você as consolar” ou “tornando-se um consolo para elas”. A expressão hebraica pode ser entendida de mais de uma maneira estreitamente relacionada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz finalidade ou resultado e corresponde naturalmente à força da expressão hebraica.
- source_word: תִּשְׂאִי כְלִמָּתֵךְ
  choice: você carregue a sua desonra
  rationale: נשׂא com כְּלִמָּה expressa suportar ou levar a própria desonra; “carregar” preserva a imagem hebraica e é compreensível em português.
- source_word: וְנִכְלַמְתְּ
  choice: e se envergonhe
  rationale: O nifal de כלם indica ficar envergonhada ou ser humilhada; a forma reflexiva é natural e mantém o sentido subjetivo.
- source_word: מִכֹּל אֲשֶׁר עָשִׂית
  choice: por tudo o que fez
  rationale: A preposição מִן marca aqui a causa ou ocasião da vergonha; “por” explicita essa relação sem acrescentar interpretação.
- source_word: בְּנַחֲמֵךְ אֹתָן
  choice: tornando-se um consolo para elas
  rationale: A construção com בְּ e נחם admite valor circunstancial, temporal ou instrumental. A redação escolhida exprime a circunstância no contexto futuro e mantém “elas” como referente feminino plural.
theological_decisions:
- issue: Relação entre a vergonha de Jerusalém e o consolo das outras cidades no contexto da restauração
  choice: Jerusalém carrega sua desonra e, na reversão futura, torna-se consolo para elas.
  alternative: “quando você as consolar” ou “ao consolá-las”
  rationale: Ezequiel 16:53–55 aponta para a restauração conjunta de Jerusalém, Samaria e Sodoma. A formulação conserva a tensão de que essa reversão acompanha e aprofunda a vergonha de Jerusalém, sem definir de modo rígido a função da preposição בְּ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O feminino singular de “você” é indicado pelo contexto (Jerusalém personificada), e “elas” retoma as cidades-irmãs mencionadas anteriormente.
