  text: וּ/שְׁפַטְתִּי/ךְ֙ מִשְׁפְּטֵ֣י נֹאֲפ֔וֹת וְ/שֹׁפְכֹ֖ת דָּ֑ם וּ/נְתַתִּ֕י/ךְ דַּ֥ם חֵמָ֖ה וְ/קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/038.yaml
  text: And I will judge you with the judgments of women who commit adultery and who shed blood[b][a], and I will give you over to blood in wrath and jealousy.
translation:
  language: pt
  text: Eu a julgarei conforme os juízos aplicados às mulheres que cometem adultério[a] e derramam sangue. Eu a entregarei ao sangue[b], em furor e ciúme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às adúlteras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ao sangue de furor e ciúme”; provavelmente se refere a uma pena sangrenta ou ao derramamento de sangue infligido com furor e ciúme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁפַטְתִּיךְ
  choice: Eu a julgarei
  rationale: O verbo שׁפט indica a ação judicial de Deus contra Jerusalém, personificada como mulher. “Julgarei” conserva a ligação com מִשְׁפְּטֵי sem restringir o sentido apenas à pronúncia da sentença.
- source_word: מִשְׁפְּטֵי
  choice: conforme as sentenças aplicadas a
  rationale: O plural em estado construto expressa o padrão ou modo do julgamento. Esta formulação mantém a força jurídica e comunica com naturalidade que Jerusalém receberá as penas correspondentes a esses crimes.
- source_word: נֹאֲפוֹת
  choice: mulheres que cometem adultério
  rationale: O particípio feminino plural designa mulheres adúlteras. A locução é clara e atual, além de preservar o gênero da imagem alegórica.
- source_word: וְשֹׁפְכֹת דָּם
  choice: e derramam sangue
  rationale: A expressão participial paralela descreve mulheres culpadas de homicídio ou derramamento de sangue. “Derramar sangue” é uma expressão portuguesa estabelecida e mantém a gravidade do hebraico.
- source_word: וּנְתַתִּיךְ
  choice: Eu a entregarei
  rationale: נתן, nesta construção, apresenta Jerusalém sendo destinada a uma condição ou sorte. “Entregarei” expressa a ação judicial divina sem introduzir uma explicação excessiva.
- source_word: דַּם
  choice: ao sangue
  rationale: O substantivo provavelmente se refere a uma pena sangrenta, morte violenta ou derramamento de sangue. A tradução compacta preserva a imagem e sua ambiguidade, esclarecida em nota.
- source_word: חֵמָה
  choice: furor
  rationale: חֵמָה denota ira intensa e ardente. “Furor” é natural no registro profético e preserva a força do termo.
- source_word: וְקִנְאָה
  choice: e ciúme
  rationale: No contexto conjugal e pactual do capítulo, קִנְאָה indica indignação ciumenta diante da infidelidade. “Ciúme” mantém essa metáfora, ao passo que “zelo” a enfraqueceria.
theological_decisions:
- issue: Linguagem de ciúme conjugal e pactual aplicada ao juízo divino
  choice: Eu a entregarei ao sangue, em furor e ciúme
  alternative: Eu a entregarei a uma morte sangrenta, em ira e zelo
  rationale: A opção adotada conserva juntas as imagens judicial e conjugal, sem suavizar a severidade do juízo nem explicar “sangue” de maneira mais específica do que o hebraico permite. “Ciúme” preserva a tensão da metáfora de Deus como marido traído.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A referência feminina de “a” acompanha Jerusalém personificada como mulher no contexto. A segunda frase foi mantida compacta para preservar a expressão incomum e teologicamente tensa do hebraico.
