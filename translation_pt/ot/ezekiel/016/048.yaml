  text: חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם עָֽשְׂתָה֙ סְדֹ֣ם אֲחוֹתֵ֔/ךְ הִ֖יא וּ/בְנוֹתֶ֑י/הָ כַּ/אֲשֶׁ֣ר עָשִׂ֔ית אַ֖תְּ וּ/בְנוֹתָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/048.yaml
  text: As I live[a], declares the Lord GOD, your sister Sodom, she and her daughters[b], has not done as you and your daughters have done.
translation:
  language: pt
  text: “Tão certo como eu vivo[a]”, declara o Senhor Yahweh, “sua irmã Sodoma, ela e suas filhas[b], não fizeram como você e suas filhas fizeram.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Fórmula hebraica de juramento; literalmente: “Vivo eu... se Sodoma, sua irmã, fez...”. Nessa construção, a frase expressa uma forte negação.'
    reason: alternativa lexical
  - marker: b
    text: Aqui, “filhas” são as cidades ou comunidades ligadas a Sodoma e a Jerusalém.
    reason: nota cultural
lexical_decisions:
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Expressa em português natural a fórmula hebraica de juramento divino, preservando sua solenidade e força asseverativa.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente claro e corrente da fórmula profética que introduz ou identifica uma declaração solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יְהוִה e preserva explicitamente o nome próprio Yahweh.
- source_word: אִם
  choice: não fizeram
  rationale: Depois da fórmula de juramento, אִם integra uma construção elíptica que comunica forte negação, e não uma condição comum.
- source_word: סְדֹם אֲחוֹתֵךְ
  choice: sua irmã Sodoma
  rationale: Mantém a metáfora familiar central ao capítulo em ordem natural no português.
- source_word: הִיא וּבְנוֹתֶיהָ
  choice: ela e suas filhas
  rationale: Retém o pronome enfático הִיא e a imagem profética das cidades ou comunidades vinculadas a Sodoma.
- source_word: כַּאֲשֶׁר עָשִׂית אַתְּ וּבְנוֹתָיִךְ
  choice: como você e suas filhas fizeram
  rationale: Conserva a comparação e o endereço direto a Jerusalém em linguagem atual e facilmente compreensível.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O hebraico apresenta tanto o título אֲדֹנָי quanto o nome próprio יהוה; a tradução explicita ambos sem os fundir.
- issue: Sentido da construção de juramento חַי־אָנִי ... אִם
  choice: 'afirmação solene negativa: “Tão certo como eu vivo... não fizeram”'
  alternative: 'reprodução formal e opaca: “Vivo eu... se fizeram”'
  rationale: Nesse contexto, אִם após o juramento introduz uma negação enfática implícita. Explicitar a negação transmite o sentido sem converter a frase em uma condição enganosa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Você” torna direto o خطاب a Jerusalém sem recorrer a uma forma verbal regional ou arcaizante. A repetição de “fizeram” preserva a estrutura comparativa e a força acusatória do hebraico.
