base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/042.yaml
  text: So I will satisfy my wrath against you[a], and my jealousy will turn away from you[b]; then I will be quiet and no longer be angry.
translation:
  language: pt
  text: Assim, farei repousar sobre você a minha ira[a], e o meu ciúme se afastará de você[b]. Então me aquietarei e não ficarei mais irado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “farei a minha ira repousar em você”. A expressão indica que a ira será aplicada até se esgotar e cessar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o meu zelo se afastará de você”. O termo hebraico pode significar “ciúme” ou “zelo”; “ciúme” combina melhor com a imagem conjugal deste capítulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲנִחֹתִי חֲמָתִי בָּךְ
  choice: descarregarei sobre você a minha ira
  rationale: O hifil de נוח, tendo חֵמָה como objeto, apresenta a ira sendo levada ao repouso, isto é, plenamente aplicada e então cessada. “Descarregarei sobre você” comunica em português natural que a ira será executada e esgotada, enquanto a nota preserva a forma mais literal.
- source_word: קִנְאָתִי
  choice: o meu ciúme
  rationale: קִנְאָה pode indicar “ciúme” ou “zelo”. A imagem conjugal e de infidelidade da aliança em Ezequiel 16 favorece “ciúme”, sem eliminar a alternativa lexical.
- source_word: וְסָרָה ... מִמֵּךְ
  choice: se afastará de você
  rationale: סור com מִן expressa afastamento ou retirada. A formulação mantém a imagem de o ciúme deixar de se dirigir à destinatária.
- source_word: וְשָׁקַטְתִּי
  choice: Então me aquietarei
  rationale: שקט descreve quietude ou repouso após agitação. “Me aquietarei” é digno, claro e preserva a transição da ira ativa para a calma.
- source_word: וְלֹא אֶכְעַס עוֹד
  choice: e não ficarei mais irado
  rationale: כעס denota estar irado ou ser provocado à ira. A tradução é direta e mantém a força emocional da afirmação.
theological_decisions:
- issue: Linguagem da ira e do ciúme divinos no contexto judicial e conjugal da aliança
  choice: Manter “ira” e “ciúme” como termos reais da resposta divina à infidelidade da aliança.
  alternative: Suavizar para “desagrado” e traduzir קִנְאָה como “zelo”.
  rationale: O capítulo emprega explicitamente a metáfora conjugal, enquanto o contexto também é judicial. “Ira” e “ciúme” preservam essa tensão sem reduzir a linguagem a emoções descontroladas nem transformá-la em conceitos abstratos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “você” evita arcaísmo; “me aquietarei” conserva solenidade sem perder clareza. As notas registram a expressão hebraica mais literal e a ambiguidade de קִנְאָה.
