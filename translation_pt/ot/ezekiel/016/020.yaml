base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/020.yaml
  text: And you took your sons and your daughters, whom you had borne to me, and sacrificed them to them as food. Was your prostitution too small a thing?
translation:
  language: pt
  text: Você tomou seus filhos e suas filhas, que você deu à luz para mim, e os sacrificou a eles como alimento. Será que sua prostituição era pouca coisa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּזְבָּחִים
  choice: e os sacrificou
  rationale: O verbo זבח expressa abate sacrificial; o pronome masculino plural retoma coletivamente filhos e filhas.
- source_word: לָהֶם
  choice: a esses ídolos
  rationale: O pronome significa literalmente “a eles”; o referente contextual são os ídolos/amantes figurados. A explicitação evita em português a possível leitura equivocada de que os filhos foram sacrificados a si mesmos.
- source_word: לֶאֱכוֹל
  choice: como alimento
  rationale: O infinitivo de אכל é literalmente “para comer”; neste contexto sacrificial, “como alimento” preserva a imagem de os filhos serem oferecidos aos ídolos para consumo.
- source_word: תזנותך
  choice: sua prostituição
  rationale: O substantivo זְנוּת descreve prostituição e, na metáfora profética, a infidelidade idólatra de Jerusalém; o termo direto preserva a força acusatória.
- source_word: הַמְעַט
  choice: era pouca coisa?
  rationale: A pergunta retórica hebraica é preservada de modo natural, sem acrescentar uma avaliação não expressa no texto.
theological_decisions:
- issue: Os filhos pertencem a Deus na expressão אֲשֶׁר יָלַדְתְּ לִי
  choice: que havia dado à luz para mim
  alternative: que você me havia dado
  rationale: 'A tradução mantém a formulação relacional do hebraico: Jerusalém os gerou “para mim”, sem explicar além do texto a natureza dessa pertença.'
- issue: Referente de לָהֶם
  choice: a esses ídolos
  alternative: a eles
  rationale: O contexto imediato identifica os destinatários como imagens idólatras; a explicitação esclarece a sintaxe portuguesa sem introduzir uma doutrina particular.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para a Jerusalém personificada. A formulação conserva a linguagem severa e a pergunta retórica do hebraico.
