  verdict: revise
  source_fidelity: 'A tradução reproduz a sequência e os elementos centrais do hebraico: tomar filhos e filhas, gerados para Deus, sacrificá-los aos destinatários plurais e a pergunta retórica sobre a prostituição. Contudo, «esses ídolos» explicita um referente que o texto hebraico apresenta apenas pelo pronome «a eles»; embora o contexto o torne provável, a tradução deve preservar essa referência pronominal, em concordância também com a trilha inglesa.'
  naturalness: «Pegou» é possível, mas tem tom mais coloquial do que o registro profético. «Tomou» é natural, claro e mais adequado. Explicitar «você» em «que você deu à luz para mim» evita a leve ambiguidade criada por «que havia dado à luz».
  terminology: «Prostituição» preserva adequadamente a força de זְנוּת no uso metafórico profético, sem atenuação doutrinária. «Como alimento» comunica de modo natural o propósito expresso por לֶאֱכֹל.
