base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/047.yaml
  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
translation:
  language: pt
  text: Não lhe bastou andar nos caminhos delas e praticar suas abominações[a]. Como se isso fosse pouca coisa[b], você se corrompeu mais do que elas em todos os seus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “fez” ou “cometeu as abominações delas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico difícil: literalmente, algo como “como uma coisa muito pequena”. A expressão pode enfatizar que imitar os pecados delas não bastou; alguns a entendem em sentido temporal, “em pouquíssimo tempo”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּדַרְכֵיהֶן ... הָלַכְתְּ
  choice: andar nos caminhos delas
  rationale: Preserva a metáfora hebraica de הלך בְּדֶרֶךְ para a conduta habitual e mantém o motivo de “caminhos”, repetido no fim do versículo.
- source_word: וְלֹא ... הָלַכְתְּ ... עָשִׂית
  choice: não se limitou a andar ... e a praticar
  rationale: 'Entende a negação em ligação com a escalada da frase: Jerusalém não apenas reproduziu a conduta das cidades comparadas, mas as excedeu. Essa leitura é coerente com a sequência comparativa, embora a construção hebraica seja difícil; a alternativa é registrada em nota.'
- source_word: תּוֹעֲבוֹתֵיהֶן
  choice: suas abominações
  rationale: “Abominações” conserva a força cultual e moral característica das denúncias de Ezequiel; “suas” é evitado no texto principal em favor de “delas” no complemento verbal para reduzir ambiguidade referencial.
- source_word: עָשָׂה com תּוֹעֵבָה
  choice: praticar suas abominações
  rationale: Em português corrente, “praticar abominações” comunica naturalmente a ideia de fazer ou cometer atos detestáveis sem enfraquecer o peso do termo hebraico.
- source_word: כִּמְעַט קָט
  choice: como se isso fosse pouca coisa
  rationale: 'Reproduz a força retórica de escalada: imitar os pecados alheios não bastou. A expressão admite também uma leitura temporal, “em pouquíssimo tempo”, preservada na nota.'
- source_word: וַתַּשְׁחִתִי
  choice: corrompeu-se
  rationale: Expressa o valor moral intransitivo ou reflexivo de שׁחת no contexto e mantém a acusação dirigida à Jerusalém personificada.
- source_word: מֵהֵן
  choice: mais do que elas
  rationale: Traduz o מן comparativo e deixa explícito que Jerusalém ultrapassou as cidades-irmãs em corrupção.
- source_word: בְּכָל דְּרָכָיִךְ
  choice: em todos os seus caminhos
  rationale: Mantém a abrangência de כֹּל e a repetição retórica de דֶּרֶךְ, em vez de substituir a imagem por “conduta”.
theological_decisions:
- issue: Grau da culpa de Jerusalém em comparação com Samaria e Sodoma
  choice: Jerusalém não apenas reproduziu a conduta delas, mas as superou em corrupção.
  alternative: Jerusalém não andou nos caminhos delas nem praticou suas abominações, embora tenha se corrompido ainda mais por outros caminhos.
  rationale: A comparação מֵהֵן e a progressão retórica favorecem a ideia de que Jerusalém foi além delas. A sintaxe inicial, porém, é difícil e permite a tradução negativa alternativa, que por isso é explicitada em nota sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. O tratamento por “você” acompanha a interpelação direta à Jerusalém personificada; “delas” retoma as cidades-irmãs. A metáfora dos “caminhos” e o termo profético forte “abominações” foram preservados.
