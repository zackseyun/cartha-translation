  text: וַ/תִּזְנִי֙ אֶל בְּנֵ֣י אַשּׁ֔וּר מִ/בִּלְתִּ֖י שָׂבְעָתֵ֑/ךְ וַ/תִּזְנִ֕י/ם וְ/גַ֖ם לֹ֥א שָׂבָֽעַתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/028.yaml
  text: You prostituted yourself with the sons of Assyria because you were not satisfied[a]; you prostituted yourself with them[b], and even then you were not satisfied.
translation:
  language: pt
  text: Você se prostituiu com os filhos da Assíria[a], porque não estava satisfeita; prostituiu-se com eles[b] e, mesmo assim, não ficou satisfeita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os assírios”. Hebraico: “os filhos da Assíria”.'
    reason: lexical_alternative
  - marker: b
    text: Ezequiel repete a metáfora da prostituição para representar a infidelidade de Jerusalém em suas alianças e em sua idolatria.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: você se prostituiu
  rationale: Preserva a metáfora sexual forte e deliberada de Ezequiel para a infidelidade política e religiosa de Jerusalém, em linguagem portuguesa atual.
- source_word: אֶל
  choice: com
  rationale: Com o verbo זנה, a preposição indica aqueles com quem se mantém a relação ilícita; “com” é o equivalente natural em português.
- source_word: בְּנֵי אַשּׁוּר
  choice: os filhos da Assíria
  rationale: Mantém a forma concreta do hebraico e sua textura, embora a expressão designe coletivamente os assírios; a alternativa corrente é indicada em nota.
- source_word: מִבִּלְתִּי שָׂבְעָתֵךְ
  choice: porque ainda não estava satisfeita
  rationale: Expressa a falta de saciedade como motivo ou circunstância. “Ainda” explicita naturalmente a continuidade sugerida pelo contexto sem alterar o sentido básico.
- source_word: וַתִּזְנִים
  choice: prostituiu-se com eles
  rationale: O sufixo masculino plural remete aos filhos da Assíria; o pronome explícito preserva esse dado do hebraico.
- source_word: וְגַם לֹא שָׂבָעַתְּ
  choice: e, mesmo assim, não ficou satisfeita
  rationale: 'Reproduz a intensificação irônica: nem a nova prostituição trouxe saciedade. A alternância entre “estava” e “ficou” torna clara a progressão temporal em português.'
theological_decisions:
- issue: Manutenção da metáfora da prostituição para a infidelidade de Jerusalém
  choice: Preservar explicitamente “se prostituiu” no texto principal
  alternative: Suavizar para “foi infiel” ou explicitar “fez alianças”
  rationale: A imagem sexual chocante é parte intencional da retórica profética e comunica a gravidade da infidelidade religiosa e política de Jerusalém. Suavizá-la reduziria a força do texto e resolveria indevidamente a metáfora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora explícita e a repetição do original foram preservadas; a construção foi levemente ajustada para soar natural em português.
