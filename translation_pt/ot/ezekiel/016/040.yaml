review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a reunião hostil, o apedrejamento e o corte violento por meio de espadas. “Convocarão uma assembleia contra você” é uma opção aceitável para o hifil de עלה com קהל. Contudo, “retalharão” é menos idiomático neste registro bíblico em português e pode evocar sobretudo o corte de carne; “cortarão em pedaços” explicita de modo claro e fiel a violência de בתק.
  naturalness: Há uma mudança pouco fluida de “você” para o clítico feminino em “a retalharão”. Embora a personificação feminina de Jerusalém no contexto a torne compreensível, a redação pode tornar essa referência feminina consistente e inequívoca.
  terminology: “Assembleia”, “apedrejar” e “espadas” são escolhas adequadas. A formulação revista preserva a imagem severa de julgamento público sem reduzir a cena a ataque militar comum nem acrescentar uma interpretação doutrinária.
  issues:
  - severity: low
    issue: Alternância entre “você” e “a” para o mesmo referente
    rationale: A alternância é possível à luz da personificação feminina contextual, mas prejudica levemente a fluidez e pode deixar o antecedente do clítico menos imediato. A repetição do clítico feminino após a oração inicial resolve isso.
  - severity: low
    issue: “Retalharão” tem conotação estilística estreita
    rationale: O verbo pode traduzir o corte violento, mas em português moderno tende a soar mais associado a carne ou tecido. “Cortarão em pedaços” é natural, mantém a intensidade de בתק e corresponde à alternativa lexical atestada.
