  yaml_path: translation/ot/ezekiel/016/040.yaml
  text: They will bring up an assembly against you[b][a], and they will stone you and cut you down with their swords.
translation:
  language: pt
  text: Eles convocarão uma assembleia contra você; eles a apedrejarão e a cortarão em pedaços com suas espadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles a retalharão com suas espadas”. O verbo hebraico indica um corte violento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלוּ עָלַיִךְ קָהָל
  choice: convocarão uma assembleia contra você
  rationale: O hifil de עלה com קהל e עליך descreve a mobilização de um grupo contra Jerusalém. Em português, “convocar uma assembleia contra” comunica naturalmente a ação hostil sem impor se o cenário é estritamente judicial ou militar.
- source_word: וְרָגְמוּ אוֹתָךְ בָּאָבֶן
  choice: apedrejarão você
  rationale: רגם com בָּאָבֶן designa apedrejamento. O verbo português já incorpora o instrumento, de modo que “com pedras” seria desnecessariamente redundante.
- source_word: וּבִתְּקוּךְ
  choice: a retalharão
  rationale: בתק expressa corte violento, podendo sugerir esquartejamento. “Retalhar” preserva a intensidade sem acrescentar explicitamente “em pedaços” ao texto.
- source_word: בְּחַרְבוֹתָם
  choice: com suas espadas
  rationale: A preposição ב marca o instrumento, e o plural possessivo do hebraico é mantido.
theological_decisions:
- issue: Natureza das imagens de punição
  choice: Preservar a cena como julgamento público e violento contra Jerusalém personificada como mulher.
  alternative: Reduzir a linguagem a um ataque militar genérico ou tratá-la apenas como execução judicial.
  rationale: A assembleia, o apedrejamento e as espadas combinam imagens jurídicas e militares. A tradução mantém essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome feminino em “a retalharão” mantém Jerusalém personificada como mulher no contexto. O futuro simples conserva o tom profético.
