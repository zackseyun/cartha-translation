  text: וַ/הֲקִימוֹתִ֥י אֲנִ֛י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/062.yaml
  text: And I myself will establish my covenant with you, and you will know that I am Yahweh.
translation:
  language: pt
  text: Eu mesmo estabelecerei a minha aliança com você, e você saberá que eu sou Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: estabelecerei
  rationale: O hifil de קום comunica fazer a aliança permanecer firme, isto é, estabelecê-la. O futuro se ajusta ao discurso profético e ao contexto.
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome independente, além da pessoa já indicada pelo verbo, dá ênfase à iniciativa pessoal de Yahweh.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: בְּרִית é o termo hebraico habitual para uma relação pactuada e, neste contexto, mantém seu peso bíblico e teológico.
- source_word: אִתָּךְ
  choice: com você
  rationale: A expressão indica a parte com quem a aliança é estabelecida. O contexto identifica a destinatária figurada como Jerusalém, embora o português não marque aqui o feminino singular.
- source_word: וְיָדַעַתְּ
  choice: e você saberá
  rationale: No discurso profético, a forma verbal expressa o resultado futuro. A conjunção foi preservada sem acrescentar um valor temporal como 'então'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Ênfase do pronome independente אֲנִי
  choice: Eu mesmo
  alternative: Eu
  rationale: A formulação conserva a ênfase gramatical na iniciativa do próprio Deus sem acrescentar uma interpretação doutrinária.
- issue: Relação desta aliança com as alianças mencionadas no contexto
  choice: Sem explicitação interpretativa
  alternative: Identificá-la no texto como renovação, confirmação ou nova aliança
  rationale: O versículo diz 'minha aliança' e usa o verbo 'estabelecer', mas não resolve sozinho todas as relações entre essa aliança e as referências do contexto. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. 'Eu mesmo' mantém a ênfase do hebraico; 'estabelecerei' é natural no contexto de aliança; 'você' representa a destinatária feminina singular, Jerusalém personificada.
