base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/045.yaml
  text: You are the daughter of your mother[a], who loathed her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children. Your mother was a Hittite, and your father an Amorite.
translation:
  language: pt
  text: Você é filha de sua mãe[a], que abominava seu marido e seus filhos; e é irmã de suas irmãs, que abominavam seus maridos e seus filhos. A mãe de vocês era hitita, e o pai de vocês, amorreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desprezava” ou “sentia repulsa por”; o verbo hebraico expressa forte aversão ou rejeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת אִמֵּךְ
  choice: filha de sua mãe
  rationale: Preserva de modo claro a expressão filial hebraica que introduz semelhança de caráter e linhagem.
- source_word: גֹּעֶלֶת / גָּעֲלוּ
  choice: sentia(m) repulsa por
  rationale: O verbo געל expressa forte aversão ou rejeição. A formulação é natural em português e mantém a intensidade sem recorrer a linguagem arcaica.
- source_word: אִישָׁהּ / אַנְשֵׁיהֶן
  choice: seu marido / seus maridos
  rationale: No contexto doméstico e conjugal, אִישׁ designa naturalmente o marido, não apenas um homem.
- source_word: וּבָנֶיהָ / וּבְנֵיהֶן
  choice: seus filhos
  rationale: בנים pode abranger a descendência de modo coletivo; “filhos” é idiomático em português e não exige restringir a referência aos homens.
- source_word: וַאֲחוֹת אֲחוֹתֵךְ
  choice: é irmã de suas irmãs
  rationale: Mantém a repetição e a ênfase hebraicas na relação e semelhança entre Jerusalém e suas irmãs simbólicas.
- source_word: אִמְּכֶן חִתִּית וַאֲבִיכֶן אֱמֹרִי
  choice: A mãe de vocês era hitita, e o pai de vocês, amorreu
  rationale: O sufixo plural de “mãe de vocês” e “pai de vocês” inclui a destinatária e suas irmãs; a elipse de “era” na segunda oração preserva a concisão do hebraico.
theological_decisions:
- issue: A linguagem de ascendência étnica aplicada a Jerusalém
  choice: 'Preservar literalmente a imagem profética: mãe hitita e pai amorreu'
  alternative: Interpretar a frase como afirmação genealógica literal ou explicitar no texto que se trata apenas de metáfora
  rationale: Ezequiel 16 emprega uma extensa personificação familiar e conjugal. A tradução mantém a acusação tal como formulada, sem decidir no corpo do texto se a ascendência é biológica ou exclusivamente figurada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “de vocês” reproduz a mudança do singular dirigido a Jerusalém para o plural que a associa às irmãs.
