  naturalness: O português é claro, moderno e adequado ao registro. “Você se adornou com ouro e prata” é mais idiomático e diretamente correspondente à construção hebraica do que “adornou-se de ouro e prata”.
  terminology: “Linho fino”, “seda” com nota de incerteza, “tecido bordado”, “flor de farinha”, “mel”, “azeite” e “realeza” são escolhas adequadas. A nota sobre “seda” está corretamente ancorada. A nota final preserva de modo apropriado a amplitude de לִמְלוּכָה.
