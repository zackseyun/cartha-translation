  text: וַ/תַּעְדִּ֞י זָהָ֣ב וָ/כֶ֗סֶף וּ/מַלְבּוּשֵׁ/ךְ֙ ששי וָ/מֶ֨שִׁי֙ וְ/רִקְמָ֔ה סֹ֧לֶת וּ/דְבַ֛שׁ וָ/שֶׁ֖מֶן אכלתי וַ/תִּ֨יפִי֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַֽ/תִּצְלְחִ֖י לִ/מְלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/013.yaml
  text: You adorned yourself with gold and silver[a], and your clothing was fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil[b], and you became exceedingly beautiful and prospered to royalty.
translation:
  language: pt
  text: Você se adornou com ouro e prata, e suas roupas eram de linho fino, seda[a] e tecido bordado. Você comeu flor de farinha, mel e azeite. Tornou-se extremamente bela e alcançou a realeza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata do tecido traduzido como “seda” é incerta; o termo se refere a um tecido luxuoso.
    reason: lexical_alternative
  - marker: b
    text: Ou “prosperou até tornar-se rainha” ou “chegou a ser um reino”. A expressão hebraica pode indicar, de modo mais amplo, o avanço bem-sucedido a uma condição régia.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּעְדִּי
  choice: Você se adornou
  rationale: O verbo עדה descreve adornar-se com ornamentos; a forma reflexiva harmoniza com os objetos “ouro e prata” e com a imagem nupcial do contexto.
- source_word: זָהָב וָכֶסֶף
  choice: ouro e prata
  rationale: Termos materiais diretos, mantidos literalmente como objetos do adorno.
- source_word: וּמַלְבּוּשֵׁךְ
  choice: suas roupas eram
  rationale: O singular coletivo com sufixo feminino de segunda pessoa é expresso naturalmente em português pelo plural “roupas”, introduzindo a lista de tecidos.
- source_word: שֵׁשִׁי
  choice: linho fino
  rationale: שֵׁשׁ costuma designar linho de alta qualidade, sobretudo em contextos luxuosos ou cultuais.
- source_word: מֶשִׁי
  choice: seda
  rationale: “Seda” é a identificação tradicional e concisa neste inventário de luxo, embora a natureza exata do tecido seja incerta; a nota preserva essa incerteza lexical.
- source_word: רִקְמָה
  choice: tecido bordado
  rationale: Designa material trabalhado com bordados; “tecido bordado” conserva tanto o objeto têxtil quanto o aspecto artesanal.
- source_word: סֹלֶת
  choice: flor de farinha
  rationale: Expressão portuguesa estabelecida para farinha refinada e de alta qualidade, apropriada à imagem de abundância.
- source_word: דְבַשׁ
  choice: mel
  rationale: Tradução direta do alimento mencionado.
- source_word: שֶׁמֶן
  choice: azeite
  rationale: Embora o hebraico diga genericamente “óleo”, no contexto alimentar do antigo Israel trata-se normalmente de azeite; esta escolha produz português natural sem alterar a imagem.
- source_word: אכלתי
  choice: Você comia
  rationale: A forma verbal é de segunda pessoa feminina e mantém o discurso dirigido à Jerusalém personificada. O imperfeito português apresenta a alimentação como parte do estado contínuo de abundância descrito.
- source_word: וַתִּיפִי בִּמְאֹד מְאֹד
  choice: Tornou-se extremamente bela
  rationale: O verbo יפה indica tornar-se ou mostrar-se bela, e a repetição de מְאֹד comunica intensidade excepcional.
- source_word: וַתִּצְלְחִי לִמְלוּכָה
  choice: alcançou a realeza
  rationale: A expressão indica progresso bem-sucedido até uma condição régia. “Alcançou a realeza” é natural e preserva a amplitude entre tornar-se rainha e atingir posição real ou régia.
theological_decisions:
- issue: Elevação metafórica de Jerusalém no retrato conjugal e régio
  choice: alcançou a realeza
  alternative: prosperou até tornar-se rainha; chegou a ser um reino
  rationale: A Jerusalém personificada é retratada como mulher adornada e elevada a uma condição régia. A formulação escolhida conserva a imagem feminina e política sem decidir de modo excessivamente estreito entre dignidade de rainha, status real e formação de um reino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a personificação feminina de Jerusalém. “Flor de farinha” preserva a qualidade superior do alimento; “realeza” evita restringir indevidamente a ambiguidade da cláusula final.
