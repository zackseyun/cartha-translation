  source_fidelity: 'A tradução preserva bem o contraste central entre o pagamento normalmente dado às prostitutas e os presentes que Jerusalém dá aos seus amantes, bem como o sentido de «subornar». Contudo, «para se prostituírem com você» altera o referente de «suas prostituições» (בְּתַזְנוּתָיִךְ): sugere que os amantes se prostituem, enquanto o hebraico caracteriza as prostituições como pertencentes à interlocutora.'
  naturalness: O texto é claro e moderno. «Dá-se pagamento a todas as prostitutas» é uma ordem um pouco mais fluida em português do que iniciar com o complemento preposicionado.
  terminology: «Pagamento», «presentes», «amantes» e «subornou» são escolhas adequadas. «Suas prostituições» mantém o plural e a atribuição feminina presentes no hebraico, sem introduzir uma interpretação adicional acerca de quem se prostitui.
  issues:
  - severity: medium
    issue: O segmento final transfere a ação de prostituir-se para os amantes.
    rationale: בְּתַזְנוּתָיִךְ significa literalmente «em/para as tuas prostituições». «Para se prostituírem com você» explicita uma ação dos amantes que o texto não enuncia e deixa de conservar o possessivo feminino e o plural do hebraico.
  revised_text: Dá-se pagamento a todas as prostitutas, mas você deu presentes a todos os seus amantes e os subornou para que viessem de todos os lados até você, para as suas prostituições.
