source:
  edition: WLC
  text: לְ/כָל זֹנ֖וֹת יִתְּנוּ נֵ֑דֶה וְ/אַ֨תְּ נָתַ֤תְּ אֶת נְדָנַ֨יִ/ךְ֙ לְ/כָל מְאַֽהֲבַ֔יִ/ךְ וַ/תִּשְׁחֳדִ֣י אוֹתָ֗/ם לָ/ב֥וֹא אֵלַ֛יִ/ךְ מִ/סָּבִ֖יב בְּ/תַזְנוּתָֽיִ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/033.yaml
  text: Men give a prostitute her payment, but you gave your gifts to all your lovers, and you bribed them to come to you from all around for your prostitutions.
translation:
  language: pt
  text: Dá-se pagamento a todas as prostitutas, mas você deu presentes a todos os seus amantes e os subornou para que viessem de todos os lados até você, para as suas prostituições.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵדֶה
  choice: pagamento
  rationale: No contexto, designa a remuneração dada à prostituta; «pagamento» comunica o sentido com clareza e sem especificar uma forma de recompensa não expressa pelo hebraico.
- source_word: נְדָנַיִךְ
  choice: presentes
  rationale: Termo relacionado a dádivas ou presentes; o plural português preserva o contraste irônico entre o pagamento normalmente recebido e aquilo que Jerusalém oferece aos amantes.
- source_word: וַתִּשְׁחֳדִי
  choice: os subornou
  rationale: O verbo expressa dar suborno ou incentivo para obter uma ação, reforçando a inversão descrita no versículo.
- source_word: בְּתַזְנוּתָיִךְ
  choice: para se prostituírem com você
  rationale: A formulação natural em português explicita a relação indicada pelo contexto sem reduzir o plural intensivo/abstrato a um único ato.
theological_decisions:
- issue: Metáfora de prostituição aplicada a Jerusalém
  choice: Manter explicitamente «prostitutas», «amantes» e «se prostituírem»
  alternative: Suavizar como «infidelidade» ou «alianças»
  rationale: O texto profético emprega deliberadamente linguagem sexual contundente para retratar a infidelidade de Jerusalém; suavizá-la apagaria a força retórica e a tensão teológica do original.
- issue: Identidade dos agentes na primeira oração
  choice: 'Construção impessoal: «se dá pagamento»'
  alternative: «Os homens dão pagamento»
  rationale: O hebraico tem verbo no plural sem sujeito expresso. A construção impessoal preserva essa indefinição e soa natural em português.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por «você» coerente com a interpelação direta feminina. Mantém-se o contraste enfático entre o costume comum e a conduta invertida de Jerusalém, sem eufemizar a metáfora profética.
