base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/063.yaml
  text: so that you may remember and be ashamed[a], and no longer have any opening of the mouth because of your disgrace, when I make atonement for you for all that you have done[b], declares the Lord GOD.
translation:
  language: pt
  text: para que você se lembre, se envergonhe e nunca mais tenha ocasião de abrir a boca[a] por causa da sua desonra, quando eu fizer expiação por você, por tudo o que você fez[b] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “abertura da boca”; expressão que pode significar ter motivo, espaço ou ousadia para falar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando eu expiar por você”. O verbo hebraico emprega linguagem de expiação e reconciliação, não apenas de perdão em sentido geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado pretendido e soa natural em português.
- source_word: תִּזְכְּרִי
  choice: você se lembre
  rationale: O imperfeito feminino singular após לְמַעַן integra uma oração de finalidade; o feminino se refere a Jerusalém personificada.
- source_word: וָבֹשְׁתְּ
  choice: fique envergonhada
  rationale: Preserva o sentido de experimentar vergonha e torna explícito o gênero feminino da destinatária.
- source_word: פִּתְחוֹן פֶּה
  choice: ocasião de abrir a boca
  rationale: Expressa de modo natural o idioma hebraico, que indica ter motivo, espaço ou ousadia para falar, sem apagar sua imagem corporal.
- source_word: מִפְּנֵי כְּלִמָּתֵךְ
  choice: por causa da sua humilhação
  rationale: מִפְּנֵי tem força causal neste contexto; 'humilhação' comunica a desonra associada a כְּלִמָּה sem repetir 'vergonha'.
- source_word: בְּכַפְּרִי לָךְ
  choice: quando eu fizer expiação por você
  rationale: A preposição ב é entendida temporalmente, e כפר conserva sua linguagem de expiação e reconciliação, mais específica que simples perdão.
- source_word: לְכָל אֲשֶׁר עָשִׂית
  choice: por tudo o que você fez
  rationale: Mantém o alcance abrangente da culpa de Jerusalém e a referência retrospectiva aos seus atos.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética de declaração; 'Yahweh' preserva o nome divino, enquanto אֲדֹנָי é traduzido por 'Senhor'.
theological_decisions:
- issue: Sentido de כפר no contexto da restauração divina
  choice: fizer expiação por você
  alternative: perdoar você; fizer reconciliação por você
  rationale: A tradução mantém a força expiatória e reconciliadora do verbo sem especificar um mecanismo que este versículo não apresenta.
- issue: Relação entre a vergonha de Jerusalém e a expiação divina
  choice: preservar ambas sem explicar causalmente além do texto
  alternative: tratar a vergonha apenas como castigo anterior ou apenas como arrependimento posterior
  rationale: O versículo aproxima memória, vergonha, silêncio e expiação, mas não resolve em detalhe como esses elementos se relacionam; a tradução conserva essa tensão.
- issue: Representação de אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor Deus; o Soberano SENHOR
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome pactual יְהוִה e não substitui o nome por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O feminino em 'envergonhada' mantém Jerusalém personificada como destinatária. A repetição de 'você' na cláusula final evita ambiguidade, e o travessão destaca a fórmula profética conclusiva.
