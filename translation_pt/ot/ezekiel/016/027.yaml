  text: וְ/הִנֵּ֨ה נָטִ֤יתִי יָדִ/י֙ עָלַ֔יִ/ךְ וָ/אֶגְרַ֖ע חֻקֵּ֑/ךְ וָ/אֶתְּנֵ֞/ךְ בְּ/נֶ֤פֶשׁ שֹׂנְאוֹתַ֨יִ/ךְ֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים הַ/נִּכְלָמ֖וֹת מִ/דַּרְכֵּ֥/ךְ זִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/027.yaml
  text: And behold[a], I stretched out my hand against you, and I reduced your allotted portion, and gave you over to the desire of those who hate you, the daughters of the Philistines[c][b], who are ashamed of your lewd way.
translation:
  language: pt
  text: Eis que estendi a mão contra você, reduzi a porção que lhe cabia[a] e entreguei você ao desejo[b] das que a odeiam — as filhas dos filisteus[c] — que se envergonham da sua conduta indecente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que lhe era devido”, “a sua provisão” ou “a sua parte”. O termo hebraico pode indicar aquilo que foi prescrito ou atribuído.
    reason: lexical_alternative
  - marker: b
    text: Ou “à vontade das que a odeiam”. A expressão hebraica inclui literalmente “alma”, usada aqui no sentido de desejo, apetite ou vontade.
    reason: lexical_alternative
  - marker: c
    text: “As filhas dos filisteus” preserva a personificação profética de povos ou cidades como filhas.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Mantém a função enfática e de chamada de atenção da expressão hebraica, em registro digno e ainda compreensível.
- source_word: נָטִיתִי יָדִי עָלַיִךְ
  choice: estendi a mão contra você
  rationale: Preserva a imagem hebraica de uma ação decisiva de juízo, sem explicá-la além do texto.
- source_word: וָאֶגְרַע חֻקֵּךְ
  choice: reduzi a porção que lhe cabia
  rationale: Expressa a diminuição daquilo que havia sido prescrito ou atribuído a Jerusalém, sem restringir o sentido a alimento ou território.
- source_word: וָאֶתְּנֵךְ
  choice: entreguei você
  rationale: O contexto punitivo favorece o sentido de sujeitar Jerusalém às intenções de seus inimigos.
- source_word: בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
  choice: ao desejo das que a odeiam
  rationale: נֶפֶשׁ denota aqui desejo, apetite ou vontade; a formulação conserva a ambiguidade entre intenção e vontade hostil.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: as filhas dos filisteus
  rationale: Preserva a personificação profética de povos ou cidades como filhas, evitando transformá-las indevidamente em mulheres filisteias individuais.
- source_word: הַנִּכְלָמוֹת
  choice: que se envergonhavam
  rationale: Comunica a reação de vergonha e repulsa diante da conduta de Jerusalém e se ajusta naturalmente à sequência narrativa no passado.
- source_word: מִדַּרְכֵּךְ זִמָּה
  choice: da sua conduta indecente
  rationale: Transmite uma maneira de viver marcada por indecência sexual e moral, com linguagem atual e sem neutralizar a força da acusação.
theological_decisions:
- issue: Imagem de juízo na alegoria profética
  choice: Manter a linguagem divina em primeira pessoa, o gesto de estender a mão contra Jerusalém e a metáfora sexual e moral.
  alternative: Substituir as imagens por linguagem abstrata de castigo ou reduzir a acusação a maldade genérica.
  rationale: O versículo integra uma alegoria prolongada de infidelidade à aliança. A tradução conserva sua tensão e força retórica sem acrescentar uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “você” e formas oblíquas correspondentes para evitar a mistura de paradigmas; o referente é Jerusalém personificada no feminino. Os travessões esclarecem que “as filhas dos filisteus” identifica “as que a odeiam”.
