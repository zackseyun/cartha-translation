base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/016.yaml
  text: You took some of your garments and made for yourself colorful high places[a], and you prostituted yourself on them—such things should not come[b], nor should they be.
translation:
  language: pt
  text: Você pegou algumas das suas roupas e fez para si lugares altos coloridos[a], e neles se prostituiu — coisas assim não deveriam acontecer nem existir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugares altos remendados”, “variados” ou “santuários multicoloridos”. O adjetivo hebraico é difícil e provavelmente descreve a aparência criada com as roupas.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico da frase final é difícil. Também pode ser entendido temporalmente: “coisas assim não vieram a acontecer, nem serão”. Mais literalmente: “não vêm, e não será”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְחִי מִבְּגָדַיִךְ
  choice: Você pegou algumas das suas roupas
  rationale: 'O verbo לקח é direto, e מִן tem sentido partitivo: ela tomou algumas dentre as próprias roupas.'
- source_word: וַתַּעֲשִׂי לָךְ
  choice: fez para si
  rationale: Preserva a nuance benefactiva de לָךְ e soa natural em português.
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: É a designação tradicional e contextualmente adequada para locais de culto, aqui ilícitos.
- source_word: טְלֻאוֹת
  choice: coloridos
  rationale: O adjetivo raro sugere aspecto remendado, variado ou multicolorido, provavelmente devido às roupas usadas para decorar os locais.
- source_word: וַתִּזְנִי עֲלֵיהֶם
  choice: e neles se prostituiu
  rationale: Mantém tanto a metáfora sexual deliberadamente forte de זנה quanto a referência locativa de עַל aos lugares altos.
- source_word: לֹא בָאוֹת וְלֹא יִהְיֶה
  choice: coisas assim nunca tinham acontecido e jamais acontecerão
  rationale: A cláusula hebraica é elíptica e difícil. Esta leitura entende os verbos como afirmação temporal de caráter sem precedente e irrepetível, preservando a mudança de aspecto/tempo entre בָאוֹת e יִהְיֶה sem convertê-la silenciosamente em linguagem de obrigação.
theological_decisions:
- issue: Metáfora profética sexual para a idolatria
  choice: Manter a linguagem explícita de prostituição
  alternative: Suavizar para “foi infiel”
  rationale: Ezequiel emprega intencionalmente uma imagem sexual chocante para retratar a infidelidade de Jerusalém; suavizá-la reduziria a força retórica do texto.
- issue: Sentido da cláusula final difícil
  choice: Lê-la como declaração de que tais atos não tinham acontecido e não acontecerão
  alternative: “coisas assim não deveriam acontecer, nem existir”
  rationale: A forma hebraica permite leituras distintas. A tradução principal acompanha mais diretamente os valores temporais aparentes, enquanto a nota registra a leitura modal sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Roupas” é preferido a “vestes” por naturalidade; “lugares altos” conserva o vocabulário cultual bíblico. A construção “neles se prostituiu” mantém a força profética sem arcaísmo.
