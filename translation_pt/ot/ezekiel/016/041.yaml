    issue: A nota b identifica de modo impreciso a forma hebraica como «da prostituição».
    rationale: מִזּוֹנָה expressa «de prostituir-se» ou «de ser prostituta» no contexto; a nota deve preservar essas possibilidades sem apresentar uma glosa inexata.
