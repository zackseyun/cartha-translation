  source_fidelity: A tradução preserva adequadamente a sequência futura, a destruição pelo fogo, a execução de juízos, o caráter público e a metáfora da prostituição. Contudo, וְגַם acrescenta explicitamente «também», força que deve aparecer na última oração. A nota b deve descrever com mais precisão a construção hebraica, que indica cessação de prostituir-se/de ser prostituta, não uma citação simples «da prostituição».
  naturalness: «Farei cessar a sua prostituição» é compreensível, mas «Porei fim à sua prostituição» é mais idiomático em português moderno e mantém o sentido causativo. «Não dará mais pagamento» é possível, mas soa incompleto sem «também» e fica mais claro como «não dará mais nenhum pagamento».
  terminology: «Juízos», «prostituição» e «pagamento» mantêm o registro profético e jurídico e não atenuam a metáfora. A nota sobre pagamento associado à prostituição é apropriada, pois o contexto em Ezequiel envolve a imagem incomum de Jerusalém dando esse pagamento.
