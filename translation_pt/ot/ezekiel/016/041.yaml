base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/041.yaml
  text: They will burn your houses with fire and execute judgments against you before the eyes of many women[a]. I will put a stop to your prostitution[c][b], and you will no longer give payment.
translation:
  language: pt
  text: Queimarão suas casas com fogo e executarão juízos contra você diante dos olhos de muitas mulheres.[a] Porei fim à sua prostituição,[b] e você também não dará mais nenhum pagamento.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista de muitas mulheres”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico pode ser entendido como “de prostituir-se” ou “de ser prostituta”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, pagamento relacionado à prostituição; também traduzido como “pagamento de prostituta” ou “preço”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ
  choice: Queimarão suas casas com fogo
  rationale: O verbo e os plurais são preservados, e בָּאֵשׁ é entendido instrumentalmente. O futuro comunica a sequência do juízo profético com naturalidade em português.
- source_word: וְעָשׂוּ בָךְ שְׁפָטִים
  choice: executarão juízos contra você
  rationale: A expressão idiomática indica a aplicação de punições judiciais; esta formulação conserva sua força jurídica sem se tornar obscura.
- source_word: לְעֵינֵי נָשִׁים רַבּוֹת
  choice: diante dos olhos de muitas mulheres
  rationale: Mantém de perto a imagem hebraica dos olhos e enfatiza o caráter público da vergonha.
- source_word: וְהִשְׁבַּתִּיךְ מִזּוֹנָה
  choice: Farei cessar a sua prostituição
  rationale: O hifil de שׁבת expressa causação da cessação. 'Prostituição' preserva explicitamente a metáfora sexual aplicada a Jerusalém.
- source_word: אֶתְנַן
  choice: pagamento
  rationale: O substantivo designa pagamento ligado à prostituição. O termo claro e atual permanece contextualizado pela oração anterior, enquanto a nota explicita seu sentido específico.
- source_word: לֹא תִתְּנִי עוֹד
  choice: você não dará mais
  rationale: A construção negativa com עוֹד indica cessação futura e é reproduzida em português corrente.
theological_decisions:
- issue: Linguagem sexual metafórica para a infidelidade de Jerusalém
  choice: Manter explicitamente a metáfora da prostituição
  alternative: Substituir por 'infidelidade' ou 'idolatria'
  rationale: Ezequiel emprega deliberadamente a prostituição como imagem da infidelidade de Jerusalém. Traduzir pelo conceito teológico subjacente apagaria a força e a tensão da metáfora.
- issue: Sentido de מִזּוֹנָה
  choice: Entender como cessação da prostituição
  alternative: Entender mais concretamente como deixar de ser prostituta
  rationale: A construção permite uma formulação referente à atividade ou ao estado. O texto principal usa a expressão natural 'cessar a sua prostituição', e a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva o tratamento feminino singular de Jerusalém por meio de “você” e dos possessivos correspondentes. A ordem dos marcadores foi normalizada para que cada nota acompanhe diretamente a expressão pertinente.
