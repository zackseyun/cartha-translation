  yaml_path: translation/ot/ezekiel/016/002.yaml
  text: Son of man[a], make known to Jerusalem her abominations.
translation:
  language: pt
  text: Filho do homem, dê a conhecer a Jerusalém as suas abominações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva literalmente a forma hebraica e o modo recorrente como Deus se dirige ao profeta em Ezequiel, sem substituí-la por uma interpretação como “mortal”.
- source_word: הוֹדַע
  choice: faça ... conhecer
  rationale: O imperativo hifil de ידע tem força causativa, “fazer conhecer”, e a formulação reproduz com clareza a construção de objeto duplo do hebraico.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Emprega a forma portuguesa consagrada do nome da cidade.
- source_word: תּוֹעֲבֹתֶיהָ
  choice: as suas abominações
  rationale: “Abominações” conserva o forte peso cultual, moral e pactual do termo, bem como seu plural; “suas” retoma Jerusalém, personificada no feminino no contexto.
theological_decisions:
- issue: Personificação feminina de Jerusalém
  choice: Usar “suas” com referência a Jerusalém personificada
  alternative: “as abominações dela”
  rationale: O sufixo hebraico é feminino singular, e todo o capítulo apresenta Jerusalém como mulher. “Suas” preserva a referência de modo natural em português, enquanto o contexto mantém a personificação.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do hebraico. “Faça Jerusalém conhecer” é menos idiomático do que “dê a conhecer a Jerusalém”, mas preserva melhor a força causativa e a construção do texto-fonte.
