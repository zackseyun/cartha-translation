  text: וַ/אֲחוֹתֵ֨/ךְ הַ/גְּדוֹלָ֤ה שֹֽׁמְרוֹן֙ הִ֣יא וּ/בְנוֹתֶ֔י/הָ הַ/יּוֹשֶׁ֖בֶת עַל שְׂמֹאולֵ֑/ךְ וַ/אֲחוֹתֵ֞/ךְ הַ/קְּטַנָּ֣ה מִמֵּ֗/ךְ הַ/יּוֹשֶׁ֨בֶת֙ מִֽ/ימִינֵ֔/ךְ סְדֹ֖ם וּ/בְנוֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/046.yaml
  text: Your older sister is Samaria[a], she and her daughters, who dwell to your left; and your younger sister, who dwells to your right, is Sodom and her daughters.
translation:
  language: pt
  text: Sua irmã mais velha é Samaria[a], ela e suas filhas, que habitam à sua esquerda; e sua irmã mais nova do que você, que habita à sua direita, é Sodoma e suas filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, da perspectiva de Jerusalém, Samaria fica ao norte, e Sodoma, ao sul.
    reason: Nota cultural e geográfica que esclarece o uso antigo de «esquerda» e «direita» na orientação espacial.
lexical_decisions:
- source_word: אֲחוֹתֵךְ
  choice: sua irmã
  rationale: Preserva o termo de parentesco empregado metaforicamente para cidades e povos, essencial à alegoria familiar do capítulo.
- source_word: הַגְּדוֹלָה
  choice: mais velha
  rationale: Embora o sentido básico seja «grande», no contexto da relação entre irmãs o português natural expressa a comparação como idade.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: וּבְנוֹתֶיהָ
  choice: ela e suas filhas / com suas filhas
  rationale: Mantém a imagem literal de «filhas», que designa as localidades dependentes, e comunica a relação entre a cidade principal e suas comunidades.
- source_word: הַיּוֹשֶׁבֶת
  choice: que habitam / que habita
  rationale: ישׁב significa aqui habitar ou morar. O plural na primeira oração acompanha Samaria e suas filhas; o singular na segunda acompanha «irmã mais nova», isto é, Sodoma.
- source_word: עַל שְׂמֹאולֵךְ
  choice: à sua esquerda
  rationale: Reproduz a orientação corporal do hebraico sem substituí-la por uma direção cardeal interpretativa.
- source_word: הַקְּטַנָּה מִמֵּךְ
  choice: sua irmã mais nova
  rationale: O adjetivo comparativo literalmente indica a irmã menor em relação a Jerusalém. «Mais nova» transmite essa comparação de modo natural, sem a construção redundante «mais nova do que você».
- source_word: מִימִינֵךְ
  choice: à sua direita
  rationale: Preserva a expressão espacial do original e deixa a explicação geográfica para a nota.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Forma tradicional do topônimo em português.
theological_decisions:
- issue: Linguagem geográfica de esquerda e direita em relação a Jerusalém
  choice: Manter «à sua esquerda» e «à sua direita» no texto principal.
  alternative: Traduzir interpretativamente como «ao norte de você» e «ao sul de você».
  rationale: O hebraico usa orientação corporal, não termos cardeais explícitos. A tradução preserva a imagem original, enquanto a nota esclarece sua implicação geográfica.
- issue: Sentido comparativo de הַגְּדוֹלָה e הַקְּטַנָּה מִמֵּךְ
  choice: Traduzir como «irmã mais velha» e «irmã mais nova».
  alternative: Traduzir como «irmã maior» e «irmã menor do que você».
  rationale: No quadro familiar da alegoria, a linguagem de idade é natural em português e preserva a relação comparativa sem introduzir uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a metáfora familiar de irmãs e filhas e conserva no texto a orientação espacial concreta do hebraico.
