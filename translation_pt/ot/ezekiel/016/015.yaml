base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/015.yaml
  text: But you trusted in your beauty[a], and you prostituted yourself because of your name, and you poured out your prostitutions on every passerby[b]; they became his.
translation:
  language: pt
  text: Mas você confiou na sua beleza, prostituiu-se por causa da sua fama[a] e derramou suas prostituições sobre todo passante; isso era dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “por causa do seu nome”. Aqui, “nome” tem o sentido de renome, fama ou reputação.
    reason: lexical_alternative
  - marker: b
    text: 'A cláusula final é muito concisa em hebraico: literalmente, algo como “para ele, seja” ou “era dele”. O referente não é declarado de modo explícito; a ideia é que o que ela oferecia era entregue a cada passante.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַתִּבְטְחִי בְיָפְיֵךְ
  choice: você confiou na sua beleza
  rationale: O verbo בטח com a preposição ב expressa confiança depositada em algo. A formulação preserva a acusação de confiança indevida e traduz יֹפִי de modo direto.
- source_word: וַתִּזְנִי
  choice: prostituiu-se
  rationale: זנה mantém aqui a imagem sexual explícita pela qual Ezequiel retrata a infidelidade de Jerusalém. A opção é atual e evita suavizar a metáfora para mera 'infidelidade'.
- source_word: עַל שְׁמֵךְ
  choice: por causa da sua fama
  rationale: Embora שֵׁם signifique literalmente 'nome', neste contexto indica o renome ou a reputação alcançada por Jerusalém. 'Fama' comunica naturalmente esse valor em português, enquanto a nota preserva a forma literal.
- source_word: וַתִּשְׁפְּכִי אֶת תַּזְנוּתַיִךְ
  choice: derramou a sua prostituição
  rationale: שׁפך é concretamente 'derramar', imagem forte que convém preservar. O substantivo abstrato 'prostituição' soa mais natural em português do que um plural literal e ainda comunica a conduta reiterada.
- source_word: עַל כָּל עוֹבֵר
  choice: sobre todo aquele que passava
  rationale: A tradução conserva a preposição e a imagem deliberadamente chocante de disponibilidade indiscriminada, sem acrescentar uma interpretação política ou cultual ao texto.
- source_word: לוֹ יֶהִי
  choice: ela ficava para ele
  rationale: A cláusula hebraica é extremamente concisa, literalmente algo como 'para ele seja'. A formulação portuguesa mantém a ideia de entrega a cada passante sem tentar identificar com certeza o referente elíptico.
theological_decisions:
- issue: Metáfora sexual profética para a infidelidade de Jerusalém
  choice: Manter no texto principal a linguagem explícita de prostituição
  alternative: Substituir por linguagem interpretativa e suavizada, como 'foi infiel'
  rationale: O hebraico emprega intencionalmente uma metáfora sexual forte para representar idolatria e infidelidade de aliança. Preservá-la mantém a força retórica e evita impor uma explicação teológica no lugar da imagem.
- issue: Referente da cláusula final לוֹ יֶהִי
  choice: Conservar o referente implícito por meio de 'ela ficava para ele'
  alternative: Explicitar que a beleza, a prostituição ou os atos de prostituição se tornavam propriedade do passante
  rationale: O texto hebraico não nomeia o sujeito da cláusula final. A tradução não resolve de forma dogmática essa ambiguidade, e a nota informa a concisão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você' porque Jerusalém é interpelada diretamente no feminino no contexto. Mantém a imagem concreta de 'derramar' e a linguagem sexual do hebraico, mas usa construções correntes, sem arcaísmos nem eufemismos confessionais.
