  text: Look[a], everyone who uses proverbs about you will use this proverb, saying, ‘Like mother, like daughter.’
translation:
  language: pt
  text: '“Veja[a], todo aquele que usa provérbios a seu respeito usará este provérbio: ‘Tal mãe, tal filha.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega aqui a raiz משל no sentido de proferir ou usar um provérbio, não no sentido de governar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Preserva a força de chamar a atenção, em português moderno e natural.
- source_word: כָּל הַמֹּשֵׁל
  choice: todo aquele que usa provérbios
  rationale: O particípio substantivado com כָּל tem sentido distributivo; a formulação explicita cada pessoa que profere ou aplica provérbios.
- source_word: עָלַיִךְ
  choice: a seu respeito
  rationale: Com a fala proverbial, עַל indica naturalmente o assunto ou alvo do dito. A expressão mantém aberta a possibilidade contextual de tom hostil sem inseri-la na preposição.
- source_word: יִמְשֹׁל
  choice: usará este provérbio
  rationale: O verbo משל tem aqui o sentido de proferir ou empregar um provérbio, e não o de governar. “Este” aponta naturalmente para o dito citado em seguida.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem diretamente a citação e expressam de modo natural em português a função de לֵאמֹר.
- source_word: כְּאִמָּה בִּתָּהּ
  choice: Tal mãe, tal filha
  rationale: Provérbio português corrente que reproduz com concisão e força retórica a comparação hebraica.
