source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן הִשָּׁפֵ֤ךְ נְחֻשְׁתֵּ/ךְ֙ וַ/תִּגָּלֶ֣ה עֶרְוָתֵ֔/ךְ בְּ/תַזְנוּתַ֖יִ/ךְ עַל מְאַהֲבָ֑יִ/ךְ וְ/עַל֙ כָּל גִּלּוּלֵ֣י תוֹעֲבוֹתַ֔יִ/ךְ וְ/כִ/דְמֵ֣י בָנַ֔יִ/ךְ אֲשֶׁ֥ר נָתַ֖תְּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/036.yaml
  text: 'Thus says the Lord GOD: Because your bronze was poured out[a], and your nakedness was uncovered in your prostitutions with your lovers, and because of all the idols of your abominations, and because of the blood of your children whom you gave to them[c][b],'
translation:
  language: pt
  text: 'Assim diz o Senhor DEUS: Porque o seu bronze foi derramado[a], e a sua nudez foi exposta nas suas prostituições com os seus amantes, por causa de todos os ídolos das suas abominações[b] e por causa do sangue dos seus filhos, que você entregou a eles[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «a sua riqueza foi derramada». O hebraico diz literalmente «o seu bronze»; a expressão pode representar a riqueza esbanjada com amantes ilícitos, embora alguns a entendam de modo mais amplo como imagem de exposição sexual.
    reason: lexical_alternative
  - marker: b
    text: Isto é, todos os seus ídolos detestáveis. O termo hebraico usado por Ezequiel para «ídolos» é deliberadamente depreciativo.
    reason: lexical_alternative
  - marker: c
    text: Isto é, você os entregou aos ídolos em sacrifício de crianças.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Emprega a forma portuguesa convencional para o título duplo, evitando a repetição pouco natural «Senhor SENHOR» e distinguindo o nome divino por meio de «DEUS» em versaletes.
- source_word: יַעַן
  choice: Porque
  rationale: Introduz diretamente a causa da sentença que prossegue nos versículos seguintes.
- source_word: הִשָּׁפֵךְ נְחֻשְׁתֵּךְ
  choice: o seu bronze foi derramado
  rationale: Mantém o sentido lexical concreto de נְחֻשֶׁת e a voz passiva de שפך, sem decidir no texto principal entre as possíveis metáforas de riqueza esbanjada e exposição sexual.
- source_word: וַתִּגָּלֶה עֶרְוָתֵךְ
  choice: a sua nudez foi exposta
  rationale: Preserva a imagem hebraica de desnudamento e vergonha sexual em português natural.
- source_word: בְּתַזְנוּתַיִךְ
  choice: nas suas prostituições
  rationale: Conserva o plural e a metáfora contundente da infidelidade, sem recorrer a linguagem arcaica.
- source_word: עַל מְאַהֲבָיִךְ
  choice: com os seus amantes
  rationale: Expressa idiomaticamente a relação indicada por עַל neste contexto de prostituição.
- source_word: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
  choice: os ídolos das suas abominações
  rationale: Mantém a estrutura do hebraico e o tom condenatório de Ezequiel; uma formulação mais idiomática aparece em nota.
- source_word: וְכִדְמֵי בָנַיִךְ
  choice: e por causa do sangue dos seus filhos
  rationale: Entende כ no encadeamento causal das acusações e conserva a referência explícita ao sangue e à culpa decorrente da morte dos filhos.
- source_word: אֲשֶׁר נָתַתְּ לָהֶם
  choice: que você entregou a eles
  rationale: «Entregou» traduz נתן de modo natural e mantém os filhos como objeto da ação, sem inserir explicitamente «sacrificou» no texto principal.
theological_decisions:
- issue: Sentido metafórico de נְחֻשְׁתֵּךְ no contexto de prostituição e idolatria
  choice: Conservar «o seu bronze» no texto principal.
  alternative: «a sua riqueza» ou uma referência interpretativa à exposição sexual
  rationale: O substantivo designa literalmente cobre ou bronze, mas sua força metafórica aqui é discutida. A tradução preserva a imagem e registra a principal alternativa em nota, sem eliminar a ambiguidade.
- issue: Linguagem referente ao sacrifício de crianças
  choice: Traduzir literalmente que os filhos foram entregues aos ídolos.
  alternative: «os seus filhos, que você sacrificou a eles»
  rationale: O contexto aponta para sacrifício infantil, mas o verbo hebraico é «dar». A redação principal mantém essa escolha lexical e a nota explicita a prática pressuposta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala dirige-se à Jerusalém personificada; por isso, as formas possessivas referem-se a ela. A oração permanece aberta ao final, pois a sentença continua no versículo seguinte.
