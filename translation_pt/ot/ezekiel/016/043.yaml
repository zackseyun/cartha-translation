  naturalness: A construção «Por não te lembrares ..., mas me provocares» é compreensível, mas menos natural por combinar dois infinitivos sob «por» com uma oposição. Verbos finitos tornam a frase mais fluente e preservam melhor a sequência narrativa.
  terminology: «Senhor Yahweh» reproduz adequadamente אֲדֹנָי יְהוִה. «Conduta» é mais natural que «procedimento» neste contexto moral e judicial. «Devassidão» comunica de modo claro a força sexual-moral de זִמָּה sem restringi-la a material obsceno.
  issues:
