revisions:
- from: Por não te lembrares dos dias da tua juventude, mas me provocares com todas essas coisas, eu também fiz recair o teu procedimento sobre a tua própria cabeça — declara o Senhor Yahweh. E não acrescentaste essa obscenidade a todas as tuas abominações?[a]
  to: Como não te lembraste dos dias da tua juventude e me provocaste com todas essas coisas, também eu fiz a tua conduta recair sobre a tua própria cabeça, declara o Senhor Yahweh; e não cometerás essa devassidão além de todas as tuas abominações.[a]
  rationale: A revisão conserva a acusação causal, a imagem judicial de a conduta recair sobre a própria cabeça e a fórmula divina. Ajusta a cláusula final à leitura declarativa prospectiva mais segura, enquanto a nota preserva a ambiguidade real do hebraico quanto à forma verbal e à relação indicada por עַל.
