source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹֽא זכרתי אֶת יְמֵ֣י נְעוּרַ֔יִ/ךְ וַ/תִּרְגְּזִי לִ֖/י בְּ/כָל אֵ֑לֶּה וְ/גַם אֲנִ֨י הֵ֜א דַּרְכֵּ֣/ךְ בְּ/רֹ֣אשׁ נָתַ֗תִּי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לֹ֤א עשיתי אֶת הַ/זִּמָּ֔ה עַ֖ל כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/043.yaml
  text: Because you did not remember the days of your youth[a], but enraged me with all these things, therefore I also have put your way on your own head, declares the Lord GOD, and you have not committed lewdness beyond all your abominations.
translation:
  language: pt
  text: Como não te lembraste dos dias da tua juventude e me provocaste com todas essas coisas, também eu fiz a tua conduta recair sobre a tua própria cabeça, declara o Senhor Yahweh; e não cometerás essa devassidão além de todas as tuas abominações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cláusula final em hebraico é difícil. Também pode ser entendida como declaração no passado: “e não cometeste essa devassidão além de todas as tuas abominações”. A expressão “além de” também pode significar “em adição a” ou “junto com”.'
    reason: Preserva as principais possibilidades sintáticas e semânticas da cláusula hebraica ambígua, sem apresentar como certa uma leitura secundária.
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Por não
  rationale: Introduz a causa do juízo. A construção com infinitivo pessoal é natural em português e mantém a relação causal.
- source_word: יְמֵי נְעוּרַיִךְ
  choice: os dias da tua juventude
  rationale: Preserva a expressão hebraica e sua referência à condição anterior de Jerusalém.
- source_word: וַתִּרְגְּזִי לִי
  choice: mas me provocares
  rationale: רגז pode indicar agitação ou provocação. “Me provocares” comunica a ofensa pessoal contra Deus sem definir além do necessário se o efeito foi ira ou perturbação.
- source_word: וְגַם אֲנִי הֵא
  choice: eu também
  rationale: Mantém a resposta enfática de Deus; a consequência já é indicada pela construção causal da frase, sem necessidade de reproduzir mecanicamente a interjeição הֵא.
- source_word: דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי
  choice: fiz recair o teu procedimento sobre a tua própria cabeça
  rationale: Expressa de modo claro o idioma judicial de retribuição, conservando a imagem da conduta que recai sobre a própria cabeça.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Reproduz a fórmula profética e mantém o nome divino יְהוָה como Yahweh, distinguindo-o do título אֲדֹנָי.
- source_word: הַזִּמָּה
  choice: essa obscenidade
  rationale: No contexto sexual e moral do capítulo, “obscenidade” preserva a força condenatória de זִמָּה; o demonstrativo torna natural a referência à conduta descrita.
- source_word: עַל כָּל תּוֹעֲבֹתָיִךְ
  choice: a todas as tuas abominações
  rationale: Com “acrescentaste”, apresenta עַל em sentido aditivo, uma leitura contextual plausível da cláusula difícil.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus
  rationale: Mantém tanto o título אֲדֹנָי quanto o nome da aliança יְהוָה, sem fundi-los em um título genérico.
- issue: Sentido da cláusula final
  choice: pergunta retórica que acusa Jerusalém de acrescentar obscenidade às suas abominações
  alternative: 'declaração negativa: “e não cometeste essa obscenidade além de todas as tuas abominações”'
  rationale: A pergunta retórica se ajusta à sequência de acusações e permite que a negação hebraica tenha força interrogativa, mas a sintaxe é difícil; por isso, a leitura declarativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” coerente com o tratamento singular dirigido a Jerusalém. A metáfora judicial da conduta recaindo sobre a própria cabeça foi preservada. A pontuação separa a fórmula profética e destaca a pergunta retórica final.
