    issue: 'A cláusula final foi convertida em pergunta retrospectiva: «E não acrescentaste ...?»'
    rationale: 'O hebraico final é sintaticamente difícil, mas a leitura principal tradicional e contextualmente mais provável é uma declaração dirigida a Jerusalém, com forma prospectiva: «e não cometerás/praticarás ...». A interrogativa não deve ocupar o texto principal sem apoio textual claro.'
  - severity: low
    issue: «Acrescentaste» explicita excessivamente o verbo da cláusula final.
    rationale: O verbo hebraico é «fazer/praticar», enquanto o sentido aditivo decorre da preposição עַל. É preferível conservar «cometerás/praticarás» e expressar a relação difícil por «além de», com nota.
  - severity: low
