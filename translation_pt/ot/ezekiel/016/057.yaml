  text: בְּ/טֶרֶם֮ תִּגָּלֶ֣ה רָעָתֵ/ךְ֒ כְּמ֗וֹ עֵ֚ת חֶרְפַּ֣ת בְּנוֹת אֲרָ֔ם וְ/כָל סְבִיבוֹתֶ֖י/הָ בְּנ֣וֹת פְּלִשְׁתִּ֑ים הַ/שָּׁאט֥וֹת אוֹתָ֖/ךְ מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/057.yaml
  text: before your wickedness was uncovered[a], as at the time of the reproach of the daughters of Aram and all those around her, the daughters of the Philistines[c][b], who despise you from every side.
translation:
  language: pt
  text: antes que a sua maldade fosse exposta[a], como no tempo da afronta das filhas de Arã[b] e de todas as que estavam ao redor dela, as filhas dos filisteus[c], que desprezam você por todos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fosse revelada” ou “ficasse descoberta”.
    reason: lexical_alternative
  - marker: b
    text: “Arã” é tradicionalmente traduzido por “Síria”. A expressão hebraica “filhas de Arã” pode se referir ao povo ou às cidades de Arã.
    reason: cultural_note
  - marker: c
    text: “As filhas dos filisteus” é uma expressão hebraica que se refere ao povo ou às cidades dos filisteus.
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: antes que
  rationale: Introduz de modo natural em português o momento anterior à exposição pública da maldade de Jerusalém.
- source_word: תִּגָּלֶה
  choice: fosse exposta
  rationale: O nifal de גלה indica que algo se tornou publicamente conhecido; “exposta” preserva a imagem de desvelamento e o contexto de vergonha.
- source_word: רָעָתֵךְ
  choice: a sua maldade
  rationale: Neste contexto de acusação profética, רעה designa mal moral e culpa, não apenas calamidade.
- source_word: כְּמוֹ עֵת
  choice: como no tempo
  rationale: Mantém a força comparativa e temporal da expressão hebraica em português corrente.
- source_word: חֶרְפַּת
  choice: da afronta
  rationale: חרפה abrange vergonha, insulto e desprezo público; “afronta” conserva essa combinação sem especificar indevidamente se se trata apenas de zombaria verbal.
- source_word: בְּנוֹת אֲרָם
  choice: das filhas de Arã
  rationale: Preserva tanto o nome Arã quanto a expressão coletiva hebraica “filhas de”, explicada em nota.
- source_word: וְכָל סְבִיבוֹתֶיהָ
  choice: e de todas as que estavam ao redor dela
  rationale: Expressa de forma legível o feminino plural implícito e conserva o sufixo feminino singular, sem substituir o referente por uma identificação interpretativa explícita.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: as filhas dos filisteus
  rationale: Mantém a metáfora coletiva do hebraico, esclarecida em nota cultural.
- source_word: הַשָּׁאטוֹת
  choice: que desprezavam você
  rationale: O particípio descreve desprezo contínuo; “desprezavam” comunica diretamente essa atitude hostil.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: Reproduz de maneira idiomática a ideia de hostilidade circundante.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico. Preservaram-se as expressões coletivas “filhas de Arã” e “filhas dos filisteus”, acompanhadas de notas, bem como a relativa ambiguidade do referente feminino em “ao redor dela”.
