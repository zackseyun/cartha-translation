base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/055.yaml
  text: And your sisters[a], Sodom and her daughters, will return to their former state, and Samaria and her daughters will return to their former state, and you and your daughters will return to your former state.
translation:
  language: pt
  text: E suas irmãs, Sodoma e suas filhas, voltarão ao seu estado anterior; Samaria e suas filhas voltarão ao seu estado anterior; e você e suas filhas voltarão ao seu estado anterior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão restauradas ao seu estado anterior”. O hebraico diz mais literalmente: “voltarão ao seu estado anterior”.'
    reason: Alternativa lexical que explicita a restauração implícita no verbo «voltar», sem adotá-la no texto principal.
lexical_decisions:
- source_word: אֲחוֹתַיִךְ
  choice: suas irmãs
  rationale: Mantém a linguagem familiar e a personificação das cidades presente em todo o capítulo, sem substituí-la pela explicação “cidades-irmãs”.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Forma tradicional e amplamente reconhecida do nome geográfico em português.
- source_word: בְנוֹתֶיהָ / בְנוֹתַיִךְ
  choice: suas filhas
  rationale: Preserva literalmente a metáfora hebraica das “filhas”, que no contexto pode designar localidades ou comunidades dependentes, sem apagar a personificação.
- source_word: תָּשֹׁבְנָה / תְּשֻׁבֶינָה
  choice: voltarão
  rationale: Reproduz o sentido básico de שוב e conserva a repetição verbal nas três orações paralelas; “serão restauradas” seria mais interpretativo.
- source_word: לְקַדְמָתָן / לְקַדְמַתְכֶן
  choice: à condição anterior delas / à condição anterior de vocês
  rationale: Expressa de modo natural a referência hebraica ao estado ou condição precedente. As formas “delas” e “de vocês” evitam a ambiguidade dos possessivos “sua” e “suas” em português.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e amplamente reconhecida do nome geográfico em português.
- source_word: וְ
  choice: e
  rationale: Mantém a coordenação simples das três orações sem acrescentar uma relação temporal que não está explicitada.
theological_decisions:
- issue: Natureza da reversão prometida a Sodoma, Samaria e Jerusalém
  choice: “voltarão à condição anterior”
  alternative: “serão restauradas à condição anterior”
  rationale: A formulação preserva tanto o movimento de “voltar” quanto a ideia de uma condição precedente, sem definir o mecanismo nem resolver as implicações teológicas debatidas dessa restauração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para a cidade personificada e conserva “irmãs” e “filhas” para manter a metáfora familiar. O paralelismo e a repetição do hebraico foram preservados; o ponto e vírgula torna perceptível a estrutura tripla.
