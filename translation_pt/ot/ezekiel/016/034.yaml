revisions:
- from: 'Em suas prostituições, aconteceu com você o contrário do que acontece com as outras mulheres: ninguém procurava você[a]; você é que dava o pagamento, e nenhum pagamento era dado a você. Assim, com você acontecia o contrário.'
  to: 'Em suas prostituições, você foi o contrário das outras mulheres: ninguém procurava você[a], mas você dava pagamento, e nenhum pagamento lhe era dado; você se tornou o contrário.'
  rationale: 'A revisão conserva o vocabulário central e a estrutura contrastiva do rascunho, mas restitui a predicação e a conclusão resultativa do hebraico: Jerusalém é apresentada como “o contrário” das outras mulheres e como alguém que “se tornou o contrário”. A nota mantém a construção hebraica incomum e esclarece seu sentido contextual sem impor uma leitura além do necessário.'
