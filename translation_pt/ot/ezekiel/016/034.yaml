review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a metáfora de prostituição, a inversão retórica e a repetição de “pagamento”. Contudo, “aconteceu com você o contrário” enfraquece o predicado hebraico, que descreve Jerusalém como estando/tornando-se “o contrário”, não meramente como alguém a quem algo aconteceu. A última oração também deve refletir mais diretamente o resultado expresso por וַתְּהִי.
  naturalness: O texto é compreensível, mas a repetição de “aconteceu com você” é pesada e menos idiomática. “Você foi o contrário das outras mulheres” e “você se tornou o contrário” conservam a moldura do original com maior clareza.
  terminology: “Prostituições” e “pagamento” são escolhas adequadas e coerentes com o hebraico e com o registro do contexto. A nota deve apresentar a expressão literal com cuidado, pois “atrás de você” em português pode sugerir uma relação espacial indevida.
  issues:
  - severity: medium
    issue: Predicação enfraquecida por “aconteceu com você o contrário”.
    rationale: הָיָה בְּ... הֵפֶךְ e וַתְּהִי לְהֶפֶךְ caracterizam a destinatária como uma inversão/contrário no padrão descrito. A formulação atual muda isso para um acontecimento externo e torna a repetição final pouco fiel.
  - severity: low
    issue: A nota usa “atrás de você” como literalidade.
    rationale: אַחֲרַיִךְ é literalmente “depois de você” ou, conforme a construção contextual, “em busca de você”; “atrás de você” em português é espacial e pode confundir. A nota pode registrar a forma literal e explicar o sentido contextual.
  revised_text: 'Em suas prostituições, você foi o contrário das outras mulheres: ninguém procurava você[a], mas você dava pagamento, e nenhum pagamento lhe era dado; você se tornou o contrário.'
  revised_footnotes:
