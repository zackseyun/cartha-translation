  text: וַ/יְהִי בָ֨/ךְ הֵ֤פֶךְ מִן הַ/נָּשִׁים֙ בְּ/תַזְנוּתַ֔יִ/ךְ וְ/אַחֲרַ֖יִ/ךְ לֹ֣א זוּנָּ֑ה וּ/בְ/תִתֵּ֣/ךְ אֶתְנָ֗ן וְ/אֶתְנַ֛ן לֹ֥א נִתַּן לָ֖/ךְ וַ/תְּהִ֥י לְ/הֶֽפֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/034.yaml
  text: 'And in your prostitution you were the opposite of other women: no one solicited you[a], but you gave payment, and no payment was given to you; so you became the opposite.'
translation:
  language: pt
  text: 'Em suas prostituições, você foi o contrário das outras mulheres: ninguém procurava você[a], mas você dava pagamento, e nenhum pagamento lhe era dado; você se tornou o contrário.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “depois de você ninguém se prostituía”. No contexto, o sentido é que, ao contrário das prostitutas comuns, você não era procurada por clientes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵפֶךְ / לְהֶפֶךְ
  choice: o contrário / o contrário
  rationale: O substantivo expressa inversão ou reversão. A repetição de “o contrário” no início e no fim conserva a moldura retórica do hebraico e destaca a inversão irônica descrita no versículo.
- source_word: תַזְנוּתַיִךְ
  choice: suas prostituições
  rationale: O termo designa atos de prostituição dentro da metáfora extensa de Ezequiel para a infidelidade de Jerusalém. A escolha mantém de modo claro e atual a força sexual deliberadamente chocante do texto.
- source_word: וְאַחֲרַיִךְ לֹא זוּנָה
  choice: ninguém procurava você
  rationale: A expressão hebraica é incomum e, literalmente, afirma que ninguém se prostituía ou ia atrás dela. No contexto, indica que ela não era procurada por clientes como as demais prostitutas. A formulação natural no texto principal preserva esse sentido, enquanto a nota registra a forma mais literal e sua ambiguidade.
- source_word: אֶתְנָן
  choice: pagamento
  rationale: O substantivo denota o pagamento ligado à prostituição. “Pagamento” é corrente e permite conservar sua repetição explícita nas duas orações.
- source_word: וּבְתִתֵּךְ אֶתְנָן
  choice: você é que dava o pagamento
  rationale: 'A construção apresenta a circunstância que invertia a prática normal. “Você é que” ressalta naturalmente o contraste: em vez de receber, ela pagava.'
- source_word: וְאֶתְנַן לֹא נִתַּן לָךְ
  choice: e nenhum pagamento era dado a você
  rationale: A voz passiva acompanha de perto o hebraico e conserva a repetição do termo referente ao pagamento.
- source_word: וַתְּהִי לְהֶפֶךְ
  choice: Assim, com você acontecia o contrário
  rationale: A formulação indica a situação resultante e retoma a expressão inicial sem criar em português a impressão pouco natural de que a mulher se tornou literalmente uma entidade chamada “o contrário”.
theological_decisions:
- issue: Linguagem sexual metafórica para a infidelidade de Jerusalém
  choice: Manter diretamente a metáfora da prostituição
  alternative: Suavizar no texto principal para “infidelidade” ou “idolatria”
  rationale: Ezequiel emprega intencionalmente imagens sexuais chocantes para retratar a infidelidade da aliança de Jerusalém. Traduzir por “prostituições” preserva essa retórica sem substituí-la por uma interpretação abstrata.
- issue: Identidade do sujeito implícito em וְאַחֲרַיִךְ לֹא זוּנָה
  choice: Expressar no texto o sentido contextual de que ninguém a procurava, registrando a forma literal em nota
  alternative: Traduzir literalmente “ninguém se prostituía atrás de você”
  rationale: A forma verbal pode soar como se os perseguidores também praticassem prostituição, mas o contexto contrasta a mulher com prostitutas normalmente procuradas e pagas. A nota preserva a construção hebraica incomum, sem sobrecarregar o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se a linguagem explícita de Ezequiel, evitando tanto arcaísmos como “meretrício” quanto suavizações interpretativas. O tratamento por “você” corresponde à mulher personificada, Jerusalém.
