  yaml_path: translation/ot/ezekiel/016/012.yaml
  text: And I put a ring on your nose[a], earrings on your ears[b], and a splendid crown on your head.
translation:
  language: pt
  text: E coloquei uma argola no seu nariz, brincos nas suas orelhas e uma coroa esplêndida na sua cabeça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: E coloquei
  rationale: נתן pode significar “dar”, “pôr” ou “colocar”; no contexto de adornos postos em partes do corpo, “coloquei” expressa naturalmente a ação concreta.
- source_word: נֶזֶם עַל אַפֵּךְ
  choice: uma argola no seu nariz
  rationale: נֶזֶם designa um adorno em forma de argola, frequentemente usado no nariz; a menção explícita ao nariz elimina a necessidade de acrescentar “nasal”.
- source_word: וַעֲגִילִים עַל אָזְנָיִךְ
  choice: brincos nas suas orelhas
  rationale: עֲגִילִים são adornos das orelhas. “Brincos” é o equivalente moderno e claro; “nas” é mais idiomático em português do que a reprodução rígida de עַל como “sobre”.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: uma coroa esplêndida
  rationale: A construção significa literalmente “uma coroa de beleza/esplendor”; “coroa esplêndida” preserva o valor de תִּפְאֶרֶת em português natural e digno.
- source_word: בְּרֹאשֵׁךְ
  choice: na sua cabeça
  rationale: Embora בְּ possa ter vários valores locativos, com uma coroa o português corrente diz “na cabeça”.
