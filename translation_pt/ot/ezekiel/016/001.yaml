  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, tradicionalmente traduzido como “SENHOR”.'
    reason: Esclarecer a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética וַיְהִי דְבַר־יְהוָה אֵלַי, o português natural expressa o acontecimento como “a palavra ... veio a mim”, sem recorrer ao literalismo rígido “foi” ou “aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Neste contexto profético, דָּבָר designa a palavra ou mensagem divina. “A palavra” preserva a fórmula profética reconhecível e sua relação com a revelação direta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto hebraico apresenta o nome divino YHWH. “Yahweh” o representa como nome próprio, em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo de primeira pessoa indica que a palavra foi dirigida ao profeta; “a mim” é uma expressão clara e corrente em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo לֵאמֹר introduz a fala divina que vem em seguida. “Dizendo” mantém essa função e a continuidade sintática com o próximo versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega diretamente o Tetragrama, a tradução conserva o nome divino em forma transliterada. A nota informa a tradição de substituí-lo por “SENHOR”, sem impor essa leitura ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a fórmula profética hebraica e mantém “dizendo” para introduzir diretamente a fala do versículo seguinte.
