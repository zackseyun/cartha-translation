  text: אֶת זִמָּתֵ֥/ךְ וְ/אֶת תּוֹעֲבוֹתַ֖יִ/ךְ אַ֣תְּ נְשָׂאתִ֑י/ם נְאֻ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/058.yaml
  text: You have borne your lewdness and your abominations[a], declares Yahweh.
translation:
  language: pt
  text: Você carregou sua devassidão e suas abominações[a], declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregou sua punição” ou “carregou sua culpa”. Neste contexto, o verbo hebraico pode ter conotação judicial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמָּתֵךְ
  choice: sua própria infâmia
  rationale: Neste contexto, זִמָּה designa conduta moralmente vergonhosa e sexualmente carregada. “Infâmia” é natural em português e conserva a gravidade do termo sem reduzi-lo a maldade genérica; “própria” ajuda a transmitir a atribuição enfática de responsabilidade.
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: suas abominações
  rationale: Mantém o peso retórico do plural e a abrangência moral e cultual típica de תּוֹעֵבָה em Ezequiel.
- source_word: אַתְּ
  choice: você
  rationale: O pronome independente feminino dá ênfase ao sujeito; em português, a construção direta com “você” e “sua própria” comunica essa responsabilidade sem produzir uma formulação artificial.
- source_word: נְשָׂאתִם
  choice: tem suportado
  rationale: נשׂא significa levar ou carregar e, em contexto judicial, pode incluir suportar culpa ou punição. “Tem suportado” preserva a imagem e deixa aberta a natureza exata daquilo que é levado.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” reproduz com naturalidade a fórmula profética, e “Yahweh” representa diretamente o nome da aliança יְהוָה.
theological_decisions:
- issue: Como traduzir o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Se נשׂא deve ser explicitado como suportar culpa ou punição
  choice: tem suportado
  alternative: tem suportado sua punição; tem carregado sua culpa
  rationale: O verbo pode ter conotação judicial, mas seus objetos expressos são a infâmia e as abominações. A formulação mantém a ambiguidade compacta do hebraico, sem decidir entre culpa e consequência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a severidade profética e a ambiguidade judicial do verbo hebraico.
