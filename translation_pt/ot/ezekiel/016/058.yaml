  source_fidelity: A tradução preserva os dois objetos do verbo, o plural de “abominações” e a fórmula profética com Yahweh. Contudo, “infâmia” tende a designar má reputação, não a conduta sexualmente degradante indicada por זִמָּה; e o perfeito composto “tem suportado” sugere uma ação continuada em português, enquanto o perfeito hebraico é melhor representado aqui por um pretérito simples.
  naturalness: “Você carregou sua devassidão e suas abominações” é direto, digno e compreensível no português moderno. Evita tanto o sentido reputacional de “infâmia” quanto a nuance progressiva de “tem suportado”.
  terminology: “Devassidão” conserva a força moral e sexual de זִמָּה no contexto de Ezequiel. “Abominações” corresponde bem a תּוֹעֲבוֹת, e “Yahweh” segue a decisão terminológica do projeto para יהוה. A expressão “sua própria” não é necessária para representar o pronome independente, já expresso por “Você”.
  issues:
  - severity: medium
    issue: “Infâmia” não traduz com precisão זִמָּה neste contexto.
    rationale: Em português, “infâmia” normalmente se refere à desonra ou à reputação infame. זִמָּה em Ezequiel denota conduta vergonhosa, frequentemente sexualizada; “devassidão” preserva melhor essa dimensão.
  - severity: medium
    issue: “Tem suportado” introduz aspecto durativo/progressivo não exigido pelo perfeito hebraico.
    rationale: O perfeito composto português normalmente descreve ação repetida ou continuada até o presente. O pretérito simples “carregou” reproduz de modo mais neutro o perfeito e mantém a ambiguidade entre culpa e consequência.
  - severity: low
    issue: “Sua própria” acrescenta uma ênfase pouco natural.
    rationale: O pronome sujeito “Você” já torna explícita a responsabilização. O possessivo simples é suficiente e mais fluente.
