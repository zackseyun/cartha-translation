base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/018.yaml
  text: You took your embroidered garments and covered them[a], and you set my oil and my incense before them.
translation:
  language: pt
  text: Você tomou suas roupas bordadas e os cobriu[a]; pôs diante deles o meu óleo e o meu incenso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os vestiu”. O verbo hebraico significa literalmente “cobriu”, mas, neste contexto, pode indicar que as roupas foram colocadas sobre os ídolos.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto consonantal hebraico diz literalmente: “eu dei”; a leitura tradicional é: “você deu” ou “você pôs”.'
    reason: textual_variant
lexical_decisions:
- source_word: בִּגְדֵי רִקְמָתֵךְ
  choice: suas roupas bordadas
  rationale: בִּגְדֵי designa roupas ou vestes, e רִקְמָה indica tecido bordado ou ricamente trabalhado. A formulação é clara em português moderno e conserva a ideia de luxo.
- source_word: וַתְּכַסִּים
  choice: e os cobriu
  rationale: כסה significa normalmente “cobrir”. O sufixo masculino plural remete, pelo contexto, aos ídolos ou imagens, sem que seja necessário explicitar esse referente no texto.
- source_word: וְשַׁמְנִי
  choice: o meu óleo
  rationale: שֶׁמֶן significa “óleo”, provavelmente azeite no contexto israelita, mas o hebraico não especifica a matéria-prima. A tradução preserva o possessivo enfático.
- source_word: וּקְטָרְתִּי
  choice: o meu incenso
  rationale: קְטֹרֶת é incenso empregado em oferta ou culto. A tradução mantém tanto o sentido cultual quanto o possessivo.
- source_word: נתתי לִפְנֵיהֶם
  choice: pôs diante deles
  rationale: Embora o ketiv נתתי tenha aparência formal problemática no texto consonantal, o contexto e a tradição de leitura sustentam a segunda pessoa feminina singular, “você pôs/deu”. Em português, “pôs diante deles” expressa naturalmente a colocação de ofertas perante os ídolos.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: לִפְנֵי significa “diante de” ou “em frente de”; “diante deles” preserva o sentido literal e a conotação cultual.
theological_decisions:
- issue: Referente dos sufixos masculinos plurais (“os/deles”)
  choice: Manter os pronomes, cujo referente contextual são os ídolos ou imagens.
  alternative: Explicitar “os ídolos” ou deixar os objetos ainda mais implícitos.
  rationale: O contexto imediato identifica os objetos da ação, mas conservar os pronomes segue de perto o hebraico e evita inserir no versículo um substantivo que não aparece nele.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Roupas bordadas” soa mais corrente que “vestes bordadas”, enquanto “pôs diante deles” conserva um tom bíblico natural sem arcaísmo excessivo.
