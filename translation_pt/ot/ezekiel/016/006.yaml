- from: 'Passei por você e a vi se debatendo no próprio sangue[a]. Então lhe disse: “Em seu sangue, viva!” Sim, eu lhe disse: “Em seu sangue, viva!”[b]'
  to: 'Passei por você e a vi debatendo-se em seu sangue[a], e lhe disse: “Em seu sangue, viva!” E lhe disse: “Em seu sangue, viva!”[b]'
  rationale: A revisão remove uma nota que resolvia de forma excessivamente específica a imagem do sangue, mantém no texto a formulação concisa e ambígua do hebraico e torna a repetição final mais formalmente fiel. Também preserva «debatendo-se», escolha natural e semanticamente defensável para a condição da recém-nascida.
