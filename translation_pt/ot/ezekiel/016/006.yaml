base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/006.yaml
  text: And I passed by you and saw you wallowing in your blood[a], and I said to you, ‘In your blood, live!’ Yes, I said to you, ‘In your blood[b], live!’
translation:
  language: pt
  text: 'Passei por você e a vi debatendo-se em seu sangue[a], e lhe disse: “Em seu sangue, viva!” E lhe disse: “Em seu sangue, viva!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A preposição pode também ser entendida com nuance concessiva: “Embora estivesse em seu sangue, viva!”'
    reason: alternative_reading
  - marker: b
    text: A fórmula “Em seu sangue, viva!” é repetida no hebraico para dar ênfase.
    reason: repetition
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: Passei por você
  rationale: A combinação de עבר com על descreve passar junto de alguém; a formulação é natural em português e preserva o movimento da cena.
- source_word: וָאֶרְאֵךְ
  choice: e a vi
  rationale: ראה significa diretamente “ver”. O pronome feminino explicita em português o referente feminino marcado no hebraico.
- source_word: מִתְבּוֹסֶסֶת
  choice: se debatendo
  rationale: O particípio reflexivo retrata a recém-nascida movendo-se desamparada no sangue. “Debatendo-se” transmite esse movimento sem sugerir uma ação deliberada ou uma avaliação moral.
- source_word: בְּדָמָיִךְ
  choice: no próprio sangue / em seu sangue
  rationale: O plural hebraico idiomático é vertido pelo singular “sangue”. Na descrição, “no próprio sangue” soa natural; na fala repetida, “em seu sangue” mantém a forma abrupta e a preposição do original.
- source_word: וָאֹמַר לָךְ
  choice: Então lhe disse / eu lhe disse
  rationale: אמר com objeto indireto corresponde naturalmente a “dizer a”. “Então” liga a fala à cena sem alterar seu conteúdo, e a segunda ocorrência conserva a repetição.
- source_word: בְּדָמַיִךְ חֲיִי
  choice: Em seu sangue, viva!
  rationale: A ordem sintática e a concisão da expressão hebraica são preservadas, mantendo a imagem forte e a ambiguidade da preposição ב.
- source_word: וָאֹמַר לָךְ ... חֲיִי (repeated)
  choice: 'Sim, eu lhe disse: “Em seu sangue, viva!”'
  rationale: A frase inteira é repetida no hebraico para dar ênfase. “Sim” torna essa reiteração clara e natural sem suprimi-la.
theological_decisions:
- issue: Valor da preposição ב em בְּדָמַיִךְ חֲיִי
  choice: Preservar a formulação locativa “Em seu sangue, viva!”
  alternative: “Embora estivesse em seu sangue, viva!” ou “Mesmo em seu sangue, viva!”
  rationale: A construção hebraica é comprimida e admite nuance concessiva, mas não a explicita inequivocamente. O texto principal conserva a tensão, e a nota registra a leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução evita “chafurdando”, que poderia sugerir ação voluntária ou desprezo, e conserva tanto a repetição enfática quanto a sintaxe abrupta da ordem divina.
