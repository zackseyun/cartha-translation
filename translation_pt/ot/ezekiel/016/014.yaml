  text: וַ/יֵּ֨צֵא לָ֥/ךְ שֵׁ֛ם בַּ/גּוֹיִ֖ם בְּ/יָפְיֵ֑/ךְ כִּ֣י כָּלִ֣יל ה֗וּא בַּֽ/הֲדָרִ/י֙ אֲשֶׁר שַׂ֣מְתִּי עָלַ֔יִ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/014.yaml
  text: And your fame went out among the nations because of your beauty[a], for it was perfect through my splendor that I had set upon you, declares the Lord GOD.
translation:
  language: pt
  text: Sua fama[a] se espalhou entre as nações por causa da sua beleza, pois ela era perfeita graças ao meu esplendor, que pus sobre você — declaração do Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu nome saiu entre as nações”; isto é, sua reputação ou fama se espalhou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא לָךְ שֵׁם
  choice: Sua fama se espalhou
  rationale: A expressão diz literalmente que “um nome saiu para você”, idioma que comunica a difusão da reputação. “Sua fama se espalhou” preserva o sentido em português natural; a imagem literal é registrada em nota.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui as nações circunvizinhas em sentido amplo, sem o valor técnico posterior de “gentios”.
- source_word: בְּיָפְיֵךְ
  choice: por causa da sua beleza
  rationale: 'A preposição בְּ tem valor causal no contexto: a beleza é a razão pela qual a fama se difundiu.'
- source_word: כָּלִיל
  choice: perfeita
  rationale: O termo expressa inteireza ou perfeição; no contexto da beleza, “perfeita” é claro e idiomático.
- source_word: בַּהֲדָרִי
  choice: graças ao meu esplendor
  rationale: הָדָר pode indicar esplendor, majestade ou adorno. A construção atribui a perfeição da beleza ao esplendor concedido por Deus; “graças a” comunica essa relação sem excluir a ideia de meio.
- source_word: אֲשֶׁר שַׂמְתִּי עָלַיִךְ
  choice: que pus sobre você
  rationale: Mantém a imagem concreta de algo colocado sobre Jerusalém, coerente com os adornos descritos no contexto.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética solene. “Senhor Yahweh” distingue o título אֲדֹנָי do nome divino יְהוִה.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: O texto contém o título אֲדֹנָי seguido explicitamente do nome da aliança יְהוִה. “Senhor Yahweh” preserva ambos e evita a forma artificial “Senhor SENHOR”.
- issue: Origem da beleza de Jerusalém
  choice: “graças ao meu esplendor, que pus sobre você”
  alternative: “com o meu adorno que coloquei sobre você”
  rationale: A tradução mantém a afirmação de que a beleza perfeita deriva do esplendor concedido por Deus, sem restringir הָדָר exclusivamente a adorno ou exclusivamente a majestade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O feminino “ela” retoma “beleza” em português. O travessão destaca a fórmula profética final sem alterar sua relação sintática com o versículo.
