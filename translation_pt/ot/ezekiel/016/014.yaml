  source_fidelity: 'A tradução reproduz adequadamente a progressão do hebraico: a fama de Jerusalém se difunde entre as nações por causa de sua beleza, e essa beleza é perfeita em virtude do esplendor que Deus lhe conferiu. “Sua fama se espalhou” comunica com precisão o idiomatismo hebraico de um “nome” que sai/divulga-se. A fórmula final preserva tanto אַדֹנָי quanto o nome divino יהוה em “Senhor Yahweh”.'
