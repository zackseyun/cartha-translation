base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/011.yaml
  text: I adorned you with jewelry[c][b][a], and I put bracelets on your hands and a necklace on your neck.
translation:
  language: pt
  text: Eu a enfeitei com joias[a], pus braceletes em seus braços[b] e um colar[c] em seu pescoço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com adornos” ou “com enfeites”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre suas mãos”; aqui, o termo pode incluir os braços ou pulsos, onde os braceletes eram usados.'
    reason: lexical_alternative
  - marker: c
    text: Ou “uma corrente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעְדֵּךְ עֶדִי
  choice: Eu a enfeitei com joias
  rationale: O verbo עדה indica adornar, e o substantivo עֶדִי designa adorno ou ornamento. “Enfeitei com joias” é natural em português e introduz adequadamente os objetos específicos enumerados em seguida.
- source_word: צְמִידִים
  choice: braceletes
  rationale: O termo se refere a aros ornamentais usados nos braços ou pulsos. “Braceletes” é claro, atual e adequado ao contexto.
- source_word: עַל יָדַיִךְ
  choice: em seus braços
  rationale: יָד pode abranger mão, braço ou antebraço. Como os צְמִידִים são usados nos braços ou pulsos, esta formulação comunica naturalmente a imagem sem sugerir que as joias ficavam literalmente sobre as mãos.
- source_word: רָבִיד
  choice: um colar
  rationale: Designa um ornamento para o pescoço, possivelmente uma corrente. “Colar” é o equivalente português mais natural neste contexto.
- source_word: עַל גְּרוֹנֵךְ
  choice: em seu pescoço
  rationale: גָּרוֹן pode significar garganta ou pescoço; com uma joia, “pescoço” é a expressão idiomática apropriada em português.
theological_decisions:
- issue: Retrato metafórico de Jerusalém como uma mulher adornada por Deus
  choice: Manter literalmente a imagem concreta do adorno, sem explicação alegórica no texto.
  alternative: Explicitar no versículo que as joias representam bênçãos da aliança ou preparação nupcial.
  rationale: O contexto contém uma alegoria extensa, mas este versículo apenas descreve os adornos. Interpretar seu simbolismo na tradução eliminaria parte da abertura e da força da imagem profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma feminina “a” preserva a personificação de Jerusalém no contexto. A ordem das notas foi ajustada para acompanhar os respectivos termos no texto.
