  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּבְנִי לָ֖/ךְ גֶּ֑ב וַ/תַּעֲשִׂי לָ֥/ךְ רָמָ֖ה בְּ/כָל רְחֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/024.yaml
  text: You built for yourself a mound and made for yourself a high place in every square[a].
translation:
  language: pt
  text: Você construiu para si uma elevação[a] e fez para si um lugar alto em cada praça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “câmara abobadada”, “plataforma” ou, possivelmente, uma estrutura associada à prostituição; o termo hebraico é raro e seu sentido é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּב
  choice: elevação
  rationale: O substantivo é raro e seu sentido exato é incerto. “Elevação” preserva a ideia concreta de uma estrutura elevada, sem defini-la indevidamente como bordel, santuário ou forma arquitetônica específica.
- source_word: רָמָה
  choice: lugar alto
  rationale: No contexto profético e cultual, a expressão designa adequadamente um local elevado associado ao culto, e não apenas uma altura topográfica.
- source_word: רְחֹוב
  choice: praça
  rationale: O termo pode indicar um espaço público aberto da cidade; “praça” comunica melhor essa visibilidade urbana do que “rua”.
- source_word: וַתִּבְנִי לָךְ
  choice: Você construiu para si
  rationale: Mantém o valor benefactivo/reflexivo de לָךְ e a forma feminina singular implícita no discurso dirigido a Jerusalém.
- source_word: וַתַּעֲשִׂי לָךְ
  choice: fez para si
  rationale: Representa de modo natural o segundo verbo e repete o valor benefactivo do pronome, como no hebraico.
- source_word: בְּכָל
  choice: em cada
  rationale: Expressa a força distributiva da construção hebraica, indicando a presença dessas estruturas por todos os espaços públicos.
theological_decisions:
- issue: Se os termos arquitetônicos devem receber linguagem sexual ou de prostituição cultual no texto principal
  choice: 'Conservar linguagem arquitetônica relativamente literal: “elevação” e “lugar alto”.'
  alternative: Traduzir גֶּב como “bordel”, “câmara abobadada” ou “santuário de prostituição”.
  rationale: O contexto de Ezequiel 16 associa idolatria e prostituição, mas o substantivo גֶּב é lexicalmente raro e incerto. Tornar a referência sexual explícita no texto principal resolveria uma ambiguidade que o hebraico preserva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Elevação” evita o pouco natural “montículo construído” e conserva a incerteza lexical; “lugar alto” mantém a terminologia cultual bíblica amplamente reconhecível.
