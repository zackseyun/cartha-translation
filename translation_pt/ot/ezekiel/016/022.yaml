  text: וְ/אֵ֤ת כָּל תּוֹעֲבֹתַ֨יִ/ךְ֙ וְ/תַזְנֻתַ֔יִ/ךְ לֹ֥א זכרתי אֶת יְמֵ֣י נְעוּרָ֑יִ/ךְ בִּֽ/הְיוֹתֵ/ךְ֙ עֵרֹ֣ם וְ/עֶרְיָ֔ה מִתְבּוֹסֶ֥סֶת בְּ/דָמֵ֖/ךְ הָיִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/022.yaml
  text: And in all your abominations and your prostitutions[a], you did not remember the days of your youth, when you were naked and bare[c][b], wallowing in your blood.
translation:
  language: pt
  text: E, em meio a todas as suas abominações e prostituições[a], você não se lembrou dos dias da sua juventude, quando estava nua e descoberta[b], debatendo-se no seu sangue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atos de prostituição”. No hebraico, a imagem da prostituição representa a infidelidade de Jerusalém à aliança, especialmente por sua idolatria.
    reason: lexical_alternative
  - marker: b
    text: Ou “nua e exposta”.
    reason: lexical_alternative
  - marker: c
    text: Ou “revolvendo-se no seu sangue” ou “agitando-se no seu sangue”. O verbo hebraico retrata uma condição indefesa, com o corpo coberto de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבֹתַיִךְ
  choice: suas abominações
  rationale: Preserva a severidade profética e o sentido cultual e moral de atos detestáveis, sem suavizar a acusação.
- source_word: תַזְנֻתַיִךְ
  choice: suas prostituições
  rationale: Mantém a metáfora sexual concreta e o plural hebraico para a infidelidade pactual e idolátrica de Jerusalém.
- source_word: לֹא זכרתי
  choice: você não se lembrou
  rationale: Representa diretamente o perfeito qal na segunda pessoa feminina com a negação לֹא.
- source_word: יְמֵי נְעוּרָיִךְ
  choice: os dias da sua juventude
  rationale: É uma formulação portuguesa natural e próxima da construção hebraica.
- source_word: עֵרֹם וְעֶרְיָה
  choice: nua e descoberta
  rationale: Conserva a duplicação enfática dos termos e comunica tanto nudez como exposição e vulnerabilidade.
- source_word: מִתְבּוֹסֶסֶת בְּדָמֵךְ
  choice: debatendo-se no seu sangue
  rationale: Expressa a ação reiterada ou reflexiva de uma criança indefesa que se agita coberta de sangue, sem sugerir deleite voluntário.
- source_word: הָיִית
  choice: estava
  rationale: Em português, o imperfeito descreve naturalmente a condição contínua dentro da oração temporal.
- source_word: וְאֵת כָּל ... וְ...
  choice: E, em meio a todas ... e ...
  rationale: A sintaxe inicial é elíptica; “em meio a” preserva a ideia circunstancial sem impor a leitura concessiva “apesar de”.
theological_decisions:
- issue: Metáfora sexual profética para a infidelidade à aliança
  choice: prostituições
  alternative: infidelidades; idolatria
  rationale: O texto emprega deliberadamente uma imagem sexual forte. Substituí-la por um termo teológico abstrato reduziria a força da denúncia e resolveria interpretativamente a metáfora.
- issue: Relação sintática da frase inicial com a falta de memória
  choice: em meio a
  alternative: apesar de; com todas
  rationale: O hebraico é elíptico e admite mais de uma maneira de explicitar a relação. A tradução escolhida conserva a circunstância sem transformar a frase inequivocamente em concessiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O feminino singular foi mantido porque a cidade de Jerusalém é personificada como mulher. A ordem dos marcadores foi regularizada para acompanhar as expressões correspondentes no texto.
