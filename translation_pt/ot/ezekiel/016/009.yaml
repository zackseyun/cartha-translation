base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/009.yaml
  text: Then I washed you with water[a], rinsed your blood off you[b], and anointed you with oil.
translation:
  language: pt
  text: Então lavei você com água[a], enxaguei o sangue que estava sobre você[b] e ungi você com óleo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “banhei você com água”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “enxaguei de sobre você o seu sangue”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְחָצֵךְ
  choice: lavei você
  rationale: רחץ significa lavar ou banhar. “Lavei você” é natural em português, mantém o objeto direto e preserva a imagem concreta de cuidado e purificação.
- source_word: בַּמַּיִם
  choice: com água
  rationale: A preposição ב pode indicar meio ou esfera. “Com água” expressa naturalmente o meio empregado na lavagem; “na água” continua possível.
- source_word: וָאֶשְׁטֹף
  choice: enxaguei
  rationale: שטף pode descrever lavar ou enxaguar algo para removê-lo. “Enxaguei” distingue esta ação da lavagem anterior e comunica a retirada do sangue sem intensificar o verbo.
- source_word: דָּמַיִךְ
  choice: o seu sangue
  rationale: Embora a forma hebraica seja plural, דמים frequentemente designa sangue. A tradução direta evita interpretar a expressão como “manchas de sangue”.
- source_word: מֵעָלָיִךְ
  choice: de você
  rationale: A expressão significa literalmente “de sobre você”. Depois de “enxaguei”, “de você” comunica de modo corrente que o sangue foi removido do corpo, enquanto a nota conserva a formulação espacial.
- source_word: וָאֲסֻכֵךְ
  choice: ungi você
  rationale: סוך denota aplicar óleo, ungir ou untar. “Ungi” preserva tanto a ação corporal de cuidado quanto a dignidade do gesto, sem determinar uma função ritual.
- source_word: בַּשָּׁמֶן
  choice: com óleo
  rationale: שמן significa “óleo”; não há base textual suficiente para especificar “azeite” ou “óleo de oliva” no texto principal.
theological_decisions:
- issue: Natureza da imagem de purificação na alegoria
  choice: Traduzir as ações como cuidados corporais concretos dentro da alegoria.
  alternative: Explicitar no texto principal sentidos sacramentais, cultuais ou pactuais.
  rationale: O versículo descreve lavar, remover o sangue e ungir. A tradução preserva essas ações e deixa que suas implicações teológicas surjam do contexto mais amplo, sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “você” explicita o objeto feminino singular do hebraico sem recorrer a formas marcadamente regionais; o gênero é fornecido pelo contexto da alegoria. A coordenação verbal conserva a sequência enfática das ações divinas.
