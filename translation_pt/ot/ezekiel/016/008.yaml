  text: וָ/אֶעֱבֹ֨ר עָלַ֜יִ/ךְ וָ/אֶרְאֵ֗/ךְ וְ/הִנֵּ֤ה עִתֵּ/ךְ֙ עֵ֣ת דֹּדִ֔ים וָ/אֶפְרֹ֤שׂ כְּנָפִ/י֙ עָלַ֔יִ/ךְ וָ/אֲכַסֶּ֖ה עֶרְוָתֵ֑/ךְ וָ/אֶשָּׁ֣בַֽע לָ֠/ךְ וָ/אָב֨וֹא בִ/בְרִ֜ית אֹתָ֗/ךְ נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה וַ/תִּ֥הְיִי לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/008.yaml
  text: When I passed by you and saw you[a], behold, your time was the time for love. So I spread the edge of my garment over you and covered your nakedness. I swore myself to you and entered into a covenant with you, declares the Lord GOD[b], and you became mine.
translation:
  language: pt
  text: Quando passei por você e a vi, eis que o seu tempo era o tempo do amor.[a] Então estendi sobre você a aba do meu manto[b] e cobri a sua nudez. Fiz um juramento a você e entrei em aliança com você — declara o Senhor Yahweh —, e você se tornou minha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O tempo do amor” também pode ser traduzido como “o tempo das carícias” ou “o tempo de fazer amor”. O hebraico tem conotações românticas e eróticas dentro da metáfora matrimonial.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “estendi a minha asa sobre você”. A palavra hebraica também pode indicar a extremidade ou aba de uma veste; aqui, o gesto evoca proteção e reivindicação matrimonial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ וָאֶרְאֵךְ
  choice: Quando passei junto de você e a vi
  rationale: Traduz diretamente os verbos comuns “passar” e “ver”, mantendo os sufixos femininos no pronome “a”. Não acrescenta “de novo”, ideia possível no contexto, mas não expressa no hebraico.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a função de chamar vividamente a atenção, em registro elevado, mas compreensível.
- source_word: עִתֵּךְ עֵת דֹּדִים
  choice: o seu tempo era o tempo do amor
  rationale: Mantém a repetição enfática de עֵת e preserva a amplitude de דֹּדִים, que inclui amor, carícias e conotações eróticas no contexto matrimonial.
- source_word: וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ
  choice: estendi sobre você a aba da minha veste
  rationale: כָּנָף significa literalmente “asa” e também a extremidade de uma roupa. “A aba da minha veste” torna compreensível o gesto matrimonial de proteção e reivindicação, enquanto a imagem literal é registrada em nota.
- source_word: וָאֲכַסֶּה עֶרְוָתֵךְ
  choice: cobri a sua nudez
  rationale: Representa diretamente עֶרְוָה, sem suavizar sua dimensão corporal nem convertê-la interpretativamente em “vergonha”.
- source_word: וָאֶשָּׁבַע לָךְ
  choice: Fiz um juramento a você
  rationale: Expressa naturalmente em português o ato de jurar a alguém. O contexto confere ao juramento caráter matrimonial, sem que seja necessário acrescentar um objeto não explícito.
- source_word: וָאָבוֹא בִבְרִית אֹתָךְ
  choice: entrei em aliança com você
  rationale: Equivalente direto e idiomático da expressão hebraica “entrar em aliança”, preservando sua formalidade pactuai.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética de declaração; אֲדֹנָי é traduzido por “Senhor”, e o nome da aliança יהוה é representado como “Yahweh”.
- source_word: וַתִּהְיִי לִי
  choice: e você se tornou minha
  rationale: Preserva a formulação concisa de pertencimento, literalmente “você se tornou para mim”, sem explicitar “esposa”, que é sugerido pela metáfora, mas não declarado.
theological_decisions:
- issue: Imagem matrimonial da aliança e linguagem erótica
  choice: 'Manter a metáfora matrimonial com linguagem discreta, mas concreta: “tempo do amor”, “cobri a sua nudez” e “entrei em aliança”.'
  alternative: Suavizar a dimensão erótica ou explicitá-la como “tempo de fazer amor”.
  rationale: O hebraico une maturidade amorosa, gesto matrimonial, juramento, aliança e pertencimento. A tradução não deve apagar essa tensão nem torná-la mais explícita do que o texto.
- issue: Sentido de כָּנָף no gesto matrimonial
  choice: Traduzir no texto como “aba da minha veste” e registrar “asa” em nota.
  alternative: Traduzir literalmente como “minha asa”.
  rationale: As duas acepções são lexicalmente reais. No contexto, a extremidade da veste comunica com maior clareza o gesto simbólico, enquanto a nota conserva a imagem hebraica e sua ambiguidade.
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR / Senhor DEUS
  rationale: Distingue o título אֲדֹנָי do nome pessoal יהוה e preserva explicitamente o nome da aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” mantém naturalidade e deixa claro o referente feminino por meio de “a vi” e “minha”. “Eis que” conserva o relevo retórico do hebraico sem tornar todo o versículo arcaico.
