id: EZK.16.19
reference: Ezekiel 16:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לַחְמִ/י֩ אֲשֶׁר נָתַ֨תִּי לָ֜/ךְ סֹ֣לֶת וָ/שֶׁ֤מֶן וּ/דְבַשׁ֙ הֶֽאֱכַלְתִּ֔י/ךְ וּ/נְתַתִּ֧י/הוּ לִ/פְנֵי/הֶ֛ם לְ/רֵ֥יחַ נִיחֹ֖חַ וַ/יֶּ֑הִי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/019.yaml
  text: And my bread that I gave you—fine flour[a], oil, and honey with which I fed you—you set before them as a pleasing aroma, and so it was[c][b], declares the Lord GOD.
translation:
  language: pt
  text: E o meu pão que lhe dei — farinha fina[a], óleo e mel, com os quais eu a alimentei — você o colocou diante deles como aroma agradável[b]. E assim foi, declara o Senhor Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu alimento que lhe dei”. Em hebraico, “pão” também pode designar alimento de modo mais amplo.
    reason: lexical_alternative
  - marker: b
    text: “Aroma agradável” é linguagem típica de sacrifícios; aqui ela é usada ironicamente para aquilo que foi oferecido diante dos ídolos.
    reason: cultural_note
  - marker: c
    text: “Senhor Yahweh” traduz אֲדֹנָי יְהוִה, unindo o título “Senhor” ao nome divino Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמִי
  choice: o meu pão
  rationale: Preserva a imagem concreta de לֶחֶם, embora o termo também possa designar alimento em sentido mais amplo; os itens seguintes especificam a provisão.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente corrente para farinha refinada de boa qualidade, mantendo também a ressonância do uso em ofertas.
- source_word: שֶׁמֶן
  choice: óleo
  rationale: O hebraico não especifica que seja azeite de oliva; a tradução evita acrescentar essa identificação provável, mas não explícita.
- source_word: דְבַשׁ
  choice: mel
  rationale: É o sentido usual do termo e mantém a imagem alimentar sem decidir se, neste contexto, poderia incluir algum tipo de xarope doce.
- source_word: הֶאֱכַלְתִּיךְ
  choice: eu a alimentei
  rationale: Expressa naturalmente em português o causativo hebraico, literalmente 'fiz você comer', e mantém o referente feminino, Jerusalém personificada.
- source_word: וּנְתַתִּיהוּ
  choice: você o colocou
  rationale: O contexto indica que Jerusalém tomou o alimento recebido de Deus e o pôs diante dos ídolos; 'colocou' comunica de modo natural o ato de apresentá-lo como oferta.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Mantém o pronome masculino plural do hebraico e sua referência contextual aos ídolos mencionados anteriormente, sem explicitá-la no corpo do versículo.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: Conserva a fórmula sacrificial e sua ironia amarga quando aplicada aqui a ofertas apresentadas a ídolos.
- source_word: וַיֶּהִי
  choice: E assim foi
  rationale: Mantém a confirmação breve e enfática da acusação, em português natural.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Traduz נְאֻם como fórmula profética, distingue אֲדֹנָי como 'Senhor' e representa diretamente o nome divino יהוה como 'Yahweh'.
theological_decisions:
- issue: Representação do nome divino יהוה na fórmula אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A escolha preserva tanto o título אֲדֹנָי quanto o nome pessoal da aliança יהוה, evitando que os dois elementos sejam fundidos ou que o nome seja ocultado por um título.
- issue: Linguagem sacrificial aplicada à idolatria
  choice: como aroma agradável
  alternative: como aroma suave
  rationale: A expressão cultual é mantida sem explicar sua ironia no texto principal; a nota informa o uso sacrificial e deixa intacta a força teológica da acusação.
- issue: Identidade dos destinatários da oferta
  choice: diante deles
  alternative: diante dos ídolos
  rationale: O pronome ambíguo do versículo é preservado, enquanto o contexto anterior permite identificar seu referente sem inserção interpretativa no texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O tratamento por “você” torna natural a acusação dirigida a Jerusalém personificada; os pronomes “lhe” e “a” preservam o referente feminino. Os travessões organizam a longa construção sem desfazer sua estrutura enfática.
