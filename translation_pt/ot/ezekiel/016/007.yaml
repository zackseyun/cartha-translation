  text: רְבָבָ֗ה כְּ/צֶ֤מַח הַ/שָּׂדֶה֙ נְתַתִּ֔י/ךְ וַ/תִּרְבִּי֙ וַֽ/תִּגְדְּלִ֔י וַ/תָּבֹ֖אִי בַּ/עֲדִ֣י עֲדָיִ֑ים שָׁדַ֤יִם נָכֹ֨נוּ֙ וּ/שְׂעָרֵ֣/ךְ צִמֵּ֔חַ וְ/אַ֖תְּ עֵרֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/007.yaml
  text: I made you countless like the growth of the field[a], and you multiplied and grew up and came to full adornment. Your breasts were formed and your hair had grown[d][c][b], yet you were naked and bare.
translation:
  language: pt
  text: Eu fiz você tão numerosa quanto a vegetação do campo.[a] Você se multiplicou, cresceu e chegou à plena formosura.[b] Seus seios se formaram, e seus pelos cresceram;[c] mas você estava nua e descoberta.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como as plantas do campo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “chegou ao ornamento dos ornamentos”. A expressão pode indicar plena beleza ou maturidade, talvez a idade de usar adornos.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “seu cabelo cresceu”. O termo hebraico pode designar cabelo ou pelos; neste contexto de maturação, provavelmente se refere aos pelos corporais.'
    reason: lexical_alternative
  - marker: d
    text: A expressão dupla “nua e descoberta” intensifica a imagem de total exposição.
    reason: literary_feature
lexical_decisions:
- source_word: רְבָבָה
  choice: em grande número
  rationale: O substantivo expressa grande abundância; a formulação comunica multiplicação sem impor um valor numérico específico.
- source_word: כְּצֶמַח הַשָּׂדֶה
  choice: como a vegetação do campo
  rationale: צֶמַח pode indicar broto, crescimento ou vegetação; a escolha preserva a imagem agrícola e é natural em português.
- source_word: נְתַתִּיךְ
  choice: Eu a fiz crescer
  rationale: 'Embora נתן tenha o sentido básico de ''dar/pôr'', com רְבָבָה a construção é causativa: Deus fez a menina personificada tornar-se numerosa e crescer.'
- source_word: וַתִּרְבִּי וַתִּגְדְּלִי
  choice: Você cresceu, desenvolveu-se
  rationale: Os verbos descrevem aumento e maturação; a combinação portuguesa mantém a progressão sem a repetição pouco natural de 'crescer'.
- source_word: וַתָּבֹאִי בַּעֲדִי עֲדָיִים
  choice: chegou à plena formosura
  rationale: A expressão hebraica, literalmente associada a 'ornamento de ornamentos', é difícil. A tradução indica beleza madura sem especificar casamento ou outra interpretação debatida.
- source_word: שָׁדַיִם נָכֹנוּ
  choice: Seus seios se formaram
  rationale: O nifal de כון pode significar estabelecer-se ou formar-se; no contexto, descreve o desenvolvimento corporal da puberdade.
- source_word: וּשְׂעָרֵךְ צִמֵּחַ
  choice: seus pelos cresceram
  rationale: No contexto explícito de maturação sexual, שֵׂעָר provavelmente se refere aos pelos corporais ou pubianos, e não apenas ao cabelo da cabeça; 'pelos' preserva essa referência sem explicitação adicional.
- source_word: עֵרֹם וְעֶרְיָה
  choice: nua e descoberta
  rationale: A dupla expressão intensifica a nudez e a exposição; dois termos foram mantidos em português.
theological_decisions:
- issue: Sentido de בַּעֲדִי עֲדָיִים na metáfora da maturação
  choice: plena formosura
  alternative: pleno adorno; idade dos adornos; maturidade nupcial ou sexual
  rationale: O texto personifica Jerusalém como uma menina que chega à maturidade, mas a expressão idiomática é incerta. A redação conserva a noção de beleza madura sem transformar uma possibilidade nupcial ou fisiológica em afirmação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância feminina adequada à personificação de Jerusalém. Evitou-se tanto linguagem arcaica quanto explicitação sexual além do que o contexto sustenta.
