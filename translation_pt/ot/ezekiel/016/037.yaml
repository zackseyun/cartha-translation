  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ֠/כֵן הִנְ/נִ֨י מְקַבֵּ֤ץ אֶת כָּל מְאַהֲבַ֨יִ/ךְ֙ אֲשֶׁ֣ר עָרַ֣בְתְּ עֲלֵי/הֶ֔ם וְ/אֵת֙ כָּל אֲשֶׁ֣ר אָהַ֔בְתְּ עַ֖ל כָּל אֲשֶׁ֣ר שָׂנֵ֑את וְ/קִבַּצְתִּי֩ אֹתָ֨/ם עָלַ֜יִ/ךְ מִ/סָּבִ֗יב וְ/גִלֵּיתִ֤י עֶרְוָתֵ/ךְ֙ אֲלֵ/הֶ֔ם וְ/רָא֖וּ אֶת כָּל עֶרְוָתֵֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/037.yaml
  text: Therefore[a], behold, I am gathering all your lovers with whom you found pleasure, and all whom you loved, along with all whom you hated; and I will gather them against you from every side, and I will uncover your nakedness to them[c][b], and they will see all your nakedness.
translation:
  language: pt
  text: Por isso, eis que estou reunindo todos os seus amantes com quem você sentiu prazer[a], todos aqueles que você amou, junto com todos aqueles que odiou[b]. Eu os reunirei contra você, de todos os lados, e exporei a sua nudez diante deles[c]; e eles verão toda a sua nudez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em quem você se deleitou”. O verbo hebraico pode indicar sentir prazer ou deleite.'
    reason: lexical_alternative
  - marker: b
    text: Assim, são incluídos tanto os parceiros ilícitos de Jerusalém quanto aqueles a quem ela tratou como inimigos; todos são convocados para o seu julgamento.
    reason: cultural_note
  - marker: c
    text: “Expor a nudez” é linguagem profética de vergonha, indicando exposição e humilhação públicas.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência judicial da acusação anterior com clareza e força profética em português atual.
- source_word: הִנְנִי מְקַבֵּץ
  choice: eis que estou reunindo
  rationale: A construção com הִנְנִי e o particípio realça a ação como iminente e certa; “eis que” conserva a solenidade do anúncio profético.
- source_word: מְאַהֲבַיִךְ
  choice: seus amantes
  rationale: Mantém a metáfora sexual e conjugal explícita do capítulo, em vez de reduzi-la a alianças políticas.
- source_word: אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם
  choice: com quem você sentiu prazer
  rationale: ערב, neste contexto, expressa prazer ou deleite; a formulação preserva a dimensão relacional e sexual da imagem.
- source_word: וְאֵת כָּל אֲשֶׁר אָהַבְתְּ
  choice: todos aqueles que você amou
  rationale: Tradução direta que mantém o objeto pessoal e o paralelismo da enumeração.
- source_word: עַל כָּל אֲשֶׁר שָׂנֵאת
  choice: junto com todos aqueles que odiou
  rationale: Neste contexto, עַל amplia o conjunto para incluir também os odiados, sem apagar a tensão entre amados e odiados.
- source_word: וְקִבַּצְתִּי אֹתָם עָלַיִךְ מִסָּבִיב
  choice: Eu os reunirei contra você, de todos os lados
  rationale: No contexto de juízo, עָלַיִךְ tem sentido adversativo; מִסָּבִיב indica cerco ou convergência de todas as direções.
- source_word: וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם
  choice: exporei a sua nudez diante deles
  rationale: “Exporei” comunica naturalmente o ato de tornar pública a nudez, enquanto “diante deles” expressa a presença dos observadores sem alterar a imagem hebraica.
- source_word: וְרָאוּ אֶת כָּל עֶרְוָתֵךְ
  choice: e eles verão toda a sua nudez
  rationale: Conserva a repetição enfática de עֶרְוָה e a linguagem concreta de vergonha pública.
theological_decisions:
- issue: Metáfora profética sexual e de vergonha no juízo contra Jerusalém
  choice: Manter a linguagem concreta de “amantes” e “nudez”.
  alternative: Substituir a imagem por termos abstratos como “aliados”, “parceiros”, “vergonha” ou “desgraça”.
  rationale: O capítulo usa deliberadamente imagens conjugais e sexuais para retratar infidelidade à aliança e juízo público. Preservar a metáfora mantém a força retórica e teológica do texto sem impor uma explicação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna explícito que Jerusalém é interpelada como figura feminina, enquanto “eis que” preserva o tom solene do anúncio profético. A repetição de “nudez” foi mantida por sua força retórica.
