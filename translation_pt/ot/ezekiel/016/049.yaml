source:
  edition: WLC
  text: הִנֵּה זֶ֣ה הָיָ֔ה עֲוֺ֖ן סְדֹ֣ם אֲחוֹתֵ֑/ךְ גָּא֨וֹן שִׂבְעַת לֶ֜חֶם וְ/שַׁלְוַ֣ת הַשְׁקֵ֗ט הָ֤יָה לָ/הּ֙ וְ/לִ/בְנוֹתֶ֔י/הָ וְ/יַד עָנִ֥י וְ/אֶבְי֖וֹן לֹ֥א הֶחֱזִֽיקָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
translation:
  language: pt
  text: 'Veja: este foi o pecado de sua irmã Sodoma: ela e suas filhas[a] tinham orgulho, fartura de pão e tranquilidade despreocupada, mas ela não amparou o pobre e o necessitado[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Suas filhas” refere-se às cidades ou povoações ligadas a Sodoma.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “não fortaleceu a mão do pobre e do necessitado”, expressão que significa não lhes dar apoio ou ajuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה זֶה
  choice: 'Veja: este foi'
  rationale: “Veja” transmite com naturalidade a força enfática de הִנֵּה, e “este foi” introduz a explicação que segue.
- source_word: עֲוֺן
  choice: pecado
  rationale: O termo pode indicar iniquidade, culpa ou o ato culpável; “pecado” é claro e natural aqui como introdução à lista de transgressões.
- source_word: אֲחוֹתֵךְ
  choice: sua irmã
  rationale: Preserva a metáfora familiar explícita e importante na comparação profética de Ezequiel.
- source_word: גָּאוֹן
  choice: orgulho
  rationale: No contexto moral negativo, o substantivo designa soberba ou arrogância; “orgulho” é direto e corrente.
- source_word: שִׂבְעַת לֶחֶם
  choice: fartura de pão
  rationale: Conserva a imagem concreta de “pão” e expressa idiomaticamente a ideia de plenitude ou abundância.
- source_word: שַׁלְוַת הַשְׁקֵט
  choice: tranquilidade despreocupada
  rationale: A expressão combina bem-estar tranquilo com ausência de inquietação, sugerindo conforto complacente sem acrescentar explicitamente uma ideia de prosperidade já presente na fartura de pão.
- source_word: בְנוֹתֶיהָ
  choice: suas filhas
  rationale: Mantém a metáfora urbana do hebraico; uma nota esclarece que se trata das localidades associadas a Sodoma.
- source_word: הָיָה לָהּ וְלִבְנוֹתֶיהָ
  choice: havia nela e em suas filhas
  rationale: Reproduz a construção existencial/possessiva do hebraico em português natural, indicando que essas condições caracterizavam Sodoma e suas localidades dependentes.
- source_word: יָד ... לֹא הֶחֱזִיקָה
  choice: não amparou
  rationale: Traduz naturalmente o sentido do idioma hebraico “não fortaleceu a mão”, isto é, não sustentou nem ajudou, enquanto a nota preserva a imagem literal.
- source_word: עָנִי וְאֶבְיוֹן
  choice: o pobre e o necessitado
  rationale: Equivalente claro e tradicional para a dupla que designa pessoas materialmente vulneráveis e socialmente desamparadas.
theological_decisions:
- issue: Natureza do pecado de Sodoma neste versículo
  choice: 'Apresentar os pecados sociais e morais explicitamente enumerados: orgulho, abundância, vida despreocupada e omissão diante dos vulneráveis.'
  alternative: Redigir o versículo de modo a insinuar prioritariamente pecado sexual.
  rationale: O hebraico deste versículo nomeia expressamente esses pecados. A tradução não deve restringir nem ampliar a lista com debates interpretativos posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora “sua irmã” e a imagem “fartura de pão” foram preservadas; o idioma menos transparente sobre fortalecer a mão foi vertido no corpo do texto e explicado em nota.
