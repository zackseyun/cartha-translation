id: EZK.16.3
reference: Ezekiel 16:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֨ר אֲדֹנָ֤/י יְהוִה֙ לִ/יר֣וּשָׁלִַ֔ם מְכֹרֹתַ֨יִ/ךְ֙ וּ/מֹ֣לְדֹתַ֔יִ/ךְ מֵ/אֶ֖רֶץ הַֽ/כְּנַעֲנִ֑י אָבִ֥י/ךְ הָ/אֱמֹרִ֖י וְ/אִמֵּ֥/ךְ חִתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
translation:
  language: pt
  text: 'e diga: “Assim diz o Senhor Yahweh a Jerusalém: Sua origem e seu nascimento vêm da terra dos cananeus[a]; seu pai era amorreu, e sua mãe, hitita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais fluente, “da terra de Canaã”. O hebraico diz mais literalmente “da terra do cananeu”, com ênfase étnica.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  choice: 'e diga: “Assim diz'
  rationale: O imperativo introduz a mensagem profética, e o presente em “Assim diz” preserva em português a fórmula do mensageiro.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: “Senhor” traduz אֲדֹנָי, enquanto “Yahweh” representa distintamente o nome divino יהוה, evitando a repetição artificial “Senhor SENHOR”.
- source_word: לִירוּשָׁלִַם
  choice: a Jerusalém
  rationale: A preposição לְ indica a destinatária da declaração; em português, o verbo “dizer” admite naturalmente essa construção.
- source_word: מְכֹרֹתַיִךְ וּמוֹלְדֹתַיִךְ
  choice: Sua origem e seu nascimento
  rationale: Os termos paralelos apontam para a procedência e o nascimento figurativos de Jerusalém. A formulação é clara e natural, sem transformar a metáfora em explicação.
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  choice: da terra dos cananeus
  rationale: O gentílico hebraico singular tem valor coletivo. O plural português preserva a ênfase étnica e soa mais natural do que “da terra do cananeu”.
- source_word: אָבִיךְ הָאֱמֹרִי
  choice: seu pai era amorreu
  rationale: A oração nominal hebraica requer em português a cópula “era”; o gentílico é mantido como predicativo, preservando a acusação metafórica.
- source_word: וְאִמֵּךְ חִתִּית
  choice: e sua mãe, hitita
  rationale: A elipse de “era” produz uma coordenação portuguesa fluente e conserva o paralelismo com a oração anterior.
theological_decisions:
- issue: Ascendência figurativa de Jerusalém
  choice: Manter a linguagem genealógica como acusação metafórica, sem explicá-la no texto principal.
  alternative: Explicitar “sua ascendência era cananeia” ou interpretar a filiação como semelhança moral ou espiritual.
  rationale: O texto apresenta diretamente a chocante imagem familiar. Explicá-la ou restringi-la no corpo da tradução resolveria uma tensão que o próprio versículo deixa implícita.
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha distingue o título אֲדֹנָי do nome יהוה e preserva a presença explícita do nome divino no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura profética e a metáfora contundente foram preservadas; a flexão feminina do discurso dirigido a Jerusalém é indicada pelos possessivos no contexto.
