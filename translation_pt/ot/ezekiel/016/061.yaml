  text: וְ/זָכַ֣רְתְּ אֶת דְּרָכַיִ/ךְ֮ וְ/נִכְלַמְתְּ֒ בְּ/קַחְתֵּ֗/ךְ אֶת אֲחוֹתַ֨יִ/ךְ֙ הַ/גְּדֹל֣וֹת מִמֵּ֔/ךְ אֶל הַ/קְּטַנּ֖וֹת מִמֵּ֑/ךְ וְ/נָתַתִּ֨י אֶתְ/הֶ֥ן לָ֛/ךְ לְ/בָנ֖וֹת וְ/לֹ֥א מִ/בְּרִיתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/061.yaml
  text: Then you will remember your ways and be ashamed when you receive your sisters[a], those older than you along with those younger than you; and I will give them to you as daughters[b], but not because of your covenant.
translation:
  language: pt
  text: Então você se lembrará dos seus caminhos e ficará envergonhada quando receber suas irmãs[a], tanto as mais velhas quanto as mais novas do que você; eu as darei a você como filhas, mas não por causa da sua aliança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando tomar suas irmãs, as mais velhas e as mais novas do que você”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “não por causa da sua aliança” nega que essa dádiva proceda da aliança atribuída a Jerusalém.
    reason: cross_reference
lexical_decisions:
- source_word: וְזָכַרְתְּ
  choice: Então você se lembrará
  rationale: O perfeito com waw, no contexto profético, tem sentido futuro e consequencial. “Então” explicita naturalmente a relação com a restauração anunciada antes.
- source_word: דְּרָכַיִךְ
  choice: dos seus caminhos
  rationale: Preserva a metáfora hebraica de “caminhos” para a conduta moral, corrente e compreensível em português bíblico moderno.
- source_word: וְנִכְלַמְתְּ
  choice: e ficará envergonhada
  rationale: נכלם expressa vergonha ou humilhação. O feminino mantém a personificação de Jerusalém, destinatária do discurso.
- source_word: בְּקַחְתֵּךְ
  choice: quando receber
  rationale: A construção com ב e infinitivo pode ser temporal. “Receber” cabe ao contexto de restauração e relação, sem eliminar a alternativa mais literal “tomar”.
- source_word: אֲחוֹתַיִךְ
  choice: suas irmãs
  rationale: Mantém a linguagem familiar essencial à alegoria de Jerusalém, Samaria e Sodoma.
- source_word: הַגְּדֹלוֹת מִמֵּךְ אֶל הַקְּטַנּוֹת מִמֵּךְ
  choice: tanto as mais velhas quanto as mais novas do que você
  rationale: No quadro metafórico de irmãs, “maiores” e “menores” designam naturalmente as mais velhas e as mais novas; a correlação “tanto... quanto...” reúne os dois grupos com clareza.
- source_word: וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  choice: eu as darei a você como filhas
  rationale: “Como filhas” reproduz de modo natural a relação figurada indicada por לְבָנוֹת.
- source_word: וְלֹא מִבְּרִיתֵךְ
  choice: mas não por causa da sua aliança
  rationale: A preposição מִן pode indicar origem ou fundamento. A formulação nega que a dádiva proceda da aliança de Jerusalém, preservando a tensão sem especificar além do texto.
theological_decisions:
- issue: Sentido de “sua aliança” na cláusula final
  choice: A entrega das irmãs como filhas não ocorre por causa da aliança de Jerusalém.
  alternative: “mas não por meio da sua aliança” ou “mas não da sua aliança”
  rationale: A tradução conserva a negação de que essa restauração tenha sua origem ou fundamento na aliança atribuída a Jerusalém, sem definir um sistema teológico nem decidir com maior precisão a natureza dessa aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O feminino em “envergonhada” preserva Jerusalém como mulher personificada. Mantiveram-se as imagens familiares e a ambiguidade relativa ao fundamento expresso por מִן.
