  text: וּ/מוֹלְדוֹתַ֗יִ/ךְ בְּ/י֨וֹם הוּלֶּ֤דֶת אֹתָ/ךְ֙ לֹֽא כָרַּ֣ת שָׁרֵּ֔/ךְ וּ/בְ/מַ֥יִם לֹֽא רֻחַ֖צְתְּ לְ/מִשְׁעִ֑י וְ/הָמְלֵ֨חַ֙ לֹ֣א הֻמְלַ֔חַתְּ וְ/הָחְתֵּ֖ל לֹ֥א חֻתָּֽלְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/004.yaml
  text: And as for your birth[a], on the day you were born your cord was not cut, and you were not washed with water for cleansing; you were not rubbed with salt[c][b], and you were not wrapped in cloths.
translation:
  language: pt
  text: Quanto ao seu nascimento, no dia em que você nasceu, não cortaram o seu cordão umbilical; você não foi lavada com água para limpá-la[a], nem esfregada com sal[b], nem envolta em faixas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para esfregá-la até ficar limpa” ou “para alisar sua pele”. O termo hebraico é raro, e seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Referência a uma antiga prática de cuidado neonatal, na qual o recém-nascido era esfregado com sal.
    reason: cultural_note
lexical_decisions:
- source_word: מוֹלְדוֹתַיִךְ
  choice: seu nascimento
  rationale: Embora a forma hebraica seja plural, ela funciona idiomaticamente para as circunstâncias do nascimento; o singular é natural em português e combina com a frase seguinte.
- source_word: בְּיוֹם הוּלֶּדֶת אֹתָךְ
  choice: no dia em que você nasceu
  rationale: Expressa de modo claro e corrente a oração temporal hebraica.
- source_word: שָׁרֵךְ
  choice: seu cordão umbilical
  rationale: Explicita o referente neonatal do termo hebraico sem depender apenas do contexto.
- source_word: לֹא כָרַּת שָׁרֵּךְ
  choice: não cortaram o seu cordão umbilical
  rationale: A construção impessoal com a terceira pessoa do plural é natural em português e preserva a falta de um agente expresso no hebraico.
- source_word: וּבְמַיִם לֹא רֻחַצְתְּ
  choice: você não foi lavada com água
  rationale: Mantém a imagem concreta do cuidado pós-natal e a forma feminina dirigida à Jerusalém personificada.
- source_word: לְמִשְׁעִי
  choice: para limpá-la
  rationale: Comunica o provável propósito da lavagem em português natural, enquanto a nota preserva a incerteza causada pela raridade do termo.
- source_word: וְהָמְלֵחַ לֹא הֻמְלַחַתְּ
  choice: nem esfregada com sal
  rationale: Torna compreensível a antiga prática neonatal e evita a possível conotação culinária de 'salgada'.
- source_word: וְהָחְתֵּל לֹא חֻתָּלְתְּ
  choice: nem envolta em faixas
  rationale: Expressa de maneira acessível a ação de envolver firmemente o recém-nascido em panos ou faixas.
