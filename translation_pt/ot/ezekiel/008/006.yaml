  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/רֹאֶ֥ה אַתָּ֖ה מ/הם עֹשִׂ֑ים תּוֹעֵב֨וֹת גְּדֹל֜וֹת אֲשֶׁ֥ר בֵּֽית יִשְׂרָאֵ֣ל עֹשִׂ֣ים פֹּ֗ה לְ/רָֽחֳקָה֙ מֵ/עַ֣ל מִקְדָּשִׁ֔/י וְ/עוֹד֙ תָּשׁ֣וּב תִּרְאֶ֔ה תּוֹעֵב֖וֹת גְּדֹלֽוֹת־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/006.yaml
  text: And he said to me[a], “Son of man, do you see what they are doing, the great abominations that the house of Israel is doing here[b], to drive me far from my sanctuary? Yet you will see even greater abominations.”
translation:
  language: pt
  text: 'Ele me disse: “Filho do homem, você vê o que eles estão fazendo — as grandes abominações que a casa de Israel pratica aqui, para me afastar do meu santuário[a]? Mas você ainda verá abominações maiores[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para me fazerem ficar longe do meu santuário”; possivelmente, “longe do meu santuário”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete “grandes abominações”; “abominações maiores” expressa a progressão indicada pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma tradicional e recorrente de tratamento dirigida a Ezequiel, mantendo de perto a expressão hebraica.
- source_word: הֲרֹאֶה אַתָּה
  choice: você vê
  rationale: Expressa de modo natural em português a pergunta hebraica formada com particípio e dirigida diretamente ao profeta.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: grandes abominações
  rationale: “Abominações” conserva a forte conotação religiosa, moral e cultual de תּוֹעֵבָה no discurso profético.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a designação coletiva e pactual do hebraico, bem estabelecida em linguagem profética portuguesa.
- source_word: עֹשִׂים
  choice: pratica
  rationale: No contexto de “abominações”, “pratica” evita a repetição pouco natural de “fazendo/faz” e concorda com o coletivo singular “casa de Israel” em português.
- source_word: לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: para me afastar do meu santuário
  rationale: Comunica a leitura causativa segundo a qual essas práticas provocam o afastamento de Deus, sem ampliar a expressão para “expulsar” ou resolver além do necessário a sua ambiguidade.
- source_word: מִקְדָּשִׁי
  choice: meu santuário
  rationale: “Santuário” corresponde mais precisamente a מִקְדָּשׁ do que “templo” e conserva o sufixo de primeira pessoa.
- source_word: וְעוֹד תָּשׁוּב תִּרְאֶה
  choice: Mas você ainda verá
  rationale: Representa naturalmente a continuação e a progressão da visão; “ainda” comunica que outras cenas serão mostradas.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: abominações maiores
  rationale: Embora o hebraico repita literalmente “grandes abominações”, o contexto estabelece progressão; a forma comparativa torna esse movimento claro em português, com nota registrando a repetição formal.
theological_decisions:
- issue: Se לְרָחֳקָה מֵעַל מִקְדָּשִׁי descreve o afastamento de Deus de seu santuário ou outro tipo de distância
  choice: As abominações afastam Deus de seu santuário.
  alternative: A expressão pode ser entendida como “para me fazer ficar longe do meu santuário” ou, possivelmente, apenas “longe do meu santuário”.
  rationale: A referência em primeira pessoa a “meu santuário” e a ideia verbal de produzir distância favorecem o afastamento de Deus, tema coerente com o desenvolvimento de Ezequiel. A nota preserva a dificuldade sintática e as alternativas legítimas.
- issue: Se a segunda ocorrência de תּוֹעֵבוֹת גְּדֹלוֹת deve ser comparativa
  choice: abominações maiores
  alternative: grandes abominações
  rationale: O texto hebraico repete a mesma expressão, mas a fórmula de transição anuncia uma intensificação. A tradução comunica essa progressão, enquanto a nota registra a forma literal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. O pronome “você” torna a interpelação direta natural; o travessão organiza a aposição explicativa sem obscurecer a sintaxe.
