  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֹּ֤א וּ/רְאֵה֙ אֶת הַ/תּוֹעֵב֣וֹת הָ/רָע֔וֹת אֲשֶׁ֛ר הֵ֥ם עֹשִׂ֖ים פֹּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/009.yaml
  text: And he said to me, “Come and see the evil abominations that they are doing here.”
translation:
  language: pt
  text: 'E ele me disse: “Entre e veja as abominações malignas que eles estão cometendo aqui.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא
  choice: Entre
  rationale: No contexto da abertura feita na parede e da entrada na câmara, o imperativo expressa movimento para dentro; “entre” é natural e contextual.
- source_word: הַתּוֹעֵבוֹת הָרָעוֹת
  choice: as abominações malignas
  rationale: Mantém o substantivo forte “abominações” e traduz o adjetivo רָעוֹת sem eliminar sua qualificação moral.
- source_word: עֹשִׂים
  choice: estão cometendo
  rationale: Em português, “cometer abominações” é uma colocação mais natural do que “fazer abominações”, preservando o aspecto da ação em curso.
- source_word: פֹּה
  choice: aqui
  rationale: Equivalente direto do advérbio locativo.
theological_decisions:
- issue: Força moral de הָרָעוֹת ao qualificar “abominações”
  choice: malignas
  alternative: más / perversas
  rationale: “Malignas” preserva a avaliação moral explícita sem acrescentar uma doutrina específica; “más” seria possível, mas soa menos natural junto de “abominações”, e “perversas” intensificaria interpretativamente.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A fala direta e a progressão narrativa do hebraico foram preservadas.
