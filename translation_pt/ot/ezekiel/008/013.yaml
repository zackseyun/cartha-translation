  text: Then he said to me, “You will again see greater abominations that they are doing.”
translation:
  language: pt
  text: 'Então ele me disse: “Você verá novamente grandes abominações que eles estão cometendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: Você ainda verá
  rationale: A combinação de עוֹד com תָּשׁוּב expressa repetição ou continuação; em português natural, “ainda verá” comunica que outras cenas serão mostradas, sem a redundância de “voltará novamente a ver”.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: abominações maiores
  rationale: גְּדֹלוֹת pode significar “grandes” ou, no contexto progressivo das visões, “maiores”. A forma comparativa preserva a intensificação indicada pelo contexto imediato e pela formulação adotada na camada de consulta.
- source_word: עֹשִׂים
  choice: estão cometendo
  rationale: Com “abominações”, o português idiomático usa “cometer”, enquanto o particípio hebraico é adequadamente representado pela ação em curso “estão cometendo”.
theological_decisions:
- issue: Intensificação das abominações
  choice: maiores
  alternative: grandes
  rationale: O hebraico não traz uma forma comparativa explícita, mas adjetivos positivos podem assumir sentido comparativo pelo contexto. A sequência da visão anuncia práticas cada vez mais graves; “maiores” mantém essa progressão sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. O pronome “você” favorece legibilidade contemporânea sem alterar o sentido.
