  source_fidelity: A tradução de עוֹד תָּשׁוּב תִּרְאֶה como “ainda verá” não explicita de modo suficiente a repetição indicada por תָּשׁוּב (“novamente/mais uma vez”). Além disso, גְּדֹלוֹת está formalmente no positivo, “grandes”; embora o contexto das visões possa sugerir intensificação, “maiores” introduz um comparativo que o hebraico deste versículo não expressa explicitamente.
  naturalness: “Você verá novamente grandes abominações que eles estão cometendo” é claro, moderno e natural em português de ampla compreensão, mantendo um registro digno.
  terminology: “Abominações” preserva adequadamente o termo cultual e avaliativo תּוֹעֵבוֹת. “Cometendo” é idiomático com esse objeto e comunica bem o particípio de ação em curso.
  issues:
  - severity: medium
    issue: A repetição expressa por תָּשׁוּב não está claramente representada.
    rationale: “Ainda verá” pode ser entendido temporalmente (“continuará a ver”) e não necessariamente como “verá novamente”. “Novamente” preserva de forma direta o valor repetitivo da construção hebraica.
  - severity: medium
    issue: “Maiores” torna comparativo um adjetivo hebraico formalmente positivo.
    rationale: Embora a progressão narrativa possa favorecer uma leitura comparativa e o audit trail inglês use “greater”, o texto hebraico diz literalmente “grandes abominações”. “Grandes” preserva a forma e evita resolver além do necessário uma nuance contextual.
