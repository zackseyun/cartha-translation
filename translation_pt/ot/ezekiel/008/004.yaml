  text: וְ/הִ֨נֵּה שָׁ֔ם כְּב֖וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֑ל כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי בַּ/בִּקְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/004.yaml
  text: And behold[a], there was the glory of the God of Israel, like the appearance that I had seen in the valley.
translation:
  language: pt
  text: E eis que ali estava a glória do Deus de Israel, semelhante à aparência que eu tinha visto no vale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na planície”. O termo hebraico בִּקְעָה pode designar um vale amplo ou uma planície.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o marcador discursivo e a força vívida e repentina de הִנֵּה, em um registro elevado, mas reconhecível na narrativa profética.
- source_word: שָׁם
  choice: ali estava
  rationale: Expressa tanto o sentido locativo de “ali” quanto a presença da glória, formando uma oração natural em português.
- source_word: כְּבוֹד
  choice: glória
  rationale: É a tradução consagrada e semanticamente adequada neste contexto de manifestação divina, sem acrescentar uma explicação teológica ao texto.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz de modo direto e natural a cadeia construta hebraica e mantém a identificação pactual.
- source_word: כַּמַּרְאֶה
  choice: semelhante à aparência
  rationale: Mantém a comparação introduzida por כְּ e o sentido visual de מַרְאֶה, sem reduzi-lo ao termo mais interpretativo “visão”.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que eu tinha visto
  rationale: O mais-que-perfeito composto assinala naturalmente em português que a experiência mencionada ocorreu antes desta cena.
- source_word: בַּבִּקְעָה
  choice: no vale
  rationale: בִּקְעָה pode designar um vale amplo ou uma planície. “No vale” é natural e se ajusta à provável referência retrospectiva a Ezequiel 3:22–23, enquanto a alternativa lexical é preservada em nota.
theological_decisions:
- issue: Natureza da manifestação divina em “a glória do Deus de Israel”
  choice: Traduzir diretamente como “a glória do Deus de Israel”, sem explicação adicional.
  alternative: “o esplendor visível que representava a presença de Deus” ou uma designação técnica explícita de teofania
  rationale: O hebraico afirma que a glória estava ali e a compara com uma aparência anterior. A formulação mantém a força teofânica sem importar uma definição teológica que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação profética em “e eis que”. A construção evita arcaísmos desnecessários e preserva a linguagem visual e a ambiguidade lexical do hebraico.
