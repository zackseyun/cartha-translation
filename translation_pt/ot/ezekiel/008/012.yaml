  to: 'Então ele me disse: “Você viu, filho do homem, o que os anciãos da casa de Israel estão fazendo na escuridão, cada um nos aposentos de sua imagem?[a] Pois dizem: ‘Yahweh não nos vê; Yahweh abandonou a terra.’[b]”'
