  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ אֲשֶׁ֨ר זִקְנֵ֤י בֵֽית יִשְׂרָאֵל֙ עֹשִׂ֣ים בַּ/חֹ֔שֶׁךְ אִ֖ישׁ בְּ/חַדְרֵ֣י מַשְׂכִּית֑/וֹ כִּ֣י אֹמְרִ֗ים אֵ֤ין יְהוָה֙ רֹאֶ֣ה אֹתָ֔/נוּ עָזַ֥ב יְהוָ֖ה אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/012.yaml
  text: Then he said to me[a], “Have you seen, son of man, what the elders of the house of Israel are doing in the darkness, each man in the rooms of his carved image? For they are saying, ‘Yahweh does not see us[c][b]; Yahweh has abandoned the land.’”
translation:
  language: pt
  text: 'Então ele me disse: “Você viu, filho do homem, o que os anciãos da casa de Israel estão fazendo na escuridão, cada um nos aposentos de sua imagem?[a] Pois dizem: ‘Yahweh não nos vê; Yahweh abandonou a terra.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas câmaras de sua representação” ou “nos aposentos de sua figura”. O termo hebraico pode indicar uma representação figurada, entalhada ou pintada, provavelmente de caráter idólatra.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “a terra” provavelmente se refere à terra de Israel ou de Judá; o termo hebraico também pode ser traduzido como “o país” ou “o território”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: הֲרָאִיתָ
  choice: Você viu
  rationale: O qatal interrogativo remete ao que acabou de ser mostrado na visão. O pretérito perfeito é natural e mantém essa referência.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma tradicional e recorrente com que o profeta é chamado em Ezequiel, bem como sua força literária.
- source_word: זִקְנֵי בֵית יִשְׂרָאֵל
  choice: os anciãos da casa de Israel
  rationale: Mantém a expressão completa “casa de Israel”, importante no vocabulário de Ezequiel.
- source_word: עֹשִׂים בַּחֹשֶׁךְ
  choice: estão fazendo na escuridão
  rationale: Conserva tanto a escuridão literal da visão quanto a conotação de segredo, sem reduzir a expressão a uma paráfrase.
- source_word: אִישׁ בְּחַדְרֵי מַשְׂכִּיתוֹ
  choice: cada um nas câmaras de suas imagens
  rationale: “Cada um” exprime o valor distributivo de אִישׁ. “Câmaras” representa os aposentos interiores, enquanto “imagens” preserva a amplitude de מַשְׂכִּית, que pode indicar representações figuradas, entalhadas ou pintadas. O plural em português é idiomático diante de “câmaras”, sem eliminar a ideia de imagens associadas a cada ancião.
- source_word: כִּי אֹמְרִים
  choice: Pois eles dizem
  rationale: Introduz a justificativa dada pelos anciãos para agirem ocultamente e soa natural em português.
- source_word: אֵין יְהוָה רֹאֶה אֹתָנוּ
  choice: Yahweh não nos vê
  rationale: Tradução idiomática da oração participial negativa, mantendo explicitamente o nome divino.
- source_word: עָזַב יְהוָה אֶת הָאָרֶץ
  choice: Yahweh abandonou a terra
  rationale: “Abandonou” comunica com clareza a força de עָזַב. “A terra” preserva a provável referência territorial sem excluir por completo a amplitude lexical do termo hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo por um título.
- issue: Extensão de הָאָרֶץ
  choice: a terra
  alternative: o país; o território; o mundo
  rationale: No contexto do templo e do exílio em Ezequiel, a expressão provavelmente indica a terra de Israel/Judá. “A terra” mantém essa leitura provável e também a ambiguidade lexical do hebraico.
- issue: Natureza de מַשְׂכִּית
  choice: imagens
  alternative: imagem entalhada; figuras; representações
  rationale: O termo admite mais de um tipo de representação figurativa. A tradução principal evita determinar sem necessidade se eram especificamente entalhadas ou pintadas, e a nota registra as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se expressões literariamente importantes de Ezequiel, como “filho do homem” e “casa de Israel”. A ambiguidade de מַשְׂכִּית e do alcance de הָאָרֶץ é preservada e explicada em notas.
