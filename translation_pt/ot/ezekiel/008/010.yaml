  text: וָ/אָבוֹא֮ וָֽ/אֶרְאֶה֒ וְ/הִנֵּ֨ה כָל תַּבְנִ֜ית רֶ֤מֶשׂ וּ/בְהֵמָה֙ שֶׁ֔קֶץ וְ/כָל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל מְחֻקֶּ֥ה עַל הַ/קִּ֖יר סָבִ֥יב סָבִֽיב־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/010.yaml
  text: So I went in and looked[a], and behold, every form of creeping thing and detestable beast, and all the idols of the house of Israel, were engraved on the wall all around.
translation:
  language: pt
  text: Então entrei e olhei; eis que toda representação de criatura rastejante e de animal detestável, bem como todos os ídolos[a] da casa de Israel, estavam gravados na parede, por toda a volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é fortemente depreciativo; também poderia ser vertido como “ídolos imundos” ou, de modo mais literal, “ídolos de esterco”.
    reason: alternativa lexical e preservação da força pejorativa
lexical_decisions:
- source_word: וָאָבוֹא וָאֶרְאֶה
  choice: Então entrei e olhei
  rationale: Os verbos consecutivos fazem a narrativa avançar. “Entrei e olhei” expressa naturalmente tanto a entrada quanto a observação de Ezequiel.
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Preserva a apresentação vívida e repentina da cena, característica da visão profética.
- source_word: כָל תַּבְנִית
  choice: toda forma de
  rationale: תַּבְנִית indica forma, semelhança ou representação; “forma” mantém aberto o tipo exato de imagem gravada.
- source_word: רֶמֶשׂ
  choice: criatura rastejante
  rationale: Designa seres que rastejam ou se movem junto ao chão; “criatura rastejante” é claro e natural em português atual.
- source_word: בְהֵמָה שֶׁקֶץ
  choice: animal detestável
  rationale: בְּהֵמָה tem sentido amplo de animal, e שֶׁקֶץ comunica repulsa, muitas vezes também associada à impureza ritual.
- source_word: גִּלּוּלֵי
  choice: ídolos
  rationale: “Ídolos” comunica claramente o referente no texto principal; a forte carga depreciativa do termo hebraico é registrada em nota.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Conserva a designação profética recorrente do povo de Israel.
- source_word: מְחֻקֶּה עַל הַקִּיר סָבִיב סָבִיב
  choice: estava gravada por toda a parede ao redor
  rationale: מְחֻקֶּה descreve imagens entalhadas ou gravadas. O singular “estava gravada” concorda com a série cujo núcleo é “toda forma”, e “por toda a parede ao redor” transmite a extensão enfatizada pela repetição de סָבִיב.
theological_decisions:
- issue: Força depreciativa do termo de Ezequiel para os ídolos
  choice: Usar “ídolos” no texto principal e explicar a nuance de desprezo em nota.
  alternative: ídolos imundos; ídolos de esterco
  rationale: גִּלּוּלִים é deliberadamente desdenhoso, mas uma reprodução literal da imagem escatológica soaria pouco natural e poderia obscurecer o sentido para leitores atuais. A nota preserva transparentemente a força retórica.
- issue: Relação de שֶׁקֶץ com a descrição dos animais
  choice: “animal detestável”
  alternative: “criaturas rastejantes e animais — coisas detestáveis”
  rationale: A sequência hebraica permite alguma tensão sintática, mas a leitura adjetiva é direta e natural, sem eliminar a ideia central de repulsa associada às representações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” mantém o tom profético sem tornar o restante da frase arcaico. A pontuação divide a entrada da apresentação vívida da visão.
