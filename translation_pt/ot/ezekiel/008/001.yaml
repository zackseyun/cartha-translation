  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שִּׁשִּׁ֗ית בַּ/שִּׁשִּׁי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ אֲנִי֙ יוֹשֵׁ֣ב בְּ/בֵיתִ֔/י וְ/זִקְנֵ֥י יְהוּדָ֖ה יוֹשְׁבִ֣ים לְ/פָנָ֑/י וַ/תִּפֹּ֤ל עָלַ/י֙ שָׁ֔ם יַ֖ד אֲדֹנָ֥/י יְהֹוִֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/001.yaml
  text: And it happened in the sixth year[a], in the sixth month, on the fifth day of the month, as I was sitting in my house and the elders of Judah were sitting before me[b], that the hand of the Lord GOD fell upon me there.
translation:
  language: pt
  text: Aconteceu que, no sexto ano, no sexto mês, no quinto dia do mês, enquanto eu estava sentado em minha casa e os anciãos de Judá estavam sentados diante de mim, a mão do Senhor Yahweh[a] caiu sobre mim ali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por «Soberano Yahweh». O hebraico combina o título אֲדֹנָי com o nome divino יהוה.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: «ali». Algumas traduções entendem o advérbio em sentido temporal, como «então», mas seu sentido normal é locativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz uma nova cena narrativa sem recorrer ao arcaísmo «veio a acontecer».
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: no sexto ano
  rationale: Mantém a fórmula cronológica concisa do hebraico, sem acrescentar «do exílio», que está apenas implícito no contexto.
- source_word: בַּשִּׁשִּׁי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: no sexto mês, no quinto dia do mês
  rationale: Reproduz com clareza e naturalidade a data formal do texto hebraico.
- source_word: אֲנִי יוֹשֵׁב בְּבֵיתִי
  choice: eu estava sentado em minha casa
  rationale: O particípio descreve uma circunstância contínua que serve de pano de fundo à ação principal.
- source_word: וְזִקְנֵי יְהוּדָה
  choice: e os anciãos de Judá
  rationale: «Anciãos» designa os líderes reconhecidos de Judá e é a correspondência tradicional e transparente.
- source_word: יוֹשְׁבִים לְפָנַי
  choice: estavam sentados diante de mim
  rationale: Preserva tanto a ação contínua quanto a ideia de estarem reunidos na presença do profeta.
- source_word: וַתִּפֹּל עָלַי
  choice: caiu sobre mim
  rationale: Mantém a imagem forte do verbo נפל com עַל, sem reduzi-la interpretativamente a «veio sobre mim».
- source_word: שָׁם
  choice: ali
  rationale: O advérbio é primariamente locativo. «Ali» preserva essa referência espacial, embora algumas traduções o entendam em sentido temporal.
- source_word: יַד
  choice: a mão
  rationale: Conserva a expressão profética concreta «a mão de Yahweh», em vez de substituir a metáfora por «poder».
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Representa diretamente a combinação do título אֲדֹנָי com o nome divino יהוה, evitando ocultar o nome próprio.
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus
  rationale: O hebraico combina um título com o nome divino. «Senhor Yahweh» torna visíveis ambos os elementos e evita transformar o nome próprio em um segundo título.
- issue: Sentido da expressão «a mão de Senhor Yahweh caiu sobre mim»
  choice: Preservar literalmente a imagem da mão que cai sobre o profeta
  alternative: Interpretar como «o poder de Senhor Yahweh veio sobre mim»
  rationale: A metáfora profética pode envolver poder, domínio ou impulso divino; mantê-la evita restringir sua amplitude teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura cronológica e as imagens proféticas foram preservadas sem arcaísmos. «Então» liga naturalmente a circunstância à ação principal, enquanto «ali» mantém explicitamente o advérbio locativo hebraico.
