  text: וְ/גַם אֲנִי֙ אֶעֱשֶׂ֣ה בְ/חֵמָ֔ה לֹֽא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל וְ/קָרְא֤וּ בְ/אָזְנַ/י֙ ק֣וֹל גָּד֔וֹל וְ/לֹ֥א אֶשְׁמַ֖ע אוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/018.yaml
  text: And I also will act in wrath; my eye will not spare[a], nor will I have compassion. Though they cry in my ears with a loud voice, I will not hear them.
translation:
  language: pt
  text: E eu também agirei com ira; o meu olho não poupará, e não terei compaixão. Ainda que[a] clamem aos meus ouvidos em alta voz, não os ouvirei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E clamarão aos meus ouvidos em alta voz, mas não os ouvirei.»'
    reason: A conjunção hebraica pode ser traduzida por coordenação contrastiva, em vez de explicitar a relação concessiva com «Ainda que».
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: E eu também
  rationale: Preserva a continuidade de וְ, a força aditiva de גַם e a ênfase do pronome explícito אֲנִי, sem introduzir uma oposição mais forte do que a forma hebraica exige.
- source_word: אֶעֱשֶׂה בְחֵמָה
  choice: agirei com ira
  rationale: Neste contexto de juízo, עשה indica ação decisiva; חֵמָה designa ira intensa. A formulação é natural em português e mantém a linguagem afetiva do original.
- source_word: לֹא תָחוֹס עֵינִי
  choice: o meu olho não poupará
  rationale: Mantém a imagem antropomórfica e o idioma hebraico do olho que não poupa, em vez de substituí-lo por uma abstração.
- source_word: וְלֹא אֶחְמֹל
  choice: e não terei compaixão
  rationale: Distingue חמל da ideia anterior de poupar e conserva sua nuance de piedade ou compaixão.
- source_word: וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל
  choice: Ainda que clamem aos meus ouvidos em alta voz
  rationale: O valor concessivo decorre do contraste com a recusa seguinte. 'Clamem' comunica o pedido urgente, enquanto 'aos meus ouvidos' preserva a expressão concreta e 'em alta voz' traduz naturalmente קוֹל גָּדוֹל.
- source_word: וְלֹא אֶשְׁמַע אוֹתָם
  choice: não os ouvirei
  rationale: É a correspondência direta de שמע e, no contexto, implica que Deus não atenderá ao clamor.
theological_decisions:
- issue: Severidade e antropomorfismo da linguagem do juízo divino
  choice: Conservar 'com ira', 'o meu olho não poupará' e 'não terei compaixão' como discurso divino direto.
  alternative: Suavizar para uma paráfrase como 'eu os castigarei severamente e não mostrarei misericórdia'.
  rationale: O hebraico apresenta o juízo em termos pessoais, intensos e antropomórficos; a tradução não deve atenuar nem converter essa linguagem em uma formulação judicial abstrata.
- issue: Relação discursiva entre o clamor e a recusa de ouvir
  choice: Explicitar a concessão com 'Ainda que'.
  alternative: 'Manter apenas a coordenação: ''E clamarão... mas não os ouvirei''.'
  rationale: Embora וְ seja formalmente uma conjunção ampla, o contraste contextual comunica que nem mesmo um clamor alto mudará a resposta. 'Ainda que' torna essa relação clara sem alterar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem concreta 'o meu olho não poupará' e evita-se tanto linguagem excessivamente arcaica quanto suavização do juízo.
