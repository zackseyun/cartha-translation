  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל חֲצַ֣ר בֵּית יְהוָה֮ הַ/פְּנִימִית֒ וְ/הִנֵּה פֶ֜תַח הֵיכַ֣ל יְהוָ֗ה בֵּ֤ין הָֽ/אוּלָם֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ כְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ אֲחֹ֨רֵי/הֶ֜ם אֶל הֵיכַ֤ל יְהוָה֙ וּ/פְנֵי/הֶ֣ם קֵ֔דְמָ/ה וְ/הֵ֛מָּה מִשְׁתַּחֲוִיתֶ֥ם קֵ֖דְמָ/ה לַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/016.yaml
  text: Then he brought me into the inner court of the house of Yahweh[a], and behold, at the entrance of the temple of Yahweh, between the porch and the altar, were about twenty-five men, with their backs toward the temple of Yahweh and their faces toward the east[b]; and they were bowing down toward the east to the sun.
translation:
  language: pt
  text: Então ele me levou ao pátio interno da casa de Yahweh; e eis que, à entrada do santuário de Yahweh, entre o pórtico e o altar, havia cerca de vinte e cinco homens, de costas para o santuário de Yahweh e de frente para o leste; eles se prostravam para o leste, ao sol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adoravam o sol”. O verbo hebraico descreve o ato de prostrar-se, frequentemente como gesto de adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Então ele me levou
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” comunica essa progressão com naturalidade em português.
- source_word: חֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: ao pátio interno da casa de Yahweh
  rationale: Mantém a imagem hebraica de “casa de Yahweh”; “pátio interno” é claro e adequado ao espaço do templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a mudança vívida de foco própria do relato visionário.
- source_word: פֶּתַח הֵיכַל יְהוָה
  choice: à entrada do santuário de Yahweh
  rationale: הֵיכָל designa aqui o edifício ou recinto sagrado do templo; “santuário” evita confundi-lo com toda a “casa” mencionada antes.
- source_word: בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ
  choice: entre o pórtico e o altar
  rationale: “Pórtico” expressa de modo natural a área coberta diante do santuário; “altar” traduz diretamente מִזְבֵּחַ.
- source_word: כְּעֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: cerca de vinte e cinco homens
  rationale: O prefixo כְּ indica aproximação; אִישׁ após o numeral tem sentido coletivo.
- source_word: אֲחֹרֵיהֶם אֶל הֵיכַל יְהוָה וּפְנֵיהֶם קֵדְמָה
  choice: de costas para o santuário de Yahweh e de frente para o leste
  rationale: Conserva o contraste espacial e a afronta implícita de se voltar para longe do santuário.
- source_word: מִשְׁתַּחֲוִיתֶם
  choice: se prostravam
  rationale: Expressa o gesto físico de curvar-se até o chão sem apagar seu claro sentido cultual no contexto.
- source_word: קֵדְמָה לַשָּׁמֶשׁ
  choice: em direção ao leste, diante do sol
  rationale: Retém tanto a orientação para o leste quanto a relação do gesto com o sol, sem reduzir a expressão a uma interpretação abstrata.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido cultual de מִשְׁתַּחֲוִיתֶם
  choice: se prostravam ... diante do sol
  alternative: adoravam o sol
  rationale: O texto principal conserva o gesto concreto indicado pelo verbo; a nota registra a tradução interpretativamente mais explícita, pois no contexto a prostração é um ato de culto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva a vivacidade da visão, o contraste espacial entre o santuário e o leste e a tensão entre o gesto físico e seu sentido idólatra.
