revisions:
- from: Então ele me levou ao pátio interno da casa de Yahweh. E eis que, à entrada do santuário de Yahweh, entre o pórtico e o altar, havia cerca de vinte e cinco homens. Eles estavam de costas para o santuário de Yahweh e de frente para o leste; e se prostravam em direção ao leste, diante do sol.[a]
  to: Então ele me levou ao pátio interno da casa de Yahweh; e eis que, à entrada do santuário de Yahweh, entre o pórtico e o altar, havia cerca de vinte e cinco homens, de costas para o santuário de Yahweh e de frente para o leste; eles se prostravam para o leste, ao sol.[a]
  rationale: A única alteração necessária substitui “diante do sol” por “ao sol”, para preservar com clareza o destinatário expresso no hebraico. A nota continua distinguindo corretamente entre a descrição física do gesto no texto e sua explicitação cultual possível.
