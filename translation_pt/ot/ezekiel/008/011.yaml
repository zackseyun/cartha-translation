base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/011.yaml
  text: And seventy men from the elders of the house of Israel[a], with Jaazaniah the son of Shaphan standing among them, were standing before them, each man with his censer in his hand[d][c][b]; and the thick cloud of incense was going up.
translation:
  language: pt
  text: E setenta homens dentre os anciãos da casa de Israel[a] estavam em pé diante deles[b], e Jaazanias, filho de Safã, estava em pé no meio deles. Cada um tinha o seu incensário[c] na mão, e a espessa nuvem de incenso subia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos anciãos da casa de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, diante das imagens retratadas na parede do aposento (ver v. 10).
    reason: cross_reference
  - marker: c
    text: 'Ou: “queimador de incenso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים אִישׁ מִזִּקְנֵי בֵית יִשְׂרָאֵל
  choice: setenta homens dentre os anciãos da casa de Israel
  rationale: “Homens” preserva a referência masculina de אִישׁ, e “dentre” expressa מִן como indicação de que os setenta pertenciam ao grupo mais amplo dos anciãos. “Casa de Israel” mantém a expressão hebraica.
- source_word: יַאֲזַנְיָהוּ בֶן שָׁפָן
  choice: Jazanias, filho de Safã
  rationale: Emprega formas portuguesas reconhecíveis dos nomes e traduz diretamente a identificação filial.
- source_word: עֹמֵד בְּתוֹכָם
  choice: estava em pé entre eles
  rationale: Reproduz a posição de Jazanias dentro do grupo em português natural, mantendo o caráter contínuo do particípio.
- source_word: עֹמְדִים לִפְנֵיהֶם
  choice: estavam em pé diante delas
  rationale: O particípio apresenta a cena em andamento. O feminino plural explicita apenas a concordância portuguesa com “imagens”, o referente contextual mais provável no versículo anterior, sem identificar quais imagens eram.
- source_word: מִקְטַרְתּוֹ
  choice: seu incensário
  rationale: “Incensário” é o termo português corrente e digno para o utensílio usado na queima de incenso.
- source_word: וַעֲתַר עֲנַן הַקְּטֹרֶת
  choice: uma densa nuvem de incenso
  rationale: “Densa” comunica a abundância ou espessura expressa por עֲתַר sem produzir uma formulação artificial.
- source_word: עֹלֶה
  choice: subia
  rationale: O imperfeito português retrata adequadamente a ação contínua indicada pelo particípio hebraico.
theological_decisions:
- issue: Referente de לִפְנֵיהֶם (“diante deles/delas”)
  choice: diante delas, isto é, das imagens retratadas na parede
  alternative: diante deles, sem explicitar no gênero gramatical português o referente contextual
  rationale: O sufixo plural aponta mais naturalmente para as figuras retratadas no versículo 10. A tradução conserva o pronome, e a nota registra o referente contextual em vez de inserir uma interpretação mais extensa no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em frases curtas evita o acúmulo pesado de particípios do hebraico sem alterar a sequência visual. “Estavam ali” torna idiomática a apresentação do grupo, enquanto os particípios seguintes preservam suas posições e ações na visão.
