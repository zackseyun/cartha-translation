revisions:
- from: E setenta homens dentre os anciãos da casa de Israel[a] estavam ali. Jazanias, filho de Safã, estava em pé entre eles[b]. Todos estavam em pé diante delas[c], cada um com seu incensário[d] na mão, e uma densa nuvem de incenso subia.
