  rationale: A revisão restaura a sequência e as relações espaciais da construção hebraica, evita o acréscimo de «ali», mantém o pronome plural masculino sem determinar seu referente no texto principal, e traduz a nuvem como definida. As notas permanecem ancoradas nos elementos relevantes e em ordem de ocorrência.
