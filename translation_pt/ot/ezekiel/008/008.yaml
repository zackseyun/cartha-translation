  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֖ם חֲתָר נָ֣א בַ/קִּ֑יר וָ/אֶחְתֹּ֣ר בַּ/קִּ֔יר וְ/הִנֵּ֖ה פֶּ֥תַח אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/008.yaml
  text: Then he said to me[a], “Son of man, please dig into the wall.” So I dug into the wall, and behold, there was an opening.
translation:
  language: pt
  text: 'Então ele me disse: “Filho do homem, por favor, cave na parede[a].” Cavei na parede, e eis que havia uma abertura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abra uma passagem na parede”. O verbo hebraico pode indicar cavar ou romper uma parede.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma hebraica recorrente de tratamento dirigida a Ezequiel, sem transformá-la aqui em título messiânico.
- source_word: חֲתָר
  choice: cave
  rationale: O verbo indica cavar ou abrir passagem através de algo; “cave” é natural em português e mantém a imagem concreta.
- source_word: נָא
  choice: por favor
  rationale: Representa a força modal da partícula, que suaviza ou reforça o pedido, em vez de lhe atribuir sentido temporal.
- source_word: קִּיר
  choice: parede
  rationale: É a equivalência corrente e adequada ao elemento estrutural deste contexto.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém o marcador de descoberta súbita e a vivacidade da narrativa hebraica.
- source_word: פֶּתַח אֶחָד
  choice: uma abertura
  rationale: Em português, o artigo indefinido expressa naturalmente a existência de uma única abertura sem sugerir contraste numérico ausente do contexto; “abertura” evita pressupor uma porta acabada.
theological_decisions:
- issue: Sentido de אָדָם na expressão de tratamento בֶּן אָדָם
  choice: Filho do homem
  alternative: ser humano
  rationale: A tradução literal preserva a fórmula característica usada para Ezequiel e seu gênero gramatical, sem importar para o versículo uma afirmação cristológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva deliberadamente a vivacidade do hebraico; “por favor” reflete a partícula נָא. O marcador [a] foi colocado após a expressão cuja alternativa lexical a nota explica.
