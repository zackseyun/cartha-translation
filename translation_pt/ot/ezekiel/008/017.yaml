  source_fidelity: 'A tradução acompanha bem a estrutura e o sentido do hebraico: a pergunta retórica, «casa de Judá», «abominações», a violência que enche a terra e a provocação repetida a Deus estão adequadamente preservadas. Na cláusula final, porém, «ao nariz» deixa de indicar explicitamente o sufixo plural do Texto Massorético («ao nariz deles»).'
