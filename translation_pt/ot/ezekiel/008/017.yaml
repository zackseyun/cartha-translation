base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/017.yaml
  text: Then he said to me[a], “Have you seen, son of man? Is it too trivial a thing for the house of Judah to do the abominations that they have done here, that they should also fill the land with violence and turn again to provoke me? And behold[b], they are putting the branch to their nose.”
translation:
  language: pt
  text: 'Então ele me disse: “Você viu, filho do homem? Será pouca coisa para a casa de Judá praticar as abominações que praticaram aqui, para ainda encherem a terra de violência e voltarem a me provocar? E eis que eles levam o ramo ao próprio nariz[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “levar o ramo ao próprio nariz” é obscura e talvez descreva um gesto ritual idólatra. Alguns testemunhos antigos trazem: “levam o ramo ao meu nariz”; o texto hebraico massorético diz literalmente: “ao nariz deles”.'
    reason: textual_variant_and_cultural_note
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Você viu
  rationale: O perfeito qal com a partícula interrogativa remete retoricamente ao que Ezequiel acaba de contemplar.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a fórmula característica e repetida com que o profeta é interpelado em Ezequiel.
- source_word: הֲנָקֵל
  choice: Será pouca coisa
  rationale: Expressa de modo natural a ideia de leveza ou insignificância e mantém a força da pergunta retórica.
- source_word: לְבֵית יְהוּדָה
  choice: para a casa de Judá
  rationale: Mantém a expressão coletiva e pactual do hebraico.
- source_word: הַתּוֹעֵבוֹת
  choice: as abominações
  rationale: Conserva o forte sentido moral e religioso do termo no contexto de idolatria.
- source_word: מָלְאוּ אֶת הָאָרֶץ חָמָס
  choice: encherem a terra de violência
  rationale: Traduz חָמָס diretamente como violência, sem excluir sua dimensão de injustiça e perversidade.
- source_word: וַיָּשֻׁבוּ לְהַכְעִיסֵנִי
  choice: voltarem a me provocar
  rationale: A construção comunica repetição da conduta que desperta a ira divina.
- source_word: וְהִנָּם
  choice: E veja
  rationale: Forma atual e digna que preserva a função de chamar vividamente a atenção.
- source_word: שֹׁלְחִים אֶת הַזְּמוֹרָה
  choice: eles levam o ramo
  rationale: Representa o gesto físico sem determinar sua natureza ritual; 'ramo' mantém a referência vegetal sem especificar de modo incerto uma videira.
- source_word: אֶל אַפָּם
  choice: ao nariz
  rationale: Segue o Texto Massorético, cujo sufixo plural indica literalmente 'nariz deles'; em português, o singular distributivo evita a forma pesada 'aos narizes deles'.
theological_decisions:
- issue: Gesto obscuro na cláusula final
  choice: eles levam o ramo ao nariz
  alternative: eles levam o ramo ao meu nariz
  rationale: O texto principal segue transparentemente o Texto Massorético sem impor uma explicação ritual. A leitura pronominal alternativa, apoiada por testemunhos antigos e relevante para a interpretação, é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe retém a intensidade retórica do hebraico, e a obscuridade da frase final é preservada em vez de resolvida por conjectura.
