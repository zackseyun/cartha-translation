  text: וַ/יִּשְׁלַח֙ תַּבְנִ֣ית יָ֔ד וַ/יִּקָּחֵ֖/נִי בְּ/צִיצִ֣ת רֹאשִׁ֑/י וַ/תִּשָּׂ֣א אֹתִ֣/י ר֣וּחַ בֵּֽין הָ/אָ֣רֶץ וּ/בֵ֣ין הַ/שָּׁמַ֡יִם וַ/תָּבֵא֩ אֹתִ֨/י יְרוּשָׁלְַ֜מָ/ה בְּ/מַרְא֣וֹת אֱלֹהִ֗ים אֶל פֶּ֜תַח שַׁ֤עַר הַ/פְּנִימִית֙ הַ/פּוֹנֶ֣ה צָפ֔וֹנָ/ה אֲשֶׁר שָׁ֣ם מוֹשַׁ֔ב סֵ֖מֶל הַ/קִּנְאָ֥ה הַ/מַּקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/003.yaml
  text: Then he stretched out what looked like a hand and took me by a lock of my head[a], and the Spirit lifted me up between the earth and the heavens and brought me to Jerusalem in visions of God, to the entrance of the inner gate that faces north[b], where the seat of the image of jealousy that provokes jealousy was.
translation:
  language: pt
  text: Então ele estendeu algo semelhante a uma mão[a] e me pegou por uma mecha de cabelo; o Espírito[b] me levantou entre a terra e os céus e me levou a Jerusalém, em visões de Deus, até a entrada do portão interno voltado para o norte, onde estava o lugar da imagem do ciúme, que provoca ciúme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a forma de uma mão” ou “a semelhança de uma mão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um espírito” ou “o vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית יָד
  choice: algo semelhante a uma mão
  rationale: תַּבְנִית indica forma, modelo ou semelhança. A expressão comunica a aparência visível no contexto da visão sem afirmar que se tratava necessariamente de uma mão literal.
- source_word: בְּצִיצִת רֹאשִׁי
  choice: por uma mecha do meu cabelo
  rationale: צִיצִת designa aqui uma mecha ou tufo de cabelo. A formulação é concreta, clara e natural em português atual.
- source_word: רוּחַ
  choice: o Espírito
  rationale: Embora רוּחַ possa significar vento, espírito ou Espírito, o contexto de transporte sobrenatural do profeta favorece a referência ao Espírito divino. A nota preserva as demais possibilidades lexicais.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: entre a terra e os céus
  rationale: Mantém o paralelismo hebraico e o plural formal de שָׁמַיִם, preservando o tom visionário elevado.
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: em visões de Deus
  rationale: 'Conserva o plural מַרְאוֹת e deixa aberta a relação do genitivo: visões dadas por Deus ou de caráter divino.'
- source_word: פֶּתַח שַׁעַר הַפְּנִימִית
  choice: a entrada do portão interno
  rationale: Distingue פֶּתַח, a entrada ou abertura, de שַׁעַר, o portão, e preserva sua relação sintática.
- source_word: הַפּוֹנֶה צָפוֹנָה
  choice: voltado para o norte
  rationale: Equivalente direcional corrente e preciso para o particípio hebraico.
- source_word: מוֹשַׁב
  choice: onde ficava
  rationale: מוֹשַׁב pode indicar assento, morada ou lugar estabelecido. A construção locativa transmite naturalmente que a imagem estava instalada naquele ponto.
- source_word: סֵמֶל
  choice: imagem
  rationale: סֵמֶל designa uma imagem ou figura cultual. “Imagem” preserva o sentido sem intensificar o termo para “ídolo” no corpo do texto.
- source_word: הַקִּנְאָה הַמַּקְנֶה
  choice: do ciúme, que provoca ciúme
  rationale: A repetição de “ciúme” conserva o jogo verbal entre קִנְאָה e o particípio causativo מַּקְנֶה, importante no contexto da reação divina à imagem.
theological_decisions:
- issue: Se רוּחַ no transporte visionário é vento impessoal, um espírito ou o Espírito divino
  choice: o Espírito
  alternative: vento; um espírito
  rationale: O contexto imediato descreve uma visão profética e transporte sobrenatural, e o uso mais amplo em Ezequiel favorece a ação do Espírito divino. A nota mantém explícita a amplitude semântica do hebraico.
- issue: A relação expressa por בְּמַרְאוֹת אֱלֹהִים
  choice: em visões de Deus
  alternative: em visões divinas; numa visão vinda de Deus
  rationale: A construção portuguesa mantém a formulação genitiva do hebraico e não decide indevidamente entre origem e qualidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Portão interno” evita a possível confusão de “porta interna” com uma simples porta de edifício. A repetição “ciúme... ciúme” é deliberada para preservar o jogo de palavras hebraico.
