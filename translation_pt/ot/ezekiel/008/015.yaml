  text: Then he said to me, “Have you seen this, son of man? You will see again still greater abominations than these.”
translation:
  language: pt
  text: 'Então ele me disse: “Você viu isto, filho do homem? Você verá novamente abominações ainda maiores do que estas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: Reproduz a progressão narrativa do hebraico de modo natural em português; o sujeito permanece implícito, como no contexto.
- source_word: הֲרָאִיתָ
  choice: Você viu isso
  rationale: Traduz a pergunta direta no perfeito e explicita com naturalidade o objeto contextual, sem alterar o sentido.
- source_word: בֶן־אָדָם
  choice: filho do homem
  rationale: Mantém a forma característica pela qual Deus se dirige a Ezequiel.
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: Você ainda verá
  rationale: O conjunto idiomático combina continuação ou acréscimo com a ideia de voltar a ver; em português, “ainda verá” comunica naturalmente que outras visões se seguirão.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת מֵאֵלֶּה
  choice: abominações maiores do que estas
  rationale: Preserva o termo forte para práticas detestáveis e a comparação explícita do hebraico.
theological_decisions:
- issue: Sentido de תּוֹעֵבוֹת
  choice: abominações
  alternative: práticas detestáveis
  rationale: “Abominações” conserva o peso cultual e moral recorrente do termo em Ezequiel, sem restringi-lo a uma categoria doutrinária específica.
- issue: Força de עוֹד תָּשׁוּב
  choice: ainda verá
  alternative: voltará a ver
  rationale: A escolha preserva a progressão para revelações adicionais e evita sugerir necessariamente a repetição da mesma cena.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A formulação mantém a concisão e a solenidade do discurso profético.
