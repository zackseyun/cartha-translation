base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/002.yaml
  text: 'Then I looked[a], and behold, a form with the appearance of fire: from what appeared to be his waist and downward, fire; and from his waist and upward, like the appearance of brightness, like gleaming amber.'
translation:
  language: pt
  text: 'Então olhei, e eis uma forma com aparência de fogo: daquilo que parecia ser sua cintura para baixo, havia fogo; e de sua cintura para cima, como o aspecto de brilho, como metal reluzente.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como o aspecto de electro” ou “como âmbar reluzente”. O termo hebraico é raro e designa uma substância de brilho intenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Então olhei
  rationale: O waw consecutivo faz avançar a narrativa da visão; a expressão é natural em português e preserva o relato visual na primeira pessoa.
- source_word: וְהִנֵּה
  choice: e eis
  rationale: Conserva a força dêitica e a surpresa da cena visionária em registro elevado, mas compreensível.
- source_word: דְמוּת
  choice: uma forma
  rationale: Expressa uma figura percebida por semelhança, sem convertê-la numa identificação direta.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: com aparência de fogo
  rationale: Preserva a linguagem comparativa de כ e מַרְאֶה, evitando afirmar que a forma era literalmente fogo.
- source_word: מִמַּרְאֵה מָתְנָיו
  choice: daquilo que parecia ser sua cintura
  rationale: Reflete a construção hebraica difícil e elíptica, mantém a cautela visionária e emprega uma referência anatômica atual.
- source_word: וּלְמַטָּה אֵשׁ
  choice: para baixo, havia fogo
  rationale: Comunica com clareza a direção espacial e explicita naturalmente em português a cópula ausente na oração nominal hebraica.
- source_word: וּמִמָּתְנָיו וּלְמַעְלָה
  choice: e de sua cintura para cima
  rationale: Mantém o paralelismo espacial com a descrição da parte inferior.
- source_word: כְּמַרְאֵה זֹהַר
  choice: algo como o aspecto de um brilho
  rationale: זֹהַר indica brilho ou resplendor; a formulação conserva tanto a luminosidade quanto a natureza aproximativa da descrição.
- source_word: כְּעֵין הַחַשְׁמַלָה
  choice: como metal reluzente
  rationale: חַשְׁמַל é um termo raro para uma substância de brilho intenso, possivelmente electro; a escolha é inteligível sem impor uma identificação material incerta.
theological_decisions:
- issue: Descrição visionária da forma
  choice: Manter repetidamente a linguagem de aparência e semelhança
  alternative: Descrever diretamente o ser como fogo ou como uma substância metálica específica
  rationale: Ezequiel qualifica cuidadosamente o que vê por meio de termos de semelhança e aparência. Preservar essa cautela evita uma identificação ontológica que o texto não faz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação profética em “e eis”. A sintaxe paralela reproduz a organização espacial do hebraico, enquanto as expressões “parecia ser” e “algo como” preservam a cautela própria da visão.
