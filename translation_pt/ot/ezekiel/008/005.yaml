base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/005.yaml
  text: Then he said to me[a], “Son of man, please lift up your eyes toward the north.” So I lifted up my eyes toward the north, and behold, north of the gate of the altar was this image of jealousy at the entrance.
translation:
  language: pt
  text: 'Então ele me disse: “Filho do homem, levante, por favor, os olhos em direção ao norte.” Levantei os olhos em direção ao norte e eis que esta imagem do ciúme[a] estava à entrada, ao norte da porta do altar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este ídolo do ciúme” ou “esta imagem que provoca ciúme”. A expressão hebraica é compacta e pode indicar tanto o caráter da imagem quanto seu efeito de provocar o ciúme divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma de tratamento característica dirigida a Ezequiel, sua imagem hebraica e sua ressonância literária, sem reduzi-la a uma paráfrase.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: levante, por favor, os olhos
  rationale: Mantém a imagem concreta do hebraico; “por favor” representa a partícula נָא, que suaviza a ordem.
- source_word: דֶּרֶךְ צָפוֹנָה
  choice: em direção ao norte
  rationale: Expressa com naturalidade o sentido direcional da construção hebraica.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Conserva a força de apresentação e a vivacidade próprias do relato visionário.
- source_word: מִצָּפוֹן
  choice: ao norte de
  rationale: Neste contexto, indica a posição da imagem em relação ao portão, não movimento proveniente do norte.
- source_word: לְשַׁעַר הַמִּזְבֵּחַ
  choice: do portão do altar
  rationale: Preserva a relação nominal sem definir além do texto o referente arquitetônico exato.
- source_word: סֵמֶל
  choice: imagem
  rationale: É amplo o bastante para representar uma figura cultual sem explicitar no próprio substantivo o juízo contextual de idolatria.
- source_word: הַקִּנְאָה
  choice: do ciúme
  rationale: Mantém a construção nominal compacta e sua ambiguidade quanto ao caráter da imagem ou ao efeito de provocar o ciúme divino.
- source_word: בַּבִּאָה
  choice: à entrada
  rationale: Representa de modo natural a localização indicada pelo substantivo hebraico.
theological_decisions:
- issue: Grau de explicitação de סֵמֶל הַקִּנְאָה
  choice: esta imagem do ciúme
  alternative: este ídolo do ciúme; esta imagem que provoca ciúme
  rationale: O contexto associa a imagem à idolatria e ao ciúme divino, mas a expressão hebraica permanece nominal e compacta. O texto principal conserva essa tensão, e a nota registra as interpretações legítimas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe foi levemente reorganizada no fim do versículo para evitar uma sequência espacial pesada, sem alterar as relações locativas do hebraico.
