  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל פֶּ֨תַח֙ שַׁ֣עַר בֵּית יְהוָ֔ה אֲשֶׁ֖ר אֶל הַ/צָּפ֑וֹנָ/ה וְ/הִנֵּה שָׁם֙ הַ/נָּשִׁ֣ים יֹֽשְׁב֔וֹת מְבַכּ֖וֹת אֶת הַ/תַּמּֽוּז־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/014.yaml
  text: Then he brought me to the entrance of the gate of the house of Yahweh that faces north[a], and behold, there the women were sitting[b], weeping for Tammuz.
translation:
  language: pt
  text: Então ele me levou à entrada do portão da casa de Yahweh voltado para o norte. E eis que ali estavam sentadas as mulheres, chorando[a] por Tamuz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lamentando”. O verbo hebraico significa literalmente “chorar”.
    reason: lexical_alternative
  - marker: b
    text: Tamuz era uma divindade mesopotâmica associada a ritos sazonais de lamento; as mulheres são retratadas participando desse pranto ritual.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Então ele me levou
  rationale: O hifil de בוא expressa fazer alguém chegar a um lugar. “Levou” é natural em português e preserva o sentido causativo no contexto da visão; “Então” comunica a progressão narrativa do waw.
- source_word: פֶּתַח שַׁעַר
  choice: à entrada do portão
  rationale: פֶּתַח designa a entrada ou abertura, e שַׁעַר, o portão. A combinação mantém os dois elementos arquitetônicos sem soar artificial.
- source_word: בֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: “Casa” conserva a forma do hebraico, embora o referente seja o templo, e “Yahweh” translitera o nome divino.
- source_word: אֲשֶׁר אֶל הַצָּפוֹנָה
  choice: que fica ao norte
  rationale: A expressão identifica o portão por sua localização ou orientação setentrional. Esta formulação natural preserva a leve abertura do hebraico entre estar voltado para o norte e situar-se no lado norte.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém o marcador que chama a atenção para a cena e preserva o tom vívido da visão profética.
- source_word: הַנָּשִׁים יֹשְׁבוֹת
  choice: estavam sentadas as mulheres
  rationale: O particípio retrata uma postura em andamento. A ordem escolhida flui naturalmente depois de “ali” e mantém em foco o grupo visível.
- source_word: מְבַכּוֹת
  choice: chorando
  rationale: O verbo בכה significa literalmente chorar. No contexto, o choro faz parte de um rito de lamento, possibilidade registrada em nota.
- source_word: אֶת הַתַּמּוּז
  choice: por Tamuz
  rationale: תַּמּוּז é nome próprio e é transliterado na forma portuguesa corrente “Tamuz”. A preposição “por” expressa adequadamente o objeto do choro ritual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Identificação de תַּמּוּז
  choice: Tamuz
  alternative: o deus Tamuz
  rationale: O hebraico apresenta um nome próprio. Não se acrescenta “deus” ao texto principal; a identidade e o contexto cultual são esclarecidos em nota, sem ampliar interpretativamente a tradução.
- issue: Natureza da ação expressa por מְבַכּוֹת
  choice: chorando por Tamuz
  alternative: lamentando por Tamuz
  rationale: “Chorando” preserva o sentido lexical direto, enquanto o caráter ritual do lamento, embora fortemente sugerido pelo contexto histórico, fica explicado em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conserva-se “eis que” para reproduzir a vividez profética; “casa de Yahweh” mantém a imagem hebraica, e “Tamuz” segue a forma consagrada em português.
