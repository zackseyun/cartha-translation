  terminology: “Yahweh” segue a decisão de transliterar o tetragrama; “Tamuz” é a forma portuguesa corrente do nome. “Chorando por Tamuz” conserva o sentido direto de מְבַכּוֹת, e a nota cultural é informativa sem inserir interpretação no texto principal.
