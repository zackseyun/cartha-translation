  text: וַ/יָּבֵ֥א אֹתִ֖/י אֶל פֶּ֣תַח הֶֽ/חָצֵ֑ר וָ/אֶרְאֶ֕ה וְ/הִנֵּ֥ה חֹר אֶחָ֖ד בַּ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/007.yaml
  text: Then he brought me to the entrance of the court[a], and I looked, and behold[b], there was a hole in the wall.
translation:
  language: pt
  text: Então ele me levou à entrada do pátio[a]. Olhei[b], e eis que havia um buraco na parede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do átrio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Vi”; o verbo hebraico pode indicar tanto o ato de olhar quanto o resultado de ver.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Então ele me levou
  rationale: O hifil de בוא significa “levar” ou “fazer vir”. “Então” comunica com naturalidade a progressão da narrativa expressa pelo wayyiqtol.
- source_word: אֹתִי
  choice: me
  rationale: Pronome de primeira pessoa que funciona como objeto direto de “levou”.
- source_word: אֶל־פֶּתַח
  choice: à entrada
  rationale: אֶל indica direção, e פֶּתַח designa uma entrada ou abertura. “À entrada” não afirma além do texto que Ezequiel tenha entrado no pátio.
- source_word: הֶחָצֵר
  choice: do pátio
  rationale: חָצֵר pode designar pátio ou átrio. “Pátio” é corrente e claro em português, enquanto “átrio” permanece como alternativa adequada ao contexto do templo.
- source_word: וָאֶרְאֶה
  choice: Olhei
  rationale: ראה pode indicar tanto o ato de olhar quanto o resultado de ver. Neste contexto, antes de הִנֵּה, “olhei” representa bem o direcionamento da atenção sem eliminar a alternativa “vi”.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama vividamente a atenção para o que aparece em seguida. “E eis que” preserva o tom profético e a força dêitica da expressão.
- source_word: חֹר אֶחָד
  choice: um buraco
  rationale: חֹר significa “buraco” ou “abertura”. אֶחָד, embora literalmente “um”, funciona aqui naturalmente como artigo indefinido, sem exigir ênfase numérica.
- source_word: בַּקִּיר
  choice: na parede
  rationale: A preposição בְּ com o artigo e קִיר expressa a localização do buraco “na parede”.
