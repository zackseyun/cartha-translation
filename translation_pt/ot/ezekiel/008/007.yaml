  register: Português moderno, claro e digno, com legibilidade brasileira. “E eis que” conserva a vivacidade do hebraico profético; a divisão em duas frases evita uma sequência excessivamente carregada sem alterar a progressão narrativa. Os marcadores foram associados aos termos hebraicos correspondentes, corrigindo a inversão aparente presente na camada inglesa de consulta.
