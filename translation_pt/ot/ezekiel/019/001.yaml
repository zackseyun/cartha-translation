id: EZK.19.1
reference: Ezekiel 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּה֙ שָׂ֣א קִינָ֔ה אֶל נְשִׂיאֵ֖י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/001.yaml
  text: And you[b][a], raise a lamentation over the princes of Israel.
translation:
  language: pt
  text: E você, entoe uma lamentação[a] pelos príncipes[b] de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levante uma lamentação”; também pode ser entendido como “profira um canto fúnebre”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “príncipes” pode se referir especificamente aos governantes da casa real de Judá/Israel, e não apenas a líderes em geral.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: E você,
  rationale: A conjunção mantém a continuidade do discurso, e o pronome independente destaca de modo leve o destinatário, Ezequiel.
- source_word: שָׂא
  choice: entoe
  rationale: Embora o verbo signifique literalmente “levantar” ou “carregar”, com קִינָה forma uma expressão idiomática para iniciar ou proferir um lamento. “Entoe” comunica essa ação com naturalidade e dignidade em português.
- source_word: קִינָה
  choice: uma lamentação
  rationale: O substantivo designa um lamento fúnebre ou canto de dor. “Lamentação” preserva o tom formal e profético sem restringir o texto à ideia de uma composição musical.
- source_word: אֶל
  choice: pelos
  rationale: Com linguagem de lamentação, a preposição indica aqueles que são o tema ou objeto do lamento. “Pelos” é a construção idiomática mais natural em português.
- source_word: נְשִׂיאֵי
  choice: príncipes
  rationale: O termo designa pessoas de posição elevada, chefes ou governantes. Neste contexto dinástico, “príncipes” conserva a nuance política e régia sem substituir o termo hebraico pelo mais específico “reis”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada em português para o nome próprio hebraico.
theological_decisions:
- issue: Referente de “príncipes de Israel”
  choice: Manter “príncipes de Israel” como designação político-dinástica relativamente ampla.
  alternative: “reis de Israel” ou “líderes de Israel”
  rationale: O hebraico emprega נְשִׂיאֵי, e não o termo mais específico para “reis”. O contexto aponta para governantes da casa real, mas a tradução não deve eliminar a amplitude lexical do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Entoe uma lamentação” traduz naturalmente a expressão idiomática hebraica, enquanto a nota conserva sua metáfora literal. “Príncipes” mantém a ambiguidade política e dinástica do termo-fonte.
