  yaml_path: translation/ot/ezekiel/019/013.yaml
  text: And now she is planted in the wilderness[a], in a dry and thirsty land.
translation:
  language: pt
  text: E agora ela está plantada no deserto[a], numa terra seca e sedenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «transplantada para o deserto». Pelo contexto, o particípio hebraico pode sugerir que ela foi retirada de um lugar e plantada em outro, embora a forma em si signifique mais diretamente «plantada».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto a transição temporal que liga este estado à descrição anterior.
- source_word: שְׁתוּלָה
  choice: está plantada
  rationale: O particípio passivo descreve a condição presente da figura feminina, aqui uma videira, sem explicitar por si só o ato de transferência.
- source_word: בַמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, «deserto» comunica com naturalidade um lugar ermo e inóspito; neste contexto, não exige a ideia restrita de dunas de areia.
- source_word: בְּאֶרֶץ
  choice: numa terra
  rationale: A construção introduz uma caracterização adicional e indefinida do lugar.
- source_word: צִיָּה
  choice: seca
  rationale: Expressa de modo claro a aridez e combina naturalmente com a descrição seguinte.
- source_word: וְצָמָא
  choice: e sedenta
  rationale: Mantém a personificação compacta da terra como carente de água, refletindo a força poética do hebraico.
