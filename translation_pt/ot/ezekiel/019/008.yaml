  text: וַ/יִּתְּנ֨וּ עָלָ֥י/ו גּוֹיִ֛ם סָבִ֖יב מִ/מְּדִינ֑וֹת וַֽ/יִּפְרְשׂ֥וּ עָלָ֛י/ו רִשְׁתָּ֖/ם בְּ/שַׁחְתָּ֥/ם נִתְפָּֽשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/008.yaml
  text: Then nations from the provinces set themselves against him all around[a], and they spread their net over him[b]; he was caught in their pit.
translation:
  language: pt
  text: Então, nações das províncias se puseram contra ele por todos os lados[a]. Estenderam sobre ele a sua rede, e ele foi apanhado na cova deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nações se puseram contra ele ao redor, vindas das províncias.” A construção hebraica permite mais de uma ligação sintática para “ao redor” e “das províncias”.'
    reason: textual_ambiguity
  - marker: b
    text: A “cova” provavelmente era um fosso usado como armadilha na caça.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: se posicionaram contra ele
  rationale: Reproduz de modo natural o sentido hostil do idioma hebraico נתן על, sem recorrer à formulação literal e obscura “puseram contra ele”.
- source_word: גּוֹיִם
  choice: nações
  rationale: É o equivalente comum e adequado ao contexto político; “gentios” introduziria um contraste religioso que não está em primeiro plano.
- source_word: סָבִיב מִמְּדִינוֹת
  choice: vindas das províncias ... por todos os lados
  rationale: Mantém tanto a procedência das unidades administrativas quanto a imagem de cerco, embora o encaixe sintático do hebraico permita relacionar “por todos os lados” de maneira um pouco diferente.
- source_word: וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם
  choice: Estenderam sobre ele a sua rede
  rationale: Preserva diretamente a metáfora da caça ao leão e o sentido básico de פרשׂ, “estender”.
- source_word: בְּשַׁחְתָּם
  choice: na cova que haviam preparado
  rationale: שַׁחַת designa uma cova ou fosso e, neste contexto de caça, funciona como armadilha. A expressão portuguesa explicita de modo moderado que a cova pertencia ao plano dos caçadores.
- source_word: נִתְפָּשׂ
  choice: foi apanhado
  rationale: Mantém o passivo e combina naturalmente com a imagem de um animal capturado numa armadilha.
