id: EZK.19.10
reference: Ezekiel 19:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִמְּ/ךָ֥ כַ/גֶּ֛פֶן בְּ/דָמְ/ךָ֖ עַל מַ֣יִם שְׁתוּלָ֑ה פֹּֽרִיָּה֙ וַֽ/עֲנֵפָ֔ה הָיְתָ֖ה מִ/מַּ֥יִם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/010.yaml
  text: Your mother was like a vine in your vineyard[a], planted by waters; she was fruitful and full of branches because of abundant waters.
translation:
  language: pt
  text: Sua mãe era como uma videira em seu sangue[a], plantada junto às águas; era frutífera e cheia de ramos por causa das águas abundantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em seu sangue”, expressão de sentido incerto. Alguns interpretam ou corrigem o texto como “à sua semelhança” ou “em sua vinha”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְּךָ
  choice: sua mãe
  rationale: Traduz literalmente o substantivo com sufixo possessivo. Embora a mãe represente poeticamente a casa real ou a nação no contexto, a metáfora não é explicitada no texto principal.
- source_word: כַגֶּפֶן
  choice: como uma videira
  rationale: Preserva a comparação marcada por כ e emprega o termo português corrente para גפן.
- source_word: בְּדָמְךָ
  choice: em seu sangue
  rationale: Mantém a leitura vocalizada do texto massorético, embora a expressão seja obscura. As principais interpretações ou correções propostas são registradas em nota, sem resolver silenciosamente a dificuldade.
- source_word: עַל מַיִם שְׁתוּלָה
  choice: plantada junto às águas
  rationale: Expressa de modo natural a localização da videira perto de uma fonte de água, mantendo o plural poético de מַיִם.
- source_word: פֹּרִיָּה
  choice: frutífera
  rationale: Equivalente adjetival direto e natural, adequado à imagem da videira produtiva.
- source_word: וַעֲנֵפָה
  choice: e cheia de ramos
  rationale: Comunica com clareza o adjetivo derivado de ענף, para o qual não há em português um adjetivo corrente igualmente natural.
- source_word: הָיְתָה
  choice: era
  rationale: Mantém o estado descrito no passado e concorda com os referentes femininos 'mãe' e 'videira'.
- source_word: מִמַּיִם רַבִּים
  choice: por causa das águas abundantes
  rationale: Interpreta מן como indicação de causa ou fonte da fecundidade, preservando a imagem das águas copiosas.
theological_decisions:
- issue: Tratamento da expressão obscura בְּדָמְךָ
  choice: Manter no texto principal a leitura massorética literal, “em seu sangue”, com nota explicativa.
  alternative: “à sua semelhança” ou “em sua vinha”
  rationale: A dificuldade é textual e lexical, não doutrinária. Conservar a leitura atestada no WLC evita emenda silenciosa e preserva a ambiguidade genuína para o leitor.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção deliberadamente estranha “em seu sangue” reflete a dificuldade do hebraico; a nota impede que essa obscuridade seja confundida com formulação portuguesa acidental.
