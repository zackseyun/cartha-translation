  text: וַ/תֵּ֨רֶא֙ כִּ֣י נֽוֹחֲלָ֔ה אָבְדָ֖ה תִּקְוָתָ֑/הּ וַ/תִּקַּ֛ח אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֥יר שָׂמָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/005.yaml
  text: When she saw that she had waited in vain[a], that her hope was lost, she took one of her cubs and made him a young lion.
translation:
  language: pt
  text: Quando ela viu que tinha esperado em vão[a] e que sua esperança estava perdida, tomou um de seus filhotes e fez dele um jovem leão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava enfraquecida” ou “ficou decepcionada”. O termo hebraico é difícil; o texto principal segue o sentido contextual de uma espera frustrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא כִּי
  choice: Quando ela viu que
  rationale: A construção faz avançar a narrativa e introduz o conteúdo do que a leoa percebeu; a formulação temporal é natural em português.
- source_word: נוֹחֲלָה
  choice: tinha esperado em vão
  rationale: O termo hebraico é difícil. No contexto paralelo a 'sua esperança estava perdida', a expressão comunica uma espera frustrada, sem ocultar outras possibilidades na nota.
- source_word: אָבְדָה תִּקְוָתָהּ
  choice: sua esperança estava perdida
  rationale: Preserva de modo claro e direto a imagem da esperança que se perdeu, bem como a força emotiva da lamentação.
- source_word: וַתִּקַּח אֶחָד מִגֻּרֶיהָ
  choice: tomou um de seus filhotes
  rationale: גּוּר designa aqui um filhote de leão; 'filhotes' mantém a metáfora da leoa em linguagem corrente.
- source_word: כְּפִיר
  choice: um leão jovem
  rationale: כְּפִיר designa especificamente um leão jovem, distinção lexical que convém preservar.
- source_word: שָׂמָתְהוּ
  choice: fez dele
  rationale: O verbo 'pôr/colocar' tem aqui o sentido contextual de fazer ou constituir alguém como algo; 'fez dele' é idiomático e preserva o processo figurado.
