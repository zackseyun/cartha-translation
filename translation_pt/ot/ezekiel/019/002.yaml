  text: and say[a], ‘What was your mother? A lioness. Among lions she lay down[b]; in the midst of young lions she reared her cubs.’
translation:
  language: pt
  text: 'e diga: “O que era sua mãe? Uma leoa! Entre leões, ela se deitou; no meio de leões jovens, criou[a] seus filhotes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornava numerosos os seus filhotes”. O verbo hebraico pode indicar aumento ou multiplicação, mas, neste contexto, provavelmente se refere a criar e fazer crescer a prole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: O que era
  rationale: Mantém a força interrogativa e retórica do hebraico, sem transformar a imagem em mera comparação.
- source_word: אִמְּךָ
  choice: sua mãe
  rationale: Conserva o sufixo de segunda pessoa do singular e a referência materna explícita.
- source_word: לְבִיָּא
  choice: uma leoa
  rationale: O substantivo hebraico é especificamente feminino e sustenta a imagem materna.
- source_word: בֵּין אֲרָיוֹת
  choice: Entre os leões
  rationale: Traduz diretamente o plural hebraico comum, sem ajustá-lo artificialmente ao gênero de 'leoa'.
- source_word: רָבָצָה
  choice: ela se deitava
  rationale: Expressa a postura animal indicada pelo verbo e preserva o aspecto habitual sugerido pelo contexto poético.
- source_word: בְּתוֹךְ כְּפִרִים
  choice: no meio dos leões novos
  rationale: '''Leões novos'' distingue כְּפִירִים dos filhotes ainda menores mencionados em seguida e mantém o paralelismo espacial.'
- source_word: רִבְּתָה
  choice: criava
  rationale: No contexto, o verbo indica fazer crescer ou criar a prole, embora lexicalmente também possa sugerir multiplicação.
- source_word: גּוּרֶיהָ
  choice: seus filhotes
  rationale: Termo moderno e claro para as crias da leoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A pergunta abrupta e a resposta nominal preservam a intensidade do lamento. Empregou-se 'leões novos' para não confundir כְּפִירִים com גּוּרִים, traduzido como 'filhotes'.
