id: EZK.19.6
reference: Ezekiel 19:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֥ךְ בְּ/תוֹךְ אֲרָי֖וֹת כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/006.yaml
  text: He prowled among the lions; he became a young lion[a]. He learned to tear prey; he devoured men.
translation:
  language: pt
  text: Ele rondava entre os leões; tornou-se um leão jovem. Aprendeu a despedaçar a presa; devorou pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devorou seres humanos”; literalmente, “devorou homem”. O hebraico pode empregar “homem” em sentido coletivo neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: rondava
  rationale: O hitpael de הלך indica aqui movimento repetido em meio aos leões. “Rondava” é natural em português e combina com a imagem predatória sem exceder o sentido do verbo.
- source_word: בְּתוֹךְ אֲרָיוֹת
  choice: entre os leões
  rationale: Expressa de modo claro e corrente o sentido de “no meio de/entre” e preserva a imagem do personagem inserido entre outros leões.
- source_word: כְּפִיר
  choice: leão jovem
  rationale: Designa um leão jovem e vigoroso, não necessariamente um filhote pequeno.
- source_word: הָיָה
  choice: tornou-se
  rationale: 'No desenvolvimento da alegoria, o verbo assinala progressão: ele veio a ser um leão jovem.'
- source_word: וַיִּלְמַד
  choice: aprendeu
  rationale: Traduz diretamente o verbo e evita introduzir um agente externo que o teria treinado.
- source_word: לִטְרָף טֶרֶף
  choice: a despedaçar a presa
  rationale: A construção com infinitivo e objeto cognato intensifica a ação predatória. “Despedaçar a presa” conserva a violência da metáfora do leão.
- source_word: אָדָם אָכָל
  choice: devorou pessoas
  rationale: אָדָם tem aqui provável valor coletivo, e “pessoas” comunica isso naturalmente. “Devorou” preserva a força da imagem predatória de אָכָל.
theological_decisions:
- issue: Valor singular ou coletivo de אָדָם na metáfora predatória
  choice: pessoas
  alternative: um homem; seres humanos
  rationale: O contexto favorece o uso coletivo de אָדָם. “Pessoas” evita sugerir que apenas um indivíduo foi devorado, enquanto a nota registra traduções mais literais e abrangentes sem transformar a imagem em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética breve. “Rondava” e “despedaçar” mantêm a vivacidade da alegoria; “leão jovem” evita a impressão de um filhote pequeno.
