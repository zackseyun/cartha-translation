  text: וַ/תֵּצֵ֨א אֵ֜שׁ מִ/מַּטֵּ֤ה בַדֶּ֨י/הָ֙ פִּרְיָ֣/הּ אָכָ֔לָה וְ/לֹא הָ֥יָה בָ֛/הּ מַטֵּה עֹ֖ז שֵׁ֣בֶט לִ/מְשׁ֑וֹל קִ֥ינָה הִ֖יא וַ/תְּהִ֥י לְ/קִינָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/014.yaml
  text: And fire went out from a branch of its limbs[a]; it consumed its fruit, and there was not in it a strong branch, a scepter to rule. This is a lamentation[b], and it has become a lamentation.
translation:
  language: pt
  text: E o fogo saiu de um ramo entre os seus galhos[a]; consumiu o seu fruto, e não havia nela nenhum ramo forte, nenhum cetro para governar.[b] Esta é uma lamentação e tornou-se uma lamentação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma vara dentre os seus galhos”. O hebraico מַטֶּה pode significar “ramo”, “vara” ou “bastão”. O texto principal acompanha a imagem da videira, enquanto “cetro”, mais adiante, conserva a dimensão régia.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “e nela não havia vara forte, nenhum cetro para governar”. O hebraico combina intencionalmente as imagens da videira e da autoridade real.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: E o fogo saiu
  rationale: Preserva a progressão narrativa vívida do hebraico e mantém o fogo sem artigo indefinido, com formulação natural em português.
- source_word: מִמַּטֵּה בַדֶּיהָ
  choice: de um ramo entre os seus galhos
  rationale: מַטֶּה pode significar ramo, vara ou bastão; no contexto da videira, “ramo” conserva a imagem vegetal. בַדֶּיהָ é vertido como “seus galhos”, distinguindo os dois termos sem obscurecer a relação entre eles.
- source_word: פִּרְיָהּ אָכָלָה
  choice: consumiu o seu fruto
  rationale: O sujeito feminino é o fogo, e “consumiu” é idiomático para sua ação destrutiva; “seu fruto” mantém a imagem da videira.
- source_word: וְלֹא הָיָה בָהּ
  choice: e nela não restou nenhum
  rationale: A formulação comunica naturalmente a ausência resultante após a ação do fogo, preservando a referência feminina à videira.
- source_word: מַטֵּה עֹז
  choice: ramo forte
  rationale: Mantém a imagem vegetal de מַטֶּה no contexto da videira, enquanto עֹז é expresso com clareza por “forte”.
- source_word: שֵׁבֶט לִמְשׁוֹל
  choice: cetro para governar
  rationale: “Cetro” explicita a autoridade régia de שֵׁבֶט, e “para governar” reproduz a função expressa pelo infinitivo hebraico.
- source_word: קִינָה הִיא וַתְּהִי לְקִינָה
  choice: Esta é uma lamentação e tornou-se uma lamentação
  rationale: Conserva a repetição solene e enfática do hebraico, bem como a passagem da identificação para o estado resultante.
theological_decisions:
- issue: Sobreposição das imagens vegetal e régia
  choice: Traduzir מַטֵּה como “ramo” e שֵׁבֶט como “cetro”
  alternative: Traduzir ambos por “vara/bastão” ou uniformizar toda a expressão como imagem vegetal
  rationale: 'O texto combina intencionalmente a videira com a realeza: o ramo representa alguém apto a exercer governo. A tradução preserva as duas imagens sem reduzir a tensão metafórica.'
- issue: Sentido da dupla declaração de lamentação
  choice: Preservar “Esta é uma lamentação e tornou-se uma lamentação”
  alternative: Simplificar para “Este é um cântico fúnebre” ou interpretar que apenas a personagem se tornou motivo de lamento
  rationale: A construção hebraica permite ressonância entre o poema ser uma lamentação e seu tema ter-se tornado objeto de lamento; a tradução não resolve essa ambiguidade de modo restritivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas a repetição final e a fusão das imagens botânica e régia foram preservadas.
