  yaml_path: translation/ot/ezekiel/019/007.yaml
  text: He knew their widows[a], and he laid waste their cities; the land and its fullness was desolated by the sound of his roaring.
translation:
  language: pt
  text: Ele conheceu as viúvas deles[a] e devastou as cidades deles; a terra e tudo o que nela havia ficaram desolados por causa do som do seu rugido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “conheceu as viúvas dele/deles”. Neste contexto, “conheceu” pode ter conotação hostil ou sexual; alguns entendem a frase mais concretamente como abuso de mulheres. Outros, seguindo uma leitura alternativa, traduzem: “destruiu os seus palácios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: conheceu
  rationale: Mantém o sentido normal de ידע e preserva a ambiguidade da expressão difícil; uma possível conotação hostil ou sexual é indicada na nota.
- source_word: אַלְמְנוֹתָיו
  choice: as viúvas deles
  rationale: Segue o sentido massorético de “viúvas”, entendendo-as como pertencentes às pessoas vitimadas, em paralelo com “suas cidades”; a forma hebraica e a leitura alternativa são registradas na nota.
- source_word: וְעָרֵיהֶם הֶחֱרִיב
  choice: e devastou as suas cidades
  rationale: “Devastou” expressa com naturalidade o sentido causativo de החריב e combina com o tom poético de ruína.
- source_word: וַתֵּשַׁם
  choice: ficaram desolados
  rationale: Comunica o estado resultante de desolação. O plural faz concordância semântica com “a terra e tudo o que nela havia”.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: a terra e tudo o que nela havia
  rationale: Traduz o idioma hebraico de modo claro e natural, abrangendo a terra e todo o seu conteúdo.
- source_word: מִקּוֹל שַׁאֲגָתוֹ
  choice: ao som do seu rugido
  rationale: Expressa a causa ou ocasião da devastação e preserva a imagem do leão no contexto.
theological_decisions:
- issue: A expressão difícil אַלְמְנוֹתָיו na metáfora de juízo
  choice: Manter “viúvas” no texto e preservar a ambiguidade por meio de nota.
  alternative: Traduzir “seus palácios” com base numa leitura alternativa, ou explicitar abuso sexual.
  rationale: A dificuldade é lexical e textual, não doutrinária. A tradução permanece próxima do Texto Massorético sem definir uma conotação incerta nem adotar silenciosamente uma emenda.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo poético e sinaliza, sem resolvê-la indevidamente, a conhecida dificuldade textual da primeira oração.
