revisions:
- from: As nações ouviram falar dele[a]; ele foi apanhado na cova que abriram[b], e o levaram com ganchos[c] para a terra do Egito.
  to: As nações ouviram falar dele[a]; ele foi apanhado na cova deles[b], e o levaram com ganchos[c] para a terra do Egito.
  rationale: A revisão substitui «na cova que abriram» por «na cova deles», preservando o possessivo hebraico sem introduzir a ação de cavar. Também ajusta a alternativa da nota a para evitar a conotação de obediência de «dar ouvidos» e refletir a alternativa literal sem desfazer a leitura contextual principal.
