  yaml_path: translation/ot/ezekiel/019/004.yaml
  text: The nations heard of him[a]; he was caught in their pit[c][b], and they brought him with hooks to the land of Egypt.
translation:
  language: pt
  text: As nações ouviram falar dele[a]; ele foi apanhado na cova deles[b], e o levaram com ganchos[c] para a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouviram-no”. A expressão hebraica também pode indicar que ouviram notícias a respeito dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na armadilha deles”. A imagem é a de uma cova usada para capturar animais.'
    reason: lexical_alternative
  - marker: c
    text: Os ganchos ou argolas eram usados para conter animais capturados ou prisioneiros.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: ouviram falar dele
  rationale: A expressão hebraica, neste contexto, indica que as nações receberam notícias a respeito dele, não necessariamente que ouviram sua voz diretamente.
- source_word: גּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos estrangeiros envolvidos na captura; evita o sentido religioso posterior que 'gentios' poderia sugerir.
- source_word: בְּשַׁחְתָּם
  choice: na cova que abriram
  rationale: שַׁחַת designa uma cova ou fosso, aqui usado como armadilha de caça. A oração explicita naturalmente em português que a cova pertencia às nações por ter sido preparada por elas.
- source_word: נִתְפָּשׂ
  choice: foi apanhado
  rationale: Mantém a forma passiva e combina com a imagem de um leão capturado numa armadilha.
- source_word: וַיְבִאֻהוּ
  choice: o levaram
  rationale: O Hifil de בוא significa fazer vir ou trazer; no deslocamento até o Egito, 'levaram' é a forma idiomática em português.
- source_word: בַחַחִים
  choice: com ganchos
  rationale: חַחִים refere-se a ganchos ou argolas empregados para conter animais ou prisioneiros; o termo geral preserva a falta de especificação do hebraico.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: para a terra do Egito
  rationale: Conserva a expressão geográfica formal do hebraico sem perder naturalidade em português.
