base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/011.yaml
  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
translation:
  language: pt
  text: Ela tinha ramos fortes, próprios para cetros de governantes, e sua estatura elevou-se acima da folhagem densa[a]; destacava-se por sua altura e pela abundância de seus ramos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acima da folhagem densa”. O hebraico provavelmente se refere a ramos ou vegetação espessa; a tradução tradicional “acima das nuvens” também é possível, mas é menos provável neste contexto de videira.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטּוֹת עֹז
  choice: ramos fortes
  rationale: מַטּוֹת pode designar varas, bastões ou ramos. No contexto da alegoria da videira, “ramos” preserva a imagem vegetal, enquanto עֹז comunica força.
- source_word: אֶל שִׁבְטֵי מֹשְׁלִים
  choice: para cetros de governantes
  rationale: שֵׁבֶט tem aqui o sentido régio de “cetro”, em associação com מֹשְׁלִים, “governantes”. A preposição אֶל é traduzida diretamente por “para”, sem acrescentar explicitamente a ideia interpretativa de aptidão.
- source_word: וַתִּגְבַּהּ קוֹמָתוֹ
  choice: e sua altura se elevou
  rationale: A formulação mantém a referência à estatura ou altura da videira e reproduz o movimento ascendente do verbo, sem impor o termo botânico mais específico “tronco”.
- source_word: עַל בֵּין עֲבֹתִים
  choice: entre a folhagem densa
  rationale: עֲבֹתִים provavelmente indica vegetação espessa, ramos densos ou folhagem cerrada neste contexto vegetal. “Folhagem densa” é natural em português e preserva a leitura contextual; a alternativa tradicional “nuvens” é registrada em nota.
- source_word: וַיֵּרָא
  choice: destacava-se
  rationale: O nifal expressa que a videira era vista ou se fazia visível. “Destacava-se” transmite de modo natural sua visibilidade conspícua, resultante da altura e dos muitos ramos.
- source_word: בְגָבְהוֹ
  choice: por sua altura
  rationale: O בְּ pode indicar a característica ou causa pela qual ela se tornava visível; “por sua altura” expressa essa relação com clareza.
- source_word: בְּרֹב דָּלִיֹּתָיו
  choice: pela abundância de seus ramos
  rationale: רֹב indica grande quantidade, e דָּלִיּוֹת são ramos ou ramagens pendentes. A escolha é clara, digna e coerente com a metáfora da videira.
