    issue: «seu ramo forte foi arrancado»
    rationale: O verbo hebraico הִתְפָּרְקוּ não repete a ideia de desenraizar de וַתֻּתַּשׁ; denota antes ser quebrado, despedaçado ou separado violentamente. A repetição de «arrancada/arrancado» reduz essa distinção poética.
  - severity: low
    issue: «o vento leste»
    rationale: É compreensível, mas «o vento do leste» é mais natural no português moderno amplo e continua a traduzir precisamente רוּחַ הַקָּדִים.
