source:
  edition: WLC
  text: וַ/תֻּתַּ֤שׁ בְּ/חֵמָה֙ לָ/אָ֣רֶץ הֻשְׁלָ֔כָה וְ/ר֥וּחַ הַ/קָּדִ֖ים הוֹבִ֣ישׁ פִּרְיָ֑/הּ הִתְפָּרְק֧וּ וְ/יָבֵ֛שׁוּ מַטֵּ֥ה עֻזָּ֖/הּ אֵ֥שׁ אֲכָלָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/012.yaml
  text: But she was uprooted in wrath; she was thrown down to the ground[a]. And the east wind dried up her fruit; her strong branch was torn off and withered; fire consumed it.
translation:
  language: pt
  text: Mas ela foi arrancada pela raiz com furor e lançada por terra. O vento do leste ressecou seu fruto; seu ramo vigoroso[a] foi quebrado e secou; o fogo o consumiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu cetro poderoso” ou “a vara da sua força”. O termo hebraico pode evocar tanto um ramo quanto a autoridade real nesta lamentação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּתַּשׁ
  choice: foi arrancada pela raiz
  rationale: No contexto da videira, o passivo de נתשׁ indica remoção violenta do solo. A expressão portuguesa explicita de modo natural a imagem de desenraizamento.
- source_word: בְּחֵמָה
  choice: com furor
  rationale: חֵמָה expressa ira intensa, ardente. “Com furor” mantém a força e a concisão da expressão hebraica.
- source_word: לָאָרֶץ הֻשְׁלָכָה
  choice: lançada por terra
  rationale: A formulação comunica tanto o movimento violento quanto o rebaixamento, em registro digno e corrente.
- source_word: רוּחַ הַקָּדִים
  choice: o vento leste
  rationale: É a expressão hebraica habitual para o vento destrutivo vindo do oriente; “vento leste” é claro e natural em português.
- source_word: הוֹבִישׁ פִּרְיָהּ
  choice: ressecou seu fruto
  rationale: 'O hifil de יבשׁ tem sentido causativo: o vento faz o fruto secar. “Ressecou” preserva a imagem agrícola sem formulação pesada.'
- source_word: הִתְפָּרְקוּ
  choice: foi arrancado
  rationale: O verbo comunica separação violenta ou desmembramento. No fluxo poético, a forma singular em português liga a ação ao “ramo forte”, sem perder a violência da imagem.
- source_word: וְיָבֵשׁוּ
  choice: e secou
  rationale: Descreve o ramo depois de separado. “Secou” é direto e evita repetir “ressecou” de maneira artificial.
- source_word: מַטֵּה עֻזָּהּ
  choice: seu ramo forte
  rationale: מַטֶּה pode designar ramo, vara ou cetro. A tradução principal mantém a imagem imediata da videira, enquanto a nota registra a ressonância régia.
- source_word: אֵשׁ אֲכָלָתְהוּ
  choice: o fogo o consumiu
  rationale: A expressão conserva a personificação hebraica do fogo que devora e comunica com naturalidade a destruição total.
theological_decisions:
- issue: A metáfora vegetal e a ressonância régia de מַטֵּה עֻזָּהּ
  choice: Traduzir no texto principal como “seu ramo forte” e registrar em nota a possibilidade de “seu cetro poderoso” ou “a vara da sua força”.
  alternative: Traduzir diretamente como “seu cetro poderoso” ou “a vara da sua força”.
  rationale: O contexto imediato descreve uma videira arrancada, seu fruto e seu ramo, mas a lamentação também representa o poder régio, sobretudo à luz do versículo 11. A solução preserva a imagem botânica sem apagar a alusão à realeza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão poéticas foram preservadas; o marcador da nota foi colocado junto à expressão ambígua a que efetivamente se refere.
