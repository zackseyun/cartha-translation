review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a sequência imagética e o sentido geral do hebraico: desenraizamento em furor, queda por terra, vento oriental que seca o fruto e destruição pelo fogo. Contudo, «foi arrancado» repete para מַטֵּה עֻזָּהּ a imagem verbal já usada para נתשׁ e não representa tão bem הִתְפָּרְקוּ, que sugere quebra ou desintegração/separação violenta.'
  naturalness: O português é claro e de registro apropriado. «Vento do leste» é um pouco mais corrente e transparente para leitores internacionais do que «vento leste». «Ramo vigoroso» soa mais idiomático neste contexto do que «ramo forte».
  terminology: «Arrancada pela raiz» comunica bem נתשׁ no contexto da videira. A nota preserva de modo equilibrado a ambiguidade de מַטֶּה entre ramo e símbolo de poder régio, sem impor uma leitura doutrinária. «Cetro poderoso» e «vara da sua força» são alternativas defensáveis.
  issues:
