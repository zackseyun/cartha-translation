revisions:
- from: Mas ela foi arrancada pela raiz com furor e lançada por terra. O vento leste ressecou seu fruto; seu ramo forte[a] foi arrancado e secou; o fogo o consumiu.
  to: Mas ela foi arrancada pela raiz com furor e lançada por terra. O vento do leste ressecou seu fruto; seu ramo vigoroso[a] foi quebrado e secou; o fogo o consumiu.
  rationale: A revisão substitui a repetição de «arrancado» por «quebrado», que distingue a quebra violenta do ramo do desenraizamento inicial da videira. Também ajusta «vento leste» para «vento do leste» e «ramo forte» para «ramo vigoroso», sem alterar a metáfora nem a ambiguidade régia documentada na nota. A flexão singular mantém a leitura poética coletiva já adotada no texto-base auditado e é compatível com o sufixo singular no membro final.
