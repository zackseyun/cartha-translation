  text: וַ/תַּ֛עַל אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/003.yaml
  text: She brought up one of her cubs; he became a young lion[a], and he learned to tear prey; he devoured people.
translation:
  language: pt
  text: Ela criou um dos seus filhotes; ele se tornou um leão jovem. Aprendeu a despedaçar a presa e devorou pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ser humano” ou “homem”, no singular.'
    reason: Preserva a forma singular e a amplitude lexical de אָדָם, traduzido no texto de modo coletivo e natural por “pessoas”.
lexical_decisions:
- source_word: וַתַּעַל
  choice: Ela criou
  rationale: O hifil de עלה pode significar “fazer subir” ou “fazer crescer”. No contexto materno da leoa, “criou” expressa com naturalidade o ato de fazer o filhote crescer.
- source_word: אֶחָד מִגֻּרֶיהָ
  choice: um dos seus filhotes
  rationale: גּוּר designa o filhote de um animal, aqui especificamente de uma leoa; a formulação também preserva a construção partitiva hebraica.
- source_word: כְּפִיר הָיָה
  choice: ele se tornou um leão jovem
  rationale: כְּפִיר é um leão jovem, já em idade de caçar. “Se tornou” comunica a progressão narrativa do filhote ao jovem leão, embora הָיָה também possa ser entendido como “era”.
- source_word: וַיִּלְמַד לִטְרָף טֶרֶף
  choice: Aprendeu a despedaçar a presa
  rationale: A construção cognata com טרף intensifica a ação predatória. “Despedaçar a presa” preserva sua violência e evita a repetição pouco natural em português.
- source_word: אָדָם אָכָל
  choice: devorou pessoas
  rationale: אָדָם, embora formalmente singular, pode designar o ser humano de modo genérico ou coletivo. “Pessoas” comunica naturalmente que a presa era humana, e “devorou” corresponde ao contexto predatório de אָכָל.
theological_decisions:
- issue: Sentido e número de אָדָם como objeto de אָכָל
  choice: pessoas
  alternative: um ser humano; homem
  rationale: O hebraico emprega אָדָם no singular, mas o termo pode ter valor genérico ou coletivo. O plural natural “pessoas” evita sugerir sem necessidade uma única vítima masculina, enquanto a nota preserva a forma e as alternativas do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem violenta da lamentação é mantida sem suavização, e a sequência de crescimento do filhote até tornar-se predador permanece clara.
