source:
  edition: WLC
  text: וַֽ/יִּתְּנֻ֤/הוּ בַ/סּוּגַר֙ בַּֽ/חַחִ֔ים וַ/יְבִאֻ֖/הוּ אֶל מֶ֣לֶךְ בָּבֶ֑ל יְבִאֻ֨/הוּ֙ בַּ/מְּצֹד֔וֹת לְמַ֗עַן לֹא יִשָּׁמַ֥ע קוֹל֛/וֹ ע֖וֹד אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
translation:
  language: pt
  text: Puseram-no numa jaula, com ganchos, e o levaram ao rei da Babilônia. Levaram-no para fortalezas[a], para que sua voz[b] nunca mais fosse ouvida nos montes de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para lugares fortificados”, “para uma prisão” ou, possivelmente, “para obras de cerco”; o termo hebraico pode indicar fortalezas ou lugares associados à captura e ao confinamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu rugido”; literalmente, “sua voz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֻהוּ בַסּוּגַר
  choice: Puseram-no numa jaula
  rationale: O verbo נתן tem aqui o sentido comum de pôr ou colocar. “Jaula” preserva a imagem do leão capturado, enquanto “prisão” tornaria a metáfora mais abstrata.
- source_word: בַּחַחִים
  choice: com ganchos
  rationale: חַחִים designa ganchos ou argolas usados para dominar animais ou prisioneiros. O texto não explicita onde eram presos, por isso não se acrescenta “nas mandíbulas” ou “no focinho”.
- source_word: וַיְבִאֻהוּ אֶל מֶלֶךְ בָּבֶל
  choice: e o levaram ao rei da Babilônia
  rationale: No hifil, בוא significa normalmente “levar” ou “trazer”. “Levaram” é natural em português para o deslocamento até o rei da Babilônia.
- source_word: יְבִאֻהוּ בַּמְּצֹדוֹת
  choice: Levaram-no para fortalezas
  rationale: מְצֹדוֹת pode indicar fortalezas, lugares fortificados ou locais de detenção. “Fortalezas” conserva o sentido concreto e a ambiguidade relativa ao tipo de confinamento.
- source_word: לְמַעַן לֹא יִשָּׁמַע קוֹלוֹ עוֹד
  choice: para que sua voz nunca mais fosse ouvida
  rationale: קוֹל significa literalmente “voz” ou “som”. “Voz” mantém simultaneamente a imagem do leão e a referência humana ao governante representado.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: nos montes de Israel
  rationale: A expressão designa a região montanhosa de Israel; “nos montes de Israel” é literal, corrente e coerente com o uso recorrente em Ezequiel.
theological_decisions:
- issue: Identidade histórica do leão ou príncipe capturado
  choice: Manter a figura sem identificar nominalmente o governante
  alternative: Inserir no texto o nome de Joaquim ou de outro rei de Judá
  rationale: O lamento representa os governantes de Judá por meio de leões, mas este versículo não nomeia o rei. Uma identificação explícita resolveria no texto uma questão histórica que o hebraico deixa implícita.
- issue: Relação entre a voz humana e o rugido do leão
  choice: Traduzir literalmente קוֹל por “voz”
  alternative: Traduzir por “rugido”
  rationale: “Rugido” reforçaria a metáfora animal, mas estreitaria o sentido e ocultaria a referência ao poder e à presença pública do governante.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção mantém a metáfora do leão capturado, evita identificar um rei específico e conserva as ambiguidades lexicais relevantes em notas.
