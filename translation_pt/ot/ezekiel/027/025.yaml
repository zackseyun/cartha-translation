base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/025.yaml
  text: The ships of Tarshish were your carriers for your merchandise[b][a], and you were filled and became very heavy in the heart of the seas.
translation:
  language: pt
  text: Os navios de Társis serviam como transportadores das suas mercadorias.[a] Você ficou repleta e ficou muito pesada no coração dos mares.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é incomum; no contexto comercial, apresenta os navios como transportadores marítimos das mercadorias de Tiro.
    reason: lexical_alternative
  - marker: b
    text: Isto é, no meio ou nas profundezas dos mares.
    reason: cultural_note
lexical_decisions:
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: os navios de Társis
  rationale: Preserva a expressão hebraica e a associação geográfica e comercial dos navios, sem reduzi-la genericamente a “navios mercantes”.
- source_word: שָׁרוֹתַיִךְ
  choice: eram as caravanas que transportavam
  rationale: O termo é raro e, no contexto do comércio de Tiro, descreve os navios como equivalentes marítimos de caravanas. A oração relativa torna a imagem compreensível em português sem eliminá-la.
- source_word: מַעֲרָבֵךְ
  choice: as suas mercadorias
  rationale: Neste capítulo, o substantivo se refere aos bens envolvidos no comércio ou na troca; “mercadorias” mantém o registro comercial.
- source_word: וַתִּמָּלְאִי
  choice: você ficou repleta
  rationale: Expressa o resultado de ser enchida ou carregada, conservando a personificação feminina de Tiro.
- source_word: וַתִּכְבְּדִי מְאֹד
  choice: muito pesada
  rationale: Mantém a imagem física de Tiro carregada de mercadorias; o contexto marítimo favorece “pesada” em vez do sentido abstrato de “honrada”.
- source_word: בְּלֵב יַמִּים
  choice: no coração dos mares
  rationale: Conserva a metáfora hebraica vívida, que indica o meio ou as profundezas do mar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para a personificação feminina de Tiro. A tradução preserva tanto a metáfora comercial das caravanas quanto a expressão poética “coração dos mares”.
