base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/017.yaml
  text: Judah and the land of Israel—they were your merchants; they traded for your merchandise with wheat of Minnith[a], pannag, honey, oil, and balm.
translation:
  language: pt
  text: Judá e a terra de Israel eram teus comerciantes; negociavam as tuas mercadorias com trigo de Minite, panague[a], mel, óleo e bálsamo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O significado de “panague” é incerto; entre as propostas estão um doce, uma especiaria ou um tipo de produto de pastelaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלָיִךְ
  choice: seus comerciantes
  rationale: O substantivo designa pessoas que praticam comércio; a escolha é natural em português e se ajusta ao lamento comercial sobre Tiro.
- source_word: בְּחִטֵּי מִנִּית
  choice: trigo de Minite
  rationale: Preserva a relação construta e o topônimo, provavelmente indicando a procedência ou uma qualidade conhecida do trigo.
- source_word: פַנַּג
  choice: panague
  rationale: Como o termo hebraico é raro e de sentido incerto, a transliteração adaptada à ortografia portuguesa evita uma identificação excessivamente segura; a nota registra propostas relevantes.
- source_word: דְבַשׁ
  choice: mel
  rationale: Corresponde ao sentido lexical comum do termo.
- source_word: שֶׁמֶן
  choice: óleo
  rationale: Mantém o sentido amplo do hebraico, sem especificar azeite de oliva, embora isso seja possível no contexto.
- source_word: צֹרִי
  choice: bálsamo
  rationale: Designa uma resina aromática valiosa; “bálsamo” é claro, tradicional e adequado ao contexto.
- source_word: נָתְנוּ מַעֲרָבֵךְ
  choice: davam em troca de suas mercadorias
  rationale: Expressa de modo natural a ideia comercial de entregar os produtos enumerados em troca das mercadorias de Tiro, sem ocultar a estrutura concreta do hebraico.
- source_word: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל
  choice: Judá e a terra de Israel
  rationale: Conserva a menção explícita à “terra de Israel”, sem reduzi-la simplesmente a “Israel”.
