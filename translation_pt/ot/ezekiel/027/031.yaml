base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/031.yaml
  text: They will make themselves bald for you[a], and put on sackcloth, and they will weep over you with bitterness of soul, with bitter mourning.
translation:
  language: pt
  text: Eles rasparão a cabeça por sua causa, vestirão pano de saco e chorarão por você com amargura de alma[a], em amargo lamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com profunda angústia”. Hebraico: “com amargura de alma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיחוּ אֵלַיִךְ קָרְחָה
  choice: rasparão a cabeça por sua causa
  rationale: O hifil de קרח com o substantivo קָרְחָה descreve o ato de produzir calvície, isto é, raspar a cabeça como sinal de luto. A expressão portuguesa explicita naturalmente a parte do corpo sem perder a imagem ritual.
- source_word: וְחָגְרוּ שַׂקִּים
  choice: vestirão pano de saco
  rationale: O hebraico diz literalmente que se cingirão de tecidos de saco. Esta formulação corrente preserva o sinal público de luto e penitência.
- source_word: וּבָכוּ אֵלַיִךְ
  choice: chorarão por você
  rationale: בכה significa chorar, e אֶל, neste contexto de lamentação, aponta para Tiro como objeto ou motivo do pranto.
- source_word: בְּמַר נֶפֶשׁ
  choice: com amargura de alma
  rationale: Mantém a expressão antropológica hebraica e a ideia de profunda aflição interior, sem reduzi-la apenas a uma emoção específica.
- source_word: מִסְפֵּד מָר
  choice: em amargo lamento
  rationale: Preserva a repetição de 'amargo/amargura' no hebraico e apresenta מִסְפֵּד como lamentação fúnebre intensa.
