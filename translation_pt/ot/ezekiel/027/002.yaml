  text: And you[a], son of man, raise a lamentation over Tyre,
translation:
  language: pt
  text: 'E você, filho do homem, levante[a] uma lamentação sobre Tiro:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entoe uma lamentação sobre Tiro”. O verbo hebraico significa literalmente “levantar” e faz parte de uma expressão convencional para iniciar ou proferir uma lamentação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: E você
  rationale: A conjunção seguida do pronome independente marca transição e ênfase no destinatário; “E você” preserva o fluxo do discurso hebraico sem explicá-lo em excesso.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: É a fórmula característica com que Deus se dirige a Ezequiel. A tradução mantém a imagem e a formulação tradicional do hebraico.
- source_word: שָׂא
  choice: levante
  rationale: O verbo significa literalmente “levantar” ou “carregar” e, com קִינָה, forma uma expressão convencional para iniciar ou proferir uma lamentação. “Levante” conserva a metáfora, enquanto a nota esclarece o sentido idiomático.
- source_word: עַל
  choice: por
  rationale: Neste contexto de lamentação, a preposição indica aquele que é objeto do lamento. Em português, “lamentação por Tiro” é natural e evita a conotação hostil que “contra” poderia introduzir.
- source_word: צֹר
  choice: Tiro
  rationale: Forma tradicional e corrente em português para o nome da cidade fenícia.
- source_word: קִינָה
  choice: lamentação
  rationale: O substantivo designa um lamento formal ou cântico fúnebre. “Lamentação” preserva o registro profético solene sem restringir indevidamente o gênero.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém-se a fórmula profética tradicional “filho do homem” e a metáfora hebraica “levante”, esclarecida em nota. Os dois-pontos refletem que a ordem introduz a lamentação que vem a seguir.
