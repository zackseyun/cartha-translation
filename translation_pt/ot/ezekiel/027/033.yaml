base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/033.yaml
  text: When your wares went out from the seas[a], you satisfied many peoples[b]; with your abundant wealth and your merchandise you enriched the kings of the earth.
translation:
  language: pt
  text: Quando as suas mercadorias saíram dos mares, você satisfez muitos povos; com a abundância das suas riquezas e dos seus produtos, enriqueceu os reis da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os reis do país”. O hebraico אֶרֶץ pode significar “terra” em sentido amplo ou “país/território”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת
  choice: Quando ... saíam
  rationale: A preposição בְּ com o infinitivo construto de יצא introduz uma oração temporal. O imperfeito em português apresenta naturalmente a atividade comercial recorrente descrita no lamento.
- source_word: עִזְבוֹנַיִךְ
  choice: as suas mercadorias
  rationale: O substantivo designa bens comerciais ou carga de exportação. “Mercadorias” é claro e corrente em português.
- source_word: מִיַּמִּים
  choice: dos mares
  rationale: Mantém o plural hebraico e a imagem marítima de Tiro, sem normalizá-lo para o singular.
- source_word: הִשְׂבַּעַתְּ
  choice: você satisfazia
  rationale: O hifil de שבע expressa fazer ficar satisfeito ou suprir plenamente; “satisfazia” preserva essa ideia no contexto do comércio.
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: “Povos” traduz diretamente עַמִּים e evita sugerir especificamente os Estados-nação modernos.
- source_word: בְּרֹב הוֹנַיִךְ
  choice: com a abundância das suas riquezas
  rationale: A construção comunica meio ou circunstância; esta formulação é natural e mantém tanto a noção de abundância quanto a de riqueza.
- source_word: וּמַעֲרָבַיִךְ
  choice: e dos seus produtos
  rationale: מַעֲרָב designa bens de troca ou comércio. “Produtos” evita uma repetição pesada de “mercadorias” sem perder o sentido comercial.
- source_word: הֶעֱשַׁרְתְּ
  choice: você enriquecia
  rationale: O hifil de עשר significa tornar rico ou enriquecer; a escolha é direta e idiomática.
- source_word: מַלְכֵי אָרֶץ
  choice: os reis da terra
  rationale: No quadro internacional do comércio de Tiro, “terra” preserva o alcance amplo e a retórica elevada, embora אֶרֶץ também possa significar “país” ou “território”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A concordância no feminino do hebraico dirige-se a Tiro; em português, o pronome “você” retoma a cidade personificada. Os verbos no imperfeito apresentam a atividade comercial continuada ou habitual. A imagem incomum de mercadorias que saem “dos mares” foi mantida, respeitando a formulação do texto hebraico.
