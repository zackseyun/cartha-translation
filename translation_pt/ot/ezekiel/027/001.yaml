  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'A palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por «SENHOR»; nesta tradução, transliterado «Yahweh».
    reason: Identificação do nome divino e tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: O wayyiqtol de היה funciona como introdução narrativa da fórmula profética. Em português natural, seu valor é incorporado ao verbo «veio», sem a expressão pesada «e aconteceu».
- source_word: דְבַר
  choice: a palavra
  rationale: Na construção דְבַר יְהוָה, «a palavra» preserva a fórmula profética tradicional e sua ressonância teológica, sem explicitar interpretativamente «mensagem».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo pelo título tradicional «SENHOR».
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa de modo direto e natural o movimento da palavra em direção ao profeta.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta apresentada no versículo seguinte; «dizendo» mantém a fórmula hebraica de modo claro e corrente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» conserva o caráter de nome próprio e evita substituí-lo silenciosamente por um título; a nota informa a tradição de tradução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação preserva a fórmula profética hebraica; omite-se o «E» inicial por naturalidade em português, sem perda do valor sequencial contextual.
