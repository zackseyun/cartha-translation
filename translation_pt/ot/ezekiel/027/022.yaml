  text: רֹכְלֵ֤י שְׁבָא֙ וְ/רַעְמָ֔ה הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/רֹ֨אשׁ כָּל בֹּ֜שֶׂם וּ/בְ/כָל אֶ֤בֶן יְקָרָה֙ וְ/זָהָ֔ב נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/022.yaml
  text: The merchants of Sheba and Raamah—they were your merchants; with the finest of every spice[a], with every precious stone, and gold, they paid for your wares.
translation:
  language: pt
  text: Os comerciantes de Sabá e Raamá eram teus comerciantes; com o melhor de todas as especiarias, com todas as pedras preciosas e com ouro, pagavam[a] pelas tuas mercadorias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “davam”. Aqui, o verbo tem sentido comercial, de pagar ou dar em troca.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלֵי ... רֹכְלָיִךְ
  choice: Os comerciantes ... eram seus comerciantes
  rationale: Mantém a repetição deliberada do hebraico e identifica os envolvidos no comércio de Tiro. “Comerciantes” é claro e natural no contexto.
- source_word: שְׁבָא וְרַעְמָה
  choice: Sabá e Raamá
  rationale: Emprega as formas portuguesas tradicionais dos nomes próprios.
- source_word: בְּרֹאשׁ כָּל בֹּשֶׂם
  choice: com as melhores especiarias
  rationale: רֹאשׁ tem aqui o sentido idiomático de “melhor” ou “mais seleto”, e בֹּשֶׂם designa produtos aromáticos ou especiarias de luxo.
- source_word: וּבְכָל אֶבֶן יְקָרָה
  choice: todo tipo de pedra preciosa
  rationale: Expressa naturalmente em português o singular coletivo hebraico sem sugerir uma única pedra de cada classe.
- source_word: וְזָהָב
  choice: e ouro
  rationale: Tradução direta do nome da mercadoria.
- source_word: נָתְנוּ עִזְבוֹנָיִךְ
  choice: pagavam pelas suas mercadorias
  rationale: Embora נָתְנוּ signifique literalmente “deram”, a construção tem força transacional neste catálogo comercial. “Pagavam pelas suas mercadorias” comunica claramente a troca, enquanto a nota preserva a forma literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A repetição de “comerciantes” preserva a estrutura enfática do hebraico; a ordem da segunda oração foi ajustada para tornar claro que especiarias, pedras preciosas e ouro eram o pagamento pelas mercadorias de Tiro.
