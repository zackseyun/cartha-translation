lexical_decisions:
- source_word: דְּדָן
  choice: Dedã
  rationale: Nome próprio de lugar, vertido segundo a forma tradicional e natural em português.
- source_word: רֹכַלְתֵּךְ
  choice: negociava com você
  rationale: O verbo רכל, neste contexto comercial, indica atividade mercantil; a formulação preserva o sufixo de segunda pessoa feminina que se refere diretamente a Tiro.
- source_word: בְּבִגְדֵי חֹפֶשׁ
  choice: mantas de sela
  rationale: בגד designa peças de tecido, enquanto חֹפֶשׁ parece ser aqui um termo técnico raro ligado a equipamento de montaria. A expressão portuguesa comunica o referente provável sem ocultar a incerteza lexical, registrada em nota.
- source_word: לְרִכְבָּה
  choice: para montaria
  rationale: Derivado de רכב, indica uso relacionado a montar ou cavalgar; 'para montaria' mantém a referência ampla sem especificar cavalos ou carros.
theological_decisions: []
