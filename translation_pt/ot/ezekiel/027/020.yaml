  text: Dedan traded with you in saddlecloths for riding[a].
translation:
  language: pt
  text: Dedã negociava com você mantas de sela para montaria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dedã era seu mercador de vestes para montaria”; o sentido exato do termo hebraico que designa esse artigo têxtil é incerto.'
