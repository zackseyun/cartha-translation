  register: Português moderno, claro e digno, com leitura natural no Brasil. 'Negociava com você' reproduz a relação comercial com Tiro; 'mantas de sela' expressa o sentido contextual mais provável, e a nota conserva a ambiguidade do raro termo hebraico.
