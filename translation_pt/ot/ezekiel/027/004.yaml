lexical_decisions:
- source_word: בְּלֵב
  choice: no coração de
  rationale: Preserva a metáfora espacial de לֵב, que aqui indica o interior ou centro, e soa natural em português.
- source_word: יַמִּים
  choice: os mares
  rationale: Mantém o plural hebraico e a imagem marítima ligada a Tiro.
- source_word: גְּבוּלַיִךְ
  choice: seus limites
  rationale: Expressa diretamente a ideia de fronteiras ou extensão territorial sem introduzir a interpretação mais específica de 'costas'.
- source_word: בֹּנַיִךְ
  choice: seus construtores
  rationale: Conserva a amplitude da metáfora hebraica, na qual Tiro é retratada ao mesmo tempo como cidade e como embarcação.
- source_word: כָּלְלוּ
  choice: aperfeiçoaram
  rationale: Comunica que os construtores levaram a beleza de Tiro à plenitude, embora 'completaram' também seja lexicalmente possível.
- source_word: יָפְיֵךְ
  choice: sua beleza
  rationale: É a tradução mais direta e preserva a personificação poética de Tiro.
