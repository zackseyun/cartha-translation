  text: All the inhabitants of the coastlands are appalled at you[a], and their kings shudder with horror[c][b]; their faces are convulsed.
translation:
  language: pt
  text: Todos os habitantes das terras costeiras ficam estarrecidos diante de você[a], e seus reis estremecem de horror[b]; seus rostos se contorcem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os habitantes das ilhas”. O termo hebraico pode se referir a ilhas ou, em sentido mais amplo, a terras marítimas e costeiras.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “estremecem um estremecimento”, expressão hebraica intensiva que indica horror extremo.
    reason: lexical_alternative
  - marker: c
    text: A última expressão hebraica é difícil. Outras traduções possíveis são “seus rostos tremem” ou “seus rostos ficam transtornados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יֹשְׁבֵי הָאִיִּים
  choice: Todos os habitantes das terras costeiras
  rationale: O particípio em construção significa “habitantes de”. אִיִּים pode designar ilhas ou, de modo mais amplo, terras marítimas e costeiras; no oráculo contra a cidade portuária de Tiro, “terras costeiras” comunica bem o alcance sem restringi-lo a ilhas.
- source_word: שָׁמְמוּ עָלָיִךְ
  choice: ficam estarrecidos por causa de você
  rationale: O verbo descreve espanto devastador diante da queda de Tiro. “Ficam estarrecidos” exprime a reação intensa, e “por causa de você” traduz עַל como a causa ou ocasião desse assombro.
- source_word: וּמַלְכֵיהֶם שָׂעֲרוּ שַׂעַר
  choice: seus reis estremecem de horror
  rationale: O verbo e seu acusativo cognato formam uma expressão intensiva de violenta agitação. A formulação portuguesa evita a reprodução artificial “estremecem um estremecimento” e conserva a força emocional da imagem.
- source_word: רָעֲמוּ פָּנִים
  choice: o rosto deles se contorce
  rationale: A expressão hebraica é rara e difícil. Esta tradução preserva a imagem visível de uma fisionomia violentamente perturbada, sem ocultar em nota outras leituras possíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular coletivo “o rosto deles” soa natural e mantém a referência distributiva aos reis. O ponto e vírgula organiza as duas reações paralelas sem suavizar a intensidade poética.
