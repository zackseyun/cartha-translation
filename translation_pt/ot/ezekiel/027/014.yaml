  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
translation:
  language: pt
  text: Os de Bete-Togarma[a] davam cavalos, cavaleiros[b] e mulas em troca das suas mercadorias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da casa de Togarma”. A expressão hebraica pode indicar o povo ou a região associados a Togarma, não necessariamente uma família ou residência literal.
    reason: lexical_alternative
  - marker: b
    text: Ou “cavalos de cavalaria”. O termo hebraico geralmente significa cavaleiros ou cavalaria, mas, por aparecer numa lista de mercadorias ao lado de cavalos e mulas, talvez designe aqui animais destinados à cavalaria.
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  choice: Os de Bete-Togarma
  rationale: A construção com בֵּית pode designar a casa, o povo ou a região vinculada a Togarma. No catálogo comercial, “os de Bete-Togarma” exprime naturalmente os negociantes dessa procedência sem reduzi-los a uma família literal.
- source_word: סוּסִים
  choice: cavalos
  rationale: Equivalente direto do plural hebraico e adequado à lista de animais negociados.
- source_word: וּפָרָשִׁים
  choice: cavaleiros
  rationale: O termo normalmente designa cavaleiros ou tropas montadas. Embora o contexto mercantil possa sugerir cavalos de cavalaria, a tradução principal conserva o sentido lexical mais comum e registra a alternativa em nota.
- source_word: וּפְרָדִים
  choice: mulas
  rationale: Equivalente português direto do animal mencionado.
- source_word: נָתְנוּ
  choice: davam ... em troca
  rationale: O sentido básico é “deram”, mas, neste contexto comercial, a expressão descreve os bens fornecidos como pagamento ou permuta. “Davam ... em troca” preserva o verbo e torna explícita a relação mercantil.
- source_word: עִזְבוֹנָיִךְ
  choice: suas mercadorias
  rationale: O substantivo se refere aos bens comerciais de Tiro. “Mercadorias” é claro, corrente e apropriado ao registro do capítulo.
