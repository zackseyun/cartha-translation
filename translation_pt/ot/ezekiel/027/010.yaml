base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/010.yaml
  text: Persia[a], Lud, and Put were in your army as your men of war. They hung shield and helmet in you[b]; they gave you splendor.
translation:
  language: pt
  text: Pérsia, Lude e Pute estavam no seu exército como seus guerreiros. Penduravam em você escudo e capacete[a]; foram eles que lhe deram esplendor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Penduravam sobre você escudo e capacete”, retratando o equipamento militar exposto nas muralhas de Tiro ou dentro da cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “contribuíram para a sua glória” ou “conferiram-lhe majestade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: Pérsia
  rationale: Nome tradicional e amplamente reconhecido em português para a Pérsia.
- source_word: לוּד
  choice: Lude
  rationale: Preserva o nome hebraico de povo ou lugar sem identificá-lo de modo interpretativo com a Lídia.
- source_word: פוּט
  choice: Pute
  rationale: Transliteração portuguesa tradicional do etnônimo ou topônimo hebraico, sem modernização geográfica especulativa.
- source_word: בְחֵילֵךְ
  choice: faziam parte do seu exército
  rationale: Embora חַיִל possa significar força, capacidade ou riqueza, a expressão seguinte, “homens de guerra”, determina aqui o sentido militar.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: seus homens de guerra
  rationale: Mantém de perto a construção hebraica e seu teor marcial, em linguagem clara e digna.
- source_word: מָגֵן וְכוֹבַע
  choice: escudo e capacete
  rationale: Equivalentes usuais para as peças de equipamento militar; o singular hebraico pode funcionar coletivamente.
- source_word: תִּלּוּ בָךְ
  choice: Em você, penduravam
  rationale: Preserva tanto o verbo concreto “pendurar” quanto a preposição בְ, literalmente “em”, ainda que a imagem possa referir-se a armas expostas dentro da cidade ou em suas muralhas.
- source_word: הֵמָּה נָתְנוּ הֲדָרֵךְ
  choice: foram eles que lhe deram esplendor
  rationale: Reproduz a ênfase do pronome הֵמָּה e comunica de modo natural que a presença e o equipamento desses guerreiros conferiam magnificência a Tiro.
theological_decisions: []
