  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Os nomes próprios seguem formas bíblicas correntes em português. A sintaxe conserva a imagem poética e militar do hebraico, enquanto as notas registram alternativas legítimas sem resolver indevidamente a ambiguidade.
