base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/027.yaml
  text: Your wealth[a], your wares, your merchandise, your sailors, and your pilots, those who repair your damage, and those who trade in your merchandise, and all your men of war who are in you, with all your assembly that is in your midst[b], will fall into the heart of the seas on the day of your downfall.
translation:
  language: pt
  text: Sua riqueza, seus bens, suas mercadorias, seus marinheiros e seus pilotos, os que consertam suas avarias[a], os que negociam suas mercadorias e todos os seus homens de guerra que estão em você, com toda a sua assembleia que está no seu meio, cairão no coração dos mares[b], no dia da sua queda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que calafetam suas juntas” ou “os que reparam suas brechas”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, no meio ou nas profundezas dos mares.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹנֵךְ
  choice: sua riqueza
  rationale: הוֹן designa riqueza ou bens materiais; “riqueza” é claro e adequado ao lamento comercial sobre Tiro.
- source_word: עִזְבוֹנַיִךְ
  choice: seus bens
  rationale: No campo comercial de Ezequiel 27, o termo se refere aos bens transportados ou negociados. “Bens” é natural e permite distingui-lo de מַעֲרָב, traduzido por “mercadorias”.
- source_word: מַעֲרָבֵךְ
  choice: suas mercadorias
  rationale: Neste capítulo, o substantivo se refere aos produtos envolvidos no comércio de Tiro; “mercadorias” preserva o sentido mercantil.
- source_word: מַלָּחַיִךְ
  choice: seus marinheiros
  rationale: Equivalente moderno e direto para os tripulantes que trabalham na navegação.
- source_word: חֹבְלָיִךְ
  choice: seus pilotos
  rationale: No contexto náutico, refere-se aos responsáveis por conduzir ou dirigir a embarcação, em contraste com os marinheiros em geral.
- source_word: מַחֲזִיקֵי בִדְקֵךְ
  choice: os que consertam suas avarias
  rationale: A expressão significa literalmente os que reforçam ou reparam uma brecha ou rachadura. No contexto da metáfora naval, “consertam suas avarias” comunica com clareza o trabalho de reparação sem restringir indevidamente o tipo de dano.
- source_word: עֹרְבֵי מַעֲרָבֵךְ
  choice: os que negociam suas mercadorias
  rationale: O particípio tem sentido comercial neste contexto e descreve os negociantes envolvidos na troca das mercadorias de Tiro.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: seus homens de guerra
  rationale: Mantém a formulação militar e o gênero expresso no hebraico.
- source_word: קְהָלֵךְ
  choice: sua multidão
  rationale: קָהָל indica o conjunto reunido de pessoas. Aqui, “multidão” abrange de modo natural todo o contingente presente em Tiro ou no navio figurado.
- source_word: יִפְּלוּ
  choice: cairão
  rationale: Preserva o sentido básico e a imagem do verbo hebraico, embora no contexto a queda implique naufrágio e destruição.
- source_word: בְּלֵב יַמִּים
  choice: no coração dos mares
  rationale: Conserva a metáfora vívida do hebraico, que aponta para o meio ou as profundezas dos mares.
- source_word: מַפַּלְתֵּךְ
  choice: sua queda
  rationale: Reproduz diretamente o substantivo hebraico para queda ou colapso e mantém a relação verbal com “cairão”.
