  text: וְ/אָמַרְתָּ֣ לְ/צ֗וֹר ה/ישבתי עַל מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽ/עַמִּ֔ים אֶל אִיִּ֖ים רַבִּ֑ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צ֕וֹר אַ֣תְּ אָמַ֔רְתְּ אֲנִ֖י כְּלִ֥ילַת יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
translation:
  language: pt
  text: 'E diga a Tiro, que está situada às entradas do mar, comerciante dos povos em muitas terras costeiras[a]: Assim diz o Senhor Yahweh: Tiro, você disse: “Eu sou perfeita em beleza.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em muitas ilhas”. O termo hebraico pode se referir a ilhas ou, de modo mais amplo, a terras costeiras marítimas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הישבתי
  choice: que está situada
  rationale: O particípio qal feminino singular caracteriza Tiro por sua localização. “Está situada” soa natural em português para uma cidade e preserva o sentido de estado contínuo.
- source_word: מְבוֹאֹת יָם
  choice: às entradas do mar
  rationale: Mantém a imagem concreta de entradas ou acessos marítimos e a posição estratégica de Tiro, sem recorrer a uma paráfrase geográfica mais vaga.
- source_word: רֹכֶלֶת
  choice: comerciante
  rationale: O particípio feminino concorda com Tiro personificada e descreve sua atividade comercial. “Comerciante” é claro, atual e preserva o singular.
- source_word: הָעַמִּים
  choice: dos povos
  rationale: Preserva o plural e a dimensão multiétnica das comunidades com as quais Tiro comerciava.
- source_word: אֶל אִיִּים רַבִּים
  choice: em muitas terras costeiras
  rationale: אִיִּים pode designar ilhas ou, de modo mais amplo, regiões marítimas e litorâneas. A preposição foi vertida idiomaticamente como “em” para indicar o âmbito do comércio, sem eliminar a alternativa lexical.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição pouco natural “Senhor SENHOR”.
- source_word: כְּלִילַת יֹפִי
  choice: perfeita em beleza
  rationale: Expressa a alegação de beleza completa ou consumada e conserva o tom orgulhoso da fala de Tiro.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução explicita o nome divino e mantém separado o título “Senhor”, sem introduzir uma interpretação denominacional.
- issue: Força da afirmação כְּלִילַת יֹפִי
  choice: Eu sou perfeita em beleza
  alternative: Eu sou a perfeição da beleza
  rationale: A formulação mantém a autoproclamação enfática de Tiro sem decidir além do texto se a expressão é predicativa ou nominal em sua nuance exata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação feminina de Tiro é preservada por “comerciante” e “perfeita”. A estrutura profética “Assim diz” foi mantida.
