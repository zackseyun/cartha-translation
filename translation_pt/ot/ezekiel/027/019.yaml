base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
translation:
  language: pt
  text: Dã e Javã, de Uzal, negociavam com você[a][b]; davam ferro trabalhado, cássia[c] e cana aromática em troca das suas mercadorias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Dã”. Alguns leem “Vedã” ou propõem outra correção, porque o texto é difícil.'
    reason: textual_variant
  - marker: b
    text: A relação sintática entre “Javã” e “Uzal” é difícil no hebraico.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “cálamo” ou “cana”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדָן
  choice: Dã
  rationale: Mantém como nome próprio a leitura do texto massorético, embora a forma e a identificação sejam discutidas.
- source_word: וְיָוָן
  choice: Javã
  rationale: Conserva o nome próprio tradicional, sem restringi-lo interpretativamente a 'Grécia' ou 'jônios'.
- source_word: מְאוּזָּל
  choice: de Uzal
  rationale: Entende a forma como topônimo precedido da preposição 'de', a análise mais plausível no catálogo comercial, embora a relação sintática permaneça difícil.
- source_word: בְּעִזְבוֹנַיִךְ
  choice: negociavam com você
  rationale: Expressa de modo natural em português a atividade comercial indicada pelo substantivo referente a mercadorias.
- source_word: נָתָנּוּ
  choice: davam
  rationale: Preserva mais de perto o sentido básico do verbo hebraico, enquanto o contexto deixa claro que se trata de troca comercial.
- source_word: בַּרְזֶל עָשׁוֹת
  choice: ferro trabalhado
  rationale: Indica ferro manufaturado ou processado, em contraste com metal bruto.
- source_word: קִדָּה
  choice: cássia
  rationale: É a identificação usual da substância aromática comercial, sem ocultar outras possibilidades lexicais.
- source_word: וְקָנֶה
  choice: cana aromática
  rationale: O contexto de produtos comerciais aromáticos favorece esta tradução, mais clara em português do que apenas 'cana'.
- source_word: בְּמַעֲרָבֵךְ
  choice: em troca das suas mercadorias
  rationale: Torna explícita, de maneira idiomática, a relação comercial expressa pelo termo no contexto do capítulo.
