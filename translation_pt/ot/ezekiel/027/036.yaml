  yaml_path: translation/ot/ezekiel/027/036.yaml
  text: Merchants among the peoples hiss at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: pt
  text: Os comerciantes entre os povos assobiam contra você[a]; você se tornou um horror[b] e deixará de existir para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “silvam contra você”. O verbo hebraico pode indicar assobiar ou sibilar; aqui expressa uma reação de espanto ou escárnio.
    reason: lexical_alternative
  - marker: b
    text: Ou “terrores” ou “algo aterrador”. O substantivo hebraico está no plural, mas pode ter sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹחֲרִים
  choice: os comerciantes
  rationale: O particípio de סחר designa os que se dedicam ao comércio; “comerciantes” é natural em português e corresponde ao contexto mercantil da lamentação sobre Tiro.
- source_word: בָּעַמִּים
  choice: entre os povos
  rationale: O plural עַמִּים se refere amplamente a diferentes povos; a opção preserva o sentido internacional sem pressupor Estados-nação.
- source_word: שָׁרְקוּ
  choice: assobiam
  rationale: שׁרק pode indicar assobiar ou sibilar e, neste contexto de juízo, expressa espanto ou escárnio. “Assobiam” é uma formulação natural, com a alternativa explicitada em nota.
- source_word: עָלַיִךְ
  choice: contra você
  rationale: Com שׁרק, עַל indica o alvo da reação. “Contra você” comunica que o gesto é dirigido a Tiro e sugere sua carga hostil.
- source_word: בַּלָּהוֹת
  choice: motivo de horror
  rationale: Embora o substantivo esteja no plural, pode ter força coletiva. “Motivo de horror” expressa que Tiro se tornou algo aterrador sem apagar a forma plural do hebraico, registrada em nota.
- source_word: הָיִית
  choice: você se tornou
  rationale: O qatal resume o estado resultante de Tiro depois do juízo; “se tornou” comunica esse resultado com clareza.
- source_word: וְאֵינֵךְ
  choice: e deixará de existir
  rationale: A construção existencial negativa, seguida de עַד עוֹלָם, comunica o desaparecimento definitivo de Tiro. A formulação futura se ajusta ao desfecho profético.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: A expressão idiomática indica duração permanente; “para sempre” é seu equivalente corrente e digno em português.
theological_decisions:
- issue: Força da oração final em um oráculo profético de juízo
  choice: “deixará de existir para sempre” expressa o fim irreversível de Tiro.
  alternative: “já não existe para sempre” ou “não existirá mais”
  rationale: A construção existencial negativa com עַד עוֹלָם indica um desaparecimento definitivo. A tradução preserva a severidade do juízo sem extrair afirmações metafísicas além do sentido do oráculo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por “você” mantém clara a interpelação feminina singular dirigida a Tiro. A sintaxe é direta e solene, apropriada a uma lamentação profética.
