base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/024.yaml
  text: They were your merchants in choice wares[a], in wraps of blue and embroidered cloth, and in treasuries of multicolored fabrics, bound with cords and secured[b], among your merchandise.
translation:
  language: pt
  text: Eles eram seus comerciantes de artigos finos, de rolos de tecido azul e bordado e de valiosas reservas de tecidos multicores[a], amarrados com cordas e bem acondicionados[b], entre as suas mercadorias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é incerta; pode se referir a reservas valiosas, baús ou fardos de tecidos ricamente coloridos.
    reason: lexical_alternative
  - marker: b
    text: Ou «em caixas de cedro» ou «revestidos de cedro». O termo hebraico é difícil; alguns o relacionam à palavra para «cedro», em vez de entendê-lo como outra descrição do acondicionamento das mercadorias.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹכְלַיִךְ
  choice: negociavam com você
  rationale: O particípio designa os comerciantes da rede de Tiro; a formulação verbal evita o pouco natural «eram seus mercadores em» e comunica claramente a relação comercial.
- source_word: מַכְלֻלִים
  choice: artigos finos
  rationale: No contexto comercial, o termo parece indicar produtos seletos, acabados ou de alta qualidade; «artigos finos» preserva esse valor sem especificar indevidamente o tipo de produto.
- source_word: גְלוֹמֵי תְּכֵלֶת וְרִקְמָה
  choice: mantos de tecido azul e bordado
  rationale: גְלוֹמֵי pode designar mantos, peças envolventes ou rolos de tecido; תְּכֵלֶת indica material tingido de azul ou azul-púrpura, e רִקְמָה, trabalho bordado. A tradução mantém a imagem têxtil com linguagem corrente.
- source_word: גִנְזֵי בְּרֹמִים
  choice: valiosas reservas de tecidos multicolores
  rationale: A expressão é obscura. גִנְזֵי sugere depósitos, reservas, tesouros ou recipientes de bens valiosos, enquanto בְּרֹמִים é geralmente relacionado a tecidos variados ou multicolores. A opção comunica o provável sentido comercial sem fingir certeza.
- source_word: חֲבָלִים חֲבֻשִׁים
  choice: amarrado com cordas
  rationale: A expressão descreve mercadorias atadas ou presas com cordas para transporte.
- source_word: אֲרֻזִים
  choice: bem acondicionado
  rationale: No encadeamento de descrições de embalagem, o termo pode indicar que os bens estavam arrumados ou firmemente acondicionados; a possível relação com «cedro» é preservada em nota.
- source_word: מַרְכֻלְתֵּךְ
  choice: suas mercadorias
  rationale: Em Ezequiel 27, o substantivo se refere concretamente aos bens negociados por Tiro, embora também possa abranger seu comércio de modo geral.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe comercial natural. «Tudo» esclarece que as expressões finais descrevem o acondicionamento dos bens sem resolver além do necessário o alcance exato dos modificadores. As notas conservam as duas principais incertezas lexicais do hebraico.
