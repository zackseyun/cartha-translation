  text: יָוָ֤ן תֻּבַל֙ וָ/מֶ֔שֶׁךְ הֵ֖מָּה רֹֽכְלָ֑יִ/ךְ בְּ/נֶ֤פֶשׁ אָדָם֙ וּ/כְלֵ֣י נְחֹ֔שֶׁת נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/013.yaml
  text: Javan[a], Tubal, and Meshech—they were your traders; they exchanged human lives and articles of bronze for your wares.
translation:
  language: pt
  text: Javã, Tubal e Meseque eram seus comerciantes; davam vidas humanas[a] e objetos de bronze em troca de suas mercadorias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: pessoas; neste contexto, provavelmente se refere a pessoas vendidas no comércio, isto é, escravos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָוָן
  choice: Javã
  rationale: Forma portuguesa tradicional do nome próprio hebraico, preservando o etnônimo sem substituí-lo pela identificação contextual «Grécia».
- source_word: תֻּבַל
  choice: Tubal
  rationale: Transliteração portuguesa consagrada do nome de um povo ou região.
- source_word: מֶשֶׁךְ
  choice: Meseque
  rationale: Forma portuguesa tradicional do nome de um povo ou região, correspondente ao hebraico.
- source_word: רֹכְלָיִךְ
  choice: seus comerciantes
  rationale: Expressa os parceiros envolvidos no comércio e se encaixa naturalmente no contexto mercantil do capítulo.
- source_word: בְּנֶפֶשׁ אָדָם
  choice: vidas humanas
  rationale: Mantém a força da expressão hebraica, literalmente ligada à vida ou pessoa humana, e indica que seres humanos eram tratados como mercadoria sem inserir diretamente o termo interpretativo «escravos».
- source_word: כְלֵי נְחֹשֶׁת
  choice: objetos de bronze
  rationale: Designação abrangente para artigos manufaturados de bronze; evita restringir o sentido a recipientes.
- source_word: נָתְנוּ
  choice: davam ... em troca de
  rationale: Preserva o sentido básico de «dar» e explicita de modo natural a relação comercial indicada pelo contexto.
- source_word: מַעֲרָבֵךְ
  choice: suas mercadorias
  rationale: No contexto comercial de Ezequiel 27, refere-se aos bens recebidos ou negociados; «mercadorias» é claro e corrente em português.
theological_decisions:
- issue: Seres humanos como bens comerciais
  choice: vidas humanas
  alternative: pessoas; escravos
  rationale: A tradução conserva a linguagem forte e relativamente aberta do hebraico. O contexto aponta para pessoas vendidas, provavelmente escravizadas, mas o texto não emprega aqui o substantivo específico para «escravos».
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecíveis dos nomes próprios. A construção «davam ... em troca de» mantém proximidade com o verbo hebraico e soa natural no contexto comercial.
