  text: זִקְנֵ֨י גְבַ֤ל וַ/חֲכָמֶ֨י/הָ֙ הָ֣יוּ בָ֔/ךְ מַחֲזִיקֵ֖י בִּדְקֵ֑/ךְ כָּל אֳנִיּ֨וֹת הַ/יָּ֤ם וּ/מַלָּֽחֵי/הֶם֙ הָ֣יוּ בָ֔/ךְ לַ/עֲרֹ֖ב מַעֲרָבֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/009.yaml
  text: The elders of Gebal and her skilled men were within you[a], repairing your damage[c][b]. All the ships of the sea and their sailors were within you to trade for your merchandise.
translation:
  language: pt
  text: Os anciãos de Gebal[a] e seus homens habilidosos estavam em você, reparando suas avarias[b]. Todos os navios do mar e seus marinheiros estavam em você para negociar suas mercadorias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gebal é a cidade fenícia mais tarde conhecida em grego como Biblos.
    reason: alternative_reading
  - marker: b
    text: Ou “reparando suas brechas”; o hebraico pode indicar danos estruturais, rachaduras ou juntas que precisam de reparo.
    reason: lexical_alternative
  - marker: c
    text: Ou “para trocar seus artigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: anciãos
  rationale: No contexto cívico e comercial, o termo designa dirigentes ou líderes de idade e posição reconhecidas; “anciãos” preserva ambas as conotações.
- source_word: גְבַל
  choice: Gebal
  rationale: Mantém a forma hebraica do topônimo; a identificação posterior como Biblos é informada em nota.
- source_word: חֲכָמֶיהָ
  choice: seus homens habilidosos
  rationale: Neste contexto marítimo e técnico, o termo indica perícia prática, não apenas sabedoria abstrata.
- source_word: הָיוּ בָךְ
  choice: estavam em você
  rationale: Preserva a expressão espacial e a personificação de Tiro como cidade-navio ao longo do capítulo.
- source_word: מַחֲזִיקֵי
  choice: reparando
  rationale: Embora o verbo tenha o sentido básico de fortalecer ou sustentar, junto de בֶּדֶק descreve a ação de reparar danos estruturais.
- source_word: בִּדְקֵךְ
  choice: suas avarias
  rationale: “Avarias” comunica danos que exigem reparo e se ajusta naturalmente à metáfora náutica sem limitar o sentido a fendas, juntas ou vazamentos.
- source_word: כָּל אֳנִיּוֹת הַיָּם
  choice: todos os navios do mar
  rationale: Tradução direta que conserva a abrangência e a imagem marítima.
- source_word: מַלָּחֵיהֶם
  choice: seus marinheiros
  rationale: Equivalente moderno, claro e natural para os tripulantes dos navios.
- source_word: לַעֲרֹב
  choice: negociar
  rationale: No contexto comercial, o infinitivo expressa troca ou comércio; “negociar” é natural e preserva certa amplitude.
- source_word: מַעֲרָבֵךְ
  choice: suas mercadorias
  rationale: O substantivo denota bens destinados à troca; “mercadorias” é claro e adequado ao lamento comercial sobre Tiro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação feminina de Tiro não é marcada nos pronomes portugueses porque o hebraico se dirige diretamente à cidade; a formulação “em você” conserva a imagem espacial sem acrescentar interpretação.
