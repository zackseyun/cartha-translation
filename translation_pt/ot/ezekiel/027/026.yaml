base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/026.yaml
  text: Into great waters your rowers brought you[b][a]; the east wind shattered you in the heart of the seas.
translation:
  language: pt
  text: Seus remadores levaram você para grandes águas; o vento leste despedaçou você no coração dos mares.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no meio dos mares”. Em hebraico, “coração dos mares” indica a parte interior ou central.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַיִם רַבִּים
  choice: para águas profundas
  rationale: A preposição ב, com o verbo de movimento הֱבִיאוּךְ, admite sentido direcional, expresso naturalmente por “para”. A combinação מַיִם רַבִּים descreve águas vastas ou profundas, isto é, o mar aberto, mais que águas numericamente “muitas”.
- source_word: הֱבִיאוּךְ
  choice: levaram você
  rationale: O hifil de בוא significa “fazer vir”, portanto “trazer” ou “levar”. Em português, “levaram você para” corresponde ao movimento da embarcação rumo ao mar aberto e mantém a referência feminina personificada a Tiro.
- source_word: הַשָּׁטִים אֹתָךְ
  choice: seus remadores
  rationale: O particípio designa os que manejam os remos. Embora o hebraico diga literalmente “os remadores levaram você”, o possessivo explicita de modo natural em português a relação com a embarcação personificada.
- source_word: רוּחַ הַקָּדִים
  choice: o vento leste
  rationale: A expressão definida designa o conhecido vento oriental, frequentemente destrutivo no contexto bíblico. “Vento leste” é claro e natural em português internacional.
- source_word: שְׁבָרֵךְ
  choice: a despedaçou
  rationale: O verbo שׁבר expressa quebra violenta. “Despedaçou” preserva a força da imagem de naufrágio; o pronome feminino “a” retoma a cidade-navio personificada sem repetir “você” de modo pouco natural.
- source_word: בְּלֵב יַמִּים
  choice: no coração dos mares
  rationale: A tradução mantém a metáfora hebraica de לֵב como a parte interior ou central e conserva o plural יַמִּים. A formulação é poética, inteligível e deliberadamente mais imagética que “no meio do mar”.
