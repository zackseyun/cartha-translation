  text: לְ/ק֖וֹל זַעֲקַ֣ת חֹבְלָ֑יִ/ךְ יִרְעֲשׁ֖וּ מִגְרֹשֽׁוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/028.yaml
  text: At the sound of the cry of your pilots[b][a], the pasturelands will quake.
translation:
  language: pt
  text: Ao som do clamor dos seus marinheiros[a], as terras de pastagem[b] tremerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tripulantes»; o termo hebraico pode referir-se aos homens que manejavam as cordas ou conduziam a embarcação.
    reason: lexical_alternative
  - marker: b
    text: Ou «terras abertas» ou «terras comunais»; trata-se das áreas livres ao redor de uma povoação, não de subúrbios no sentido moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל
  choice: Ao som de
  rationale: קוֹל pode indicar voz, som ou ruído; com a preposição לְ, a expressão introduz a circunstância ou causa, e «Ao som de» é natural em português.
- source_word: זַעֲקַת
  choice: do clamor de
  rationale: זְעָקָה designa um grito ou clamor, muitas vezes de aflição. «Clamor» preserva o tom intenso e público do lamento.
- source_word: חֹבְלָיִךְ
  choice: dos seus marinheiros
  rationale: O termo náutico pode designar homens que manejam as cordas, tripulantes ou responsáveis pela condução da embarcação. «Marinheiros» comunica o sentido geral sem impor uma função específica; a ambiguidade é registrada em nota.
- source_word: יִרְעֲשׁוּ
  choice: tremerão
  rationale: רעש expressa sacudir, estremecer ou tremer. «Tremerão» reproduz com clareza a imagem poética da comoção causada pela queda de Tiro.
- source_word: מִגְרֹשׁוֹת
  choice: as terras de pastagem
  rationale: מִגְרָשׁ refere-se às áreas abertas ao redor de uma povoação, frequentemente usadas como pastagem. A tradução evita «subúrbios», que hoje sugeriria bairros residenciais modernos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla. «Clamor» mantém o tom de lamento; «terras de pastagem» comunica o uso provável das áreas periféricas sem recorrer ao equívoco moderno de «subúrbios».
