  text: עֲרַב֙ וְ/כָל נְשִׂיאֵ֣י קֵדָ֔ר הֵ֖מָּה סֹחֲרֵ֣י יָדֵ֑/ךְ בְּ/כָרִ֤ים וְ/אֵילִים֙ וְ/עַתּוּדִ֔ים בָּ֖/ם סֹחֲרָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
translation:
  language: pt
  text: A Arábia[a] e todos os príncipes de Quedar eram os teus comerciantes[b]; com cordeiros, carneiros e bodes, faziam comércio contigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os árabes”. O nome próprio hebraico pode designar a região da Arábia ou seus habitantes.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “comerciantes da tua mão”, expressão idiomática que se refere aos que negociavam contigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲרַב
  choice: A Arábia
  rationale: O nome próprio pode designar a região ou seus habitantes. No contexto de uma lista comercial, o nome geográfico é natural em português, embora os habitantes estejam implicitamente envolvidos.
- source_word: נְשִׂיאֵי
  choice: príncipes
  rationale: O termo designa governantes ou chefes tribais. “Príncipes” conserva o sentido político elevado e permanece claro em português atual.
- source_word: קֵדָר
  choice: Quedar
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: סֹחֲרֵי יָדֵךְ
  choice: os teus comerciantes
  rationale: A expressão literalmente diz “comerciantes da tua mão”, um idiomatismo para pessoas que mantinham relações comerciais com Tiro. A formulação escolhida preserva o substantivo comercial sem reproduzir uma expressão obscura.
- source_word: כָרִים
  choice: cordeiros
  rationale: O termo se refere a cordeiros ou ovinos jovens; “cordeiros” mantém a distinção em relação aos carneiros mencionados em seguida.
- source_word: אֵילִים
  choice: carneiros
  rationale: Equivalente português comum e preciso para carneiros adultos, distinto de cordeiros.
- source_word: עַתּוּדִים
  choice: bodes
  rationale: O termo especifica caprinos machos; “bodes” expressa isso de modo natural e conciso.
- source_word: בָּם סֹחֲרָיִךְ
  choice: com ... faziam comércio contigo
  rationale: A preposição retoma os animais como mercadorias, enquanto a repetição da raiz comercial é expressa verbalmente para produzir uma frase natural sem perder o paralelismo de sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega “teus” e “contigo” de modo coerente para a cidade personificada de Tiro e conserva a repetição do campo semântico do comércio.
