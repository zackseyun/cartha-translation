  yaml_path: translation/ot/ezekiel/027/029.yaml
  text: And all who handle the oar will come down from their ships[a]; the sailors, all the mariners of the sea[b], will stand on the land.
translation:
  language: pt
  text: Descerão de seus navios todos os que manejam o remo[a]; os marinheiros, todos os navegantes do mar[b], ficarão de pé em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os remadores”. O hebraico diz literalmente “todos os que manejam o remo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os homens do mar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: Descerão
  rationale: O qal de ירד descreve o movimento dos tripulantes dos navios para a terra. O futuro mantém a perspectiva profética do lamento e conserva o verbo concreto do hebraico.
- source_word: מֵאָנִיּוֹתֵיהֶם
  choice: de seus navios
  rationale: אֳנִיָּה designa uma embarcação marítima; “navios” é claro e natural, e a preposição מן é adequadamente expressa por “de”.
- source_word: כֹּל תֹּפְשֵׂי מָשׁוֹט
  choice: todos os que manejam o remo[a]
  rationale: A expressão significa literalmente os que seguram ou manejam o remo. A formulação preserva a imagem concreta do hebraico, enquanto a nota registra a alternativa funcional “remadores”.
- source_word: מַלָּחִים
  choice: os marinheiros
  rationale: Termo corrente e preciso em português para os trabalhadores de uma embarcação, sem o tom mais literário ou antigo de outras opções.
- source_word: כֹּל חֹבְלֵי הַיָּם
  choice: todos os navegantes do mar[b]
  rationale: A expressão designa os que exercem seu ofício no mar. “Navegantes do mar” preserva o paralelismo enfático com “marinheiros” sem eliminar a repetição poética.
- source_word: אֶל הָאָרֶץ
  choice: em terra
  rationale: No contraste marítimo, a expressão indica a terra firme, isto é, fora dos navios. “Em terra” é idiomático em português e não exige especificar “praia” ou “costa”.
- source_word: יַעֲמֹדוּ
  choice: ficarão
  rationale: עמד tem o sentido básico de estar ou permanecer de pé. Em português, “ficarão em terra” comunica naturalmente a posição resultante após desembarcarem, sem acrescentar uma ideia de resistência ou confronto.
