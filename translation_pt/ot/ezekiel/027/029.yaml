translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem verbal inicial e o paralelismo entre “marinheiros” e “navegantes do mar” preservam o ritmo do lamento hebraico; as notas registram alternativas sem sobrecarregar o texto.
