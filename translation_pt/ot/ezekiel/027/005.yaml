base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/005.yaml
  text: With cypresses from Senir they built all your planking[b][a]; they took a cedar from Lebanon to make a mast for you.
translation:
  language: pt
  text: Com ciprestes[a] de Senir[b], construíram todo o seu tabuado; tomaram um cedro do Líbano para fazer um mastro para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zimbros” ou “abetos”. A espécie exata de conífera indicada pelo hebraico é incerta.
    reason: lexical_alternative
  - marker: b
    text: Senir é o nome de uma região associada ao monte Hermom (cf. Deuteronômio 3:9).
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוֹשִׁים
  choice: ciprestes
  rationale: Designa uma conífera cuja espécie exata é incerta. “Ciprestes” é uma tradução corrente e adequada ao contexto de construção naval; a incerteza fica registrada em nota.
- source_word: מִשְּׂנִיר
  choice: de Senir
  rationale: O topônimo é transliterado em forma corrente em português; identifica uma região associada ao monte Hermom.
- source_word: בָּנוּ לָךְ
  choice: construíram
  rationale: בנה significa normalmente “construir”. O possessivo em “seu tabuado” e o contexto da apóstrofe à embarcação expressam a relação indicada por לָךְ sem produzir uma formulação portuguesa pesada.
- source_word: אֵת כָּל לֻחֹתָיִם
  choice: todo o seu tabuado
  rationale: No contexto naval, לוּחַ indica as pranchas ou tábuas que formam a estrutura/revestimento da embarcação. “Tabuado” oferece um coletivo natural em português e mantém a referência à destinatária feminina.
- source_word: אֶרֶז מִלְּבָנוֹן
  choice: um cedro do Líbano
  rationale: O substantivo singular é mantido concretamente como “um cedro”, cuja madeira seria usada para o único mastro mencionado.
- source_word: לָקָחוּ
  choice: trouxeram
  rationale: Embora לקח tenha o sentido básico de “tomar/pegar”, em português “trouxeram” comunica naturalmente a obtenção e o transporte do cedro desde o Líbano no contexto da construção.
- source_word: לַעֲשׂוֹת תֹּרֶן
  choice: para fazer um mastro
  rationale: Mantém de modo direto a finalidade expressa pelo infinitivo e o sentido náutico inequívoco de תֹּרֶן.
- source_word: עָלָיִךְ
  choice: para você
  rationale: A preposição significa literalmente “sobre você”, mas aqui indica que o mastro seria instalado na embarcação personificada. “Para você” preserva a relação e a interpelação feminina em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A cidade de Tiro continua personificada como uma embarcação e é tratada no feminino por meio das formas contextuais “seu” e “você”. Os marcadores foram posicionados imediatamente após os termos a que se referem.
