  yaml_path: translation/ot/ezekiel/027/030.yaml
  text: They will make their voice heard over you and cry out bitterly[a]; they will throw dust on their heads[b]; they will roll in ashes.
translation:
  language: pt
  text: Farão ouvir a própria voz em lamento por você[a] e clamarão amargamente; lançarão pó sobre a própria cabeça e se revolverão nas cinzas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito de você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rolarão nas cinzas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁמִיעוּ ... בְּקוֹלָם
  choice: farão ouvir a voz
  rationale: Preserva o sentido causativo do hifil de שׁמע e o singular coletivo de קוֹל, mantendo uma formulação compreensível em português.
- source_word: עָלַיִךְ
  choice: em lamento por você
  rationale: No contexto de uma lamentação fúnebre por Tiro, עַל indica que o clamor é proferido por causa dela ou a respeito de sua ruína. A explicitação de 'em lamento' comunica essa relação com naturalidade sem tratá-la como fala hostil.
- source_word: וְיִזְעֲקוּ מָרָה
  choice: e clamarão amargamente
  rationale: זעק expressa um clamor intenso, e מָרָה funciona adverbialmente, indicando a amargura da lamentação.
- source_word: וְיַעֲלוּ עָפָר עַל רָאשֵׁיהֶם
  choice: lançarão pó sobre a própria cabeça
  rationale: עלה, nesta prática de luto, descreve o ato de erguer ou lançar pó sobre si. O singular distributivo 'a própria cabeça' representa naturalmente o plural hebraico em português.
- source_word: בָּאֵפֶר יִתְפַּלָּשׁוּ
  choice: se revolverão nas cinzas
  rationale: O hitpael de פלשׁ descreve o ato corporal de rolar ou revolver-se nas cinzas como sinal de luto. 'Revolver-se' é vívido, digno e não acrescenta a possível conotação depreciativa de 'chafurdar'.
