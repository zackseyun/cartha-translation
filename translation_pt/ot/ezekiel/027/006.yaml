  naturalness: '«Fizeram seus remos de carvalhos de Basã» é natural. «Fizeram seu convés com marfim, de madeira dos litorais de Quitim» é sintaticamente ambíguo e pouco idiomático: pode sugerir que o marfim é de madeira. «Tábuas» e «marfim incrustado em madeira» tornam a construção inteligível.'
