  yaml_path: translation/ot/ezekiel/027/006.yaml
  text: They made your oars of oaks from Bashan[c][b][a]; they made your deck of ivory from the coasts of Kittim.
translation:
  language: pt
  text: Fizeram seus remos de carvalhos de Basã; fizeram suas tábuas de marfim incrustado em madeira dos litorais de Quitim.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram suas tábuas de marfim”. O termo hebraico pode designar tábuas, pranchas ou o revestimento da embarcação, e não especificamente o convés.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é obscuro: literalmente, “marfim, filha de assurins”. Muitos entendem a expressão como marfim incrustado em uma madeira, talvez buxo, cipreste ou outra espécie, proveniente de Quitim. “Quitim” provavelmente se refere a Chipre ou a regiões marítimas ocidentais próximas.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוֹנִים
  choice: carvalhos
  rationale: Designa árvores grandes de madeira resistente; “carvalhos” é natural no contexto da madeira célebre de Basã, embora “terebintos” também seja possível.
- source_word: מִבָּשָׁן
  choice: de Basã
  rationale: Mantém o topônimo como indicação direta da procedência da madeira.
- source_word: מִשּׁוֹטָיִךְ
  choice: seus remos
  rationale: No contexto da metáfora naval, refere-se claramente aos instrumentos usados para remar.
- source_word: קַרְשֵׁךְ
  choice: seu convés
  rationale: O substantivo indica tábuas ou pranchas da embarcação; “convés” expressa com naturalidade uma possível função, e a alternativa mais genérica é registrada em nota.
- source_word: שֵׁן
  choice: marfim
  rationale: Embora signifique literalmente “dente”, em descrições de materiais o termo designa marfim.
- source_word: בַּת אֲשֻׁרִים
  choice: de madeira
  rationale: A expressão hebraica é obscura e provavelmente identifica algum tipo de madeira associado ao marfim; a tradução evita especificar sem segurança uma espécie como cipreste ou buxo e preserva a dificuldade em nota.
- source_word: מֵאִיֵּי כִתִּים
  choice: dos litorais de Quitim
  rationale: אִיִּים pode indicar ilhas ou regiões costeiras; “litorais” é adequado ao contexto comercial marítimo, enquanto Quitim é preservado como topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe paralela. A forma feminina dos pronomes possessivos do hebraico, dirigida a Tiro como embarcação personificada, é expressa em português pelos possessivos não marcados quanto ao gênero. As notas preservam a incerteza real acerca da peça do navio e da difícil expressão בַּת אֲשֻׁרִים.
