revisions:
- from: Damasco negociava com você por causa da abundância dos seus produtos e de toda a sua riqueza, fornecendo vinho de Helbom e lã branca.[a]
  to: Damasco negociava com você por causa da abundância dos seus produtos, por causa da abundância de toda espécie de riqueza, com vinho de Helbom e lã branca.[a]
  rationale: A revisão conserva o sentido comercial e as mercadorias do original, mas remove a implicação não expressa de que Damasco fornecia os bens. Também restaura a dupla ênfase em “abundância” e representa כָּל־הוֹן como “toda espécie de riqueza”, sem impor uma interpretação possessiva indevida.
