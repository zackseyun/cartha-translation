base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/018.yaml
  text: Damascus traded with you because of your many products[a], because of your abundant wealth, with wine of Helbon and white wool.
translation:
  language: pt
  text: Damasco negociava com você por causa da abundância dos seus produtos, por causa da abundância de toda espécie de riqueza, com vinho de Helbom e lã branca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Damasco era seu negociante, por causa da abundância dos seus produtos, por causa da abundância de toda espécie de riqueza, com vinho de Helbom e lã clara.”'
    reason: Registra a alternativa nominal para a expressão comercial e a possibilidade de traduzir צָחַר por “clara”, sem atribuir uma direção de fornecimento que o hebraico não explicita.
lexical_decisions:
- source_word: דַּמֶּשֶׂק
  choice: Damasco
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: סֹחַרְתֵּךְ
  choice: negociava com você
  rationale: Expressa naturalmente a atividade comercial e preserva o sufixo de segunda pessoa feminina que se refere diretamente a Tiro.
- source_word: בְּרֹב מַעֲשַׂיִךְ
  choice: por causa da abundância dos seus produtos
  rationale: No catálogo comercial de Ezequiel 27, מַעֲשֶׂה designa o que é produzido, isto é, produtos ou mercadorias; a preposição é entendida em sentido causal.
- source_word: מֵרֹב כָּל הוֹן
  choice: e de toda a sua riqueza
  rationale: Preserva כָּל e o paralelismo causal com a expressão anterior sem repetir de modo pesado 'por causa da abundância'.
- source_word: בְּיֵין חֶלְבּוֹן
  choice: fornecendo vinho de Helbom
  rationale: A preposição introduz a mercadoria usada no comércio; 'fornecendo' torna clara essa relação em português, e 'de Helbom' identifica a procedência.
- source_word: וְצֶמֶר צָחַר
  choice: e lã branca
  rationale: צָחַר pode indicar algo branco, claro ou brilhante; 'branca' é a leitura mais clara e corrente para a qualidade da lã.
