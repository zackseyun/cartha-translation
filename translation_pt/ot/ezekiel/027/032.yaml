  - severity: low
    issue: O possessivo “seu” em “Em seu pranto” é referencialmente ambíguo em português.
    rationale: Pode remeter a Tiro, ao grupo que lamenta ou ao leitor tratado por “você”; “com seus filhos” elimina essa ambiguidade e segue o texto-base.
