base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/032.yaml
  text: 'They will raise a lamentation over you in their wailing[a], and they will lament over you: ‘Who is like Tyre[b], silenced in the midst of the sea?’'
translation:
  language: pt
  text: 'Com seus filhos[a], entoarão uma lamentação a seu respeito e se lamentarão por você: “Quem é como Tiro, reduzida ao silêncio[b] no meio do mar?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “com seus filhos”. A expressão é difícil neste contexto; algumas interpretações ou propostas textuais a relacionam a uma voz ou a um pranto de lamento.
    reason: textual_variant
  - marker: b
    text: Ou “aquietada” ou “devastada”. O termo hebraico pode indicar que alguém ou algo foi silenciado, imobilizado ou deixado em ruínas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: entoarão uma lamentação
  rationale: A combinação de נשׂא com קינה é idiomática e significa iniciar ou proferir uma lamentação; “entoar” comunica naturalmente a ideia de uma composição fúnebre pronunciada ou cantada.
- source_word: אֵלַיִךְ
  choice: a seu respeito
  rationale: Embora אֶל indique direção, neste contexto a lamentação é dirigida a respeito de Tiro; a formulação evita a ambiguidade pouco natural de “para você”.
- source_word: בְּנִיהֶם
  choice: em seu pranto
  rationale: No contexto imediato de choro e lamentação, a forma é entendida como referência ao pranto ou lamento deles. A expressão portuguesa preserva a função circunstancial da preposição.
- source_word: וְקוֹנְנוּ עָלָיִךְ
  choice: e se lamentarão por você
  rationale: O verbo קונן denota executar ou proferir uma lamentação, e עַל indica aquele por quem se lamenta.
- source_word: מִי כְצוֹר
  choice: Quem é como Tiro
  rationale: Mantém diretamente a pergunta comparativa e emprega a forma portuguesa tradicional do topônimo.
- source_word: כְּדֻמָה
  choice: reduzida ao silêncio
  rationale: A expressão comunica o estado passivo de ter sido silenciada ou aquietada sem especificar além do hebraico o grau de destruição envolvido.
- source_word: בְּתוֹךְ הַיָּם
  choice: no meio do mar
  rationale: Tradução clara e poética que preserva a localização marítima enfatizada pelo texto.
