  source_fidelity: A expressão בְּנֵיהֶם, conforme o texto massorético, significa literalmente “seus filhos”, e não “seu pranto”. Embora seja uma construção difícil no contexto e possa refletir problema textual ou interpretação antiga, a tradução principal não deve substituir essa leitura por uma solução conjectural sem sinalizá-la. O restante transmite adequadamente a lamentação dirigida a Tiro e o estado de silêncio/quietude expresso por כְּדֻמָה.
  naturalness: O português é em geral claro e digno, mas “Em seu pranto” deixa ambígua a referência de “seu” e não corresponde à forma hebraica preservada. “Com seus filhos” é natural no fluxo poético, ainda que a nota seja necessária para explicar a dificuldade.
  terminology: “Tiro”, “lamentação”, “reduzida ao silêncio” e “no meio do mar” são escolhas adequadas. “Reduzida ao silêncio” preserva bem a imagem sem decidir indevidamente entre silenciamento e devastação.
