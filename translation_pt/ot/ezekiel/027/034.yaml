base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/034.yaml
  text: At the time you were broken by the seas in the depths of the waters[b][a], your merchandise and all your assembly in your midst fell.
translation:
  language: pt
  text: Quando você foi despedaçada pelos mares, nas profundezas das águas,[a] suas mercadorias e toda a sua assembleia, em seu meio, caíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No momento em que você foi despedaçada pelos mares, nas profundezas das águas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: Quando
  rationale: Embora seja formalmente um substantivo temporal, a construção introduz a circunstância do desastre; “Quando” é a forma mais natural em português e preserva a relação temporal.
- source_word: נִשְׁבֶּרֶת
  choice: você foi despedaçada
  rationale: O nifal feminino singular concorda com Tiro, personificada como mulher e retratada como navio. “Despedaçada” expressa a ruptura catastrófica sem reduzir o verbo apenas a “naufragou”.
- source_word: מִיַּמִּים
  choice: pelos mares
  rationale: A preposição מִן pode indicar origem ou agente; com o verbo passivo, “pelos” comunica naturalmente a força causadora. O plural “mares” preserva a forma hebraica.
- source_word: בְּמַעֲמַקֵּי מָיִם
  choice: nas profundezas das águas
  rationale: Mantém a imagem concreta e a estrutura do hebraico, literalmente “nas profundezas de águas”, em português digno e compreensível.
- source_word: מַעֲרָבֵךְ
  choice: suas mercadorias
  rationale: No contexto comercial de Ezequiel 27, designa os bens de comércio ou a carga de Tiro. “Mercadorias” é abrangente e idiomático.
- source_word: וְכָל קְהָלֵךְ
  choice: e toda a multidão
  rationale: קָהָל designa um conjunto reunido. “Multidão” preserva a amplitude do grupo sem o restringir a tripulação, comerciantes ou habitantes.
- source_word: בְּתוֹכֵךְ
  choice: que estava dentro de você
  rationale: Explicita de maneira natural a relação entre a multidão e o interior da cidade-navio personificada, sem abandonar a imagem espacial.
- source_word: נָפָלוּ
  choice: caíram
  rationale: Reproduz o sentido básico do qal perfeito plural de נפל. Evita especificar “afundaram” ou “pereceram”, implicações possíveis, mas não expressas diretamente pelo verbo.
