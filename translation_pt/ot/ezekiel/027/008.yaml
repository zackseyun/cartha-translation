  text: יֹשְׁבֵ֤י צִידוֹן֙ וְ/אַרְוַ֔ד הָי֥וּ שָׁטִ֖ים לָ֑/ךְ חֲכָמַ֤יִ/ךְ צוֹר֙ הָ֣יוּ בָ֔/ךְ הֵ֖מָּה חֹבְלָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/008.yaml
  text: The inhabitants of Sidon and Arvad were your rowers; your wise men[a], O Tyre, were within you; they were your pilots.
translation:
  language: pt
  text: Os habitantes de Sidom e de Arvade eram os seus remadores. Os seus sábios[a], ó Tiro, estavam dentro de você; eram eles os seus marinheiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus homens hábeis”. O termo hebraico pode indicar sabedoria ou habilidade especializada; aqui, o contexto é náutico.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: Os habitantes de
  rationale: O particípio em construção designa os que moram em determinado lugar; “habitantes de” é natural e preciso em português.
- source_word: צִידוֹן
  choice: Sidom
  rationale: Forma tradicional e amplamente reconhecida em português para a cidade fenícia.
- source_word: וְאַרְוַד
  choice: e de Arvade
  rationale: Forma portuguesa corrente do topônimo; a repetição de “de” torna clara a coordenação com Sidom.
- source_word: שָׁטִים
  choice: remadores
  rationale: No retrato de Tiro como navio, o particípio indica especificamente os que impulsionam a embarcação com remos.
- source_word: לָךְ
  choice: seus
  rationale: A preposição com sufixo feminino singular tem aqui valor relacional ou possessivo, expresso naturalmente em português pelo possessivo.
- source_word: חֲכָמַיִךְ
  choice: seus sábios
  rationale: Preserva o sentido básico ligado à sabedoria sem apagar a possível nuance de competência técnica no contexto náutico.
- source_word: צוֹר
  choice: ó Tiro
  rationale: “Tiro” é a forma portuguesa consagrada, e “ó” explicita dignamente o vocativo hebraico.
- source_word: בָךְ
  choice: dentro de você
  rationale: Mantém a imagem de Tiro como cidade-navio e expressa de modo claro a presença desses homens a bordo ou no interior dela.
- source_word: הֵמָּה
  choice: eram eles
  rationale: A inversão preserva a ênfase do pronome independente hebraico.
- source_word: חֹבְלָיִךְ
  choice: seus marinheiros
  rationale: O substantivo pode designar tripulantes que manejam ou dirigem um navio. “Marinheiros” preserva a amplitude lexical; “pilotos” seria possível, mas mais específico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocativo literário “ó Tiro”. A pontuação em duas frases favorece a clareza sem alterar o paralelismo. “Você” mantém leitura brasileira natural na personificação feminina de Tiro; os possessivos evitam repetição excessiva.
