  rationale: Transliteração aproximada da forma consonantal do texto hebraico; a variante tradicional Calné é preservada em nota.
- source_word: עֶדֶן
  choice: Éden
  rationale: Nome geográfico neste catálogo comercial, sem referência necessária ao jardim.
- source_word: רֹכְלֵי
