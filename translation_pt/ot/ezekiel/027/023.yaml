  rationale: Forma tradicional e reconhecível em português para o nome de lugar ou povo no contexto comercial.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Preserva o nome próprio hebraico; 'Assíria' permanece como alternativa contextual em nota.
- source_word: כִּלְמַד
  choice: Quilmade
  rationale: Transliteração portuguesa de um topônimo raro e de identificação incerta.
- source_word: רֹכַלְתֵּךְ
  choice: negociavam com você
  rationale: Expressa naturalmente a atividade comercial e mantém o referente feminino singular do sufixo hebraico, Tiro, por meio de 'você'.
