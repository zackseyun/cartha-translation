base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/016.yaml
  text: Aram traded with you because of your many products[a], giving turquoise, purple, embroidered cloth, fine linen, coral[c][b], and rubies for your wares.
translation:
  language: pt
  text: Arã negociava com você por causa da abundância dos seus produtos; os comerciantes de Arã lhe davam turquesa[a], púrpura, tecidos bordados, linho fino, coral[b] e rubis[c] em troca das suas mercadorias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esmeralda” ou “carbúnculo”; a identificação exata da pedra hebraica é incerta.
    reason: lexical_alternative
  - marker: b
    text: Talvez outro material de luxo, como “madrepérola”; o significado do termo hebraico traduzido por “coral” é incerto.
    reason: lexical_alternative
  - marker: c
    text: Ou “ágata”, “granada” ou outra pedra preciosa; a identificação exata do termo hebraico traduzido por “rubis” é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome próprio hebraico, em sua forma portuguesa tradicional, sem identificá-lo diretamente com uma entidade geopolítica moderna.
- source_word: סֹחַרְתֵּךְ
  choice: negociava com você
  rationale: Expressa de modo natural a atividade comercial indicada pela forma derivada de סחר.
- source_word: מֵרֹב מַעֲשָׂיִךְ
  choice: por causa da abundância dos seus produtos
  rationale: Preserva o valor causal de מִן e entende מַעֲשִׂים, neste contexto comercial, como artigos produzidos ou manufaturados.
- source_word: נֹפֶךְ
  choice: turquesa
  rationale: É uma identificação possível da pedra, mas não segura; a incerteza é explicitada em nota.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: O termo designa material ou corante púrpura de luxo; a forma concisa convém à lista de mercadorias.
- source_word: רִקְמָה
  choice: tecidos bordados
  rationale: Comunica com clareza que se trata de trabalho têxtil bordado comercializado como mercadoria.
- source_word: בוּץ
  choice: linho fino
  rationale: Equivalente corrente e inteligível para o tecido fino indicado pelo termo hebraico.
- source_word: רָאמֹת
  choice: coral
  rationale: O termo raro provavelmente designa um material precioso ou luxuoso; 'coral' é uma possibilidade contextual, com a incerteza preservada em nota.
- source_word: כַדְכֹּד
  choice: rubis
  rationale: Designa uma pedra preciosa de identificação incerta; 'rubis' é uma possibilidade plausível na lista de bens de luxo, acompanhada de nota.
- source_word: נָתְנוּ
  choice: dava
  rationale: A forma hebraica é plural ('deram'), embora o sujeito coletivo 'Arã' apareça no singular. O singular em português trata Arã como entidade comercial coletiva e evita uma mudança abrupta e ambígua de sujeito.
- source_word: בְּעִזְבוֹנָיִךְ
  choice: Em troca das suas mercadorias
  rationale: Explicita naturalmente a relação de permuta expressa pela preposição e pelo substantivo comercial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase foi dividida em dois períodos para tornar clara a relação de troca. As identificações incertas dos materiais preciosos permanecem no texto principal como opções plausíveis e são qualificadas em notas.
