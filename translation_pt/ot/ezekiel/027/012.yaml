base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/012.yaml
  text: Tarshish was your trader because of your abundant wealth[a]; with silver, iron, tin[c][b], and lead they paid for your wares.
translation:
  language: pt
  text: Társis era sua parceira comercial, por causa da abundância de toda a sua riqueza[a]; com prata, ferro, estanho e chumbo, eles davam em pagamento pelas suas mercadorias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Társis talvez se refira a uma região comercial distante, identificada por alguns com Tartesso, na Espanha.
    reason: cultural_note
  - marker: b
    text: Ou “davam suas mercadorias” ou “davam seus bens”. O verbo hebraico significa simplesmente “dar”, mas aqui é usado num contexto comercial.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְשִׁישׁ
  choice: Társis
  rationale: Forma tradicional e reconhecível em português para o topônimo hebraico; mantém o nome dado pelo texto sem impor a identificação proposta com Tartesso.
- source_word: סֹחַרְתֵּךְ
  choice: comerciava com você
  rationale: Expressa de modo natural a relação comercial indicada pelo substantivo derivado de סחר. Evita a formulação pouco idiomática “era sua comerciante”, preservando Tiro como destinatária feminina no contexto.
- source_word: מֵרֹב כָּל הוֹן
  choice: por causa da sua grande riqueza
  rationale: Entende מִן em sentido causal ou explicativo e traduz הוֹן como riqueza. “Grande riqueza” comunica de forma clara a ideia de abundância.
- source_word: בְּכֶסֶף בַּרְזֶל בְּדִיל וְעוֹפֶרֶת
  choice: com prata, ferro, estanho e chumbo
  rationale: O uso de “com” preserva o valor instrumental da preposição e apresenta os metais como bens entregues na transação.
- source_word: נָתְנוּ
  choice: eles pagavam
  rationale: O sentido básico é “deram”, mas o contexto comercial indica entrega em pagamento ou troca. O pronome plural conserva o número do verbo hebraico e seu referente coletivo, Társis.
- source_word: עִזְבוֹנָיִךְ
  choice: suas mercadorias
  rationale: Termo comercial para os artigos negociados. “Mercadorias” é corrente, claro e adequado ao registro do capítulo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva a mudança do referente coletivo singular “Társis” para o verbo hebraico no plural por meio de “eles”, sem especificar além do texto se eram habitantes ou mercadores.
