base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/015.yaml
  text: The sons of Dedan were your merchants[a]. Many coastlands were the market of your hand[c][b]; they brought back ivory tusks and ebony as your payment.
translation:
  language: pt
  text: Os filhos de Dedã[a] eram seus mercadores. Muitas regiões costeiras[b] eram seus mercados; traziam-lhe presas de marfim[c] e ébano[d] como pagamento[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Os dedanitas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Muitas ilhas”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “chifres de marfim”.
    reason: lexical_alternative
  - marker: d
    text: Ou “madeira de ébano”.
    reason: lexical_alternative
  - marker: e
    text: O sujeito de “traziam” pode ser entendido como os filhos de Dedã ou como as muitas regiões costeiras.
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּנֵי דְדָן
  choice: Os filhos de Dedã
  rationale: Reproduz o construto hebraico e mantém a designação étnica/geográfica sem substituir o texto por uma interpretação.
- source_word: רֹכְלַיִךְ
  choice: seus mercadores
  rationale: Designa comerciantes itinerantes ou negociantes e se encaixa naturalmente no contexto comercial do capítulo.
- source_word: אִיִּים רַבִּים
  choice: Muitas regiões costeiras
  rationale: אִיִּים pode indicar ilhas ou territórios marítimos costeiros; a escolha comunica o sentido geográfico amplo, enquanto a nota preserva a alternativa mais estrita.
- source_word: סְחֹרַת יָדֵךְ
  choice: eram seus mercados
  rationale: Expressa em português corrente a função comercial da locução hebraica idiomática, literalmente relacionada ao comércio ou mercado da mão de Tiro.
- source_word: קַרְנוֹת שֵׁן
  choice: presas de marfim
  rationale: A expressão literal é 'chifres de marfim/dente', mas no contexto dos bens comerciais refere-se de modo natural a presas de marfim.
- source_word: וְהוֹבְנִים
  choice: ébano
  rationale: É a identificação tradicional e contextualmente adequada desse artigo comercial de luxo; 'madeira de ébano' também é possível.
- source_word: הֵשִׁיבוּ
  choice: traziam-lhe
  rationale: O hifil de שׁוב tem o sentido básico de fazer voltar ou trazer de volta; no contexto, descreve a entrega de bens em troca.
- source_word: אֶשְׁכָּרֵךְ
  choice: como pagamento
  rationale: O substantivo indica remuneração, compensação ou pagamento; 'pagamento' é claro e apropriado ao contexto mercantil.
