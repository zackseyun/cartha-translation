  text: שֵׁשׁ בְּ/רִקְמָ֤ה מִ/מִּצְרַ֨יִם֙ הָיָ֣ה מִפְרָשֵׂ֔/ךְ לִ/הְי֥וֹת לָ֖/ךְ לְ/נֵ֑ס תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן מֵ/אִיֵּ֥י אֱלִישָׁ֖ה הָיָ֥ה מְכַסֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/007.yaml
  text: Fine embroidered linen from Egypt was your sail[a], serving as your banner[b]; blue and purple from the coasts of Elishah was your covering.
translation:
  language: pt
  text: Linho fino bordado do Egito era a sua vela, servindo de estandarte[b] para você; tecido azul e púrpura das regiões costeiras de Elisá[a] era a sua cobertura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das ilhas de Elisá”. O termo hebraico pode se referir tanto a ilhas quanto a regiões costeiras.
    reason: lexical_alternative
  - marker: b
    text: Ou “servindo de sinal para você” ou “servindo de bandeira para você”. O termo hebraico נֵס pode indicar um estandarte, uma bandeira ou um sinal visível de longe.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ בְּרִקְמָה
  choice: linho fino bordado
  rationale: Expressa tanto a alta qualidade do שֵׁשׁ quanto o trabalho ornamental indicado por רִקְמָה, em linguagem natural e concisa.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Indica diretamente a procedência do tecido.
- source_word: מִפְרָשֵׂךְ
  choice: a sua vela
  rationale: No retrato de Tiro como navio, o termo designa naturalmente a vela da embarcação.
- source_word: לִהְיוֹת לָךְ לְנֵס
  choice: servindo de estandarte para você
  rationale: Preserva a ideia de que a vela funcionava como sinal ou emblema visível, sem restringir excessivamente o alcance de נֵס.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: tecido azul e púrpura
  rationale: Os termos podem designar cores e também materiais tingidos; explicitar “tecido” torna clara a função de cobertura no contexto, sem eliminar a referência às cores.
- source_word: מֵאִיֵּי אֱלִישָׁה
  choice: das regiões costeiras de Elisá
  rationale: אִיֵּי pode indicar ilhas ou terras costeiras. A opção principal é adequada ao cenário comercial marítimo, e a alternativa legítima é preservada em nota.
- source_word: מְכַסֵּךְ
  choice: a sua cobertura
  rationale: Mantém o sentido amplo de algo que cobre o navio, evitando especificar “toldo” quando o hebraico não exige esse detalhe.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação feminina de Tiro no hebraico é comunicada pelo tratamento direto com “você” e possessivos correspondentes. As notas preservam as ambiguidades lexicais reais de אִיֵּי e נֵס.
