revisions:
- from: Os homens de Arvade, junto com o seu exército, estavam sobre as suas muralhas ao redor, e os gamaditas[a] estavam nas suas torres. Penduravam os seus escudos nas suas muralhas ao redor; eram eles que completavam a sua beleza.
