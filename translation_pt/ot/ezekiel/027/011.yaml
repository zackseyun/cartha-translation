base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/011.yaml
  text: The sons of Arvad[a], along with your army, were on your walls all around, and the Gammadites were in your towers. They hung their shields on your walls all around; they perfected your beauty.
translation:
  language: pt
  text: Os homens de Arvade e o teu exército estavam sobre as tuas muralhas, ao redor; os gamaditas[a] estavam nas tuas torres. Eles penduraram os seus escudos sobre as tuas muralhas, ao redor; aperfeiçoaram a tua beleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico גַמָּדִים é obscuro. Pode ser o nome de um povo, como “gamaditas”; outros o entendem em sentido mais geral como “guerreiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַרְוַד
  choice: Os homens de Arvade
  rationale: A expressão hebraica significa literalmente “filhos de Arvade”, mas funciona como designação dos habitantes ou homens desse lugar. “Os homens de Arvade” comunica naturalmente o sentido etnogeográfico em português.
- source_word: חֵילֵךְ
  choice: o seu exército
  rationale: חַיִל designa aqui a força militar de Tiro; “exército” é claro e adequado ao contexto defensivo.
- source_word: חוֹמוֹתַיִךְ סָבִיב
  choice: as suas muralhas ao redor
  rationale: Preserva a ideia de que os defensores ocupavam todo o circuito das muralhas.
- source_word: גַמָּדִים
  choice: os gamaditas
  rationale: O termo é obscuro e provavelmente designa um povo ou grupo étnico. A transliteração evita substituir a incerteza do hebraico por uma interpretação específica.
- source_word: בְּמִגְדְּלוֹתַיִךְ
  choice: nas suas torres
  rationale: A preposição ב indica localização; “nas suas torres” descreve naturalmente soldados ali posicionados.
- source_word: שִׁלְטֵיהֶם
  choice: os seus escudos
  rationale: O substantivo designa escudos; esta é a forma moderna e acessível em português.
- source_word: תִּלּוּ
  choice: Penduravam
  rationale: O verbo significa pendurar ou suspender. O imperfeito português apresenta a ação descritiva habitual dentro do retrato poético.
- source_word: כָּלְלוּ
  choice: completavam
  rationale: O verbo expressa completar ou levar à perfeição. “Completavam” preserva o sentido sem impor a ideia de perfeição absoluta.
- source_word: יָפְיֵךְ
  choice: a sua beleza
  rationale: Equivalente direto do substantivo hebraico, mantendo a personificação feminina de Tiro e o tom poético.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais para leitores brasileiros. Os possessivos femininos retomam Tiro, tratada como cidade personificada. A formulação conserva o paralelismo e a repetição de “ao redor” do hebraico.
