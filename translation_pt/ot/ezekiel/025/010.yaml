  text: לִ/בְנֵי קֶ֨דֶם֙ עַל בְּנֵ֣י עַמּ֔וֹן וּ/נְתַתִּ֖י/הָ לְ/מֽוֹרָשָׁ֑ה לְמַ֛עַן לֹֽא תִזָּכֵ֥ר בְּנֵֽי עַמּ֖וֹן בַּ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/010.yaml
  text: to the people of the east[a], against the Ammonites; and I will give it as a possession[b], so that the Ammonites may no longer be remembered among the nations.
translation:
  language: pt
  text: aos povos do Oriente[a], contra os amonitas; e eu a darei como possessão[b], para que os amonitas já não sejam lembrados entre as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos do Oriente”. A expressão hebraica se refere aos povos ou às tribos do leste.
    reason: lexical_alternative
  - marker: b
    text: Ou “como herança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֶדֶם
  choice: aos povos do Oriente
  rationale: A expressão idiomática designa povos ou tribos orientais. “Povos do Oriente” comunica naturalmente o sentido etnogeográfico, enquanto a nota preserva a forma mais literal.
- source_word: עַל
  choice: contra
  rationale: No contexto de juízo e entrega territorial, a preposição tem sentido hostil; “contra” preserva essa força sem ampliar o texto.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É a designação étnica corrente e natural em português para o povo de Amom.
- source_word: וּנְתַתִּיהָ
  choice: e eu a darei
  rationale: O sufixo feminino singular retoma a terra ou região mencionada no contexto anterior. O pronome “a” conserva essa referência gramatical.
- source_word: לְמוֹרָשָׁה
  choice: como possessão
  rationale: O substantivo indica algo recebido e mantido como propriedade, podendo também significar herança; “possessão” se ajusta ao contexto de transferência territorial.
- source_word: לְמַעַן לֹא
  choice: para que ... já não
  rationale: A construção expressa propósito ou resultado. “Já não” comunica de modo idiomático a cessação da memória ou condição nacional no contexto.
- source_word: תִזָּכֵר
  choice: sejam lembrados
  rationale: O nifal de זכר tem sentido passivo, “ser lembrado”. A tradução mantém a imagem da memória sem reduzi-la a simples menção nem ampliá-la para aniquilação metafísica.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Aqui גוים se refere aos povos ou nações em geral; “entre as nações” é claro e evita conotações teológicas posteriores de “gentios”.
theological_decisions:
- issue: Força da fórmula de juízo sobre o desaparecimento de Amom
  choice: Perda da lembrança e da condição reconhecida dos amonitas entre as nações
  alternative: Aniquilação completa, ou apenas perda de fama
  rationale: O hebraico afirma que os amonitas não serão lembrados entre as nações. A formulação preserva o grave juízo sobre sua existência e reconhecimento nacionais sem impor uma ideia de extinção metafísica nem enfraquecê-lo como mera perda de notoriedade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Oriente” recebe inicial maiúscula por funcionar como designação geográfica tradicional. A pontuação mantém a natureza fragmentária do versículo, que continua a frase iniciada no contexto anterior.
