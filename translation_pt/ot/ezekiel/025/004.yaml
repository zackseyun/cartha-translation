base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/004.yaml
  text: Therefore, look, I am giving you to the sons of the east as a possession, and they will set their encampments in you and place their dwellings in you. They will eat your fruit, and they will drink your milk.
translation:
  language: pt
  text: Por isso, eis que estou entregando você aos povos do Oriente como propriedade. Eles montarão seus acampamentos em seu território e ali estabelecerão suas moradas. Comerão seus frutos e beberão seu leite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי קֶדֶם
  choice: povos do Oriente
  rationale: A expressão literal «filhos do Oriente» designa coletivamente os povos situados a leste; a forma escolhida comunica esse sentido idiomático com clareza em português atual.
- source_word: לְמוֹרָשָׁה
  choice: como propriedade
  rationale: Preserva a ideia de posse entregue a outro povo sem acrescentar uma especificação ausente do texto.
- source_word: טִירוֹתֵיהֶם
  choice: seus acampamentos
  rationale: Neste contexto, o termo se refere a instalações ou assentamentos de grupos nômades ou seminômades; «acampamentos» mantém o contraste paralelo com «moradas».
- source_word: מִשְׁכְּנֵיהֶם
  choice: suas moradas
  rationale: Tradução ampla e dignificada para lugares de habitação, preservando o paralelismo do verso.
- source_word: הִנְנִי נֹתְנָךְ
  choice: eis que estou entregando você
  rationale: «Eis que» representa a fórmula de atenção, e a construção progressiva comunica a ação divina apresentada como iminente ou já posta em curso.
theological_decisions:
- issue: A entrega de Amom aos povos do Oriente como ato de juízo divino
  choice: estou entregando você
  alternative: entregarei você
  rationale: A formulação conserva a agência divina explícita e a força iminente do particípio hebraico, sem explicar além do que o verso afirma.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento «você» mantém a interpelação direta à entidade nacional personificada. «Em seu território» torna natural em português o hebraico literalmente equivalente a «em você», sem alterar o referente geográfico.
