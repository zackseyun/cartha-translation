  text: 'Thus says the Lord GOD: Because Moab and Seir say, ‘Look, the house of Judah is like all the nations,’'
translation:
  language: pt
  text: 'Assim diz o Senhor DEUS: Visto que Moabe e Seir dizem: “Eis que a casa de Judá é como todas as nações”,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética hebraica de maneira natural e reconhecível em português.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה, seguindo uma convenção bíblica clara em português.
- source_word: יַעַן אֲמֹר
  choice: Visto que ... dizem
  rationale: Expressa a relação causal de יַעַן e concorda o verbo com os dois nomes coordenados, Moabe e Seir.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Reproduz a função de chamar atenção da interjeição hebraica, em linguagem corrente.
- source_word: כְּכָל הַגּוֹיִם
  choice: como todas as outras nações
  rationale: O acréscimo contextual de 'outras' torna explícita em português a comparação entre Judá e o conjunto dos demais povos, sem alterar o sentido.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  alternative: Soberano SENHOR; Senhor Yahweh
  rationale: Preserva a distinção tipográfica tradicional entre o título e o tetragrama sem adotar uma vocalização denominacionalmente marcada.
- issue: Sentido da comparação entre Judá e as nações
  choice: é como todas as outras nações
  alternative: é como todas as nações
  rationale: Mantém a alegação de Moabe e Seir de que Judá não possui condição distinta, sem explicar ou validar teologicamente essa alegação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fórmula profética permanece formal; a fala citada usa uma interjeição natural. Não há notas de rodapé.
