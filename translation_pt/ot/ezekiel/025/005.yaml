source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת רַבָּה֙ לִ/נְוֵ֣ה גְמַלִּ֔ים וְ/אֶת בְּנֵ֥י עַמּ֖וֹן לְ/מִרְבַּץ צֹ֑אן וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/005.yaml
  text: And I will make Rabbah a pasture for camels[a], and the Ammonites a resting place for flocks[c][b]; then you will know that I am Yahweh.
translation:
  language: pt
  text: Farei de Rabá uma pastagem para camelos[a] e dos amonitas[b], um lugar de repouso para rebanhos[c]. Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma habitação de camelos” ou “uma morada de camelos”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os filhos de Amom”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “um lugar onde os rebanhos se deitam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Farei de
  rationale: Embora o verbo signifique literalmente “dar”, nesta construção ele indica transformar um lugar em algo; “farei de” expressa com naturalidade esse resultado.
- source_word: רַבָּה
  choice: Rabá
  rationale: É o nome próprio da capital amonita; por isso, foi transliterado segundo a forma portuguesa corrente.
- source_word: לִנְוֵה
  choice: uma pastagem para
  rationale: O substantivo pode indicar habitação, morada ou pastagem. No contexto de camelos e rebanhos, “pastagem” comunica claramente a imagem pastoril, sem ocultar as alternativas registradas em nota.
- source_word: גְמַלִּים
  choice: camelos
  rationale: Equivalente direto e natural do substantivo plural hebraico.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: A expressão significa literalmente “os filhos de Amom”, mas funciona como designação étnica; “os amonitas” é a forma idiomática em português.
- source_word: לְמִרְבַּץ
  choice: um lugar de repouso
  rationale: Designa um lugar onde animais se deitam ou descansam. A tradução preserva a imagem sem sugerir necessariamente um recinto cercado.
- source_word: צֹאן
  choice: rebanhos
  rationale: O termo coletivo abrange animais de pequeno porte, sobretudo ovelhas e cabras; “rebanhos” mantém essa amplitude.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: A conjunção e a forma verbal, no discurso profético, apresentam o conhecimento como consequência do juízo anunciado. “Vocês” preserva o plural hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino foi transliterado, em vez de ser substituído por um título, preservando sua função como nome pessoal no texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e corresponde mais de perto à reconstrução acadêmica amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção paralela “Farei de... e dos...” reproduz o movimento sintático do hebraico sem rigidez excessiva. “Vocês” torna explícito o plural do verbo hebraico.
