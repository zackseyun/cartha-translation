  terminology: «Filhos de Amom», «santuário», «terra de Israel», «casa de Judá», «exílio» e «Senhor Yahweh» são escolhas defensáveis e coerentes com a abordagem formal e com a decisão de explicitar o nome divino. «Profanado» reproduz bem o registro cultual de נִחָל.
