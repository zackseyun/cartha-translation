  source_fidelity: A tradução acompanha adequadamente a estrutura causal e a enumeração do hebraico, preservando a referência coletiva a Amom, ao santuário, à terra de Israel e à casa de Judá. «Seus habitantes» é uma explicitação interpretativa possível para o plural «foram», mas «o povo de Judá» exprime de modo mais direto o coletivo hebraico sem introduzir uma categoria adicional.
