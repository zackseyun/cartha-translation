  text: וְ/אָֽמַרְתָּ֙ לִ/בְנֵ֣י עַמּ֔וֹן שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה יַעַן֩ אָמְרֵ֨/ךְ הֶאָ֜ח אֶל מִקְדָּשִׁ֣/י כִֽי נִחָ֗ל וְ/אֶל אַדְמַ֤ת יִשְׂרָאֵל֙ כִּ֣י נָשַׁ֔מָּה וְ/אֶל בֵּ֣ית יְהוּדָ֔ה כִּ֥י הָלְכ֖וּ בַּ/גּוֹלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/003.yaml
  text: 'And say to the sons of Ammon[a], ‘Hear the word of the Lord GOD. Thus says the Lord GOD: Because you said, “Aha!” against my sanctuary when it was profaned, and against the land of Israel when it was made desolate[c][b], and against the house of Judah when they went into exile,’'
translation:
  language: pt
  text: 'E diga aos filhos de Amom: “Ouçam a palavra do Senhor Yahweh. Assim diz o Senhor Yahweh: Porque vocês exclamaram: ‘Ah!’[a] contra o meu santuário quando ele foi profanado, contra a terra de Israel quando ficou desolada e contra a casa de Judá quando o povo de Judá foi para o exílio,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ah!” é uma exclamação de satisfação maliciosa ou de triunfo; também pode ser traduzida por “Ha!”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי עַמּוֹן
  choice: filhos de Amom
  rationale: Preserva a forma coletiva hebraica e continua compreensível em português; “amonitas” seria uma alternativa mais idiomática.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: a palavra do Senhor Yahweh
  rationale: Mantém tanto o título אֲדֹנָי como o nome divino יהוה, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Conserva a fórmula profética solene em linguagem portuguesa corrente.
- source_word: הֶאָח
  choice: Ahá!
  rationale: Interjeição portuguesa que comunica satisfação maliciosa ou triunfo diante da desgraça alheia.
- source_word: אֶל
  choice: contra
  rationale: No contexto de hostilidade e regozijo malicioso, expressa adequadamente a direção adversativa da exclamação.
- source_word: מִקְדָּשִׁי
  choice: meu santuário
  rationale: Preserva o sentido cultual amplo do termo sem especificá-lo apenas como “templo”.
- source_word: נִחָל
  choice: foi profanado
  rationale: Expressa a violação da santidade do santuário indicada pelo nifal de חלל.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: a terra de Israel
  rationale: Equivalente natural no contexto territorial, embora אֲדָמָה também possa designar solo ou chão.
- source_word: נָשַׁמָּה
  choice: ficou desolada
  rationale: Comunica o estado resultante de devastação sem tornar explícito um agente que o hebraico não identifica.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Mantém a expressão coletiva e histórico-pactual do hebraico.
- source_word: הָלְכוּ בַגּוֹלָה
  choice: seus habitantes foram para o exílio
  rationale: O sujeito plural se refere coletivamente à casa de Judá; “seus habitantes” torna essa referência clara em português sem alterar o sentido.
theological_decisions:
- issue: Tradução do título composto אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor Deus
  rationale: Reproduz separadamente o título e o nome divino presentes no hebraico, sem ocultar o tetragrama nem produzir “Senhor Senhor”.
- issue: Agente da profanação e da desolação
  choice: Manter o agente sem identificação explícita
  alternative: Explicitar Deus ou invasores como agentes
  rationale: As formas hebraicas descrevem os acontecimentos sem nomear diretamente quem os causou; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, solene e acessível, com cadência profética. O plural “vocês” concorda com o destinatário coletivo. A frase permanece aberta ao versículo seguinte, como no texto-fonte.
