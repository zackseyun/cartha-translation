  text: וּ/בְ/מוֹאָ֖ב אֶעֱשֶׂ֣ה שְׁפָטִ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/011.yaml
  text: And in Moab I will execute judgments[a], and they will know that I am Yahweh.
translation:
  language: pt
  text: E em Moabe executarei juízos, e eles saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/מוֹאָב
  choice: E em Moabe
  rationale: Mantém o sentido locativo mais direto da preposição ב, indicando a esfera em que ocorrerá a ação judicial, sem explicitar o interpretativo «contra Moabe».
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: executarei juízos
  rationale: No sintagma, עשה tem o sentido idiomático de realizar ou executar atos judiciais. «Executarei juízos» preserva tanto a força jurídica quanto o plural do hebraico.
- source_word: וְ/יָדְעוּ
  choice: e eles saberão
  rationale: Reproduz a coordenação hebraica e o valor futuro/resultativo no contexto sem acrescentar o marcador temporal «então».
- source_word: כִּי
  choice: que
  rationale: Introduz naturalmente em português o conteúdo daquilo que eles saberão.
- source_word: אֲנִי יְהוָה
  choice: eu sou Yahweh
  rationale: Conserva o pronome enfático explícito e representa o nome divino יהוה por «Yahweh», em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. «Yahweh» o representa diretamente e evita substituir o nome pelo título «SENHOR»; «Jeová» reflete uma forma híbrida tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico. «Juízos» conserva o teor judicial e a forma plural; «Moabe» é a forma portuguesa corrente do topônimo.
