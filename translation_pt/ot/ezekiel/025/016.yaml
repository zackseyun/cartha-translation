  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֨י נוֹטֶ֤ה יָדִ/י֙ עַל פְּלִשְׁתִּ֔ים וְ/הִכְרַתִּ֖י אֶת כְּרֵתִ֑ים וְ/הַ֣אֲבַדְתִּ֔י אֶת שְׁאֵרִ֖ית ח֥וֹף הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am stretching out my hand against the Philistines, and I will cut off the Cherethites, and I will destroy the remnant of the seacoast.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: “Eis que estou estendendo a minha mão contra os filisteus. Eliminarei os quereteus[a] e destruirei o remanescente do litoral.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os cretenses”. O termo hebraico pode designar um povo associado a Creta, mas sua identificação não é certa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino YHWH, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Mantém a função de chamar a atenção e o tom solene do anúncio profético.
- source_word: נוֹטֶה יָדִי
  choice: estou estendendo a minha mão
  rationale: O particípio ligado a הִנְנִי apresenta a ação divina como iminente ou já em curso, com força vívida.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa consagrada para esse povo.
- source_word: וְהִכְרַתִּי
  choice: Eliminarei
  rationale: Neste contexto de juízo, כרת significa suprimir ou exterminar um povo; “eliminarei” comunica isso com naturalidade sem confundi-lo com um corte literal.
- source_word: כְּרֵתִים
  choice: os queretitas
  rationale: Translitera o etnônimo hebraico e evita decidir no texto principal a possível identificação histórica com os cretenses.
- source_word: וְהַאֲבַדְתִּי
  choice: destruirei
  rationale: O hifil de אבד expressa causar a ruína ou destruição e pede aqui uma formulação direta e forte.
- source_word: שְׁאֵרִית
  choice: o remanescente
  rationale: Equivalente direto que conserva a ideia do que restou, sem pressupor aqui o sentido teológico positivo que a palavra pode ter em outros contextos.
- source_word: חוֹף הַיָּם
  choice: o litoral
  rationale: Expressa de modo conciso e natural a faixa costeira indicada literalmente por “costa do mar”.
theological_decisions:
- issue: Tradução do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “Yahweh” torna explícito o nome divino presente no hebraico, enquanto “Senhor” representa אֲדֹנָי; a alternativa tradicional substitui o nome por um título.
- issue: Relação entre os queretitas e os cretenses
  choice: manter “queretitas” no texto e registrar “cretenses” em nota
  alternative: traduzir diretamente como “cretenses”
  rationale: A possível associação com Creta é plausível, mas não certa; a transliteração preserva a ambiguidade histórica do etnônimo.
translation_notes:
  register: Português moderno, claro e solene, com cadência profética. “Eis que” conserva o tom elevado sem tornar a frase obscura; “litoral” é amplamente compreensível no português internacional e brasileiro.
