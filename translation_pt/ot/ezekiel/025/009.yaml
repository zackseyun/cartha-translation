  text: לָ/כֵן֩ הִנְ/נִ֨י פֹתֵ֜חַ אֶת כֶּ֤תֶף מוֹאָב֙ מֵ/הֶ֣/עָרִ֔ים מֵֽ/עָרָ֖י/ו מִ/קָּצֵ֑/הוּ צְבִ֗י אֶ֚רֶץ בֵּ֣ית הַיְשִׁימֹ֔ת בַּ֥עַל מְע֖וֹן ו/קריתמ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
translation:
  language: pt
  text: 'Por isso, eis que vou abrir o flanco de Moabe[a] desde as cidades, desde as suas cidades fronteiriças, a glória da terra[b]: Bete-Jesimote, Baal-Meom e Quiriataim[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lado de Moabe”; mais literalmente, “o ombro de Moabe”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a beleza da terra” ou “o esplendor da terra”.
    reason: lexical_alternative
  - marker: c
    text: O texto hebraico apresenta uma forma ortográfica do nome final que corresponde a Quiriataim, conhecida cidade moabita.
    reason: textual_variant
lexical_decisions:
- source_word: פֹתֵחַ
  choice: vou abrir
  rationale: O particípio ligado a הִנְנִי expressa uma ação iminente com vivacidade profética. “Vou abrir” soa natural em português e conserva esse sentido prospectivo.
- source_word: כֶּתֶף מוֹאָב
  choice: o flanco de Moabe
  rationale: כֶּתֶף significa literalmente “ombro”, mas, em contexto geográfico e militar, designa o lado ou flanco de um território. “Flanco” preserva a imagem de um lado que ficará vulnerável.
- source_word: מֵהֶעָרִים
  choice: a partir das cidades
  rationale: A preposição מִן indica o ponto a partir do qual o flanco será aberto. A formulação mantém a progressão do hebraico para a especificação seguinte, “das suas cidades fronteiriças”.
- source_word: מֵעָרָיו מִקָּצֵהוּ
  choice: das suas cidades fronteiriças
  rationale: A expressão indica as cidades situadas na extremidade ou fronteira de Moabe. “Cidades fronteiriças” transmite o sentido territorial de forma concisa.
- source_word: צְבִי אֶרֶץ
  choice: a glória da terra
  rationale: צְבִי pode significar beleza, esplendor ou glória. Aqui caracteriza as cidades nomeadas como o orgulho e ornamento da região, mantendo o tom elevado da profecia.
- source_word: בֵּית הַיְשִׁימֹת
  choice: Bete-Jesimote
  rationale: Transliteração adaptada à ortografia e à pronúncia correntes em português.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meom
  rationale: Transliteração portuguesa do topônimo hebraico, preservando sua forma reconhecível.
- source_word: וקריתמה
  choice: Quiriataim
  rationale: A forma escrita no texto hebraico corresponde à cidade moabita conhecida como Quiriataim; emprega-se a transliteração portuguesa convencional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção preserva a repetição e a progressão geográfica do hebraico, embora “a partir das cidades, das suas cidades fronteiriças” seja deliberadamente mais formal que a fala cotidiana. Os topônimos seguem formas portuguesas reconhecíveis.
