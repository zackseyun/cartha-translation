base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/017.yaml
  text: And I will execute great acts of vengeance on them with wrathful rebukes[a], and they will know that I am Yahweh when I lay my vengeance on them.
translation:
  language: pt
  text: E executarei contra eles grandes atos de vingança, com repreensões de ira[a]; e saberão que eu sou Yahweh, quando eu trouxer sobre eles a minha vingança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com repreensões furiosas” ou “com castigos movidos por ira”. A expressão hebraica combina “repreensões/correções” com “ira/furor” e pode abranger tanto a censura quanto a punição corretiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי בָם נְקָמוֹת גְּדֹלוֹת
  choice: executarei contra eles grandes atos de vingança
  rationale: O verbo עשה, combinado com o plural נְקָמוֹת, expressa realizar ou executar atos de vingança. A formulação mantém o plural hebraico e explicita seu valor concreto.
- source_word: בְּתוֹכְחוֹת חֵמָה
  choice: com repreensões cheias de furor
  rationale: תוֹכְחוֹת pode indicar repreensões, correções ou castigos disciplinares, enquanto חֵמָה denota furor ou ira intensa. A expressão preserva o núcleo lexical sem limitar o sentido apenas a palavras ou apenas a punições.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Então saberão que eu sou Yahweh
  rationale: A oração reproduz a fórmula de reconhecimento característica de Ezequiel. 'Então' expressa naturalmente a consequência contextual do juízo, e o nome divino é transliterado como Yahweh.
- source_word: בְּתִתִּי אֶת נִקְמָתִי בָּם
  choice: quando eu trouxer sobre eles a minha vingança
  rationale: O infinitivo de נתן com 'minha vingança' tem o sentido idiomático de impor ou infligir vingança. 'Trouxer sobre eles' é natural em português e conserva a imagem direcional da construção hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em conformidade com a política do projeto, sem substituí-lo por um título.
- issue: Alcance de בְּתוֹכְחוֹת חֵמָה
  choice: repreensões cheias de furor
  alternative: castigos furiosos; correções de ira
  rationale: O contexto é de juízo punitivo, mas o substantivo também conserva a ideia de repreensão ou correção. O texto principal e a nota mantêm essa tensão sem decidir indevidamente entre fala condenatória e castigo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'executarei' para a força judicial do contexto e mantém 'vingança' por sua correspondência direta com o hebraico. A nota registra a ambiguidade lexical relevante.
