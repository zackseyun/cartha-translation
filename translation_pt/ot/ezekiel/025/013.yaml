  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָטִ֤תִי יָדִ/י֙ עַל אֱד֔וֹם וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֣ם וּ/בְהֵמָ֑ה וּ/נְתַתִּ֤י/הָ חָרְבָּה֙ מִ/תֵּימָ֔ן וּ/דְדָ֖נֶ/ה בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/013.yaml
  text: 'Therefore thus says the Lord GOD: I will stretch out my hand against Edom[a], and I will cut off from it man and beast, and I will make it a desolation; from Teman even to Dedan they will fall by the sword.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: “Estenderei a minha mão contra Edom e eliminarei dela seres humanos e animais. Farei dela uma desolação; desde Temã até Dedã[a], cairão à espada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até mesmo Dedã”. A expressão hebraica indica a extensão da devastação de Temã até Dedã.'
    reason: Alternativa de nuance para a expressão geográfica; substitui a nota anterior, cuja paráfrase «em direção a Dedã» não representa adequadamente a construção.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: וְנָטִתִי יָדִי
  choice: Estenderei a minha mão
  rationale: Preserva a imagem hebraica de intervenção ativa em juízo e soa natural em português.
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: Expressa o sentido de remover ou exterminar os habitantes sem recorrer a uma formulação excessivamente literal e pouco idiomática como “cortarei”.
- source_word: אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  rationale: Reproduz o contraste abrangente entre a população humana e os animais, evitando que o singular coletivo אָדָם seja entendido como referência exclusiva a homens do sexo masculino.
- source_word: וּנְתַתִּיהָ חָרְבָּה
  choice: Farei dela uma desolação
  rationale: Conserva a força nominal de חָרְבָּה e o tom solene da declaração de juízo.
- source_word: מִתֵּימָן
  choice: desde Temã
  rationale: Trata תֵּימָן como topônimo edomita, não como o substantivo comum “sul”, e introduz o ponto inicial da extensão geográfica.
- source_word: וּדְדָנֶה
  choice: até Dedã
  rationale: A terminação direcional e o contexto geográfico permitem entender Dedã como o limite ou direção final da devastação; “até” comunica isso naturalmente.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: cairão à espada
  rationale: Preserva a expressão hebraica tradicional para morrer em combate ou execução violenta, sem explicitar além do texto quem os matará.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: O hebraico contém explicitamente o nome da aliança יהוה. A tradução o representa como “Yahweh” e mantém אֲדֹנָי como título, sem substituir o nome por outro título.
- issue: Alcance do juízo sobre אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  alternative: homem e animal
  rationale: A expressão é abrangente e coletiva. A tradução mantém tanto a dimensão humana quanto a animal sem restringir אָדָם a indivíduos masculinos.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe conserva as imagens centrais do hebraico, mas evita literalismos opacos.
