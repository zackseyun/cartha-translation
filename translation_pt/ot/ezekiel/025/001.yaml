  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «YHWH»; tradicionalmente traduzido por «SENHOR».'
    reason: Registra a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A construção narrativa com וַיְהִי introduz uma nova unidade profética. Em português, integrar o sentido ao verbo «veio» mantém a progressão do discurso sem a forma pouco natural «e aconteceu».
- source_word: דְבַר
  choice: a palavra de
  rationale: Na fórmula profética, דָּבָר designa a palavra ou mensagem divina. «A palavra de» preserva de modo claro e reconhecível a formulação hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz diretamente o Tetragrama, o nome pessoal divino; a transliteração «Yahweh» preserva essa distinção em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com sufixo da primeira pessoa do singular significa diretamente «a mim»; esta formulação é natural no português atual.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta que começa no versículo seguinte. «Dizendo» conserva a estrutura formal da fórmula profética e a continuidade sintática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega o Tetragrama, a tradução mantém o nome como «Yahweh». A nota registra a representação consonantal e a tradução tradicional sem identificar o nome com um mero título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A fórmula profética foi mantida em registro formal, sem arcaísmos. O marcador [a] foi colocado imediatamente após «mim», seguindo a posição fornecida na camada de consulta, embora a nota diga respeito ao nome «Yahweh».
