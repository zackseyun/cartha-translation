  text: Son of man[a], set your face toward the sons of Ammon, and prophesy against them.
translation:
  language: pt
  text: Filho do homem, dirija o rosto para os filhos de Amom[a] e profetize contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os amonitas”. Hebraico: “os filhos de Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma do tratamento divino característico dirigido a Ezequiel e mantém a consistência ao longo do livro.
- source_word: שִׂים פָּנֶיךָ
  choice: volte o rosto
  rationale: Conserva a imagem hebraica do rosto dirigido a alguém, mas usa uma formulação natural em português para o imperativo.
- source_word: אֶל
  choice: para
  rationale: Expressa a direção básica da preposição sem antecipar o sentido hostil, que aparece explicitamente em 'contra eles'.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Mantém a expressão de parentesco do hebraico e sua textura formal; a nota oferece o gentílico corrente.
- source_word: וְהִנָּבֵא
  choice: e profetize
  rationale: É o equivalente português direto e natural do imperativo profético.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: No contexto de um oráculo de juízo, a preposição tem sentido adversativo.
theological_decisions:
- issue: Forma da designação étnica בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  alternative: os amonitas
  rationale: A tradução preserva a expressão hebraica de parentesco sem transformar silenciosamente a designação em um gentílico; a alternativa idiomática é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção 'volte o rosto para' mantém a imagem profética sem a rigidez menos natural de 'ponha o rosto em direção a'.
