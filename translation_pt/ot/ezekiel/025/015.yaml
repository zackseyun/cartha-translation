  naturalness: O registro é claro e adequado. “Com desprezo na alma” é uma representação mais direta de בִּשְׁאָט בְּנֶפֶשׁ do que “com desprezo no íntimo”, sem deixar de ser compreensível em português moderno.
  terminology: “o Senhor Yahweh”, “filisteus”, “vingança” e “inimizade” são escolhas consistentes. “Inimizade antiga” reproduz uma possibilidade central de אֵיבַת עוֹלָם, enquanto a nota mantém explicitamente a possibilidade de duração perpétua.
