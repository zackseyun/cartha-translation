  rationale: A revisão substitui a formulação cumulativa “antiga e duradoura” por “antiga”, deixando a alternativa de continuidade explícita na nota e, assim, preservando a ambiguidade de עוֹלָם. Também torna “na alma” a leitura principal para refletir mais diretamente בְּנֶפֶשׁ. A vírgula final permanece, pois a oração continua no versículo seguinte.
