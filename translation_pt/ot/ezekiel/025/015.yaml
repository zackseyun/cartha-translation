  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן עֲשׂ֥וֹת פְּלִשְׁתִּ֖ים בִּ/נְקָמָ֑ה וַ/יִּנָּקְמ֤וּ נָקָם֙ בִּ/שְׁאָ֣ט בְּ/נֶ֔פֶשׁ לְ/מַשְׁחִ֖ית אֵיבַ֥ת עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/015.yaml
  text: 'Thus says the Lord GOD: Because the Philistines acted in vengeance and took revenge with contempt in the soul[a], to destroy with everlasting enmity[b],'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Visto que os filisteus agiram por vingança e se vingaram com desprezo na alma[a], para destruir com inimizade antiga[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com desprezo no íntimo” ou “com desprezo de todo o coração”. A expressão hebraica associa o desprezo a uma disposição interior que envolve a pessoa inteira.
    reason: lexical_alternative
  - marker: b
    text: Ou “com inimizade perpétua”. O hebraico עוֹלָם pode indicar uma hostilidade de longa data ou uma hostilidade que perdura.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa explicitamente o nome divino יהוה como “Yahweh”, evitando a combinação pouco natural “Senhor SENHOR”.
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz com clareza a causa do juízo anunciado, preservando a força causal.
- source_word: עֲשׂוֹת פְּלִשְׁתִּים בִּנְקָמָה
  choice: os filisteus agiram por vingança
  rationale: Expressa de modo natural a construção idiomática com o infinitivo עֲשׂוֹת e mantém explícita a ideia substantiva de vingança.
- source_word: וַיִּנָּקְמוּ נָקָם
  choice: e se vingaram
  rationale: A combinação de verbo e substantivo cognatos intensifica a ação; em português, “se vingaram” comunica naturalmente seu caráter deliberadamente retaliatório.
- source_word: בִּשְׁאָט בְּנֶפֶשׁ
  choice: com desprezo no íntimo
  rationale: Preserva tanto o desprezo hostil de שְׁאָט quanto a disposição interior e integral indicada por נֶפֶשׁ, sem reduzir automaticamente o termo a “coração”.
- source_word: לְמַשְׁחִית
  choice: para destruir
  rationale: Conserva a leitura mais direta da construção como finalidade da vingança.
- source_word: אֵיבַת עוֹלָם
  choice: com inimizade antiga e duradoura
  rationale: A formulação portuguesa conserva a amplitude contextual de עוֹלָם, que pode apontar tanto para uma hostilidade de longa data quanto para sua persistência.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A escolha distingue o título אֲדֹנָי do nome próprio יהוה e mantém este último visível, sem criar a repetição “Senhor SENHOR”.
- issue: Valor temporal de עוֹלָם em אֵיבַת עוֹלָם
  choice: inimizade antiga e duradoura
  alternative: inimizade eterna
  rationale: O hebraico permite referência à antiguidade, à continuidade ou a ambas. A tradução evita impor a noção metafísica de eternidade e preserva a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, mas evita construções artificiais. A vírgula final foi mantida porque o versículo introduz a continuação da sentença profética no versículo seguinte.
