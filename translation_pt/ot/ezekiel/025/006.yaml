  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן מַחְאֲ/ךָ֣ יָ֔ד וְ/רַקְעֲ/ךָ֖ בְּ/רָ֑גֶל וַ/תִּשְׂמַ֤ח בְּ/כָל שָֽׁאטְ/ךָ֙ בְּ/נֶ֔פֶשׁ אֶל אַדְמַ֖ת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/006.yaml
  text: 'For thus says the Lord GOD: Because you clapped your hands and stamped your feet[a], and rejoiced with all the contempt in your soul against the land of Israel,'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Visto que você bateu palmas, bateu o pé e se alegrou com todo o desprezo em sua alma[a] contra a terra de Israel,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com todo o seu desprezo”; possivelmente, “com toda a hostilidade em sua alma”.'
    reason: A ligação sintática de בְּנֶפֶשׁ com a expressão precedente admite mais de uma formulação em português. שָׁאט denota desprezo ou escárnio hostil.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, evitando a formulação pouco natural “Senhor SENHOR”.
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz com clareza a causa do juízo anunciado e se ajusta naturalmente à fórmula profética.
- source_word: מַחְאֲךָ יָד
  choice: você bateu palmas
  rationale: Expressa de modo idiomático o gesto hebraico de bater as mãos, aqui sinal de satisfação maliciosa.
- source_word: וְרַקְעֲךָ בְּרָגֶל
  choice: bateu os pés
  rationale: Reproduz em português natural o gesto enfático descrito pelo hebraico, cujo substantivo está no singular coletivo ou idiomático.
- source_word: וַתִּשְׂמַח
  choice: se alegrou
  rationale: Preserva o sentido direto de sentir alegria diante da desgraça de Israel.
- source_word: בְּכָל שָׁאטְךָ
  choice: com todo o desprezo
  rationale: שָׁאט indica desdém ou desprezo hostil; “desprezo” conserva o tom afetivo e moral sem explicitar além do texto.
- source_word: בְּנֶפֶשׁ
  choice: da sua alma
  rationale: Conserva a linguagem antropológica do hebraico e indica que o desprezo procedia do íntimo da pessoa; a relação sintática admite outras formulações, registradas em nota.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: contra a terra de Israel
  rationale: Embora אֶל costume significar “para” ou “em direção a”, o contexto hostil favorece “contra”; אַדְמָה é traduzido naturalmente como “terra”.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução mantém distinguíveis o título אֲדֹנָי e o nome da aliança יהוה, sem substituir o nome divino por outro título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para refletir o destinatário singular do hebraico. A oração permanece aberta ao versículo seguinte, como no texto-fonte.
