  revision_rationale: A revisão torna o gesto do pé mais fiel ao singular hebraico e esclarece a expressão relativa à alma sem eliminar sua textura antropológica nem sua ambiguidade sintática. A nota foi ajustada para manter alternativas semanticamente próximas do campo de desprezo hostil. A oração continua aberta, como no texto-fonte.
