  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֡ן הִנְ/נִי֩ נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וּ/נְתַתִּ֤י/ךָֽ ל/בג לַ/גּוֹיִ֔ם וְ/הִכְרַתִּ֨י/ךָ֙ מִן הָ֣/עַמִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךָ מִן הָ/אֲרָצ֑וֹת אַשְׁמִ֣ידְ/ךָ֔ וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/007.yaml
  text: Therefore[a], behold, I have stretched out my hand against you, and I will give you as plunder to the nations. I will cut you off from the peoples and destroy you from the lands; I will annihilate you, and you will know that I am Yahweh.
translation:
  language: pt
  text: Por isso, eis que estendi a mão contra você e entregarei você como despojo[a] às nações. Eu eliminarei você do meio dos povos e farei você desaparecer das terras; destruirei você, e você saberá que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para saque pelas nações”.'
    reason: Alternativa que explicita o sentido de espólio ou saque tomado por conquistadores, inerente ao termo hebraico.
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de modo natural a consequência judicial decorrente da acusação anterior.
- source_word: הִנְנִי
  choice: eis que
  rationale: Preserva a força dêitica e a solenidade da fórmula profética, sem deixar de ser compreensível em português atual.
- source_word: נָטִיתִי אֶת־יָדִי עָלֶיךָ
  choice: estendi a mão contra você
  rationale: Mantém a metáfora profética da intervenção ativa de Deus em juízo e reflete a forma verbal perfeita do hebraico.
- source_word: וּנְתַתִּיךָ לְבַג לַגּוֹיִם
  choice: a entregarei como despojo às nações
  rationale: Comunica o sentido de saque ou presa de conquista; o pronome feminino retoma a entidade coletiva interpelada no contexto, enquanto a nota registra alternativas lexicais.
- source_word: גּוֹיִם
  choice: nações
  rationale: Refere-se aqui aos povos estrangeiros em geral, sem a conotação posterior que poderia acompanhar 'gentios'.
- source_word: וְהִכְרַתִּיךָ מִן־הָעַמִּים
  choice: eliminarei você do meio dos povos
  rationale: Expressa o sentido causativo de cortar ou remover completamente, em português natural, e preserva a ideia de exclusão do conjunto dos povos.
- source_word: עַמִּים
  choice: povos
  rationale: Mantém distinção lexical em relação a גּוֹיִם, traduzido como 'nações'.
- source_word: וְהַאֲבַדְתִּיךָ מִן־הָאֲרָצוֹת
  choice: farei você desaparecer das terras
  rationale: Reproduz o valor causativo de אבד e a ideia espacial de remoção, evitando a construção pouco natural 'destruirei você das terras'.
- source_word: הָאֲרָצוֹת
  choice: as terras
  rationale: O plural aponta para territórios ou países, e não para o planeta inteiro.
- source_word: אַשְׁמִידְךָ
  choice: destruirei você
  rationale: Preserva a declaração climática de destruição total sem recorrer a um termo excessivamente técnico ou pouco corrente.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: e você saberá que eu sou Yahweh
  rationale: Mantém a fórmula de reconhecimento característica de Ezequiel e a coordenação explícita do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, preservando sua função de nome próprio da aliança.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A forma 'Yahweh' preserva o nome próprio e evita substituí-lo por um título.
- issue: Alcance da linguagem de destruição
  choice: Manter a sequência crescente de eliminação, desaparecimento e destruição
  alternative: Suavizar ou condensar as três expressões em uma única declaração
  rationale: A acumulação verbal pertence à retórica judicial do texto e deve permanecer sem que se defina além do que o versículo diz a natureza metafísica ou a duração dessa destruição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se 'eis que' pela solenidade da fórmula profética. O tratamento direto com 'você' torna explícita a segunda pessoa singular; em 'a entregarei', o pronome retoma a entidade coletiva interpelada no contexto.
