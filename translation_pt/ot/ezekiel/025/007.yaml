  source_fidelity: 'A tradução acompanha adequadamente a sequência judicial do hebraico: a mão estendida contra o destinatário, a entrega como despojo às nações, a remoção dos povos e das terras, a destruição e a fórmula final de reconhecimento de Yahweh. Contudo, o hebraico emprega sufixos de segunda pessoa masculina singular (por exemplo, וּנְתַתִּיךָ), ao passo que «a entregarei» introduz indevidamente um referente feminino.'
  naturalness: O registro é moderno, claro e adequadamente solene. «Eis que» funciona bem na fórmula profética. «Entregarei você como despojo» evita a discordância de gênero e permanece natural em português brasileiro e internacional.
  terminology: «Nações»/«povos», «terras» e «Yahweh» são escolhas adequadas. A nota foi ajustada para uma alternativa idiomática que preserve o sentido de saque ou espólio de conquista, sem o uso menos claro de «presa».
  issues:
