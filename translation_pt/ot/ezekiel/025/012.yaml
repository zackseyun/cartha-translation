  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן עֲשׂ֥וֹת אֱד֛וֹם בִּ/נְקֹ֥ם נָקָ֖ם לְ/בֵ֣ית יְהוּדָ֑ה וַ/יֶּאְשְׁמ֥וּ אָשׁ֖וֹם וְ/נִקְּמ֥וּ בָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/012.yaml
  text: 'Thus says the Lord GOD: Because Edom acted in vengeance against the house of Judah[a], and became very guilty, and took vengeance on them[b],'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Porque Edom agiu por vingança contra a casa de Judá[a], e os edomitas se tornaram muito culpados[b] e se vingaram deles,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “ao vingar vingança”, expressão enfática que indica agir de modo vingativo ou executar plena vingança.
    reason: lexical_alternative
  - marker: b
    text: Ou “incorreram em grande culpa”. O hebraico emprega uma construção enfática formada por termos da mesma raiz.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém os dois elementos do título composto e representa o nome divino יְהוָה como Yahweh, evitando a repetição pouco natural «Senhor SENHOR».
- source_word: יַעַן
  choice: Porque
  rationale: Introduz de modo direto e natural a causa do juízo anunciado na continuação da profecia.
- source_word: עֲשׂוֹת ... בִּנְקֹם נָקָם
  choice: agiu por vingança
  rationale: Expressa em português corrente a ação motivada por vingança; a nota conserva a construção enfática com termos cognatos no hebraico.
- source_word: לְבֵית יְהוּדָה
  choice: contra a casa de Judá
  rationale: «Contra» explicita a direção hostil exigida pelo contexto, enquanto «casa de Judá» preserva a designação nacional e dinástica.
- source_word: וַיֶּאְשְׁמוּ אָשׁוֹם
  choice: os edomitas se tornaram muito culpados
  rationale: O verbo e o termo cognato intensificam a culpa. «Muito culpados» comunica essa ênfase sem introduzir uma causa não expressa. «Os edomitas» torna natural em português a passagem do coletivo singular «Edom» aos verbos hebraicos no plural.
- source_word: וְנִקְּמוּ בָהֶם
  choice: e se vingaram deles
  rationale: Preserva o valor reflexivo da forma verbal e a repetição temática de vingança. «Deles» remete ao povo pertencente à casa de Judá.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida conserva tanto אֲדֹנָי, «Senhor», como o nome da aliança יְהוָה, «Yahweh», sem fundi-los num único título.
- issue: Culpa coletiva de Edom
  choice: Edom age como entidade coletiva, e «os edomitas» são declarados culpados
  alternative: manter «Edom» como sujeito singular em toda a frase
  rationale: O hebraico passa de «Edom» a verbos no plural. A formulação portuguesa reflete essa alternância sem resolver a culpa como meramente individual nem alterar seu caráter coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo introduz a consequência anunciada no versículo seguinte.
