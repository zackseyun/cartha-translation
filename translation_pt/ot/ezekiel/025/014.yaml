  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֨י אֶת נִקְמָתִ֜/י בֶּ/אֱד֗וֹם בְּ/יַד֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/עָשׂ֣וּ בֶ/אֱד֔וֹם כְּ/אַפִּ֖/י וְ/כַ/חֲמָתִ֑/י וְ/יָֽדְעוּ֙ אֶת נִקְמָתִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/014.yaml
  text: And I will set my vengeance on Edom by the hand of my people Israel[a], and they will deal with Edom according to my anger and according to my wrath; and they will know my vengeance[c][b], declares the Lord GOD.
translation:
  language: pt
  text: “Porei a minha vingança contra Edom[a] pela mão do meu povo Israel[b]. Eles agirão contra Edom[c] conforme a minha ira e o meu furor; e conhecerão a minha vingança”, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sobre Edom”. A preposição hebraica pode marcar o alvo de uma ação hostil.
    reason: lexical_alternative
  - marker: b
    text: Isto é, “por meio do meu povo Israel”. “Pela mão de” é um modo hebraico de indicar o instrumento ou agente.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Eles farão contra Edom”. O verbo hebraico é amplo e pode significar “fazer” ou “agir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־נִקְמָתִי
  choice: Porei a minha vingança
  rationale: נתן tem o sentido básico de dar, pôr ou colocar. Com נִקְמָה, “porei a minha vingança” conserva a imagem concreta do hebraico e permanece compreensível em português.
- source_word: בֶּאֱדוֹם
  choice: contra Edom
  rationale: A preposição ב, em contexto de ação hostil, pode indicar o alvo. “Contra Edom” expressa isso naturalmente, sem confundi-la com simples localização.
- source_word: בְּיַד עַמִּי יִשְׂרָאֵל
  choice: pela mão do meu povo Israel
  rationale: Mantém a imagem do idioma instrumental hebraico e apresenta Israel como o agente humano por meio do qual Deus executará a ação.
- source_word: וְעָשׂוּ בֶאֱדוֹם
  choice: Eles agirão contra Edom
  rationale: עשה é um verbo amplo, “fazer” ou “agir”. A tradução evita especificar além do texto a natureza exata da ação, embora o contexto indique juízo.
- source_word: כְּאַפִּי וְכַחֲמָתִי
  choice: conforme a minha ira e o meu furor
  rationale: Preserva os dois termos hebraicos correlatos, אַף e חֵמָה, bem como sua intensificação retórica, sem reduzi-los a uma única palavra.
- source_word: וְיָדְעוּ אֶת־נִקְמָתִי
  choice: e conhecerão a minha vingança
  rationale: Conserva a formulação deliberadamente forte e concisa de ידע. No contexto, o conhecimento é experiencial, mas a tradução não acrescenta explicitamente uma explicação ausente do texto.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é uma fórmula profética de declaração. “Yahweh” representa diretamente o nome divino יהוה, enquanto “Senhor” traduz אֲדֹנָי.
theological_decisions:
- issue: Agência divina e humana no juízo contra Edom
  choice: Deus põe sua própria vingança contra Edom pela mão de Israel
  alternative: Israel age de forma independente, ou Deus age sem instrumento humano
  rationale: A sintaxe atribui a vingança a Deus e, ao mesmo tempo, identifica Israel como seu instrumento. A tradução mantém as duas afirmações sem fundi-las.
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS; o Soberano Senhor
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome pessoal יהוה e torna visível ao leitor a presença do nome divino no texto hebraico.
- issue: Sentido de “conhecerão a minha vingança”
  choice: Preservar a expressão sem identificar explicitamente quem são “eles” nem parafrasear como “experimentarão”
  alternative: Eles experimentarão a minha vingança
  rationale: O hebraico pode sugerir conhecimento por experiência, mas sua formulação permanece mais ampla. A tradução conserva essa tensão e a referência pronominal contextual.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível a leitores brasileiros e amplamente compreensível no mundo lusófono. A repetição de “minha” e o paralelismo entre “ira” e “furor” foram mantidos por sua força retórica. “Pela mão” conserva uma imagem semítica relevante, esclarecida em nota.
