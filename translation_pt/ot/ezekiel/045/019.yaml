base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/019.yaml
  text: And the priest shall take some of the blood of the sin offering and put it on the doorposts of the temple[a], on the four corners of the altar ledge, and on the doorposts of the gate of the inner court.
translation:
  language: pt
  text: O sacerdote tomará um pouco do sangue da oferta pelo pecado[a] e o porá na ombreira do templo, nos quatro cantos do ressalto do altar[b] e na ombreira do portão do pátio interno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico pode designar, em contextos sacrificiais, a oferta associada ao pecado e à purificação.
    reason: Alternativa lexical e nuance teológica genuína de חַטָּאת.
  - marker: b
    text: O sentido arquitetônico preciso do termo hebraico é incerto. Também pode ser entendido como “plataforma” ou “recinto do altar”.
    reason: Ambiguidade arquitetônica de עֲזָרָה.
lexical_decisions:
- source_word: וְלָקַח
  choice: tomará
  rationale: O perfeito com waw consecutivo expressa a próxima ação prescrita no contexto ritual; o futuro em português comunica naturalmente essa instrução.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Mantém o substantivo definido e singular do hebraico.
- source_word: מִדַּם
  choice: um pouco do sangue
  rationale: A preposição מִן indica que se toma uma porção do sangue, e não todo ele.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta ligada ao pecado e à purificação; esta formulação é clara e tradicional, enquanto a alternativa funcional é preservada em nota.
- source_word: וְנָתַן
  choice: e o porá
  rationale: נתן, neste contexto ritual, significa pôr ou aplicar o sangue; o pronome retoma claramente 'sangue'.
- source_word: אֶל מְזוּזַת הַבַּיִת
  choice: na ombreira do templo
  rationale: מְזוּזָה está no singular e designa a ombreira de uma entrada; הַבַּיִת refere-se aqui ao edifício do templo.
- source_word: אַרְבַּע פִּנּוֹת הָעֲזָרָה לַמִּזְבֵּחַ
  choice: nos quatro cantos do ressalto do altar
  rationale: פִּנּוֹת significa 'cantos'. Neste contexto arquitetônico, עֲזָרָה provavelmente designa o ressalto ou plataforma saliente do altar, embora o termo seja incomum e admita outra análise.
- source_word: וְעַל מְזוּזַת שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: e na ombreira do portão do pátio interno
  rationale: Conserva o singular מְזוּזַת e traduz de modo natural a terminologia arquitetônica do complexo do templo.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A expressão nomeia o sacrifício, não o pecado em abstrato. 'Oferta pelo pecado' mantém a ligação lexical com pecado; a nota registra 'oferta de purificação', que ressalta a função ritual sem resolver indevidamente a nuance.
- issue: Função do sangue aplicado às estruturas
  choice: descrever a ação ritual sem explicitar uma teoria de expiação ou purificação
  alternative: acrescentar que o sangue purifica ou expia cada estrutura
  rationale: O versículo prescreve onde pôr o sangue, mas não declara explicitamente aqui a formulação teológica de seu efeito; a tradução evita acrescentá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'pátio interno' e 'portão' para clareza arquitetônica; conserva os singulares hebraicos em 'ombreira'. 'Ressalto' é um termo arquitetônico conciso, esclarecido por nota.
