base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/013.yaml
  text: 'This is the contribution that you shall offer: one-sixth of an ephah from each homer of wheat[a], and one-sixth of an ephah from each homer of barley.'
translation:
  language: pt
  text: 'Esta é a contribuição que vocês deverão apresentar: um sexto de efa de cada hômer de trigo[a] e um sexto de efa de cada hômer de cevada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O efa e o hômer são antigas unidades de capacidade para produtos secos; o versículo determina uma contribuição fixa de um sexto de efa por hômer de cereal.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמָה
  choice: contribuição
  rationale: No contexto administrativo e cultual, indica uma porção separada e apresentada; “contribuição” comunica naturalmente a prestação fixa sem recorrer ao arcaico “oferta alçada”.
- source_word: תָּרִימוּ
  choice: deverão apresentar
  rationale: O hifil de רום com תְּרוּמָה tem o sentido idiomático de apresentar uma contribuição, não simplesmente erguê-la.
- source_word: שִׁשִּׁית
  choice: um sexto
  rationale: Expressa de modo claro e corrente a fração especificada pelo texto.
- source_word: אֵיפָה
  choice: efa
  rationale: Mantém o nome técnico da antiga unidade de medida para secos.
- source_word: חֹמֶר
  choice: ômer
  rationale: Translitera a unidade de capacidade חֹמֶר e a distingue do gômer; a nota explica seu caráter antigo.
- source_word: מֵחֹמֶר
  choice: de cada ômer
  rationale: A formulação explicita em português o valor distributivo implícito da contribuição cobrada por unidade.
- source_word: הַחִטִּים
  choice: trigo
  rationale: O nome do cereal sem artigo é natural em português nesta fórmula de medição.
- source_word: וְשִׁשִּׁיתֶם
  choice: e um sexto
  rationale: Apesar da forma morfologicamente incomum, o paralelismo mostra que introduz a mesma fração para a cevada.
- source_word: הַשְּׂעֹרִים
  choice: cevada
  rationale: Tradução comum e idiomática do cereal mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com plural inclusivo “vocês” apropriado ao verbo hebraico no plural. As unidades antigas foram transliteradas e explicadas em nota; “deverão” preserva o caráter normativo da instrução.
