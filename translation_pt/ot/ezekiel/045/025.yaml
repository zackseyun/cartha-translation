base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/025.yaml
  text: 'In the seventh month[a], on the fifteenth day of the month, at the feast, he shall provide the same offerings for seven days: the sin offering, the burnt offering, the grain offering[b], and the oil.'
translation:
  language: pt
  text: 'No sétimo mês, no décimo quinto dia do mês, na festa, ele providenciará por sete dias as mesmas ofertas: a oferta pelo pecado, o holocausto, a oferta de cereais e o azeite.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּ/שְּׁבִיעִי
  choice: No sétimo mês
  rationale: O ordinal, seguido da data do mês, tem sentido calendárico; explicitar “mês” é necessário para clareza natural em português.
- source_word: בַּ/חֲמִשָּׁה עָשָׂר יוֹם לַ/חֹדֶשׁ
  choice: no décimo quinto dia do mês
  rationale: Expressão calendárica hebraica padrão, vertida de modo formal e corrente.
- source_word: בֶּ/חָג
  choice: durante a festa
  rationale: חָג designa uma festa religiosa, aqui a festa iniciada no décimo quinto dia; “durante” expressa naturalmente o âmbito temporal.
- source_word: יַעֲשֶׂה כָ/אֵלֶּה
  choice: ele providenciará ... as mesmas ofertas
  rationale: Embora literalmente seja “fará como estas”, a expressão retoma as ofertas prescritas anteriormente. “Providenciará” reflete a responsabilidade do príncipe sem lhe atribuir diretamente a função sacerdotal de oferecê-las.
- source_word: שִׁבְעַת הַ/יָּמִים
  choice: durante sete dias
  rationale: Indica a duração ao longo do período festivo; esta formulação é idiomática e clara.
- source_word: כַּֽ/חַטָּאת
  choice: a oferta pelo pecado
  rationale: Termo sacrificial tradicional e inteligível; o כ prefixedo integra a enumeração das categorias correspondentes.
- source_word: כָ/עֹלָה
  choice: o holocausto
  rationale: Equivalente português consagrado para a oferta inteiramente queimada.
- source_word: וְ/כַ/מִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה designa especificamente a oferta não animal preparada com cereais.
- source_word: וְ/כַ/שָּׁמֶן
  choice: e o azeite
  rationale: Preserva a determinação do hebraico e identifica o azeite prescrito que acompanha as ofertas.
theological_decisions:
- issue: Referente do sujeito implícito de יַעֲשֶׂה
  choice: “ele”, referindo-se ao príncipe do contexto imediato
  alternative: um adorador ou oficiante não especificado
  rationale: O contexto atribui repetidamente ao príncipe a provisão dessas ofertas. Manter apenas “ele” preserva a forma do hebraico, enquanto “providenciará” evita atribuir-lhe uma função sacerdotal além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a referência anafórica às ofertas anteriores e evita uma formulação excessivamente literal que obscureceria o sentido.
