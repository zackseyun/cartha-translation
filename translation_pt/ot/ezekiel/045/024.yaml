base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/024.yaml
  text: And as the grain offering[a], he shall provide an ephah for each bull and an ephah for each ram, and a hin of oil for each ephah.
translation:
  language: pt
  text: Como oferta de cereal, ele providenciará uma efa para cada novilho e uma efa para cada carneiro, e um him de óleo para cada efa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele fará” ou “ele preparará”. O verbo hebraico significa literalmente “fazer” e, em contexto sacrificial, pode referir-se ao preparo ou fornecimento da oferta exigida.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: No contexto sacrificial, designa uma oferta feita de produtos de cereal, e não uma oferta genérica.
- source_word: אֵיפָה
  choice: efa
  rationale: Mantém a unidade hebraica de medida para secos e a precisão da terminologia ritual.
- source_word: לַפָּר
  choice: para cada novilho
  rationale: A construção tem sentido distributivo nesta prescrição sacrificial; “novilho” é natural e adequado para o animal bovino oferecido.
- source_word: לָאַיִל
  choice: para cada carneiro
  rationale: Expressa com clareza a quantidade exigida por animal.
- source_word: יַעֲשֶׂה
  choice: ele providenciará
  rationale: O verbo significa literalmente “fazer”, mas, neste contexto ritual, pode indicar preparar ou fornecer a oferta exigida.
- source_word: שֶׁמֶן
  choice: óleo
  rationale: O hebraico não especifica “azeite”; a tradução evita acrescentar uma identificação não expressa.
- source_word: הִין
  choice: him
  rationale: Preserva a unidade hebraica de medida para líquidos, usando sua forma tradicional em português.
- source_word: לָאֵיפָה
  choice: para cada efa
  rationale: Comunica naturalmente a proporção de óleo correspondente a cada medida de cereal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia ritual precisa. As unidades antigas “efa” e “him” foram mantidas, e o sentido prescritivo e distributivo foi explicitado sem converter as medidas.
