  text: וְ/שֶׂה אַחַ֨ת מִן הַ/צֹּ֤אן מִן הַ/מָּאתַ֨יִם֙ מִ/מַּשְׁקֵ֣ה יִשְׂרָאֵ֔ל לְ/מִנְחָ֖ה וּ/לְ/עוֹלָ֣ה וְ/לִ/שְׁלָמִ֑ים לְ/כַפֵּ֣ר עֲלֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/015.yaml
  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
translation:
  language: pt
  text: e uma ovelha de cada duzentas ovelhas do rebanho, das pastagens bem irrigadas de Israel[a], para a oferta de cereal, para o holocausto e para as ofertas de paz, a fim de fazer expiação por eles, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das terras irrigadas de Israel” ou “das ricas pastagens de Israel”. A expressão hebraica provavelmente se refere a terras de pasto bem abastecidas de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֶׂה אַחַת
  choice: e uma ovelha
  rationale: שֶׂה designa um animal do rebanho miúdo, ovelha ou cabra, e pode indicar um cordeiro. Neste contexto de contribuição proporcional, “ovelha” é natural sem especificar indevidamente idade ou sexo.
- source_word: מִן הַצֹּאן מִן הַמָּאתַיִם
  choice: de cada duzentas do rebanho
  rationale: 'A construção exprime a proporção exigida: um animal de cada duzentos pertencentes ao rebanho. A concordância no feminino acompanha “ovelhas” subentendido pelo contexto imediato.'
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  choice: das pastagens bem irrigadas de Israel
  rationale: מַשְׁקֶה relaciona-se literalmente a água ou irrigação e, aqui, provavelmente designa metonimicamente terra de pasto bem abastecida de água, de onde vêm os animais.
- source_word: לְמִנְחָה
  choice: para a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה normalmente se refere à oferta de cereal, embora em sentido mais amplo possa significar presente ou tributo.
- source_word: וּלְעוֹלָה
  choice: para o holocausto
  rationale: עוֹלָה é o termo técnico usual para a oferta totalmente queimada; “holocausto” é a designação bíblica tradicional e corrente em português.
- source_word: וְלִשְׁלָמִים
  choice: para as ofertas de paz
  rationale: שְׁלָמִים designa sacrifícios associados à paz e ao bem-estar. “Ofertas de paz” preserva essa amplitude melhor que uma formulação mais interpretativa como “ofertas de comunhão”.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: a fim de fazer expiação por eles
  rationale: כפר em contexto sacrificial tem força cultual; “fazer expiação” preserva essa força sem impor uma teoria específica da expiação.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração divina. “Senhor Yahweh” traduz tanto אֲדֹנָי quanto o nome divino יְהוִה, evitando a repetição artificial “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino יְהוִה na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida torna explícito o nome próprio divino e traduz separadamente אֲדֹנָי como “Senhor”. Isso preserva a distinção presente no hebraico sem recorrer à substituição tipográfica tradicional.
- issue: Sentido cultual de לְכַפֵּר עֲלֵיהֶם
  choice: fazer expiação por eles
  alternative: purificá-los / fazer propiciação por eles
  rationale: O hebraico admite nuances cultuais relacionadas à expiação e à purificação. A tradução mantém o termo abrangente tradicional e não resolve o mecanismo teológico além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação sacrificial foi ajustada de modo natural, mantendo os termos cultuais tradicionais. A ambiguidade lexical da expressão ligada à irrigação é preservada em nota.
