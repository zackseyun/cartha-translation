base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/007.yaml
  text: And for the prince there shall be land on both sides of the holy district and the property of the city[a], adjoining the holy district and adjoining the property of the city, from the west side westward and from the east side eastward; and in length corresponding to one of the tribal portions[b], from the western border to the eastern border.
translation:
  language: pt
  text: Para o príncipe haverá terra dos dois lados da porção sagrada[a] e da propriedade da cidade, junto à porção sagrada e à propriedade da cidade. Ela se estenderá do lado oeste[b] para o oeste e do lado leste para o leste; seu comprimento corresponderá ao de uma das porções tribais, desde a fronteira oeste até a fronteira leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “contribuição sagrada”. Aqui, a expressão se refere à área de terra separada para uso sagrado.'
    reason: lexical_alternative
  - marker: b
    text: Nestas descrições territoriais, o hebraico usa literalmente “mar” para indicar o oeste.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּשִׂיא
  choice: para o príncipe
  rationale: Em Ezequiel, נָשִׂיא designa normalmente o governante civil. “Príncipe” preserva esse uso característico sem reduzir o termo a um líder genérico.
- source_word: מִזֶּה וּמִזֶּה
  choice: dos dois lados
  rationale: A expressão idiomática indica que as terras do príncipe ficam de um lado e do outro da área sagrada e urbana.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: a porção sagrada
  rationale: Neste contexto territorial, תְּרוּמָה é uma área de terra separada para uso sagrado, e não uma oferta monetária. “Porção sagrada” mantém a ideia de algo reservado e consagrado.
- source_word: אֲחֻזַּת הָעִיר
  choice: a propriedade da cidade
  rationale: אֲחֻזָּה denota posse ou propriedade fundiária; a formulação é clara no contexto de distribuição territorial.
- source_word: אֶל־פְּנֵי ... וְאֶל־פְּנֵי
  choice: junto a ... e a
  rationale: Embora a expressão seja literalmente espacial, “junto a” comunica naturalmente a contiguidade das áreas neste contexto de limites territoriais.
- source_word: מִפְּאַת יָם יָמָּה
  choice: do lado oeste para o oeste
  rationale: יָם pode significar “mar”, mas em descrições territoriais funciona como indicação do oeste. A repetição direcional do hebraico foi preservada.
- source_word: וּמִפְּאַת קֵדְמָה קָדִימָה
  choice: do lado leste para o leste
  rationale: A tradução mantém o paralelismo e a formulação cadastral repetitiva do texto hebraico.
- source_word: וְאֹרֶךְ
  choice: seu comprimento
  rationale: A explicitação do pronome produz uma frase natural em português e preserva a mudança para a dimensão longitudinal.
- source_word: לְעֻמּוֹת אַחַד הַחֲלָקִים
  choice: corresponderá ao de uma das porções tribais
  rationale: לְעֻמּוֹת exprime correspondência ou alinhamento. O contexto mostra que as porções são as faixas territoriais das tribos; “ao de” esclarece que se trata do comprimento, sem afirmar necessariamente igualdade de área.
- source_word: מִגְּבוּל יָם אֶל־גְּבוּל קָדִימָה
  choice: desde a fronteira oeste até a fronteira leste
  rationale: Formulação portuguesa direta para a extensão completa entre os limites ocidental e oriental.
