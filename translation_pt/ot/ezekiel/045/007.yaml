  naturalness: O português é moderno, claro e mantém um registro apropriado para uma descrição territorial. A divisão em duas frases facilita a leitura sem perda material do encadeamento hebraico.
  terminology: «Príncipe», «porção sagrada», «propriedade da cidade» e «porções tribais» são escolhas consistentes com o contexto de Ezequiel. A nota da porção sagrada deve evitar «oferta», que em português pode sugerir primariamente uma dádiva cultual, enquanto o contexto trata de uma porção de terreno separada.
