  - severity: low
    issue: A nota [a] oferece «oferta sagrada» como alternativa lexical.
    rationale: «Contribuição sagrada» é a alternativa mais precisa para תְּרוּמָה; «oferta» pode induzir a leitura de uma dádiva, em vez de uma parcela territorial reservada.
