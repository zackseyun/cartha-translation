  text: And the shekel shall be twenty gerahs[a]; twenty shekels, twenty-five shekels[b], and fifteen shekels shall be your mina.
translation:
  language: pt
  text: O siclo será de vinte geras[a]; vinte siclos, vinte e cinco siclos e quinze siclos serão a mina de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A gera era uma pequena unidade de peso ou valor. Vinte geras correspondiam a um siclo.
    reason: cultural_note
  - marker: b
    text: O hebraico enumera a mina como vinte siclos, vinte e cinco siclos e quinze siclos, totalizando sessenta siclos. Esse valor difere de outros cálculos antigos da mina e pode refletir um padrão específico da legislação do templo em Ezequiel. “Mina” também pode ser transliterada como “manê”.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: הַשֶּׁקֶל
  choice: o siclo
  rationale: Emprega o nome convencional em português para a antiga unidade de peso e valor, preservando o artigo que indica um padrão definido.
- source_word: גֵּרָה
  choice: geras
  rationale: Mantém transliterada a pequena unidade antiga, sem impor uma conversão moderna aproximada.
- source_word: שְׁקָלִים / שֶׁקֶל
  choice: siclos
  rationale: Traduz de modo uniforme a unidade de peso ou valor; o singular hebraico depois de quinze é expresso naturalmente no plural em português.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים
  choice: vinte e cinco
  rationale: Segue a ordem numérica natural do português moderno.
- source_word: עֲשָׂרָה וַחֲמִשָּׁה
  choice: quinze
  rationale: Expressa o numeral na forma corrente em português.
- source_word: הַמָּנֶה
  choice: a mina
  rationale: Usa a designação convencional da unidade maior de peso ou valor, evitando convertê-la em medida moderna.
- source_word: יִהְיֶה לָכֶם
  choice: serão a mina de vocês
  rationale: Conserva a força normativa da construção e liga explicitamente o padrão da mina aos destinatários.
