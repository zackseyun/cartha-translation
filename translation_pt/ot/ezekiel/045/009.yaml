base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/009.yaml
  text: 'Thus says the Lord GOD: Enough from you[a], princes of Israel! Remove violence and plunder, and do justice and righteousness. Put away your evictions from my people, declares the Lord GOD.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Já basta, príncipes de Israel! Abandonem a violência e o saque e pratiquem a justiça e a retidão. Parem de expulsar[a] o meu povo”, declara o Senhor Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ponham fim aos atos de expulsão contra o meu povo” ou “parem de privar o meu povo de suas terras ou propriedades”. O termo hebraico indica o ato de pôr pessoas para fora e, neste contexto, pode incluir a retirada forçada de pessoas de suas terras ou propriedades.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יְהוָה como “Yahweh”, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: רַב לָכֶם
  choice: Já basta
  rationale: Expressa de modo natural e enérgico a repreensão dirigida aos governantes. O contexto e o vocativo preservam a força de לָכֶם, isto é, “basta da parte de vocês”.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: príncipes de Israel
  rationale: Preserva a nuance político-governamental de נָשִׂיא no uso de Ezequiel, em vez do termo mais genérico “líderes”.
- source_word: חָמָס וָשֹׁד
  choice: a violência e o saque
  rationale: “Violência” comunica a brutalidade e a injustiça social de חָמָס; “saque” expressa a apropriação predatória indicada por שֹׁד.
- source_word: הָסִירוּ
  choice: Abandonem
  rationale: No contexto de práticas injustas, “abandonem” transmite naturalmente a ordem de removê-las ou fazê-las cessar.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: a justiça e a retidão
  rationale: 'Conserva distintos os dois termos da fórmula ética hebraica: governo e julgamento justos, e conduta moralmente reta.'
- source_word: עֲשׂוּ
  choice: pratiquem
  rationale: É a forma corrente em português de expressar a realização habitual da justiça e da retidão, sem reduzir a ordem a um único ato.
- source_word: הָרִימוּ גְרֻשֹׁתֵיכֶם מֵעַל עַמִּי
  choice: Parem de expulsar o meu povo
  rationale: Expressa em português natural a ordem de fazer cessar os atos dos governantes que removiam pessoas de suas terras ou posses. Uma nota preserva a amplitude possível do substantivo גְרֻשׁוֹת.
theological_decisions:
- issue: Representação do nome divino יְהוָה na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução mantém o título e, ao mesmo tempo, torna visível o nome da aliança presente no texto hebraico.
- issue: Relação entre מִשְׁפָּט e צְדָקָה
  choice: justiça e retidão
  alternative: direito e justiça
  rationale: 'A opção preserva os dois conceitos sem fundi-los: justiça no governo e nos julgamentos, acompanhada de retidão ética. A alternativa é possível, mas “direito” pode soar excessivamente técnico ao leitor comum.'
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. “Já basta” conserva o tom confrontador; “Parem de expulsar” evita uma construção nominal artificial, enquanto a nota registra a amplitude do hebraico.
