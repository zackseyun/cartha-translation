base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/014.yaml
  text: And the fixed due of oil shall be one bath of oil from each cor[a], from ten baths, that is, one homer[c][b], for ten baths are one homer.
translation:
  language: pt
  text: A contribuição prescrita de óleo será de um décimo de bato por coro.[a] Dez batos correspondem a um ômer, pois dez batos são um ômer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bato, coro e ômer eram antigas unidades israelitas de medida. O hebraico diz literalmente: “um décimo do bato a partir do coro”. O próprio versículo informa que dez batos equivalem a um ômer.'
    reason: Nota lexical e cultural necessária para esclarecer as unidades antigas e preservar a proporção expressa no hebraico.
lexical_decisions:
- source_word: חֹק
  choice: contribuição prescrita
  rationale: No contexto das ofertas devidas, o termo indica uma porção estabelecida ou obrigação determinada, não simplesmente uma lei abstrata.
- source_word: שֶּׁמֶן
  choice: óleo
  rationale: O hebraico diz genericamente “óleo”; embora provavelmente se trate de azeite de oliva, a espécie não é explicitada no versículo.
- source_word: בַּת
  choice: bato
  rationale: Mantém por transliteração a antiga unidade israelita para líquidos, sem impor uma conversão moderna incerta.
- source_word: מַעְשַׂר הַבַּת מִן הַכֹּר
  choice: a décima parte de um bato por coro
  rationale: Preserva o valor explícito de מַעְשַׂר, “décima parte”, e a relação indicada por מִן, evitando alterar a proporção para um bato inteiro por coro.
- source_word: כֹּר
  choice: coro
  rationale: Translitera a antiga unidade de capacidade e a distingue do ômer, embora o próprio texto apresente sua equivalência metrológica.
- source_word: עֲשֶׂרֶת הַבַּתִּים
  choice: dez batos
  rationale: Reproduz diretamente a equivalência numérica fornecida pelo texto.
- source_word: חֹמֶר
  choice: ômer
  rationale: Translitera a unidade antiga, cuja equivalência com dez batos é explicada no próprio versículo.
- source_word: כִּי
  choice: pois
  rationale: Conserva o valor explicativo ou causal normal da conjunção na repetição final.
theological_decisions:
- issue: Proporção da contribuição de óleo
  choice: um décimo de bato por coro
  alternative: um bato por coro
  rationale: A construção hebraica מַעְשַׂר הַבַּת מִן הַכֹּר explicita “um décimo do bato a partir do coro”. A alternativa elimina מַעְשַׂר e aumenta a contribuição em dez vezes.
translation_notes:
  register: Português moderno, claro e digno, com termos metrológicos transliterados. “Medida pelo bato” torna natural a expressão hebraica comprimida “o bato do óleo”. A repetição final da equivalência entre dez batos e um ômer foi mantida por corresponder à forma enfática do texto hebraico.
