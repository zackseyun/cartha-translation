  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִהְיֶ֤ה מִ/זֶּה֙ אֶל הַ/קֹּ֔דֶשׁ חֲמֵ֥שׁ מֵא֛וֹת בַּ/חֲמֵ֥שׁ מֵא֖וֹת מְרֻבָּ֣ע סָבִ֑יב וַ/חֲמִשִּׁ֣ים אַמָּ֔ה מִגְרָ֥שׁ ל֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/002.yaml
  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
translation:
  language: pt
  text: Dessa área, será destinado ao lugar santo[a] um quadrado de quinhentos por quinhentos côvados, com uma faixa de terreno aberto[b] de cinquenta côvados ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao santuário”. O hebraico קֹדֶשׁ pode designar aqui a área sagrada em sentido mais amplo, e não apenas o edifício do santuário.
    reason: lexical_alternative
  - marker: b
    text: Ou “terra de pastagem” ou “terreno comum”. O hebraico מִגְרָשׁ designa a área livre situada ao redor do local.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּה
  choice: Dessa área
  rationale: A expressão retoma a porção de terra descrita no contexto anterior. A explicitação de “área” produz português natural sem mudar o referente.
- source_word: אֶל הַקֹּדֶשׁ
  choice: ao lugar santo
  rationale: A preposição indica destinação, e קֹדֶשׁ designa aqui a área sagrada sem necessariamente se limitar ao edifício do santuário.
- source_word: חֲמֵשׁ מֵאוֹת בַּחֲמֵשׁ מֵאוֹת
  choice: quinhentos por quinhentos côvados
  rationale: A fórmula expressa dimensões. Embora a unidade esteja implícita nessa primeira medida, “côvados” é explicitado pelo contexto imediato e evita uma medida incompleta em português.
- source_word: מְרֻבָּע סָבִיב
  choice: um quadrado
  rationale: O particípio indica uma forma quadrada em todos os lados; “um quadrado” comunica isso de maneira clara e natural.
- source_word: וַחֲמִשִּׁים אַמָּה
  choice: de cinquenta côvados
  rationale: A medida especifica a largura da faixa adicional que circunda a área santa.
- source_word: מִגְרָשׁ
  choice: faixa de terreno aberto
  rationale: O termo designa uma área livre ou comum ao redor de um local. “Faixa de terreno aberto” ressalta sua função espacial sem pressupor que fosse exclusivamente pastagem.
- source_word: לוֹ סָבִיב
  choice: ao redor
  rationale: A expressão indica que o terreno aberto circundava a área santa; o referente é claro na construção portuguesa.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe acessível. “Dessa área” retoma naturalmente a porção anterior; “será destinado” conserva o caráter de atribuição. A unidade “côvados” foi explicitada na primeira dimensão para evitar ambiguidade, pois aparece expressamente na segunda medida do mesmo versículo.
