  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ תִּקַּ֥ח פַּר בֶּן בָּקָ֖ר תָּמִ֑ים וְ/חִטֵּאתָ֖ אֶת הַ/מִּקְדָּֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/018.yaml
  text: 'Thus says the Lord GOD: In the first month[a], on the first day of the month, you shall take a bull from the herd without blemish, and you shall purify the sanctuary.'
translation:
  language: pt
  text: 'Assim diz o Senhor DEUS: No primeiro mês, no primeiro dia do mês, você pegará um novilho do rebanho, sem defeito, e purificará o santuário.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fará expiação pelo santuário”. O verbo hebraico é um termo ritual que pode indicar purificação ou remoção da contaminação causada pelo pecado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Mantém a distinção convencional do título divino composto, evitando a repetição artificial “Senhor SENHOR”.
- source_word: בָּרִאשׁוֹן
  choice: No primeiro mês
  rationale: O contexto calendárico da expressão seguinte deixa implícito que se trata do primeiro mês; a explicitação é necessária para clareza natural em português.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: Expressão hebraica convencional de data, literalmente “no um do mês”, com o sentido de primeiro dia.
- source_word: תִּקַּח
  choice: você pegará
  rationale: O imperfeito tem força diretiva neste contexto legal e ritual; o futuro preserva esse tom de instrução em português corrente.
- source_word: פַּר בֶּן בָּקָר
  choice: um novilho do rebanho
  rationale: Designa um bovino macho destinado ao sacrifício; “novilho do rebanho” é claro e natural sem impor uma idade excessivamente precisa.
- source_word: תָּמִים
  choice: sem defeito
  rationale: Expressão cultual consagrada para um animal sacrificial íntegro e aceitável.
- source_word: וְחִטֵּאתָ
  choice: e purificará
  rationale: No piel e em contexto ritual, o verbo indica remover a impureza ou contaminação do pecado; “purificar” comunica essa ação sem sugerir que o santuário tenha cometido pecado.
- source_word: הַמִּקְדָּשׁ
  choice: o santuário
  rationale: Termo abrangente e apropriado para o recinto ou lugar sagrado.
theological_decisions:
- issue: Sentido do verbo ritual חטא quando o santuário é seu objeto
  choice: purificará o santuário
  alternative: fará expiação pelo santuário
  rationale: “Purificará” expressa diretamente a descontaminação ritual, enquanto a nota preserva a tradução tradicional por “fazer expiação” e a tensão lexical do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. Emprega “você” para o destinatário singular da instrução e mantém linguagem cultual reconhecível sem arcaísmos desnecessários.
