source:
  edition: WLC
  text: קֹ֣דֶשׁ מִן הָ/אָ֜רֶץ ה֗וּא לַ/כֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַ/מִּקְדָּשׁ֙ יִֽהְיֶ֔ה הַ/קְּרֵבִ֖ים לְ/שָׁרֵ֣ת אֶת יְהוָ֑ה וְ/הָיָ֨ה לָ/הֶ֤ם מָקוֹם֙ לְ/בָ֣תִּ֔ים וּ/מִקְדָּ֖שׁ לַ/מִּקְדָּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/004.yaml
  text: It is a holy portion of the land; it shall be for the priests[a], the ministers of the sanctuary, who draw near to minister to Yahweh. And it shall be for them as a place for houses and as a holy place for the sanctuary.
translation:
  language: pt
  text: É uma porção santa da terra; será para os sacerdotes que servem no santuário e se aproximam para servir a Yahweh. Será para eles um lugar para casas e um lugar santo para o santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma área consagrada pertencente ao santuário”. A expressão hebraica é compacta e pode indicar uma área sagrada destinada ao santuário.'
    reason: alternativa lexical decorrente de uma expressão hebraica ambígua
lexical_decisions:
- source_word: קֹדֶשׁ מִן־הָאָרֶץ
  choice: uma porção santa da terra
  rationale: No contexto da distribuição territorial, קֹדֶשׁ designa uma parte da terra separada como sagrada, e מִן tem sentido partitivo. “Porção santa da terra” explicita naturalmente o referente sem reduzir a expressão a uma ideia abstrata de santidade.
- source_word: לַכֹּהֲנִים
  choice: aos sacerdotes
  rationale: Expressa de modo direto a destinação ou posse da área.
- source_word: מְשָׁרְתֵי הַמִּקְדָּשׁ
  choice: que servem no santuário
  rationale: A formulação verbal é corrente em português e comunica o serviço cultual sem sugerir categorias clericais posteriores.
- source_word: הַקְּרֵבִים לְשָׁרֵת
  choice: se aproximam para servir
  rationale: Preserva o movimento de aproximação com valor sacerdotal e a finalidade do serviço, sem tornar o sentido técnico excessivamente opaco.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מָקוֹם לְבָתִּים
  choice: espaço para as casas deles
  rationale: Comunica com clareza que a porção inclui área residencial destinada aos sacerdotes.
- source_word: וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: e um lugar santo para o santuário
  rationale: A expressão hebraica é compacta e difícil. A tradução mantém a repetição conceitual e entende o primeiro מִקְדָּשׁ como lugar consagrado, sem acrescentar “terra” à frase final.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Sentido cultual de הַקְּרֵבִים
  choice: se aproximam para servir
  alternative: chegam perto para servir; vêm ministrar
  rationale: A tradução conserva a linguagem sacerdotal de aproximação sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Preferiu-se “servem” a “ministram” para evitar possível associação exclusiva com o clero cristão. O marcador da nota foi colocado junto à expressão que ela esclarece.
