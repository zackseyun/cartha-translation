id: EZK.45.6
reference: Ezekiel 45:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲחֻזַּ֨ת הָ/עִ֜יר תִּתְּנ֗וּ חֲמֵ֤שֶׁת אֲלָפִים֙ רֹ֔חַב וְ/אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ לְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/006.yaml
  text: And as the city's property[a], you shall give an area five thousand wide and twenty-five thousand long, alongside the holy contribution[b]; it shall belong to the whole house of Israel.
translation:
  language: pt
  text: Como propriedade da cidade, vocês destinarão uma área de cinco mil de largura e vinte e cinco mil de comprimento, ao lado da porção sagrada[a]; ela pertencerá a toda a casa de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correspondente à porção sagrada” ou “paralela à porção sagrada”. A expressão hebraica pode indicar alinhamento espacial ou correspondência de dimensões.
    reason: lexical_alternative
  - marker: b
    text: “Casa de Israel” é uma expressão coletiva para o povo de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזַּת הָעִיר
  choice: propriedade da cidade
  rationale: אֲחֻזָּה designa uma posse ou propriedade de terra. A expressão mantém a ideia de uma área destinada à cidade e soa natural no contexto de distribuição territorial.
- source_word: תִּתְּנוּ
  choice: vocês destinarão
  rationale: Embora נתן signifique normalmente “dar”, aqui se trata da atribuição legal de uma área. “Destinarão” comunica essa função sem perder a força prescritiva da forma verbal.
- source_word: חֲמֵשֶׁת אֲלָפִים רֹחַב
  choice: cinco mil de largura
  rationale: Reproduz de modo conciso a dimensão hebraica. A unidade de medida não é expressa neste versículo e, por isso, não é acrescentada.
- source_word: וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: e vinte e cinco mil de comprimento
  rationale: Mantém a coordenação e o estilo de medição territorial do hebraico em português claro.
- source_word: לְעֻמַּת
  choice: ao lado de
  rationale: No contexto geográfico, a expressão indica alinhamento ou posição relativa entre as áreas. A nota preserva as possibilidades de correspondência e paralelismo sem impor uma precisão espacial maior do que o hebraico permite.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: porção sagrada
  rationale: תְּרוּמָה pode designar algo separado ou oferecido; neste contexto, refere-se à porção territorial reservada como santa. “Porção sagrada” preserva tanto a natureza territorial quanto a consagração da área.
- source_word: לְכָל בֵּית יִשְׂרָאֵל
  choice: a toda a casa de Israel
  rationale: Conserva a expressão coletiva tradicional בֵּית יִשְׂרָאֵל e representa כָל por “toda”.
- source_word: יִהְיֶה
  choice: ela pertencerá
  rationale: O verbo היה significa literalmente “ser”, mas, com לְ, expressa aqui posse ou destinação. “Pertencerá” explicita naturalmente essa relação em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção inicial foi reorganizada para soar natural, preservando a função da área como propriedade da cidade. Não se acrescentou unidade de medida, pois ela não aparece no versículo hebraico.
