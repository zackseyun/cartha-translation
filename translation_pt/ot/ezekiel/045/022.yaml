  text: וְ/עָשָׂ֤ה הַ/נָּשִׂיא֙ בַּ/יּ֣וֹם הַ/ה֔וּא בַּעֲד֕/וֹ וּ/בְעַ֖ד כָּל עַ֣ם הָ/אָ֑רֶץ פַּ֖ר חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/022.yaml
  text: On that day the prince shall provide[a], for himself and for all the people of the land, a bull as a sin offering.
translation:
  language: pt
  text: Naquele dia, o príncipe providenciará, para si e para todo o povo da terra, um touro como oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um touro como oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta que remove o pecado ou a impureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: providenciará
  rationale: Embora עשה signifique literalmente “fazer”, em contexto sacrificial pode indicar preparar ou oferecer o sacrifício. “Providenciará” expressa naturalmente a responsabilidade cúltica e administrativa do príncipe sem especificar em excesso o ato ritual.
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Em Ezequiel, נָשִׂיא designa regularmente o governante civil da visão, e “príncipe” preserva esse título específico.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Equivalente temporal direto, idiomático e digno em português moderno.
- source_word: בַּעֲדוֹ
  choice: por si mesmo
  rationale: בעד com sufixo indica que a oferta é feita em favor ou em benefício dele próprio. A formulação preserva o sentido representativo.
- source_word: וּבְעַד כָּל עַם הָאָרֶץ
  choice: e por todo o povo da terra
  rationale: Mantém o paralelismo com “por si mesmo” e traduz עַם הָאָרֶץ como referência ampla à população da terra.
- source_word: פַּר
  choice: um novilho
  rationale: פַּר designa um bovino macho usado em sacrifício. “Novilho” é uma designação sacrificial corrente em português, sem acrescentar uma idade exata.
- source_word: חַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto, חַטָּאת designa claramente o sacrifício relacionado ao tratamento do pecado ou da impureza. “Oferta pelo pecado” conserva a terminologia bíblica reconhecível, enquanto a nota registra a alternativa funcional.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto cúltico
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode designar o sacrifício que trata do pecado ou remove a impureza. Como o objeto sacrificial é um novilho, o sentido de oferta é certo; a tradução principal preserva a expressão tradicional sem excluir a dimensão purificadora, explicitada na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a ordem e o paralelismo do hebraico, usando terminologia sacrificial reconhecível sem eliminar a ambiguidade lexical de חַטָּאת.
