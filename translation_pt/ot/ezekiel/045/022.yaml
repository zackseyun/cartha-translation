  source_fidelity: 'A estrutura e os referentes estão corretos: o príncipe age naquele dia em favor de si e de todo o povo da terra, e o animal é destinado à oferta חַטָּאת. Contudo, «novilho» normalmente especifica um bovino macho jovem, enquanto פַּר não explicita idade; «touro» preserva melhor o alcance do hebraico.'
