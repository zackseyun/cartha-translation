base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/021.yaml
  text: In the first month[a], on the fourteenth day of the month, you shall have the Passover, a feast of seven days[b]; unleavened bread shall be eaten.
translation:
  language: pt
  text: No primeiro mês, no décimo quarto dia do mês, vocês celebrarão a Páscoa, uma festa de sete dias[a][b]; pão sem fermento será comido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em outros textos, a Páscoa e a Festa dos Pães sem Fermento podem ser distinguidas; aqui, porém, o hebraico apresenta a Páscoa em aposição a uma festa de sete dias.
    reason: Preservar a forma como este versículo relaciona as duas observâncias sem harmonizá-lo com outras passagens.
  - marker: b
    text: 'Ou: “por sete dias”. A expressão hebraica é literalmente “semanas de dias” e, neste contexto, indica um período de sete dias.'
    reason: Registrar a construção hebraica incomum e uma alternativa possível de relação sintática.
lexical_decisions:
- source_word: בָּרִאשׁוֹן
  choice: No primeiro mês
  rationale: Em contexto de calendário, a expressão indica o primeiro mês; “mês” é explicitado naturalmente a partir da fórmula de data que vem em seguida.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: no décimo quarto dia do mês
  rationale: É a forma portuguesa natural e precisa de reproduzir a fórmula hebraica de data.
- source_word: יִהְיֶה לָכֶם
  choice: vocês celebrarão
  rationale: A construção hebraica é literalmente “haverá/será para vocês”; neste contexto, exprime que o povo deverá observar a Páscoa. “Celebrarão” comunica essa força de maneira natural, sem acrescentar detalhes rituais.
- source_word: הַפָּסַח
  choice: a Páscoa
  rationale: Designa a observância já estabelecida; “a Páscoa” é a forma consagrada e clara em português.
- source_word: חָג
  choice: uma festa
  rationale: O termo designa uma festa religiosa, possivelmente de peregrinação, e aqui está em aposição a “Páscoa”.
- source_word: שְׁבֻעוֹת יָמִים
  choice: de sete dias
  rationale: Embora a expressão seja literalmente “semanas de dias”, neste contexto funciona como referência a um período festivo de sete dias.
- source_word: מַצּוֹת
  choice: pão sem fermento
  rationale: Refere-se ao pão preparado sem fermento no contexto pascal; esta formulação é clara para leitores modernos e evita um empréstimo lexical desnecessário.
- source_word: יֵאָכֵל
  choice: comerão
  rationale: O hebraico usa uma forma passiva, literalmente “será comido”. O plural impessoal hebraico pode ser vertido naturalmente em português como uma ordem dirigida à comunidade; a formulação mantém o tom prescritivo sem a rigidez de “será comido”.
theological_decisions:
- issue: Relação entre a Páscoa e a festa de sete dias
  choice: Apresentar a Páscoa em aposição direta a “uma festa de sete dias”, como faz o hebraico.
  alternative: Distinguir explicitamente o dia da Páscoa da Festa dos Pães sem Fermento, ou fundir toda a expressão num título único.
  rationale: O versículo reúne as observâncias em sua formulação, embora outros textos possam distingui-las. A tradução conserva essa tensão e não impõe uma harmonização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. “Vocês” torna explícito o plural comunitário do hebraico. A ordem das informações e a aposição central foram preservadas.
