base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/008.yaml
  text: This land shall belong to him as a possession in Israel. And my princes shall no longer oppress my people[a], but they shall give the land to the house of Israel according to their tribes.
translation:
  language: pt
  text: Esta terra será sua propriedade em Israel. Meus príncipes não oprimirão mais o meu povo, mas darão a terra à casa de Israel, segundo as suas tribos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָאָרֶץ
  choice: Essa terra
  rationale: A expressão topicalizada com ל retoma a porção de terra mencionada no contexto. “Essa terra” comunica naturalmente em português essa referência contextual.
- source_word: יִהְיֶה לּוֹ לַאֲחֻזָּה
  choice: será propriedade dele
  rationale: A construção “ser para ele” expressa posse, e אֲחֻזָּה designa uma propriedade ou porção territorial permanente. A formulação é clara e natural.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Mantém o sentido locativo simples da preposição.
- source_word: וְלֹא יוֹנוּ עוֹד
  choice: Assim, ... não oprimirão mais
  rationale: O hifil de ינה indica opressão ou exploração. “Não ... mais” expressa a cessação, enquanto “Assim” liga a concessão anterior à prevenção de novos abusos sem tornar a relação excessivamente explícita.
- source_word: נְשִׂיאַי
  choice: os meus príncipes
  rationale: Preserva o título político recorrente em Ezequiel e sua ligação literária com “o príncipe” no contexto imediato.
- source_word: עַמִּי
  choice: o meu povo
  rationale: É a expressão pactual direta e corrente em português.
- source_word: וְהָאָרֶץ יִתְּנוּ
  choice: mas darão a terra
  rationale: “Mas” comunica o contraste pragmático entre oprimir o povo e entregar-lhe devidamente a terra, embora a conjunção hebraica também possa ser traduzida simplesmente por “e”.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à casa de Israel
  rationale: Conserva a designação profética tradicional e a textura literária do original.
- source_word: לְשִׁבְטֵיהֶם
  choice: segundo as suas tribos
  rationale: Expressa a distribuição da terra conforme as divisões tribais sem introduzir detalhes ausentes do texto.
theological_decisions:
- issue: Referente do pronome masculino singular em יִהְיֶה לּוֹ
  choice: “dele”, referindo-se ao príncipe do contexto imediato
  alternative: Um governante genérico ou o cargo governante coletivamente
  rationale: O contexto imediato trata da porção destinada ao príncipe. Manter o pronome, sem substituir pelo substantivo, preserva a forma e a abertura referencial do texto.
- issue: Relação entre a posse do príncipe e o fim da opressão
  choice: Usar “Assim” sem explicar além do texto
  alternative: Traduzir a conjunção apenas por “e”, deixando a relação totalmente implícita
  rationale: A porção concedida ao príncipe parece servir para que os governantes não tomem a terra do povo. “Assim” torna perceptível essa relação contextual sem transformá-la numa explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Príncipes” e “casa de Israel” preservam o vocabulário político e profético do livro; “propriedade” evita um tecnicismo fundiário pouco transparente.
