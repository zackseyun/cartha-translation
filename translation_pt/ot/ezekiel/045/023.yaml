  text: וְ/שִׁבְעַ֨ת יְמֵֽי הֶ/חָ֜ג יַעֲשֶׂ֧ה עוֹלָ֣ה לַֽ/יהוָ֗ה שִׁבְעַ֣ת פָּ֠רִים וְ/שִׁבְעַ֨ת אֵילִ֤ים תְּמִימִם֙ לַ/יּ֔וֹם שִׁבְעַ֖ת הַ/יָּמִ֑ים וְ/חַטָּ֕את שְׂעִ֥יר עִזִּ֖ים לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/023.yaml
  text: During the seven days of the feast he shall provide as a burnt offering to Yahweh seven bulls and seven rams without blemish each day for the seven days[b][a], and as a sin offering one male goat each day.
translation:
  language: pt
  text: Durante os sete dias da festa[a], ele providenciará, como holocausto a Yahweh, sete touros e sete carneiros sem defeito a cada dia, ao longo dos sete dias; e, como oferta pelo pecado[b], um bode a cada dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festival”.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta de purificação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָג
  choice: a festa
  rationale: חַג designa uma festa religiosa, frequentemente de peregrinação. “Festa” é natural e adequada ao contexto cultual; “festival” permanece uma alternativa válida.
- source_word: יַעֲשֶׂה
  choice: ele providenciará
  rationale: Embora עָשָׂה signifique literalmente “fazer”, no contexto das responsabilidades sacrificiais do príncipe pode indicar que ele deve providenciar o sacrifício. A escolha evita sugerir que ele necessariamente o oferece pessoalmente.
- source_word: עוֹלָה
  choice: holocausto
  rationale: Termo consagrado em português para a oferta totalmente queimada, preservando o sentido cultual específico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica a orientação ou dedicação da oferta, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: פָּרִים
  choice: touros
  rationale: פַּר, no contexto sacrificial, refere-se a um bovino macho. “Touros” é direto e não acrescenta uma indicação de idade ausente no texto.
- source_word: אֵילִים
  choice: carneiros
  rationale: אֵילִים designa carneiros, isto é, ovinos machos, no vocabulário sacrificial.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: Expressa a integridade física exigida dos animais sacrificiais em linguagem clara e corrente.
- source_word: לַיּוֹם
  choice: a cada dia
  rationale: 'O contexto enumerativo exige sentido distributivo: os sete touros e sete carneiros são requeridos diariamente.'
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta relacionada ao pecado e à purificação. “Oferta pelo pecado” é a forma mais reconhecível, sem excluir a alternativa “oferta de purificação”.
- source_word: שְׂעִיר עִזִּים
  choice: um bode
  rationale: A expressão designa um caprino macho. O singular, dentro da enumeração diária, é naturalmente vertido como “um bode”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A expressão tradicional preserva a ligação lexical com pecado, enquanto a nota registra a dimensão purificadora reconhecida no uso sacrificial do termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário cultual amplamente reconhecível. A repetição “sete dias” foi mantida por corresponder à ênfase do hebraico. O ponto e vírgula organiza a longa enumeração sem alterar sua estrutura.
