  text: וְ/עַֽל הַ/נָּשִׂ֣יא יִהְיֶ֗ה הָ/עוֹל֣וֹת וְ/הַ/מִּנְחָה֮ וְ/הַ/נֵּסֶךְ֒ בַּ/חַגִּ֤ים וּ/בֶ/חֳדָשִׁים֙ וּ/בַ/שַּׁבָּת֔וֹת בְּ/כָֽל מוֹעֲדֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֽוּא יַעֲשֶׂ֞ה אֶת הַ/חַטָּ֣את וְ/אֶת הַ/מִּנְחָ֗ה וְ/אֶת הָֽ/עוֹלָה֙ וְ/אֶת הַ/שְּׁלָמִ֔ים לְ/כַפֵּ֖ר בְּעַ֥ד בֵּֽית יִשְׂרָאֵֽל־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/017.yaml
  text: And the burnt offerings[a], the grain offering, and the drink offering at the feasts, at the new moons, and at the Sabbaths—at all the appointed times of the house of Israel—shall be the prince’s responsibility. He shall provide the sin offering, the grain offering, the burnt offering, and the peace offerings[b], to make atonement for the house of Israel.
translation:
  language: pt
  text: A responsabilidade pelas ofertas queimadas, pela oferta de cereal e pela oferta de bebida, nas festas, nas luas novas e nos sábados — em todas as ocasiões designadas para a casa de Israel — caberá ao príncipe. Ele providenciará a oferta pelo pecado[a], a oferta de cereal, a oferta queimada e as ofertas de paz[b], para fazer expiação pela casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ofertas de comunhão” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַנָּשִׂיא יִהְיֶה
  choice: caberá ao príncipe / A responsabilidade ... caberá ao príncipe
  rationale: A construção com עַל e היה atribui ao príncipe uma obrigação ou encargo. Esta formulação comunica isso em português natural sem sugerir mera posse.
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Em Ezequiel, נָשִׂיא designa o dirigente civil. “Príncipe” preserva o uso característico do livro sem especificá-lo como rei.
- source_word: הָעוֹלוֹת / הָעוֹלָה
  choice: as ofertas queimadas / a oferta queimada
  rationale: עוֹלָה é a oferta inteiramente queimada. A tradução mantém respectivamente o plural e o singular e torna transparente a natureza da oferta; “holocausto” seria uma alternativa tradicional.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה indica uma oferta de produtos vegetais, especialmente cereal, e não uma oferta genérica.
- source_word: הַנֵּסֶךְ
  choice: a oferta derramada
  rationale: נֶסֶךְ é a oferta líquida vertida. “Oferta derramada” é compreensível em português corrente e evita o termo menos acessível “libação”.
- source_word: בַּחַגִּים וּבֶחֳדָשִׁים וּבַשַּׁבָּתוֹת
  choice: nas festas, nas luas novas e nos sábados
  rationale: A formulação preserva os três tipos recorrentes de datas sagradas do calendário de Israel.
- source_word: בְּכָל מוֹעֲדֵי בֵּית יִשְׂרָאֵל
  choice: em todas as ocasiões determinadas da casa de Israel
  rationale: מוֹעֵד possui sentido amplo de tempo ou ocasião estabelecida. “Ocasiões determinadas” evita repetir “festas” e conserva essa abrangência.
- source_word: הוּא יַעֲשֶׂה
  choice: Ele providenciará
  rationale: Nesse contexto, עשה pode indicar preparar ou fornecer as ofertas exigidas. “Providenciará” exprime a responsabilidade do príncipe sem afirmar que ele próprio exerça a função sacerdotal.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: חַטָּאת designa aqui uma oferta sacrificial. A forma convencional foi mantida, com a alternativa funcional “oferta de purificação” registrada em nota.
- source_word: הַשְּׁלָמִים
  choice: as ofertas de paz
  rationale: “Ofertas de paz” é uma tradução concisa e reconhecível de שְׁלָמִים; outras nuances legítimas são preservadas em nota.
- source_word: לְכַפֵּר בְּעַד
  choice: para fazer expiação pela
  rationale: A expressão comunica a função expiatória no contexto sacrificial sem impor uma teoria posterior específica da expiação.
theological_decisions:
- issue: Papel do príncipe no culto sacrificial
  choice: O texto atribui ao príncipe a responsabilidade de providenciar as ofertas.
  alternative: Entender que o príncipe realiza pessoalmente os ritos como sacerdote.
  rationale: A obrigação recai sobre o príncipe, mas a redação não exige que ele oficie com as próprias mãos. “Providenciará” evita atribuir-lhe explicitamente uma função sacerdotal que o hebraico não determina.
- issue: Sentido da linguagem de expiação
  choice: Manter a linguagem cultual de fazer expiação pela casa de Israel.
  alternative: Parafrasear a expressão segundo uma formulação sistemático-teológica posterior.
  rationale: “Fazer expiação” preserva o sentido sacrificial e a tensão teológica do texto sem acrescentar uma explicação doutrinária não expressa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva termos cultuais reconhecíveis, mas prefere expressões transparentes como “oferta derramada” e “ocasiões determinadas”. Os travessões organizam a enumeração sem alterar sua relação sintática.
