  source_fidelity: A tradução transmite adequadamente a responsabilidade atribuída ao príncipe, a enumeração das ofertas e o propósito de fazer expiação pela casa de Israel. Mantém corretamente a distinção entre o plural inicial de עֹלוֹת e o singular genérico posterior de עֹלָה, bem como não transforma o príncipe explicitamente em oficiante sacerdotal.
  naturalness: O texto é em geral claro e de registro adequado. Contudo, “oferta derramada” não é uma designação cultual idiomática nem suficientemente precisa em português contemporâneo; pode sugerir apenas o derramamento de qualquer oferta. “Oferta de bebida” é mais claro e corresponde ao uso bíblico corrente para נֶסֶךְ. “Ocasiões designadas para a casa de Israel” também é mais natural que “ocasiões determinadas da casa de Israel”.
  terminology: “Príncipe”, “oferta de cereal”, “oferta pelo pecado”, “oferta queimada”, “ofertas de paz” e “fazer expiação” são escolhas defensáveis e consistentes com o hebraico. As notas preservam alternativas lexicais legítimas para חַטָּאת e שְׁלָמִים.
