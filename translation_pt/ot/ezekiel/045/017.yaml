revisions:
- from: A responsabilidade pelas ofertas queimadas, pela oferta de cereal e pela oferta derramada, nas festas, nas luas novas e nos sábados — em todas as ocasiões determinadas da casa de Israel — caberá ao príncipe. Ele providenciará a oferta pelo pecado[a], a oferta de cereal, a oferta queimada e as ofertas de paz[b], para fazer expiação pela casa de Israel.
  to: A responsabilidade pelas ofertas queimadas, pela oferta de cereal e pela oferta de bebida, nas festas, nas luas novas e nos sábados — em todas as ocasiões designadas para a casa de Israel — caberá ao príncipe. Ele providenciará a oferta pelo pecado[a], a oferta de cereal, a oferta queimada e as ofertas de paz[b], para fazer expiação pela casa de Israel.
  rationale: A revisão substitui uma expressão imprecisa para a oferta líquida por “oferta de bebida” e ajusta a formulação das ocasiões cultuais para maior naturalidade. O restante é mantido, pois representa fielmente as categorias sacrificiais, a obrigação do príncipe e a linguagem cultual de expiação, sem resolver além do texto a questão de quem executa materialmente os ritos.
