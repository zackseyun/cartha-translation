  - severity: low
    issue: “Ocasiões determinadas da casa de Israel”
    rationale: A construção genitiva soa pouco natural. “Ocasiões designadas para a casa de Israel” preserva o sentido de מועדי e melhora a fluidez sem restringir o termo a festas.
