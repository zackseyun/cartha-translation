  text: מֹֽאזְנֵי צֶ֧דֶק וְ/אֵֽיפַת צֶ֛דֶק וּ/בַת צֶ֖דֶק יְהִ֥י לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/010.yaml
  text: You must have honest scales[a], an honest ephah[c][b], and an honest bath.
translation:
  language: pt
  text: Tenham balanças justas, um efa justo[a] e um bato justo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O efa era uma medida padrão para produtos secos.
    reason: cultural_note
  - marker: b
    text: O bato era uma medida padrão para líquidos.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי
  choice: balanças
  rationale: O substantivo no plural/dual designa instrumentos de pesagem; “balanças” é a forma natural e corrente em português.
- source_word: צֶדֶק
  choice: justas/justo
  rationale: O termo se repete qualificando os três instrumentos ou padrões de medida. “Justo” preserva tanto a exatidão quanto a dimensão ética e jurídica do hebraico.
- source_word: אֵיפַת
  choice: efa
  rationale: Designa uma unidade hebraica específica para secos; a transliteração preserva o dado cultural, esclarecido em nota.
- source_word: בַת
  choice: bato
  rationale: Designa uma unidade hebraica específica para líquidos; a forma portuguesa transliterada mantém o paralelismo com “efa” e é esclarecida em nota.
- source_word: יְהִי לָכֶם
  choice: Tenham
  rationale: A construção volitiva com לָכֶם expressa uma determinação dirigida à comunidade. O imperativo plural comunica essa força jurídica de modo direto e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “justo” reproduz a ênfase do hebraico e evita reduzir צֶדֶק apenas a honestidade subjetiva.
