  text: הָ/אֵיפָ֣ה וְ/הַ/בַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָ/שֵׂ֕את מַעְשַׂ֥ר הַ/חֹ֖מֶר הַ/בָּ֑ת וַ/עֲשִׂירִ֤ת הַ/חֹ֨מֶר֙ הָֽ/אֵיפָ֔ה אֶל הַ/חֹ֖מֶר יִהְיֶ֥ה מַתְכֻּנְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/011.yaml
  text: The ephah and the bath shall be of one measure[a], so that the bath may hold a tenth of a homer, and the ephah a tenth of a homer[c][b]; their standard shall be according to the homer.
translation:
  language: pt
  text: 'O efa e o bato terão a mesma capacidade[a]: o bato conterá a décima parte de um ômer, e o efa, a décima parte de um ômer[b]. A medida de ambos será determinada pelo ômer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o efa, usado para secos, e o bato, usado para líquidos, terão igual capacidade.
    reason: cultural_note
  - marker: b
    text: O ômer era uma unidade maior; tanto o efa como o bato correspondiam à décima parte dele. “Cor” é outro nome tradicional para essa unidade.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיפָה
  choice: efa
  rationale: Medida antiga para secos; a transliteração tradicional em português preserva a unidade técnica sem lhe atribuir um equivalente moderno impreciso.
- source_word: בַּת
  choice: bato
  rationale: Medida antiga para líquidos; a forma aportuguesada distingue a unidade metrológica e é inteligível no contexto.
- source_word: תֹּכֶן אֶחָד
  choice: a mesma capacidade
  rationale: No contexto metrológico, a expressão indica que as duas unidades têm igual conteúdo ou volume; esta formulação natural explicita a relação sem alterar o sentido.
- source_word: לָשֵׂאת
  choice: conterá
  rationale: O infinitivo descreve a capacidade da medida, isto é, quanto ela comporta.
- source_word: מַעְשַׂר / עֲשִׂירִת
  choice: a décima parte
  rationale: As duas formas paralelas indicam quantitativamente um décimo, não o dízimo em sentido cultual.
- source_word: חֹמֶר
  choice: ômer
  rationale: Translitera a unidade maior mencionada no hebraico e evita conversão especulativa para medidas modernas.
- source_word: מַתְכֻּנְתּוֹ אֶל הַחֹמֶר
  choice: A medida de ambos será determinada pelo ômer
  rationale: Expressa o ômer como padrão de referência para o efa e o bato. 'De ambos' torna natural em português a referência coletiva do singular hebraico contextual.
