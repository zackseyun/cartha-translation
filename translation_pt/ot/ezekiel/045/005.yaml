base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/005.yaml
  text: And an area twenty-five thousand long and ten thousand wide shall be for the Levites[a], the ministers of the house, for their possession[b], with twenty chambers.
translation:
  language: pt
  text: Uma área de vinte e cinco mil de comprimento e dez mil de largura será destinada aos levitas, que servem no templo, como propriedade deles, com vinte câmaras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O sentido da frase final é incerto no hebraico. Outra tradução possível é: “como propriedade deles, para vinte câmaras”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה וְ/עֶשְׂרִים אֶלֶף אֹרֶךְ וַ/עֲשֶׂרֶת אֲלָפִים רֹחַב
  choice: vinte e cinco mil de comprimento e dez mil de largura
  rationale: Expressa as duas dimensões em português natural, sem acrescentar uma unidade de medida ausente neste versículo.
- source_word: יהיה לַ/לְוִיִּם
  choice: será destinada aos levitas
  rationale: O imperfeito e a preposição indicam a atribuição da área aos levitas; a formulação mantém o valor prescritivo da visão.
- source_word: מְשָׁרְתֵי הַ/בַּיִת
  choice: que servem no templo
  rationale: O particípio designa os que prestam serviço cultual. Neste contexto, 'a casa' é o templo; explicitar o referente produz português claro sem introduzir um cargo eclesiástico posterior.
- source_word: לָ/הֶם לַ/אֲחֻזָּה
  choice: como propriedade deles
  rationale: אֲחֻזָּה denota uma propriedade ou posse territorial permanente.
- source_word: עֶשְׂרִים לְשָׁכֹת
  choice: com vinte câmaras
  rationale: לְשָׁכֹת são recintos ou câmaras, provavelmente ligados ao complexo do templo. A construção hebraica é difícil, e esta leitura é mantida no texto sem ocultar a incerteza.
