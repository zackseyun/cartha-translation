  text: וּ/מִן הַ/מִּדָּ֤ה הַ/זֹּאת֙ תָּמ֔וֹד אֹ֗רֶךְ חמש וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֣רֶת אֲלָפִ֑ים וּ/בֽ/וֹ יִהְיֶ֥ה הַ/מִּקְדָּ֖שׁ קֹ֥דֶשׁ קָדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/003.yaml
  text: From this measured area you shall measure a length of twenty-five thousand and a width of ten thousand[a], and in it shall be the sanctuary, the most holy place.
translation:
  language: pt
  text: Dessa área medida, você medirá vinte e cinco mil de comprimento e dez mil de largura; nela estará o santuário, o lugar santíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “o santuário, o Santo dos Santos”.'
    reason: Alternativa lexical tradicional para קֹדֶשׁ קָדָשִׁים.
lexical_decisions:
- source_word: וּמִן הַמִּדָּה הַזֹּאת
  choice: Dessa área medida
  rationale: מִדָּה pode indicar uma medida ou uma porção medida. No contexto da repartição da terra, “área medida” retoma de modo natural a faixa anteriormente delimitada, enquanto “dessa” preserva a preposição מִן.
- source_word: תָּמֹד
  choice: você medirá
  rationale: O Qal imperfeito na segunda pessoa masculina singular mantém a instrução dirigida ao interlocutor e o tom procedimental da visão.
- source_word: אֹרֶךְ חמש וְעֶשְׂרִים אֶלֶף
  choice: vinte e cinco mil de comprimento
  rationale: A formulação apresenta a primeira dimensão e verte o numeral na ordem corrente do português moderno, sem acrescentar uma unidade que não aparece neste versículo.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: e dez mil de largura
  rationale: רֹחַב indica a largura, em contraste com o comprimento, e a construção é idiomática em português.
- source_word: וּבוֹ
  choice: nela
  rationale: A preposição com sufixo pronominal retoma a área medida; o feminino concorda naturalmente com “área”.
- source_word: הַמִּקְדָּשׁ
  choice: o santuário
  rationale: מִקְדָּשׁ designa o recinto ou lugar sagrado e “santuário” é uma tradução ampla e consagrada, adequada à visão do templo em Ezequiel.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: o lugar santíssimo
  rationale: A construção intensiva expressa o grau máximo de santidade. “Lugar santíssimo” comunica claramente o sentido cultual em português atual, sem impor uma interpretação doutrinária adicional.
theological_decisions:
- issue: Tradução de קֹדֶשׁ קָדָשִׁים no contexto do santuário
  choice: o lugar santíssimo
  alternative: o Santo dos Santos
  rationale: A expressão hebraica funciona como superlativo cultual. A opção principal é transparente ao leitor moderno; a formulação tradicional é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a segunda pessoa singular por meio de “você”, evita acrescentar uma unidade de medida ausente do hebraico e conserva o vocabulário cultual sem arcaísmo desnecessário.
