  text: All the people of the land shall give this contribution to the prince in Israel[a][b].
translation:
  language: pt
  text: Todo o povo da terra dará esta contribuição ao príncipe em Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Todo o povo da terra estará para esta contribuição ao príncipe em Israel”. O modo de dizer hebraico provavelmente significa que o povo deve fornecer ao príncipe essa contribuição estipulada.'
    reason: lexical_alternative
  - marker: b
    text: “Contribuição” traduz o hebraico terumá, uma porção separada ou oferta. Conforme se enfatize o aspecto cultual ou o cívico, também se pode traduzir por “oferta” ou “tributo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעָם הָאָרֶץ
  choice: Todo o povo da terra
  rationale: Preserva a expressão hebraica e, no contexto legal e profético, designa o conjunto da população da terra, sem a interpretação adicional de “cidadãos”.
- source_word: יִהְיוּ אֶל
  choice: dará
  rationale: Literalmente, “será para/em direção a”; neste contexto de contribuição estipulada, o idioma indica que o povo deve fornecê-la. “Dará” comunica naturalmente a ação implícita.
- source_word: הַתְּרוּמָה הַזֹּאת
  choice: esta contribuição
  rationale: תְּרוּמָה é uma porção separada para uso sagrado ou oficial. “Contribuição” mantém abertos os aspectos cultual e cívico, e o demonstrativo remete ao que foi especificado nos versículos anteriores.
- source_word: לַנָּשִׂיא
  choice: ao príncipe
  rationale: נָשִׂיא é o título habitual do governante em Ezequiel, sem necessariamente significar rei; a preposição indica o destinatário ou responsável em favor de quem se provê a contribuição.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Reproduz diretamente a preposição hebraica e identifica a esfera em que o príncipe exerce sua função.
