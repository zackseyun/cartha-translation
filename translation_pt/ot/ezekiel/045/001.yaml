  text: וּ/בְ/הַפִּֽילְ/כֶ֨ם אֶת הָ/אָ֜רֶץ בְּ/נַחֲלָ֗ה תָּרִימוּ֩ תְרוּמָ֨ה לַ/יהוָ֥ה קֹדֶשׁ֮ מִן הָ/אָרֶץ֒ אֹ֗רֶךְ חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וְ/רֹ֖חַב עֲשָׂ֣רָה אָ֑לֶף קֹדֶשׁ ה֥וּא בְ/כָל גְּבוּלָ֖/הּ סָבִֽיב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/001.yaml
  text: 'And when you divide the land as an inheritance[a], you shall set apart a contribution to Yahweh, a holy portion from the land: twenty-five thousand cubits in length and ten thousand in width[b]. It shall be holy within all its surrounding boundary.'
translation:
  language: pt
  text: 'Quando repartirem a terra como herança[a], separarão para Yahweh uma porção, uma porção sagrada da terra: vinte e cinco mil côvados de comprimento e dez mil de largura[b]. Ela será santa em toda a sua extensão, dentro de seus limites ao redor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “distribuírem a terra por sorteio como herança”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “vinte e cinco mil de comprimento e dez mil de largura”; a unidade “côvados” está implícita no contexto das medidas.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהַפִּילְכֶם
  choice: Quando vocês repartirem
  rationale: O hifil de נפל, no contexto da distribuição territorial, indica fazer cair as porções, isto é, repartir ou atribuir, possivelmente por sorteio. “Repartirem” é natural e mantém o sentido distributivo; a possibilidade de sorteio é registrada em nota.
- source_word: בְּנַחֲלָה
  choice: como herança
  rationale: נַחֲלָה designa herança ou propriedade recebida por atribuição. “Como herança” preserva a linguagem da posse hereditária da terra.
- source_word: תָּרִימוּ תְרוּמָה
  choice: separarão uma porção
  rationale: A combinação רום + תְרוּמָה expressa a destinação de algo como contribuição consagrada. Como se trata de uma área de terra, “porção” comunica melhor o referente concreto do que “oferta”, sem perder a ideia de dedicação.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição indica que a porção é destinada ou consagrada a Yahweh; o nome divino é transliterado.
- source_word: קֹדֶשׁ מִן הָאָרֶץ
  choice: uma parte santa da terra
  rationale: קֹדֶשׁ funciona substantivamente e se refere a uma área consagrada. “Parte santa da terra” é clara e evita definir de modo excessivamente técnico a natureza do território.
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ
  choice: vinte e cinco mil côvados de comprimento
  rationale: O hebraico não explicita a unidade, mas o contexto de medidas da visão pressupõe côvados. A unidade é acrescentada no texto para clareza e identificada como implícita em nota.
- source_word: וְרֹחַב עֲשָׂרָה אָלֶף
  choice: e dez mil de largura
  rationale: Reprodução idiomática da segunda dimensão, com a unidade já indicada na expressão anterior.
- source_word: קֹדֶשׁ הוּא בְכָל גְּבוּלָהּ סָבִיב
  choice: Toda a área dentro dos limites ao redor será santa
  rationale: A formulação expressa que a santidade se aplica à extensão inteira delimitada pelo perímetro. O futuro se harmoniza com o caráter instrutivo da passagem.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação editorial fornecida.
- issue: Modo de distribuição da terra em וּבְהַפִּילְכֶם
  choice: repartirem
  alternative: distribuírem por sorteio
  rationale: O verbo pode evocar a atribuição por sorteio, mas também funciona de maneira mais geral para a repartição da terra. O texto principal conserva a formulação mais ampla, e a leitura específica é mantida em nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto no Brasil quanto em outros contextos lusófonos. Emprega “vocês” para o plural de segunda pessoa e evita terminologia cultual excessivamente técnica. Os marcadores [a] e [b] aparecem no texto nas passagens correspondentes.
