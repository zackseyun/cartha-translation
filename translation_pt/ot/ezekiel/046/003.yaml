  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִשְׁתַּחֲו֣וּ עַם הָ/אָ֗רֶץ פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא בַּ/שַּׁבָּת֖וֹת וּ/בֶ/חֳדָשִׁ֑ים לִ/פְנֵ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/003.yaml
  text: And the people of the land shall bow down at the entrance of that gate[a], before Yahweh[b], on the Sabbaths and on the new moons.
translation:
  language: pt
  text: O povo da terra[a] se prostrará à entrada daquele portão, diante de Yahweh[b], aos sábados e nas luas novas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “o povo da terra” provavelmente se refere à população leiga, em contraste com o príncipe e os sacerdotes.
    reason: cultural_note
  - marker: b
    text: O hebraico traz o nome divino יהוה (YHWH), aqui representado como “Yahweh”; tradicionalmente, muitas traduções usam “SENHOR”.
    reason: translation_note
lexical_decisions:
- source_word: וְהִשְׁתַּחֲווּ
  choice: se prostrará
  rationale: O verbo שׁחה nesta forma expressa o ato corporal de inclinar-se ou prostrar-se em reverência. “Se prostrará” conserva tanto a ação concreta quanto seu sentido de adoração no contexto.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: A tradução literal preserva a expressão social do texto, que neste contexto provavelmente designa a população leiga em contraste com o príncipe e os sacerdotes.
- source_word: פֶּתַח הַשַּׁעַר הַהוּא
  choice: à entrada daquele portão
  rationale: “Entrada” comunica naturalmente o sentido espacial de פֶּתַח, e “daquele” preserva a força demonstrativa de הַהוּא, retomando o portão mencionado no contexto.
- source_word: בַּשַּׁבָּתוֹת
  choice: aos sábados
  rationale: A forma plural indica ocorrências recorrentes do sábado; “aos sábados” é a formulação portuguesa natural e mantém esse valor.
- source_word: וּבֶחֳדָשִׁים
  choice: e nas luas novas
  rationale: Neste contexto cultual, חֹדֶשׁ se refere às celebrações da lua nova, não simplesmente aos meses.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica presença diante de Deus no ato de adoração, e “Yahweh” representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título, sem esconder que outras tradições portuguesas usam “SENHOR” ou “Jeová”.
- issue: Sentido de עַם הָאָרֶץ
  choice: manter “o povo da terra” no texto e explicar sua provável referência em nota
  alternative: o povo comum; a população leiga
  rationale: A expressão pode funcionar como designação social. Mantê-la literalmente evita transformar uma inferência contextual em definição absoluta, enquanto a nota esclarece o contraste provável.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada com naturalidade, sem perder as relações sintáticas do hebraico; “portão” distingue com clareza a grande entrada do complexo, e “luas novas” conserva a terminologia cultual.
