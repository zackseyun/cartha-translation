base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/020.yaml
  text: Then he said to me[a], “This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the grain offering, so as not to bring them out into the outer court to make the people holy.”
translation:
  language: pt
  text: 'Então ele me disse: “Este é o lugar onde os sacerdotes cozerão a oferta pela culpa e a oferta pelo pecado e onde assarão a oferta de cereal, a fim de não as levarem ao pátio externo e assim santificarem o povo[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consagrarem o povo”. O verbo hebraico significa tornar santo; neste contexto do templo, provavelmente se refere à santidade transmitida pelo contato com as ofertas sagradas.
    reason: Alternativa lexical e esclarecimento do sentido cultual de קדש.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: זֶה הַמָּקוֹם
  choice: Este é o lugar
  rationale: Reproduz de modo direto a identificação dêitica do local.
- source_word: אֲשֶׁר יְבַשְּׁלוּ שָׁם הַכֹּהֲנִים
  choice: onde os sacerdotes cozerão
  rationale: No contexto sacrificial, בשל indica cozinhar, especialmente por fervura. “Cozerão” conserva essa precisão sem acrescentar um método não explicitado de forma absoluta.
- source_word: הָאָשָׁם
  choice: a oferta pela culpa
  rationale: Designa a categoria sacrificial associada à culpa e à reparação; esta formulação é clara e corrente em português.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: Mantém a designação cultual tradicional, sem excluir a dimensão purificadora que o termo pode ter em outros contextos.
- source_word: אֲשֶׁר יֹאפוּ אֶת הַמִּנְחָה
  choice: e onde assarão a oferta de cereal
  rationale: O segundo אֲשֶׁר retoma o lugar descrito; no contexto sacerdotal, מִנְחָה é uma oferta preparada com cereal.
- source_word: לְבִלְתִּי הוֹצִיא
  choice: a fim de não as levarem
  rationale: A construção expressa finalidade preventiva. O pronome “as”, exigido pelo português, retoma as ofertas mencionadas.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: ao pátio externo
  rationale: É uma formulação arquitetônica natural para a área exterior do complexo do templo.
- source_word: לְקַדֵּשׁ אֶת הָעָם
  choice: e assim santificarem o povo
  rationale: O Hifil de קדש significa tornar santo ou consagrar. “Assim” explicita a relação resultante com a retirada das ofertas para o pátio externo, sem desenvolver além do texto o mecanismo dessa santificação.
theological_decisions:
- issue: Sentido da transmissão de santidade em לְקַדֵּשׁ אֶת הָעָם
  choice: A cláusula indica que levar as ofertas sagradas ao pátio externo poderia resultar na santificação do povo.
  alternative: Entender a cláusula apenas como prevenção de contato não autorizado com coisas santas, sem realçar a transmissão de santidade.
  rationale: No contexto sacerdotal e do templo, קדש pode descrever a atribuição de santidade por contato com objetos ou alimentos sagrados. A tradução conserva essa lógica cultual, enquanto a nota registra uma alternativa lexical sem impor uma explicação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Foram mantidos termos cultuais claros e consistentes; “cozerão” preserva a nuance sacrificial do verbo sem recorrer a linguagem excessivamente técnica.
