  text: וַ/יְבִיאֵ֣/נִי בַ/מָּבוֹא֮ אֲשֶׁ֣ר עַל כֶּ֣תֶף הַ/שַּׁעַר֒ אֶל הַ/לִּשְׁכ֤וֹת הַ/קֹּ֨דֶשׁ֙ אֶל הַ/כֹּ֣הֲנִ֔ים הַ/פֹּנ֖וֹת צָפ֑וֹנָ/ה וְ/הִנֵּה שָׁ֣ם מָק֔וֹם ב/ירכת/ם יָֽמָּ/ה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/019.yaml
  text: Then he brought me through the entrance that was beside the gate to the holy chambers for the priests[a], which faced north; and behold, there was a place there at their far western end.
translation:
  language: pt
  text: Então ele me levou pela entrada que ficava ao lado do portão até as câmaras sagradas destinadas aos sacerdotes, voltadas para o norte; e eis que havia ali um lugar na extremidade oeste delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “na extremidade delas, para o oeste”.'
    reason: A construção בְּיַרְכְתָם יָמָּה combina a extremidade remota das câmaras com uma indicação direcional; a tradução corrente “na extremidade oeste delas” expressa a localização resultante.
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Então ele me levou
  rationale: O wayyiqtol de בוא, com sentido causativo e sufixo de primeira pessoa, descreve o movimento seguinte da narrativa; “levou” preserva o sentido causativo, e “então” marca a sequência.
- source_word: בַמָּבוֹא
  choice: pela entrada
  rationale: מָבוֹא designa uma entrada ou acesso. A preposição ב permite entender o percurso pelo acesso, expresso naturalmente em português por “pela entrada”.
- source_word: אֲשֶׁר עַל כֶּתֶף הַשַּׁעַר
  choice: que ficava ao lado do portão
  rationale: כֶּתֶף significa literalmente “ombro” e, em linguagem arquitetônica, indica a lateral ou o flanco; “ao lado” comunica com clareza essa relação espacial.
- source_word: אֶל הַלִּשְׁכוֹת הַקֹּדֶשׁ
  choice: até as câmaras sagradas
  rationale: לִשְׁכָּה é uma câmara ou sala em contexto do templo; קֹדֶשׁ as caracteriza como separadas para uso sagrado. “Até” expressa o destino do movimento.
- source_word: אֶל הַכֹּהֲנִים
  choice: destinadas aos sacerdotes
  rationale: O segundo אֶל relaciona as câmaras aos sacerdotes. “Destinadas aos” torna clara sua função sem sugerir que o movimento termina diretamente nas pessoas.
- source_word: הַפֹּנוֹת צָפוֹנָה
  choice: voltadas para o norte
  rationale: O particípio de פנה, seguido da forma direcional צָפוֹנָה, descreve a orientação das câmaras para o norte.
- source_word: וְהִנֵּה שָׁם מָקוֹם
  choice: e eis que havia ali um lugar
  rationale: “E eis que” preserva a função visual e enfática de הִנֵּה no relato da visão; מָקוֹם é mantido no sentido amplo de “lugar”.
- source_word: בְּיַרְכְתָם
  choice: na extremidade ... delas
  rationale: יַרְכָּה pode indicar a parte mais remota, o fundo ou a extremidade. O sufixo masculino plural é representado explicitamente por “delas”, retomando as câmaras.
- source_word: יָמָּה
  choice: oeste
  rationale: A forma direcional derivada de יָם, literalmente associada ao mar, é o modo hebraico usual de indicar a direção oeste.
theological_decisions: []
