  yaml_path: translation/ot/ezekiel/046/024.yaml
  text: Then he said to me[b][a], “These are the kitchens where the ministers of the temple shall boil the people's sacrifice.”
translation:
  language: pt
  text: 'Então ele me disse: “Estas são as cozinhas[a] onde os que servem no templo[b] cozinharão o sacrifício do povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as salas de cozinha”; mais literalmente, “a casa dos que cozinham”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os servidores do templo” ou “os assistentes do templo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: O waw consecutivo dá continuidade à sequência narrativa; “Então” expressa isso naturalmente em português.
- source_word: בֵּית הַמְבַשְּׁלִים
  choice: as cozinhas
  rationale: A expressão significa literalmente “casa dos que cozinham”. No contexto arquitetônico do templo, “cozinhas” comunica de modo claro e natural a função desses espaços.
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: os que servem no templo
  rationale: מְשָׁרְתֵי designa pessoas encarregadas do serviço, aqui em contexto cultual; הַבַּיִת refere-se ao templo. A formulação evita sugerir uma categoria ministerial moderna específica.
- source_word: יְבַשְּׁלוּ
  choice: cozinharão
  rationale: O verbo בשׁל pode indicar cozinhar ou ferver. “Cozinharão” é natural em português e mantém aberta a maneira exata de preparo.
- source_word: זֶבַח הָעָם
  choice: os sacrifícios do povo
  rationale: זֶבַח indica sacrifício, especialmente uma oferta animal abatida. O plural contextual em português é natural para os sacrifícios trazidos pelo povo, embora o hebraico tenha forma singular coletiva.
- source_word: שָׁם
  choice: onde
  rationale: Embora signifique literalmente “ali”, após a identificação de um lugar o relativo locativo “onde” produz uma construção natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Os que servem no templo” preserva o caráter funcional e cultual da expressão sem importar terminologia eclesiástica denominacional; “cozinharão” preserva a amplitude semântica do verbo hebraico.
