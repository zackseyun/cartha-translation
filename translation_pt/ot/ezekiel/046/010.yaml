  text: וְֽ/הַ/נָּשִׂ֑יא בְּ/תוֹכָ֤/ם בְּ/בוֹאָ/ם֙ יָב֔וֹא וּ/בְ/צֵאתָ֖/ם יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/010.yaml
  text: And the prince shall be among them[a]; when they enter, he shall enter, and when they go out[b], he shall go out.
translation:
  language: pt
  text: O príncipe estará no meio deles; quando eles entrarem, ele entrará, e, quando saírem, sairão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz o verbo no plural: “sairão”. Muitas traduções vertem “ele sairá”, entendendo que o príncipe sairá com o povo.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Em Ezequiel 40–48, נָשִׂיא funciona como título do governante civil ligado ao culto no templo. “Príncipe” preserva esse uso contextual sem definir além do texto sua identidade ou natureza.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Reproduz de modo natural a ideia de estar entre eles, acompanhando o povo, sem sugerir isolamento ou posição exterior ao grupo.
- source_word: בְּבוֹאָם יָבוֹא
  choice: quando eles entrarem, ele entrará
  rationale: A construção com infinitivo expressa circunstância temporal, e o verbo finito singular tem como sujeito o príncipe. O futuro em português comunica adequadamente a norma do contexto.
- source_word: וּבְצֵאתָם יֵצֵאוּ
  choice: e, quando saírem, sairão
  rationale: Mantém o verbo final no plural conforme o texto massorético, embora a formulação seja incomum em português. A nota registra a dificuldade sem substituir silenciosamente o plural por um singular interpretativo.
theological_decisions:
- issue: Identidade e posição do príncipe na visão do templo
  choice: Manter o título “príncipe” sem identificá-lo explicitamente como figura messiânica ou atribuir-lhe uma condição teológica específica.
  alternative: Traduzir como “líder” ou “governante”, ou explicitar uma identificação messiânica.
  rationale: O versículo regula o movimento do príncipe junto ao povo, mas não define aqui sua identidade final; a tradução preserva essa tensão.
- issue: Número do verbo final יֵצֵאוּ
  choice: 'Preservar o plural: “sairão”.'
  alternative: 'Adotar o singular interpretativo: “ele sairá”.'
  rationale: O WLC vocaliza a forma como terceira pessoa masculina do plural. Embora diversas traduções entendam que o sentido seja a saída do príncipe com o povo, alterar o número resolveria uma dificuldade textual que deve permanecer visível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “No meio deles” é natural e próximo do hebraico. A repetição “quando saírem, sairão” é mantida deliberadamente para conservar o plural do texto massorético, com nota explicativa.
