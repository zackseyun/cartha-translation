  source_fidelity: 'O texto português preserva com precisão a sintaxe e os números do hebraico massorético: o príncipe está no meio deles; na entrada deles, ele entra; e, na saída deles, o verbo final permanece no plural (“sairão”). Não resolve indevidamente a tensão sintática por meio de um singular interpretativo.'
  naturalness: “O príncipe estará no meio deles” é natural, claro e adequado ao registro visionário-regulamentar de Ezequiel. A sequência “quando saírem, sairão” é deliberadamente repetitiva em português, mas essa repetição reproduz de forma transparente a construção temporal e o plural do hebraico; a nota explica a dificuldade de modo suficiente.
  terminology: “Príncipe” é a opção terminológica apropriada para הַנָּשִׂיא neste contexto e evita identificar o personagem além do que o versículo afirma. “No meio deles” comunica bem בְּתוֹכָם. A nota ancora corretamente a questão do plural final, sem impor a leitura interpretativa “ele sairá”.
