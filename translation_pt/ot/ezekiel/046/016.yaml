base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/016.yaml
  text: 'Thus says the Lord GOD: If the prince gives a gift to any one of his sons[a], it is his inheritance[b]; it shall belong to his sons as their property by inheritance.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Se o príncipe der um presente a um de seus filhos[a], esse presente será a herança desse filho; pertencerá aos filhos dele como propriedade hereditária.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “a um homem dentre seus filhos”; isto é, a um de seus filhos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “será a posse deles por herança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética tradicional em português atual e digno.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém juntos o título אֲדֹנָי e o nome divino יהוה, vertido como Yahweh, sem produzir a repetição ambígua 'Senhor SENHOR'.
- source_word: כִּי
  choice: Se
  rationale: Introduz aqui um caso condicional na legislação sobre as concessões do príncipe.
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: É o título técnico tradicional do dirigente civil no contexto da visão de Ezequiel.
- source_word: מַתָּנָה
  choice: um presente
  rationale: Expressa de forma clara algo concedido pelo príncipe; 'presente' evita sugerir necessariamente uma doação informal.
- source_word: לְאִישׁ מִבָּנָיו
  choice: a um de seus filhos
  rationale: Traduz naturalmente o hebraísmo literal 'a um homem dentre seus filhos', indicando um indivíduo do grupo.
- source_word: נַחֲלָתוֹ הִיא
  choice: esse presente será a herança dele
  rationale: Explicita o referente do pronome feminino hebraico e entende a construção nominal segundo seu valor normativo no caso legal.
- source_word: לְבָנָיו תִּהְיֶה
  choice: pertencerá aos filhos dele
  rationale: Comunica a continuidade da concessão na descendência do filho que a recebeu, sem deixar o referente do possessivo obscuro.
- source_word: אֲחֻזָּתָם ... בְּנַחֲלָה
  choice: como propriedade hereditária
  rationale: Reúne em português idiomático a ideia de posse fundiária permanente recebida por herança.
theological_decisions:
- issue: Tradução do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR / o Senhor DEUS
  rationale: Conserva o título e representa diretamente o nome da aliança, evitando ocultá-lo sob um título substitutivo.
- issue: Referente dos sufixos masculinos em נַחֲלָתוֹ e לְבָנָיו
  choice: 'o filho beneficiário: ''a herança dele'' e ''aos filhos dele'''
  alternative: 'o príncipe: ''sua herança'' e ''seus filhos'''
  rationale: A sequência e a regra sucessória favorecem o filho que recebeu o presente como referente imediato, embora os pronomes portugueses sem explicitação pudessem ser ambíguos.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de 'dele' é intencional para esclarecer que a herança passa aos descendentes do filho beneficiário. Todos os marcadores de nota aparecem no texto.
