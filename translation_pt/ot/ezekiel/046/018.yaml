base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
translation:
  language: pt
  text: O príncipe não tomará da herança do povo para oprimi-los, desalojando-os de suas propriedades.[a] Dará aos seus filhos uma herança tirada de sua própria propriedade, para que o meu povo não seja disperso, cada homem de sua propriedade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lesando-os” ou “defraudando-os”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “meu povo, cada homem de sua propriedade”; “cada homem” tem sentido distributivo, isto é, cada indivíduo do povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Em Ezequiel, נָשִׂיא é o título característico do governante civil e não o chama de rei; “príncipe” preserva essa distinção contextual.
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  choice: não tomará nada da herança do povo
  rationale: A construção com מִן proíbe que o príncipe retire parte do patrimônio hereditário pertencente ao povo; “nada” expressa naturalmente o alcance da negação em português.
- source_word: לְהוֹנֹתָם מֵאֲחֻזָּתָם
  choice: oprimindo-os e privando-os de sua propriedade
  rationale: O hifil de ינה indica opressão ou exploração. No contexto fundiário, isso resulta em privação da propriedade; a formulação preserva a ideia de opressão sem reduzi-la apenas a fraude.
- source_word: מֵאֲחֻזָּתוֹ יַנְחִל אֶת־בָּנָיו
  choice: Dará aos seus filhos uma herança tirada de sua própria propriedade
  rationale: O hifil de נחל significa fazer herdar ou dar por herança, e o texto contrasta explicitamente a propriedade do príncipe com a do povo.
- source_word: לְמַעַן אֲשֶׁר לֹא יָפֻצוּ
  choice: para que ... seja disperso
  rationale: פּוץ denota espalhar ou dispersar. A voz passiva mantém a imagem hebraica e, no contexto, sugere deslocamento das terras sem especificar além do texto o mecanismo empregado.
- source_word: עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  choice: ninguém do meu povo ... para longe de sua propriedade
  rationale: אִישׁ tem força distributiva, referindo-se a cada integrante do povo. “Ninguém do meu povo” comunica essa distribuição com naturalidade e inclui a negação já regida pelo verbo.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ
  choice: ninguém do meu povo
  alternative: cada homem do meu povo
  rationale: Aqui אִישׁ funciona distributivamente, não como afirmação teológica acerca do sexo dos proprietários. A formulação escolhida reproduz em português natural a referência a cada indivíduo, sem alterar o alcance da proibição.
- issue: Natureza da ação expressa por לְהוֹנֹתָם
  choice: oprimindo-os e privando-os de sua propriedade
  alternative: defraudando-os em sua propriedade
  rationale: O verbo admite ideias de oprimir, explorar ou lesar. O contexto de posse da terra favorece opressão com privação patrimonial, mas a nota preserva alternativas lexicais legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se “príncipe”, “herança” e “propriedade” para preservar o quadro jurídico e fundiário. As duas notas estão marcadas no texto principal.
