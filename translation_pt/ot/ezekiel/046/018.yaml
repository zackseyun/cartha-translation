revisions:
- from: O príncipe não tomará nada da herança do povo, oprimindo-os e privando-os de sua propriedade.[a] Dará aos seus filhos uma herança tirada de sua própria propriedade, para que ninguém do meu povo seja disperso para longe de sua propriedade.[b]
  to: O príncipe não tomará da herança do povo para oprimi-los, desalojando-os de suas propriedades.[a] Dará aos seus filhos uma herança tirada de sua própria propriedade, para que o meu povo não seja disperso, cada homem de sua propriedade.[b]
  rationale: A revisão elimina a adição «para longe», torna explícita em português a relação entre opressão e desalojamento que o contexto fundiário do hebraico requer e restaura «cada homem» para refletir a formulação distributiva do original. As âncoras das notas permanecem vinculadas às respectivas questões lexicais.
