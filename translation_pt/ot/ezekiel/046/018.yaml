  source_fidelity: A tradução preserva corretamente o título «príncipe», a proibição de tomar da herança do povo e o contraste entre as propriedades do povo e a propriedade do príncipe. Contudo, «oprimindo-os e privando-os» desdobra em duas ações coordenadas o que o hebraico apresenta como opressão mediante a retirada das posses; «para longe» não é expresso pelo texto. A troca de «ninguém» por «cada homem» preserva a construção distributiva masculina do hebraico.
  naturalness: A redação revista mantém português moderno e claro. «Desalojando-os de suas propriedades» comunica naturalmente a dimensão fundiária da opressão, e «cada homem de sua propriedade» conserva a concisão um tanto elíptica do final hebraico sem acrescentar distância.
  terminology: «Príncipe», «herança» e «propriedade» são escolhas consistentes e adequadas. «Desalojar» é apropriado ao contexto de posse da terra. A nota b deve corresponder ao texto revisto e explicar o valor distributivo de «cada homem».
  issues:
  - severity: medium
    issue: A expressão «oprimindo-os e privando-os de sua propriedade» transforma a relação verbal do hebraico em duas ações coordenadas e perde a ligação mais direta entre a opressão e o desalojamento fundiário.
    rationale: לְהוֹנוֹתָם מֵאֲחֻזָּתָם descreve a opressão em conexão com a retirada deles de suas posses. «Para oprimi-los, desalojando-os...» preserva essa relação sem limitar o verbo a fraude.
  - severity: medium
    issue: «Para longe de sua propriedade» acrescenta a noção de distância.
    rationale: O hebraico diz literalmente que cada homem é disperso «de sua propriedade»; não inclui um equivalente explícito de «para longe».
  - severity: low
    issue: «Ninguém do meu povo» neutraliza a expressão distributiva masculina אִישׁ, enquanto a nota afirma «cada homem».
    rationale: «Cada homem» reproduz de modo mais próximo a forma e o efeito distributivo do texto-fonte e alinha o texto principal à nota.
