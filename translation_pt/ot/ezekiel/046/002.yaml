base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/002.yaml
  text: And the prince shall enter by way of the porch of the gate from outside[a], and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings, and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
translation:
  language: pt
  text: O príncipe entrará pelo pórtico da porta, vindo de fora, e ficará junto ao batente da porta. Os sacerdotes oferecerão o holocausto e as ofertas de paz[a] dele. Ele se prostrará em adoração no limiar da porta e depois sairá; mas a porta não será fechada até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de comunhão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Preserva o título de uma autoridade reconhecida na visão de Ezequiel sem defini-la como rei nem resolver sua identidade em sentido messiânico.
- source_word: דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ
  choice: pelo pórtico da porta, vindo de fora
  rationale: Expressa com naturalidade a rota de entrada e mantém explícita a origem externa indicada por מִחוּץ.
- source_word: מְזוּזַת הַשַּׁעַר
  choice: o batente da porta
  rationale: Batente é um termo arquitetônico corrente para a ombreira ou peça lateral da entrada e preserva a especificidade de מְזוּזָה.
- source_word: וְעָשׂוּ הַכֹּהֲנִים אֶת עֹלָתוֹ
  choice: os sacerdotes oferecerão o holocausto dele
  rationale: No contexto sacrificial, עָשָׂה tem o sentido idiomático de realizar ou oferecer; holocausto é a designação portuguesa estabelecida para עֹלָה.
- source_word: שְׁלָמָיו
  choice: as ofertas de paz dele
  rationale: Mantém a ligação lexical tradicional de שְׁלָמִים com paz e inteireza; a alternativa funcional 'ofertas de comunhão' é registrada em nota.
- source_word: וְהִשְׁתַּחֲוָה
  choice: ele se prostrará em adoração
  rationale: Conserva tanto a ação corporal de curvar-se ou prostrar-se quanto seu sentido cultual.
- source_word: מִפְתַּן הַשַּׁעַר
  choice: junto à soleira da porta
  rationale: Soleira traduz diretamente o elemento arquitetônico מִפְתָּן; a preposição portuguesa 'junto a' comunica a posição no limiar sem sugerir necessariamente que ele esteja em cima da soleira.
- source_word: לֹא יִסָּגֵר עַד הָעָרֶב
  choice: a porta não será fechada até a tarde
  rationale: Reproduz o passivo de סגר e o limite temporal expresso por עַד הָעָרֶב de maneira clara e natural.
theological_decisions:
- issue: Identidade e posição do príncipe na visão do templo de Ezequiel
  choice: Traduzir נָשִׂיא por 'príncipe', sem identificação adicional.
  alternative: líder; governante; príncipe messiânico
  rationale: O versículo descreve uma figura com privilégios e limites cultuais, mas não a identifica expressamente como o Messias nem como rei. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das frases foi levemente ajustada para fluidez, sem omitir a sequência espacial e ritual do hebraico. O marcador da nota foi colocado junto ao termo a que a alternativa lexical realmente se refere.
