  text: וְ/כֶ֨בֶשׂ בֶּן שְׁנָת֜/וֹ תָּמִ֗ים תַּעֲשֶׂ֥ה עוֹלָ֛ה לַ/יּ֖וֹם לַֽ/יהֹוָ֑ה בַּ/בֹּ֥קֶר בַּ/בֹּ֖קֶר תַּעֲשֶׂ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
translation:
  language: pt
  text: Diariamente, você oferecerá a Yahweh, em holocausto, um cordeiro de um ano, sem defeito; manhã após manhã, você o oferecerá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶבֶשׂ
  choice: cordeiro
  rationale: Designa um cordeiro; no contexto sacrificial, o substantivo hebraico é masculino, e o português “cordeiro” comunica isso naturalmente.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: O idioma hebraico, literalmente “filho do seu ano”, indica um animal de um ano de idade; “de um ano” é claro e idiomático.
- source_word: תָּמִים
  choice: sem defeito
  rationale: No contexto sacrificial, refere-se à ausência de defeito físico; a formulação é clara e atual.
- source_word: תַּעֲשֶׂה
  choice: você oferecerá
  rationale: Embora o verbo básico signifique “fazer”, em contexto ritual expressa a preparação ou apresentação da oferta; “oferecerá” transmite a ação pretendida.
- source_word: עוֹלָה
  choice: holocausto
  rationale: Termo português tradicional e conciso para a oferta inteiramente queimada, reconhecível no contexto bíblico sacrificial.
- source_word: לַיּוֹם
  choice: diariamente
  rationale: A expressão funciona adverbialmente e indica a regularidade diária da oferta.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino expresso no texto hebraico e a direção da oferta.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: Reproduz de modo natural a repetição distributiva hebraica e enfatiza a recorrência regular.
- source_word: אֹתוֹ
  choice: o
  rationale: O pronome retoma o cordeiro, masculino em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com construção direta. A repetição hebraica foi preservada idiomaticamente em “manhã após manhã”. Não se acrescentou nota, pois a tradução comunica no corpo do versículo tanto a frequência diária quanto a ênfase distributiva.
