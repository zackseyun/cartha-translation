  text: וְ/כֶ֨בֶשׂ בֶּן שְׁנָת֜/וֹ תָּמִ֗ים תַּעֲשֶׂ֥ה עוֹלָ֛ה לַ/יּ֖וֹם לַֽ/יהֹוָ֑ה בַּ/בֹּ֥קֶר בַּ/בֹּ֖קֶר תַּעֲשֶׂ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
translation:
  language: pt
  text: Você oferecerá diariamente a Yahweh um cordeiro de um ano, sem defeito, como holocausto; manhã após manhã, você o oferecerá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶבֶשׂ
  choice: cordeiro
  rationale: Designa um cordeiro; no contexto sacrificial, o substantivo hebraico é masculino, e o português «cordeiro» preserva naturalmente essa indicação.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: O idiomatismo hebraico, literalmente «filho do seu ano», indica um animal de um ano de idade.
- source_word: תָּמִים
  choice: sem defeito
  rationale: No vocabulário sacrificial, refere-se a um animal livre de defeito físico; a expressão é clara e corrente.
- source_word: תַּעֲשֶׂה
  choice: você oferecerá
  rationale: Embora o verbo signifique basicamente «fazer», neste contexto ritual denota preparar ou apresentar a oferta.
- source_word: עוֹלָה
  choice: holocausto
  rationale: É o termo tradicional e conciso em português para a oferta inteiramente queimada, sem acrescentar explicação ao texto.
- source_word: לַיּוֹם
  choice: diariamente
  rationale: A expressão funciona adverbialmente e indica a regularidade diária do sacrifício.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama e a direção da oferta.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: Reproduz de modo natural a repetição distributiva hebraica e ressalta a recorrência em cada manhã.
- source_word: אֹתוֹ
  choice: o
  rationale: O pronome retoma o cordeiro, masculino em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» representa o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe direta. «Você oferecerá» mantém a segunda pessoa singular não marcada por gênero e tem boa legibilidade brasileira. A repetição hebraica é preservada idiomaticamente em «manhã após manhã».
