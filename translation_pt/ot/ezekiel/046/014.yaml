source:
  edition: WLC
  text: וּ/מִנְחָה֩ תַעֲשֶׂ֨ה עָלָ֜י/ו בַּ/בֹּ֤קֶר בַּ/בֹּ֨קֶר֙ שִׁשִּׁ֣ית הָֽ/אֵיפָ֔ה וְ/שֶׁ֛מֶן שְׁלִישִׁ֥ית הַ/הִ֖ין לָ/רֹ֣ס אֶת הַ/סֹּ֑לֶת מִנְחָה֙ לַֽ/יהוָ֔ה חֻקּ֥וֹת עוֹלָ֖ם תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/014.yaml
  text: And you shall prepare with it[a], morning by morning, a grain offering of a sixth of an ephah, and a third of a hin of oil to moisten the fine flour—a grain offering to Yahweh[c][b], a perpetual statute continually.
translation:
  language: pt
  text: 'E, junto com ele[a], você preparará, manhã após manhã, uma oferta de cereal: um sexto de efa e um terço de him de azeite para umedecer[b] a farinha fina — uma oferta de cereal para Yahweh. Será uma prescrição perpétua, a ser cumprida continuamente.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para ele” ou “sobre ele”. O hebraico provavelmente indica que a oferta de cereal devia ser preparada além do cordeiro oferecido diariamente, mencionado no versículo anterior.
    reason: alternative_reading
  - marker: b
    text: Ou “misturar”. O verbo hebraico é raro e indica umedecer a farinha com azeite.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “prescrições de perpetuidade, continuamente”, expressão que ressalta uma exigência duradoura e regular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָה
  choice: uma oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה designa a oferta feita de farinha ou cereal, e não uma oferta genérica.
- source_word: תַעֲשֶׂה
  choice: você preparará
  rationale: A forma verbal é a segunda pessoa masculina singular; em instruções sacrificiais, “preparar” expressa naturalmente o sentido contextual de עשה.
- source_word: עָלָיו
  choice: junto com ele
  rationale: O sufixo provavelmente retoma o cordeiro ou holocausto diário do versículo anterior. “Junto com ele” comunica acompanhamento sem impor o sentido espacial literal de “sobre ele”.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: A repetição hebraica tem sentido distributivo e ressalta a regularidade diária.
- source_word: שִׁשִּׁית הָאֵיפָה
  choice: um sexto de efa
  rationale: Mantém com precisão a medida antiga mencionada no texto.
- source_word: וְשֶׁמֶן שְׁלִישִׁית הַהִין
  choice: um terço de him de azeite
  rationale: Preserva a quantidade e a antiga unidade de medida, usando “azeite” por se tratar de óleo no contexto alimentar e sacrificial.
- source_word: לָרֹס
  choice: para umedecer
  rationale: O verbo raro indica molhar ou umedecer; essa opção evita afirmar além do texto que a farinha era completamente misturada ao azeite.
- source_word: אֶת־הַסֹּלֶת
  choice: a farinha fina
  rationale: סֹלֶת é farinha fina ou refinada própria para ofertas.
- source_word: מִנְחָה לַיהוָה
  choice: uma oferta de cereal para Yahweh
  rationale: Mantém a repetição enfática e cultual de מִנְחָה e representa diretamente o nome divino יהוה.
- source_word: חֻקּוֹת עוֹלָם תָּמִיד
  choice: por determinação perpétua, continuamente
  rationale: A formulação conserva a ênfase cumulativa do hebraico na duração e na regularidade, embora a expressão resulte deliberadamente enfática em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama. “Yahweh” representa o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção de boa legibilidade brasileira. As unidades antigas “efa” e “him” foram preservadas; a repetição e a ênfase temporal do hebraico foram mantidas sem excessiva rigidez literal.
