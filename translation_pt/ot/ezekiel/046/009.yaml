  text: וּ/בְ/ב֨וֹא עַם הָ/אָ֜רֶץ לִ/פְנֵ֣י יְהוָה֮ בַּ/מּֽוֹעֲדִים֒ הַ/בָּ֡א דֶּרֶךְ שַׁ֨עַר צָפ֜וֹן לְ/הִֽשְׁתַּחֲוֺ֗ת יֵצֵא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב וְ/הַ/בָּא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב יֵצֵ֖א דֶּרֶךְ שַׁ֣עַר צָפ֑וֹנָ/ה לֹ֣א יָשׁ֗וּב דֶּ֤רֶךְ הַ/שַּׁ֨עַר֙ אֲשֶׁר בָּ֣א ב֔/וֹ כִּ֥י נִכְח֖/וֹ יצאו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/009.yaml
  text: And when the people of the land come before Yahweh at the appointed times[a], whoever enters by way of the north gate to worship shall go out by way of the south gate, and whoever enters by way of the south gate shall go out by way of the north gate. He shall not return by way of the gate through which he entered[c][b], but shall go out straight ahead.
translation:
  language: pt
  text: Quando o povo da terra vier à presença de Yahweh nas ocasiões determinadas[a], quem entrar pelo portão norte para adorar[b] sairá pelo portão sul, e quem entrar pelo portão sul sairá pelo portão norte. Não voltará pelo portão por onde entrou, mas seguirá em frente para sair[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nas festas determinadas» ou «nas celebrações».'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «para se prostrar» ou «para se curvar».'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: «pois diante dele [ou: em frente a ele] sairão». O hebraico passa aqui do singular para o plural. A orientação é continuar em frente e sair pelo lado oposto, em vez de voltar pelo portão de entrada.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Preserva a expressão hebraica e, no contexto de Ezequiel, distingue a população em geral do príncipe e dos sacerdotes sem impor a interpretação mais específica «o povo comum».
- source_word: לִפְנֵי יְהוָה
  choice: à presença de Yahweh
  rationale: Expressa de modo natural o comparecimento cultual diante de Deus e translitera o nome divino pessoal.
- source_word: בַּמּוֹעֲדִים
  choice: nas ocasiões determinadas
  rationale: Mantém a amplitude de מוֹעֵד, que pode indicar tempos fixados e, neste contexto, festas ou celebrações marcadas.
- source_word: הַבָּא ... לְהִשְׁתַּחֲוֺת
  choice: quem entrar ... para adorar
  rationale: A construção participial formula uma regra geral. «Adorar» comunica naturalmente a função cultual do ato, enquanto a nota conserva o gesto literal de prostrar-se.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹן / דֶּרֶךְ שַׁעַר נֶגֶב
  choice: pelo portão norte / pelo portão sul
  rationale: Em português, «pelo portão» expressa com clareza tanto a passagem como a rota indicada por דֶּרֶךְ.
- source_word: יֵצֵא
  choice: sairá
  rationale: O futuro do presente contexto normativo comunica uma instrução obrigatória sem acrescentar um verbo modal inexistente no hebraico.
- source_word: לֹא יָשׁוּב
  choice: não voltará
  rationale: É uma tradução direta de שוב e preserva a proibição de refazer o caminho de entrada.
- source_word: אֲשֶׁר בָּא בוֹ
  choice: por onde entrou
  rationale: Formulação portuguesa idiomática para a oração relativa que identifica o portão usado na entrada.
- source_word: כִּי נִכְחוֹ יֵצֵאוּ
  choice: mas seguirá em frente para sair
  rationale: 'Comunica a força prática de נִכְחוֹ: continuar diretamente adiante e sair pelo lado oposto. O singular mantém a continuidade da regra individual; a mudança para o plural no hebraico é registrada em nota.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. «Yahweh» preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza do ato expresso por הִשְׁתַּחֲוָה
  choice: adorar, com nota sobre o gesto literal
  alternative: prostrar-se; curvar-se
  rationale: No contexto do templo, o gesto corporal é um ato de culto. A tradução corrente comunica sua função sem apagar seu sentido concreto, preservado na nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe normativa natural. Conserva «povo da terra» como expressão contextual e usa «portão» para a estrutura de acesso do complexo do templo. As notas preservam a amplitude de מוֹעֵד, o gesto físico de adoração e a ambiguidade gramatical e espacial da frase final.
