  terminology: «Yahweh», «príncipe», «holocausto» e «ofertas de comunhão» são escolhas defensáveis. A nota em a preserva de modo útil a alternativa tradicional «ofertas pacíficas» e o campo semântico de paz/bem-estar. A nota em b explica corretamente a ausência de agente expresso.
