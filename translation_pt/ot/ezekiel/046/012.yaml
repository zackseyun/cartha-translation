reference: Ezekiel 46:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
translation:
  language: pt
  text: Mas, quando o príncipe fizer uma oferta voluntária a Yahweh — seja um holocausto ou ofertas de comunhão[a] —, o portão voltado para o leste será aberto para ele. Ele apresentará seu holocausto e suas ofertas de comunhão como faz no dia de sábado. Depois sairá e, após sua saída, o portão será fechado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas pacíficas”. O termo hebraico também pode evocar paz, bem-estar e comunhão.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico não identifica expressamente quem abre e fecha o portão; por isso, a tradução emprega a voz passiva.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְכִי
  choice: Mas, quando
  rationale: Introduz um caso temporal específico em contraste com as instruções regulares anteriores; a formulação é natural em português jurídico-narrativo.
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Preserva a designação reconhecida do detentor de um ofício político e cultual em Ezequiel, sem identificá-lo necessariamente como rei.
- source_word: נְדָבָה
  choice: oferta voluntária
  rationale: Expressa uma oferta apresentada espontaneamente, e não por obrigação fixa.
- source_word: עוֹלָה
  choice: holocausto
  rationale: Termo sacrificial tradicional e preciso para a oferta inteiramente queimada, amplamente reconhecido em português bíblico.
- source_word: שְׁלָמִים
  choice: ofertas de comunhão
  rationale: Comunica de modo compreensível a dimensão relacional desse sacrifício; a alternativa tradicional 'ofertas pacíficas' é registrada em nota para preservar a amplitude lexical.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Representa diretamente o nome divino יהוה, em conformidade com a decisão teológica fornecida.
- source_word: וּפָתַח לוֹ
  choice: o portão ... será aberto para ele
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas não nomeia o agente. A voz passiva preserva essa indeterminação em português.
- source_word: הַשַּׁעַר הַפֹּנֶה קָדִים
  choice: o portão voltado para o leste
  rationale: Tradução clara e natural da expressão participial que identifica o portão.
- source_word: וְעָשָׂה
  choice: apresentará
  rationale: No contexto sacrificial, עשה denota realizar ou oferecer o sacrifício; 'apresentará' evita a combinação pouco natural 'fará seu holocausto'.
- source_word: כַּאֲשֶׁר יַעֲשֶׂה בְּיוֹם הַשַּׁבָּת
  choice: como faz no dia de sábado
  rationale: Indica comparação com o procedimento habitual já descrito para o sábado.
- source_word: וְיָצָא
  choice: Depois sairá
  rationale: Torna clara a sequência do procedimento sem acrescentar conteúdo interpretativo.
- source_word: וְסָגַר אֶת־הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  choice: e, após sua saída, o portão será fechado
  rationale: A passiva mantém não identificado o agente do fechamento, como no caso da abertura, e produz português fluente.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' preserva o nome de aliança e segue a orientação teológica fornecida sem substituí-lo por um título.
- issue: Sentido de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: A expressão pode destacar comunhão, paz ou bem-estar. 'Ofertas de comunhão' é clara para leitores atuais, enquanto a nota preserva a alternativa tradicional e a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém terminologia cultual reconhecível, mas prefere formulações naturais. As duas notas têm marcadores correspondentes no texto principal.
