base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/006.yaml
  text: And on the day of the new moon[a], there shall be an unblemished young bull from the herd, and six lambs and a ram; they shall be unblemished.
translation:
  language: pt
  text: No dia da lua nova[a], haverá um novilho sem defeito, seis cordeiros e um carneiro; estes serão sem defeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «no dia do mês»; neste contexto de culto, a expressão se refere à celebração da lua nova.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: No dia da lua nova
  rationale: Embora a expressão seja literalmente «no dia do mês», no contexto do calendário sacrificial ela designa o dia da lua nova. A formulação é clara e corrente em português.
- source_word: פַּר בֶּן־בָּקָר
  choice: um novilho
  rationale: A expressão sacrificial hebraica designa um bovino macho jovem. «Novilho» comunica isso naturalmente, sem reproduzir o hebraísmo literal «filho do gado».
- source_word: תָּמִים / תְּמִימִם
  choice: sem defeito
  rationale: No contexto sacrificial, o termo indica animais livres de defeito físico. «Sem defeito» é preciso, acessível e evita o sentido moral ou absoluto que «perfeito» poderia sugerir.
- source_word: שֵׁשֶׁת כְּבָשִׂים
  choice: seis cordeiros
  rationale: כְּבָשִׂים refere-se naturalmente a cordeiros nesta lista sacrificial; não é necessário explicitar o gênero gramatical.
- source_word: וָאַיִל
  choice: e um carneiro
  rationale: אַיִל é o termo comum para o carneiro adulto oferecido em sacrifício.
- source_word: יִהְיוּ
  choice: todos serão sem defeito
  rationale: O plural retoma os animais enumerados. «Todos» torna explícito em português o alcance natural da exigência sem alterar seu conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário sacrificial compreensível. A ordem da lista e a repetição da exigência de ausência de defeito foram preservadas, enquanto a sintaxe foi ajustada ao uso natural do português.
