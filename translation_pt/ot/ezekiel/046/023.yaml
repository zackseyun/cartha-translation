  text: A row ran around within them[a], around all four of them, and hearths had been made beneath the rows all around.
translation:
  language: pt
  text: Dentro de cada um dos quatro pátios havia uma fileira que corria em toda a volta, e haviam sido feitos lugares para cozinhar debaixo das fileiras[a], em toda a volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “debaixo dos recintos”, “debaixo das saliências” ou “debaixo das paredes”; o sentido arquitetônico exato do termo hebraico é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוּר
  choice: fileira
  rationale: O substantivo designa uma fileira ou fiada contínua em torno da estrutura. “Fileira” conserva a imagem arquitetônica sem defini-la indevidamente como uma parede completa.
- source_word: סָבִיב ... סָבִיב
  choice: ao redor ... em toda a volta
  rationale: A repetição hebraica reforça que a estrutura circundava inteiramente os pátios; a tradução preserva essa ênfase com formulação natural em português.
- source_word: בָּהֶם ... לְאַרְבַּעְתָּם
  choice: dentro de cada um dos quatro pátios
  rationale: Os pronomes retomam os quatro pátios do versículo anterior. A formulação explicita o referente contextual e expressa naturalmente a aplicação distributiva aos quatro.
- source_word: מְבַשְּׁלוֹת
  choice: lugares para cozinhar
  rationale: Derivado de בשׁל, “cozinhar/ferver”, o termo indica instalações destinadas ao preparo dos alimentos. A escolha evita especificar sem certeza se eram fogões, lareiras ou outro tipo de estrutura culinária.
- source_word: עָשׂוּי
  choice: havia
  rationale: O particípio passivo indica que as instalações estavam feitas ou construídas. Em português, “havia” transmite com naturalidade o estado resultante no contexto descritivo.
- source_word: מִתַּחַת
  choice: debaixo de
  rationale: Equivalente espacial direto e claro para indicar a posição inferior das instalações culinárias.
- source_word: הַטִּירוֹת
  choice: as fileiras
  rationale: O referente arquitetônico exato é incerto. “Fileiras” mantém a provável conexão com טוּר no início do versículo, enquanto a nota registra alternativas plausíveis.
