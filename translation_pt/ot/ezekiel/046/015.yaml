  yaml_path: translation/ot/ezekiel/046/015.yaml
  text: They shall provide the lamb, the grain offering, and the oil, morning by morning, as a regular burnt offering.
translation:
  language: pt
  text: Prepararão o cordeiro, a oferta de cereal e o azeite, manhã após manhã, como holocausto regular.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Prepararão
  rationale: O verbo עשה tem sentido amplo de fazer, realizar ou preparar. No contexto cultual, “prepararão” comunica naturalmente a execução e apresentação dos elementos da oferta sem acrescentar uma ideia ausente do hebraico.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: מִנְחָה, neste contexto sacrificial, designa a oferta vegetal que acompanha o holocausto; “oferta de cereal” é clara e específica em português moderno.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: A repetição distributiva hebraica indica regularidade diária; esta expressão preserva tanto a ênfase quanto a naturalidade.
- source_word: עֹלַת תָּמִיד
  choice: como holocausto contínuo
  rationale: עֹלָה é a oferta inteiramente queimada, tradicionalmente “holocausto”; תָּמִיד indica continuidade ou regularidade. “Como” expressa a função do conjunto preparado.
theological_decisions:
- issue: Relação entre o cordeiro e os elementos acompanhantes com עֹלַת תָּמִיד
  choice: como holocausto contínuo
  alternative: para um holocausto contínuo
  rationale: A construção hebraica final funciona como caracterização do rito. “Como” evita sugerir que os itens sejam apenas destinados a outro sacrifício separado e acompanha adequadamente a relação sintática concisa do original.
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual bíblica reconhecível. A frase mantém a concisão e a repetição enfática do hebraico.
