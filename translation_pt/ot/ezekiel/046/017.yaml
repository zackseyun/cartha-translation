source:
  edition: WLC
  text: וְ/כִֽי יִתֵּ֨ן מַתָּנָ֜ה מִ/נַּחֲלָת֗/וֹ לְ/אַחַד֙ מֵֽ/עֲבָדָ֔י/ו וְ/הָ֤יְתָה לּ/וֹ֙ עַד שְׁנַ֣ת הַ/דְּר֔וֹר וְ/שָׁבַ֖ת לַ/נָּשִׂ֑יא אַ֚ךְ נַחֲלָת֔/וֹ בָּנָ֖י/ו לָ/הֶ֥ם תִּהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/017.yaml
  text: But if he gives a gift from his inheritance to one of his servants[a], it shall belong to him until the year of liberty; then it shall return to the prince. Only his inheritance belongs to his sons; it shall be theirs.
translation:
  language: pt
  text: Mas, se ele der de sua herança uma dádiva a um de seus servos, ela lhe pertencerá até o ano da liberdade[a]; depois, voltará ao príncipe. Somente sua herança pertencerá a seus filhos; será deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ano da libertação”. Provavelmente se refere a um ano de restituição semelhante ao Jubileu, embora aqui o hebraico diga “liberdade”, e não use o termo habitual para “Jubileu”.
    reason: Registra a alternativa lexical e a provável referência institucional sem substituir o termo presente no texto hebraico.
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz uma hipótese legal em contraste com a disposição anterior, preservando tanto a conjunção quanto a força condicional.
- source_word: מַתָּנָה
  choice: uma dádiva
  rationale: Expressa uma transferência voluntária de bens em registro digno e corrente; evita confusão com o sentido de habilidade que “dom” pode ter.
- source_word: מִנַּחֲלָתוֹ
  choice: de sua herança
  rationale: נחלה designa aqui a propriedade hereditária do príncipe, não apenas bens em sentido genérico.
- source_word: לְאַחַד מֵעֲבָדָיו
  choice: a um de seus servos
  rationale: עבד pode indicar servo ou escravo. Neste contexto, o contraste jurídico é entre filhos e dependentes da casa; “servos” preserva essa relação sem definir além do que o contexto exige.
- source_word: וְהָיְתָה לּוֹ
  choice: ela lhe pertencerá
  rationale: O pronome feminino retoma a dádiva ou porção da herança, e a formulação comunica posse temporária.
- source_word: עַד שְׁנַת הַדְּרוֹר
  choice: até o ano da liberdade
  rationale: דְּרוֹר significa liberdade ou libertação. A tradução mantém o termo efetivamente usado no hebraico, sem substituí-lo por “Jubileu”.
- source_word: וְשָׁבַת לַנָּשִׂיא
  choice: depois, voltará ao príncipe
  rationale: שוב indica retorno ou reversão da propriedade; “príncipe” é a tradução contextual de נָשִׂיא na visão de Ezequiel.
- source_word: אַךְ נַחֲלָתוֹ בָּנָיו לָהֶם תִּהְיֶה
  choice: Somente sua herança pertencerá a seus filhos; será deles
  rationale: Preserva a restrição introduzida por אַךְ e a ênfase final na posse duradoura dos filhos, sem apagar a repetição enfática do hebraico.
theological_decisions:
- issue: Sentido social de עבד
  choice: servos
  alternative: escravos
  rationale: O termo hebraico admite ambos os sentidos. Como o foco do versículo é a diferença entre concessão temporária a um dependente e herança permanente dos filhos, “servos” mantém a amplitude contextual sem resolver indevidamente a condição jurídica precisa.
- issue: Identificação do ano de דְּרוֹר
  choice: ano da liberdade
  alternative: ano da libertação; ano do Jubileu
  rationale: O contexto sugere uma restauração de propriedade semelhante à do Jubileu, mas o texto não emprega o termo hebraico habitual para “Jubileu”. A tradução principal conserva o léxico da fonte, e a nota registra a alternativa contextual.
- issue: Alcance da cláusula final
  choice: Somente sua herança pertencerá a seus filhos; será deles
  alternative: Somente a herança dada a seus filhos será deles
  rationale: O hebraico é compacto e enfático. A formulação escolhida evita inserir explicitamente “dada”, ausente nesta cláusula, e mantém o contraste entre a posse temporária do servo e o direito hereditário dos filhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe jurídica permanece clara; “dádiva” distingue a transferência patrimonial de outros sentidos possíveis de “dom”. O marcador [a] foi colocado junto à expressão que a nota explica.
