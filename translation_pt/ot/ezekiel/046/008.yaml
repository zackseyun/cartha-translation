  text: וּ/בְ/ב֖וֹא הַ/נָּשִׂ֑יא דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/בְ/דַרְכּ֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/008.yaml
  text: When the prince enters[a], he shall enter by way of the porch of the gate, and he shall go out by the same way.
translation:
  language: pt
  text: Quando o príncipe entrar, entrará pelo vestíbulo do portão e sairá pelo mesmo caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pelo seu caminho sairá”; isto é, sairá pela mesma rota pela qual entrou.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/ב֖וֹא
  choice: Quando ... entrar
  rationale: A combinação da conjunção e da preposição com o infinitivo construto de בוא tem valor temporal neste contexto; “Quando ... entrar” expressa isso com clareza e naturalidade.
- source_word: הַ/נָּשִׂיא
  choice: o príncipe
  rationale: Em Ezequiel 40–48, נָשִׂיא designa o governante civil sem necessariamente identificá-lo como rei; “príncipe” preserva o uso tradicional e a neutralidade do termo.
- source_word: דֶּרֶךְ
  choice: pelo
  rationale: דֶּרֶךְ significa “caminho” ou “via”; diante de “vestíbulo do portão”, a preposição “pelo” comunica de modo natural a ideia de passagem por essa via.
- source_word: אוּלָם
  choice: vestíbulo
  rationale: אוּלָם designa a área coberta de entrada da estrutura do portão. “Vestíbulo” é claro em português e mantém a precisão arquitetônica.
- source_word: הַ/שַּׁעַר
  choice: do portão
  rationale: Na construção com אוּלָם, identifica o vestíbulo pertencente ao portão. “Portão” é natural para a grande entrada do complexo do templo.
- source_word: יָב֔וֹא
  choice: entrará
  rationale: O imperfeito dá uma instrução procedural no contexto da visão. O futuro em português preserva esse valor normativo sem convertê-lo em ordem direta.
- source_word: וּ/בְ/דַרְכּ֖/וֹ
  choice: pelo mesmo caminho
  rationale: Literalmente, “e pelo seu caminho”. No contexto, o sufixo remete à rota pela qual o príncipe entrou; “pelo mesmo caminho” explicita naturalmente essa referência sem alterar a instrução.
- source_word: יֵצֵֽא
  choice: sairá
  rationale: יצא é o verbo comum para sair. “Sairá” reproduz de maneira direta o paralelismo procedural com “entrará”.
theological_decisions:
- issue: Identidade e condição de הַנָּשִׂיא na visão do templo de Ezequiel
  choice: Traduzir de forma neutra como “o príncipe”
  alternative: “o governante” ou uma identificação explícita como príncipe messiânico
  rationale: O versículo apenas regula a entrada e a saída dessa figura e não resolve sua identidade mais ampla. A tradução evita impor uma interpretação messiânica ou estritamente monárquica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vestíbulo” mantém a referência arquitetônica sem recorrer a terminologia excessivamente técnica.
