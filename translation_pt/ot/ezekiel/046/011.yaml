base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/011.yaml
  text: At the festivals and the appointed times[a], the grain offering shall be one ephah for the bull and one ephah for the ram, and for the lambs as much as he is able to give, with a hin of oil to each ephah.
translation:
  language: pt
  text: Nas festas e nos tempos determinados, a oferta de cereal será de um efa para o touro e um efa para o carneiro; para os cordeiros, a oferta será o que ele puder dar[a], com um him de azeite para cada efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a dádiva de sua mão”, expressão que indica aquilo que ele tem condições de dar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחַגִּים
  choice: Nas festas
  rationale: חַגִּים designa celebrações festivas do calendário de culto. “Festas” é claro, natural e preserva esse sentido.
- source_word: וּבַמּוֹעֲדִים
  choice: e nas ocasiões determinadas
  rationale: מוֹעֲדִים refere-se a tempos ou ocasiões previamente estabelecidos, muitas vezes para assembleias sagradas. A tradução mantém a distinção em relação a חַגִּים.
- source_word: תִּהְיֶה הַמִּנְחָה
  choice: a oferta de cereal será
  rationale: Neste contexto sacrificial, מִנְחָה é a oferta de cereal, como confirmam as medidas de efa e o azeite que a acompanham.
- source_word: אֵיפָה
  choice: um efa
  rationale: אֵיפָה é uma medida antiga de capacidade para secos. Conserva-se o nome tradicional da unidade, com o numeral implícito expresso naturalmente em português.
- source_word: לַפָּר
  choice: por novilho
  rationale: פַּר indica um bovino macho destinado ao sacrifício. “Novilho” é corrente no registro bíblico e a preposição “por” expressa a proporção prescrita.
- source_word: וְאֵיפָה לָאַיִל
  choice: e um efa por carneiro
  rationale: Preserva o paralelismo e a proporção estabelecida para o segundo animal sacrificial.
- source_word: וְלַכְּבָשִׂים מַתַּת יָדוֹ
  choice: quanto aos cordeiros, será conforme o que ele puder dar
  rationale: A expressão idiomática מַתַּת יָדוֹ, literalmente “a dádiva de sua mão”, indica uma quantidade segundo a capacidade ou os recursos de quem oferece.
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  choice: com um him de azeite para cada efa
  rationale: A frase estabelece a proporção de azeite que acompanha a oferta de cereal. “Para cada efa” torna explícito o valor distributivo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se as unidades antigas “efa” e “him” e distingue-se entre “festas” e “ocasiões determinadas”. O marcador da nota foi colocado junto à expressão que ela explica.
