  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ שַׁ֜עַר הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ הַ/פֹּנֶ֣ה קָדִ֔ים יִהְיֶ֣ה סָג֔וּר שֵׁ֖שֶׁת יְמֵ֣י הַֽ/מַּעֲשֶׂ֑ה וּ/בְ/י֤וֹם הַ/שַּׁבָּת֙ יִפָּתֵ֔חַ וּ/בְ/י֥וֹם הַ/חֹ֖דֶשׁ יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/001.yaml
  text: 'Thus says the Lord GOD: The gate of the inner court that faces east shall be shut during the six working days[a], but on the Sabbath day it shall be opened, and on the day of the new moon it shall be opened.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: O portão do pátio interno voltado para o leste permanecerá fechado durante os seis dias de trabalho; mas, no dia do sábado, será aberto; e, no dia da lua nova[a], será aberto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dia da lua nova”; isto é, a observância mensal da lua nova.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em português atual e solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Representa o título composto Adonai YHWH segundo a convenção portuguesa que evita a forma pouco natural “Senhor SENHOR” e distingue o nome divino por versaletes simulados.
- source_word: שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: O portão do pátio interno
  rationale: Expressa diretamente a relação do portão com o pátio interno no contexto do templo.
- source_word: הַפֹּנֶה קָדִים
  choice: que dá para o leste
  rationale: Forma corrente em português para indicar a orientação do portão.
- source_word: יִהְיֶה סָגוּר
  choice: ficará fechado
  rationale: Comunica o estado contínuo prescrito pela construção hebraica com היה e o adjetivo passivo.
- source_word: שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה
  choice: durante os seis dias de trabalho
  rationale: Transmite com clareza o contraste entre os dias comuns de atividade e os dias de observância religiosa.
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: mas, no dia do sábado
  rationale: “Mas” explicita naturalmente o contraste contextual, embora o hebraico use a conjunção comum; “dia do sábado” conserva a formulação temporal.
- source_word: יִפָּתֵחַ
  choice: será aberto
  rationale: Mantém a voz passiva do nifal, repetida no hebraico para sábado e lua nova.
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: e no dia da lua nova
  rationale: No contexto cultual e calendárico, חֹדֶשׁ designa a lua nova e sua observância mensal, não apenas o mês.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  alternative: o Senhor Yahweh
  rationale: A opção segue uma convenção portuguesa amplamente reconhecível para o título composto e evita “Senhor SENHOR”. A alternativa translitera explicitamente o nome divino, mas é menos comum na leitura bíblica portuguesa geral.
- issue: Sentido cultual de הַחֹדֶשׁ
  choice: lua nova
  alternative: mês
  rationale: A menção paralela ao sábado e as normas de culto do contexto indicam a celebração da lua nova, sem exigir uma interpretação denominacional posterior.
translation_notes:
  register: Português moderno, claro e digno, com tom profético e normativo. O marcador da nota foi colocado junto de “lua nova”, expressão à qual a nota efetivamente se refere.
