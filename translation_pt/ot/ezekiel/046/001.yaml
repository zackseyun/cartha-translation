revisions:
- from: 'Assim diz o Senhor DEUS: O portão do pátio interno que dá para o leste ficará fechado durante os seis dias de trabalho; mas, no dia do sábado, será aberto, e no dia da lua nova[a] também será aberto.'
  to: 'Assim diz o Senhor Yahweh: O portão do pátio interno voltado para o leste permanecerá fechado durante os seis dias de trabalho; mas, no dia do sábado, será aberto; e, no dia da lua nova[a], será aberto.'
  rationale: A revisão ajusta a representação do tetragrama à política indicada no material de auditoria, preservando o título composto «o Senhor Yahweh». Também torna mais exata a descrição da orientação do portão e do seu estado de fechamento, sem alterar o sentido nem eliminar a repetição enfática da abertura no sábado e na lua nova. A nota e sua âncora são mantidas.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:42:00Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a fórmula profética, o portão do pátio interno voltado para o leste, seu fechamento nos seis dias de trabalho e sua abertura no sábado e na lua nova. A repetição da passiva «será aberto» preserva a repetição hebraica. Contudo, «o Senhor DEUS» não segue a decisão teológica fornecida para יְהוָה, que requer «Yahweh»; no título composto אֲדֹנָי יְהוִה, a forma apropriada é «o Senhor Yahweh».
  naturalness: O português é claro, moderno e adequado ao registro normativo-profético. «Dá para o leste» é natural, embora «voltado para o leste» seja ligeiramente mais preciso e mais próprio para a orientação arquitetônica. «Permanecerá fechado» exprime melhor o estado prescrito do que «ficará fechado».
  terminology: «Pátio interno», «sábado» e «lua nova» são termos adequados ao contexto cultual. «Yahweh» deve substituir «DEUS» para representar o tetragrama conforme a decisão de terminologia indicada. A nota ancorada em «lua nova» é pertinente e mantém seu foco cultural.
  issues:
  - severity: medium
    issue: O nome divino em אֲדֹנָי יְהוִה foi traduzido como «o Senhor DEUS».
    rationale: A documentação teológica do projeto determina «Yahweh» para יְהוָה. Como o hebraico combina אֲדֹנָי com o tetragrama, «o Senhor Yahweh» preserva ambos os elementos sem produzir a duplicação artificial «Senhor SENHOR».
  - severity: low
    issue: «Ficará fechado» pode sugerir uma mudança de estado mais do que a condição regulamentar contínua.
    rationale: «Permanecerá fechado» comunica com maior precisão o sentido de יהיה סגור e continua natural em português.
