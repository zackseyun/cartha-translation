  text: בְּ/אַרְבַּ֜עַת מִקְצֹע֤וֹת הֶֽ/חָצֵר֙ חֲצֵר֣וֹת קְטֻר֔וֹת אַרְבָּעִ֣ים אֹ֔רֶךְ וּ/שְׁלֹשִׁ֖ים רֹ֑חַב מִדָּ֣ה אַחַ֔ת לְ/אַרְבַּעְתָּ֖/ם מְׄהֻׄקְׄצָׄעֽׄוֹׄתׄ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/022.yaml
  text: In the four corners of the court there were enclosed courts[a], forty long and thirty wide[c][b]; the four of them had the same measurement.
translation:
  language: pt
  text: Nos quatro cantos do pátio havia pátios fechados[a], com quarenta de comprimento e trinta de largura[b]. Os quatro tinham as mesmas medidas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pátios murados” ou “pátios isolados”. O adjetivo hebraico provavelmente descreve os pátios como espaços fechados.
    reason: lexical_alternative
  - marker: b
    text: O hebraico não repete explicitamente aqui a unidade “côvados”, embora ela esteja implícita nas medidas do templo ao redor.
    reason: cultural_note
  - marker: c
    text: A última palavra hebraica é rara e de sentido incerto. Ela também pode enfatizar que estes eram os quatro pátios situados nos cantos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֹעוֹת
  choice: cantos
  rationale: No contexto arquitetônico, refere-se aos cantos ou às áreas de canto do pátio; “cantos” é natural e preciso em português.
- source_word: חֲצֵרוֹת
  choice: pátios
  rationale: Designa áreas menores dentro do complexo do pátio maior. “Pátios” mantém a terminologia arquitetônica de modo claro.
- source_word: קְטֻרוֹת
  choice: fechados
  rationale: O adjetivo provavelmente descreve espaços cercados ou isolados. “Fechados” preserva o sentido sem especificar indevidamente que eram murados.
- source_word: אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב
  choice: com quarenta de comprimento e trinta de largura
  rationale: Reproduz as dimensões elípticas do hebraico em português natural, sem inserir “côvados”, unidade apenas implícita pelo contexto.
- source_word: מִדָּה אַחַת
  choice: as mesmas medidas
  rationale: Expressa que os quatro pátios tinham dimensões idênticas; o plural idiomático concorda naturalmente com comprimento e largura.
- source_word: לְאַרְבַּעְתָּם
  choice: os quatro
  rationale: Retoma de forma clara e concisa os quatro pátios situados nos cantos.
- source_word: מְהֻקְצָעוֹת
  choice: tinham
  rationale: A forma final é rara e difícil. A tradução evita uma literalidade obscura e deixa a possível referência aos cantos registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário arquitetônico comum. A repetição de “pátio/pátios” preserva a relação entre o pátio maior e os quatro pátios menores. A ambiguidade da forma hebraica final é mantida em nota.
