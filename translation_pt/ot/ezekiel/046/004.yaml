  text: וְ/הָ֣/עֹלָ֔ה אֲשֶׁר יַקְרִ֥ב הַ/נָּשִׂ֖יא לַֽ/יהוָ֑ה בְּ/י֣וֹם הַ/שַּׁבָּ֗ת שִׁשָּׁ֧ה כְבָשִׂ֛ים תְּמִימִ֖ם וְ/אַ֥יִל תָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/004.yaml
  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
translation:
  language: pt
  text: E a oferta queimada que o príncipe apresentará a Yahweh no sábado será de seis cordeiros sem defeito e um carneiro sem defeito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferecerá”; o verbo hebraico significa literalmente “fazer chegar perto” ou “apresentar” em uso sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹלָה
  choice: E a oferta queimada
  rationale: עֹלָה é o termo sacrificial habitual para a oferta inteiramente consumida pelo fogo. “Oferta queimada” é clara em português e mais transparente ao leitor comum que uma formulação etimológica como “oferta de ascensão”.
- source_word: אֲשֶׁר יַקְרִב
  choice: que o príncipe apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa levar para perto ou apresentar uma oferta. “Apresentará” preserva essa ideia sem soar artificial.
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Na visão do templo em Ezequiel, נָשִׂיא designa o governante reconhecido, sem necessariamente identificá-lo como rei. “Príncipe” mantém a distinção terminológica do texto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário ou a dedicação da oferta, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: A expressão indica o momento da oferta. “No dia de sábado” é natural, clara e conserva o substantivo “dia” presente no hebraico.
- source_word: שִׁשָּׁה כְבָשִׂים תְּמִימִם
  choice: seis cordeiros sem defeito
  rationale: כְבָשִׂים, em listas sacrificiais, refere-se adequadamente a cordeiros; תְּמִימִם indica ausência de defeito físico aceitável para o sacrifício.
- source_word: וְאַיִל תָּמִים
  choice: e um carneiro sem defeito
  rationale: אַיִל significa “carneiro”. O artigo indefinido “um” expressa naturalmente o singular na enumeração, e תָּמִים recebe a mesma tradução culticamente precisa usada no plural.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome próprio da aliança em vez de substituí-lo por um título, sem recorrer à forma híbrida tradicional “Jeová”.
- issue: Sentido cultual de עֹלָה
  choice: oferta queimada
  alternative: holocausto; oferta de ascensão
  rationale: “Oferta queimada” comunica que se trata de uma oferta consumida pelo fogo sem introduzir conotações modernas de “holocausto”; a alternativa etimológica “oferta de ascensão” seria menos clara.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém a estrutura normativa do versículo, a terminologia sacrificial e a repetição de “sem defeito” para os dois tipos de animais.
