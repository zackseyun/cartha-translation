  text: וַ/יּוֹצִיאֵ֗/נִי אֶל הֶֽ/חָצֵר֙ הַ/חִ֣יצֹנָ֔ה וַ/יַּ֣עֲבִירֵ֔/נִי אֶל אַרְבַּ֖עַת מִקְצוֹעֵ֣י הֶ/חָצֵ֑ר וְ/הִנֵּ֤ה חָצֵר֙ בְּ/מִקְצֹ֣עַ הֶ/חָצֵ֔ר חָצֵ֖ר בְּ/מִקְצֹ֥עַ הֶ/חָצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/021.yaml
  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
translation:
  language: pt
  text: Então ele me levou para fora, ao pátio externo, e me conduziu pelos quatro cantos do pátio[a]. E eis que havia um pátio em cada canto do pátio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete literalmente: “um pátio no canto do pátio, um pátio no canto do pátio”, depois de mencionar os quatro cantos. O sentido é distributivo: havia um pátio em cada um dos quatro cantos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Então ele me levou para fora
  rationale: O hifil de יצא com sufixo de primeira pessoa significa fazer sair ou levar para fora. “Então” expressa com naturalidade a progressão narrativa do waw consecutivo.
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: ao pátio externo
  rationale: חָצֵר designa pátio ou átrio; “pátio externo” é claro, arquitetonicamente adequado e acessível ao leitor moderno.
- source_word: וַיַּעֲבִירֵנִי
  choice: me conduziu pelos
  rationale: O hifil de עבר indica fazer passar por, através de ou junto a algo. “Conduziu pelos” preserva o movimento guiado durante a inspeção, sem sugerir mera chegada aos cantos.
- source_word: אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר
  choice: os quatro cantos do pátio
  rationale: מִקְצוֹעַ denota canto ou ângulo; “quatro cantos” é a expressão arquitetônica corrente em português.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: A expressão mantém a função de chamar a atenção para algo visto de modo marcante e combina com o registro visionário de Ezequiel.
- source_word: חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר
  choice: havia um pátio em cada canto do pátio
  rationale: Após a menção dos quatro cantos, a repetição hebraica tem sentido distributivo. A formulação portuguesa comunica naturalmente que havia um pátio em cada um deles, enquanto a nota preserva a forma literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário arquitetônico acessível. A construção “ele me levou” evita solenidade artificial, enquanto “eis que” preserva o caráter visionário do relato.
