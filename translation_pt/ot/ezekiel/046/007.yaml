base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/007.yaml
  text: And he shall provide as a grain offering an ephah for the bull and an ephah for the ram[a], and for the lambs whatever his hand can afford, and a hin of oil with each ephah.
translation:
  language: pt
  text: Como oferta de cereal, ele fornecerá um efa para o novilho e um efa para o carneiro; para os cordeiros, dará conforme os seus recursos permitirem[a], e um him de azeite para cada efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “conforme a sua mão puder alcançar”. A expressão hebraica se refere ao que seus recursos lhe permitem fornecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפָה
  choice: efa
  rationale: Mantém o nome da antiga medida de secos, importante nesta regulamentação ritual, sem substituí-lo por uma equivalência moderna apenas aproximada.
- source_word: פַּר
  choice: o novilho
  rationale: O artigo hebraico aponta para o animal sacrificial já especificado; “novilho” é uma designação corrente e adequada neste contexto.
- source_word: אַיִל
  choice: o carneiro
  rationale: Preserva a referência definida ao carneiro sacrificial indicado na ordenança.
- source_word: יַעֲשֶׂה מִנְחָה
  choice: Como oferta de cereal, ele fornecerá
  rationale: מִנְחָה designa aqui a oferta não animal associada aos sacrifícios; “oferta de cereal” é claro e “fornecerá” expressa naturalmente o ato de prover as quantidades prescritas.
- source_word: כְּבָשִׂים
  choice: os cordeiros
  rationale: Traduz o termo normalmente, sem acrescentar a especificação de sexo que não precisa ser repetida neste versículo.
- source_word: כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: conforme os seus recursos permitirem
  rationale: Comunica em português natural o sentido da expressão idiomática hebraica, segundo a capacidade material da pessoa; a imagem literal da mão é preservada em nota.
- source_word: שֶׁמֶן הִין לָאֵיפָה
  choice: um him de azeite para cada efa
  rationale: Mantém a antiga medida de líquidos e torna clara a proporção distributiva entre o azeite e cada efa da oferta.
theological_decisions:
- issue: Alcance da expressão כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: conforme os seus recursos permitirem
  alternative: conforme a sua mão puder alcançar
  rationale: A formulação escolhida transmite a capacidade de prover sem transformar a expressão em uma exigência quantitativa mais precisa do que o hebraico estabelece; a tradução literal permanece registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se transliterados “efa” e “him”, por serem medidas antigas específicas; evitou-se uma conversão moderna imprecisa. O ponto e vírgula organiza a longa prescrição sem alterar sua relação sintática.
