base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/005.yaml
  text: And the grain offering shall be an ephah with the ram[a], and with the lambs a grain offering as much as his hand can give[b], and a hin of oil with each ephah.
translation:
  language: pt
  text: A oferta de cereal será de um efa para o carneiro[a] e, para os cordeiros, uma oferta de cereal segundo as suas possibilidades[b]; e um him de azeite para cada efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com o carneiro» e, a seguir, «com os cordeiros»; a preposição hebraica pode indicar associação ou destinação nas instruções sacrificiais.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «a dádiva da sua mão», expressão que significa dar conforme as próprias possibilidades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: No contexto sacrificial, o termo designa uma oferta feita de produtos do campo, e não uma oferta genérica. «Oferta de cereal» é claro e corrente.
- source_word: אֵיפָה
  choice: efa
  rationale: Medida antiga de secos; a transliteração preserva a precisão técnica do texto sem impor uma conversão moderna incerta.
- source_word: לָאַיִל
  choice: com o carneiro
  rationale: A preposição associa a quantidade da oferta de cereal ao carneiro; «com» mantém essa relação sem excluir a possível noção de destinação.
- source_word: לַכְּבָשִׂים
  choice: com os cordeiros
  rationale: Mantém o paralelismo com o carneiro e introduz naturalmente a quantidade variável associada aos cordeiros.
- source_word: מַתַּת יָדוֹ
  choice: conforme o que a sua mão puder dar
  rationale: Preserva a imagem concreta da mão e explicita de modo natural o sentido idiomático de capacidade ou recursos disponíveis.
- source_word: שֶׁמֶן
  choice: azeite
  rationale: Em contexto bíblico sacrificial, trata-se de azeite de oliva; «azeite» é a forma portuguesa natural e tradicional.
- source_word: הִין
  choice: him
  rationale: Medida antiga de líquidos; a transliteração conserva a unidade técnica do original.
- source_word: לָאֵיפָה
  choice: para cada efa
  rationale: Expressa com clareza a proporção de um him de azeite por efa de cereal.
theological_decisions:
- issue: Valor da preposição ל nas expressões relativas ao carneiro e aos cordeiros
  choice: com o carneiro / com os cordeiros
  alternative: para o carneiro / para os cordeiros
  rationale: O hebraico permite associação ou destinação no contexto sacrificial. O texto principal usa a formulação mais natural em português e a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantêm-se as antigas unidades cultuais «efa» e «him», e as notas preservam tanto a ambiguidade da preposição hebraica quanto a imagem idiomática de «mão».
