source:
  edition: WLC
  text: וּ/בֵ֣ית יִשְׂרָאֵ֗ל לֹ֤א יֹאבוּ֙ לִ/שְׁמֹ֣עַ אֵלֶ֔י/ךָ כִּֽי אֵינָ֥/ם אֹבִ֖ים לִ/שְׁמֹ֣עַ אֵלָ֑/י כִּ֚י כָּל בֵּ֣ית יִשְׂרָאֵ֔ל חִזְקֵי מֵ֥צַח וּ/קְשֵׁי לֵ֖ב הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/007.yaml
  text: But the house of Israel will not be willing to listen to you[a], because they are not willing to listen to me[b]; for all the house of Israel are hard of forehead and stubborn of heart.
translation:
  language: pt
  text: Mas a casa de Israel não estará disposta a ouvir você, porque não está disposta a ouvir a mim; pois toda a casa de Israel tem a testa endurecida[a] e o coração obstinado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “fortes de testa”; a expressão hebraica retrata obstinação e desafio desavergonhado.
    reason: lexical_alternative
  - marker: b
    text: Ou “o coração endurecido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית יִשְׂרָאֵל
  choice: Mas a casa de Israel
  rationale: A conjunção assume valor adversativo em contraste com os povos estrangeiros do contexto anterior. “Casa de Israel” preserva a expressão coletiva e pactual do hebraico.
- source_word: לֹא יֹאבוּ / אֵינָם אֹבִים
  choice: não estará disposta / não está disposta
  rationale: O verbo אָבָה expressa vontade ou consentimento. A formulação conserva tanto a nuance volitiva quanto a diferença entre a forma de sentido futuro e o estado presente.
- source_word: לִשְׁמֹעַ אֵלֶיךָ / לִשְׁמֹעַ אֵלָי
  choice: a ouvir você / a ouvir a mim
  rationale: שׁמע com אֶל significa escutar ou dar ouvidos. “Ouvir” mantém o paralelismo entre a rejeição do profeta e a rejeição de Deus sem explicitar demais a implicação de obediência.
- source_word: כִּי ... כִּי
  choice: porque ... pois
  rationale: A primeira ocorrência apresenta a causa de Israel não ouvir Ezequiel; a segunda introduz a explicação adicional. A variação é natural em português e conserva as relações argumentativas.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Preserva a abrangência e o caráter corporativo da acusação hebraica.
- source_word: חִזְקֵי מֵצַח
  choice: tem a testa endurecida
  rationale: A expressão hebraica é literalmente “fortes/duros de testa” e retrata obstinação desavergonhada. A redação portuguesa conserva a imagem corporal sem se tornar excessivamente artificial.
- source_word: וּקְשֵׁי לֵב
  choice: e o coração obstinado
  rationale: A expressão descreve resistência interior e obstinação da vontade. “Coração obstinado” mantém a metáfora hebraica e evita uma repetição pouco elegante de “endurecido”.
theological_decisions:
- issue: Caracterização coletiva de Israel
  choice: Manter “toda a casa de Israel” sem restringir a afirmação.
  alternative: “muitos da casa de Israel” ou “os líderes de Israel”
  rationale: O texto hebraico formula uma acusação corporativa abrangente neste contexto profético. A tradução não deve limitá-la a um grupo que o versículo não identifica.
- issue: Relação entre ouvir o profeta e ouvir Deus
  choice: Preservar o paralelismo “ouvir você / ouvir a mim”.
  alternative: Traduzir ambos os casos por “obedecer”.
  rationale: Embora a obediência esteja implicada no contexto profético, “ouvir” conserva a amplitude semântica e a tensão do texto sem explicá-la de modo denominacional ou interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “ouvir a mim” mantém a ênfase e o paralelismo do original; as notas preservam as imagens hebraicas e alternativas lexicais genuínas.
