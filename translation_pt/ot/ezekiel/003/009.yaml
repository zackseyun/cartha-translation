base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/009.yaml
  text: Like diamond[a], harder than flint, I have made your forehead. Do not fear them, and do not be dismayed before them, for they are a rebellious house.
translation:
  language: pt
  text: Fiz a sua testa como um diamante[a], mais dura que a pederneira. Não tenha medo deles nem se apavore diante deles, pois são uma casa rebelde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «adamante, mais duro que a pederneira»; o hebraico שָׁמִיר pode designar uma pedra ou substância de extrema dureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמִיר
  choice: diamante
  rationale: No contexto de dureza e em comparação com a pederneira, designa uma pedra ou substância extremamente dura, não uma planta. “Diamante” comunica a imagem com clareza em português atual, sem eliminar a incerteza lexical, registrada em nota.
- source_word: חָזָק מִצֹּר
  choice: mais dura que a pederneira
  rationale: A construção comparativa expressa dureza superior à da pederneira. O feminino concorda naturalmente com “testa”, núcleo da declaração em português.
- source_word: צֹר
  choice: pederneira
  rationale: O substantivo se refere à pederneira ou a uma rocha muito dura. “Pederneira” preserva com precisão a imagem comparativa de dureza.
- source_word: מִצְחֶךָ
  choice: a sua testa
  rationale: O termo denota literalmente a testa e mantém a metáfora corporal de firmeza diante da oposição.
- source_word: לֹא תִירָא אוֹתָם
  choice: Não tenha medo deles
  rationale: Neste contexto de comissionamento, o imperfeito negado funciona como exortação ou garantia. Esta formulação é natural e clara em português.
- source_word: וְלֹא תֵחַת
  choice: nem se apavore
  rationale: O nifal de חתת pode indicar ficar quebrantado, aterrorizado ou consternado. “Apavorar-se” transmite aqui a intimidação emocional em paralelo com ter medo, sem recorrer a uma expressão pouco natural.
- source_word: מִפְּנֵיהֶם
  choice: diante deles
  rationale: Preserva o sentido espacial e relacional de estar perante a presença deles, adequado ao contexto de intimidação.
- source_word: בֵּית מְרִי
  choice: uma casa rebelde
  rationale: Mantém a designação coletiva e familiar recorrente em Ezequiel, em vez de reduzir interpretativamente “casa” a “povo”.
theological_decisions:
- issue: Designação coletiva de Israel na repreensão profética
  choice: uma casa rebelde
  alternative: um povo rebelde
  rationale: O hebraico emprega “casa” como designação corporativa significativa em Ezequiel. Preservá-la mantém a força familiar e pactual da expressão sem aplaná-la interpretativamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, mantendo a metáfora concreta da testa, a comparação com a pederneira e a expressão profética “casa rebelde”.
