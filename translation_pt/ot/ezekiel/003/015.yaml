base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/015.yaml
  text: Then I came to the exiles at Tel-abib[a], who were living by the Kebar River, where they were living; and I sat there among them for seven days, appalled.
translation:
  language: pt
  text: Então cheguei aos exilados em Tel-Abibe, que moravam junto ao rio Quebar, onde moravam. Sentei-me ali, no meio deles, por sete dias, estarrecido[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atônito”, “chocado” ou “devastado”. O termo hebraico descreve um estado de profundo abalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹלָה
  choice: os exilados
  rationale: O substantivo designa a comunidade deportada, não apenas a condição abstrata de exílio. “Os exilados” é claro, atual e adequado ao contexto.
- source_word: תֵּל אָבִיב
  choice: Tel-Abibe
  rationale: Mantém o topônimo antigo por transliteração, com forma aportuguesada, distinguindo-o da moderna cidade de Tel Aviv.
- source_word: הַיֹּשְׁבִים אֶל נְהַר כְּבָר
  choice: que moravam junto ao rio Quebar
  rationale: O particípio indica residência estabelecida; “moravam junto ao” expressa de modo natural a relação locativa. “Quebar” segue a transliteração portuguesa corrente do nome.
- source_word: וַאֲשֶׁר הֵמָּה יוֹשְׁבִים שָׁם
  choice: ali onde estavam estabelecidos
  rationale: A construção hebraica é difícil e repetitiva. A tradução conserva seu caráter retomativo e locativo sem acrescentar um verbo como “vi”, ausente do texto.
- source_word: וָאֵשֵׁב שָׁם
  choice: Fiquei sentado
  rationale: Preserva tanto a postura concreta de sentar-se quanto a ideia contextual de permanência, sem reduzir o verbo apenas a “fiquei”.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Forma idiomática e inequívoca de expressar duração em português.
- source_word: מַשְׁמִים
  choice: estarrecido
  rationale: O termo retrata um estado de choque, assombro ou devastação. “Estarrecido” comunica forte abalo e possível imobilidade, sem limitar o sentido à surpresa intelectual.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Expressão portuguesa natural que preserva a presença física de Ezequiel dentro do grupo.
theological_decisions: []
