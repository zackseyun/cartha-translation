base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/014.yaml
  text: And the Spirit lifted me up and took me away[a], and I went in bitterness, in the heat of my spirit[b], while the hand of Yahweh was strong upon me.
translation:
  language: pt
  text: E o Espírito me levantou e me levou, e fui, com amargura, no ardor do meu espírito[b], enquanto a mão de Yahweh era forte sobre mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A expressão “no ardor do meu espírito” também pode ser entendida como “na ira do meu espírito” ou “no furor do meu espírito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: o Espírito
  rationale: רוּחַ pode significar “espírito”, “vento” ou “sopro”. No contexto imediato de transporte visionário e profético, “o Espírito” é a leitura mais provável, sem eliminar as alternativas, registradas em nota.
- source_word: נְשָׂאַתְנִי וַתִּקָּחֵנִי
  choice: me levantou e me levou
  rationale: נשׂא preserva a imagem concreta de levantar, e לקח indica tomar ou levar. A combinação portuguesa é natural e não acrescenta a ideia mais forte de ser agarrado.
- source_word: וָאֵלֵךְ מַר
  choice: Fui amargurado
  rationale: הלך significa ir, e מַר descreve aqui o estado amargo do profeta. “Fui amargurado” mantém o movimento narrativo e expressa o estado interior sem especificar indevidamente sua causa.
- source_word: בַּחֲמַת רוּחִי
  choice: no ardor do meu espírito
  rationale: חֵמָה pode denotar calor, ardor, ira ou furor. “Ardor” conserva a metáfora e a ambiguidade entre intensa agitação e ira; “meu espírito” mantém a repetição de רוּחַ e o contraste com o Espírito no início.
- source_word: וְיַד יְהוָה עָלַי חָזָקָה
  choice: enquanto a mão de Yahweh pesava fortemente sobre mim
  rationale: A expressão “mão de Yahweh” preserva o conhecido idioma profético de poder ou compulsão divina. “Pesava fortemente sobre mim” comunica de modo natural a força exercida sobre o profeta, embora “era forte sobre mim” seja uma reprodução mais formal.
theological_decisions:
- issue: Referente do primeiro רוּחַ
  choice: o Espírito, entendido como o Espírito divino
  alternative: um espírito; o vento
  rationale: O contexto próximo descreve transporte visionário associado à revelação profética, favorecendo a referência divina. A nota preserva as possibilidades lexicais genuínas sem impor precisão doutrinária posterior.
- issue: Sentido de חֵמָה na reação do profeta
  choice: ardor
  alternative: ira; furor
  rationale: O hebraico permite tanto a imagem de calor interior quanto a emoção específica de ira. “Ardor” preserva essa tensão, e a nota informa as leituras mais explícitas.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, e “Yahweh” o representa diretamente em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação preserva a repetição de “Espírito/espírito”, a intensidade emocional ambígua e o idioma profético “a mão de Yahweh”.
