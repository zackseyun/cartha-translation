revisions:
- from: Então o Espírito me levantou e me levou[a]. Fui amargurado, no ardor do meu espírito[b], enquanto a mão de Yahweh pesava fortemente sobre mim.
  to: E o Espírito me levantou e me levou, e fui, com amargura, no ardor do meu espírito[b], enquanto a mão de Yahweh era forte sobre mim.
  rationale: A revisão restitui explicitamente o sentido de movimento de וָאֵלֵךְ, evitando a leitura passiva produzida por “Fui amargurado”. Também substitui a paráfrase “pesava fortemente” por uma formulação mais próxima da expressão hebraica “a mão de Yahweh era forte sobre mim”. A nota a foi removida porque, nesta redação, o marcador correspondente não ocorre; a nota b permanece ancorada no termo que explica.
