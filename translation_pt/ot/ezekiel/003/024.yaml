  text: וַ/תָּבֹא בִ֣/י ר֔וּחַ וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וַ/יְדַבֵּ֤ר אֹתִ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י בֹּ֥א הִסָּגֵ֖ר בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/024.yaml
  text: Then the Spirit entered into me and set me on my feet[a], and he spoke to me and said to me, “Go[b], shut yourself inside your house.”
translation:
  language: pt
  text: 'Então o Espírito entrou em mim[a] e me pôs de pé. Ele falou comigo e me disse: “Vá[b], tranque-se dentro de casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito entrou em mim”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico, literalmente: “Venha”. Neste contexto, “Vá” é mais natural em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֔וּחַ
  choice: o Espírito
  rationale: No contexto recorrente de capacitação profética em Ezequiel, o referente é mais provavelmente o Espírito divino. A ausência do artigo em hebraico não impede a determinação contextual; a alternativa indefinida é preservada em nota.
- source_word: וַ/תָּבֹא בִ֣/י
  choice: entrou em mim
  rationale: A construção בוא + ב com objeto pessoal indica entrada na pessoa e corresponde diretamente ao idioma recorrente do livro.
- source_word: וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י
  choice: me pôs de pé
  rationale: Preserva o valor causativo do hifil de עמד em português natural e atual.
- source_word: וַ/יְדַבֵּ֤ר אֹתִ/י֙
  choice: falou comigo
  rationale: A construção incomum com אֹתִי permite conservar a ideia de interação pessoal, sem perder o fato de que a fala é dirigida a Ezequiel.
- source_word: בֹּ֥א
  choice: Vá
  rationale: Embora o sentido lexical básico seja “vir”, aqui a ordem manda Ezequiel dirigir-se ao interior da própria casa; “vá” é o equivalente idiomático em português. A forma literal é registrada em nota.
- source_word: הִסָּגֵ֖ר
  choice: feche-se
  rationale: 'Expressa de modo conciso o valor reflexivo/passivo do imperativo nifal: Ezequiel deve recolher-se e permanecer encerrado.'
- source_word: בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ
  choice: dentro de sua casa
  rationale: Transmite naturalmente o sentido espacial de בְּתוֹךְ neste contexto, sem o literalismo pouco idiomático “no meio de sua casa”.
theological_decisions:
- issue: Identificação de רוּחַ
  choice: “o Espírito”, entendido contextualmente como o Espírito divino que capacita Ezequiel
  alternative: “um espírito”
  rationale: O contexto imediato e o padrão literário de Ezequiel favorecem a ação do Espírito de Deus, mas a forma hebraica sem artigo admite uma leitura indefinida, mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Me pôs de pé” preserva a causalidade em forma natural; “falou comigo e me disse” mantém a repetição semítica sem soar excessivamente rígida. Todos os marcadores de nota aparecem no texto.
