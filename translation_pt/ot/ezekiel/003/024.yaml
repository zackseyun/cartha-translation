  terminology: «o Espírito» é uma escolha contextual defensável em Ezequiel; a nota preserva a alternativa «um espírito». «Vá» é o equivalente idiomático apropriado para o imperativo hebraico בוא neste contexto, com a leitura literal registrada em nota.
