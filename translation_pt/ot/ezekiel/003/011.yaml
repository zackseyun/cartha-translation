  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֵ֨ךְ בֹּ֤א אֶל הַ/גּוֹלָה֙ אֶל בְּנֵ֣י עַמֶּ֔/ךָ וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/011.yaml
  text: And go[a], come to the exiles, to the sons of your people, and speak to them and say to them[b], ‘Thus says the Lord GOD,’ whether they hear or whether they refuse.
translation:
  language: pt
  text: 'Vá até os exilados, aos filhos do seu povo; fale com eles e diga-lhes: “Assim diz o Senhor Yahweh: quer eles ouçam, quer se recusem.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quer ouçam, quer cessem” ou “quer se abstenham”; no contexto, a segunda expressão indica que podem recusar-se a dar ouvidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֵךְ בֹּא
  choice: Vá, apresente-se
  rationale: Os dois imperativos de movimento são preservados sem o pouco natural “vá, venha”. “Apresente-se” expressa a chegada deliberada à comunidade destinatária, sem afirmar especificamente que Ezequiel deva entrar em algum recinto.
- source_word: הַגּוֹלָה
  choice: os exilados
  rationale: O substantivo designa coletivamente a comunidade deportada, não apenas a condição abstrata do exílio.
- source_word: בְּנֵי עַמֶּךָ
  choice: os filhos do seu povo
  rationale: Mantém a expressão hebraica de parentesco e sua forma masculina plural representativa, em português natural.
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם וְאָמַרְתָּ אֲלֵיהֶם
  choice: fale com eles e diga-lhes
  rationale: Preserva os dois verbos de fala e a força imperativa da sequência de instruções.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética tradicional, formal e clara em português.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição artificial “Senhor SENHOR”.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: quer eles ouçam, quer se recusem
  rationale: A construção apresenta alternativas. “Ouçam” mantém o campo semântico de שמע; “se recusem” comunica, neste contraste, o sentido contextual de חדל, literalmente cessar ou abster-se.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida preserva tanto o título quanto o nome próprio presentes no hebraico, sem transformar o nome em outro título.
- issue: Alcance da expressão masculina בְּנֵי עַמֶּךָ
  choice: os filhos do seu povo
  alternative: os membros do seu povo
  rationale: A tradução conserva a imagem de parentesco e a forma masculina do texto, entendida como expressão corporativa representativa, sem restringi-la explicitamente por interpretação adicional.
- issue: Resposta dos ouvintes em וְאִם יֶחְדָּלוּ
  choice: quer se recusem
  alternative: quer se abstenham
  rationale: No contraste com ouvir, a expressão indica recusa em dar ouvidos; a nota mantém visível a formulação mais literal e sua ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência com dois verbos de movimento e dois verbos de fala foi mantida, mas ajustada à naturalidade do português. O nome Yahweh foi preservado após o título “Senhor”.
