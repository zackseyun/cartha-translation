  source_fidelity: A tradução transmite adequadamente a comissão, os destinatários, a fórmula profética e a alternativa final. Contudo, “apresente-se” para בֹּא introduz a ideia de apresentar-se formalmente, que não está expressa no hebraico; o verbo significa vir/ir/chegar a, no contexto do deslocamento até os exilados.
  naturalness: O português é claro, moderno e de registro apropriado. “Vá até os exilados” é mais idiomático e semanticamente seguro do que “Vá, apresente-se aos exilados”. Também é preferível usar dois-pontos após a fórmula introdutória do discurso.
  terminology: “os exilados”, “os filhos do seu povo”, “Assim diz” e “o Senhor Yahweh” são escolhas adequadas. “Quer eles ouçam, quer se recusem” preserva bem a construção alternativa e o sentido contextual de חדל; a nota registra de modo útil as possibilidades mais literais.
  issues:
