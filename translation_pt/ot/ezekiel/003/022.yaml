reference: Ezekiel 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תְּהִ֥י עָלַ֛/י שָׁ֖ם יַד יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלַ֗/י ק֥וּם צֵא֙ אֶל הַ/בִּקְעָ֔ה וְ/שָׁ֖ם אֲדַבֵּ֥ר אוֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/022.yaml
  text: And there the hand of Yahweh was upon me[a], and he said to me, “Rise, go out to the valley[b], and there I will speak with you.”
translation:
  language: pt
  text: 'Ali a mão de Yahweh estava sobre mim, e ele me disse: “Levante-se, saia para o vale[a], e ali falarei com você[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a planície”.
    reason: lexical_alternative
  - marker: b
    text: Ou “falarei a você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עָלַי
  choice: estava sobre mim
  rationale: Preserva a imagem hebraica de uma influência ou ação divina que repousava sobre o profeta, sem acrescentar explicitamente a ideia ingressiva de que ela ‘veio’ sobre ele.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio locativo é mantido nas duas ocorrências para preservar a ênfase espacial do hebraico.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Mantém a metáfora profética concreta da mão divina, em vez de interpretá-la simplesmente como ‘poder’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר אֵלַי
  choice: e ele me disse
  rationale: Tradução direta e natural de אמר אֵלַי; o referente do pronome é Yahweh.
- source_word: קוּם
  choice: Levante-se
  rationale: Expressa de modo atual e claro a ordem de se pôr de pé, sem recorrer ao mais solene ‘Erga-se’.
- source_word: צֵא
  choice: saia
  rationale: Reproduz diretamente o movimento para fora indicado pelo verbo hebraico.
- source_word: הַבִּקְעָה
  choice: o vale
  rationale: בִּקְעָה designa um vale amplo ou uma planície rebaixada. ‘Vale’ é natural no contexto, enquanto ‘planície’ permanece uma alternativa lexical legítima.
- source_word: אֲדַבֵּר אוֹתָךְ
  choice: falarei com você
  rationale: Reflete a construção דבר + את e preserva a possibilidade de interação sugerida por ‘com’, sem excluir o sentido de Deus dirigir sua palavra ao profeta.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. ‘Yahweh’ preserva o nome pessoal divino em forma transliterada, sem substituí-lo por um título.
- issue: Sentido da expressão ‘mão de Yahweh’
  choice: manter a metáfora ‘a mão de Yahweh estava sobre mim’
  alternative: ‘o poder de Yahweh estava sobre mim’
  rationale: A formulação concreta do hebraico pode envolver poder, impulso ou domínio divino sobre o profeta; conservar a metáfora evita reduzir essa amplitude a uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de ‘ali’ conserva a estrutura espacial do original. ‘Ele’ permanece em minúscula segundo o uso narrativo corrente, e ‘você’ oferece uma forma amplamente compreensível para o singular dirigido ao profeta.
