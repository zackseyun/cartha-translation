  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֶּן אָדָ֕ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אוֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/017.yaml
  text: Son of man[a], I have made you a watchman for the house of Israel[b]; and you shall hear a word from my mouth and warn them from me.
translation:
  language: pt
  text: Filho do homem[a], eu fiz de você sentinela para a casa de Israel. Quando ouvir uma palavra da minha boca, advirta-os da minha parte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mortal” ou “Ser humano”. A expressão hebraica é uma forma recorrente de se dirigir a Ezequiel.
    reason: lexical_alternative
  - marker: b
    text: 'Mais formalmente: “Você ouvirá uma palavra da minha boca e os advertirá da minha parte”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma hebraica recorrente de Deus se dirigir a Ezequiel e mantém sua continuidade intertextual, sem convertê-la em uma designação genérica da humanidade.
- source_word: צֹפֶה
  choice: sentinela
  rationale: Designa alguém que vigia e dá o alerta; em português atual, preserva com clareza as duas funções presentes no contexto.
- source_word: נְתַתִּיךָ
  choice: eu fiz de você
  rationale: O sentido literal é ‘eu dei você’, mas, diante do predicativo ‘sentinela’, a expressão indica que Deus atribuiu essa função ao profeta. A formulação escolhida é natural e mantém o valor resultativo.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: A preposição marca a esfera ou o grupo em relação ao qual Ezequiel recebe sua incumbência. ‘Para’ é claro e não acrescenta a ideia específica de domínio implicada por ‘sobre’.
- source_word: וְשָׁמַעְתָּ
  choice: Quando ouvir
  rationale: 'No contexto da incumbência profética, introduz a ocasião em que Ezequiel deve agir: ao receber a palavra divina. A coordenação mais formal continua registrada em nota.'
- source_word: מִפִּי
  choice: da minha boca
  rationale: Mantém a imagem concreta do hebraico e ressalta que a comunicação procede diretamente de Deus.
- source_word: דָּבָר
  choice: uma palavra
  rationale: Reproduz o termo amplo para uma comunicação falada; ‘mensagem’ seria possível, mas menos próximo da forma hebraica.
- source_word: וְהִזְהַרְתָּ
  choice: advirta-os
  rationale: Expressa a incumbência de transmitir a advertência divina. O imperativo em português comunica naturalmente a obrigação decorrente de ouvir a palavra.
- source_word: אוֹתָם
  choice: os
  rationale: Retoma coletivamente os membros da casa de Israel.
- source_word: מִמֶּנִּי
  choice: da minha parte
  rationale: Indica que Deus é a fonte e autoridade da advertência. Esta formulação é mais idiomática em português que ‘de mim’, sem transformar o profeta na fonte da mensagem.
theological_decisions:
- issue: Força temporal ou coordenada da sequência da incumbência
  choice: Quando ouvir uma palavra da minha boca, advirta-os da minha parte
  alternative: Você ouvirá uma palavra da minha boca e os advertirá da minha parte
  rationale: 'A sequência verbal hebraica admite uma reprodução coordenada, mas, neste contexto instrutivo, também comunica a ocasião e a resposta exigida: ao ouvir, Ezequiel deve advertir. A nota conserva a alternativa mais formal e evita ocultar a ambiguidade.'
- issue: Manutenção da expressão בֶּן אָדָם
  choice: Filho do homem
  alternative: Mortal; ser humano
  rationale: Trata-se da forma recorrente de Deus se dirigir ao profeta. A expressão tradicional continua compreensível e preserva melhor a formulação hebraica e sua recorrência do que uma paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” evita formas excessivamente arcaicas; “sentinela” preserva a imagem funcional do texto. A divisão em duas frases torna a incumbência clara sem eliminar a relação lógica entre ouvir e advertir.
