source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנֵּ֨ה נָתְנ֤וּ עָלֶ֨י/ךָ֙ עֲבוֹתִ֔ים וַ/אֲסָר֖וּ/ךָ בָּ/הֶ֑ם וְ/לֹ֥א תֵצֵ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/025.yaml
  text: But you[a], son of man, behold, they will put ropes on you and bind you with them[b], so that you will not go out among them.
translation:
  language: pt
  text: Mas você, filho do homem, eis que porão cordas[a] sobre você e o amarrarão com elas, para que você não saia para o meio deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “laços” ou “ataduras”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no meio deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a forma de tratamento recorrente dirigida a Ezequiel e preserva a consistência literária do livro.
- source_word: הִנֵּה
  choice: eis que
  rationale: Conserva a função de chamar a atenção e o tom solene da fala profética em português natural e digno.
- source_word: נָתְנוּ
  choice: porão
  rationale: Embora a forma hebraica seja perfeita, o contexto profético favorece valor futuro. A terceira pessoa do plural mantém os agentes sem identificação.
- source_word: עֲבוֹתִים
  choice: cordas
  rationale: Designa com clareza os objetos usados para prender; é uma opção corrente e concreta em português.
- source_word: וַאֲסָרוּךָ
  choice: e o amarrarão
  rationale: Expressa diretamente o ato de prender com cordas, sem ampliar o sentido para 'aprisionar'.
- source_word: בָּהֶם
  choice: com elas
  rationale: 'Representa o valor instrumental mais natural: as cordas são o meio usado para amarrá-lo.'
- source_word: וְלֹא תֵצֵא
  choice: para que você não saia
  rationale: Explicita a relação de finalidade ou resultado sugerida pela sequência, sem afirmar incapacidade absoluta.
- source_word: בְּתוֹכָם
  choice: para o meio deles
  rationale: Com o verbo de movimento, transmite que Ezequiel não sairá para estar no meio do povo, sem inverter a direção como faria 'do meio deles'.
theological_decisions:
- issue: Identidade do sujeito plural não expresso
  choice: 'Mantido como terceira pessoa do plural indeterminada: ''porão'' e ''amarrarão''.'
  alternative: Especificar os agentes como o povo, agentes de Deus ou recorrer a uma construção passiva.
  rationale: O hebraico não identifica quem realiza a ação; a tradução preserva essa ambiguidade em vez de decidir entre agência humana e divina.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. O tratamento por “você” é natural para o leitor comum, enquanto “filho do homem” e “eis que” preservam a solenidade e a continuidade literária. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
