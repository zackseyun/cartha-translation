  language: pt
  text: Pois você não está sendo enviado a um povo de fala obscura e língua difícil[a], mas à casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “profundos de lábio e pesados de língua”, expressão hebraica para uma fala difícil de entender.
