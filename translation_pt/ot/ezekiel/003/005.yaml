lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da comissão anterior e preserva naturalmente o valor causal-explicativo.
- source_word: עַם
  choice: um povo
  rationale: Designa aqui um grupo humano e linguístico, não necessariamente um Estado político.
- source_word: עִמְקֵי שָׂפָה
  choice: de fala obscura
  rationale: Expressa de modo claro o idioma hebraico, literalmente «profundos de lábio», que descreve uma fala difícil de compreender.
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: e língua difícil
  rationale: Traduz o sentido idiomático de «pesados de língua», mantendo o paralelismo com a expressão anterior.
- source_word: אַתָּה שָׁלוּחַ
  choice: você não está sendo enviado
  rationale: O pronome singular dirige-se a Ezequiel, e o particípio passivo predicativo se encaixa na cena presente de envio.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a designação profética tradicional e sua nuance coletiva e pactual.
