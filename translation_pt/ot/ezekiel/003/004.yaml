  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֗ם לֶךְ בֹּא֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל וְ/דִבַּרְתָּ֥ בִ/דְבָרַ֖/י אֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/004.yaml
  text: Then he said to me[a], “Son of man, go to the house of Israel and speak my words to them.”
translation:
  language: pt
  text: 'Então ele me disse: “Filho do homem[a], vá, dirija-se à casa de Israel e fale-lhes as minhas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mortal” ou “ser humano”. A expressão hebraica é a forma recorrente de tratamento dirigida a Ezequiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma do recorrente modo de Deus se dirigir a Ezequiel, sem substituir a expressão por uma interpretação como “mortal”.
- source_word: לֶךְ בֹּא
  choice: vá à
  rationale: Os dois imperativos hebraicos formam aqui uma expressão de movimento cujo sentido natural em português é “vá à”; reproduzi-los mecanicamente como “vá, venha” seria confuso e sugeriria direções opostas.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: à casa de Israel
  rationale: Mantém a expressão profética e sua referência coletiva ao povo de Israel.
- source_word: וְדִבַּרְתָּ
  choice: e fale
  rationale: A forma verbal após os imperativos comunica uma instrução consequente, adequadamente expressa pelo imperativo em português.
- source_word: בִּדְבָרַי
  choice: as minhas palavras
  rationale: Representa diretamente דְבָרַי e trata a preposição ב como complemento da ação de falar, sem parafrasear como “minha mensagem”.
- source_word: אֲלֵיהֶם
  choice: a eles
  rationale: Retoma de modo claro a casa de Israel, entendida coletivamente como o povo.
theological_decisions:
- issue: Sentido de אָדָם na expressão בֶּן אָדָם
  choice: Filho do homem
  alternative: mortal; ser humano
  rationale: A tradução conserva o idioma hebraico e o título recorrente aplicado a Ezequiel, sem importar automaticamente o uso cristológico posterior; a nota registra alternativas sem resolver em excesso a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se “casa de Israel” por seu valor profético e pactual. A colocação “a eles” evita a ambiguidade regional que “lhes fale” poderia criar e mantém explícito o destinatário.
