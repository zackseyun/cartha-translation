source:
  edition: WLC
  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וָ/אֶשְׁמַ֣ע אַחֲרַ֔/י ק֖וֹל רַ֣עַשׁ גָּד֑וֹל בָּר֥וּךְ כְּבוֹד יְהוָ֖ה מִ/מְּקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/012.yaml
  text: 'Then the Spirit lifted me up, and I heard behind me a sound of a great rumbling: “Blessed be the glory of the LORD from his place.”'
translation:
  language: pt
  text: 'Então o Espírito[a] me levantou, e ouvi atrás de mim o som de um grande estrondo: “Bendita seja a glória do SENHOR, desde o seu lugar!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica também pode significar “vento” ou “sopro”.
    reason: Preserva a amplitude semântica de רוּחַ, embora o contexto favoreça “Espírito”.
lexical_decisions:
- source_word: רוּחַ (rûaḥ)
  choice: o Espírito
  rationale: No contexto das visões de Ezequiel, designa a força pessoal que move o profeta; a nota preserva o campo semântico hebraico, que também inclui “vento” e “sopro”.
- source_word: קוֹל רַעַשׁ גָּדוֹל (qôl raʿaš gādôl)
  choice: o som de um grande estrondo
  rationale: Expressa naturalmente em português um ruído intenso e retumbante, sem especificar além do hebraico a sua causa.
- source_word: יְהוָה (YHWH)
  choice: SENHOR
  rationale: Segue a convenção bíblica portuguesa de representar o nome divino por SENHOR em versaletes.
- source_word: מִמְּקוֹמוֹ (mimməqômô)
  choice: desde o seu lugar
  rationale: Mantém a preposição hebraica “desde/de” e a referência pronominal sem transformar “lugar” explicitamente em morada, templo ou trono.
theological_decisions:
- issue: Identidade de רוּחַ
  choice: Espírito, com inicial maiúscula
  alternative: vento; sopro; espírito
  rationale: A atuação de levantar e transportar o profeta favorece a referência ao Espírito divino no contexto de Ezequiel, mas a nota registra a ambiguidade lexical real.
- issue: Sentido da aclamação sobre a glória do SENHOR
  choice: “Bendita seja a glória do SENHOR, desde o seu lugar!”
  alternative: “Bendita é a glória do SENHOR em seu lugar!”
  rationale: A formulação optativa é idiomática para בָּרוּךְ e “desde” preserva מִן, evitando eliminar a tensão da expressão incomum.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Grande estrondo” comunica o impacto auditivo da visão; “desde o seu lugar” conserva de propósito a formulação incomum do hebraico.
