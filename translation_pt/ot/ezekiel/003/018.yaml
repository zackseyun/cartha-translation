source:
  edition: WLC
  text: בְּ/אָמְרִ֤/י לָֽ/רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א הִזְהַרְתּ֗/וֹ וְ/לֹ֥א דִבַּ֛רְתָּ לְ/הַזְהִ֥יר רָשָׁ֛ע מִ/דַּרְכּ֥/וֹ הָ/רְשָׁעָ֖ה לְ/חַיֹּת֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/018.yaml
  text: When I say to the wicked man[a], ‘You shall surely die,’ and you do not warn him, and you do not speak to warn the wicked man from his wicked way so that he may live, that wicked man shall die in his iniquity[b], but I will require his blood from your hand.
translation:
  language: pt
  text: 'Quando eu disser ao perverso: “Você certamente morrerá”, e você não o advertir nem lhe falar para adverti-lo a deixar seu caminho perverso, para que viva, esse perverso morrerá em sua iniquidade[a], mas exigirei da sua mão o sangue dele[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Em sua iniquidade” também pode ser traduzido como “por sua iniquidade” ou “por causa do seu pecado”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pedirei contas a você pelo sangue dele”. Mais literalmente, o hebraico diz: “exigirei da sua mão o sangue dele”, expressão judicial que indica responsabilidade por sua morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Quando eu disser
  rationale: A preposição בְּ com a forma verbal introduz uma oração temporal. A formulação é natural em português e conserva essa relação temporal.
- source_word: לָרָשָׁע
  choice: ao perverso
  rationale: רָשָׁע designa uma pessoa culpada ou perversa. O masculino singular do caso individual é preservado sem acrescentar o substantivo “homem”, desnecessário em português.
- source_word: מוֹת תָּמוּת
  choice: Você certamente morrerá
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a certeza da morte. “Certamente morrerá” transmite essa força de modo atual e solene.
- source_word: הִזְהַרְתּוֹ
  choice: o advertir
  rationale: O hifil de זהר significa dar aviso ou advertência. “Advertir” é preciso e adequado ao registro.
- source_word: דִבַּרְתָּ לְהַזְהִיר
  choice: falar para advertir
  rationale: 'Preserva tanto o ato de falar quanto a finalidade expressa pelo infinitivo: a omissão consiste em não falar com o propósito de advertir.'
- source_word: מִדַּרְכּוֹ הָרְשָׁעָה
  choice: contra o seu caminho perverso
  rationale: דֶּרֶךְ é a metáfora de conduta. “Contra” expressa em português o objeto da advertência sem inserir explicitamente uma ordem de abandonar o caminho, e “perverso” mantém o vínculo com a raiz רשע.
- source_word: לְחַיֹּתוֹ
  choice: a fim de que ele viva
  rationale: A construção expressa propósito ou resultado. A tradução não restringe “viver” à dimensão física nem à espiritual.
- source_word: הוּא רָשָׁע
  choice: esse perverso
  rationale: A formulação retoma enfaticamente a pessoa mencionada e preserva a repetição retórica de רָשָׁע.
- source_word: בַּעֲוֺנוֹ
  choice: em sua iniquidade
  rationale: Mantém a possível ideia de condição ou circunstância associada à preposição בְּ, sem excluir a leitura causal.
- source_word: דָּמוֹ
  choice: o sangue dele
  rationale: Conserva a imagem concreta, judicial e pactual do sangue, em vez de substituí-la diretamente por uma paráfrase de responsabilidade.
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  choice: requererei ... da sua mão
  rationale: Preserva o idioma judicial hebraico de exigir da mão de alguém aquilo pelo qual essa pessoa deve responder; a nota esclarece o sentido.
theological_decisions:
- issue: Natureza da linguagem de morte e vida
  choice: Traduzir simplesmente como “morrerá” e “viva”
  alternative: Especificar morte e vida exclusivamente físicas ou exclusivamente espirituais
  rationale: O hebraico não delimita aqui uma única dimensão. A tradução conserva a tensão moral e pactual sem impor uma interpretação mais estreita.
- issue: Valor de בַּעֲוֺנוֹ
  choice: “em sua iniquidade”
  alternative: “por causa de sua iniquidade” ou “por seu pecado”
  rationale: A opção principal preserva a ambiguidade da preposição בְּ entre condição, esfera e possível causa, enquanto a nota registra as alternativas legítimas.
- issue: Responsabilidade do sentinela na expressão do sangue
  choice: Manter o idioma “requererei o sangue dele da sua mão”
  alternative: Explicitar “pedirei contas a você pela morte dele”
  rationale: A imagem judicial do original é teologicamente significativa e deve permanecer no texto; seu sentido de responsabilização é esclarecido em nota.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e compreensão internacional. Emprega “você” para deixar clara a mudança entre o perverso advertido e o sentinela interpelado. Mantém as repetições de “perverso”, a linguagem direta de morrer/viver e a imagem jurídica do sangue exigido da mão.
