  terminology: '"Perverso", "iniquidade", "sangue" e "mão" são escolhas adequadas e consistentes. "Exigirei da sua mão o sangue dele" mantém o idioma judicial hebraico, mas tem ordem mais natural em português do que "requererei o sangue dele da sua mão".'
