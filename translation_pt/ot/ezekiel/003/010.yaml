base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/010.yaml
  text: Then he said to me[a], “Son of man, receive in your heart all my words that I speak to you, and hear with your ears.”
translation:
  language: pt
  text: 'Então ele me disse: “Filho do homem, receba em seu coração todas as minhas palavras que eu lhe disser e ouça com os seus ouvidos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma recorrente de tratamento dirigida a Ezequiel e o masculino representativo do hebraico, sem substituí-la por interpretações como “mortal” ou “ser humano”.
- source_word: אֶת כָּל דְּבָרַי
  choice: todas as palavras
  rationale: Mantém a ênfase concreta nas palavras divinas, que são o objeto tanto da acolhida interior quanto da audição.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: que eu lhe disser
  rationale: O imperfeito hebraico admite força presente ou futura; esta formulação natural em português expressa as palavras que Deus comunicará ao profeta sem restringir indevidamente seu aspecto.
- source_word: קַח בִּלְבָבְךָ
  choice: acolha no coração
  rationale: Embora קַח signifique literalmente “tome”, neste contexto indica recepção e apropriação interior. “Acolha” comunica esse sentido naturalmente, enquanto “no coração” preserva a antropologia bíblica do ser interior.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: e ouça com os próprios ouvidos
  rationale: Conserva a expressão corporal e enfática do hebraico. “Próprios” torna idiomática em português a referência explícita aos ouvidos sem eliminar sua força.
theological_decisions:
- issue: Tradução de אָדָם na fórmula בֶּן אָדָם
  choice: Filho do homem
  alternative: mortal; ser humano
  rationale: A forma literal preserva o tratamento característico de Ezequiel e não impõe nem exclui associações teológicas posteriores; no contexto imediato, identifica a condição humana do profeta diante de Deus.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira ampla. A ordem foi ajustada à sintaxe natural do português, mantendo o paralelismo entre acolher interiormente e ouvir de modo atento.
