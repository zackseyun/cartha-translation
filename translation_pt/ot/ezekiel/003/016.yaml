  text: And at the end of seven days[a], the word of Yahweh came to me, saying[b],
translation:
  language: pt
  text: 'Ao fim de sete dias, a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִקְצֵה
  choice: Ao fim de
  rationale: A fórmula narrativa com וַיְהִי faz a narrativa avançar, enquanto מִקְצֵה assinala o término do período. Em português, “Ao fim de” comunica ambos de modo natural, sem a rigidez de “E aconteceu ao fim de”.
- source_word: שִׁבְעַת יָמִים
  choice: sete dias
  rationale: Tradução direta da construção numeral mais substantivo.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e a relação construta do hebraico, entendida como a mensagem procedente de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Equivalente direto e idiomático da preposição com sufixo da primeira pessoa do singular.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso divino subsequente e deixa a frase aberta para o versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino. “Yahweh” o representa diretamente e evita trocar o nome por um título.
- issue: Sentido de דְבַר יְהוָה
  choice: a palavra de Yahweh
  alternative: uma palavra vinda de Yahweh
  rationale: A tradução formal preserva a fórmula profética consagrada, sem excluir o sentido de uma mensagem procedente de Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura foi suavizada de acordo com o uso narrativo de וַיְהִי, e “dizendo” conserva a ligação sintática com o discurso do versículo seguinte.
