  text: and the sound of the wings of the living creatures touching one another[a], and the sound of the wheels beside them[c][b], and the sound of a great rumbling.
translation:
  language: pt
  text: e o som das asas dos seres viventes, que se tocavam umas às outras[a], e o som das rodas ao lado deles[b], e o som de um grande estrondo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tocando, cada uma à sua irmã” — expressão idiomática hebraica que, neste contexto, indica reciprocidade entre as asas.
    reason: lexical_alternative
  - marker: b
    text: Ou “em posição oposta a eles”.
    reason: lexical_alternative
  - marker: c
    text: Ou “um grande ruído” ou “um forte retumbar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: som
  rationale: O termo pode significar voz, som ou ruído. Aqui introduz três elementos auditivos da visão, sem indicar fala; por isso, “som” preserva sua amplitude e permite a repetição do hebraico.
- source_word: כַּנְפֵי
  choice: asas
  rationale: O plural em construção designa claramente as asas pertencentes aos seres viventes.
- source_word: הַחַיּוֹת
  choice: os seres viventes
  rationale: No contexto da visão de Ezequiel, refere-se aos seres celestiais animados. “Seres viventes” é claro, digno e não define além do texto a identidade deles.
- source_word: מַשִּׁיקוֹת
  choice: tocando
  rationale: A forma verbal descreve contato ou junção. No contexto das asas, “tocando” comunica a imagem naturalmente, sem a conotação enganosa de uma tradução como “beijando”.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: umas nas outras
  rationale: A expressão idiomática, literalmente “uma mulher à sua irmã”, indica relação mútua entre elementos femininos, aqui as asas. A formulação portuguesa mantém a reciprocidade sem sugerir pessoas do sexo feminino.
- source_word: הָאוֹפַנִּים
  choice: as rodas
  rationale: Na visão do trono em Ezequiel, o termo designa as rodas associadas aos seres viventes.
- source_word: לְעֻמָּתָם
  choice: ao lado deles
  rationale: A locução indica a posição das rodas em relação aos seres viventes. “Ao lado deles” é natural no contexto, embora “diante deles” ou “em frente deles” também seja lexicalmente possível.
- source_word: רַעַשׁ גָּדוֹל
  choice: um grande estrondo
  rationale: רַעַשׁ pode descrever tremor, ruído tumultuoso ou forte retumbar. “Grande estrondo” transmite a potência sonora da cena sem afirmar especificamente um terremoto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “e o som” reproduz a estrutura auditiva enfática do hebraico. “Seres viventes” mantém a continuidade terminológica da visão sem acrescentar uma identificação teológica.
