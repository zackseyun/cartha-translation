source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְק/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל וְ/נָתַתִּ֥י מִכְשׁ֛וֹל לְ/פָנָ֖י/ו ה֣וּא יָמ֑וּת כִּ֣י לֹ֤א הִזְהַרְתּ/וֹ֙ בְּ/חַטָּאת֣/וֹ יָמ֔וּת וְ/לֹ֣א תִזָּכַ֗רְןָ צִדְקֹתָ/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/020.yaml
  text: And when a righteous man turns from his righteousness and does injustice[a], and I place a stumbling block before him, he will die. Because you did not warn him, he will die in his sin, and his righteous deeds that he did will not be remembered[d][c][b]; and I will require his blood from your hand.
translation:
  language: pt
  text: Mas, quando um justo se desviar da sua justiça e praticar a injustiça[a], e eu puser diante dele uma pedra de tropeço[b], ele morrerá. Visto que você não o advertiu, ele morrerá no seu pecado, e os atos de justiça que praticou não serão lembrados[c]; e eu requererei da sua mão o sangue dele[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cometer perversidade” ou “fazer o que é errado”. O termo hebraico abrange injustiça e transgressão moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um obstáculo”. O hebraico diz literalmente “uma pedra de tropeço”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “as suas obras justas não serão lembradas”.'
    reason: lexical_alternative
  - marker: d
    text: Isto é, Deus pedirá contas ao sentinela pelo sangue derramado desse homem.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: Mas, quando ... se desviar
  rationale: A construção introduz uma circunstância temporal com sentido condicional. “Quando ... se desviar” é natural em português; “mas” expressa adequadamente o contraste com o caso anterior no contexto imediato.
- source_word: צַדִּיק
  choice: um justo
  rationale: O adjetivo masculino singular é substantivado. “Um justo” preserva a forma singular e é corrente no registro bíblico moderno.
- source_word: מִצִּדְקוֹ
  choice: da sua justiça
  rationale: Mantém o substantivo abstrato e sua possível referência tanto à condição quanto à conduta justa, sem restringi-lo indevidamente.
- source_word: וְעָשָׂה עָוֶל
  choice: e praticar a injustiça
  rationale: עָוֶל abrange injustiça, perversidade e ação errada. “Praticar a injustiça” conserva seu peso moral e judicial em português natural.
- source_word: וְנָתַתִּי מִכְשׁוֹל לְפָנָיו
  choice: e eu puser diante dele uma pedra de tropeço
  rationale: Preserva a metáfora concreta de מִכְשׁוֹל e atribui explicitamente a ação a Deus, como no hebraico.
- source_word: הוּא יָמוּת
  choice: ele morrerá
  rationale: Reproduz a declaração enfática de consequência sem acrescentar interpretação.
- source_word: כִּי לֹא הִזְהַרְתּוֹ
  choice: Visto que você não o advertiu
  rationale: כִּי tem aqui força causal. “Visto que” liga naturalmente a falta de advertência ao juízo e à responsabilidade do sentinela.
- source_word: בְּחַטָּאתוֹ
  choice: no seu pecado
  rationale: Conserva o idioma profético que apresenta o pecado como a condição ou esfera em que ele morre.
- source_word: וְלֹא תִזָּכַרְןָ צִדְקֹתָיו אֲשֶׁר עָשָׂה
  choice: e os atos de justiça que praticou não serão lembrados
  rationale: O plural צִדְקֹתָיו aponta para manifestações concretas de justiça. “Atos de justiça” comunica essa pluralidade sem reduzir a expressão a mérito teológico.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: e eu requererei da sua mão o sangue dele
  rationale: Preserva a imagem jurídica hebraica de sangue exigido da mão do responsável, deixando a nota explicar o sentido de prestação de contas.
theological_decisions:
- issue: Deus põe uma pedra de tropeço diante do justo que se desviou
  choice: Manter a afirmação direta da agência divina e a metáfora da pedra de tropeço.
  alternative: Interpretar como simples consequência providencial ou como obstáculo destinado explicitamente a fazê-lo cair.
  rationale: O hebraico atribui a ação a Deus, mas não explica neste versículo a natureza exata da pedra de tropeço. A tradução conserva essa tensão sem a resolver.
- issue: Os atos justos anteriores não serão lembrados
  choice: Traduzir literalmente a não recordação dos atos de justiça no contexto do juízo.
  alternative: Explicar como perda da salvação, perda de posição na aliança ou mera advertência retórica.
  rationale: O texto afirma que os atos anteriores não serão lembrados, mas não formula aqui uma doutrina sistemática sobre perseverança ou apostasia.
- issue: Responsabilidade do sentinela pelo sangue
  choice: Conservar a expressão figurada “requererei da sua mão o sangue dele”.
  alternative: Substituir no texto principal por “pedirei contas a você pela morte dele”.
  rationale: A formulação concreta preserva a linguagem judicial e teológica do hebraico; a nota esclarece seu sentido sem eliminar a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para a interpelação singular a Ezequiel, evita arcaísmos desnecessários e conserva imagens hebraicas teologicamente relevantes. Os marcadores aparecem no texto em ordem [a]–[d].
