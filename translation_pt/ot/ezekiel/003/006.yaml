  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֣א אֶל עַמִּ֣ים רַבִּ֗ים עִמְקֵ֤י שָׂפָה֙ וְ/כִבְדֵ֣י לָשׁ֔וֹן אֲשֶׁ֥ר לֹֽא תִשְׁמַ֖ע דִּבְרֵי/הֶ֑ם אִם לֹ֤א אֲלֵי/הֶם֙ שְׁלַחְתִּ֔י/ךָ הֵ֖מָּה יִשְׁמְע֥וּ אֵלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/006.yaml
  text: not to many peoples of obscure speech and difficult language[a], whose words you cannot understand; surely, if I had sent you to them, they would listen to you.
translation:
  language: pt
  text: não a muitos povos de fala obscura e língua difícil[a], cujas palavras você não consegue entender; certamente, se eu tivesse enviado você a eles, eles lhe dariam ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “profundos de lábios e pesados de língua”, expressão hebraica para uma fala difícil de entender.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: Preserva a pluralidade étnica ou nacional de עַמִּים sem restringir o termo a Estados ou nações políticas.
- source_word: עִמְקֵי שָׂפָה
  choice: de fala obscura
  rationale: 'Comunica de modo natural o sentido do hebraísmo literal “profundos de lábios”: uma fala difícil de compreender.'
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: e língua difícil
  rationale: Traduz o hebraísmo “pesados de língua” como referência a um idioma difícil, mantendo o paralelismo com “fala obscura”.
- source_word: אֲשֶׁר לֹא תִשְׁמַע דִּבְרֵיהֶם
  choice: cujas palavras você não consegue entender
  rationale: Neste contexto de idiomas estrangeiros, שׁמע indica compreensão, não apenas percepção auditiva.
- source_word: אִם לֹא
  choice: certamente, se
  rationale: Representa a força asseverativa da construção condicional, em vez de reproduzir literalmente “se não”.
- source_word: שְׁלַחְתִּיךָ
  choice: se eu tivesse enviado você
  rationale: Expressa naturalmente em português a hipótese contrafactual ou enfática indicada pelo perfeito neste contexto condicional.
- source_word: הֵמָּה יִשְׁמְעוּ אֵלֶיךָ
  choice: eles lhe dariam ouvidos
  rationale: A locução preserva o sentido de escutar com receptividade, sem tornar explícita a ideia mais forte de obedecer.
theological_decisions:
- issue: Grau de receptividade expresso por שׁמע אֶל
  choice: lhe dariam ouvidos
  alternative: obedeceriam a você
  rationale: O hebraico implica escuta receptiva, mas não exige que se explicite obediência; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” mantém tratamento direto e natural; “lhe dariam ouvidos” conserva um tom bíblico acessível e a ideia de resposta receptiva.
