  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְשֽׁוֹנְ/ךָ֙ אַדְבִּ֣יק אֶל חִכֶּ֔/ךָ וְ/נֶֽאֱלַ֔מְתָּ וְ/לֹא תִֽהְיֶ֥ה לָ/הֶ֖ם לְ/אִ֣ישׁ מוֹכִ֑יחַ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/026.yaml
  text: And I will make your tongue cling to the roof of your mouth[a], and you will be mute and will not be for them a man who rebukes[d][c][b], for they are a rebellious house.
translation:
  language: pt
  text: Farei sua língua grudar no céu da boca[a]; você ficará sem fala[b] e não será para eles um homem que os repreenda[c], pois eles são uma casa rebelde[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no seu palato”.
    reason: lexical_alternative
  - marker: b
    text: Ou “você será silenciado” ou “ficará incapaz de falar”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “um homem que repreende”; isto é, alguém que os censura ou corrige.'
    reason: lexical_alternative
  - marker: d
    text: “Casa rebelde” é uma expressão frequente em Ezequiel para o povo considerado coletivamente como uma casa em rebelião.
    reason: cultural_note
lexical_decisions:
- source_word: אַדְבִּיק
  choice: Farei... grudar
  rationale: 'O hifil de דבק tem força causativa: Deus fará a língua de Ezequiel aderir. A formulação é natural em português e preserva a causalidade.'
- source_word: לְשׁוֹנְךָ
  choice: sua língua
  rationale: Mantém a imagem corporal concreta, central à restrição de fala imposta ao profeta.
- source_word: אֶל חִכֶּךָ
  choice: no céu da boca
  rationale: חֵךְ pode designar o palato; “céu da boca” é a expressão corrente e clara em português.
- source_word: נֶאֱלַמְתָּ
  choice: você ficará sem fala
  rationale: Expressa o estado resultante de incapacidade de falar sem recorrer ao substantivo potencialmente estigmatizante “mudo”.
- source_word: לֹא תִהְיֶה לָהֶם
  choice: não será para eles
  rationale: Preserva a construção existencial e relacional do hebraico sem explicá-la em excesso.
- source_word: לְאִישׁ
  choice: um homem
  rationale: Mantém o masculino singular, que se refere especificamente ao profeta Ezequiel.
- source_word: מוֹכִיחַ
  choice: que os repreenda
  rationale: O particípio hifil de יכח indica quem censura, adverte ou corrige; “repreenda” conserva a força confrontadora do ministério profético.
- source_word: בֵּית מְרִי
  choice: uma casa rebelde
  rationale: Preserva a expressão característica de Ezequiel, na qual o povo é concebido coletivamente como uma casa em rebelião.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo claro e conciso a razão da restrição imposta ao profeta.
theological_decisions:
- issue: Natureza da incapacidade de Ezequiel para falar
  choice: Uma restrição divina da fala, apresentada por meio de imagem corporal concreta.
  alternative: Um silenciamento puramente metafórico ou mera incapacidade social de persuadir.
  rationale: A língua grudada ao céu da boca aponta para uma incapacidade imposta por Deus. A tradução mantém a concretude sem definir além do que o versículo afirma.
- issue: Sentido de בֵּית מְרִי
  choice: casa rebelde
  alternative: povo rebelde
  rationale: “Casa” conserva tanto a linguagem corporativa quanto a textura profética característica do livro, sem reduzir a expressão a uma paráfrase.
- issue: Linguagem masculina em לְאִישׁ
  choice: um homem
  alternative: alguém ou uma pessoa
  rationale: O referente é especificamente Ezequiel; portanto, o masculino é contextualmente preciso, não apenas genérico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas acompanha os respectivos termos no texto. A formulação conserva as imagens concretas e a expressão profética hebraica, evitando paráfrase denominacional.
