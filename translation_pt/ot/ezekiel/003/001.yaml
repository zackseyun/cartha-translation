  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם אֵ֥ת אֲשֶׁר תִּמְצָ֖א אֱכ֑וֹל אֱכוֹל֙ אֶת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את וְ/לֵ֥ךְ דַּבֵּ֖ר אֶל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/001.yaml
  text: Then he said to me[a], “Son of man, eat what you find; eat this scroll, and go, speak to the house of Israel.”
translation:
  language: pt
  text: 'Então ele me disse: “Filho do homem, coma o que você encontrar[a]; coma este rolo, vá e fale à casa de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que você encontrar, coma”. A expressão hebraica admite essa disposição das palavras; em ambos os casos, Ezequiel deve consumir aquilo que lhe é apresentado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: “Então” expressa com naturalidade o avanço da narrativa marcado pelo waw consecutivo, sem tornar a ligação excessivamente literal.
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a imagem e a forma tradicional do vocativo hebraico em Ezequiel, no qual o profeta é identificado como ser humano.
- source_word: אֵת אֲשֶׁר תִּמְצָא
  choice: o que você encontrar
  rationale: É uma tradução natural e próxima da construção hebraica, sem especificar além do texto aquilo que foi posto diante de Ezequiel.
- source_word: אֱכֹל אֱכוֹל
  choice: coma ... coma
  rationale: A repetição dos imperativos no texto traduzido mantém a insistência do hebraico e a sequência entre a ordem geral e a referência específica ao rolo.
- source_word: מְגִלָּה
  choice: rolo
  rationale: Designa com precisão o suporte antigo de escrita e é claro no contexto bíblico.
- source_word: וְלֵךְ
  choice: vá
  rationale: Mantém o imperativo simples de movimento e a progressão das ordens.
- source_word: דַּבֵּר
  choice: fale
  rationale: Equivale diretamente ao verbo hebraico e evita acrescentar a força interpretativa de “proclame” ou “declare”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Conserva o modo coletivo e pactual de designar Israel, sem substituí-lo pela paráfrase “povo de Israel”.
theological_decisions:
- issue: Sentido de אָדָם no vocativo בֶּן אָדָם
  choice: homem
  alternative: ser humano
  rationale: “Filho do homem” conserva o idioma hebraico característico de Ezequiel e sua ênfase na condição humana do profeta, sem introduzir uma identificação cristológica que o contexto imediato não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” torna explícito o sujeito dos imperativos sem perder a solenidade; “casa de Israel” preserva o idioma bíblico do original.
