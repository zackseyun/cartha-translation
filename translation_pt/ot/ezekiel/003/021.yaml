  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֞ה כִּ֧י הִזְהַרְתּ֣/וֹ צַדִּ֗יק לְ/בִלְתִּ֥י חֲטֹ֛א צַדִּ֖יק וְ/ה֣וּא לֹא חָטָ֑א חָי֤וֹ יִֽחְיֶה֙ כִּ֣י נִזְהָ֔ר וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/021.yaml
  text: But if you warn a righteous man not to sin[a], and he does not sin, he will surely live because he took warning, and you will have delivered your life.
translation:
  language: pt
  text: Mas, se você advertir o justo para que não peque, e ele não pecar, certamente viverá, porque acolheu a advertência[a]; e você terá livrado a sua própria vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porque foi advertido” ou “porque deu ouvidos à advertência”. O verbo hebraico pode enfatizar tanto o recebimento da advertência quanto a resposta a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: se
  rationale: 'Após וְאַתָּה, introduz a condição e corresponde ao cenário paralelo do contexto: “se você advertir”.'
- source_word: הִזְהַרְתּוֹ
  choice: você advertir
  rationale: O Hifil de זהר significa advertir ou alertar. O futuro do subjuntivo é natural em português depois de “se”.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado masculino singular designa o homem justo considerado no caso condicional. “O justo” é natural e mantém o gênero gramatical do referente.
- source_word: לְבִלְתִּי חֲטֹא
  choice: para que não peque
  rationale: 'A construção infinitiva expressa finalidade ou prevenção: a advertência visa impedir que o justo peque.'
- source_word: וְהוּא לֹא חָטָא
  choice: e ele não pecar
  rationale: No período condicional, o futuro do subjuntivo comunica naturalmente a condição geral expressa pelo perfeito hebraico.
- source_word: חָיוֹ יִחְיֶה
  choice: certamente viverá
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a afirmação; “certamente” preserva essa ênfase.
- source_word: נִזְהָר
  choice: acolheu a advertência
  rationale: O Nifal de זהר pode destacar tanto o recebimento da advertência quanto a resposta a ela. Esta formulação comunica uma resposta positiva sem esconder a amplitude lexical, registrada em nota.
- source_word: נַפְשְׁךָ
  choice: a sua própria vida
  rationale: נֶפֶשׁ refere-se aqui à vida da pessoa, não necessariamente a uma alma imaterial. “Própria” esclarece o contraste com a vida do justo.
- source_word: הִצַּלְתָּ
  choice: terá livrado
  rationale: O Hifil de נצל significa livrar ou resgatar. O futuro composto expressa o resultado da advertência no encadeamento condicional.
theological_decisions:
- issue: Sentido de “livrar a sua própria vida” no contexto do sentinela
  choice: Manter a linguagem concreta de livramento da própria vida, deixando o contexto indicar a responsabilidade do profeta diante de Deus.
  alternative: Explicitar que o profeta se isenta de culpa de sangue, ou interpretar a frase como salvação espiritual por mérito próprio ou mera preservação física.
  rationale: O contexto do sentinela relaciona a advertência à responsabilidade judicial e pactual do profeta. A tradução não deve reduzir nem ampliar a frase mediante uma formulação doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” de modo coerente com a fala direta a Ezequiel, mantém o masculino singular do referente e preserva a ênfase e a ambiguidade do hebraico.
