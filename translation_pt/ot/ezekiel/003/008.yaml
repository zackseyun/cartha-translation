source:
  edition: WLC
  text: הִנֵּ֨ה נָתַ֧תִּי אֶת פָּנֶ֛י/ךָ חֲזָקִ֖ים לְ/עֻמַּ֣ת פְּנֵי/הֶ֑ם וְ/אֶֽת מִצְחֲ/ךָ֥ חָזָ֖ק לְ/עֻמַּ֥ת מִצְחָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/008.yaml
  text: Behold[a], I have made your face strong against their faces, and your forehead strong against their foreheads.
translation:
  language: pt
  text: Eis que fiz o seu rosto forte diante do rosto deles, e a sua testa forte diante da testa deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “duro” em vez de “forte” nas duas orações; o hebraico pode expressar força, firmeza ou dureza diante da oposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz com solenidade e ênfase a declaração divina, preservando a função de chamar a atenção.
- source_word: נָתַתִּי
  choice: fiz
  rationale: Embora o sentido básico seja “dei”, nesta construção o verbo indica que Deus torna as partes do corpo fortes.
- source_word: פָּנֶיךָ / פְּנֵיהֶם
  choice: o seu rosto / o rosto deles
  rationale: Preserva a imagem corporal e o paralelismo; פָּנִים tem forma plural, mas pode designar o rosto de cada pessoa como unidade.
- source_word: חֲזָקִים / חָזָק
  choice: forte
  rationale: Expressa força ou firmeza diante da oposição, sem atribuir ao profeta a conotação negativa de teimosia.
- source_word: לְעֻמַּת
  choice: diante de
  rationale: Indica posição face a face ou em confronto; “diante de” preserva a imagem espacial e permite que o contexto comunique a oposição.
- source_word: מִצְחֲךָ / מִצְחָם
  choice: a sua testa / a testa deles
  rationale: Mantém a imagem anatômica concreta e o paralelismo rigoroso do hebraico.
theological_decisions:
- issue: Força metafórica do rosto e da testa fortalecidos por Deus
  choice: Manter as imagens concretas de “rosto” e “testa” como expressão da firmeza que Deus dá ao profeta no confronto.
  alternative: 'Explicitar de forma abstrata: “Eu o tornei obstinado contra eles”.'
  rationale: O hebraico emprega imagens corporais deliberadas. Preservá-las mantém a tensão literária com a dureza dos ouvintes, sem sugerir diretamente uma teimosia moralmente culpável em Ezequiel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” conserva o tom solene; a repetição de “rosto” e “testa” reproduz o paralelismo enfático do hebraico.
