  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּֽ/בְ/דַבְּרִ֤/י אֽוֹתְ/ךָ֙ אֶפְתַּ֣ח אֶת פִּ֔י/ךָ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/שֹּׁמֵ֤עַ יִשְׁמָע֙ וְ/הֶ/חָדֵ֣ל יֶחְדָּ֔ל כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־׀׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/027.yaml
  text: 'But when I speak with you[a], I will open your mouth, and you shall say to them, ‘Thus says the Lord GOD: The one who hears, let him hear; and the one who refrains, let him refrain[b], for they are a rebellious house.’'
translation:
  language: pt
  text: 'Mas, quando eu falar com você, abrirei a sua boca, e você lhes dirá: “Assim diz o Senhor Yahweh: Quem ouve, que ouça; e quem se recusa, que se recuse[a], pois eles são uma casa rebelde[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Quem ouve ouvirá, e quem se recusa se recusará”. As formas hebraicas podem ter sentido permissivo ou volitivo (“que ouça... que se recuse”) ou sentido preditivo (“ouvirá... se recusará”).'
    reason: alternative_reading
  - marker: b
    text: Em hebraico, “casa rebelde”, expressão recorrente em Ezequiel para Israel em sua resistência obstinada a Deus.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְדַבְּרִי אֹתְךָ
  choice: Mas, quando eu falar com você
  rationale: A preposição בְּ com o infinitivo forma uma oração temporal, “quando eu falar”. A conjunção וּ recebe valor adversativo contextual, pois a fala divina contrasta com o silêncio imposto anteriormente. “Falar com você” é natural em português e corresponde a אֹתְךָ.
- source_word: אֶפְתַּח אֶת־פִּיךָ
  choice: abrirei a sua boca
  rationale: Mantém a imagem concreta e a ação capacitadora de Deus sem explicá-la além do texto.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: e você lhes dirá
  rationale: O perfeito consecutivo dá sequência à ação futura anterior. “Lhes dirá” expressa com clareza a fala comissionada.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro e sua cadência solene, ainda corrente em português bíblico.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa os dois elementos do título hebraico: אֲדֹנָי como “Senhor” e o nome da aliança יהוה como “Yahweh”, evitando fundi-los em um único título.'
- source_word: הַשֹּׁמֵעַ יִשְׁמָע
  choice: Quem ouve, que ouça
  rationale: A construção com particípio e imperfeito admite força permissiva ou volitiva. A formulação portuguesa preserva o paralelismo e a força retórica.
- source_word: וְהֶחָדֵל יֶחְדָּל
  choice: e quem se recusa, que se recuse
  rationale: חדל denota cessar, abster-se ou deixar de agir. No contexto da reação à mensagem profética, “recusar-se” comunica de modo natural a não acolhida deliberada, sem inserir um objeto ausente no hebraico.
- source_word: כִּי בֵּית מְרִי הֵמָּה
  choice: pois eles são uma casa rebelde
  rationale: Conserva literalmente a expressão recorrente de Ezequiel בֵּית מְרִי e a metáfora coletiva de “casa”, em vez de suavizá-la para “povo”.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS; o Soberano SENHOR
  rationale: A opção distingue o título אֲדֹנָי do nome próprio יהוה e conserva explicitamente o nome da aliança presente no hebraico.
- issue: Força modal ou preditiva de יִשְׁמָע e יֶחְדָּל
  choice: que ouça ... que se recuse
  alternative: ouvirá ... se recusará
  rationale: Os imperfeitos podem ser entendidos como permissivos/volitivos ou como preditivos. O texto principal adota a leitura exortativa-permissiva, mais retoricamente natural, enquanto a nota preserva a ambiguidade genuína.
- issue: Sentido contextual de חדל
  choice: se recusa
  alternative: se abstém; deixa de ouvir
  rationale: “Recusar-se” oferece uma expressão portuguesa natural para a não resposta à palavra profética. A nota sobre a ambiguidade verbal impede que a formulação seja tomada como a única análise possível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A fórmula “Assim diz” e a expressão “casa rebelde” preservam a voz profética e o vocabulário característico de Ezequiel; “você” evita solenidade artificial na fala direta de Deus ao profeta.
