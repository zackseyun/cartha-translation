id: EZK.3.19
reference: Ezekiel 3:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּה֙ כִּֽי הִזְהַ֣רְתָּ רָשָׁ֔ע וְ/לֹא שָׁב֙ מֵֽ/רִשְׁע֔/וֹ וּ/מִ/דַּרְכּ֖/וֹ הָ/רְשָׁעָ֑ה ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/019.yaml
  text: But if you warn a wicked man and he does not turn from his wickedness or from his wicked way[a], he will die in his iniquity[b], but you will have delivered your life.
translation:
  language: pt
  text: Mas, se você advertir um homem perverso, e ele não se afastar de sua perversidade nem de seu caminho perverso, ele morrerá em sua iniquidade[a]; você, porém, terá livrado a sua vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morrerá por causa de sua iniquidade” ou “morrerá em sua culpa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “terá salvado a si mesmo” ou “terá livrado a sua alma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: advertir
  rationale: O hifil de זהר significa dar aviso ou advertir. “Advertir” é claro, digno e adequado ao contexto do sentinela.
- source_word: רָשָׁע
  choice: um homem perverso
  rationale: O adjetivo substantivado singular designa uma pessoa caracterizada pela perversidade. A formulação preserva o masculino singular do hebraico.
- source_word: שָׁב
  choice: se afastar
  rationale: שׁוּב significa voltar-se, retornar ou afastar-se de algo. Neste contexto, “se afastar” conserva a imagem de mudança de direção sem explicá-la diretamente como “arrepender-se”.
- source_word: מֵרִשְׁעוֹ
  choice: de sua perversidade
  rationale: רֶשַׁע denota perversidade ou conduta má. “Perversidade” mantém a força moral do substantivo e sua relação lexical com “perverso”.
- source_word: וּמִדַּרְכּוֹ הָרְשָׁעָה
  choice: nem de seu caminho perverso
  rationale: דֶּרֶךְ preserva a metáfora do caminho como modo de vida. Depois de uma oração negativa, a conjunção hebraica é expressa naturalmente em português por “nem”.
- source_word: בַּעֲוֺנוֹ
  choice: em sua iniquidade
  rationale: A tradução mantém a preposição ב e o peso moral e jurídico de עָוֹן sem decidir se a relação é circunstancial ou explicitamente causal.
- source_word: הִצַּלְתָּ אֶת־נַפְשְׁךָ
  choice: terá livrado a sua vida
  rationale: נֶפֶשׁ aqui se refere à vida ou à própria pessoa de Ezequiel. “Vida” evita restringir o termo à alma imaterial, e o futuro composto expressa o valor contextual do perfeito após a consequência futura.
theological_decisions:
- issue: Se a morte do perverso indica condenação eterna ou morte judicial/temporal
  choice: Manter a afirmação de que ele morrerá “em sua iniquidade”, sem definir o alcance da morte.
  alternative: Traduzir de modo causal como “morrerá por causa de sua iniquidade” ou interpretar a morte como condenação eterna.
  rationale: O hebraico vincula a morte à iniquidade, mas não especifica neste versículo toda a natureza ou extensão dessa morte.
- issue: Se נַפְשְׁךָ deve ser traduzido como “alma”, “vida” ou “a si mesmo”
  choice: Traduzir como “a sua vida”.
  alternative: “A sua alma” ou “a si mesmo”.
  rationale: No contexto da responsabilidade do sentinela, נֶפֶשׁ denota a vida ou a pessoa. “Vida” comunica o sentido sem impor uma distinção antropológica entre corpo e alma.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A metáfora do caminho e a linguagem moral do hebraico foram preservadas sem arcaísmo excessivo.
