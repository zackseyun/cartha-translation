lexical_decisions:
- source_word: וָאֶפְתַּח אֶת־פִּי
  choice: Então abri a boca
  rationale: O wayyiqtol de פתח apresenta a ação seguinte na sequência narrativa. “Então” comunica essa progressão com naturalidade, e אֶת־פִּי significa simplesmente “a minha boca”.
- source_word: וַיַּאֲכִלֵנִי
  choice: e ele me fez comer
  rationale: 'A forma hifil de אכל com sufixo de primeira pessoa é causativa: “fez-me comer”. Esta tradução preserva mais diretamente a forma e a força do hebraico do que apenas “me alimentou”.'
- source_word: אֵת־הַמְּגִלָּה הַזֹּאת
  choice: este rolo
  rationale: מְגִלָּה designa um rolo usado como suporte de escrita. “Este rolo” preserva o demonstrativo e é claro no contexto antigo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. A formulação “me fez comer” conserva a causatividade do hebraico; a nota registra uma alternativa menos suscetível de sugerir coerção.
