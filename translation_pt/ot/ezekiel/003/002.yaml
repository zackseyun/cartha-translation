  text: So I opened my mouth[a], and he fed me this scroll.
translation:
  language: pt
  text: Então abri a boca, e ele me fez comer este rolo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele me deu este rolo para comer”.'
