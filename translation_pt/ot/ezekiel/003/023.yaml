    issue: O particípio עֹמֵד foi reduzido a «estava ali».
    rationale: «Estava ali» comunica presença, mas omite a predicação de postura/posição expressa por עֹמֵד («estando de pé»). O hebraico atribui essa imagem à glória de Yahweh; a tradução não deve eliminá-la para evitar uma possível personificação.
