source:
  edition: WLC
  text: וָ/אָקוּם֮ וָ/אֵצֵ֣א אֶל הַ/בִּקְעָה֒ וְ/הִנֵּה שָׁ֤ם כְּבוֹד יְהוָה֙ עֹמֵ֔ד כַּ/כָּב֕וֹד אֲשֶׁ֥ר רָאִ֖יתִי עַל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל עַל פָּנָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/023.yaml
  text: So I arose and went out to the valley[a], and behold, the glory of Yahweh was standing there, like the glory that I had seen by the Kebar River; and I fell on my face.
translation:
  language: pt
  text: Então me levantei e saí para o vale[a]. E eis que a glória de Yahweh estava de pé ali, como a glória que eu tinha visto junto ao rio Quebar; e caí com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a planície”. O termo hebraico pode indicar um vale amplo ou uma planície.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם וָאֵצֵא
  choice: Então me levantei e saí
  rationale: Os dois wayyiqtol fazem avançar a sequência narrativa. “Então” expressa essa progressão de modo natural, e “me levantei” traduz o uso intransitivo de קום.
- source_word: הַבִּקְעָה
  choice: o vale
  rationale: בִּקְעָה pode designar um vale largo ou uma planície. “Vale” é claro e tradicional no contexto, enquanto a alternativa lexical é preservada em nota.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém a função de chamar vividamente a atenção para a visão e preserva o tom solene da narrativa profética.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כָּבוֹד indica aqui a manifestação visível da glória ou presença divina; a construção genitiva hebraica é preservada naturalmente em português.
- source_word: עֹמֵד
  choice: estava ali
  rationale: O particípio apresenta uma presença situada e durativa. Como “glória” não costuma ser descrita literalmente como estando “de pé” em português, “estava ali” comunica a cena sem sugerir uma postura corporal indevida.
- source_word: כַּכָּבוֹד אֲשֶׁר רָאִיתִי
  choice: como a glória que eu tinha visto
  rationale: A preposição כ marca comparação, e o mais-que-perfeito composto esclarece que a visão junto ao Quebar precedeu esta cena.
- source_word: עַל נְהַר כְּבָר
  choice: junto ao rio Quebar
  rationale: עַל, neste contexto geográfico, indica proximidade. “Junto ao” é idiomático e não sugere que Ezequiel estivesse sobre o rio.
- source_word: וָאֶפֹּל עַל פָּנָי
  choice: e caí com o rosto em terra
  rationale: A expressão descreve prostração física e reverente. A formulação portuguesa é natural e preserva essa imagem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o translitera diretamente, em vez de substituí-lo por um título.
- issue: Sentido de כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  alternative: a presença gloriosa de Yahweh
  rationale: A expressão aponta para a manifestação divina na visão, mas a tradução conserva a formulação bíblica sem explicitar além do que o hebraico afirma.
- issue: Descrição da glória pelo particípio עֹמֵד
  choice: estava ali
  alternative: estava de pé ali
  rationale: O hebraico pode ser traduzido formalmente como “estava de pé”, mas isso pode personificar ou corporalizar a glória em português. “Estava ali” preserva sua presença durativa sem resolver a natureza da manifestação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva “eis que” por seu valor enfático e profético, usa “Quebar” como forma portuguesa do topônimo e evita linguagem excessivamente arcaica.
