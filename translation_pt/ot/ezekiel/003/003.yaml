base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/003.yaml
  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
translation:
  language: pt
  text: 'E ele me disse[a]: “Filho do homem, alimente o seu ventre e encha as suas entranhas com este rolo que eu lhe dou.” Então eu o comi, e ele ficou doce como mel na minha boca.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser humano” ou “mortal”. A expressão hebraica “Filho do homem” foi mantida por ser a forma de tratamento recorrente dirigida a Ezequiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma de tratamento profética recorrente em Ezequiel e reproduz de modo transparente o idioma hebraico, que ressalta a condição humana do profeta.
- source_word: בִּטְנְךָ תַאֲכֵל
  choice: alimente o seu ventre
  rationale: Preserva tanto a imagem corporal concreta de בֶּטֶן quanto o valor causativo do hifil תַאֲכֵל.
- source_word: וּמֵעֶיךָ תְמַלֵּא
  choice: encha as suas entranhas
  rationale: Expressa os órgãos ou as partes interiores de modo natural e digno, mantendo o paralelismo concreto com o ventre.
- source_word: הַמְּגִלָּה
  choice: rolo
  rationale: Designa adequadamente o manuscrito enrolado do mundo antigo e é claro em português contemporâneo.
- source_word: אֲנִי נֹתֵן אֵלֶיךָ
  choice: eu lhe dou
  rationale: O presente em português comunica naturalmente a ação imediata ou em curso expressa pelo particípio hebraico.
- source_word: וָאֹכְלָה
  choice: Então eu o comi
  rationale: “Então” faz avançar a narrativa, e o pronome retoma explicitamente o rolo.
- source_word: וַתְּהִי בְּפִי
  choice: na minha boca ele era
  rationale: Mantém o foco sensorial da expressão hebraica e explicita de modo natural que o referente é o rolo.
- source_word: כִּדְבַשׁ לְמָתוֹק
  choice: doce como mel
  rationale: Equivalente idiomático natural da formulação hebraica, literalmente “como mel quanto à doçura”.
theological_decisions:
- issue: Sentido de אָדָם na expressão בֶּן אָדָם
  choice: homem
  alternative: ser humano; mortal; filho de Adão
  rationale: Na forma fixa “Filho do homem”, a tradução conserva o tratamento dirigido a Ezequiel e sua ênfase na condição humana, sem converter a expressão em título cristológico nem identificar אָדָם especificamente com o nome próprio Adão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção concreta e deliberadamente incomum “alimente o seu ventre” preserva o causativo hebraico e a forte imagem corporal; “entranhas” conserva o paralelismo sem recorrer a linguagem clínica.
