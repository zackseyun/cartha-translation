  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כָּל בֶּן נֵכָ֗ר עֶ֤רֶל לֵב֙ וְ/עֶ֣רֶל בָּשָׂ֔ר לֹ֥א יָב֖וֹא אֶל מִקְדָּשִׁ֑/י לְ/כָל בֶּן נֵכָ֔ר אֲשֶׁ֕ר בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/009.yaml
  text: 'Thus says the Lord GOD: No foreigner[a], uncircumcised in heart and uncircumcised in flesh, shall enter my sanctuary[b], of any foreigner who is among the sons of Israel.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Nenhum estrangeiro[a], incircunciso de coração e incircunciso de carne, entrará no meu santuário — nenhum estrangeiro que esteja entre os filhos de Israel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filho de terra estrangeira”; expressão hebraica que significa “estrangeiro”.
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Israel” refere-se coletivamente ao povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro e seu tom solene e autorizado, em português natural.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יְהוִה e evita a combinação confusa “Senhor SENHOR”.
- source_word: כָּל בֶּן נֵכָר
  choice: Nenhum estrangeiro
  rationale: בֶּן נֵכָר é uma expressão idiomática para uma pessoa estrangeira; com a negação, כָּל assume o sentido abrangente de “nenhum”.
- source_word: עֶרֶל לֵב
  choice: incircunciso de coração
  rationale: Mantém a metáfora hebraica referente à condição interior, sem explicar ou restringir seu sentido teológico.
- source_word: וְעֶרֶל בָּשָׂר
  choice: e incircunciso na carne
  rationale: Conserva o paralelismo com o coração e a referência corporal concreta de בָּשָׂר.
- source_word: לֹא יָבוֹא אֶל מִקְדָּשִׁי
  choice: entrará no meu santuário
  rationale: Expressa de modo direto e natural a proibição declarativa de entrar no recinto sagrado.
- source_word: לְכָל בֶּן נֵכָר
  choice: — nenhum estrangeiro
  rationale: A repetição após a oração principal é tratada como retomada enfática; o travessão preserva esse reforço sem produzir uma construção portuguesa artificial.
- source_word: אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: que esteja entre os filhos de Israel
  rationale: Traduz בְּתוֹךְ por “entre” e preserva a expressão familiar-nacional “filhos de Israel”, esclarecida em nota.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS; o Soberano SENHOR
  rationale: O texto combina um título com o nome próprio divino. “Senhor Yahweh” mantém ambos distintos e torna visível o nome da aliança presente no hebraico.
- issue: Alcance da exclusão dos estrangeiros
  choice: A descrição “incircunciso de coração e incircunciso na carne” permanece ligada a “estrangeiro”.
  alternative: Entender o versículo como exclusão absoluta de todo estrangeiro, sem qualificação.
  rationale: A sintaxe caracteriza o estrangeiro mencionado por essas duas condições. A tradução conserva a formulação e não amplia a proibição para além do que o versículo declara.
- issue: Repetição de לְכָל בֶּן נֵכָר
  choice: 'Retomada enfática: “— nenhum estrangeiro”'
  alternative: “isto é, qualquer estrangeiro”; omitir a repetição
  rationale: A retomada é formalmente incomum, mas significativa. Mantê-la preserva a ênfase e a tensão sintática do hebraico sem impor uma explicação interpretativa.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a metáfora da incircuncisão do coração, o termo concreto “carne”, a repetição enfática de “estrangeiro” e a expressão coletiva “filhos de Israel”. Todos os marcadores de nota aparecem no texto principal.
