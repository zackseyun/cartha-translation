  text: וְ/רֵאשִׁית֩ כָּל בִּכּ֨וּרֵי כֹ֜ל וְ/כָל תְּר֣וּמַת כֹּ֗ל מִ/כֹּל֙ תְּרוּמ֣וֹתֵי/כֶ֔ם לַ/כֹּהֲנִ֖ים יִֽהְיֶ֑ה וְ/רֵאשִׁ֤ית עֲרִסֽוֹתֵי/כֶם֙ תִּתְּנ֣וּ לַ/כֹּהֵ֔ן לְ/הָנִ֥יחַ בְּרָכָ֖ה אֶל בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/030.yaml
  text: And the first of all the firstfruits of everything[a], and every contribution from all your contributions, shall belong to the priests. You shall give the first of your dough to the priest[c][b], to cause a blessing to rest on your house.
translation:
  language: pt
  text: A primeira porção de todas as primícias de tudo, e toda contribuição dentre todas as contribuições de vocês[a], pertencerão aos sacerdotes. Vocês darão ao sacerdote a primeira porção da massa de vocês[b], para fazer repousar uma bênção sobre a sua casa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toda oferta sagrada dentre todas as ofertas sagradas de vocês». O termo hebraico indica uma porção separada e entregue para uso sagrado.
    reason: lexical_alternative
  - marker: b
    text: Ou «a primeira porção da massa amassada de vocês»; o termo hebraico pode se referir à massa ou, por extensão, à porção que está sendo amassada.
    reason: lexical_alternative
  - marker: c
    text: Isto é, para que uma bênção repouse sobre a sua casa; «casa» também pode incluir a família e todos os que pertencem ao lar.
    reason: clarification
lexical_decisions:
- source_word: רֵאשִׁית
  choice: a primeira porção
  rationale: O termo indica a parte inicial ou principal. A expressão «porção» torna natural em português a relação com «primícias» e, na segunda ocorrência, com a massa, sem eliminar a ênfase hebraica no que vem primeiro.
- source_word: בִּכּוּרֵי
  choice: primícias
  rationale: É o termo cultual estabelecido para os primeiros produtos da colheita oferecidos a Deus e se ajusta ao contexto das normas do templo.
- source_word: תְּרוּמַת / תְּרוּמוֹתֵיכֶם
  choice: contribuição / contribuições de vocês
  rationale: Designa uma porção separada e destinada ao uso sagrado. «Contribuição» comunica isso em linguagem atual sem recorrer a uma expressão técnica arcaica; a construção singular-plural do hebraico foi preservada.
- source_word: לַכֹּהֲנִים יִהְיֶה
  choice: pertencerão aos sacerdotes
  rationale: Expressa destinação ou direito de posse. O plural verbal é natural em português por causa dos elementos coordenados, embora o hebraico empregue uma forma singular.
- source_word: עֲרִסוֹתֵיכֶם
  choice: sua massa
  rationale: Embora o substantivo possa designar a massa, a porção amassada ou até a vasilha de amassar, neste contexto de oferta refere-se naturalmente à massa preparada com cereal.
- source_word: תִּתְּנוּ לַכֹּהֵן
  choice: Vocês darão ao sacerdote
  rationale: Mantém a instrução jurídica, o verbo na segunda pessoa do plural e o destinatário sacerdotal no singular coletivo.
- source_word: לְהָנִיחַ
  choice: para fazer repousar
  rationale: O infinitivo causativo de נוח significa fazer repousar ou assentar. A formulação preserva a imagem hebraica da bênção que passa a repousar sobre a casa.
- source_word: בְּרָכָה
  choice: uma bênção
  rationale: O substantivo tem sentido amplo e não especifica se a bênção é material, espiritual ou de outra natureza.
- source_word: אֶל בֵּיתֶךָ
  choice: sobre a sua casa
  rationale: Com o verbo «repousar», a preposição é expressa naturalmente por «sobre». «Casa» preserva a imagem concreta e pode incluir os moradores, isto é, a família.
theological_decisions:
- issue: Natureza da bênção prometida sobre a casa
  choice: A oferta da primeira porção faz com que uma bênção repouse sobre a casa de quem a dá, sem definir a forma dessa bênção.
  alternative: Entender a frase especificamente como promessa de prosperidade material ou, em sentido mais restrito, apenas como favor espiritual sobre a família.
  rationale: O hebraico diz apenas «bênção» e mantém amplo o seu alcance. A tradução não restringe a promessa a prosperidade material nem a espiritualiza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura repetitiva do hebraico («todas», «tudo», «contribuição/contribuições») foi mantida por ter valor enfático e jurídico. Empregou-se «vocês» em vez de «vós». O hebraico passa da segunda pessoa do plural em «contribuições de vocês» e «vocês darão» para o singular em «sua casa»; o português conserva uma formulação coletiva natural sem sobrecarregar o texto.
