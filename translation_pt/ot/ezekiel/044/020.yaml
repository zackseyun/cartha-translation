base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/020.yaml
  text: They shall not shave their heads[a], nor let their hair grow long; they shall surely trim the hair of their heads.
translation:
  language: pt
  text: Não rasparão suas cabeças[a], nem deixarão o cabelo crescer livremente; deverão aparar cuidadosamente o cabelo de suas cabeças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não raparão a cabeça”. A expressão hebraica da cláusula final é compacta e também pode ser traduzida como “deverão manter bem aparado o cabelo de suas cabeças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלֵּחוּ
  choice: rasparão
  rationale: O piel de גלח indica raspar o cabelo. Com “a cabeça”, “rasparão” expressa de modo natural a proibição de deixá-la rapada.
- source_word: פֶרַע
  choice: o cabelo crescer livremente
  rationale: פֶרַע descreve cabelo deixado solto, sem controle ou sem aparar. A expressão escolhida conserva essa nuance sem limitar o sentido apenas ao comprimento.
- source_word: יְשַׁלֵּחוּ
  choice: deixarão ... crescer
  rationale: Embora שלח signifique literalmente “soltar” ou “deixar ir”, nesta construção refere-se a deixar o cabelo crescer sem controle.
- source_word: כָּסוֹם יִכְסְמוּ
  choice: deverão aparar bem
  rationale: A construção com infinitivo absoluto e verbo finito enfatiza a obrigação. “Aparar bem” transmite tanto o corte do cabelo quanto a força enfática de modo natural em português.
- source_word: רֹאשָׁם / רָאשֵׁיהֶם
  choice: a cabeça / o cabelo da cabeça
  rationale: A primeira ocorrência pode ser traduzida diretamente como “a cabeça”; na cláusula final, explicitar “o cabelo” evita a impressão inadequada de que se deva aparar a própria cabeça.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção normativa adequada ao contexto sacerdotal. “Raspar” tem ampla compreensão internacional; a alternativa “rapar” é registrada na nota. A tradução mantém o contraste entre raspar completamente, deixar crescer sem controle e aparar regularmente.
