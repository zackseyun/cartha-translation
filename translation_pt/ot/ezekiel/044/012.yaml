  text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָ/ם֙ לִ/פְנֵ֣י גִלּֽוּלֵי/הֶ֔ם וְ/הָי֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/מִכְשׁ֣וֹל עָוֺ֑ן עַל כֵּן֩ נָשָׂ֨אתִי יָדִ֜/י עֲלֵי/הֶ֗ם נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/012.yaml
  text: Because they ministered to them before their idols and became a stumbling block of iniquity for the house of Israel[a], therefore I have raised my hand against them, declares the Lord GOD[b], and they will bear their iniquity.
translation:
  language: pt
  text: Visto que ministraram a eles diante dos seus ídolos[a] e se tornaram uma pedra de tropeço de iniquidade para a casa de Israel, por isso levantei a minha mão contra eles[b] — declara o Senhor Yahweh —, e eles carregarão a sua iniquidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serviram a eles diante dos seus ídolos”. O referente de “a eles” está expresso de forma compacta no hebraico e pode apontar para os associados aos ídolos ou, pelo sentido do contexto, para os próprios ídolos.'
    reason: alternative_reading
  - marker: b
    text: 'Expressão idiomática hebraica: “levantei a minha mão contra eles”. O gesto pode indicar um juramento solene ou uma ação judicial; neste contexto, introduz uma declaração de juízo contra eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz explicitamente a causa do juízo e soa natural no início de uma sentença solene em português.
- source_word: יְשָׁרְתוּ
  choice: ministraram
  rationale: Preserva o sentido de serviço cultual ou ministerial próprio do contexto sacerdotal, sem reduzi-lo ao sentido genérico de servir.
- source_word: אוֹתָם
  choice: a eles
  rationale: Mantém o pronome hebraico sem resolver à força seu referente comprimido; a nota registra as possibilidades contextuais.
- source_word: לִפְנֵי גִלּוּלֵיהֶם
  choice: diante dos seus ídolos
  rationale: Expressa a localização ou presença cultual indicada por לִפְנֵי. 'Ídolos' é claro e corrente, embora גִלּוּלִים tenha tom pejorativo em Ezequiel.
- source_word: וְהָיוּ
  choice: e se tornaram
  rationale: Comunica o estado resultante produzido pela conduta anterior, em vez de apresentar apenas uma condição estática.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Conserva a expressão coletiva e pactual do hebraico.
- source_word: לְמִכְשׁוֹל עָוֺן
  choice: uma pedra de tropeço que levou ... à iniquidade
  rationale: Mantém a metáfora do tropeço e comunica em português corrente a relação compacta entre tropeço e iniquidade, sem reduzir עָוֺן apenas a culpa ou apenas a castigo.
- source_word: נָשָׂאתִי יָדִי עֲלֵיהֶם
  choice: levantei a minha mão contra eles
  rationale: Preserva o gesto idiomático e sua força judicial hostil no contexto; a possível nuance de juramento solene é indicada em nota.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Traduz a fórmula profética de modo natural, preserva o título אֲדֹנָי e representa explicitamente o nome divino יהוה como Yahweh.
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: e eles levarão sobre si a sua iniquidade
  rationale: Conserva o idioma hebraico de carregar a própria iniquidade, abrangendo tanto a responsabilidade culpável quanto suas consequências.
theological_decisions:
- issue: Representação do nome divino יהוה na fórmula אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha distingue o título אֲדֹנָי do nome da aliança יהוה e evita ocultar o nome próprio sob um segundo título.
- issue: Sentido de levar a própria iniquidade
  choice: levarão sobre si a sua iniquidade
  alternative: sofrerão o castigo por sua culpa
  rationale: A formulação conserva a amplitude do hebraico entre culpa, responsabilidade e consequências, sem impor uma explicação teológica mais estreita.
- issue: Relação entre tropeço e iniquidade
  choice: uma pedra de tropeço que levou a casa de Israel à iniquidade
  alternative: uma pedra de tropeço de iniquidade para a casa de Israel
  rationale: A alternativa é mais formal, mas pouco natural e semanticamente opaca em português. A redação escolhida preserva a imagem e torna clara a função causadora, sem especificar além do texto a natureza exata da iniquidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe mantém o encadeamento causal e judicial do hebraico. Preservaram-se a metáfora da pedra de tropeço, a ambiguidade do pronome em אוֹתָם e a amplitude teológica de עָוֺן.
