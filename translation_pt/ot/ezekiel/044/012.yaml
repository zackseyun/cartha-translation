  source_fidelity: A tradução preserva bem a estrutura causal, o contexto de serviço cultual, a ambiguidade de «a eles», a fórmula de juízo e a imagem de levantar a mão. Contudo, «uma pedra de tropeço que levou a casa de Israel à iniquidade» transforma a expressão nominal hebraica «tropeço de iniquidade» numa afirmação causal mais explícita e retrospectiva. Uma formulação mais próxima preserva melhor a concisão e a margem semântica do hebraico.
  naturalness: O português é geralmente claro, solene e acessível. «Tornaram-se uma pedra de tropeço de iniquidade para a casa de Israel» é uma construção bíblica compreensível e mais fiel; «carregarão a sua iniquidade» é mais direto em português do que «levarão sobre si a sua iniquidade».
  terminology: «Ministraram», «ídolos», «casa de Israel», «Senhor Yahweh» e «iniquidade» são adequados ao registro e ao contexto. «Senhor Yahweh» representa de modo transparente Adonai YHWH. As notas preservam de maneira apropriada tanto a referência comprimida do pronome quanto a nuance idiomática de levantar a mão.
