revisions:
- from: Visto que ministraram a eles diante dos seus ídolos[a] e se tornaram uma pedra de tropeço que levou a casa de Israel à iniquidade, por isso levantei a minha mão contra eles[b] — declara o Senhor Yahweh —, e eles levarão sobre si a sua iniquidade.
  to: Visto que ministraram a eles diante dos seus ídolos[a] e se tornaram uma pedra de tropeço de iniquidade para a casa de Israel, por isso levantei a minha mão contra eles[b] — declara o Senhor Yahweh —, e eles carregarão a sua iniquidade.
  rationale: A revisão evita converter uma expressão nominal hebraica numa relação causal explicitamente narrada, mantendo a metáfora e a densidade de «tropeço de iniquidade». Também simplifica a expressão final para uma equivalência mais direta e idiomática de «carregar a sua iniquidade». As âncoras das notas permanecem nos elementos a que se referem.
