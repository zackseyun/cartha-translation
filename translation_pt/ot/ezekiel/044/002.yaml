  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהוָ֗ה הַ/שַּׁ֣עַר הַ/זֶּה֩ סָג֨וּר יִהְיֶ֜ה לֹ֣א יִפָּתֵ֗חַ וְ/אִישׁ֙ לֹא יָ֣בֹא ב֔/וֹ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּ֣א ב֑/וֹ וְ/הָיָ֖ה סָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/002.yaml
  text: And Yahweh said to me[a], “This gate shall remain shut; it shall not be opened, and no one shall enter through it, because Yahweh, the God of Israel, has entered through it. Therefore it shall remain shut.”
translation:
  language: pt
  text: 'E Yahweh me disse: “Este portão permanecerá fechado; não será aberto, e ninguém entrará por ele, pois Yahweh, o Deus de Israel, entrou por ele. Por isso, permanecerá fechado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, conforme o uso do projeto.
- source_word: הַשַּׁעַר הַזֶּה
  choice: este portão
  rationale: O demonstrativo é proximal, e “portão” expressa naturalmente שַׁעַר no contexto da entrada do templo.
- source_word: סָגוּר יִהְיֶה
  choice: permanecerá fechado
  rationale: A construção com היה descreve a continuidade do estado de fechamento.
- source_word: לֹא יִפָּתֵחַ
  choice: não será aberto
  rationale: Preserva a voz passiva do nifal de פתח.
- source_word: וְאִישׁ לֹא יָבֹא בוֹ
  choice: e ninguém entrará por ele
  rationale: אִישׁ tem força genérica neste contexto; “ninguém” comunica isso com naturalidade em português, e “por ele” indica passagem pelo portão.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo claro e digno a razão pela qual o portão deve ficar fechado.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, o Deus de Israel
  rationale: Mantém a aposição presente no hebraico.
- source_word: בָּא בוֹ
  choice: entrou por ele
  rationale: O qatal apresenta uma ação concluída; o pretérito perfeito é a forma natural em português, e “por ele” preserva o sentido espacial.
- source_word: וְהָיָה סָגוּר
  choice: Por isso, permanecerá fechado
  rationale: Explicita naturalmente a consequência contextual e mantém a repetição enfática do estado contínuo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: “Yahweh” conserva o nome pessoal no texto sem substituí-lo por um título nem acrescentar uma interpretação teológica.
- issue: Força genérica de אִישׁ
  choice: ninguém
  alternative: nenhum homem
  rationale: Embora אִישׁ seja morfologicamente masculino singular, com a negação ele tem força universal genérica. “Ninguém” preserva o alcance sem sugerir, indevidamente, que apenas homens do sexo masculino estão proibidos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Portão” distingue a entrada monumental de uma porta comum; a repetição de “permanecerá fechado” conserva a ênfase do hebraico.
