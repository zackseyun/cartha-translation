  text: וְ/אֶת עַמִּ֣/י יוֹר֔וּ בֵּ֥ין קֹ֖דֶשׁ לְ/חֹ֑ל וּ/בֵין טָמֵ֥א לְ/טָה֖וֹר יוֹדִעֻֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/023.yaml
  text: They shall teach my people the difference between the holy and the common[b][a], and make them know the difference between the unclean and the clean.
translation:
  language: pt
  text: Ensinarão o meu povo a distinguir entre o santo e o comum[a] e os farão discernir entre o impuro e o puro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre o santo e o profano”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e os farão reconhecer a diferença entre o impuro e o puro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרוּ
  choice: ensinarão
  rationale: O hifil de ירה, neste contexto sacerdotal, expressa a ação de instruir ou ensinar; “ensinarão” comunica com naturalidade a função didática dos sacerdotes.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: a distinguir entre o santo e o comum
  rationale: קֹדֶשׁ designa aquilo que é santo ou consagrado, enquanto חֹל indica o que não possui essa condição especial. “Comum” preserva o contraste cultual sem sugerir necessariamente irreverência ou contaminação moral.
- source_word: טָמֵא
  choice: impuro
  rationale: No contexto sacerdotal, o termo indica impureza ritual. “Impuro” é claro em português atual e mantém a relação técnica com “puro”.
- source_word: טָהוֹר
  choice: puro
  rationale: Em oposição a טָמֵא, designa a condição de pureza, sobretudo ritual; “puro” forma o par natural com “impuro” em português.
- source_word: יוֹדִעֻם
  choice: o farão discernir
  rationale: O hifil de ידע tem força causativa, “fazer saber” ou “levar a reconhecer”. “Farão discernir” preserva essa força e se ajusta ao contraste expresso por בֵּין; o pronome singular retoma o coletivo “meu povo”.
- source_word: וְאֶת עַמִּי
  choice: o meu povo
  rationale: A partícula אֶת marca o objeto direto de יוֹרוּ. Em português, “o meu povo” é a formulação natural, sem necessidade de reproduzir separadamente a conjunção inicial.
theological_decisions:
- issue: Terminologia cultual de חֹל em contraste com קֹדֶשׁ
  choice: comum
  alternative: profano
  rationale: “Comum” indica aquilo que não é santo ou consagrado sem atribuir automaticamente culpa moral ou desprezo religioso. “Profano” é lexicalmente possível, mas no uso moderno pode sugerir uma oposição moral mais forte do que o hebraico exige.
- issue: Relação entre טָמֵא e טָהוֹר
  choice: impuro e puro
  alternative: imundo e limpo
  rationale: “Impuro” e “puro” exprimem com clareza categorias rituais e evitam que o leitor entenda o contraste apenas como sujeira ou higiene física.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia cultual clara. A redação mantém o paralelismo entre santidade e pureza, ao mesmo tempo que explicita de modo idiomático a ideia de distinguir expressa pelas construções hebraicas com בֵּין.
