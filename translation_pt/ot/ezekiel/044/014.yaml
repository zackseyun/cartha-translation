  text: וְ/נָתַתִּ֣י אוֹתָ֔/ם שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/בָּ֑יִת לְ/כֹל֙ עֲבֹ֣דָת֔/וֹ וּ/לְ/כֹ֛ל אֲשֶׁ֥ר יֵעָשֶׂ֖ה בּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/014.yaml
  text: Yet I will appoint them to keep charge of the house[a], for all its service and for all that is done in it.
translation:
  language: pt
  text: Mas eu os encarregarei da guarda do templo[a], de todo o seu serviço e de tudo o que nele se fizer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa”, designação comum do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Mas eu os encarregarei
  rationale: Embora נָתַתִּי signifique literalmente “darei” ou “colocarei”, aqui indica atribuição de uma função. “Mas” comunica o valor adversativo da conjunção no contexto do juízo anterior.
- source_word: אוֹתָם
  choice: os
  rationale: Pronome objeto que retoma os levitas mencionados no contexto imediato.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: de cuidar
  rationale: A construção com particípio e substantivo cognato expressa responsabilidade confiada de guarda e manutenção. “Cuidar” é natural em português e, com “encarregarei”, preserva a ideia de dever atribuído.
- source_word: הַבָּיִת
  choice: do templo
  rationale: O sentido literal é “da casa”, mas, na visão de Ezequiel, a referência contextual é o templo. A opção idiomática evita que o leitor moderno entenda uma residência comum, enquanto a nota preserva a forma hebraica.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: de todo o seu serviço
  rationale: עֲבֹדָה abrange trabalho, serviço e atividade cultual. “Serviço” mantém essa amplitude; o possessivo retoma o templo.
- source_word: וּלְכֹל אֲשֶׁר יֵעָשֶׂה בוֹ
  choice: e de tudo o que nele se fizer
  rationale: A formulação preserva a abrangência de כֹל e o caráter passivo e prospectivo do imperfeito יֵעָשֶׂה, em português natural e digno.
theological_decisions:
- issue: Referente de הַבָּיִת (“a casa”)
  choice: templo, com nota sobre a expressão hebraica literal
  alternative: casa
  rationale: O contexto da visão e das funções levíticas identifica claramente o edifício como o templo. A tradução comunica esse referente sem impor interpretação doutrinária, e a nota registra a imagem lexical do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “encarregarei de cuidar” exprime naturalmente a atribuição administrativa e custodial, sem restringir as tarefas a funções apenas litúrgicas.
