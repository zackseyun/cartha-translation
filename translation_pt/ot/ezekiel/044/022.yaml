  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַלְמָנָה֙ וּ/גְרוּשָׁ֔ה לֹֽא יִקְח֥וּ לָ/הֶ֖ם לְ/נָשִׁ֑ים כִּ֣י אִם בְּתוּלֹ֗ת מִ/זֶּ֨רַע֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה אַלְמָנָ֔ה מִ/כֹּהֵ֖ן יִקָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/022.yaml
  text: They shall not take for themselves as wives a widow or a divorced woman[a], but only virgins from the offspring of the house of Israel; however, they may take a widow who is the widow of a priest.
translation:
  language: pt
  text: Não tomarão por esposa viúva nem mulher divorciada, mas somente virgens da descendência da casa de Israel; contudo, poderão tomar uma viúva que tenha sido esposa de um sacerdote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “uma viúva que tenha ficado viúva de um sacerdote”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: viúva
  rationale: 'É o sentido comum do termo hebraico: mulher cujo marido morreu. A tradução é clara e preserva o estado civil indicado.'
- source_word: גְרוּשָׁה
  choice: mulher divorciada
  rationale: A forma passiva designa uma mulher que foi divorciada. Esta expressão é natural no português atual e mantém a precisão jurídica e matrimonial.
- source_word: יִקְחוּ ... לְנָשִׁים
  choice: tomarão por esposa
  rationale: Preserva a formulação jurídica do idioma hebraico, que emprega o verbo “tomar” com “por esposas”, sem deixar a frase pouco natural em português.
- source_word: כִּי אִם
  choice: mas somente
  rationale: A construção introduz uma exceção restritiva; “mas somente” expressa com clareza tanto o contraste quanto a limitação.
- source_word: בְּתוּלוֹת
  choice: virgens
  rationale: O termo se refere especificamente a virgens, e não apenas a mulheres jovens ou solteiras.
- source_word: מִזֶּרַע בֵּית יִשְׂרָאֵל
  choice: da descendência da casa de Israel
  rationale: “Descendência” comunica naturalmente a ideia genealógica de זֶרַע, enquanto “casa de Israel” preserva a expressão nacional e pactual.
- source_word: וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  choice: contudo, poderão tomar uma viúva que tenha sido esposa de um sacerdote
  rationale: 'A oração acrescenta uma categoria permitida. A formulação torna explícita, em português idiomático, a relação implícita no hebraico: o marido falecido da viúva era sacerdote.'
- source_word: מִן em מִכֹּהֵן
  choice: de um sacerdote
  rationale: Embora a preposição signifique literalmente “de, desde” ou “a partir de”, aqui indica a origem da condição de viuvez ou a associação com o marido sacerdote. Em português, essa relação é expressa naturalmente por “viúva de um sacerdote” ou, no texto, “tenha sido esposa de um sacerdote”.
theological_decisions:
- issue: Alcance da regra matrimonial na visão do templo
  choice: Traduzir o versículo como legislação dirigida aos sacerdotes no contexto da visão de Ezequiel, sem acrescentar conclusões morais ou doutrinárias posteriores.
  alternative: Entendê-lo como regra matrimonial universal e atemporal, ou atenuar a proibição como simples preferência.
  rationale: O contexto apresenta normas sacerdotais. A tradução conserva tanto a proibição quanto a exceção, sem ampliar nem reduzir seu alcance.
- issue: Relação da viúva permitida com o sacerdote
  choice: Entender que ela ficou viúva de um sacerdote, isto é, que seu marido falecido era sacerdote.
  alternative: Manter apenas a formulação literal e potencialmente obscura “viúva que ficou viúva a partir de um sacerdote”.
  rationale: Esse é o sentido contextual mais natural da construção hebraica, mas a nota registra sua forma literal incomum para não ocultar a base textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva o tom jurídico mediante “tomarão por esposa”, mas usa “poderão tomar” na exceção para explicitar naturalmente a permissão implícita. O marcador da nota foi colocado junto à expressão a que a alternativa lexical efetivamente se refere.
