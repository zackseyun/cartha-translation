id: EZK.44.4
reference: Ezekiel 44:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְבִיאֵ֜/נִי דֶּֽרֶךְ שַׁ֣עַר הַ/צָּפוֹן֮ אֶל פְּנֵ֣י הַ/בַּיִת֒ וָ/אֵ֕רֶא וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֣ית יְהוָ֑ה וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/004.yaml
  text: Then he brought me by way of the north gate to the front of the house[a], and I looked, and behold, the glory of Yahweh filled the house of Yahweh[b]; and I fell on my face.
translation:
  language: pt
  text: Então ele me levou pelo caminho do portão norte até a frente da Casa[a]. Olhei, e eis que a glória de Yahweh enchia a Casa de Yahweh[b]; e caí com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo portão norte”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo. A tradução mantém “Casa” para refletir a terminologia de Ezequiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Então ele me levou
  rationale: O hifil de בוא com sufixo de primeira pessoa significa que ele fez o profeta chegar, isto é, levou-o. “Então” expressa com naturalidade a progressão narrativa do waw.
- source_word: דֶּרֶךְ שַׁעַר הַצָּפוֹן
  choice: pelo caminho do portão norte
  rationale: דֶּרֶךְ indica o caminho ou a rota seguida. A formulação conserva esse elemento lexical sem excluir a possibilidade contextual de passagem pelo portão.
- source_word: אֶל פְּנֵי הַבַּיִת
  choice: até a frente da Casa
  rationale: פְּנֵי, literalmente “face”, designa aqui a parte frontal ou o espaço diante da Casa. “Frente” é claro e natural em português.
- source_word: וָאֵרֶא וְהִנֵּה
  choice: Olhei, e eis que
  rationale: A sequência introduz uma nova percepção visual e chama solenemente a atenção para ela. “Eis que” preserva a força discursiva de הִנֵּה.
- source_word: מָלֵא
  choice: enchia
  rationale: A forma predicativa comunica que a glória ocupava plenamente a Casa. O imperfeito português apresenta naturalmente a cena contemplada, sem exigir que se determine se o foco é estado ou ação concluída.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: “Glória” é o equivalente estabelecido de כָּבוֹד neste contexto visionário; o nome divino é transliterado.
- source_word: בֵּית יְהוָה
  choice: a Casa de Yahweh
  rationale: Mantém a terminologia בית, “casa”, usada por Ezequiel, embora o referente seja o templo.
- source_word: וָאֶפֹּל אֶל פָּנַי
  choice: e caí com o rosto em terra
  rationale: Expressa de modo idiomático em português a prostração indicada pela locução hebraica, preservando a postura corporal e reverente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém o nome próprio divino. “Yahweh” o representa por transliteração, em vez de substituí-lo por um título.
- issue: Tradução de בַּיִת / בֵּית יְהוָה na visão do templo
  choice: Casa / Casa de Yahweh
  alternative: templo / templo de Yahweh
  rationale: “Casa” conserva a dicção recorrente de Ezequiel e a relação verbal entre as duas ocorrências do termo, sem negar que o edifício referido seja o templo.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. “Casa” recebe inicial maiúscula por funcionar contextualmente como designação do santuário, não para introduzir uma distinção ausente do hebraico.
