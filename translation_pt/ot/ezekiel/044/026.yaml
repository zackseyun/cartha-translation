  text: וְ/אַחֲרֵ֖י טָֽהֳרָת֑/וֹ שִׁבְעַ֥ת יָמִ֖ים יִסְפְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/026.yaml
  text: And after his cleansing[a], they shall count seven days for him.
translation:
  language: pt
  text: E depois da sua purificação[a], contarão sete dias para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpeza ritual”. O hebraico se refere à purificação cerimonial no contexto sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  choice: E, depois de
  rationale: Mantém tanto a continuidade discursiva expressa por וְ como a sucessão temporal de אַחֲרֵי.
- source_word: טָהֳרָתוֹ
  choice: sua purificação
  rationale: No contexto sacerdotal, טָהֳרָה designa purificação ritual. “Purificação” é natural em português e preserva o caráter cultual sem sugerir necessariamente uma mudança moral interior.
- source_word: שִׁבְעַת יָמִים
  choice: sete dias
  rationale: Correspondência direta e natural da construção numeral hebraica.
- source_word: יִסְפְּרוּ
  choice: contarão
  rationale: O Qal de ספר significa “contar”. O futuro simples comunica adequadamente a prescrição legal e preserva o sujeito plural não expresso.
- source_word: לוֹ
  choice: para ele
  rationale: 'A preposição ל marca aqui referência ou beneficiário: o período será contado em relação ao sacerdote mencionado.'
theological_decisions:
- issue: Natureza da purificação
  choice: purificação ritual, sem explicitação adicional no corpo do texto
  alternative: limpeza; processo de tornar-se puro
  rationale: O contexto trata do procedimento cultual sacerdotal. A formulação não amplia o sentido para purificação moral ou espiritual.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do hebraico sem perder naturalidade. O pronome possessivo permanece formalmente ambíguo, como no texto-fonte; o contexto identifica o referente sacerdotal.
