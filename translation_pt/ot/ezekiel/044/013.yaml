  text: וְ/לֹֽא יִגְּשׁ֤וּ אֵלַ/י֙ לְ/כַהֵ֣ן לִ֔/י וְ/לָ/גֶ֨שֶׁת֙ עַל כָּל קָ֣דָשַׁ֔/י אֶל קָדְשֵׁ֖י הַ/קְּדָשִׁ֑ים וְ/נָֽשְׂאוּ֙ כְּלִמָּתָ֔/ם וְ/תוֹעֲבוֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/013.yaml
  text: They shall not come near to me to serve as priests for me[a], nor to come near any of my holy things, the most holy things; but they shall bear their shame and the abominations that they have done.
translation:
  language: pt
  text: Eles não se aproximarão de mim para me servirem como sacerdotes, nem se aproximarão de nenhuma das minhas coisas santas, nem das coisas santíssimas[a]. Carregarão sua vergonha e as abominações que praticaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do Santo dos Santos”. A expressão hebraica pode referir-se tanto às coisas santíssimas quanto ao lugar santíssimo; neste contexto, a primeira opção parece mais provável.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְּשׁוּ אֵלַי
  choice: se aproximarão de mim
  rationale: Preserva o sentido cultual de נגשׁ, isto é, entrar em proximidade sagrada, em português natural e digno.
- source_word: לְכַהֵן לִי
  choice: para servir como meus sacerdotes
  rationale: Expressa a função oficial de atuar ou ministrar como sacerdote em favor de Deus, sem acrescentar conteúdo denominacional.
- source_word: וְלָגֶשֶׁת
  choice: nem se aproximarão
  rationale: Repete o mesmo verbo usado anteriormente, preservando a ênfase e a força jurídica da proibição.
- source_word: עַל כָּל קָדָשַׁי
  choice: de nenhuma das minhas coisas santas
  rationale: Trata קָדָשַׁי como plural substantivado referente a coisas consagradas; 'nenhuma' transmite naturalmente a proibição com כָּל.
- source_word: אֶל קָדְשֵׁי הַקְּדָשִׁים
  choice: das coisas santíssimas
  rationale: O contexto imediato favorece a referência a objetos ou ofertas de santidade máxima, embora a expressão também possa designar o lugar santíssimo.
- source_word: וְנָשְׂאוּ
  choice: levarão sobre si
  rationale: Mantém a imagem de carregar ou suportar vergonha e responsabilidade, sem explicitar além do hebraico a natureza exata da consequência.
- source_word: כְּלִמָּתָם
  choice: a sua vergonha
  rationale: Tradução direta de כלמה, adequada ao contexto de desonra decorrente do juízo.
- source_word: וְתוֹעֲבוֹתָם
  choice: as abominações
  rationale: Preserva a força moral e cultual do termo profético תועבות.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que praticaram
  rationale: Em português, 'praticaram' combina naturalmente com 'abominações' e comunica atos passados sem introduzir uma categoria jurídica adicional.
theological_decisions:
- issue: Sentido de קָדְשֵׁי הַקְּדָשִׁים neste contexto
  choice: 'referência a objetos: “as coisas santíssimas”'
  alternative: 'referência espacial: “o Santo dos Santos” ou “o lugar santíssimo”'
  rationale: Por vir depois da proibição de se aproximar das coisas santas de Deus, o contexto favorece uma categoria de objetos ou ofertas santíssimos. A leitura espacial continua genuinamente possível e é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Registro digno e claro; repetição de “se aproximar” mantida por refletir a repetição deliberada do hebraico. O marcador [a] aparece no texto principal.
