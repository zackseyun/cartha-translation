review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a dupla proibição, a exclusão do serviço sacerdotal, a referência às coisas santas/santíssimas e a consequência de carregar vergonha e abominações. Contudo, a segunda ocorrência de אֶל (“a/de... aproximar-se”) merece ser expressa de modo mais claro em português, em vez de fazer “das coisas santíssimas” soar apenas como aposição explicativa.
  naturalness: O texto é claro e de registro apropriado. “Levarão sobre si” é compreensível, mas “carregarão sua vergonha” é mais idiomático e conserva a imagem hebraica. “Para me servirem como sacerdotes” comunica naturalmente a relação expressa por לִי.
  terminology: “Coisas santas”, “coisas santíssimas”, “vergonha” e “abominações” são escolhas adequadas e consistentes com o vocabulário cultual e profético. A nota mantém corretamente a alternativa espacial sem a impor.
  issues:
  - severity: low
    issue: A ligação entre “coisas santas” e “coisas santíssimas” fica excessivamente apositiva.
    rationale: O hebraico repete a preposição antes de קָדְשֵׁי הַקֳּדָשִׁים. A formulação “nem das coisas santíssimas” preserva melhor a segunda proibição e evita apresentar as duas expressões simplesmente como equivalentes.
  - severity: low
    issue: “Levarão sobre si a sua vergonha” é menos natural em português contemporâneo.
    rationale: “Carregarão sua vergonha” mantém o sentido figurado de נשׂא e é mais fluente.
