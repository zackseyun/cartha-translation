  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהֹוָ֗ה בֶּן אָדָ֡ם שִׂ֣ים לִבְּ/ךָ֩ וּ/רְאֵ֨ה בְ/עֵינֶ֜י/ךָ וּ/בְ/אָזְנֶ֣י/ךָ שְּׁמָ֗ע אֵ֣ת כָּל אֲשֶׁ֤ר אֲנִי֙ מְדַבֵּ֣ר אֹתָ֔/ךְ לְ/כָל חֻקּ֥וֹת בֵּית יְהוָ֖ה וּ/לְ/כָל תורת/ו וְ/שַׂמְתָּ֤ לִבְּ/ךָ֙ לִ/מְב֣וֹא הַ/בַּ֔יִת בְּ/כֹ֖ל מוֹצָאֵ֥י הַ/מִּקְדָּֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/005.yaml
  text: And Yahweh said to me[a], “Son of man, set your heart, and see with your eyes, and hear with your ears all that I am speaking to you concerning all the statutes of the house of Yahweh and all its laws[b]. Set your heart on the entrance of the temple and on all the exits of the sanctuary.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “Filho do homem, preste atenção[a], veja com os seus olhos e ouça com os seus ouvidos tudo o que estou dizendo a você a respeito de todos os estatutos da casa de Yahweh e de todas as suas instruções[b]. Preste atenção à entrada do templo e a todas as saídas do santuário.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ponha o seu coração”. O idioma hebraico indica atenção concentrada e envolvimento interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “leis”. O plural hebraico pode designar instruções, prescrições ou regulamentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando sua identificação pessoal e seguindo a decisão teológica fornecida para este projeto.
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma recorrente de tratamento dirigida a Ezequiel, sem acrescentar uma interpretação cristológica ao contexto.
- source_word: שִׂים לִבְּךָ / וְשַׂמְתָּ לִבְּךָ
  choice: preste muita atenção
  rationale: Expressa em português natural o idioma hebraico literal «pôr o coração», que indica atenção concentrada; a repetição foi mantida.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: veja com os seus olhos
  rationale: Mantém a expressão corporal enfática e o paralelismo sensorial do hebraico.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: ouça com os seus ouvidos
  rationale: Conserva a ênfase concreta e o paralelismo com «veja com os seus olhos».
- source_word: לְכָל חֻקּוֹת בֵּית יְהוָה
  choice: a respeito de todos os estatutos da casa de Yahweh
  rationale: Entende לְ como indicador de assunto e preserva «casa de Yahweh» nesta primeira ocorrência.
- source_word: תורתו
  choice: suas instruções
  rationale: No contexto cultual, תּוֹרֹת pode abranger prescrições e orientações, não apenas leis em sentido legislativo estrito.
- source_word: לִמְבוֹא הַבַּיִת
  choice: à entrada do templo
  rationale: Traduz מָבוֹא como «entrada» e verte הַבַּיִת contextualmente como «templo», por se tratar do acesso ao complexo sagrado.
- source_word: בְּכֹל מוֹצָאֵי הַמִּקְדָּשׁ
  choice: a todas as saídas do santuário
  rationale: מוֹצָאִים designa lugares de saída; «santuário» é a equivalência cultual natural de מִקְדָּשׁ.
theological_decisions:
- issue: Representação do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome próprio explícito conforme a política de termos contestados indicada nos dados do projeto.
- issue: Sentido de בֶּן אָדָם em Ezequiel
  choice: Filho do homem
  alternative: ser humano; mortal
  rationale: Preserva o tratamento profético recorrente e sua continuidade literária, sem resolver o termo por uma paráfrase nem importar sentidos posteriores.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Optou-se por naturalizar o idioma «pôr o coração» no texto principal, preservando sua forma literal em nota, e por manter as expressões sensoriais enfáticas e a repetição retórica do original.
