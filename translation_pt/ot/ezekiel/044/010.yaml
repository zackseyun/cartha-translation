source:
  edition: WLC
  text: כִּ֣י אִם הַ/לְוִיִּ֗ם אֲשֶׁ֤ר רָֽחֲקוּ֙ מֵֽ/עָלַ֔/י בִּ/תְע֤וֹת יִשְׂרָאֵל֙ אֲשֶׁ֣ר תָּע֣וּ מֵֽ/עָלַ֔/י אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/010.yaml
  text: But the Levites who went far from me when Israel went astray[a], who went astray from me after their idols, shall bear their iniquity.
translation:
  language: pt
  text: Mas os levitas que se afastaram de mim quando Israel se desviou, e que se desviaram de mim para seguir os seus ídolos, levarão sobre si a sua iniquidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arcarão com a sua culpa” ou “sofrerão a punição pela sua iniquidade”. A expressão hebraica abrange tanto a culpabilidade quanto a consequência que dela resulta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: No contexto, a expressão introduz um contraste com a restrição anterior; “Mas” é natural e preserva essa função discursiva.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: O hebraico designa especificamente os levitas, em contraste contextual com os sacerdotes zadoquitas.
- source_word: רָחֲקוּ מֵעָלַי
  choice: se afastaram de mim
  rationale: Expressa de modo natural tanto o distanciamento quanto a ruptura relacional e pactual sugerida pelo hebraico.
- source_word: בִּתְעוֹת יִשְׂרָאֵל
  choice: quando Israel se desviou
  rationale: A construção com בְּ e o infinitivo indica a circunstância temporal; a formulação é clara em português.
- source_word: תָּעוּ מֵעָלַי
  choice: se desviaram de mim
  rationale: Preserva a repetição da raiz תעה e seu sentido moral e religioso.
- source_word: אַחֲרֵי גִּלּוּלֵיהֶם
  choice: para seguir os seus ídolos
  rationale: Comunica idiomaticamente o sentido de seguir após algo, enquanto “ídolos” evita ampliar indevidamente o caráter pejorativo de גִּלּוּלִים.
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: levarão sobre si a sua iniquidade
  rationale: Mantém a imagem hebraica de carregar e preserva a amplitude de עָוֺן, que pode abranger iniquidade, culpa e suas consequências.
theological_decisions:
- issue: Sentido do idioma de juízo וְנָשְׂאוּ עֲוֺנָם
  choice: levarão sobre si a sua iniquidade
  alternative: arcarão com a sua culpa; sofrerão a punição pela sua iniquidade
  rationale: A formulação principal conserva a tensão do idioma hebraico entre culpabilidade e consequência penal, sem restringi-lo apenas à punição. A nota esclarece essa amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “se desviaram” foi mantida por corresponder à repetição intencional da mesma raiz hebraica. O pronome “seus” refere-se a Israel coletivamente, como no texto-fonte.
