  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶֽת הַ/נָּשִׂ֗יא נָ֥שִׂיא ה֛וּא יֵֽשֶׁב בּ֥/וֹ לֶ/אֱכָול לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה מִ/דֶּ֨רֶךְ אֻלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/מִ/דַּרְכּ֖/וֹ יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/003.yaml
  text: As for the prince[a], because he is the prince, he may sit in it to eat bread before Yahweh. He shall enter by way of the porch of the gate, and shall go out by the same way.
translation:
  language: pt
  text: Quanto ao príncipe, por ser ele o príncipe, poderá sentar-se ali para comer pão diante de Yahweh. Entrará pelo pórtico do portão e sairá pelo mesmo caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sairá pelo seu caminho”; provavelmente, “sairá pelo caminho por onde entrou”.'
    reason: Preserva a formulação literal ambígua do hebraico e informa sua interpretação contextual mais provável.
lexical_decisions:
- source_word: אֶת הַנָּשִׂיא
  choice: Quanto ao príncipe
  rationale: A construção topicalizada destaca o príncipe; “Quanto ao” preserva essa ênfase em português natural.
- source_word: נָשִׂיא הוּא
  choice: por ser ele o príncipe
  rationale: Conserva a repetição enfática e exprime adequadamente o valor causal que fundamenta a permissão excepcional.
- source_word: יֵשֶׁב בּוֹ
  choice: poderá sentar-se ali
  rationale: O imperfeito indica ação permitida no contexto. “Ali” retoma naturalmente o espaço do portão mencionado no contexto imediato.
- source_word: לֶאֱכָל לֶחֶם
  choice: para comer pão
  rationale: Mantém a formulação concreta do hebraico, que também pode designar uma refeição, sem apagar seu tom cultual.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva simultaneamente o sentido espacial e litúrgico da expressão e translitera explicitamente o nome divino.
- source_word: מִדֶּרֶךְ אֻלָם הַשַּׁעַר
  choice: pelo pórtico do portão
  rationale: “Pórtico” comunica a estrutura arquitetônica designada por אֻלָם, e “pelo” expressa de modo idiomático a rota de entrada.
- source_word: וּמִדַּרְכּוֹ יֵצֵא
  choice: e sairá pelo mesmo caminho
  rationale: A forma com sufixo provavelmente remete à rota recém-indicada; a tradução principal torna essa referência natural, enquanto a nota preserva a expressão hebraica e a alternativa contextual.
theological_decisions:
- issue: Identidade do נָשִׂיא na visão do templo de Ezequiel
  choice: príncipe
  alternative: governante; líder; identificação explícita como Messias
  rationale: O título é traduzido de modo neutro, sem decidir se a figura deve ser identificada como messiânica ou apenas como autoridade davídica ou cívica, questão que este versículo não resolve.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Mantêm-se a topicalização de “príncipe”, o idiomatismo “comer pão” e o tom normativo da visão cultual.
