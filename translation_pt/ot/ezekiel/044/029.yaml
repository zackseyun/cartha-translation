base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/029.yaml
  text: They shall eat the grain offering[a], the sin offering, and the guilt offering[b], and every devoted thing in Israel shall be theirs.
translation:
  language: pt
  text: Eles comerão a oferta de cereal, a oferta pelo pecado[a] e a oferta pela culpa; e tudo o que for consagrado[b] em Israel pertencerá a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a oferta de purificação”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico ḥerem indica algo irrevogavelmente separado para Deus; em outros contextos, pode referir-se ao que é destinado à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente a oferta feita de cereais, e não uma oferta genérica. A expressão distingue esta categoria das ofertas seguintes.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: Nesta enumeração de sacrifícios, חַטָּאת designa a oferta relacionada ao pecado e à purificação. “Oferta pelo pecado” é a formulação tradicional e transparente; a alternativa contextual é indicada em nota.
- source_word: הָאָשָׁם
  choice: a oferta pela culpa
  rationale: אָשָׁם designa o sacrifício ligado à culpa, à responsabilidade e, frequentemente, à reparação. “Oferta pela culpa” preserva a categoria cultual sem ampliar indevidamente o sentido.
- source_word: הֵמָּה יֹאכְלוּם
  choice: Eles comerão
  rationale: O pronome explícito dá ênfase aos sacerdotes, e o sufixo verbal retoma as ofertas enumeradas. Em português, “Eles comerão” comunica isso naturalmente sem repetir o objeto.
- source_word: חֵרֶם
  choice: tudo o que for consagrado
  rationale: חֵרֶם indica algo irrevogavelmente separado para Deus. Neste contexto de direitos sacerdotais, “consagrado” evita a conotação bélica de destruição, enquanto a nota preserva o alcance técnico do termo.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: A expressão indica o âmbito em que se encontram as coisas consagradas; “em Israel” é natural e preciso.
- source_word: לָהֶם יִהְיֶה
  choice: pertencerá a eles
  rationale: A construção hebraica expressa posse ou direito. “Pertencerá a eles” explicita com naturalidade o direito sacerdotal.
theological_decisions:
- issue: Terminologia sacrificial no contexto das porções destinadas aos sacerdotes
  choice: 'Manter categorias cultuais distintas: “oferta de cereal”, “oferta pelo pecado” e “oferta pela culpa”.'
  alternative: Empregar termos mais interpretativos, como “oferta de purificação” e “oferta de reparação”.
  rationale: O versículo enumera classes específicas de sacrifícios. Preservar essas distinções mantém a estrutura legal e teológica do texto sem impor uma interpretação doutrinária posterior.
- issue: Sentido de חֵרֶם neste contexto
  choice: Traduzir no texto principal como “tudo o que for consagrado”.
  alternative: “toda coisa dedicada” ou “tudo o que for destinado à destruição”.
  rationale: O contexto trata daquilo que cabe aos sacerdotes, não de guerra ou destruição. A tradução comunica a separação para Deus, e a nota registra a amplitude semântica do termo.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial reconhecível. A ordem hebraica foi preservada, e a formulação jurídica final foi vertida de modo natural. As notas aparecem junto aos termos a que se referem.
