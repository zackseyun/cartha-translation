source:
  edition: WLC
  text: וְ/הָי֤וּ בְ/מִקְדָּשִׁ/י֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל שַׁעֲרֵ֣י הַ/בַּ֔יִת וּֽ/מְשָׁרְתִ֖ים אֶת הַ/בָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת הָ/עֹלָ֤ה וְ/אֶת הַ/זֶּ֨בַח֙ לָ/עָ֔ם וְ/הֵ֛מָּה יַעַמְד֥וּ לִ/פְנֵי/הֶ֖ם לְ/שָֽׁרְתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/011.yaml
  text: Yet they shall be ministers in my sanctuary[a], having oversight at the gates of the temple and ministering in the temple. They shall slaughter the burnt offering and the sacrifice for the people[c][b], and they shall stand before them to minister to them.
translation:
  language: pt
  text: 'Contudo, eles servirão no meu santuário: terão encargos junto aos portões do templo[a] e prestarão serviço no templo. Abaterão o holocausto e o sacrifício em favor do povo[b] e ficarão diante deles para servi-los.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “responsabilidades”, “supervisão” ou “tarefas designadas” junto aos portões do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “para o povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Contudo, eles servirão
  rationale: O contexto anterior cria contraste entre a proibição de se aproximarem como sacerdotes e a permissão para desempenharem funções subordinadas. “Contudo” expressa essa relação, e “servirão” comunica naturalmente a função cultual.
- source_word: בְמִקְדָּשִׁי מְשָׁרְתִים
  choice: servirão no meu santuário
  rationale: O particípio de שׁרת indica serviço cultual. Em português, “servirão no meu santuário” é claro, digno e mais natural que “serão ministros” neste contexto.
- source_word: פְּקֻדּוֹת
  choice: encarregados
  rationale: O substantivo denota encargo, responsabilidade ou supervisão atribuída. “Encarregados” preserva a ideia funcional sem definir excessivamente se a tarefa era guarda ou supervisão.
- source_word: שַׁעֲרֵי הַבַּיִת
  choice: dos portões do templo
  rationale: Na visão de Ezequiel, הַבַּיִת designa o templo. “Portões” corresponde ao plural e “templo” esclarece o referente.
- source_word: וּמְשָׁרְתִים אֶת הַבָּיִת
  choice: e do serviço no templo
  rationale: A formulação evita a repetição pesada de “servirão” e mantém o sentido de exercer serviço relacionado ao templo.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo cultual português tradicional e preciso para a oferta inteiramente queimada.
- source_word: הַזֶּבַח
  choice: o sacrifício
  rationale: O termo é genérico aqui; “sacrifício” não o restringe indevidamente a uma espécie específica de oferta.
- source_word: לָעָם
  choice: em favor do povo
  rationale: A preposição ל pode indicar benefício ou referência. “Em favor do povo” explicita essa relação sem afirmar que os levitas agiam necessariamente como representantes sacerdotais.
- source_word: יַעַמְדוּ לִפְנֵיהֶם
  choice: ficarão diante deles
  rationale: A tradução preserva a expressão hebraica e sua possível nuance de prontidão para atender o povo.
- source_word: לְשָׁרְתָם
  choice: para servi-los
  rationale: O sufixo plural refere-se ao povo. “Servi-los” é natural e mantém o objeto humano explícito.
theological_decisions:
- issue: Função dos levitas afastados do sacerdócio pleno
  choice: Eles recebem tarefas subordinadas de serviço no santuário, sem acesso às funções sacerdotais reservadas no contexto.
  alternative: Eles continuam exercendo plenamente o ministério sacerdotal.
  rationale: O contexto imediato distingue esses levitas dos sacerdotes autorizados a se aproximar do SENHOR. As funções descritas aqui — encargos nos portões, serviço no templo, abate das ofertas e atendimento ao povo — são compatíveis com uma função cultual subordinada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Santuário”, “templo”, “holocausto” e “sacrifício” preservam o registro cultual. A repetição hebraica de שׁרת foi parcialmente variada para produzir uma frase natural, sem apagar a recorrência temática do serviço.
