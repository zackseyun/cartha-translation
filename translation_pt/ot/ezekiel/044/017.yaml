source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/בוֹאָ/ם֙ אֶֽל שַׁעֲרֵי֙ הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים יִלְבָּ֑שׁוּ וְ/לֹֽא יַעֲלֶ֤ה עֲלֵי/הֶם֙ צֶ֔מֶר בְּ/שָֽׁרְתָ֗/ם בְּ/שַׁעֲרֵ֛י הֶ/חָצֵ֥ר הַ/פְּנִימִ֖ית וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/017.yaml
  text: And when they enter the gates of the inner court[a], they shall wear linen garments[b]; no wool shall come upon them while they minister in the gates of the inner court and in the house.
translation:
  language: pt
  text: Quando entrarem pelos portões do pátio interno, vestirão roupas de linho; não haverá lã sobre eles[a] enquanto ministrarem nos portões do pátio interno e dentro do templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não usarão lã”. Mais literalmente, o hebraico diz: “não subirá lã sobre eles”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “a casa”, referência ao edifício do templo.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּבוֹאָם
  choice: Quando entrarem
  rationale: A fórmula introdutória seguida de preposição, infinitivo e sufixo estabelece uma circunstância temporal. A forma portuguesa é natural e preserva o valor futuro da prescrição.
- source_word: שַׁעֲרֵי הֶחָצֵר הַפְּנִימִית
  choice: pelos portões do pátio interno
  rationale: O sintagma designa os pontos de acesso ao pátio interno. “Entrar pelos portões” expressa de modo idiomático o movimento indicado por אֶל.
- source_word: בִּגְדֵי פִשְׁתִּים
  choice: roupas de linho
  rationale: פִשְׁתִּים indica linho, material produzido do talo do linho. “Roupas de linho” é claro e corrente em português.
- source_word: יִלְבָּשׁוּ
  choice: vestirão
  rationale: O verbo לבשׁ pode significar vestir ou usar uma roupa. O futuro em português apresenta adequadamente a norma prescrita.
- source_word: וְלֹא יַעֲלֶה עֲלֵיהֶם צֶמֶר
  choice: não haverá lã sobre eles
  rationale: A formulação conserva a imagem incomum do hebraico, literalmente “não subirá lã sobre eles”, sem acrescentar um substantivo como “roupa” que não está expresso.
- source_word: בְּשָׁרְתָם
  choice: enquanto ministrarem
  rationale: A construção assinala o período em que exercem o serviço sacerdotal. “Ministrar” preserva o caráter cultual sem ampliar o conteúdo teológico.
- source_word: וָבָיְתָה
  choice: e dentro do templo
  rationale: A forma com ה direcional/locativo aponta para o interior da “casa”, isto é, o edifício do templo. “Dentro do templo” comunica o contraste espacial com os portões do pátio.
theological_decisions:
- issue: Terminologia do serviço sacerdotal
  choice: ministrarem
  alternative: servirem
  rationale: “Ministrar” mantém a nuance de serviço cultual própria do contexto, sem introduzir uma doutrina denominacional.
- issue: Referente de בַּיִת (“casa”)
  choice: templo
  alternative: casa
  rationale: No contexto da visão de Ezequiel, “a casa” designa o edifício do templo. A tradução torna o referente inteligível, enquanto a nota registra a expressão hebraica.
- issue: Proibição referente à lã
  choice: não haverá lã sobre eles
  alternative: não usarão lã
  rationale: A opção escolhida preserva a formulação concreta e algo incomum do hebraico, evitando restringir explicitamente a referência a uma peça de roupa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural para o público brasileiro e compreensão internacional. Mantém-se a imagem hebraica na proibição da lã, explicada em nota, e explicita-se no texto o referente contextual de “casa”.
