  text: וְ/לֹ֥א שְׁמַרְתֶּ֖ם מִשְׁמֶ֣רֶת קָדָשָׁ֑/י וַ/תְּשִׂימ֗וּ/ן לְ/שֹׁמְרֵ֧י מִשְׁמַרְתִּ֛/י בְּ/מִקְדָּשִׁ֖/י לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/008.yaml
  text: You have not kept charge of my holy things[a], but have appointed others to keep charge in my sanctuary for you.
translation:
  language: pt
  text: Vocês não desempenharam o encargo relativo às minhas coisas sagradas, mas designaram outros para desempenhar o meu encargo no meu santuário por vocês[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em lugar de vocês”, indicando que outros foram designados para desempenhar o encargo no santuário em substituição a vocês.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַרְתֶּם מִשְׁמֶרֶת
  choice: cumpriram a responsabilidade de cuidar
  rationale: A combinação idiomática expressa o desempenho fiel de uma incumbência cultual, não apenas vigilância física. A formulação portuguesa preserva tanto a ideia de responsabilidade confiada quanto a de cuidado.
- source_word: קָדָשָׁי
  choice: minhas coisas sagradas
  rationale: O plural com sufixo pode abranger objetos, assuntos, ritos e responsabilidades sagradas pertencentes a Deus; a expressão evita restringir indevidamente o referente.
- source_word: וַתְּשִׂימוּן
  choice: designaram
  rationale: Embora o verbo signifique literalmente pôr ou colocar, no contexto indica a atribuição de uma função a outras pessoas.
- source_word: לְשֹׁמְרֵי מִשְׁמַרְתִּי
  choice: para assumir ... a responsabilidade
  rationale: O particípio e o substantivo descrevem pessoas encarregadas de cumprir uma incumbência. “Assumir a responsabilidade” comunica essa função com naturalidade em português.
- source_word: בְּמִקְדָּשִׁי
  choice: no meu santuário
  rationale: “Santuário” mantém a precisão cultual de מִקְדָּשׁ no contexto do templo de Ezequiel.
- source_word: לָכֶם
  choice: por vocês
  rationale: A expressão pode indicar atuação em benefício dos destinatários ou em lugar deles. “Por vocês” conserva em português essa relativa abertura contextual.
theological_decisions:
- issue: Alcance de “minhas coisas sagradas”
  choice: Referência ampla às coisas e aos assuntos sagrados confiados aos responsáveis pelo santuário
  alternative: Referência restrita apenas a objetos santos ou, no outro extremo, apenas ao ofício sagrado
  rationale: O hebraico é abrangente e o contexto censura a negligência na administração do culto; por isso, a tradução não limita o sentido a uma única categoria.
- issue: Relação expressa por לָכֶם
  choice: “por vocês”, mantendo aberta a noção de representação ou substituição
  alternative: “em favor de vocês” ou “em lugar de vocês”
  rationale: A preposição admite mais de uma nuance contextual. O texto principal preserva a ambiguidade, enquanto a nota explicita a leitura substitutiva mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “responsabilidade” reflete deliberadamente a repetição hebraica de מִשְׁמֶרֶת, enquanto “coisas sagradas” mantém amplo o objeto da incumbência.
