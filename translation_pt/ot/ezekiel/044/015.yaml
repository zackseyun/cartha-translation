source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם בְּנֵ֣י צָד֗וֹק אֲשֶׁ֨ר שָׁמְר֜וּ אֶת מִשְׁמֶ֤רֶת מִקְדָּשִׁ/י֙ בִּ/תְע֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵֽ/עָלַ֔/י הֵ֛מָּה יִקְרְב֥וּ אֵלַ֖/י לְ/שָֽׁרְתֵ֑/נִי וְ/עָמְד֣וּ לְ/פָנַ֗/י לְ/הַקְרִ֥יב לִ/י֙ חֵ֣לֶב וָ/דָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/015.yaml
  text: But the Levitical priests[a], the sons of Zadok, who kept the charge of my sanctuary when the sons of Israel went astray from me—they shall come near to me to minister to me, and they shall stand before me to offer to me fat and blood[c][b], declares the Lord GOD.
translation:
  language: pt
  text: Mas os sacerdotes levitas[a], os filhos de Zadoque, que cumpriram o encargo do meu santuário quando os filhos de Israel se desviaram de mim, eles se aproximarão de mim para me servir e estarão diante de mim para me oferecer gordura e sangue — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sacerdotes, os levitas”. O hebraico também pode ser entendido como uma construção apositiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים הַלְוִיִּם
  choice: Mas os sacerdotes levitas
  rationale: O וְ introduz contraste com a exclusão anterior, por isso “Mas”. “Sacerdotes levitas” é natural em português, enquanto a leitura apositiva é preservada em nota.
- source_word: בְּנֵי צָדוֹק
  choice: os filhos de Zadoque
  rationale: Mantém de modo formal a linguagem hebraica de linhagem, sem eliminar sua expressão familiar.
- source_word: שָׁמְרוּ אֶת מִשְׁמֶרֶת מִקְדָּשִׁי
  choice: cumpriram o encargo do meu santuário
  rationale: מִשְׁמֶרֶת denota responsabilidade ou dever confiado no contexto sacerdotal; “cumpriram o encargo” comunica melhor essa obrigação do que apenas “guardaram”.
- source_word: בִּתְעוֹת ... מֵעָלַי
  choice: quando ... se desviaram de mim
  rationale: A construção indica a circunstância temporal, e “desviar-se de” preserva o sentido moral e religioso da apostasia.
- source_word: הֵמָּה יִקְרְבוּ אֵלַי
  choice: eles se aproximarão de mim
  rationale: O pronome explícito é mantido para representar a ênfase hebraica; “aproximar-se” preserva a ressonância cultual de קָרַב.
- source_word: לְשָׁרְתֵנִי
  choice: para me servir
  rationale: No contexto, o verbo designa serviço sacerdotal. “Servir” é claro, digno e natural em português, sem perder o caráter sacro dado pelo contexto.
- source_word: וְעָמְדוּ לְפָנַי
  choice: e ficarão diante de mim
  rationale: Preserva a postura cultual de comparecer e permanecer na presença de Deus.
- source_word: לְהַקְרִיב לִי חֵלֶב וָדָם
  choice: para me oferecer gordura e sangue
  rationale: O Hifil de קרב tem sentido sacrificial de apresentar/oferecer; “gordura e sangue” identifica formalmente as porções sacrificiais.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם é uma fórmula profética de pronunciamento. “Yahweh” representa diretamente o nome divino no título composto, evitando “Senhor SENHOR”.
theological_decisions:
- issue: Representação de יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR / Senhor DEUS
  rationale: O texto contém o nome divino, não o substantivo comum “Deus”. “Senhor Yahweh” preserva a distinção entre אֲדֹנָי e יהוה e evita a duplicação pouco natural “Senhor SENHOR”.
- issue: Identidade dos sacerdotes em וְהַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  alternative: os sacerdotes, os levitas
  rationale: A construção pode ser entendida atributiva ou apositivamente. O texto principal usa a formulação portuguesa mais fluente, e a alternativa formal é registrada em nota sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a ênfase do pronome “eles” e o vocabulário cultual sem recorrer a formulações excessivamente arcaicas.
