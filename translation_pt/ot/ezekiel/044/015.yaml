  terminology: “Sacerdotes levitas”, “encargo”, “santuário”, “se desviaram”, “se aproximarão”, “servir”, “gordura e sangue” e “Senhor Yahweh” são escolhas adequadas ao contexto sacerdotal e ao título divino hebraico. “Estarão diante de mim” preserva melhor o verbo cultual de postura/comparecimento.
