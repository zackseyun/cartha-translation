  text: וְ/אָמַרְתָּ֤ אֶל מֶ֨רִי֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רַב לָ/כֶ֛ם מִֽ/כָּל תּוֹעֲבֽוֹתֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/006.yaml
  text: 'And say to the rebellious house[a], to the house of Israel, ‘Thus says the Lord GOD: Enough of all your abominations, O house of Israel.’'
translation:
  language: pt
  text: 'E diga à casa rebelde[a], à casa de Israel: “Assim diz o Senhor Yahweh: Basta de todas as suas abominações, ó casa de Israel!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “à rebeldia” ou “ao rebelde”. O substantivo pode ser entendido abstratamente como “rebeldia” ou, no contexto, coletivamente como “a casa rebelde” ou “o povo rebelde”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרִי
  choice: a rebelde
  rationale: O substantivo pode indicar rebeldia ou, por metonímia, uma entidade coletiva rebelde. O feminino singular concorda naturalmente com a explicação aposta “a casa de Israel”, preservando a forma singular do hebraico sem acrescentar “casa” à primeira expressão.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a designação nacional e pactual tradicional, além da relação de aposição presente no hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e preserva explicitamente o nome pactual.
- source_word: רַב לָכֶם
  choice: Basta
  rationale: 'Expressão portuguesa natural que comunica a censura enfática do idioma hebraico: eles já foram longe demais.'
- source_word: מִכָּל תּוֹעֲבוֹתֵיכֶם
  choice: de todas as suas abominações
  rationale: Liga-se idiomaticamente a “Basta” e conserva tanto a totalidade quanto o possessivo plural do hebraico.
- source_word: תּוֹעֲבוֹתֵיכֶם
  choice: suas abominações
  rationale: “Abominações” mantém a forte carga cultual e moral do termo no contexto da pureza do templo em Ezequiel.
theological_decisions:
- issue: Forma do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução explicita o nome divino יהוה e, ao mesmo tempo, traduz אֲדֹנָי como título, evitando fundir os dois elementos.
- issue: Identidade do destinatário em מֶרִי
  choice: a rebelde, identificada em seguida como a casa de Israel
  alternative: à rebeldia / ao povo rebelde / à casa rebelde
  rationale: Preserva a possível personificação coletiva e o singular hebraico, sem resolver o substantivo abstrato como se o texto trouxesse explicitamente “casa” ou “povo”.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem e a repetição de “casa de Israel” foram mantidas por sua força retórica; “ó” marca o vocativo final. A nota conserva a ambiguidade lexical de מֶרִי.
