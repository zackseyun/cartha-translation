  text: וּ/בְ/יוֹם֩ בֹּא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ אֶל הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ יַקְרִ֖יב חַטָּאת֑/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/027.yaml
  text: And on the day he enters the sanctuary[a], into the inner court, to minister in the sanctuary, he shall present his sin offering, declares the Lord GOD.
translation:
  language: pt
  text: E, no dia em que ele entrar no santuário, no pátio interno, para ministrar no santuário, apresentará sua oferta pelo pecado[a] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua oferta de purificação”. Em contextos sacrificiais, o hebraico חַטָּאת pode designar a oferta relacionada ao pecado e à purificação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם
  choice: E, no dia
  rationale: A conjunção mantém a ligação com as normas anteriores, e a construção com בְּ + יוֹם tem sentido temporal específico.
- source_word: בֹּאוֹ
  choice: em que ele entrar
  rationale: O infinitivo construto com sufixo funciona temporalmente; esta formulação é natural em português e preserva o sujeito e a ação.
- source_word: אֶל־הַקֹּדֶשׁ
  choice: no santuário
  rationale: קֹדֶשׁ designa aqui o recinto sagrado; 'santuário' é claro sem especificar indevidamente uma câmara particular.
- source_word: אֶל־הֶחָצֵר הַפְּנִימִית
  choice: no pátio interno
  rationale: A segunda expressão com אֶל especifica mais precisamente o destino, em aposição a 'santuário'.
- source_word: לְשָׁרֵת
  choice: para ministrar
  rationale: No contexto sacerdotal, שׁרת indica serviço litúrgico; 'ministrar' conserva essa nuance cultual.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: A repetição de קֹדֶשׁ é mantida de modo consistente e natural.
- source_word: יַקְרִיב
  choice: apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer; 'apresentará' preserva a ideia de levar a oferta diante de Deus.
- source_word: חַטָּאתוֹ
  choice: sua oferta pelo pecado
  rationale: Com יקריב, חַטָּאת designa o sacrifício, não simplesmente o pecado. A tradução tradicional é clara, enquanto a alternativa 'oferta de purificação' é registrada em nota.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração divina solene. 'Yahweh' representa diretamente o nome divino, e 'Senhor' traduz אֲדֹנָי sem produzir a repetição 'Senhor SENHOR'.
theological_decisions:
- issue: Tradução do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A expressão contém o título אֲדֹנָי e o nome pessoal יְהוִה. A tradução mantém ambos distintamente e preserva o nome da aliança sem confundi-lo com o título.
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode destacar tanto o pecado tratado pelo sacrifício quanto seu efeito purificador. O texto principal emprega a designação mais reconhecível, e a nota conserva a alternativa lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário cultual acessível. A repetição de 'santuário' e a aposição 'no pátio interno' foram preservadas para refletir a estrutura hebraica sem tornar a frase artificial.
