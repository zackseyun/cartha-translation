source:
  edition: WLC
  text: וְ/עַל רִ֗יב הֵ֚מָּה יַעַמְד֣וּ ל/שפט בְּ/מִשְׁפָּטַ֖/י ו/שפט/הו וְ/אֶת תּוֹרֹתַ֤/י וְ/אֶת חֻקֹּתַ/י֙ בְּ/כָל מוֹעֲדַ֣/י יִשְׁמֹ֔רוּ וְ/אֶת שַׁבְּתוֹתַ֖/י יְקַדֵּֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
translation:
  language: pt
  text: Numa disputa[a], eles se apresentarão para julgar e a julgarão segundo os meus juízos. Guardarão as minhas leis e os meus estatutos em todas as minhas ocasiões designadas[b] e santificarão os meus sábados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “causa”, “controvérsia” ou “processo”.
    reason: lexical_alternative
  - marker: b
    text: “Minhas ocasiões designadas” também pode ser traduzido como “minhas festas designadas” ou “meus tempos fixados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: disputa
  rationale: O termo designa uma contenda ou causa de caráter jurídico; “disputa” é natural e mantém a amplitude do hebraico.
- source_word: יַעַמְדוּ
  choice: se apresentarão
  rationale: עמד significa literalmente “ficar de pé”, mas, neste contexto judicial, exprime tomar posição ou comparecer para exercer julgamento; “se apresentarão” comunica essa imagem funcional em português natural.
- source_word: לשפט
  choice: para julgar
  rationale: O infinitivo expressa finalidade, preservada de modo direto.
- source_word: בְּמִשְׁפָּטַי
  choice: segundo os meus juízos
  rationale: No contexto forense, מִשְׁפָּטַי indica os juízos ou padrões judiciais de Deus; “segundo” explicita a norma pela qual a causa deve ser decidida.
- source_word: ושפטהו
  choice: e a julgarão
  rationale: O sufixo retoma רִיב, traduzido pelo feminino “disputa”; mantém-se também a repetição do verbo שפט.
- source_word: תּוֹרֹתַי
  choice: as minhas leis
  rationale: Embora תּוֹרָה também possa significar instrução, o contexto sacerdotal e normativo favorece “leis”.
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: O termo designa prescrições ou decretos estabelecidos; “estatutos” preserva o registro jurídico e o distingue de תּוֹרֹתַי.
- source_word: בְּכָל מוֹעֲדַי
  choice: em todos os meus tempos determinados
  rationale: מוֹעֵד pode designar tanto um tempo fixado como uma celebração marcada; a formulação ampla preserva essa possibilidade sem restringi-la apenas a festas.
- source_word: יִשְׁמֹרוּ
  choice: guardarão
  rationale: שמר, em contexto pactual e legal, significa observar cuidadosamente ou guardar; “guardarão” conserva esse registro bíblico sem deixar de ser compreensível.
- source_word: שַׁבְּתוֹתַי
  choice: os meus sábados
  rationale: Mantém o plural explícito e a relação possessiva do texto.
- source_word: יְקַדֵּשׁוּ
  choice: santificarão
  rationale: O piel de קדש significa santificar ou tratar como santo; “santificarão” reproduz diretamente a ação exigida.
theological_decisions:
- issue: Distinção entre os termos legais da instrução sacerdotal
  choice: Manter “juízos”, “leis” e “estatutos” como termos distintos.
  alternative: Uniformizar os três termos como “normas”, “regras” ou “mandamentos”.
  rationale: O hebraico emprega vocabulário jurídico relacionado, porém não idêntico; preservar a distinção evita reduzir a textura legal e teológica do texto.
- issue: Amplitude cultual de מוֹעֵד
  choice: Traduzir como “tempos determinados”, com nota sobre “festas determinadas”.
  alternative: Traduzir diretamente como “festas determinadas”.
  rationale: O substantivo pode indicar tempos fixados e, em contexto cultual, festas ou assembleias marcadas. A tradução principal mantém a amplitude lexical, enquanto a nota registra a leitura cultual mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A redação conserva o tom jurídico-sacerdotal e a repetição de “julgar”, evitando arcaísmos desnecessários. Todos os marcadores de nota aparecem no texto.
