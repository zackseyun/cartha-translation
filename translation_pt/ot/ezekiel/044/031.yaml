base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/031.yaml
  text: The priests shall not eat any carcass or animal torn by beasts[a], whether from birds or from livestock.
translation:
  language: pt
  text: Os sacerdotes não comerão nenhuma carcaça nem animal dilacerado[a], quer de aves, quer de animais domésticos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «animal que morreu por si mesmo ou que foi dilacerado por feras».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: nenhuma
  rationale: Com substantivos singulares em uma proibição, o português pede naturalmente «nenhuma», que conserva a abrangência de כָּל em combinação com a negação.
- source_word: נְבֵלָה
  choice: carcaça
  rationale: Designa o cadáver de um animal, especialmente um animal que não foi abatido de modo apropriado; «carcaça» é claro e adequado ao contexto alimentar.
- source_word: טְרֵפָה
  choice: animal dilacerado
  rationale: O termo indica um animal despedaçado ou dilacerado, normalmente por uma fera; a formulação preserva o sentido concreto sem inserir no texto principal um agente que o hebraico não explicita.
- source_word: מִן הָעוֹף
  choice: de ave
  rationale: עוֹף abrange aves ou criaturas voadoras; no contraste alimentar deste versículo, «ave» é uma expressão moderna e natural.
- source_word: וּמִן הַבְּהֵמָה
  choice: de animal doméstico
  rationale: בְּהֵמָה, em contraste com as aves, refere-se amplamente aos animais terrestres, em especial os domesticados; «animal doméstico» evita restringir o sentido apenas ao gado bovino.
- source_word: לֹא יֹאכְלוּ
  choice: não comerão
  rationale: O imperfeito com לֹא, neste contexto legal, expressa proibição; o futuro em português mantém a força normativa e o registro solene.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: É uma referência definida à classe sacerdotal no contexto das normas do templo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção paralela «seja de ave, seja de animal doméstico» reproduz naturalmente as duas categorias introduzidas por מִן. O marcador [a] aparece imediatamente após a expressão à qual a alternativa lexical se refere.
