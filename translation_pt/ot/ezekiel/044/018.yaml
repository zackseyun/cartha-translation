base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/018.yaml
  text: Linen turbans shall be on their heads[a], and linen undergarments shall be on their loins; they shall not gird themselves with anything that causes sweat.
translation:
  language: pt
  text: Usarão turbantes de linho na cabeça e roupas de baixo de linho na cintura. Não se cingirão com algo que provoque suor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não se cingirão com suor”. O hebraico é elíptico; o sentido provável é que não devem prender ou usar as vestes com algo que provoque transpiração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּאֲרֵי
  choice: turbantes
  rationale: No contexto das vestes sacerdotais, o substantivo designa uma cobertura de cabeça; “turbantes” é claro, específico e compatível com a expressão “na cabeça”.
- source_word: פִשְׁתִּים
  choice: linho
  rationale: Em contexto de vestuário, refere-se ao tecido de linho, não à planta ou fibra bruta. A repetição do hebraico foi preservada.
- source_word: מִכְנְסֵי
  choice: roupas de baixo
  rationale: Designa a peça sacerdotal usada junto ao corpo na parte inferior. A expressão é moderna e compreensível, sem determinar além do texto o corte exato da peça.
- source_word: מָתְנֵיהֶם
  choice: sobre os quadris
  rationale: O termo indica a região dos lombos ou quadris. “Quadris” comunica naturalmente a localização da peça em português atual.
- source_word: יַחְגְּרוּ
  choice: se cingirão
  rationale: Preserva a ação específica de prender ou ajustar uma veste ao redor do corpo, com registro digno e inteligível no contexto cultual.
- source_word: בַּיָּזַע
  choice: de modo que transpirem
  rationale: A expressão hebraica é elíptica, literalmente próxima de “com suor”. Esta formulação transmite a provável força do preceito sem especificar um material não mencionado.
theological_decisions:
- issue: Regulamentação das vestes sacerdotais e sentido da expressão final
  choice: Entender a cláusula como proibição de cingir as vestes de maneira que provoque transpiração.
  alternative: Traduzir literalmente “não se cingirão com suor” ou interpretar especificamente como proibição de lã.
  rationale: O hebraico é conciso e elíptico. O contexto ressalta o linho, mas o versículo não nomeia explicitamente a lã; por isso, a tradução expressa o provável efeito prático sem transformar a inferência contextual em afirmação textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cingir” mantém a precisão cultual; a nota conserva a forma incomum e a ambiguidade do hebraico.
