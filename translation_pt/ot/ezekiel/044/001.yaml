  text: Then he brought me back by way of the outer gate of the sanctuary[a], the one facing east, and it was shut.
translation:
  language: pt
  text: Então ele me levou de volta[a] pelo caminho do portão externo do santuário, voltado para o leste, e o portão estava fechado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então ele me fez voltar pelo caminho do portão externo do santuário”. O verbo hebraico significa mais literalmente “fez-me voltar”, indicando que o guia conduziu Ezequiel novamente até esse portão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: levou de volta
  rationale: A forma causativa de שׁוב indica que o guia fez Ezequiel retornar. “Levou de volta” expressa isso de modo natural, sem perder a ideia causativa.
- source_word: דֶּרֶךְ
  choice: pelo caminho de
  rationale: Neste contexto, o substantivo indica a rota percorrida. A expressão evita afirmar que Ezequiel atravessou o portão.
- source_word: שַׁעַר
  choice: portão
  rationale: É o termo corrente em português para uma entrada arquitetônica desse tipo no complexo do templo.
- source_word: הַמִּקְדָּשׁ
  choice: santuário
  rationale: Designa o recinto sagrado sem restringir indevidamente a referência apenas ao espaço interior do templo.
- source_word: הַחִיצוֹן
  choice: externo
  rationale: Distingue este portão dos portões internos mencionados na visão de Ezequiel.
- source_word: הַפֹּנֶה קָדִים
  choice: o que dava para o leste
  rationale: Reproduz naturalmente a orientação do portão indicada pelo particípio e por קָדִים.
- source_word: וְהוּא סָגוּר
  choice: e ele estava fechado
  rationale: Mantém a coordenação simples do hebraico e descreve o estado do portão sem acrescentar contraste.
