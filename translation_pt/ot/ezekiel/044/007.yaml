source:
  edition: WLC
  text: בַּ/הֲבִיאֲ/כֶ֣ם בְּנֵֽי נֵכָ֗ר עַרְלֵי לֵב֙ וְ/עַרְלֵ֣י בָשָׂ֔ר לִ/הְי֥וֹת בְּ/מִקְדָּשִׁ֖/י לְ/חַלְּל֣/וֹ אֶת בֵּיתִ֑/י בְּ/הַקְרִֽיבְ/כֶ֤ם אֶת לַחְמִ/י֙ חֵ֣לֶב וָ/דָ֔ם וַ/יָּפֵ֨רוּ֙ אֶת בְּרִיתִ֔/י אֶ֖ל כָּל תּוֹעֲבוֹתֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/007.yaml
  text: when you brought in foreigners[a], uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it—my house—when you presented my food, the fat and the blood, and they broke my covenant[c][b], along with all your abominations.
translation:
  language: pt
  text: quando vocês fizeram entrar estrangeiros[a], incircuncisos de coração e incircuncisos na carne, para estarem no meu santuário, para profaná-lo — a minha casa —, quando apresentaram o meu alimento[b], a gordura e o sangue, e eles quebraram a minha aliança[c], junto com todas as suas abominações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos de uma terra estrangeira” ou “filhos estrangeiros”; literalmente, “filhos da estrangeiridade”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o meu pão”; no contexto sacrificial, a expressão designa o alimento oferecido a Deus.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico muda para “eles quebraram a minha aliança”, provavelmente referindo-se aos estrangeiros que acabam de ser mencionados; alguns entendem a expressão de modo mais geral, como continuação da acusação contra “vocês”.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּהֲבִיאֲכֶם
  choice: quando vocês introduziram
  rationale: A preposição בְּ com o infinitivo construto e o sufixo de segunda pessoa do plural tem sentido temporal. “Introduziram” conserva o valor causativo do hifil de בוא e se ajusta à entrada de pessoas no santuário.
- source_word: בְּנֵי נֵכָר
  choice: estrangeiros
  rationale: A expressão significa literalmente “filhos do estrangeiro/da estrangeiridade”, mas funciona idiomaticamente como designação de estrangeiros. A forma natural em português preserva a condição de pessoas de fora.
- source_word: עַרְלֵי לֵב
  choice: incircuncisos de coração
  rationale: Mantém a metáfora profética e sua força pactual, sem explicá-la como mera impureza ou rebeldia.
- source_word: וְעַרְלֵי בָשָׂר
  choice: incircuncisos na carne
  rationale: Conserva o contraste entre a condição interior e a circuncisão corporal literal, bem como o paralelismo retórico.
- source_word: לִהְיוֹת בְּמִקְדָּשִׁי
  choice: para estarem no meu santuário
  rationale: Preserva o infinitivo “estar” e a ênfase na presença dessas pessoas dentro do santuário, sem substituí-lo por “entrar”.
- source_word: לְחַלְּלוֹ אֶת בֵּיתִי
  choice: e o profanarem — a minha casa —
  rationale: חלל no piel indica profanar o que é santo. O pronome retoma naturalmente “meu santuário”, enquanto “a minha casa” o reapresenta em aposição enfática.
- source_word: בְּהַקְרִיבְכֶם
  choice: quando apresentaram
  rationale: No contexto sacrificial, o hifil de קרב significa apresentar ou oferecer. “Apresentaram” conserva a ideia de levar a oferta à presença de Deus.
- source_word: לַחְמִי
  choice: o meu alimento
  rationale: Embora לֶחֶם signifique literalmente “pão”, neste contexto cultual designa de modo mais amplo o alimento oferecido a Deus. A nota registra a forma literal.
- source_word: חֵלֶב וָדָם
  choice: a gordura e o sangue
  rationale: Designa os elementos sacrificiais específicos mencionados no texto.
- source_word: וַיָּפֵרוּ אֶת בְּרִיתִי
  choice: e eles quebraram a minha aliança
  rationale: O verbo está na terceira pessoa masculina plural, em contraste com a acusação anterior dirigida a “vocês”. “Quebrar a aliança” é uma expressão natural em português e corresponde à colocação hebraica הפר ברית.
- source_word: אֶל כָּל תּוֹעֲבוֹתֵיכֶם
  choice: junto com todas as suas abominações
  rationale: A formulação conserva a associação cumulativa expressa por אֶל sem transformar a frase numa explicação causal mais específica do que o hebraico permite.
theological_decisions:
- issue: Relação entre o pronome de “profanarem” e “a minha casa”
  choice: O pronome retoma “meu santuário”, e “a minha casa” funciona como aposição enfática.
  alternative: Traduzir diretamente “para profanarem a minha casa”, eliminando a retomada pronominal.
  rationale: A construção escolhida representa tanto o sufixo masculino singular de לְחַלְּלוֹ quanto a expressão seguinte אֶת־בֵּיתִי, evitando nivelar a sintaxe hebraica.
- issue: Sujeito de “quebraram a minha aliança”
  choice: O pronome explícito “eles” aponta, de modo mais natural, para os estrangeiros mencionados.
  alternative: Entender que a acusação continua dirigida de modo geral a “vocês”, apesar da mudança para a terceira pessoa plural.
  rationale: A terceira pessoa plural de וַיָּפֵרוּ e o antecedente plural mais próximo favorecem os estrangeiros como sujeito. A nota preserva a possibilidade de uma referência mais ampla, sem resolver silenciosamente a mudança gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para marcar com clareza a segunda pessoa do plural e “eles” para tornar perceptível a mudança hebraica para a terceira pessoa. Mantém a linguagem cultual — “santuário”, “profanar”, “aliança” e “abominações” — por sua precisão contextual, e conserva a aposição marcada por travessões para refletir a tensão sintática do original.
