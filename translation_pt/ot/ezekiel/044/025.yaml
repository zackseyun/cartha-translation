source:
  edition: WLC
  text: וְ/אֶל מֵ֣ת אָדָ֔ם לֹ֥א יָב֖וֹא לְ/טָמְאָ֑ה כִּ֣י אִם לְ/אָ֡ב וּ֠/לְ/אֵם וּ/לְ/בֵ֨ן וּ/לְ/בַ֜ת לְ/אָ֗ח וּ/לְ/אָח֛וֹת אֲשֶֽׁר לֹא הָיְתָ֥ה לְ/אִ֖ישׁ יִטַּמָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/025.yaml
  text: And they shall not go near a dead person to make themselves unclean; but for father or mother[a], for son or daughter, for brother, or for a sister who has not belonged to a man, they may make themselves unclean.
translation:
  language: pt
  text: Eles não se aproximarão de uma pessoa morta para se tornarem impuros; porém, por causa do pai ou da mãe, do filho ou da filha, do irmão ou de uma irmã que não tenha estado ligada a homem algum pelo casamento,[a] poderão tornar-se impuros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “uma irmã solteira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת אָדָם
  choice: uma pessoa morta
  rationale: A expressão significa literalmente um ser humano morto e, no contexto, designa um cadáver. “Uma pessoa morta” preserva o singular e evita restringir indevidamente a referência a um homem.
- source_word: יָבֹוא אֶל
  choice: se aproximarão de
  rationale: No contexto das normas sacerdotais de pureza, a construção indica aproximar-se de um morto, não apenas chegar a determinado lugar.
- source_word: לְטָמְאָה
  choice: para se tornarem impuros
  rationale: O infinitivo expressa o resultado ou propósito da aproximação. A formulação reflexiva é natural em português e corresponde ao verbo final do versículo.
- source_word: כִּי אִם
  choice: porém
  rationale: Introduz as exceções à proibição anterior. “Porém” mantém a força adversativa, enquanto a permissão é explicitada no fim da frase.
- source_word: לְאָב וּלְאֵם וּלְבֵן וּלְבַת לְאָח וּלְאָחוֹת
  choice: pelo pai ou pela mãe, pelo filho ou pela filha, pelo irmão ou por uma irmã
  rationale: A preposição לְ identifica os parentes por causa dos quais a impureza é permitida. A repetição seletiva das preposições torna a enumeração clara e natural em português.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: que não tenha pertencido a homem algum
  rationale: A formulação conserva a expressão relacional hebraica, literalmente “que não tenha sido para um homem”, sem reduzi-la à virgindade. O sentido idiomático matrimonial é indicado em nota.
- source_word: יִטַּמָּאוּ
  choice: poderão tornar-se impuros
  rationale: Neste contexto legal, o imperfeito expressa permissão para as exceções enumeradas, e não uma ordem ou simples previsão futura.
theological_decisions:
- issue: Força legal do imperfeito final יִטַּמָּאוּ
  choice: 'permissão: “poderão tornar-se impuros”'
  alternative: 'ordem: “deverão tornar-se impuros”; ou futuro simples: “se tornarão impuros”'
  rationale: A oração enumera exceções a uma proibição sacerdotal. A leitura permissiva comunica que a impureza por esses parentes é autorizada, sem transformar a autorização em obrigação.
- issue: Sentido da oração sobre a irmã אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: uma irmã ainda não ligada a um homem em casamento
  alternative: uma irmã solteira; ou uma irmã virgem
  rationale: O hebraico diz que ela não “foi para” um homem, expressão que naturalmente aponta para vínculo matrimonial. “Virgem” seria mais específico do que o texto; “solteira” é a equivalência idiomática apresentada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a terminologia ritual “tornar-se impuro”, a estrutura de proibição e exceção e a ambiguidade relacional da cláusula referente à irmã.
