  source_fidelity: A tradução preserva a proibição de aproximação de um morto, o caráter permissivo da exceção e a lista de parentes. “Pessoa morta” representa adequadamente מֵת אָדָם. A cláusula da irmã, porém, soa em português como linguagem de posse pessoal e não comunica com suficiente naturalidade o idiomatismo hebraico de vínculo matrimonial.
  naturalness: “Pelo pai ou pela mãe” é compreensível, mas “por causa do pai ou da mãe” deixa mais claro que se trata do motivo da exceção. “Que não tenha pertencido a homem algum” é pouco natural no português moderno e pode sugerir uma relação de propriedade, em vez do estado matrimonial indicado pelo contexto.
  terminology: “Tornarem-se impuros” é terminologia ritual clara e adequada. A formulação “ligada a homem algum pelo casamento” mantém o foco no vínculo matrimonial sem impor a leitura mais específica de virgindade.
