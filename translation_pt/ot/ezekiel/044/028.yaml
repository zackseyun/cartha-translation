base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/028.yaml
  text: 'And this shall be their inheritance: I am their inheritance[a]. And you shall give them no possession in Israel[b]; I am their possession.'
translation:
  language: pt
  text: 'E isto lhes será por herança: Eu sou a herança deles.[a] Vocês não lhes darão propriedade alguma em Israel;[b] Eu sou a propriedade deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E isto lhes será por herança: Eu sou a herança deles”. A abertura hebraica é elíptica.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “propriedade” também pode ser entendida como “posse de terra” ou “propriedade territorial”, isto é, uma porção permanente na terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְנַחֲלָה
  choice: E esta será a herança deles
  rationale: A construção hebraica é elíptica, com verbo feminino singular e sem sujeito expresso. “Esta” torna explícito em português o referente subentendido pelo contexto, sem eliminar a ambiguidade da abertura, registrada em nota.
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: herança / a herança deles
  rationale: “Herança” conserva o sentido jurídico e pactual de porção atribuída e mantém a repetição enfática do hebraico.
- source_word: אֲנִי נַחֲלָתָם
  choice: eu sou a herança deles
  rationale: A oração nominal hebraica é direta e enfática. A formulação preserva a afirmação de que o próprio SENHOR constitui a porção hereditária dos sacerdotes.
- source_word: אֲחֻזָּה / אֲחֻזָּתָם
  choice: propriedade / a propriedade deles
  rationale: O termo designa especialmente uma posse fundiária permanente. “Propriedade” é natural em português e preserva a distinção lexical em relação a נַחֲלָה, embora uma nota esclareça o sentido territorial.
- source_word: לֹא תִתְּנוּ לָהֶם בְּיִשְׂרָאֵל
  choice: Vocês não lhes darão propriedade alguma em Israel
  rationale: O futuro com valor prescritivo comunica a força jurídica do imperfeito hebraico, e “vocês” representa claramente o destinatário plural sem identificar além do que o texto permite.
theological_decisions:
- issue: Relação entre “herança” e “propriedade” na porção sacerdotal
  choice: Preservar a distinção entre נַחֲלָה (“herança”) e אֲחֻזָּה (“propriedade”).
  alternative: Traduzir ambos por “herança” ou ambos por “posse”.
  rationale: 'Os dois termos pertencem ao campo da distribuição e posse da terra, mas não são idênticos. A distinção sustenta o paralelismo teológico: os sacerdotes não recebem uma propriedade territorial comum porque o próprio SENHOR é tanto sua herança quanto sua propriedade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural explícito e evita vocabulário excessivamente técnico no corpo do versículo. As duas ocorrências de “propriedade” mantêm o paralelismo do hebraico, enquanto a nota explicita seu sentido fundiário.
