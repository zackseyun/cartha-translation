source:
  edition: WLC
  text: וּ֠/בְ/צֵאתָ/ם אֶל הֶ/חָצֵ֨ר הַ/חִיצוֹנָ֜ה אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָה֮ אֶל הָ/עָם֒ יִפְשְׁט֣וּ אֶת בִּגְדֵי/הֶ֗ם אֲשֶׁר הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔/ם וְ/הִנִּ֥יחוּ אוֹתָ֖/ם בְּ/לִֽשְׁכֹ֣ת הַ/קֹּ֑דֶשׁ וְ/לָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְ/לֹֽא יְקַדְּשׁ֥וּ אֶת הָ/עָ֖ם בְּ/בִגְדֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/019.yaml
  text: When they go out to the outer court[a], to the outer court where the people are, they shall take off their garments in which they minister and leave them in the holy chambers. Then they shall put on other garments[b], so that they may not make the people holy with their garments.
translation:
  language: pt
  text: Quando saírem para o pátio externo — para o pátio externo, onde está o povo[a] —, tirarão as vestes com que ministram e as deixarão nas câmaras sagradas. Depois vestirão outras roupas, para não tornarem santo o povo por meio de suas vestes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A repetição de “para o pátio externo” no hebraico enfatiza a passagem da área sacerdotal para o pátio onde o povo se encontra.
    reason: cultural_note
  - marker: b
    text: Ou “para não consagrarem o povo com suas vestes” ou “para não santificarem o povo com suas vestes”. Aqui, a santidade é cultual, ligada às vestes usadas no serviço sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצֵאתָם
  choice: Quando saírem
  rationale: A construção com infinitivo introduz uma oração temporal; esta formulação é natural em português e preserva o valor temporal.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: o pátio externo
  rationale: חָצֵר designa o pátio do complexo do templo, e הַחִיצוֹנָה o distingue como externo.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה אֶל הָעָם
  choice: para o pátio externo, onde está o povo
  rationale: Mantém o movimento em direção ao pátio e comunica de modo idiomático que essa é a área acessível ao povo. A repetição hebraica de 'para o pátio externo' foi preservada no texto.
- source_word: יִפְשְׁטוּ אֶת בִּגְדֵיהֶם
  choice: tirarão as vestes
  rationale: פשט, neste contexto, significa tirar uma peça de roupa; o sufixo possessivo é retomado naturalmente pelo contexto e explicitado depois em 'suas vestes'.
- source_word: אֲשֶׁר הֵמָּה מְשָׁרְתִם בָּם
  choice: com que ministram
  rationale: שרת descreve o serviço cultual dos sacerdotes; 'ministram' preserva essa nuance, e 'com que' expressa o uso das vestes durante o serviço.
- source_word: וְהִנִּיחוּ אוֹתָם בְּלִשְׁכֹת הַקֹּדֶשׁ
  choice: e as deixarão nas câmaras sagradas
  rationale: A frase descreve o depósito das vestes em salas consagradas do templo; 'câmaras sagradas' é preciso e digno.
- source_word: וְלָבְשׁוּ בְּגָדִים אֲחֵרִים
  choice: Depois vestirão outras roupas
  rationale: A formulação deixa clara a sequência da troca de roupa sem acrescentar conteúdo.
- source_word: וְלֹא יְקַדְּשׁוּ אֶת הָעָם
  choice: para não tornarem santo o povo
  rationale: O piel de קדש é causativo, 'tornar santo' ou 'consagrar'. A tradução preserva o caráter concreto e cultual da frase sem sugerir necessariamente transformação moral.
- source_word: בְּבִגְדֵיהֶם
  choice: por meio de suas vestes
  rationale: A preposição ב tem valor instrumental; 'por meio de' torna clara a função das vestes sem definir o mecanismo além do hebraico.
theological_decisions:
- issue: Transferência de santidade cultual na oração final
  choice: A proibição é expressa como não tornar o povo santo por meio das vestes sacerdotais.
  alternative: não consagrar o povo com suas vestes; não santificar o povo com suas vestes
  rationale: O verbo causativo, o objeto direto 'o povo' e o instrumento 'suas vestes' apontam para santidade cultual comunicada por contato ou associação com vestes consagradas. A redação mantém essa tensão material e ritual sem convertê-la em uma afirmação sobre santificação moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Pátio externo', 'vestes', 'ministram' e 'câmaras sagradas' preservam o contexto do templo. A repetição deliberada do hebraico foi mantida e explicada em nota; a formulação causativa final conserva a estranheza teológica do original.
