review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem o santuário, a mesa e o contexto sacerdotal, mas enfraquece a repetição enfática de הֵמָּה ao omiti-la na segunda oração. «Diante de mim» acrescenta uma ideia espacial que o hebraico não explicita, e «o serviço que lhes confiei» desenvolve interpretativamente מִשְׁמַרְתִּי, incluindo «lhes confiei», que não está no texto.
  naturalness: O português do rascunho é fluente e de registro apropriado. A revisão mantém essa fluência, ao mesmo tempo que reproduz de forma mais visível a ênfase e evita expansões desnecessárias.
  terminology: «Santuário» e «mesa» são escolhas adequadas. «Servirem-me» comunica naturalmente o serviço cultual de לְשָׁרְתֵנִי. «Cumprirão o meu encargo» representa de modo claro e sóbrio a obrigação sacerdotal expressa por מִשְׁמַרְתִּי.
  issues:
  - severity: medium
    issue: A segunda ocorrência enfática de הֵמָּה não foi traduzida.
    rationale: O hebraico diz literalmente «eles mesmos» tanto antes de «entrarão» quanto antes de «se aproximarão». A repetição destaca a prerrogativa sacerdotal e deve ser mantida.
  - severity: low
    issue: «Diante de mim» acrescenta uma especificação não expressa por לְשָׁרְתֵנִי.
    rationale: O sufixo indica que o serviço é prestado a Deus («servir-me»); a noção espacial de serviço diante dele não é necessária aqui.
  - severity: medium
    issue: «O serviço que lhes confiei» é mais explicativo que o hebraico.
    rationale: Além de converter «encargo/obrigação» em «serviço», a formulação introduz explicitamente o ato de confiar algo «a eles». «Cumprirão o meu encargo» preserva melhor a concisão e a referência possessiva do original.
  revised_text: Eles mesmos entrarão no meu santuário, e eles mesmos se aproximarão da minha mesa[a] para me servirem; e cumprirão o meu encargo.
  revised_footnotes:
