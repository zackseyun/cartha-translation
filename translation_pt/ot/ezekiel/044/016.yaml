  text: הֵ֜מָּה יָבֹ֣אוּ אֶל מִקְדָּשִׁ֗/י וְ/הֵ֛מָּה יִקְרְב֥וּ אֶל שֻׁלְחָנִ֖/י לְ/שָׁרְתֵ֑/נִי וְ/שָׁמְר֖וּ אֶת מִשְׁמַרְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/016.yaml
  text: They themselves shall enter my sanctuary[a], and they themselves shall come near to my table to minister to me, and they shall keep my charge.
translation:
  language: pt
  text: Eles mesmos entrarão no meu santuário, e eles mesmos se aproximarão da minha mesa[a] para me servirem; e cumprirão o meu encargo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «meu altar» ou «minha mesa-altar», pois «mesa» aqui é usada no contexto do serviço do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: eles mesmos
  rationale: O pronome independente, repetido nas duas primeiras orações, é enfático e destaca que são precisamente eles que têm esse privilégio sacerdotal.
- source_word: יָבֹאוּ אֶל־מִקְדָּשִׁי
  choice: entrarão no meu santuário
  rationale: Com מִקְדָּשׁ, o verbo expressa entrada no espaço santo; a formulação é direta e natural em português.
- source_word: יִקְרְבוּ
  choice: se aproximarão
  rationale: Preserva o sentido de aproximação e sua conotação cultual no serviço sacerdotal.
- source_word: שֻׁלְחָנִי
  choice: minha mesa
  rationale: Traduz literalmente o substantivo hebraico sem identificar de modo indevido a mesa com um objeto cultual mais específico.
- source_word: לְשָׁרְתֵנִי
  choice: para ministrar diante de mim
  rationale: Em contexto sacerdotal, שׁרת indica serviço sagrado. A expressão portuguesa mantém esse caráter cultual; 'diante de mim' comunica serviço prestado na presença de Deus.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתִּי
  choice: eles cumprirão o serviço que lhes confiei
  rationale: A construção idiomática hebraica designa o cumprimento fiel de uma responsabilidade atribuída. Esta tradução evita o pouco natural 'guardarão a minha guarda' e torna claro o encargo sacerdotal.
theological_decisions:
- issue: Sentido cultual de שֻׁלְחָנִי no contexto do templo
  choice: minha mesa
  alternative: meu altar; minha mesa do altar
  rationale: Embora a mesa possa ser entendida metonimicamente como altar ou mesa associada às ofertas, o termo hebraico significa literalmente 'mesa'. O texto principal preserva essa forma e a nota registra as identificações interpretativas possíveis.
- issue: Natureza do encargo em מִשְׁמַרְתִּי
  choice: o serviço que lhes confiei
  alternative: a minha incumbência; aquilo que determinei
  rationale: A expressão se refere à obrigação sacerdotal confiada por Deus. A escolha explicita o sentido funcional sem acrescentar uma regulamentação específica que o versículo não nomeia.
translation_notes:
  register: Português moderno, digno e acessível. A repetição enfática de הֵמָּה é representada inicialmente por “Eles mesmos”; na segunda ocorrência, a construção reflexiva “se aproximarão” mantém a referência sem uma repetição pesada. O ponto e vírgula organiza as ações sacerdotais com naturalidade.
