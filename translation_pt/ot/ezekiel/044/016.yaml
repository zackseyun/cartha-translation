  text: הֵ֜מָּה יָבֹ֣אוּ אֶל מִקְדָּשִׁ֗/י וְ/הֵ֛מָּה יִקְרְב֥וּ אֶל שֻׁלְחָנִ֖/י לְ/שָׁרְתֵ֑/נִי וְ/שָׁמְר֖וּ אֶת מִשְׁמַרְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/016.yaml
  text: They themselves shall enter my sanctuary[a], and they themselves shall come near to my table to minister to me, and they shall keep my charge.
translation:
  language: pt
  text: Eles mesmos entrarão no meu santuário e eles mesmos se aproximarão da minha mesa[a] para me servir; e cumprirão o meu encargo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do meu altar” ou “da minha mesa do altar”, pois “mesa” aparece aqui no contexto do serviço no templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: eles mesmos
  rationale: O pronome independente, repetido nas duas primeiras orações, é enfático e destaca que são precisamente eles que têm esse acesso sacerdotal. Em português, a segunda ocorrência pode ser representada pela continuidade do sujeito sem repetição pesada.
- source_word: יָבֹאוּ אֶל מִקְדָּשִׁי
  choice: entrarão no meu santuário
  rationale: Com מִקְדָּשׁ, o verbo indica ingresso no espaço sagrado; esta formulação é direta e natural.
- source_word: יִקְרְבוּ
  choice: se aproximarão
  rationale: Preserva o sentido de aproximação e sua nuance cultual no contexto do serviço sacerdotal.
- source_word: שֻׁלְחָנִי
  choice: minha mesa
  rationale: O substantivo hebraico significa literalmente 'mesa'. Embora no contexto do templo possa designar uma mesa de ofertas ou, metonimicamente, o altar, a tradução principal mantém o termo explícito do texto.
- source_word: לְשָׁרְתֵנִי
  choice: para me servir
  rationale: שרת designa serviço sacerdotal, mas 'servir' comunica com naturalidade tanto a função sagrada quanto o fato de o serviço ser prestado a Deus.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמַרְתִּי
  choice: e cumprirão o encargo que lhes confiei
  rationale: A construção idiomática hebraica indica observar ou desempenhar fielmente uma responsabilidade atribuída por Deus. A formulação portuguesa evita o pouco natural 'guardarão o meu encargo'.
theological_decisions:
- issue: Identificação cultual de שֻׁלְחָנִי no contexto do templo
  choice: minha mesa
  alternative: meu altar; minha mesa do altar
  rationale: O contexto admite uma referência funcional ao altar ou a uma mesa ligada às ofertas, mas o lexema diz literalmente 'mesa'. A tradução não especifica além do hebraico e registra as alternativas em nota.
- issue: Natureza de מִשְׁמַרְתִּי
  choice: o encargo que lhes confiei
  alternative: minha incumbência; meu serviço prescrito
  rationale: A expressão denota uma responsabilidade sacerdotal estabelecida por Deus. A escolha conserva a relação pessoal do sufixo de primeira pessoa sem transformar o termo em uma ordenança abstrata.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O futuro preserva a forma verbal do texto; o pronome enfático é mantido sem tornar a segunda oração artificialmente repetitiva.
