  text: No priest shall drink wine when entering the inner court[a].
translation:
  language: pt
  text: Nenhum sacerdote beberá vinho ao entrar no pátio interno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַיִן
  choice: vinho
  rationale: יַיִן designa diretamente vinho. A conjunção inicial וְ não precisa ser representada em português, pois a proibição começa naturalmente sem «e».
- source_word: לֹא יִשְׁתּוּ
  choice: não beberá / nenhum ... beberá
  rationale: A negação com o imperfeito, neste contexto legal, expressa uma proibição. A construção «Nenhum sacerdote beberá» comunica de modo natural e solene a força normativa.
- source_word: כָּל כֹּהֵן
  choice: Nenhum sacerdote
  rationale: A expressão é literalmente «todo sacerdote», mas, sob negação, «nenhum sacerdote» preserva com clareza o alcance universal em português.
- source_word: בְּ/בוֹאָם אֶל
  choice: ao entrar no
  rationale: 'A preposição com o infinitivo construto e sufixo plural indica a ocasião: «quando entrarem» ou «ao entrarem». A forma impessoal «ao entrar» evita discordância com o singular coletivo e mantém o sentido temporal.'
- source_word: הֶ/חָצֵר הַ/פְּנִימִית
  choice: o pátio interno
  rationale: חָצֵר refere-se a um pátio ou átrio. «Pátio interno» é claro para leitores modernos e conserva o sentido arquitetônico do complexo do templo.
