  text: And they had human hands under their wings on their four sides[b][a]; and the four of them had their faces and their wings.
translation:
  language: pt
  text: Tinham mãos humanas debaixo das suas asas, nos seus quatro lados[a]; todos os quatro tinham rostos e asas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é sintaticamente condensado; literalmente: “e mãos humanas debaixo das asas deles, sobre os quatro lados deles; e os rostos deles e as asas deles, para os quatro”. A tradução explicita as relações implícitas na frase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדוֹת אָדָם
  choice: eles tinham mãos humanas
  rationale: A oração nominal hebraica implica posse ou existência; em português, “tinham” torna essa relação explícita. אָדָם qualifica o tipo de mãos, por isso “humanas” é natural e fiel ao contexto visionário.
- source_word: מִתַּחַת כַּנְפֵיהֶם
  choice: debaixo das asas
  rationale: מִתַּחַת indica posição inferior. O possessivo pode ficar implícito em português porque o sujeito já está expresso e a referência é clara.
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶם
  choice: nos quatro lados
  rationale: רִבְעֵיהֶם refere-se aos quatro lados ou quadrantes. “Nos quatro lados” expressa de modo natural a distribuição espacial sem especificar além do hebraico.
- source_word: וּפְנֵיהֶם וְכַנְפֵיהֶם
  choice: rostos e asas
  rationale: Tradução direta dos substantivos plurais; o verbo e a relação possessiva são supridos pela sintaxe portuguesa.
- source_word: לְאַרְבַּעְתָּם
  choice: os quatro tinham
  rationale: A expressão aplica a descrição coletivamente aos quatro seres. A formulação portuguesa explicita a relação elíptica do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. “Mãos humanas” evita a ambiguidade contemporânea de “mãos de homem” e preserva o contraste entre traços humanos e animais. A compressão do hebraico é indicada em nota, sem tentar resolver além do necessário a disposição exata dos membros.
