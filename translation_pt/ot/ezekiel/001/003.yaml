revisions:
- from: A palavra de Yahweh veio de fato[a] a Ezequiel, filho de Buzi, o sacerdote[b], na terra dos caldeus[c], junto ao rio Quebar[d]; e ali a mão de Yahweh veio sobre ele.[e]
