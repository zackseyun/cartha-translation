source:
  edition: WLC
  text: הָיֹ֣ה הָיָ֣ה דְבַר יְ֠הוָה אֶל יְחֶזְקֵ֨אל בֶּן בּוּזִ֧י הַ/כֹּהֵ֛ן בְּ/אֶ֥רֶץ כַּשְׂדִּ֖ים עַל נְהַר כְּבָ֑ר וַ/תְּהִ֥י עָלָ֛י/ו שָׁ֖ם יַד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/003.yaml
  text: the word of Yahweh came indeed to Ezekiel son of Buzi[a], the priest, in the land of the Chaldeans by the Kebar River[c][b], and there the hand of Yahweh came upon him.
translation:
  language: pt
  text: A palavra de Yahweh certamente veio[a] a Ezequiel, filho de Buzi, o sacerdote[b], na terra dos caldeus[c], junto ao rio Quebar[d], e ali a mão de Yahweh esteve sobre ele.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete o verbo para dar ênfase; também pode ser traduzido: “a palavra de Yahweh veio de fato”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “o sacerdote” é tradicionalmente entendida como uma descrição de Ezequiel; pela posição das palavras, também pode ser ligada a Buzi.
    reason: ambiguity
  - marker: c
    text: 'Ou: “na terra dos babilônios”. “Caldeus” traduz mais literalmente o termo hebraico.'
    reason: lexical_alternative
  - marker: d
    text: 'O Quebar provavelmente era um canal, e não um rio natural; por isso, também: “junto ao canal Quebar”.'
    reason: historical_geographical_clarification
  - marker: e
    text: Literalmente, “e ali a mão de Yahweh esteve sobre ele”. A expressão descreve a ação divina sobre o profeta sem especificar aqui toda a natureza dessa experiência.
    reason: alternative_reading
lexical_decisions:
- source_word: הָיֹה הָיָה
  choice: veio de fato
  rationale: O infinitivo absoluto seguido da forma finita de היה intensifica a afirmação. “Veio de fato” comunica essa ênfase em português natural sem reproduzir mecanicamente a repetição hebraica.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e a ressonância de revelação divina; “mensagem” seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְחֶזְקֵאל בֶּן בּוּזִי הַכֹּהֵן
  choice: Ezequiel, filho de Buzi, o sacerdote
  rationale: Emprega as formas portuguesas usuais dos nomes e conserva a sequência de aposições do hebraico, sem eliminar a possível ambiguidade de ligação de “o sacerdote”.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: na terra dos caldeus
  rationale: Traduz diretamente o gentílico כַּשְׂדִּים; no contexto, ele pode designar de modo mais amplo a Babilônia.
- source_word: עַל נְהַר כְּבָר
  choice: junto ao rio Quebar
  rationale: עַל é locativo neste contexto. “Junto ao” é idiomático em português, e “rio Quebar” preserva a designação tradicional, embora a via de água possa ter sido um canal.
- source_word: וַתְּהִי עָלָיו שָׁם יַד יְהוָה
  choice: e ali a mão de Yahweh veio sobre ele
  rationale: Conserva tanto שָׁם (“ali”) quanto a imagem da mão divina e representa a ocorrência verbal sem reduzi-la interpretativamente a “poder”, “inspiração” ou outra categoria específica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino. “Yahweh” o preserva de forma transliterada, sem substituí-lo por um título.
- issue: Sentido da expressão profética “a mão de Yahweh”
  choice: 'manter a imagem: “a mão de Yahweh veio sobre ele”'
  alternative: “o poder de Yahweh veio sobre ele”; “Yahweh tomou posse dele”; “a mão de Yahweh estava sobre ele”
  rationale: A expressão indica ação divina intensa sobre o profeta, mas o texto não a limita a uma única explicação teológica. A tradução conserva a imagem e a tensão do original.
- issue: Referente de “o sacerdote”
  choice: preservar a ordem e a ambiguidade sintática do hebraico
  alternative: “Ezequiel, o sacerdote, filho de Buzi”; “Ezequiel, filho do sacerdote Buzi”
  rationale: Embora a leitura tradicional identifique Ezequiel como sacerdote, a posição da expressão após “filho de Buzi” pode gerar ligação formal com Buzi. A redação principal não resolve silenciosamente essa questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de nomes correntes no Brasil e inteligíveis internacionalmente. A sintaxe acompanha de perto o hebraico, mas evita rigidez artificial; as ambiguidades relevantes são preservadas no texto e explicitadas em notas.
