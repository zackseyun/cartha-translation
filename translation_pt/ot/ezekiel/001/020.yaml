source:
  edition: WLC
  text: עַ֣ל אֲשֶׁר֩ יִֽהְיֶה שָּׁ֨ם הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ שָׁ֥מָּ/ה הָ/ר֖וּחַ לָ/לֶ֑כֶת וְ/הָ/אוֹפַנִּ֗ים יִנָּשְׂאוּ֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/020.yaml
  text: Wherever the spirit wanted to go[a], they went there; and the wheels were lifted up alongside them[c][b], because the spirit of the living creature was in the wheels.
translation:
  language: pt
  text: Para onde o espírito queria ir[a][c], eles iam para lá; e as rodas eram erguidas junto deles[b], porque o espírito do ser vivente estava nas rodas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vento” ou “sopro”; o termo hebraico רוּחַ pode ter qualquer um desses sentidos. Aqui se refere ao espírito ou impulso que anima e dirige o movimento na visão.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante deles”, “em correspondência com eles” ou “ao lado deles”.
    reason: lexical_alternative
  - marker: c
    text: Alguns entendem “espírito” aqui como referência ao Espírito de Deus; o hebraico não faz essa identificação de modo explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרוּחַ / רוּחַ
  choice: o espírito / o espírito
  rationale: רוּחַ pode significar “vento”, “sopro” ou “espírito”. Neste contexto visionário, indica o princípio que anima ou dirige o movimento dos seres viventes e das rodas. A inicial minúscula evita identificar explicitamente esse espírito com o Espírito de Deus, algo que o hebraico não declara.
- source_word: עַל אֲשֶׁר יִהְיֶה שָּׁם
  choice: Para onde
  rationale: A construção introduz o lugar ou a direção indefinida do movimento. “Para onde” é natural em português e, com o verbo “ir”, comunica adequadamente o sentido direcional.
- source_word: לָלֶכֶת ... יֵלֵכוּ
  choice: queria ir ... eles iam
  rationale: O infinitivo associado a רוּחַ expressa a direção ou impulso do movimento; “queria ir” é idiomático e preserva essa volição aparente. O imperfeito subsequente é vertido como “eles iam”, adequado à descrição de ação recorrente na visão.
- source_word: שָׁמָּה
  choice: para onde / iam
  rationale: O advérbio direcional significa “para lá”. Em português, sua força já está contida na retomada “Para onde ... eles iam”, evitando a formulação pesada “eles iam para lá” sem perder o sentido.
- source_word: הָאוֹפַנִּים
  choice: as rodas
  rationale: אוֹפַנִּים designa claramente as rodas da visão; “rodas” é direto, corrente e coerente com o contexto.
- source_word: יִנָּשְׂאוּ
  choice: eram erguidas
  rationale: O nifal de נשׂא tem aqui sentido passivo. “Eram erguidas” conserva essa forma e se ajusta ao caráter descritivo e recorrente do trecho.
- source_word: לְעֻמָּתָם
  choice: junto deles
  rationale: A expressão pode indicar posição correspondente, defronte ou ao lado. No contexto do movimento coordenado, “junto deles” é natural e mantém certa amplitude espacial.
- source_word: הַחַיָּה
  choice: o ser vivente
  rationale: O hebraico emprega o singular, embora o contexto mais amplo apresente vários seres viventes. “O ser vivente” preserva o número gramatical e a terminologia da visão.
theological_decisions:
- issue: Se רוּחַ deve ser traduzido com inicial maiúscula como referência ao Espírito de Deus
  choice: espírito, com inicial minúscula
  alternative: Espírito
  rationale: O texto apresenta o espírito como princípio animador ou diretor dos seres viventes e das rodas, mas não o identifica expressamente como o Espírito de Deus. A inicial minúscula preserva essa tensão sem excluir a leitura teológica alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe acompanha o movimento repetido da visão sem suavizar a ambiguidade de רוּחַ nem explicitar uma identificação teológica ausente no hebraico.
