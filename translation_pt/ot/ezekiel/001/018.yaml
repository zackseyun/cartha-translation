base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/018.yaml
  text: As for their rims[a], they were high and fearsome, and the rims of all four were full of eyes all around.
translation:
  language: pt
  text: Quanto aos seus aros, eram altos e causavam temor[a]; e os aros das quatro rodas estavam cheios de olhos ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eram temíveis”; o termo hebraico indica algo que inspira medo ou pavor.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַבֵּיהֶן / גַבֹּתָם
  choice: seus aros / os aros
  rationale: No contexto das rodas de Ezequiel 1:15–21, גַּב designa a parte externa ou circunferência da roda. “Aros” é claro, atual e preserva a repetição do hebraico.
- source_word: גֹבַהּ
  choice: eram altos
  rationale: O substantivo indica altura; a construção predicativa em português expressa naturalmente o hebraico “havia altura para eles”.
- source_word: יִרְאָה
  choice: causavam temor
  rationale: O termo denota medo ou pavor. A expressão comunica que a aparência dos aros inspirava temor, sem reduzir o sentido a mera admiração nem acrescentar uma conotação moral ou religiosa.
- source_word: לָהֶם
  choice: eram / causavam
  rationale: As duas ocorrências da preposição são vertidas idiomaticamente como predicações em português, em vez do literal e pouco natural “para eles”.
- source_word: מְלֵאֹת עֵינַיִם
  choice: estavam cheios de olhos
  rationale: Tradução próxima da expressão hebraica, preservando sua imagem vívida e incomum.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressão corrente que transmite a ideia de olhos distribuídos por toda a circunferência.
- source_word: לְאַרְבַּעְתָּן
  choice: das quatro rodas
  rationale: O sufixo feminino plural remete às quatro rodas do contexto. Explicitar “rodas” evita ambiguidade em português sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao paralelismo hebraico. A repetição de “aros” foi mantida para preservar a coesão da descrição, e “rodas” foi explicitado na segunda oração para tornar claro o referente das quatro.
