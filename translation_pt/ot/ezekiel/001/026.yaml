base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/026.yaml
  text: And above the expanse that was over their heads was the likeness of a throne[a], in appearance like sapphire stone; and above the likeness of the throne was a likeness with the appearance of a man above it.
translation:
  language: pt
  text: Acima da expansão que estava sobre a cabeça deles havia algo semelhante a um trono, com aparência de pedra de safira[a]; e, acima do que parecia um trono, havia uma figura com aparência de homem, acima dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “pedra de lápis-lazúli”; não se sabe ao certo qual pedra preciosa antiga era designada pelo hebraico sappir.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָקִיעַ
  choice: expansão
  rationale: Traduz a ideia de uma superfície estendida e evita o caráter arcaico de “firmamento”; no contexto da visão, é a expansão semelhante a uma plataforma acima dos seres viventes.
- source_word: כְּמַרְאֵה
  choice: com aparência de
  rationale: Preserva a fórmula visionária de semelhança, sem identificar diretamente o que Ezequiel viu com a realidade comparada.
- source_word: אֶבֶן סַפִּיר
  choice: pedra de safira
  rationale: Mantém a identificação tradicional da pedra, enquanto a nota registra a incerteza de que o termo antigo talvez designasse lápis-lazúli.
- source_word: דְּמוּת
  choice: algo semelhante / figura
  rationale: As formulações naturais em português preservam a linguagem analógica e cautelosa da visão, sem afirmar uma identificação direta.
- source_word: כִּסֵּא
  choice: trono
  rationale: No contexto régio e visionário, “trono” é o sentido natural do termo.
- source_word: אָדָם
  choice: homem
  rationale: O termo designa aqui uma figura humana individual, não a humanidade em geral.
- source_word: עָלָיו מִלְמָעְלָה
  choice: acima
  rationale: Mantém a localização espacial da figura em relação ao que parecia um trono, sem acrescentar que ela estivesse sentada.
theological_decisions:
- issue: Descrição antropomórfica da figura acima do trono
  choice: “uma figura com aparência de homem”
  alternative: “alguém semelhante a um homem”
  rationale: A tradução conserva as duas camadas de linguagem analógica expressas por דְּמוּת e כְּמַרְאֵה, sem identificar Deus de modo direto com um corpo humano nem apagar o caráter humano da manifestação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição hebraica foi moderadamente variada (“algo semelhante”, “parecia”, “figura com aparência”) para evitar rigidez, preservando ao mesmo tempo a cautela fenomenológica do relato. Não se acrescentou “sentada”, pois essa ideia não está explícita no hebraico.
