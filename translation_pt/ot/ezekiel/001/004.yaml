  text: וָ/אֵ֡רֶא וְ/הִנֵּה֩ ר֨וּחַ סְעָרָ֜ה בָּאָ֣ה מִן הַ/צָּפ֗וֹן עָנָ֤ן גָּדוֹל֙ וְ/אֵ֣שׁ מִתְלַקַּ֔חַת וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִ֑יב וּ/מִ֨/תּוֹכָ֔/הּ כְּ/עֵ֥ין הַ/חַשְׁמַ֖ל מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/004.yaml
  text: And I looked[a], and behold, a storm wind was coming from the north, a great cloud with fire flashing continually, and brightness all around it; and from its midst was something like the appearance of glowing metal[c][b], from the midst of the fire.
translation:
  language: pt
  text: 'Olhei, e eis que um vento de tempestade[a] vinha do norte: uma grande nuvem, com fogo que lampejava continuamente[b] e um clarão ao redor dela. Do meio dela, do meio do fogo, vinha algo semelhante a metal incandescente[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um redemoinho”. A expressão hebraica pode indicar uma violenta tempestade de vento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fogo que se envolvia em si mesmo”. A expressão hebraica é difícil e pode descrever fogo em movimento contínuo e intensificado.'
    reason: lexical_alternative
  - marker: c
    text: Hebraico hashmal, termo raro de significado incerto; talvez uma liga metálica brilhante, como o electro, ou um brilho semelhante ao âmbar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Olhei
  rationale: Expressa a atenção visual do profeta e evita a redundância pouco natural de “vi, e eis que”, sem perder o caráter de relato visionário.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a força apresentativa e repentina da expressão hebraica em registro elevado, mas ainda reconhecível no português bíblico atual.
- source_word: רוּחַ סְעָרָה
  choice: um vento de tempestade
  rationale: Representa de modo transparente um vento violento associado a uma tempestade, sem impor necessariamente a ideia de rotação contida em “redemoinho”.
- source_word: בָּאָה מִן הַצָּפוֹן
  choice: vinha do norte
  rationale: O imperfeito português apresenta a cena em desenvolvimento diante do profeta.
- source_word: עָנָן גָּדוֹל
  choice: uma grande nuvem
  rationale: Tradução direta, digna e natural, que conserva a dimensão grandiosa da visão.
- source_word: אֵשׁ מִתְלַקַּחַת
  choice: fogo que lampejava continuamente
  rationale: A forma reflexiva é difícil; esta tradução comunica o movimento reiterado e intenso do fogo sem adotar como certo o sentido tradicional de fogo que se envolve em si mesmo.
- source_word: נֹגַהּ לוֹ סָבִיב
  choice: um clarão ao redor dela
  rationale: “Clarão” comunica a luminosidade intensa de נֹגַהּ. O referente provável do pronome é a nuvem, ou o conjunto de nuvem e fogo; o feminino concorda naturalmente com “nuvem” em português.
- source_word: וּמִתּוֹכָהּ ... מִתּוֹךְ הָאֵשׁ
  choice: Do meio dela, do meio do fogo
  rationale: Conserva a repetição estrutural de “do meio”, importante para a descrição em camadas da visão.
- source_word: כְּעֵין הַחַשְׁמַל
  choice: algo semelhante a metal incandescente
  rationale: Mantém o caráter aproximativo da linguagem visionária e comunica o efeito visual do termo raro חַשְׁמַל sem afirmar uma identificação material precisa.
theological_decisions:
- issue: Descrição da imagem teofânica sem identificar com precisão a substância vista
  choice: algo semelhante a metal incandescente
  alternative: algo semelhante a âmbar ou electro
  rationale: O hebraico emprega uma comparação visual e um substantivo raro de sentido incerto. A tradução conserva a cautela fenomenológica de Ezequiel, em vez de transformar a imagem em identificação material ou doutrinária precisa.
- issue: Referente do brilho ao redor
  choice: ao redor dela, referindo-se naturalmente à nuvem
  alternative: ao redor dele, referindo-se ao fogo ou ao conjunto da manifestação
  rationale: O pronome hebraico pode abranger o complexo visual da nuvem e do fogo. A concordância portuguesa exige uma escolha gramatical; a opção por “nuvem” é contextual e não pretende excluir que o clarão envolvesse toda a manifestação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. “Eis que” preserva deliberadamente o tom visionário elevado. A ordem repetitiva “do meio dela, do meio do fogo” mantém a estrutura enfática do hebraico, enquanto a divisão em duas frases evita sobrecarregar o período.
