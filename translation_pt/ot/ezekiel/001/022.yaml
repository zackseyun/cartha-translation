  text: וּ/דְמ֞וּת עַל רָאשֵׁ֤י הַ/חַיָּה֙ רָקִ֔יעַ כְּ/עֵ֖ין הַ/קֶּ֣רַח הַ/נּוֹרָ֑א נָט֥וּי עַל רָאשֵׁי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/022.yaml
  text: And above the heads of the living creatures there was the likeness of an expanse[a], like the appearance of awe-inspiring ice[b], stretched out above their heads from above.
translation:
  language: pt
  text: Acima das cabeças dos seres viventes[a] havia a semelhança de uma expansão, como a aparência de gelo que inspirava temor[b], estendida sobre as cabeças deles, no alto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz aqui uma expressão coletiva no singular, “o ser vivente”, embora fale de “cabeças” e depois use o plural “deles”.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “cristal”. A palavra hebraica significa mais comumente “gelo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: havia a semelhança de
  rationale: Preserva דְּמוּת como linguagem de semelhança, sem transformar a visão em identificação direta; “havia” produz uma frase natural em português.
- source_word: הַחַיָּה
  choice: os seres viventes
  rationale: Embora a forma hebraica seja singular coletiva, os plurais de “cabeças” e “deles” mostram que o referente são os vários seres; a nota registra a forma do original.
- source_word: רָקִיעַ
  choice: uma expansão
  rationale: Expressa algo amplo e estendido no alto, evitando o arcaísmo de “firmamento” e a interpretação mais específica de “abóbada”.
- source_word: כְּעֵין
  choice: como a aparência de
  rationale: Mantém a comparação visual e a cautela analógica característica do relato da visão.
- source_word: הַקֶּרַח
  choice: gelo
  rationale: É o sentido mais comum do substantivo hebraico; “cristal”, tradicional em algumas versões, é mantido como alternativa em nota.
- source_word: הַנּוֹרָא
  choice: que inspirava temor
  rationale: Comunica algo que provoca temor reverente e assombro, sem limitar o sentido a mero terror.
- source_word: נָטוּי
  choice: estendida
  rationale: Descreve a expansão como disposta ou esticada sobre as cabeças; a concordância feminina decorre do substantivo português “expansão”.
- source_word: מִלְמָעְלָה
  choice: no alto
  rationale: Indica a posição elevada e preserva a ênfase vertical, evitando sugerir indevidamente movimento ou origem.
theological_decisions:
- issue: Linguagem analógica da visão
  choice: Preservar “semelhança”, “como” e “aparência”.
  alternative: Simplificar para uma descrição direta, como “havia acima deles uma expansão de gelo resplandecente”.
  rationale: Ezequiel descreve a visão mediante comparações cuidadosamente sobrepostas. Mantê-las evita afirmar identidade direta onde o texto apresenta semelhança visual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. A repetição de “cabeças” e a sucessão de termos comparativos foram mantidas para refletir a ênfase espacial e a linguagem cautelosa do hebraico visionário.
