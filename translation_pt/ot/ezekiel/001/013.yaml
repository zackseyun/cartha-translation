    rationale: O hebraico diz literalmente que «relâmpago» saía do fogo. Embora o plural possa soar idiomático ao descrever lampejos repetidos, ele especifica uma multiplicidade ausente do texto-fonte. «Um relâmpago saía» conserva o singular e o aspecto durativo do particípio יוֹצֵא.
