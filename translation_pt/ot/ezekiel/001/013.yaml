  text: וּ/דְמ֨וּת הַ/חַיּ֜וֹת מַרְאֵי/הֶ֣ם כְּ/גַחֲלֵי אֵ֗שׁ בֹּֽעֲרוֹת֙ כְּ/מַרְאֵ֣ה הַ/לַּפִּדִ֔ים הִ֕יא מִתְהַלֶּ֖כֶת בֵּ֣ין הַ/חַיּ֑וֹת וְ/נֹ֣גַהּ לָ/אֵ֔שׁ וּ/מִן הָ/אֵ֖שׁ יוֹצֵ֥א בָרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/013.yaml
  text: And as for the likeness of the living creatures[a], their appearance was like burning coals of fire, like the appearance of torches; it was moving about among the living creatures, and the fire had brightness[c][b], and from the fire lightning was coming forth.
translation:
  language: pt
  text: Quanto à semelhança dos seres viventes, sua aparência era como brasas ardentes, como a aparência de tochas. Ela[a] se movia de um lado para outro entre os seres viventes. O fogo resplandecia, e do fogo saía um relâmpago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome feminino «ela» está explícito no hebraico, mas seu antecedente exato é incerto; pode referir-se à semelhança ou aparência descrita, ou ao fenômeno semelhante ao fogo.
    reason: ambiguity
lexical_decisions:
- source_word: וּדְמוּת הַחַיּוֹת
  choice: Quanto à semelhança dos seres viventes
  rationale: Preserva דְמוּת como “semelhança” e a construção que introduz o aspecto dos seres, sem identificar mais precisamente sua natureza.
- source_word: מַרְאֵיהֶם
  choice: sua aparência
  rationale: Representa diretamente o substantivo com sufixo plural e mantém a distinção entre “semelhança” e “aparência” presente no hebraico.
- source_word: כְּגַחֲלֵי אֵשׁ בֹּעֲרוֹת
  choice: como brasas ardentes
  rationale: Expressa tanto as brasas de fogo quanto sua combustão ativa em português natural, sem a redundância pouco idiomática de “brasas de fogo ardentes”.
- source_word: כְּמַרְאֵה הַלַּפִּדִים
  choice: como a aparência de tochas
  rationale: Mantém a segunda comparação explícita com מַרְאֵה e traduz לַפִּדִים diretamente como “tochas”.
- source_word: הִיא מִתְהַלֶּכֶת
  choice: Ela se movia de um lado para outro
  rationale: O pronome feminino conserva a referência gramaticalmente ambígua, enquanto a forma verbal comunica movimento contínuo ou repetido.
- source_word: בֵּין הַחַיּוֹת
  choice: entre os seres viventes
  rationale: Traduz בֵּין de modo direto e permite entender o movimento no meio do grupo.
- source_word: וְנֹגַהּ לָאֵשׁ
  choice: O fogo resplandecia
  rationale: Comunica idiomaticamente que o fogo possuía brilho ou radiância, sentido da construção hebraica.
- source_word: וּמִן הָאֵשׁ יוֹצֵא בָרָק
  choice: e do fogo saíam relâmpagos
  rationale: Preserva a ação vívida e contínua do particípio; o plural idiomático em português retrata as sucessivas manifestações de relâmpago sem alterar o fenômeno descrito.
theological_decisions:
- issue: Referente do pronome feminino singular הִיא
  choice: “Ela”, com nota que explicita a ambiguidade
  alternative: “Isso” ou “o fogo”, entendendo que o fenômeno ígneo se movia entre os seres viventes
  rationale: O hebraico emprega um pronome feminino singular cujo antecedente exato não é inequívoco. A tradução mantém o gênero e evita decidir silenciosamente entre a semelhança/aparência e o fogo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A pontuação divide a descrição longa sem apagar suas relações. O marcador [a] aparece junto ao pronome cuja referência requer esclarecimento.
