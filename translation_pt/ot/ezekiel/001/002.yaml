base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/002.yaml
  text: On the fifth day of the month—it was the fifth year of the exile of King Jehoiachin—[a]
translation:
  language: pt
  text: No quinto dia do mês — era o quinto ano do exílio do rei Joaquim —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da deportação do rei Joaquim”. O hebraico גָּלוּת pode indicar exílio ou deportação; “exílio” foi escolhido por ser mais abrangente e mais natural como referência cronológica.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/חֲמִשָּׁה
  choice: No quinto dia
  rationale: Na fórmula de datação, a preposição בְּ com o numeral cardinal indica “no quinto”; “dia” é acrescentado naturalmente em português para explicitar a data.
- source_word: לַ/חֹדֶשׁ
  choice: do mês
  rationale: Na fórmula hebraica de datação, completa a expressão “no quinto dia do mês”; esta é a construção mais natural em português.
- source_word: הִיא
  choice: era
  rationale: O pronome independente tem função resumptiva ou enfática e introduz a explicação cronológica; “era” preserva essa função com fluidez.
- source_word: הַ/שָּׁנָה הַ/חֲמִישִׁית
  choice: o quinto ano
  rationale: Tradução direta e clara da expressão ordinal de datação.
- source_word: לְ/גָלוּת
  choice: do exílio
  rationale: גָלוּת pode designar tanto o exílio como a deportação. “Exílio” é mais abrangente e funciona naturalmente como referência cronológica, enquanto a alternativa é preservada em nota.
- source_word: הַ/מֶּלֶךְ
  choice: do rei
  rationale: 'Em português, o título antes do nome aparece naturalmente com artigo na construção genitiva: “do rei Joaquim”.'
- source_word: יוֹיָכִין
  choice: Joaquim
  rationale: Adota-se a forma bíblica tradicional e amplamente reconhecida em português para o nome de Jeconias/Jeoaquim nesta passagem, distinguida pelo contexto.
