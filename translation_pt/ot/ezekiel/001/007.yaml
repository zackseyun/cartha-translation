  text: וְ/רַגְלֵי/הֶ֖ם רֶ֣גֶל יְשָׁרָ֑ה וְ/כַ֣ף רַגְלֵי/הֶ֗ם כְּ/כַף֙ רֶ֣גֶל עֵ֔גֶל וְ/נֹ֣צְצִ֔ים כְּ/עֵ֖ין נְחֹ֥שֶׁת קָלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/007.yaml
  text: Their legs were straight[a], and the soles of their feet were like the sole of a calf’s foot[b], and they gleamed like the appearance of polished bronze.
translation:
  language: pt
  text: Suas pernas eram retas, e as plantas dos seus pés eram como a planta do pé de um bezerro[a]; reluziam como bronze polido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “como o casco de um bezerro”. O hebraico diz mais literalmente “como a planta do pé de um bezerro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “bronze brunido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: suas pernas
  rationale: רֶגֶל pode designar o pé ou a perna. Como a frase seguinte menciona especificamente as plantas dos pés, “pernas” preserva a distinção contextual.
- source_word: רֶגֶל יְשָׁרָה
  choice: eram retas
  rationale: 'O substantivo e o adjetivo no singular têm sentido distributivo: as pernas de cada ser eram retas. “Retas” comunica a descrição sem interpretar além do texto.'
- source_word: כַּף רַגְלֵיהֶם
  choice: as plantas dos seus pés
  rationale: כַּף, em referência ao corpo, denota a palma da mão ou a planta do pé. Esta é a formulação natural e precisa em português.
- source_word: כְּכַף רֶגֶל עֵגֶל
  choice: como a planta do pé de um bezerro
  rationale: A tradução mantém a comparação anatômica explícita do hebraico. A forma mais idiomática “como o casco de um bezerro” fica registrada em nota.
- source_word: וְנֹצְצִים
  choice: reluziam
  rationale: O particípio descreve brilho intenso ou cintilante. “Reluziam” é claro, digno e adequado à visão; a ausência de sujeito expresso também evita determinar mais do que o hebraico aquilo que reluzia.
- source_word: כְּעֵין
  choice: como
  rationale: Nesta construção, עַיִן indica aparência. Em português, “como bronze polido” expressa naturalmente a comparação sem a formulação mais pesada “como a aparência de”.
- source_word: נְחֹשֶׁת קָלָל
  choice: bronze polido
  rationale: נְחֹשֶׁת pode indicar cobre ou bronze, enquanto קָלָל descreve aqui um metal polido ou brunido. “Bronze polido” é claro e corrente; a alternativa tradicional “bronze brunido” aparece em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação conserva a descrição corporal incomum da visão e evita transformar a comparação literal com o pé do bezerro em uma interpretação no texto principal.
