  source_fidelity: A tradução preserva adequadamente as distinções do hebraico entre רַגְלֵיהֶם (“pernas”) e כַּף רַגְלֵיהֶם (“plantas dos pés”). A comparação formal com “a planta do pé de um bezerro” é mantida, e “reluziam como bronze polido” comunica bem o particípio נֹצְצִים e a imagem de נְחֹשֶׁת קָלָל, sem especificar indevidamente o sujeito do brilho.
