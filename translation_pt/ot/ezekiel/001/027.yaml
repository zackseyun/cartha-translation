  text: וָ/אֵ֣רֶא כְּ/עֵ֣ין חַשְׁמַ֗ל כְּ/מַרְאֵה אֵ֤שׁ בֵּֽית לָ/הּ֙ סָבִ֔יב מִ/מַּרְאֵ֥ה מָתְנָ֖י/ו וּ/לְ/מָ֑עְלָ/ה וּ/מִ/מַּרְאֵ֤ה מָתְנָי/ו֙ וּ/לְ/מַ֔טָּה רָאִ֨יתִי֙ כְּ/מַרְאֵה אֵ֔שׁ וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִֽיב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
translation:
  language: pt
  text: E vi algo semelhante ao aspecto de metal incandescente[a], como o aspecto de fogo, em seu interior, por todo o redor[b], desde o aspecto de sua cintura para cima; e, desde o aspecto de sua cintura para baixo, vi algo como o aspecto de fogo, com um resplendor ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico חַשְׁמַל (hashmal) é incerto; também pode ser traduzido por “âmbar” ou “electro”, uma liga metálica brilhante.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida por “em seu interior, por todo o redor” é difícil; pode retratar o fogo como estando dentro de algo que o circundava, possivelmente um resplendor ou revestimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵין חַשְׁמַל
  choice: algo semelhante ao aspecto de metal incandescente
  rationale: A construção é comparativa e visionária, não uma identificação direta. “Metal incandescente” comunica luminosidade metálica sem atribuir precisão indevida ao termo raro חַשְׁמַל.
- source_word: כְּמַרְאֵה
  choice: como/o aspecto de; o que parecia ser
  rationale: A formulação mantém a linguagem fenomenológica repetida do hebraico, com leve variação em português para preservar clareza e naturalidade.
- source_word: בֵּית לָהּ סָבִיב
  choice: ao redor, no interior dele
  rationale: A expressão hebraica é difícil. Esta tradução conserva tanto a ideia de interior quanto a de algo circundante, sem impor a imagem mais específica de um invólucro.
- source_word: מָתְנָיו
  choice: sua cintura
  rationale: “Cintura” é corrente e inteligível, além de corresponder adequadamente à referência corporal da visão.
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: com um resplendor ao redor dele
  rationale: “Resplendor” expressa a luminosidade de נֹגַהּ; o pronome masculino conserva a referência gramatical à figura antropomórfica.
theological_decisions:
- issue: Referente da descrição antropomórfica
  choice: “sua cintura” e “ao redor dele”
  alternative: Empregar formas impessoais como “a cintura da figura” e “ao redor dela”
  rationale: Os sufixos hebraicos estão no masculino singular, e o contexto imediato apresenta uma semelhança de forma humana. A tradução conserva essa antropomorfia sem identificar a figura além do que o texto declara.
- issue: Natureza do fenômeno luminoso descrito por חַשְׁמַל
  choice: “metal incandescente” com nota de incerteza
  alternative: “âmbar” ou “electro”
  rationale: O termo é raro e seu sentido exato é incerto. A opção escolhida preserva a impressão luminosa e metálica sem transformar uma possibilidade lexical em afirmação teológica ou material definida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “aspecto” preserva o caráter visionário e cauteloso do original; a sintaxe foi moderadamente ajustada para fluência sem eliminar suas correspondências espaciais.
