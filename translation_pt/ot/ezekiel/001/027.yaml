revisions:
- from: E vi algo semelhante ao aspecto de metal incandescente[a], como o aspecto de fogo ao redor, no interior dele, desde o que parecia ser a sua cintura para cima; e, desde o que parecia ser a sua cintura para baixo, vi algo como o aspecto de fogo[b], com um resplendor ao redor dele.
