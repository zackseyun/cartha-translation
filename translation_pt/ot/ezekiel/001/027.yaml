  terminology: “Metal incandescente”, “aspecto”, “cintura” e “resplendor” são escolhas aceitáveis. A nota sobre חַשְׁמַל mantém corretamente a incerteza lexical. “Electro” é termo técnico pouco comum, mas está devidamente explicado como liga metálica.
