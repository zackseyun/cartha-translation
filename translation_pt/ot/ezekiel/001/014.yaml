  yaml_path: translation/ot/ezekiel/001/014.yaml
  text: And the living creatures were running back and forth[a], like the appearance of lightning.
translation:
  language: pt
  text: E os seres viventes corriam de um lado para o outro[a], como a aparência de um relâmpago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “os seres viventes corriam e voltavam, como a aparência de um relâmpago”.'
    reason: Alternativa lexical que reproduz mais diretamente os dois infinitivos hebraicos, embora soe menos natural em português.
lexical_decisions:
- source_word: וְהַחַיּוֹת
  choice: E os seres viventes
  rationale: חַיּוֹת designa os seres animados da visão. “Seres viventes” preserva o caráter descritivo do hebraico sem antecipar a identificação feita mais adiante em Ezequiel 10:20.
- source_word: רָצוֹא וָשׁוֹב
  choice: corriam de um lado para o outro
  rationale: A combinação dos infinitivos absolutos de רוץ (“correr”) e שוב (“voltar”) comunica movimento rápido e repetido. A formulação portuguesa expressa naturalmente esse vaivém, enquanto a nota registra a construção mais formal.
- source_word: כְּמַרְאֵה
  choice: como a aparência de
  rationale: מַרְאֶה se refere à aparência ou aspecto visível. Manter “aparência” preserva a linguagem visionária característica de Ezequiel.
- source_word: הַבָּזָק
  choice: um relâmpago
  rationale: בָּזָק denota relâmpago ou clarão de relâmpago. O artigo hebraico pode funcionar genericamente; “um relâmpago” produz uma comparação clara e natural em português.
