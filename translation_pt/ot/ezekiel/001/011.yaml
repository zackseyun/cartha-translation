translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “asas” esclarece o referente do numeral feminino, enquanto as notas preservam a ambiguidade da orientação das asas e da construção recíproca.
