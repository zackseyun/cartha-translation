base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/011.yaml
  text: And their faces and their wings were separated above[a]; each had two joined to one another[b], and two covering their bodies.
translation:
  language: pt
  text: Seus rostos e suas asas estavam separados no alto[a]. Cada um tinha duas asas unidas às de outro[b], e duas que cobriam seu corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estavam abertos para cima”. O verbo hebraico significa basicamente “estar separado” ou “dividido”, mas, neste contexto, pode indicar que as asas estavam estendidas para cima.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “para cada um, duas estavam unidas, cada um”; a expressão pode ser entendida no sentido recíproco de que as asas se uniam umas às outras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְנֵיהֶם
  choice: seus rostos
  rationale: פָּנִים tem forma plural e, no contexto dos quatro seres viventes, o plural português preserva naturalmente a referência aos rostos deles.
- source_word: וְכַנְפֵיהֶם
  choice: suas asas
  rationale: Tradução direta de כָּנָף neste contexto visionário.
- source_word: פְּרֻדוֹת מִלְמָעְלָה
  choice: estavam separados no alto
  rationale: Preserva o sentido básico de פרד, “separar”, e toma מִלְמָעְלָה em sentido locativo. A concordância portuguesa no masculino plural decorre do sujeito composto “rostos e asas”.
- source_word: לְאִישׁ
  choice: cada um tinha
  rationale: אִישׁ possui força distributiva aqui. O verbo “tinha” explicita em português a construção descritiva elíptica sem alterar seu conteúdo.
- source_word: שְׁתַּיִם חֹבְרוֹת אִישׁ
  choice: duas asas unidas às de outro
  rationale: חבר indica união ou ligação. A formulação conserva a ideia de que duas asas de cada ser se ligavam às de outro, sem especificar além do hebraico a configuração exata.
- source_word: וּשְׁתַּיִם מְכַסּוֹת אֵת גְּוִיֹתֵיהֶנָה
  choice: e duas que cobriam seu corpo
  rationale: O particípio מְכַסּוֹת descreve uma ação contínua, e גְּוִיָּה significa “corpo” neste contexto. O singular distributivo “seu corpo” corresponde a “cada um”.
