  text: וּ/מִ֨/תּוֹכָ֔/הּ דְּמ֖וּת אַרְבַּ֣ע חַיּ֑וֹת וְ/זֶה֙ מַרְאֵֽי/הֶ֔ן דְּמ֥וּת אָדָ֖ם לָ/הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/005.yaml
  text: 'And from within it came the likeness of four living creatures[b][a]. And this was their appearance: they had the likeness of a man.'
translation:
  language: pt
  text: 'Do meio dela surgiu a semelhança de quatro seres viventes[a]. Esta era a aparência deles: tinham semelhança de ser humano[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quatro criaturas viventes”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “semelhança de um homem”; isto é, aparência humana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתּוֹכָהּ
  choice: Do meio dela
  rationale: Preserva o sentido espacial de procedência, “do interior/meio dela”, e o pronome feminino que retoma o fenômeno descrito no contexto anterior.
- source_word: דְּמוּת
  choice: algo semelhante a / semelhança
  rationale: Mantém a linguagem analógica característica da visão de Ezequiel, sem identificar diretamente aquilo que o profeta vê.
- source_word: אַרְבַּע חַיּוֹת
  choice: quatro seres viventes
  rationale: חַיּוֹת designa aqui seres animados da visão. “Seres viventes” comunica vida sem sugerir indevidamente que sejam animais comuns ou definir sua natureza como angélica.
- source_word: וְזֶה מַרְאֵיהֶן
  choice: Esta era a aparência deles
  rationale: מַרְאֶה se refere ao aspecto visível; a formulação conserva o demonstrativo singular e expressa naturalmente em português a aparência coletiva dos quatro seres.
- source_word: דְּמוּת אָדָם
  choice: semelhança humana
  rationale: אָדָם indica aqui forma humana, não necessariamente um homem do sexo masculino. A expressão preserva a ideia de semelhança e evita uma especificação de gênero que o contexto não exige.
- source_word: לָהֵנָּה
  choice: tinham
  rationale: A construção hebraica significa literalmente “era para eles”, mas funciona de modo possessivo; “tinham” é a formulação idiomática em português.
theological_decisions:
- issue: Descrição da natureza dos seres visionários sem defini-la em excesso
  choice: Conservar a linguagem de semelhança e traduzir חַיּוֹת por “seres viventes”
  alternative: Identificá-los no texto principal como anjos ou traduzir simplesmente por “criaturas”
  rationale: O versículo descreve o que Ezequiel percebe por meio de linguagem analógica. A tradução mantém essa reserva fenomenológica e teológica, sem atribuir aos seres uma identidade mais específica do que o texto fornece.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Surgia algo semelhante” torna natural a oração nominal hebraica sem eliminar a linguagem cautelosa da visão; “semelhança humana” evita o uso potencialmente ambíguo de “homem” quando o referente é a forma humana em geral.
