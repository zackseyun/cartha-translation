base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/010.yaml
  text: 'As for the likeness of their faces: each had a human face; the four had a lion’s face on the right side[a], the four had an ox’s face on the left side, and the four had an eagle’s face.'
translation:
  language: pt
  text: Quanto à aparência dos seus rostos, cada um tinha rosto humano; os quatro tinham rosto de leão do lado direito, rosto de boi do lado esquerdo e rosto de águia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abutre”; o hebraico néšer pode designar mais amplamente uma grande ave de rapina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  choice: Quanto à aparência dos seus rostos
  rationale: דְּמוּת expressa semelhança, forma ou aparência. A formulação introduz naturalmente, em português, a descrição do aspecto dos rostos.
- source_word: פְּנֵי אָדָם
  choice: rosto humano
  rationale: אָדָם designa aqui o ser humano em contraste com os animais, sem exigir referência específica ao sexo masculino.
- source_word: אַרְיֵה
  choice: leão
  rationale: É o sentido lexical comum do termo e forma uma expressão natural com 'rosto de'.
- source_word: אֶל הַיָּמִין
  choice: do lado direito
  rationale: A expressão indica a posição do rosto de leão e é vertida de modo espacialmente claro.
- source_word: לְאַרְבַּעְתָּם / לְאַרְבַּעְתָּן
  choice: os quatro tinham
  rationale: A construção distribui cada característica entre os quatro seres. Em português, a explicitação inicial evita repetição pesada sem alterar o alcance distributivo.
- source_word: שׁוֹר
  choice: boi
  rationale: É a designação portuguesa comum e precisa para o bovino mencionado na visão.
- source_word: מֵהַשְּׂמֹאול
  choice: do lado esquerdo
  rationale: Embora a preposição tenha normalmente sentido de origem, neste contexto espacial a expressão localiza o rosto de boi à esquerda.
- source_word: נֶשֶׁר
  choice: águia
  rationale: É a tradução tradicional e contextualmente adequada, embora o hebraico possa designar mais amplamente uma grande ave de rapina; a alternativa é registrada em nota.
theological_decisions:
- issue: Sentido de אָדָם na descrição dos seres viventes
  choice: rosto humano
  alternative: rosto de homem
  rationale: O contraste é entre a espécie humana e as espécies animais, não entre os sexos; 'humano' preserva esse sentido sem acrescentar especificidade masculina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a distribuição dos quatro tipos de rosto entre todos os quatro seres e evita repetições desnecessárias.
