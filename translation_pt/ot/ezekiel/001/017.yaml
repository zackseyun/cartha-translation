  text: As they went[a], they went in any of their four directions; they did not turn as they went.
translation:
  language: pt
  text: Ao se moverem[a], iam em qualquer uma das quatro direções; não se viravam ao se moverem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ao se moverem, iam sobre os seus quatro lados; não se viravam ao se moverem». A expressão hebraica “seus quatro lados/quadrantes” pode ser entendida como lados espaciais ou como direções.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶן
  choice: em qualquer uma das quatro direções
  rationale: A expressão literalmente espacial, «sobre/segundo os seus quatro lados ou quadrantes», descreve a orientação do movimento. «Em qualquer uma das quatro direções» é natural em português e comunica o sentido contextual, enquanto a nota preserva a possibilidade mais concreta de «lados».
- source_word: בְּלֶכְתָּם
  choice: quando se moviam
  rationale: O infinitivo construto com בְּ indica ação simultânea. A formulação é clara e evita uma repetição excessivamente dura sem eliminar a relação temporal.
- source_word: יֵלֵכוּ
  choice: seguiam
  rationale: O imperfeito descreve a ação característica das rodas na visão. «Seguiam» expressa movimento continuado sem acrescentar uma mudança de rumo.
- source_word: לֹא יִסַּבּוּ
  choice: não se viravam
  rationale: O nifal de סבב indica que não giravam nem se desviavam para mudar a orientação durante o movimento. «Não se viravam» mantém a imagem sem explicá-la em excesso.
- source_word: בְּלֶכְתָּן
  choice: enquanto avançavam
  rationale: O segundo infinitivo temporal indica simultaneidade. O sufixo feminino plural provavelmente retoma um referente feminino próximo; em português, a forma verbal não precisa explicitar esse gênero.
