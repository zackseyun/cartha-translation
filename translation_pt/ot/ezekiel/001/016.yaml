base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/016.yaml
  text: The appearance of the wheels and their workmanship was like the gleam of beryl[a], and the four of them had the same likeness; and their appearance and their workmanship were as if a wheel were within a wheel.
translation:
  language: pt
  text: A aparência das rodas e a sua construção eram como o brilho de uma pedra de társhish[a]. As quatro tinham a mesma forma; sua aparência e sua construção eram como se uma roda estivesse dentro de outra roda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico társhish, uma pedra preciosa cuja identificação exata é incerta; tradicionalmente traduzida como “berilo” ou “crisólito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה הָאוֹפַנִּים
  choice: A aparência das rodas
  rationale: מַרְאֶה designa aquilo que se vê, isto é, a aparência visível; אוֹפַן é o termo comum para “roda”.
- source_word: וּמַעֲשֵׂיהֶם
  choice: e sua construção
  rationale: מַעֲשֶׂה pode indicar obra, feitura ou construção. “Construção” comunica naturalmente a configuração das rodas e é repetido para preservar o paralelismo hebraico.
- source_word: כְּעֵין תַּרְשִׁישׁ
  choice: como o brilho de uma pedra de Társis
  rationale: כְּעֵין, literalmente ligado a “olho/aparência”, indica aqui a qualidade visual da pedra. A identificação mineralógica de תַּרְשִׁישׁ é incerta; por isso, a transliteração evita uma precisão indevida, enquanto “pedra” explicita o referente no contexto.
- source_word: וּדְמוּת אֶחָד לְאַרְבַּעְתָּן
  choice: As quatro tinham a mesma forma
  rationale: A expressão hebraica comprimida significa literalmente “uma semelhança para as quatro”. A formulação portuguesa preserva a uniformidade das quatro rodas com clareza.
- source_word: וּמַרְאֵיהֶם וּמַעֲשֵׂיהֶם
  choice: sua aparência e sua construção
  rationale: A repetição dos mesmos termos do início é mantida para refletir a estrutura e a ênfase do hebraico.
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: como se uma roda estivesse dentro de outra roda
  rationale: A tradução conserva a comparação e a imagem enigmática da configuração, sem tentar explicar mecanicamente como as rodas se cruzavam.
theological_decisions:
- issue: Configuração de uma roda dentro de outra
  choice: Manter a imagem visionária sem explicação adicional
  alternative: Interpretar como duas rodas cruzadas perpendicularmente
  rationale: O texto descreve a aparência, mas não especifica de modo inequívoco a geometria. A tradução preserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Pedra de Társis” retém a incerteza lexical do hebraico; a nota apresenta as equivalências tradicionais. A repetição de “aparência” e “construção” acompanha deliberadamente o paralelismo do original.
