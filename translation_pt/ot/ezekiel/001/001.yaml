  source_fidelity: O texto traduz com precisão a fórmula de data, a localização de Ezequiel entre os exilados junto ao rio Quebar, a abertura dos céus e «visões de Deus». «No trigésimo ano» preserva corretamente a referência cronológica não especificada no hebraico. «Visões de Deus» mantém sem resolver a ambiguidade do genitivo em מַרְאוֹת אֱלֹהִים.
