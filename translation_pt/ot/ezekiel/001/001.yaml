id: EZK.1.1
reference: Ezekiel 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֣י בִּ/שְׁלֹשִׁ֣ים שָׁנָ֗ה בָּֽ/רְבִיעִי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ וַ/אֲנִ֥י בְ/תֽוֹךְ הַ/גּוֹלָ֖ה עַל נְהַר כְּבָ֑ר נִפְתְּחוּ֙ הַ/שָּׁמַ֔יִם וָ/אֶרְאֶ֖ה מַרְא֥וֹת אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/001.yaml
  text: It happened in the thirtieth year[a], in the fourth month, on the fifth day of the month, while I was among the exiles by the Kebar River, the heavens were opened[b], and I saw visions of God.
translation:
  language: pt
  text: Aconteceu que, no trigésimo ano, no quarto mês, no quinto dia do mês, enquanto eu estava entre os exilados junto ao rio Quebar[a], os céus se abriram, e eu vi visões de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «canal Quebar». O hebraico diz «rio Quebar», mas talvez se trate de um grande canal da Babilônia.
    reason: cultural_note
  - marker: b
    text: Ou «visões divinas» ou «visões vindas de Deus».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz o relato de modo natural em português moderno, preservando a função narrativa sem recorrer ao arcaísmo «E aconteceu».
- source_word: בִּשְׁלֹשִׁים שָׁנָה
  choice: no trigésimo ano
  rationale: A expressão funciona como referência cronológica. O texto não identifica explicitamente o ponto inicial da contagem, por isso a tradução mantém essa indefinição.
- source_word: בָּרְבִיעִי
  choice: no quarto mês
  rationale: Embora «mês» esteja implícito no hebraico, a fórmula de data exige que seja explicitado em português para maior clareza.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: no quinto dia do mês
  rationale: Reproduz com naturalidade a fórmula hebraica de data, na qual «dia» está implícito.
- source_word: וַאֲנִי בְתוֹךְ הַגּוֹלָה
  choice: enquanto eu estava entre os exilados
  rationale: Expressa o valor circunstancial da oração e situa Ezequiel no meio da comunidade deportada.
- source_word: עַל נְהַר כְּבָר
  choice: junto ao rio Quebar
  rationale: עַל indica localização junto ao curso de água; נְהַר significa «rio», enquanto Quebar é o nome próprio. A possibilidade histórica de se tratar de um canal é registrada em nota.
- source_word: נִפְתְּחוּ הַשָּׁמַיִם
  choice: os céus se abriram
  rationale: Mantém o plural e o tom visionário do hebraico, com formulação idiomática em português.
- source_word: וָאֶרְאֶה
  choice: e eu vi
  rationale: Preserva a percepção visual expressa diretamente pelo verbo hebraico e a progressão narrativa.
- source_word: מַרְאוֹת אֱלֹהִים
  choice: visões de Deus
  rationale: É a correspondência mais direta e conserva a ambiguidade do construto hebraico quanto à origem, ao conteúdo ou à qualidade das visões.
theological_decisions:
- issue: Sentido do genitivo em מַרְאוֹת אֱלֹהִים
  choice: visões de Deus
  alternative: visões divinas; visões vindas de Deus
  rationale: A construção hebraica admite mais de uma relação entre Deus e as visões. A formulação principal preserva essa abertura sem definir se Deus é a fonte, o conteúdo ou a caracterização das visões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem cronológica e o tom elevado da visão foram preservados. Os marcadores de nota foram colocados junto às expressões a que efetivamente se referem.
