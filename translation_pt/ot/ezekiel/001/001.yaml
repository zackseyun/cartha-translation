  terminology: «Exilados», «rio Quebar», «céus» e «visões de Deus» são escolhas consistentes, claras e adequadas. A transliteração «Quebar» é bem estabelecida em português bíblico. As notas preservam tanto a questão histórico-geográfica do curso de água quanto as alternativas semânticas da expressão final.
