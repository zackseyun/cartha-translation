  text: וְ/אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵ֑כוּ אֶ֣ל אֲשֶׁר֩ יִֽהְיֶה שָׁ֨מָּ/ה הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/012.yaml
  text: And each one went straight ahead[a]. Wherever the spirit was to go, they went[b]; they did not turn as they went.
translation:
  language: pt
  text: Cada um seguia diretamente para a frente[a]. Para onde o espírito havia de ir, eles iam[b]; não se viravam enquanto avançavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na direção de seu rosto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o vento”; possivelmente, “o Espírito”. A palavra hebraica רוּחַ pode significar “espírito”, “vento” ou “sopro”, e o versículo não identifica expressamente o referente.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ
  choice: Cada um
  rationale: O substantivo אִישׁ tem aqui sentido distributivo e se refere individualmente aos quatro seres viventes; “cada um” evita identificá-los indevidamente como humanos.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: diretamente para a frente
  rationale: A expressão significa literalmente “na direção de seu rosto”. No contexto, indica que cada ser avançava em linha reta, na direção para a qual estava voltado.
- source_word: יֵלֵכוּ
  choice: seguia / iam
  rationale: O imperfeito descreve a ação habitual ou continuada dentro da visão. O passado imperfeito em português expressa naturalmente esse valor descritivo.
- source_word: אֶל אֲשֶׁר יִהְיֶה שָׁמָּה הָרוּחַ לָלֶכֶת
  choice: Para onde o espírito havia de ir
  rationale: A formulação preserva a direção e a finalidade expressas pela construção hebraica, sem identificar de modo excessivamente específico o referente de רוּחַ.
- source_word: הָרוּחַ
  choice: o espírito
  rationale: רוּחַ pode significar “espírito”, “vento” ou “sopro”. “Espírito”, em minúscula, se ajusta ao contexto de impulso coordenador sem afirmar explicitamente que se trata do Espírito Santo.
- source_word: לֹא יִסַּבּוּ
  choice: não se viravam
  rationale: O nifal de סבב indica virar-se ou mudar de direção. O imperfeito português mantém o caráter descritivo e continuado da cena.
- source_word: בְּלֶכְתָּן
  choice: enquanto avançavam
  rationale: O infinitivo construto com ב indica simultaneidade. “Enquanto avançavam” é natural em português e evita repetir o verbo “ir”.
theological_decisions:
- issue: Se רוּחַ deve ser entendido como referência direta ao Espírito Santo
  choice: o espírito
  alternative: o vento; o Espírito
  rationale: O hebraico não identifica expressamente o referente. A minúscula no texto principal preserva a ambiguidade, enquanto a nota registra as demais possibilidades legítimas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O aspecto descritivo dos verbos hebraicos foi representado pelo pretérito imperfeito. As notas foram posicionadas junto às expressões a que efetivamente se referem.
