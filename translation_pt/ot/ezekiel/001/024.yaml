base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
translation:
  language: pt
  text: 'Então ouvi o som das asas deles, enquanto iam: como o som de muitas águas, como o som do Todo-Poderoso[a], um som tumultuoso, como o som de um acampamento militar[b]. Quando paravam, baixavam as asas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como o som de Shaddai”. O hebraico usa o título divino שַׁדַּי (Shaddai), tradicionalmente traduzido por “o Todo-Poderoso”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou simplesmente: “como o som de um acampamento”. A palavra hebraica costuma designar um acampamento, muitas vezes militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Então ouvi
  rationale: O wayyiqtol dá continuidade ao relato da visão; “Então ouvi” expressa com naturalidade a sequência narrativa.
- source_word: קוֹל
  choice: som / voz
  rationale: קוֹל designa som, ruído ou voz. “Som” convém às asas, às águas e ao acampamento; diante do título divino, “voz” é natural, sem exigir que se trate de uma fala articulada.
- source_word: כַּנְפֵיהֶם
  choice: as asas deles
  rationale: Reproduz o plural com sufixo de terceira pessoa e mantém claro que as asas pertencem aos seres viventes.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: como o som de muitas águas
  rationale: Preserva a imagem hebraica de um volume sonoro imenso sem especificar indevidamente que as águas corriam ou rugiam.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Traduz o título divino tradicionalmente entendido como “Todo-Poderoso”, mantendo “Shaddai” em nota como alternativa de transliteração.
- source_word: בְּלֶכְתָּם
  choice: enquanto avançavam
  rationale: A construção temporal situa o som no movimento dos seres; “avançavam” é natural no contexto visionário e contrasta com “paravam”.
- source_word: הֲמֻלָּה
  choice: um som tumultuoso
  rationale: Comunica um ruído intenso e agitado em português atual, sem introduzir uma fonte sonora ausente do hebraico.
- source_word: כְּקוֹל מַחֲנֶה
  choice: como o som de um acampamento militar
  rationale: מַחֲנֶה significa “acampamento” e frequentemente tem sentido militar; a formulação explicita o provável contexto sem substituir o acampamento pelo próprio exército.
- source_word: בְּעָמְדָם
  choice: Quando paravam
  rationale: Expressa a circunstância temporal e ressalta de modo idiomático o contraste com o movimento anterior.
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: baixavam as asas
  rationale: O hifil de רפה indica deixar cair, afrouxar ou pender; “baixavam” descreve claramente a cessação do movimento das asas.
theological_decisions:
- issue: Sentido e forma de שַׁדַּי
  choice: o Todo-Poderoso
  alternative: Shaddai
  rationale: A tradução comunica ao leitor o valor tradicional do título divino, enquanto a nota preserva a forma hebraica e reconhece que sua etimologia exata é discutida.
- issue: קוֹל diante de שַׁדַּי
  choice: voz do Todo-Poderoso
  alternative: som do Todo-Poderoso
  rationale: “Voz” é uma acepção legítima de קוֹל e soa natural em referência a Deus, mas a nota registra “som” para não transformar necessariamente a comparação em fala articulada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência adequada ao relato visionário. A repetição de “som” conserva a força retórica do hebraico, enquanto a divisão sintática torna compreensível a sequência das comparações.
