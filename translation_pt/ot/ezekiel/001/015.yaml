base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/015.yaml
  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
translation:
  language: pt
  text: Enquanto eu olhava para os seres viventes, eis que havia uma roda no chão, ao lado dos seres viventes, em relação às quatro faces de cada um.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “correspondente às suas quatro faces”. A expressão hebraica é compacta e pode indicar a relação da roda com as quatro faces de cada ser vivente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Enquanto eu olhava
  rationale: A forma narrativa de ראה introduz o que o profeta percebe na visão. A formulação mantém o relato visual em primeira pessoa e faz uma transição natural para וְהִנֵּה.
- source_word: הַחַיּוֹת
  choice: os seres viventes
  rationale: O termo designa os seres animados da visão do trono. “Seres viventes” é claro, digno e evita definir sua identidade além do que este versículo declara.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: A partícula chama a atenção para um elemento novo e surpreendente da visão; “eis que” conserva essa força de apresentação vívida.
- source_word: אוֹפַן אֶחָד
  choice: uma roda
  rationale: O substantivo singular seguido de אֶחָד destaca uma única roda no quadro descrito. Em português, o artigo indefinido comunica naturalmente essa unidade sem exigir o enfático “uma só roda”.
- source_word: בָּאָרֶץ
  choice: no chão
  rationale: No contexto da visão, a expressão indica a posição da roda ao nível do solo. “No chão” é mais natural em português do que “na terra” para essa localização concreta.
- source_word: אֵצֶל
  choice: ao lado de
  rationale: A preposição indica proximidade espacial, expressa de modo direto e corrente por “ao lado de”.
- source_word: לְאַרְבַּעַת פָּנָיו
  choice: para as quatro faces de cada um
  rationale: 'A expressão hebraica é compacta, e o sufixo singular após o plural “seres viventes” pode ter sentido distributivo: cada ser tem quatro faces. A tradução preserva a relação indicada pela preposição sem definir com excessiva precisão sua natureza espacial.'
theological_decisions:
- issue: Referente e valor do singular em לְאַרְבַּעַת פָּנָיו
  choice: 'Entender o sufixo singular distributivamente: “para as quatro faces de cada um”'
  alternative: “correspondente às suas quatro faces” ou, mais literalmente, “para as suas quatro faces”
  rationale: O contexto imediato afirma que cada ser vivente tinha quatro faces. O singular pode, portanto, referir-se individualmente a cada membro do grupo. Como a preposição לְ e a configuração exata da roda em relação às faces permanecem compactas e ambíguas, o texto principal evita impor uma reconstrução mais específica da visão.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom conserva a vivacidade profética de “eis que”, enquanto “seres viventes” mantém dignidade e continuidade terminológica. A ambiguidade espacial da frase final é preservada e documentada em nota.
