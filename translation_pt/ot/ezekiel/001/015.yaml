  rationale: A revisão limita-se à frase final. “Em relação às quatro faces de cada um” substitui um calque pouco natural por uma formulação portuguesa inteligível, preservando a relação não especificada com as quatro faces e o valor distributivo provável do sufixo singular. A nota registra a alternativa de correspondência sem apresentá-la como a única interpretação.
