  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/לֶכְתָּ֣/ם יֵלֵ֔כוּ וּ/בְ/עָמְדָ֖/ם יַֽעֲמֹ֑דוּ וּֽ/בְ/הִנָּשְׂאָ֞/ם מֵ/עַ֣ל הָ/אָ֗רֶץ יִנָּשְׂא֤וּ הָ/אֽוֹפַנִּים֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/021.yaml
  text: When they went[a], these went; and when they stood, these stood; and when they were lifted up from above the earth, the wheels were lifted up alongside them[c][b], for the spirit of the living creatures was in the wheels.
translation:
  language: pt
  text: Quando eles iam, elas iam; quando eles ficavam parados, elas ficavam paradas; e, quando eles eram erguidos acima do chão, as rodas eram erguidas junto deles[b], pois o espírito[a] dos seres viventes[c] estava nas rodas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o vento» ou «o sopro».
    reason: lexical_alternative
  - marker: b
    text: Ou «em correspondência com eles» ou «diante deles».
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, «o ser vivente» está no singular, possivelmente como referência coletiva aos seres viventes considerados uma realidade unificada.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתָּם ... יֵלֵכוּ
  choice: Quando eles iam, elas iam
  rationale: A construção com ב e infinitivo tem valor temporal. O primeiro pronome retoma os seres viventes, e o feminino «elas» torna claro em português que o segundo verbo se refere às rodas, sem acrescentar os substantivos ao hebraico.
- source_word: וּבְעָמְדָם יַעֲמֹדוּ
  choice: quando eles ficavam parados, elas ficavam paradas
  rationale: עמד expressa permanecer de pé ou imóvel. «Ficavam parados» é natural no contexto de movimento e conserva o paralelismo e a distinção de gênero entre os seres e as rodas.
- source_word: וּבְהִנָּשְׂאָם מֵעַל הָאָרֶץ
  choice: quando eles eram erguidos acima do chão
  rationale: O nifal de נשׂא conserva a nuance passiva, enquanto «acima do chão» comunica naturalmente a posição indicada por מֵעַל הָאָרֶץ.
- source_word: יִנָּשְׂאוּ הָאוֹפַנִּים
  choice: as rodas eram erguidas
  rationale: Repete-se a forma passiva de נשׂא, preservando a ligação verbal entre a elevação dos seres e a das rodas.
- source_word: לְעֻמָּתָם
  choice: junto deles
  rationale: No contexto, o termo descreve a posição correspondente e o movimento coordenado das rodas. «Junto deles» é claro e idiomático, enquanto outras nuances são registradas em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação do movimento sincronizado.
- source_word: רוּחַ
  choice: espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro. Aqui, «espírito» expressa melhor o princípio animador sem identificá-lo explicitamente com o Espírito Santo.
- source_word: הַחַיָּה
  choice: dos seres viventes
  rationale: Embora o hebraico use o singular com artigo, o contexto favorece uma referência coletiva aos seres viventes. O plural torna esse sentido claro em português, e a forma singular do texto-fonte é preservada em nota.
- source_word: בָּאוֹפַנִּים
  choice: estava nas rodas
  rationale: A preposição ב indica localização; «nas rodas» é a correspondência direta e natural.
theological_decisions:
- issue: Sentido de רוּחַ na visão
  choice: espírito
  alternative: vento; sopro
  rationale: «Espírito» preserva o provável sentido de força animadora, mas a nota mantém a polissemia hebraica e evita uma identificação doutrinária mais específica.
- issue: Número gramatical de הַחַיָּה
  choice: seres viventes, em sentido coletivo
  alternative: o ser vivente; a criatura vivente
  rationale: O singular hebraico pode apresentar os vários seres como uma realidade coletiva. O plural é mais claro no contexto português, enquanto a nota informa explicitamente a forma singular da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A alternância entre «eles» e «elas» esclarece naturalmente a relação entre os seres viventes e as rodas. Mantiveram-se a repetição estrutural, a voz passiva e as ambiguidades lexicais relevantes por meio de notas.
