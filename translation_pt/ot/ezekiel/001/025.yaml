base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/025.yaml
  text: And there was a sound from above the expanse that was over their heads[a]; when they stood still[b], they let down their wings.
translation:
  language: pt
  text: E houve um som[a] vindo de cima da expansão, que estava sobre as cabeças deles. Quando paravam, baixavam as asas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma voz vinda de cima da expansão”. A palavra hebraica pode significar tanto “som” como “voz”; “som” foi mantido no texto porque a frase ainda não especifica uma fala articulada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Então veio
  rationale: O wayyiqtol de היה introduz a ocorrência do fenômeno e dá continuidade à narrativa. “Então veio” é natural em português e evita a formulação arcaica “e aconteceu que”.
- source_word: קוֹל
  choice: um som
  rationale: קוֹל pode significar “som”, “voz” ou “ruído”. Como esta oração ainda não especifica fala articulada, “som” preserva melhor a ambiguidade contextual.
- source_word: מֵעַל לָרָקִיעַ
  choice: de cima da expansão
  rationale: מֵעַל indica procedência de uma posição acima, e רָקִיעַ designa a extensão ou expansão vista na visão. A expressão mantém a imagem espacial em português atual.
- source_word: אֲשֶׁר עַל רֹאשָׁם
  choice: que estava sobre a cabeça deles
  rationale: A oração relativa modifica “expansão”. O hebraico usa “cabeça” no singular com sufixo plural, construção preservada de modo natural em português distributivo.
- source_word: בְּעָמְדָם
  choice: Quando eles paravam
  rationale: O infinitivo construto com בְּ expressa circunstância temporal. No contexto alternado de movimento e imobilidade dos seres viventes, “paravam” comunica com clareza que cessavam de se mover.
- source_word: תְּרַפֶּינָה
  choice: abaixavam
  rationale: A forma de רפה expressa deixar frouxo, baixar ou deixar cair. Com “asas”, “abaixavam” transmite de modo natural que elas deixavam de permanecer erguidas ou estendidas.
- source_word: כַנְפֵיהֶן
  choice: as asas
  rationale: כָּנָף no plural com sufixo feminino plural significa “asas deles/delas”. Em português, o sujeito já expresso permite o possessivo implícito sem perda de sentido.
theological_decisions:
- issue: Identidade do קוֹל acima da expansão
  choice: Mantida como “som” no texto principal
  alternative: “voz”
  rationale: O termo hebraico admite ambas as leituras, mas o versículo ainda não declara de modo inequívoco que se trata de fala. A tradução não antecipa essa identificação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Expansão” preserva a imagem de רָקִיעַ sem recorrer ao tradicional e menos transparente “firmamento”. A repetição verbal no imperfeito (“paravam”, “abaixavam”) representa a ação habitual ou concomitante sugerida pelo contexto.
