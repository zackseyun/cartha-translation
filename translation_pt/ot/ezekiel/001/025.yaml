- from: Então veio um som de cima da expansão que estava sobre a cabeça deles[a]. Quando eles paravam, abaixavam as asas.
  to: E houve um som[a] vindo de cima da expansão, que estava sobre as cabeças deles. Quando paravam, baixavam as asas.
