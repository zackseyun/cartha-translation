  naturalness: O português é claro, solene e natural para leitores brasileiros e internacionais. “Com o rosto em terra” comunica adequadamente a prostração. “Em volta” soa um pouco mais idiomático que “ao redor” neste contexto, sem perder o sentido espacial.
  terminology: “Arco-íris”, “resplendor”, “glória” e “Yahweh” são adequados. A repetição de “aspecto” é justificadamente preservada para refletir o vocabulário visionário do hebraico.
