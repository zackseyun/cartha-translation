  text: כְּ/מַרְאֵ֣ה הַ/קֶּ֡שֶׁת אֲשֶׁר֩ יִֽהְיֶ֨ה בֶ/עָנָ֜ן בְּ/י֣וֹם הַ/גֶּ֗שֶׁם כֵּ֣ן מַרְאֵ֤ה הַ/נֹּ֨גַהּ֙ סָבִ֔יב ה֕וּא מַרְאֵ֖ה דְּמ֣וּת כְּבוֹד יְהוָ֑ה וָֽ/אֶרְאֶה֙ וָ/אֶפֹּ֣ל עַל פָּנַ֔/י וָ/אֶשְׁמַ֖ע ק֥וֹל מְדַבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/028.yaml
  text: Like the appearance of the rainbow that is in the cloud on a day of rain[a], so was the appearance of the brightness all around. This was the appearance of the likeness of the glory of Yahweh. When I saw it, I fell on my face[d][c][b], and I heard the voice of one speaking.
translation:
  language: pt
  text: Como o aspecto do arco-íris que está na nuvem em dia de chuva[a], assim era o aspecto do resplendor em volta. Esse era o aspecto da semelhança da glória de Yahweh[b]. Quando vi isso, caí com o rosto em terra e ouvi uma voz que falava[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o arco”; neste contexto de nuvem e chuva, refere-se ao arco-íris.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é literalmente “o aspecto da semelhança da glória de Yahweh”, preservando as várias camadas de qualificação no relato da visão de Ezequiel.
    reason: cultural_note
  - marker: c
    text: 'Ou: “ouvi a voz de alguém que falava”. O hebraico não identifica explicitamente quem fala nesta oração.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמַרְאֵה הַקֶּשֶׁת
  choice: Como o aspecto do arco-íris
  rationale: מַרְאֶה designa aparência ou aspecto visível, e כְּ introduz a comparação. Embora קֶשֶׁת signifique literalmente “arco”, a menção de nuvem e chuva indica o arco-íris.
- source_word: אֲשֶׁר יִהְיֶה בֶעָנָן בְּיוֹם הַגֶּשֶׁם
  choice: que aparece na nuvem em dia de chuva
  rationale: A formulação comunica naturalmente em português o fenômeno visível descrito pelo hebraico, sem alterar seu cenário meteorológico.
- source_word: כֵּן מַרְאֵה הַנֹּגַהּ סָבִיב
  choice: assim era o aspecto do resplendor ao redor
  rationale: נֹגַהּ pode indicar brilho, luminosidade ou resplendor. “Resplendor” mantém o caráter luminoso e o registro digno; סָבִיב indica que ele circundava a manifestação.
- source_word: מַרְאֵה דְּמוּת כְּבוֹד יְהוָה
  choice: o aspecto da semelhança da glória de Yahweh
  rationale: A sequência aspecto–semelhança–glória preserva as sucessivas qualificações do relato visionário, sem identificar de modo direto a visão com a essência divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וָאֶרְאֶה וָאֶפֹּל עַל־פָּנַי
  choice: Quando vi isso, caí com o rosto em terra
  rationale: “Quando vi isso” liga naturalmente a reação à visão anterior; “com o rosto em terra” expressa em português corrente o gesto hebraico de prostração.
- source_word: וָאֶשְׁמַע קוֹל מְדַבֵּר
  choice: e ouvi a voz de alguém que falava
  rationale: קוֹל é aqui “voz”, e o particípio מְדַבֵּר não identifica explicitamente quem fala. A tradução conserva essa indefinição.
theological_decisions:
- issue: Descrição em camadas da manifestação divina
  choice: o aspecto da semelhança da glória de Yahweh
  alternative: a semelhança da glória de Yahweh; o aspecto da glória de Yahweh
  rationale: O hebraico acumula os termos מַרְאֵה, דְּמוּת e כָּבוֹד. Mantê-los evita transformar a visão qualificada de Ezequiel numa afirmação mais direta do que o texto permite.
- issue: Identidade de quem fala
  choice: a voz de alguém que falava
  alternative: uma voz que falava; a voz daquele que falava
  rationale: O particípio hebraico não nomeia o falante. “Alguém” preserva a indefinição sem antecipar sua identificação pelo contexto posterior.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “aspecto” é intencional para reproduzir o padrão visual do hebraico. “Resplendor” mantém dignidade sem obscurecer o sentido; “com o rosto em terra” comunica naturalmente a prostração.
