base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/023.yaml
  text: And under the expanse their wings were straight[a], each one toward her sister. Each had two covering them[b], and each had two covering their bodies.
translation:
  language: pt
  text: Debaixo da expansão[a], suas asas eram retas, uma em direção à outra.[b] Cada ser tinha duas asas que o cobriam, e cada um tinha duas que lhe cobriam o corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “firmamento”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “uma mulher em direção à sua irmã”, empregando formas femininas porque “asas” é feminino em hebraico; o sentido é que as asas se correspondiam ou se orientavam umas para as outras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת הָרָקִיעַ
  choice: Debaixo da expansão
  rationale: Expressa com naturalidade a relação espacial da visão. “Expansão” preserva a imagem de algo estendido acima dos seres sem recorrer ao termo menos corrente “firmamento”.
- source_word: כַּנְפֵיהֶם
  choice: as asas deles
  rationale: Tradução direta de כָּנָף no contexto dos seres viventes.
- source_word: יְשָׁרוֹת
  choice: estavam estendidas em linha reta
  rationale: Comunica tanto a retidão quanto o alinhamento das asas; a expressão seguinte esclarece que se orientavam umas para as outras.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: uma em direção à outra
  rationale: Reproduz de modo idiomático o sentido distributivo da expressão hebraica feminina, cuja formulação literal é “uma mulher em direção à sua irmã”.
- source_word: לְאִישׁ שְׁתַּיִם
  choice: Cada ser tinha duas asas
  rationale: לְאִישׁ é distributivo, “para cada um”. “Ser” torna explícito o referente no contexto, e “asas” é repetido para clareza em português.
- source_word: מְכַסּוֹת לָהֵנָּה
  choice: que o cobriam
  rationale: O particípio indica a função do primeiro par de asas. O singular distributivo em português acompanha “cada ser” e evita uma construção obscura.
- source_word: אֵת גְּוִיֹּתֵיהֶם
  choice: lhe cobriam o corpo
  rationale: גְּוִיָּה aqui designa o corpo dos seres vivos, não um cadáver. A formulação distributiva conserva a estrutura de “cada um”.
theological_decisions: []
translation_notes:
