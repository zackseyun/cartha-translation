  text: חֹֽבְרֹ֛ת אִשָּׁ֥ה אֶל אֲחוֹתָ֖/הּ כַּנְפֵי/הֶ֑ם לֹא יִסַּ֣בּוּ בְ/לֶכְתָּ֔/ן אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/009.yaml
  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
translation:
  language: pt
  text: Suas asas estavam unidas[a], cada uma à sua companheira. Quando se moviam, não se viravam; cada um seguia na direção para a qual seu rosto estava voltado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “uma mulher à sua irmã”, expressão usada para partes correspondentes ligadas umas às outras.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cada um seguia sempre em frente”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבְרֹת
  choice: estavam unidas
  rationale: O particípio passivo de חבר expressa o estado de estarem ligadas; “estavam unidas” é natural e preserva esse valor.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: cada uma à sua companheira
  rationale: A expressão é literalmente “uma mulher à sua irmã”, mas funciona distributivamente para partes femininas correspondentes, aqui as asas. “Companheira” conserva a correspondência feminina sem soar como parentesco literal.
- source_word: כַּנְפֵיהֶם
  choice: suas asas
  rationale: Tradução direta do substantivo com sufixo possessivo plural.
- source_word: לֹא יִסַּבּוּ
  choice: não se viravam
  rationale: סבב indica virar ou mudar de direção; o imperfeito descreve o padrão de movimento observado na visão.
- source_word: בְּלֶכְתָּן
  choice: quando se moviam
  rationale: O infinitivo construto com ב indica ação simultânea; esta formulação é clara em português e concorda com o referente feminino imediato, as asas.
- source_word: אִישׁ
  choice: cada um
  rationale: O masculino singular tem força distributiva e se refere a cada ser vivente, sem necessariamente indicar sexo.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: na direção para a qual seu rosto estava voltado
  rationale: Preserva de modo natural a imagem hebraica da direção correspondente ao rosto, sem reduzir inteiramente a expressão a “em frente”.
- source_word: יֵלֵכוּ
  choice: seguia
  rationale: הלך denota ir ou deslocar-se; no contexto, “seguia” comunica movimento contínuo e combina com a formulação distributiva “cada um”.
