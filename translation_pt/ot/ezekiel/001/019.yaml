revisions:
- from: Quando os seres viventes se moviam[a], as rodas se moviam ao lado deles; e, quando os seres viventes se elevavam da terra[b], as rodas também se elevavam.
  to: Quando os seres viventes se moviam[a], as rodas se moviam ao lado deles; e, quando os seres viventes eram erguidos da terra[b], as rodas eram erguidas.
  rationale: A revisão limita-se a substituir as duas ocorrências reflexivas de «se elevavam» pela voz passiva «eram erguidos». Assim, preserva-se mais claramente o nifal hebraico e sua repetição, sem introduzir um agente para a elevação nem alterar a ambiguidade do texto quanto a esse agente. As demais escolhas estão adequadas.
