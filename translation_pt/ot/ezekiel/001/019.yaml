  text: וּ/בְ/לֶ֨כֶת֙ הַֽ/חַיּ֔וֹת יֵלְכ֥וּ הָ/אוֹפַנִּ֖ים אֶצְלָ֑/ם וּ/בְ/הִנָּשֵׂ֤א הַֽ/חַיּוֹת֙ מֵ/עַ֣ל הָ/אָ֔רֶץ יִנָּשְׂא֖וּ הָ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/019.yaml
  text: When the living creatures moved[a], the wheels moved beside them; and when the living creatures were lifted up from the earth[b], the wheels were lifted up.
translation:
  language: pt
  text: Quando os seres viventes se moviam[a], as rodas se moviam ao lado deles; e, quando os seres viventes eram erguidos da terra[b], as rodas eram erguidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «iam», tanto para os seres como para as rodas; o hebraico usa o mesmo verbo para o movimento coordenado de ambos.
    reason: lexical_alternative
  - marker: b
    text: Mais adiante, Ezequiel identifica esses «seres viventes» como querubins (ver Ezequiel 10:20).
    reason: cross_reference
lexical_decisions:
- source_word: וּבְלֶכֶת
  choice: Quando ... se moviam
  rationale: A preposição בְּ com o infinitivo construto de הלך introduz uma circunstância temporal. A formulação é natural em português e mantém o sentido temporal.
- source_word: הַחַיּוֹת
  choice: os seres viventes
  rationale: No contexto da visão, o termo designa seres animados ligados ao trono, não animais comuns. A expressão é precisa sem antecipar sua identificação posterior como querubins.
- source_word: יֵלְכוּ
  choice: se moviam
  rationale: Embora הלך possa significar «ir» ou «andar», «mover-se» se aplica naturalmente tanto aos seres quanto às rodas e ressalta seu movimento coordenado.
- source_word: הָאוֹפַנִּים
  choice: as rodas
  rationale: אופן denota diretamente uma roda; o plural se refere às rodas associadas aos seres da visão.
- source_word: אֶצְלָם
  choice: ao lado deles
  rationale: אצל expressa proximidade. A escolha comunica de modo claro a estreita associação espacial entre as rodas e os seres.
- source_word: וּבְהִנָּשֵׂא
  choice: quando ... se elevavam
  rationale: O nifal de נשׂא indica aqui elevação. «Elevavam-se» é natural em português e permite conservar a repetição verbal da oração seguinte sem especificar um agente.
- source_word: מֵעַל הָאָרֶץ
  choice: da terra
  rationale: A expressão significa literalmente «de sobre a terra». «Da terra» transmite com concisão o afastamento da superfície.
- source_word: יִנָּשְׂאוּ
  choice: também se elevavam
  rationale: A repetição de «se elevavam» preserva o elo lexical com הִנָּשֵׂא e evidencia o movimento coordenado. «Também» explicita de forma idiomática essa correspondência, já inerente à estrutura.
theological_decisions:
- issue: Identidade de הַחַיּוֹת na visão de Ezequiel
  choice: Manter «os seres viventes» no texto principal
  alternative: «os querubins»
  rationale: Embora Ezequiel 10:20 identifique posteriormente esses seres como querubins, este versículo emprega o termo mais geral חַיּוֹת. A tradução preserva a designação local e deixa a identificação posterior para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Seres viventes» mantém o caráter visionário e a terminologia do contexto; a repetição de «se moviam» e «se elevavam» reproduz a coordenação enfática do hebraico.
