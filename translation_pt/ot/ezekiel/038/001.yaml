  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'A palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também transliterado como «Jeová».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה אלי, o sentido idiomático em português é que a palavra divina «veio» ao profeta; isso evita o literalismo pouco natural de «e aconteceu a palavra».
- source_word: דְבַר
  choice: A palavra
  rationale: דָּבָר designa aqui a palavra ou mensagem divina. «A palavra» preserva a fórmula profética tradicional e a ligação lexical com a fala que vem em seguida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição אֶל com o sufixo de primeira pessoa, indicando que a palavra foi dirigida ao profeta.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a declaração divina subsequente; «dizendo» mantém a estrutura do hebraico em português natural e digno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, enquanto «Jeová» é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase conserva a fórmula profética hebraica sem soar arcaica. O marcador [a] acompanha «mim» conforme a camada de consulta fornecida, embora a nota diga respeito ao nome «Yahweh».
