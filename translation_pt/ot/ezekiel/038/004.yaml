  text: וְ/שׁ֣וֹבַבְתִּ֔י/ךָ וְ/נָתַתִּ֥י חַחִ֖ים בִּ/לְחָיֶ֑י/ךָ וְ/הוֹצֵאתִי֩ אוֹתְ/ךָ֨ וְ/אֶת כָּל חֵילֶ֜/ךָ סוּסִ֣ים וּ/פָרָשִׁ֗ים לְבֻשֵׁ֤י מִכְלוֹל֙ כֻּלָּ֔/ם קָהָ֥ל רָב֙ צִנָּ֣ה וּ/מָגֵ֔ן תֹּפְשֵׂ֥י חֲרָב֖וֹת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
translation:
  language: pt
  text: Eu farei você dar meia-volta, porei ganchos em seus maxilares[a] e farei você sair — você e todo o seu exército, cavalos e cavaleiros, todos plenamente equipados, uma grande multidão portando escudos grandes e pequenos[b], todos eles empunhando espadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em suas faces” ou “em suas bochechas”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico distingue aqui dois tipos de escudo, provavelmente um escudo grande e outro menor.
    reason: cultural_note
lexical_decisions:
- source_word: וְשׁוֹבַבְתִּיךָ
  choice: Eu farei você dar meia-volta
  rationale: Expressa a ação causativa de redirecionar Gog, em português corrente, sem especificar uma rota nem enfraquecer a iniciativa divina.
- source_word: חַחִים
  choice: ganchos
  rationale: Preserva a imagem concreta de instrumentos usados para controlar animais ou prisioneiros.
- source_word: בִּלְחָיֶיךָ
  choice: em seus maxilares
  rationale: לְחִי pode significar maxilar ou face/bochecha; no quadro de ganchos usados para controle, “maxilares” comunica melhor a imagem concreta, mantendo-se a alternativa em nota.
- source_word: וְהוֹצֵאתִי אוֹתְךָ
  choice: e farei você sair
  rationale: Reproduz o causativo hebraico e mantém Deus como agente explícito, em formulação natural em português.
- source_word: חֵילֶךָ
  choice: todo o seu exército
  rationale: No contexto militar, חַיִל designa as forças de Gog, e não riqueza ou valentia.
- source_word: סוּסִים וּפָרָשִׁים
  choice: cavalos e cavaleiros
  rationale: Conserva os dois elementos da expressão hebraica em vez de condensá-los em “cavalaria”.
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: vestidos com equipamento completo
  rationale: A expressão indica que todos estão plenamente equipados; “equipamento completo” respeita o contexto militar sem afirmar de modo excessivamente específico que se trata apenas de armadura.
- source_word: קָהָל רָב
  choice: uma grande multidão
  rationale: Comunica um vasto grupo reunido, aqui de caráter militar, em linguagem ampla e natural.
- source_word: צִנָּה וּמָגֵן
  choice: escudos grandes e pequenos
  rationale: Torna compreensível ao leitor moderno a distinção provável entre dois tipos de escudo, um maior e outro menor, evitando o arcaísmo “broquel”.
- source_word: תֹּפְשֵׂי חֲרָבוֹת
  choice: empunhando espadas
  rationale: Transmite de modo idiomático a ação de segurar ou portar espadas, com prontidão militar.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Preserva a repetição enfática do hebraico e o alcance abrangente da descrição.
theological_decisions:
- issue: A ação divina na mobilização de Gog
  choice: Deus é apresentado como quem redireciona Gog, põe ganchos nele e o faz sair com suas forças.
  alternative: Entender os verbos em sentido meramente permissivo, como se Deus apenas deixasse Gog avançar.
  rationale: A sequência de verbos causativos na primeira pessoa expressa ação divina forte. A tradução mantém essa afirmação e não tenta resolver a tensão entre a soberania divina e as intenções de Gog.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de boa legibilidade brasileira. “Farei você” evita formas excessivamente solenes, enquanto “maxilares”, “cavaleiros” e “empunhando” preservam a força da imagem profética e militar.
