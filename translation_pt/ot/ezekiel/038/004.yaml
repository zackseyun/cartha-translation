- from: Eu farei você dar meia-volta, porei ganchos em seus maxilares[a] e farei você sair — você e todo o seu exército, cavalos e cavaleiros, todos eles vestidos com equipamento completo, uma grande multidão com escudos grandes e pequenos[b], todos eles empunhando espadas.
