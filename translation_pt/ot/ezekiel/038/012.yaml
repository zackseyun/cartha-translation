  text: לִ/שְׁלֹ֥ל שָׁלָ֖ל וְ/לָ/בֹ֣ז בַּ֑ז לְ/הָשִׁ֨יב יָדְ/ךָ֜ עַל חֳרָב֣וֹת נוֹשָׁבֹ֗ת וְ/אֶל עַם֙ מְאֻסָּ֣ף מִ/גּוֹיִ֔ם עֹשֶׂה֙ מִקְנֶ֣ה וְ/קִנְיָ֔ן יֹשְׁבֵ֖י עַל טַבּ֥וּר הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/012.yaml
  text: to seize spoil and to carry off plunder[a], to turn your hand against ruins now inhabited and against a people gathered from the nations, who have acquired livestock and goods, who dwell at the center of the earth.
translation:
  language: pt
  text: para saquear e levar o despojo, para voltar a tua mão contra ruínas agora habitadas e contra um povo reunido dentre as nações, que adquiriu rebanhos e bens e habita no centro da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o umbigo da terra”, uma expressão que indica o centro ou o meio da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: para saquear e levar o despojo
  rationale: Os dois infinitivos com objetos cognatos formam um paralelismo enfático. A formulação portuguesa conserva as duas ações e evita a repetição pouco natural de cognatos.
- source_word: לְהָשִׁיב יָדְךָ
  choice: para voltar a sua mão contra
  rationale: Mantém a imagem hebraica de dirigir novamente a mão, isto é, o poder ou a ação, contra um alvo, sem substituí-la por uma explicação.
- source_word: חֳרָבוֹת נוֹשָׁבוֹת
  choice: ruínas agora habitadas
  rationale: Preserva a tensão entre a devastação anterior e o repovoamento presente.
- source_word: עַם מְאֻסָּף מִגּוֹיִם
  choice: um povo reunido dentre as nações
  rationale: Expressa de modo natural que o povo foi ajuntado a partir de várias nações.
- source_word: עֹשֶׂה מִקְנֶה וְקִנְיָן
  choice: que adquiriu rebanhos e bens
  rationale: Neste contexto, עֹשֶׂה indica adquirir ou acumular. 'Rebanhos' abrange os animais domésticos como riqueza, e 'bens' comunica propriedade adquirida.
- source_word: יֹשְׁבֵי עַל טַבּוּר הָאָרֶץ
  choice: e habita no centro da terra
  rationale: Traduz idiomaticamente a metáfora do 'umbigo' como o meio ou centro da terra, mantendo o referente coletivo no singular em concordância com 'povo'.
theological_decisions:
- issue: Geografia metafórica em טַבּוּר הָאָרֶץ
  choice: no centro da terra
  alternative: sobre o umbigo da terra
  rationale: A tradução idiomática comunica a centralidade geográfica pretendida sem sugerir indevidamente uma afirmação cosmológica literal; a imagem original é registrada em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém o verso como continuação sintática do contexto anterior e conserva, sempre que natural, suas imagens hebraicas.
