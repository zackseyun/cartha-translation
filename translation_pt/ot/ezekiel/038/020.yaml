source:
  edition: WLC
  text: וְ/רָעֲשׁ֣וּ מִ/פָּנַ֡/י דְּגֵ֣י הַ/יָּם֩ וְ/ע֨וֹף הַ/שָּׁמַ֜יִם וְ/חַיַּ֣ת הַ/שָּׂדֶ֗ה וְ/כָל הָ/רֶ֨מֶשׂ֙ הָ/רֹמֵ֣שׂ עַל הָֽ/אֲדָמָ֔ה וְ/כֹל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וְ/נֶהֶרְס֣וּ הֶ/הָרִ֗ים וְ/נָֽפְלוּ֙ הַ/מַּדְרֵג֔וֹת וְ/כָל חוֹמָ֖ה לָ/אָ֥רֶץ תִּפּֽוֹל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/020.yaml
  text: The fish of the sea[a], the birds of the heavens, the beasts of the field, every creeping thing that creeps on the ground, and every man who is on the face of the earth will quake at my presence; the mountains will be thrown down, the cliffs will fall, and every wall will fall to the ground.
translation:
  language: pt
  text: Os peixes do mar, as aves do céu, os animais do campo, todo ser rastejante que rasteja sobre o solo e todo ser humano[a] que está sobre a face da terra tremerão na minha presença. Os montes serão derrubados, as escarpas[b] cairão, e todo muro cairá por terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo homem” ou “toda a humanidade”. O hebraico usa אָדָם coletivamente para os seres humanos.
    reason: lexical_alternative
  - marker: b
    text: Ou “os lugares íngremes”; possivelmente “os terraços”. O termo hebraico é raro e pode indicar encostas ou formações em degraus.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וְרָעֲשׁוּ
  choice: tremerão
  rationale: O verbo רעשׁ descreve forte tremor ou abalo provocado pela manifestação divina; “tremerão” aplica-se naturalmente aos seres vivos e mantém a ligação com o cenário sísmico.
- source_word: מִפָּנַי
  choice: na minha presença
  rationale: A expressão significa literalmente “da/diante da minha face”; aqui indica que a presença de Deus causa o tremor. “Na minha presença” conserva essa ideia sem explicá-la em excesso.
- source_word: דְּגֵי הַיָּם
  choice: os peixes do mar
  rationale: Reprodução direta e natural da construção hebraica.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves do céu
  rationale: “Céu” é a forma corrente e digna em português para שָׁמַיִם nesta expressão.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais do campo
  rationale: A expressão abrange os animais terrestres, frequentemente os selvagens; “animais do campo” preserva o alcance sem recorrer ao termo potencialmente arcaico “feras”.
- source_word: כָּל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאֲדָמָה
  choice: todo ser rastejante que rasteja sobre o solo
  rationale: Mantém a repetição cognata intencional do hebraico e a abrangência da expressão, sem restringi-la apenas a répteis.
- source_word: כֹל הָאָדָם
  choice: todo ser humano
  rationale: אָדָם é empregado coletivamente para a humanidade. “Todo ser humano” comunica com precisão esse sentido distributivo e inclusivo em português moderno.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face da terra
  rationale: Preserva a imagem do idioma hebraico e permanece clara no registro bíblico moderno.
- source_word: וְנֶהֶרְסוּ הֶהָרִים
  choice: os montes serão derrubados
  rationale: O nifal de הרס indica que os montes serão demolidos ou arrasados; “serão derrubados” expressa o colapso catastrófico.
- source_word: הַמַּדְרֵגוֹת
  choice: as escarpas
  rationale: O substantivo raro parece designar formações elevadas em degraus, encostas íngremes ou terraços. “Escarpas” se ajusta ao contexto de colapso sísmico, enquanto a nota preserva a incerteza lexical.
- source_word: כָל חוֹמָה לָאָרֶץ תִּפּוֹל
  choice: todo muro cairá por terra
  rationale: A forma distributiva singular acompanha o hebraico, e “cair por terra” é uma expressão portuguesa natural para o colapso total.
theological_decisions:
- issue: Sentido coletivo de אָדָם
  choice: todo ser humano
  alternative: todo homem; toda a humanidade
  rationale: Neste contexto, o singular אָדָם abrange indistintamente todos os humanos sobre a terra. A tradução evita que “homem” seja entendido como referência exclusiva ao sexo masculino, sem acrescentar interpretação teológica.
- issue: Relação entre a presença divina e o tremor
  choice: tremerão na minha presença
  alternative: tremerão diante de mim; tremerão por causa da minha presença
  rationale: A formulação mantém tanto a imagem relacional de estar perante Deus quanto a força causal sugerida pela preposição, sem tornar explícita apenas uma dessas nuances.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica moderada. A repetição “ser rastejante que rasteja” foi mantida por corresponder ao recurso estilístico hebraico. “Face da terra” e “cairá por terra” conservam imagens tradicionais ainda compreensíveis, enquanto “ser humano” evita ambiguidade de gênero no uso coletivo de אָדָם.
