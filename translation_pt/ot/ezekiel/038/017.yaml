base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/017.yaml
  text: 'Thus says the Lord GOD: Are you the one of whom I spoke in former days by the hand of my servants the prophets of Israel[c][b][a], who prophesied in those days for years that I would bring you against them?'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: É você aquele de quem falei em tempos antigos, por meio[a] dos meus servos, os profetas de Israel, que profetizaram naqueles dias, durante anos,[b] que eu traria você contra eles?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «pela mão de»; expressão que significa «por meio de».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «naqueles dias, anos»; a formulação incomum parece enfatizar que essas profecias foram pronunciadas ao longo de muitos anos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva o título אֲדֹנָי e representa diretamente o nome divino יהוה, evitando a combinação pouco natural «Senhor SENHOR».
- source_word: הַאַתָּה הוּא
  choice: Não é você aquele
  rationale: Reproduz em português natural a pergunta enfática de identificação; a formulação negativa é idiomática e mantém a força retórica do hebraico.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: de quem falei
  rationale: Expressa naturalmente a referência pessoal e preserva o sentido de que Deus havia falado anteriormente a respeito desse agente.
- source_word: בְּיָמִים קַדְמוֹנִים
  choice: em tempos antigos
  rationale: Comunica com clareza o horizonte remoto da expressão hebraica sem recorrer a linguagem arcaizante.
- source_word: בְּיַד
  choice: por meio de
  rationale: Traduz o idioma hebraico de mediação ou agência de modo corrente em português; a forma literal «pela mão de» poderia sugerir um sentido físico indevido.
- source_word: עֲבָדַי נְבִיאֵי יִשְׂרָאֵל
  choice: meus servos, os profetas de Israel
  rationale: «Servos» é adequado ao contexto de comissão profética, e a aposição identifica esses servos como os profetas de Israel.
- source_word: הַנִּבְּאִים
  choice: que profetizaram
  rationale: O particípio relativo descreve a atividade reiterada dos profetas; o pretérito perfeito oferece uma leitura clara no contexto passado.
- source_word: בַּיָּמִים הָהֵם שָׁנִים
  choice: naqueles dias, durante anos
  rationale: Mantém os dois elementos temporais da construção hebraica incomum e torna explícita sua provável ênfase na duração prolongada.
- source_word: לְהָבִיא אֹתְךָ עֲלֵיהֶם
  choice: que eu traria você contra eles
  rationale: Apresenta o conteúdo da profecia anterior e traduz עֲלֵיהֶם segundo o contexto militar hostil.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha preserva tanto o título quanto o nome da aliança expresso no texto hebraico, sem ocultar יהוה sob um título substitutivo.
- issue: Identidade do destinatário com a figura anunciada pelos profetas
  choice: mantida como pergunta retórica
  alternative: 'afirmação direta: «Você é aquele...»'
  rationale: O ה interrogativo do hebraico requer uma pergunta. A tradução não transforma em afirmação a identificação retórica feita por Deus.
- issue: Referência profética anterior a Gogue
  choice: sem identificar profecias específicas
  alternative: harmonizar com uma passagem profética determinada
  rationale: O versículo não nomeia os textos ou profetas em vista; preservar essa indeterminação evita impor uma solução intertextual ou escatológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe segue de perto a pergunta hebraica, mas verte o idioma de agência de maneira natural. As notas preservam a imagem literal e a construção temporal incomum.
