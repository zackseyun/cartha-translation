  text: Be prepared[b][a], and prepare yourself—you and all your assembly who are gathered around you—and be a guard for them.
translation:
  language: pt
  text: Esteja preparado e prepare-se — você e toda a sua multidão, reunida junto a você — e seja o guarda deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fique de guarda por eles” ou “seja responsável por eles”. O hebraico pode indicar guardar, vigiar ou assumir a responsabilidade pelo grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֹּן וְהָכֵן לְךָ
  choice: Prepare-se e fique pronto
  rationale: Os dois imperativos da raiz כון reforçam a ordem de preparação. A formulação portuguesa distingue preparação ativa e estado de prontidão, mantendo a intensificação sem reproduzir uma repetição pouco natural.
- source_word: קְהָלֶךָ
  choice: toda a multidão
  rationale: קהל designa o conjunto reunido. “Multidão” é natural e suficientemente amplo, sem especificar além do hebraico que se trata de um exército.
- source_word: הַנִּקְהָלִים עָלֶיךָ
  choice: reunida ao seu redor
  rationale: O particípio descreve o grupo que se ajunta em torno de Gogue; a concordância no singular coletivo com “multidão” produz português fluente.
- source_word: וְהָיִיתָ לָהֶם לְמִשְׁמָר
  choice: e seja o guarda deles
  rationale: מִשְׁמָר pode indicar guarda, vigilância ou responsabilidade protetora. “Seja o guarda deles” conserva a construção nominal e sua ambiguidade funcional.
