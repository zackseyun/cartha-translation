  text: 'e diga: “Assim diz o Soberano SENHOR: Eis que estou contra você, Gogue, príncipe supremo de Meseque e Tubal.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Soberano SENHOR
  rationale: Representa a combinação do título divino com o nome pessoal, mantendo a distinção por meio de ‘Soberano’ e da forma tradicional ‘SENHOR’ em versaletes.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Eis que estou contra você
  rationale: Preserva a fórmula enfática de confronto e o sentido hostil da preposição neste contexto profético.
- source_word: נְשִׂיא רֹאשׁ
  choice: príncipe supremo
  rationale: Entende רֹאשׁ como substantivo em função qualificadora, ‘principal/supremo’, leitura sintaticamente natural e coerente com a evidência massorética.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Meseque e Tubal
  rationale: Emprega as formas portuguesas tradicionais dos topônimos e trata ambos como territórios associados ao governo de Gogue.
theological_decisions:
- issue: Identificação de רֹאשׁ como título ou topônimo
  choice: príncipe supremo de Meseque e Tubal
  alternative: príncipe de Rôs, Meseque e Tubal
  rationale: A construção massorética favorece a leitura de רֹאשׁ como qualificação de נְשִׂיא; não se introduz um terceiro povo ou território sem necessidade textual inequívoca.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por ‘você’ para legibilidade ampla. A fórmula profética conserva dignidade, ênfase e concisão.
