base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/010.yaml
  text: 'Thus says the Lord GOD: On that day[a], things will come up in your heart[b], and you will devise an evil plan.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Naquele dia, pensamentos[b] surgirão em seu coração[a], e você elaborará um plano mau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No idioma hebraico, o coração é o centro do pensamento e da intenção, não apenas das emoções.
    reason: cultural_note
  - marker: b
    text: 'Ou: “coisas” ou “assuntos surgirão em seu coração”. O hebraico pode significar “palavras”, mas também, em sentido mais amplo, “coisas” ou “assuntos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em português natural, solene e reconhecível.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição pouco clara 'Senhor SENHOR'.
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa naturalmente a circunstância futura introduzida pelo idioma hebraico, sem reproduzir de modo rígido o verbo היה.
- source_word: יַעֲלוּ דְבָרִים
  choice: pensamentos surgirão
  rationale: No contexto de algo que sobe ao coração e resulta em planejamento, דְבָרִים designa coisas ou assuntos que vêm à mente; 'pensamentos' comunica o sentido idiomático com clareza, enquanto a nota preserva a amplitude lexical.
- source_word: עַל לְבָבֶךָ
  choice: em seu coração
  rationale: Mantém a imagem antropológica hebraica do coração como centro do pensamento e da intenção, em vez de reduzi-la a 'mente'.
- source_word: וְחָשַׁבְתָּ
  choice: você conceberá
  rationale: Neste contexto, חשב indica elaboração intencional; 'conceberá' transmite a formação deliberada do plano e evita uma repetição estilisticamente pesada.
- source_word: מַחֲשֶׁבֶת רָעָה
  choice: um plano maligno
  rationale: O substantivo cognato indica um desígnio calculado, e רָעָה lhe atribui qualidade moral negativa; 'maligno' é claro e digno em português atual.
theological_decisions:
- issue: Representação do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução explicita tanto o título Adonai quanto o nome próprio YHWH, sem confundi-los nem produzir 'Senhor SENHOR'.
- issue: Sentido antropológico de לֵבָב
  choice: coração no texto, explicado como centro do pensamento e da intenção
  alternative: mente
  rationale: Preserva a linguagem e a concepção hebraicas sem sugerir que o versículo trate apenas de emoção; a nota oferece a orientação cultural necessária.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro profético permanece digno e direto. A formulação conserva a imagem hebraica do coração, mas traduz idiomaticamente יַעֲלוּ דְבָרִים como o surgimento de pensamentos.
