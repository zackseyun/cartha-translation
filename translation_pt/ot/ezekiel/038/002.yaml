  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל גּוֹג֙ אֶ֣רֶץ הַ/מָּג֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֣שֶׁךְ וְ/תֻבָ֑ל וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/002.yaml
  text: Son of man, set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him.
translation:
  language: pt
  text: Filho do homem, volte o rosto para Gogue, da terra de Magogue, príncipe supremo de Meseque e Tubal[a], e profetize contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “príncipe de Rôs, Meseque e Tubal”. O termo hebraico traduzido como “supremo” também pode ser entendido como o nome próprio “Rôs”.'
    reason: Preserva a ambiguidade lexical e sintática de רֹאשׁ.
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Filho do homem
  rationale: Mantém a forma hebraica de tratamento dirigida a Ezequiel, já consagrada em português, sem acrescentar uma interpretação cristológica ao contexto.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: volte o rosto para
  rationale: Reproduz de modo natural a expressão idiomática hebraica que indica dirigir decididamente a atenção e a mensagem a alguém.
- source_word: גּוֹג ... מָגוֹג
  choice: Gogue ... Magogue
  rationale: Emprega as formas portuguesas tradicionais dos nomes próprios.
- source_word: נְשִׂיא רֹאשׁ
  choice: príncipe supremo
  rationale: Entende רֹאשׁ em sentido qualificativo, como ‘principal’ ou ‘supremo’, leitura sintaticamente plausível e coerente com a construção.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Meseque e Tubal
  rationale: Usa formas tradicionais e reconhecíveis em português para os dois nomes geográficos ou étnicos.
- source_word: וְהִנָּבֵא עָלָיו
  choice: e profetize contra ele
  rationale: Neste contexto de oráculo hostil, עַל indica que a profecia é dirigida contra Gogue.
theological_decisions:
- issue: Se רֹאשׁ é título qualificativo ou nome próprio
  choice: príncipe supremo de Meseque e Tubal
  alternative: príncipe de Rôs, Meseque e Tubal
  rationale: A vocalização massorética e a sintaxe permitem entender רֹאשׁ como ‘cabeça, principal’, qualificando נְשִׂיא. Como também existe a leitura como nome próprio, a alternativa é preservada em nota sem transformar a ambiguidade textual em afirmação dogmática.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas reconhecíveis. A formulação evita arcaísmos desnecessários e conserva a ambiguidade relevante por meio de nota.
