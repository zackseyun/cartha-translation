  text: וְ/הִתְגַּדִּלְתִּי֙ וְ/הִתְקַדִּשְׁתִּ֔י וְ/נ֣וֹדַעְתִּ֔י לְ/עֵינֵ֖י גּוֹיִ֣ם רַבִּ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/023.yaml
  text: I will show myself great and show myself holy[a], and I will make myself known in the sight of many nations[b]. Then they will know that I am Yahweh.
translation:
  language: pt
  text: Eu me mostrarei grande e me mostrarei santo[a], e me darei a conhecer aos olhos de muitas nações. Então elas saberão que eu sou Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu me engrandecerei e me santificarei”. Os verbos hebraicos têm forma reflexiva e também podem ser traduzidos mais formalmente dessa maneira.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְגַּדִּלְתִּי
  choice: eu me mostrarei grande
  rationale: O hitpael de גדל tem aqui força reflexiva e descreve a manifestação pública da grandeza divina. A formulação evita que “eu me engrandecerei” seja entendida como autoexaltação e permanece clara em português.
- source_word: וְהִתְקַדִּשְׁתִּי
  choice: eu me mostrarei santo
  rationale: O hitpael de קדשׁ, frequente em Ezequiel nesse contexto, comunica que Deus manifestará publicamente sua santidade. “Eu me santificarei” seria mais formal, porém menos transparente e potencialmente ambíguo.
- source_word: וְנוֹדַעְתִּי
  choice: eu me darei a conhecer
  rationale: O nifal de ידע admite “serei conhecido”, mas a construção escolhida preserva a participação ativa de Deus na sequência de verbos em primeira pessoa e soa natural em português.
- source_word: לְעֵינֵי
  choice: aos olhos de
  rationale: Mantém a imagem visual do hebraico e expressa que a revelação ocorrerá publicamente diante das nações.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: No contexto de Ezequiel, גוים designa coletividades nacionais; “nações” evita introduzir o contraste posterior sugerido por “gentios”.
- source_word: וְיָדְעוּ
  choice: então elas saberão
  rationale: Preserva o sentido direto do qal de ידע e a fórmula de reconhecimento recorrente em Ezequiel. “Elas” retoma com clareza “muitas nações”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo pelo título tradicional “SENHOR”.
theological_decisions:
- issue: Manifestação pública da grandeza e da santidade divinas
  choice: 'Linguagem reflexiva de manifestação: “eu me mostrarei grande” e “eu me mostrarei santo”'
  alternative: “Eu me engrandecerei e me santificarei” ou “manifestarei minha grandeza e minha santidade”
  rationale: A escolha conserva tanto a forma reflexiva quanto a ideia contextual de que Deus demonstrará publicamente quem ele é, sem interpretar os verbos apenas como autoexaltação ou vindicação.
- issue: Voz e agência em וְנוֹדַעְתִּי
  choice: “eu me darei a conhecer”
  alternative: “serei conhecido”
  rationale: A forma hebraica permite uma tradução passiva, mas a sequência de ações divinas em primeira pessoa favorece uma expressão que mantenha a agência sem eliminar a ambiguidade, registrada em nota.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: Preserva o nome pessoal presente no texto hebraico; a convenção tradicional é informada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “me mostrarei” preserva o paralelismo hebraico; “aos olhos de” mantém a dimensão pública e visual da manifestação.
