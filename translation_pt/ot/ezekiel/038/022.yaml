  text: וְ/נִשְׁפַּטְתִּ֥י אִתּ֖/וֹ בְּ/דֶ֣בֶר וּ/בְ/דָ֑ם וְ/גֶ֣שֶׁם שׁוֹטֵף֩ וְ/אַבְנֵ֨י אֶלְגָּבִ֜ישׁ אֵ֣שׁ וְ/גָפְרִ֗ית אַמְטִ֤יר עָלָי/ו֙ וְ/עַל אֲגַפָּ֔י/ו וְ/עַל עַמִּ֥ים רַבִּ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/022.yaml
  text: And I will enter into judgment with him by pestilence and bloodshed[a]; and I will rain down on him, on his troops, and on the many peoples who are with him, torrential rain, hailstones, fire[c][b], and sulfur.
translation:
  language: pt
  text: Entrarei em juízo contra ele com pestilência e derramamento de sangue. Farei chover sobre ele, sobre suas tropas[a] e sobre os muitos povos que estão com ele chuva torrencial, pedras de granizo, fogo e enxofre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas divisões”, “seus contingentes” ou “seus exércitos”; o termo hebraico se refere às forças que o acompanham.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: Entrarei em juízo contra ele
  rationale: O nifal de שׁפט com אֵת descreve uma ação judicial dirigida contra alguém. A formulação conserva a nuance forense e é idiomática em português, enquanto “contra” explicita a força adversativa exigida pelo contexto.
- source_word: בְּדֶבֶר
  choice: com pestilência
  rationale: דֶּבֶר designa peste ou pestilência, frequentemente como instrumento de juízo divino. “Pestilência” mantém o registro profético solene sem perder clareza.
- source_word: וּבְדָם
  choice: e derramamento de sangue
  rationale: Neste catálogo de juízos, דָּם funciona naturalmente como metonímia de morte violenta. “Derramamento de sangue” comunica esse sentido melhor do que o literal “sangue”.
- source_word: וְגֶשֶׁם שׁוֹטֵף
  choice: chuva torrencial
  rationale: A combinação descreve chuva impetuosa e transbordante. “Chuva torrencial” é natural em português e preserva a intensidade da imagem.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: pedras de granizo
  rationale: A expressão hebraica significa literalmente pedras de granizo. A forma escolhida conserva a imagem concreta e é clara em português.
- source_word: אֵשׁ וְגָפְרִית
  choice: fogo e enxofre
  rationale: “Enxofre” é o equivalente moderno e direto de גָּפְרִית; a expressão também preserva a forma tradicional sem arcaísmo lexical.
- source_word: אַמְטִיר
  choice: Farei chover
  rationale: O hifil de מטר é causativo. “Farei chover” representa diretamente essa força verbal e mantém Deus como agente explícito do juízo.
- source_word: אֲגַפָּיו
  choice: suas tropas
  rationale: No contexto militar, o termo indica alas, divisões ou forças que acompanham Gogue. “Tropas” comunica o referente sem impor uma estrutura militar excessivamente específica.
- source_word: עַמִּים רַבִּים אֲשֶׁר אִתּוֹ
  choice: os muitos povos que estão com ele
  rationale: “Povos” traduz עַמִּים sem transformar necessariamente os grupos em Estados nacionais; a construção definida identifica os povos aliados que acompanham Gogue.
theological_decisions:
- issue: Natureza das imagens de juízo
  choice: Apresentar peste, derramamento de sangue, chuva, granizo, fogo e enxofre como atos concretos do juízo anunciado por Deus.
  alternative: Reformular a lista como linguagem meramente simbólica de calamidade.
  rationale: O hebraico anuncia diretamente esses atos em linguagem profética de juízo. A tradução preserva sua concretude e deixa em aberto, para a interpretação, o modo preciso de seu cumprimento.
- issue: Força relacional da fórmula judicial
  choice: “Entrarei em juízo contra ele”.
  alternative: “Eu o julgarei” ou o literal menos idiomático “entrarei em juízo com ele”.
  rationale: A escolha conserva a cena forense e torna explícita a orientação adversativa, sem reduzir a expressão ao simples ato de avaliar ou sentenciar.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição de “sobre” esclarece o alcance do juízo, e a ordem da frase acompanha de perto a estrutura enfática do hebraico sem produzir obscuridade.
