  revision_rationale: As revisões restauram a finalidade expressa pelo infinitivo «para cobrir» e o peso profético de «nos últimos dias». A nota foi ajustada para refletir com maior precisão a construção hebraica, mantendo no texto uma formulação portuguesa natural que comunica a manifestação pública da santidade divina sem sugerir que Deus adquire santidade.
