revisions:
- from: 'Você avançará contra o meu povo Israel como uma nuvem que cobre a terra. Nos dias futuros, isso acontecerá: eu o trarei contra a minha terra, para que as nações me conheçam quando, por meio de você, eu me mostrar santo diante dos olhos delas, ó Gogue.[a]'
  to: 'Você avançará contra o meu povo Israel como uma nuvem, para cobrir a terra. Nos últimos dias, isso acontecerá: eu o trarei contra a minha terra, para que as nações me conheçam quando, por meio de você, eu me mostrar santo diante dos olhos delas, ó Gogue.[a]'
  rationale: As revisões restauram a finalidade expressa pelo infinitivo «para cobrir» e o peso profético de «nos últimos dias». A nota foi ajustada para refletir com maior precisão a construção hebraica, mantendo no texto uma formulação portuguesa natural que comunica a manifestação pública da santidade divina sem sugerir que Deus adquire santidade.
