review_pass:
  verdict: revise
  source_fidelity: A tradução conserva corretamente a progressão do versículo, a agência divina em «eu o trarei», o valor hostil de «contra», a finalidade do reconhecimento pelas nações e a interpelação final a Gogue. Contudo, «como uma nuvem que cobre a terra» transforma o infinitivo לְכַסּוֹת («para cobrir») em oração relativa descritiva, e «nos dias futuros» enfraquece a força convencional e culminante de בְּאַחֲרִית הַיָּמִים.
  naturalness: O português é claro, moderno e de registro adequado. «Como uma nuvem, para cobrir a terra» é igualmente natural e conserva melhor a relação de finalidade. «Nos últimos dias» é expressão profética corrente e inteligível, sem exigir uma leitura escatológica denominacional.
  terminology: «Meu povo Israel», «minha terra», «as nações me conheçam», «eu me mostrar santo» e «Gogue» são escolhas apropriadas. A nota deve evitar chamar de estritamente literal «eu me santificar», pois a forma hebraica é nifal; «quando eu for santificado em você» representa mais diretamente sua voz/formulação, embora o sentido idiomático no texto principal permaneça «eu me mostrar santo».
  issues:
  - severity: medium
    issue: O infinitivo לְכַסּוֹת foi convertido em oração relativa.
    rationale: «Uma nuvem que cobre a terra» descreve uma nuvem por sua propriedade; o hebraico diz «como uma nuvem, para cobrir a terra», apresentando o efeito ou propósito do avanço invasor.
  - severity: medium
    issue: «Nos dias futuros» reduz a especificidade de בְּאַחֲרִית הַיָּמִים.
    rationale: A expressão aponta para os «últimos/later days», não apenas para algum período futuro indeterminado. «Nos últimos dias» preserva a formulação profética sem definir um sistema de fim dos tempos.
  - severity: low
    issue: A nota caracteriza «quando eu me santificar em você» como mais literal.
    rationale: Embora seja uma paráfrase tradicional defensável, o nifal é refletido mais de perto por «quando eu for santificado em você». A nota pode registrar essa opção sem alterar o sentido interpretativo do texto principal.
  revised_text: 'Você avançará contra o meu povo Israel como uma nuvem, para cobrir a terra. Nos últimos dias, isso acontecerá: eu o trarei contra a minha terra, para que as nações me conheçam quando, por meio de você, eu me mostrar santo diante dos olhos delas, ó Gogue.[a]'
  revised_footnotes:
