source:
  edition: WLC
  text: וְ/עָלִ֨יתָ֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל כֶּֽ/עָנָ֖ן לְ/כַסּ֣וֹת הָ/אָ֑רֶץ בְּ/אַחֲרִ֨ית הַ/יָּמִ֜ים תִּֽהְיֶ֗ה וַ/הֲבִאוֹתִ֨י/ךָ֙ עַל אַרְצִ֔/י לְמַעַן֩ דַּ֨עַת הַ/גּוֹיִ֜ם אֹתִ֗/י בְּ/הִקָּדְשִׁ֥/י בְ/ךָ֛ לְ/עֵינֵי/הֶ֖ם גּֽוֹג־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/016.yaml
  text: And you will come up against my people Israel like a cloud to cover the land. In the latter days it will happen that I will bring you against my land[a], so that the nations may know me when I show myself holy through you before their eyes, O Gog.
translation:
  language: pt
  text: 'Você avançará contra o meu povo Israel como uma nuvem, para cobrir a terra. Nos últimos dias, isso acontecerá: eu o trarei contra a minha terra, para que as nações me conheçam quando, por meio de você, eu me mostrar santo diante dos olhos delas, ó Gogue.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “quando eu for santificado em você diante dos olhos delas”.'
    reason: Preserva a formulação nifal de בְּהִקָּדְשִׁי e a possibilidade de entender בְךָ como “em você”, em vez do sentido instrumental “por meio de você” adotado no texto.
lexical_decisions:
- source_word: וְעָלִיתָ עַל עַמִּי יִשְׂרָאֵל
  choice: Você avançará contra o meu povo Israel
  rationale: O verbo עלה significa literalmente “subir”, mas, neste contexto militar com עַל, descreve o avanço hostil contra um povo. “Avançará contra” preserva o movimento e explicita naturalmente o sentido contextual.
- source_word: כֶּעָנָן לְכַסּוֹת הָאָרֶץ
  choice: como uma nuvem que cobre a terra
  rationale: Mantém a comparação explícita. Aqui הָאָרֶץ se refere mais provavelmente à terra de Israel; “terra” preserva também a amplitude lexical do hebraico. A oração relativa expressa em português natural o efeito do infinitivo לְכַסּוֹת.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Nos dias futuros
  rationale: A expressão profética aponta para um período posterior sem, por si só, impor uma cronologia escatológica específica. “Nos dias futuros” é atual, inteligível e preserva essa abertura.
- source_word: תִּהְיֶה
  choice: isso acontecerá
  rationale: A forma feminina singular retoma a situação ou ocorrência descrita. “Isso acontecerá” comunica de modo idiomático o valor eventivo.
- source_word: וַהֲבִאוֹתִיךָ עַל אַרְצִי
  choice: eu o trarei contra a minha terra
  rationale: 'O hifil de בוא expressa causalidade e agência divina: Deus fará Gogue chegar. No contexto hostil, עַל é adequadamente traduzido por “contra”.'
- source_word: לְמַעַן דַּעַת הַגּוֹיִם אֹתִי
  choice: para que as nações me conheçam
  rationale: Preserva tanto a finalidade indicada por לְמַעַן quanto a dimensão reveladora e relacional de ידע.
- source_word: בְּהִקָּדְשִׁי בְךָ
  choice: quando, por meio de você, eu me mostrar santo
  rationale: A construção apresenta a santidade de Deus tornando-se publicamente manifesta por meio do que ele fará com Gogue. “Eu me mostrar santo” evita sugerir que Deus passe a adquirir santidade; “por meio de você” expressa o papel instrumental ou mediador possível de בְךָ.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos delas
  rationale: Reproduz a imagem hebraica e comunica manifestação pública e visível. O pronome feminino retoma “as nações” segundo o gênero gramatical em português.
- source_word: גּוֹג
  choice: ó Gogue
  rationale: O nome funciona como vocativo ao final da fala divina. A partícula “ó” marca claramente a interpelação em registro digno.
theological_decisions:
- issue: Alcance escatológico de בְּאַחֲרִית הַיָּמִים
  choice: Nos dias futuros
  alternative: Nos últimos dias; no fim dos dias
  rationale: A formulação mantém a orientação profética para o futuro sem determinar uma estrutura específica dos acontecimentos finais. As alternativas são mais literais ou tradicionais, mas podem adquirir associações teológicas mais estreitas em português.
- issue: Automanifestação da santidade divina em בְּהִקָּדְשִׁי בְךָ
  choice: quando, por meio de você, eu me mostrar santo
  alternative: quando eu me santificar em você; quando eu manifestar a minha santidade em você
  rationale: A escolha comunica que a santidade de Deus será reconhecida publicamente no trato com Gogue, sem implicar mudança moral em Deus. A nota preserva a forma mais literal e a ambiguidade da preposição בְּ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Gogue” segue a forma consagrada em português. A repetição de “minha terra” e “meu povo” foi mantida por sua relevância no discurso divino.
