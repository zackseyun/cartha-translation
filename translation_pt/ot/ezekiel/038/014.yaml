  text: לָ/כֵן֙ הִנָּבֵ֣א בֶן אָדָ֔ם וְ/אָמַרְתָּ֣ לְ/ג֔וֹג כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֲ/ל֣וֹא בַּ/יּ֣וֹם הַ/ה֗וּא בְּ/שֶׁ֨בֶת עַמִּ֧/י יִשְׂרָאֵ֛ל לָ/בֶ֖טַח תֵּדָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/014.yaml
  text: 'Therefore prophesy[a], son of man, and say to Gog, ‘Thus says the Lord GOD: On that day, when my people Israel dwell securely, will you not know it?’'
translation:
  language: pt
  text: 'Por isso, profetize, filho do homem, e diga a Gogue: “Assim diz o Senhor Yahweh: Naquele dia, quando o meu povo Israel viver em segurança[a], acaso você não saberá disso?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viver seguramente”. O hebraico לָבֶטַח descreve uma condição de segurança; também pode ser traduzido por “em paz”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a conclusão decorrente do contexto anterior e soa natural em português contemporâneo.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: Imperativo dirigido a Ezequiel; é o equivalente português claro e tradicional do verbo נבא.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a fórmula recorrente pela qual Ezequiel é chamado e mantém sua continuidade literária.
- source_word: וְאָמַרְתָּ לְגוֹג
  choice: e diga a Gogue
  rationale: Expressa naturalmente a ordem sequencial que segue o imperativo inicial.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula solene e característica da mensagem profética.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando ocultar o nome sob outro título.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: É a forma portuguesa idiomática da expressão temporal profética.
- source_word: בְּשֶׁבֶת עַמִּי יִשְׂרָאֵל
  choice: quando o meu povo Israel estiver vivendo
  rationale: Comunica o valor temporal do infinitivo בְּשֶׁבֶת e a ideia de uma condição contínua.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: Expressa a condição de segurança indicada pelo hebraico sem especificar indevidamente sua causa ou natureza.
- source_word: הֲלוֹא ... תֵּדָע
  choice: acaso você não saberá disso?
  rationale: Preserva a pergunta retórica que espera resposta afirmativa; “disso” explicita em português o objeto implícito sem determinar além do contexto o modo pelo qual Gogue saberá.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome pessoal יהוה e preserva explicitamente o nome divino presente no texto hebraico.
- issue: Sentido do conhecimento atribuído a Gogue em תֵּדָע
  choice: saberá disso
  alternative: tomará conhecimento disso
  rationale: “Saberá” conserva a amplitude semântica de ידע e evita decidir se a referência é a mera percepção, a descoberta ou o reconhecimento da situação de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” apenas dentro da pergunta dirigida a Gogue, para tornar explícita a segunda pessoa masculina singular do hebraico. Mantém a solenidade da fórmula profética e a pergunta retórica do original.
