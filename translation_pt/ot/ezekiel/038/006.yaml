source:
  edition: WLC
  text: גֹּ֚מֶר וְ/כָל אֲגַפֶּ֔י/הָ בֵּ֚ית תּֽוֹגַרְמָ֔ה יַרְכְּתֵ֥י צָפ֖וֹן וְ/אֶת כָּל אֲגַפָּ֑י/ו עַמִּ֥ים רַבִּ֖ים אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/006.yaml
  text: Gomer and all its troops[b][a], the house of Togarmah from the far north and all its troops—many peoples are with you.
translation:
  language: pt
  text: Gômer e todas as suas tropas[a]; a casa de Togarma, dos confins do norte[b], e todas as suas tropas; muitos povos estão com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus flancos”, “todas as suas divisões” ou “todos os seus contingentes”. O termo hebraico pode indicar asas, extremidades ou grupos ligados a um corpo principal; aqui, o contexto é militar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “das partes mais remotas do norte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֶר
  choice: Gômer
  rationale: Nome próprio de um povo; transliterado com acento gráfico para indicar de modo natural a pronúncia em português.
- source_word: אֲגַפֶּיהָ / אֲגַפָּיו
  choice: suas tropas
  rationale: Embora o substantivo possa designar literalmente “asas”, “extremidades” ou grupos ligados a um corpo principal, neste contexto militar refere-se mais naturalmente a contingentes ou divisões.
- source_word: בֵּית תּוֹגַרְמָה
  choice: a casa de Togarma
  rationale: Preserva a construção hebraica “casa de” como designação étnica ou geográfica e translitera o nome próprio.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: dos confins do norte
  rationale: Expressa as regiões remotas ou extremas do norte, preservando a força geográfica da expressão hebraica em português natural e digno.
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: Mantém o sentido de grupos humanos ou étnicos sem restringi-lo ao conceito político moderno de nações.
- source_word: אִתָּךְ
  choice: com você
  rationale: Tradução direta e atual da preposição com sufixo pronominal; o gênero gramatical do sufixo hebraico não precisa ser explicitado em português.
theological_decisions: []
translation_notes:
