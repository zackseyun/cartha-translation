source:
  edition: WLC
  text: מִ/יָּמִ֣ים רַבִּים֮ תִּפָּקֵד֒ בְּ/אַחֲרִ֨ית הַ/שָּׁנִ֜ים תָּב֣וֹא אֶל אֶ֣רֶץ מְשׁוֹבֶ֣בֶת מֵ/חֶ֗רֶב מְקֻבֶּ֨צֶת֙ מֵ/עַמִּ֣ים רַבִּ֔ים עַ֚ל הָרֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר הָי֥וּ לְ/חָרְבָּ֖ה תָּמִ֑יד וְ/הִיא֙ מֵ/עַמִּ֣ים הוּצָ֔אָה וְ/יָשְׁב֥וּ לָ/בֶ֖טַח כֻּלָּֽ/ם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/008.yaml
  text: After many days you will be mustered[a]; in the latter years you will come into a land restored from the sword, gathered from many peoples, onto the mountains of Israel, which had been a continual waste; but it was brought out from the peoples[b], and all of them will dwell securely.
translation:
  language: pt
  text: Depois de muitos dias, você será mobilizado[a]. Nos últimos anos[b], você virá a uma terra recuperada da espada, reunida dentre muitos povos, aos montes de Israel, que haviam permanecido continuamente desolados. Ela foi tirada dentre os povos, e todos eles habitarão em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “convocado” ou “visitado”. Neste contexto, o hebraico provavelmente indica ser chamado ou mobilizado para uma ação.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na parte final dos anos”. Algumas traduções trazem “nos últimos dias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפָּקֵד
  choice: você será mobilizado
  rationale: O nifal de פקד, neste contexto de convocação e invasão, indica ser chamado ou reunido para uma ação, provavelmente militar. “Mobilizado” comunica esse sentido em português sem eliminar as possibilidades de “convocado” ou “visitado”.
- source_word: בְּאַחֲרִית הַשָּׁנִים
  choice: nos últimos anos
  rationale: Traduz literalmente a referência à parte final dos “anos”, em vez de substituí-la pela fórmula profética mais comum “nos últimos dias”.
- source_word: אֶרֶץ מְשׁוֹבֶבֶת מֵחֶרֶב
  choice: uma terra restaurada da espada
  rationale: Preserva tanto a ideia de restauração ou recuperação expressa por שוב quanto a imagem hebraica da espada como representação da guerra e de sua devastação.
- source_word: מְקֻבֶּצֶת מֵעַמִּים רַבִּים
  choice: reunida dentre muitos povos
  rationale: Mantém o particípio passivo feminino, que concorda formalmente com “terra”, e traduz עמים por “povos”, sem explicitar na linha principal que se trata dos habitantes reunidos.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: aos montes de Israel
  rationale: Com o verbo de movimento “vir”, עַל indica deslocamento até ou sobre os montes. “Aos montes” é natural em português e conserva a direção.
- source_word: אֲשֶׁר הָיוּ לְחָרְבָּה תָּמִיד
  choice: que haviam permanecido continuamente desolados
  rationale: O relativo retoma naturalmente os montes de Israel; a formulação conserva o estado prolongado de desolação expresso por תָּמִיד.
- source_word: וְהִיא מֵעַמִּים הוּצָאָה
  choice: Ela foi tirada dentre os povos
  rationale: O pronome feminino retoma “terra”. A tradução preserva essa referência gramatical e a voz passiva do hebraico.
- source_word: וְיָשְׁבוּ לָבֶטַח כֻּלָּם
  choice: e todos eles habitarão em segurança
  rationale: Preserva o sentido usual de ישב com לבטח e mantém explícito o valor abrangente de כֻּלָּם.
theological_decisions:
- issue: Expressão escatológica
  choice: nos últimos anos
  alternative: nos últimos dias
  rationale: O texto hebraico diz literalmente “na parte final dos anos”. A escolha evita harmonizá-lo com a fórmula escatológica mais frequente “nos últimos dias” e conserva a particularidade desta passagem.
- issue: Referente do povo restaurado
  choice: manter a terra como referente gramatical de “reunida” e “tirada”
  alternative: explicitar “cujo povo foi reunido” ou “seus habitantes foram tirados”
  rationale: Embora o sentido envolva claramente pessoas reunidas dentre povos, o hebraico usa formas femininas que retomam “terra”. Preservar essa construção mantém a personificação e não resolve silenciosamente a tensão gramatical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “você” para o destinatário singular e mantém imagens concretas do hebraico, como “espada”, sem acrescentar uma interpretação denominacional. O marcador [b] foi colocado junto a “últimos anos”, expressão à qual a nota efetivamente se refere.
