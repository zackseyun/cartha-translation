translation:
  language: pt
  text: 'e você dirá: “Subirei contra uma terra de povoados sem muralhas; irei contra os que vivem tranquilos e habitam em segurança. Todos eles habitam sem muralhas e não têm trancas nem portas.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma terra de campo aberto”; “irei até os que vivem tranquilos”; e “não têm trancas nem portões”. O hebraico descreve lugares sem fortificações defensivas; “contra” decorre do contexto hostil, enquanto “portas” é a tradução mais direta do último termo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: e você dirá
  rationale: O perfeito com waw em discurso profético tem valor futuro/sequencial; a forma é natural em português e mantém a previsão dirigida a Gogue.
- source_word: אֶעֱלֶה
  choice: Subirei contra
  rationale: עלה expressa subida ou avanço; a preposição 'contra' traduz o valor hostil de עַל neste contexto.
- source_word: אֶרֶץ פְּרָזוֹת
  choice: uma terra de povoados sem muralhas
  rationale: פְּרָזוֹת designa povoações abertas, não fortificadas; 'povoados sem muralhas' comunica concretamente essa condição.
- source_word: אָבוֹא
  choice: irei contra
  rationale: בוא significa vir/ir ou entrar; 'contra' explicita a direção hostil indicada pelo contexto, sem atribuí-la ao verbo isoladamente.
- source_word: הַשֹּׁקְטִים
  choice: os que vivem tranquilos
  rationale: O particípio de שקט descreve pessoas sossegadas, em repouso ou não perturbadas; a formulação é clara e corrente.
- source_word: יֹשְׁבֵי לָבֶטַח
  choice: habitam em segurança
  rationale: A expressão combina residência estável com confiança ou segurança, preservadas pela tradução.
- source_word: כֻּלָּם יֹשְׁבִים
  choice: Todos eles habitam
  rationale: A oração independente preserva a repetição de ישב e torna clara a progressão explicativa do hebraico.
- source_word: בְּאֵין חוֹמָה
  choice: sem muralhas
  rationale: Embora חוֹמָה esteja no singular, o plural coletivo é natural em português ao descrever diversos povoados e evita sugerir uma única muralha compartilhada.
- source_word: וּבְרִיחַ
  choice: trancas
  rationale: בְּרִיחַ é a barra ou tranca que fecha uma entrada; o plural coletivo concorda naturalmente com as estruturas defensivas dos vários povoados.
- source_word: וּדְלָתַיִם
  choice: portas
  rationale: דְּלָתַיִם significa literalmente portas, frequentemente portas duplas; 'portas' preserva a equivalência lexical, embora 'portões' seja possível no contexto defensivo.
- source_word: אֵין לָהֶם
  choice: não têm
  rationale: Expressão possessiva idiomática em português que traduz diretamente a ausência indicada pelo hebraico.
