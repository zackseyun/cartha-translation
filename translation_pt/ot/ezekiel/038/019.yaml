base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/019.yaml
  text: 'For in my jealousy[a], in the fire of my wrath, I have spoken: surely on that day there will be a great earthquake upon the land of Israel.'
translation:
  language: pt
  text: 'Pois, no meu ciúme, no fogo da minha ira, eu falei: Certamente naquele dia haverá um grande terremoto[a] na terra de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande abalo” ou “um grande tremor”. O termo hebraico רַעַשׁ pode indicar um abalo mais amplo, embora “terremoto” se ajuste bem ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקִנְאָתִי
  choice: Pois, no meu ciúme
  rationale: A conjunção é entendida contextualmente como explicativa, ligando a declaração ao versículo anterior. “Ciúme” preserva a força pessoal e pactual de קִנְאָה, sem suavizá-la para mero “zelo”.
- source_word: בְאֵשׁ עֶבְרָתִי
  choice: no fogo da minha ira
  rationale: Mantém a imagem hebraica do fogo e traduz עֶבְרָה por “ira”, termo forte, digno e claro no português atual.
- source_word: דִּבַּרְתִּי
  choice: eu falei
  rationale: O perfeito hebraico apresenta a fala divina como proferida de modo solene e completo. “Eu falei” é natural e direto, sem transformar o verbo em “declaro”.
- source_word: אִם לֹא
  choice: Certamente
  rationale: A expressão tem aqui valor asseverativo, semelhante ao de uma fórmula de juramento, e não constitui uma condição literal.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Formulação temporal profética natural em português e fiel ao hebraico.
- source_word: יִהְיֶה
  choice: haverá
  rationale: Expressa naturalmente o uso existencial de היה seguido de um substantivo.
- source_word: רַעַשׁ גָּדוֹל
  choice: um grande terremoto
  rationale: רַעַשׁ pode indicar tremor, abalo ou terremoto. No contexto da terra e da perturbação descrita nos versículos seguintes, “terremoto” é claro e adequado, enquanto a amplitude lexical é registrada em nota.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: na terra de Israel
  rationale: אַדְמָה designa solo ou terra. “Na terra de Israel” comunica de modo natural a localização, sem interpretar עַל como hostilidade.
theological_decisions:
- issue: Linguagem referente às emoções divinas
  choice: meu ciúme ... o fogo da minha ira
  alternative: meu zelo ... o fogo do meu furor
  rationale: A tradução conserva a linguagem pessoal forte do texto acerca do ciúme e da ira de Deus, sem atenuá-la nem lhe acrescentar uma explicação doutrinária.
- issue: Identificação do falante divino
  choice: Manter a primeira pessoa sem acrescentar identificação do falante
  alternative: Acrescentar “diz o SENHOR”
  rationale: O contexto identifica Deus como falante, mas esta cláusula não contém uma nova fórmula de introdução. Acrescentá-la iria além do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e as imagens centrais do hebraico foram preservadas sem produzir uma construção artificial. O marcador [a] está associado à expressão explicada na nota.
