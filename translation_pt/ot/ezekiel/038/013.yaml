base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/013.yaml
  text: Sheba and Dedan and the merchants of Tarshish, with all her young lions, will say to you, ‘Have you come to take plunder? Have you assembled your company to seize silver and gold, to take livestock and goods, to take great plunder?’
translation:
  language: pt
  text: 'Sabá, Dedã e os mercadores de Társis, com todos os seus leões jovens[a], lhe dirão: “Você veio para saquear? Reuniu o seu grupo para tomar prata e ouro, levar gado e bens e tomar grandes despojos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com todos os seus governantes” ou “homens poderosos”; literalmente, “com todos os seus leões jovens”.
    reason: A expressão hebraica é metafórica ou, no mínimo, incomum neste contexto, e seu referente preciso é incerto.
lexical_decisions:
- source_word: שְׁבָא וּדְדָן ... תַרְשִׁישׁ
  choice: Sabá, Dedã ... Társis
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas desses topônimos.
- source_word: כְּפִירֶיהָ
  choice: seus leões jovens
  rationale: Preserva a imagem concreta e incomum do hebraico, sem decidir no texto se ela designa literalmente animais ou, de modo figurado, líderes e homens poderosos.
- source_word: לִשְׁלֹל שָׁלָל ... לָבֹז בַּז
  choice: saquear ... pilhagem
  rationale: Comunica a linguagem enfática de tomada de despojos; o jogo de palavras com raízes repetidas no hebraico não pode ser reproduzido integralmente em português natural.
- source_word: קְהָלֶךָ
  choice: a sua multidão
  rationale: Mantém a ideia de um contingente reunido, sem especificá-lo mais estreitamente como exército.
- source_word: מִקְנֶה וְקִנְיָן
  choice: gado e bens
  rationale: Distingue os rebanhos e demais animais da propriedade ou riqueza adquirida.
theological_decisions:
- issue: Identidade dos “leões jovens” de Társis
  choice: Manter a metáfora no texto e indicar em nota seu possível sentido figurado
  alternative: Traduzir diretamente como “governantes”, “príncipes” ou “homens poderosos”
  rationale: O hebraico apresenta a imagem de leões jovens, e a identificação exata de seus referentes humanos, caso seja figurativa, permanece incerta.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” adequado à fala direta. As perguntas retóricas e a sequência de bens tomados foram preservadas; a metáfora incomum foi mantida no corpo do texto e esclarecida sem ser resolvida dogmaticamente.
