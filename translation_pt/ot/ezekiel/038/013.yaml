    rationale: O hebraico retoma deliberadamente o vocabulário de pilhar/despojo nas duas perguntas. “Obter” é mais genérico e reduz essa ênfase. “Tomar grandes despojos” preserva melhor o sentido e soa natural em português.
  - severity: low
    issue: “A sua multidão” é uma representação pouco precisa de קְהָלֶךָ.
    rationale: O termo se refere à coletividade ou companhia reunida. “Seu grupo” conserva a amplitude do original e evita sugerir apenas número.
