  text: וְ/קָרָ֨אתִי עָלָ֤י/ו לְ/כָל הָרַ/י֙ חֶ֔רֶב נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב אִ֖ישׁ בְּ/אָחִ֥י/ו תִּֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/021.yaml
  text: And I will summon a sword against him on all my mountains[a], declares the Lord GOD; every man's sword will be against his brother.
translation:
  language: pt
  text: E convocarei a espada contra ele em todos os meus montes, declara o Senhor Yahweh. A espada de cada um será contra seu irmão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָרָאתִי
  choice: E convocarei
  rationale: Neste contexto, קרא expressa chamar ou mobilizar um instrumento de juízo. “Convocarei” comunica essa ação divina com naturalidade e dignidade.
- source_word: עָלָיו
  choice: contra ele
  rationale: Com o verbo קרא e no contexto de juízo, עַל indica direção hostil contra Gog.
- source_word: לְכָל הָרַי
  choice: em todos os meus montes
  rationale: A expressão localiza o juízo na região montanhosa pertencente a Deus. “Em” é natural em português e preserva o sentido locativo da construção.
- source_word: חֶרֶב
  choice: a espada
  rationale: O substantivo designa a espada como instrumento personificado de guerra e juízo. O artigo definido soa natural em português nesta fórmula.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética “declara”, e Yahweh translitera o nome divino explícito יהוה, enquanto אֲדֹנָי é traduzido por “Senhor”.
- source_word: חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה
  choice: a espada de cada um será contra seu irmão
  rationale: A formulação preserva a força distributiva de אִישׁ e a imagem concreta de violência mútua entre os integrantes do exército invasor.
theological_decisions:
- issue: Tradução do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A opção conserva tanto o título אֲדֹנָי, “Senhor”, quanto o nome da aliança יהוה, “Yahweh”, sem fundi-los nem produzir a repetição “Senhor SENHOR”.
- issue: Identidade de “irmão” em חֶרֶב אִישׁ בְּאָחִיו
  choice: seu irmão
  alternative: seu companheiro
  rationale: “Irmão” mantém a imagem hebraica e pode indicar um integrante do mesmo grupo, sem exigir parentesco biológico nem explicitar além do texto a natureza da relação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a imagem da espada convocada e a violência interna entre os invasores.
