base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/018.yaml
  text: And it will happen on that day[a], on the day when Gog comes against the land of Israel, declares the Lord GOD, that my wrath will rise up in my nostrils.
translation:
  language: pt
  text: E acontecerá naquele dia, no dia em que Gogue vier contra a terra de Israel — declara o Senhor Yahweh —, que a minha ira subirá em minhas narinas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a minha ira subirá no meu nariz”; “nariz” ou “narinas” funcionam aqui como imagem idiomática da ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Preserva a fórmula profética de introdução futura em português atual, solene e natural.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente idiomático direto da expressão temporal profética.
- source_word: בְּיוֹם בּוֹא גוֹג
  choice: no dia em que Gogue vier
  rationale: Transforma naturalmente o infinitivo construto hebraico em oração temporal, mantendo a referência futura.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: contra a terra de Israel
  rationale: No contexto de avanço hostil, עַל indica movimento contra; 'terra' expressa adequadamente o território.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Mantém a fórmula profética e distingue o título אֲדֹנָי do nome divino יהוה, transliterado como Yahweh.
- source_word: תַּעֲלֶה חֲמָתִי
  choice: a minha ira subirá
  rationale: Conserva a metáfora hebraica de uma cólera intensa que sobe, sem enfraquecer seu tom judicial.
- source_word: בְּאַפִּי
  choice: às minhas narinas
  rationale: Retém a imagem concreta do hebraico אַף, que literalmente designa nariz ou narinas e funciona também como expressão de ira.
theological_decisions:
- issue: Representação do nome divino יהוה após אֲדֹנָי
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução preserva explicitamente o nome da aliança, Yahweh, e verte אֲדֹנָי por 'Senhor', evitando fundir os dois elementos.
- issue: Expressão antropomórfica da ira divina
  choice: a minha ira subirá às minhas narinas
  alternative: a minha ira se acenderá
  rationale: A imagem corporal do hebraico foi preservada porque faz parte da força poética do texto; a nota esclarece seu valor idiomático sem eliminar a tensão da formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência pela preservação da imagem hebraica. A construção foi pontuada com travessões para integrar naturalmente a fórmula profética sem apagar a sintaxe enfática do original.
