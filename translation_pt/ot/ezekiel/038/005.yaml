lexical_decisions:
- source_word: פָּרַס
  choice: Pérsia
  rationale: Nome consagrado em português para o povo e a região da Pérsia.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Transliteração portuguesa corrente do nome etnogeográfico hebraico, evitando a identificação potencialmente anacrônica com a Etiópia moderna.
- source_word: פוּט
  choice: Pute
  rationale: Transliteração portuguesa do nome etnogeográfico, sem impor a identificação interpretativa com a Líbia.
- source_word: אִתָּם
  choice: estão com eles
  rationale: Expressa naturalmente em português a preposição com sufixo pronominal dentro da oração hebraica sem verbo explícito.
- source_word: כֻּלָּם
  choice: todos
  rationale: Preserva a referência enfática à totalidade dos aliados mencionados.
- source_word: מָגֵן
  choice: escudo
  rationale: Equivalente moderno e abrangente para a arma defensiva, sem especificação excessiva.
- source_word: כּוֹבָע
  choice: capacete
  rationale: Termo militar natural em português para a proteção da cabeça neste contexto.
