  text: You will come up like a storm; you will be like a cloud covering the land—you and all your troops, and many peoples with you.
translation:
  language: pt
  text: Você avançará como uma tempestade; será como uma nuvem cobrindo a terra — você, todas as suas tropas e muitos povos com você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַשֹּׁאָה
  choice: como uma tempestade
  rationale: O substantivo שׁוֹאָה pode indicar tempestade devastadora, ruína ou calamidade. No símile de avanço militar, “tempestade” comunica tanto a força súbita quanto o poder destrutivo.
- source_word: כֶעָנָן לְכַסּוֹת הָאָרֶץ
  choice: como uma nuvem cobrindo a terra
  rationale: Reproduz naturalmente a imagem hebraica e conserva o particípio/ideia circunstancial expressa pelo infinitivo לְכַסּוֹת, sem transformar a cobertura da terra em finalidade explícita.
- source_word: אֲגַפֶּיךָ
  choice: suas tropas
  rationale: אֲגַפִּים designa aqui alas ou contingentes militares. “Tropas” é claro em português e adequado ao contexto, sem impor uma organização tática específica.
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: Mantém o sentido coletivo e multinacional de עַמִּים, em vez de reduzi-lo a muitos indivíduos.
