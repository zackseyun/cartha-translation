review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o futuro profético, a origem nos extremos do norte, a presença de muitos povos, a imagem equestre e a caracterização militar. Contudo, «assembleia» corresponde mais diretamente a קָהָל do que «multidão», que enfatiza sobretudo quantidade e perde a noção de grupo reunido.
  naturalness: O português é moderno e claro. A sequência «—, uma» contém pontuação inadequada após o travessão de fechamento; a retirada da vírgula produz uma construção mais fluente.
  terminology: «Povos», «montados a cavalo» e «exército numeroso» são escolhas adequadas. «Grande assembleia» mantém o sentido de קָהָל sem introduzir associação eclesial necessária.
  issues:
  - severity: low
    issue: «uma grande multidão» para קָהָל גָּדוֹל
    rationale: Embora seja possível no contexto, «multidão» não representa tão precisamente a ideia de assembleia/grupo reunido presente em קָהָל. «Grande assembleia» é mais fiel e continua natural neste registro.
  - severity: low
    issue: Vírgula após travessão de fechamento
    rationale: Em «montados a cavalo —, uma...», a vírgula após o travessão é pontuação irregular. O aposto pode seguir diretamente após o travessão.
  revised_text: E você virá do seu lugar, dos confins do norte[a] — você e muitos povos com você, todos eles montados a cavalo — uma grande assembleia e um exército numeroso.[b]
  revised_footnotes:
  - marker: a
    text: 'Ou: “das regiões mais remotas do norte” ou “do extremo norte”. A expressão hebraica se refere às partes mais distantes do norte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma grande multidão e uma vasta força militar”.'
    reason: lexical_alternative
