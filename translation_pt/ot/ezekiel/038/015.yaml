  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a progressão profética, a origem «dos confins do norte», a presença de «muitos povos», a imagem equestre coletiva e a descrição final como grande agrupamento e força militar. «Povos», «multidão» e «exército numeroso» são escolhas defensáveis para os termos hebraicos.
  naturalness: O registro é moderno e claro. Contudo, a sequência «—, uma grande multidão» combina travessão de inciso com vírgula de modo inadequado e interrompe a leitura.
  terminology: A terminologia é apropriada e não introduz leituras doutrinárias. «Montados a cavalo» é idiomático; «exército numeroso» expressa bem a quantidade indicada por רָב.
  issues:
  - severity: medium
    issue: Pontuação indevida após o travessão antes de «uma grande multidão».
    rationale: Em português, não se usa a combinação «—,» nesse ponto. A enumeração/aposição final deve ser ligada diretamente ao travessão de fechamento ou, mais simplesmente, por vírgulas.
  revised_text: E você virá do seu lugar, dos confins do norte[a] — você e muitos povos com você, todos eles montados a cavalo —, uma grande multidão e um exército numeroso.[b]
