base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/015.yaml
  text: And you will come from your place[a], from the far north—you and many peoples with you[b], all of them riding horses—a great assembly and a mighty army.
translation:
  language: pt
  text: E você virá do seu lugar, dos confins do norte[a] — você e muitos povos com você, todos eles montados a cavalo — uma grande assembleia e um exército numeroso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das regiões mais remotas do norte” ou “do extremo norte”. A expressão hebraica se refere às partes mais distantes do norte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma grande multidão e uma vasta força militar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: E você virá
  rationale: O perfeito qal na segunda pessoa masculina singular, ligado pela conjunção, tem valor futuro no discurso profético. A conjunção foi preservada para manter a sequência.
- source_word: מִמְּקוֹמְךָ
  choice: do seu lugar
  rationale: מָקוֹם significa de modo amplo “lugar”; a formulação é natural e não acrescenta uma precisão ausente no hebraico.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: dos confins do norte
  rationale: A expressão designa as regiões extremas ou mais remotas do norte. “Confins do norte” preserva a força idiomática e geográfica sem excessiva prolixidade.
- source_word: אַתָּה וְעַמִּים רַבִּים אִתָּךְ
  choice: você e muitos povos com você
  rationale: O pronome independente mantém a ênfase em “você”, e עַמִּים é vertido por “povos”, sem o estreitamento político de “nações”.
- source_word: רֹכְבֵי סוּסִים כֻּלָּם
  choice: todos eles montados a cavalo
  rationale: A expressão participial significa literalmente que todos são cavaleiros de cavalos. “Montados a cavalo” é corrente em português e conserva a imagem.
- source_word: קָהָל גָּדוֹל
  choice: uma grande multidão
  rationale: קָהָל denota um grupo reunido. No contexto militar, “multidão” comunica a dimensão coletiva sem as associações religiosas que “congregação” poderia trazer.
- source_word: וְחַיִל רָב
  choice: e um exército numeroso
  rationale: חַיִל tem sentido militar de força ou exército, enquanto רָב salienta grande quantidade ou extensão. “Exército numeroso” preserva ambos os elementos sem converter quantidade em poderio.
