  text: 'A palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה integra-se à fórmula profética e é expressa naturalmente em português pelo verbo “veio”, sem o redundante “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na construção דְבַר יְהוָה, “a palavra” preserva a fórmula profética tradicional e sua força lexical, enquanto “a mensagem” seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com o sufixo de primeira pessoa, em formulação corrente e digna.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala divina seguinte; “dizendo” conserva de modo natural a estrutura da fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “Jeová” reflete uma forma tradicional híbrida posterior.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula profética foi mantida de modo próximo ao hebraico, sem arcaísmos. Não há marcadores de nota, pois nenhuma nota é necessária neste versículo.
