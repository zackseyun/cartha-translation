  text: בֶּן אָדָ֗ם הִנֵּ֤ה בֵֽית יִשְׂרָאֵל֙ אֹֽמְרִ֔ים הֶ/חָז֛וֹן אֲשֶׁר ה֥וּא חֹזֶ֖ה לְ/יָמִ֣ים רַבִּ֑ים וּ/לְ/עִתִּ֥ים רְחוֹק֖וֹת ה֥וּא נִבָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/027.yaml
  text: Son of man, look, the house of Israel is saying, ‘The vision that he sees is for many days from now, and he prophesies about distant times.’
translation:
  language: pt
  text: 'Filho do homem, veja! A casa de Israel está dizendo: “A visão que ele tem é para daqui a muitos dias, e ele profetiza a respeito de tempos distantes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Filho do homem
  rationale: Mantém a forma recorrente do tratamento divino dirigido a Ezequiel e seu sentido humano representativo.
- source_word: הִנֵּה
  choice: veja!
  rationale: Transmite a partícula de chamada de atenção de modo natural e direto em português.
- source_word: בֵית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão coletiva hebraica tradicional, clara no registro bíblico português.
- source_word: הֶחָזוֹן אֲשֶׁר הוּא חֹזֶה
  choice: A visão que ele tem
  rationale: Evita a repetição pouco natural 'a visão que ele vê', sem perder a relação entre o substantivo e o ato visionário.
- source_word: לְיָמִים רַבִּים
  choice: para daqui a muitos dias
  rationale: Expressa que os israelitas relegavam o cumprimento da visão a um futuro distante.
- source_word: וּלְעִתִּים רְחוֹקוֹת הוּא נִבָּא
  choice: e ele profetiza a respeito de tempos distantes
  rationale: Representa a preposição e o plural temporal sem sugerir, de maneira indevida, que o profeta estivesse fisicamente destinado a esses tempos.
theological_decisions:
- issue: Alegação de cumprimento remoto
  choice: Conservar a fala como afirmação da casa de Israel, sem endossá-la
  alternative: Reformular explicitamente como descrença ou escárnio
  rationale: O versículo cita a interpretação do povo; sua avaliação e resposta aparecem no contexto seguinte, portanto a tradução não deve antecipá-las.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados na medida compatível com a naturalidade.
