  yaml_path: translation/ot/ezekiel/012/004.yaml
  text: And you shall bring out your baggage like the baggage of exile by day before their eyes[b][a], and you yourself shall go out in the evening before their eyes like those going out into exile.
translation:
  language: pt
  text: Durante o dia, diante dos olhos deles, leve para fora os seus pertences, como bagagem de exílio[a]. Depois, ao anoitecer, saia você mesmo diante dos olhos deles, como saem os que vão para o exílio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como os pertences de um exilado”. A expressão hebraica pode ser entendida coletivamente (“bagagem de exílio”) ou em sentido individual (“bagagem de um exilado”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como pessoas que partem para o exílio” ou “como os exilados saem”. O hebraico diz literalmente algo como “como as saídas do exílio/dos exilados”, expressão que se refere ao modo de partir para a deportação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: leve para fora
  rationale: O hifil de יצא tem sentido causativo, isto é, fazer algo sair. A expressão comunica naturalmente a ação ordenada sem especificar indevidamente como os objetos seriam transportados.
- source_word: כֵלֶיךָ
  choice: os seus pertences
  rationale: כְּלִי pode designar utensílio, objeto, equipamento ou bagagem. No sinal encenado do exílio, refere-se aos objetos portáteis preparados para a partida; “pertences” é claro e abrangente em português atual.
- source_word: כִּכְלֵי גוֹלָה
  choice: como bagagem de exílio
  rationale: A expressão associa os objetos à condição ou experiência do exílio. A formulação compacta preserva o possível sentido coletivo do hebraico, sem obrigá-lo a significar a bagagem de um único exilado.
- source_word: גּוֹלָה
  choice: exílio
  rationale: גּוֹלָה pode indicar exílio, deportação ou a comunidade exilada. “Exílio” mantém a unidade temática do versículo e evita restringir a expressão a prisão ou cativeiro.
- source_word: יוֹמָם
  choice: durante o dia
  rationale: O advérbio indica que a primeira ação ocorre de dia, em contraste deliberado com a saída ao anoitecer.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: A expressão idiomática hebraica enfatiza que a ação deve ser pública e visível. A tradução conserva a imagem concreta e sua repetição no versículo.
- source_word: וְאַתָּה
  choice: saia você mesmo
  rationale: O pronome independente אַתָּה dá ênfase ao próprio Ezequiel. “Você mesmo” reproduz essa ênfase de modo natural.
- source_word: תֵּצֵא
  choice: saia
  rationale: O qal de יצא descreve a saída do profeta. “Sair” é o equivalente direto e adequado ao sinal encenado.
- source_word: בָּעֶרֶב
  choice: ao anoitecer
  rationale: A expressão situa a segunda ação no período da tarde/noite e contrasta claramente com “durante o dia”.
- source_word: כְּמוֹצָאֵי גּוֹלָה
  choice: como saem os que vão para o exílio
  rationale: מוֹצָאֵי é uma forma plural em estado construto ligada à ideia de saída. No contexto, a expressão descreve o modo como pessoas partem para o exílio; a tradução explicita o referente humano implícito sem perder a comparação.
