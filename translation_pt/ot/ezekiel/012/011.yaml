source:
  edition: WLC
  text: אֱמֹ֖ר אֲנִ֣י מֽוֹפֶתְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשִׂ֗יתִי כֵּ֚ן יֵעָשֶׂ֣ה לָ/הֶ֔ם בַּ/גּוֹלָ֥ה בַ/שְּׁבִ֖י יֵלֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/011.yaml
  text: 'Say[a], ‘I am a sign to you: just as I have done, so it shall be done to them; into exile[b], into captivity they shall go.’'
translation:
  language: pt
  text: 'Diga: “Eu sou um sinal para vocês[a]. Assim como eu fiz, assim se fará com eles; para o exílio, para o cativeiro irão[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eu sou o sinal de vocês” ou “Eu sou um portento para vocês”. O hebraico מוֹפֵת pode indicar um sinal, portento ou prodígio simbólico.
    reason: lexical_alternative
  - marker: b
    text: As duas expressões, “para o exílio” e “para o cativeiro”, foram mantidas para refletir a duplicação enfática do hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Diga
  rationale: O imperativo singular de אמר introduz a declaração que o profeta deve pronunciar; “Diga” é direto e natural em português.
- source_word: מוֹפֶתְכֶם
  choice: um sinal para vocês
  rationale: מוֹפֵת pode designar sinal, prodígio ou portento. Aqui, a ação encenada de Ezequiel serve de sinal simbólico dirigido aos ouvintes; “para vocês” exprime essa relação sem forçar uma leitura estritamente possessiva.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: Assim como eu fiz
  rationale: A fórmula comparativa liga a ação já realizada pelo profeta ao que acontecerá ao povo. O pretérito perfeito é a forma portuguesa mais natural para a ação concluída.
- source_word: כֵּן יֵעָשֶׂה לָהֶם
  choice: assim se fará com eles
  rationale: A forma nifal de עשה mantém o agente sem identificação explícita. A construção pronominal portuguesa preserva esse foco no que acontecerá com eles.
- source_word: בַּגּוֹלָה
  choice: para o exílio
  rationale: גּוֹלָה denota exílio ou condição de exilado; com o verbo de movimento יֵלֵכוּ, a preposição “para” comunica naturalmente a direção.
- source_word: בַשְּׁבִי
  choice: para o cativeiro
  rationale: שְׁבִי designa cativeiro ou condição de cativo. A tradução distinta, ao lado de “exílio”, conserva a duplicação enfática do hebraico.
- source_word: יֵלֵכוּ
  choice: irão
  rationale: O imperfeito de הלך expressa o resultado futuro. “Irão” é claro, atual e mantém a solenidade profética.
theological_decisions:
- issue: Natureza do papel encenado de Ezequiel
  choice: Eu sou um sinal para vocês
  alternative: Eu sou o sinal de vocês; Eu sou um portento para vocês
  rationale: O texto apresenta a conduta de Ezequiel como ato-sinal profético. “Sinal” preserva a função simbólica e reveladora de מוֹפֵת sem acrescentar as possíveis conotações supersticiosas de “presságio”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem final “irão” conserva o paralelismo e a ênfase do original sem soar excessivamente arcaica.
