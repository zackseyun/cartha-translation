  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֵלַ֖/י בַּ/בֹּ֥קֶר לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/008.yaml
  text: And in the morning the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E, pela manhã, a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma hebraica do nome divino e a tradução tradicional.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: O wayyiqtol de היה faz a progressão narrativa e integra-se naturalmente à fórmula profética portuguesa “a palavra de ... veio”, sem o arcaísmo de “e aconteceu que”.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” preserva o valor lexical de דָּבָר e a ressonância da fórmula profética, enquanto o nome divino é transliterado.
- source_word: אֵלַי
  choice: a mim
  rationale: Tradução direta da preposição com o sufixo de primeira pessoa e formulação corrente em português.
- source_word: בַּבֹּקֶר
  choice: Pela manhã
  rationale: Expressa de modo natural o momento indicado pelo hebraico e ocupa posição inicial para refletir sua função temporal.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula introdutória do discurso direto que continua no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” preserva explicitamente o nome divino sem substituí-lo por um título; a nota informa a tradição de vertê-lo por “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da fórmula profética. Os dois-pontos indicam que o conteúdo da fala segue no próximo versículo.
