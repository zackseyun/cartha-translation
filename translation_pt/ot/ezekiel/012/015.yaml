  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בַּ/הֲפִיצִ֤/י אוֹתָ/ם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/015.yaml
  text: And they will know that I am Yahweh when I scatter them among the nations and disperse them through the lands[a].
translation:
  language: pt
  text: E eles saberão que eu sou Yahweh, quando eu os espalhar entre as nações e os dispersar pelas terras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E eles saberão
  rationale: O perfeito com waw, no discurso profético, tem aqui força futura e resultativa. “Saberão” preserva a fórmula de reconhecimento recorrente em Ezequiel.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Traduz diretamente a fórmula de reconhecimento e conserva o nome divino יְהוָה por transliteração.
- source_word: בַּהֲפִיצִי
  choice: quando eu os espalhar
  rationale: A preposição בְּ com o infinitivo construto hifil e sufixo de primeira pessoa é naturalmente temporal neste contexto; o hifil de פוץ expressa dispersão causada por Deus.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui os povos estrangeiros entre os quais ocorrerá o exílio; “nações” é claro e evita a conotação mais especificamente neotestamentária de “gentios”.
- source_word: וְזֵרִיתִי
  choice: e os dispersar
  rationale: זרה pode significar espalhar, dispersar ou joeirar. “Dispersar” preserva o sentido contextual e distingue o verbo do פוץ anterior sem eliminar o paralelismo.
- source_word: בָּאֲרָצוֹת
  choice: pelas terras
  rationale: O plural אֲרָצוֹת significa “terras” ou “países”; “pelas terras” expressa a extensão da dispersão sem sugerir necessariamente Estados modernos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação fornecida, sem substituir o nome por um título.
- issue: Relação entre reconhecimento de Yahweh e dispersão
  choice: quando eu os espalhar
  alternative: porque eu os espalharei; ao espalhá-los
  rationale: A construção hebraica favorece uma relação temporal, mas não exclui a ideia de que o juízo seja o meio pelo qual eles reconhecerão Yahweh. A tradução mantém essa tensão sem explicá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e o paralelismo do hebraico foram preservados; “espalhar” e “dispersar” reproduzem os dois verbos distintos. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
