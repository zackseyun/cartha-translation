  text: בֶּן אָדָ֕ם הֲ/לֹ֨א אָמְר֥וּ אֵלֶ֛י/ךָ בֵּ֥ית יִשְׂרָאֵ֖ל בֵּ֣ית הַ/מֶּ֑רִי מָ֖ה אַתָּ֥ה עֹשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/009.yaml
  text: Son of man[a], has not the house of Israel, that rebellious house, said to you, ‘What are you doing?’
translation:
  language: pt
  text: 'Filho do homem, não foi a casa de Israel — essa casa rebelde — que lhe disse: “O que você está fazendo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma característica pela qual Deus se dirige a Ezequiel e preserva sua continuidade literária no livro, sem substituir o idiomatismo por uma interpretação como “mortal”.
- source_word: הֲלֹא
  choice: não
  rationale: Introduz uma pergunta retórica que pressupõe resposta afirmativa; em português, a construção negativa direta comunica naturalmente essa força.
- source_word: אָמְרוּ אֵלֶיךָ
  choice: lhe disse
  rationale: Preserva o sentido comum do verbo “dizer” e a direção da fala a Ezequiel. O singular coletivo “a casa de Israel” justifica “disse”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Conserva a expressão coletiva e pactual recorrente na linguagem profética, em vez de simplificá-la para “o povo de Israel”.
- source_word: בֵּית הַמֶּרִי
  choice: essa casa rebelde
  rationale: Traduz a expressão em aposição a “a casa de Israel”. “Rebelde” expressa מֶרִי com naturalidade, e “essa” torna clara a identificação enfática sem criar um grupo diferente.
- source_word: מָה אַתָּה עֹשֶׂה
  choice: O que você está fazendo?
  rationale: O particípio com o pronome indica uma ação em andamento no contexto; a forma progressiva é natural e clara em português contemporâneo.
theological_decisions: []
translation_notes:
