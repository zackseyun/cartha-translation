  text: בֶּן אָדָ֕ם בְּ/ת֥וֹךְ בֵּית הַ/מֶּ֖רִי אַתָּ֣ה יֹשֵׁ֑ב אֲשֶׁ֣ר עֵינַיִם֩ לָ/הֶ֨ם לִ/רְא֜וֹת וְ/לֹ֣א רָא֗וּ אָזְנַ֨יִם לָ/הֶ֤ם לִ/שְׁמֹ֨עַ֙ וְ/לֹ֣א שָׁמֵ֔עוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/002.yaml
  text: Son of man[a], you dwell in the midst of a rebellious house, who have eyes to see but do not see, ears to hear but do not hear[b], for they are a rebellious house.
translation:
  language: pt
  text: 'Filho do homem, você vive no meio de uma casa rebelde[a]: eles têm olhos para ver, mas não veem; têm ouvidos para ouvir, mas não ouvem[b], pois são uma casa rebelde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma casa de rebeldia” ou “um povo rebelde”. No hebraico, “casa” é um termo coletivo para o povo como um todo.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “olhos há para eles, para ver, e não veem; ouvidos há para eles, para ouvir, e não ouvem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma hebraica do vocativo característico dirigido ao profeta em Ezequiel e sua ressonância intertextual.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Expressa naturalmente a localização do profeta dentro do grupo, mantendo a imagem concreta do hebraico.
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  choice: casa rebelde
  rationale: Mantém a metáfora coletiva e a repetição enfática do hebraico; uma nota esclarece que 'casa' designa o povo como corpo coletivo.
- source_word: יֹשֵׁב
  choice: vive
  rationale: Neste contexto, ישׁב indica residir ou habitar entre o povo; 'vive' é atual, claro e natural em português.
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ
  choice: têm olhos para ver, mas não veem
  rationale: Reproduz de modo idiomático o paralelismo hebraico e conserva o verbo básico 'ver', sem explicitar indevidamente uma interpretação.
- source_word: אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  choice: têm ouvidos para ouvir, mas não ouvem
  rationale: Mantém o paralelismo e o verbo 'ouvir', que pode envolver resposta e compreensão sem que isso seja imposto na tradução.
- source_word: כִּי
  choice: pois
  rationale: Marca com clareza e dignidade a relação explicativa ou causal com a caracterização final.
theological_decisions:
- issue: Metáfora coletiva de 'casa' aplicada a Israel
  choice: Manter 'casa rebelde' no texto principal
  alternative: povo rebelde; casa de rebeldia
  rationale: A metáfora é recorrente e significativa em Ezequiel. Preservá-la conserva a linguagem profética e a repetição do versículo, enquanto a nota evita que seja entendida apenas como uma residência ou família.
- issue: Sentido de ver e ouvir
  choice: Conservar os verbos sensoriais sem paráfrase interpretativa
  alternative: não compreendem; não obedecem
  rationale: No contexto profético, os verbos podem sugerir percepção e resposta, mas o hebraico mantém a formulação concreta; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A segunda pessoa foi vertida por 'você', de uso natural no Brasil, sem afetar o tom profético; o restante evita regionalismos. O paralelismo e a repetição do original foram preservados.
