  text: בֶּן אָדָ֗ם מָֽה הַ/מָּשָׁ֤ל הַ/זֶּה֙ לָ/כֶ֔ם עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַֽאַרְכוּ֙ הַ/יָּמִ֔ים וְ/אָבַ֖ד כָּל חָזֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/022.yaml
  text: Son of man[a], what is this proverb that you have in the land of Israel, saying, ‘The days drag on, and every vision comes to nothing’?”
translation:
  language: pt
  text: 'Filho do homem, que provérbio é este que vocês têm na terra de Israel? Vocês dizem: “Os dias se prolongam, e toda visão fica sem efeito.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os dias se alongam, e toda visão fracassa.”'
    reason: Alternativa lexical para יַאַרְכוּ הַיָּמִים וְאָבַד כָּל חָזוֹן, preservando mais diretamente os sentidos de ‘alongar-se’ e ‘falhar/perecer’.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a fórmula recorrente com que Deus se dirige a Ezequiel e preserva sua coerência literária; no contexto, ressalta a condição humana do profeta.
- source_word: מָה הַמָּשָׁל הַזֶּה
  choice: que provérbio é esse
  rationale: מָשָׁל designa aqui um dito popular ou máxima, não uma parábola narrativa.
- source_word: לָכֶם
  choice: que vocês repetem
  rationale: Expressa em português natural que o provérbio circulava entre o povo, sem entender a construção como mero benefício ou posse individual.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: na terra de Israel
  rationale: Embora אֲדָמָה possa significar literalmente solo ou chão, nesta expressão indica o território de Israel.
- source_word: לֵאמֹר
  choice: Vocês dizem
  rationale: Introduz de maneira clara e natural o conteúdo citado do provérbio.
- source_word: יַאַרְכוּ הַיָּמִים
  choice: Os dias se prolongam
  rationale: Reproduz o sentido de os dias se estenderem, sugerindo a demora que alimentava o ceticismo popular.
- source_word: וְאָבַד כָּל חָזוֹן
  choice: e toda visão fica sem efeito
  rationale: Comunica que, segundo o provérbio, as visões proféticas não se cumprem; evita sugerir que a visão simplesmente desaparece da memória.
theological_decisions:
- issue: Sentido de אָדָם na fórmula dirigida ao profeta
  choice: Filho do homem
  alternative: Mortal; ser humano
  rationale: A expressão é a forma recorrente de tratamento de Ezequiel, não uma afirmação cristológica neste contexto. A tradução tradicional preserva a forma literária sem impor uma interpretação doutrinária posterior.
- issue: Afirmação de que toda visão אָבַד
  choice: fica sem efeito
  alternative: perece; fracassa; acaba em nada
  rationale: A fala citada exprime o ceticismo do povo quanto ao cumprimento da profecia. A tradução preserva essa acusação como fala popular, sem endossá-la como avaliação divina.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para leitura ampla no Brasil. A divisão em pergunta e introdução da citação torna explícita a função de לֵאמֹר sem alterar o conteúdo. As aspas marcam o provérbio popular citado.
