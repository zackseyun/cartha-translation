  source_fidelity: A tradução representa fielmente as duas ordens imperativas e os complementos possessivos. «Filho do homem» preserva a fórmula recorrente de Ezequiel. «Tremendo» comunica adequadamente רַעַשׁ, enquanto «com agitação e ansiedade» conserva a combinação de perturbação exterior (רָגְזָה) e aflição apreensiva (דְאָגָה), sem impor uma distinção excessivamente rígida entre termos hebraicos parcialmente sobrepostos.
