  yaml_path: translation/ot/ezekiel/012/018.yaml
  text: Son of man[a], eat your bread with trembling[b], and drink your water with quaking and anxiety.
translation:
  language: pt
  text: Filho do homem, coma o seu pão tremendo e beba a sua água com agitação e ansiedade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva literalmente a fórmula hebraica recorrente pela qual Deus se dirige a Ezequiel, sem a interpretar como «mortal» ou «ser humano».
- source_word: לַחְמְךָ
  choice: o seu pão
  rationale: Mantém a imagem concreta do pão como alimento básico no ato simbólico do profeta.
- source_word: בְּרַעַשׁ
  choice: tremendo
  rationale: רַעַשׁ indica tremor ou abalo; a construção verbal é natural em português e conserva a manifestação física do medo.
- source_word: תֹּאכֵל
  choice: coma
  rationale: O imperfeito hebraico tem força de ordem no contexto; o imperativo português expressa isso naturalmente.
- source_word: וּמֵימֶיךָ
  choice: a sua água
  rationale: O plural hebraico é vertido pelo singular idiomático em português, preservando a imagem concreta.
- source_word: בְּרָגְזָה
  choice: com agitação
  rationale: רָגְזָה comunica inquietação, tremor ou agitação. «Agitação» mantém a sobreposição com רַעַשׁ sem repetir a mesma palavra portuguesa.
- source_word: וּבִדְאָגָה
  choice: e ansiedade
  rationale: דְאָגָה denota preocupação apreensiva ou ansiedade; a escolha é atual, clara e adequada à aflição interior descrita.
- source_word: תִּשְׁתֶּה
  choice: beba
  rationale: O imperfeito hebraico funciona como ordem coordenada à anterior, representada naturalmente pelo imperativo.
