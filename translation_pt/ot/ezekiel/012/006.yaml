source:
  edition: WLC
  text: לְ/עֵ֨ינֵי/הֶ֜ם עַל כָּתֵ֤ף תִּשָּׂא֙ בָּ/עֲלָטָ֣ה תוֹצִ֔יא פָּנֶ֣י/ךָ תְכַסֶּ֔ה וְ/לֹ֥א תִרְאֶ֖ה אֶת הָ/אָ֑רֶץ כִּֽי מוֹפֵ֥ת נְתַתִּ֖י/ךָ לְ/בֵ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/006.yaml
  text: Before their eyes you shall carry it on your shoulder[a]; in the dark you shall bring it out. You shall cover your face so that you do not see the land[b], for I have made you a sign for the house of Israel.
translation:
  language: pt
  text: Diante dos olhos deles, você o carregará sobre o ombro; na escuridão[a], você o levará para fora. Você cobrirá o rosto para não ver a terra, pois fiz de você um sinal[b] para a casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao crepúsculo”. O termo hebraico pode indicar escuridão ou luz fraca; aqui provavelmente se refere a agir sob a cobertura da escuridão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um presságio”. O termo pode designar um sinal simbólico que também anuncia algo ameaçador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: Diante dos olhos deles
  rationale: Preserva a expressão hebraica vívida que indica uma ação realizada na presença visível deles.
- source_word: עַל כָּתֵף תִּשָּׂא
  choice: você o carregará sobre o ombro
  rationale: נשׂא com 'ombro' descreve o transporte de uma carga; o pronome 'o' retoma, pelo contexto, a bagagem do exílio, embora o objeto esteja implícito no hebraico.
- source_word: בָּעֲלָטָה
  choice: na escuridão
  rationale: עֲלָטָה denota escuridão ou trevas. 'Na escuridão' expressa diretamente o sentido lexical, enquanto 'ao crepúsculo' permanece uma possibilidade contextual indicada em nota.
- source_word: תוֹצִיא
  choice: você o levará para fora
  rationale: O hifil de יצא tem sentido causativo, 'fazer sair' ou 'levar para fora'. Esta formulação é natural em português e mantém o objeto implícito recuperado do contexto.
- source_word: פָּנֶיךָ תְכַסֶּה
  choice: Você cobrirá o rosto
  rationale: Traduz de modo direto a ação simbólica sem especificar indevidamente o tipo de cobertura.
- source_word: וְלֹא תִרְאֶה אֶת הָאָרֶץ
  choice: para não ver a terra
  rationale: A coordenação hebraica exprime aqui naturalmente a finalidade ou o resultado de cobrir o rosto; 'para não ver' torna essa relação clara em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém a formulação genérica do hebraico sem explicitar 'terra de Israel', embora esse referente seja provável no contexto.
- source_word: מוֹפֵת
  choice: um sinal
  rationale: מוֹפֵת pode significar sinal, prodígio ou presságio. Neste ato profético, 'sinal' comunica com clareza que Ezequiel representa simbolicamente o que acontecerá a Israel.
- source_word: נְתַתִּיךָ
  choice: fiz de você
  rationale: Embora נתן signifique literalmente 'dar', a construção com predicativo é expressa idiomaticamente em português por 'fazer de alguém' algo.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: Preserva a designação profética tradicional 'casa de Israel', e 'para' indica o povo ao qual o sinal se destina.
theological_decisions:
- issue: Referente de הָאָרֶץ no ato simbólico
  choice: a terra
  alternative: a terra de Israel; o chão; a terra no sentido amplo
  rationale: O contexto aponta para a terra natal da qual o povo seria levado ao exílio, mas o hebraico diz apenas 'a terra'. A tradução não acrescenta uma identificação interpretativa ao texto principal.
- issue: Valor de מוֹפֵת
  choice: um sinal
  alternative: um presságio; um prodígio
  rationale: O termo pode incluir uma conotação portentosa, mas o contexto destaca Ezequiel como representação simbólica para Israel. A alternativa mais ominosa é preservada em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. O futuro do indicativo preserva a forma de instrução profética da sequência hebraica. Os marcadores de nota foram posicionados junto aos termos a que efetivamente se referem: ''escuridão'' e ''sinal''.'
