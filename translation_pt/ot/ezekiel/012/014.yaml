  text: וְ/כֹל֩ אֲשֶׁ֨ר סְבִיבֹתָ֥י/ו עזר/ה וְ/כָל אֲגַפָּ֖י/ו אֱזָרֶ֣ה לְ/כָל ר֑וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/014.yaml
  text: And all who are around him—his helpers and all his troops—I will scatter to every wind[b][a], and I will draw out a sword after them.
translation:
  language: pt
  text: E todos os que estão ao redor dele — os que o ajudam e todas as suas tropas — eu os espalharei a todos os ventos[a] e desembainharei a espada para persegui-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a todo vento”, isto é, em todas as direções.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתָיו
  choice: os que estão ao redor dele
  rationale: Expressa naturalmente a relação espacial do hebraico e mantém a referência às pessoas que cercam o governante.
- source_word: עֶזְרָה
  choice: os que o ajudam
  rationale: A expressão tem sentido coletivo no contexto e designa pessoas que lhe prestam auxílio, não uma ajuda abstrata.
- source_word: אֲגַפָּיו
  choice: suas tropas
  rationale: Embora o termo se relacione literalmente a alas ou extremidades, neste contexto político-militar refere-se a destacamentos ou tropas.
- source_word: אֱזָרֶה
  choice: eu os espalharei
  rationale: O Piel de זרה pode significar peneirar ou dispersar; tendo pessoas como objeto, 'espalhar' comunica com clareza o sentido contextual.
- source_word: לְכָל רוּחַ
  choice: a todos os ventos
  rationale: Preserva a imagem idiomática hebraica e sua força profética, com o sentido de dispersão em todas as direções.
- source_word: חֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: desembainharei a espada para persegui-los
  rationale: O Hifil de ריק com 'espada' significa tirá-la da bainha; אַחֲרֵיהֶם acrescenta a ideia de perseguição, explicitada de modo natural em português.
theological_decisions: []
