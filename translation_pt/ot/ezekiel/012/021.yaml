  text: 'A palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: 'A forma narrativa de היה introduz a fórmula profética. Em português atual, seu valor é expresso naturalmente pelo verbo da oração: “A palavra ... veio”, sem o redundante “E aconteceu”.'
- source_word: דְבַר
  choice: A palavra
  rationale: Na fórmula profética, דְבַר designa a palavra ou mensagem divina recebida. “A palavra” preserva a formulação concreta e tradicional sem explicitar interpretativamente “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Equivalente direto da preposição com sufixo de primeira pessoa; a construção “veio a mim” é clara e digna em português.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo introduz a fala direta que começa no versículo seguinte. “Dizendo:” conserva essa função e os dois-pontos sinalizam a continuação do oráculo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva o nome divino e evita substituí-lo pelo título “Senhor”; “Jeová” reflete uma vocalização híbrida posterior.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. Omite-se um “E” inicial porque o waw funciona aqui como ligação narrativa, e a frase inicia uma nova unidade em português; mantém-se a fórmula profética de modo natural.
