review_pass:
  verdict: revise
  source_fidelity: O texto conserva a sequência de ordens e explicita de modo justificável, pelo contexto imediato, o objeto elíptico de וְהוֹצֵאתָ. Contudo, «abra uma passagem» é menos específico que o verbo hebraico, que descreve cavar/romper através da parede; além disso, a nota chama de literal uma formulação portuguesa cujo pronome feminino não pode reproduzir o referente masculino hebraico («a parede»).
  naturalness: A redação é clara e natural, mas «cave ... uma abertura» representa mais diretamente a ação física do sinal profético e mantém boa fluência em português moderno. «Por ela» pode referir-se naturalmente à abertura mencionada na frase.
  terminology: «Bagagem» é adequado ao contexto de Ezequiel 12:3–4, embora não seja repetida no hebraico deste versículo. «À vista deles» preserva bem o caráter público de לְעֵינֵיהֶם.
  issues:
  - severity: medium
    issue: A nota de rodapé descreve como literal uma forma que não esclarece o referente do pronome hebraico.
    rationale: Em בּוֹ, o sufixo é masculino e retoma «a parede» (קִיר, masculino), isto é, a saída se dá através dela/da abertura nela feita. A nota atual usa «por ela» sem informar essa relação e, por isso, não é uma apresentação estrita do hebraico.
  - severity: low
    issue: «Abra uma passagem» suaviza a imagem de cavar ou romper a parede.
    rationale: חֲתָר indica escavar ou abrir-se caminho através de uma barreira. «Cave ... uma abertura» preserva melhor a ação concreta sem sacrificar a naturalidade.
  - severity: low
    issue: A nuance reflexiva/dativa de לְךָ não aparece na tradução.
    rationale: «Para si» é uma maneira breve e natural de representar essa nuance, sem lhe atribuir significado teológico ou excessivo.
