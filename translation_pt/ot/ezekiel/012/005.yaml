  yaml_path: translation/ot/ezekiel/012/005.yaml
  text: Before their eyes[a], dig through the wall, and bring out through it.
translation:
  language: pt
  text: À vista deles, cave para si uma abertura na parede e retire por ela a sua bagagem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e faça sair por ele”; “ele” refere-se à parede, isto é, pela abertura feita nela. O objeto não é repetido no hebraico; “a sua bagagem” é suprido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: À vista deles
  rationale: Expressa o sentido idiomático de realizar a ação na presença visível deles, preservando o caráter público do ato simbólico.
- source_word: חֲתָר לְךָ
  choice: abra uma passagem
  rationale: O verbo descreve cavar ou romper uma parede. Em português, “abra uma passagem” comunica naturalmente tanto a ação quanto seu resultado; לְךָ indica que o próprio Ezequiel deve fazê-lo, nuance já clara pela ordem direta.
- source_word: בַקִּיר
  choice: na parede
  rationale: O substantivo definido se refere à parede presente na cena encenada.
- source_word: וְהוֹצֵאתָ
  choice: retire ... a sua bagagem
  rationale: A forma causativa significa fazer sair, retirar ou levar para fora. Embora o objeto esteja elíptico neste versículo, a bagagem mencionada no contexto imediato é o referente natural.
- source_word: בּוֹ
  choice: por ela
  rationale: Indica que a bagagem deve ser retirada através da passagem aberta na parede; o feminino concorda naturalmente com “passagem” em português.
