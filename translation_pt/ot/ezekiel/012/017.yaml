  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה, em conjunto com דְבַר ... אֵלַי, integra a fórmula profética recorrente. Em português natural, o sentido é expresso por “veio”, sem reproduzir literalmente “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר יְהוָה, “a palavra” preserva a expressão tradicional e designa uma comunicação divina específica; “mensagem” seria possível, mas menos formalmente próxima do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição com sufixo de primeira pessoa indica Ezequiel como destinatário da comunicação. “A mim” é claro e corrente.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala direta que vem no versículo seguinte. “Dizendo” conserva a estrutura da fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente pelo título tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a fórmula profética e o particípio introdutório “dizendo”, pois a fala continua no versículo seguinte. O conectivo inicial hebraico não foi vertido por “E”, já que o início de uma unidade de leitura em português soa mais natural sem ele.
