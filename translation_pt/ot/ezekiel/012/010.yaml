source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/נָּשִׂ֞יא הַ/מַּשָּׂ֤א הַ/זֶּה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל אֲשֶׁר הֵ֥מָּה בְ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/010.yaml
  text: 'Say to them[a], ‘Thus says the Lord GOD: This burden concerns the prince in Jerusalem and all the house of Israel who are in their midst.’'
translation:
  language: pt
  text: 'Diga-lhes: “Assim diz o Senhor Yahweh: Este pronunciamento[a] diz respeito ao príncipe em Jerusalém e a toda a casa de Israel que está no meio deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este fardo”. O termo hebraico pode indicar tanto algo que se carrega como um pronunciamento profético.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֲלֵיהֶם
  choice: Diga-lhes
  rationale: O imperativo de אמר com אֶל introduz a fala dirigida aos ouvintes; esta formulação é direta e natural em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula convencional do mensageiro profético e seu tom solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי como o nome divino יהוה, sem fundi-los nem repetir “Senhor”.
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Em Ezequiel, נָשִׂיא funciona frequentemente como título político; “príncipe” preserva essa nuance melhor que o termo mais genérico “líder”.
- source_word: הַמַּשָּׂא הַזֶּה
  choice: Este pronunciamento
  rationale: מַשָּׂא pode indicar uma carga ou, por extensão, um pronunciamento profético. “Pronunciamento” comunica com naturalidade o sentido contextual, enquanto a nota preserva a imagem lexical de “fardo”.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: A preposição בְּ tem aqui valor locativo e se liga naturalmente ao príncipe; não há necessidade de interpretá-la como “contra Jerusalém”.
- source_word: וְכָל בֵּית יִשְׂרָאֵל
  choice: e a toda a casa de Israel
  rationale: Conserva a expressão bíblica e nacional “casa de Israel”, em vez de reduzi-la simplesmente a “Israel”.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: que está no meio deles
  rationale: A concordância singular segue o núcleo coletivo “casa”; “no meio deles” mantém o sufixo plural hebraico sem fixar de maneira indevida seu referente.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A opção escolhida distingue o título “Senhor” do nome pessoal “Yahweh” e torna visíveis os dois elementos presentes no hebraico.
- issue: Sentido de מַשָּׂא
  choice: pronunciamento
  alternative: fardo
  rationale: No contexto profético, o termo pode designar a mensagem pronunciada, mas sua imagem básica de algo carregado continua possível; por isso, ela é preservada em nota, sem eliminar a tensão lexical.
- issue: Referente do sufixo plural em בְתוֹכָם
  choice: deles
  alternative: dos habitantes de Jerusalém
  rationale: O hebraico emprega um sufixo plural cujo referente não é explicitado na frase. Mantê-lo como “deles” evita resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética foi mantida em registro solene; a sintaxe comprimida do hebraico foi esclarecida apenas o necessário com “diz respeito a”, sem determinar o referente ambíguo de “deles”.
