  source_fidelity: A tradução transmite adequadamente a fórmula profética, o título composto אַדֹנָי יְהוִה como “o Senhor Yahweh”, o título político “príncipe”, o valor locativo de “em Jerusalém” e a expressão “casa de Israel”. “Este pronunciamento diz respeito a” é uma explicitação moderada e defensável da construção nominal comprimida com מַשָּׂא. “No meio deles” preserva, sem resolver, o referente plural não expresso do sufixo hebraico.
  naturalness: O português é atual, solene e amplamente legível. “Diga-lhes” e “Assim diz” soam naturais no registro profético. A concordância singular em “a casa de Israel que está” é aceitável em português, pois “casa” é um coletivo singular, embora o hebraico empregue uma forma plural no relativo.
  terminology: “Senhor Yahweh” representa visivelmente os dois elementos do título hebraico sem a redundância de “Senhor SENHOR”. “Príncipe” preserva o uso titular de נָשִׂיא em Ezequiel. “Pronunciamento”, com nota para “fardo”, comunica o uso profético contextual de מַשָּׂא e mantém disponível sua imagem lexical.
