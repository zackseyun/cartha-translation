  text: כִּ֠י לֹ֣א יִֽהְיֶ֥ה ע֛וֹד כָּל חֲז֥וֹן שָׁ֖וְא וּ/מִקְסַ֣ם חָלָ֑ק בְּ/ת֖וֹךְ בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/024.yaml
  text: For there will no longer be any false vision or flattering divination within the house of Israel[a].
translation:
  language: pt
  text: Pois já não haverá nenhuma visão falsa nem adivinhação lisonjeira[a] no meio da casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adivinhação suave”. O adjetivo hebraico significa literalmente “lisa” ou “suave” e, aqui, provavelmente se refere a uma mensagem lisonjeira ou enganosamente tranquilizadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou razão ligada ao que precede, preservando a força causal do hebraico em português natural.
- source_word: לֹא ... עוֹד
  choice: já não
  rationale: Expressa a cessação a partir daquele momento; é uma formulação corrente e concisa em português.
- source_word: יִהְיֶה
  choice: haverá
  rationale: O verbo היה tem aqui sentido existencial, expresso naturalmente por 'haverá'.
- source_word: כָּל
  choice: nenhuma
  rationale: Sob negação, כָּל assume o sentido de totalidade negativa, idiomaticamente expresso por 'nenhuma'.
- source_word: חֲזוֹן שָׁוְא
  choice: visão falsa
  rationale: שָׁוְא pode indicar falsidade, vazio ou inutilidade; no contexto profético, 'falsa' comunica com clareza a ilegitimidade da visão.
- source_word: מִקְסַם
  choice: adivinhação
  rationale: Designa prática mântica ilícita e mantém a distinção entre visão e adivinhação.
- source_word: חָלָק
  choice: lisonjeira
  rationale: O sentido literal é 'lisa, suave', mas aqui provavelmente caracteriza uma mensagem agradável e enganosamente tranquilizadora; a nota preserva a imagem literal.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Preserva o valor locativo e coletivo da expressão hebraica em linguagem natural.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Mantém a designação coletiva característica do registro profético, em vez de reduzi-la simplesmente a 'Israel'.
theological_decisions:
- issue: Natureza da fala profética condenada
  choice: O versículo condena tanto as falsas alegações de visão quanto os pronunciamentos divinatórios lisonjeiros e enganosos entre Israel.
  alternative: Entender a segunda expressão mais literalmente como 'adivinhação suave' ou 'adivinhação lisa'.
  rationale: A tradução comunica a crítica moral e profética sem apagar a metáfora hebraica, que é registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se 'casa de Israel' pelo valor coletivo e pelo registro profético do original.
