  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם עֲשֵׂ֤ה לְ/ךָ֙ כְּלֵ֣י גוֹלָ֔ה וּ/גְלֵ֥ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/גָלִ֨יתָ מִ/מְּקוֹמְ/ךָ֜ אֶל מָק֤וֹם אַחֵר֙ לְ/עֵ֣ינֵי/הֶ֔ם אוּלַ֣י יִרְא֔וּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/003.yaml
  text: And you, son of man, prepare for yourself baggage for exile, and go into exile by day before their eyes. You shall go into exile from your place to another place before their eyes. Perhaps they will see, though they are a rebellious house.
translation:
  language: pt
  text: E você, filho do homem, prepare para si uma bagagem de exílio e parta para o exílio durante o dia, diante dos olhos deles. Vá para o exílio, do lugar onde está para outro lugar, diante dos olhos deles. Talvez vejam, embora sejam uma casa rebelde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: uma bagagem de exílio
  rationale: A expressão designa os objetos ou pertences preparados por alguém que parte para o exílio. “Bagagem de exílio” mantém a imagem concreta e a concisão do hebraico.
- source_word: וּגְלֵה / וְגָלִיתָ
  choice: parta para o exílio / saia... e vá
  rationale: O verbo גלה é repetido com o sentido de migrar como exilado. A primeira ocorrência preserva explicitamente “exílio”; a segunda é expressa de modo natural em português, mantendo o deslocamento encenado de um lugar para outro.
- source_word: יוֹמָם
  choice: durante o dia
  rationale: Indica que a ação deve ocorrer em plena luz do dia, visível aos observadores.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Conserva a repetição e a ênfase visual do hebraico.
- source_word: יִרְאוּ
  choice: percebam
  rationale: Embora o sentido básico seja “vejam”, no contexto a visão do ato simbólico deve levar ao reconhecimento de sua mensagem. “Percebam” comunica essa extensão contextual sem especificar indevidamente o objeto.
- source_word: בֵּית מְרִי
  choice: casa rebelde
  rationale: Mantém a metáfora coletiva “casa” e o caráter estabelecido de rebeldia.
theological_decisions:
- issue: Relação de כִּי com a oração anterior
  choice: embora sejam uma casa rebelde
  alternative: pois são uma casa rebelde
  rationale: 'כִּי admite mais de uma relação discursiva. Neste contexto, a rebeldia funciona naturalmente como concessão que torna incerta a percepção: talvez percebam, apesar de serem rebeldes. A tradução preserva a tensão refletida na camada inglesa auditada sem transformar a rebeldia em razão para perceberem.'
- issue: Indeterminação do que será percebido
  choice: Talvez percebam
  alternative: Talvez vejam o sinal / entendam
  rationale: O hebraico não declara um objeto. A tradução evita acrescentar “o sinal”, “a mensagem” ou “entendam”, preservando a abertura do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “diante dos olhos deles” foi mantida por sua função enfática. “Prepare para si” conserva a forma reflexiva sem soar excessivamente arcaica.
