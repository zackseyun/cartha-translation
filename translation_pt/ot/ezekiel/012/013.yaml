reference: Ezekiel 12:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/פָרַשְׂתִּ֤י אֶת רִשְׁתִּ/י֙ עָלָ֔י/ו וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וְ/הֵבֵאתִ֨י אֹת֤/וֹ בָבֶ֨לָ/ה֙ אֶ֣רֶץ כַּשְׂדִּ֔ים וְ/אוֹתָ֥/הּ לֹֽא יִרְאֶ֖ה וְ/שָׁ֥ם יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/013.yaml
  text: I will spread my net over him[a], and he will be caught in my snare. Then I will bring him to Babylon, the land of the Chaldeans; yet he will not see it[b], and there he will die.
translation:
  language: pt
  text: Estenderei sobre ele a minha rede[a], e ele será apanhado na minha armadilha. Então eu o levarei para a Babilônia, terra dos caldeus; contudo, ele não a verá[b], e ali morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “minha armadilha”. O hebraico emprega dois termos relacionados à caça: “minha rede” e “minha armadilha”.'
    reason: lexical_alternative
  - marker: b
    text: A afirmação de que ele seria levado à Babilônia, mas não a veria, pode ser compreendida à luz de 2 Reis 25:7; Jeremias 39:7; 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: Estenderei
  rationale: O verbo פָּרַשׂ significa estender ou desdobrar; “estenderei” conserva de modo natural a imagem de uma rede lançada sobre alguém.
- source_word: רִשְׁתִּי
  choice: a minha rede
  rationale: רֶשֶׁת é o termo comum para rede, especialmente em imagens de caça e captura.
- source_word: עָלָיו
  choice: sobre ele
  rationale: A preposição עַל tem aqui sentido espacial e se ajusta à imagem da rede que cobre a pessoa capturada.
- source_word: וְנִתְפַּשׂ
  choice: ele será apanhado
  rationale: A forma passiva expressa que ele será pego; “apanhado” mantém a ligação clara com a imagem da rede e da armadilha.
- source_word: בִּמְצוּדָתִי
  choice: na minha armadilha
  rationale: מְצוּדָה pode designar rede, laço ou armadilha. “Armadilha” evita repetição e preserva o paralelismo entre dois termos relacionados de caça.
- source_word: וְהֵבֵאתִי אֹתוֹ
  choice: Então eu o levarei
  rationale: O hifil de בוא significa “levar/trazer”. “Então” comunica com naturalidade a sequência dos acontecimentos.
- source_word: בָבֶלָה
  choice: para a Babilônia
  rationale: A terminação direcional indica movimento em direção à Babilônia.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: terra dos caldeus
  rationale: Tradução direta da designação histórico-étnica hebraica, em aposição a Babilônia.
- source_word: וְאוֹתָהּ לֹא יִרְאֶה
  choice: contudo, ele não a verá
  rationale: O pronome feminino retoma a terra/Babilônia. “Contudo” preserva o contraste surpreendente sem explicar no texto principal como isso aconteceria.
- source_word: וְשָׁם יָמוּת
  choice: e ali morrerá
  rationale: Tradução direta que conserva a sequência e a ênfase hebraica no lugar da morte.
theological_decisions:
- issue: Ironia histórica implícita em “ele não a verá”
  choice: Manter literalmente a afirmação, sem explicar a causa no texto principal.
  alternative: 'Expandir interpretativamente: “ele não a verá, porque ficará cego”.'
  rationale: O versículo afirma que ele será levado à Babilônia, mas não a verá. Embora outros textos expliquem o acontecimento, a tradução deve preservar a tensão e não inserir no corpo do texto uma explicação ausente do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação pronominal e o futuro simples mantêm solenidade sem arcaísmo excessivo. O contraste “contudo” preserva a tensão do hebraico.
