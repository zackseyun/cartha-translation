base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/007.yaml
  text: 'So I did as I was commanded: by day I brought out my baggage like the baggage of exile[a], and in the evening I dug through the wall by hand. In the dark I brought it out[b]; I carried it on my shoulder before their eyes.'
translation:
  language: pt
  text: 'Assim, fiz conforme me foi ordenado: durante o dia, tirei para fora os meus pertences, como os pertences de quem vai para o exílio[a]; ao anoitecer, abri com as mãos uma passagem através da parede. Na escuridão, tirei-os para fora[b] e os carreguei sobre o ombro diante dos olhos deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como os pertences de um exilado”. A expressão hebraica se refere a pertences preparados para partir para o exílio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na penumbra” ou “ao cair da noite”. O termo hebraico indica escuridão e pode sugerir tanto pouca luz quanto ocultação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ כֵּן
  choice: Assim, fiz
  rationale: Reproduz de modo natural a sequência narrativa e a ideia de que Ezequiel agiu dessa maneira.
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  choice: conforme me foi ordenado
  rationale: Preserva a construção passiva e o sentido de obediência, sem explicitar quem deu a ordem além do que consta no verso.
- source_word: כֵּלַי כִּכְלֵי גוֹלָה
  choice: a minha bagagem, como bagagem para o exílio
  rationale: כְּלִי é amplo, mas neste contexto designa pertences transportáveis. A expressão 'para o exílio' comunica a finalidade ou adequação da bagagem sem identificar indevidamente seu portador.
- source_word: יוֹמָם
  choice: durante o dia
  rationale: Expressão temporal clara e corrente em português.
- source_word: וּבָעֶרֶב
  choice: ao anoitecer
  rationale: Marca naturalmente a progressão do período diurno para o entardecer, mantendo possível sobreposição com a escuridão subsequente.
- source_word: חָתַרְתִּי לִי בַקִּיר בְּיָד
  choice: abri com as mãos uma passagem na parede
  rationale: Comunica a ação de escavar ou romper a parede para produzir uma abertura. O dativo לִי não exige equivalente autônomo em português, e 'com as mãos' preserva o instrumento e a ação pessoal.
- source_word: בָּעֲלָטָה
  choice: Na escuridão
  rationale: Mantém o sentido primário de trevas ou pouca luz sem transformar em certeza a possível nuance de ocultação.
- source_word: הוֹצֵאתִי
  choice: tirei a bagagem para fora
  rationale: O objeto está elíptico no hebraico; repeti-lo em português evita um pronome potencialmente ambíguo, sem acrescentar nova ação.
- source_word: עַל כָּתֵף נָשָׂאתִי
  choice: a carreguei sobre o ombro
  rationale: Preserva a imagem física concreta; o singular feminino retoma naturalmente 'bagagem' como conjunto.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Mantém de perto o idioma hebraico e ressalta o caráter público do ato profético.
theological_decisions:
- issue: Natureza do ato simbólico de Ezequiel
  choice: Narrar as ações concretas e públicas sem explicar seu simbolismo dentro do versículo.
  alternative: Inserir linguagem interpretativa que identifique explicitamente a deportação simbolizada.
  rationale: O contexto explica o sinal profético. Este versículo deve conservar a tensão entre ação concreta e significado simbólico, sem antecipar a interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e conserva as imagens concretas do hebraico. Todos os marcadores de nota aparecem no texto principal.
