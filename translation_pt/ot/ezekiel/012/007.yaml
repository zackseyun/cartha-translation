  terminology: “Pertences” é uma boa opção para כֵּלַי neste contexto e evita a repetição algo pesada de “bagagem”. “Escuridão”, “ombro” e a formulação pública “diante dos olhos deles” mantêm adequadamente as imagens e o registro.
