  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה לֹ֥א תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽ/ימֵי/כֶ֞ם בֵּ֣ית הַ/מֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַ/עֲשִׂיתִ֔י/ו נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/025.yaml
  text: For I am Yahweh[a]; the word that I speak will be done. It will no longer be delayed, for in your days, O rebellious house, I will speak a word and do it[b], declares the Lord GOD.
translation:
  language: pt
  text: Pois eu sou Yahweh. Falarei, e qualquer palavra que eu falar será cumprida. Ela não será mais adiada[a], pois, nos dias de vocês, ó casa rebelde, falarei uma palavra e a cumprirei — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será mais prolongada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, e mantém sua distinção em relação a אֲדֹנָי.
- source_word: אֲדַבֵּר אֵת אֲשֶׁר אֲדַבֵּר דָּבָר וְיֵעָשֶׂה
  choice: Falarei, e qualquer palavra que eu falar será cumprida
  rationale: Reproduz a repetição enfática do verbo 'falar' e a ligação direta entre a palavra divina e seu cumprimento, com sintaxe natural em português.
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: Ela não será mais adiada
  rationale: Expressa de modo claro e atual a ideia de que a palavra ou seu cumprimento não continuará sendo postergado; o pronome retoma 'palavra'.
- source_word: בֵּית הַמֶּרִי
  choice: ó casa rebelde
  rationale: Conserva a metáfora coletiva e pactual de 'casa' e marca adequadamente o vocativo.
- source_word: וַעֲשִׂיתִיו
  choice: e a cumprirei
  rationale: No contexto, a forma comunica ação futura certa. 'Cumprirei' ressalta que Yahweh realizará a palavra anunciada.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Traduz naturalmente a fórmula profética e preserva tanto o título אֲדֹנָי quanto o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino e do título composto
  choice: Yahweh no início; Senhor Yahweh na fórmula final
  alternative: SENHOR no início; Soberano SENHOR ou Senhor DEUS no fim
  rationale: A opção preserva o nome próprio no hebraico e distingue o título composto אֲדֹנָי יְהוִה sem introduzir uma substituição tipográfica ausente do texto-fonte.
- issue: Relação entre a fala divina e seu cumprimento
  choice: qualquer palavra que eu falar será cumprida
  alternative: a palavra que eu falar acontecerá
  rationale: Mantém a ênfase da construção hebraica e apresenta a eficácia da fala divina sem acrescentar uma explicação teológica além do que o versículo afirma.
translation_notes:
  register: Português contemporâneo, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “falarei/falar” foi mantida por ser enfática no hebraico.
