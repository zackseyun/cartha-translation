  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הוֹתַרְתִּ֤י מֵ/הֶם֙ אַנְשֵׁ֣י מִסְפָּ֔ר מֵ/חֶ֖רֶב מֵ/רָעָ֣ב וּ/מִ/דָּ֑בֶר לְמַ֨עַן יְסַפְּר֜וּ אֶת כָּל תּוֹעֲבֽוֹתֵי/הֶ֗ם בַּ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/016.yaml
  text: But I will spare from among them a few men from the sword[a], from famine, and from pestilence, so that they may recount all their abominations among the nations where they go; and they will know that I am Yahweh.
translation:
  language: pt
  text: Mas pouparei, dentre eles, alguns homens da espada, da fome e da peste, para que contem todas as suas abominações entre as nações aonde chegarem[a]; e saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aonde chegaram”. O verbo hebraico está formalmente no perfeito, mas, neste contexto voltado para o futuro, pode ser entendido em relação ao destino a que os sobreviventes chegarão.
    reason: alternativa gramatical e temporal
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: pouparei
  rationale: O hifil de יתר expressa deixar alguns vivos ou preservar sobreviventes; “pouparei” comunica de modo natural a preservação intencional.
- source_word: מֵהֶם
  choice: dentre eles
  rationale: A preposição tem sentido partitivo, indicando que os sobreviventes são retirados do conjunto.
- source_word: אַנְשֵׁי מִסְפָּר
  choice: alguns homens
  rationale: O idiomatismo hebraico designa homens em número reduzido; a formulação preserva tanto a ideia de poucos quanto a referência masculina.
- source_word: מֵחֶרֶב מֵרָעָב וּמִדָּבֶר
  choice: da espada, da fome e da peste
  rationale: Mantém a tríade profética tradicional de juízos, preservando “espada” como metonímia de guerra ou morte violenta.
- source_word: לְמַעַן יְסַפְּרוּ
  choice: para que contem
  rationale: לְמַעַן introduz propósito, e o piel de ספר indica narrar ou relatar os atos.
- source_word: אֵת כָּל תּוֹעֲבוֹתֵיהֶם
  choice: todas as suas abominações
  rationale: “Abominações” conserva a força moral e religiosa de תּוֹעֵבָה em Ezequiel, inclusive sua frequente associação com idolatria.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם refere-se aqui às nações estrangeiras entre as quais os sobreviventes estarão dispersos.
- source_word: אֲשֶׁר בָּאוּ שָׁם
  choice: aonde chegarem
  rationale: Embora בָּאוּ seja formalmente perfeito, a oração tem orientação futura no contexto do exílio anunciado; o futuro do subjuntivo é idiomático em português, enquanto a nota registra a forma verbal hebraica.
- source_word: וְיָדְעוּ
  choice: e saberão
  rationale: Preserva a fórmula recorrente de reconhecimento em Ezequiel sem explicá-la além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Expressão masculina אַנְשֵׁי מִסְפָּר
  choice: alguns homens
  alternative: algumas pessoas; um pequeno número de pessoas
  rationale: O substantivo hebraico é masculino e designa homens; a tradução evita neutralizar essa referência.
- issue: Nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome divino em forma transliterada.
- issue: Finalidade da preservação dos sobreviventes
  choice: para que contem todas as suas abominações
  alternative: de modo que contem todas as suas abominações
  rationale: 'לְמַעַן indica propósito. A tradução mantém a tensão do texto: os sobreviventes são poupados para relatar suas próprias abominações, sem especificar se isso constitui confissão, testemunho judicial ou mera narração.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação conserva as duas finalidades ou consequências coordenadas do texto, e o vocabulário profético tradicional é mantido sem arcaísmo excessivo.
