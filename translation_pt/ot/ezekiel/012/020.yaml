  text: וְ/הֶ/עָרִ֤ים הַ/נּֽוֹשָׁבוֹת֙ תֶּחֱרַ֔בְנָה וְ/הָ/אָ֖רֶץ שְׁמָמָ֣ה תִֽהְיֶ֑ה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/020.yaml
  text: And the inhabited cities will be laid waste[a], and the land will become a desolation; then you will know that I am Yahweh.
translation:
  language: pt
  text: E as cidades habitadas serão devastadas, e a terra ficará desolada. Então vocês saberão que eu sou Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “SENHOR”.'
    reason: Esclarece a forma hebraica do nome divino e a tradução tradicional.
lexical_decisions:
- source_word: הֶעָרִים הַנּוֹשָׁבוֹת
  choice: as cidades habitadas
  rationale: עִיר abrange cidade ou povoado, e o particípio de ישׁב as caracteriza como lugares povoados. “Cidades habitadas” preserva de modo claro o contraste com a devastação anunciada.
- source_word: תֶּחֱרַבְנָה
  choice: serão devastadas
  rationale: A forma de חרב indica que as cidades ficarão arruinadas ou desoladas. “Serão devastadas” comunica naturalmente em português tanto o juízo sofrido quanto seu resultado.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste contexto de cidades e devastação territorial, אֶרֶץ se refere à terra ou região, não ao planeta inteiro.
- source_word: שְׁמָמָה תִהְיֶה
  choice: ficará desolada
  rationale: Embora שְׁמָמָה seja um substantivo (“desolação”), a construção portuguesa “ficará desolada” expressa com naturalidade a transição para esse estado sem alterar o sentido.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O encadeamento profético apresenta o reconhecimento de Yahweh como consequência da devastação. “Então” explicita essa relação, e “vocês” reflete o plural hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino, não um título. “Yahweh” o translitera de forma reconhecível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o caráter de nome próprio do Tetragrama. A nota informa a convenção tradicional sem substituir o nome por um título no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a abertura coordenada do hebraico com “E”, emprega “vocês” para marcar o plural e evita linguagem excessivamente arcaica.
