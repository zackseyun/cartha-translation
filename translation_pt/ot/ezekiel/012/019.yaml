  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֶל עַ֣ם הָ/אָ֡רֶץ כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לְ/יוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙ אֶל אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָ/ם֙ בִּ/דְאָגָ֣ה יֹאכֵ֔לוּ וּ/מֵֽימֵי/הֶ֖ם בְּ/שִׁמָּמ֣וֹן יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָ/הּ֙ מִ/מְּלֹאָ֔/הּ מֵ/חֲמַ֖ס כָּֽל הַ/יֹּשְׁבִ֥ים בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/019.yaml
  text: 'And say to the people of the land[a], ‘Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water with horror[b], so that her land may be made desolate of its fullness because of the violence of all who dwell in it.’'
translation:
  language: pt
  text: 'E diga ao povo da terra[a]: “Assim diz o Senhor Yahweh a respeito dos habitantes de Jerusalém na terra de Israel: Eles comerão o seu pão com ansiedade e beberão a sua água com horror[b], para que a terra fique desolada, privada de tudo o que a enche, por causa da violência de todos os que nela habitam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “povo do país”. A expressão hebraica provavelmente se refere aqui à população que permanecia na terra, não necessariamente a uma classe social específica.
    reason: lexical_alternative
  - marker: b
    text: Ou “com consternação” ou “em meio à desolação”. O termo hebraico pode indicar tanto horror e espanto quanto a devastação que os provoca.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: povo da terra
  rationale: Mantém de perto a expressão hebraica sem a transformar em designação de uma classe social; no contexto, provavelmente se refere à população que permanecia na terra.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Preserva o título אֲדֹנָי e representa diretamente o nome divino יהוה, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: לְיוֹשְׁבֵי יְרוּשָׁלַם אֶל אַדְמַת יִשְׂרָאֵל
  choice: a respeito dos habitantes de Jerusalém na terra de Israel
  rationale: O destinatário imediato é o povo da terra, e אֶל pode introduzir o assunto da mensagem; “a respeito de” torna essa relação clara sem excluir totalmente a nuance direcional.
- source_word: בִּדְאָגָה
  choice: com ansiedade
  rationale: Expressa a inquietação e o temor ligados à escassez, além de formar um paralelo natural com a frase seguinte.
- source_word: בְּשִׁמָּמוֹן
  choice: com horror
  rationale: O termo pode indicar horror, consternação ou o estado causado pela devastação. “Com horror” descreve naturalmente a maneira de beber, enquanto a nota preserva a amplitude lexical.
- source_word: תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ
  choice: para que a terra fique desolada, privada de tudo o que a enche
  rationale: Reproduz o resultado de devastação e explicita de modo natural a imagem hebraica de a terra ser esvaziada de sua plenitude.
- source_word: מֵחֲמַס
  choice: por causa da violência
  rationale: חָמָס designa violência, opressão ou grave injustiça; neste contexto de juízo, “violência” conserva sua força e a preposição expressa a causa.
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: “Senhor Yahweh” distingue o título do nome pessoal e preserva explicitamente o nome da aliança presente no texto hebraico.
- issue: Relação entre a desolação da terra e a violência de seus habitantes
  choice: 'Manter a construção de propósito ou resultado: “para que”'
  alternative: Construção puramente causal ou temporal
  rationale: לְמַעַן introduz aqui propósito ou resultado. A tradução conserva a tensão profética sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Conservam-se o concreto “pão”, a repetição temática ligada à desolação e a ambiguidade lexical de בְּשִׁמָּמוֹן por meio de nota.
