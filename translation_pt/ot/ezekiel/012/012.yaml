source:
  edition: WLC
  text: וְ/הַ/נָּשִׂ֨יא אֲשֶׁר בְּ/תוֹכָ֜/ם אֶל כָּתֵ֤ף יִשָּׂא֙ בָּ/עֲלָטָ֣ה וְ/יֵצֵ֔א בַּ/קִּ֥יר יַחְתְּר֖וּ לְ/ה֣וֹצִיא ב֑/וֹ פָּנָ֣י/ו יְכַסֶּ֔ה יַ֗עַן אֲשֶׁ֨ר לֹא יִרְאֶ֥ה לַ/עַ֛יִן ה֖וּא אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/012.yaml
  text: And the prince who is among them will lift his baggage onto his shoulder in the dark and go out[a]. They will dig through the wall to bring him out through it[c][b]. He will cover his face so that he may not see the land with his eyes.
translation:
  language: pt
  text: O príncipe que está no meio deles levará sua bagagem[b] sobre o ombro, no escuro,[a] e sairá. Abrirão uma brecha na parede para fazê-lo sair por ela. Ele cobrirá o rosto para não ver a terra com os próprios olhos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na penumbra”. O termo hebraico pode indicar escuridão, luz fraca ou obscuridade, com a ideia de ocultação.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “erguerá/carregará sobre o ombro”. “Sua bagagem” é suprido com base no contexto imediato do sinal profético do exílio.'
    reason: cross_reference
  - marker: c
    text: 'Ou: “porque não verá a terra com os próprios olhos”. A expressão hebraica também pode ser entendida como causal, em vez de indicar finalidade ou resultado.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: Preserva o título político hebraico sem especificar além do texto com “rei”; no contexto, designa o governante que está em Jerusalém.
- source_word: בְּתוֹכָם
  choice: que está no meio deles
  rationale: Reproduz naturalmente a ideia relacional de estar entre o povo.
- source_word: אֶל כָּתֵף יִשָּׂא
  choice: porá sua bagagem sobre o ombro
  rationale: A expressão hebraica é literalmente “levantará sobre o ombro”. O objeto está implícito e é identificado pelo contexto imediato como a bagagem de exílio.
- source_word: בָּעֲלָטָה
  choice: no escuro
  rationale: O termo indica escuridão, penumbra ou obscuridade e, neste contexto, ressalta a saída furtiva.
- source_word: וְיֵצֵא
  choice: e sairá
  rationale: Tradução direta e natural do movimento físico expresso pelo verbo.
- source_word: בַּקִּיר יַחְתְּרוּ
  choice: Abrirão uma passagem na parede
  rationale: Comunica em português natural a ação concreta de escavar ou romper a parede para atravessá-la.
- source_word: לְהוֹצִיא בוֹ
  choice: para fazê-lo sair por ela
  rationale: O infinitivo causativo significa “fazer sair”; o pronome remete à passagem aberta na parede, e o objeto implícito é o príncipe.
- source_word: פָּנָיו יְכַסֶּה
  choice: Ele cobrirá o rosto
  rationale: Formulação direta e idiomática que conserva a ação física do hebraico.
- source_word: יַעַן אֲשֶׁר לֹא יִרְאֶה
  choice: para não ver
  rationale: No encadeamento da frase, a oração pode expressar a finalidade ou o resultado de cobrir o rosto; a possibilidade causal é preservada em nota.
- source_word: לַעַיִן
  choice: com os próprios olhos
  rationale: Expressa de modo natural o sentido corporal concreto de “com o olho”, explicitando que os olhos são os do príncipe.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se à terra que o governante deixará, não apenas ao solo físico.
theological_decisions:
- issue: Objeto implícito de אֶל כָּתֵף יִשָּׂא
  choice: Inserir “sua bagagem” no texto principal
  alternative: “levará sobre o ombro”, sem objeto expresso
  rationale: Embora o objeto não apareça neste versículo, o sinal profético dos versículos próximos menciona repetidamente a bagagem de exílio. A explicitação torna a frase compreensível sem acrescentar uma identificação estranha ao contexto.
- issue: Valor de יַעַן אֲשֶׁר na oração final
  choice: 'Finalidade ou resultado: “para não ver”'
  alternative: 'Causa: “porque não verá”'
  rationale: A sequência entre cobrir o rosto e não ver a terra favorece finalidade ou resultado, mas a construção hebraica também admite leitura causal; a nota mantém essa ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Evitou-se linguagem excessivamente arcaica. “Príncipe” mantém o título político do original; “abrirão uma passagem” torna natural a imagem concreta de romper ou escavar a parede. As notas preservam tanto o objeto suprido pelo contexto quanto as ambiguidades lexical e sintática do hebraico.
