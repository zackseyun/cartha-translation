  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por «o SENHOR»; alternativamente, «Yahweh».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética, a construção narrativa com היה é expressa naturalmente em português pelo verbo “vir”, tendo “a palavra de Yahweh” como sujeito; omite-se um “e” inicial desnecessário no começo isolado da unidade.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula דְבַר יְהוָה, “palavra” preserva a dimensão verbal e revelatória do hebraico sem a explicitação interpretativa de “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa de modo claro e atual a direção da revelação ao profeta.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula que introduz o discurso direto subsequente; os dois-pontos cumprem naturalmente essa função em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional “SENHOR”; “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. A formulação é formalmente próxima ao hebraico, mas natural para leitores brasileiros e amplamente compreensível no mundo lusófono.
