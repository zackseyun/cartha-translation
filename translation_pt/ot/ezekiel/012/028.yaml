  source_fidelity: A tradução preserva adequadamente a inferência de לָכֵן, o imperativo profético, o título composto אֲדֹנָי יְהוִה, a negação distributiva de כָּל־דְּבָרַי e a certeza de realização expressa em וְיֵעָשֶׂה. “Nenhuma das minhas palavras será mais adiada” comunica de modo fiel a ideia contextual de que nenhuma palavra divina continuará sendo postergada. “A palavra que eu disser se cumprirá” conserva o singular enfático/genérico de דָּבָר e a realização futura da palavra pronunciada.
