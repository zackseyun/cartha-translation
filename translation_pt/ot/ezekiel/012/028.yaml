reference: Ezekiel 12:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹא תִמָּשֵׁ֥ךְ ע֖וֹד כָּל דְּבָרָ֑/י אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/028.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: None of my words will be delayed any longer, but the word that I speak will be done,’ declares the Lord GOD.'
translation:
  language: pt
  text: 'Por isso, diga-lhes: “Assim diz o Senhor Yahweh: Nenhuma das minhas palavras será mais adiada[a]. A palavra que eu disser se cumprirá”, declara o Senhor Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se prolongará mais” ou “não será mais protelada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a conclusão decorrente do oráculo anterior e preserva a relação inferencial.
- source_word: אֱמֹר אֲלֵיהֶם
  choice: diga-lhes
  rationale: Reproduz o imperativo dirigido ao profeta e seu objeto de modo claro e corrente em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética tradicional, solene e ainda natural em português moderno.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa ambos os elementos do título hebraico e preserva o nome divino יהוה como Yahweh, sem fundi-los num único título.
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: não será mais adiada
  rationale: No contexto da alegação de que as profecias demoravam a cumprir-se, expressa com clareza a ideia de não haver mais demora, enquanto a nota registra o sentido mais literal de prolongamento.
- source_word: כָּל דְּבָרָי
  choice: Nenhuma das minhas palavras
  rationale: O hebraico traz literalmente 'todas as minhas palavras' sob negação; a formulação distributiva em português comunica naturalmente que palavra alguma ficará sujeita a demora.
- source_word: אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: A palavra que eu disser
  rationale: Preserva o substantivo singular enfático e o valor futuro ou eventual do imperfeito, com sintaxe natural em português.
- source_word: וְיֵעָשֶׂה
  choice: se cumprirá
  rationale: Comunica a realização efetiva da palavra profética; é mais idiomático em português neste contexto do que o formalmente próximo 'será feita'.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Reproduz a fórmula solene de confirmação profética sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O texto contém tanto אֲדֹנָי ('Senhor') quanto o nome יהוה. A tradução mantém os dois componentes e torna explícito o nome divino, sem acrescentar uma interpretação denominacional.
- issue: Natureza do cumprimento da palavra divina em וְיֵעָשֶׂה
  choice: se cumprirá
  alternative: será feita
  rationale: A escolha expressa que a palavra anunciada se tornará realidade, sem especificar mecanismo, agente secundário ou cronologia além da ausência de nova demora afirmada pelo texto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A fórmula profética foi preservada, e a ordem das afirmações acompanha de perto o hebraico sem produzir sintaxe artificial.
