base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/023.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: I will put an end to this proverb, and they will no longer use it as a proverb in Israel. But say to them, “The days have drawn near, and the word of every vision.”’'
translation:
  language: pt
  text: 'Portanto, diga-lhes: “Assim diz o Senhor Yahweh: Porei fim a este provérbio, e ele não voltará a ser usado como provérbio em Israel. Mas diga-lhes: Os dias se aproximaram, e a palavra[a] de toda visão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a realização” ou “o cumprimento de toda visão”. O hebraico diz literalmente “a palavra de toda visão”; no contexto, pode referir-se àquilo que cada visão anuncia e à sua efetivação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Conector inferencial natural que apresenta a consequência da declaração anterior.
- source_word: אֱמֹר אֲלֵיהֶם / דַּבֵּר אֲלֵיהֶם
  choice: diga-lhes
  rationale: Mantém, em português corrente, a ordem profética repetida no hebraico.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Preserva a fórmula profética e representa explicitamente o nome divino יהוה, evitando confundi-lo com o título אֲדֹנָי.
- source_word: הִשְׁבַּתִּי
  choice: Porei fim
  rationale: O hifil de שבת significa fazer cessar. O perfeito, dentro da declaração profética, anuncia como certa a cessação iminente do provérbio.
- source_word: הַמָּשָׁל הַזֶּה
  choice: este provérbio
  rationale: מָשָׁל designa aqui o dito popular citado no versículo anterior, não uma parábola narrativa.
- source_word: וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  choice: e ele não voltará a ser usado como provérbio em Israel
  rationale: O verbo משל significa aqui empregar ou proferir um provérbio, não governar. A construção passiva impessoal soa natural e mantém indefinidos os que o usavam.
- source_word: כִּי אִם
  choice: Mas
  rationale: Expressa de modo conciso o contraste entre o provérbio abolido e a nova declaração.
- source_word: קָרְבוּ הַיָּמִים
  choice: Os dias se aproximaram
  rationale: Reproduz o perfeito hebraico e a afirmação enfática de que o tempo anunciado já chegou perto.
- source_word: וּדְבַר כָּל חָזוֹן
  choice: bem como o cumprimento de toda visão
  rationale: דָּבָר pode significar palavra, assunto ou realidade. No contexto da alegação de que as visões demoravam, 'cumprimento' comunica sua concretização; a nota preserva a formulação literal e sua amplitude.
theological_decisions:
- issue: Representação de אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor / o Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e torna explícito o nome divino sem acrescentar uma interpretação denominacional.
- issue: Sentido de דְבַר em relação às visões
  choice: cumprimento
  alternative: palavra
  rationale: O contexto imediato contrapõe esta declaração ao provérbio segundo o qual as visões não se realizavam. 'Cumprimento' explicita essa referência contextual, enquanto a nota registra a tradução formal e a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “diga-lhes” conserva a estrutura profética. As aspas distinguem a ordem dada a Ezequiel, a fala divina e as declarações que ele deve transmitir.
