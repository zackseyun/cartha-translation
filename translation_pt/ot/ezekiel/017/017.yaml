  - severity: low
    issue: «quando se levantar uma rampa de cerco»
    rationale: Embora compreensível, «erguer uma rampa» é a colocação mais idiomática para uma obra construída; a formulação impessoal continua a não introduzir um agente que o hebraico não explicita.
