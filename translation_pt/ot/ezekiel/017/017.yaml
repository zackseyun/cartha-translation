base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/017.yaml
  text: Pharaoh will not act for him in the war with a great army and a large assembly[b][a], when they cast up a siege ramp and build a siege wall to cut off many lives.
translation:
  language: pt
  text: O faraó não agirá em favor dele na guerra com um grande exército e uma numerosa assembleia[a], quando se erguer uma rampa de cerco e se construir uma muralha de cerco[b], para matar muitas pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o ajudará na guerra com um grande exército e uma grande tropa”. A expressão hebraica traduzida por “agirá em favor dele” é condensada e pode indicar uma ação eficaz em seu benefício.'
    reason: lexical_alternative
  - marker: b
    text: Os termos de cerco também podem ser traduzidos por “aterro de cerco” e “obra de cerco” ou “torre de cerco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחַיִל גָּדוֹל
  choice: com um grande exército
  rationale: No contexto militar, חַיִל designa tropas ou força militar; “exército” é claro e natural em português.
- source_word: וּבְקָהָל רָב
  choice: e uma numerosa assembleia
  rationale: קָהָל significa literalmente uma reunião ou assembleia; aqui indica um grande corpo reunido em contexto militar, sem precisar sua composição.
- source_word: יַעֲשֶׂה אוֹתוֹ
  choice: não agirá em favor dele
  rationale: A expressão hebraica é condensada e idiomática. Esta tradução conserva a amplitude de עשה e comunica que o faraó não tomará ação efetiva em benefício dele.
- source_word: בַּמִּלְחָמָה
  choice: na guerra
  rationale: Reproduz naturalmente o substantivo singular definido e se ajusta ao contexto de campanha militar.
- source_word: בִּשְׁפֹּךְ סֹלְלָה
  choice: quando se levantar uma rampa de cerco
  rationale: שפך significa literalmente “derramar”, mas, com סֹלְלָה, descreve idiomaticamente o ajuntamento de terra para erguer uma rampa de cerco.
- source_word: וּבִבְנוֹת דָּיֵק
  choice: e se construir uma muralha de cerco
  rationale: דָּיֵק designa uma estrutura de cerco, cuja forma exata não é certa; “muralha de cerco” é legível e defensável.
- source_word: לְהַכְרִית נְפָשׁוֹת רַבּוֹת
  choice: para eliminar muitas vidas
  rationale: הכרית é literalmente “cortar, eliminar”, e נְפָשׁוֹת pode significar vidas ou pessoas. A formulação preserva a força do hebraico sem recorrer ao pouco natural “cortar vidas”.
