base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/006.yaml
  text: And it sprouted and became a spreading vine[a], low in stature, with its branches turned toward him and its roots beneath him[c][b]. So it became a vine and produced branches and sent out boughs.
translation:
  language: pt
  text: Ela brotou e se tornou uma videira que se espalhava[a], de baixa estatura, cujos ramos se voltavam para ele, enquanto suas raízes permaneciam debaixo dele[c]. Assim, tornou-se uma videira[b], produziu galhos e estendeu ramagens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma videira viçosa” ou “uma videira muito ramificada”.
    reason: lexical_alternative
  - marker: b
    text: A repetição de “tornou-se uma videira” reproduz a ênfase do hebraico.
    reason: lexical_alternative
  - marker: c
    text: Os pronomes “ele” e “dele” provavelmente se referem à grande águia da alegoria (ver Ezequiel 17:3–4), embora também possam ser traduzidos de modo mais impessoal.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּצְמַח
  choice: Ela brotou
  rationale: O verbo צמח descreve o surgimento inicial do crescimento; “brotou” preserva essa imagem de modo claro e natural.
- source_word: וַיְהִי לְגֶפֶן
  choice: se tornou uma videira
  rationale: A construção indica transformação ou resultado, não mera comparação.
- source_word: סֹרַחַת
  choice: que se espalhava
  rationale: O particípio sugere extensão lateral; a oração relativa soa natural em português e evita sugerir necessariamente exuberância.
- source_word: שִׁפְלַת קוֹמָה
  choice: de baixa estatura
  rationale: Reproduz de perto a expressão hebraica e mantém a descrição física e simbólica.
- source_word: לִפְנוֹת דָּלִיּוֹתָיו אֵלָיו
  choice: cujos ramos se voltavam para ele
  rationale: Preserva tanto a orientação dos ramos quanto o possível valor de resultado ou propósito da construção com infinitivo.
- source_word: וְשָׁרָשָׁיו תַּחְתָּיו יִהְיוּ
  choice: enquanto suas raízes permaneciam debaixo dele
  rationale: O imperfeito יִהְיוּ expressa a posição continuada das raízes; “permaneciam” torna esse aspecto explícito sem alterar a imagem.
- source_word: וַתְּהִי לְגֶפֶן
  choice: Assim, tornou-se uma videira
  rationale: Mantém a repetição do hebraico e marca a progressão do desenvolvimento da planta.
- source_word: וַתַּעַשׂ בַּדִּים
  choice: produziu galhos
  rationale: עשה com בדים descreve a produção de ramos; “galhos” distingue o termo do anterior sem impor uma diferença botânica rígida.
- source_word: וַתְּשַׁלַּח פֹּארוֹת
  choice: estendeu ramagens
  rationale: “Estendeu” preserva o movimento de שׁלח, e “ramagens” comunica o crescimento ramificado indicado por פֹּארוֹת sem reduzi-lo necessariamente a brotos novos.
- source_word: אֵלָיו / תַּחְתָּיו
  choice: ele / dele
  rationale: Os sufixos são masculinos singulares e provavelmente retomam a grande águia personificada na alegoria.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares na alegoria da videira
  choice: Traduzir pessoalmente como “ele/dele”, provavelmente em referência à grande águia
  alternative: Traduzir de modo impessoal como “ela/dela” ou relacionar as raízes ao lugar do plantio
  rationale: A forma hebraica é masculina singular, e a grande águia é o antecedente masculino saliente no contexto. A tradução pessoal preserva a personificação e a dependência política sugerida sem transformar a identificação provável em certeza absoluta.
- issue: Repetição de “tornou-se uma videira”
  choice: Conservar a repetição no texto principal
  alternative: Eliminar a segunda ocorrência como redundante
  rationale: A repetição pertence à estrutura hebraica e enfatiza o desenvolvimento e o resultado da ação dentro da alegoria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe conserva a progressão e a repetição do hebraico, enquanto as notas registram alternativas lexicais e a ambiguidade do referente pronominal.
