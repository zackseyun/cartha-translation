  text: וַ/יִּקַּח֙ מִ/זֶּ֣רַע הַ/מְּלוּכָ֔ה וַ/יִּכְרֹ֥ת אִתּ֖/וֹ בְּרִ֑ית וַ/יָּבֵ֤א אֹת/וֹ֙ בְּ/אָלָ֔ה וְ/אֶת אֵילֵ֥י הָ/אָ֖רֶץ לָקָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/013.yaml
  text: And he took one of the royal offspring and made a covenant with him[a], bringing him under an oath, and he took the mighty men of the land.
translation:
  language: pt
  text: Ele tomou um descendente da casa real, fez uma aliança com ele e o colocou sob juramento[a]. Também levou os homens poderosos da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob um juramento de maldição”; o termo hebraico pode indicar um juramento acompanhado de uma maldição para quem o quebrasse.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: um descendente da casa real
  rationale: זֶרַע, literalmente “semente”, designa descendência neste contexto; o מִן tem sentido partitivo, e הַמְּלוּכָה aponta para a realeza ou casa real. A formulação é clara e preserva a nuance dinástica.
- source_word: וַיִּכְרֹת אִתּוֹ בְּרִית
  choice: fez uma aliança com ele
  rationale: כרת ברית é a expressão idiomática usual para estabelecer uma aliança. “Fez uma aliança” mantém o peso solene e pactual sem reproduzir literalmente o verbo “cortar”.
- source_word: וַיָּבֵא אֹתוֹ בְּאָלָה
  choice: o colocou sob juramento
  rationale: A expressão indica que ele foi submetido a uma obrigação juramentada. אָלָה também pode incluir a sanção de maldição por violação, nuance preservada em nota.
- source_word: אֵילֵי הָאָרֶץ
  choice: os homens poderosos da terra
  rationale: אֵילִים, literalmente “carneiros”, é usado figuradamente para pessoas fortes, influentes ou nobres. A escolha preserva a ideia de poder e posição sem impor um cargo formal específico.
- source_word: לָקָח
  choice: levou
  rationale: Embora לָקַח tenha o sentido básico de “tomar”, no contexto da remoção das figuras poderosas do país, “levou” expressa naturalmente a ação sem intensificá-la para “capturou” ou “sequestrou”.
theological_decisions:
- issue: Terminologia político-pactual
  choice: aliança
  alternative: tratado
  rationale: בְּרִית é o termo hebraico normal para aliança. Embora o contexto seja político, o juramento subsequente reforça o caráter solene e vinculante, de modo que não convém reduzi-lo a um acordo meramente secular.
- issue: Nuance de אָלָה
  choice: juramento no texto principal, com a dimensão de maldição em nota
  alternative: maldição ou juramento de maldição diretamente no texto
  rationale: O termo pode reunir as ideias de juramento e da maldição decorrente de sua quebra. A tradução principal permanece clara, enquanto a nota conserva a amplitude e a tensão jurídica do hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa real” comunica a linhagem dinástica com mais naturalidade do que “semente real”, e “homens poderosos” conserva a força da expressão figurada hebraica.
