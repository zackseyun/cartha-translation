  text: וּ/פָרַשְׂתִּ֤י עָלָי/ו֙ רִשְׁתִּ֔/י וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וַ/הֲבִיאוֹתִ֣י/הוּ בָבֶ֗לָ/ה וְ/נִשְׁפַּטְתִּ֤י אִתּ/וֹ֙ שָׁ֔ם מַעֲל֖/וֹ אֲשֶׁ֥ר מָֽעַל בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/020.yaml
  text: I will spread my net over him[a], and he will be caught in my snare; then I will bring him to Babylon[b], and there I will enter into judgment with him for his treachery by which he acted treacherously against me.
translation:
  language: pt
  text: Estenderei sobre ele a minha rede, e ele será apanhado na minha armadilha. Então o levarei à Babilônia e ali entrarei em juízo com ele[a] por sua infidelidade, por ter sido infiel a mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ali o julgarei”. A expressão hebraica também pode ser traduzida de modo mais simples, mas “entrarei em juízo com ele” preserva sua nuance jurídica.'
    reason: lexical_alternative
  - marker: b
    text: “Infidelidade” também pode ser traduzida por “traição” ou “quebra de confiança”. O hebraico enfatiza a violação de um compromisso de aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: Estenderei
  rationale: O verbo פָרַשׂ descreve o ato de estender ou abrir uma rede. “Estenderei” preserva a imagem de caça e a ação divina na primeira pessoa.
- source_word: רִשְׁתִּי
  choice: a minha rede
  rationale: רֶשֶׁת é o termo comum para uma rede usada como meio de captura; a equivalência direta mantém a metáfora.
- source_word: וְנִתְפַּשׂ
  choice: ele será apanhado
  rationale: A forma passiva indica que ele será pego. “Apanhado” combina naturalmente com a imagem da rede e da armadilha.
- source_word: בִּמְצוּדָתִי
  choice: na minha armadilha
  rationale: Embora מְצוּדָה possa designar uma fortaleza em outros contextos, o paralelismo com “rede” e o verbo “apanhar” favorece claramente o sentido de armadilha.
- source_word: וַהֲבִיאוֹתִיהוּ
  choice: Então o levarei
  rationale: A tradução expressa de modo natural a progressão da captura para o transporte, preservando a ação causativa de Deus.
- source_word: בָבֶלָה
  choice: à Babilônia
  rationale: O ה direcional indica movimento em direção à Babilônia; “à Babilônia” é a formulação portuguesa natural.
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם
  choice: ali entrarei em juízo com ele
  rationale: A construção pode comunicar um confronto judicial, e não apenas a emissão de uma sentença. A formulação preserva a nuance jurídica e relacional do hebraico.
- source_word: מַעֲלוֹ
  choice: sua infidelidade
  rationale: מַעַל designa quebra de confiança ou de compromisso, muitas vezes em contexto de aliança. “Infidelidade” preserva essa dimensão sem restringir o sentido a uma categoria ritual.
- source_word: אֲשֶׁר מָעַל בִּי
  choice: por ter sido infiel a mim
  rationale: A repetição de substantivo e verbo cognatos no hebraico é refletida por “infidelidade” e “infiel”, mantendo a ênfase e deixando explícito que a ofensa foi contra Deus.
theological_decisions:
- issue: Natureza da ofensa expressa por מַעַל / מָעַל
  choice: “sua infidelidade, por ter sido infiel a mim”
  alternative: “sua traição, por ter agido traiçoeiramente contra mim”
  rationale: No contexto, a violação política de juramento e aliança é apresentada como uma ofensa contra Deus. “Infidelidade” conserva a dimensão pactual e relacional sem reduzir a expressão a pecado ritual nem tornar a linguagem excessivamente política.
- issue: Sentido judicial de וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: “entrarei em juízo com ele”
  alternative: “o julgarei”
  rationale: A construção hebraica admite a ideia de entrar em confronto ou processo judicial com alguém. A escolha mantém essa nuance jurídico-pactual, em vez de apresentar apenas o veredito final.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A repetição “infidelidade/infiel” é deliberada para representar a ênfase cognata do hebraico.
