  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הַ/נֶּ֤שֶׁר הַ/גָּדוֹל֙ גְּד֤וֹל הַ/כְּנָפַ֨יִם֙ אֶ֣רֶךְ הָ/אֵ֔בֶר מָלֵא֙ הַ/נּוֹצָ֔ה אֲשֶׁר ל֖/וֹ הָֽ/רִקְמָ֑ה בָּ֚א אֶל הַ/לְּבָנ֔וֹן וַ/יִּקַּ֖ח אֶת צַמֶּ֥רֶת הָ/אָֽרֶז־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: The great eagle, great in wings, long in pinions, full of plumage, which had variegated feathers, came to Lebanon and took the top of the cedar.’'
translation:
  language: pt
  text: 'e diga: “Assim diz o Senhor Yahweh: A grande águia, de grandes asas, de longas penas de voo, cheia de plumagem de cores variadas,[a] veio ao Líbano e tomou o topo do cedro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “que tinha trabalho bordado/variegado”; no contexto, a expressão provavelmente se refere a uma plumagem com padrões ou cores variadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: הַנֶּשֶׁר הַגָּדוֹל
  choice: A grande águia
  rationale: “Águia” é a designação tradicional e adequada, enquanto “grande” comunica tanto o porte quanto a imponência da figura alegórica.
- source_word: גְּדוֹל הַכְּנָפַיִם
  choice: de grandes asas
  rationale: Reproduz com naturalidade a descrição hebraica e conserva a ênfase no tamanho impressionante das asas.
- source_word: אֶרֶךְ הָאֵבֶר
  choice: longas penas de voo
  rationale: Neste contexto aviano, אֵבֶר se refere às penas longas das asas; “penas de voo” é claro e preciso em português corrente.
- source_word: מָלֵא הַנּוֹצָה
  choice: farta plumagem
  rationale: Expressa a abundância de penas de modo compacto, natural e compatível com o registro elevado da alegoria.
- source_word: אֲשֶׁר לוֹ הָרִקְמָה
  choice: de cores variadas
  rationale: רִקְמָה designa trabalho bordado ou variegado; aplicado à ave, sugere uma plumagem rica em padrões ou cores, sem exigir que se introduza literalmente a metáfora têxtil no corpo do texto.
- source_word: בָּא אֶל הַלְּבָנוֹן
  choice: veio ao Líbano
  rationale: Tradução direta e idiomática do movimento em direção ao lugar geográfico.
- source_word: וַיִּקַּח אֶת צַמֶּרֶת הָאָרֶז
  choice: e arrancou a copa do cedro
  rationale: צַמֶּרֶת é a parte superior ou copa da árvore. No contexto, “arrancou” comunica melhor que o simples “pegou” a retirada da copa, sem antecipar a interpretação da alegoria.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha distingue o título “Senhor” do nome próprio divino e torna visível ao leitor a presença do Tetragrama, sem resolver ou atenuar a formulação do texto hebraico.
- issue: Identidade alegórica da grande águia
  choice: Manter apenas a imagem da águia no versículo
  alternative: Explicitar no texto que ela representa o rei da Babilônia
  rationale: O próprio capítulo interpreta posteriormente a alegoria. Antecipar essa identificação aqui eliminaria a progressão retórica e a tensão do enigma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração descritiva preserva o ritmo solene do hebraico sem recorrer a termos excessivamente técnicos; “penas de voo” esclarece a imagem de אֵבֶר, e a nota conserva a metáfora têxtil e a ambiguidade de רִקְמָה.
