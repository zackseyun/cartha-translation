id: EZK.17.18
reference: Ezekiel 17:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָזָ֥ה אָלָ֖ה לְ/הָפֵ֣ר בְּרִ֑ית וְ/הִנֵּ֨ה נָתַ֥ן יָד֛/וֹ וְ/כָל אֵ֥לֶּה עָשָׂ֖ה לֹ֥א יִמָּלֵֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/018.yaml
  text: He despised the oath by breaking the covenant[a]; behold, he had given his hand, yet did all these things[b]. He will not escape.
translation:
  language: pt
  text: Ele desprezou o juramento[a] ao romper a aliança. Eis que havia dado a mão[b], mas fez todas essas coisas. Não escapará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a maldição”; o termo hebraico pode indicar um juramento acompanhado de uma sanção de maldição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “deu a sua mão”, expressão que indica assumir um compromisso ou confirmar um acordo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזָה
  choice: Ele desprezou
  rationale: O verbo בזה expressa desprezo ou tratamento com desdém; “desprezou” conserva de modo claro e conciso a força moral da acusação.
- source_word: אָלָה
  choice: o juramento
  rationale: No contexto de uma aliança, אָלָה pode designar um juramento que inclui sanções de maldição. “Juramento” se ajusta ao paralelismo com “aliança”, enquanto a nuance de maldição é preservada em nota.
- source_word: לְהָפֵר בְּרִית
  choice: ao romper a aliança
  rationale: A construção liga o desprezo pelo juramento à violação da aliança. “Ao romper” expressa naturalmente em português essa relação de modo ou circunstância sem torná-la mais específica do que o hebraico.
- source_word: בְּרִית
  choice: a aliança
  rationale: Embora o contexto imediato seja um tratado político, “aliança” preserva o termo bíblico padrão e seu peso moral e teológico.
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Mantém a função enfática de הִנֵּה, chamando atenção para a gravidade da ação seguinte.
- source_word: נָתַן יָדוֹ
  choice: havia dado a mão
  rationale: Conserva a imagem concreta do idioma hebraico, no qual dar a mão representa assumir um compromisso ou confirmar um acordo; a nota esclarece o sentido.
- source_word: וְכָל אֵלֶּה עָשָׂה
  choice: mas fez todas essas coisas
  rationale: “Mas” torna explícito o contraste contextual entre o compromisso assumido e as ações posteriores, sem alterar o conteúdo da oração.
- source_word: לֹא יִמָּלֵט
  choice: Não escapará
  rationale: O Nifal de מלט indica aqui não escapar do juízo; a formulação portuguesa é direta e natural.
theological_decisions:
- issue: Terminologia político-pactual
  choice: Manter “juramento” e “aliança”
  alternative: Traduzir אָלָה por “maldição” e בְּרִית por “tratado” ou “acordo”
  rationale: A passagem condena uma traição política em linguagem que também possui peso pactual e moral diante de Deus. “Juramento” e “aliança” preservam essa dimensão sem transformar o contexto em algo exclusivamente religioso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a ênfase de “Eis que” e a imagem hebraica de dar a mão, esclarecida em nota.
