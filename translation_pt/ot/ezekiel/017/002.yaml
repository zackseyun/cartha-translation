  text: Son of man[b][a], pose a riddle and speak a parable to the house of Israel.
translation:
  language: pt
  text: Filho do homem[a], proponha um enigma e conte uma parábola[b] à casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mortal” ou “Ser humano”. A expressão hebraica “filho do homem” é mantida aqui por ser a forma recorrente de tratamento dirigida a Ezequiel.
    reason: lexical_alternative
  - marker: b
    text: Ou “provérbio”. O hebraico mashal pode designar um provérbio, uma parábola ou um dito figurado; aqui, o discurso figurado extenso favorece “parábola”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a expressão hebraica e a forma recorrente de tratamento dirigida a Ezequiel, sem lhe atribuir aqui sentido cristológico.
- source_word: חוּד חִידָה
  choice: proponha um enigma
  rationale: Reproduz com naturalidade a ordem de apresentar uma formulação enigmática, evitando uma construção portuguesa excessivamente literal.
- source_word: וּמְשֹׁל מָשָׁל
  choice: e conte uma parábola
  rationale: O verbo e o substantivo cognatos descrevem a apresentação de um mashal; em português, “conte uma parábola” é corrente e adequado ao discurso figurado extenso que vem a seguir.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: à casa de Israel
  rationale: Mantém a expressão nacional e pactual “casa de Israel”, enquanto a preposição indica os destinatários da mensagem.
theological_decisions:
- issue: Sentido do vocativo בֶּן אָדָם em Ezequiel
  choice: Filho do homem
  alternative: Mortal; ser humano
  rationale: Neste contexto, a expressão é o tratamento profético recorrente dado a Ezequiel, não um título cristológico. A tradução tradicional conserva o idioma e a textura literária do livro, enquanto a nota registra alternativas sem resolver além do que o hebraico permite.
- issue: Classificação de מָשָׁל
  choice: parábola
  alternative: provérbio; dito figurado
  rationale: O termo hebraico tem amplitude semântica, mas o discurso figurado desenvolvido nos versículos seguintes favorece “parábola”; a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto para leitores brasileiros como para um público lusófono amplo. O imperativo “proponha” comunica claramente a ordem; “conte uma parábola” evita reproduzir de modo rígido a construção cognata hebraica.
