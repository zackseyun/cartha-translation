revisions:
- from: Havia outra grande águia, de grandes asas e rica plumagem[a]. E eis que essa videira voltou suas raízes para ela e estendeu seus ramos em sua direção, para que ela a regasse, desde os canteiros em que estava plantada[b].
  to: Havia outra grande águia, de grandes asas e rica plumagem[a]. E eis que essa videira voltou suas raízes para ela e estendeu seus ramos em sua direção, para que a águia a regasse a partir dos canteiros de sua plantação[b].
  rationale: A revisão substitui a construção pouco idiomática “desde os canteiros” por uma expressão portuguesa clara que reflete a ligação sintática mais direta entre “regar” e “dos canteiros de sua plantação”. A nota foi limitada a uma alternativa de redação semanticamente compatível, sem apresentar como leitura textual explícita a noção de afastamento.
