base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/007.yaml
  text: And there was another great eagle with great wings and much plumage[a]; and behold, this vine bent its roots toward him and sent out its branches to him[d][c][b], that he might water it from the beds where it was planted.
translation:
  language: pt
  text: Havia outra grande águia, de grandes asas e rica plumagem[a]. E eis que essa videira voltou suas raízes para ela e estendeu seus ramos em sua direção, para que a águia a regasse a partir dos canteiros de sua plantação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abutre”. O termo hebraico pode designar uma grande ave de rapina, embora “águia” se ajuste melhor à imagem desta alegoria.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que a águia a regasse dos canteiros onde estava plantada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶשֶׁר
  choice: águia
  rationale: É a tradução convencional e contextualmente adequada à imagem régia e imperial da alegoria; o termo hebraico também pode designar, de modo mais amplo, uma grande ave de rapina.
- source_word: גָּדוֹל גְּדֹל כְּנָפַיִם
  choice: grande águia, de grandes asas
  rationale: Preserva a repetição enfática de גָּדוֹל em português natural e solene.
- source_word: רַב נוֹצָה
  choice: rica plumagem
  rationale: Expressa naturalmente a abundância de penas indicada pelo hebraico.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém a mudança vívida introduzida pelo marcador discursivo.
- source_word: כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו
  choice: voltou suas raízes para ela
  rationale: Comunica a orientação deliberada das raízes em direção à segunda águia; o pronome feminino concorda naturalmente com “águia” em português.
- source_word: דָלִיּוֹתָיו שִׁלְחָה לּוֹ
  choice: estendeu seus ramos em sua direção
  rationale: Reproduz a imagem da videira projetando seu crescimento para a águia, sem imitar a irregularidade de gênero do sufixo massorético.
- source_word: לְהַשְׁקוֹת אֹתָהּ
  choice: para que ela a regasse
  rationale: Torna explícito o valor de finalidade do infinitivo e conserva a águia como sujeito implícito; os dois pronomes femininos têm referentes recuperáveis no contexto.
- source_word: מֵעֲרֻגוֹת מַטָּעָהּ
  choice: desde os canteiros em que estava plantada
  rationale: “Canteiros” preserva a imagem agrícola; “desde” mantém aberta a relação sintática da expressão, que pode indicar o lugar da plantação ou o ponto do qual a videira se volta.
theological_decisions:
- issue: Relação sintática de מֵעֲרֻגוֹת מַטָּעָהּ
  choice: desde os canteiros em que estava plantada
  alternative: afastando-se dos canteiros em que estava plantada / para regá-la a partir dos canteiros de sua plantação
  rationale: A construção hebraica admite discussão sobre se a expressão indica o ponto de onde a videira se inclina ou a origem/local associado à rega. O texto principal evita resolver de modo categórico essa tensão, e a nota registra as leituras principais.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantiveram-se a vividez de “eis que”, a personificação da videira e a ambiguidade da frase final, sem acrescentar uma interpretação doutrinária.
