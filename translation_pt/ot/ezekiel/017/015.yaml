source:
  edition: WLC
  text: וַ/יִּמְרָד בּ֗/וֹ לִ/שְׁלֹ֤חַ מַלְאָכָי/ו֙ מִצְרַ֔יִם לָֽ/תֶת ל֥/וֹ סוּסִ֖ים וְ/עַם רָ֑ב הֲ/יִצְלָ֤ח הֲ/יִמָּלֵט֙ הָ/עֹשֵׂ֣ה אֵ֔לֶּה וְ/הֵפֵ֥ר בְּרִ֖ית וְ/נִמְלָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/015.yaml
  text: But he rebelled against him by sending his messengers to Egypt[a], that they might give him horses and many people. Will he prosper? Will he escape[b], who does these things? Can he break a covenant and yet escape?
translation:
  language: pt
  text: Mas ele se rebelou contra ele, enviando seus mensageiros ao Egito para lhe dar cavalos e muita gente[a]. Será que terá sucesso? Escapará aquele que faz essas coisas? Poderá romper uma aliança[b] e ainda escapar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cavalos e um grande exército” / “cavalos e muitas tropas”. O hebraico diz literalmente “cavalos e muita gente”; no contexto, a expressão se refere ao apoio militar do Egito.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “violar uma aliança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְרָד בּוֹ
  choice: ele se rebelou contra ele
  rationale: מרד indica rebelião contra um soberano. A formulação mantém o referente pronominal do hebraico sem substituir o pronome por uma identificação interpretativa.
- source_word: לִשְׁלֹחַ מַלְאָכָיו
  choice: enviando seus mensageiros
  rationale: מַלְאָכִים pode designar mensageiros, enviados ou embaixadores. “Mensageiros” preserva a amplitude lexical, enquanto o contexto deixa clara a missão diplomática.
- source_word: מִצְרַיִם
  choice: ao Egito
  rationale: Forma portuguesa corrente do topônimo; a preposição expressa naturalmente o destino dos mensageiros.
- source_word: לָתֶת לוֹ סוּסִים וְעַם רָב
  choice: para que lhe dessem cavalos e muita gente
  rationale: A oração expressa a finalidade da missão. “Muita gente” conserva o sentido literal de עַם רָב, sem ocultar que, no contexto, se trata de apoio militar.
- source_word: הֲיִצְלָח
  choice: Será que terá sucesso?
  rationale: צלח pergunta pelo êxito da rebelião. “Ter sucesso” é natural no português atual e mantém o foco no resultado.
- source_word: הֲיִמָּלֵט הָעֹשֵׂה אֵלֶּה
  choice: Escapará aquele que faz essas coisas?
  rationale: A formulação preserva a pergunta retórica, o particípio substantivado singular e o sentido de escapar de consequências ou perigo.
- source_word: וְהֵפֵר בְּרִית
  choice: Poderá romper uma aliança
  rationale: הפר ברית significa romper ou violar uma aliança. “Romper” é idiomático e conserva o peso moral do ato; o indefinido acompanha a ausência de artigo no hebraico.
- source_word: וְנִמְלָט
  choice: e ainda escapar
  rationale: A repetição de נמלט é mantida, e “ainda” comunica a incredulidade retórica da pergunta final sem alterar seu conteúdo.
theological_decisions:
- issue: Natureza do acordo político designado por בְּרִית
  choice: aliança
  alternative: tratado; acordo
  rationale: Embora o contexto seja político e internacional, בְּרִית possui peso pactual e moral em Ezequiel. “Aliança” preserva essa dimensão sem restringir o termo a um tratado meramente secular.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. As perguntas retóricas foram preservadas, bem como a repetição de “escapar”. O pronome em “contra ele” mantém a referência contextual sem explicitação interpretativa; as alternativas militares para עַם רָב ficam em nota.
