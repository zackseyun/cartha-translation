- from: Mas ele se rebelou contra ele, enviando seus mensageiros ao Egito para que lhe dessem cavalos e muita gente[a]. Será que terá sucesso? Escapará aquele que faz essas coisas? Poderá romper uma aliança[b] e ainda escapar?
  to: Mas ele se rebelou contra ele, enviando seus mensageiros ao Egito para lhe dar cavalos e muita gente[a]. Será que terá sucesso? Escapará aquele que faz essas coisas? Poderá romper uma aliança[b] e ainda escapar?
  rationale: A única alteração substitui a oração final com subjuntivo por um infinitivo de finalidade. Isso evita atribuir explicitamente aos mensageiros a ação de dar o auxílio e reflete de modo mais direto a construção hebraica לָתֶת לוֹ, mantendo o sentido e a ambiguidade do agente fornecedor.
