base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/010.yaml
  text: And look[a], though it is planted[c][b], will it prosper? Will it not completely wither when the east wind touches it? It will wither on the beds where it sprouted.
translation:
  language: pt
  text: E eis que, mesmo plantada, será que prosperará? Não secará por completo[a] quando o vento do leste[b] a tocar? Secará nos canteiros onde brotou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certamente secará” ou “secará totalmente”; o hebraico combina o infinitivo absoluto com o verbo conjugado para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: O “vento do leste” é o vento quente e destrutivo vindo do deserto oriental, uma imagem frequente de devastação e juízo.
    reason: cultural_note
  - marker: c
    text: Ou “nos canteiros do seu crescimento”; a expressão hebraica refere-se às parcelas cultivadas onde a planta havia crescido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 'E veja:'
  rationale: Conserva a função de chamar a atenção, com linguagem atual e digna, sem o ar arcaico de “eis que”.
- source_word: שְׁתוּלָה
  choice: mesmo plantada
  rationale: O particípio passivo feminino descreve a videira já posta no solo; “plantada” mantém a imagem agrícola, e “mesmo” expressa naturalmente a tensão contextual da pergunta sem determinar além do texto.
- source_word: הֲתִצְלָח
  choice: será que prosperará?
  rationale: צלח denota êxito ou prosperidade; aplicado à planta, “prosperará” preserva tanto o crescimento quanto o sentido figurado de sucesso.
- source_word: כְגַעַת בָּהּ
  choice: quando ... a tocar
  rationale: O infinitivo construto com כ indica a ocasião do contato. A formulação mantém a imagem do vento tocando a planta e soa natural em português.
- source_word: רוּחַ הַקָּדִים
  choice: o vento do leste
  rationale: É a designação do vento quente e destrutivo vindo do deserto oriental; “vento do leste” é claro e amplamente compreensível.
- source_word: תִּיבַשׁ יָבֹשׁ
  choice: secará por completo
  rationale: A combinação do verbo finito com o infinitivo absoluto intensifica a ação. “Por completo” comunica a ênfase sem tornar a expressão artificial.
- source_word: עַל עֲרֻגֹת צִמְחָהּ
  choice: nos canteiros onde brotou
  rationale: עֲרֻגוֹת são canteiros ou parcelas cultivadas, e צִמְחָהּ refere-se ao crescimento ou brotar da planta. A tradução ressalta que ela seca no próprio lugar em que se desenvolveu.
- source_word: תִּיבָשׁ
  choice: Secará
  rationale: A repetição final reafirma o resultado e mantém a coerência com a ocorrência enfática anterior de יבש.
