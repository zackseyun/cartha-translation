  text: It was planted in a good field by abundant waters[a], to produce branches and bear fruit[b], to become a majestic vine.
translation:
  language: pt
  text: Ela foi plantada em um bom campo, junto a águas abundantes[a], para produzir ramos, dar fruto e tornar-se uma videira majestosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto a muitas águas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma videira esplêndida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂדֶה טּוֹב
  choice: um bom campo
  rationale: שָׂדֶה designa normalmente um campo. A formulação preserva a imagem agrícola concreta sem explicitar, de modo interpretativo, a fertilidade do solo.
- source_word: אֶל מַיִם רַבִּים
  choice: junto a águas abundantes
  rationale: No contexto do plantio, אֶל indica localização ou proximidade, e מַיִם רַבִּים descreve uma provisão copiosa de água. A expressão é natural em português e mantém a imagem do hebraico.
- source_word: שְׁתוּלָה
  choice: estava plantada
  rationale: O particípio passivo feminino descreve o estado da videira como plantada. Não se emprega “transplantada”, pois isso acrescentaria uma especificidade que o termo, isoladamente, não exige.
- source_word: לַעֲשׂוֹת עָנָף
  choice: para produzir ramos
  rationale: O infinitivo expressa propósito ou resultado pretendido. “Produzir ramos” comunica de maneira clara e atual o sentido botânico de עָנָף.
- source_word: וְלָשֵׂאת פֶּרִי
  choice: e dar fruto
  rationale: נשא com פֶּרִי é uma expressão idiomática para frutificar. “Dar fruto” é a equivalência corrente e natural em português.
- source_word: לִהְיוֹת לְגֶפֶן אַדָּרֶת
  choice: tornando-se uma videira majestosa
  rationale: אַדָּרֶת comunica magnificência ou esplendor. “Majestosa” preserva o tom elevado sem soar arcaico; o gerúndio liga naturalmente este resultado aos propósitos anteriores.
