  text: וְ/אֵ֨ת כָּל מברח/ו בְּ/כָל אֲגַפָּי/ו֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/הַ/נִּשְׁאָרִ֖ים לְ/כָל ר֣וּחַ יִפָּרֵ֑שׂוּ וִ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/021.yaml
  text: And all his fugitives among all his troops will fall by the sword[a], and those who remain will be scattered to every wind. Then you will know that I, Yahweh[b], have spoken.
translation:
  language: pt
  text: Todos os seus fugitivos[a], entre todas as suas tropas[b], cairão à espada, e os que restarem serão espalhados a todos os ventos. Então vocês saberão que eu, Yahweh, falei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus fugitivos”; algumas versões antigas e traduções entendem o termo como “seus homens escolhidos” ou expressão semelhante.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “suas asas”, imagem militar hebraica para alas, divisões ou tropas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מברחו
  choice: seus fugitivos
  rationale: A forma hebraica é entendida mais naturalmente a partir da raiz ברח, “fugir”, indicando os que fogem ou tentam escapar. A nota preserva a leitura alternativa atestada em versões antigas.
- source_word: אֲגַפָּיו
  choice: suas tropas
  rationale: Literalmente, “suas asas”; no contexto militar, a imagem designa alas, divisões ou contingentes. “Tropas” comunica com clareza o sentido contextual.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Expressão portuguesa consagrada e natural para morte por arma em contexto de guerra ou juízo.
- source_word: הַנִּשְׁאָרִים
  choice: os que restarem
  rationale: Designa os sobreviventes após a queda, sem introduzir a conotação teológica positiva que “remanescente” poderia sugerir.
- source_word: לְכָל רוּחַ
  choice: a todos os ventos
  rationale: Preserva a imagem hebraica vívida de dispersão em todas as direções.
- source_word: יִפָּרֵשׂוּ
  choice: serão espalhados
  rationale: O nifal expressa dispersão sofrida pelos sobreviventes; a forma passiva é clara e apropriada ao contexto de juízo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: Mantém a força direta e solene da fórmula profética divina em português natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem o substituir por um título.
- issue: Sentido de הַנִּשְׁאָרִים
  choice: os que restarem
  alternative: o remanescente; os sobreviventes
  rationale: Neste contexto de juízo, a expressão se refere simplesmente aos que ficarem vivos e depois forem dispersos; evita-se atribuir ao grupo a noção de um remanescente fiel.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais no Brasil. Conserva-se a imagem “a todos os ventos” e a fórmula profética direta. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
