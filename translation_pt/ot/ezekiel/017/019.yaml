id: EZK.17.19
reference: Ezekiel 17:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֗א אָֽלָתִ/י֙ אֲשֶׁ֣ר בָּזָ֔ה וּ/בְרִיתִ֖/י אֲשֶׁ֣ר הֵפִ֑יר וּ/נְתַתִּ֖י/ו בְּ/רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/019.yaml
  text: 'Therefore thus says the Lord GOD: As I live[a], surely my oath that he despised and my covenant that he broke—I will place them on his own head.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: Tão certo como eu vivo, juro que farei recair sobre a cabeça dele o meu juramento[a], que ele desprezou, e a minha aliança, que ele quebrou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha maldição”; o termo hebraico pode indicar um juramento que inclui uma maldição para quem o violar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a conclusão judicial decorrente da acusação anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional em registro digno e compreensível.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico e conserva Yahweh como nome divino.
- source_word: חַי אָנִי ... אִם לֹא
  choice: Tão certo como eu vivo, juro que
  rationale: Expressa em português natural a fórmula solene de autojuramento e a asseveração enfática hebraica.
- source_word: אָלָתִי
  choice: o meu juramento
  rationale: O contexto destaca o compromisso jurado que foi desprezado; a possível conotação de maldição fica indicada em nota.
- source_word: בָּזָה
  choice: desprezou
  rationale: Comunica de modo direto a rejeição deliberada e desdenhosa.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: Mantém o termo bíblico usual e a afirmação divina de posse sobre o pacto firmado sob sua sanção.
- source_word: הֵפִיר
  choice: quebrou
  rationale: Equivalente claro e corrente para a violação de uma aliança.
- source_word: וּנְתַתִּיו בְּרֹאשׁוֹ
  choice: farei recair sobre a cabeça dele
  rationale: Reproduz a metáfora de fazer a responsabilidade e suas consequências voltarem sobre o infrator, sem impor um objeto plural que o sufixo hebraico masculino singular não explicita.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor; o Senhor DEUS
  rationale: A tradução conserva tanto o título אֲדֹנָי quanto o nome da aliança יְהוִה, evitando fundi-los ou duplicar 'Senhor'.
- issue: Sentido de אָלָה
  choice: o meu juramento
  alternative: a minha maldição
  rationale: A obrigação jurada ocupa o primeiro plano no contexto, mas o termo pode designar um juramento acompanhado de maldição em caso de violação; essa tensão lexical é preservada em nota.
- issue: Objeto singular de וּנְתַתִּיו
  choice: construção idiomática que faz recair a responsabilidade sobre ele
  alternative: eu os porei sobre a cabeça dele
  rationale: O hebraico emprega sufixo masculino singular, possivelmente retomando o juramento ou a culpa/consequência do ato. A formulação portuguesa evita alterar explicitamente o número e mantém a abrangência contextual.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A fórmula de juramento foi vertida idiomaticamente, e a imagem de algo recair sobre a cabeça do culpado foi preservada.
