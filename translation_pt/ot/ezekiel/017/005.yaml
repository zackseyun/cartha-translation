base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/005.yaml
  text: Then he took some of the seed of the land and planted it in fertile soil[a]; he placed it beside abundant waters, like a willow.
translation:
  language: pt
  text: Então ele pegou uma parte da semente da terra e a plantou em solo fértil; colocou-a junto a águas abundantes, como um salgueiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como um álamo»; a identificação da planta hebraica צַפְצָפָה é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הָאָרֶץ
  choice: uma parte da semente da terra
  rationale: Preserva o sentido partitivo de מִן e a imagem agrícola literal de זֶרַע no contexto da alegoria.
- source_word: וַיִּתְּנֵהוּ
  choice: a plantou
  rationale: Embora נתן signifique basicamente pôr ou colocar, o contexto de campo e semeadura favorece o português idiomático «plantou», sem perder a imagem.
- source_word: בִּשְׂדֵה זָרַע קָח
  choice: em solo fértil
  rationale: Representa de modo natural a expressão difícil, literalmente relacionada a campo de semeadura e a algo escolhido ou apropriado para cultivo.
- source_word: עַל מַיִם רַבִּים
  choice: junto a águas abundantes
  rationale: עַל pode indicar proximidade neste contexto; a formulação conserva a imagem de irrigação farta.
- source_word: צַפְצָפָה
  choice: salgueiro
  rationale: É uma identificação contextualmente adequada para a planta associada à água, embora o termo hebraico seja incerto.
- source_word: שָׂמוֹ
  choice: colocou-a
  rationale: Traduz o sentido básico de שׂים, «pôr/colocar», mantendo coerente a ação de dispor a planta junto às águas.
