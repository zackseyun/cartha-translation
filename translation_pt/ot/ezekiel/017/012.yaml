base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/012.yaml
  text: Say now to the rebellious house[a], ‘Do you not know what these things mean?’ Say, ‘Behold[c][b], the king of Babylon came to Jerusalem and took its king and its officials and brought them to him in Babylon.’
translation:
  language: pt
  text: 'Diga agora à casa rebelde: “Vocês não sabem o que significam essas coisas?[a]” Diga: “Eis que o rei da Babilônia veio a Jerusalém, tomou o seu rei e as suas autoridades[b] e os levou para a Babilônia, para junto dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que são essas coisas?” No contexto, a pergunta provavelmente se refere ao significado da alegoria.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “príncipes” ou “líderes”. O termo hebraico pode designar autoridades reais ou governamentais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַמֶּרִי
  choice: casa rebelde
  rationale: Preserva a metáfora coletiva e a expressão recorrente de Ezequiel, ao mesmo tempo que verte o genitivo hebraico de maneira natural em português.
- source_word: הֲלֹא יְדַעְתֶּם
  choice: Vocês não sabem
  rationale: Mantém o valor básico de ידע e a força da pergunta retórica; “vocês” explicita naturalmente o plural em português moderno.
- source_word: מָה אֵלֶּה
  choice: o que significam essas coisas
  rationale: No contexto, a pergunta trata do sentido da alegoria anterior. “Significam” torna explícita essa referência pragmática sem eliminar a tradução mais literal, registrada em nota.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a função de chamar a atenção para a explicação e oferece um registro bíblico digno, ainda compreensível em português atual.
- source_word: בָּא
  choice: veio
  rationale: O passado simples apresenta naturalmente em português o acontecimento histórico descrito pelo perfeito hebraico.
- source_word: מַלְכָּהּ
  choice: o rei dela
  rationale: O sufixo feminino remete a Jerusalém. “Dela” deixa clara essa referência sem personificar poeticamente a cidade.
- source_word: שָׂרֶיהָ
  choice: os seus oficiais
  rationale: שׂרים designa aqui membros da elite governante; “oficiais” evita restringir o termo a filhos ou membros da família real.
- source_word: וַיְבֵא אוֹתָם אֵלָיו בָּבֶלָה
  choice: os levou para junto de si, para a Babilônia
  rationale: “Para junto de si” representa אֵלָיו, cujo referente é o rei da Babilônia, e “para a Babilônia” preserva explicitamente a direção indicada pela terminação locativa-direcional de בָּבֶלָה.
theological_decisions: []
