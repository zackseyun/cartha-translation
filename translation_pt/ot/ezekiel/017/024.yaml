  text: וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/024.yaml
  text: 'And all the trees of the field shall know that I am Yahweh: I have brought low the high tree[a], I have raised up the low tree, I have dried up the green tree, and I have made the dry tree flourish. I am Yahweh; I have spoken[b], and I have done it.'
translation:
  language: pt
  text: 'E todas as árvores do campo saberão que eu sou Yahweh: rebaixei a árvore alta e elevei a árvore baixa; sequei a árvore viçosa[a] e fiz a árvore seca florescer[b]. Eu, Yahweh, falei e fiz isso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fresca” ou “úmida”. O adjetivo hebraico designa literalmente frescor ou umidade e, aplicado a uma árvore, sugere vitalidade.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fiz a árvore seca brotar” ou “fiz a árvore seca dar flores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: saberão
  rationale: O perfeito com conjunção, no discurso profético, apresenta o resultado futuro e certo das ações anunciadas.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: todas as árvores do campo
  rationale: Mantém diretamente a imagem arbórea e sua função metafórica, sem explicitar no texto os possíveis referentes políticos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הִשְׁפַּלְתִּי עֵץ גָּבֹהַ
  choice: rebaixei a árvore alta
  rationale: O causativo indica fazer descer ou tornar baixa; “rebaixei” conserva o contraste com a elevação sem acrescentar necessariamente uma ideia moral de humilhação.
- source_word: הִגְבַּהְתִּי עֵץ שָׁפָל
  choice: elevei a árvore baixa
  rationale: Preserva o paralelismo antitético entre alta/baixa e rebaixar/elevar.
- source_word: הוֹבַשְׁתִּי עֵץ לָח
  choice: sequei a árvore viçosa
  rationale: “Sequei” expressa o causativo; “viçosa” comunica em português uma árvore viva e cheia de vigor, enquanto a nota registra o sentido literal de umidade ou frescor.
- source_word: וְהִפְרַחְתִּי עֵץ יָבֵשׁ
  choice: fiz a árvore seca florescer
  rationale: O causativo de פרח pode indicar fazer brotar, florescer ou vicejar; “florescer” mantém a reversão da morte aparente para a vitalidade.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: falei e farei isso
  rationale: No encerramento da promessa profética, o primeiro verbo afirma a palavra já pronunciada e o segundo apresenta sua realização certa. A nota preserva a possibilidade de representar mais literalmente a forma perfeita como ação já cumprida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Javé
  rationale: O hebraico emprega diretamente o nome pessoal divino. A transliteração preserva essa distinção em relação a títulos.
- issue: Alcance metafórico das árvores
  choice: Preservar a metáfora sem identificar explicitamente as árvores com reis, governantes ou nações
  alternative: Explicitar os referentes políticos na tradução
  rationale: Embora o contexto oriente a interpretação, o versículo formula a mensagem por meio da imagem das árvores; explicá-la no corpo do texto reduziria sua amplitude e anteciparia a interpretação.
- issue: Valor temporal dos perfeitos proféticos
  choice: Usar o passado nas reversões contempladas como certas e o futuro em “farei isso”
  alternative: Traduzir toda a sequência como passado concluído ou como futuro
  rationale: A formulação permite que as árvores, no resultado futuro, reconheçam ações divinas apresentadas como certas. O fechamento natural em português distingue a palavra já pronunciada de seu cumprimento assegurado, e a nota registra a leitura formal alternativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e paralelismo preservado. “Viçosa” é corrente e natural na imagem vegetal; as alternativas mais literais ficam em nota. A pontuação destaca as duas reversões paralelas e a declaração conclusiva de Yahweh.
