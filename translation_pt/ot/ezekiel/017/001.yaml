  language: en
  yaml_path: translation/ot/ezekiel/017/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'A palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «E aconteceu: a palavra de Yahweh veio a mim, dizendo».'
    reason: Registra a forma mais literal de וַיְהִי e a estrutura da fórmula hebraica, que foram vertidas de modo mais natural no texto principal.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A construção narrativa וַיְהִי introduz o acontecimento. Em português, incorporá-la ao verbo «veio» preserva a progressão do discurso sem o peso pouco natural de «e aconteceu que».
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética, דָּבָר designa a palavra ou mensagem divina. «A palavra» conserva o idioma profético tradicional e sua ligação com a revelação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com o sufixo da primeira pessoa singular e soa natural na fórmula «veio a mim».
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala direta que segue. «Dizendo» mantém de forma concisa e transparente a fórmula profética hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal da aliança sem substituí-lo por um título; «Jeová» reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a fórmula profética «a palavra de Yahweh veio a mim» e o particípio introdutório «dizendo», sem arcaísmos.
