source:
  edition: WLC
  text: בְּ/הַ֨ר מְר֤וֹם יִשְׂרָאֵל֙ אֶשְׁתֳּלֶ֔/נּוּ וְ/נָשָׂ֤א עָנָף֙ וְ/עָ֣שָׂה פֶ֔רִי וְ/הָיָ֖ה לְ/אֶ֣רֶז אַדִּ֑יר וְ/שָׁכְנ֣וּ תַחְתָּ֗י/ו כֹּ֚ל צִפּ֣וֹר כָּל כָּנָ֔ף בְּ/צֵ֥ל דָּלִיּוֹתָ֖י/ו תִּשְׁכֹּֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/023.yaml
  text: On the high mountain of Israel I will plant it[a], and it will put forth branches and bear fruit and become a majestic cedar. Under it every bird of every wing will dwell[b]; in the shade of its boughs they will dwell.
translation:
  language: pt
  text: No alto monte de Israel eu o plantarei[a]. Ele produzirá ramos, dará fruto e se tornará um cedro majestoso. Debaixo dele habitarão aves de todo tipo[b]; à sombra de seus galhos elas habitarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu o transplantarei”. O verbo hebraico também pode enfatizar o plantio de uma muda em outro lugar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “toda ave, toda asa”, expressão poética que abrange aves de todo tipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הַר מְרוֹם יִשְׂרָאֵל
  choice: No alto monte de Israel
  rationale: מְרוֹם indica altura ou elevação. A formulação preserva a imagem geográfica e exaltada com naturalidade em português.
- source_word: אֶשְׁתֳּלֶנּוּ
  choice: eu o plantarei
  rationale: O verbo שתל significa plantar ou estabelecer uma muda. “Plantarei” expressa o sentido direto; “transplantarei” continua possível no contexto da alegoria e é registrado em nota.
- source_word: וְנָשָׂא עָנָף
  choice: Ele produzirá ramos
  rationale: A expressão significa literalmente levantar ou portar ramo. “Produzirá ramos” comunica de modo natural o crescimento da árvore, tratando o singular hebraico como coletivo.
- source_word: וְעָשָׂה פֶרִי
  choice: dará fruto
  rationale: Expressão portuguesa corrente e digna para a locução hebraica que significa produzir fruto.
- source_word: וְהָיָה לְאֶרֶז אַדִּיר
  choice: e se tornará um cedro majestoso
  rationale: אַדִּיר pode indicar majestade, poder ou nobreza. “Majestoso” se ajusta à imagem elevada do cedro sem acrescentar interpretação.
- source_word: וְשָׁכְנוּ תַחְתָּיו
  choice: Debaixo dele habitarão
  rationale: שׁכן significa habitar ou estabelecer-se. “Habitarão” mantém o registro profético e a ideia de permanência.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: aves de todo tipo
  rationale: A formulação hebraica é literalmente “toda ave, toda asa”. Em português, “aves de todo tipo” transmite naturalmente sua força distributiva; a forma literal é preservada em nota.
- source_word: בְּצֵל דָּלִיּוֹתָיו
  choice: à sombra de seus galhos
  rationale: דָּלִיּוֹת designa os galhos ou ramagens pendentes da árvore. “Galhos” distingue este termo dos “ramos” da cláusula anterior e soa natural no contexto de abrigo e sombra.
- source_word: תִּשְׁכֹּנָּה
  choice: elas habitarão
  rationale: A forma verbal concorda com o sujeito coletivo e feminino referente às aves. O plural em português torna clara a referência distributiva.
theological_decisions:
- issue: Alcance da imagem das aves
  choice: Manter no texto a imagem ampla das aves sem identificá-las explicitamente.
  alternative: Explicar as aves como nações ou povos abrigados sob o reino restaurado.
  rationale: Embora o contexto profético possa sugerir alcance internacional, este versículo apresenta a metáfora sem interpretá-la. A tradução preserva essa abertura e evita impor uma conclusão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A estrutura poética é preservada sem literalismos pouco naturais; a repetição final de “habitarão” mantém a ênfase do hebraico.
