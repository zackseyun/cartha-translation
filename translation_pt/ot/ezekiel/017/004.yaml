  text: אֵ֛ת רֹ֥אשׁ יְנִֽיקוֹתָ֖י/ו קָטָ֑ף וַ/יְבִיאֵ֨/הוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן בְּ/עִ֥יר רֹכְלִ֖ים שָׂמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/004.yaml
  text: He plucked off the topmost of its young shoots and brought it to the land of Canaan[a]; he set it in a city of merchants.
translation:
  language: pt
  text: Arrancou o mais alto dos seus brotos novos e o levou para a terra de Canaã[a]; colocou-o numa cidade de comerciantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para uma terra de comerciantes”. Aqui, “Canaã” pode ter sentido comercial, especialmente por causa da expressão paralela “cidade de comerciantes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ יְנִיקוֹתָיו
  choice: o mais alto dos seus brotos novos
  rationale: A expressão indica a parte superior ou o broto mais elevado do crescimento recente do cedro. A formulação mantém a imagem concreta e é clara em português atual.
- source_word: קָטָף
  choice: arrancou
  rationale: O verbo descreve a retirada de um broto por ação de colher, cortar ou arrancar. “Arrancou” comunica de modo vívido a separação do broto, sem especificar um instrumento.
- source_word: וַיְבִיאֵהוּ
  choice: o levou
  rationale: O sufixo retoma o broto ou a parte superior arrancada. “Levou” expressa naturalmente o deslocamento até o destino.
- source_word: אֶרֶץ כְּנַעַן
  choice: a terra de Canaã
  rationale: Preserva o nome próprio presente no hebraico, ao mesmo tempo que a nota registra o possível sentido comercial de כְּנַעַן neste contexto.
- source_word: בְּעִיר רֹכְלִים
  choice: numa cidade de comerciantes
  rationale: רֹכְלִים designa mercadores ou comerciantes. A expressão conserva a estrutura hebraica e reforça a possível conotação comercial da frase anterior.
- source_word: שָׂמוֹ
  choice: colocou-o
  rationale: O verbo comum significa pôr ou colocar. A forma pronominal retoma de maneira clara o broto levado.
