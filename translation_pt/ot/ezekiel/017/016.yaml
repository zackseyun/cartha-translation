  to: “Tão certo como eu vivo”, declara o Senhor Yahweh, “certamente, no lugar do rei que o fez rei, cujo juramento[a] ele desprezou e cuja aliança[b] rompeu, com ele, no meio da Babilônia, morrerá.”
