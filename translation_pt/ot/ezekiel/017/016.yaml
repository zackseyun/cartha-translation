base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
translation:
  language: pt
  text: “Tão certo como eu vivo”, declara o Senhor Yahweh, “certamente, no lugar do rei que o fez rei, cujo juramento[a] ele desprezou e cuja aliança[b] rompeu, com ele, no meio da Babilônia, morrerá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “juramento com maldição”. A palavra hebraica pode designar um juramento acompanhado de uma maldição invocada contra quem o quebrasse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tratado”. Neste contexto, a palavra hebraica traduzida por “aliança” pode referir-se a um pacto político entre reis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֗נִי
  choice: Tão certo como eu vivo
  rationale: Reproduz em português natural a fórmula hebraica de juramento divino, preservando sua solenidade e força asseverativa.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética; אֲדֹנָי é traduzido por “Senhor”, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: אִם לֹא
  choice: certamente
  rationale: Em contexto de juramento, a expressão funciona como asseveração enfática, e não como condição literal.
- source_word: בִּמְקוֹם
  choice: no lugar
  rationale: Mantém a referência espacial direta do hebraico sem especificar além do que o texto afirma.
- source_word: הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ
  choice: o rei que o constituiu rei
  rationale: Expressa o causativo de מלך e conserva a repetição intencional de “rei” presente no hebraico.
- source_word: אֲשֶׁר בָּזָה אֶת אָלָתוֹ
  choice: cujo juramento ele desprezou
  rationale: “Juramento” comunica o sentido principal de אָלָה; a possível ideia de automaldição é registrada em nota.
- source_word: וַאֲשֶׁר הֵפֵר אֶת בְּרִיתוֹ
  choice: e cuja aliança rompeu
  rationale: “Aliança” preserva a amplitude e a solenidade de בְּרִית, embora o contexto político também permita “tratado”.
- source_word: אִתּוֹ
  choice: junto dele
  rationale: Retoma o rei que o constituiu rei e evita que “com ele” pareça indicar que ambos morreriam.
- source_word: בְּתוֹךְ בָּבֶל
  choice: no meio da Babilônia
  rationale: Preserva a ênfase espacial de בְּתוֹךְ, indicando que a morte ocorreria ali, na Babilônia.
- source_word: יָמוּת
  choice: ele morrerá
  rationale: Traduz o imperfeito hebraico com valor futuro na declaração profética.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה na fórmula profética
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração conserva explicitamente o nome divino presente no texto hebraico, enquanto אֲדֹנָי é traduzido separadamente por “Senhor”.
- issue: Natureza da בְּרִית violada
  choice: aliança
  alternative: tratado
  rationale: O contexto é um pacto político entre reis, mas “aliança” preserva a amplitude teológica e jurídica do termo hebraico sem excluir esse sentido político.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com legibilidade brasileira. A ordem da frase acompanha de perto o movimento do hebraico, mas emprega pontuação e construções naturais em português. As notas foram posicionadas nos termos a que de fato se referem.
