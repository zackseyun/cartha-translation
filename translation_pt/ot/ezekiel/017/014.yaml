  text: para que se tornasse um reino rebaixado, para não se exaltar, mas para guardar a aliança dele[a] e assim permanecer de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tratado”. O termo hebraico pode designar, neste contexto, um acordo político vinculante.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: para que fosse
  rationale: O infinitivo com ל expressa propósito em continuação ao contexto anterior; “fosse” comunica naturalmente o estado pretendido sem exigir que o verbo seja vertido como mudança explícita.
- source_word: מַמְלָכָה שְׁפָלָה
  choice: um reino submisso
  rationale: שְׁפָלָה descreve a condição política rebaixada e subordinada do reino. “Submisso” torna claro esse sentido no contexto de vassalagem sem sugerir virtude moral, como poderia ocorrer com “humilde”.
- source_word: לְבִלְתִּי הִתְנַשֵּׂא
  choice: sem se exaltar
  rationale: Preserva a finalidade negativa e a nuance reflexiva do hitpael, indicando que o reino não deveria elevar sua própria posição.
- source_word: לִשְׁמֹר
  choice: guardando
  rationale: שׁמר com בְּרִית significa observar ou cumprir as obrigações da aliança; “guardar” preserva a formulação bíblica tradicional e continua compreensível em português atual.
- source_word: בְּרִיתוֹ
  choice: a aliança dele
  rationale: O sufixo masculino singular aponta para a aliança imposta pelo rei da Babilônia. “Aliança” mantém o termo bíblico amplo, enquanto a nota registra o sentido político possível de “tratado”.
- source_word: לְעָמְדָהּ
  choice: a fim de permanecer de pé
  rationale: O sufixo feminino retoma מַמְלָכָה, “reino”. A expressão conserva a metáfora hebraica de manter-se estabelecido, sem substituí-la pela interpretação “perdurar”.
theological_decisions:
- issue: Sentido de בְּרִית em um acordo político
  choice: aliança
  alternative: tratado
  rationale: Embora o contexto seja o de um acordo de vassalagem internacional, “aliança” preserva a amplitude e a continuidade lexical do hebraico בְּרִית. A alternativa contextual “tratado” é registrada em nota para não ocultar o caráter político do acordo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. “Submisso” explicita a condição política do reino; “permanecer de pé” conserva a imagem do hebraico. O marcador [b] deve acompanhar “aliança” no texto para corresponder à nota.
