  text: אֱמֹ֗ר כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהֹוִ֖ה תִּצְלָ֑ח הֲ/לוֹא֩ אֶת שָׁרָשֶׁ֨י/הָ יְנַתֵּ֜ק וְ/אֶת פִּרְיָ֣/הּ יְקוֹסֵ֣ס וְ/יָבֵ֗שׁ כָּל טַרְפֵּ֤י צִמְחָ/הּ֙ תִּיבָ֔שׁ וְ/לֹֽא בִ/זְרֹ֤עַ גְּדוֹלָה֙ וּ/בְ/עַם רָ֔ב לְ/מַשְׂא֥וֹת אוֹתָ֖/הּ מִ/שָּׁרָשֶֽׁי/הָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/009.yaml
  text: 'Say[a], ‘Thus says the Lord GOD: Will it prosper? Will he not pull up its roots and cut off its fruit, so that it dries up? All the fresh leaves of its growth will wither[b]. And not by a great arm or by many people will it be lifted from its roots.’'
translation:
  language: pt
  text: 'Diga: “Assim diz o Senhor Yahweh: Será que ela prosperará? Acaso ele não arrancará[a] suas raízes e cortará seu fruto, fazendo-a secar? Toda a folhagem de seus brotos secará. E não será com um braço poderoso[b] nem com muita gente que ela será levantada de suas raízes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desprenderá”. O verbo hebraico pode destacar o ato de soltar ou puxar com força.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “braço”; expressão figurada de força ou poder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Diga
  rationale: Imperativo singular que introduz a proclamação profética; forma direta e natural em português.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Mantém a fórmula profética e distingue אֲדֹנָי, ‘Senhor’, do nome divino יהוה, transliterado ‘Yahweh’.
- source_word: תִּצְלָח
  choice: Será que ela prosperará?
  rationale: Expressa tanto o êxito quanto o florescimento da videira; o pronome feminino retoma a videira da alegoria.
- source_word: הֲלוֹא ... יְנַתֵּק
  choice: Acaso ele não arrancará
  rationale: Conserva a pergunta retórica que espera resposta afirmativa e traduz o ato de soltar ou puxar as raízes.
- source_word: וְאֶת־פִּרְיָהּ יְקוֹסֵס
  choice: e cortará seu fruto
  rationale: Preserva a imagem agrícola e o sentido de cortar ou retirar o fruto.
- source_word: וְיָבֵשׁ
  choice: fazendo-a secar
  rationale: Apresenta naturalmente em português a consequência da remoção das raízes e do fruto, sem confundir esta forma com o verbo seguinte.
- source_word: כָּל־טַרְפֵּי צִמְחָהּ
  choice: Todas as folhas novas de seus brotos
  rationale: Representa concretamente a folhagem fresca produzida pelo crescimento da planta.
- source_word: תִּיבָשׁ
  choice: murcharão
  rationale: Concorda com o sujeito plural ‘folhas’ e expressa de modo idiomático o ressecamento da vegetação.
- source_word: בִזְרֹעַ גְּדוֹלָה
  choice: um braço poderoso
  rationale: Mantém a metáfora hebraica do braço como expressão de força ou poder.
- source_word: וּבְעַם רָב
  choice: nem muita gente
  rationale: Não explicita ‘exército’, pois o hebraico diz literalmente ‘muito povo’ ou ‘muita gente’, embora possa sugerir força humana ou militar.
- source_word: לְמַשְׂאוֹת אוֹתָהּ מִשָּׁרָשֶׁיהָ
  choice: para levantá-la de suas raízes
  rationale: Conserva o verbo ‘levantar’ e a imagem incomum do original, sem substituí-la silenciosamente por uma interpretação mais específica.
theological_decisions:
- issue: Forma do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: Traduz אֲדֹנָי como ‘Senhor’ e preserva יהוה como o nome próprio ‘Yahweh’, evitando fundir os dois elementos do título.
- issue: Referente do sujeito masculino em יְנַתֵּק e יְקוֹסֵס
  choice: ele
  alternative: explicitar ‘a águia’
  rationale: O hebraico mantém o sujeito implícito no contexto da alegoria; o pronome preserva essa referência sem inserir uma identificação interpretativa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe retém as perguntas retóricas e a metáfora botânica. Os marcadores foram colocados junto aos termos que suas notas explicam.
