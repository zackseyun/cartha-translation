  terminology: “Senhor Yahweh” representa de modo transparente אֲדֹנָי יְהוִה e é aceitável em português moderno. “Copa”, “cedro”, “brotos” e “plantarei” são adequados à imagem botânica. A nota sobre “ramo” explica corretamente o objeto suprido em português.
