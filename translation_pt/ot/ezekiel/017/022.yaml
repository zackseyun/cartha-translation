  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/022.yaml
  text: 'Thus says the Lord GOD: I myself will take from the top of the lofty cedar and set it out[a]. From the tip of its young shoots I myself will pluck a tender one[b], and I myself will plant it on a high and lofty mountain.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Eu mesmo tirarei um ramo[a] da copa do cedro alto e o colocarei. Da ponta de seus brotos, colherei um broto tenro[b]; eu mesmo o plantarei num monte alto e elevado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não expressa o objeto neste ponto; “um ramo” é suprido a partir da imagem da copa e dos brotos.
    reason: implicit_object
  - marker: b
    text: 'Hebraico: “um tenro”, isto é, um broto ou ramo tenro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, evitando a forma pouco natural “Senhor SENHOR”.
- source_word: מִצַּמֶּרֶת הָאֶרֶז הָרָמָה
  choice: da copa do cedro elevado
  rationale: צַמֶּרֶת designa a parte mais alta ou copa da árvore; רָמָה descreve o cedro como alto ou elevado. A formulação preserva com clareza a imagem arbórea.
- source_word: וְנָתַתִּי
  choice: e o colocarei
  rationale: O verbo נתן tem aqui o sentido amplo de pôr ou colocar. Evita antecipar o verbo específico “plantar”, que aparece depois no versículo.
- source_word: מֵרֹאשׁ יֹנְקוֹתָיו
  choice: da ponta de seus brotos
  rationale: רֹאשׁ indica aqui a extremidade ou ponta, e יֹנְקוֹתָיו se refere aos brotos novos do cedro.
- source_word: רַךְ
  choice: um broto tenro
  rationale: O adjetivo substantivado significa literalmente “um tenro”. A explicitação de “broto” torna natural em português o referente já indicado pelo contexto botânico.
- source_word: אֶקְטֹף
  choice: arrancarei
  rationale: קטף descreve colher, destacar ou arrancar uma parte vegetal. “Arrancarei” comunica claramente a retirada do broto sem impor a ideia de corte com instrumento.
- source_word: וְשָׁתַלְתִּי
  choice: eu mesmo o plantarei
  rationale: שתל é o verbo comum para plantar. O pronome independente אָנִי reforça que o próprio Deus realizará a ação.
- source_word: עַל הַר גָּבֹהַ וְתָלוּל
  choice: num monte alto e imponente
  rationale: גָּבֹהַ significa “alto”; תָלוּל acrescenta a ideia de elevação destacada ou proeminência. “Imponente” evita uma repetição vazia e conserva a força poética.
- source_word: אָנִי ... אָנִי
  choice: Eu mesmo ... eu mesmo
  rationale: Os pronomes expressos ao lado dos verbos de primeira pessoa são enfáticos; “eu mesmo” reproduz essa ênfase em português natural.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: “Senhor Yahweh” distingue o título אֲדֹנָי do nome próprio יהוה e deixa visível o nome divino presente no texto hebraico, sem introduzir uma interpretação denominacional.
- issue: Identidade simbólica do broto tenro
  choice: Preservar apenas a imagem do texto, sem identificar explicitamente o broto
  alternative: Identificá-lo na tradução como rei davídico ou Messias
  rationale: O versículo apresenta uma ação simbólica dentro da alegoria do cedro. Embora o contexto permita leituras teológicas e messiânicas, inserir uma identificação no corpo da tradução resolveria além do que o hebraico declara neste ponto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e a repetição de “eu mesmo” conservam a ênfase divina; o vocabulário botânico permanece concreto e acessível.
