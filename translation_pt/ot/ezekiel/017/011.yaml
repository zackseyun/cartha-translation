  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética, o hebraico literalmente expresso por “aconteceu/foi” é vertido de modo natural como “a palavra ... veio”, preservando o sentido e a cadência recorrente.
- source_word: דְבַר
  choice: a palavra
  rationale: “Palavra” conserva o valor lexical e a fórmula profética tradicional; “mensagem” seria possível, mas menos formalmente próxima do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino pessoal no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Tradução direta e idiomática da preposição com sufixo de primeira pessoa.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso direto no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título. “Jeová” é uma forma tradicional, mas não representa tão diretamente a provável vocalização antiga.
translation_notes:
  register: Português moderno, claro e digno, com a cadência da fórmula profética preservada. “Então” dá continuidade narrativa ao וַ־ sem recorrer à construção mais rígida “E aconteceu que”.
