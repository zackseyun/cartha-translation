id: EZK.43.10
reference: Ezekiel 43:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
translation:
  language: pt
  text: Quanto a você, filho do homem, dê a conhecer o templo[a] à casa de Israel, para que se envergonhem das suas iniquidades; e que meçam a planta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a casa”. Aqui, o termo hebraico se refere ao santuário ou templo da visão de Ezequiel.
    reason: lexical_alternative
  - marker: b
    text: Ou “o modelo” ou “o projeto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma habitual de tratamento divino dirigida a Ezequiel e sua continuidade literária no livro, sem substituí-la por uma interpretação como “mortal”.
- source_word: הַגֵּד
  choice: dê a conhecer
  rationale: Expressa o imperativo de comunicar ou apresentar claramente. Em português atual, a formulação é solene e natural, sem o possível sentido excessivamente discursivo de “declare”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Mantém a expressão coletiva e pactual típica da linguagem profética; o contexto deixa claro que se refere ao povo de Israel.
- source_word: הַבַּיִת
  choice: o templo
  rationale: Embora o substantivo signifique literalmente “casa”, no contexto da visão de Ezequiel designa o santuário ou templo mostrado ao profeta.
- source_word: וְיִכָּלְמוּ
  choice: para que se envergonhem
  rationale: Interpreta a forma verbal após o imperativo como finalidade ou resultado pretendido, preservando a resposta moral visada pela revelação do templo.
- source_word: מֵעֲוֺנוֹתֵיהֶם
  choice: das suas iniquidades
  rationale: “Iniquidades” conserva o peso moral de עָוֹן e permite que a preposição seja entendida como vergonha causada pelos próprios delitos.
- source_word: וּמָדְדוּ
  choice: e que meçam
  rationale: Conserva a força volitiva ou exortativa da sequência sem convertê-la num simples futuro indicativo.
- source_word: תָּכְנִית
  choice: a planta
  rationale: No contexto arquitetônico, “planta” comunica de modo concreto e corrente o traçado ou projeto do templo.
theological_decisions:
- issue: Referente de הַבַּיִת na visão do templo
  choice: templo
  alternative: casa
  rationale: O sentido lexical básico é “casa”, mas Ezequiel 40–43 identifica claramente o edifício como o santuário visionário. “Templo” esclarece o referente sem acrescentar conteúdo doutrinário.
- issue: Força das formas verbais depois do imperativo
  choice: 'finalidade seguida de exortação: “para que se envergonhem...; e que meçam”'
  alternative: 'coordenação indicativa: “e se envergonharão... e medirão”'
  rationale: A sequência sintática favorece a resposta pretendida e uma continuação de força volitiva, embora o hebraico também possa ser lido mais diretamente como resultado ou futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Quanto a você” conserva a ênfase inicial do pronome hebraico; “casa de Israel” mantém o registro profético tradicional. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
