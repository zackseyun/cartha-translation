reference: Ezekiel 43:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִֽם נִכְלְמ֞וּ מִ/כֹּ֣ל אֲשֶׁר עָשׂ֗וּ צוּרַ֣ת הַ/בַּ֡יִת וּ/תְכוּנָת֡/וֹ וּ/מוֹצָאָ֡י/ו וּ/מוֹבָאָ֣י/ו וְֽ/כָל צֽוּרֹתָ֡/ו וְ/אֵ֣ת כָּל חֻקֹּתָי/ו֩ וְ/כָל צורת/י וְ/כָל תורת/ו הוֹדַ֣ע אוֹתָ֔/ם וּ/כְתֹ֖ב לְ/עֵֽינֵי/הֶ֑ם וְ/יִשְׁמְר֞וּ אֶת כָּל צוּרָת֛/וֹ וְ/אֶת כָּל חֻקֹּתָ֖י/ו וְ/עָשׂ֥וּ אוֹתָֽ/ם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/011.yaml
  text: And if they are ashamed of all that they have done[a], make known to them the design of the house, its arrangement, its exits, its entrances, all its forms, all its statutes, and all its laws; and write it before their eyes[b], so that they may keep its whole design and all its statutes and do them.
translation:
  language: pt
  text: E, se eles se envergonharem de tudo o que fizeram, dê-lhes a conhecer a forma do templo[a], sua disposição, suas saídas, suas entradas, todas as suas formas, todos os seus estatutos, todas as suas formas e todas as suas leis[b]. Escreva tudo isso diante dos olhos deles, para que guardem toda a sua forma e todos os seus estatutos e os ponham em prática.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o padrão do templo”. O hebraico repete várias vezes a linguagem de “forma” ou “padrão”, enfatizando sua configuração estrutural.'
    reason: lexical_alternative
  - marker: b
    text: “Leis” também pode ser traduzido por “instruções”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְלְמוּ
  choice: se envergonharem
  rationale: Expressa a reação de vergonha diante do que fizeram, preservando a condição sem acrescentar explicitamente arrependimento.
- source_word: צוּרַת הַבַּיִת
  choice: a forma do templo
  rationale: צוּרָה indica forma ou padrão estrutural; 'templo' torna explícito o referente contextual de הַבַּיִת sem impor uma interpretação sobre o cumprimento da visão.
- source_word: תְכוּנָתוֹ
  choice: sua disposição
  rationale: Comunica a configuração ordenada e mensurada do edifício em português natural.
- source_word: מוֹצָאָיו / מוֹבָאָיו
  choice: suas saídas / suas entradas
  rationale: O par recebe sentido arquitetônico claro no contexto da descrição do templo.
- source_word: כָל צֽוּרֹתָיו / כָל צורתיו / כָּל צוּרָתוֹ
  choice: todas as suas formas / todas as suas formas / toda a sua forma
  rationale: Mantém deliberadamente a repetição da linguagem de צוּרָה presente no texto hebraico, inclusive a segunda ocorrência da expressão plural.
- source_word: חֻקֹּתָיו
  choice: seus estatutos
  rationale: Preserva o caráter normativo das determinações, distinguindo-as das תּוֹרוֹת mencionadas em seguida.
- source_word: תורתיו
  choice: suas leis
  rationale: No conjunto jurídico-arquitetônico, 'leis' transmite a força normativa; a possibilidade semântica de 'instruções' é registrada em nota.
- source_word: הוֹדַע אוֹתָם
  choice: dê-lhes a conhecer
  rationale: Reproduz o causativo de ידע em registro digno e corrente.
- source_word: וּכְתֹב לְעֵינֵיהֶם
  choice: Escreva tudo isso diante dos olhos deles
  rationale: Conserva a imagem pública e enfática da expressão hebraica, com 'tudo isso' explicitando naturalmente o objeto em português.
- source_word: וְיִשְׁמְרוּ ... וְעָשׂוּ אוֹתָם
  choice: para que guardem ... e os ponham em prática
  rationale: Mantém a sequência de observar cuidadosamente e executar, evitando o pouco natural 'fazê-los' em português.
theological_decisions:
- issue: Se a terminologia do templo deve ser entendida como planta arquitetônica estritamente literal ou como padrão visionário mais amplo
  choice: Usar linguagem arquitetônica concreta, mas não definir a natureza ou o cumprimento do templo.
  alternative: Traduzir tudo como 'planta' e 'regulamentos', favorecendo uma leitura estritamente técnica.
  rationale: O versículo combina detalhes estruturais e exigências normativas; a tradução mantém essa tensão sem resolver o debate interpretativo.
- issue: A repetição de צורה na lista
  choice: Preservar as duas ocorrências de 'todas as suas formas' e a retomada final 'toda a sua forma'.
  alternative: Omitir a segunda ocorrência por considerá-la repetição estilisticamente desnecessária.
  rationale: A repetição consta do texto hebraico fornecido e pode ser significativa; omiti-la silenciosamente afastaria a tradução da evidência textual de base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos na forma brasileira de tratamento por 'você' sem explicitar o pronome. A repetição pouco usual de 'formas' foi mantida por corresponder ao texto hebraico, e explicada em nota.
