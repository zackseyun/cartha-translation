  text: וּ/בַ/יּוֹם֙ הַ/שֵּׁנִ֔י תַּקְרִ֛יב שְׂעִיר עִזִּ֥ים תָּמִ֖ים לְ/חַטָּ֑את וְ/חִטְּאוּ֙ אֶת הַ/מִּזְבֵּ֔חַ כַּ/אֲשֶׁ֥ר חִטְּא֖וּ בַּ/פָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/022.yaml
  text: And on the second day you shall present a male goat without blemish for a sin offering[a], and they shall purify the altar just as they purified it with the bull.
translation:
  language: pt
  text: No segundo dia, você apresentará um bode sem defeito como oferta pelo pecado[a], e eles purificarão o altar, assim como o purificaram com o novilho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta usada para remover a impureza ritual, além de ser traduzido como “oferta pelo pecado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: No segundo dia
  rationale: A expressão temporal marca a sequência das instruções. Em português, a ligação narrativa é preservada naturalmente sem a necessidade de traduzir o ו por “e”.
- source_word: תַּקְרִיב
  choice: você apresentará
  rationale: O hifil de קרב, em contexto sacrificial, indica fazer chegar ou apresentar a vítima. “Apresentará” mantém o sentido cultual e evita antecipar o ato específico de sacrificar.
- source_word: שְׂעִיר עִזִּים
  choice: um bode
  rationale: A expressão hebraica designa idiomaticamente um caprino macho; “bode” é preciso e natural em português moderno.
- source_word: תָּמִים
  choice: sem defeito
  rationale: Em contexto sacrificial, o termo descreve um animal sem imperfeição física. “Sem defeito” é claro e corrente.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Aqui חַטָּאת designa a oferta ritual. A tradução tradicional e reconhecível preserva a referência ao pecado, enquanto a nota registra a alternativa funcional “oferta de purificação”.
- source_word: וְחִטְּאוּ אֶת־הַמִּזְבֵּחַ
  choice: e eles purificarão o altar
  rationale: O piel de חטא aplicado ao altar descreve purificação ritual, não uma ação moral. “Purificarão” comunica corretamente a função cultual.
- source_word: כַּאֲשֶׁר חִטְּאוּ בַּפָּר
  choice: assim como o purificaram com o novilho
  rationale: A comparação remete ao rito anterior; ב é instrumental. O pronome “o” retoma naturalmente “o altar”, e “novilho” expressa o bovino sacrificial referido no contexto.
theological_decisions:
- issue: Tradução da linguagem de חַטָּאת e חטא no contexto de purificação sacrificial
  choice: “oferta pelo pecado” para o substantivo e “purificar” para o verbo aplicado ao altar
  alternative: “oferta de purificação” para explicitar a correspondência funcional entre a oferta e a ação ritual
  rationale: O hebraico emprega a mesma raiz para a oferta e para a purificação do altar. Em português, distinguir “oferta pelo pecado” de “purificar” preserva tanto a terminologia sacrificial reconhecível quanto o sentido ritual do verbo, sem sugerir que o altar comete pecado nem impor uma interpretação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário cultual compreensível. O tratamento “você” traduz o singular de תַּקְרִיב; a mudança para “eles” preserva o plural de וְחִטְּאוּ.
