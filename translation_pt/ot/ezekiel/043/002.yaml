id: EZK.43.2
reference: Ezekiel 43:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כְּבוֹד֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בָּ֖א מִ/דֶּ֣רֶךְ הַ/קָּדִ֑ים וְ/קוֹל֗/וֹ כְּ/קוֹל֙ מַ֣יִם רַבִּ֔ים וְ/הָ/אָ֖רֶץ הֵאִ֥ירָה מִ/כְּבֹדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/002.yaml
  text: And behold[a], the glory of the God of Israel was coming from the way of the east, and his voice was like the sound of many waters[b], and the earth shone from his glory.
translation:
  language: pt
  text: E eis que a glória do Deus de Israel vinha da direção do leste[a]. Sua voz era como o som de muitas águas[b], e a terra resplandeceu com a sua glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do leste” ou “do caminho do leste”. Em hebraico, literalmente, “do caminho do leste”.
    reason: Registra alternativas naturais para a expressão espacial hebraica, incluindo sua formulação literal.
  - marker: b
    text: Ou “como o estrondo de muitas águas”.
    reason: “Estrondo” expressa uma possível intensidade contextual de קוֹל, embora seja mais interpretativo que “som”.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força vívida e deítica da expressão que introduz a cena visionária, em linguagem digna e ainda reconhecível no português atual.
- source_word: כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: a glória do Deus de Israel
  rationale: “Glória” conserva a ressonância teofânica de כָּבוֹד, e a construção identifica diretamente o Deus que se manifesta.
- source_word: בָּא
  choice: vinha
  rationale: O imperfeito português apresenta a chegada como uma ação em curso diante do profeta, adequada à vivacidade do relato visionário.
- source_word: מִדֶּרֶךְ הַקָּדִים
  choice: da direção do leste
  rationale: Expressa naturalmente em português a procedência indicada por מִן e o valor espacial de דֶּרֶךְ, sem apagar a formulação hebraica, registrada na nota.
- source_word: וְקוֹלוֹ
  choice: Sua voz
  rationale: “Voz” é um sentido direto de קוֹל e mantém a apresentação pessoal da manifestação divina; a retomada sem novo “e” evita uma coordenação excessivamente pesada em português.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: como o som de muitas águas
  rationale: Na comparação, “som” evita a repetição estilisticamente dura de “voz” e preserva a imagem sem intensificá-la interpretativamente como “rugido” ou “estrondo”.
- source_word: וְהָאָרֶץ
  choice: e a terra
  rationale: No cenário teofânico amplo, “terra” comunica melhor que “região” ou “país” o alcance da luminosidade.
- source_word: הֵאִירָה מִכְּבֹדוֹ
  choice: resplandeceu por causa da sua glória
  rationale: “Resplandeceu” traduz de modo natural a emissão ou manifestação de luz, enquanto “por causa de” explicita o valor causal ou originário possível de מִן sem sugerir que a glória e a terra sejam idênticas.
theological_decisions:
- issue: Referência pessoal dos sufixos em קוֹלוֹ e כְּבֹדוֹ
  choice: 'Empregar pronomes pessoais: “Sua voz” e “sua glória”'
  alternative: “seu som” e “a glória dela”, com referência gramatical impessoal à glória
  rationale: Embora “glória” seja o antecedente gramatical imediato, o contexto apresenta a manifestação pessoal do Deus de Israel. Os pronomes pessoais refletem essa apresentação sem definir além do texto a relação entre Deus e sua glória.
- issue: Relação expressa por מִן em מִכְּבֹדוֹ
  choice: “por causa da sua glória”
  alternative: “a partir da sua glória” ou “com a sua glória”
  rationale: A preposição pode indicar fonte ou causa. A tradução escolhida comunica que o resplendor da terra procede da glória divina, enquanto a nota não é necessária porque as alternativas não alteram substancialmente a cena.
translation_notes:
  register: 'Português moderno, claro e solene, com ampla legibilidade brasileira. “E eis que” conserva o tom visionário; “leste” é preferido a “oriente” por ser mais corrente e espacialmente direto. A sintaxe evita rigidez excessiva, mas mantém as três imagens centrais: a glória que se aproxima, a voz comparada às águas e a terra iluminada.'
