  terminology: «Filho do homem», «filhos de Israel», «santo nome», «prostituição», «cadáveres» e «lugares altos» são escolhas adequadas. A nota preserva de modo apropriado a alternativa interpretativa para a palavra final, sem apresentá-la como leitura certa.
