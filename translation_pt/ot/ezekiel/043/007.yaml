  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ אֶת מְק֣וֹם כִּסְאִ֗/י וְ/אֶת מְקוֹם֙ כַּפּ֣וֹת רַגְלַ֔/י אֲשֶׁ֧ר אֶשְׁכָּן שָׁ֛ם בְּ/ת֥וֹךְ בְּנֵֽי יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם וְ/לֹ֣א יְטַמְּא֣וּ ע֣וֹד בֵּֽית יִ֠שְׂרָאֵל שֵׁ֣ם קָדְשִׁ֞/י הֵ֤מָּה וּ/מַלְכֵי/הֶם֙ בִּ/זְנוּתָ֔/ם וּ/בְ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם בָּמוֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/007.yaml
  text: And he said to me[a], “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel forever. And the house of Israel shall no longer defile my holy name, neither they nor their kings, by their prostitution and by the corpses of their kings on their high places.”
translation:
  language: pt
  text: 'E ele me disse: “Filho do homem, este é o lugar do meu trono e o lugar das plantas dos meus pés, onde habitarei para sempre no meio dos filhos de Israel. A casa de Israel não voltará a contaminar o meu santo nome — nem eles nem os seus reis — com a sua prostituição e com os cadáveres dos seus reis nos seus lugares altos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com os cadáveres dos seus reis na morte deles”. A palavra hebraica final é tradicionalmente lida como “seus lugares altos”, o que combina com o contexto de profanação cultual; alguns, porém, a relacionam com “a morte deles”.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a fórmula característica com que Ezequiel é interpelado e o sentido representativo do idioma hebraico.
- source_word: מְקוֹם כִּסְאִי
  choice: o lugar do meu trono
  rationale: Tradução direta e natural da construção hebraica.
- source_word: מְקוֹם כַּפּוֹת רַגְלַי
  choice: o lugar das plantas dos meus pés
  rationale: Mantém a imagem corporal explícita; “escabelo” seria uma interpretação não expressa lexicalmente.
- source_word: אֲשֶׁר אֶשְׁכָּן שָׁם
  choice: onde habitarei
  rationale: O imperfeito tem valor futuro natural neste contexto visionário; “onde” já incorpora o sentido de שָׁם.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: no meio dos filhos de Israel
  rationale: Preserva tanto a ideia espacial de presença no meio do povo como a expressão familiar e pactual “filhos de Israel”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressão moderna e clara para a duração indefinida ou perpétua indicada no contexto.
- source_word: יְטַמְּאוּ
  choice: profanará
  rationale: Com “meu santo nome” como objeto, “profanar” é idiomático em português e comunica a violação da santidade, embora o verbo hebraico também retenha a noção de tornar impuro.
- source_word: שֵׁם קָדְשִׁי
  choice: o meu santo nome
  rationale: Forma consagrada, clara e semanticamente fiel à construção hebraica.
- source_word: הֵמָּה וּמַלְכֵיהֶם
  choice: nem eles nem os seus reis
  rationale: Explicita em português a coordenação sob a negação precedente sem alterar seu alcance.
- source_word: בִּזְנוּתָם
  choice: com a sua prostituição
  rationale: Conserva a força da metáfora profética e sua possível dimensão sexual, idólatra e pactual, sem reduzi-la a uma única interpretação.
- source_word: וּבְפִגְרֵי מַלְכֵיהֶם
  choice: e com os cadáveres dos seus reis
  rationale: פגר designa diretamente cadáveres e evoca a impureza associada aos mortos.
- source_word: בָּמוֹתָם
  choice: nos seus lugares altos
  rationale: Segue a vocalização massorética e a leitura cultual tradicional de בָּמוֹת, adequada ao contexto de profanação, deixando a alternativa ligada à morte em nota.
theological_decisions:
- issue: Natureza da profanação de Israel na cláusula final
  choice: A cláusula menciona prostituição de caráter possivelmente cultual e pactual, além dos cadáveres dos reis nos lugares altos.
  alternative: A expressão final pode ser entendida como “na morte deles”, relacionando-a aos cadáveres dos reis.
  rationale: A vocalização massorética e o contexto de santidade do templo favorecem “lugares altos”, mas a possível relação da forma consonantal com “morte” merece ser preservada sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém as imagens concretas e a tensão cultual do hebraico, evitando linguagem excessivamente arcaica e explicações denominacionais.
