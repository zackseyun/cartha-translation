base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/014.yaml
  text: And from the ledge of the ground to the lower platform shall be two cubits[a], with a width of one cubit; and from the smaller platform to the larger platform shall be four cubits[c][b], with a width of one cubit.
translation:
  language: pt
  text: E do ressalto junto ao chão[a] até a plataforma[b] inferior serão dois côvados, e sua largura será de um côvado; da plataforma menor até a plataforma maior serão quatro côvados, e sua largura será de um côvado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como “ressalto junto ao chão” significa literalmente “o seio da terra” e pode designar a base, uma reentrância ou um ressalto do altar junto ao chão.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “plataforma” refere-se aqui aos níveis escalonados da estrutura do altar; também pode ser traduzido como “ressalto” ou “patamar”.
    reason: lexical_alternative
  - marker: c
    text: A frase final diz literalmente “e a largura do côvado”; provavelmente significa uma largura de um côvado, em paralelo com a medida anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיק הָאָרֶץ
  choice: o ressalto ao nível do chão
  rationale: A expressão significa literalmente “o seio da terra”, mas, no contexto arquitetônico do altar, provavelmente designa a base, reentrância ou saliência situada junto ao chão. “Ressalto ao nível do chão” comunica a ideia estrutural sem transformar a metáfora literal em uma imagem obscura.
- source_word: עֲזָרָה
  choice: plataforma
  rationale: Neste contexto, o termo designa níveis ou estágios escalonados da estrutura do altar. “Plataforma” é claro em português atual e permite distinguir naturalmente a plataforma inferior, a menor e a maior.
- source_word: הַתַּחְתּוֹנָה
  choice: inferior
  rationale: O adjetivo identifica o nível de baixo em relação aos demais, sem exigir o sentido superlativo de “mais baixo”.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: dois côvados
  rationale: O hebraico declara diretamente a medida. A dimensão vertical é indicada pela construção “desde... até”, de modo que não é necessário acrescentar “de altura” ao texto.
- source_word: וְרֹחַב אַמָּה אֶחָת
  choice: e sua largura será de um côvado
  rationale: A formulação torna explícita em português a relação predicativa implícita no hebraico e conserva exatamente a medida.
- source_word: הֳעֲזָרָה הַקְּטַנָּה
  choice: a plataforma menor
  rationale: O comparativo natural em português evidencia a relação com a plataforma maior mencionada em seguida.
- source_word: הָעֲזָרָה הַגְּדוֹלָה
  choice: a plataforma maior
  rationale: No contexto arquitetônico, o adjetivo expressa o tamanho relativo do estágio em contraste com a plataforma menor.
- source_word: אַרְבַּע אַמּוֹת
  choice: quatro côvados
  rationale: Mantém a medida direta do hebraico; a ideia de altura permanece implícita na construção “desde... até”.
- source_word: וְרֹחַב הָאַמָּה
  choice: e sua largura será de um côvado
  rationale: A expressão é literalmente “e a largura do côvado”. Pelo paralelismo com a medida anterior, provavelmente indica uma largura de um côvado; essa interpretação é apresentada no texto e sua literalidade é registrada em nota.
