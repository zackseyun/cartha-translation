  register: Português moderno, digno e acessível, com vocabulário arquitetônico claro. Conserva “côvado”, medida bíblica tradicional, e mantém as dimensões verticais implícitas como no hebraico. As notas preservam a incerteza lexical de חֵיק הָאָרֶץ e עֲזָרָה e a construção incomum da frase final.
