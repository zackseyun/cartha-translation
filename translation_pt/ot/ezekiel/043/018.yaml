  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֵ֚לֶּה חֻקּ֣וֹת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הֵעָֽשׂוֹת֑/וֹ לְ/הַעֲל֤וֹת עָלָי/ו֙ עוֹלָ֔ה וְ/לִ/זְרֹ֥ק עָלָ֖י/ו דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/018.yaml
  text: 'And he said to me[a], “Son of man, thus says the Lord GOD: These are the statutes of the altar on the day it is made[c][b], for offering burnt offerings on it and for sprinkling blood on it.”'
translation:
  language: pt
  text: 'E ele me disse: “Filho do homem, assim diz o Senhor Yahweh: Estas são as prescrições do altar, no dia em que ele for feito[a], para se oferecerem sobre ele holocaustos[b] e se aspergir sobre ele sangue[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no dia de ele ser feito”; a expressão também pode ser entendida de modo mais geral como “quando ele for feito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um holocausto”; o singular hebraico pode ter sentido coletivo neste contexto.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “lançar sangue sobre ele”; o verbo hebraico pode indicar uma aplicação ritual mais vigorosa do que “aspergir” às vezes sugere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma característica com que Ezequiel é interpelado e preserva sua força literária recorrente.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Reproduz o título אֲדֹנָי como “Senhor” e translitera o nome divino יהוה como “Yahweh”, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: חֻקּוֹת הַמִּזְבֵּחַ
  choice: as prescrições para o altar
  rationale: חֻקּוֹת designa determinações fixas; “prescrições” comunica com clareza o sentido ritual e normativo. A preposição “para” expressa naturalmente em português a relação genitiva com o altar.
- source_word: בְּיוֹם הֵעָשׂוֹתוֹ
  choice: no dia em que ele for feito
  rationale: Preserva o valor temporal literal da construção hebraica e identifica o altar como referente do sufixo.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה
  choice: oferecer sobre ele holocaustos
  rationale: No contexto sacrificial, o hifil de עלה significa oferecer; “holocausto” é o termo português tradicional e preciso para a oferta inteiramente queimada. O singular hebraico pode ter sentido coletivo.
- source_word: וְלִזְרֹק עָלָיו דָּם
  choice: e aspergir sobre ele sangue
  rationale: זרק descreve a aplicação ritual do sangue ao altar. “Aspergir” é claro e culticamente reconhecível, embora o verbo possa sugerir um gesto mais vigoroso.
theological_decisions:
- issue: Tradução do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “Yahweh” preserva explicitamente o nome divino presente no texto hebraico, enquanto “Senhor” representa אֲדֹנָי.
- issue: Valor de עוֹלָה no singular
  choice: holocaustos, em sentido coletivo
  alternative: um holocausto
  rationale: A instrução estabelece o uso ritual geral do altar; por isso, o singular pode ser entendido coletivamente. A alternativa singular continua gramaticalmente possível.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. Mantiveram-se o tratamento recorrente “Filho do homem”, o vocabulário sacrificial reconhecível e a repetição de “sobre ele”, que corresponde à repetição hebraica e enfatiza o altar.
