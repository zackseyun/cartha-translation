base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/017.yaml
  text: And the ledge was fourteen cubits long by fourteen cubits wide at its four sides, and the rim around it was half a cubit, and its base was a cubit all around; and its steps faced east.
translation:
  language: pt
  text: A plataforma tinha catorze côvados de comprimento por catorze côvados de largura, em seus quatro lados. A borda ao redor dela tinha meio côvado, e sua base, um côvado em toda a volta. Seus degraus estavam voltados para o leste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲזָרָה
  choice: a plataforma
  rationale: No contexto da estrutura do altar (Ez 43:13–17), designa a superfície ou plataforma superior; evita o sentido moderno mais comum de “pátio”, inadequado às medidas aqui dadas.
- source_word: הַגְּבוּל
  choice: a borda
  rationale: Expressa o rebordo que circunda a plataforma; corresponde naturalmente ao elemento arquitetônico descrito.
- source_word: הַחֵיק
  choice: sua base
  rationale: Embora o termo possa significar literalmente “seio” ou “recesso”, neste contexto arquitetônico refere-se à parte inferior ou base que circunda o altar.
- source_word: מַעֲלֹתָיו
  choice: seus degraus
  rationale: Plural concreto natural para os meios de subida ao altar.
- source_word: קָדִים
  choice: o leste
  rationale: Indica a direção oriental em linguagem portuguesa corrente.
