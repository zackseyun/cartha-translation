  text: וִֽ/יכַלּ֖וּ אֶת הַ/יָּמִ֑ים וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁמִינִ֜י וָ/הָ֗לְאָה יַעֲשׂ֨וּ הַ/כֹּהֲנִ֤ים עַל הַ/מִּזְבֵּ֨חַ֙ אֶת עוֹלֽוֹתֵי/כֶם֙ וְ/אֶת שַׁלְמֵי/כֶ֔ם וְ/רָצִ֣אתִי אֶתְ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־ס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/027.yaml
  text: When the days are completed[a], then from the eighth day onward the priests shall offer on the altar your burnt offerings and your peace offerings, and I will accept you, declares the Lord GOD.
translation:
  language: pt
  text: Quando se completarem esses dias, do oitavo dia em diante os sacerdotes oferecerão sobre o altar os holocaustos e as ofertas de comunhão de vocês; e eu aceitarei vocês — declaração do Senhor Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיכַלּוּ אֶת־הַיָּמִים
  choice: Quando se completarem esses dias
  rationale: Expressa o término do período ritual mencionado anteriormente. O demonstrativo torna natural em português a referência anafórica do artigo hebraico.
- source_word: בַּיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: do oitavo dia em diante
  rationale: Preserva tanto o ponto inicial, o oitavo dia, quanto a continuidade posterior.
- source_word: יַעֲשׂוּ ... עַל־הַמִּזְבֵּחַ
  choice: oferecerão sobre o altar
  rationale: Embora עשׂה signifique literalmente fazer, no contexto sacrificial 'oferecer' comunica de modo idiomático a ação cultual.
- source_word: עוֹלֹתֵיכֶם
  choice: os holocaustos ... de vocês
  rationale: Holocausto é o termo português tradicional e preciso para a oferta inteiramente queimada; 'de vocês' conserva a segunda pessoa plural.
- source_word: שַׁלְמֵיכֶם
  choice: as ofertas de comunhão de vocês
  rationale: O termo שְׁלָמִים designa sacrifícios compartilhados que expressam paz, bem-estar e comunhão. 'Ofertas de comunhão' é claro no português atual sem reduzir o campo semântico a uma única nuance.
- source_word: וְרָצִאתִי אֶתְכֶם
  choice: e eu aceitarei vocês
  rationale: Mantém as próprias pessoas, e não apenas suas ofertas, como objeto da aceitação divina.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: Conserva a fórmula profética e representa o título אֲדֹנָי juntamente com o nome divino יהוה sem produzir 'Senhor SENHOR'.
theological_decisions:
- issue: Representação de יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus; Soberano SENHOR
  rationale: Usa 'Yahweh' para preservar explicitamente o nome divino e traduz אֲדֹנָי por 'Senhor', evitando a duplicação artificial 'Senhor SENHOR'.
- issue: Objeto da aceitação divina
  choice: eu aceitarei vocês
  alternative: eu aceitarei as ofertas de vocês; eu me agradarei de vocês
  rationale: O pronome hebraico אֶתְכֶם refere-se diretamente ao povo. A tradução preserva essa força relacional sem transferir o objeto para os sacrifícios.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o encadeamento ritual do texto e evita arcaísmos desnecessários.
