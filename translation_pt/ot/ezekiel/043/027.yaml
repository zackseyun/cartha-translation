  source_fidelity: 'A tradução preserva adequadamente a sequência temporal do hebraico: a conclusão do período prescrito, o início no oitavo dia e a continuidade posterior. ‘Oferecerão sobre o altar’ é uma contextualização idiomática legítima de יעשו no contexto sacrificial. Os dois tipos de oferta, a referência possessiva a ‘vocês’ e o objeto pessoal de ‘aceitarei vocês’ são mantidos. ‘Senhor Yahweh’ representa de modo transparente אַדֹנָי יהוה.'
  naturalness: O texto é claro, fluente e digno em português moderno de ampla compreensão. ‘Do oitavo dia em diante’ e ‘ofertas de comunhão’ soam naturais e apropriados ao registro ritual-profético. A pontuação antes da fórmula de declaração é adequada.
  terminology: ‘Holocaustos’ é o termo técnico tradicional e preciso para עֹלוֹת neste contexto. ‘Ofertas de comunhão’ é uma opção moderna aceitável para שְׁלָמִים e não impõe uma interpretação denominacional. ‘Senhor Yahweh’ mantém tanto o título quanto o nome divino sem a duplicação artificial ‘Senhor SENHOR’.
