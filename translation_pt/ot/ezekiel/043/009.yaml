  text: עַתָּ֞ה יְרַחֲק֧וּ אֶת זְנוּתָ֛/ם וּ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם מִמֶּ֑/נִּי וְ/שָׁכַנְתִּ֥י בְ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/009.yaml
  text: Now let them put far from me their prostitution and the corpses of their kings[b][a], and I will dwell in their midst forever.
translation:
  language: pt
  text: Agora, que eles afastem de mim a prostituição deles[a] e os cadáveres dos seus reis[b], e eu habitarei no meio deles para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a devassidão deles”. O hebraico usa a prostituição como metáfora da infidelidade à aliança, muitas vezes expressa pela idolatria.
    reason: lexical_alternative
  - marker: b
    text: A expressão “os cadáveres dos seus reis” pode referir-se literalmente aos corpos de reis mortos ou, de modo mais amplo, a sepulturas, instalações funerárias ou memoriais reais que profanavam a área próxima ao santuário.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição temporal e discursiva para a mudança exigida à luz da declaração anterior.
- source_word: יְרַחֲקוּ
  choice: que eles afastem
  rationale: O hifil de רחק tem sentido causativo, “fazer ficar longe, afastar”. A construção com “que” preserva a força exortativa ou jussiva da forma hebraica sem convertê-la em simples previsão.
- source_word: זְנוּתָם
  choice: a sua prostituição
  rationale: Mantém a forte metáfora profética da infidelidade à aliança, muitas vezes manifestada na idolatria, sem substituí-la por uma interpretação explícita.
- source_word: פִגְרֵי מַלְכֵיהֶם
  choice: os cadáveres dos seus reis
  rationale: פגר designa cadáver ou corpo morto. “Cadáveres” conserva a imagem concreta e o caráter profanador da expressão, sem decidir qual era seu referente histórico exato.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Expressa separação da presença de Deus e se liga naturalmente ao verbo “afastem”.
- source_word: וְשָׁכַנְתִּי
  choice: e eu habitarei
  rationale: “Habitar” preserva a linguagem bíblica da presença duradoura de Deus entre seu povo.
- source_word: בְתוֹכָם
  choice: no meio deles
  rationale: Conserva tanto a dimensão espacial quanto a dimensão relacional da presença divina.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa de modo natural e claro a permanência duradoura anunciada no contexto de restauração.
theological_decisions:
- issue: Sentido de זְנוּתָם no contexto profético
  choice: Preservar a metáfora como “a sua prostituição”.
  alternative: Traduzir diretamente como “sua idolatria”, “sua infidelidade” ou “sua imoralidade sexual”.
  rationale: O hebraico emprega deliberadamente a prostituição como imagem da infidelidade à aliança. Torná-la apenas “idolatria” resolveria a metáfora; “imoralidade sexual” poderia restringir indevidamente o sentido.
- issue: Força de יְרַחֲקוּ
  choice: 'Entender como exortação: “que eles afastem”.'
  alternative: 'Entender como futuro indicativo: “eles afastarão”.'
  rationale: Depois de עַתָּה e no fluxo do contexto, a forma expressa a mudança requerida do povo, não apenas uma previsão.
- issue: Referente de “os cadáveres dos seus reis”
  choice: Manter a expressão concreta sem explicação interpretativa no corpo do versículo.
  alternative: Traduzir como túmulos, monumentos funerários ou vestígios idolátricos dos reis.
  rationale: O referente histórico é discutido, enquanto o texto hebraico fala concretamente de cadáveres. A nota registra a incerteza sem eliminá-la da tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “que eles afastem” preserva a terceira pessoa e a força exortativa do hebraico; “no meio deles” mantém a linguagem bíblica da presença divina sem soar arcaica.
