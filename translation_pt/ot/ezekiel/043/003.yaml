id: EZK.43.3
reference: Ezekiel 43:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/כְ/מַרְאֵ֨ה הַ/מַּרְאֶ֜ה אֲשֶׁ֣ר רָאִ֗יתִי כַּ/מַּרְאֶ֤ה אֲשֶׁר רָאִ֨יתִי֙ בְּ/בֹאִ/י֙ לְ/שַׁחֵ֣ת אֶת הָ/עִ֔יר וּ/מַרְא֕וֹת כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי אֶל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/003.yaml
  text: And the appearance of what I saw was like the appearance that I had seen when I came to destroy the city[a], and the visions were like the appearance that I had seen by the Kebar Canal[b]; and I fell on my face.
translation:
  language: pt
  text: E a aparência do que vi era como a aparência que eu tinha visto quando vim para destruir a cidade[a]; e as visões eram como a aparência que eu tinha visto junto ao canal de Quebar[b]. Então caí com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele veio para destruir a cidade”. O texto hebraico diz “quando vim”, o que pode refletir a participação de Ezequiel na visão da destruição de Jerusalém, e não sua atuação pessoal como destruidor.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “rio Quebar”; provavelmente um grande canal da Babilônia, não um rio natural.'
    reason: cultural_note
lexical_decisions:
- source_word: מַרְאֶה / מַרְאוֹת
  choice: aparência / visões
  rationale: Mantém a repetição deliberada de מַרְאֶה no singular e a mudança para o plural מַרְאוֹת, usando formas naturais em português.
- source_word: רָאִיתִי
  choice: vi / tinha visto
  rationale: O mais-que-perfeito composto torna clara a referência às experiências visionárias anteriores dentro das comparações, sem alterar o sentido do verbo.
- source_word: בְּבֹאִי
  choice: quando vim
  rationale: Preserva a construção temporal e, sobretudo, a difícil primeira pessoa do texto massorético.
- source_word: לְשַׁחֵת
  choice: para destruir
  rationale: Expressa de modo direto o sentido destrutivo de שׁחת neste contexto.
- source_word: הָעִיר
  choice: a cidade
  rationale: Conserva a expressão hebraica sem explicitar Jerusalém no corpo do texto.
- source_word: אֶל נְהַר כְּבָר
  choice: junto ao canal de Quebar
  rationale: Representa אֶל como localização neste contexto e identifica o נהר babilônico mais precisamente como canal, em linguagem portuguesa natural.
- source_word: וָאֶפֹּל אֶל־פָּנַי
  choice: Então caí com o rosto em terra
  rationale: Reproduz naturalmente em português o gesto hebraico de prostração, reverência e assombro.
theological_decisions:
- issue: Agente implícito em “quando vim para destruir a cidade”
  choice: Manter a primeira pessoa sem atenuar nem transferir a agência
  alternative: “quando ele veio para destruir a cidade”
  rationale: O texto massorético traz a primeira pessoa e pode vincular Ezequiel à participação visionária no juízo contra Jerusalém. A tradução preserva essa formulação difícil; a nota registra a leitura alternativa sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “aparência” é mantida por ser estrutural no hebraico; “com o rosto em terra” comunica naturalmente o idioma de prostração. Os marcadores [a] e [b] aparecem no texto principal.
