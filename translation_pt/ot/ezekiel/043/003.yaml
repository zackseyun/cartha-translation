  terminology: «Quebar» é uma forma portuguesa adequada; «canal» é historicamente informativo sem ser excessivo. A nota a preserva a ambiguidade textual e não transfere dogmaticamente a ação para outro agente. A nota b explica de forma concisa a designação hebraica e o provável caráter de canal.
