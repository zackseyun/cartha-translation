  source_fidelity: A tradução preserva adequadamente a cadeia comparativa de מַרְאֶה, inclusive a alternância singular/plural («aparência» / «visões»), e mantém a primeira pessoa difícil de בְּבֹאִי («quando vim para destruir a cidade»). «Junto ao canal de Quebar» representa bem a localização junto ao נְהַר־כְּבָר sem reproduzir de modo enganoso a designação tradicional de rio. «Caí com o rosto em terra» é uma realização idiomática fiel de וָאֶפֹּל אֶל־פָּנַי.
