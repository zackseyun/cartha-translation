source:
  edition: WLC
  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וַ/תְּבִיאֵ֕/נִי אֶל הֶֽ/חָצֵ֖ר הַ/פְּנִימִ֑י וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/005.yaml
  text: Then the Spirit lifted me up and brought me into the inner court[a], and behold[b], the glory of Yahweh filled the house.
translation:
  language: pt
  text: Então o Espírito me levantou e me levou ao pátio interno[a], e eis que o templo[b] estava cheio da glória de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito” ou “o vento”; o termo hebraico רוּחַ admite esses sentidos, embora, no contexto das visões de Ezequiel, provavelmente se refira ao Espírito divino.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “a casa”, isto é, o templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂאֵנִי
  choice: me levantou
  rationale: O verbo נשׂא descreve aqui a elevação de Ezequiel no transporte visionário; “me levantou” preserva o movimento ascendente e soa natural em português.
- source_word: רוּחַ
  choice: o Espírito
  rationale: Embora רוּחַ também possa significar “vento” ou “um espírito”, o contexto recorrente do transporte visionário em Ezequiel favorece o Espírito como agente divino.
- source_word: וַתְּבִיאֵנִי
  choice: me levou
  rationale: A forma causativa de בוא significa fazer entrar ou trazer. “Me levou ao” expressa naturalmente em português o deslocamento até o pátio interno.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: o pátio interno
  rationale: חָצֵר designa o pátio ou átrio do complexo do templo. “Pátio interno” é claro para leitores atuais e preserva a referência arquitetônica.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: A expressão chama a atenção para uma visão surpreendente. “E eis que” mantém o tom profético solene sem perder clareza.
- source_word: מָלֵא
  choice: enchia
  rationale: A construção hebraica apresenta a glória de Yahweh como aquilo que enche a casa. O imperfeito português “enchia” comunica o estado contemplado na visão sem impor uma sequência temporal rígida.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: A expressão se refere à manifestação gloriosa da presença divina e conserva a relação construta do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַבָּיִת
  choice: o templo
  rationale: Literalmente “a casa”, mas no contexto da visão a referência é ao edifício do templo. “O templo” torna o referente imediatamente claro, enquanto a nota preserva a expressão hebraica literal.
theological_decisions:
- issue: Referente de רוּחַ no transporte visionário de Ezequiel
  choice: o Espírito, como agente divino
  alternative: vento ou um espírito
  rationale: O contexto visionário e os paralelos internos de Ezequiel favorecem o Espírito divino, mas a nota conserva a ambiguidade lexical genuína do hebraico.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: “Yahweh” representa diretamente o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido contextual de הַבָּיִת
  choice: o templo
  alternative: a casa
  rationale: No contexto imediato, “a casa” é o edifício do templo. A tradução contextual evita possível confusão em português, e a nota registra a forma literal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “E eis que” preserva o destaque profético; “pátio interno” e “templo” favorecem compreensão imediata. As notas mantêm as ambiguidades relevantes de רוּחַ e a formulação literal de הַבָּיִת.
