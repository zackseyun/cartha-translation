  text: שִׁבְעַ֣ת יָמִ֔ים תַּעֲשֶׂ֥ה שְׂעִיר חַטָּ֖את לַ/יּ֑וֹם וּ/פַ֧ר בֶּן בָּקָ֛ר וְ/אַ֥יִל מִן הַ/צֹּ֖אן תְּמִימִ֥ים יַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/025.yaml
  text: For seven days you shall offer a goat as a sin offering each day[a], and they shall offer a bull, a son of the herd, and a ram from the flock[b], without blemish.
translation:
  language: pt
  text: Durante sete dias, você oferecerá, a cada dia, um bode como oferta pelo pecado; e eles oferecerão[a] um novilho[b] e um carneiro do rebanho, ambos sem defeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico muda aqui do singular (“você oferecerá”) para o plural (“eles oferecerão”). A tradução preserva essa mudança.
    reason: alternative_reading
  - marker: b
    text: Hebraico, literalmente, “um touro, filho do gado”, uma expressão sacrificial que pode ser traduzida como “novilho” ou “touro do gado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: A expressão indica duração; “durante sete dias” comunica isso de modo natural e claro em português.
- source_word: תַּעֲשֶׂה / יַעֲשׂוּ
  choice: você oferecerá / eles oferecerão
  rationale: Embora o verbo עשה signifique em sentido básico “fazer”, no contexto sacrificial tem o sentido de realizar ou oferecer um sacrifício. A tradução também preserva a mudança de pessoa e número do hebraico.
- source_word: שְׂעִיר חַטָּאת
  choice: um bode como oferta pelo pecado
  rationale: שְׂעִיר designa aqui um bode, e חַטָּאת, no contexto ritual, é a oferta pelo pecado, não o pecado em abstrato.
- source_word: לַיּוֹם
  choice: a cada dia
  rationale: A expressão indica a repetição diária do sacrifício ao longo dos sete dias.
- source_word: וּפַר בֶּן בָּקָר
  choice: um touro, cria do gado
  rationale: A formulação conserva a aposição hebraica (“touro, filho/cria do gado”) em português compreensível, sem reduzi-la silenciosamente a “novilho”.
- source_word: וְאַיִל מִן הַצֹּאן
  choice: e um carneiro do rebanho
  rationale: 'אַיִל é “carneiro”, e מִן הַצֹּאן indica sua procedência ou classe: o rebanho.'
- source_word: תְּמִימִים
  choice: ambos sem defeito
  rationale: No vocabulário sacrificial, תמים descreve animais livres de defeito. O plural masculino se refere naturalmente ao touro e ao carneiro mencionados imediatamente antes.
theological_decisions:
- issue: Mudança do sujeito gramatical nas instruções sacrificiais
  choice: Preservar “você oferecerá” e depois “eles oferecerão”.
  alternative: Uniformizar os dois verbos no singular ou no plural.
  rationale: O hebraico muda explicitamente da segunda pessoa do singular (תַּעֲשֶׂה) para a terceira pessoa do plural (יַעֲשׂוּ). Como o texto não explica a mudança, a tradução mantém essa tensão em vez de identificar implicitamente os agentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para tornar explícita a segunda pessoa singular do hebraico e preservar o contraste com “eles”. A pontuação separa com clareza as duas partes da instrução; “ambos” explicita que o plural “sem defeito” qualifica o touro e o carneiro.
