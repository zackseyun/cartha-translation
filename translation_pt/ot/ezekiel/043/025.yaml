  terminology: “Bode como oferta pelo pecado”, “carneiro”, “rebanho” e “sem defeito” são terminologia adequada. “Novilho” substitui a formulação pouco idiomática “touro, cria do gado”, enquanto a nota mantém a informação sobre a expressão hebraica literal.
