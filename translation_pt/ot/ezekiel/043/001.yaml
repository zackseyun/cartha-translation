  text: וַ/יּוֹלִכֵ֖/נִי אֶל הַ/שָּׁ֑עַר שַׁ֕עַר אֲשֶׁ֥ר פֹּנֶ֖ה דֶּ֥רֶךְ הַ/קָּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/001.yaml
  text: Then he brought me to the gate[a], the gate that faces east.
translation:
  language: pt
  text: Então ele me levou até o portão[a], o portão voltado para o leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete “portão”: “até o portão, o portão voltado para o leste”. A repetição acrescenta especificidade e ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: Então ele me levou
  rationale: O hifil de הלך com sufixo de primeira pessoa significa fazer alguém ir, portanto “levar” ou “conduzir”. “Então ele me levou” expressa com naturalidade tanto o movimento espacial quanto a progressão narrativa do waw consecutivo.
- source_word: אֶל
  choice: até
  rationale: A preposição indica direção ou destino. Depois de “levou”, “até” comunica de modo natural a chegada ao portão; “para” também seria possível.
- source_word: הַשַּׁעַר
  choice: o portão
  rationale: O substantivo definido שׁער designa uma porta ou entrada monumental. No contexto da estrutura do templo, “portão” distingue melhor essa entrada arquitetônica de uma porta comum.
- source_word: שַׁעַר
  choice: o portão
  rationale: A segunda ocorrência está em aposição e especifica a primeira. A repetição foi mantida para preservar a estrutura e a ênfase do hebraico.
- source_word: אֲשֶׁר
  choice: que
  rationale: Partícula relativa traduzida pela forma corrente e natural em português.
- source_word: פֹּנֶה
  choice: voltado
  rationale: O particípio de פנה descreve a orientação da entrada. “Voltado” transmite de maneira idiomática que o portão está orientado em determinada direção.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: para o leste
  rationale: A construção significa “na direção do leste”. Em português, com “voltado”, a formulação natural é “para o leste”; קדים indica aqui o ponto cardeal, não o vento oriental.
theological_decisions: []
