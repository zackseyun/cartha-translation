  text: וּ/כְב֥וֹד יְהוָ֖ה בָּ֣א אֶל הַ/בָּ֑יִת דֶּ֣רֶךְ שַׁ֔עַר אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/004.yaml
  text: And the glory of Yahweh came into the house by way of the gate that faces east[a][b].
translation:
  language: pt
  text: E a glória de Yahweh entrou no templo pelo portão que dá para o leste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa”; nesta visão, refere-se ao edifício do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְב֥וֹד
  choice: E a glória
  rationale: כָּבוֹד designa aqui a glória manifesta, isto é, a presença majestosa de Deus; a conjunção וּ é traduzida naturalmente por “E”.
- source_word: יְהוָ֖ה
  choice: Yahweh
  rationale: O tetragrama é transliterado como nome próprio, preservando o nome divino presente no hebraico.
- source_word: בָּ֣א אֶל הַ/בָּ֑יִת
  choice: entrou no templo
  rationale: בוא com אֶל indica movimento para dentro. Embora בַּיִת signifique literalmente “casa”, no contexto da visão refere-se ao edifício do templo; “entrou no templo” comunica esse referente com clareza em português.
- source_word: דֶּ֣רֶךְ שַׁ֔עַר
  choice: pelo portão
  rationale: דֶּרֶךְ assinala a rota ou passagem, e שַׁעַר é o portão do conjunto arquitetônico. “Pelo portão” é idiomático e exato.
- source_word: אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים
  choice: que dá para o leste
  rationale: A expressão com פָּנִים descreve a orientação da frente do portão. “Dá para o leste” preserva a imagem arquitetônica em português natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama como nome próprio. “Yahweh” o representa diretamente sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sentido de כְבוֹד יְהוָה
  choice: a glória de Yahweh
  alternative: a honra de Yahweh; a presença de Yahweh
  rationale: Neste contexto visionário, כָּבוֹד é a manifestação majestosa da presença divina. “Glória” conserva o termo e sua densidade teológica sem reduzir a expressão a mera honra nem explicá-la por paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Portão” distingue a entrada arquitetônica de uma porta comum; “leste” é mais corrente no português brasileiro do que “oriente”. O marcador [a] aparece no texto principal.
