  text: וְ/לָקַחְתָּ֣ מִ/דָּמ֗/וֹ וְ/נָ֨תַתָּ֜ה עַל אַרְבַּ֤ע קַרְנֹתָי/ו֙ וְ/אֶל אַרְבַּע֙ פִּנּ֣וֹת הָ/עֲזָרָ֔ה וְ/אֶֽל הַ/גְּב֖וּל סָבִ֑יב וְ/חִטֵּאתָ֥ אוֹת֖/וֹ וְ/כִפַּרְתָּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/020.yaml
  text: And you shall take some of its blood and put it on its four horns[a], on the four corners of the ledge, and on the border all around; so you shall purify it and make atonement for it.
translation:
  language: pt
  text: Você tomará um pouco do sangue dele e o colocará sobre os quatro chifres do altar, sobre os quatro cantos da plataforma[a] e sobre a borda ao redor. Assim, você o purificará e fará expiação por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saliência” ou “patamar”. O termo hebraico parece referir-se à estrutura ou plataforma que circunda o altar na visão de Ezequiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּמוֹ
  choice: um pouco do sangue dele
  rationale: 'A preposição מן tem sentido partitivo: toma-se uma porção do sangue, não necessariamente todo ele.'
- source_word: קַרְנֹתָיו
  choice: os quatro chifres do altar
  rationale: Em contexto cultual, קֶרֶן designa as projeções em forma de chifre nos cantos do altar. A explicitação “do altar” torna claro o referente do pronome hebraico.
- source_word: פִּנּוֹת הָעֲזָרָה
  choice: os quatro cantos da plataforma
  rationale: פִּנּוֹת significa “cantos”; neste contexto, עֲזָרָה parece designar uma estrutura ou plataforma que circunda o altar, e não o pátio do templo.
- source_word: הַגְּבוּל סָבִיב
  choice: a borda ao redor
  rationale: גְּבוּל indica o limite ou a borda da estrutura, enquanto סָבִיב expressa que ela se estende ao redor.
- source_word: וְחִטֵּאתָ אֹתוֹ
  choice: Assim, você o purificará
  rationale: O Piel de חטא em contexto sacrificial descreve a purificação ritual, e não o ato de levar alguém a pecar.
- source_word: וְכִפַּרְתָּהוּ
  choice: fará expiação por ele
  rationale: כפר pertence à linguagem ritual de expiação. A tradução conserva sua força cultual sem definir uma teoria específica da expiação.
theological_decisions:
- issue: Distinção entre os verbos rituais חטא (Piel) e כפר
  choice: o purificará e fará expiação por ele
  alternative: o limpará e o purgará
  rationale: O hebraico emprega dois verbos relacionados, mas distintos. A formulação escolhida preserva tanto a purificação ritual quanto a expiação, sem fundi-las em uma única ação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O futuro verbal conserva o caráter prescritivo da sequência hebraica. “Chifres do altar” mantém a terminologia cultual tradicional, enquanto “plataforma” comunica de modo acessível a arquitetura descrita.
