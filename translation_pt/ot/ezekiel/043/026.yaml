  yaml_path: translation/ot/ezekiel/043/026.yaml
  text: For seven days they shall make atonement for the altar and cleanse it[a], and they shall consecrate it.
translation:
  language: pt
  text: Durante sete dias, farão expiação pelo altar, o purificarão e o consagrarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “encherão sua mão”, expressão cultual que pode significar instalar ou consagrar para o serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: O acusativo de duração indica o período ao longo do qual os ritos serão realizados; “durante sete dias” expressa isso com naturalidade em português.
- source_word: יְכַפְּרוּ אֶת הַמִּזְבֵּחַ
  choice: farão expiação pelo altar
  rationale: Em contexto ritual sacerdotal, כפר denota a realização de ritos expiatórios ou purificadores. “Fazer expiação por” preserva o sentido cultual e é compreensível em português bíblico atual.
- source_word: וְטִהֲרוּ אֹתוֹ
  choice: o purificarão
  rationale: טהר, neste contexto ritual, significa tornar puro ou purificar. “Purificar” conserva claramente a dimensão cerimonial e evita sugerir apenas uma limpeza física.
- source_word: וּמִלְאוּ יָדוֹ
  choice: e o consagrarão
  rationale: A expressão literalmente significa “encher a mão dele”, mas funciona como idioma cultual de instalação ou consagração para o serviço. Aplicada ao altar, “consagrar” é natural e preserva sua destinação formal ao culto.
theological_decisions:
- issue: Sentido da expressão cultual וּמִלְאוּ יָדוֹ aplicada ao altar
  choice: e o consagrarão
  alternative: e lhe encherão a mão; e o instalarão para o serviço
  rationale: A tradução literal seria obscura em português, e “ordenar” normalmente se aplica a pessoas, não a altares. “Consagrar” comunica adequadamente a colocação formal do altar em serviço, enquanto a nota preserva a forma concreta e a amplitude do idioma hebraico.
- issue: Relação entre expiação e purificação do altar
  choice: 'manter as duas ações distintas: “farão expiação” e “o purificarão”'
  alternative: fundir as ações como uma única purificação ritual
  rationale: O hebraico emprega dois verbos coordenados. A tradução conserva essa distinção sem definir de modo indevido a relação teológica precisa entre expiação e purificação.
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual reconhecível. A ordem das ações e o sujeito plural não expresso foram preservados; o futuro do indicativo comunica naturalmente a instrução ritual. O marcador foi colocado após “consagrarão”, termo ao qual a nota efetivamente se refere.
