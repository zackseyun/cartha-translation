source:
  edition: WLC
  text: זֹ֖את תּוֹרַ֣ת הַ/בָּ֑יִת עַל רֹ֣אשׁ הָ֠/הָר כָּל גְּבֻל֞/וֹ סָבִ֤יב סָבִיב֙ קֹ֣דֶשׁ קָדָשִׁ֔ים הִנֵּה זֹ֖את תּוֹרַ֥ת הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/012.yaml
  text: 'This is the law of the house: on the top of the mountain[a], all its surrounding territory is most holy. Behold[b], this is the law of the house.'
translation:
  language: pt
  text: 'Esta é a lei do templo: no alto do monte, todo o seu território ao redor[a] é santíssimo.[b] Eis que esta é a lei do templo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o seu limite em redor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “santo dos santos”, isto é, “santíssimo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  choice: a lei do templo
  rationale: תּוֹרָה pode significar “lei” ou “instrução”; aqui apresenta a norma que rege o templo e sua área. Embora בַּיִת signifique literalmente “casa”, “templo” comunica com naturalidade o referente no contexto.
- source_word: עַל רֹאשׁ הָהָר
  choice: no alto do monte
  rationale: רֹאשׁ significa literalmente “cabeça”, mas, em contexto topográfico, indica o alto ou cume. “No alto do monte” é natural e preciso em português.
- source_word: כָּל גְּבֻלוֹ סָבִיב סָבִיב
  choice: todo o seu território ao redor
  rationale: גְּבוּל pode designar limite, fronteira ou território. O contexto favorece a área inteira que circunda o templo; a repetição סָבִיב סָבִיב expressa abrangência completa.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssimo
  rationale: A construção hebraica intensiva, literalmente “santo dos santos”, funciona aqui como superlativo e qualifica toda a área, não apenas o santuário interior.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força solene do marcador que chama atenção para a reafirmação conclusiva.
- source_word: זֹאת ... זֹאת
  choice: Esta ... esta
  rationale: A repetição do demonstrativo foi mantida para conservar a moldura enfática do versículo.
theological_decisions:
- issue: Alcance da santidade máxima
  choice: “santíssimo” qualifica todo o território ao redor do templo
  alternative: entender “Santo dos Santos” como nome de um recinto interior específico
  rationale: A sintaxe liga קֹדֶשׁ קָדָשִׁים a כָּל גְּבֻלוֹ סָבִיב סָבִיב, indicando que toda a área delimitada no alto do monte possui santidade máxima.
translation_notes:
  register: Português moderno, solene e acessível. “Templo” esclarece o referente contextual de “casa”; “Eis que” conserva a ênfase discursiva sem recorrer a linguagem excessivamente arcaica.
