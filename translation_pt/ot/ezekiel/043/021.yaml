  source_fidelity: A tradução reproduz adequadamente a sequência ritual, o novilho sacrificial, o lugar designado da Casa e sua localização fora do santuário. Contudo, «o queimarão» introduz um sujeito plural indeterminado que não corresponde à forma hebraica singular e cria uma mudança de referência desnecessariamente abrupta após «você pegará».
  naturalness: «Então você pegará ... e o queimarão» é gramaticalmente possível, mas pouco natural e coeso em português moderno, pois alterna o destinatário singular com um agente plural indeterminado. Manter a instrução dirigida a «você» produz uma leitura clara e idiomática.
  terminology: «Novilho», «oferta pelo pecado», «Casa» e «santuário» são escolhas defensáveis no registro cultual. As notas preservam adequadamente a alternativa «oferta de purificação» e esclarecem o sentido cultual de «Casa».
  issues:
