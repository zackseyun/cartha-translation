    rationale: וּשְׂרָפוֹ traz forma verbal masculina singular com sufixo objeto singular. Embora o hebraico mude de pessoa na sequência instrucional, o plural indeterminado português não preserva essa forma e torna o encadeamento com «você pegará» desnecessariamente estranho. A suavização para uma sequência dirigida ao interlocutor é segura e segue a equivalência ótima adotada no audit trail inglês.
