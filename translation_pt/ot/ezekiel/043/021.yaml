base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/021.yaml
  text: Then you shall take the bull of the sin offering and burn it in the appointed place of the house[b][a], outside the sanctuary.
translation:
  language: pt
  text: Então você pegará o novilho da oferta pelo pecado[a] e o queimará no lugar designado da Casa[b], fora do santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o novilho para a oferta pelo pecado”; também é possível: “o novilho da oferta de purificação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no lugar designado da Casa”. Aqui, “Casa” se refere ao complexo do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Então você pegará
  rationale: O waw com qatal prossegue a sequência ritual. “Então” explicita a ordem do procedimento, e o futuro mantém o valor diretivo em português natural.
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho, frequentemente jovem, oferecido em sacrifício. “Novilho” é corrente no registro bíblico-sacrificial português.
- source_word: הַחַטָּאת
  choice: da oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת nomeia a oferta, não apenas o pecado. A formulação tradicional é clara, enquanto “oferta de purificação” permanece uma alternativa possível.
- source_word: וּשְׂרָפוֹ
  choice: e o queimarão
  rationale: A forma hebraica está na terceira pessoa masculina singular, com objeto pronominal. O português emprega sujeito indeterminado no plural para preservar a mudança em relação ao destinatário sem introduzir uma pessoa específica inexistente no texto.
- source_word: בְּמִפְקַד הַבַּיִת
  choice: no lugar designado da Casa
  rationale: מִפְקָד indica aqui um lugar determinado ou designado. “Casa” preserva הַבַּיִת; a nota esclarece que se trata do complexo do templo.
- source_word: מִחוּץ לַמִּקְדָּשׁ
  choice: fora do santuário
  rationale: Tradução direta e natural, preservando a distinção espacial e cultual.
theological_decisions:
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: “Oferta pelo pecado” é a expressão cultual mais reconhecível e lexicalmente adequada; a alternativa destaca a função purificadora e é registrada em nota para preservar a amplitude do termo.
- issue: Mudança de pessoa em וּשְׂרָפוֹ
  choice: o queimarão
  alternative: queime-o
  rationale: O hebraico passa da segunda pessoa (“você pegará”) para a terceira pessoa (“ele o queimará”). O sujeito indeterminado em português conserva essa mudança sem pressupor a identidade do executor; a alternativa suavizaria a construção em uma sequência inteiramente dirigida ao interlocutor.
- issue: Referente de הַבַּיִת
  choice: Casa
  alternative: templo
  rationale: “Casa” conserva a metáfora nominal do hebraico e sua possível distinção em relação a מִקְדָּשׁ; a nota fornece o referente arquitetônico sem apagar essa diferença lexical.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial reconhecível. A capitalização de “Casa” sinaliza o uso cultual específico sem substituir o termo hebraico por “templo”. Todos os marcadores de nota aparecem no texto principal.
