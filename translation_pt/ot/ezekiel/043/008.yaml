source:
  edition: WLC
  text: בְּ/תִתָּ֨/ם סִפָּ֜/ם אֶת סִפִּ֗/י וּ/מְזֽוּזָתָ/ם֙ אֵ֣צֶל מְזוּזָתִ֔/י וְ/הַ/קִּ֖יר בֵּינִ֣/י וּ/בֵֽינֵי/הֶ֑ם וְ/טִמְּא֣וּ אֶת שֵׁ֣ם קָדְשִׁ֗/י בְּ/תֽוֹעֲבוֹתָ/ם֙ אֲשֶׁ֣ר עָשׂ֔וּ וָ/אֲכַ֥ל אֹתָ֖/ם בְּ/אַפִּֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/008.yaml
  text: When they set their threshold beside my threshold and their doorposts beside my doorposts[a], with only the wall between me and them, they defiled my holy name by the abominations that they committed[c][b]; so I consumed them in my anger.
translation:
  language: pt
  text: Quando colocaram a soleira deles junto à minha soleira[a] e os batentes deles junto aos meus batentes[b], com a parede entre mim e eles, profanaram o meu santo nome com as abominações que praticaram; por isso, eu os consumi na minha ira[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o limiar deles junto ao meu limiar”. O termo hebraico pode designar a soleira ou o limiar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os umbrais deles junto aos meus umbrais”. O termo hebraico designa os postes laterais ou batentes de uma porta.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “eu os comi”. Neste contexto, o idioma hebraico significa que Deus os consumiu ou devorou em juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִתָּם
  choice: Quando colocaram
  rationale: A preposição בְּ com o infinitivo construto de נתן introduz uma circunstância temporal. A formulação é natural em português e conserva essa relação.
- source_word: סִפָּם / סִפִּי
  choice: a soleira deles / a minha soleira
  rationale: סַף pode designar a soleira ou o limiar de uma porta. “Soleira” mantém com clareza a imagem arquitetônica.
- source_word: מְזוּזָתָם / מְזוּזָתִי
  choice: os batentes deles / os meus batentes
  rationale: מְזוּזָה designa o poste lateral ou batente de uma porta. “Batentes” é corrente e adequado ao contexto arquitetônico.
- source_word: אֵצֶל
  choice: junto a
  rationale: A preposição expressa proximidade imediata; “junto a” é claro e idiomático.
- source_word: וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  choice: com a parede entre mim e eles
  rationale: A oração hebraica não tem verbo expresso. Esta construção preserva seu valor circunstancial sem acrescentar que havia “somente” uma parede.
- source_word: וְטִמְּאוּ
  choice: profanaram
  rationale: No piel, טמא significa tornar impuro ou contaminar. Com “meu santo nome”, “profanaram” comunica naturalmente a violação da santidade no contexto, embora “contaminaram” seja lexicalmente possível.
- source_word: שֵׁם קָדְשִׁי
  choice: o meu santo nome
  rationale: Reproduz de modo literal e idiomático a expressão hebraica referente ao nome santo de Deus.
- source_word: בְּתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: com as abominações que praticaram
  rationale: A preposição בְּ indica meio, e “praticaram” combina naturalmente em português com atos reiterados designados como abominações, sem enfraquecer o forte juízo moral-religioso de תּוֹעֵבָה.
- source_word: וָאֲכַל אֹתָם
  choice: por isso, eu os consumi
  rationale: אכל significa literalmente “comer”, mas aqui funciona metaforicamente no contexto de juízo. “Consumi” preserva a imagem e a severidade; “por isso” explicita o fluxo consequencial do contexto.
- source_word: בְּאַפִּי
  choice: na minha ira
  rationale: אַף, literalmente associado ao nariz, é um idioma hebraico para ira. “Ira” mantém o registro solene e a intensidade do texto.
theological_decisions:
- issue: Linguagem antropomórfica de juízo em וָאֲכַל אֹתָם
  choice: eu os consumi
  alternative: eu os devorei; eu os destruí
  rationale: O verbo é metafórico neste contexto de juízo divino. “Consumi” evita uma leitura crassamente literal, conserva a força da metáfora e não reduz o enunciado a uma paráfrase genérica como “destruí”.
- issue: Relação espacial expressa por וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  choice: com a parede entre mim e eles
  alternative: com apenas a parede entre mim e eles
  rationale: O hebraico afirma que a parede estava entre Deus e eles, mas não contém uma palavra inequívoca para “apenas”. A tradução preserva a imagem e evita resolver por explicitação uma possível implicação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo arquitetônico do hebraico foram mantidos. Evitou-se acrescentar “apenas” à referência à parede, pois essa ideia pode estar implícita no contexto, mas não é lexicalmente expressa no versículo.
