base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/023.yaml
  text: When you have finished making purification[c][b][a], you shall present a flawless young bull and a flawless ram from the flock.
translation:
  language: pt
  text: Quando você terminar de purificar[a], apresentará um novilho[b] sem defeito[c] e um carneiro do rebanho, sem defeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fazer expiação” ou “limpar do pecado”. Em contextos sacrificiais, o verbo hebraico pode indicar a purificação ou a remoção ritual do pecado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um touro, filho do gado”.
    reason: lexical_alternative
  - marker: c
    text: Ou “íntegro”. A mesma palavra hebraica é usada também para o carneiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכַלּוֹתְךָ
  choice: Quando você terminar
  rationale: A preposição בְּ com o infinitivo construto de כלה e o sufixo de segunda pessoa masculina singular forma uma oração temporal e indica a conclusão da ação. Esta formulação é natural e amplamente compreensível em português.
- source_word: מֵחַטֵּא
  choice: de purificar
  rationale: Neste contexto sacrificial, a forma intensiva de חטא expressa a remoção ritual de pecado ou impureza. “Purificar” comunica esse sentido sem restringi-lo indevidamente à expiação.
- source_word: תַּקְרִיב
  choice: apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa fazer chegar, apresentar ou oferecer. “Apresentará” conserva o caráter ritual e o valor verbal prospectivo.
- source_word: פַּר בֶּן בָּקָר
  choice: um novilho
  rationale: A expressão designa um bovino macho relativamente jovem. “Novilho” é conciso e idiomático, enquanto a tradução literal é preservada em nota.
- source_word: תָּמִים
  choice: sem defeito
  rationale: Aplicado a animais sacrificiais, תמים indica ausência de defeito físico. A expressão é clara, tradicional e precisa no contexto ritual.
- source_word: וְאַיִל
  choice: e um carneiro
  rationale: אַיִל é o termo comum para um carneiro adulto.
- source_word: מִן הַצֹּאן
  choice: do rebanho
  rationale: צאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras. “Do rebanho” preserva a formulação concisa e não limita o termo além do hebraico.
- source_word: תָּמִים
  choice: sem defeito
  rationale: A repetição do adjetivo em referência ao carneiro é mantida para refletir a exigência explícita do texto.
theological_decisions:
- issue: Sentido ritual de חטא na consagração do altar
  choice: purificar
  alternative: fazer expiação; limpar do pecado
  rationale: O verbo descreve a remoção ritual de pecado ou impureza na sequência de consagração. “Purificar” conserva a amplitude cultual do termo, enquanto as alternativas são registradas sem impor uma interpretação teológica mais estreita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. O tratamento por “você” torna explícita a segunda pessoa masculina singular do hebraico sem recorrer a uma flexão hoje pouco corrente. A repetição de “sem defeito” acompanha a repetição do original.
