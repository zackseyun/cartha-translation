base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/013.yaml
  text: 'And these are the measurements of the altar in cubits (the cubit being a cubit and a handbreadth): its gutter shall be one cubit[a], and one cubit its width, and its border on its rim all around shall be one span[c][b]. And this shall be the base of the altar.'
translation:
  language: pt
  text: 'Estas são as medidas do altar em côvados (cada côvado equivalendo a um côvado comum mais uma largura de mão): a canaleta[a] terá um côvado, e sua largura será de um côvado; sua borda, em toda a volta da sua beirada, terá um palmo. Esta é a base[b] do altar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rebaixo”, “cavidade” ou “base”. O elemento arquitetônico indicado pelo termo hebraico é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “parte traseira”, “altura” ou “estrutura elevada”. O sentido exato do termo hebraico neste contexto é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹת
  choice: medidas
  rationale: Expressa com naturalidade as especificações dimensionais do altar no contexto arquitetônico.
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  choice: em côvados — cada côvado correspondia a um côvado comum mais um palmo
  rationale: Torna explícito que a unidade empregada é o côvado longo, sem eliminar a comparação interna do hebraico.
- source_word: חֵיק
  choice: canaleta
  rationale: No contexto, parece designar uma parte baixa, rebaixada e circundante da estrutura. 'Canaleta' comunica essa provável função, enquanto a incerteza do referente arquitetônico é preservada em nota.
- source_word: רֹחַב
  choice: largura
  rationale: É o equivalente dimensional direto e idiomático em português.
- source_word: גְּבוּלָהּ
  choice: borda
  rationale: Indica o limite ou rebordo que acompanha a extremidade da estrutura.
- source_word: שְׂפָתָהּ
  choice: beirada
  rationale: Reproduz concretamente a imagem literal de 'lábio' em linguagem arquitetônica corrente e permite distingui-la da borda mencionada antes.
- source_word: זֶרֶת
  choice: palmo
  rationale: É o nome português tradicional e compreensível da medida baseada na extensão da mão.
- source_word: גַּב
  choice: base
  rationale: No encadeamento das dimensões do altar, 'base' oferece uma leitura arquitetônica coerente, embora o termo hebraico também possa indicar a parte traseira, a altura ou uma estrutura elevada; a ambiguidade é registrada em nota.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Equivalente padrão para a estrutura sacrificial descrita na visão do templo.
theological_decisions:
- issue: Termos arquitetônicos raros e de referente incerto na descrição do altar
  choice: Usar 'canaleta' para חֵיק e 'base' para גַּב, preservando em notas as alternativas plausíveis
  alternative: Traduzir חֵיק por 'rebaixo', 'cavidade' ou 'base', e גַּב por 'parte traseira', 'altura' ou 'estrutura elevada'
  rationale: A passagem fornece medidas, mas não permite reconstruir com certeza todos os elementos arquitetônicos. O texto principal deve permanecer concreto e legível sem apresentar como indiscutível uma reconstrução específica.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia arquitetônica clara. O travessão integra naturalmente a explicação da unidade de medida. 'Côvado comum mais um palmo' evita a formulação circular do hebraico sem ocultar que se trata do côvado longo. A profundidade da canaleta é inferida do contraste com a largura, como exige a descrição dimensional, mas sem especificar além disso sua engenharia.
