revisions:
- from: 'Estas são as medidas do altar em côvados — cada côvado correspondia a um côvado comum mais um palmo: a canaleta[a] tinha um côvado de profundidade e um côvado de largura; sua borda, junto à beirada e em toda a volta, media um palmo. Esta era a base[b] do altar.'
  to: 'Estas são as medidas do altar em côvados (cada côvado equivalendo a um côvado comum mais uma largura de mão): a canaleta[a] terá um côvado, e sua largura será de um côvado; sua borda, em toda a volta da sua beirada, terá um palmo. Esta é a base[b] do altar.'
  rationale: A revisão remove uma especificação dimensional não dita no hebraico, distingue «largura de mão» de «palmo» e melhora a fluência sem resolver de modo excessivamente específico os elementos arquitetônicos incertos. As âncoras das notas permanecem ligadas aos dois termos de referente disputado.
