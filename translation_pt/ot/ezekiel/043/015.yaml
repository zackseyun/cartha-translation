  text: And the altar hearth shall be four cubits[a], and from the altar hearth and upward, four horns.
translation:
  language: pt
  text: A lareira do altar[a] terá quatro côvados de altura; e, da lareira do altar para cima, haverá quatro chifres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos har’el e ari’el são difíceis neste contexto. Também podem ser traduzidos mais literalmente como “lareira de Deus” ou transliterados como “Ariel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְאֵל / אֲרִאֵיל
  choice: a lareira do altar / dela
  rationale: No contexto das dimensões do altar, os dois termos hebraicos relacionados designam sua parte superior, onde se queimava a oferta. “Lareira do altar” comunica essa função cultual sem tratar Ariel como nome próprio; na segunda ocorrência, o pronome “dela” evita uma repetição pesada em português.
- source_word: אַרְבַּע אַמּוֹת
  choice: quatro côvados de altura
  rationale: Mantém a unidade antiga. “De altura” explicita a dimensão vertical indicada pelo contexto imediato e pela sequência “para cima” no hebraico.
- source_word: וּלְמַעְלָה
  choice: se erguerão
  rationale: Expressa em português natural a projeção ascendente dos chifres a partir da parte superior do altar.
- source_word: הַקְּרָנוֹת אַרְבַּע
  choice: quatro chifres
  rationale: Designa as quatro projeções em forma de chifre nos cantos do altar e preserva a imagem concreta do hebraico.
