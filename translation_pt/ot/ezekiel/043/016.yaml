  text: ו/ה/אראיל שְׁתֵּ֤ים עֶשְׂרֵה֙ אֹ֔רֶךְ בִּ/שְׁתֵּ֥ים עֶשְׂרֵ֖ה רֹ֑חַב רָב֕וּעַ אֶ֖ל אַרְבַּ֥עַת רְבָעָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/016.yaml
  text: And the altar hearth was twelve cubits long by twelve wide[b][a], square on its four sides.
translation:
  language: pt
  text: A lareira do altar tinha doze côvados de comprimento por doze de largura[b]; era quadrada em seus quatro lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em direção às suas quatro partes”; também pode ser traduzido como “em seus quatro cantos”.'
    reason: lexical_alternative
  - marker: b
    text: A unidade “côvados” está implícita, com base nas medidas do altar apresentadas no contexto imediato.
    reason: cross_reference
lexical_decisions:
- source_word: הָאֲרִיאֵל
  choice: a lareira do altar
  rationale: No contexto arquitetônico e cultual da visão, designa a parte superior do altar onde o fogo e os sacrifícios eram colocados, não o altar inteiro; evita a transliteração opaca “Ariel”.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: doze
  rationale: Equivalente cardinal direto.
- source_word: אֹרֶךְ
  choice: de comprimento
  rationale: Expressão portuguesa natural para a dimensão longitudinal.
- source_word: בִּשְׁתֵּים עֶשְׂרֵה רֹחַב
  choice: por doze de largura
  rationale: Reproduz com clareza a fórmula de medidas e o paralelismo entre comprimento e largura.
- source_word: רָבוּעַ
  choice: quadrada
  rationale: Indica diretamente a forma da lareira do altar.
- source_word: אֶל אַרְבַּעַת רְבָעָיו
  choice: em seus quatro lados
  rationale: Comunica naturalmente a referência às quatro partes ou direções da estrutura, sem resolver a expressão hebraica como “cantos” no texto principal.
- source_word: côvados (implícito no contexto)
  choice: côvados
  rationale: A unidade não é repetida nesta linha hebraica, mas é exigida pelo contexto imediato das medidas do altar e torna as dimensões inteligíveis em português.
