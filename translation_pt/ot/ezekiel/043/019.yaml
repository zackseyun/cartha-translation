source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶל הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֡ם אֲשֶׁ֣ר הֵם֩ מִ/זֶּ֨רַע צָד֜וֹק הַ/קְּרֹבִ֣ים אֵלַ֗/י נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה לְ/שָֽׁרְתֵ֑/נִי פַּ֥ר בֶּן בָּקָ֖ר לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/019.yaml
  text: And you shall give to the Levitical priests who are from the offspring of Zadok[a], who draw near to me to minister to me, declares the Lord GOD, a bull from the herd for a sin offering.
translation:
  language: pt
  text: E você dará aos sacerdotes levitas que são descendentes de Zadoque e se aproximam de mim para me servir — declara o Senhor Yahweh — um novilho do rebanho como oferta pelo pecado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: E você dará
  rationale: O perfeito qal com a conjunção, neste contexto de instruções, tem força diretiva. A formulação conserva tanto a ligação com o versículo anterior quanto o caráter de ordem.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: aos sacerdotes levitas
  rationale: A expressão identifica sacerdotes pertencentes à ordem levítica, sem estender a função sacerdotal indistintamente a todos os levitas.
- source_word: אֲשֶׁר הֵם מִזֶּרַע צָדוֹק
  choice: que são descendentes de Zadoque
  rationale: Transmite naturalmente o sentido genealógico de זֶרַע, literalmente “semente” ou “descendência”, sem introduzir linguagem arcaica.
- source_word: הַקְּרֹבִים אֵלַי
  choice: os que se aproximam de mim
  rationale: Preserva a imagem de aproximação e sua conotação sacerdotal de apresentar-se diante de Deus para o serviço sagrado.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética; “Senhor” representa אֲדֹנָי, e “Yahweh” preserva o nome divino representado pelo Tetragrama.
- source_word: לְשָׁרְתֵנִי
  choice: para me servir
  rationale: No contexto sacerdotal, שׁרת designa serviço oficial ou litúrgico. “Servir” é claro e natural em português, enquanto o contexto mantém a especificidade cultual.
- source_word: פַּר בֶּן בָּקָר
  choice: um novilho do rebanho
  rationale: Expressa em português natural a referência a um bovino destinado ao sacrifício. A construção hebraica mais literal, “um touro, filho do gado”, é esclarecida em nota.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, e não apenas o pecado em sentido abstrato.
theological_decisions:
- issue: Representação de אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus
  rationale: 'A tradução distingue os dois elementos do hebraico: אֲדֹנָי como “Senhor” e o nome da aliança יְהוִה como “Yahweh”, evitando fundi-los ou repetir “Senhor”.'
- issue: Sentido cultual de הַקְּרֹבִים e לְשָׁרְתֵנִי
  choice: os que se aproximam de mim para me servir
  alternative: os que chegam perto de mim para ministrar diante de mim
  rationale: A redação mantém a aproximação sacerdotal e o serviço prestado a Deus sem acrescentar uma interpretação denominacional da função.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. “Você dará” mantém o singular da instrução dirigida ao profeta; os travessões delimitam a fórmula profética sem obscurecer a sintaxe principal.
