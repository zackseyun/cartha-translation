  terminology: “Sacerdotes levitas”, “Zadoque”, “Senhor Yahweh”, “servir” e “oferta pelo pecado” são adequados. “Yahweh” preserva o Tetragrama, enquanto “Senhor” representa אֲדֹנָי. A nota explica de modo útil a construção hebraica literal do animal.
