  text: וְ/הִקְרַבְתָּ֖/ם לִ/פְנֵ֣י יְהוָ֑ה וְ/הִשְׁלִ֨יכוּ הַ/כֹּהֲנִ֤ים עֲלֵי/הֶם֙ מֶ֔לַח וְ/הֶעֱל֥וּ אוֹתָ֛/ם עֹלָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/024.yaml
  text: You shall present them before Yahweh[a], and the priests shall throw salt on them and offer them up as a burnt offering to Yahweh.
translation:
  language: pt
  text: Você os apresentará diante de Yahweh, e os sacerdotes lançarão[a] sal sobre eles e os oferecerão como holocausto a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jogarão sal sobre eles”. O verbo hebraico significa literalmente “lançar/jogar”, não o mais específico “aspergir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּם
  choice: Você os apresentará
  rationale: O hifil de קרב significa “fazer chegar perto”, “aproximar” ou “apresentar”. “Apresentará” é natural no contexto sacrificial e mantém essa ação distinta do ato posterior de oferecer o sacrifício.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa posição ou presença, “diante de/na presença de”; a formulação escolhida é concisa e adequada ao contexto do templo.
- source_word: וְהִשְׁלִיכוּ
  choice: lançarão
  rationale: O verbo שלך tem o sentido comum de “lançar/jogar”. A tradução evita o termo ritual mais específico “aspergir”, que não é exigido pelo hebraico.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente de כֹּהֲנִים no contexto do culto do templo.
- source_word: עֲלֵיהֶם מֶלַח
  choice: sal sobre eles
  rationale: A preposição עַל indica que o sal é lançado por cima dos animais apresentados; a ordem foi ajustada para soar natural em português.
- source_word: וְהֶעֱלוּ אוֹתָם
  choice: os oferecerão
  rationale: No uso sacrificial, o hifil de עלה significa “fazer subir” e, por extensão, “oferecer”. O pronome retoma os animais apresentados.
- source_word: עֹלָה
  choice: como holocausto
  rationale: עֹלָה é o termo técnico para a oferta inteiramente queimada. “Holocausto” é a designação bíblica tradicional e amplamente reconhecida em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição לְ marca o destinatário ou a dedicação da oferta; “a Yahweh” preserva essa orientação sacrificial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído pelo título “SENHOR”, preservando o nome pessoal presente no texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino e segue uma transliteração moderna amplamente aceita, sem substituí-lo por um título.
- issue: Sentido sacrificial de עֹלָה
  choice: holocausto
  alternative: oferta queimada; oferta inteiramente queimada
  rationale: “Holocausto” conserva o termo técnico consagrado nas traduções bíblicas em português; o versículo identifica a categoria do sacrifício sem explicar aqui seu simbolismo.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O futuro do presente reproduz o caráter instrutivo da sequência verbal hebraica. Mantém-se a repetição de “Yahweh” e a distinção entre apresentar os animais e oferecê-los como holocausto.
