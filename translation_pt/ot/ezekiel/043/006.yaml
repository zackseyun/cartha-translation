reference: Ezekiel 43:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֛ע מִדַּבֵּ֥ר אֵלַ֖/י מֵ/הַ/בָּ֑יִת וְ/אִ֕ישׁ הָיָ֥ה עֹמֵ֖ד אֶצְלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/006.yaml
  text: Then I heard one speaking to me from the house[b][a], while a man was standing beside me.
translation:
  language: pt
  text: Então ouvi alguém falando comigo de dentro da casa[b][a], enquanto um homem estava em pé ao meu lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouvi uma voz falando comigo de dentro da casa”. O hebraico não traz explicitamente o substantivo “voz” nem identifica quem fala neste versículo.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “a casa” refere-se ao edifício do templo na visão de Ezequiel.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Então ouvi
  rationale: O wayyiqtol de שׁמע faz a narrativa avançar; “Então ouvi” expressa com naturalidade a sequência e a força narrativa passada.
- source_word: מִדַּבֵּר אֵלַי
  choice: alguém falando comigo
  rationale: A construção descreve fala em andamento dirigida ao profeta. “Alguém” fornece em português um sujeito indefinido necessário à fluência sem identificar o falante nem acrescentar explicitamente “voz”.
- source_word: מֵהַבָּיִת
  choice: de dentro da casa
  rationale: בַּיִת significa literalmente “casa” e, no contexto da visão, designa o edifício do templo. “De dentro da casa” transmite a origem interna indicada pelo contexto sem substituir o termo hebraico por “templo”.
- source_word: וְאִישׁ
  choice: enquanto um homem
  rationale: אִישׁ é indefinido, portanto “um homem”. “Enquanto” apresenta a circunstância simultânea de modo natural em português.
- source_word: הָיָה עֹמֵד
  choice: estava em pé
  rationale: A construção היה + particípio indica um estado contínuo no passado; “estava em pé” preserva esse aspecto durativo.
- source_word: אֶצְלִי
  choice: ao meu lado
  rationale: אֵצֶל indica proximidade; “ao meu lado” é uma expressão corrente e espacialmente adequada.
theological_decisions:
- issue: Identidade de quem fala de dentro da casa-templo
  choice: 'Manter o sujeito indefinido: “alguém falando comigo”.'
  alternative: “ouvi a voz que falava comigo” ou “ouvi-o falando comigo”
  rationale: O hebraico não fornece explicitamente o substantivo “voz” nem identifica o falante neste versículo. A formulação indefinida preserva essa ambiguidade, embora o contexto mais amplo possa sugerir o falante divino.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos marcadores [b][a] acompanha os elementos a que se referem no texto: [b] após “casa” e [a] após toda a expressão ambígua.'
