  text: וְ/הָיָה֩ יעמדו עָלָ֜י/ו דַּוָּגִ֗ים מֵ/עֵ֥ין גֶּ֨דִי֙ וְ/עַד עֵ֣ין עֶגְלַ֔יִם מִשְׁט֥וֹחַ לַֽ/חֲרָמִ֖ים יִהְי֑וּ לְ/מִינָ/ה֙ תִּהְיֶ֣ה דְגָתָ֔/ם כִּ/דְגַ֛ת הַ/יָּ֥ם הַ/גָּד֖וֹל רַבָּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/010.yaml
  text: And it will happen that fishermen will stand beside it[a]; from En-gedi even to En-eglaim there will be a place for spreading nets. Their fish will be of many kinds, like the fish of the Great Sea[b], very many.
translation:
  language: pt
  text: Acontecerá que pescadores estarão junto dele, desde En-Gedi até En-Eglaim; haverá ali um lugar para estender redes. Seus peixes serão de muitas espécies[a], como os peixes do Mar Grande[b], e serão muitíssimo numerosos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “seus peixes serão segundo a sua espécie”, expressão que indica grande variedade de espécies.'
    reason: lexical_alternative
  - marker: b
    text: O “Mar Grande” é o mar Mediterrâneo.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Acontecerá
  rationale: Introduz o resultado futuro da visão profética de modo natural e digno, sem o arcaísmo de «e será que».
- source_word: יעמדו עָלָיו דַּוָּגִים
  choice: pescadores ficarão junto dele
  rationale: עמד descreve os pescadores posicionados à margem; «junto dele» retoma o rio e traduz idiomaticamente עָלָיו sem sugerir que estejam sobre a água.
- source_word: מֵעֵין גֶּדִי וְעַד עֵין עֶגְלַיִם
  choice: desde En-Gedi até En-Eglaim
  rationale: A construção מן...ועד indica toda a extensão entre os dois lugares; os topônimos são transliterados.
- source_word: מִשְׁטוֹחַ לַחֲרָמִים
  choice: haverá ali um lugar para estender redes
  rationale: מִשְׁטוֹחַ designa um lugar ou superfície de estendimento, e חֲרָמִים são redes de pesca; «ali» torna clara a referência espacial implícita.
- source_word: לְמִינָהּ תִּהְיֶה דְגָתָם
  choice: Seus peixes serão de toda espécie
  rationale: A expressão literalmente distributiva «segundo a sua espécie» comunica aqui ampla variedade; «de toda espécie» preserva o sentido em português corrente, enquanto «seus» mantém o sufixo plural de דְגָתָם.
- source_word: כִּדְגַת הַיָּם הַגָּדוֹל
  choice: como os peixes do Mar Grande
  rationale: Mantém a designação geográfica bíblica הַיָּם הַגָּדוֹל; sua identificação com o Mediterrâneo fica explicitada em nota.
- source_word: רַבָּה מְאֹד
  choice: muitíssimo numerosos
  rationale: Expressa enfaticamente a enorme abundância dos peixes e concorda naturalmente com o referente plural em português.
