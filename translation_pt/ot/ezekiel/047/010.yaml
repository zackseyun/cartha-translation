review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a cena futura, a localização dos pescadores, a extensão entre os dois topônimos, o local para estender redes e a comparação com os peixes do Mar Grande. Contudo, “de toda espécie” pode sugerir exaustividade (“todas as espécies”), enquanto לְמִינָה expressa variedade segundo as espécies. “De muitas espécies” comunica melhor o sentido contextual sem ampliar a afirmação.
  naturalness: O texto é claro e de registro moderno. “Pescadores estarão junto dele” reproduz mais diretamente o valor de יַעַמְדוּ do que “ficarão”, que pode sugerir permanência em vez de posição.
  terminology: “Mar Grande” é uma boa preservação da designação bíblica, com a identificação mediterrânea devidamente deixada para nota. Os topônimos En-Gedi e En-Eglaim são aceitáveis. A nota deve refletir a formulação literal sem atribuir ao hebraico uma ideia de totalidade.
  issues:
  - severity: medium
    issue: “De toda espécie” pode ser excessivamente abrangente para לְמִינָה.
    rationale: A expressão hebraica significa literalmente “segundo a sua espécie” e, no contexto, indica grande diversidade. “De toda espécie” em português pode afirmar que não falta espécie alguma; “de muitas espécies” preserva a variedade sem essa possível ampliação.
  - severity: low
    issue: “Ficarão junto dele” é menos preciso do que “estarão junto dele”.
    rationale: יַעַמְדוּ descreve pescadores tomando posição ou estando de pé junto às águas. “Ficarão” é possível, mas também pode denotar permanência.
  revised_text: Acontecerá que pescadores estarão junto dele, desde En-Gedi até En-Eglaim; haverá ali um lugar para estender redes. Seus peixes serão de muitas espécies[a], como os peixes do Mar Grande[b], e serão muitíssimo numerosos.
  revised_footnotes:
