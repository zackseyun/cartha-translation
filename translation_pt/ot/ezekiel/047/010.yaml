revisions:
- from: Acontecerá que pescadores ficarão junto dele, desde En-Gedi até En-Eglaim; haverá ali um lugar para estender redes. Seus peixes serão de toda espécie[a], como os peixes do Mar Grande[b], e serão muitíssimo numerosos.
  to: Acontecerá que pescadores estarão junto dele, desde En-Gedi até En-Eglaim; haverá ali um lugar para estender redes. Seus peixes serão de muitas espécies[a], como os peixes do Mar Grande[b], e serão muitíssimo numerosos.
  rationale: A revisão substitui uma formulação potencialmente exaustiva por “de muitas espécies”, que expressa a diversidade pretendida pelo hebraico, e ajusta o verbo dos pescadores para refletir mais diretamente a imagem de estarem posicionados junto às águas. As notas e os demais elementos semânticos são preservados.
  reviewer_model: gpt-5.6-terra
