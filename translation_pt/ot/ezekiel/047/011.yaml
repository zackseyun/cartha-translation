  text: בצאת/ו וּ/גְבָאָ֛י/ו וְ/לֹ֥א יֵרָפְא֖וּ לְ/מֶ֥לַח נִתָּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/011.yaml
  text: But its swamps and marshes will not be healed[b][a]; they are left for salt.
translation:
  language: pt
  text: Mas os seus pântanos e brejos não serão curados[a]; serão destinados ao sal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, suas águas não se tornarão doces ou próprias para uso; o hebraico mantém literalmente a imagem de serem “curadas”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serão entregues ao sal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בצאתו
  choice: os seus pântanos
  rationale: O substantivo designa, neste contexto topográfico, áreas baixas e alagadiças associadas às águas; “pântanos” é natural e mantém o sufixo possessivo referente ao local mencionado no contexto.
- source_word: וגבאיו
  choice: e brejos
  rationale: גבאיו pode indicar poças, depressões ou áreas pantanosas. “Brejos” forma um par natural com “pântanos” e destaca os terrenos alagadiços que não recebem a cura das águas.
- source_word: ולא ירפאו
  choice: não serão curados
  rationale: O nifal de רפא significa literalmente “ser curado”. A escolha conserva a metáfora do contexto, no qual as águas são curadas, sem reduzi-la apenas a “tornar-se doce” ou “potável”.
- source_word: למלח נתנו
  choice: serão destinados ao sal
  rationale: A construção passiva indica que esses terrenos são dados ou reservados para o sal. “Destinados ao sal” expressa com naturalidade a designação, preservando a referência concisa ao sal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a metáfora hebraica de cura das águas e a concisão da expressão final.
