  text: חֲמָ֤ת בֵּר֨וֹתָה֙ סִבְרַ֔יִם אֲשֶׁר֙ בֵּין גְּב֣וּל דַּמֶּ֔שֶׂק וּ/בֵ֖ין גְּב֣וּל חֲמָ֑ת חָצֵר֙ הַתִּיכ֔וֹן אֲשֶׁ֖ר אֶל גְּב֥וּל חַוְרָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/016.yaml
  text: Hamath[a], Berothah, Sibraim—which is between the border of Damascus and the border of Hamath—Hazer-hattikon[c][b], which is toward the border of Hauran.
translation:
  language: pt
  text: Hamate, Berota[a], Sibraim — que fica entre a fronteira de Damasco e a fronteira de Hamate — Hazer-Haticom[b], que fica em direção à fronteira de Haurã.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico traz Berota; alguns relacionam esse lugar a Berotai, mencionado em 2 Samuel 8:8.
    reason: alternative_reading
  - marker: b
    text: Hazer-Haticom provavelmente é um nome de lugar; literalmente, seus componentes podem significar algo como “povoado do meio” ou “recinto central”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que fica junto à fronteira de Haurã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָת
  choice: Hamate
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico; o texto traz apenas o nome Hamate, não a expressão mais extensa “entrada de Hamate”.
- source_word: בֵּרוֹתָה
  choice: Berota
  rationale: Transliteração adaptada ao português da forma massorética Berothah; mantém-se como nome próprio, sem tradução.
- source_word: סִבְרַיִם
  choice: Sibraim
  rationale: Transliteração direta e já corrente em traduções portuguesas do topônimo hebraico.
- source_word: אֲשֶׁר בֵּין גְּבוּל דַּמֶּשֶׂק וּבֵין גְּבוּל חֲמָת
  choice: que fica entre a fronteira de Damasco e a fronteira de Hamate
  rationale: A oração relativa modifica mais naturalmente Sibraim. A repetição de “fronteira” preserva a estrutura hebraica e deixa claro que se trata de uma delimitação geográfica.
- source_word: חָצֵר הַתִּיכוֹן
  choice: Hazer-Haticom
  rationale: Tratado como topônimo composto e transliterado em forma adaptada ao português. A nota registra o sentido possível dos componentes sem transformar silenciosamente o nome próprio em descrição.
- source_word: אֲשֶׁר אֶל גְּבוּל חַוְרָן
  choice: que fica em direção à fronteira de Haurã
  rationale: A preposição אֶל pode indicar direção e, em descrição de limites, também proximidade. A tradução principal conserva o valor direcional sem afirmar que o lugar alcança necessariamente a fronteira.
- source_word: גְּבוּל
  choice: fronteira
  rationale: Neste contexto de delimitação territorial, “fronteira” expressa com clareza a linha limítrofe, sem ampliar o sentido para todo o território.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e legível, com topônimos nas formas tradicionalmente reconhecíveis em português. Os travessões delimitam a oração explicativa referente a Sibraim. Preservou-se por nota a ambiguidade geográfica de אֶל entre direção e proximidade.
