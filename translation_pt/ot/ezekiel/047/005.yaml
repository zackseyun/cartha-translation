  text: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
translation:
  language: pt
  text: Mediu mais mil côvados[a], e então havia um rio que eu não podia atravessar, pois as águas haviam subido — águas fundas para nadar[b], um rio que não se podia atravessar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mil”; a unidade “côvados” é indicada pelo contexto.'
    reason: supplied_unit
  - marker: b
    text: 'Hebraico: “águas de natação”, isto é, águas fundas o bastante para nadar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד אֶלֶף
  choice: Mediu mais mil côvados
  rationale: A forma narrativa dá continuidade à sequência de medições; “mais” expressa naturalmente a repetição. O hebraico traz apenas “mil”, mas “côvados” é a unidade explicitada no contexto imediato.
- source_word: נַחַל
  choice: rio
  rationale: Embora o termo também possa designar um riacho, torrente ou uádi, aqui o curso de água se tornou fundo o bastante para nadar; “rio” comunica melhor a cena visionária.
- source_word: אֲשֶׁר לֹא אוּכַל לַעֲבֹר
  choice: que eu não podia atravessar
  rationale: Preserva a primeira pessoa e expressa diretamente a incapacidade indicada pelo verbo.
- source_word: גָאוּ הַמַּיִם
  choice: as águas haviam subido
  rationale: O verbo descreve águas que se elevam ou avolumam; a formulação se encaixa na progressão da profundidade.
- source_word: מֵי שָׂחוּ
  choice: águas em que era preciso nadar
  rationale: A expressão hebraica, literalmente “águas de natação”, indica água funda o bastante para exigir nado.
- source_word: נַחַל אֲשֶׁר לֹא יֵעָבֵר
  choice: um rio que não se podia atravessar
  rationale: Mantém a construção passiva e a repetição enfática de “rio” presente no hebraico.
