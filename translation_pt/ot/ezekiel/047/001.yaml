id: EZK.47.1
reference: Ezekiel 47:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְשִׁבֵ/נִי֮ אֶל פֶּ֣תַח הַ/בַּיִת֒ וְ/הִנֵּה מַ֣יִם יֹצְאִ֗ים מִ/תַּ֨חַת מִפְתַּ֤ן הַ/בַּ֨יִת֙ קָדִ֔ימָ/ה כִּֽי פְנֵ֥י הַ/בַּ֖יִת קָדִ֑ים וְ/הַ/מַּ֣יִם יֹרְדִ֗ים מִ/תַּ֜חַת מִ/כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/יְמָנִ֔ית מִ/נֶּ֖גֶב לַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
translation:
  language: pt
  text: Então ele me levou de volta à entrada da Casa[a]. E eis que águas saíam de debaixo da soleira da Casa em direção ao leste, pois a frente da Casa dava para o leste. As águas desciam de debaixo do lado direito da Casa[b], ao sul do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do templo”. O hebraico diz literalmente “da Casa”, referindo-se ao edifício do templo na visão de Ezequiel.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “do ombro direito da Casa”. “Ombro” é usado para indicar o lado de uma construção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  choice: Então ele me levou de volta
  rationale: 'O hifil de שוב com sufixo de primeira pessoa tem sentido causativo: ele fez o profeta voltar. “Levou de volta” é natural em português e preserva esse valor.'
- source_word: פֶּתַח הַבַּיִת
  choice: à entrada da Casa
  rationale: פֶּתַח designa a entrada ou abertura. Mantém-se “Casa” para o hebraico הַבַּיִת, deixando em nota a identificação contextual com o templo.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função de chamar a atenção para o que o profeta vê, em registro digno e corrente na narrativa bíblica.
- source_word: מַיִם יֹצְאִים
  choice: águas saíam
  rationale: מַיִם tem forma plural e o particípio expressa ação contínua. “Águas saíam” conserva a forma tradicional e natural em português para uma corrente de água em visão profética.
- source_word: מִתַּחַת מִפְתַּן
  choice: de debaixo da soleira
  rationale: Reproduz a relação espacial dupla do hebraico e traduz מִפְתָּן pelo elemento inferior da entrada, a soleira.
- source_word: קָדִימָה
  choice: em direção ao leste
  rationale: Expressa claramente o valor direcional do advérbio hebraico.
- source_word: כִּי פְנֵי הַבַּיִת קָדִים
  choice: pois a frente da Casa dava para o leste
  rationale: “Dava para” comunica de modo idiomático a orientação da fachada, sem alterar a relação explicativa introduzida por כִּי.
- source_word: יֹרְדִים
  choice: desciam
  rationale: O verbo descreve o movimento descendente das águas; “desciam” é direto e preserva essa imagem sem explicitação excessiva.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: de debaixo do lado direito da Casa
  rationale: כָּתֵף significa literalmente “ombro”, mas em uso arquitetônico indica o lado de uma estrutura; הַיְמָנִית qualifica esse lado como o direito. A nota conserva a imagem literal.
- source_word: מִנֶּגֶב לַמִּזְבֵּחַ
  choice: ao sul do altar
  rationale: Localiza o curso das águas em relação ao altar; נֶגֶב tem aqui valor espacial de “sul”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Casa” recebe inicial maiúscula para sinalizar a referência contextual ao edifício sagrado sem substituir o termo hebraico por “templo”. A sintaxe final mantém separadas a indicação do lado direito da Casa e a localização ao sul do altar.
