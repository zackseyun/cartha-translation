id: EZK.47.1
reference: Ezekiel 47:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְשִׁבֵ/נִי֮ אֶל פֶּ֣תַח הַ/בַּיִת֒ וְ/הִנֵּה מַ֣יִם יֹצְאִ֗ים מִ/תַּ֨חַת מִפְתַּ֤ן הַ/בַּ֨יִת֙ קָדִ֔ימָ/ה כִּֽי פְנֵ֥י הַ/בַּ֖יִת קָדִ֑ים וְ/הַ/מַּ֣יִם יֹרְדִ֗ים מִ/תַּ֜חַת מִ/כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/יְמָנִ֔ית מִ/נֶּ֖גֶב לַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
translation:
  language: pt
  text: Então ele me levou de volta à entrada da casa[a]. E eis que saía água de debaixo da soleira da casa, em direção ao leste, pois a frente da casa dava para o leste. A água descia de debaixo do lado direito da casa[b], ao sul do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do templo”. O hebraico diz literalmente “da casa”, referindo-se ao edifício do templo na visão de Ezequiel.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de debaixo do ombro da casa, o direito”. “Ombro” é usado aqui para indicar o lado de uma construção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  choice: Então ele me levou de volta
  rationale: 'O hifil de שׁוב com sufixo de primeira pessoa tem sentido causativo: “fez-me voltar”. “Levou-me de volta” comunica esse sentido de modo natural em português.'
- source_word: פֶּתַח הַבַּיִת
  choice: à entrada da casa
  rationale: פֶּתַח designa a entrada ou abertura. הַבַּיִת significa literalmente “a casa” e, no contexto da visão, refere-se ao edifício do templo; a tradução mantém o termo concreto do hebraico e esclarece a referência em nota.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função do marcador hebraico de chamar a atenção para o que o profeta vê, em registro elevado, mas reconhecível.
- source_word: מַיִם יֹצְאִים
  choice: saía água
  rationale: Embora מַיִם tenha forma plural em hebraico, “água” funciona naturalmente como nome não contável em português. O particípio expressa uma ação contínua na cena.
- source_word: מִתַּחַת מִפְתַּן
  choice: de debaixo da soleira
  rationale: Reproduz com clareza a relação espacial e traduz מִפְתָּן pelo elemento arquitetônico “soleira”.
- source_word: קָדִימָה
  choice: em direção ao leste
  rationale: Expressa o valor direcional da forma hebraica sem sugerir apenas uma localização estática.
- source_word: כִּי פְנֵי הַבַּיִת קָדִים
  choice: pois a frente da casa dava para o leste
  rationale: “Dava para” é uma maneira natural de indicar a orientação da fachada em português, preservando a explicação introduzida por כִּי.
- source_word: יֹרְדִים
  choice: descia
  rationale: O verbo indica movimento descendente; aplicado à água, “descia” é claro e não acrescenta uma caracterização do fluxo ausente no verbo.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: do lado direito da casa
  rationale: כָּתֵף significa literalmente “ombro”, mas em uso arquitetônico indica um lado ou flanco. הַיְמָנִית especifica que se trata do lado direito; a nota registra a imagem literal.
- source_word: מִנֶּגֶב לַמִּזְבֵּחַ
  choice: ao sul do altar
  rationale: Localiza o curso da água em relação ao altar e traduz diretamente o valor direcional de נֶגֶב.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “casa” e “eis que” para preservar, respectivamente, a concretude lexical e o efeito discursivo do hebraico; as formulações arquitetônicas menos transparentes são esclarecidas em notas.
