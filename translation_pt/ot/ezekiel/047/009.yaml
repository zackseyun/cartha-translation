  text: וְ/הָיָ֣ה כָל נֶ֣פֶשׁ חַיָּ֣ה אֲֽשֶׁר יִשְׁרֹ֡ץ אֶ֣ל כָּל אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְ/הָיָ֥ה הַ/דָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּ/ה הַ/מַּ֣יִם הָ/אֵ֗לֶּה וְ/יֵרָֽפְאוּ֙ וָ/חָ֔י כֹּ֛ל אֲשֶׁר יָ֥בוֹא שָׁ֖מָּ/ה הַ/נָּֽחַל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/009.yaml
  text: And every living creature that swarms[a], wherever the river goes, will live. And there will be very many fish, because these waters go there and are healed[b]; everything will live wherever the river goes.
translation:
  language: pt
  text: Toda criatura vivente que pulula viverá em todo lugar aonde chegarem as duas correntes[a]. Haverá uma quantidade enorme de peixes, porque estas águas chegarão ali e serão curadas[b]. Tudo viverá em todo lugar aonde o rio chegar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa aqui uma forma dual, literalmente “duas correntes”; ela também pode ser entendida de modo mais geral como “correntes” ou “canais do rio”.
    reason: lexical_alternative
  - marker: b
    text: 'Também é possível entender: “estas águas chegarão ali, de modo que as águas dali serão curadas”. A imagem de cura é explícita no hebraico.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ חַיָּה
  choice: ser vivo
  rationale: A expressão designa vida animada em geral; no contexto aquático, “ser vivo” é natural e não sugere especificamente a alma humana.
- source_word: יִשְׁרֹץ
  choice: se move em enxames
  rationale: Preserva a imagem vívida de criaturas aquáticas que pululam ou se agrupam, sem usar um verbo raro ou excessivamente técnico.
- source_word: נַחֲלַיִם
  choice: as duas correntes
  rationale: A forma hebraica é dual, embora o referente exato seja discutido. “Duas correntes” torna visível essa morfologia sem afirmar além dela que sejam necessariamente dois rios distintos.
- source_word: יִחְיֶה
  choice: viverá
  rationale: Reproduz de modo direto a afirmação hebraica sobre o efeito vivificador das águas.
- source_word: הַדָּגָה רַבָּה מְאֹד
  choice: uma quantidade enorme de peixes
  rationale: O substantivo é coletivo e a expressão enfatiza grande abundância; esta formulação é clara e idiomática em português.
- source_word: וְיֵרָפְאוּ
  choice: serão curadas
  rationale: Mantém a imagem explícita de cura empregada pelo hebraico, em vez de reduzi-la interpretativamente a “ficarão doces” ou “se tornarão saudáveis”.
- source_word: וָחָי כֹּל
  choice: Tudo viverá
  rationale: Conserva a abrangência e a concisão da cláusula resumitiva.
- source_word: הַנָּחַל
  choice: o rio
  rationale: No fim do versículo, o hebraico usa o singular. “Rio” convém ao curso de água contínuo da visão e evita a ideia de um leito sazonal.
theological_decisions:
- issue: Imagem visionária da cura das águas
  choice: Conservar a formulação “as águas serão curadas”.
  alternative: Explicitar o resultado físico como “as águas se tornarão próprias para a vida” ou “ficarão saudáveis”.
  rationale: O verbo hebraico apresenta a restauração como cura. Manter a metáfora conserva a força teológica da visão sem especificar uma interpretação doutrinária posterior.
- issue: Relação entre a forma dual no início e o rio singular no fim
  choice: Traduzir respectivamente por “as duas correntes” e “o rio”, com nota sobre a possível compreensão do dual.
  alternative: Uniformizar ambos como “o rio”.
  rationale: A tradução preserva a variação formal do hebraico e sua possível tensão, em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O futuro verbal acompanha o caráter visionário e prospectivo do contexto. A repetição de “águas” na segunda frase ajuda a não atribuir indevidamente a cura a outro referente e permite que a nota registre a ambiguidade sintática.
