  to: Toda criatura vivente que pulula viverá em todo lugar aonde chegarem as duas correntes[a]. Haverá uma quantidade enorme de peixes, porque estas águas chegarão ali e serão curadas[b]. Tudo viverá em todo lugar aonde o rio chegar.
