base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/004.yaml
  text: Again he measured a thousand[a], and led me through the water—water up to the knees. Again he measured a thousand[b], and led me through water up to the waist.
translation:
  language: pt
  text: Mediu mais mil[a] e me fez atravessar as águas, que chegavam aos joelhos. Mediu mais mil e me fez atravessar as águas, que chegavam à cintura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mil”; a unidade “côvados” é entendida com base no versículo anterior.
    reason: cross_reference
  - marker: b
    text: 'Ou: “aos lombos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: mediu mais
  rationale: O verbo מדד descreve a medição feita pelo homem na visão. “Mediu” traduz diretamente o qal; “mais” expressa com naturalidade a repetição da medição no contexto, sem alterar a quantidade.
- source_word: אֶלֶף
  choice: mil
  rationale: O hebraico diz apenas “mil”. A unidade, côvados, é entendida pelo versículo anterior e fica explicitada em nota, evitando acrescentá-la ao texto principal.
- source_word: וַיַּעֲבִרֵנִי
  choice: me fez atravessar
  rationale: 'A forma hifil de עבר com sufixo de primeira pessoa tem sentido causativo: o homem fez o profeta passar pelas águas. A formulação é clara e preserva essa nuance.'
- source_word: בַמַּיִם
  choice: as águas
  rationale: Com o verbo de movimento, a expressão indica que o profeta atravessou as águas. O plural “águas” corresponde ao uso hebraico de מַיִם e mantém o tom da visão.
- source_word: מַיִם בִּרְכָּיִם
  choice: as águas, que chegavam aos joelhos
  rationale: A construção substantivo + parte do corpo indica o nível alcançado pela água. Esta formulação é natural em português e conserva a imagem concreta.
- source_word: מֵי מָתְנָיִם
  choice: as águas, que chegavam à cintura
  rationale: מָתְנַיִם designa a região dos lombos ou da cintura. “Cintura” é a opção moderna mais clara; “lombos” é preservado em nota como alternativa mais formal e literal.
