  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה גֵּ֤ה גְבוּל֙ אֲשֶׁ֣ר תִּתְנַחֲל֣וּ אֶת הָ/אָ֔רֶץ לִ/שְׁנֵ֥י עָשָׂ֖ר שִׁבְטֵ֣י יִשְׂרָאֵ֑ל יוֹסֵ֖ף חֲבָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/013.yaml
  text: 'Thus says the Lord GOD: This is the boundary by which you shall apportion the land as an inheritance among the twelve tribes of Israel[a]; Joseph shall have two portions.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Este é o limite segundo o qual vocês repartirão a terra como herança entre as doze tribos de Israel: José terá duas porções[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «José, porções»; o numeral «duas» é inferido do contexto da distribuição territorial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como “Senhor” e translitera o nome divino יהוה como “Yahweh”, evitando a combinação pouco natural “Senhor SENHOR”.
- source_word: גֵּה גְבוּל
  choice: Este é o limite
  rationale: A expressão de apresentação introduz a delimitação territorial que se segue; “limite” é claro e natural no contexto da distribuição da terra.
- source_word: תִּתְנַחֲלוּ אֶת־הָאָרֶץ
  choice: vocês repartirão a terra como herança
  rationale: O hitpael de נחל, neste contexto, envolve a distribuição da terra em lotes hereditários, não apenas o ato de recebê-la.
- source_word: לִשְׁנֵי עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: entre as doze tribos de Israel
  rationale: “Entre” expressa de modo idiomático a distribuição da terra pelas tribos.
- source_word: יוֹסֵף חֲבָלִים
  choice: José terá duas porções
  rationale: חֲבָלִים designa porções ou lotes territoriais. Embora o hebraico não traga explicitamente o numeral “duas”, o contexto das doze tribos e a divisão de José em Efraim e Manassés indicam uma porção dupla.
theological_decisions:
- issue: Forma portuguesa do nome divino no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: “Senhor Yahweh” distingue o título do nome próprio e preserva de modo transparente o nome divino presente no texto hebraico, sem recorrer a uma duplicação artificial de “Senhor”.
- issue: Explicitação da porção dupla de José
  choice: José terá duas porções
  alternative: José terá porções
  rationale: O plural hebraico é sintaticamente conciso, mas no contexto indica a dupla participação territorial de José por meio de Efraim e Manassés. A explicitação comunica o sentido sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A formulação permanece próxima da estrutura hebraica, mas explicita a função distributiva de נחל e o sentido contextual de חֲבָלִים.
