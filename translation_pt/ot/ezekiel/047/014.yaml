  terminology: «Herança» preserva o campo semântico de נחלה. «Ergui a mão» mantém a imagem do idiomatismo hebraico de juramento, esclarecida em nota. «Cada um como seu irmão» conserva a formulação masculina e distributiva do texto-fonte; a nota pode indicar o sentido de igualdade.
