base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/014.yaml
  text: You shall inherit it[a], each like his brother, concerning which I raised my hand to give it to your fathers[c][b]; and this land shall fall to you as an inheritance.
translation:
  language: pt
  text: Vocês a receberão por herança, cada um como seu irmão[a], a qual ergui a mão[b] para dá-la a seus antepassados; e esta terra lhes caberá como herança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cada um em igualdade com seu irmão”.'
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica usada para prestar juramento; isto é, “jurei”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cairá para vocês”, expressão usada para algo atribuído como herança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְחַלְתֶּם אוֹתָהּ
  choice: Vocês a receberão por herança
  rationale: O verbo נחל, neste contexto de distribuição da terra, indica recebê-la como propriedade hereditária. A construção explicita em português o valor de herança sem sugerir mera ocupação.
- source_word: אִישׁ כְּאָחִיו
  choice: cada um como seu irmão
  rationale: Preserva a formulação distributiva e comparativa do hebraico, cujo sentido contextual é que cada um receberá uma parte em igualdade com seu irmão.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: Eu levantei a mão
  rationale: Mantém a imagem concreta do idioma hebraico de juramento; a nota esclarece o sentido sem substituir a expressão no texto principal.
- source_word: לְתִתָּהּ לַאֲבֹתֵיכֶם
  choice: para dá-la aos seus pais
  rationale: Traduz diretamente o infinitivo נתן e mantém 'pais' para אבות, evocando os antepassados que receberam a promessa.
- source_word: וְנָפְלָה הָאָרֶץ הַזֹּאת לָכֶם בְּנַחֲלָה
  choice: e esta terra lhes caberá como herança
  rationale: '''Caberá'' comunica naturalmente em português o idioma hebraico de uma porção que ''cai'' a alguém por sorteio ou distribuição, preservando o contexto de repartição territorial.'
theological_decisions:
- issue: O idioma de juramento נָשָׂאתִי אֶת יָדִי
  choice: Eu levantei a mão
  alternative: Eu jurei
  rationale: A tradução conserva no texto a imagem do gesto solene, enquanto a nota informa explicitamente que se trata de um juramento.
- issue: A comparação distributiva אִישׁ כְּאָחִיו
  choice: cada um como seu irmão
  alternative: cada um em igualdade com o outro
  rationale: A escolha mantém tanto o caráter distributivo quanto a linguagem familiar masculina do hebraico, sem ocultar que a expressão comunica igualdade na distribuição.
- issue: A expressão idiomática וְנָפְלָה...לָכֶם
  choice: lhes caberá
  alternative: cairá para vocês
  rationale: A tradução evita um decalque pouco natural em português, mas conserva o sentido de uma terra atribuída por lote como herança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “vocês” representa naturalmente a segunda pessoa do plural; “receberão por herança” e “lhes caberá” mantêm o campo semântico da distribuição da terra sem produzir construções artificiais.
