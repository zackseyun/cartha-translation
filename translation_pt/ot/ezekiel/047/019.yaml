  text: וּ/פְאַת֙ נֶ֣גֶב תֵּימָ֔נָ/ה מִ/תָּמָ֗ר עַד מֵי֙ מְרִיב֣וֹת קָדֵ֔שׁ נַחֲלָ֖ה אֶל הַ/יָּ֣ם הַ/גָּד֑וֹל וְ/אֵ֥ת פְּאַת תֵּימָ֖נָ/ה נֶֽגְבָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
translation:
  language: pt
  text: O lado sul, ao sul, irá de Tamar até as águas de Meribote-Cades[a], até o uádi[b] e até o Grande Mar[c]. Este é o lado sul, ao sul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as águas de Meribá-Cades”. O hebraico deste versículo traz “Meribote-Cades”, forma relacionada desse topônimo.'
    reason: alternative_reading
  - marker: b
    text: O termo se refere a um curso de água ou leito de rio, muitas vezes sazonal; também pode ser traduzido por “ribeiro”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o mar Mediterrâneo.
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  choice: lado
  rationale: No contexto da descrição dos limites da terra, designa o lado ou a borda correspondente; “lado” preserva naturalmente a fórmula repetida do hebraico.
- source_word: נֶגֶב / תֵּימָנָה
  choice: lado sul, em direção ao sul
  rationale: Os dois termos direcionais são mantidos para preservar a ênfase e a repetição do hebraico, sem tratar נֶגֶב aqui como o nome próprio da região do Neguebe.
- source_word: מִתָּמָר
  choice: de Tamar
  rationale: Tamar é um topônimo, mantido em transliteração corrente.
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  choice: as águas de Meribote-Cades
  rationale: A tradução acompanha a forma específica do topônimo no texto consonantal hebraico; a forma relacionada e mais conhecida é registrada em nota.
- source_word: נַחֲלָה
  choice: seguindo até o ribeiro
  rationale: Nesta sequência de limites, o termo é entendido como referência a um curso de água ou leito fluvial, não como “herança”. A redação expressa a progressão topográfica sem afirmar que todo o limite necessariamente acompanha o curso.
- source_word: הַיָּם הַגָּדוֹל
  choice: o Grande Mar
  rationale: Preserva a designação geográfica convencional do hebraico; a identificação com o Mediterrâneo fica em nota.
- source_word: וְאֵת פְּאַת תֵּימָנָה נֶגְבָּה
  choice: Esse será o lado sul, em direção ao sul
  rationale: A frase hebraica é elíptica e retoma resumidamente o limite descrito; “Esse será” torna a função da fórmula clara em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição direcional do hebraico foi preservada, embora soe enfática em português. Os marcadores de nota foram posicionados junto aos termos que efetivamente explicam.
