revisions:
- from: Vocês distribuirão essa terra como herança a si mesmos e aos estrangeiros residentes que vivem no meio de vocês[a] e que tiveram filhos entre vocês[b]. Eles serão, para vocês, como os naturais da terra entre os filhos de Israel[c]. Juntamente com vocês, receberão uma herança entre as tribos de Israel.
  to: Vocês repartirão esta terra como herança para vocês mesmos e para os estrangeiros residentes[a] que vivem no meio de vocês e que geraram filhos entre vocês[b]. Eles serão para vocês como um nativo[c] entre os filhos de Israel. Juntamente com vocês, receberão uma herança entre as tribos de Israel.
  rationale: A revisão conserva a inclusão efetiva dos estrangeiros residentes na herança territorial e a relação entre repartir e receber herança. Ela torna mais direto o português da primeira cláusula, representa com maior precisão o verbo hebraico para geração de descendência, restaura o singular comparativo de «um nativo» e reposiciona as âncoras das notas junto aos vocábulos correspondentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:42:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'A estrutura central está correta: a terra é repartida como herança tanto aos israelitas quanto aos residentes estrangeiros, e estes recebem herança entre as tribos. Contudo, «tiveram filhos» atenua o Hifil de ילד, que aqui se refere mais especificamente a gerar/engendrar; e «como os naturais da terra» pluraliza e explicita «da terra» onde o hebraico usa o singular comparativo «como um nativo».'
  naturalness: O português é claro e de registro adequado. «para vocês mesmos» é mais natural do que «a si mesmos» neste contexto de distribuição. A colocação das âncoras também deve ficar junto dos termos que elas esclarecem.
  terminology: «Estrangeiros residentes» comunica bem גרים em português moderno. «Herança» e «tribos de Israel» são precisos. «Nativo» preserva adequadamente אזרח sem introduzir a noção moderna de cidadania.
  issues:
  - severity: medium
    issue: O verbo «tiveram» não preserva plenamente o valor de הוֹלִידוּ.
    rationale: No Hifil, ילד indica gerar/engendrar (literalmente, «geraram filhos»). «Tiveram filhos» é possível como paráfrase, mas pode incluir um sentido maternal ou meramente familiar que o verbo hebraico não exprime de modo tão direto.
  - severity: low
    issue: «Como os naturais da terra» afasta-se da forma comparativa singular do hebraico.
    rationale: כְּאֶזְרָח é literalmente «como um nativo». O plural e o acréscimo «da terra» não destroem o sentido, mas são desnecessários e reduzem a transparência formal.
  - severity: low
    issue: A âncora da nota sobre גרים está após «vocês», e a da nota sobre אזרח está no fim de «Israel».
    rationale: As âncoras devem acompanhar «estrangeiros residentes» e «um nativo», os termos efetivamente explicados pelas notas.
  revised_text: Vocês repartirão esta terra como herança para vocês mesmos e para os estrangeiros residentes[a] que vivem no meio de vocês e que geraram filhos entre vocês[b]. Eles serão para vocês como um nativo[c] entre os filhos de Israel. Juntamente com vocês, receberão uma herança entre as tribos de Israel.
