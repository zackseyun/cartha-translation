  text: וְ/הָיָ֗ה תַּפִּ֣לוּ אוֹתָ/הּ֮ בְּ/נַחֲלָה֒ לָ/כֶ֗ם וּ/לְ/הַ/גֵּרִים֙ הַ/גָּרִ֣ים בְּ/תוֹכְ/כֶ֔ם אֲשֶׁר הוֹלִ֥דוּ בָנִ֖ים בְּ/תֽוֹכְ/כֶ֑ם וְ/הָי֣וּ לָ/כֶ֗ם כְּ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אִתְּ/כֶם֙ יִפְּל֣וּ בְ/נַחֲלָ֔ה בְּ/ת֖וֹךְ שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/022.yaml
  text: And it shall be that you shall allot it as an inheritance for yourselves and for the sojourners who sojourn among you[a], who have fathered children among you; and they shall be to you like a native among the sons of Israel[c][b]. With you they shall receive an inheritance among the tribes of Israel.
translation:
  language: pt
  text: Vocês repartirão esta terra como herança para vocês mesmos e para os estrangeiros residentes[a] que vivem no meio de vocês e que geraram filhos entre vocês[b]. Eles serão para vocês como um nativo[c] entre os filhos de Israel. Juntamente com vocês, receberão uma herança entre as tribos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “residentes estrangeiros”; o termo hebraico se refere a pessoas não nativas que residiam entre os israelitas com uma condição social reconhecida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “geraram filhos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “como alguém nascido na terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפִּלוּ / יִפְּלוּ (נפל em Hiphil/Qal com נַחֲלָה)
  choice: distribuirão / receberão uma herança
  rationale: O primeiro verbo é causativo e descreve a distribuição da terra; o segundo expressa o recebimento da porção. A formulação preserva a relação entre as duas ocorrências sem reproduzir de modo obscuro a imagem literal de a porção ‘cair’.
- source_word: נַחֲלָה
  choice: herança
  rationale: No contexto da divisão da terra, designa uma porção territorial transmitida como patrimônio, e ‘herança’ mantém o termo bíblico corrente e preciso.
- source_word: הַגֵּרִים
  choice: estrangeiros residentes
  rationale: גֵּר indica pessoas não nativas que residem de modo estabelecido no meio de Israel, e não visitantes passageiros. A expressão é clara em português moderno e conserva tanto a origem estrangeira quanto a residência reconhecida.
- source_word: הַגָּרִים בְּתוֹכְכֶם
  choice: que vivem no meio de vocês
  rationale: Expressa naturalmente o valor participial e a residência contínua indicada pelo hebraico.
- source_word: הוֹלִדוּ בָנִים
  choice: tiveram filhos
  rationale: No contexto, a expressão assinala famílias estabelecidas por gerações. ‘Tiveram filhos’ é natural e não restringe indevidamente a referência à descendência masculina.
- source_word: כְּאֶזְרָח
  choice: como os naturais da terra
  rationale: אֶזְרָח designa quem pertence à população nativa. O plural em português concorda naturalmente com o referente coletivo, enquanto ‘como’ preserva a comparação hebraica.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a expressão familiar e nacional do hebraico sem substituí-la pela forma interpretativamente mais simples ‘israelitas’.
- source_word: אִתְּכֶם
  choice: juntamente com vocês
  rationale: Destaca que os estrangeiros residentes participam da distribuição ao lado dos israelitas.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: entre as tribos de Israel
  rationale: Indica de maneira natural que a porção será concedida dentro da organização tribal de Israel.
theological_decisions:
- issue: A condição do גֵּר na distribuição da terra restaurada
  choice: O texto concede aos estrangeiros residentes com famílias estabelecidas o direito de receber herança juntamente com os israelitas nativos.
  alternative: Entender que o versículo concede apenas residência ou proteção, sem participação real na herança territorial.
  rationale: A repetição da linguagem de herança e distribuição, somada à comparação com o natural da terra, indica participação efetiva na repartição. A tradução preserva essa força sem determinar como a visão deve ser relacionada a sistemas teológicos posteriores.
- issue: O alcance de בָנִים em הוֹלִדוּ בָנִים
  choice: A descendência em geral, traduzida por ‘filhos’.
  alternative: Traduzir de modo estritamente formal como ‘filhos homens’ ou ‘geraram filhos’.
  rationale: Embora בָנִים possa significar formalmente ‘filhos’, aqui a ênfase recai no estabelecimento familiar e geracional dos residentes, não na exclusividade do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. O uso de ‘vocês’ corresponde ao plural dirigido à comunidade. ‘Estrangeiros residentes’ evita tanto o arcaísmo de ‘forasteiros’ quanto a conotação burocrática ou potencialmente pejorativa de ‘residentes alienígenas’.
