  text: וְ/עַל הַ/נַּ֣חַל יַעֲלֶ֣ה עַל שְׂפָת֣/וֹ מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה כָּל עֵֽץ מַ֠אֲכָל לֹא יִבּ֨וֹל עָלֵ֜/הוּ וְ/לֹֽא יִתֹּ֣ם פִּרְי֗/וֹ לָֽ/חֳדָשָׁי/ו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔י/ו מִן הַ/מִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים ו/היו פִרְי/וֹ֙ לְ/מַֽאֲכָ֔ל וְ/עָלֵ֖/הוּ לִ/תְרוּפָֽה־־׀׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/012.yaml
  text: Along the river[a], on its bank, on this side and on that side, every kind of tree for food will grow. Its leaf will not wither, and its fruit will not fail; every month it will bear fresh fruit, because its waters are coming out from the sanctuary. Its fruit will be for food[c][b], and its leaf for healing.
translation:
  language: pt
  text: Ao longo do rio, em ambas as margens[a], crescerá toda espécie de árvore frutífera. Suas folhas não murcharão, nem seus frutos se acabarão. Todos os meses, as árvores produzirão frutos novos[b], porque as águas do rio saem do santuário. Seus frutos servirão de alimento, e suas folhas, de remédio[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deste lado e daquele lado”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traz a ideia de produzir fruto precoce, recém-amadurecido ou primeiro fruto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para cura” ou “como medicamento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֶה
  choice: crescerá
  rationale: Embora o verbo tenha o sentido básico de “subir”, no contexto do surgimento de árvores junto ao rio, “crescerá” é a equivalência idiomática natural.
- source_word: שְׂפָתוֹ
  choice: margens
  rationale: O substantivo significa literalmente “lábio” ou “borda”; aplicado a um rio, corresponde naturalmente a “margem”.
- source_word: מִזֶּה וּמִזֶּה
  choice: em ambas as margens
  rationale: A expressão literalmente indica “deste lado e daquele lado”. A forma escolhida transmite com clareza que há árvores dos dois lados do rio; a forma literal é preservada em nota.
- source_word: כָּל עֵץ מַאֲכָל
  choice: toda espécie de árvore frutífera
  rationale: A expressão designa árvores que fornecem alimento. “Árvore frutífera” é natural em português, e “toda espécie” preserva o valor distributivo de כָּל.
- source_word: לֹא יִבּוֹל עָלֵהוּ
  choice: Suas folhas não murcharão
  rationale: נבל descreve o murchar da vegetação. O plural em português expressa naturalmente o singular coletivo hebraico.
- source_word: וְלֹא יִתֹּם פִּרְיוֹ
  choice: nem seus frutos se acabarão
  rationale: O verbo indica chegar ao fim ou esgotar-se. “Não se acabarão” preserva diretamente a ideia de produção incessante.
- source_word: לָחֳדָשָׁיו
  choice: Todos os meses
  rationale: A expressão indica produção regular mês após mês; esta formulação é clara e corrente.
- source_word: יְבַכֵּר
  choice: produzirão frutos novos
  rationale: O piel de בכר se relaciona à produção precoce ou à primeira maturação. No contexto de uma colheita mensal contínua, “frutos novos” comunica produção recém-amadurecida sem sugerir uma única safra anual de primícias; a nuance lexical é indicada em nota.
- source_word: מֵימָיו
  choice: as águas do rio
  rationale: O referente pronominal pode soar ambíguo em português. A explicitação de “do rio” identifica naturalmente as águas que procedem do santuário, sem acrescentar interpretação externa.
- source_word: מִן הַמִּקְדָּשׁ
  choice: do santuário
  rationale: מקדש designa o lugar santo ou santuário; “santuário” é direto e adequado à visão do templo em Ezequiel.
- source_word: לִתְרוּפָה
  choice: de remédio
  rationale: O substantivo pode indicar cura, medicamento ou remédio. “De remédio” preserva aqui o uso medicinal das folhas, enquanto “para cura” permanece alternativa legítima.
theological_decisions:
- issue: Natureza da abundância vivificante do rio na visão do templo
  choice: 'Traduzir diretamente a imagem: as árvores fornecem alimento e remédio porque as águas procedem do santuário.'
  alternative: Explicitar na tradução uma interpretação sacramental, eclesiológica ou escatológica.
  rationale: O texto possui forte alcance teológico, mas não define aqui uma interpretação posterior específica. A tradução mantém a imagem e sua relação causal sem impor um sistema doutrinário.
- issue: Nuance de יְבַכֵּר
  choice: Usar “produzirão frutos novos” e registrar em nota a noção de fruto precoce ou recém-amadurecido.
  alternative: Traduzir no texto como “produzirão primícias” ou “frutos precoces”.
  rationale: “Primícias” poderia introduzir uma associação cultual mais específica do que o contexto exige, enquanto “frutos precoces” soa pouco natural para uma produção mensal contínua. A escolha mantém a renovação recorrente da colheita e a nota preserva a nuance lexical.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para evitar a repetição pouco natural de “ao longo do rio, em sua margem, deste lado e daquele lado”. O plural “árvores/frutos/folhas” mantém a referência coletiva de modo natural em português.
