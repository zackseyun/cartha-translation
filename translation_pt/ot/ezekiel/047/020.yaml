  text: וּ/פְאַת יָם֙ הַ/יָּ֣ם הַ/גָּד֔וֹל מִ/גְּב֕וּל עַד נֹ֖כַח לְב֣וֹא חֲמָ֑ת זֹ֖את פְּאַת יָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/020.yaml
  text: And the west side shall be the Great Sea[a], from the border up to opposite Lebo-hamath[b]. This is the west side.
translation:
  language: pt
  text: O lado oeste será o mar Grande[a], desde a fronteira até defronte de Lebo-Hamate[b]. Este é o lado oeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o mar Mediterrâneo, chamado em hebraico de “mar Grande”.
    reason: cultural_note
  - marker: b
    text: Em hebraico, Lebo-Hamate; a expressão também pode ser entendida literalmente como “a entrada de Hamate”, mas provavelmente funciona aqui como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת יָם
  choice: O lado oeste
  rationale: Embora a expressão seja literalmente “o lado do mar”, nas descrições territoriais de Israel ela designa o oeste, onde fica o Mediterrâneo. A tradução pelo sentido é clara e natural.
- source_word: הַיָּם הַגָּדוֹל
  choice: o mar Grande
  rationale: Preserva a designação hebraica tradicional do Mediterrâneo, sem substituí-la no texto principal por uma identificação explicativa.
- source_word: מִגְּבוּל
  choice: desde a fronteira
  rationale: גְּבוּל indica uma fronteira ou linha divisória. A formulação mantém a concisão e a referência não especificada do hebraico.
- source_word: עַד נֹכַח
  choice: até defronte de
  rationale: נֹכַח tem aqui sentido espacial, “diante de, em frente a, defronte de”. A escolha preserva a relação geográfica sem acrescentar um ponto não expresso no original.
- source_word: לְבוֹא חֲמָת
  choice: Lebo-Hamate
  rationale: A expressão funciona provavelmente como nome geográfico em fórmulas de fronteira. A transliteração preserva essa leitura, enquanto a possível análise literal é registrada em nota.
- source_word: זֹאת פְּאַת יָם
  choice: Esse será o lado oeste
  rationale: A frase recapitula o limite descrito. “Será” harmoniza naturalmente com a formulação normativa da descrição territorial, embora o hebraico não expresse o verbo.
theological_decisions: []
translation_notes:
  register: Português atual, claro e solene, com estrutura concisa própria de uma descrição de fronteiras. Emprega “oeste” para tornar explícito o sentido geográfico do hebraico “lado do mar”, mas conserva “mar Grande” e o topônimo Lebo-Hamate para manter a forma e a ambiguidade relevantes do texto-fonte.
