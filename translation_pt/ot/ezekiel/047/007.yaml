base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/007.yaml
  text: When I returned[a], behold, on the bank of the stream were very many trees, on this side and on that side.
translation:
  language: pt
  text: Quando voltei, eis que, à margem do curso de água, havia muitíssimas árvores, de um lado e do outro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais compacta: “dos dois lados”. A expressão hebraica diz literalmente: “deste lado e daquele lado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּבֵנִי
  choice: Quando voltei
  rationale: O infinitivo construto qal de שׁוב com sufixo de primeira pessoa funciona temporalmente e indica mais diretamente o retorno do próprio profeta. A tradução evita introduzir um agente causativo que não está expresso nessa forma.
- source_word: וְהִנֵּה
  choice: vi que havia
  rationale: וְהִנֵּה assinala uma percepção súbita. Em português narrativo atual, “vi que havia” conserva o ponto de vista perceptivo e produz uma formulação mais natural do que “e eis”, sem reduzir o elemento visual a uma simples afirmação de existência.
- source_word: אֶל שְׂפַת הַנַּחַל
  choice: à margem do rio
  rationale: שׂפה designa a margem ou borda. נחל pode indicar um curso de água, torrente ou ribeiro; no contexto visionário, o fluxo já se tornou profundo, de modo que “rio” é a designação portuguesa mais natural, sem exigir a imagem específica de um uádi.
- source_word: עֵץ רַב מְאֹד
  choice: muitíssimas árvores
  rationale: Embora עֵץ esteja formalmente no singular, tem valor coletivo; רַב מְאֹד expressa grande abundância. “Muitíssimas árvores” comunica de modo claro e enfático esse sentido coletivo.
- source_word: מִזֶּה וּמִזֶּה
  choice: de um lado e do outro
  rationale: A expressão distributiva indica os dois lados do rio e preserva a vivacidade espacial do hebraico melhor do que a forma compacta “dos dois lados”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “vi que havia” representa a função perceptiva de וְהִנֵּה sem recorrer ao mais arcaizante “e eis”. O marcador [a] foi colocado após a expressão a que se refere.
