revisions:
- from: Quando voltei, vi que havia muitíssimas árvores à margem do rio, de um lado e do outro.[a]
  to: Quando voltei, eis que, à margem do curso de água, havia muitíssimas árvores, de um lado e do outro.[a]
  rationale: A revisão substitui «rio» por «curso de água» para não estreitar indevidamente o alcance de נַחַל. Também torna explícita, por meio de «eis que», a força apresentativa de וְהִנֵּה, sem recorrer a uma formulação arcaica ou alterar o sentido. A distribuição espacial e a nota lexical são preservadas.
