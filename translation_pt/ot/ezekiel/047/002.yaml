  text: וַ/יּוֹצִאֵ/נִי֮ דֶּֽרֶךְ שַׁ֣עַר צָפוֹנָ/ה֒ וַ/יְסִבֵּ֨/נִי֙ דֶּ֣רֶךְ ח֔וּץ אֶל שַׁ֣עַר הַ/ח֔וּץ דֶּ֖רֶךְ הַ/פּוֹנֶ֣ה קָדִ֑ים וְ/הִנֵּה מַ֣יִם מְפַכִּ֔ים מִן הַ/כָּתֵ֖ף הַ/יְמָנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/002.yaml
  text: Then he brought me out by way of the north gate[a], and led me around by the outside way to the outer gate, the one facing east; and behold[b], water was trickling from the right side.
translation:
  language: pt
  text: Então ele me levou para fora pelo portão norte e me conduziu, dando a volta por fora, até o portão externo, aquele que dá para o leste. E eis que a água escorria[a] do lado direito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “borbulhava” ou “fluía”. O verbo hebraico sugere um pequeno fluxo que começa a sair, e não uma corrente volumosa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do ombro direito”. Aqui, “ombro” se refere ao lado ou flanco da estrutura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: ele me levou para fora
  rationale: O hifil de יצא expressa fazer alguém sair. “Levou para fora” é natural em português e se ajusta ao percurso guiado da visão.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹנָה
  choice: pelo portão norte
  rationale: דֶּרֶךְ indica a rota, e צָפוֹנָה aponta para o norte. A formulação comunica com clareza que a saída ocorreu pelo portão situado ao norte.
- source_word: וַיְסִבֵּנִי דֶּרֶךְ חוּץ
  choice: me conduziu, dando a volta por fora
  rationale: O hifil de סבב indica fazer alguém contornar ou dar a volta, enquanto חוּץ situa o percurso no exterior. A tradução preserva ambos os elementos espaciais.
- source_word: אֶל שַׁעַר הַחוּץ
  choice: até o portão externo
  rationale: No contexto arquitetônico, הַחוּץ caracteriza o portão como exterior ou externo. “Portão externo” é claro e natural.
- source_word: דֶּרֶךְ הַפּוֹנֶה קָדִים
  choice: aquele que dá para o leste
  rationale: O particípio de פנה descreve a orientação do portão. “Dá para o leste” é uma expressão portuguesa corrente para essa orientação.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: הִנֵּה chama a atenção para um novo detalhe visual. “E eis que” mantém a vivacidade e o registro profético.
- source_word: מַיִם מְפַכִּים
  choice: a água escorria
  rationale: O verbo פכה descreve água emergindo em fluxo ainda pequeno. “Escorria” preserva essa imagem sem sugerir uma corrente já volumosa.
- source_word: מִן הַכָּתֵף הַיְמָנִית
  choice: do lado direito
  rationale: כָּתֵף significa literalmente “ombro”, mas em uso arquitetônico ou topográfico designa o lado ou flanco de uma estrutura. “Lado direito” transmite naturalmente o sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para tornar compreensível o percurso ao redor do complexo, sem eliminar os detalhes espaciais do hebraico. “E eis que” preserva o tom visionário do relato.
