  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/שֵּׁ֔בֶט אֲשֶׁר גָּ֥ר הַ/גֵּ֖ר אִתּ֑/וֹ שָׁ֚ם תִּתְּנ֣וּ נַחֲלָת֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/023.yaml
  text: And it shall be that in the tribe with which the sojourner resides[a], there you shall give him his inheritance, declares the Lord GOD.
translation:
  language: pt
  text: E acontecerá que, na tribo em que o estrangeiro residente morar[a], ali vocês lhe darão a sua herança — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “imigrante residente”. O hebraico גֵּר se refere a uma pessoa de origem não nativa estabelecida no meio de Israel sob sua ordem comunitária, não apenas a um viajante temporário.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Mantém a fórmula prospectiva que introduz a estipulação, em português atual e digno.
- source_word: בַשֵּׁבֶט
  choice: na tribo
  rationale: No contexto da repartição da terra, שֵׁבֶט designa a unidade tribal e seu território.
- source_word: אֲשֶׁר גָּר הַגֵּר אִתּוֹ
  choice: em que o estrangeiro residente morar
  rationale: גֵּר é um não israelita estabelecido no meio da comunidade, não um simples viajante; a formulação portuguesa expressa sua vinculação residencial à tribo sem forçar o pronome hebraico distributivo.
- source_word: שָׁם
  choice: ali
  rationale: 'Preserva a ênfase locativa: a herança deve ser concedida precisamente na tribo onde ele reside.'
- source_word: תִּתְּנוּ
  choice: vocês lhe darão
  rationale: Reproduz a segunda pessoa do plural e a força normativa futura de נתן, deixando explícito o beneficiário exigido pelo português.
- source_word: נַחֲלָתוֹ
  choice: a sua herança
  rationale: No contexto, נַחֲלָה é a porção territorial atribuída como herança.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Traduz a fórmula profética e distingue אֲדֹנָי, 'Senhor', do nome da aliança יהוה, transliterado 'Yahweh'.
theological_decisions:
- issue: Tradução do nome divino יהוה na fórmula אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A transliteração preserva o nome divino expresso no hebraico e evita fundir יהוה com o título אֲדֹנָי; não resolve nem amplia qualquer questão doutrinária além do texto.
- issue: Status do גֵּר na distribuição da terra
  choice: estrangeiro residente
  alternative: peregrino
  rationale: O termo indica alguém de origem não nativa estabelecido sob a ordem comunitária de Israel. A tradução evita sugerir mero trânsito temporário e mantém a inclusão concreta dessa pessoa na herança territorial.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” comunica com clareza a segunda pessoa do plural; “herança” preserva o vocabulário bíblico e jurídico da repartição territorial. O travessão destaca naturalmente a fórmula profética final.
