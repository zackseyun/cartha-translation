  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם וַ/יּוֹלִכֵ֥/נִי וַ/יְשִׁבֵ֖/נִי שְׂפַ֥ת הַ/נָּֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/006.yaml
  text: Then he said to me[a], “Have you seen this[d][c][b], son of man?” Then he led me and brought me back to the bank of the stream.
translation:
  language: pt
  text: 'Então ele me disse: “Você viu, filho do homem?” Depois me conduziu e me levou de volta à margem do riacho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: הֲרָאִיתָ
  choice: Você viu?
  rationale: O interrogativo com o perfeito na segunda pessoa masculina pergunta se Ezequiel observou o que lhe foi mostrado. O objeto permanece implícito, como no hebraico.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma do tratamento recorrente dirigido a Ezequiel e sua ressonância literária, sem o reinterpretar.
- source_word: וַיּוֹלִכֵנִי
  choice: me conduziu
  rationale: Traduz naturalmente o hifil de הלך, que aqui indica que ele fez o profeta ir ou o guiou.
- source_word: וַיְשִׁבֵנִי
  choice: me levou de volta
  rationale: Expressa de modo idiomático o valor causativo do hifil de שוב e o retorno a um lugar anterior.
- source_word: שְׂפַת
  choice: margem
  rationale: Embora o sentido literal seja “lábio” ou “borda”, “margem” é o equivalente contextual natural junto a um curso de água.
- source_word: הַנָּחַל
  choice: o riacho
  rationale: נחל pode designar um ribeiro, torrente ou uádi. No contexto da visão há água corrente, e “riacho” mantém a imagem sem impor a dimensão de um grande rio.
theological_decisions:
- issue: Tradução de אדם no vocativo בֶן אָדָם
  choice: filho do homem
  alternative: mortal; ser humano
  rationale: A expressão funciona como o tratamento profético característico de Ezequiel. A tradução formal preserva a repetição, a forma hebraica e a tensão literária e teológica sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta conserva o objeto implícito do hebraico. “Riacho” é contextual, enquanto “margem” comunica naturalmente a metáfora hebraica de “lábio/borda”.
