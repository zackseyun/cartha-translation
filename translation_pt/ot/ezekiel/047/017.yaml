  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֨ה גְב֜וּל מִן הַ/יָּ֗ם חֲצַ֤ר עֵינוֹן֙ גְּב֣וּל דַּמֶּ֔שֶׂק וְ/צָפ֥וֹן צָפ֖וֹנָ/ה וּ/גְב֣וּל חֲמָ֑ת וְ/אֵ֖ת פְּאַ֥ת צָפֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/017.yaml
  text: So the border shall be from the sea to Hazar-enon[a], at the border of Damascus; and on the north, northward, with the border of Hamath[b]. This shall be the north side.
translation:
  language: pt
  text: Assim, a fronteira se estenderá desde o mar[a] até Hazar-Enom[b], na fronteira de Damasco; e, ao norte, em direção ao norte, junto à fronteira de Hamate. Esse será o lado norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “desde o mar”. Pelo contexto, trata-se do mar Mediterrâneo, mas aqui o texto não repete a designação “mar Grande”.
    reason: cross_reference
  - marker: b
    text: Hazar-Enom também é tradicionalmente grafado “Hazar-Enã”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Assim, ... se estenderá
  rationale: Introduz a especificação da fronteira. A forma futura comunica em português o valor descritivo e jurídico-topográfico da forma hebraica no contexto; “se estenderá” torna natural a descrição de um limite territorial sem alterar seus pontos extremos.
- source_word: גְבוּל
  choice: fronteira
  rationale: Termo corrente e claro para um limite territorial; também permite preservar a repetição do hebraico quando a expressão reaparece em relação a Damasco e Hamate.
- source_word: מִן הַיָּם
  choice: desde o mar
  rationale: O hebraico diz literalmente apenas “desde o mar”. Embora o contexto indique o Mediterrâneo, o texto principal não acrescenta “Grande” nem “Mediterrâneo”.
- source_word: חֲצַר עֵינוֹן
  choice: Hazar-Enom
  rationale: O topônimo é transliterado segundo uma forma já reconhecível em português, em vez de ser traduzido. A nota registra uma variante tradicional.
- source_word: גְּבוּל דַּמֶּשֶׂק
  choice: na fronteira de Damasco
  rationale: A expressão construta localiza Hazar-Enom em relação ao território de Damasco; “na fronteira de Damasco” é idiomático e mantém a relação geográfica.
- source_word: וְצָפוֹן צָפוֹנָה
  choice: e, ao norte, em direção ao norte
  rationale: Preserva deliberadamente a repetição direcional do hebraico, sem reduzi-la a uma única indicação e sem impor uma reconstrução geográfica mais específica.
- source_word: וּגְבוּל חֲמָת
  choice: junto à fronteira de Hamate
  rationale: “Junto a” expressa com naturalidade o valor conectivo e topográfico da frase, mantendo Hamate como referência da fronteira setentrional.
- source_word: וְאֵת פְּאַת צָפוֹן
  choice: Esse será o lado norte
  rationale: A frase funciona como recapitulação da descrição. O demonstrativo e o futuro fornecem em português a estrutura necessária para exprimir essa conclusão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a repetição direcional incomum do hebraico para não ocultar sua estrutura nem resolver em excesso a sintaxe topográfica. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
