base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/008.yaml
  text: Then he said to me[a], “These waters flow out toward the eastern district and go down into the Arabah; then they enter the sea. and when they are brought out into the sea[c][b], the waters are healed.”
translation:
  language: pt
  text: 'Então ele me disse: “Estas águas correm para a região oriental, descem até a Arabá e entram no mar. Quando são lançadas no mar[a], as águas serão curadas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica é difícil. O mar mencionado é geralmente identificado como o mar Morto. Outra tradução proposta é: “o mar de águas estagnadas”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “as águas se tornam próprias para a vida”. Literalmente: “as águas serão curadas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם הָאֵלֶּה
  choice: estas águas
  rationale: Mantém o plural formal do hebraico מַיִם e soa natural em português neste contexto visionário.
- source_word: יוֹצְאִים
  choice: correm
  rationale: O particípio de יצא descreve o movimento contínuo da corrente; “correm” expressa com naturalidade o fluxo da água.
- source_word: הַגְּלִילָה הַקַּדְמוֹנָה
  choice: a região oriental
  rationale: גְּלִילָה designa uma região ou distrito; “região oriental” é claro e geograficamente adequado sem especificidade excessiva.
- source_word: וְיָרְדוּ עַל הָעֲרָבָה
  choice: descem até a Arabá
  rationale: Preserva o sentido topográfico de ירד e mantém Arabá como nome geográfico da depressão do Jordão.
- source_word: וּבָאוּ הַיָּמָּה
  choice: entram no mar
  rationale: A forma direcional de יָם com בוא indica chegada ao mar; no contexto de uma corrente, “entram” é idiomático.
- source_word: אֶל הַיָּמָּה הַמּוּצָאִים
  choice: Quando são lançadas no mar
  rationale: A construção difícil é entendida segundo o texto massorético, tomando הַמּוּצָאִים como particípio Hophal de יצא, isto é, águas feitas sair ou lançadas no mar, sem adotar a conjectura de “águas estagnadas”.
- source_word: וְנרפאו הַמָּיִם
  choice: suas águas são curadas
  rationale: Preserva a metáfora explícita de רפא, “curar”, em vez de reduzi-la ao resultado interpretativo “tornam-se doces” ou “potáveis”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O texto conserva “Arabá” como topônimo, mantém a metáfora da cura das águas e sinaliza em nota a dificuldade textual da expressão relativa à entrada no mar.
