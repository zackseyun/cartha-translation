base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/015.yaml
  text: 'And this shall be the boundary of the land: on the north side[d][c][b][a], from the Great Sea by the way of Hethlon to Lebo-zedad.'
translation:
  language: pt
  text: 'E este será o limite da terra: no lado norte, desde o Mar Grande[a], pelo caminho de Hetlom[b], até a entrada de Zedade[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mar Grande” é o mar Mediterrâneo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “pela estrada que leva a Hetlom”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “até Lebo-Zedade”. O hebraico também pode indicar a aproximação ou entrada de Zedade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: E este será
  rationale: Introduz a definição do limite no contexto visionário. O verbo não está expresso no hebraico; o futuro se ajusta ao contexto, sem excluir a possibilidade do presente.
- source_word: גְּבוּל הָאָרֶץ
  choice: o limite da terra
  rationale: “Limite” expressa com precisão a linha geográfica que delimita a terra; “terra” retoma o território descrito na visão.
- source_word: לִפְאַת צָפוֹנָה
  choice: no lado norte
  rationale: Forma natural em português para indicar o lado setentrional do território.
- source_word: מִן הַיָּם הַגָּדוֹל
  choice: desde o Mar Grande
  rationale: Mantém a designação geográfica tradicional do texto hebraico, esclarecida em nota como referência ao Mediterrâneo.
- source_word: הַדֶּרֶךְ חֶתְלֹן
  choice: pelo caminho de Hetlom
  rationale: Preserva a concisão da fórmula de fronteira e a possível relação de Hetlom com a estrada ou rota.
- source_word: לְבוֹא צְדָדָה
  choice: até a entrada de Zedade
  rationale: Entende לְבוֹא em seu uso topográfico como aproximação ou entrada de um lugar, preservando na nota a alternativa de leitura como topônimo composto.
