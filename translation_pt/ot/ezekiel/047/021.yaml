base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/021.yaml
  text: So you shall divide this land among yourselves according to the tribes of Israel[a].
translation:
  language: pt
  text: Assim, vocês repartirão esta terra entre si, segundo as tribos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E vocês repartirão esta terra para si, para as tribos de Israel.”'
    reason: Alternativa lexical que preserva de modo mais literal as duas ocorrências da preposição hebraica לְ e a conjunção inicial.
lexical_decisions:
- source_word: וְחִלַּקְתֶּם
  choice: Assim, vocês repartirão
  rationale: O piel de חלק significa dividir ou repartir. “Repartirão” expressa naturalmente a distribuição da terra. A conjunção וְ foi vertida por “Assim” para indicar a continuação conclusiva da descrição anterior dos limites.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: O marcador hebraico de objeto direto definido não possui equivalente independente em português.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: Tradução direta e natural da expressão hebraica no contexto da distribuição territorial.
- source_word: לָכֶם
  choice: entre si
  rationale: Embora a expressão possa significar literalmente “para vocês mesmos”, no contexto indica a distribuição feita dentro da própria comunidade. “Entre si” comunica isso com clareza sem excluir a leitura mais literal, registrada em nota.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: segundo as tribos de Israel
  rationale: A preposição לְ relaciona a repartição às divisões tribais. “Segundo” indica que a terra será distribuída de acordo com essas tribos, preservando em nota a construção mais literal com “para”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para explicitar a segunda pessoa do plural. O futuro “repartirão” mantém o tom prescritivo-profético do hebraico, e a nota conserva a ambiguidade das construções preposicionais.
