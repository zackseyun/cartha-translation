  verdict: revise
  source_fidelity: A delimitação geográfica e os topônimos estão bem representados, e a nota preserva a designação hebraica «mar oriental». Contudo, o hebraico traz explicitamente o verbo «medireis» (תָּמֹדּוּ) associado a «o lado oriental» no final. A redação «Esse será o lado oriental» substitui essa ação por uma cópula não expressa no texto e deixa de traduzir a repetição verbal.
  naturalness: O português é claro, moderno e apropriado para uma descrição de fronteira. Reunir a indicação do Jordão, da fronteira e do mar oriental na mesma oração torna mais nítida a extensão da linha limítrofe.
  terminology: «Haurã», «Damasco», «Gileade», «a terra de Israel», «Jordão» e «mar oriental» são escolhas adequadas. A nota sobre o provável referente, o mar Morto, é cautelosa e não substitui a expressão hebraica no texto principal.
