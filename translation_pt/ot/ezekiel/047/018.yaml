base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/018.yaml
  text: And the eastern side shall be from between Hauran and Damascus[a], and between Gilead and the land of Israel, the Jordan, from the border to the eastern sea; you shall measure the eastern side.
translation:
  language: pt
  text: O lado oriental ficará entre Haurã e Damasco e entre Gileade e a terra de Israel, pelo Jordão, desde a fronteira até o mar oriental[a]; vocês medirão o lado oriental.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, o mar Morto; em hebraico, “o mar oriental”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְאַת קָדִים / פְאַת קָדִימָה
  choice: lado oriental
  rationale: Neste contexto de delimitação territorial, פֵּאָה designa um lado ou linha limítrofe, não propriamente um canto. A repetição no fim do versículo foi preservada.
- source_word: מִבֵּין ... וּמִבֵּין ...
  choice: entre ... e ... e entre ... e ...
  rationale: A construção situa a linha divisória entre as regiões mencionadas. O português dispensa a reprodução rígida da preposição מִן para expressar essa relação com naturalidade.
- source_word: חַוְרָן
  choice: Haurã
  rationale: Forma portuguesa corrente e legível do nome regional.
- source_word: דַּמֶּשֶׂק
  choice: Damasco
  rationale: Forma convencional do topônimo em português.
- source_word: הַגִּלְעָד
  choice: Gileade
  rationale: Forma bíblica convencional em português para o nome regional.
- source_word: אֶרֶץ יִשְׂרָאֵל
  choice: a terra de Israel
  rationale: Mantém o substantivo explícito אֶרֶץ e distingue o território do povo.
- source_word: הַיַּרְדֵּן
  choice: ao longo do Jordão
  rationale: O hebraico apresenta 'o Jordão' em aposição na descrição da fronteira. 'Ao longo do Jordão' torna clara sua função geográfica sem alterar o referente.
- source_word: מִגְּבוּל
  choice: desde a fronteira
  rationale: גְּבוּל significa fronteira ou limite; 'desde' expressa aqui o ponto inicial do traçado.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: o mar oriental
  rationale: Preserva a designação descritiva literal do hebraico, sem substituir no texto principal o nome pelo referente geográfico provável.
- source_word: תָּמֹדּוּ
  choice: vocês o medirão
  rationale: O verbo מדד significa 'medir'. O pronome retoma o lado ou limite oriental e produz uma frase natural em português.
