base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/003.yaml
  text: As the man went out eastward with a measuring line in his hand[a], he measured a thousand cubits and led me through the water, water up to the ankles.
translation:
  language: pt
  text: Quando o homem saiu em direção ao leste, com uma corda de medir na mão, mediu mil côvados e me fez passar pelas águas, que chegavam aos tornozelos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “águas de tornozelos”, isto é, águas que chegavam aos tornozelos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת הָאִישׁ
  choice: Quando o homem saiu
  rationale: O infinitivo construto com ב introduz uma oração temporal; “Quando” expressa essa relação com naturalidade em português.
- source_word: קָדִים
  choice: em direção ao leste
  rationale: O termo tem valor direcional/adverbial no contexto e indica o rumo tomado pelo homem.
- source_word: וְקָו בְּיָדוֹ
  choice: com uma corda de medir na mão
  rationale: קָו designa aqui uma linha ou corda usada para medição; a formulação explicita sua função sem perder a imagem concreta.
- source_word: וַיָּמָד אֶלֶף בָּאַמָּה
  choice: mediu mil côvados
  rationale: A expressão indica uma distância de mil unidades da medida antiga chamada côvado.
- source_word: וַיַּעֲבִרֵנִי בַמַּיִם
  choice: me fez passar pelas águas
  rationale: O Hifil de עבר é causativo, literalmente “fez-me passar”; “pelas águas” preserva o movimento através delas.
- source_word: מֵי אָפְסָיִם
  choice: águas, que chegavam aos tornozelos
  rationale: A construção incomum significa literalmente “águas de tornozelos” e, no contexto, indica a profundidade da água.
