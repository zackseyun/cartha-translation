source:
  edition: WLC
  text: וּ/בִ/שְׂאֵ֣ת מַתְּנֹֽתֵי/כֶ֡ם בְּֽ/הַעֲבִיר֩ בְּנֵי/כֶ֨ם בָּ/אֵ֜שׁ אַתֶּם֩ נִטְמְאִ֤֨ים לְ/כָל גִּלּֽוּלֵי/כֶם֙ עַד הַ/יּ֔וֹם וַ/אֲנִ֛י אִדָּרֵ֥שׁ לָ/כֶ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם אִדָּרֵ֖שׁ לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/031.yaml
  text: And when you present your gifts[a], when you make your sons pass through the fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, declares the Lord GOD[c][b], I will not be inquired of by you.
translation:
  language: pt
  text: Ao apresentarem as suas ofertas, fazendo os seus filhos passar pelo fogo[a], vocês se contaminam com todos os seus ídolos até hoje. E eu haveria de me deixar consultar por vocês, ó casa de Israel? Tão certo como eu vivo, declara o Senhor Yahweh, não me deixarei consultar por vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fazer os filhos passar pelo fogo” refere-se ao sacrifício de filhos em culto idólatra.
    reason: cultural_note
  - marker: b
    text: 'O hebraico usa literalmente uma fórmula de juramento com “se”; neste contexto, ela expressa uma negação enfática: “certamente não me deixarei consultar por vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׂאֵת מַתְּנֹתֵיכֶם
  choice: Ao apresentarem as suas dádivas
  rationale: נשׂא com מַתָּנוֹת tem aqui sentido cultual de apresentar dádivas. “Dádivas” mantém o valor lexical, enquanto o contexto deixa claro que se trata de ofertas idólatras.
- source_word: בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ
  choice: fazendo seus filhos passar pelo fogo
  rationale: Preserva a expressão hebraica e o masculino explícito בְּנֵיכֶם, sem especificar além do texto o mecanismo do sacrifício.
- source_word: אַתֶּם נִטְמְאִים
  choice: vocês continuam se contaminando
  rationale: O nifal exprime o estado de contaminação resultante dos atos praticados; “continuam” comunica a persistência indicada por “até hoje”, e a forma reflexiva conserva a culpabilidade dos agentes.
- source_word: לְכָל גִּלּוּלֵיכֶם
  choice: com todos os seus ídolos
  rationale: “Ídolos” traduz de modo claro גִּלּוּלִים, termo fortemente depreciativo característico de Ezequiel; “com” é natural após “se contaminando”.
- source_word: וַאֲנִי אִדָּרֵשׁ לָכֶם
  choice: E eu me deixaria consultar por vocês?
  rationale: O nifal de דרשׁ, usado para buscar orientação divina, é expresso naturalmente em português por “deixar-se consultar”. A pergunta retórica prepara a negação enfática final.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Mantém o vocativo coletivo e o tom solene da interpelação profética.
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Equivalente português natural e solene da fórmula divina de juramento “Vivo eu”.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: “Declaração” conserva o caráter formular de נְאֻם; אֲדֹנָי é “Senhor” e o nome próprio יהוה é transliterado “Yahweh”.
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: não me deixarei consultar por vocês
  rationale: Na fórmula de juramento, אִם introduz uma negação elíptica enfática. A tradução comunica sua força sem o enganoso “se” literal em português.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor DEUS
  rationale: Distingue o título אֲדֹנָי do nome da aliança יהוה, sem substituir o nome próprio por um título.
- issue: Gênero de בְּנֵיכֶם
  choice: seus filhos
  alternative: suas crianças
  rationale: O hebraico emprega o substantivo masculino plural “filhos”; a tradução o preserva sem ampliar nem restringir explicitamente o referente além da forma do texto.
- issue: Força da fórmula final אִם אִדָּרֵשׁ לָכֶם
  choice: não me deixarei consultar por vocês
  alternative: se eu me deixar consultar por vocês
  rationale: Depois do juramento חַי אָנִי, a partícula אִם funciona numa fórmula elíptica de forte negação. Traduzir semanticamente evita que a declaração pareça condicional ou incompleta.
- issue: Natureza de fazer os filhos passar pelo fogo
  choice: expressão preservada no texto, com explicação em nota
  alternative: queimando seus filhos como sacrifício
  rationale: O contexto é de culto idólatra e sacrifício de filhos, mas preservar a formulação hebraica evita definir no corpo do texto detalhes rituais que a expressão não explicita.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. A repetição de “consultar” preserva a correspondência retórica entre a pergunta e a resposta. Todos os marcadores de nota aparecem no texto.
