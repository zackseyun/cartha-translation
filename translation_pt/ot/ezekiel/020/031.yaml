  to: Ao apresentarem as suas ofertas, fazendo os seus filhos passar pelo fogo[a], vocês se contaminam com todos os seus ídolos até hoje. E eu haveria de me deixar consultar por vocês, ó casa de Israel? Tão certo como eu vivo, declara o Senhor Yahweh, não me deixarei consultar por vocês.[b]
