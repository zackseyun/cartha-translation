  yaml_path: translation/ot/ezekiel/020/010.yaml
  text: So I brought them out from the land of Egypt and brought them into the wilderness.
translation:
  language: pt
  text: Assim, eu os tirei da terra do Egito e os levei para o deserto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹוצִיאֵם
  choice: Assim, eu os tirei
  rationale: O hifil de יצא, com sujeito na primeira pessoa do singular e objeto na terceira pessoa do plural, expressa a ação causativa de fazer sair ou tirar. “Eu os tirei” é natural em português e preserva esse sentido; “Assim” representa a progressão narrativa do waw no contexto.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém explicitamente אֶרֶץ (“terra”) e reproduz a formulação tradicional do êxodo sem reduzi-la simplesmente a “do Egito”.
- source_word: וָאֲבִאֵם
  choice: e os levei
  rationale: O hifil de בוא significa fazer vir, trazer ou levar. Como o movimento é descrito desde o ponto de partida até o deserto, “os levei” soa mais idiomático em português, sem perder a ação divina de conduzi-los ao destino.
- source_word: אֶל הַמִּדְבָּר
  choice: para o deserto
  rationale: מִדְבָּר designa uma região erma, desértica ou de estepe. “Deserto” é claro e corrente em português, enquanto “para” expressa naturalmente o movimento em direção ao local indicado por אֶל.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. A formulação conserva a primeira pessoa divina e o paralelismo entre tirar do Egito e levar ao deserto.
