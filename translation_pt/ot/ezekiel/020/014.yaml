  text: וָ/אֶעֱשֶׂ֖ה לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁ֥ר הוֹצֵאתִ֖י/ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/014.yaml
  text: But I acted for the sake of my name[a], so that it would not be profaned in the sight of the nations[b], in whose sight I had brought them out.
translation:
  language: pt
  text: Mas agi por causa do meu nome[a], para que ele não fosse profanado diante das nações[b], em cuja presença eu os havia feito sair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em consideração ao meu nome”.'
    reason: lexical_alternative
  - marker: b
    text: “Profanado” traduz um verbo que pode significar tratar como comum ou dessacralizar aquilo que é santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱשֶׂה
  choice: Mas agi
  rationale: עשה é amplo (‘fazer, agir’); aqui, com Deus como sujeito e em contraste com o juízo anunciado anteriormente, ‘agi’ expressa de modo natural sua intervenção deliberada, enquanto וַ é entendido adversativamente.
- source_word: לְמַעַן שְׁמִי
  choice: por causa do meu nome
  rationale: Preserva o idioma hebraico e comunica que Deus age em consideração à santidade e à honra pública associadas ao seu nome.
- source_word: לְבִלְתִּי הֵחֵל
  choice: para que ele não fosse profanado
  rationale: A construção expressa finalidade preventiva. O verbo חלל indica profanar ou tratar como comum aquilo que é santo; a formulação passiva é natural em português com ‘meu nome’ como referente.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: diante das nações
  rationale: Transmite a dimensão pública e observável da expressão hebraica sem exigir uma reprodução rígida de ‘aos olhos de’.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos circundantes; ‘nações’ é historicamente adequado e evita importar o sentido posterior de ‘gentios’.
- source_word: אֲשֶׁר הוֹצֵאתִים
  choice: das quais eu os havia tirado
  rationale: O hifil de יצא significa ‘fazer sair, tirar’. O mais-que-perfeito composto marca naturalmente que essa ação ocorreu antes da situação descrita.
- source_word: לְעֵינֵיהֶם
  choice: à vista das quais
  rationale: Retém a repetição do campo visual presente no hebraico e liga a oração relativa às nações, com formulação digna e compreensível.
theological_decisions:
- issue: Sentido de Deus agir por causa de seu nome
  choice: Deus age para preservar a santidade e a honra pública do seu nome entre as nações.
  alternative: Deus age apenas para proteger sua reputação em sentido superficial.
  rationale: Em Ezequiel, o nome de Deus representa seu caráter revelado e sua honra santa. A tradução mantém o idioma e sua tensão teológica sem inserir uma explicação doutrinária no corpo do versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição hebraica de לְעֵינֵי foi preservada semanticamente por ‘diante’ e ‘à vista’, evitando uma duplicação pesada. O pronome ‘ele’ explicita que o referente é ‘meu nome’.
