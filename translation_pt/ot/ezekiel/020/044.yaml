reference: Ezekiel 20:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/עֲשׂוֹתִ֥/י אִתְּ/כֶ֖ם לְמַ֣עַן שְׁמִ֑/י לֹא֩ כְ/דַרְכֵי/כֶ֨ם הָ/רָעִ֜ים וְ/כַ/עֲלִילֽוֹתֵי/כֶ֤ם הַ/נִּשְׁחָתוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/044.yaml
  text: Then you will know that I am Yahweh[a], when I deal with you for the sake of my name, not according to your evil ways or according to your corrupt deeds, O house of Israel[b], declares the Lord GOD.
translation:
  language: pt
  text: Então vocês saberão que eu sou Yahweh, quando eu agir em relação a vocês[a] por causa do meu nome[b], e não segundo os seus maus caminhos nem segundo as suas ações corruptas, ó casa de Israel — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no meu agir com vocês”. O hebraico é amplo e não especifica aqui a natureza da ação de Deus.
    reason: lexical_alternative
  - marker: b
    text: Isto é, visando a honra e a reputação associadas ao seu nome.
    reason: cultural_note
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O perfeito qal com a conjunção, no discurso profético, tem aqui sentido futuro e consequencial. “Então” expressa naturalmente o resultado sem alterar a fórmula de reconhecimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּעֲשׂוֹתִי אִתְּכֶם
  choice: quando eu agir com vocês
  rationale: A construção é ampla e descreve a ação de Deus em relação a Israel sem especificar se ela é punitiva, restauradora ou ambas.
- source_word: לְמַעַן שְׁמִי
  choice: por causa do meu nome
  rationale: Mantém a linguagem bíblica do “nome”, que neste contexto envolve a honra e a reputação de Yahweh.
- source_word: לֹא כְדַרְכֵיכֶם הָרָעִים
  choice: e não segundo os seus maus caminhos
  rationale: “Caminhos” representa a conduta ou o modo de vida, e “segundo” conserva a ideia de padrão ou medida indicada pela preposição hebraica.
- source_word: וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת
  choice: nem segundo as suas ações corruptas
  rationale: עֲלִילוֹת designa atos ou práticas, enquanto הַנִּשְׁחָתוֹת os caracteriza como moralmente corrompidos.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Preserva tanto o vocativo explícito quanto a expressão coletiva tradicional “casa de Israel”.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: “Declara” reproduz a fórmula profética, enquanto “Senhor Yahweh” distingue o título אֲדֹנָי do nome divino יְהוָה.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Natureza da ação divina em בַּעֲשׂוֹתִי אִתְּכֶם
  choice: quando eu agir com vocês
  alternative: quando eu tratar vocês conforme merecem; quando eu os restaurar
  rationale: O hebraico não limita a ação a juízo ou restauração. A formulação ampla conserva a tensão do contexto entre juízo e misericórdia.
- issue: Sentido de לְמַעַן שְׁמִי
  choice: por causa do meu nome
  alternative: para preservar a minha reputação
  rationale: A tradução mantém a imagem teológica do nome divino, enquanto a nota esclarece sua dimensão de honra e reputação sem reduzir a expressão a uma paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O plural “vocês” favorece legibilidade contemporânea; “ó casa de Israel” e a fórmula “declara o Senhor Yahweh” preservam o tom profético elevado. Os marcadores [a] e [b] foram posicionados junto às expressões que efetivamente explicam.
