base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/022.yaml
  text: But I held back my hand[a], and I acted for the sake of my name, so that it would not be profaned in the sight of the nations[b], before whose eyes I had brought them out.
translation:
  language: pt
  text: Mas contive a minha mão[a] e agi por causa do meu nome, para que ele não fosse profanado aos olhos das nações[b], diante das quais eu os havia feito sair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiz voltar a minha mão” ou “retirei a minha mão”. A expressão hebraica indica que Deus se conteve e não executou o juízo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para não profanar”, tendo como objeto implícito o nome de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי אֶת־יָדִי
  choice: contive a minha mão
  rationale: A expressão hebraica descreve literalmente fazer a mão voltar, mas, no contexto do juízo ameaçado, comunica contenção. A tradução preserva a metáfora da mão e expressa com naturalidade a ideia de não levar o juízo a efeito.
- source_word: וָאַעַשׂ
  choice: agi
  rationale: O verbo עשה é amplo, podendo significar fazer ou agir. Aqui indica a conduta adotada por Deus em favor de seu nome, sem especificar além do texto.
- source_word: לְמַעַן שְׁמִי
  choice: por causa do meu nome
  rationale: Mantém a referência explícita ao nome de Deus e sua dimensão pública, sem reduzi-la por paráfrase a reputação ou honra.
- source_word: לְבִלְתִּי הֵחֵל
  choice: para que ele não fosse profanado
  rationale: O verbo חלל neste contexto significa profanar ou tratar como comum. O pronome explicita em português o objeto subentendido, o nome de Deus.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: diante das nações
  rationale: Expressa a dimensão pública da ação e corresponde naturalmente ao idioma hebraico 'aos olhos de'.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: das quais eu os havia tirado
  rationale: O hifil de יצא significa tirar ou fazer sair. O mais-que-perfeito situa essa ação antes da contenção descrita no versículo.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos das quais
  rationale: Preserva a repetição hebraica do motivo dos olhos, ainda que a formulação seja mais marcada do que a alternativa idiomática 'à vista das quais'.
theological_decisions:
- issue: A contenção divina depois da ameaça de juízo
  choice: A frase indica que Deus conteve sua mão, abstendo-se de executar o juízo ameaçado.
  alternative: Fiz voltar a minha mão; retirei a minha mão.
  rationale: A opção mantém a metáfora hebraica sem sugerir um movimento físico e sem acrescentar uma explicação doutrinária ao texto.
- issue: O sentido de 'meu nome'
  choice: Conservar 'meu nome' como expressão bíblica ligada à honra pública de Deus.
  alternative: Minha reputação; minha honra.
  rationale: O hebraico diz explicitamente 'meu nome'. Preservar essa forma mantém sua ressonância teológica e a tensão própria do texto.
- issue: Objeto implícito de 'profanar'
  choice: Usar o pronome 'ele', retomando 'meu nome'.
  alternative: Para não profanar [meu nome].
  rationale: O objeto está implícito no hebraico, mas deve ser recuperado em português para clareza; o antecedente imediato determina a referência sem eliminar ambiguidade relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a metáfora da mão e a repetição do motivo visual. 'Contive a minha mão' é natural sem apagar o caráter figurado; 'diante dos olhos das quais' é deliberadamente mais formal para refletir לְעֵינֵיהֶם.
