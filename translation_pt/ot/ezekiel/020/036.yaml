  source_fidelity: 'A tradução preserva adequadamente a comparação כַּאֲשֶׁר ... כֵּן, o paralelismo entre os dois verbos no nifal de שׁפט e as preposições relacionais: Deus entra em juízo “com” os antepassados e “com” os destinatários. “No deserto da terra do Egito” mantém integralmente a formulação hebraica, inclusive sua expressão geográfica mais extensa. “Senhor Yahweh” traduz distintamente אֲדֹנָי e יהוה.'
  naturalness: O português é moderno, claro e digno. “Assim como ... assim” é natural e torna explícita a correspondência do hebraico. “Entrar em juízo com” é uma formulação formal, mas apropriada ao registro profético-jurídico e está devidamente esclarecida na nota. “Antepassados” evita a leitura moderna e demasiadamente estrita de “pais”, sem perder a referência aos ancestrais da geração do êxodo.
  terminology: A terminologia judicial foi mantida de modo coerente no passado e no futuro. A forma “Senhor Yahweh” é apropriada para a sequência אֲדֹנָי יהוה e não funde os dois títulos. A nota apresenta de maneira equilibrada a alternativa mais simples “julgar”, sem impor uma interpretação doutrinária adicional.
