source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר נִשְׁפַּ֨טְתִּי֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/מִדְבַּ֖ר אֶ֣רֶץ מִצְרָ֑יִם כֵּ֚ן אִשָּׁפֵ֣ט אִתְּ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/036.yaml
  text: Just as I entered into judgment with your fathers in the wilderness of the land of Egypt[a], so I will enter into judgment with you, declares the Lord GOD.
translation:
  language: pt
  text: Assim como entrei em juízo com os seus antepassados no deserto da terra do Egito, assim entrarei em juízo com vocês — declaração do Senhor Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim como julguei os seus antepassados [...] assim julgarei vocês”. O verbo hebraico pode ser traduzido simplesmente por “julgar”, mas “entrar em juízo” preserva sua nuance judicial formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Assim como ... assim
  rationale: Preserva de modo claro e natural a correspondência explícita entre a ação divina passada e a futura.
- source_word: נִשְׁפַּטְתִּי ... אִשָּׁפֵט
  choice: entrei em juízo ... entrarei em juízo
  rationale: A construção com o nifal de שׁפט expressa uma atuação ou contenda judicial, não apenas a emissão de uma sentença; a repetição mantém o paralelismo hebraico.
- source_word: אֶת אֲבוֹתֵיכֶם ... אִתְּכֶם
  choice: com os seus antepassados ... com vocês
  rationale: A regência com 'com' reproduz a ideia de envolvimento em procedimento judicial sem explicitar 'contra', nuance adversativa que o contexto sugere, mas que a formulação hebraica não impõe aqui.
- source_word: בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  choice: no deserto da terra do Egito
  rationale: Mantém todos os componentes da expressão hebraica e sua possível referência ao deserto ligado à saída do Egito, sem simplificá-la para 'deserto do Egito'.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: Emprega uma fórmula profética corrente em português e traduz tanto אֲדֹנָי quanto o nome divino יהוה, evitando a repetição artificial 'Senhor SENHOR'.
theological_decisions:
- issue: Representação do nome divino יהוה após אֲדֹנָי
  choice: Senhor Yahweh
  alternative: SENHOR Deus
  rationale: A forma 'Yahweh' preserva o nome pessoal da aliança presente no hebraico, enquanto 'Senhor' traduz אֲדֹנָי; isso evita fundir os dois termos ou produzir 'Senhor SENHOR'.
- issue: Força judicial do nifal de שׁפט
  choice: entrei/entrarei em juízo com
  alternative: julguei/julgarei
  rationale: A escolha conserva a dimensão de confronto ou procedimento judicial sem determinar além do texto se a ênfase recai na contenda, no julgamento ou na sentença.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. 'Antepassados' evita a possível leitura exclusivamente masculina de 'pais' neste contexto geracional. A expressão mais incomum 'deserto da terra do Egito' foi mantida por fidelidade à formulação hebraica.
