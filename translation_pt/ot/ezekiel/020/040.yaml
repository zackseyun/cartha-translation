source:
  edition: WLC
  text: כִּ֣י בְ/הַר קָדְשִׁ֞/י בְּ/הַ֣ר מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה שָׁ֣ם יַעַבְדֻ֜/נִי כָּל בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖/ה בָּ/אָ֑רֶץ שָׁ֣ם אֶרְצֵ֔/ם וְ/שָׁ֞ם אֶדְר֣וֹשׁ אֶת תְּרוּמֹֽתֵי/כֶ֗ם וְ/אֶת רֵאשִׁ֛ית מַשְׂאוֹתֵי/כֶ֖ם בְּ/כָל קָדְשֵׁי/כֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/040.yaml
  text: For on my holy mountain[a], on the high mountain of Israel, declares the Lord GOD, there all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your contributions and the firstfruits of your offerings[c][b], with all your holy things.
translation:
  language: pt
  text: Pois no meu santo monte, no alto monte de Israel, declara o Senhor Yahweh, ali toda a casa de Israel, toda ela, me servirá na terra. Ali eu os aceitarei e ali requererei as suas contribuições[a] e as primícias das suas ofertas[b], com todas as suas coisas sagradas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as suas ofertas”; o termo hebraico indica porções separadas e apresentadas a Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “a primeira porção das suas dádivas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “todas as suas ofertas sagradas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְהַר קָדְשִׁי
  choice: no meu santo monte
  rationale: A preposição בְ é locativa, e “no meu santo monte” é natural em português, preservando o cenário geográfico e cultual.
- source_word: בְהַר מְרוֹם יִשְׂרָאֵל
  choice: no alto monte de Israel
  rationale: מְרוֹם expressa altura ou elevação; “alto monte” mantém o paralelismo com “santo monte” sem ampliar o sentido.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם é uma fórmula profética de pronunciamento. “Declaração do” é idiomático e Yahweh representa explicitamente o nome divino, evitando a combinação artificial “Senhor SENHOR”.
- source_word: יַעַבְדֻנִי
  choice: me servirá
  rationale: עבד abrange servir e prestar culto. “Servirá” conserva essa amplitude, enquanto o contexto das ofertas comunica a dimensão cultual.
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: toda a casa de Israel, toda ela
  rationale: A repetição hebraica intensifica a totalidade; a formulação portuguesa preserva deliberadamente essa ênfase.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: O artigo e o contexto de restauração apontam para a terra de Israel, não para um país genérico.
- source_word: אֶרְצֵם
  choice: eu os aceitarei
  rationale: רצה aqui indica acolhimento favorável, com ressonância sacrificial e relacional; “aceitarei” é conciso e adequado.
- source_word: אֶדְרוֹשׁ
  choice: requererei
  rationale: דרש pode significar buscar, pedir ou requerer. No contexto do que é devido a Deus, “requererei” conserva a força da obrigação sem a dureza adicional de “exigirei”.
- source_word: תְּרוּמֹתֵיכֶם
  choice: as suas contribuições
  rationale: תְּרוּמָה designa uma porção separada e apresentada a Deus. “Contribuições” preserva essa noção sem recorrer ao termo técnico “ofertas alçadas”.
- source_word: רֵאשִׁית מַשְׂאוֹתֵיכֶם
  choice: as primícias das suas ofertas
  rationale: רֵאשִׁית denota o primeiro ou a porção inicial, frequentemente as primícias; מַשְׂאוֹת designa aqui aquilo que é trazido ou elevado como oferta.
- source_word: בְּכָל קָדְשֵׁיכֶם
  choice: e todas as suas coisas sagradas
  rationale: No encadeamento da frase, בְ pode acompanhar o conjunto requerido e ser expresso naturalmente por “e”. קָדְשֵׁיכֶם é amplo e não deve ser limitado apenas a uma classe específica de ofertas.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: “Yahweh” preserva o nome pactual expresso no hebraico, enquanto “Senhor” traduz אֲדֹנָי; a alternativa tradicional pode ocultar a distinção entre título e nome.
- issue: Sentido cultual de עבד
  choice: servir
  alternative: adorar
  rationale: O contexto inclui culto e ofertas, mas o verbo é semanticamente mais amplo que “adorar”. “Servir” preserva tanto a lealdade pactual quanto o serviço cultual.
- issue: Alcance de כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: toda a casa de Israel, toda ela
  alternative: a casa inteira de Israel
  rationale: A tradução conserva a duplicação enfática sem decidir além do texto como essa totalidade se relaciona com questões escatológicas ou identitárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mas a ênfase repetitiva do hebraico foi mantida. Os marcadores de todas as notas aparecem no texto principal.
