base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/019.yaml
  text: I am Yahweh your God; walk in my statutes[a], and keep my judgments and do them.
translation:
  language: pt
  text: Eu sou Yahweh, o Deus de vocês. Andem segundo os meus estatutos, guardem as minhas ordenanças e pratiquem-nas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Eu sou Yahweh, o Deus de vocês
  rationale: Reproduz a ênfase do pronome independente, preserva o nome divino e verte o sufixo de segunda pessoa do plural de modo claro e amplamente compreensível.
- source_word: בְּחֻקּוֹתַי לֵכוּ
  choice: Andem segundo os meus estatutos
  rationale: O idioma hebraico de caminhar nos estatutos descreve a conduta orientada por eles. Em português, «andar segundo» preserva a metáfora e soa mais natural que «andar em».
- source_word: מִשְׁפָּטַי
  choice: minhas ordenanças
  rationale: No contexto legal e pactual, מִשְׁפָּטִים designa determinações ou normas estabelecidas. «Ordenanças» mantém o sentido jurídico e distingue o termo de חֻקּוֹתַי.
- source_word: שִׁמְרוּ
  choice: guardem
  rationale: Preserva o sentido pactual de observar cuidadosamente e obedecer, em formulação concisa.
- source_word: וַעֲשׂוּ אוֹתָם
  choice: e pratiquem-nas
  rationale: Expressa a execução efetiva das ordenanças e evita a construção pouco natural «façam-nas» em português.
theological_decisions:
- issue: Representação do nome pactual יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. «De vocês» torna explícito o plural do hebraico; «andem», «guardem» e «pratiquem» mantêm a sequência de imperativos.
