  text: וָ/אַ֨עַשׂ֙ לְמַ֣עַן שְׁמִ֔/י לְ/בִלְתִּ֥י הֵחֵ֛ל לְ/עֵינֵ֥י הַ/גּוֹיִ֖ם אֲשֶׁר הֵ֣מָּה בְ/תוֹכָ֑/ם אֲשֶׁ֨ר נוֹדַ֤עְתִּי אֲלֵי/הֶם֙ לְ/עֵ֣ינֵי/הֶ֔ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/009.yaml
  text: But I acted for the sake of my name[a], so that it should not be profaned in the sight of the nations among whom they were[c][b], to whom I had made myself known in their sight by bringing them out of the land of Egypt.
translation:
  language: pt
  text: Mas agi por causa do meu nome[a], para que ele não fosse profanado diante das nações entre as quais eles estavam, às quais me dei a conhecer diante dos seus olhos[b], ao tirá-los da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por amor do meu nome”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “às quais me revelei diante dos seus olhos”. A expressão também pode ser entendida como “entre as quais me tornei conhecido publicamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: Mas agi
  rationale: O verbo עשה é amplo, mas aqui descreve a intervenção decisiva de Deus em contraste com a rebeldia mencionada no contexto anterior; “agi” é natural e preciso.
- source_word: לְמַעַן שְׁמִי
  choice: por causa do meu nome
  rationale: Preserva o idioma hebraico e comunica que a ação visa resguardar a honra pública ligada ao nome e ao caráter revelado de Deus.
- source_word: לְבִלְתִּי הֵחֵל
  choice: para que ele não fosse profanado
  rationale: A formulação passiva liga naturalmente o pronome ao “nome” e mantém o sentido sacral de חלל, isto é, tratar como comum ou desonrar o que é santo.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: diante das nações
  rationale: Expressa a dimensão pública e visível da ação sem reproduzir de modo rígido o idioma “aos olhos de”.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: entre as quais eles estavam
  rationale: Mantém a relativa e a formulação simples do hebraico, sem acrescentar explicitamente a ideia de habitação.
- source_word: אֲשֶׁר נוֹדַעְתִּי אֲלֵיהֶם
  choice: às quais me dei a conhecer
  rationale: O nifal de ידע admite a ideia de tornar-se conhecido ou revelar-se; “me dei a conhecer” preserva a autocomunicação divina e o complemento indireto.
- source_word: לְעֵינֵיהֶם
  choice: diante dos seus olhos
  rationale: Conserva a repetição visual deliberada do hebraico e a distingue do complemento “às quais”.
- source_word: לְהוֹצִיאָם
  choice: ao tirá-los
  rationale: A expressão pode indicar ocasião ou meio. “Ao tirá-los” mantém essa relação suficientemente aberta e produz português natural.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: É a expressão bíblica corrente em português e se combina naturalmente com “tirar de”.
theological_decisions:
- issue: Sentido de Deus agir por causa do seu nome
  choice: Manter o idioma “por causa do meu nome”, ligado à honra pública do caráter revelado de Deus.
  alternative: Expandir como “para preservar minha reputação”.
  rationale: A expansão reduziria indevidamente o rico conceito bíblico do nome a mera reputação; a tradução preserva a formulação e sua tensão teológica.
- issue: Força de חלל aplicado ao nome divino
  choice: Traduzir como “profanado”.
  alternative: “desonrado”, “contaminado” ou a construção ativa “para não profanar”.
  rationale: “Profanado” retém a dimensão de santidade central em Ezequiel. A construção passiva é contextualmente plausível, mas a nota registra a ambiguidade de voz do infinitivo hebraico.
- issue: Nuance de נוֹדַעְתִּי
  choice: “me dei a conhecer”.
  alternative: “tornei-me conhecido” ou “me revelei”.
  rationale: A escolha comunica autodesvelamento sem impor uma distinção técnica entre revelação e manifestação pública.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “diante” preserva a ênfase hebraica na visibilidade pública, enquanto “diante dos seus olhos” mantém distinto o segundo sintagma לְעֵינֵיהֶם. Todos os marcadores de nota aparecem no texto principal.
