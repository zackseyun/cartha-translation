  source_fidelity: 'O sentido central está bem preservado: a ordem é rejeitar os objetos detestáveis associados aos olhos e não se tornar impuro por meio dos ídolos do Egito; a autodeclaração de Yahweh também está correta. Contudo, a combinação de imperativo singular (“jogue”) com a proibição plural (“não se contaminem”) na mesma coordenação é gramaticalmente instável em português. A formulação distributiva inteiramente no singular conserva adequadamente a força de אִישׁ, embora os imperativos hebraicos estejam no plural por se dirigirem ao grupo.'
  naturalness: A redação é clara e de registro apropriado, mas a discordância entre “Cada um de vocês jogue” e “não se contaminem” prejudica a fluência. “Que cada um de vocês jogue ... e não se contamine” é natural, claro e mantém a responsabilidade individual enfatizada no versículo.
  terminology: “Yahweh”, “ídolos”, “contamine” e “Deus de vocês” são escolhas adequadas. A nota sobre גִּלּוּלִים preserva corretamente o tom depreciativo sem tornar o texto principal excessivamente áspero. “Ídolos de esterco” é uma explicação lexical aceitável em nota.
