base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/007.yaml
  text: And I said to them[a], ‘Each man, throw away the detestable things before his eyes, and do not defile yourselves with the idols of Egypt[b]. I am Yahweh your God.’
translation:
  language: pt
  text: 'E eu lhes disse: “Que cada um de vocês jogue fora as coisas detestáveis diante dos seus olhos[a] e não se contamine com os ídolos do Egito[b]. Eu sou Yahweh, o Deus de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “as coisas detestáveis de seus olhos”, expressão que se refere às coisas abomináveis para as quais cada pessoa olha ou que deseja; provavelmente, objetos idolátricos.
    reason: lexical_alternative
  - marker: b
    text: Aqui, o termo hebraico traduzido como “ídolos” é uma designação fortemente depreciativa, frequente em Ezequiel; também poderia ser traduzido como “ídolos imundos” ou, mais literalmente, “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu lhes disse
  rationale: O waw consecutivo dá continuidade à narrativa passada; “E eu lhes disse” preserva essa sequência de modo natural.
- source_word: אִישׁ
  choice: Cada um de vocês
  rationale: O singular tem força distributiva diante dos imperativos plurais. A formulação comunica a responsabilidade individual e concorda naturalmente com a continuação no plural.
- source_word: שִׁקּוּצֵי עֵינָיו
  choice: as coisas detestáveis diante dos seus olhos
  rationale: Mantém a imagem expressiva do hebraico sem restringi-la antecipadamente a uma paráfrase; no contexto, trata-se provavelmente de objetos idolátricos contemplados ou desejados.
- source_word: הַשְׁלִיכוּ
  choice: jogue fora
  rationale: Expressa uma rejeição decidida em português moderno e corresponde à força do imperativo hebraico.
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: os ídolos do Egito
  rationale: Comunica claramente o referente. A forte carga depreciativa do termo característico de Ezequiel é indicada em nota, evitando uma formulação excessivamente estranha no texto principal.
- source_word: אַל תִּטַּמָּאוּ
  choice: não se contaminem
  rationale: Preserva a nuance reflexiva e o sentido ritual e moral da impureza ligada à idolatria.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: No contexto da declaração de Yahweh e da relação de aliança com Israel, o termo tem referência singular.
theological_decisions:
- issue: Sentido da expressão שִׁקּוּצֵי עֵינָיו
  choice: as coisas detestáveis diante dos seus olhos
  alternative: os ídolos detestáveis que cada um contempla
  rationale: A opção principal preserva a imagem e certa abertura da expressão hebraica, enquanto o contexto aponta para objetos idolátricos sem exigir que essa interpretação seja incorporada integralmente ao texto.
- issue: Força depreciativa de גִּלּוּלִים
  choice: ídolos
  alternative: ídolos imundos; ídolos de esterco
  rationale: “Ídolos” mantém clareza e dignidade no texto principal; a nota registra o desprezo deliberado contido no vocábulo hebraico.
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração conserva o nome pessoal presente no texto hebraico, sem convertê-lo em título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cada um de vocês” torna explícita a força distributiva de אִישׁ e permite uma sequência idiomática entre o imperativo singular e a proibição plural. As notas preservam tanto o hebraísmo ligado aos olhos quanto a carga pejorativa do termo usado para os ídolos.
