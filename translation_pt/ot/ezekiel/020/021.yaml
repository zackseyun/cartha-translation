revisions:
- from: Mas os filhos se rebelaram contra mim. Não andaram nos meus estatutos nem guardaram os meus juízos para os cumprir — juízos pelos quais, se uma pessoa os cumprir, viverá.[a][b] Profanaram os meus sábados. Então eu disse que derramaria sobre eles o meu furor e levaria até o fim a minha ira contra eles no deserto.
  to: Mas os filhos se rebelaram contra mim. Não andaram nos meus estatutos nem guardaram os meus juízos para os cumprir — juízos que, se uma pessoa os cumprir, viverá por eles.[a][b] Profanaram os meus sábados. Então eu disse que derramaria sobre eles o meu furor e levaria até o fim a minha ira contra eles no deserto.
  rationale: A única alteração substitui a relativa «pelos quais» por «que» e deixa a expressão instrumental «por eles» na posição que corresponde ao hebraico. Assim, a frase fica mais natural em português, sem alterar seu sentido, sua ambiguidade teológica ou as notas existentes.
