  text: וַ/יַּמְרוּ בִ֣/י הַ/בָּנִ֗ים בְּ/חֻקּוֹתַ֣/י לֹֽא הָ֠לָכוּ וְ/אֶת מִשְׁפָּטַ֨/י לֹא שָׁמְר֜וּ לַ/עֲשׂ֣וֹת אוֹתָ֗/ם אֲשֶׁר֩ יַעֲשֶׂ֨ה אוֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֥וֹת אַפִּ֛/י בָּ֖/ם בַּ/מִּדְבָּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
translation:
  language: pt
  text: Mas os filhos se rebelaram contra mim. Não andaram nos meus estatutos nem guardaram os meus juízos para os cumprir — juízos que, se uma pessoa os cumprir, viverá por eles.[a][b] Profanaram os meus sábados. Então eu disse que derramaria sobre eles o meu furor e levaria até o fim a minha ira contra eles no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o homem”, usado aqui de modo genérico para qualquer ser humano.'
    reason: lexical_alternative
  - marker: b
    text: Esta declaração retoma Levítico 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: se rebelaram contra mim
  rationale: מרה com ב indica rebelião dirigida contra Deus; a formulação preserva a força pactual e é natural em português.
- source_word: הַבָּנִים
  choice: os filhos
  rationale: O termo designa coletivamente a geração seguinte de Israel. “Os filhos” preserva a imagem geracional do hebraico sem acrescentar um referente ausente.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: não andaram nos meus estatutos
  rationale: Mantém a metáfora pactual de “andar” e verte חֻקּוֹת por “estatutos”, termo jurídico compreensível e tradicional.
- source_word: מִשְׁפָּטַי
  choice: meus juízos
  rationale: Preserva o sentido jurídico de מִשְׁפָּטִים e a ligação com a oração explicativa seguinte.
- source_word: לֹא שָׁמְרוּ לַעֲשׂוֹת אוֹתָם
  choice: nem guardaram os meus juízos para os cumprir
  rationale: Conserva tanto a ideia de guardar quanto a finalidade prática expressa pelo infinitivo de עשׂה.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם
  choice: juízos pelos quais, se uma pessoa os cumprir, viverá
  rationale: Expressa naturalmente a relação condicional implícita, preserva o singular genérico de הָאָדָם e mantém a ideia de viver por meio deles.
- source_word: אֶת שַׁבְּתוֹתַי חִלֵּלוּ
  choice: profanaram os meus sábados
  rationale: “Profanar” conserva o contraste entre santo e comum implicado pelo piel de חלל.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: derramaria sobre eles o meu furor
  rationale: Preserva a metáfora de derramar e distingue חֵמָה, “furor”, de אַף, “ira”, na oração seguinte.
- source_word: לְכַלּוֹת אַפִּי בָּם
  choice: levaria até o fim a minha ira contra eles
  rationale: כלה comunica levar a ira à sua plena execução. A formulação é natural em português e evita sugerir que a ira divina simplesmente se extingue por exaustão.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: No contexto do êxodo, “deserto” é a designação corrente e clara em português para מִדְבָּר.
theological_decisions:
- issue: Uso genérico de הָאָדָם na declaração sobre viver pela obediência
  choice: uma pessoa
  alternative: o homem; o ser humano
  rationale: O substantivo hebraico singular é genérico, não restrito ao sexo masculino. “Uma pessoa” comunica esse alcance em português atual sem resolver ou ampliar a relação teológica entre cumprimento e vida.
- issue: Relação entre praticar os juízos e viver por eles
  choice: se uma pessoa os cumprir, viverá por eles
  alternative: a pessoa que os cumprir viverá por eles
  rationale: A formulação condicional torna explícita a relação sintática normalmente entendida no hebraico, mas não define a natureza dessa vida nem harmoniza a frase com sistemas teológicos posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se as metáforas pactuais “andar”, “profanar” e “derramar”, enquanto a sintaxe é ajustada à fluência do português. Os marcadores foram colocados junto à declaração a que ambas as notas efetivamente se referem.
