  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ית בַּֽ/חֲמִשִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ בָּ֧אוּ אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י יִשְׂרָאֵ֖ל לִ/דְרֹ֣שׁ אֶת יְהוָ֑ה וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/001.yaml
  text: And it happened in the seventh year[a], in the fifth month, on the tenth day of the month, that some of the elders of Israel came to inquire of Yahweh[b], and they sat before me.
translation:
  language: pt
  text: Aconteceu que, no sétimo ano, no quinto mês, no décimo dia do mês, alguns dos anciãos de Israel[a] vieram consultar Yahweh[b] e se sentaram diante de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “homens dentre os anciãos de Israel”, o que pode indicar representantes escolhidos entre os anciãos.
    reason: lexical_alternative
  - marker: b
    text: “Consultar Yahweh” também pode ser traduzido como “buscar Yahweh”; aqui, o contexto sugere a procura formal de orientação ou de uma resposta divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz naturalmente um novo episódio narrativo datado, preservando a função da fórmula hebraica sem recorrer a linguagem arcaica.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִית
  choice: no sétimo ano
  rationale: Mantém apenas a informação expressa no hebraico, sem acrescentar que se trata do exílio de Joaquim.
- source_word: בַּחֲמִשִׁי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no quinto mês, no décimo dia do mês
  rationale: Preserva a fórmula cronológica e a ordem do texto hebraico em português claro e formal.
- source_word: בָּאוּ אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: alguns dos anciãos de Israel vieram
  rationale: Exprime de modo natural o sentido provável do hebraico, literalmente 'homens dentre os anciãos de Israel', indicando integrantes ou representantes desse grupo; a forma literal é registrada em nota.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: consultar Yahweh
  rationale: Neste contexto de comparecimento diante do profeta, דרש indica a busca formal de orientação ou resposta divina. 'Consultar' comunica esse sentido com clareza, sem excluir em nota o valor mais amplo de 'buscar'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּשְׁבוּ לְפָנָי
  choice: e se sentaram diante de mim
  rationale: Reproduz tanto a postura física quanto o caráter formal de comparecer à presença do profeta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Referência cronológica do 'sétimo ano'
  choice: Não especificar o marco cronológico
  alternative: no sétimo ano do exílio de Joaquim
  rationale: Embora o contexto do livro permita identificar o provável marco, essa informação não está declarada neste versículo e, por isso, não foi inserida no texto.
- issue: Sentido de דרש em relação a Deus
  choice: consultar Yahweh
  alternative: buscar Yahweh
  rationale: O cenário sugere uma consulta formal em busca de resposta divina, mas a nota preserva a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. A repetição na data conserva a solenidade da fórmula hebraica. O nome Yahweh é mantido, e as ambiguidades relevantes são preservadas em notas.
