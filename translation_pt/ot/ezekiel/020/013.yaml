  text: וַ/יַּמְרוּ בִ֨/י בֵֽית יִשְׂרָאֵ֜ל בַּ/מִּדְבָּ֗ר בְּ/חֻקּוֹתַ֨/י לֹא הָלָ֜כוּ וְ/אֶת מִשְׁפָּטַ֣/י מָאָ֗סוּ אֲשֶׁר֩ יַעֲשֶׂ֨ה אֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם וְ/אֶת שַׁבְּתֹתַ֖/י חִלְּל֣וּ מְאֹ֑ד וָ/אֹמַ֞ר לִ/שְׁפֹּ֨ךְ חֲמָתִ֧/י עֲלֵי/הֶ֛ם בַּ/מִּדְבָּ֖ר לְ/כַלּוֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/013.yaml
  text: But the house of Israel rebelled against me in the wilderness[a]. They did not walk in my statutes, and they rejected my judgments, which if a person does them, he will live by them. They greatly profaned my Sabbaths. Then I said I would pour out my wrath on them in the wilderness[c][b], to put an end to them.
translation:
  language: pt
  text: Mas a casa de Israel se rebelou contra mim no deserto. Não andaram segundo os meus estatutos e rejeitaram os meus juízos[a], que, se uma pessoa[b] os praticar, viverá por eles[c]. Profanaram gravemente os meus sábados. Então eu disse que derramaria sobre eles a minha ira no deserto, para pôr fim a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as minhas ordenanças».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «o homem», em sentido genérico, isto é, qualquer pessoa.'
    reason: lexical_alternative
  - marker: c
    text: Esta formulação retoma Levítico 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: se rebelou contra mim
  rationale: O verbo מרה com ב indica rebelião dirigida contra Deus. O singular concorda naturalmente em português com o coletivo «a casa de Israel».
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a designação profética corporativa e sua imagem de casa ou linhagem, sem reduzi-la simplesmente a «Israel».
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: «Deserto» é a forma corrente e amplamente compreensível em português para o cenário do êxodo, incluindo regiões ermas não necessariamente arenosas.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: Não andaram segundo os meus estatutos
  rationale: Preserva a metáfora hebraica de andar como modo de vida, com «segundo» tornando a expressão natural em português.
- source_word: מִשְׁפָּטַי
  choice: os meus juízos
  rationale: Conserva a nuance judicial e a combinação tradicional com «estatutos»; «ordenanças» permanece uma alternativa legítima indicada em nota.
- source_word: מָאָסוּ
  choice: rejeitaram
  rationale: Expressa claramente a recusa da vontade pactual sem intensificar o termo para desprezo emocional explícito.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם
  choice: os quais, se uma pessoa os praticar, viverá por eles
  rationale: Mantém o singular representativo, a condicionalidade percebida da construção e a fórmula «viverá por eles», sem explicar de modo restritivo a natureza da vida prometida.
- source_word: הָאָדָם
  choice: uma pessoa
  rationale: Aqui אָדָם tem força genérica e representativa. «Uma pessoa» comunica essa abrangência naturalmente em português; a forma mais literal é registrada em nota.
- source_word: שַׁבְּתֹתַי
  choice: os meus sábados
  rationale: O plural do hebraico é preservado e mantém a ênfase de Ezequiel no sábado como sinal da aliança.
- source_word: חִלֵּלוּ מְאֹד
  choice: Profanaram gravemente
  rationale: «Profanaram» traduz a violação do caráter santo, e «gravemente» expressa o intensificador מְאֹד em português idiomático.
- source_word: לִשְׁפֹּךְ חֲמָתִי
  choice: derramaria sobre eles a minha ira
  rationale: Preserva a imagem hebraica de derramar a ira e explicita naturalmente em português a intenção introduzida por «eu disse».
- source_word: לְכַלּוֹתָם
  choice: para pôr fim a eles
  rationale: Comunica o resultado extremo pretendido pelo verbo כלה sem acrescentar uma especificação sobre o modo de destruição.
theological_decisions:
- issue: O singular genérico הָאָדָם na fórmula de vida da aliança
  choice: uma pessoa ... viverá por eles
  alternative: o homem ... viverá por eles
  rationale: O substantivo hebraico singular é representativo de qualquer ser humano. A formulação escolhida preserva o singular e expressa seu alcance genérico de modo natural, enquanto a literalidade formal é informada em nota.
- issue: Alcance da promessa em וָחַי בָּהֶם
  choice: viverá por eles
  alternative: permanecerá vivo por meio deles
  rationale: A tradução retém a concisão e a tensão teológica da fórmula, sem limitar «viver» à sobrevivência física nem impor uma interpretação soteriológica específica.
- issue: Natureza da decisão divina em וָאֹמַר לִשְׁפֹּךְ
  choice: eu disse que derramaria
  alternative: decidi derramar
  rationale: A tradução conserva o verbo «disse» e representa o infinitivo como ação pretendida, evitando transformar explicitamente a fala em decreto irrevogável.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa legibilidade brasileira. A metáfora pactual «andar segundo» e a expressão «viverá por eles» foram mantidas por sua importância literária e intertextual; construções excessivamente arcaicas foram evitadas.
