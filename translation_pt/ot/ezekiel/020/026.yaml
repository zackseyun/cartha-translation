source:
  edition: WLC
  text: וָ/אֲטַמֵּ֤א אוֹתָ/ם֙ בְּ/מַתְּנוֹתָ֔/ם בְּ/הַעֲבִ֖יר כָּל פֶּ֣טֶר רָ֑חַם לְמַ֣עַן אֲשִׁמֵּ֔/ם לְמַ֨עַן֙ אֲשֶׁ֣ר יֵֽדְע֔וּ אֲשֶׁ֖ר אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/026.yaml
  text: And I defiled them through their gifts[a], by making every firstborn pass through the fire, so that I might devastate them[d][c][b], so that they might know that I am Yahweh.
translation:
  language: pt
  text: Eu os tornei impuros por meio de suas dádivas[a], fazendo passar cada primogênito[b][c], a fim de devastá-los[d], para que soubessem que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «suas ofertas».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «todo aquele que abre o ventre», expressão hebraica que designa o primogênito.
    reason: lexical_alternative
  - marker: c
    text: A expressão «fazer passar» descreve um ato ritual e, neste contexto, provavelmente alude ao sacrifício de crianças. O hebraico deste versículo não traz explicitamente as palavras «pelo fogo».
    reason: cultural_note
  - marker: d
    text: 'Ou: «deixá-los desolados» ou «deixá-los horrorizados».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲטַמֵּא
  choice: Eu os tornei impuros
  rationale: Preserva o sentido causativo do hifil de טמא e sua força cultual e moral, sem atenuar a agência divina expressa no hebraico.
- source_word: בְּמַתְּנוֹתָם
  choice: por meio de suas dádivas
  rationale: Expressa o valor instrumental de בְּ e mantém o sentido amplo de מַתָּנוֹת, que neste contexto pode referir-se a ofertas cultuais.
- source_word: בְּהַעֲבִיר
  choice: fazendo passar
  rationale: Mantém a construção causativa e a formulação ritual do hebraico. Não acrescenta «pelo fogo» ao texto principal, pois essas palavras não aparecem explicitamente neste versículo.
- source_word: כָּל פֶּטֶר רָחַם
  choice: cada primogênito
  rationale: Traduz de modo natural o idiomatismo hebraico «todo aquele que abre o ventre», preservado em nota.
- source_word: לְמַעַן אֲשִׁמֵּם
  choice: a fim de devastá-los
  rationale: O hifil de שמם pode indicar causar desolação, devastar ou deixar horrorizado. «Devastar» se ajusta ao contexto de juízo sem restringir o sentido à reação emocional.
- source_word: לְמַעַן אֲשֶׁר יֵדְעוּ
  choice: para que soubessem
  rationale: Preserva a finalidade expressa pela fórmula recorrente em Ezequiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Agência divina na impureza de Israel
  choice: Manter a declaração direta «Eu os tornei impuros» e o gerúndio «fazendo passar».
  alternative: Atenuar para «Eu os entreguei à impureza» ou atribuir explicitamente todo o ato apenas aos israelitas.
  rationale: O hebraico apresenta Deus como sujeito da ação causativa. A tradução conserva essa tensão teológica, sem convertê-la silenciosamente em mera permissão.
- issue: Rito envolvendo os primogênitos
  choice: Traduzir o idiomatismo como «cada primogênito» e manter «fazendo passar» sem acrescentar «pelo fogo» no texto principal.
  alternative: Traduzir «cada primogênito pelo fogo» ou usar apenas a forma literal «todo aquele que abre o ventre».
  rationale: O contexto provavelmente alude ao sacrifício de crianças, mas «fogo» não está expresso no hebraico deste versículo. A nota comunica a provável referência cultural sem eliminar a precisão textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a repetição finalística do hebraico («a fim de... para que...»), a agência divina e a ambiguidade do rito, evitando inserir «pelo fogo» no texto principal sem apoio lexical explícito neste versículo.
