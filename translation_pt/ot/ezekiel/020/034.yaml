  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפוֹצֹתֶ֖ם בָּ֑/ם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/חֵמָ֖ה שְׁפוּכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/034.yaml
  text: I will bring you out from the peoples and gather you from the lands where you have been scattered[c][b][a], with a strong hand and an outstretched arm and with wrath poured out.
translation:
  language: pt
  text: Eu os tirarei do meio dos povos[a] e os reunirei das terras onde vocês foram espalhados, com mão forte e braço estendido[b], e com ira derramada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das nações”.'
    reason: lexical_alternative
  - marker: b
    text: A formulação bíblica tradicional também pode ser expressa como “com mão poderosa e braço estendido”.
    reason: cross_reference
  - marker: c
    text: 'Ou: “com furor derramado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Eu os tirarei
  rationale: O hifil de יצא tem sentido causativo, “fazer sair, tirar”. “Eu os tirarei” é natural em português e mantém a evocação do êxodo.
- source_word: הָעַמִּים
  choice: os povos
  rationale: O plural עַמִּים designa os grupos humanos entre os quais Israel foi disperso. “Povos” é direto e preserva a distinção paralela em relação a “terras”.
- source_word: וְקִבַּצְתִּי
  choice: e os reunirei
  rationale: קבץ é o verbo usual para reunir novamente os dispersos ou exilados. “Reunirei” comunica esse sentido com clareza.
- source_word: הָאֲרָצוֹת
  choice: das terras
  rationale: אֲרָצוֹת refere-se aos diversos territórios da dispersão. “Terras” preserva o sentido geográfico sem impor a ideia moderna de Estados nacionais.
- source_word: אֲשֶׁר נְפוֹצֹתֶם בָּם
  choice: onde vocês foram espalhados
  rationale: O nifal de פוץ é passivo, “ser espalhado”. A formulação mantém a referência à dispersão já sofrida e é natural no português atual.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Tradução próxima da expressão hebraica, que também evoca a linguagem do êxodo. “Mão forte” é compreensível e conserva a imagem.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: e braço estendido
  rationale: A expressão tradicional descreve a ação divina decisiva. “Braço estendido” é fiel, reconhecível e natural.
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: e com ira derramada
  rationale: חֵמָה pode indicar ira ou furor, e שְׁפוּכָה significa “derramada”. A escolha preserva sem suavização a força judicial da imagem profética.
theological_decisions:
- issue: Imagens do êxodo em um contexto que combina reunião e juízo
  choice: Manter “mão forte”, “braço estendido” e “ira derramada” lado a lado.
  alternative: Interpretar a reunião somente como libertação restauradora ou, no sentido oposto, somente como punição.
  rationale: O hebraico evoca deliberadamente o êxodo, mas o contexto de Ezequiel 20 une a reunião dos dispersos ao confronto judicial de Deus com seu povo. A tradução preserva essa tensão sem resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “vocês” explicita o plural do hebraico sem regionalismo excessivo. As imagens concretas e a cadência profética foram preservadas.
