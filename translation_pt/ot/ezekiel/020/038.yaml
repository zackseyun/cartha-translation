  text: וּ/בָרוֹתִ֣י מִ/כֶּ֗ם הַ/מֹּרְדִ֤ים וְ/הַ/פּֽוֹשְׁעִים֙ בִּ֔/י מֵ/אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ אוֹצִ֣יא אוֹתָ֔/ם וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָב֑וֹא וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/038.yaml
  text: I will purge from among you the rebels and those who transgress against me[a]. I will bring them out of the land where they sojourn, but they will not enter the land of Israel[c][b]. Then you will know that I am Yahweh.
translation:
  language: pt
  text: Separarei do meio de vocês os rebeldes e os que transgridem contra mim.[a] Eu os tirarei da terra onde vivem como estrangeiros,[b] mas nenhum deles entrará na terra de Israel.[c] Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que se revoltam contra mim”. O verbo hebraico pode descrever transgressão grave ou revolta contra uma autoridade.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “da terra de suas peregrinações” ou “da terra de suas residências como estrangeiros”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega o verbo no singular, literalmente “não entrará”, com sentido distributivo: nenhum dos integrantes do grupo entrará.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוֹתִי
  choice: Eliminarei
  rationale: O verbo ברר, neste contexto judicial, indica separar e retirar do meio da comunidade os que não permanecerão nela. “Eliminarei do meio” comunica essa triagem punitiva em português natural, sem sugerir necessariamente execução.
- source_word: מִכֶּם
  choice: do meio de vocês
  rationale: A preposição מן expressa separação de dentro do grupo, sentido explicitado naturalmente por “do meio de vocês”.
- source_word: הַמֹּרְדִים
  choice: os rebeldes
  rationale: O particípio substantivado designa aqueles caracterizados por rebelião persistente.
- source_word: וְהַפּוֹשְׁעִים בִּי
  choice: e os que se revoltam contra mim
  rationale: פשע pode indicar transgressão ou revolta contra uma autoridade. “Revoltam-se contra mim” preserva o caráter pessoal e deliberado da ofensa, embora haja sobreposição semântica com מרד.
- source_word: מֵאֶרֶץ מְגוּרֵיהֶם
  choice: da terra onde vivem como estrangeiros
  rationale: מְגוּרִים designa residência temporária ou como estrangeiro; a formulação mantém essa nuance sem recorrer ao pouco corrente “peregrinações”.
- source_word: אוֹצִיא אוֹתָם
  choice: Eu os tirarei
  rationale: O hifil de יצא significa fazer sair ou tirar, aqui com objeto plural explícito.
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל
  choice: mas ... na terra de Israel
  rationale: אַדְמָה significa literalmente solo ou chão, mas aqui funciona como designação territorial. A conjunção tem força adversativa natural no contraste entre sair do exílio e não entrar em Israel.
- source_word: לֹא יָבוֹא
  choice: nenhum deles entrará
  rationale: A forma verbal hebraica está no singular, embora se refira distributivamente ao grupo plural mencionado. “Nenhum deles” preserva de modo natural esse valor individualizador.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O waw introduz a consequência do juízo; “então” explicita essa relação discursiva em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva essa função e representa uma transliteração amplamente reconhecida.
- issue: Força judicial de וּבָרוֹתִי
  choice: Eliminarei do meio de vocês
  alternative: Separarei do meio de vocês; peneirarei para fora do meio de vocês
  rationale: A escolha mantém a gravidade da retirada dos rebeldes da comunidade sem especificar um meio de punição que o versículo não declara.
- issue: Singular distributivo em לֹא יָבוֹא
  choice: nenhum deles entrará
  alternative: eles não entrarão; ele não entrará
  rationale: A formulação conserva a relação com o grupo plural e, ao mesmo tempo, reflete o singular hebraico como exclusão de cada integrante desse grupo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “vocês” para o plural de segunda pessoa. A ordem das notas segue a ocorrência no texto, e todas as marcas aparecem no corpo do versículo.
