source:
  edition: WLC
  text: וָ/אֲבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לָ/הֶ֑ם וַ/יִּרְאוּ֩ כָל גִּבְעָ֨ה רָמָ֜ה וְ/כָל עֵ֣ץ עָבֹ֗ת וַ/יִּזְבְּחוּ שָׁ֤ם אֶת זִבְחֵי/הֶם֙ וַ/יִּתְּנוּ שָׁם֙ כַּ֣עַס קָרְבָּנָ֔/ם וַ/יָּשִׂ֣ימוּ שָׁ֗ם רֵ֚יחַ נִיח֣וֹחֵי/הֶ֔ם וַ/יַּסִּ֥יכוּ שָׁ֖ם אֶת נִסְכֵּי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/028.yaml
  text: So I brought them into the land that I had lifted up my hand to give to them[a], and they saw every high hill and every leafy tree, and there they sacrificed their sacrifices, and there they presented the provocation of their offering, and there they set their pleasing aromas[c][b], and there they poured out their drink offerings.
translation:
  language: pt
  text: Então eu os trouxe para a terra que havia jurado dar-lhes, levantando a mão[a]. Eles viram toda colina alta e toda árvore frondosa[b]; ali ofereceram seus sacrifícios, ali apresentaram suas ofertas provocadoras[c], ali depositaram os aromas agradáveis de suas ofertas e ali derramaram suas ofertas de bebida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a terra que levantei a mão para dar-lhes”; levantar a mão era um gesto de juramento.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “toda colina alta e toda árvore verdejante”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a provocação de sua oferta”. A expressão indica que a oferta causava indignação.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲבִיאֵם
  choice: Então eu os trouxe
  rationale: O hifil de בוא significa “trazer”; “Então” expressa naturalmente a progressão narrativa do waw.
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: de mão levantada, havia jurado
  rationale: A expressão descreve o gesto de prestar juramento. A formulação conserva a imagem hebraica e explicita seu sentido em português corrente.
- source_word: כָל גִּבְעָה רָמָה וְכָל עֵץ עָבֹת
  choice: toda colina alta e toda árvore frondosa
  rationale: Mantém a descrição concreta dos locais associados ao culto ilícito; עָבֹת indica folhagem densa ou espessa.
- source_word: וַיִּזְבְּחוּ שָׁם אֶת־זִבְחֵיהֶם
  choice: ali ofereceram os seus sacrifícios
  rationale: “Ofereceram os seus sacrifícios” comunica com naturalidade o ato cultual, sem a repetição pouco idiomática “sacrificaram seus sacrifícios”.
- source_word: וַיִּתְּנוּ שָׁם כַּעַס קָרְבָּנָם
  choice: ali apresentaram suas ofertas provocadoras
  rationale: A expressão hebraica condensada caracteriza a oferta como causa de provocação ou ira, sem acrescentar explicitamente um objeto ausente no texto.
- source_word: וַיָּשִׂימוּ שָׁם רֵיחַ נִיחוֹחֵיהֶם
  choice: ali depositaram os aromas agradáveis de suas ofertas
  rationale: Conserva o verbo שׂים e a fórmula sacrificial רֵיחַ נִיחוֹחַ. “De suas ofertas” esclarece em português que os aromas procediam dos sacrifícios deles, sem sugerir que fossem de fato agradáveis a Deus nesse contexto idólatra.
- source_word: וַיַּסִּיכוּ שָׁם אֶת־נִסְכֵּיהֶם
  choice: ali derramaram suas ofertas de bebida
  rationale: Expressa claramente o ato de verter líquidos em culto; “ofertas de bebida” é mais acessível que “libações”.
theological_decisions:
- issue: Expressão de juramento נָשָׂא יָד
  choice: de mão levantada, havia jurado
  alternative: havia levantado a mão para dar-lhes
  rationale: A opção retém a imagem corporal e também torna inequívoco o sentido de juramento, evitando que a expressão literal pareça apenas um gesto sem função definida.
- issue: Linguagem dos locais de culto ilícito
  choice: toda colina alta e toda árvore frondosa
  alternative: todo alto e toda árvore verdejante
  rationale: O hebraico emprega aqui uma descrição concreta, não o substantivo técnico para “lugar alto”; a tradução não importa esse termo técnico.
- issue: Caráter ofensivo da oferta
  choice: suas ofertas provocadoras
  alternative: a provocação de sua oferta
  rationale: A formulação portuguesa expressa a construção hebraica comprimida sem especificar além do texto se a provocação se dirige explicitamente a Deus, embora o contexto o indique.
- issue: Aroma agradável em contexto idólatra
  choice: os aromas agradáveis de suas ofertas
  alternative: seus aromas agradáveis
  rationale: Preserva a fórmula cultual e o sufixo plural, mas evita afirmar interpretativamente que Deus acolheu com agrado esses sacrifícios ilícitos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “ali” reproduz a ênfase espacial do hebraico. Preferiu-se “ofertas de bebida” a “libações” por clareza, e preservou-se a imagem do juramento com a mão levantada.
