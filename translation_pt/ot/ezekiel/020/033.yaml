  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם לֹ֠א בְּ/יָ֨ד חֲזָקָ֜ה וּ/בִ/זְר֧וֹעַ נְטוּיָ֛ה וּ/בְ/חֵמָ֥ה שְׁפוּכָ֖ה אֶמְל֥וֹךְ עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/033.yaml
  text: As I live[a], declares the Lord GOD, surely with a strong hand and an outstretched arm and with wrath poured out, I will reign over you.
translation:
  language: pt
  text: “Tão certo como eu vivo”, declara o Senhor Yahweh, “com mão forte, braço estendido e ira derramada, certamente reinarei sobre vocês[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “governarei vocês” ou “serei rei sobre vocês”. O verbo hebraico tem sentido régio.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Fórmula profética de juramento. A expressão conserva a referência à vida divina e comunica em português a força asseverativa do hebraico.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética solene. אֲדֹנָי é traduzido por “Senhor”, e o nome da aliança יהוה é transliterado como “Yahweh”, evitando a repetição “Senhor SENHOR”.
- source_word: אִם לֹא
  choice: certamente
  rationale: Dentro de uma fórmula de juramento, a construção não funciona como condição literal, mas como asseveração enfática.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Preserva a imagem tradicional, de ressonância exódica, e o valor instrumental da preposição.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: braço estendido
  rationale: Mantém a imagem bíblica associada a “mão forte”; o valor de “com” continua implícito na coordenação portuguesa.
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: e ira derramada
  rationale: “Ira” corresponde ao tom profético solene de חֵמָה, enquanto “derramada” conserva a imagem do particípio passivo.
- source_word: אֶמְלֹךְ עֲלֵיכֶם
  choice: reinarei sobre vocês
  rationale: 'O verbo מלך tem força régia: significa reinar ou exercer a condição de rei. “Reinarei” preserva essa dimensão melhor que o termo mais genérico “governarei”.'
theological_decisions:
- issue: Forma do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor; o Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e mantém explícito o nome da aliança sem inserir uma interpretação denominacional.
- issue: Caráter régio de אֶמְלֹךְ עֲלֵיכֶם
  choice: reinarei sobre vocês
  alternative: governarei vocês; serei rei sobre vocês
  rationale: “Reinarei” mantém a afirmação de realeza divina e também a tensão do contexto, no qual esse reinado se impõe mediante poder e juízo.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com “vocês” como plural de uso internacional com boa legibilidade brasileira. A repetição enfática de “Tão certo” e “certamente” reflete, respectivamente, a fórmula de juramento חַי אָנִי e a asseveração אִם לֹא. A pontuação apresenta a fala divina com clareza sem alterar a estrutura semântica do versículo.
