  text: וְ/הָֽ/עֹלָה֙ עַל ר֣וּחֲ/כֶ֔ם הָי֖וֹ לֹ֣א תִֽהְיֶ֑ה אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִֽהְיֶ֤ה כַ/גּוֹיִם֙ כְּ/מִשְׁפְּח֣וֹת הָ/אֲרָצ֔וֹת לְ/שָׁרֵ֖ת עֵ֥ץ וָ/אָֽבֶן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/032.yaml
  text: What is coming up in your mind will certainly not happen—that you say[a], ‘We will be like the nations, like the clans of the lands[d][c][b], serving wood and stone.’
translation:
  language: pt
  text: 'Mas o que vem à mente de vocês certamente não acontecerá — aquilo que vocês dizem: “Seremos como as nações, como os clãs das terras, servindo à madeira e à pedra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, servindo a ídolos feitos de madeira e pedra. Também se pode traduzir: “adorando a madeira e a pedra”.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָעֹלָה עַל רוּחֲכֶם
  choice: aquilo que está surgindo na mente de vocês
  rationale: A expressão com עֹלָה, עַל e רוּחַ descreve de modo idiomático um pensamento ou propósito que surge no íntimo. “Mente” comunica esse sentido naturalmente, enquanto “está surgindo” preserva a imagem verbal hebraica.
- source_word: הָיוֹ לֹא תִהְיֶה
  choice: certamente não acontecerá
  rationale: O infinitivo absoluto הָיוֹ junto do verbo finito intensifica a negação. A formulação portuguesa expressa tanto o sentido futuro quanto a ênfase.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: vocês dizem
  rationale: Introduz diretamente o conteúdo da intenção declarada pelo povo, sem acrescentar uma nuance temporal ausente do hebraico.
- source_word: נִהְיֶה
  choice: Seremos
  rationale: O imperfeito na primeira pessoa do plural expressa aqui a condição futura pretendida pelo grupo.
- source_word: כַגּוֹיִם
  choice: como as nações
  rationale: גּוֹיִם designa as nações circundantes; “nações” evita importar o uso posterior e potencialmente mais restrito de “gentios”.
- source_word: כְּמִשְׁפְּחוֹת הָאֲרָצוֹת
  choice: como os clãs das outras terras
  rationale: “Clãs” preserva o sentido de grupos de parentesco de מִשְׁפָּחוֹת. “Outras” torna explícita em português a relação contextual entre Israel e as terras estrangeiras, sem alterar o referente plural.
- source_word: לְשָׁרֵת
  choice: servindo
  rationale: Mantém o valor lexical de “servir”. No contexto, o serviço é religioso, mas o texto principal não o restringe interpretativamente a “adorar”.
- source_word: עֵץ וָאָבֶן
  choice: à madeira e à pedra
  rationale: A expressão nomeia os materiais dos ídolos de maneira polemicamente concreta. Os artigos e a crase produzem uma formulação natural em português sem substituir os materiais por “ídolos” no texto principal.
theological_decisions:
- issue: Linguagem do serviço idólatra
  choice: servindo à madeira e à pedra
  alternative: adorando ídolos de madeira e pedra
  rationale: O verbo hebraico significa “servir”, embora no contexto denote culto idólatra. A tradução conserva a formulação material e contundente do original, e a nota esclarece a referência.
- issue: Faculdade interior indicada por רוּחַ
  choice: mente
  alternative: espírito
  rationale: Neste contexto, רוּחַ se refere ao pensamento ou propósito interior, não exige uma distinção antropológica técnica. “Mente” comunica melhor o idioma em português corrente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o sufixo de segunda pessoa plural. A construção preserva a metáfora do pensamento que surge, a negação enfática e a referência concreta à madeira e à pedra.
