base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/017.yaml
  text: But my eye spared them from destroying them[a], and I did not make a complete end of them in the wilderness.
translation:
  language: pt
  text: Mas o meu olhar teve compaixão deles, poupando-os da destruição[a]; não os exterminei por completo no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o meu olho teve compaixão deles, de destruí-los”; uma expressão idiomática de compaixão que os poupa da destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחָס עֵינִי עֲלֵיהֶם
  choice: o meu olhar teve compaixão deles
  rationale: Mantém a imagem antropomórfica do hebraico, em que o singular “meu olho” é o sujeito, mas emprega “meu olhar” para produzir uma expressão digna e compreensível em português.
- source_word: מִשַּׁחֲתָם
  choice: e não os destruiu
  rationale: O מן seguido do infinitivo construto de שׁחת com sufixo de terceira pessoa plural expressa que a compaixão os preservou de serem destruídos. A formulação conserva a força verbal e se liga naturalmente à oração anterior.
- source_word: וְלֹא עָשִׂיתִי אוֹתָם כָּלָה
  choice: não os exterminei por completo
  rationale: O idioma עשה כלה indica levar algo a um fim total, isto é, exterminar completamente. A tradução comunica esse sentido com clareza sem eliminar a ênfase na totalidade.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é a forma corrente e amplamente compreensível em português para מדבר no contexto da peregrinação de Israel, sem exigir que o terreno seja entendido apenas como uma extensão de areia.
theological_decisions:
- issue: Expressão antropomórfica da compaixão divina
  choice: Preservar a imagem como “o meu olhar teve compaixão deles”.
  alternative: Simplificar para “tive compaixão deles” ou “eu os poupei”.
  rationale: O hebraico atribui deliberadamente a compaixão ao “olho” de Deus. “Meu olhar” conserva essa imagem corporal e relacional de atenção misericordiosa, evitando ao mesmo tempo uma formulação pouco natural em português.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Meu olhar” preserva de modo natural a imagem hebraica; “exterminei por completo” mantém a intensificação da segunda oração.
