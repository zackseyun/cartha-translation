source:
  edition: WLC
  text: וְ/הֵבֵאתִ֣י אֶתְ/כֶ֔ם אֶל מִדְבַּ֖ר הָֽ/עַמִּ֑ים וְ/נִשְׁפַּטְתִּ֤י אִתְּ/כֶם֙ שָׁ֔ם פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/035.yaml
  text: I will bring you into the wilderness of the peoples[b][a], and there I will enter into judgment with you face to face.
translation:
  language: pt
  text: Eu os levarei ao deserto dos povos[a] e ali entrarei em juízo com vocês, face a face.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O deserto dos povos” pode se referir a um lugar semelhante a um deserto entre as nações nas quais Israel havia sido disperso.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ali julgarei vocês face a face”. O verbo hebraico pode ser traduzido de modo mais simples por “julgar”, mas a construção também transmite a ideia de entrar em juízo com alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Eu os levarei
  rationale: O hifil de בוא significa normalmente “trazer” ou “fazer chegar”. Em português, “levar” é natural quando o movimento é apresentado a partir do ponto de partida dos destinatários; preserva a ação divina de conduzi-los ao destino indicado.
- source_word: אֶל מִדְבַּר
  choice: ao deserto
  rationale: אֶל indica direção ou entrada no destino. מִדְבָּר designa uma região erma e não necessariamente um deserto arenoso; “deserto” é a expressão bíblica corrente e mantém a ressonância do êxodo.
- source_word: הָעַמִּים
  choice: dos povos
  rationale: O plural עַמִּים corresponde diretamente a “povos”. A expressão incomum é preservada, sem reduzi-la interpretativamente a “nações” ou “terras”.
- source_word: וְנִשְׁפַּטְתִּי אִתְּכֶם
  choice: entrarei em juízo com vocês
  rationale: O nifal de שׁפט construído com אִתְּכֶם pode indicar entrar em uma controvérsia ou procedimento judicial com alguém. A formulação conserva essa nuance relacional e forense, em vez de expressar apenas a sentença.
- source_word: פָּנִים אֶל פָּנִים
  choice: face a face
  rationale: A tradução literal do idiomatismo é clara em português e comunica um encontro direto e pessoal.
theological_decisions:
- issue: Nuance judicial da ação divina
  choice: entrarei em juízo com vocês
  alternative: julgarei vocês
  rationale: A construção hebraica sugere um confronto judicial direto, e não somente a emissão unilateral de um veredito. A opção mantém o tom solene de controvérsia da aliança sem impor um procedimento jurídico excessivamente técnico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” explicita naturalmente a segunda pessoa do plural. A ordem das notas acompanha sua primeira ocorrência no texto, e a expressão deliberadamente incomum “deserto dos povos” foi mantida.
