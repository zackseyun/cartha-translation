  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָשָׂ֤אתִי יָדִ/י֙ לָ/הֶ֔ם לְ/הֽוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל אֶ֜רֶץ אֲשֶׁר תַּ֣רְתִּי לָ/הֶ֗ם זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/006.yaml
  text: On that day I raised my hand to them[a], to bring them out from the land of Egypt into a land that I had searched out for them, flowing with milk and honey[c][b]; it is the glory of all lands.
translation:
  language: pt
  text: Naquele dia, ergui minha mão para eles[a], para tirá-los da terra do Egito e levá-los para uma terra que eu havia explorado para eles[b], uma terra que mana leite e mel. Ela é o esplendor de todas as terras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, fiz-lhes uma promessa solene; também se pode traduzir: “jurei-lhes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que eu havia escolhido para eles”. O verbo hebraico também pode significar “procurar” ou “reconhecer”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a mais bela de todas as terras” ou “a glória de todas as terras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשָׂאתִי יָדִי
  choice: levantei a mão para eles
  rationale: Preserva a imagem concreta do hebraico, que neste contexto expressa o gesto de prestar juramento ou fazer uma promessa solene.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: tirá-los da terra do Egito
  rationale: Traduz diretamente o causativo de יצא e mantém a linguagem tradicional e clara do êxodo.
- source_word: אֶל אֶרֶץ אֲשֶׁר תַּרְתִּי לָהֶם
  choice: levá-los para uma terra que eu havia procurado para eles
  rationale: O verbo תור pode significar explorar, procurar ou reconhecer. “Procurado” conserva a imagem antropomórfica sem introduzir necessariamente uma conotação militar.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: uma terra que mana leite e mel
  rationale: Expressão bíblica corrente em português, inteligível e adequada para comunicar fertilidade e abundância.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: Ela é o esplendor de todas as terras
  rationale: “Esplendor” comunica a beleza e a excelência denotadas por צְבִי, preservando a formulação metafórica e elevada.
theological_decisions:
- issue: Sentido do gesto de levantar a mão
  choice: manter a imagem e explicitar sua força como promessa na ligação sintática
  alternative: jurei a eles
  rationale: A tradução conserva o gesto antropomórfico do texto hebraico, enquanto “prometendo” torna compreensível sua função contextual sem reduzir toda a expressão a uma abstração.
- issue: Descrição antropomórfica de Deus em תַּרְתִּי
  choice: que eu havia procurado para eles
  alternative: que eu havia escolhido para eles
  rationale: Preserva a textura concreta e a ambiguidade lexical do verbo hebraico; a formulação profética não precisa ser harmonizada com uma afirmação abstrata sobre o conhecimento divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva as imagens hebraicas de levantar a mão, procurar a terra e fazê-la manar leite e mel, recorrendo às notas para alternativas legítimas.
