  text: לָ/כֵ֞ן דַּבֵּ֨ר אֶל בֵּ֤ית יִשְׂרָאֵל֙ בֶּן אָדָ֔ם וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה ע֗וֹד זֹ֚את גִּדְּפ֤וּ אוֹתִ/י֙ אֲב֣וֹתֵי/כֶ֔ם בְּ/מַעֲלָ֥/ם בִּ֖/י מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
translation:
  language: pt
  text: 'Portanto, fale à casa de Israel, filho do homem, e diga-lhes: “Assim diz o Senhor Yahweh: Também nisto os pais de vocês blasfemaram contra mim[a], ao agirem traiçoeiramente contra mim[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me insultaram” ou “me trataram com desprezo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram infiéis a mim” ou “cometeram uma quebra de fé contra mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Preserva o valor inferencial que liga esta ordem ao argumento precedente.
- source_word: דַּבֵּר אֶל בֵּית יִשְׂרָאֵל
  choice: fale à casa de Israel
  rationale: Mantém a fórmula profética e a expressão coletiva e pactual, sem reduzi-la a 'povo de Israel'.
- source_word: בֶּן אָדָם
  choice: filho do homem
  rationale: Conserva o modo recorrente como Deus se dirige a Ezequiel e a forma concreta do hebraico.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Reproduz a fórmula do mensageiro profético, distingue אֲדֹנָי do nome divino e translitera o tetragrama.
- source_word: עוֹד זֹאת
  choice: Também nisto
  rationale: Expressa tanto o sentido aditivo de עוֹד quanto a referência demonstrativa de זֹאת em português natural.
- source_word: גִּדְּפוּ אוֹתִי
  choice: blasfemaram contra mim
  rationale: Comunica a gravidade da afronta dirigida a Deus; 'contra mim' é idiomático em português.
- source_word: אֲבוֹתֵיכֶם
  choice: os pais de vocês
  rationale: Preserva o termo familiar masculino do hebraico e torna explícito o possessivo plural.
- source_word: בְּמַעֲלָם בִּי מָעַל
  choice: agiram traiçoeiramente contra mim
  rationale: Comunica a deslealdade e a violação de confiança implicadas na construção cognata hebraica, embora a repetição etimológica não possa ser reproduzida naturalmente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor Deus
  rationale: Mantém distintos o título אֲדֹנָי e o nome pactual יְהוָה, sem ocultar o nome divino.
- issue: Sentido de מעל na acusação contra os antepassados
  choice: agiram traiçoeiramente contra mim
  alternative: foram infiéis a mim
  rationale: Preserva a força relacional e pactual da quebra de confiança sem limitar a expressão a uma formulação denominacional.
- issue: Tradução de בֶּן אָדָם em Ezequiel
  choice: filho do homem
  alternative: mortal
  rationale: Mantém a fórmula característica do livro sem impor aqui uma leitura cristológica nem eliminar sua forma tradicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural e conserva as fórmulas proféticas 'casa de Israel', 'filho do homem' e 'Assim diz'. Os dois marcadores de nota aparecem no texto principal junto às expressões que esclarecem.
