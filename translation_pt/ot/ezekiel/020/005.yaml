  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/יוֹם֙ בָּחֳרִ֣/י בְ/יִשְׂרָאֵ֔ל וָ/אֶשָּׂ֣א יָדִ֗/י לְ/זֶ֨רַע֙ בֵּ֣ית יַֽעֲקֹ֔ב וָ/אִוָּדַ֥ע לָ/הֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אֶשָּׂ֨א יָדִ֤/י לָ/הֶם֙ לֵ/אמֹ֔ר אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/005.yaml
  text: 'And say to them[a], ‘Thus says the Lord GOD: On the day when I chose Israel, I lifted up my hand to the offspring of the house of Jacob and made myself known to them in the land of Egypt; I lifted up my hand to them, saying, “I am Yahweh your God.”’'
translation:
  language: pt
  text: 'Diga-lhes: “Assim diz o Senhor Yahweh: No dia em que escolhi Israel, ergui a mão[a] aos descendentes da casa de Jacó e revelei-me a eles na terra do Egito; ergui a mão para eles, dizendo: ‘Eu sou Yahweh, o Deus de vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ergui a mão”, gesto que frequentemente indica um juramento ou compromisso solene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Preserva os dois elementos do título divino: אֲדֹנָי como “Senhor” e o nome pessoal יהוה como “Yahweh”, evitando a repetição pouco natural “Senhor SENHOR”.'
- source_word: בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל
  choice: No dia em que escolhi Israel
  rationale: Reproduz a expressão temporal e mantém o sentido de escolha de בחר sem acrescentar uma formulação teológica posterior.
- source_word: וָאֶשָּׂא יָדִי
  choice: levantei a mão
  rationale: Conserva a imagem concreta do hebraico; nesse contexto, o gesto tem força de juramento ou compromisso solene, esclarecida em nota.
- source_word: לְזֶרַע בֵּית יַעֲקֹב
  choice: para os descendentes da casa de Jacó
  rationale: “Descendentes” comunica de modo natural o sentido coletivo de זֶרַע neste contexto, enquanto “casa de Jacó” preserva a expressão familiar e nacional.
- source_word: וָאִוָּדַע לָהֶם
  choice: e me dei a conhecer a eles
  rationale: Expressa a autocomunicação divina indicada pela forma verbal, sem reduzir a frase a uma revelação meramente informativa.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Mantém אֶרֶץ, explicitamente presente no hebraico, e preserva o cenário narrativo.
- source_word: לֵאמֹר
  choice: e declarei
  rationale: Neste encadeamento, traduz idiomaticamente a introdução da fala solene, sem alterar seu conteúdo.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Eu sou Yahweh, o Deus de vocês
  rationale: Mantém o nome divino e verte o sufixo plural de segunda pessoa em linguagem portuguesa clara e amplamente compreensível.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino distintivo presente no texto hebraico e o diferencia do título אֲדֹנָי.
- issue: Valor de juramento em וָאֶשָּׂא יָדִי
  choice: Preservar “levantei a mão” no texto e explicar seu valor na nota
  alternative: Jurei; fiz uma promessa solene
  rationale: A imagem hebraica é mantida sem ocultar sua força idiomática de juramento ou compromisso solene.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira. Emprega “vocês” para explicitar o plural do hebraico e mantém “casa de Jacó” como expressão bíblica transparente.
