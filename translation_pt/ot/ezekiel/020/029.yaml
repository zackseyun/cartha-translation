base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/029.yaml
  text: Then I said to them, ‘What is this high place where you are going?’ So its name is called Bamah to this day.
translation:
  language: pt
  text: 'Então eu lhes disse: “O que é esse lugar alto aonde vocês vão?” Por isso, até hoje ele se chama Bamá.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bamá reproduz o hebraico bamá, a mesma palavra traduzida como “lugar alto” na frase anterior.
    reason: Explica o jogo de palavras essencial entre o nome do local e o substantivo hebraico.
lexical_decisions:
- source_word: הַבָּמָה (habbāmāh)
  choice: esse lugar alto
  rationale: בָּמָה designa uma elevação ou santuário de culto, frequentemente idólatra. “Lugar alto” preserva o termo bíblico e a ligação sonora com o nome Bamá.
- source_word: הַבָּאִים שָׁם (habbā’îm šām)
  choice: aonde vocês vão
  rationale: A construção é literalmente “os que vão/entram ali”. Em português, a formulação verbal expressa com naturalidade o movimento em direção ao local.
- source_word: בָּמָה (Bāmāh)
  choice: Bamá
  rationale: Mantém o nome hebraico e seu jogo de palavras com בָּמָה, “lugar alto”, sem substituí-lo por uma tradução.
- source_word: עַד הַיּוֹם הַזֶּה (‘ad hayyôm hazzeh)
  choice: até hoje
  rationale: Equivalente idiomático direto da expressão temporal hebraica.
theological_decisions:
- issue: Natureza do lugar alto
  choice: lugar alto
  alternative: santuário nas colinas
  rationale: O texto emprega o termo cultual amplo בָּמָה. A tradução não explicita “idolatria” no corpo do versículo, preservando a formulação e a ironia do hebraico dentro do contexto.
- issue: Origem do nome Bamá
  choice: Por isso, até hoje ele se chama Bamá
  alternative: E seu nome foi chamado Bamá até o dia de hoje
  rationale: O hebraico apresenta uma fórmula etiológica passiva. A redação portuguesa comunica seu efeito sem decidir além do texto se Ezequiel está propondo uma etimologia histórica ou fazendo um jogo retórico.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira ampla. “Aonde” foi usado por indicar movimento em direção ao lugar. A ordem “Por isso, até hoje” torna natural a fórmula hebraica sem perder seu sentido etiológico.
