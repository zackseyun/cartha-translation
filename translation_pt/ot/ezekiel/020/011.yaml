base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/011.yaml
  text: I gave them my statutes[a], and I made my judgments known to them, which, if a man does them, he will live by them.
translation:
  language: pt
  text: Eu lhes dei os meus estatutos e lhes dei a conhecer os meus juízos, os quais, se o ser humano[a] os praticar, viverá por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o homem”, no singular, usado aqui em sentido representativo; também pode ser traduzido como “uma pessoa” ou “a humanidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Eu lhes dei
  rationale: O verbo נתן tem aqui o sentido direto de dar ou conceder, no contexto da entrega das leis da aliança.
- source_word: חֻקּוֹתַי
  choice: os meus estatutos
  rationale: חֻקּוֹת designa prescrições estabelecidas; “estatutos” conserva o registro jurídico e se distingue de מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: os meus juízos
  rationale: מִשְׁפָּטִים pode designar decisões, normas ou ordenanças; “juízos” preserva sua nuance jurídica e a distinção lexical em relação a “estatutos”.
- source_word: הוֹדַעְתִּי אוֹתָם
  choice: lhes dei a conhecer
  rationale: O hifil de ידע significa causar conhecimento, isto é, “dar a conhecer”; a formulação mantém essa nuance sem interpretar o verbo simplesmente como “ensinar”.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם
  choice: pelos quais ... se os praticar
  rationale: A construção retoma estatutos e juízos e apresenta o cumprimento como condição. “Praticar” expressa naturalmente a execução continuada de prescrições, enquanto “se” explicita em português a força condicional contextual.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: O substantivo singular com artigo tem sentido representativo e se refere genericamente à pessoa humana; “o ser humano” preserva o singular e evita restringir a afirmação ao sexo masculino.
- source_word: וָחַי בָּהֶם
  choice: viverá pelos quais
  rationale: A preposição ב pode indicar o meio ou fundamento associado à vida. Em português, “viverá por eles” seria ambíguo quanto ao antecedente pessoal; a retomada relativa “pelos quais” mantém clara a referência às leis.
theological_decisions:
- issue: Alcance da vida ligada à obediência
  choice: Manter a fórmula ampla “pelos quais ... viverá”, sem definir a natureza dessa vida.
  alternative: Interpretá-la especificamente como longevidade e prosperidade nacional, ou como vida eterna obtida pela observância da lei.
  rationale: O texto relaciona vida e prática dos mandamentos, mas não delimita aqui se a vida é individual, coletiva, temporal ou escatológica. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Estatutos” e “juízos” conservam o paralelismo jurídico do hebraico; “deu a conhecer” mantém a construção causativa. O marcador [a] aparece imediatamente após a expressão a que se refere.
