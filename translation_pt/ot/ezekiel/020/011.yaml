  verdict: revise
  source_fidelity: 'O texto traduz corretamente os principais elementos do hebraico: a dádiva dos estatutos, a comunicação dos juízos e a fórmula que relaciona sua prática à vida. Contudo, a construção relativa atual desloca “pelos quais” para uma função que, em português, torna menos clara a sequência hebraica: os estatutos e juízos são aquilo que se pratica, e é em/por eles que o ser humano vive.'
  naturalness: '“Pelos quais o ser humano[a], se os praticar, viverá” é compreensível, mas soa invertido e pesado; além disso, a combinação do relativo “pelos quais” com o pronome objeto “os” dificulta a leitura. A reordenação preserva o registro formal e torna explícitas as duas relações: praticá-los e viver por eles.'
  terminology: “Estatutos”, “juízos”, “dei a conhecer” e “ser humano” são escolhas adequadas, jurídicas e amplamente compreensíveis. A nota preserva de modo apropriado o singular representativo de הָאָדָם, sem impor uma leitura restrita.
  issues:
  - severity: medium
    issue: Construção sintática de “pelos quais ... se os praticar”.
    rationale: No hebraico, o relativo retoma os estatutos e juízos como objeto de “praticar”, enquanto בָּהֶם expressa a relação com a vida. Em português, a ordem proposta permite que “pelos quais” pareça deslocado e reduz a clareza da dupla retomada. Reordenar a frase preserva ambas as relações sem alterar o sentido.
  revised_text: Eu lhes dei os meus estatutos e lhes dei a conhecer os meus juízos, os quais, se o ser humano[a] os praticar, viverá por eles.
