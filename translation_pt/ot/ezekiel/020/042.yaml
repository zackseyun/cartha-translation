  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/הֲבִיאִ֥/י אֶתְ/כֶ֖ם אֶל אַדְמַ֣ת יִשְׂרָאֵ֑ל אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לַ/אֲבֽוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/042.yaml
  text: Then you will know that I am Yahweh[a], when I bring you into the land of Israel, into the land that I lifted up my hand to give to your fathers.
translation:
  language: pt
  text: Então vocês saberão que eu sou Yahweh, quando eu os trouxer à terra de Israel, à terra que jurei[a] dar aos seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a terra que levantei minha mão para dar aos seus pais”. Levantar a mão era um gesto de juramento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O perfeito qal com conjunção, neste discurso profético, tem sentido futuro e consequencial; “então” expressa naturalmente o resultado da ação divina precedente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua força pactual, sem substituí-lo por um título.
- source_word: בַּהֲבִיאִי
  choice: quando eu os trouxer
  rationale: O infinitivo construto com בְּ indica a circunstância temporal em que ocorrerá o reconhecimento; o futuro do subjuntivo é idiomático em português.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: à terra de Israel
  rationale: Embora אֲדָמָה possa significar solo ou chão, aqui designa o território de Israel no contexto da restauração.
- source_word: הָאָרֶץ
  choice: à terra
  rationale: Refere-se especificamente à terra prometida; a repetição conserva o paralelismo e a ênfase do hebraico.
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: jurei, de mão erguida
  rationale: Combina o sentido idiomático de juramento com a imagem concreta do gesto hebraico, produzindo uma formulação clara e digna em português.
- source_word: לָתֵת אוֹתָהּ
  choice: dar
  rationale: O objeto feminino remete à terra e pode ficar implícito em português, pois o antecedente está imediatamente presente.
- source_word: לַאֲבוֹתֵיכֶם
  choice: aos seus antepassados
  rationale: Neste contexto, אָבוֹת designa as gerações ancestrais; “antepassados” comunica o referente com naturalidade e sem restringi-lo desnecessariamente aos homens.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita transformá-lo em título.
- issue: Tradução da expressão de juramento נָשָׂאתִי אֶת־יָדִי
  choice: jurei, de mão erguida
  alternative: ergui a mão para dar; jurei dar
  rationale: A formulação mantém tanto o significado do idioma hebraico quanto sua imagem concreta, sem deixar obscura a força de compromisso solene da promessa divina.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Usa “vocês” para o plural de segunda pessoa, “Yahweh” para o nome divino e uma tradução explicativa moderada do idioma de juramento, documentando a forma literal em nota.
