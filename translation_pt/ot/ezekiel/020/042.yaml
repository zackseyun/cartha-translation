  source_fidelity: A estrutura temporal e consequencial está bem representada, assim como «Yahweh» e «terra de Israel». Contudo, «jurei, de mão erguida, dar» introduz uma construção portuguesa pouco natural e sintaticamente truncada. O hebraico emprega a expressão idiomática «levantei minha mão» para jurar; uma tradução idiomática no texto, esclarecida por nota literal, comunica melhor o sentido sem perda relevante.
  naturalness: «Então vocês saberão» e «quando eu os trouxer» são claros e naturais. A sequência «que jurei, de mão erguida, dar» é pesada e não soa como português moderno fluente. «Jurei dar» é a formulação direta e solene apropriada.
  terminology: «Yahweh» preserva corretamente o nome divino. «Pais» mantém o referente lexical de לַאֲבוֹתֵיכֶם com maior proximidade que «antepassados», sem exigir que sejam pais imediatos no contexto. A nota preserva a imagem hebraica e seu valor de juramento.
  issues:
  - severity: medium
    issue: Construção principal truncada em «a terra que jurei, de mão erguida, dar».
    rationale: Os elementos intercalados separam indevidamente «jurei» de seu infinitivo complementar e tornam a leitura pouco fluente. O hebraico pode ser traduzido idiomaticamente como «jurei dar», com a forma literal explicada em nota.
  - severity: low
    issue: A nota chama de literal uma formulação que altera a estrutura do hebraico («à terra para a qual ergui a mão»).
    rationale: O hebraico descreve levantar a mão com o propósito de dar a terra, não levantar a mão «para a terra». A nota deve explicar a literalidade sem atribuir ao texto uma preposição inexistente.
  - severity: low
    issue: «Antepassados» é semanticamente possível, mas atenua a expressão específica «seus pais».
    rationale: Neste versículo, «pais» preserva melhor o termo hebraico אָבוֹת e permanece claro como referência aos antepassados israelitas.
  revised_text: Então vocês saberão que eu sou Yahweh, quando eu os trouxer à terra de Israel, à terra que jurei[a] dar aos seus pais.
