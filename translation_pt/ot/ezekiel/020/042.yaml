- from: Então vocês saberão que eu sou Yahweh, quando eu os trouxer à terra de Israel, à terra que jurei, de mão erguida, dar aos seus antepassados.[a]
  to: Então vocês saberão que eu sou Yahweh, quando eu os trouxer à terra de Israel, à terra que jurei[a] dar aos seus pais.
