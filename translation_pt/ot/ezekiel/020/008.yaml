  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֗/י וְ/לֹ֤א אָבוּ֙ לִּ/שְׁמֹ֣עַ אֵלַ֔/י אִ֣ישׁ אֶת שִׁקּוּצֵ֤י עֵֽינֵי/הֶם֙ לֹ֣א הִשְׁלִ֔יכוּ וְ/אֶת גִּלּוּלֵ֥י מִצְרַ֖יִם לֹ֣א עָזָ֑בוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֤וֹת אַפִּ/י֙ בָּ/הֶ֔ם בְּ/ת֖וֹךְ אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/008.yaml
  text: But they rebelled against me and refused to listen to me. None of them cast away the detestable things before their eyes[a] or abandoned the idols[b] of Egypt. So I said that I would pour out my wrath on them, bringing my anger against them to its full measure in the midst of the land of Egypt.
translation:
  language: pt
  text: Mas eles se rebelaram contra mim e se recusaram a me ouvir. Nenhum deles lançou fora as coisas detestáveis diante dos seus olhos[a], nem abandonou os ídolos[b] do Egito. Então, eu disse que derramaria sobre eles o meu furor, levando a minha ira contra eles até o fim, no meio da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas detestáveis dos seus olhos”. O hebraico pode se referir a objetos abomináveis diante dos olhos deles e também pode sugerir a fixação idólatra nesses objetos.'
    reason: alternative_reading
  - marker: b
    text: A palavra hebraica traduzida como “ídolos” é deliberadamente depreciativa e pode sugerir algo imundo ou repulsivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: se rebelaram contra mim
  rationale: מרה com ב expressa rebelião ou desafio contra alguém; a formulação é direta e preserva a gravidade da desobediência.
- source_word: וְלֹא אָבוּ לִשְׁמֹעַ אֵלַי
  choice: e se recusaram a me ouvir
  rationale: A construção volitiva negativa indica recusa deliberada, não mera incapacidade de ouvir.
- source_word: אִישׁ
  choice: Nenhum deles
  rationale: O singular tem valor distributivo dentro do grupo; esta forma comunica naturalmente que nem uma só pessoa obedeceu, sem restringir a referência aos homens.
- source_word: שִׁקּוּצֵי עֵינֵיהֶם
  choice: as coisas detestáveis que estavam diante dos seus olhos
  rationale: A expressão é difícil e pode indicar objetos diante dos olhos ou aquilo em que eles fixavam idolatralmente o olhar. A linha principal evita resolver em excesso essa ambiguidade, explicitada na nota.
- source_word: הִשְׁלִיכוּ
  choice: lançou fora
  rationale: O verbo descreve o ato concreto de rejeitar e descartar os objetos detestáveis.
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: os ídolos do Egito
  rationale: Ídolos é claro e natural; o caráter deliberadamente depreciativo do termo hebraico é registrado em nota.
- source_word: עָזָבוּ
  choice: abandonou
  rationale: עזב significa deixar ou abandonar e, neste contexto, denota renúncia à idolatria.
- source_word: וָאֹמַר
  choice: Por isso, eu disse que
  rationale: A sequência narrativa introduz a decisão divina como resposta à rebelião descrita, sem impor a ideia de fala interior.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: derramaria sobre eles o meu furor
  rationale: Mantém a metáfora vívida de derramar e traduz חֵמָה por furor, distinguindo-o de אַף na oração seguinte.
- source_word: לְכַלּוֹת אַפִּי בָּהֶם
  choice: levando a minha ira contra eles até o fim
  rationale: O infinitivo expressa a consumação plena da ira contra seus objetos; a tradução comunica conclusão judicial sem reduzi-la a mero desabafo emocional.
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: no meio da terra do Egito
  rationale: Preserva tanto a ideia espacial de estar no interior quanto a expressão geográfica formal do hebraico.
theological_decisions:
- issue: Linguagem antropopática do juízo divino
  choice: Preservar “furor” e “ira” como expressões distintas e relacionadas da reação judicial de Deus
  alternative: Uniformizar ambas como “ira” ou suavizá-las como “castigo” ou “juízo”
  rationale: O hebraico emprega חֵמָה e אַף em proximidade para intensificar a declaração. Manter dois termos evita atenuar a oposição divina à idolatria sem criar uma distinção sistemática alheia ao versículo.
- issue: Valor representativo e distributivo de אִישׁ
  choice: Traduzir como “Nenhum deles”
  alternative: “Nenhum homem” ou “Nem um deles”
  rationale: Embora masculino na forma, אִישׁ funciona distributivamente no grupo. “Nenhum deles” preserva o sentido referencial e soa natural em português moderno.
- issue: Ambiguidade da expressão ligada aos olhos
  choice: Manter na linha principal a imagem das coisas detestáveis diante dos olhos e registrar a possível fixação idólatra em nota
  alternative: Explicitar diretamente “as coisas detestáveis nas quais fixavam os olhos”
  rationale: O construto hebraico admite mais de uma nuance; explicitar apenas a fixação visual resolveria uma ambiguidade genuína que o texto não resolve.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe preserva o paralelismo e a intensidade do hebraico sem arcaísmos desnecessários; “furor” e “ira” mantêm a variação lexical da fonte.
