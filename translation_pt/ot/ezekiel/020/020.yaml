base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/020.yaml
  text: Keep my Sabbaths holy[a], and let them be a sign between me and you, so that you may know that I am Yahweh your God.
translation:
  language: pt
  text: Santifiquem os meus sábados, e sejam eles um sinal entre mim e vocês, para que vocês saibam que eu sou Yahweh[a], o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz YHWH, o nome divino, aqui representado como “Yahweh”.
    reason: Esclarece a representação do tetragrama hebraico no texto principal.
lexical_decisions:
- source_word: שַׁבְּתוֹתַי
  choice: os meus sábados
  rationale: Mantém o plural hebraico com o sufixo de primeira pessoa, indicando as observâncias recorrentes do sábado como instituição da aliança.
- source_word: קַדֵּשׁוּ
  choice: Santifiquem
  rationale: O piel imperativo de קדשׁ ordena que os sábados sejam reconhecidos e tratados como santos. “Santifiquem” preserva essa força de modo conciso e digno.
- source_word: וְהָיוּ
  choice: e eles serão
  rationale: A forma dá continuidade à ordem e apresenta o papel resultante dos sábados. O futuro é natural em português e não força uma nuance jussiva além do que o hebraico exige.
- source_word: לְאוֹת
  choice: um sinal
  rationale: אוֹת designa um sinal ou marca; aqui, os sábados funcionam como sinal da relação de aliança.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: entre mim e vocês
  rationale: Reproduz a expressão relacional hebraica em português corrente e de ampla compreensão.
- source_word: לָדַעַת
  choice: para que vocês saibam
  rationale: Explicita naturalmente o sentido de finalidade do infinitivo com לְ, preservando a referência plural da segunda pessoa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Embora אֱלֹהִים tenha forma plural, refere-se aqui ao Deus de Israel; o sufixo expressa a relação pactual com os destinatários.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem introduzir uma interpretação denominacional.
- issue: Relação entre a santificação dos sábados e o conhecimento de Deus
  choice: 'Preservar a construção de finalidade: “para que vocês saibam”'
  alternative: Interpretar como garantia automática de salvação ou mero conhecimento intelectual
  rationale: O hebraico afirma que o sábado serve de sinal para o reconhecimento de Yahweh como o Deus do povo, sem definir aqui toda a natureza desse conhecimento.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A formulação mantém o plural “sábados”, a linguagem da aliança e a sequência direta da ordem, do sinal e de sua finalidade.
