  text: וְ/אַתֶּ֨ם בֵּֽית יִשְׂרָאֵ֜ל כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אִ֤ישׁ גִּלּוּלָי/ו֙ לְכ֣וּ עֲבֹ֔דוּ וְ/אַחַ֕ר אִם אֵינְ/כֶ֖ם שֹׁמְעִ֣ים אֵלָ֑/י וְ/אֶת שֵׁ֤ם קָדְשִׁ/י֙ לֹ֣א תְחַלְּלוּ ע֔וֹד בְּ/מַתְּנֽוֹתֵי/כֶ֖ם וּ/בְ/גִלּוּלֵי/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/039.yaml
  text: 'But as for you[a], house of Israel, thus says the Lord GOD: Go, each man, serve his idols—if afterward you will not listen to me[b]; but you shall no longer profane my holy name with your gifts and with your idols.'
translation:
  language: pt
  text: 'Mas vocês, casa de Israel, assim diz o Senhor DEUS: Vão, cada um sirva os seus ídolos[a] — se depois vocês não me ouvirem[b]; mas vocês não profanarão mais o meu santo nome com as suas dádivas e com os seus ídolos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico גִּלּוּלִים é uma designação fortemente depreciativa dos ídolos; também poderia ser traduzido por “ídolos imundos” ou “ídolos de esterco”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Vão, cada um sirva os seus ídolos; mas depois, se vocês não me ouvirem...”. A sintaxe hebraica depois de “sirva” é difícil, e a cláusula admite pontuação e ligação ligeiramente diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mas vocês
  rationale: O waw seguido do pronome independente introduz uma interpelação contrastiva. “Mas vocês” expressa esse contraste de modo natural em português.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Mantém a expressão coletiva e pactual tradicional, sem a reduzir apenas a uma família doméstica.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  rationale: Distingue os dois elementos do título composto e evita a repetição pouco natural “Senhor SENHOR”; as maiúsculas em DEUS assinalam que o segundo termo representa o nome divino.
- source_word: אִישׁ גִּלּוּלָיו
  choice: cada um sirva os seus ídolos
  rationale: “Cada um” preserva o valor distributivo do singular masculino e soa mais natural em português do que “cada homem” neste contexto; “seus” mantém a responsabilidade individual.
- source_word: גִּלּוּלִים
  choice: ídolos
  rationale: É a forma clara no texto principal. O forte tom depreciativo característico do termo em Ezequiel é indicado em nota, pois traduções literais como “ídolos de esterco” seriam marcadas e potencialmente obscuras.
- source_word: לְכוּ עֲבֹדוּ
  choice: Vão, ... sirva
  rationale: Preserva os dois imperativos e o tom incisivo. A mudança do plural “Vão” para o distributivo singular “cada um sirva” corresponde à construção hebraica.
- source_word: וְאַחַר אִם אֵינְכֶם שֹׁמְעִים אֵלָי
  choice: se depois vocês não me ouvirem
  rationale: Conserva tanto o elemento temporal “depois” como a forma condicional, sem eliminar a dificuldade sintática do hebraico.
- source_word: שֹׁמְעִים אֵלָי
  choice: me ouvirem
  rationale: Mantém o sentido básico de ouvir, deixando implícita, como no hebraico, a ideia contextual de dar atenção e obedecer.
- source_word: שֵׁם קָדְשִׁי
  choice: meu santo nome
  rationale: Equivalente idiomático direto que preserva a importância teológica do nome divino.
- source_word: לֹא תְחַלְּלוּ עוֹד
  choice: não profanarão mais
  rationale: Expressa a forte declaração/proibição profética. “Profanar” é especialmente apropriado para uma ofensa contra aquilo que é santo.
- source_word: בְּמַתְּנוֹתֵיכֶם
  choice: com as suas dádivas
  rationale: Traduz diretamente “presentes/dádivas”, ao mesmo tempo que permite ao contexto indicar que se trata de ofertas cultuais.
- source_word: וּבְגִלּוּלֵיכֶם
  choice: e com os seus ídolos
  rationale: Mantém o paralelismo das duas expressões preposicionais que indicam os meios pelos quais o nome é profanado.
theological_decisions:
- issue: Força dos imperativos iniciais
  choice: Concessão judicial ou ordem irônica que conserva a forma imperativa
  alternative: Ordem simples que aprovaria o culto aos ídolos
  rationale: O contexto não apresenta aprovação da idolatria. Deus expõe a rebeldia de Israel e exige que seu santo nome deixe de ser profanado; a tradução mantém a tensão da formulação imperativa.
- issue: Relação sintática da cláusula condicional
  choice: “se depois vocês não me ouvirem”, ligada por pontuação ao mandamento anterior
  alternative: “mas depois, se vocês não me ouvirem...” ou uma leitura que afirme que depois certamente ouvirão
  rationale: A sequência hebraica é difícil. A redação principal conserva a condição e o marcador temporal sem impor uma solução definitiva, e a nota registra a alternativa de pontuação.
- issue: Valor de לֹא תְחַלְּלוּ עוֹד
  choice: 'Declaração proibitiva forte: “não profanarão mais”'
  alternative: Predição meramente descritiva, sem força de proibição
  rationale: No discurso profético, a forma pode transmitir simultaneamente determinação e proibição. O futuro português preserva essa força sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e “cada um” como distributivo masculino natural. A ordem incomum da cláusula intermediária foi parcialmente preservada para não apagar a ambiguidade do hebraico.
