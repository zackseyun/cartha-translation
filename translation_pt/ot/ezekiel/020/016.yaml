  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יַ֜עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֗סוּ וְ/אֶת חֻקּוֹתַ/י֙ לֹא הָלְכ֣וּ בָ/הֶ֔ם וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ כִּ֛י אַחֲרֵ֥י גִלּוּלֵי/הֶ֖ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/016.yaml
  text: because they rejected my judgments[a], and did not walk in my statutes, and profaned my Sabbaths; for their heart went after their idols.
translation:
  language: pt
  text: porque rejeitaram os meus juízos e não andaram nos meus estatutos, e profanaram os meus sábados, pois o coração deles seguia os seus ídolos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é deliberadamente depreciativo e pode sugerir ídolos “imundos” ou “de excremento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: porque
  rationale: Introduz naturalmente, em português, a causa do juízo mencionado no contexto.
- source_word: מִשְׁפָּטַי
  choice: os meus juízos
  rationale: Preserva o sentido jurídico do termo e o distingue de חֻקּוֹתַי.
- source_word: מָאָסוּ
  choice: rejeitaram
  rationale: Expressa recusa ativa sem acrescentar necessariamente a nuance emotiva de 'desprezaram'.
- source_word: חֻקּוֹתַי
  choice: os meus estatutos
  rationale: Mantém a distinção lexical em relação a מִשְׁפָּטַי e é uma formulação bíblica clara em português.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: não andaram nos meus estatutos
  rationale: Conserva a metáfora hebraica do andar como modo de viver e obedecer; o referente pronominal foi explicitado para maior naturalidade.
- source_word: שַׁבְּתוֹתַי
  choice: os meus sábados
  rationale: Mantém o plural explícito do hebraico e a referência aos dias sabáticos.
- source_word: חִלֵּלוּ
  choice: profanaram
  rationale: Comunica tratar como comum ou violar aquilo que é santo.
- source_word: אַחֲרֵי גִלּוּלֵיהֶם
  choice: os seus ídolos
  rationale: Com o verbo 'seguir', expressa naturalmente em português a locução hebraica de ir atrás dos ídolos.
- source_word: גִלּוּלֵיהֶם
  choice: os seus ídolos
  rationale: Usa o termo corrente no texto principal, deixando para a nota a forte carga depreciativa própria do vocábulo de Ezequiel.
- source_word: לִבָּם הֹלֵךְ
  choice: o coração deles seguia
  rationale: Preserva o singular coletivo 'coração' e traduz o particípio por um imperfeito durativo, indicando inclinação contínua.
theological_decisions:
- issue: Distinção entre termos da lei da aliança
  choice: juízos para מִשְׁפָּטַי e estatutos para חֻקּוֹתַי
  alternative: leis para ambos
  rationale: O hebraico emprega dois termos distintos; mantê-los evita nivelar a textura da linguagem da aliança.
- issue: Metáfora antropológica em לִבָּם הֹלֵךְ
  choice: o coração deles seguia os seus ídolos
  alternative: eles se dedicavam aos seus ídolos
  rationale: A tradução conserva o coração como centro da inclinação moral e espiritual, bem como o caráter contínuo sugerido pelo particípio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação foi ajustada com “mas” para refletir a progressão do hebraico sem perder sua estrutura. O marcador [a] foi colocado após “ídolos”, termo ao qual a nota efetivamente se refere.
