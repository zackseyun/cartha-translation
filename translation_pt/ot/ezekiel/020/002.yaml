  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: O wayyiqtol de היה introduz a sequência narrativa. Em português, a fórmula profética é expressa naturalmente por “E ... veio”, sem o acréscimo pouco idiomático de “aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר יְהוָה, “a palavra” preserva o sentido de uma comunicação divina específica e a formulação recorrente do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição אֶל com o sufixo da primeira pessoa do singular e é natural na construção portuguesa “veio a mim”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz o conteúdo da fala divina; “dizendo” preserva a estrutura da fórmula hebraica e remete à declaração seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo pelo título “SENHOR”; “Jeová” reflete uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se a fórmula profética tradicional sem arcaísmos. Os dois-pontos após “dizendo” sinalizam naturalmente que o conteúdo da fala vem no versículo seguinte.
