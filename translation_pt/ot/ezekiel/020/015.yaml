source:
  edition: WLC
  text: וְ/גַם אֲנִ֗י נָשָׂ֧אתִי יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/בִלְתִּי֩ הָבִ֨יא אוֹתָ֜/ם אֶל הָ/אָ֣רֶץ אֲשֶׁר נָתַ֗תִּי זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/015.yaml
  text: Yet I myself also raised my hand to them in the wilderness[a], that I would not bring them into the land that I had given them, flowing with milk and honey[b], the glory of all lands.
translation:
  language: pt
  text: Contudo, eu também levantei a mão contra eles no deserto[a], jurando que não os levaria à terra que lhes havia dado, uma terra que mana leite e mel, o esplendor de todas as terras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “levantar a mão” descreve um gesto de juramento; também se pode traduzir simplesmente por “jurei”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a beleza de todas as terras” ou “a mais bela entre todas as terras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Contudo, também eu
  rationale: Preserva a força aditiva de גַּם, a ênfase do pronome אֲנִי e a leve progressão adversativa sugerida pelo contexto.
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: levantei a mão diante deles
  rationale: Mantém a imagem concreta do gesto de juramento. 'Diante deles' comunica em português natural que o gesto foi feito perante eles, sem transformar o dativo em benefício.
- source_word: לְבִלְתִּי הָבִיא אוֹתָם
  choice: jurando que não os levaria
  rationale: Explicita a função idiomática do gesto e apresenta com naturalidade o conteúdo do juramento, sem alterar sua força negativa.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי
  choice: à terra que lhes havia dado
  rationale: O mais-que-perfeito situa a dádiva ou concessão antes do juramento de exclusão; o objeto indireto é recuperado do contexto e do sentido da construção.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: terra que mana leite e mel
  rationale: Formulação portuguesa consagrada e compreensível, que preserva a metáfora hebraica de abundância.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: o esplendor de todas as terras
  rationale: '''Esplendor'' representa o sentido de beleza, excelência e caráter desejável de צְבִי, preservando a construção elevada e sua possível nuance superlativa.'
theological_decisions:
- issue: Se o sentido de juramento de נָשָׂאתִי יָדִי deve ser explicitado
  choice: Manter o gesto literal e acrescentar 'jurando' para esclarecer sua função
  alternative: Traduzir apenas 'levantei a mão' ou substituir toda a expressão por 'jurei'
  rationale: A combinação conserva a imagem hebraica e torna imediatamente inteligível ao leitor moderno que se trata de um juramento, sem depender apenas de nota.
- issue: Força temporal e conceitual de נָתַתִּי em relação à terra
  choice: Traduzir 'havia dado'
  alternative: Traduzir 'dei' ou explicitar 'havia prometido dar'
  rationale: O mais-que-perfeito reflete a concessão anterior da terra do ponto de vista do juramento no deserto, sem resolver indevidamente a tensão entre dádiva, promessa e posse efetiva.
- issue: Relação expressa por לְכָל הָאֲרָצוֹת
  choice: Traduzir 'de todas as terras'
  alternative: Traduzir 'entre todas as terras'
  rationale: A formulação admite a ideia de excelência suprema sem impor uma análise comparativa mais explícita do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação preserva a imagem hebraica do gesto de juramento, esclarece seu sentido no corpo do texto e mantém a linguagem tradicional, mas corrente, de 'mana leite e mel'.
