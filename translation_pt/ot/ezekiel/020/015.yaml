revisions:
- from: Contudo, também eu levantei a mão diante deles no deserto[a], jurando que não os levaria à terra que lhes havia dado, terra que mana leite e mel, o esplendor de todas as terras[b].
  to: Contudo, eu também levantei a mão contra eles no deserto[a], jurando que não os levaria à terra que lhes havia dado, uma terra que mana leite e mel, o esplendor de todas as terras[b].
  rationale: A revisão corrige a relação de «diante deles» com o juramento de exclusão para «contra eles», que corresponde melhor ao contexto e ao uso bíblico da expressão. Também faz dois ajustes menores de fluência, sem alterar o sentido nem resolver além do necessário a nuance de צְבִי.
