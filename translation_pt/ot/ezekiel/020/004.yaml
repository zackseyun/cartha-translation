  text: הֲ/תִשְׁפֹּ֣ט אֹתָ֔/ם הֲ/תִשְׁפּ֖וֹט בֶּן אָדָ֑ם אֶת תּוֹעֲבֹ֥ת אֲבוֹתָ֖/ם הוֹדִיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/004.yaml
  text: Will you judge them? Will you judge[b][a], son of man? Make known to them the abominations of their fathers.
translation:
  language: pt
  text: Você os julgará? Você os julgará, filho do homem?[a] Dê-lhes a conhecer as abominações dos seus pais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho do homem” é a forma habitual de tratamento dirigida a Ezequiel; também pode ser traduzido por “mortal” ou “ser humano”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos seus antepassados”. O hebraico diz literalmente “dos seus pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁפֹּט / הֲתִשְׁפּוֹט
  choice: Você os julgará? Você os julgará
  rationale: O qal de שׁפט tem aqui sentido judicial. A repetição deliberada e a força interrogativa do hebraico são preservadas.
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto que retoma os anciãos no contexto.
- source_word: בֶּן אָדָם
  choice: filho do homem
  rationale: Mantém a forma masculina e o modo habitual pelo qual Deus se dirige a Ezequiel, sem impor ao texto um sentido messiânico posterior.
- source_word: תּוֹעֲבוֹת
  choice: abominações
  rationale: Preserva o forte peso moral e pactual do termo em Ezequiel, frequentemente relacionado a práticas idólatras e contaminadoras.
- source_word: אֲבוֹתָם
  choice: seus pais
  rationale: Reproduz o termo familiar masculino do hebraico; 'antepassados' permanece uma alternativa contextual possível.
- source_word: הוֹדִיעֵם
  choice: Faça-os conhecer
  rationale: 'Expressa a força causativa do hifil de ידע: levar alguém a saber ou conhecer algo.'
theological_decisions:
- issue: Sentido de בֶּן אָדָם
  choice: filho do homem
  alternative: mortal; ser humano
  rationale: Trata-se da forma profética regular de tratamento dirigida a Ezequiel. A formulação preserva o idioma hebraico sem transformar a expressão, neste versículo, em título messiânico.
- issue: Referência de אֲבוֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução principal conserva a linguagem familiar e masculina do original, enquanto a nota registra o sentido genealógico mais amplo possível.
- issue: Força da pergunta repetida
  choice: 'manter duas perguntas: ''Você os julgará? Você os julgará...'''
  alternative: 'entender como ordem enfática: ''Julgue-os, julgue-os...'''
  rationale: A forma interrogativa com הֲ favorece a pergunta retórica, mas o contexto profético permite que ela tenha força de incumbência ou exortação; essa tensão não deve ser convertida silenciosamente em imperativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para a colocação pronominal natural em português, preservando a repetição enfática e a ambiguidade retórica do hebraico.
