base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/043.yaml
  text: There you will remember your ways and all your deeds by which you defiled yourselves[b][a], and you will loathe yourselves in your own sight for all the evils that you have done.
translation:
  language: pt
  text: Ali vocês se lembrarão dos seus caminhos e de todos os seus atos com os quais se contaminaram e, aos seus próprios olhos[b], sentirão repulsa de si mesmos[a] por todas as maldades que cometeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficarão enojados de si mesmos”. O verbo hebraico expressa forte aversão a si próprio.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante de seus rostos”; aqui, o sentido é “aos seus próprios olhos” ou “na avaliação que fazem de si mesmos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכַרְתֶּם שָׁם
  choice: Ali vocês se lembrarão
  rationale: O perfeito com waw tem valor futuro no discurso profético. “Ali” retoma naturalmente o lugar mencionado no contexto anterior.
- source_word: דַּרְכֵיכֶם
  choice: dos seus caminhos
  rationale: Preserva a metáfora hebraica para a maneira de viver e continua clara em português moderno.
- source_word: כָּל עֲלִילוֹתֵיכֶם
  choice: de todos os seus atos
  rationale: עֲלִילוֹת designa ações ou feitos; “atos” distingue as ações concretas dos “caminhos”, isto é, da conduta habitual.
- source_word: אֲשֶׁר נִטְמֵאתֶם בָּם
  choice: com os quais se contaminaram
  rationale: O nifal de טמא indica tornar-se impuro ou contaminado. A formulação reflexiva conserva a responsabilidade dos envolvidos, e “com os quais” expressa adequadamente o valor instrumental de ב.
- source_word: וּנְקֹטֹתֶם
  choice: sentirão repulsa de si mesmos
  rationale: קוט comunica aversão intensa ou repugnância. A expressão é forte, natural e explicita o objeto reflexivo indicado pelo contexto.
- source_word: בִּפְנֵיכֶם
  choice: aos seus próprios olhos
  rationale: Embora literalmente relacionado a “rostos”, o idioma descreve como eles passarão a ver ou avaliar a si mesmos.
- source_word: בְּכָל רָעוֹתֵיכֶם אֲשֶׁר עֲשִׂיתֶם
  choice: por todas as maldades que cometeram
  rationale: רָעוֹת abrange males ou ações perversas. “Cometeram” combina naturalmente com “maldades” e mantém a perspectiva retrospectiva.
theological_decisions:
- issue: Natureza da reação de Israel depois da restauração
  choice: O texto descreve uma profunda repulsa de si mesmos ao recordarem seus pecados passados.
  alternative: Entender a reação apenas como arrependimento leve ou vergonha.
  rationale: A força lexical de קוט favorece aversão intensa. A tradução mantém essa força sem acrescentar um sistema doutrinário além do que o versículo afirma.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A estrutura mantém a metáfora de “caminhos”, diferencia conduta de atos concretos e conserva a intensidade da reação de repulsa.
