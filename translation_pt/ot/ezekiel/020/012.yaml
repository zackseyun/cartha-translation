source:
  edition: WLC
  text: וְ/גַ֤ם אֶת שַׁבְּתוֹתַ/י֙ נָתַ֣תִּי לָ/הֶ֔ם לִ/הְי֣וֹת לְ/א֔וֹת בֵּינִ֖/י וּ/בֵֽינֵי/הֶ֑ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/012.yaml
  text: I also gave them my Sabbaths to be a sign between me and them[a], so that they might know that I am Yahweh who sanctifies them.
translation:
  language: pt
  text: Também lhes dei os meus sábados, para servirem de sinal entre mim e eles, a fim de que soubessem que eu sou Yahweh, aquele que os santifica.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que os torna santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Preserva a força aditiva do hebraico e liga naturalmente este ato aos anteriores.
- source_word: שַׁבְּתוֹתַי
  choice: os meus sábados
  rationale: Mantém o plural e o sufixo possessivo do hebraico, podendo abranger tanto os dias de sábado quanto sua observância como instituição.
- source_word: נָתַתִּי לָהֶם
  choice: lhes dei
  rationale: É uma tradução direta e idiomática do verbo נתן com objeto indireto.
- source_word: לִהְיוֹת לְאוֹת
  choice: para servirem de sinal
  rationale: Expressa a finalidade da dádiva e concorda naturalmente em português com o antecedente plural, sem perder o singular coletivo de אוֹת, “sinal”.
- source_word: בֵּינִי וּבֵינֵיהֶם
  choice: entre mim e eles
  rationale: Reproduz com clareza a fórmula relacional hebraica.
- source_word: לָדַעַת
  choice: a fim de que soubessem
  rationale: Comunica a ideia de propósito do infinitivo com ל e mantém a referência aos destinatários.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מְקַדְּשָׁם
  choice: aquele que os santifica
  rationale: O particípio apresenta Yahweh como quem realiza a ação de separar ou tornar santo; “santifica” conserva o vocabulário teológico sem determinar além do texto o modo dessa ação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Sentido de קדשׁ no contexto da aliança
  choice: aquele que os santifica
  alternative: aquele que os torna santos; aquele que os consagra
  rationale: “Santifica” preserva a amplitude da ação divina de tornar santo ou separar como santo, sem restringi-la apenas a uma cerimônia de consagração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “para servirem de sinal” torna natural a relação com “sábados”, e “a fim de que” mantém claramente a finalidade expressa no hebraico.
