id: EZK.20.37
reference: Ezekiel 20:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַעֲבַרְתִּ֥י אֶתְ/כֶ֖ם תַּ֣חַת הַ/שָּׁ֑בֶט וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם בְּ/מָסֹ֥רֶת הַ/בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/037.yaml
  text: I will make you pass under the rod[b][a], and I will bring you into the bond of the covenant.
translation:
  language: pt
  text: Farei vocês passarem debaixo da vara[a] e os farei entrar no vínculo da aliança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Passar debaixo da vara” provavelmente evoca a prática de contar ou examinar um rebanho enquanto os animais passavam sob a vara do pastor.
    reason: cultural_note
  - marker: b
    text: Ou “na obrigação da aliança” ou “nas amarras da aliança”. O termo hebraico traduzido por “vínculo” é raro e transmite a ideia de estar ligado ou sujeito a uma restrição em relação à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: Farei vocês passarem
  rationale: O hifil de עבר tem força causativa; esta formulação a preserva com clareza e naturalidade em português.
- source_word: תַּחַת הַשָּׁבֶט
  choice: debaixo da vara
  rationale: שֵׁבֶט pode significar vara, bastão ou cetro. Neste contexto, a expressão provavelmente evoca o exame ou a contagem de animais por um pastor; “vara” mantém a imagem tradicional sem explicá-la no corpo do texto.
- source_word: וְהֵבֵאתִי
  choice: os farei entrar
  rationale: O hifil de בוא significa normalmente “trazer” ou “fazer entrar”. Aqui, “farei entrar” combina naturalmente com a preposição e mantém o paralelismo causativo da primeira oração.
- source_word: בְּמָסֹרֶת
  choice: no vínculo
  rationale: מָסֹרֶת é um termo raro ligado à ideia de algo que prende, restringe ou obriga. “Vínculo” preserva a metáfora e sua ambiguidade entre ligação e obrigação, sem tornar a imagem exclusivamente física.
- source_word: הַבְּרִית
  choice: da aliança
  rationale: בְּרִית é o termo bíblico usual para aliança; a escolha conserva seu peso relacional, jurídico e teológico.
theological_decisions:
- issue: Sentido da imagem de passar debaixo da vara e entrar no vínculo da aliança
  choice: Conservar simultaneamente as ideias de exame soberano e de sujeição ao vínculo da aliança, sem definir se a ênfase é punitiva ou restauradora.
  alternative: Interpretar a passagem exclusivamente como restrição punitiva ou exclusivamente como readmissão restauradora à comunhão da aliança.
  rationale: As imagens permitem tanto inspeção e juízo quanto pertencimento e obrigação pactual. O versículo, isoladamente, não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” explicita o objeto plural de modo natural; “vara”, “vínculo” e “aliança” preservam as imagens e a tensão do hebraico.
