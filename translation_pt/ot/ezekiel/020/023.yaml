id: EZK.20.23
reference: Ezekiel 20:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם אֲנִ֗י נָשָׂ֧אתִי אֶת יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/הָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וּ/לְ/זָר֥וֹת אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/023.yaml
  text: Moreover[a], I also raised my hand to them in the wilderness, to scatter them among the nations and disperse them through the lands.
translation:
  language: pt
  text: Além disso, levantei a mão diante deles no deserto[a], jurando que os espalharia entre as nações e os dispersaria por diversas terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jurei a eles no deserto que os espalharia”. O hebraico diz literalmente: “levantei a mão”, expressão usada para prestar juramento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Além disso
  rationale: Introduz mais uma declaração solene na sequência. Em português, a primeira pessoa já está expressa na forma verbal, e a força aditiva de גַּם é transmitida por “Além disso”.
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: levantei a mão
  rationale: Preserva a imagem concreta do idioma hebraico, que neste contexto indica a prestação de um juramento.
- source_word: לָהֶם
  choice: diante deles
  rationale: Com o gesto de levantar a mão para jurar, “diante deles” produz em português uma formulação natural e mantém o povo como destinatário ou testemunha da declaração.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: É a designação corrente e natural, em português moderno, do cenário da peregrinação de Israel.
- source_word: לְהָפִיץ אֹתָם בַּגּוֹיִם
  choice: que os espalharia entre as nações
  rationale: O infinitivo hebraico exprime o conteúdo ou propósito do juramento; “espalharia” comunica naturalmente a ação divina anunciada, e “nações” evita sentidos posteriores associados a “gentios”.
- source_word: וּלְזָרוֹת אוֹתָם בָּאֲרָצוֹת
  choice: e os dispersaria por diversas terras
  rationale: “Dispersaria” distingue o segundo verbo do primeiro sem apagar o paralelismo. “Diversas” explicita distributivamente o plural hebraico “terras”, sem identificar países específicos.
theological_decisions:
- issue: Traduzir explicitamente o idioma de juramento ou preservar a imagem de levantar a mão
  choice: Preservar “levantei a mão” no texto e tornar claro, pelo particípio “jurando”, o valor idiomático do gesto
  alternative: “Jurei a eles no deserto”
  rationale: A formulação conserva a imagem judicial e pactual do hebraico, mas evita que o leitor moderno interprete o gesto sem perceber que se trata de um juramento. A nota registra a tradução mais direta do sentido.
- issue: Relação dos infinitivos לְהָפִיץ e לְזָרוֹת com o ato de levantar a mão
  choice: 'Entendê-los como conteúdo do juramento: “jurando que os espalharia... e os dispersaria...”'
  alternative: 'Entendê-los mais estritamente como propósito: “para os espalhar... e os dispersar...”'
  rationale: No contexto do idioma de juramento, os infinitivos descrevem aquilo que Deus jurou fazer. A tradução escolhida torna essa relação inteligível sem eliminar a força de finalidade presente na construção hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação preserva a imagem hebraica do gesto de juramento, esclarece seu sentido no próprio período e mantém distintos os dois verbos paralelos de dispersão.
