  to: Eu os aceitarei como aroma agradável quando os tirar do meio dos povos e os reunir das terras onde foram espalhados. E me mostrarei santo por meio de vocês diante dos olhos das nações.
  rationale: A revisão preserva a metáfora cultual e a leitura contextual de בָכֶם como meio da manifestação da santidade divina, mas corrige a alternância desnecessária entre «os» e «vocês» e torna mais direto o predicado relativo à santidade de Deus.
