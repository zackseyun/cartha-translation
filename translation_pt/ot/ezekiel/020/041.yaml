base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/041.yaml
  text: I will accept you like a pleasing aroma when I bring you out from the peoples and gather you from the lands where you have been scattered, and I will show myself holy through you before the eyes of the nations.
translation:
  language: pt
  text: Eu os aceitarei como aroma agradável quando os tirar do meio dos povos e os reunir das terras onde foram espalhados. E me mostrarei santo por meio de vocês diante dos olhos das nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: A expressão cultual descreve um aroma que produz agrado ou aceitação. “Como” comunica naturalmente em português a relação entre o povo aceito e o aroma agradável, sem perder a imagem do hebraico.
- source_word: אֶרְצֶה אֶתְכֶם
  choice: Eu os aceitarei
  rationale: O verbo רצה, com objeto pessoal, expressa acolhimento favorável ou aceitação; o futuro preserva a promessa do discurso.
- source_word: בְּהוֹצִיאִי אֶתְכֶם
  choice: quando os tirar
  rationale: O infinitivo com preposição בְּ e sufixo de primeira pessoa tem valor temporal neste contexto.
- source_word: מִן הָעַמִּים
  choice: do meio dos povos
  rationale: “Povos” mantém o plural hebraico e “do meio de” soa natural para a retirada dentre vários grupos humanos.
- source_word: וְנִקְדַּשְׁתִּי בָכֶם
  choice: E mostrarei minha santidade por meio de vocês
  rationale: O nifal de קדש pode indicar que Deus será reconhecido ou manifestado como santo. בָכֶם admite sentido instrumental, “por meio de vocês”, coerente com a manifestação pública diante das nações.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: diante dos olhos das nações
  rationale: Preserva a imagem hebraica da demonstração pública e visível, em vez de reduzi-la apenas a “diante das nações”.
theological_decisions:
- issue: Como expressar a santificação de Deus em וְנִקְדַּשְׁתִּי בָכֶם
  choice: mostrarei minha santidade por meio de vocês
  alternative: serei reconhecido como santo entre vocês
  rationale: A preposição בְּ pode ser instrumental ou locativa. O contexto destaca o testemunho perante as nações, favorecendo a manifestação da santidade divina por meio da restauração de Israel, sem sugerir que Deus se torne mais santo.
- issue: Relação entre aceitação e aroma cultual
  choice: Eu os aceitarei como aroma agradável
  alternative: Com aroma agradável, eu me agradarei de vocês
  rationale: A formulação escolhida mantém a metáfora aplicada ao povo e evita afirmar explicitamente a presença de um sacrifício que o versículo não menciona.
translation_notes:
  register: Português moderno, claro e solene, com pronomes de ampla legibilidade brasileira. A divisão em duas frases melhora a leitura sem alterar a sequência lógica do hebraico. Mantida a imagem “diante dos olhos” por seu valor concreto e público.
