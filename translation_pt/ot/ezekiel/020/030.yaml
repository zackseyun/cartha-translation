  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הַ/בְּ/דֶ֥רֶךְ אֲבֽוֹתֵי/כֶ֖ם אַתֶּ֣ם נִטְמְאִ֑ים וְ/אַחֲרֵ֥י שִׁקּוּצֵי/הֶ֖ם אַתֶּ֥ם זֹנִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/030.yaml
  text: 'Therefore say to the house of Israel[a], Thus says the Lord Yahweh: Are you defiling yourselves in the way of your fathers[b], and whoring after their detestable things?'
translation:
  language: pt
  text: 'Portanto, diga à casa de Israel: Assim diz o Senhor Yahweh: “Será que vocês estão se tornando impuros ao seguir o caminho de seus antepassados[a] e prostituindo-se após as coisas detestáveis deles[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a conduta de seus antepassados”.'
    reason: Alternativa idiomática para a expressão hebraica que significa seguir o padrão de vida dos antepassados.
  - marker: b
    text: “Coisas detestáveis” também pode ser traduzido como “abominações” e, neste contexto, pode referir-se a ídolos.
    reason: O termo hebraico designa coisas repugnantes ou abomináveis e é frequentemente usado para objetos de idolatria.
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Conjunção inferencial natural que liga esta ordem profética à acusação precedente.
- source_word: אֱמֹר אֶל בֵּית יִשְׂרָאֵל
  choice: diga à casa de Israel
  rationale: Preserva a fórmula de comissão e a designação coletiva e pactual de Israel.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Mantém a fórmula profética, distingue אֲדֹנָי do nome divino e representa explicitamente o tetragrama como Yahweh.
- source_word: הַבְּדֶרֶךְ אֲבוֹתֵיכֶם
  choice: ao seguir o caminho de seus antepassados
  rationale: Expressa em português natural a ideia idiomática de adotar a conduta ancestral, sem reduzir 'caminho' a práticas específicas.
- source_word: אַתֶּם נִטְמְאִים
  choice: vocês estão se tornando impuros
  rationale: O particípio indica ação em curso; a formulação preserva a linguagem de impureza, sem limitar indevidamente o sentido ao ritual ou ao moral.
- source_word: וְאַחֲרֵי שִׁקּוּצֵיהֶם
  choice: e ... atrás das coisas detestáveis deles
  rationale: Mantém a imagem de perseguição contida em אַחֲרֵי e traduz שִׁקּוּצִים sem restringi-lo explicitamente a ídolos.
- source_word: אַתֶּם זֹנִים
  choice: se prostituindo
  rationale: Preserva a forte metáfora profética de prostituição para infidelidade pactual e idolatria.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor; o Senhor DEUS
  rationale: A tradução distingue os dois elementos do título e preserva explicitamente o nome pactual expresso pelo tetragrama.
- issue: Natureza da impureza em נִטְמְאִים
  choice: se tornando impuros
  alternative: contaminando-se
  rationale: A escolha conserva a amplitude da linguagem bíblica de impureza e não decide silenciosamente entre dimensões ritual, moral e cultual.
- issue: Metáfora de זנה aplicada à idolatria
  choice: se prostituindo
  alternative: sendo infiéis
  rationale: A metáfora sexual explícita faz parte da retórica profética e comunica infidelidade pactual; suavizá-la eliminaria parte importante da força do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A pergunta retórica foi mantida. “Antepassados” evita a leitura exclusivamente masculina que “pais” poderia sugerir no português corrente, embora o hebraico use o termo tradicional para pais/ancestrais. Os marcadores [a] e [b] aparecem junto às expressões que explicam.
source_grounding:
  english_pob_role: consult_only
