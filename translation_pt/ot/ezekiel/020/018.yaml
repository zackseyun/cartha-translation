base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/018.yaml
  text: And I said to their children in the wilderness[a], ‘Do not walk in the statutes of your fathers, and do not keep their judgments, and do not defile yourselves with their idols.’
translation:
  language: pt
  text: 'E eu disse aos filhos deles no deserto: “Não andem segundo os estatutos de seus pais, não guardem as ordenanças deles e não se contaminem com os ídolos deles.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é fortemente depreciativo; também poderia ser vertido como “ídolos imundos” ou, de modo mais literal e contundente, “ídolos de esterco”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; “E eu disse” preserva essa progressão simples sem impor uma relação discursiva mais específica.
- source_word: בְּנֵיהֶם
  choice: aos filhos deles
  rationale: בנים pode designar filhos ou descendentes em sentido geracional. Aqui se refere à geração seguinte de Israel; “filhos deles” conserva tanto a forma masculina quanto o contraste entre gerações.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa a região erma da peregrinação de Israel. “No deserto” é a formulação natural e tradicional em português para este contexto.
- source_word: בְּחֻקֵּי
  choice: segundo os estatutos
  rationale: חֻקִּים são prescrições estabelecidas. “Andar segundo os estatutos” comunica em português corrente o idioma hebraico de orientar a conduta por essas normas.
- source_word: אֲבוֹתֵיכֶם
  choice: de seus pais
  rationale: O substantivo masculino plural tem aqui sentido geracional e se refere à geração anterior. “Seus pais” mantém a forma e o contraste presentes no hebraico.
- source_word: אַל תֵּלֵכוּ
  choice: Não andem
  rationale: הלך, neste uso, descreve a maneira de viver ou conduzir-se. “Não andem segundo” preserva a metáfora hebraica e permanece claro em português bíblico atual.
- source_word: מִשְׁפְּטֵיהֶם
  choice: as suas ordenanças
  rationale: מִשְׁפָּטִים pode indicar decisões, normas ou ordenanças. “Ordenanças” mantém o caráter normativo e distingue o termo de חֻקִּים, traduzido como “estatutos”.
- source_word: תִּשְׁמֹרוּ
  choice: não guardem
  rationale: שׁמר, quando aplicado a normas, significa guardar ou observar. “Guardar” conserva a linguagem pactual tradicional sem perder inteligibilidade.
- source_word: גִּלּוּלֵיהֶם
  choice: os seus ídolos
  rationale: גִּלּוּלִים é um termo fortemente depreciativo para ídolos. “Ídolos” oferece clareza no texto principal, enquanto a nota registra a carga de desprezo difícil de reproduzir naturalmente.
- source_word: תִּטַּמָּאוּ
  choice: não se contaminem
  rationale: A forma reflexiva expressa tornar-se impuro ou contaminado. “Não se contaminem” preserva essa força e abrange as dimensões ritual e moral do contexto.
theological_decisions:
- issue: Sentido geracional de אֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico usa o masculino plural e contrasta a geração dos pais com seus filhos. A tradução mantém “pais”, sem ampliar explicitamente o referente para todos os antepassados.
- issue: Força depreciativa de גִּלּוּלִים
  choice: ídolos no texto, com explicação em nota
  alternative: ídolos imundos / ídolos de esterco
  rationale: O desprezo expresso pelo termo é genuíno, mas uma equivalência literal ou intensificada no corpo do versículo soaria pouco natural e poderia estreitar indevidamente sua imagem etimológica. A nota preserva a nuance para o leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “andar segundo” preserva a metáfora hebraica sem obscurecer o sentido; “estatutos” e “ordenanças” mantêm a distinção entre os dois termos jurídicos do original.
