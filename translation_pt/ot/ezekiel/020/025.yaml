id: EZK.20.25
reference: Ezekiel 20:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ נָתַ֣תִּי לָ/הֶ֔ם חֻקִּ֖ים לֹ֣א טוֹבִ֑ים וּ/מִ֨שְׁפָּטִ֔ים לֹ֥א יִֽחְי֖וּ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/025.yaml
  text: Moreover[b][a], I myself gave them statutes that were not good and ordinances by which they could not live.
translation:
  language: pt
  text: Além disso, eu mesmo lhes dei estatutos que não eram bons e normas pelas quais não viveriam.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido interpretativo: “eu os entreguei a estatutos que não eram bons”, entendendo-se o ato como juízo, e não como a promulgação, por Deus, de leis moralmente defeituosas.'
    reason: alternative_reading
  - marker: b
    text: A expressão “viver por elas” retoma a linguagem da aliança segundo a qual a obediência aos estatutos de Deus conduz à vida (compare Levítico 18:5). Aqui, a fórmula é deliberadamente invertida.
    reason: cross_reference
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Expressa a força aditiva e enfática da locução, ligando o versículo ao argumento anterior com naturalidade em português.
- source_word: אֲנִי
  choice: eu mesmo
  rationale: O pronome independente enfatiza o sujeito já indicado pela forma verbal; “eu mesmo” conserva essa ênfase.
- source_word: נָתַתִּי
  choice: dei
  rationale: Mantém o sentido lexical direto de נתן sem introduzir no texto principal uma solução interpretativa como “entreguei” ou “permiti”.
- source_word: חֻקִּים
  choice: estatutos
  rationale: Termo corrente no registro jurídico e pactual bíblico, distinguindo-se adequadamente de מִשְׁפָּטִים.
- source_word: לֹא טוֹבִים
  choice: que não eram bons
  rationale: Preserva literalmente a negação hebraica, sem intensificá-la para “maus” nem atenuar sua tensão.
- source_word: וּמִשְׁפָּטִים
  choice: e normas
  rationale: “Normas” comunica prescrições ou determinações jurídicas em português atual e evita a possível leitura exclusivamente forense de “juízos”.
- source_word: לֹא יִחְיוּ בָּהֶם
  choice: pelas quais não viveriam
  rationale: Conserva o valor instrumental de ב e o eco da fórmula pactual de viver mediante a observância dos estatutos, aqui deliberadamente negada.
theological_decisions:
- issue: Se o ato divino de “dar” estatutos não bons deve ser suavizado como mera permissão
  choice: Manter “eu mesmo lhes dei” no texto principal.
  alternative: “Eu os entreguei a estatutos que não eram bons.”
  rationale: O hebraico apresenta diretamente Deus como sujeito de נתן, “dar”. A tradução não deve resolver silenciosamente a tensão teológica, embora a leitura judicial possa ser registrada em nota.
- issue: Relação entre este versículo e a bondade da lei de Deus em outros textos
  choice: Traduzir diretamente “não eram bons”, sem qualificação doutrinária no texto.
  alternative: Entender a expressão como referência a práticas nocivas às quais o povo foi entregue judicialmente, ou a estatutos estrangeiros e idólatras.
  rationale: A formulação hebraica é deliberadamente forte. Preservá-la evita inserir uma harmonização interpretativa no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a afirmação direta e sua tensão teológica. Os marcadores foram colocados após a oração a que ambas as notas se referem.
