  text: יַ֜עַן מִשְׁפָּטַ֤/י לֹֽא עָשׂוּ֙ וְ/חֻקּוֹתַ֣/י מָאָ֔סוּ וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וְ/אַחֲרֵי֙ גִּלּוּלֵ֣י אֲבוֹתָ֔/ם הָי֖וּ עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/024.yaml
  text: because they did not practice my judgments[a], and they rejected my statutes, and they profaned my Sabbaths, and their eyes were after the idols of their fathers.
translation:
  language: pt
  text: porque não cumpriram os meus juízos, rejeitaram os meus estatutos, profanaram os meus sábados e seus olhos estavam voltados para os ídolos[a] de seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é fortemente depreciativo; também pode ser traduzido por “ídolos repugnantes” ou, mais literalmente, “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: porque
  rationale: Introduz a causa da ação divina mencionada no contexto anterior e preserva de modo natural a força explicativa do hebraico.
- source_word: מִשְׁפָּטַי ... עָשׂוּ
  choice: não cumpriram os meus juízos
  rationale: “Cumprir” expressa naturalmente a execução de exigências da aliança, enquanto “juízos” conserva o caráter jurídico de מִשְׁפָּט e o distingue de חֻקּוֹת.
- source_word: חֻקּוֹתַי מָאָסוּ
  choice: rejeitaram os meus estatutos
  rationale: “Estatutos” mantém o vocabulário jurídico da aliança, e “rejeitaram” comunica a repudiação expressa por מָאַס sem intensificação indevida.
- source_word: שַׁבְּתוֹתַי חִלֵּלוּ
  choice: profanaram os meus sábados
  rationale: A formulação preserva tanto o plural das observâncias sabáticas quanto o peso cultual e pactual de חלל no piel.
- source_word: אַחֲרֵי ... הָיוּ עֵינֵיהֶם
  choice: mantiveram os olhos voltados para
  rationale: Reproduz em português corrente a imagem hebraica dos olhos orientados para algo, indicando desejo e lealdade persistentes sem reduzir a expressão a um simples ato de olhar.
- source_word: גִּלּוּלֵי
  choice: ídolos
  rationale: “Ídolos” transmite o referente com clareza; a conotação fortemente depreciativa peculiar ao termo de Ezequiel é explicitada em nota.
- source_word: אֲבוֹתָם
  choice: de seus pais
  rationale: Conserva o substantivo masculino e familiar empregado explicitamente no hebraico, sem ampliá-lo para o sentido mais geral de “antepassados”.
theological_decisions:
- issue: Força depreciativa de גִּלּוּלִים
  choice: ídolos, com nota
  alternative: ídolos repugnantes; ídolos de esterco
  rationale: O termo de Ezequiel é deliberadamente desdenhoso. A tradução principal evita uma expansão interpretativa, enquanto a nota preserva a força retórica do original.
- issue: Sentido de אֲבוֹתָם
  choice: de seus pais
  alternative: de seus antepassados
  rationale: O hebraico emprega especificamente o plural masculino “pais”; mantê-lo preserva a forma familiar do texto sem neutralização.
- issue: Imagem dos olhos voltados aos ídolos
  choice: mantiveram os olhos voltados para
  alternative: seguiram; desejaram
  rationale: A imagem concreta do hebraico é mantida, sem decidir exclusivamente entre atenção, desejo e orientação de lealdade, sentidos que podem coexistir no contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário pactual consistente. A coordenação acumulativa do hebraico foi preservada, e o marcador da nota foi colocado junto a “ídolos”, termo ao qual a nota se refere.
