base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/003.yaml
  text: 'Son of man[a], speak to the elders of Israel and say to them, Thus says the Lord GOD: Is it to inquire of me that you have come? As I live, I will not be inquired of by you[b], declares the Lord GOD.'
translation:
  language: pt
  text: 'Filho do homem[a], fale aos anciãos de Israel e diga-lhes: Assim diz o Senhor Yahweh: “Foi para me consultar que vocês vieram? Tão certo como eu vivo, não me deixarei consultar por vocês”, declara o Senhor Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “filho do homem” identifica Ezequiel como ser humano; também pode ser vertida por “ser humano” ou “mortal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a fórmula característica com que Ezequiel é interpelado e o contraste entre o profeta humano e Deus, sem substituir o idiomatismo por uma interpretação como “mortal”.
- source_word: דַּבֵּר אֶת זִקְנֵי יִשְׂרָאֵל
  choice: fale aos anciãos de Israel
  rationale: Expressa naturalmente em português a ordem dirigida ao profeta e mantém “anciãos” como designação do grupo reconhecido de líderes de Israel.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Mantém a fórmula profética de mensageiro e representa distintamente tanto אֲדֹנָי, “Senhor”, quanto o nome divino יהוה, “Yahweh”.
- source_word: הֲלִדְרֹשׁ אֹתִי אַתֶּם בָּאִים
  choice: Foi para me consultar que vocês vieram?
  rationale: Neste contexto, דרשׁ indica buscar de Deus uma resposta ou um oráculo, e não apenas procurá-lo em sentido geral. A construção focal “Foi para... que” reproduz a ênfase interrogativa hebraica de modo natural.
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Verte a fórmula divina de juramento em linguagem portuguesa clara e solene, preservando sua força asseverativa.
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: não me deixarei consultar por vocês
  rationale: Depois da fórmula de juramento, אִם comunica uma negação enfática. A forma reflexiva conserva o sentido passivo/reflexivo do nifal de דרשׁ e repete o verbo “consultar” empregado na pergunta.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Comunica a força autoritativa da fórmula profética נְאֻם em português corrente e digno.
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus
  rationale: “Senhor Yahweh” preserva tanto o título אֲדֹנָי quanto o nome próprio יהוה, evitando fundi-los ou repetir “Senhor”.
- issue: Força da construção de juramento חַי אָנִי אִם
  choice: Tão certo como eu vivo, não me deixarei consultar por vocês
  alternative: Vivo eu, se me deixarei consultar por vocês
  rationale: No hebraico, אִם após um juramento é uma fórmula elíptica de forte negação. A tradução explicita essa negação sem enfraquecer a solenidade do juramento.
- issue: Natureza da recusa divina
  choice: não me deixarei consultar por vocês
  alternative: não responderei à consulta de vocês
  rationale: 'A formulação mantém a ambiguidade do nifal: Deus se recusa a tornar-se objeto da consulta deles, sem acrescentar uma explicação sobre os motivos ou sobre o conteúdo de uma possível resposta.'
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural explícito e “anciãos” como termo bíblico corrente. A pontuação distingue a fala do profeta, a mensagem divina e a pergunta citada.
