  text: וְ/לִ/פְנֵ֨י הַ/לְּשָׁכ֜וֹת מַהֲלַךְ֩ עֶ֨שֶׂר אַמּ֥וֹת רֹ֨חַב֙ אֶל הַ/פְּנִימִ֔ית דֶּ֖רֶךְ אַמָּ֣ה אֶחָ֑ת וּ/פִתְחֵי/הֶ֖ם לַ/צָּפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/004.yaml
  text: Before the chambers was a walkway ten cubits wide toward the inner court[a], and a passage one cubit wide[b]; and their entrances faced north.
translation:
  language: pt
  text: Diante das câmaras havia uma passagem de dez côvados de largura, em direção à parte interna[a], e um acesso de um côvado de largura[b]; as entradas das câmaras davam para o norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em direção à interna”; o substantivo não é expresso. Algumas traduções entendem “em direção ao pátio interno”.'
    reason: alternative_reading
  - marker: b
    text: O texto hebraico desta expressão é difícil. Pode ser entendido como “um acesso de um côvado”; outra vocalização ou tradição textual dá a medida de “cem côvados”.
    reason: textual_variant
lexical_decisions:
- source_word: לִפְנֵי
  choice: Diante de
  rationale: Expressa de modo natural a relação espacial de algo situado em frente às câmaras.
- source_word: הַלְּשָׁכוֹת
  choice: as câmaras
  rationale: Em contexto arquitetônico e cultual, לשכה designa câmaras ou salas; “câmaras” mantém o registro solene sem perder clareza.
- source_word: מַהֲלַךְ
  choice: uma passagem
  rationale: O termo indica um espaço por onde se anda. “Passagem” é claro e não pressupõe uma estrutura fechada como “corredor” poderia sugerir.
- source_word: עֶשֶׂר אַמּוֹת רֹחַב
  choice: de dez côvados de largura
  rationale: Reproduz com naturalidade a medida e conserva a unidade antiga do texto.
- source_word: אֶל הַפְּנִימִית
  choice: em direção à parte interna
  rationale: O hebraico traz o adjetivo feminino substantivado, sem declarar o nome a que se refere. “Parte interna” preserva a direção e a elipse sem acrescentar explicitamente “pátio”.
- source_word: דֶּרֶךְ
  choice: um acesso
  rationale: Neste contexto arquitetônico, indica uma via de acesso. A escolha também a distingue de מַהֲלַךְ, traduzido como “passagem”.
- source_word: אַמָּה אֶחָת
  choice: de um côvado de largura
  rationale: O hebraico diz literalmente “um côvado”; “de largura” é retomado do contexto para tornar a dimensão compreensível em português.
- source_word: וּפִתְחֵיהֶם
  choice: as entradas das câmaras
  rationale: פתח pode designar abertura, porta ou entrada. O substantivo repetido esclarece em português o referente do sufixo pronominal plural.
- source_word: לַצָּפוֹן
  choice: davam para o norte
  rationale: Forma idiomática em português para indicar a orientação das entradas.
