  text: וְ/כִלָּ֗ה אֶת מִדּוֹת֙ הַ/בַּ֣יִת הַ/פְּנִימִ֔י וְ/הוֹצִיאַ֨/נִי֙ דֶּ֣רֶךְ הַ/שַּׁ֔עַר אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֣רֶךְ הַ/קָּדִ֑ים וּ/מְדָד֖/וֹ סָבִ֥יב סָבִֽיב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/015.yaml
  text: When he had finished measuring the inner house[a], he brought me out by way of the gate that faced east[b], and he measured it all around.
translation:
  language: pt
  text: Quando ele terminou de medir o templo interior[a], levou-me para fora pela passagem do portão que dava para o leste[b] e o mediu em toda a volta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a casa interior”. No contexto da visão do templo, “casa” designa o edifício sagrado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o portão cuja face estava na direção do leste”.
    reason: lexical_alternative
  - marker: c
    text: O referente do pronome hebraico traduzido por “o” não é explicitado; provavelmente é o templo ou o conjunto que estava sendo medido.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וְכִלָּה אֶת מִדּוֹת
  choice: Quando ele terminou de medir
  rationale: A construção hebraica fala literalmente de concluir as medições; a formulação verbal é natural em português e expressa a ação concluída antes da seguinte.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: o templo interior
  rationale: Embora בַּיִת signifique literalmente “casa”, no contexto da visão arquitetônica designa o edifício sagrado; “templo interior” comunica esse referente com clareza, preservando em nota a alternativa formal.
- source_word: וְהוֹצִיאַנִי
  choice: levou-me para fora
  rationale: O hifil de יצא indica fazer alguém sair; esta formulação conserva a causatividade e soa natural em português.
- source_word: דֶּרֶךְ הַשַּׁעַר
  choice: pelo caminho do portão
  rationale: דֶּרֶךְ marca a rota pela qual o profeta foi conduzido. A tradução mantém esse elemento, em vez de reduzi-lo simplesmente a “pelo portão”.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: que dava para o leste
  rationale: A expressão literal atribui ao portão uma “face” orientada para o leste; “dava para o leste” é idiomático e preserva a orientação.
- source_word: וּמְדָדוֹ
  choice: e mediu todo o seu contorno
  rationale: O sufixo pronominal masculino singular tem referente não inteiramente explícito, provavelmente o conjunto ou edifício mencionado. A formulação evita um “o” potencialmente obscuro e, com a expressão seguinte, comunica a medição perimetral.
- source_word: סָבִיב סָבִיב
  choice: todo o seu contorno
  rationale: A repetição intensifica a ideia de medição ao redor, por todos os lados. A escolha é clara e natural em português.
theological_decisions:
- issue: Referente de הַבַּיִת הַפְּנִימִי
  choice: templo interior
  alternative: casa interior
  rationale: A escolha é contextual e arquitetônica, não doutrinária; a alternativa lexical mais literal permanece na nota.
- issue: Referente do sufixo em וּמְדָדוֹ
  choice: o contorno da estrutura ou conjunto mencionado
  alternative: um referente masculino singular deixado apenas como pronome
  rationale: O hebraico não explicita novamente o referente. A tradução comunica a leitura contextual mais provável sem identificar dogmaticamente qual parte arquitetônica está em vista, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “portão” para a grande entrada arquitetônica e preserva em notas tanto a imagem literal da “face” do portão quanto a ambiguidade do objeto medido.
