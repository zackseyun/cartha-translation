lexical_decisions:
- source_word: אֶל פְּנֵי
  choice: Diante de
  rationale: A expressão espacial indica posição ou orientação em relação à extensão medida. “Diante de” é natural em português e mantém a concisão e a possível ambiguidade do hebraico.
- source_word: אֹרֶךְ
  choice: comprimento
  rationale: No contexto de medidas arquitetônicas, designa a dimensão longitudinal; “comprimento” é o termo português mais claro e usual.
- source_word: אַמּוֹת הַמֵּאָה
  choice: cem côvados
  rationale: Mantém a unidade antiga de medida sem conversão moderna, preservando a forma e a precisão arquitetônica do texto-fonte.
- source_word: פֶּתַח הַצָּפוֹן
  choice: a entrada do norte
  rationale: פֶּתַח denota uma abertura ou entrada; neste contexto arquitetônico, “entrada” é natural. “Do norte” preserva a construção espacial sem especificar além do hebraico se a entrada estava ao norte ou voltada para o norte.
- source_word: וְהָרֹחַב
  choice: e a largura era
  rationale: רֹחַב indica a dimensão transversal. O verbo “era” é suprido em português para tornar fluente a oração nominal hebraica.
- source_word: חֲמִשִּׁים אַמּוֹת
  choice: cinquenta côvados
  rationale: Tradução direta da medida numérica, mantendo “côvados” em coerência com a dimensão anterior.
