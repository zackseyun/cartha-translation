  text: Facing the length of one hundred cubits was the north entrance[a], and the width was fifty cubits.
translation:
  language: pt
  text: Diante do comprimento de cem côvados ficava a entrada do norte[a], e a largura era de cinquenta côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “À frente do comprimento de cem côvados ficava a entrada do norte”. A expressão espacial hebraica é compacta e admite várias traduções muito próximas.'
