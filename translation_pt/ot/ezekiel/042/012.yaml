  yaml_path: translation/ot/ezekiel/042/012.yaml
  text: And corresponding to the doorways of the chambers that were toward the south[a], there was a doorway at the head of the way, the way in front of the protective wall, toward the east[b], as one enters them.
translation:
  language: pt
  text: E, correspondendo às entradas das câmaras que ficavam voltadas para o sul, havia uma entrada no início do caminho[a], o caminho diante do muro de proteção[b], em direção ao leste, ao se entrar nelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no início da passagem”. O hebraico repete várias vezes a palavra “caminho”, e o detalhe arquitetônico exato é incerto.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “proteção” é raro e também pode indicar um muro de fechamento ou de resguardo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְפִתְחֵי
  choice: E, correspondendo às entradas de
  rationale: A conjunção com o כ comparativo indica correspondência com a disposição descrita anteriormente, não apenas adição. “Correspondendo às” expressa essa relação arquitetônica.
- source_word: הַלְּשָׁכוֹת
  choice: as câmaras
  rationale: No contexto da arquitetura do templo, לִשְׁכָּה designa salas ou câmaras laterais; “câmaras” é preciso e mantém o registro arquitetônico.
- source_word: אֲשֶׁר דֶּרֶךְ הַדָּרוֹם
  choice: que ficavam voltadas para o sul
  rationale: A expressão indica posição ou orientação. Esta formulação é natural em português sem definir além do texto a configuração exata.
- source_word: פֶּתַח
  choice: uma entrada
  rationale: פֶּתַח indica abertura ou acesso; “entrada” evita sugerir necessariamente uma folha de porta.
- source_word: בְּרֹאשׁ דָּרֶךְ
  choice: no início do caminho
  rationale: רֹאשׁ com דֶּרֶךְ denota a extremidade inicial ou começo de uma rota. “Início” é claro em português, enquanto a nota registra a alternativa arquitetônica “passagem”.
- source_word: דֶּרֶךְ
  choice: o caminho
  rationale: No contexto, דֶּרֶךְ provavelmente designa uma via de acesso ou passagem. “Caminho” preserva a repetição deliberada do hebraico e evita especificar demais.
- source_word: בִּפְנֵי הַגְּדֶרֶת
  choice: diante do muro
  rationale: בִּפְנֵי significa “diante de” ou “em frente de”, e גְּדֵרָה refere-se a muro, cerca ou barreira; “muro” se ajusta ao cenário arquitetônico.
- source_word: הֲגִינָה
  choice: de proteção
  rationale: O termo é raro e parece caracterizar a função do muro como proteção, abrigo ou resguardo. A locução preserva essa provável função sem ocultar a incerteza, explicitada em nota.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: em direção ao leste
  rationale: A expressão é direcional e indica a orientação para o leste.
- source_word: בְּבוֹאָן
  choice: quando se entrava nelas
  rationale: O infinitivo construto de בוא com sufixo feminino plural significa literalmente “ao entrar nelas” ou “quando se entrava nelas”, retomando naturalmente as câmaras.
