  text: 'He measured the south side: five hundred reeds by the measuring reed[a].'
translation:
  language: pt
  text: 'Mediu o lado sul: quinhentas canas, com a cana de medir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e versões antigas trazem “côvados” em vez de “canas” neste contexto de medição; o Texto Massorético traz “canas”.
    reason: textual_variant
lexical_decisions:
- source_word: ר֥וּחַ הַ/דָּר֖וֹם
  choice: o lado sul
  rationale: רוּחַ pode indicar vento, direção ou lado; no contexto da medição dos limites, refere-se naturalmente ao lado sul.
- source_word: מָדָ֑ד
  choice: Mediu
  rationale: מדד significa diretamente “medir”. O sujeito continua sendo o medidor já identificado no contexto, e o português permite omiti-lo.
- source_word: חֲמֵשׁ מֵא֥וֹת
  choice: quinhentas
  rationale: Forma cardinal padrão, com concordância feminina com “canas”.
- source_word: קָנִ֖ים
  choice: canas
  rationale: קָנֶה significa “cana” e, nesta visão, também funciona como unidade de medida. Mantém-se a leitura explícita do Texto Massorético, em vez da variante “côvados”.
- source_word: בִּ/קְנֵ֥ה הַ/מִּדָּֽה
  choice: com a cana de medir
  rationale: 'A preposição ב tem sentido instrumental: a medida foi tomada por meio da cana padrão. “Cana de medir” é natural e preserva a relação lexical com “canas”.'
