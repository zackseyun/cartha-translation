  text: He turned to the west side and measured five hundred reeds with the measuring reed[a][b].
translation:
  language: pt
  text: Ele se virou para o lado oeste e mediu quinhentas canas com a cana de medir[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para a direção do mar”, modo hebraico de indicar o oeste.
    reason: cultural_note
  - marker: b
    text: Alguns intérpretes e versões trazem “côvados” em vez de “canas” neste contexto de medição, mas o texto hebraico aqui diz “canas”.
    reason: alternative_reading
lexical_decisions:
- source_word: סָבַב
  choice: Ele se virou
  rationale: O verbo pode significar virar-se ou contornar. Na sequência das medições, indica a mudança para o lado seguinte, sem exigir a ideia de uma volta completa.
- source_word: אֶל רוּחַ הַיָּם
  choice: para o lado oeste
  rationale: A expressão significa literalmente “para a direção do mar”; no uso geográfico hebraico, o mar indica o oeste. “Lado oeste” comunica naturalmente a direção no contexto arquitetônico.
- source_word: מָדַד
  choice: mediu
  rationale: Equivalente direto e natural no contexto de levantamento das dimensões.
- source_word: חֲמֵשׁ מֵאוֹת קָנִים
  choice: quinhentas canas
  rationale: O texto massorético traz “quinhentas canas”. O feminino de “quinhentas” concorda com “canas” em português.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: com a cana de medir
  rationale: A preposição tem valor instrumental e identifica a cana usada como padrão de medição.
