  text: 'He measured the east side with the measuring reed: five hundred reeds by the measuring reed[a], all around.'
translation:
  language: pt
  text: 'Ele mediu o lado leste com a vara de medir: quinhentas varas, com a vara de medir[a], ao redor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “cinco côvados, varas”. Pelo contexto, entende-se geralmente “quinhentas varas”, em harmonia com as medidas dos versículos 16–19. Alguns manuscritos e versões antigas apresentam isso de modo mais explícito.'
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  choice: Ele mediu
  rationale: O qal perfeito, terceira pessoa masculina singular, introduz de modo direto a ação narrativa de medir.
- source_word: רוּחַ הַקָּדִים
  choice: o lado leste
  rationale: No contexto de uma descrição arquitetônica, רוּחַ com um termo direcional indica um lado ou direção, não o vento.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: com a vara de medir
  rationale: A preposição ב tem valor instrumental; esta formulação é natural e precisa em português.
- source_word: חֲמֵשׁ אמות קָנִים
  choice: quinhentas varas
  rationale: Embora o texto massorético traga literalmente uma expressão difícil, “cinco côvados, varas”, o contexto imediato e a fórmula repetida nos versículos 16–19 sustentam a leitura contextual “quinhentas varas”; a dificuldade textual é preservada em nota.
- source_word: סָבִיב
  choice: ao redor
  rationale: O advérbio indica o circuito ou perímetro medido e é expresso de maneira clara e corrente.
