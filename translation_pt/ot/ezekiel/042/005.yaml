  text: וְ/הַ/לְּשָׁכ֥וֹת הָ/עֶלְיוֹנֹ֖ת קְצֻר֑וֹת כִּֽי יוֹכְל֨וּ אַתִּיקִ֜ים מֵ/הֵ֗נָה מֵֽ/הַ/תַּחְתֹּנ֛וֹת וּ/מֵ/הַ/תִּֽכֹנ֖וֹת בִּנְיָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/005.yaml
  text: And the upper chambers were narrower[a], because the galleries took away from them, more than from the lower and the middle parts of the building.
translation:
  language: pt
  text: As câmaras superiores eram mais estreitas[a], porque as galerias ocupavam mais espaço nelas do que nas câmaras inferiores e nas intermediárias do edifício.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eram mais curtas”. O termo hebraico traduzido por “galerias” (אַטִּיקִים) é raro, e sua referência arquitetônica exata é incerta; também pode indicar terraços, colunatas ou saliências.'
    reason: Preserva tanto a possível acepção de קְצֻרוֹת quanto a incerteza lexical do raro termo arquitetônico אַתִּיקִים.
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: as câmaras
  rationale: Em contextos de templo e edifícios, לִשְׁכָּה designa salas ou aposentos laterais; “câmaras” mantém a precisão arquitetônica e a dignidade do registro.
- source_word: הָעֶלְיוֹנוֹת
  choice: superiores
  rationale: Indica o nível de cima, em contraste explícito com os níveis inferior e intermediário.
- source_word: קְצֻרוֹת
  choice: eram mais estreitas
  rationale: Embora a raiz possa significar “curtas”, o contexto arquitetônico e a explicação seguinte apontam para uma redução do espaço ou da largura.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a causa da menor dimensão das câmaras superiores.
- source_word: יוֹכְלוּ
  choice: ocupavam mais espaço
  rationale: Forma da raiz אכל, literalmente “comer/consumir”, empregada metaforicamente para indicar que um elemento arquitetônico reduzia o espaço disponível.
- source_word: אַתִּיקִים
  choice: as galerias
  rationale: Termo arquitetônico raro e incerto; “galerias” é uma tradução convencional e inteligível, sem ocultar em nota as alternativas possíveis.
- source_word: מֵהֵנָּה
  choice: nelas
  rationale: Retoma naturalmente as câmaras superiores como aquelas cujo espaço era reduzido.
- source_word: מֵהַתַּחְתֹּנוֹת
  choice: do que nas câmaras inferiores
  rationale: Explicita em português a comparação implícita e recupera o substantivo elíptico “câmaras”.
- source_word: וּמֵהַתִּיכֹנוֹת
  choice: e nas intermediárias
  rationale: Refere-se ao nível médio das câmaras; “intermediárias” distingue claramente os três níveis.
- source_word: בִּנְיָן
  choice: do edifício
  rationale: Designa a construção como um todo; “edifício” é claro e adequado ao contexto arquitetônico.
