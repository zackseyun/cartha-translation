  text: בְּ/בֹאָ֣/ם הַ/כֹּהֲנִ֗ים וְ/לֹֽא יֵצְא֤וּ מֵ/הַ/קֹּ֨דֶשׁ֙ אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָ֔ה וְ/שָׁ֞ם יַנִּ֧יחוּ בִגְדֵי/הֶ֛ם אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ן כִּֽי קֹ֣דֶשׁ הֵ֑נָּה ילבשו בְּגָדִ֣ים אֲחֵרִ֔ים וְ/קָרְב֖וּ אֶל אֲשֶׁ֥ר לָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/014.yaml
  text: When the priests enter[a], they shall not go out from the holy place into the outer court, but there they shall leave their garments in which they minister, for they are holy. They shall put on other garments, and then approach what belongs to the people.
translation:
  language: pt
  text: Quando os sacerdotes entrarem, não sairão do lugar santo para o pátio externo. Ali deixarão as roupas com que ministram, pois elas são santas. Vestirão outras roupas e se aproximarão do que é destinado ao povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “daquilo que pertence ao povo”. A expressão hebraica é elíptica e pode se referir à área acessível ao povo.'
    reason: Leitura alternativa e preservação da ambiguidade do referente.
lexical_decisions:
- source_word: בְּבֹאָם הַכֹּהֲנִים
  choice: Quando os sacerdotes entrarem
  rationale: A preposição בְּ com o infinitivo construto e sufixo introduz uma oração temporal. O futuro do subjuntivo é natural em português para uma ação futura ou recorrente condicionada pelo tempo.
- source_word: וְלֹא יֵצְאוּ
  choice: não sairão
  rationale: O imperfeito assume força normativa neste contexto de instruções sobre o templo; o futuro mantém o tom diretivo sem tornar a formulação excessivamente explicativa.
- source_word: מֵהַקֹּדֶשׁ אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: do lugar santo para o pátio externo
  rationale: Preserva o contraste espacial entre a área sagrada e o pátio exterior. “Lugar santo” traduz קֹדֶשׁ sem identificar de modo mais específico uma área que o texto não nomeia.
- source_word: וְשָׁם יַנִּיחוּ בִגְדֵיהֶם
  choice: Ali deixarão as roupas
  rationale: יַנִּיחוּ pode significar pôr ou deixar; no contexto da troca de vestes, “deixarão” é claro e natural. “Roupas” é corrente e não introduz terminologia eclesiástica posterior.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶן
  choice: com que ministram
  rationale: שׁרת designa serviço sacerdotal neste contexto. “Ministram” preserva essa dimensão cultual, e “com que” expressa de modo idiomático o uso das roupas.
- source_word: כִּי קֹדֶשׁ הֵנָּה
  choice: pois elas são santas
  rationale: O pronome feminino plural retoma as roupas. O pronome explícito em português elimina uma possível referência equivocada aos sacerdotes sem acrescentar conteúdo.
- source_word: יִלְבְּשׁוּ בְּגָדִים אֲחֵרִים
  choice: Vestirão outras roupas
  rationale: Tradução direta e natural da exigência de trocar de roupa antes de passar à esfera do povo.
- source_word: וְקָרְבוּ אֶל אֲשֶׁר לָעָם
  choice: e se aproximarão do que é destinado ao povo
  rationale: A expressão hebraica é elíptica e não declara o substantivo implícito. Esta formulação preserva a indefinição, evitando inserir “área”, “lugar” ou “assuntos” no texto principal.
theological_decisions:
- issue: Santidade das roupas sacerdotais
  choice: As roupas usadas no ministério são explicitamente chamadas santas e, por isso, permanecem separadas da esfera acessível ao povo.
  alternative: Entender a instrução principalmente como uma simples regulamentação espacial das câmaras sacerdotais.
  rationale: A oração causal כִּי קֹדֶשׁ הֵנָּה atribui santidade às roupas e fundamenta a troca. A tradução mantém tanto a dimensão espacial quanto a santidade ritual, sem explicar além do texto.
- issue: Referente da expressão elíptica אֲשֶׁר לָעָם
  choice: 'Manter a expressão indefinida: “do que é destinado ao povo”.'
  alternative: Explicitar “a área destinada ao povo” ou traduzir “o que pertence ao povo”.
  rationale: O hebraico omite o substantivo. O contexto provavelmente aponta para uma área acessível ao povo, mas a tradução principal não deve converter essa probabilidade em certeza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “pátio externo” e “roupas” como termos correntes, preservando “ministram” para o serviço sacerdotal. O marcador [a] foi colocado junto à expressão a que a nota efetivamente se refere.
