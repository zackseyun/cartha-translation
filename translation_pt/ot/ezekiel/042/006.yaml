base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/006.yaml
  text: For they were in three stories[a], and they had no pillars like the pillars of the courts; therefore the upper stories receded more than the lower and middle ones from the ground.
translation:
  language: pt
  text: Pois eram de três andares e não tinham colunas como as colunas dos pátios; por isso, os andares superiores ficavam mais recuados[a] em relação ao chão do que os inferiores e os intermediários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eram recuados” ou “eram reduzidos”; o verbo hebraico é raro neste trecho, e a nuance arquitetônica exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da característica arquitetônica descrita no contexto anterior.
- source_word: מְשֻׁלָּשׁוֹת
  choice: tinham três andares
  rationale: No contexto arquitetônico, descreve uma estrutura disposta em três níveis; a nota preserva a incerteza ligada ao verbo hebraico raro.
- source_word: וְאֵין לָהֶן עַמּוּדִים
  choice: e não tinham colunas
  rationale: A construção existencial com ל expressa posse; “colunas” é claro e natural neste contexto arquitetônico.
- source_word: כְּעַמּוּדֵי הַחֲצֵרוֹת
  choice: como as colunas dos pátios
  rationale: Mantém explícita a comparação com os elementos de sustentação dos pátios do templo.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Expressa de modo natural a consequência da ausência de colunas.
- source_word: נֶאֱצַל
  choice: recuavam
  rationale: No difícil contexto arquitetônico, comunica o provável sentido espacial de retração, sem tornar a formulação excessivamente técnica.
- source_word: מֵהַתַּחְתּוֹנוֹת וּמֵהַתִּיכֹנוֹת
  choice: mais que os inferiores e os intermediários
  rationale: Os plurais femininos remetem aos níveis ou andares, e a construção indica comparação entre eles.
- source_word: מֵהָאָרֶץ
  choice: a partir do chão
  rationale: Neste contexto de construção, “chão” comunica o ponto físico de referência melhor que “terra”.
