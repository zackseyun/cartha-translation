  source_fidelity: 'A tradução preserva os elementos centrais do hebraico: o muro exterior, as salas, o pátio externo e a medida de cinquenta côvados. Contudo, «do lado do pátio externo» enfraquece o valor direcional/espacial de דֶּרֶךְ, melhor expresso por «na direção do pátio externo». «Paralelo às» é possível, mas torna a disposição excessivamente geométrica onde לְעֻמַּת conserva margem para «ao lado de», «correspondente a» ou «em frente a».'
