  text: And the wall that was outside[a], alongside the chambers, toward the outer court, in front of the chambers—its length was fifty cubits.
translation:
  language: pt
  text: O muro que ficava do lado de fora, ao lado das salas, na direção do pátio externo e em frente às salas, tinha cinquenta côvados de comprimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָדֵר
  choice: muro
  rationale: No contexto arquitetônico do complexo do templo, designa uma estrutura delimitadora; “muro” é mais natural e sólido do que “cerca”.
- source_word: לַחוּץ
  choice: do lado de fora
  rationale: Expressa de modo corrente a localização exterior do muro em relação às salas.
- source_word: לְעֻמַּת
  choice: paralelo às
  rationale: O termo indica correspondência ou posição face a face. Neste contexto de alinhamento e medidas arquitetônicas, “paralelo às” comunica melhor a disposição espacial, sem ocultar a alternativa na nota.
- source_word: לְּשָׁכוֹת
  choice: salas
  rationale: Refere-se a aposentos específicos do complexo do templo. “Salas” é claro para leitores modernos e preserva o sentido arquitetônico sem o tom antiquado de “câmaras”.
- source_word: דֶּרֶךְ הֶחָצֵר הַחִיצוֹנָה
  choice: do lado do pátio externo
  rationale: Neste enunciado espacial, דֶּרֶךְ situa o muro na direção ou no lado do pátio externo; a formulação escolhida é natural e adequada à planta arquitetônica.
- source_word: אֶל־פְּנֵי
  choice: diante das
  rationale: A expressão indica posição em frente ou diante das salas.
- source_word: אָרְכּוֹ
  choice: tinha ... de comprimento
  rationale: O sufixo retoma o muro; a construção portuguesa expressa a medida de forma natural.
- source_word: חֲמִשִּׁים אַמָּה
  choice: cinquenta côvados
  rationale: Mantém a antiga unidade de medida do texto-fonte, em vez de introduzir uma conversão aproximada no texto principal.
