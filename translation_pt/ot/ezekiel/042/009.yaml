  yaml_path: translation/ot/ezekiel/042/009.yaml
  text: And below these chambers was the entrance from the east[a], as one enters them from the outer court.
translation:
  language: pt
  text: E abaixo destas câmaras ficava a entrada do leste[a], ao se entrar nelas a partir do pátio externo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “do leste”. A expressão pode indicar tanto a localização da entrada no lado leste quanto o acesso vindo do leste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתַּחְתֶּה
  choice: E por baixo
  rationale: Expressa a relação espacial com a estrutura descrita anteriormente, sem acrescentar detalhes arquitetônicos não presentes no hebraico.
- source_word: לְשָׁכוֹת הָאֵלֶּה
  choice: destas câmaras
  rationale: Em contexto de edifícios do templo, לְשָׁכוֹת designa câmaras ou salas; “câmaras” preserva o tom arquitetônico e cultual.
- source_word: הַמָּבוֹא
  choice: a entrada
  rationale: O substantivo indica o lugar ou acesso de entrada; “entrada” é claro e natural em português.
- source_word: מֵהַקָּדִים
  choice: pelo leste
  rationale: Mantém a noção de procedência ou acesso associada à preposição מִן, sem decidir rigidamente se a frase indica a localização oriental da entrada ou a aproximação desde o leste.
- source_word: בְּבֹאוֹ לָהֵנָּה
  choice: quando se entrava nelas
  rationale: A construção é vertida de modo impessoal e natural, e o pronome feminino plural é relacionado às câmaras.
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  choice: vindo do pátio externo
  rationale: “Pátio externo” é terminologia clara para a área exterior do complexo; “vindo de” preserva a origem indicada por מִן.
