base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/003.yaml
  text: Opposite the twenty cubits that belonged to the inner court[a], and opposite the pavement that belonged to the outer court[b], gallery faced gallery in the third story.
translation:
  language: pt
  text: Em frente aos vinte côvados que pertenciam ao pátio interno e ao pavimento que pertencia ao pátio externo, havia uma galeria[a] em frente a outra, em três níveis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e seu sentido arquitetônico exato é incerto; também pode indicar uma colunata, um pórtico ou outra estrutura semelhante.
    reason: lexical_alternative
  - marker: b
    text: Ou “em três andares” ou “em três fileiras”. O hebraico provavelmente descreve uma disposição arquitetônica em três níveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגֶד
  choice: diante de
  rationale: Expressa a posição de uma estrutura em frente ou do outro lado de outra, de modo natural na descrição arquitetônica.
- source_word: הָעֶשְׂרִים
  choice: os vinte côvados
  rationale: O hebraico traz literalmente “os vinte”; a unidade “côvados” é recuperada do contexto das medidas do complexo e evita uma formulação obscura em português.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: que pertenciam ao pátio interno
  rationale: O לְ indica aqui a relação entre a faixa medida e o pátio interno; “pertenciam” comunica essa associação sem sugerir necessariamente localização dentro do pátio.
- source_word: רִצְפָה
  choice: pavimento
  rationale: Designa a superfície pavimentada do pátio; “pavimento” é concreto e adequado ao registro arquitetônico.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: que pertencia ao pátio externo
  rationale: Mantém a relação associativa expressa por לְ e a simetria com a referência anterior ao pátio interno.
- source_word: אַתִּיק
  choice: galeria
  rationale: É um termo arquitetônico raro e de sentido incerto. “Galeria” se ajusta a uma estrutura longitudinal elevada e permite reproduzir a relação recíproca da frase, sem ocultar outras possibilidades em nota.
- source_word: אֶל־פְּנֵי
  choice: ficava de frente para
  rationale: Traduz de maneira idiomática a orientação espacial de uma galeria em relação à outra.
- source_word: בַּשְּׁלִשִׁים
  choice: no terceiro andar
  rationale: No contexto, o ordinal provavelmente indica o terceiro nível do edifício; “andar” torna a referência arquitetônica clara em português atual.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com terminologia arquitetônica acessível. A frase conserva o paralelismo espacial do hebraico. Os marcadores foram colocados junto aos termos que efetivamente explicam: [a] após “galeria” e [b] após “terceiro andar”.'
