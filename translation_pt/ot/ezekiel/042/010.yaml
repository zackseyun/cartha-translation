    reason: cultural_note
lexical_decisions:
- source_word: בְּרֹחַב
  choice: ao longo da largura
  rationale: Preserva a noção espacial de extensão em relação à largura, sem tornar mais precisa uma construção hebraica arquitetonicamente condensada.
- source_word: גֶּדֶר הֶחָצֵר
  choice: o muro do pátio
  rationale: גֶּדֶר designa muro, cerca ou barreira de delimitação; no contexto arquitetônico do templo, “muro” é claro e natural.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: na direção do leste
  rationale: דֶּרֶךְ com um ponto cardeal pode indicar direção ou lado; esta opção conserva o valor direcional sem especificar além do hebraico.
- source_word: אֶל פְּנֵי
  choice: de frente para
  rationale: Na descrição arquitetônica, a expressão repetida indica orientação diante de algo; em português, a segunda ocorrência pode ser coordenada sem repetir toda a locução.
- source_word: הַגִּזְרָה
  choice: a área separada
  rationale: O termo técnico גִּזְרָה indica uma seção distinta e apartada no complexo visionário de Ezequiel; a tradução evita jargão desnecessário.
- source_word: הַבִּנְיָן
  choice: o edifício
  rationale: Tradução direta e contextual de בִּנְיָן em uma passagem arquitetônica.
- source_word: לְשָׁכוֹת
  choice: havia câmaras
  rationale: O hebraico é elíptico e não traz verbo expresso; “havia” completa naturalmente a oração, e “câmaras” conserva o registro arquitetônico e cultual.
