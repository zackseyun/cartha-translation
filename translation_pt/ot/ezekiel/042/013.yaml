  text: וַ/יֹּ֣אמֶר אֵלַ֗/י לִֽשְׁכ֨וֹת הַ/צָּפ֜וֹן לִֽשְׁכ֣וֹת הַ/דָּרוֹם֮ אֲשֶׁ֣ר אֶל פְּנֵ֣י הַ/גִּזְרָה֒ הֵ֣נָּה לִֽשְׁכ֣וֹת הַ/קֹּ֗דֶשׁ אֲשֶׁ֨ר יֹאכְלוּ שָׁ֧ם הַ/כֹּהֲנִ֛ים אֲשֶׁר קְרוֹבִ֥ים לַֽ/יהוָ֖ה קָדְשֵׁ֣י הַ/קֳּדָשִׁ֑ים שָׁ֞ם יַנִּ֣יחוּ קָדְשֵׁ֣י הַ/קֳּדָשִׁ֗ים וְ/הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם כִּ֥י הַ/מָּק֖וֹם קָדֹֽשׁ־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/013.yaml
  text: Then he said to me[a], “The north chambers, the south chambers, which are opposite the separate area—they are the holy chambers, where the priests who draw near to Yahweh shall eat the most holy things. There they shall place the most holy things, the grain offering, the sin offering, and the guilt offering[d][c][b], for the place is holy.”
translation:
  language: pt
  text: 'Então ele me disse: “As câmaras do norte e as câmaras do sul, que ficam em frente da área separada[a], são as câmaras sagradas onde os sacerdotes que se aproximam de Yahweh comerão as coisas santíssimas[b]. Ali eles colocarão as coisas santíssimas: a oferta de cereais, a oferta pelo pecado[c] e a oferta pela culpa[d], pois o lugar é santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que ficam diante da área separada”. A expressão hebraica indica que essas câmaras estavam situadas em frente da seção separada ou restrita do complexo do templo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “as coisas santíssimas”. Aqui, a expressão se refere às ofertas do mais alto grau de santidade, não ao recinto interior chamado Santo dos Santos.'
    reason: lexical_alternative
  - marker: c
    text: Ou “oferta de purificação”.
    reason: alternative_reading
  - marker: d
    text: Ou “oferta de reparação”.
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁכוֹת
  choice: câmaras
  rationale: No contexto arquitetônico da visão do templo, designa recintos construídos destinados ao serviço sacerdotal; “câmaras” preserva esse caráter arquitetônico e cultual.
- source_word: הַצָּפוֹן / הַדָּרוֹם
  choice: as câmaras do norte e as câmaras do sul
  rationale: Mantém as designações espaciais do hebraico de modo claro e natural em português.
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: diante da área separada
  rationale: אֶל־פְּנֵי expressa orientação espacial, enquanto הַגִּזְרָה designa a área separada ou restrita do complexo; a formulação preserva a localização sem defini-la indevidamente como pátio.
- source_word: לִשְׁכוֹת הַקֹּדֶשׁ
  choice: as câmaras sagradas
  rationale: Identifica os recintos como consagrados ao serviço do templo. “Sagradas” soa natural para espaços em português e mantém a ideia de santidade.
- source_word: קְרוֹבִים לַיהוָה
  choice: que se aproximam de Yahweh
  rationale: Expressa o acesso sacerdotal e cultual a Yahweh, e não apenas proximidade física.
- source_word: יֹאכְלוּ שָׁם
  choice: comerão ... onde
  rationale: O imperfeito tem sentido futuro na instrução visionária; a oração relativa com “onde” produz uma construção natural sem perder a indicação de lugar.
- source_word: קָדְשֵׁי הַקֳּדָשִׁים
  choice: as coisas santíssimas
  rationale: A expressão indica ofertas ou porções pertencentes ao grau máximo de santidade, como confirma a lista seguinte, e não o recinto chamado Santo dos Santos.
- source_word: יַנִּיחוּ
  choice: colocarão
  rationale: O hifil de נוח significa pôr ou depositar em lugar determinado; “colocarão” é claro e adequado ao contexto.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto sacrificial sacerdotal, מִנְחָה designa especificamente a oferta feita de cereal.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: É a designação tradicional e compreensível dessa categoria sacrificial, preservando-se em nota a alternativa que destaca sua função purificadora.
- source_word: הָאָשָׁם
  choice: a oferta pela culpa
  rationale: É uma tradução reconhecível da categoria sacrificial אָשָׁם; a alternativa “oferta de reparação” é registrada em nota.
- source_word: כִּי הַמָּקוֹם קָדֹשׁ
  choice: pois o lugar é santo
  rationale: “Pois” conserva a relação explicativa ou causal de כִּי e combina com o registro digno do texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” representa o nome próprio e evita substituí-lo por um título.
- issue: Sentido de קָדְשֵׁי הַקֳּדָשִׁים
  choice: as coisas santíssimas
  alternative: as ofertas santíssimas; as coisas do Santo dos Santos
  rationale: Aqui a expressão se refere a itens sacrificiais do mais alto grau de santidade, não ao recinto interior; a enumeração das ofertas esclarece o referente sem eliminar a forma abrangente do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o tom regulamentar da visão sem recorrer a formas excessivamente arcaicas. Todos os marcadores de nota aparecem no texto em ordem alfabética.
