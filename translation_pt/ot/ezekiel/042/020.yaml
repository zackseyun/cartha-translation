  text: לְ/אַרְבַּ֨ע רוּח֜וֹת מְדָד֗/וֹ ח֤וֹמָה ל/וֹ֙ סָבִ֣יב סָבִ֔יב אֹ֚רֶךְ חֲמֵ֣שׁ מֵא֔וֹת וְ/רֹ֖חַב חֲמֵ֣שׁ מֵא֑וֹת לְ/הַבְדִּ֕יל בֵּ֥ין הַ/קֹּ֖דֶשׁ לְ/חֹֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/020.yaml
  text: He measured it on the four sides[a]; it had a wall all around, five hundred cubits long and five hundred cubits wide[b], to make a separation between the holy and the common.
translation:
  language: pt
  text: 'Ele o mediu nos quatro lados[a]. Havia um muro ao seu redor, por todos os lados: quinhentos de comprimento e quinhentos de largura[b], para separar o santo do comum[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas quatro direções”; literalmente, “aos quatro ventos”.
    reason: lexical_alternative
  - marker: b
    text: A unidade de medida não é expressa neste versículo; o contexto menciona uma vara de medir.
    reason: textual_clarity
  - marker: c
    text: Ou “do profano”. Aqui, “comum” significa aquilo que não foi separado como santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: nos quatro lados
  rationale: רוּחוֹת significa literalmente “ventos” e, por extensão, “direções”. No contexto arquitetônico, a expressão indica os quatro lados ou direções; “nos quatro lados” é natural e mantém o sentido espacial.
- source_word: מְדָדוֹ
  choice: Ele o mediu
  rationale: O verbo está no qal perfeito, terceira pessoa masculina singular, com sufixo pronominal masculino singular. “Ele o mediu” conserva a construção e deixa o referente tão dependente do contexto quanto no hebraico.
- source_word: חוֹמָה לוֹ סָבִיב סָבִיב
  choice: Havia um muro ao redor de todo o conjunto
  rationale: A repetição de סָבִיב enfatiza que o muro circundava inteiramente a área. A formulação portuguesa transmite essa abrangência sem repetição artificial.
- source_word: אֹרֶךְ חֲמֵשׁ מֵאוֹת וְרֹחַב חֲמֵשׁ מֵאוֹת
  choice: quinhentos de comprimento e quinhentos de largura
  rationale: O hebraico fornece os números, mas não repete nem explicita aqui a unidade de medida. A tradução evita inserir “côvados”, especialmente porque o contexto imediato menciona uma vara de medir.
- source_word: לְהַבְדִּיל
  choice: para separar
  rationale: O infinitivo expressa a finalidade do muro. “Para separar” é direto, natural e semanticamente equivalente.
- source_word: בֵּין הַקֹּדֶשׁ לְחֹל
  choice: separar o santo do comum
  rationale: חֹל designa aquilo que não foi separado como santo, sem necessariamente implicar impiedade ou corrupção moral. “Comum” preserva com precisão o contraste cultual.
theological_decisions:
- issue: Contraste cultual entre קֹדֶשׁ e חֹל
  choice: o santo e o comum
  alternative: o santo e o profano
  rationale: O contexto distingue espaço consagrado de espaço não consagrado. “Comum” evita atribuir ao segundo termo uma conotação necessária de irreverência ou maldade que o hebraico não exige.
- issue: Unidade das dimensões
  choice: Não acrescentar uma unidade no texto principal
  alternative: quinhentos côvados de comprimento e quinhentos côvados de largura
  rationale: A unidade não está expressa neste versículo. Acrescentar “côvados” resolveria indevidamente uma questão contextual e textual; a nota informa a omissão sem impor uma identificação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. A redação conserva o referente pronominal do hebraico, evita inserir uma unidade ausente e mantém o contraste ritual entre o santo e o não consagrado.
