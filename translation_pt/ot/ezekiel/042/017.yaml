lexical_decisions:
- source_word: מָדַד
  choice: Ele mediu
  rationale: O qal perfeito, terceira pessoa masculina singular, dá continuidade à sequência narrativa da medição.
- source_word: רוּחַ הַצָּפוֹן
  choice: o lado norte
  rationale: Embora רוּחַ também possa significar “vento” ou “direção”, no contexto arquitetônico indica o lado norte do complexo.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: quinhentas
  rationale: Reproduz diretamente o numeral cardinal hebraico, com concordância natural com “canas”.
- source_word: קָנִים
  choice: canas
  rationale: O texto massorético traz o plural de קָנֶה, “cana”; aqui funciona como unidade baseada na cana de medir. A nota registra a variante “côvados”.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: com a cana de medir
  rationale: O bet instrumental expressa o instrumento ou padrão empregado na medição; esta formulação é clara e natural em português.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa de modo conciso a ideia adverbial de uma medição em torno do perímetro.
