base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/001.yaml
  text: Then he brought me out into the outer court by the way toward the north[b][a], and he brought me to the chamber that was opposite the separate area and opposite the building to the north.
translation:
  language: pt
  text: Então ele me levou para fora, ao pátio externo, pelo caminho que dá para o norte[a], e me levou à câmara que ficava em frente à área separada[b] e em frente ao edifício, ao norte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o caminho, caminho do norte”, expressão direcional idiomática.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o lugar separado”. O termo hebraico designa uma área distinta ou posta à parte na visão do templo de Ezequiel.'
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica final também pode ser entendida como indicação de direção, “em direção ao norte”; sua ligação exata com os elementos arquitetônicos mencionados não é totalmente explícita.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: Então ele me levou para fora
  rationale: O hifil de יצא indica fazer alguém sair. “Levou para fora” é natural em português, e “Então” expressa a progressão narrativa do waw consecutivo.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: ao pátio externo
  rationale: חָצֵר designa um pátio ou átrio; “pátio externo” é claro e adequado à descrição arquitetônica da visão.
- source_word: הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן
  choice: pelo caminho que dá para o norte
  rationale: A repetição de דֶּרֶךְ forma uma expressão direcional. A tradução mantém a ideia de percurso sem reproduzir uma repetição pouco natural em português.
- source_word: וַיְבִאֵנִי
  choice: e me levou à
  rationale: O hifil de בוא pode significar “trazer” ou “levar”. Como o narrador acompanha o guia em seu deslocamento, “levou” é idiomático e não especifica indevidamente a entrada no interior da câmara.
- source_word: הַלִּשְׁכָּה
  choice: à câmara
  rationale: לִשְׁכָּה designa uma sala ou câmara associada a um complexo cultual. “Câmara” conserva o registro arquitetônico e o singular do texto massorético.
- source_word: נֶגֶד
  choice: em frente a
  rationale: Neste contexto, נֶגֶד indica relação espacial de posição fronteira. “Em frente a” é natural e pode abranger as nuances de “diante de” e “defronte de” sem exigir oposição estritamente simétrica.
- source_word: הַגִּזְרָה
  choice: a área separada
  rationale: גִּזְרָה refere-se, na visão do templo, a uma área distinta ou apartada. A expressão escolhida comunica essa separação sem impor uma função técnica não explicitada.
- source_word: הַבִּנְיָן
  choice: o edifício
  rationale: בִּנְיָן é um termo geral para uma construção ou edifício; “edifício” se ajusta ao contexto arquitetônico.
- source_word: אֶל הַצָּפוֹן
  choice: ao norte
  rationale: A expressão final indica direção ou localização setentrional. “Ao norte” mantém a concisão do hebraico e evita fixar de modo absoluto a que elemento arquitetônico a frase se liga.
