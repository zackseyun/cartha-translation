base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/011.yaml
  text: And before them was a passage[a], like the appearance of the chambers that faced north; as was their length, so was their width, and all their exits, their arrangements[b], and their entrances were alike.
translation:
  language: pt
  text: Diante delas havia uma passagem[a], semelhante, em sua aparência, às câmaras que ficavam do lado norte. O comprimento e a largura delas eram os mesmos que os das câmaras do lado norte; todas as suas saídas, suas disposições[b] e suas entradas correspondiam às delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante delas havia um caminho correspondente à aparência das câmaras do lado norte”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “normas”, “prescrições” ou “modo estabelecido”; aqui provavelmente se refere à configuração ou ao projeto prescrito das câmaras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֶרֶךְ
  choice: havia uma passagem
  rationale: דֶּרֶךְ significa normalmente caminho ou via; no contexto arquitetônico, “passagem” expressa com clareza uma via de acesso construída.
- source_word: לִפְנֵיהֶם
  choice: diante delas
  rationale: A expressão indica posição espacial em frente às câmaras; o feminino explicita naturalmente o referente em português.
- source_word: כְּמַרְאֵה
  choice: semelhante, em sua aparência, a
  rationale: Preserva a referência à forma ou aparência visível sem reduzir a comparação a mera localização.
- source_word: הַלְּשָׁכוֹת
  choice: as câmaras
  rationale: Em contexto templário, “câmaras” é o termo arquitetônico tradicional e específico, embora “salas” também seja possível.
- source_word: אֲשֶׁר דֶּרֶךְ הַצָּפוֹן
  choice: que ficavam do lado norte
  rationale: A construção indica orientação ou localização ao norte. “Do lado norte” evita afirmar especificamente que as câmaras estavam voltadas para o norte.
- source_word: כְּאָרְכָּן כֵּן רָחְבָּן
  choice: tinham o mesmo comprimento e a mesma largura
  rationale: A construção correlativa indica que as dimensões deste conjunto correspondiam às das câmaras do norte; a formulação portuguesa torna essa comparação implícita clara e natural.
- source_word: וְכֹל מוֹצָאֵיהֶן
  choice: todas as suas saídas
  rationale: מוֹצָא designa lugar de saída ou acesso; “saídas” é direto e adequado à descrição arquitetônica.
- source_word: וּכְמִשְׁפְּטֵיהֶן
  choice: suas disposições
  rationale: Embora מִשְׁפָּט costume significar juízo, norma ou prescrição, aqui provavelmente designa a disposição prescrita ou configuração arquitetônica.
- source_word: וּכְפִתְחֵיהֶן
  choice: suas entradas
  rationale: פֶּתַח pode significar abertura, porta ou entrada; “entradas” se ajusta ao paralelismo arquitetônico com as saídas.
- source_word: comparação implícita nas orações finais
  choice: eram iguais
  rationale: O hebraico omite um verbo finito final; a expressão completa naturalmente a frase em português e comunica a correspondência entre os dois conjuntos.
