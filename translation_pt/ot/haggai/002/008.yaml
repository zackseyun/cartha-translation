  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לִ֥/י הַ/כֶּ֖סֶף וְ/לִ֣/י הַ/זָּהָ֑ב נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/008.yaml
  text: The silver is mine[a], and the gold is mine[b], declares Yahweh of Armies.
translation:
  language: pt
  text: A prata é minha, e o ouro é meu — declara Yahweh dos Exércitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, na forma tradicional: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: é minha / é meu
  rationale: 'A preposição לְ com o sufixo da primeira pessoa do singular expressa posse. Em português, a construção natural exige a cópula e concordância de gênero: “é minha” com “prata” e “é meu” com “ouro”.'
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף pode designar prata ou dinheiro; em paralelo com “ouro”, o sentido material “prata” é o mais provável e preserva a concretude da afirmação.
- source_word: וְלִי
  choice: e ... é meu
  rationale: A repetição do possessivo foi preservada, em vez de condensar a frase, para manter a ênfase hebraica na propriedade de ambos os metais.
- source_word: הַזָּהָב
  choice: o ouro
  rationale: Designa diretamente o metal precioso e forma o paralelo com “a prata”.
- source_word: נְאֻם
  choice: declara
  rationale: Na fórmula profética, introduz ou sela um pronunciamento divino solene. “Declara” é atual, claro e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Traduz o sentido concreto do plural צְבָאוֹת e comunica com clareza moderna o título de soberania e poder.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional “SENHOR”.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos / Yahweh dos exércitos celestiais
  rationale: “Dos Exércitos” preserva a amplitude do hebraico sem limitar explicitamente os exércitos aos celestiais. A forma tradicional com “SENHOR” é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem paralela e a repetição possessiva do hebraico foram mantidas; o travessão separa naturalmente a fórmula profética.
