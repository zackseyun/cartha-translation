  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שְׁאַל נָ֧א אֶת הַ/כֹּהֲנִ֛ים תּוֹרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/011.yaml
  text: 'Thus says Yahweh of hosts: Ask the priests for a ruling[a], saying,'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: «Consulte os sacerdotes sobre a instrução, dizendo:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva de modo natural e solene a fórmula profética hebraica, usando o presente convencional em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Mantém a amplitude do título divino e corresponde à formulação corrente e inteligível em português.
- source_word: שְׁאַל נָא
  choice: Consultem
  rationale: Expressa a ordem de pedir aos sacerdotes uma resposta autorizada; o plural é natural porque a fala se dirige aos ouvintes por meio do profeta. A partícula נָא suaviza a ordem, força absorvida pelo verbo escolhido.
- source_word: אֶת הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Representa diretamente o objeto definido e identifica os responsáveis pela instrução ritual.
- source_word: תּוֹרָה
  choice: para obter uma orientação
  rationale: No contexto, refere-se à instrução ou decisão sacerdotal sobre uma questão ritual, não necessariamente à Torá como corpus escrito.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz o conteúdo da consulta apresentado no versículo seguinte e preserva a ligação sintática do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o nome divino; a transliteração preserva a distinção entre o nome próprio e títulos divinos.
- issue: Sentido de תּוֹרָה neste contexto
  choice: orientação sacerdotal
  alternative: lei; Torá
  rationale: A pergunta casuística dos versículos seguintes favorece o sentido de instrução ou parecer ritual, sem negar a relação do termo com a lei divina.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula profética mantém dignidade, enquanto “consultem” e “orientação” comunicam naturalmente a função sacerdotal no contexto.
