review_pass:
  verdict: revise
  source_fidelity: A fórmula introdutória e o título divino estão bem representados, e a nota reconhece adequadamente o sentido contextual de torá. Contudo, שְׁאַל é imperativo singular, dirigido a Ageu; «Consultem» muda indevidamente o destinatário para o plural. «Para obter uma orientação» explicita de modo aceitável a finalidade, mas «sobre a instrução» reproduz mais diretamente a construção e conserva a amplitude de torá.
  naturalness: «Assim diz Yahweh dos Exércitos» é solene e natural. «Consulte os sacerdotes sobre a instrução, dizendo:» mantém um registro claro, moderno e apropriado, com imperativo singular de tratamento formal amplamente compreensível.
  terminology: «Yahweh» corresponde à decisão editorial para o Tetragrama. «Instrução» é uma tradução lexicalmente segura de torá neste contexto; a nota preserva as alternativas «decisão» e «lei» sem identificar o termo automaticamente com um livro.
  issues:
  - severity: medium
    issue: 'O imperativo foi vertido no plural: «Consultem».'
    rationale: O hebraico שְׁאַל é imperativo masculino singular. O comando é dirigido ao profeta, não a um grupo; a tradução deve preservar esse número.
  - severity: low
    issue: Há aspas de abertura sem fechamento no texto do versículo.
    rationale: O hebraico e o texto inglês apenas introduzem a fala que continua no versículo seguinte. Como a unidade termina com «dizendo:», não é necessário abrir aspas neste versículo isolado.
  revised_text: 'Assim diz Yahweh dos Exércitos: «Consulte os sacerdotes sobre a instrução, dizendo:»'
  revised_footnotes:
  - marker: a
    text: Ou «uma decisão»; também é possível traduzir «sobre a lei» ou «uma instrução». Aqui, o hebraico torá provavelmente se refere a uma orientação ou decisão legal-ritual dada pelos sacerdotes, não necessariamente à Torá como livro.
    reason: lexical_alternative
