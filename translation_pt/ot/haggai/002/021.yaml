  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱמֹ֕ר אֶל זְרֻבָּבֶ֥ל פַּֽחַת יְהוּדָ֖ה לֵ/אמֹ֑ר אֲנִ֣י מַרְעִ֔ישׁ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/021.yaml
  text: 'Speak to Zerubbabel[a], governor of Judah, saying: I am shaking the heavens and the earth.'
translation:
  language: pt
  text: 'Fale a Zorobabel, governador de Judá: “Eu estou fazendo tremer os céus e a terra.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou prestes a fazer tremer os céus e a terra” ou “farei tremer os céus e a terra”. O particípio hebraico pode indicar uma ação em curso, iminente ou futura.'
    reason: alternativa lexical e aspectual
lexical_decisions:
- source_word: אֱמֹר
  choice: Fale
  rationale: O imperativo de אמר ordena que o profeta transmita a mensagem; “Fale a” é natural em português e preserva a força da ordem.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: פַּחַת יְהוּדָה
  choice: governador de Judá
  rationale: פַּחַת designa o governante provincial sob administração imperial; “governador” é o equivalente moderno mais claro.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: O infinitivo quotativo hebraico introduz o conteúdo da fala; em português atual, os dois-pontos comunicam essa função com mais naturalidade do que “dizendo”.
- source_word: אֲנִי
  choice: Eu
  rationale: O pronome explícito é mantido para conservar a ênfase da declaração divina.
- source_word: מַרְעִישׁ
  choice: estou fazendo tremer
  rationale: O particípio hifil de רעשׁ expressa ação causativa em curso ou apresentada como iminente; esta formulação preserva o aspecto participial sem acrescentar explicitamente “prestes a”.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Mantém o plural hebraico e o alcance cósmico elevado da imagem.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No paralelismo com “os céus”, o sentido cósmico é preferível ao sentido local de “país” ou “terra de Judá”.
theological_decisions:
- issue: Alcance da imagem do abalo
  choice: linguagem cósmica que abrange os céus e a terra
  alternative: referência restrita à agitação política entre as nações
  rationale: A expressão hebraica tem alcance cósmico, embora os versículos seguintes a apliquem a acontecimentos históricos e políticos. A tradução não reduz a tensão entre essas dimensões.
- issue: Valor temporal do particípio מַרְעִישׁ
  choice: 'ação apresentada como em curso: “estou fazendo tremer”'
  alternative: 'futuro iminente ou simples: “estou prestes a fazer tremer” ou “farei tremer”'
  rationale: O particípio permite mais de uma leitura temporal no discurso profético. O texto principal conserva sua forma aspectual mais direta, e a nota registra as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção quotativa foi naturalizada por meio de dois-pontos, sem perda de conteúdo. A nota preserva a ambiguidade temporal genuína do particípio hebraico.
