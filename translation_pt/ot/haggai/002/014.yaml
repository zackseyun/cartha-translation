  text: וַ/יַּ֨עַן חַגַּ֜י וַ/יֹּ֗אמֶר כֵּ֣ן הָֽ/עָם הַ֠/זֶּה וְ/כֵן הַ/גּ֨וֹי הַ/זֶּ֤ה לְ/פָנַ/י֙ נְאֻם יְהוָ֔ה וְ/כֵ֖ן כָּל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וַ/אֲשֶׁ֥ר יַקְרִ֛יבוּ שָׁ֖ם טָמֵ֥א הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
translation:
  language: pt
  text: 'Então Ageu respondeu e disse: “Assim[a] é este povo[b], e assim é esta nação diante de mim”, declara Yahweh, “e assim é toda obra das mãos deles; e o que eles oferecem ali é impuro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tal é”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “este povo” é marcada e pode transmitir distanciamento ou reprovação.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: assim é
  rationale: A repetição de “assim é” conserva a força comparativa e demonstrativa da conclusão tirada da analogia sacerdotal dos versículos anteriores.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o coletivo singular e o tom marcado, potencialmente distanciador ou reprovador, da expressão hebraica.
- source_word: הַגּוֹי הַזֶּה
  choice: esta nação
  rationale: גּוֹי significa aqui a comunidade de Judá em sua identidade coletiva, não especificamente os gentios; “nação” preserva o paralelismo com “este povo”.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Expressão portuguesa natural que preserva a ideia de estar na presença e sob o juízo de Deus.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade a fórmula profética e mantém o nome divino expresso no hebraico.
- source_word: כָּל מַעֲשֵׂה יְדֵיהֶם
  choice: toda obra das mãos deles
  rationale: Conserva a imagem idiomática hebraica e evita a possível ambiguidade pronominal de “suas mãos”.
- source_word: וַאֲשֶׁר יַקְרִיבוּ
  choice: e o que eles oferecem
  rationale: No contexto sacrificial, o hifil de קרב indica apresentar ou oferecer; a formulação é clara sem acrescentar “no altar”, que não está explícito.
- source_word: שָׁם
  choice: ali
  rationale: Mantém a referência espacial do texto sem especificar indevidamente o lugar exato.
- source_word: טָמֵא הוּא
  choice: é impuro
  rationale: “Impuro” expressa o estado ritual em foco nos versículos anteriores e é corrente no vocabulário bíblico português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Referente de “esta nação”
  choice: Judá, isto é, a comunidade da aliança que retornou do exílio
  alternative: As nações estrangeiras ao redor
  rationale: No contexto, Ageu aplica à comunidade pós-exílica e às suas ofertas a lógica da impureza ritual. A tradução “nação” mantém essa referência sem introduzir “gentios”.
- issue: Âmbito da impureza
  choice: A impureza do povo alcança suas obras e ofertas
  alternative: Somente as ofertas cultuais são impuras
  rationale: A repetição de כֵּן liga “este povo”, “esta nação” e “toda obra das mãos deles”; a frase final destaca as ofertas sem limitar a declaração anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada de “assim é” reproduz a estrutura enfática do hebraico; “mãos deles” evita ambiguidade, e “ali” não explicita um altar que o texto apenas deixa implícito.
