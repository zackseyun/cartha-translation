base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/013.yaml
  text: Then Haggai said[a], “If one who is unclean by contact with a dead body touches any of these, does it become unclean?” And the priests answered and said, “It becomes unclean.”
translation:
  language: pt
  text: 'Então Ageu disse: “Se alguém que está impuro por contato com um cadáver[a] tocar em alguma destas coisas, ela ficará impura?” Os sacerdotes responderam: “Ficará impura.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “impuro por uma pessoa”, expressão que se refere à impureza ritual causada pelo contato com um cadáver.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência, e “disse” traduz diretamente o verbo.
- source_word: חַגַּי
  choice: Ageu
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome bíblico.
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente o caso hipotético apresentado aos sacerdotes.
- source_word: יִגַּע
  choice: tocar em
  rationale: Expressa contato físico e se ajusta ao contexto das leis de pureza ritual.
- source_word: טְמֵא נֶפֶשׁ
  choice: alguém que está impuro por ter tido contato com um morto
  rationale: 'Traduz o sentido idiomático da expressão no contexto sacerdotal: impureza ritual decorrente do contato com um cadáver, e não impureza abstrata da alma.'
- source_word: בְּכָל אֵלֶּה
  choice: qualquer uma destas coisas
  rationale: Retoma distributivamente os elementos mencionados no versículo anterior.
- source_word: הֲיִטְמָא
  choice: ela ficará impura?
  rationale: A forma verbal pergunta se a impureza será transmitida à coisa tocada; o futuro é natural em português dentro da condição.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ
  choice: Os sacerdotes responderam
  rationale: Reproduz naturalmente em português a fórmula hebraica redundante “responderam e disseram”, sem perda de conteúdo.
- source_word: יִטְמָא
  choice: Ficará impura
  rationale: Retoma de modo conciso a formulação da pergunta e comunica a transmissão da impureza ritual.
theological_decisions:
- issue: Natureza da impureza mencionada
  choice: Apresentar a expressão como impureza ritual causada pelo contato com um morto.
  alternative: Traduzir literalmente como “impuro de pessoa/alma”.
  rationale: No uso legal e sacerdotal da Torá, טְמֵא נֶפֶשׁ designa a impureza associada a um cadáver. A tradução funcional evita que o leitor entenda a frase como uma afirmação sobre culpa moral ou impureza interior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe preserva a forma de pergunta e resposta do texto hebraico, enquanto a fórmula narrativa redundante é vertida de modo natural.
