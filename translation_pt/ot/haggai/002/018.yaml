base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/018.yaml
  text: Set your heart on this from this day onward[a], from the twenty-fourth day of the ninth month, from the day when the temple of Yahweh was founded; consider it.
translation:
  language: pt
  text: Considerem atentamente, desde este dia em diante, desde o vigésimo quarto dia do nono mês, desde o dia em que foi lançado o alicerce do templo de Yahweh; considerem atentamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: Ponham o coração nisto
  rationale: Preserva a imagem do idioma hebraico — literalmente, pôr o coração — como exortação a dedicar atenção cuidadosa. O pronome “nisto” explicita em português o referente fornecido pelo contexto. נָא reforça o apelo, mas não é vertido como “agora”, pois aqui não funciona como advérbio temporal.
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: desde este dia em diante
  rationale: Expressa de modo natural o ponto temporal de partida e a orientação para a frente indicados pela locução hebraica.
- source_word: מִיּוֹם עֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי
  choice: desde o vigésimo quarto dia do nono mês
  rationale: Torna explícitos “dia” e “mês”, elípticos mas inequívocos na fórmula hebraica de datação.
- source_word: לְמִן הַיּוֹם
  choice: desde o dia
  rationale: Mantém a retomada enfática do ponto temporal introduzido pelas expressões anteriores.
- source_word: אֲשֶׁר יֻסַּד
  choice: em que ... foi fundado
  rationale: Reproduz o passivo de יסד e seu sentido básico de estabelecer ou fundar, mantendo em nota a formulação arquitetônica igualmente possível.
- source_word: הֵיכַל יְהוָה
  choice: o templo de Yahweh
  rationale: הֵיכַל designa aqui o edifício do templo; o nome divino יהוה é transliterado como “Yahweh”.
- source_word: שִׂימוּ לְבַבְכֶם
  choice: ponham o coração nisso
  rationale: Conserva a repetição enfática do imperativo e a imagem hebraica, com “nisso” retomando naturalmente em português todo o conteúdo precedente.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre coração e consideração atenta
  choice: manter a imagem “pôr o coração”
  alternative: considerem atentamente
  rationale: A expressão hebraica envolve atenção deliberada, mas sua imagem não deve ser reduzida silenciosamente a uma operação apenas intelectual. A formulação portuguesa preserva tanto a imagem quanto a força exortativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição e a metáfora hebraica do coração foram mantidas de propósito; evitou-se acrescentar “agora”, que poderia sugerir um valor temporal ausente do texto.
