  revision_rationale: A revisão substitui um calque pouco natural do idioma hebraico por uma expressão portuguesa corrente que preserva sua função de convocar à atenção cuidadosa e mantém a repetição final. Também traz para o texto principal o sentido arquitetônico contextual de יסד, deixando a tradução mais literal «foi fundado» como alternativa em nota.
