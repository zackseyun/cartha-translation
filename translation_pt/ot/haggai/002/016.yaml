base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/016.yaml
  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
translation:
  language: pt
  text: Quando alguém chegava a um monte de vinte medidas, havia apenas dez; quando chegava à cuba do lagar para tirar cinquenta medidas[a], havia apenas vinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cinquenta purá”; purá é um termo de sentido exato incerto, provavelmente uma medida ou um recipiente para líquidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהְיוֹתָם
  choice: Quando alguém chegava
  rationale: A construção introduz a situação anterior descrita pelos exemplos seguintes. Em português, o valor temporal é expresso naturalmente por “quando”; não se acrescenta uma pergunta ausente do texto hebraico desta cláusula.
- source_word: בָּא
  choice: alguém chegava / chegava
  rationale: A forma singular tem sentido genérico. “Alguém” explicita esse sujeito indefinido, e sua omissão na segunda ocorrência evita repetição sem alterar o sentido.
- source_word: עֲרֵמַת עֶשְׂרִים
  choice: um monte de vinte medidas
  rationale: עֲרֵמָה é um monte de produto agrícola. Como a unidade não está expressa, “medidas” é uma complementação contextual que torna a quantidade compreensível sem alegar precisão indevida.
- source_word: וְהָיְתָה עֲשָׂרָה
  choice: havia apenas dez
  rationale: A formulação comunica com naturalidade a quantidade efetivamente encontrada e o contraste de escassez implícito.
- source_word: הַיֶּקֶב
  choice: o lagar
  rationale: No contexto da produção de vinho, יֶקֶב designa o reservatório ou instalação do lagar. “Lagar” é o termo português corrente e claro.
- source_word: לַחְשֹׂף
  choice: para tirar
  rationale: O infinitivo indica retirar líquido do lagar. “Tirar” é natural e não especifica um método não declarado.
- source_word: חֲמִשִּׁים פּוּרָה
  choice: cinquenta medidas[a]
  rationale: פּוּרָה é um termo raro ligado a medida ou recipiente para líquido, de valor exato incerto. “Medidas” preserva a função quantitativa no texto, e a nota registra a incerteza lexical.
- source_word: וְהָיְתָה עֶשְׂרִים
  choice: havia apenas vinte
  rationale: Mantém o paralelismo com a primeira quantidade e evidencia, sem exagero, a grande redução do rendimento esperado.
