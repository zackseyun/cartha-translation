  text: וְ/עַתָּה֙ שִֽׂימוּ נָ֣א לְבַבְ/כֶ֔ם מִן הַ/יּ֥וֹם הַ/זֶּ֖ה וָ/מָ֑עְלָ/ה מִ/טֶּ֧רֶם שֽׂוּם אֶ֛בֶן אֶל אֶ֖בֶן בְּ/הֵיכַ֥ל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/015.yaml
  text: 'And now[a], please set your heart on this from today onward: before one stone was placed upon another in the temple of Yahweh,'
translation:
  language: pt
  text: 'E agora, por favor, voltem o coração para isto[a], deste dia em diante: antes de se colocar pedra sobre pedra no templo de Yahweh,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: «considerem isto». O hebraico diz literalmente «voltem/ponham o coração».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que liga o versículo ao discurso anterior quanto o advérbio temporal que introduz a exortação imediata.
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: por favor, ponham o coração nisto
  rationale: Mantém a imagem hebraica de dirigir o coração a algo, enquanto «por favor» representa a partícula de apelo נָא. A expressão é deliberadamente mais concreta que a interpretação simples «considerem».
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: a partir deste dia
  rationale: Expressa o ponto temporal de referência sem definir em excesso a direção, que pode ser entendida em relação ao período subsequente ou, no contexto imediato, como um olhar retrospectivo para o tempo anterior.
- source_word: מִטֶּרֶם
  choice: antes que
  rationale: Introduz naturalmente em português a situação anterior ao início da colocação das pedras.
- source_word: שׂוּם אֶבֶן אֶל אֶבֶן
  choice: se colocasse pedra sobre pedra
  rationale: Reproduz de modo natural a imagem hebraica da construção, sem acrescentar um agente não expresso.
- source_word: בְּהֵיכַל
  choice: no templo
  rationale: Neste contexto, הֵיכָל designa o edifício do templo de Jerusalém, e não um palácio real.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal e evita substituí-lo por um título.
- issue: Direção temporal de מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: a partir deste dia
  alternative: deste dia em diante; desde antes deste dia
  rationale: 'A formulação portuguesa conserva o dia presente como ponto de referência sem eliminar a tensão contextual: a exortação pode orientar a atenção a partir desse momento, enquanto a oração seguinte manda considerar o período anterior à reconstrução.'
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas à comunidade. Conserva-se a metáfora semítica do coração, explicada em nota, e evita-se resolver indevidamente a possível ambiguidade temporal de וָמָעְלָה.
