  text: בְּ/עֶשְׂרִ֤ים וְ/אַרְבָּעָה֙ לַ/תְּשִׁיעִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה אֶל חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/010.yaml
  text: On the twenty-fourth day of the ninth month, in the second year of Darius, the word of Yahweh came to Haggai the prophet, saying,
translation:
  language: pt
  text: 'No dia vinte e quatro do nono mês, no segundo ano de Dario, a palavra de Yahweh veio ao profeta Ageu, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עֶשְׂרִים וְ/אַרְבָּעָה
  choice: No dia vinte e quatro
  rationale: A fórmula hebraica de data diz literalmente «em vinte e quatro»; em português, acrescentar «dia» torna a expressão clara e natural, preservando o numeral cardinal habitual em datas.
- source_word: לַ/תְּשִׁיעִי
  choice: do nono mês
  rationale: O ordinal designa o nono mês. O substantivo «mês», implícito no hebraico, é explicitado para clareza em português.
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: no segundo ano
  rationale: É a fórmula régia usual, vertida de modo idiomático e fiel em português.
- source_word: לְ/דָרְיָוֶשׁ
  choice: de Dario
  rationale: A preposição indica a relação com o reinado de Dario; «no segundo ano de Dario» é a formulação portuguesa convencional.
- source_word: הָיָה דְּבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: Na fórmula profética, היה com «palavra» tem o sentido idiomático de a mensagem divina vir ao profeta, não apenas de existir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל חַגַּי הַ/נָּבִיא
  choice: ao profeta Ageu
  rationale: «Ao» expressa o destinatário da palavra; «Ageu» é a forma portuguesa consagrada do nome, e o título mantém sua função identificadora.
- source_word: לֵ/אמֹר
  choice: 'dizendo:'
  rationale: O infinitivo introduz a fala divina que continua no versículo seguinte; os dois-pontos cumprem naturalmente essa função em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» conserva o nome pessoal e evita substituí-lo por um título, sem adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém-se a estrutura da fórmula profética, enquanto a ordem «ao profeta Ageu» soa mais natural em português. O versículo termina com dois-pontos porque introduz a fala dos versículos seguintes.
