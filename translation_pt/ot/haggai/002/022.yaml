  source_fidelity: A tradução preserva a estrutura principal e o sentido de juízo do hebraico. Contudo, וְרֹכְבֶיהָ é plural (“seus ocupantes/cavaleiros”), e “os que nele vão” é excessivamente vago para o elemento militar referido. A revisão explicita o plural sem impor que fossem exclusivamente condutores. “Farei tombar” comunica naturalmente o efeito de הָפַכְתִּי sobre o carro e seus ocupantes.
  naturalness: O texto é claro e de registro profético apropriado. “Farei tombar o carro de guerra e seus ocupantes” é mais idiomático em português do que “Virarei ... e os que nele vão”. A nota b é reposicionada junto à expressão que ela explica.
  terminology: “Trono dos reinos”, “força dos reinos das nações”, “carro de guerra”, “cavaleiros” e “espada de seu irmão” mantêm adequadamente a terminologia política e militar do original. “Força” representa diretamente חֹזֶק e evita uma ampliação conceitual desnecessária.
