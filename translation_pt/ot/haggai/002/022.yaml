revisions:
- from: Derrubarei o trono dos reinos[a] e destruirei o poder dos reinos das nações. Virarei o carro de guerra e os que nele vão; os cavalos e seus cavaleiros cairão[b], cada um pela espada de seu irmão.
  to: Derrubarei o trono dos reinos[a] e destruirei a força dos reinos das nações. Farei tombar o carro de guerra e seus ocupantes; os cavalos e seus cavaleiros cairão, cada um pela espada de seu irmão[b].
  rationale: A revisão corrige a imprecisão referente ao plural “seus ocupantes”, torna natural a imagem de derrubar o carro e seus ocupantes, usa uma equivalência mais direta para “força” e reposiciona a nota explicativa junto ao idiomatismo hebraico que ela esclarece. O singular simbólico de “trono” e a formulação masculina distributiva “cada um ... seu irmão” são preservados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:21Z'
review_pass:
