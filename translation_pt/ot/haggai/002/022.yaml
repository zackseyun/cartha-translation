    rationale: A expressão é vaga e atenua a referência aos ocupantes/riders do carro; o hebraico está no plural. “Seus ocupantes” preserva o plural e é natural para uma carruagem de guerra.
  - severity: low
    issue: Âncora da nota b após “cairão”
    rationale: A nota explica especificamente “cada um pela espada de seu irmão”; a âncora deve acompanhar essa expressão, não o verbo anterior.
  - severity: low
    issue: “poder” para חֹזֶק
    rationale: É possível, mas “força” é a correspondência lexical mais direta e conserva melhor o paralelismo com a destruição de capacidades políticas e militares.
