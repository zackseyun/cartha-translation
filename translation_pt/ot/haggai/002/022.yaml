  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/022.yaml
  text: I will overturn the throne of kingdoms[a], and I will destroy the strength of the kingdoms of the nations. I will overturn the chariot and its rider, and horses and their riders will go down[b], each by the sword of his brother.
translation:
  language: pt
  text: Derrubarei o trono dos reinos[a] e destruirei a força dos reinos das nações. Farei tombar o carro de guerra e seus ocupantes; os cavalos e seus cavaleiros cairão, cada um pela espada de seu irmão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Subverterei o trono dos reinos”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “cada um pela espada de seu irmão”, expressão que indica matança mútua ou conflito interno entre os combatentes.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: Derrubarei / Virarei
  rationale: No contexto de juízo, הפך comunica tanto a derrubada do poder estabelecido quanto o ato concreto de virar um carro. A variação em português preserva o sentido adequado a cada objeto.
- source_word: כִּסֵּא מַמְלָכוֹת
  choice: o trono dos reinos
  rationale: Mantém o singular hebraico de כִּסֵּא, provavelmente coletivo ou simbólico, sem convertê-lo interpretativamente em plural.
- source_word: וְהִשְׁמַדְתִּי
  choice: destruirei
  rationale: Expressa com força e naturalidade o valor causativo de שׁמד, sem exceder o texto.
- source_word: חֹזֶק
  choice: o poder
  rationale: Neste contexto político-militar, 'poder' comunica naturalmente a força ou capacidade dos reinos.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: os reinos das nações
  rationale: גּוֹיִם designa aqui nações em sentido geopolítico; 'nações' é claro e não introduz conotação religiosa desnecessária.
- source_word: מֶרְכָּבָה
  choice: o carro de guerra
  rationale: O contexto é militar. 'Carro de guerra' torna a imagem antiga imediatamente compreensível, conservando o singular hebraico de valor possivelmente coletivo.
- source_word: וְרֹכְבֶיהָ
  choice: os que nele vão
  rationale: A forma hebraica é plural, literalmente 'os seus ocupantes/cavaleiros'. A expressão evita o estranho 'cavaleiros do carro' e preserva o plural e a referência ao carro.
- source_word: וְיָרְדוּ
  choice: cairão
  rationale: Embora ירד signifique literalmente 'descer', no contexto de batalha comunica queda em derrota ou morte; 'cairão' é a formulação natural em português.
- source_word: סוּסִים
  choice: os cavalos
  rationale: Mantém o sentido lexical simples; o contexto já estabelece o cenário militar.
- source_word: וְרֹכְבֵיהֶם
  choice: seus cavaleiros
  rationale: Com cavalos como antecedente, 'cavaleiros' é mais natural e preciso em português do que 'os que os montam'.
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  choice: cada um pela espada de seu irmão
  rationale: Preserva a construção distributiva e a linguagem masculina do hebraico, deixando a nota explicar a ideia de combate mútuo.
theological_decisions:
- issue: Linguagem de gênero em אִישׁ ... אָחִיו
  choice: cada um pela espada de seu irmão
  alternative: cada um pela espada do outro
  rationale: A expressão hebraica emprega substantivos masculinos singulares e descreve combatentes. A tradução conserva essa forma sem restringir além do contexto.
- issue: Singular simbólico em כִּסֵּא מַמְלָכוֹת
  choice: o trono dos reinos
  alternative: os tronos dos reinos
  rationale: O singular pode representar coletivamente a soberania dos reinos. Mantê-lo preserva a forma e a possível tensão do original, sem decidir que houve erro ou elipse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem profética e o paralelismo foram preservados; termos militares antigos foram explicitados apenas onde necessário para clareza.
