  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֥וֹד אַחַ֖ת מְעַ֣ט הִ֑יא וַ/אֲנִ֗י מַרְעִישׁ֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וְ/אֶת הַ/יָּ֖ם וְ/אֶת הֶ/חָרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/006.yaml
  text: 'For this is what Yahweh of Armies says: Yet once more[a], in a little while[b], I will shake the heavens and the earth and the sea and the dry land.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos: “Mais uma vez, daqui a pouco[a], farei tremer os céus, a terra, o mar e a terra seca.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é condensado: “mais uma vez, pouco [tempo] é”. Também pode ser traduzido: “mais uma vez, dentro de pouco tempo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Comunica de modo transparente o sentido concreto do título hebraico e mantém sua força.
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Preserva a fórmula profética e a ligação explicativa de כִּי em português natural e solene.
- source_word: עוֹד אַחַת מְעַט הִיא
  choice: Mais uma vez, daqui a pouco
  rationale: 'Representa os dois elementos da expressão hebraica condensada: repetição e curto intervalo de tempo, sem impor uma interpretação posterior.'
- source_word: מַרְעִישׁ
  choice: farei tremer
  rationale: O particípio hifil, acompanhado do pronome independente e inserido no discurso profético, admite valor futuro; a forma causativa portuguesa expressa precisamente a ação divina.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Mantém o plural hebraico e se ajusta ao alcance cósmico da enumeração.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No paralelismo com os céus e na enumeração cósmica, refere-se à terra, não apenas a uma região.
- source_word: הַיָּם
  choice: o mar
  rationale: Equivalente direto no conjunto dos domínios da criação.
- source_word: הֶחָרָבָה
  choice: a terra seca
  rationale: Em contraste com o mar, designa a porção seca; a tradução também preserva a possível ressonância da linguagem da criação.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos exércitos celestiais
  rationale: Preserva o nome divino expresso no hebraico e traduz צְבָאוֹת sem especificar se os exércitos são celestiais ou terrenos, mantendo a amplitude do título.
- issue: Sentido temporal de עוֹד אַחַת מְעַט הִיא
  choice: Mais uma vez, daqui a pouco
  alternative: Ainda uma vez, por pouco tempo; mais uma vez, dentro de pouco tempo
  rationale: A frase hebraica é sintaticamente condensada. A opção conserva tanto a repetição quanto a proximidade temporal, sem harmonizá-la interpretativamente com Hebreus 12.
- issue: Valor verbal de מַרְעִישׁ
  choice: farei tremer
  alternative: estou fazendo tremer; estou prestes a fazer tremer
  rationale: O contexto profético favorece referência futura, mas a tradução não acrescenta o grau de iminência sugerido por “estou prestes a”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula “assim diz” mantém o tom profético tradicional sem arcaísmo excessivo. A ordem da enumeração hebraica foi preservada.
