  text: וְ/עַתָּ֣ה חֲזַ֣ק זְרֻבָּבֶ֣ל נְאֻם יְהוָ֡ה וַ/חֲזַ֣ק יְהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וַ/חֲזַ֨ק כָּל עַ֥ם הָ/אָ֛רֶץ נְאֻם יְהוָ֖ה וַֽ/עֲשׂ֑וּ כִּֽי אֲנִ֣י אִתְּ/כֶ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/004.yaml
  text: But now[a], be strong, Zerubbabel, declares Yahweh, and be strong, Joshua son of Jehozadak, the high priest, and be strong, all the people of the land, declares Yahweh, and work, for I am with you, declares Yahweh of Armies.
translation:
  language: pt
  text: Mas agora, seja forte, Zorobabel — declara Yahweh —; seja forte, Josué, filho de Jeozadaque, o sumo sacerdote; e seja forte, todo o povo da terra — declara Yahweh —. Trabalhem, pois eu estou com vocês — declara Yahweh dos Exércitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a forma tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Marca a transição do desânimo mencionado anteriormente para a exortação presente; “Mas agora” expressa naturalmente a força adversativa do contexto.
- source_word: חֲזַק / וַחֲזַק / וַחֲזַק
  choice: seja forte
  rationale: Preserva tanto o sentido básico de força e coragem quanto a repetição retórica do hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com dignidade e clareza a fórmula profética, mantendo explícito o nome divino.
- source_word: בֶּן
  choice: filho de
  rationale: É a identificação genealógica direta e natural neste contexto.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: É a designação portuguesa estabelecida e precisa para esse ofício cultual.
- source_word: כָּל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Conserva a expressão hebraica e, no contexto pós-exílico, refere-se naturalmente à comunidade da terra, não a toda a humanidade.
- source_word: וַעֲשׂוּ
  choice: e trabalhem
  rationale: No contexto imediato da reconstrução do templo, o imperativo convoca o povo ao trabalho; a forma plural corresponde ao grupo inteiro convocado.
- source_word: כִּי אֲנִי אִתְּכֶם
  choice: pois eu estou com vocês
  rationale: Apresenta a presença divina como fundamento da ordem, em português atual e amplamente compreensível.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Traduz o título de modo transparente, preservando o nome próprio divino e o sentido de צְבָאוֹת.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; “Yahweh” conserva o nome da aliança sem substituí-lo por um título.
- issue: Representação do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh dos Exércitos celestiais; SENHOR dos Exércitos
  rationale: “Exércitos” comunica o sentido básico do título sem determinar explicitamente se a referência abrange forças celestiais, terrenas ou ambas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “seja forte” foi mantida para preservar a força retórica. Travessões delimitam as fórmulas proféticas sem alterar sua posição no discurso. O plural “trabalhem” torna explícita em português a concordância do imperativo dirigido a todo o povo.
