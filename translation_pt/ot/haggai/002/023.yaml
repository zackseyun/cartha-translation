  text: בַּ/יּ֣וֹם הַ/ה֣וּא נְאֻם יְהוָ֣ה צְבָא֡וֹת אֶ֠קָּחֲ/ךָ זְרֻבָּבֶ֨ל בֶּן שְׁאַלְתִּיאֵ֤ל עַבְדִּ/י֙ נְאֻם יְהוָ֔ה וְ/שַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם כִּֽי בְ/ךָ֣ בָחַ֔רְתִּי נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/023.yaml
  text: On that day[a], declares Yahweh of Armies, I will take you, Zerubbabel son of Shealtiel, my servant, declares Yahweh, and I will make you like a signet ring, for I have chosen you[b], declares Yahweh of Armies.
translation:
  language: pt
  text: “Naquele dia”, declara Yahweh dos Exércitos[a], “eu o tomarei, Zorobabel, filho de Sealtiel, meu servo”, declara Yahweh, “e o farei semelhante a um anel-sinete[b], porque o escolhi”, declara Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “SENHOR dos Exércitos”.
    reason: lexical_alternative
  - marker: b
    text: O anel-sinete era usado para autenticar documentos e podia representar autoridade, posse e grande valor. Compare Jeremias 22:24.
    reason: historical_context_and_cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética em português natural, sem especificar além do que o contexto permite.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: “Declara” comunica a fórmula solene de pronunciamento profético; “Yahweh” preserva o nome divino, e “dos Exércitos” torna צְבָאוֹת transparente ao leitor moderno.
- source_word: אֶקָּחֲךָ
  choice: eu o tomarei
  rationale: Mantém o sentido básico de לקח e evita antecipar a ideia de escolha, expressa de modo explícito mais adiante.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Zorobabel, filho de Sealtiel
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes, conservando a filiação declarada no hebraico.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto régio-profético, “servo” exprime adequadamente serviço comissionado sem introduzir a conotação mais restrita de escravidão.
- source_word: וְשַׂמְתִּיךָ כַּחוֹתָם
  choice: e o farei semelhante a um anel-sinete
  rationale: Conserva a comparação marcada por כ e comunica em linguagem compreensível o selo pessoal usado para autenticar atos e representar autoridade.
- source_word: כִּי בְךָ בָחַרְתִּי
  choice: porque escolhi você
  rationale: “Porque” mantém a relação causal de כִּי; a forma verbal expressa uma escolha divina já realizada, sem acrescentar uma interpretação teológica ao seu alcance.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Repete consistentemente a fórmula profética solene presente no texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Tradução do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos Exércitos do céu; dos Senhores dos exércitos
  rationale: A escolha mantém a amplitude do título, que pode abranger forças celestes e terrestres, sem restringi-lo por explicação interpretativa no texto principal.
- issue: Implicação régia ou messiânica da imagem do sinete
  choice: Preservar a metáfora sem explicitar sua possível dimensão davídica ou messiânica no texto principal
  alternative: meu anel-sinete real
  rationale: A linhagem de Zorobabel e a relação com Jeremias 22:24 podem conferir à imagem forte significado régio, mas o hebraico não inclui o adjetivo “real” nem explicita aqui seu desenvolvimento messiânico.
- issue: Alcance da escolha divina de Zorobabel
  choice: porque escolhi você
  alternative: porque escolhi você como meu rei; porque escolhi a sua linhagem
  rationale: A tradução mantém o objeto pessoal expresso no verso e não define além do texto se a escolha se refere exclusivamente à missão histórica, ao papel dinástico ou a ambos.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos fortes. As formas “eu o tomarei” e “o farei” mantêm solenidade, enquanto “escolhi você” evita a possível ambiguidade oral de “o escolhi”. A repetição de “declara Yahweh” foi preservada por corresponder à ênfase formal do hebraico.
