  text: וְ/הִרְעַשְׁתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וּ/בָ֖אוּ חֶמְדַּ֣ת כָּל הַ/גּוֹיִ֑ם וּ/מִלֵּאתִ֞י אֶת הַ/בַּ֤יִת הַ/זֶּה֙ כָּב֔וֹד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/007.yaml
  text: And I will shake all the nations[a], and the treasures of all the nations will come, and I will fill this house with glory, says Yahweh of Armies.
translation:
  language: pt
  text: Farei tremer todas as nações, e os tesouros de todas as nações virão[a]. Encherei esta casa de glória, diz Javé dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma tradução tradicional: «o desejado de todas as nações virá». O hebraico também pode significar «as coisas preciosas» das nações; o verbo no plural favorece um sentido coletivo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְעַשְׁתִּי
  choice: Farei tremer
  rationale: 'O hifil de רעשׁ expressa causação: Deus fará as nações tremerem. A formulação é natural em português e preserva a ação divina sem intensificação indevida.'
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם designa aqui as nações em geral; «nações» é claro e evita transformar o termo numa categoria teológica específica.
- source_word: וּבָאוּ
  choice: virão
  rationale: O verbo está no plural e, na sequência profética, é naturalmente expresso pelo futuro em português.
- source_word: חֶמְדַּת כָּל הַגּוֹיִם
  choice: os tesouros de todas as nações
  rationale: Embora חֶמְדַּת tenha forma singular, pode ter sentido coletivo, referindo-se a coisas preciosas ou desejáveis. O verbo plural וּבָאוּ favorece esse entendimento; «tesouros» comunica de modo natural os bens valiosos das nações.
- source_word: וּמִלֵּאתִי
  choice: Encherei
  rationale: O piel de מלא significa «encher»; a construção com «de glória» é direta e idiomática em português.
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: בַּיִת significa literalmente «casa». O contexto identifica o templo, mas «esta casa» conserva a expressão do profeta.
- source_word: כָּבוֹד
  choice: glória
  rationale: No contexto do templo e da presença divina, כָּבוֹד é bem representado por «glória», que preserva as ideias de majestade, esplendor e honra.
- source_word: יְהוָה צְבָאוֹת
  choice: Javé dos Exércitos
  rationale: «Javé» representa o nome divino יהוה, e «dos Exércitos» traduz צְבָאוֹת de maneira transparente, preservando a força do título.
theological_decisions:
- issue: Sentido de חֶמְדַּת כָּל הַגּוֹיִם
  choice: 'Leitura coletiva/material: «os tesouros de todas as nações»'
  alternative: 'Leitura pessoal ou messiânica tradicional: «o desejado de todas as nações»; também é possível «as coisas preciosas de todas as nações».'
  rationale: O substantivo pode indicar aquilo que é desejável ou precioso, e o verbo plural וּבָאוּ favorece um referente coletivo. A tradução principal evita impor uma identificação messiânica que o hebraico não torna inequívoca, enquanto a nota preserva a leitura tradicional e a ambiguidade histórica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Farei tremer» soa mais natural do que «sacudirei» para nações e preserva o valor causativo. A ordem das orações acompanha de perto o hebraico, sem sacrificar a fluidez.
