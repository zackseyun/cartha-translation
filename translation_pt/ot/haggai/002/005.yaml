base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/005.yaml
  text: As for the promise that I made with you when you came out of Egypt[a], and my Spirit is standing in your midst[b]; do not fear.
translation:
  language: pt
  text: Quanto à promessa que fiz com vocês quando saíram do Egito[a], meu Espírito permanece no meio de vocês[b]. Não tenham medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “a palavra que cortei com vocês”. O verbo hebraico faz parte da linguagem usada para estabelecer uma aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “está de pé no meio de vocês”; também pode ser entendido como “continua entre vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַדָּבָר
  choice: Quanto à promessa
  rationale: A construção inicial é elíptica e retoma o contexto anterior. דָּבָר significa literalmente “palavra” ou “assunto”, mas, junto de כָּרַתִּי e da referência ao êxodo, designa aqui um compromisso de caráter pactual. “Quanto à promessa” comunica esse sentido sem inserir o substantivo técnico “aliança” no texto principal.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: que fiz com vocês
  rationale: כרת, literalmente “cortar”, é usado na linguagem de estabelecimento de aliança. “Fiz com vocês” é natural em português e, unido a “promessa”, preserva a força relacional e pactual sem reproduzir mecanicamente o idioma hebraico.
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: quando saíram do Egito
  rationale: O infinitivo construto com בְּ tem valor temporal. “Quando saíram do Egito” é corrente e preserva claramente a referência ao êxodo.
- source_word: וְרוּחִי
  choice: meu Espírito
  rationale: No contexto, רוּחַ indica a presença ativa de Deus entre o povo, e não mero vento ou respiração. A maiúscula identifica o referente divino sem desenvolver além do que o texto afirma.
- source_word: עֹמֶדֶת
  choice: permanece
  rationale: O particípio expressa presença contínua. Embora a imagem verbal básica seja “estar de pé”, essa formulação soaria corporal ou pouco natural em português; “permanece” transmite adequadamente o valor durativo, com a alternativa mais literal registrada em nota.
- source_word: בְּתוֹכְכֶם
  choice: no meio de vocês
  rationale: A expressão aponta para a presença de Deus entre a comunidade. Evita-se “dentro de vocês”, que poderia sugerir interioridade individual não exigida pelo hebraico.
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: É uma proibição dirigida ao povo no plural. A formulação é natural, clara e solene em português contemporâneo.
theological_decisions:
- issue: Sentido de רוּחִי no contexto da presença divina
  choice: meu Espírito
  alternative: meu sopro
  rationale: A referência ao compromisso do êxodo e à presença de Deus no meio do povo favorece “Espírito”. A tradução não acrescenta definições doutrinárias posteriores ao enunciado.
- issue: Grau de explicitação da linguagem de aliança em דָּבָר ... כָּרַתִּי
  choice: a promessa que fiz com vocês
  alternative: a aliança que firmei com vocês; a palavra que pactuei com vocês
  rationale: O hebraico não emprega aqui o substantivo בְּרִית, “aliança”, por isso o texto principal evita torná-lo explícito. “Promessa” comunica o compromisso pactual sugerido pelo verbo כרת, enquanto a nota preserva a forma lexical mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural comunitário. A pontuação transforma a construção hebraica elíptica em uma sequência legível sem eliminar sua ligação com o contexto anterior. Todos os marcadores de nota aparecem no texto principal.
