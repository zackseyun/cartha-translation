  text: בַּ/שְּׁבִיעִ֕י בְּ/עֶשְׂרִ֥ים וְ/אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה בְּ/יַד חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/001.yaml
  text: On the twenty-first day of the seventh month[a], the word of Yahweh came by the hand of Haggai the prophet, saying,
translation:
  language: pt
  text: 'No vigésimo primeiro dia do sétimo mês, a palavra de Yahweh veio por meio do profeta Ageu[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Ageu”, expressão que significa “por meio de Ageu” ou “pela atuação de Ageu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁבִיעִי בְּעֶשְׂרִים וְאֶחָד לַחֹדֶשׁ
  choice: No vigésimo primeiro dia do sétimo mês
  rationale: A construção hebraica é uma fórmula de data. “Dia” está implícito e precisa ser expresso em português natural; בַּשְּׁבִיעִי designa aqui o sétimo mês.
- source_word: הָיָה דְּבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: Trata-se da fórmula profética que apresenta um acontecimento de revelação. “Veio” comunica esse sentido de modo mais natural do que o literal “foi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: por meio do profeta Ageu
  rationale: O hebraico diz literalmente “pela mão de Ageu, o profeta”; aqui בְּיַד é um idiomatismo de mediação ou agência. “Por meio do profeta Ageu” transmite esse sentido com clareza em português atual.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo introduz a fala divina que vem a seguir. “Dizendo:” conserva a ligação formal com o discurso subsequente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural da data. A expressão idiomática בְּיַד foi traduzida no texto por seu sentido e preservada literalmente na nota. O marcador foi colocado junto a “Ageu”, termo ao qual a nota efetivamente se refere.
