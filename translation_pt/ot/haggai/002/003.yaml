base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/003.yaml
  text: Who among you is left who saw this house in its former glory? And how do you see it now? Is it not as nothing in your eyes?[a][b]
translation:
  language: pt
  text: Quem de vocês ainda está aqui, que viu esta casa em sua glória anterior?[a][b] E como vocês a veem agora? Aos olhos de vocês, não é ela como nada?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «este templo». O hebraico diz literalmente «esta casa», expressão comum para se referir ao templo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «em sua primeira glória».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם הַנִּשְׁאָר
  choice: Quem de vocês ainda resta
  rationale: Preserva a ideia do particípio nifal de alguém que permaneceu da geração anterior, sem explicitar além do texto que se trata apenas de estar vivo.
- source_word: אֲשֶׁר רָאָה
  choice: e viu
  rationale: O qatal indica o ato concluído de ter visto o templo anterior; em português, a coordenação com «e viu» torna natural a relação com a pergunta precedente.
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: Mantém o termo hebraico literal, que no contexto designa o templo, sem substituir a imagem original.
- source_word: בִּכְבוֹדוֹ הָרִאשׁוֹן
  choice: em sua glória anterior
  rationale: «Glória» conserva a amplitude de כבוד, incluindo esplendor e honra; «anterior» expressa naturalmente o contraste temporal de רִאשׁוֹן.
- source_word: וּמָה אַתֶּם רֹאִים אֹתוֹ עַתָּה
  choice: E como vocês a veem agora?
  rationale: Reproduz o caráter avaliativo da pergunta e mantém o verbo de percepção, em português corrente e claro.
- source_word: הֲלוֹא
  choice: não é ela
  rationale: Introduz uma pergunta retórica que espera concordância, conservando sua forma interrogativa.
- source_word: כָמֹהוּ כְּאַיִן
  choice: como nada
  rationale: Expressa a extrema insignificância percebida na comparação, sem suavizar a força retórica.
- source_word: בְּעֵינֵיכֶם
  choice: Aos olhos de vocês
  rationale: Preserva a metáfora hebraica de percepção e avaliação, de modo idiomático em português.
