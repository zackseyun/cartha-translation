  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה שֵׁנִית֙ אֶל חַגַּ֔י בְּ/עֶשְׂרִ֧ים וְ/אַרְבָּעָ֛ה לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/020.yaml
  text: And the word of Yahweh came a second time to Haggai on the twenty-fourth day of the month[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio pela segunda vez a Ageu, no vigésimo quarto dia do mês, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה, «a palavra de Yahweh veio» é a expressão idiomática consagrada em português e comunica naturalmente o acontecimento revelatório.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: «Palavra» preserva tanto o sentido lexical de דָּבָר quanto a fórmula profética, sem reduzi-la apenas a «mensagem».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Expressa de maneira explícita e natural o valor ordinal/adverbial do hebraico.
- source_word: אֶל חַגַּי
  choice: a Ageu
  rationale: A preposição אֶל, com verbo de comunicação ou revelação, indica o destinatário; «Ageu» é a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ
  choice: no vigésimo quarto dia do mês
  rationale: Torna explícito o «dia» subentendido na data hebraica e preserva a referência definida ao mês já identificado no contexto.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula hebraica que introduz o discurso direto; os dois-pontos sinalizam que a fala continua no versículo seguinte.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal por transliteração e evita substituí-lo silenciosamente por um título; outras formas portuguesas são possíveis, mas não foram adotadas.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da fórmula profética hebraica. «Ageu» segue o uso bíblico português corrente. A frase termina com dois-pontos porque o conteúdo da mensagem começa no versículo seguinte.
