base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/019.yaml
  text: Is the seed still in the storehouse? Even the vine[a], the fig tree, the pomegranate, and the olive tree have not borne fruit. From this day on I will bless you.
translation:
  language: pt
  text: A semente ainda está no celeiro? Quanto à videira, à figueira, à romãzeira e à oliveira, elas não deram fruto. A partir deste dia, eu abençoarei vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “eu abençoarei”; o objeto “vocês” está implícito no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַע֤וֹד הַזֶּ֨רַע֙ בַּמְּגוּרָ֔ה
  choice: A semente ainda está no celeiro?
  rationale: A pergunta hebraica emprega עוֹד para indicar continuidade até o presente. “Ainda está” preserva essa força, enquanto “celeiro” comunica naturalmente o local de armazenamento de grãos.
- source_word: וְעַד
  choice: Quanto a
  rationale: Neste contexto, a expressão amplia a consideração da semente para as plantas enumeradas. “Quanto a” reproduz esse movimento discursivo sem o sentido temporal que “até” poderia sugerir em português.
- source_word: הַגֶּ֨פֶן וְהַתְּאֵנָ֧ה וְהָרִמּ֛וֹן וְעֵ֥ץ הַזַּ֖יִת
  choice: a videira, a figueira, a romãzeira e a oliveira
  rationale: São os nomes correntes e claros dessas plantas frutíferas em português moderno.
- source_word: לֹ֣א נָשָׂ֑א
  choice: elas não deram fruto
  rationale: Embora נָשָׂא signifique literalmente “carregar/levar”, no contexto de plantas a expressão idiomática é “dar fruto”. O pronome plural torna clara e natural em português a referência à lista precedente.
- source_word: מִן הַיּ֥וֹם הַזֶּ֖ה
  choice: A partir deste dia
  rationale: Marca o dia presente como ponto inicial da mudança prometida e preserva a formulação solene do hebraico.
- source_word: אֲבָרֵֽךְ
  choice: eu abençoarei vocês
  rationale: O imperfeito intensivo de ברך expressa aqui uma promessa futura. O objeto não aparece no hebraico, mas os destinatários do oráculo estão implícitos; “vocês” explicita essa referência natural em português, com transparência em nota.
theological_decisions:
- issue: Objeto implícito da promessa “abençoarei”
  choice: Explicitar “vocês” no texto e registrar a ausência do objeto expresso em nota.
  alternative: Manter apenas “eu abençoarei”, sem objeto.
  rationale: O hebraico deixa o objeto implícito, mas o contexto aponta para a comunidade a quem o oráculo é dirigido. A explicitação evita uma frase incompleta ou ambígua em português sem acrescentar conteúdo teológico novo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas lexicais familiares no Brasil e inteligíveis internacionalmente. A formulação mantém a pergunta inicial, o movimento para a lista de plantas e a promessa conclusiva, sem eliminar a elipse do original silenciosamente.
