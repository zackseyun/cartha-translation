  source_fidelity: A tradução preserva adequadamente a construção hipotética de הֵן, o cenário de carne sacrificial carregada na dobra/extremidade da roupa e a pergunta ritual sobre a transmissão de santidade. “Com essa dobra” comunica corretamente o contato mediado pela parte da roupa, sem introduzir uma conclusão teológica além do texto. A resposta negativa dos sacerdotes está fielmente representada.
