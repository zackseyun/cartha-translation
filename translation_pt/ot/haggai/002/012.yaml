  terminology: “Carne consagrada” conserva o sentido cultual de בְּשַׂר קֹדֶשׁ sem sugerir santidade moral. “Consagrado” em “ficará consagrado?” mantém a questão de status ritual expressa por הֲיִקְדָּשׁ. As alternativas nas notas—especialmente “carne santa” e “ponta”/“aba”—cobrem de modo adequado a amplitude lexical relevante.
