source:
  edition: WLC
  text: הֵ֣ן יִשָּׂא אִ֨ישׁ בְּשַׂר קֹ֜דֶשׁ בִּ/כְנַ֣ף בִּגְד֗/וֹ וְ/נָגַ֣ע בִּ֠/כְנָפ/וֹ אֶל הַ/לֶּ֨חֶם וְ/אֶל הַ/נָּזִ֜יד וְ/אֶל הַ/יַּ֧יִן וְ/אֶל שֶׁ֛מֶן וְ/אֶל כָּל מַאֲכָ֖ל הֲ/יִקְדָּ֑שׁ וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ לֹֽא׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/012.yaml
  text: Suppose a man carries holy meat in the fold of his garment[a], and with his fold touches bread, stew, wine, oil, or any food—does it become holy? And the priests answered and said[b], “No.”
translation:
  language: pt
  text: 'Se um homem levar carne consagrada[a] na dobra de sua roupa[b] e, com essa dobra, tocar em pão, ensopado, vinho, óleo ou qualquer alimento, esse alimento ficará consagrado? Os sacerdotes responderam: “Não.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “carne santa”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “na ponta” ou “na aba de sua roupa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Se
  rationale: Introduz de modo natural, em português, o caso hipotético apresentado aos sacerdotes.
- source_word: יִשָּׂא אִישׁ
  choice: um homem levar
  rationale: Mantém o singular masculino genérico do hebraico e emprega um verbo corrente para a ação de transportar.
- source_word: בְּשַׂר קֹדֶשׁ
  choice: carne consagrada
  rationale: Designa carne sacrificial separada para uso santo; a formulação é clara e preserva o sentido ritual.
- source_word: בִּכְנַף בִּגְדוֹ
  choice: na dobra de sua roupa
  rationale: כָּנָף pode indicar a ponta, aba ou extremidade da veste; aqui essa parte é usada para carregar a carne, e “dobra” comunica bem essa função.
- source_word: וְנָגַע בִּכְנָפוֹ
  choice: e, com essa dobra, tocar
  rationale: Explicita que o contato com os alimentos ocorre por meio da parte da roupa que contém a carne, sem afirmar contato direto com a carne.
- source_word: לֶחֶם ... נָזִיד ... יַיִן ... שֶׁמֶן ... כָּל מַאֲכָל
  choice: pão, ensopado, vinho, óleo ou qualquer alimento
  rationale: Emprega equivalentes modernos e diretos, sem restringir שֶׁמֶן especificamente a azeite.
- source_word: הֲיִקְדָּשׁ
  choice: esse alimento ficará consagrado?
  rationale: Torna explícito o referente exigido pela fluência portuguesa e preserva a ideia passiva/resultativa de adquirir condição santa por contato.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ לֹא
  choice: 'Os sacerdotes responderam: “Não.”'
  rationale: Reproduz plenamente a resposta, evitando em português a redundância pouco natural de “responderam e disseram”.
theological_decisions:
- issue: Transmissão da santidade por contato no âmbito da lei sacerdotal
  choice: A pergunta trata de saber se o contato indireto, por meio da roupa que carrega carne consagrada, torna consagrado outro alimento; a resposta é negativa.
  alternative: Entender que o alimento toca diretamente a carne consagrada.
  rationale: A sintaxe menciona expressamente o contato por meio da dobra da roupa. A tradução mantém o sentido ritual e jurídico de santidade, sem o converter em afirmação sobre santidade moral ou interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Consagrada” comunica o sentido ritual de קֹדֶשׁ; “óleo” evita especificar além do hebraico. A repetição de “essa dobra” esclarece o contato mediado sem eliminar a questão jurídica do texto.
