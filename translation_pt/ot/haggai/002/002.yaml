id: HAG.2.2
reference: Haggai 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱמָר נָ֗א אֶל זְרֻבָּבֶ֤ל בֶּן שַׁלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֣ן הַ/גָּד֑וֹל וְ/אֶל שְׁאֵרִ֥ית הָ/עָ֖ם לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/002.yaml
  text: Speak now to Zerubbabel son of Shealtiel[a], governor of Judah, and to Joshua son of Jehozadak, the high priest, and to the remnant of the people, saying[b],
translation:
  language: pt
  text: 'Diga agora a Zorobabel, filho de Sealtiel, governador de Judá, a Josué[a], filho de Jeozadaque, o sumo sacerdote, e ao remanescente[b] do povo o seguinte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico “Josué”. Em outros lugares, a forma abreviada do mesmo nome pode ser representada como “Jesua”.
    reason: alternative_reading
  - marker: b
    text: Ou “restante do povo”. O termo hebraico pode designar os que permaneceram e também pode evocar o tema profético do “remanescente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Diga agora
  rationale: O imperativo de אמר ordena que o profeta transmita a mensagem, e נָא expressa aqui imediatismo ou urgência. “Diga agora” é direto e natural em português.
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: Zorobabel, filho de Sealtiel
  rationale: Empregam-se as formas portuguesas reconhecíveis dos nomes hebraicos, mantendo a relação filial expressa por בֶּן.
- source_word: פַּחַת יְהוּדָה
  choice: governador de Judá
  rationale: פַּחַת designa o governador provincial do período persa; “governador” é o equivalente moderno mais claro.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Josué, filho de Jeozadaque
  rationale: O texto massorético traz a forma plena יְהוֹשֻׁעַ, tradicionalmente vertida em português como “Josué”; “Jeozadaque” representa de modo reconhecível o nome יְהוֹצָדָק.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: É o título português estabelecido e natural para o principal sacerdote de Israel.
- source_word: שְׁאֵרִית הָעָם
  choice: o remanescente do povo
  rationale: “Remanescente” preserva tanto o sentido concreto dos que restaram quanto a possível ressonância profética do termo.
- source_word: לֵאמֹר
  choice: 'o seguinte:'
  rationale: A construção introduz o conteúdo da fala no versículo seguinte. Em português, “o seguinte:” comunica essa função com mais naturalidade do que a repetição “dizendo” depois de “diga”.
theological_decisions:
- issue: Possível ressonância teológica de שְׁאֵרִית na literatura profética
  choice: remanescente do povo
  alternative: restante do povo
  rationale: “Remanescente” conserva a associação profética possível sem impor uma interpretação doutrinária; a nota registra o sentido meramente descritivo igualmente possível.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes amplamente reconhecidas no uso bíblico lusófono. A coordenação dos destinatários foi ajustada à regência natural de “dizer a alguém”, e לֵאמֹר foi vertido funcionalmente por “o seguinte:”, evitando uma repetição pouco idiomática.
