  text: הִכֵּ֨יתִי אֶתְ/כֶ֜ם בַּ/שִּׁדָּפ֤וֹן וּ/בַ/יֵּֽרָקוֹן֙ וּ/בַ/בָּרָ֔ד אֵ֖ת כָּל מַעֲשֵׂ֣ה יְדֵי/כֶ֑ם וְ/אֵין אֶתְ/כֶ֥ם אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/017.yaml
  text: I struck you with blight and mildew and hail[a], all the work of your hands; yet you did not turn to me, declares Yahweh.
translation:
  language: pt
  text: Eu feri vocês com crestamento, ferrugem e granizo em todo o trabalho de suas mãos; mas vocês não se voltaram para mim[a], declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente, a oração é elíptica: “e não há vocês para mim” ou “e nenhum de vocês estava voltado para mim”. No contexto, o sentido é que vocês não se voltaram nem retornaram a Yahweh.'
    reason: A oração hebraica não contém verbo explícito equivalente a «voltar-se»; a nota preserva sua forma elíptica e alternativas semanticamente possíveis.
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: Eu feri
  rationale: Mantém a força direta do verbo נכה e a agência divina, sem recorrer ao arcaico «golpeei» nem acrescentar a ideia interpretativa de castigo.
- source_word: בַּשִּׁדָּפוֹן
  choice: com crestamento
  rationale: שִׁדָּפוֹן designa o dano ou ressecamento das plantações causado por calor ou vento abrasador. «Crestamento» é um termo agrícola preciso e reconhecível no contexto.
- source_word: וּבַיֵּרָקוֹן
  choice: ferrugem
  rationale: יֵרָקוֹן descreve o amarelecimento ou definhamento das plantas. «Ferrugem» é a forma tradicional e compreensível de expressar em português uma praga agrícola desse tipo.
- source_word: וּבַבָּרָד
  choice: e granizo
  rationale: בָּרָד significa diretamente «granizo».
- source_word: אֵת כָּל מַעֲשֵׂה יְדֵיכֶם
  choice: atingindo todo o trabalho das suas mãos
  rationale: A formulação explicita em português natural que os flagelos atingiram o resultado do trabalho do povo, preservando a imagem hebraica «trabalho das suas mãos».
- source_word: וְאֵין אֶתְכֶם אֵלַי
  choice: contudo, vocês não se voltaram para mim
  rationale: A oração hebraica é elíptica, literalmente próxima de «e não havia vocês para mim/na minha direção». No contexto, indica que o povo não respondeu à disciplina voltando-se para Deus; a nota preserva a forma mais literal e sua ambiguidade.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Reproduz a fórmula profética solene נְאֻם sem transformá-la simplesmente em um verbo comum de fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido da oração elíptica וְאֵין אֶתְכֶם אֵלַי
  choice: vocês não se voltaram para mim
  alternative: vocês não estavam comigo / nenhum de vocês veio para mim
  rationale: O contexto de juízo pactual favorece a ideia de falta de retorno ou resposta a Deus, mas o hebraico não contém um verbo explícito de voltar. A tradução comunica a força contextual, enquanto a nota registra as possibilidades mais formais e evita ocultar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para a segunda pessoa do plural. Conservou-se a imagem «trabalho das suas mãos» e usou-se vocabulário agrícola preciso. O travessão distingue naturalmente a fórmula profética final.
