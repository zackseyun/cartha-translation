source:
  edition: WLC
  text: גָּד֣וֹל יִֽהְיֶ֡ה כְּבוֹד֩ הַ/בַּ֨יִת הַ/זֶּ֤ה הָ/אַֽחֲרוֹן֙ מִן הָ֣/רִאשׁ֔וֹן אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וּ/בַ/מָּק֤וֹם הַ/זֶּה֙ אֶתֵּ֣ן שָׁל֔וֹם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/009.yaml
  text: The latter glory of this house will be greater than the former[a], says Yahweh of Armies; and in this place I will give peace[b], declares Yahweh of Armies.
translation:
  language: pt
  text: A glória posterior desta casa será maior do que a anterior, diz Yahweh dos Exércitos; e neste lugar darei paz[a], declara Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Paz” (shalom) também pode incluir as ideias de bem-estar e integridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל יִהְיֶה ... מִן
  choice: será maior do que
  rationale: A construção predicativa com הָיָה e a comparação introduzida por מִן pedem em português a forma comparativa natural “será maior do que”.
- source_word: כְּבוֹד
  choice: glória
  rationale: “Glória” preserva tanto a ideia de esplendor e honra quanto a ressonância teológica e cultual do contexto do templo.
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: Embora se refira ao templo, “casa” mantém a expressão hebraica e sua ressonância como casa de Yahweh.
- source_word: הָאַחֲרוֹן ... הָרִאשׁוֹן
  choice: posterior ... anterior
  rationale: O par expressa contraste temporal. “Posterior” e “anterior” preservam a ambiguidade entre fases da mesma casa e templos sucessivos, sem sugerir necessariamente uma manifestação final.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino; “dos Exércitos” comunica de modo transparente o plural e a força marcial de צְבָאוֹת.
- source_word: וּבַמָּקוֹם הַזֶּה
  choice: e neste lugar
  rationale: Tradução direta e idiomática que preserva a ênfase demonstrativa.
- source_word: אֶתֵּן
  choice: darei
  rationale: O verbo comum נָתַן significa “dar”; a forma simples e direta convém à promessa divina.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” é a equivalência principal e natural, enquanto uma nota registra o alcance semântico mais amplo de bem-estar e integridade.
- source_word: אָמַר ... נְאֻם
  choice: diz ... declara
  rationale: A distinção verbal evita repetição artificial e preserva a força solene da fórmula profética נְאֻם.
theological_decisions:
- issue: Sentido de “esta casa” e de sua “glória posterior”
  choice: Manter a promessa referente à glória desta casa sem definir no texto principal o cumprimento histórico ou escatológico.
  alternative: Interpretar explicitamente como comparação entre o segundo templo e o templo de Salomão, entre duas fases do mesmo templo ou como cumprimento messiânico escatológico.
  rationale: O hebraico afirma a comparação, mas não resolve por si só qual esquema histórico ou teológico deve governá-la.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o Tetragrama יהוה; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação permanece próxima do hebraico sem rigidez desnecessária. Não se acrescentou nota para “Yahweh dos Exércitos”, pois “Senhor dos Exércitos” seria uma convenção de representação do nome divino, não uma alternativa lexical exigida pelo texto.
