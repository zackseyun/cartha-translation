  source_fidelity: 'O texto traduz com fidelidade os elementos do hebraico: Yahweh é sujeito de «despertou»; a tripla referência ao «espírito» é mantida; Zorobabel e Josué recebem seus títulos corretos; «todo o remanescente do povo» preserva כָּל־שְׁאֵרִית הָעָם; e a conclusão expressa que eles vieram e realizaram trabalho na Casa de Yahweh dos Exércitos, seu Deus. «Então» é uma ligação narrativa aceitável para o waw consecutivo no contexto imediato e não altera o sentido.'
