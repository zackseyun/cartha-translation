  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֣עַר יְהוָ֡ה אֶת רוּחַ֩ זְרֻבָּבֶ֨ל בֶּן שַׁלְתִּיאֵ֜ל פַּחַ֣ת יְהוּדָ֗ה וְ/אֶת ר֨וּחַ֙ יְהוֹשֻׁ֤עַ בֶּן יְהוֹצָדָק֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְֽ/אֶת ר֔וּחַ כֹּ֖ל שְׁאֵרִ֣ית הָ/עָ֑ם וַ/יָּבֹ֨אוּ֙ וַ/יַּעֲשׂ֣וּ מְלָאכָ֔ה בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/014.yaml
  text: And Yahweh stirred up the spirit of Zerubbabel son of Shealtiel[a], governor of Judah, and the spirit of Joshua son of Jehozadak, the high priest, and the spirit of all the remnant of the people; and they came and did work on the house of Yahweh of Armies, their God.
translation:
  language: pt
  text: Então Yahweh despertou o espírito de Zorobabel, filho de Sealtiel, governador de Judá, o espírito de Josué, filho de Jeozadaque, o sumo sacerdote, e o espírito de todo o remanescente do povo. Eles vieram e trabalharam na Casa de Yahweh dos Exércitos,[a] seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a forma tradicional: “SENHOR dos Exércitos”.'
    reason: Registra a tradução tradicional do nome divino e do título צְבָאוֹת sem substituí-la no texto principal.
lexical_decisions:
- source_word: וַיָּעַר
  choice: despertou
  rationale: Expressa o ato de mover ou despertar alguém interiormente para agir, em português natural, sem acrescentar que a obra apenas começou.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: רוּחַ
  choice: espírito
  rationale: Preserva a amplitude do hebraico, que aqui pode envolver disposição interior, ânimo e impulso para agir.
- source_word: פַּחַת יְהוּדָה
  choice: governador de Judá
  rationale: Equivalente claro e corrente do título administrativo do período persa.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: Forma consagrada e inteligível em português para esse título sacerdotal.
- source_word: כֹּל שְׁאֵרִית הָעָם
  choice: todo o remanescente do povo
  rationale: Mantém o sentido de grupo sobrevivente e sua ressonância profética, em vez de reduzi-lo simplesmente ao restante.
- source_word: וַיָּבֹאוּ
  choice: Eles vieram
  rationale: Reproduz diretamente a sequência narrativa do hebraico sem especificar um destino não expresso.
- source_word: וַיַּעֲשׂוּ מְלָאכָה
  choice: trabalharam
  rationale: É a expressão natural em português para literalmente fazer trabalho, sem introduzir o aspecto adicional de começar.
- source_word: בְּבֵית
  choice: na Casa
  rationale: A preposição hebraica permite referência ao local ou objeto da atividade; no contexto, trabalhar na Casa comunica naturalmente a obra realizada no templo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo transparente para leitores modernos; a forma tradicional consta em nota.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Forma possessiva natural em português, mantendo a relação expressa pelo sufixo hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome pessoal, não o título Senhor; a transliteração evita ocultar essa distinção.
- issue: Ressonância de שְׁאֵרִית
  choice: remanescente
  alternative: restante
  rationale: Remanescente conserva a ideia de sobreviventes como grupo e a possível ressonância pactual do vocábulo, sem desenvolvê-la além do texto.
- issue: Sentido de יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos exércitos celestiais
  rationale: A tradução mantém a força do título e sua abertura referencial, sem restringir explicitamente os exércitos aos seres celestiais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “o espírito” acompanha a estrutura enfática do hebraico. “Casa” recebe inicial maiúscula por designar o templo, sem inserir essa explicação no corpo do versículo.
