source:
  edition: WLC
  text: עֲל֥וּ הָ/הָ֛ר וַ/הֲבֵאתֶ֥ם עֵ֖ץ וּ/בְנ֣וּ הַ/בָּ֑יִת וְ/אֶרְצֶה בּ֥/וֹ ו/אכבד אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/008.yaml
  text: Go up into the hills[a], bring wood, and build the house, so that I may take pleasure in it and be glorified[c][b], says Yahweh.
translation:
  language: pt
  text: Subam à região montanhosa[a], tragam madeira e construam a casa[b], para que eu tenha prazer nela e seja glorificado[c] — diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao monte”, “à montanha” ou “à região de montes”. O hebraico הָהָר pode se referir a um monte, uma montanha ou uma região elevada.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo; literalmente, “a casa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “e seja honrado”. O verbo hebraico pode ter o sentido de ser glorificado ou honrado.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲלוּ
  choice: Subam
  rationale: O imperativo plural de עלה ordena um movimento para cima. “Subam” é direto, natural e preserva a força do mandamento.
- source_word: הָהָר
  choice: à região montanhosa
  rationale: הַר pode designar monte, montanha ou região de montes. Como o propósito é buscar madeira, “região montanhosa” comunica naturalmente o provável sentido coletivo ou regional sem eliminar as alternativas lexicais, registradas em nota.
- source_word: וַהֲבֵאתֶם עֵץ
  choice: tragam madeira
  rationale: A forma causativa de בוא acompanhada de עֵץ significa trazer madeira. O singular עֵץ funciona aqui como nome de matéria, bem expresso pelo coletivo “madeira”.
- source_word: וּבְנוּ
  choice: e construam
  rationale: O imperativo de בנה significa simplesmente “construam”. “Reconstruam” explicitaria o contexto histórico, mas acrescentaria uma nuance não codificada no verbo.
- source_word: הַבָּיִת
  choice: a casa
  rationale: בַּיִת significa literalmente “casa”; no contexto, refere-se ao templo de Yahweh. A tradução mantém o modo de expressão hebraico, com esclarecimento em nota.
- source_word: וְאֶרְצֶה בּוֹ
  choice: para que eu me agrade dela
  rationale: רצה pode significar agradar-se, ter prazer ou acolher favoravelmente. “Para que” expressa a provável nuance de finalidade na sequência, e “dela” retoma naturalmente “a casa” em português.
- source_word: ואכבד
  choice: e seja glorificado
  rationale: 'A leitura massorética consonantal/vocálica representa o Niphal de כבד, que admite sentido passivo ou reflexivo: “ser glorificado” ou “ser honrado”. A tradução principal preserva o peso teológico do verbo, e a alternativa é indicada em nota.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido pelo nome próprio “Yahweh”, em vez de ser substituído por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Referente de הַבָּיִת no contexto do templo
  choice: a casa
  alternative: o templo
  rationale: Embora o referente seja o templo, o hebraico diz literalmente “a casa”. Manter essa expressão conserva o idioma do texto e a nota esclarece o referente.
- issue: Sentido de ואכבד
  choice: seja glorificado
  alternative: seja honrado
  rationale: O Niphal de כבד permite ambas as formulações. A tradução principal mantém “glorificado”, sem excluir “honrado”, registrado em nota para preservar a amplitude semântica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os imperativos no plural refletem o destinatário coletivo. A colocação de “dela” evita ambiguidade de gênero em português e retoma “a casa”. O travessão antes da fórmula profética favorece a leitura sem alterar sua relação sintática.
