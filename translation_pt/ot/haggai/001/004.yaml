base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/004.yaml
  text: Is it a time for you yourselves to live in your paneled houses while this house lies in ruins?[a]
translation:
  language: pt
  text: É tempo de vocês mesmos morarem em suas casas revestidas de painéis, enquanto esta casa está em ruínas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “casas forradas” — isto é, casas acabadas ou revestidas, provavelmente com madeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֵת
  choice: É tempo
  rationale: Mantém a formulação interrogativa e o substantivo עֵת, retomando diretamente a alegação do versículo 2 de que ainda não chegou o tempo.
- source_word: לָכֶם אַתֶּם
  choice: de vocês mesmos
  rationale: O pronome independente אַתֶּם reforça o elemento pronominal já presente em לָכֶם; “vocês mesmos” conserva a ênfase retórica.
- source_word: לָשֶׁבֶת
  choice: morarem
  rationale: Embora ישׁב possa significar literalmente “sentar-se”, neste contexto doméstico significa residir ou morar.
- source_word: בְּבָתֵּיכֶם
  choice: em suas casas
  rationale: “Casas” preserva a imagem concreta e a contraposição lexical com “esta casa”.
- source_word: סְפוּנִים
  choice: revestidas de madeira
  rationale: O particípio passivo indica casas cobertas ou forradas, provavelmente com madeira; a expressão é clara em português e comunica acabamento e conforto.
- source_word: וְהַבַּיִת הַזֶּה
  choice: enquanto esta casa
  rationale: Neste contexto, a conjunção introduz uma contraposição simultânea, bem expressa por “enquanto”.
- source_word: חָרֵב
  choice: está em ruínas
  rationale: Expressa naturalmente em português o estado contínuo de devastação ou abandono indicado pelo adjetivo.
theological_decisions:
- issue: Referente de “esta casa”
  choice: Conservar “esta casa”, que no contexto se refere ao templo do SENHOR
  alternative: Explicitar “este templo” no texto principal
  rationale: Ageu 1:2, 8-9 identifica claramente o referente, mas manter “esta casa” preserva a formulação hebraica e a contraposição verbal com as casas do povo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “vocês” adequado à legibilidade brasileira. A pergunta retórica preserva a censura profética e a ênfase do hebraico sem explicitar no corpo do texto que “esta casa” é o templo.
