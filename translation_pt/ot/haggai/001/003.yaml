base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/003.yaml
  text: Then the word of Yahweh came by the hand of Haggai the prophet[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio por meio do profeta Ageu, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa introduz o acontecimento seguinte; em português, “Então ... veio” expressa com naturalidade essa progressão.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética, דָּבָר designa a palavra ou mensagem divina; “a palavra” preserva o idioma tradicional da revelação profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד
  choice: por meio de
  rationale: A expressão hebraica literalmente significa “pela mão de” e indica agência mediadora; “por meio de” comunica esse sentido de maneira natural em português.
- source_word: חַגַּי
  choice: Ageu
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: O título em aposição identifica a função de Ageu; em português, sua colocação antes do nome produz uma formulação natural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala divina que vem em seguida; “dizendo” preserva de modo transparente a fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Agência profética em בְּיַד
  choice: por meio do profeta Ageu
  alternative: pela mão de Ageu, o profeta
  rationale: A expressão indica que Ageu é o mediador da palavra divina. A tradução natural preserva essa agência sem sugerir uma mão física.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A ordem “por meio do profeta Ageu” é idiomática em português e mantém tanto a mediação quanto o título profético.
