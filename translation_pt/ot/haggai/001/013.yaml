reference: Haggai 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חַגַּ֞י מַלְאַ֧ךְ יְהוָ֛ה בְּ/מַלְאֲכ֥וּת יְהוָ֖ה לָ/עָ֣ם לֵ/אמֹ֑ר אֲנִ֥י אִתְּ/כֶ֖ם נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/013.yaml
  text: Then Haggai[a], the messenger of Yahweh, spoke to the people with Yahweh’s message, saying[b], “I am with you,” declares Yahweh.
translation:
  language: pt
  text: 'Então Ageu, mensageiro de Yahweh, falou ao povo por encargo de Yahweh[a]: “Eu estou com vocês”, declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a mensagem de Yahweh” ou “na função de mensageiro de Yahweh”. A expressão hebraica pode indicar a comissão, a função ou a missão segundo a qual Ageu falou.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... falou
  rationale: O verbo comum significa “dizer”. “Falou ao povo” é natural em português e introduz adequadamente a declaração direta.
- source_word: מַלְאַךְ יְהוָה
  choice: mensageiro de Yahweh
  rationale: A aposição identifica Ageu como enviado humano de Yahweh; “anjo” sugeriria indevidamente um ser celestial.
- source_word: בְּמַלְאֲכוּת יְהוָה
  choice: por encargo de Yahweh
  rationale: O substantivo raro pode indicar função, comissão ou missão de mensageiro. “Por encargo de Yahweh” expressa naturalmente a autoridade com que Ageu falou, sem reduzir a frase apenas ao conteúdo da mensagem.
- source_word: לָעָם
  choice: ao povo
  rationale: Refere-se de modo simples e natural à comunidade à qual o profeta se dirige.
- source_word: אֲנִי אִתְּכֶם
  choice: Eu estou com vocês
  rationale: Mantém a simplicidade e a força da garantia divina; “vocês” torna explícito em português moderno que o pronome hebraico está no plural.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz de forma idiomática e digna a fórmula profética que afirma a autoridade divina da declaração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de מַלְאַךְ aplicado a Ageu
  choice: mensageiro humano
  alternative: anjo de Yahweh
  rationale: Ageu é nomeado em aposição como o enviado de Yahweh. O contexto aponta para sua função profética, não para uma identidade angelical.
- issue: Relação de בְּמַלְאֲכוּת יְהוָה com a fala de Ageu
  choice: por encargo de Yahweh
  alternative: com a mensagem de Yahweh; na função de mensageiro de Yahweh
  rationale: A expressão hebraica incomum admite nuances de comissão, função ou missão. A tradução principal ressalta a comissão divina, e a nota preserva as demais possibilidades legítimas.
- issue: Representação do Tetragrama
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita “anjo” para o mensageiro humano e conserva em nota a amplitude semântica da expressão hebraica rara.
