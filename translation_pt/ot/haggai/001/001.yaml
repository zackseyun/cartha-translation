  text: בִּ/שְׁנַ֤ת שְׁתַּ֨יִם֙ לְ/דָרְיָ֣וֶשׁ הַ/מֶּ֔לֶךְ בַּ/חֹ֨דֶשׁ֙ הַ/שִּׁשִּׁ֔י בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָ֨ה דְבַר יְהוָ֜ה בְּ/יַד חַגַּ֣י הַ/נָּבִ֗יא אֶל זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֧עַ בֶּן יְהוֹצָדָ֛ק הַ/כֹּהֵ֥ן הַ/גָּד֖וֹל לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/001.yaml
  text: 'In the second year of King Darius[a], in the sixth month, on the first day of the month, the word of Yahweh came by the hand of Haggai the prophet to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Jehozadak, the high priest, saying:'
translation:
  language: pt
  text: 'No segundo ano do rei Dario, no sexto mês, no primeiro dia do mês, a palavra de Yahweh veio por meio de Ageu, o profeta[a], a Zorobabel, filho de Sealtiel, governador de Judá, e a Josué, filho de Jeozadaque, o sumo sacerdote, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela mão de Ageu, o profeta”.
    reason: Registra a forma concreta do idioma hebraico בְּיַד, traduzido no texto por sua função de mediação.
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: No segundo ano do rei Dario
  rationale: A expressão construta emprega o numeral com sentido ordinal numa datação régia; esta é a formulação natural e precisa em português.
- source_word: בַּחֹדֶשׁ הַשִּׁשִּׁי
  choice: no sexto mês
  rationale: Mantém a designação numérica presente no hebraico, sem acrescentar um nome de mês posterior que o texto não fornece.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: Em fórmulas de data, o cardinal hebraico 'um' tem função ordinal; 'primeiro dia' é o equivalente idiomático em português.
- source_word: הָיָה דְבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: A fórmula profética descreve a ocorrência da revelação; 'veio' comunica esse sentido de modo natural sem ampliar o conteúdo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: por meio de Ageu, o profeta
  rationale: Expressa com clareza a ideia de mediação ou agência do idioma hebraico 'pela mão de'; a forma literal é registrada em nota.
- source_word: פַּחַת יְהוּדָה
  choice: governador de Judá
  rationale: O termo designa o governador provincial no período persa; 'governador' é o equivalente moderno mais claro.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: Equivalente português consagrado e preciso para o título sacerdotal hebraico, literalmente 'o grande sacerdote'.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula introdutória hebraica e prepara diretamente o discurso que segue.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A forma 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Mediação profética na expressão בְּיַד
  choice: por meio de Ageu, o profeta
  alternative: pela mão de Ageu, o profeta
  rationale: A opção principal comunica a agência profética em português corrente, sem sugerir que a mensagem se originou em Ageu; a nota conserva a imagem literal hebraica.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A longa fórmula cronológica e os títulos oficiais foram preservados. Os nomes próprios seguem formas portuguesas correntes: Dario, Ageu, Zorobabel, Sealtiel, Josué e Jeozadaque.'
