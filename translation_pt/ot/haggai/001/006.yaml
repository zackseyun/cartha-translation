  text: זְרַעְתֶּ֨ם הַרְבֵּ֜ה וְ/הָבֵ֣א מְעָ֗ט אָכ֤וֹל וְ/אֵין לְ/שָׂבְעָה֙ שָׁת֣וֹ וְ/אֵין לְ/שָׁכְרָ֔ה לָב֖וֹשׁ וְ/אֵין לְ/חֹ֣ם ל֑/וֹ וְ/הַ֨/מִּשְׂתַּכֵּ֔ר מִשְׂתַּכֵּ֖ר אֶל צְר֥וֹר נָקֽוּב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/006.yaml
  text: You have sown much[a], but brought in little. You eat, but there is not enough to be satisfied; you drink, but there is not enough to be filled; you clothe yourselves, but no one is warm[c][b]; and the one who earns wages earns them for a bag with holes.
translation:
  language: pt
  text: Vocês semearam muito, mas recolheram pouco[a]. Comem, mas não chegam a se fartar; bebem, mas não chegam a se embriagar[b]; vestem-se, mas ninguém se aquece[c]; e o assalariado recebe seu salário para pô-lo numa bolsa furada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mas trazem pouco [para dentro]”, expressão que se refere a uma colheita escassa.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “bebem, mas não até a embriaguez”. O termo hebraico se refere especificamente a ficar embriagado, e não apenas a matar a sede.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “mas não há calor para ele”. O pronome singular tem sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרַעְתֶּם הַרְבֵּה
  choice: Vocês semearam muito
  rationale: O perfeito qal na segunda pessoa do plural dirige a acusação ao povo. O pretérito perfeito em português expressa naturalmente a ação realizada cujos resultados ainda se fazem sentir.
- source_word: וְהָבֵא מְעָט
  choice: mas recolheram pouco
  rationale: A expressão significa literalmente “trazer para dentro pouco” e, neste contexto agrícola, refere-se à pequena quantidade recolhida da colheita. “Recolheram pouco” conserva a imagem sem exigir uma formulação pouco natural.
- source_word: אָכוֹל וְאֵין לְשָׂבְעָה
  choice: Comem, mas não chegam a se fartar
  rationale: A construção concisa descreve alimentação contínua que não resulta em saciedade. “Não chegam a se fartar” comunica tanto a ação quanto o resultado frustrado.
- source_word: שָׁתוֹ וְאֵין לְשָׁכְרָה
  choice: bebem, mas não chegam a se embriagar
  rationale: A raiz שׁכר se refere especificamente à embriaguez ou intoxicação, não apenas a matar a sede. A tradução mantém esse sentido lexical, embora possa soar inesperado no contexto de privação.
- source_word: לָבוֹשׁ וְאֵין לְחֹם לוֹ
  choice: vestem-se, mas ninguém se aquece
  rationale: O pronome hebraico singular tem valor genérico. “Ninguém” torna essa força geral natural em português e preserva o padrão de provisão que não alcança seu efeito.
- source_word: וְהַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר
  choice: e quem ganha salário o guarda
  rationale: O particípio e a forma verbal repetem a mesma raiz e destacam o trabalhador assalariado e o salário recebido. Em português, o pronome “o” evita uma repetição pesada, enquanto o conjunto permanece claro.
- source_word: אֶל צְרוֹר נָקוּב
  choice: numa bolsa furada
  rationale: A imagem é a de uma pequena bolsa ou saco para dinheiro perfurado, de modo que o pagamento desaparece. “Bolsa furada” é vívido, corrente e fiel à metáfora.
theological_decisions:
- issue: O sentido de לְשָׁכְרָה na descrição da bebida
  choice: não chegam a se embriagar
  alternative: não bebem o suficiente / não ficam satisfeitos
  rationale: Embora o paralelismo de privação possa sugerir falta de satisfação, a palavra hebraica aponta especificamente para embriaguez. A tradução não suaviza esse dado nem o transforma numa aprovação moral da embriaguez; apenas conserva a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”, de boa legibilidade brasileira. A sequência paralela e cumulativa do hebraico foi mantida com verbos diretos e pontuação clara. As notas registram os pontos em que a formulação natural em português se afasta da literalidade ou em que o hebraico conserva uma tensão lexical.
