  text: עַל כֵּ֣ן עֲלֵי/כֶ֔ם כָּלְא֥וּ שָמַ֖יִם מִ/טָּ֑ל וְ/הָ/אָ֖רֶץ כָּלְאָ֥ה יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/010.yaml
  text: Therefore the heavens above you have withheld the dew[a], and the earth has withheld its produce.
translation:
  language: pt
  text: Por isso, os céus acima de vocês retiveram o orvalho, e a terra reteve a sua produção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e a terra reteve o seu rendimento”. O hebraico אֶרֶץ pode significar “terra” ou “região”, e יְבוּל pode ser traduzido como “produção” ou “rendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural a relação de causa e consequência com a repreensão anterior.
- source_word: עֲלֵיכֶם
  choice: acima de vocês
  rationale: Com “os céus”, o sentido espacial é o mais natural e reproduz claramente a preposição hebraica.
- source_word: כָּלְאוּ / כָּלְאָה
  choice: retiveram / reteve
  rationale: O verbo כלא indica impedir ou reter. A repetição do mesmo verbo preserva o paralelismo do hebraico.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Mantém o plural hebraico e o registro bíblico, além de formar o par poético com “a terra”.
- source_word: מִטָּל
  choice: o orvalho
  rationale: Depois de כלא, a preposição מן assinala aquilo que foi retido; em português, a construção idiomática é “reter o orvalho”.
- source_word: וְהָאָרֶץ
  choice: e a terra
  rationale: Embora אֶרֶץ também possa significar “terra” no sentido de território ou solo, o paralelo com “os céus” favorece aqui “a terra”.
- source_word: יְבוּלָהּ
  choice: a sua produção
  rationale: יְבוּל designa a produção ou colheita agrícola. “Produção” é abrangente e não especifica indevidamente um tipo de cultivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O paralelismo entre “os céus” e “a terra” e a repetição de “reter” foram preservados.
