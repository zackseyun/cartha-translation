base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Este povo diz[a]: ‘Não chegou o tempo, o tempo de a casa de Yahweh ser reconstruída[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica pode transmitir um tom de distanciamento ou repreensão.
    reason: lexical_alternative
  - marker: b
    text: Ou “ser construída”. O infinitivo hebraico não expressa por si só o sentido de “re-”, mas o contexto pós-exílico indica uma reconstrução.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem portuguesa natural e solene; o perfeito hebraico funciona aqui como declaração performativa presente.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo corrente, abrangendo as forças celestes e terrenas sem restringir o referente.
- source_word: הָעָם הַזֶּה
  choice: Este povo
  rationale: Reproduz de perto o singular coletivo hebraico e permite que o demonstrativo conserve seu possível tom de distanciamento ou repreensão.
- source_word: לֹא עֶת בֹּא עֶת
  choice: Ainda não chegou o tempo, o tempo
  rationale: Expressa naturalmente a alegação de que o momento ainda não chegou e conserva a repetição enfática de עֶת.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a metáfora e a formulação pactual do hebraico, sem substituí-la pela explicitação interpretativa 'templo'.
- source_word: לְהִבָּנוֹת
  choice: ser reconstruída
  rationale: O infinitivo nifal é passivo, literalmente 'ser construída'; no contexto pós-exílico, trata-se da restauração da casa anteriormente destruída.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
- issue: Nuance de הָעָם הַזֶּה
  choice: Este povo
  alternative: Esse povo
  rationale: '''Este povo'' reflete formalmente o demonstrativo hebraico, enquanto a nota registra o possível tom de distância ou censura sem torná-lo obrigatório no texto principal.'
- issue: Sentido histórico de לְהִבָּנוֹת
  choice: ser reconstruída
  alternative: ser construída
  rationale: O contexto pós-exílico favorece claramente a reconstrução, embora o elemento 're-' não esteja lexicalmente expresso no infinitivo hebraico; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A fórmula profética conserva solenidade sem arcaísmo; a repetição de “o tempo” mantém a ênfase do hebraico.
