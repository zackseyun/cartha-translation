language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע זְרֻבָּבֶ֣ל בֶּֽן שַׁלְתִּיאֵ֡ל וִ/יהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/כֹ֣ל שְׁאֵרִ֣ית הָ/עָ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/עַל דִּבְרֵי֙ חַגַּ֣י הַ/נָּבִ֔יא כַּ/אֲשֶׁ֥ר שְׁלָח֖/וֹ יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/עָ֖ם מִ/פְּנֵ֥י יְהוָֽה׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/012.yaml
  text: Then Zerubbabel son of Shealtiel[a], and Joshua son of Jehozadak, the high priest, and all the remnant of the people, listened to the voice of Yahweh their God and to the words of Haggai the prophet, as Yahweh their God had sent him[d][c][b]; and the people feared before Yahweh.
translation:
  language: pt
  text: Então Zorobabel, filho de Sealtiel, Josué, filho de Jeozadaque, o sumo sacerdote, e todo o remanescente do povo deram ouvidos[a] à voz de Yahweh, seu Deus, e às palavras do profeta Ageu, como Yahweh, seu Deus, o havia enviado[c]. E o povo temeu diante de Yahweh[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouviram” ou “obedeceram”; o verbo hebraico pode indicar ouvir com uma disposição correspondente de atender.
    reason: lexical_alternative
  - marker: c
    text: Ou “porque Yahweh, seu Deus, o havia enviado”.
    reason: alternative_reading
  - marker: d
    text: Ou “ficou cheio de reverência diante de Yahweh”; o hebraico pode expressar tanto temor reverente quanto medo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: deram ouvidos
  rationale: O verbo שׁמע pode significar ouvir, escutar com atenção ou obedecer. “Deram ouvidos” comunica uma escuta receptiva, sugerindo resposta sem explicitar plenamente a obediência.
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: Zorobabel, filho de Sealtiel
  rationale: Empregam-se as formas tradicionais e reconhecíveis dos nomes em português.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Josué, filho de Jeozadaque
  rationale: Empregam-se formas portuguesas reconhecíveis, distinguindo יְהוֹשֻׁעַ da forma hebraica abreviada Jesua.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: É o título consagrado e natural em português para o principal sacerdote.
- source_word: שְׁאֵרִית הָעָם
  choice: o remanescente do povo
  rationale: “Remanescente” preserva tanto o sentido dos sobreviventes quanto a ressonância profética da comunidade da aliança que permaneceu.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיהֶם
  choice: à voz de Yahweh, seu Deus
  rationale: A construção com שׁמע é naturalmente expressa por “dar ouvidos à voz”; Yahweh translitera o nome divino, e “seu Deus” retoma conjuntamente os sujeitos.
- source_word: דִּבְרֵי חַגַּי הַנָּבִיא
  choice: às palavras do profeta Ageu
  rationale: “Palavras” preserva o plural e o paralelo com “voz”; Ageu é a forma tradicional portuguesa do nome.
- source_word: כַּאֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם
  choice: conforme Yahweh, seu Deus, o havia enviado
  rationale: “Conforme” mantém o valor comparativo ou correspondente de כַּאֲשֶׁר sem excluir totalmente uma nuance causal contextual.
- source_word: וַיִּירְאוּ הָעָם מִפְּנֵי יְהוָה
  choice: E o povo temeu diante de Yahweh
  rationale: “Temeu” conserva a amplitude de ירא entre temor, reverência e assombro; “diante de” representa de modo direto מִפְּנֵי.
theological_decisions:
- issue: Sentido de שְׁאֵרִית no contexto profético
  choice: o remanescente do povo
  alternative: o restante do povo
  rationale: “Remanescente” conserva a possível dimensão histórico-teológica da comunidade sobrevivente sem negar o sentido quantitativo comum.
- issue: Nuance de שׁמע diante da palavra profética
  choice: deram ouvidos
  alternative: ouviram; obedeceram
  rationale: A formulação escolhida abrange audição atenta e resposta, mas não transforma a nuance de obediência em sentido exclusivo.
- issue: Relação expressa por כַּאֲשֶׁר
  choice: conforme Yahweh, seu Deus, o havia enviado
  alternative: porque Yahweh, seu Deus, o havia enviado
  rationale: A escolha preserva mais diretamente a forma comparativa/correspondente do hebraico, enquanto a nota registra a leitura causal possível.
- issue: Natureza do temor em וַיִּירְאוּ
  choice: temeu diante de Yahweh
  alternative: ficou cheio de reverência diante de Yahweh
  rationale: “Temeu” mantém em tensão reverência, assombro e medo, sem reduzir o termo a uma única reação religiosa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas nominais tradicionais em português. A sintaxe foi levemente ajustada para concordância natural com o sujeito composto. O nome divino foi transliterado como “Yahweh”. Todos os marcadores de nota foram posicionados junto às expressões a que se referem.
