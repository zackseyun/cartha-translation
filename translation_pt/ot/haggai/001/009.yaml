source:
  edition: WLC
  text: פָּנֹ֤ה אֶל הַרְבֵּה֙ וְ/הִנֵּ֣ה לִ/מְעָ֔ט וַ/הֲבֵאתֶ֥ם הַ/בַּ֖יִת וְ/נָפַ֣חְתִּי ב֑/וֹ יַ֣עַן מֶ֗ה נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת יַ֗עַן בֵּיתִ/י֙ אֲשֶׁר ה֣וּא חָרֵ֔ב וְ/אַתֶּ֥ם רָצִ֖ים אִ֥ישׁ לְ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/009.yaml
  text: You looked for much[a], but behold, it was little; and when you brought it home, I blew it away. Why? declares Yahweh of Armies. Because of my house, which lies in ruins[b], while each of you runs to his own house.
translation:
  language: pt
  text: 'Vocês esperavam muito, mas vejam: foi pouco. E, quando o trouxeram para casa, eu soprei sobre ele.[a] Por quê? — declara Yahweh dos Exércitos. Porque a minha casa está em ruínas, enquanto cada um de vocês corre para a sua própria casa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu o dissipei com um sopro”. O verbo hebraico significa literalmente “soprar” ou “respirar”; neste contexto, pode sugerir que Deus fez o produto se dispersar ou se reduzir a nada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנֹה אֶל הַרְבֵּה
  choice: Vocês esperavam muito
  rationale: A construção idiomática expressa a expectativa de uma colheita abundante. “Esperavam” comunica o sentido contextual com naturalidade, sem reduzir o verbo a um simples ato físico de virar-se.
- source_word: וְהִנֵּה לִמְעָט
  choice: 'mas vejam: foi pouco'
  rationale: הִנֵּה chama vividamente a atenção, e לִמְעָט indica o resultado escasso. “Vejam” é uma forma atual e digna de conservar esse destaque.
- source_word: וַהֲבֵאתֶם הַבַּיִת
  choice: quando o trouxeram para casa
  rationale: Aqui הַבַּיִת se refere naturalmente à casa dos destinatários, em contraste com “minha casa” mais adiante. O pronome retoma aquilo que colheram ou produziram, implícito no contexto.
- source_word: וְנָפַחְתִּי בוֹ
  choice: eu o dissipei com um sopro
  rationale: נפח significa literalmente soprar ou respirar. A formulação preserva a imagem hebraica e explicita seu efeito contextual — o desaparecimento ou dispersão do produto — sem transformar a metáfora em mera abstração.
- source_word: יַעַן מֶה
  choice: Por quê?
  rationale: A expressão introduz uma pergunta retórica direta sobre a causa do juízo.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: נְאֻם é uma fórmula profética de declaração; o nome divino é transliterado como “Yahweh”, e צְבָאוֹת é traduzido de modo transparente como “dos Exércitos”.
- source_word: יַעַן בֵּיתִי אֲשֶׁר הוּא חָרֵב
  choice: Porque a minha casa está em ruínas
  rationale: חָרֵב descreve algo devastado ou desolado. “Está em ruínas” é claro, vívido e apropriado ao templo negligenciado.
- source_word: וְאַתֶּם רָצִים אִישׁ לְבֵיתוֹ
  choice: enquanto cada um de vocês corre para a sua própria casa
  rationale: רָצִים conserva a ideia enfática de correr, indicando urgência e prioridade equivocada. A construção distributiva אִישׁ לְבֵיתוֹ é reproduzida naturalmente por “cada um ... sua própria casa”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Tradução do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos Celestiais; dos Poderes; dos exércitos
  rationale: “Dos Exércitos” conserva o plural e a força militar do título hebraico, sem determinar no corpo do texto quais forças estão especificamente em vista.
- issue: Força causal de יַעַן após a pergunta
  choice: Porque a minha casa está em ruínas
  alternative: Por causa da minha casa, que está em ruínas
  rationale: 'A oração responde diretamente a “Por quê?” e mantém a acusação divina: a casa de Yahweh permanece arruinada enquanto o povo prioriza as próprias casas.'
- issue: Referência distributiva masculina de אִישׁ לְבֵיתוֹ
  choice: cada um de vocês ... a sua própria casa
  alternative: cada homem ... a casa dele
  rationale: A formulação preserva a distribuição individual e a posse singular sem introduzir em português uma exclusão de gênero mais forte do que o uso representativo do hebraico exige.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O plural “vocês” representa os destinatários coletivos; “cada um ... sua” mantém a distribuição individual. A interjeição hebraica foi vertida por “vejam”, mais natural no português atual do que “eis”. O travessão separa com clareza a fórmula profética.
