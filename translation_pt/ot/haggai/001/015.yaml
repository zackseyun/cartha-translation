  language: pt
  text: no dia vinte e quatro do sexto mês, no segundo ano do rei Dario.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם
  choice: no dia
  rationale: A preposição בְּ em uma fórmula de data tem valor temporal; “no dia” é a forma idiomática em português.
- source_word: עֶשְׂרִים וְאַרְבָּעָה
  choice: vinte e quatro
  rationale: Embora o hebraico use numerais cardinais, o português expressa naturalmente esta data como “dia vinte e quatro”.
- source_word: לַחֹדֶשׁ בַּשִּׁשִּׁי
  choice: do sexto mês
  rationale: A expressão identifica o mês pelo número ordinal; “do sexto mês” preserva com clareza a fórmula calendárica.
- source_word: בִּשְׁנַת שְׁתַּיִם
  choice: no segundo ano
  rationale: Trata-se da fórmula usual para indicar o ano de reinado, expressa idiomaticamente com ordinal em português.
- source_word: לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: do rei Dario
  rationale: O לְ marca o soberano cujo ano de reinado está sendo contado. “Do rei Dario” é natural em português e preserva explicitamente o título presente no hebraico.
