  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/007.yaml
  text: 'Thus says Yahweh of hosts: Consider your ways.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Reflitam sobre os seus caminhos”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Ponham o coração nos seus caminhos”.'
    reason: Registra a forma concreta da expressão hebraica שִׂימוּ לְבַבְכֶם עַל, cuja força idiomática foi traduzida no texto por “Reflitam sobre”.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e solene a fórmula hebraica que introduz uma mensagem profética; o perfeito אָמַר tem valor formular e é bem expresso pelo presente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, sem substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Mantém a amplitude do título divino, que pode evocar exércitos celestes e terrenos, sem restringir indevidamente seu referente.
- source_word: שִׂימוּ לְבַבְכֶם עַל
  choice: Reflitam sobre
  rationale: Traduz naturalmente a expressão idiomática que, literalmente, manda pôr ou dirigir o coração para algo. O imperativo plural é preservado na forma verbal portuguesa.
- source_word: דַּרְכֵיכֶם
  choice: os seus caminhos
  rationale: Conserva a metáfora hebraica dos caminhos, que neste contexto abrange a conduta e o rumo de vida dos destinatários.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o tetragrama; a transliteração preserva o caráter de nome próprio sem trocá-lo por um título.
- issue: Alcance do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos celestiais
  rationale: A forma mais ampla evita decidir se o título se refere exclusivamente a seres celestiais, a forças terrenas ou a ambos.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A fórmula profética foi mantida em registro elevado, enquanto a exortação foi vertida idiomaticamente. As aspas identificam como citação a mensagem divina introduzida pela fórmula.
