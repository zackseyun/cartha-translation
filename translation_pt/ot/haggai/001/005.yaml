source:
  edition: WLC
  text: וְ/עַתָּ֕ה כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/005.yaml
  text: 'Now therefore[a], thus says Yahweh of hosts: Set your heart on your ways.'
translation:
  language: pt
  text: 'Agora, portanto, assim diz Yahweh dos Exércitos: “Reflitam sobre os caminhos de vocês.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Ponham o coração nos caminhos de vocês.”'
    reason: Preserva a imagem concreta do hebraico שִׂימוּ לְבַבְכֶם עַל דַּרְכֵיכֶם, vertida idiomaticamente no texto como um chamado à reflexão séria.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: A combinação da conjunção com o advérbio temporal introduz uma conclusão exortativa baseada na repreensão anterior, não apenas uma indicação de tempo.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva de modo natural e digno a fórmula profética de mensageiro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Mantém o título divino tradicional e sua imagem de soberania guerreira sem restringir os exércitos ao âmbito terreno ou celestial.
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Reflitam
  rationale: O hebraísmo, literalmente 'ponham o coração', convoca os ouvintes a dirigir atenção séria e ponderada à própria conduta. 'Reflitam' comunica essa função com naturalidade em português; a imagem literal é preservada em nota.
- source_word: עַל דַּרְכֵיכֶם
  choice: sobre os caminhos de vocês
  rationale: Conserva a metáfora hebraica de 'caminhos' como modo de viver, enquanto a preposição 'sobre' se integra naturalmente ao verbo 'reflitir'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal mediante transliteração, sem substituí-lo por um título.
- issue: Alcance de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos exércitos celestiais
  rationale: A formulação mais ampla evita decidir se a referência abrange especificamente forças celestiais, terrenas ou ambas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. A fala divina foi marcada por aspas para clareza. A tradução principal comunica naturalmente o valor idiomático, enquanto a nota conserva a metáfora explícita do coração.
