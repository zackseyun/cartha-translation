base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
translation:
  language: pt
  text: 'E chamei a seca sobre a terra e sobre os montes, sobre o cereal, sobre o vinho novo, sobre o azeite[a], sobre tudo o que o solo produz, sobre o ser humano[b] e sobre os animais, e sobre todo o trabalho das mãos.


    [a] Ou “óleo fresco”. O termo hebraico se refere provavelmente ao azeite como produto agrícola.


    [b] Ou “a humanidade”. O hebraico emprega aqui um substantivo singular em sentido genérico para os seres humanos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “óleo fresco”. O termo hebraico se refere provavelmente ao azeite como produto agrícola.
    reason: lexical_alternative
  - marker: b
    text: Ou “a humanidade”. O hebraico emprega aqui um substantivo singular em sentido genérico para os seres humanos.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: convoquei
  rationale: Neste contexto, קרא expressa a ação de chamar ou fazer vir um juízo. “Convoquei” preserva a agência divina e a força da imagem sem explicá-la em excesso.
- source_word: חֹרֶב
  choice: a seca
  rationale: No contexto agrícola, חֹרֶב indica seca ou ressecamento; “seca” é a formulação mais clara e natural.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se à terra da região atingida pelo juízo, especialmente em seu aspecto agrícola, e não necessariamente ao planeta inteiro.
- source_word: הֶהָרִים
  choice: os montes
  rationale: “Montes” traduz diretamente o plural hebraico e soa natural no registro profético em português.
- source_word: הַדָּגָן
  choice: o cereal
  rationale: דָּגָן é um termo coletivo para a produção de grãos. “Cereal” mantém aqui o valor coletivo e agrícola.
- source_word: הַתִּירוֹשׁ
  choice: o vinho novo
  rationale: תִּירוֹשׁ designa vinho novo ou recém-produzido; a tradução conserva a distinção lexical do hebraico.
- source_word: הַיִּצְהָר
  choice: o azeite
  rationale: יִצְהָר se refere ao óleo agrícola, normalmente azeite de oliva. “Azeite” é claro e idiomático, enquanto a alternativa mais formal é registrada em nota.
- source_word: אֲשֶׁר תּוֹצִיא הָאֲדָמָה
  choice: tudo o que o solo produz
  rationale: A expressão abrange toda a produção do solo e mantém a imagem concreta da terra que faz brotar seus produtos.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: אָדָם está no singular genérico e contrasta com os animais. “O ser humano” preserva o singular representativo sem sugerir apenas indivíduos masculinos.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: בְּהֵמָה pode indicar animais em geral, especialmente animais domésticos. “Animais” é atual e abrange adequadamente o sentido contextual.
- source_word: כָּל יְגִיעַ כַּפָּיִם
  choice: todo o trabalho das mãos
  rationale: A formulação conserva a imagem hebraica do esforço manual e pode incluir tanto o trabalho quanto seus resultados.
theological_decisions:
- issue: Sentido genérico de הָאָדָם
  choice: o ser humano
  alternative: a humanidade
  rationale: O singular genérico é mantido por “o ser humano”, preservando também o contraste retórico com os animais. “A humanidade” explicita o sentido coletivo e é oferecido em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência profética preservada pela repetição de “sobre”. Optou-se por vocabulário agrícola corrente e por “o ser humano” para comunicar o singular genérico hebraico com clareza.
