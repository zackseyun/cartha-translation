base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/016.yaml
  text: You multiplied your merchants more than the stars of the heavens[b][a]; the locust strips bare and flies away.
translation:
  language: pt
  text: Você multiplicou seus comerciantes mais do que as estrelas dos céus; o gafanhoto[a] devasta[b] e voa embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o gafanhoto jovem”; o termo hebraico pode designar um tipo ou uma fase particular do gafanhoto.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode significar “espalha-se”, “despoja” ou “descobre”; neste contexto, pode retratar a ação do gafanhoto antes de ele partir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּית
  choice: Você multiplicou
  rationale: O hifil perfeito na segunda pessoa feminina singular dirige-se a Nínive como cidade personificada. “Multiplicou” conserva a ideia de tornar numerosos.
- source_word: רֹכְלַיִךְ
  choice: seus comerciantes
  rationale: O termo designa mercadores ou negociantes; “comerciantes” é corrente, claro e adequado à imagem da importância econômica de Nínive.
- source_word: מִכּוֹכְבֵי הַשָּׁמָיִם
  choice: mais do que as estrelas dos céus
  rationale: A preposição מִן tem valor comparativo depois de רבה. “Dos céus” preserva o plural hebraico em linguagem portuguesa natural e digna.
- source_word: יֶלֶק
  choice: o gafanhoto
  rationale: O substantivo parece indicar uma espécie ou fase particular do gafanhoto, mas não há equivalente português comum que permita maior precisão sem especulação. A alternativa é registrada em nota.
- source_word: פָּשַׁט
  choice: arrasa tudo
  rationale: O verbo pode expressar despir, despojar, saquear ou espalhar-se. No quadro da devastação causada pelo gafanhoto antes de partir, “arrasa tudo” comunica naturalmente o efeito destrutivo sem impor uma identificação técnica incerta.
- source_word: וַיָּעֹף
  choice: e sai voando
  rationale: A forma narrativa de עוּף descreve o voo subsequente. “Sai voando” transmite de modo natural tanto a ação quanto o desaparecimento repentino.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A segunda pessoa singular mantém a fala direta a Nínive personificada. O ponto e vírgula conserva a ligação estreita entre a multidão de comerciantes e a imagem do gafanhoto, sem explicar além do que o hebraico afirma.
