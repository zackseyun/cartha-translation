    rationale: Em português contemporâneo, sobretudo no Brasil, “carros” normalmente designa automóveis. “Carro de guerra” transmite o referente antigo de מֶרְכָּבָה.
  - severity: low
    issue: “Estrondo” é excessivamente específico para רַעַשׁ
    rationale: O termo hebraico pode indicar ruído, tremor ou chocalhar. “Ruído da roda” conserva essa amplitude e a imagem auditiva sem introduzir a ideia mais forte de estrondo.
