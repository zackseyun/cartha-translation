  yaml_path: translation/ot/nahum/003/002.yaml
  text: The crack of the whip[a], and the rumble of the wheel[b], with galloping horse and bounding chariot!
translation:
  language: pt
  text: O estalo do chicote[a], o ruído da roda[b], um cavalo a galope e um carro de guerra aos saltos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O som do chicote e o som ruidoso da roda”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico acumula imagens sonoras breves, sem verbo finito, intensificando a sensação imediata da cena de batalha.
    reason: cultural_note
lexical_decisions:
- source_word: ק֣וֹל
  choice: estalo / estrondo
  rationale: קוֹל significa amplamente som, ruído ou voz. Em português, especificar os sons associados ao chicote e às rodas produz uma cena auditiva viva e natural.
- source_word: שׁ֔וֹט
  choice: chicote
  rationale: É o termo comum e claro para o instrumento usado para conduzir ou golpear, apropriado ao contexto dos carros.
- source_word: רַ֣עַשׁ
  choice: estrondo
  rationale: O substantivo pode indicar tremor, ruído forte ou retinir. Com rodas, “estrondo” comunica o som pesado e intenso da cena, embora “ruído” seja uma alternativa mais genérica.
- source_word: אוֹפָ֑ן
  choice: rodas
  rationale: O sentido básico é “roda”. O plural natural em português representa as rodas dos carros presentes na cena sem precisar explicitar isso no texto.
- source_word: ס֣וּס
  choice: cavalos
  rationale: O hebraico diz simplesmente “cavalo”; não se acrescenta “de guerra”. O plural coletivo soa natural na sequência da batalha.
- source_word: דֹּהֵ֔ר
  choice: a galope
  rationale: O particípio descreve o movimento veloz do cavalo. “A galope” é vivo, idiomático e específico desse movimento.
- source_word: מֶרְכָּבָ֖ה
  choice: carros
  rationale: Aqui designa carros de guerra. “Carros” é claro no contexto e mantém a imagem concreta, com plural representativo natural em português.
- source_word: מְרַקֵּדָֽה
  choice: saltando
  rationale: Derivado de uma raiz que significa saltar ou dançar, descreve os carros sacudidos pelo movimento. “Saltando” preserva a imagem física sem sugerir uma dança festiva.
