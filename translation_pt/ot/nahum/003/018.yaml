  naturalness: O texto é claro e idiomático em português moderno. «Teus» evita a possível ambiguidade de «seus» em uma fala dirigida diretamente ao rei; «dormem» é natural, solene e mais fiel que «cochilam».
  terminology: «Pastores» preserva corretamente a imagem hebraica para líderes; «nobres» é uma boa opção para אַדִּירֶיךָ. «Repousam» comunica a leitura contextual de יִשְׁכְּנוּ, cuja alternativa de «habitar» deve continuar assinalada em nota.
