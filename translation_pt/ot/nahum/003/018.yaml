base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/018.yaml
  text: Your shepherds slumber[a], O king of Assyria; your nobles lie down. Your people are scattered on the mountains[d][c][b], and there is no one to gather them.
translation:
  language: pt
  text: Teus pastores dormem[a], ó rei da Assíria; teus nobres repousam[b]. Teu povo está disperso sobre os montes[c], e não há quem o reúna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cochilam”. A imagem hebraica pode sugerir líderes negligentes ou incapacitados.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico geralmente pode significar “habitar”, mas aqui talvez descreva os nobres deitados ou inativos.
    reason: alternative_reading
  - marker: c
    text: 'A forma hebraica traduzida por “está disperso” é difícil; esse sentido é sustentado pela frase seguinte: “não há quem o reúna”.'
    reason: textual_variant
lexical_decisions:
- source_word: נָמוּ
  choice: cochilam
  rationale: O verbo נום denota dormir ou estar sonolento. “Cochilam” preserva a imagem poética de líderes inativos ou incapacitados sem afirmar explicitamente que estejam mortos.
- source_word: רֹעֶיךָ
  choice: seus pastores
  rationale: Mantém a metáfora hebraica para os governantes ou líderes da Assíria.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ó rei da Assíria
  rationale: O contexto indica discurso direto; “ó” expressa naturalmente o vocativo em português.
- source_word: יִשְׁכְּנוּ
  choice: repousam
  rationale: Embora שכן normalmente possa significar “habitar”, o paralelismo com o cochilo dos pastores favorece a ideia de repouso ou inatividade, sem eliminar a ambiguidade lexical.
- source_word: אַדִּירֶיךָ
  choice: seus nobres
  rationale: O termo pode designar pessoas poderosas, ilustres ou nobres; aqui aponta para a elite dirigente assíria.
- source_word: נָפֹשׁוּ
  choice: está disperso
  rationale: A forma hebraica é difícil, mas a referência aos montes e a ausência de quem reúna o povo sustentam contextualmente o sentido de dispersão.
- source_word: עַמְּךָ
  choice: seu povo
  rationale: Preserva o sentido comum do substantivo, sem restringi-lo indevidamente às tropas.
- source_word: עַל הֶהָרִים
  choice: pelos montes
  rationale: Expressa distribuição ou dispersão sobre a região montanhosa em português natural.
- source_word: וְאֵין מְקַבֵּץ
  choice: e não há quem o reúna
  rationale: O pronome retoma “povo” e explicita em português o objeto subentendido no hebraico.
