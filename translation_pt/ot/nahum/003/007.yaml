  text: וְ/הָיָ֤ה כָל רֹאַ֨יִ/ךְ֙ יִדּ֣וֹד מִמֵּ֔/ךְ וְ/אָמַר֙ שָׁדְּדָ֣ה נִֽינְוֵ֔ה מִ֖י יָנ֣וּד לָ֑/הּ מֵ/אַ֛יִן אֲבַקֵּ֥שׁ מְנַחֲמִ֖ים לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/007.yaml
  text: And it will happen that all who see you will shrink from you and say, ‘Nineveh is devastated; who will grieve for her? Where can I seek comforters for you?’
translation:
  language: pt
  text: 'E acontecerá que todos os que virem você se afastarão de você e dirão: “Nínive foi devastada! Quem se compadecerá dela? Onde buscarei consoladores para você?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִדּוֹד מִמֵּךְ
  choice: se afastarão de você
  rationale: O verbo נוד aqui expressa o movimento de recuar ou afastar-se diante da ruína; a formulação preserva a reação de repulsa ou espanto sem intensificá-la para uma fuga explícita.
- source_word: שָׁדְּדָה
  choice: foi devastada
  rationale: O pual indica que Nínive sofreu devastação ou saque; “foi devastada” comunica naturalmente o resultado calamitoso.
- source_word: יָנוּד לָהּ
  choice: se compadecerá dela
  rationale: Neste contexto, נוד significa mostrar pesar ou compaixão por alguém; “compadecer-se” preserva essa nuance sem restringi-la apenas ao luto formal.
- source_word: מֵאַיִן אֲבַקֵּשׁ
  choice: Onde encontrarei
  rationale: Embora אֲבַקֵּשׁ seja literalmente “procurarei/buscarei”, em português a pergunta sobre onde obter consoladores soa natural com “encontrarei” e mantém a força retórica.
- source_word: מְנַחֲמִים
  choice: consoladores
  rationale: Mantém a imagem concreta de pessoas que ofereceriam consolo, em vez de substituí-la pelo conceito abstrato de consolação.
theological_decisions:
- issue: Alternância pronominal entre Nínive na segunda e na terceira pessoa
  choice: Preservar “você” nas falas dirigidas à cidade e “dela” na pergunta sobre Nínive
  alternative: Uniformizar tudo na segunda pessoa
  rationale: O hebraico alterna deliberadamente לָהּ (“dela”) e לָךְ (“para você”), e a tradução conserva essa mudança retórica sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A personificação feminina de Nínive é mantida pelo referente “dela”, enquanto o tratamento direto usa “você”, forma amplamente compreensível.
