base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/012.yaml
  text: All your fortresses are fig trees with first-ripe figs; if they are shaken[a], they fall into the mouth of the eater.
translation:
  language: pt
  text: Todas as suas fortalezas são figueiras com figos precoces; se forem sacudidas, os figos caem na boca de quem os come.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todas as suas fortalezas são figos com figos precoces”; a forma hebraica pode referir-se aos frutos, em vez das árvores. O texto principal diz “figueiras” porque isso se ajusta melhor à comparação com lugares fortificados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצָרַיִךְ
  choice: suas fortalezas
  rationale: O substantivo designa lugares fortificados; “fortalezas” mantém concreta e vívida a imagem militar dirigida a Nínive.
- source_word: תְּאֵנִים
  choice: como figueiras
  rationale: Embora a forma possa designar figos, entendê-la como “figueiras” produz uma comparação coerente com as fortalezas e com o ato posterior de sacudi-las.
- source_word: עִם בִּכּוּרִים
  choice: carregadas de figos maduros precoces
  rationale: בִּכּוּרִים indica os primeiros frutos maduros, aqui os figos que amadurecem cedo; a formulação evita a conotação cultual de “primícias” e esclarece a imagem.
- source_word: אִם יִנּוֹעוּ
  choice: basta sacudi-las
  rationale: A construção condicional descreve a facilidade do resultado. Em português, “basta” comunica naturalmente que um simples sacudir faz os frutos cair, sem alterar a força da imagem.
- source_word: וְנָפְלוּ
  choice: e eles caem
  rationale: O perfeito após a condição expressa o resultado; o presente torna natural a máxima ilustrativa e o pronome retoma os figos.
- source_word: עַל פִּי אוֹכֵל
  choice: na boca de quem os come
  rationale: Traduz idiomaticamente a expressão literal “sobre a boca de um comedor” e conserva a ideia de queda fácil e consumo imediato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A comparação foi explicitada com “como”, natural em português. “Basta sacudi-las” preserva a condição hebraica ao mesmo tempo que comunica a extrema vulnerabilidade das fortalezas. O marcador da nota aparece no texto principal.
