revisions:
- from: Também ela foi para o exílio, levada ao cativeiro. Até as suas criancinhas foram despedaçadas nas esquinas de todas as ruas.[a] Lançaram sortes sobre os seus homens de honra, e todos os seus grandes foram presos com correntes.
  to: Também ela foi para o exílio, para o cativeiro. Também as suas criancinhas foram despedaçadas à entrada de todas as ruas.[a] Lançaram sortes sobre os seus homens honrados, e todos os seus homens importantes foram acorrentados.
  rationale: A revisão evita fixar «esquinas» como o único sentido de uma expressão hebraica espacialmente aberta, preserva a dupla ênfase de גַּם e substitui formulações literais, mas pouco naturais, por equivalentes portugueses claros que conservam as distinções de status social do texto.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:09Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de exílio, violência contra as crianças, sorteio dos homens de posição e aprisionamento dos proeminentes. Contudo, «nas esquinas» fixa uma interpretação espacial possível de בְּרֹאשׁ כָּל־חוּצוֹת, enquanto o hebraico diz literalmente «na cabeça/início de todas as ruas» e pode referir-se a entradas ou extremidades. A repetição de גַּם é mais bem mantida por «Também» nas duas ocorrências.
  naturalness: O registro é claro e moderno. «Seus grandes» soa pouco idiomático em português contemporâneo; «seus homens importantes» comunica naturalmente o sentido social de גְּדוֹלֶיהָ. «Foram acorrentados» é mais direto do que «foram presos com correntes».
  terminology: «Criancinhas» transmite bem עֹלָלֶיהָ. «Homens de honra» é compreensível para נִכְבַּדֶּיהָ, mas «homens honrados» é mais natural sem perder a noção de posição e prestígio. «Lançaram sortes» e «cativeiro» são apropriados.
  issues:
  - severity: medium
    issue: «Nas esquinas de todas as ruas» resolve em excesso uma expressão espacial ambígua.
    rationale: בְּרֹאשׁ כָּל־חוּצוֹת significa literalmente «na cabeça/início de todas as ruas». «Esquinas» é uma possibilidade interpretativa, mas não deve substituir a formulação mais aberta no texto principal.
  - severity: low
    issue: A segunda ocorrência enfática de גַּם foi vertida por «Até».
    rationale: «Até» pode funcionar como intensificador, mas sugere mais facilmente um valor escalar. «Também» preserva de modo mais direto o paralelismo enfático «ela também ... seus filhos também».
  - severity: low
    issue: «Seus grandes» é pouco natural no português moderno.
    rationale: Embora literal, a expressão não é idiomática para pessoas socialmente proeminentes. «Seus homens importantes» mantém o sentido amplo sem restringi-lo a governantes.
  revised_text: Também ela foi para o exílio, para o cativeiro. Também as suas criancinhas foram despedaçadas à entrada de todas as ruas.[a] Lançaram sortes sobre os seus homens honrados, e todos os seus homens importantes foram acorrentados.
  revised_footnotes:
  - marker: a
    text: 'Hebraico: «na cabeça de todas as ruas»; isto é, possivelmente nas entradas, extremidades ou esquinas das ruas.'
    reason: cultural_note
  revision_rationale: A revisão evita fixar «esquinas» como o único sentido de uma expressão hebraica espacialmente aberta, preserva a dupla ênfase de גַּם e substitui formulações literais, mas pouco naturais, por equivalentes portugueses claros que conservam as distinções de status social do texto.
