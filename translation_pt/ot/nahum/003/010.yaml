  text: גַּם הִ֗יא לַ/גֹּלָה֙ הָלְכָ֣ה בַ/שֶּׁ֔בִי גַּ֧ם עֹלָלֶ֛י/הָ יְרֻטְּשׁ֖וּ בְּ/רֹ֣אשׁ כָּל חוּצ֑וֹת וְ/עַל נִכְבַּדֶּ֨י/הָ֙ יַדּ֣וּ גוֹרָ֔ל וְ/כָל גְּדוֹלֶ֖י/הָ רֻתְּק֥וּ בַ/זִּקִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/010.yaml
  text: Yet she too went into exile[a], into captivity; her children too were dashed to pieces at the head of every street. They cast lots for her honored men[d][c][b], and all her great men were bound in chains.
translation:
  language: pt
  text: Também ela foi para o exílio, para o cativeiro. Também as suas criancinhas foram despedaçadas à entrada de todas as ruas.[a] Lançaram sortes sobre os seus homens honrados, e todos os seus homens importantes foram acorrentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «na cabeça de todas as ruas»; isto é, possivelmente nas entradas, extremidades ou esquinas das ruas.'
    reason: cultural_note
lexical_decisions:
- source_word: גַּם הִיא
  choice: Também ela
  rationale: Preserva a ênfase comparativa de גַּם e a referência feminina singular a Nô-Amom, com formulação natural em português.
- source_word: לַגֹּלָה הָלְכָה בַשֶּׁבִי
  choice: foi para o exílio, levada ao cativeiro
  rationale: A primeira expressão indica a ida ao exílio; a segunda reforça que não se tratou de partida voluntária, mas de cativeiro.
- source_word: עֹלָלֶיהָ
  choice: suas criancinhas
  rationale: עֹלָלִים designa crianças muito pequenas; 'criancinhas' mantém a especificidade e a força afetiva do hebraico.
- source_word: יְרֻטְּשׁוּ
  choice: foram despedaçadas
  rationale: Reproduz sem suavização a violência gráfica do verbo רטש neste contexto.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: nas esquinas de todas as ruas
  rationale: Expressa em português natural o sentido espacial provável da expressão literalmente relacionada à 'cabeça' ou extremidade das ruas, preservando a forma literal em nota.
- source_word: נִכְבַּדֶּיהָ
  choice: seus homens de honra
  rationale: Conserva a relação lexical com כבד, aqui ligada a honra, peso social e distinção, sem restringir necessariamente o grupo a uma classe nobiliárquica formal.
- source_word: יַדּוּ גוֹרָל
  choice: Lançaram sortes
  rationale: Equivalente idiomático tradicional e inteligível para a distribuição de pessoas por sorteio.
- source_word: גְּדוֹלֶיהָ
  choice: seus grandes
  rationale: Mantém o sentido amplo de pessoas poderosas ou socialmente proeminentes, sem estreitá-lo a governantes.
- source_word: רֻתְּקוּ בַזִּקִּים
  choice: foram presos com correntes
  rationale: Comunica com clareza que foram imobilizados ou acorrentados por meio de grilhões ou correntes.
