id: NAM.3.1
reference: Nahum 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֖וֹי עִ֣יר דָּמִ֑ים כֻּלָּ֗/הּ כַּ֤חַשׁ פֶּ֨רֶק֙ מְלֵאָ֔ה לֹ֥א יָמִ֖ישׁ טָֽרֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/001.yaml
  text: Woe to the city of bloodshed[a], all of it full of lies, full of plunder[d][c][b]; prey never departs.
translation:
  language: pt
  text: Ai da cidade sanguinária![a] Ela está toda cheia de mentira, cheia de pilhagem; a presa nunca desaparece.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cidade de sangues”, expressão que indica uma cidade marcada por matança e culpa de sangue. Outra tradução possível: “cidade de derramamento de sangue”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a presa não cessa”, no sentido de que a violência predatória da cidade não tem fim.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética que expressa ao mesmo tempo lamento e denúncia; “Ai” preserva essa força em português atual.
- source_word: עִיר דָּמִים
  choice: cidade sanguinária
  rationale: A expressão literalmente diz “cidade de sangues” e caracteriza a cidade pela matança e culpa de sangue; “cidade sanguinária” é natural e contundente.
- source_word: כֻּלָּהּ
  choice: Ela está toda
  rationale: Retoma a cidade e ressalta que ela inteira se encontra na condição denunciada.
- source_word: כַּחַשׁ
  choice: mentira
  rationale: O substantivo abrange falsidade e engano; “mentira” é claro e preserva a acusação direta.
- source_word: פֶּרֶק
  choice: pilhagem
  rationale: Designa o que é arrancado ou tomado violentamente; “pilhagem” comunica tanto a violência da ação quanto os despojos obtidos.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Mantém a predicação do hebraico; sua repetição antes de “pilhagem” reproduz a estrutura enfática do verso.
- source_word: לֹא יָמִישׁ
  choice: nunca desaparece
  rationale: A construção negativa indica que algo não se afasta nem é removido; “nunca desaparece” comunica sua presença contínua.
- source_word: טָרֶף
  choice: presa
  rationale: Preserva a imagem predatória de uma vítima ou de algo arrebatado por um animal, adequada à representação da violência de Nínive.
theological_decisions: []
