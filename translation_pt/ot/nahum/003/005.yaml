source:
  edition: WLC
  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/גִלֵּיתִ֥י שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/הַרְאֵיתִ֤י גוֹיִם֙ מַעְרֵ֔/ךְ וּ/מַמְלָכ֖וֹת קְלוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/005.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will uncover your skirts over your face, and I will show the nations your nakedness and the kingdoms your shame.
translation:
  language: pt
  text: “Eis que estou contra você”, declara Yahweh dos Exércitos. “Levantarei a barra da sua roupa sobre o seu rosto[a] e mostrarei às nações a sua nudez e, aos reinos, a sua vergonha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem hebraica é a de levantar a extremidade da roupa de uma mulher, expondo sua nudez como forma de humilhação pública.
    reason: Explica a metáfora cultural e corporal preservada na tradução.
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Eis que estou contra você
  rationale: Preserva a força solene da fórmula profética e expressa claramente a hostilidade divina dirigida a Nínive, personificada no feminino.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: Traduz a fórmula oracular de modo corrente e mantém tanto o nome divino quanto o título צְבָאוֹת.
- source_word: וְגִלֵּיתִי שׁוּלַיִךְ עַל פָּנָיִךְ
  choice: Levantarei a barra de sua roupa sobre o seu rosto
  rationale: Conserva a imagem concreta de erguer a extremidade da veste para causar exposição e humilhação pública; 'barra de sua roupa' é mais natural e menos ambíguo em português amplo do que 'suas saias'.
- source_word: וְהַרְאֵיתִי גוֹיִם מַעְרֵךְ
  choice: mostrarei às nações a sua nudez
  rationale: Reproduz a construção causativa e mantém 'nudez' como expressão digna, sem tornar a imagem desnecessariamente explícita.
- source_word: וּמַמְלָכוֹת קְלוֹנֵךְ
  choice: e aos reinos, a sua vergonha
  rationale: Mantém o paralelismo com 'às nações, a sua nudez' e traduz קָלוֹן como vergonha pública.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- issue: Natureza da imagem de exposição
  choice: Preservar a metáfora concreta de exposição e humilhação pública
  alternative: Parafrasear apenas como 'vou humilhar você'
  rationale: O hebraico emprega deliberadamente uma imagem corporal forte; uma paráfrase abstrata apagaria sua intensidade e sua tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala divina foi marcada por aspas para clareza. O tratamento por 'você' torna explícita a segunda pessoa singular dirigida à cidade personificada, sem tentar reproduzir no português o gênero feminino indicado pelas formas hebraicas.
