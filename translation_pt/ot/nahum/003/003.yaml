base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
translation:
  language: pt
  text: 'Cavaleiros avançam;

    o clarão da espada

    e o relâmpago da lança;

    uma multidão de mortos,

    uma massa de cadáveres!

    Não há fim de cadáveres;

    eles tropeçam nos cadáveres deles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “nos cadáveres deles”. O sufixo pode remeter coletivamente aos mortos já mencionados; a cena não identifica de modo explícito quem tropeça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  choice: Cavaleiros avançam
  rationale: O singular פָּרָשׁ tem sentido coletivo nesta cena militar, e מַעֲלֶה descreve o movimento de avanço. O plural torna esse valor coletivo natural em português sem acrescentar a ideia mais específica de galope ou carga.
- source_word: לַהַב חֶרֶב
  choice: o clarão da espada
  rationale: לַהַב significa literalmente chama ou labareda e, aplicado à espada, evoca seu brilho intenso. “Clarão” conserva a imagem luminosa em português corrente.
- source_word: בְּרַק חֲנִית
  choice: o relâmpago da lança
  rationale: בְּרַק significa relâmpago ou lampejo. A formulação mantém a metáfora vívida e o paralelismo com o clarão da espada.
- source_word: רֹב חָלָל
  choice: uma multidão de mortos
  rationale: Neste contexto, חָלָל designa os que foram mortos, enquanto רֹב ressalta sua enorme quantidade.
- source_word: כֹבֶד פָּגֶר
  choice: uma massa de cadáveres
  rationale: כֹבֶד, literalmente peso ou pesadez, comunica aqui uma grande massa; פָּגֶר designa um corpo morto. A expressão é fiel e idiomática sem pressupor explicitamente cadáveres empilhados.
- source_word: אֵין קֵצֶה לַגְּוִיָּה
  choice: Não há fim dos corpos
  rationale: A frase enfatiza que os corpos parecem não ter fim. “Corpos” evita repetição imediata de “cadáveres” e preserva o impacto cumulativo.
- source_word: יכשלו
  choice: eles tropeçam
  rationale: O verbo כשל descreve tropeçar ou perder o equilíbrio; o sujeito não é expresso no hebraico, por isso o pronome permanece sem identificação adicional.
- source_word: בִּגְוִיָּתָם
  choice: entre os cadáveres
  rationale: A preposição ב pode ter sentido espacial no contexto, e a tradução comunica naturalmente o movimento em meio aos corpos. O sufixo masculino plural do hebraico e sua referência contextual são registrados na nota.
