  text: וְ/הִשְׁלַכְתִּ֥י עָלַ֛יִ/ךְ שִׁקֻּצִ֖ים וְ/נִבַּלְתִּ֑י/ךְ וְ/שַׂמְתִּ֖י/ךְ כְּ/רֹֽאִי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/006.yaml
  text: And I will throw filth upon you[a], and treat you with contempt[b], and make you a spectacle.
translation:
  language: pt
  text: Lançarei sobre você coisas repugnantes[a], eu a desonrarei e farei de você um espetáculo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abominações”, “coisas detestáveis” ou “imundície”. O termo hebraico costuma indicar aquilo que é ritual ou moralmente repugnante; aqui também pode evocar lixo imundo lançado sobre Nínive para humilhá-la publicamente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “farei de você algo para ser visto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: Lançarei
  rationale: O hifil de שלך expressa lançar ou atirar deliberadamente. “Lançarei” preserva a força da ação e combina com o registro profético.
- source_word: עָלַיִךְ
  choice: sobre você
  rationale: 'A preposição על com sufixo feminino singular tem sentido espacial: aquilo que é repugnante é lançado sobre Nínive, personificada como mulher.'
- source_word: שִׁקֻּצִים
  choice: coisas repugnantes
  rationale: שִׁקּוּץ designa coisas detestáveis ou abomináveis, frequentemente em sentido ritual ou moral. “Coisas repugnantes” preserva essa amplitude e, no contexto, também permite a imagem concreta de imundície usada para humilhar.
- source_word: וְנִבַּלְתִּיךְ
  choice: cobrirei você de desprezo
  rationale: O piel de נבל comunica desonrar, aviltar ou tornar desprezível. A formulação portuguesa expressa de modo natural a humilhação ativa e pública, sem confundi-la com simples desprezo interior.
- source_word: וְשַׂמְתִּיךְ
  choice: farei de você
  rationale: שׂים pode significar pôr, estabelecer ou fazer. Com o predicativo seguinte, “farei de você” é idiomático em português.
- source_word: כְּרֹאִי
  choice: um espetáculo
  rationale: A expressão aponta literalmente para algo exposto à vista. “Um espetáculo” transmite exposição pública e vergonha em linguagem atual.
theological_decisions:
- issue: Imagem profética da humilhação de Nínive personificada como mulher
  choice: Manter sem suavização a linguagem de juízo, repugnância e exposição pública.
  alternative: Empregar uma formulação mais literal, como “tornarei você desprezível e a porei como algo para ser visto”.
  rationale: O hebraico apresenta o juízo divino mediante uma imagem severa de desonra pública. A tradução conserva essa força sem acrescentar conotações sexuais ou doutrinárias ausentes do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com Nínive tratada por “você” conforme a personificação feminina do hebraico. “Coisas repugnantes” conserva melhor a ambiguidade lexical do que uma escolha exclusivamente concreta; as notas registram tanto o valor religioso-moral quanto a possível imagem de imundície. A repetição de “você” mantém claros os três atos paralelos do juízo.
