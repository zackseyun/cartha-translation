id: NAM.3.11
reference: Nahum 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
translation:
  language: pt
  text: Você também ficará embriagada[a]; ficará escondida. Você também buscará refúgio contra o inimigo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ficará embriagada” provavelmente dá continuidade à imagem profética de ser dominada pelo juízo e cambalear sob ele, não se referindo apenas à embriaguez literal.
    reason: cultural_note
  - marker: b
    text: 'Ou: “buscará uma fortaleza para se proteger do inimigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁכְּרִי
  choice: ficará embriagada
  rationale: O qal imperfeito de שׁכר expressa ficar embriagado. A formulação preserva a imagem concreta, que no contexto profético sugere cambalear sob o juízo, sem explicitar no texto aquilo que permanece figurado.
- source_word: תְּהִי נַעֲלָמָה
  choice: ficará escondida
  rationale: A construção היה + נעלמה indica a entrada num estado de ocultação. “Ficará escondida” conserva o sentido passivo/resultativo e se refere naturalmente a Nínive, de gênero feminino.
- source_word: תְּבַקְשִׁי
  choice: buscará
  rationale: בקש no piel significa buscar ou procurar obter; “buscará” é conciso e apropriado ao registro profético.
- source_word: מָעוֹז
  choice: refúgio
  rationale: מָעוֹז pode designar um lugar ou meio de segurança e também uma fortaleza. “Refúgio” comunica com clareza sua função neste contexto, enquanto a alternativa mais concreta é registrada em nota.
- source_word: מֵאוֹיֵב
  choice: contra o inimigo
  rationale: A preposição מן pode indicar proteção ou afastamento diante de uma ameaça. Em português, “refúgio contra o inimigo” expressa naturalmente a busca de proteção, embora “do inimigo” também seja possível.
- source_word: גַּם אַתְּ
  choice: Você também
  rationale: A expressão repetida ressalta que Nínive sofrerá destino semelhante ao de Nô-Amom. “Você também” preserva de modo idiomático a comparação enfática.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O feminino singular foi mantido porque a fala se dirige à cidade de Nínive. As duas ocorrências de גַּם אַתְּ foram reproduzidas para conservar a ênfase retórica.
