base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/013.yaml
  text: Look[a], your troops are women in your midst; the gates of your land stand wide open to your enemies[c][b]; fire has consumed your bars.
translation:
  language: pt
  text: 'Veja: em seu meio, seu povo é composto de mulheres. Os portões da sua terra estão escancarados para os seus inimigos; o fogo consumiu suas barras.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Interjeição dêitica que introduz uma constatação enfática; “Veja” é atual, vívido e não arcaizante.
- source_word: עַמֵּךְ
  choice: seu povo
  rationale: עם significa primariamente “povo”. Embora o contexto destaque os defensores de Nínive, a tradução principal preserva a amplitude lexical sem restringi-la a “tropas”.
- source_word: נָשִׁים
  choice: é formado por mulheres
  rationale: Mantém o substantivo literal “mulheres” e torna natural em português a oração nominal hebraica, sem acrescentar uma comparação explícita.
- source_word: בְּקִרְבֵּךְ
  choice: no meio de você
  rationale: Expressa de modo claro a localização interna indicada pela locução hebraica e conserva a referência feminina singular à cidade personificada.
- source_word: לְאֹיְבַיִךְ
  choice: diante dos seus inimigos
  rationale: No quadro de portões abertos, “diante de” comunica naturalmente que a entrada está exposta e acessível aos inimigos.
- source_word: פָּתוֹחַ נִפְתְּחוּ
  choice: estão escancarados
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a abertura; “escancarados” transmite abertura ampla ou completa em português corrente.
- source_word: שַׁעֲרֵי אַרְצֵךְ
  choice: os portões da sua terra
  rationale: Tradução direta da construção genitiva, abrangendo os acessos fortificados ao território.
- source_word: אָכְלָה אֵשׁ
  choice: o fogo consumiu
  rationale: Preserva o fogo como sujeito e o aspecto concluído do perfeito hebraico; “consumiu” é idiomático para a ação do fogo.
- source_word: בְּרִיחָיִךְ
  choice: suas trancas
  rationale: Designa as barras ou ferrolhos que fechavam e reforçavam os portões; “trancas” é claro e natural em português.
theological_decisions:
- issue: Provocação militar marcada por gênero em נָשִׁים
  choice: Conservar “mulheres” no texto principal como caracterização direta do povo dentro da cidade.
  alternative: “como mulheres” ou “fraco como mulheres”
  rationale: O hebraico emprega diretamente o substantivo, sem partícula comparativa nem o adjetivo “fraco”. A formulação retém a retórica antiga, ainda que ofensiva à sensibilidade moderna, sem ampliá-la ou neutralizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cidade é tratada no singular por “você”, coerentemente com os sufixos femininos hebraicos e com a personificação de Nínive. “Escancarados” preserva a ênfase verbal sem exigir nota técnica.
