revisions:
- from: 'Veja: no meio de você, seu povo é formado por mulheres. Os portões da sua terra estão escancarados diante dos seus inimigos; o fogo consumiu suas trancas.'
  to: 'Veja: em seu meio, seu povo é composto de mulheres. Os portões da sua terra estão escancarados para os seus inimigos; o fogo consumiu suas barras.'
  rationale: A revisão melhora a idiomaticidade e especifica o sentido físico de «barras», sem alterar a retórica militar marcada por gênero nem resolver por paráfrase a predicação direta נשים. Não é necessária nota, pois as opções principais permanecem transparentes e não há ambiguidade textual que exija sinalização nesta tradução.
