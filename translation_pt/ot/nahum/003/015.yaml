  yaml_path: translation/ot/nahum/003/015.yaml
  text: There the fire will devour you; the sword will cut you off; it will devour you like the locust[a]. Multiply yourself like the locust; multiply yourself like the swarming locust.
translation:
  language: pt
  text: Ali o fogo devorará você; a espada acabará com você; a espada devorará você como o gafanhoto[a]. Multiplique-se como o gafanhoto; multiplique-se como gafanhotos em enxame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega aqui dois termos relacionados para insetos: um costuma ser entendido como um tipo ou uma fase do gafanhoto (יֶלֶק), e o outro é o termo comum para gafanhoto (אַרְבֶּה). O texto principal os traduz como “gafanhoto” e “gafanhotos em enxame” para maior clareza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: Mantém o advérbio locativo e aponta para o próprio lugar em que Nínive se julgava segura, sem acrescentar explicação ao texto.
- source_word: תֹּאכְלֵךְ ... אֵשׁ
  choice: o fogo devorará você
  rationale: “Devorar” conserva a imagem vigorosa de אָכַל e é idiomático em português quando o sujeito é o fogo.
- source_word: תַּכְרִיתֵךְ חֶרֶב
  choice: a espada acabará com você
  rationale: Comunica naturalmente o sentido destrutivo do hifil de כרת. A tradução literal “cortará você” seria pouco natural e poderia sugerir apenas um ferimento.
- source_word: תֹּאכְלֵךְ
  choice: você será devorada
  rationale: A construção passiva preserva a repetição do sentido de “devorar” sem identificar de modo indevidamente explícito se o agente subentendido é o fogo ou a espada; o feminino corresponde à cidade interpelada.
- source_word: כַּיָּלֶק / כַּיֶּלֶק
  choice: como pelo gafanhoto / como o gafanhoto
  rationale: יֶלֶק designa um inseto devorador da família ou de uma fase dos gafanhotos. “Gafanhoto” transmite com clareza a imagem, enquanto a nota registra a distinção lexical.
- source_word: הִתְכַּבֵּד / הִתְכַּבְּדִי
  choice: Multiplique-se
  rationale: No contexto da comparação com gafanhotos, os imperativos do hitpael de כבד convocam ironicamente a cidade a tornar-se numerosa. “Multiplique-se” é conciso, natural e conserva o paralelismo.
- source_word: כָּאַרְבֶּה
  choice: como gafanhotos em enxame
  rationale: אַרְבֶּה é o termo comum para gafanhoto e frequentemente evoca a massa do enxame. A expressão natural em português diferencia esta imagem de יֶלֶק sem impor uma identificação zoológica incerta.
