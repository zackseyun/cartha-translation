  text: אֵין כֵּהָ֣ה לְ/שִׁבְרֶ֔/ךָ נַחְלָ֖ה מַכָּתֶ֑/ךָ כֹּ֣ל שֹׁמְעֵ֣י שִׁמְעֲ/ךָ֗ תָּ֤קְעוּ כַף֙ עָלֶ֔י/ךָ כִּ֗י עַל מִ֛י לֹֽא עָבְרָ֥ה רָעָתְ/ךָ֖ תָּמִֽיד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/019.yaml
  text: There is no healing for your fracture[a]; your wound is grievous. All who hear the report about you clap their hands over you[b], for over whom has your evil not continually passed?
translation:
  language: pt
  text: Não há cura para a sua fratura[a]; sua ferida é grave. Todos os que ouvirem notícias a seu respeito baterão palmas contra você[b], pois sobre quem a sua maldade não passou continuamente?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há alívio para a sua ruína; sua ferida é severa”.'
    reason: lexical_alternative
  - marker: b
    text: A pergunta retórica indica que a maldade de Nínive havia atingido praticamente todos; por isso, as nações comemoram a sua queda.
    reason: cultural_note
lexical_decisions:
- source_word: אֵין כֵּהָה
  choice: Não há cura
  rationale: A negação existencial e o termo que indica alívio ou melhora formam, no contexto da ferida, uma declaração natural de que não haverá cura.
- source_word: לְשִׁבְרֶךָ
  choice: para a sua fratura
  rationale: Preserva a metáfora corporal de quebra ou fratura e sua ligação com “ferida” no membro seguinte.
- source_word: נַחְלָה מַכָּתֶךָ
  choice: a sua ferida é grave
  rationale: Expressa a condição severa da ferida sem acrescentar explicitamente “incurável”, ideia sugerida pelo contexto, mas não exigida por este termo isoladamente.
- source_word: כֹּל שֹׁמְעֵי שִׁמְעֲךָ
  choice: Todos os que ouvirem notícias a seu respeito
  rationale: A expressão se refere à notícia acerca de Nínive, especialmente de sua queda; a formulação é clara e idiomática em português.
- source_word: תָּקְעוּ כַף עָלֶיךָ
  choice: baterão palmas por sua causa
  rationale: Reproduz o gesto hebraico de bater as palmas e, sem tornar a interpretação excessivamente explícita, indica que a reação decorre do que aconteceu a Nínive.
- source_word: רָעָתְךָ
  choice: a sua maldade
  rationale: Mantém a dimensão moral do termo no contexto da violência opressora da Assíria, sem restringi-lo apenas a crueldade ou ao dano resultante.
- source_word: עַל מִי לֹא עָבְרָה ... תָּמִיד
  choice: sobre quem ... não passou continuamente?
  rationale: Preserva a imagem verbal e a pergunta retórica do hebraico, bem como a noção de ação persistente.
theological_decisions:
- issue: Sentido de רָעָתְךָ no oráculo de juízo contra Nínive
  choice: a sua maldade
  alternative: o seu mal; a sua crueldade; o dano que você causou
  rationale: “Maldade” comunica a acusação moral contra Nínive sem reduzir o termo ao sofrimento produzido nem particularizá-lo como apenas crueldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantêm-se a metáfora médica, a pergunta retórica e a acusação moral do hebraico.
