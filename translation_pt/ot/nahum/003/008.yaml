base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/008.yaml
  text: Are you better than No-amon, who sat among the Nile channels, with waters all around her, whose rampart was the sea, whose wall was from the sea?
translation:
  language: pt
  text: Você é melhor do que Nô-Amom[a], que estava situada entre os canais do Nilo, cercada de águas, cuja força era o mar e cuja muralha vinha do mar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nô-Amom é geralmente identificada com Tebas, importante cidade do Egito às margens do Nilo.
    reason: O topônimo antigo pode ser desconhecido para leitores modernos, e sua identificação histórica ajuda a compreender a comparação.
lexical_decisions:
- source_word: הֲתֵיטְבִי מִנֹּא אָמוֹן
  choice: Você é melhor do que Nô-Amom
  rationale: Mantém a pergunta retórica e o comparativo do hebraico; preserva o nome histórico da cidade em vez de substituí-lo por uma identificação interpretativa.
- source_word: הַיֹּשְׁבָה
  choice: que se assentava
  rationale: Expressa a ideia de estar situada ou estabelecida, adequada à descrição geográfica da cidade.
- source_word: בַּיְאֹרִים
  choice: entre os canais do Nilo
  rationale: O plural de יְאֹר refere-se aqui aos braços ou canais ligados ao Nilo, não a rios genéricos.
- source_word: חֵיל
  choice: baluarte
  rationale: No contexto defensivo, indica uma fortificação ou defesa exterior; 'baluarte' conserva a imagem militar.
- source_word: מִיָּם חוֹמָתָהּ
  choice: cuja muralha vinha do mar
  rationale: Reproduz a formulação difícil e enfática do hebraico sem eliminar a distinção entre baluarte e muralha.
theological_decisions:
- issue: Referência histórica de Nô-Amom
  choice: Manter o topônimo no texto e explicar em nota sua identificação provável
  alternative: Traduzir diretamente como Tebas
  rationale: O hebraico traz o nome Nô-Amom; a nota oferece a identificação histórica geralmente aceita sem inseri-la como certeza absoluta no corpo do texto.
- issue: Sentido de יָם ('mar') no cenário de Tebas
  choice: Preservar 'mar' nas duas ocorrências
  alternative: Interpretar como Nilo, águas ou massa de águas
  rationale: Embora 'mar' possa designar uma grande extensão de água e o contexto seja nilótico, manter a imagem lexical preserva a tensão e a possível linguagem poética do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o caráter retórico e poético do oráculo, enquanto 'canais do Nilo' esclarece a geografia sem tornar a frase técnica.
