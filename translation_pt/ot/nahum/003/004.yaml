id: NAM.3.4
reference: Nahum 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מֵ/רֹב֙ זְנוּנֵ֣י זוֹנָ֔ה ט֥וֹבַת חֵ֖ן בַּעֲלַ֣ת כְּשָׁפִ֑ים הַ/מֹּכֶ֤רֶת גּוֹיִם֙ בִּ/זְנוּנֶ֔י/הָ וּ/מִשְׁפָּח֖וֹת בִּ/כְשָׁפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
translation:
  language: pt
  text: por causa dos muitos atos de prostituição da prostituta, cheia de encanto[a], senhora das feitiçarias, que vende nações por meio de suas prostituições e clãs[b] por meio de suas feitiçarias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de aparência atraente” ou “graciosa”. A expressão hebraica descreve uma atratividade sedutora.
    reason: lexical_alternative
  - marker: b
    text: Ou “famílias”. O termo hebraico pode designar famílias extensas ou clãs.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  choice: por causa dos muitos
  rationale: A preposição מִן com רֹב expressa aqui causa ou fundamento; a formulação preserva tanto a relação causal quanto a ideia de grande quantidade.
- source_word: זְנוּנֵי / זוֹנָה
  choice: muitos atos de prostituição da prostituta
  rationale: Mantém a repetição enfática e a metáfora sexualizada do hebraico, usando linguagem atual e clara. “Atos de prostituição” soa mais natural em português do que o plural abstrato “prostituições” neste contexto.
- source_word: טוֹבַת חֵן
  choice: cheia de encanto
  rationale: A expressão descreve atratividade sedutora, não necessariamente apenas beleza física. A tradução é natural e conserva a amplitude do hebraico.
- source_word: בַּעֲלַת כְּשָׁפִים
  choice: senhora das feitiçarias
  rationale: בַּעֲלַת caracteriza a figura feminina como possuidora ou dominadora de feitiçarias. “Senhora” preserva a personificação feminina sem explicitar apenas habilidade técnica.
- source_word: הַמֹּכֶרֶת
  choice: que vende
  rationale: Traduz diretamente o particípio e conserva a metáfora comercial de exploração, sem ampliá-la para uma interpretação específica.
- source_word: גּוֹיִם
  choice: nações
  rationale: No contexto do oráculo profético, o termo designa entidades coletivas e geopolíticas; “nações” é a equivalência mais adequada.
- source_word: בִּזְנוּנֶיהָ
  choice: por meio de suas prostituições
  rationale: A preposição בְּ tem valor instrumental. “Por meio de” torna essa função clara e idiomática em português.
- source_word: וּמִשְׁפָּחוֹת
  choice: e clãs
  rationale: מִשְׁפָּחוֹת pode designar grupos extensos de parentesco, mais amplos que famílias nucleares. “Clãs” também mantém o paralelismo coletivo com “nações”.
- source_word: בִּכְשָׁפֶיהָ
  choice: por meio de suas feitiçarias
  rationale: Preserva o valor instrumental da preposição e repete “feitiçarias” para refletir a repetição lexical do hebraico.
theological_decisions:
- issue: Natureza da imagem da prostituta
  choice: Manter as imagens de prostituição e feitiçaria como descrição profética polivalente do poder sedutor e explorador de Nínive.
  alternative: Restringir a imagem exclusivamente à idolatria ou exclusivamente à sedução política e econômica.
  rationale: O texto permite que a metáfora abranja manipulação política, sedução cultural, exploração e corrupção espiritual. A tradução preserva essa tensão sem impor uma única interpretação.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém o tom forte da denúncia profética e a personificação feminina. Os marcadores foram posicionados junto às expressões que efetivamente explicam: [a] após “encanto” e [b] após “clãs”.'
