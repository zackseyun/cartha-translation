- from: Tire água para você durante o cerco; fortaleça suas fortificações. Entre no barro e pise a argamassa; pegue a forma de tijolos.[a]
  to: Tire água para o cerco; fortaleça suas fortificações. Entre no barro e pise a argamassa; agarre o molde de tijolos.[a]
