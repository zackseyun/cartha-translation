review_pass:
  verdict: revise
  source_fidelity: A expressão מֵי מָצוֹר indica água destinada aos preparativos para um cerco, não água retirada temporalmente «durante o cerco». Os demais imperativos e a sequência de preparação de tijolos são bem representados. Para מַלְבֵּן, «molde de tijolos» expressa com mais precisão a opção adotada do que «forma de tijolos».
  naturalness: O texto é claro e de registro apropriado. «Água para o cerco» é mais idiomático e semanticamente exato neste contexto do que «água ... durante o cerco». «Agarre o molde» comunica bem o imperativo de tomar/segurar o objeto.
  terminology: «Fortificações», «barro» e «argamassa» são escolhas defensáveis no cenário de cerco e fabricação de tijolos. A nota preserva adequadamente a alternativa lexical «forno de tijolos» para o termo raro מַלְבֵּן.
  issues:
  - severity: medium
    issue: «durante o cerco» traduz inadequadamente a relação de מָצוֹר com «água».
    rationale: O hebraico aponta para água para o cerco/em vista do cerco, isto é, provisão para resistir a ele; «durante» altera a relação para uma circunstância temporal.
  - severity: low
    issue: «forma de tijolos» é menos preciso que «molde de tijolos» para a leitura de מַלְבֵּן como utensílio.
    rationale: «Forma» pode ser entendida como configuração ou formato; «molde» identifica mais diretamente o instrumento de fabricar tijolos e corresponde à alternativa inglesa «brick mold».
  revised_text: Tire água para o cerco; fortaleça suas fortificações. Entre no barro e pise a argamassa; agarre o molde de tijolos.[a]
