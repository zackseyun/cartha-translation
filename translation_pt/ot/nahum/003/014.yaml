base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/014.yaml
  text: Draw water for yourself for the siege; strengthen your fortresses[a]. Go into the clay and tread the mortar; take hold of the brick mold.
translation:
  language: pt
  text: Tire água para o cerco; fortaleça suas fortificações. Entre no barro e pise a argamassa; agarre o molde de tijolos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o forno de tijolos”. O termo hebraico מַלְבֵּן é raro e pode indicar um molde de tijolos ou um forno de tijolos; o contexto imediato, que menciona trabalhar o barro e a argamassa, favorece “molde de tijolos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵי מָצוֹר
  choice: água ... durante o cerco
  rationale: A expressão construta significa literalmente “águas de cerco”. No contexto, refere-se à água retirada e armazenada para resistir a um cerco; “durante o cerco” comunica essa finalidade de modo natural sem eliminar a imagem militar.
- source_word: שַׁאֲבִי לָךְ
  choice: Tire ... para você
  rationale: O imperativo feminino singular se dirige à cidade personificada como mulher. “Para você” preserva o dativo לָךְ e o sentido de providenciar água para si mesma.
- source_word: חַזְּקִי
  choice: fortaleça
  rationale: O piel imperativo de חזק significa “fortalecer” ou “tornar forte”. A escolha mantém o valor verbal e combina naturalmente com “fortificações”.
- source_word: מִבְצָרַיִךְ
  choice: suas fortificações
  rationale: O substantivo plural designa lugares ou estruturas fortificadas. “Fortificações” é concreto, corrente e adequado aos preparativos para o cerco.
- source_word: בֹּאִי בַטִּיט
  choice: Entre no barro
  rationale: O imperativo feminino singular é mantido. טיט pode significar lama, barro ou argila; “barro” é natural em português e se ajusta ao cenário de fabricação de tijolos.
- source_word: וְרִמְסִי בַחֹמֶר
  choice: e pise a argamassa
  rationale: רמס descreve o ato literal de pisar ou calcar. חֹמֶר pode indicar barro, argila ou argamassa; aqui “argamassa” distingue a mistura trabalhada do “barro” anterior e preserva a sequência da fabricação.
- source_word: הַחֲזִיקִי
  choice: pegue
  rationale: O hifil imperativo de חזק, com objeto direto, tem aqui o sentido de agarrar, segurar ou tomar. “Pegue” é claro e natural, sem sugerir que o objeto deva ser fortalecido.
- source_word: מַלְבֵּן
  choice: forma de tijolos
  rationale: O termo raro provavelmente designa um molde ou forma usada para fabricar tijolos, embora “forno de tijolos” também seja possível. “Forma de tijolos” combina melhor com as ações manuais imediatas de entrar no barro e pisar a argamassa.
