base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/009.yaml
  text: Cush was her strength[a], and Egypt without end[d][c][b]; Put and the Libyans were among your helpers.
translation:
  language: pt
  text: Cuxe era a força dela[a], e o Egito, sem fim; Pute[b] e os líbios[c] eram seus auxiliares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico muda de pessoa dentro do versículo: «a força dela» está na terceira pessoa feminina, mas «seus auxiliares» corresponde à segunda pessoa feminina. Algumas traduções uniformizam a frase como «sua força».'
    reason: alternative_reading
  - marker: b
    text: Também chamado tradicionalmente de «Fute».
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: «lubim»; provavelmente povos líbios.'
    reason: cultural_note
lexical_decisions:
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Translitera o nome hebraico do território e povo, evitando a identificação geográfica mais interpretativa com a Etiópia moderna.
- source_word: עָצְמָהּ
  choice: era a força dela
  rationale: Preserva o sufixo feminino de terceira pessoa do hebraico e expressa naturalmente a ideia de poder ou força pertencente à cidade mencionada no contexto.
- source_word: וּמִצְרַיִם
  choice: e o Egito
  rationale: Equivalente português corrente do nome próprio, ligado a Cuxe como potência aliada.
- source_word: וְאֵין קֵצֶה
  choice: sem limites
  rationale: Reproduz de modo compacto e natural a ideia hebraica de extensão ou recursos sem medida, sem especificar além do texto aquilo que não tinha limite.
- source_word: פּוּט
  choice: Pute
  rationale: Forma portuguesa tradicional e transparente do nome próprio hebraico; a nota registra a variante Fute.
- source_word: לוּבִים
  choice: os líbios
  rationale: Traduz o gentílico hebraico como designação de povos líbios, em linguagem clara para leitores atuais.
- source_word: הָיוּ
  choice: estavam
  rationale: O verbo existencial/cópula no passado descreve a participação contínua desses povos no apoio à cidade.
- source_word: בְּעֶזְרָתֵךְ
  choice: entre os que ajudavam você
  rationale: Expressa idiomaticamente a participação de Pute e dos líbios no auxílio à cidade e preserva a segunda pessoa feminina do hebraico, que em português não recebe marca de gênero.
theological_decisions:
- issue: Mudança de pessoa gramatical dentro do versículo
  choice: Preservar “dela” e depois “você”
  alternative: Harmonizar como “sua força” e “ajudavam você”
  rationale: O hebraico passa do sufixo feminino de terceira pessoa em עָצְמָהּ para o sufixo feminino de segunda pessoa em בְּעֶזְרָתֵךְ. A tradução mantém essa mudança textual em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a mudança pronominal do original. “Sem limites” conserva a formulação aberta do hebraico, cujo referente exato não é explicitado. Os marcadores aparecem imediatamente após os termos pertinentes.
