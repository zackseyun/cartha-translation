revisions:
- from: Cuxe era a força dela[a], e o Egito, sem limites; Pute[b] e os líbios[c] estavam entre os que ajudavam você.
  to: Cuxe era a força dela[a], e o Egito, sem fim; Pute[b] e os líbios[c] eram seus auxiliares.
  rationale: A revisão corrige a transliteração na nota c e faz pequenos ajustes de estilo para um português mais natural, sem alterar a alternância de pessoa, os nomes próprios, a indefinição de «sem fim» nem o sentido de apoio militar ou político expresso no hebraico.
