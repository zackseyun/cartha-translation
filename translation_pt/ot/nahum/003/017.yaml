source:
  edition: WLC
  text: מִנְּזָרַ֨יִ/ךְ֙ כָּֽ/אַרְבֶּ֔ה וְ/טַפְסְרַ֖יִ/ךְ כְּ/ג֣וֹב גֹּבָ֑י הַֽ/חוֹנִ֤ים בַּ/גְּדֵרוֹת֙ בְּ/י֣וֹם קָרָ֔ה שֶׁ֤מֶשׁ זָֽרְחָה֙ וְ/נוֹדַ֔ד וְ/לֹֽא נוֹדַ֥ע מְקוֹמ֖/וֹ אַיָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/017.yaml
  text: Your guards are like locusts[a], and your scribes like swarms of locusts, settling on the walls on a cold day. The sun rises, and they fly away[d][c][b]; no one knows where they are.
translation:
  language: pt
  text: Os seus guardas[a] são como gafanhotos, e os seus escribas[b], como enxames de gafanhotos, que pousam sobre os muros[c] num dia frio. Quando o sol nasce, eles voam para longe, e já não se sabe onde estão[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus coroados”, “os seus príncipes” ou “os seus consagrados”; o termo hebraico é raro e seu sentido é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “os seus oficiais” ou “os seus comandantes militares”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico também pode significar “sobre as cercas” ou “nos recintos”, não necessariamente os muros da cidade.
    reason: lexical_alternative
  - marker: d
    text: 'Mais literalmente: “e não se conhece o seu lugar — onde estão?” O hebraico passa de uma forma singular a uma pergunta de sentido plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְּזָרַיִךְ
  choice: os seus guardas
  rationale: O substantivo é raro e discutido. No contexto da provocação contra Nínive e em paralelo com outra classe de oficiais, “guardas” comunica de modo claro uma possível função militar ou administrativa, enquanto a nota preserva as demais leituras.
- source_word: כָּאַרְבֶּה
  choice: como gafanhotos
  rationale: O singular hebraico tem valor coletivo e genérico; o plural em português transmite naturalmente a comparação.
- source_word: טַפְסְרַיִךְ
  choice: os seus escribas
  rationale: O empréstimo pode designar altos funcionários, talvez escribas ou comandantes militares. “Escribas” preserva o provável núcleo lexical e a leitura tradicional, sem ocultar em nota as alternativas administrativas e militares.
- source_word: כְּגֹב גֹבָי
  choice: como enxames de gafanhotos
  rationale: A forma duplicada intensifica a imagem de uma grande massa de insetos; “enxames de gafanhotos” expressa bem essa força coletiva.
- source_word: הַחוֹנִים
  choice: que pousam
  rationale: Embora o verbo costume significar “acampar” ou “instalar-se”, na imagem de gafanhotos sobre estruturas, “pousam” é corrente e vívido em português.
- source_word: בַּגְּדֵרוֹת
  choice: sobre os muros
  rationale: O termo pode indicar muros, cercas ou recintos. No contexto urbano e de cerco de Nínive, “muros” é adequado, mas a amplitude lexical é preservada em nota.
- source_word: בְּיוֹם קָרָה
  choice: num dia frio
  rationale: Tradução temporal direta, natural e contemporânea.
- source_word: שֶׁמֶשׁ זָרְחָה
  choice: Quando o sol nasce
  rationale: O perfeito hebraico integra uma descrição poética vívida. A construção temporal explicita naturalmente a sequência em que o calor faz os insetos partir.
- source_word: וְנוֹדַד
  choice: eles voam para longe
  rationale: O verbo significa fugir, vaguear ou afastar-se. O plural retoma os grupos comparados a gafanhotos, e “voam” mantém explícita a imagem dos insetos.
- source_word: וְלֹא נוֹדַע מְקוֹמוֹ אַיָּם
  choice: e já não se sabe onde estão
  rationale: A formulação idiomática comunica o desaparecimento repentino. A nota registra a construção hebraica mais literal e sua oscilação gramatical entre singular e plural.
