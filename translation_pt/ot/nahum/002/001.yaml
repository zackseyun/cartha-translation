id: NAM.2.1
reference: Nahum 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙ מַשְׁמִ֣יעַ שָׁל֔וֹם חָגִּ֧י יְהוּדָ֛ה חַגַּ֖יִ/ךְ שַׁלְּמִ֣י נְדָרָ֑יִ/ךְ כִּי֩ לֹ֨א יוֹסִ֥יף ע֛וֹד ל/עבור בָּ֥/ךְ בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/001.yaml
  text: Look[a], on the mountains are the feet of one who brings good news, who announces peace. Celebrate your festivals, Judah; fulfill your vows[b], for the worthless one will never again pass through you; he is completely cut off.
translation:
  language: pt
  text: Eis, sobre os montes, os pés do mensageiro de boas notícias[a], que anuncia a paz! Celebre suas festas, Judá; cumpra seus votos, pois o perverso[b] nunca mais passará por você; ele foi inteiramente eliminado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de quem traz boas notícias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o imprestável”; tradicionalmente, “Belial”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis
  rationale: Preserva a força dêitica e vívida da partícula hebraica em registro digno, sem acrescentar uma explicação ausente do texto.
- source_word: עַל הֶהָרִים
  choice: sobre os montes
  rationale: Mantém a imagem espacial e o substantivo hebraico, em formulação natural e reconhecível em português.
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: os pés do mensageiro de boas notícias
  rationale: Conserva a imagem concreta dos pés e expressa o sentido do particípio מְבַשֵּׂר. A alternativa mais verbal é registrada em nota.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: que anuncia a paz
  rationale: O particípio causativo comunica a ideia de fazer ouvir, isto é, anunciar ou proclamar; “anuncia a paz” é claro e mantém o tom de arauto.
- source_word: חָגִּי ... חַגַּיִךְ
  choice: Celebre suas festas
  rationale: Reproduz o imperativo dirigido a Judá e entende חַגַּיִךְ como celebrações religiosas, sem restringi-las à ideia de refeições.
- source_word: שַׁלְּמִי נְדָרָיִךְ
  choice: cumpra seus votos
  rationale: Traduz naturalmente o idioma hebraico de pagar ou levar a termo os votos religiosos.
- source_word: בְּלִיַּעַל
  choice: o perverso
  rationale: Trata o termo como designação descritiva do inimigo vil ou perverso, sem pressupor que seja aqui o nome próprio de uma figura demoníaca.
- source_word: לֹא יוֹסִיף עוֹד לַעֲבוֹר בָּךְ
  choice: nunca mais passará por você
  rationale: Preserva tanto a negação enfática de nova ocorrência quanto a metáfora hebraica de passar por Judá, sem explicitar “invadir” no texto principal.
- source_word: כֻּלֹּה נִכְרָת
  choice: ele foi inteiramente eliminado
  rationale: Comunica a totalidade enfatizada por כֻּלֹּה e o sentido de נִכְרָת, indicando que o inimigo foi completamente suprimido.
theological_decisions:
- issue: Se בְּלִיַּעַל deve ser entendido como nome próprio ou como designação descritiva
  choice: o perverso
  alternative: Belial; o imprestável
  rationale: Neste contexto profético, o termo pode caracterizar o inimigo como vil ou perverso sem necessariamente nomear um ser demoníaco. A tradução descritiva evita importar desenvolvimentos teológicos posteriores, enquanto a nota preserva a alternativa tradicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação de Judá e a imagem concreta dos pés do mensageiro foram preservadas. Os imperativos no singular refletem as formas femininas dirigidas a Judá.
