base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/004.yaml
  text: The shield of his mighty men is red[a]; the men of valor are clothed in scarlet. The chariots flash with the fire of steel on the day of his preparation[b], and the cypress spears are brandished.
translation:
  language: pt
  text: O escudo dos seus guerreiros está vermelho; os homens valentes estão vestidos de escarlate. Os carros reluzem com o fogo do aço[a], no dia de sua preparação[b], e as lanças de cipreste são agitadas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os carros estão com fogo de aço”. A expressão hebraica é difícil e pode aludir ao brilho de peças metálicas ou de lâminas nos carros.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no dia de seus preparativos”. O hebraico não explicita o que está sendo preparado.'
    reason: ambiguity
  - marker: c
    text: Literalmente, “os ciprestes são agitados”. Provavelmente, “ciprestes” designa por metonímia lanças ou hastes feitas de madeira de cipreste.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָגֵן גִּבֹּרֵיהוּ
  choice: O escudo dos seus guerreiros
  rationale: Mantém o singular coletivo de מָגֵן e traduz גִּבּוֹר no sentido marcial natural de “guerreiro”; o sufixo masculino permanece deliberadamente sem referente explicitado.
- source_word: מְאָדָּם
  choice: está vermelho
  rationale: Expressa o valor passivo-estativo do verbo sem decidir se a cor vem de pintura, revestimento ou sangue.
- source_word: אַנְשֵׁי חַיִל
  choice: os homens valentes
  rationale: Reproduz a expressão hebraica para combatentes capazes e valorosos em linguagem digna e acessível.
- source_word: מְתֻלָּעִים
  choice: vestem escarlate
  rationale: O termo indica coloração escarlate; o contexto sugere vestimenta, que é explicitada de modo natural sem especificar a peça usada.
- source_word: בְּאֵשׁ פְּלָדוֹת הָרֶכֶב
  choice: Os carros reluzem como fogo com suas peças de metal
  rationale: A frase hebraica é difícil. A tradução conserva a imagem ígnea e apresenta פְּלָדוֹת prudentemente como componentes metálicos dos carros, sem restringi-los a lâminas.
- source_word: בְּיוֹם הֲכִינוֹ
  choice: no dia em que ele os prepara
  rationale: Conserva o sujeito masculino implícito e entende os carros como objeto contextual, deixando o referente de “ele” em aberto.
- source_word: וְהַבְּרֹשִׁים
  choice: e as lanças de cipreste
  rationale: Interpreta “ciprestes” metonimicamente como armas de haste feitas dessa madeira, leitura adequada ao cenário militar; a nota registra o sentido mais literal.
- source_word: הָרְעָלוּ
  choice: são agitadas
  rationale: Escolha cautelosa para o verbo raro, preservando a ideia de movimento vigoroso sem impor a nuance mais específica de “brandidas”.
