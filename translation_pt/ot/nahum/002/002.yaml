base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
translation:
  language: pt
  text: O destruidor avançou contra você.[a] Guarde a fortaleza; vigie a estrada; fortaleça os lombos; reúna suas forças com todo o vigor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o dispersador” ou “aquele que despedaça”. O termo hebraico pode destacar tanto a dispersão quanto a destruição por despedaçamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: avançou
  rationale: No contexto militar, o verbo descreve o avanço do atacante contra a cidade; o perfeito apresenta a ameaça como já em marcha.
- source_word: מֵפִיץ
  choice: o destruidor
  rationale: O particípio substantivado designa o agente que dispersa ou despedaça. “Destruidor” soa natural em português e mantém o sentido amplo, enquanto a nota registra as imagens mais específicas.
- source_word: עַל־פָּנַיִךְ
  choice: contra você
  rationale: A expressão significa literalmente “sobre/diante do seu rosto”, mas neste contexto indica confronto direto. A tradução comunica o sentido sem reproduzir um idiomatismo pouco natural em português.
- source_word: נָצוֹר מְצֻרָה
  choice: Guarde a fortaleza
  rationale: A sequência de ordens militares favorece a referência à posição fortificada que deve ser defendida, embora o substantivo admita outras nuances.
- source_word: צַפֵּה דֶרֶךְ
  choice: vigie a estrada
  rationale: A ordem manda observar a rota pela qual o invasor se aproxima; “estrada” é concreta e idiomática.
- source_word: חַזֵּק מָתְנַיִם
  choice: fortaleça os quadris
  rationale: Preserva a metáfora corporal hebraica de preparar-se resolutamente para a ação, em linguagem compreensível e digna.
- source_word: אַמֵּץ כֹּחַ מְאֹד
  choice: reúna todas as suas forças
  rationale: Expressa de modo natural a ordem de tornar firme ou mobilizar intensamente a própria força; “todas” comunica a intensificação de מְאֹד.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com comandos militares breves. A metáfora corporal de “fortalecer os quadris” foi mantida, enquanto o idiomatismo “contra o seu rosto” foi traduzido pelo sentido contextual. A ameaça é dirigida no singular feminino à cidade de Nínive, representada por “você”.
