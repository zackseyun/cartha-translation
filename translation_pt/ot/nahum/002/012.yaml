  text: אַיֵּה֙ מְע֣וֹן אֲרָי֔וֹת וּ/מִרְעֶ֥ה ה֖וּא לַ/כְּפִרִ֑ים אֲשֶׁ֣ר הָלַךְ֩ אַרְיֵ֨ה לָבִ֥יא שָׁ֛ם גּ֥וּר אַרְיֵ֖ה וְ/אֵ֥ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/012.yaml
  text: Where is the lions’ den[a], the feeding place of the young lions, where the lion and lioness walked, where the lion’s cub was[b], with none to make them afraid?
translation:
  language: pt
  text: Onde está o covil dos leões, o lugar de alimentação dos leõezinhos[a], onde andavam o leão, a leoa[b] e o filhote do leão, sem que ninguém os amedrontasse?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a pastagem dos leõezinhos». O termo hebraico pode indicar uma pastagem ou um lugar de alimentação; aqui faz parte da metáfora dos leões.
    reason: lexical_alternative
  - marker: b
    text: Ou «o grande leão». A palavra hebraica לָבִיא admite mais de um sentido relacionado a leões; «leoa» se ajusta bem à sequência de leão, leoa e filhote.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Onde está
  rationale: Interrogativo de localização que introduz uma provocação sobre a queda de Nínive; em português, a cópula torna a pergunta natural.
- source_word: מְעוֹן אֲרָיוֹת
  choice: o covil dos leões
  rationale: מְעוֹן significa morada ou habitação; no contexto da metáfora dos leões, «covil» preserva naturalmente a imagem.
- source_word: וּמִרְעֶה הוּא לַכְּפִרִים
  choice: o lugar onde os leõezinhos se alimentavam
  rationale: מִרְעֶה pode indicar pastagem ou lugar de alimentação. A formulação evita sugerir que leões literalmente pastam e integra o pronome resumitivo הוּא de modo idiomático.
- source_word: אֲשֶׁר הָלַךְ
  choice: por onde andavam
  rationale: O relativo tem valor locativo, e הָלַךְ conserva o sentido básico de andar, sem intensificá-lo para «rondar» ou «espreitar».
- source_word: אַרְיֵה לָבִיא
  choice: o leão e a leoa
  rationale: A coordenação é explicitada naturalmente em português; לָבִיא admite aqui o sentido de «leoa», adequado à sequência familiar da imagem.
- source_word: שָׁם גּוּר אַרְיֵה
  choice: onde ficava o filhote do leão
  rationale: שָׁם é vertido locativamente, e גּוּר אַרְיֵה designa um filhote de leão; «ficava» supre de forma natural a cópula implícita.
- source_word: וְאֵין מַחֲרִיד
  choice: sem que ninguém os amedrontasse
  rationale: A construção expressa ausência de quem causasse temor; o pronome plural retoma o grupo de leões retratado no verso.
