  text: שַׁעֲרֵ֥י הַ/נְּהָר֖וֹת נִפְתָּ֑חוּ וְ/הַֽ/הֵיכָ֖ל נָמֽוֹג׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/007.yaml
  text: The gates of the rivers are opened[b][a], and the palace melts away.
translation:
  language: pt
  text: As portas dos rios se abrem[a], e o palácio se desfaz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “As portas dos canais se abrem”, caso o termo se refira aos canais de Nínive, e não a rios no sentido comum.
    reason: lexical_alternative
  - marker: b
    text: Ou “templo”, pois o termo hebraico pode designar tanto um palácio como um templo; neste contexto, “palácio” parece mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעֲרֵי
  choice: As portas dos
  rationale: O plural construto de שַׁעַר indica portas ou acessos; ligado a “rios”, a formulação natural em português é “as portas dos rios”.
- source_word: הַנְּהָרוֹת
  choice: rios
  rationale: O sentido lexical comum de נָהָר é “rio”. No contexto de Nínive, pode designar canais ou cursos de água associados às defesas, possibilidade preservada em nota.
- source_word: נִפְתָּחוּ
  choice: se abrem
  rationale: O nifal perfeito de פָּתַח tem sentido passivo, “foram abertas/estão abertas”. O presente “se abrem” reproduz a vivacidade da narração profética em português corrente.
- source_word: הַהֵיכָל
  choice: o palácio
  rationale: הֵיכָל pode indicar palácio ou templo. No oráculo contra Nínive, o contexto favorece o complexo palaciano.
- source_word: נָמוֹג
  choice: se desfaz
  rationale: O verbo expressa derretimento, dissolução ou colapso. “Se desfaz” conserva a imagem de desintegração e soa natural em português sem limitar o quadro a um derretimento literal.
theological_decisions:
- issue: Referente de הֵיכָל
  choice: palácio
  alternative: templo
  rationale: A amplitude lexical é genuína, mas o contexto da queda de Nínive favorece “palácio”; a alternativa é registrada em nota sem introduzir uma identificação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com presente vívido profético. A ordem das notas foi ajustada para que cada marcador acompanhe diretamente o termo a que se refere. “Se desfaz” mantém a metáfora de colapso ou dissolução sem impor uma descrição física excessivamente específica.
