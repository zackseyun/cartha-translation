  terminology: «Nobres» transmite bem אַדִּירָיו como pessoas proeminentes, sem especificar indevidamente uma patente. A formulação para הַסֹּכֵךְ evita apresentar como certo um sentido técnico disputado; a alternativa «escudo de cerco» e a explicação da nota são apropriadas. Os marcadores estão ancorados nos dois pontos textualmente relevantes.
