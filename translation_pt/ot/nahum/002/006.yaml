  text: יִזְכֹּר֙ אַדִּירָ֔י/ו יִכָּשְׁל֖וּ ב/הלכות/ם יְמַֽהֲרוּ֙ חֽוֹמָתָ֔/הּ וְ/הֻכַ֖ן הַ/סֹּכֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/006.yaml
  text: He summons his nobles; they stumble in their march. They hurry to her wall, and the siege shelter is set up.
translation:
  language: pt
  text: Ele convoca seus nobres[a]; eles tropeçam enquanto avançam. Correm para a muralha dela, e a cobertura de proteção[b] é colocada em posição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele se lembra dos seus nobres”.'
    reason: O verbo hebraico significa basicamente “lembrar”, mas aqui pode ter o sentido contextual de chamar ou reunir.
  - marker: b
    text: 'Ou: “o escudo de cerco”; o termo hebraico designa algum tipo de cobertura protetora, mas a estrutura exata é incerta.'
    reason: O substantivo é raro e pode indicar um mantelete, uma cobertura defensiva ou um grande escudo empregado perto da muralha.
lexical_decisions:
- source_word: יִזְכֹּר
  choice: convoca
  rationale: Embora o sentido básico do verbo seja “lembrar”, neste contexto militar ele indica que o governante chama ou reúne seus oficiais para a defesa.
- source_word: אַדִּירָיו
  choice: seus nobres
  rationale: O termo designa pessoas de destaque, poder ou posição elevada; “nobres” preserva o provável sentido de altos oficiais sem restringi-lo a uma função militar específica.
- source_word: בַּהֲלִיכוֹתָם
  choice: enquanto avançam
  rationale: Expressa literalmente o seu andar ou deslocamento; no cenário militar, “avançam” soa natural sem afirmar uma formação de marcha que o hebraico não explicita.
- source_word: הַסֹּכֵךְ
  choice: a cobertura de proteção
  rationale: O substantivo raro deriva da ideia de cobrir e provavelmente indica uma estrutura ou grande escudo protetor usado em operações junto à muralha. A tradução mantém a função sem impor um modelo técnico incerto.
theological_decisions:
- issue: Identidade do sujeito de יִזְכֹּר e dos nobres
  choice: Manter o sujeito apenas como “ele” e os convocados como “seus nobres”
  alternative: Identificar explicitamente o sujeito como o rei de Nínive ou como o comandante inimigo
  rationale: O versículo não nomeia o sujeito, e o contexto admite debate sobre a perspectiva militar. A tradução evita resolver essa ambiguidade de maneira indevida.
- issue: Referente feminino em חוֹמָתָהּ
  choice: “a muralha dela”
  alternative: “a muralha da cidade” ou “a muralha de Nínive”
  rationale: O sufixo hebraico é feminino singular. A formulação preserva o referente pronominal sem acrescentar um nome ausente neste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura breve e ritmo militar. “Convoca” comunica a ação contextual sem abandonar em nota o sentido lexical básico. “Cobertura de proteção” evita o tecnicismo pouco conhecido “mantelete” e preserva a incerteza do objeto.
