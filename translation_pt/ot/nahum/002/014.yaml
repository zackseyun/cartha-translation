revisions:
- from: “Eis que estou contra você”, declara Yahweh dos Exércitos. “Queimarei seus carros de guerra em meio à fumaça[a], e a espada devorará seus leões novos[b]. Eliminarei da terra a sua presa, e a voz dos seus mensageiros[c] nunca mais será ouvida.”
  to: “Eis que estou contra você”, declara Yahweh dos Exércitos. “Queimarei em fumaça os seus carros de guerra, e a espada devorará os seus leões jovens. Eliminarei da terra a sua presa, e a voz dos seus mensageiros nunca mais será ouvida.”
  rationale: 'Foram feitas correções limitadas para maior fidelidade e naturalidade: “em meio à fumaça” foi reduzido a “em fumaça”, evitando uma especificação espacial ausente do hebraico; “leões novos” foi substituído por “leões jovens”; e as aspas foram organizadas como um único oráculo. As âncoras de notas foram preservadas nos mesmos pontos semânticos: fumaça, leões jovens e mensageiros.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura e as imagens centrais do hebraico: a fórmula de confronto, Yahweh dos Exércitos, a destruição dos carros, a espada que devora os leões jovens, a remoção da presa e o silenciamento dos mensageiros. Contudo, “em meio à fumaça” introduz a noção espacial de estar cercado por fumaça, mais específica do que o hebraico בֶּעָשָׁן. Uma formulação mais próxima preserva a ambiguidade entre modo e resultado.'
  naturalness: O texto é geralmente claro e solene. “Leões novos”, porém, não é expressão idiomática em português atual; “leões jovens” é mais natural e mantém a imagem sem interpretá-la. A disposição das aspas em duas falas separadas após “declara” pode ser simplificada para uma única citação contínua, mais fluente em português.
  terminology: “Yahweh dos Exércitos”, “carros de guerra”, “espada”, “presa” e “mensageiros” são escolhas adequadas. “Leões jovens” substitui com vantagem “leões novos”, sem alterar o alcance metafórico nem impor uma identificação dos leões.
  issues:
  - severity: low
    issue: “Em meio à fumaça” é mais específico que בֶּעָשָׁן.
    rationale: A expressão hebraica permite “em fumaça” ou uma leitura resultativa (“em/até fumaça”), mas não exige a ideia espacial de algo ocorrer em meio a uma nuvem de fumaça.
  - severity: medium
    issue: “Leões novos” não soa natural em português contemporâneo.
    rationale: Embora compreensível, a expressão é pouco idiomática. “Leões jovens” transmite כְּפִירִים com maior naturalidade e preserva a imagem poética.
  - severity: low
    issue: A segmentação das aspas torna a fala divina desnecessariamente descontínua.
    rationale: O hebraico apresenta um único oráculo com a fórmula “declara Yahweh dos Exércitos” inserida. Uma citação contínua é mais clara em português.
  revised_text: “Eis que estou contra você”, declara Yahweh dos Exércitos. “Queimarei em fumaça os seus carros de guerra, e a espada devorará os seus leões jovens. Eliminarei da terra a sua presa, e a voz dos seus mensageiros nunca mais será ouvida.”
  revised_footnotes:
  - marker: a
    text: Ou “até reduzi-los a fumaça”. A expressão hebraica pode destacar o modo da queima (“em fumaça”) ou o seu resultado.
    reason: lexical_alternative
  - marker: b
    text: “Leões jovens” dá continuidade à imagem dos leões aplicada a Nínive; provavelmente representa seus guerreiros ou governantes.
    reason: cultural_note
  - marker: c
    text: Ou “enviados”. O termo hebraico pode designar mensageiros humanos enviados em missão oficial.
    reason: lexical_alternative
  revision_rationale: 'Foram feitas correções limitadas para maior fidelidade e naturalidade: “em meio à fumaça” foi reduzido a “em fumaça”, evitando uma especificação espacial ausente do hebraico; “leões novos” foi substituído por “leões jovens”; e as aspas foram organizadas como um único oráculo. As âncoras de notas foram preservadas nos mesmos pontos semânticos: fumaça, leões jovens e mensageiros.'
