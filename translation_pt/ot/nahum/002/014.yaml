base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/014.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will burn your chariots in smoke; the sword will devour your young lions. I will cut off your prey from the earth[c][b], and the voice of your messengers will no longer be heard.
translation:
  language: pt
  text: “Eis que estou contra você”, declara Yahweh dos Exércitos. “Queimarei em fumaça os seus carros de guerra, e a espada devorará os seus leões jovens. Eliminarei da terra a sua presa, e a voz dos seus mensageiros nunca mais será ouvida.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Eis que estou contra você
  rationale: Preserva a fórmula profética solene de confronto e verte אֵלַיִךְ em seu sentido adversativo no contexto.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: “Declara” expressa naturalmente a fórmula oracular נְאֻם; “Yahweh” representa diretamente o nome divino, e “dos Exércitos” conserva o título צְבָאוֹת.
- source_word: וְהִבְעַרְתִּי בֶעָשָׁן רִכְבָּהּ
  choice: Queimarei seus carros de guerra em meio à fumaça
  rationale: O hifil de בער indica destruição pelo fogo; רֶכֶב é entendido coletivamente como carros de guerra. A expressão com בֶעָשָׁן mantém aberta a relação entre a queima e a fumaça.
- source_word: וּכְפִירַיִךְ תֹּאכַל חָרֶב
  choice: a espada devorará seus leões novos
  rationale: Mantém tanto a personificação da espada quanto a imagem dos leões que atravessa o contexto, sem substituí-la por uma identificação interpretativa.
- source_word: וְהִכְרַתִּי מֵאֶרֶץ טַרְפֵּךְ
  choice: Eliminarei da terra a sua presa
  rationale: “Eliminarei” comunica a remoção decisiva expressa pelo hifil de כרת; “presa” preserva a metáfora predatória de טֶרֶף, e “terra” não restringe indevidamente אֶרֶץ.
- source_word: וְלֹא יִשָּׁמַע עוֹד קוֹל מַלְאָכֵכֵה
  choice: a voz dos seus mensageiros nunca mais será ouvida
  rationale: A passiva reproduz o nifal יִשָּׁמַע, “nunca mais” exprime a finalidade de לֹא...עוֹד, e “mensageiros” é o sentido humano apropriado de מַלְאָךְ neste contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” representa o nome próprio diretamente, sem substituí-lo por um título.
- issue: Identidade dos “leões novos”
  choice: manter a imagem literal no texto
  alternative: guerreiros; governantes
  rationale: A metáfora provavelmente alude aos guerreiros ou governantes de Nínive, mas o referente exato não deve substituir a imagem poética do hebraico.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com boa legibilidade brasileira. A fala divina foi delimitada por aspas para tornar clara a estrutura do oráculo. “Carros de guerra” evita a ambiguidade moderna de “carros”, e “leões novos” preserva a imagem sem a conotação infantil que “filhotes” poderia sugerir.
