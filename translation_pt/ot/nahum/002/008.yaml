  text: וְ/הֻצַּ֖ב גֻּלְּתָ֣ה הֹֽעֲלָ֑תָה וְ/אַמְהֹתֶ֗י/הָ מְנַֽהֲגוֹת֙ כְּ/ק֣וֹל יוֹנִ֔ים מְתֹפְפֹ֖ת עַל לִבְבֵ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/008.yaml
  text: 'It is fixed: she is stripped bare[a], she is carried away; and her slave girls are led off, moaning like the sound of doves[b], beating on their hearts.'
translation:
  language: pt
  text: Está determinado:[a] ela é desnudada[b] e levada embora; suas escravas são conduzidas para longe, com um som como o das pombas, batendo no peito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil. Também pode ser traduzido como “ela foi posta” ou “está estabelecido”.
    reason: alternative_reading
  - marker: b
    text: Ou “exposta” ou “exilada”; o hebraico pode reunir imagens de humilhação e deportação.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “sobre os corações delas”; a expressão pode se referir ao gesto de bater no peito em sinal de luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻצַּב
  choice: Está determinado
  rationale: A forma é difícil. A tradução impessoal comunica que o desfecho está estabelecido, sem atribuir explicitamente o decreto a uma autoridade nem adotar a leitura concreta “ela foi colocada”.
- source_word: גֻּלְּתָה
  choice: ela é desnudada
  rationale: O passivo de גלה pode expressar exposição ou desterro. “Desnudada” preserva aqui a imagem de exposição humilhante, enquanto o verbo seguinte comunica a remoção forçada.
- source_word: הֹעֲלָתָה
  choice: levada embora
  rationale: O hofal de עלה indica movimento imposto. A expressão portuguesa é natural no contexto da deportação de uma cidade personificada.
- source_word: אַמְהֹתֶיהָ
  choice: suas escravas
  rationale: אָמָה designa uma mulher em condição servil. “Escravas” preserva com clareza sua posição social, sem o abrandamento de “criadas”.
- source_word: מְנַהֲגוֹת
  choice: são conduzidas para longe
  rationale: A forma descreve as mulheres sendo conduzidas ou tangidas como cativas; a opção mantém o caráter coercivo sem sugerir necessariamente transporte físico.
- source_word: כְּקוֹל יוֹנִים
  choice: gemendo como o arrulho das pombas
  rationale: A comparação é auditiva. “Arrulho” fornece em português o som característico das pombas, e “gemendo” explicita seu valor de lamento no contexto.
- source_word: מְתֹפְפֹת עַל לִבְבֵהֶן
  choice: batendo sobre o coração
  rationale: A formulação conserva a imagem hebraica literal, embora o gesto possa referir-se idiomaticamente a bater no peito durante o luto.
