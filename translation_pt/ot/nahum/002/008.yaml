  naturalness: 'Há um problema de colocação e de referente em “batendo sobre o coração”: em português soa pouco natural e o singular perde o plural possessivo hebraico. “Batendo no peito” é a expressão idiomática para o gesto de luto; a nota pode preservar o literal “sobre o coração”. “Gemendo como o arrulho das pombas” também é algo pesado; “com um som como o das pombas” mantém de modo mais direto a comparação auditiva.'
  terminology: “Escravas” traduz adequadamente אֲמָהוׄתֶיהָ e não suaviza a condição social. “Desnudada” comunica a exposição humilhante, enquanto a nota registra as leituras alternativas. Não há questão teológica confessional.
