  text: In the streets the chariots race wildly[a]; they rattle through the squares. Their appearance is like torches[c][b]; like lightning they dart about.
translation:
  language: pt
  text: Pelas ruas, os carros de guerra correm alucinadamente[a]; pelas praças, avançam aos solavancos e com estrondo[b]. Seu aspecto é como o de tochas; como relâmpagos, disparam de um lado para outro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “correm furiosamente”; o verbo hebraico pode indicar comportamento frenético ou semelhante à loucura.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazem grande barulho”; o raro verbo hebraico provavelmente imita o som e sugere movimento ruidoso e sacudido.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “disparam para lá e para cá”; o hebraico enfatiza o movimento rápido de um lado para outro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּצוֹת
  choice: Pelas ruas
  rationale: No contexto urbano e em paralelo com רְחֹבוֹת, חוּצוֹת designa naturalmente as ruas da cidade.
- source_word: יִתְהוֹלְלוּ
  choice: correm alucinadamente
  rationale: A forma verbal retrata movimento frenético, descontrolado ou temerário; esta expressão preserva tanto a velocidade quanto a impressão de loucura.
- source_word: הָרֶכֶב
  choice: os carros de guerra
  rationale: O substantivo singular tem sentido coletivo e se refere à força de carros; o plural explícito é natural em português, e 'de guerra' esclarece o referente histórico.
- source_word: יִשְׁתַּקְשְׁקוּן
  choice: avançam aos solavancos, fazendo estrondo
  rationale: O verbo raro, provavelmente onomatopeico, combina ruído, choque e movimento sacudido; a formulação evita reduzi-lo apenas ao som.
- source_word: בָּרְחֹבוֹת
  choice: pelas praças
  rationale: רְחֹבוֹת são espaços públicos largos, como praças ou largos; 'praças' forma um paralelo urbano claro com 'ruas'.
- source_word: מַרְאֵיהֶן
  choice: Parecem
  rationale: A construção idiomática comunica de modo natural que a aparência dos carros é comparada à de tochas.
- source_word: כַּלַּפִּידִם
  choice: tochas
  rationale: לַפִּידִים são tochas ou fachos ardentes; 'tochas' mantém a imagem concreta e luminosa.
- source_word: כַּבְּרָקִים
  choice: como relâmpagos
  rationale: A expressão preserva diretamente a comparação com os clarões rápidos dos relâmpagos.
- source_word: יְרוֹצֵצוּ
  choice: cruzam de um lado para outro
  rationale: O verbo descreve deslocamento rápido e repetido em várias direções; a escolha torna explícito esse movimento, sem o reduzir a simplesmente 'correr'.
