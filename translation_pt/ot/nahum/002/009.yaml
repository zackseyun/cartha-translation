base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/009.yaml
  text: Nineveh has been like a pool of water from her earliest days[a], yet they are fleeing[b]. “Stop! Stop!”—but no one turns back.
translation:
  language: pt
  text: Nínive tem sido como um reservatório de água desde os seus primeiros dias[a]. Mas eles estão fugindo. “Parem! Parem!”[b] — mas ninguém se volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “desde os dias em que ela existe”; a expressão indica a existência antiga ou o passado duradouro de Nínive.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Fiquem firmes! Fiquem firmes!” O imperativo hebraico pode ser traduzido mais literalmente dessa forma; “Parem! Parem!” expressa seu sentido nesta cena de fuga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִינְוֵה
  choice: Nínive
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: כִבְרֵכַת מַיִם
  choice: como um reservatório de água
  rationale: Preserva a imagem de uma grande quantidade de água reunida em um só lugar; “reservatório” é claro em português sem limitar a imagem a uma piscina moderna.
- source_word: מִימֵי הִיא
  choice: desde os dias em que existe
  rationale: Mantém de perto a expressão hebraica incomum, cujo sentido aponta para a existência antiga e duradoura de Nínive, sem transformar a frase em uma formulação mais específica do que o original.
- source_word: וְהֵמָּה נָסִים
  choice: Mas agora eles fogem
  rationale: O pronome com o particípio apresenta os habitantes em plena fuga. “Mas agora” explicita com naturalidade o contraste contextual entre a antiga condição da cidade e a fuga presente.
- source_word: עִמְדוּ עֲמֹדוּ
  choice: Parem! Parem!
  rationale: A repetição transmite a urgência do grito. Embora o verbo signifique literalmente “ficar de pé” ou “permanecer”, em uma cena de fuga a ordem natural em português é “Parem!”.
- source_word: וְאֵין מַפְנֶה
  choice: mas ninguém se vira
  rationale: Reproduz a ideia de que ninguém muda de direção ou responde ao chamado, evitando acrescentar de modo categórico a noção de olhar para trás.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A metáfora do reservatório e a mudança repentina para os fugitivos foram preservadas. Os pronomes não identificam além do que o contexto permite quem está fugindo.
