    rationale: Embora possa refletir a ideia de esvaziamento, no contexto e na sequência aliterativa o termo descreve mais adequadamente devastação/assolação.
  - severity: medium
    issue: «Todos se contorcem de angústia» omite a referência a «todos os lombos».
    rationale: A formulação é inteligível, mas generaliza uma imagem corporal que o hebraico expressa explicitamente; «em todos os lombos» a preserva sem exigir interpretação adicional.
  - severity: low
    issue: «O rosto de todos» troca o plural hebraico por um singular coletivo.
    rationale: É gramaticalmente possível em português, mas «todos os rostos» espelha melhor a construção e reforça a imagem coletiva.
