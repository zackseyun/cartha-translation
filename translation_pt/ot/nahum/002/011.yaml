base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/011.yaml
  text: Devastation[a], desolation, and destruction! Hearts melt, knees give way, anguish is in every waist, and all their faces grow pale.
translation:
  language: pt
  text: Devastação, desolação e destruição! O coração se derrete, os joelhos vacilam, há angústia em todos os lombos, e todos os rostos perdem a cor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “todos os seus rostos acumulam escuridão”. A expressão hebraica é difícil e pode descrever um semblante escurecido ou sem cor por causa do terror.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוּקָה וּמְבוּקָה וּמְבֻלָּקָה
  choice: Vazio, desolação e ruína
  rationale: A sequência preserva três termos breves e crescentes para o estado devastado da cidade. “Vazio” representa o primeiro termo de modo mais direto; “desolação” comunica o esvaziamento e abandono; “ruína” dá força culminante ao terceiro. A aliteração hebraica não pode ser reproduzida plenamente sem sacrificar o sentido.
- source_word: לֵב נָמֵס
  choice: O coração se derrete
  rationale: Mantém tanto o singular coletivo do hebraico quanto a metáfora vívida para a perda de coragem causada pelo terror.
- source_word: פִק בִּרְכַּיִם
  choice: os joelhos vacilam
  rationale: Expressa em português natural a instabilidade e o colapso físico dos joelhos diante do medo.
- source_word: חַלְחָלָה בְּכָל מָתְנַיִם
  choice: todos se contorcem de angústia
  rationale: Comunica a aflição física intensa indicada por חַלְחָלָה e sua extensão a todos. Em vez de uma referência pouco natural a “cada lombo”, a formulação preserva o efeito corporal da expressão.
- source_word: וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר
  choice: o rosto de todos perde a cor
  rationale: A expressão hebraica é difícil e parece descrever uma alteração visível do semblante causada pelo terror. “Perde a cor” é claro e idiomático, sem definir com excesso de certeza se o rosto empalidece ou escurece.
theological_decisions: []
