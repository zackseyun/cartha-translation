  text: בֹּ֥זּוּ כֶ֖סֶף בֹּ֣זּוּ זָהָ֑ב וְ/אֵ֥ין קֵ֨צֶה֙ לַ/תְּכוּנָ֔ה כָּבֹ֕ד מִ/כֹּ֖ל כְּלִ֥י חֶמְדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/010.yaml
  text: Plunder silver! Plunder gold! There is no end to the treasure[b][a], an abundance of every precious thing.
translation:
  language: pt
  text: Saqueiem a prata! Saqueiem o ouro! Não há fim para o tesouro[a], uma abundância de todo tipo de objeto precioso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o estoque” ou “para as reservas”. O substantivo hebraico é raro e talvez destaque bens acumulados, em vez de “tesouro” em sentido abstrato.
    reason: lexical_alternative
  - marker: b
    text: Ou “de todo tipo de artigo valioso”. A expressão hebraica pode abranger diversos objetos desejáveis, não apenas recipientes ou utensílios em sentido restrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּזּוּ
  choice: Saqueiem!
  rationale: Imperativo plural de בזז, com o sentido de tomar bens como despojo de guerra. A repetição foi mantida para preservar a urgência e a força poética.
- source_word: כֶסֶף
  choice: prata
  rationale: O metal precioso, e não dinheiro em sentido genérico, corresponde ao paralelo com “ouro” e ao contexto de saque.
- source_word: זָהָב
  choice: ouro
  rationale: Tradução direta, em paralelo com “prata”.
- source_word: וְאֵין קֵצֶה
  choice: Não há fim
  rationale: Expressão portuguesa natural que preserva a ideia hebraica de quantidade sem limite.
- source_word: תְּכוּנָה
  choice: tesouro
  rationale: O substantivo raro parece designar bens acumulados ou armazenados. “Tesouro” comunica bem essa riqueza reunida, enquanto a possível nuance de estoque é preservada em nota.
- source_word: כָּבֹד
  choice: uma abundância
  rationale: Embora o termo costume significar “glória” ou “honra”, neste contexto material indica grande quantidade ou riqueza impressionante.
- source_word: מִכֹּל כְּלִי חֶמְדָּה
  choice: de todo tipo de objeto precioso
  rationale: כְּלִי pode designar recipiente, utensílio, artigo ou objeto, e חֶמְדָּה aquilo que é desejável ou precioso. A formulação evita restringir indevidamente a referência a vasos.
