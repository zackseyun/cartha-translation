source:
  edition: WLC
  text: כִּ֣י שָׁ֤ב יְהוָה֙ אֶת גְּא֣וֹן יַעֲקֹ֔ב כִּ/גְא֖וֹן יִשְׂרָאֵ֑ל כִּ֤י בְקָקוּ/ם֙ בֹּֽקְקִ֔ים וּ/זְמֹרֵי/הֶ֖ם שִׁחֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/003.yaml
  text: For Yahweh is restoring the majesty of Jacob like the majesty of Israel[c][b][a], though destroyers have destroyed them and ruined their vine branches.
translation:
  language: pt
  text: Pois Yahweh está restaurando a majestade de Jacó, como a majestade de Israel[a][b], pois saqueadores os despojaram[c] e arruinaram os seus ramos de videira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “restaurou” ou “restaurará”; o verbo hebraico pode apresentar como certa uma ação profeticamente anunciada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o orgulho de Jacó, como o orgulho de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, literalmente, “esvaziadores os esvaziaram”; isto é, saqueadores os despojaram por completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: está restaurando
  rationale: O qatal de שׁוב pode indicar ação concluída ou uma realidade futura apresentada como certa. No contexto do oráculo de reversão, a forma progressiva comunica em português a vivacidade da restauração anunciada sem limitar o verbo ao passado simples.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: גְּאוֹן
  choice: majestade
  rationale: O termo pode significar majestade, excelência ou orgulho. Como Yahweh a restaura em favor de Jacó/Israel, o sentido positivo é o mais adequado, sem eliminar a alternativa lexical.
- source_word: כִּגְאוֹן
  choice: como a majestade
  rationale: Entende-se o כ prefixado em sentido comparativo, preservando o paralelismo do texto consonantal.
- source_word: בְקָקוּם ... בֹּקְקִים
  choice: saqueadores os tenham saqueado
  rationale: A construção cognata intensifica a ideia de esvaziar, despojar ou devastar. A repetição natural em português conserva algo da força retórica hebraica.
- source_word: וּזְמֹרֵיהֶם
  choice: os seus ramos de videira
  rationale: זְמוֹרָה designa especificamente rebentos ou ramos de videira; a explicitação preserva a imagem agrícola.
- source_word: שִׁחֵתוּ
  choice: arruinado
  rationale: No piel, שׁחת exprime arruinar, destruir ou devastar, e 'arruinado' combina naturalmente com os ramos de videira.
theological_decisions:
- issue: Sentido de גְּאוֹן aplicado a Jacó/Israel
  choice: dignidade ou majestade positiva restaurada por Deus
  alternative: orgulho de Jacó como o orgulho de Israel
  rationale: A ação favorável de Yahweh favorece o sentido positivo, mas a nota mantém a ambiguidade lexical genuína.
- issue: Valor temporal de שָׁב
  choice: 'presente progressivo com força profética: ''está restaurando'''
  alternative: '''restaurou'' ou ''restaurará'''
  rationale: O perfeito hebraico pode apresentar a ação prometida como já certa; não se deve fixar silenciosamente apenas uma relação temporal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantém o nome Yahweh, o paralelismo poético, a imagem da videira e a repetição enfática da raiz hebraica em formulação idiomática.
