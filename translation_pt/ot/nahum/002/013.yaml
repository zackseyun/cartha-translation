base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/013.yaml
  text: The lion tore enough for his cubs and strangled prey for his lionesses[b][a]; he filled his dens with prey and his lairs with torn flesh.
translation:
  language: pt
  text: O leão despedaçava presas suficientes para os seus filhotes[a] e estrangulava presas para as suas leoas; encheu as suas covas de presas e os seus covis de carne dilacerada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “O leão despedaçou o bastante para os seus filhotes”. O particípio hebraico pode descrever uma ação contínua ou habitual.'
    reason: lexical_alternative
  - marker: b
    text: “Carne dilacerada” também pode ser traduzido como “presas” ou “aquilo que havia sido despedaçado”. A tradução emprega termos diferentes para preservar a variação poética do hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: O leão
  rationale: O singular apresenta de modo vívido e representativo o leão predador, imagem poética de Nínive/Assíria no contexto, sem explicitar essa identificação no texto.
- source_word: טֹרֵף בְּדֵי
  choice: despedaçava presas suficientes
  rationale: O particípio de טרף sugere ação habitual ou contínua, enquanto בְּדֵי expressa suficiência. A formulação preserva tanto a violência da imagem quanto a ideia quantitativa.
- source_word: גֹרוֹתָיו
  choice: os seus filhotes
  rationale: Designa os filhotes do leão; a escolha é natural, clara e precisa em português atual.
- source_word: וּמְחַנֵּק
  choice: e estrangulava presas
  rationale: O verbo חנק significa estrangular ou sufocar. “Presas” é objeto implícito, recuperado do contexto para dar clareza em português.
- source_word: לְלִבְאֹתָיו
  choice: para as suas leoas
  rationale: O termo se refere às fêmeas do leão e mantém integralmente a metáfora zoológica.
- source_word: וַיְמַלֵּא
  choice: enchia
  rationale: O imperfeito português harmoniza com a descrição de atividade habitual introduzida pelos particípios, sem transformar a cena em um único ato pontual.
- source_word: טֶרֶף
  choice: presas
  rationale: Preserva a imagem da caça do leão e, no contexto mais amplo, continua capaz de evocar indiretamente o saque.
- source_word: חֹרָיו
  choice: suas covas
  rationale: Refere-se a cavidades ou abrigos de animais. “Covas” é corrente e mantém o paralelismo sem se confundir com “covis”.
- source_word: וּמְעֹנֹתָיו
  choice: seus covis
  rationale: Indica moradas ou abrigos e, neste contexto, “covis” conserva a ambientação predatória e a variação poética.
- source_word: טְרֵפָה
  choice: carne dilacerada
  rationale: Distingue o termo do טֶרֶף anterior e ressalta o resultado violento da predação, sem perder o sentido possível de presa ou aquilo que foi despedaçado.
theological_decisions:
- issue: Imagem metafórica do leão aplicada a Nínive/Assíria
  choice: Manter literalmente a cena do leão, seus filhotes, leoas, covas e covis.
  alternative: Explicitar o referente político, parafraseando a ação como saque praticado pelo rei ou pelo império assírio.
  rationale: A identificação política decorre do contexto do oráculo, mas o próprio versículo desenvolve uma metáfora animal. Preservá-la respeita a poesia hebraica e evita incorporar interpretação explicativa ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada na segunda metade (“enchia de...”) para fluência, mantendo o paralelismo hebraico. Os particípios foram vertidos pelo imperfeito para expressar atividade habitual, e a metáfora do leão foi preservada sem explicação intrusiva.
