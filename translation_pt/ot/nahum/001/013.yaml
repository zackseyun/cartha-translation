  text: וְ/עַתָּ֕ה אֶשְׁבֹּ֥ר מֹטֵ֖/הוּ מֵֽ/עָלָ֑יִ/ךְ וּ/מוֹסְרֹתַ֖יִ/ךְ אֲנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/013.yaml
  text: And now I will break his yoke from upon you[a], and I will tear off your bonds.
translation:
  language: pt
  text: E agora quebrarei o jugo dele que está sobre você e romperei suas amarras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o marcador temporal que introduz a ação divina iminente, com fluidez em português.
- source_word: אֶשְׁבֹּר
  choice: quebrarei
  rationale: Traduz diretamente o qal imperfeito de שׁבר e combina naturalmente com a imagem do jugo.
- source_word: מֹטֵהוּ
  choice: o jugo dele
  rationale: Embora o substantivo possa designar vara ou barra, o paralelismo com as amarras e o contexto de opressão favorecem a imagem de um jugo de sujeição. A forma 'dele' preserva o sufixo masculino singular sem identificar explicitamente o opressor.
- source_word: מֵעָלָיִךְ
  choice: de cima de você
  rationale: Conserva a imagem espacial de uma carga que repousa sobre a destinatária, marcada no hebraico pela segunda pessoa feminina singular.
- source_word: וּמוֹסְרֹתַיִךְ
  choice: e ... as suas amarras
  rationale: '''Amarras'' comunica vínculos de sujeição em linguagem atual e mantém o paralelismo com o jugo.'
- source_word: אֲנַתֵּק
  choice: romperei
  rationale: O piel de נתק expressa arrancar, separar ou romper. 'Romperei' é vigoroso, natural e adequado às amarras.
theological_decisions:
- issue: Referente do sufixo masculino singular em מֹטֵהוּ
  choice: Manter 'o jugo dele' sem identificar o referente
  alternative: o jugo da Assíria / o jugo do rei assírio
  rationale: O contexto aponta para o poder opressor, provavelmente a Assíria ou seu rei, mas o hebraico traz apenas um sufixo de terceira pessoa masculina singular. A tradução preserva essa contenção e a ambiguidade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A destinatária feminina indicada pela morfologia hebraica não é explicitada pelo pronome português 'você', mas permanece compatível com ele. A formulação preserva a metáfora concreta e o referente não especificado do opressor.
