  text: אֵ֣ל קַנּ֤וֹא וְ/נֹקֵם֙ יְהוָ֔ה נֹקֵ֥ם יְהוָ֖ה וּ/בַ֣עַל חֵמָ֑ה נֹקֵ֤ם יְהוָה֙ לְ/צָרָ֔י/ו וְ/נוֹטֵ֥ר ה֖וּא לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/002.yaml
  text: Yahweh is a jealous and avenging God[a]; Yahweh is avenging and full of wrath. Yahweh takes vengeance on his adversaries[c][b], and he keeps wrath for his enemies.
translation:
  language: pt
  text: Yahweh é Deus zeloso[a] e vingador; Yahweh é vingador e cheio de furor[b]. Yahweh toma vingança contra seus adversários e guarda ira para seus inimigos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ciumento”. O termo hebraico expressa o zelo de Deus por uma relação exclusiva de aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “senhor” ou “possuidor de furor”.'
    reason: lexical_alternative
  - marker: c
    text: '“Ira” é suprida pelo contexto; literalmente, “guarda para seus inimigos”. Ou: “reserva ira para seus inimigos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Deus
  rationale: Identifica Yahweh como Deus e se integra naturalmente à sequência de qualificações no português.
- source_word: קַנּוֹא
  choice: zeloso
  rationale: Comunica o zelo exclusivo de Deus no âmbito da aliança sem sugerir a inveja mesquinha que “ciumento” pode evocar no uso moderno; a alternativa é registrada em nota.
- source_word: נֹקֵם / וְנֹקֵם
  choice: vingador / se vinga
  rationale: Preserva as três ocorrências enfáticas da raiz נקם, variando apenas a construção para produzir português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וּבַעַל חֵמָה
  choice: cheio de furor
  rationale: Expressa de modo idiomático a construção literal “senhor/possuidor de furor”, mantendo sua intensidade.
- source_word: חֵמָה
  choice: furor
  rationale: Transmite a intensidade da ira divina no contexto de juízo sem a conotação necessariamente descontrolada de outras formulações.
- source_word: לְצָרָיו
  choice: dos seus adversários
  rationale: Com “se vinga”, a preposição portuguesa “de” marca naturalmente aqueles sobre quem recai a vingança.
- source_word: וְנוֹטֵר
  choice: guarda sua ira
  rationale: No contexto, נטר indica conservar ou reter a ira; o objeto implícito é explicitado para clareza e fica documentado em nota.
- source_word: הוּא
  choice: —
  rationale: A ênfase do pronome hebraico é absorvida pela repetição explícita de Yahweh e pela estrutura da frase; inserir “ele” resultaria pouco natural nesta formulação portuguesa.
- source_word: לְאֹיְבָיו
  choice: contra os seus inimigos
  rationale: Indica com naturalidade o alvo da ira conservada, sem eliminar a possibilidade de entendê-la como ira reservada para eles.
theological_decisions:
- issue: O zelo divino
  choice: “zeloso”, entendido como dedicação ardente e reivindicação de exclusividade na aliança
  alternative: “ciumento”
  rationale: O hebraico קַנּוֹא comporta ambas as formulações. “Zeloso” evita uma leitura de inveja mesquinha, enquanto a nota preserva a alternativa tradicional e a tensão lexical.
- issue: A vingança e o furor divinos
  choice: Manter a linguagem forte e repetida de retribuição judicial
  alternative: Abrandar para “castiga” ou “fica irado”
  rationale: A repetição tripla de נקם e a expressão בעל חמה exigem que a intensidade do texto não seja suavizada.
- issue: Objeto implícito de נטר
  choice: Explicitar “ira” no texto
  alternative: Traduzir apenas “guarda contra os seus inimigos” ou entender “reserva ira para os seus inimigos”
  rationale: O paralelismo com חמה favorece a ideia de ira retida; a nota informa que “ira” não está expressa no hebraico e preserva a alternativa sem resolver além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática de “Yahweh” e da raiz ligada à vingança foi mantida; as notas preservam alternativas lexicais e a elipse da última oração.
