  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/012.yaml
  text: 'Thus says the LORD: Though they are whole, and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
translation:
  language: pt
  text: 'Assim diz o SENHOR: “Ainda que estejam intactos e sejam numerosos, mesmo assim serão cortados e desaparecerão. Embora eu tenha afligido você, não a afligirei mais.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: intactos
  rationale: Preserva a ideia de estarem inteiros, completos ou em plena condição, sem explicitar além do hebraico que se trate de força militar.
- source_word: נָגֹזּוּ
  choice: serão cortados
  rationale: Mantém a imagem literal do verbo, que neste contexto comunica eliminação ou destruição.
- source_word: וְעָבָר
  choice: e desaparecerão
  rationale: Expressa de modo natural o sentido contextual de passar e deixar de existir ou estar presente.
- source_word: עִנִּתִךְ
  choice: tenha afligido você
  rationale: O sufixo feminino singular dirige-se provavelmente a Judá; a formulação conserva o referente implícito e usa português corrente.
theological_decisions:
- issue: Identidade dos numerosos que serão cortados
  choice: manter o sujeito pronominal implícito em “estejam” e “sejam”
  alternative: explicitar “os assírios”
  rationale: O contexto pode identificar o grupo, mas o versículo hebraico não o nomeia; a tradução evita inserir uma identificação interpretativa no texto.
- issue: Agente da aflição de Judá
  choice: “eu tenha afligido”
  alternative: uma construção passiva, como “você tenha sido afligida”
  rationale: O hebraico apresenta o SENHOR como sujeito da aflição, tensão teológica que deve ser preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. “SENHOR” representa o nome divino יהוה segundo a convenção editorial. A alternância de “você” para “a” no último período sinaliza naturalmente em português que o destinatário é feminino singular, provavelmente Judá.
