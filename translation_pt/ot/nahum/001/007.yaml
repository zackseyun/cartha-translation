  text: ט֣וֹב יְהוָ֔ה לְ/מָע֖וֹז בְּ/י֣וֹם צָרָ֑ה וְ/יֹדֵ֖עַ חֹ֥סֵי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/007.yaml
  text: Yahweh is good[a], a stronghold in the day of distress[c][b]; he knows those who take refuge in him.
translation:
  language: pt
  text: Yahweh é bom; é uma fortaleza[a] no dia da angústia[b] e conhece os que nele se refugiam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um refúgio” ou “um lugar fortificado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no dia da aflição” ou “no dia da adversidade”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os que confiam nele”. O hebraico fala mais literalmente de buscar refúgio nele.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: bom
  rationale: Mantém a afirmação ampla e concisa sobre o caráter benéfico e moral de Yahweh, sem restringi-la a uma qualidade mais específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמָעוֹז
  choice: é uma fortaleza
  rationale: מָעוֹז designa um lugar de proteção ou defesa. A repetição de “é” produz uma construção natural em português e conserva a imagem concreta de segurança.
- source_word: בְּיוֹם צָרָה
  choice: no dia da angústia
  rationale: A expressão é temporal, e “angústia” comunica a aflição ou aperto denotado por צָרָה sem impor uma referência escatológica técnica.
- source_word: וְיֹדֵעַ
  choice: e conhece
  rationale: Preserva o sentido básico de ידע e também a conjunção hebraica, sem explicitar além do texto ideias como cuidar ou reconhecer favoravelmente.
- source_word: חֹסֵי בוֹ
  choice: os que nele se refugiam
  rationale: O particípio de חסה descreve quem busca proteção; “refugiam” conserva essa metáfora e se harmoniza com “fortaleza”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o nome divino; a transliteração “Yahweh” preserva sua condição de nome pessoal, sem substituí-lo por um título.
- issue: Possível sentido escatológico de “no dia da angústia”
  choice: sentido temporal geral
  alternative: um dia escatológico específico de angústia
  rationale: O versículo, por si só, não exige uma referência técnica a um evento escatológico. A formulação mantém aberta a aplicação geral a tempos de aflição.
- issue: Alcance relacional de וְיֹדֵעַ
  choice: e conhece
  alternative: e cuida de
  rationale: “Conhece” preserva tanto o sentido lexical básico quanto a possível dimensão relacional, sem transformar essa implicação em paráfrase explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. O ponto e vírgula e a repetição do verbo tornam natural a relação predicativa entre “bom” e “fortaleza”, sem eliminar o paralelismo conciso do hebraico.
