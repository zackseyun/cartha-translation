  text: מַה תְּחַשְּׁבוּ/ן֙ אֶל יְהוָ֔ה כָּלָ֖ה ה֣וּא עֹשֶׂ֑ה לֹֽא תָק֥וּם פַּעֲמַ֖יִם צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/009.yaml
  text: What are you plotting against Yahweh? He will make a complete end[b][a]; trouble will not rise up a second time.
translation:
  language: pt
  text: O que vocês tramam contra Yahweh?[a] Ele dará um fim total; a angústia não surgirá pela segunda vez.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que vocês planejam contra Yahweh?” O verbo também pode significar “pensar”, “planejar” ou “tramar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a aflição não se levantará duas vezes” ou “a calamidade não virá pela segunda vez”. O hebraico é conciso e pode se referir tanto ao ataque do inimigo quanto à desnecessidade de repetir o juízo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה תְּחַשְּׁבוּן
  choice: O que vocês tramam
  rationale: מַה introduz a pergunta retórica, e חשׁב pode significar pensar, planejar ou tramar. No contexto de oposição a Yahweh, “tramar” comunica a nuance hostil sem perder a forma interrogativa.
- source_word: אֶל יְהוָה
  choice: contra Yahweh
  rationale: Embora אֶל normalmente indique direção, com um verbo de planejamento neste contexto expressa oposição. O nome divino é transliterado como “Yahweh”, preservando o nome próprio do texto hebraico.
- source_word: כָּלָה הוּא עֹשֶׂה
  choice: Ele dará um fim completo
  rationale: כָּלָה denota término pleno ou destruição consumada. A construção com pronome e particípio apresenta Yahweh como agente de uma ação certa; o futuro é natural no discurso profético em português.
- source_word: לֹא תָקוּם פַּעֲמַיִם צָרָה
  choice: a angústia não surgirá pela segunda vez
  rationale: קום conserva a imagem de algo que surge, פַּעֲמַיִם tem aqui o sentido idiomático de “pela segunda vez”, e צָרָה pode indicar angústia, aflição, calamidade ou adversidade. “Angústia” mantém a formulação ampla e concisa.
theological_decisions:
- issue: Referente e sentido da oração final
  choice: Manter “a angústia não surgirá pela segunda vez”, sem identificar explicitamente quem a sofre ou causa.
  alternative: Entender que o ataque inimigo não se repetirá, ou que a aflição não voltará a atingir o povo de Deus.
  rationale: O hebraico é conciso e não especifica a perspectiva de צָרָה. A tradução preserva essa ambiguidade e, ao mesmo tempo, ressalta o caráter decisivo da ação de Yahweh.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. A formulação conserva a pergunta retórica, o nome divino e a ambiguidade da oração final.
