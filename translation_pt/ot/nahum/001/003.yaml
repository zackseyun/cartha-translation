  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ ו/גדול כֹּ֔חַ וְ/נַקֵּ֖ה לֹ֣א יְנַקֶּ֑ה יְהוָ֗ה בְּ/סוּפָ֤ה וּ/בִ/שְׂעָרָה֙ דַּרְכּ֔/וֹ וְ/עָנָ֖ן אֲבַ֥ק רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/003.yaml
  text: Yahweh is slow to anger and great in power[a], and he will by no means leave the guilty unpunished. Yahweh—his way is in the whirlwind and the storm, and clouds are the dust of his feet.
translation:
  language: pt
  text: Yahweh é paciente e grande em poder; de modo algum deixará o culpado sem punição.[a] O caminho de Yahweh está no vendaval e na tempestade, e as nuvens são o pó de seus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “de modo algum inocentará” ou “certamente não absolverá”.'
    reason: Alternativas lexicais que refletem mais literalmente o sentido judicial do verbo נקה e a negação enfática.
lexical_decisions:
- source_word: יְהֹוָה / יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, preservando seu caráter de nome próprio.
- source_word: אֶרֶךְ אַפַּיִם
  choice: paciente
  rationale: O idioma hebraico, literalmente relacionado a ser “longo de narinas”, indica demora em irar-se. “Paciente” comunica esse sentido com naturalidade em português moderno.
- source_word: וְגָדוֹל כֹּחַ
  choice: e grande em poder
  rationale: Mantém diretamente a combinação de “grande” com “força/poder” e conserva o paralelismo da afirmação.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: de modo algum deixa o culpado sem punição
  rationale: A construção intensiva com negação enfática declara que Yahweh não isenta da consequência da culpa. A formulação explicita em português o objeto implícito sem enfraquecer a força judicial.
- source_word: בְּסוּפָה וּבִשְׂעָרָה
  choice: no vendaval e na tempestade
  rationale: Distingue os dois termos de clima violento em linguagem corrente e preserva a imagem da manifestação divina.
- source_word: דַּרְכּוֹ
  choice: O caminho de Yahweh está
  rationale: Reformula a ordem marcada do hebraico em sintaxe portuguesa clara, entendendo “seu caminho” como a esfera de sua passagem.
- source_word: וְעָנָן אֲבַק רַגְלָיו
  choice: e as nuvens são o pó de seus pés
  rationale: Verte o singular coletivo “nuvem” pelo plural natural em português e mantém intacta a metáfora da marcha divina.
theological_decisions:
- issue: Forma do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Força de וְנַקֵּה לֹא יְנַקֶּה
  choice: de modo algum deixa o culpado sem punição
  alternative: de modo algum inocenta; certamente não absolve
  rationale: A tradução mantém juntas a paciência divina e a certeza do juízo, sem resolver ou suavizar essa tensão. A alternativa mais formal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Paciente” evita uma expressão pouco natural, enquanto a nota conserva a formulação judicial mais formal. A pontuação em dois períodos favorece clareza sem romper as imagens poéticas.
