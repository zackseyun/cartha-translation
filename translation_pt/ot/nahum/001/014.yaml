source:
  edition: WLC
  text: וְ/צִוָּ֤ה עָלֶ֨י/ךָ֙ יְהוָ֔ה לֹֽא יִזָּרַ֥ע מִ/שִּׁמְ/ךָ֖ ע֑וֹד מִ/בֵּ֨ית אֱלֹהֶ֜י/ךָ אַכְרִ֨ית פֶּ֧סֶל וּ/מַסֵּכָ֛ה אָשִׂ֥ים קִבְרֶ֖/ךָ כִּ֥י קַלּֽוֹתָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/014.yaml
  text: 'Yahweh has commanded concerning you: No more will your name be sown[a]. From the house of your gods I will cut off carved image and cast image. I will make your grave[c][b], for you are contemptible.'
translation:
  language: pt
  text: 'Yahweh deu uma ordem a seu respeito:


    “Seu nome não será mais semeado.[a]


    Da casa dos seus deuses, eliminarei

    as imagens esculpidas e as imagens de metal fundido.


    Prepararei a sua sepultura,[b]

    pois você é desprezível.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, seu nome, sua linhagem ou sua dinastia não continuará.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Farei a sua sepultura” ou “Designarei a sua sepultura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה עָלֶיךָ יְהוָה
  choice: Yahweh deu uma ordem a seu respeito
  rationale: O perfeito apresenta uma ordem divina já emitida e ainda válida. “A seu respeito” mantém a abrangência de עָלֶיךָ sem precisar tornar explícito o sentido hostil, já evidente no contexto.
- source_word: לֹא יִזָּרַע מִשִּׁמְךָ עוֹד
  choice: Seu nome não será mais semeado
  rationale: Preserva a metáfora agrícola e a voz passiva do hebraico. No contexto, a expressão provavelmente anuncia que o nome, a linhagem ou a dinastia do destinatário não terá continuidade.
- source_word: מִבֵּית אֱלֹהֶיךָ
  choice: Da casa dos seus deuses
  rationale: Mantém o sentido concreto de “casa” e o plural morfológico “deuses”, apropriado ao contexto da religião assíria.
- source_word: אַכְרִית
  choice: eliminarei
  rationale: Expressa com naturalidade o hifil de כרת, que aqui indica remover ou exterminar. Evita a possível estranheza de “cortarei” aplicada às duas classes de imagens.
- source_word: פֶּסֶל
  choice: imagens esculpidas
  rationale: Designa imagens produzidas por entalhe ou escultura e comunica em português moderno o caráter concreto desses ídolos.
- source_word: וּמַסֵּכָה
  choice: imagens de metal fundido
  rationale: Explicita que se trata de imagens produzidas pela fundição de metal, distinguindo-as das imagens esculpidas.
- source_word: אָשִׂים קִבְרֶךָ
  choice: Prepararei a sua sepultura
  rationale: 'Verte de modo natural a expressão hebraica concisa e preserva sua força ameaçadora: Yahweh determinará a morte e o sepultamento do destinatário.'
- source_word: כִּי קַלּוֹתָ
  choice: pois você é desprezível
  rationale: No contexto judicial, קלל descreve alguém considerado vil, de pouco valor ou desprezível. A escolha preserva a dureza da avaliação sem arcaísmo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de “seu nome não será mais semeado”
  choice: Manter a metáfora no texto principal
  alternative: Você não terá mais descendentes; sua dinastia não continuará
  rationale: A metáfora hebraica pode abranger descendência, linhagem, dinastia e perpetuação do nome. Mantê-la evita restringir indevidamente essa amplitude, enquanto a nota esclarece o provável sentido contextual.
- issue: Número de אֱלֹהֶיךָ
  choice: seus deuses
  alternative: seu deus
  rationale: A forma hebraica é plural e, no contexto da condenação da idolatria assíria, a referência a várias divindades é adequada.
- issue: Referente do destinatário masculino singular
  choice: Preservar a segunda pessoa singular sem identificar explicitamente o referente
  alternative: Identificá-lo como o rei da Assíria ou como Nínive
  rationale: O hebraico se dirige a um destinatário masculino singular, mas este versículo não o nomeia. A tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. O paralelismo poético foi disposto em linhas. A metáfora central foi preservada, e uma ambiguidade sintática real em torno de “sua sepultura” foi indicada em nota.
