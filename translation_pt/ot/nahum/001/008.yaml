revisions:
- from: Mas, com uma inundação avassaladora, ele dará fim completo ao lugar dela[a]; e as trevas perseguirão os seus inimigos.
  to: Mas, com uma inundação avassaladora, ele acabará completamente com o lugar dela[a]; e as trevas perseguirão os inimigos dele.
  rationale: A revisão substitui uma locução pouco natural por uma expressão portuguesa idiomática que retém o sentido de destruição completa. Também explicita, por meio de «dele», que os inimigos pertencem ao referente masculino implícito, sem resolver além do necessário a identidade desse referente. A nota é ajustada para preservar a alternativa «seu lugar» sem acrescentar ao texto principal uma identificação interpretativa.
