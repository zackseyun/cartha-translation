source:
  edition: WLC
  text: וּ/בְ/שֶׁ֣טֶף עֹבֵ֔ר כָּלָ֖ה יַעֲשֶׂ֣ה מְקוֹמָ֑/הּ וְ/אֹיְבָ֖י/ו יְרַדֶּף חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/008.yaml
  text: But with an overwhelming flood he will make a complete end of its place[a], and darkness will pursue his enemies.
translation:
  language: pt
  text: Mas, com uma inundação avassaladora, ele acabará completamente com o lugar dela[a]; e as trevas perseguirão os inimigos dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente «o lugar dela», com um sufixo feminino singular, provavelmente em referência à cidade sob julgamento, isto é, Nínive. Também se pode traduzir: «o seu lugar».'
    reason: Esclarece o antecedente implícito, preserva o gênero gramatical do hebraico e registra uma tradução portuguesa que pode tratar o referente de modo menos pessoal.
lexical_decisions:
- source_word: וּבְשֶׁטֶף עֹבֵר
  choice: Mas, com uma inundação avassaladora
  rationale: A conjunção assume valor adversativo natural após a afirmação de proteção no versículo 7. שֶׁטֶף עֹבֵר descreve uma inundação que transborda ou passa varrendo; “avassaladora” comunica sua força destrutiva sem eliminar a imagem concreta.
- source_word: כָּלָה יַעֲשֶׂה
  choice: ele dará fim completo
  rationale: A expressão indica levar algo plenamente ao fim, com sentido de destruição total. “Dará fim completo” é idiomático em português e conserva a intensidade de כָּלָה.
- source_word: מְקוֹמָהּ
  choice: ao lugar dela
  rationale: O sufixo hebraico é feminino singular e provavelmente remete à cidade ou potência hostil personificada, provavelmente Nínive. A formulação preserva o gênero e também a falta de um antecedente expresso neste versículo.
- source_word: וְאֹיְבָיו
  choice: e ... os seus inimigos
  rationale: O sufixo é masculino singular e, no contexto, refere-se naturalmente ao SENHOR. O possessivo português preserva essa relação sem inserir um nome ausente no hebraico.
- source_word: יְרַדֶּף חֹשֶׁךְ
  choice: as trevas perseguirão
  rationale: 'A ordem hebraica permite reconhecer חֹשֶׁךְ como sujeito posposto do verbo: são as trevas que perseguem os inimigos. “Trevas” mantém a imagem profética sem explicá-la como juízo no corpo do texto.'
theological_decisions:
- issue: Referentes dos sufixos em “lugar dela” e “seus inimigos”
  choice: O feminino em “lugar dela” remete à cidade ou potência julgada; o masculino em “seus inimigos” remete ao SENHOR.
  alternative: Tratar “lugar” de forma impessoal (“seu lugar”) ou atribuir ambos os sufixos ao mesmo referente.
  rationale: O hebraico muda deliberadamente de um sufixo feminino singular para um masculino singular. Manter essa mudança conserva a forma e a tensão do texto, sem uniformizar referentes distintos.
- issue: Agente da perseguição na oração final
  choice: As trevas são o sujeito que persegue os inimigos.
  alternative: Entender que o SENHOR perseguirá seus inimigos para dentro das trevas.
  rationale: A leitura mais direta da construção, com חֹשֶׁךְ como sujeito posposto, personifica as trevas como perseguidoras. A tradução evita acrescentar “para dentro de”, que não está expresso.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Inundação avassaladora” mantém a imagem concreta e sua força; “dará fim completo” conserva a intensidade do hebraico. O ponto e vírgula distingue as duas imagens paralelas de julgamento.
