base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/010.yaml
  text: For though they are tangled like thorns[a], and drenched with their drink[b], they will be consumed like fully dry stubble.
translation:
  language: pt
  text: Pois, ainda que[a] estejam como espinheiros entrelaçados e encharcados com a sua bebida[b], serão consumidos como palha completamente seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto estão como espinheiros entrelaçados”. A partícula inicial e a preposição formam uma expressão poética condensada.'
    reason: alternative_reading
  - marker: b
    text: O hebraico é difícil. A expressão também pode ser entendida como “como bêbados, embriagados com sua bebida” ou “como em sua bebedeira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação precedente, de modo natural no fluxo do discurso.
- source_word: עַד
  choice: ainda que
  rationale: A expressão poética é comprimida e difícil; a leitura concessiva comunica que o juízo virá apesar da condição descrita, sem ocultar a alternativa na nota.
- source_word: סִירִים סְבֻכִים
  choice: entrelaçados como espinhos
  rationale: Preserva a imagem de espinheiros emaranhados e combustíveis; “entrelaçados” é claro e digno em português.
- source_word: וּכְסָבְאָם סְבוּאִים
  choice: e encharcados de bebida
  rationale: Mantém a imagem de saturação por bebida e evita resolver em excesso a difícil construção hebraica; outras análises possíveis são registradas em nota.
- source_word: אֻכְּלוּ
  choice: serão consumidos
  rationale: O perfeito profético apresenta o juízo futuro como certo; a voz passiva corresponde à forma hebraica.
- source_word: כְּקַשׁ
  choice: como palha
  rationale: קשׁ designa restos secos de plantas, palha ou restolho; “palha” é a imagem mais imediata e compreensível em português.
- source_word: יָבֵשׁ מָלֵא
  choice: completamente seca
  rationale: מָלֵא intensifica a secura; a formulação natural em português ressalta quão facilmente a palha será queimada.
