  text: גּוֹעֵ֤ר בַּ/יָּם֙ וַֽ/יַּבְּשֵׁ֔/הוּ וְ/כָל הַ/נְּהָר֖וֹת הֶֽחֱרִ֑יב אֻמְלַ֤ל בָּשָׁן֙ וְ/כַרְמֶ֔ל וּ/פֶ֥רַח לְבָנ֖וֹן אֻמְלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/004.yaml
  text: He rebukes the sea and dries it up; he makes all the rivers run dry[a]. Bashan and Carmel wither; even the blossom of Lebanon withers.
translation:
  language: pt
  text: Ele repreende o mar e o faz secar; faz todos os rios secarem[a]. Basã e o Carmelo murcham, e a flor do Líbano murcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seca todos os rios”.'
    reason: Alternativa mais direta e compacta para o hifil de חרב; ambas as formulações comunicam que ele faz os rios ficarem secos.
lexical_decisions:
- source_word: גּוֹעֵר
  choice: repreende
  rationale: O particípio de גער expressa uma repreensão verbal enérgica, aqui retratando a autoridade divina sobre o mar. “Repreende” preserva tanto a imagem pessoal quanto suas ressonâncias bíblicas.
- source_word: בַּיָּם
  choice: o mar
  rationale: O substantivo definido singular é empregado em sentido geral ou cósmico; não há razão suficiente para tratá-lo como nome próprio.
- source_word: וַיַּבְּשֵׁהוּ
  choice: e o faz secar
  rationale: A forma verbal com sufixo masculino singular retoma “o mar”. A construção causativa é clara e natural em português.
- source_word: וְכָל הַנְּהָרוֹת הֶחֱרִיב
  choice: faz todos os rios secarem
  rationale: O hifil de חרב indica que os rios ficam secos. A formulação explicita naturalmente a força causativa sem introduzir a ideia menos provável de devastação.
- source_word: אֻמְלַל
  choice: murcham / murcha
  rationale: O verbo descreve o definhamento ou ressecamento da vegetação. “Murchar” se ajusta à imagem de regiões férteis e da flor e permite conservar a repetição poética hebraica.
- source_word: בָּשָׁן
  choice: Basã
  rationale: Forma portuguesa tradicional e reconhecível do topônimo, região célebre por sua fertilidade.
- source_word: וְכַרְמֶל
  choice: e o Carmelo
  rationale: Emprega-se a forma portuguesa tradicional do topônimo. O artigo torna a referência natural em português, sem acrescentar “monte”, ausente do hebraico.
- source_word: וּפֶרַח לְבָנוֹן
  choice: e a flor do Líbano
  rationale: פֶרַח significa “flor” ou “florescência”. A tradução mantém o singular poético e a coordenação simples do texto, sem acrescentar uma ênfase não expressa lexicalmente.
theological_decisions:
- issue: Sujeito divino implícito no versículo
  choice: Empregar “Ele”, retomando o SENHOR no contexto imediato.
  alternative: Repetir explicitamente “O SENHOR”.
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular, e o sujeito vem de Naum 1:2-3. O pronome fornece o sujeito exigido em português sem inserir novamente o nome divino, que não ocorre neste versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “murcham/murcha” conserva o paralelismo poético; não se acrescentou “até” antes de “a flor do Líbano”, pois essa ênfase não está explícita no hebraico.
