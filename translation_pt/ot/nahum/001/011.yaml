  text: מִמֵּ֣/ךְ יָצָ֔א חֹשֵׁ֥ב עַל יְהוָ֖ה רָעָ֑ה יֹעֵ֖ץ בְּלִיָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/011.yaml
  text: From you has come one who plots evil against Yahweh[a], a counselor of worthlessness.
translation:
  language: pt
  text: De você saiu alguém que trama o mal contra Yahweh, um conselheiro perverso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um conselheiro de Belial”, caso בְּלִיָּעַל seja entendido como termo semelhante a um nome próprio, e não como “perverso”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֵּךְ
  choice: De você
  rationale: A preposição מִן com sufixo de segunda pessoa feminina singular indica origem. A formulação dirige-se naturalmente à cidade ou entidade personificada, sem precisar explicitar o gênero em português.
- source_word: יָצָא
  choice: saiu
  rationale: O qatal apresenta a ação como realizada; “saiu” expressa de modo direto o surgimento dessa pessoa a partir da destinatária.
- source_word: חֹשֵׁב
  choice: alguém que trama
  rationale: O particípio de חשׁב, neste contexto hostil, descreve quem concebe ou planeja algo malicioso. “Trama” comunica essa intenção com naturalidade.
- source_word: עַל יְהוָה
  choice: contra Yahweh
  rationale: Com a ideia hostil de tramar o mal, עַל tem sentido adversativo, por isso “contra” é preferível a “a respeito de”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto principal o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רָעָה
  choice: o mal
  rationale: O contexto aponta para intenção moralmente má contra Yahweh, não meramente para calamidade ou dano.
- source_word: יֹעֵץ
  choice: um conselheiro
  rationale: O particípio funciona como designação nominal em aposição à pessoa anteriormente descrita.
- source_word: בְּלִיָּעַל
  choice: da perversidade
  rationale: A expressão mantém o substantivo como uma caracterização qualitativa ligada à maldade ou indignidade, sem tratá-lo necessariamente como nome próprio. Em português, “conselheiro da perversidade” é mais claro e natural do que uma reprodução literal como “do que não tem valor”.
theological_decisions:
- issue: Sentido de בְּלִיָּעַל
  choice: Substantivo comum com sentido de “perversidade”
  alternative: Nome próprio “Belial”
  rationale: No uso da Bíblia Hebraica, o termo pode caracterizar aquilo que é indigno, perverso ou inútil, sem exigir a personificação posterior de Belial. A leitura como nome é preservada em nota para não eliminar a ambiguidade tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A ordem “De você saiu” conserva a ênfase inicial do hebraico na origem, enquanto “alguém que trama” torna natural a função participial. O marcador [a] aparece imediatamente após a expressão a que se refere.
