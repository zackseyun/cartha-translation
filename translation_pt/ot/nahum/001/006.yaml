base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/006.yaml
  text: Who can stand before his indignation? And who can rise up in the heat of his anger? His wrath is poured out like fire[c][b][a], and the rocks are shattered by him.
translation:
  language: pt
  text: Quem pode permanecer de pé diante da sua indignação? E quem pode se levantar no ardor da sua ira?[a] Seu furor se derrama como fogo, e as rochas[b] são despedaçadas por ele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem pode suportar diante da sua indignação? E quem pode ficar de pé no ardor da sua ira?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os penhascos” ou “as escarpas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por causa dele” ou “a partir dele”. A preposição hebraica pode indicar agência, causa ou origem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי זַעְמוֹ
  choice: diante da sua indignação
  rationale: “Diante de” expressa naturalmente a ideia espacial e relacional de estar perante Deus; “indignação” conserva a dimensão moral de זַעַם sem reduzir o termo a uma emoção impulsiva.
- source_word: יַעֲמוֹד
  choice: pode permanecer de pé
  rationale: A formulação explicita a capacidade pressuposta pela pergunta retórica e mantém a imagem de continuar em pé sob o juízo.
- source_word: יָקוּם
  choice: pode se levantar
  rationale: Preserva o sentido básico de קוּם e a variação poética em relação a “permanecer de pé”.
- source_word: בַּחֲרוֹן אַפּוֹ
  choice: no ardor da sua ira
  rationale: Mantém a metáfora hebraica do calor ou ardor da ira em linguagem portuguesa digna e corrente.
- source_word: חֲמָתוֹ
  choice: seu furor
  rationale: Distingue este termo dos outros vocábulos de ira acumulados no verso e comunica sua intensidade no contexto de juízo.
- source_word: נִתְּכָה כָאֵשׁ
  choice: se derrama como fogo
  rationale: Reproduz a voz passiva/reflexiva idiomática do verbo e conserva integralmente a comparação com o fogo.
- source_word: הַצֻּרִים
  choice: as rochas
  rationale: É a opção portuguesa mais ampla e natural; não especifica indevidamente penhascos ou escarpas.
- source_word: נִתְּצוּ
  choice: são despedaçadas
  rationale: Transmite a força do verbo, que descreve quebra ou demolição violenta.
- source_word: מִמֶּנּוּ
  choice: por ele
  rationale: Expressa de modo direto a provável agência divina, enquanto a nota preserva a possibilidade de entender a preposição como origem ou causa.
theological_decisions:
- issue: Diversidade dos termos hebraicos para a ira divina
  choice: indignação, ira e furor
  alternative: repetir “ira” em todas as ocorrências
  rationale: A variação portuguesa reflete os diferentes termos hebraicos e a intensificação poética, sem acrescentar uma distinção doutrinária rígida entre eles.
- issue: Força das perguntas retóricas
  choice: usar “pode” nas duas perguntas
  alternative: traduzir apenas com formas do presente ou futuro
  rationale: No contexto, as perguntas tratam da incapacidade de resistir ao juízo divino; “pode” torna essa força clara sem transformar a pergunta em afirmação interpretativa.
- issue: Agência ou origem em מִמֶּנּוּ
  choice: por ele
  alternative: por causa dele, a partir dele ou diante dele
  rationale: A leitura de agência é adequada ao contexto e direta em português, mas a amplitude semântica da preposição hebraica é mantida em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e o paralelismo das perguntas foram preservados, assim como a sucessão de termos ligados à ira e as imagens do fogo e das rochas despedaçadas.
