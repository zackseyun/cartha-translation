source:
  edition: WLC
  text: הָרִים֙ רָעֲשׁ֣וּ מִמֶּ֔/נּוּ וְ/הַ/גְּבָע֖וֹת הִתְמֹגָ֑גוּ וַ/תִּשָּׂ֤א הָ/אָ֨רֶץ֙ מִ/פָּנָ֔י/ו וְ/תֵבֵ֖ל וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/005.yaml
  text: The mountains quake before him[a], and the hills melt away; the earth rises up before his face[b], the world and all who dwell in it.
translation:
  language: pt
  text: Os montes tremem diante dele, e as colinas se derretem; a terra se ergue[a] diante da sua face[b], o mundo e todos os que nele habitam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra é revolvida” ou “a terra se convulsiona”. O verbo hebraico pode transmitir a ideia de levantar-se, elevar-se ou sofrer uma convulsão neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante da face dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים רָעֲשׁוּ מִמֶּנּוּ
  choice: Os montes tremem diante dele
  rationale: רעשׁ descreve forte tremor, apropriado à cena teofânica. Embora מִמֶּנּוּ seja literalmente “a partir dele”, aqui indica que o tremor ocorre por causa de sua presença; “diante dele” comunica isso com naturalidade.
- source_word: וְהַגְּבָעוֹת הִתְמֹגָגוּ
  choice: e as colinas se derretem
  rationale: O hitpael de מוג preserva a imagem vívida de dissolução ou derretimento diante da presença divina; a forma pronominal é natural em português.
- source_word: וַתִּשָּׂא הָאָרֶץ
  choice: a terra se ergue
  rationale: נשׂא expressa levantar ou elevar. “Se ergue” conserva o movimento ascendente e permite que a imagem de convulsão cósmica permaneça aberta, sem a reduzir a simples tremor.
- source_word: מִפָּנָיו
  choice: diante da sua face
  rationale: Mantém a expressão antropomórfica hebraica, literalmente ligada à “face”, embora “diante dele” também seja possível em português.
- source_word: וְתֵבֵל וְכָל יֹשְׁבֵי בָהּ
  choice: o mundo e todos os que nele habitam
  rationale: תֵבֵל designa o mundo habitado, e o particípio יֹשְׁבֵי é vertido pela formulação digna e corrente “os que nele habitam”.
theological_decisions:
- issue: Imagens cósmicas na teofania do juízo divino
  choice: Conservar a reação dos montes, das colinas e da terra à presença divina em imagens concretas e intensas.
  alternative: Interpretar a linguagem explicitamente como mera metáfora de agitação política.
  rationale: O contexto imediato apresenta uma teofania de ira e majestade. A tradução preserva o alcance cósmico e a tensão poética do hebraico sem determinar se cada imagem deve ser entendida de modo estritamente literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservaram-se o paralelismo poético, a personificação da criação e a expressão antropomórfica do hebraico; as notas registram ambiguidades lexicais genuínas sem impor uma interpretação denominacional.
