  text: מַשָּׂ֖א נִֽינְוֵ֑ה סֵ֧פֶר חֲז֛וֹן נַח֖וּם הָ/אֶלְקֹשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/001.yaml
  text: An oracle concerning Nineveh[a]. The book of the vision of Nahum the Elkoshite.
translation:
  language: pt
  text: Oráculo a respeito de Nínive[a]. Livro da visão de Naum, o elcosita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Peso de Nínive” ou “Pronunciamento a respeito de Nínive”.
    reason: Alternativas lexicais para מַשָּׂא, termo que pode realçar tanto o peso da mensagem quanto seu caráter de declaração profética.
lexical_decisions:
- source_word: מַשָּׂא
  choice: oráculo
  rationale: Em títulos proféticos, designa uma declaração profética solene e de peso, não uma carga literal. “Oráculo” conserva o sentido técnico e é conciso em português; a nota registra alternativas que refletem outros aspectos do termo.
- source_word: נִינְוֵה
  choice: Nínive
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: סֵפֶר
  choice: livro
  rationale: Equivalente direto e natural de “livro, documento, escrito” neste cabeçalho, em construção com “visão”.
- source_word: חֲזוֹן
  choice: visão
  rationale: Termo profético usual para uma revelação vista ou recebida; mantém a forma lexical sem especificar além do hebraico o modo da revelação.
- source_word: נַחוּם
  choice: Naum
  rationale: Forma portuguesa consagrada do nome pessoal.
- source_word: הָאֶלְקֹשִׁי
  choice: o elcosita
  rationale: Reproduz o gentílico definido que identifica Naum por sua origem ou associação com Elcós, sem transformar essa relação possível em explicação categórica.
theological_decisions:
- issue: Relação entre as duas orações nominais do sobrescrito
  choice: 'Duas declarações breves de cabeçalho: “Oráculo a respeito de Nínive. Livro da visão de Naum, o elcosita.”'
  alternative: 'Uma única linha: “Oráculo de Nínive, livro da visão de Naum, o elcosita”; ou traduzir מַשָּׂא por “peso” e tratar tudo como um único título formal.'
  rationale: O hebraico apresenta dois elementos de cabeçalho em aposição. Separá-los preserva a estrutura e melhora a clareza. “A respeito de Nínive” evita sugerir que Nínive seja a origem ou autora do oráculo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o caráter conciso de sobrescrito profético e o gentílico tradicional “elcosita”.
