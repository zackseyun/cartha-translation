base_translation:
  language: en
  yaml_path: translation/ot/judges/011/004.yaml
  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: pt
  text: Depois de algum tempo[a], os amonitas lutaram contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E aconteceu depois de dias”, expressão idiomática que indica a passagem de algum tempo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Depois de algum tempo
  rationale: A expressão hebraica introduz a passagem de um período indefinido. A tradução é natural em português moderno e preserva esse sentido temporal.
- source_word: וַיִּלָּחֲמוּ
  choice: lutaram contra
  rationale: A forma do verbo לחם indica entrar em combate; com o oponente introduzido por עִם, “lutaram contra” expressa com clareza a relação hostil.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: Embora literalmente signifique “filhos de Amom”, a expressão funciona como etnônimo. “Os amonitas” é a forma corrente, clara e digna em português.
- source_word: עִם יִשְׂרָאֵל
  choice: contra Israel
  rationale: Embora עִם normalmente signifique “com”, em construção com o verbo “lutar” identifica a parte adversária; por isso, “contra Israel” comunica a função contextual.
