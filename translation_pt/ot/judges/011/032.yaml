  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: pt
  text: Então Jefté atravessou para ir até os amonitas, a fim de lutar contra eles[a], e Yahweh os entregou em sua mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «atravessou até os filhos de Amom». A expressão indica que Jefté se dirigiu aos amonitas para combatê-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: Preserva o sentido concreto de passar ou atravessar, adequado ao movimento militar no fluxo narrativo, sem substituir o verbo por uma interpretação como «avançou contra».
- source_word: אֶל
  choice: até
  rationale: Expressa movimento em direção aos amonitas. A hostilidade já é explicitada por «para lutar contra eles», portanto não precisa ser introduzida na preposição.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É o equivalente étnico natural em português para a expressão hebraica literalmente traduzida por «filhos de Amom».
- source_word: לְהִלָּחֶם בָּם
  choice: para lutar contra eles
  rationale: Reproduz de modo claro e natural o infinitivo de לחם com ב, que indica entrar em combate contra alguém.
- source_word: וַיִּתְּנֵם
  choice: os entregou
  rationale: No idioma militar «dar nas mãos de», o verbo comunica que os inimigos foram postos sob o poder do vencedor; «entregou» torna esse sentido claro sem eliminar a imagem das mãos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיָדוֹ
  choice: em suas mãos
  rationale: Conserva a imagem idiomática hebraica de domínio e vitória. O plural «mãos» é a forma idiomática mais natural em português, embora o hebraico tenha o singular.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal mediante uma transliteração amplamente aceita, sem substituí-lo por «SENHOR».
- issue: Agente da vitória sobre os amonitas
  choice: Yahweh os entregou em suas mãos
  alternative: Jefté venceu os amonitas
  rationale: Mantém explícita a afirmação teológica do hebraico de que Yahweh é o agente que concede a vitória, sem reduzi-la apenas à ação militar de Jefté.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Amonitas» traduz naturalmente o gentílico; «em suas mãos» preserva a imagem bíblica de poder e vitória. O marcador [a] aparece no texto principal.
