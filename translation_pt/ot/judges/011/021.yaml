  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: pt
  text: E Yahweh, o Deus de Israel, entregou Seom e todo o seu povo nas mãos[a] de Israel, e os israelitas os derrotaram. Assim, Israel tomou posse de toda a terra dos amorreus que habitavam naquela terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão de Israel”, expressão que significa “sob o poder de Israel”.'
    reason: Explica o idioma hebraico preservado de forma próxima no texto.
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: entregou ... nas mãos de Israel
  rationale: O verbo נתן com בְּיַד forma um idioma que indica entregar alguém ao poder de outro. A formulação portuguesa conserva a imagem da mão e comunica naturalmente o sentido militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta que identifica Yahweh como Deus de Israel.
- source_word: סִיחוֹן
  choice: Seom
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: כָּל עַמּוֹ
  choice: todo o seu povo
  rationale: Mantém o sentido normal de עַם sem restringi-lo interpretativamente a 'exército', embora o contexto seja de batalha.
- source_word: וַיַּכּוּם
  choice: os israelitas os derrotaram
  rationale: נכה em narrativa militar indica golpear ou infligir derrota. A explicitação do sujeito evita a ambiguidade pouco natural de 'eles' em português; 'derrotaram' expressa o resultado sem afirmar além do texto que todos foram mortos.
- source_word: וַיִּירַשׁ
  choice: tomou posse de
  rationale: Neste contexto, ירש descreve Israel passando a ocupar o território após a vitória; 'tomou posse de' preserva esse valor contextual.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: toda a terra dos amorreus
  rationale: O singular coletivo hebraico é vertido pelo plural étnico natural em português.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: que habitavam naquela terra
  rationale: O particípio singular concorda semanticamente com o etnônimo coletivo; o plural português torna essa relação clara e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. 'Yahweh' preserva o caráter de nome próprio e representa de modo amplamente aceito sua provável vocalização, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação narrativa foi preservada, e o sujeito de “derrotaram” foi explicitado para evitar ambiguidade pronominal. O relativo sem vírgula restringe a referência aos amorreus habitantes daquela terra.
