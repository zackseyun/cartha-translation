base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: pt
  text: Então Jefté foi com os anciãos de Gileade, e o povo o constituiu chefe e comandante sobre eles. E Jefté proferiu todas as suas palavras diante de Yahweh, em Mispá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por «proferiu todas as suas palavras» também pode indicar que Jefté repetiu ou apresentou solenemente todas as suas condições diante de Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: Jefté foi com os anciãos de Gileade
  rationale: Traduz diretamente a sequência narrativa e a ideia de acompanhamento, usando a designação convencional dos líderes civis de Gileade.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: o povo o constituiu ... sobre eles
  rationale: O verbo שׂים com objeto e עַל exprime a nomeação de alguém para exercer autoridade; «constituiu» comunica a instalação formal com naturalidade e dignidade.
- source_word: לְרֹאשׁ
  choice: chefe
  rationale: רֹאשׁ, literalmente «cabeça», designa aqui o líder principal. «Chefe» preserva a função metafórica sem soar artificial em português.
- source_word: וּלְקָצִין
  choice: e comandante
  rationale: קָצִין pode indicar comandante, capitão ou governante. À vista do conflito iminente com Amom, «comandante» expressa bem a dimensão militar sem negar a autoridade mais ampla.
- source_word: וַיְדַבֵּר ... אֶת כָּל דְּבָרָיו
  choice: proferiu todas as suas palavras
  rationale: Mantém a formulação abrangente do hebraico sem especificar indevidamente se se tratava de termos, compromissos, relato ou oração. «Proferiu» também comunica a solenidade do ato.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a expressão de presença e testemunho divinos, sem determinar se o cenário era estritamente cultual, judicial ou pactual.
- source_word: בַּמִּצְפָּה
  choice: em Mispá
  rationale: Translitera o topônimo em sua forma portuguesa corrente e usa a preposição natural para indicar o local.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» representa o nome pessoal e pactual sem substituí-lo por um título.
- issue: Natureza das palavras de Jefté diante de Yahweh
  choice: proferiu todas as suas palavras
  alternative: repetiu todas as suas condições; expôs todos os seus assuntos
  rationale: O hebraico não define explicitamente se Jefté reafirmou as condições negociadas, fez uma declaração solene ou apresentou a questão a Deus. A redação escolhida conserva essa amplitude e tensão.
- issue: Função de Jefté como רֹאשׁ e קָצִין
  choice: chefe e comandante
  alternative: líder e governante; chefe e capitão
  rationale: Os dois títulos provavelmente abrangem liderança geral e comando militar. A tradução mantém ambos, sem fundi-los em uma única função.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. «Jefté», «Gileade» e «Mispá» seguem formas bíblicas portuguesas correntes. A ordem narrativa e a ambiguidade da declaração diante de Yahweh foram preservadas.
