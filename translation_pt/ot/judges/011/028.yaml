  text: וְ/לֹ֣א שָׁמַ֔ע מֶ֖לֶךְ בְּנֵ֣י עַמּ֑וֹן אֶל דִּבְרֵ֣י יִפְתָּ֔ח אֲשֶׁ֥ר שָׁלַ֖ח אֵלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/028.yaml
  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: pt
  text: Mas o rei dos amonitas não deu ouvidos às palavras de Jefté que ele lhe enviou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Mas ... não deu ouvidos
  rationale: No contexto, שׁמע significa atender ou acatar, não apenas perceber sons; a expressão portuguesa preserva esse sentido e o וְ tem valor adversativo no encadeamento narrativo.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: o rei dos amonitas
  rationale: Forma natural em português para o título literal 'rei dos filhos de Amom'.
- source_word: אֶל דִּבְרֵי יִפְתָּח
  choice: às palavras ... de Jefté
  rationale: Preserva a referência à mensagem de Jefté, vertendo דְּבָרִים por 'palavras'.
- source_word: אֲשֶׁר שָׁלַח אֵלָיו
  choice: que Jefté lhe enviou
  rationale: Explicita Jefté como sujeito implícito de שָׁלַח e usa 'lhe' para o destinatário, o rei, evitando a ambiguidade pouco natural de uma tradução excessivamente literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'não deu ouvidos' comunica de modo idiomático a recusa do rei em atender à mensagem.
