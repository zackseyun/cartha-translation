language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: pt
  text: Eu não pequei contra você, mas você está me fazendo mal ao guerrear contra mim. Que Yahweh, o Juiz, julgue hoje entre os filhos de Israel e os filhos de Amom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os israelitas e os amonitas”. O hebraico diz literalmente: “entre os filhos de Israel e os filhos de Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: não pequei contra você
  rationale: Preserva a força moral e judicial de חטא e traduz idiomaticamente a construção com ל como “pecar contra”, sem introduzir em português uma distinção de gênero inexistente em “você”.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: está me fazendo mal
  rationale: Expressa de forma natural o sentido de fazer mal ou agir mal contra alguém, mantendo a acusação recíproca sem tornar a frase excessivamente jurídica.
- source_word: לְהִלָּחֶם בִּי
  choice: ao guerrear contra mim
  rationale: O infinitivo esclarece em que consiste o mal praticado. “Guerrear” comunica o contexto de conflito entre povos com mais precisão que o genérico “lutar”.
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: Que ... o Juiz, julgue
  rationale: 'Mantém a repetição retórica da raiz שפט e entende a forma verbal como apelo volitivo: “Que ... julgue”.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto que conserva a urgência temporal do apelo.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: entre os filhos de Israel e os filhos de Amom
  rationale: Conserva a expressão corporativa literalmente formada com “filhos de”, enquanto a nota oferece a formulação étnica mais corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome divino. “Yahweh” preserva sua função de nome próprio sem substituí-lo por um título.
- issue: Força do apelo יִשְׁפֹּט
  choice: Que Yahweh ... julgue
  alternative: Yahweh ... julgará
  rationale: A forma pode ser formalmente não marcada, mas, neste desafio diplomático, o valor volitivo de apelo ao julgamento divino se ajusta melhor ao contexto, sem transformar a fala numa simples previsão.
- issue: Expressão corporativa masculina בְּנֵי
  choice: filhos de Israel ... filhos de Amom
  alternative: israelitas ... amonitas
  rationale: A redação principal mantém a forma corporativa do hebraico; a alternativa idiomática é registrada em nota, sem apagar a expressão-fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “Que ... julgue” preserva o tom solene de apelo judicial; “guerrear” mantém explícito o contexto de guerra entre povos.
