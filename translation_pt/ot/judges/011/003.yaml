base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: pt
  text: Então Jefté fugiu de seus irmãos e passou a viver na terra de Tobe. Homens sem valor[a] juntaram-se a Jefté e saíram com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “homens vazios”; a expressão hebraica se refere a homens de má reputação, baixa posição ou caráter duvidoso, e não apenas a pessoas sem posses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: O verbo ברח expressa fuga diante de perigo ou hostilidade; “fugiu” é natural e preserva a ideia de partida forçada.
- source_word: מִפְּנֵי אֶחָיו
  choice: de seus irmãos
  rationale: A expressão significa literalmente “de diante da presença de seus irmãos”, mas aqui indica afastamento provocado pela hostilidade deles; “de seus irmãos” comunica isso com clareza.
- source_word: וַיֵּשֶׁב
  choice: passou a viver
  rationale: ישב pode significar sentar-se, permanecer ou habitar. No contexto, indica que Jefté estabeleceu residência ali, sem necessariamente sugerir permanência definitiva.
- source_word: בְּאֶרֶץ טוֹב
  choice: na terra de Tobe
  rationale: אֶרֶץ designa terra ou território, e טוֹב é aqui um topônimo, tradicionalmente transliterado em português como “Tobe”.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: juntaram-se a Jefté
  rationale: A forma reflexiva de לקט descreve pessoas que se agrupam, e אֶל indica aproximação e associação. A expressão portuguesa é natural sem definir além do texto a estrutura do grupo.
- source_word: אֲנָשִׁים רֵיקִים
  choice: homens sem valor
  rationale: Embora רֵיקִים signifique literalmente “vazios”, a expressão idiomática caracteriza homens de má reputação, baixa posição ou caráter duvidoso, não apenas pessoas sem bens.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: saíram com ele
  rationale: A frase diz literalmente que eles “saíram com ele”. O propósito das saídas não é declarado; por isso, a tradução não acrescenta que fossem ataques ou incursões.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios em formas correntes na tradição lusófona. A coordenação narrativa hebraica foi mantida de modo fluente, e a ambiguidade quanto à natureza das saídas de Jefté foi preservada.
