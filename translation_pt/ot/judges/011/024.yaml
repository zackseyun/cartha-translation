revisions:
- from: Acaso vocês não tomarão posse daquilo que Camos, o deus de vocês, lhes der para possuir?[a] Pois nós tomaremos posse de tudo o que Yahweh, nosso Deus, expulsar de diante de nós.[b]
  to: Não tomarás posse daquilo que Camos, teu deus, te concede?[a] E de tudo o que Yahweh, nosso Deus, expulsou de diante de nós,[b] tomaremos posse.
  rationale: A revisão restaura o singular da interlocução, mantém a pergunta retórica e o paralelismo lexical, e reproduz a diferença aspectual entre o perfeito causativo referente à ação de Yahweh e o imperfeito que exprime a futura posse de Israel. «Expulsou de diante de nós» conserva a imagem hebraica sem afirmar além do texto quem são os ocupantes removidos.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:08:22Z'
