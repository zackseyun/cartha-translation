  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: pt
  text: Não tomarás posse daquilo que Camos, teu deus, te concede?[a] E de tudo o que Yahweh, nosso Deus, expulsou de diante de nós,[b] tomaremos posse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mesmo verbo hebraico ירשׁ aparece em formas diferentes ao longo do versículo. Pode significar «possuir», «tomar posse» ou «herdar»; na forma causativa, como aqui, pode significar «fazer tomar posse» ou «conceder para possuir», muitas vezes com a ideia de desapossar ocupantes anteriores.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido «expulsou» é causativo e também pode ser entendido como «desapossou». Está no perfeito («expulsou»), ao passo que o verbo final está no imperfeito («tomaremos posse»).
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Acaso vocês não tomarão posse
  rationale: Introduz uma pergunta retórica que espera concordância; a construção com futuro conserva a força do imperfeito no argumento dirigido ao rei e ao povo que ele representa.
- source_word: יוֹרִישְׁךָ
  choice: lhes der para possuir
  rationale: O hifil de ירשׁ exprime fazer alguém entrar na posse, frequentemente mediante a perda da posse por outros. A formulação é natural em português e mantém a ideia causativa.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: Camos, o deus de vocês
  rationale: Translitera o nome divino conforme o uso corrente em português e apresenta a aposição sem acrescentar distanciamento interpretativo.
- source_word: תִירָשׁ
  choice: tomarão posse
  rationale: No contexto territorial e militar, 'tomar posse' comunica melhor do que 'herdar' a aquisição e ocupação da terra.
- source_word: הוֹרִישׁ
  choice: expulsar
  rationale: O hifil de ירשׁ pode indicar desapossar ou expulsar os ocupantes. 'Expulsar de diante de nós' preserva com clareza a ação contra os povos, deixando a posse resultante para o verbo principal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִפָּנֵינוּ
  choice: de diante de nós
  rationale: Reproduz de modo idiomático a imagem espacial do hebraico e sua dimensão de remoção do caminho ou da presença de Israel.
- source_word: נִירָשׁ
  choice: tomaremos posse
  rationale: Mantém a referência territorial de ירשׁ e o paralelismo com a primeira oração.
theological_decisions:
- issue: A referência a Camos como “o deus de vocês” no discurso de Jefté
  choice: Traduzir diretamente como parte do argumento diplomático e retórico de Jefté.
  alternative: Acrescentar aspas, ironia ou uma qualificação que negue explicitamente a divindade ou o poder de Camos.
  rationale: O hebraico apresenta o argumento a partir da crença professada pelos destinatários, sem que o narrador necessariamente endosse essa crença. Qualificações adicionais resolveriam interpretativamente uma tensão que o texto deixa implícita.
- issue: Aspecto verbal de הוֹרִישׁ e נִירָשׁ
  choice: 'Empregar futuro: “expulsar” e “tomaremos posse”.'
  alternative: 'Empregar perfeito e futuro: “expulsou” e “tomaremos posse”, ou perfeito composto: “tem expulsado”.'
  rationale: 'As formas hebraicas podem ser entendidas no quadro retórico como princípio geral/prospectivo: aquilo que cada divindade concede ou remove determina o que seu povo possui. O português no futuro mantém o paralelismo e evita impor exclusivamente uma leitura retrospectiva.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O plural “vocês” explicita naturalmente que o rei é tratado como representante de seu povo, embora os sufixos hebraicos sejam singulares. A repetição de “tomar posse” preserva o encadeamento retórico do verbo ירשׁ.
