base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: pt
  text: Jefté, o gileadita, era um guerreiro valente[a]; era filho de uma prostituta[b], e Gileade[c] gerou Jefté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “um homem poderoso e valente”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filho de uma mulher prostituta”.'
    reason: lexical_alternative
  - marker: c
    text: Gileade aqui é o nome do pai de Jefté, não apenas o nome da região.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: o gileadita
  rationale: O gentílico identifica Jefté por sua ligação com Gileade; a forma portuguesa é direta e preserva a designação hebraica.
- source_word: גִּבּוֹר חַיִל
  choice: um guerreiro valente
  rationale: No contexto narrativo, a expressão indica força, bravura e capacidade militar. Esta formulação é natural em português moderno sem perder o sentido marcial.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: filho de uma prostituta
  rationale: זוֹנָה designa de modo mais direto uma prostituta. A tradução é atual, clara e evita tanto o arcaísmo quanto o eufemismo.
- source_word: וַיּוֹלֶד
  choice: era seu pai
  rationale: O hifil de ילד afirma a paternidade biológica. A reformulação idiomática evita o pouco natural 'gerou Jefté' e comunica claramente a relação.
- source_word: גִּלְעָד
  choice: Gileade
  rationale: Aqui o nome próprio é o sujeito do verbo de geração e, portanto, designa o pai de Jefté, não apenas a região.
- source_word: וְ
  choice: sem equivalente lexical inicial autônomo
  rationale: A conjunção coordena o relato, mas não exige um marcador temporal como 'Ora'. A fluidez narrativa em português permite iniciar diretamente com o nome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A divisão em duas frases evita uma coordenação pesada e esclarece a paternidade sem acrescentar conteúdo.
