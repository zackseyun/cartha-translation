  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: pt
  text: E agora, será que você é realmente melhor do que Balaque, filho de Zipor, rei de Moabe?[a] Por acaso ele alguma vez entrou em disputa com Israel, ou alguma vez lutou contra eles?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será que você é melhor do que Balaque, filho de Zipor, rei de Moabe?” O hebraico repete a palavra traduzida como “melhor” para intensificar a comparação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Por acaso ele alguma vez teve uma contenda com Israel, ou alguma vez guerreou contra eles?” O primeiro verbo pode indicar uma disputa, uma querela ou uma reivindicação; o segundo se refere especificamente a lutar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o argumento anterior quanto a transição para o desafio retórico de Jefté.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: será que você é realmente melhor
  rationale: A formulação interrogativa e 'realmente' comunicam de modo natural a ênfase da repetição hebraica טוֹב טוֹב.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: do que Balaque, filho de Zipor, rei de Moabe
  rationale: Reproduz diretamente a comparação e a aposição, com as formas portuguesas tradicionais e amplamente reconhecidas dos nomes.
- source_word: הֲרֹב רָב
  choice: Por acaso ele alguma vez entrou em disputa
  rationale: A expressão 'por acaso... alguma vez' transmite a força enfática da construção com infinitivo absoluto; 'entrou em disputa' mantém a amplitude de ריב, que pode indicar contenda, querela ou reivindicação.
- source_word: עִם יִשְׂרָאֵל
  choice: com Israel
  rationale: Conserva o valor básico da preposição עִם e evita tornar o primeiro verbo idêntico ao combate explícito da oração seguinte.
- source_word: אִם
  choice: ou
  rationale: Introduz aqui o segundo membro da pergunta retórica alternativa.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: ou alguma vez lutou contra eles
  rationale: '''Alguma vez'' comunica a ênfase verbal, enquanto ''lutou contra'' expressa claramente o sentido hostil de לחם neste contexto.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A pergunta retórica foi formulada de maneira natural, sem apagar a ênfase das construções hebraicas repetitivas nem a distinção entre disputa e combate.
