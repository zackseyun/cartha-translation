  naturalness: O português é moderno, claro e adequado ao registro narrativo. «Você me deixou profundamente abatido» comunica bem a intensificação hebraica, e «não posso voltar atrás» é idiomático e fiel ao sentido contextual.
  terminology: «Yahweh» preserva de modo consistente o Tetragrama. A nota explica apropriadamente que «abrir a boca a Yahweh» se refere, no contexto, a fazer um voto, sem substituir a expressão hebraica no texto principal.
