base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: pt
  text: 'Quando a viu, rasgou suas roupas e disse: “Ah, minha filha! Você me deixou profundamente abatido e se tornou a causa da minha desgraça! Pois abri a boca a Yahweh[a] e não posso voltar atrás.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “fiz um voto a Yahweh”. O hebraico diz literalmente: “abri a boca a Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: Quando a viu
  rationale: A fórmula narrativa וַיְהִי seguida de oração temporal é expressa naturalmente em português por “Quando”; o pronome “a” retoma a filha sem acrescentar informação.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: rasgou suas roupas
  rationale: Preserva o gesto convencional de luto e profunda aflição, em linguagem corrente.
- source_word: אֲהָהּ בִּתִּי
  choice: Ah, minha filha!
  rationale: “Ah” comunica a exclamação de dor de forma natural e digna; “minha filha” mantém o vocativo direto.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: Você me deixou profundamente abatido
  rationale: A construção com infinitivo absoluto intensifica כרע. “Profundamente abatido” transmite a ideia de ser derrubado ou humilhado sem recorrer a uma formulação portuguesa artificial.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: e se tornou a causa da minha desgraça
  rationale: עכר indica causar perturbação, calamidade ou desgraça. A formulação preserva a acusação angustiada sem tornar a filha explicitamente culpada em sentido moral.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: Pois abri a boca diante de Yahweh
  rationale: Mantém a imagem hebraica solene de abrir a boca em um compromisso pronunciado. “Diante de” expressa adequadamente a fala dirigida a Yahweh, e a nota esclarece que o contexto é o de um voto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: e não posso voltar atrás
  rationale: Expressão portuguesa natural que conserva a imagem de não poder retornar ou recuar do que foi declarado.
theological_decisions:
- issue: Tornar explícito no texto principal que Jefté havia feito um voto
  choice: Conservar o idioma hebraico “abri a boca diante de Yahweh” e esclarecer seu sentido em nota.
  alternative: “Fiz um voto a Yahweh” ou “dei minha palavra a Yahweh”.
  rationale: O contexto identifica a declaração como voto, mas o hebraico emprega uma imagem mais solene. Mantê-la preserva a forma e evita explicitação desnecessária.
- issue: Intensidade da acusação de Jefté contra a filha
  choice: “Você me deixou profundamente abatido e se tornou a causa da minha desgraça”.
  alternative: “Você me arruinou” ou “você se tornou minha destruidora”.
  rationale: O hebraico expressa angústia extrema, mas não exige que a tradução acrescente uma condenação moral mais forte da filha.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. A sintaxe foi mantida direta, e o paralelismo emocional da fala foi preservado. O marcador da nota foi colocado junto à expressão que ela explica.
