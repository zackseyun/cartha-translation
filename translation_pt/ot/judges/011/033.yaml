base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: pt
  text: Ele os derrotou desde Aroer até a entrada de Minite[a] — vinte cidades — e até Abel-Queramim[b], infligindo-lhes uma derrota devastadora[c]. Assim, os amonitas[d] foram subjugados diante dos israelitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até Minite” ou “até as proximidades de Minite”. A expressão hebraica é difícil e pode indicar o acesso à cidade ou simplesmente a própria cidade.
    reason: alternative_reading
  - marker: b
    text: Abel-Queramim é um nome geográfico. Seus componentes podem significar algo como “campo dos vinhedos”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “com um golpe muito grande”. Em contexto militar, a expressão pode indicar um ataque arrasador, uma grande derrota ou uma matança.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “os filhos de Amom”; no fim do versículo, o hebraico diz, de modo correspondente, “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Ele os derrotou
  rationale: O verbo נכה significa literalmente “ferir/golpear”, mas, neste contexto militar e em combinação com מַכָּה, “derrotou” comunica com naturalidade o resultado do ataque sem exigir que o verbo, por si só, signifique que todos foram mortos.
- source_word: מֵעֲרוֹעֵר
  choice: desde Aroer
  rationale: Nome geográfico transliterado; מִן marca o ponto inicial da extensão territorial.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: até a entrada de Minite
  rationale: A construção difícil com בּוֹא pode indicar a entrada, o acesso ou as proximidades da cidade. “Entrada de Minite” preserva a referência geográfica e soa natural em português, enquanto a nota registra a ambiguidade.
- source_word: עֶשְׂרִים עִיר
  choice: vinte cidades
  rationale: Tradução direta do numeral e do substantivo; os travessões assinalam sua função explicativa dentro da descrição geográfica.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: e até Abel-Queramim
  rationale: A expressão funciona como topônimo e, por isso, é transliterada em vez de traduzida por seu possível sentido etimológico.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: uma derrota devastadora
  rationale: מַכָּה pode significar “golpe”, “ataque” ou “derrota” em contexto militar. “Devastadora” expressa idiomaticamente a forte intensificação de גְּדוֹלָה מְאֹד sem afirmar de modo indevido que todos foram mortos.
- source_word: וַיִּכָּנְעוּ
  choice: foram subjugados
  rationale: O nifal de כנע descreve a sujeição militar ou política dos amonitas, não necessariamente uma humilhação interior.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: Equivalente português corrente da expressão hebraica literal “filhos de Amom”; evita uma formulação pouco natural sem perder a identidade do povo.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: diante dos israelitas
  rationale: מִפְּנֵי expressa aqui a sujeição perante o adversário. “Israelitas” é o equivalente idiomático de “filhos de Israel”.
