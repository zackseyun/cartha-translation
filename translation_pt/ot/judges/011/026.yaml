base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: pt
  text: Durante os trezentos anos em que Israel habitou em Hesbom e nas cidades que dela dependiam[a], em Aroer e nas cidades que dela dependiam, e em todas as cidades ao longo do Arnom, por que vocês não as retomaram[b] naquele período?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “suas filhas”, isto é, as povoações menores dependentes de uma cidade principal.
    reason: cultural_note
  - marker: b
    text: Ou “as livraram” ou “as resgataram”; neste contexto, o sentido é recuperar o território.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת יִשְׂרָאֵל
  choice: Durante os trezentos anos em que Israel habitou
  rationale: A preposição ב com o infinitivo construto de ישׁב introduz uma circunstância temporal. A formulação portuguesa integra naturalmente a duração mencionada mais adiante no hebraico e conserva o sentido de residência prolongada.
- source_word: בְּנוֹתֶיהָ
  choice: as cidades que dela dependiam
  rationale: Literalmente, “suas filhas”; trata-se de um idiomatismo para povoações subordinadas a uma cidade principal. A tradução comunica o sentido no texto, enquanto a nota preserva a metáfora hebraica.
- source_word: עַרְעוֹר
  choice: Aroer
  rationale: Transliteração portuguesa corrente do nome geográfico.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: ao longo do Arnom
  rationale: A expressão significa “ao lado de, junto a”. “Ao longo do Arnom” é natural e apropriado para várias cidades situadas nas proximidades do rio ou vale.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: durante os trezentos anos
  rationale: Expressa a duração da ocupação israelita e se integra à oração temporal de modo claro em português.
- source_word: הִצַּלְתֶּם
  choice: retomaram
  rationale: O hifil de נצל geralmente significa “livrar” ou “resgatar”; no contexto da disputa territorial, a pergunta é por que os interlocutores não recuperaram as cidades. “Retomaram” expressa esse sentido contextual sem apagar a alternativa lexical, registrada em nota.
- source_word: בָּעֵת הַהִיא
  choice: naquele período
  rationale: Embora עֵת possa ser traduzido por “tempo”, o contexto aponta para todo o período de trezentos anos, não para um único momento. “Naquele período” torna essa referência natural em português.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase foi levemente reorganizada para ligar os “trezentos anos” à oração temporal sem alterar o argumento retórico. Os topônimos seguem formas portuguesas usuais: Hesbom, Aroer e Arnom.'
