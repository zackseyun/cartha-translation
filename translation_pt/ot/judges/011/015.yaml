  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: pt
  text: 'E ele lhe disse: “Assim diz Jefté: Israel não tomou a terra de Moabe nem a terra dos filhos de Amom.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: E ele lhe disse
  rationale: Reproduz a sequência narrativa marcada pelo waw consecutivo e mantém explícito o destinatário da fala.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula solene de mensageiro e sua força declarativa, corrente também em português bíblico compreensível.
- source_word: יִפְתָּח
  choice: Jefté
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֹא לָקַח
  choice: não tomou
  rationale: Mantém o sentido amplo de לקח sem acrescentar a ideia mais específica de conquista violenta ou captura.
- source_word: אֶרֶץ
  choice: terra
  rationale: É a equivalência normal no contexto geográfico-político e preserva a repetição hebraica.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Emprega a forma tradicional do topônimo em português.
- source_word: בְּנֵי עַמּוֹן
  choice: filhos de Amom
  rationale: Preserva formalmente o etnônimo hebraico e sua referência ao povo descendente de Amom; a formulação é inteligível em português.
