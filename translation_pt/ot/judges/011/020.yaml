  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: pt
  text: Mas Seom não confiou em Israel o bastante para deixá-lo passar por seu território[a]. Por isso, Seom reuniu todo o seu povo[b], e eles acamparam em Jaza. Então ele lutou contra Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não acreditou em Israel” ou, por implicação, “não confiou em Israel para que passasse”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “todo o seu povo”. O texto não diz explicitamente “exército”, embora o contexto seja militar.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “lutou com Israel”; neste contexto, a expressão significa que lutou contra Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: não confiou ... o bastante
  rationale: O hifil de אמן expressa aqui confiança depositada em alguém. A formulação portuguesa comunica naturalmente que a recusa de passagem decorreu da falta de confiança, sem reduzir o verbo a simples permissão.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: deixá-lo passar por seu território
  rationale: עבר indica passagem, e גבול pode designar não só a fronteira, mas toda a área sob domínio. No contexto do pedido de trânsito, “passar por seu território” é natural e preciso.
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: אסף descreve o ajuntamento ou mobilização do povo. “Reuniu” mantém a amplitude do termo sem inserir explicitamente a ideia de exército.
- source_word: כָּל עַמּוֹ
  choice: todo o seu povo
  rationale: Reproduz a expressão hebraica sem restringi-la a “exército”, embora o contexto seja militar.
- source_word: וַיַּחֲנוּ
  choice: eles acamparam
  rationale: O verbo está no plural e retoma o povo reunido; “acamparam” é corrente e claro em português moderno.
- source_word: בְּיָהְצָה
  choice: em Jaaz
  rationale: “Jaaz” é uma forma portuguesa reconhecível do topônimo hebraico יָהְצָה, e a preposição “em” indica naturalmente o local do acampamento.
- source_word: וַיִּלָּחֶם עִם
  choice: ele lutou contra
  rationale: Embora עם signifique literalmente “com”, junto de לחם a relação é adversativa neste contexto. “Lutou contra” evita a leitura de que Seom combateu ao lado de Israel.
