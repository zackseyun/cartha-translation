translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação narrativa hebraica foi levemente variada com “Por isso” e “Então” para fluidez, preservando a sequência dos acontecimentos. Todos os marcadores de nota aparecem junto ao trecho relevante.
