base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: pt
  text: 'O rei dos amonitas disse aos mensageiros de Jefté: “Já que Israel tomou a minha terra quando saiu do Egito, desde o Arnom até o Jaboque e até o Jordão, agora devolva essas terras em paz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: É porque
  rationale: Preserva a forma causal da resposta do rei à pergunta anterior, sem reduzi-la a uma simples declaração.
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: quando saiu do Egito
  rationale: Expressa em português natural o sentido idiomático de Israel subir ou partir do Egito; o sujeito coletivo singular é mantido.
- source_word: הָשִׁיבָה אֶתְהֶן
  choice: devolva-a
  rationale: O sufixo feminino plural hebraico retoma as extensões de terra ou regiões mencionadas; em português, o referente discursivo imediato é o singular coletivo “a minha terra”.
- source_word: בְּשָׁלוֹם
  choice: pacificamente
  rationale: Mantém a exigência de restituição sem conflito, com formulação clara e corrente.
theological_decisions:
- issue: A alegação territorial do rei amonita
  choice: Apresentá-la diretamente como fala do rei, sem validá-la pelo narrador
  alternative: Reformular a alegação para harmonizá-la com o relato histórico posterior
  rationale: O versículo registra a reivindicação do rei; sua veracidade é discutida na resposta de Jefté. A tradução deve preservar essa tensão narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Amonitas”, “Jefté”, “Arnom” e “Jaboque” seguem formas bíblicas correntes. A pontuação divide a longa fala hebraica sem alterar sua relação causal.
