  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: pt
  text: 'Jefté disse aos anciãos de Gileade: “Se vocês me fizerem voltar para lutar contra os amonitas, e Yahweh os entregar diante de mim, eu serei o chefe de vocês[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como cabeça para vocês”; isto é, o líder de vocês.
    reason: lexical_alternative
  - marker: b
    text: 'A última oração também pode ser entendida como pergunta: “Serei eu o chefe de vocês?”'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים
  choice: me fizerem voltar
  rationale: O hifil de שׁוב tem sentido causativo, “fazer voltar”. A formulação recorda naturalmente que Jefté havia sido expulso e agora seria levado de volta.
- source_word: לְהִלָּחֵם
  choice: para lutar
  rationale: O infinitivo nifal de לחם indica entrar em combate; “lutar” é claro, atual e adequado ao contexto militar.
- source_word: בִּבְנֵי עַמּוֹן
  choice: contra os amonitas
  rationale: A expressão literalmente significa “contra os filhos de Amom”, mas o gentílico “amonitas” comunica o referente com naturalidade, enquanto “contra” expressa o valor adversativo de ב neste contexto.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: e Yahweh os entregar diante de mim
  rationale: “Entregar” expressa o uso de נתן em contexto de vitória, e “diante de mim” conserva לְפָנַי sem introduzir a expressão “em minhas mãos”, que não consta do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְרֹאשׁ
  choice: chefe
  rationale: Embora רֹאשׁ signifique literalmente “cabeça”, aqui funciona metaforicamente como designação de autoridade. “Chefe” preserva o sentido político em português natural; a metáfora literal é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém o Tetragrama; “Yahweh” preserva o nome pessoal e corresponde à transliteração adotada pelo projeto.
- issue: Força da oração אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: 'declaração: “eu serei o chefe de vocês”'
  alternative: 'pergunta: “serei eu o chefe de vocês?”'
  rationale: A oração hebraica não contém partícula interrogativa e, em sua forma, é declarativa. O contexto de negociação permite que seja entendida pragmaticamente como uma pergunta de confirmação; essa possibilidade é preservada em nota sem substituir a forma explícita do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A redação mantém a estrutura condicional e a sequência do hebraico, mas usa “chefe” no texto principal para evitar a estranheza de “cabeça” como título político em português.
