  text: וַ/יִּדַּ֨ר יִפְתָּ֥ח נֶ֛דֶר לַ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָת֥וֹן תִּתֵּ֛ן אֶת בְּנֵ֥י עַמּ֖וֹן בְּ/יָדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: pt
  text: 'Então Jefté fez um voto a Yahweh, dizendo: “Se de fato entregares os amonitas em minha mão,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se certamente entregares os amonitas em minha mão”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יִפְתָּח נֶדֶר
  choice: Jefté fez um voto
  rationale: Traduz naturalmente a construção cognata hebraica, mantendo explícito o substantivo נֶדֶר (“voto”).
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama e a direção do voto indicada pela preposição ל.
- source_word: וַיֹּאמַר
  choice: dizendo
  rationale: Liga de modo natural em português o ato de fazer o voto ao seu conteúdo, sem alterar a sequência narrativa.
- source_word: אִם נָתוֹן תִּתֵּן
  choice: Se de fato entregares
  rationale: A locução “de fato” comunica a ênfase do infinitivo absoluto נָתוֹן com o verbo finito תִּתֵּן; “entregar” é idiomático diante da expressão “em minhas mãos”.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É a designação étnica corrente e clara em português para os “filhos de Amom”.
- source_word: בְּיָדִי
  choice: em minhas mãos
  rationale: Reproduz de modo idiomático em português a imagem semítica de pôr o inimigo sob o poder de alguém; o plural é a forma portuguesa mais natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Caráter condicional do voto
  choice: Se de fato entregares
  alternative: Quando entregares; Visto que certamente entregarás
  rationale: אִם introduz uma condição. A tradução mantém essa forma e também a ênfase verbal, sem decidir antecipadamente como deve ser interpretada a atitude teológica de Jefté.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fez um voto” preserva a formulação explícita do hebraico; “entregares” e “em minhas mãos” comunicam naturalmente o idioma militar. A vírgula antes da nota e o fechamento parcial da fala refletem que a condição continua no versículo seguinte.
