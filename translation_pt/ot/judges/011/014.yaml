lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: Então ... novamente
  rationale: A construção idiomática expressa repetição ou continuação. «Novamente» comunica o sentido central com naturalidade, enquanto «Então» representa a progressão narrativa do waw.
- source_word: יִפְתָּח
  choice: Jefté
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente corrente e claro de שׁלח neste contexto narrativo e diplomático.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto diplomático, refere-se a mensageiros humanos; «mensageiros» é natural e menos especializado que «enviados» ou «embaixadores».
- source_word: אֶל
  choice: ao
  rationale: A preposição direcional é expressa naturalmente pela contração portuguesa «ao».
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: rei dos amonitas
  rationale: בְּנֵי עַמּוֹן é uma expressão etnogeográfica convencional para o povo amonita; «amonitas» transmite o referente de modo idiomático.
