  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: pt
  text: Então Jefté enviou novamente mensageiros ao rei dos amonitas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «rei dos filhos de Amom», expressão que se refere ao povo amonita.'
