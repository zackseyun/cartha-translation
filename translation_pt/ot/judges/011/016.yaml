base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: pt
  text: Pois quando Israel subiu do Egito, atravessou o deserto até o mar Vermelho[a] e chegou a Cades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mar dos Juncos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação histórica de Jefté e liga naturalmente o versículo ao argumento anterior.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: quando Israel saiu do Egito
  rationale: A construção com ב e o infinitivo de עלה tem valor temporal. Em português, 'saiu do Egito' expressa com naturalidade o movimento do êxodo; o referente pronominal é explicitado como Israel, já nomeado na oração principal hebraica.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: Israel ... atravessou o deserto
  rationale: הלך significa ir/caminhar; neste contexto de percurso, 'atravessou' é uma formulação portuguesa natural. מִדְבָּר designa uma região árida e despovoada, aqui vertida por 'deserto'.
- source_word: עַד יַם סוּף
  choice: até o mar Vermelho[a]
  rationale: עַד marca o limite do percurso. 'Mar Vermelho' é a designação tradicional e reconhecível de יַם סוּף, enquanto a alternativa lexical é preservada em nota.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: e chegou a Cades
  rationale: בוא pode significar chegar, e o ה direcional de קָדֵשָׁה indica movimento em direção ao lugar. O texto diz Cades, sem acrescentar Barneia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e legibilidade brasileira. A repetição de 'Israel' foi evitada na segunda oração por meio do sujeito elíptico, natural em português; a referência coletiva permanece inequívoca.
