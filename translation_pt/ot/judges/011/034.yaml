base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: pt
  text: Então Jefté chegou a Mispá, à sua casa. E eis que sua filha saía ao encontro dele, com tamborins e danças. Ela era sua única filha[a]; além dela, ele não tinha filho nem filha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ela era a única”; isto é, sua única filha, como esclarece a frase seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יִפְתָּח הַמִּצְפָּה אֶל בֵּיתוֹ
  choice: Então Jefté chegou à sua casa, em Mispá
  rationale: O waw consecutivo faz a narrativa avançar, expresso naturalmente por “Então”. A ordem em português deixa claro que a casa de Jefté ficava em Mispá, sem tratar o artigo hebraico do topônimo como artigo obrigatório em português.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força súbita e dramática do marcador hebraico em registro literário ainda corrente.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: saía ao encontro dele
  rationale: O particípio apresenta a ação em andamento no momento da chegada de Jefté; o imperfeito português reproduz essa vivacidade.
- source_word: בְתֻפִּים
  choice: ao som de tamborins
  rationale: תֹּף designa um pequeno tambor de armação usado em celebrações. “Tamborins” é claro e historicamente mais adequado que o moderno “pandeiros”, que pode sugerir platinelas.
- source_word: וּבִמְחֹלוֹת
  choice: e com danças
  rationale: Mantém o substantivo plural e a cena festiva sem transformar a expressão em uma oração verbal.
- source_word: וְרַק הִיא יְחִידָה
  choice: Ela era sua única filha
  rationale: Embora o hebraico diga literalmente “ela era a única”, o contexto imediato esclarece que se trata da única descendente; “única filha” comunica isso de modo natural sem acrescentar uma conclusão sobre seu destino.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: além dela, ele não tinha filho nem filha
  rationale: A formulação reproduz a negação abrangente e explica que Jefté não possuía nenhum outro descendente.
theological_decisions:
- issue: O destino da filha de Jefté e a interpretação do voto
  choice: 'Traduzir apenas os fatos narrados neste versículo: ela era sua única filha e saiu para recebê-lo em celebração.'
  alternative: Ler a ênfase como antecipação de sacrifício literal ou, alternativamente, de virgindade e ausência permanente de descendência.
  rationale: O versículo não resolve a controvérsia posterior. A tradução preserva a tensão narrativa sem incorporar uma interpretação denominacional do voto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “E eis que” conserva deliberadamente a solenidade e a surpresa do hebraico. Não se reproduziu a nota inglesa marcada depois de “Mispá”, pois seu conteúdo descreve outra expressão e não corresponde a uma variante textual nesse ponto; a alternativa “com danças/dançando” já é adequadamente representada no texto.
