revisions:
- from: Então Jefté chegou à sua casa, em Mispá. E eis que sua filha saía ao encontro dele, ao som de tamborins e com danças. Ela era sua única filha[a]; além dela, ele não tinha filho nem filha.
  to: Então Jefté chegou a Mispá, à sua casa. E eis que sua filha saía ao encontro dele, com tamborins e danças. Ela era sua única filha[a]; além dela, ele não tinha filho nem filha.
  rationale: A revisão conserva o sentido e a ambiguidade interpretativa do versículo, restaura a sequência locativa do hebraico e torna a expressão sobre a celebração mais diretamente correspondente ao texto-fonte. Não acrescenta nenhuma conclusão sobre o voto de Jefté ou o destino de sua filha.
