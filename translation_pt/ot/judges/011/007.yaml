source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: pt
  text: 'Jefté disse aos anciãos de Gileade: “Não foram vocês que me odiaram e me expulsaram da casa de meu pai? Então, por que vieram a mim agora, quando estão em aflição?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando vocês estão em apuros”. A expressão hebraica descreve a situação de quem está em aperto ou aflição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: É a forma narrativa comum de אמר e introduz naturalmente a fala em português.
- source_word: זִקְנֵי גִלְעָד
  choice: aos anciãos de Gileade
  rationale: O plural em estado construto designa os anciãos que exerciam uma função comunitária e política, não apenas homens idosos.
- source_word: הֲלֹא
  choice: Não foram vocês que...?
  rationale: Introduz uma pergunta retórica que espera concordância; esta formulação é natural em português e mantém a ênfase no papel dos interlocutores.
- source_word: שְׂנֵאתֶם
  choice: me odiaram
  rationale: Preserva o sentido direto de שׂנא sem suavizar a hostilidade relacional.
- source_word: וַתְּגָרְשׁוּנִי
  choice: me expulsaram
  rationale: גרשׁ indica expulsão, frequentemente forçada; “expulsaram” comunica essa força de modo claro e corrente.
- source_word: מִבֵּית אָבִי
  choice: da casa de meu pai
  rationale: Mantém a imagem hebraica e continua transparente em português, embora a expressão também possa abranger a família ou o clã paterno.
- source_word: וּמַדּוּעַ
  choice: Então, por que
  rationale: A conjunção liga a nova pergunta à acusação anterior e tem aqui valor inferencial.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: vieram a mim agora
  rationale: O pretérito perfeito é idiomático em português no discurso direto, e “agora” preserva a ênfase temporal de עַתָּה.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: quando estão em aflição
  rationale: A oração expressa a circunstância que motivou a visita; צַר com ל descreve estar em aperto ou aflição sem especificar além do texto a natureza da adversidade.
theological_decisions: []
