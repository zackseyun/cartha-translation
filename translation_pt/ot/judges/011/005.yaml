base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: pt
  text: Quando os amonitas lutaram contra Israel, os anciãos de Gileade foram buscar[a] Jefté da terra de Tobe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomar Jefté da terra de Tobe”. O verbo hebraico muitas vezes significa “tomar”, mas aqui se refere a ir buscá-lo para levá-lo de volta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz o acontecimento seguinte com valor temporal. “Quando” é natural em português e evita reproduzir de modo rígido o hebraico “e aconteceu quando”.
- source_word: נִלְחֲמוּ
  choice: lutaram
  rationale: O nifal de לחם indica entrar em combate; “lutaram” expressa isso de maneira clara e corrente.
- source_word: בְנֵי עַמּוֹן
  choice: os amonitas
  rationale: É a designação étnica convencional e idiomática em português para os descendentes ou o povo de Amom.
- source_word: עִם יִשְׂרָאֵל
  choice: contra Israel
  rationale: Embora עִם normalmente signifique “com”, junto de נלחם identifica aqui o adversário; “contra” torna explícita essa relação.
- source_word: זִקְנֵי גִלְעָד
  choice: os anciãos de Gileade
  rationale: A expressão designa os líderes reconhecidos de Gileade; “anciãos” preserva seu caráter institucional.
- source_word: לָקַחַת
  choice: buscar
  rationale: O verbo frequentemente significa “tomar”, mas neste contexto os anciãos vão até Jefté para buscá-lo e levá-lo de volta. “Buscar” comunica naturalmente esse movimento sem apagar a alternativa lexical.
- source_word: אֶת יִפְתָּח
  choice: Jefté
  rationale: O marcador de objeto direto introduz o nome pessoal, vertido segundo a forma portuguesa tradicional.
- source_word: מֵאֶרֶץ טוֹב
  choice: na terra de Tobe
  rationale: Depois de um verbo de busca, “buscar alguém na terra de Tobe” expressa em português o ponto de onde ele seria retirado; אֶרֶץ pode designar terra ou território.
