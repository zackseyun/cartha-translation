  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: pt
  text: 'Então os anciãos de Gileade disseram a Jefté: “É por isso que agora voltamos a você[a]: para que vá conosco e lute contra os amonitas[b]; e você será o chefe de todos os habitantes de Gileade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retornamos a você”.'
    reason: Alternativa lexical para שַׁבְנוּ, destacando o sentido básico de “retornar”.
  - marker: b
    text: 'Hebraico: “os filhos de Amom”, isto é, os amonitas.'
    reason: Registra a forma literal do gentílico hebraico.
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: os anciãos de Gileade
  rationale: “Anciãos” preserva a designação social e política dos representantes reconhecidos da comunidade, em vez do termo mais amplo “líderes”.
- source_word: לָכֵן עַתָּה
  choice: É por isso que agora
  rationale: Expressa tanto a conclusão decorrente da objeção de Jefté no versículo anterior quanto a urgência presente.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: voltamos a você
  rationale: שׁוּב significa normalmente “voltar, retornar”; aqui indica que os anciãos retomaram o contato com Jefté depois de ele ter sido rejeitado.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: vá conosco
  rationale: Mantém de perto o sentido básico de הלך, “ir”, e soa natural no convite feito pelos anciãos.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: lute contra os amonitas
  rationale: “Amonitas” é o gentílico natural em português para a expressão hebraica literal “filhos de Amom”; “contra” explicita corretamente o sentido hostil da construção.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: você será o chefe
  rationale: “Chefe” conserva o sentido metafórico e político de רֹאשׁ (“cabeça”) de modo claro e digno em português atual.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: de todos os habitantes de Gileade
  rationale: Preserva o alcance coletivo da autoridade prometida, incluindo todos os que habitavam Gileade.
theological_decisions:
- issue: Alcance da autoridade prometida a Jefté
  choice: A promessa abrange a liderança sobre todos os habitantes de Gileade, além do comando na batalha imediata.
  alternative: Entender a promessa apenas como um comando militar temporário.
  rationale: A expressão “será o chefe de todos os habitantes de Gileade” amplia explicitamente a função para além do combate, sem definir em termos posteriores a forma política dessa liderança.
- issue: Relação entre a missão militar e a promessa de liderança
  choice: A pontuação distingue o propósito da volta dos anciãos da promessa subsequente de que Jefté será chefe.
  alternative: Subordinar também a liderança à oração final, como se toda a sequência exprimisse somente propósito.
  rationale: A sequência hebraica permite perceber progressão entre ir, combater e tornar-se chefe. O ponto e vírgula preserva a ligação estreita sem reduzir a promessa a uma simples finalidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A forma “você” torna explícito o destinatário singular já indicado pela flexão verbal hebraica, enquanto “anciãos”, “chefe” e “habitantes” preservam o caráter sociopolítico do texto.
