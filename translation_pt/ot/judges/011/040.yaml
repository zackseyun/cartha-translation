base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: pt
  text: De ano em ano, as filhas de Israel costumavam ir lamentar a filha de Jefté, o gileadita, durante quatro dias por ano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comemorar” ou “narrar a história da filha de Jefté”. O verbo hebraico é raro, e seu sentido aqui é discutido.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: De ano em ano
  rationale: O idiomatismo indica recorrência anual; esta formulação preserva o sabor do hebraico e é natural em português.
- source_word: תֵּלַכְנָה
  choice: iam
  rationale: O imperfeito expressa uma ação habitual no passado, adequadamente comunicada por “iam”.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: as filhas de Israel
  rationale: Mantém a expressão hebraica sem especificar indevidamente idade ou estado civil.
- source_word: לְתַנּוֹת
  choice: lamentar
  rationale: O verbo é raro e discutido. “Lamentar” é plausível no contexto narrativo, enquanto sentidos alternativos são preservados em nota.
- source_word: לְבַת יִפְתָּח
  choice: a filha de Jefté
  rationale: A construção identifica diretamente o objeto da observância anual; “Jefté” é a forma portuguesa tradicional do nome.
- source_word: הַגִּלְעָדִי
  choice: o gileadita
  rationale: Reproduz de modo conciso e natural o gentílico hebraico.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: durante quatro dias por ano
  rationale: Expressa com clareza tanto a duração quanto a frequência anual da prática.
theological_decisions:
- issue: Sentido da observância anual dedicada à filha de Jefté
  choice: Traduzir o verbo por “lamentar” no texto principal, indicando sentidos alternativos em nota.
  alternative: “comemorar” ou “narrar a história de”
  rationale: O verbo hebraico é raro, e sua interpretação se relaciona à discussão sobre o destino da filha de Jefté. A tradução preserva a tensão interpretativa em vez de decidir além do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De ano em ano” e “filhas de Israel” preservam a forma do hebraico; “durante quatro dias por ano” evita ambiguidade quanto à duração.
