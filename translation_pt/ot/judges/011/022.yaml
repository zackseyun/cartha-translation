base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: pt
  text: Assim, tomaram posse de todo o território[a] dos amorreus, desde o Arnom até o Jaboque, e desde o deserto até o Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fronteira” ou “limite” dos amorreus; neste contexto, refere-se à terra dentro desses limites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: tomaram posse de
  rationale: Em contexto de conquista, ירשׁ indica apropriar-se ou assumir o controle de um território; esta formulação preserva o sentido ativo sem implicar necessariamente herança passiva.
- source_word: כָּל
  choice: todo o
  rationale: Mantém a força abrangente do quantificador hebraico e concorda naturalmente com “território”.
- source_word: גְּבוּל
  choice: território
  rationale: Embora possa significar “fronteira” ou “limite”, aqui designa a área delimitada pelos marcos geográficos mencionados.
- source_word: הָאֱמֹרִי
  choice: dos amorreus
  rationale: O singular hebraico é coletivo e se refere ao povo amorreu; o plural é a forma natural em português.
- source_word: מֵאַרְנוֹן
  choice: desde o Arnom
  rationale: Marca o ponto inicial de uma extensão territorial; “desde... até” reproduz com naturalidade a construção hebraica.
- source_word: וְעַד הַיַּבֹּק
  choice: até o Jaboque
  rationale: Expressa de modo conciso o limite final do primeiro par geográfico.
- source_word: וּמִן הַמִּדְבָּר
  choice: e desde o deserto
  rationale: מִדְבָּר designa uma região árida ou pouco habitada; “deserto” é claro, corrente e geograficamente adequado sem exigir a ideia de dunas.
- source_word: וְעַד הַיַּרְדֵּן
  choice: até o Jordão
  rationale: Completa o segundo par de limites e emprega a forma portuguesa consagrada do nome do rio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com topônimos tradicionais em português. A estrutura paralela “desde... até... e desde... até” preserva o desenho geográfico do hebraico. A nota reúne a principal ambiguidade lexical sem sobrecarregar um versículo curto.
