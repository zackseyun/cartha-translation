  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: pt
  text: Então Israel seguiu pelo deserto, contornou a terra de Edom e a terra de Moabe e chegou ao lado leste da terra de Moabe. Eles acamparam do outro lado do Arnom[a], mas não entraram no território de Moabe, pois o Arnom era a fronteira de Moabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além do Arnom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: seguiu pelo deserto
  rationale: הלך é o verbo comum para ir ou seguir; com בַּמִּדְבָּר, a expressão descreve o percurso por uma região árida. “Seguiu pelo deserto” é natural e preserva o sentido de rota.
- source_word: וַיָּסָב
  choice: contornou
  rationale: סבב indica que Israel tomou uma rota ao redor das terras mencionadas, sem atravessá-las. “Contornou” expressa isso de maneira clara e concisa.
- source_word: אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: a terra de Edom e a terra de Moabe
  rationale: אֶרֶץ pode significar terra ou território. “Terra” mantém a formulação geográfica e permite consistência entre Edom e Moabe.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: chegou à terra de Moabe pelo leste
  rationale: A expressão literalmente relacionada ao “nascer do sol” designa o leste. “Pelo leste” preserva a ideia de aproximação vinda do lado oriental sem transformar o texto em uma afirmação mais específica do que o hebraico.
- source_word: וַיַּחֲנוּן
  choice: eles acamparam
  rationale: חנה significa acampar. A forma plural explicita a mudança do singular coletivo anterior para os israelitas como grupo.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: do outro lado do Arnom
  rationale: עֵבֶר significa lado, outro lado ou região além de um ponto de referência. A tradução conserva a orientação relativa, cuja perspectiva geográfica não é explicitada no verso.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: mas não entraram no território de Moabe
  rationale: גְּבוּל pode designar fronteira ou território delimitado. Com o verbo de movimento, “entraram no território” comunica naturalmente que não cruzaram para dentro da terra moabita.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: pois o Arnom era a fronteira de Moabe
  rationale: כִּי introduz a explicação, e גְּבוּל aqui designa a fronteira marcada pelo rio Arnom.
theological_decisions:
- issue: Referente do sujeito singular nos primeiros verbos
  choice: Israel
  alternative: ele
  rationale: O contexto imediato trata Israel como entidade coletiva; explicitar “Israel” evita em português um pronome masculino sem antecedente claro dentro do versículo, enquanto a passagem subsequente ao plural permanece visível em “eles acamparam”.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Deserto” é corrente para מִדְבָּר neste contexto geográfico; “Arnom” segue a forma tradicional portuguesa do topônimo. A alternância hebraica entre sujeito coletivo singular e plural foi preservada semanticamente por “Israel” e depois “eles”.
