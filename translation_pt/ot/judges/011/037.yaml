review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente o pedido e o lamento pela virgindade, sem resolver a ambiguidade narrativa. Contudo, «percorra os montes» substitui o segundo verbo hebraico («descer») por uma ação diferente, e deve ser corrigido.
  naturalness: «Deixe-me por dois meses» soa incompleto em português, pois pode sugerir apenas afastamento sem expressar claramente a licença solicitada. «Dê-me licença por dois meses» é natural e transmite bem o idiomatismo. «Lamente a minha virgindade» é mais idiomático que «chore a minha virgindade», mantendo o objeto do lamento.
  terminology: «Virgindade» e «companheiras» são adequados. A nota deve dizer «lamente/chore sobre minha virgindade», não «por causa da», pois esta última explicita uma relação causal que não é a forma mais próxima da construção hebraica.
  issues:
  - severity: medium
    issue: «Percorra os montes» não traduz o verbo «descer».
    rationale: וְיָרַדְתִּי significa «e eu desça». Embora «percorrer» torne a frase fluente, ele elimina um elemento verbal explícito do texto-fonte.
  - severity: medium
    issue: «Deixe-me por dois meses» é elíptico e pouco claro.
    rationale: O imperativo הַרְפֵּה מִמֶּנִּי pede que ela seja deixada livre ou receba licença durante esse período. «Dê-me licença» expressa claramente essa função.
  - severity: low
    issue: A nota apresenta «por causa da minha virgindade» como literal.
    rationale: A construção בכה על é mais diretamente «chorar/lamentar sobre»; «por causa de» é uma interpretação idiomática possível, mas não a formulação literal.
