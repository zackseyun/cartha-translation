revisions:
- from: 'E ela disse ao pai: “Que isto me seja concedido: deixe-me por dois meses, para que eu vá e percorra os montes e chore a minha virgindade[a], eu e as minhas companheiras.”'
  to: 'E ela disse a seu pai[a]: “Que isto me seja concedido: dê-me licença por dois meses, para que eu vá e desça pelos montes e lamente a minha virgindade[b], eu e as minhas companheiras.”'
  rationale: A revisão restaura «desça», correspondente ao verbo hebraico explícito, e torna o pedido temporal claro em português com «dê-me licença». Também substitui a construção pouco idiomática «chore a minha virgindade» por «lamente a minha virgindade», sem atenuar nem interpretar o lamento. As notas preservam alternativas relevantes e corrigem a alegação de literalidade.
