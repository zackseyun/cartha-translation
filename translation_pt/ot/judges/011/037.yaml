base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: pt
  text: 'E ela disse a seu pai[a]: “Que isto me seja concedido: dê-me licença por dois meses, para que eu vá e desça pelos montes e lamente a minha virgindade[b], eu e as minhas companheiras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixe-me em paz” ou “deixe-me livre” por dois meses.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “lamente/chore sobre a minha virgindade”. A expressão destaca seu estado de não casada e sem filhos, sem resolver aqui a questão interpretativa mais ampla do relato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Que isto me seja concedido
  rationale: Reproduz a força jussiva/passiva da expressão — literalmente, ‘que isto seja feito para mim’ — em português natural, entendendo-a no contexto como um pedido, sem ampliar seu conteúdo.
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: deixe-me
  rationale: O imperativo de רפה com מן pede que o pai lhe dê liberdade ou licença por determinado tempo. ‘Deixe-me’ é conciso e natural no contexto.
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: por dois meses
  rationale: Expressão temporal direta; a preposição ‘por’ explicita idiomaticamente a duração em português.
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: para que eu vá e percorra os montes
  rationale: Mantém os dois verbos coordenados sem produzir o pouco natural ‘vá e desça sobre os montes’. ‘Percorra’ comunica o deslocamento pela região montanhosa, embora a forma verbal hebraica tenha literalmente o sentido de ‘descer’.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: e chore a minha virgindade
  rationale: Preserva de perto a construção בכה על e seu objeto explícito, a virgindade, sem introduzir no versículo uma explicação sobre morte, dedicação ou ausência de filhos.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: eu e as minhas companheiras
  rationale: O substantivo está no feminino plural e designa as amigas ou companheiras da filha de Jefté. ‘Companheiras’ conserva essa informação de gênero e mantém registro digno.
theological_decisions:
- issue: Sentido do lamento da filha de Jefté por sua virgindade
  choice: Manter explicitamente o lamento por sua virgindade, sem decidir a interpretação do desfecho narrativo.
  alternative: Explicitar que ela lamenta a morte iminente e a falta de descendência, ou entender o texto somente como dedicação à virgindade perpétua.
  rationale: O versículo menciona diretamente a virgindade, não a morte. A formulação preserva a tensão do relato e não impõe uma conclusão teológica que este versículo, isoladamente, não resolve.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Optou-se por ‘montes’, termo corrente no registro bíblico sem ser arcaico. A sintaxe evita literalismos duros, mas conserva o pedido, a duração, o deslocamento e o objeto específico do lamento.
