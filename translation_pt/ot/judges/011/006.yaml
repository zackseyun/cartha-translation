base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: pt
  text: 'E disseram a Jefté: “Venha e seja o nosso comandante, e lutemos contra os amonitas[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Amom”, designação étnica comum que significa os amonitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol de אמר dá continuidade à sequência narrativa; “E disseram” preserva essa ligação sem acrescentar uma nuance temporal não expressa.
- source_word: לְיִפְתָּח
  choice: a Jefté
  rationale: O nome próprio יִפְתָּח é apresentado em sua forma portuguesa tradicional, Jefté.
- source_word: לְכָה
  choice: Venha
  rationale: Neste chamado direto, o imperativo de הלך funciona como convite ou convocação; “Venha” é a forma natural em português.
- source_word: וְהָיִיתָה לָּנוּ
  choice: e seja o nosso
  rationale: A expressão literalmente significa “e seja para nós”; a construção possessiva é a equivalência idiomática em português.
- source_word: לְקָצִין
  choice: comandante
  rationale: קָצִין designa um chefe ou dirigente, com sentido militar especialmente adequado ao contexto imediato de guerra.
- source_word: וְנִלָּחֲמָה
  choice: e lutemos
  rationale: A forma cohortativa na primeira pessoa do plural expressa a ação conjunta proposta. “E lutemos” conserva a coordenação e evita impor uma relação explícita de finalidade.
- source_word: בִּבְנֵי עַמּוֹן
  choice: contra os amonitas
  rationale: Com o verbo de combate, ב marca o adversário; “os amonitas” é a designação étnica natural correspondente ao hebraico literal “filhos de Amom”.
theological_decisions: []
