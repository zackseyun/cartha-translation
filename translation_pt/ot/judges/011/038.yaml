base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: pt
  text: 'Ele disse: “Vá.” Então a deixou ir durante dois meses. Ela partiu, ela e suas companheiras, e chorou por sua virgindade[a] nos montes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “lamentou sua virgindade” ou “chorou por causa de sua virgindade”. O hebraico declara explicitamente que sua virgindade era o objeto de seu lamento, detalhe central para a interpretação da passagem mais ampla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: Vá
  rationale: Imperativo feminino singular de הלך. A forma breve “Vá” reproduz naturalmente a ordem direta em português.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: a deixou ir
  rationale: Neste contexto, שׁלח indica que ele lhe permitiu partir. “Deixou-a ir” seria possível, mas “a deixou ir” tem leitura mais natural no português brasileiro e não sugere rejeição, como poderia ocorrer com “mandou-a embora”.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: durante dois meses
  rationale: A expressão indica a duração da licença concedida; “durante” torna essa relação temporal explícita e idiomática.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: Ela partiu, ela e suas companheiras
  rationale: A construção conserva a repetição enfática do pronome הִיא e inclui as companheiras como sujeito associado, sem reduzir o hebraico a uma simples expressão instrumental.
- source_word: רֵעוֹתֶיהָ
  choice: suas companheiras
  rationale: O substantivo feminino designa as mulheres que a acompanhavam. “Companheiras” preserva o gênero e se ajusta ao registro narrativo solene.
- source_word: וַתֵּבְךְּ
  choice: chorou
  rationale: בכה denota chorar ou prantear. “Chorou” é claro, atual e mantém a força emocional sem acrescentar uma interpretação.
- source_word: עַל בְּתוּלֶיהָ
  choice: por sua virgindade
  rationale: A preposição עַל apresenta a virgindade como objeto ou motivo do lamento. “Por sua virgindade” preserva essa relação e não decide se a tristeza se refere sobretudo à morte iminente, à ausência de casamento e descendência ou a ambas.
- source_word: עַל הֶהָרִים
  choice: nos montes
  rationale: הָרִים pode designar montes ou montanhas. “Nos montes” é uma formulação natural para a região montanhosa e evita a possível impressão de que estavam literalmente sobre cumes específicos.
theological_decisions:
- issue: Sentido do lamento da filha de Jefté por sua virgindade
  choice: O texto principal mantém a afirmação explícita de que ela chorou por sua virgindade, sem definir o desfecho mais amplo da narrativa.
  alternative: Explicitar que ela lamentava a morte como sacrifício humano, ou que lamentava exclusivamente uma vida de virgindade perpétua e sem filhos.
  rationale: O versículo identifica a virgindade como foco do lamento, mas não resolve por si só a controvérsia interpretativa do contexto. Uma explicitação maior importaria para a tradução uma conclusão teológica não expressa neste verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “Ela partiu, ela e suas companheiras” é deliberadamente um pouco mais formal para preservar a ênfase da sintaxe hebraica. O marcador [a] foi colocado junto de “virgindade”, expressão à qual a nota se refere.
