id: JDG.11.19
reference: Judges 11:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: pt
  text: 'Então Israel enviou mensageiros[a] a Seom, rei dos amorreus, rei de Hesbom. Israel lhe disse: “Por favor, deixa-nos passar pela tua terra até o meu lugar[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto diplomático, “mensageiros” também pode ser traduzido por “enviados”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “meu lugar”, apresentando Israel como uma unidade coletiva. Algumas traduções tornam a expressão mais natural como “nosso lugar” ou “nosso destino”.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Forma narrativa de שׁלח; “enviou” é o equivalente português corrente e natural.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O contexto diplomático indica representantes humanos; “mensageiros” preserva o sentido básico sem sugerir seres celestiais.
- source_word: סִיחוֹן
  choice: Seom
  rationale: Forma tradicional portuguesa do nome pessoal hebraico.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: rei dos amorreus
  rationale: Reproduz com clareza o título e a designação étnica do hebraico.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: rei de Hesbom
  rationale: Mantém o segundo título em aposição, como no hebraico.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: Israel lhe disse
  rationale: Conserva a repetição explícita de “Israel”, evitando apagá-la por simplificação estilística.
- source_word: נַעְבְּרָה נָּא
  choice: Por favor, deixa-nos passar
  rationale: O coortativo acompanhado de נָא expressa um pedido cortês; esta formulação é natural e mantém o caráter de solicitação.
- source_word: בְאַרְצְךָ
  choice: pela tua terra
  rationale: Com o verbo עבר, a preposição indica deslocamento através do território.
- source_word: עַד מְקוֹמִי
  choice: até o meu lugar
  rationale: Mantém a primeira pessoa singular do texto hebraico, mesmo após o pedido na primeira pessoa plural, preservando Israel personificado como sujeito coletivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais dos nomes próprios. Emprega “tua” em concordância com o singular do interlocutor e preserva a alternância entre o plural do pedido (“deixa-nos”) e o singular coletivo (“meu lugar”).
