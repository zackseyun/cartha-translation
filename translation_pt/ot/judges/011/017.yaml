base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: pt
  text: 'Então Israel enviou mensageiros ao rei de Edom, dizendo: “Permita-me, por favor, passar por sua terra.”[a] Mas o rei de Edom não lhe deu ouvidos. Israel também enviou mensageiros ao rei de Moabe, mas o rei de Moabe não consentiu.[b] Então Israel permaneceu em Cades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa “permita-me passar”, na primeira pessoa do singular; Israel fala como uma entidade coletiva. Também se pode traduzir “permita-nos passar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não quis” ou “recusou-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O passado simples expressa naturalmente a forma narrativa hebraica.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O contexto é diplomático e humano; “anjos” seria inadequado.
- source_word: אֶעְבְּרָה נָּא
  choice: Por favor, deixe-nos passar
  rationale: A forma hebraica está na primeira pessoa do singular, pois Israel fala como entidade coletiva; em português, o plural explicita naturalmente o povo representado pelos mensageiros.
- source_word: בְאַרְצֶךָ
  choice: pela sua terra
  rationale: Com o verbo “passar”, esta construção comunica trânsito através do território em português natural.
- source_word: וְלֹא שָׁמַע
  choice: não lhe deu ouvidos
  rationale: No contexto, שׁמע significa atender ou acolher o pedido, e não apenas ouvir fisicamente.
- source_word: וְלֹא אָבָה
  choice: não consentiu
  rationale: Reproduz a ideia de falta de disposição ou anuência sem intensificá-la necessariamente como recusa categórica.
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: Indica que Israel continuou naquele local, sem sugerir estabelecimento permanente.
- source_word: בְּקָדֵשׁ
  choice: em Cades
  rationale: Preposição idiomática em português para localização nessa cidade ou região.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O sujeito “Israel” foi repetido na segunda ação para evitar que “ele” seja entendido como o rei de Edom. A fala coletiva foi vertida no plural, de modo natural em português.
