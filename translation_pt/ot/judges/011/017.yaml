revisions:
- from: 'Então Israel enviou mensageiros ao rei de Edom, dizendo: “Por favor, deixe-nos passar pela sua terra.” Mas o rei de Edom não lhe deu ouvidos. Israel também enviou mensageiros ao rei de Moabe, mas ele não consentiu[a]. Por isso, Israel permaneceu em Cades.'
  to: 'Então Israel enviou mensageiros ao rei de Edom, dizendo: “Permita-me, por favor, passar por sua terra.”[a] Mas o rei de Edom não lhe deu ouvidos. Israel também enviou mensageiros ao rei de Moabe, mas o rei de Moabe não consentiu.[b] Então Israel permaneceu em Cades.'
  rationale: A revisão preserva a primeira pessoa singular do pedido hebraico e explica em nota seu emprego coletivo. Também substitui a ligação causal explícita por uma continuação narrativa neutra e torna inequívoco que o rei de Moabe é quem não consentiu.
