  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: pt
  text: E agora, Yahweh, o Deus de Israel, expulsou os amorreus de diante de seu povo Israel; e será você quem tomará posse dela[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vai herdá-la” ou “vai apoderar-se dela”. O verbo hebraico pode indicar receber ou tomar posse de uma terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o argumento anterior quanto a transição para sua conclusão retórica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz de modo direto e natural a construção que identifica Yahweh como o Deus de Israel.
- source_word: הוֹרִישׁ
  choice: expulsou
  rationale: No hifil, o verbo indica que Yahweh fez os amorreus perderem a posse e saírem do território; “expulsou” comunica isso com clareza em português corrente.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: O singular étnico hebraico tem sentido coletivo; o plural é a forma natural em português.
- source_word: מִפְּנֵי עַמּוֹ יִשְׂרָאֵל
  choice: de diante de seu povo Israel
  rationale: Conserva a imagem espacial do hebraico e identifica Israel como o povo de Yahweh.
- source_word: וְאַתָּה
  choice: e será você quem
  rationale: A construção destaca o pronome independente e mantém o tom confrontador da pergunta retórica.
- source_word: תִּירָשֶׁנּוּ
  choice: tomará posse dela
  rationale: O qal de ירש expressa tomar ou receber posse, especialmente de terra. O pronome feminino explicita em português a referência implícita à terra, e não aos amorreus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Referência do sufixo em תִּירָשֶׁנּוּ
  choice: a terra implícita (“dela”)
  alternative: o povo amorreu
  rationale: O contexto é uma disputa territorial, e ירש normalmente descreve tomar posse da terra. A referência à terra preserva a coerência do argumento sem sugerir posse sobre pessoas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação mantém o encadeamento argumentativo, a ênfase confrontadora em “você” e a pergunta retórica do hebraico.
