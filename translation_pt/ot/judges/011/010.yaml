  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: pt
  text: 'Então os anciãos de Gileade disseram a Jefté: “Yahweh será testemunha entre nós[a], se não fizermos conforme a sua palavra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “estará ouvindo entre nós”, isto é, ouvindo como testemunha ou juiz entre as duas partes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw narrativo faz a sequência avançar; “Então” expressa essa progressão com naturalidade em português.
- source_word: זִקְנֵי גִלְעָד
  choice: os anciãos de Gileade
  rationale: A construção designa os líderes reconhecidos de Gileade; esta é a formulação tradicional, clara e natural em português.
- source_word: יִפְתָּח
  choice: Jefté
  rationale: Forma portuguesa estabelecida do nome hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: será testemunha entre nós
  rationale: Literalmente, a expressão descreve Yahweh como quem “ouve entre nós”; no contexto de juramento, ouvir entre as partes implica testemunhar e julgar a fidelidade ao acordo.
- source_word: אִם לֹא
  choice: se não
  rationale: Mantém a forma condicional ligada ao juramento dos anciãos, sem convertê-la silenciosamente numa afirmação enfática.
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: fizermos conforme a sua palavra
  rationale: Preserva a referência à palavra ou aos termos declarados por Jefté e comunica de modo conciso que os anciãos se comprometem a agir de acordo com eles.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Sentido judicial de שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: será testemunha entre nós
  alternative: estará ouvindo entre nós; será juiz entre nós
  rationale: “Testemunha” torna explícita a função da audição divina neste juramento, sem restringi-la apenas ao ato de julgar; a nota conserva a imagem hebraica literal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “sua” ao dirigir-se a Jefté, evitando regionalismo excessivo; mantém “palavra” para refletir a formulação hebraica e o caráter solene do compromisso.
