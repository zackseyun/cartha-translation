  text: וַ/יִּשְׁלַ֤ח יִפְתָּח֙ מַלְאָכִ֔ים אֶל מֶ֥לֶךְ בְּנֵֽי עַמּ֖וֹן לֵ/אמֹ֑ר מַה לִּ֣/י וָ/לָ֔/ךְ כִּֽי בָ֥אתָ אֵלַ֖/י לְ/הִלָּחֵ֥ם בְּ/אַרְצִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: pt
  text: 'Então Jefté enviou mensageiros ao rei dos amonitas, dizendo: “O que há entre mim e você[a], que você veio contra mim para lutar na minha terra?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que eu tenho a ver com você?” A expressão idiomática hebraica indica hostilidade ou disputa entre as partes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade em português.
- source_word: יִפְתָּח
  choice: Jefté
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: No contexto diplomático, refere-se a representantes humanos, não a seres celestiais.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: ao rei dos amonitas
  rationale: “Filhos de Amom” funciona aqui como designação étnica; “amonitas” é a forma natural em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente de introduzir discurso direto, preservando a estrutura da fonte.
- source_word: מַה לִּי וָלָךְ
  choice: O que há entre mim e você
  rationale: Mantém de perto a expressão idiomática hebraica, que comunica conflito ou disputa, sem resolver excessivamente sua formulação.
- source_word: כִּי
  choice: para que
  rationale: Neste contexto, introduz a circunstância que motiva a pergunta hostil; a construção portuguesa liga naturalmente a pergunta à invasão, embora também possa ser entendida causalmente.
- source_word: בָאתָ אֵלַי
  choice: tenha vindo contra mim
  rationale: Embora אֵלַי seja literalmente “a mim”, o contexto hostil e o infinitivo seguinte justificam “contra mim”.
- source_word: לְהִלָּחֵם
  choice: lutar
  rationale: Expressa diretamente o ato de entrar em combate, sem ampliar para “travar guerra”.
- source_word: בְּאַרְצִי
  choice: na minha terra
  rationale: Preserva a preposição “em” e a imagem concreta de terra sob a autoridade de Jefté.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O pronome “você” torna a interpelação singular clara e natural; a nota preserva a alternativa idiomática.
