  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אָבִ/י֙ פָּצִ֤יתָה אֶת פִּ֨י/ךָ֙ אֶל יְהוָ֔ה עֲשֵׂ֣ה לִ֔/י כַּ/אֲשֶׁ֖ר יָצָ֣א מִ/פִּ֑י/ךָ אַחֲרֵ֡י אֲשֶׁ֣ר עָשָׂה֩ לְ/ךָ֙ יְהוָ֧ה נְקָמ֛וֹת מֵ/אֹיְבֶ֖י/ךָ מִ/בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: pt
  text: 'Ela lhe disse: “Meu pai, você fez um voto a Yahweh[a]; faça comigo conforme o que você disse, pois Yahweh vingou você dos seus inimigos, os filhos de Amom[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “você abriu a sua boca a Yahweh”. Esta é uma expressão hebraica que, neste contexto, se refere a fazer um voto solene.
    reason: cultural_note
  - marker: b
    text: 'Ou: “os amonitas”. Hebraico: “os filhos de Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: você abriu a boca
  rationale: Preserva a expressão concreta do hebraico e sua solenidade; a nota esclarece que, neste contexto, ela se refere à formulação oral de um voto solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: עֲשֵׂה לִי
  choice: faça comigo
  rationale: Expressa naturalmente em português a submissão da filha ao cumprimento do que o pai declarou, sem especificar neste versículo a natureza desse cumprimento.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: conforme o que saiu da sua boca
  rationale: Mantém a imagem hebraica e a ligação verbal com a abertura da boca, destacando a força vinculante das palavras pronunciadas.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: pois
  rationale: Neste contexto, a expressão apresenta a razão para a declaração, e não apenas uma sequência temporal.
- source_word: עָשָׂה לְךָ יְהוָה נְקָמוֹת
  choice: Yahweh executou vingança em seu favor
  rationale: Reflete tanto o verbo 'fazer/executar' quanto o sentido benefactivo de לְךָ, em português claro e digno.
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: contra os seus inimigos, contra os filhos de Amom
  rationale: O português pede 'contra' para indicar o alvo da vingança; 'filhos de Amom' conserva a forma do etnônimo hebraico, com alternativa idiomática em nota.
theological_decisions:
- issue: Natureza do voto de Jefté na resposta da filha
  choice: Traduzir a submissão dela ao voto sem definir como ele seria cumprido.
  alternative: Interpretar explicitamente o voto como sacrifício literal ou como dedicação perpétua em virgindade/serviço.
  rationale: Este versículo registra a aceitação das palavras pronunciadas pelo pai, mas não especifica a forma do cumprimento; a tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens da boca e das palavras que dela saem, enquanto a sintaxe em torno da vingança é ajustada ao uso natural do português.
