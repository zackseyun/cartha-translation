revisions:
- from: 'Ela lhe disse: “Meu pai, você abriu a boca diante de Yahweh[a]; faça comigo conforme o que saiu da sua boca, pois Yahweh executou vingança em seu favor contra os seus inimigos, contra os filhos de Amom[b]”.'
  to: 'Ela lhe disse: “Meu pai, você fez um voto a Yahweh[a]; faça comigo conforme o que você disse, pois Yahweh vingou você dos seus inimigos, os filhos de Amom[b].”'
  rationale: A revisão substitui um literalismo pouco natural por «fez um voto a Yahweh», preservando em nota a expressão hebraica literal e seu valor idiomático. Também torna natural a ordem para que o pai cumpra o que declarou e reformula a cláusula sobre a vingança sem alterar sua direção nem resolver a natureza debatida do voto.
