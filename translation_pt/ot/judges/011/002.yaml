base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: pt
  text: 'A esposa de Gileade lhe deu filhos. Quando os filhos da mulher cresceram, expulsaram Jefté e lhe disseram: “Você não terá herança na casa de nosso pai, pois é filho de outra mulher.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: a mulher de Gileade
  rationale: Reproduz a expressão hebraica sem acrescentar um possessivo ausente; no contexto, trata-se da esposa de Gileade.
- source_word: בְּנֵי הָאִשָּׁה
  choice: os filhos dessa mulher
  rationale: Mantém a referência definida à mulher já mencionada e evita o acréscimo interpretativo de “sua mulher”.
- source_word: לֹא תִנְחַל בְּבֵית אָבִינוּ
  choice: Você não terá herança na casa de nosso pai
  rationale: Expressa naturalmente o valor do verbo נחל, relacionado à participação na herança familiar, sem reduzir a frase ao simples ato futuro de herdar.
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: filho de outra mulher
  rationale: Segue diretamente o hebraico e preserva o contraste social e familiar usado pelos irmãos.
