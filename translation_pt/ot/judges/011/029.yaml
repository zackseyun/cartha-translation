  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: pt
  text: 'Então o Espírito de Yahweh veio sobre Jefté. Ele atravessou Gileade e Manassés, passou por Mispá de Gileade e, de Mispá de Gileade, seguiu até os amonitas.[a]


    [a] Ou: “atravessou para o lado dos amonitas” ou “avançou contra os amonitas”. O verbo hebraico pode indicar passar, atravessar ou avançar, conforme o contexto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atravessou para o lado dos amonitas” ou “avançou contra os amonitas”. O verbo hebraico pode indicar passar, atravessar ou avançar, conforme o contexto.'
    reason: Registra a amplitude semântica de עבר na oração final e preserva a incerteza entre simples deslocamento e avanço hostil.
lexical_decisions:
- source_word: ר֣וּחַ יְהוָ֔ה
  choice: o Espírito de Yahweh
  rationale: Neste contexto narrativo, רוּחַ designa o Espírito de Deus que capacita um líder, não vento nem respiração. O nome divino יְהוָה é representado como “Yahweh”.
- source_word: וַ/תְּהִ֤י עַל
  choice: veio sobre
  rationale: A expressão descreve de modo eventivo o Espírito passando a atuar sobre Jefté; “veio sobre” é natural em português e não acrescenta duração ou permanência.
- source_word: יִפְתָּח
  choice: Jefté
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָד וְ/אֶת מְנַשֶּׁה
  choice: atravessou Gileade e Manassés
  rationale: Com regiões como objetos diretos, עבר indica deslocamento através delas. “Atravessou” expressa isso com clareza e concisão.
- source_word: מִצְפֵּ֣ה גִלְעָ֔ד
  choice: Mispá de Gileade
  rationale: Trata-se de um topônimo; conserva-se o nome transliterado, e a relação construta é expressa por “de Gileade”.
- source_word: עָבַ֖ר בְּנֵ֥י עַמּֽוֹן
  choice: seguiu até os amonitas
  rationale: A construção indica movimento na direção do povo de Amom. “Seguiu até” preserva o movimento sem afirmar de maneira indevida que o ataque já começou; a ambiguidade de עבר é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza da ação de רוּחַ יְהוָה sobre Jefté
  choice: O Espírito de Yahweh veio sobre Jefté
  alternative: Um vento, sopro ou força impessoal de Yahweh veio sobre Jefté
  rationale: Em Juízes, esta fórmula assinala a capacitação divina de líderes. A tradução mantém essa força teológica sem inferir aprovação divina de todas as ações posteriores de Jefté.
translation_notes:
  register: Português moderno, digno e acessível, com formas reconhecíveis no Brasil e compreensão internacional. A repetição de “Mispá de Gileade” foi preservada por corresponder à progressão enfática do hebraico. “Amonitas” traduz naturalmente בְּנֵי עַמּוֹן como designação étnica.
