  rationale: Substituiu-se “fez com ela conforme o voto” por “cumpriu nela o voto” para refletir a direção da ação indicada por לָהּ e para produzir português claro, sem especificar se o voto envolveu sacrifício ou dedicação à virgindade. A nota a foi ajustada para oferecer uma alternativa mais próxima da formulação hebraica, conservando explicitamente a ambiguidade interpretativa.
