  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: pt
  text: 'Ao fim de dois meses, ela voltou para seu pai, e ele cumpriu nela o voto que havia feito.[a] Ela não havia conhecido homem algum.[b] E isso se tornou um costume em Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez a ela o que havia prometido em voto”. Os intérpretes divergem sobre se isso significa que Jefté a sacrificou ou que a dedicou a uma vida inteira de virgindade; a formulação hebraica deste versículo não resolve explicitamente a questão.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “ela não havia conhecido homem algum”, expressão idiomática hebraica que indica que ela não havia tido relações sexuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: Ao fim de dois meses
  rationale: Preserva a ideia de chegada ao término do período, expressa por מִקֵּץ, em português natural.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: ela voltou para seu pai
  rationale: Traduz diretamente שׁוּב como “voltar” e mantém o destino relacional explícito, “seu pai”.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: ele fez com ela conforme o voto que havia feito
  rationale: Mantém a formulação direta e severa do hebraico, inclusive a relação de ação “com ela”, sem definir em que consistiu o cumprimento do voto.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: Ela não havia conhecido homem algum
  rationale: Conserva o idiomatismo hebraico de “conhecer” no sentido de ter relações sexuais, esclarecido em nota, em vez de substituí-lo pela interpretação resumida “era virgem”.
- source_word: חֹק
  choice: costume
  rationale: No desfecho narrativo, e à luz da prática anual mencionada no versículo seguinte, חֹק designa adequadamente uma prática estabelecida em Israel, não necessariamente uma lei formal.
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: E isso se tornou um costume em Israel
  rationale: Reproduz o desenvolvimento narrativo de וַתְּהִי e torna explícito, sem especificá-lo, que o acontecimento deu origem a uma prática comunitária.
theological_decisions:
- issue: Natureza do cumprimento do voto de Jefté
  choice: Preservar no texto principal a formulação ambígua e direta do hebraico.
  alternative: Explicitar que Jefté a ofereceu em holocausto, ou que a dedicou à virgindade perpétua ou ao serviço religioso.
  rationale: O hebraico afirma apenas que ele “fez com ela conforme o voto que havia feito” e acrescenta que ela não havia conhecido homem algum. A tradução não deve resolver uma antiga controvérsia que a redação deste versículo não resolve explicitamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e alguma proximidade deliberada à formulação austera do hebraico. “Costume” foi preferido a “estatuto” por causa do contexto imediato de uma observância anual. O sinal de dois-pontos foi mantido porque a frase introduz a explicação do versículo seguinte.
