    issue: A expressão “ele fez com ela conforme o voto que havia feito” é semanticamente imprecisa e pouco idiomática.
    rationale: וַיַּעַשׂ לָהּ אֶת־נִדְרוֹ significa literalmente que ele fez a ela/quanto a ela o voto que havia votado, isto é, cumpriu ou executou nela o seu voto. Em português, “fez com ela” tende a significar “fez junto com ela” e enfraquece a direção da ação.
