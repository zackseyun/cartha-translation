base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: pt
  text: então o que sair das portas da minha casa ao meu encontro, quando eu voltar em paz dos amonitas, pertencerá a Yahweh[a], e eu o oferecerei como holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pertencerá a Yahweh, ou eu o oferecerei como holocausto”. Alguns intérpretes entendem aqui a conjunção hebraica em sentido disjuntivo, indicando dois possíveis desfechos, dependendo do que saísse ao encontro de Jefté.'
    reason: Leitura alternativa da conjunção hebraica, com implicações para a natureza do voto.
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: aquilo que sair
  rationale: A construção hebraica, literalmente próxima de “o que sair, que sair”, pode se referir tanto a uma pessoa quanto a um animal. “Aquilo que sair” preserva essa abertura, sem antecipar a identidade de quem ou do que sairá.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: das portas da minha casa
  rationale: Mantém o plural דַּלְתֵי e comunica naturalmente a saída pela entrada da casa.
- source_word: לִקְרָאתִי
  choice: ao meu encontro
  rationale: Expressa o movimento com a finalidade de encontrar ou receber alguém, conforme o sentido da expressão hebraica.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: quando eu voltar em paz
  rationale: Preserva a formulação hebraica e o sentido amplo de retorno seguro e em bem-estar.
- source_word: מִבְּנֵי עַמּוֹן
  choice: da batalha contra os amonitas
  rationale: O hebraico diz literalmente “dos filhos de Amom”. A explicitação contextual “da batalha contra” torna clara, em português natural, a procedência do retorno sem alterar o referente étnico.
- source_word: וְהָיָה לַיהוָה
  choice: pertencerá a Yahweh
  rationale: A construção indica dedicação ou pertencimento a YHWH. “Pertencerá” comunica isso com clareza sem definir de antemão a modalidade dessa dedicação.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A transliteração do nome divino representa diretamente יהוה e mantém a distinção entre o nome próprio e títulos como “Senhor”.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: e eu o oferecerei como holocausto
  rationale: A expressão no hifil com עוֹלָה é a fórmula sacrificial usual para oferecer como holocausto. O pronome “o” retoma gramaticalmente “aquilo”, preservando sem explicação indevida o sufixo masculino singular hebraico.
theological_decisions:
- issue: Se o voto apresenta um único desfecho (“pertencerá a Yahweh, e eu o oferecerei”) ou duas alternativas (“pertencerá a Yahweh, ou eu o oferecerei”).
  choice: Um único desfecho, com a conjunção “e”.
  alternative: Dois desfechos possíveis, com “ou”, conforme aquilo que saísse ao encontro de Jefté.
  rationale: ו tem normalmente valor conjuntivo, e a sintaxe mais direta apresenta dedicação a Yahweh e oferta como holocausto como partes do mesmo voto. A leitura disjuntiva é relevante, mas menos direta, por isso fica registrada em nota sem eliminar a tensão do texto principal.
- issue: Referente humano ou animal daquilo que sairia da casa.
  choice: Manter o referente indefinido por meio de “aquilo que sair”.
  alternative: Traduzir como “quem sair”, restringindo o referente a uma pessoa.
  rationale: A forma masculina singular hebraica não resolve por si só a natureza do referente nesse contexto. A tradução não deve antecipar a narrativa nem eliminar a ambiguidade do voto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros e compreensão internacional. A redação conserva a ambiguidade quanto ao referente e a tensão entre as leituras conjuntiva e disjuntiva. “Holocausto” é mantido como termo sacrificial bíblico estabelecido.
