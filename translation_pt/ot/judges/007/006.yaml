  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: pt
  text: O número dos que lambiam a água, levando-a com a mão à boca, era de trezentos homens[a]; mas todo o restante do povo ajoelhou-se para beber água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos que lambiam com a mão à boca”. A expressão hebraica destaca que levavam a água à boca com a mão, em vez de se ajoelharem para beber diretamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: O número
  rationale: Equivalente quantitativo direto e natural em português, introduzindo a contagem do grupo.
- source_word: הַמֲלַקְקִים
  choice: dos que lamberam a água
  rationale: Preserva a imagem vívida do verbo לקק; o objeto 'a água' fica implícito no contexto hebraico e torna a expressão natural em português.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: levando a mão à boca
  rationale: 'Expressa idiomaticamente o movimento indicado pela construção hebraica e mantém o singular distributivo: cada homem levava água à própria boca.'
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: trezentos homens
  rationale: Tradução direta e adequada ao contexto militar.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: mas todo o restante do povo
  rationale: A conjunção é traduzida de modo contrastivo, conforme a oposição contextual entre os dois grupos.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: se ajoelhou
  rationale: Forma portuguesa concisa e natural que comunica integralmente a postura expressa pelo verbo e pela locução hebraica; a concordância singular acompanha o coletivo 'povo'.
- source_word: לִשְׁתּוֹת מָיִם
  choice: para beber água
  rationale: Mantém tanto a finalidade do infinitivo quanto a menção explícita à água.
