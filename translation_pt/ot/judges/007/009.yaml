  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: pt
  text: 'E aconteceu naquela noite que Yahweh lhe disse: “Levante-se e desça ao acampamento, pois eu o entreguei nas suas mãos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na sua mão”, expressão que significa estar sob o poder ou controle de alguém.'
    reason: Esclarece o sentido idiomático e registra o singular da expressão hebraica.
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: Preserva a fórmula narrativa hebraica que introduz uma nova cena, sem recorrer à expressão mais arcaica “e sucedeu”.
- source_word: בַּלַּיְלָה הַהוּא
  choice: naquela noite
  rationale: Expressão temporal definida, vertida de modo natural e direto em português.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: lhe disse
  rationale: אמר é o verbo comum para dizer; o pronome dativo retoma Gideão de forma natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קוּם
  choice: Levante-se
  rationale: Imperativo atual e digno que comunica a ordem de agir imediatamente.
- source_word: רֵד בַּמַּחֲנֶה
  choice: desça ao acampamento
  rationale: Reproduz o movimento descendente e evita acrescentar a ideia não explícita de atacar o acampamento.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira concisa a razão da ordem.
- source_word: נְתַתִּיו
  choice: eu o entreguei
  rationale: O sufixo masculino retoma o acampamento como representação da força inimiga; o perfeito apresenta a entrega como decisão divina já estabelecida.
- source_word: בְּיָדֶךָ
  choice: nas suas mãos
  rationale: Emprega o equivalente idiomático corrente em português para estar sob o poder ou controle de alguém, embora o hebraico use literalmente o singular “na sua mão”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome divino, não um título. “Yahweh” conserva uma transliteração reconhecível do Tetragrama sem substituí-lo por “SENHOR”.
- issue: Força temporal de נְתַתִּיו
  choice: eu o entreguei
  alternative: eu o entregarei; eu o entrego
  rationale: A forma perfeita apresenta a vitória como já determinada por Deus, preservando a tensão entre a declaração divina de entrega consumada e a batalha ainda futura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Levante-se” evita arcaísmo excessivo; “acampamento” conserva o cenário militar. A construção narrativa mantém proximidade com o hebraico sem soar artificial.
