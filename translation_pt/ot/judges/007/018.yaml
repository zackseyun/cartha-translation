base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: pt
  text: 'Quando eu e todos os que estão comigo tocarmos a trompa de carneiro[a], vocês também deverão tocar as trompas ao redor de todo o acampamento e dizer: “Por Yahweh e por Gideão!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica שׁוֹפָר designa uma trompa feita de chifre, muitas vezes de carneiro, e não uma trombeta de metal.
    reason: cultural_note
  - marker: b
    text: 'Algumas traduções trazem “A espada de Yahweh e de Gideão”, por influência da formulação de Juízes 7:20. Aqui, porém, o hebraico diz simplesmente: “Por Yahweh e por Gideão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: tocarmos / deverão tocar
  rationale: Com שׁוֹפָר, o verbo תקע significa soprar ou fazer soar uma trompa. Em português, “tocar a trompa” expressa a ação de modo natural; “deverão” comunica a força instrutiva da sequência verbal.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: trompa de carneiro / trompas
  rationale: שׁוֹפָר designa uma trompa feita de chifre, muitas vezes de carneiro, e não uma trombeta de metal. A primeira ocorrência explicita o objeto; no plural, “trompas” evita repetição pesada.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: eu e todos os que estão comigo
  rationale: A expressão identifica Gideão e os homens que o acompanham. A formulação é fiel, clara e idiomática em português moderno.
- source_word: גַּם אַתֶּם
  choice: vocês também
  rationale: Preserva o valor inclusivo de גַּם e emprega “vocês”, amplamente compreensível no português internacional e natural para leitores brasileiros.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: ao redor de todo o acampamento
  rationale: Comunica tanto a ideia de circundar quanto a abrangência expressa por כָּל, sem redundância artificial.
- source_word: וַאֲמַרְתֶּם
  choice: dizer
  rationale: O hebraico usa o verbo comum “dizer”. Embora o contexto militar sugira voz alta, a tradução não acrescenta “gritar”, intensidade não explicitada pelo verbo.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: Por Yahweh e por Gideão!
  rationale: A repetição da preposição לְ é preservada com “por”, adequada a um brado de lealdade ou convocação. O nome divino é transliterado como “Yahweh”, e “Gideão” segue a forma portuguesa consagrada.
theological_decisions:
- issue: Forma do brado לַיהוָה וּלְגִדְעוֹן
  choice: Por Yahweh e por Gideão!
  alternative: A espada de Yahweh e de Gideão!
  rationale: O texto hebraico deste versículo não contém a palavra “espada”; essa formulação mais longa é influenciada por Juízes 7:20. A tradução mantém a expressão mais breve e sua possível tensão, sem completá-la a partir do contexto posterior.
- issue: Representação do nome יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração representa no texto o nome divino da aliança, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O futuro do subjuntivo em “tocarmos” corresponde naturalmente à oração temporal; “deverão tocar” deixa clara a instrução. As notas foram posicionadas junto aos elementos que explicam.
