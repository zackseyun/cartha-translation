base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: pt
  text: 'Então o SENHOR disse a Gideão: “O povo ainda é numeroso demais. Faça-os descer até as águas, e ali eu os provarei para você. Aquele de quem eu lhe disser: ‘Este irá com você’, irá com você; mas aquele de quem eu lhe disser: ‘Este não irá com você’, não irá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consagrada para o nome divino, distinguindo-o tipograficamente do título comum ‘Senhor’.
- source_word: הָעָם רָב
  choice: o povo ainda é numeroso demais
  rationale: No contexto da redução do exército, רַב indica quantidade excessiva; ‘ainda’ traduz עוֹד de modo natural.
- source_word: הוֹרֵד אוֹתָם
  choice: Faça-os descer
  rationale: Reproduz o imperativo causativo hebraico de maneira clara e corrente.
- source_word: וְאֶצְרְפֶנּוּ
  choice: e ali eu os provarei
  rationale: צרף pode descrever refinar, examinar ou provar. ‘Provarei’ conserva a imagem de avaliação sem especificar antecipadamente o método.
- source_word: לְךָ
  choice: para você
  rationale: Mantém explicitamente o complemento hebraico, indicando que a seleção seria realizada em favor de Gideão.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: Este irá com você
  rationale: Preserva a formulação demonstrativa e direta do discurso divino.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH / Javé
  rationale: A forma em versalete segue uma tradição ampla e evita impor uma vocalização específica, sem confundir o nome próprio com o título comum.
- issue: Sentido de צרף na seleção dos homens
  choice: provarei
  alternative: testarei / refinarei
  rationale: ‘Provarei’ mantém a amplitude metafórica do verbo hebraico e não reduz o episódio a um teste meramente técnico nem exige a imagem literal da metalurgia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição solene da determinação divina foi preservada, enquanto a sintaxe foi ajustada para fluência sem eliminar o contraste entre quem irá e quem não irá.
