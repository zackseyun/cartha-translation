  to: 'Quando Gideão chegou, eis que um homem estava contando um sonho ao seu companheiro. Ele disse: “Tive um sonho: eis que um pão redondo de cevada[a] rolava no acampamento de Midiã; chegou até a tenda, bateu nela, e ela caiu. Então a virou de cabeça para baixo, e a tenda desabou.”'
