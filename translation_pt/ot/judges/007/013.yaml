translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala do soldado é vívida e natural, sem arcaísmos. O texto evita resolver além do necessário a imagem incomum do sonho, embora use gênero gramatical português para manter clara a referência à tenda.
