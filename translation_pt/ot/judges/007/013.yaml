base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: pt
  text: 'Quando Gideão chegou, eis que um homem estava contando um sonho ao seu companheiro. Ele disse: “Tive um sonho: eis que um pão redondo de cevada[a] rolava no acampamento de Midiã; chegou até a tenda, bateu nela, e ela caiu. Então a virou de cabeça para baixo, e a tenda desabou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um bolo de cevada” ou “um pão de cevada”. O termo hebraico é raro e provavelmente se refere a um bolo ou pão redondo.
    reason: Preserva a incerteza lexical de צְלוּל sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: וַיָּבֹא גִדְעוֹן
  choice: Quando Gideão chegou
  rationale: A sequência narrativa introduz a circunstância temporal; esta formulação é natural em português e mantém a progressão do relato.
- source_word: וְהִנֵּה
  choice: viu que / Um
  rationale: A partícula chama a atenção para uma cena inesperada. Na narração, “viu que” comunica seu valor apresentativo; no discurso direto, a exclamação e a apresentação imediata do pão preservam a vivacidade sem recorrer ao pouco natural “eis” repetidamente.
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: estava contando um sonho ao seu companheiro
  rationale: O particípio indica ação em andamento, e “companheiro” se ajusta ao contexto militar sem pressupor amizade íntima.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: Tive um sonho!
  rationale: O hebraico emprega verbo e substantivo cognatos para dar ênfase. A exclamação transmite essa força em português corrente, evitando a expressão artificial “sonhei um sonho”.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: um pão redondo de cevada
  rationale: צלול é raro e provavelmente designa um bolo ou pão de formato redondo. A tradução oferece uma imagem compreensível, enquanto a nota conserva a incerteza lexical.
- source_word: מִתְהַפֵּךְ בְּמַחֲנֵה מִדְיָן
  choice: vinha rolando pelo acampamento de Midiã
  rationale: A forma reflexiva sugere algo girando ou dando voltas sobre si mesmo. “Pelo acampamento” expressa movimento dentro da área marcada por ב sem transformar explicitamente a preposição em “para dentro”.
- source_word: וַיָּבֹא עַד הָאֹהֶל
  choice: Chegou até uma tenda
  rationale: עַד marca o ponto alcançado. O artigo hebraico pode apresentar a tenda relevante na cena; em português, “uma tenda” é mais natural na primeira menção.
- source_word: וַיַּכֵּהוּ וַיִּפֹּל
  choice: bateu nela, fazendo-a cair
  rationale: Mantém o impacto e explicita naturalmente em português a relação de consequência entre os verbos.
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה וְנָפַל הָאֹהֶל
  choice: virou-a de baixo para cima, e a tenda desabou
  rationale: O sufixo masculino singular tem antecedente formalmente ambíguo, pois tanto o pão quanto אֹהֶל são masculinos em hebraico. Pelo encadeamento da imagem, a tenda é entendida como objeto virado; “desabou” comunica de modo idiomático a queda destrutiva expressa ao final.
