    issue: “Ele dizia” traduz וַיֹּאמֶר com aspecto durativo.
    rationale: 'O wayyiqtol introduz a fala como evento narrativo pontual: “Ele disse”. O durativo não é exigido pelo original.'
  - severity: low
    issue: “Vinha rolando pelo acampamento” sugere direção em relação a um ponto de referência e percurso através do acampamento.
    rationale: מִתְהַפֵּךְ descreve o movimento giratório, enquanto בְּמַחֲנֵה significa primariamente “no acampamento”. “Rolava no acampamento” preserva ambos de modo mais direto.
  - severity: low
    issue: “Viu que” enfraquece a partícula apresentativa וְהִנֵּה.
    rationale: Embora a formulação seja compreensível, “eis que” reproduz melhor a introdução vívida da cena sem acrescentar uma ação de percepção como foco narrativo.
