  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a fala de Javé, o grupo específico dos trezentos que lamberam, o destinatário plural de «eu os salvarei», a entrega de Midiã a Gideão e a ordem para que o restante do povo se retire. A alternância hebraica entre o plural em «vos salvarei» e o singular em «em tua mão» é preservada.
  naturalness: «Salvarei vocês» é natural no Brasil, mas «eu os salvarei» tem alcance mais amplamente internacional sem perder o plural. Para a expressão idiomática hebraica בידך, «entregarei Midiã em sua mão» é mais idiomático em português do que «na sua mão», preservando ao mesmo tempo o singular dirigido a Gideão.
  terminology: «Javé», «Gideão» e «Midiã» são formas portuguesas adequadas. «Povo» conserva deliberadamente o termo amplo do hebraico, sem o restringir interpretativamente a soldados.
