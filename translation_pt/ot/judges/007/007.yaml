  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: pt
  text: 'Então Javé disse a Gideão: “Por meio dos trezentos homens que lamberam[a], eu os salvarei e entregarei Midiã em sua mão. Que todo o povo vá, cada um para o seu lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Com os trezentos homens que lamberam”.'
    reason: A preposição hebraica pode ser vertida por uma construção que ressalta acompanhamento ou instrumento.
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, em vez de substituí-lo por um título.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: Por meio dos trezentos homens
  rationale: Expressa o valor instrumental da preposição ב e deixa claro que Deus realizará o livramento mediante esse grupo.
- source_word: הַמֲלַקְקִים
  choice: que lamberam
  rationale: Mantém a ação concreta que identifica os homens no contexto anterior, sem repetir o objeto que não aparece neste versículo.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: eu salvarei vocês
  rationale: Preserva tanto o sentido militar e teológico do Hifil de ישׁע quanto o plural explícito do pronome hebraico.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: e entregarei Midiã na sua mão
  rationale: Conserva a metáfora hebraica de conceder domínio ou vitória e mantém o pronome no singular, dirigido a Gideão.
- source_word: וְכָל הָעָם
  choice: todo o povo
  rationale: Segue a designação ampla do hebraico, embora no contexto se trate da força reunida para a batalha.
- source_word: יֵלְכוּ
  choice: Que ... vá
  rationale: Representa o valor jussivo do imperfeito como ordem ou permissão, não como simples previsão futura.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: cada um para o seu lugar
  rationale: Reproduz a construção distributiva e evita especificar 'casa', ideia possível no contexto, mas não expressa pelo substantivo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: O texto apresenta diretamente o nome divino; a tradução o preserva na forma portuguesa corrente, sem substituí-lo pelo título tradicional.
- issue: Alternância entre destinatário plural e singular
  choice: “salvarei vocês” e “na sua mão”
  alternative: Uniformizar ambos no plural ou no singular
  rationale: O hebraico passa deliberadamente do objeto plural אֶתְכֶם, que inclui Gideão e seu povo, ao sufixo singular בְּיָדֶךָ, dirigido pessoalmente a Gideão. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe mantém a declaração divina direta, a metáfora da “mão” e a alternância significativa entre plural e singular.
