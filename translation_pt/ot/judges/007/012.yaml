base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: pt
  text: Midiã, Amaleque e todos os povos do Oriente[a] estavam acampados no vale[b], numerosos como gafanhotos. Seus camelos eram incontáveis, tão numerosos como a areia à beira-mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos do Oriente”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “jaziam” ou “estavam espalhados no vale”. O particípio hebraico significa literalmente “caindo” e, neste contexto, pode descrever as tropas estendidas ou acampadas no vale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק וְכָל בְּנֵי קֶדֶם
  choice: Midiã, Amaleque e todos os povos do Oriente
  rationale: Traduz diretamente os nomes e verte o hebraísmo coletivo “filhos do Oriente” por uma expressão natural em português. Não se acrescenta um marcador temporal como “Ora”, ausente do hebraico.
- source_word: נֹפְלִים
  choice: estavam acampados
  rationale: O particípio de נפל significa literalmente “caindo/caídos”, mas, neste contexto militar, retrata as tropas instaladas ou estendidas pelo vale. “Estavam acampados” comunica naturalmente a situação, enquanto a nota preserva a imagem e a ambiguidade lexical.
- source_word: בָּעֵמֶק
  choice: no vale
  rationale: Tradução direta e corrente de עֵמֶק neste contexto geográfico.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: numerosos como gafanhotos
  rationale: Expressa de modo idiomático a comparação hebraica e sua ênfase na multidão esmagadora.
- source_word: וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Seus camelos eram incontáveis
  rationale: Reproduz naturalmente a expressão hebraica “não havia número” e mantém sua força hiperbólica.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: tão numerosos como a areia à beira-mar
  rationale: Mantém a comparação tradicional com a areia do mar e representa o לָרֹב final por “tão numerosos”, preservando a ênfase na enorme quantidade sem produzir uma redundância artificial em português.
