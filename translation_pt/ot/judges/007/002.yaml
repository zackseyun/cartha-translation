  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: pt
  text: 'E Yahweh disse a Gideão: “O povo que está com você é numeroso demais para eu entregar Midiã nas mãos deles[a], para que Israel não se vanglorie contra mim, dizendo: ‘Foi a minha própria mão que me salvou[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão deles”. No idioma hebraico, “mão” no singular pode representar poder ou controle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “me libertou”. O verbo hebraico pode significar “salvar” ou “libertar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Preserva o fluxo narrativo do waw consecutivo sem tornar a sequência mais explícita do que o hebraico.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: O povo que está com você é numeroso demais
  rationale: O adjetivo רַב significa literalmente “muito/numeroso”, mas o contexto seguinte indica excesso; esta formulação é natural e clara em português.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: para que eu entregue Midiã nas mãos deles
  rationale: A construção com מן e o infinitivo expressa que o número do povo impede ou torna inadequada a entrega. “Entregar nas mãos” comunica naturalmente o domínio ou controle indicado pelo idioma hebraico.
- source_word: פֶּן יִתְפָּאֵר עָלַי יִשְׂרָאֵל
  choice: para que Israel não se vanglorie contra mim
  rationale: פֶּן introduz a finalidade negativa, e o hitpael de פאר com עַל expressa exaltação própria ou vanglória contra Yahweh.
- source_word: יָדִי הוֹשִׁיעָה לִּי
  choice: Foi a minha própria mão que me salvou
  rationale: A construção destacada enfatiza que Israel atribuiria a salvação ao próprio poder. Mantém-se Israel como coletivo singular, conforme o hebraico.
theological_decisions:
- issue: Forma do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome pessoal representado pelo Tetragrama no texto hebraico, sem substituí-lo por um título.
- issue: Israel como coletivo singular
  choice: Israel ... “minha própria mão ... me salvou”
  alternative: Os israelitas ... “nossas próprias mãos ... nos salvaram”
  rationale: Preserva a personificação coletiva e os pronomes singulares do hebraico, sem suavizar sua forma retórica.
- issue: Vanglória dirigida contra Deus
  choice: se vanglorie contra mim
  alternative: se glorie diante de mim; se exalte acima de mim
  rationale: “Contra mim” preserva a força relacional de עָלַי e a tensão teológica da pretensão de Israel de atribuir a si mesmo a salvação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” corresponde ao singular dirigido a Gideão. A ordem marcada “Foi a minha própria mão que...” reproduz de modo natural em português a ênfase da declaração hebraica.
