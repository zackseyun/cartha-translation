base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: pt
  text: Gideão e os cem homens que estavam com ele chegaram à extremidade do acampamento no início da vigília do meio da noite[a], justamente quando tinham acabado de posicionar os guardas[b]. Então tocaram os chifres[c] e despedaçaram os jarros que tinham nas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vigília intermediária” ou “segunda vigília”. O hebraico se refere a uma das divisões da noite.
    reason: lexical_alternative
  - marker: b
    text: Ou “tinham acabado de pôr os guardas” ou “haviam posicionado a guarda”. A construção hebraica enfatiza a ação de pôr os guardas.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico shofarot: chifres usados para emitir sinais, tradicionalmente traduzidos por “trombetas”.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: à extremidade do acampamento
  rationale: Preserva o sentido espacial de קָצֶה como limite ou borda, em formulação natural e digna em português.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: no início da vigília do meio da noite
  rationale: רֹאשׁ indica aqui o começo de um período, e אַשְׁמֹרֶת designa uma divisão da noite. A explicitação de 'da noite' torna o sentido acessível sem identificar rigidamente essa vigília como a segunda.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: justamente quando haviam acabado de trocar os guardas
  rationale: אַךְ assinala a coincidência temporal imediata, enquanto o infinitivo absoluto com o verbo finito enfatiza a ação. No contexto de uma vigília noturna, 'trocar os guardas' comunica naturalmente a colocação da nova guarda, sem perder a ideia de que isso acabara de ocorrer.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: tocaram os chifres
  rationale: שׁוֹפָרוֹת são chifres usados para sinalização. 'Chifres' preserva melhor a natureza do instrumento do que o termo genérico 'trombetas'; a nota esclarece o referente cultural.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: e despedaçaram os jarros
  rationale: O verbo expressa quebra violenta, e 'despedaçaram' reproduz a força e a brusquidão da ação. כַּדִּים é vertido pelo termo moderno e amplo 'jarros', sem acrescentar material não declarado no hebraico.
- source_word: אֲשֶׁר בְּיָדָם
  choice: que tinham nas mãos
  rationale: Formulação portuguesa direta que mantém a referência aos recipientes carregados pelos homens.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão, com legibilidade brasileira. A ordem narrativa e a tensão da cena foram preservadas. Evitou-se especificar 'chifres de carneiro', pois o substantivo hebraico não exige essa identificação em cada ocorrência.
