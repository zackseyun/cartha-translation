base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: pt
  text: 'Agora, por favor, proclame ao povo, dizendo: “Quem estiver com medo e tremendo volte e retire-se[a] do monte Gileade[b].” Então, vinte e dois mil dentre o povo voltaram, e dez mil permaneceram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido como “retire-se” (וְיִצְפֹּר) é raro e tem sentido discutido; pode sugerir “saia cedo” ou “afaste-se discretamente”.
    reason: lexical_alternative
  - marker: b
    text: “Monte Gileade” traduz diretamente o hebraico, embora a referência geográfica seja difícil neste contexto; alguns entendem a expressão de modo mais amplo, como “região montanhosa de Gileade”.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: O hebraico contém explicitamente o marcador temporal וְעַתָּה, literalmente “e agora”. Em português, “Agora” preserva essa transição sem tornar a frase pesada.
- source_word: קְרָא נָא
  choice: por favor, proclame
  rationale: O imperativo de קרא pede um anúncio público, e נָא atenua o comando com uma partícula de solicitação. “Proclame” mantém o caráter público e solene.
- source_word: בְּאָזְנֵי הָעָם
  choice: para que todo o povo ouça
  rationale: A expressão significa literalmente “aos ouvidos do povo”. A formulação escolhida transmite de modo natural em português que o anúncio deve ser feito publicamente e ouvido pelo povo.
- source_word: מִי יָרֵא וְחָרֵד
  choice: Quem estiver com medo e tremendo
  rationale: 'A combinação intensifica o estado de medo: יָרֵא indica estar com medo, e חָרֵד sugere tremor. A tradução conserva os dois elementos sem suavizar a intensidade.'
- source_word: יָשֹׁב
  choice: volte
  rationale: O jussivo, no contexto da proclamação, dá permissão ou instrução para retornar. O subjuntivo português comunica naturalmente esse valor.
- source_word: וְיִצְפֹּר
  choice: e se retire
  rationale: O verbo é raro e seu sentido exato é discutido. “Se retire” comunica a retirada do ajuntamento militar sem decidir entre nuances possíveis como sair cedo ou escapar discretamente.
- source_word: מֵהַר הַגִּלְעָד
  choice: do monte Gileade
  rationale: הַר no singular pode significar monte ou região montanhosa. “Monte Gileade” é a leitura direta do texto, enquanto a dificuldade geográfica é registrada em nota.
- source_word: וַיָּשָׁב מִן הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: Então, vinte e dois mil dentre o povo voltaram
  rationale: A construção hebraica usa um verbo singular antes do numeral com sentido coletivo. O português requer concordância plural; “dentre o povo” preserva מִן הָעָם.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: e dez mil permaneceram
  rationale: נשאר significa permanecer ou restar. “Permaneceram” é claro e mantém o contraste com os que voltaram.
