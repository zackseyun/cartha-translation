base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: pt
  text: Cada homem ficou no seu lugar ao redor do acampamento, e todo o acampamento correu; eles gritaram[a] e fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deram um grito de guerra”. O verbo também pode indicar um forte grito de batalha ou de pânico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: ficou
  rationale: O verbo עמד indica ficar de pé, permanecer ou tomar posição. Com a expressão distributiva seguinte, “ficou no seu lugar” comunica naturalmente que cada homem manteve sua posição.
- source_word: אִישׁ תַּחְתָּיו
  choice: cada homem ficou no seu lugar
  rationale: A expressão idiomática significa que cada pessoa permaneceu em sua própria posição. “Cada homem” preserva a força distributiva de אִישׁ, e “no seu lugar” transmite o sentido idiomático.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: ao redor do acampamento
  rationale: סָבִיב com ל descreve a posição dos homens em volta do acampamento; a formulação é direta e natural em português.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: todo o acampamento correu
  rationale: רץ significa normalmente “correr”. A referência coletiva ao “acampamento” representa seus ocupantes; a tradução conserva essa metonímia e não especifica se o movimento foi organizado ou caótico.
- source_word: וַיָּרִיעוּ
  choice: eles gritaram
  rationale: O verbo רוע/ריע pode indicar um grito forte, inclusive um grito de guerra ou de pânico. “Gritaram” preserva essa amplitude sem decidir a natureza exata do clamor.
- source_word: ויניסו
  choice: fugiram
  rationale: No contexto, a forma expressa a fuga dos ocupantes do acampamento. “Fugiram” é a equivalência portuguesa mais clara e concisa.
