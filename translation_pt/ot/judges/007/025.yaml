  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: pt
  text: Eles capturaram os dois príncipes de Midiã, Orebe e Zeebe.[a] Mataram Orebe junto à rocha de Orebe, e mataram Zeebe junto ao lagar de Zeebe. Depois perseguiram Midiã e levaram as cabeças de Orebe e Zeebe a Gideão, do outro lado do Jordão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes Orebe e Zeebe estão relacionados, respectivamente, às palavras hebraicas para “corvo” e “lobo”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de além do Jordão”. A expressão hebraica não especifica por si só qual margem está em vista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: príncipes
  rationale: O termo designa governantes ou chefes de alta posição. “Príncipes” preserva o status político-militar elevado dos dois midianitas.
- source_word: וַיִּלְכְּדוּ
  choice: capturaram
  rationale: לכד, neste contexto militar, indica prender ou apoderar-se de inimigos; “capturaram” é claro e natural.
- source_word: עֹרֵב / זְאֵב
  choice: Orebe / Zeebe
  rationale: São nomes pessoais e, por isso, foram transliterados, embora correspondam lexicalmente a “corvo” e “lobo”.
- source_word: בְּצוּר עוֹרֵב
  choice: junto à rocha de Orebe
  rationale: צוּר significa “rocha” ou “penhasco”. “Junto à” exprime naturalmente uma localização sem decidir se a morte ocorreu sobre a rocha.
- source_word: בְיֶקֶב זְאֵב
  choice: junto ao lagar de Zeebe
  rationale: יֶקֶב designa um lagar ou tanque de prensagem. “Junto ao” mantém neutra a relação espacial da preposição בְּ.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: Depois perseguiram Midiã
  rationale: A expressão dá continuidade à ação militar. “Midiã” pode representar coletivamente os midianitas, como no hebraico.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: as cabeças de Orebe e Zeebe
  rationale: Embora רֹאשׁ esteja formalmente no singular, os dois nomes coordenados produzem sentido distributivo; o plural é o modo natural de expressá-lo em português.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: A expressão significa “de além/do outro lado do Jordão”, mas a perspectiva geográfica exata pode ser ambígua no contexto.
