base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: pt
  text: 'Então Gideão fez o povo descer até a água, e Yahweh lhe disse: “Todo aquele que lamber a água com a língua, como faz o cão, você o colocará à parte[a]; e fará o mesmo com todo aquele que se ajoelhar para beber.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você o posicionará separadamente”. O verbo pode significar colocar ou posicionar alguém à parte.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: fez o povo descer
  rationale: O hifil de ירד tem sentido causativo. A formulação preserva esse valor com clareza e naturalidade em português.
- source_word: הָעָם
  choice: o povo
  rationale: עם é um coletivo geral. Embora o contexto seja militar, “o povo” conserva a amplitude lexical do hebraico sem especificar “tropas” ou “homens”.
- source_word: הַמָּיִם
  choice: a água
  rationale: Apesar da forma morfologicamente plural, מים funciona normalmente como nome de massa; o singular é idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כֹּל אֲשֶׁר יָלֹק
  choice: Todo aquele que lamber
  rationale: A construção é distributiva. “Lamber” preserva a imagem concreta e estabelece naturalmente a comparação seguinte com o cão.
- source_word: בִּלְשׁוֹנוֹ
  choice: com a língua
  rationale: Mantém o instrumento corporal explícito no hebraico; em português, o possessivo seria desnecessário neste contexto reflexivo.
- source_word: מִן הַמַּיִם
  choice: a água
  rationale: A preposição מן indica a água tomada da fonte, mas o português expressa naturalmente a ação como “lamber a água”, sem necessidade de acrescentar “um pouco”.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: como faz o cão
  rationale: Preserva a comparação explícita sem repetir de maneira pesada o verbo “lamber”. O artigo definido pode representar naturalmente a classe em português.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: você o colocará à parte
  rationale: O hifil de יצג denota colocar ou posicionar, e לְבָד marca separação. A escolha comunica claramente a classificação ordenada.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: e fará o mesmo com todo aquele que se ajoelhar para beber
  rationale: O texto hebraico deixa elíptica a ação a ser aplicada ao segundo grupo. “Fará o mesmo” torna a relação sintática compreensível sem decidir além do contexto qual grupo seria posteriormente escolhido.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: “Yahweh” preserva o nome pessoal presente no texto hebraico e evita substituí-lo por um título.
- issue: Relação entre os dois modos de beber
  choice: Ambos são apresentados como grupos a serem separados nesta etapa
  alternative: Entender apenas o primeiro grupo como objeto da ordem explícita
  rationale: A segunda oração é elíptica no hebraico, mas sua coordenação com a ordem anterior indica que se deve proceder de modo correspondente com o segundo grupo. A tradução não acrescenta qualquer avaliação sobre vigilância, mérito ou caráter.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição hebraica foi moderada em “como faz o cão”, e a elipse da última oração foi explicitada apenas o necessário para a compreensão. O marcador da nota foi colocado junto à expressão que ela esclarece.
