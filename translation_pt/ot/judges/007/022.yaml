  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: pt
  text: Quando tocaram as trezentas trombetas[a], Yahweh fez com que a espada de cada homem se voltasse contra seu companheiro e contra todo o acampamento[b]. O acampamento fugiu até Bete-Sita, na direção de Zererá, e até a orla[d] de Abel-Meolá[c], perto de Tabate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tocaram os trezentos chifres de carneiro”. O termo hebraico שׁוֹפָרוֹת se refere a trombetas de chifre, muitas vezes feitas de chifres de carneiro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por todo o acampamento”. O hebraico pode indicar que cada homem voltou a espada contra os demais no acampamento ou enfatizar que a confusão se espalhou pelo acampamento inteiro.'
    reason: alternative_reading
  - marker: c
    text: Bete-Sita, Zererá, Abel-Meolá e Tabate são nomes de lugares situados na rota de fuga do exército.
    reason: cultural_note
  - marker: d
    text: 'Ou: “a margem” ou “o limite” de Abel-Meolá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: tocaram as trezentas trombetas
  rationale: O verbo está no plural ativo, e שׁוֹפָרוֹת designa trombetas de chifre, muitas vezes feitas de chifre de carneiro. “Trombetas” é claro no contexto militar; a nota preserva a especificidade do instrumento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: fez com que a espada de cada homem se voltasse contra seu companheiro
  rationale: Expressa naturalmente em português a ação causativa de Yahweh, preserva a imagem da espada e mantém o sentido distributivo de אִישׁ.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: e contra todo o acampamento
  rationale: Conserva a possibilidade de a preposição indicar hostilidade contra o restante do acampamento, sem ocultar na nota a leitura locativa “por todo o acampamento”.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: O acampamento fugiu
  rationale: Mantém o termo hebraico מַחֲנֶה e sua personificação coletiva; no contexto, refere-se às forças acampadas.
- source_word: עַד בֵּית הַשִּׁטָּה
  choice: até Bete-Sita
  rationale: Translitera o topônimo em forma adaptada à ortografia e à pronúncia portuguesas.
- source_word: צְרֵרָתָה
  choice: na direção de Zererá
  rationale: A terminação direcional hebraica indica movimento rumo ao lugar, nuance comunicada por “na direção de”.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: a orla de Abel-Meolá
  rationale: שָׂפָה significa literalmente “lábio” e, geograficamente, “orla”, “margem” ou “limite”. “Orla” mantém a imagem sem pressupor que se trate especificamente de uma margem fluvial.
- source_word: עַל טַבָּת
  choice: perto de Tabate
  rationale: Neste contexto geográfico, עַל provavelmente indica proximidade. “Perto de” é natural e não define de modo excessivo a relação espacial.
- source_word: אִישׁ
  choice: de cada homem
  rationale: 'Preserva o sentido distributivo masculino singular: cada indivíduo no acampamento voltou sua espada contra outro.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. A forma “Yahweh” preserva o nome pessoal, em vez de substituí-lo pelo título “SENHOR”; “Jeová” é uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas toponímicas adaptadas ao uso português. A redação segue de perto as imagens e relações sintáticas hebraicas, mas evita construções artificiais. As notas registram ambiguidades lexicais e geográficas genuínas.
