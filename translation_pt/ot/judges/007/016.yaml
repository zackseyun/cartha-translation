base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: pt
  text: Então ele dividiu os trezentos homens em três grupos[a] e pôs nas mãos de todos eles trombetas[b] e jarros vazios[c], com tochas dentro dos jarros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “três cabeças”, expressão que significa três grupos ou companhias.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou “chifres de carneiro”, usados como instrumentos de sopro (hebraico: shofarot).'
    reason: lexical_alternative
  - marker: c
    text: Ou “cântaros vazios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: dividiu
  rationale: O verbo חצה descreve aqui a divisão da tropa em grupos; “dividiu” é natural e preserva o sentido organizacional.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: os trezentos homens
  rationale: אִישׁ significa literalmente “homem”; o contexto militar é claro sem a explicitação interpretativa “soldados”.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: três grupos
  rationale: Literalmente “três cabeças”, expressão que neste contexto designa três agrupamentos. “Grupos” é claro e amplamente compreensível em português.
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: pôs nas mãos de todos eles
  rationale: A construção preserva a imagem concreta do hebraico e comunica a distribuição dos objetos entre todos os homens.
- source_word: שׁוֹפָרוֹת
  choice: trombetas
  rationale: שׁוֹפָר designa um instrumento de sopro usado para sinalização. “Trombetas” é a forma tradicional e facilmente compreendida; a alternativa mais específica consta em nota.
- source_word: כַדִּים רֵקִים
  choice: jarros vazios
  rationale: כַּד é um recipiente, jarro ou cântaro, provavelmente de barro; “jarros” é corrente e mantém explícito רֵקִים, “vazios”.
- source_word: לַפִּדִים בְּתוֹךְ הַכַּדִּים
  choice: tochas dentro dos jarros
  rationale: A tradução direta preserva tanto o objeto quanto sua localização no interior dos recipientes.
