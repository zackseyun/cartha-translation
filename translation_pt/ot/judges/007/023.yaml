  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: pt
  text: Os homens de Israel[b] foram convocados[a] de Naftali, de Aser e de toda a tribo de Manassés, e perseguiram Midiã[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “foram chamados” ou “foram mobilizados”; seguindo o sentido mais comum da raiz, também se poderia entender “clamaram”. O verbo hebraico é difícil neste ponto; no contexto, refere-se à reunião de Israel para a perseguição.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o homem de Israel”, expressão coletiva que significa “os homens de Israel” ou “os israelitas”.'
    reason: lexical_alternative
  - marker: c
    text: “Midiã” representa aqui as forças midianitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: foram convocados
  rationale: O nifal de צעק, neste contexto militar, indica que os israelitas foram chamados ou reunidos para a perseguição. “Foram convocados” comunica esse sentido com naturalidade, sem reduzir o verbo ao sentido ativo mais comum de “gritar”.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Embora אִישׁ esteja no singular, a expressão é coletiva; o verbo plural subsequente confirma que se refere aos homens israelitas como grupo.
- source_word: מִנַּפְתָּלִי וּמִן אָשֵׁר וּמִן כָּל מְנַשֶּׁה
  choice: de Naftali, de Aser e de toda a tribo de Manassés
  rationale: A preposição מן marca a origem dos convocados. A explicitação de “tribo” em “toda a tribo de Manassés” torna o referente geográfico-tribal claro em português e preserva a abrangência de כָּל.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי מִדְיָן
  choice: então perseguiram Midiã
  rationale: רדף seguido de אַחֲרֵי descreve a perseguição militar. “Midiã” mantém a metonímia do hebraico, em que o nome do povo representa suas forças.
