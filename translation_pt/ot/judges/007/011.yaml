base_translation:
  language: en
  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: pt
  text: “Você ouvirá o que eles estão dizendo; depois disso, suas mãos se fortalecerão, e você descerá ao acampamento.” Então Gideão desceu com Purá, seu ajudante, até a extremidade das tropas armadas que estavam no acampamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a extremidade dos homens equipados para a batalha”. O termo hebraico designa pessoas armadas ou preparadas para combater.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: Você ouvirá o que eles estão dizendo
  rationale: O perfeito com waw tem valor futuro nesta fala, e o imperfeito de דבר descreve a conversa que Gideão está prestes a ouvir.
- source_word: וְאַחַר
  choice: depois disso
  rationale: Expressa naturalmente a sequência temporal entre ouvir a conversa e receber coragem.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: suas mãos se fortalecerão
  rationale: Preserva a imagem hebraica das mãos fortalecidas, que neste contexto comunica coragem e determinação.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: você descerá contra o acampamento
  rationale: Mantém o sentido literal de ירד e entende בַּמַּחֲנֶה no contexto militar como movimento contra o acampamento, sem sugerir que Gideão entraria sozinho nele naquele momento.
- source_word: וַיֵּרֶד הוּא
  choice: Então Gideão desceu
  rationale: O wayyiqtol faz a narrativa avançar. O nome explícito esclarece em português o referente do pronome hebraico sem alterar seu sentido.
- source_word: וּפֻרָה נַעֲרוֹ
  choice: com Purá, seu ajudante
  rationale: נַעַר pode designar jovem, servo ou assistente. “Ajudante” é natural no contexto e preserva a função sem impor uma condição social específica.
- source_word: אֶל קְצֵה הַחֲמֻשִׁים
  choice: até a extremidade dos homens armados
  rationale: קצה indica limite ou extremidade, e חֲמֻשִׁים designa pessoas equipadas para combate.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: que estavam no acampamento
  rationale: A oração relativa identifica os homens armados situados no acampamento.
theological_decisions:
- issue: Sentido da imagem “suas mãos se fortalecerão”
  choice: Preservar literalmente a imagem corporal
  alternative: “você ganhará coragem”
  rationale: A expressão idiomática aponta para coragem e determinação, mas a imagem hebraica é inteligível em português e evita reduzir sua força poética.
- issue: Direção do movimento em בַּמַּחֲנֶה
  choice: “contra o acampamento”
  alternative: “ao acampamento” ou “para dentro do acampamento”
  rationale: O contexto distingue a aproximação secreta imediata do ataque posterior; “contra” preserva essa progressão, embora a preposição hebraica permita nuances de direção ou entrada.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Conserva a metáfora hebraica das mãos fortalecidas; usa “ajudante” para a amplitude contextual de נַעַר e “homens armados” para חֲמֻשִׁים. O marcador [a] aparece no texto principal e explica a principal alternativa lexical.
