base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: pt
  text: Então eles pegaram as provisões do povo, levando-as nas mãos, junto com as suas trombetas[a]. Gideão mandou todos os homens de Israel, cada um para a sua tenda, mas manteve consigo os trezentos homens. O acampamento de Midiã ficava abaixo dele, no vale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chifres” ou “chifres de carneiro”; o termo hebraico se refere a um chifre usado como instrumento de sinalização.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: eles pegaram
  rationale: O wayyiqtol de לקח expressa a ação narrativa simples; o sujeito plural refere-se naturalmente aos homens selecionados.
- source_word: צֵדָה הָעָם
  choice: as provisões do povo
  rationale: צֵדָה abrange mantimentos e suprimentos de campanha; 'provisões' preserva essa amplitude, e הָעָם é mantido como 'o povo'.
- source_word: בְּיָדָם
  choice: nas mãos
  rationale: Conserva a imagem concreta do hebraico e indica que os homens passaram a carregar as provisões.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: as suas trombetas
  rationale: שׁוֹפָר designa um instrumento de sinalização feito de chifre; 'trombetas' é claro no contexto militar, com a natureza do instrumento explicitada em nota.
- source_word: שִׁלַּח
  choice: mandou
  rationale: O verbo singular tem Gideão como sujeito. 'Mandou ... para' comunica naturalmente o envio ou dispensa sem tornar a formulação excessivamente técnica.
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: todos os homens de Israel, cada um para a sua tenda
  rationale: Mantém o referente masculino dos combatentes e o sentido distributivo de אִישׁ ... אִישׁ.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: mas manteve consigo os trezentos homens
  rationale: הֶחֱזִיק significa conservar ou reter; 'manteve consigo' expressa com clareza o contraste entre dispensar a maioria e ficar com os trezentos.
- source_word: מַחֲנֵה מִדְיָן
  choice: o acampamento de Midiã
  rationale: Reproduz diretamente a relação da cadeia construta e identifica a força adversária.
- source_word: מִתַּחַת בָּעֵמֶק
  choice: abaixo dele, no vale
  rationale: Preserva tanto a diferença de elevação indicada por מִתַּחַת quanto a localização no vale indicada por בָּעֵמֶק.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O nome 'Gideão' foi explicitado como sujeito do verbo singular para evitar ambiguidade referencial em português; a nota preserva a forma concreta e as alternativas de שׁוֹפָר.
