  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: pt
  text: Então Jerubaal, isto é, Gideão, e todo o povo que estava com ele se levantaram cedo e acamparam junto à fonte de Harode.[a] O acampamento de Midiã ficava ao norte dele, perto da colina de Moré, no vale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto a En-Harode”. Em hebraico, o nome inclui literalmente a palavra que significa “fonte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: levantou-se de madrugada
  rationale: O hifil de שׁכם expressa levantar-se cedo; a formulação é natural em português e preserva a indicação temporal.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: Jerubaal, isto é, Gideão
  rationale: O pronome appositivo identifica Jerubaal como Gideão, mantendo os dois nomes e explicitando naturalmente sua equivalência.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: com todo o povo que estava com ele
  rationale: עָם é o termo geral para 'povo'; embora o contexto seja militar, evita-se substituí-lo por um termo mais específico como 'tropas'.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: Traduz diretamente חנה em linguagem portuguesa corrente e conserva o sujeito plural indicado pelo verbo hebraico.
- source_word: עַל עֵין חֲרֹד
  choice: junto à fonte de Harode
  rationale: עֵין designa uma fonte e também integra o topônimo; traduzir o elemento lexical torna a referência geográfica compreensível.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: O acampamento de Midiã
  rationale: Reproduz de modo direto a construção hebraica, sem converter Midiã no gentílico 'midianita'.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: ficava ao norte dele
  rationale: A construção espacial é vertida idiomaticamente, e o sufixo masculino singular לוֹ é mantido como 'dele', com referência a Gideão.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: perto da colina de Moré
  rationale: Neste contexto topográfico, מן tem valor locativo de proximidade, mais naturalmente expresso por 'perto de'.
- source_word: בָּעֵמֶק
  choice: no vale
  rationale: עֵמֶק significa normalmente 'vale', aqui como indicação do terreno onde ficava o acampamento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomes próprios em formas correntes. A ordem da primeira frase foi levemente ajustada para fluência, sem perder a identificação de Jerubaal com Gideão nem o plural do verbo 'acamparam'. O singular 'dele' preserva o sufixo hebraico e evita a harmonização para o plural.
