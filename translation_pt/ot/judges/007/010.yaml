  text: וְ/אִם יָרֵ֥א אַתָּ֖ה לָ/רֶ֑דֶת רֵ֥ד אַתָּ֛ה וּ/פֻרָ֥ה נַעַרְ/ךָ֖ אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: pt
  text: Mas, se você tem medo de descer, desça ao acampamento com Purá, seu ajudante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu servo” ou “seu jovem”. O termo hebraico pode designar um jovem, servo ou ajudante, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A combinação da conjunção com a partícula condicional introduz uma ressalva à ordem anterior; “Mas, se” expressa com naturalidade esse leve contraste.
- source_word: יָרֵא אַתָּה
  choice: você tem medo
  rationale: Expressa de modo corrente em português o estado de temor atribuído diretamente a Gideão.
- source_word: לָרֶדֶת ... רֵד
  choice: descer ... desça
  rationale: Mantém a repetição do verbo ירד e distingue naturalmente o infinitivo da forma imperativa.
- source_word: וּפֻרָה
  choice: com Purá
  rationale: Embora a forma contenha a conjunção, no contexto ela indica que Purá deve acompanhar Gideão; “com Purá” comunica essa relação sem artificialidade.
- source_word: נַעַרְךָ
  choice: seu ajudante
  rationale: נַעַר pode designar um jovem, servo ou assistente. Neste contexto, “ajudante” expressa a função subordinada de Purá sem afirmar além do texto uma condição servil formal.
- source_word: אֶל הַמַּחֲנֶה
  choice: ao acampamento
  rationale: Representa diretamente o movimento em direção ao acampamento, sem impor a leitura mais específica de entrada em seu interior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “descer/desça” preserva a ênfase do hebraico; “você” torna explícito o pronome presente no texto-fonte sem recorrer a uma construção excessivamente marcada.
