    rationale: A partícula introduz com destaque a circunstância seguinte. Traduzir apenas por “Quando” preserva a relação temporal, mas não a chamada de atenção. “Vejam:” a representa de modo natural sem recorrer ao registro mais elevado de “eis que”.
  - severity: low
    issue: “Exatamente” é uma intensificação desnecessária
    rationale: A construção כַּאֲשֶׁר... כֵּן exprime “como... assim/do mesmo modo”. “Exatamente” pode sugerir precisão adicional não explicitada pelo hebraico.
