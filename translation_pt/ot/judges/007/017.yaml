  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: pt
  text: 'E ele lhes disse: “Observem-me e façam o mesmo. Vejam: quando eu chegar à extremidade do acampamento, façam como eu fizer.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: Olhem para mim
  rationale: A construção com ראה e מן, neste contexto de instrução, manda os homens observarem Gideão como modelo. A formulação é natural em português e prepara a ordem de imitá-lo.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: e façam o mesmo
  rationale: כֵן indica modo, isto é, agir da mesma maneira; a tradução preserva a força imperativa com linguagem corrente.
- source_word: וְהִנֵּה
  choice: Quando
  rationale: Aqui a partícula chama atenção para a situação iminente e se integra naturalmente à oração temporal em português, sem exigir o pouco idiomático “eis que”.
- source_word: אָנֹכִי בָא
  choice: eu chegar
  rationale: O particípio apresenta uma ação iminente. No contexto da oração temporal, “eu chegar” comunica naturalmente a chegada prevista de Gideão.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: à extremidade do acampamento
  rationale: קָצֶה designa a borda ou limite exterior; “extremidade” é claro e adequado ao registro narrativo.
- source_word: כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: façam exatamente como eu fizer
  rationale: A formulação reproduz a relação explícita entre o ato de Gideão e a imitação ordenada aos homens; “exatamente” dá expressão natural à correlação כַאֲשֶׁר...כֵן sem acrescentar uma ação específica.
