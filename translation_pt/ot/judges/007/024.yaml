base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: pt
  text: 'Gideão enviou mensageiros por toda a região montanhosa de Efraim, dizendo: “Desçam para enfrentar Midiã e apoderem-se das águas[a] até Bete-Bara, bem como do Jordão”. Então todos os homens de Efraim[b] foram convocados[c] e se apoderaram das águas até Bete-Bara, bem como do Jordão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos cursos d’água” ou “dos vaus”. O hebraico diz literalmente “das águas” e provavelmente se refere a pontos estratégicos de travessia.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “todo homem de Efraim”, expressão coletiva que se refere aos homens de Efraim mobilizados para a luta.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico é difícil. Também pode ser entendido mais literalmente como “clamou”, mas o contexto favorece o sentido de convocação ou mobilização.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: mensageiros
  rationale: No contexto narrativo, designa agentes humanos enviados para transmitir uma mensagem, não seres celestiais.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: por toda a região montanhosa de Efraim
  rationale: הַר refere-se aqui à região de colinas de Efraim, não a um monte isolado.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: Desçam para enfrentar Midiã
  rationale: Preserva o movimento topográfico expresso pelo imperativo e comunica naturalmente o sentido militar de לִקְרַאת neste contexto.
- source_word: וְלִכְדוּ ... אֶת הַמַּיִם
  choice: e apoderem-se das águas
  rationale: Mantém a imagem ampla e literal de 'as águas', sem restringi-la no texto principal a vaus ou cursos d’água; 'apoderar-se' expressa o controle de pontos estratégicos.
- source_word: עַד בֵּית בָּרָה
  choice: até Bete-Bara
  rationale: עַד indica extensão espacial; o topônimo é transliterado de forma natural em português.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: bem como do Jordão
  rationale: A construção portuguesa deixa claro que também deviam controlar o Jordão, sem acrescentar 'rio', ausente do hebraico.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: Então todos os homens de Efraim foram convocados
  rationale: No contexto do envio dos mensageiros, a forma verbal difícil indica mais provavelmente a convocação ou mobilização dos efraimitas. O singular coletivo hebraico é expresso naturalmente no plural em português.
- source_word: וַיִּלְכְּדוּ
  choice: e se apoderaram
  rationale: Repete a mesma escolha lexical usada na ordem anterior, preservando a coesão entre o mandado e seu cumprimento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva “as águas” no texto principal para não eliminar a amplitude do hebraico, esclarecendo em nota sua provável função estratégica. “Para enfrentar” torna explícito apenas o valor militar já exigido pelo contexto, sem acrescentar uma interpretação teológica.
