base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: pt
  text: 'Seu companheiro respondeu: “Isto não é outra coisa senão a espada de Gideão, filho de Joás, homem de Israel. Deus entregou Midiã e todo o acampamento em suas mãos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “em suas mãos” significa “sob o poder ou controle dele”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: Seu companheiro respondeu
  rationale: Reproduz naturalmente a fórmula narrativa hebraica sem a redundância pouco idiomática em português de “respondeu e disse”; רֵעֵהוּ, no contexto militar, indica o companheiro do homem.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: Isso não pode ser outra coisa senão
  rationale: Expressa a exclusão enfática do hebraico e a identificação segura do significado do sonho em português atual.
- source_word: חֶרֶב
  choice: a espada
  rationale: Mantém a imagem concreta da espada, usada aqui como identificação simbólica da força vitoriosa de Gideão.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideão, filho de Joás
  rationale: Forma portuguesa corrente do patronímico hebraico.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: homem de Israel
  rationale: Conserva o substantivo masculino singular אִישׁ e a identificação nacional, sem reduzi-lo simplesmente a “israelita”.
- source_word: נָתַן הָאֱלֹהִים
  choice: Deus entregou
  rationale: O perfeito hebraico apresenta a vitória como decidida e certa; “entregou” é natural em português e combina com o idioma seguinte.
- source_word: בְּיָדוֹ
  choice: na mão dele
  rationale: Preserva literalmente o conhecido idioma hebraico de colocar alguém sob o poder ou controle de outra pessoa.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: Midiã e todo o acampamento
  rationale: Mantém o nome do povo e o sentido básico de מַחֲנֶה, incluindo a totalidade marcada por כָּל.
theological_decisions:
- issue: Valor do perfeito נָתַן na interpretação segura do sonho
  choice: Deus entregou
  alternative: Deus entregará
  rationale: O texto formula o resultado como já decidido, não como simples previsão futura. O pretérito preserva essa certeza sem explicar sua base teológica além do que o versículo afirma.
- issue: Forma de אִישׁ יִשְׂרָאֵל
  choice: homem de Israel
  alternative: israelita
  rationale: A opção escolhida retém a referência masculina singular explícita no hebraico e sua formulação enfática, sem acrescentar conteúdo denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula dupla hebraica “respondeu e disse” foi condensada para “respondeu”, enquanto a imagem da espada e o idioma “na mão dele” foram preservados. A pontuação posiciona a nota exatamente junto à expressão que ela explica.
