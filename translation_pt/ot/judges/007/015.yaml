  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: pt
  text: 'Quando Gideão ouviu o relato do sonho e sua interpretação, prostrou-se em adoração. Depois voltou ao acampamento de Israel e disse: “Levantem-se, pois o SENHOR entregou o acampamento de Midiã nas mãos de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: o relato do sonho
  rationale: מִסְּפָר designa aqui a narração ou o relato do sonho, não uma contagem.
- source_word: שִׁבְרוֹ
  choice: sua interpretação
  rationale: Neste contexto, שֵׁבֶר refere-se à explicação ou interpretação do sonho.
- source_word: וַיִּשְׁתָּחוּ
  choice: prostrou-se em adoração
  rationale: O verbo expressa o ato de curvar-se ou prostrar-se; o contexto indica adoração, explicitada para comunicar naturalmente o sentido em português.
- source_word: ק֔וּמוּ
  choice: Levantem-se
  rationale: Imperativo plural, dirigido aos israelitas; a forma explicita corretamente o número e mantém tom direto.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: entregou ... nas mãos de vocês
  rationale: Preserva a imagem hebraica de colocar o inimigo sob o poder de alguém e a forma plural do destinatário.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes.
theological_decisions:
- issue: Natureza do gesto de Gideão
  choice: prostrou-se em adoração
  alternative: prostrou-se
  rationale: Embora o verbo isolado possa indicar reverência ou prostração, neste contexto Gideão reage à confirmação divina do sonho; explicitar a adoração comunica o sentido contextual sem identificar um destinatário não declarado.
- issue: Aspecto da entrega do acampamento de Midiã
  choice: o SENHOR entregou
  alternative: o SENHOR entregará
  rationale: O hebraico usa o perfeito נָתַן, apresentando a vitória futura como já concedida; mantém-se o passado para preservar essa certeza retórica e teológica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas plurais claras para um público amplo. Conserva a metáfora hebraica “nas mãos de vocês” e usa “SENHOR” para o Tetragrama.
