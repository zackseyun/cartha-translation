  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: pt
  text: 'Então os três grupos tocaram as trombetas e quebraram os jarros. Seguraram as tochas na mão esquerda e, na mão direita, as trombetas, para tocá-las, e gritaram: “Uma espada por Yahweh e por Gideão!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A espada de Yahweh e de Gideão!”'
    reason: Leitura alternativa da frase hebraica elíptica.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: os três grupos
  rationale: No contexto militar, רָאשִׁים designa as três unidades em que Gideão dividiu os homens, não literalmente “cabeças”. “Grupos” é claro, natural e coerente com Juízes 7:16.
- source_word: שׁוֹפָרוֹת
  choice: trombetas
  rationale: שׁוֹפָר designa o instrumento de sopro usado para sinalização. “Trombetas” é a tradução corrente e imediatamente compreensível; “chifres de carneiro” seria mais concreto, mas pode especificar além do necessário.
- source_word: הַכַּדִּים
  choice: os jarros
  rationale: כַּד refere-se a um recipiente semelhante a jarro. “Jarros” é natural no português atual e evita a possível especificidade de “cântaros”.
- source_word: וַיַּחֲזִיקוּ
  choice: Seguraram
  rationale: O Hifil de חזק aqui descreve tomar ou manter algo firmemente na mão. “Seguraram” comunica a ação sem intensificá-la indevidamente.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: na mão esquerda ... na mão direita
  rationale: 'O hebraico emprega o singular distributivo: cada homem tinha uma tocha em uma mão e uma trombeta na outra. O singular também é idiomático e claro em português.'
- source_word: לַפִּדִים
  choice: as tochas
  rationale: לַפִּיד indica uma tocha ou objeto flamejante; “tochas” é a opção mais clara neste episódio.
- source_word: לִתְקֹעַ
  choice: para tocar
  rationale: O infinitivo expressa finalidade. Em português, toca-se uma trombeta; a formulação é natural e preserva a função do hebraico.
- source_word: וַיִּקְרְאוּ
  choice: gritaram
  rationale: קרא introduz aqui um brado de guerra. “Gritaram” transmite sua força e urgência.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Uma espada por Yahweh e por Gideão!
  rationale: A frase hebraica é elíptica, sem verbo, e לְ pode ser representado diretamente por “por/para”. “Uma espada por...” mantém a concisão e o caráter abrupto do brado, sem preencher a elipse de modo excessivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Expansão do brado elíptico חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Uma espada por Yahweh e por Gideão!
  alternative: A espada de Yahweh e de Gideão!
  rationale: O hebraico permite mais de uma expansão por ser uma frase nominal comprimida. O texto principal conserva a preposição לְ e a brusquidão do grito; a leitura tradicional e plausível com genitivo é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das ações e a concisão narrativa do hebraico foram preservadas. O marcador [a] foi colocado após o brado ao qual a nota se refere.
