base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: pt
  text: Ela estendeu a mão para a estaca da tenda, sua mão direita para o martelo dos trabalhadores[a]. Golpeou Sísera, esmagou-lhe a cabeça[b]; despedaçou e atravessou-lhe a têmpora[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o malho dos trabalhadores”. A expressão hebraica é incomum, e o instrumento de impacto pode ser entendido como martelo ou malho.
    reason: lexical_alternative
  - marker: b
    text: Ou “destroçou-lhe a cabeça”. O hebraico acumula verbos fortes para intensificar poeticamente a violência.
    reason: lexical_alternative
  - marker: c
    text: Ou “perfurou-lhe a têmpora”. O verbo também pode transmitir a ideia de passar através.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: Ela estendeu a mão
  rationale: Reproduz de modo natural a ação de estender a mão, mantendo o paralelismo com “a mão direita”.
- source_word: לַיָּתֵד
  choice: para a estaca da tenda
  rationale: O contexto de Jael identifica a estaca como própria de tenda; a explicitação torna o referente claro sem acrescentar conteúdo estranho.
- source_word: וִימִינָהּ
  choice: e a mão direita
  rationale: Mantém o paralelismo anatômico e poético do hebraico.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: para o martelo dos trabalhadores
  rationale: Preserva a construção incomum e a referência a um instrumento de impacto, sem restringi-lo indevidamente a uma forma específica.
- source_word: וְהָלְמָה
  choice: Golpeou
  rationale: Expressa diretamente o golpe violento e mantém a progressão poética.
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: esmagou-lhe a cabeça
  rationale: Comunica a ideia forte de esmagar ou destroçar, com construção idiomática em português.
- source_word: וּמָחֲצָה
  choice: despedaçou
  rationale: Usa um segundo verbo vigoroso para conservar o acúmulo poético de ações violentas.
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: atravessou-lhe a têmpora
  rationale: Conserva o sentido básico de passar ou atravessar e identifica naturalmente a lateral da cabeça.
