  text: אָ֥ז הָלְמ֖וּ עִקְּבֵי ס֑וּס מִֽ/דַּהֲר֖וֹת דַּהֲר֥וֹת אַבִּירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: pt
  text: 'Então os cascos dos cavalos martelaram,

    por causa do galope, do galope dos seus valentes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa das disparadas, das disparadas dos seus garanhões” ou “por causa das investidas, das investidas dos seus valentes guerreiros”. A expressão hebraica pode referir-se a cavalos poderosos ou aos guerreiros ligados a eles.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca o momento seguinte na sequência vívida do cântico e soa natural em português.
- source_word: הָלְמוּ
  choice: martelaram
  rationale: Expressa as batidas fortes e repetidas dos cascos, preservando a força sonora e cinética do verbo.
- source_word: עִקְּבֵי סוּס
  choice: os cascos dos cavalos
  rationale: Embora עִקְּבֵי possa significar literalmente 'calcanhares', no contexto equino refere-se aos cascos; o singular סוּס tem sentido coletivo.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: com o galope, o galope
  rationale: A preposição מִן indica causa ou fonte; 'com' comunica naturalmente o vínculo entre o galope e as batidas. A repetição é mantida como intensificação poética.
- source_word: אַבִּירָיו
  choice: dos seus valentes
  rationale: A expressão significa literalmente 'seus fortes/valentes' e pode evocar tanto cavalos poderosos quanto os guerreiros ligados a eles; a formulação conserva essa ambiguidade.
theological_decisions:
- issue: Referente do sufixo masculino singular em אַבִּירָיו e identidade dos 'valentes'
  choice: dos seus valentes
  alternative: dos seus garanhões; dos seus poderosos cavalos; dos seus valentes guerreiros
  rationale: O contexto imediato é equino, mas o substantivo pode designar seres poderosos, inclusive guerreiros. A tradução não identifica de modo categórico nem os cavalos nem os cavaleiros e deixa também implícito o referente do pronome, como no hebraico.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e compreensão internacional. A quebra de linha reforça o paralelismo e a repetição enfática do hebraico.
