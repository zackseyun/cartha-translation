  naturalness: A redação é moderna e clara. “Locais onde se tira água” é natural e suficientemente preciso; “entre” melhora tanto a correspondência ao original quanto o fluxo da frase. “Portas da cidade” é compreensível, embora “portas” baste no texto e a nota cultural explique o referente.
  terminology: “Yahweh” reproduz corretamente o nome divino. “Atos de justiça” mantém a amplitude de צִדְקוֹת. “Aldeões” é uma opção possível para o termo difícil פִּרְזוֹן, desde que a nota conserve as alternativas e a incerteza quanto à relação genitiva.
