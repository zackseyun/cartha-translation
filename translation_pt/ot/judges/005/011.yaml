source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: pt
  text: Ao som dos arqueiros, entre os locais onde se tira água[a], ali eles narram os atos de justiça de Yahweh, os atos de justiça dos seus aldeões em Israel[b]. Então o povo de Yahweh desceu às portas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão inicial é difícil. Também pode ser entendida como “do som dos arqueiros” ou, segundo outra interpretação, “longe do som dos arqueiros”.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico traduzido como “aldeões” é difícil e também pode indicar “habitantes do campo”, “povoados sem muralhas” ou, com menor probabilidade, “governantes”. A relação da expressão com “atos de justiça” também pode ser entendida como atos realizados em favor deles.
    reason: lexical_alternative
  - marker: c
    text: As portas eram lugares públicos de reunião de uma cidade, associados à vida cívica, aos julgamentos e à segurança.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: Em meio ao som dos arqueiros
  rationale: A expressão poética é difícil. “Arqueiros” representa a compreensão contextual mais comum de מְחַצְצִים, e “em meio ao som” exprime a relação introduzida por מִן sem impor a leitura mais interpretativa “longe do som”. A ambiguidade é registrada em nota.
- source_word: בֵּין מַשְׁאַבִּים
  choice: junto aos lugares onde se tira água
  rationale: מַשְׁאַבִּים designa locais de tirar água, como poços ou bebedouros. A formulação é clara em português e conserva o cenário comunitário.
- source_word: יְתַנּוּ
  choice: eles narram
  rationale: O Piel indica recitar ou contar em voz alta. “Narram” preserva a ideia de proclamação comemorativa sem determinar que se trate necessariamente de canto.
- source_word: צִדְקוֹת יְהוָה
  choice: os atos de justiça de Yahweh
  rationale: O plural צִדְקוֹת aponta aqui para atos concretos que manifestam justiça e fidelidade, não apenas para uma qualidade abstrata. A tradução evita restringir o sentido a “vitórias” ou “atos salvadores”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando o nome pessoal presente no texto hebraico.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: os atos de justiça dos seus aldeões
  rationale: פִּרְזוֹן é raro e discutido; a forma relacionada em Juízes 5:7 favorece referência à vida aldeã ou à população rural. A construção portuguesa mantém a relação genitiva do hebraico, e outras possibilidades são registradas em nota.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: Então ... desceu às portas da cidade
  rationale: אָז introduz a consequência temporal e יָרְדוּ conserva o movimento de descer. “Da cidade” explicita o referente normal das portas nesse contexto sem explicar no corpo do verso sua função cívica.
- source_word: עַם יְהוָה
  choice: o povo de Yahweh
  rationale: A expressão mantém de forma direta a identificação pactual do povo pelo nome divino.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido de צִדְקוֹת no cântico de vitória
  choice: atos de justiça
  alternative: atos salvadores; vitórias
  rationale: A escolha conserva a amplitude lexical do termo, permitindo que o contexto indique seu aspecto libertador sem reduzi-lo exclusivamente a salvação militar.
- issue: Relação em צִדְקֹת פִּרְזֹנוֹ
  choice: atos de justiça dos seus aldeões
  alternative: atos de justiça em favor dos seus aldeões; atos de justiça nas suas aldeias
  rationale: O hebraico é conciso e admite mais de uma compreensão da relação genitiva. A tradução principal mantém sua forma sem decidir silenciosamente se os aldeões praticam, recebem ou testemunham esses atos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com escolha lexical natural para leitores brasileiros. A ordem poética foi suavizada apenas o necessário para a clareza, e as dificuldades do primeiro hemistíquio e de פִּרְזוֹן foram preservadas em notas.
