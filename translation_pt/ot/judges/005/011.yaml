revisions:
- from: Em meio ao som dos arqueiros, junto aos lugares onde se tira água[a], ali eles narram os atos de justiça de Yahweh, os atos de justiça dos seus aldeões em Israel[b]. Então o povo de Yahweh desceu às portas da cidade[c].
  to: Ao som dos arqueiros, entre os locais onde se tira água[a], ali eles narram os atos de justiça de Yahweh, os atos de justiça dos seus aldeões em Israel[b]. Então o povo de Yahweh desceu às portas[c].
  rationale: A revisão elimina a relação espacial indevida criada por “em meio a” e torna “entre” correspondente a בֵּין. Conserva-se “ao som” como solução legível para a abertura difícil, sem ocultar na nota a leitura separativa. A tradução não resolve além do necessário a ambiguidade de פִּרְזוֹן nem a relação genitiva em “atos de justiça dos seus aldeões”.
