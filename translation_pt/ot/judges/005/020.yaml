  text: מִן שָׁמַ֖יִם נִלְחָ֑מוּ הַ/כּֽוֹכָבִים֙ מִ/מְּסִלּוֹתָ֔/ם נִלְחֲמ֖וּ עִם סִיסְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: pt
  text: Dos céus, as estrelas lutaram; de suas trajetórias[a], lutaram contra Sísera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de seus caminhos” ou “de suas veredas”; o termo hebraico pode designar estradas ou percursos, aqui os caminhos das estrelas no céu.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “com Sísera”; em contextos de combate, essa expressão pode significar “contra Sísera”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: Desde os céus
  rationale: Mantém o plural formal de שָׁמַיִם e expressa naturalmente o ponto de origem da ação no paralelismo poético.
- source_word: נִלְחָמוּ
  choice: lutaram
  rationale: Traduz diretamente o nifal de לחם e preserva a repetição poética do verbo nas duas linhas.
- source_word: הַכּוֹכָבִים
  choice: as estrelas
  rationale: Sentido direto do substantivo com artigo definido, sem interpretar além da imagem poética.
- source_word: מִמְּסִלּוֹתָם
  choice: desde as suas trajetórias
  rationale: מְסִלּוֹת pode designar estradas ou caminhos; aplicado às estrelas, “trajetórias” comunica seus percursos celestes sem tornar a imagem excessivamente técnica.
- source_word: עִם סִיסְרָא
  choice: contra Sísera
  rationale: Embora עִם costume significar “com”, junto a לחם em contexto bélico indica o adversário; “contra” comunica com clareza essa relação.
theological_decisions:
- issue: Natureza da participação das estrelas na batalha
  choice: Conservar a afirmação poética de que as estrelas lutaram
  alternative: Explicá-la como intervenção cósmica literal, seres celestiais ou forças naturais dirigidas pela providência
  rationale: O cântico não especifica o mecanismo. A formulação mantém a imagem e sua tensão teológica sem impor uma interpretação particular.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. O plural “céus” acompanha a forma hebraica, e a repetição de “lutaram” preserva o paralelismo do cântico.
