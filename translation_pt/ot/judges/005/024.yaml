base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: pt
  text: A mais abençoada entre as mulheres é Jael[a], esposa de Héber, o queneu; entre as mulheres na tenda[b], ela é a mais abençoada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Abençoada mais do que as mulheres é Jael… mais do que as mulheres na tenda”. A construção comparativa hebraica pode ser traduzida por “entre” ou por “mais do que”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na tenda”. A expressão pode evocar mulheres associadas à vida em tenda, embora o hebraico empregue o singular.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: a mais abençoada
  rationale: O pual de ברך indica que Jael é abençoada ou exaltada. Em combinação com מִן, a formulação portuguesa com superlativo comunica naturalmente a comparação e preserva o tom elevado do cântico.
- source_word: מִנָּשִׁים
  choice: entre as mulheres
  rationale: A preposição מִן introduz aqui uma comparação que pode ser entendida como “entre” ou “mais do que”. “Entre as mulheres” é natural em português e mantém o sentido superlativo sem eliminar a alternativa comparativa.
- source_word: יָעֵל
  choice: Jael
  rationale: Transliteração tradicional e amplamente reconhecida em português do nome hebraico.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: mulher de Héber, o queneu
  rationale: Reproduz a cadeia construta que identifica Jael por sua relação com Héber e pela afiliação dele aos queneus. “Mulher de” é uma maneira bíblica, clara e corrente de dizer “esposa de” neste contexto.
- source_word: בָּאֹהֶל
  choice: que vivem em tendas
  rationale: Embora o hebraico diga literalmente “na tenda”, a expressão caracteriza provavelmente as mulheres associadas à vida em tendas. A tradução explicita essa referência cultural, enquanto a nota preserva a forma singular do original.
- source_word: תְּבֹרָךְ
  choice: ela é a mais abençoada
  rationale: A repetição do verbo hebraico reforça poeticamente a declaração inicial. A retomada com “ela” mantém a ênfase e produz uma cadência natural em português.
