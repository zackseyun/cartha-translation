  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: pt
  text: De Efraim, os que tinham raiz em Amaleque[a]; depois de você, Benjamim, entre os seus povos[b]. De Maquir[c] desceram comandantes[d], e de Zebulom, os que empunham o bastão do escriba[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua raiz estava contra Amaleque” ou “sua raiz estava na região montanhosa de Amaleque”. A linha hebraica é difícil e provavelmente emprega linguagem poético-geográfica.
    reason: alternative_reading
  - marker: b
    text: Ou “Benjamim seguiu você, entre os seus clãs/parentes”. “Entre os seus povos” traduz de perto uma expressão hebraica incomum.
    reason: lexical_alternative
  - marker: c
    text: “Maquir” era o principal clã de Manassés; algumas traduções empregam aqui o nome mais amplo da tribo, “Manassés”.
    reason: cultural_note
  - marker: d
    text: Ou “governantes” ou “legisladores”. O termo hebraico pode designar os que governam ou promulgam decretos.
    reason: lexical_alternative
  - marker: e
    text: Ou “os que manejam o bastão do escriba” ou “os que portam o bastão do oficial”. A expressão hebraica é rara e pode referir-se à convocação militar ou ao registro de tropas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: De Efraim
  rationale: A preposição indica origem; a forma concisa mantém a enumeração poética das tribos.
- source_word: שָׁרְשָׁם
  choice: os que tinham raízes
  rationale: Preserva a metáfora hebraica da raiz e expressa naturalmente em português a referência plural implícita no contexto.
- source_word: בַּעֲמָלֵק
  choice: em Amaleque
  rationale: A leitura locativa é a mais direta, embora a linha permaneça difícil; a nota registra outras possibilidades.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: depois de você, Benjamim
  rationale: Mantém a formulação poética breve e não acrescenta um verbo ausente do hebraico.
- source_word: בַּעֲמָמֶיךָ
  choice: entre os seus povos
  rationale: Reproduz de perto a expressão hebraica incomum, deixando para a nota as alternativas interpretativas.
- source_word: מִנִּי מָכִיר
  choice: De Maquir
  rationale: Conserva o nome empregado no hebraico, sem substituí-lo pela designação tribal mais ampla, Manassés.
- source_word: יָרְדוּ
  choice: desceram
  rationale: Traduz diretamente o verbo de movimento e se ajusta ao registro poético.
- source_word: מְחֹקְקִים
  choice: comandantes
  rationale: No contexto de mobilização militar, designa com naturalidade pessoas investidas de autoridade, sem excluir o sentido de governantes ou legisladores indicado em nota.
- source_word: וּמִזְּבוּלֻן
  choice: e de Zebulom
  rationale: Mantém a indicação de origem e o paralelismo da lista tribal.
- source_word: מֹשְׁכִים
  choice: os que empunham
  rationale: Expressa em português natural o manejo ativo do objeto, embora o particípio possa significar literalmente puxar ou portar.
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: o bastão do escriba
  rationale: Preserva a imagem rara e ambígua do hebraico, evitando decidir se o objeto servia especificamente ao registro ou à convocação militar.
