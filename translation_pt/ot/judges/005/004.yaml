id: JDG.5.4
reference: Judges 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: pt
  text: 'Yahweh, quando saíste de Seir,

    quando marchaste desde o campo de Edom[a],

    a terra estremeceu[b];

    os céus também gotejaram,

    as nuvens também gotejaram água.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o território de Edom”. O hebraico diz literalmente “desde o campo de Edom”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a terra se abalou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando sua função como nome próprio e a forma de tratamento direto no poema.
- source_word: בְּצֵאתְךָ
  choice: quando saíste
  rationale: A preposição בְּ com o infinitivo construto e o sufixo de segunda pessoa tem valor temporal; esta forma é natural em português e mantém o discurso dirigido a Yahweh.
- source_word: מִשֵּׂעִיר
  choice: de Seir
  rationale: Mantém o topônimo Seir e traduz diretamente a preposição de origem מִן.
- source_word: בְּצַעְדְּךָ
  choice: quando marchaste
  rationale: צעד descreve o ato de dar passos ou marchar; “marchaste” comunica o avanço deliberado da manifestação divina no contexto poético.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: desde o campo de Edom
  rationale: Preserva a imagem concreta de שָׂדֶה, “campo” ou “campo aberto”, sem excluir por nota o sentido mais amplo de território.
- source_word: אֶרֶץ רָעָשָׁה
  choice: a terra estremeceu
  rationale: Em paralelo com céus e nuvens, אֶרֶץ é entendido em sentido cósmico como “terra”; רָעַשׁ indica forte tremor ou abalo.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: os céus também gotejaram
  rationale: Mantém tanto o valor aditivo de גַּם quanto a imagem específica de נָטַף, “gotejar”, preparando a menção explícita da água no verso seguinte.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: as nuvens também gotejaram água
  rationale: Conserva a repetição poética de נָטַף e traduz o objeto explícito מָיִם, sem intensificar o verbo para “derramaram”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama como nome próprio; “Yahweh” o representa por transliteração sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com disposição em linhas para refletir o paralelismo poético. A repetição de “também” e “gotejaram” foi mantida por corresponder à estrutura enfática do hebraico. Os marcadores foram posicionados junto às expressões a que suas notas realmente se referem.
