- from: Zebulom foi um povo que arriscou a vida até a morte[a], e Naftali também, nas alturas do campo.[b]
  to: Zebulom foi um povo que desprezou a própria vida até a morte[a], e Naftali também, nas alturas do campo[b].
  rationale: A revisão restitui na tradução principal a força lexical de חֵרֵף (“desprezou”), preservando em nota a interpretação contextual “arriscou”. Também explicita a referência reflexiva da vida e normaliza a posição do marcador da nota b.
