base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: pt
  text: Zebulom foi um povo que desprezou a própria vida até a morte[a], e Naftali também, nas alturas do campo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arriscou a própria vida até a morte”. O hebraico usa o singular coletivo para Zebulom e um verbo que indica tratar algo com desprezo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nas alturas do campo aberto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: Zebulom
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome da tribo.
- source_word: עַם
  choice: um povo
  rationale: Preserva a expressão nominal coletiva do hebraico, em construção predicativa.
- source_word: חֵרֵף נַפְשׁוֹ
  choice: arriscou a vida
  rationale: No contexto de combate, comunica naturalmente que o povo tratou a própria vida como algo que podia ser desprezado ou posto em perigo; a nota preserva o sentido mais literal de desprezo.
- source_word: לָמוּת
  choice: até a morte
  rationale: Expressa o limite extremo ou resultado potencial do risco assumido, sem sugerir necessariamente que todos morreram.
- source_word: וְנַפְתָּלִי
  choice: e Naftali também
  rationale: O acréscimo de 'também' explicita em português o paralelismo elíptico pelo qual Naftali participa do mesmo elogio.
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: nas alturas do campo
  rationale: Mantém a imagem topográfica do texto e evita interpretar שׂדה especificamente como 'campo de batalha'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe conserva o paralelismo poético e a expressão coletiva do hebraico; as notas registram tanto a força literal de חֵרֵף quanto a amplitude de שָׂדֶה.
