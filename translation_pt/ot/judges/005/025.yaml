lexical_decisions:
- source_word: מַיִם
  choice: água
  rationale: É o sentido básico do termo e preserva o contraste entre o que Sísera pediu e o que Jael lhe deu.
- source_word: שָׁאַל
  choice: pediu
  rationale: O qal perfeito indica que ele pediu ou solicitou algo; “pediu” é natural e direto em português.
- source_word: חָלָב
  choice: leite
  rationale: É o sentido lexical usual e mantém o contraste com a água pedida.
- source_word: נָתָנָה
  choice: ela lhe deu
  rationale: A forma verbal feminina aponta para Jael; o pronome indireto explicita naturalmente em português o destinatário indicado pelo contexto.
- source_word: בְּסֵפֶל
  choice: numa tigela
  rationale: סֵפֶל designa um recipiente semelhante a uma tigela ou bacia; “tigela” é claro e natural no contexto de servir uma bebida ou alimento.
- source_word: אַדִּירִים
  choice: digna de nobres
  rationale: O plural pode designar nobres, poderosos ou pessoas majestosas. A expressão comunica que o recipiente era apropriado a pessoas de alta posição, sem eliminar a leitura mais literal “tigela de nobres”, registrada em nota.
- source_word: הִקְרִיבָה
  choice: ela lhe trouxe
  rationale: O hifil de קרב significa fazer chegar perto ou aproximar. Neste contexto de hospitalidade, “trouxe” expressa o ato com naturalidade e evita uma possível conotação cultual de “ofereceu”.
- source_word: חֶמְאָה
  choice: coalhada
  rationale: O termo pode indicar leite coalhado, nata, creme ou manteiga. “Coalhada” representa de modo compreensível um produto lácteo espesso, enquanto a incerteza lexical é preservada em nota.
