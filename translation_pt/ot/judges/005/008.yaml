base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: pt
  text: Escolheram novos deuses[a]; então houve guerra às portas[b]. Via-se algum escudo ou alguma lança entre os quarenta mil de Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Ele escolheu novos deuses” ou “alguém escolheu novos deuses”. O verbo hebraico está na terceira pessoa do singular, mas geralmente é entendido num sentido coletivo, referente a Israel.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico desta linha é difícil. Outra tradução possível é: “então houve combate às portas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: Escolheram
  rationale: Embora o verbo hebraico esteja morfologicamente na terceira pessoa do singular, o contexto favorece um sujeito humano indefinido ou coletivo, referente ao povo de Israel. O plural torna esse sentido natural em português, enquanto a nota preserva a forma singular do hebraico.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: novos deuses
  rationale: Neste contexto, a expressão designa divindades estrangeiras, em contraste com o Deus de Israel. “Novos deuses” preserva de modo claro a força crítica da frase.
- source_word: אָז
  choice: então
  rationale: O advérbio estabelece a sequência entre a escolha de outros deuses e a crise que se seguiu.
- source_word: לָחֶם שְׁעָרִים
  choice: houve guerra às portas
  rationale: 'A expressão hebraica é condensada e difícil. Entender לָחֶם como “guerra/batalha” produz um sentido coerente: o conflito chegou às portas das cidades. A formulação portuguesa é clara sem ocultar a incerteza, registrada em nota.'
- source_word: מָגֵן
  choice: escudo
  rationale: Equivalente português direto e corrente para o termo militar.
- source_word: אִם יֵרָאֶה
  choice: Via-se algum... ?
  rationale: A construção tem força interrogativa e retórica, destacando a ausência de armas. “Via-se algum” soa natural em português e não exige acrescentar uma negação inexistente no texto.
- source_word: וָרֹמַח
  choice: ou lança
  rationale: “Lança” é o equivalente moderno mais claro para a arma indicada; “ou” exprime naturalmente a coordenação na pergunta retórica.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: entre os quarenta mil
  rationale: A preposição indica o grupo no qual se procurariam as armas. O artigo definido produz português natural e apresenta os quarenta mil como o contingente de Israel mencionado no verso.
- source_word: בְּיִשְׂרָאֵל
  choice: de Israel
  rationale: Ligado a “os quarenta mil”, o complemento “de Israel” identifica naturalmente o grupo e evita a sequência menos fluida “entre quarenta mil em Israel”.
theological_decisions:
- issue: Sujeito do verbo inicial
  choice: 'O povo de Israel como sujeito coletivo implícito: “Escolheram novos deuses”.'
  alternative: “Ele escolheu novos deuses” ou “Deus escolheu coisas novas”.
  rationale: Apesar da forma verbal singular, o contexto acusa a infidelidade de Israel e relaciona essa escolha à opressão subsequente. Tomar Deus como sujeito de “novos deuses” seria contextualmente improvável. A nota mantém transparente a tensão gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe poética permanece concisa. As duas notas registram as ambiguidades reais do hebraico sem sobrecarregar o texto principal.
