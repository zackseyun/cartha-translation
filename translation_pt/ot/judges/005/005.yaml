id: JDG.5.5
reference: Judges 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: pt
  text: Os montes escorreram[a] diante de Yahweh[b]; este Sinai, diante de Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ser entendido como “fluíram” ou, interpretando a imagem, “derreteram-se”; algumas traduções trazem “tremeram”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “de diante da face — ou da presença — de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: os montes
  rationale: O artigo definido hebraico é preservado, e “montes” é a equivalência comum e adequada à imagem da manifestação divina no Sinai.
- source_word: נָזְלוּ
  choice: escorreram
  rationale: O verbo נזל descreve algo que corre, flui ou goteja. “Escorreram” conserva a imagem poética concreta, sem substituí-la diretamente pelas interpretações “derreteram” ou “tremeram”.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: A expressão significa literalmente “de diante da face/presença de”. “Diante de” comunica essa ideia de modo natural em português, enquanto a formulação mais plena é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: זֶה סִינַי
  choice: este Sinai
  rationale: Mantém o demonstrativo abrupto e enfático da poesia hebraica sem acrescentar “monte”, ausente nesta expressão do texto-fonte.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: A expressão identifica Yahweh como o Deus de Israel; o artigo produz uma formulação natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no corpo do texto, sem convertê-lo em um título.
- issue: Imagem poética de נָזְלוּ na manifestação divina
  choice: os montes escorreram
  alternative: os montes se derreteram; os montes tremeram
  rationale: “Escorreram” mantém o campo lexical do verbo e a estranheza expressiva da imagem. “Derreteram” explica a provável imagem, enquanto “tremeram” descreve o cenário geral, mas não o sentido lexical direto.
- issue: Construção elíptica זֶה סִינַי
  choice: este Sinai, diante de Yahweh
  alternative: até o Sinai, diante de Yahweh; este monte Sinai, diante de Yahweh
  rationale: A formulação conserva a elipse e a força demonstrativa do hebraico, sem resolver silenciosamente a relação sintática nem acrescentar “monte”.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação conserva o paralelismo e a elipse da poesia hebraica. A expressão incomum “os montes escorreram” é deliberada para preservar a imagem do original; as interpretações mais usuais são oferecidas em nota.
