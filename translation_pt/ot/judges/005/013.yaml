reference: Judges 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: pt
  text: Então o remanescente desceu contra os nobres[a]; o povo de Yahweh desceu por mim[b] contra os poderosos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Então um sobrevivente desceu até os nobres». O hebraico deste verso poético é difícil; as preposições também podem ter sentido não hostil, como «a», «para» ou «com».'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: «por mim»; provavelmente uma autorreferência poética de Débora.'
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a progressão temporal e poética do cântico de forma concisa e natural.
- source_word: יְרַד / יְרַד
  choice: desceu
  rationale: Preserva o sentido básico e a repetição do verbo hebraico nos dois membros do verso; a forma poética e a sintaxe são incomuns.
- source_word: שָׂרִיד
  choice: o remanescente
  rationale: O substantivo pode indicar coletivamente o grupo que restou, embora também admita o singular individual «um sobrevivente».
- source_word: לְאַדִּירִים
  choice: contra os nobres
  rationale: אַדִּירִים designa pessoas eminentes ou poderosas. No contexto bélico, לְ foi entendido em sentido hostil, mas a nota conserva as possibilidades «aos» e «para os».
- source_word: עָם יְהוָה
  choice: o povo de Yahweh
  rationale: Expressa de modo direto que o povo pertence a Yahweh e mantém o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: לִי
  choice: por mim
  rationale: Traduz diretamente o sufixo de primeira pessoa e permite entendê-lo como autorreferência poética de Débora, sem tornar explícita essa identificação no corpo do texto.
- source_word: בַּגִּבּוֹרִים
  choice: contra os poderosos
  rationale: גִּבּוֹרִים pode designar homens fortes, valentes ou guerreiros. «Poderosos» mantém a amplitude lexical, e «contra» reflete a leitura hostil favorecida pelo contexto de batalha.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o Tetragrama como nome próprio; «Yahweh» preserva essa função e evita substituí-lo por um título.
- issue: Valor das preposições nos dois membros poéticos
  choice: 'Sentido hostil: «contra os nobres» e «contra os poderosos»'
  alternative: 'Sentido direcional, benefactivo ou associativo: «aos/para os nobres» e «entre/com os poderosos»'
  rationale: O contexto militar do cântico e o paralelismo favorecem a leitura hostil, mas o hebraico não elimina as demais possibilidades; por isso, a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo e repetição verbal preservados. «Remanescente», «nobres» e «poderosos» mantêm o tom elevado do cântico sem arcaísmo excessivo; as notas preservam a incerteza real da sintaxe hebraica.
