base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: pt
  text: 'A torrente de Quisom os arrastou,

    a torrente antiga[a], a torrente de Quisom.

    Marcha, minha alma[b], com força!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a torrente de outrora” ou “a torrente primeva”. O hebraico קְדוּמִים pode indicar antiguidade; também pode funcionar aqui como uma descrição poética intensificada, não apenas como referência cronológica.
    reason: lexical_alternative
  - marker: b
    text: Ou “Pisa, minha alma, com força” ou “Calca, minha alma, com poder”. O hebraico é conciso e poético, e o verbo pode sugerir pisar ou calcar, além de marchar ou avançar.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: torrente
  rationale: No contexto poético da batalha, נַחַל designa o curso de água em cheia que subjuga o inimigo; “torrente” comunica sua força melhor que “riacho” ou “rio”.
- source_word: קִישׁוֹן
  choice: Quisom
  rationale: Adota a forma portuguesa tradicional e amplamente reconhecível do nome próprio do curso de água.
- source_word: גְּרָפָם
  choice: os arrastou
  rationale: O verbo גרף descreve levar ou varrer pela força das águas. “Os arrastou” é natural em português e preserva a imagem hidráulica violenta.
- source_word: נַחַל קְדוּמִים
  choice: a torrente antiga
  rationale: קְדוּמִים remete a tempos antigos ou à antiguidade; a expressão mantém a aposição poética sem introduzir conotações míticas não exigidas pelo texto.
- source_word: תִּדְרְכִי
  choice: Avante
  rationale: A forma feminina singular de דרך dirige-se à alma da cantora e sugere pisar, marchar ou avançar. “Avante” exprime de modo conciso e poético a autoexortação, preservando em nota a imagem literal.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Na apóstrofe poética, “minha alma” preserva o autoendereçamento e a força retórica de נַפְשִׁי, em vez de reduzi-lo simplesmente a “eu”.
- source_word: עֹז
  choice: com força
  rationale: עֹז significa força ou poder; “com força” oferece uma leitura adverbial clara para a sintaxe hebraica condensada.
