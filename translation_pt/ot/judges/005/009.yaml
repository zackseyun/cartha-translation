id: JDG.5.9
reference: Judges 5:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: pt
  text: Meu coração está com os líderes de Israel,[a] que se ofereceram voluntariamente entre o povo. Bendigam Yahweh!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu coração está com os legisladores de Israel, os que se ofereceram voluntariamente entre o povo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: Meu coração
  rationale: Preserva a imagem hebraica do coração como expressão de lealdade e admiração; a relação indicada por לְ é completada naturalmente por “está com” em português.
- source_word: לְחוֹקְקֵי
  choice: está com os líderes
  rationale: O termo derivado de חקק pode designar os que decretam ou exercem autoridade. “Líderes” comunica com clareza a responsabilidade de governo ou comando sem restringi-la à legislação moderna.
- source_word: יִשְׂרָאֵל
  choice: de Israel
  rationale: Expressa naturalmente a relação genitiva que identifica esses líderes como pertencentes a Israel.
- source_word: הַמִּתְנַדְּבִים
  choice: que se ofereceram voluntariamente
  rationale: O particípio hitpael de נדב indica disposição espontânea e auto-oferta. A formulação preserva esse valor reflexivo e voluntário.
- source_word: בָּעָם
  choice: entre o povo
  rationale: עם significa normalmente “povo”. “Entre o povo” mantém o sentido social amplo e evita restringir a referência às tropas.
- source_word: בָּרֲכוּ
  choice: Bendigam
  rationale: Imperativo masculino plural de ברך. “Bendigam” preserva a exortação direta dirigida a mais de uma pessoa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal e reflete de modo mais direto sua forma provável, sem substituí-lo por um título.
- issue: Identidade e função de חוֹקְקֵי
  choice: líderes
  alternative: legisladores; governantes; comandantes
  rationale: O contexto celebra os que assumiram voluntariamente responsabilidade no meio de Israel. “Líderes” conserva a amplitude funcional do termo; a alternativa lexical ligada ao ato de decretar é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira e compreensão internacional. “Bendigam” deixa claro o imperativo plural, e “se ofereceram voluntariamente” mantém a força reflexiva do hebraico.
