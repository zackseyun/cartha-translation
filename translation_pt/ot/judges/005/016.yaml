base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: pt
  text: Por que você ficou sentado entre os apriscos, ouvindo os assobios para os rebanhos? Entre as divisões de Rúben houve grandes indagações do coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Junto aos riachos de Rúben houve grandes indagações do coração”. O termo hebraico pode significar “divisões” ou “cursos de água/riachos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Interrogativo direto que introduz a repreensão pela inação de Rúben.
- source_word: יָשַׁבְתָּ
  choice: você ficou sentado
  rationale: Preserva a imagem concreta de permanecer sentado, ao mesmo tempo que expressa naturalmente a permanência no local.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: entre os apriscos
  rationale: A interpretação tradicional como currais ou apriscos se ajusta ao contexto pastoral dos rebanhos; 'entre' conserva a preposição hebraica.
- source_word: לִשְׁמֹעַ שְׁרִקוֹת עֲדָרִים
  choice: ouvindo os assobios para os rebanhos
  rationale: Expressa o som provavelmente usado para chamar ou conduzir os rebanhos, sem especificar indevidamente quem assobia.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: Entre as divisões de Rúben
  rationale: פלגות pode designar divisões, grupos ou cursos de água. 'Divisões' preserva a possível alusão à fragmentação ou hesitação tribal; a alternativa concreta é registrada em nota.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: houve grandes indagações do coração
  rationale: Mantém a metáfora hebraica de exame interior e a intensidade de 'grandes', em linguagem poética compreensível.
