  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
translation:
  language: pt
  text: 'Então, naquele dia, Débora e Baraque, filho de Abinoão, cantaram[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, o verbo está no singular: “Débora cantou”; depois se acrescenta “e Baraque”. Pelo contexto, Débora e Baraque participaram juntos do cântico.'
