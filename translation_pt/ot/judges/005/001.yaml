lexical_decisions:
- source_word: וַתָּשַׁר
  choice: cantaram
  rationale: O verbo שׁיר significa “cantar”. Embora a forma hebraica seja feminina singular e concorde com Débora, Baraque é acrescentado como participante; em português natural, o sujeito composto pede o plural.
- source_word: דְּבוֹרָה
  choice: Débora
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּבָרָק
  choice: e Baraque
  rationale: Reproduz a conjunção e emprega a forma tradicional do nome em português.
- source_word: בֶּן אֲבִינֹעַם
  choice: filho de Abinoão
  rationale: Tradução natural da construção patronímica hebraica, com a forma tradicional do nome em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Preserva a referência temporal específica e soa natural em português narrativo.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz o conteúdo verbal que segue. Em português, após “cantaram”, os dois-pontos introduzem a letra do cântico com mais naturalidade do que o literal “dizendo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa natural. A ordem foi ajustada para “Então, naquele dia” e o quotativo לֵאמֹר foi representado por dois-pontos, evitando a expressão pouco idiomática “cantaram, dizendo”. A nota preserva a singularidade gramatical do hebraico.
