  text: רֹכְבֵי֩ אֲתֹנ֨וֹת צְחֹר֜וֹת יֹשְׁבֵ֧י עַל מִדִּ֛ין וְ/הֹלְכֵ֥י עַל דֶּ֖רֶךְ שִֽׂיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: pt
  text: Vocês que cavalgam jumentas brancas, vocês que se sentam sobre tapetes[a] e vocês que andam pela estrada, falem[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre mantas de sela” ou “sobre tapetes finos”. O termo hebraico é raro e de sentido incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “contem isso” ou “relatem”. O verbo hebraico pode transmitir a ideia de falar abertamente ou narrar.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: vocês que cavalgam
  rationale: O particípio plural em construção funciona como vocativo. A formulação com “vocês” preserva o chamado direto e soa natural em português atual.
- source_word: אֲתֹנוֹת
  choice: jumentas
  rationale: O substantivo designa especificamente jumentas. Como essa precisão é natural em português, foi preservada.
- source_word: צְחֹרוֹת
  choice: brancas
  rationale: O adjetivo indica mais diretamente a cor branca ou clara; “brancas” mantém a imagem distintiva dos animais de montaria.
- source_word: יֹשְׁבֵי
  choice: vocês que se sentam
  rationale: Outro particípio vocativo, paralelo aos demais. O sentido concreto de sentar-se se ajusta ao complemento seguinte.
- source_word: מִדִּין
  choice: tapetes
  rationale: O termo é raro e incerto. No contexto de montaria, assentos e viagem, “tapetes” representa de modo plausível coberturas ou tecidos usados como assento, sem ocultar a incerteza lexical, registrada em nota.
- source_word: וְהֹלְכֵי
  choice: e vocês que andam
  rationale: Mantém o terceiro particípio como vocativo e conserva a imagem concreta de pessoas que seguem a pé ou viajam.
- source_word: דֶּרֶךְ
  choice: pela estrada
  rationale: “Estrada” expressa naturalmente o cenário literal de deslocamento indicado por דֶּרֶךְ.
- source_word: שִׂיחוּ
  choice: falem
  rationale: O imperativo pode indicar falar, discorrer ou contar. “Falem” preserva a amplitude do verbo, enquanto sentidos mais específicos são apresentados em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “vocês que” reproduz a série de vocativos do poema; “falem” concorda com esse tratamento e mantém aberta a extensão semântica do imperativo.
