  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: pt
  text: 'Quando os líderes tomaram a dianteira em Israel,[a]

    quando o povo se ofereceu voluntariamente,

    bendigam o SENHOR!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil. Também pode ser entendida como “quando os cabelos foram soltos em Israel”, talvez como imagem de guerreiros que se apresentaram para a batalha.
    reason: Preserva uma alternativa lexical antiga e genuína para a rara expressão בִּפְרֹעַ פְּרָעוֹת.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: Quando os líderes tomaram a dianteira
  rationale: A expressão poética é rara e discutida. O contexto paralelo de mobilização voluntária favorece a ideia de líderes que assumem a dianteira; a formulação portuguesa mantém a repetição semântica do hebraico de modo natural.
- source_word: בְּהִתְנַדֵּב עָם
  choice: quando o povo se ofereceu voluntariamente
  rationale: O infinitivo reflexivo de נדב descreve o povo apresentando-se de livre vontade para a ação.
- source_word: בָּרֲכוּ יְהוָה
  choice: bendigam o SENHOR
  rationale: O verbo é um imperativo masculino plural, dirigido aos ouvintes. SENHOR segue a convenção portuguesa para o nome divino יהוה.
theological_decisions:
- issue: Identidade e ação expressas por בִּפְרֹעַ פְּרָעוֹת
  choice: líderes que tomaram a dianteira
  alternative: ao soltarem os cabelos / quando as cabeleiras ficaram soltas
  rationale: O paralelismo com a oferta voluntária do povo e o uso verbal relacionado em Juízes 5:9 sustentam a leitura ligada à liderança, mas a imagem concreta e a análise gramatical permanecem incertas; por isso, a alternativa é registrada em nota, sem transformá-la em afirmação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Tomaram a dianteira” evita a rigidez de “lideraram os líderes”, enquanto conserva a ênfase poética. A disposição em três linhas reflete a estrutura do cântico.
