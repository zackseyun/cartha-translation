base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: pt
  text: 'Ouçam[a], ó reis; deem ouvidos, ó governantes!


    Eu, a Yahweh, eu cantarei;

    farei música[b] a Yahweh, o Deus de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega dois imperativos quase paralelos: “ouçam” e “deem ouvidos”, reforçando poeticamente o chamado à atenção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cantarei louvores”. O hebraico usa dois verbos relacionados, mas distintos: “cantar” e “fazer música”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע; é claro, direto e apropriado à convocação poética dirigida aos reis.
- source_word: הַאֲזִינוּ
  choice: deem ouvidos
  rationale: Preserva o paralelismo com שִׁמְעוּ e o tom poético do segundo imperativo, sem reduzir ambos os verbos à mesma expressão.
- source_word: מְלָכִים
  choice: reis
  rationale: Equivalência direta para o substantivo plural que designa monarcas.
- source_word: רֹזְנִים
  choice: governantes
  rationale: O termo designa autoridades ou potentados; “governantes” comunica com clareza seu sentido político amplo.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: Eu, eu
  rationale: A repetição do pronome independente é enfática. A formulação portuguesa mantém essa insistência poética, embora reposicione o complemento para produzir uma frase compreensível.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Com verbos de cantar e fazer música, a preposição ל indica o destinatário ou aquele a quem o cântico é dedicado; “a Yahweh” preserva essa relação.
- source_word: אָשִׁירָה
  choice: cantarei
  rationale: A forma expressa disposição ou determinação; o futuro em português transmite naturalmente a resolução da cantora.
- source_word: אֲזַמֵּר
  choice: farei música
  rationale: Mantém a distinção entre זמר e o verbo anterior, “cantar”, sem acrescentar uma referência instrumental que o texto não explicita.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução transparente da construção que identifica Yahweh como o Deus de Israel.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” representa o nome pessoal da aliança e evita substituí-lo por um título, sem introduzir uma interpretação denominacional.
- issue: Sentido de אֲזַמֵּר
  choice: farei música
  alternative: cantarei louvores
  rationale: “Farei música” preserva a distinção lexical em relação a אָשִׁירָה e não explicita “louvor” além do que o verbo, neste contexto, pode implicar.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. “Deem ouvidos” conserva o paralelismo elevado sem recorrer a linguagem arcaica. A repetição “Eu, eu” reproduz a ênfase do hebraico; a quebra de linha ajuda a torná-la deliberada e inteligível.
