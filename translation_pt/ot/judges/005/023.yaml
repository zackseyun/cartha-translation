  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: pt
  text: “Amaldiçoem Meroz”, disse o anjo[a] de Yahweh; “amaldiçoem severamente os seus habitantes, porque não vieram em auxílio de Yahweh, em auxílio de Yahweh contra os poderosos.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em auxílio de Yahweh... entre os poderosos”. A frase final também pode ser entendida como “contra os poderosos” ou “com os poderosos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: amaldiçoem / amaldiçoem, sim, amaldiçoem completamente
  rationale: O imperativo repetido de ארר expressa uma forte imprecação. A combinação do imperativo com o infinitivo absoluto intensifica a segunda ordem; a formulação portuguesa conserva tanto a repetição quanto a ênfase.
- source_word: מֵר֗וֹז
  choice: Meroz
  rationale: Nome próprio transliterado; embora provavelmente designe um lugar, o texto apenas o nomeia.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar tanto “anjo” quanto “mensageiro”. “Anjo de Yahweh” é a expressão bíblica mais reconhecível, enquanto a nota preserva a alternativa lexical.
- source_word: יֹשְׁבֶ֑י/הָ
  choice: os seus habitantes
  rationale: O particípio em construção com sufixo feminino singular refere-se coletivamente aos moradores de Meroz.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: porque não vieram
  rationale: כִּי introduz aqui a razão da maldição; “porque” comunica diretamente essa relação causal.
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: em auxílio de Yahweh
  rationale: Mantém a construção nominal e sua repetição retórica em português natural, sem reduzi-la simplesmente a “ajudar Yahweh”.
- source_word: בַּ/גִּבּוֹרִֽים
  choice: contra os guerreiros poderosos
  rationale: No contexto da batalha, entende-se ב como marcando oposição. Como a sintaxe admite outras relações, a nota registra literalmente “entre os poderosos” e a possibilidade “com os guerreiros poderosos”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: A tradução não define se a figura é um ser celestial, um mensageiro humano ou uma manifestação especial; a ambiguidade lexical relevante é indicada em nota.
- issue: Relação expressa por בַּגִּבּוֹרִים
  choice: contra os guerreiros poderosos
  alternative: entre os poderosos; com os guerreiros poderosos
  rationale: “Contra” se ajusta bem ao cenário bélico, mas a preposição hebraica é sintaticamente difícil; por isso, as demais leituras plausíveis permanecem explícitas na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta realça a forma poética. A repetição enfática do hebraico foi preservada, e as ambiguidades de מַלְאָךְ e בַּגִּבּוֹרִים foram mantidas por meio de notas.
