base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: pt
  text: '“Desperte, desperte, Débora!

    Desperte, desperte, entoe um cântico![a]

    Levante-se, Baraque!

    Leve cativos os seus cativos,[b]

    filho de Abinoão!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fale um cântico”. O verbo hebraico é “falar”, não o verbo habitual para “cantar”; a expressão pode conservar deliberadamente a força poética da convocação.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “leve cativo o seu cativeiro” ou “leve cativos os seus cativos”. A expressão hebraica descreve o triunfo sobre os inimigos, levando-os como prisioneiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Desperte
  rationale: O imperativo feminino singular, repetido quatro vezes, convoca Débora com urgência. “Desperte” conserva tanto a imagem quanto a força poética da repetição.
- source_word: דְּבוֹרָה
  choice: Débora
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: דַּבְּרִי שִׁיר
  choice: entoe um cântico
  rationale: Embora דַּבְּרִי signifique literalmente “fale”, a expressão poética convoca Débora a produzir o cântico. “Entoe um cântico” soa natural em português sem ocultar a formulação incomum, registrada em nota.
- source_word: קוּם
  choice: Levante-se
  rationale: Imperativo masculino singular dirigido a Baraque; transmite adequadamente a convocação enérgica em contexto de vitória militar.
- source_word: בָּרָק
  choice: Baraque
  rationale: Forma portuguesa tradicional e claramente reconhecível do nome próprio.
- source_word: וּשֲׁבֵה שֶׁבְיְךָ
  choice: Leve cativos os seus prisioneiros
  rationale: Preserva o sentido militar do verbo שבה e o substantivo cognato שֶׁבִי, mantendo em português parte da repetição enfática sem produzir uma frase obscura.
- source_word: בֶּן אֲבִינֹעַם
  choice: filho de Abinoão
  rationale: Mantém formalmente a identificação patronímica e emprega a forma portuguesa tradicional do nome.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura fluente, com paralelismo em linhas para evidenciar a forma poética. As quatro ocorrências de “Desperte” e os imperativos dirigidos separadamente a Débora e Baraque foram preservados. As notas registram as duas formulações hebraicas incomuns sem sobrecarregar o texto principal.
