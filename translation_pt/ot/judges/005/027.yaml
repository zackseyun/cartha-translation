  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: pt
  text: Entre os pés dela ele desabou[a], caiu, jazeu; entre os pés dela desabou, caiu[b]; onde desabou, ali caiu — destruído[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos pés dela”. O hebraico diz mais literalmente “entre os pés dela”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete uma sequência de verbos curtos (“desabou, caiu, jazeu ... desabou, caiu”) para dar ênfase poética.
    reason: cultural_note
  - marker: c
    text: 'Ou: “devastado”, “aniquilado” ou “morto violentamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: entre os pés dela
  rationale: Reproduz literalmente a imagem espacial e sua repetição. “Aos pés dela” é uma alternativa idiomática, mas torna a expressão menos concreta; “entre as pernas dela” seria mais anatomicamente explícito do que o hebraico exige.
- source_word: כָּרַע
  choice: desabou
  rationale: No contexto da morte de Sísera, comunica o movimento de ceder e ir ao chão sem sugerir reverência voluntária, como poderia ocorrer com “curvou-se”, nem postura deliberada, como em “ajoelhou-se”.
- source_word: נָפַל
  choice: caiu
  rationale: Equivalente direto e natural, repetido sem variação para conservar o ritmo e a intensificação do poema.
- source_word: שָׁכָב
  choice: ficou estendido
  rationale: Expressa o estado resultante de jazer no chão e mantém clara, em português atual, a sequência abrupta dos verbos.
- source_word: בַּאֲשֶׁר
  choice: onde
  rationale: A preposição unida ao relativo tem aqui valor locativo; “onde” é a forma portuguesa mais concisa e natural.
- source_word: שָׁם
  choice: ali
  rationale: Preserva a correspondência enfática “onde... ali” no último membro poético.
- source_word: שָׁדוּד
  choice: aniquilado
  rationale: O particípio descreve Sísera como arruinado ou totalmente vencido. “Aniquilado” soa natural aplicado a uma pessoa nesse contexto fatal e mantém a força do termo sem reduzi-lo simplesmente a “morto”.
