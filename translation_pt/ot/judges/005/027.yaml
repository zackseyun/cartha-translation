  naturalness: «Entre os pés dela» é claro e natural no registro poético. «Jazeu» é literário, mas corrente e apropriado à solenidade e à cadência breve do cântico. A enumeração sem a conjunção «e» reproduz melhor o ritmo abrupto dos verbos hebraicos.
  terminology: «Desabou» para כָּרַע e «caiu» para נָפַל distinguem adequadamente os verbos sem sugerir gesto voluntário. «Destruído» para שָׁדוּד é uma opção segura no contexto de morte e ruína, sem limitar o termo a uma formulação doutrinária ou explicativa.
