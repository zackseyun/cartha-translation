source:
  edition: WLC
  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: pt
  text: “Será que não estão encontrando e repartindo o despojo? Um ventre[a], dois ventres para cada homem; despojo de tecidos tingidos para Sísera, despojo de tecidos tingidos, tecido bordado, tecido tingido[b], dois bordados para os pescoços do despojo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “um ventre, dois ventres”, uma metonímia cruel para mulheres tomadas como despojo sexual.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para os pescoços das cativas / das que foram tomadas como despojo”. O hebraico da expressão final é difícil e talvez se refira a tecidos bordados usados pelas mulheres cativas.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  choice: Não estão eles encontrando e repartindo
  rationale: Preserva a pergunta retórica e a expectativa vívida de uma ação em andamento; “repartindo” expressa a distribuição do saque.
- source_word: שָׁלָל
  choice: despojo
  rationale: Termo militar corrente e digno para bens e pessoas tomados na guerra; também permite conservar a difícil expressão final.
- source_word: רַחַם רַחֲמָתַיִם
  choice: um ventre, dois ventres
  rationale: Mantém a metonímia brutal e desumanizadora do hebraico, em vez de suavizá-la como “mulher” ou “moça”.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: para cada homem
  rationale: Traduz naturalmente o valor distributivo da expressão literal “por cabeça de homem”, preservando a referência masculina.
- source_word: צְבָעִים
  choice: tecidos tingidos
  rationale: Representa artigos têxteis coloridos ou tingidos entre os despojos sem especificar indevidamente que fossem roupas prontas.
- source_word: רִקְמָה
  choice: tecido bordado
  rationale: Explicita o objeto têxtil pressuposto e mantém a imagem do bordado.
- source_word: צֶבַע רִקְמָתַיִם
  choice: tecido tingido, dois bordados
  rationale: Conserva a sequência compacta e a forma dual do hebraico, sem harmonizar sua sintaxe difícil.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: para os pescoços do despojo
  rationale: Versão deliberadamente próxima de uma frase hebraica obscura, cuja possível referência a cativas é indicada em nota.
theological_decisions:
- issue: Se a metonímia sexualizada רַחַם רַחֲמָתַיִם deve ser suavizada
  choice: Conservar literalmente “um ventre, dois ventres”
  alternative: “uma mulher, duas mulheres” ou “uma moça, duas moças”
  rationale: A fala retrata a expectativa cruel da casa de Sísera, não a aprovação do narrador. A literalidade preserva a força moral e poética da objetificação.
- issue: Como traduzir a difícil expressão final לְצַוְּארֵי שָׁלָל
  choice: Manter “para os pescoços do despojo” no texto e explicar a alternativa em nota
  alternative: “para os pescoços das cativas” ou “das que foram tomadas como despojo”
  rationale: O hebraico é sintaticamente comprimido e ambíguo; a tradução não deve resolver a dificuldade com certeza indevida.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A sintaxe poética e as repetições do inventário são preservadas; as duas notas mantêm explícitas tanto a violência do original quanto a incerteza da frase final.
