  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: pt
  text: A vida nas aldeias cessou em Israel; cessou até que eu[a], Débora, me levantei — até que me levantei como mãe em Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os moradores das aldeias desapareceram de Israel”, ou “a população rural desapareceu de Israel”. O substantivo hebraico é difícil e pode se referir aos habitantes das aldeias ou, de modo mais amplo, à vida rural.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: cessou
  rationale: O verbo חדל, repetido no hebraico, indica cessação. “Cessou” conserva a repetição poética e o tom elevado do cântico.
- source_word: פְרָזוֹן
  choice: a vida nas aldeias
  rationale: O substantivo é difícil e pode designar os habitantes das aldeias, a população rural ou, de modo mais amplo, a vida em povoações não fortificadas. “A vida nas aldeias” comunica naturalmente o colapso da vida rural sem restringir excessivamente o sentido.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: A preposição ב tem sentido locativo natural neste contexto nacional.
- source_word: עַד
  choice: até que
  rationale: Marca o ponto de virada entre a cessação anterior e o surgimento de Débora.
- source_word: שַׁקַּמְתִּי
  choice: me levantei
  rationale: A forma de קום descreve Débora erguendo-se para agir. “Me levantei” é natural em português, mantém a primeira pessoa e permite preservar a repetição.
- source_word: דְּבוֹרָה
  choice: Débora
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֵם
  choice: mãe
  rationale: O substantivo funciona como metáfora ou designação honorífica da liderança protetora de Débora. A construção “como mãe” torna essa função predicativa natural em português.
theological_decisions:
- issue: Força metafórica da autodescrição אֵם בְּיִשְׂרָאֵל
  choice: “como mãe em Israel”
  alternative: “mãe de Israel” ou uma leitura estritamente maternal
  rationale: O hebraico diz literalmente “mãe em Israel”, não “mãe de Israel”. A tradução mantém a preposição e deixa perceptível a metáfora de liderança protetora, sem transformá-la num título mais forte do que o texto exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “cessou” e “me levantei” preserva o paralelismo poético. O travessão destaca a segunda formulação sem eliminar a tensão e a ênfase do original.
