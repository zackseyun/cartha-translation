base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: pt
  text: 'Vieram reis e lutaram;

    então os reis de Canaã lutaram

    em Taanaque, junto às águas de Megido.

    Não tomaram despojo de prata.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não obtiveram ganho em prata» ou «não obtiveram lucro em prata». A expressão hebraica pode indicar ganho material em geral; no contexto de batalha, «despojo de prata» é uma leitura apropriada.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: Vieram reis
  rationale: Mantém a ordem marcada e a abertura breve e poética do hebraico, sem acrescentar artigo definido.
- source_word: נִלְחָמוּ
  choice: lutaram
  rationale: O nifal de לחם significa normalmente lutar ou combater; a forma concisa preserva o paralelismo poético.
- source_word: אָז
  choice: então
  rationale: Expressa a progressão temporal ou poética sem explicá-la além do texto.
- source_word: מַלְכֵי כְנַעַן
  choice: os reis de Canaã
  rationale: Reproduz de modo claro a relação construta do hebraico.
- source_word: בְּתַעְנַךְ
  choice: em Taanaque
  rationale: A preposição בְּ marca aqui o local do combate; “em” é natural em português.
- source_word: עַל מֵי מְגִדּוֹ
  choice: junto às águas de Megido
  rationale: Neste contexto geográfico, עַל indica proximidade; “junto às” preserva a referência topográfica sem sugerir que lutaram sobre a água.
- source_word: בֶּצַע כֶּסֶף
  choice: ganho algum em prata
  rationale: בֶּצַע designa ganho ou proveito material e pode, no contexto militar, referir-se a despojo. A formulação principal conserva a amplitude lexical do hebraico.
- source_word: לֹא לָקָחוּ
  choice: Não levaram
  rationale: Traduz diretamente a negação e o verbo לקח, com formulação idiomática no contexto de bens obtidos em batalha.
