  text: גִּלְעָ֗ד בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ שָׁכֵ֔ן וְ/דָ֕ן לָ֥/מָּה יָג֖וּר אֳנִיּ֑וֹת אָשֵׁ֗ר יָשַׁב֙ לְ/ח֣וֹף יַמִּ֔ים וְ/עַ֥ל מִפְרָצָ֖י/ו יִשְׁכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: pt
  text: Gileade ficou além do Jordão; e Dã, por que permaneceu junto aos navios?[a] Aser ficou sentado à beira-mar e permaneceu junto aos seus portos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por que viveu entre os navios?» O verbo hebraico pode significar morar, residir como estrangeiro ou permanecer; a relação exata com «navios» é expressa de modo muito compacto no poema.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «suas enseadas» ou «suas reentrâncias costeiras». O termo hebraico indica aberturas ou recortes e, neste contexto marítimo, provavelmente se refere a portos ou enseadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: Gileade
  rationale: Mantém o nome próprio como designação direta da região ou do grupo tribal, sem explicitar interpretativamente «os gileaditas».
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: além do Jordão
  rationale: Expressão geográfica concisa que preserva a perspectiva espacial do hebraico.
- source_word: שָׁכֵן
  choice: ficou
  rationale: Expressa tanto permanência quanto inação no contexto de reprovação poética, em linguagem portuguesa natural.
- source_word: וְדָן
  choice: e Dã
  rationale: Transliteração portuguesa tradicional do nome tribal, preservando a coordenação hebraica.
- source_word: לָמָּה
  choice: por que
  rationale: Mantém a pergunta retórica de censura.
- source_word: יָגוּר
  choice: permaneceu
  rationale: O verbo pode indicar residir ou viver como forasteiro; neste contexto, «permaneceu» comunica com naturalidade que Dã não foi à batalha, sem acrescentar uma motivação.
- source_word: אֳנִיּוֹת
  choice: junto aos navios
  rationale: «Navios» representa claramente as embarcações; «junto a» torna explícita em português a relação contextual que a construção poética hebraica deixa compacta.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma portuguesa tradicional do nome tribal.
- source_word: יָשַׁב
  choice: ficou sentado
  rationale: Preserva a imagem vívida do verbo «sentar-se» e sua sugestão contextual de inatividade.
- source_word: לְחוֹף יַמִּים
  choice: à beira-mar
  rationale: Formulação idiomática moderna para a costa ou margem das águas, sem reproduzir de modo artificial o plural hebraico «mares».
- source_word: מִפְרָצָיו
  choice: seus portos
  rationale: No contexto marítimo, as aberturas ou reentrâncias costeiras provavelmente funcionam como portos; a nota preserva alternativas mais literais.
- source_word: יִשְׁכּוֹן
  choice: permaneceu
  rationale: Mantém o paralelismo de permanência e inação, com registro natural e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de nomes bíblicos correntes no Brasil. A repetição de «permaneceu» conserva o paralelismo e o tom de censura, enquanto «ficou sentado» retém a imagem poética de inatividade.
