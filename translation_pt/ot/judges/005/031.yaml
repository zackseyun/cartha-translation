base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: pt
  text: Assim pereçam todos os teus inimigos, ó Yahweh! Mas os que o amam sejam como o sol quando nasce em sua força.[a] E a terra teve descanso durante quarenta anos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “os que o amam [sejam/são] como o sair do sol em sua força”. O verbo não aparece expresso nesta oração.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a terra ficou tranquila”. Em Juízes, essa expressão costuma indicar um período de paz ou descanso depois de um conflito.'
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: Assim pereçam
  rationale: כֵּן introduz a conclusão desejada com base no cântico precedente, e o imperfeito יֹאבְדוּ tem aqui força volitiva. “Assim pereçam” preserva tanto a ligação quanto o tom imprecatório.
- source_word: כָל אוֹיְבֶיךָ
  choice: todos os teus inimigos
  rationale: Tradução direta e natural da construção com sufixo de segunda pessoa, mantendo a fala dirigida a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאֹהֲבָיו
  choice: Mas os que o amam
  rationale: “Mas” explicita o contraste entre os inimigos de Yahweh e os que o amam. O pronome de terceira pessoa preserva a mudança do discurso direto (“teus”) para a referência a Yahweh (“o”).
- source_word: כְּצֵאת הַשֶּׁמֶשׁ
  choice: como o sol quando nasce
  rationale: O “sair” do sol designa seu aparecimento ou nascer. A formulação é clara em português e mantém a imagem poética.
- source_word: בִּגְבֻרָתוֹ
  choice: em sua força
  rationale: Conserva a imagem da força ou potência do sol sem acrescentar uma interpretação sobre brilho ou calor.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: E a terra teve descanso
  rationale: Em Juízes, a expressão formulaica indica tranquilidade e ausência de conflito. “Teve descanso” comunica esse sentido melhor que uma referência meramente sonora ao silêncio.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: Expressa de modo natural em português a duração indicada pelo hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Referente do sufixo em וְאֹהֲבָיו
  choice: “o” refere-se a Yahweh
  alternative: Uniformizar a pessoa gramatical como “os que te amam”
  rationale: O sufixo hebraico está na terceira pessoa do singular e naturalmente retoma Yahweh. A tradução mantém a mudança deliberada de segunda para terceira pessoa, sem suavizá-la.
- issue: Força volitiva aplicada aos que amam Yahweh
  choice: “sejam” mantém o desejo paralelo a “pereçam”
  alternative: 'Ler como afirmação: “os que o amam são”'
  rationale: Embora a segunda oração não repita um verbo expresso, o contexto de desejo introduzido por כֵּן e o paralelismo favorecem a continuação da força volitiva, sem eliminar a possibilidade formal refletida na nota literal.
translation_notes:
  register: Português moderno, digno e acessível, com construção poética concisa. Conserva-se a mudança do tratamento direto de Yahweh para a terceira pessoa. “Ó Yahweh” marca naturalmente o vocativo, e “durante” torna explícita em português a ideia de duração sem alterar o conteúdo.
