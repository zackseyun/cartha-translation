base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: pt
  text: E os líderes de Issacar estavam com Débora[a]; Issacar também estava com Baraque. Foram enviados ao vale, seguindo os passos dele[b]. Entre as divisões de Rúben, houve grandes reflexões do coração[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de Issacar” ou “príncipes de Issacar”. A expressão hebraica é poética e pode ter sentido idiomático, não necessariamente o possessivo literal “meus líderes”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos pés dele”, isto é, seguindo-o de perto.
    reason: lexical_alternative
  - marker: c
    text: Ou “grandes decisões do coração” ou “grandes deliberações do coração”. A expressão hebraica é difícil; no contexto, provavelmente ressalta o debate interior de Rúben em vez de sua ação.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי
  choice: líderes de Issacar
  rationale: A forma poética pode ser entendida idiomaticamente como designação dos chefes de Issacar, sem impor o possessivo literal “meus”. “Líderes” é claro e digno em português moderno.
- source_word: עִם
  choice: com
  rationale: 'Expressa acompanhamento direto: os líderes de Issacar estavam ao lado de Débora.'
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: Issacar também estava com Baraque
  rationale: כֵּן indica correspondência, “também/igualmente”; o verbo “estava” é suprido para tornar natural a oração elíptica.
- source_word: בָּעֵמֶק
  choice: ao vale
  rationale: No contexto de envio para a batalha, a expressão indica movimento em direção ao vale, não apenas localização.
- source_word: שֻׁלַּח
  choice: foram enviados
  rationale: Embora a forma verbal seja singular, o sujeito tribal coletivo permite em português o plural sem perder o sentido poético.
- source_word: בְּרַגְלָיו
  choice: seguindo os passos dele
  rationale: Traduz naturalmente o idiomatismo literal “aos pés dele”, indicando que os homens de Issacar seguiam Baraque de perto.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: entre as divisões de Rúben
  rationale: Mantém a noção de agrupamentos ou facções internas da tribo e preserva a possível tensão entre divisão e indecisão.
- source_word: גְּדֹלִים
  choice: grandes
  rationale: Reproduz diretamente a intensificação poética da expressão seguinte.
- source_word: חִקְקֵי לֵב
  choice: reflexões do coração
  rationale: A expressão hebraica é difícil. “Reflexões do coração” preserva a interioridade e a deliberação sugeridas pelo contexto, sem decidir se se trata de resoluções firmes ou hesitação.
