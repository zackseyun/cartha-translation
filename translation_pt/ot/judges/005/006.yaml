id: JDG.5.6
reference: Judges 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: pt
  text: Nos dias de Sangar, filho de Anate, nos dias de Jael, as estradas ficaram desertas[a], e os viajantes seguiam por caminhos tortuosos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as estradas cessaram”; isto é, o trânsito normal pelas rotas principais parou.
    reason: lexical_alternative
  - marker: b
    text: “Caminhos tortuosos” provavelmente se refere a rotas indiretas usadas por segurança, não à perversidade moral.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém o idiomatismo temporal hebraico e soa natural no registro bíblico português.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Sangar, filho de Anate
  rationale: Emprega as formas tradicionalmente reconhecíveis em português e traduz בֶּן de modo direto.
- source_word: יָעֵל
  choice: Jael
  rationale: Usa a forma consagrada do nome em português.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: as estradas ficaram desertas
  rationale: O verbo significa literalmente que as estradas 'cessaram'; no contexto, indica que o trânsito normal pelas rotas deixou de existir. A formulação comunica esse resultado sem atribuir uma causa não expressa.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: os viajantes
  rationale: A expressão significa literalmente 'os que percorriam caminhos/veredas'. 'Os viajantes' é uma equivalência portuguesa clara e evita uma repetição pesada de termos para caminho.
- source_word: יֵלְכוּ
  choice: seguiam
  rationale: O imperfeito, dentro do relato poético no passado, descreve uma prática habitual.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: por caminhos tortuosos
  rationale: Preserva a imagem concreta de rotas sinuosas ou indiretas. 'Tortuosos' não deve ser entendido aqui como juízo moral, mas como descrição do trajeto.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição poética “nos dias de” foi preservada. A distinção entre rotas principais e trajetos indiretos é comunicada pelo contraste entre “estradas” e “caminhos tortuosos”, enquanto a nota esclarece a imagem sem resolver além do texto a razão histórica do abandono.
