base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: pt
  text: 'Pela janela, a mãe de Sísera olhou para fora e lamentou por entre a treliça: “Por que o carro de guerra dele demora tanto a chegar? Por que tardam os passos dos seus carros de guerra?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gritou”, para o verbo raro traduzido como “lamentou”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os passos” ou “as pisadas dos seus carros de guerra”; a expressão pode evocar o ruído da aproximação dos carros e dos animais que os puxavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: Pela janela
  rationale: A preposição com “janela” indica visão através de uma abertura; “pela janela” é natural em português e preserva a relação espacial.
- source_word: נִשְׁקְפָה
  choice: olhava para fora
  rationale: O verbo descreve olhar para fora, muitas vezes de uma janela ou lugar elevado. O imperfeito português expressa bem a cena narrativa em andamento.
- source_word: וַתְּיַבֵּב
  choice: lamentava
  rationale: O verbo raro parece indicar lamento vocal ou grito aflito. “Lamentava” comunica a aflição sem definir excessivamente a natureza do som.
- source_word: אֵם סִיסְרָא
  choice: a mãe de Sísera
  rationale: Reproduz naturalmente em português a relação construta hebraica.
- source_word: בְּעַד הָאֶשְׁנָב
  choice: por entre a treliça
  rationale: אֶשְׁנָב designa uma abertura gradeada ou treliçada; “por entre a treliça” conserva tanto o objeto quanto a ideia de passagem visual e sonora através dele.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: o carro dele demora tanto a chegar
  rationale: בֹּשֵׁשׁ indica demora. “Demora tanto a chegar” soa natural na pergunta ansiosa, enquanto “carro” mantém o singular do hebraico no sentido de carro de guerra.
- source_word: אֶחֱרוּ
  choice: tardam
  rationale: O verbo plural exprime demora continuada; “tardam” preserva de modo conciso sua força verbal.
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: os passos dos seus carros
  rationale: פַּעֲמֵי significa literalmente “passos”, “batidas” ou “pisadas”. A tradução formal “passos dos seus carros” conserva a imagem incomum e a ambiguidade do hebraico, sem introduzir explicitamente cascos ou rodas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “janela/treliça” e das duas perguntas foi mantida. Preferiu-se “passos dos seus carros” no texto para não resolver a imagem hebraica em favor de “cascos” ou “rodas”; a nota esclarece a expressão.
