  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: As mais sábias de suas princesas
  rationale: 'A construção feminina plural é entendida como superlativa/partitiva: as mulheres mais sábias entre as princesas dela. A formulação é natural em português e preserva o referente feminino.'
- source_word: תַּעֲנֶינָּה
  choice: lhe respondem
  rationale: O verbo ענה significa aqui responder; o pronome indica que a resposta é dirigida à mãe de Sísera.
- source_word: אַף הִיא
  choice: ela mesma também
  rationale: Mantém tanto a ideia aditiva de אַף quanto a ênfase explícita no sujeito feminino הִיא.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: repete para si as próprias palavras
  rationale: Literalmente, a expressão pode indicar que ela faz voltar ou responde às suas palavras para si mesma. 'Repete para si' comunica o provável sentido reflexivo no contexto sem introduzir conteúdo ausente.
