base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: pt
  text: 'Eles lhe disseram: “Não, mas certamente o amarraremos e o entregaremos nas mãos deles[a]; de modo nenhum o mataremos.” Então o amarraram com duas cordas novas e o fizeram subir do rochedo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o entregaremos ao poder deles”. A expressão hebraica diz literalmente “o entregaremos na mão deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da rocha” ou “do penhasco”. O termo hebraico pode indicar uma rocha, um rochedo ou uma elevação rochosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Não! ... mas
  rationale: A construção nega a possibilidade de os próprios homens de Judá matarem Sansão e, em seguida, esclarece o que de fato farão. A formulação mantém o contraste de modo natural em português.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: Certamente o amarraremos
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação; “certamente” comunica essa ênfase sem tornar a frase artificial.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: o entregaremos nas mãos deles
  rationale: Conserva a imagem hebraica da “mão” como poder ou domínio, numa expressão também compreensível e idiomática em português.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: de modo nenhum o mataremos
  rationale: A combinação enfática com negação forte assegura que eles não causarão a morte de Sansão. “De modo nenhum” reproduz essa força.
- source_word: וַיַּאַסְרֻהוּ
  choice: o amarraram
  rationale: Mantém em português a repetição da raiz אסר usada anteriormente na promessa de amarrá-lo.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: com duas cordas novas
  rationale: עֲבֹתִים designa cordas ou cabos grossos. “Cordas” é claro e natural, e “novas” preserva um detalhe narrativamente relevante.
- source_word: וַיַּעֲלוּהוּ מִן הַסָּלַע
  choice: o fizeram subir do rochedo
  rationale: A forma verbal é causativa e indica fazê-lo subir ou conduzi-lo para cima. “Rochedo” representa melhor a possível formação rochosa elevada expressa por סֶלַע.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “amarrar” e as duas construções enfáticas do hebraico foram preservadas; a imagem idiomática das mãos também foi mantida no texto, com explicação em nota.
