base_translation:
  language: en
  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: pt
  text: E os feriu, perna sobre coxa, com grande carnificina[a]. Depois desceu e ficou na fenda do rochedo de Etã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “perna sobre coxa”, provavelmente uma expressão idiomática para uma derrota devastadora ou completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: feriu
  rationale: Traduz diretamente o sentido básico de נכה, sem afirmar além do verbo que todos tenham sido mortos; o resultado devastador é expresso pela frase seguinte.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: perna sobre coxa
  rationale: Preserva a imagem concreta e a ordem da expressão hebraica difícil. Como seu sentido idiomático exato é incerto, a provável ideia de derrota devastadora fica indicada em nota.
- source_word: מַכָּה גְדוֹלָה
  choice: causando uma grande carnificina
  rationale: Em contexto de combate, מַכָּה pode designar mortandade ou derrota. A formulação comunica com naturalidade a violência e a intensidade de גְדוֹלָה.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Mantém de modo natural o sentido direcional do verbo narrativo.
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: Neste contexto, ישב indica permanência no local; “ficou” evita tanto o literalismo de “sentou-se” quanto a ideia de residência duradoura.
- source_word: בִּסְעִיף סֶלַע
  choice: na fenda do rochedo
  rationale: סְעִיף designa aqui uma fenda ou abertura, e סֶלַע uma formação rochosa; “rochedo” expressa melhor que uma simples pedra o abrigo geográfico.
- source_word: עֵיטָם
  choice: Etã
  rationale: Transliteração portuguesa corrente do topônimo hebraico, com acento gráfico para orientar a pronúncia.
