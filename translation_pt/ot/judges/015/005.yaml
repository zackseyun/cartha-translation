  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: pt
  text: Ele ateou fogo às tochas[a] e soltou as raposas entre o cereal em pé dos filisteus; queimou os montes de cereal colhido, o cereal em pé e os olivais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fachos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desde o monte de cereal até o cereal em pé e até o olival”; a tradução apresenta como lista a extensão do que foi queimado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ
  choice: ateou fogo
  rationale: A construção causativa significa acender ou pôr fogo. “Ateou fogo” é natural, precisa e digna em português.
- source_word: לַפִּידִים
  choice: tochas
  rationale: O termo pode designar tochas ou fachos incendiários. “Tochas” é a opção moderna mais clara, sem excluir a alternativa em nota.
- source_word: וַיְשַׁלַּח
  choice: soltou as raposas
  rationale: O verbo significa “enviou” ou “soltou”. O objeto está implícito no hebraico e remete às raposas do versículo anterior; explicitá-lo evita que o pronome português pareça referir-se às tochas.
- source_word: בְּקָמוֹת
  choice: no meio do cereal em pé
  rationale: קָמָה designa cereal ainda enraizado e não meramente campos em sentido geral. A expressão preserva essa distinção agrícola.
- source_word: פְּלִשְׁתִּים
  choice: dos filisteus
  rationale: Forma gentílica portuguesa padrão.
- source_word: וַיַּבְעֵר
  choice: queimou tudo
  rationale: O segundo uso de בער descreve o resultado destrutivo. “Tudo” torna natural em português a sequência de extensão que vem a seguir, sem acrescentar uma nova categoria de dano.
- source_word: מִגָּדִישׁ
  choice: desde os montes de cereal colhido
  rationale: גָּדִישׁ é uma pilha ou monte de cereal já ceifado. A formulação é mais imediatamente compreensível do que o vocabulário agrícola especializado “medas”.
- source_word: וְעַד קָמָה
  choice: até o cereal em pé
  rationale: Preserva a construção hebraica de extensão מִן...וְעַד, “desde... até”, e mantém o contraste entre cereal colhido e cereal ainda no campo.
- source_word: וְעַד כֶּרֶם זָיִת
  choice: chegando até os olivais
  rationale: כֶּרֶם, quando qualificado por זַיִת, indica uma plantação de oliveiras. “Olivais” é a expressão portuguesa natural, e “chegando até” comunica a extensão culminante do incêndio.
