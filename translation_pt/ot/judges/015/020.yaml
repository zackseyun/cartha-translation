base_translation:
  language: en
  yaml_path: translation/ot/judges/015/020.yaml
  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: pt
  text: E ele julgou Israel nos dias dos filisteus, durante vinte anos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liderou Israel durante vinte anos”; o verbo hebraico pode indicar uma atividade mais ampla de governo ou liderança, não apenas a tomada de decisões judiciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: Preserva o verbo recorrente שׁפט e sua ligação literária com o papel dos juízes no livro, sem o restringir a decisões judiciais modernas; a nota registra o sentido mais amplo possível de liderança.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Reproduz diretamente o nome próprio coletivo e é natural em português nesta construção.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém o idiomatismo temporal hebraico de modo claro, digno e corrente em português bíblico moderno.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: É a designação portuguesa convencional desse povo; a contração com o artigo resulta em 'dos filisteus'.
- source_word: עֶשְׂרִים שָׁנָה
  choice: durante vinte anos
  rationale: Expressa claramente a duração do exercício de sua função. 'Durante' evita que a posição final do sintagma soe truncada em português.
theological_decisions:
- issue: Sentido da função de Sansão em שׁפט
  choice: julgou Israel
  alternative: liderou Israel durante vinte anos
  rationale: A tradução mantém a terminologia característica do livro de Juízes e não amplia interpretativamente a função para governo político ou libertação; a possível noção mais abrangente de liderança é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem segue de perto o hebraico, enquanto 'durante' torna explícita e natural a duração em português.
