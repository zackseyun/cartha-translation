language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: pt
  text: Então Deus rachou a cavidade que fica em Leí[a], e dela saiu água. Sansão bebeu, seu espírito voltou, e ele reviveu. Por isso, deu-lhe o nome de En-Hacoré[b], que fica em Leí até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra leitura da cena: “Deus rachou a cavidade na queixada, e dela saiu água”.'
    reason: alternative_reading
  - marker: b
    text: En-Hacoré provavelmente significa “Fonte do que clama” ou “Fonte daquele que clamou”, em referência ao clamor de Sansão a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: abriu uma fenda
  rationale: Expressa a ação vigorosa de partir ou fender, com naturalidade em português e sem recorrer a uma formulação arcaica.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No contexto narrativo, refere-se diretamente ao Deus de Israel.
- source_word: הַמַּכְתֵּשׁ
  choice: a cavidade
  rationale: Embora o substantivo possa designar um pilão ou gral, aqui indica uma depressão ou cavidade da qual brota água. A escolha comunica o sentido topográfico sem impor a imagem de um utensílio doméstico.
- source_word: בַּלֶּחִי
  choice: em Leí
  rationale: O contexto favorece Leí como nome de lugar, especialmente pela frase final que localiza ali En-Hacoré. A possibilidade de entender o termo como 'na queixada' é mantida em nota.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: dela saiu água
  rationale: Conserva a sequência e a referência à cavidade em português corrente; 'água' no singular coletivo é idiomático.
- source_word: וַיֵּשְׁתְּ
  choice: Sansão bebeu
  rationale: O sujeito é explicitado para clareza em português, sem acrescentar informação nova ao contexto.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: seu espírito voltou
  rationale: Preserva a amplitude de רוּחַ, que pode envolver espírito, fôlego ou vitalidade, sem reduzi-lo apenas a força física.
- source_word: וַיֶּחִי
  choice: ele reviveu
  rationale: Indica restauração da vitalidade após o esgotamento, sem exigir que Sansão tivesse morrido.
- source_word: קָרָא שְׁמָהּ
  choice: deu-lhe o nome
  rationale: É a forma idiomática portuguesa da fórmula hebraica de nomeação, mantendo o referente sem especificá-lo além do texto.
- source_word: עֵין הַקּוֹרֵא
  choice: En-Hacoré
  rationale: O nome próprio é transliterado no texto principal, e seu sentido narrativamente relevante é explicado em nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português natural da fórmula temporal hebraica.
theological_decisions:
- issue: Referente de בַּלֶּחִי e localização da fonte de água
  choice: Ler Leí como nome do lugar no texto principal.
  alternative: Entender a expressão como 'na queixada', fazendo a água sair de uma cavidade no próprio osso.
  rationale: Leí aparece no contexto como topônimo, e a cláusula final, 'que fica em Leí até hoje', favorece fortemente a leitura geográfica. Como o substantivo לֶחִי também significa 'queixada' e a leitura alternativa muda a maneira de visualizar o milagre, ela é preservada em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se a concisão narrativa hebraica, explicita-se ''Sansão'' apenas para clareza referencial e preserva-se a ambiguidade de רוּחַ com ''espírito''. Os marcadores foram associados às notas correspondentes: a leitura alternativa junto de Leí e o significado do nome junto de En-Hacoré.'
