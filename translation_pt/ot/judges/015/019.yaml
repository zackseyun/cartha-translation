  naturalness: O texto é claro e de registro apropriado. “Rachou a cavidade que fica em Leí” é mais direto e fiel do que “abriu uma fenda na cavidade que havia em Leí”; “que fica” também exprime melhor a localização presente no hebraico.
  terminology: “Deus”, “espírito”, “Leí” e “En-Hacoré” são escolhas adequadas. A nota etimológica preserva, de modo útil, a relação do nome com o clamor de Sansão. A nota alternativa é ajustada para refletir que a alternativa entende a cavidade como situada na queixada.
