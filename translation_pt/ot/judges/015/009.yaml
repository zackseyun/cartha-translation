base_translation:
  language: en
  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: pt
  text: Então os filisteus subiram, acamparam em Judá e se espalharam em Leí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se posicionaram em Leí”. O verbo hebraico pode indicar que as tropas se espalharam ou se dispuseram militarmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido direcional convencional de עלה e se ajusta ao movimento geográfico ou militar da narrativa.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Designação étnica tradicional e clara em português, com artigo definido natural para um povo já conhecido no contexto.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: Traduz diretamente חנה em linguagem moderna e natural.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: A preposição ב indica mais naturalmente localização; a hostilidade decorre do contexto e não precisa ser acrescentada à tradução.
- source_word: וַיִּנָּטְשׁוּ
  choice: se espalharam
  rationale: Expressa a ideia de uma força que se estende ou se dispõe por uma área, sem impor terminologia militar excessivamente técnica.
- source_word: בַּלֶּחִי
  choice: em Leí
  rationale: A preposição ב permite a localização em Leí; em português, 'em' é natural com um topônimo, embora também possa ser entendido como posicionamento junto ao lugar.
