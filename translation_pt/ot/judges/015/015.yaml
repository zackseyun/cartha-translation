base_translation:
  language: en
  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: pt
  text: Ele encontrou uma queixada fresca de jumento[a], estendeu a mão, pegou-a e com ela abateu mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma queixada nova de jumento”. O adjetivo hebraico pode indicar algo fresco ou recentemente disponível.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: encontrou
  rationale: O wayyiqtol de מצא relata um acontecimento passado simples; “encontrou” é a equivalência direta e natural em português.
- source_word: לְחִי חֲמוֹר
  choice: uma queixada de jumento
  rationale: לְחִי pode indicar a mandíbula, a queixada ou a região da face; no contexto, trata-se do osso usado como arma. “Queixada de jumento” é uma formulação clara e tradicional, sem perder precisão.
- source_word: טְרִיָּה
  choice: fresca
  rationale: O adjetivo indica algo fresco, ainda não ressecado; “fresca” preserva esse sentido provável e também a possível ideia de algo recente.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: estendeu a mão
  rationale: Mantém a imagem concreta do idioma hebraico e soa natural na narrativa portuguesa.
- source_word: וַיִּקָּחֶהָ
  choice: pegou-a
  rationale: O sufixo feminino retoma “queixada”; “pegou-a” expressa de modo direto o ato de tomá-la.
- source_word: וַיַּךְ בָּהּ
  choice: com ela abateu
  rationale: נכה significa golpear e, neste contexto de combate, implica derrubar ou matar. “Abateu” comunica o resultado letal sem traduzir explicitamente o verbo como “matou”.
- source_word: אֶלֶף אִישׁ
  choice: mil homens
  rationale: אִישׁ aparece distributivamente após o numeral e, no cenário de combate, refere-se adequadamente a homens.
