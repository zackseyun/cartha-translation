base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: pt
  text: 'Então Sansão disse: “Com a queixada de um jumento, um montão, dois montões[a]! Com a queixada de um jumento, derrubei mil homens.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No hebraico, há um jogo de palavras: o termo para “jumento” soa de modo semelhante ao termo traduzido como “montão”. A expressão também pode ser entendida como “montões sobre montões”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O consecutivo narrativo faz a ação avançar; “Então” expressa a sequência com naturalidade em português.
- source_word: שִׁמְשׁוֹן
  choice: Sansão
  rationale: Forma consagrada do nome em português.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: Com a queixada de um jumento
  rationale: לְחִי designa a queixada ou o osso maxilar, aqui usado como arma; בְּ indica instrumento. “Queixada” é claro, concreto e preserva a formulação tradicional sem arcaísmo excessivo.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: um montão, dois montões
  rationale: A tradução acompanha de perto a expressão poética e mantém sua repetição enfática. O jogo sonoro hebraico com “jumento” não pode ser reproduzido naturalmente em português e, por isso, é explicado em nota.
- source_word: הִכֵּיתִי
  choice: derrubei
  rationale: נכה significa golpear ou abater; no contexto, “derrubei” comunica o resultado do combate sem substituir diretamente o verbo por “matei”.
- source_word: אֶלֶף אִישׁ
  choice: mil homens
  rationale: אִישׁ aparece no singular coletivo e, neste contexto de combate, refere-se adequadamente a homens.
