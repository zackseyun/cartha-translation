base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: pt
  text: 'E o pai dela disse: “Eu realmente pensei que você a odiava profundamente, por isso a dei ao seu companheiro.[a] A irmã mais nova dela não é melhor do que ela? Por favor, fique com a irmã mais nova no lugar dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao seu amigo”. O termo hebraico pode referir-se de modo amplo a um amigo, associado ou companheiro; neste contexto de casamento, alguns o entendem como o homem que acompanhou Sansão durante a celebração.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֹר אָמַרְתִּי
  choice: Eu realmente pensei
  rationale: O infinitivo absoluto seguido do perfeito intensifica a afirmação; esta formulação preserva a ênfase em português natural.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: você a odiava profundamente
  rationale: A construção intensiva indica ódio forte ou completo; “profundamente” comunica essa força sem soar artificial.
- source_word: וָאֶתְּנֶנָּה
  choice: por isso a dei
  rationale: O contexto apresenta a entrega da mulher como consequência da suposição do pai.
- source_word: לְמֵרֵעֶךָ
  choice: ao seu companheiro
  rationale: מֵרֵעַ pode designar amigo, associado ou companheiro; a escolha mantém a amplitude lexical sem definir uma função nupcial específica.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: a irmã mais nova dela
  rationale: Em relação entre irmãs, הַקְּטַנָּה indica naturalmente a mais jovem.
- source_word: טוֹבָה מִמֶּנָּה
  choice: melhor do que ela
  rationale: Mantém amplo o sentido de טוֹבָה, sem restringi-lo a beleza ou atratividade física.
- source_word: תְּהִי נָא לְךָ תַּחְתֶּיהָ
  choice: Por favor, fique com a irmã mais nova no lugar dela
  rationale: Expressa de modo idiomático o pedido e a substituição; a repetição de “a irmã mais nova” torna claro o referente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala preserva as duas construções enfáticas do hebraico, a pergunta retórica e a ambiguidade de “melhor”, evitando especificar beleza física ou uma função matrimonial técnica.
