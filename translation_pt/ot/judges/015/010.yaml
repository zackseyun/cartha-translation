base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: pt
  text: 'Então os homens de Judá perguntaram: “Por que vocês vieram contra nós?” Eles responderam: “Viemos amarrar Sansão e fazer-lhe o mesmo que ele fez conosco.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: os homens de Judá
  rationale: Embora אִישׁ esteja morfologicamente no singular, funciona aqui como coletivo e rege o verbo plural וַיֹּאמְרוּ. “Os homens de Judá” preserva tanto o sentido coletivo quanto a forma masculina do hebraico.
- source_word: לָמָה
  choice: Por que
  rationale: Equivalente interrogativo natural e direto para uma pergunta de causa em português moderno.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: vocês vieram contra nós
  rationale: עלה com עַל expressa movimento hostil contra alguém. “Vieram contra nós” conserva a ideia direcional e adversativa sem explicitar indevidamente um ataque já iniciado.
- source_word: לֶאֱסוֹר
  choice: amarrar
  rationale: אָסַר pode significar prender, amarrar ou pôr em cadeias. Neste contexto de captura física de Sansão, “amarrar” é claro, corrente e preciso.
- source_word: עָלִינוּ
  choice: Viemos
  rationale: Retoma o verbo עלה da pergunta. Em português, “viemos” reproduz naturalmente a resposta, enquanto a noção hostil ou final fica clara pelo propósito declarado.
- source_word: לַעֲשׂוֹת לוֹ
  choice: fazer com ele
  rationale: No contexto retaliatório, עשה + ל indica o que se pretende fazer a Sansão. “Fazer com ele” liga-se naturalmente à comparação seguinte em português.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: o mesmo que ele fez conosco
  rationale: Expressa com clareza a correspondência retaliatória marcada por כַּאֲשֶׁר, preservando a simetria entre o tratamento dado e o pretendido.
- source_word: שִׁמְשׁוֹן
  choice: Sansão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
