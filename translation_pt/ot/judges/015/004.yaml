base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: pt
  text: Então Shimshon foi, capturou trezentas raposas[a], pegou tochas, dispôs as raposas cauda com cauda e pôs uma tocha no meio de cada par de caudas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chacais”. O termo hebraico שׁוּעָלִים pode referir-se a raposas ou a canídeos semelhantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Tradução narrativa simples do wayyiqtol de הלך, introduzindo a sequência de ações.
- source_word: שִׁמְשׁוֹן
  choice: Shimshon
  rationale: Translitera diretamente o nome hebraico, em vez de substituí-lo pela forma tradicional portuguesa.
- source_word: וַיִּלְכֹּד
  choice: capturou
  rationale: לכד indica aqui apanhar ou capturar animais; “capturou” é claro e não implica necessariamente que tenham sido mortos.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: trezentas
  rationale: Construção cardinal direta, com concordância natural com “raposas” em português.
- source_word: שׁוּעָלִים
  choice: raposas
  rationale: É o sentido mais comum e tradicional de שׁוּעָלִים; a possibilidade de “chacais” é preservada em nota.
- source_word: לַפִּדִים / לַפִּיד
  choice: tochas / uma tocha
  rationale: Designa fachos ou archotes destinados a arder; “tocha” é corrente e imediatamente compreensível.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: colocou os animais cauda com cauda
  rationale: Expressa naturalmente o ato de virá-los ou dispô-los cauda com cauda, sem acrescentar que as caudas foram amarradas, detalhe não declarado pelo hebraico.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: pôs uma tocha
  rationale: Tradução direta e idiomática de שׂים com seu objeto.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: no meio de cada par de caudas
  rationale: Reproduz a localização “entre as duas caudas, no meio” e deixa claro, de modo natural, que a operação se repetiu em cada par.
