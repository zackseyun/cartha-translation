base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Descemos para amarrar você e entregá-lo nas mãos dos filisteus”. Sansão lhes disse: “Jurem para mim que vocês mesmos não me atacarão”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: amarrar você
  rationale: Expressa de modo natural e claro o infinitivo hebraico ‘prender/amarrar’, mantendo a ação física pretendida.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: entregá-lo nas mãos dos filisteus
  rationale: Preserva a imagem idiomática hebraica de colocar alguém sob o poder de outro, em formulação corrente em português bíblico.
- source_word: תִּפְגְּעוּן בִּי
  choice: me atacarão
  rationale: Neste contexto, o verbo indica investir violentamente contra Sansão; ‘atacar’ comunica isso sem impor um resultado mais específico, como ferir ou matar.
- source_word: אַתֶּם
  choice: vocês mesmos
  rationale: 'Mantém a ênfase explícita do pronome hebraico: Sansão exige que os próprios homens de Judá não o ataquem.'
