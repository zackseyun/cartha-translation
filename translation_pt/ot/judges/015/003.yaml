source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן נִקֵּ֥יתִי הַ/פַּ֖עַם מִ/פְּלִשְׁתִּ֑ים כִּֽי עֹשֶׂ֥ה אֲנִ֛י עִמָּ֖/ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: pt
  text: 'Então Sansão lhes disse: “Desta vez, estou sem culpa em relação aos filisteus[a] quando lhes fizer mal[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou livre de culpa quanto aos filisteus”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser traduzida por “lhes causar dano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência no português atual.
- source_word: לָהֶם
  choice: lhes
  rationale: Reproduz de modo idiomático a preposição com o sufixo de terceira pessoa masculina plural.
- source_word: שִׁמְשׁוֹן
  choice: Sansão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: נִקֵּיתִי
  choice: estarei sem culpa
  rationale: O verbo נקה indica estar livre de culpa ou responsabilidade. O futuro se ajusta à ação prejudicial que Sansão anuncia como iminente.
- source_word: הַפַּעַם
  choice: Desta vez
  rationale: Expressão temporal idiomática que assinala uma nova etapa do conflito.
- source_word: מִפְּלִשְׁתִּים
  choice: em relação aos filisteus
  rationale: Depois de נקה, מן marca a pessoa em relação à qual alguém se considera livre de culpa; a formulação evita sugerir mera separação física.
- source_word: כִּי
  choice: quando
  rationale: Introduz aqui a circunstância em que Sansão se considera sem culpa, sem exigir que a relação seja explicitada exclusivamente como causal.
- source_word: עֹשֶׂה אֲנִי
  choice: eu ... fizer
  rationale: O particípio com pronome explícito pode descrever ação iminente ou pretendida; a construção temporal portuguesa pede naturalmente o futuro do subjuntivo.
- source_word: עִמָּם
  choice: lhes
  rationale: Com עשה, o complemento introduzido por עִם indica aqueles a quem a ação será feita; “lhes” é natural em português.
- source_word: רָעָה
  choice: mal
  rationale: Preserva a amplitude de רָעָה, que pode designar mal, dano ou calamidade, e mantém a tensão moral da declaração de Sansão.
theological_decisions:
- issue: A alegação de inocência de Sansão
  choice: Apresentar a frase como a alegação do próprio Sansão, sem endossá-la pelo narrador
  alternative: Explicitar que sua retaliação era moralmente justificada ou injustificada
  rationale: O hebraico registra a reivindicação de Sansão, mas não resolve neste versículo a avaliação moral de sua conduta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a colocação pronominal natural no Brasil e compreensão internacional. “Fizer mal” conserva a concisão e a tensão moral do hebraico; a nota registra o sentido contextual de dano hostil.
