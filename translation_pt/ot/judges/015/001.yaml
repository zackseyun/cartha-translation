revisions:
- from: 'Passado algum tempo, durante a colheita do trigo, Sansão foi visitar sua mulher, levando um cabrito. Ele disse: “Quero entrar no quarto[a] de minha mulher”. Mas o pai dela não o deixou entrar.'
  to: 'Passado algum tempo, durante a colheita do trigo, Sansão foi visitar sua mulher, levando um cabrito. Ele disse: “Deixe-me entrar no aposento[a] de minha mulher”. Mas o pai dela não o deixou entrar.'
  rationale: 'A revisão mantém todas as informações do hebraico e melhora a fidelidade em dois pontos: representa a forma volitiva de Sansão por “Deixe-me entrar” e usa “aposento” para חדר, sem impor a noção mais estreita de um quarto de dormir. A nota mantém a alternativa lexical e a implicação contextual sem a transformar em afirmação explícita.'
