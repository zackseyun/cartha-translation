base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: pt
  text: 'Passado algum tempo, durante a colheita do trigo, Sansão foi visitar sua mulher, levando um cabrito. Ele disse: “Deixe-me entrar no aposento[a] de minha mulher”. Mas o pai dela não o deixou entrar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “câmara interior”. No contexto, provavelmente se refere ao aposento privado do casal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Passado algum tempo
  rationale: O idiomatismo indica que transcorreu um período não especificado. A formulação é natural em português e evita a rigidez de “e aconteceu depois de alguns dias”.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: durante a colheita do trigo
  rationale: Expressa com clareza o período sazonal indicado pelo hebraico, sem reproduzir de modo artificial a construção literal “nos dias da colheita”.
- source_word: וַיִּפְקֹד
  choice: foi visitar
  rationale: Neste contexto, פקד significa visitar ou ir ver alguém, não inspecionar, convocar ou castigar.
- source_word: אֶת אִשְׁתּוֹ
  choice: sua mulher
  rationale: Mantém a identificação explícita do hebraico, apesar do conflito conjugal narrado no contexto.
- source_word: בִּגְדִי עִזִּים
  choice: levando um cabrito
  rationale: גדִי עִזִּים designa um filhote de cabra. “Levando” torna natural em português a circunstância que acompanha a visita, provavelmente como presente.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: Quero entrar ... de minha mulher
  rationale: A forma volitiva expressa a intenção de Sansão. “Entrar” preserva a formulação discreta do hebraico e, no contexto, sua possível conotação conjugal.
- source_word: הֶחָדְרָה
  choice: no quarto
  rationale: A forma direcional aponta para um cômodo ou aposento interior. “Quarto” é claro e natural, sem explicitar além do texto a natureza precisa do aposento.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: Mas o pai dela não o deixou entrar
  rationale: Reproduz de maneira idiomática a recusa ativa do pai e mantém a repetição de “entrar”, ligando a resposta à intenção declarada por Sansão.
theological_decisions:
- issue: Possível conotação sexual de “entrar até sua mulher”
  choice: Preservar a expressão discreta por meio de “entrar no quarto de minha mulher”
  alternative: Explicitar “ter relações com minha mulher”
  rationale: O contexto conjugal sugere intimidade sexual, mas o hebraico não a declara diretamente. A tradução conserva essa implicação sem resolver a ambiguidade por explicitação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Preferiu-se “sua mulher” a “sua esposa” para refletir de perto אִשְׁתּוֹ sem perder naturalidade. O marcador da nota foi colocado junto a “quarto”, termo ao qual a alternativa lexical efetivamente se refere.
