  to: 'Então os filisteus perguntaram: “Quem fez isso?” Responderam: “Sansão, o genro do timnita, pois o timnita tomou a mulher de Sansão e a deu a seu companheiro[a].” Então os filisteus subiram e queimaram no fogo a mulher e o pai dela[b].'
