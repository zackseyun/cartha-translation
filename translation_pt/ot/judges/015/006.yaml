  text: וַ/יֹּאמְר֣וּ פְלִשְׁתִּים֮ מִ֣י עָ֣שָׂה זֹאת֒ וַ/יֹּאמְר֗וּ שִׁמְשׁוֹן֙ חֲתַ֣ן הַ/תִּמְנִ֔י כִּ֚י לָקַ֣ח אֶת אִשְׁתּ֔/וֹ וַֽ/יִּתְּנָ֖/הּ לְ/מֵרֵעֵ֑/הוּ וַ/יַּעֲל֣וּ פְלִשְׁתִּ֔ים וַ/יִּשְׂרְפ֥וּ אוֹתָ֛/הּ וְ/אֶת אָבִ֖י/הָ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: pt
  text: 'Então os filisteus perguntaram: “Quem fez isso?” Responderam: “Sansão, o genro do timnita, pois o timnita tomou a mulher de Sansão e a deu a seu companheiro[a].” Então os filisteus subiram e queimaram no fogo a mulher e o pai dela[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a seu amigo”. O termo hebraico pode indicar um companheiro ou amigo; no contexto do casamento, alguns o entendem mais especificamente como um acompanhante do noivo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “queimaram a ela e a seu pai no fogo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Etnônimo tradicional e claro em português; o artigo definido é natural para o povo já conhecido no contexto.
- source_word: מִי עָשָׂה זֹאת
  choice: Quem fez isso?
  rationale: O pretérito perfeito reproduz naturalmente a pergunta no fluxo narrativo.
- source_word: חֲתַן הַתִּמְנִי
  choice: o genro do timnita
  rationale: חָתָן pode designar noivo ou genro; aqui a relação de Sansão com o pai timnita da mulher torna “genro” a formulação contextual mais clara.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão pela qual Sansão foi identificado como autor do ato.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: este tomou a mulher de Sansão
  rationale: “Este” explicita que o sujeito é o timnita, mencionado imediatamente antes; “a mulher de Sansão” evita que o possessivo hebraico seja entendido em português como referência à mulher do pai.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: e a deu ao companheiro dele
  rationale: “Companheiro” preserva a amplitude de מֵרֵעַ sem impor a função específica de padrinho; “dele” mantém alguma ambiguidade formal, esclarecida pelo contexto anterior.
- source_word: וַיַּעֲלוּ
  choice: foram até lá
  rationale: O hebraico diz literalmente “subiram”; no contexto, a expressão indica deslocamento até o local, e esta formulação é natural sem afirmar uma direção geográfica incerta.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: queimaram no fogo a mulher e o pai dela
  rationale: Conserva a menção explícita ao fogo e evita acrescentar “vivos” ou “até a morte”, elementos não declarados diretamente na frase hebraica.
theological_decisions: []
