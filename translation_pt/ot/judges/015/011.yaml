base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: pt
  text: 'Então três mil homens de Judá desceram até a fenda[a] da rocha de Etã e disseram a Sansão: “Você não sabe que os filisteus nos dominam? O que é isso que você fez conosco?” E ele lhes disse: “Assim como fizeram comigo, eu fiz com eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fissura da rocha de Etã”.'
    reason: Alternativa lexical para סְעִיף, termo que pode indicar uma fenda ou fissura na formação rochosa.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: Preserva de modo natural o sentido direcional de ירד e o avanço da narrativa hebraica.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: três mil homens de Judá
  rationale: Expressa diretamente o grupo contado de homens e sua vinculação a Judá.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: até a fenda da rocha de Etã
  rationale: סְעִיף pode designar uma abertura ou divisão na rocha; “fenda” é topograficamente claro e corrente. סֶלַע é traduzido por “rocha”, e עֵיטָם recebe a forma portuguesa “Etã”.
- source_word: הֲלֹא יָדַעְתָּ
  choice: Você não sabe
  rationale: Reproduz a pergunta retórica dirigida a Sansão em linguagem portuguesa atual, sem perder seu tom de censura.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: que os filisteus dominam sobre nós
  rationale: O particípio מֹשְׁלִים indica domínio contínuo. “Dominam sobre nós” comunica tanto governo quanto sujeição política.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: O que é isso que você fez conosco?
  rationale: Mantém a forma interrogativa do hebraico e a queixa de que a ação de Sansão trouxe consequências ao povo de Judá.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: Assim como fizeram comigo, eu fiz com eles
  rationale: Preserva a estrutura correlativa e a formulação concisa de reciprocidade retaliatória do hebraico.
theological_decisions:
- issue: Tom da resposta de Sansão como reciprocidade retaliatória
  choice: 'A resposta é apresentada como declaração direta: “Assim como fizeram comigo, eu fiz com eles.”'
  alternative: Caracterizar a ação como vingança justificada ou, em sentido oposto, como revanche moralmente condenável.
  rationale: O versículo registra a justificativa de Sansão, mas não a avalia explicitamente. A tradução conserva essa tensão e evita acrescentar um juízo teológico ou moral ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira ampla. Emprega “você” porque o discurso é singular e direto, e mantém a concisão narrativa do hebraico.
