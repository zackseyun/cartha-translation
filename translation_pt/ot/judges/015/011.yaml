    rationale: A âncora deve acompanhar o vocábulo ou expressão efetivamente esclarecido pela nota.
  - severity: low
    issue: «Ele lhes respondeu» explicita uma ideia de resposta que não está lexicalmente expressa no hebraico.
    rationale: «E disse-lhes» segue mais de perto a formulação narrativa sem alterar o sentido.
