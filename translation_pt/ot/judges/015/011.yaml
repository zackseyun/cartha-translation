revisions:
- from: 'Então três mil homens de Judá desceram até a fenda da rocha de Etã[a] e disseram a Sansão: “Você não sabe que os filisteus dominam sobre nós? O que é isso que você fez conosco?” Ele lhes respondeu: “Assim como fizeram comigo, eu fiz com eles.”'
  to: 'Então três mil homens de Judá desceram até a fenda[a] da rocha de Etã e disseram a Sansão: “Você não sabe que os filisteus nos dominam? O que é isso que você fez conosco?” E ele lhes disse: “Assim como fizeram comigo, eu fiz com eles.”'
  rationale: A revisão melhora a idiomaticidade de «nos dominam», aproxima «e ele lhes disse» da construção hebraica e reposiciona a âncora da nota para «fenda», sem modificar o sentido, o registro ou a ambiguidade do texto.
