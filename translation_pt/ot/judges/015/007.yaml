  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: pt
  text: 'Sansão lhes disse: “Se é assim que vocês agem, juro que me vingarei de vocês; só depois pararei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: Se é assim que vocês agem
  rationale: Expressa de modo natural a condição introduzida por אִם e mantém o sentido do comportamento presente dos interlocutores.
- source_word: כִּי אִם נִקַּמְתִּי בָכֶם
  choice: juro que me vingarei de vocês
  rationale: 'A sequência enfática funciona como fórmula elíptica de juramento: Sansão declara que não desistirá antes de consumar a vingança. A formulação evita o pouco natural ''se eu não me vingar'' sem enfraquecer a força solene.'
- source_word: וְאַחַר אֶחְדָּל
  choice: só depois pararei
  rationale: 'Conserva a ordem temporal e a ênfase: Sansão afirma que cessará apenas depois de se vingar.'
