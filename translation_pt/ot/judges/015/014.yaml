base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: pt
  text: Quando ele chegou a Leí[a], os filisteus vieram ao seu encontro aos gritos. Então o Espírito de Yahweh irrompeu sobre ele, e as cordas que estavam em seus braços se tornaram como linho queimado pelo fogo; suas amarras se derreteram de suas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Leí é o nome de um lugar; em hebraico, a palavra também significa “queixada”, imagem importante no contexto imediato.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: Leí
  rationale: O contexto exige o nome do lugar. A forma portuguesa Leí mantém a função de topônimo; a relação lexical com 'queixada' é preservada em nota por sua importância na narrativa.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: vieram ao seu encontro aos gritos
  rationale: Expressa tanto o movimento confrontador de ir ao encontro de Sansão quanto o forte brado dos filisteus, sem especificá-lo além do hebraico como 'grito de guerra'.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: o Espírito de Yahweh apoderou-se dele com ímpeto
  rationale: A construção recorrente em Juízes retrata uma ação súbita e poderosa do Espírito. 'Apoderou-se dele com ímpeto' conserva essa força em português natural sem desenvolver uma categoria teológica não expressa pelo texto.
- source_word: הָעֲבֹתִים
  choice: as cordas
  rationale: Designa cordas ou cabos usados para prender. 'Cordas' é claro, corrente e adequado ao contexto.
- source_word: זְרוֹעֹתָיו
  choice: seus braços
  rationale: זְרוֹעַ denota o braço sem exigir a especificação anatômica 'antebraço'.
- source_word: כַּפִּשְׁתִּים אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: como linho queimado pelo fogo
  rationale: פִשְׁתִּים pode designar o linho ou suas fibras. A formulação reproduz de maneira concisa a imagem de fibras de linho que perdem a resistência ao serem queimadas.
- source_word: וַיִּמַּסּוּ אֱסוּרָיו מֵעַל יָדָיו
  choice: suas amarras se desfizeram e caíram de suas mãos
  rationale: מסס traz a imagem de derreter ou dissolver. 'Se desfizeram' preserva o resultado metafórico em português idiomático, enquanto 'caíram de suas mãos' explicita naturalmente o afastamento expresso por מֵעַל sem interpretar יָדָיו como 'pulsos'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal da aliança e segue a orientação terminológica fornecida, sem substituí-lo por um título.
- issue: Natureza da ação do Espírito sobre Sansão
  choice: o Espírito de Yahweh apoderou-se dele com ímpeto
  alternative: o Espírito de Yahweh veio poderosamente sobre ele
  rationale: A tradução mantém a apresentação narrativa de uma capacitação divina súbita e vigorosa, sem importar categorias teológicas posteriores nem definir além do texto a relação entre o Espírito e Sansão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usou-se 'Leí', forma transparente em português, e uma sintaxe narrativa fluente. A imagem das cordas e amarras foi mantida sem identificar indevidamente as mãos com os pulsos.
