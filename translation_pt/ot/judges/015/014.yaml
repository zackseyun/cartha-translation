revisions:
- from: Quando ele chegou a Leí[a], os filisteus vieram ao seu encontro aos gritos. Então o Espírito de Yahweh apoderou-se dele com ímpeto, e as cordas que estavam em seus braços tornaram-se como linho queimado pelo fogo; suas amarras se desfizeram e caíram de suas mãos.
  to: Quando ele chegou a Leí[a], os filisteus vieram ao seu encontro aos gritos. Então o Espírito de Yahweh irrompeu sobre ele, e as cordas que estavam em seus braços se tornaram como linho queimado pelo fogo; suas amarras se derreteram de suas mãos.
  rationale: 'A revisão preserva a imagem verbal do hebraico: o Espírito irrompe subitamente sobre Sansão, e as amarras «derretem-se» de suas mãos. Ela remove a afirmação adicional de que as amarras caíram, sem alterar o sentido narrativo nem a ambiguidade anatômica de «mãos».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:08:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem a sequência narrativa e os principais termos do hebraico: Leí como topônimo, o brado dos filisteus, a ação súbita do Espírito de Yahweh, as cordas nos braços e a comparação com o linho exposto ao fogo. Contudo, «se desfizeram e caíram» substitui a imagem explícita de «derreteram-se» (וַיִּמַּסּוּ) e acrescenta a queda das amarras, que o texto não afirma.'
  naturalness: O português é moderno, claro e adequado ao registro narrativo. «Irrompeu sobre ele» expressa com maior proximidade e naturalidade a força súbita de וַתִּצְלַח עָלָיו, sem a possível conotação de possessão em «apoderou-se dele».
  terminology: «Yahweh», «Espírito», «filisteus», «cordas», «braços» e «amarras» são consistentes e apropriados. «Leí» é uma forma portuguesa viável para o topônimo; a nota preserva corretamente o jogo lexical com «queixada».
  issues:
  - severity: medium
    issue: «suas amarras se desfizeram e caíram de suas mãos»
    rationale: וַיִּמַּסּוּ significa literalmente «derreteram-se/dissolveram-se», e não menciona que as amarras caíram. A formulação deve manter a metáfora de derretimento e evitar esse acréscimo narrativo.
  - severity: low
    issue: «o Espírito de Yahweh apoderou-se dele com ímpeto»
    rationale: A frase é possível, mas «apoderar-se» pode sugerir uma nuance de tomada de posse que não é necessária. «Irrompeu sobre ele» reproduz mais diretamente o dinamismo de צלח nesta fórmula recorrente de Juízes.
  revised_text: Quando ele chegou a Leí[a], os filisteus vieram ao seu encontro aos gritos. Então o Espírito de Yahweh irrompeu sobre ele, e as cordas que estavam em seus braços se tornaram como linho queimado pelo fogo; suas amarras se derreteram de suas mãos.
  revised_footnotes:
