    text: Leí é o nome de um lugar; em hebraico, a palavra também significa “queixada”, imagem importante no contexto imediato.
    reason: lexical_alternative
  revision_rationale: 'A revisão preserva a imagem verbal do hebraico: o Espírito irrompe subitamente sobre Sansão, e as amarras «derretem-se» de suas mãos. Ela remove a afirmação adicional de que as amarras caíram, sem alterar o sentido narrativo nem a ambiguidade anatômica de «mãos».'
