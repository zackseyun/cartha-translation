base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: pt
  text: Quando acabou de falar, Sansão lançou a queixada de sua mão e chamou aquele lugar de Ramate-Leí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ramate-Leí” significa “Altura da Queixada” ou “Colina da Queixada”, preservando o jogo de palavras com leí, “queixada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Quando acabou de falar
  rationale: A preposição כְּ com o infinitivo construto de כלה expressa uma relação temporal. A formulação é natural em português e mantém a sequência narrativa.
- source_word: וַיַּשְׁלֵךְ
  choice: atirou
  rationale: O verbo indica lançar ou jogar. “Atirou” comunica claramente a ação sem a intensidade adicional que “arremessou” poderia sugerir.
- source_word: הַלְּחִי
  choice: a queixada
  rationale: No contexto, trata-se da queixada de jumento usada como arma por Sansão. “Queixada” é a designação tradicional e clara em português.
- source_word: מִיָּדוֹ
  choice: que tinha na mão
  rationale: Reformula naturalmente o hebraico literal “de sua mão”, preservando a informação de que o objeto estava na mão dele no momento em que foi lançado.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: chamou aquele lugar de
  rationale: Em uma construção de nomeação, esta é a forma idiomática em português para o hebraico “chamou àquele lugar”.
- source_word: רָמַת לֶחִי
  choice: Ramate-Leí
  rationale: O topônimo é transliterado no texto principal, enquanto seu sentido e o jogo de palavras com לֶחִי, “queixada”, são explicados em nota.
theological_decisions: []
translation_notes:
