review_pass:
  verdict: revise
  source_fidelity: 'O texto principal representa com precisão o hebraico: a sede intensa de Sansão, seu apelo a Yahweh, a atribuição da grande libertação a Deus por meio de seu servo, e a pergunta retórica sobre morrer de sede e cair no poder dos incircuncisos. «Nas mãos» é uma adaptação idiomática portuguesa aceitável para o hebraico singular «na mão de».'
  naturalness: A redação é clara, digna e natural em português moderno. O uso de «Tu» e «teu» mantém um registro de oração coerente sem comprometer a legibilidade. A nota a, porém, empregava «chamou por Yahweh», formulação que em português pode sugerir que Sansão mandava chamar Yahweh, não que lhe dirigia um apelo.
  terminology: «Yahweh», «servo», «grande libertação» e «incircuncisos» são escolhas adequadas e preservam os termos e a carga retórica do texto-fonte. A nota cultural identifica os filisteus como referente contextual sem substituir indevidamente a designação hebraica no texto.
  issues:
  - severity: medium
    issue: 'A nota a trazia «Ou: “chamou por Yahweh”».'
    rationale: Em português, «chamar por alguém» pode significar pedir que essa pessoa venha, o que não expressa com clareza o sentido de apelo/oração de וַיִּקְרָא אֶל יְהוָה. «Apelou a Yahweh» é uma alternativa semanticamente segura.
  - severity: low
    issue: A nota b tinha discordância em «pode ser traduzido».
    rationale: O sujeito é a expressão feminina «esta grande libertação»; a forma correta é «pode ser traduzida».
