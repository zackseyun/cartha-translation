base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: pt
  text: 'Ele ficou com muita sede e clamou a Yahweh[a], dizendo: “Tu concedeste esta grande libertação[b] pela mão do teu servo. E agora, morrerei de sede e cairei nas mãos dos incircuncisos[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apelou a Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: “Esta grande libertação” também pode ser traduzida por “esta grande vitória” ou “esta grande salvação”.
    reason: lexical_alternative
  - marker: c
    text: “Os incircuncisos” refere-se aqui aos inimigos de Israel, especialmente aos filisteus. É uma expressão marcada pela linguagem da aliança, e não apenas um nome étnico.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: ficou com muita sede
  rationale: Expressa de modo natural em português o estado intenso de sede indicado por צמא com מְאֹד, preservando no contexto a ideia de que Sansão passou a sofrer grande sede.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: clamou a Yahweh
  rationale: קרא אל, neste contexto de súplica, indica dirigir um apelo a alguém. “Clamou a” transmite a oração urgente sem acrescentar conteúdo ausente do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַתָּה נָתַתָּ
  choice: Tu concedeste
  rationale: O perfeito hebraico descreve a ação já realizada. “Concedeste” ressalta que a libertação veio de Yahweh e se ajusta ao registro de oração.
- source_word: בְיַד עַבְדְּךָ
  choice: pela mão do teu servo
  rationale: Preserva a imagem hebraica de mão como meio ou agência, enquanto “teu servo” mantém a autodesignação deferente de Sansão diante de Deus.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: esta grande libertação
  rationale: תשועה pode designar libertação, salvação ou vitória. “Libertação” conserva tanto o resgate militar imediato quanto sua dimensão teológica.
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém a transição contrastiva e irônica entre a grande libertação recém-concedida e o perigo presente.
- source_word: אָמוּת בַּצָּמָא
  choice: morrerei de sede
  rationale: A preposição ב indica aqui causa ou circunstância. A pontuação interrogativa comunica a força retórica da frase, embora o hebraico não use partícula interrogativa explícita.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: e cairei nas mãos de
  rationale: Reproduz em português corrente o idioma hebraico de cair sob o poder de alguém.
- source_word: הָעֲרֵלִים
  choice: os incircuncisos
  rationale: Mantém a designação literal e carregada de sentido pactual, em vez de substituí-la diretamente pelo referente étnico, os filisteus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o nome pactual. “Yahweh” preserva o nome pessoal em transliteração, sem trocá-lo por um título.
- issue: Sentido de הַתְּשׁוּעָה
  choice: libertação
  alternative: vitória ou salvação
  rationale: No contexto, a palavra abrange a vitória concreta dada por Deus e o livramento resultante. “Libertação” preserva essa amplitude sem restringir o termo ao êxito militar nem impor uma acepção soteriológica posterior.
- issue: Força pactual de הָעֲרֵלִים
  choice: os incircuncisos
  alternative: os filisteus
  rationale: A expressão contrasta Israel com aqueles que não possuem o sinal da aliança. A tradução literal mantém essa tensão retórica e teológica; a nota identifica o referente contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “tu” preserva o discurso direto solene sem arcaísmo excessivo. A ordem foi levemente ajustada para fluência, mantendo as imagens hebraicas centrais de agir “pela mão” do servo e cair “nas mãos” dos inimigos.
