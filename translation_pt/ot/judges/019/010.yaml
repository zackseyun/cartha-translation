base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: pt
  text: Mas o homem não quis passar a noite. Levantou-se, partiu e chegou em frente a Jebus (isto é[a], Jerusalém). Com ele estavam dois jumentos selados e sua concubina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas proximidades de Jebus” ou “num ponto em frente a Jebus”. A expressão hebraica indica um lugar diante da cidade, e não claramente dentro dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: não quis
  rationale: Expressa falta de disposição ou consentimento deliberado; é uma formulação natural em português sem intensificar o sentido para uma recusa hostil.
- source_word: לָלוּן
  choice: passar a noite ali
  rationale: O infinitivo indica permanecer durante a noite; a inclusão de “ali” explicita naturalmente o valor locativo implícito no contexto.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: Levantou-se, partiu e chegou
  rationale: Mantém as três ações consecutivas e o ritmo narrativo do hebraico, com coordenação natural em português.
- source_word: עַד נֹכַח
  choice: chegou diante de
  rationale: Preserva a ideia espacial de alcançar um ponto em frente ou nas proximidades da cidade, sem afirmar que o homem entrou nela.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: Jebus (isto é, Jerusalém)
  rationale: Reproduz a identificação explicativa do antigo nome com Jerusalém por meio de um aparte claro.
- source_word: צֶמֶד חֲמוֹרִים
  choice: dois jumentos
  rationale: צֶמֶד designa um par; “dois jumentos” é mais direto e corrente em português do que “um par de jumentos”.
- source_word: חֲבוּשִׁים
  choice: selados
  rationale: No contexto de animais preparados para viagem, o particípio indica que estavam aparelhados, provavelmente com selas; “selados” é conciso e claro.
- source_word: פִּילַגְשׁוֹ
  choice: sua concubina
  rationale: Mantém o termo social específico do hebraico sem substituí-lo por uma interpretação como “esposa secundária”.
