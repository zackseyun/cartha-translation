  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: pt
  text: 'Ele lhe respondeu: “Estamos viajando de Belém de Judá para os confins da região montanhosa de Efraim. Eu sou de lá e fui até Belém de Judá. Estou indo à casa de Yahweh[a], mas homem nenhum me acolhe em sua casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou indo para casa” ou “para minha casa”. Alguns entendem o hebraico aqui de modo idiomático ou como reflexo de outra leitura, pois “a casa de Yahweh” é inesperado neste contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: Estamos de passagem
  rationale: O particípio de עבר com o pronome indica deslocamento em curso. A expressão portuguesa comunica naturalmente que o grupo está em trânsito.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: vindo de Belém de Judá
  rationale: Identifica a cidade por sua região e, junto de “Estamos de passagem”, expressa de modo natural o ponto de partida.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: os confins da região montanhosa de Efraim
  rationale: יַרְכְּתֵי designa extremidades ou lugares remotos; “confins” conserva essa ideia, e הַר אֶפְרַיִם é o nome geográfico da região montanhosa de Efraim.
- source_word: מִשָּׁם אָנֹכִי
  choice: Eu sou de lá
  rationale: Reproduz diretamente a declaração de origem.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: e fui até Belém de Judá
  rationale: Mantém o valor passado mais natural da forma narrativa de הלך sem harmonizar a descrição do percurso.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: Agora estou indo à casa de Yahweh
  rationale: Segue a leitura explícita do Texto Massorético, “casa de Yahweh”. “Agora” torna clara em português a retomada do deslocamento presente sem alterar seu conteúdo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: mas homem nenhum me acolhe em sua casa
  rationale: Neste contexto de hospitalidade, אסף significa receber ou acolher alguém. “Homem nenhum” conserva o singular masculino אִישׁ, e “em sua casa” explicita naturalmente o sentido direcional de הַבָּיְתָה.
theological_decisions:
- issue: Sentido de וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: Agora estou indo à casa de Yahweh
  alternative: Agora estou indo para casa / para minha casa
  rationale: O texto hebraico massorético diz literalmente “casa de Yahweh”. Embora a expressão seja contextualmente inesperada e alguns proponham uma compreensão idiomática ou outra leitura, o texto principal preserva a evidência hebraica, e a alternativa consta em nota.
- issue: Masculino singular אִישׁ
  choice: homem nenhum
  alternative: ninguém
  rationale: A escolha mantém o substantivo masculino singular do hebraico e se ajusta ao contexto cultural de um chefe de família que oferece hospedagem, sem tornar a frase ininteligível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. “Região montanhosa” evita o sentido de uma única montanha; “acolhe em sua casa” comunica o costume de hospitalidade sem linguagem excessivamente literal. A dificuldade textual em “casa de Yahweh” foi preservada, não resolvida silenciosamente.
