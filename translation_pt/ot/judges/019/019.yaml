base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: pt
  text: Além disso,[a] há palha e forragem para os nossos jumentos, e há pão e vinho para mim, para sua serva[b] e para o jovem que está com seus servos. Não falta coisa alguma.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “E também há palha, também forragem... e também pão e vinho...”. O hebraico repete “também” para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: “Sua serva” é uma maneira respeitosa de se referir à mulher que viajava com ele.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Não nos falta nada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... גַם ... וְגַם
  choice: Além disso ... e
  rationale: A sequência hebraica repete a partícula aditiva para dar ênfase. A tradução usa uma abertura aditiva natural em português e registra a repetição literal em nota.
- source_word: תֶּבֶן
  choice: palha
  rationale: Designa palha usada para alimentar os animais ou lhes servir de cama; é o equivalente corrente e concreto em português.
- source_word: מִסְפּוֹא
  choice: forragem
  rationale: Refere-se especificamente a alimento para animais e mantém a distinção em relação ao pão e ao vinho destinados às pessoas.
- source_word: לַחֲמוֹרֵינוּ
  choice: para os nossos jumentos
  rationale: Preserva tanto o referente animal quanto o sufixo possessivo de primeira pessoa do plural.
- source_word: לֶחֶם וָיַיִן
  choice: pão e vinho
  rationale: Mantém os dois mantimentos concretamente nomeados no hebraico.
- source_word: יֵשׁ ... יֶשׁ
  choice: há ... há
  rationale: Conserva a construção existencial do hebraico e a ênfase na disponibilidade das provisões, sem tornar a frase artificial em português.
- source_word: אֲמָתֶךָ
  choice: esta sua serva
  rationale: Reproduz a forma feminina e deferente pela qual o homem se refere à mulher que viaja com ele; 'esta' deixa claro que não se trata literalmente de uma serva do anfitrião.
- source_word: לַנַּעַר
  choice: para o jovem
  rationale: Preserva o sentido amplo de נַעַר, que neste contexto pode designar um jovem acompanhante ou ajudante.
- source_word: עִם עֲבָדֶיךָ
  choice: que está com estes seus servos
  rationale: Liga a expressão ao jovem, como sugere a sintaxe, e entende 'seus servos' como uma autodescrição respeitosa do viajante e de seu grupo diante do anfitrião.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: Não falta coisa alguma
  rationale: Expressa de modo natural e próximo ao hebraico a suficiência completa das provisões.
