base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: Then the man rose to go[a], he and his concubine and his young man; but his father-in-law, the young woman’s father, said to him, “Look now, the day is waning toward evening. Please stay the night. Look, the day is drawing to a close. Spend the night here, and let your heart be glad. Then tomorrow you may rise early for your journey[c][b], and go to your tent.”
translation:
  language: pt
  text: 'Então o homem se levantou para partir, ele, sua concubina e seu ajudante[a]. Mas seu sogro, o pai da jovem, lhe disse: “Veja, o dia já declina para o entardecer. Por favor, passem a noite. Veja, o dia está chegando ao fim[b]. Passe a noite aqui e alegre o seu coração. Amanhã vocês poderão se levantar cedo para seguir viagem, e você irá para a sua tenda[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu jovem”; o termo também pode designar um servo ou acompanhante.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o dia está acampando”, isto é, está chegando ao fim.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, pelo sentido contextual: “para casa”. Literalmente, “para a sua tenda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém o termo narrativo comum אִישׁ sem especificá-lo como marido ou levita neste ponto.
- source_word: פִילַגְשׁוֹ
  choice: sua concubina
  rationale: Preserva a categoria social expressa por פִילֶגֶשׁ, sem suavizá-la para simplesmente “esposa”.
- source_word: נַעֲרוֹ
  choice: seu ajudante
  rationale: No contexto de viagem, נַעַר provavelmente designa o jovem que o acompanhava e servia; “ajudante” é claro em português, enquanto a nota conserva a alternativa mais literal.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: o dia já declina para o entardecer
  rationale: Expressa de modo natural o enfraquecimento ou declínio do dia rumo à noite, preservando a imagem temporal do hebraico.
- source_word: לִינוּ נָא
  choice: Por favor, passem a noite aqui
  rationale: O imperativo está no plural e se dirige ao grupo de viajantes; a formulação comunica tanto o pedido cortês quanto a hospedagem noturna.
- source_word: חֲנוֹת הַיּוֹם
  choice: o dia está chegando ao fim
  rationale: Comunica o sentido contextual da expressão incomum, cuja imagem literal é a do dia acampando ou se instalando.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: alegre o seu coração
  rationale: Preserva a referência hebraica ao coração e transmite a ideia de desfrutar bem-estar e alegria durante a estadia.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  choice: Amanhã vocês poderão se levantar cedo
  rationale: Mantém o plural do verbo, que inclui o grupo de viajantes, e apresenta a proposta de modo natural.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: e você irá para a sua tenda
  rationale: Mantém a mudança para o singular e a imagem concreta de “tenda”, sem substituí-la silenciosamente por “casa”.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros. As alternâncias entre plural e singular no discurso foram mantidas porque correspondem às formas hebraicas: o sogro primeiro se dirige ao grupo, depois ao homem, volta a incluir os viajantes e conclui falando novamente ao homem.'
