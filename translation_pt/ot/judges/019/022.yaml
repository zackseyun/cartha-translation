review_pass:
  verdict: revise
  source_fidelity: 'O texto transmite adequadamente a progressão do hebraico: o divertimento dos hóspedes, a chegada abrupta dos homens da cidade, o cerco à casa, as batidas insistentes e a exigência final. O eufemismo ידע (“conhecer”) é preservado no texto e explicado corretamente em nota. A nota a, porém, não apresenta de modo confiável a expressão אַנְשֵׁי בְנֵי־בְלִיַּעַל.'
  naturalness: A redação é clara e de registro apropriado. “Enquanto se alegravam” e “batiam com força à porta” soam mais naturais e refletem melhor a ação em curso do particípio hebraico do que “começaram a bater”. “Homem idoso” evita o tom potencialmente áspero de “o velho”, sem alterar o sentido.
  terminology: “Homens perversos” é uma boa tradução idiomática de “filhos de Belial”. A alternativa literal da nota deve usar “Belial”, ou explicar o valor idiomático de “beliyaal”, e não “indignidade”, que não é uma equivalência lexical segura. “Dono da casa” é aceitável para בעל הבית neste contexto.
  issues:
