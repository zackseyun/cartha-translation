base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: pt
  text: 'Enquanto se alegravam, eis que os homens da cidade, homens perversos[a], cercaram a casa e batiam com força à porta. Disseram ao homem idoso, dono da casa: “Ponha para fora o homem que entrou em sua casa, para que o conheçamos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “homens, filhos de Belial”; isto é, homens sem valor ou perversos.
    reason: lexical_alternative
  - marker: b
    text: 'Aqui, “conhecer” é um eufemismo sexual: eles pretendiam violentá-lo sexualmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: alegravam o coração
  rationale: Preserva de modo natural a imagem do idioma hebraico, que descreve a satisfação festiva dos presentes.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém o marcador discursivo que assinala a mudança abrupta e ameaçadora da cena.
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Tradução direta e clara da expressão hebraica.
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: homens perversos
  rationale: Expressa o valor idiomático de pessoas moralmente corruptas ou sem lei; a forma mais literal é registrada em nota.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: cercaram a casa
  rationale: Comunica com clareza a ação de rodear o edifício.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: começaram a bater com força na porta
  rationale: O particípio sugere golpes repetidos e agressivos; esta formulação é natural em português e explicita sua força.
- source_word: בַּעַל הַבַּיִת
  choice: o dono da casa
  rationale: Identifica naturalmente em português o homem responsável pela casa, sem sugerir um título formal.
- source_word: הַזָּקֵן
  choice: o velho
  rationale: Neste contexto, a expressão o identifica pela idade, e não por um cargo institucional.
- source_word: הוֹצֵא
  choice: Ponha para fora
  rationale: Transmite a ordem de fazer o hóspede sair da casa e soa natural no discurso direto.
- source_word: וְנֵדָעֶנּוּ
  choice: para que o conheçamos
  rationale: Preserva o eufemismo sexual hebraico e sua ligação literária com Gênesis 19, enquanto a nota esclarece a intenção violenta.
theological_decisions:
- issue: Sentido do eufemismo sexual וְנֵדָעֶנּוּ
  choice: Preservar no texto a expressão “para que o conheçamos” e esclarecer seu sentido sexual em nota.
  alternative: “para que tenhamos relações sexuais com ele” ou “para que o violentemos”
  rationale: O verbo hebraico conserva um eufemismo deliberado, mas o contexto indica intenção de violência sexual. A combinação de texto e nota preserva a forma literária sem ocultar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se a imagem idiomática do coração, a brusquidão de “eis que” e o eufemismo sexual do original, esclarecido em nota.
