    rationale: אַנְשֵׁי בְנֵי־בְלִיַּעַל é a expressão idiomática “homens, filhos de Belial” (isto é, homens sem valor/perversos). “Indignidade” não representa adequadamente בְלִיַּעַל e pode induzir uma análise lexical incorreta.
  - severity: low
    issue: “Começaram a bater com força” introduz um aspecto incoativo não expresso explicitamente pelo particípio hebraico.
    rationale: O particípio מִתְדַּפְּקִים descreve batidas repetidas que acompanham o cerco; “batiam com força à porta” mantém essa ação em curso de maneira direta.
