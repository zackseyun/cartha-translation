base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: pt
  text: Assim, eles passaram adiante e seguiram viagem. O sol se pôs quando estavam perto de Gibeá, que pertence a Benjamim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ficava no território de Benjamim”. A expressão hebraica associa Gibeá à tribo ou ao território de Benjamim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: passaram adiante
  rationale: O verbo עבר, na sequência narrativa, indica que prosseguiram além da opção anterior; a expressão mantém esse sentido sem reduzir o verbo a um movimento genérico.
- source_word: וַיֵּלֵכוּ
  choice: seguiram viagem
  rationale: Traduz הלך de modo natural e preserva o segundo verbo de movimento da narrativa hebraica, sem redundância excessiva em português.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: O sol se pôs quando estavam
  rationale: A expressão, literalmente próxima de 'o sol veio para eles', descreve o pôr do sol alcançando os viajantes. Esta formulação comunica naturalmente o sentido contextual.
- source_word: אֵצֶל
  choice: perto de
  rationale: Expressa com clareza a proximidade indicada pela preposição no contexto da viagem.
- source_word: הַגִּבְעָה
  choice: Gibeá
  rationale: Neste contexto, o termo designa a localidade, não simplesmente 'a colina'; emprega-se a forma tradicional portuguesa do topônimo.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: que pertence a Benjamim
  rationale: A construção identifica a associação tribal ou territorial de Gibeá com Benjamim, preservando a concisão do hebraico.
- source_word: בִנְיָמִן
  choice: Benjamim
  rationale: Forma consagrada em português para o nome próprio e tribal.
