  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ ק֥וּמִי וְ/נֵלֵ֖כָה וְ/אֵ֣ין עֹנֶ֑ה וַ/יִּקָּחֶ֨/הָ֙ עַֽל הַ/חֲמ֔וֹר וַ/יָּ֣קָם הָ/אִ֔ישׁ וַ/יֵּ֖לֶךְ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: pt
  text: 'Ele lhe disse: “Levante-se, e vamos embora”. Mas não houve resposta.[a] Então ele a colocou sobre o jumento.[b] O homem se levantou e foi para o seu lugar.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não havia quem respondesse” ou “não havia ninguém respondendo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Então ele a pegou e a pôs sobre o jumento”. O verbo hebraico significa literalmente “tomar” ou “pegar”, aqui com o sentido contextual de levantar ou colocar a mulher sobre o animal.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “foi para casa”. Hebraico: “para o seu lugar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Ele lhe disse
  rationale: Reproduz naturalmente em português a sequência narrativa e mantém explícito que ele falou à mulher.
- source_word: קוּמִי
  choice: Levante-se
  rationale: Imperativo feminino singular de קום; é uma ordem direta, natural e digna em português moderno.
- source_word: וְנֵלֵכָה
  choice: e vamos embora
  rationale: O coortativo na primeira pessoa do plural expressa exortação conjunta; “vamos embora” comunica com naturalidade o movimento de partida indicado pelo contexto.
- source_word: וְאֵין עֹנֶה
  choice: Mas não houve resposta
  rationale: A expressão significa literalmente que não havia quem respondesse. “Mas” explicita a relação adversativa contextual sem alterar o sentido.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: Então ele a colocou sobre o jumento
  rationale: Embora לקח signifique basicamente “tomar/pegar”, com עַל הַחֲמוֹר o contexto indica que ele a levantou ou colocou sobre o animal.
- source_word: וַיָּקָם הָאִישׁ
  choice: O homem se levantou
  rationale: Mantém a ação de קום distinta do verbo seguinte, “ir”, preservando a sequência narrativa hebraica.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: e foi para o seu lugar
  rationale: Conserva a amplitude semântica de מָקוֹם; no contexto, pode designar sua casa ou localidade, mas o hebraico diz literalmente “seu lugar”.
theological_decisions: []
translation_notes:
  register: 'Português moderno, amplamente internacional, com boa legibilidade brasileira. A tradução mantém tom narrativo sóbrio e direto. Os marcadores foram posicionados junto às expressões que efetivamente explicam: [a] após a falta de resposta, [b] após a colocação sobre o jumento e [c] após “seu lugar”.'
