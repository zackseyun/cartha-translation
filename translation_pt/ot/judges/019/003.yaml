base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: pt
  text: Então seu marido se levantou e foi atrás dela, para falar ao coração dela[a] e trazê-la de volta[b]. Seu jovem servo estava com ele, bem como um par de jumentos. Ela o levou à casa de seu pai; quando o pai da jovem o viu, alegrou-se ao encontrá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “falar ao coração dela”, expressão que pode indicar falar com ternura ou de modo persuasivo.'
    reason: lexical_alternative
  - marker: b
    text: A forma hebraica de “trazê-la de volta” é textualmente difícil; o contexto indica que a mulher é o objeto pretendido.
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: seu marido
  rationale: Embora a expressão seja literalmente “seu homem”, o contexto de uma relação conjugal favorece o português natural “seu marido”.
- source_word: אַחֲרֶיהָ
  choice: foi atrás dela
  rationale: Expressa de modo natural o movimento de segui-la até o lugar para onde ela havia ido.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: falar ao coração dela
  rationale: Preserva a imagem do hebraico e sua abertura semântica entre falar com ternura e procurar persuadir.
- source_word: ל/השיב/ו
  choice: trazê-la de volta
  rationale: O contexto indica que a intenção do homem era levar a mulher de volta, embora a forma textual do sufixo seja difícil.
- source_word: נַעֲרוֹ
  choice: seu jovem servo
  rationale: נַעַר pode indicar tanto juventude quanto função de ajudante; a escolha comunica os dois aspectos neste contexto de viagem.
- source_word: צֶמֶד חֲמֹרִים
  choice: um par de jumentos
  rationale: צֶמֶד designa um par; “jumentos” é uma designação portuguesa comum e exata para os animais.
- source_word: וַתְּבִיאֵהוּ
  choice: Ela o levou
  rationale: A forma verbal feminina singular aponta para a mulher como sujeito, e o sufixo masculino para o marido como objeto.
- source_word: הַנַּעֲרָה
  choice: a jovem
  rationale: Traduz o termo usado nesta oração sem substituir sua designação por “concubina”, empregada no contexto mais amplo.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: alegrou-se ao encontrá-lo
  rationale: Reproduz diretamente a alegria do pai diante do encontro, em linguagem portuguesa natural e digna.
