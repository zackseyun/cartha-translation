id: JDG.19.1
reference: Judges 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: pt
  text: Naqueles dias, quando não havia rei em Israel,[a] um levita morava numa região distante da serra de Efraim. Ele tomou para si uma mulher, uma concubina,[b] de Belém de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Naqueles dias, não havia rei em Israel”. O hebraico usa uma oração coordenada, que pode ser entendida como declaração separada ou como pano de fundo temporal.'
    reason: alternative_reading
  - marker: b
    text: “Concubina” refere-se a uma mulher numa união reconhecida, mas de posição social inferior à de uma esposa; não significa apenas uma parceira ocasional.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: A fórmula narrativa abre um novo episódio. Em português atual, “Naqueles dias” preserva a expressão temporal e o tom literário sem recorrer ao arcaísmo “e aconteceu que”.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: quando não havia rei em Israel
  rationale: Embora formalmente coordenada, a oração pode funcionar como pano de fundo temporal. A nota conserva a possibilidade de entendê-la como declaração independente.
- source_word: אִישׁ לֵוִי
  choice: um levita
  rationale: Em português, “levita” já designa naturalmente um homem pertencente ao grupo; explicitar “homem levita” seria pouco idiomático sem acrescentar informação necessária.
- source_word: גָּר
  choice: morava
  rationale: O verbo pode envolver residência temporária ou como forasteiro, mas aqui “morava” comunica com naturalidade o sentido contextual sem impor uma condição jurídica não explicitada.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: numa região distante da serra de Efraim
  rationale: יַרְכְּתֵי indica os confins ou partes remotas, e הַר אֶפְרַיִם designa a região montanhosa de Efraim, não uma montanha isolada.
- source_word: וַיִּקַּח לוֹ
  choice: Ele tomou para si
  rationale: Preserva a nuance reflexiva do pronome לֹו e a linguagem do texto para o estabelecimento da união.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: uma mulher, uma concubina
  rationale: Mantém os dois substantivos e a aposição do hebraico, sem reduzir a expressão apenas ao estatuto social da mulher.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Belém de Judá
  rationale: Forma portuguesa clara e tradicional que distingue esta Belém por sua localização em Judá.
theological_decisions:
- issue: O refrão de Juízes sobre a ausência de rei
  choice: quando não havia rei em Israel
  alternative: e não havia rei em Israel
  rationale: A tradução apresenta a ausência de rei como contexto narrativo, sem acrescentar juízo favorável ou contrário à monarquia. A alternativa coordenada, igualmente possível no hebraico, é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência natural, preservando o refrão narrativo, a localização remota e a aposição “uma mulher, uma concubina”.
