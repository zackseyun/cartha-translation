  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: pt
  text: 'Ele disse ao seu jovem ajudante[a]: “Vamos![b] Sigamos até um destes lugares e passemos a noite em Gibeá ou em Ramá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “ao seu servo” ou “ao seu acompanhante”.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Vai!”; neste contexto, trata-se de um convite para seguirem juntos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: ao seu jovem ajudante
  rationale: נַעַר pode designar um jovem, servo ou ajudante. No contexto, trata-se do homem que acompanha e auxilia o levita; “jovem ajudante” preserva tanto a possível ideia de juventude quanto sua função, sem definir em excesso sua condição social.
- source_word: לְךָ
  choice: Vamos!
  rationale: Embora a forma imperativa de הלך signifique literalmente “vai”, ela introduz aqui um convite ao movimento conjunto, confirmado pelo coortativo seguinte. “Vamos!” expressa isso de modo natural em português.
- source_word: וְנִקְרְבָה
  choice: Sigamos até
  rationale: O coortativo indica proposta ou resolução conjunta. No contexto de viagem, “sigamos até” comunica com naturalidade o movimento de aproximação, sem sugerir necessariamente entrada imediata na cidade.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: um destes lugares
  rationale: A expressão indica um dentre os lugares próximos considerados pelo falante, identificados em seguida como Gibeá e Ramá. O demonstrativo “destes” torna natural essa referência contextual.
- source_word: וְלַנּוּ
  choice: e passemos a noite
  rationale: O verbo לון significa alojar-se ou permanecer durante a noite. “Passar a noite” é a formulação corrente e clara em português.
- source_word: בַגִּבְעָה
  choice: em Gibeá
  rationale: O topônimo é transliterado na forma portuguesa tradicional, e “em” é a preposição natural para a permanência dentro de uma localidade.
- source_word: בָרָמָה
  choice: em Ramá
  rationale: O topônimo é transliterado na forma portuguesa tradicional, em paralelo com Gibeá.
