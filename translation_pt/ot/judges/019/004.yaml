base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: pt
  text: O sogro dele, pai da jovem, insistiu para que ele ficasse[a], e ele permaneceu com ele durante três dias. Eles comeram, beberam e passaram as noites ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prevaleceu sobre ele”, “pressionou-o” ou “o reteve”. A expressão idiomática hebraica diz literalmente que o sogro “foi forte com/contra ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: insistiu para que ele ficasse
  rationale: A expressão idiomática com חזק e a preposição ב sugere exercer forte insistência sobre alguém. O complemento “para que ele ficasse” é inferido naturalmente da oração seguinte, sem atribuir coerção física ao sogro.
- source_word: חֹתְנוֹ
  choice: o sogro dele
  rationale: O termo indica aqui o parentesco por casamento visto da perspectiva do levita; “sogro” é a designação portuguesa natural.
- source_word: אֲבִי הַנַּעֲרָה
  choice: pai da jovem
  rationale: A expressão em aposição esclarece quem era o sogro. “Jovem” comunica נַעֲרָה adequadamente no contexto de uma mulher casada, sem sugerir que fosse criança.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: e ele permaneceu com ele
  rationale: ישב pode significar sentar-se, habitar ou permanecer. Neste contexto, “permaneceu” expressa a continuação da hospedagem.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: durante três dias
  rationale: Tradução temporal direta; “durante” torna natural em português a extensão da permanência.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: Eles comeram, beberam
  rationale: Os dois verbos simples são preservados separadamente, sem condensá-los na interpretação mais específica “festejaram”.
- source_word: וַיָּלִינוּ שָׁם
  choice: e passaram as noites ali
  rationale: לון se refere a passar a noite ou pernoitar. O plural “as noites” comunica a repetição ao longo dos três dias.
theological_decisions: []
