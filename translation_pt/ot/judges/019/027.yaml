source:
  edition: WLC
  text: וַ/יָּ֨קָם אֲדֹנֶ֜י/הָ בַּ/בֹּ֗קֶר וַ/יִּפְתַּח֙ דַּלְת֣וֹת הַ/בַּ֔יִת וַ/יֵּצֵ֖א לָ/לֶ֣כֶת לְ/דַרְכּ֑/וֹ וְ/הִנֵּ֧ה הָ/אִשָּׁ֣ה פִֽילַגְשׁ֗/וֹ נֹפֶ֨לֶת֙ פֶּ֣תַח הַ/בַּ֔יִת וְ/יָדֶ֖י/הָ עַל הַ/סַּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: pt
  text: Seu senhor levantou-se pela manhã, abriu as portas da casa e saiu para seguir seu caminho. E eis que a mulher, sua concubina, jazia[a] à entrada da casa, com as mãos sobre a soleira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “estava caída”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: seu senhor
  rationale: Preserva o sentido de autoridade e a relação social assimétrica expressa por אֲדוֹן, sem substituí-lo por “marido”, que tornaria a relação mais recíproca do que o hebraico indica.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: as portas da casa
  rationale: Mantém o plural hebraico דַּלְתוֹת e a referência concreta à casa.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: saiu para seguir seu caminho
  rationale: Reproduz a construção de finalidade e conserva o idioma hebraico em português natural.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém o marcador discursivo que chama vividamente a atenção para a cena inesperada.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: a mulher, sua concubina
  rationale: Preserva a estrutura apositiva e traduz פִילֶגֶשׁ pelo termo português convencional e preciso “concubina”.
- source_word: נֹפֶלֶת
  choice: jazia
  rationale: Expressa de modo natural o estado em que ela se encontrava, sem afirmar por si só se estava viva ou morta; a forma mais literal, “estava caída”, é registrada em nota.
- source_word: פֶּתַח הַבַּיִת
  choice: à entrada da casa
  rationale: Traduz claramente o local designado por פֶּתַח, a abertura ou entrada da casa.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: com as mãos sobre a soleira
  rationale: Converte a oração nominal hebraica numa construção portuguesa fluente, preservando a imagem concreta e traduzindo סַף por “soleira”.
theological_decisions:
- issue: O estado da mulher neste versículo
  choice: Não declarar aqui que ela estava morta
  alternative: Explicitar que seu corpo estava sem vida
  rationale: O particípio נֹפֶלֶת descreve sua posição ou condição, mas este versículo, isoladamente, não afirma de forma explícita a morte; a tradução preserva essa tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E eis que” conserva a vivacidade narrativa do hebraico, enquanto “jazia” evita uma formulação artificial e mantém aberta a condição exata da mulher.
