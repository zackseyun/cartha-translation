base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: pt
  text: 'E todos os que viram aquilo disseram: “Nunca aconteceu nem se viu coisa semelhante, desde o dia em que os filhos de Israel[a] subiram da terra do Egito até hoje. Pensem bem nisso, consultem-se e falem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”.
    reason: Alternativa lexical para o etnônimo בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: E todos os que viram aquilo disseram
  rationale: A construção apresenta a reação resultante de todos os observadores. O pretérito perfeito composto pela sequência verbal hebraica é expresso naturalmente em português pelo pretérito perfeito simples, sem o arcaísmo de uma tradução literal de וְהָיָה.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: Nunca aconteceu nem se viu coisa semelhante
  rationale: Preserva os dois verbos do hebraico e a ênfase na natureza sem precedentes do acontecimento, em formulação clara e idiomática.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: desde o dia em que os filhos de Israel subiram da terra do Egito
  rationale: Mantém a fórmula do êxodo e traduz בְּנֵי יִשְׂרָאֵל de modo formalmente próximo, deixando a alternativa etnonímica em nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português natural e exato para o marco temporal que chega ao presente do narrador.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: Pensem bem nisso
  rationale: Expressa de modo idiomático a exortação a fixar a atenção e considerar seriamente o caso; “bem” comunica a força deliberativa da expressão.
- source_word: עֻצוּ
  choice: consultem-se
  rationale: O imperativo pede deliberação ou conselho coletivo. A forma pronominal torna explícita, sem excesso interpretativo, a reciprocidade implícita no contexto comunitário.
- source_word: וְדַבֵּרוּ
  choice: e falem
  rationale: Conserva a brevidade e a abertura do imperativo hebraico, sem acrescentar um objeto ou uma decisão que o texto não especifica.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A opção principal preserva a forma genealógica e gramatical da expressão hebraica. Como ela também funciona como etnônimo convencional para todo o povo, a alternativa mais fluente é registrada em nota, sem restringir o referente aos homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a intensidade solene e a sequência concisa dos três imperativos finais.
source_grounding:
  english_pob_role: consult_only
