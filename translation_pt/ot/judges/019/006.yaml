base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: pt
  text: 'Assim, os dois se sentaram juntos, comeram e beberam. Então o pai da jovem disse ao homem: “Por favor, aceite passar a noite, e que o seu coração se alegre.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por favor, disponha-se a pernoitar, e fique contente.”'
    reason: Registra alternativas lexicais para הוֹאֶל נָא וְלִין e uma formulação idiomática para וְיִטַב לִבֶּךָ.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: se sentaram
  rationale: O verbo ישׁב inicia, na sequência narrativa, a cena da refeição. “Sentaram-se” é natural em português e não acrescenta além do contexto.
- source_word: וַיֹּאכְלוּ
  choice: comeram
  rationale: Tradução direta de אכל na cadeia narrativa.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: os dois ... juntos
  rationale: Preserva a ênfase da expressão hebraica na participação conjunta dos dois.
- source_word: וַיִּשְׁתּוּ
  choice: beberam
  rationale: Tradução direta de שתה; como o hebraico não especifica a bebida, nenhum objeto foi acrescentado.
- source_word: אֲבִי הַנַּעֲרָה
  choice: o pai da jovem
  rationale: נַעֲרָה designa aqui uma jovem; “jovem” é claro, digno e adequado ao contexto.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Embora o contexto identifique melhor sua relação com a jovem, o hebraico deste versículo diz simplesmente “o homem”.
- source_word: הוֹאֶל נָא
  choice: por favor, aceite
  rationale: יאל expressa disposição ou consentimento, e נָא torna o pedido cortês. “Por favor, aceite” comunica naturalmente essa súplica em português.
- source_word: וְלִין
  choice: passar a noite aqui
  rationale: לון significa permanecer ou alojar-se durante a noite. “Passar a noite aqui” é uma formulação atual e natural; “aqui” explicita apenas o local indicado pelo contexto imediato.
- source_word: וְיִטַב לִבֶּךָ
  choice: e que o seu coração se alegre
  rationale: A expressão significa literalmente que o coração esteja bem ou agradável. A tradução mantém a imagem do coração e transmite o sentido idiomático de contentamento.
