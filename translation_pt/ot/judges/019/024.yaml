  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: pt
  text: 'Vejam: aqui estão minha filha virgem e a concubina dele. Deixem-me trazê-las para fora, por favor. Violentem-nas[a] e façam com elas o que for bom aos olhos de vocês[b]. Mas não pratiquem este ato infame[c] contra este homem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estuprem-nas”. Neste contexto, o verbo hebraico pode indicar violação e humilhação sexual.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o que for bom aos olhos de vocês”, uma expressão que significa aquilo que lhes parecer bom ou agradável.
    reason: cultural_note
  - marker: c
    text: 'Ou: “esta coisa ultrajante” ou “este ato vergonhoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Interjeição dêitica que chama urgentemente a atenção dos ouvintes; “Vejam” é corrente e mantém a força do hebraico sem o ar arcaico de “Eis”.
- source_word: בִתִּי הַבְּתוּלָה
  choice: minha filha virgem
  rationale: Preserva explicitamente o sentido de בְּתוּלָה, sem reduzi-lo apenas ao estado civil de “solteira”.
- source_word: וּפִילַגְשֵׁהוּ
  choice: e a concubina dele
  rationale: “Concubina” é o termo português convencional e reconhecível para פִּילֶגֶשׁ; “dele” expressa sem ambiguidade o sufixo possessivo masculino.
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: Deixem-me trazê-las para fora, por favor
  rationale: O coortativo com נָא comunica intenção acompanhada de apelo; a formulação portuguesa mantém a súplica e traduz naturalmente os referentes femininos.
- source_word: וְעַנּוּ אוֹתָם
  choice: Violentem-nas
  rationale: No piel e neste contexto, ענה comunica humilhação e violência sexual. “Violentem-nas” não suaviza a cena, mas evita impor ao verbo isolado uma precisão jurídica maior do que ele necessariamente contém.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: e façam com elas o que for bom aos olhos de vocês
  rationale: Mantém a imagem idiomática hebraica e continua compreensível em português; a nota esclarece seu valor pragmático.
- source_word: וְלָאִישׁ הַזֶּה לֹא תַעֲשׂוּ
  choice: Mas não façam a este homem
  rationale: A construção anteposta destaca o contraste entre o homem e as mulheres oferecidas; “Mas” torna esse contraste explícito e natural.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: esse ato infame
  rationale: נְבָלָה designa uma ação moralmente ultrajante e vergonhosa, não mera insensatez intelectual. “Ato infame” comunica essa condenação em linguagem atual e digna.
theological_decisions:
- issue: Clareza da linguagem de violência sexual sem excesso interpretativo
  choice: “Violentem-nas” para וְעַנּוּ אוֹתָם
  alternative: “Estuprem-nas”, “abusem delas” ou o literal e opaco “humilhem-nas”
  rationale: O contexto apresenta uma proposta horrível de violência sexual. “Violentem-nas” preserva tanto a dimensão sexual quanto a humilhação, enquanto a nota registra a tradução contextual mais explícita.
- issue: Força moral de נְבָלָה
  choice: “esse ato infame”
  alternative: “essa coisa ultrajante”, “esse ato vergonhoso” ou “essa loucura”
  rationale: O termo expressa grave repulsa moral e social. “Ato infame” evita que “loucura” seja entendida como simples falta de bom senso e não introduz uma avaliação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” e imperativos correspondentes para evitar alternância de tratamento. A formulação conserva a brutalidade moral da fala sem endossá-la nem suavizá-la.
