base_translation:
  language: en
  yaml_path: translation/ot/judges/019/021.yaml
  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: pt
  text: Então ele o levou para dentro de sua casa e deu ração aos jumentos.[a] Depois, eles lavaram os pés[b], comeram e beberam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “misturou ração para os jumentos”.'
    reason: lexical_alternative
  - marker: b
    text: Lavar os pés era um costume de hospitalidade no antigo Oriente Próximo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ לְבֵיתוֹ
  choice: ele o levou para dentro de sua casa
  rationale: O hifil de בוא expressa fazer alguém entrar ou levá-lo para dentro; a formulação comunica de modo natural que o anfitrião acolheu o levita em casa.
- source_word: וַיָּבָול לַחֲמוֹרִים
  choice: deu ração aos jumentos
  rationale: בלל significa literalmente “misturar”; neste contexto, refere-se à preparação ou oferta de alimento aos animais. “Deu ração” mantém a referência concreta à forragem e soa natural em português atual.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: eles lavaram os pés
  rationale: Tradução direta da ação habitual de hospitalidade. O sujeito plural permanece sem identificação mais específica, como no hebraico.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: comeram e beberam
  rationale: Preserva a concisão e a sequência narrativa do hebraico em linguagem portuguesa corrente.
