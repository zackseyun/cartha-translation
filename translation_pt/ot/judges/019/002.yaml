  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: pt
  text: Mas sua concubina lhe foi infiel[a] e o deixou. Ela foi para a casa de seu pai, em Belém de Judá, e ficou ali durante quatro meses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “prostituiu-se contra ele”. Alguns intérpretes antigos entenderam a frase de outra maneira, como “irritou-se com ele” ou “brigou com ele”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה עָלָיו
  choice: lhe foi infiel
  rationale: O verbo זנה, com עַל indicando a pessoa contra quem se comete a infidelidade, normalmente expressa infidelidade sexual. “Lhe foi infiel” comunica o sentido provável em português natural sem especificar prostituição comercial.
- source_word: פִּילַגְשׁוֹ
  choice: sua concubina
  rationale: “Concubina” é o termo bíblico convencional e conciso para uma mulher numa união reconhecida, mas de condição inferior à de esposa principal.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: o deixou
  rationale: A expressão combina movimento e separação. “O deixou” é natural em português e preserva o sentido relacional da partida.
- source_word: אֶל בֵּית אָבִיהָ
  choice: para a casa de seu pai
  rationale: Tradução direta e idiomática da expressão referente à residência ou família paterna.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: em Belém de Judá
  rationale: Identifica a cidade situada no território de Judá e a distingue de outra localidade com o mesmo nome.
- source_word: וַתְּהִי שָׁם
  choice: ficou ali
  rationale: Embora literalmente seja “esteve ali”, “ficou ali” expressa naturalmente a permanência indicada pelo contexto narrativo.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: durante quatro meses
  rationale: A construção hebraica idiomática indica uma duração de quatro meses; a tradução evita reproduzir de modo obscuro o elemento literal “dias”.
theological_decisions:
- issue: Interpretação de וַתִּזְנֶה numa narrativa moralmente carregada
  choice: infidelidade sexual (“lhe foi infiel”)
  alternative: “prostituiu-se contra ele”; segundo uma antiga tradição interpretativa, “irritou-se com ele” ou “brigou com ele”
  rationale: A vocalização massorética e o sentido lexical habitual de זנה favorecem a leitura de infidelidade sexual. A antiga leitura alternativa é preservada em nota para não eliminar a tensão textual e interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a concisão narrativa do hebraico; “Belém de Judá” segue o uso bíblico corrente, e a nota preserva a antiga interpretação alternativa sem enfraquecer a leitura mais provável do texto massorético.
