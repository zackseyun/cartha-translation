base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: pt
  text: 'Mas o seu senhor lhe disse: “Não nos desviaremos para uma cidade estrangeira, que não seja dos filhos de Israel; seguiremos adiante até Gibeá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: o seu senhor
  rationale: No contexto, designa o superior humano do servo. “Senhor” expressa naturalmente essa relação em português sem sugerir aqui um título divino.
- source_word: נָסוּר
  choice: entraremos
  rationale: O verbo significa literalmente desviar-se ou sair do caminho; no contexto da viagem, refere-se a entrar na cidade para passar a noite. “Entraremos” comunica com clareza a ação pretendida, sem perder a oposição a seguir adiante.
- source_word: עִיר נָכְרִי
  choice: uma cidade estrangeira
  rationale: נָכְרִי caracteriza a cidade como pertencente a estrangeiros ou não israelitas. “Cidade estrangeira” é conciso, natural e fiel.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: que não seja dos filhos de Israel
  rationale: Mantém a formulação étnica hebraica “filhos de Israel” e a referência formal à cidade, preservando a concisão e a leve tensão gramatical do original.
- source_word: וְעָבַרְנוּ
  choice: seguiremos adiante
  rationale: Aqui עבר indica continuar a viagem em vez de parar na cidade proposta. “Seguiremos adiante” é idiomático e explicita o contraste.
- source_word: עַד גִּבְעָה
  choice: até Gibeá
  rationale: עַד indica o limite ou destino do percurso. “Até Gibeá” é a forma natural e exata em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala conserva a oposição entre entrar numa cidade estrangeira e continuar até Gibeá. “Filhos de Israel” foi mantido como expressão étnica tradicional do hebraico, sem modernização para “israelitas”.
