base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: pt
  text: 'Ele ergueu os olhos e viu o viajante[a] na praça da cidade[b]. Então o homem idoso disse: “Para onde você vai e de onde vem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “viajante de passagem” ou “hóspede”. O termo hebraico se refere a alguém que está viajando e, por extensão, em contextos de hospitalidade, a um hóspede.
    reason: lexical_alternative
  - marker: b
    text: Ou “no espaço aberto da cidade”; tradicionalmente, “na rua da cidade”. O termo hebraico designa mais especificamente um espaço público amplo ou uma praça.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: ergueu os olhos
  rationale: Mantém a imagem do idioma hebraico em português natural e digno, indicando que ele dirigiu o olhar para cima ou adiante.
- source_word: וַיַּרְא
  choice: viu
  rationale: Traduz diretamente o verbo comum de percepção visual, sem acrescentar a nuance mais interpretativa de “notou”.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: o viajante
  rationale: אֹרֵחַ designa alguém em viagem e, em contextos de hospitalidade, pode também se referir a um hóspede. “Viajante” é claro e corresponde melhor à situação imediata.
- source_word: בִּרְחֹב הָעִיר
  choice: na praça da cidade
  rationale: רְחוֹב costuma designar um espaço público amplo, como uma praça, e não necessariamente uma rua estreita.
- source_word: הָאִישׁ הַזָּקֵן
  choice: o homem idoso
  rationale: Reproduz de modo direto e respeitoso a identificação do personagem como um homem de idade avançada.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Preserva o verbo hebraico comum de fala; a natureza interrogativa fica evidente nas perguntas que seguem.
- source_word: אָנָה תֵלֵךְ
  choice: Para onde você vai
  rationale: Expressa naturalmente em português a pergunta hebraica sobre o destino, preservando a nuance direcional de אָנָה.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: e de onde vem
  rationale: Reproduz de forma idiomática a pergunta sobre a procedência do viajante. O presente é natural no diálogo e mantém aberta a referência ao ponto de origem da viagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Você” torna a pergunta natural no diálogo contemporâneo; “homem idoso” evita tanto o tom potencialmente depreciativo de “velho” quanto uma formulação excessivamente solene. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
