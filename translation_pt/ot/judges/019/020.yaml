base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: pt
  text: 'O homem idoso disse: “Paz a você! Apenas deixe que eu cuide de tudo de que você precisar; só não passe a noite na praça[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na rua”. O termo hebraico se refere mais especificamente a uma área pública aberta, ou praça, dentro da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: O homem idoso
  rationale: Reproduz naturalmente o substantivo e o adjetivo hebraicos, evitando tanto o tom clínico de algumas alternativas quanto uma expressão que possa sugerir parentesco.
- source_word: שָׁלוֹם לָךְ
  choice: Paz a você!
  rationale: Preserva o conteúdo lexical de שָׁלוֹם e funciona em português como saudação e expressão de tranquilização, sem explicitar além do hebraico.
- source_word: רַק
  choice: apenas
  rationale: A partícula limita e enfatiza a condição final. Em português, a primeira ocorrência é expressa pela estrutura do oferecimento, enquanto “apenas” torna explícita a restrição decisiva da segunda ocorrência sem produzir repetição artificial.
- source_word: כָּל מַחְסוֹרְךָ
  choice: Tudo de que precisar
  rationale: Expressa de modo corrente a totalidade das necessidades ou carências do hóspede no contexto da oferta de hospitalidade.
- source_word: עָלָי
  choice: ficará por minha conta
  rationale: Transmite o sentido idiomático de assumir pessoalmente a responsabilidade por suprir as necessidades, preservando a concisão da expressão hebraica.
- source_word: בָּרְחוֹב
  choice: na praça
  rationale: רְחוֹב designa aqui o espaço público aberto da cidade; “praça” comunica esse cenário com mais precisão contextual do que a leitura moderna comum de “rua”.
- source_word: אַל תָּלַן
  choice: não passe a noite
  rationale: Tradução clara e idiomática da proibição de alojar-se ou permanecer ali durante a noite.
