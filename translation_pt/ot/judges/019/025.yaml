    reason: lexical_alternative
  revision_rationale: A revisão remove a inferência adicional de «entregando-a» e traduz diretamente a ação de fazê-la sair/levá-la para fora até os homens. Também ajusta levemente as expressões temporais para maior fluidez, sem alterar a sequência nem a força do hebraico.
