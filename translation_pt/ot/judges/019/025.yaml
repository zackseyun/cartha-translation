review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a recusa dos homens, a ação coercitiva do homem contra sua concubina, a violência sexual e degradante que durou a noite inteira e a libertação ao amanhecer. Contudo, «entregando-a a eles» acrescenta uma caracterização interpretativa que não está expressa no hebraico; o texto diz que ele a fez sair/levou para fora até eles.
  naturalness: O português é claro e de registro apropriado. «Levou-a para fora, até eles» reproduz naturalmente o movimento indicado pelo hebraico sem a inferência adicional de «entregando». «Até o amanhecer» e «ao raiar do dia» evitam uma repetição algo pesada entre «de manhã» e «aurora».
  terminology: «Concubina», «agarrou», «relações sexuais» e «maltrataram» são escolhas adequadas. A nota explica corretamente o eufemismo hebraico e, pelo contexto coercitivo e pelos agentes plurais, identifica de modo responsável a violência como estupro coletivo.
  issues:
  - severity: medium
    issue: «entregando-a a eles»
    rationale: Embora compatível com o desenrolar narrativo, «entregando» não corresponde diretamente a וַיֹּצֵא, «fez sair/levou para fora», e introduz uma formulação interpretativa desnecessária. Deve-se conservar o movimento coercitivo sem ampliar a descrição.
  revised_text: Mas os homens não quiseram ouvi-lo. Então o homem agarrou sua concubina e a levou para fora, até eles. Eles tiveram relações sexuais com ela[a] e a maltrataram durante toda a noite, até o amanhecer. Ao raiar do dia, deixaram-na ir.
  revised_footnotes:
