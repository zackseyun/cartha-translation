base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: pt
  text: Mas os homens não quiseram ouvi-lo. Então o homem agarrou sua concubina e a levou para fora, até eles. Eles tiveram relações sexuais com ela[a] e a maltrataram durante toda a noite, até o amanhecer. Ao raiar do dia, deixaram-na ir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “eles a conheceram”, um eufemismo hebraico para relações sexuais; neste contexto, trata-se de estupro coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ
  choice: não quiseram
  rationale: Expressa de modo natural a falta de disposição ou consentimento indicada por אבה, sem intensificá-la além do texto.
- source_word: לִשְׁמֹעַ לוֹ
  choice: ouvi-lo
  rationale: שׁמע com ל pode significar ouvir, dar ouvidos ou obedecer; aqui, “ouvi-lo” comunica naturalmente a rejeição do apelo sem impor a ideia mais forte de obediência.
- source_word: וַיַּחֲזֵק
  choice: agarrou
  rationale: Comunica que o homem tomou a mulher à força, preservando a intensidade de חזק no contexto.
- source_word: פִּילַגְשׁוֹ
  choice: sua concubina
  rationale: “Concubina” é o equivalente tradicional e conciso para פילגש, preservando a categoria social do texto sem redefini-la.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: a pôs para fora, entregando-a a eles
  rationale: Torna explícitos tanto o movimento coercivo para fora da casa quanto o fato de ela ter sido posta nas mãos dos homens, em português natural.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: tiveram relações sexuais com ela
  rationale: O eufemismo hebraico “conhecer” tem sentido sexual. Em português moderno, a tradução literal “conheceram-na” seria facilmente mal compreendida; a nota explicita que o contexto é de estupro coletivo.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: a maltrataram
  rationale: Abrange o tratamento abusivo, degradante e violento indicado pelo hitpael de עלל sem restringir indevidamente sua extensão.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: durante toda a noite, até de manhã
  rationale: Preserva claramente a duração temporal e soa natural em português contemporâneo.
- source_word: וַיְשַׁלְּחוּהָ
  choice: deixaram-na ir
  rationale: Reflete o sentido contextual de soltar ou dispensar após a violência, sem sugerir uma partida voluntária.
- source_word: בעלות הַשָּׁחַר
  choice: ao despontar da aurora
  rationale: Preserva a imagem literal da aurora que se levanta e mantém um registro digno e inteligível.
theological_decisions:
- issue: Explicitação da violência sexual em וַיֵּדְעוּ אוֹתָהּ
  choice: Traduzir o sentido sexual no texto principal e identificar na nota que se trata de estupro coletivo.
  alternative: Preservar literalmente o eufemismo como “eles a conheceram”.
  rationale: A formulação literal não comunica o eufemismo sexual com clareza em português atual. O contexto coercivo determina que as relações não foram consentidas; a nota preserva a informação sobre o idioma hebraico e evita suavizar a violência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe evita arcaísmos, mas conserva a progressão narrativa e a crueza sóbria do hebraico. O pronome enclítico em “deixaram-na” mantém fluidez formal sem tornar o verso excessivamente coloquial.
