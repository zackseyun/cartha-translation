revisions:
- from: Mas os homens não quiseram ouvi-lo. Então o homem agarrou sua concubina e a pôs para fora, entregando-a a eles. Eles tiveram relações sexuais com ela[a] e a maltrataram durante toda a noite, até de manhã. Ao despontar da aurora, deixaram-na ir.
  to: Mas os homens não quiseram ouvi-lo. Então o homem agarrou sua concubina e a levou para fora, até eles. Eles tiveram relações sexuais com ela[a] e a maltrataram durante toda a noite, até o amanhecer. Ao raiar do dia, deixaram-na ir.
  rationale: A revisão remove a inferência adicional de «entregando-a» e traduz diretamente a ação de fazê-la sair/levá-la para fora até os homens. Também ajusta levemente as expressões temporais para maior fluidez, sem alterar a sequência nem a força do hebraico.
