  text: וַ/תָּבֹ֥א הָ/אִשָּׁ֖ה לִ/פְנ֣וֹת הַ/בֹּ֑קֶר וַ/תִּפֹּ֞ל פֶּ֧תַח בֵּית הָ/אִ֛ישׁ אֲשֶׁר אֲדוֹנֶ֥י/הָ שָּׁ֖ם עַד הָ/אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: pt
  text: Ao despontar da manhã[a], a mulher chegou e caiu à entrada da casa do homem onde estava o seu senhor[b], até clarear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perto da manhã” ou “antes do amanhecer”. A expressão hebraica fala literalmente do voltar-se da manhã.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu dono”. O hebraico diz “seu senhor”, termo que expressa autoridade, e não especificamente “seu marido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: Ao despontar da manhã
  rationale: A expressão idiomática com פנה indica a aproximação ou a transição para a manhã. “Ao despontar da manhã” preserva essa imagem temporal em português natural, sem reduzi-la simplesmente a “ao amanhecer”.
- source_word: וַתָּבֹא
  choice: chegou
  rationale: בוא expressa movimento de chegada. “Chegou” é natural no contexto e evita acrescentar a ideia de que ela “voltou”, nuance não explícita no verbo.
- source_word: וַתִּפֹּל
  choice: caiu
  rationale: נפל significa diretamente “cair”. Embora o contexto possa sugerir que ela desabou, “caiu” mantém a sobriedade e a força abrupta do hebraico sem explicar a causa.
- source_word: פֶּתַח בֵּית
  choice: à entrada da casa
  rationale: פֶּתַח designa a abertura ou entrada. A formulação é clara e idiomática em português.
- source_word: הָאִישׁ
  choice: o homem
  rationale: אִישׁ é o substantivo comum para “homem”. O contexto permite identificar o dono da casa, mas o texto hebraico não o especifica aqui.
- source_word: אֲדוֹנֶיהָ
  choice: o seu senhor
  rationale: אדון com o sufixo feminino significa literalmente “senhor dela” e expressa autoridade. “O seu senhor” conserva essa relação sem substituir o termo por “marido”, que seria mais interpretativo.
- source_word: אֲשֶׁר ... שָׁם
  choice: onde estava
  rationale: A combinação da oração relativa com שָׁם é expressa naturalmente em português por “onde estava”.
- source_word: עַד הָאוֹר
  choice: até clarear
  rationale: A expressão indica duração até haver luz do dia. “Até clarear” é conciso, natural e mantém o valor temporal.
theological_decisions:
- issue: Relação entre a mulher e אֲדוֹנֶיהָ
  choice: o seu senhor
  alternative: o seu marido
  rationale: O termo hebraico destaca autoridade e não identifica explicitamente a relação conjugal. Como a narrativa a apresenta como concubina do levita, traduzir por “marido” resolveria uma tensão que o versículo mantém.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A sintaxe concisa conserva a dureza narrativa do hebraico. Os marcadores aparecem junto às expressões que explicam.
