base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: pt
  text: 'No quarto dia, eles se levantaram cedo pela manhã, e ele se levantou para partir. Mas o pai da jovem disse ao genro: “Recupere as forças com um pedaço de pão[a]; depois, vocês podem partir[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “Fortaleça o seu coração com um pedaço de pão”. O idioma significa recuperar ou sustentar as forças comendo.
    reason: lexical_alternative
  - marker: b
    text: O verbo final está no plural em hebraico (“vocês podem partir”), provavelmente em referência a todo o grupo de viajantes, embora o pai fale diretamente ao genro.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: No quarto dia
  rationale: Reproduz diretamente a expressão temporal hebraica sem acrescentar “da estadia”, detalhe apenas implícito no contexto.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: eles se levantaram cedo pela manhã
  rationale: Conserva o sujeito plural e a ênfase hebraica no início da manhã, em formulação clara e corrente.
- source_word: וַיָּקָם לָלֶכֶת
  choice: ele se pôs de pé para partir
  rationale: Mantém a mudança para o singular, focalizando o levita, e expressa o propósito indicado pelo infinitivo.
- source_word: אֲבִי הַנַּעֲרָה
  choice: o pai da jovem
  rationale: “Jovem” corresponde naturalmente a נַעֲרָה no contexto e evita tanto um tom arcaico quanto uma indicação excessivamente infantil.
- source_word: חֲתָנוֹ
  choice: ao genro
  rationale: No contexto, o termo designa a relação do levita com o pai da jovem; “genro” é o equivalente português direto.
- source_word: סְעָד לִבְּךָ
  choice: Reanime-se
  rationale: Traduz o sentido contextual do idioma hebraico, isto é, recuperar ou sustentar as forças por meio do alimento, enquanto a nota preserva sua imagem literal.
- source_word: פַּת לֶחֶם
  choice: um pedaço de pão
  rationale: Preserva a imagem concreta do hebraico em português natural; “pedaço” é mais corrente do que “bocado” sem ampliar para alimento em geral.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: depois, vocês podem partir
  rationale: O verbo hebraico está no plural e provavelmente inclui todo o grupo de viajantes, embora a fala seja dirigida diretamente ao genro.
