base_translation:
  language: en
  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: pt
  text: Eles se desviaram para lá, a fim de entrar em Gibeá e passar a noite. Ele entrou e se sentou na praça da cidade[a], e não havia nenhum homem[b] que os acolhesse em sua casa para passarem a noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na rua larga da cidade”; o termo hebraico pode indicar uma rua ampla ou uma praça pública.
    reason: lexical_alternative
  - marker: b
    text: Isto é, nenhum morador lhes ofereceu hospedagem.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: Eles se desviaram para lá
  rationale: O verbo סור indica que saíram da rota ou se desviaram do caminho; esta formulação preserva o movimento narrativo sem sugerir que apenas pararam.
- source_word: לָבוֹא לָלוּן בַּגִּבְעָה
  choice: a fim de entrar em Gibeá e passar a noite
  rationale: בוא expressa entrada, e לון, permanência durante a noite. A coordenação em português é clara e mantém a finalidade indicada pelos infinitivos hebraicos.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: Ele entrou e se sentou
  rationale: A mudança do plural para o singular foi preservada, provavelmente apresentando o levita como representante do grupo. ישב, no cenário imediato da chegada, descreve o ato de sentar-se.
- source_word: בִּרְחוֹב הָעִיר
  choice: na praça da cidade
  rationale: רְחוֹב pode designar uma rua larga ou um espaço público aberto. 'Praça' comunica de modo natural o provável cenário, enquanto a nota preserva a alternativa lexical.
- source_word: וְאֵין אִישׁ
  choice: mas nenhum homem
  rationale: אִישׁ é explicitamente masculino e foi mantido como 'homem'. A conjunção adversativa torna natural em português o contraste implícito entre a espera na praça e a ausência de hospitalidade.
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: os acolheu em sua casa
  rationale: אסף significa literalmente reunir ou recolher, mas neste contexto descreve receber viajantes sob o próprio teto. 'Acolher em sua casa' expressa com precisão e naturalidade a hospitalidade pretendida.
