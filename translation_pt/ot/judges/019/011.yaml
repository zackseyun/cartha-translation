base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: pt
  text: 'Quando estavam perto de Jebus[a], o dia já estava muito adiantado[b]. Então o jovem[c] disse ao seu senhor: “Venha, por favor! Vamos nos desviar para esta cidade dos jebuseus e passar a noite nela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jebus era o antigo nome de Jerusalém.
    reason: cross_reference
  - marker: b
    text: 'Ou: “o dia já havia declinado muito” ou “já estava ficando muito tarde”.'
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico também pode designar um servo ou ajudante neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: estavam perto de Jebus
  rationale: Embora עִם signifique normalmente “com”, junto a um topônimo neste contexto de viagem indica proximidade. “Perto de Jebus” expressa essa ideia com naturalidade.
- source_word: יְבוּס
  choice: Jebus
  rationale: Mantém o antigo nome empregado pelo texto hebraico, sem substituí-lo pela identificação posterior, Jerusalém.
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: o dia já ia muito adiantado
  rationale: A expressão descreve o declínio do dia em direção à noite. A formulação preserva a imagem temporal e soa natural em português atual.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר pode designar um rapaz, jovem, servo ou ajudante. “O jovem” conserva a amplitude lexical, enquanto a relação de subordinação aparece em “seu senhor”.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: Neste contexto social, אֲדוֹן designa o superior a quem o jovem serve. “Seu senhor” mantém a relação expressa no hebraico sem introduzir a ideia mais específica de propriedade.
- source_word: לְכָה נָּא
  choice: Venha, por favor!
  rationale: O imperativo לְכָה expressa movimento, e נָא acrescenta pedido ou cortesia. A tradução reproduz ambos de modo idiomático.
- source_word: וְנָסוּרָה
  choice: vamos nos desviar
  rationale: O coortativo de סוּר propõe que ambos saiam da rota para entrar na cidade. A construção com “vamos” transmite naturalmente essa força em português.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: esta cidade dos jebuseus
  rationale: O gentílico singular com artigo tem sentido coletivo, referente ao povo jebuseu; a tradução também preserva o demonstrativo.
- source_word: וְנָלִין בָּהּ
  choice: e passar a noite nela
  rationale: לוּן significa alojar-se ou permanecer durante a noite. “Passar a noite” é claro e corrente, e “nela” retoma explicitamente a cidade.
