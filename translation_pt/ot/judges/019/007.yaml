  text: וַ/יָּ֥קָם הָ/אִ֖ישׁ לָ/לֶ֑כֶת וַ/יִּפְצַר בּ/וֹ֙ חֹתְנ֔/וֹ וַ/יָּ֖שָׁב וַ/יָּ֥לֶן שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: pt
  text: Então o homem se levantou para partir, mas seu sogro insistiu com ele[a]. Assim, ele voltou e passou a noite ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pressionou-o” ou “suplicou-lhe com insistência”; o verbo hebraico transmite a ideia de insistência persistente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal consecutivo de קום descreve, na sequência narrativa, o ato de levantar-se para agir; a expressão é natural e mantém a ação preparatória.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Traduz diretamente אִישׁ e preserva a designação narrativa genérica usada para o levita, sem substituí-la por uma relação não explicitada neste ponto.
- source_word: לָלֶכֶת
  choice: para partir
  rationale: O infinitivo de הלך após קום indica propósito. “Partir” expressa naturalmente, no contexto, que ele se levantou a fim de ir embora.
- source_word: וַיִּפְצַר בּוֹ
  choice: insistiu com ele
  rationale: פצר denota pressão ou insistência persistente. A formulação comunica essa força em português corrente sem explicitar indevidamente o pedido implícito para que ele ficasse.
- source_word: חֹתְנוֹ
  choice: seu sogro
  rationale: No contexto, חֹתֵן designa o pai da mulher em relação ao homem; “sogro” é o equivalente português preciso e natural.
- source_word: וַיָּשָׁב
  choice: ele voltou
  rationale: A forma de שׁוב indica retorno ou reversão do movimento pretendido. “Voltou” conserva a ideia sem especificar além do texto se ele já havia iniciado a viagem.
- source_word: וַיָּלֶן שָׁם
  choice: passou a noite ali
  rationale: לון significa pernoitar ou alojar-se durante a noite; esta expressão é clara, atual e mantém o sentido temporal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação narrativa hebraica foi vertida em períodos naturais, sem eliminar a sequência de levantar-se, sofrer insistência, voltar e pernoitar.
