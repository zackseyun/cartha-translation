base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: pt
  text: 'No quinto dia, ele se levantou cedo pela manhã para partir, mas o pai da jovem disse: “Por favor, fortaleça o seu coração[a] com um pouco de comida e esperem até o dia declinar.” Então os dois comeram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “fortaleça o seu coração”. É uma expressão idiomática para alimentar-se e recuperar as forças.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: ele se levantou cedo pela manhã
  rationale: A expressão preserva tanto o sentido do verbo no hifil, “levantar-se cedo”, quanto a indicação temporal “pela manhã”, em português corrente.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: No quinto dia
  rationale: Tradução direta e natural da expressão temporal hebraica.
- source_word: לָלֶכֶת
  choice: para partir
  rationale: Embora הלך signifique amplamente “ir”, o contexto indica o início da viagem de volta; “partir” exprime isso com naturalidade sem acrescentar detalhes.
- source_word: אֲבִי הַנַּעֲרָה
  choice: o pai da jovem
  rationale: נַעֲרָה designa aqui uma jovem mulher; “jovem” evita o tom diminutivo de “menina” no contexto conjugal.
- source_word: סְעָד נָא לְבָבְךָ
  choice: Por favor, fortaleça o seu coração com um pouco de comida
  rationale: Mantém a imagem hebraica do coração fortalecido e esclarece o sentido idiomático, confirmado pelo ato de comer no fim do versículo.
- source_word: וְהִתְמַהְמְהוּ
  choice: e fiquem
  rationale: O verbo indica demorar-se ou permanecer. O plural hebraico é preservado em “fiquem”, apesar de a ordem anterior estar no singular.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: até o dia declinar
  rationale: Preserva a imagem do dia inclinando-se ou avançando em direção ao entardecer, sem fixar uma hora exata.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: Então os dois comeram
  rationale: Reproduz a referência explícita aos dois e apresenta naturalmente a ação como resultado do convite.
