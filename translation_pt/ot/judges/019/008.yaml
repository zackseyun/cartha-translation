  to: 'No quinto dia, ele se levantou cedo pela manhã para partir, mas o pai da jovem disse: “Por favor, fortaleça o seu coração[a] com um pouco de comida e esperem até o dia declinar.” Então os dois comeram.'
  rationale: A revisão substitui «fiquem» por «esperem», que transmite melhor o valor de retardar-se/aguardar do verbo hebraico, preservando o imperativo plural após o imperativo singular anterior. Também reposiciona a âncora para a expressão idiomática que a nota efetivamente esclarece. Não altera o sentido do versículo.
