review_pass:
  verdict: revise
  source_fidelity: A tradução comunica adequadamente a partida pretendida, o convite para comer e o declínio do dia. Contudo, «fiquem» expressa sobretudo permanência, enquanto וְהִתְמַהְמְהוּ pede que se demorem/aguardem; «esperem» representa melhor o sentido de retardar a partida. A alternância do imperativo singular para o plural é preservada, como no hebraico.
  naturalness: O português é moderno e claro. «Fortaleça o seu coração» mantém deliberadamente a imagem idiomática hebraica e é devidamente explicada em nota. «Esperem até o dia declinar» é mais idiomático e semanticamente preciso do que «fiquem até o dia declinar».
  terminology: «Jovem», «partir», «coração» e «dia declinar» são escolhas adequadas. A âncora da nota deve seguir «coração», pois é essa expressão, e não «comida», que a nota explica.
  issues:
  - severity: medium
    issue: «fiquem» para וְהִתְמַהְמְהוּ
    rationale: O verbo hebraico indica demorar-se, tardar ou aguardar, não meramente permanecer em um lugar. «Esperem» conserva naturalmente o pedido de adiar a saída até o fim do dia.
  - severity: low
    issue: Posição da âncora da nota
    rationale: A nota explica a expressão literal «fortaleça o seu coração»; por isso, o marcador deve ser colocado logo após «coração».
