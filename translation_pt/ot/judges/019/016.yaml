source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: pt
  text: E eis que um homem idoso vinha do seu trabalho no campo, ao entardecer. O homem era da região montanhosa de Efraim[a] e estava morando em Gibeá[b], mas os homens do lugar eram benjaminitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «da serra de Efraim». A expressão designa a região montanhosa do território de Efraim.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode significar «residia como estrangeiro» ou «vivia como forasteiro», indicando que ele morava ali sem ser natural do lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém o marcador narrativo que chama a atenção para a entrada de uma nova personagem, em formulação conhecida e inteligível em português.
- source_word: אִישׁ זָקֵן
  choice: um homem idoso
  rationale: Expressa diretamente a idade sem o possível tom depreciativo que «um velho» pode ter no português atual.
- source_word: בָּא מִמַּעֲשֵׂהוּ מִן־הַשָּׂדֶה
  choice: vinha do seu trabalho no campo
  rationale: Reestrutura com naturalidade as duas expressões introduzidas por מִן, preservando tanto a procedência quanto a atividade no campo.
- source_word: בָּעֶרֶב
  choice: ao entardecer
  rationale: Tradução natural da indicação temporal, adequada ao contexto da aproximação da noite.
- source_word: מֵהַר אֶפְרַיִם
  choice: da região montanhosa de Efraim
  rationale: Trata הַר אֶפְרַיִם como designação geográfica regional, evitando sugerir equivocadamente uma única montanha.
- source_word: גָר בַּגִּבְעָה
  choice: estava morando em Gibeá
  rationale: A construção progressiva soa natural e deixa em aberto o grau de permanência, enquanto a nota registra a possível nuance de residência como forasteiro.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: mas os homens do lugar
  rationale: A conjunção adversativa explicita o contraste contextual entre a origem efraimita do idoso e a identidade benjaminita dos homens locais; «homens» preserva o referente masculino do hebraico.
- source_word: בְּנֵי יְמִינִי
  choice: eram benjaminitas
  rationale: Equivalente gentílico claro e idiomático para a designação tribal hebraica.
