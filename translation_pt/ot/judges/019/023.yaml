base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: pt
  text: 'Então o homem, o dono da casa, saiu até eles e lhes disse: “Não, meus irmãos, por favor, não façam o mal. Uma vez que este homem entrou em minha casa, não cometam esta infâmia[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este ato vergonhoso” ou “este ato ultrajante”. O termo hebraico designa uma ação vergonhosa e moralmente revoltante.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: o dono da casa
  rationale: A expressão designa o homem responsável pela casa. “Dono da casa” é natural e claro em português, sem a ambiguidade moderna de “senhor da casa”.
- source_word: אַחַי
  choice: meus irmãos
  rationale: Mantém a forma masculina literal de tratamento, usada aqui para os homens da cidade.
- source_word: תָּרֵעוּ
  choice: não ajam com perversidade
  rationale: Expressa a força moral do verbo רעע e soa como uma repreensão urgente em português atual.
- source_word: נָא
  choice: por favor
  rationale: Preserva o tom de súplica e urgência da partícula.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: uma vez que este homem entrou em minha casa
  rationale: A construção apresenta a entrada do hóspede na casa como circunstância que agrava a ofensa. “Uma vez que” conserva a relação circunstancial-causal de modo natural.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: esta infâmia
  rationale: נְבָלָה indica um ato vergonhoso e moralmente ultrajante. “Infâmia” comunica de forma concisa tanto a desonra quanto a gravidade moral.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: saiu até eles
  rationale: Reproduz diretamente o movimento narrado pelo verbo יצא e o complemento direcional.
