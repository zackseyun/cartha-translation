  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: pt
  text: 'E disseram[a]: “Deve haver uma herança para os sobreviventes de Benjamim, para que uma tribo não seja apagada de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um remanescente para Benjamim” ou “uma herança dos sobreviventes de Benjamim”. O hebraico coloca “herança” e “sobreviventes/remanescente” lado a lado de forma compacta, e a relação exata entre os termos pode ser expressa de mais de uma maneira natural em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: Reproduz de modo natural o wayyiqtol narrativo de אמר e mantém a continuidade do relato.
- source_word: יְרֻשַּׁת
  choice: uma herança
  rationale: Expressa a ideia de posse hereditária ou porção tribal, adequada ao contexto da preservação territorial e comunitária de Benjamim.
- source_word: פְּלֵיטָה
  choice: os sobreviventes
  rationale: O termo designa os que escaparam ou restaram após a quase destruição da tribo; “sobreviventes” é claro e evita uma carga teológica desnecessária.
- source_word: לְבִנְיָמִן
  choice: de Benjamim
  rationale: Em ligação com “sobreviventes”, identifica naturalmente sua pertença tribal, embora a construção hebraica compacta também permita entender “para Benjamim”.
- source_word: וְלֹא יִמָּחֶה
  choice: para que ... não seja apagada
  rationale: A forma passiva de מחה comunica eliminação ou apagamento. “Para que” explicita a relação final sugerida pelo contexto sem alterar o sentido.
- source_word: שֵׁבֶט
  choice: uma tribo
  rationale: Refere-se a uma das tribos de Israel; o indefinido preserva a construção sem artigo e ressalta que nenhuma unidade tribal deve desaparecer.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: 'Traduz naturalmente o מן separativo: a tribo não deve ser eliminada do conjunto de Israel.'
