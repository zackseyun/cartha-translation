base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: pt
  text: No dia seguinte, o povo se levantou cedo, construiu ali um altar e ofereceu holocaustos e ofertas de comunhão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por «ofertas de paz» ou «ofertas de bem-estar». O termo hebraico designa uma classe de sacrifícios associada à paz, à integridade e à comunhão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: No dia seguinte
  rationale: A fórmula narrativa וַיְהִי é naturalmente absorvida em português, enquanto מִמָּחֳרָת é traduzido de modo claro e direto.
- source_word: וַיַּשְׁכִּימוּ
  choice: se levantou cedo
  rationale: Preserva a ideia de levantar-se de manhã cedo; o singular concorda naturalmente com o coletivo «o povo».
- source_word: הָעָם
  choice: o povo
  rationale: Traduz o substantivo comum sem explicitar «israelitas», identificação que o contexto fornece, mas que não aparece neste sintagma.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: construiu ali um altar
  rationale: Mantém explícito שָׁם («ali») e emprega ordem natural em português.
- source_word: וַיַּעֲלוּ
  choice: ofereceu
  rationale: No contexto sacrificial, o verbo é idiomaticamente empregado para apresentar uma oferta sobre o altar.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo bíblico português estabelecido para ofertas inteiramente queimadas, usado aqui no plural.
- source_word: וּשְׁלָמִים
  choice: ofertas de comunhão
  rationale: Expressa a dimensão sacrificial e relacional de שְׁלָמִים em português atual, sem reduzi-la apenas à noção moderna de paz.
theological_decisions:
- issue: Tradução dos termos sacrificiais
  choice: holocaustos e ofertas de comunhão
  alternative: ofertas totalmente queimadas e ofertas de paz / ofertas de bem-estar
  rationale: O texto nomeia duas classes de sacrifício. «Holocaustos» conserva a terminologia bíblica reconhecível, e «ofertas de comunhão» comunica uma dimensão importante de שְׁלָמִים; a nota preserva as demais nuances genuínas do termo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A marca de nota [a] foi posicionada imediatamente após o termo a que se refere.
