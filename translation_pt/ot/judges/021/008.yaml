  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: pt
  text: 'E eles disseram: “Qual das tribos de Israel não subiu até Yahweh em Mispá?[a]” E eis que nenhum homem[b] de Jabes-Gileade tinha vindo ao acampamento, à assembleia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “diante de Yahweh em Mispá”. O hebraico pode referir-se ao comparecimento perante Yahweh no local da assembleia.
    reason: alternative_reading
  - marker: b
    text: No hebraico, “nenhum homem” enfatiza que nem sequer um indivíduo de Jabes-Gileade estava presente.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: Mantém o avanço narrativo do wayyiqtol de modo natural e próximo ao hebraico.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: Qual das tribos de Israel
  rationale: Expressa em português idiomático a seleção de uma única unidade dentre as tribos, preservando o foco singular.
- source_word: לֹא עָלָה
  choice: não subiu
  rationale: Conserva o verbo de movimento עלה e sua nuance convencional de subida até um local de reunião ou culto.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: até Yahweh em Mispá
  rationale: Traduz diretamente אֶל como aproximação a Yahweh e apresenta Mispá como o local, sem eliminar a possível leitura cultual.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o marcador discursivo que chama atenção para a descoberta seguinte.
- source_word: לֹא בָא אִישׁ
  choice: nenhum homem tinha vindo
  rationale: Reproduz o singular masculino distributivo e enfático, indicando que nenhum indivíduo do lugar estava presente.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: de Jabes-Gileade
  rationale: A preposição indica origem; usa-se uma forma portuguesa clara do topônimo.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: ao acampamento, à assembleia
  rationale: Mantém as duas expressões direcionais e a aposição enfática do hebraico, identificando o acampamento como o lugar da assembleia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de אֶל יְהוָה em relação a Mispá
  choice: até Yahweh em Mispá
  alternative: diante de Yahweh em Mispá
  rationale: A tradução principal conserva o valor direcional de אֶל, enquanto a nota registra a leitura contextual de comparecimento perante Yahweh, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “E eis que” preserva deliberadamente a solenidade e a função enfática do hebraico; “assembleia” evita associações eclesiásticas indevidas.
