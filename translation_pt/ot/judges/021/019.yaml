  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: pt
  text: 'E eles disseram: “Vejam! Há uma festa[a] de Yahweh em Siló, de ano em ano[b]. Siló fica ao norte de Betel, a leste da estrada que sobe de Betel a Siquém e ao sul de Lebona.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festival”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de dias a dias”, expressão que indica recorrência anual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: Mantém a sequência narrativa e o sujeito plural expresso no hebraico.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Marcador discursivo natural e atual que preserva a função de chamar a atenção dos ouvintes.
- source_word: חַג יְהוָה
  choice: uma festa de Yahweh
  rationale: חַג designa uma festa ou festival, muitas vezes ligado à peregrinação; o nome divino é transliterado como Yahweh.
- source_word: בְּשִׁלֹה
  choice: em Siló
  rationale: Tradução locativa direta com a forma portuguesa corrente do topônimo.
- source_word: מִיָּמִים יָמִימָה
  choice: de ano em ano
  rationale: Expressa naturalmente a recorrência anual do idioma hebraico, preservando algo de sua forma repetitiva.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: ao norte de Betel
  rationale: Representa com clareza a localização relativa indicada pela expressão direcional.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: a leste da estrada
  rationale: A expressão literalmente ligada ao nascer do sol funciona aqui como indicação geográfica de leste; מְסִלָּה é uma estrada ou rota principal.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: que sobe de Betel a Siquém
  rationale: Preserva a imagem topográfica do verbo 'subir' e a direção da rota indicada pelo sufixo direcional em שְׁכֶמָה.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: e ao sul de Lebona
  rationale: Completa a descrição geográfica mediante a indicação direcional sul.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino em contexto narrativo não contestado; a transliteração preserva sua função como nome, sem substituí-lo por um título.
- issue: Referente da oração relativa אֲשֶׁר
  choice: Siló fica ao norte de Betel...
  alternative: a festa fica/acontece ao norte de Betel...
  rationale: A descrição geográfica identifica naturalmente Siló. A divisão em nova frase elimina uma possível ambiguidade sintática em português sem acrescentar conteúdo interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas toponímicas correntes no uso bíblico brasileiro. A descrição geográfica foi dividida em uma segunda frase para evitar que o leitor tome a oração relativa como descrição da festa, e não de Siló.
