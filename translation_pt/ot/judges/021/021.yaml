  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: pt
  text: Fiquem atentos e, quando as filhas de Siló saírem para dançar nas danças, saiam do meio dos vinhedos; cada homem arrebate[a] para si uma esposa dentre as filhas de Siló e vão para a terra de Benjamim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agarre” ou “leve à força”; o verbo hebraico indica uma tomada súbita e forçosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Fiquem atentos
  rationale: Embora a forma signifique literalmente “e vocês verão”, nesta sequência de instruções ela funciona como ordem para observar com cuidado enquanto aguardam; “fiquem atentos” expressa essa força contextual.
- source_word: וְהִנֵּה אִם
  choice: e, quando
  rationale: הִנֵּה chama a atenção para o que será visto, e אִם introduz formalmente uma condição. No cenário previsto, a construção tem valor temporal próximo de “quando”; a formulação portuguesa integra o marcador de atenção ao verbo anterior sem tornar a frase artificial.
- source_word: בְנוֹת שִׁילוֹ
  choice: as filhas de Siló
  rationale: Mantém a expressão social e familiar do hebraico, sem especificar uma faixa etária que o texto não explicita.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: para dançar nas danças
  rationale: Conserva tanto o verbo “dançar” quanto o substantivo plural correspondente. A repetição é marcada, mas compreensível, e evita acrescentar que seriam danças de roda.
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: saiam do meio dos vinhedos
  rationale: Expressa naturalmente que os homens deveriam emergir dos vinhedos onde estavam escondidos.
- source_word: וַחֲטַפְתֶּם
  choice: arrebatem
  rationale: O verbo indica tomar de modo súbito e forçoso. “Arrebatem” preserva essa força sem inserir no texto principal uma classificação jurídica moderna.
- source_word: לָכֶם אִישׁ אִשְׁתּוֹ
  choice: para si, cada um, uma esposa
  rationale: 'Reproduz o valor de aquisição pessoal e a distribuição singular: uma esposa para cada homem. Em português, “uma esposa” é mais natural que a reprodução literal “sua esposa” para uma relação ainda pretendida.'
- source_word: מִבְּנוֹת שִׁילוֹ
  choice: dentre as filhas de Siló
  rationale: “Dentre” explicita corretamente a seleção de mulheres pertencentes ao grupo mencionado.
- source_word: וַהֲלַכְתֶּם אֶרֶץ בִּנְיָמִן
  choice: depois, vão para a terra de Benjamim
  rationale: O perfeito consecutivo prossegue a sequência de instruções; “depois” torna clara a progressão, e “terra de Benjamim” mantém a designação territorial.
theological_decisions:
- issue: Formulação distributiva marcada por gênero
  choice: cada um, uma esposa
  alternative: cada homem, sua esposa
  rationale: O hebraico é masculino e distributivo. A tradução mantém essa referência, mas usa uma construção portuguesa natural que não sugere que as mulheres já eram esposas desses homens.
- issue: Descrição moral da tomada das mulheres
  choice: arrebatem para si
  alternative: raptem para si / levem à força
  rationale: A narrativa descreve uma tomada forçosa, mas a tradução verte a força lexical de חטף sem acrescentar aprovação moral nem impor no texto principal uma categoria jurídica moderna. A nota registra alternativas mais explícitas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe de instrução foi tornada natural, enquanto “filhas de Siló” e “dançar nas danças” preservam traços expressivos do hebraico. O marcador [a] foi colocado junto de “arrebatem”, termo ao qual a nota lexical se refere.
