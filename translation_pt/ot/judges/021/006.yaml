base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: pt
  text: 'Os filhos de Israel sentiram pesar por Benjamim, seu irmão[a], e disseram: “Hoje uma tribo foi cortada de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tiveram compaixão de Benjamim, seu irmão” ou “lamentaram por Benjamim, seu irmão”. O verbo hebraico pode expressar pesar, compaixão ou mudança de disposição, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: sentiram pesar
  rationale: O nifal de נחם pode expressar tristeza, compaixão ou mudança de disposição. No contexto da quase destruição de Benjamim, “sentiram pesar” comunica naturalmente a reação emocional sem eliminar as demais nuances, registradas em nota.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e corporativa do hebraico, que também se relaciona com a designação de Benjamim como irmão.
- source_word: אֶל בִּנְיָמִן
  choice: por Benjamim
  rationale: Com נחם, a preposição אֶל indica aqui aquele por quem se sente pesar ou compaixão; “por” é natural em português.
- source_word: בִּנְיָמִן אָחִיו
  choice: Benjamim, seu irmão
  rationale: O sufixo singular funciona coletivamente em relação ao sujeito plural, apresentando Benjamim como irmão das demais tribos de Israel.
- source_word: נִגְדַּע
  choice: foi cortada
  rationale: Mantém a metáfora de גדע, “cortar, derrubar”, e sua gravidade, sem explicitar destruição total além do que a forma verbal afirma.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: Equivalente moderno e direto, preservando a imediaticidade do lamento.
- source_word: שֵׁבֶט אֶחָד
  choice: uma tribo
  rationale: Designa uma unidade tribal dentre as tribos de Israel; a formulação é clara e idiomática.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: Expressa a separação da tribo em relação ao conjunto nacional, de modo natural em português.
