  text: וַ/יִּתְהַלְּכ֨וּ מִ/שָּׁ֤ם בְּנֵֽי יִשְׂרָאֵל֙ בָּ/עֵ֣ת הַ/הִ֔יא אִ֥ישׁ לְ/שִׁבְט֖/וֹ וּ/לְ/מִשְׁפַּחְתּ֑/וֹ וַ/יֵּצְא֣וּ מִ/שָּׁ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: pt
  text: Naquele tempo, os israelitas partiram dali, cada homem para a sua tribo e para o seu clã; saíram dali, cada homem para a sua herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a sua propriedade herdada”; aqui, “herança” se refere à porção de terra hereditária de cada israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: partiram
  rationale: O hitpael de הלך tem aqui sentido idiomático de pôr-se a caminho ou dispersar-se; “partiram” comunica naturalmente a saída da assembleia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Em português atual, “os israelitas” expressa com clareza o gentílico coletivo correspondente à expressão hebraica, sem a possível leitura excessivamente literal de “filhos de Israel”.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Reproduz de modo natural o marcador temporal hebraico e mantém sua ligação com toda a ação narrada.
- source_word: אִישׁ
  choice: cada homem
  rationale: Preserva o uso distributivo e a forma masculina singular do hebraico no contexto dos homens de Israel que retornam às suas unidades tribais e propriedades.
- source_word: לְשִׁבְטוֹ
  choice: para a sua tribo
  rationale: “Tribo” é o termo português corrente e preciso para essa unidade da organização social de Israel.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: e para o seu clã
  rationale: מִשְׁפָּחָה designa frequentemente um grupo de parentesco mais amplo do que a família imediata; “clã” evita estreitar indevidamente o sentido.
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: Conserva a imagem verbal de יצא e a repetição da partida presente no hebraico.
- source_word: לְנַחֲלָתוֹ
  choice: para a sua herança
  rationale: “Herança” preserva a dimensão jurídica e ancestral de נַחֲלָה; neste contexto, trata-se concretamente da propriedade territorial hereditária.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a repetição deliberada de “dali” e de “cada homem”. “Clã” foi adotado no texto principal por refletir melhor a amplitude social de מִשְׁפָּחָה.
