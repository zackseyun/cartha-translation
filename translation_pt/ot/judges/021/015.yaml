  yaml_path: translation/ot/judges/021/015.yaml
  text: And the people grieved for Benjamin, because the LORD had made a breach among the tribes of Israel.
translation:
  language: pt
  text: E o povo se compadeceu de Benjamim, porque o SENHOR havia aberto uma brecha entre as tribos de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם
  choice: lamentou
  rationale: No contexto, o verbo expressa pesar ou tristeza pela situação de Benjamim; “lamentou” comunica isso naturalmente sem introduzir a ideia mais específica de arrependimento.
- source_word: פֶּרֶץ
  choice: brecha
  rationale: Preserva a imagem concreta de uma ruptura aberta no conjunto das tribos, causada pela quase destruição de Benjamim.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por “SENHOR” em versaletes/maiúsculas.
- source_word: עָשָׂה
  choice: havia aberto
  rationale: Com “brecha”, o português idiomático pede “abrir”; o mais-que-perfeito composto situa o ato antes do lamento do povo.
theological_decisions:
- issue: Atribuição da brecha ao SENHOR
  choice: porque o SENHOR havia aberto uma brecha
  alternative: porque se havia aberto uma brecha
  rationale: Mantém a atribuição explícita do texto hebraico a YHWH, sem suavizar a tensão teológica da narrativa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da metáfora hebraica central.
