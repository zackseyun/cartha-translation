  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: pt
  text: 'Os filhos de Benjamim fizeram assim: tomaram para si esposas, conforme o número deles, dentre as mulheres que dançavam[a] e que eles haviam raptado[b]. Depois partiram e voltaram para a sua herança; reconstruíram[c] as cidades e moraram nelas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as que dançavam”. O particípio hebraico está no feminino plural.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “haviam tomado à força” ou “haviam levado à força”. O verbo hebraico indica apropriação violenta.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “construíram as cidades”. “Reconstruíram” reflete o contexto das cidades de Benjamim que haviam sido devastadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram assim
  rationale: Reproduz de modo natural a fórmula narrativa hebraica, indicando que executaram o plano anteriormente descrito.
- source_word: בְּנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Mantém a expressão tribal e familiar do hebraico, que neste contexto designa os homens da tribo envolvidos na ação.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: tomaram para si esposas
  rationale: Preserva o idioma hebraico de tomar mulheres como esposas, sem reduzi-lo ao mais consensual e interpretativo 'casaram-se'.
- source_word: לְמִסְפָּרָם
  choice: conforme o número deles
  rationale: Expressa que o número de esposas correspondia ao número dos benjaminitas necessitados delas, permanecendo próximo da formulação hebraica.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: dentre as mulheres que dançavam
  rationale: Torna explícito em português o gênero feminino do particípio plural hebraico e descreve a atividade delas sem acrescentar uma designação profissional.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: que eles haviam raptado
  rationale: O verbo גזל indica apropriação pela força. 'Raptado' comunica claramente a coerção e evita suavizar a gravidade do relato.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: Depois partiram e voltaram
  rationale: 'Conserva os dois verbos da sequência hebraica: a saída do local da festa e o retorno ao território tribal.'
- source_word: אֶל נַחֲלָתָם
  choice: para a sua herança
  rationale: Mantém o sentido de porção territorial herdada ou atribuída à tribo e sua ressonância pactual, em vez de usar apenas 'território'.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: reconstruíram as cidades
  rationale: Embora o verbo isoladamente signifique 'construíram', o contexto anterior informa que as cidades de Benjamim tinham sido destruídas; 'reconstruíram' comunica naturalmente a ação contextual.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: passaram a morar nelas
  rationale: Expressa em português atual o estabelecimento e a habitação nas cidades, sentido contextual de ישב.
theological_decisions:
- issue: A força moral de גָּזָלוּ na maneira como as mulheres foram tomadas
  choice: 'Traduzir com coerção explícita: ''que eles haviam raptado''.'
  alternative: '''que eles haviam tomado'' ou ''que haviam levado consigo''.'
  rationale: O texto narra a ação sem exigir que a tradução a aprove. Preservar a força violenta do verbo evita um eufemismo e mantém a tensão moral da narrativa.
- issue: A preservação da linguagem tribal e territorial
  choice: Manter 'filhos de Benjamim' e 'herança'.
  alternative: '''benjaminitas'' e ''território''.'
  rationale: As escolhas mantêm a textura familiar, tribal e fundiária do hebraico sem impor uma interpretação denominacional.
- issue: Construção ou reconstrução das cidades
  choice: Usar 'reconstruíram' no texto, com nota sobre a forma literal.
  alternative: Traduzir estritamente 'construíram'.
  rationale: O contexto de cidades anteriormente devastadas favorece 'reconstruíram', mas a nota preserva a transparência quanto ao alcance lexical do verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A pontuação organiza a longa cadeia narrativa hebraica sem eliminar suas ações sucessivas. A tradução conserva a linguagem tribal e não suaviza o rapto das mulheres.
