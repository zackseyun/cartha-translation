  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: pt
  text: 'Então a assembleia enviou para lá doze mil homens dentre os guerreiros valentes e lhes ordenou: “Vão e matem ao fio da espada os habitantes de Jabes-Gileade, incluindo as mulheres e as crianças.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: a assembleia
  rationale: No contexto, designa a comunidade reunida de Israel; “assembleia” é natural e mantém o caráter coletivo e deliberativo.
- source_word: מִבְּנֵי הֶחָיִל
  choice: dentre os guerreiros valentes
  rationale: A expressão idiomática indica homens aptos e valorosos para a guerra. A formulação evita o literalismo pouco natural “filhos do valor” sem perder seu sentido militar.
- source_word: וְהִכִּיתֶם
  choice: matem
  rationale: Neste contexto, o golpe ao fio da espada é letal; “matem” comunica diretamente a ordem narrativa.
- source_word: לְפִי חֶרֶב
  choice: ao fio da espada
  rationale: Equivalente português consagrado que preserva a imagem hebraica e expressa execução pela espada.
- source_word: הַטָּף
  choice: as crianças
  rationale: O termo coletivo se refere aos pequenos ou dependentes; “crianças” é claro, atual e adequado ao contraste com “mulheres”.
theological_decisions:
- issue: Caráter da ordem de matar mulheres e crianças
  choice: Traduzir a ordem de modo explícito, sem atenuá-la nem apresentá-la como mandamento divino.
  alternative: Suavizar a violência ou inserir linguagem que atribua diretamente a ordem a Deus.
  rationale: O hebraico atribui a ordem à assembleia e inclui expressamente mulheres e crianças. A tradução preserva tanto a gravidade do ato quanto a agência indicada pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Jabes-Gileade” segue a forma tradicional e reconhecível do topônimo. O discurso direto foi formulado com imperativos naturais no plural.
