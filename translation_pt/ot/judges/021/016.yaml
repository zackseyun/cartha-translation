  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: pt
  text: 'Então os anciãos da comunidade disseram: “Que faremos para conseguir esposas para os que restaram, visto que as mulheres de Benjamim foram exterminadas?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “pois de Benjamim foi exterminada uma mulher”; o singular “mulher” é empregado coletivamente para se referir às mulheres de Benjamim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: os anciãos da comunidade
  rationale: זִקְנֵי é o plural construto, “anciãos de”, e הָעֵדָה designa a comunidade reunida. “Comunidade” preserva o sentido coletivo em português atual, sem sugerir necessariamente uma instituição religiosa moderna.
- source_word: מַה נַּעֲשֶׂה
  choice: Que faremos
  rationale: O interrogativo com o imperfeito na primeira pessoa do plural expressa deliberação sobre uma ação futura; “Que faremos” reproduz essa força de modo direto e natural.
- source_word: לַנּוֹתָרִים
  choice: para os que restaram
  rationale: O particípio refere-se aos homens que permaneceram depois da matança. A formulação mantém o sentido participial sem explicitar “sobreviventes” no texto.
- source_word: לְנָשִׁים
  choice: para conseguir esposas
  rationale: Neste contexto, נָשִׁים refere-se a mulheres na condição de esposas. O verbo “conseguir” é uma explicitação idiomática exigida pela construção portuguesa e não especifica o meio pelo qual isso ocorreria.
- source_word: כִּי
  choice: visto que
  rationale: כִּי introduz a razão da pergunta. “Visto que” comunica claramente a relação causal em registro digno e corrente.
- source_word: נִשְׁמְדָה
  choice: foram exterminadas
  rationale: O nifal de שׁמד indica destruição completa ou extermínio. “Foram exterminadas” conserva a severidade da afirmação e concorda com o coletivo plural usado na tradução.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: as mulheres de Benjamim
  rationale: A expressão traz literalmente “de Benjamim, uma mulher”, com אִשָּׁה no singular em sentido coletivo. O plural em português transmite naturalmente a referência às mulheres benjaminitas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe deliberativa do hebraico foi mantida, enquanto a expressão sobre obter esposas recebeu a explicitação mínima necessária para soar natural em português. O singular coletivo hebraico foi vertido no plural e documentado em nota.
