base_translation:
  language: en
  yaml_path: translation/ot/judges/021/013.yaml
  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: pt
  text: Então toda a comunidade enviou uma mensagem aos filhos de Benjamim que estavam no rochedo de Rimom[a] e falou-lhes, proclamando-lhes paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Sela-Rimom”; o hebraico pode ser entendido como a expressão descritiva “o rochedo de Rimom” ou como um topônimo mais fixo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: enviou mensageiros
  rationale: O verbo significa literalmente “enviar”. O objeto não é expresso, mas a oração seguinte indica uma missão de comunicação. Em português, “enviou mensageiros para falar” torna a relação sintática natural, embora explicite os agentes implícitos.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel. “Comunidade” é corrente e preserva o sentido coletivo; “toda” traduz כָּל.
- source_word: וַיְדַבְּרוּ אֶל
  choice: para falar com
  rationale: דבר אל significa “falar a/com”. A construção infinitiva em português liga naturalmente o envio à finalidade comunicativa, sem alterar o conteúdo.
- source_word: בְּנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Mantém a expressão tribal e familiar literal do hebraico, em vez de generalizá-la como “benjaminitas”.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: que estavam no rochedo de Rimom
  rationale: סֶלַע significa “rocha”, “penhasco” ou “rochedo”. “Rochedo de Rimom” preserva a leitura descritiva da construção, enquanto a possível leitura como topônimo fixo é registrada em nota.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: lhes proclamou a paz
  rationale: A expressão comunica uma declaração formal de relações pacíficas. “Proclamou a paz” conserva a força pública e declarativa de קרא, e a concordância singular retoma naturalmente “toda a comunidade”.
- source_word: שָׁלוֹם
  choice: paz
  rationale: Neste contexto, שָׁלוֹם indica reconciliação ou relações pacíficas; “paz” é a tradução direta e suficientemente ampla.
