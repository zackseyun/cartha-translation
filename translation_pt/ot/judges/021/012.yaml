revisions:
- from: E, entre os habitantes de Jabes-Gileade, encontraram quatrocentas moças virgens que não tinham conhecido homem, deitando-se com varão; e as levaram ao acampamento em Siló, que fica na terra de Canaã.
  to: E encontraram, entre os habitantes de Jabes-Gileade, quatrocentas jovens virgens que não tinham conhecido homem, isto é, não se tinham deitado com homem; e as levaram ao acampamento em Siló, que fica na terra de Canaã.
  rationale: A revisão conserva todos os elementos informativos do hebraico, inclusive a redundância deliberada entre «virgens» e a explicação sexual. «Isto é» torna explícita, em português natural, a relação explicativa já presente na construção hebraica, sem reduzir o eufemismo a uma paráfrase interpretativa. Não são necessárias notas de rodapé.
