base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: pt
  text: E encontraram, entre os habitantes de Jabes-Gileade, quatrocentas jovens virgens que não tinham conhecido homem, isto é, não se tinham deitado com homem; e as levaram ao acampamento em Siló, que fica na terra de Canaã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: entre os habitantes de Jabes-Gileade
  rationale: O hebraico usa מִן, formalmente «de», mas aqui a expressão indica o grupo no qual as moças foram encontradas; «entre» comunica essa relação com naturalidade em português.
- source_word: נַעֲרָה בְתוּלָה
  choice: moças virgens
  rationale: נַעֲרָה designa jovens do sexo feminino, e בְתוּלָה especifica sua virgindade; a tradução mantém os dois elementos sem fundi-los.
- source_word: לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: não tinham conhecido homem, deitando-se com varão
  rationale: Preserva o eufemismo hebraico «conhecer» e a formulação sexual explícita que o qualifica, sem reduzir a expressão simplesmente a «não tiveram relações».
- source_word: הַמַּחֲנֶה שִׁלֹה
  choice: o acampamento em Siló
  rationale: O topônimo funciona como indicação locativa do acampamento; «em Siló» é português natural e evita sugerir que Siló seja o nome do acampamento.
- source_word: אֶרֶץ כְּנָעַן
  choice: terra de Canaã
  rationale: Equivalente tradicional, claro e direto da expressão geográfica hebraica.
theological_decisions:
- issue: Descrição da virgindade das jovens
  choice: Manter tanto «virgens» quanto a explicação de que não haviam conhecido homem sexualmente
  alternative: Condensar como «que nunca tinham tido relações sexuais»
  rationale: A redundância pertence ao texto hebraico e é narrativa e juridicamente significativa no contexto; preservá-la evita interpretar além da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se a aspereza deliberada da expressão hebraica sobre relações sexuais; «varão» é usado apenas nesse sintagma para distinguir זָכָר de אִישׁ e reproduzir sua formulação marcada.
