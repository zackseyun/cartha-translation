base_translation:
  language: en
  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: pt
  text: O povo foi recenseado e eis que não havia ali homem algum dentre os habitantes de Jabes-Gileade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: foi contado
  rationale: A forma de פקד descreve a realização de uma contagem ou chamada do povo reunido. “Foi contado” é natural em português e se ajusta à constatação subsequente de que ninguém de Jabes-Gileade estava presente.
- source_word: הָעָם
  choice: o povo
  rationale: עָם designa o corpo israelita reunido. “O povo” conserva a amplitude do hebraico sem especificar indevidamente “exército” ou “tropas”.
- source_word: וְהִנֵּה
  choice: e, para surpresa de todos
  rationale: הִנֵּה chama a atenção para uma descoberta inesperada. Esta formulação comunica de modo natural a vivacidade e a surpresa narrativa em português moderno.
- source_word: אֵין שָׁם אִישׁ
  choice: não havia ali nenhum homem
  rationale: A expressão hebraica emprega אִישׁ, “homem”, no singular com negação existencial. A tradução mantém a referência masculina, apropriada ao contexto representativo ou militar.
- source_word: מִיּוֹשְׁבֵי
  choice: entre os habitantes de
  rationale: O particípio de ישב designa os residentes de um lugar. Com uma expressão negativa de presença, “entre os habitantes de” comunica naturalmente que nenhum deles fazia parte do grupo contado.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Jabes-Gileade
  rationale: Forma portuguesa convencional e transparente do topônimo composto.
