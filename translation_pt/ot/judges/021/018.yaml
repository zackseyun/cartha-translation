  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. Conserva-se “filhos de Israel” por correspondência formal e “Benjamim” no corpo do texto para preservar a formulação compacta e a ambiguidade corporativa do hebraico.
