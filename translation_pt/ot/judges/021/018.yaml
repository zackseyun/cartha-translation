  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: pt
  text: 'Mas nós não podemos dar-lhes esposas dentre as nossas filhas, porque os filhos de Israel juraram: “Maldito aquele que der uma esposa a Benjamim[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “à tribo de Benjamim” ou “a um benjamita”; o hebraico emprega diretamente o nome tribal “Benjamim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Mas nós
  rationale: A conjunção, acompanhada do pronome independente enfático, introduz um contraste no raciocínio; “Mas nós” preserva tanto a progressão discursiva quanto a ênfase no sujeito.
- source_word: לֹא נוּכַל
  choice: não podemos
  rationale: יכל expressa capacidade ou possibilidade. O contexto mostra que a impossibilidade decorre do juramento, sem que seja necessário acrescentar “licitamente” ao texto.
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: dar-lhes esposas dentre as nossas filhas
  rationale: “Esposas” comunica o sentido matrimonial de נָשִׁים, e “dentre as nossas filhas” expressa com naturalidade a ideia de origem ou seleção marcada por מן.
- source_word: כִּי
  choice: porque
  rationale: A partícula introduz a razão da impossibilidade declarada.
- source_word: נִשְׁבְּעוּ בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel juraram
  rationale: “Juraram” traduz diretamente o nifal de שׁבע. “Filhos de Israel” conserva a forma masculina e genealógica da expressão hebraica.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem naturalmente o conteúdo direto do juramento, sem a formulação mais pesada “dizendo”.
- source_word: אָרוּר
  choice: Maldito
  rationale: Equivalente corrente e solene para a fórmula de maldição אָרוּר.
- source_word: נֹתֵן אִשָּׁה
  choice: aquele que der uma esposa
  rationale: O particípio tem valor genérico. A construção preserva o singular e explicita de modo natural em português o ato contemplado pelo juramento.
- source_word: לְבִנְיָמִן
  choice: a Benjamim
  rationale: Mantém o nome tribal usado diretamente no hebraico, sem resolver no corpo do texto se a referência é corporativa ou distributiva.
theological_decisions: []
