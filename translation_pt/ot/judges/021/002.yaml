revisions:
- from: Então o povo foi a Betel e ficou ali sentado diante de Deus até a tarde. Eles ergueram a voz e choraram amargamente.[a]
  to: Então o povo chegou a Betel e se sentou ali, diante de Deus, até o anoitecer. Eles levantaram a voz e choraram intensamente.[a]
  rationale: A revisão conserva a sequência e os referentes do hebraico, torna mais exata a indicação temporal e substitui uma interpretação emocional específica por uma expressão portuguesa que comunica a intensidade não especificada do choro. A nota mantém visível a construção cognata hebraica.
