base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: pt
  text: Então o povo chegou a Betel e se sentou ali, diante de Deus, até o anoitecer. Eles levantaram a voz e choraram intensamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “choraram um grande choro”; a repetição de termos da mesma raiz intensifica o pranto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi
  rationale: בוא descreve a chegada a Betel. Em português narrativo, “foi a Betel” expressa naturalmente o deslocamento até o lugar; “entrou” acrescentaria uma precisão ausente no hebraico.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa coletivamente os israelitas reunidos, sem restringi-los a um exército.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Trata-se do topônimo, vertido segundo a forma tradicional em português, e não da expressão comum “casa de Deus”.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: ficou ali sentado
  rationale: ישב pode significar sentar-se, habitar ou permanecer. A formulação mantém tanto a postura concreta quanto a duração da permanência, com concordância coletiva natural para “o povo”.
- source_word: עַד הָעֶרֶב
  choice: até a tarde
  rationale: Expressão temporal direta; “até a tarde” é idiomático e claro em português.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  rationale: Preserva a fórmula de presença לִפְנֵי e traduz הָאֱלֹהִים por “Deus”, sem substituí-lo pelo nome divino.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: ergueram a voz
  rationale: Reproduz de modo natural a expressão hebraica para clamar ou chorar audivelmente.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: choraram amargamente
  rationale: A construção cognata intensifica o choro. “Choraram amargamente” comunica essa intensidade em português atual sem a artificialidade de “choraram um grande choro”; a forma hebraica é registrada em nota.
theological_decisions:
- issue: Tradução de הָאֱלֹהִים em contexto de culto
  choice: Deus
  alternative: o SENHOR
  rationale: O texto hebraico traz הָאֱלֹהִים, e não o nome YHWH. A tradução mantém essa distinção e evita harmonização teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases reduz o encadeamento excessivo sem perder a sequência narrativa. O marcador [a] aparece no texto principal e explica a construção cognata hebraica.
