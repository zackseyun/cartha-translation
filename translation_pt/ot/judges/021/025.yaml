base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: pt
  text: Naqueles dias, não havia rei em Israel; cada homem fazia o que era certo aos seus próprios olhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Fórmula temporal narrativa corrente, que preserva o enquadramento retrospectivo do hebraico em português natural.
- source_word: אֵין מֶלֶךְ
  choice: não havia rei
  rationale: A construção existencial negativa é expressa de modo idiomático e direto em português.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Reproduz diretamente a expressão locativa que identifica o contexto nacional.
- source_word: אִישׁ
  choice: cada homem
  rationale: Preserva o substantivo masculino singular empregado distributivamente no hebraico, sem ocultar sua forma.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: O adjetivo substantivado designa aquilo que alguém considerava reto ou correto; esta formulação é natural e conserva o valor moral.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Mantém a conhecida expressão hebraica de avaliação subjetiva; “próprios” explicita naturalmente o valor reflexivo em português.
- source_word: יַעֲשֶׂה
  choice: fazia
  rationale: O imperfeito hebraico descreve aqui uma prática habitual no passado; o pretérito imperfeito português comunica bem esse aspecto.
theological_decisions:
- issue: Linguagem representativa masculina em אִישׁ
  choice: cada homem
  alternative: cada um / todos
  rationale: A escolha conserva o masculino singular distributivo do texto hebraico. Embora o sentido possa abranger a população em geral, a tradução não neutraliza silenciosamente a forma da fonte.
- issue: Avaliação implícita do refrão
  choice: o que era certo aos seus próprios olhos
  alternative: o que bem entendia / o que lhe agradava
  rationale: 'A redação preserva a tensão do texto: o narrador relata a avaliação subjetiva de cada homem sem acrescentar uma condenação mais explícita do que a formulada em hebraico.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das orações e o ponto e vírgula preservam o paralelismo lógico e o caráter conclusivo do refrão.
