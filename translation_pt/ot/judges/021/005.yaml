  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: pt
  text: 'E os filhos de Israel disseram[a]: “Quem, dentre todas as tribos de Israel, não subiu a Yahweh na assembleia?” Pois havia sido feito um grande juramento contra quem não subiu a Yahweh, em Mispá: “Certamente será morto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas disseram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão corporativa masculina do hebraico, embora “os israelitas” seja mais idiomático em português.
- source_word: מִי אֲשֶׁר
  choice: Quem
  rationale: A construção interrogativa e relativa pede que se identifique quem se enquadra na descrição; “Quem” exprime isso naturalmente em português.
- source_word: לֹא עָלָה
  choice: não subiu
  rationale: Mantém o sentido comum de עלה e a perspectiva de deslocamento para o local da assembleia.
- source_word: בַקָּהָל
  choice: à assembleia
  rationale: Embora ב tenha normalmente valor locativo, aqui a expressão se liga idiomaticamente ao ato de comparecer à reunião; “à assembleia” comunica o destino sem recorrer ao eclesiástico “congregação”.
- source_word: אֶל יְהוָה
  choice: perante Yahweh / a Yahweh
  rationale: Na primeira ocorrência, “perante Yahweh” evita a impressão de que Yahweh seja um destino espacial e exprime a reunião em sua presença; na segunda, “subisse a Yahweh, em Mispá” conserva mais de perto a construção hebraica e sua tensão sintática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: um grande juramento
  rationale: Reproduz diretamente o substantivo e o adjetivo, sem reduzir “grande” apenas a “solene”.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: havia sido feito ... contra quem
  rationale: A construção indica que o juramento tinha força contra a pessoa que não comparecesse; a formulação portuguesa preserva seu caráter jurídico.
- source_word: הַמִּצְפָּה
  choice: em Mispá
  rationale: Trata Mispá como topônimo e indica o local da reunião.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo citado do juramento, sem necessidade de traduzir mecanicamente “dizendo”.
- source_word: מוֹת יוּמָת
  choice: Certamente será morto
  rationale: A construção com infinitivo absoluto intensifica a forma passiva e indica execução, não apenas morte em sentido genérico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva como nome, em vez de substituí-lo por um título.
- issue: Expressão corporativa masculina בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução conserva a forma masculina e a imagem de descendência presentes no hebraico, sem negar seu referente coletivo.
- issue: Força judicial de מוֹת יוּמָת
  choice: Certamente será morto
  alternative: certamente morrerá
  rationale: A forma verbal passiva e o contexto do juramento favorecem uma pena imposta, embora a alternativa expresse a mesma certeza básica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “filhos de Israel” e “Yahweh” por transparência ao hebraico. A ordem da primeira pergunta foi levemente ajustada para fluidez, e a segunda formulação mantém a associação de Mispá com a subida a Yahweh sem eliminar inteiramente a tensão sintática do original.
