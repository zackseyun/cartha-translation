  to: 'E os filhos de Israel disseram[a]: “Quem, dentre todas as tribos de Israel, não subiu a Yahweh na assembleia?” Pois havia sido feito um grande juramento contra quem não subiu a Yahweh, em Mispá: “Certamente será morto.”'
