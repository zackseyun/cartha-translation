  yaml_path: translation/ot/judges/021/020.yaml
  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: pt
  text: 'E ordenaram aos benjamitas[a]: “Vão e fiquem de emboscada[b] nas vinhas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aos filhos de Benjamim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fiquem à espreita”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/יצו
  choice: E ordenaram
  rationale: O verbo צוה significa “ordenar, encarregar, instruir”. A forma fornecida é entendida como plural, em concordância com o grupo que fala no contexto; a conjunção ו é representada por “E”.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: aos benjamitas
  rationale: A expressão hebraica significa literalmente “os filhos de Benjamim”, mas “benjamitas” comunica naturalmente em português a pertença tribal sem alterar o referente. A forma literal é preservada em nota.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz a fala direta. Em português atual, os dois-pontos cumprem essa função de modo mais natural do que o particípio “dizendo”.
- source_word: לְכוּ
  choice: Vão
  rationale: Imperativo plural de הלך, vertido diretamente pelo imperativo plural português.
- source_word: וַאֲרַבְתֶּם
  choice: e fiquem de emboscada
  rationale: O verbo ארב descreve a ação de esconder-se e aguardar uma oportunidade para atacar ou capturar. “Fiquem de emboscada” preserva o valor verbal e o sentido imperativo no contexto.
- source_word: בַּכְּרָמִים
  choice: nas vinhas
  rationale: Tradução direta de כרמים com a preposição ב; “nas vinhas” é clara e natural no cenário narrativo.
theological_decisions: []
