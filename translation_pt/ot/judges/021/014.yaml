base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: pt
  text: Naquele tempo, Benjamim voltou, e lhes deram as mulheres que haviam mantido vivas dentre as mulheres de Jabes-Gileade; mas, desse modo, não encontraram mulheres suficientes para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “mas não encontraram assim para eles”. A expressão hebraica é elíptica; no contexto, significa que não havia mulheres suficientes para todos eles por esse meio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב, nesta sequência narrativa, indica que Benjamim retornou ao convívio com a comunidade de Israel.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: O nome singular designa coletivamente a tribo; manter “Benjamim” preserva a forma do hebraico e é natural no contexto.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal corrente que preserva o marcador narrativo hebraico.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: e lhes deram
  rationale: נתן significa diretamente “dar”; o pronome retoma coletivamente os benjamitas, enquanto o sujeito permanece implícito como no hebraico.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: O substantivo significa “mulheres”; embora o contexto indique que seriam dadas como esposas, o texto não usa aqui um termo mais específico.
- source_word: אֲשֶׁר חִיּוּ
  choice: que haviam mantido vivas
  rationale: A forma piel de חיה expressa que essas mulheres foram preservadas com vida após a matança.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: dentre as mulheres de Jabes-Gileade
  rationale: A preposição מן indica o grupo do qual essas mulheres foram retiradas; “dentre” torna clara essa relação partitiva.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: mas, desse modo, não encontraram mulheres suficientes para eles
  rationale: A frase hebraica é elíptica; o contexto indica que esse meio não forneceu mulheres em número suficiente. A tradução explicita apenas o complemento exigido pelo contexto, e a nota preserva a formulação mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Benjamim” conserva o nome coletivo da tribo; “mulheres”, em vez de “esposas”, evita tornar mais específico o termo hebraico. A elipse da oração final é esclarecida no texto e documentada em nota.
