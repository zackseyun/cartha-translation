source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: pt
  text: 'E isto é o que vocês farão: todos os do sexo masculino e toda mulher que tenha tido relações sexuais com um homem[a], vocês consagrarão à destruição[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «que tenha conhecido o leito de um homem». Trata-se de um eufemismo hebraico para relações sexuais.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica indica pôr alguém sob uma interdição destinada à destruição, e não simplesmente matá-lo.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה
  choice: E isto
  rationale: Mantém a conjunção hebraica e a continuidade narrativa, introduzindo a instrução seguinte.
- source_word: הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: é o que vocês farão
  rationale: Reproduz de modo natural a construção hebraica «esta é a coisa que farão», preservando sua força diretiva.
- source_word: כָּל זָכָר
  choice: todos os do sexo masculino
  rationale: זָכָר indica sexo masculino, sem se limitar a homens adultos. A formulação evita a ambiguidade de «todo homem» e inclui o alcance total expresso no contexto.
- source_word: וְ/כָל אִשָּׁה
  choice: e toda mulher
  rationale: אִשָּׁה designa aqui uma mulher, em contraste com os do sexo masculino, e recebe em seguida uma qualificação ligada à experiência sexual.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: que tenha conhecido o leito de um homem
  rationale: Conserva o eufemismo hebraico para relações sexuais e seu tom solene; uma formulação explícita é fornecida em nota.
- source_word: תַּחֲרִימוּ
  choice: vocês consagrarão à destruição
  rationale: O hifil de חרם indica colocar pessoas sob a interdição destinada à destruição, ideia mais específica do que simplesmente matar.
theological_decisions:
- issue: Tradução de חרם em contexto de guerra e juízo
  choice: consagrarão à destruição
  alternative: destruirão completamente; colocarão sob interdição
  rationale: A escolha preserva a dimensão religioso-jurídica da interdição, sem reduzir o termo à morte comum nem empregar uma expressão excessivamente técnica no texto principal.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com uso de «vocês» para a segunda pessoa do plural. A ordem marcada dos objetos antes do verbo foi mantida para refletir a ênfase do hebraico. «Todos os do sexo masculino» evita o arcaísmo «todo varão» e deixa claro que o texto não se restringe a adultos.
