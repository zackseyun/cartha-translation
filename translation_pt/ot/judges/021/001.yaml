base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: pt
  text: 'Os homens de Israel tinham jurado em Mispá: “Nenhum homem dentre nós dará sua filha como esposa a Benjamim[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “a Benjamim” provavelmente significa “à tribo de Benjamim” ou “a um benjamita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Os homens de Israel
  rationale: Embora אִישׁ esteja no singular morfológico, a expressão tem sentido coletivo e se refere aos homens israelitas como grupo. O waw liga o versículo ao contexto, mas não exige um conectivo explícito em português.
- source_word: נִשְׁבַּע
  choice: tinham jurado
  rationale: O nifal de שׁבע significa “jurar, prestar juramento”. O mais-que-perfeito composto indica naturalmente que o juramento antecedeu os acontecimentos narrados a seguir.
- source_word: בַּמִּצְפָּה
  choice: em Mispá
  rationale: A preposição marca o lugar onde o juramento foi feito; “em Mispá” é a formulação natural em português.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: O infinitivo quotativo hebraico introduz o conteúdo do juramento. Em português atual, os dois-pontos expressam essa função com mais naturalidade do que “dizendo”.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Nenhum de nós
  rationale: No contexto negativo do juramento, a expressão distributiva significa que nenhum homem do grupo deveria fazer isso. A formulação é clara e natural, sem perder o alcance individual.
- source_word: לֹא יִתֵּן
  choice: dará
  rationale: O imperfeito negado, dentro de um juramento, exprime um compromisso vinculante quanto ao futuro. Em português, o futuro do presente comunica adequadamente essa força solene.
- source_word: בִּתּוֹ
  choice: sua filha
  rationale: Reproduz o substantivo singular com o sufixo possessivo de terceira pessoa, cujo referente distributivo é cada homem de Israel.
- source_word: לְבִנְיָמִן
  choice: a Benjamim
  rationale: Mantém de perto o nome singular hebraico, que neste contexto pode designar coletivamente a tribo de Benjamim ou individualmente um benjamita; a nota preserva essa extensão de sentido.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: A construção indica dar a filha em casamento para que se torne esposa; “como esposa” é clara, digna e próxima do idioma hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura do juramento foi preservada sem arcaísmos desnecessários. O marcador da nota foi colocado após “Benjamim”, termo ao qual a explicação lexical se refere.
