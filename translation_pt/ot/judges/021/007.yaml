base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: pt
  text: O que faremos por eles — pelos que restaram — para conseguir esposas?[a][b] Pois juramos por Yahweh[c] não lhes dar nenhuma de nossas filhas como esposas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para esposas”; “para conseguir esposas” explicita o sentido implícito.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pelos sobreviventes”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “o SENHOR”; o hebraico traz o nome divino YHWH.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: O que faremos
  rationale: A pergunta com מַה e o imperfeito de עשה expressa deliberação sobre a medida a tomar; a formulação portuguesa é natural e preserva esse valor.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: por eles — pelos que restaram
  rationale: O primeiro ל indica benefício, e a expressão seguinte identifica os beneficiários como os homens sobreviventes de Benjamim. Os travessões preservam a aposição enfática.
- source_word: לְנָשִׁים
  choice: para conseguir esposas
  rationale: A expressão hebraica é elíptica, literalmente 'para esposas'. O verbo 'conseguir' explicita com moderação o propósito implícito no contexto.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: Pois juramos
  rationale: A conjunção introduz a razão do dilema. Em português, o pretérito perfeito comunica naturalmente o juramento passado que continua vinculante.
- source_word: בַיהוָה
  choice: por Yahweh
  rationale: A preposição marca aquele por quem se jura, e o tetragrama é transliterado como o nome divino Yahweh.
- source_word: לְבִלְתִּי תֵּת לָהֶם מִבְּנוֹתֵינוּ לְנָשִׁים
  choice: que não lhes daríamos nenhuma de nossas filhas como esposa
  rationale: A oração expressa o conteúdo do juramento; מן tem sentido partitivo, bem representado por 'nenhuma de', e o segundo לְנָשִׁים indica a condição matrimonial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto principal o nome próprio da aliança, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição explicativa é mantida por travessões, e a elipse hebraica recebe uma expansão mínima sinalizada em nota.
