  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: pt
  text: 'E disseram: “Por que, ó Yahweh, Deus de Israel, isto aconteceu em Israel, a ponto de hoje faltar uma tribo de Israel?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “E disseram” preserva essa ligação de modo natural.
- source_word: לָמָה
  choice: Por que
  rationale: Expressa diretamente a pergunta de lamento e corresponde ao interrogativo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Reproduz com clareza a cadeia construta e a identificação de Yahweh como o Deus de Israel.
- source_word: הָיְתָה זֹּאת
  choice: aconteceu isto
  rationale: A expressão é literalmente “isto foi/existiu”, mas no contexto constitui uma forma idiomática de perguntar por que tal situação ocorreu.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Mantém o sentido locativo e corporativo da preposição ב.
- source_word: לְהִפָּקֵד
  choice: falte
  rationale: O infinitivo nifal de פקד indica aqui ausência ou falta dentro do conjunto; “falte” é conciso, natural e preserva a ideia resultante.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Conserva a ênfase temporal do hebraico em português corrente.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição מן marca separação ou ausência em relação ao corpo nacional.
- source_word: שֵׁבֶט אֶחָד
  choice: uma tribo
  rationale: Designa uma única unidade tribal; no contexto existencial de “faltar”, o artigo indefinido é idiomático em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; não se afirma certeza absoluta sobre a vocalização antiga.
- issue: Natureza da pergunta dirigida a Deus
  choice: Preservar a pergunta de lamento sem explicá-la teologicamente
  alternative: Reformular como acusação, pedido de explicação ou declaração de soberania
  rationale: O hebraico pergunta “por que” sem resolver a tensão entre a ação humana narrada e a situação apresentada diante de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “ó Yahweh” preserva o vocativo solene; os dois-pontos apresentam naturalmente o conteúdo da situação lamentada. Não foram acrescentadas notas, pois as alternativas lexicais não são necessárias para compreender o versículo.
