  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: pt
  text: 'E acontecerá que, quando os pais ou os irmãos delas vierem discutir conosco[a], nós lhes diremos: “Concedam-nas a nós como um favor[b], pois não tomamos, na guerra, uma mulher para cada homem[c]. Afinal, não foram vocês que as deram a eles[d]; do contrário, agora vocês incorreriam em culpa[e]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vierem apresentar queixa contra nós” ou “vierem pleitear conosco”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Sejam bondosos conosco quanto a elas”. A expressão é difícil: pode ser entendida como um apelo por tolerância para com os que falam, no caso das mulheres; também pode ser traduzida: “Concedam-nos essas mulheres como favor”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico é conciso: “não tomamos, na batalha, cada homem a sua mulher”. Provavelmente significa que não haviam sido obtidas na guerra mulheres suficientes para todos os homens de Benjamim.'
    reason: cultural_note
  - marker: d
    text: Isto é, as famílias não entregaram voluntária e formalmente as mulheres aos benjamitas.
    reason: clarification
  - marker: e
    text: A construção hebraica da última frase é difícil. O sentido provável é que, como as famílias não deram formalmente as mulheres, não seriam consideradas culpadas de violar o juramento.
    reason: textual_difficulty
lexical_decisions:
- source_word: לָרִיב
  choice: vierem discutir conosco
  rationale: ריב expressa disputa, queixa ou contenda. “Discutir conosco” conserva o caráter adversativo sem tornar a situação necessariamente um processo judicial formal.
- source_word: חָנּוּנוּ אוֹתָם
  choice: Tenham consideração por nós no caso delas
  rationale: O imperativo de חנן com sufixo de primeira pessoa do plural pede favor ou clemência aos interlocutores; אוֹתָם liga o pedido às mulheres. A formulação mantém ambos os elementos sem decidir que elas estejam sendo formalmente concedidas aos benjamitas.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: não conseguimos tomar na batalha uma mulher para cada homem
  rationale: A frase hebraica é condensada. No contexto, indica que as mulheres obtidas na guerra não bastaram para que cada benjamita tivesse esposa. “Não conseguimos” comunica essa insuficiência contextual, enquanto “tomar na batalha” preserva a ação e o cenário.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: não foram vocês que as deram a eles
  rationale: 'A distinção pronominal é mantida com clareza: “as” se refere às mulheres e “a eles”, aos homens de Benjamim. A construção enfatiza que as famílias não as entregaram formalmente em casamento.'
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: se fosse assim, agora vocês seriam culpados
  rationale: A cláusula final é difícil e elíptica. No contexto, a culpa recairia sobre as famílias caso elas próprias tivessem dado as mulheres, contrariando o juramento. A condicional explicita a relação lógica implícita, preservando כָּעֵת como “agora”.
