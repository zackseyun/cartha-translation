    issue: “não conseguimos tomar” acrescenta incapacidade
    rationale: O perfeito hebraico לֹא לָקַחְנוּ significa “não tomamos”; embora o contexto explique a insuficiência de mulheres, “conseguimos” explicita uma inferência que o texto não enuncia.
  - severity: medium
    issue: A tradução principal de חָנּוּנוּ אֹתָם é excessivamente indireta
    rationale: “Tenham consideração por nós no caso delas” enfraquece a ligação do pedido com as mulheres. Uma formulação de concessão como favor reproduz mais naturalmente o apelo contextual, enquanto a nota deve preservar a ambiguidade sintática.
  - severity: low
    issue: “se fosse assim” tem antecedente pouco definido
    rationale: 'A cláusula final difícil é mais clara em português como uma consequência contrafactual: se as famílias tivessem dado as mulheres, incorreriam agora em culpa.'
