- from: 'E acontecerá que, quando os pais ou os irmãos delas vierem discutir conosco[a], nós lhes diremos: “Tenham consideração por nós no caso delas[b], pois não conseguimos tomar na batalha uma mulher para cada homem[c]. Afinal, não foram vocês que as deram a eles[d]; se fosse assim, agora vocês seriam culpados[e]”.'
  to: 'E acontecerá que, quando os pais ou os irmãos delas vierem discutir conosco[a], nós lhes diremos: “Concedam-nas a nós como um favor[b], pois não tomamos, na guerra, uma mulher para cada homem[c]. Afinal, não foram vocês que as deram a eles[d]; do contrário, agora vocês incorreriam em culpa[e]”.'
  rationale: A revisão remove a inferência não expressa de incapacidade em “não conseguimos”, torna o pedido relativo às mulheres mais natural e explícito em português e substitui a condicional de antecedente vago por uma consequência contrafactual clara. As notas mantêm as alternativas e a incerteza da sintaxe hebraica, sobretudo em relação ao pedido de favor e à cláusula final.
