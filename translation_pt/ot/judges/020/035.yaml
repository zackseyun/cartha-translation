  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: pt
  text: Yahweh feriu Benjamim diante de Israel[a], e os filhos de Israel[b] destruíram, naquele dia, vinte e cinco mil e cem homens de Benjamim, todos eles desembainhando a espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derrotou Benjamim diante de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os israelitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: feriu
  rationale: No contexto militar, נָגַף comunica a ação de golpear e derrotar. “Feriu” mantém a imagem da ação divina sem reduzir o verbo apenas ao resultado estratégico; a alternativa idiomática é indicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: diante de Israel
  rationale: Preserva de maneira natural o idioma hebraico, que aqui descreve Benjamim sendo abatido no confronto com Israel.
- source_word: וַיַּשְׁחִיתוּ
  choice: destruíram
  rationale: O hifil de שׁחת denota destruir ou arruinar; neste relato de batalha, refere-se à destruição letal dos combatentes e mantém a força do hebraico.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz formalmente a expressão hebraica e é apropriado ao contexto de combatentes homens, sem generalizá-la silenciosamente.
- source_word: בְּבִנְיָמִן
  choice: de Benjamim
  rationale: Em português, a construção indica naturalmente que os mortos pertenciam à tribo ou força de Benjamim.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: vinte e cinco mil e cem homens
  rationale: É a forma portuguesa clara e direta da contagem hebraica de combatentes.
- source_word: כָּל אֵלֶּה
  choice: todos eles
  rationale: Retoma os homens contados anteriormente sem acrescentar uma qualificação ausente do texto.
- source_word: שֹׁלֵף חָרֶב
  choice: homens que desembainhavam a espada
  rationale: Conserva a imagem literal de sacar a espada e comunica que todos os contados eram combatentes armados.
theological_decisions:
- issue: Agência no resultado da batalha
  choice: Manter explícitas tanto a ação de Yahweh, que feriu Benjamim, quanto a ação dos filhos de Israel, que destruíram os homens de Benjamim.
  alternative: Explicar o resultado exclusivamente como causalidade divina ou exclusivamente como vitória militar humana.
  rationale: O hebraico apresenta as duas ações em sequência, sem dissolver uma na outra. A tradução preserva essa tensão entre soberania divina e ação humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações conserva a progressão do hebraico; a colocação de “naquele dia” foi ajustada para fluência sem alterar seu vínculo com o total de mortos.
