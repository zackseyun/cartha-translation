  to: Yahweh feriu Benjamim diante de Israel[a], e os filhos de Israel[b] destruíram, naquele dia, vinte e cinco mil e cem homens de Benjamim, todos eles desembainhando a espada.
  rationale: A revisão elimina uma redundância estilística na caracterização final e torna a nota b efetivamente informativa, sem alterar o sentido, a agência divina e humana, a contagem ou a imagem de combatentes que desembainham a espada.
