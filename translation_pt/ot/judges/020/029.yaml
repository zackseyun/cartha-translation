  yaml_path: translation/ot/judges/020/029.yaml
  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: pt
  text: Então Israel posicionou homens que estavam de emboscada ao redor de Gibeá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “posicionou os que armavam emboscada em direção a/ao redor de Gibeá”. A expressão se refere ao posicionamento de uma força de emboscada em torno da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: posicionou
  rationale: O verbo שׂוּם significa pôr, colocar ou estabelecer. No contexto militar, “posicionou” expressa com naturalidade a colocação deliberada da força de emboscada.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O nome próprio designa coletivamente a força israelita.
- source_word: אֹרְבִים
  choice: homens de emboscada
  rationale: O particípio plural de ארב refere-se às pessoas que ficam à espreita, não apenas à emboscada como plano abstrato. A expressão conserva esse sentido pessoal em português claro.
- source_word: אֶל ... סָבִיב
  choice: ao redor de
  rationale: Embora אֶל isoladamente possa significar “para”, “em direção a” ou “contra”, sua combinação com סָבִיב neste contexto descreve a disposição da força em torno de Gibeá.
- source_word: הַגִּבְעָה
  choice: Gibeá
  rationale: É o nome geográfico tradicional em português; o artigo hebraico não precisa ser reproduzido diante do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia militar acessível. “Posicionou” evita uma formulação rígida, e “homens de emboscada” preserva o caráter pessoal do particípio hebraico.
