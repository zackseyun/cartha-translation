  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: pt
  text: Então os benjaminitas viram que estavam derrotados. Os homens de Israel haviam cedido terreno a Benjamim[a], pois confiavam na emboscada[b] que tinham armado contra Gibeá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “haviam dado lugar a Benjamim”. A expressão hebraica indica que Israel cedeu espaço ou recuou de propósito para atrair os benjaminitas.
    reason: lexical_alternative
  - marker: b
    text: Ou “nos homens que estavam de emboscada”. O termo hebraico pode referir-se tanto à emboscada quanto ao grupo que estava à espreita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ בְנֵי בִנְיָמִן
  choice: os benjaminitas viram
  rationale: “Viram” preserva o sentido básico de ראה e permite, pelo contexto, a ideia de percepção. “Os benjaminitas” expressa em português atual o gentílico hebraico literalmente formulado como “os filhos de Benjamim”.
- source_word: כִּי נִגָּפוּ
  choice: que estavam derrotados
  rationale: O nifal de נגף, em contexto militar, indica sofrer derrota. A formulação é natural e mantém o estado reconhecido pelos benjaminitas.
- source_word: וַיִּתְּנוּ אִישׁ יִשְׂרָאֵל מָקוֹם לְבִנְיָמִן
  choice: Os homens de Israel haviam cedido terreno a Benjamim
  rationale: A expressão נתן מקום descreve aqui uma concessão tática de espaço. “Cedido terreno” comunica naturalmente a retirada deliberada, e o mais-que-perfeito esclarece que essa ação explica a percepção mencionada antes.
- source_word: כִּי בָטְחוּ אֶל הָאֹרֵב
  choice: pois confiavam na emboscada
  rationale: בטח expressa confiança ou dependência. אֹרֵב pode indicar tanto a emboscada quanto o grupo de homens à espreita; o texto principal usa a formulação mais corrente e registra a alternativa em nota.
- source_word: אֲשֶׁר שָׂמוּ אֶל הַגִּבְעָה
  choice: que tinham armado contra Gibeá
  rationale: שׂים pode significar pôr ou estabelecer; com “emboscada”, “armar” é idiomático em português. “Contra Gibeá” expressa a orientação tática da ação, embora a preposição também possa ser entendida em sentido locativo.
