base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: pt
  text: 'Naquele dia, os filhos de Benjamim foram contados para a guerra, vindos das cidades: vinte e seis mil homens que empunhavam a espada[a]; além dos habitantes de Gibeá, foram contados setecentos homens escolhidos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que sacavam a espada”; a expressão se refere a homens armados e aptos para a guerra.
    reason: idiom_clarification
  - marker: b
    text: Ou “homens de elite”; o termo hebraico também pode significar “jovens”, mas aqui provavelmente indica guerreiros selecionados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: foram contados para a guerra / foram contados
  rationale: O hitpael de פקד indica aqui recenseamento ou alistamento militar. A primeira ocorrência explicita o contexto bélico em português; a repetição de «contados» preserva o vínculo lexical entre as duas formas.
- source_word: בְנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Preserva a expressão tribal e genealógica do hebraico, sem substituí-la pelo gentílico interpretativo «benjamitas».
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Forma temporal natural em português, mantendo a força demonstrativa do original.
- source_word: מֵהֶעָרִים
  choice: vindos das cidades
  rationale: Expressa com clareza a procedência dos homens recenseados, sem acrescentar que fossem necessariamente cidades pertencentes a eles.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: vinte e seis mil homens
  rationale: Tradução direta do número e de אִישׁ; o caráter militar já é indicado pelo contexto e pela expressão seguinte.
- source_word: שֹׁלֵף חָרֶב
  choice: que empunhavam a espada
  rationale: Conserva a imagem concreta da espada e comunica naturalmente em português a ideia idiomática de homens aptos para o combate.
- source_word: לְבַד
  choice: além de
  rationale: Indica que o contingente de Gibeá é apresentado separadamente e se soma ao total anterior.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: dos habitantes de Gibeá
  rationale: Tradução natural da construção participial, preservando o sentido cívico e locativo.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: setecentos homens
  rationale: Correspondência numérica direta e natural em português.
- source_word: בָּחוּר
  choice: escolhidos
  rationale: No contexto militar, o termo provavelmente caracteriza homens selecionados ou de elite; a nota preserva a possibilidade lexical de referência a jovens.
