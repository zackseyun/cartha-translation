  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: pt
  text: Então os homens de Israel se voltaram[a], e os homens de Benjamim ficaram apavorados, pois viram que a desgraça os havia atingido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, as expressões “homem de Israel”, “homem de Benjamim”, “viu” e “sobre ele” estão no singular, mas são usadas coletivamente para designar as forças adversárias; por isso, foram traduzidas no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Então os homens de Israel
  rationale: Embora אִישׁ esteja no singular, a expressão tem sentido coletivo no contexto militar. O plural é natural em português, e “Então” apresenta a sequência narrativa.
- source_word: הָפַךְ
  choice: se voltaram
  rationale: O verbo descreve a mudança de direção dos israelitas no combate. “Se voltaram” preserva o sentido sem acrescentar a ideia mais específica de recuo.
- source_word: וַ/יִּבָּהֵל
  choice: ficaram apavorados
  rationale: בהל expressa terror ou perturbação súbita. “Ficaram apavorados” comunica claramente a intensidade da reação.
- source_word: אִישׁ בִּנְיָמִן
  choice: os homens de Benjamim
  rationale: O singular hebraico funciona coletivamente para designar a força combatente benjaminita; por isso, emprega-se o plural idiomático em português.
- source_word: כִּי רָאָה
  choice: pois viram
  rationale: O primeiro כִּי introduz a causa do terror, e o verbo singular concorda com um sujeito coletivo. O plural português explicita esse sentido.
- source_word: כִּי
  choice: que
  rationale: O segundo כִּי introduz o conteúdo daquilo que os benjaminitas perceberam.
- source_word: נָגְעָה עָלָיו
  choice: os havia atingido
  rationale: A expressão indica que a calamidade chegou até eles ou caiu sobre eles. “Os havia atingido” é natural no contexto de uma derrota já percebida como inevitável e mantém o valor coletivo do sufixo singular.
- source_word: הָרָעָה
  choice: a desgraça
  rationale: Aqui רָעָה denota calamidade ou desastre, não maldade moral. “Desgraça” expressa de modo claro a ruína que sobrevém no combate.
