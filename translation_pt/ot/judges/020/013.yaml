  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: pt
  text: Entreguem os homens[a], esses homens perversos que estão em Gibeá, para que os matemos e eliminemos o mal do meio de Israel. Mas Benjamim não quis dar ouvidos[b] a seus irmãos, os filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os homens, filhos da indignidade”; tradicionalmente, “filhos de Belial”.'
    reason: lexical_alternative
  - marker: b
    text: “Dar ouvidos” também pode significar “atender” ou “obedecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Entreguem
  rationale: No contexto judicial, o imperativo pede que os culpados sejam entregues à assembleia para receber a pena, e não simplesmente que sejam “dados”.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O hebraico é masculino plural e se refere aos perpetradores do crime.
- source_word: בְּנֵי בְלִיַּעַל
  choice: esses homens perversos
  rationale: A expressão idiomática caracteriza homens moralmente vis, sem transformar Belial em nome próprio. A nota preserva a forma literal.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: que estão em Gibeá
  rationale: Identifica os perpetradores por sua localização na cidade.
- source_word: וּנְמִיתֵם
  choice: para que os matemos
  rationale: O coortativo expressa a finalidade pretendida depois da entrega. A formulação é direta e natural, sem perder a dimensão judicial do contexto.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: e eliminemos o mal de Israel
  rationale: A fórmula jurídica e pactual fala da remoção do mal do meio da comunidade; “eliminar” comunica isso com clareza em português atual.
- source_word: וְלֹא אָבוּ בִּנְיָמִן
  choice: Mas Benjamim não quis
  rationale: O verbo expressa falta de disposição ou recusa; Benjamim funciona como nome coletivo da tribo.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: dar ouvidos a
  rationale: Expressão portuguesa natural que conserva a imagem auditiva do idioma hebraico e também admite o sentido de atender ou obedecer.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: aos seus irmãos, os filhos de Israel
  rationale: Mantém a linguagem de parentesco entre as tribos e a aposição formal que identifica esses irmãos.
theological_decisions:
- issue: Sentido de בְּנֵי בְלִיַּעַל
  choice: homens perversos, com nota literal “filhos da indignidade”
  alternative: filhos de Belial
  rationale: No contexto, a expressão é uma caracterização moral, não necessariamente referência a uma figura demoníaca pessoal. Evita-se importar associações teológicas posteriores.
- issue: Força judicial dos coortativos
  choice: para que os matemos e eliminemos o mal de Israel
  alternative: e nós os mataremos e removeremos o mal de Israel
  rationale: A redação conserva a finalidade judicial e a purificação comunitária, sem acrescentar explicação doutrinária.
- issue: Identidade coletiva de Benjamim
  choice: Benjamim não quis
  alternative: os benjamitas não quiseram
  rationale: Preserva o nome tribal singular do hebraico e sua função coletiva, sem apagar a tensão narrativa entre a tribo e seus irmãos israelitas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Gibeá” e “Benjamim” seguem as formas bíblicas usuais em português. A tradução conserva a linguagem fraterna e tribal, enquanto a nota registra o hebraísmo difícil sem sugerir indevidamente que Belial seja aqui um nome próprio.
