base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: pt
  text: Os homens de Israel saíram para combater Benjamim e se posicionaram em ordem de batalha contra eles[a], em Gibeá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com eles”. O hebraico pode ser entendido de modo mais literal como “com eles”, embora o contexto indique confronto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saíram
  rationale: Em contexto militar, יצא indica sair para uma ação ou confronto; “saíram” preserva o movimento sem acrescentar uma manobra específica.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: O singular morfológico funciona coletivamente para os combatentes israelitas; o plural é natural em português e conserva a referência masculina do contexto militar.
- source_word: לַמִּלְחָמָה עִם בִּנְיָמִן
  choice: para combater Benjamim
  rationale: A construção expressa finalidade e oposição militar. “Para combater” comunica isso com clareza e naturalidade.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: se posicionaram em ordem de batalha
  rationale: ערך, neste contexto, descreve a disposição organizada das tropas para o combate; a formulação explicita esse sentido militar sem exceder o hebraico.
- source_word: אִתָּם
  choice: contra eles
  rationale: Embora a preposição possa ter sentido associativo, o contexto de guerra deixa claro que os benjamitas são o lado adversário.
- source_word: אֶל הַגִּבְעָה
  choice: diante de Gibeá
  rationale: אֶל conserva uma orientação relacional ou direcional para a cidade. “Diante de Gibeá” é idiomático no cenário de tropas posicionadas e evita reduzir o termo a mera localização.
theological_decisions:
- issue: Linguagem coletiva masculina em אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  alternative: os israelitas; as forças de Israel
  rationale: O texto retrata os combatentes por meio de um coletivo masculino. A tradução preserva essa referência histórica sem substituí-la por uma abstração neutra.
- issue: Sentido adversativo das preposições no contexto bélico
  choice: combater Benjamim; contra eles
  alternative: com Benjamim; com eles
  rationale: O quadro narrativo é inequivocamente hostil; em português, “com eles” poderia sugerir aliança. A oposição é explicitada sem alterar as partes envolvidas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão militar “em ordem de batalha” preserva o caráter tático do verbo hebraico; “diante de Gibeá” mantém melhor que “em Gibeá” a nuance espacial de אֶל.
