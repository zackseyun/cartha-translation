  terminology: “Benjamim”, “Israel” e “Mispá” estão bem estabelecidos em português bíblico. “Mal” é uma escolha semanticamente ampla e fiel para רָעָה neste contexto. As notas apresentam alternativas úteis, sem impor uma interpretação doutrinária ou excessivamente específica.
