  source_fidelity: 'A tradução preserva com precisão a sequência e os principais elementos do hebraico: os filhos de Benjamim recebem a notícia da subida dos filhos de Israel a Mispá, seguida da fala dos filhos de Israel que pede uma explicação sobre o mal ocorrido. “Tinham subido” reproduz adequadamente a anterioridade contextual de עָלוּ após “ouviram”, e “este mal” mantém a força moralmente carregada de הָרָעָה הַזֹּאת sem reduzir o termo a calamidade.'
