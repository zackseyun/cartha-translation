source:
  edition: WLC
  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: pt
  text: 'Os filhos de Benjamim ouviram que os filhos de Israel tinham subido a Mispá[a]. E os filhos de Israel disseram: “Contem-nos: como aconteceu este mal[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os benjaminitas” e “os israelitas”. O hebraico repete as expressões “os filhos de Benjamim” e “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: “Este mal” também pode ser traduzido como “esta perversidade” ou “esta injustiça”. O termo hebraico tem forte sentido moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ouviram
  rationale: שׁמע, neste contexto narrativo, indica tomar conhecimento de uma notícia. “Ouviram” é direto e preserva a formulação do hebraico.
- source_word: בְּנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Mantém a construção hebraica e o paralelismo formal com “os filhos de Israel”; a alternativa idiomática é registrada em nota.
- source_word: כִּי עָלוּ
  choice: que ... tinham subido
  rationale: עלה significa normalmente “subir”. O mais-que-perfeito composto expressa com naturalidade que a subida ocorreu antes de os benjaminitas receberem a notícia.
- source_word: הַמִּצְפָּה
  choice: a Mispá
  rationale: Trata-se do topônimo Mispá. A preposição portuguesa “a” transmite o destino indicado pelo hebraico, sem reproduzir mecanicamente o artigo ligado ao nome.
- source_word: וַיֹּאמְרוּ
  choice: disseram
  rationale: Traduz o verbo אמר sem converter explicitamente a fala em pergunta ou pedido.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica e sua correspondência formal com “os filhos de Benjamim”.
- source_word: דַּבְּרוּ
  choice: Contem-nos
  rationale: O imperativo “falem” introduz aqui uma solicitação de relato. “Contem-nos” explicita de modo natural em português o sentido contextual sem ampliar substancialmente o texto.
- source_word: אֵיכָה
  choice: como
  rationale: Equivalente direto do interrogativo que pergunta de que maneira o fato ocorreu.
- source_word: נִהְיְתָה
  choice: aconteceu
  rationale: Nesta construção, היה tem sentido eventivo; “aconteceu” é corrente e preciso em português.
- source_word: הָרָעָה הַזֹּאת
  choice: este mal
  rationale: רָעָה pode indicar mal, perversidade ou desgraça. No contexto, há forte dimensão moral; “mal” preserva essa força sem restringir demais o campo semântico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo tribal do hebraico, enquanto “Contem-nos” oferece naturalidade à ordem no discurso direto. O marcador [b] foi colocado junto de “este mal”, expressão a que a nota se refere.
