  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: pt
  text: Então os homens de Gibeá se levantaram contra mim e cercaram a casa durante a noite. Pretendiam me matar; violentaram minha concubina[a], e ela morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estupraram minha concubina”. O verbo hebraico pode indicar grave humilhação ou violação; neste contexto, refere-se a violência sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: os homens de Gibeá
  rationale: No construto plural, a expressão designa idiomaticamente os habitantes homens ou homens de destaque da cidade, sem necessariamente indicar senhores ou proprietários.
- source_word: וַיָּקֻמוּ עָלַי
  choice: se levantaram contra mim
  rationale: Preserva a imagem do idioma hebraico קום על e comunica oposição hostil em português natural.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: cercaram a casa
  rationale: Expressa de modo claro e idiomático o ato de rodear a casa; a hostilidade já está indicada pela oração anterior.
- source_word: לָיְלָה
  choice: durante a noite
  rationale: Traduz o acusativo temporal com clareza, sem sugerir apenas um instante pontual.
- source_word: אֹתִי דִּמּוּ לַהֲרֹג
  choice: Pretendiam me matar
  rationale: Neste contexto, דמה seguido do infinitivo comunica intenção; a formulação é direta e corrente em português.
- source_word: פִּילַגְשִׁי
  choice: minha concubina
  rationale: É o termo histórico-social consagrado e mais preciso para פילגש, sem substituir a categoria antiga por uma explicação interpretativa.
- source_word: עִנּוּ
  choice: violentaram
  rationale: No piel, ענה pode indicar aflição, humilhação ou violação. O contexto de Juízes 19–20 aponta para violência sexual; 'violentaram' mantém alguma amplitude lexical sem ocultar o abuso.
- source_word: וַתָּמֹת
  choice: e ela morreu
  rationale: Reproduz a progressão narrativa da forma verbal com waw sem acrescentar explicitamente uma relação causal que o hebraico não codifica por si só.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a sequência narrativa e evita tornar explícita uma causalidade entre a agressão e a morte além do que a coordenação hebraica afirma.
