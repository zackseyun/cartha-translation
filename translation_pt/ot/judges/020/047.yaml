base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: pt
  text: Mas seiscentos homens mudaram de direção e fugiram rumo ao deserto[a], para a Rocha de Rimom[b], e permaneceram na Rocha de Rimom durante quatro meses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para dentro do deserto”. A forma direcional hebraica pode indicar movimento rumo ao deserto ou para dentro dessa região.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a rocha de Rimom”; também pode ser traduzido como “o rochedo de Rimom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: mudaram de direção
  rationale: O verbo indica uma mudança de rumo; esta formulação explicita naturalmente o movimento sem acrescentar que voltaram para trás.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: Preserva a urgência e o contexto militar do verbo נוּס.
- source_word: הַמִּדְבָּרָה
  choice: rumo ao deserto
  rationale: A terminação direcional expressa movimento em direção ao deserto, podendo também implicar entrada nele; a nota preserva essa amplitude.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: para a Rocha de Rimom
  rationale: Trata a expressão como designação geográfica natural em português, mantendo Rimom como topônimo.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: seiscentos homens
  rationale: אִישׁ, depois do numeral e neste contexto militar, conta homens adultos.
- source_word: וַיֵּשְׁבוּ
  choice: permaneceram
  rationale: Neste refúgio temporário, comunica a permanência no local sem sugerir residência definitiva.
- source_word: בְּסֶלַע רִמּוֹן
  choice: na Rocha de Rimom
  rationale: A preposição ב indica localização no local rochoso nomeado; 'na' é natural em português e não determina se estavam sobre, junto a ou dentro da formação.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: durante quatro meses
  rationale: Expressa com clareza a duração da permanência.
- source_word: וַ
  choice: Mas
  rationale: Embora o waw dê continuidade à narrativa, o contexto marca contraste entre os sobreviventes e a destruição anteriormente narrada.
