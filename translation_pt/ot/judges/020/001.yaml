  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: pt
  text: Então todos os filhos de Israel[a] saíram, e a comunidade se reuniu, como um só homem[b], desde Dã até Berseba e desde a terra de Gileade, diante de Yahweh, em Mispá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos de Israel” é a forma literal da expressão hebraica para o povo de Israel; aqui ela se refere coletivamente às tribos, não somente a indivíduos do sexo masculino.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como um só homem”, expressão que indica unidade de acordo e ação.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a Yahweh, em Mispá”. A construção hebraica pode indicar que a comunidade se reuniu dirigindo-se a Yahweh ou comparecendo em sua presença em Mispá.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: O verbo יצא significa “sair”. Em português, “saíram” mantém a direção aberta e introduz naturalmente o deslocamento das tribos para a assembleia.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Preserva a forma masculina e corporativa do hebraico. A nota esclarece que a expressão designa o povo de Israel em conjunto, não apenas indivíduos do sexo masculino.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: a comunidade se reuniu
  rationale: עֵדָה denota o corpo comunitário reunido. “Comunidade” é natural e evita atribuir ao termo um sentido exclusivamente cúltico; “se reuniu” traduz com clareza a ação de congregar-se.
- source_word: כְּאִישׁ אֶחָד
  choice: como um só homem
  rationale: Mantém a imagem idiomática hebraica, que expressa unidade de intenção e ação, sem neutralizar sua forma masculina singular.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: desde Dã até Berseba
  rationale: Reproduz o merismo geográfico tradicional que abrange o território israelita de norte a sul.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: e também da terra de Gileade
  rationale: A expressão acrescenta a região transjordânica de Gileade ao alcance geográfico. “Também da” torna essa inclusão clara em português sem alterar o sentido.
- source_word: אֶל יְהוָה
  choice: diante de Yahweh
  rationale: Neste contexto de assembleia, אֶל יְהוָה pode indicar a reunião dirigida a Yahweh ou realizada em sua presença. “Diante de Yahweh” é idiomático em português e preserva a dimensão de comparecimento perante ele; a alternativa mais literal é registrada em nota.
- source_word: הַמִּצְפָּה
  choice: em Mispá
  rationale: O topônimo é transliterado de forma corrente em português, e “em” identifica Mispá como o local da assembleia.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Linguagem masculina corporativa em בְּנֵי יִשְׂרָאֵל e כְּאִישׁ אֶחָד
  choice: filhos de Israel; como um só homem
  alternative: israelitas; como uma só pessoa
  rationale: As formas masculinas do original são preservadas, enquanto as notas esclarecem seu alcance corporativo e idiomático, sem restringi-las indevidamente a homens individuais.
- issue: Relação da assembleia com Yahweh em אֶל יְהוָה
  choice: diante de Yahweh
  alternative: a Yahweh
  rationale: A construção admite tanto a ideia de dirigir-se a Yahweh quanto a de reunir-se em sua presença. A tradução principal exprime a cena de comparecimento perante Yahweh, e a nota conserva a formulação mais literal.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantêm-se as imagens hebraicas “filhos de Israel” e “como um só homem”, acompanhadas de notas explicativas. Os topônimos seguem formas portuguesas correntes: Dã, Berseba, Gileade e Mispá.'
