base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: pt
  text: 'Então os filhos de Israel subiram, choraram diante de Yahweh até a tarde e consultaram Yahweh, dizendo: “Devo voltar a aproximar-me para a batalha contra os filhos de Benjamim, meu irmão?”[a] Yahweh respondeu: “Subam contra ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Devo continuar a aproximar-me para a batalha contra os filhos de Benjamim, meu irmão?” O hebraico pode expressar tanto a continuação quanto a repetição da investida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido direcional de עלה e sua formulação narrativa natural, sem especificar um destino que o versículo não declara.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar e corporativa do hebraico, que também se relaciona com a referência posterior a Benjamim como irmão.
- source_word: וַיִּבְכּוּ
  choice: choraram
  rationale: Expressa de modo natural o pranto de lamento indicado por בכה.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Traduz diretamente לִפְנֵי e conserva o nome divino expresso no texto hebraico.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: consultaram Yahweh
  rationale: No contexto, a construção descreve uma consulta a Deus em busca de orientação, não uma pergunta meramente informativa.
- source_word: הַאוֹסִיף
  choice: Devo voltar a
  rationale: O hifil de יסף pode indicar acrescentar, continuar ou repetir uma ação; depois do combate anterior, 'voltar a' comunica naturalmente a repetição sem eliminar por completo a ideia de prosseguimento.
- source_word: לָגֶשֶׁת לַמִּלְחָמָה
  choice: avançar para a batalha
  rationale: נגשׁ significa aproximar-se; em contexto militar, 'avançar' preserva a noção de aproximação e soa natural em português.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: contra os filhos de Benjamim
  rationale: Embora עִם normalmente signifique 'com', o contexto de combate exige em português a relação adversativa para evitar a impressão de aliança militar.
- source_word: אָחִי
  choice: meu irmão
  rationale: Mantém o singular hebraico e a tensão entre a identidade coletiva de Israel e seu vínculo familiar com Benjamim.
- source_word: עֲלוּ אֵלָיו
  choice: Subam contra ele
  rationale: Preserva o verbo direcional עלה, enquanto 'contra' explicita a força hostil de אֵלָיו neste contexto militar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio do Deus de Israel; 'Yahweh' o representa diretamente, em vez de substituí-lo por um título.
- issue: Número da fala em הַאוֹסִיף e אָחִי
  choice: 'Primeira pessoa do singular: “Devo” e “meu irmão”'
  alternative: 'Primeira pessoa do plural: “Devemos” e “nosso irmão”'
  rationale: As formas hebraicas são singulares e apresentam Israel coletivamente como uma só pessoa; a tradução conserva essa personificação e sua força familiar.
- issue: Relação militar expressa por עִם
  choice: contra
  alternative: com
  rationale: A preposição é formalmente 'com', mas aqui descreve os combatentes enfrentados. 'Contra' transmite a relação contextual sem acrescentar uma conclusão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a linguagem familiar do hebraico e a personificação singular de Israel, evitando uma construção excessivamente literal e ambígua em português no contexto militar.
