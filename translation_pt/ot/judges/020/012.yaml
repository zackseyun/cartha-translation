source:
  edition: WLC
  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: pt
  text: 'Então as tribos de Israel enviaram homens por todas as tribos de Benjamim[a], dizendo: “Que maldade[b] é esta que aconteceu entre vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a todas as tribos de Benjamim”. A preposição hebraica pode ser entendida em sentido distributivo.
    reason: lexical_alternative
  - marker: b
    text: Ou “mal” ou “perversidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: enviaram
  rationale: O verbo שלח indica diretamente o ato de enviar; “enviaram” é natural e preciso em português.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: as tribos de Israel
  rationale: Reproduz diretamente a construção hebraica e mantém o sujeito coletivo no plural.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O hebraico diz literalmente “homens”. Embora atuem como emissários, o texto não os designa explicitamente como mensageiros ou representantes.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: por todas as tribos de Benjamim
  rationale: “Por” comunica a possível força distributiva da preposição בְּ. O plural incomum “tribos de Benjamim” é preservado, em vez de ser harmonizado silenciosamente como “clãs” ou “famílias”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente em português para o infinitivo hebraico que introduz discurso direto.
- source_word: מָה
  choice: Que
  rationale: 'A pergunta procura identificar ou caracterizar o ato: “Que maldade é esta?”, sem convertê-la numa pergunta causal com “por que”.'
- source_word: הָרָעָה הַזֹּאת
  choice: Que maldade é esta
  rationale: רָעָה denota aqui um ato moralmente mau. “Maldade” conserva essa força e produz uma pergunta natural em português.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: que aconteceu
  rationale: O nifal de היה expressa algo que ocorreu ou veio a acontecer; “aconteceu” é idiomático e fiel.
- source_word: בָּכֶם
  choice: entre vocês
  rationale: No contexto, indica que o mal ocorreu no meio da comunidade benjaminita; “entre vocês” transmite essa localização comunitária.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A formulação incomum “tribos de Benjamim” conserva a tensão do texto hebraico; a nota registra a alternativa preposicional sem substituir “tribos” por uma interpretação como “clãs”.
