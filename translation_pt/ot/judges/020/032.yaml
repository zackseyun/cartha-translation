  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: pt
  text: 'Os filhos de Benjamim disseram: “Eles estão sendo derrotados diante de nós, como antes[a]”. Mas os filhos de Israel disseram: “Vamos fugir e afastá-los[b] da cidade, em direção às estradas principais[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como na primeira vez”, em referência aos combates anteriores deste capítulo.
    reason: cross_reference
  - marker: b
    text: O hebraico traz um objeto no singular, “afastá-lo”, provavelmente empregado de modo coletivo para Benjamim ou para sua força de combate.
    reason: lexical_alternative
  - marker: c
    text: Ou “estradas” ou “vias principais”. O termo hebraico pode designar estradas preparadas ou elevadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: estão sendo derrotados
  rationale: O particípio passivo descreve os israelitas como sofrendo derrota no combate. A formulação preserva o aspecto progressivo percebido pelos benjamitas e soa natural em português.
- source_word: לְפָנֵינוּ
  choice: diante de nós
  rationale: Mantém o idioma espacial e militar hebraico, indicando que a derrota ocorre à frente deles e às suas mãos.
- source_word: כְּבָרִאשֹׁנָה
  choice: como antes
  rationale: Expressa de modo claro a comparação com os combates anteriores do capítulo sem acrescentar ao texto a palavra 'batalha'.
- source_word: נָנוּסָה
  choice: Vamos fugir
  rationale: O coortativo de primeira pessoa do plural comunica proposta ou decisão conjunta; 'Vamos fugir' é natural e preserva sua força volitiva.
- source_word: וּנְתַקְּנֻהוּ
  choice: e afastá-los
  rationale: O verbo indica puxar ou fazer afastar-se. O plural contextual refere-se aos benjamitas como força combatente, enquanto a nota registra que o sufixo hebraico é singular.
- source_word: הָעִיר
  choice: a cidade
  rationale: Equivalente direto e natural de עִיר; no contexto, refere-se a Gibeá.
- source_word: הַמְסִלּוֹת
  choice: as estradas principais
  rationale: מְסִלּוֹת designa estradas preparadas ou vias de maior importância. 'Estradas principais' evita o anacronismo potencial de 'rodovias' e é mais específico que apenas 'estradas'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva 'filhos de Benjamim' e 'filhos de Israel' como designações coletivas tradicionais, evita o termo moderno 'rodovias' e registra em nota a discrepância entre o objeto singular hebraico e o referente coletivo plural exigido pelo contexto português.
