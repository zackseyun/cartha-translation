  language: en
  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: pt
  text: Então os filhos de Israel se levantaram pela manhã e acamparam contra Gibeá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֥וּמוּ
  choice: se levantaram
  rationale: O wayyiqtol de קום dá continuidade à sequência narrativa. “Se levantaram” preserva o sentido simples sem especificar, além do hebraico, que partiram naquele momento.
- source_word: בְנֵֽי יִשְׂרָאֵ֖ל
  choice: os filhos de Israel
  rationale: Tradução formalmente transparente da expressão hebraica, preservando o idioma tradicional que designa o povo de Israel; a alternativa mais corrente é indicada em nota.
- source_word: בַּבֹּ֑קֶר
  choice: pela manhã
  rationale: Equivalente temporal natural e corrente em português para a preposição com o substantivo definido.
- source_word: וַיַּֽחֲנ֖וּ
  choice: acamparam
  rationale: O verbo חנה descreve o ato de estabelecer acampamento; “acamparam” é claro e natural em português moderno.
- source_word: עַל
  choice: diante de
  rationale: No contexto militar, a preposição indica posicionamento em face da cidade, com intenção hostil. “Diante de” mantém esse valor contextual sem sugerir que o acampamento estivesse fisicamente sobre a cidade.
- source_word: הַגִּבְעָֽה
  choice: Gibeá
  rationale: Nome próprio do lugar; o artigo hebraico integra a forma do topônimo e não precisa ser traduzido separadamente.
