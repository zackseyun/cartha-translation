  yaml_path: translation/ot/judges/020/008.yaml
  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: pt
  text: 'Então todo o povo se levantou como um só homem e disse: “Ninguém irá para a sua tenda, nem se desviará para a sua casa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Reproduz de modo natural o valor narrativo de קום, indicando que o povo se pôs de pé para agir.
- source_word: כְּאִישׁ אֶחָד
  choice: como um só homem
  rationale: Preserva a imagem hebraica de ação coletiva unânime, além de ser compreensível em português.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: Nenhum de nós irá para a sua tenda
  rationale: Expressa naturalmente a negação distributiva אִישׁ, mantendo o sentido de que ninguém dispersaria para sua tenda.
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: e nenhum de nós voltará para a sua casa
  rationale: Neste contexto, סור descreve afastar-se da assembleia rumo a casa; “voltará” comunica esse movimento de modo corrente sem alterar a decisão coletiva.
