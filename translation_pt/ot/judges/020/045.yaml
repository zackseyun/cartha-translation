base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: pt
  text: Então eles se viraram e fugiram em direção ao deserto, para a rocha de Rimom. Nas estradas, os perseguidores abateram cinco mil homens dentre eles[a]; depois os perseguiram até Gidom e abateram dois mil homens dentre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico significa literalmente “respigar” e, aqui, retrata os perseguidores eliminando os fugitivos que restavam.
    reason: lexical_alternative
  - marker: b
    text: Em alguns pontos, o hebraico emprega pronomes no singular — literalmente, “atrás dele” e “dentre ele” — para se referir coletivamente aos benjaminitas em fuga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיָּנֻסוּ הַמִּדְבָּרָה
  choice: eles se viraram e fugiram em direção ao deserto
  rationale: Mantém a sequência narrativa e a nuance direcional do he locale em הַמִּדְבָּרָה, sem especificar indevidamente que voltaram pelo mesmo caminho.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: para a rocha de Rimom
  rationale: Traduz סֶלַע como substantivo comum e translitera o topônimo רִמּוֹן na forma portuguesa corrente.
- source_word: וַיְעֹלְלֻהוּ
  choice: os perseguidores abateram ... dentre eles
  rationale: O verbo evoca literalmente a respiga, mas no contexto militar descreve eliminar ou apanhar os fugitivos restantes. 'Abateram' comunica o resultado violento; o sujeito explícito 'os perseguidores' evita que o português atribua a ação aos benjaminitas em fuga.
- source_word: בַּמְסִלּוֹת
  choice: nas estradas
  rationale: מְסִלּוֹת designa vias ou estradas, possivelmente elevadas. 'Estradas' é natural e não sugere as modernas autoestradas.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: cinco mil homens
  rationale: Reproduz o número e o referente masculino do contexto militar sem interpretar אִישׁ como 'soldados'.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: depois os perseguiram
  rationale: O hifil de דבק expressa perseguição cerrada ou alcance. 'Perseguiram' é idiomático e não acrescenta uma intensidade que o texto não explicita de modo inequívoco; o plural português representa o referente coletivo.
- source_word: עַד גִּדְעֹם
  choice: até Gidom
  rationale: עַד marca o limite geográfico da perseguição; o nome de lugar é transliterado.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: abateram mais dois mil homens dentre eles
  rationale: נכה em narrativa de batalha é adequadamente vertido por 'abater'. 'Dentre eles' preserva o valor partitivo de מִמֶּנּוּ; 'mais' torna clara em português a adição contextual aos cinco mil anteriores.
