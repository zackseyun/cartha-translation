translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada e 'os perseguidores' foi explicitado para impedir ambiguidade sintática sobre quem realizou os ataques. Os marcadores [a] e [b] aparecem no texto principal.
