base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: pt
  text: 'Então os homens de Israel se voltaram na batalha, e Benjamim começou a matar cerca de trinta homens de Israel[a], pois disseram: “Sem dúvida, Israel foi completamente derrotado diante de nós[b], como na primeira batalha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começou a causar baixas entre os homens de Israel, cerca de trinta homens”. A expressão hebraica com “mortos” é concisa e idiomática no contexto de batalha.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente “ele foi completamente derrotado”, tratando Israel coletivamente no singular; também se pode entender: “eles foram completamente derrotados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: se voltaram
  rationale: O verbo descreve a mudança de direção ou reação dos combatentes israelitas no curso da batalha. A forma singular hebraica tem sentido coletivo; o plural é natural em português.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: A expressão singular funciona coletivamente e, no contexto militar, designa os combatentes de Israel.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: Preserva a referência definida ao combate em andamento e mantém uma formulação narrativa natural.
- source_word: וּבִנְיָמִן
  choice: e Benjamim
  rationale: O nome da tribo representa metonimicamente seus guerreiros, como no hebraico.
- source_word: הֵחֵל לְהַכּוֹת
  choice: começou a abater
  rationale: Expressa o aspecto ingressivo de הֵחֵל e o sentido letal de נכה neste contexto de combate.
- source_word: חֲלָלִים בְּאִישׁ יִשְׂרָאֵל
  choice: homens de Israel — cerca de trinta mortos
  rationale: 'A construção hebraica é concisa e idiomática: חֲלָלִים indica os mortos ou abatidos causados entre os israelitas. A formulação portuguesa evita a expressão incoerente ''abater os mortos'', sem introduzir um grupo indefinido inexistente no texto.'
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: cerca de trinta
  rationale: O prefixo כ marca aproximação numérica.
- source_word: כִּי אָמְרוּ
  choice: pois disseram
  rationale: Introduz a razão ou percepção que sustentava a confiança dos benjaminitas.
- source_word: אַךְ נִגּוֹף נִגָּף הוּא
  choice: Sem dúvida, Israel foi completamente derrotado
  rationale: אַךְ e a combinação do infinitivo absoluto com a forma verbal intensificam a afirmação. Nomear Israel torna inteligível em português o pronome singular coletivo do hebraico, sem mudar seu referente provável.
- source_word: לְפָנֵינוּ
  choice: diante de nós
  rationale: Equivalência direta e natural da locução hebraica no contexto de confronto militar.
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: como na primeira batalha
  rationale: Reproduz claramente a comparação com o confronto anterior.
