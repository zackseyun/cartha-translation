revisions:
- from: Então todos os filhos de Israel, todo o povo, subiram e foram a Betel. Ali choraram e ficaram sentados diante de Yahweh. Naquele dia, jejuaram até a tarde e ofereceram holocaustos e ofertas de comunhão[a] diante de Yahweh.
  to: Então todos os filhos de Israel e todo o povo subiram e foram a Betel. Ali choraram e sentaram-se diante de Yahweh; naquele dia, jejuaram até a tarde. Então ofereceram holocaustos e ofertas de comunhão[a] diante de Yahweh.
  rationale: A revisão restaura a coordenação expressa no hebraico, conserva a sucessão das ações e torna explícito que os sacrifícios são oferecidos depois do jejum. Mantêm-se as escolhas terminológicas centrais do rascunho, com uma alternativa lexical mais usual em português para שְׁלָמִים.
