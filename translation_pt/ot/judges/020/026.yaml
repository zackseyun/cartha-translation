  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: pt
  text: Então todos os filhos de Israel e todo o povo subiram e foram a Betel. Ali choraram e sentaram-se diante de Yahweh; naquele dia, jejuaram até a tarde. Então ofereceram holocaustos e ofertas de comunhão[a] diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrifícios de paz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva a ideia direcional de עלה no contexto de deslocamento, com expressão natural em português.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: todos os filhos de Israel, todo o povo
  rationale: Mantém a expressão familiar-nacional masculina do hebraico e conserva a segunda expressão como retomada enfática ou aposicional, sem acrescentar uma conjunção ausente entre ambas.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: וַיִּבְכּוּ
  choice: choraram
  rationale: Expressa de modo claro e digno o lamento do povo após a derrota.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: ali ... ficaram sentados diante de Yahweh
  rationale: Preserva o sentido concreto de ישב como postura física, embora o verbo também possa significar permanecer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיָּצוּמוּ
  choice: jejuaram
  rationale: Equivalente direto e corrente para a abstinência de alimento como ato de lamento e devoção.
- source_word: בַּיּוֹם הַהוּא עַד הָעָרֶב
  choice: Naquele dia, ... até a tarde
  rationale: Reproduz os limites temporais do hebraico em português natural.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: ofereceram holocaustos
  rationale: No contexto sacrificial, o hifil de עלה significa oferecer; 'holocaustos' é o termo bíblico português estabelecido para ofertas totalmente queimadas.
- source_word: שְׁלָמִים
  choice: ofertas de comunhão
  rationale: Comunica a dimensão relacional e compartilhada dos sacrifícios שלמים; a alternativa tradicional 'ofertas pacíficas' é registrada em nota.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o tetragrama; 'Yahweh' preserva o nome pessoal sem substituí-lo por um título.
- issue: Designação nacional בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A forma escolhida conserva a imagem familiar e a forma masculina representativa do original, enquanto 'israelitas' seria mais idiomático, porém menos formal.
- issue: Sentido sacrificial de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas
  rationale: A escolha destaca a comunhão associada ao sacrifício sem eliminar a alternativa tradicional, apresentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A sequência de ações foi levemente segmentada em frases para facilitar a leitura, sem alterar sua ordem. A aposição 'todos os filhos de Israel, todo o povo' preserva a possível força enfática do hebraico.
