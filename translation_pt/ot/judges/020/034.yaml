  text: וַ/יָּבֹאוּ֩ מִ/נֶּ֨גֶד לַ/גִּבְעָ֜ה עֲשֶׂרֶת֩ אֲלָפִ֨ים אִ֤ישׁ בָּחוּר֙ מִ/כָּל יִשְׂרָאֵ֔ל וְ/הַ/מִּלְחָמָ֖ה כָּבֵ֑דָה וְ/הֵם֙ לֹ֣א יָדְע֔וּ כִּֽי נֹגַ֥עַת עֲלֵי/הֶ֖ם הָ/רָעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: pt
  text: Então dez mil homens escolhidos de todo o Israel vieram contra Gibeá, e a batalha foi intensa; mas os benjaminitas não sabiam que a desgraça se aproximava deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que a calamidade os alcançava”. Em termos literais, o hebraico diz que “a desgraça os tocava/atingia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: contra Gibeá
  rationale: Embora a expressão denote literalmente uma posição diante de ou em frente a Gibeá, o contexto militar lhe confere sentido adversativo. “Contra Gibeá” é natural em português e preserva esse valor contextual.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: dez mil homens escolhidos
  rationale: בָּחוּר designa aqui combatentes selecionados, e não apenas homens jovens. A formulação conserva tanto o número quanto a qualidade militar do grupo.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: de todo o Israel
  rationale: Indica que os combatentes foram recrutados dentre o conjunto de Israel.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: e a batalha foi intensa
  rationale: כָּבֵדָה exprime a severidade e a dureza do combate. “Intensa” comunica esse sentido de modo claro e atual.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: mas os benjaminitas não sabiam
  rationale: A conjunção admite valor contrastivo. O referente contextual do pronome é explicitado como “os benjaminitas” para evitar que, em português, “eles” seja entendido como os dez mil israelitas mencionados imediatamente antes.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: que a desgraça se aproximava deles
  rationale: הָרָעָה significa aqui calamidade ou desgraça, não mal moral. נֹגַעַת tem o sentido básico de tocar ou alcançar e, neste contexto, descreve a ruína que se aproxima dos benjaminitas.
