    rationale: O hebraico repete עַד antes de “todo o que foi encontrado”. A revisão preserva esse efeito por meio de “e, até mesmo, tudo o que encontraram”, sem alegar certeza sobre o termo obscuro מְתֹם.
  - severity: low
