base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: pt
  text: 'Os homens de Israel voltaram-se contra os benjaminitas e os passaram ao fio da espada: em cada cidade, desde os habitantes até os animais e, até mesmo, tudo o que encontraram.[a] Também incendiaram todas as cidades que encontraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase hebraica traduzida como “em cada cidade, desde os habitantes” é difícil, especialmente a palavra após “cidade”. Pode indicar destruição completa da cidade, incluindo pessoas, animais e tudo o que nela se encontrava.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Os homens de Israel
  rationale: Embora אִישׁ esteja no singular, o verbo plural mostra que a expressão tem sentido coletivo. O contexto militar favorece “os homens de Israel” em vez do mais genérico “o povo de Israel”.
- source_word: שָׁבוּ אֶל
  choice: voltaram-se contra
  rationale: שׁוב indica aqui uma mudança de direção, e o contexto hostil dá a אֶל o sentido contextual de movimento contra os benjaminitas.
- source_word: בְּנֵי בִנְיָמִן
  choice: os benjaminitas
  rationale: Equivale naturalmente em português ao hebraico literal “os filhos de Benjamim” e identifica com clareza os membros da tribo.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: os passaram ao fio da espada
  rationale: A expressão portuguesa comunica que foram mortos pela espada e preserva a imagem concreta do idioma hebraico, literalmente relacionado à “boca” da espada.
- source_word: מֵעִיר מְתֹם עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: em cada cidade, desde os habitantes até os animais, tudo o que encontraram
  rationale: A construção hebraica é difícil, mas o contexto aponta para a destruição completa do que havia nas cidades, abrangendo seres humanos, animais e tudo o mais encontrado. “Habitantes” explicita o referente humano sugerido pelo contexto sem ocultar a dificuldade, registrada em nota.
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: Também ... todas as cidades que encontraram
  rationale: O particípio de מצא descreve naturalmente as cidades localizadas ou alcançadas pelos israelitas durante a ação.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: incendiaram
  rationale: É uma forma portuguesa direta e atual de expressar o idioma hebraico “enviaram ao fogo” ou “puseram fogo”.
theological_decisions: []
