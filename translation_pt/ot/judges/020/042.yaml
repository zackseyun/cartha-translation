  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: pt
  text: Então eles deram meia-volta diante dos homens de Israel, rumo à estrada do deserto[a], mas a batalha os alcançou[b]; e os que vinham das cidades os destruíam no meio deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “diante dos homens de Israel”. A expressão também pode ser entendida idiomaticamente como “para longe dos homens de Israel”, isto é, retirando-se deles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mas o combate os alcançou”.'
    reason: lexical_alternative
  - marker: c
    text: A última oração é concisa e difícil no hebraico. Provavelmente se refere a forças israelitas que saíam das cidades ou de posições de emboscada e destruíam os benjaminitas por dentro de suas fileiras.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: deram meia-volta
  rationale: O verbo פנה significa fundamentalmente “virar-se” ou “voltar-se”. No contexto da batalha, a ação implica retirada, mas “deram meia-volta” conserva a imagem verbal sem explicitar demais com “fugiram”.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: diante dos homens de Israel
  rationale: A expressão significa literalmente “diante do homem/dos homens de Israel” e, neste contexto, pode indicar que os benjaminitas se retiravam da presença deles. “Homens de Israel” preserva a referência ao contingente militar.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: rumo à estrada do deserto
  rationale: דֶּרֶךְ pode significar “caminho” ou “estrada”. A formulação escolhida é natural em português e mantém a relação construta do hebraico sem decidir se a estrada atravessava o deserto ou levava até ele.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: mas a batalha os alcançou
  rationale: A construção personifica a batalha como aquilo que alcança o contingente em retirada. O pronome hebraico singular trata o grupo coletivamente; o plural é mais claro em português.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: e os que vinham das cidades
  rationale: A construção relativa hebraica é elíptica. A tradução mantém essa concisão e indica procedência sem inserir no texto principal uma identificação que o hebraico não declara expressamente.
- source_word: מַשְׁחִיתִים
  choice: destruíam
  rationale: O particípio de שׁחת expressa destruição contínua e, neste contexto militar, inclui matar. “Destruíam” permanece próximo do valor lexical e conserva a força da expressão.
- source_word: אוֹתוֹ
  choice: os
  rationale: O objeto está no singular em hebraico, provavelmente porque se refere coletivamente a Benjamim ou ao seu exército. O plural evita em português uma referência individual enganosa.
- source_word: בְּתוֹכוֹ
  choice: em seu próprio meio
  rationale: O sufixo singular também retoma coletivamente o contingente benjaminita. A expressão comunica que a destruição ocorria no interior do grupo, sem especificar além do que permite a frase hebraica comprimida.
