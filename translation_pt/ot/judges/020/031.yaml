  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: pt
  text: Os filhos de Benjamim[a] saíram ao encontro do povo e foram afastados da cidade[b]. Então começaram a matar cerca de trinta homens de Israel, como das outras vezes[c], nas estradas — uma das quais sobe para Betel, e a outra, para Gibeá, em campo aberto[d] —.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os benjaminitas”. O hebraico diz literalmente “os filhos de Benjamim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram separados da cidade” ou “foram atraídos para longe da cidade”. O sentido é que ficaram afastados da proteção da cidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “como antes”. A expressão hebraica compara este ataque aos combates anteriores.
    reason: lexical_alternative
  - marker: d
    text: Ou “no campo”. A expressão provavelmente descreve a rota que passava por terreno aberto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: Verbo narrativo comum de movimento para fora da cidade; “saíram” é natural em português e não impõe um ponto de vista espacial estranho ao relato.
- source_word: בְנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Conserva a expressão hebraica de parentesco e identidade tribal; a nota oferece o gentílico mais idiomático.
- source_word: לִקְרַאת הָעָם
  choice: ao encontro do povo
  rationale: Mantém o equivalente direto de עָם, embora no contexto se trate da força israelita adversária.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: foram afastados da cidade
  rationale: Expressa a separação tática da cidade sem especificar de modo indevido se foram atraídos deliberadamente ou apenas separados; as alternativas constam da nota.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת
  choice: começaram a matar
  rationale: O verbo ingressivo indica o início da ação; נכה, combinado com חֲלָלִים, descreve aqui golpes que resultaram em mortes, e “matar” evita uma construção portuguesa artificial.
- source_word: מֵהָעָם חֲלָלִים
  choice: alguns do povo
  rationale: A preposição מן tem valor partitivo, e חֲלָלִים indica que as pessoas atingidas foram mortas; esse resultado já está expresso em “matar”.
- source_word: כְּפַעַם בְּפַעַם
  choice: como das outras vezes
  rationale: Reproduz idiomaticamente a comparação com os confrontos anteriores narrados no capítulo.
- source_word: בַּמְסִלּוֹת
  choice: nas estradas
  rationale: מסלה designa uma via ou estrada, possivelmente elevada ou principal; “estradas” é claro e adequado ao cenário geográfico.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: uma das quais sobe para Betel
  rationale: Preserva o uso topográfico de עלה e deixa claro que se descreve uma das duas estradas.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: e a outra, para Gibeá, em campo aberto
  rationale: Entende בַשָּׂדֶה como descrição topográfica da rota fora da área urbana, sem esconder a alternativa mais literal “no campo”.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: cerca de trinta homens de Israel
  rationale: Mantém a aproximação numérica e identifica os mortos como pertencentes a Israel.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem narrativa hebraica foi preservada, mas a pontuação com travessões esclarece que as duas orações descrevem as estradas. Evitou-se “ferir mortalmente” por soar técnico e menos natural; “matar” comunica em conjunto לְהַכּוֹת e חֲלָלִים.
