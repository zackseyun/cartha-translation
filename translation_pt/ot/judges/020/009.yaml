  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação deliberadamente concisa após os dois-pontos conserva a elipse e a ambiguidade do hebraico, sem acrescentar um verbo como “subiremos” ou explicitar “atacaremos” no texto principal.
