  yaml_path: translation/ot/judges/020/009.yaml
  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: pt
  text: 'Mas agora, isto é o que faremos a Gibeá: contra ela, por sorteio[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agiremos contra ela lançando sortes”. O hebraico é conciso e pode indicar que a ação do exército contra Gibeá será organizada ou distribuída por sorteio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Marca a transição para a medida seguinte, preservando tanto o valor temporal como a leve força adversativa possível no contexto.
- source_word: זֶה הַדָּבָר אֲשֶׁר
  choice: é isto que
  rationale: Expressão idiomática e natural em português para introduzir o plano específico, sem reproduzir de forma rígida a construção hebraica.
- source_word: נַעֲשֶׂה
  choice: faremos
  rationale: O imperfeito qal na primeira pessoa do plural exprime aqui uma ação futura pretendida no contexto de deliberação.
- source_word: לַגִּבְעָה
  choice: a Gibeá
  rationale: Mantém a preposição como indicação do alvo da ação; a hostilidade fica mais explícita na expressão seguinte.
- source_word: עָלֶיהָ
  choice: contra ela
  rationale: No contexto militar, עַל pode indicar ação hostil contra a cidade; o pronome feminino concorda naturalmente com a referência implícita à cidade de Gibeá.
- source_word: בְּגוֹרָל
  choice: por sorteio
  rationale: Indica que a ação ou sua distribuição será determinada mediante sorteio, preservando a concisão do hebraico.
