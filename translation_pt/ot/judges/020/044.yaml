base_translation:
  language: en
  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: pt
  text: E caíram de Benjamim dezoito mil homens; todos eles eram guerreiros valentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “homens de valor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: caíram
  rationale: Mantém o sentido literal e a expressão militar hebraica, na qual “cair” indica morrer em combate, sem explicitar além do necessário.
- source_word: מִבִּנְיָמִן
  choice: de Benjamim
  rationale: 'A preposição מִן indica aqui origem ou pertencimento: os que caíram eram da tribo de Benjamim.'
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: dezoito mil homens
  rationale: Representa expressamente אִישׁ e evita substituir “homens” pelo mais interpretativo “soldados”.
- source_word: אֶת כָּל אֵלֶּה
  choice: todos eles
  rationale: Retoma de modo natural em português o grupo mencionado e preserva a função resumitiva da construção hebraica.
- source_word: אַנְשֵׁי חָיִל
  choice: guerreiros valentes
  rationale: No contexto militar, a expressão designa homens capazes e valorosos na guerra; esta formulação comunica tanto a função militar quanto a valentia em linguagem atual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “E caíram” conserva o encadeamento narrativo e o tom do hebraico; o ponto e vírgula apresenta a frase final como caracterização resumitiva dos que morreram.
