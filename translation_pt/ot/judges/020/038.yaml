  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: pt
  text: O sinal combinado entre os homens de Israel e os que estavam de emboscada era fazer subir da cidade uma grande coluna de fumaça[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o acordo estabelecido” ou “o sinal acertado”. O termo hebraico geralmente significa um tempo marcado, mas aqui se refere a um sinal previamente combinado para a batalha.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para os homens de Israel com a emboscada”; o sentido é de um acordo entre as duas partes.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma grande massa de fumaça”. A expressão hebraica descreve uma elevação bem visível de fumaça, usada como sinal a partir da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: O sinal combinado
  rationale: Embora מוֹעֵד geralmente designe um tempo ou encontro marcado, neste contexto militar indica o sinal previamente acertado. “Sinal combinado” expressa tanto sua função quanto o acordo prévio.
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: entre os homens de Israel e os que estavam de emboscada
  rationale: A construção identifica as duas partes do acordo. אִישׁ é mantido como “homens” no contexto militar, e אֹרֵב é entendido coletivamente como o grupo posto em emboscada.
- source_word: הֶרֶב
  choice: grande
  rationale: A forma intensiva de רבה reforça a elevação da fumaça; em português, “grande” comunica naturalmente que a coluna deveria ser conspícua.
- source_word: לְהַעֲלוֹתָם
  choice: era fazer subir
  rationale: O Hifil de עלה significa causar que algo suba. A construção portuguesa preserva o valor causativo sem tornar ambíguo o referente do sufixo verbal.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: uma grande coluna de fumaça
  rationale: מַשְׂאַת descreve algo elevado ou uma massa que sobe; “coluna de fumaça” representa com clareza o sinal visível, enquanto “grande” traduz a intensificação de הֶרֶב.
- source_word: מִן הָעִיר
  choice: da cidade
  rationale: Tradução espacial direta e idiomática da origem da fumaça.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sinal combinado” evita o sentido predominantemente temporal de “marcado”; “os que estavam de emboscada” é mais transparente do que tratar “emboscada” como agente. A ordem da frase foi ajustada à naturalidade do português, e todas as notas têm marcadores correspondentes no texto.
