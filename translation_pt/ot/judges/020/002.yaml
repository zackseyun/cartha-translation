base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: pt
  text: 'E os chefes de todo o povo[a], de todas as tribos de Israel, tomaram posição na assembleia do povo de Deus: quatrocentos mil homens a pé, que sacavam a espada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “os cantos de todo o povo”, expressão que se refere aos chefes ou líderes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: tomaram posição
  rationale: O hitpael de יצב indica colocar-se ou manter-se em posição, com possível nuance militar neste contexto. A expressão é natural em português e preserva mais força que simplesmente “ficaram de pé”.
- source_word: פִּנּוֹת
  choice: chefes
  rationale: Literalmente “cantos”, mas aqui a metáfora designa os homens proeminentes ou dirigentes que sustentam e representam o povo. “Chefes” preserva o sentido sem reproduzir uma imagem opaca.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Tradução direta da expressão coletiva, mantendo a abrangência da reunião.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: de todas as tribos de Israel
  rationale: Mantém a explicação em aposição de quem constitui “todo o povo”, com formulação natural em português.
- source_word: בִּקְהַל
  choice: na assembleia
  rationale: קהל designa uma reunião convocada ou o grupo reunido. “Assembleia” é atual e evita uma conotação eclesiástica desnecessária.
- source_word: עַם הָאֱלֹהִים
  choice: o povo de Deus
  rationale: Reproduz de modo transparente a construção hebraica e conserva a identificação teológica solene de Israel.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: quatrocentos mil
  rationale: Tradução direta do numeral hebraico.
- source_word: אִישׁ רַגְלִי
  choice: soldados de infantaria
  rationale: A expressão significa literalmente homens que combatiam a pé. “Soldados de infantaria” comunica com clareza a função militar e a distingue de tropas montadas.
- source_word: שֹׁלֵף חָרֶב
  choice: que desembainhavam a espada
  rationale: Preserva a imagem verbal de sacar ou tirar a espada da bainha. O particípio singular após o número tem valor coletivo ou distributivo; o plural português concorda naturalmente com os soldados sem acrescentar “cada um”.
theological_decisions:
- issue: Tradução de עַם הָאֱלֹהִים
  choice: o povo de Deus
  alternative: o povo pertencente a Deus
  rationale: A forma escolhida preserva a construção de relação do hebraico e sua dignidade, sem explicitar além do texto a natureza dessa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação por dois-pontos apresenta o efetivo reunido sem impor uma relação sintática mais específica do que o hebraico. A nota preserva a metáfora literal incomum de פִּנּוֹת.
