base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: pt
  text: Assim, todos os que caíram de Benjamim naquele dia foram vinte e cinco mil homens que empunhavam a espada; todos eles eram homens valentes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens de valor”.
    reason: Alternativa lexical para אַנְשֵׁי חָיִל, que pode destacar valentia, capacidade ou valor militar.
lexical_decisions:
- source_word: וַיְהִי
  choice: Assim, ... foram
  rationale: A forma narrativa introduz um resumo do resultado da batalha; “Assim” expressa com naturalidade a continuidade e a consequência.
- source_word: כָל הַנֹּפְלִים
  choice: todos os que caíram
  rationale: O particípio substantivado refere-se aos mortos em combate e conserva o sentido verbal de נפל.
- source_word: מִבִּנְיָמִן
  choice: de Benjamim
  rationale: Representa a pertença tribal indicada por מן sem acrescentar uma designação ausente do texto.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: vinte e cinco mil homens
  rationale: Tradução direta da expressão numérica, sem inserir aqui uma qualificação militar adicional.
- source_word: שֹׁלֵף חֶרֶב
  choice: que desembainhavam a espada
  rationale: Preserva a imagem hebraica e comunica a expressão militar que caracteriza homens aptos para o combate.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Reproduz de modo natural a referência temporal definida.
- source_word: אֶת כָּל אֵלֶּה
  choice: todos eles
  rationale: Retoma enfaticamente a totalidade dos homens que acabaram de ser contados.
- source_word: אַנְשֵׁי חָיִל
  choice: homens valentes
  rationale: No contexto militar, חַיִל descreve homens valorosos e capazes; “homens valentes” é claro, digno e corrente em português.
