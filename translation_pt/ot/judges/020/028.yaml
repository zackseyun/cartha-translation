  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: pt
  text: 'E Fineias, filho de Eleazar, filho de Arão, estava diante da arca[a] naqueles dias e perguntou: “Devo sair mais uma vez para a batalha contra os filhos de Benjamim, meu irmão[b], ou devo parar?” E Yahweh respondeu: “Subam, pois amanhã eu o entregarei em sua mão[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dele”, se o pronome for entendido como referência a Yahweh, e não à arca mencionada no versículo anterior.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “os filhos de Benjamim, meu irmão”; a linguagem de parentesco ressalta que se trata de uma guerra entre israelitas.'
    reason: cultural_note
  - marker: c
    text: Literalmente, “eu o entregarei na sua mão”. O objeto está no singular e trata Benjamim coletivamente; embora “Subam” esteja no plural, o singular de “sua mão” dirige-se ao povo como uma unidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: E Fineias
  rationale: O waw dá continuidade à narrativa; “Fineias” é a forma portuguesa tradicional e reconhecível do nome.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: filho de Eleazar, filho de Arão
  rationale: Mantém as duas gerações e a ênfase hebraica na linhagem sacerdotal.
- source_word: עֹמֵד לְפָנָיו
  choice: estava diante dela
  rationale: O particípio indica uma situação em curso. Pelo contexto imediato, o pronome pode retomar a arca mencionada no versículo anterior; a outra leitura possível é registrada em nota.
- source_word: בַּיָּמִים הָהֵם
  choice: naqueles dias
  rationale: Equivalência direta e natural da expressão temporal hebraica.
- source_word: לֵאמֹר
  choice: Ele perguntou
  rationale: Em português corrente, explicita naturalmente a introdução da pergunta direta sem alterar sua função.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: Devo sair mais uma vez para a batalha
  rationale: A combinação de יסף e עוד exprime repetição; a formulação preserva a imagem militar e soa natural em português.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: contra os filhos de Benjamim, meu irmão
  rationale: No contexto de combate, עִם indica confronto. A linguagem singular de parentesco é mantida para preservar a tensão da guerra civil.
- source_word: אִם אֶחְדָּל
  choice: ou devo parar?
  rationale: חדל significa cessar ou parar; esta é uma formulação simples e atual.
- source_word: וַיֹּאמֶר יְהוָה
  choice: E Yahweh respondeu
  rationale: “Respondeu” é adequado ao diálogo, e o nome divino é transliterado como Yahweh.
- source_word: עֲלוּ
  choice: Subam
  rationale: O imperativo está no plural e pode denotar tanto subir quanto avançar militarmente; “Subam” preserva a forma e a possível nuance geográfica.
- source_word: אֶתְּנֶנּוּ בְיָדֶךָ
  choice: eu o entregarei nas mãos de vocês
  rationale: O objeto singular trata Benjamim coletivamente. O hebraico passa do imperativo plural ao sufixo singular dirigido ao povo como unidade; o português plural torna claro o destinatário coletivo, enquanto a nota preserva a forma idiomática.
theological_decisions:
- issue: Referente do sufixo em לְפָנָיו
  choice: 'A arca da aliança mencionada no versículo anterior: “diante dela”.'
  alternative: 'Yahweh: “diante dele”.'
  rationale: A arca é o antecedente contextual imediato e constitui um referente espacial apropriado. Como o pronome também pode ser entendido em relação a Yahweh, a alternativa é mantida em nota, sem eliminar a ambiguidade.
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração representa o nome divino pessoal presente no texto hebraico sem substituí-lo por um título.
- issue: Singular coletivo em אֶתְּנֶנּוּ
  choice: “o entregarei”, referindo-se coletivamente a Benjamim.
  alternative: “os entregarei”, explicitando os benjamitas.
  rationale: A manutenção do singular conserva a personificação coletiva da tribo no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi moderadamente naturalizada no discurso direto, preservando a linhagem sacerdotal, a linguagem de parentesco, o nome divino e os singulares coletivos do hebraico.
