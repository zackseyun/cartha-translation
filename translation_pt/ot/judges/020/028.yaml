  to: 'E Fineias, filho de Eleazar, filho de Arão, estava diante da arca[a] naqueles dias e perguntou: “Devo sair mais uma vez para a batalha contra os filhos de Benjamim, meu irmão[b], ou devo parar?” E Yahweh respondeu: “Subam, pois amanhã eu o entregarei em sua mão[c].”'
