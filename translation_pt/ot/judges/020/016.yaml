base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: pt
  text: Dentre todo esse povo, havia setecentos homens escolhidos que eram canhotos[a]; cada um deles conseguia atirar uma pedra com uma funda a um fio de cabelo sem errar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “eram limitados” ou “impedidos da mão direita”, expressão que provavelmente indica que combatiam com a mão esquerda.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: Dentre todo esse povo
  rationale: Preserva o valor partitivo da preposição e traduz עָם sem especificá-lo além do necessário como “tropas” ou “exército”.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: setecentos homens
  rationale: אִישׁ funciona aqui como substantivo de contagem para homens adultos; o contexto militar já indica que eram combatentes.
- source_word: בָּחוּר
  choice: escolhidos
  rationale: Expressa o sentido de homens selecionados ou de escolha, de maneira direta e natural.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: eram canhotos
  rationale: Traduz naturalmente o sentido contextual do idiomatismo hebraico, enquanto a nota preserva sua formulação mais literal e a possível nuance de limitação da mão direita.
- source_word: כָּל זֶה
  choice: cada um deles
  rationale: Reproduz o valor distributivo da expressão, destacando a habilidade individual de todos os setecentos.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: conseguia lançar uma pedra com a funda
  rationale: O particípio descreve uma capacidade habitual; a formulação explicita de modo natural em português o uso da funda.
- source_word: אֶל הַשַּׂעֲרָה
  choice: contra um fio de cabelo
  rationale: Mantém a imagem concreta do alvo extremamente pequeno sem substituí-la por uma expressão abstrata sobre precisão.
- source_word: וְלֹא יַחֲטִא
  choice: sem errar
  rationale: Neste contexto, חטא significa não atingir ou errar o alvo, e não cometer pecado.
