base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: pt
  text: Então todos os homens de Israel se levantaram do lugar onde estavam e se puseram em formação de batalha em Baal-Tamar, enquanto a força de emboscada de Israel irrompeu de seu lugar, de Maare-Geba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica Maare-Geba pode ser entendida como nome de lugar, conforme transliterada aqui. Também pode ser lida de modo descritivo como “o lugar aberto de Geba” ou “a campina de Geba”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: A construção com כֹל tem sentido coletivo/distributivo; no contexto militar, “todos os homens” é natural e preserva a referência masculina do hebraico.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: se levantaram do lugar onde estavam
  rationale: O verbo plural concorda com o sujeito coletivo, enquanto o sufixo singular em “lugar” tem valor distributivo. A formulação portuguesa comunica isso com naturalidade.
- source_word: וַיַּעַרְכוּ
  choice: se puseram em formação de batalha
  rationale: ערך, neste contexto militar, descreve a disposição ordenada das tropas para o combate.
- source_word: בְּבַעַל תָּמָר
  choice: em Baal-Tamar
  rationale: Trata-se de um topônimo; a transliteração preserva o nome próprio, e “em” expressa adequadamente o valor locativo.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: a tropa de emboscada de Israel
  rationale: A expressão hebraica compacta designa o contingente israelita posto de emboscada. “Tropa de emboscada de Israel” evita sugerir uma emboscada dirigida contra Israel.
- source_word: מֵגִיחַ
  choice: saiu impetuosamente
  rationale: O particípio transmite a saída súbita do contingente oculto; a escolha conserva o ímpeto narrativo sem exagerar o sentido.
- source_word: מִמַּעֲרֵה גָבַע
  choice: de Maare-Geba
  rationale: A expressão é incerta e pode conservar um topônimo. A transliteração no texto principal mantém essa possibilidade sem decidir indevidamente entre as interpretações lexicais.
