  text: וַ/יַּעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/יַּעַרְכ֥וּ אֶל הַ/גִּבְעָ֖ה כְּ/פַ֥עַם בְּ/פָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: pt
  text: No terceiro dia, os filhos de Israel subiram contra os filhos de Benjamim[a] e se dispuseram em ordem de batalha contra Gibeá, como das outras vezes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas [...] os benjaminitas”. O hebraico diz mais literalmente “os filhos de Israel” e “os filhos de Benjamim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido usual de עלה, que neste contexto também descreve o avanço militar, sem explicitar mais do que o hebraico.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão de parentesco e o paralelismo deliberado com “os filhos de Benjamim”; a alternativa gentílica é registrada em nota.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: contra os filhos de Benjamim
  rationale: Embora אֶל tenha o sentido básico de “a, em direção a”, o contexto de combate exige em português a ideia de movimento hostil.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: Tradução temporal direta e natural da expressão hebraica.
- source_word: וַיַּעַרְכוּ
  choice: se dispuseram em ordem de batalha
  rationale: No uso militar, ערך indica organizar ou posicionar tropas para o combate; a formulação explicita esse sentido contextual de modo claro.
- source_word: אֶל הַגִּבְעָה
  choice: contra Gibeá
  rationale: Com o verbo militar, a preposição indica o posicionamento para enfrentar a cidade; “contra” comunica adequadamente essa relação.
- source_word: כְּפַעַם בְּפָעַם
  choice: como das outras vezes
  rationale: Representa de maneira idiomática a ideia de repetição conforme as ocasiões anteriores.
