base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: pt
  text: 'Então o levita, marido da mulher que havia sido assassinada, respondeu: “Eu e minha concubina fomos a Gibeá, que pertence a Benjamim[a], para passar a noite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fica em Benjamim”.'
    reason: A construção אֲשֶׁר לְבִנְיָמִן pode indicar tanto pertença tribal quanto localização no território de Benjamim.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה introduz a fala como resposta; «respondeu» preserva o idioma narrativo hebraico, embora nenhuma pergunta anterior esteja expressa neste versículo.
- source_word: הָאִישׁ הַלֵּוִי
  choice: o levita
  rationale: Forma natural e consagrada em português para identificar o homem por sua condição levítica.
- source_word: אִישׁ הָאִשָּׁה
  choice: marido da mulher
  rationale: Embora a construção seja literalmente «homem da mulher», no contexto ela designa o parceiro masculino; «marido» comunica essa relação de modo idiomático sem apagar a designação distinta dela como concubina na fala seguinte.
- source_word: הַנִּרְצָחָה
  choice: que havia sido assassinada
  rationale: O particípio passivo de רצח indica morte violenta e criminosa. O mais-que-perfeito composto situa naturalmente o assassinato antes desta resposta.
- source_word: הַגִּבְעָתָה
  choice: a Gibeá
  rationale: O he direcional marca movimento em direção à cidade; a preposição «a» expressa isso naturalmente em português.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: que pertence a Benjamim
  rationale: A expressão associa Gibeá a Benjamim, provavelmente ao território tribal. A formulação principal preserva a ideia de pertença, com a leitura locativa registrada em nota.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: Eu e minha concubina fomos
  rationale: A concordância no plural é natural em português com sujeito composto e comunica que ambos chegaram, preservando o pronome explícito e a presença da concubina.
- source_word: פִילֶגֶשׁ
  choice: concubina
  rationale: Equivalente lexical tradicional e preciso, que mantém a categoria social específica sem substituí-la interpretativamente por «esposa».
- source_word: לָלוּן
  choice: para passar a noite
  rationale: O infinitivo de לון indica pernoitar; esta expressão é clara e corrente em português moderno.
