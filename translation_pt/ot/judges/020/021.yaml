- from: Então os filhos de Benjamim saíram de Gibeá e, naquele dia, abateram por terra vinte e dois mil homens de Israel.[a]
  to: Então os filhos de Benjamim saíram de Gibeá e, naquele dia, fizeram cair por terra vinte e dois mil homens de Israel.
  rationale: A revisão substitui uma locução pouco natural por uma expressão portuguesa idiomática que mantém a imagem hebraica de homens derrubados ao chão. A nota é removida porque sua alternativa não preservava esse elemento do texto-fonte.
