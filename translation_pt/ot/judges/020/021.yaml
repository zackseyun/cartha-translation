base_translation:
  language: en
  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: pt
  text: Então os filhos de Benjamim saíram de Gibeá e, naquele dia, fizeram cair por terra vinte e dois mil homens de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: O wayyiqtol de יצא dá sequência à narrativa e, neste contexto militar, descreve a saída das tropas da cidade.
- source_word: בְנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Preserva a expressão hebraica de parentesco e a identidade tribal, permanecendo clara em português.
- source_word: מִן הַגִּבְעָה
  choice: de Gibeá
  rationale: A preposição indica o lugar de origem; a forma é concisa e idiomática.
- source_word: וַיַּשְׁחִיתוּ
  choice: abateram
  rationale: No contexto de batalha e diante de uma contagem de mortos, o hifil de שׁחת indica destruição letal; “abateram” comunica isso em registro militar digno.
- source_word: בְיִשְׂרָאֵל
  choice: homens de Israel
  rationale: O contexto e a construção numérica indicam que as baixas pertenciam a Israel; esta formulação é natural em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Reproduz de modo natural o marcador temporal hebraico.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: vinte e dois mil
  rationale: É a forma padrão em português para o número hebraico.
- source_word: אִישׁ
  choice: homens
  rationale: Embora o hebraico use o singular depois do numeral, o plural é exigido pelo português; “soldados” acrescentaria uma especificidade não expressa lexicalmente.
- source_word: אָרְצָה
  choice: por terra
  rationale: A forma direcional significa literalmente “para o chão/terra”; junto de “abateram”, conserva a imagem hebraica de homens derrubados em combate.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “filhos de Benjamim” preserva a textura formal do hebraico, enquanto “abateram por terra” mantém tanto o sentido militar quanto a imagem de אָרְצָה.
