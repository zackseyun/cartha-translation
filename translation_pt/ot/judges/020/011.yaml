  text: וַ/יֵּֽאָסֵ֞ף כָּל אִ֤ישׁ יִשְׂרָאֵל֙ אֶל הָ/עִ֔יר כְּ/אִ֥ישׁ אֶחָ֖ד חֲבֵרִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: pt
  text: Assim, todos os homens de Israel se reuniram contra a cidade, unidos como um só homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como um só homem, unidos”, expressão que enfatiza sua completa unidade de ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: se reuniram
  rationale: O nifal de אסף expressa aqui a reunião coletiva dos homens de Israel. A construção pronominal é natural em português e comunica o sentido sem reproduzir mecanicamente a forma passiva hebraica.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: Embora אִישׁ esteja no singular distributivo, o contexto é o da mobilização dos homens de Israel para a guerra; por isso, a referência masculina específica deve ser preservada.
- source_word: אֶל הָעִיר
  choice: junto à cidade
  rationale: אֶל indica movimento ou orientação em direção à cidade. “Junto à cidade” preserva o valor espacial sem introduzir explicitamente a ideia de ataque, que a preposição por si só não exige.
- source_word: כְּאִישׁ אֶחָד
  choice: como um só homem
  rationale: Mantém de forma natural o conhecido idioma hebraico de ação coletiva perfeitamente coordenada e preserva sua imagem masculina.
- source_word: חֲבֵרִים
  choice: unidos
  rationale: O termo derivado de חבר acrescenta a ideia de estarem ligados ou associados entre si. “Unidos” exprime de modo conciso essa coesão no contexto.
theological_decisions: []
