  text: וַ/יִּקְרְב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֥וֹם הַ/שֵּׁנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: pt
  text: No segundo dia, os filhos de Israel se aproximaram dos filhos de Benjamim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «avançaram contra».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: se aproximaram
  rationale: O qal de קרב significa chegar perto ou aproximar-se. No contexto militar, pode indicar um avanço contra o inimigo, mas o verbo não explicita por si só o ataque.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão tribal e familiar do hebraico, aqui referente coletivamente às forças das tribos de Israel.
- source_word: אֶל
  choice: de
  rationale: Em português, a regência natural de «aproximar-se» exige «de». A relação direcional do hebraico אֶל é preservada sem torná-la explicitamente hostil.
- source_word: בְנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Conserva a designação familiar e tribal do hebraico e o paralelismo com «os filhos de Israel».
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: No segundo dia
  rationale: Reproduz diretamente a indicação ordinal do hebraico, em vez de interpretá-la como «no dia seguinte».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com formulação próxima ao hebraico. A ordem temporal inicial é natural em português. A expressão «filhos de Israel» foi mantida para conservar o caráter tribal e o paralelismo do original; «israelitas» e «benjaminitas» seriam alternativas mais idiomáticas.
