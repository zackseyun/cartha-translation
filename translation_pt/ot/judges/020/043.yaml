base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: pt
  text: Cercaram Benjamim, perseguiram-no sem descanso[a] e o pisotearam[b] até diante de Gibeá, no lado oriental[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perseguiram-no desde Menuá”, caso מְנוּחָה seja entendido como nome de lugar, e não em sentido adverbial.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o fizeram avançar”. Neste contexto, o verbo hebraico pode indicar tanto pisotear com violência como fazer alguém seguir adiante.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “desde o nascente do sol”, expressão que pode significar “a leste” ou “no lado oriental”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: Cercaram
  rationale: O verbo descreve o ato militar de fechar o cerco ou rodear; “cercaram” é claro, natural e mantém essa força.
- source_word: אֶת בִּנְיָמִן
  choice: Benjamim
  rationale: O nome da tribo funciona coletivamente, e os sufixos hebraicos seguintes o retomam no singular. A tradução conserva essa personificação coletiva.
- source_word: הִרְדִיפֻהוּ
  choice: perseguiram-no
  rationale: רדף é o verbo comum para perseguir um inimigo; o pronome singular preserva a concordância coletiva do hebraico.
- source_word: מְנוּחָה
  choice: sem descanso
  rationale: O substantivo significa “descanso” ou “lugar de repouso”. Entendido adverbialmente, indica que a perseguição não deu descanso a Benjamim, mas a possibilidade de um topônimo é mantida em nota.
- source_word: הִדְרִיכֻהוּ
  choice: o pisotearam
  rationale: O hifil de דרך pode exprimir pisar ou fazer avançar. No encadeamento de ações bélicas, “pisotearam” preserva a imagem violenta sem excluir em nota a leitura de movimento forçado.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: até diante de Gibeá
  rationale: נֹכַח indica posição diante de, em frente a ou defronte de algo. “Diante de Gibeá” é espacialmente claro e natural em português.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: no lado oriental
  rationale: A expressão literalmente associada ao nascente designa o leste. A formulação comunica naturalmente a localização, enquanto a imagem hebraica é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se “Benjamim” como singular coletivo, retomado por pronomes no singular. A construção difícil com מְנוּחָה é traduzida de modo transparente como “sem descanso”, sem ocultar em nota a possível leitura geográfica. O idiomatismo oriental é naturalizado no texto e explicitado na nota.
