base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: pt
  text: Benjamim saiu de Gibeá ao encontro deles[a] no segundo dia, e eles abateram por terra mais dezoito mil israelitas[b]; todos eles eram homens que desembainhavam a espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra eles”. A expressão hebraica pode indicar um encontro hostil em contexto militar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: Benjamim saiu
  rationale: Mantém Benjamim como designação coletiva da tribo, conforme o hebraico, e traduz יצא de modo direto e natural.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: Preserva a expressão hebraica de encontro, enquanto o contexto militar deixa claro seu caráter hostil; a alternativa mais explícita consta em nota.
- source_word: מִן הַגִּבְעָה
  choice: de Gibeá
  rationale: Expressa diretamente a origem locativa e usa a forma portuguesa corrente do topônimo.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: no segundo dia
  rationale: Reflete formalmente o ordinal hebraico, sem substituí-lo pelo mais interpretativo 'no dia seguinte'.
- source_word: וַיַּשְׁחִיתוּ
  choice: eles abateram
  rationale: No contexto de batalha e contagem de mortos, comunica a ação letal do hifil de שחת com clareza, sem a rigidez de 'destruíram' aplicada a pessoas.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: israelitas
  rationale: É a forma nacional natural em português; a expressão hebraica literalmente familiar, 'filhos de Israel', é preservada em nota.
- source_word: עוֹד
  choice: mais
  rationale: Indica de modo idiomático que as dezoito mil baixas se somaram às perdas anteriores.
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: dezoito mil israelitas
  rationale: O numeral é vertido diretamente; 'israelitas' já identifica as pessoas, evitando a formulação pesada 'dezoito mil homens dos filhos de Israel'.
- source_word: אָרְצָה
  choice: por terra
  rationale: Expressão portuguesa corrente para o sentido direcional de fazer cair ao chão em combate.
- source_word: כָּל אֵלֶּה
  choice: todos eles
  rationale: Representa de forma clara o demonstrativo totalizante hebraico e retoma os mortos mencionados.
- source_word: שֹׁלְפֵי חָרֶב
  choice: homens que desembainhavam a espada
  rationale: Preserva a imagem participial de sacar a espada e explicita naturalmente que os dezoito mil eram combatentes do sexo masculino, conforme איש e o particípio masculino plural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A mudança de número entre o coletivo singular 'Benjamim saiu' e o plural 'eles abateram' acompanha o hebraico e deixa claro que a tribo atua por meio de seus homens. A formulação evita arcaísmos, mas conserva a imagem militar de desembainhar a espada.
