  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: pt
  text: Então os homens da emboscada avançaram depressa contra Gibeá, e a emboscada avançou[a] e feriu toda a cidade ao fio da espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, literalmente, “a emboscada puxou”; o verbo pode sugerir que a força emboscada se estendeu para a frente ou avançou para dentro da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: os homens da emboscada / a força de emboscada
  rationale: O substantivo singular tem sentido coletivo no contexto. A primeira expressão explicita que se trata de combatentes; a segunda mantém a referência coletiva sem sugerir uma nova tropa.
- source_word: הֵחִישׁוּ
  choice: rapidamente
  rationale: O verbo indica que agiram com pressa; junto de “avançaram”, comunica a urgência do movimento militar em português natural.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: avançaram ... contra
  rationale: Neste relato de batalha, o verbo descreve uma investida ou incursão dirigida contra Gibeá. A formulação preserva tanto o movimento quanto a hostilidade.
- source_word: הַגִּבְעָה
  choice: Gibeá
  rationale: Transliteração portuguesa corrente do nome do lugar.
- source_word: וַיִּמְשֹׁךְ
  choice: prosseguiu
  rationale: O verbo significa literalmente “puxou/estendeu” e, nesta construção comprimida, provavelmente descreve a força de emboscada prolongando ou levando adiante sua ação. A ambiguidade lexical é registrada em nota.
- source_word: וַיַּךְ
  choice: feriu
  rationale: O verbo amplo “golpear/ferir” é especificado pela expressão seguinte, que indica ação letal com a espada.
- source_word: כָּל הָעִיר
  choice: toda a cidade
  rationale: Mantém o modo hebraico de apresentar a cidade em sua totalidade, sem restringir explicitamente o referente apenas aos habitantes.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: Equivalente idiomático português da expressão hebraica, literalmente “à boca da espada”, preservando sua imagem tradicional e seu sentido letal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação em uma só frase acompanha a progressão rápida do hebraico; “força de emboscada” esclarece o coletivo sem eliminar a ambiguidade do verbo וַיִּמְשֹׁךְ, preservada na nota.
