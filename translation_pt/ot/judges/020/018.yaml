base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: pt
  text: 'Então eles se levantaram, subiram a Betel[a] e consultaram Deus. Os filhos de Israel perguntaram: “Quem de nós subirá primeiro para a batalha contra os filhos de Benjamim?” Yahweh respondeu: “Judá primeiro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betel significa “casa de Deus”. A expressão hebraica também pode, possivelmente, ser entendida aqui como “à casa de Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: eles se levantaram, subiram
  rationale: Mantém a sequência narrativa e o sentido recorrente de עלה, “subir”, sem tornar o português artificial.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Trata a expressão como o nome próprio do local, conforme o contexto narrativo, usando a forma portuguesa tradicional.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: consultaram a Deus
  rationale: O verbo com essa construção indica buscar orientação divina; “consultaram” comunica isso com naturalidade e precisão.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica de parentesco e sua função de designar coletivamente o povo de Israel.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: Quem de nós subirá primeiro
  rationale: “De nós” expressa de modo idiomático o interesse coletivo indicado por לָנוּ, enquanto “subirá primeiro” conserva o verbo e a prioridade solicitada.
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: para combater os filhos de Benjamim
  rationale: No contexto bélico, עִם descreve o confronto; a formulação portuguesa evita o possível equívoco de “com” como aliança, mantendo a designação de parentesco.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahweh respondeu
  rationale: O nome divino é transliterado, e “respondeu” torna explícita a função discursiva do verbo genérico אמר após a pergunta.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: Judá primeiro
  rationale: Preserva a resposta hebraica breve e elíptica, cujo verbo é facilmente recuperado da pergunta.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto principal o nome pessoal da aliança expresso pelo Tetragrama, sem substituir seu valor lexical por um título.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A opção mantém a imagem hebraica de descendência corporativa sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A narrativa permanece concisa; conservam-se “subiram”, as expressões de parentesco e a resposta elíptica “Judá primeiro”, enquanto “consultaram” e “para combater” comunicam naturalmente as relações semânticas do hebraico.
