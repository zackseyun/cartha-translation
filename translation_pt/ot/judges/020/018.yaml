  to: 'Então eles se levantaram, subiram a Betel[a] e consultaram Deus. Os filhos de Israel perguntaram: “Quem de nós subirá primeiro para a batalha contra os filhos de Benjamim?” Yahweh respondeu: “Judá primeiro.”'
