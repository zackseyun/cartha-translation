base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: pt
  text: Então os filhos de Benjamim se reuniram, vindo das cidades, em Gibeá, para sair à batalha contra os filhos de Israel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com os filhos de Israel”; neste contexto de batalha, o sentido é adversativo, isto é, “contra os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os benjaminitas [...] contra os israelitas”. O texto principal preserva a expressão tribal hebraica “filhos de”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: se reuniram
  rationale: O nifal de אסף indica que vieram a reunir-se; a forma pronominal é natural em português e preserva esse sentido coletivo.
- source_word: בְנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Mantém a expressão tribal e familiar do hebraico, sem substituí-la silenciosamente por um gentílico.
- source_word: מִן הֶעָרִים
  choice: vindo das cidades
  rationale: A preposição מן marca a origem. O gerúndio explicita com naturalidade em português de onde os homens se reuniram.
- source_word: הַגִּבְעָתָה
  choice: em Gibeá
  rationale: O ה direcional indica movimento para Gibeá. Com o verbo português 'reunir-se', 'em Gibeá' expressa de modo natural o destino e ponto de concentração; 'para Gibeá' também seria possível.
- source_word: לָצֵאת
  choice: para sair
  rationale: Reproduz de perto o infinitivo de יצא e preserva a expressão militar hebraica sem acrescentar a ideia mais específica de marchar.
- source_word: לַמִּלְחָמָה
  choice: à batalha
  rationale: 'Na construção לצאת למלחמה, indica a finalidade militar: sair para combater. ''Sair à batalha'' é conciso e digno em português.'
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: contra os filhos de Israel
  rationale: Embora עִם costume significar 'com', no contexto de combate assume sentido adversativo. A expressão 'filhos de Israel' conserva o idioma de parentesco tribal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura conserva os dois usos de 'filhos de' e mantém em nota a ambiguidade lexical de עִם.
