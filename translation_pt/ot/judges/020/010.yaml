  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: pt
  text: E escolheremos dez homens de cada cem, de todas as tribos de Israel, cem de cada mil e mil de cada dez mil, para buscarem provisões para o povo, a fim de que, ao chegarem a Gibeá de Benjamim, procedam conforme toda a infâmia[a] que ela cometeu em Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “ato vergonhoso”, “ato ultrajante” ou “atrocidade”. O termo hebraico indica um ato chocante e moralmente infame.
    reason: lexical_alternative
  - marker: b
    text: O hebraico tem literalmente “que ele fez”, com verbo masculino singular. No contexto, pode referir-se a Gibeá, tratada como responsável coletiva, mas o referente preciso do singular não é expresso de modo inequívoco.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: E escolheremos
  rationale: O perfeito qal com waw tem valor prospectivo neste contexto deliberativo. “Escolheremos” explicita que os homens seriam destacados proporcionalmente, não apenas tomados de modo indistinto.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: dez homens de cada cem ... cem de cada mil e mil de cada dez mil
  rationale: A formulação comunica com clareza a seleção proporcional de um décimo de cada grupo e preserva a progressão numérica hebraica.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: de todas as tribos de Israel
  rationale: No contexto da seleção proporcional, os homens são tirados do conjunto das tribos; “de” expressa naturalmente essa origem em português.
- source_word: לָקַחַת צֵדָה לָעָם
  choice: para buscarem provisões para o povo
  rationale: צֵדָה designa mantimentos ou suprimentos necessários para a campanha. “Provisões” mantém essa amplitude, e “povo” preserva o termo comum hebraico sem restringi-lo formalmente a “exército”.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: Assim, quando chegarem ... poderão agir
  rationale: A sequência de infinitivos é comprimida. A tradução desdobra a relação de propósito e a ação prevista para a chegada, produzindo português natural sem especificar em excesso a forma da ação.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: a Gibeá de Benjamim
  rationale: A preposição indica direção. A forma preserva o movimento rumo à cidade, enquanto o contexto e a oração seguinte indicam a ação hostil ou judicial.
- source_word: כְּכָל הַנְּבָלָה
  choice: conforme toda a infâmia
  rationale: נְבָלָה denota aqui um ato moralmente chocante, vergonhoso e ultrajante. “Infâmia” transmite sua forte censura moral em português digno e corrente.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: que foi cometida em Israel
  rationale: A construção passiva oferece português natural e evita decidir silenciosamente se o sujeito singular implícito é a cidade personificada ou algum autor representativo do crime; a ambiguidade é registrada em nota.
theological_decisions:
- issue: Força moral de נְבָלָה sem introduzir categoria doutrinária posterior
  choice: infâmia
  alternative: ato vergonhoso; atrocidade; insensatez
  rationale: “Infâmia” preserva a condenação intensa do ato, sem importar terminologia teológica técnica ausente do hebraico.
- issue: Identidade do sujeito singular de אֲשֶׁר עָשָׂה
  choice: 'formulação passiva: “que foi cometida”'
  alternative: “que ela cometeu”, tomando Gibeá como sujeito corporativo
  rationale: O hebraico emprega verbo masculino singular, mas não torna inequívoco seu referente. A forma passiva preserva a tensão entre responsabilidade individual e corporativa sem resolvê-la no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A progressão numérica foi mantida, e a sintaxe hebraica comprimida foi desdobrada apenas o necessário para clareza. As notas preservam a força moral de נְבָלָה e a ambiguidade do sujeito verbal final.
