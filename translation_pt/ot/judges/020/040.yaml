  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a vivacidade narrativa e a ambiguidade do hebraico quanto ao que exatamente subia da cidade. “Eis que” foi conservado por sua função dramática, embora tenha sabor bíblico.
