  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: pt
  text: Mas o sinal começou a subir da cidade como uma coluna de fumaça[a], e Benjamim virou-se para trás[b], e eis que a cidade inteira subia aos céus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sinalizador começou a subir da cidade como uma coluna de fumaça”. O termo hebraico pode designar algo elevado e, neste contexto, provavelmente se refere ao sinal de batalha previamente combinado.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Benjamim virou-se para trás”. Isso pode significar que os benjamitas voltaram para trás ou que se viraram para olhar atrás de si.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a cidade inteira subia ao céu”, isto é, em chamas e fumaça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: o sinal
  rationale: No contexto da emboscada, designa o sinal previamente combinado, manifestado pela fumaça; “sinal” comunica sua função com clareza sem especificar além do hebraico.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: começou a subir
  rationale: Reproduz naturalmente tanto o aspecto incoativo quanto o movimento ascendente.
- source_word: עַמּוּד עָשָׁן
  choice: uma coluna de fumaça
  rationale: Expressão portuguesa corrente para uma formação vertical de fumaça e equivalente natural da locução hebraica.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: Então Benjamim se virou para trás
  rationale: Preserva o verbo “virar-se” e a referência espacial; “Benjamim” funciona coletivamente como nome da tribo.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a força dramática do marcador de percepção súbita em registro bíblico ainda compreensível.
- source_word: עָלָה
  choice: subia
  rationale: O imperfeito português apresenta a cena em andamento percebida por Benjamim, sem explicitar se eram chamas ou fumaça que subiam.
- source_word: כְלִיל הָעִיר
  choice: a cidade inteira
  rationale: Expressa com naturalidade a totalidade indicada por כְלִיל.
- source_word: הַשָּׁמָיְמָה
  choice: aos céus
  rationale: Conserva a forma plural e o movimento direcional para cima expresso no hebraico.
