  text: וַ/יִּתְחַזֵּ֥ק הָ/עָ֖ם אִ֣ישׁ יִשְׂרָאֵ֑ל וַ/יֹּסִ֨פוּ֙ לַ/עֲרֹ֣ךְ מִלְחָמָ֔ה בַּ/מָּק֕וֹם אֲשֶׁר עָ֥רְכוּ שָׁ֖ם בַּ/יּ֥וֹם הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: pt
  text: Mas o povo, os homens de Israel, fortaleceu-se[a], e os homens de Israel voltaram a pôr-se em formação para a batalha no lugar onde se haviam posto no primeiro dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recobrou a coragem”. O hebraico pode indicar que o povo recuperou a determinação depois da derrota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: se fortaleceu
  rationale: O hitpael de חזק tem aqui sentido reflexivo ou intransitivo e descreve a recuperação da firmeza após a derrota; “se fortaleceu” preserva essa nuance, enquanto a nota registra a alternativa contextual mais idiomática.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: o povo, os homens de Israel
  rationale: A construção apositiva reúne o coletivo “o povo” e a referência aos combatentes israelitas; manter ambos evita reduzir o texto simplesmente a “Israel” ou introduzir o substantivo interpretativo “exército”.
- source_word: וַיֹּסִפוּ
  choice: tornou a
  rationale: Com o infinitivo seguinte, יסף indica repetição ou retomada. A construção portuguesa “tornou a” expressa isso naturalmente e concorda com o sujeito coletivo “o povo”.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: se pôr em formação de batalha
  rationale: ערך com מלחמה descreve a disposição das linhas para o combate. A formulação conserva o sentido militar específico e é clara em português moderno.
- source_word: בַּמָּקוֹם
  choice: no lugar
  rationale: Equivalência locativa direta e natural para בַּמָּקוֹם.
- source_word: אֲשֶׁר עָרְכוּ שָׁם
  choice: onde havia se posicionado
  rationale: Retoma o verbo militar ערך e localiza a formação anterior; o mais-que-perfeito composto marca com clareza a anterioridade, sem reproduzir redundantemente o advérbio “ali”.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: no primeiro dia
  rationale: Tradução temporal direta, precisa e idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Preserva-se a aposição incomum “o povo, os homens de Israel” e emprega-se vocabulário militar compreensível sem introduzir o termo mais interpretativo “exército”.
