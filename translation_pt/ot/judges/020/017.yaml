  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל הִתְפָּֽקְד֗וּ לְ/בַד֙ מִ/בִּנְיָמִ֔ן אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב כָּל זֶ֖ה אִ֥ישׁ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: pt
  text: 'Os homens de Israel, sem contar Benjamim[a], foram recenseados[b]: ოთხrocentos mil homens que desembainhavam a espada[c]. Todos eles eram homens de guerra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à parte de Benjamim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram mobilizados”; o verbo hebraico pode indicar tanto a contagem quanto o alistamento ou a convocação para o serviço militar.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “que desembainhavam a espada”, expressão hebraica que designa combatentes armados.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Os homens de Israel
  rationale: Embora אִישׁ esteja no singular, funciona coletivamente e concorda com o verbo no plural; a expressão preserva o sentido masculino e militar do contexto.
- source_word: הִתְפָּקְדוּ
  choice: foram contados
  rationale: O hitpael de פקד pode indicar contagem ou alistamento militar. 'Foram contados' comunica naturalmente o recenseamento do contingente sem excluir a nuance militar, registrada em nota.
- source_word: לְבַד מִבִּנְיָמִן
  choice: sem contar Benjamim
  rationale: A expressão separa a tribo de Benjamim do total apresentado. Esta formulação é clara e idiomática em português.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: quatrocentos mil homens
  rationale: Mantém o número e o substantivo אִישׁ explicitamente presentes no hebraico.
- source_word: שֹׁלֵף חָרֶב
  choice: que sabiam manejar a espada
  rationale: A expressão literalmente descreve quem puxa ou desembainha a espada, mas funciona como designação de combatentes armados; a tradução torna o sentido idiomático claro, enquanto a nota preserva a imagem literal.
- source_word: כָּל זֶה
  choice: Todos eles
  rationale: O singular demonstrativo hebraico retoma coletivamente todo o contingente contado; o plural português identifica com clareza o referente.
- source_word: אִישׁ מִלְחָמָה
  choice: homens de guerra
  rationale: Preserva de perto a expressão militar hebraica e seu registro solene, sendo compreensível em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém a estrutura de recenseamento militar do hebraico, usa uma formulação natural para a exclusão de Benjamim e conserva a expressão tradicional 'homens de guerra'. Os marcadores aparecem junto aos termos correspondentes e seguem ordem alfabética.
