    rationale: שֹׁלֵף חָרֶב significa literalmente alguém que tira ou desembainha a espada; no contexto, designa combatentes armados. A formulação atual enfraquece a imagem e acrescenta a noção de perícia.
  - severity: medium
    issue: A nota c traz a expressão portuguesa incorreta “que puxavam da espada”.
    rationale: Além de não corresponder bem ao hebraico, a expressão não é natural em português. A nota deve apresentar a formulação literal correta, “que desembainhavam a espada”.
