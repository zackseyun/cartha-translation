  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: pt
  text: E os filhos de Israel[a] consultaram Yahweh (pois a arca da aliança de Deus estava ali naqueles dias).[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os israelitas consultaram Yahweh». O hebraico diz literalmente «os filhos de Israel».'
    reason: lexical_alternative
  - marker: b
    text: A oração «pois a arca da aliança de Deus estava ali naqueles dias» explica o contexto em que eles consultaram Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: consultaram
  rationale: No uso com ב e o nome divino, שׁאל indica buscar orientação divina ou consultar Yahweh, não apenas fazer uma pergunta.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma coletiva masculina do hebraico; em português bíblico atual, a expressão é clara e digna.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Com o verbo שׁאל, a preposição integra a construção idiomática traduzida por «consultar Yahweh».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְשָׁם
  choice: pois ... estava ali
  rationale: A oração fornece informação explicativa sobre o cenário da consulta; «pois» e os travessões tornam essa função natural em português.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: a arca da aliança de Deus
  rationale: Mantém integralmente e com clareza a cadeia construta hebraica.
- source_word: בַּיָּמִים הָהֵם
  choice: naqueles dias
  rationale: Equivalente português direto e natural da expressão temporal hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva «filhos de Israel» por correspondência formal e usa «consultaram» para comunicar o sentido oracular do verbo. Os travessões marcam a observação explicativa sem eliminar sua ligação sintática com a frase.
