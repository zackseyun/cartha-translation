  yaml_path: translation/ot/judges/020/007.yaml
  text: Look, all of you sons of Israel, give your word and counsel here.
translation:
  language: pt
  text: 'Vejam, todos vocês, filhos de Israel: apresentem aqui sua palavra e seu conselho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Interjeição que chama enfaticamente a atenção de toda a assembleia; o plural corresponde aos destinatários.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a designação coletiva tradicional e a forma concreta do hebraico, sem restringi-la indevidamente apenas aos homens.
- source_word: הָבוּ לָכֶם דָּבָר וְעֵצָה
  choice: Apresentem aqui sua palavra e seu conselho
  rationale: דָּבָר é mantido como 'palavra', em paralelo com 'conselho'; 'apresentem' expressa de modo natural o imperativo idiomático הָבוּ sem reduzir a expressão a mera opinião.
- source_word: הֲלֹם
  choice: aqui
  rationale: Mantém o advérbio de lugar, provavelmente referente à assembleia presente.
