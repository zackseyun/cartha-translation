  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמַ֕ר אַחַ֥/י בְּנֵֽי אִמִּ֖/י הֵ֑ם חַי יְהוָ֗ה ל֚וּ הַחֲיִתֶ֣ם אוֹתָ֔/ם לֹ֥א הָרַ֖גְתִּי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: pt
  text: 'E ele disse: “Eles eram meus irmãos, filhos da minha mãe.[a] Tão certo como Yahweh vive, se vocês os tivessem deixado viver, eu não mataria vocês.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos da minha mãe” ressalta que eram irmãos de Gideão em sentido familiar próximo, não apenas parentes ou membros do mesmo povo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “eu não teria matado vocês”. O hebraico admite essa forma de expressar a consequência contrafactual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: E ele disse
  rationale: Reproduz a sequência narrativa do wayyiqtol sem acrescentar uma relação temporal mais específica.
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: Eles eram meus irmãos, filhos da minha mãe
  rationale: Mantém a identificação enfática e a aposição hebraica; “filhos da minha mãe” indica que eram irmãos de Gideão em sentido familiar próximo, não apenas parentes ou membros do mesmo povo.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Expressa em português natural a fórmula solene de juramento e conserva o nome divino presente no texto hebraico.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: se vocês os tivessem deixado viver
  rationale: Representa a condição irreal passada introduzida por לוּ e o sentido causativo de חיה, “manter/deixar vivo”.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: eu não mataria vocês
  rationale: Em português, esta forma comunica naturalmente que Gideão não os mataria agora caso eles tivessem poupado seus irmãos; a forma verbal hebraica também permite uma representação estritamente contrafactual passada, registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה na fórmula de juramento
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino, não um título. “Yahweh” o translitera de modo amplamente reconhecível e evita substituí-lo por “Senhor”.
- issue: Referência aos “filhos da minha mãe”
  choice: Preservar a expressão literal no texto e explicar sua força em nota
  alternative: meus irmãos de pai e mãe; meus irmãos legítimos
  rationale: A expressão identifica uma relação fraterna estreita, mas convertê-la diretamente em uma categoria técnica poderia especificar mais do que o hebraico declara.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O pronome “vocês” torna explícito o plural hebraico dirigido aos dois reis. A construção do juramento evita linguagem arcaica sem perder sua solenidade.
