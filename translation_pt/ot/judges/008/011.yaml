  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: pt
  text: Então Gideão subiu pelo caminho dos que moravam em tendas, a leste de Noba e Jogbeá, e atacou o acampamento, que estava desprevenido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e o acampamento estava seguro». O termo hebraico pode indicar segurança ou confiança; neste contexto, provavelmente significa que o acampamento não esperava um ataque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido básico de עלה e o movimento narrativo, sem acrescentar explicitamente a ideia de ataque.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: pelo caminho dos que moravam em tendas
  rationale: Traduz a expressão de modo transparente e natural, sem substituir a descrição hebraica pelo termo mais interpretativo «nômades».
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: a leste de Noba e Jogbeá
  rationale: Neste contexto geográfico, מִקֶּדֶם indica a localização oriental em relação às duas cidades.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: atacou o acampamento
  rationale: Embora נכה signifique literalmente «ferir/golpear», em contexto militar «atacou» comunica com clareza a ação sem afirmar que o acampamento foi completamente derrotado.
- source_word: בֶּטַח
  choice: desprevenido
  rationale: O termo denota segurança ou confiança; no contexto de um ataque, indica que o acampamento se julgava seguro e não esperava perigo.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil. Mantém a descrição concreta «os que moravam em tendas» e sinaliza em nota a ambiguidade de בֶּטַח.
