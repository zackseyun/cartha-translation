  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e internacionalmente. O tratamento por “vocês” e “suas” evita arcaísmo, enquanto a imagem “em suas mãos” preserva a linguagem concreta do hebraico.
