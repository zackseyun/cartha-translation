base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: pt
  text: 'Então ele foi até os homens de Sucote e disse: “Aqui estão Zeba e Zalmuna, a respeito dos quais vocês me insultaram[a], dizendo: ‘Será que Zeba e Zalmuna já estão em sua mão[b], para que demos pão aos seus homens exaustos?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito dos quais vocês me afrontaram” ou “por causa dos quais vocês zombaram de mim”. O verbo hebraico transmite a ideia de reprovação desdenhosa.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “A mão ou palma de Zeba e Zalmuna já está em sua mão...?” Trata-se de uma expressão que significa: “Você já os capturou?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: os homens de Sucote
  rationale: Preserva o sentido literal e social de אַנְשֵׁי, que no contexto se refere aos habitantes ou líderes masculinos de Sucote interpelados por Gideão.
- source_word: הִנֵּה
  choice: Aqui estão
  rationale: Expressa de modo natural a força dêitica da partícula, chamando atenção para os dois reis agora presentes.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba e Zalmuna
  rationale: Emprega formas portuguesas claras e reconhecíveis para os nomes próprios hebraicos.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: a respeito dos quais vocês me insultaram
  rationale: חרף indica censura desdenhosa ou afronta. “Insultaram” conserva a força hostil da fala sem impor uma interpretação mais específica; “a respeito dos quais” explicita a relação sintática natural em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente português corrente da fórmula que introduz o conteúdo da fala anterior.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: Será que ... já estão em suas mãos
  rationale: Mantém a imagem hebraica de estar na mão de alguém, expressão também inteligível em português como estar sob seu domínio ou poder.
- source_word: כִּי נִתֵּן
  choice: para que demos
  rationale: 'Reproduz a consequência implícita na pergunta retórica: os homens de Sucote recusavam alimentar as tropas enquanto os reis ainda não tivessem sido capturados.'
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: aos seus homens exaustos
  rationale: יְעֵפִים descreve cansaço intenso decorrente da perseguição; “exaustos” comunica essa força em português atual.
- source_word: לָחֶם
  choice: pão
  rationale: Conserva o equivalente lexical direto, embora no contexto o termo também possa representar alimento em geral.
