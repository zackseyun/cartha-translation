- from: 'Então os líderes de Sucote disseram: “Por acaso as mãos de Zeba e Zalmuna já estão em seu poder, para que demos pão ao seu exército?”'
  to: 'Então as autoridades de Sucote disseram: “Será que Zeba e Zalmuna já estão em seu poder, para que devamos dar pão ao seu exército?”'
