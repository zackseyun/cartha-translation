base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: pt
  text: 'Então as autoridades de Sucote disseram: “Será que Zeba e Zalmuna já estão em seu poder, para que devamos dar pão ao seu exército?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: os líderes de Sucote
  rationale: שָׂרִים designa os dirigentes ou autoridades da cidade; “líderes” é natural e suficientemente amplo em português.
- source_word: הֲכַף
  choice: Por acaso as mãos
  rationale: Preserva a imagem corporal e o tom retórico e desdenhoso do hebraico; o singular coletivo כַּף aparece ligado aos dois inimigos.
- source_word: עַתָּה בְּיָדֶךָ
  choice: já estão em seu poder
  rationale: A expressão idiomática indica captura ou domínio. “Já” comunica a alegação de que Gideão ainda não os havia capturado.
- source_word: לִצְבָאֲךָ
  choice: ao seu exército
  rationale: צָבָא refere-se aqui à força armada de Gideão; “exército” é claro e corrente.
theological_decisions:
- issue: Sentido da pergunta retórica dos líderes de Sucote
  choice: Manter a pergunta como recusa baseada no fato de Zeba e Zalmuna ainda não estarem capturados
  alternative: 'Reformular explicitamente como declaração: “Você ainda não capturou... por isso não daremos pão”'
  rationale: O hebraico expressa o desprezo e a recusa por meio de uma pergunta retórica; explicitá-la eliminaria sua força literária e parte de sua ambiguidade pragmática.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe natural para leitores brasileiros. A metáfora “as mãos ... em seu poder” é mantida de modo inteligível, sem suavizar a ironia dos líderes.
