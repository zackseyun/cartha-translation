base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: pt
  text: Gideão transformou aquilo num éfode[a] e o instalou na sua cidade, Ofra. Ali, todos os israelitas se prostituíram seguindo-o[b], e o éfode se tornou um laço para Gideão e para a sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “éfode” era um objeto cultual associado ao uso sacerdotal; aqui, o texto não especifica com clareza sua forma ou função exata.
    reason: cultural_note
  - marker: b
    text: O hebraico emprega aqui a imagem da prostituição para descrever a infidelidade religiosa de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: num éfode
  rationale: 'A construção com עשה e ל é entendida de modo resultativo: Gideão transformou o ouro anteriormente mencionado em um éfode. Mantém-se o termo cultual sem definir além do que o texto informa.'
- source_word: וַיַּצֵּג
  choice: o instalou
  rationale: O verbo causativo comunica fazer o objeto ficar de pé ou colocá-lo em posição. “Instalou” sugere sua colocação deliberada no local sem afirmar que fosse uma imagem ou simples peça decorativa.
- source_word: בְעִירוֹ בְעָפְרָה
  choice: em sua cidade, Ofra
  rationale: Preserva o sentido comum de עִיר e identifica Ofra como a cidade de Gideão, com formulação natural em português.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: se prostituiu, seguindo-o
  rationale: Mantém a imagem sexual explícita de זנה para a infidelidade cultual de Israel. “Seguindo-o” representa אַחֲרָיו e deixa claro que o referente é o éfode.
- source_word: שָׁם
  choice: Ali
  rationale: Conserva a ênfase espacial, ligando a infidelidade de Israel à instalação do éfode em Ofra.
- source_word: לְמוֹקֵשׁ
  choice: um laço
  rationale: Preserva a metáfora hebraica de uma armadilha que conduz ao pecado ou à ruína.
- source_word: וּלְבֵיתוֹ
  choice: para sua casa
  rationale: “Casa” conserva a amplitude de בַּיִת, que pode incluir família, descendência e dinastia, sem restringir o sentido.
theological_decisions:
- issue: Metáfora da reação idólatra de Israel ao éfode
  choice: 'Preservar a imagem explícita: “se prostituiu, seguindo-o”'
  alternative: “foi infiel por causa dele” ou “desviou-se seguindo-o”
  rationale: זנה expressa a infidelidade religiosa mediante uma forte metáfora sexual. Preservá-la mantém o peso teológico e retórico do hebraico.
- issue: Natureza do éfode de Gideão
  choice: Usar “éfode” sem especificar sua forma ou função
  alternative: “veste sacerdotal”, “ídolo” ou “imagem sagrada”
  rationale: O texto nomeia o objeto, mas não determina claramente se era uma veste, uma imagem ou um instrumento oracular; a tradução não deve resolver essa ambiguidade.
- issue: Sentido de “casa” em relação a Gideão
  choice: Manter “casa”
  alternative: “família” ou “descendência”
  rationale: O hebraico pode abranger a família e a linhagem de Gideão. “Casa” preserva essa amplitude e a ressonância narrativa sem escolher apenas um aspecto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para dar naturalidade a “Ali”, sem perder a ênfase de שָׁם. A metáfora sexual e as ambiguidades de “éfode” e “casa” foram preservadas.
