base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: pt
  text: 'Mas ele lhes disse: “O que fiz eu agora, em comparação com vocês? As sobras da colheita de uvas de Efraim não são melhores do que a colheita de uvas de Abiezer?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Mas ele lhes disse
  rationale: O waw faz avançar a narrativa, enquanto “mas” expressa naturalmente o contraste entre a reclamação anterior dos efraimitas e a resposta conciliadora de Gideão; אֲלֵיהֶם refere-se aos homens de Efraim.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: O que fiz eu, comparado ao que vocês fizeram?
  rationale: A preposição כ marca comparação. A explicitação “ao que vocês fizeram” produz português natural e mantém a autodepreciação retórica de Gideão; עַתָּה tem aqui força contextual e não exige o literal “agora”.
- source_word: הֲלוֹא
  choice: Não são
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa.
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: as sobras da colheita de uvas de Efraim
  rationale: עֹלְלוֹת designa as uvas deixadas para trás depois da colheita principal. A formulação torna clara a imagem da vindima para leitores modernos.
- source_word: טוֹב ... מִבְצִיר אֲבִיעֶזֶר
  choice: melhores do que toda a colheita de uvas de Abiezer
  rationale: טוֹב com מן tem valor comparativo, “melhores do que”; בָּצִיר é a colheita/vindima de uvas. “Toda” explicita o contraste implícito entre as sobras de Efraim e a colheita principal de Abiezer.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A metáfora vitícola foi preservada e esclarecida sem recorrer ao termo menos comum “vindima”. “Vocês” oferece naturalidade internacional com leitura imediata no Brasil.
