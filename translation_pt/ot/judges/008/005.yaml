  text: וַ/יֹּ֨אמֶר֙ לְ/אַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָ/עָ֖ם אֲשֶׁ֣ר בְּ/רַגְלָ֑/י כִּי עֲיֵפִ֣ים הֵ֔ם וְ/אָנֹכִ֗י רֹדֵ֛ף אַחֲרֵ֛י זֶ֥בַח וְ/צַלְמֻנָּ֖ע מַלְכֵ֥י מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: pt
  text: 'E ele disse aos homens de Sucote: “Por favor, deem pães ao povo que está comigo[a], pois eles estão cansados, e eu estou perseguindo Zeba e Zalmuna, reis de Midiã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que está aos meus pés”, expressão que se refere aos que o acompanhavam ou seguiam.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: aos homens de Sucote
  rationale: אַנְשֵׁי é o plural masculino de אִישׁ em construção e se refere aos homens, provavelmente aos representantes masculinos da cidade. “Sucote” segue a forma tradicional e reconhecível do topônimo em português.
- source_word: תְּנוּ נָא
  choice: Por favor, deem
  rationale: O imperativo plural acompanhado de נָא expressa um pedido cortês ou insistente; esta formulação é natural no português moderno.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: pães
  rationale: A expressão designa pães ou unidades de pão, originalmente talvez de formato arredondado. “Pães” comunica o sentido de modo claro sem acrescentar uma forma não necessária ao contexto.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: ao povo que está comigo
  rationale: Literalmente, “ao povo que está aos meus pés”; no contexto, a expressão idiomática indica os que acompanham ou seguem Gideão. A tradução principal comunica esse sentido, e a imagem hebraica é preservada em nota.
- source_word: עֲיֵפִים
  choice: cansados
  rationale: O adjetivo indica cansaço decorrente do esforço. “Cansados” é claro e natural, sem intensificar indevidamente para “exaustos” ou “desfalecidos”.
- source_word: רֹדֵף אַחֲרֵי
  choice: estou perseguindo
  rationale: O particípio expressa uma ação em curso, e a combinação com אַחֲרֵי indica perseguição a alguém.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba e Zalmuna
  rationale: Os nomes próprios são transliterados em formas correntes e legíveis em português.
- source_word: מַלְכֵי מִדְיָן
  choice: reis de Midiã
  rationale: Reproduz diretamente a construção hebraica e mantém “Midiã”, forma tradicional do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O pronome explícito “eles” esclarece que os cansados são os integrantes do povo, não os homens de Sucote. A abertura “E ele disse” preserva a ligação narrativa do hebraico.
