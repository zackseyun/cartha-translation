  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: pt
  text: E aconteceu que, quando Gideão morreu, os filhos de Israel voltaram a prostituir-se, seguindo os baalins[a], e adotaram Baal-Berite como seu deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltaram a agir como prostitutas, seguindo os baalins”. O hebraico emprega uma imagem sexual para descrever a infidelidade idólatra.'
    reason: lexical_alternative
  - marker: b
    text: Baal-Berite provavelmente significa “Baal da aliança” ou “Senhor da aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: E aconteceu que, quando
  rationale: Preserva a fórmula hebraica de transição narrativa e sua oração temporal sem prejudicar a fluidez em português.
- source_word: וַיָּשׁוּבוּ
  choice: voltaram a
  rationale: No contexto, o verbo indica recaída no comportamento idólatra anterior, e não retorno físico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Representa de modo transparente a expressão hebraica que designa coletivamente o povo da aliança.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: prostituir-se, seguindo
  rationale: Mantém a forte imagem sexual de infidelidade religiosa presente em זנה, enquanto 'seguindo' expressa naturalmente a relação indicada por אַחֲרֵי.
- source_word: הַבְּעָלִים
  choice: os baalins
  rationale: Usa a forma portuguesa tradicional para o plural das diversas manifestações locais de Baal.
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: adotaram
  rationale: Comunica de maneira natural que os israelitas escolheram ou estabeleceram para si essa divindade, sem sugerir necessariamente a fabricação de um objeto.
- source_word: בַּעַל בְּרִית
  choice: Baal-Berite
  rationale: Mantém como nome próprio cultual a forma transliterada e deixa seu significado para a nota.
- source_word: לֵאלֹהִים
  choice: como seu deus
  rationale: Expressa a designação de Baal-Berite como divindade para eles, incorporando naturalmente a força contextual de לָהֶם.
theological_decisions:
- issue: Conservação da metáfora sexual aplicada à idolatria
  choice: prostituir-se, seguindo os baalins
  alternative: tornaram a ser infiéis, seguindo os baalins
  rationale: O hebraico emprega explicitamente זנה e descreve a apostasia mediante uma imagem sexual contundente; suavizá-la ocultaria parte da força teológica do texto.
- issue: Forma coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha conserva a formulação hebraica e sua ressonância corporativa, embora a alternativa seja idiomática e semanticamente possível.
- issue: Identidade cultual de בַּעַל בְּרִית
  choice: Baal-Berite
  alternative: Baal da Aliança
  rationale: Por se tratar de um nome cultual próprio, a transliteração evita transformar silenciosamente o nome em uma descrição ou título; o significado provável é informado em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção narrativa e a metáfora forte do hebraico foram preservadas; formas consagradas como “baalins” e “Baal-Berite” mantêm a referência cultual reconhecível.
