base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: pt
  text: Gideão teve setenta filhos[a], todos gerados por ele, pois tinha muitas esposas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «os que saíram da sua coxa», expressão idiomática que indica seus descendentes biológicos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: Gideão teve
  rationale: A construção hebraica com היה e ל expressa posse; em português corrente, «Gideão teve» comunica isso naturalmente. O waw inicial funciona como ligação discursiva e não exige um advérbio temporal como «então» ou «ora».
- source_word: שִׁבְעִים בָּנִים
  choice: setenta filhos
  rationale: בָּנִים designa especificamente filhos do sexo masculino, e não filhos em sentido genérico ou crianças.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: gerados por ele
  rationale: A expressão idiomática, literalmente «os que saíram da sua coxa», indica descendência biológica direta. A formulação escolhida preserva esse sentido em português natural, enquanto a imagem literal é registrada em nota.
- source_word: כִּי
  choice: porque
  rationale: Aqui a conjunção introduz a razão de Gideão ter tantos filhos.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: tinha muitas esposas
  rationale: Neste contexto doméstico, נָשִׁים tem o sentido relacional de «esposas», e היה com ל volta a expressar posse.
theological_decisions:
- issue: Descrição de um lar poligínico
  choice: Traduzir descritivamente como «muitas esposas», sem comentário moral.
  alternative: Atenuar para «muitas mulheres» ou acrescentar aprovação ou reprovação.
  rationale: O versículo relata a situação familiar de Gideão sem avaliá-la explicitamente. A tradução não deve ocultar o vínculo conjugal nem introduzir um juízo ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura é direta e mantém a explicação causal do hebraico sem acrescentar um marcador temporal inexistente.
