  text: וַ/יַּ֤עַל מִ/שָּׁם֙ פְּנוּאֵ֔ל וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם כָּ/זֹ֑את וַ/יַּעֲנ֤וּ אוֹת/וֹ֙ אַנְשֵׁ֣י פְנוּאֵ֔ל כַּ/אֲשֶׁ֥ר עָנ֖וּ אַנְשֵׁ֥י סֻכּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: pt
  text: Dali, Gideão subiu a Penuel[b] e falou com eles da mesma maneira[a], e os homens de Penuel lhe responderam como os homens de Sucote haviam respondido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e falou com eles assim”. O hebraico remete ao mesmo tipo de pedido ou discurso relatado no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Penuel também aparece com a forma “Peniel” em outras passagens.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: Dali, Gideão subiu
  rationale: O verbo עלה preserva a ideia direcional de subir, e מִשָּׁם remete ao lugar anterior. O sujeito implícito é explicitado como Gideão para clareza natural em português.
- source_word: פְּנוּאֵל
  choice: Penuel
  rationale: Transliteração correspondente à forma consonantal deste versículo; a variante tradicional Peniel é registrada em nota.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: e falou com eles da mesma maneira
  rationale: A expressão significa literalmente 'falou com eles assim' e retoma o pedido feito no versículo anterior sem repeti-lo.
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: lhe responderam
  rationale: ענה com objeto direto significa responder; a construção pronominal é concisa e idiomática em português.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: os homens de Penuel
  rationale: Mantém a designação masculina explícita אַנְשֵׁי, sem generalizá-la como 'povo'.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: como os homens de Sucote haviam respondido
  rationale: כַּאֲשֶׁר introduz comparação. O mais-que-perfeito composto deixa clara a anterioridade da resposta de Sucote.
- source_word: סֻכּוֹת
  choice: Sucote
  rationale: Forma portuguesa clara e corrente para o topônimo hebraico Sukkot.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sequência narrativa foi mantida com formulação natural; 'Mas' explicita de modo leve o contraste contextual da recusa, embora o hebraico use a conjunção narrativa וַ. Todos os marcadores de nota aparecem no texto.
