base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: pt
  text: Zeba e Zalmuna estavam em Carcor, e seus acampamentos estavam com eles — cerca de quinze mil homens, todos os que restavam de todo o exército dos filhos do Oriente[a]. Os que haviam caído eram cento e vinte mil homens que empunhavam a espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de todo o exército dos povos do Oriente”. Hebraico: “dos filhos do Oriente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: em Carcor
  rationale: A preposição ב indica localização; “em Carcor” é a forma portuguesa natural para o topônimo.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: e seus acampamentos estavam com eles
  rationale: Mantém o plural de מַחֲנֵיהֶם e representa explicitamente עִמָּם, embora “exércitos” também seja possível no contexto militar.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: cerca de quinze mil homens
  rationale: O כ prefixado indica aproximação; “homens” é explicitado naturalmente a partir do contexto e do complemento posterior.
- source_word: כֹּל הַנּוֹתָרִים
  choice: todos os que restavam
  rationale: Expressa o particípio nifal de יתר como o grupo remanescente, sem perder seu aspecto resultativo.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: de todo o exército dos filhos do Oriente
  rationale: מַחֲנֶה é coletivo e, neste contexto, designa a força militar; “filhos do Oriente” preserva a expressão etnogeográfica hebraica.
- source_word: וְהַנֹּפְלִים
  choice: Os que haviam caído
  rationale: No contexto da batalha, o particípio designa os mortos; “haviam caído” conserva a imagem hebraica e a retrospectiva narrativa.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: cento e vinte mil
  rationale: Forma numérica corrente em português.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: homens que empunhavam a espada
  rationale: A expressão é um idioma militar para combatentes armados; “empunhavam a espada” mantém a imagem com naturalidade, sem sugerir necessariamente o ato momentâneo de desembainhar.
