  text: וַ/יֹּ֨אמֶר֙ לְ/יֶ֣תֶר בְּכוֹר֔/וֹ ק֖וּם הֲרֹ֣ג אוֹתָ֑/ם וְ/לֹא שָׁלַ֨ף הַ/נַּ֤עַר חַרְבּ/וֹ֙ כִּ֣י יָרֵ֔א כִּ֥י עוֹדֶ֖/נּוּ נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: pt
  text: 'Então Gideão disse a Jéter, seu primogênito: “Levante-se e mate-os.” Mas o jovem[a] não desembainhou a espada, porque estava com medo, pois ainda era jovem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rapaz” ou “menino”. O termo hebraico pode abranger desde a infância até o início da idade adulta. Aqui, “jovem” se ajusta ao fato de Jéter portar uma espada e receber a ordem de executar os prisioneiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Gideão disse
  rationale: O waw consecutivo faz a narrativa avançar. O sujeito implícito foi expresso como “Gideão” para dar clareza natural em português, conforme o contexto imediato.
- source_word: לְיֶתֶר
  choice: a Jéter
  rationale: O nome próprio foi transliterado e acentuado segundo a pronúncia natural em português.
- source_word: בְּכוֹרוֹ
  choice: seu primogênito
  rationale: Preserva a ideia específica de posição na ordem de nascimento, sem reduzi-la apenas a “filho mais velho”.
- source_word: קוּם
  choice: Levante-se
  rationale: Imperativo direto e corrente em português, adequado à ordem que antecede a execução.
- source_word: הֲרֹג אוֹתָם
  choice: mate-os
  rationale: הרג é o verbo comum para matar; a tradução é direta, sem eufemismo nem tom arcaico.
- source_word: וְלֹא שָׁלַף
  choice: Mas ... não desembainhou
  rationale: “Mas” comunica o contraste entre a ordem e a falta de ação; “desembainhou” expressa de modo natural o ato de tirar a espada da bainha.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נער pode designar um menino, rapaz ou jovem adulto. “Jovem” mantém essa amplitude e se ajusta ao fato de Jéter portar uma espada e ser considerado capaz de executar os prisioneiros.
- source_word: חַרְבּוֹ
  choice: a espada
  rationale: Em português, o artigo definido é natural quando a posse já está clara pelo sujeito; o referente continua sendo a espada de Jéter.
- source_word: כִּי יָרֵא
  choice: porque estava com medo
  rationale: A primeira ocorrência de כִּי introduz a causa de ele não desembainhar a espada; a formulação é natural e preserva o estado de temor.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: pois ainda era jovem
  rationale: A segunda ocorrência de כִּי acrescenta uma explicação, enquanto עוֹדֶנּוּ indica continuidade. A repetição de “jovem” preserva a repetição de נער no hebraico.
theological_decisions: []
