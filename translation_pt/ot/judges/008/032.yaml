  text: וַ/יָּ֛מָת גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ בְּ/שֵׂיבָ֣ה טוֹבָ֑ה וַ/יִּקָּבֵ֗ר בְּ/קֶ֨בֶר֙ יוֹאָ֣שׁ אָבִ֔י/ו בְּ/עָפְרָ֖ה אֲבִ֥י הָֽעֶזְרִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: pt
  text: Gideão, filho de Joás, morreu em boa velhice e foi sepultado no túmulo de seu pai Joás[a], em Ofra dos abiezritas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na sepultura de seu pai Joás”. O termo hebraico קֶבֶר pode designar uma sepultura, um túmulo ou um local de sepultamento.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Ofra do abiezrita”, isto é, Ofra pertencente ao clã de Abiezer.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O verbo מות significa diretamente “morrer”; a forma simples preserva a objetividade do hebraico.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideão, filho de Joás
  rationale: Emprega as formas portuguesas tradicionais dos nomes e torna explícita, com pontuação natural, a relação de filiação.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: em boa velhice
  rationale: Preserva tanto a referência à velhice quanto sua qualificação positiva, sem ampliar o sentido para “cheio de dias”.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Reproduz naturalmente em português o valor passivo do nifal de קבר.
- source_word: בְּקֶבֶר
  choice: no túmulo
  rationale: קֶבֶר pode indicar sepultura ou túmulo; “túmulo” funciona bem para um local de sepultamento familiar, mantendo a alternativa em nota.
- source_word: יוֹאָשׁ אָבִיו
  choice: de seu pai Joás
  rationale: Expressa de modo idiomático a identificação e posse do túmulo, embora reorganize a ordem hebraica “Joás, seu pai”.
- source_word: בְּעָפְרָה
  choice: em Ofra
  rationale: Usa a forma portuguesa corrente do topônimo.
- source_word: אֲבִי הָעֶזְרִי
  choice: dos abiezritas
  rationale: O gentílico singular hebraico associa Ofra ao clã abiezrita; o plural português comunica naturalmente essa referência coletiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A coordenação inicial do hebraico foi omitida por se tratar de um versículo apresentado isoladamente; a sequência narrativa permanece natural. Os marcadores foram posicionados junto aos termos que explicam.
