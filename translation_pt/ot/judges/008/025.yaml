translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi mantida de modo natural. A formulação evita atribuir ao povo uma disposição alegre não expressa lexicalmente e conserva, por meio de “argola” e da nota, a ambiguidade de נֶזֶם.
