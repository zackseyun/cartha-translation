base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: pt
  text: 'Eles responderam[a]: “Certamente daremos.” Então estenderam a capa[b], e cada homem lançou ali uma argola[c] do seu despojo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Daremos, certamente”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a capa”, ou “a veste”; ela foi estendida para receber as argolas.'
    reason: cultural_note
  - marker: c
    text: A palavra hebraica pode indicar uma argola usada na orelha ou no nariz; conforme o contexto, também se pode traduzir por “brinco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: Sim, nós os daremos
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a resposta. “Sim, nós os daremos” expressa em português natural a certeza enfática sem acrescentar explicitamente a ideia de alegria ou disposição; “os” retoma as argolas pedidas no versículo anterior.
- source_word: הַשִּׂמְלָה
  choice: a capa
  rationale: שִׂמְלָה designa uma peça de roupa, frequentemente uma veste exterior. “Capa” oferece uma imagem concreta e natural de uma peça estendida para recolher objetos.
- source_word: וַיִּפְרְשׂוּ
  choice: estenderam
  rationale: O verbo פרשׂ significa abrir, estender ou desdobrar; “estenderam” descreve naturalmente a ação feita com a capa.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: lançou ali
  rationale: שלך tem a força de lançar ou atirar, mais forte que simplesmente pôr, e שָׁמָּה significa “ali”. A tradução conserva ambos sem substituir “ali” pelo interpretativo “sobre ela”.
- source_word: אִישׁ
  choice: cada homem
  rationale: Aqui אִישׁ tem sentido distributivo. “Cada homem” preserva tanto essa distribuição quanto a forma masculina do hebraico.
- source_word: נֶזֶם
  choice: uma argola
  rationale: נֶזֶם pode indicar uma argola usada na orelha ou no nariz. “Argola” preserva essa ambiguidade lexical, enquanto a nota informa os usos possíveis.
- source_word: שְׁלָלוֹ
  choice: do seu despojo
  rationale: שָׁלָל é o despojo ou saque tomado na guerra. “Seu despojo” corresponde ao sufixo masculino singular e combina com o distributivo “cada homem”.
