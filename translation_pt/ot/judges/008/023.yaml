  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ גִּדְע֔וֹן לֹֽא אֶמְשֹׁ֤ל אֲנִי֙ בָּ/כֶ֔ם וְ/לֹֽא יִמְשֹׁ֥ל בְּנִ֖/י בָּ/כֶ֑ם יְהוָ֖ה יִמְשֹׁ֥ל בָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: pt
  text: 'Mas Gideão lhes disse[a]: “Eu não governarei sobre vocês, nem meu filho governará sobre vocês; Yahweh governará sobre vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Gideão lhes disse”. A conjunção hebraica pode ser traduzida pelo “e” narrativo, mas “Mas” destaca o contraste com o pedido do povo no versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: 'O waw consecutivo dá sequência à narrativa, mas o contexto é adversativo: Gideão rejeita o pedido feito no versículo anterior. “Mas” expressa esse contraste naturalmente.'
- source_word: אֲלֵהֶם
  choice: lhes
  rationale: Equivalente português natural para a preposição direcional com sufixo pronominal, isto é, “a eles”.
- source_word: גִּדְעוֹן
  choice: Gideão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: Eu não governarei sobre vocês
  rationale: מָשַׁל indica exercer governo ou domínio. “Governar sobre” preserva a ideia de autoridade política e permite repetir o mesmo verbo nas três declarações. O pronome explícito אֲנִי é representado por “Eu”.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: nem meu filho governará sobre vocês
  rationale: “Nem” coordena naturalmente a segunda negação em português e mantém o singular “meu filho”, preservando a referência à sucessão dinástica sem ampliá-la para “descendência”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: Yahweh governará sobre vocês
  rationale: A repetição de “governará sobre” conserva o contraste retórico do hebraico entre Gideão, seu filho e Yahweh.
theological_decisions:
- issue: A recusa de Gideão à autoridade semelhante à realeza
  choice: Gideão rejeita seu próprio governo e a sucessão de seu filho, atribuindo o governo a Yahweh.
  alternative: Gideão rejeita apenas o título formal de rei, embora continue exercendo governo de fato.
  rationale: O versículo repete מָשַׁל para Gideão, seu filho e Yahweh, sem empregar o termo “rei”. A tradução mantém esse contraste e não define além do texto a natureza exata da autoridade recusada.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural. A repetição de “governar sobre” é deliberada para preservar a estrutura e o contraste do hebraico.
