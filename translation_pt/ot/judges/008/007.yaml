  text: וַ/יֹּ֣אמֶר גִּדְע֔וֹן לָ/כֵ֗ן בְּ/תֵ֧ת יְהוָ֛ה אֶת זֶ֥בַח וְ/אֶת צַלְמֻנָּ֖ע בְּ/יָדִ֑/י וְ/דַשְׁתִּי֙ אֶת בְּשַׂרְ/כֶ֔ם אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: pt
  text: 'Gideão disse: “Por isso, quando Yahweh entregar Zeba e Zalmuna em minha mão, debulharei a carne de vocês com os espinhos do deserto e com espinheiros[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abrolhos”; não se sabe ao certo qual planta o termo hebraico designa.
    reason: Registra a incerteza botânica e uma alternativa lexical sem especificar indevidamente a espécie.
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Liga a ameaça de Gideão à recusa dos homens de Sucote no versículo anterior, preservando a força consequencial do hebraico.
- source_word: בְּתֵת
  choice: quando ... entregar
  rationale: A preposição ב com o infinitivo construto de נתן tem valor temporal neste contexto; esta formulação é natural em português e mantém a ação futura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: בְּיָדִי
  choice: em minhas mãos
  rationale: Mantém a imagem concreta do idioma hebraico de entregar alguém ao poder de outra pessoa, usando uma construção corrente em português.
- source_word: וְדַשְׁתִּי
  choice: debulharei
  rationale: Preserva a metáfora agrícola violenta do verbo דוש, “debulhar/malhar”, em vez de reduzi-la a um verbo genérico de punição.
- source_word: בְּשַׂרְכֶם
  choice: a carne de vocês
  rationale: Equivalente direto e vívido, que conserva a brutalidade explícita da ameaça.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: os espinhos do deserto
  rationale: Mantém tanto a vegetação espinhosa quanto a referência geográfica do texto hebraico.
- source_word: הַבַּרְקֳנִים
  choice: espinheiros
  rationale: Designa de modo natural uma vegetação espinhosa sem afirmar uma identificação botânica que o termo hebraico incerto não permite.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio e representa de maneira amplamente aceita sua provável vocalização.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Debulharei” conserva deliberadamente a metáfora agrícola incomum e violenta do original. O marcador da nota foi colocado junto a “espinheiros”, termo ao qual a nota lexical se refere.
