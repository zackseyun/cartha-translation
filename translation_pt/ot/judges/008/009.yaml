  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: pt
  text: 'Também disse aos homens de Penuel[a]: “Quando eu voltar em paz[b], derrubarei esta torre[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é “homens de Penuel” e provavelmente se refere aos líderes ou representantes masculinos da cidade, não necessariamente a todos os seus habitantes.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “em paz”; aqui, a expressão pode significar “em segurança” ou “vitorioso e ileso”.'
    reason: lexical_alternative
  - marker: c
    text: A “torre” talvez fosse uma fortaleza ou torre defensiva dentro de Penuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a ligação aditiva com a fala anterior de Gideão e soa natural em português.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: aos homens de Penuel
  rationale: Mantém o sentido concreto de אַנְשֵׁי; no contexto, provavelmente designa os homens que representavam ou lideravam a cidade.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: Quando eu voltar são e salvo
  rationale: O infinitivo com sufixo tem valor temporal, e בְשָׁלוֹם neste contexto militar indica provavelmente um retorno seguro e bem-sucedido. A formulação portuguesa comunica esse sentido sem sugerir necessariamente ausência de conflito.
- source_word: אֶתֹּץ
  choice: derrubarei
  rationale: O verbo נתץ descreve demolir ou pôr abaixo uma construção; “derrubarei” é claro, vigoroso e natural.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: esta torre
  rationale: מִגְדָּל significa normalmente “torre”; preserva-se o referente concreto, embora possa tratar-se de uma estrutura defensiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “São e salvo” explicita de modo idiomático o valor contextual de בְשָׁלוֹם, enquanto a nota preserva a forma literal e sua amplitude semântica.
