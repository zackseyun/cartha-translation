  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: pt
  text: 'Então Zeba e Zalmuna disseram: “Levante-se você mesmo e mate-nos, pois tal como é o homem, assim é a sua força”. Então Gideão se levantou, matou Zeba e Zalmuna e tomou os ornamentos em forma de meia-lua[a] que estavam no pescoço dos camelos deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os crescentes”, isto é, enfeites em forma de lua crescente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע
  choice: Então Zeba e Zalmuna disseram
  rationale: O verbo singular com sujeito composto é idiomático no hebraico; em português, o plural é natural. “Então” comunica a progressão narrativa do waw.
- source_word: קוּם אַתָּה
  choice: Levante-se você mesmo
  rationale: 'O pronome explícito torna a ordem enfática: eles pedem que o próprio Gideão execute a ação.'
- source_word: וּפְגַע בָּנוּ
  choice: e mate-nos
  rationale: Embora פגע possa significar encontrar, atacar ou golpear, o contexto imediato é o de uma execução, tornando explícito o sentido letal em português.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: pois tal como é o homem, assim é a sua força
  rationale: Preserva a forma proverbial, o paralelismo e a referência masculina do hebraico, sem reduzir a força a mero porte físico.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: Então Gideão se levantou
  rationale: Mantém a sequência narrativa e ecoa deliberadamente a ordem קוּם.
- source_word: וַיַּהֲרֹג
  choice: matou
  rationale: Equivalente moderno, direto e claro do verbo comum hebraico para matar.
- source_word: הַשַּׂהֲרֹנִים
  choice: os ornamentos em forma de meia-lua
  rationale: O substantivo designa objetos ornamentais em forma de crescente; a formulação evita que o leitor entenda literalmente corpos celestes.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: que estavam no pescoço dos camelos deles
  rationale: Reproduz com naturalidade a oração relativa e a localização dos ornamentos.
theological_decisions:
- issue: Expressão proverbial masculina כָאִישׁ
  choice: tal como é o homem, assim é a sua força
  alternative: a força de cada um corresponde ao que ele é
  rationale: O contexto se refere especificamente à capacidade de um guerreiro adulto em contraste com o jovem Jéter. A forma masculina e a tensão proverbial são preservadas, sem neutralização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “levantou-se” preserva o vínculo verbal entre a ordem dos reis e a resposta de Gideão; a formulação proverbial permanece deliberadamente próxima do hebraico.
