  text: וַ/יָּבֹ֥א גִדְע֖וֹן הַ/יַּרְדֵּ֑נָ/ה עֹבֵ֣ר ה֗וּא וּ/שְׁלֹשׁ מֵא֤וֹת הָ/אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ עֲיֵפִ֖ים וְ/רֹדְפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: pt
  text: Gideão chegou ao Jordão e o atravessou com os trezentos homens que estavam com ele, todos exaustos, mas ainda perseguindo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exaustos e ainda perseguindo”.'
    reason: A conjunção hebraica pode ser entendida simplesmente como aditiva (“e”) ou, pelo contraste contextual, como concessiva (“mas ainda”).
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: בוא, com um destino expresso, pode significar chegar. “Chegou” comunica com naturalidade o movimento narrativo até o Jordão.
- source_word: הַיַּרְדֵּנָה
  choice: ao Jordão
  rationale: O hê direcional indica movimento em direção ao Jordão. O nome do rio basta em português, sem necessidade de acrescentar “rio”.
- source_word: עֹבֵר הוּא
  choice: e o atravessou, ele
  rationale: O particípio עֹבֵר com o pronome הוּא apresenta Gideão em ação e dá relevo à sua participação. A formulação portuguesa conserva a travessia e introduz naturalmente o sujeito composto que segue.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: e os trezentos homens que estavam com ele
  rationale: A expressão identifica todo o grupo que atravessou com Gideão. “Homens” é adequado ao substantivo hebraico e ao contexto militar.
- source_word: עֲיֵפִים
  choice: exaustos
  rationale: O termo descreve cansaço físico intenso; “exaustos” é claro, atual e natural em português.
- source_word: וְרֹדְפִים
  choice: mas ainda perseguindo
  rationale: Embora וְ seja literalmente aditivo, o contexto contrapõe o esgotamento à continuação da perseguição. “Mas ainda” expressa essa relação concessiva sem ocultar a possibilidade de uma leitura simplesmente coordenada, registrada na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem mantém o destaque narrativo dado a Gideão e ao grupo, enquanto “mas ainda perseguindo” transmite de modo natural a tensão entre exaustão e perseverança.
