id: JDG.8.28
reference: Judges 8:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: pt
  text: Assim, Midiã foi subjugado diante dos filhos de Israel e não tornou a levantar a cabeça[a]. E a terra teve descanso durante quarenta anos, nos dias de Gideão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não voltou a recuperar as forças” ou “não tornou a erguer a cabeça”.
    reason: Alternativas que esclarecem o sentido possível da metáfora hebraica sem eliminar sua ambiguidade no texto principal.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: foi subjugado
  rationale: O nifal de כנע indica que Midiã foi colocado em sujeição; a forma passiva preserva o sentido e se ajusta ao contexto militar.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém a expressão hebraica de subjugação em relação a outro povo sem explicá-la em excesso.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a designação nacional hebraica de modo tradicional, claro e formalmente próximo da fonte.
- source_word: וְלֹא יָסְפוּ
  choice: não tornou a
  rationale: יסף seguido de infinitivo expressa repetição; a concordância no singular retoma Midiã como povo coletivo.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: levantar a cabeça
  rationale: Preserva a metáfora hebraica de recuperar força, confiança ou poder, sem restringir sua amplitude.
- source_word: וַתִּשְׁקֹט
  choice: teve descanso
  rationale: Em Juízes, o verbo resume um período de tranquilidade e ausência de conflito; esta formulação é clara e natural em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Conserva a referência coletiva à terra de Israel sem introduzir uma delimitação não expressa.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarenta anos
  rationale: Tradução direta da expressão numérica.
- source_word: בִּימֵי גִדְעוֹן
  choice: nos dias de Gideão
  rationale: Preserva a expressão temporal hebraica e não especifica além do texto se se trata exatamente de toda a vida de Gideão.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A forma escolhida preserva a expressão hebraica convencional e sua forma masculina, sem deixar de funcionar como designação nacional.
- issue: Preservação do idioma לָשֵׂאת רֹאשָׁם
  choice: levantar a cabeça
  alternative: recuperar as forças
  rationale: A metáfora concreta admite nuances de força, confiança e capacidade de resistência; mantê-la no texto evita resolver indevidamente essa amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o paralelismo narrativo e a metáfora hebraica; “durante” explicita naturalmente a extensão temporal de quarenta anos.
