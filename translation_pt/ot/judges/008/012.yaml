base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: pt
  text: Zeba e Zalmuna fugiram, e Gideão os perseguiu. Ele capturou os dois reis de Midiã, Zeba e Zalmuna, e pôs todo o acampamento em pânico.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aterrorizou todo o acampamento” ou “desbaratou todo o acampamento”. O verbo hebraico pode indicar causar tremor ou pânico e, neste contexto, pode ter implicações militares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: fugiram
  rationale: O qal de נוּס expressa fugir ou escapar; “fugiram” é direto, natural e mantém a força narrativa.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba e Zalmuna
  rationale: Os nomes próprios são transliterados em formas correntes e legíveis em português.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: Gideão os perseguiu
  rationale: רדף seguido de אחרי significa perseguir. O hebraico traz sujeito implícito; explicitar “Gideão” evita ambiguidade em português sem mudar o referente contextual.
- source_word: וַיִּלְכֹּד
  choice: capturou
  rationale: Em contexto militar, לכד indica capturar ou apoderar-se de alguém; “capturou” se ajusta à tomada dos reis.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: os dois reis de Midiã
  rationale: A formulação conserva de modo natural a relação construta do hebraico.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: Zeba e Zalmuna
  rationale: A repetição apositiva identifica os dois reis e é mantida por clareza e ênfase.
- source_word: וְכָל הַמַּחֲנֶה
  choice: todo o acampamento
  rationale: מַחֲנֶה pode designar o acampamento militar e, por extensão, as forças ali reunidas; a escolha preserva a imagem concreta.
- source_word: הֶחֱרִיד
  choice: pôs ... em pânico
  rationale: O hifil de חרד significa causar tremor, aterrorizar ou lançar em pânico. No contexto militar, a expressão comunica medo e desordem sem decidir de forma excessiva que houve uma derrota completa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação hebraica foi dividida em duas frases para fluidez. O sujeito “Gideão”, implícito no hebraico e claro no contexto, foi explicitado para impedir que o leitor tome Zeba e Zalmuna como sujeitos da perseguição. O marcador [a] aparece junto à expressão lexicalmente ambígua.
