  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם גִּדְע֗וֹן אֶשְׁאֲלָ֤ה מִ/כֶּם֙ שְׁאֵלָ֔ה וּ/תְנוּ לִ֕/י אִ֖ישׁ נֶ֣זֶם שְׁלָל֑/וֹ כִּֽי נִזְמֵ֤י זָהָב֙ לָ/הֶ֔ם כִּ֥י יִשְׁמְעֵאלִ֖ים הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: pt
  text: 'Então Gideão lhes disse: “Quero fazer um pedido a vocês: que cada homem me dê uma argola do seu despojo.” Pois os inimigos tinham argolas de ouro, porque eram ismaelitas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “brincos”. O termo hebraico pode indicar uma argola usada no nariz ou na orelha.'
    reason: Registra a ambiguidade lexical genuína de נֶזֶם, que o português normalmente obriga a especificar.
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: Quero fazer um pedido a vocês
  rationale: Reproduz em português natural a construção enfática com o verbo e o substantivo da mesma raiz, sem o artificialismo de “pedir um pedido”.
- source_word: אִישׁ
  choice: cada homem
  rationale: 'Mantém o sentido distributivo singular: cada combatente deveria entregar uma argola.'
- source_word: נֶזֶם
  choice: argola
  rationale: O termo pode designar argola usada no nariz ou na orelha; “argola” preserva essa indeterminação melhor que “brinco”.
- source_word: שְׁלָלוֹ
  choice: seu despojo
  rationale: Conserva o vocabulário militar e o sufixo possessivo singular do hebraico.
- source_word: לָהֶם
  choice: os inimigos tinham
  rationale: O pronome refere-se naturalmente aos derrotados de quem vieram os despojos; explicitar “os inimigos” evita em português a impressão de que se trata dos homens de Israel.
- source_word: יִשְׁמְעֵאלִים
  choice: ismaelitas
  rationale: Transliteração tradicional e reconhecível do gentílico hebraico.
theological_decisions:
- issue: Identidade dos ismaelitas em relação aos midianitas
  choice: Manter “ismaelitas” sem harmonização explicativa no texto
  alternative: Substituir por “midianitas” ou explicar que os termos são equivalentes
  rationale: O hebraico diz explicitamente “ismaelitas”; a tradução preserva a designação e a tensão histórica sem impor uma solução interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala é natural, enquanto “despojo” conserva o contexto militar. O referente de “tinham” foi explicitado como “os inimigos” para evitar ambiguidade pronominal indevida.
