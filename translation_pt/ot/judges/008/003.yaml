  source_fidelity: A tradução comunica corretamente que Deus deu aos efraimitas os dois chefes midianitas e que a resposta de Gideão apaziguou a hostilidade deles. Contudo, «O que eu pude fazer» reproduz melhor o valor de יכלתי («pude/fui capaz de fazer») do que «O que eu consegui fazer», que tende a deslocar o foco para o resultado obtido.
  naturalness: O texto é claro, moderno e adequado ao registro narrativo. «O ânimo deles contra ele se acalmou» é compreensível, mas «a hostilidade deles contra ele se acalmou» exprime com mais precisão, no português atual, o efeito contextual da expressão hebraica sem tornar a frase menos natural.
  terminology: '«Príncipes de Midiã» e «Orebe e Zeebe» são adequados. A nota deve ajustar a direção da imagem hebraica: não é propriamente um abrandamento «para com ele», mas o afrouxamento de uma atitude que estava contra/sobre ele.'
