base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: pt
  text: Deus entregou nas mãos de vocês os príncipes de Midiã, Orebe e Zeebe. O que eu pude fazer em comparação com vocês? Quando ele disse isso, a hostilidade deles contra ele se acalmou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “o espírito deles se abrandou de sobre ele”. O hebraico retrata a hostilidade deles como um espírito que perde a tensão dirigida contra alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: Deus entregou nas mãos de vocês
  rationale: A expressão hebraica com “mão” indica poder ou domínio. O plural “nas mãos de vocês” é a forma idiomática natural em português; “entregou” comunica que Deus lhes deu poder sobre os inimigos.
- source_word: שָׂרֵי מִדְיָן
  choice: os príncipes de Midiã
  rationale: שָׂרִים designa governantes, chefes ou comandantes. “Príncipes” preserva a posição elevada atribuída a Orebe e Zeebe sem especificar além do texto.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: Orebe e Zeebe
  rationale: Transliteração tradicional e reconhecível em português dos nomes hebraicos.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: O que eu consegui fazer em comparação com vocês?
  rationale: 'A pergunta é comparativa e autodepreciativa: Gideão apresenta sua própria realização como inferior à dos efraimitas. A formulação mantém esse sentido em português natural.'
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: o ânimo deles contra ele se acalmou
  rationale: A construção hebraica diz literalmente que o “espírito” deles afrouxou ou perdeu a tensão de sobre Gideão. “Ânimo” preserva parte da imagem, enquanto “contra ele se acalmou” comunica a diminuição da hostilidade.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: Quando ele disse isso
  rationale: A construção indica a ocasião em que a hostilidade diminuiu. “Disse isso” traduz דָבָר de maneira corrente e evita o pouco natural “falou esta palavra”.
