base_translation:
  language: en
  yaml_path: translation/ot/judges/008/013.yaml
  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: pt
  text: Então Gideão, filho de Joás, voltou da batalha pela subida de Heres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «da subida do sol». A expressão hebraica é difícil, e הֶחָרֶס pode ser entendida como um nome de lugar («Heres») ou como «o sol».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Então ... voltou
  rationale: O wayyiqtol de שׁוב dá continuidade à narrativa. “Voltou” expressa o sentido básico, e “Então” marca com naturalidade a progressão narrativa em português.
- source_word: גִּדְעוֹן
  choice: Gideão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן יוֹאָשׁ
  choice: filho de Joás
  rationale: Reprodução direta e natural do patronímico hebraico em aposição.
- source_word: מִן הַמִּלְחָמָה
  choice: da batalha
  rationale: מִלְחָמָה pode significar “batalha” ou “guerra”; aqui o contexto imediato aponta para o confronto militar específico.
- source_word: מִלְמַעֲלֵה
  choice: pela subida de
  rationale: A expressão provavelmente indica a rota pela qual Gideão voltou. “Pela subida de” preserva o sentido topográfico sem definir em excesso a relação direcional.
- source_word: הֶחָרֶס
  choice: Heres
  rationale: A forma pode designar um lugar, tradicionalmente transliterado como nome próprio. A possível interpretação lexical como “o sol” é preservada em nota.
