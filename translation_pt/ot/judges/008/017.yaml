lexical_decisions:
- source_word: מִגְדַּל
  choice: torre
  rationale: O substantivo designa normalmente uma torre ou estrutura fortificada elevada; “torre” é a tradução mais direta e natural no contexto.
- source_word: פְּנוּאֵל
  choice: Penuel
  rationale: A transliteração “Penuel” representa a forma consonantal do texto hebraico e é corrente em português; a forma tradicional alternativa “Peniel” é preservada em nota.
- source_word: נָתָץ
  choice: derrubou
  rationale: O verbo significa pôr abaixo ou demolir uma estrutura. “Derrubou” é claro, atual e mantém a força da ação.
- source_word: וַיַּהֲרֹג
  choice: matou
  rationale: O verbo הרג significa diretamente matar; “matou” é simples, preciso e não acrescenta imagens ausentes do hebraico.
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: A expressão significa literalmente “os homens da cidade”. No contexto punitivo e militar, convém conservar a referência masculina em vez de generalizá-la como “habitantes” ou “povo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção direta. A coordenação das duas ações reproduz a concisão narrativa do hebraico.
