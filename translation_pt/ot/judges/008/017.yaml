base_translation:
  language: en
  yaml_path: translation/ot/judges/008/017.yaml
  text: He tore down the tower of Penuel and killed the men of the city[a].
translation:
  language: pt
  text: Ele derrubou a torre de Penuel[a] e matou os homens da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Penuel: tradicionalmente também grafado «Peniel».'
