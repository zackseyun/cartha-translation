base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: pt
  text: 'Ele capturou um jovem dentre os homens de Sucote e fez-lhe perguntas. O jovem escreveu para ele os nomes das autoridades[a] e dos anciãos de Sucote: setenta e sete homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líderes” ou “chefes”; o termo hebraico pode designar autoridades, chefes ou governantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: capturou
  rationale: O verbo לכד indica capturar ou tomar. “Capturou” se ajusta ao contexto militar sem especificar indevidamente como ocorreu a detenção.
- source_word: נַעַר
  choice: um jovem
  rationale: נַעַר pode designar menino, jovem ou servo. Aqui, a pessoa pertence aos homens de Sucote e consegue fornecer informações sobre as autoridades locais; “um jovem” preserva melhor essa amplitude contextual.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: dentre os homens de Sucote
  rationale: A preposição מן indica que o jovem foi tomado de dentro desse grupo. “Dentre” expressa com clareza sua pertença à população masculina da cidade.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: fez-lhe perguntas
  rationale: שׁאל significa perguntar ou indagar. A formulação comunica uma busca deliberada de informações sem as conotações mais fortes que “interrogou” pode ter no uso moderno.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: O jovem escreveu para ele
  rationale: Pelo contexto e pela sequência verbal, o jovem capturado é o sujeito que escreve, enquanto Gideão é o destinatário. A repetição de “o jovem” evita ambiguidade em português.
- source_word: שָׂרֵי סֻכּוֹת
  choice: as autoridades de Sucote
  rationale: שָׂרִים pode indicar governantes, chefes, líderes ou autoridades. “Autoridades” é adequado ao contexto cívico e não sugere necessariamente nobreza hereditária.
- source_word: זְקֵנֶיהָ
  choice: os anciãos de Sucote
  rationale: O sufixo feminino singular remete à cidade de Sucote. Repetir o nome da cidade é mais claro e natural em português do que usar um possessivo potencialmente ambíguo.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: setenta e sete homens
  rationale: A expressão numérica significa diretamente “setenta e sete”, e אִישׁ explicita que se trata de homens, provavelmente os dirigentes cívicos enumerados.
- source_word: אֶת שָׂרֵי ... וְאֶת זְקֵנֶיהָ
  choice: os nomes das autoridades e dos anciãos
  rationale: O objeto literal são as próprias autoridades e os anciãos, mas, com o verbo “escrever”, o sentido idiomático é registrar por escrito seus nomes ou sua relação. “Os nomes” explicita apenas essa informação implícita necessária em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente explicitada para indicar que o jovem escreveu a lista para Gideão, sem acrescentar detalhes sobre o modo da captura ou das perguntas.
