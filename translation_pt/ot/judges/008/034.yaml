id: JDG.8.34
reference: Judges 8:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: pt
  text: E os filhos de Israel[a] não se lembraram de Yahweh, seu Deus, que os havia livrado da mão de todos os seus inimigos ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: E ... não
  rationale: Dá continuidade ao fluxo narrativo, preservando de modo natural a sequência marcada pela conjunção hebraica.
- source_word: זָכְרוּ
  choice: se lembraram
  rationale: Mantém o sentido amplo de זכר, que no contexto pode envolver não apenas recordação mental, mas reconhecimento e lealdade prática.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma concreta e gramaticalmente masculina da expressão hebraica; a alternativa coletiva mais idiomática é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Com Yahweh como referente, אֱלֹהִים tem valor singular; o possessivo exprime a relação de Israel com seu Deus.
- source_word: הַמַּצִּיל
  choice: que os havia livrado
  rationale: A oração relativa traduz naturalmente o particípio definido e o mais-que-perfeito situa a ação salvadora antes do esquecimento narrado.
- source_word: מִיַּד
  choice: da mão de
  rationale: Conserva a imagem hebraica da mão como poder ou domínio, ainda compreensível em português.
- source_word: כָּל אֹיְבֵיהֶם
  choice: todos os seus inimigos
  rationale: Reproduz diretamente a abrangência total da expressão hebraica.
- source_word: מִסָּבִיב
  choice: ao redor
  rationale: Indica que os inimigos os cercavam por todos os lados, em formulação corrente e concisa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; usar “Yahweh” preserva o nome pessoal e pactual, sem substituí-lo por um título.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal conserva a forma masculina concreta do hebraico, enquanto a nota oferece a equivalência coletiva idiomática sem apagar a forma da fonte.
- issue: Valor temporal de הַמַּצִּיל
  choice: que os havia livrado
  alternative: que os livrava; aquele que os livrou
  rationale: O particípio caracteriza Yahweh por sua ação salvadora. O mais-que-perfeito explicita naturalmente em português que esse livramento antecedeu a falta de memória, sem restringir a identidade contínua de Yahweh como libertador.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi ajustada apenas o necessário para a fluência; preservaram-se o nome divino, a imagem da “mão” e a tensão entre recordação mental e fidelidade pactual.
