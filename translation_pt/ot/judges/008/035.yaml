  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: pt
  text: E não demonstraram bondade para com a casa de Jerubaal (isto é, Gideão), em conformidade com todo o bem que ele havia feito a Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: bondade
  rationale: No contexto, descreve a lealdade benevolente que Israel deixou de demonstrar à família de Gideão; “bondade” é natural e mantém a amplitude do termo hebraico.
- source_word: בֵּית
  choice: casa
  rationale: Aqui significa a família ou linhagem de Jerubaal; preserva-se a imagem hebraica, facilmente compreensível em português.
- source_word: כְּכָל הַטּוֹבָה
  choice: em retribuição por todo o bem
  rationale: 'A preposição כְּ expressa correspondência: a conduta de Israel não correspondeu aos benefícios recebidos. “Em retribuição por” torna clara essa relação sem sugerir pagamento estrito.'
theological_decisions:
- issue: Relação entre Jerubaal e Gideão
  choice: Jerubaal (isto é, Gideão)
  alternative: Jerubaal-Gideão
  rationale: Os dois nomes designam a mesma pessoa. A explicitação parentética evita que leitores entendam tratar-se de duas pessoas, sem acrescentar interpretação doutrinária.
- issue: Natureza da obrigação de Israel
  choice: em retribuição por todo o bem
  alternative: de acordo com todo o bem
  rationale: A formulação comunica a falta de resposta leal aos atos de Gideão, preservando o juízo moral do texto sem transformar a relação em uma dívida jurídica ou meritória.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Demonstraram bondade para com” conserva o tom narrativo e moral; “havia feito” situa naturalmente os benefícios de Gideão antes da ingratidão relatada.
