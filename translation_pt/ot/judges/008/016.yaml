  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: pt
  text: Então ele pegou os anciãos da cidade, bem como espinhos do deserto e plantas espinhosas, e com eles castigou[a] os homens de Sucote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ensinou uma lição aos”. A expressão hebraica é difícil e significa literalmente algo como “fez conhecer”; neste contexto, descreve um tratamento punitivo com espinhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: os anciãos da cidade
  rationale: Preserva o título sociopolítico literal e tradicional, que neste contexto designa os dirigentes cívicos de Sucote.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: espinhos do deserto
  rationale: Reproduz de forma concreta a referência a espinhos ou plantas espinhosas provenientes da região desértica.
- source_word: הַבַּרְקֳנִים
  choice: plantas espinhosas
  rationale: O substantivo designa uma planta que espeta, mas sua identificação botânica exata é incerta; a expressão evita uma precisão indevida e distingue o termo do anterior.
- source_word: וַיֹּדַע בָּהֶם
  choice: e com eles castigou
  rationale: Embora a forma de ידע normalmente signifique fazer conhecer ou ensinar, aqui os instrumentos e o contexto indicam uma ação punitiva. 'Castigou' comunica naturalmente essa força sem adotar a imagem textual menos segura de debulhar.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: os homens de Sucote
  rationale: Mantém o valor masculino plural explícito de אַנְשֵׁי e a forma portuguesa corrente do topônimo.
