translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A coordenação foi explicitada por “bem como” para evitar que os anciãos pareçam ser objetos do mesmo tipo que os espinhos. A nota conserva a dificuldade lexical do hebraico sem atenuar o caráter punitivo da cena.
