  text: וַ/יֹּ֗אמֶר אֶל זֶ֨בַח֙ וְ/אֶל צַלְמֻנָּ֔ע אֵיפֹה֙ הָ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הֲרַגְתֶּ֖ם בְּ/תָב֑וֹר וַֽ/יֹּאמרוּ֙ כָּמ֣וֹ/ךָ כְמוֹ/הֶ֔ם אֶחָ֕ד כְּ/תֹ֖אַר בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: pt
  text: 'Então Gideão disse a Zeba e Zalmuna: “Onde estão os homens que vocês mataram em Tabor?[a]” Eles responderam: “Eles eram como você; cada um tinha a aparência de um filho de rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tabor se refere ao monte Tabor.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיפֹה
  choice: Como eram
  rationale: Embora אֵיפֹה normalmente signifique “onde?”, a resposta descreve a aparência dos homens, e a sequência preservada parece refletir uma expressão elíptica ou uma dificuldade textual. Em português, “Como eram” torna coerente o diálogo sem alterar o conteúdo da resposta; a dificuldade é registrada nas decisões teológicas/textuais.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O contexto trata de vítimas masculinas identificáveis, comparadas diretamente a Gideão.
- source_word: הֲרַגְתֶּם
  choice: vocês mataram
  rationale: Traduz o sentido básico de הרג sem acrescentar uma qualificação jurídica como “assassinaram”.
- source_word: בְּתָבוֹר
  choice: em Tabor
  rationale: Expressão natural em português para indicar o local; a nota esclarece que se trata do monte Tabor.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: Eram como você
  rationale: A comparação hebraica é elíptica. A formulação portuguesa expressa naturalmente a semelhança dos homens com Gideão.
- source_word: אֶחָד
  choice: cada um
  rationale: O numeral tem valor distributivo neste contexto, referindo-se individualmente a todos os homens.
- source_word: כְּתֹאַר
  choice: tinha a aparência de
  rationale: תֹּאַר designa forma ou aparência externa; esta formulação é clara e digna em português moderno.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: um filho de rei
  rationale: Preserva a imagem hebraica de ascendência e aparência régias sem substituí-la pelo termo interpretativo “príncipe”.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: perguntou ... responderam
  rationale: No diálogo, os verbos genéricos “disse/disseram” funcionam pragmaticamente como pergunta e resposta; a tradução explicita essa função com naturalidade.
theological_decisions:
- issue: Relação entre a pergunta אֵיפֹה (“onde?”) e a resposta sobre aparência
  choice: 'Traduzir a pergunta segundo o sentido contextual: “Como eram os homens...?”'
  alternative: “Onde estão os homens que vocês mataram em Tabor?”
  rationale: O texto massorético traz literalmente “onde?”, mas os homens já foram mortos e a resposta imediata descreve como eles eram. A tradução contextual evita uma pergunta incoerente, ao mesmo tempo que reconhece explicitamente a dificuldade textual nesta documentação.
translation_notes:
  register: Português moderno, natural e digno, com formas amplamente compreensíveis no Brasil e internacionalmente. O sujeito “Gideão” foi explicitado para dar clareza ao trecho isolado. A fala mantém a imagem concreta “filho de rei” e evita o termo mais interpretativo “príncipe”.
