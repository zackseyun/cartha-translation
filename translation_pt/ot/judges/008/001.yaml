  naturalness: O registro é moderno e claro. A formulação revista melhora a idiomaticidade e a clareza sem perder a concisão do hebraico. A posição do marcador b junto ao termo que ele esclarece também é mais precisa.
  terminology: “Homens de Efraim”, “Midiã” e “contenderam” são adequados. “Contenderam com ele com veemência” mantém a força de וַיְרִיבוּן אִתּוֹ בְּחָזְקָה sem reduzir o episódio a uma conversa casual.
