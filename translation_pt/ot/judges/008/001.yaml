base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: pt
  text: 'Então os homens de Efraim[a] lhe disseram: “O que é isso que você nos fez, sem nos chamar quando foi lutar contra Midiã?” E contenderam com ele com veemência[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os efraimitas”. O hebraico diz literalmente “os homens de Efraim”, expressão coletiva que se refere à tribo.
    reason: lexical_alternative
  - marker: b
    text: Ou “discutiram duramente com ele” ou “brigaram asperamente com ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: os homens de Efraim
  rationale: Embora אִישׁ esteja no singular morfológico, a expressão é coletiva, como confirmam os verbos no plural. A tradução preserva de modo transparente o idioma hebraico.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: O que é isso
  rationale: Expressão natural em português que mantém o caráter retórico e concreto da pergunta, sem reduzi-la simplesmente a “Por que você fez isso?”
- source_word: עָשִׂיתָ לָּנוּ
  choice: você fez conosco
  rationale: “Conosco” representa o dativo hebraico de maneira idiomática e evita explicitar “contra nós”, embora a queixa implique ofensa.
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: não nos chamando
  rationale: Mantém a construção infinitiva e o sentido básico de קרא, sem intensificá-lo para “convocar”.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: quando foi lutar contra Midiã
  rationale: Entende כִּי em sentido temporal ou explicativo no contexto da queixa e expressa o valor adversativo de בְּ com o verbo “lutar”.
- source_word: וַיְרִיבוּן אִתּוֹ
  choice: discutiram com ele
  rationale: ריב indica disputa ou contenda. “Discutiram” é atual e compreensível, sem impor caráter judicial ao confronto.
- source_word: בְּחָזְקָה
  choice: duramente
  rationale: A expressão preposicional funciona como advérbio de intensidade. “Duramente” comunica a veemência do confronto em português digno e natural.
