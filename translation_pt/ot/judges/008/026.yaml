  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: pt
  text: O peso dos anéis de ouro[b] que ele pediu foi de mil e setecentos siclos de ouro[a], além dos ornamentos em forma de crescente, dos pingentes, das vestes de púrpura usadas pelos reis de Midiã e dos colares que estavam nos pescoços dos camelos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “mil e setecentos de ouro”; “siclos” foi acrescentado como a unidade de peso subentendida no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “brincos”. O termo hebraico pode designar um anel usado na orelha ou no nariz.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: O peso
  rationale: O substantivo indica peso medido, e não apenas quantidade; esta é a equivalência natural no contexto de metais preciosos.
- source_word: נִזְמֵי הַזָּהָב
  choice: dos anéis de ouro
  rationale: נזם pode designar um anel usado na orelha ou no nariz. “Anéis” preserva essa generalidade sem especificar um local que o hebraico não explicita aqui.
- source_word: אֲשֶׁר שָׁאָל
  choice: que ele pediu
  rationale: Retoma naturalmente o pedido feito por Gideão no contexto imediato e mantém o sentido simples do verbo.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: mil e setecentos siclos
  rationale: O hebraico diz literalmente “mil e setecentos de ouro”; “siclos” explicita a unidade de peso subentendida, enquanto a nota preserva a forma literal.
- source_word: לְבַד מִן
  choice: além de
  rationale: A expressão exclui os objetos seguintes do total de peso anteriormente declarado.
- source_word: הַשַּׂהֲרֹנִים
  choice: os ornamentos em forma de meia-lua
  rationale: O termo designa ornamentos com formato de crescente; a formulação é clara para leitores modernos.
- source_word: הַנְּטִפוֹת
  choice: os pingentes
  rationale: O substantivo provavelmente se refere a adornos pendentes; “pingentes” é uma tradução geral e natural.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: as vestes de púrpura
  rationale: Expressa roupas feitas ou tingidas de púrpura, associadas aqui à condição régia.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: usadas pelos reis de Midiã
  rationale: Com vestes, על indica aquilo que estava sobre os reis, isto é, que eles vestiam; a formulação portuguesa transmite a imagem de maneira natural.
- source_word: הָעֲנָקוֹת
  choice: os colares
  rationale: O termo denota adornos para o pescoço; “colares” é claro e adequado, inclusive para os camelos mencionados em seguida.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: que estavam no pescoço dos camelos deles
  rationale: Traduz diretamente a localização dos adornos e mantém claro que os camelos pertenciam aos reis de Midiã.
