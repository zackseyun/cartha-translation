base_translation:
  language: en
  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: pt
  text: E sua concubina, que estava em Siquém, também lhe deu um filho, e ele lhe deu o nome de Abimeleque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: E sua concubina
  rationale: פִּילֶגֶשׁ designa uma concubina; o equivalente direto preserva a distinção de condição social sem introduzir a ideia moderna de amante. O וּ inicial é traduzido por “E”.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: que estava em Siquém
  rationale: A oração relativa identifica a concubina por sua localização. “Estava em” mantém a formulação do hebraico sem acrescentar que ela necessariamente residia ali.
- source_word: יָלְדָה לּוֹ
  choice: lhe deu um filho
  rationale: A expressão hebraica indica que ela lhe gerou/deu à luz um filho. Esta formulação é natural em português e preserva o objeto indireto לּוֹ.
- source_word: גַם הִיא
  choice: também
  rationale: גַם הִיא assinala que ela, assim como as mulheres mencionadas no contexto, igualmente lhe deu um filho.
- source_word: בֵּן
  choice: um filho
  rationale: O substantivo é indefinido no contexto e pede o artigo indefinido em português.
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: e ele lhe deu o nome de
  rationale: O idiomatismo hebraico, literalmente “pôs o nome dele”, significa atribuir um nome; a expressão escolhida é clara, natural e não torna explícito quem escolheu o nome além do sujeito masculino indicado pelo verbo.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: “Abimeleque” é a forma portuguesa tradicional e reconhecível do nome hebraico אֲבִימֶלֶךְ, adaptada à ortografia e à pronúncia do português.
