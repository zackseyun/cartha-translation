base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: pt
  text: 'Então os homens de Israel disseram a Gideão: “Governe sobre nós — tanto você como seu filho e o filho de seu filho[a] —, pois você nos salvou da mão de Midiã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “também você, também seu filho, também o filho de seu filho”. O hebraico nomeia explicitamente as gerações sucessivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Embora אִישׁ esteja formalmente no singular, o verbo plural mostra uso coletivo. A expressão preserva a referência masculina e coletiva.
- source_word: מְשָׁל בָּנוּ
  choice: Governe sobre nós
  rationale: O imperativo de משל pede exercício de governo ou domínio político. “Governe” é direto, atual e não introduz o título posterior de rei.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: tanto você como seu filho e o filho de seu filho
  rationale: A formulação conserva as gerações sucessivas explicitamente nomeadas no hebraico e comunica a proposta de sucessão hereditária.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada pelos homens de Israel e mantém um tom digno e natural.
- source_word: הוֹשַׁעְתָּנוּ
  choice: você nos salvou
  rationale: Preserva o sentido de ישׁע e sua ligação lexical com a linguagem bíblica de salvação, sem negar o contexto militar imediato.
- source_word: מִיַּד מִדְיָן
  choice: das mãos de Midiã
  rationale: Mantém a imagem hebraica da mão como poder ou controle; o plural é idiomático em português nessa expressão.
theological_decisions:
- issue: Natureza do governo solicitado a Gideão
  choice: 'Apresentar o pedido como governo político dinástico: “tanto você como seu filho e o filho de seu filho”.'
  alternative: Entender o pedido apenas como liderança geral, sem sucessão hereditária.
  rationale: O imperativo משל, junto com a enumeração explícita de três gerações, indica governo continuado por sucessão. Evita-se, porém, inserir o título “rei”, ausente neste versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Você” corresponde ao pronome enfático singular אַתָּה e mantém clareza; “filho de seu filho” conserva a forma explícita do hebraico. A pontuação destaca a proposta de sucessão sem acrescentar terminologia monárquica.
