base_translation:
  language: en
  yaml_path: translation/ot/judges/008/029.yaml
  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: pt
  text: Então Jerubaal, filho de Joás, foi morar em sua casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi e passou a morar em sua casa” ou “foi e habitou em sua casa”. O verbo hebraico pode indicar habitar ou estabelecer-se, e não apenas sentar-se fisicamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: No encadeamento narrativo, הלך indica naturalmente que ele foi; traduzir por “voltou” especificaria uma direção que o verbo não expressa por si só.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: O texto hebraico emprega este nome pessoal; por isso, ele é transliterado, sem ser substituído pelo nome alternativo mais conhecido, Gideão.
- source_word: בֶּן יוֹאָשׁ
  choice: filho de Joás
  rationale: Tradução direta e natural da construção filial hebraica.
- source_word: וַיֵּשֶׁב
  choice: morar
  rationale: ישב pode significar sentar-se, habitar, permanecer ou estabelecer-se. Com “em sua casa”, o sentido é residencial; “morar” comunica isso de modo claro e atual.
- source_word: בְּבֵיתוֹ
  choice: em sua casa
  rationale: Preserva explicitamente a preposição, o substantivo “casa” e o sufixo possessivo masculino singular do hebraico.
- source_word: וַ...וַ
  choice: Então ... foi morar
  rationale: “Então” sinaliza o avanço narrativo dos verbos com waw consecutivo, enquanto “foi morar” expressa em português natural a sequência verbal hebraica.
