  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: pt
  text: 'Eles lhe disseram: “Fique calado[a], ponha a mão sobre a sua boca e venha conosco. Seja para nós pai[b] e sacerdote. O que é melhor para você: ser sacerdote da casa de um só homem ou ser sacerdote de uma tribo e de um clã[c] em Israel?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “Cale-se” ou “Fique em silêncio”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “pai” é um título de liderança social ou religiosa, não uma relação biológica.
    reason: cultural_note
  - marker: c
    text: Ou “família”; o termo hebraico designa aqui um grupo de parentesco dentro de uma tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: Fique calado
  rationale: O imperativo de חרשׁ exige silêncio. “Fique calado” é natural em português atual e preserva a força direta da ordem; “cale-se” seria possível, mas pode soar mais ríspido.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: ponha a mão sobre a boca
  rationale: Mantém a imagem física e o gesto idiomático de silêncio ou contenção presentes no hebraico.
- source_word: וְלֵךְ עִמָּנוּ
  choice: e venha conosco
  rationale: Embora o verbo hebraico seja literalmente “ir”, em português a orientação deítica natural de quem convida alguém a juntar-se ao grupo é “venha conosco”.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: Seja para nós pai e sacerdote
  rationale: Preserva os dois títulos e a construção relacional do hebraico sem reduzir “pai” a uma função interpretada.
- source_word: לְאָב
  choice: pai
  rationale: A tradução literal conserva o título social ou religioso culturalmente carregado e evita restringi-lo a “conselheiro”, “patrono” ou “líder”.
- source_word: כֹהֵן
  choice: sacerdote
  rationale: Equivalente português padrão e contextualmente direto de כֹהֵן.
- source_word: הֲטוֹב
  choice: O que é melhor para você
  rationale: A pergunta introduz uma comparação entre duas possibilidades; “melhor” expressa naturalmente o valor comparativo implícito.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: da casa de um só homem
  rationale: “Casa” preserva o sentido hebraico de casa ou unidade doméstica, e “um só homem” ressalta o contraste com o grupo tribal maior.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: de uma tribo e de um clã em Israel
  rationale: “Tribo” traduz שֵׁבֶט, enquanto “clã” comunica מִשְׁפָּחָה como grupo de parentesco dentro da organização tribal, sem achatá-lo para a família nuclear moderna.
theological_decisions:
- issue: Sentido de “pai” como título
  choice: Manter o título literal “pai”.
  alternative: conselheiro, patrono ou líder
  rationale: O texto associa “pai” a “sacerdote”, mas não define com precisão a função implícita. A tradução literal preserva a tensão cultural e evita importar uma estrutura institucional ou doutrinária específica.
- issue: Identidade do grupo designado por מִשְׁפָּחָה
  choice: Traduzir como “clã”, distinguindo-o de “tribo”.
  alternative: família
  rationale: “Clã” preserva melhor a escala coletiva e o contraste entre a casa de um indivíduo e um grupo de parentesco pertencente a Israel, sem excluir que o termo também possa ser vertido por “família” em sentido amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala permanece direta e persuasiva. Foram preservados “pai”, “sacerdote”, “casa”, “tribo” e “clã” para manter a estrutura social e religiosa do original, recorrendo a notas apenas onde a leitura moderna poderia reduzir indevidamente o sentido.
