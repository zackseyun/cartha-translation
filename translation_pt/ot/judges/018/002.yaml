  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: pt
  text: 'Então os filhos de Dã enviaram, dentre todo o seu clã, cinco homens capazes[a], de Zorá e Estaol, para espionar a terra e examiná-la[b]. Disseram-lhes: “Vão examinar a terra.” Eles chegaram à região montanhosa de Efraim, até a casa de Mica[c], e passaram ali a noite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens valentes” ou “homens de valor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “investigá-la”; também na ordem seguinte.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, “a casa de Mica”; a expressão também pode abranger o conjunto residencial ou a casa familiar de Mica.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a expressão tribal e familiar hebraica sem perder clareza em português.
- source_word: מִמִּשְׁפַּחְתָּם
  choice: do seu clã
  rationale: מִשְׁפָּחָה designa aqui um grupo de parentesco dentro da tribo; “clã” evita tanto o sentido moderno restrito de “família” quanto o sentido amplo demais de “tribo”.
- source_word: מִקְצוֹתָם
  choice: dentre todos eles
  rationale: 'Expressa o valor partitivo do idioma hebraico: os cinco foram tirados do conjunto dos danitas, sem reproduzir literalmente a imagem obscura de “extremidades”.'
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: homens capazes
  rationale: No contexto de uma missão de reconhecimento, a expressão indica homens de força, competência ou valor. “Capazes” comunica sua aptidão sem restringir a expressão a bravura militar.
- source_word: לְרַגֵּל
  choice: para espionar
  rationale: O verbo indica reconhecimento intencional do território, muitas vezes com a nuance de espionagem.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: examiná-la / examinar a terra
  rationale: Mantém a repetição da raiz חקר e seu sentido de investigar ou observar cuidadosamente.
- source_word: הַר אֶפְרַיִם
  choice: região montanhosa de Efraim
  rationale: A expressão geográfica se refere às terras altas de Efraim, não a um único monte.
- source_word: עַד בֵּית מִיכָה
  choice: até a casa de Mica
  rationale: Preserva tanto o valor direcional de עַד quanto a forma concreta “casa de Mica”.
- source_word: וַיָּלִינוּ שָׁם
  choice: passaram ali a noite
  rationale: Tradução natural do verbo que significa alojar-se ou permanecer durante a noite.
