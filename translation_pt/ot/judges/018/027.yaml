  source_fidelity: 'A tradução reproduz adequadamente a progressão do hebraico: a tomada dos bens feitos por Mica e do sacerdote ligado a ele, o avanço hostil contra Laís, a caracterização do povo como tranquilo e seguro, o golpe ao fio da espada e a queima da cidade. “Seus habitantes” explicita de modo natural o referente de “os”, isto é, o povo de Laís, sem transformar o verbo amplo “feriram” em uma afirmação mais específica de morte.'
