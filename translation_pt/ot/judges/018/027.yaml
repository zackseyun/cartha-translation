  terminology: “Mica” e “Laís” são formas portuguesas adequadas. “Sacerdote que estava a serviço dele” comunica de maneira idiomática sua vinculação a Mica, sem a conotação inadequada de propriedade pessoal. A nota explica corretamente o idiomatismo hebraico “à boca da espada” e sua equivalência portuguesa.
