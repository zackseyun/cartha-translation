  text: וְ/הֵ֨מָּה לָקְח֜וּ אֵ֧ת אֲשֶׁר עָשָׂ֣ה מִיכָ֗ה וְֽ/אֶת הַ/כֹּהֵן֮ אֲשֶׁ֣ר הָיָה ל/וֹ֒ וַ/יָּבֹ֣אוּ עַל לַ֗יִשׁ עַל עַם֙ שֹׁקֵ֣ט וּ/בֹטֵ֔חַ וַ/יַּכּ֥וּ אוֹתָ֖/ם לְ/פִי חָ֑רֶב וְ/אֶת הָ/עִ֖יר שָׂרְפ֥וּ בָ/אֵֽשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: pt
  text: Assim, eles levaram o que Mica havia feito, junto com o sacerdote que estava a serviço dele, e avançaram contra Laís, contra um povo tranquilo e seguro. Feriram seus habitantes ao fio da espada[a] e incendiaram a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “à boca da espada”, expressão que significa “ao fio da espada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: Assim, eles levaram
  rationale: “Assim” expressa a continuidade narrativa, e o pronome explícito preserva a ênfase no sujeito. “Levaram” é natural em português para os objetos e o sacerdote retirados do lugar.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: o que Mica havia feito
  rationale: Reproduz naturalmente a construção relativa e remete aos objetos de culto mencionados no contexto sem acrescentar uma identificação ausente nesta frase.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: junto com o sacerdote que estava a serviço dele
  rationale: היה לו indica a relação do sacerdote com Mica. “Estava a serviço dele” comunica essa vinculação sem sugerir que o sacerdote fosse propriedade pessoal.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: avançaram contra Laís
  rationale: No contexto militar, בוא על exprime movimento hostil. “Avançaram contra” preserva tanto o deslocamento quanto a hostilidade, sem fundir a oração com o ataque subsequente.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: contra um povo tranquilo e seguro
  rationale: 'Mantém os dois qualificativos hebraicos: שׁקט, tranquilo, e בטח, seguro ou confiante, sem introduzir a interpretação “desprevenido”.'
- source_word: וַיַּכּוּ אוֹתָם
  choice: Feriram seus habitantes
  rationale: נכה possui amplitude semântica e não exige que se explicite “mataram”. O antecedente semântico de “os” é o povo; “seus habitantes” evita em português uma referência pronominal pouco clara depois de “um povo”.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: Equivalente idiomático tradicional e claro da expressão hebraica literalmente “à boca da espada”, preservando sua imagem bélica.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: e incendiaram a cidade
  rationale: “Incendiaram” comunica de modo natural em português que queimaram a cidade com fogo; repetir “com fogo” seria redundante no idioma receptor.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a progressão narrativa, a duplicação de “contra” e a descrição contida da violência, ao mesmo tempo que evita construções excessivamente literais ou ambíguas no português.
