  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: pt
  text: Não havia ninguém que os socorresse, pois a cidade ficava longe de Sidom, e eles não mantinham relações com ninguém. Ela ficava no vale pertencente a Bete-Reobe.[a] Então reconstruíram a cidade e passaram a morar nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no vale próximo de Bete-Reobe”. A expressão hebraica é elíptica, e a preposição pode indicar proximidade, em vez de posse.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: ninguém que os socorresse
  rationale: O particípio hifil de נצל designa quem livra ou resgata. “Socorresse” comunica naturalmente a ausência de auxílio diante do ataque, enquanto “os” retoma os habitantes da cidade pelo contexto.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: a cidade ficava longe de Sidom
  rationale: O pronome feminino retoma a cidade. A explicitação do referente evita ambiguidade em português e preserva a descrição geográfica.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: eles não mantinham relações com ninguém
  rationale: A expressão é literalmente elíptica, algo como “não havia para eles assunto/coisa com pessoa alguma”. No contexto, indica isolamento social ou político; “não mantinham relações” expressa isso sem sugerir ausência absoluta de contato humano.
- source_word: אָדָם
  choice: ninguém
  rationale: Embora formalmente singular, אָדָם tem aqui sentido humano genérico, bem representado pelo pronome indefinido inclusivo.
- source_word: בָּעֵמֶק
  choice: no vale
  rationale: עֵמֶק designa normalmente um vale ou região baixa; “vale” é a correspondência geográfica direta e corrente.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: pertencente a Bete-Reobe
  rationale: A preposição לְ pode marcar relação territorial ou posse. “Pertencente a” preserva essa leitura provável, enquanto a possível ideia de proximidade é registrada em nota.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: reconstruíram a cidade
  rationale: O verbo significa literalmente “construíram”, mas o contexto imediato informa que a cidade fora incendiada; “reconstruíram” torna explícita a ação contextual sem alterar o sentido narrativo.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: passaram a morar nela
  rationale: ישב pode significar habitar ou estabelecer-se. A formulação indica de modo natural que fizeram da cidade reconstruída sua morada.
- source_word: בֵית רְחוֹב
  choice: Bete-Reobe
  rationale: Nome geográfico transliterado segundo uma forma legível e tradicional em português.
theological_decisions: []
