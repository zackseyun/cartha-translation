  source_fidelity: 'A tradução transmite todos os elementos do hebraico: a resposta dirigida ao grupo, a expressão resumitiva כָּזֹה וְכָזֶה, a ação de Miqueias em favor do levita, a contratação e a passagem à função sacerdotal ligada a Miqueias. A omissão de «e» inicial é idiomática em português narrativo.'
  naturalness: «Ele lhes disse» e «contratou-me» são naturais e claros em português moderno. «Fez isto e aquilo por mim» reproduz de forma compreensível a expressão resumitiva hebraica, sem indevidamente explicitar seus conteúdos. «Sacerdote dele» é idiomático e preserva o vínculo pessoal expresso no original.
  terminology: «Miqueias» é a forma portuguesa estabelecida do nome. «Sacerdote» traduz adequadamente כֹּהֵן e não atribui legitimidade ao santuário ou ao arranjo cultual. Não é necessária nota, pois «isto e aquilo» comunica suficientemente a indeterminação idiomática no próprio texto.
