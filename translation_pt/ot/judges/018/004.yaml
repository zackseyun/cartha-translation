  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: pt
  text: 'Ele lhes disse: “Miqueias fez isto e aquilo por mim, contratou-me, e eu me tornei sacerdote dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ele lhes disse
  rationale: Expressa naturalmente em português o verbo narrativo de fala e seus destinatários; a conjunção inicial pode ficar implícita numa resposta direta.
- source_word: כָּזֹה וְכָזֶה
  choice: isto e aquilo
  rationale: Reproduz de modo corrente o idioma hebraico que resume ações já descritas sem repeti-las.
- source_word: עָשָׂה לִי מִיכָה
  choice: Miqueias fez ... por mim
  rationale: Mantém o nome como sujeito e representa לִי como benefício ou relação com o falante, sem especificar além do hebraico.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: contratou-me
  rationale: שׂכר indica contratar alguém mediante pagamento; esta é uma formulação direta e natural em português.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: e eu me tornei sacerdote dele
  rationale: O encadeamento narrativo favorece o sentido ingressivo de היה, isto é, passar a exercer para Miqueias a função de sacerdote.
theological_decisions:
- issue: Natureza da função sacerdotal num contexto cúltico irregular
  choice: sacerdote dele
  alternative: sacerdote para ele
  rationale: A expressão hebraica indica vínculo pessoal de serviço sacerdotal com Miqueias, mas a tradução não declara legítimo nem ilegítimo esse arranjo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão idiomática “isto e aquilo” preserva a indefinição resumitiva do hebraico sem exigir nota.
