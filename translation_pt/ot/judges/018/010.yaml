  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: pt
  text: Quando chegarem, vocês encontrarão um povo que vive em segurança[a]. A terra é espaçosa[b], pois Deus a entregou nas mãos de vocês — um lugar onde não falta nada do que há na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um povo que se sente seguro” ou “um povo desprevenido”. O hebraico descreve pessoas que vivem com uma sensação de segurança.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “larga de mãos”, expressão idiomática hebraica que indica uma terra ampla ou espaçosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם ... תָּבֹאוּ
  choice: Quando chegarem, vocês encontrarão
  rationale: A construção combina «ao chegar de vocês» com «vocês chegarão». Em português, a repetição literal seria pouco natural; «encontrarão» explicita o resultado contextual de chegar até aquele povo sem alterar a sequência.
- source_word: עַם בֹּטֵחַ
  choice: um povo que vive em segurança
  rationale: בֹּטֵחַ descreve o povo em uma condição ou percepção de segurança. A formulação evita decidir se essa segurança era objetiva ou apenas despreocupada.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: A terra é espaçosa
  rationale: A expressão idiomática literalmente «larga de mãos» indica grande extensão ou espaço amplo. «Espaçosa» comunica o sentido natural sem introduzir a ideia não expressa de dois lados.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: pois Deus a entregou nas mãos de vocês
  rationale: O perfeito apresenta a entrega como certa ou já realizada na perspectiva dos exploradores. O plural natural em português corresponde ao sufixo plural hebraico dentro do idioma «entregar na mão».
- source_word: מָקוֹם
  choice: um lugar
  rationale: Mantém o sentido direto do substantivo e introduz a descrição explicativa do território.
- source_word: אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: onde não falta nada
  rationale: Expressa de modo corrente a ausência de carência indicada por מַחְסוֹר.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: do que há na terra
  rationale: No contexto, הָאָרֶץ retoma o território que está sendo descrito, e não necessariamente toda a Terra.
theological_decisions:
- issue: Sentido de אֱלֹהִים no discurso dos exploradores
  choice: Deus
  alternative: deuses; um deus
  rationale: O substantivo rege aqui um verbo no singular e, no contexto, designa a divindade como agente da entrega da terra. «Deus» preserva naturalmente essa referência singular sem acrescentar uma formulação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega «vocês» para a segunda pessoa plural e mantém a ambiguidade entre segurança real e sensação de segurança.
