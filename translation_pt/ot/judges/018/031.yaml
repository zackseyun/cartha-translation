  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ לָ/הֶ֔ם אֶת פֶּ֥סֶל מִיכָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כָּל יְמֵ֛י הֱי֥וֹת בֵּית הָ/אֱלֹהִ֖ים בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: pt
  text: Assim, eles instalaram para si a imagem esculpida que Mica havia feito[a], durante todo o tempo em que a casa de Deus esteve em Siló.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolo”. O termo hebraico se refere a uma imagem fabricada para uso cultual; “imagem esculpida” preserva o sentido concreto, enquanto “ídolo” explicita sua função religiosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: eles instalaram para si
  rationale: שׂים significa pôr ou colocar; no contexto cultual, “instalaram” comunica naturalmente que a imagem foi colocada para uso religioso. לָהֶם é preservado por “para si”.
- source_word: פֶּסֶל
  choice: imagem esculpida
  rationale: O termo designa uma imagem fabricada para uso cultual, frequentemente talhada. “Imagem esculpida” preserva o sentido concreto sem tornar explícita demais a avaliação contida em “ídolo”.
- source_word: מִיכָה
  choice: Mica
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: אֲשֶׁר עָשָׂה
  choice: que Mica havia feito
  rationale: A repetição do nome elimina em português uma possível ambiguidade pronominal, e o mais-que-perfeito composto indica que a fabricação precedeu a instalação.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: durante todo o tempo em que ... esteve
  rationale: Expressa com naturalidade o valor durativo da construção temporal hebraica.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Tradução direta que mantém a tensão narrativa entre o culto de Dã e o centro de culto em Siló, sem inserir uma explicação interpretativa.
- source_word: בְּשִׁלֹה
  choice: em Siló
  rationale: Transliteração portuguesa convencional do topônimo, com tradução direta da preposição.
theological_decisions:
- issue: Sentido de בֵּית הָאֱלֹהִים no contraste entre o culto de Dã e o centro de adoração em Siló
  choice: a casa de Deus
  alternative: o santuário de Deus
  rationale: “Casa de Deus” conserva a formulação da fonte e sua tensão teológica, sem acrescentar uma qualificação explícita de legitimidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. “Instalaram” é idiomático no contexto de estabelecer uma imagem cultual; “durante todo o tempo” evita um hebraísmo rígido sem perder a duração expressa no original.
