base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: pt
  text: 'O sacerdote lhes disse: “Vão em paz. O caminho que vocês vão percorrer está diante de Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O caminho de vocês está diante de Yahweh”, isto é, a viagem está à vista dele. A expressão não declara necessariamente aprovação divina explícita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם הַכֹּהֵן
  choice: O sacerdote lhes disse
  rationale: Reproduz com naturalidade o avanço narrativo do wayyiqtol e mantém o referente definido, já conhecido no contexto.
- source_word: לְכוּ לְשָׁלוֹם
  choice: Vão em paz
  rationale: Expressão idiomática portuguesa que preserva tanto o imperativo plural quanto o tom de despedida ou bênção do hebraico.
- source_word: נֹכַח
  choice: diante de
  rationale: Mantém o sentido espacial e figurado de algo que está perante ou à vista de alguém, sem acrescentar aprovação ou garantia de êxito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: דַּרְכְּכֶם אֲשֶׁר תֵּלְכוּ בָהּ
  choice: O caminho que vocês vão percorrer
  rationale: Preserva a imagem hebraica do caminho e expressa em português corrente a viagem planejada pelos homens.
theological_decisions:
- issue: Força da declaração do sacerdote sobre Yahweh e o caminho dos danitas
  choice: O caminho que vocês vão percorrer está diante de Yahweh
  alternative: 'Yahweh aprova a viagem de vocês; ou: A viagem de vocês está sob o cuidado de Yahweh'
  rationale: A construção hebraica afirma mais diretamente que o caminho está diante de Yahweh, isto é, à sua vista. Ela não declara de modo explícito que ele o aprove, abençoe ou garanta seu sucesso; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”). A ordem da frase foi ajustada à sintaxe portuguesa, sem enfraquecer a formulação deliberadamente ambígua do hebraico.
