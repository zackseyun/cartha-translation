  text: וַ/יִּסְע֤וּ מִ/שָּׁם֙ מִ/מִּשְׁפַּ֣חַת הַ/דָּנִ֔י מִ/צָּרְעָ֖ה וּ/מֵ/אֶשְׁתָּאֹ֑ל שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ חָג֖וּר כְּלֵ֥י מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: pt
  text: Assim, seiscentos homens do clã dos danitas[a] partiram dali, de Zorá e de Estaol, equipados com armas de guerra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da família dos danitas”. O termo hebraico indica aqui um grupo de parentesco dentro da tribo.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “cingidos de armas de guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: O verbo נסע, nesta forma narrativa, indica levantar acampamento e pôr-se a caminho. “Partiram” é natural em português e expressa claramente a saída.
- source_word: מִשָּׁם
  choice: dali
  rationale: Equivalente locativo direto e idiomático de “daquele lugar”, adequado ao fluxo narrativo.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: do clã dos danitas
  rationale: מִשְׁפָּחָה designa aqui uma subdivisão de parentesco dentro da tribo, mais específica que a tribo inteira; “clã” comunica essa unidade social com precisão.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: de Zorá e de Estaol
  rationale: Os topônimos são transliterados segundo formas portuguesas correntes, e a preposição repetida na fonte é representada de modo natural.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: seiscentos homens
  rationale: אִישׁ no singular, após o numeral, tem valor coletivo e se refere a homens adultos no contexto militar.
- source_word: חָגוּר
  choice: equipados
  rationale: Embora o sentido concreto seja “cingidos”, a expressão militar indica que levavam consigo o armamento; “equipados” transmite esse valor de modo claro, deixando a imagem literal para a nota.
- source_word: כְּלֵי מִלְחָמָה
  choice: armas de guerra
  rationale: כְּלִי pode significar objeto, instrumento ou equipamento; no contexto militar, refere-se a armamento. “Armas de guerra” conserva a força formal da expressão hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência sem perder os elementos da fonte; as notas preservam tanto a alternativa para a unidade de parentesco quanto a imagem concreta do armamento preso ao corpo.
