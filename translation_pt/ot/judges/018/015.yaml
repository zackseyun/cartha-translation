  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: pt
  text: Eles se desviaram para lá e chegaram à casa do jovem levita, isto é, à casa de Mica, e lhe perguntaram como estava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cumprimentaram” ou “lhe perguntaram se estava tudo bem”. O idioma hebraico fala literalmente de perguntar a respeito da paz ou do bem-estar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: Eles se desviaram para lá
  rationale: Preserva a ideia de deixar o caminho e dirigir-se àquele lugar, expressa por סור e pelo advérbio direcional שָׁמָּה.
- source_word: וַיָּבֹאוּ אֶל
  choice: e chegaram à
  rationale: בוא com אֶל indica chegada ao destino; “chegaram à” é natural em português e não pressupõe que tenham entrado.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: casa do jovem levita
  rationale: Traduz נַעַר como “jovem” e mantém sua identificação como levita de forma concisa e natural.
- source_word: בֵּית מִיכָה
  choice: isto é, à casa de Mica
  rationale: Mantém a segunda expressão locativa, que esclarece que a casa associada ao jovem levita era a casa de Mica; “isto é” torna explícita em português a função apositiva provável.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: e lhe perguntaram como estava
  rationale: Expressa naturalmente o idioma hebraico de perguntar pelo bem-estar de alguém, sem reduzi-lo necessariamente a uma simples saudação.
