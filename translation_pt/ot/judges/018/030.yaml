  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: pt
  text: Então os filhos de Dã ergueram para si a imagem esculpida. Jônatas, filho de Gérson, filho de Moisés,[a] e seus filhos serviram como sacerdotes para a tribo dos danitas até o dia do exílio da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Moisés”; a tradição massorética inclui uma letra suspensa, resultando na leitura tradicional “Manassés”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: levantaram
  rationale: O hifil de קום significa aqui fazer ficar de pé, isto é, erigir ou instalar. “Levantaram” é natural em português e conserva a imagem concreta da instalação.
- source_word: לָהֶם
  choice: para si
  rationale: O dativo pronominal indica que os danitas agiram em benefício ou para uso próprio; “para si” expressa concisamente esse valor reflexivo.
- source_word: בְּנֵי דָן
  choice: os filhos de Dã
  rationale: Mantém de perto a expressão hebraica e continua compreensível, sem igualá-la à forma gentílica usada depois no versículo.
- source_word: הַפָּסֶל
  choice: a imagem esculpida
  rationale: פֶּסֶל designa concretamente uma imagem produzida por entalhe ou escultura. A opção evita tanto a linguagem arcaica quanto a interpretação mais explícita de “ídolo”.
- source_word: וִיהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן גֵּרְשֹׁם
  choice: filho de Gérson
  rationale: Tradução direta da construção genealógica, com a forma portuguesa corrente do nome.
- source_word: בֶּן מְהוּא
  choice: filho de Moisés
  rationale: A base consonantal aponta para Moisés; a letra nun suspensa da tradição massorética produz a leitura tradicional “Manassés”. O texto principal preserva a leitura básica, e a nota registra a tensão textual.
- source_word: וּבָנָיו
  choice: e seus filhos
  rationale: Em português, a coordenação com “Jônatas” deixa claro que ele e seus filhos constituem o sujeito de “foram sacerdotes”, sem necessidade de acrescentar “ele”.
- source_word: כֹהֲנִים
  choice: sacerdotes
  rationale: Equivalente corrente de כֹהֲנִים no contexto de serviço cultual.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: da tribo dos danitas
  rationale: A preposição לְ indica a relação de serviço para com o grupo tribal. “Da tribo dos danitas” é idiomático e preserva a força gentílica de הַדָּנִי.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: até o dia do exílio da terra
  rationale: A formulação hebraica é concisa e incomum. A tradução relativamente formal conserva a ambiguidade sobre o referente e sobre a relação exata entre a terra e o exílio.
theological_decisions:
- issue: Identificação genealógica do antepassado de Jônatas
  choice: filho de Moisés
  alternative: filho de Manassés
  rationale: 'A tradição textual preserva deliberadamente uma tensão: a forma consonantal corresponde a “Moisés”, enquanto a letra nun suspensa possibilita a leitura tradicional “Manassés”. A tradução não resolve silenciosamente essa questão, mas põe “Moisés” no texto e registra “Manassés” em nota.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção “exílio da terra” é mantida de modo deliberadamente formal para não eliminar a concisão e a ambiguidade do hebraico.
