  to: Então os filhos de Dã ergueram para si a imagem esculpida. Jônatas, filho de Gérson, filho de Moisés,[a] e seus filhos serviram como sacerdotes para a tribo dos danitas até o dia do exílio da terra.
  rationale: A revisão explicita a relação de serviço indicada por לְ sem resolver a ambiguidade histórica de «exílio da terra». Também substitui «levantaram» por «ergueram», opção mais idiomática neste contexto de instalação de uma imagem. A leitura «Moisés» e a nota sobre «Manassés» são mantidas.
