base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: pt
  text: 'Esses homens entraram na casa de Mica e pegaram a imagem esculpida, o éfode[a], os ídolos domésticos e a imagem de metal fundido. Então o sacerdote lhes perguntou: “O que vocês estão fazendo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a imagem esculpida do éfode”. A expressão hebraica relaciona os dois termos, mas, no versículo anterior, a imagem e o éfode são enumerados como objetos distintos.
    reason: textual_and_syntactic_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Esses homens
  rationale: O demonstrativo retoma os cinco homens do contexto imediato. A explicitação de “homens” torna a referência natural em português sem acrescentar conteúdo novo.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: entraram na casa de Mica
  rationale: Embora בָּאוּ signifique normalmente “vieram/foram”, diante de “casa de Mica” e no movimento narrativo o sentido contextual é entrar.
- source_word: וַיִּקְחוּ
  choice: pegaram
  rationale: Verbo narrativo comum para tomar algo; “pegaram” é claro e atual, sem intensificar indevidamente a ação como faria “apoderaram-se”.
- source_word: פֶּסֶל
  choice: imagem esculpida
  rationale: Preserva a referência concreta a uma imagem produzida por entalhe ou escultura, sem reduzir todos os objetos da lista ao termo genérico “ídolo”.
- source_word: הָאֵפוֹד
  choice: o éfode
  rationale: Trata-se de um objeto cultual específico sem equivalente simples em português. A transliteração consagrada evita defini-lo de modo mais preciso do que o contexto permite.
- source_word: הַתְּרָפִים
  choice: os ídolos domésticos
  rationale: Comunica ao leitor moderno a função cultual doméstica dos terafins; “deuses domésticos” poderia sugerir as próprias divindades, em vez de suas representações ou objetos cultuais.
- source_word: הַמַּסֵּכָה
  choice: a imagem de metal fundido
  rationale: O substantivo designa uma imagem feita por fundição. A formulação explicita o material e o processo de maneira natural em português.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: Então o sacerdote lhes perguntou
  rationale: O verbo hebraico é literalmente “disse”, mas introduz uma pergunta direta; “perguntou” expressa naturalmente a função da fala. “Então” preserva a progressão narrativa do waw consecutivo.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: O que vocês estão fazendo?
  rationale: Tradução direta da pergunta, com “vocês” adequado ao plural e amplamente compreensível em português moderno.
theological_decisions:
- issue: Distinção entre os objetos cultuais
  choice: 'Manter termos concretos distintos: “imagem esculpida”, “éfode”, “ídolos domésticos” e “imagem de metal fundido”.'
  alternative: Uniformizar os itens como “ídolos” ou “imagens”.
  rationale: A enumeração distingue objetos de tipos diferentes. Preservar essas diferenças evita impor uma interpretação teológica que os trate como uma única categoria indiferenciada.
- issue: Relação sintática entre פֶּסֶל e הָאֵפוֹד
  choice: Apresentar “a imagem esculpida” e “o éfode” como itens distintos no texto, registrando em nota a forma comprimida e ambígua do hebraico.
  alternative: Traduzir “a imagem esculpida do éfode” como um único objeto.
  rationale: A forma consonantal massorética permite uma leitura construta, mas o contexto imediato de Juízes 18:17 enumera a imagem e o éfode separadamente. A tradução principal segue essa enumeração contextual sem ocultar a dificuldade textual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Emprega “vocês” para o plural na fala direta, “Mica” como forma portuguesa corrente do nome e “éfode” como transliteração cultual estabelecida. A nota preserva uma ambiguidade real da sintaxe hebraica sem sobrecarregar o texto principal.
