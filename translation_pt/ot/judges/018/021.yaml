base_translation:
  language: en
  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: pt
  text: Então eles se viraram e seguiram caminho, colocando à frente deles as crianças pequenas, o gado e os bens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a bagagem” ou “as posses”. O termo hebraico indica aqui os bens materiais transportados pelo grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיֵּלֵכוּ
  choice: se viraram e seguiram caminho
  rationale: Preserva as duas ações sucessivas — virar-se e ir — com fluidez narrativa natural em português.
- source_word: הַטַּף
  choice: as crianças pequenas
  rationale: O termo designa os pequenos, especialmente as crianças vulneráveis do grupo, e não todos os dependentes de modo indistinto.
- source_word: הַמִּקְנֶה
  choice: o gado
  rationale: Termo coletivo abrangente e corrente para os animais domésticos que constituíam os rebanhos do grupo.
- source_word: הַכְּבוּדָּה
  choice: os bens
  rationale: Neste contexto, refere-se às posses materiais transportadas pelo grupo; evita o sentido inadequado de “glória” e não restringe o referente apenas a objetos preciosos.
- source_word: לִפְנֵיהֶם
  choice: à frente deles
  rationale: Reproduz diretamente a relação espacial do hebraico sem explicitar além do texto a razão estratégica dessa disposição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e preservação da sequência narrativa do hebraico. “À frente deles” mantém a expressão espacial sem acrescentar uma interpretação sobre a finalidade da disposição.
