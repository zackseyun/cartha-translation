  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: pt
  text: 'Ele respondeu: “Vocês levaram os meus deuses[a], que eu fiz, e o sacerdote, e foram embora. O que ainda me resta? Então, como podem me dizer: ‘O que há com você?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu deus” ou “minhas imagens divinas”. Em alguns contextos, a palavra hebraica pode ser singular ou plural; aqui, porém, o contexto mais amplo favorece “meus deuses”.
    reason: Registra a ambiguidade de número e a alternativa contextual sem enfraquecer a leitura principal.
lexical_decisions:
- source_word: אֱלֹהַי
  choice: os meus deuses
  rationale: O substantivo pode ter sentido singular ou plural em certos contextos, mas os objetos de culto da casa de Mica, mencionados no contexto, favorecem o plural. A tradução mantém a ironia narrativa de deuses feitos por uma pessoa.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que eu fiz
  rationale: Traduz diretamente a oração relativa e conserva o contraste enfático entre divindades e objetos que Mica fez.
- source_word: לְקַחְתֶּם
  choice: vocês levaram
  rationale: O perfeito na fala descreve uma ação concluída cujos efeitos permanecem; “levaram” é natural em português e expressa a retirada dos objetos.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Mantém o artigo definido e a referência ao sacerdote de Mica.
- source_word: וַתֵּלְכוּ
  choice: e foram embora
  rationale: Expressa a partida dos danitas de modo natural, preservando a segunda pessoa do plural.
- source_word: וּמַה לִּי עוֹד
  choice: O que ainda me resta?
  rationale: Reproduz de modo conciso a ideia de privação e perda contida na expressão hebraica.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: Então, como podem me perguntar
  rationale: Comunica a indignação da construção hebraica idiomática e sua ligação inferencial com a perda que acaba de ser descrita.
- source_word: מַה לָּךְ
  choice: O que há com você?
  rationale: Equivalente idiomático corrente que preserva a pergunta direta sem acrescentar uma causa específica.
theological_decisions:
- issue: Sentido de אֱלֹהַי no contexto dos objetos de culto doméstico
  choice: os meus deuses
  alternative: meu deus / minhas imagens divinas / meus ídolos
  rationale: “Deuses” preserva o valor lexical e a possível pluralidade sugerida pelo contexto, sem substituir o termo por “ídolos”, que explicitaria no texto principal uma avaliação interpretativa. A nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais para leitores brasileiros. O plural “vocês” torna explícita a segunda pessoa plural do hebraico. A fala conserva o tom indignado de Mica sem recorrer a linguagem excessivamente coloquial.
