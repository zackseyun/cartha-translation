source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: pt
  text: Então os cinco homens que tinham ido espionar a terra subiram e, chegando ali, pegaram a imagem esculpida, o éfode, os deuses domésticos[a] e a imagem fundida[b], enquanto o sacerdote estava de pé à entrada do portão, junto aos seiscentos homens armados com armas de guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os terafins”. O termo hebraico se refere a objetos de culto doméstico ou a deuses domésticos.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “a imagem de fundição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido básico de עלה e o movimento narrativo indicado pelo hebraico, sem reduzi-lo simplesmente a “foram”.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: que tinham ido espionar a terra
  rationale: A construção identifica os cinco por sua missão anterior de reconhecimento; “espionar” expressa o caráter estratégico de רגל.
- source_word: בָּאוּ שָׁמָּה
  choice: chegando ali
  rationale: Reproduz de modo natural a sequência “vieram/chegaram ali” sem especificar indevidamente que entraram em algum recinto.
- source_word: לָקְחוּ
  choice: pegaram
  rationale: Verte diretamente o verbo comum לקח; o contexto deixa evidente que os objetos foram tomados indevidamente.
- source_word: הַפֶּסֶל
  choice: a imagem esculpida
  rationale: פסל designa uma imagem produzida por entalhe ou escultura; a formulação é concreta e evita o caráter mais interpretativo de “ídolo”.
- source_word: הָאֵפוֹד
  choice: o éfode
  rationale: Mantém, por transliteração adaptada ao português, o termo cultural específico, sem acrescentar uma função sacerdotal não expressa pela palavra neste ponto.
- source_word: הַתְּרָפִים
  choice: os deuses domésticos
  rationale: Comunica ao leitor comum a referência a objetos cultuais ou divindades do âmbito doméstico; “terafins” é preservado como alternativa em nota.
- source_word: הַמַּסֵּכָה
  choice: a imagem fundida
  rationale: מסכה designa uma imagem produzida por fundição, frequentemente de metal; “fundida” é preciso e corrente.
- source_word: וְהַכֹּהֵן נִצָּב
  choice: enquanto o sacerdote estava de pé
  rationale: A oração funciona circunstancialmente em relação à retirada dos objetos, indicando ação simultânea.
- source_word: פֶּתַח הַשַּׁעַר
  choice: à entrada do portão
  rationale: Preserva os dois elementos da expressão hebraica, “entrada/abertura” e “portão”.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ
  choice: junto aos seiscentos homens
  rationale: Relaciona naturalmente os seiscentos homens à posição do sacerdote, como sugere a coordenação hebraica, sem afirmar além do texto que todos estavam exatamente na mesma postura.
- source_word: הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: armados com armas de guerra
  rationale: Expressa de forma clara o estado de estarem equipados ou cingidos com equipamento bélico, evitando o arcaísmo de “cingidos”.
