base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: pt
  text: O coração do sacerdote se alegrou, e ele pegou o éfode, os ídolos domésticos[a] e a imagem esculpida[b], e entrou no meio do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os terafins”. O termo hebraico se refere a objetos de culto doméstico ou deuses domésticos.
    reason: lexical_alternative
  - marker: b
    text: Ou “o ídolo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: O coração do sacerdote se alegrou
  rationale: Preserva a expressão hebraica, literalmente ligada ao coração do sacerdote tornar-se alegre ou satisfeito, em português natural e digno.
- source_word: הָאֵפוֹד
  choice: o éfode
  rationale: Mantém por transliteração o termo técnico referente a um objeto cultual, sem impor uma identificação mais específica do que o hebraico permite.
- source_word: הַתְּרָפִים
  choice: os ídolos domésticos
  rationale: Comunica de modo claro que se trata de objetos ou divindades de culto doméstico; a nota registra o termo técnico alternativo.
- source_word: הַפָּסֶל
  choice: a imagem esculpida
  rationale: Expressa tanto a natureza de imagem cultual quanto a ideia concreta de algo talhado ou esculpido.
- source_word: בְּקֶרֶב הָעָם
  choice: entrou no meio do povo
  rationale: Preserva o movimento indicado pelo verbo e o sentido espacial de estar no meio do grupo.
