base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: pt
  text: 'Quando estavam perto da casa de Mica, reconheceram a voz do jovem levita. Então se desviaram para lá e lhe perguntaram: “Quem trouxe você para cá? O que você está fazendo neste lugar?[a] E o que você tem aqui?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que você está fazendo aqui?” O hebraico diz literalmente: “O que você está fazendo nisto?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “O que você veio fazer aqui?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: Quando estavam perto da casa de Mica
  rationale: עִם pode indicar proximidade. No contexto narrativo, a expressão situa os homens junto à casa de Mica, sem sugerir associação pessoal com a casa.
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: reconheceram a voz do jovem levita
  rationale: O hifil de נכר significa aqui reconhecer ou identificar, e קוֹל designa naturalmente a voz. נַעַר é entendido como jovem, enquanto הַלֵּוִי identifica sua condição.
- source_word: וַיָּסוּרוּ שָׁם
  choice: Então se desviaram para lá
  rationale: סור expressa o afastamento da rota para ir ao local. A formulação preserva o movimento sem especificar que tenham entrado na casa.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: Quem trouxe você para cá?
  rationale: O hifil de בוא tem sentido causativo, trazer, e הֲלֹם significa para cá ou aqui.
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: O que você está fazendo neste lugar?
  rationale: בָּזֶה é literalmente 'nisto', mas a expressão é elíptica e, no contexto, provavelmente locativa. 'Neste lugar' comunica esse sentido sem apagar em nota a forma mais direta.
- source_word: וּמַה לְּךָ פֹה
  choice: E o que você tem aqui?
  rationale: A construção idiomática pode perguntar pelo interesse, vínculo, posse ou ocupação da pessoa naquele lugar. A tradução mantém a imagem concreta, e a alternativa idiomática é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega-se “você” nas perguntas diretas por naturalidade contemporânea; “Mica” segue a forma portuguesa corrente do nome. As ambiguidades das duas perguntas finais são preservadas por notas.
