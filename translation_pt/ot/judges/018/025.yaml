  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ בְּנֵי דָ֔ן אַל תַּשְׁמַ֥ע קוֹלְ/ךָ֖ עִמָּ֑/נוּ פֶּֽן יִפְגְּע֣וּ בָ/כֶ֗ם אֲנָשִׁים֙ מָ֣רֵי נֶ֔פֶשׁ וְ/אָסַפְתָּ֥ה נַפְשְׁ/ךָ֖ וְ/נֶ֥פֶשׁ בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: pt
  text: 'Os filhos de Dã lhe disseram: “Não deixe que sua voz seja ouvida entre nós, para que homens de ânimo amargurado[a] não ataquem vocês, e você acabe perdendo a própria vida e a vida dos de sua casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens ferozes”, “homens desesperados” ou “homens de espírito amargurado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a expressão hebraica de parentesco e a identidade tribal; em português, continua clara e natural no contexto narrativo.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: Não deixe que sua voz seja ouvida entre nós
  rationale: Mantém a imagem hebraica de ouvir a voz e comunica a ordem ameaçadora para que Mica pare de protestar, sem explicitar além do texto.
- source_word: פֶּן
  choice: para que ... não
  rationale: Expressa em português atual a consequência temida ou ameaçada introduzida pela conjunção hebraica, com mais naturalidade do que uma formulação arcaizante.
- source_word: יִפְגְּעוּ בָכֶם
  choice: ataquem vocês
  rationale: O verbo indica aqui um encontro hostil ou agressão. O plural “vocês” preserva a mudança do destinatário singular para o grupo ameaçado.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: homens de ânimo amargurado
  rationale: Conserva a metáfora antropológica de נֶפֶשׁ e sugere homens ressentidos, impetuosos e perigosos sem reduzir a expressão a uma única interpretação.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: você acabe perdendo a própria vida
  rationale: Traduz o sentido idiomático de perda da vida, evitando a reprodução ininteligível do sentido literal de “recolher”.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: e a vida dos de sua casa
  rationale: Comunica o valor coletivo de “casa” e o perigo para seus membros, preservando a referência repetida à vida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a formulação hebraica da voz ouvida e a alternância entre o singular dirigido a Mica e o plural que inclui os que estavam com ele.
