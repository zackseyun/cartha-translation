base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: pt
  text: Eles subiram e acamparam em Quiriate-Jearim, em Judá. Por isso, aquele lugar é chamado de Maane-Dã até hoje; fica a oeste de Quiriate-Jearim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atrás de Quiriate-Jearim”.'
    reason: O hebraico אַחֲרֵי significa literalmente “atrás de”, mas, conforme a orientação espacial pressuposta, pode indicar “a oeste de”.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Eles subiram
  rationale: Conserva o sentido espacial do verbo עלה e mantém a sequência narrativa.
- source_word: מַחֲנֵה דָן
  choice: Maane-Dã
  rationale: Translitera o topônimo hebraico, cujo sentido literal é “Acampamento de Dã”, sem convertê-lo em descrição comum.
- source_word: הִנֵּה
  choice: fica
  rationale: Neste enunciado locativo, o hebraico introduz ou realça a localização; em português, “fica” comunica isso com naturalidade, sem o arcaísmo de “eis”.
- source_word: אַחֲרֵי
  choice: a oeste de
  rationale: Literalmente pode significar “atrás de”; aqui, como indicação geográfica, provavelmente designa o lado ocidental. A ambiguidade é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com grafia de topônimos de leitura natural para o público brasileiro. A expressão temporal “até hoje” e a etiologia do nome foram preservadas.
