base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: pt
  text: 'Chamaram em voz alta os filhos de Dã[a]. Estes se viraram e disseram a Mica: “O que há com você, que gritou?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os danitas.
    reason: lexical_alternative
  - marker: b
    text: Ou “clamou” ou “levantou um clamor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: chamaram
  rationale: קרא pode significar chamar ou gritar. Aqui, “chamaram” expressa de modo natural que Mica e os seus fizeram os danitas parar e lhes dar atenção, sem acrescentar necessariamente uma ideia de aflição.
- source_word: אֶל בְּנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a expressão hebraica de parentesco e sua forma tradicional, enquanto a nota oferece o equivalente corrente “danitas”.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: Estes se viraram
  rationale: A expressão significa literalmente que “viraram o rosto”. “Se viraram” comunica com clareza e naturalidade o movimento dos danitas, e “Estes” evita ambiguidade quanto ao sujeito.
- source_word: לְמִיכָה
  choice: a Mica
  rationale: Tradução direta da preposição seguida do nome próprio.
- source_word: מַה לְּךָ
  choice: O que há com você
  rationale: Equivalente idiomático que mantém o tom direto da pergunta sobre o motivo da agitação de Mica.
- source_word: כִּי
  choice: para
  rationale: Neste contexto, introduz a circunstância que motiva a pergunta. A construção portuguesa “para ter...” reproduz naturalmente a relação sem forçar uma explicação causal excessivamente explícita.
- source_word: נִזְעָקְתָּ
  choice: ter gritado assim
  rationale: O nifal de זעק indica gritar ou levantar um clamor. A formulação é natural em português e transmite que Mica havia dado um grito de protesto ou alarme; a nota registra alternativas mais literais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão hebraica “filhos de Dã” foi mantida no texto, e a retomada por “Estes” esclarece que são os danitas que se viram. A fala direta conserva o tom brusco da narrativa.
