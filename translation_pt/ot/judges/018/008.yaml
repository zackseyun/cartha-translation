base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: pt
  text: 'Então eles chegaram a seus irmãos, em Zorá e Estaol[a], e seus irmãos lhes perguntaram: “E vocês?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a seus parentes”. O hebraico “seus irmãos” pode referir-se a parentes ou a membros do mesmo clã, e não apenas a irmãos literais.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “Que?, vocês”. A pergunta é muito breve e elíptica; provavelmente pede o relato ou a situação deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então eles voltaram
  rationale: O wayyiqtol faz a narrativa avançar. Embora בוא signifique literalmente “vir/chegar”, o contexto mostra os exploradores regressando ao grupo; “voltaram” expressa naturalmente esse movimento em português.
- source_word: אֶל אֲחֵיהֶם
  choice: para junto de seus irmãos
  rationale: אָח pode designar irmãos literais ou parentes e companheiros do mesmo clã. “Irmãos” conserva a forma hebraica, enquanto “para junto de” comunica de modo natural a chegada ao grupo.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: Zorá e Estaol
  rationale: Os topônimos são transliterados em formas correntes e legíveis em português.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: e seus irmãos lhes perguntaram
  rationale: O verbo אָמַר é literalmente “disseram”, mas introduz aqui uma pergunta direta; “perguntaram” é idiomático e preserva a função da fala, mantendo explícito o sujeito.
- source_word: מָה אַתֶּם
  choice: Que notícias vocês trazem?
  rationale: A expressão hebraica é extremamente breve e elíptica, literalmente algo como “Que [há], vocês?”. No contexto do retorno dos exploradores, solicita o relatório deles. A tradução torna a intenção compreensível sem especificar o conteúdo da notícia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento “vocês” é natural e não informaliza excessivamente a fala. A ambiguidade da pergunta elíptica é registrada em nota; “irmãos” preserva a expressão hebraica e pode abranger parentes ou membros do mesmo clã.
