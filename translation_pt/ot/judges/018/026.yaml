base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: pt
  text: Então os filhos de Dã seguiram seu caminho, e Mica viu que eles eram mais fortes do que ele. Então virou-se e voltou para sua casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a expressão familiar hebraica empregada em sentido tribal e mantém de modo transparente a identidade dos descendentes de Dã.
- source_word: לְדַרְכָּם
  choice: seguiram seu caminho
  rationale: Expressão natural em português para a continuação da viagem, sem perder a referência explícita a 'caminho'.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: eles eram mais fortes do que ele
  rationale: Reproduz diretamente o comparativo formado por חזק com מן, sem adotar a interpretação um pouco mais forte de que eram 'fortes demais para ele'.
- source_word: וַיִּפֶן
  choice: virou-se
  rationale: Expressa o ato de mudar de direção; a ideia de retorno fica para o verbo seguinte, evitando redundância desnecessária.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: voltou para sua casa
  rationale: Traduz o sentido de retorno de שׁוב e preserva a construção direcional com אֶל.
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: Equivalente lexical direto de בית; neste contexto também implica o lar de Mica.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases favorece a leitura sem alterar a sequência narrativa. O nome מִיכָה foi vertido pela forma portuguesa tradicional 'Mica'.
