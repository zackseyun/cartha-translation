  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: pt
  text: Naqueles dias, não havia rei em Israel. E, naqueles dias, a tribo dos danitas[a] procurava para si uma herança onde pudesse habitar, porque, até aquele dia, não lhe havia cabido herança alguma entre as tribos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tribo de Dã”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica diz literalmente que nenhuma herança lhe havia “caído”, linguagem ligada à distribuição da terra por sorteio.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: não havia rei em Israel
  rationale: Expressa de modo natural a construção existencial negativa hebraica e mantém a afirmação político-histórica sem ampliá-la interpretativamente.
- source_word: שֵׁבֶט הַדָּנִי
  choice: a tribo dos danitas
  rationale: Representa o grupo tribal descendente de Dã e preserva o sentido coletivo da expressão hebraica.
- source_word: מְבַקֶּשׁ ל֤וֹ
  choice: procurava para si
  rationale: O particípio indica ação em curso; a forma reflexiva concorda semanticamente com o substantivo coletivo singular 'tribo'.
- source_word: נַחֲלָה לָשֶׁבֶת
  choice: uma herança onde pudesse habitar
  rationale: Mantém a nuance de território hereditário atribuído à tribo, enquanto a oração relativa produz português claro e natural.
- source_word: כִּי לֹא נָפְלָה לּוֹ
  choice: porque ... não lhe havia cabido
  rationale: '''Caber'' é uma forma idiomática em português de comunicar que uma porção territorial caiu ou foi atribuída por sorteio, sem a estranheza de uma tradução literal com ''cair''.'
- source_word: עַד הַיּוֹם הַהוּא
  choice: até aquele dia
  rationale: Preserva diretamente a perspectiva temporal retrospectiva da narrativa.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל בְּנַחֲלָה
  choice: herança alguma entre as tribos de Israel
  rationale: Integra o último complemento à oração em português fluente, preservando a ideia de uma porção territorial no conjunto das heranças tribais.
theological_decisions:
- issue: A declaração narrativa de que não havia rei em Israel
  choice: Mantida como observação histórico-política, sem explicitação adicional.
  alternative: Traduzir ou parafrasear de modo a apresentá-la como condenação inequívoca do período dos juízes ou como defesa explícita da monarquia.
  rationale: O hebraico afirma a ausência de rei, mas a tradução não deve decidir por conta própria o alcance teológico ou político da fórmula narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Herança' conserva a dimensão territorial e pactual de נַחֲלָה; 'habitar' mantém registro bíblico moderado sem soar arcaico.
