- from: E deram à cidade o nome de Dã, por causa do nome de Dã, seu pai[a], que nasceu a Israel; antes disso, porém, o nome da cidade era Laís.
  to: E deram à cidade o nome de Dã, em referência a Dã, pai deles, que nasceu de Israel; anteriormente, porém, o nome da cidade era Laís.
