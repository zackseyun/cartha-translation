base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: pt
  text: E deram à cidade o nome de Dã, em referência a Dã, pai deles, que nasceu de Israel; anteriormente, porém, o nome da cidade era Laís.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: E deram à cidade o nome de
  rationale: Expressa naturalmente em português o idioma hebraico de chamar o nome da cidade, preservando a referência explícita ao nome sem produzir uma construção artificial.
- source_word: דָּן
  choice: Dã
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: בְּשֵׁם דָּן
  choice: por causa do nome de Dã
  rationale: Comunica que a cidade recebeu o nome em referência ao antepassado Dã, sem acrescentar explicitamente a ideia de homenagem, que não está lexicalizada no hebraico.
- source_word: אֲבִיהֶם
  choice: seu pai
  rationale: Mantém o valor lexical direto e a expressão genealógica hebraica; neste contexto, pai pode designar um antepassado.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: que nasceu a Israel
  rationale: Preserva Israel, conforme o texto-fonte, e representa a construção passiva de ילד com ל sem substituí-lo interpretativamente por Jacó.
- source_word: וְאוּלָם
  choice: porém
  rationale: Marca com clareza e concisão o contraste entre o novo nome e o nome anterior.
- source_word: לַיִשׁ
  choice: Laís
  rationale: Forma portuguesa tradicional do topônimo hebraico.
- source_word: לָרִאשֹׁנָה
  choice: antes disso
  rationale: Indica de modo natural que Laís era o nome da cidade anteriormente, antes da mudança narrada.
theological_decisions:
- issue: Amplitude genealógica de אֲבִיהֶם
  choice: seu pai
  alternative: seu antepassado
  rationale: O texto principal conserva o termo familiar hebraico, enquanto a nota registra que, no uso genealógico, ele pode indicar um antepassado e não apenas o pai imediato.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A sintaxe foi suavizada onde o decalque do idioma hebraico seria artificial, mas foram preservados Israel, a relação genealógica e o contraste entre o nome novo e o anterior.
