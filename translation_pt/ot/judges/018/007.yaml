  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: pt
  text: Então os cinco homens partiram e chegaram a Laís. Viram que o povo que ali vivia morava em segurança, à maneira dos sidônios, tranquilo e confiante. Não havia naquela terra ninguém que os humilhasse em coisa alguma ou exercesse domínio sobre eles[a]. Eles estavam longe dos sidônios e não mantinham relações com ninguém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta frase é difícil. Literalmente, a construção se aproxima de: “não havia quem fizesse passar vergonha em coisa alguma na terra, possuidor de autoridade”. O sentido provável é que não havia governante ou opressor que os constrangesse ou dominasse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não tinham nenhuma aliança com ninguém”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: a Laís
  rationale: Nome próprio do lugar, transliterado na forma tradicional portuguesa; o ה direcional indica movimento para Laís.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: morava em segurança
  rationale: Expressa de modo natural a condição estável e segura em que a população vivia.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: à maneira dos sidônios
  rationale: מִשְׁפָּט designa aqui o costume ou modo de vida dos sidônios, e não uma sentença judicial.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: tranquilo e confiante
  rationale: 'Preserva os dois qualificativos hebraicos: ausência de perturbação e sensação de segurança.'
- source_word: מַכְלִים דָּבָר ... יוֹרֵשׁ עֶצֶר
  choice: que os humilhasse em coisa alguma ou exercesse domínio sobre eles
  rationale: A expressão hebraica é difícil. A formulação comunica a provável ausência de uma autoridade capaz de constranger ou dominar o povo, enquanto a nota preserva a incerteza textual e lexical.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: Eles estavam longe dos sidônios
  rationale: Mantém a referência aos sidônios como grupo humano e destaca o isolamento geográfico de Laís.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: não mantinham relações com ninguém
  rationale: O idioma hebraico indica ausência de relações, negócios ou acordos com outros; 'ninguém' comunica o sentido genérico de אָדָם.
theological_decisions: []
