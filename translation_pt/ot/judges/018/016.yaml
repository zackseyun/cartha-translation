revisions:
- from: E seiscentos homens, armados com suas armas de guerra, estavam parados à entrada do portão; estes eram dos filhos de Dã.[a]
  to: E seiscentos homens, portando suas armas de guerra, estavam de pé à entrada do portão; que eram dos filhos de Dã.[a]
  rationale: A revisão substitui uma expressão potencialmente ambígua de posição por “estavam de pé”, melhora a fluência de “armados com suas armas” para “portando suas armas de guerra” e torna a oração identificadora e sua nota mais naturais em português, sem alterar o sentido nem eliminar a formulação hebraica “filhos de Dã”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:08:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'O versículo é transmitido com fidelidade geral: o número, o caráter militar, a posição junto ao portão e a identificação como membros de Dã estão presentes. Contudo, “estavam parados” pode sugerir que haviam cessado de se mover, em vez de descrever a postura de estar de pé expressa por נִצָּבִים. “Portando” também traduz com mais naturalidade o sentido de estarem cingidos/equipados com armas.'
  naturalness: “Armados com suas armas de guerra” é compreensível, mas soa repetitivo em português. “Portando suas armas de guerra” é mais fluente. A oração relativa “que eram dos filhos de Dã” liga-se naturalmente aos homens identificados, sem a formulação um pouco rígida “estes eram”.
  terminology: “Filhos de Dã” preserva adequadamente a expressão hebraica בני דן; “danitas” deve ficar como alternativa em nota. “Portão” e “armas de guerra” são apropriados ao registro e ao contexto.
  issues:
  - severity: medium
    issue: “Estavam parados” para נִצָּבִים
    rationale: Em português, “parados” tende a descrever ausência de movimento, enquanto o particípio hebraico descreve os homens como estando de pé/posicionados. “Estavam de pé” mantém a imagem sem acrescentar a ideia institucional de que estavam formalmente de guarda.
  - severity: low
    issue: Redundância em “armados com suas armas de guerra”
    rationale: A repetição de “armados” e “armas” é pouco idiomática. “Portando suas armas de guerra” comunica que levavam consigo o equipamento bélico e preserva o sentido contextual de חֲגוּרִים.
  - severity: low
    issue: Formulação da nota alternativa
    rationale: A nota deve apresentar a alternativa portuguesa de modo direto; “estes eram danitas” é menos natural e desnecessariamente dependente da redação anterior.
  revised_text: E seiscentos homens, portando suas armas de guerra, estavam de pé à entrada do portão; que eram dos filhos de Dã.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “que eram danitas”. Literalmente: “que eram dos filhos de Dã”.'
    reason: lexical_alternative
  revision_rationale: A revisão substitui uma expressão potencialmente ambígua de posição por “estavam de pé”, melhora a fluência de “armados com suas armas” para “portando suas armas de guerra” e torna a oração identificadora e sua nota mais naturais em português, sem alterar o sentido nem eliminar a formulação hebraica “filhos de Dã”.
