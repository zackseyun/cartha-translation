  text: וְ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ חֲגוּרִים֙ כְּלֵ֣י מִלְחַמְתָּ֔/ם נִצָּבִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר אֲשֶׁ֖ר מִ/בְּנֵי דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: pt
  text: E seiscentos homens, portando suas armas de guerra, estavam de pé à entrada do portão; que eram dos filhos de Dã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que eram danitas”. Literalmente: “que eram dos filhos de Dã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: E seiscentos homens
  rationale: A conjunção וְ dá continuidade à narrativa e é traduzida naturalmente por “E”. Depois do numeral, אִישׁ tem sentido coletivo, daí o plural “homens” em português.
- source_word: חֲגוּרִים
  choice: armados
  rationale: O particípio significa literalmente “cingidos”, mas, construído com equipamento bélico, indica homens equipados para o combate; “armados” comunica esse sentido militar de modo atual e natural.
- source_word: כְּלֵי מִלְחַמְתָּם
  choice: suas armas de guerra
  rationale: כְּלִי pode designar objeto, utensílio ou arma; no contexto militar, “armas de guerra” preserva a ênfase do hebraico sem especificar indevidamente o tipo de equipamento.
- source_word: נִצָּבִים
  choice: estavam parados
  rationale: O particípio descreve a posição mantida pelos homens na cena. “Estavam parados” preserva esse valor descritivo sem acrescentar a ideia mais específica de que haviam sido formalmente postos de guarda.
- source_word: פֶּתַח הַשָּׁעַר
  choice: à entrada do portão
  rationale: פֶּתַח é a abertura ou entrada, e שַׁעַר designa aqui o portão de acesso. A expressão é clara e natural em português.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: estes eram dos filhos de Dã
  rationale: A oração identifica os seiscentos homens. A formulação mantém a expressão hebraica de parentesco “filhos de Dã”, enquanto “estes eram” explicita o referente de modo inteligível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e o desenvolvimento da cena hebraica foram preservados, com ajustes mínimos de sintaxe para naturalidade. O ponto e vírgula liga formalmente a descrição militar à identificação tribal.
