  text: הֵ֥מָּה הִרְחִ֖יקוּ מִ/בֵּ֣ית מִיכָ֑ה וְ/הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר בַּ/בָּתִּים֙ אֲשֶׁר֙ עִם בֵּ֣ית מִיכָ֔ה נִֽזְעֲק֔וּ וַ/יַּדְבִּ֖יקוּ אֶת בְּנֵי דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: pt
  text: Quando eles já estavam a certa distância da casa de Mica, os homens que estavam nas casas próximas à casa de Mica foram convocados[a] e alcançaram os filhos de Dã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deram o alarme”. O verbo hebraico pode indicar tanto um grito de alarme quanto a reunião que resulta dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הִרְחִיקוּ
  choice: eles já estavam a certa distância
  rationale: O pronome retoma os danitas, e o verbo indica que eles se haviam afastado. A formulação portuguesa expressa com naturalidade a distância já percorrida no momento da ação seguinte.
- source_word: מִבֵּית מִיכָה
  choice: da casa de Mica
  rationale: A construção de posse com preposição é vertida de modo natural e claro em português.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Preserva a referência masculina explícita do substantivo hebraico.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: que estavam nas casas próximas à casa de Mica
  rationale: A expressão hebraica é sintaticamente áspera; aqui עִם comunica proximidade ou associação. A tradução mantém as casas vizinhas sem sugerir que se tratava apenas dos moradores da própria casa de Mica.
- source_word: נִזְעֲקוּ
  choice: reuniram-se
  rationale: O nifal pode descrever a mobilização coletiva provocada por um clamor. “Reuniram-se” se encaixa na perseguição subsequente, enquanto a nota preserva a possibilidade de um grito de alarme.
- source_word: וַיַּדְבִּיקוּ
  choice: e alcançaram
  rationale: O verbo indica chegar até alguém ou alcançá-lo depois de uma perseguição.
- source_word: אֶת בְּנֵי דָן
  choice: os filhos de Dã
  rationale: Mantém a expressão formal de parentesco do hebraico, em vez de substituí-la por “danitas”.
theological_decisions: []
