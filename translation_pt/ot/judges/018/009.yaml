- from: 'E eles disseram: “Levantem-se, e subamos contra eles, pois vimos a terra, e ela é muito boa. E vocês ficam aí sem fazer nada! Não sejam lentos em partir, entrar e tomar posse da terra.”'
  to: 'E eles disseram: “Levantem-se, e subamos contra eles, pois vimos a terra, e eis que ela é muito boa. E vocês estão calados — não demorem a ir, entrar e tomar posse da terra.”'
