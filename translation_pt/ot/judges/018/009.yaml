base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: pt
  text: 'E eles disseram: “Levantem-se, e subamos contra eles, pois vimos a terra, e eis que ela é muito boa. E vocês estão calados — não demorem a ir, entrar e tomar posse da terra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: Levantem-se
  rationale: O imperativo singular com valor coletivo dirige-se ao grupo; o plural é natural em português e preserva o chamado imediato à ação.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: e subamos contra eles
  rationale: Preserva a imagem hebraica de subir e o sentido hostil de עַל neste contexto.
- source_word: מַחְשִׁים
  choice: ficam aí sem fazer nada
  rationale: O particípio pode significar ficar calado ou inativo; no contexto da exortação militar, a expressão idiomática comunica a censura pela inação sem reduzi-la apenas ao silêncio verbal.
- source_word: אַל תֵּעָצְלוּ
  choice: Não sejam lentos
  rationale: Traduz a ideia de demora, indolência ou falta de prontidão, em linguagem corrente e digna.
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: em partir, entrar e tomar posse
  rationale: 'Mantém a sequência enfática de três infinitivos: ir, entrar e possuir.'
