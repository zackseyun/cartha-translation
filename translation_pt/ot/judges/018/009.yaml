  naturalness: O português é claro e vigoroso. «Estão calados» é igualmente natural e mantém melhor a concisão do hebraico. «Não demorem» comunica de modo idiomático a proibição de hesitar ou mostrar-se negligente.
  terminology: «Tomar posse da terra» reproduz bem לָרֶשֶׁת אֶת־הָאָרֶץ e não acrescenta enquadramento teológico. «Subamos contra eles» preserva o valor hostil de עֲלֵיהֶם.
