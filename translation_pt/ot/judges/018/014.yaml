base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: pt
  text: 'Então os cinco homens que tinham ido explorar a terra de Laís tomaram a palavra e disseram aos seus irmãos: “Vocês sabem que nestas casas há um éfode, terafins[a], uma imagem esculpida e uma imagem fundida[b]? Agora, pensem bem no que vão fazer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os “terafins” eram imagens cultuais associadas à casa, por vezes entendidas como deuses ou ídolos domésticos.
    reason: lexical_alternative
  - marker: b
    text: Isto é, uma imagem produzida por fundição, provavelmente de metal. Algumas traduções tradicionais dizem “imagem de fundição”.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: tomaram a palavra e disseram
  rationale: A combinação hebraica introduz uma fala em resposta ou reação, embora não haja uma pergunta imediatamente anterior. A formulação portuguesa mantém essa função discursiva sem a estranheza de “responderam e disseram”.
- source_word: חֲמֵשֶׁת הָאֲנָשִׁים
  choice: os cinco homens
  rationale: O numeral em construção com o substantivo retoma o grupo de cinco exploradores já conhecido no contexto.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: que tinham ido explorar
  rationale: O particípio caracteriza os homens por sua missão anterior, já realizada. “Explorar” comunica aqui a observação estratégica do território sem exigir a conotação moderna mais estreita de espionagem.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: a terra de Laís
  rationale: O termo designa o território associado à cidade de Laís; “terra de Laís” preserva a forma concisa do hebraico.
- source_word: אֶל אֲחֵיהֶם
  choice: aos seus irmãos
  rationale: Mantém o termo masculino concreto do hebraico, que no contexto se refere aos outros homens danitas do grupo.
- source_word: הֲיְדַעְתֶּם
  choice: Vocês sabem
  rationale: A pergunta chama a atenção dos ouvintes para uma informação que deve motivar sua ação. “Vocês” oferece leitura brasileira natural e permanece amplamente compreensível no português internacional.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: nestas casas
  rationale: Traduz literalmente o plural “casas” sem decidir se se trata de residências separadas ou das dependências do complexo doméstico de Mica.
- source_word: אֵפוֹד
  choice: éfode
  rationale: O objeto cultual não possui equivalente simples em português; a transliteração tradicional preserva sua especificidade sem defini-lo de maneira excessiva.
- source_word: תְרָפִים
  choice: terafins
  rationale: A transliteração conserva o termo cultual distinto e evita reduzi-lo simplesmente a “ídolos”; a nota fornece a provável referência a imagens ou divindades domésticas.
- source_word: פֶסֶל
  choice: imagem esculpida
  rationale: O substantivo indica uma imagem produzida por entalhe ou escultura. A escolha preserva o modo de fabricação e evita o termo genérico “ídolo”.
- source_word: מַסֵּכָה
  choice: imagem fundida
  rationale: O termo indica uma imagem produzida por fundição, normalmente em metal. A expressão é clara e mantém a distinção em relação à imagem esculpida.
- source_word: וְעַתָּה דְּעוּ מַה תַּעֲשׂוּן
  choice: Agora, pensem bem no que vão fazer
  rationale: O imperativo literal “saibam” tem aqui o sentido pragmático de considerar ou avaliar a ação seguinte. A formulação portuguesa é natural e conserva a abertura quanto à decisão concreta.
theological_decisions:
- issue: Distinção entre os objetos cultuais do santuário de Mica
  choice: 'Manter os quatro itens distintos: “éfode, terafins, uma imagem esculpida e uma imagem fundida”.'
  alternative: Generalizar como “objetos religiosos e ídolos” ou identificar todos como ídolos.
  rationale: O hebraico enumera termos diferentes. Preservar a lista evita impor uma classificação teológica uniforme e permite que a irregularidade cultual emerja do contexto narrativo.
- issue: Sentido de תְרָפִים
  choice: Usar “terafins” no texto e explicar o provável sentido em nota.
  alternative: Traduzir diretamente por “ídolos domésticos” ou “deuses domésticos”.
  rationale: A natureza e a função exatas dos terafins não são uniformes em todas as ocorrências bíblicas. A transliteração preserva essa incerteza, enquanto a nota oferece orientação lexical sem resolver indevidamente a ambiguidade.
- issue: Força da exortação final
  choice: “pensem bem no que vão fazer”
  alternative: “decidam o que vão fazer” ou o literal “saibam o que farão”.
  rationale: A frase incita o grupo a agir, mas não especifica no próprio versículo a ação. “Pensem bem” preserva a tensão deliberativa sem antecipar a decisão narrada a seguir.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” evita formas verbais arcaicas; “tomaram a palavra” reproduz naturalmente a fórmula narrativa hebraica; os termos cultuais específicos são mantidos e esclarecidos sem importar uma interpretação denominacional.
