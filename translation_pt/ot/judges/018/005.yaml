base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: pt
  text: 'E eles lhe disseram: “Por favor, consulte a Deus, para sabermos se o nosso caminho, por onde estamos indo, terá êxito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: E eles lhe disseram
  rationale: O wayyiqtol dá continuidade à narrativa; “E” preserva esse fluxo, e “lhe disseram” verte naturalmente o objeto indireto.
- source_word: שְׁאַל נָא
  choice: Por favor, consulte
  rationale: O imperativo com נָא expressa um pedido cortês. “Consulte” comunica adequadamente a busca de orientação divina neste contexto.
- source_word: בֵאלֹהִים
  choice: a Deus
  rationale: Com שׁאל, a preposição introduz aquele a quem se consulta. Neste contexto, אֱלֹהִים é mais naturalmente singular.
- source_word: וְנֵדְעָה
  choice: para sabermos
  rationale: O coortativo indica a finalidade do pedido; a construção com infinitivo é clara e idiomática em português.
- source_word: הֲתַצְלִיחַ
  choice: se será bem-sucedido
  rationale: O hifil de צלח indica ter êxito ou prosperar. “Ser bem-sucedido” evita restringir o sentido à prosperidade material.
- source_word: דַּרְכֵּנוּ
  choice: o caminho
  rationale: “Caminho” preserva a imagem concreta do hebraico e, com a oração seguinte, refere-se naturalmente à expedição dos danitas.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: que estamos seguindo
  rationale: A formulação é natural em português e conserva a ideia de avançar por determinado caminho.
theological_decisions:
- issue: Referência de אֱלֹהִים
  choice: Deus (singular)
  alternative: deuses
  rationale: Embora a forma possa ter valor plural, o contexto imediato retrata os homens pedindo ao sacerdote uma consulta divina, favorecendo o referente singular sem acrescentar identificação doutrinária além do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, mantendo a imagem hebraica do “caminho” e a pergunta sobre seu êxito.
