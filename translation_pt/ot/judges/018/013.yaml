base_translation:
  language: en
  yaml_path: translation/ot/judges/018/013.yaml
  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: pt
  text: Dali, atravessaram a região montanhosa de Efraim[a] e chegaram até a casa de Mica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «a região montanhosa de Efraim»; tradicionalmente também traduzido «monte Efraim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: atravessaram
  rationale: O verbo עבר indica passar ou atravessar; neste contexto de viagem por uma região, «atravessaram» expressa naturalmente o deslocamento pelo território.
- source_word: מִשָּׁם
  choice: Dali
  rationale: Advérbio dêitico que marca a partida do lugar mencionado anteriormente; «Dali» é conciso e natural em português narrativo.
- source_word: הַר אֶפְרָיִם
  choice: a região montanhosa de Efraim
  rationale: A expressão designa a zona montanhosa de Efraim, não necessariamente um monte isolado. «Região montanhosa» comunica claramente o sentido geográfico.
- source_word: וַיָּבֹאוּ
  choice: e chegaram
  rationale: Embora בוא possa significar «vir» ou «entrar», com עַד e no contexto de itinerário, «chegaram» é a formulação mais idiomática em português.
- source_word: עַד
  choice: até
  rationale: Marca o limite alcançado no percurso; «até» preserva de forma direta o valor espacial da preposição.
- source_word: בֵּית מִיכָה
  choice: a casa de Mica
  rationale: O estado construto significa literalmente «casa de Mica». A formulação é natural em português e mantém a possível referência à residência ou ao complexo doméstico de Mica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e legibilidade brasileira. Emprega-se «região montanhosa» para evitar a impressão de um pico único. A forma do nome segue o uso bíblico português «Mica».
