  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: pt
  text: Assim, naquele dia, Deus subjugou Jabim, rei de Canaã, diante dos filhos de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: subjugou
  rationale: O hifil de כנע indica fazer um inimigo baixar-se ou ficar sujeito. “Subjugou” comunica de modo natural a derrota e a sujeição político-militar.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o substantivo designa claramente o Deus de Israel como agente singular da ação histórica.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Preserva de forma natural o marcador temporal da narrativa.
- source_word: אֵת יָבִין
  choice: Jabim
  rationale: אֵת marca o objeto direto definido; o nome próprio é vertido na forma tradicional portuguesa Jabim.
- source_word: מֶלֶךְ כְּנָעַן
  choice: rei de Canaã
  rationale: A cadeia construta significa diretamente “rei de Canaã”; a aposição identifica Jabim sem exigir artigo.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém a relação expressa pelo hebraico, segundo a qual Jabim foi subjugado perante ou em face de Israel, sem explicitar além do texto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica literalmente masculina e sua forma bíblica reconhecível, deixando em nota a alternativa idiomática “os israelitas”.
theological_decisions:
- issue: Agência divina na vitória de Israel
  choice: Deus aparece como sujeito direto que subjugou Jabim.
  alternative: Reformular a frase para destacar apenas a vitória militar de Israel.
  rationale: O hebraico apresenta explicitamente אֱלֹהִים como sujeito do verbo; a tradução deve preservar essa agência divina.
- issue: Expressão de gênero para o povo da aliança
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A fonte usa o construto masculino plural בְּנֵי יִשְׂרָאֵל. A forma principal conserva essa expressão, enquanto a nota esclarece seu referente coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assim” liga o versículo à conclusão narrativa anterior; “subjugou” preserva o sentido militar e político sem reduzir a ação a uma emoção interior.
