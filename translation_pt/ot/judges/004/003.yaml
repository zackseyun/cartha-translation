base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: pt
  text: Então os filhos de Israel clamaram ao SENHOR, porque ele tinha novecentos carros de ferro e oprimia os filhos de Israel com força por vinte anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: clamaram
  rationale: Expressa o pedido urgente de socorro dirigido a Deus, preservando o tom solene da narrativa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão hebraica tradicional e sua dimensão coletiva e genealógica.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o nome divino no texto bíblico.
- source_word: רֶכֶב בַּרְזֶל
  choice: carros de ferro
  rationale: Tradução direta da expressão hebraica, sem especificar além do texto se eram inteiramente feitos de ferro ou reforçados com ele.
- source_word: לָחַץ ... בְחָזְקָה
  choice: havia oprimido duramente
  rationale: לָחַץ indica pressão ou opressão, e בְחָזְקָה intensifica a severidade dessa ação.
theological_decisions:
- issue: Referente masculino singular em 'ele tinha' e 'havia oprimido'
  choice: Preservar o pronome sem explicitar o nome
  alternative: Repetir 'Jabim' ou identificar Sísera
  rationale: O hebraico usa pronomes masculinos singulares, cujo referente é fornecido pelo contexto anterior; explicitá-lo aqui resolveria uma referência que o versículo mantém implícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com ordem natural. O mais-que-perfeito composto ('havia oprimido') apresenta a opressão como situação já prolongada no momento do clamor; 'duramente' comunica a força de בְחָזְקָה sem acrescentar detalhes militares não expressos.
