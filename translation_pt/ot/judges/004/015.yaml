  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: pt
  text: Yahweh lançou Sísera[a], todos os seus carros de guerra e todo o seu exército[b] em confusão diante de Baraque, ao fio da espada[c]. Então Sísera desceu do seu carro e fugiu a pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pôs em pânico” ou “desbaratou”; o verbo hebraico pode indicar pânico ou confusão provocados em batalha.
    reason: lexical_alternative
  - marker: b
    text: Ou “todo o acampamento” ou “toda a hoste”; aqui, o termo se refere à força de combate inteira.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “à boca da espada”, isto é, ao fio da espada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: lançou em confusão
  rationale: O verbo המם descreve causar pânico, confusão ou desordem em combate. A expressão conserva a força causativa sem antecipar no próprio verbo o resultado militar indicado a seguir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הָרֶכֶב
  choice: seus carros de guerra
  rationale: רֶכֶב pode designar coletivamente os carros ou a força de carros. A formulação é clara em português e explicita o sentido militar.
- source_word: הַמַּחֲנֶה
  choice: seu exército
  rationale: Embora o termo possa significar literalmente acampamento, neste contexto de batalha refere-se à força militar reunida.
- source_word: לְפִי חֶרֶב
  choice: ao fio da espada
  rationale: Equivalente português natural do hebraísmo literalmente construído com a boca ou o fio da espada.
- source_word: לִפְנֵי בָרָק
  choice: diante de Baraque
  rationale: Expressa que a desordem e a derrota ocorreram perante Baraque e seu avanço.
- source_word: וַיֵּרֶד ... מֵעַל הַמֶּרְכָּבָה
  choice: desceu do seu carro
  rationale: Forma narrativa natural para indicar que Sísera abandonou o carro de guerra.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: fugiu a pé
  rationale: Reproduz idiomaticamente o contraste entre fugir usando o carro e fugir sem ele.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva por transliteração, sem substituí-lo pelo título “SENHOR”; “Javé” seria uma adaptação fonológica portuguesa possível.
translation_notes:
  register: Português atual, claro e digno, com fluidez brasileira e compreensão internacional. “Carros de guerra” evita que “carros” seja entendido como automóveis; “Baraque” segue a forma portuguesa corrente do nome. A ordem das notas acompanha os termos a que se referem.
