source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: pt
  text: 'Então Débora disse a Baraque: “Levante-se, pois este é o dia em que Yahweh entregou Sísera em sua mão.[a] Acaso Yahweh não saiu à sua frente?[b]” Então Baraque desceu do monte Tabor, seguido por dez mil homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deu Sísera em sua mão”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não foi adiante de você?”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Levante-se
  rationale: O imperativo exige ação imediata. A forma é natural no português atual e mantém a força da ordem sem soar arcaica.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: pois este é o dia em que
  rationale: Preserva a ênfase demonstrativa em “este é o dia” e expressa naturalmente a função motivadora de כִּי.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: entregou ... nas suas mãos
  rationale: Comunica o sentido idiomático de colocar alguém sob o poder de outro. O passado apresenta a vitória anunciada como certa, conforme o aspecto perfeito hebraico no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֲלֹא
  choice: Acaso ... não
  rationale: Mantém a pergunta retórica que espera resposta afirmativa e soa natural em português.
- source_word: יָצָא לְפָנֶיךָ
  choice: saiu à sua frente
  rationale: Preserva a imagem verbal de Yahweh saindo diante de Baraque, sem explicitar além do texto a nuance militar sugerida pelo contexto.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Verbo natural para o movimento a partir de um monte.
- source_word: מֵהַר תָּבוֹר
  choice: do monte Tabor
  rationale: Emprega a forma geográfica corrente em português.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: seguido por dez mil homens
  rationale: Expressa de modo fluido que os dez mil combatentes iam atrás de Baraque, mantendo o referente masculino explícito de אִישׁ.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Valor temporal de נָתַן no anúncio da vitória
  choice: entregou
  alternative: entregará
  rationale: A forma perfeita apresenta a entrega de Sísera como fato consumado ou vitória certa. O passado conserva essa tensão retórica sem convertê-la em simples previsão futura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Levante-se” evita o arcaísmo de “Erga-se”; “Acaso” conserva o caráter retórico da pergunta. Os pronomes de terceira pessoa mantêm tratamento natural e respeitoso.
