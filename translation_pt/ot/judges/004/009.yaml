  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: pt
  text: 'Ela disse: “Certamente irei com você. Contudo, não será sua a honra no caminho que você está seguindo, pois Yahweh entregará Sísera nas mãos de uma mulher[a].” Então Débora se levantou e foi com Baraque a Quedes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Yahweh venderá Sísera nas mãos de uma mulher”.
    reason: Preserva em nota o valor lexical de “venderá” e a imagem hebraica da mão, enquanto o texto principal comunica naturalmente o sentido contextual de entrega ao poder de uma mulher.
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: Certamente irei
  rationale: A construção com infinitivo absoluto seguido do imperfeito intensifica o verbo; “certamente irei” preserva essa ênfase em português natural.
- source_word: עִמָּךְ
  choice: com você
  rationale: Expressa diretamente o acompanhamento e é compreensível em português internacional com boa legibilidade brasileira.
- source_word: אֶפֶס
  choice: Contudo
  rationale: A partícula introduz uma ressalva à concordância de Débora, com valor adversativo.
- source_word: תִּפְאַרְתְּךָ
  choice: não será sua a honra
  rationale: Neste contexto militar, תִּפְאֶרֶת indica honra, glória ou renome decorrente da vitória; a formulação preserva o sentido sem explicitar indevidamente a ideia de crédito militar.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: no caminho que você está seguindo
  rationale: Mantém a imagem do caminho presente no hebraico e sua possível amplitude, sem reduzi-la apenas à viagem física ou à estratégia adotada.
- source_word: בְיַד אִשָּׁה
  choice: à mão de uma mulher
  rationale: Preserva a imagem hebraica da mão como esfera de poder, embora a expressão seja menos idiomática em português; a nota oferece a equivalência corrente.
- source_word: יִמְכֹּר
  choice: venderá
  rationale: Mantém o valor lexical concreto de מָכַר e a imagem vigorosa do texto; no contexto, o verbo significa entregar alguém ao poder de outro, sentido esclarecido em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַתָּקָם
  choice: se levantou
  rationale: Preserva a sequência narrativa e o movimento expresso pelo verbo, em linguagem portuguesa corrente.
- source_word: קֶדְשָׁה
  choice: a Quedes
  rationale: O nome do lugar é transliterado na forma portuguesa tradicional; a preposição indica destino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substituiria por um título.
- issue: Identidade da “mulher”
  choice: uma mulher
  alternative: Débora ou Jael explicitamente
  rationale: O hebraico não identifica a mulher neste ponto. A tradução conserva a ambiguidade narrativa, sem antecipar nem impor sua identificação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservam-se a ênfase verbal, a metáfora do caminho, a imagem da mão e a ambiguidade sobre a identidade da mulher.
