    text: Literalmente, “Yahweh venderá Sísera nas mãos de uma mulher”.
    reason: Preserva em nota o valor lexical de “venderá” e a imagem hebraica da mão, enquanto o texto principal comunica naturalmente o sentido contextual de entrega ao poder de uma mulher.
