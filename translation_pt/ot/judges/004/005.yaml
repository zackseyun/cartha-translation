  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: pt
  text: Ela costumava sentar-se debaixo da palmeira de Débora, entre Ramá e Betel, na região montanhosa de Efraim, e os filhos de Israel subiam até ela em busca de julgamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em busca de justiça” ou “de uma decisão judicial”. O termo hebraico pode se referir à decisão de uma causa ou à administração da justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: costumava sentar-se
  rationale: O particípio no quadro narrativo descreve a atividade habitual de Débora em seu local de atuação judicial, e não apenas uma ação momentânea.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Expressa de modo natural e direto a posição sob a árvore.
- source_word: תֹּמֶר דְּבוֹרָה
  choice: a palmeira de Débora
  rationale: Preserva a relação do construto hebraico sem transformar necessariamente a expressão em nome próprio formal.
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: entre Ramá e Betel
  rationale: Emprega as formas correntes em português para os dois topônimos.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: O singular hebraico designa aqui uma região de relevo elevado, não uma única montanha.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: subiam até ela
  rationale: Mantém tanto o aspecto habitual sugerido pelo contexto quanto a imagem topográfica do verbo עלה.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão corporativa masculina do hebraico, que neste contexto designa coletivamente o povo israelita.
- source_word: לַמִּשְׁפָּט
  choice: em busca de julgamento
  rationale: Comunica a finalidade judicial da ida a Débora, preservando a amplitude do termo entre decisão judicial e administração da justiça.
theological_decisions:
- issue: Expressão corporativa de gênero בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A formulação preserva o idioma pactual do texto hebraico sem afirmar que somente homens procuravam Débora; no contexto, a expressão se refere corporativamente ao povo de Israel.
- issue: Amplitude judicial de מִשְׁפָּט
  choice: julgamento
  alternative: justiça; decisão judicial
  rationale: “Julgamento” mantém aberta a referência tanto ao ato de julgar quanto ao pronunciamento judicial, sem restringir indevidamente o sentido.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção habitual foi preservada, os topônimos seguem formas portuguesas correntes e a linguagem judicial evita tecnicismo excessivo.
