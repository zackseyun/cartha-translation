  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: pt
  text: Os filhos de Israel[a] tornaram a fazer o que era mau aos olhos de Yahweh depois que Eúde morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Em hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: tornaram a fazer
  rationale: O verbo יסף seguido de infinitivo indica repetição ou continuação. Nesta fórmula narrativa de Juízes, “tornaram a fazer” expressa naturalmente uma nova recaída, sem o artificialismo de “acrescentaram fazer”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto a expressão hebraica masculina e corporativa, mantendo sua forma tradicional e compreensível; a alternativa portuguesa mais corrente aparece em nota.
- source_word: לַעֲשׂוֹת
  choice: a fazer
  rationale: O infinitivo integra naturalmente a locução “tornaram a fazer”, preservando a estrutura e o sentido reiterativo da construção hebraica.
- source_word: הָרַע
  choice: o que era mau
  rationale: O adjetivo substantivado com artigo designa aquilo que é moralmente mau. A formulação é idiomática em português e conserva a avaliação do texto.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica literal, que também é clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְאֵהוּד מֵת
  choice: depois que Eúde morreu
  rationale: Embora a forma hebraica seja literalmente coordenada (“e Eúde morreu/estava morto”), no contexto a oração fornece a circunstância temporal da recaída de Israel. “Depois que Eúde morreu” comunica essa relação de modo natural, sem acrescentar conteúdo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva sua função como nome, em vez de substituí-lo pelo título “SENHOR”.
- issue: Designação corporativa masculina בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A expressão hebraica é formalmente masculina e coletiva. O texto principal conserva essa forma, enquanto a nota oferece o equivalente coletivo mais natural em português.
- issue: Relação temporal da oração וְאֵהוּד מֵת
  choice: depois que Eúde morreu
  alternative: e Eúde morreu; estando Eúde morto
  rationale: A oração com waw, sujeito e verbo perfeito pode funcionar circunstancialmente. O contexto do ciclo narrativo favorece a leitura temporal após a morte de Eúde, sem transformar isso em uma afirmação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “tornaram a fazer” conserva o caráter recorrente da fórmula de Juízes; “aos olhos de” mantém a imagem hebraica sem soar artificial.
