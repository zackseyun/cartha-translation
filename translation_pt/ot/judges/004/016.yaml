  text: וּ/בָרָ֗ק רָדַ֞ף אַחֲרֵ֤י הָ/רֶ֨כֶב֙ וְ/אַחֲרֵ֣י הַֽ/מַּחֲנֶ֔ה עַ֖ד חֲרֹ֣שֶׁת הַגּוֹיִ֑ם וַ/יִּפֹּ֞ל כָּל מַחֲנֵ֤ה סִֽיסְרָא֙ לְ/פִי חֶ֔רֶב לֹ֥א נִשְׁאַ֖ר עַד אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: pt
  text: E Baraque perseguiu os carros[a] e o exército até Harosete das Nações[b]. Todo o exército de Sísera caiu ao fio da espada; não restou sequer um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a força de carros”, entendendo “carros” como termo militar coletivo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Harosete das Nações”; tradicionalmente, “Harosete-Hagoim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: perseguiu
  rationale: A construção indica perseguição ativa em contexto de batalha; “perseguiu” é natural e preserva o sentido militar.
- source_word: הָרֶכֶב
  choice: os carros
  rationale: O substantivo tem sentido coletivo e, neste contexto, designa os carros de guerra; a nota registra a possível expressão coletiva “força de carros”.
- source_word: הַמַּחֲנֶה
  choice: o exército
  rationale: Aqui o termo se refere à força militar, não apenas ao acampamento físico.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: até Harosete das Nações
  rationale: “Até” marca o limite da perseguição. A tradução preserva tanto o nome do lugar quanto o sentido transparente do elemento הַגּוֹיִם, “das Nações”.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: Todo o exército de Sísera caiu
  rationale: O sujeito coletivo e o verbo no singular descrevem a derrota completa da força de Sísera; “caiu” conserva o idioma bélico hebraico.
- source_word: לְפִי חֶרֶב
  choice: ao fio da espada
  rationale: É o equivalente português tradicional e inteligível do idioma hebraico, preservando sua imagem sem a literalidade estranha de “à boca da espada”.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: não restou sequer um
  rationale: 'A formulação natural em português mantém a ênfase hebraica na totalidade: nenhum integrante da força permaneceu.'
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil. Mantém-se a concisão da narrativa militar e o paralelismo entre “os carros” e “o exército”. Os marcadores foram associados aos termos que efetivamente explicam: [a] a “carros” e [b] ao topônimo.'
