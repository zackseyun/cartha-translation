  text: וַ/יַּזְעֵ֨ק סִֽיסְרָ֜א אֶת כָּל רִכְבּ֗/וֹ תְּשַׁ֤ע מֵאוֹת֙ רֶ֣כֶב בַּרְזֶ֔ל וְ/אֶת כָּל הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ מֵ/חֲרֹ֥שֶׁת הַגּוֹיִ֖ם אֶל נַ֥חַל קִישֽׁוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: pt
  text: Então Sísera convocou todos os seus carros de guerra — novecentos carros de ferro — e todo o povo que estava com ele, desde Harosete-Hagoim até o ribeiro de Quisom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rio Quisom”, “torrente de Quisom” ou “vale da torrente de Quisom”. O hebraico naḥal pode designar um ribeiro, um leito de curso sazonal ou o vale por onde corre uma torrente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: convocou
  rationale: No contexto militar, o verbo indica chamar e reunir as forças; “convocou” preserva esse sentido causativo com linguagem natural e digna.
- source_word: רִכְבּוֹ
  choice: seus carros de guerra
  rationale: Embora o termo possa designar coletivamente a força de carros, a aposição seguinte, “novecentos carros de ferro”, favorece a referência concreta aos carros; “de guerra” evita a ambiguidade moderna de “carros”.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: novecentos carros de ferro
  rationale: Reproduz diretamente a expressão hebraica sem especificar quais componentes eram de ferro, algo que o texto não declara.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: todo o povo que estava com ele
  rationale: Mantém o valor literal de עָם, embora o contexto indique a força militar que acompanhava Sísera.
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: desde Harosete-Hagoim
  rationale: O topônimo é transliterado; “desde” combina naturalmente com o destino introduzido por “até” e expressa o ponto de partida.
- source_word: נַחַל קִישׁוֹן
  choice: ribeiro de Quisom
  rationale: נַחַל pode designar um curso de água, leito sazonal ou vale de torrente. “Ribeiro” é claro em português, enquanto a nota preserva a amplitude geográfica do termo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Carros de guerra” esclarece o referente antigo; o travessão apresenta “novecentos carros de ferro” como aposição explicativa. O marcador da nota foi colocado após “Quisom”, termo ao qual a alternativa lexical realmente se refere.
