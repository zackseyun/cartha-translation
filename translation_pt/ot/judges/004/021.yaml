source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: pt
  text: Então Jael, mulher de Héber, pegou uma estaca de tenda, tomou na mão um martelo, aproximou-se dele silenciosamente[a] e cravou a estaca na têmpora dele; a estaca se enterrou no chão[b]. Ele estava profundamente adormecido e exausto, e morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “furtivamente”. O hebraico ressalta uma aproximação silenciosa e discreta.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e afundou no chão”; a forma verbal feminina se refere mais naturalmente à estaca.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: estaca da tenda / a estaca
  rationale: Designa a peça usada para fixar uma tenda. “Estaca da tenda” é concreta, clara e natural em português.
- source_word: הַמַּקֶּבֶת
  choice: martelo
  rationale: É o instrumento de percussão usado para cravar a estaca; “martelo” preserva o sentido sem impor a especificidade incerta de “malho”.
- source_word: בְּיָדָהּ
  choice: na mão
  rationale: Expressa de modo direto e idiomático que Jael segurou o martelo na mão.
- source_word: בַּלָּאט
  choice: silenciosamente
  rationale: Destaca a aproximação sem ruído e sem chamar atenção, preservando a maneira da ação sem tornar explícita uma intenção que o termo não exige.
- source_word: וַתִּתְקַע
  choice: cravou
  rationale: No contexto de estaca e martelo, o verbo indica introduzir à força; “cravou” transmite a ação com precisão e naturalidade.
- source_word: בְּרַקָּתוֹ
  choice: na têmpora dele
  rationale: רַקָּה indica a têmpora ou a lateral da cabeça. “Na têmpora” é anatomicamente claro sem afirmar além do texto que a estaca a atravessou.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: a estaca se enterrou no chão
  rationale: O verbo feminino singular refere-se mais naturalmente à estaca. A repetição do substantivo evita que um pronome feminino em português pareça referir-se a Jael.
- source_word: נִרְדָּם
  choice: profundamente adormecido
  rationale: Comunica o estado de sono intenso sugerido pelo particípio e se ajusta ao contexto narrativo.
- source_word: וַיָּעַף
  choice: exausto
  rationale: Expressa com clareza atual a extrema fadiga de Sísera.
- source_word: וַיָּמֹת
  choice: e morreu
  rationale: Mantém a continuação narrativa simples e a conclusão abrupta do hebraico.
- source_word: אֵשֶׁת חֶבֶר
  choice: mulher de Héber
  rationale: Reproduz de maneira natural a aposição hebraica; neste contexto, “mulher de” significa esposa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativamente direto, com ampla legibilidade brasileira. A sequência de ações foi preservada sem acrescentar motivação ou causalidade; a repetição de “a estaca” resolve uma ambiguidade pronominal criada pelo gênero gramatical em português.
