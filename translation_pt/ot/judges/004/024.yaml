  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: pt
  text: E a mão dos filhos de Israel foi se tornando cada vez mais forte contra Jabim, rei de Canaã, até que eliminaram Jabim, rei de Canaã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exterminaram”. O verbo hebraico tem o sentido de “cortar fora”, isto é, destruir ou remover de maneira definitiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: a mão ... foi se tornando
  rationale: Mantém a imagem hebraica da “mão” como poder atuante, enquanto a construção progressiva expressa o avanço contínuo indicado pelo verbo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz diretamente a expressão hebraica e permanece clara em português bíblico moderno.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: cada vez mais forte
  rationale: A construção idiomática indica intensificação progressiva da força ou pressão de Israel; esta formulação é natural e preserva esse sentido.
- source_word: עַל
  choice: contra
  rationale: No contexto de hostilidade e domínio crescente, “contra” comunica adequadamente a relação adversativa.
- source_word: הִכְרִיתוּ
  choice: eliminaram
  rationale: O hifil de כרת significa literalmente “cortar” e, neste contexto, indica destruir ou remover de maneira definitiva; “eliminaram” comunica isso com clareza sem acrescentar detalhes.
