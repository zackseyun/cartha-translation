  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: pt
  text: Então informaram Sísera de que Baraque, filho de Abinoão, havia subido ao monte Tabor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: Então informaram
  rationale: O hifil de נגד significa “informar, contar, comunicar”. O sujeito plural permanece indeterminado, como no hebraico; “então” expressa naturalmente a progressão narrativa do wayyiqtol.
- source_word: לְסִיסְרָא
  choice: Sísera
  rationale: A preposição לְ marca o destinatário da informação. Em português, a construção natural é “informaram Sísera de que”.
- source_word: כִּי
  choice: de que
  rationale: Aqui כִּי introduz o conteúdo comunicado, e não uma causa. A locução “de que” completa naturalmente o verbo “informar” nesta construção.
- source_word: עָלָה
  choice: havia subido
  rationale: עלה significa “subir”. O mais-que-perfeito composto situa a subida antes do ato de informar, sem atribuir ao verbo hebraico uma distinção aspectual indevida.
- source_word: בָּרָק
  choice: Baraque
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן אֲבִינֹעַם
  choice: filho de Abinoão
  rationale: Reproduz de modo direto e natural a construção patronímica hebraica.
- source_word: הַר תָּבוֹר
  choice: monte Tabor
  rationale: הר designa aqui um monte específico, identificado pelo nome Tabor; “monte Tabor” é a forma geográfica convencional em português.
