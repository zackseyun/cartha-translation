base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: pt
  text: 'Ela mandou chamar Baraque, filho de Abinoão, de Quedes de Naftali, e lhe disse: “O SENHOR, o Deus de Israel, não ordenou: ‘Vá, dirija-se ao monte Tabor e leve com você dez mil homens dentre os filhos de Naftali e dentre os filhos de Zebulom’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: mandou chamar
  rationale: A combinação idiomática de ‘enviar’ e ‘chamar’ indica que ela enviou alguém para convocar Baraque; em português, ‘mandou chamar’ comunica isso com naturalidade e sem redundância.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: de Quedes de Naftali
  rationale: Identifica Quedes situada no território de Naftali, distinguindo-a de outras localidades com o mesmo nome.
- source_word: הֲלֹא צִוָּה
  choice: não ordenou
  rationale: Preserva a pergunta retórica hebraica, que pressupõe resposta afirmativa, sem convertê-la numa afirmação direta.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Representa o nome divino segundo a convenção portuguesa tradicional de versaletes, em continuidade com a camada de consulta auditada.
- source_word: וּמָשַׁכְתָּ
  choice: reúna-se
  rationale: O verbo משך significa literalmente ‘puxar/arrastar’ e, neste contexto militar, pode expressar deslocar-se, avançar ou reunir forças. ‘Reúna-se’ mantém a referência militar possível sem especificar de modo indevido que se trata de subir ou marchar.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: dez mil homens
  rationale: Tradução direta da expressão numérica e militar.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: dentre os filhos de Naftali e os filhos de Zebulom
  rationale: Conserva a expressão genealógico-tribal ‘filhos de’, comum no relato bíblico, e deixa claro que os homens seriam tirados das duas tribos.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: o SENHOR
  alternative: YHWH / Javé
  rationale: A forma em versaletes segue uma convenção amplamente reconhecida em português e evita impor uma reconstrução específica da pronúncia do tetragrama.
- issue: Força da pergunta de Débora
  choice: 'pergunta retórica: ‘não ordenou?’'
  alternative: 'afirmação direta: ‘O SENHOR ordena’'
  rationale: A sintaxe hebraica apresenta uma pergunta que pressupõe conhecimento ou concordância de Baraque; preservar essa forma mantém a tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os nomes tradicionais Baraque, Abinoão, Naftali, Tabor e Zebulom. A fala divina foi marcada por aspas internas, e a pergunta retórica do hebraico foi preservada.
