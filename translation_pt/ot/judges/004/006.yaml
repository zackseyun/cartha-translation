    issue: «reúna-se no monte Tabor» para וּמָשַׁכְתָּ בְּהַר תָּבוֹר
    rationale: A forma hebraica é uma ordem masculina singular não reflexiva. No contexto, exprime ir/avançar ou posicionar-se em direção ao monte; «reúna-se» acrescenta uma noção reflexiva de ajuntamento que o texto não enuncia.
  - severity: low
    issue: A segunda ocorrência de מִן em «dentre os filhos de Naftali e os filhos de Zebulom» não é refletida
    rationale: O hebraico repete a preposição לפני cada tribo. Repetir «dentre» em português melhora a correspondência e a clareza, sem tornar a frase pesada.
