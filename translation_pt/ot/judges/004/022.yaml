base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: pt
  text: 'E eis que Baraque perseguia Sísera. Jael saiu ao encontro dele e lhe disse: “Venha, e eu lhe mostrarei o homem que você está procurando.” Então ele entrou com ela, e eis que Sísera jazia morto, com a estaca da tenda na têmpora.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que / e eis que
  rationale: Preserva as duas ocorrências do marcador hebraico de percepção e surpresa, mantendo seu efeito narrativo em linguagem digna e reconhecível.
- source_word: רֹדֵף
  choice: vinha perseguindo
  rationale: Expressa o particípio hebraico como ação em andamento no cenário narrativo.
- source_word: לֵךְ
  choice: Venha
  rationale: Embora a forma lexical signifique literalmente “vá”, no contexto Jael convida Baraque a acompanhá-la para dentro; “venha” comunica naturalmente essa força deíctica em português.
- source_word: נֹפֵל מֵת
  choice: jazia morto
  rationale: O particípio “caído” seguido de “morto” descreve o estado em que Sísera foi encontrado; “jazia morto” reproduz a cena sem sugerir que ele estivesse caindo naquele momento.
- source_word: וְהַיָּתֵד בְּרַקָּתוֹ
  choice: com a estaca da tenda atravessada na têmpora
  rationale: O hebraico diz literalmente que a estaca estava “na têmpora dele”; “atravessada na” torna natural em português a posição resultante já narrada no contexto, sem acrescentar agente ou nova ação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a repetição enfática de וְהִנֵּה e a sequência narrativa do hebraico, sem suavizar a descrição violenta nem acrescentar interpretação teológica.
