    issue: «atravessada na têmpora»
    rationale: O hebraico afirma que a estaca estava «na têmpora dele», mas não especifica que a tenha atravessado. A formulação introduz um detalhe físico adicional e deve ser evitada.
  - severity: low
    issue: Pontuação final da fala direta
    rationale: Em português, o ponto final que encerra a fala deve ficar antes das aspas de fechamento.
  - severity: low
    issue: «vinha perseguindo»
    rationale: Embora compreensível, sugere adicionalmente deslocamento em direção ao ponto de referência. «Perseguia» exprime de modo mais direto a ação durativa do particípio hebraico.
