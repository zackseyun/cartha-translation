source:
  edition: WLC
  text: וּ/מָשַׁכְתִּ֨י אֵלֶ֜י/ךָ אֶל נַ֣חַל קִישׁ֗וֹן אֶת סִֽיסְרָא֙ שַׂר צְבָ֣א יָבִ֔ין וְ/אֶת רִכְבּ֖/וֹ וְ/אֶת הֲמוֹנ֑/וֹ וּ/נְתַתִּ֖י/הוּ בְּ/יָדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: pt
  text: E atrairei Sísera, comandante do exército de Jabim, com seus carros de guerra e sua multidão[b], para junto de você, no ribeiro de Quisom[a], e o entregarei na sua mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no rio Quisom”, “na torrente de Quisom” ou “no vale do Quisom”; o termo hebraico pode indicar um ribeiro, um leito de curso d’água sazonal, uma torrente ou o vale por onde ela corre.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas tropas” ou “seu exército”; literalmente, “sua multidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: atrairei
  rationale: Preserva a imagem de fazer Sísera avançar para o lugar determinado sem explicitar, como faria “enganarei”, um meio ou motivo que o verbo não declara.
- source_word: אֵלֶיךָ
  choice: para junto de você
  rationale: Expressa naturalmente em português o movimento em direção a Baraque e combina com a indicação de lugar que vem em seguida.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: no ribeiro de Quisom
  rationale: “Ribeiro” é claro e corrente, embora נַחַל possa designar também um curso sazonal, leito de torrente ou vale; a nota conserva essa amplitude.
- source_word: סִיסְרָא
  choice: Sísera
  rationale: Forma tradicional e reconhecível do nome próprio em português.
- source_word: שַׂר צְבָא יָבִין
  choice: comandante do exército de Jabim
  rationale: Comunica com precisão e em linguagem militar moderna a função de Sísera.
- source_word: רִכְבּוֹ
  choice: seus carros de guerra
  rationale: Torna explícito o sentido militar coletivo de רֶכֶב e evita que “carros” seja entendido como veículos modernos.
- source_word: הֲמוֹנוֹ
  choice: sua multidão
  rationale: Mantém a amplitude lexical do hebraico, que descreve uma grande massa de pessoas, sem reduzi-la necessariamente ao termo técnico “exército”.
- source_word: וּנְתַתִּיהוּ
  choice: e o entregarei
  rationale: Verte de modo natural a expressão idiomática hebraica de dar alguém ao poder de outro.
- source_word: בְּיָדֶךָ
  choice: na sua mão
  rationale: Preserva a imagem hebraica singular de domínio ou poder, dirigida pessoalmente a Baraque.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora de “atrair”, a amplitude de “multidão” e a imagem idiomática singular “na sua mão”; “carros de guerra” evita ambiguidade moderna.
