translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição do convite de Jael foi preservada. A tradução principal privilegia naturalidade narrativa, enquanto as notas conservam a imagem lexical de סור e a incerteza quanto ao tipo exato de cobertura.
