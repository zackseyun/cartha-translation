base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: pt
  text: 'Jael saiu ao encontro de Sísera e lhe disse[a]: “Desvie-se para cá, meu senhor, desvie-se para cá; não tenha medo.” Ele se desviou para a tenda dela, e ela o cobriu com uma manta[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Venha para cá, meu senhor, venha para cá.” O verbo hebraico significa literalmente “desviar-se”, evocando a saída do caminho para buscar abrigo.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode designar um tapete ou outro tecido usado como cobertura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: saiu
  rationale: Preserva o movimento para fora, provavelmente da tenda, em direção a Sísera.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: Expressa naturalmente o movimento intencional de Jael em direção a Sísera.
- source_word: סוּרָה
  choice: venha para cá
  rationale: No contexto, o imperativo convida Sísera a desviar-se de seu caminho e aproximar-se da tenda. Esta formulação é natural em português, enquanto a nota preserva a imagem literal.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Mantém o tratamento deferente dirigido a um homem de posição, sem sugerir aqui um título divino.
- source_word: אַל תִּירָא
  choice: não tenha medo
  rationale: É uma formulação moderna e direta para a proibição expressa pelo verbo ירא.
- source_word: וַיָּסַר אֵלֶיהָ הָאֹהֱלָה
  choice: foi até ela, entrou na tenda
  rationale: Explicita de modo natural o movimento em direção a Jael e para dentro da tenda, indicado pelo contexto e pelo sufixo direcional em הָאֹהֱלָה.
- source_word: וַתְּכַסֵּהוּ
  choice: ela o cobriu
  rationale: Traduz diretamente כסה sem acrescentar como afirmação a possível intenção de escondê-lo.
- source_word: בַּשְּׂמִיכָה
  choice: com uma manta
  rationale: שׂמיכה designa um tecido usado como cobertura; “manta” é claro em português e permite que a nota registre outras possibilidades.
