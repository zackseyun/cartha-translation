    issue: O texto principal substitui duas ocorrências de סוּרָה/וַיָּסַר por “venha” e “foi até ela”.
    rationale: Embora a nota indique “desviar-se”, o hebraico repete o verbo e apresenta Sísera respondendo ao convite. “Desvie-se” conserva essa repetição e a imagem de abandonar o caminho para buscar abrigo.
  - severity: low
    issue: “Foi até ela, entrou na tenda” explicita e separa movimentos que o hebraico apresenta como um único voltar-se para Jael e para a tenda.
    rationale: “Desviou-se para a tenda dela” é mais conciso, preserva o verbo e comunica adequadamente o movimento indicado pela forma direcional de “tenda”.
