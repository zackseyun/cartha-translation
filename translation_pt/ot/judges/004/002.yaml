id: JDG.4.2
reference: Judges 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: pt
  text: Assim, Javé os vendeu ao poder de Jabim, rei de Canaã,[a] que reinava em Hazor. O comandante do seu exército era Sísera, que morava em Harosete-Hagoim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “vendeu-os à mão de”. É uma expressão de juízo da aliança que significa que Javé os entregou ao poder de Jabim.
    reason: lexical_alternative
  - marker: b
    text: Harosete-Hagoim provavelmente significa “Harosete das Nações”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: os vendeu
  rationale: Preserva a metáfora forte do verbo מָכַר, recorrente em Juízes para a ação judicial de entregar Israel aos opressores.
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa amplamente reconhecida do nome divino, em vez de substituí-lo por um título.
- source_word: בְּיַד
  choice: ao poder de
  rationale: Expressa com clareza o sentido idiomático de estar sob o domínio de alguém; a nota preserva a imagem hebraica literal da mão.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: Jabim, rei de Canaã
  rationale: Reproduz naturalmente em português o nome e a aposição do texto hebraico.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: que reinava em Hazor
  rationale: מָלַךְ indica exercer a realeza; o imperfeito português se ajusta ao pano de fundo narrativo.
- source_word: וְשַׂר צְבָאוֹ
  choice: O comandante do seu exército
  rationale: שַׂר צָבָא designa de modo claro o principal comandante militar.
- source_word: סִיסְרָא
  choice: Sísera
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: וְהוּא יוֹשֵׁב
  choice: que morava
  rationale: A construção participial descreve a residência de Sísera; esta formulação é corrente e natural em português.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: em Harosete-Hagoim
  rationale: Trata a expressão como topônimo e conserva seus elementos em transliteração adaptada ao português, sem impor no corpo do texto uma interpretação do nome.
theological_decisions:
- issue: Ação divina na opressão de Israel
  choice: Javé os vendeu ao poder de Jabim
  alternative: Javé permitiu que caíssem sob o poder de Jabim
  rationale: O hebraico atribui diretamente a ação a Javé no contexto de juízo da aliança; a tradução não a atenua transformando-a em mera permissão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A metáfora “vendeu” foi mantida, enquanto o idiomatismo “na mão de” foi expresso como “ao poder de” e explicado em nota. Os nomes próprios seguem formas portuguesas reconhecíveis.
