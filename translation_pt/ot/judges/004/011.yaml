source:
  edition: WLC
  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: pt
  text: Héber, o queneu, havia se separado dos queneus, dos descendentes de Hobabe, sogro de Moisés[a], e armara sua tenda até o carvalho de Zaananim[b], perto de Quedes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parente de Moisés por casamento”; o termo hebraico pode ter sentido mais amplo que “sogro”.
    reason: alternative_reading
  - marker: b
    text: Ou “terebinto de Zaananim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: havia se separado
  rationale: O nifal de פרד expressa separação de um grupo. O mais-que-perfeito composto apresenta naturalmente esta informação de pano de fundo.
- source_word: מִקַּיִן / הַקֵּינִי
  choice: dos outros queneus / o queneu
  rationale: Neste contexto, קין designa coletivamente o clã dos queneus, não a pessoa de Caim. A inclusão de “outros” esclarece que Héber também pertencia a esse povo, sem alterar o sentido.
- source_word: מִבְּנֵי חֹבָב
  choice: descendentes de Hobabe
  rationale: Embora בְּנֵי signifique literalmente “filhos de”, aqui indica a linhagem ou o clã de Hobabe; “descendentes” comunica esse valor com clareza.
- source_word: חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  rationale: חֹתֵן costuma designar um parente por casamento e, neste contexto, provavelmente o sogro. A possibilidade mais ampla é preservada em nota.
- source_word: וַיֵּט אָהֳלוֹ
  choice: havia armado sua tenda
  rationale: A expressão idiomática נטה אהל significa armar ou estender uma tenda. O mais-que-perfeito mantém a função explicativa do versículo.
- source_word: עַד אֵלוֹן
  choice: junto ao carvalho
  rationale: Neste contexto de acampamento, עַד aponta para o local alcançado e אֵלוֹן para uma árvore grande, tradicionalmente entendida como carvalho ou terebinto. “Junto ao” exprime naturalmente a localização resultante.
- source_word: בצענים
  choice: de Zaananim
  rationale: Trata-se de um topônimo de significado incerto, por isso é transliterado em vez de traduzido.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: perto de Quedes
  rationale: A construção indica proximidade geográfica com Quedes.
theological_decisions:
- issue: Sentido de חֹתֵן na relação de Hobabe com Moisés
  choice: sogro de Moisés
  alternative: parente de Moisés por casamento
  rationale: “Sogro” é o sentido convencional e mais provável na tradição narrativa, mas o termo hebraico pode ter alcance mais amplo. A alternativa é registrada em nota para não eliminar essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente reconhecíveis no Brasil e no restante do mundo lusófono. Os nomes próprios seguem formas portuguesas usuais; a repetição do mais-que-perfeito situa o versículo como informação narrativa de pano de fundo.
