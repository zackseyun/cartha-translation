base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: pt
  text: 'Ele lhe disse: “Dê-me, por favor, um pouco de água para beber, pois estou com sede.” Então ela abriu o odre de leite[a], deu-lhe de beber e o cobriu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um recipiente feito de pele de animal, usado para guardar líquidos.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִינִי נָא
  choice: Dê-me, por favor, ... para beber
  rationale: O imperativo hifil de שׁקה com sufixo de primeira pessoa expressa a ideia de dar de beber; נָא suaviza o pedido e é naturalmente representado por “por favor”.
- source_word: מְעַט מַיִם
  choice: um pouco de água
  rationale: Mantém de modo claro e natural a referência a uma pequena quantidade de água.
- source_word: כִּי צָמֵאתִי
  choice: pois estou com sede
  rationale: Apresenta a razão do pedido em português corrente e digno, sem recorrer à formulação menos natural “tenho sede” neste contexto.
- source_word: נֹאוד הֶחָלָב
  choice: o odre de leite
  rationale: נֹאוד designa um recipiente feito de pele. “Odre” preserva com precisão o objeto do mundo antigo, enquanto “de leite” indica seu conteúdo e mantém o contraste narrativo com a água pedida.
- source_word: וַתַּשְׁקֵהוּ
  choice: deu-lhe de beber
  rationale: Reproduz naturalmente o sentido causativo de שׁקה. Como o recipiente de leite acaba de ser mencionado, não é necessário repetir explicitamente que ela lhe deu leite.
- source_word: וַתְּכַסֵּהוּ
  choice: o cobriu
  rationale: Traduz diretamente כסה e, como o hebraico, não especifica com que objeto ela o cobriu.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativo, com ampla legibilidade brasileira. “Odre” conserva a precisão histórica; a nota esclarece o termo sem substituir a imagem cultural do texto. A colocação do pronome em “deu-lhe” mantém um tom digno e natural na prosa bíblica.
