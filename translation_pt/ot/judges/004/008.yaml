base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: pt
  text: 'Baraque lhe disse: “Se você for comigo, eu irei; mas, se não for comigo, não irei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: lhe disse
  rationale: A construção narrativa com אמר e אֶל introduz a fala dirigida a Débora. “Lhe disse” é natural, claro e preserva o destinatário feminino indicado pelo sufixo.
- source_word: בָּרָק
  choice: Baraque
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אִם
  choice: se
  rationale: Introduz diretamente a condição, sem acrescentar qualquer nuance ausente do hebraico.
- source_word: תֵּלְכִי
  choice: você for
  rationale: O imperfeito qal na oração condicional, dirigido a uma mulher, é expresso idiomaticamente em português pelo futuro do subjuntivo. O pronome “você” mantém ampla legibilidade brasileira.
- source_word: עִמִּי
  choice: comigo
  rationale: Equivalente direto e natural da preposição de companhia com sufixo de primeira pessoa.
- source_word: וְהָלָכְתִּי
  choice: eu irei
  rationale: O perfeito qal funciona como consequência da condição. O futuro do indicativo comunica com clareza a decisão resultante de Baraque.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: mas, se não for comigo
  rationale: “Mas” explicita em português o contraste entre as duas condições, enquanto a elipse do pronome na segunda oração evita repetição desnecessária sem perder o sentido.
- source_word: לֹא אֵלֵךְ
  choice: não irei
  rationale: O imperfeito qal negado expressa a recusa de Baraque sob a segunda condição; “não irei” é direto e fiel.
