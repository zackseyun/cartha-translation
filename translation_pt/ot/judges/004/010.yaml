base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: pt
  text: Então Baraque convocou Zebulom e Naftali para Quedes, e dez mil homens subiram seguindo-o[a]; Débora também subiu com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos seus pés”, expressão que aqui significa que eles o seguiram ou marcharam sob sua liderança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: convocou
  rationale: No hifil, זעק pode indicar chamar pessoas para que se reúnam. No contexto militar, “convocou” comunica a mobilização sem pressupor um recrutamento formal.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: Zebulom e Naftali
  rationale: São os nomes das tribos chamadas por Baraque; empregam-se as formas portuguesas tradicionais e amplamente reconhecidas.
- source_word: קֶדְשָׁה
  choice: para Quedes
  rationale: O hê direcional ligado ao topônimo expressa movimento em direção ao lugar; “para Quedes” reproduz esse valor de modo natural.
- source_word: וַיַּעַל
  choice: subiram
  rationale: עלה significa normalmente “subir”. A tradução conserva tanto a ideia de deslocamento quanto a possível conotação convencional de avanço militar, sem especificá-la além do texto.
- source_word: בְּרַגְלָיו
  choice: seguindo-o
  rationale: A expressão é literalmente “aos seus pés”, mas neste contexto indica que os homens acompanhavam Baraque ou marchavam sob sua liderança. A formulação idiomática fica no texto, e a imagem hebraica é preservada em nota.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: dez mil homens
  rationale: É a expressão hebraica normal para um contingente de dez mil homens; o contexto indica uma força militar.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: Débora também subiu com ele
  rationale: Conserva o verbo repetido עלה e declara com clareza que Débora acompanhou Baraque. “Também” expressa naturalmente a continuidade aditiva da oração.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas onomásticas correntes no Brasil. A repetição de “subiram/subiu” preserva o ritmo narrativo hebraico; o ponto e vírgula evita uma sequência excessiva de orações ligadas por “e”.
