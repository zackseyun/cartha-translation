base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: pt
  text: 'E ele lhe disse[a]: “Fique à entrada da tenda. Se vier algum homem e lhe perguntar: ‘Há algum homem aqui?’, você responderá: ‘Não’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o pronome feminino singular, referindo-se a Jael.
    reason: referent_clarity
lexical_decisions:
- source_word: עֲמֹד
  choice: Fique
  rationale: O imperativo de עמד ordena que Jael permaneça ou tome posição à entrada. Em português, “Fique à entrada” expressa esse sentido de modo mais natural do que o literal “Fique de pé”.
- source_word: פֶּתַח הָאֹהֶל
  choice: à entrada da tenda
  rationale: פֶּתַח designa a abertura ou entrada; “entrada da tenda” é claro, natural e adequado ao cenário.
- source_word: וְהָיָה אִם
  choice: Se
  rationale: A construção introduz uma situação condicional. O simples “Se” comunica seu valor em português sem reproduzir um hebraísmo desnecessário.
- source_word: אִישׁ
  choice: algum homem
  rationale: אִישׁ ocorre tanto na condição como na pergunta e significa “homem”. A tradução mantém a referência masculina e a repetição lexical do hebraico.
- source_word: יָבוֹא
  choice: vier
  rationale: בוא significa aqui “vir” ou “chegar”; “vier” ajusta-se naturalmente à oração condicional.
- source_word: וּשְׁאֵלֵךְ וְאָמַר
  choice: e perguntar
  rationale: Literalmente, “e perguntar a você e disser”. Em português, “perguntar” introduz naturalmente a fala direta, sem perda de conteúdo.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: Há algum homem aqui?
  rationale: A construção pergunta pela presença de um homem. “Há algum homem aqui?” preserva o substantivo masculino e soa idiomático.
- source_word: אָיִן
  choice: Não
  rationale: A resposta hebraica é breve e negativa; “Não” conserva sua concisão e naturalidade.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta permanece concisa. O tratamento por “você” evita a forma regional “tu” e reproduz claramente as formas femininas singulares dirigidas a Jael.
