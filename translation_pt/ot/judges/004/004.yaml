  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: pt
  text: Débora, uma mulher, profetisa, esposa de Lapidote, julgava Israel naquele tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: uma mulher profetisa
  rationale: Mantém os dois elementos explícitos do hebraico — “mulher” e “profetisa” — sem reduzir a expressão apenas ao título.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: esposa de Lapidote
  rationale: Adota a leitura tradicional de לַפִּידוֹת como nome próprio e traduz אֵשֶׁת naturalmente como “esposa de”.
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: julgava Israel
  rationale: O particípio indica atividade em curso; “julgava” preserva o sentido verbal e evita restringir o papel a um título institucional.
- source_word: בָּעֵת הַהִיא
  choice: naquele tempo
  rationale: Equivalente corrente e fiel para a expressão temporal hebraica.
theological_decisions:
- issue: A identificação e a função pública de Débora
  choice: Preservar explicitamente “mulher profetisa” e “julgava Israel”
  alternative: Simplificar para “a profetisa Débora era juíza de Israel”
  rationale: A formulação escolhida conserva tanto a ênfase lexical do hebraico quanto o aspecto contínuo da atuação de Débora, sem acrescentar qualificações confessionais.
- issue: Sentido de לַפִּידוֹת
  choice: Tratar como o nome próprio Lapidote
  alternative: Entender descritivamente como “mulher de tochas” ou expressão semelhante
  rationale: A leitura como nome do marido é a interpretação tradicional e contextual mais adequada, embora a forma hebraica permita discussão lexical.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A leve repetição conceitual em “uma mulher profetisa” é mantida deliberadamente por corresponder ao texto hebraico.
