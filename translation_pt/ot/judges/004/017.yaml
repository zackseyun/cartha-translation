  verdict: revise
  source_fidelity: 'O sentido do hebraico está bem representado: Sísera foge a pé para a tenda de Jael, e a relação pacífica entre Jabim e a casa de Héber explica a escolha desse destino. A designação conjugal de Jael, porém, deve ser expressa de modo menos ambíguo em português.'
  naturalness: O texto é claro, moderno e de leitura natural. “Esposa de Héber” é mais preciso e idiomático neste contexto do que “mulher de Héber”, que pode ter leitura genérica em português. A nota sobre “Mas” deve estar ancorada na palavra a que se refere.
  terminology: “Sísera”, “Jael”, “Héber”, “queneu”, “Jabim”, “Hazor”, “paz” e “casa” são escolhas adequadas. “Casa” preserva apropriadamente a amplitude de בֵּית; a nota explica seu alcance social sem impor uma única interpretação.
  issues:
