  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: pt
  text: Mas[a] Sísera fugiu a pé para a tenda de Jael, esposa de Héber, o queneu, porque havia paz entre Jabim, rei de Hazor, e a casa de Héber, o queneu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Sísera fugiu a pé”. A conjunção hebraica também pode ser traduzida simplesmente por “e”; “mas” expressa o contraste sugerido pelo contexto narrativo.'
    reason: alternative_reading
  - marker: b
    text: Aqui, “casa de Héber” significa a família, a unidade doméstica ou o clã de Héber.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: Mas Sísera
  rationale: A conjunção וְ pode ser traduzida simplesmente por “e”, mas aqui o contexto narrativo favorece o valor contrastivo de “mas”, após a derrota do exército e o abandono do carro.
- source_word: נָ֣ס בְּ/רַגְלָ֔י/ו
  choice: fugiu a pé
  rationale: נָס significa normalmente “fugir”, e a expressão idiomática בְּרַגְלָיו indica que Sísera seguiu sem veículo, isto é, “a pé”.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: para a tenda de Jael
  rationale: Tradução direta da construção hebraica, natural em português e sem explicitar além do texto.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: mulher de Héber, o queneu
  rationale: “Mulher de” comunica naturalmente a relação conjugal neste contexto; “o queneu” identifica Héber por seu povo.
- source_word: כִּ֣י שָׁל֗וֹם
  choice: porque havia paz
  rationale: כִּי introduz a razão da escolha do destino, e שָׁלוֹם descreve relações pacíficas sem exigir a ideia mais específica de uma aliança formal.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: entre Jabim, rei de Hazor, e
  rationale: Preserva a relação expressa no hebraico e apresenta o título de Jabim em aposição clara e natural.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: a casa de Héber, o queneu
  rationale: “Casa” preserva a amplitude social de בֵּית, que pode designar a família, a unidade doméstica ou o clã de Héber.
theological_decisions: []
