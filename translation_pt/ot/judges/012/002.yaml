base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: pt
  text: 'Jefté lhes disse: “Eu e o meu povo estávamos em um conflito intenso com os amonitas[a]. Clamei a vocês por ajuda, mas vocês não me salvaram da mão deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Eu era homem de contenda, eu e o meu povo, com os filhos de Amom, intensamente”.'
    reason: Registra a forma incomum e mais formal do hebraico, preservando sua possível ambiguidade sem tornar o texto principal artificial.
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: estávamos em um conflito intenso
  rationale: A construção literalmente incomum, “eu era homem de contenda... muito”, funciona de modo predicativo com היה e descreve a situação de Jefté e seu povo. A formulação natural em português preserva a intensidade de מְאֹד sem atribuir necessariamente a Jefté um caráter briguento.
- source_word: וְעַמִּי
  choice: e o meu povo
  rationale: עַם designa normalmente o povo ligado a Jefté; não há base suficiente para restringir o sentido a exército ou parentes.
- source_word: וּבְנֵי עַמּוֹן
  choice: com os amonitas
  rationale: “Amonitas” é o gentílico natural em português para o hebraico literalmente traduzível como “filhos de Amom”.
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: Clamei a vocês por ajuda
  rationale: זעק indica aqui um clamor ou apelo por socorro. “Por ajuda” explicita de modo natural em português a finalidade contextual sem reduzir o verbo a uma simples convocação.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: mas vocês não me salvaram
  rationale: O hifil de ישׁע significa salvar ou livrar. “Salvaram” é direto e adequado ao contexto militar.
- source_word: מִיָּדָם
  choice: das mãos deles
  rationale: Mantém a imagem hebraica da mão como poder ou domínio, em uma expressão compreensível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução prioriza equivalência ótima, mantém a imagem “das mãos deles” e evita transformar a expressão hebraica em uma afirmação inequívoca sobre o caráter de Jefté.
