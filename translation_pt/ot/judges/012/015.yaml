base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: pt
  text: Abdom, filho de Hilel, o piratonita, morreu e foi sepultado em Piratom, na terra de Efraim, na região montanhosa dos amalequitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “no monte do amalequita”. O hebraico provavelmente emprega um gentílico singular em sentido coletivo ou territorial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O verbo מות denota diretamente a morte; “morreu” é claro, natural e evita eufemismo.
- source_word: עַבְדּוֹן
  choice: Abdom
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: בֶּן הִלֵּל
  choice: filho de Hilel
  rationale: Reproduz naturalmente a relação de filiação expressa pela construção hebraica.
- source_word: הַפִּרְעָתוֹנִי
  choice: o piratonita
  rationale: Mantém o gentílico que identifica Abdom por sua procedência.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Expressa o nifal passivo de קבר em português corrente e digno.
- source_word: בְּפִרְעָתוֹן
  choice: em Piratom
  rationale: Emprega a forma portuguesa tradicional do topônimo e preserva o sentido locativo da preposição.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: na terra de Efraim
  rationale: Preserva o substantivo explícito אֶרֶץ e a referência geográfica.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: na região montanhosa dos amalequitas
  rationale: Em descrições regionais, הַר pode designar uma região montanhosa; o gentílico singular pode ter sentido coletivo ou territorial.
