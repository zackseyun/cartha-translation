lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: Preserva a terminologia recorrente do livro de Juízes para a atuação dos juízes, sem limitar a função a liderança militar ou governo administrativo.
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: Reproduz a referência pronominal ao juiz mencionado anteriormente, sem inserir explicitamente o nome de Ibsã, que não aparece neste versículo.
- source_word: אֵילוֹן
  choice: Elom
  rationale: Emprega a forma do nome consolidada na tradição bíblica em português e adequada à leitura portuguesa.
- source_word: הַזְּבוּלֹנִי
  choice: o zebulonita
  rationale: Expressa diretamente o gentílico hebraico, que identifica a afiliação tribal de Elom.
- source_word: עֶשֶׂר שָׁנִים
  choice: durante dez anos
  rationale: Forma idiomática e clara de indicar a duração da atuação de Elom.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: julgou Israel durante dez anos
  rationale: Condensa a repetição verbal hebraica, cuja segunda ocorrência especifica a duração, produzindo uma frase natural em português sem perda de conteúdo.
