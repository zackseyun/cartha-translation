base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: pt
  text: 'Gileade tomou os pontos de travessia do Jordão contra Efraim. E, quando algum dos fugitivos de Efraim dizia: “Deixem-me atravessar”, os homens de Gileade lhe perguntavam: “Você é efraimita?” Se ele respondia: “Não”,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: tomou
  rationale: Expressa a tomada militar e o controle dos pontos estratégicos sem sugerir que os lugares foram feitos prisioneiros.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: os lugares de travessia do Jordão
  rationale: Designa os pontos rasos usados para cruzar o rio. A expressão é mais imediatamente compreensível no português atual do que o termo técnico “vaus”.
- source_word: לְאֶפְרָיִם
  choice: para impedir a passagem de Efraim
  rationale: No contexto hostil, a preposição indica que os pontos foram controlados contra Efraim; a formulação explicita naturalmente a finalidade contextual sem recorrer ao pouco idiomático “contra Efraim” após “tomou”.
- source_word: וְהָיָה כִּי
  choice: E, quando algum
  rationale: Introduz uma situação repetida. O singular distributivo “algum fugitivo” e os verbos no imperfeito comunicam essa repetição com naturalidade.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: algum fugitivo de Efraim
  rationale: פְּלִיטֵי refere-se aos que escapavam da derrota; “fugitivo” preserva esse sentido no contexto militar.
- source_word: אֶעֱבֹרָה
  choice: Deixem-me atravessar
  rationale: O coortativo de primeira pessoa exprime pedido ou desejo de atravessar; o plural se dirige naturalmente ao grupo que guardava a passagem.
- source_word: הַאֶפְרָתִי אַתָּה
  choice: Você é efraimita?
  rationale: Traduz diretamente a pergunta sobre identidade tribal em português moderno e amplamente compreensível.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: lhe perguntavam
  rationale: Embora o verbo hebraico seja literalmente “diziam”, sua função aqui é introduzir uma pergunta; o imperfeito preserva o caráter repetido do procedimento.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Se ele respondia: “Não”'
  rationale: A sequência narrativa descreve um procedimento recorrente e funciona condicionalmente em relação à ação que vem no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de circulação internacional. Preferiu-se “lugares de travessia” a “vaus” por clareza imediata. A construção distributiva no singular evita a incongruência aparente entre o plural hebraico “fugitivos” e os pronomes singulares subsequentes.
