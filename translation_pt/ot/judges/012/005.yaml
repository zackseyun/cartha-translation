revisions:
- from: 'Gileade tomou os lugares de travessia do Jordão para impedir a passagem de Efraim. E, quando algum fugitivo de Efraim dizia: “Deixem-me atravessar”, os homens de Gileade lhe perguntavam: “Você é efraimita?” Se ele respondia: “Não”,'
  to: 'Gileade tomou os pontos de travessia do Jordão contra Efraim. E, quando algum dos fugitivos de Efraim dizia: “Deixem-me atravessar”, os homens de Gileade lhe perguntavam: “Você é efraimita?” Se ele respondia: “Não”,'
  rationale: 'A revisão restringe-se à relação expressa por לְאֶפְרָיִם: substitui uma finalidade interpretativamente explicitada por “contra Efraim”. Mantêm-se a formulação clara para os vaus, o aspecto repetitivo do episódio e a construção condicional que se completa no versículo seguinte.'
