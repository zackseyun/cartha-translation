  naturalness: O português é moderno, claro e de boa legibilidade. “Pontos de travessia” é compreensível sem depender do termo técnico “vaus”. O singular distributivo “algum dos fugitivos” harmoniza naturalmente com as falas e os pronomes singulares posteriores.
  terminology: “Gileade”, “Jordão”, “Efraim” e “efraimita” são formas adequadas. “Fugitivo” transmite apropriadamente a ideia de alguém que escapou no contexto de derrota militar.
