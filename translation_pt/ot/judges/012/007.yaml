base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: pt
  text: Jefté julgou Israel durante seis anos. Depois, Jefté, o gileadita, morreu e foi sepultado nas cidades de Gileade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “nas cidades de Gileade”. O plural pode funcionar idiomaticamente para indicar uma cidade não especificada da região.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: Preserva a terminologia recorrente do livro para a atuação dos juízes-libertadores, sem reduzir a função a liderança militar ou governo administrativo.
- source_word: שֵׁשׁ שָׁנִים
  choice: durante seis anos
  rationale: Expressa naturalmente em português a duração indicada literalmente pelo hebraico.
- source_word: הַגִּלְעָדִי
  choice: o gileadita
  rationale: Reproduz de modo conciso o gentílico que identifica Jefté por sua ligação regional com Gileade.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Mantém a voz passiva do hebraico e emprega a formulação portuguesa habitual para uma notícia de sepultamento.
- source_word: בְּעָרֵי גִלְעָד
  choice: numa das cidades de Gileade
  rationale: O texto hebraico traz literalmente o plural “nas cidades de Gileade”; como se trata do sepultamento de uma pessoa, a tradução comunica a provável força distributiva ou indefinida da expressão, enquanto a nota preserva a forma literal.
