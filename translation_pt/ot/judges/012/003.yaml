base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: pt
  text: Quando vi que você não vinha prestar socorro, arrisquei a própria vida[a] e avancei contra os amonitas, e Yahweh os entregou em minha mão. Então, por que vocês vieram hoje contra mim para lutar contra mim?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “pus minha vida na palma da mão”, expressão que significa expor a própria vida ao perigo.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיעַ
  choice: Quando vi que você não vinha prestar socorro
  rationale: Mantém o destinatário no singular, como no hebraico אֵינְךָ, e traduz o particípio de ישׁע em seu sentido militar de socorrer ou livrar. A formulação sem objeto expresso preserva a ausência de objeto no texto hebraico e soa natural em português.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: arrisquei a própria vida[a]
  rationale: Expressa com clareza o sentido da expressão idiomática hebraica. A imagem literal é preservada na nota, evitando em português a possível leitura de que o personagem apenas tomou controle da própria vida.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: e avancei contra os amonitas
  rationale: No contexto militar, עבר com אֶל descreve o movimento em direção ao inimigo. “Avancei contra” comunica tanto o deslocamento quanto a hostilidade, sem sugerir mera visita.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: Yahweh os entregou nas minhas mãos
  rationale: Preserva a fórmula hebraica de vitória e a imagem de domínio expressa por “nas minhas mãos”, usando o nome divino presente no texto.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה
  choice: Então, por que vocês vieram hoje contra mim
  rationale: O verbo e os pronomes passam ao plural no hebraico. No contexto de confronto, “vieram contra mim” transmite melhor a intenção hostil do que uma tradução espacial rígida de עלה.
- source_word: לְהִלָּחֶם בִּי
  choice: para lutar contra mim
  rationale: Traduz diretamente o infinitivo de לחם com ב, mantendo o propósito hostil e a repetição enfática do original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” representa o nome divino como nome próprio, sem substituí-lo por um título.
- issue: Objeto implícito de מוֹשִׁיעַ
  choice: não vinha prestar socorro
  alternative: não vinha nos socorrer; não vinha me socorrer
  rationale: O hebraico não explicita o objeto do verbo. A formulação escolhida preserva essa abertura, sem decidir se Jefté se refere especificamente a si mesmo ou ao seu grupo.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. O contraste entre “você” no singular e “vocês” no plural reproduz a mudança de número do hebraico: primeiro Jefté se dirige ao representante e depois ao grupo. A repetição de “contra mim” foi mantida por refletir a ênfase do original.'
