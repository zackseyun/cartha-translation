lexical_decisions:
- source_word: וַיָּמָת
  choice: Então ... morreu
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português, e o verbo מוּת significa “morrer”.
- source_word: אִבְצָן
  choice: Ibsã
  rationale: Forma tradicional e amplamente reconhecida em português para a transliteração do nome hebraico.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: A forma nifal tem sentido passivo neste contexto; “foi sepultado” é uma formulação clara, digna e corrente.
- source_word: בְּבֵית לָחֶם
  choice: em Belém
  rationale: A preposição בְּ indica localização, e “Belém” é a forma portuguesa consagrada do topônimo hebraico.
