base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: pt
  text: Ele teve trinta filhos e mandou para fora trinta filhas; trouxe de fora trinta filhas para seus filhos. Julgou Israel durante sete anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ele teve
  rationale: A construção היה + ל expressa posse; “teve” é a forma natural em português.
- source_word: שְׁלֹשִׁים בָּנִים
  choice: trinta filhos
  rationale: Reproduz diretamente o numeral e o substantivo masculino no contexto familiar.
- source_word: וּשְׁלֹשִׁים בָּנוֹת
  choice: e trinta filhas
  rationale: Mantém o sentido direto de בָּנוֹת e o paralelismo familiar.
- source_word: שִׁלַּח הַחוּצָה
  choice: que mandou para fora
  rationale: Preserva a ação de “mandar/enviar” e a direção “para fora”, sem explicitar no texto principal que se tratava de casamento.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: e trouxe de fora trinta filhas para os seus filhos
  rationale: Conserva a repetição hebraica de “filhas” e a oposição entre mandar para fora e trazer de fora, deixando a nota explicar o provável contexto matrimonial.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Julgou Israel
  rationale: Mantém a terminologia recorrente do livro para a função dos juízes, sem reduzi-la a apenas liderar ou governar.
- source_word: שֶׁבַע שָׁנִים
  choice: durante sete anos
  rationale: “Durante” expressa naturalmente em português a extensão temporal.
theological_decisions:
- issue: Natureza das alianças familiares implícitas
  choice: Manter no texto principal a formulação concreta “filhas” e “para fora/de fora”
  alternative: Explicitar que Ibzã casou suas filhas fora do clã e trouxe esposas de fora para os filhos
  rationale: O contexto aponta fortemente para casamentos e alianças fora da casa ou do clã, mas o hebraico não usa aqui o verbo específico “casar”; a nota comunica a implicação sem substituir a formulação do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A tradução conserva o contraste hebraico entre “para fora” e “de fora” e mantém “julgou” como termo característico do livro.
