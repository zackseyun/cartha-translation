base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: pt
  text: 'Então lhe disseram: “Por favor, diga ‘Shibólet’[a].” Mas ele disse: “Sibólet”, pois não conseguia pronunciá-la daquela maneira. Então o agarraram e o degolaram nos vaus do Jordão. Naquele tempo, caíram quarenta e dois mil de Efraim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Shibólet” pode significar “espiga” ou “corrente de água”; aqui, porém, a palavra é usada como teste de pronúncia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Por favor, diga
  rationale: O imperativo de אמר acompanhado de נָא tem força cortês ou solicitante. A formulação é natural em português moderno e conserva esse tom.
- source_word: שִׁבֹּלֶת
  choice: Shibólet
  rationale: Aqui o termo funciona como palavra-teste de pronúncia, por isso foi transliterado em vez de traduzido. A grafia com “Sh” torna perceptível ao leitor moderno o contraste fonético com “Sibólet”.
- source_word: סִבֹּלֶת
  choice: Sibólet
  rationale: A transliteração conserva a pronúncia alterada que identifica o efraimita e mantém claramente o contraste entre os sons iniciais.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: pois não conseguia pronunciá-la daquela maneira
  rationale: A expressão significa literalmente que ele não conseguia preparar ou dirigir a fala daquela forma. No contexto, refere-se à incapacidade de articular a pronúncia exigida; “pronunciá-la daquela maneira” comunica isso sem classificá-la como moralmente ou linguisticamente incorreta.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: o agarravam
  rationale: אחז denota agarrar ou apoderar-se. O imperfeito narrativo em contexto distributivo foi vertido de modo a retratar o procedimento repetido com cada pessoa submetida ao teste.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: o degolavam
  rationale: שׁחט designa matar por corte da garganta e é mais gráfico que um simples “matar”. “Degolavam” preserva a brutalidade e a precisão da ação.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: junto aos vaus do Jordão
  rationale: מַעְבְּרוֹת são lugares de travessia de um rio. “Vaus” é conciso e preciso, e אֶל neste contexto local admite a ideia de junto a ou nos pontos de travessia.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: caíram ... de Efraim
  rationale: Em contexto de conflito, נפל é uma forma convencional de dizer que alguém morreu. “De Efraim” mantém a construção do hebraico sem acrescentar uma categoria ausente do texto.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: quarenta e dois mil
  rationale: O número cardinal foi conservado diretamente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência verbal foi apresentada no aspecto habitual (“diziam”, “dizia”, “agarravam”, “degolavam”) porque o contexto descreve o procedimento aplicado repetidamente aos fugitivos, sem apagar o foco individual do teste. As transliterações “Shibólet” e “Sibólet” tornam audível e visível o contraste decisivo.
