  verdict: revise
  source_fidelity: A tradução preserva o contraste decisivo entre Shibólet e Sibólet, o sentido de teste de pronúncia, a violência expressa por שׁחט e o total de quarenta e dois mil. Contudo, os imperfeitos portugueses (“diziam”, “dizia”, “agarravam”, “degolavam”) apresentam a cena como procedimento habitual/repetido, enquanto a cadeia narrativa hebraica usa formas wayyiqtol para os acontecimentos narrados. “Junto aos vaus” também é menos direto que a localização indicada pelo hebraico.
  naturalness: O texto é claro e de registro adequado. O pretérito perfeito torna a progressão narrativa mais natural e idiomática neste versículo. “Nos vaus do Jordão” é conciso e preciso.
  terminology: As transliterações “Shibólet” e “Sibólet” representam adequadamente a oposição entre שׁ e ס. “Degolaram” conserva de modo apropriado a força de שׁחט; “Efraim” e “Jordão” estão corretos. A nota lexical é útil e não impõe uma única acepção disputada.
