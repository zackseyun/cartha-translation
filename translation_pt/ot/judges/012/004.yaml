source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: pt
  text: 'Então Jefté reuniu todos os homens de Gileade e lutou contra Efraim. E os homens de Gileade feriram os efraimitas[a], porque estes tinham dito: “Vocês, gileaditas, são fugitivos de Efraim, em meio a Efraim e em meio a Manassés”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da acusação final é difícil. Outra tradução possível é: “Vocês são fugitivos de Efraim, ó Gileade, entre Efraim e entre Manassés”.'
    reason: Leitura alternativa que torna visível a ambiguidade sintática do hebraico.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: קבץ significa reunir ou ajuntar. “Reuniu” é natural em português e, no contexto, comunica a mobilização militar sem acrescentar a ideia específica de recrutamento formal.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: todos os homens de Gileade
  rationale: A expressão significa literalmente “todos os homens de Gileade”. O contexto indica homens aptos para a batalha, mas a formulação mantém a expressão hebraica sem especificar “guerreiros”.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: lutou contra Efraim
  rationale: O verbo לחם no nifal denota combater. Em português, “lutar contra” expressa de modo claro e natural o confronto hostil.
- source_word: וַיַּכּוּ
  choice: derrotaram
  rationale: נכה pode significar ferir, abater ou derrotar. Neste relato de combate, “derrotaram” preserva o sentido militar sem afirmar que todos foram mortos.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão apresentada para a ação e é a ligação causal mais clara no português atual.
- source_word: אֶפְרַיִם
  choice: os efraimitas
  rationale: Na função de objeto coletivo, o topônimo Efraim representa seu povo. “Os efraimitas” evita uma formulação pouco natural em português, sem mudar o referente.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: fugitivos de Efraim
  rationale: פְּלִיטִים designa pessoas que escaparam ou fugiram. “Fugitivos” conserva a força depreciativa da provocação e não resolve a relação sintática ambígua com “Efraim”.
- source_word: אַתֶּם גִּלְעָד
  choice: Vocês, gileaditas
  rationale: O hebraico emprega o nome do território coletivamente para seus habitantes. “Gileaditas” é a forma idiomática em português, e “vocês” representa o pronome plural explícito.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: no meio de Efraim e no meio de Manassés
  rationale: בְּתוֹךְ significa “no meio de” ou “entre”. A repetição foi mantida por corresponder à estrutura enfática do hebraico, sem adotar a interpretação mais específica “entre Efraim e Manassés”.
theological_decisions:
- issue: Insulto sintaticamente difícil na oração final
  choice: “Vocês, gileaditas, são fugitivos de Efraim, no meio de Efraim e no meio de Manassés.”
  alternative: “Vocês são fugitivos de Efraim, ó Gileade, entre Efraim e entre Manassés.”
  rationale: A acusação hebraica é comprimida e sintaticamente obscura. O texto principal preserva o discurso direto, o valor lexical de פְּלִיטֵי e a repetição de בְּתוֹךְ, sem transformar a provocação numa explicação histórica ou tribal mais definida do que o original permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jefté”, “Gileade”, “Efraim” e “Manassés” seguem formas bíblicas correntes. A repetição deliberada da acusação foi conservada, apesar de soar incomum, para não ocultar a dificuldade do original.
