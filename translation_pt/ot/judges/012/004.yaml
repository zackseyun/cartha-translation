    issue: «Derrotaram os efraimitas» é mais conclusivo que o verbo hebraico וַיַּכּוּ.
    rationale: נכה significa primariamente golpear ou ferir; embora possa, em contexto, abarcar derrota, o versículo não declara por si só uma derrota completa. «Feriram» mantém a violência da ação sem antecipar ou ampliar seu resultado.
