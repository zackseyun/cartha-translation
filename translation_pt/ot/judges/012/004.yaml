- from: 'Então Jefté reuniu todos os homens de Gileade e lutou contra Efraim. E os homens de Gileade derrotaram os efraimitas[a], porque estes tinham dito: “Vocês, gileaditas, são fugitivos de Efraim, no meio de Efraim e no meio de Manassés”.'
  to: 'Então Jefté reuniu todos os homens de Gileade e lutou contra Efraim. E os homens de Gileade feriram os efraimitas[a], porque estes tinham dito: “Vocês, gileaditas, são fugitivos de Efraim, em meio a Efraim e em meio a Manassés”.'
  rationale: A única revisão necessária substitui «derrotaram» por «feriram», para refletir de modo mais próximo e não excessivamente conclusivo o verbo hebraico נכה. Também se emprega «em meio a» na repetição final, preservando o paralelismo hebraico em português mais idiomático. A nota mantém explicitamente a alternativa sintática sem escolher uma interpretação histórica ou tribal específica.
