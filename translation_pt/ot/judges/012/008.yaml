  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: pt
  text: Depois dele, Ibsã, de Belém,[a] julgou Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ibsã, natural de Belém”. A preposição hebraica pode indicar origem ou associação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: Em Juízes, שׁפט é o termo recorrente para a atuação dos juízes de Israel. “Julgou” preserva essa terminologia e pode abranger a função de governar e liderar.
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: A preposição com sufixo pronominal indica sucessão em relação ao juiz mencionado anteriormente. O antecedente é claro no contexto, sem necessidade de acrescentar o nome de Jefté.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: אֶת marca o objeto direto e não requer tradução própria em português; Israel é o povo sobre o qual Ibsã exerceu a função de juiz.
- source_word: אִבְצָן
  choice: Ibsã
  rationale: Forma tradicional e corrente em português para a transliteração do nome hebraico אִבְצָן.
- source_word: מִבֵּית לָחֶם
  choice: de Belém
  rationale: A preposição מִן pode indicar origem ou associação. “De Belém” é natural em português e preserva essa amplitude sem tornar explícita apenas uma das possibilidades.
theological_decisions: []
translation_notes:
  register: Tradução breve, digna e corrente. A ordem foi ajustada para a sintaxe natural do português, mantendo a fórmula de sucessão e a terminologia recorrente de Juízes. O marcador foi colocado após “Belém”, expressão à qual a nota se refere.
