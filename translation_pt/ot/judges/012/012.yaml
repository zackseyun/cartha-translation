base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: pt
  text: Então Elom, o zebulonita, morreu e foi sepultado em Aijalom, na terra de Zebulom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no território de Zebulom”.
    reason: Alternativa lexical para אֶרֶץ, que neste contexto pode indicar a região ou o território pertencente à tribo de Zebulom.
lexical_decisions:
- source_word: וַיָּמָת
  choice: Então ... morreu
  rationale: O wayyiqtol de מות dá continuidade à sequência narrativa; “Então ... morreu” expressa essa progressão de modo natural e preserva o sentido simples do verbo.
- source_word: אֵלוֹן
  choice: Elom
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada ao uso bíblico corrente em português.
- source_word: הַזְּבוּלֹנִי
  choice: o zebulonita
  rationale: O gentílico com artigo identifica a afiliação tribal ou regional de Elom; “zebulonita” é a forma concisa e corrente em português.
- source_word: וַיִּקָּבֵר
  choice: e foi sepultado
  rationale: O nifal de קבר tem sentido passivo, “foi sepultado”. A coordenação simples acompanha a estrutura narrativa hebraica com naturalidade.
- source_word: בְּאַיָּלוֹן
  choice: em Aijalom
  rationale: O nome do lugar é transliterado segundo a forma bíblica corrente em português, e a preposição “em” expressa naturalmente o local do sepultamento.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: na terra de Zebulom
  rationale: אֶרֶץ pode designar terra ou território; “terra de Zebulom” mantém proximidade formal e comunica claramente a localização geográfica.
