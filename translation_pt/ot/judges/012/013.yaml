lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: Preserva o termo recorrente do livro para a atuação dos juízes, sem restringir seu sentido mais amplo de governar ou liderar.
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: Expressa de modo direto e natural a sucessão em relação ao juiz anterior.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: O marcador hebraico de objeto direto não é traduzido; Israel é o povo sobre o qual Abdom exerceu sua função.
- source_word: עַבְדּוֹן
  choice: Abdom
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן הִלֵּל
  choice: filho de Hilel
  rationale: Reproduz naturalmente a relação de filiação expressa pela construção hebraica.
- source_word: הַפִּרְעָתוֹנִי
  choice: o piratonita
  rationale: Mantém o gentílico hebraico, identificando Abdom como natural ou habitante de Piratom.
