base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: pt
  text: 'Então, os homens de Efraim foram convocados[a], atravessaram para Zafom[b] e disseram a Jefté: “Por que você atravessou para lutar contra os amonitas e não nos chamou para irmos com você? Queimaremos sua casa sobre você, com fogo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “clamaram” ou “se reuniram aos gritos”. O verbo hebraico pode referir-se a um clamor ou a uma convocação/reunião.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para o norte”, se o hebraico for entendido como indicação de direção, e não como o nome do lugar Zafom.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico, literalmente: “Queimaremos sua casa sobre você, com fogo”. A ameaça provavelmente significa que queimarão a casa com Jefté nela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: os homens de Efraim foram convocados
  rationale: Embora אִישׁ esteja no singular morfológico, o verbo plural seguinte, וַיֹּאמְרוּ, mostra que a expressão tem sentido coletivo. A forma passiva de צעק neste contexto indica convocação ou reunião para ação.
- source_word: וַיַּעֲבֹר
  choice: atravessaram
  rationale: A forma hebraica é singular em concordância com o coletivo, mas o português requer naturalmente o plural, pois o referente são os homens de Efraim.
- source_word: צָפוֹנָה
  choice: até Zafom
  rationale: A forma é entendida no texto principal como o topônimo Zafom. A leitura adverbial “para o norte” continua possível e é registrada em nota.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: para lutar contra os amonitas
  rationale: “Amonitas” comunica naturalmente o gentílico expresso literalmente por “filhos de Amom”, e “lutar contra” preserva o sentido militar.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: e não nos chamou para irmos com você
  rationale: קרא indica aqui chamar ou convocar para participar da campanha. A construção é clara e natural em português.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: Queimaremos a sua casa com você dentro dela
  rationale: A expressão hebraica descreve literalmente a casa sendo queimada “sobre” Jefté; em português, a formulação explicita o sentido provável da ameaça sem enfraquecer sua violência. A menção separada ao fogo seria redundante na expressão idiomática portuguesa “queimar”.
