base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: pt
  text: O povo — os líderes de Gileade[a] — disseram uns aos outros:[b] “Quem é o homem que começará a lutar contra os amonitas? Ele se tornará chefe de todos os habitantes de Gileade.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico justapõe “o povo” e “os líderes de Gileade” sem conjunção. A construção pode ser entendida como aposição, como no texto, ou como coordenação: “o povo e os líderes de Gileade”.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Literalmente: “cada homem ao seu companheiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: O povo, isto é, os líderes de Gileade
  rationale: 'Os dois sintagmas aparecem justapostos, sem conjunção. A leitura principal os entende em aposição: o povo referido aqui é representado ou identificado por seus líderes. “Isto é” torna essa relação compreensível em português, enquanto a nota registra a ambiguidade sintática.'
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: uns aos outros
  rationale: Expressa naturalmente em português o sentido recíproco da construção distributiva, cujo teor literal é “cada homem ao seu companheiro”.
- source_word: מִי הָאִישׁ
  choice: Quem é o homem
  rationale: Preserva o substantivo masculino explícito אִישׁ e a forma direta da pergunta sobre o futuro líder militar.
- source_word: יָחֵל לְהִלָּחֵם
  choice: começará a lutar
  rationale: O hifil de חלל significa aqui “começar”, seguido do infinitivo militar de לחם. O futuro português comunica o caráter prospectivo da deliberação.
- source_word: בִּבְנֵי עַמּוֹן
  choice: contra os amonitas
  rationale: É o equivalente português corrente do etnônimo hebraico literalmente formado como “filhos de Amom”, sem alterar a referência ao povo de Amom.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: Ele se tornará chefe
  rationale: Comunica o resultado político da escolha e o sentido de liderança de רֹאשׁ. “Chefe” é mais natural em português atual do que a reprodução rígida da metáfora “cabeça”.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: de todos os habitantes de Gileade
  rationale: “Habitantes” traduz com clareza o particípio substantivado “os que habitam”, e a regência de “chefe de” expressa adequadamente o âmbito da autoridade.
theological_decisions:
- issue: Linguagem masculina explícita na escolha de um líder militar
  choice: Manter “o homem” no texto principal
  alternative: “a pessoa” ou simplesmente “quem”
  rationale: O hebraico emprega explicitamente אִישׁ, e o contexto trata da escolha de um comandante militar específico. A tradução preserva esse dado histórico e gramatical sem ampliá-lo para uma afirmação doutrinária.
- issue: Natureza da liderança prometida
  choice: “se tornará chefe”
  alternative: “será cabeça”
  rationale: A expressão indica autoridade sobre todos os moradores de Gileade. “Chefe” preserva o sentido político sem impor uma definição institucional ou teológica mais específica do cargo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “Gileade” e “amonitas”, formas tradicionais e naturais em português. A pontuação explicativa evita a sequência nominal obscura do hebraico, e as notas preservam tanto a ambiguidade da aposição quanto a forma literal da expressão recíproca.
