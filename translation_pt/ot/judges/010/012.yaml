  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: pt
  text: Os sidônios, Amaleque[a] e Maom[b] oprimiram vocês. Então vocês clamaram a mim, e eu os salvei da mão deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os amalequitas”. O hebraico traz “Amaleque”, nome que pode representar o povo como um todo.
    reason: lexical_alternative
  - marker: b
    text: Ou “os maonitas”. O hebraico traz “Maom”, provavelmente em referência a um povo associado a esse nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: os sidônios
  rationale: Plural gentílico que designa o povo de Sidom; “sidônios” é a forma portuguesa tradicional, clara e concisa.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: O hebraico traz o nome próprio “Amaleque”, que pode representar coletivamente seu povo. A tradução conserva essa forma sem explicitar no corpo do texto “os amalequitas”.
- source_word: מָעוֹן
  choice: Maom
  rationale: O texto consonantal traz o nome próprio Maom. A transliteração preserva a forma do hebraico, enquanto a nota registra que provavelmente se refere a um povo.
- source_word: לָחֲצוּ
  choice: oprimiram
  rationale: O verbo expressa pressão hostil, aflição ou opressão; “oprimiram” comunica naturalmente a dominação sofrida por Israel.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: vocês clamaram a mim
  rationale: A expressão indica um apelo urgente dirigido a Deus. “Clamaram a mim” mantém tanto a intensidade quanto a direção do clamor.
- source_word: וָאוֹשִׁיעָה
  choice: eu os salvei
  rationale: O verbo ישׁע significa salvar ou livrar. “Salvei” é direto e preserva sua ligação lexical com a linguagem bíblica de salvação.
- source_word: מִיָּדָם
  choice: da mão deles
  rationale: Mantém o idioma hebraico de ser salvo da “mão” de alguém, isto é, de seu poder ou domínio, numa formulação compreensível em português.
