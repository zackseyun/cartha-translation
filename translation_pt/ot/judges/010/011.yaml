  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: pt
  text: 'E Yahweh disse aos filhos de Israel[a]: “Não foi do Egito, dos amorreus, dos amonitas e dos filisteus que eu os livrei[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Israel”; a expressão designa coletivamente os israelitas.'
    reason: lexical_alternative
  - marker: b
    text: A oração hebraica é elíptica neste versículo; “que eu os livrei” foi explicitado com base no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa usual de אמר, introduzindo discurso direto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão familiar hebraica, que também funciona como designação coletiva do povo.
- source_word: הֲלֹא
  choice: Não foi ... que
  rationale: Expressa naturalmente em português a pergunta retórica negativa e acomoda a construção elíptica do hebraico.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: מן indica origem ou procedência; a forma mantém o paralelismo da enumeração.
- source_word: הָאֱמֹרִי
  choice: dos amorreus
  rationale: O singular coletivo hebraico designa o povo amorreu; o plural é natural em português.
- source_word: בְּנֵי עַמּוֹן
  choice: dos amonitas
  rationale: Emprega o gentílico português corrente para a designação étnica hebraica, literalmente 'filhos de Amom'.
- source_word: פְּלִשְׁתִּים
  choice: dos filisteus
  rationale: Equivalente português tradicional e claro do plural étnico hebraico.
- source_word: '[verbo implícito pelo contexto]'
  choice: eu os livrei
  rationale: Completa em português a oração elíptica do hebraico; 'livrei' comunica resgate da opressão sem introduzir uma noção especificamente espiritual de salvação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: Conserva a imagem genealógica do original, enquanto a nota esclarece seu valor coletivo.
- issue: Complementação da pergunta elíptica
  choice: que eu os livrei
  alternative: deixar a frase incompleta; 'que eu os salvei'
  rationale: O hebraico depende do contexto para a ação verbal. A complementação é necessária para uma frase portuguesa inteligível e mantém o sentido histórico de libertação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica foi estruturada de modo natural, e a repetição das preposições foi reduzida sem apagar os quatro termos da enumeração.
