  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: pt
  text: Vão e clamem aos deuses que escolheram; que eles os salvem no tempo da angústia de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles os salvarão”. A forma hebraica também pode ser traduzida como futuro simples, mas, neste contexto, funciona como um desafio irônico.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Vão
  rationale: Imperativo plural de הלך, aqui com força de despedida e repreensão. “Vão” é direto, natural e preserva a concisão do hebraico.
- source_word: וְזַעֲקוּ
  choice: e clamem
  rationale: זעק indica um clamor urgente por socorro. “Clamem” conserva a intensidade e a dimensão de apelo, sem soar coloquial.
- source_word: אֶל הָאֱלֹהִים
  choice: aos deuses
  rationale: Embora אֱלֹהִים possa ser formalmente ambíguo, o contexto e o pronome enfático plural הֵמָּה exigem aqui referência aos deuses estrangeiros escolhidos por Israel.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: que vocês escolheram
  rationale: בחר com ב expressa a escolha desses deuses. A construção portuguesa direta é idiomática e comunica o sentido sem reproduzir mecanicamente a preposição hebraica.
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome independente é enfático. O sujeito explícito “eles” preserva essa ênfase natural em português.
- source_word: יוֹשִׁיעוּ
  choice: que eles os salvem
  rationale: O hifil de ישׁע significa “salvar, livrar”. No contexto, a forma tem força de desafio irônico, adequadamente expressa pela construção volitiva “que ... salvem”.
- source_word: בְּעֵת
  choice: no tempo da
  rationale: Mantém a construção temporal nominal do hebraico em português claro e natural.
- source_word: צָרַתְכֶם
  choice: sua angústia
  rationale: צָרָה designa aflição, aperto ou angústia em situação de crise. “Angústia” combina naturalmente com “clamar” e “salvar” e preserva a gravidade do contexto.
theological_decisions:
- issue: Força contextual de יוֹשִׁיעוּ
  choice: 'Desafio irônico: “que eles os salvem”'
  alternative: 'Futuro simples: “eles os salvarão”'
  rationale: Na repreensão do SENHOR a Israel, a frase desafia o povo a procurar socorro nos deuses que escolheu, e não promete que esses deuses realmente o salvarão. A tradução preserva essa força retórica sem acrescentar uma indicação explícita de sarcasmo ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo indicado pelas formas hebraicas. A ordem e a concisão do original foram preservadas tanto quanto permite a naturalidade em português.
