theological_decisions:
- issue: Relação entre abandonar Deus e servir aos baalins
  choice: pois abandonamos o nosso Deus e servimos aos baalins
  alternative: porque abandonamos o nosso Deus para servir aos baalins
  rationale: Preserva as duas ações coordenadas no hebraico e não acrescenta uma relação de finalidade que o texto não explicita.
