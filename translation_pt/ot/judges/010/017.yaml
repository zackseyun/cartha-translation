base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: pt
  text: Então os amonitas foram convocados[a] e acamparam em Gileade; e os filhos de Israel se reuniram e acamparam em Mispá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então os amonitas deram um grito e acamparam em Gileade”. O verbo hebraico pode significar “clamar” ou “gritar”, embora neste contexto provavelmente se refira à convocação para a batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: foram convocados
  rationale: Embora צעק normalmente expresse clamor, o contexto militar e o acampamento imediato favorecem aqui o sentido de convocação ou mobilização. A alternativa lexical é preservada em nota.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: A expressão literalmente significa “filhos de Amom”, mas “amonitas” é a designação natural e inequívoca do povo em português.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: חנה indica armar ou estabelecer acampamento; “acamparam” é corrente e conserva o cenário militar.
- source_word: בַּגִּלְעָד
  choice: em Gileade
  rationale: A preposição ב com o nome da região é naturalmente traduzida por “em”.
- source_word: וַיֵּאָסְפוּ
  choice: se reuniram
  rationale: A forma verbal de אסף descreve a reunião ou concentração coletiva dos israelitas, aqui para mobilização.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a designação hebraica tradicional do povo da aliança, sem impedir a compreensão moderna.
- source_word: בַּמִּצְפָּה
  choice: em Mispá
  rationale: Em português, “acampar em” é a construção idiomática natural tanto para localidades quanto para pontos de reunião.
theological_decisions: []
