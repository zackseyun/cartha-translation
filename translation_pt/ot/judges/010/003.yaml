  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: pt
  text: Depois dele[a], levantou-se Jair, o gileadita, e julgou Israel durante vinte e dois anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Depois dele veio Jair», na fórmula de sucessão do início do versículo.'
