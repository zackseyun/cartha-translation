lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: Depois dele, levantou-se
  rationale: A expressão hebraica introduz o líder seguinte na sequência narrativa. A tradução mantém tanto a referência ao antecessor quanto o verbo קום, em linguagem portuguesa natural e digna.
- source_word: יָאִיר
  choice: Jair
  rationale: O nome próprio é transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: הַגִּלְעָדִי
  choice: o gileadita
  rationale: O gentílico identifica Jair por sua origem ou ligação regional com Gileade; a forma adjetiva preserva de modo conciso a construção hebraica.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: e julgou Israel
  rationale: Em Juízes, שפט descreve a atuação ampla do juiz como dirigente, não apenas uma função judicial moderna. Manter 'julgou' preserva a terminologia recorrente e a ligação com o título do livro.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: durante vinte e dois anos
  rationale: A duração é expressa idiomaticamente em português moderno; 'durante' torna clara a extensão temporal sem alterar o conteúdo.
