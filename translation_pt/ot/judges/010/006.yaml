source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: pt
  text: Os filhos de Israel tornaram a fazer o que era mau aos olhos de Yahweh[a]. Serviram aos Baalins e às Astarotes, bem como aos deuses de Arã, de Sidom, de Moabe, dos filhos de Amom[b] e dos filisteus. Abandonaram Yahweh e não o serviram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuaram a fazer o que era mau aos olhos de Yahweh”. O verbo hebraico pode indicar repetição ou continuação.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, os deuses adorados pelos amonitas. Em hebraico, literalmente: “os deuses dos filhos de Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: tornaram a fazer
  rationale: A construção יסף com infinitivo pode indicar repetição ou continuação. “Tornaram a fazer” é idiomático em português e preserva o sentido recorrente da fórmula em Juízes; a possibilidade de continuação é registrada em nota.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo natural a expressão hebraica e sua cadência narrativa recorrente, sem restringir a referência apenas aos homens.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: fazer o que era mau aos olhos de Yahweh
  rationale: Mantém a metáfora avaliativa hebraica “aos olhos de” em português claro e atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: serviram / o serviram
  rationale: Mantém o sentido básico de עבד e preserva o contraste retórico entre servir aos deuses estrangeiros e não servir a Yahweh.
- source_word: הַבְּעָלִים
  choice: os baalins
  rationale: Emprega a forma plural portuguesa do nome cultual, refletindo as diversas manifestações locais de Baal.
- source_word: הָעַשְׁתָּרוֹת
  choice: as astarotes
  rationale: Translitera o nome cultual no plural e o mantém em paralelo com “baalins”.
- source_word: אֱלֹהֵי אֲרָם
  choice: os deuses de Arã
  rationale: Preserva o nome histórico da região, sem substituí-lo pelo nome geopolítico posterior “Síria”.
- source_word: אֱלֹהֵי צִידוֹן
  choice: os deuses de Sidom
  rationale: Tradução direta da cadeia construta, com a forma portuguesa corrente do topônimo.
- source_word: אֱלֹהֵי מוֹאָב
  choice: os deuses de Moabe
  rationale: Tradução direta e transparente da expressão hebraica.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: os deuses dos filhos de Amom
  rationale: Preserva formalmente a expressão hebraica בני עמון; a equivalência idiomática “amonitas” é esclarecida em nota.
- source_word: אֱלֹהֵי פְלִשְׁתִּים
  choice: os deuses dos filisteus
  rationale: Mantém explícito o nome do povo em uma construção portuguesa natural.
- source_word: וַיַּעַזְבוּ
  choice: abandonaram
  rationale: Expressa com clareza o rompimento de lealdade indicado pelo verbo עזב neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o caráter de nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Sentido de עבד no contexto de idolatria
  choice: serviram
  alternative: adoraram; prestaram culto
  rationale: Embora o contexto inclua adoração, “serviram” preserva tanto o campo semântico mais amplo de lealdade quanto a repetição deliberada do mesmo verbo na frase final.
- issue: Referência plural aos baalins e às astarotes
  choice: manter os plurais cultuais
  alternative: Baal e Astarote no singular; ídolos de Baal e Astarote
  rationale: Os plurais estão expressos no hebraico e podem apontar para manifestações ou objetos cultuais diversos; não devem ser uniformizados sem necessidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente reorganizada com “bem como” para evitar uma sequência excessivamente pesada, sem reduzir a enumeração hebraica. Mantiveram-se a fórmula “aos olhos de”, os nomes históricos e o contraste lexical de “servir”.
