  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: pt
  text: Então os amonitas atravessaram o Jordão para lutar também contra Judá, Benjamim e a casa de Efraim, e Israel ficou em grande aflição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: atravessaram
  rationale: Com o Jordão como objeto direto, o verbo עבר descreve claramente a travessia do rio; “atravessaram” é preciso e natural.
- source_word: בְנֵי עַמּוֹן
  choice: os amonitas
  rationale: É o gentílico corrente em português e equivale naturalmente à expressão hebraica “filhos de Amom” neste contexto narrativo.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: A forma tradicional e corrente em português identifica suficientemente o rio sem precisar acrescentar “rio”.
- source_word: לְהִלָּחֵם
  choice: para lutar
  rationale: Expressa de modo conciso o propósito militar do infinitivo hebraico, sem ampliar indevidamente para uma guerra formal.
- source_word: גַּם
  choice: também
  rationale: 'Preserva o sentido aditivo: além da opressão já descrita a leste do Jordão, os amonitas atacaram outros territórios.'
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: contra Judá, Benjamim e a casa de Efraim
  rationale: No contexto de לְהִלָּחֵם, a preposição בְּ indica os alvos do combate. “Contra” torna essa relação natural em português, enquanto “casa de Efraim” conserva בֵּית.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: Israel ficou em grande aflição
  rationale: A construção impessoal hebraica indica que Israel se encontrou em severa angústia. Esta formulação preserva o estado resultante e a forte intensificação de מְאֹד.
