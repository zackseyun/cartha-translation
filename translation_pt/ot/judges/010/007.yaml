  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: pt
  text: Então a ira de Yahweh se acendeu contra Israel[a], e ele os vendeu[b] nas mãos dos filisteus e nas mãos dos amonitas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a ira de Yahweh ardeu contra Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Vendeu-os” é uma expressão recorrente em Juízes para indicar que Yahweh entregou Israel ao domínio de inimigos como juízo.
    reason: cross_reference
  - marker: c
    text: 'Mais literalmente: “na mão dos filisteus e na mão dos filhos de Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: Preserva a metáfora hebraica de uma ira que se acende, em linguagem natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל
  choice: contra Israel
  rationale: No contexto da expressão de ira, a preposição בְּ indica o alvo contra o qual a ira se dirige.
- source_word: וַיִּמְכְּרֵם
  choice: ele os vendeu
  rationale: Mantém o sentido básico de מכר e a metáfora recorrente em Juízes para Deus entregar Israel ao domínio inimigo como juízo.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a imagem hebraica de estar sob o poder ou controle de alguém, usando a forma idiomática corrente em português.
- source_word: פְּלִשְׁתִּים
  choice: filisteus
  rationale: Forma portuguesa consagrada para esse povo.
- source_word: בְּנֵי עַמּוֹן
  choice: amonitas
  rationale: Gentílico natural e consagrado em português; a forma estruturalmente mais literal é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: A agência divina no juízo expressa por וַיִּמְכְּרֵם
  choice: ele os vendeu
  alternative: ele os entregou; ele os deixou nas mãos de
  rationale: A formulação mantém a ação atribuída a Yahweh e a severa metáfora judicial recorrente no livro, sem atenuá-la.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A formulação conserva as imagens hebraicas da ira que se acende, da venda e da mão como símbolo de domínio, recorrendo a notas quando a literalidade seria menos idiomática no texto principal.
