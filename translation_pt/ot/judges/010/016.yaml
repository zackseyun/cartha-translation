  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: pt
  text: Então eles retiraram do meio deles os deuses estrangeiros e serviram a Yahweh; e ele já não pôde suportar o sofrimento de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele ficou impaciente com o sofrimento de Israel”. Literalmente, o hebraico diz: “sua alma se encurtou por causa do sofrimento de Israel”, expressão que indica impaciência ou incapacidade de continuar suportando algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: retiraram
  rationale: O hifil de סור indica fazer afastar ou remover; “retiraram” expressa de modo natural a eliminação dos ídolos.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: os deuses estrangeiros
  rationale: A expressão designa divindades não israelitas; esta formulação é clara e corrente em português.
- source_word: מִקִּרְבָּם
  choice: do meio deles
  rationale: Preserva de perto o sentido comunitário do hebraico sem soar arcaico.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: serviram a Yahweh
  rationale: “Serviram” preserva o sentido amplo de culto, lealdade e obediência implicado por עבד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino conforme o padrão do projeto.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: ele já não pôde suportar
  rationale: A expressão literal “sua alma se encurtou” é um idioma que indica que se chegou ao limite da tolerância; esta tradução comunica naturalmente essa incapacidade de continuar suportando, enquanto a nota conserva a imagem hebraica.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: o sofrimento de Israel
  rationale: עָמָל pode denotar aflição, miséria ou sofrimento; no contexto, “sofrimento” transmite com clareza a condição angustiante de Israel.
theological_decisions:
- issue: Descrição antropopática de Yahweh em וַתִּקְצַר נַפְשׁוֹ
  choice: ele já não pôde suportar o sofrimento de Israel
  alternative: ele ficou impaciente com o sofrimento de Israel
  rationale: A tradução mantém a reação pessoal e intensa atribuída a Yahweh, sem convertê-la numa abstração doutrinária. A nota registra a metáfora literal e a alternativa possível, preservando a tensão teológica e a ambiguidade idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A conjunção “Então” liga a ação ao arrependimento descrito no contexto anterior; o ponto e vírgula separa a resposta de Israel da reação de Yahweh.
