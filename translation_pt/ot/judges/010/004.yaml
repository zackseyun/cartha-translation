base_translation:
  language: en
  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: pt
  text: Ele tinha trinta filhos, que montavam trinta jumentos, e possuíam trinta cidades. Até hoje elas são chamadas Havote-Jair e ficam na terra de Gileade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲיָרִים
  choice: jumentos
  rationale: O termo hebraico designa jumentos, aqui animais de montaria; a escolha preserva a ligação sonora do original com עָרִים, “cidades”, embora esse jogo de palavras não possa ser reproduzido naturalmente em português.
- source_word: חַוֺּת יָאִיר
  choice: Havote-Jair
  rationale: Transliteração tradicionalmente reconhecível do nome geográfico, cujo sentido aproximado é “aldeias de Jair”.
- source_word: עָרִים
  choice: cidades
  rationale: Equivalente corrente para núcleos urbanos ou povoados fortificados; mantém a formulação simples do texto.
- source_word: יִקְרְאוּ
  choice: são chamadas
  rationale: O imperfeito hebraico no contexto da expressão “até hoje” descreve a denominação ainda vigente; a passiva em português preserva o referente feminino plural, as cidades.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. “Possuíam” explicita o valor idiomático de לָהֶם (“tinham/pertenciam a eles”) sem acrescentar interpretação teológica; “elas” retoma inequivocamente as cidades.
