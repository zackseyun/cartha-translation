id: JDG.10.15
reference: Judges 10:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: pt
  text: 'E os filhos de Israel[a] disseram a Yahweh: “Pecamos. Faze conosco segundo tudo o que é bom aos teus olhos[b]. Apenas, por favor, livra-nos[c] neste dia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, tudo o que te parecer bom.
    reason: idiom_explanation
  - marker: c
    text: Ou “salva-nos” ou “resgata-nos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E ... disseram
  rationale: O wayyiqtol faz a narrativa avançar; “E ... disseram” conserva a ligação narrativa hebraica sem impor uma sequência temporal mais específica.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica formal e sua forma masculina, permanecendo clara em português; “os israelitas” é uma alternativa natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חָטָאנוּ
  choice: Pecamos
  rationale: O qatal na primeira pessoa do plural expressa de maneira direta a confissão de um ato consumado; em português, o pretérito perfeito simples é natural nesse contexto.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: Faze conosco
  rationale: Traduz diretamente o imperativo de עשה com ל, comunicando a submissão dos israelitas ao que Deus decidir fazer com eles.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: segundo tudo o que é bom aos teus olhos
  rationale: Mantém tanto a abrangência de כְּכָל quanto a imagem hebraica dos “olhos”, sem deixar a frase obscura em português.
- source_word: אַךְ
  choice: Apenas
  rationale: 'Marca a restrição da súplica: eles aceitam o que Yahweh julgar bom, mas pedem que os livre agora.'
- source_word: הַצִּילֵנוּ
  choice: livra-nos
  rationale: O hifil de נצל significa tirar alguém do perigo; “livrar” se ajusta ao registro narrativo e pactual, enquanto “salvar” e “resgatar” continuam possíveis.
- source_word: נָא
  choice: por favor
  rationale: Explicita a força suplicante da partícula na, de modo atual e natural.
- source_word: הַיּוֹם הַזֶּה
  choice: neste dia
  rationale: Conserva a expressão demonstrativa e sua solenidade imediata; “hoje” seria uma formulação mais corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Representação de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha conserva a forma e a imagem genealógica da expressão hebraica; a nota registra a alternativa coletiva natural sem alterar o sentido étnico.
- issue: Submissão expressa em כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: segundo tudo o que é bom aos teus olhos
  alternative: como te parecer melhor
  rationale: A tradução preserva a tensão entre a aceitação do juízo divino e o pedido imediato de livramento, sem transformar a fala em uma fórmula teológica mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A forma verbal “Faze” e a expressão “neste dia” mantêm a solenidade da súplica; a sintaxe continua próxima do hebraico sem soar artificial. Os marcadores foram colocados junto às expressões que efetivamente explicam.
