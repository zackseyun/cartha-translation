  source_fidelity: 'O texto traduz adequadamente todos os elementos do hebraico: a progressão narrativa («E ... disseram»), a designação «os filhos de Israel», o nome divino «Yahweh», a confissão no perfeito («Pecamos»), a submissão a Yahweh («Faze conosco segundo tudo o que é bom aos teus olhos») e a súplica restritiva e urgente por livramento «neste dia». A formulação conserva a imagem hebraica de «bom aos teus olhos» sem introduzir interpretação doutrinária.'
