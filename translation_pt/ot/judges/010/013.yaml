  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: pt
  text: Mas vocês me abandonaram e serviram a outros deuses; por isso, não os salvarei mais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livrarei” ou “resgatarei”. O verbo hebraico pode indicar libertação de inimigos, bem como salvação em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mas vocês
  rationale: A conjunção com o pronome explícito introduz contraste enfático com o contexto anterior; “Mas vocês” expressa isso de modo natural.
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: me abandonaram
  rationale: עזב denota deixar ou abandonar. “Abandonaram” conserva o peso relacional e pactual sem recorrer a linguagem antiquada.
- source_word: וַ/תַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: e serviram a outros deuses
  rationale: עבד, quando tem deuses por objeto, envolve serviço religioso e lealdade cultual. “Serviram” é direto e mais amplo que “adoraram”.
- source_word: לָכֵן
  choice: por isso
  rationale: Marca a consequência do abandono de Deus; a expressão é clara, atual e preserva a relação causal.
- source_word: לֹא אוֹסִיף לְ/הוֹשִׁיעַ אֶתְכֶם
  choice: não os salvarei mais
  rationale: A construção negativa com יסף indica que a ação não continuará ou não voltará a ocorrer. A formulação portuguesa é natural e mantém ישע como “salvar”, enquanto alternativas contextuais são registradas em nota.
theological_decisions:
- issue: Sentido de ישע no contexto da opressão narrada em Juízes
  choice: salvarei
  alternative: livrarei; resgatarei
  rationale: O contexto imediato trata de libertação de inimigos, mas ישע possui alcance mais amplo. “Salvar” preserva essa amplitude e a ligação com o tema bíblico da salvação, sem excluir a libertação histórica indicada pelo contexto.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural explícito e “não os salvarei mais” como expressão idiomática da cessação anunciada. O ponto e vírgula conserva com clareza a passagem da acusação para sua consequência.
