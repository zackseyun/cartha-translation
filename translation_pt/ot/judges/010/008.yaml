  terminology: “Filhos de Israel” preserva deliberadamente a repetição hebraica e é aceitável neste registro formal. “Amorreus” e “Gileade” estão corretos. “Além do Jordão” conserva de modo útil a perspectiva não especificada da expressão hebraica.
