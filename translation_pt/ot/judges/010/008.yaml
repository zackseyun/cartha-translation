base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: pt
  text: Naquele ano, eles despedaçaram e esmagaram os filhos de Israel[a]; durante dezoito anos, oprimiram todos os filhos de Israel que estavam além do Jordão, na terra dos amorreus, que fica em Gileade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quebraram e oprimiram os israelitas”. O hebraico emprega dois verbos fortes e quase sinônimos para intensificar a gravidade da aflição.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete “filhos de Israel” duas vezes neste versículo; a expressão foi mantida para conservar essa repetição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ
  choice: despedaçaram
  rationale: Preserva a imagem vigorosa de quebrar ou destroçar, em vez de reduzi-la ao sentido abstrato de oprimir.
- source_word: וַיְרֹצְצוּ
  choice: e esmagaram
  rationale: Mantém o paralelismo intensificador dos dois verbos hebraicos próximos em sentido e comunica a severidade da aflição.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão hebraica repetida no versículo; embora “israelitas” seja mais corrente, a formulação literal torna visível a repetição.
- source_word: בַּשָּׁנָה הַהִיא
  choice: Naquele ano
  rationale: É a forma natural em português para a expressão temporal hebraica.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: durante dezoito anos
  rationale: Explicita naturalmente em português que se trata da duração da opressão.
- source_word: אֶת כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Preserva tanto a totalidade indicada por כָּל quanto a repetição da expressão “filhos de Israel”.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: além do Jordão
  rationale: Traduz de perto o idioma geográfico sem fixar uma perspectiva direcional mais específica do que o hebraico.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: na terra dos amorreus
  rationale: Reproduz a designação territorial de modo claro e formal; o singular coletivo hebraico é expresso naturalmente pelo plural gentílico em português.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: em Gileade
  rationale: Identifica de forma concisa a localização da terra amorreia mencionada, sem criar a impressão de que toda a região de Gileade seja o antecedente de uma nova afirmação independente.
