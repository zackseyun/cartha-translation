  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: pt
  text: Ele julgou Israel durante vinte e três anos. Depois morreu e foi sepultado em Samir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: Preserva a terminologia recorrente do livro de Juízes para a atuação de seus líderes e corresponde diretamente ao verbo שׁפט.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: O marcador de objeto direto seguido do nome próprio designa Israel como o povo sobre o qual ele exerceu sua função.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: durante vinte e três anos
  rationale: Expressa de modo natural em português a duração exata indicada pelo hebraico.
- source_word: וַיָּמָת
  choice: Depois morreu
  rationale: O waw consecutivo faz a narrativa avançar; 'Depois' comunica a sequência de maneira natural, sem introduzir contraste.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: A forma nifal é passiva; esta tradução mantém o evento sem acrescentar quem realizou o sepultamento.
- source_word: בְּשָׁמִיר
  choice: em Samir
  rationale: A preposição é locativa, e o topônimo é transliterado em forma corrente e clara em português.
