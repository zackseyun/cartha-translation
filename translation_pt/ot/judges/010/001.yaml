  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: pt
  text: Depois de Abimeleque, levantou-se Tola, filho de Puá, filho de Dodô[a], homem de Issacar, para salvar Israel. Ele morava em Samir, na região montanhosa de Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «filho de seu tio». O hebraico בֶּן־דּוֹדוֹ pode ser entendido como uma genealogia em que Dodô é nome próprio ou como a expressão «filho de seu tio».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: Preserva o sentido narrativo de קום, indicando o surgimento de um líder sem pressupor uma nomeação oficial.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: Depois de Abimeleque
  rationale: Expressa de modo direto e natural a sequência temporal do hebraico.
- source_word: לְהוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: para salvar Israel
  rationale: O hifil de ישׁע denota salvar ou livrar; «salvar» mantém a amplitude do resgate sem restringi-lo ao âmbito militar.
- source_word: תּוֹלָע בֶּן פּוּאָה
  choice: Tola, filho de Puá
  rationale: Translitera os nomes próprios e reproduz com clareza a construção genealógica.
- source_word: בֶּן דּוֹדוֹ
  choice: filho de Dodô
  rationale: A vocalização massorética favorece a leitura de Dodô como nome próprio e a sequência genealógica apoia essa compreensão; a ambiguidade consonantal é registrada em nota.
- source_word: אִישׁ יִשָּׂשכָר
  choice: homem de Issacar
  rationale: Mantém-se próximo da formulação hebraica, identificando de maneira clara a afiliação tribal.
- source_word: וְהוּא יֹשֵׁב
  choice: Ele morava
  rationale: A construção participial descreve o lugar de residência; «morava» é natural e corrente em português.
- source_word: בְּשָׁמִיר
  choice: em Samir
  rationale: O topônimo é transliterado segundo uma forma natural em português.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: Comunica o sentido geográfico regional de הַר sem sugerir apenas um monte isolado.
