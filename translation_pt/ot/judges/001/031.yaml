source:
  edition: WLC
  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: pt
  text: Aser não expulsou[a] os habitantes de Aco[b], nem os habitantes de Sidom, nem os de Alabe, nem os de Aczibe, nem os de Helba, nem os de Afeque, nem os de Reobe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não desapossou” ou “não desalojou”. O verbo hebraico se refere a retirar dos ocupantes anteriores a posse da terra.
    reason: lexical_alternative
  - marker: b
    text: Aco era uma antiga cidade costeira, mais tarde conhecida como Acre.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: não expulsou
  rationale: O hifil de ירש, em contextos de conquista e ocupação territorial, indica fazer os ocupantes anteriores perderem a posse, isto é, expulsá-los ou desapossá-los. “Não expulsou” é claro, natural e adequado ao padrão recorrente de Juízes 1.
- source_word: יֹשְׁבֵי
  choice: os habitantes de / os de
  rationale: O particípio de ישב designa coletivamente os que moram em determinado lugar. A forma plena aparece no início, e “os de” evita repetição pesada sem alterar o sentido.
- source_word: עַכּוֹ
  choice: Aco
  rationale: Transliteração portuguesa direta do antigo topônimo hebraico; evita substituir o nome bíblico pelo posterior “Acre”.
- source_word: צִידוֹן
  choice: Sidom
  rationale: Forma tradicional e reconhecível em português para o topônimo fenício.
- source_word: אַחְלָב
  choice: Alabe
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas do nome próprio.
- source_word: אַכְזִיב
  choice: Aczibe
  rationale: Transliteração portuguesa do topônimo, preservando sua identidade como nome próprio.
- source_word: חֶלְבָּה
  choice: Helba
  rationale: Segue a forma consonantal e a vocalização do texto hebraico deste versículo, em transliteração apropriada ao português.
- source_word: אֲפִיק
  choice: Afeque
  rationale: Forma portuguesa convencional do topônimo hebraico.
- source_word: רְחֹב
  choice: Reobe
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: nem ... nem ... nem
  rationale: Sob o alcance do verbo negado, a repetição de וְאֶת coordena distributivamente os vários objetos. Em português, “nem” expressa com naturalidade que nenhum dos grupos enumerados foi expulso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas portuguesas reconhecíveis dos topônimos. A repetição de “nem os de” preserva a estrutura distributiva da lista sem tornar a frase excessivamente pesada. Os marcadores foram posicionados junto aos elementos efetivamente explicados pelas notas.
