  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: pt
  text: Manassés, porém, não expulsou os habitantes de Bete-Seã nem os de suas cidades dependentes[a], nem os habitantes de Taanaque e de suas cidades dependentes, nem os habitantes de Dor e de suas cidades dependentes, nem os habitantes de Ibleão e de suas cidades dependentes, nem os habitantes de Megido e de suas cidades dependentes; e os cananeus estavam decididos a habitar nessa terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “suas filhas”, isto é, as cidades menores ou povoações vinculadas à cidade principal.
    reason: cultural_note
  - marker: b
    text: 'Ou: “os cananeus estavam dispostos a habitar nessa terra”. O verbo hebraico pode expressar disposição ou determinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: não expulsou
  rationale: O hifil de ירשׁ indica aqui fazer os habitantes perderem a posse do território, isto é, expulsá-los ou desapossá-los. “Não expulsou” é claro e natural em português, e o objeto pessoal explicita quem não foi removido.
- source_word: בְּנוֹתֶיהָ
  choice: suas cidades dependentes
  rationale: Literalmente “suas filhas”, expressão que designa localidades menores vinculadas a uma cidade principal. A tradução comunica a relação administrativa sem tornar opaca a metáfora hebraica, que é registrada em nota.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: os habitantes de Dor / Ibleão / Megido
  rationale: As formas derivadas de ישׁב designam coletivamente os moradores desses lugares. “Habitantes” é atual, digno e preciso.
- source_word: וַיּוֹאֶל
  choice: insistiram
  rationale: O verbo יאל pode expressar disposição, determinação ou persistência. “Insistiram” transmite no contexto a determinação dos cananeus em continuar na terra, sem eliminar a alternativa lexical indicada em nota.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora esteja no singular morfológico, o gentílico tem sentido coletivo; o plural é a forma natural em português.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: em habitar nessa terra
  rationale: O infinitivo com ל completa o verbo anterior e preserva a ação de morar ou permanecer. “Nessa terra” reproduz o valor demonstrativo contextual de הַזֹּאת.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: Bete-Seã / Taanaque / Dor / Ibleão / Megido
  rationale: Empregam-se formas transliteradas correntes e legíveis em português para os topônimos hebraicos.
