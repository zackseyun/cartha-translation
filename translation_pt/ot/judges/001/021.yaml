base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: pt
  text: Mas os filhos de Benjamim não expulsaram os jebuseus[a] que habitavam em Jerusalém; por isso, os jebuseus têm vivido com os filhos de Benjamim em Jerusalém até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico usa literalmente o singular coletivo: “o jebuseu”; a referência, nas duas ocorrências, é ao povo jebuseu como grupo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: os jebuseus
  rationale: O hebraico emprega o singular coletivo, mas o plural é a forma natural em português para designar esse grupo étnico; a nota preserva a forma literal.
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: que habitavam em Jerusalém
  rationale: O particípio expressa residência contínua; “habitavam” comunica esse sentido com clareza e dignidade.
- source_word: הוֹרִישׁוּ
  choice: expulsaram
  rationale: Neste contexto de conquista e ocupação territorial, o verbo significa desalojar ou fazer sair os habitantes; “expulsaram” é direto e natural.
- source_word: בְּנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Preserva a construção genealógica e tribal do hebraico sem deixar de ser compreensível em português.
- source_word: וַיֵּשֶׁב
  choice: passaram a viver
  rationale: A formulação indica o início de uma convivência que, segundo a frase seguinte, continuou até o tempo do narrador.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: com os filhos de Benjamim
  rationale: Aqui אֶת indica companhia ou convivência, não objeto direto.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Mantém a fórmula temporal hebraica e sua referência ao presente do narrador.
- source_word: וְ
  choice: Mas
  rationale: A conjunção tem força contrastiva no contexto das notícias anteriores sobre conquistas.
