  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: pt
  text: Assim, os aseritas viveram entre os cananeus[a], habitantes da terra, porque não os expulsaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, «o aserita», «o cananeu» e «não o expulsou» estão no singular coletivo. A tradução usa o plural para expressar o sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: viveram
  rationale: O verbo ישׁב pode significar sentar-se, habitar ou viver. Neste contexto narrativo, “viveram” expressa de modo natural a residência continuada entre outro povo.
- source_word: הָאָשֵׁרִי
  choice: os aseritas
  rationale: O gentílico singular com artigo tem sentido coletivo e se refere à tribo de Aser; o plural é a forma natural de comunicar esse valor em português.
- source_word: בְּקֶרֶב
  choice: entre
  rationale: A expressão indica estar no meio de um grupo; “entre” é conciso e idiomático.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora seja morfologicamente singular, o termo tem valor coletivo e é identificado pela expressão plural seguinte, “habitantes daquela terra”.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: habitantes daquela terra
  rationale: A expressão participial identifica, em aposição, os cananeus. “Daquela terra” mantém a referência à terra já situada no contexto e soa natural em português.
- source_word: כִּי
  choice: porque
  rationale: Aqui a conjunção introduz a causa da situação descrita anteriormente.
- source_word: לֹא הוֹרִישׁוֹ
  choice: não os expulsaram
  rationale: O hifil de ירשׁ neste contexto significa desalojar ou expulsar os habitantes. O plural em português comunica os referentes coletivos do hebraico sem sugerir dois indivíduos isolados.
theological_decisions:
- issue: Singulares coletivos referentes à tribo e ao povo
  choice: 'Empregar plurais coletivos: “os aseritas”, “os cananeus” e “não os expulsaram”.'
  alternative: 'Conservar formalmente os singulares: “o aserita... o cananeu... não o expulsou”.'
  rationale: Os singulares hebraicos têm função coletiva comum em referências tribais e étnicas. A tradução singular em português poderia sugerir indevidamente indivíduos específicos, enquanto o contexto trata da tribo de Aser e dos habitantes cananeus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Aseritas” preserva o gentílico tribal tradicional; “expulsaram” comunica com naturalidade a ação de desalojar os habitantes.
