base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: pt
  text: O homem foi para a terra dos hititas, construiu uma cidade e lhe deu o nome de Luz[a]; esse é o nome dela até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “chamou o nome dela de Luz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָאִישׁ
  choice: O homem foi
  rationale: A forma narrativa de הלך indica que o homem mencionado anteriormente foi para outro lugar. A formulação preserva a referência masculina singular e soa natural em português.
- source_word: אֶרֶץ הַחִתִּים
  choice: a terra dos hititas
  rationale: Reproduz o sentido geográfico e étnico da construção hebraica sem definir com precisão indevida a natureza política da região.
- source_word: וַיִּבֶן עִיר
  choice: construiu uma cidade
  rationale: Traduz diretamente בנה com עִיר. “Fundou” acrescentaria uma nuance interpretativa que não precisa ser explicitada.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: lhe deu o nome de Luz
  rationale: Expressa em português corrente o idioma hebraico literalmente formulado como “chamou o nome dela de Luz”; o pronome retoma “cidade”.
- source_word: לוּז
  choice: Luz
  rationale: Mantém a transliteração tradicional do topônimo hebraico.
- source_word: הוּא שְׁמָהּ
  choice: esse é o nome dela
  rationale: A oração nominal afirma enfaticamente a continuidade do nome da cidade; “dela” deixa claro que a referência é à cidade.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: É a expressão portuguesa natural e consagrada para a fórmula temporal hebraica.
