  source_fidelity: 'A tradução preserva todos os elementos do hebraico: o homem referido anteriormente, sua ida à terra dos hititas, a construção de uma cidade, a atribuição do nome Luz e a permanência desse nome até o tempo do narrador. “Lhe deu o nome de Luz” é uma equivalência idiomática fiel para o hebraico literal “chamou o nome dela Luz”.'
