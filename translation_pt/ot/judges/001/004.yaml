  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣עַל יְהוּדָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת הַ/כְּנַעֲנִ֥י וְ/הַ/פְּרִזִּ֖י בְּ/יָדָ֑/ם וַ/יַּכּ֣וּ/ם בְּ/בֶ֔זֶק עֲשֶׂ֥רֶת אֲלָפִ֖ים אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: pt
  text: Então Judá subiu, e Yahweh entregou os cananeus e os ferezeus[a] nas mãos deles[b]. Em Bezeque, eles abateram dez mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “o cananeu e o ferezeu”; as formas singulares são usadas coletivamente para designar esses povos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na mão deles”, expressão que significa sob o poder deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Mantém o sentido básico de עלה e a forma tradicional de descrever esse deslocamento militar, sem especificar se se tratou apenas de avanço ou de subida geográfica.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Nome próprio da tribo, que funciona aqui como sujeito coletivo; por isso, o texto pode passar naturalmente do singular para o plural ao se referir às suas tropas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: os cananeus e os ferezeus
  rationale: Os gentílicos hebraicos estão formalmente no singular, mas têm sentido coletivo. O plural é a forma mais natural em português.
- source_word: בְּיָדָם
  choice: nas mãos deles
  rationale: Conserva a imagem do idioma hebraico נתן ביד e comunica de modo natural que os povos foram postos sob o poder das forças de Judá.
- source_word: וַיַּכּוּם
  choice: eles abateram
  rationale: נכה, no contexto de batalha e acompanhado de uma contagem, indica golpear ou derrubar. “Abateram” preserva a força violenta do verbo sem reduzir seu sentido simplesmente a “derrotaram”.
- source_word: בְּבֶזֶק
  choice: Em Bezeque
  rationale: A preposição בְּ localiza o confronto; “em” é natural em português diante de um nome de lugar.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: dez mil homens
  rationale: Reproduz diretamente a expressão numérica e mantém a referência aos homens envolvidos no combate, sem acrescentar a especificação interpretativa “soldados”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título ou por outra forma tradicional.
- issue: Agência divina e humana
  choice: Yahweh entrega os inimigos, e as forças de Judá os abatem
  alternative: Uniformizar toda a ação com Judá como sujeito singular ou tornar a ação humana passiva
  rationale: Mantém a distinção do hebraico entre a concessão divina da vitória e a ação coletiva dos combatentes de Judá.
- issue: Mudança do sujeito coletivo singular para o pronome plural
  choice: Judá ... eles
  alternative: Judá ... ele
  rationale: O hebraico começa com o nome tribal e verbo singular, mas depois usa formas plurais para seus integrantes. A tradução conserva essa tensão entre a tribo como unidade e seus combatentes como grupo.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente reconhecíveis no Brasil. “Subiu” preserva o movimento narrativo hebraico; “abateram” comunica a violência do contexto militar sem afirmar mais do que o verbo permite. A divisão em duas frases melhora a legibilidade sem alterar a sequência dos acontecimentos.
