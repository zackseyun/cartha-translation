base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: pt
  text: E Yahweh estava com Judá; Judá tomou posse da região montanhosa, mas não conseguiu expulsar os habitantes do vale[a], porque eles tinham carros de ferro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da planície” ou “da baixada”; o termo hebraico pode designar uma ampla região baixa.
    reason: Alternativa lexical para עֵמֶק, cujo campo semântico pode abranger vale, planície ou baixada.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino YHWH em forma reconhecível e segue a opção do projeto, sem substituí-lo por um título.
- source_word: אֶתּ יְהוּדָה
  choice: com Judá
  rationale: אֵת indica companhia neste contexto. “Judá” preserva a formulação hebraica e pode designar, por metonímia, a tribo.
- source_word: וַיֹּרֶשׁ
  choice: tomou posse de
  rationale: Com a região montanhosa como objeto, o hifil de ירש exprime adequadamente a conquista ou tomada de posse; evita confundi-lo com o infinitivo seguinte, que se refere a expulsar habitantes.
- source_word: הָהָר
  choice: a região montanhosa
  rationale: Aqui o termo se refere à zona de terras altas, e não a uma única montanha. A expressão é geograficamente clara em português.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: mas não conseguiu expulsar
  rationale: A construção hebraica é elíptica. O contraste com o êxito anterior e a razão introduzida em seguida indicam falta de êxito; “não conseguiu” comunica isso naturalmente sem ocultar a tensão do texto.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: os habitantes do vale
  rationale: Tradução natural da construção participial; “vale” é o sentido direto, enquanto a possível referência a uma planície ou baixada é preservada em nota.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: porque eles tinham carros de ferro
  rationale: Expressa em português corrente tanto a relação causal quanto a posse indicada por לָהֶם.
theological_decisions:
- issue: Sujeito e implicação da incapacidade na segunda oração
  choice: Entender que Judá não conseguiu expulsar os habitantes do vale.
  alternative: Traduzir de modo mais formal e obscuro, “pois não expulsar os habitantes do vale”, ou reformular para evitar qualquer ideia de incapacidade enquanto Yahweh estava com Judá.
  rationale: A sintaxe é comprimida, mas o contexto atribui a Judá a falta de êxito por causa da vantagem militar dos habitantes. A tradução preserva, sem tentar explicá-la, a tensão entre a presença de Yahweh e o fracasso relatado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Região montanhosa” evita sugerir uma montanha isolada; “carros de ferro” conserva a expressão histórica tradicional sem explicação interpretativa adicional.
