base_translation:
  language: en
  yaml_path: translation/ot/judges/001/002.yaml
  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: pt
  text: 'E o SENHOR disse: “Judá subirá. Eis que entreguei a terra nas mãos dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por “SENHOR” em versaletes, sem inserir uma vocalização discutida no texto principal.
- source_word: יַעֲלֶה
  choice: subirá
  rationale: Preserva a imagem espacial e militar do verbo hebraico עלה no contexto da campanha contra os cananeus.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função enfática e de chamada de atenção da partícula hebraica em linguagem digna e inteligível.
- source_word: נָתַתִּי
  choice: entreguei
  rationale: Expressa o perfeito hebraico como ação declarada por Deus como realizada, evitando enfraquecê-lo para mera promessa futura.
- source_word: בְּיָדוֹ
  choice: nas mãos dele
  rationale: Emprega o idioma português natural para indicar domínio ou poder concedido, embora o hebraico use literalmente o singular “na mão dele”.
theological_decisions:
- issue: Relação entre a ordem divina e a vitória já concedida
  choice: “Judá subirá... entreguei”
  alternative: “Judá deve subir... entregarei”
  rationale: Preserva a tensão do hebraico entre a declaração de que Judá irá à batalha e a afirmação divina, no perfeito, de que a terra já foi entregue em seu poder.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem sacrificar a naturalidade. “SENHOR” segue a convenção bíblica para o Tetragrama; “Eis que” conserva a ênfase solene de הִנֵּה.
