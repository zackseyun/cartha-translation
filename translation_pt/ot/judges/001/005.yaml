base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: pt
  text: Encontraram Adoni-Bezeque em Bezeque[a], lutaram contra ele e derrotaram os cananeus e os perizeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adoni-Bezeque pode ser entendido etimologicamente como “senhor de Bezeque”, mas aqui é traduzido como nome próprio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Encontraram
  rationale: O verbo מצא, na narrativa, significa normalmente “encontrar” ou “deparar-se com”. “Encontraram” é direto, natural e preserva a sequência narrativa.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezeque
  rationale: O contexto favorece seu tratamento como nome próprio. A transliteração portuguesa preserva a forma nominal, enquanto a nota registra seu possível sentido etimológico.
- source_word: בְּבֶזֶק
  choice: em Bezeque
  rationale: A preposição ב marca aqui localização; “em Bezeque” é a formulação mais direta em português.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: lutaram contra ele
  rationale: O nifal de לחם com ב indica combate contra um adversário. A expressão é clara e natural em português.
- source_word: וַיַּכּוּ
  choice: derrotaram
  rationale: Em contexto militar, נכה pode significar ferir, abater ou derrotar. “Derrotaram” comunica o resultado militar sem afirmar que todos foram mortos.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora esteja morfologicamente no singular, o gentílico tem sentido coletivo; o plural expressa isso naturalmente em português.
- source_word: הַפְּרִזִּי
  choice: os perizeus
  rationale: O gentílico singular é coletivo no contexto. “Os perizeus” segue a forma tradicional e inteligível em português.
