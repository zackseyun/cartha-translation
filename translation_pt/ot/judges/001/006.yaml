base_translation:
  language: en
  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: pt
  text: Mas Adoni-Bezeque fugiu; eles o perseguiram, capturaram e cortaram os polegares das mãos e os dedões dos pés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os polegares de suas mãos e de seus pés”. A palavra hebraica designa o polegar da mão e o dedão do pé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: fugiu
  rationale: O verbo נוּס indica fugir. “Fugiu” é direto e preserva o movimento narrativo sem sugerir que ele tenha conseguido escapar, pois foi capturado em seguida.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezeque
  rationale: A expressão funciona no contexto como nome ou título-nome. A transliteração evita decidir entre nome próprio e a possível tradução “senhor de Bezeque”.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: eles o perseguiram
  rationale: רדף seguido de אַחַר significa perseguir alguém; a formulação é natural e adequada ao registro narrativo.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: capturaram
  rationale: אחז expressa agarrar ou apoderar-se. Neste contexto, “capturaram” comunica com clareza que a perseguição terminou na detenção dele.
- source_word: וַיְקַצְּצוּ
  choice: cortaram
  rationale: קצץ descreve aqui a amputação das partes mencionadas. Em português, o objeto corporal torna inequívoco o sentido de cortar fora.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: os polegares das mãos e os dedões dos pés
  rationale: בֹּהֶן designa o polegar quando se refere à mão e o dedo grande quando se refere ao pé. A formulação explicita naturalmente em português os dois referentes do hebraico.
