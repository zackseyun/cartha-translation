  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: pt
  text: 'Os que estavam de vigia viram um homem saindo da cidade e lhe disseram: “Por favor, mostre-nos a entrada da cidade[a], e trataremos você com bondade[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o caminho de acesso à cidade”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico ḥésed, termo que, conforme o contexto, também pode ser traduzido por “lealdade”, “amor leal” ou “misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: os que estavam de vigia
  rationale: Preserva o sentido participial de pessoas que observavam ou mantinham vigilância, sem identificá-las indevidamente como guardas da própria cidade ou atribuir-lhes uma patente militar específica.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo singular designa diretamente uma pessoa do sexo masculino neste contexto.
- source_word: יוֹצֵא
  choice: saindo
  rationale: O particípio indica que o homem estava em movimento para fora da cidade; a formulação é natural em português e mantém o aspecto da ação observada.
- source_word: מְבוֹא
  choice: a entrada
  rationale: O termo designa a entrada, o acesso ou o caminho pelo qual se entra. “A entrada” é conciso e concreto, enquanto a nota preserva a possível nuance de “caminho de acesso”.
- source_word: נָא
  choice: por favor
  rationale: Reproduz de modo natural a partícula que atenua o imperativo e dá ao pedido um tom cortês.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: e trataremos você com bondade
  rationale: Neste acordo narrativo, חֶסֶד aponta principalmente para tratamento favorável, bondoso ou misericordioso. A formulação evita impor ao contexto uma conotação pactual mais forte, sem eliminar a amplitude lexical do termo.
theological_decisions:
- issue: Sentido de חֶסֶד neste acordo
  choice: bondade ou tratamento favorável
  alternative: lealdade pactual ou amor leal
  rationale: Embora חֶסֶד possa expressar lealdade e amor constante em contextos de aliança, aqui se refere mais naturalmente à promessa de poupar ou favorecer o homem em troca de informação. “Bondade” conserva o sentido relacional sem acrescentar uma especificidade teológica não exigida pelo episódio.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural no Brasil. “Os que estavam de vigia” evita a possível impressão de que eram guardas defensores da cidade. Os marcadores foram colocados junto aos termos a que as notas efetivamente se referem.
