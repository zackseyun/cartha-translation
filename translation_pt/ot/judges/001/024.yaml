  source_fidelity: 'A tradução representa com precisão a sequência hebraica: os observadores veem um homem saindo da cidade, fazem-lhe um pedido cortês para que lhes mostre o acesso, e prometem tratá-lo com bondade. “Os que estavam de vigia” preserva o particípio בלי atribuir uma função militar mais específica; “entrada” é uma boa correspondência para מְבוֹא neste contexto.'
