id: JDG.1.10
reference: Judges 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוּדָ֗ה אֶל הַֽ/כְּנַעֲנִי֙ הַ/יּוֹשֵׁ֣ב בְּ/חֶבְר֔וֹן וְ/שֵׁם חֶבְר֥וֹן לְ/פָנִ֖ים קִרְיַ֣ת אַרְבַּ֑ע וַ/יַּכּ֛וּ אֶת שֵׁשַׁ֥י וְ/אֶת אֲחִימַ֖ן וְ/אֶת תַּלְמָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: pt
  text: Então Judá foi contra os cananeus[a] que habitavam em Hebrom — antigamente, o nome de Hebrom era Quiriate-Arba —, e eles derrotaram[b] Sesai, Aimã e Talmai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o cananeu”, no singular; provavelmente usado aqui em sentido coletivo.'
    reason: lexical_alternative
  - marker: b
    text: Ou “abateram”; neste contexto militar, o verbo também pode ter o sentido de “feriram” ou “mataram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶל
  choice: Então Judá foi contra
  rationale: O verbo significa literalmente “foi”, mas אֶל diante de um adversário, nesta narrativa militar, comunica movimento hostil. “Foi contra” conserva tanto o deslocamento quanto o sentido de confronto.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora a forma hebraica seja singular, o gentílico funciona aqui naturalmente como singular coletivo; o plural em português deixa claro que se trata do povo cananeu.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: que habitavam em Hebrom
  rationale: O particípio indica residência estabelecida. “Habitavam” é natural, digno e adequado à referência coletiva.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: antigamente, o nome de Hebrom era Quiriate-Arba
  rationale: A formulação mantém a observação histórica do hebraico sem transformar o topônimo em uma explicação etimológica.
- source_word: וַיַּכּוּ
  choice: eles derrotaram
  rationale: נכה em contexto militar pode indicar golpear, abater ou derrotar. “Derrotaram” expressa o resultado militar sem afirmar de modo inequívoco que os três foram mortos.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: Sesai, Aimã e Talmai
  rationale: Os nomes pessoais são transliterados em formas legíveis e correntes em português.
theological_decisions:
- issue: Mudança do singular para o plural na referência a Judá
  choice: “Judá foi” e depois “eles derrotaram”
  alternative: “os homens de Judá foram” e “derrotaram”
  rationale: O hebraico apresenta Judá no singular em וַיֵּלֶךְ e depois emprega o verbo plural וַיַּכּוּ. A tradução preserva essa mudança e deixa visível o sentido coletivo de Judá, sem inserir “tribo” ou “homens” no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes próprias de ampla legibilidade brasileira. Os travessões destacam a informação parentética sobre o antigo nome de Hebrom. A alternância entre “Judá” no singular e “eles” no plural reproduz uma tensão gramatical significativa do hebraico.
