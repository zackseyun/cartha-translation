  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: pt
  text: Otniel, filho de Quenaz e irmão mais novo de Calebe,[a] conquistou a cidade, e Calebe lhe deu sua filha Acsa por esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Otniel, filho de Quenaz, parente mais novo de Calebe”. O hebraico diz mais naturalmente “irmão de Calebe, mais novo do que ele”, mas alguns entendem o termo de parentesco em sentido mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: conquistou a cidade
  rationale: O verbo לכד indica capturar ou tomar, especialmente uma cidade. O sufixo feminino singular retoma a cidade do versículo anterior; explicitar “a cidade” evita um pronome de referência pouco natural em português.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֶּן קְנַז
  choice: filho de Quenaz
  rationale: Mantém diretamente a construção genealógica hebraica.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: irmão mais novo de Calebe
  rationale: A leitura sintática mais natural é “irmão de Calebe, mais novo do que ele”. A possível compreensão mais ampla do termo de parentesco é registrada em nota.
- source_word: וַיִּתֶּן לוֹ
  choice: Calebe lhe deu
  rationale: Embora o hebraico use apenas a forma verbal e o pronome indireto, explicitar Calebe esclarece o sujeito e evita ambiguidade em português sem alterar o sentido contextual.
- source_word: עַכְסָה
  choice: Acsa
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בִתּוֹ
  choice: sua filha
  rationale: Reproduz o substantivo com sufixo possessivo; o possuidor é Calebe.
- source_word: לְאִשָּׁה
  choice: por esposa
  rationale: Expressão portuguesa natural para o idioma hebraico de dar uma mulher em casamento.
theological_decisions:
- issue: Relação de parentesco entre Otniel e Calebe
  choice: Otniel é apresentado no texto principal como irmão mais novo de Calebe.
  alternative: Otniel pode ser entendido como parente mais novo de Calebe, possivelmente seu sobrinho.
  rationale: O hebraico, em sua leitura mais direta, diz “irmão de Calebe, mais novo do que ele”. Como אָח pode, em certos contextos, ter sentido mais amplo de parentesco, a alternativa é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase foi levemente ajustada e o sujeito “Calebe” foi explicitado na segunda oração para clareza. A nota preserva a ambiguidade legítima do parentesco.
