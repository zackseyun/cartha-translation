  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: pt
  text: 'Depois da morte de Josué, os filhos de Israel consultaram Yahweh, dizendo: “Quem será o primeiro a subir por nós contra os cananeus, para lutar contra eles?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “contra o cananeu” e depois “contra ele”, empregando o singular com sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: Depois da morte de Josué
  rationale: A construção temporal inicia um novo episódio. Em português, omitir uma tradução explícita de וַיְהִי evita a fórmula pouco natural “e aconteceu”, sem perder a transição narrativa.
- source_word: וַיִּשְׁאֲלוּ בַּיהוָה
  choice: consultaram Yahweh
  rationale: Neste contexto, שׁאל ב־ indica buscar orientação divina, e “consultaram” comunica isso com clareza e concisão.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão hebraica e sua forma masculina plural, embora “os israelitas” seja uma alternativa idiomática.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto, em registro bíblico ainda corrente e compreensível.
- source_word: מִי יַעֲלֶה לָּנוּ ... בַּתְּחִלָּה
  choice: Quem de nós será o primeiro a subir
  rationale: לָנוּ pode ter o sentido de agir por ou em favor do grupo; no contexto da escolha entre as tribos, “de nós” torna explícita a relação natural em português, enquanto “será o primeiro” expressa a ordem indicada por בַּתְּחִלָּה.
- source_word: אֶל הַכְּנַעֲנִי
  choice: contra os cananeus
  rationale: O substantivo hebraico está no singular formal, mas tem sentido coletivo; o plural português transmite naturalmente o referente populacional e militar.
- source_word: לְהִלָּחֶם בּוֹ
  choice: para lutar contra eles
  rationale: O sufixo singular retoma o coletivo “cananeu”; em português, o pronome plural concorda naturalmente com “os cananeus”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome pessoal divino, o Tetragrama. “Yahweh” o representa como nome próprio, em vez de substituí-lo por um título.
- issue: Identidade do grupo que deve iniciar a campanha
  choice: Quem de nós será o primeiro
  alternative: Quem subirá por nós primeiro
  rationale: O contexto sugere uma escolha entre os grupos de Israel, mas לָנוּ também pode significar “por nós” ou “em nosso favor”. A tradução principal privilegia o português natural sem transformar a pergunta em uma afirmação sobre a identidade do agente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Filhos de Israel” preserva a forma do hebraico; “consultaram” explicita que se buscou orientação divina. A nota mantém visível o singular coletivo do original.
