base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: pt
  text: 'Então Calebe disse[a]: “Quem atacar Quiriate-Sefer e a conquistar, eu lhe darei minha filha Acsa por esposa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que atacar Quiriate-Sefer e a conquistar”.'
    reason: alternativa lexical para a oração relativa indefinida introduzida por אֲשֶׁר
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa esse avanço de modo natural em português.
- source_word: כָּלֵב
  choice: Calebe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֲשֶׁר
  choice: Quem
  rationale: Introduz uma oração relativa indefinida e transmite naturalmente o caráter aberto do desafio.
- source_word: יַכֶּה
  choice: atacar
  rationale: O hifil de נכה denota golpear ou ferir; neste contexto militar, “atacar” é natural e evita antecipar o êxito, expresso pelo verbo seguinte.
- source_word: קִרְיַת סֵפֶר
  choice: Quiriate-Sefer
  rationale: Transliteração portuguesa do topônimo, com hífen para representar sua unidade composta.
- source_word: וּלְכָדָהּ
  choice: e a conquistar
  rationale: לכד, em contexto militar, significa capturar ou tomar. “Conquistar” comunica claramente a tomada bem-sucedida da cidade; o pronome feminino retoma “Quiriate-Sefer” como cidade.
- source_word: וְנָתַתִּי לוֹ
  choice: eu lhe darei
  rationale: Expressa a promessa de Calebe condicionada à conquista, preservando explicitamente o objeto indireto.
- source_word: עַכְסָה
  choice: Acsa
  rationale: Forma tradicional e legível do nome em português.
- source_word: בִתִּי
  choice: minha filha
  rationale: Preserva diretamente a relação familiar central à promessa.
- source_word: לְאִשָּׁה
  choice: por esposa
  rationale: Equivalente português natural do idioma hebraico que indica dar alguém em casamento.
