    text: 'Ou: “lutaram em Jerusalém”. No contexto, “contra Jerusalém” é o sentido mais provável.'
    reason: alternative_reading
  revision_rationale: A revisão retira a explicitação interpretativa de “seus habitantes”, preserva Jerusalém como referente dos pronomes e usa a expressão portuguesa idiomática “passar ao fio da espada” para reproduzir a fórmula militar hebraica. A nota registra a leitura locativa possível da preposição, sem obscurecer o sentido contextual mais provável.
