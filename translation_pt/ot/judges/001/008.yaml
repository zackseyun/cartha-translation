base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: pt
  text: Então os filhos de Judá lutaram contra Jerusalém[a], tomaram-na, passaram-na ao fio da espada e incendiaram a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lutaram em Jerusalém”. No contexto, “contra Jerusalém” é o sentido mais provável.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ ... בִּירוּשָׁלִַם
  choice: lutaram contra Jerusalém
  rationale: O nifal de לחם com ב, em contexto bélico e seguido pela tomada da cidade, indica combate dirigido contra Jerusalém. A tradução explicita em português a relação hostil que a construção hebraica permite.
- source_word: בְנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Preserva a expressão familiar coletiva do hebraico, que aqui designa os membros da tribo de Judá, sem substituí-la silenciosamente por um termo mais interpretativo.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: tomaram a cidade
  rationale: לכד denota tomar ou capturar uma cidade. A repetição de 'a cidade' evita em português uma sequência pouco natural de pronomes femininos e deixa claro o referente.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: feriram seus habitantes ao fio da espada
  rationale: A cidade é o objeto gramatical, mas a fórmula militar diz respeito à população atingida. 'Ao fio da espada' conserva a imagem idiomática de פִי חָרֶב, enquanto 'seus habitantes' torna explícita a metonímia necessária para compreensão natural.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: a incendiaram
  rationale: A construção idiomática significa entregar ou lançar ao fogo, isto é, incendiar. O verbo português é atual, conciso e mantém a força da ação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. Conserva-se 'filhos de Judá' para refletir a formulação tribal do texto-fonte; a metonímia na descrição do massacre é esclarecida no corpo e documentada em nota.
