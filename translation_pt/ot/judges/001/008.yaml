review_pass:
  verdict: revise
  source_fidelity: 'A tradução acerta a sequência narrativa e o sentido de luta dirigida contra Jerusalém. Contudo, “seus habitantes” explicita no corpo do texto uma metonímia que o hebraico mantém: os verbos têm Jerusalém/a cidade como objeto feminino singular. A nota também apresenta como hebraico uma formulação equivalente a “feriram-na”, mas o texto não traz “habitantes”.'
  naturalness: O texto é fluente, mas “passaram-na ao fio da espada” é uma formulação portuguesa estabelecida para a expressão militar e permite conservar a cidade como referente gramatical sem produzir a construção pouco natural “feriram-na ao fio da espada”.
  terminology: “Filhos de Judá”, “lutaram contra Jerusalém”, “tomaram” e “incendiaram” são adequados. A nota de alternativa para “contra” preserva de modo transparente a ambiguidade possível de בְּ após o verbo de lutar.
  issues:
  - severity: medium
    issue: “seus habitantes” foi inserido no texto principal.
    rationale: Embora a expressão militar possa implicar a população da cidade, o hebraico diz literalmente que eles golpearam Jerusalém/a cidade “ao fio da espada”. Tornar os habitantes explícitos altera a referência gramatical e reduz a concisão metonímica do original.
  - severity: low
    issue: A nota afirma uma forma hebraica que inclui a interpretação da metonímia.
    rationale: A nota deve descrever a expressão hebraica como referência à cidade, sem apresentar “seus habitantes” como se estivesse no texto-fonte.
  revised_text: Então os filhos de Judá lutaram contra Jerusalém[a], tomaram-na, passaram-na ao fio da espada e incendiaram a cidade.
  revised_footnotes:
