- from: Então os filhos de Judá lutaram contra Jerusalém, tomaram a cidade, feriram seus habitantes ao fio da espada[a] e a incendiaram.
  to: Então os filhos de Judá lutaram contra Jerusalém[a], tomaram-na, passaram-na ao fio da espada e incendiaram a cidade.
  rationale: A revisão retira a explicitação interpretativa de “seus habitantes”, preserva Jerusalém como referente dos pronomes e usa a expressão portuguesa idiomática “passar ao fio da espada” para reproduzir a fórmula militar hebraica. A nota registra a leitura locativa possível da preposição, sem obscurecer o sentido contextual mais provável.
