  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: pt
  text: Depois disso, os filhos de Judá desceram para lutar contra os cananeus que habitavam na região montanhosa, no Neguebe e na Sefelá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a região de colinas baixas entre a região montanhosa de Judá e a planície costeira. Também pode ser traduzido como «as terras baixas».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Depois disso
  rationale: Expressa com naturalidade a sequência temporal indicada pelo hebraico, sem especificar quanto tempo transcorreu.
- source_word: יָרְדוּ
  choice: desceram
  rationale: Preserva o sentido direcional e topográfico concreto do verbo ירד.
- source_word: בְּנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Mantém a forma hebraica, que aqui designa coletivamente os membros da tribo de Judá.
- source_word: לְהִלָּחֵם
  choice: para lutar
  rationale: Tradução clara e corrente do infinitivo de לחם, indicando a finalidade da descida.
- source_word: בַּכְּנַעֲנִי
  choice: contra os cananeus
  rationale: O singular hebraico funciona coletivamente; o plural português comunica naturalmente o grupo étnico, e «contra» explicita a relação hostil exigida pelo verbo lutar.
- source_word: יוֹשֵׁב
  choice: que habitavam
  rationale: O particípio expressa residência contínua; a forma plural concorda em português com o coletivo traduzido como «os cananeus».
- source_word: הָהָר
  choice: a região montanhosa
  rationale: Neste catálogo geográfico, o termo indica a zona elevada, não uma única montanha.
- source_word: הַנֶּגֶב
  choice: o Neguebe
  rationale: No contexto de três zonas geográficas, trata-se da região específica do Neguebe, e não apenas do sul em sentido genérico.
- source_word: הַשְּׁפֵלָה
  choice: a Sefelá
  rationale: A transliteração identifica com precisão a região geográfica específica entre as montanhas de Judá e a planície costeira; a nota explica o termo ao leitor comum.
