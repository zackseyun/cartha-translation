base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: pt
  text: 'Adoni-Bezeque disse[a]: “Setenta reis, com os polegares das mãos e os dedões dos pés decepados, recolhiam restos debaixo da minha mesa. Assim como eu fiz, Deus me retribuiu[b]”. Então o levaram a Jerusalém, e ele morreu ali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O senhor de Bezeque”. A expressão hebraica pode ser entendida como título, embora aqui funcione provavelmente como nome ou designação pessoal.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “Deus” tem forma plural, mas está acompanhado aqui de um verbo no singular; por isso, também pode ser entendido como plural de majestade ou como a forma usual para “Deus”, e não como “os deuses”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezeque
  rationale: O contexto trata a expressão como designação própria do governante; por isso, ela é transliterada e adaptada à ortografia portuguesa, sem ocultar em nota a possível leitura titular.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: com os polegares das mãos e os dedões dos pés decepados
  rationale: בֹּהֶן designa o polegar quando relacionado à mão e o dedão quando relacionado ao pé. A formulação explicita naturalmente em português as duas partes do corpo mencionadas no hebraico.
- source_word: מְקֻצָּצִים
  choice: decepados
  rationale: O particípio passivo de קצץ indica que esses dedos haviam sido cortados fora; “decepados” expressa com clareza a mutilação deliberada.
- source_word: הָיוּ מְלַקְּטִים
  choice: recolhiam restos
  rationale: A construção perifrástica indica ação habitual no passado. לקט significa recolher ou apanhar; “restos” fornece em português o complemento naturalmente subentendido pelo cenário sob a mesa, sem restringi-lo especificamente a migalhas.
- source_word: תַּחַת שֻׁלְחָנִי
  choice: debaixo da minha mesa
  rationale: Equivalente espacial direto e idiomático em português.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: Assim como eu fiz
  rationale: Preserva a fórmula de correspondência entre a ação passada do rei e a retribuição que ele reconhece ter recebido.
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: Deus me retribuiu
  rationale: No piel, שׁלם comunica retribuição ou pagamento correspondente. Embora אֱלֹהִים tenha forma plural, o verbo hebraico está no singular, favorecendo “Deus”.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: Então o levaram a Jerusalém
  rationale: A forma narrativa tem sujeito plural não expresso e objeto masculino singular; a tradução mantém ambos de modo natural e marca a progressão do relato.
- source_word: וַיָּמָת שָׁם
  choice: e ele morreu ali
  rationale: Mantém a sequência narrativa, com o pronome explícito para clareza e “ali” como equivalente natural de שָׁם.
theological_decisions:
- issue: Referência de אֱלֹהִים na declaração de Adoni-Bezeque
  choice: Deus
  alternative: os deuses
  rationale: A forma nominal pode, em outros contextos, ter sentido plural, mas aqui שִׁלַּם está no singular. “Deus” respeita essa concordância sem transformar a fala em uma confissão teológica mais completa do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dedões dos pés” evita a expressão técnica “hálux” e distingue naturalmente os dedos grandes dos pés dos polegares. A ordem e a concisão do relato hebraico foram preservadas sem rigidez sintática.
