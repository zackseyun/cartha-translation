  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: pt
  text: Naftali não expulsou os habitantes de Bete-Semes nem os habitantes de Bete-Anate; por isso, habitou entre os cananeus, os habitantes da terra. E os habitantes de Bete-Semes e de Bete-Anate tornaram-se mão de obra forçada para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ficaram sujeitos à prestação obrigatória de trabalho para eles». O termo hebraico מַס refere-se a serviço compulsório, e não apenas ao pagamento de tributo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: expulsou
  rationale: O hifil de ירש, neste contexto de ocupação territorial em Juízes, indica remover os habitantes anteriores. “Expulsou” é natural em português e conserva o sentido concreto, sem reduzi-lo à perda jurídica da posse.
- source_word: יֹשְׁבֵי
  choice: habitantes
  rationale: O particípio de ישב designa os que moram em determinado lugar. “Habitantes” reproduz de modo conciso a fórmula repetida no capítulo.
- source_word: בֵית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: O topônimo é transliterado segundo uma forma corrente e legível em português, em vez de traduzido literalmente.
- source_word: בֵית עֲנָת
  choice: Bete-Anate
  rationale: O topônimo é transliterado segundo uma forma corrente em português, preservando-o como nome próprio.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: em vez disso, passou a viver no meio de
  rationale: O verbo singular concorda com o nome coletivo da tribo, Naftali. “Passou a viver no meio de” expressa naturalmente a instalação entre os cananeus; “em vez disso” torna explícito o contraste narrativo, sem acrescentar uma causalidade mais forte do que o contexto permite.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora esteja morfologicamente no singular, o gentílico hebraico tem sentido coletivo e é expresso naturalmente pelo plural em português.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: os habitantes da terra
  rationale: A expressão apositiva identifica os cananeus e foi mantida, pois faz parte do texto hebraico e ressalta que Naftali passou a morar entre a população já estabelecida.
- source_word: הָיוּ לָהֶם לָמַס
  choice: ficaram sujeitos a trabalhos forçados para eles
  rationale: מַס indica serviço compulsório ou corveia, e não apenas pagamento de tributo. A formulação conserva tanto a coerção quanto o pronome plural לָהֶם, cujo referente são os membros da tribo de Naftali.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de topônimos familiares à leitura brasileira. O singular coletivo “Naftali” foi preservado no primeiro período, enquanto o plural de לָהֶם foi mantido em “para eles”. A aposição “os habitantes da terra” conserva a estrutura e a ênfase do hebraico.
