  source_fidelity: 'O texto preserva os elementos essenciais do hebraico: a incapacidade de Naftali de expulsar os habitantes das duas localidades, sua habitação entre os cananeus, a aposição «os habitantes da terra» e a sujeição das populações a trabalho compulsório. Contudo, «em vez disso, passou a viver» explicita um contraste e um início de estado que o hebraico narrativo não formula diretamente. Uma redação mais simples preserva melhor a sequência e a relação contextual.'
  naturalness: A redação é clara e moderna. «Habitou entre os cananeus» é igualmente natural em português bíblico contemporâneo e é mais concisa. «Tornaram-se mão de obra forçada para eles» comunica com clareza o sentido de מַס; a nota mantém a alternativa técnica de corveia/prestação obrigatória.
  terminology: «Naftali», «Bete-Semes», «Bete-Anate», «cananeus» e «habitantes da terra» são adequados. «Mão de obra forçada» evita que «trabalhos forçados» pareça designar apenas a pena ou a tarefa, quando מַס descreve o estatuto de serviço compulsório imposto às populações.
