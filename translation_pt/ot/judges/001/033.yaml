revisions:
- from: Naftali não expulsou os habitantes de Bete-Semes nem os habitantes de Bete-Anate; em vez disso, passou a viver no meio dos cananeus, os habitantes da terra. E os habitantes de Bete-Semes e de Bete-Anate ficaram sujeitos a trabalhos forçados para eles.[a]
  to: Naftali não expulsou os habitantes de Bete-Semes nem os habitantes de Bete-Anate; por isso, habitou entre os cananeus, os habitantes da terra. E os habitantes de Bete-Semes e de Bete-Anate tornaram-se mão de obra forçada para eles.[a]
  rationale: A revisão elimina as explicitações desnecessárias em «em vez disso, passou a viver» e emprega «habitou entre», que representa diretamente a construção hebraica. «Mão de obra forçada» expressa de modo idiomático que os habitantes passaram a fornecer serviço compulsório, enquanto a nota registra a formulação alternativa mais técnica.
