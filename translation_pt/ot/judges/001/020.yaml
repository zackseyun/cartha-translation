base_translation:
  language: en
  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: pt
  text: Deram Hebrom a Calebe, conforme Moisés havia dito, e ele expulsou dali os três filhos de Anaque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os três descendentes de Anaque” ou “os três anaquitas”. O hebraico diz “filhos de Anaque”, expressão que pode indicar descendência de clã, e não necessariamente filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  choice: Deram Hebrom a Calebe
  rationale: O wayyiqtol de נתן expressa a sequência narrativa no passado. A ordem é natural em português e mantém Calebe como objeto indireto e Hebrom como objeto direto.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: conforme Moisés havia dito
  rationale: כַּאֲשֶׁר indica conformidade, e דִּבֶּר significa aqui 'disse/falou'. O mais-que-perfeito composto torna clara a anterioridade sem acrescentar a ideia mais forte de promessa.
- source_word: וַיּוֹרֶשׁ
  choice: ele expulsou
  rationale: No hiphil, ירש pode significar desalojar, desapossar ou expulsar. Como o objeto são pessoas e o contexto é territorial, 'expulsou' comunica a ação com clareza em português atual.
- source_word: מִשָּׁם
  choice: dali
  rationale: Retoma Hebrom de modo conciso e natural, preservando o sentido de 'de lá'.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: os três filhos de Anaque
  rationale: Preserva a forma concreta do hebraico בְּנֵי, 'filhos de', sem decidir no texto principal se se trata de filhos imediatos, descendentes ou membros de um clã.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantém a concisão narrativa do hebraico e preserva em nota a ambiguidade de 'filhos de Anaque'.
