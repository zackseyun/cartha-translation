  source_fidelity: 'A tradução preserva com precisão a construção do hebraico: o grupo dos descendentes do queneu, a subida desde a Cidade das Palmeiras em companhia de Judá, o destino no deserto de Judá e a mudança deliberadamente mantida para verbos no singular. “Para o deserto” é uma forma portuguesa fiel para o movimento expresso no contexto, sem impor uma distinção espacial indevida. A ambiguidade de אֶת הָעָם permanece adequadamente preservada em “com o povo”.'
