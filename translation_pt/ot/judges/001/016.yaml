source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: pt
  text: Os descendentes do queneu, sogro de Moisés[a], subiram da Cidade das Palmeiras[b] com os descendentes de Judá para o deserto de Judá, que fica no Neguebe de Arade. Então ele foi e se estabeleceu[c] com o povo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parente de Moisés por casamento”; o termo hebraico pode ter sentido mais amplo que “sogro”, embora “sogro” seja o sentido mais comum aqui.
    reason: lexical_alternative
  - marker: b
    text: A “Cidade das Palmeiras” é geralmente identificada com Jericó.
    reason: cross_reference
  - marker: c
    text: 'O hebraico passa para o singular: “ele foi e se estabeleceu”. Isso pode se referir coletivamente ao clã queneu, embora alguns entendam o sentido como plural.'
    reason: grammatical_ambiguity
  - marker: d
    text: Ou “entre o povo”. Alguns testemunhos antigos trazem “com Amaleque” em vez de “com o povo”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: Os descendentes do queneu
  rationale: Embora בְּנֵי signifique literalmente “filhos de”, em contexto tribal pode indicar descendentes ou membros de um clã. “Descendentes” comunica essa ideia sem limitar a referência aos filhos imediatos. קֵינִי é o gentílico tradicionalmente vertido como “queneu”.
- source_word: חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  rationale: חֹתֵן normalmente designa o sogro, embora possa ter sentido mais amplo de parente por casamento; essa possibilidade é preservada em nota.
- source_word: עָלוּ
  choice: subiram
  rationale: Preserva o sentido básico de עלה e sua possível nuance topográfica.
- source_word: מֵעִיר הַתְּמָרִים
  choice: da Cidade das Palmeiras
  rationale: Mantém a designação geográfica usada pelo hebraico, em vez de substituí-la diretamente por “Jericó”.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: com os descendentes de Judá
  rationale: אֶת tem aqui valor associativo, “com”; בְּנֵי refere-se ao grupo tribal descendente de Judá.
- source_word: מִדְבַּר יְהוּדָה
  choice: para o deserto de Judá
  rationale: A expressão indica o destino do deslocamento. “Para” é natural em português e não acrescenta precisão espacial ausente do hebraico.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: que fica no Neguebe de Arade
  rationale: נֶגֶב pode significar o sul ou a região do Neguebe. A forma geográfica “Neguebe de Arade” preserva a formulação e a possível vinculação regional.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Então ele foi e se estabeleceu
  rationale: Os dois verbos estão no singular, apesar do sujeito plural anterior. A tradução preserva essa mudança gramatical e usa “se estabeleceu” para o sentido de residência em contexto migratório.
- source_word: אֶת הָעָם
  choice: com o povo
  rationale: Lê אֶת em sentido associativo e conserva a referência indefinida de הָעָם, sem identificar silenciosamente o povo como Judá ou adotar a leitura antiga “Amaleque”.
