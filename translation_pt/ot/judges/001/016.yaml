translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas amplamente reconhecíveis no Brasil e internacionalmente (“queneu”, “Neguebe”, “Arade”). A mudança do plural para o singular foi mantida para preservar a tensão gramatical do texto massorético; as ambiguidades lexicais e textuais foram explicitadas apenas em notas.
