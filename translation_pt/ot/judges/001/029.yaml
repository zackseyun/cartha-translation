base_translation:
  language: en
  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: pt
  text: E Efraim não expulsou os cananeus que habitavam em Gezer, e os cananeus viviam entre eles[a], em Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no meio dele”; o pronome singular se refere a Efraim como unidade tribal. A tradução expressa o sentido coletivo como “entre eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: expulsou
  rationale: No hifil de ירשׁ, o verbo indica fazer os habitantes anteriores perderem a posse ou saírem do território. “Expulsou” é claro, natural e preserva a ideia de remoção pela força.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora esteja morfologicamente no singular, o gentílico tem sentido coletivo neste contexto; o plural é a forma natural de expressar o grupo em português.
- source_word: הַיּוֹשֵׁב
  choice: que habitavam
  rationale: O particípio de ישׁב descreve residência estabelecida e contínua. “Habitavam” comunica esse sentido de modo corrente e digno.
- source_word: בְּגָזֶר
  choice: em Gezer
  rationale: A preposição בְּ marca localização; “em Gezer” é a formulação portuguesa mais natural para residência numa cidade.
- source_word: וַיֵּשֶׁב
  choice: continuaram vivendo
  rationale: O verbo ישׁב dá sequência ao relato e indica que os cananeus permaneceram residentes depois de não terem sido expulsos. A formulação evita o possível sentido de ação concluída que “viveram” pode sugerir em português.
- source_word: בְּקִרְבּוֹ
  choice: entre eles
  rationale: Literalmente, “no meio dele”, com o sufixo singular referindo-se a Efraim como unidade tribal. “Entre eles” exprime naturalmente em português o sentido coletivo da população da tribo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O primeiro verbo de residência foi vertido por “habitavam” e o segundo por “continuaram vivendo” para evitar repetição pesada e comunicar a permanência narrativa. O waw antes da segunda oração foi representado por coordenação com ponto e vírgula, sem acrescentar uma relação causal explícita.
