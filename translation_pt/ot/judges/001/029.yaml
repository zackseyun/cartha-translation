  naturalness: O português é claro e de registro adequado. “Viviam” é natural e conciso para a segunda ocorrência de ישׁב, sem a expansão interpretativa de “continuaram vivendo”. A coordenação por “e” reflete melhor o waw do que o ponto e vírgula.
