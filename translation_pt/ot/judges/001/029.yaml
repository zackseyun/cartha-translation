    rationale: Não altera substancialmente o sentido, mas “e” reproduz de modo mais direto a ligação narrativa do hebraico e do texto inglês auditado.
  revised_text: E Efraim não expulsou os cananeus que habitavam em Gezer, e os cananeus viviam entre eles[a], em Gezer.
