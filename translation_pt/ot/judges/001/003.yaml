base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: pt
  text: 'Judá disse a Simeão, seu irmão: “Suba comigo ao território que me coube por sorteio[a], e lutemos contra os cananeus. Eu também irei com você ao território que lhe coube por sorteio”. E Simeão foi com ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na minha sorte” e “na sua sorte”, isto é, no território atribuído por sorteio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol dá continuidade à narrativa; em português, a sequência é natural sem a necessidade de explicitar sempre a conjunção inicial.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome próprio; no contexto, representa a entidade tribal personificada.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: a Simeão, seu irmão
  rationale: Mantém a linguagem explícita de fraternidade, adequada tanto à relação ancestral quanto à relação entre as tribos.
- source_word: עֲלֵה אִתִּי
  choice: Suba comigo
  rationale: Preserva o sentido de עלה, que indica subir ou avançar, e mantém a força do imperativo no convite.
- source_word: בְּגוֹרָלִי
  choice: ao território que me coube por sorteio
  rationale: גוֹרָל significa literalmente “sorte”, mas aqui designa por metonímia a área territorial atribuída mediante sorteio. A formulação comunica ambos os elementos com clareza.
- source_word: וְנִלָּחֲמָה
  choice: e lutemos
  rationale: O coortativo na primeira pessoa do plural expressa convite e decisão conjunta; “lutemos” reproduz diretamente essa força.
- source_word: בַּכְּנַעֲנִי
  choice: contra os cananeus
  rationale: O singular hebraico tem sentido coletivo e refere-se ao povo cananeu; o plural é a forma natural em português.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: Eu também irei com você
  rationale: Preserva a promessa recíproca e a ênfase de גַם אֲנִי, em linguagem corrente e digna.
- source_word: בְּגוֹרָלֶךָ
  choice: ao território que lhe coube por sorteio
  rationale: Mantém o mesmo sentido contextual e a mesma formulação adotada na primeira ocorrência de גוֹרָל.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: E Simeão foi com ele
  rationale: Reproduz a conclusão narrativa e o encadeamento simples do hebraico sem acrescentar uma relação causal explícita.
theological_decisions:
- issue: Sentido da linguagem de parentesco אָחִיו
  choice: seu irmão
  alternative: seu parente
  rationale: O texto emprega explicitamente “irmão”, linguagem que corresponde à relação ancestral entre Judá e Simeão e também caracteriza as tribos personificadas. Generalizar para “parente” apagaria esse dado.
- issue: Sentido de גוֹרָל no contexto da distribuição da terra
  choice: território que me/lhe coube por sorteio
  alternative: minha/sua sorte
  rationale: O termo conserva a ideia do sorteio, mas no contexto se refere ao território assim atribuído. A tradução explicita a metonímia sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Você” evita rigidez arcaizante; “lutemos” conserva de modo natural a força exortativa do coortativo hebraico.
