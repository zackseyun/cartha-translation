  text: וַ/יַּעֲל֧וּ בֵית יוֹסֵ֛ף גַּם הֵ֖ם בֵּֽית אֵ֑ל וַֽ/יהוָ֖ה עִמָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: pt
  text: A casa de José também subiu contra Betel[a], e Yahweh estava com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “subiu a Betel”. O verbo hebraico diz literalmente “subiu”, mas, neste contexto militar, provavelmente indica um avanço contra a cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiu contra
  rationale: O verbo עָלָה significa literalmente “subir”. Neste contexto militar, seguido do destino, indica avançar contra a cidade; “subiu contra” preserva o modo de expressão hebraico e torna clara a ação hostil.
- source_word: בֵית יוֹסֵף
  choice: A casa de José
  rationale: Designação coletiva e tribal que abrange os grupos ligados a José. A forma tradicional preserva essa linguagem sem a reduzir interpretativamente a “descendentes”.
- source_word: גַּם הֵם
  choice: também
  rationale: Acrescenta a casa de José às campanhas narradas anteriormente. Em português, “também” comunica naturalmente essa relação, enquanto o sujeito coletivo já está explícito.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma portuguesa corrente do nome do lugar. A relação hostil é expressa por “contra”, embora o hebraico permita a leitura direcional “a Betel”.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando sua função de nome próprio no texto hebraico.
- source_word: עִמָּם
  choice: estava com eles
  rationale: Tradução direta que conserva tanto a ideia da presença divina quanto sua possível implicação de auxílio, sem tornar esta última mais explícita que o original.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama como nome próprio. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da presença divina em עִמָּם
  choice: estava com eles
  alternative: estava a favor deles
  rationale: A expressão pode implicar apoio e favor no contexto militar, mas a tradução literal preserva a amplitude e a tensão teológica do enunciado sem explicitar além do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém-se a expressão tribal “casa de José” e o idioma militar “subiu contra”, com nota para a ambiguidade direcional do hebraico.
