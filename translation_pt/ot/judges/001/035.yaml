base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: pt
  text: Mas os amorreus insistiram em permanecer no monte Heres, em Aijalom e em Saalbim; então a mão da casa de José se tornou pesada[a] sobre eles, e eles ficaram sujeitos a trabalho forçado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a casa de José prevaleceu sobre eles”; literalmente, “a mão da casa de José se tornou pesada”. A expressão hebraica pode indicar força crescente ou poder opressivo.
    reason: lexical_alternative
  - marker: b
    text: Ou “eles foram submetidos a trabalho forçado” ou “tornaram-se trabalhadores tributários”. O termo hebraico se refere a serviço compulsório.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: insistiram
  rationale: O verbo יאל pode indicar disposição, determinação ou decisão de empreender algo. Neste contexto, seguido de לָשֶׁבֶת e em contraste com o domínio posterior da casa de José, “insistiram em permanecer” comunica a determinação contínua dos amorreus sem reduzi-la a mero começo da ação.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: Embora a forma hebraica seja singular, funciona coletivamente e é retomada por um verbo no plural; o plural é natural e claro em português.
- source_word: לָשֶׁבֶת
  choice: em permanecer
  rationale: O infinitivo completa וַיּוֹאֶל. “Permanecer” realça a continuidade da ocupação dos lugares mencionados.
- source_word: בְּהַר חֶרֶס
  choice: no monte Heres
  rationale: Preserva tanto o elemento geográfico הַר quanto o topônimo חֶרֶס, sem decidir se a referência abrange uma elevação isolada ou uma região montanhosa.
- source_word: בְּאַיָּלוֹן
  choice: em Aijalom
  rationale: Transliteração portuguesa clara do topônimo hebraico.
- source_word: וּבְשַׁעַלְבִים
  choice: e em Saalbim
  rationale: Transliteração portuguesa do topônimo, com a conjunção preservada.
- source_word: וַתִּכְבַּד יַד
  choice: a mão ... se tornou pesada
  rationale: Mantém a imagem literal do hebraico, que neste contexto expressa poder crescente e opressivo. “Sobre eles” explicita em português a relação implícita no contexto.
- source_word: בֵּית יוֹסֵף
  choice: a casa de José
  rationale: Preserva a expressão sociopolítica e familiar hebraica, referente coletivamente aos grupos ligados a José.
- source_word: וַיִּהְיוּ לָמַס
  choice: eles ficaram sujeitos a trabalhos forçados
  rationale: מַס designa serviço compulsório ou tributo em forma de trabalho. A formulação é idiomática em português e evita sugerir que as próprias pessoas literalmente “se tornaram trabalho”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A imagem hebraica da mão que se torna pesada foi preservada, e as notas mantêm disponíveis as alternativas idiomáticas. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
