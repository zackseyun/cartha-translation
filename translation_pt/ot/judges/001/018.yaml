  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: pt
  text: Judá conquistou Gaza e seu território[a], Ascalom e seu território, e Ecrom e seu território.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus limites”, em cada ocorrência de “seu território”; o termo hebraico pode indicar uma fronteira ou o território por ela delimitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: conquistou
  rationale: O verbo לכד indica tomar ou capturar uma cidade pela força. Em português, “conquistou” é natural no contexto militar e expressa melhor a tomada de cidades do que o mais genérico “tomou”.
- source_word: יְהוּדָה
  choice: Judá
  rationale: O nome próprio representa aqui a entidade tribal agindo coletivamente. Manter “Judá” evita acrescentar a explicação interpretativa “a tribo de Judá” ao texto principal.
- source_word: גְּבוּלָהּ
  choice: seu território
  rationale: גְּבוּל pode designar fronteira, limite ou o território delimitado. Numa lista de cidades conquistadas, “seu território” comunica naturalmente a região vinculada a cada cidade, sem eliminar a alternativa lexical indicada em nota.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forma tradicional e corrente do topônimo em português.
- source_word: אַשְׁקְלוֹן
  choice: Ascalom
  rationale: Forma tradicional e reconhecível do topônimo bíblico em português.
- source_word: עֶקְרוֹן
  choice: Ecrom
  rationale: Forma tradicional e reconhecível do topônimo bíblico em português.
