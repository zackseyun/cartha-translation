base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: pt
  text: 'Quando ela chegou, insistiu com ele[a] para que pedisse ao pai dela o campo. Então ela desceu do jumento[b], e Calebe lhe perguntou: “O que você quer?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o persuadiu” ou “o incitou”. O verbo hebraico pode abranger desde insistir ou induzir até incitar; neste contexto, “insistiu com ele” evita impor um sentido necessariamente negativo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “apeou-se do jumento” ou “deixou-se cair do jumento”. O verbo hebraico não determina com precisão o modo do movimento.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “Que há para você?”. A expressão pode significar “O que você quer?” ou “O que está acontecendo com você?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: quando ela chegou
  rationale: 'A construção com בְּ, infinitivo construto e sufixo de terceira pessoa feminina singular tem valor temporal: literalmente, “ao chegar ela”. A oração temporal é clara e natural em português.'
- source_word: וַתְּסִיתֵהוּ
  choice: insistiu com ele
  rationale: O verbo סות pode significar incitar, induzir, persuadir ou instar. Neste contexto de um pedido familiar, “insistiu com ele” comunica pressão ou forte incentivo sem lhe atribuir necessariamente um sentido moral negativo.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: para que pedisse ao pai dela o campo
  rationale: שאל, com מֵאֵת indicando a pessoa a quem se dirige o pedido, descreve pedir algo ao pai. O artigo em הַשָּׂדֶה aponta para um campo específico, por isso se preserva “o campo”.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: ela desceu do jumento
  rationale: צנח pode expressar descer, deixar-se cair ou apear-se. “Desceu do jumento” é corrente e inteligível, preservando a ação básica sem especificar de modo indevido a rapidez ou o modo exato do movimento.
- source_word: מַה לָּךְ
  choice: O que você quer?
  rationale: A expressão significa literalmente “Que há para você?” ou “O que você tem?”. No contexto imediato, Calebe percebe que ela deseja fazer um pedido; “O que você quer?” reproduz de maneira natural a força pragmática da pergunta.
- source_word: כָּלֵב
  choice: Calebe
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
