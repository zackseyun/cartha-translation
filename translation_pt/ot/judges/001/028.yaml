base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: pt
  text: Quando Israel se tornou forte, submeteu os cananeus a trabalhos forçados[a], mas não os expulsou de todo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “submeteu os cananeus a trabalho compulsório” ou “a corveia”. O termo hebraico se refere a trabalho obrigatório imposto por um poder dominante.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “não expulsou completamente o cananeu”. O objeto está no singular e se refere coletivamente à população cananeia; em português, o sentido é expresso no plural. A repetição verbal hebraica dá ênfase à expulsão não realizada por completo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quando
  rationale: A fórmula narrativa introduz uma oração temporal. Em português, “Quando” transmite com naturalidade a sequência sem reproduzir de modo rígido o hebraísmo “e aconteceu que”.
- source_word: חָזַק
  choice: se tornou forte
  rationale: O verbo indica que Israel ganhou força ou passou a exercer domínio; a formulação preserva esse sentido ingressivo.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora esteja no singular morfológico, o gentílico tem sentido coletivo no contexto; o plural é a forma natural em português.
- source_word: לָמַס
  choice: a trabalhos forçados
  rationale: מַס designa trabalho compulsório imposto por um poder dominante, não uma contribuição voluntária nem apenas um tributo monetário.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: mas não os expulsou de todo
  rationale: A combinação do infinitivo absoluto com o verbo finito sob negação dá ênfase à não realização completa da expulsão. “De todo” expressa essa força em português corrente.
theological_decisions:
- issue: O tratamento imposto por Israel aos cananeus
  choice: Israel submeteu os cananeus a trabalhos forçados em vez de expulsá-los completamente.
  alternative: Entender מַס apenas como pagamento de tributo.
  rationale: O termo hebraico inclui coerção laboral no contexto de domínio político. A tradução mantém essa dureza sem suavizar o relato.
- issue: A expulsão incompleta dos cananeus
  choice: A construção enfática é traduzida como “não os expulsou de todo”.
  alternative: Traduzir simplesmente “não os expulsou”, sem representar a ênfase hebraica.
  rationale: A repetição verbal hebraica ressalta que a expulsão não foi levada a cabo por completo, sem explicar por que isso ocorreu.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Trabalhos forçados” comunica diretamente a coerção; “de todo” preserva a ênfase hebraica sem soar técnico.
