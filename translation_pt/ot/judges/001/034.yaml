  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A expressão “filhos de Dã” preserva a forma tribal do original; a concordância no plural no texto principal comunica naturalmente o valor coletivo das formas hebraicas singulares.
