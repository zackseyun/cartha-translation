  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: pt
  text: Os amorreus pressionaram os filhos de Dã, obrigando-os a recuar para a região montanhosa[a], pois não lhes permitiram descer ao vale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O amorreu pressionou os filhos de Dã em direção à região montanhosa, pois não permitiu que descesse ao vale”. O etnônimo “o amorreu” e o verbo posterior estão no singular coletivo em hebraico, embora o sentido no contexto seja plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: pressionaram ... obrigando-os a recuar
  rationale: O verbo expressa pressão hostil ou opressão que restringe o movimento. A formulação explicita naturalmente, sem excessiva paráfrase, que os danitas foram forçados a permanecer na região montanhosa.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: Embora o hebraico empregue um etnônimo morfologicamente singular, ele tem sentido coletivo; o plural é a forma natural em português.
- source_word: בְּנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a expressão tribal e familiar do hebraico e continua clara em português bíblico moderno.
- source_word: הָהָרָה
  choice: para a região montanhosa
  rationale: A terminação direcional indica movimento rumo à área de montes. “Região montanhosa” comunica a geografia e mantém o contraste com o vale.
- source_word: כִּי
  choice: pois
  rationale: Introduz a causa da pressão descrita na oração anterior, em registro narrativo natural e digno.
- source_word: לֹא נְתָנוֹ
  choice: não permitiam que descessem
  rationale: As formas hebraicas são singulares por concordarem com coletivos, mas o referente contextual é plural. A construção portuguesa reproduz claramente o sentido permissivo de נתן.
- source_word: לָרֶדֶת
  choice: descessem
  rationale: Verbo natural para o movimento topográfico da região montanhosa ao vale.
- source_word: לָעֵמֶק
  choice: ao vale
  rationale: עֵמֶק designa um vale ou baixada; “vale” é direto e adequado ao contraste geográfico.
