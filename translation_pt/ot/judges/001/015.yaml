base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: pt
  text: 'Ela lhe disse: “Peço que me dê uma bênção, pois me deu a terra do Neguebe[a]; dê-me também fontes de água[b]”. Então Calebe lhe deu as fontes superiores e as inferiores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra do sul”. O hebraico négev pode designar a região do Neguebe ou, de forma mais geral, a região meridional e árida.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica pode referir-se a nascentes, reservatórios ou outras fontes de água; o sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי
  choice: Peço que me dê
  rationale: Expressa a força do pedido imperativo de maneira cortês e natural em português, sem transformá-lo numa ordem brusca.
- source_word: בְרָכָה
  choice: uma bênção
  rationale: Mantém o sentido básico do substantivo hebraico, embora, no contexto, a bênção assuma a forma concreta de uma concessão benéfica.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: a terra do Neguebe
  rationale: Trata Neguebe como nome geográfico, leitura clara no contexto, sem ocultar em nota a possibilidade de uma descrição regional ou topográfica.
- source_word: גֻּלֹּת מָיִם
  choice: fontes de água
  rationale: Comunica de modo natural a ideia de recursos hídricos indispensáveis numa região árida, preservando em nota a incerteza sobre a natureza exata desses reservatórios ou nascentes.
- source_word: גֻּלֹּת עִלִּית
  choice: as fontes superiores
  rationale: Conserva a correspondência com 'fontes de água' e o contraste topográfico indicado por 'superiores'.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: as inferiores
  rationale: O substantivo 'fontes' fica subentendido de modo natural e o adjetivo mantém o contraste com as fontes superiores.
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: Então Calebe lhe deu
  rationale: Representa a progressão narrativa e apresenta a concessão como resposta direta ao pedido.
