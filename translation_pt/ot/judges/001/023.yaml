base_translation:
  language: en
  yaml_path: translation/ot/judges/001/023.yaml
  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: pt
  text: A casa de José fez reconhecimento em Betel[a]; anteriormente, o nome da cidade era Luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «explorou Betel» ou «fez o reconhecimento de Betel». Neste contexto, o verbo hebraico se refere a explorar ou reconhecer o lugar com finalidade militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: enviou homens para reconhecer
  rationale: O verbo, neste contexto militar, indica realizar reconhecimento ou mandar exploradores. A formulação explicita de modo natural em português o sentido contextual sem recorrer ao menos corrente «espiar».
- source_word: בֵית יוֹסֵף
  choice: a casa de José
  rationale: Preserva a designação coletiva e tribal do hebraico sem definir com excessiva precisão seu alcance social.
- source_word: בְּבֵית אֵל
  choice: Betel
  rationale: Com o verbo de reconhecimento, a preposição introduz o lugar tomado como objeto da ação; em português, «reconhecer Betel» é natural.
- source_word: וְשֵׁם הָעִיר
  choice: o nome da cidade
  rationale: Mantém a estrutura hebraica em português claro e natural.
- source_word: לְפָנִים
  choice: anteriormente
  rationale: Expressa que Luz era o nome da cidade em uma época anterior.
- source_word: לוּז
  choice: Luz
  rationale: Transliteração portuguesa tradicional do topônimo hebraico.
