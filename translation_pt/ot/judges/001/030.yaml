  verdict: revise
  source_fidelity: A tradução transmite corretamente a não expulsão dos habitantes, os dois topônimos, a permanência coletiva dos cananeus e sua sujeição a trabalho compulsório. Contudo, “no meio da tribo” explicita no texto principal um referente que o hebraico apenas sugere pelo sufixo singular; é preferível conservar a formulação coletiva sem essa explicitação.
  naturalness: O português é claro, moderno e de registro adequado. “Entre eles” é mais idiomático e menos pesado que “no meio da tribo”, mantendo a ligação natural com “Zebulom” entendido coletivamente.
  terminology: “Expulsou”, “habitantes”, “cananeus” e “trabalhos forçados” são escolhas adequadas. “Quitrom”, “Naalol” e “Zebulom” são transliterações consistentes. A nota sobre Naalal deve ser reformulada como variante de leitura/tradição, sem sugerir desnecessariamente uma designação alternativa estabelecida.
  issues:
