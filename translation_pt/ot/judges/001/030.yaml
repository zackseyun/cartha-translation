    issue: Redação da nota a
    rationale: “Também chamado” pode sugerir que se trata de um segundo nome corrente. A nota de origem informa uma forma variante preservada pela tradição e por passagens relacionadas; convém expressar isso de modo mais preciso.
  revised_text: Zebulom não expulsou os habitantes de Quitrom nem os habitantes de Naalol[a]. Assim, os cananeus viveram entre eles[b] e foram submetidos a trabalhos forçados.
