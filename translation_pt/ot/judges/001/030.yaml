revisions:
- from: Zebulom não expulsou os habitantes de Quitrom nem os habitantes de Naalol[a]. Assim, os cananeus viveram no meio da tribo[b] e foram submetidos a trabalhos forçados.
  to: Zebulom não expulsou os habitantes de Quitrom nem os habitantes de Naalol[a]. Assim, os cananeus viveram entre eles[b] e foram submetidos a trabalhos forçados.
  rationale: A revisão substitui a explicitação interpretativa “no meio da tribo” por “entre eles”, que comunica naturalmente o sentido coletivo em português sem apresentar como explícito o referente tribal apenas provável do sufixo hebraico. A nota a é ajustada para identificar “Naalal” precisamente como forma variante preservada por tradições e passagens relacionadas.
