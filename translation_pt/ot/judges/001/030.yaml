    issue: Explicitação de “a tribo” no texto principal
    rationale: O hebraico traz literalmente “em seu meio”, com sufixo singular que provavelmente retoma Zebulom corporativamente. “Da tribo” é uma interpretação plausível, mas reduz uma ambiguidade formal que a tradução pode preservar naturalmente com “entre eles”.
