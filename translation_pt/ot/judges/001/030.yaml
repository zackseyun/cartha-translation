  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: pt
  text: Zebulom não expulsou os habitantes de Quitrom nem os habitantes de Naalol[a]. Assim, os cananeus viveram entre eles[b] e foram submetidos a trabalhos forçados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Naalal”; tradições e passagens relacionadas às vezes preservam essa forma do topônimo.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “o cananeu viveu no meio dele”, com um singular coletivo para o povo e um sufixo singular que provavelmente se refere a Zebulom como tribo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: expulsou
  rationale: O hifil de ירש, neste contexto de ocupação territorial, indica remover os habitantes anteriores. “Expulsou” é claro e natural em português, sem acrescentar uma nuance técnica indevida.
- source_word: יוֹשְׁבֵי
  choice: habitantes de
  rationale: O particípio de ישב designa os que moram em determinado lugar; “habitantes de” preserva de modo conciso o sentido territorial.
- source_word: קִטְרוֹן
  choice: Quitrom
  rationale: Transliteração portuguesa do topônimo hebraico, com “qu” para o som inicial /k/ e “m” final conforme o uso ortográfico português para representar a nasal final.
- source_word: נַהֲלֹל
  choice: Naalol
  rationale: Transliteração baseada na vocalização massorética deste versículo. A forma variante “Naalal” é registrada em nota.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: os cananeus viveram no meio da tribo
  rationale: O singular הַכְּנַעֲנִי tem valor coletivo, e o sufixo singular de בְּקִרְבּוֹ provavelmente retoma Zebulom como entidade tribal. A formulação portuguesa comunica essa referência corporativa sem criar um antecedente pessoal ambíguo.
- source_word: לָמַס
  choice: trabalhos forçados
  rationale: מַס denota aqui trabalho compulsório imposto a uma população subjugada, e não apenas tributo monetário.
- source_word: וַיִּהְיוּ לָמַס
  choice: foram submetidos a trabalhos forçados
  rationale: A expressão descreve a condição imposta aos cananeus. Esta formulação é idiomática em português e evita a impressão de que eles próprios se tornaram uma abstração chamada “trabalho”.
theological_decisions:
- issue: Singular coletivo הַכְּנַעֲנִי e sufixo singular בְּקִרְבּוֹ
  choice: Traduzir o povo coletivamente como “os cananeus” e explicitar o provável referente corporativo como “a tribo”.
  alternative: “o cananeu viveu no meio dele” ou “os cananeus viveram no meio de Zebulom”
  rationale: O hebraico frequentemente representa povos e tribos por formas singulares coletivas. A tradução mantém esse sentido, mas a nota documenta a forma gramatical do original e evita tratar como absolutamente certa uma referência que está apenas implícita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Os topônimos seguem transliteração adaptada à ortografia portuguesa; a sintaxe explicita com moderação o referente tribal implícito no hebraico.
