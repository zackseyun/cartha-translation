base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: pt
  text: Dali ele avançou contra os habitantes de Debir[a]. (Antigamente, Debir se chamava Quiriate-Sefer[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em direção aos habitantes de Debir”. A preposição hebraica significa literalmente “a/para”, mas, neste relato de conquista, introduz um movimento hostil.'
    reason: lexical_alternative
  - marker: b
    text: Quiriate-Sefer era o nome anterior de Debir. O nome pode significar “Cidade do Livro” ou “Cidade dos Escribas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: avançou
  rationale: O verbo הלך significa basicamente “ir”. Neste contexto de conquista, “avançou” expressa naturalmente o movimento em direção hostil sem especificar mais do que o hebraico.
- source_word: מִשָּׁם
  choice: Dali
  rationale: Forma corrente e concisa de indicar movimento a partir do lugar mencionado anteriormente.
- source_word: אֶל
  choice: contra
  rationale: Embora a preposição signifique literalmente “a/para”, o contexto de conquista indica movimento hostil; “contra” comunica isso de modo natural.
- source_word: יוֹשְׁבֵי
  choice: os habitantes de
  rationale: O particípio substantivado de ישב designa os residentes de um lugar; “habitantes” é claro, digno e corrente.
- source_word: דְּבִיר
  choice: Debir
  rationale: Nome próprio de lugar transliterado segundo o uso português corrente.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: Antigamente, Debir se chamava
  rationale: Construção idiomática em português que preserva claramente a informação de que esse era o nome anterior da cidade.
- source_word: קִרְיַת סֵפֶר
  choice: Quiriate-Sefer
  rationale: O topônimo é transliterado, em vez de receber no texto principal uma tradução etimológica incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Avançou contra” torna explícita a direção hostil indicada pelo contexto, sem recorrer ao mais específico “marchou”. Os parênteses preservam o caráter explicativo da observação sobre o nome anterior.
