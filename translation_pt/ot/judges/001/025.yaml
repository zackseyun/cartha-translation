source:
  edition: WLC
  text: וַ/יַּרְאֵ/ם֙ אֶת מְב֣וֹא הָ/עִ֔יר וַ/יַּכּ֥וּ אֶת הָ/עִ֖יר לְ/פִי חָ֑רֶב וְ/אֶת הָ/אִ֥ישׁ וְ/אֶת כָּל מִשְׁפַּחְתּ֖/וֹ שִׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: pt
  text: Então ele lhes mostrou a entrada da cidade, e eles feriram a cidade ao fio da espada[a]; mas deixaram ir o homem e toda a sua família[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “à boca da espada”, expressão que significa “ao fio da espada”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a sua casa” ou “todo o seu clã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: ele lhes mostrou
  rationale: 'A forma de ראה tem sentido causativo neste contexto: o homem fez com que vissem, isto é, revelou ou indicou a entrada da cidade.'
- source_word: מְבוֹא הָעִיר
  choice: a entrada da cidade
  rationale: מָבוֹא pode designar entrada, acesso ou caminho de entrada; esta formulação é natural e concreta no contexto militar.
- source_word: וַיַּכּוּ
  choice: eles feriram
  rationale: נכה é um verbo amplo, que pode significar ferir, golpear ou derrotar. “Feriram” preserva a força verbal sem incorporar antecipadamente a expressão seguinte sobre a espada.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: A expressão hebraica significa literalmente “à boca da espada”. “Ao fio da espada” conserva a imagem idiomática e comunica a ação letal em português corrente de registro bíblico.
- source_word: שִׁלֵּחוּ
  choice: deixaram ir
  rationale: No contexto, o verbo indica que o homem foi poupado e liberado, não apenas enviado a algum lugar.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O substantivo definido retoma o indivíduo mencionado no versículo anterior.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: toda a sua família
  rationale: מִשְׁפָּחָה pode referir-se à família, à casa ou ao clã. “Toda a sua família” é claro e natural, sem excluir o possível sentido mais amplo.
theological_decisions: []
