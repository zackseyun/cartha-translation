  text: וּ/גְבוּל֙ הָ/אֱמֹרִ֔י מִֽ/מַּעֲלֵ֖ה עַקְרַבִּ֑ים מֵ/הַ/סֶּ֖לַע וָ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: pt
  text: E a fronteira dos amorreus ia desde a subida de Acrabim[a], desde Selá[b] e para cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Acrabim significa “escorpiões”; outra tradução possível é “a subida dos Escorpiões”.
    reason: lexical_alternative
  - marker: b
    text: Ou “desde a rocha”, caso o hebraico seja entendido como substantivo comum, e não como o topônimo Selá.
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: fronteira
  rationale: O termo designa aqui a linha divisória geográfica, não todo o território.
- source_word: הָאֱמֹרִי
  choice: dos amorreus
  rationale: Embora esteja morfologicamente no singular, o gentílico tem sentido coletivo; o plural é natural em português.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: desde a subida de Acrabim
  rationale: מַעֲלֵה indica uma subida ou passagem ascendente, e עַקְרַבִּים integra um topônimo conhecido. A transliteração preserva o nome, enquanto o sentido literal aparece em nota.
- source_word: מֵהַסֶּלַע
  choice: desde Selá
  rationale: No contexto geográfico, o termo pode ser entendido como o topônimo Selá, embora a forma hebraica também permita o substantivo comum 'a rocha'; essa alternativa é preservada em nota.
- source_word: וָמָעְלָה
  choice: e para cima
  rationale: A expressão indica continuação em direção ascendente ou para além daquele ponto, mantendo-se concisa em português.
- source_word: וּ
  choice: E
  rationale: A conjunção liga esta notícia geográfica ao contexto anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a repetição espacial do hebraico e não elimina a ambiguidade entre o topônimo Selá e o substantivo comum 'rocha'.
