base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: pt
  text: Então Judá foi com Simeão, seu irmão, e eles derrotaram os cananeus que moravam em Zefate e consagraram a cidade à destruição.[a] E ele chamou[b] a cidade de Hormá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruíram completamente a cidade” ou “colocaram a cidade sob interdição”. O verbo hebraico indica destinar algo de modo irrevogável, muitas vezes mediante sua destruição.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “ele chamou”. O singular provavelmente se refere a Judá como sujeito coletivo ou representativo. Algumas traduções trazem “eles chamaram”.'
    reason: alternative_reading
  - marker: c
    text: Hormá soa como a palavra hebraica relacionada a algo consagrado à destruição (ḥerem), o que explica o nome da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: Judá foi com Simeão, seu irmão
  rationale: O verbo הלך significa literalmente “ir”, e אֶת introduz aqui a ideia de companhia. A formulação preserva o nome “Judá”, que no contexto representa coletivamente a tribo, sem acrescentar essa explicação ao texto.
- source_word: וַיַּכּוּ
  choice: eles derrotaram
  rationale: Em narrativa militar, נכה pode indicar golpear e vencer decisivamente. “Derrotaram” é claro em português e não antecipa indevidamente os detalhes da destruição expressos pelo verbo seguinte.
- source_word: הַכְּנַעֲנִי יֹשֵׁב צְפַת
  choice: os cananeus que moravam em Zefate
  rationale: O substantivo singular funciona coletivamente, como confirma o verbo no plural. “Moravam” comunica de modo natural o sentido residencial do particípio יֹשֵׁב.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: consagraram a cidade à destruição
  rationale: O Hifil de חרם reúne as ideias de destinação irrevogável e destruição. O referente feminino é explicitado como “a cidade” para evitar a ambiguidade pronominal do português.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: ele chamou a cidade
  rationale: O verbo hebraico está no singular e provavelmente toma Judá como sujeito coletivo ou representativo. A fórmula portuguesa é mais natural que a reprodução literal “chamou o nome da cidade”.
- source_word: חָרְמָה
  choice: Hormá
  rationale: O topônimo é transliterado de maneira legível em português. Sua associação sonora com חרם é preservada em nota, sem transformar o nome próprio em tradução explicativa.
theological_decisions:
- issue: Sentido de חרם no contexto de guerra
  choice: consagraram a cidade à destruição
  alternative: destruíram completamente a cidade; colocaram a cidade sob interdição
  rationale: A escolha mantém juntas as dimensões de consagração irrevogável e destruição presentes no termo hebraico, sem reduzi-lo a mero ato militar.
- issue: Número do sujeito em וַיִּקְרָא
  choice: ele chamou
  alternative: eles chamaram
  rationale: A forma verbal massorética é singular. Mantê-la preserva a tensão gramatical do texto, entendendo “Judá” como sujeito coletivo ou representativo, em vez de harmonizá-la silenciosamente com os verbos plurais anteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Zefate” e “Hormá” seguem formas transliteradas naturais em português. A explicitação de “a cidade” evita um pronome feminino potencialmente pouco claro, sem acrescentar novo referente.
