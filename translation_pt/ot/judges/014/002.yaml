base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: pt
  text: 'Então ele subiu, contou ao pai e à mãe e disse: “Vi em Timna uma mulher, uma das filhas dos filisteus. Agora, vão buscá-la para mim como esposa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Então ele subiu
  rationale: Preserva o sentido básico de עלה, que indica subir, sem explicar além do que o texto afirma.
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O hifil de נגד significa contar, informar ou dar a conhecer; “contou” é natural neste contexto familiar.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: ao pai e à mãe
  rationale: A construção possessiva é clara pelo contexto, e esta formulação evita repetição desnecessária em português.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: Aqui אִשָּׁה designa a mulher que Sansão viu; somente depois ele pede que ela lhe seja dada como esposa.
- source_word: בְתִמְנָתָה
  choice: em Timna
  rationale: Apresenta Timna como o lugar onde ele viu a mulher, em português corrente.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: uma das filhas dos filisteus
  rationale: Expressa naturalmente o valor partitivo de מִן e conserva a imagem familiar do hebraico.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição do relato para a exigência que se segue, sem acrescentar uma relação lógica mais forte do que a do hebraico.
- source_word: קְחוּ אוֹתָהּ לִּי לְאִשָּׁה
  choice: vão buscá-la para mim como esposa
  rationale: O imperativo plural dirige-se ao pai e à mãe no contexto de um casamento providenciado. “Vão buscá-la” comunica o sentido contextual de tomar ou obter sem sugerir que já fosse esposa dele.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “contou... e disse” conserva a sequência hebraica, e a ordem direta mantém o tom incisivo do pedido de Sansão.
