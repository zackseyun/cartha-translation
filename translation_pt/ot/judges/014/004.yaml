  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: pt
  text: Mas seu pai e sua mãe não sabiam que isso vinha do SENHOR[a], pois ele procurava uma ocasião contra os filisteus[b]. Naquele tempo, os filisteus dominavam Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois ele procurava uma ocasião contra os filisteus”, entendendo-se que “ele” se refere ao SENHOR. O hebraico permite essa leitura, embora o contexto provavelmente aponte para Sansão.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “um pretexto” ou “uma oportunidade”; a expressão hebraica também pode ser vertida mais literalmente como “uma ocasião da parte dos filisteus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: vinha de Yahweh
  rationale: Expressa diretamente a origem divina indicada por מִן e translitera o nome pessoal divino, conforme a camada inglesa auditada fornecida.
- source_word: הִיא
  choice: isso
  rationale: O pronome feminino retoma a situação em questão; em português, “isso” é uma retomada natural sem impor que o referente seja especificamente a mulher.
- source_word: תֹאֲנָה
  choice: uma ocasião
  rationale: Preserva a ideia de uma abertura ou oportunidade para agir sem acrescentar a conotação necessariamente enganosa de “pretexto”.
- source_word: מְבַקֵּשׁ
  choice: ele procurava
  rationale: O particípio descreve uma ação em curso; o imperfeito português comunica adequadamente esse valor.
- source_word: מִפְּלִשְׁתִּים
  choice: contra os filisteus
  rationale: Embora a preposição possa ser formalmente entendida como “da parte dos filisteus”, a expressão no contexto aponta para uma ocasião de ação hostil contra eles; a alternativa literal é registrada em nota.
- source_word: וּבָעֵת הַהִיא
  choice: Naquele tempo
  rationale: Transição temporal natural e fiel em português contemporâneo.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: dominavam Israel
  rationale: Comunica o exercício contínuo de poder sobre Israel e soa mais natural do que “estavam governando sobre” neste contexto de sujeição estrangeira.
- source_word: וְאָבִיו וְאִמּוֹ
  choice: seu pai e sua mãe
  rationale: Mantém os dois possessivos do hebraico de modo natural e claro em português.
- source_word: לֹא יָדְעוּ
  choice: não sabiam
  rationale: Tradução direta e idiomática do perfeito de ידע neste contexto.
theological_decisions:
- issue: Envolvimento divino na iniciativa de Sansão e no conflito resultante
  choice: O texto afirma que a situação vinha de Yahweh e, ao mesmo tempo, apresenta Sansão procurando uma ocasião contra os filisteus.
  alternative: Entender a declaração como causalidade divina exaustiva sobre o desejo de Sansão, ou apenas como uso posterior de uma escolha humana independente.
  rationale: A tradução conserva lado a lado a atribuição divina e a atuação humana, sem resolver a tensão de acordo com um sistema teológico externo.
- issue: Referente de “ele procurava”
  choice: O pronome é entendido no texto principal como referência a Sansão.
  alternative: Entender Yahweh como o sujeito de “procurava”.
  rationale: O contexto narrativo favorece Sansão como agente que procura uma ocasião por meio dessa situação, mas a sintaxe hebraica permite entender Yahweh como sujeito; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” preserva o nome divino conforme a camada de consulta fornecida. A formulação mantém a ambiguidade sintática relevante em nota e evita determinar além do texto a relação entre a ação divina e a de Sansão.
