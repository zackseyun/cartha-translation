base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: pt
  text: Ela chorou diante dele durante os sete dias da festa.[a] No sétimo dia, ele lhe contou, porque ela o pressionara insistentemente. Então ela contou o enigma aos homens do seu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente que ela “chorou sobre ele”, expressão que indica um choro dirigido a ele e usado como pressão persistente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos filhos do seu povo”; no contexto, a expressão provavelmente se refere aos homens filisteus que participavam da festa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: Ela chorou diante dele
  rationale: בכה significa chorar, e עַל com o sufixo indica aqui que o choro era dirigido a Sansão e exercia pressão sobre ele. A formulação portuguesa é natural, enquanto a nota preserva a força particular do idioma hebraico.
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: durante os sete dias da festa
  rationale: A expressão indica toda a duração do banquete festivo, provavelmente nupcial. Esta forma evita uma construção rígida e mantém a referência definida aos sete dias.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: A construção faz avançar a narrativa e introduz a indicação temporal; em português, a forma concisa é clara e natural.
- source_word: וַיַּגֶּד לָהּ
  choice: ele lhe contou a resposta
  rationale: נגד significa contar ou dar a conhecer. O objeto está implícito no hebraico; 'a resposta' explicita naturalmente aquilo que Sansão revelou, sem transformar o enigma no objeto da primeira ocorrência do verbo.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: porque ela o pressionava insistentemente
  rationale: O hifil de צוק transmite pressão intensa e persistente. A expressão portuguesa comunica coerção emocional continuada sem recorrer a linguagem excessivamente técnica.
- source_word: וַתַּגֵּד הַחִידָה
  choice: Então ela contou o enigma
  rationale: A segunda ocorrência de נגד tem חִידָה como objeto expresso. 'Contou o enigma' mantém a repetição verbal do hebraico de modo idiomático.
- source_word: לִבְנֵי עַמָּהּ
  choice: aos homens do seu povo
  rationale: Literalmente, 'aos filhos do seu povo'. No contexto, o masculino se refere aos homens filisteus envolvidos no episódio; 'homens do seu povo' preserva essa referência sem o artificialismo de 'filhos do seu povo'.
