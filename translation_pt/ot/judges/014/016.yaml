translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O diálogo mantém o tom emocional da acusação e a resposta retórica de Sansão. A nota conserva a forma masculina explícita do hebraico sem impor ao texto principal a expressão pouco natural ‘filhos do meu povo’.
