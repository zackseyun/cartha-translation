  to: 'Então a esposa de Sansão chorou diante dele e disse: “Você só me odeia; não me ama. Você propôs o enigma aos homens do meu povo[a], mas não me contou.” Ele lhe disse: “Veja, não contei nem ao meu pai nem à minha mãe; e contaria a você?”'
