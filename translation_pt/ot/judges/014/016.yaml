base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: pt
  text: 'Então a esposa de Sansão chorou diante dele e disse: “Você só me odeia; não me ama. Você propôs o enigma aos homens do meu povo[a], mas não me contou.” Ele lhe disse: “Veja, não contei nem ao meu pai nem à minha mãe; e contaria a você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos do meu povo”. O hebraico está no masculino e, neste contexto, provavelmente se refere aos homens do povo dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: chorou diante dele
  rationale: בכה significa ‘chorar’, e עַל com referência a uma pessoa, neste contexto, retrata o choro dirigido a Sansão ou em sua presença. ‘Diante dele’ é natural em português e evita a ideia indevida de luto sugerida por ‘chorou por ele’.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: a mulher de Sansão
  rationale: A construção designa a esposa de Sansão. ‘A mulher de Sansão’ é uma forma corrente e natural em português brasileiro, sem perder a relação conjugal indicada pelo contexto.
- source_word: רַק
  choice: só
  rationale: 'Aqui רַק intensifica a acusação: segundo ela, ele não faz outra coisa senão odiá-la. ‘Só’ preserva essa força de modo conciso.'
- source_word: שְׂנֵאתַנִי ... וְלֹא אֲהַבְתָּנִי
  choice: Você só me odeia; não me ama
  rationale: Mantém diretamente o contraste hebraico entre odiar e amar e conserva o tom emotivo e acusatório.
- source_word: הַחִידָה חַדְתָּ
  choice: Você propôs o enigma
  rationale: חִידָה é ‘enigma’, e o verbo חוד, neste uso, significa apresentar ou propor um enigma. A formulação é clara e idiomática.
- source_word: לִבְנֵי עַמִּי
  choice: aos homens do meu povo
  rationale: Literalmente, ‘aos filhos do meu povo’. A expressão masculina, neste cenário, provavelmente se refere aos homens filisteus participantes da festa; ‘homens do meu povo’ comunica essa referência sem soar artificial.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: mas não me contou a resposta
  rationale: O hebraico diz literalmente ‘mas a mim não contaste’. Como o objeto implícito é a solução do enigma, ‘a resposta’ torna a fala natural e clara sem alterar o sentido.
- source_word: הִנֵּה
  choice: Veja
  rationale: הִנֵּה chama enfaticamente a atenção para o argumento seguinte. ‘Veja’ preserva essa função em registro moderno.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: não contei nem ao meu pai nem à minha mãe
  rationale: A construção negativa portuguesa com ‘nem... nem’ expressa naturalmente a menção explícita aos dois pais.
- source_word: וְלָךְ אַגִּיד
  choice: por que contaria a você?
  rationale: Formalmente, ‘e a você contarei?’. A pergunta é retórica e contrasta a esposa com os próprios pais de Sansão; ‘por que contaria a você?’ reproduz naturalmente essa força, sem transformar a fala em uma afirmação categórica.
