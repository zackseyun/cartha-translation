  verdict: revise
  source_fidelity: A tradução transmite adequadamente a acusação e a resposta retórica. Contudo, «a resposta» explicita um objeto que o hebraico deixa implícito, e «por que» introduz uma interrogativa causal não expressa no texto. «Esposa» traduz de modo mais inequívoco a relação marital de אֵשֶׁת.
  naturalness: O português é claro, moderno e apropriado ao diálogo narrativo. «E contaria a você?» é uma pergunta retórica idiomática e mais próxima da forma hebraica do que «por que contaria a você?».
  terminology: «Enigma» corresponde bem a חִידָה; «homens do meu povo», com a nota, representa de forma natural o masculino בני עמי no contexto. «Esposa» é preferível a «mulher» por explicitar em português a relação conjugal que o hebraico afirma.
  issues:
  - severity: medium
    issue: «mas não me contou a resposta» acrescenta «a resposta».
    rationale: O objeto de «contou» está implícito no hebraico. Embora seja inferível pelo contexto, a tradução de equivalência ótima deve preservar essa elipse quando o português a admite naturalmente.
  - severity: low
    issue: «por que contaria a você?» introduz uma relação causal explícita.
    rationale: וְלָךְ אַגִּיד é literalmente uma pergunta coordenada, «e a você contarei?». A formulação causal interpreta corretamente a retórica, mas acrescenta «por que», ausente do original.
  - severity: low
    issue: «a mulher de Sansão» pode ser entendida em português apenas como uma mulher associada a Sansão.
    rationale: אֵשֶׁת שִׁמְשׁוֹן designa sua esposa; «a esposa de Sansão» evita ambiguidade desnecessária.
