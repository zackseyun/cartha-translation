base_translation:
  language: en
  yaml_path: translation/ot/judges/014/020.yaml
  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: pt
  text: E a esposa de Sansão tornou-se esposa do seu companheiro[a], que tinha sido seu amigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se esposa de seu amigo, que o acompanhara”. O hebraico emprega termos relacionados do grupo רעה para indicar associação social.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: foi dada
  rationale: No contexto narrativo, היה com לְ indica que a mulher passou a pertencer a outro homem como esposa. “Foi dada” exprime naturalmente em português o resultado da transferência, explicitada pelo contexto, embora a formulação hebraica seja literalmente “tornou-se/veio a ser”.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: a mulher de Sansão
  rationale: A cadeia construta indica a relação matrimonial. “Mulher de Sansão” é uma forma natural e amplamente compreensível em português bíblico moderno; o contexto deixa claro o sentido de esposa.
- source_word: לְמֵרֵעֵהוּ
  choice: ao companheiro dele
  rationale: A preposição לְ com היה expressa transferência ou nova pertença. מֵרֵעַ designa aqui um companheiro ou associado, provavelmente ligado às bodas; “companheiro” preserva a distinção lexical relativa antes de “amigo”.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: que havia sido seu amigo
  rationale: A oração relativa identifica o companheiro como alguém que se associara a Sansão. O verbo do grupo רעה comunica aqui associação ou amizade, não pastoreio; o mais-que-perfeito situa essa relação antes do desfecho narrado.
