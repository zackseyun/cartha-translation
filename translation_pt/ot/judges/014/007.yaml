base_translation:
  language: en
  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: pt
  text: Então ele desceu e falou com a mulher, e ela agradou aos olhos de Sansão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “ela agradou a Sansão” ou “ela pareceu adequada a Sansão”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Então ele desceu
  rationale: Preserva o movimento geográfico em direção a Timna; “então” expressa com naturalidade a sequência narrativa do waw consecutivo.
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: דבר com ל indica falar a alguém. “Falou com a mulher” é natural em português e não exige que se acrescente um conteúdo não expresso.
- source_word: לָאִשָּׁה
  choice: com a mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; como o casamento ainda não ocorreu, “a mulher” evita antecipar a relação matrimonial.
- source_word: וַתִּישַׁר
  choice: pareceu certa
  rationale: A forma de ישר comunica uma avaliação favorável ou adequação. “Pareceu certa” preserva tanto a ideia de aprovação quanto a possível ressonância literária com aquilo que parece certo aos próprios olhos.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: aos olhos de Sansão
  rationale: Mantém a imagem hebraica e sua possível ligação com o motivo recorrente de Juízes sobre o que é certo aos olhos de alguém.
theological_decisions:
- issue: Possível ressonância com o motivo, em Juízes, do que é certo aos próprios olhos
  choice: “pareceu certa aos olhos de Sansão”
  alternative: “agradou a Sansão” ou “Sansão gostou dela”
  rationale: A formulação conserva a ambiguidade entre atração, aprovação e adequação, além da possível tensão literária, sem transformar essa ressonância em uma afirmação explícita.
translation_notes:
  register: Português moderno, digno e acessível, com preservação deliberada do idioma hebraico “aos olhos de Sansão”. O marcador de nota foi colocado após a expressão que ele esclarece.
