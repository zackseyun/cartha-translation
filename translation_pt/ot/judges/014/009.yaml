base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: pt
  text: Ele retirou o mel para as mãos[a] e seguiu caminho, comendo enquanto andava. Depois foi até seu pai e sua mãe, deu-lhes um pouco, e eles comeram. Mas não lhes contou que havia retirado o mel da carcaça do leão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “raspou o mel” ou “recolheu o mel”; o verbo hebraico sugere retirar o mel manualmente da carcaça.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ אֶל כַּפָּיו
  choice: tirou o mel com as mãos
  rationale: O verbo רדה, neste contexto, descreve a retirada do mel do interior da carcaça; אֶל כַּפָּיו menciona literalmente as palmas das mãos. A formulação escolhida expressa de modo natural em português tanto a retirada quanto o uso das mãos, sem definir além do necessário se ele raspou ou recolheu o mel.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: seguiu caminho, comendo enquanto andava
  rationale: 'A combinação do verbo finito com os infinitivos absolutos comunica ação contínua: Sansão prosseguia e comia durante o percurso.'
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: Depois foi até seu pai e sua mãe
  rationale: הלך significa aqui ir; “depois” reproduz com naturalidade a progressão narrativa marcada pelo waw consecutivo.
- source_word: וַיִּתֵּן לָהֶם
  choice: deu-lhes um pouco
  rationale: O objeto subentendido é uma porção do mel. “Um pouco” torna explícito o sentido partitivo exigido pelo contexto sem acrescentar informação estranha ao texto.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: Mas não lhes contou
  rationale: הגיד significa contar, declarar ou informar. “Mas” comunica adequadamente o contraste narrativo, e “contou” é corrente e digno em português.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: da carcaça do leão
  rationale: גְּוִיָּה designa um corpo morto. Para um animal, “carcaça” preserva de maneira precisa e concreta o sentido do hebraico.
- source_word: רָדָה הַדְּבָשׁ
  choice: havia tirado o mel
  rationale: Mantém a correspondência com a primeira ocorrência de רדה. O mais-que-perfeito composto é natural na oração explicativa introduzida por כִּי.
