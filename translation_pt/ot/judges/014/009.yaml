  to: Ele retirou o mel para as mãos[a] e seguiu caminho, comendo enquanto andava. Depois foi até seu pai e sua mãe, deu-lhes um pouco, e eles comeram. Mas não lhes contou que havia retirado o mel da carcaça do leão.
