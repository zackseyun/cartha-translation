    reason: lexical_alternative
  revision_rationale: A revisão conserva o sentido e o registro do rascunho, mas traduz de modo mais completo a indicação “para as mãos” e ajusta a nota para refletir com maior precisão a margem lexical de רדה. A repetição de “retirou” mantém a coerência entre as duas ocorrências do verbo hebraico.
