  source_fidelity: A tradução transmite corretamente a capacitação súbita pelo Espírito de Yahweh, o despedaçamento do leão, a comparação com um cabrito e o silêncio de Sansão perante os pais. Contudo, בְּיָדוֹ está no singular, “em sua mão”; o plural “nas mãos” é idiomático, mas perde um pormenor concreto do hebraico.
  naturalness: O português é moderno, claro e apropriado ao registro narrativo. “Veio poderosamente sobre ele”, “despedaçou o leão” e “não contou ao pai nem à mãe” são formulações naturais e compreensíveis internacionalmente.
  terminology: “Espírito de Yahweh” preserva adequadamente רוּחַ יְהוָה e a política indicada para o nome divino. “Cabrito” é uma escolha clara para גְּדִי. A nota atualmente ligada a [b] acrescenta “arma ou qualquer outro instrumento”, uma inferência plausível, mas é preferível uma nota literal que não explicite além do hebraico.
  issues:
