source:
  edition: WLC
  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: pt
  text: Então o Espírito de Yahweh veio poderosamente sobre ele[a], e ele despedaçou o leão como se despedaça um cabrito, embora não tivesse nada na mão[b]. Mas não contou ao pai nem à mãe o que tinha feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apoderou-se dele com grande força”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não havia nada em sua mão”.'
    reason: literal_translation
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: veio poderosamente sobre ele
  rationale: O verbo צלח com עַל, especialmente em Juízes, descreve a vinda súbita e capacitadora do Espírito. A formulação preserva a força do evento sem sugerir um movimento físico literal.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: רוּחַ refere-se aqui ao Espírito divino que capacita Sansão, e יְהוָה é preservado como o nome próprio Yahweh.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: ele despedaçou o leão
  rationale: שׁסע indica rasgar ou partir violentamente. O objeto pronominal masculino retoma o leão mencionado no contexto; explicitá-lo torna o português claro.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: como se despedaça um cabrito
  rationale: A construção compara a ação à facilidade ou maneira de despedaçar um filhote de cabra. 'Cabrito' é natural e preciso em português.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: embora não tivesse nada nas mãos
  rationale: A oração destaca, com valor concessivo, que Sansão não usou arma ou instrumento. O plural idiomático 'nas mãos' soa natural em português sem alterar o sentido.
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: Mas não contou ao pai nem à mãe
  rationale: Após a negação, 'nem... nem' expressa claramente que nenhum dos pais foi informado; 'mas' comunica a leve contraposição narrativa.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: o que tinha feito
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da ação em relação ao ato de não contar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. 'Yahweh' preserva de modo transparente o nome pactual, sem substituí-lo por um título.
- issue: Natureza de רוּחַ neste contexto
  choice: Espírito
  alternative: espírito; vento
  rationale: A expressão רוּחַ יְהוָה e seu papel capacitador no ciclo de Sansão indicam o Espírito de Deus, não vento nem mera disposição humana.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. 'Veio poderosamente sobre ele' mantém a imagem hebraica e sua força; 'cabrito' evita a ambiguidade que outras designações poderiam criar.
