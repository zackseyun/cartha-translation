    issue: A nota [b] interpreta “nada na mão” como ausência de arma ou instrumento
    rationale: Embora o contexto sustente essa leitura, o texto hebraico não nomeia arma nem instrumento. Uma nota literal preserva melhor a formulação e a margem interpretativa do original.
