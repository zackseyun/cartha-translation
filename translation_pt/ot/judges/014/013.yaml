base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: pt
  text: 'Mas, se vocês não conseguirem me dar a resposta, terão de me dar trinta peças de linho[a] e trinta mudas de roupa”. Eles lhe disseram: “Proponha o seu enigma, para que o ouçamos”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trinta peças de roupa de linho”. O termo hebraico pode designar artigos de linho fino, provavelmente usados como vestuário neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ לְהַגִּיד לִי
  choice: não conseguirem me dar a resposta
  rationale: יכל expressa capacidade, e נגד no Hifil significa dizer ou declarar. Como o objeto implícito é a solução do enigma, “dar a resposta” comunica naturalmente o sentido contextual sem transformar a expressão em “explicar”.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: terão de me dar
  rationale: Nesse contexto de aposta, a construção apresenta a consequência obrigatória da condição; “terão de” preserva essa força em português corrente.
- source_word: סְדִינִים
  choice: peças de linho
  rationale: O termo designa artigos de linho fino, possivelmente vestíveis. “Peças de linho” preserva a amplitude lexical sem sugerir especificamente lençóis modernos.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: mudas de roupa
  rationale: A expressão indica conjuntos ou trocas de vestuário. “Mudas de roupa” é conciso, idiomático e distinto das peças de linho mencionadas antes.
- source_word: חוּדָה חִידָתְךָ
  choice: Proponha o seu enigma
  rationale: O imperativo חוד, com חידה como objeto, refere-se a apresentar ou propor um enigma. “Proponha” é mais preciso em português do que simplesmente “conte”.
- source_word: וְנִשְׁמָעֶנָּה
  choice: para que o ouçamos
  rationale: O cohortativo plural com sufixo feminino referente a חידה expressa o desejo de ouvir o enigma; a construção final é natural e preserva a nuance volitiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e no restante do mundo lusófono. O discurso direto mantém naturalidade, e “vocês” torna explícito o plural hebraico.
