base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: pt
  text: Então o Espírito de Yahweh veio sobre ele com poder. Ele desceu a Ascalom, matou trinta homens dentre eles, tomou as vestes deles[a] e deu as mudas de roupa aos que haviam revelado a solução do enigma. Sua ira se acendeu, e ele subiu para a casa de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode referir-se mais especificamente às roupas tiradas dos mortos e tomadas como despojo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: o Espírito de Yahweh veio sobre ele com poder
  rationale: A construção com צלח descreve a vinda súbita e poderosa do Espírito para capacitar alguém. A formulação é natural em português e preserva a força do hebraico sem sugerir mera prosperidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: ele desceu a Ascalom
  rationale: Preserva o verbo direcional ירד e usa a forma portuguesa tradicional do topônimo.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: matou trinta homens dentre eles
  rationale: Neste contexto, נכה designa violência letal; “matou” explicita com clareza o resultado. “Dentre eles” conserva o valor partitivo de מֵהֶם.
- source_word: חֲלִיצוֹתָם
  choice: as vestes deles
  rationale: “Vestes” traduz o referente sem incorporar ao texto principal toda a interpretação de que foram despidas dos mortos; essa provável nuance é preservada em nota.
- source_word: הַחֲלִיפוֹת
  choice: as mudas de roupa
  rationale: Expressão corrente para conjuntos de roupa destinados a substituir os usados, correspondendo ao prêmio combinado no contexto.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: aos que haviam revelado a solução do enigma
  rationale: נגד indica aqui tornar conhecida a resposta. A formulação deixa claro que essas pessoas solucionaram ou divulgaram a solução do enigma.
- source_word: וַיִּחַר אַפּוֹ
  choice: sua ira se acendeu
  rationale: Mantém a metáfora hebraica do ardor da ira em linguagem portuguesa digna e compreensível.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: ele subiu para a casa de seu pai
  rationale: Conserva o sentido direcional de עלה sem substituir o verbo pela inferência contextual “voltou”.
theological_decisions:
- issue: Linguagem da atuação capacitadora do Espírito
  choice: o Espírito de Yahweh veio sobre ele com poder
  alternative: o Espírito de Yahweh se apoderou dele
  rationale: A escolha expressa uma ação divina súbita e poderosa, mas não acrescenta aprovação moral de todos os atos subsequentes de Sansão; assim, preserva a tensão narrativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A coordenação narrativa hebraica foi suavemente segmentada para fluidez, sem eliminar a sequência dos acontecimentos. O marcador [a] foi colocado junto a “vestes”, termo ao qual a nota lexical efetivamente se refere.
