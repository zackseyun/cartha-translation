  source_fidelity: 'A tradução preserva adequadamente a sequência narrativa e os sentidos centrais do hebraico: a vinda capacitadora do Espírito de Yahweh, a descida a Ascalom, a morte de trinta homens com o valor partitivo de מֵהֶם (“dentre eles”), a tomada das vestes, a entrega das mudas de roupa, a ira ardente e a subida à casa paterna. “Veio sobre ele com poder” é uma equivalência válida para a expressão idiomática וַתִּצְלַח עָלָיו.'
