base_translation:
  language: en
  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: pt
  text: Depois de alguns dias, ele voltou para tomá-la por esposa. Desviou-se do caminho para ver a carcaça do leão, e eis que havia um enxame de abelhas no corpo do leão, e mel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַחְתָּהּ
  choice: para tomá-la por esposa
  rationale: No contexto narrativo, o infinitivo de לקח com o pronome feminino indica que Sansão voltou para formalizar a união matrimonial; a explicitação idiomática evita que «tomá-la» soe obscuro ou coercitivo em português moderno.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: a carcaça do leão
  rationale: מַפֶּלֶת designa aqui o corpo caído ou morto do animal. «Carcaça» comunica naturalmente o referente neste contexto.
- source_word: עֲדַת דְּבוֹרִים
  choice: um enxame de abelhas
  rationale: Embora עֵדָה costume indicar assembleia ou grupo, aplicado a abelhas corresponde naturalmente a «enxame».
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: no corpo do leão
  rationale: גְּוִיָּה pode significar corpo ou cadáver. «Corpo» preserva a variação lexical do hebraico após «carcaça».
- source_word: וּדְבָשׁ
  choice: e mel
  rationale: Mantém a construção nominal abrupta e coordenada do hebraico, sem acrescentar um verbo inexistente no texto-fonte.
