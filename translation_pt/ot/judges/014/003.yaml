base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: pt
  text: 'Seu pai e sua mãe lhe disseram: “Será que não há mulher entre as filhas de seus irmãos[a], nem entre todo o meu povo, para que você vá tomar esposa dentre os filisteus incircuncisos?” Mas Sansão disse ao pai: “Consiga-a para mim, pois ela é certa aos meus olhos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “filhas de seus irmãos” provavelmente se refere, em sentido amplo, às mulheres do grupo de parentesco ou do povo de Sansão, não apenas às filhas de seus irmãos imediatos.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ela agrada aos meus olhos” ou “ela me parece adequada”. A expressão hebraica pode indicar aprovação pessoal ou atração; o texto principal preserva a formulação que ecoa um tema recorrente em Juízes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: Será que não há
  rationale: Expressa em português corrente a pergunta retórica negativa feita pelos pais, sem enfraquecer sua censura.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: entre as filhas de seus irmãos
  rationale: Preserva a linguagem familiar do hebraico; neste contexto, “irmãos” provavelmente abrange parentes ou membros do mesmo grupo de parentesco.
- source_word: וּבְכָל עַמִּי
  choice: nem entre todo o meu povo
  rationale: Mantém o sufixo hebraico na primeira pessoa do singular, embora em português pudesse ser esperado “nosso povo”.
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: vá tomar esposa
  rationale: Conserva a construção verbal e o sentido matrimonial do hebraico, com formulação compreensível em português.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: dentre os filisteus incircuncisos
  rationale: Preserva tanto a identificação étnica quanto o qualificativo de forte carga pactual e cultural, sem suavizá-lo.
- source_word: אוֹתָהּ קַח לִי
  choice: Tome-a para mim
  rationale: Mantém o imperativo e reflete o papel do pai na obtenção ou no arranjo do casamento.
- source_word: יָשְׁרָה בְעֵינַי
  choice: ela é reta aos meus olhos
  rationale: Preserva a imagem hebraica e sua ressonância com o tema recorrente em Juízes daquilo que é reto aos próprios olhos.
theological_decisions:
- issue: Ressonância narrativa de יָשְׁרָה בְעֵינַי no livro de Juízes
  choice: ela é reta aos meus olhos
  alternative: ela me agrada; ela me parece adequada
  rationale: A expressão pode indicar atração ou aprovação pessoal, mas a redação escolhida conserva a ligação verbal com o tema moral recorrente do livro sem definir de modo indevido qual nuance predomina.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem e o conteúdo da pergunta retórica foram preservados; “incircuncisos” mantém a força cultural do original. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
