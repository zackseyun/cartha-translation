  to: 'Seu pai e sua mãe lhe disseram: “Será que não há mulher entre as filhas de seus irmãos[a], nem entre todo o meu povo, para que você vá tomar esposa dentre os filisteus incircuncisos?” Mas Sansão disse ao pai: “Consiga-a para mim, pois ela é certa aos meus olhos[b].”'
  rationale: A revisão substitui «reta» por «certa» para evitar uma leitura moralizante estranha ao contexto, ao mesmo tempo que conserva «aos meus olhos» e sua ressonância narrativa em Juízes. Também torna o imperativo mais idiomático, sem alterar o sentido de o pai providenciar a mulher para Sansão.
