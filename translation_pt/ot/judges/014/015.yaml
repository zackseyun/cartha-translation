  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יֹּאמְר֤וּ לְ/אֵֽשֶׁת שִׁמְשׁוֹן֙ פַּתִּ֣י אֶת אִישֵׁ֗/ךְ וְ/יַגֶּד לָ֨/נוּ֙ אֶת הַ֣/חִידָ֔ה פֶּן נִשְׂרֹ֥ף אוֹתָ֛/ךְ וְ/אֶת בֵּ֥ית אָבִ֖י/ךְ בָּ/אֵ֑שׁ הַ/לְ/יָרְשֵׁ֕/נוּ קְרָאתֶ֥ם לָ֖/נוּ הֲ/לֹֽא׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: pt
  text: 'No sétimo dia, eles disseram à mulher de Sansão: “Alicie seu marido para que ele nos conte o enigma; senão, queimaremos no fogo você e a casa de seu pai[a]. Foi para tomar o que é nosso[b] que vocês nos convidaram? Não é isso?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode significar “a família de seu pai” ou “os da casa de seu pai”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para nos despojar” ou “para se apoderar do que é nosso”. O verbo hebraico pode indicar tomar posse ou privar alguém de seus bens.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: Alicie
  rationale: O imperativo piel de פתה indica persuasão manipuladora ou sedução. “Alicie” preserva essa nuance coerciva melhor que o neutro “convença”, sem exigir que se especifique o meio empregado.
- source_word: אִישֵׁךְ
  choice: seu marido
  rationale: No contexto matrimonial, אִישׁ designa naturalmente o marido da mulher.
- source_word: וְיַגֶּד לָנוּ
  choice: para que ele nos conte
  rationale: A conjunção com a forma verbal expressa a finalidade do aliciamento; “nos conte” é corrente e adequado para a revelação do enigma.
- source_word: הַחִידָה
  choice: o enigma
  rationale: חִידָה designa uma pergunta ou declaração enigmática. “Enigma” é claro em português e se ajusta ao desafio proposto por Sansão.
- source_word: פֶּן נִשְׂרֹף אוֹתָךְ וְאֶת בֵּית אָבִיךְ בָּאֵשׁ
  choice: senão, queimaremos no fogo você e a casa de seu pai
  rationale: פֶּן introduz a consequência ameaçada, vertida naturalmente por “senão”. A formulação mantém explícitos tanto o ato de queimar quanto o fogo e conserva a amplitude de בֵּית אָבִיךְ.
- source_word: בֵּית אָבִיךְ
  choice: a casa de seu pai
  rationale: “Casa” preserva a ambiguidade hebraica entre a residência e o grupo familiar ou doméstico ligado ao pai.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: Foi para tomar o que é nosso
  rationale: ירשׁ pode indicar tomar posse, despojar ou privar alguém de seus bens. Esta formulação comunica em português corrente a acusação de que o convite visava apoderar-se dos bens deles.
- source_word: קְרָאתֶם לָנוּ
  choice: vocês nos convidaram
  rationale: No contexto da festa, קרא com ל tem o sentido natural de convidar. O plural “vocês” reproduz a mudança do singular dirigido à mulher para o plural, provavelmente abrangendo sua família.
- source_word: הֲלֹא
  choice: Não é isso?
  rationale: הֲלֹא introduz uma pergunta retórica que espera concordância e reforça o tom acusatório.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: Tradução direta e idiomática da expressão temporal.
theological_decisions: []
