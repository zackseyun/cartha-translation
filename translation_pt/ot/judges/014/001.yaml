base_translation:
  language: en
  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: pt
  text: Então Sansão desceu a Timna e, em Timna, viu uma das filhas dos filisteus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: «uma mulher filisteia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva o sentido básico de ירד e a linguagem topográfica da narrativa hebraica, com naturalidade em português.
- source_word: שִׁמְשׁוֹן
  choice: Sansão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: תִּמְנָתָה
  choice: a Timna
  rationale: O he direcional indica movimento em direção ao lugar; em português, a preposição «a» expressa isso de modo conciso e natural.
- source_word: וַיַּרְא
  choice: viu
  rationale: Traduz diretamente o verbo comum ראה sem acrescentar a ideia interpretativa de notar ou escolher.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: Neste ponto da narrativa, ela ainda não é esposa de Sansão; «mulher» mantém o sentido contextual sem antecipar o casamento.
- source_word: בְּתִמְנָתָה
  choice: ali
  rationale: Retoma Timna de modo fluente em português e mantém a indicação locativa do hebraico sem repetição pesada.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: entre as filhas dos filisteus
  rationale: Conserva a expressão familiar e étnica do hebraico, ao mesmo tempo que o uso de «entre» comunica naturalmente a ideia partitiva da preposição מִן.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas bíblicas consolidadas como «Sansão», «Timna» e «filisteus». A estrutura preserva a progressão narrativa e a expressão étnico-familiar do hebraico, enquanto «ali» evita uma repetição pouco natural. O marcador [a] aparece no texto principal.
