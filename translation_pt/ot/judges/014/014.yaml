  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: pt
  text: 'Então ele lhes disse: “Do que come saiu comida, e do forte[a] saiu doçura.” Mas, durante três dias, eles não conseguiram dar a resposta do enigma[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do feroz”. O termo hebraico pode significar “forte”, “poderoso” ou “feroz”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não conseguiram explicar o enigma durante três dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Então ele lhes disse
  rationale: O wayyiqtol faz a narrativa avançar; “então” expressa essa progressão com naturalidade, sem acrescentar uma relação temporal rígida. O pronome preserva a referência contextual do hebraico.
- source_word: מֵהָאֹכֵל
  choice: Do que come
  rationale: O particípio substantivado significa literalmente “o que come” ou “o comedor”. “Do que come” preserva a imagem e evita “comedor”, que no português corrente designa sobretudo um cômodo.
- source_word: יָצָא
  choice: saiu
  rationale: Mantém de modo conciso a ideia de procedência ou emergência indicada pelo verbo יצא e se ajusta ao paralelismo do enigma.
- source_word: מַאֲכָל
  choice: comida
  rationale: É a equivalência direta e comum para alimento ou aquilo que se come, além de conservar o jogo verbal com “come”.
- source_word: וּמֵעַז
  choice: e do forte
  rationale: עַז pode significar “forte”, “poderoso” ou “feroz”. “Do forte” mantém a formulação breve e ambígua do enigma, sem identificar explicitamente o leão.
- source_word: מָתוֹק
  choice: doçura
  rationale: O adjetivo é usado substantivamente. “Doçura” conserva essa substantivação e o equilíbrio poético da frase.
- source_word: לֹא יָכְלוּ לְהַגִּיד הַחִידָה
  choice: não conseguiram dar a resposta do enigma
  rationale: Embora להגיד signifique normalmente “dizer” ou “declarar”, neste contexto a expressão se refere a fornecer a solução do enigma. A formulação é clara em português sem afirmar que eles simplesmente não conseguiam repetir o enunciado.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: durante três dias
  rationale: Expressa naturalmente a duração indicada no hebraico, sem impor um limite temporal mais específico.
