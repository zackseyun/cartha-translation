base_translation:
  language: en
  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: pt
  text: Então o pai dele desceu até a mulher, e Sansão deu ali um banquete[a], pois era isso que os rapazes faziam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma festa” ou “um banquete com bebidas”. O hebraico מִשְׁתֶּה muitas vezes se refere a uma refeição festiva que inclui bebidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva o sentido direcional de ירד, natural na narrativa hebraica.
- source_word: אָבִיהוּ
  choice: seu pai
  rationale: O sufixo pronominal é masculino singular e, no contexto, refere-se ao pai de Sansão.
- source_word: אֶל הָאִשָּׁה
  choice: até a mulher
  rationale: Mantém a designação genérica do hebraico, sem explicitar aqui que ela seria a esposa ou noiva de Sansão.
- source_word: וַיַּעַשׂ שָׁם שִׁמְשׁוֹן מִשְׁתֶּה
  choice: Sansão deu ali uma festa
  rationale: Em português, “dar uma festa” expressa com naturalidade a combinação de עשה com מִשְׁתֶּה, enquanto “ali” preserva שָׁם.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: pois era isso que ... faziam
  rationale: A formulação comunica que se tratava de uma prática costumeira, sem tornar a frase excessivamente explicativa.
- source_word: הַבַּחוּרִים
  choice: os jovens
  rationale: Designa naturalmente homens jovens no contexto, sem restringir o termo a “solteiros”.
