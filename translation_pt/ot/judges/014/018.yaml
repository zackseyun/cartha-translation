base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: pt
  text: 'No sétimo dia, antes do pôr do sol,[a] os homens da cidade lhe disseram: “O que é mais doce do que o mel? E o que é mais forte do que o leão?” Ele lhes respondeu: “Se vocês não tivessem arado com a minha novilha,[b] não teriam descoberto o meu enigma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “antes que o sol entrasse”, expressão que significa antes do pôr do sol.
    reason: lexical_alternative
  - marker: b
    text: Sansão chama sua esposa de “minha novilha” e acusa os homens de terem recorrido a ela para descobrir a resposta do enigma.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Preserva o masculino plural explícito do hebraico e identifica naturalmente os habitantes envolvidos.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: Equivalência temporal direta e natural em português.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: antes do pôr do sol
  rationale: Expressa com clareza o sentido idiomático da formulação hebraica, literalmente ligada à entrada do sol.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: O que é mais doce do que o mel?
  rationale: Entende מִן em sentido comparativo e mantém a forma retórica do enigma.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: E o que é mais forte do que o leão?
  rationale: “Forte” comunica aqui o sentido comparativo mais adequado de עַז, sem excluir suas nuances de poder e ferocidade.
- source_word: לוּלֵא חֲרַשְׁתֶּם
  choice: Se vocês não tivessem arado
  rationale: Reproduz a condição contrafactual e conserva a metáfora agrícola.
- source_word: בְּעֶגְלָתִי
  choice: com a minha novilha
  rationale: Mantém a imagem literal e provocadora usada por Sansão para se referir à esposa; a nota esclarece o referente.
- source_word: לֹא מְצָאתֶם חִידָתִי
  choice: não teriam descoberto o meu enigma
  rationale: “Descoberto” comunica a ideia contextual de chegar à resposta, enquanto “enigma” é uma forma digna e corrente de traduzir חִידָה.
theological_decisions: []
