base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: pt
  text: Então Sansão desceu com seu pai e sua mãe até Timna, e eles chegaram até os vinhedos de Timna. Eis que[a] um leão jovem[b] rugia em direção a ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de repente”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “um leão jovem de leões”, expressão idiomática que significa “um leão jovem”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “rugindo ao encontro dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva o sentido direcional de ירד, apropriado ao deslocamento da região montanhosa para Timna.
- source_word: תִּמְנָתָה
  choice: até Timna
  rationale: O ה direcional indica movimento rumo ao lugar; “até Timna” expressa naturalmente o destino em português.
- source_word: וַיָּבֹאוּ עַד
  choice: quando chegaram aos
  rationale: בוא com עַד indica que alcançaram determinado ponto do percurso. A construção temporal mantém a sequência narrativa de modo natural.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: os vinhedos de Timna
  rationale: Traduz diretamente a expressão construta que designa os vinhedos pertencentes à área de Timna.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a função de chamar vividamente a atenção para um acontecimento inesperado, em registro bíblico digno e ainda compreensível.
- source_word: כְּפִיר אֲרָיוֹת
  choice: um leão jovem
  rationale: כְּפִיר designa um leão jovem, não necessariamente um filhote pequeno; אֲרָיוֹת integra uma expressão hebraica idiomática/intensiva.
- source_word: שֹׁאֵג
  choice: vinha rugindo
  rationale: O particípio apresenta a ação em andamento; a formulação portuguesa comunica vividamente o rugido durante a aproximação.
- source_word: לִקְרָאתוֹ
  choice: em sua direção
  rationale: לקראת pode indicar movimento para encontrar alguém ou simplesmente em sua direção. A tradução preserva a aproximação sem especificar além do contexto.
