base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: pt
  text: 'Sansão lhes disse: “Deixem-me propor um enigma a vocês. Se, dentro dos sete dias do banquete[a], vocês de fato me explicarem o enigma e o decifrarem[b], eu lhes darei trinta vestes de linho[c] e trinta mudas de roupa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “durante os sete dias da festa”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e o encontrarem”; isto é, descobrirem a solução do enigma.
    reason: lexical_alternative
  - marker: c
    text: Não se sabe ao certo que tipo de vestes eram; o hebraico menciona vestes de linho e conjuntos de roupas.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: Deixem-me propor-lhes
  rationale: O coortativo com נָא expressa uma proposta cortês em primeira pessoa; a formulação preserva essa nuance e soa natural ao introduzir um enigma.
- source_word: חִידָה
  choice: um enigma
  rationale: O substantivo designa uma pergunta ou declaração enigmática que precisa ser decifrada; “enigma” é claro e natural neste contexto narrativo.
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: Se ... vocês de fato me explicarem
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “De fato” preserva a ênfase sem reproduzir de maneira artificial a repetição hebraica.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: dentro dos sete dias do banquete
  rationale: מִשְׁתֶּה designa um banquete ou festa, aqui de caráter nupcial; “dentro dos sete dias” comunica o prazo estabelecido pelo desafio.
- source_word: וּמְצָאתֶם
  choice: e o decifrarem
  rationale: O sentido literal é “e o encontrarem”, mas, em relação a um enigma, refere-se a descobrir a solução. “Decifrar” comunica esse sentido contextual.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: trinta peças de linho
  rationale: סְדִינִים refere-se a peças de tecido ou vestes de linho, mas o formato exato é incerto. “Peças de linho” evita precisão indevida.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: trinta mudas de roupa
  rationale: A expressão indica conjuntos ou trocas completas de vestuário; “mudas de roupa” é uma equivalência portuguesa corrente e concisa.
- source_word: וְנָתַתִּי לָכֶם
  choice: eu lhes darei
  rationale: No contexto, a conjunção introduz a consequência da condição. A estrutura portuguesa com “se” torna essa relação suficientemente clara.
