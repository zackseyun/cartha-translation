  to: 'Sansão lhes disse: “Deixem-me propor um enigma a vocês. Se, dentro dos sete dias do banquete[a], vocês de fato me explicarem o enigma e o decifrarem[b], eu lhes darei trinta vestes de linho[c] e trinta mudas de roupa.”'
