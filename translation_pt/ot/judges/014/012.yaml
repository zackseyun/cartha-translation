  naturalness: O texto é claro e de registro apropriado. «Deixem-me propor-lhes» é correto, mas «Deixem-me propor um enigma a vocês» é mais fluente para a leitura brasileira e internacional. A coordenação «me explicarem o enigma e o decifrarem» é compreensível e mantém as duas ações presentes no hebraico.
  terminology: «Enigma», «banquete», «mudas de roupa» e «vestes de linho» são escolhas naturais e adequadas. «Vestes de linho» preserva melhor o caráter de roupa de סְדִינִים sem determinar indevidamente a peça exata.
