base_translation:
  language: en
  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: pt
  text: Ao vê-lo, escolheram trinta companheiros[a], e eles estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amigos”; possivelmente acompanhantes do noivo em seu casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם אֹתוֹ
  choice: Ao vê-lo
  rationale: A construção com וַיְהִי introduz a sequência narrativa, e כְּ com o infinitivo construto de ראה expressa circunstância temporal. “Ao vê-lo” reproduz isso de modo conciso e natural em português.
- source_word: וַיִּקְחוּ
  choice: escolheram
  rationale: לקח significa literalmente “tomar”, mas, neste contexto, refere-se à designação ou seleção dos homens que ficariam com Sansão. “Escolheram” comunica esse sentido naturalmente, sem sugerir que os agarraram fisicamente.
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: trinta companheiros
  rationale: מֵרֵעִים designa associados ou companheiros. “Companheiros” preserva a amplitude do termo e evita especificar como certo um papel cerimonial de casamento.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: que ficaram com ele
  rationale: A expressão significa literalmente “e estavam com ele”. No fluxo narrativo, “que ficaram com ele” é português natural e mantém a ideia de presença junto a Sansão sem definir mais precisamente a função deles.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. A tradução conserva a indefinição do papel dos trinta homens e evita o termo mais específico “padrinhos”, que poderia impor uma categoria matrimonial moderna.
