  text: וַ/יִּתְּנוּ ל/וֹ֙ שִׁבְעִ֣ים כֶּ֔סֶף מִ/בֵּ֖יתּ בַ֣עַל בְּרִ֑ית וַ/יִּשְׂכֹּ֨ר בָּ/הֶ֜ם אֲבִימֶ֗לֶךְ אֲנָשִׁ֤ים רֵיקִים֙ וּ/פֹ֣חֲזִ֔ים וַ/יֵּלְכ֖וּ אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: pt
  text: E deram-lhe setenta peças de prata[a] da casa de Baal-Berite[b]. Com essa prata, Abimeleque contratou homens sem valor e imprudentes[c], que o seguiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “setenta siclos de prata”. O hebraico diz literalmente “setenta prata”, uma quantia monetária expressa por peso.
    reason: lexical_alternative
  - marker: b
    text: Ou “do templo de Baal-Berite”. Em contexto religioso, a palavra hebraica para “casa” pode se referir a um santuário ou templo.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “homens vazios e imprudentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: setenta peças de prata
  rationale: O hebraico diz literalmente “setenta prata”, indicando uma quantia monetária por peso. “Peças de prata” é natural em português e evita explicitar “siclos”, unidade não mencionada no texto.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: da casa de Baal-Berite
  rationale: בַּיִת significa “casa” e, em contexto religioso, pode designar um templo ou santuário. A tradução mantém a imagem hebraica e translitera o nome divino.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: Com essa prata, Abimeleque contratou
  rationale: A preposição com o pronome retoma a prata como o meio de pagamento. A formulação em português esclarece naturalmente o referente sem mudar o sentido.
- source_word: אֲנָשִׁים רֵיקִים
  choice: homens sem valor
  rationale: רֵיקִים significa literalmente “vazios”, mas aqui caracteriza homens sem valor ou substância moral e social. “Sem valor” conserva essa força de modo idiomático.
- source_word: וּפֹחֲזִים
  choice: imprudentes
  rationale: O termo descreve pessoas indisciplinadas, precipitadas e pouco confiáveis. “Imprudentes” comunica esse caráter sem impor a ideia mais específica de ilegalidade.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: que o seguiram
  rationale: A expressão hebraica, literalmente “foram atrás dele”, indica que os homens se vincularam a Abimeleque como seus seguidores.
theological_decisions: []
