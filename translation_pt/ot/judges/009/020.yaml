  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: pt
  text: Mas, se não, que saia fogo de Abimeleque e consuma os líderes de Siquém[a] e Bete-Milo[b]; e que saia fogo dos líderes de Siquém e de Bete-Milo e consuma Abimeleque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os senhores de Siquém». A expressão hebraica se refere aos homens de destaque ou às autoridades que governavam a cidade.
    reason: lexical_alternative
  - marker: b
    text: Bete-Milo também pode ser traduzido como «casa de Milo»; provavelmente era um lugar ou um grupo dirigente ligado a Siquém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: Mas, se não
  rationale: Mantém a transição adversativa e a condição negativa elíptica do hebraico, cuja referência se encontra no versículo anterior, sem acrescentar uma explicação ao texto.
- source_word: תֵּצֵא אֵשׁ
  choice: que saia fogo
  rationale: O yiqtol tem força volitiva ou imprecatória neste contexto. A construção com «que» expressa naturalmente a maldição em português, sem reduzi-la a uma simples previsão.
- source_word: מֵאֲבִימֶלֶךְ
  choice: de Abimeleque
  rationale: Preserva a origem do fogo indicada pela preposição hebraica e mantém a imagem de uma força destrutiva procedente de Abimeleque.
- source_word: וְתֹאכַל
  choice: e consuma
  rationale: Com «fogo» como sujeito, o verbo אכל descreve o ato de consumir ou devorar. «Consuma» é natural e conserva a intensidade da imagem.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: os líderes de Siquém
  rationale: Neste contexto, o plural de בעל designa os homens de posição e autoridade na cidade. «Líderes» comunica essa função sociopolítica em linguagem atual, enquanto a alternativa mais formal é registrada em nota.
- source_word: בֵּית מִלּוֹא
  choice: Bete-Milo
  rationale: O sintagma parece funcionar como nome de lugar ou designação estabelecida de um grupo ligado a Siquém; por isso, é transliterado segundo uma forma natural em português.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: e que saia fogo dos líderes de Siquém e de Bete-Milo
  rationale: A repetição simétrica da primeira imprecação preserva a estrutura de destruição recíproca do hebraico.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: É o objeto direto da última ocorrência de «consuma»; a formulação direta conserva o fecho enfático da maldição.
theological_decisions:
- issue: Natureza da imagem do fogo
  choice: Manter «fogo» como imagem concreta dentro de uma maldição imprecatória, sem explicar no texto principal se é literal ou figurado.
  alternative: Interpretar explicitamente o fogo como conflito violento ou como fogo enviado diretamente por Deus.
  rationale: O hebraico conserva a imagem concreta e, no contexto, ela antecipa a destruição mútua. A tradução não deve decidir se a imagem é metafórica, literal ou ambas.
- issue: Força modal dos verbos
  choice: 'Traduzir os verbos com valor imprecatório: «que saia» e «consuma».'
  alternative: 'Empregar o futuro indicativo: «sairá» e «consumirá».'
  rationale: A forma verbal no contexto expressa uma maldição ou desejo solene, embora possa também carregar uma dimensão profética. A construção escolhida preserva primariamente a força volitiva sem apagar a tensão contextual.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição foi mantida para conservar o paralelismo e a reciprocidade da maldição. Os marcadores de nota foram colocados junto aos termos a que efetivamente se referem.
