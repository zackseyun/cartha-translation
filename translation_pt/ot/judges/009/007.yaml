base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: pt
  text: 'Contaram a Jotão, e ele foi e se pôs no alto do monte Gerizim. Levantou a voz, clamou e lhes disse: “Escutem-me, senhores de Siquém[a], para que Deus escute vocês.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líderes de Siquém”. O hebraico diz literalmente “senhores” ou “donos de Siquém” e se refere aos detentores de poder na cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “e que Deus escute vocês”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: Quando contaram isso a Jotão
  rationale: O hifil de נגד significa contar ou informar. O pronome “isso” explicita em português o objeto subentendido pelo contexto, sem acrescentar conteúdo novo.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: ele foi e ficou de pé
  rationale: Mantém a sequência narrativa simples e expressa עמד como a tomada de posição de Jotão.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: no topo do monte Gerizim
  rationale: ראש, em uso topográfico, indica o topo ou cume; “no topo” é claro e natural em português.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא
  choice: levantou a voz e clamou-lhes
  rationale: A expressão indica que Jotão falou em voz alta para ser ouvido. “Clamou-lhes” preserva a chamada pública sem sugerir uma proclamação institucional.
- source_word: שִׁמְעוּ אֵלַי
  choice: Escutem-me
  rationale: O imperativo de שמע com אֶל pede atenção ao que será dito; “Escutem-me” é corrente e mantém a ligação verbal com a oração seguinte.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: senhores de Siquém
  rationale: בעל significa literalmente senhor, dono ou detentor de autoridade. No contexto, a expressão designa os homens com poder em Siquém; a tradução principal conserva a força lexical, e a nota oferece a formulação funcional mais natural.
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: para que Deus escute vocês
  rationale: A conjunção com o imperfeito pode apresentar propósito ou resultado após o imperativo. A repetição de “escutar” reproduz o vínculo retórico do hebraico.
theological_decisions:
- issue: Valor da oração final de Jotão
  choice: para que Deus escute vocês
  alternative: e que Deus escute vocês
  rationale: O hebraico permite entender a oração como propósito ou resultado ligado ao imperativo, ou como um desejo coordenado. A tradução principal conserva a reciprocidade retórica sem transformar a frase em afirmação doutrinária; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação hebraica foi levemente organizada em duas frases para evitar uma sequência pesada de verbos sem perder a progressão narrativa. “Senhores de Siquém” preserva a expressão sociopolítica do original, enquanto a nota esclarece seu sentido contextual.
