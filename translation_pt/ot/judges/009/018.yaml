  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: pt
  text: Mas hoje vocês se levantaram contra a casa de meu pai, mataram os filhos dele — setenta homens — sobre uma só pedra e fizeram Abimeleque, filho da serva de meu pai[a], rei sobre os líderes de Siquém, porque ele é irmão de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filho da escrava de meu pai”; de modo mais interpretativo, “filho da concubina de meu pai”. O hebraico diz literalmente “filho da serva dele”.
    reason: alternativa lexical e nuance de condição social
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: se levantaram contra
  rationale: Preserva a metáfora hebraica e a força acusatória do idioma, que neste contexto expressa oposição hostil.
- source_word: בֵּית אָבִי
  choice: a casa de meu pai
  rationale: Mantém a expressão familiar e dinástica do hebraico; aqui, “casa” designa a família ou linhagem, não apenas uma construção.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Reproduz de modo natural a ênfase temporal da acusação de Jotão.
- source_word: וַתַּהַרְגוּ
  choice: mataram
  rationale: Traduz o verbo sem acrescentar a qualificação jurídica mais interpretativa de “assassinaram”.
- source_word: בָּנָיו שִׁבְעִים אִישׁ
  choice: os filhos dele — setenta homens
  rationale: Conserva tanto a referência aos filhos do pai de Jotão quanto a contagem explícita de setenta homens.
- source_word: עַל אֶבֶן אֶחָת
  choice: sobre uma só pedra
  rationale: Mantém a concretude sombria da expressão e sua possível referência ao local ou meio da execução coletiva.
- source_word: וַתַּמְלִיכוּ
  choice: fizeram ... rei
  rationale: 'Expressa diretamente o sentido causativo da forma hebraica: constituir alguém como rei.'
- source_word: בֶּן אֲמָתוֹ
  choice: filho da serva de meu pai
  rationale: אָמָה designa uma serva ou mulher escravizada. A explicitação “de meu pai” torna claro em português o referente do sufixo hebraico sem alterar seu sentido.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: os líderes de Siquém
  rationale: Neste contexto político, a expressão aponta para os homens de posição e autoridade cívica da cidade; “líderes” comunica esse sentido em português atual.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: porque ele é irmão de vocês
  rationale: 'Preserva o valor causal de כִּי e a ironia da acusação: o parentesco de Abimeleque com os siquemitas motivou sua escolha.'
theological_decisions:
- issue: Condição social da mãe de Abimeleque em אֲמָתוֹ
  choice: serva de meu pai
  alternative: escrava de meu pai; concubina de meu pai
  rationale: O substantivo hebraico indica diretamente uma serva ou mulher escravizada e é usado aqui de modo socialmente depreciativo. “Concubina” pode ser sugerido pelo contexto narrativo, mas é uma identificação mais específica do que o termo deste versículo afirma; por isso, fica na nota como possibilidade interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “vocês” comunica com naturalidade o plural da acusação. Os travessões preservam a aposição hebraica “setenta homens”, e o marcador [a] foi colocado junto à expressão que a nota explica.
