base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: pt
  text: 'Os irmãos de sua mãe falaram a todos os líderes de Siquém[a] todas essas palavras a respeito dele. Então o coração deles se inclinou a seguir Abimeleque, pois disseram: “Ele é nosso irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os senhores de Siquém” ou “todos os homens influentes de Siquém”. A expressão hebraica se refere aos homens de destaque da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: falaram
  rationale: Reproduz o uso narrativo comum de דבר no piel e se encaixa naturalmente com o objeto “todas essas palavras”.
- source_word: אֲחֵי אִמּוֹ
  choice: os irmãos da mãe dele
  rationale: Indica especificamente os irmãos homens da mãe de Abimeleque; a formulação é clara e natural em português.
- source_word: עָלָיו
  choice: a respeito dele
  rationale: Preserva o sentido de falar acerca de Abimeleque sem explicitar demais que agiam em favor dele, embora o contexto implique persuasão.
- source_word: בְּאָזְנֵי
  choice: aos ouvidos de
  rationale: Mantém a imagem do idioma hebraico e comunica que as palavras foram ditas para que a audiência as ouvisse.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: todos os líderes de Siquém
  rationale: Neste contexto político, בעלי designa os homens influentes ou dirigentes da cidade, não necessariamente todos os habitantes.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas essas palavras
  rationale: דברים pode significar palavras, coisas ou assuntos; aqui remete à proposta verbal relatada no versículo anterior.
- source_word: וַיֵּט לִבָּם
  choice: o coração deles se inclinou
  rationale: Preserva o singular coletivo “coração” do hebraico e expressa uma mudança de disposição sem introduzir um agente causador não declarado.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: a seguir Abimeleque
  rationale: Comunica em português atual a metáfora hebraica de voltar-se após alguém, isto é, aderir à sua liderança.
- source_word: כִּי אָמְרוּ
  choice: pois disseram
  rationale: Introduz de modo conciso a razão pela qual decidiram apoiar Abimeleque.
- source_word: אָחִינוּ הוּא
  choice: Ele é nosso irmão
  rationale: Preserva o apelo retórico direto à solidariedade de parentesco, sem ampliar “irmão” para o mais genérico “parente”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi mantida próxima ao hebraico sem sacrificar a clareza. “Aos ouvidos de” conserva a imagem original, e “a seguir Abimeleque” torna natural a expressão de lealdade política.
