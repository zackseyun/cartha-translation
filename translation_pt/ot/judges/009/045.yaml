base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: pt
  text: Abimeleque lutou contra a cidade durante todo aquele dia[a]. Ele tomou a cidade, matou o povo que nela estava, derrubou a cidade e semeou-a com sal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atacou a cidade”. O verbo hebraico significa literalmente “lutou” e, com a preposição empregada aqui, provavelmente indica uma ação militar contra a cidade.
    reason: lexical_alternative
  - marker: b
    text: Semear a cidade com sal era um ato simbólico de devastação e maldição, que assinalava sua ruína.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: lutou contra a cidade
  rationale: O verbo לחם com a preposição ב pode indicar combate contra um alvo. O contexto de tomada e destruição da cidade favorece essa leitura, sem substituir o verbo mais literal “lutar” pelo mais interpretativo “atacar”.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: durante todo aquele dia
  rationale: Expressa naturalmente em português a duração da ação ao longo daquele dia específico.
- source_word: וַיִּלְכֹּד
  choice: tomou
  rationale: Em contexto militar, לכד significa tomar ou capturar uma cidade. “Tomou a cidade” é idiomático e claro em português.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: o povo que nela estava
  rationale: Preserva a construção relativa hebraica e indica a população presente na cidade sem especificar além do texto.
- source_word: הָרָג
  choice: matou
  rationale: Equivalente direto, claro e atual do verbo hebraico que denota matar.
- source_word: וַיִּתֹּץ
  choice: derrubou
  rationale: נתץ descreve derrubar ou demolir estruturas; “derrubou a cidade” mantém a concisão e a força da ação.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: semeou-a com sal
  rationale: Conserva a imagem verbal deliberada do hebraico, literalmente “semeou-a [com] sal”, em vez de reduzi-la a “salgou-a”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a sequência narrativa concisa do hebraico e a imagem concreta de semear com sal.
