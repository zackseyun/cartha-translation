  text: וַ/יֵּ֥שֶׁב אֲבִימֶ֖לֶךְ בָּ/ארוּמָ֑ה וַ/יְגָ֧רֶשׁ זְבֻ֛ל אֶת גַּ֥עַל וְ/אֶת אֶחָ֖י/ו מִ/שֶּׁ֥בֶת בִּ/שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: pt
  text: Abimeleque ficou em Arumá, e Zebul expulsou Gaal e seus irmãos, impedindo-os de morar em Siquém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “expulsou Gaal e seus irmãos para que não morassem em Siquém”. A construção hebraica com o infinitivo expressa a exclusão deles da residência ali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer. Neste contexto narrativo, “ficou” comunica naturalmente que Abimeleque permaneceu em Arumá, sem sugerir necessariamente residência prolongada.
- source_word: בָּארוּמָה
  choice: em Arumá
  rationale: Nome de lugar transliterado segundo a forma corrente em português; a preposição בְּ é expressa naturalmente por “em”.
- source_word: וַיְגָרֶשׁ
  choice: expulsou
  rationale: גרשׁ indica fazer sair ou remover à força. “Expulsou” preserva essa força e é idiomático em português, sem acrescentar a ideia de uma sentença jurídica formal.
- source_word: זְבֻל
  choice: Zebul
  rationale: Nome pessoal transliterado em forma adequada ao português.
- source_word: גַּעַל
  choice: Gaal
  rationale: Nome pessoal transliterado sem apóstrofo, em conformidade com o uso bíblico corrente em português.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: אח é o termo comum para “irmão”. Embora possa ter sentido ampliado em certos contextos, não há aqui razão suficiente para substituí-lo por “parentes” ou “companheiros”.
- source_word: מִשֶּׁבֶת
  choice: impedindo-os de morar
  rationale: A preposição מִן com o infinitivo construto de ישׁב expressa afastamento ou exclusão da permanência no lugar. Esta formulação comunica em português corrente que a expulsão impediu a residência em Siquém.
- source_word: בִּשְׁכֶם
  choice: em Siquém
  rationale: Nome de lugar vertido pela forma tradicional em português, com a preposição locativa “em”.
