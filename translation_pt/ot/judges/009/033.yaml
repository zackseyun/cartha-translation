base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: pt
  text: 'Então, pela manhã, ao nascer do sol, levante-se cedo e avance contra a cidade. E veja: quando ele e o povo que está com ele saírem ao seu encontro, faça com ele o que estiver ao seu alcance.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “conforme a sua mão encontrar”; isto é, conforme estiver ao seu alcance ou conforme surgir a oportunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: Então, pela manhã
  rationale: A construção introduz a etapa seguinte das instruções. “Então” expressa a sequência com naturalidade, e “pela manhã” traduz a expressão temporal.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: ao nascer do sol
  rationale: A construção com infinitivo marca o momento da ação; a formulação é natural e mantém a estreita ligação temporal com o nascer do sol.
- source_word: תַּשְׁכִּים
  choice: levante-se cedo
  rationale: O hifil de שׁכם indica levantar-se ou começar cedo. O imperativo português corresponde à força diretiva do plano militar.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: e avance contra a cidade
  rationale: Em contexto militar, פשׁט pode indicar lançar-se, avançar ou fazer uma incursão. “Avance contra” conserva o movimento hostil sem especificar excessivamente a forma do ataque.
- source_word: וְהִנֵּה
  choice: E, quando
  rationale: הִנֵּה chama a atenção para o desenvolvimento previsto. Em português, a construção introduzida por “E, quando” transmite com naturalidade essa transição, embora sem reproduzir um “eis” mais marcado e arcaizante.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: ele e o povo que está com ele
  rationale: Mantém o substantivo amplo עָם e evita restringir interpretativamente o grupo a soldados ou tropas.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: saírem ao seu encontro
  rationale: אֶל indica movimento em direção ao destinatário. “Ao seu encontro” preserva essa direção e permite que o contexto militar comunique a hostilidade, sem inseri-la diretamente na preposição.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: faça com ele
  rationale: Conserva o pronome singular do hebraico, cujo referente imediato é o líder, ainda que ele possa representar o grupo que o acompanha.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: o que estiver ao seu alcance
  rationale: O idioma hebraico, literalmente relacionado ao que a mão encontra, refere-se ao que o destinatário tiver poder ou oportunidade de fazer. A tradução comunica o sentido em português natural, com a imagem literal registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas imperativas naturais. Evitou-se “eis que” por soar mais solene e marcado do que o restante da instrução, e manteve-se o singular “ele” para refletir o texto hebraico.
