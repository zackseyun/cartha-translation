  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: pt
  text: 'Mas a videira lhes respondeu: “Deveria eu deixar de produzir meu vinho novo, que alegra deuses e seres humanos,[a] para ir balançar sobre as árvores?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que alegra Deus e os seres humanos”.'
    reason: Leitura alternativa de אֱלֹהִים, que pode funcionar como plural (“deuses”) ou como designação singular do Deus de Israel.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: a videira
  rationale: Designa a planta que fala na fábula de Jotão; “videira” é a forma natural e literariamente adequada em português.
- source_word: הֶחֳדַלְתִּי
  choice: Deveria eu deixar de produzir
  rationale: O perfeito na primeira pessoa funciona aqui como pergunta deliberativa. “Produzir” explicita de modo natural em português a relação verbal com “meu vinho novo”, sem alterar o sentido contextual.
- source_word: תִּירוֹשִׁי
  choice: meu vinho novo
  rationale: תִּירוֹשׁ costuma indicar vinho novo ou fresco; a tradução mantém essa distinção agrícola e lexical sem recorrer ao anacrônico “suco de uva”.
- source_word: הַמְשַׂמֵּחַ
  choice: que alegra
  rationale: Preserva de forma concisa e corrente o valor causativo do particípio hebraico.
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: deuses e seres humanos
  rationale: אֱלֹהִים tem forma plural e, no contexto poético da fábula, pode referir-se a deuses ou seres divinos. “Seres humanos” comunica אֲנָשִׁים de maneira abrangente e natural no português atual.
- source_word: וְהָלַכְתִּי לָנוּעַ
  choice: para ir balançar
  rationale: Mantém tanto o movimento físico da planta como a ironia contextual de ocupar uma posição sobre as demais árvores.
- source_word: עַל הָעֵצִים
  choice: sobre as árvores
  rationale: Conserva a imagem espacial e a conotação contextual de autoridade sem substituir a metáfora por “governar”.
theological_decisions:
- issue: Sentido de אֱלֹהִים na expressão “que alegra אֱלֹהִים e seres humanos”
  choice: 'plural: “deuses”'
  alternative: 'singular: “Deus”'
  rationale: A forma hebraica é morfologicamente plural e o contexto de fábula permite a referência plural. Como o singular “Deus” também é uma leitura tradicional e gramaticalmente possível para אֱלֹהִים, ele é preservado em nota, sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem interrogativa “Deveria eu” mantém o tom retórico sem soar arcaica demais; “balançar sobre” conserva o jogo imagético entre movimento e domínio.
