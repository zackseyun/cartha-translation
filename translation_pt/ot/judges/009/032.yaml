  text: וְ/עַתָּה֙ ק֣וּם לַ֔יְלָה אַתָּ֖ה וְ/הָ/עָ֣ם אֲשֶׁר אִתָּ֑/ךְ וֶ/אֱרֹ֖ב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: pt
  text: Agora, pois, levante-se durante a noite[a], você e o povo que está com você, e fique de emboscada[b] no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à noite”. A expressão hebraica indica uma ação noturna, sem necessariamente especificar “esta noite”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “arme uma emboscada” ou “fique à espreita”. O verbo hebraico descreve o ato de esperar ocultamente, em geral com a intenção de atacar de surpresa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Mantém a função de transição e a urgência do marcador discursivo hebraico em português natural.
- source_word: קוּם
  choice: levante-se
  rationale: Traduz diretamente o imperativo de קום, preservando o tom firme da instrução.
- source_word: לַיְלָה
  choice: durante a noite
  rationale: Expressa o uso adverbial temporal sem restringi-lo indevidamente a 'esta noite'.
- source_word: אַתָּה
  choice: você
  rationale: Conserva o pronome explícito e enfático do hebraico, com ampla inteligibilidade no português moderno.
- source_word: וְהָעָם אֲשֶׁר אִתָּךְ
  choice: e o povo que está com você
  rationale: Mantém o sentido amplo de עָם sem interpretar o grupo especificamente como tropas ou homens.
- source_word: וֶאֱרֹב
  choice: e fique de emboscada
  rationale: Comunica a ideia de tomar posição e permanecer à espera para atacar, em vez de sugerir que o ataque já começou.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: É o equivalente mais direto de שָׂדֶה e se ajusta ao cenário tático imediato.
