  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: pt
  text: pois meu pai lutou por vocês, arriscou a própria vida[a] e livrou vocês da mão de Midiã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “lançou a sua vida diante de si”, expressão que significa que ele se expôs a perigo mortal.
    reason: lexical_alternative
  - marker: b
    text: Ou “do poder de Midiã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: pois
  rationale: No contexto, a partícula introduz a razão que sustenta a acusação de Jotão; “pois” expressa naturalmente essa relação causal.
- source_word: נִלְחַם ... עֲלֵיכֶם
  choice: lutou por vocês
  rationale: 'O verbo significa lutar ou combater, e aqui a preposição indica benefício: Gideão lutou em favor do povo, como confirma o livramento mencionado a seguir.'
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: arriscou a própria vida
  rationale: A expressão hebraica, literalmente relacionada a lançar ou expor a vida diante de si, é idiomática e comunica exposição voluntária a perigo mortal. A formulação portuguesa transmite esse sentido sem sugerir que ele desejava perder a vida.
- source_word: וַיַּצֵּל
  choice: livrou
  rationale: O hifil de נצל significa retirar do perigo, resgatar ou livrar. “Livrou” combina com o contexto militar e mantém o vocabulário bíblico em linguagem corrente.
- source_word: מִיַּד מִדְיָן
  choice: da mão de Midiã
  rationale: A expressão hebraica usa “mão” como imagem de poder ou domínio. A tradução conserva essa imagem, ainda inteligível em português, e a nota esclarece o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com “vocês” para ampla inteligibilidade e boa legibilidade brasileira. Conserva-se a imagem hebraica “da mão de Midiã”, enquanto o difícil idioma da cláusula central é traduzido pelo seu sentido e documentado em nota.
