base_translation:
  language: en
  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: pt
  text: 'Certa vez, as árvores foram ungir um rei para reinar sobre elas[a] e disseram à oliveira: “Reine sobre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega uma construção intensiva, literalmente “indo, foram”, que dá ênfase à ação. Também se pode traduzir: “As árvores realmente foram” ou “As árvores partiram para ungir um rei para reinar sobre elas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: Certa vez, ... foram
  rationale: A construção com infinitivo absoluto e verbo finito dá destaque à ação. Em português narrativo, “Certa vez” introduz naturalmente a fábula; a nota preserva a força incomum da forma hebraica.
- source_word: הָעֵצִים
  choice: as árvores
  rationale: O plural refere-se claramente às árvores personificadas na fábula de Jotão.
- source_word: לִמְשֹׁחַ
  choice: ungir
  rationale: Preserva a imagem concreta da unção como ato de instalação no ofício real, sem reduzi-la simplesmente a “escolher” ou “nomear”.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: um rei sobre si mesmas
  rationale: מֶלֶךְ é indefinido neste contexto, e עַל indica domínio; a forma reflexiva deixa claro que o rei governaria as próprias árvores.
- source_word: וַיֹּאמְרוּ לַזַּיִת
  choice: e disseram à oliveira
  rationale: Tradução direta e natural da sequência narrativa; זַיִת designa aqui a oliveira personificada.
- source_word: מלוכה עָלֵינוּ
  choice: Reine sobre nós
  rationale: O imperativo de מלך pede que a oliveira exerça a realeza, enquanto עַל expressa domínio sobre os súditos.
theological_decisions: []
