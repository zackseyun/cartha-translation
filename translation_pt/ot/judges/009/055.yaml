  text: וַ/יִּרְא֥וּ אִֽישׁ יִשְׂרָאֵ֖ל כִּ֣י מֵ֣ת אֲבִימֶ֑לֶךְ וַ/יֵּלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: pt
  text: Quando os homens de Israel viram que Abimeleque estava morto, cada um foi para o seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: viram
  rationale: Preserva o sentido básico de percepção visual que leva ao reconhecimento e mantém a fluidez narrativa.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: O singular coletivo é esclarecido pelos verbos no plural; a formulação conserva a referência masculina do hebraico sem perder naturalidade em português.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo percebido: eles viram que Abimeleque estava morto.'
- source_word: מֵת
  choice: estava morto
  rationale: Expressa o estado de Abimeleque no momento em que foi percebido, em vez de destacar o evento de sua morte.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֵּלְכוּ
  choice: foi
  rationale: 'O verbo hebraico está no plural, mas a construção distributiva seguinte é vertida naturalmente em português com o singular: “cada um foi”. Evita acrescentar a ideia não explícita de retorno.'
- source_word: אִישׁ לִמְקֹמוֹ
  choice: cada um foi para o seu lugar
  rationale: Representa o singular distributivo אִישׁ e mantém מָקוֹם como “lugar”, sem especificá-lo indevidamente como casa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada de modo natural para integrar a expressão distributiva “cada um” ao verbo no singular. Não se julgou necessária uma nota, pois essa construção comunica diretamente em português a distribuição expressa pelo hebraico.
