  text: וַ/יֵּ֥לֶךְ אֲבִימֶ֖לֶךְ אֶל תֵּבֵ֑ץ וַ/יִּ֥חַן בְּ/תֵבֵ֖ץ וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: pt
  text: Então Abimeleque foi a Tebes, acampou junto a Tebes e a tomou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Na sequência narrativa, הלך indica simplesmente deslocamento; “foi” preserva o sentido sem acrescentar a ideia explícita de marcha militar.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: אֶל תֵּבֵץ
  choice: a Tebes
  rationale: אֶל marca aqui movimento em direção ao lugar; a preposição portuguesa “a” expressa esse destino de modo conciso.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: acampou contra Tebes
  rationale: חנה significa acampar. Embora בְּ possa significar “em” ou “junto a”, o contexto militar e a tomada subsequente da cidade favorecem “contra”, indicando posição de cerco.
- source_word: וַיִּלְכְּדָהּ
  choice: e a tomou
  rationale: לכד é usado para tomar ou capturar cidades. O pronome feminino “a” retoma naturalmente a cidade de Tebes em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa direta. “Tomou” é idiomático para a conquista militar de uma cidade; “acampou contra” mantém explícita a postura hostil sugerida pelo contexto.
