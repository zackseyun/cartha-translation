  text: וַ/יֵּ֣צֵא גַ֔עַל לִ/פְנֵ֖י בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּלָּ֖חֶם בַּ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: pt
  text: Então Gaal saiu à frente dos líderes de Siquém[a] e lutou contra Abimeleque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante dos líderes de Siquém”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O qal wayyiqtol de יצא é o verbo narrativo comum para sair; “saiu” é natural e direto em português.
- source_word: גַעַל
  choice: Gaal
  rationale: Nome pessoal transliterado de forma reconhecível e corrente em português.
- source_word: לִפְנֵי
  choice: à frente de
  rationale: Embora literalmente possa significar “diante de”, no contexto militar a expressão indica que Gaal saiu na dianteira, possivelmente em posição de comando. “À frente de” comunica naturalmente essa força contextual.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: os líderes de Siquém
  rationale: Aqui בעלים designa os homens de posição e autoridade na cidade, não simplesmente todos os habitantes. “Líderes” evita tanto o tom feudal de “senhores” quanto a generalidade de “homens” ou “cidadãos”.
- source_word: וַיִּלָּחֶם
  choice: lutou
  rationale: O nifal de לחם significa combater ou travar batalha; “lutou” é conciso e idiomático.
- source_word: בַּאֲבִימֶלֶךְ
  choice: contra Abimeleque
  rationale: Com לחם, a preposição ב marca o oponente; “contra” elimina a possível ambiguidade de “com” em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com narrativa fluente. A opção “à frente dos líderes” expressa a provável força militar de לִפְנֵי, enquanto a nota preserva a formulação mais literal e sua ambiguidade.
