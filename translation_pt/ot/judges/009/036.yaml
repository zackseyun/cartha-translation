base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: pt
  text: 'Quando Gaal viu o povo, disse a Zebul: “Veja! Há gente descendo do alto dos montes.” Zebul, porém, lhe disse: “Você está vendo a sombra dos montes, tomando-a por homens.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: O qal narrativo de ראה indica percepção visual direta; “viu” é a forma natural em português.
- source_word: הָעָם / עָם
  choice: o povo / gente
  rationale: עָם é coletivo e não especifica formalmente um exército. “Povo” na primeira ocorrência mantém a correspondência lexical, enquanto “gente” no discurso soa mais natural para um grupo avistado à distância.
- source_word: הִנֵּה
  choice: Olhe!
  rationale: Funciona como partícula de chamada de atenção no discurso direto, em linguagem moderna e digna.
- source_word: יוֹרֵד
  choice: está descendo
  rationale: O particípio singular concorda com o substantivo coletivo עָם. Em português, com “gente”, a concordância singular é natural e preserva a forma hebraica.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: do alto dos montes
  rationale: רֹאשׁ designa o topo ou cume. “Do alto dos montes” é claro e idiomático, sem perder a imagem geográfica.
- source_word: צֵל הֶהָרִים
  choice: a sombra dos montes
  rationale: צֵל significa sombra ou área sombreada; “sombra” corresponde à alegada confusão visual.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: Você está vendo ... como se fossem homens
  rationale: A formulação expressa percepção equivocada e torna clara em português a comparação introduzida por כ, sem explicar além do texto.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O masculino plural se refere, neste contexto de confronto, a figuras humanas masculinas avistadas à distância.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O diálogo é direto e natural; “montes” mantém um tom bíblico digno sem ser arcaico. A ambiguidade coletiva de עָם foi preservada sem explicitar “tropas” ou “exército”.
