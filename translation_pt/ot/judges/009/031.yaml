base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: pt
  text: 'Então ele enviou mensageiros a Abimeleque em segredo[a], dizendo: “Veja! Gaal, filho de Ebede, e os irmãos dele vieram a Siquém e, veja, eles estão incitando a cidade contra você[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com astúcia” ou “enganosamente”. O termo hebraico é incomum e pode destacar tanto o caráter secreto quanto o caráter enganoso da ação.
    reason: lexical_alternative
  - marker: b
    text: O hebraico é difícil. Outra tradução possível é “estão sitiando a cidade contra você” ou, mais literalmente, “estão pressionando a cidade contra você”. No contexto, parece indicar que Gaal e seu grupo estavam levando Siquém a se voltar contra Abimeleque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ele enviou
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto político e militar, a palavra designa agentes humanos encarregados de transmitir uma mensagem.
- source_word: בְּתָרְמָה
  choice: em segredo
  rationale: A expressão indica que a mensagem foi enviada de modo oculto; a nota preserva a possível nuance de engano ou astúcia.
- source_word: הִנֵּה
  choice: Veja!
  rationale: A partícula chama a atenção do destinatário para uma informação urgente; “Veja!” é atual e mantém sua força discursiva.
- source_word: גַעַל בֶּן עֶבֶד
  choice: Gaal, filho de Ebede
  rationale: Reproduz diretamente o nome e a relação filial, com transliterações correntes e legíveis em português.
- source_word: וְאֶחָיו
  choice: e os irmãos dele
  rationale: Mantém o sentido explícito do hebraico sem decidir se se trata de irmãos literais ou de parentes e aliados próximos.
- source_word: בָּאִים שְׁכֶמָה
  choice: vieram a Siquém
  rationale: O particípio e a terminação direcional indicam a chegada a Siquém com relevância para a situação presente.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: estão incitando a cidade contra você
  rationale: No contexto da revolta política, a frase provavelmente descreve Gaal e seu grupo tornando Siquém hostil a Abimeleque. Como o verbo também pode sugerir cerco ou pressão, essa possibilidade é preservada em nota.
