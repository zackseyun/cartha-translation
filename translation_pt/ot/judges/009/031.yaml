translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O tratamento “você” transmite de modo natural o singular de segunda pessoa dirigido a Abimeleque. A repetição hebraica de הִנֵּה não foi reproduzida mecanicamente; sua urgência foi concentrada em “Veja!”, evitando uma formulação artificial.
