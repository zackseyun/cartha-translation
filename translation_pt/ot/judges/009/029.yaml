  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: pt
  text: Quem dera este povo estivesse em minha mão![a] Então eu removeria Abimeleque. E disse a Abimeleque:[b] “Aumente seu exército e saia!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Quem entregará este povo em minha mão? Então eu removeria Abimeleque.” O hebraico emprega uma expressão de desejo: “Quem dará...?”'
    reason: lexical_alternative
  - marker: b
    text: O desafio “Aumente seu exército e saia!” provavelmente é uma provocação dirigida a Abimeleque, quer tenha sido proferida diretamente a ele, quer de forma retórica.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: Quem dera
  rationale: A expressão idiomática hebraica introduz um desejo; “Quem dera” comunica naturalmente essa força optativa em português.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o substantivo coletivo singular עָם sem restringi-lo indevidamente a um exército.
- source_word: בְּיָדִי
  choice: em minhas mãos
  rationale: Mantém a metáfora hebraica de domínio ou controle, que também é compreensível em português.
- source_word: וְאָסִירָה
  choice: eu acabaria com
  rationale: Expressa a intenção de afastar Abimeleque de modo natural, sem definir se isso ocorreria por expulsão, deposição ou morte.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: E disse a Abimeleque
  rationale: לְ é entendido em seu sentido normal de destinatário, embora o contexto permita que a fala seja um desafio retórico, e não necessariamente presencial.
- source_word: רַבֶּה צְבָאֲךָ
  choice: Aumente o seu exército
  rationale: O imperativo de רבה pede que Abimeleque torne numerosas as suas forças; “aumente o seu exército” é claro e corrente.
- source_word: וָצֵאָה
  choice: e venha lutar
  rationale: Literalmente, “e saia/venha para fora”; no contexto de um desafio militar, “venha lutar” torna explícita a implicação pragmática sem alterar o sentido.
