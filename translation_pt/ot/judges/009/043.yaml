base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: pt
  text: Ele tomou os homens, dividiu-os em três grupos[a] e ficou de emboscada no campo. Quando viu que o povo saía da cidade, levantou-se contra eles e os feriu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em três cabeças”, expressão hebraica que indica três divisões, grupos ou companhias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: Ele tomou os seus homens
  rationale: Embora עָם signifique literalmente “povo”, neste contexto militar refere-se aos homens sob o comando de Abimeleque. “Seus homens” comunica naturalmente o referente sem chamá-los de tropas, termo mais específico.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: dividiu-os em três grupos
  rationale: חצה significa “dividir”, e רָאשִׁים, literalmente “cabeças”, funciona aqui como expressão idiomática para divisões ou grupos.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: e ficou de emboscada no campo
  rationale: ארב descreve ficar à espera numa emboscada. A formulação é corrente em português e mantém o aspecto durativo da ação.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Quando viu que
  rationale: A construção narrativa com הִנֵּה introduz vividamente o que ele percebeu; “quando viu que” reproduz a relação temporal de modo natural, sem um rígido “eis que”.
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: o povo saía da cidade
  rationale: O particípio יֹצֵא apresenta a ação em andamento no momento da observação. Aqui עָם designa a população que saía da cidade, por isso “o povo” é apropriado.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: levantou-se contra eles
  rationale: Mantém de perto o sentido de קום על, que pode indicar levantar-se contra alguém ou atacá-lo, preservando a imagem hebraica.
- source_word: וַיַּכֵּם
  choice: e os feriu
  rationale: 'נכה tem sentido amplo: ferir, golpear ou derrotar. “Feriu” preserva essa amplitude e não afirma explicitamente que todos foram mortos.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. O primeiro עָם foi vertido contextualmente por “seus homens”, enquanto o segundo permaneceu “o povo”, pois se refere aos habitantes que saíam da cidade. A nota preserva a imagem idiomática de רָאשִׁים.
