base_translation:
  language: en
  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: pt
  text: Abimeleque chegou até a torre e travou combate contra ela. Depois, aproximou-se da entrada da torre para incendiá-la.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד־הַמִּגְדָּל
  choice: chegou até a torre
  rationale: Expressa naturalmente o movimento até a torre; o hebraico não exige a ideia topográfica de subir.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: a atacou
  rationale: No contexto, o sentido é combater ou lançar um ataque contra a torre; esta formulação é clara em português e conserva a referência pronominal.
- source_word: וַיִּגַּשׁ עַד־פֶּתַח הַמִּגְדָּל
  choice: aproximou-se da entrada da torre
  rationale: Representa o avanço de Abimeleque até junto da entrada em português corrente.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: para incendiá-la
  rationale: O infinitivo indica propósito, e 'incendiar' transmite idiomaticamente a ação de queimar com fogo sem redundância desnecessária.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e sem expansão interpretativa. A divisão em duas frases reduz a repetição coordenativa típica da narrativa hebraica sem alterar a sequência dos acontecimentos.
