  text: וְ/אִם בֶּ/אֱמֶ֨ת וּ/בְ/תָמִ֧ים עֲשִׂיתֶ֛ם עִם יְרֻבַּ֥עַל וְ/עִם בֵּית֖/וֹ הַ/יּ֣וֹם הַ/זֶּ֑ה שִׂמְחוּ֙ בַּ/אֲבִימֶ֔לֶךְ וְ/יִשְׂמַ֥ח גַּם ה֖וּא בָּ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: pt
  text: E, se hoje vocês agiram com verdade e integridade para com Jerubaal e a casa dele[a], alegrem-se em Abimeleque[b], e que ele também se alegre em vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa” pode significar a família, os descendentes ou a dinastia de Jerubaal.
    reason: cultural_note
  - marker: b
    text: 'Ou: “alegrem-se por causa de Abimeleque”; também na frase seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Mantém a conjunção e a partícula condicional, ligando o versículo à argumentação condicional anterior de Jotão.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: com verdade e integridade
  rationale: Preserva os dois substantivos éticos e sua tensão entre veracidade ou fidelidade e inteireza moral, em português natural.
- source_word: עֲשִׂיתֶם עִם
  choice: vocês agiram ... para com
  rationale: Expressa o idioma hebraico de agir ou proceder em relação a alguém, sem especificar além do texto a natureza do procedimento.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֵּיתוֹ
  choice: a casa dele
  rationale: Mantém a amplitude de בַּיִת, que pode abranger casa, família ou linhagem, evitando restringi-la no corpo do texto.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente moderno e direto da expressão hebraica literalmente traduzível por “este dia”.
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: alegrem-se com Abimeleque
  rationale: Reproduz o imperativo plural; “com” comunica de modo natural a relação expressa por ב sem impor exclusivamente a ideia de motivo ou objeto da alegria.
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: e que ele também se alegre com vocês
  rationale: Interpreta corretamente o imperfeito como jussivo após o imperativo e preserva a reciprocidade entre Abimeleque e os ouvintes.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas brasileiras naturais (“vocês”, “dele”). A formulação preserva o tom retórico e condicional de Jotão. “Verdade e integridade” retém a dupla expressão ética do hebraico; “casa” preserva sua amplitude semântica. Todos os marcadores de nota aparecem no texto.
