  to: 'Falem, por favor, para que todos os líderes de Siquém ouçam: “O que é melhor para vocês: que setenta homens, todos os filhos de Jerubaal, governem vocês, ou que um só homem governe vocês? Lembrem-se de que eu sou osso e carne de vocês[a].”'
