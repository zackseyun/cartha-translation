source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: pt
  text: 'Falem, por favor, para que todos os líderes de Siquém ouçam: “O que é melhor para vocês: que setenta homens, todos os filhos de Jerubaal, governem vocês, ou que um só homem governe vocês? Lembrem-se de que eu sou osso e carne de vocês[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica de parentesco; isto é, “sou do mesmo sangue que vocês” ou “sou parente próximo de vocês”.
    reason: Esclarece o idioma hebraico preservado literalmente no texto principal.
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: Por favor, falem
  rationale: O imperativo plural com נָא expressa um pedido ou apelo. A formulação é natural em português e mantém o tom persuasivo.
- source_word: בְּאָזְנֵי
  choice: aos ouvidos de
  rationale: Mantém a imagem concreta do hebraico e comunica que a mensagem deve ser dita diretamente para que todos a ouçam.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: líderes de Siquém
  rationale: בַּעֲלֵי pode designar senhores, proprietários ou cidadãos influentes. No contexto cívico, “líderes” comunica de modo claro a posição social e política do grupo, sem sugerir domínio feudal.
- source_word: מַה טּוֹב לָכֶם
  choice: O que é melhor para vocês
  rationale: A construção introduz duas opções em comparação; “melhor” explicita naturalmente o valor comparativo implícito.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: governem vocês ... os governe
  rationale: משׁל indica exercer governo ou domínio. A repetição do verbo “governar” preserva o paralelismo, com ajuste pronominal para fluência.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: setenta homens, todos os filhos de Jerubaal
  rationale: “Homens” é adequado ao gênero e ao contexto, que identifica explicitamente os filhos de Jerubaal.
- source_word: אִם
  choice: ou
  rationale: Nesta pergunta disjuntiva, אִם introduz a segunda alternativa; “ou” expressa diretamente o contraste.
- source_word: אִישׁ אֶחָד
  choice: um só homem
  rationale: “Um só homem” preserva o contraste enfático entre setenta governantes e apenas um.
- source_word: וּזְכַרְתֶּם
  choice: Lembrem-se também
  rationale: No contexto, a forma tem força exortativa. “Lembrem-se” conserva essa força, e “também” liga o apelo de parentesco à pergunta anterior.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: osso e carne de vocês
  rationale: A tradução conserva a imagem concreta e a ordem do idioma hebraico de parentesco, deixando sua explicação para a nota.
- source_word: אָנִי
  choice: eu sou
  rationale: O pronome explícito preserva a ênfase do hebraico sobre a identidade de Abimeleque.
theological_decisions:
- issue: Sentido do idioma de parentesco
  choice: Conservar “eu sou osso e carne de vocês” no texto principal
  alternative: “sou do mesmo sangue que vocês” ou “sou parente de vocês”
  rationale: A expressão concreta destaca solidariedade familiar e identidade compartilhada. Mantê-la evita reduzir o texto a uma paráfrase, enquanto a nota esclarece seu sentido.
- issue: Linguagem referente aos filhos de Jerubaal e a Abimeleque
  choice: Usar “setenta homens” e “um só homem”
  alternative: “setenta pessoas” e “uma só pessoa”
  rationale: O contexto trata especificamente dos filhos homens de Jerubaal e de Abimeleque; a formulação masculina corresponde ao referente e preserva o contraste retórico.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O discurso mantém o tom persuasivo de Abimeleque, o paralelismo da pergunta e a imagem hebraica de parentesco.
