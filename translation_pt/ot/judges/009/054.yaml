base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: pt
  text: 'Então ele chamou às pressas o jovem que carregava suas armas e lhe disse[a]: “Tire a sua espada e mate-me, para que não digam a meu respeito: ‘Uma mulher o matou.’” Então seu jovem o traspassou, e ele morreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “seu escudeiro”, em lugar de “o jovem que carregava suas armas” e “seu jovem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: Então ele chamou depressa
  rationale: O wayyiqtol dá sequência à narrativa, e מְהֵרָה indica urgência. A formulação é natural e mantém ambos os elementos.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר designa aqui um jovem que servia como escudeiro; “jovem” preserva o sentido lexical sem tornar a função um título no texto principal.
- source_word: נֹשֵׂא כֵלָיו
  choice: que carregava suas armas
  rationale: A expressão significa literalmente aquele que levava seu equipamento ou suas armas. Esta tradução é transparente; “escudeiro” fica registrado como alternativa idiomática.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Tire a sua espada
  rationale: שׁלף descreve retirar ou desembainhar a espada. “Tire a sua espada” é claro em português corrente.
- source_word: וּמוֹתְתֵנִי
  choice: e mate-me
  rationale: No contexto, a forma verbal expressa fazer morrer. “Mate-me” transmite de modo direto a ordem de Abimeleque.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: para que não digam a meu respeito
  rationale: 'פֶּן introduz a finalidade negativa, e לִי tem aqui sentido contextual de referência: o que diriam a respeito dele.'
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: Uma mulher o matou
  rationale: A ordem hebraica põe “mulher” em destaque. A voz ativa e a citação direta preservam essa ênfase.
- source_word: וַיִּדְקְרֵהוּ
  choice: o atravessou com a espada
  rationale: O verbo indica perfurar ou traspassar com uma arma. A menção da espada, recuperada do contexto imediato, torna natural em português a ação implícita.
- source_word: נַעֲרוֹ
  choice: O jovem
  rationale: Mantém a correspondência lexical com הַנַּעַר no início do versículo; o possessivo é dispensável em português porque o referente permanece inequívoco.
