  naturalness: «Chamou às pressas» é mais idiomático e fluente em português moderno do que «chamou depressa». O restante mantém registro narrativo claro e digno.
  terminology: «Jovem» e «que carregava suas armas» preservam de modo apropriado נער e נשא כליו. «Escudeiro» é uma boa alternativa em nota. «Traspassou» reproduz com precisão suficiente a especificidade de דקר sem acrescentar o instrumento.
