lexical_decisions:
- source_word: בַּעֲלֵי
  choice: líderes
  rationale: Embora o termo signifique literalmente “senhores” ou “proprietários”, neste contexto designa as pessoas de autoridade ligadas à torre de Siquém; “líderes” comunica naturalmente essa função sem sugerir uma referência ao deus Baal.
- source_word: מִגְדַּל שְׁכֶם
  choice: torre de Siquém
  rationale: Mantém a designação do texto hebraico e sua possível referência ao local ou à comunidade associada à torre, sem explicitação indevida.
- source_word: הִתְקַבְּצוּ
  choice: haviam se reunido
  rationale: O mais-que-perfeito expressa com clareza que a reunião já ocorrera quando a notícia chegou a Abimeleque.
