  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: pt
  text: Quando todos os líderes da Torre de Siquém[a] souberam disso, entraram na câmara interior[b] do templo de El-Berite.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Migdal-Siquém”, entendendo a expressão como nome de lugar, e não como “Torre de Siquém”.
    reason: alternative_reading
  - marker: b
    text: Ou “abóbada”, “fortaleza” ou “sala interna”; o termo hebraico descreve um recinto interior protegido.
    reason: lexical_alternative
  - marker: c
    text: El-Berite pode significar “Deus da aliança”. Compare o nome relacionado “Baal-Berite” em outras partes deste capítulo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: souberam disso
  rationale: O verbo significa literalmente “ouviram”; o contexto fornece como objeto a notícia dos acontecimentos anteriores. “Souberam disso” é natural em português e não acrescenta conteúdo material.
- source_word: בַּעֲלֵי
  choice: líderes
  rationale: Literalmente, “senhores” ou “principais”. Neste contexto cívico-militar, refere-se aos homens de destaque ligados à Torre de Siquém; “líderes” comunica com clareza essa função.
- source_word: מִגְדַּל שְׁכֶם
  choice: Torre de Siquém
  rationale: מִגְדַּל significa “torre”, mas a expressão pode funcionar como nome de local. A forma com iniciais maiúsculas conserva o sentido transparente e sinaliza a possível designação geográfica.
- source_word: וַיָּבֹאוּ אֶל
  choice: entraram
  rationale: O verbo de movimento com אֶל, neste contexto de busca de refúgio, indica entrada no recinto mencionado a seguir.
- source_word: צְרִיחַ
  choice: câmara interior
  rationale: O substantivo designa um recinto interior protegido, possivelmente uma abóbada, fortaleza ou sala interna. “Câmara interior” evita uma reconstrução arquitetônica excessivamente específica.
- source_word: בֵּית אֵל בְּרִית
  choice: templo de El-Berite
  rationale: בֵּית significa literalmente “casa”, mas, ligado a uma divindade, designa naturalmente um templo ou santuário. “El-Berite” translitera o nome ou título e preserva sua ambiguidade.
theological_decisions:
- issue: Interpretação do nome ou título cultual אֵל בְּרִית
  choice: El-Berite
  alternative: Deus da aliança; ou Baal-Berite, por harmonização com o contexto próximo
  rationale: A transliteração preserva a possibilidade de a expressão funcionar como nome ou título divino e evita resolver a ambiguidade ou harmonizá-la com outros versículos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Templo” explicita o uso cultual de בֵּית sem introduzir distinção denominacional; as notas preservam as ambiguidades geográfica, arquitetônica e teológica.
