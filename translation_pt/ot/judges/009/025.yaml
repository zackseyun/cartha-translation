    rationale: A forma narrativa hebraica וַיִּגְזְלוּ apresenta o fato na sequência dos acontecimentos. O imperfeito português sugere uma ação repetida ou durativa que não é necessária no texto-fonte.
  - severity: low
    issue: «puseram homens de emboscada»
    rationale: A formulação é pouco natural em português. «Postaram emboscadores» transmite claramente que pessoas foram colocadas à espera.
  - severity: low
    issue: Nota com «baalins»
    rationale: Não é uma forma portuguesa corrente para o termo hebraico e pode sugerir indevidamente uma referência ao deus Baal. A explicação literal deve falar em senhores ou donos.
