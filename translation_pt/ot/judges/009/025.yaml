  source_fidelity: A tradução identifica corretamente os líderes de Siquém, a emboscada dirigida contra Abimeleque, a posição elevada, o roubo dos viajantes e a comunicação posterior a Abimeleque. Contudo, o wayyiqtol וַיִּגְזְלוּ é melhor vertido pelo pretérito perfeito narrativo («roubaram») do que pelo imperfeito («roubavam»), que introduz uma nuance habitual não marcada no hebraico.
  naturalness: «Puseram homens de emboscada» é compreensível, mas pouco idiomático em português atual. «Postaram emboscadores» é mais natural e mantém explicitamente o particípio pessoal plural. «Na estrada» reproduz com mais fluência o locativo do que «pela estrada» neste contexto.
  terminology: «Líderes de Siquém» é uma boa solução contextual para בַעֲלֵי שְׁכֶם. A nota deve evitar «baalins», forma não natural e potencialmente confundível com o nome da divindade Baal; «senhores/donos de Siquém» exprime adequadamente o sentido literal sem fechar a interpretação social-política.
