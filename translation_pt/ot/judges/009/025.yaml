base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: pt
  text: Então os líderes de Siquém postaram emboscadores contra ele no alto dos montes[a] e roubaram todos os que passavam por eles na estrada; e isso foi comunicado a Abimeleque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os cidadãos de Siquém” ou “os senhores de Siquém”. A expressão hebraica significa literalmente “os senhores” ou “os donos de Siquém” e pode designar os homens de destaque ou os detentores do poder na cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: os líderes de Siquém
  rationale: A expressão designa literalmente os senhores ou detentores de poder de Siquém; no contexto político da cidade, “líderes” comunica com naturalidade sua posição, enquanto a nota preserva outras possibilidades.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: puseram homens de emboscada contra ele
  rationale: A construção descreve pessoas posicionadas para uma emboscada dirigida contra Abimeleque. “Contra ele” preserva a força hostil do dativo hebraico.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: no alto dos montes
  rationale: Traduz a imagem literal das “cabeças” dos montes em português natural, mantendo tanto a elevação quanto o plural do texto hebraico.
- source_word: וַיִּגְזְלוּ
  choice: roubavam
  rationale: O verbo indica tomar bens mediante violência. O imperfeito narrativo pode descrever aqui a atividade repetida dos emboscados contra quem passava.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: todos os que passavam por eles pela estrada
  rationale: O singular hebraico depois de כָּל tem sentido distributivo. O plural em português expressa naturalmente cada viajante que passava pelo local.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: isso foi comunicado a Abimeleque
  rationale: Mantém a construção passiva e deixa sem identificação quem levou a informação, como no hebraico.
