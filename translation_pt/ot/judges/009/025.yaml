  rationale: A revisão conserva as escolhas lexicais e a ambiguidade sociopolítica da expressão hebraica, mas ajusta o verbo principal ao perfeito narrativo do texto-fonte, torna a expressão da emboscada idiomática em português e esclarece a nota lexical sem introduzir uma transliteração enganosa.
