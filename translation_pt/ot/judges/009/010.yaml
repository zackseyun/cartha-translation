  yaml_path: translation/ot/judges/009/010.yaml
  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: pt
  text: 'Então as árvores disseram à figueira: “Venha você e reine sobre nós.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “disseram” traduz o sentido comum de אמר.
- source_word: הָעֵצִים
  choice: as árvores
  rationale: עֵצִים é o plural comum de “árvore”; no contexto da fábula, são claramente as personagens que falam.
- source_word: לַתְּאֵנָה
  choice: à figueira
  rationale: תְּאֵנָה designa aqui a árvore, não apenas o fruto, e ל marca o destinatário da fala.
- source_word: לְכִי אַתְּ
  choice: Venha você
  rationale: O imperativo feminino singular de הלך, seguido do pronome independente אַתְּ, dirige-se enfaticamente à figueira. “Venha você” preserva a ênfase sem soar excessivamente literal.
- source_word: מָלְכִי
  choice: reine
  rationale: O imperativo feminino singular de מלך tem o sentido verbal de exercer realeza; “reine” é natural, conciso e concorda com “figueira”.
- source_word: עָלֵינוּ
  choice: sobre nós
  rationale: Com מלך, a preposição על indica domínio sobre súditos; “sobre nós” é a formulação portuguesa corrente.
