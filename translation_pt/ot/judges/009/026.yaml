base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: pt
  text: Então Gaal, filho de Ebede, veio com seus irmãos, e eles entraram em Siquém[a]. Os líderes de Siquém[b] confiaram nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atravessaram Siquém” ou “passaram por Siquém”; o verbo hebraico pode indicar atravessar ou passar, e a nuance exata neste contexto é incerta.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os senhores de Siquém”, isto é, os homens influentes ou detentores de poder na cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... veio
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa com naturalidade a progressão sequencial.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal, filho de Ebede
  rationale: O nome próprio e o patronímico são transliterados em formas claras e correntes em português.
- source_word: וְאֶחָיו
  choice: com seus irmãos
  rationale: Embora a conjunção hebraica seja literalmente “e”, depois de “veio” o português expressa naturalmente a ideia de acompanhamento com “com”.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: entrou em Siquém
  rationale: עבר com בְ indica aqui deslocamento para dentro ou através da cidade. “Entrou em” oferece português natural, mantendo em nota a possível nuance de atravessar ou passar por.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: depositaram nele a sua confiança
  rationale: בטח com בְ comunica confiança dirigida a uma pessoa; a formulação preserva a força relacional da expressão.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: os líderes de Siquém
  rationale: בעלי, em relação a uma cidade, designa seus homens influentes ou detentores de poder, não necessariamente todos os habitantes.
