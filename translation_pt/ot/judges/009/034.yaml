base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: pt
  text: Então Abimeleque e todo o povo que estava com ele se levantaram à noite e se puseram de emboscada contra Siquém, em quatro grupos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “quatro cabeças”, expressão que significa quatro grupos ou divisões.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantaram
  rationale: O verbo קום descreve aqui o ato de levantar-se e entrar em ação. A concordância no plural é natural em português porque o sujeito composto inclui Abimeleque e todo o povo.
- source_word: לָיְלָה
  choice: durante a noite
  rationale: O substantivo funciona adverbialmente para indicar o período em que a ação ocorreu, sem exigir que tenha durado a noite inteira.
- source_word: וַיֶּאֶרְבוּ
  choice: ficaram de emboscada
  rationale: 'A expressão comunica de modo natural o sentido militar de ארב: posicionar-se ocultamente à espera de atacar.'
- source_word: עַל שְׁכֶם
  choice: contra Siquém
  rationale: Com o verbo de emboscar, עַל indica o alvo hostil da ação, e não apenas proximidade geográfica.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: em quatro grupos
  rationale: A expressão significa literalmente “quatro cabeças”, mas neste contexto designa quatro unidades ou agrupamentos distintos. “Grupos” é claro e evita impor uma estrutura militar mais específica do que o hebraico.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: todo o povo que estava com ele
  rationale: Mantém o sentido amplo de עָם sem substituir o termo por “soldados”, “tropas” ou “homens”, especificações que o texto não traz explicitamente.
