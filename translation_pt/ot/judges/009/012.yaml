  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: pt
  text: 'Então as árvores disseram à videira: “Venha[a], reine sobre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá, reine sobre nós”. Embora o verbo hebraico tenha literalmente o sentido de “ir”, nesta convocação seguida de outro imperativo, “Venha, reine sobre nós” transmite o chamado de modo mais natural em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: הָעֵצִים
  choice: as árvores
  rationale: Neste contexto da fábula de Jotão, o plural עֵצִים designa árvores, não madeira como material.
- source_word: לַגָּפֶן
  choice: à videira
  rationale: גֶּפֶן designa a videira; esta forma é clara, corrente e adequada à personificação da fábula.
- source_word: לְכִי
  choice: Venha
  rationale: Embora הלך tenha o sentido básico de “ir/andar”, nesta convocação seguida de outro imperativo a expressão idiomática natural em português é “Venha”.
- source_word: אַתְּ
  choice: implícito nas formas femininas “Venha” e “reine”
  rationale: O pronome hebraico é feminino singular e concorda com “videira”. Em português, o sujeito pode ficar naturalmente implícito nos imperativos.
- source_word: מְלֹכִי
  choice: reine
  rationale: O imperativo feminino singular de מלך indica o exercício do governo real. “Reine sobre nós” preserva a força verbal e soa natural em português.
- source_word: עָלֵינוּ
  choice: sobre nós
  rationale: Com מלך, עַל indica aqueles que ficam sob o governo; “sobre nós” é a formulação portuguesa usual.
