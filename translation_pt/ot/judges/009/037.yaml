    rationale: Embora seja compreensível, «Gente está descendo» representa de forma mais direta o particípio plural יֹרְדִים.
  - severity: low
    issue: «centro da terra» pode sugerir o planeta em português contemporâneo.
    rationale: A expressão hebraica se refere à parte central do território/região. «Centro da região», com a imagem literal preservada em nota, é mais clara.
