base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: pt
  text: 'Gaal voltou a falar e disse: “Veja! Gente está descendo do centro da região[a], e um grupo vem pelo caminho do Carvalho dos Adivinhos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “do umbigo da terra”, expressão que indica a parte central da região.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo caminho do Terebinto dos Adivinhos” ou “pelo caminho do Carvalho de Meonenim”. A espécie da árvore e o sentido do último elemento do nome são incertos; este talvez se refira a adivinhos ou agoureiros.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר וַיֹּאמֶר
  choice: Gaal voltou a falar e disse
  rationale: A construção idiomática hebraica expressa que Gaal fala novamente; “voltou a falar” é natural em português e mantém a repetição, enquanto וַיֹּאמֶר é representado por “disse”.
- source_word: הִנֵּה
  choice: Olhem!
  rationale: Partícula que chama a atenção dos ouvintes para o que está sendo visto. O plural se ajusta ao discurso dirigido aos presentes e soa atual.
- source_word: עָם יֹרְדִים
  choice: Há gente descendo
  rationale: עָם é coletivo e o particípio plural destaca as pessoas que compõem o grupo. “Gente” permite em português a concordância natural no singular sem transformar explicitamente o grupo em tropas.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: do centro da terra
  rationale: טַבּוּר significa literalmente “umbigo”, mas nesta expressão geográfica indica a região central. “Centro da terra” comunica o sentido idiomático sem eliminar a imagem original, registrada em nota.
- source_word: וְרֹאשׁ אֶחָד
  choice: e um grupo
  rationale: Embora רֹאשׁ signifique literalmente “cabeça”, aqui designa uma unidade ou coluna distinta entre os que se aproximam. “Grupo” evita especificar indevidamente uma organização militar formal.
- source_word: מִדֶּרֶךְ
  choice: pelo caminho
  rationale: A preposição e o substantivo indicam a rota pela qual o grupo vem; a formulação portuguesa preserva esse valor topográfico.
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: Carvalho dos Adivinhos
  rationale: אֵלוֹן pode designar carvalho, terebinto ou uma grande árvore, e מְעוֹנְנִים provavelmente se relaciona com adivinhação. Como a expressão funciona como topônimo, recebe iniciais maiúsculas; a incerteza é preservada em nota.
