base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: pt
  text: 'Gaal, filho de Ebede, disse: “Quem é Abimeleque, e quem é Siquém, para que o sirvamos? Não é ele filho de Jerubaal, e não é Zebul seu oficial?[a] Sirvam os homens de Hamor, pai de Siquém![b] Mas por que nós o serviríamos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seu oficial” também pode ser traduzido por “seu representante”, “seu administrador” ou “seu encarregado”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as pessoas ligadas a Hamor ou dele descendentes. Hamor é lembrado como pai de Siquém; veja Gênesis 34.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: Quem é Abimeleque, e quem é Siquém
  rationale: Mantém os dois interrogativos retóricos e o nome Siquém tal como no hebraico, preservando a provável metonímia da cidade ou comunidade sem explicitá-la no texto.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: para que o sirvamos
  rationale: Expressa de modo natural a finalidade contestada e conserva o sentido político de servir ou estar sujeito a Abimeleque.
- source_word: הֲלֹא בֶן יְרֻבַּעַל וּזְבֻל פְּקִידוֹ
  choice: Não é ele filho de Jerubaal, e não é Zebul seu oficial?
  rationale: A repetição de “não é” torna clara em português a estrutura elíptica do hebraico sem alterar a força da pergunta retórica; “oficial” mantém indefinida a função administrativa de Zebul.
- source_word: עִבְדוּ
  choice: Sirvam
  rationale: Imperativo plural direto, preservando o tom incisivo da fala de Gaal.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: aos homens de Hamor, pai de Siquém
  rationale: Conserva a expressão literal “homens de Hamor” e a aposição ambígua do hebraico, que pode evocar tanto Hamor como ancestral quanto sua associação fundadora com Siquém.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: Mas por que nós o serviríamos?
  rationale: “Mas” comunica a força adversativa da conclusão; o pronome explícito “nós” preserva a ênfase de אֲנָחְנוּ, e o condicional soa natural na contestação retórica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas correntes no Brasil. Mantiveram-se os nomes tradicionais Abimeleque, Siquém, Jerubaal, Zebul, Hamor e Ebede. A retórica desafiadora foi preservada por perguntas diretas e pelo imperativo plural. Não se acrescentou nota específica para a metonímia de Siquém, pois a formulação literal permanece inteligível e a ambiguidade é genuína.
