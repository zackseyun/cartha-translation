base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: pt
  text: Então todo o povo também cortou, cada um, um galho[a]. Seguiram Abimeleque, amontoaram os galhos contra o refúgio e atearam fogo ao refúgio sobre eles. Assim morreram também todos os habitantes da torre de Siquém, cerca de mil homens e mulheres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada homem, o seu galho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ גַם כָּל־הָעָם אִישׁ שׂוֹכֹה
  choice: todo o povo também cortou, cada um, um galho
  rationale: Reproduz a força distributiva de אִישׁ e o singular שׂוֹכֹה em português natural, sem interpretar o objeto como um feixe.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: Seguiram Abimeleque
  rationale: No contexto narrativo, a expressão idiomática 'foram atrás de' indica que o povo seguiu o exemplo e a liderança de Abimeleque; 'seguiram' é claro e corrente.
- source_word: הַצְּרִיחַ
  choice: o refúgio
  rationale: O substantivo raro parece designar a parte protegida ou recinto fortificado no interior da torre, distinguindo-se de מִגְדַּל, 'torre', no fim do versículo. 'Refúgio' preserva a função provável sem afirmar uma arquitetura específica.
- source_word: וַיָּשִׂימוּ עַל־הַצְּרִיחַ
  choice: amontoaram os galhos contra o refúgio
  rationale: O objeto está implícito no hebraico e é retomado do contexto. No cenário de incêndio, עַל admite a ideia espacial de colocar junto a/contra a estrutura; 'amontoaram' comunica naturalmente a ação coletiva.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת־הַצְּרִיחַ בָּאֵשׁ
  choice: puseram fogo nele por cima dos que estavam lá dentro
  rationale: Mantém a referência ao refúgio e a força espacial de עֲלֵיהֶם, esclarecendo apenas o referente humano exigido pelo contexto. Evita sugerir que o próprio recinto estava literalmente apoiado sobre as pessoas.
- source_word: אַנְשֵׁי מִגְדַּל־שְׁכֶם
  choice: os habitantes da torre de Siquém
  rationale: אַנְשֵׁי pode indicar as pessoas associadas ao local. 'Habitantes' inclui com naturalidade os homens e as mulheres explicitamente mencionados a seguir.
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  choice: cerca de mil homens e mulheres
  rationale: O prefixo כְּ marca aproximação, e a expressão final abrange ambos os sexos em português corrente.
theological_decisions: []
