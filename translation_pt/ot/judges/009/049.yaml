    issue: Explicitação de “lá dentro”
    rationale: Em “por cima dos que estavam lá dentro”, a tradução especifica que o referente de עֲלֵיהֶם estava dentro do recinto. O contexto sustenta essa leitura, mas o versículo em si emprega apenas “sobre eles”; convém não resolver mais do que o texto expressa.
  - severity: low
    issue: Nota b não oferece uma alternativa substantiva
    rationale: A nota marcada b apenas reformula “cerca de mil homens e mulheres” e não esclarece uma dificuldade textual, lexical ou tradutória. Sua remoção deixa o texto e as notas mais precisos.
