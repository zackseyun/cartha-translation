  to: Então todo o povo também cortou, cada um, um galho[a]. Seguiram Abimeleque, amontoaram os galhos contra o refúgio e atearam fogo ao refúgio sobre eles. Assim morreram também todos os habitantes da torre de Siquém, cerca de mil homens e mulheres.
