  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: pt
  text: 'Mas a oliveira lhes respondeu: “Deixaria eu de produzir o meu azeite, com o qual deuses e homens são honrados[a], para ir balançar sobre as árvores[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o qual Deus e os homens são honrados”. Muitas traduções entendem אֱלֹהִים como referência ao Deus verdadeiro, pois o azeite era usado no culto; no hebraico, porém, tanto o substantivo como o verbo estão no plural.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “minha gordura” ou “minha fartura”, expressão figurada para o rico produto da oliveira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזַּיִת
  choice: a oliveira
  rationale: No contexto da fábula, o substantivo designa a árvore personificada; “oliveira” é a forma natural e precisa em português.
- source_word: הֶחֳדַלְתִּי
  choice: Deveria eu deixar
  rationale: O perfeito funciona como pergunta retórica diante do convite das árvores. A formulação preserva a força deliberativa sem convertê-la em simples passado.
- source_word: דִּשְׁנִי
  choice: o meu óleo
  rationale: Literalmente, “minha gordura/fartura”; na fala da oliveira, a imagem aponta concretamente para seu produto rico, o azeite. “Óleo” comunica isso com clareza, embora explicite a metonímia contextual.
- source_word: אֲשֶׁר בִּי
  choice: com o qual
  rationale: Expressa naturalmente o valor instrumental da construção hebraica e retoma “óleo”.
- source_word: יְכַבְּדוּ
  choice: são honrados
  rationale: Embora o verbo hebraico seja ativo e tenha sujeito não expresso, a construção passiva evita inserir um agente e mantém o foco nos que recebem honra.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: A forma nominal e o verbo são plurais. A tradução principal preserva esse dado gramatical, enquanto a leitura tradicional “Deus” é registrada em nota.
- source_word: וַאֲנָשִׁים
  choice: e homens
  rationale: Reproduz o par proverbial “deuses e homens” e o substantivo masculino plural do hebraico.
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: ir balançar sobre as árvores
  rationale: Preserva o movimento oscilante próprio das árvores e a ironia da imagem de exercer domínio sobre elas; “sobre” também mantém a noção de posição superior.
theological_decisions:
- issue: Referente de אֱלֹהִים
  choice: deuses
  alternative: Deus
  rationale: O substantivo e o verbo estão formalmente no plural, favorecendo “deuses”. Como o azeite também era usado no culto ao Deus de Israel, a leitura singular tradicional continua possível e é preservada em nota, sem eliminar a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica conserva certa solenidade própria da fábula. “Balançar sobre” mantém deliberadamente o jogo entre o movimento da árvore e sua pretendida posição de governo.
