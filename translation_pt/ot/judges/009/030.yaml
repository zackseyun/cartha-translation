  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: pt
  text: Quando Zebul, o governante da cidade, ouviu as palavras de Gaal, filho de Ebed, sua ira se acendeu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «seu nariz ardeu», expressão idiomática que significa «ele ficou irado» ou «sua ira se acendeu».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O verbo שׁמע indica aqui que Zebul tomou conhecimento das palavras de Gaal; «ouviu» é direto e natural, enquanto a construção com «quando» expressa em português a relação narrativa com a oração seguinte.
- source_word: זְבֻל
  choice: Zebul
  rationale: O nome próprio é transliterado de forma reconhecível e coerente com o uso bíblico em português.
- source_word: שַׂר הָעִיר
  choice: o governante da cidade
  rationale: שַׂר designa uma autoridade, chefe ou dirigente. «Governante» comunica a autoridade cívica de Zebul sem impor um cargo administrativo moderno demasiado específico.
- source_word: אֶת דִּבְרֵי
  choice: as palavras de
  rationale: Preserva a expressão concreta do hebraico e permanece idiomática em português.
- source_word: גַּעַל בֶּן עָבֶד
  choice: Gaal, filho de Ebede
  rationale: Os nomes são transliterados, e a vírgula torna natural em português a identificação patronímica.
- source_word: וַיִּחַר אַפּוֹ
  choice: sua ira se acendeu
  rationale: A expressão conserva a imagem hebraica de ardor associada à ira, sem reproduzir literalmente e de modo obscuro a referência ao nariz.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a metáfora hebraica da ira que se acende e evita especificar em excesso o cargo de Zebul.
