base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: pt
  text: Agora, portanto, se vocês agiram com verdade e integridade ao fazer Abimeleque rei, se trataram bem Jerubaal e a casa dele, e se o trataram conforme mereciam as obras de suas mãos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme a recompensa das mãos dele”. A expressão hebraica se refere a tratar alguém de acordo com os seus atos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Expressa tanto a transição temporal quanto a força conclusiva do desafio de Jotão.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: com verdade e integridade
  rationale: Preserva os dois termos éticos hebraicos, indicando conduta verdadeira, leal e íntegra.
- source_word: וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ
  choice: ao fazer Abimeleque rei
  rationale: O hifil de מלך significa fazer alguém reinar; a construção com «ao» liga naturalmente a entronização à avaliação da conduta.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: trataram bem
  rationale: Equivalente português natural para o idioma hebraico de fazer o bem para/com alguém.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Mantém o nome empregado no texto hebraico, em vez de substituí-lo por Gideão.
- source_word: בֵּיתוֹ
  choice: a casa dele
  rationale: Conserva a amplitude familiar e dinástica de «casa», com formulação clara no português atual.
- source_word: כִּגְמוּל יָדָיו
  choice: conforme mereciam os atos das mãos dele
  rationale: Preserva a imagem concreta das mãos e comunica que o tratamento deveria corresponder ao que seus atos mereciam.
- source_word: עֲשִׂיתֶם לוֹ
  choice: o trataram
  rationale: Formulação idiomática em português para a ação dirigida a Jerubaal, evitando uma tradução rígida de «fizeram a ele».
