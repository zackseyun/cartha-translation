base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: pt
  text: 'Então todas as árvores disseram ao espinheiro[a]: “Venha você e reine sobre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arbusto espinhoso”. O termo hebraico אָטָד se refere a um arbusto com espinhos; não é possível determinar com segurança a espécie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: כָל הָעֵצִים
  choice: todas as árvores
  rationale: Tradução direta do sujeito coletivo definido.
- source_word: הָאָטָד
  choice: o espinheiro
  rationale: אָטָד designa um arbusto espinhoso, sem permitir identificação botânica segura; “espinheiro” é natural e preserva o caráter baixo e espinhoso da planta na fábula.
- source_word: לֵךְ אַתָּה
  choice: Venha você
  rationale: A construção com o imperativo de הלך seguido de outro imperativo funciona como convocação enfática. “Venha você” mantém a ênfase do pronome אַתָּה sem reproduzir literalmente um “vá” pouco natural no contexto.
- source_word: מְלָךְ עָלֵינוּ
  choice: reine sobre nós
  rationale: Preserva de modo conciso o sentido especificamente régio do verbo מלך e a relação expressa por עַל.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A ordem “Venha você” conserva a ênfase do pronome hebraico.
