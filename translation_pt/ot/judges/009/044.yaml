base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: pt
  text: Abimeleque e os líderes que estavam com ele avançaram rapidamente e tomaram posição à entrada do portão da cidade, enquanto os outros dois grupos[a] avançaram contra todos os que estavam no campo e os golpearam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os dois líderes”. Pelo contexto, a expressão provavelmente se refere aos dois grupos ou destacamentos restantes dos três mencionados no versículo anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: avançaram rapidamente
  rationale: No contexto militar, o verbo indica um avanço ofensivo rápido; a expressão mantém tanto o movimento quanto a força do ataque.
- source_word: הָרָאשִׁים
  choice: os líderes
  rationale: O termo significa literalmente “cabeças” e aqui designa os chefes que acompanhavam Abimeleque, sem especificar uma patente militar não expressa no hebraico.
- source_word: וַיַּעַמְדוּ
  choice: tomaram posição
  rationale: A formulação comunica um posicionamento militar deliberado, e não apenas o ato estático de ficar em pé.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: à entrada do portão da cidade
  rationale: Reproduz de modo natural e concreto a localização indicada pela construção hebraica.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: os outros dois grupos
  rationale: Embora o texto massorético diga literalmente “os dois líderes”, o contexto imediato dos três grupos no versículo anterior favorece a referência aos dois destacamentos restantes; a nota preserva a forma literal e a ambiguidade textual.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: contra todos os que estavam no campo
  rationale: O sufixo plural no verbo seguinte indica referentes humanos; a tradução evita interpretar o objeto como plantações ou bens.
- source_word: וַיַּכּוּם
  choice: os feriram
  rationale: נכה denota golpear ou ferir e pode, conforme o contexto, envolver morte; “feriram” preserva a violência sem afirmar que todos foram mortos.
