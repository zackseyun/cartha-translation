id: JDG.9.1
reference: Judges 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: pt
  text: 'Abimeleque, filho de Jerubaal, foi a Siquém, aos irmãos de sua mãe, e falou com eles e com todo o clã da casa do pai de sua mãe[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, «a casa do pai de sua mãe» refere-se ao grupo familiar ou à linhagem materna de Abimeleque.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O verbo faz a narrativa avançar. O pretérito perfeito é natural em português, sem acrescentar um marcador temporal ausente do hebraico.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבַּעַל
  choice: Abimeleque, filho de Jerubaal
  rationale: Emprega as formas portuguesas tradicionais dos nomes e preserva diretamente a relação filial.
- source_word: שְׁכֶמָה
  choice: a Siquém
  rationale: O hê direcional indica movimento para a cidade; «a Siquém» expressa isso de modo idiomático.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: aos irmãos de sua mãe
  rationale: Mantém o termo concreto «irmãos», isto é, os tios maternos de Abimeleque, sem substituí-lo por uma explicação interpretativa.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: e falou com eles
  rationale: דבר significa falar; esta formulação evita repetir «disse» antes do introdutor de discurso לֵאמֹר.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: e com todo o clã
  rationale: מִשְׁפָּחָה designa aqui um grupo de parentesco mais amplo que a família nuclear; «clã» comunica essa unidade social.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: da casa do pai de sua mãe
  rationale: Preserva a estrutura e a imagem hebraicas, deixando a nota esclarecer que «casa» pode indicar o grupo familiar ou a linhagem.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz a fala direta que começa no versículo seguinte; os dois-pontos são a pontuação natural em português.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com formas nominais de ampla legibilidade brasileira. A sintaxe acompanha de perto o hebraico, mas evita conectivos artificiais e repetições pouco naturais. O marcador da nota foi colocado junto à expressão que ela explica.
