base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: pt
  text: Depois, ele foi à casa de seu pai, em Ofra, e matou seus irmãos, os filhos de Jerubaal — setenta homens — sobre uma só pedra.[a] Mas Jotão, o filho mais novo de Jerubaal, sobreviveu,[b] porque se escondeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “sobre uma só pedra” pode indicar uma única pedra usada nas execuções ou um único lugar onde elas foram realizadas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “restou vivo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: ele foi à casa de seu pai, em Ofra
  rationale: A forma narrativa faz a ação avançar, e a terminação direcional de עָפְרָתָה indica movimento rumo a Ofra. Em português, a formulação escolhida expressa naturalmente o destino sem perder a referência concreta à casa do pai.
- source_word: וַיַּהֲרֹג
  choice: matou
  rationale: Verte diretamente o sentido básico do verbo, sem acrescentar no próprio termo uma qualificação jurídica que, embora compatível com o contexto, não está lexicalmente explícita.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: seus irmãos, os filhos de Jerubaal
  rationale: Mantém a aposição hebraica e sua ênfase identificadora.
- source_word: שִׁבְעִים אִישׁ
  choice: setenta homens
  rationale: Preserva o número e a designação masculina do hebraico, sem tentar harmonizá-los com a sobrevivência de Jotão mencionada em seguida.
- source_word: עַל אֶבֶן אֶחָת
  choice: sobre uma só pedra
  rationale: Conserva a imagem concreta e incisiva do hebraico, sem determinar além do texto como a pedra foi usada.
- source_word: וַיִּוָּתֵר
  choice: sobreviveu
  rationale: No contexto da execução dos irmãos, comunica com naturalidade o resultado de ter restado, isto é, ter permanecido vivo; a nota registra uma opção mais formal.
- source_word: הַקָּטֹן
  choice: o filho mais novo
  rationale: No contexto familiar, o adjetivo denota naturalmente o mais novo, e a inclusão de 'filho' torna explícita em português a relação já presente no texto.
- source_word: כִּי נֶחְבָּא
  choice: porque se escondeu
  rationale: Expressa claramente a relação causal e o sentido reflexivo-contextual da forma hebraica.
