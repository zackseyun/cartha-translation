  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/תְּאֵנָ֔ה הֶ/חֳדַ֨לְתִּי֙ אֶת מָתְקִ֔/י וְ/אֶת תְּנוּבָתִ֖/י הַ/טּוֹבָ֑ה וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: pt
  text: 'Mas a figueira lhes respondeu: “Deixaria eu a minha doçura e o meu bom fruto para ir balançar sobre as árvores[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governar as árvores”. O verbo hebraico significa literalmente “balançar”, “oscilar” ou “mover-se”, preservando a imagem de uma árvore enquanto, na fábula, sugere exercer domínio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Mas ... respondeu
  rationale: O consecutivo faz a narrativa avançar; “Mas” exprime naturalmente o contraste da nova recusa, e “respondeu” se ajusta ao diálogo da fábula.
- source_word: הַתְּאֵנָה
  choice: a figueira
  rationale: O substantivo designa a árvore que produz figos e atua como personagem na fábula.
- source_word: הֶחֳדַלְתִּי
  choice: Deixaria eu
  rationale: A forma perfeita tem aqui força deliberativa numa pergunta retórica. A formulação preserva a ideia de abandonar ou cessar aquilo que a figueira produz.
- source_word: מָתְקִי
  choice: a minha doçura
  rationale: Mantém o substantivo abstrato e a personificação do hebraico, sem reduzi-lo simplesmente a “fruto doce”.
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: o meu bom fruto
  rationale: תְּנוּבָה significa produto, produção ou fruto; no contexto de uma figueira, “fruto” é a equivalência mais natural.
- source_word: וְהָלַכְתִּי
  choice: para ir
  rationale: Em português, a construção final liga com naturalidade o abandono da produção à ação proposta em seguida.
- source_word: לָנוּעַ
  choice: balançar
  rationale: Preserva o sentido concreto de mover-se ou oscilar e mantém a imagem arbórea, enquanto o contexto da fábula sugere exercer domínio.
- source_word: עַל הָעֵצִים
  choice: sobre as árvores
  rationale: A preposição pode expressar posição acima de algo ou autoridade sobre algo; “sobre” conserva essa ambiguidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica soa natural, e a combinação “balançar sobre” conserva deliberadamente a tensão entre a imagem física da árvore e a ideia de governo.
