base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: pt
  text: Mas havia uma torre fortificada[a] no meio da cidade. Todos os homens e as mulheres, bem como todos os líderes da cidade[b], fugiram para lá, fecharam-se dentro dela e subiram ao telhado da torre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “torre de força”; também se pode traduzir por “torre forte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os principais homens da cidade”. A expressão hebraica significa literalmente “os donos/senhores da cidade” e, neste contexto, provavelmente se refere aos homens de maior destaque ou autoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: torre fortificada
  rationale: A expressão combina “torre” com “força” e destaca seu caráter defensivo. “Torre fortificada” comunica esse sentido com naturalidade em português.
- source_word: בְּתוֹךְ הָעִיר
  choice: no meio da cidade
  rationale: Preserva o sentido espacial de algo situado no interior ou centro da cidade.
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: fugiram para lá
  rationale: Traduz diretamente o verbo נוּס, “fugir”, sem acrescentar explicitamente a ideia implícita de buscar refúgio.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: todos os homens e as mulheres
  rationale: Mantém a menção explícita dos dois grupos no hebraico.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: bem como todos os líderes da cidade
  rationale: Neste contexto cívico, בַּעֲלֵי designa provavelmente os principais homens ou dirigentes da cidade, e não todos os seus habitantes.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: fecharam-se dentro dela
  rationale: Expressa de modo idiomático que se encerraram no interior da torre, sem introduzir uma porta não mencionada expressamente.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: subiram ao terraço da torre
  rationale: גַּג é o teto plano ou terraço de uma construção; “terraço” oferece a imagem arquitetônica mais clara para leitores modernos.
theological_decisions: []
