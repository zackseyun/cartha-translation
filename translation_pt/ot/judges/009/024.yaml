base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: pt
  text: para que viesse a violência cometida contra os setenta filhos de Jerubaal, e o sangue deles fosse posto sobre Abimeleque, irmão deles, que os matou, e sobre os líderes de Siquém[b], que fortaleceram as mãos dele[c] para matar seus irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “os senhores de Siquém”; o hebraico se refere aos homens de poder ou dirigentes da cidade.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “fortaleceram as mãos dele”, isto é, deram-lhe apoio ou respaldo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: para que a violência cometida contra os setenta filhos de Jerubaal recaísse sobre os responsáveis
  rationale: O infinitivo com ל expressa propósito ou resultado. חמס designa aqui a violência sofrida pelos filhos de Jerubaal. O verbo 'recaísse' preserva a ideia de a violência 'vir' em consequência judicial, enquanto 'sobre os responsáveis' explicita o complemento implícito à luz dos dois grupos nomeados em seguida.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: e o sangue deles fosse posto sobre
  rationale: Mantém a imagem hebraica do sangue colocado sobre alguém, isto é, da responsabilidade pelo derramamento de sangue, sem substituí-la diretamente por um termo interpretativo como 'culpa de sangue'.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: Abimeleque, irmão deles
  rationale: A aposição identifica Abimeleque como irmão dos homens mortos e preserva a força retórica da traição familiar.
- source_word: אֲשֶׁר הָרַג אוֹתָם
  choice: que os matou
  rationale: הרג é o verbo comum para matar. A tradução evita impor ao próprio lexema uma qualificação jurídica mais específica.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: os líderes de Siquém
  rationale: בעלי, neste contexto urbano, refere-se aos homens de poder ou dirigentes de Siquém, não necessariamente a todos os habitantes.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: fortaleceram as mãos dele
  rationale: Preserva a expressão concreta do hebraico, que significa apoiar, encorajar ou dar respaldo.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: para matar os próprios irmãos
  rationale: A construção indica propósito. 'Os próprios irmãos' deixa natural em português a referência reflexiva aos irmãos de Abimeleque.
theological_decisions:
- issue: Imagem da responsabilidade pelo sangue derramado
  choice: manter 'o sangue deles fosse posto sobre'
  alternative: '''a culpa pelo sangue deles fosse atribuída a'''
  rationale: A formulação conserva a imagem judicial e moral do hebraico e não resolve em excesso a relação entre sangue, culpa e retribuição.
- issue: Destino da violência na primeira oração
  choice: explicitar 'sobre os responsáveis'
  alternative: manter apenas 'para que viesse a violência cometida contra...'
  rationale: O hebraico deixa o alvo da vinda da violência para ser identificado pela oração coordenada seguinte. A explicitação produz português inteligível, mas conserva a responsabilização conjunta de Abimeleque e dos líderes de Siquém.
translation_notes:
  register: Português moderno, digno e acessível, com nomes na forma tradicional brasileira. A imagem hebraica do sangue foi preservada. A expressão 'fortaleceram as mãos' foi mantida no texto e esclarecida em nota.
