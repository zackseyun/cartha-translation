id: JDG.9.23
reference: Judges 9:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: pt
  text: Então Deus enviou um espírito mau[a] entre Abimeleque e os líderes de Siquém[b], e os líderes de Siquém agiram traiçoeiramente contra Abimeleque[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito nocivo”. O hebraico pode destacar tanto o caráter mau quanto o efeito prejudicial.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os senhores de Siquém”; neste contexto, provavelmente os homens influentes ou dirigentes da cidade.'
    reason: lexical_alternative
  - marker: c
    text: Ou “traíram Abimeleque”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O verbo שׁלח, nesta forma narrativa, indica diretamente que Deus enviou o espírito; a tradução preserva essa agência sem acréscimos interpretativos.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto narrativo, אֱלֹהִים designa Deus como agente do juízo.
- source_word: רוּחַ רָעָה
  choice: um espírito mau
  rationale: Tradução direta e natural de רוּחַ רָעָה, preservando tanto a possibilidade de mal moral quanto a de efeito nocivo; a alternativa é indicada em nota.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e
  rationale: Reproduz precisamente a construção correlativa hebraica e a divisão criada entre as duas partes.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: os líderes de Siquém
  rationale: Embora בַּעֲלֵי signifique literalmente 'senhores/donos de', no contexto cívico-político refere-se aos homens que detinham poder na cidade.
- source_word: וַיִּבְגְּדוּ
  choice: agiram traiçoeiramente
  rationale: בגד expressa infidelidade ou conduta traiçoeira. Esta formulação é clara em português e conserva a força moral do verbo.
- source_word: בַּאֲבִימֶלֶךְ
  choice: contra Abimeleque
  rationale: Com בגד, a preposição בְּ marca aqui a pessoa lesada pela deslealdade; 'contra' é idiomático e explicita a direção hostil sem ampliar o sentido.
theological_decisions:
- issue: Agência divina no envio do espírito mau
  choice: Deus enviou um espírito mau
  alternative: Deus permitiu um espírito mau; Deus enviou um espírito de hostilidade
  rationale: O verbo e a sintaxe hebraicos atribuem diretamente a Deus o envio. Substituir essa afirmação por mera permissão resolveria uma tensão teológica que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Abimeleque' e 'Siquém' seguem formas bíblicas portuguesas correntes. A ordem narrativa e a agência divina explícita do hebraico foram preservadas.
