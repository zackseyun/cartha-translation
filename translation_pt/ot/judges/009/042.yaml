base_translation:
  language: en
  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: pt
  text: No dia seguinte, o povo saiu para o campo, e isso foi comunicado a Abimeleque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “e disseram a Abimeleque”, com sujeito plural não identificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: No dia seguinte
  rationale: A fórmula narrativa introduz o acontecimento subsequente e situa-o no dia posterior. Em português, a expressão temporal direta é natural e comunica a sequência sem recorrer a uma fórmula pesada como “E aconteceu que”.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא indica movimento para fora; com o destino expresso, “saiu para” é a formulação corrente em português.
- source_word: הָעָם
  choice: o povo
  rationale: O substantivo coletivo עם refere-se ao conjunto das pessoas, sem restringir o referente aos homens.
- source_word: הַשָּׂדֶה
  choice: para o campo
  rationale: שדה designa aqui o campo ou terreno aberto fora da cidade. “Para o campo” preserva o singular e combina naturalmente com “saiu”.
- source_word: וַיַּגִּידוּ
  choice: isso foi comunicado
  rationale: O hebraico emprega a terceira pessoa do plural com sujeito não identificado, literalmente “eles comunicaram”. A passiva impessoal mantém a indefinição do agente em português; “isso” retoma a saída do povo.
- source_word: לַאֲבִימֶלֶךְ
  choice: a Abimeleque
  rationale: O nome próprio é transliterado conforme a forma portuguesa amplamente reconhecível, e a preposição ל marca o destinatário da comunicação.
