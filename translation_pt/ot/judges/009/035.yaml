  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: pt
  text: Então Gaal, filho de Ebede, saiu[a] e ficou à entrada do portão da cidade. Abimeleque e o povo que estava com ele se levantaram do lugar da emboscada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veio para fora”. O verbo hebraico indica simplesmente movimento para fora.
    reason: lexical_alternative
  - marker: b
    text: Ou “se levantaram da emboscada”. O substantivo hebraico pode indicar tanto a própria emboscada como o lugar onde ela foi armada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא indica movimento para fora. “Saiu” é natural em português e não especifica além do hebraico o ponto de partida.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal, filho de Ebede
  rationale: Mantém a construção patronímica hebraica e emprega formas de nomes legíveis em português.
- source_word: וַיַּעֲמֹד
  choice: ficou
  rationale: Neste contexto, עמד descreve Gaal permanecendo ou tomando posição junto à entrada; “ficou” soa natural sem acrescentar uma nuance militar explícita.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: à entrada do portão da cidade
  rationale: Preserva a relação entre פתח, “entrada”, e שער העיר, “portão da cidade”, em formulação idiomática portuguesa.
- source_word: וַיָּקָם
  choice: se levantaram
  rationale: קום expressa o ato de levantar-se e entrar em ação; o plural em português concorda naturalmente com o sujeito composto Abimeleque e o povo.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: e o povo que estava com ele
  rationale: Traduz עם de modo formalmente próximo, preservando a referência coletiva sem restringi-la explicitamente a “soldados” ou “homens”.
- source_word: מִן הַמַּאְרָב
  choice: do lugar da emboscada
  rationale: מארב pode designar tanto a emboscada quanto a posição de emboscada. No português, “lugar da emboscada” torna claro o sentido espacial exigido pela preposição מן, sem eliminar a alternativa lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A ordem narrativa e as relações sintáticas do hebraico foram preservadas sem introduzir explicações militares não explícitas.
