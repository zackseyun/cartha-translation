  text: וַ/יִּרְדְּפֵ֣/הוּ אֲבִימֶ֔לֶךְ וַ/יָּ֖נָס מִ/פָּנָ֑י/ו וַֽ/יִּפְּל֛וּ חֲלָלִ֥ים רַבִּ֖ים עַד פֶּ֥תַח הַ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: pt
  text: Abimeleque o perseguiu, e ele fugiu diante dele; muitos caíram mortos até a entrada do portão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “muitos foram abatidos, até a entrada do portão”. O hebraico conserva a vívida expressão de batalha que combina “caíram” com “mortos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: o perseguiu
  rationale: רדף expressa a perseguição de um inimigo; “o perseguiu” é direto e preserva o pronome masculino singular, que retoma Gaal no contexto.
- source_word: וַיָּנָס
  choice: ele fugiu
  rationale: נוס significa fugir. O sujeito singular retoma Gaal, sem necessidade de explicitar seu nome no versículo.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: A expressão significa literalmente “de diante de sua face/presença” e, neste contexto, descreve alguém fugindo diante do perseguidor.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: muitos caíram mortos
  rationale: A formulação conserva a imagem vívida de נפל, “cair”, e comunica naturalmente que חֲלָלִים são pessoas mortas ou abatidas em combate.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: até a entrada do portão
  rationale: Traduz de perto פתח, “entrada/abertura”, e שער, o portão da cidade; “portão” é mais natural aqui do que “porta” para uma entrada urbana fortificada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem narrativa e a repetição pronominal do hebraico foram preservadas sem tornar explícito o nome de Gaal. O marcador da nota foi colocado ao fim da oração à qual se refere.
