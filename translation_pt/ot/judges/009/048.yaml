base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: pt
  text: 'Então Abimeleque subiu ao monte Zalmom, ele e todo o povo que estava com ele. Abimeleque tomou os machados na mão, cortou um feixe de ramos[a], levantou-o e o pôs sobre o ombro. Então disse ao povo que estava com ele: “O que vocês me viram fazer, apressem-se e façam como eu fiz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande ramagem”, “um emaranhado de galhos” ou “um feixe de gravetos”; o termo hebraico é raro e se refere a uma massa de ramos ou vegetação lenhosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: O verbo עלה indica subir ou ascender; “subiu” é natural e preserva o sentido direcional.
- source_word: הַר צַלְמוֹן
  choice: monte Zalmom
  rationale: Mantém o nome próprio por transliteração e verte הַר pela forma portuguesa corrente “monte”.
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: ele e todo o povo que estava com ele
  rationale: Preserva a ênfase do pronome e traduz עָם de modo amplo, sem especificar indevidamente soldados ou homens.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: tomou os machados nas mãos
  rationale: Mantém o plural morfológico “machados”; o plural idiomático “nas mãos” evita a estranheza de vários machados em uma só mão sem alterar a ação.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: cortou um feixe de ramos
  rationale: שׂוֹכַת é raro e parece indicar uma massa, ramagem ou conjunto de galhos; “feixe de ramos” se ajusta ao objeto portátil e preserva a incerteza em nota.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: levantou-o e o pôs sobre o ombro
  rationale: Reproduz a sequência de levantar o objeto e colocá-lo sobre o ombro em português claro.
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: O que vocês me viram fazer
  rationale: Expressa naturalmente a construção hebraica compacta e mantém o apelo ao exemplo observado.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: apressem-se e façam como eu fiz
  rationale: Conserva os imperativos plurais, a urgência e a ordem para imitar a ação recém-realizada.
