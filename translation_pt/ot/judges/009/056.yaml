  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: pt
  text: Assim, Deus retribuiu a Abimeleque o mal que ele havia feito a seu pai, matando seus setenta irmãos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez recair sobre Abimeleque o mal”. A expressão hebraica retrata Deus fazendo o mal praticado por ele voltar sobre ele próprio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Assim, Deus retribuiu
  rationale: O hifil de שׁוּב descreve Deus fazendo o mal praticado voltar sobre Abimeleque. “Retribuiu” comunica com naturalidade o sentido judicial, enquanto a nota preserva a imagem do hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o contexto e o verbo no singular indicam o Deus de Israel como agente do juízo.
- source_word: רָעַת
  choice: o mal
  rationale: Mantém a força moral de רָעָה neste contexto, que se refere ao ato perverso de Abimeleque, e não apenas ao dano resultante.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Forma portuguesa corrente do nome próprio bíblico.
- source_word: אֲשֶׁר עָשָׂה לְאָבִיו
  choice: que ele havia feito a seu pai
  rationale: A construção identifica o pai como a pessoa atingida pelo mal; o mais-que-perfeito composto situa naturalmente o ato antes da retribuição narrada.
- source_word: לַהֲרֹג
  choice: matando
  rationale: 'O gerúndio expressa o conteúdo ou modo do mal cometido: o assassinato dos irmãos.'
- source_word: שִׁבְעִים אֶחָיו
  choice: seus setenta irmãos
  rationale: Reproduz diretamente o número e a relação familiar centrais ao crime.
- source_word: וַ
  choice: Assim
  rationale: Neste resumo conclusivo, “Assim” expressa de modo idiomático a consequência narrativa, sem reduzir a conjunção a mera sequência temporal.
theological_decisions:
- issue: Agência divina no juízo
  choice: Deus retribuiu diretamente a Abimeleque pelo mal praticado.
  alternative: Deus apenas permitiu que o mal de Abimeleque recaísse sobre ele.
  rationale: A sintaxe hebraica apresenta Deus explicitamente como sujeito do verbo causativo. A tradução mantém essa agência judicial sem a atenuar.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Retribuiu” preserva o caráter judicial do enunciado; a nota registra a imagem concreta do idioma hebraico.
