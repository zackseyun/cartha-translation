base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: pt
  text: Saíram para o campo, colheram as uvas de suas vinhas e as pisaram. Depois fizeram uma festa[a], entraram no templo do seu deus[b], comeram, beberam e amaldiçoaram Abimeleque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “promoveram celebrações da colheita” ou “se alegraram”. O termo hebraico indica uma celebração festiva, provavelmente ligada à colheita das uvas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dos seus deuses”. A forma hebraica pode ser entendida como plural, embora aqui provavelmente tenha sentido singular e se refira à divindade cultuada naquele templo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: Saíram para o campo
  rationale: A terminação direcional de הַשָּׂדֶה indica movimento para o campo; a formulação é natural em português e mantém o contraste implícito com a cidade.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: colheram as uvas de suas vinhas
  rationale: בצר designa especificamente a colheita de uvas. A explicitação de “as uvas” torna claro o objeto da ação sem alterar o sentido.
- source_word: וַיִּדְרְכוּ
  choice: as pisaram
  rationale: Neste contexto, דרך se refere a pisar as uvas, provavelmente no lagar. O pronome retoma de modo natural as uvas mencionadas imediatamente antes.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: fizeram uma festa
  rationale: הִלּוּלִים indica uma celebração festiva ligada à vindima, possivelmente com regozijo. “Fizeram uma festa” comunica o sentido sem definir em excesso sua forma ritual.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: templo do seu deus
  rationale: Embora בֵּית signifique literalmente “casa”, “templo” expressa naturalmente em português o lugar de culto indicado pelo contexto. אֱלֹהֵיהֶם é entendido aqui no singular sem ocultar a possibilidade morfológica plural, registrada em nota.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: comeram, beberam
  rationale: A tradução direta preserva a sequência narrativa e não acrescenta a ideia de banquete, embora o contexto seja festivo.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: amaldiçoaram Abimeleque
  rationale: קלל no piel significa “amaldiçoar”, sentido mais forte e preciso que simplesmente insultar ou difamar.
theological_decisions:
- issue: Número de אֱלֹהֵיהֶם em contexto de culto pagão
  choice: seu deus
  alternative: seus deuses
  rationale: A forma pode ser lida morfologicamente como plural, mas o contexto provavelmente aponta para a divindade específica cultuada naquele templo. A alternativa permanece indicada em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível e boa legibilidade brasileira. “Abimeleque” segue a forma tradicional em português. A coordenação foi levemente segmentada para fluidez, sem alterar a ordem dos acontecimentos.
