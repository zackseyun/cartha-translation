  yaml_path: translation/ot/judges/009/022.yaml
  text: Abimelech ruled over Israel for three years.
translation:
  language: pt
  text: Abimeleque governou Israel durante três anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: governou
  rationale: O verbo שׂרר expressa o exercício de domínio ou governo. “Governou” é natural em português e preserva o sentido político sem atribuir a Abimeleque um título específico.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַל
  choice: Israel
  rationale: Com um verbo de governo, a preposição marca o âmbito ou objeto da autoridade. Em português, “governou Israel” transmite essa relação naturalmente, sem exigir a tradução isolada “sobre”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e padrão do nome nacional em português.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: durante três anos
  rationale: Expressão idiomática em português para indicar a duração contínua do governo.
theological_decisions:
- issue: Natureza e legitimidade do governo de Abimeleque
  choice: governou
  alternative: reinou sobre
  rationale: O hebraico usa שׂרר, e não o verbo habitual para “reinar”. “Governou” preserva essa distinção e evita sugerir uma legitimidade régia que o texto não afirma aqui.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção concisa acompanha a simplicidade do hebraico.
