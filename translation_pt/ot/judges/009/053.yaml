  yaml_path: translation/ot/judges/009/053.yaml
  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: pt
  text: Mas certa mulher lançou uma pedra superior de moinho sobre a cabeça de Abimeleque e esmagou-lhe o crânio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um pedaço da pedra superior de um moinho”; a expressão hebraica pode destacar uma parte ou um fragmento dessa pedra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: lançou
  rationale: O verbo שׁלך indica lançar ou arremessar; “lançou” preserva a ação deliberada e mantém um registro narrativo digno.
- source_word: אִשָּׁה אַחַת
  choice: certa mulher
  rationale: Embora literalmente seja “uma mulher”, a expressão funciona aqui como apresentação indefinida de uma personagem não identificada; “certa mulher” é natural em português e conserva esse valor.
- source_word: פֶּלַח רֶכֶב
  choice: uma pedra superior de moinho
  rationale: רֶכֶב designa especificamente a pedra superior do moinho. פֶּלַח pode indicar a peça ou uma parte dela; a tradução principal mantém a identificação específica, e a possível noção de fragmento aparece em nota.
- source_word: עַל רֹאשׁ
  choice: sobre a cabeça
  rationale: Reproduz de modo claro e natural a relação espacial expressa no hebraico.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: וַתָּרִץ
  choice: esmagou
  rationale: O verbo רצץ significa esmagar ou despedaçar; “esmagou” comunica com precisão a força e o resultado do golpe.
- source_word: גֻּלְגָּלְתּוֹ
  choice: lhe ... o crânio
  rationale: O substantivo designa especificamente o crânio, não apenas a cabeça. A construção com pronome dativo é idiomática em português.
