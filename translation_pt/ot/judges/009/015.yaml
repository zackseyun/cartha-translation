- from: 'Então o espinheiro disse às árvores: “Se é realmente para me ungirem rei sobre vocês, venham e abriguem-se à minha sombra[a]. Mas, se não, que saia fogo do espinheiro e consuma os cedros do Líbano[b]”.'
  to: 'Então o espinheiro disse às árvores: “Se vocês realmente me ungem como rei sobre vocês, venham, abriguem-se sob minha sombra[a]. Mas, se não, que saia fogo do espinheiro e consuma os cedros do Líbano[b].”'
  rationale: A revisão explicita o sujeito «vocês» e traduz a condição de sinceridade de modo mais próximo ao hebraico. Também substitui uma construção menos idiomática por «sob minha sombra». Mantêm-se a ambiguidade do imperfeito hebraico na segunda nota e todos os sentidos essenciais do versículo.
