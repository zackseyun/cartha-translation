base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: pt
  text: 'Então o espinheiro disse às árvores: “Se vocês realmente me ungem como rei sobre vocês, venham, abriguem-se sob minha sombra[a]. Mas, se não, que saia fogo do espinheiro e consuma os cedros do Líbano[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “busquem refúgio sob minha sombra”. A formulação pode ter força irônica, pois um espinheiro oferece pouca sombra e proteção.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sairá fogo do espinheiro”. A forma verbal hebraica pode expressar um desejo ou uma declaração do que acontecerá.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: o espinheiro
  rationale: O hebraico designa um arbusto espinhoso. “Espinheiro” é natural e amplamente compreensível em português, além de preservar o contraste irônico com as árvores nobres.
- source_word: אִם בֶּאֱמֶת
  choice: Se é realmente para
  rationale: Expressa a condição de sinceridade ou efetividade da ação, em formulação corrente no contexto do convite a fazê-lo rei.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: me ungirem rei
  rationale: Preserva o verbo político e régio específico משׁח, sem reduzi-lo a simples nomeação.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: No contexto régio, a preposição indica autoridade exercida sobre súditos.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: venham e abriguem-se à minha sombra
  rationale: Comunica o movimento de buscar refúgio ou proteção, mantendo a imagem da sombra e sua provável ironia, pois um arbusto espinhoso oferece pouca proteção.
- source_word: וְאִם אַיִן
  choice: Mas, se não
  rationale: Introduz com clareza o resultado contrário da condição.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: que saia fogo do espinheiro
  rationale: Mantém a possível força volitiva ou imprecatória do imperfeito hebraico, em vez de convertê-lo silenciosamente em futuro categórico.
- source_word: וְתֹאכַל
  choice: e consuma
  rationale: Com fogo como sujeito, o verbo אכל descreve de modo idiomático a destruição pelo fogo.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: os cedros do Líbano
  rationale: Expressão portuguesa consagrada e fiel à imagem dos majestosos cedros associados ao Líbano.
