  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: pt
  text: E Deus fez recair sobre a cabeça deles todo o mal que os homens de Siquém praticaram; e a maldição de Jotão, filho de Jerubaal, caiu sobre eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: fez recair
  rationale: 'No hifil de שוב, com o mal como objeto e «sobre a cabeça deles» como complemento, descreve retribuição: Deus faz o mal praticado voltar-se contra seus autores. «Fez recair» preserva a agência divina e combina naturalmente com a imagem hebraica.'
- source_word: רָעַת
  choice: mal
  rationale: Aqui רעה designa o mal moral praticado pelos homens de Siquém, mantendo também a lógica narrativa de suas consequências retributivas.
- source_word: בְּרֹאשָׁם
  choice: sobre a cabeça deles
  rationale: Conserva a imagem idiomática hebraica de as consequências recaírem sobre os próprios responsáveis.
- source_word: קִלֲלַת
  choice: a maldição
  rationale: Refere-se à maldição pronunciada anteriormente por Jotão; esta é a formulação mais natural e precisa em português.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: caiu sobre eles
  rationale: Expressa que a maldição os alcançou e se cumpriu, em linguagem natural de juízo, embora varie o verbo para evitar a repetição pesada de «recair».
- source_word: אַנְשֵׁי שְׁכֶם
  choice: os homens de Siquém
  rationale: Reproduz diretamente a expressão masculina do hebraico, sem ampliá-la para «povo» nem restringi-la a «líderes».
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O termo se refere aqui ao Deus de Israel e funciona como sujeito singular da ação judicial.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: Jotão, filho de Jerubaal
  rationale: Emprega as formas portuguesas correntes dos nomes bíblicos e conserva explicitamente a relação filial.
theological_decisions:
- issue: Linguagem de retribuição divina
  choice: Deus fez recair sobre os homens de Siquém o mal que praticaram.
  alternative: Deus permitiu que o mal deles recaísse sobre eles.
  rationale: Deus é o sujeito gramatical de הֵשִׁיב, de modo que o texto apresenta ação divina, não mera permissão. A tradução mantém essa agência e a tensão teológica do relato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura em duas orações conserva o paralelismo do hebraico; «sobre a cabeça deles» mantém sua imagem concreta sem exigir nota.
