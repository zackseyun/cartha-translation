base_translation:
  language: en
  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: pt
  text: Então Jotão fugiu, escapou e foi para Beer[a], e morou ali, longe de Abimeleque, seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Beera”. A forma hebraica do nome pode ser entendida como “Beer” com um ה direcional ou representada como “Beera”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: fugiu
  rationale: O verbo נוס descreve fuga diante de perigo; “fugiu” é natural e direto em português narrativo.
- source_word: וַיִּבְרַח
  choice: escapou
  rationale: O verbo ברח também indica fuga. “Fugiu, escapou” conserva a duplicação retórica dos verbos hebraicos sem repetir o mesmo termo.
- source_word: בְּאֵרָה
  choice: Beer
  rationale: Nome de lugar. “Beer” translitera a forma lexical בְּאֵר, enquanto o ה direcional final indica movimento para o lugar, não necessariamente parte do topônimo.
- source_word: וַיֵּשֶׁב שָׁם
  choice: Ficou morando ali
  rationale: ישׁב pode significar permanecer, habitar ou morar. A formulação comunica residência continuada em português atual.
- source_word: מִפְּנֵי
  choice: longe de
  rationale: A expressão indica afastamento da presença de Abimeleque. “Longe de” preserva a ideia espacial e evita explicitar como causa ou medo aquilo que o hebraico deixa implícito.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Mantém explicitamente o vínculo familiar, importante para a tensão narrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A coordenação verbal do hebraico foi preservada, mas a última oração foi separada em nova frase para maior naturalidade. “Jotão” e “Abimeleque” seguem formas portuguesas tradicionais e amplamente reconhecíveis.
