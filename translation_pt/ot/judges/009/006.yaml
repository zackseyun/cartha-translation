base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: pt
  text: Então todos os líderes de Siquém e todos os homens de Bete-Milo[a] se reuniram. Eles foram e fizeram Abimeleque rei junto ao carvalho do marco erguido[b] que havia em Siquém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bete-Milo talvez signifique “casa de Milo”, mas aqui a expressão provavelmente funciona como nome de um lugar ou grupo.
    reason: cultural_note
  - marker: b
    text: Ou “junto ao carvalho do pilar” ou “junto ao carvalho da pedra erguida”. A expressão hebraica é difícil, e o sentido exato de מֻצָּב é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: líderes de Siquém
  rationale: Embora בַּעֲלֵי signifique literalmente “senhores” ou “proprietários”, no contexto político da cidade designa seus homens de poder; “líderes” comunica isso com naturalidade sem sugerir um sistema feudal.
- source_word: בֵּית מִלּוֹא
  choice: Bete-Milo
  rationale: A expressão funciona provavelmente como nome de lugar ou grupo. A transliteração preserva a incerteza quanto ao referente, em vez de interpretá-la como uma casa ou família comum.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: fizeram Abimeleque rei
  rationale: O hifil de מלך expressa fazer alguém reinar ou constituí-lo rei; “fizeram ... rei” evita acrescentar uma coroação ou proclamação não explicitada.
- source_word: עִם
  choice: junto a
  rationale: Neste uso com um ponto de referência local, indica proximidade; “junto a” é natural e preserva o valor espacial.
- source_word: אֵלוֹן
  choice: carvalho
  rationale: אֵלוֹן designa uma árvore grande, tradicionalmente entendida como carvalho ou terebinto. “Carvalho” é uma opção convencional e legível, sem pretender determinar com certeza a espécie.
- source_word: מֻצָּב
  choice: marco erguido
  rationale: A forma deriva de נצב e sugere algo colocado ou erguido. “Marco erguido” preserva essa ideia sem decidir indevidamente entre coluna, pedra memorial ou outra estrutura.
- source_word: וַיֵּאָסְפוּ
  choice: se reuniram
  rationale: Tradução corrente e direta do ato coletivo de reunir-se ou congregar-se.
