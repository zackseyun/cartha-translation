  register: Português moderno, digno e amplamente compreensível, com formas onomásticas correntes em português. A divisão em duas frases melhora a fluidez narrativa sem alterar a sequência do hebraico; as notas preservam as incertezas de Bete-Milo e de מֻצָּב.
