  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו זְבֻ֗ל אַיֵּ֨ה אֵפ֥וֹא פִ֨י/ךָ֙ אֲשֶׁ֣ר תֹּאמַ֔ר מִ֥י אֲבִימֶ֖לֶךְ כִּ֣י נַעַבְדֶ֑/נּוּ הֲ/לֹ֨א זֶ֤ה הָ/עָם֙ אֲשֶׁ֣ר מָאַ֣סְתָּה בּ֔/וֹ צֵא נָ֥א עַתָּ֖ה וְ/הִלָּ֥חֶם בּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: pt
  text: 'Então Zebul lhe disse: “Onde está agora a sua boca?[a] Você dizia: ‘Quem é Abimeleque, para que o sirvamos?’ Não é este o povo que você desprezou? Saia agora e lute contra ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “Onde está agora a sua boca?” — uma forma de zombar da fala arrogante anterior de Gaal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: Onde está agora a sua boca?
  rationale: Preserva a imagem concreta e zombeteira do hebraico. Embora incomum em português, a expressão é inteligível no contexto, e a nota esclarece que se refere à fala arrogante anterior.
- source_word: אֲשֶׁר תֹּאמַר
  choice: Você dizia
  rationale: Retoma diretamente a declaração anterior de Gaal e soa mais natural em português do que uma construção relativa rígida como “você que dizia” após a pergunta precedente.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: Quem é Abimeleque, para que o sirvamos?
  rationale: Mantém a pergunta retórica e o tom desdenhoso. “Para que o sirvamos” expressa naturalmente a recusa implícita em reconhecer sua autoridade.
- source_word: הֲלֹא זֶה הָעָם
  choice: Não é este o povo
  rationale: Conserva a forma interrogativa e confrontadora do hebraico, sem convertê-la em afirmação explícita.
- source_word: מָאַסְתָּה בּוֹ
  choice: que você desprezou
  rationale: “Desprezou” comunica tanto rejeição quanto desdém e se ajusta à provocação de Zebul.
- source_word: צֵא נָא עַתָּה
  choice: Saia agora
  rationale: O imperativo transmite a ordem de sair para o combate; נָא tem aqui força de incitação, não de pedido cortês, e por isso não foi traduzido como “por favor”.
- source_word: וְהִלָּחֶם בּוֹ
  choice: e lute contra ele
  rationale: O pronome hebraico está no singular e retoma o coletivo “povo”. O português também permite essa concordância sem precisar substituir o referente por “eles”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala direta mantém o tom provocador de Zebul; a imagem hebraica incomum de “boca” foi preservada e explicada em nota.
