  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֧ד מִ/צָּרְעָ֛ה מִ/מִּשְׁפַּ֥חַת הַ/דָּנִ֖י וּ/שְׁמ֣/וֹ מָנ֑וֹחַ וְ/אִשְׁתּ֥/וֹ עֲקָרָ֖ה וְ/לֹ֥א יָלָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: pt
  text: Havia um homem de Zorá, do clã dos danitas, chamado Manoá. Sua mulher era estéril e não tinha dado à luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Havia
  rationale: Introduz naturalmente uma nova cena narrativa em português, sem acrescentar um advérbio temporal ausente do hebraico.
- source_word: אִישׁ אֶחָד
  choice: um homem
  rationale: Em português, o artigo indefinido apresenta adequadamente a personagem ainda não nomeada; “certo homem” seria possível, mas soa menos natural neste contexto.
- source_word: מִצָּרְעָה
  choice: de Zorá
  rationale: A preposição marca procedência ou vínculo local; “de Zorá” é a forma mais natural em português.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: do clã dos danitas
  rationale: מִשְׁפָּחָה designa aqui um grupo de parentesco dentro da estrutura tribal, por isso “clã” é mais preciso que “tribo”.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: chamado Manoá
  rationale: Expressa com naturalidade em português a fórmula hebraica de nomeação, sem perder seu conteúdo.
- source_word: וְאִשְׁתּוֹ
  choice: Sua mulher
  rationale: Mantém a relação possessiva e inicia com clareza uma nova frase em português.
- source_word: עֲקָרָה
  choice: era estéril
  rationale: É a tradução concisa, corrente e literariamente apropriada para a incapacidade de gerar indicada no contexto.
- source_word: וְלֹא יָלָדָה
  choice: e nunca tinha dado à luz
  rationale: O verbo com sujeito feminino significa dar à luz. “Nunca” comunica de modo idiomático a negação da experiência anterior, sem acrescentar um objeto singular ou plural que o hebraico não explicita.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A repetição coordenativa do hebraico foi levemente ajustada, e a fórmula nominal foi vertida de modo idiomático. O marcador [a] está colocado após a oração a que a nota se refere.
