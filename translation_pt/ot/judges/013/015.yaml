  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: pt
  text: 'Então Manoá disse ao anjo do SENHOR: “Por favor, deixe-nos retê-lo, e prepararemos um cabrito para você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anjo do SENHOR
  rationale: Traduz מַלְאַךְ de modo direto e representa o nome divino segundo a convenção editorial reverente em maiúsculas.
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: Por favor, deixe-nos retê-lo
  rationale: Preserva o sentido volitivo da forma cohortativa e a partícula cortês נָא; “retê-lo” comunica a ideia de fazer o visitante permanecer por mais algum tempo.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: enquanto preparamos ... para você
  rationale: Em português natural, expressa a finalidade prática do pedido; לְפָנֶיךָ indica que o alimento seria preparado e posto diante do visitante, isto é, para ele.
- source_word: גְּדִי עִזִּים
  choice: um cabrito
  rationale: Expressão hebraica que designa um filhote de cabra; “cabrito” é preciso e idiomático.
theological_decisions:
- issue: Identidade e designação do mensageiro divino
  choice: anjo do SENHOR
  alternative: anjo de Yahweh
  rationale: Mantém a designação do texto sem definir além dela a identidade do mensageiro; a representação do tetragrama como SENHOR segue uma convenção portuguesa amplamente reconhecida.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe natural. A sequência coordenada hebraica foi vertida com “enquanto” para esclarecer que o propósito de deter o visitante era preparar-lhe o cabrito, sem acrescentar interpretação teológica.
