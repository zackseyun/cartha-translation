  text: וַ/יֹּ֣אמֶר לִ֔/י הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/עַתָּ֞ה אַל תִּשְׁתִּ֣י יַ֣יִן וְ/שֵׁכָ֗ר וְ/אַל תֹּֽאכְלִי֙ כָּל טֻמְאָ֔ה כִּֽי נְזִ֤יר אֱלֹהִים֙ יִהְיֶ֣ה הַ/נַּ֔עַר מִן הַ/בֶּ֖טֶן עַד י֥וֹם מוֹתֽ/וֹ־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: pt
  text: 'Ele me disse: “Veja: você ficará grávida e dará à luz um filho.[a] Portanto, não beba vinho nem bebida embriagante e não coma nada impuro, pois o menino será nazireu de Deus[b] desde o ventre materno até o dia de sua morte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em termos mais literais, o hebraico diz: “Veja, você está grávida e dará à luz um filho”; o contexto também permite entender o anúncio em sentido futuro.'
    reason: lexical_alternative
  - marker: b
    text: “Nazireu” é o termo técnico para alguém especialmente consagrado a Deus.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Ele me disse
  rationale: Traduz diretamente o verbo e o objeto indireto. O waw narrativo não exige uma conjunção explícita em português, e a frase continua naturalmente o relato da mulher.
- source_word: הִנָּךְ הָרָה
  choice: 'Veja: você ficará grávida'
  rationale: הִנֵּה é representado por “Veja”, enquanto o futuro comunica a força preditiva indicada pelo contexto. A forma mais literal, “você está grávida”, é preservada em nota por ser linguisticamente possível.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: e dará à luz um filho
  rationale: Expressão portuguesa corrente e precisa para o nascimento anunciado, preservando a especificação masculina de בֵּן.
- source_word: וְעַתָּה
  choice: Portanto
  rationale: Marca de modo natural a passagem do anúncio para a instrução decorrente, sem reproduzir mecanicamente “e agora”.
- source_word: אַל־תִּשְׁתִּי יַיִן וְשֵׁכָר
  choice: não beba vinho nem bebida embriagante
  rationale: “Bebida embriagante” abrange bebida alcoólica diferente do vinho sem sugerir especificamente destilados modernos; “nem” é idiomático após a negação.
- source_word: וְאַל־תֹּאכְלִי כָּל־טֻמְאָה
  choice: e não coma nada impuro
  rationale: Conserva a linguagem ritual de pureza e, no contexto do verbo “comer”, deixa clara a referência alimentar.
- source_word: נְזִיר אֱלֹהִים
  choice: nazireu de Deus
  rationale: Mantém o termo técnico para uma pessoa especialmente consagrada e preserva a relação genitiva do hebraico sem reduzi-la a uma ideia genérica de santidade.
- source_word: הַנַּעַר
  choice: o menino
  rationale: Adequado ao anúncio do nascimento de um filho e mais específico que “a criança”.
- source_word: מִן־הַבֶּטֶן
  choice: desde o ventre materno
  rationale: Preserva a imagem e o ponto inicial expressos no hebraico, com clareza idiomática em português.
- source_word: עַד יוֹם מוֹתוֹ
  choice: até o dia de sua morte
  rationale: Reprodução direta da delimitação temporal, sem a generalização interpretativa “por toda a vida”.
theological_decisions:
- issue: Designação do menino como נְזִיר אֱלֹהִים
  choice: nazireu de Deus
  alternative: consagrado a Deus
  rationale: O hebraico emprega o termo técnico נָזִיר. “Nazireu” preserva seu contexto legal e cultual, enquanto “consagrado” seria mais genérico e apagaria essa especificidade.
- issue: Valor temporal de הִנָּךְ הָרָה
  choice: você ficará grávida
  alternative: você está grávida
  rationale: Embora הָרָה possa ser lido formalmente como “grávida”, o contexto narrativo apresenta um anúncio cujo cumprimento é futuro. A tradução principal comunica essa força contextual, e a nota mantém a forma literal e a ambiguidade.
- issue: Duração da condição de nazireu
  choice: desde o ventre materno até o dia de sua morte
  alternative: por toda a vida
  rationale: A formulação concreta do hebraico é mantida, inclusive a ideia de que a condição remonta ao ventre, sem a simplificação interpretativa “por toda a vida”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitam-se formas arcaicas como “eis” e termos que poderiam sugerir indevidamente bebidas destiladas modernas. As notas preservam a formulação literal e explicam o termo técnico sem impor uma interpretação denominacional.
