  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: pt
  text: Então Manoá pegou o cabrito e a oferta de cereais e os ofereceu sobre a rocha a Yahweh. E ele fez algo extraordinário[a], enquanto Manoá e sua mulher observavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico não repete expressamente o sujeito. Pelo contexto, «ele» se refere ao mensageiro de Yahweh. Outra tradução possível: «E o mensageiro de Yahweh fez algo extraordinário».'
    reason: Leitura alternativa decorrente do sujeito implícito na construção hebraica.
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: o cabrito
  rationale: Forma natural em português para um bode jovem, adequada ao contexto sacrificial.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto cultual, מִנְחָה designa com frequência uma oferta de cereais; a expressão esclarece o tipo de oferta sem perder o sentido sacrificial.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: os ofereceu sobre a rocha a Yahweh
  rationale: עלה tem aqui sentido sacrificial, isto é, oferecer. O pronome plural retoma naturalmente o cabrito e a oferta de cereal; o nome divino יהוה é transliterado como Yahweh.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: E ele fez algo extraordinário
  rationale: A formulação comunica o sentido de realizar algo prodigioso e mantém o sujeito apenas como pronome, refletindo a construção hebraica comprimida sem explicitar além do texto.
- source_word: רֹאִים
  choice: observavam
  rationale: O particípio indica ação em curso; o imperfeito português expressa que Manoá e sua mulher acompanhavam o acontecimento.
theological_decisions:
- issue: Sujeito implícito de וּמַפְלִא לַעֲשׂוֹת
  choice: Manter o pronome «ele» sem identificar expressamente seu referente.
  alternative: «E o mensageiro de Yahweh fez algo extraordinário.»
  rationale: O contexto aponta para o mensageiro de Yahweh como agente, mas a oração hebraica não repete o sujeito. O pronome preserva tanto o fluxo narrativo quanto a elipse e a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível no Brasil e compreensível internacionalmente. «Algo extraordinário» evita o sentido cotidiano de «maravilhoso» como apenas agradável e preserva o caráter prodigioso da ação.
