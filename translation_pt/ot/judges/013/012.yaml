  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: pt
  text: 'Então Manoá disse: “Agora, que se cumpram as tuas palavras.[a] Qual será a norma para o menino e para a sua atividade?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando se cumprirem as tuas palavras”. A frase hebraica pode ser entendida como um desejo — “que se cumpram” — ou como uma suposição temporal — “quando se cumprirem”.'
    reason: alternative_reading
  - marker: b
    text: 'A pergunta também pode ser traduzida: “Qual será o modo de vida do menino e o que ele fará?” O hebraico permite entender מִשְׁפָּט como “norma”, “costume” ou “modo de vida”, e diz literalmente “e a sua obra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa esse avanço de modo natural em português.
- source_word: מָנוֹחַ
  choice: Manoá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a resposta imediata e a expectativa de Manoá.
- source_word: יָבֹא דְבָרֶיךָ
  choice: que se cumpram as tuas palavras
  rationale: Expressa naturalmente o sentido idiomático literal de as palavras “virem” ou se realizarem, preservando a leitura volitiva.
- source_word: מַה יִּהְיֶה
  choice: Qual será
  rationale: Introduz de modo direto a pergunta sobre a prescrição e a atividade futuras do menino.
- source_word: מִשְׁפַּט
  choice: a norma
  rationale: Aqui designa uma regra, prescrição ou modo estabelecido aplicável ao menino; “norma” mantém a dimensão reguladora sem restringi-la a uma sentença judicial.
- source_word: הַנַּעַר
  choice: o menino
  rationale: Preserva a referência masculina ao filho anunciado, embora ele ainda não tenha nascido.
- source_word: וּמַעֲשֵׂהוּ
  choice: e qual será a sua tarefa
  rationale: מַעֲשֶׂה pode indicar obra, atividade ou feito. “Tarefa” é natural no contexto daquilo que o menino deverá realizar, enquanto a nota conserva alternativas menos interpretativas.
theological_decisions: []
