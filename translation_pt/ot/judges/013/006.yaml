base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: pt
  text: 'Então a mulher foi dizer ao marido: “Um homem de Deus veio até mim. Sua aparência era como a do anjo de Deus[a], muito temível[b]. Não lhe perguntei de onde ele era, e ele não me disse seu nome.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de um anjo de Deus”. A palavra hebraica também pode significar “mensageiro”.'
    reason: alternative_reading
  - marker: b
    text: Também pode ser traduzido por “inspirava profundo temor” ou “era assombroso”. O termo hebraico reúne as ideias de temor e reverência intensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Mantém a designação narrativa hebraica da personagem já conhecida no contexto, sem substituir antecipadamente por “a esposa”.
- source_word: לְאִישָׁהּ
  choice: ao marido
  rationale: Neste contexto conjugal, אִישׁ com o sufixo feminino significa naturalmente “marido”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: um homem de Deus
  rationale: Preserva o título hebraico tradicional e a apresentação inicialmente indefinida da figura.
- source_word: בָּא אֵלַי
  choice: veio até mim
  rationale: Equivalente direto e idiomático da ação e de seu destinatário.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: Sua aparência era como a de
  rationale: Conserva a comparação explícita, evitando em português a repetição pesada de “aparência” sem perder o sentido.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: um anjo de Deus
  rationale: “Anjo” comunica adequadamente o mensageiro sobrenatural neste contexto. O artigo em אֱלֹהִים torna possível entender a construção como definida, mas o indefinido em português preserva a perspectiva ainda não plenamente identificadora da mulher; a alternativa definida é registrada em nota.
- source_word: נוֹרָא מְאֹד
  choice: muito temível
  rationale: Expressa uma aparência que inspira intenso temor e reverência, sem o sentido coloquial moderno que “impressionante” poderia assumir.
- source_word: אֵי מִזֶּה הוּא
  choice: de onde ele era
  rationale: Reproduz de modo natural a pergunta hebraica sobre procedência ou origem.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: e ele não me disse seu nome
  rationale: Formulação portuguesa corrente que conserva toda a informação do hebraico.
theological_decisions:
- issue: Identificação de מַלְאַךְ הָאֱלֹהִים no desenvolvimento narrativo
  choice: um anjo de Deus
  alternative: o anjo de Deus; um mensageiro de Deus
  rationale: A tradução não antecipa plenamente a identificação posterior da figura nem elimina o sentido básico de “mensageiro”. A nota conserva a possível leitura definida da construção hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O redundante לֵאמֹר foi incorporado aos dois-pontos, segundo o uso natural do português. Mantiveram-se a perspectiva limitada da mulher e a tensão narrativa quanto à identidade do visitante.
