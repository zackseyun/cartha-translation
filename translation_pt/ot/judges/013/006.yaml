  - severity: low
    issue: Nota a apresenta a leitura definida como alternativa
    rationale: Uma vez restaurada a definição refletida pelo hebraico, a nota precisa indicar «um anjo de Deus» como alternativa possível de leitura/tradução e explicar, de modo sucinto, o valor de mensageiro de מַלְאָךְ.
