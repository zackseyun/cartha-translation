base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: pt
  text: 'E o anjo de Yahweh[a] disse a Manoá: “A mulher deve observar cuidadosamente tudo o que lhe disse.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mensageiro de Yahweh”. A palavra hebraica pode significar tanto “anjo” como “mensageiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém o encadeamento narrativo do waw consecutivo de modo natural em português.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro humano ou celestial; neste relato, “anjo” é a leitura contextual mais natural, enquanto a alternativa lexical é preservada em nota. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: אֶל מָנוֹחַ
  choice: a Manoá
  rationale: Forma portuguesa tradicional e clara do nome próprio, com a preposição exigida por “disse”.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: com tudo o que eu lhe disse
  rationale: A construção indica o âmbito da cautela. “Com tudo o que” conserva em português a amplitude da expressão sem especificar além do texto se a cautela consiste em obedecer ou abster-se.
- source_word: תִּשָּׁמֵר
  choice: deve ter cuidado
  rationale: O nifal de שׁמר expressa guardar-se ou manter-se atenta. A formulação é atual, digna e preserva a nuance de cautela sem acrescentar explicitamente “fazer” ou “abster-se”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de מַלְאַךְ em מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: O contexto aponta para um mensageiro celestial, mas a amplitude lexical de מַלְאַךְ é mantida em nota, sem definir além do texto a identidade teológica da figura.
- issue: Força de תִּשָּׁמֵר com מִכֹּל
  choice: deve ter cuidado com tudo
  alternative: deve abster-se de tudo; deve ter o cuidado de fazer tudo
  rationale: A formulação escolhida preserva a tensão entre guardar-se das coisas proibidas e observar cuidadosamente as instruções, evitando resolver implicitamente a construção em apenas uma dessas direções.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Manoá” segue a forma portuguesa consagrada. A fala mantém tom direto e digno, sem explicitar uma ação (“fazer” ou “abster-se”) que o hebraico deixa dependente do contexto.
