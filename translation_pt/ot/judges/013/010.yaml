base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: pt
  text: 'A mulher se apressou, correu e contou ao marido. Disse-lhe: “Olhe! O homem que veio até mim naquele dia[a] apareceu para mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que veio até mim outro dia”. A expressão hebraica é literalmente “que veio até mim no dia” e remete à visita anterior.'
    reason: Registra a forma literal incomum e a alternativa idiomática como uma oração completa, sem eliminar a referência contextual.
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: se apressou
  rationale: Expressa diretamente a ideia de agir com pressa, em linguagem atual e digna.
- source_word: וַתָּרָץ
  choice: correu
  rationale: Preserva o sentido físico de רוץ e mantém separado o segundo verbo, reforçando a urgência da mulher.
- source_word: וַתַּגֵּד
  choice: contou
  rationale: Representa naturalmente o hifil de נגד, “contar, informar”, no registro narrativo.
- source_word: לְאִישָׁהּ
  choice: ao marido
  rationale: Embora אִישׁ também possa significar “homem”, o substantivo com sufixo feminino singular neste contexto doméstico significa idiomaticamente “marido”.
- source_word: הִנֵּה
  choice: Olhe!
  rationale: Partícula que chama a atenção do ouvinte; “Olhe!” conserva a vivacidade da fala sem recorrer ao arcaísmo “Eis”.
- source_word: נִרְאָה אֵלַי
  choice: apareceu para mim
  rationale: O nifal de ראה tem aqui sentido de “aparecer”. A formulação preserva a perspectiva da mulher e a relação expressa por אֵלַי.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Retoma a figura encontrada anteriormente sem antecipar sua identificação mais plena no contexto.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: que veio até mim naquele dia
  rationale: A expressão hebraica é literalmente “que veio até mim no dia” e remete à visita anterior. “Naquele dia” é natural em português e conserva essa referência retrospectiva.
theological_decisions:
- issue: Identidade de הָאִישׁ na fala da mulher
  choice: o homem
  alternative: o anjo; o mensageiro de Deus
  rationale: Embora o contexto mais amplo identifique a figura como o anjo do SENHOR, neste versículo a mulher se refere a ele simplesmente como “o homem”. A tradução preserva sua perspectiva imediata sem inserir uma identificação teológica mais explícita.
translation_notes:
  register: Português moderno, claro e narrativo, com boa legibilidade brasileira e compreensão internacional. Os dois verbos de movimento foram mantidos para reproduzir a urgência enfática do hebraico. A repetição “para mim” preserva a estrutura e a perspectiva da fala original.
