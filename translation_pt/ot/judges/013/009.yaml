  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: pt
  text: E Deus deu ouvidos à voz de Manoá, e o anjo de Deus veio novamente à mulher enquanto ela estava sentada no campo; Manoá, seu marido, não estava com ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: atendeu
  rationale: Neste contexto, שׁמע indica que Deus não apenas ouviu, mas acolheu e respondeu favoravelmente à oração de Manoá no versículo anterior. “Atendeu” comunica essa resposta sem precisar acrescentar “pedido” ou “oração” ao texto.
- source_word: בְּקוֹל מָנוֹחַ
  choice: à voz de Manoá
  rationale: Preserva a expressão hebraica שׁמע בקול, mantendo “voz” de modo compreensível em português, ao mesmo tempo que o verbo “atendeu” esclarece seu sentido contextual.
- source_word: מָנוֹחַ
  choice: Manoá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: o anjo de Deus
  rationale: Embora מַלְאָךְ possa significar “mensageiro”, o contexto apresenta um mensageiro sobrenatural; “anjo de Deus” é natural, preciso e corrente em português.
- source_word: עוֹד
  choice: novamente
  rationale: Indica a repetição da visita do anjo e soa dignificado e natural no registro narrativo.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Reproduz a designação usada pelo texto, sem substituí-la interpretativamente por “esposa”.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: quando ela estava sentada
  rationale: Expressa naturalmente a ação circunstancial de fundo indicada pelo particípio hebraico.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução direta e idiomática da expressão locativa.
- source_word: אִישָׁהּ
  choice: seu marido
  rationale: Neste contexto conjugal, אִישׁ com o sufixo feminino significa idiomaticamente “marido”.
- source_word: אֵין עִמָּהּ
  choice: não estava com ela
  rationale: Reproduz de forma direta e natural a ausência de Manoá junto à mulher.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים
  choice: Deus
  alternative: os deuses
  rationale: Apesar da forma morfologicamente plural, o substantivo designa aqui o Deus de Israel e ocorre com verbo no singular; “Deus” é exigido pela sintaxe e pelo contexto imediato.
- issue: Força responsiva de וַיִּשְׁמַע
  choice: atendeu
  alternative: ouviu
  rationale: A chegada do anjo constitui a resposta ao pedido de Manoá no versículo anterior. “Atendeu” torna visível essa força contextual sem introduzir uma explicação teológica alheia ao texto.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A primeira oração preserva a imagem hebraica “voz de Manoá”, enquanto “atendeu” transmite a resposta favorável implicada pelo contexto. “Mas” explicita o contraste pragmático da última oração, embora o hebraico use a conjunção comum וּ; nenhuma nota é necessária.
