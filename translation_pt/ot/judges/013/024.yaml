  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: pt
  text: A mulher deu à luz um filho e lhe deu o nome de Sansão. O menino cresceu, e Yahweh o abençoou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: O qal de ילד é o verbo comum para o parto; esta é a expressão natural e precisa em português.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Mantém a designação explícita do hebraico, que retoma a mulher de Manoá sem acrescentar 'esposa' neste versículo.
- source_word: בֵּן
  choice: um filho
  rationale: Em contexto de nascimento, בן designa naturalmente um filho do sexo masculino.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Reproduz com naturalidade em português a fórmula hebraica de nomeação, literalmente 'chamou o nome dele'.
- source_word: שִׁמְשׁוֹן
  choice: Sansão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיִּגְדַּל
  choice: cresceu
  rationale: Neste contexto, גדל descreve o desenvolvimento do menino, sem implicar necessariamente grandeza ou prestígio.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נער tem amplitude semântica, mas 'menino' se ajusta ao contexto imediatamente posterior ao nascimento.
- source_word: וַיְבָרְכֵהוּ
  choice: o abençoou
  rationale: Preserva o sentido teológico normal de ברך e seu objeto pronominal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal e evita substituí-lo pelo título 'Senhor'.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação narrativa hebraica foi preservada sem rigidez excessiva; não foram necessárias notas de rodapé.
