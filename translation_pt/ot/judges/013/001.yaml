language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: pt
  text: Os filhos de Israel[a] tornaram a fazer o que era mau aos olhos de Yahweh, e Yahweh os entregou nas mãos dos filisteus[b] por quarenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Em hebraico, “os filhos de Israel” é uma designação coletiva do povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na mão dos filisteus”, expressão que significa sob o poder deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: tornaram a fazer
  rationale: A construção de יסף com infinitivo indica repetição ou continuação. No ciclo recorrente de Juízes, “tornaram a fazer” expressa naturalmente que Israel repetiu o mal anterior.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar do hebraico, que funciona aqui como designação coletiva de todo o povo de Israel, e não apenas dos homens.
- source_word: לַעֲשׂוֹת הָרַע
  choice: fazer o que era mau
  rationale: Expressão natural em português que comunica a avaliação qualitativa contida no idioma hebraico.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica transparente, indicando aquilo que Yahweh considera mau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּתְּנֵם
  choice: os entregou
  rationale: No contexto da expressão “na mão de”, נתן comunica que Yahweh os colocou sob o poder dos filisteus; “entregou” torna esse sentido claro sem ampliar a afirmação.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: nas mãos dos filisteus
  rationale: A locução portuguesa “entregar nas mãos de” preserva a imagem hebraica e comunica naturalmente sujeição ao poder alheio. O hebraico emprega “mão” no singular coletivo.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma consagrada em português para esse povo.
- source_word: אַרְבָּעִים שָׁנָה
  choice: por quarenta anos
  rationale: A preposição “por” explicita de modo natural em português a duração indicada pela expressão hebraica.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Alcance coletivo de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A formulação literal conserva a imagem de descendência presente no hebraico, enquanto a nota esclarece que a expressão designa corporativamente o povo inteiro.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição narrativa foi expressa por “tornaram a fazer”; a metáfora de avaliação foi mantida em “aos olhos de”, e a imagem da mão foi preservada numa locução idiomática portuguesa.
