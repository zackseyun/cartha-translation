  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: pt
  text: 'O anjo de Yahweh disse a Manoá: “Se você me retiver, não comerei da sua comida.[a] Mas, se você preparar um holocausto,[b] ofereça-o a Yahweh.” Pois Manoá não sabia que ele era o anjo de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “não comerei do seu pão”. Aqui, “pão” provavelmente significa comida ou refeição em geral.
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “se fizer um holocausto, você deverá oferecê-lo a Yahweh”. O hebraico usa um verbo para fazer ou preparar a oferta e outro para oferecê-la.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”; neste relato, trata-se de um enviado sobrenatural, por isso “anjo” é a opção mais adequada. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: תַּעְצְרֵנִי
  choice: se você me retiver
  rationale: O verbo עצר pode significar deter, reter ou impedir alguém de partir. “Reter” conserva o sentido do hebraico e se ajusta ao pedido de Manoá para que o visitante permanecesse.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: não comerei da sua comida
  rationale: לֶחֶם significa literalmente “pão”, mas também pode designar comida ou refeição em geral. O contexto aponta para a refeição que Manoá pretendia preparar.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: se preparar um holocausto
  rationale: עשה, quando usado com uma oferta sacrificial, pode indicar fazê-la ou prepará-la. “Preparar” distingue essa ação do verbo seguinte, que expressa o ato de oferecê-la.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo tradicional e conciso para a oferta inteiramente queimada, cuja fumaça sobe. A nota ajuda a preservar a distinção entre preparar e oferecer o sacrifício.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: ofereça-o a Yahweh
  rationale: A forma causativa de עלה, com עֹלָה, refere-se a fazer a oferta subir, isto é, oferecê-la sacrificialmente. O pronome “-o” representa o sufixo que retoma o holocausto.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: Manoá não sabia
  rationale: כִּי introduz aqui a explicação narrativa para a conduta de Manoá. Em português, uma frase independente transmite essa relação com naturalidade, sem precisar explicitar “pois”.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: que ele era o anjo de Yahweh
  rationale: A oração explica que Manoá ainda não havia reconhecido a identidade sobrenatural do visitante, preservando a referência pessoal do pronome הוּא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “Senhor”.
- issue: Identidade do visitante
  choice: “o anjo de Yahweh”, sem identificação teológica adicional
  alternative: “um mensageiro de Yahweh” ou uma identificação explícita com o próprio Yahweh
  rationale: O contexto apresenta um ser sobrenatural e o narrador o chama de מַלְאַךְ יְהוָה. A tradução mantém essa formulação sem resolver além do texto a tensão entre o mensageiro e quem o enviou.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna a fala direta natural sem perder o respeito; “reter” conserva o sentido verbal do hebraico. As notas registram o sentido literal de “pão” e a distinção entre preparar e oferecer o holocausto.
