  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֛קָם וַ/יֵּ֥לֶךְ מָנ֖וֹחַ אַחֲרֵ֣י אִשְׁתּ֑/וֹ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וַ/יֹּ֣אמֶר ל֗/וֹ הַ/אַתָּ֥ה הָ/אִ֛ישׁ אֲשֶׁר דִּבַּ֥רְתָּ אֶל הָ/אִשָּׁ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: pt
  text: 'Então Manoá se levantou, seguiu sua mulher[a] e foi até o homem. Ele lhe perguntou: “É você o homem que falou com a mulher[b]?” Ele respondeu: “Sou eu.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “foi atrás de sua mulher”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “a mulher”, e não “minha mulher”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Eu sou ele”. O hebraico traz apenas “eu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal narrativo de קום indica que Manoá se pôs de pé ou iniciou a ação; “se levantou” conserva com naturalidade a cadência narrativa.
- source_word: וַיֵּלֶךְ מָנוֹחַ אַחֲרֵי אִשְׁתּוֹ
  choice: Manoá ... seguiu sua mulher
  rationale: הלך é o verbo comum de movimento, enquanto אַחֲרֵי significa literalmente “atrás de”. Em português, “seguiu sua mulher” expressa naturalmente que Manoá foi atrás dela sem especificar indevidamente o modo do deslocamento.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: foi até o homem
  rationale: Embora בוא possa corresponder a “vir” ou “chegar”, nesta perspectiva narrativa “foi até o homem” é português mais natural e mantém אִישׁ como “homem”.
- source_word: הַאַתָּה הָאִישׁ
  choice: É você o homem
  rationale: A partícula interrogativa com o pronome introduz uma pergunta direta de identificação; esta formulação é clara e atual.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: que falou com a mulher
  rationale: A oração relativa é vertida diretamente. Em português, “falar com” é a construção idiomática normal mesmo quando o hebraico usa אֶל; “a mulher” preserva o substantivo definido do texto.
- source_word: אָנִי
  choice: Sou eu
  rationale: A resposta hebraica é literalmente “eu”, uma frase nominal de autoidentificação. “Sou eu” transmite a afirmação de modo natural, sem lhe atribuir peso teológico adicional.
theological_decisions:
- issue: Identidade do visitante
  choice: “o homem”
  alternative: “o anjo” ou “o mensageiro”
  rationale: Embora o contexto mais amplo revele tratar-se do anjo do SENHOR, este versículo usa הָאִישׁ, “o homem”. A tradução mantém a perspectiva narrativa local e não antecipa a identificação posterior.
- issue: Possível ressonância de “Sou eu”
  choice: Tratar como resposta comum de autoidentificação
  alternative: Formular a resposta de modo que sugira o nome divino
  rationale: אָנִי significa simplesmente “eu” neste contexto. A tradução evita criar uma alusão teológica que a forma hebraica não exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência de verbos foi levemente ajustada para evitar repetição pesada, mantendo todas as ações do hebraico. Os marcadores aparecem junto aos termos a que se referem.
