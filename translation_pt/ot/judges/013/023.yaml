base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: pt
  text: 'Mas sua mulher lhe disse: “Se o SENHOR tivesse a intenção de nos matar, não teria aceitado de nossas mãos o holocausto e a oferta de cereal, nem nos teria mostrado todas essas coisas, nem nos teria anunciado agora algo assim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: tivesse a intenção
  rationale: No contexto contrafactual, expressa propósito ou intenção, sem reduzir o verbo a mero desejo emocional.
- source_word: לָקַח
  choice: aceitado
  rationale: Embora o sentido básico seja ‘tomar/receber’, no contexto sacrificial indica que o SENHOR recebeu favoravelmente a oferta.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo português tradicional e preciso para a oferta totalmente queimada.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Neste contexto cultual, designa a oferta vegetal/de cereal e evita o sentido genérico de ‘presente’.
- source_word: הִשְׁמִיעָנוּ
  choice: nos teria anunciado
  rationale: O hifil de שׁמע significa aqui ‘fazer ouvir, comunicar’; ‘anunciar’ é natural em português e preserva a ideia de comunicação recebida.
- source_word: כָזֹאת
  choice: algo assim
  rationale: Mantém a referência deliberadamente geral à mensagem sobre o futuro nascimento, sem explicitar mais do que o hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: Segue a convenção bíblica portuguesa amplamente reconhecida para o Tetragrama, sem inserir uma vocalização discutida no corpo do texto.
- issue: Sentido da aceitação da oferta
  choice: “não teria aceitado” como inferência da mulher de Manoá
  alternative: “não teria tomado/recebido”
  rationale: O contexto apresenta o raciocínio da personagem, não uma formulação doutrinária abstrata; a tradução comunica a força contextual sem acrescentar uma teoria sacrificial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura tríplice do argumento foi preservada por meio de ‘não teria... nem... nem...’. ‘Sua mulher’ mantém a referência simples do hebraico; ‘algo assim’ conserva a relativa indefinição da expressão final.
