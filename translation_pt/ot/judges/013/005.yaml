  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: pt
  text: 'Pois veja: você está grávida e dará à luz um filho. Nenhuma navalha passará sobre a cabeça dele, porque o menino será nazireu de Deus desde o ventre, e ele começará a livrar Israel das mãos dos filisteus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנָּךְ הָרָה
  choice: você está grávida
  rationale: הָרָה funciona como adjetivo predicativo e descreve a condição presente; a construção deítica é expressa naturalmente em português sem um “eis” rígido.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: e dará à luz um filho
  rationale: Expressa o valor futuro no anúncio e usa uma formulação portuguesa corrente e digna.
- source_word: מוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: Nenhuma navalha passará sobre a cabeça dele
  rationale: Preserva a imagem hebraica de a navalha não subir/passar sobre a cabeça, sem transformar a proibição em uma paráfrase excessiva.
- source_word: נְזִיר אֱלֹהִים
  choice: nazireu de Deus
  rationale: Mantém o termo técnico da consagração e reproduz explicitamente a relação com Deus.
- source_word: מִן הַבָּטֶן
  choice: desde o ventre
  rationale: Conserva a referência explícita ao ventre e a ênfase na consagração anterior ao nascimento.
- source_word: יָחֵל לְהוֹשִׁיעַ
  choice: começará a livrar
  rationale: יָחֵל indica começo, enquanto לְהוֹשִׁיעַ admite aqui o sentido contextual de libertar do domínio inimigo.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: das mãos dos filisteus
  rationale: Mantém a metáfora hebraica de mão como poder ou domínio hostil, em uma expressão compreensível em português.
theological_decisions:
- issue: Natureza da consagração de Sansão
  choice: nazireu de Deus desde o ventre
  alternative: consagrado a Deus desde o nascimento
  rationale: O texto emprega o termo técnico נְזִיר e menciona literalmente o ventre; a tradução preserva ambos sem generalizar a instituição nem enfraquecer a dimensão prenatal.
- issue: Alcance do papel de Sansão na libertação de Israel
  choice: ele começará a livrar Israel
  alternative: ele livrará Israel
  rationale: יָחֵל marca explicitamente o início da ação. O texto apresenta Sansão como aquele que começa a libertação, não necessariamente como quem a completa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se o arcaísmo “eis” porque a força deítica já se integra naturalmente à declaração direta; conservaram-se “nazireu”, “ventre” e a imagem das “mãos” por sua precisão textual e teológica.
