  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: pt
  text: 'O anjo do SENHOR apareceu à mulher e lhe disse: “Veja bem: você é estéril e não teve filhos, mas ficará grávida e dará à luz um filho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo do SENHOR
  rationale: Traduz מַלְאַךְ por “anjo” e representa o nome divino conforme a convenção portuguesa consagrada “SENHOR”, sem acrescentar identificação interpretativa.
- source_word: הִנֵּה נָא
  choice: Veja bem
  rationale: Expressa de modo natural a partícula de chamada de atenção הִנֵּה, atenuada por נָא, evitando o arcaísmo “eis que” e preservando a ênfase cortês.
- source_word: עֲקָרָה
  choice: estéril
  rationale: Equivalente direto e corrente para a incapacidade de gerar indicada pelo hebraico.
- source_word: וְלֹא יָלַדְתְּ
  choice: e não teve filhos
  rationale: Embora יָלַדְתְּ signifique literalmente “deu à luz”, a formulação idiomática comunica que ela ainda não havia gerado filhos, sem sugerir apenas ausência de parto.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: mas ficará grávida e dará à luz um filho
  rationale: Mantém a sequência explícita do hebraico—concepção e parto—e traduz o contraste contextual com “mas”.
theological_decisions:
- issue: Identidade do mensageiro divino
  choice: o anjo do SENHOR
  alternative: o mensageiro de Yahweh
  rationale: A tradução tradicional e lexicalmente válida preserva a designação narrativa sem decidir se o personagem deve ser identificado ontologicamente com o próprio Deus.
- issue: Representação do Tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção bíblica portuguesa amplamente reconhecida e mantém visualmente a distinção do nome divino mediante versaletes.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Você” corresponde ao singular feminino do hebraico no discurso direto; evitou-se linguagem excessivamente arcaica.
