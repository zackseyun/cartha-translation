  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: pt
  text: 'Então Manoá suplicou[a] a Yahweh: “Por favor, Senhor, que o homem de Deus que enviaste venha novamente até nós e nos ensine o que devemos fazer pelo menino que há de nascer[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “implorou a Yahweh” ou “orou a Yahweh”; o verbo hebraico transmite a ideia de súplica fervorosa.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “pela criança que nascerá”. O hebraico emprega um termo masculino: “pelo menino que há de nascer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: suplicou
  rationale: O verbo עתר expressa uma súplica fervorosa dirigida a Deus; “suplicou” preserva essa intensidade e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בִּי אֲדֹנָי
  choice: Por favor, Senhor
  rationale: בִּי funciona como partícula cortês de súplica, enquanto אֲדֹנָי é uma forma reverente de se dirigir a Deus.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Tradução direta da expressão hebraica, preservando a perspectiva presente de Manoá e a tensão narrativa quanto à identidade do visitante.
- source_word: אֲשֶׁר שָׁלַחְתָּ
  choice: que enviaste
  rationale: Reproduz de modo claro e natural a oração relativa referente ao homem de Deus.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: que ... venha novamente até nós
  rationale: 'A construção volitiva com נָא exprime um pedido cortês, e עוֹד indica repetição: “novamente”.'
- source_word: וְיוֹרֵנוּ
  choice: e nos ensine
  rationale: O Hifil de ירה tem aqui o sentido de ensinar ou instruir; “ensine” é claro e corrente.
- source_word: מַה נַּעֲשֶׂה
  choice: o que devemos fazer
  rationale: Expressa naturalmente o sentido deliberativo e o pedido de orientação prática.
- source_word: לַנַּעַר
  choice: pelo menino
  rationale: נַעַר é masculino e, no contexto, designa prospectivamente o filho prometido; “menino” preserva essa especificidade.
- source_word: הַיּוּלָּד
  choice: que há de nascer
  rationale: O particípio passivo com referência futura descreve aquele que nascerá; a formulação preserva essa perspectiva prospectiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo pelo título “SENHOR”.
- issue: Identidade de אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  alternative: o mensageiro de Deus
  rationale: Embora o contexto mais amplo desenvolva a identidade do visitante, a fala de Manoá diz “homem de Deus”. A tradução mantém sua perspectiva e não antecipa a resolução narrativa.
- issue: Gênero de לַנַּעַר
  choice: pelo menino
  alternative: pela criança
  rationale: O substantivo hebraico é masculino e se refere ao filho homem prometido; “menino” mantém essa informação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da fala foi ajustada naturalmente, sem perder o pedido reverente. “Há de nascer” conserva o valor futuro do particípio e mantém um registro bíblico corrente sem arcaísmo excessivo.
