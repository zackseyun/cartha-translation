  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: pt
  text: Ela não comerá nada do que procede da videira[a], não beberá vinho nem bebida forte e não comerá nada impuro. Ela guardará tudo o que lhe ordenei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “de tudo o que sai da videira do vinho”, isto é, de tudo o que procede da videira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: nada do que procede da videira
  rationale: Expressa de modo natural a abrangência da frase hebraica e preserva a força verbal de יֵצֵא, “sair, proceder”, sem reproduzir literalmente a expressão pouco idiomática “videira do vinho”.
- source_word: לֹא תֹאכַל
  choice: não comerá
  rationale: O futuro com valor normativo transmite em português a proibição dirigida à mulher e mantém a forma verbal do hebraico.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente direto e corrente de יַיִן.
- source_word: שֵׁכָר
  choice: bebida forte
  rationale: Designa de forma ampla bebida alcoólica distinta do vinho, sem restringir indevidamente o termo a cerveja nem explicitar apenas seu efeito intoxicante.
- source_word: אַל תֵּשְׁתְּ
  choice: não beberá
  rationale: Transmite naturalmente a proibição com אַל e mantém paralelismo com “não comerá”.
- source_word: כָל טֻמְאָה
  choice: nada impuro
  rationale: Preserva a categoria ampla de impureza ritual expressa por טֻמְאָה e soa natural em português contemporâneo.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ
  choice: tudo o que lhe ordenei
  rationale: Reproduz a abrangência da frase e o sufixo feminino singular, com o passado adequado à ordem já dada.
- source_word: תִּשְׁמֹר
  choice: ela guardará
  rationale: Aqui שׁמר significa cumprir ou observar cuidadosamente uma instrução; “guardará” preserva o campo lexical bíblico sem deixar de ser compreensível.
theological_decisions:
- issue: Extensão da proibição relativa à videira
  choice: Traduzir a expressão como abrangendo tudo o que procede da videira.
  alternative: Restringir a referência a uvas ou apenas a produtos comestíveis da videira.
  rationale: A formulação hebraica é deliberadamente abrangente. A tradução conserva essa amplitude sem inserir no texto principal uma classificação técnica posterior.
- issue: Sentido de טֻמְאָה
  choice: Usar “impuro” como categoria bíblica de pureza.
  alternative: Usar “imundo”.
  rationale: “Impuro” mantém a dimensão ritual e pactual do termo, é claro no português moderno e evita que “imundo” seja entendido apenas como fisicamente sujo.
- issue: Força modal das proibições e da ordem final
  choice: 'Empregar o futuro normativo: “não comerá”, “não beberá” e “guardará”.'
  alternative: Empregar “não deve comer/beber” e “deve guardar”.
  rationale: O futuro normativo é natural em instruções solenes e preserva sem rigidez excessiva a forma diretiva do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi levemente condensada para fluidez, sem perder nenhuma proibição. “Bebida forte” conserva o registro bíblico tradicional; “impuro” comunica melhor a categoria ritual ao leitor contemporâneo.
