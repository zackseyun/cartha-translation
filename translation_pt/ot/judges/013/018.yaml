base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: pt
  text: 'E o anjo de Yahweh lhe disse: “Por que você pergunta o meu nome, visto que ele é maravilhoso[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além da compreensão”, “incompreensível” ou, possivelmente, “secreto”. A palavra hebraica indica algo extraordinário ou maravilhoso demais para ser plenamente compreendido.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”; neste contexto narrativo, trata-se de um enviado sobrenatural. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: לָמָּה זֶּה
  choice: Por que
  rationale: A expressão introduz uma pergunta retórica; “Por que” transmite seu sentido de modo natural em português.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: você pergunta o meu nome
  rationale: A construção significa perguntar ou indagar pelo nome de alguém. Esta formulação preserva a concisão e a ordem conceitual do hebraico.
- source_word: וְהוּא
  choice: visto que ele é
  rationale: A conjunção tem força explicativa neste contexto. O pronome “ele” retoma gramaticalmente “nome”, masculino em português, sem tornar explícita uma interpretação além do texto.
- source_word: פֶלִאי
  choice: maravilhoso
  rationale: O adjetivo descreve algo extraordinário, prodigioso ou além da plena compreensão. “Maravilhoso” é a correspondência direta e preserva possíveis ressonâncias bíblicas sem resolver a ambiguidade.
theological_decisions:
- issue: Possível peso teofânico ou cristológico de פֶלִאי
  choice: Traduzir o adjetivo simplesmente como “maravilhoso”, sem definir na tradução a identidade do anjo.
  alternative: Traduzir de modo interpretativo como “além da compreensão”, “incompreensível” ou tratar a expressão como título.
  rationale: O texto pode suscitar reflexão teológica sobre a identidade do anjo de Yahweh, mas não deve ser expandido para impor uma conclusão doutrinária. A tradução lexical preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para naturalidade contemporânea, mantém o nome divino “Yahweh” e conserva a formulação concisa da pergunta retórica.
