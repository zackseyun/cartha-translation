review_pass:
  verdict: revise
  source_fidelity: A tradução transmite com precisão a ascensão da chama, a subida do anjo de Yahweh na chama do altar e a reação de Manoá e sua mulher. A relação de simultaneidade expressa pelo particípio hebraico רֹאִים é mais claramente preservada por «enquanto ... observavam».
  naturalness: «Estavam olhando» é compreensível, mas «observavam» é mais natural e mais adequado ao registro narrativo. A ligação da observação simultânea à queda subsequente deve permanecer no mesmo período para refletir melhor a progressão hebraica.
  terminology: «Anjo de Yahweh» preserva adequadamente מַלְאַךְ יְהוָה sem solucionar a identidade teológica da figura. A nota lexical é apropriada. «Com o rosto em terra» é uma expressão portuguesa estabelecida e corresponde ao gesto hebraico.
  issues:
  - severity: low
    issue: «Manoá e sua mulher estavam olhando»
    rationale: A formulação é possível, mas soa menos idiomática e menos literária do que «enquanto Manoá e sua mulher observavam»; esta última também marca explicitamente a simultaneidade do particípio hebraico.
  - severity: low
    issue: Separação em dois períodos antes da reação final
    rationale: O hebraico mantém a observação e a queda no mesmo encadeamento narrativo. Reunir as ações torna a sequência mais fluida sem alterar o sentido.
  revised_text: E aconteceu que, quando a chama subiu do altar em direção ao céu, o anjo de Yahweh[a] subiu na chama do altar, enquanto Manoá e sua mulher observavam; então caíram com o rosto em terra.
  revised_footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”. A palavra hebraica pode significar “anjo” ou “mensageiro”.
    reason: lexical_alternative
  revision_rationale: A revisão substitui uma construção menos idiomática por «enquanto ... observavam» e integra a reação de Manoá e sua mulher no mesmo encadeamento da frase. Mantêm-se a terminologia divina, a ambiguidade de מַלְאָךְ e a imagem de prostração do hebraico.
