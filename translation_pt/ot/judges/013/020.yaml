revisions:
- from: E aconteceu que, quando a chama subiu do altar em direção ao céu, o anjo de Yahweh[a] subiu na chama do altar. Manoá e sua mulher estavam olhando; então caíram com o rosto em terra.
  to: E aconteceu que, quando a chama subiu do altar em direção ao céu, o anjo de Yahweh[a] subiu na chama do altar, enquanto Manoá e sua mulher observavam; então caíram com o rosto em terra.
  rationale: A revisão substitui uma construção menos idiomática por «enquanto ... observavam» e integra a reação de Manoá e sua mulher no mesmo encadeamento da frase. Mantêm-se a terminologia divina, a ambiguidade de מַלְאָךְ e a imagem de prostração do hebraico.
  reviewer_model: gpt-5.6-terra
