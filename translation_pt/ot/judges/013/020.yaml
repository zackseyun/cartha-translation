base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: pt
  text: E aconteceu que, quando a chama subiu do altar em direção ao céu, o anjo de Yahweh[a] subiu na chama do altar, enquanto Manoá e sua mulher observavam; então caíram com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”. A palavra hebraica pode significar “anjo” ou “mensageiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: E aconteceu que, quando ... subiu
  rationale: Preserva a fórmula narrativa hebraica e introduz naturalmente a oração temporal em português.
- source_word: הַלַּהַב
  choice: a chama
  rationale: Equivalente concreto e corrente para לַהַב, mantendo a imagem visível do texto.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: do altar
  rationale: Expressa de modo idiomático a origem da chama; o movimento ascendente já está indicado por 'subiu'.
- source_word: הַשָּׁמַיְמָה
  choice: em direção ao céu
  rationale: Reproduz o sentido direcional do sufixo hebraico sem afirmar necessariamente a chegada ao destino.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: No contexto, a figura é sobrenatural; 'anjo' é natural em português, enquanto a nota preserva a amplitude lexical de מַלְאָךְ.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: na chama do altar
  rationale: Mantém a leitura locativa e a imagem vívida do mensageiro subindo dentro da chama.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: Manoá e sua mulher estavam olhando
  rationale: O particípio indica ação contínua e simultânea; a formulação é clara e natural.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: então caíram com o rosto em terra
  rationale: Reproduz de modo idiomático a postura descrita pelo hebraico, sem explicitar além do texto se foi medo, reverência ou ambos.
theological_decisions:
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh; uma manifestação teofânica
  rationale: A tradução conserva a designação textual sem decidir se a figura deve ser entendida apenas como ser angelical, como mensageiro ou como manifestação divina.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém o nome divino Yahweh, a progressão narrativa e a ambiguidade teológica do original.
