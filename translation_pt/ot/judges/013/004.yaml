base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: pt
  text: Agora, por favor, tenha cuidado[a], e não beba vinho nem bebida forte[b], e não coma nada impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cuide-se” ou “fique atenta”.'
    reason: lexical_alternative
  - marker: b
    text: “Bebida forte” refere-se a bebidas embriagantes diferentes do vinho.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição para a instrução imediata. Em português atual, “Agora” é natural; “E agora” também seria possível.
- source_word: הִשָּׁמְרִי נָא
  choice: por favor, tenha cuidado
  rationale: O imperativo feminino singular de שׁמר no nifal tem sentido reflexivo de cuidar de si ou ficar em guarda; “por favor” representa a partícula de solicitação נָא.
- source_word: וְאַל תִּשְׁתִּי
  choice: não beba
  rationale: Proibição dirigida diretamente à mulher, expressa com naturalidade pelo presente do subjuntivo em português.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente lexical direto.
- source_word: וְשֵׁכָר
  choice: bebida forte
  rationale: Designa bebida embriagante distinta do vinho; a expressão tradicional e abrangente evita restringir o termo a cerveja.
- source_word: וְאַל תֹּאכְלִי
  choice: e não coma
  rationale: Segunda proibição coordenada à primeira; a conjunção mantém a sequência hebraica sem tornar a frase pesada.
- source_word: כָּל טָמֵא
  choice: nada impuro
  rationale: כָּל com o adjetivo substantivado indica qualquer coisa ou alimento classificado como impuro. “Nada impuro” é idiomático e preserva a categoria ritual.
theological_decisions:
- issue: Natureza de טָמֵא neste contexto
  choice: impuro
  alternative: imundo
  rationale: “Impuro” preserva a categoria ritual e pactual da Torá sem sugerir mera sujeira física ou reprovação moral. “Imundo” é tradicional, mas menos natural no português corrente.
translation_notes:
  register: Português moderno, claro e digno, com tratamento verbal feminino singular implícito. A coordenação hebraica foi preservada, mas usou-se dois-pontos após a advertência inicial para apresentar naturalmente as proibições. A ambiguidade reflexiva de הִשָּׁמְרִי é registrada em nota.
