  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: pt
  text: 'Então Manoá disse à sua mulher: “Certamente morreremos, pois vimos Deus[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um deus” ou “um ser divino”. Em alguns contextos, o hebraico אֱלֹהִים pode se referir de modo mais amplo a um ser divino, mas aqui o contexto favorece “Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo introduz a ação seguinte na narrativa. “Então” expressa com naturalidade essa progressão em português sem acrescentar uma relação causal.
- source_word: מָנוֹחַ
  choice: Manoá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל אִשְׁתּוֹ
  choice: à sua mulher
  rationale: No contexto, אִשָּׁה com o sufixo de terceira pessoa masculina singular designa a esposa de Manoá; “sua mulher” é uma expressão natural e clara em português.
- source_word: מוֹת נָמוּת
  choice: Certamente morreremos
  rationale: O infinitivo absoluto seguido do imperfeito do mesmo verbo intensifica a afirmação. “Certamente morreremos” preserva essa ênfase de modo claro e digno.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão do temor de Manoá. “Pois” comunica diretamente o valor causal e mantém o fluxo natural da fala.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora אֱלֹהִים possa, em certos contextos, designar um deus ou ser divino, aqui o contexto e o temor de morrer por tê-lo visto favorecem a referência a Deus.
- source_word: רָאִינוּ
  choice: vimos
  rationale: O perfeito de primeira pessoa comum do plural descreve a experiência recém-ocorrida. O pretérito perfeito simples é a forma mais natural em português.
theological_decisions:
- issue: Sentido de אֱלֹהִים na exclamação de Manoá após a aparição do anjo do SENHOR
  choice: Deus
  alternative: um deus; um ser divino
  rationale: A narrativa apresenta o encontro com o anjo do SENHOR de modo que evoca um encontro com o próprio Deus, e o medo de Manoá corresponde ao tema bíblico de que ver Deus leva à morte. A tradução “Deus” conserva essa força, enquanto a nota registra a amplitude lexical sem eliminar a tensão acerca da identidade do mensageiro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a intensidade do hebraico e a tensão narrativa em torno do anjo do SENHOR. O marcador da nota foi colocado após “Deus”, termo ao qual a alternativa lexical se refere.
