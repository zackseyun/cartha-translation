  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: pt
  text: 'Então Manoá disse ao anjo de Yahweh[a]: “Qual é o seu nome, para que, quando se cumprir o que você disse, possamos honrá-lo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”.
    reason: 'Alternativa lexical: מַלְאַךְ pode designar tanto um mensageiro quanto um anjo.'
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  rationale: מַלְאַךְ pode significar mensageiro ou anjo; o caráter sobrenatural da figura nesta narrativa favorece “anjo”, enquanto “Yahweh” preserva o nome divino יְהוָה.
- source_word: מִי שְׁמֶךָ
  choice: Qual é o seu nome
  rationale: Embora o hebraico empregue literalmente o interrogativo “quem”, a expressão idiomática pergunta pelo nome; esta formulação é natural e fiel em português.
- source_word: כִּי יָבֹא דְבָרֶיךָ
  choice: para que, quando se cumprir o que você disse
  rationale: A formulação preserva a relação de propósito introduzida por כִּי e comunica naturalmente o sentido idiomático de a mensagem anunciada tornar-se realidade. O plural hebraico דְבָרֶיךָ é representado coletivamente por “o que você disse”.
- source_word: וְכִבַּדְנוּךָ
  choice: possamos honrá-lo
  rationale: O piel de כבד significa honrar ou tratar com honra. “Possamos honrá-lo” mantém a nuance de propósito sem introduzir a carga teológica potencial de “glorificar”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” procura representar o nome divino em vez de substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: “Anjo” é favorecido pelo retrato sobrenatural no contexto, mas a nota preserva a amplitude lexical de מַלְאַךְ sem definir além do texto a identidade teológica da figura.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea e “honrá-lo” para evitar ambiguidade do pronome solto. A sintaxe foi ajustada para expressar em português corrente tanto o propósito quanto o momento do cumprimento.
