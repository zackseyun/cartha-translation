  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: pt
  text: O anjo de Yahweh não tornou a aparecer a Manoá e à sua mulher.[a] Então Manoá soube que ele era o anjo de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”. A palavra hebraica pode significar tanto “mensageiro” como “anjo”; neste contexto, refere-se a uma figura sobrenatural.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף עוֹד ... לְהֵרָאֹה
  choice: não tornou a aparecer
  rationale: A construção idiomática expressa que não houve nova aparição. “Não tornou a aparecer” é natural em português e preserva a ideia de cessação de uma ação posterior.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: Embora מַלְאַךְ possa significar “mensageiro” ou “anjo”, o contexto apresenta uma figura sobrenatural; “anjo” comunica isso com clareza, enquanto a nota conserva a alternativa lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: לְהֵרָאֹה
  choice: aparecer
  rationale: O infinitivo nifal de ראה tem aqui o sentido de “aparecer” ou “ser visto”; “aparecer” é a formulação portuguesa mais idiomática.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: a Manoá e à sua mulher
  rationale: Reproduz os dois complementos introduzidos por אֶל, com contração normal em português antes de “sua mulher”.
- source_word: אָז יָדַע
  choice: Então Manoá soube
  rationale: “Então” mantém a sequência narrativa e “soube” preserva o valor básico de יָדַע, indicando o reconhecimento alcançado naquele momento.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: que ele era o anjo de Yahweh
  rationale: O pronome masculino retoma a figura encontrada por Manoá; a formulação preserva a identificação expressa pelo hebraico sem explicá-la além do texto.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituir a forma hebraica por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: O contexto sobrenatural favorece “anjo”, mas a tradução não define mais precisamente a identidade da figura nem resolve a tensão teológica da narrativa; a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Não tornou a aparecer” conserva a força idiomática do hebraico sem rigidez; “sua mulher” acompanha o registro narrativo bíblico sem soar arcaico.
