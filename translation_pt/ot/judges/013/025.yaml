base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: pt
  text: E o Espírito de Yahweh começou a impeli-lo em Maané-Dã[a], entre Zorá e Estaol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maané-Dã significa “acampamento de Dã”; aqui, a expressão é usada como nome de lugar. Ou: “no acampamento de Dã”.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּחֶל
  choice: começou
  rationale: 'Expressa naturalmente o valor ingressivo do hifil narrativo de חלל: o início da ação.'
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: No contexto do ciclo de Sansão, a expressão indica a presença divina que o capacita e impulsiona; “Espírito” é mais adequado que “vento” ou “sopro”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, mantendo sua função de nome próprio.
- source_word: לְפַעֲמוֹ
  choice: a impeli-lo
  rationale: O verbo פעם aqui pode significar mover, agitar ou impelir. “Impeli-lo” comunica o impulso divino sem reduzi-lo a mera inquietação emocional.
- source_word: בְּמַחֲנֵה דָן
  choice: em Maané-Dã
  rationale: A expressão, literalmente “acampamento de Dã”, funciona aqui como topônimo; por isso, é transliterada e explicada em nota.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: entre Zorá e Estaol
  rationale: Reproduz diretamente a expressão geográfica com formas portuguesas claras dos topônimos.
theological_decisions:
- issue: Natureza de רוּחַ יְהוָה neste contexto
  choice: o Espírito de Yahweh como presença divina que capacita e impulsiona
  alternative: o vento de Yahweh; o sopro de Yahweh
  rationale: No contexto narrativo de Sansão, a expressão descreve a atuação capacitadora de Yahweh, não um fenômeno meteorológico, sem acrescentar formulações doutrinárias posteriores.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva sua qualidade de nome próprio.
- issue: Nuance de לְפַעֲמוֹ
  choice: a impeli-lo
  alternative: a agitá-lo; a movê-lo
  rationale: A escolha expressa ação divina sobre Sansão, mas a nota conserva a amplitude lexical do verbo e evita resolver excessivamente sua nuance.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Impeli-lo” mantém a força da ação divina sem soar coloquial; a ambiguidade lexical relevante é preservada nas decisões registradas. O marcador [a] aparece imediatamente após o topônimo a que se refere.
