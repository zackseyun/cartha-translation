  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: pt
  text: 'Mas ele voltou das imagens esculpidas[a] que ficavam perto de Gilgal[b] e disse: “Tenho uma mensagem secreta[c] para o senhor, ó rei.” Ele disse: “Silêncio!” Então todos os que estavam de pé junto dele saíram de sua presença.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos ídolos”. O termo hebraico geralmente se refere a imagens de culto.
    reason: lexical_alternative
  - marker: b
    text: Ou “que ficavam em Gilgal”. A expressão hebraica de localização é condensada e pode indicar proximidade ou posição em Gilgal.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma palavra secreta” ou “um assunto particular”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: voltou
  rationale: Expressa de modo natural o retorno de Eúde depois de ter invertido o rumo de sua viagem.
- source_word: הַפְּסִילִים
  choice: as imagens esculpidas
  rationale: Preserva o sentido concreto de objetos talhados sem eliminar a provável conotação cultual; “ídolos” é registrado em nota.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: que ficavam perto de Gilgal
  rationale: Torna clara a expressão locativa hebraica comprimida, mantendo em nota a possibilidade de localização em Gilgal.
- source_word: דְּבַר סֵתֶר
  choice: uma mensagem secreta
  rationale: דָּבָר pode designar palavra, assunto ou mensagem, enquanto סֵתֶר indica algo oculto ou secreto; a formulação é natural na cena de corte.
- source_word: לִי אֵלֶיךָ
  choice: Tenho ... para o senhor
  rationale: Reproduz idiomaticamente a ideia de que Eúde tem algo reservado a comunicar ao rei; “o senhor” oferece legibilidade brasileira e tratamento respeitoso.
- source_word: הַמֶּלֶךְ
  choice: ó rei
  rationale: Mantém o vocativo explícito e o tom formal da abordagem.
- source_word: הָס
  choice: Silêncio!
  rationale: Conserva a brevidade e a força da ordem hebraica.
- source_word: כָּל־הָעֹמְדִים עָלָיו
  choice: todos os que estavam de pé junto dele
  rationale: Mantém a imagem concreta dos assistentes posicionados junto ao rei, sem substituir a expressão por um cargo específico.
- source_word: מֵעָלָיו
  choice: de sua presença
  rationale: Comunica naturalmente a retirada dos assistentes do lugar onde atendiam o rei.
theological_decisions: []
