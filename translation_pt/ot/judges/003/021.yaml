  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: pt
  text: Então Eúde estendeu a mão esquerda, tirou a espada[a] da coxa direita e a cravou no ventre dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a espada”; pelo contexto, talvez fosse uma espada curta ou um punhal.'
    reason: lexical_alternative
  - marker: b
    text: Ou “no abdômen dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: estendeu
  rationale: No contexto de um movimento físico da mão, o verbo indica estender ou levar a mão em direção a algo; “estendeu” reproduz diretamente a ação.
- source_word: יַד שְׂמֹאלוֹ
  choice: a mão esquerda
  rationale: O hebraico menciona explicitamente a mão e destaca que Eúde usou a esquerda.
- source_word: וַיִּקַּח
  choice: tirou
  rationale: Embora o sentido básico seja “pegou”, neste contexto Eúde retira a arma do lugar onde a trazia; “tirou” expressa naturalmente essa sequência sem intensificar a ação.
- source_word: הַחֶרֶב
  choice: a espada
  rationale: É o termo hebraico comum para espada. O contexto permite imaginar uma espada curta ou um punhal, mas o termo mais amplo preserva melhor o léxico da fonte.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: de sobre a coxa direita
  rationale: A formulação conserva a localização concreta indicada pelo hebraico e deixa claro que a arma estava junto à coxa direita de Eúde.
- source_word: וַיִּתְקָעֶהָ
  choice: a cravou
  rationale: O verbo descreve a introdução violenta e firme da arma. “Cravou” é vívido, natural em português e mantém o pronome feminino referente a “espada”.
- source_word: בְּבִטְנוֹ
  choice: no ventre de Eglom
  rationale: “Ventre” corresponde diretamente à região abdominal. O nome explicita em português o referente contextual do sufixo possessivo, evitando a leitura involuntária de que Eúde feriu a si mesmo.
