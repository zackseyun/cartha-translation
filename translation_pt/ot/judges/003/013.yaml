reference: Judges 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: pt
  text: Ele reuniu ao seu redor os amonitas e Amaleque[a], foi e feriu Israel; e eles tomaram posse da Cidade das Palmeiras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os amalequitas”. O hebraico usa “Amaleque” como nome coletivo desse povo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, provavelmente Jericó; compare Deuteronômio 34:3 e 2 Crônicas 28:15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: reuniu ao seu redor
  rationale: Expressa de modo natural que Eglom agregou aliados sob sua liderança, preservando a ideia direcional de אֵלָיו sem recorrer à formulação pouco idiomática “reuniu a si”.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É o gentílico corrente em português e comunica naturalmente o sentido do hebraico, em vez do formalismo literal “os filhos de Amom”.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Mantém a forma do nome coletivo hebraico. A possibilidade de explicitar o povo como “os amalequitas” é registrada em nota.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Preserva o verbo narrativo comum הלך sem acrescentar a especificidade militar de “marchou”.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: feriu Israel
  rationale: Mantém o sentido básico e militar de נכה mais de perto do que opções interpretativas como “derrotou”.
- source_word: וַיִּירְשׁוּ
  choice: eles tomaram posse de
  rationale: O verbo está no plural e se refere a Eglom com suas forças aliadas. “Tomaram posse” comunica claramente o resultado de conquista expresso por ירשׁ.
- source_word: עִיר הַתְּמָרִים
  choice: Cidade das Palmeiras
  rationale: Conserva a designação descritiva do texto hebraico como nome de lugar, sem substituí-la pela provável identificação com Jericó.
theological_decisions:
- issue: Identificação de עִיר הַתְּמָרִים
  choice: Cidade das Palmeiras no texto principal
  alternative: Jericó
  rationale: O hebraico emprega o título descritivo, não o nome explícito Jericó. A tradução preserva essa forma e deixa a provável identificação para a nota, evitando resolver no texto uma identificação inferida por referências paralelas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação narrativa simples acompanha o ritmo hebraico; o ponto e vírgula esclarece a passagem do ataque à ocupação. Os marcadores foram posicionados junto aos termos a que suas respectivas notas se referem.
