  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: pt
  text: Os filhos de Israel[a] fizeram o que era mau aos olhos de Yahweh[b]; esqueceram-se de Yahweh, seu Deus, e serviram aos baalins e às aserás.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “mau aos olhos de Yahweh” indica aquilo que Yahweh julgava mau.
    reason: lexical_alternative
  - marker: c
    text: Ou “aos postes de Aserá”. O hebraico pode se referir a objetos de culto associados a Aserá ou, de modo mais amplo, ao culto prestado a ela.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a forma do idioma hebraico, que designa coletivamente o povo de Israel; a alternativa mais corrente é indicada em nota.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: o que era mau aos olhos de Yahweh
  rationale: Reproduz a fórmula hebraica de avaliação moral e mantém a imagem de 'aos olhos de', sem ocultar que é Yahweh quem julga o ato mau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּשְׁכְּחוּ
  choice: esqueceram-se
  rationale: Mantém o sentido básico de שׁכח; o contexto permite perceber sua força de abandono prático sem incorporá-la interpretativamente à tradução.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: O referente é Yahweh, e o contexto exige o singular; 'seu' concorda naturalmente com o sujeito coletivo em português.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: Preserva a amplitude de עבד no contexto religioso, que inclui serviço cultual e adoração, sem reduzi-lo a apenas um desses aspectos.
- source_word: הַבְּעָלִים
  choice: os baalins
  rationale: Mantém o plural hebraico, provavelmente referente a manifestações ou cultos locais de Baal, usando a forma plural consagrada em português.
- source_word: הָאֲשֵׁרוֹת
  choice: as aserás
  rationale: A transliteração no plural conserva a ambiguidade entre representações ou manifestações de Aserá e objetos cultuais associados a ela.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino. 'Yahweh' preserva esse nome pactual, em vez de substituí-lo por um título ou empregar outra forma tradicional.
- issue: Sentido de הָאֲשֵׁרוֹת
  choice: as aserás
  alternative: os postes de Aserá
  rationale: O hebraico pode designar objetos cultuais associados a Aserá ou formas localizadas de seu culto. A tradução principal mantém essa ambiguidade, e a nota registra a interpretação mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção conserva os principais traços do hebraico, enquanto o ponto e vírgula evita uma sequência excessivamente longa de orações coordenadas. Os termos religiosos menos familiares são mantidos para preservar a precisão e esclarecidos em nota.
