id: JDG.3.12
reference: Judges 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: pt
  text: Os israelitas voltaram a fazer o que era mau aos olhos de Yahweh, e Yahweh fortaleceu Eglom, rei de Moabe, contra Israel, porque eles fizeram o que era mau aos olhos de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ ... לַעֲשׂוֹת
  choice: voltaram a fazer
  rationale: A construção idiomática com יסף e infinitivo indica repetição. “Voltaram a fazer” expressa naturalmente o novo ciclo de desobediência sem introduzir a ideia mais específica de continuidade.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a forma literal seja “os filhos de Israel”, aqui a expressão designa coletivamente o povo israelita. A forma idiomática evita que o leitor moderno a entenda apenas como referência aos filhos imediatos de Jacó.
- source_word: לַעֲשׂוֹת הָרַע
  choice: fazer o que era mau
  rationale: Transmite de modo natural a expressão hebraica e mantém o caráter avaliativo da ação, em vez de reduzir הָרַע a uma noção abstrata.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica de avaliação, que também é clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְחַזֵּק
  choice: fortaleceu
  rationale: Reproduz diretamente o sentido causativo/intensivo de חזק no piel e mantém explícita a atuação divina.
- source_word: עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Eglom, rei de Moabe
  rationale: Verte naturalmente a aposição hebraica e emprega formas nominais tradicionais e reconhecíveis em português.
- source_word: עַל יִשְׂרָאֵל
  choice: contra Israel
  rationale: No contexto de hostilidade e opressão, עַל indica oposição a Israel, não apenas posição ou domínio.
- source_word: עַל כִּי
  choice: porque
  rationale: Introduz com clareza a causa declarada para a ação de Yahweh.
- source_word: עָשׂוּ אֶת הָרַע
  choice: eles fizeram o que era mau
  rationale: Mantém o aspecto simples da forma hebraica e repete deliberadamente a linguagem avaliativa da primeira oração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome próprio divino. A transliteração o preserva sem substituí-lo por um título.
- issue: Agência divina em וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן
  choice: Yahweh fortaleceu Eglom
  alternative: Yahweh permitiu que Eglom se fortalecesse
  rationale: O hebraico atribui diretamente a Yahweh a ação de fortalecer Eglom. A tradução mantém essa tensão teológica e não a atenua como mera permissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “os israelitas” à reprodução formal “os filhos de Israel”, por ser o equivalente coletivo natural neste contexto. A repetição de “fazer o que era mau aos olhos de Yahweh” foi mantida por refletir a estrutura e a ênfase do hebraico.
