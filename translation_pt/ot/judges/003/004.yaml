  text: וַֽ/יִּהְי֕וּ לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל לָ/דַ֗עַת הֲ/יִשְׁמְעוּ֙ אֶת מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁר צִוָּ֥ה אֶת אֲבוֹתָ֖/ם בְּ/יַד מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: pt
  text: Esses povos ficaram ali para, por meio deles, pôr Israel à prova[a], a fim de saber se obedeceriam[b] aos mandamentos de Yahweh, que ele havia ordenado aos pais deles[c] por meio de Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz explicitamente “por meio deles”, isto é, por meio dos povos deixados na terra.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico significa literalmente “ouvir”, mas aqui tem o sentido de dar ouvidos ou obedecer aos mandamentos.
    reason: lexical_alternative
  - marker: c
    text: Isto é, os antepassados deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Eles ficaram ali
  rationale: No contexto, o sujeito são os povos deixados na terra. “Ficaram ali” expressa em português atual a permanência contextual indicada por היה, sem reduzir a frase à mera existência.
- source_word: לְנַסּוֹת
  choice: pôr à prova
  rationale: נסה indica testar ou provar mediante uma situação. “Pôr à prova” é claro e não sugere necessariamente indução ao mal.
- source_word: בָּם
  choice: por meio deles
  rationale: A preposição com o sufixo retoma os povos e os apresenta explicitamente como o meio pelo qual Israel seria posto à prova.
- source_word: לָדַעַת
  choice: a fim de saber
  rationale: Preserva o sentido literal de ידע e deixa explícita a finalidade indicada pelo infinitivo hebraico.
- source_word: הֲיִשְׁמְעוּ
  choice: se obedeceriam
  rationale: שׁמע, quando tem mandamentos como complemento, significa ouvir no sentido de dar atenção e obedecer. Em português, “obedeceriam” comunica esse valor contextual com naturalidade.
- source_word: מִצְוֺת
  choice: mandamentos
  rationale: É o equivalente corrente e digno de מִצְוֹת no contexto das ordens da aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֲשֶׁר צִוָּה
  choice: que ele havia ordenado
  rationale: Mantém a oração relativa ligada aos mandamentos; o mais-que-perfeito situa naturalmente a ordem anterior à prova narrada.
- source_word: אֲבוֹתָם
  choice: aos pais deles
  rationale: Conserva a forma masculina explícita do hebraico, entendida aqui como referência aos antepassados de Israel.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Comunica em português moderno a expressão idiomática hebraica “pela mão de Moisés”, preservando sua ideia de mediação.
theological_decisions:
- issue: Sentido da linguagem de prova
  choice: Os povos restantes são o meio pelo qual Israel é posto à prova quanto à obediência à aliança.
  alternative: Tratar a prova apenas como observação histórica, sem finalidade teológica.
  rationale: Os infinitivos לְנַסּוֹת e לָדַעַת exprimem finalidade. A tradução preserva essa tensão sem equiparar a prova a uma indução ao mal nem explicar quem precisava adquirir esse conhecimento.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva no texto o nome pessoal representado pelo Tetragrama.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém explícito o instrumento da prova, embora isso produza a repetição intencional “eles... por meio deles”, presente no hebraico. “Obedeceriam” privilegia o sentido contextual, enquanto a nota registra a metáfora auditiva do original.
