  source_fidelity: 'A tradução transmite corretamente a permanência dos povos, a finalidade de testar Israel e a finalidade subsequente de verificar sua resposta aos mandamentos de Yahweh. Contudo, o pronome em “por meio deles” é sintaticamente ambíguo em português: depois de “Eles ficaram ali”, pode ser entendido como Israel ou como outro referente, quando o hebraico retoma especificamente os povos restantes. Uma reformulação leve torna esse referente inequívoco sem perder a explicitude de בָּם.'
  naturalness: A construção “para, por meio deles, pôr Israel à prova” é compreensível, mas é interrompida e um tanto pesada. “Para, por meio desses povos, pôr Israel à prova” é mais fluente e claro em português moderno internacional.
  terminology: “Pôr à prova”, “obedecer”, “mandamentos”, “Yahweh”, “pais” e “por meio de Moisés” são adequados. “Pais deles” preserva o masculino plural de אֲבוֹתָם; a nota explicativa sobre “antepassados” é apropriada.
