base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: pt
  text: 'Depois que ele saiu, os servos do rei chegaram e viram que as portas do aposento superior estavam trancadas. Então disseram: “Com certeza ele está fazendo suas necessidades[a] no aposento interno e fresco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cobrindo os pés”; um eufemismo hebraico para aliviar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: Depois que ele saiu
  rationale: A oração retoma a saída de Eúde e estabelece sua relação temporal com a chegada dos servos, de modo natural em português.
- source_word: עֲבָדָיו
  choice: os servos do rei
  rationale: O referente pronominal é Eglom; explicitar “do rei” evita em português que o leitor associe os servos a Eúde. No contexto da casa real, “servos” é natural sem afirmar uma condição jurídica específica.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: viram que
  rationale: Reproduz com fluidez a descoberta indicada pela sequência hebraica “viram, e eis”, sem acrescentar uma ação de inspeção não expressa diretamente.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: as portas do aposento superior
  rationale: עֲלִיָּה designa um cômodo elevado ou no andar de cima; “aposento superior” preserva a referência arquitetônica com registro digno.
- source_word: נְעֻלוֹת
  choice: estavam trancadas
  rationale: O particípio indica o estado das portas, fechadas com tranca ou ferrolho; “trancadas” é claro e atual.
- source_word: אַךְ
  choice: Com certeza
  rationale: Neste contexto, a partícula introduz a conclusão segura, porém equivocada, dos servos.
- source_word: מֵסִיךְ הוּא אֶת רַגְלָיו
  choice: ele está fazendo suas necessidades
  rationale: Traduz o sentido do eufemismo hebraico de forma clara, corrente e ainda discreta; a expressão literal é preservada em nota.
- source_word: בַּחֲדַר הַמְּקֵרָה
  choice: no quarto fresco e reservado
  rationale: חֲדַר indica um cômodo interior ou privado, enquanto הַמְּקֵרָה se relaciona ao frescor. A formulação comunica tanto o caráter fresco quanto reservado do aposento sem especificar além da evidência.
