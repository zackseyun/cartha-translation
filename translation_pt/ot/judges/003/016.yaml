base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: pt
  text: Eúde fez para si uma espada de dois gumes, de um gômed de comprimento[a], e a prendeu por baixo de suas roupas, na coxa direita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O gômed é uma medida de comprimento rara, cujo valor exato é incerto; geralmente é entendido como aproximadamente o comprimento de um antebraço, ou cerca de um côvado.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: fez para si
  rationale: A construção com לֹו indica que Eúde fez a arma para uso próprio; “fez para si” preserva esse sentido de modo natural.
- source_word: חֶרֶב
  choice: espada
  rationale: חֶרֶב é o termo geral para espada. Embora o comprimento possa sugerir uma arma curta, traduzir por “punhal” estreitaria indevidamente o sentido.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: de dois gumes
  rationale: A expressão hebraica, literalmente “ela tinha duas bocas”, designa uma lâmina afiada dos dois lados; “de dois gumes” é corrente e fiel.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: com um gômed de comprimento
  rationale: גֹּמֶד é uma medida rara e de valor exato incerto. A transliteração evita identificá-la sem segurança com o côvado, enquanto a nota esclarece sua provável dimensão.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: a prendeu
  rationale: חגר descreve prender ou cingir uma arma ao corpo. “Prendeu” é claro em português moderno sem especificar um mecanismo não mencionado.
- source_word: מִתַּחַת לְמַדָּיו
  choice: por baixo das roupas
  rationale: מַדָּיו refere-se às roupas ou vestes; a formulação genérica evita definir indevidamente o tipo de traje.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: junto à coxa direita
  rationale: יָרֵךְ designa a coxa ou região do quadril. “Junto à coxa direita” comunica naturalmente a posição da arma presa sob a roupa.
