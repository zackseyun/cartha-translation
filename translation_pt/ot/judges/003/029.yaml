base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: pt
  text: Naquele tempo, eles abateram cerca de dez mil homens de Moabe[a], todos eles homens robustos[b] e valentes[c]; nem um só escapou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Moabe»; o texto se refere aos homens moabitas, como mostra a contagem de «cerca de dez mil homens» logo em seguida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «bem nutridos»; literalmente, «gordos». No contexto, a expressão provavelmente descreve homens fortes e vigorosos.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «homens de valor», «homens capazes» ou «guerreiros valentes».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: mataram
  rationale: Em contexto militar, נכה indica ferir mortalmente ou abater; o desfecho explícito de que ninguém escapou sustenta a tradução natural «mataram».
- source_word: אֶת מוֹאָב
  choice: homens de Moabe
  rationale: O hebraico traz literalmente «Moabe», mas a contagem imediatamente seguinte, «cerca de dez mil homens», deixa claro que se trata de homens moabitas.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal natural em português e próxima da formulação hebraica.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: cerca de dez mil homens
  rationale: O prefixo כ־ assinala aproximação; «cerca de» comunica isso com clareza.
- source_word: כָּל שָׁמֵן
  choice: todos robustos
  rationale: שָׁמֵן significa literalmente «gordo», mas aqui provavelmente caracteriza homens bem nutridos, fortes ou vigorosos. «Robustos» preserva essa conotação sem reduzir a expressão ao tamanho corporal.
- source_word: וְכָל אִישׁ חָיִל
  choice: e valentes
  rationale: אִישׁ חַיִל, neste cenário de batalha, designa homens de valor, força ou capacidade militar; «valentes» é corrente e conciso.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: nem um só escapou
  rationale: Reproduz com naturalidade a ênfase distributiva e a totalidade da derrota.
