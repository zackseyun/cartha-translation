base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: pt
  text: Tomaram para si as filhas deles como esposas e deram suas filhas aos filhos deles; e serviram aos deuses deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adoraram os deuses deles”.
    reason: Alternativa lexical para עבד no contexto de culto religioso.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Tomaram
  rationale: Mantém o sentido básico de לקח, enquanto a expressão “como esposas” explicita o contexto matrimonial.
- source_word: בְּנוֹתֵיהֶם ... לָהֶם לְנָשִׁים
  choice: para si as filhas deles como esposas
  rationale: Preserva tanto a ideia de benefício, “para si”, quanto a função matrimonial, “como esposas”, em português natural.
- source_word: וְאֶת בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: e deram suas filhas aos filhos deles
  rationale: Traduz נתן por “deram” e mantém a reciprocidade dos casamentos mistos. A formulação evita acrescentar “em casamento”, já implícito no contexto, e deixa os referentes pronominais dependentes do contexto, como no hebraico.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: עבד aplicado a deuses abrange serviço religioso e lealdade cultual. “Serviram” conserva essa amplitude; “adoraram” é uma alternativa válida.
- source_word: אֱלֹהֵיהֶם
  choice: aos deuses deles
  rationale: Expressa claramente que se trata dos deuses dos povos mencionados no contexto, sem substituir o termo comum “deuses” por uma designação mais técnica.
theological_decisions:
- issue: Lealdade religiosa expressa por עבד em relação a deuses pagãos
  choice: serviram aos deuses deles
  alternative: adoraram os deuses deles
  rationale: “Serviram” preserva o campo semântico mais amplo de עבד, que inclui culto, submissão e lealdade, sem restringir o sentido apenas a atos de adoração.
translation_notes:
  register: Português moderno, claro e digno. A ordem foi levemente ajustada para fluência (“para si as filhas deles”), e o ponto e vírgula destaca a consequência religiosa dos casamentos. O marcador da nota foi colocado após a expressão a que de fato se refere.
