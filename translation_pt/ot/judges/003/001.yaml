id: JDG.3.1
reference: Judges 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: pt
  text: 'Estas são as nações que Yahweh deixou ficar para, por meio delas, pôr Israel à prova — todos aqueles que não tinham conhecido nenhuma das guerras de Canaã[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tinham passado por nenhuma das guerras de Canaã”.'
    reason: A forma de ידע, “conhecer”, pode indicar experiência direta; a alternativa torna explícito esse sentido experiencial.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: O demonstrativo introduz a lista que segue; em português, a continuidade narrativa pode ficar implícita, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos grupos étnico-políticos que permaneceram na terra; “nações” é claro e adequado ao contexto de Juízes.
- source_word: הִנִּיחַ
  choice: deixou ficar
  rationale: O hifil de נוח aqui indica deixar ou permitir que permanecessem. “Deixou ficar” explicita naturalmente em português que essas nações continuaram na terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְנַסּוֹת
  choice: pôr à prova
  rationale: Expressa o propósito de testar ou provar, sem a conotação indevida de induzir ao pecado.
- source_word: בָּם
  choice: por meio delas
  rationale: A preposição com sufixo indica que as nações seriam o meio pelo qual Israel seria posto à prova.
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: todos aqueles que não tinham conhecido
  rationale: Mantém a referência ao conjunto de israelitas sem experiência das guerras anteriores e conserva o verbo “conhecer”, cuja nuance é experiencial neste contexto.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: nenhuma das guerras de Canaã
  rationale: Sob negação, “nenhuma” comunica idiomaticamente que eles não haviam conhecido guerra alguma entre as guerras associadas a Canaã.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Finalidade divina ao deixar as nações
  choice: para, por meio delas, pôr Israel à prova
  alternative: para provar Israel por meio delas
  rationale: Mantém sem atenuação a afirmação de que Yahweh deixou essas nações com a finalidade de testar Israel, sem explicar além do que o versículo declara.
- issue: Relação de “todos aqueles” com Israel
  choice: travessão antes de “todos aqueles”
  alternative: isto é, todos aqueles
  rationale: O hebraico apresenta a expressão em aposição, esclarecendo quais israelitas estão em vista. O travessão conserva essa relação sem inserir uma fórmula explicativa explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pôr à prova” é corrente e evita a possível ambiguidade moral de “tentar”. O versículo termina com dois-pontos porque a enumeração continua nos versículos seguintes.
