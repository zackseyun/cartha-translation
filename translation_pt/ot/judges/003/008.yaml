source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: pt
  text: A ira de Yahweh ardeu contra Israel, e ele os vendeu nas mãos de Cuchã-Risataim, rei de Arã-Naaraim[a]. E os filhos de Israel[b] serviram a Cuchã-Risataim durante oito anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mesopotâmia”; em hebraico, “Arã-Naaraim”, tradicionalmente entendido como “Arã dos Dois Rios”.
    reason: alternative_reading
  - marker: b
    text: “Os filhos de Israel” é a expressão hebraica literal; muitas traduções trazem “os israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: A ira ... ardeu
  rationale: Preserva a imagem hebraica da ira que arde, em formulação clara e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּמְכְּרֵם
  choice: ele os vendeu
  rationale: Mantém a metáfora forte de מכר, usada aqui para a entrega de Israel ao domínio de um opressor.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Expressa naturalmente em português o idiomatismo hebraico de estar sob o poder ou controle de alguém, preservando a imagem das mãos.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Cusã-Risataim
  rationale: Transliteração adaptada à ortografia e à pronúncia usuais do português, tratada como uma única designação.
- source_word: אֲרַם נַהֲרָיִם
  choice: Arã-Naaraim
  rationale: Mantém o topônimo hebraico transliterado, sem substituí-lo no texto principal pela identificação interpretativa 'Mesopotâmia'.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: Tradução direta de עבד; no contexto, denota serviço imposto e sujeição política sem tornar explícito mais do que o verbo hebraico afirma.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão hebraica convencional e sua forma masculina, sem a neutralizar como 'os israelitas'.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: durante oito anos
  rationale: Tradução temporal direta; 'durante' torna a duração idiomática em português sem acrescentar conteúdo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino; a transliteração preserva o nome pessoal em vez de o substituir por um título.
- issue: Forma coletiva בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A opção principal preserva a expressão hebraica tradicional e sua forma gramatical masculina, embora no contexto designe coletivamente o povo de Israel.
- issue: Sentido de אֲרַם נַהֲרָיִם
  choice: Arã-Naaraim
  alternative: Mesopotâmia; Arã dos Dois Rios
  rationale: O texto principal conserva o topônimo hebraico e a nota apresenta identificações ou traduções tradicionais sem resolver além da evidência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens hebraicas centrais e os nomes próprios em transliteração adaptada ao português. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
