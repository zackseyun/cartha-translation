  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: pt
  text: Depois dele veio Sangar, filho de Anate. Ele abateu seiscentos filisteus com uma aguilhada de bois[a] e também salvou Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A aguilhada era uma vara, geralmente com ponta, usada para conduzir bois.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Depois dele
  rationale: Preserva a referência anafórica ao juiz anterior sem inserir explicitamente o nome de Eúde.
- source_word: הָיָה
  choice: veio
  rationale: Neste contexto, introduz a figura seguinte na sequência narrativa; “veio” é natural em português e não acrescenta a ideia mais forte de que ele “se levantou”.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Sangar, filho de Anate
  rationale: Emprega as formas portuguesas usuais dos nomes e mantém literalmente a relação expressa por “filho de”, sem decidir se Anate é nome pessoal ou parte de uma designação.
- source_word: וַיַּךְ
  choice: abateu
  rationale: O verbo נכה, neste contexto de combate, indica que os filisteus foram violentamente derrubados e provavelmente mortos; “abateu” comunica isso sem ampliar a afirmação para além do contexto.
- source_word: פְּלִשְׁתִּים שֵׁשׁ מֵאוֹת אִישׁ
  choice: seiscentos filisteus
  rationale: É a formulação portuguesa mais direta e natural para o grupo contado, sem a redundância de “seiscentos homens filisteus”.
- source_word: בְּמַלְמַד הַבָּקָר
  choice: com uma aguilhada de bois
  rationale: Designa o instrumento pontiagudo usado para conduzir bois; a expressão conserva a imagem agrária e evita o sentido moderno de um bastão elétrico.
- source_word: וַיֹּשַׁע גַּם הוּא אֶת־יִשְׂרָאֵל
  choice: e também salvou Israel
  rationale: “Salvou” reproduz com clareza o tema recorrente de libertação em Juízes, enquanto “também” apresenta Sangar como mais um libertador na sequência.
theological_decisions:
- issue: Natureza da salvação realizada por Sangar
  choice: também salvou Israel
  alternative: também libertou Israel
  rationale: O texto atribui a Sangar uma ação real de resgate militar, mas não define seu alcance nem sua duração. “Salvou” preserva a força do verbo hebraico e o vocabulário temático do livro sem transformar a frase numa afirmação soteriológica mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A divisão em duas frases evita uma construção excessivamente longa. “Sangar” e “Anate” seguem formas portuguesas tradicionais; “aguilhada de bois” mantém o caráter antigo e rural do instrumento.
