base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: pt
  text: Quando terminou de apresentar o tributo[a], Eúde despediu as pessoas que carregavam o tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «presente» ou «oferta». Aqui, o termo hebraico provavelmente se refere a um tributo apresentado a um governante, e não a uma oferta sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Depois de
  rationale: A fórmula narrativa introduz a ação seguinte e, com כִּלָּה, marca que a apresentação já havia terminado antes de Eúde dispensar os carregadores. A formulação é natural em português e preserva a sequência temporal.
- source_word: כִּלָּה
  choice: terminar
  rationale: O verbo significa concluir ou acabar. A locução «Depois de terminar» expressa com clareza a anterioridade da ação.
- source_word: לְהַקְרִיב
  choice: de apresentar
  rationale: O hifil de קרב pode significar trazer ou apresentar. No contexto de uma entrega a um governante, «apresentar» evita uma conotação exclusivamente sacrificial.
- source_word: הַמִּנְחָה
  choice: o tributo
  rationale: Embora מִנְחָה possa designar presente ou oferta, neste contexto político refere-se provavelmente ao tributo entregue a Eglom. A nota preserva as alternativas lexicais genuínas.
- source_word: וַיְשַׁלַּח
  choice: mandou de volta
  rationale: O verbo indica enviar embora ou dispensar. «Mandou de volta» é idiomático e se ajusta ao grupo que havia acompanhado Eúde até o rei.
- source_word: הָעָם
  choice: as pessoas
  rationale: O substantivo significa povo ou pessoas. Aqui designa o grupo acompanhante, sem especificar que eram homens.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: que o haviam carregado
  rationale: A construção participial identifica as pessoas como carregadoras do tributo. O pronome retoma «tributo» sem repetição pesada, e o mais-que-perfeito composto marca a ação anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O sujeito «Eúde» foi explicitado para evitar ambiguidade natural em português, com base no contexto imediato; não se acrescenta informação nova. A repetição hebraica de «tributo» foi reduzida por retomada pronominal, sem perda de referente.
