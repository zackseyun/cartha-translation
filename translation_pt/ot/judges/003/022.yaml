base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: pt
  text: Até o punho entrou depois da lâmina[a], e a gordura se fechou sobre a lâmina, pois ele não tirou a espada da barriga dele; e os excrementos saíram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Até o cabo entrou depois da lâmina».'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por «excrementos» é raro e pode se referir, de modo mais amplo, às fezes ou ao conteúdo dos intestinos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: o punho
  rationale: No contexto da espada, designa a parte que vem logo depois da lâmina; «punho» é natural e preciso em português.
- source_word: הַלַּהַב
  choice: a lâmina
  rationale: Embora o termo possa significar «chama» em outros contextos, aqui se refere claramente à lâmina da arma.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: se fechou sobre
  rationale: Preserva a imagem concreta de a gordura envolver e cobrir a lâmina.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: Tradução direta que mantém o caráter gráfico da narrativa hebraica.
- source_word: שָׁלַף
  choice: tirou
  rationale: Expressa de modo corrente a retirada de uma espada que já estava dentro do corpo.
- source_word: מִבִּטְנוֹ
  choice: da barriga dele
  rationale: «Barriga» conserva o registro corporal e concreto do hebraico, sem o tom clínico de «abdômen».
- source_word: הַפַּרְשְׁדֹנָה
  choice: os excrementos
  rationale: O termo hebraico é raro e provavelmente indica fezes ou, de modo mais amplo, conteúdo intestinal; «excrementos» é claro, digno e suficientemente abrangente.
- source_word: וַיֵּצֵא
  choice: saíram
  rationale: Verbo simples e natural que comunica a saída física descrita no texto.
- source_word: גַם
  choice: até
  rationale: Neste contexto, ressalta que não apenas a lâmina, mas até o punho entrou, reproduzindo naturalmente a ênfase em português.
