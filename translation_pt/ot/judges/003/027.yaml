base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: pt
  text: Quando ele chegou, tocou a trombeta na região montanhosa de Efraim. Os filhos de Israel desceram com ele da região montanhosa, e ele estava à frente deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: Quando ele chegou
  rationale: A construção com בְּ e infinitivo marca a circunstância temporal. A formulação comunica naturalmente a sequência narrativa sem reproduzir de modo rígido o hebraísmo “e aconteceu”.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: tocou a trombeta
  rationale: שׁוֹפָר designa o instrumento de sinalização feito de chifre. “Tocou a trombeta” é claro e corrente em português e preserva sua função no contexto.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: Nesta expressão geográfica, הַר se refere às terras altas de Efraim, não necessariamente a um monte isolado.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel desceram com ele
  rationale: A tradução mantém a forma coletiva masculina do hebraico, adequada ao grupo israelita mobilizado neste contexto, sem acrescentar explicitamente uma identificação militar que o versículo não formula.
- source_word: מִן הָהָר
  choice: da região montanhosa
  rationale: A expressão retoma a mesma zona elevada mencionada anteriormente. A repetição mantém clara a referência geográfica e o movimento de descida.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: e ele estava à frente deles
  rationale: A formulação preserva a declaração espacial do hebraico e deixa implícita, sem a impor, a ideia de liderança.
theological_decisions:
- issue: Valor coletivo e gênero de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: “Filhos de Israel” preserva a forma da expressão hebraica e se ajusta ao provável grupo masculino reunido para o combate, enquanto “os israelitas” seria uma formulação coletiva mais idiomática, porém menos formalmente correspondente.
- issue: Implicação de liderança em וְהוּא לִפְנֵיהֶם
  choice: ele estava à frente deles
  alternative: ele os liderava
  rationale: O texto afirma diretamente a posição de Eúde diante do grupo. Traduzir por “liderava” tornaria explícita uma implicação plausível, mas não lexicalmente necessária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar uma cadeia excessiva de coordenações, sem alterar a progressão narrativa. Não foram incluídas notas porque as alternativas relevantes podem ser registradas nas decisões de tradução sem sobrecarregar um versículo direto.
