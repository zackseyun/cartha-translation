base_translation:
  language: en
  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: pt
  text: Assim, a terra teve descanso durante quarenta anos. Depois, Otniel, filho de Quenaz, morreu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: teve descanso
  rationale: O verbo שׁקט descreve a condição de estar tranquilo, sem perturbação ou opressão. No contexto de Juízes, “teve descanso” comunica naturalmente o período de paz após a libertação sem acrescentar a ideia de prosperidade total.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste contexto, אֶרֶץ se refere ao território de Israel, não ao mundo inteiro. “A terra” preserva a formulação recorrente de Juízes e é clara em português.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: A expressão indica duração. A preposição “durante” torna explícita essa função temporal em português natural.
- source_word: וַיָּמָת
  choice: Depois, ... morreu
  rationale: A forma verbal com waw faz a narrativa avançar. “Depois” expressa a sequência dos acontecimentos sem reproduzir mecanicamente a conjunção hebraica.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Forma portuguesa clara e amplamente reconhecível do nome hebraico.
- source_word: בֶּן קְנַז
  choice: filho de Quenaz
  rationale: A construção hebraica identifica Otniel por sua filiação. “Filho de Quenaz” é a forma natural em português.
