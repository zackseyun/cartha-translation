  naturalness: «Aposento superior», «constrangidos», «no chão» e «seu senhor» são naturais em português moderno de ampla compreensão. «Eis que» é compreensível, mas pode soar mais elevado; «viram que» comunica de modo natural a descoberta narrativa neste contexto.
  terminology: «Senhor» para אֲדֹנֵיהֶם é defensável para um superior humano, e a nota elimina uma possível leitura equivocada como título divino. As alternativas da nota para עֲלִיָּה são úteis e não há problema nos marcadores.
