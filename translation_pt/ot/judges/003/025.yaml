base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: pt
  text: Eles esperaram até ficarem constrangidos[a], e ele ainda não abria as portas do aposento superior[b]. Então pegaram a chave, abriram as portas e viram que seu senhor[c] estava caído no chão, morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «até sentirem vergonha». A expressão hebraica pode indicar vergonha ou constrangimento; aqui, provavelmente descreve o crescente embaraço dos servos enquanto continuavam esperando.
    reason: lexical_alternative
  - marker: b
    text: Ou «quarto de cima» ou «câmara superior».
    reason: lexical_alternative
  - marker: c
    text: Ou «seu mestre». Aqui, a palavra se refere ao superior humano deles, Eglom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: esperaram
  rationale: No contexto, o verbo descreve os servos permanecendo do lado de fora à espera; «esperaram» é natural e fiel à progressão narrativa.
- source_word: עַד בּוֹשׁ
  choice: até ficarem constrangidos
  rationale: A expressão pode envolver vergonha, mas aqui provavelmente indica o crescente constrangimento social dos servos diante da demora; a alternativa é preservada em nota.
- source_word: וְהִנֵּה
  choice: mas / e viram
  rationale: As duas ocorrências assinalam descobertas ou mudanças vívidas na narrativa. Em português corrente, «mas» marca a expectativa frustrada na primeira e «e viram» explicita naturalmente a descoberta visual na segunda, sem recorrer ao solene «eis que».
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: ele não abria
  rationale: A construção expressa a não realização continuada da ação naquele momento. O imperfeito português comunica adequadamente que ele continuava sem abrir.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: as portas do aposento superior
  rationale: Mantém o plural hebraico e traduz עֲלִיָּה como um cômodo situado na parte superior; outras possibilidades constam na nota.
- source_word: הַמַּפְתֵּחַ
  choice: a chave
  rationale: Equivalente direto e inequívoco.
- source_word: וַיִּפְתָּחוּ
  choice: abriram as portas
  rationale: O objeto está implícito no hebraico e é retomado explicitamente em português para maior clareza.
- source_word: אֲדֹנֵיהֶם
  choice: seu senhor
  rationale: Designa Eglom como superior humano dos servos. «Senhor» conserva a amplitude do termo hebraico, e a nota impede que seja entendido como título divino.
- source_word: נֹפֵל אַרְצָה
  choice: caído no chão
  rationale: O particípio apresenta o estado em que o corpo foi encontrado, enquanto אַרְצָה indica a superfície abaixo; «no chão» é natural num ambiente interno sem restringir indevidamente a imagem.
- source_word: מֵת
  choice: morto
  rationale: Predicativo direto que descreve a condição de Eglom ao ser encontrado.
theological_decisions:
- issue: Sentido de אֲדֹנֵיהֶם
  choice: seu senhor, entendido como o superior humano Eglom
  alternative: seu mestre
  rationale: O contexto não se refere ao Senhor divino. «Senhor» preserva a correspondência lexical, com esclarecimento em nota, sem introduzir distinção teológica inexistente no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação evita arcaísmos como «eis que», preserva a progressão vívida da narrativa e mantém em notas as ambiguidades lexicais genuínas.
