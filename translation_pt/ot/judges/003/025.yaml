  to: Eles esperaram até ficarem constrangidos[a], e ele ainda não abria as portas do aposento superior[b]. Então pegaram a chave, abriram as portas e viram que seu senhor[c] estava caído no chão, morto.
  rationale: Substituí «mas ele não abria» por «e ele ainda não abria» para não introduzir uma adversativa ausente do texto hebraico e para transmitir naturalmente a não ação continuada no contexto. Também explicitei a descoberta final com «viram que», uma forma idiomática em português que representa o efeito narrativo de וְהִנֵּה sem exigir uma formulação arcaizante.
