base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: pt
  text: os cinco governantes dos filisteus, todos os cananeus, os sidônios e os heveus que habitavam a região montanhosa do Líbano, desde o monte Baal-Hermom até Lebo-Hamate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a entrada de Hamate”. A expressão hebraica pode ser entendida como o nome de um lugar, Lebo-Hamate, ou de forma descritiva.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: os cinco governantes dos filisteus
  rationale: A forma construta expressa um grupo definido de cinco líderes políticos filisteus. “Governantes” comunica a função sem sugerir títulos feudais ou persas.
- source_word: וְכָל הַכְּנַעֲנִי
  choice: todos os cananeus
  rationale: O singular étnico hebraico tem sentido coletivo; o plural é a forma natural e clara em português.
- source_word: וְהַצִּידֹנִי
  choice: os sidônios
  rationale: O gentílico singular hebraico é coletivo e, por isso, foi vertido naturalmente no plural.
- source_word: וְהַחִוִּי
  choice: os heveus
  rationale: O gentílico singular hebraico designa coletivamente esse povo; “heveus” é a forma tradicional e inteligível em português.
- source_word: יֹשֵׁב
  choice: que habitavam
  rationale: O particípio singular concorda formalmente com o coletivo “heveu”, mas em português a oração relativa no plural concorda naturalmente com “os heveus”.
- source_word: הַר הַלְּבָנוֹן
  choice: a região montanhosa do Líbano
  rationale: Embora a expressão seja literalmente “monte/montanha do Líbano”, neste contexto indica a área montanhosa, não necessariamente um único pico.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: desde o monte Baal-Hermom
  rationale: Mantém o topônimo e explicita, de modo natural em português, o ponto inicial da extensão geográfica.
- source_word: עַד לְבוֹא חֲמָת
  choice: até Lebo-Hamate
  rationale: A expressão pode funcionar como topônimo conhecido. A tradução principal preserva esse nome próprio, enquanto a nota registra a leitura descritiva possível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os gentílicos coletivos foram vertidos no plural. O marcador da nota foi colocado junto a “Lebo-Hamate”, expressão à qual a variante se refere.
