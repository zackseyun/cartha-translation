  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: pt
  text: Assim, naquele dia, Moabe foi subjugado sob a mão de Israel[a], e a terra teve descanso[b] durante oitenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica que significa estar sob o poder ou domínio de Israel.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ficou tranquila” ou “ficou em paz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: foi subjugado
  rationale: 'O nifal de כנע tem aqui sentido passivo e resultativo: Moabe foi colocado em sujeição. A expressão preserva o caráter militar e político sem sugerir aniquilação.'
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da nação.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Reproduz de modo natural em português a expressão temporal e sua força demonstrativa.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: sob a mão de Israel
  rationale: Mantém a imagem concreta do hebraico e, com a nota, comunica claramente a ideia de domínio ou poder.
- source_word: וַתִּשְׁקֹט
  choice: teve descanso
  rationale: No contexto recorrente de Juízes, o verbo descreve a tranquilidade resultante da cessação de conflitos. A formulação também preserva a linguagem bíblica sem deixar de ser compreensível.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Equivalente direto que, no contexto, designa a terra ou região de Israel sem ampliar para uma noção moderna de Estado ou país.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: durante oitenta anos
  rationale: A preposição explicita de forma idiomática em português que se trata da duração do período.
theological_decisions:
- issue: Natureza do domínio de Israel sobre Moabe
  choice: Subjugação militar e política expressa pela imagem bíblica de estar sob a mão de Israel
  alternative: Humilhação apenas figurada ou aniquilação total
  rationale: O texto relata que Moabe foi colocado sob o poder de Israel e que disso resultou descanso para a terra; não afirma nem mera humilhação emocional nem extermínio.
- issue: Sentido do descanso da terra
  choice: Período de tranquilidade e cessação de conflito
  alternative: Repouso absoluto ou ausência de toda dificuldade
  rationale: שקט indica quietude ou liberdade de perturbação no âmbito narrativo, sem exigir a afirmação de paz perfeita em todos os sentidos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluência, enquanto a imagem hebraica “sob a mão” foi preservada e explicada em nota.
