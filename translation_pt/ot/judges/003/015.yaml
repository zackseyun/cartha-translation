  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: pt
  text: 'Então os filhos de Israel clamaram a Yahweh, e Yahweh levantou para eles um libertador: Eúde, filho de Gera, benjamita, um homem com limitação na mão direita[a]. E os filhos de Israel enviaram por sua mão um tributo a Eglom, rei de Moabe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradução tradicional, “um homem canhoto”. O hebraico descreve literalmente Eúde como alguém limitado ou restringido na mão direita.
    reason: Preserva a alternativa lexical tradicional sem eliminar a formulação incomum e ambígua do hebraico no texto principal.
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: clamaram
  rationale: O verbo expressa um clamor de aflição e apelo; “clamaram” conserva a urgência sem explicitar um pedido de ajuda apenas implícito.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo inteligível o idioma hebraico e sua forma coletiva, sem substituí-lo por uma designação menos transparente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: levantou para eles um libertador
  rationale: Mantém a fórmula recorrente de Deus levantar um agente humano que livra Israel; “libertador” se ajusta ao contexto histórico de Juízes.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: Eúde, filho de Gera
  rationale: Emprega as formas portuguesas convencionais dos nomes e reproduz a relação de filiação.
- source_word: בֶּן הַיְמִינִי
  choice: benjamita
  rationale: A expressão funciona como gentílico e identifica a afiliação tribal de Eúde.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: homem com a mão direita limitada
  rationale: Conserva a formulação incomum do hebraico, que descreve alguma limitação ou restrição da mão direita, sem decidir no texto principal que Eúde era simplesmente canhoto.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: enviaram pela mão dele
  rationale: Preserva a imagem hebraica da mão e a possível ressonância narrativa com a descrição anterior, embora a expressão indique que Eúde foi o portador do tributo.
- source_word: מִנְחָה
  choice: tributo
  rationale: No contexto político, designa o pagamento entregue por um povo subjugado ao governante dominador, não uma oferta de culto.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: a Eglom, rei de Moabe
  rationale: Reproduz naturalmente em português o nome próprio e o título real em aposição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido de מוֹשִׁיעַ aplicado a Eúde
  choice: libertador
  alternative: salvador; resgatador
  rationale: Aqui o termo designa o agente humano levantado por Deus para livrar Israel da opressão; “libertador” comunica esse sentido sem antecipar conotações teológicas mais amplas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve cadência bíblica. Mantiveram-se “filhos de Israel”, “levantou” e “pela mão dele” para refletir imagens relevantes do hebraico, enquanto a pontuação e a ordem dos elementos foram ajustadas à fluência portuguesa.
