- from: 'Então os filhos de Israel clamaram a Yahweh, e Yahweh levantou para eles um libertador: Eúde, filho de Gera, benjamita, homem com a mão direita limitada[a]. E os filhos de Israel enviaram pela mão dele um tributo a Eglom, rei de Moabe.'
  to: 'Então os filhos de Israel clamaram a Yahweh, e Yahweh levantou para eles um libertador: Eúde, filho de Gera, benjamita, um homem com limitação na mão direita[a]. E os filhos de Israel enviaram por sua mão um tributo a Eglom, rei de Moabe.'
  rationale: 'Foram feitas apenas duas adequações de idiomaticidade: «com limitação na mão direita» exprime naturalmente uma limitação não especificada, preservando a cautela exigida pelo hebraico אִטֵּר יַד־יְמִינוֹ; e «por sua mão» conserva a formulação de agência de בְּיָדוֹ em português bíblico fluente. A nota, seu marcador e o sentido do versículo foram preservados.'
