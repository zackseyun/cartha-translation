base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: pt
  text: 'Então Eúde foi até ele, enquanto Eglom estava sentado em seu aposento superior fresco[a], que tinha só para si. Eúde disse: “Tenho uma palavra de Deus[b] para você”. Então ele se levantou do assento[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sala superior fresca”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma mensagem de Deus”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “de sobre o assento”; “cadeira” ou “trono” também são possíveis, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: foi até
  rationale: No movimento narrativo, Eúde se dirige a Eglom. “Foi até” expressa a aproximação com naturalidade em português sem especificar indevidamente o modo.
- source_word: יֹשֵׁב
  choice: estava sentado
  rationale: O particípio hebraico apresenta uma ação em curso como pano de fundo da chegada de Eúde.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: quarto fresco no terraço
  rationale: עֲלִיָּה designa um aposento superior ou construído no terraço, e מְקֵרָה provavelmente caracteriza o ambiente como fresco ou ventilado. A formulação preserva os sentidos arquitetônico e climático em português claro.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: sozinho
  rationale: A expressão enfatiza que Eglom estava sem companhia e tinha o aposento só para si; “sozinho” comunica de modo conciso a função narrativa principal.
- source_word: דְּבַר אֱלֹהִים
  choice: uma palavra de Deus
  rationale: A locução pode indicar uma comunicação divina. “Uma palavra de Deus” mantém o vínculo lexical com דָּבָר e evita tornar a expressão mais técnica do que o hebraico exige.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, aqui o uso mais natural é singular. “Deus” preserva a leitura contextual sem desenvolver as implicações da fala de Eúde.
- source_word: וַיָּקָם
  choice: ele se levantou
  rationale: É a forma narrativa natural em português para o ato de erguer-se de onde estava sentado.
- source_word: מֵעַל הַכִּסֵּא
  choice: do assento
  rationale: כִּסֵּא pode significar assento, cadeira ou trono. O termo mais amplo evita impor a imagem de uma audiência régia formal ao cenário privado.
theological_decisions:
- issue: Sentido de אֱלֹהִים na declaração de Eúde
  choice: Deus
  alternative: deuses
  rationale: אֱלֹהִים é frequentemente singular no hebraico bíblico, e “uma palavra de Deus” é a leitura mais natural desta construção e do contexto. A tradução relata a alegação de Eúde sem confirmar nem explicar sua natureza teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem das notas foi ajustada para que cada marcador corresponda ao termo efetivamente anotado no texto.
