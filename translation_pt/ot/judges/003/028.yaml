base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: pt
  text: 'Ele lhes disse: “Sigam-me[a], pois Yahweh entregou nas mãos de vocês os seus inimigos, Moabe[b].” Então eles desceram atrás dele, tomaram os vaus do Jordão em direção a Moabe[c] e não deixaram ninguém atravessar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sigam atrás de mim”.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “Moabe” está em aposição a “os seus inimigos”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os pontos de travessia do Jordão para Moabe”; no contexto, a expressão também pode ser entendida como “contra Moabe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: Sigam-me
  rationale: O verbo רדף normalmente expressa perseguição, mas aqui Eúde convoca seus aliados a avançarem sob sua liderança. “Sigam-me” é natural em português e preserva a função da ordem; a nuance militar de perseguição é registrada em nota.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: entregou nas mãos de vocês
  rationale: A expressão hebraica significa colocar alguém sob o poder de outro. A formulação mantém a imagem das mãos e comunica com clareza uma ação já apresentada como realizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: os seus inimigos, Moabe
  rationale: Mantém “Moabe” como nome da nação em aposição a “seus inimigos”, sem substituir o nome pelo gentílico “moabitas”.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: eles desceram atrás dele
  rationale: Preserva tanto o movimento descendente da região montanhosa para o vale do Jordão quanto o fato de seguirem Eúde.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: os vaus do Jordão
  rationale: “Vaus” designa com precisão os lugares rasos usados para atravessar o rio e se ajusta ao contexto militar.
- source_word: לְמוֹאָב
  choice: em direção a Moabe
  rationale: A preposição ל pode indicar direção, destinação ou relação hostil no contexto. A tradução conserva o sentido direcional mais imediato, enquanto a nota registra a alternativa contextual.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: não deixaram ninguém atravessar
  rationale: Expressa em português corrente o idioma hebraico literalmente formulado como “não deram a um homem que atravessasse”, preservando a proibição total.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título; “Yahweh” o representa diretamente por transliteração.
- issue: Moabe como entidade nacional coletiva
  choice: Moabe
  alternative: os moabitas
  rationale: O hebraico nomeia a nação e a coloca em aposição a “seus inimigos”. Manter “Moabe” evita acrescentar um gentílico ausente do texto e conserva a personificação coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e mantém termos geográficos precisos. A ordem inicial é idiomática, enquanto as notas preservam as ambiguidades lexicais e sintáticas relevantes.
