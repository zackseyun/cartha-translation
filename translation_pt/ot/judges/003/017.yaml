  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: pt
  text: Ele apresentou o tributo a Eglom, rei de Moabe.[a] E Eglom era um homem muito gordo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presente” ou “oferta”. O hebraico minḥá pode designar uma oferta ou um presente, mas aqui provavelmente se refere ao tributo pago por um povo subjugado a um governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: apresentou
  rationale: O hifil de קרב indica aqui levar e apresentar algo diante de um superior; “apresentou” expressa naturalmente a entrega formal ao rei.
- source_word: הַמִּנְחָה
  choice: o tributo
  rationale: No contexto da submissão de Israel a Moabe, מִנְחָה designa provavelmente o pagamento ou presente exigido por um soberano, por isso “tributo” comunica melhor a dimensão política.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: a Eglom, rei de Moabe
  rationale: Mantém o nome próprio e traduz o título em uma aposição clara e natural em português.
- source_word: וְעֶגְלוֹן
  choice: E Eglom
  rationale: Preserva a conjunção hebraica que introduz a observação descritiva, sem tornar a ligação artificial em português.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo masculino singular refere-se especificamente a Eglom.
- source_word: בָּרִיא מְאֹד
  choice: muito gordo
  rationale: בָּרִיא descreve aqui a corpulência física, relevante para o desenvolvimento posterior da narrativa; “muito gordo” é direto, corrente e fiel, e מְאֹד fornece a intensificação.
