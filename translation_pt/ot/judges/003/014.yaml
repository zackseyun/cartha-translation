base_translation:
  language: en
  yaml_path: translation/ot/judges/003/014.yaml
  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: pt
  text: E os filhos de Israel serviram a Eglom, rei de Moabe, durante dezoito anos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “E os israelitas ficaram sujeitos a Eglom, rei de Moabe, durante dezoito anos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: O verbo עבד, neste contexto, indica serviço imposto ou sujeição política a um governante estrangeiro, não culto. “Serviram” preserva a formulação hebraica e permite que o contexto comunique a natureza dessa relação.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto o idioma hebraico e preserva sua forma coletiva marcada pelo gênero, embora “os israelitas” seja mais idiomático em português.
- source_word: אֶת עֶגְלוֹן
  choice: a Eglom
  rationale: אֶת assinala o objeto direto definido. Em português, o objeto pessoal é introduzido naturalmente por “a”; o nome עֶגְלוֹן é transliterado na forma portuguesa tradicional “Eglom”.
- source_word: מֶלֶךְ מוֹאָב
  choice: rei de Moabe
  rationale: A cadeia construta hebraica é traduzida naturalmente como “rei de Moabe”; em aposição ao nome próprio, não requer artigo.
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: durante dezoito anos
  rationale: O acusativo hebraico de duração é expresso com clareza e naturalidade por “durante dezoito anos”.
