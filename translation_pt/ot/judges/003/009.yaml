base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: pt
  text: 'Então os filhos de Israel[a] clamaram a Yahweh, e Yahweh levantou para os filhos de Israel um libertador[b], que os libertou: Otniel, filho de Quenaz, irmão mais novo de Calebe[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Literalmente: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Libertador” também pode ser traduzido por “salvador” ou “resgatador”; aqui o hebraico se refere a um agente humano levantado por Deus para livrar Israel.
    reason: lexical_alternative
  - marker: c
    text: 'Isto é, Otniel era irmão de Calebe e mais novo do que ele. A expressão hebraica também pode ser traduzida de forma mais literal: “o irmão de Calebe, mais novo do que ele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: clamaram
  rationale: O verbo זעק expressa aqui um clamor urgente por socorro dirigido a Deus; “clamaram” preserva tanto a intensidade quanto o tom digno da narrativa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar hebraica de modo claro em português, sem apagar sua forma original; a alternativa idiomática “os israelitas” é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּקֶם
  choice: levantou
  rationale: No hifil, קום indica que Yahweh fez surgir ou estabeleceu alguém para determinada função; “levantou” conserva a imagem e é natural neste contexto.
- source_word: מוֹשִׁיעַ
  choice: libertador
  rationale: O particípio de ישׁע designa aqui um agente humano que resgata Israel da opressão; “libertador” se ajusta ao contexto histórico e militar de Juízes.
- source_word: וַיּוֹשִׁיעֵם
  choice: que os libertou
  rationale: A oração relativa identifica Otniel como o libertador e expressa o resgate concreto de Israel, mantendo a ligação lexical com “libertador”.
- source_word: אֵת עָתְנִיאֵל בֶּן קְנַז
  choice: Otniel, filho de Quenaz
  rationale: Emprega as formas portuguesas correntes dos nomes e apresenta a identificação em aposição, conforme a estrutura hebraica.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: irmão mais novo de Calebe
  rationale: A leitura mais natural entende Otniel como irmão de Calebe e mais novo do que ele. “Mais novo” preserva o comparativo, sem afirmar que era o caçula.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido de מוֹשִׁיעַ neste contexto
  choice: libertador
  alternative: salvador; resgatador
  rationale: Em Juízes, a palavra se refere a um agente humano levantado por Deus para livrar Israel da opressão. “Libertador” comunica esse papel sem restringir nem ampliar indevidamente o campo semântico.
- issue: Relação expressa por אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: irmão mais novo de Calebe
  alternative: o irmão de Calebe, mais novo do que ele
  rationale: A construção é compacta e pode gerar dúvida quanto à vinculação do comparativo; a tradução segue a leitura sintática mais natural, mas registra a formulação mais explícita em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “filhos de Israel” e a relação lexical entre “libertador” e “libertou” foram mantidas para refletir a coesão do hebraico. Os nomes seguem formas portuguesas correntes.
