base_translation:
  language: en
  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: pt
  text: E os filhos de Israel[a] viviam no meio dos cananeus, dos hititas, dos amorreus, dos ferezeus, dos heveus e dos jebuseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Israel”. Também se pode traduzir de modo mais idiomático como “os israelitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: E os filhos de Israel
  rationale: בְּנֵי significa literalmente “filhos de”. A expressão familiar é preservada por ser clara em português e por manter a forma masculina plural do hebraico; “os israelitas” seria uma alternativa mais idiomática.
- source_word: יָשְׁבוּ
  choice: viviam
  rationale: O verbo יָשַׁב pode significar sentar-se, habitar, viver ou permanecer. Aqui descreve residência contínua entre os povos da terra; “viviam” é natural e atual, sem a possível ênfase inicial de “estabeleceram-se”.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: A expressão indica estar dentro ou em meio a um grupo. “No meio de” preserva essa imagem espacial e relacional de modo natural em português.
- source_word: הַכְּנַעֲנִי; הַחִתִּי; הָאֱמֹרִי; הַפְּרִזִּי; הַחִוִּי; הַיְבוּסִי
  choice: os cananeus, os hititas, os amorreus, os ferezeus, os heveus e os jebuseus
  rationale: Embora cada gentílico esteja morfologicamente no singular, todos têm sentido coletivo. O plural é a forma idiomática em português para enumerar esses povos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas tradicionais e reconhecíveis dos nomes dos povos. A construção “filhos de Israel” mantém a expressão familiar do hebraico, enquanto “viviam no meio de” comunica residência contínua sem arcaísmo.
