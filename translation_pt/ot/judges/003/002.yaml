  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: pt
  text: somente para que as gerações dos filhos de Israel[a] conhecessem a guerra, para ensiná-los a guerrear — somente aqueles que antes não a conheciam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “israelitas”. Literalmente: “filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não tinham tido experiência de guerra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: somente
  rationale: A partícula restringe a finalidade e ocorre duas vezes; a repetição foi preservada.
- source_word: לְמַעַן דַּעַת
  choice: para que ... conhecessem
  rationale: Expressa finalidade e mantém o sentido amplo do verbo ידע, “conhecer”.
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: as gerações dos filhos de Israel
  rationale: Reproduz a relação de construção hebraica e conserva a expressão corporativa tradicional, deixando a forma idiomática em nota.
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: para ensiná-los a guerrear
  rationale: Em português, o infinitivo verbal torna natural a construção em que “guerra” é aquilo que se ensina, sem reduzir o sentido ao de uma batalha específica.
- source_word: אֲשֶׁר לְפָנִים לֹא יְדָעוּם
  choice: aqueles que antes não a conheciam
  rationale: Preserva a referência temporal e o verbo “conhecer”; o pronome feminino retoma “a guerra”.
theological_decisions:
- issue: Expressão corporativa בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A expressão hebraica foi mantida de modo formal no texto, sem sugerir que a referência corporativa se limite aos homens; a forma portuguesa mais idiomática aparece em nota.
- issue: Sentido de “conhecer a guerra”
  choice: não a conheciam
  alternative: não tinham experiência de guerra
  rationale: Mantém a amplitude semântica de ידע e evita decidir se o foco recai sobre conhecimento, aprendizado ou experiência direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “somente” e a tensão entre “conhecer” e “ensinar” foram preservadas; a pontuação esclarece a aposição sem eliminar a ambiguidade sintática do hebraico.
