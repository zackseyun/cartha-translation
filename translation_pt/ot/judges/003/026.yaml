base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: pt
  text: Mas Eúde escapou enquanto eles se demoravam; passou pelas imagens esculpidas[a] e escapou para Seirá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelos ídolos” ou “pelas imagens talhadas”.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser transliterado “Seirate”.
    reason: alternative_reading
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: escapou / fugiu
  rationale: O nifal de מלט indica livrar-se efetivamente do perigo. A variação natural em português evita repetição pouco fluente, sem perder a progressão entre a evasão inicial e a fuga para um lugar seguro.
- source_word: עַד הִתְמַהְמְהָם
  choice: enquanto eles se demoravam
  rationale: A construção tem valor temporal neste contexto, e o hitpael de מהה expressa demora ou hesitação prolongada dos servos.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: passou pelas imagens esculpidas
  rationale: עבר com objeto direto, em contexto de deslocamento, descreve a passagem por um marco conhecido. 'Passou pelas' é natural e não força a ideia mais específica de ter ido para além delas.
- source_word: הַפְּסִילִים
  choice: as imagens esculpidas
  rationale: פסילים designa objetos talhados, provavelmente de caráter cultual. A tradução formal preserva o sentido lexical sem explicitar como certeza a interpretação 'ídolos'.
- source_word: הַשְּׂעִירָתָה
  choice: para Seirá
  rationale: O he direcional indica movimento rumo ao lugar chamado Seirá; o topônimo é transliterado em forma legível em português.
- source_word: וְ
  choice: Mas
  rationale: A conjunção introduz contraste narrativo com a demora dos servos descrita no contexto anterior.
theological_decisions: []
