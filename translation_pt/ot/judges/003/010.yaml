base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: pt
  text: O Espírito de Yahweh veio sobre ele[a], e ele julgou Israel. Ele saiu para a batalha, e Yahweh entregou Cusã-Risataim, rei de Arã[b], em sua mão, e a sua mão prevaleceu sobre Cusã-Risataim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Espírito de Yahweh estava sobre ele”. A expressão hebraica também pode ser entendida de maneira mais estática, embora o contexto narrativo favoreça “veio sobre ele”.'
    reason: lexical_alternative
  - marker: b
    text: Arã é o nome hebraico que, em traduções mais antigas, muitas vezes aparece como “Síria”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: O Espírito de Yahweh veio sobre ele
  rationale: A construção היה על com רוּחַ pode indicar que o Espírito passou a estar sobre alguém para capacitá-lo. “Veio sobre ele” é natural em português e se ajusta ao início narrativo dessa capacitação, sem excluir a nuance mais estática indicada na nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: e ele julgou Israel
  rationale: Mantém o sentido lexical e a terminologia característica do livro de Juízes; no contexto, o verbo pode abranger liderança e libertação.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: Ele saiu para a batalha
  rationale: Expressa de modo corrente o idioma militar hebraico, conservando a sequência narrativa.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: Yahweh entregou em suas mãos
  rationale: Comunica o idioma de colocar o inimigo sob o poder de alguém, preservando em português a imagem da mão.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Cusã-Risataim
  rationale: Transliteração adaptada à ortografia e à leitura portuguesas do nome próprio composto.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Reproduz diretamente o topônimo hebraico, evitando a identificação tradicional e potencialmente anacrônica com “Síria”.
- source_word: וַתָּעָז יָדוֹ עַל
  choice: sua mão prevaleceu sobre
  rationale: Preserva a metáfora hebraica da mão forte e expressa claramente domínio sobre o adversário.
theological_decisions:
- issue: Descrição da atuação do Espírito divino
  choice: O Espírito de Yahweh veio sobre ele
  alternative: O Espírito de Yahweh estava sobre ele
  rationale: A tradução apresenta a capacitação divina de Otniel sem acrescentar elaboração doutrinária posterior; a nota conserva a ambiguidade aspectual da expressão hebraica.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto-fonte contém o nome próprio divino יהוה; a transliteração o distingue de um título.
- issue: Identificação geográfica de אֲרָם
  choice: Arã
  alternative: Síria
  rationale: O topônimo do original é mantido, sem impor uma equivalência geográfica tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se “julgou” e as imagens hebraicas da mão para preservar a linguagem própria de Juízes, enquanto a sintaxe permanece natural.
