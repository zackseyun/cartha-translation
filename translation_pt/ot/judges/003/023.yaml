base_translation:
  language: en
  yaml_path: translation/ot/judges/003/023.yaml
  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: pt
  text: Então Eúde saiu para o vestíbulo[a], fechou atrás de si as portas do aposento superior e as trancou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o pórtico”, “para a antecâmara” ou “para a colunata”; o termo hebraico é raro e se refere a um espaço arquitetônico adjacente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O qal narrativo de יצא expressa a saída de Eúde do aposento e é vertido naturalmente por “saiu”.
- source_word: הַמִּסְדְּרוֹנָה
  choice: para o vestíbulo
  rationale: מִסְדְּרוֹן é um termo arquitetônico raro para um espaço adjacente. “Vestíbulo” mantém essa generalidade, e o ה direcional indica movimento para esse espaço.
- source_word: וַיִּסְגֹּר
  choice: fechou
  rationale: סגר significa fechar; “fechou” é a formulação portuguesa natural com “portas”.
- source_word: דַּלְתוֹת
  choice: as portas
  rationale: O plural pode designar portas duplas ou suas folhas; “as portas” preserva o plural sem impor uma reconstrução arquitetônica.
- source_word: הָעֲלִיָּה
  choice: do aposento superior
  rationale: עֲלִיָּה designa um cômodo ou câmara na parte superior; “aposento superior” é claro, digno e arquitetonicamente adequado.
- source_word: בַּעֲדוֹ
  choice: atrás de si
  rationale: Com o verbo “fechar”, בעד indica que Eúde fechou as portas depois de passar por elas. “Atrás de si” comunica essa relação espacial sem ambiguidade pronominal.
- source_word: וְנָעָל
  choice: e as trancou
  rationale: Neste contexto, נעל significa prender ou trancar as portas. O pronome “as” retoma naturalmente “as portas”.
