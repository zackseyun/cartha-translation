base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: pt
  text: '“Por favor, não saia daqui até que eu venha até você, traga a minha oferta[a] e a coloque diante de você.” Ele respondeu: “Ficarei aqui até você voltar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presente” ou “tributo”; o termo hebraico pode designar, de modo amplo, algo apresentado e, em certos contextos, uma oferta.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: saia daqui
  rationale: O verbo מוש indica afastar-se ou partir; em português corrente, “não saia daqui” expressa naturalmente o pedido para que o visitante permaneça no lugar.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: até que eu volte a você
  rationale: A construção infinitiva é vertida como oração finita idiomática. “Volte” é apropriado porque Gideão se ausentará para buscar e preparar o que apresentará.
- source_word: וְהוֹצֵאתִי
  choice: traga
  rationale: O hifil de יצא significa fazer sair ou trazer para fora. No contexto, “traga” comunica com clareza que Gideão buscará e apresentará o que preparou.
- source_word: מִנְחָתִי
  choice: minha oferta
  rationale: מִנְחָה pode designar presente, tributo ou oferta. “Oferta” mantém a ressonância religiosa adquirida na narrativa sem restringir indevidamente o termo a uma oferta de cereais.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: e a coloque diante de você
  rationale: A expressão significa pôr algo na presença de alguém; a formulação é clara, natural e digna em português moderno.
- source_word: אָנֹכִי אֵשֵׁב
  choice: Ficarei aqui
  rationale: Embora ישב possa significar literalmente “sentar-se”, aqui comunica permanência no local. “Ficarei aqui” torna explícito o sentido contextual sem alterar a ação.
- source_word: עַד שׁוּבֶךָ
  choice: até você voltar
  rationale: O infinitivo com sufixo é naturalmente expresso por uma oração finita em português.
- source_word: נָא
  choice: Por favor
  rationale: A partícula marca uma súplica cortês; “por favor” reproduz esse tom em linguagem moderna.
theological_decisions:
- issue: Sentido de מִנְחָה na apresentação de Gideão
  choice: oferta
  alternative: presente; tributo; oferta de cereais
  rationale: O contexto passa de uma refeição apresentada ao visitante para um ato de evidente caráter sagrado. “Oferta” preserva essa tensão e ressonância sem definir antecipadamente a apresentação como uma categoria sacrificial específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala mantém a cortesia de Gideão e evita linguagem arcaica. O pronome “você” oferece naturalidade internacional com forte legibilidade no Brasil.
