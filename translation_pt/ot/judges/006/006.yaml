base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: pt
  text: Assim, Israel ficou muito enfraquecido por causa de Midiã[a], e os filhos de Israel clamaram a Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi profundamente abatido” ou “ficou muito pobre”. O verbo hebraico pode indicar que alguém foi reduzido, enfraquecido ou levado a uma condição humilhante.
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל ... מְאֹד
  choice: ficou extremamente enfraquecido
  rationale: O verbo דל descreve Israel como reduzido, debilitado ou humilhado sob a opressão; מְאֹד intensifica esse estado. A formulação evita restringir o sentido à pobreza econômica.
- source_word: מִפְּנֵי מִדְיָן
  choice: por causa de Midiã
  rationale: Neste contexto, מִפְּנֵי expressa a causa da condição debilitada de Israel; “por causa de” é claro e idiomático.
- source_word: וַיִּזְעֲקוּ
  choice: clamaram
  rationale: זעק indica um clamor urgente em situação de aflição. “Clamaram” preserva tanto a intensidade quanto a direção do apelo a Deus.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica e sua função como designação coletiva do povo da aliança.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: אֶל indica a direção do clamor, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: A transliteração preserva no texto o nome pessoal da aliança, enquanto a nota registra a tradição de vertê-lo por “o SENHOR”.
- issue: Sentido coletivo de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução mantém a forma masculina explícita do hebraico sem negar que, no uso contextual, a expressão designa coletivamente o povo de Israel.
- issue: Amplitude semântica de וַיִּדַּל
  choice: ficou extremamente enfraquecido
  alternative: ficou muito pobre
  rationale: O contexto inclui devastação econômica, mas o verbo também pode comunicar redução e abatimento mais amplos; a escolha preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Extremamente enfraquecido” preserva a abrangência do hebraico; “clamaram” é corrente no registro bíblico sem ser arcaico.
