source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: pt
  text: Então Gideão tomou dez homens dentre os seus servos e fez conforme Yahweh lhe havia falado. Mas, como tinha medo da casa de seu pai e dos homens da cidade, não fez isso durante o dia[a]; fez à noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “de fazer isso durante o dia”; a ideia é que o medo o impediu de agir durante o dia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: O verbo לקח tem aqui seu sentido narrativo comum, “tomar”; “tomou” é direto e natural no contexto.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dez homens
  rationale: Mantém a referência masculina explícita do hebraico.
- source_word: מֵעֲבָדָיו
  choice: dentre os seus servos
  rationale: “Dentre” expressa o valor partitivo de מִן; “servos” preserva a amplitude contextual de עֶבֶד sem afirmar uma condição jurídica que o versículo não destaca.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: fez conforme Yahweh lhe havia ordenado
  rationale: “Conforme” preserva a correspondência entre a fala divina e a ação de Gideão. Neste contexto, “ordenado” comunica naturalmente que a fala mencionada era uma instrução, embora o hebraico use literalmente “falado”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Mas, como
  rationale: Introduz com naturalidade em português a circunstância explicativa e a mudança narrativa, sem reproduzir de modo rígido a fórmula hebraica.
- source_word: יָרֵא
  choice: tinha medo
  rationale: Expressa em português corrente o temor de Gideão diante de pessoas.
- source_word: בֵּית אָבִיו
  choice: a casa de seu pai
  rationale: 'Conserva a expressão hebraica e sua possível abrangência social: família, dependentes e unidade doméstica, não apenas o edifício.'
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Preserva a referência específica aos homens, em vez de ampliá-la para todos os habitantes.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: não fez isso durante o dia
  rationale: Torna explícito o efeito impeditivo do medo, implícito na construção hebraica com מִן e infinitivo, mantendo a nota com a forma mais literal.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: fez à noite
  rationale: É uma formulação portuguesa natural e mantém o contraste com “durante o dia”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título, sem inserir uma interpretação denominacional.
- issue: Alcance de בֵּית אָבִיו
  choice: a casa de seu pai
  alternative: a família de seu pai; a casa paterna
  rationale: A formulação escolhida preserva a possível amplitude da unidade doméstica e familiar, sem limitá-la ao prédio nem defini-la apenas como parentesco.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação final foi dividida por ponto e vírgula para conservar o contraste entre dia e noite sem peso sintático excessivo.
