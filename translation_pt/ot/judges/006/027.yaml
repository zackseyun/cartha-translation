revisions:
- from: Então Gideão tomou dez homens dentre os seus servos e fez conforme Yahweh lhe havia ordenado. Mas, como tinha medo da casa de seu pai e dos homens da cidade, não fez isso durante o dia[a]; fez à noite.
  to: Então Gideão tomou dez homens dentre os seus servos e fez conforme Yahweh lhe havia falado. Mas, como tinha medo da casa de seu pai e dos homens da cidade, não fez isso durante o dia[a]; fez à noite.
  rationale: A revisão substitui «ordenado» por «falado», refletindo diretamente o verbo hebraico sem negar que a fala divina, no contexto, contenha instruções. A nota é ajustada para uma formulação portuguesa correta e transparente da alternativa mais literal. O restante da tradução é mantido.
