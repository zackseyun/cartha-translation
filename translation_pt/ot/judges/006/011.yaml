  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: pt
  text: Então o anjo de Yahweh veio e sentou-se debaixo do terebinto[a] que ficava em Ofra e pertencia a Joás, do clã de Abiezer[b]. Gideão, filho de Joás, estava malhando trigo no lagar, para escondê-lo dos midianitas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carvalho”. A identificação exata da árvore indicada pelo termo hebraico é incerta.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o abiezrita”, isto é, membro do clã de Abiezer.'
    reason: cultural_clarification
  - marker: c
    text: 'Hebraico: “de Midiã”, usando o nome do povo de forma coletiva.'
    reason: literal_form
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar mensageiro ou anjo; neste relato, o contexto favorece um mensageiro celestial, sem definir além disso sua identidade.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: veio e sentou-se
  rationale: Reproduz de modo natural a sequência narrativa concreta dos dois verbos hebraicos.
- source_word: הָאֵלָה
  choice: o terebinto
  rationale: אֵלָה designa uma árvore de grande porte, comumente identificada como terebinto; a alternativa tradicional 'carvalho' é preservada em nota.
- source_word: בְּעָפְרָה
  choice: em Ofra
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: אֲשֶׁר לְיוֹאָשׁ אֲבִי הָעֶזְרִי
  choice: pertencia a Joás, do clã de Abiezer
  rationale: Explicita em português natural tanto a posse quanto a afiliação clânica indicada pelo gentílico hebraico.
- source_word: חֹבֵט חִטִּים
  choice: estava malhando trigo
  rationale: חבט descreve o ato concreto de bater o cereal para separar os grãos; 'malhando trigo' conserva essa imagem melhor que o termo mais amplo 'debulhando'.
- source_word: בַּגַּת
  choice: no lagar
  rationale: 'Mantém a localização incomum indicada pela preposição hebraica: Gideão trabalhava dentro do lagar, lugar usado para prensar uvas.'
- source_word: לְהָנִיס
  choice: para escondê-lo
  rationale: Embora o hifil de נוס tenha literalmente a ideia de fazer fugir ou retirar, no contexto significa pôr o trigo fora do alcance e da vista do inimigo.
- source_word: מִפְּנֵי מִדְיָן
  choice: dos midianitas
  rationale: O hebraico traz o nome coletivo Midiã; em português, 'os midianitas' comunica naturalmente o povo que representava a ameaça.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome próprio divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- issue: Sentido de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: O contexto narrativo favorece um enviado celestial. A tradução não identifica essa figura com nenhuma pessoa divina específica, preservando a tensão do relato.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. 'Lagar' preserva o cenário histórico; 'malhando trigo' comunica a ação concreta. As notas registram alternativas relevantes sem sobrecarregar o versículo.
