base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: pt
  text: Então Gideão construiu ali um altar a Yahweh e chamou-o de “Yahweh é Paz”[a]. Até hoje, ele ainda está em Ofra dos abiezritas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH shalom; tradicionalmente transliterado “Yahweh-Shalom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: Tradução narrativa natural de בנה para a edificação de um altar.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Termo cultual comum e direto em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O ל marca dedicação ou direção, e o nome divino יְהוָה é transliterado como Yahweh.
- source_word: וַיִּקְרָא לוֹ
  choice: lhe deu o nome de
  rationale: No contexto de nomeação do altar, קרא + ל expressa dar um nome; esta formulação é clara e idiomática em português.
- source_word: יְהוָה שָׁלוֹם
  choice: Yahweh é Paz
  rationale: Traduz o nome comemorativo e explicita com naturalidade a cópula subentendida na frase nominal hebraica.
- source_word: שָׁלוֹם
  choice: Paz
  rationale: Mantém a formulação concisa do nome, embora o hebraico também possa abranger bem-estar e integridade.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressão portuguesa natural que conserva a perspectiva temporal do narrador.
- source_word: עוֹדֶנּוּ
  choice: ainda está
  rationale: Expressa a permanência ou presença continuada indicada pela forma hebraica.
- source_word: בְּעָפְרָת
  choice: em Ofra
  rationale: Transliteração portuguesa corrente do topônimo.
- source_word: אֲבִי הָעֶזְרִי
  choice: dos abiezritas
  rationale: Representa o gentílico ou vínculo clânico que identifica essa Ofra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה na dedicação e no nome do altar
  choice: Yahweh / Yahweh é Paz
  alternative: SENHOR / O SENHOR é Paz; Javé / Javé é Paz
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e mantém coerência nas duas ocorrências.
- issue: Sentido da fórmula יְהוָה שָׁלוֹם
  choice: Yahweh é Paz
  alternative: Yahweh dá paz; Yahweh está em paz
  rationale: A frase hebraica é nominal e não explicita a relação entre os termos. A tradução conserva a leitura predicativa mais direta sem ampliar o enunciado para uma ação não expressa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. O demonstrativo “esse altar” explicita o referente de עוֹדֶנּוּ sem alterar o sentido.
