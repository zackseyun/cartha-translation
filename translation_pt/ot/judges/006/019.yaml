  text: וְ/גִדְע֣וֹן בָּ֗א וַ/יַּ֤עַשׂ גְּדִֽי עִזִּים֙ וְ/אֵיפַת קֶ֣מַח מַצּ֔וֹת הַ/בָּשָׂר֙ שָׂ֣ם בַּ/סַּ֔ל וְ/הַ/מָּרַ֖ק שָׂ֣ם בַּ/פָּר֑וּר וַ/יּוֹצֵ֥א אֵלָ֛י/ו אֶל תַּ֥חַת הָ/אֵלָ֖ה וַ/יַּגַּֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: pt
  text: Então Gideão entrou e preparou um cabrito e pães sem fermento com uma efa de farinha.[a] Pôs a carne num cesto e o caldo numa panela. Depois trouxe tudo para fora até ele, debaixo do terebinto,[b] e lhe apresentou tudo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma efa era uma antiga medida de capacidade para secos; seu volume exato é incerto.
    reason: medida_antiga
  - marker: b
    text: Ou “debaixo do carvalho”. O termo hebraico provavelmente se refere a um terebinto.
    reason: alternativa_lexical
  - marker: c
    text: Ou “e o aproximou” ou “e o apresentou”.
    reason: alternativa_lexical
lexical_decisions:
- source_word: בָּא
  choice: entrou
  rationale: No contexto, Gideão se afasta do visitante para preparar a comida; “entrou” comunica naturalmente o movimento para o local de preparo, embora o verbo também possa significar “veio”.
- source_word: וַיַּעַשׂ
  choice: preparou
  rationale: Em contexto culinário, “preparou” expressa de modo natural o sentido amplo de “fazer”.
- source_word: גְּדִי עִזִּים
  choice: um cabrito
  rationale: A expressão hebraica designa o filhote de uma cabra; “cabrito” é preciso e corrente em português.
- source_word: אֵיפַת קֶמַח
  choice: uma efa de farinha
  rationale: Mantém a unidade de medida específica do hebraico, explicada em nota, sem substituí-la por uma estimativa incerta.
- source_word: מַצּוֹת
  choice: pães sem fermento
  rationale: Forma clara e natural para o alimento não levedado; o plural acompanha o substantivo hebraico.
- source_word: הַבָּשָׂר
  choice: a carne
  rationale: Equivalente idiomático em contexto de alimento.
- source_word: סַּל
  choice: cesto
  rationale: Termo comum e adequado para o recipiente de transporte indicado pelo hebraico.
- source_word: הַמָּרַק
  choice: o caldo
  rationale: Expressa o líquido do cozimento sem restringi-lo indevidamente a uma sopa.
- source_word: פָּרוּר
  choice: panela
  rationale: Designa naturalmente o recipiente usado para o caldo; “pote” também seria possível.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: levou tudo para fora, até ele
  rationale: O verbo hebraico está no singular e pode tratar o conjunto preparado como uma unidade; “tudo” retoma naturalmente a carne e o caldo em português.
- source_word: תַּחַת הָאֵלָה
  choice: debaixo do terebinto
  rationale: אֵלָה provavelmente designa o terebinto, embora “carvalho” seja uma tradução tradicional.
- source_word: וַיַּגַּשׁ
  choice: colocou diante dele
  rationale: Reproduz no contexto de hospitalidade a ideia de aproximar ou apresentar, sem transformar explicitamente o gesto em oferta sacrificial.
theological_decisions:
- issue: Possível nuance sacrificial no gesto de Gideão
  choice: 'linguagem de hospitalidade e apresentação: “colocou diante dele”'
  alternative: “ofereceu como sacrifício”
  rationale: Este versículo descreve o preparo, o transporte e a apresentação da comida, mas não declara explicitamente que Gideão realizou um sacrifício. A formulação preserva a tensão narrativa desenvolvida nos versículos seguintes.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a unidade antiga “efa” e o nome botânico “terebinto”, ambos esclarecidos em notas. Evita linguagem sacrificial explícita que ultrapassaria o que o versículo afirma.
