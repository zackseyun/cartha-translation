base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: pt
  text: A mão de Midiã prevaleceu contra Israel. Por causa de Midiã, os filhos de Israel fizeram para si os esconderijos[a] que ficam nas montanhas, as cavernas e as fortalezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “esconderijos” é raro e também pode ser entendido como “covis”, “túneis” ou “cavidades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז
  choice: prevaleceu
  rationale: Expressa o fortalecimento vitorioso e o domínio hostil de Midiã no contexto.
- source_word: יַד מִדְיָן
  choice: a mão de Midiã
  rationale: Preserva a imagem hebraica de “mão” como poder ou domínio, compreensível em português.
- source_word: עַל יִשְׂרָאֵל
  choice: contra Israel
  rationale: A preposição tem sentido hostil no contexto da opressão.
- source_word: מִפְּנֵי מִדְיָן
  choice: por causa de Midiã
  rationale: Comunica de modo natural que a ameaça midianita levou os israelitas a buscar refúgios.
- source_word: עָשׂוּ לָהֶם
  choice: fizeram para si
  rationale: Mantém tanto a ação de preparar ou construir quanto o valor reflexivo do pronome.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a forma hebraica e permanece tradicional e inteligível em português.
- source_word: הַמִּנְהָרוֹת
  choice: os esconderijos
  rationale: O termo é raro e provavelmente designa covis, cavidades ou refúgios; “esconderijos” comunica sua função sem confundi-lo com as cavernas mencionadas em seguida.
- source_word: אֲשֶׁר בֶּהָרִים
  choice: que ficam nas montanhas
  rationale: Preserva explicitamente a oração locativa do hebraico.
- source_word: הַמְּעָרוֹת
  choice: as cavernas
  rationale: Equivalente português claro para grutas ou cavidades naturais.
- source_word: הַמְּצָדוֹת
  choice: as fortalezas
  rationale: Designa lugares defensáveis ou fortificados usados como refúgio.
