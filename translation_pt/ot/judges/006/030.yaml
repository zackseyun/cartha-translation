  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: pt
  text: 'Então os homens da cidade disseram a Joás: “Traga seu filho para fora, para que morra, pois ele derrubou o altar de Baal e cortou a Aserá[a] que estava ao lado dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o poste de Aserá”. O termo hebraico pode designar o objeto cultual associado à deusa Aserá; neste contexto, o verbo “cortar” indica que se trata do objeto, não da própria deusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Preserva a forma masculina do hebraico e a provável referência aos homens que atuavam publicamente na cidade.
- source_word: הוֹצֵא
  choice: Traga seu filho para fora
  rationale: 'Expressa naturalmente em português o imperativo causativo: fazer o filho sair e apresentá-lo à multidão.'
- source_word: וְיָמֹת
  choice: para que morra
  rationale: Mantém a construção de finalidade ou resultado ligada ao imperativo, sem acrescentar uma fórmula judicial ausente do hebraico.
- source_word: נָתַץ
  choice: derrubou
  rationale: Verbo corrente e apropriado para a destruição de um altar ou outra estrutura.
- source_word: מִזְבַּח הַבַּעַל
  choice: o altar de Baal
  rationale: Reproduz com clareza a relação construta do hebraico.
- source_word: כָרַת
  choice: cortou
  rationale: Mantém o sentido básico do verbo e evita definir além do texto a forma exata do objeto cultual.
- source_word: הָאֲשֵׁרָה
  choice: a Aserá
  rationale: Translitera o termo hebraico, que neste contexto provavelmente designa o objeto cultual associado à deusa, sem reduzi-lo necessariamente a um poste.
- source_word: אֲשֶׁר עָלָיו
  choice: que estava ao lado dele
  rationale: על pode indicar proximidade; a expressão retrata provavelmente a Aserá junto ao altar, e não necessariamente sobre ele.
theological_decisions:
- issue: Referente de אֲשֵׁרָה no contexto cultual
  choice: a Aserá
  alternative: o poste de Aserá; a deusa Aserá
  rationale: O verbo “cortar” favorece a referência a um objeto cultual, mas o substantivo hebraico não especifica sua forma; a transliteração preserva essa tensão, esclarecida em nota.
- issue: Força de וְיָמֹת
  choice: para que morra
  alternative: e que morra; para ser morto
  rationale: A formulação conserva a finalidade ou consequência exigida pelos homens sem introduzir explicitamente uma terminologia de execução judicial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Joás”, “Baal” e “Aserá” seguem formas bíblicas correntes; a sintaxe preserva a intensidade da exigência de morte sem soar arcaica.
