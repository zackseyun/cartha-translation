revisions:
- from: 'Então Gideão disse a Deus: “Não deixes que a tua ira se acenda contra mim[a] e permite que eu fale só mais esta vez. Por favor, deixa-me fazer a prova apenas mais esta vez com o velo de lã[b]: que somente o velo fique seco, e que haja orvalho sobre todo o chão[c]”.'
  to: 'Então Gideão disse a Deus: “Não deixes que a tua ira se acenda contra mim[a], e permite que eu fale só esta vez. Por favor, deixa-me fazer uma prova apenas esta vez com o velo de lã[b]: que somente o velo fique seco, e que haja orvalho sobre todo o chão[c].”'
  rationale: A única alteração necessária elimina «mais», que acrescentava uma nuance temporal não expressa nas duas limitações hebraicas. Também se ajusta a nota b para que reflita a mesma correção. O restante do texto preserva com precisão o sentido, o registro e a tensão teológica do original.
