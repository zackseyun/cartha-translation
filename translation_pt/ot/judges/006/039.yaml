  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: pt
  text: 'Então Gideão disse a Deus: “Não deixes que a tua ira se acenda contra mim[a], e permite que eu fale só esta vez. Por favor, deixa-me fazer uma prova apenas esta vez com o velo de lã[b]: que somente o velo fique seco, e que haja orvalho sobre todo o chão[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não fiques irado comigo”. A expressão hebraica diz literalmente que a ira se acende contra alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Por favor, deixa-me testar apenas esta vez por meio do velo de lã”.'
    reason: lexical_alternative
  - marker: c
    text: “Chão” também pode ser traduzido por “terra”; aqui indica a área ao redor do velo, em contraste com o próprio velo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: Não deixes que a tua ira se acenda contra mim
  rationale: Preserva a metáfora hebraica da ira que se acende, em linguagem portuguesa natural e digna, sem recorrer ao literalismo anatômico de “nariz”.
- source_word: וַאֲדַבְּרָה
  choice: e permite que eu fale
  rationale: O coortativo expressa um pedido respeitoso para continuar falando; “permite que eu fale” comunica esse valor no contexto.
- source_word: אַךְ הַפָּעַם
  choice: só mais esta vez
  rationale: Expressa a limitação enfática do pedido de Gideão de modo idiomático.
- source_word: אֲנַסֶּה נָּא
  choice: Por favor, deixa-me fazer a prova
  rationale: נסה pode significar testar ou pôr à prova. A formulação mantém a natureza de teste do pedido, sem lhe acrescentar aprovação ou censura.
- source_word: רַק הַפַּעַם
  choice: apenas mais esta vez
  rationale: Mantém a repetição retórica da limitação presente no hebraico, com pequena variação natural em português.
- source_word: בַּגִּזָּה
  choice: com o velo de lã
  rationale: “Velo de lã” identifica com clareza a lã tosquiada usada como objeto ou meio da prova; “com” traduz naturalmente o valor contextual da preposição.
- source_word: יְהִי נָא חֹרֶב
  choice: que somente o velo fique seco
  rationale: חֹרֶב indica secura neste contexto, não uma estiagem generalizada. A construção portuguesa comunica naturalmente o resultado pedido.
- source_word: אֶל הַגִּזָּה לְבַדָּהּ
  choice: somente o velo
  rationale: A exclusividade de לְבַדָּהּ é preservada, e o valor espacial de אֶל é expresso pela construção “fique seco” aplicada ao velo.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: e que haja orvalho sobre todo o chão
  rationale: הָאָרֶץ pode ser terra, chão ou região; no contraste local com o velo, “chão” evita sugerir o planeta inteiro e preserva a referência à superfície ao redor.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora o hebraico use o artigo, no discurso narrativo dirigido ao Deus de Israel o português emprega naturalmente “Deus” sem artigo.
theological_decisions:
- issue: O pedido repetido de Gideão para testar mediante outro sinal
  choice: Apresentar o pedido como uma súplica cautelosa por mais uma prova, sem declarar se ele é aprovado ou censurado.
  alternative: Intensificar negativamente a ideia de pôr Deus à prova, ou suavizá-la como simples pedido de confirmação.
  rationale: O hebraico combina o temor da ira divina com um pedido explícito de prova. A tradução conserva essa tensão teológica sem acrescentar avaliação que o versículo não formula.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega-se “tu” nas formas verbais por se tratar de fala direta dirigida a Deus, sem arcaísmos pronominais. “Velo de lã” é mantido por precisão concreta, e a repetição “só mais esta vez/apenas mais esta vez” conserva a insistência cautelosa do hebraico.
