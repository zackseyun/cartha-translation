  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: pt
  text: Então o anjo de Yahweh estendeu a ponta do cajado que tinha na mão e tocou na carne[a] e nos pães sem fermento. Do rochedo subiu fogo, que consumiu a carne e os pães sem fermento. E o anjo de Yahweh foi-se de diante dos seus olhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “carne”; aqui se refere à carne preparada por Gideão.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “foi-se dos olhos dele”, isto é, deixou de estar visível para Gideão.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar “mensageiro” ou “anjo”; neste contexto sobrenatural, “anjo” é a forma portuguesa mais natural. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: וַיִּשְׁלַח ... אֶת קְצֵה הַמִּשְׁעֶנֶת
  choice: estendeu a ponta do cajado
  rationale: O verbo descreve a extensão do objeto, e קְצֵה הַמִּשְׁעֶנֶת designa a extremidade de um bastão usado como apoio; “cajado” comunica a imagem de modo claro e digno.
- source_word: בָּשָׂר
  choice: carne
  rationale: No contexto, refere-se à carne preparada por Gideão; “carne” é natural em português e mantém o sentido concreto do hebraico.
- source_word: מַצּוֹת
  choice: pães sem fermento
  rationale: Expressa claramente o plural hebraico e é compreensível em português moderno, sem recorrer a transliteração técnica.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: Do rochedo subiu fogo
  rationale: Preserva o movimento ascendente e a origem do fogo no rochedo, conforme a construção hebraica.
- source_word: וַתֹּאכַל
  choice: consumiu
  rationale: “Consumir” é a expressão idiomática portuguesa para a ação do fogo, sem perder a força do verbo hebraico.
- source_word: הָלַךְ מֵעֵינָיו
  choice: desapareceu de sua vista
  rationale: A expressão hebraica significa literalmente que o anjo “foi-se de diante dos olhos dele”; a formulação portuguesa comunica que deixou de ser visível sem definir como isso ocorreu.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de מַלְאָךְ na expressão מַלְאַךְ יְהוָה
  choice: anjo
  alternative: mensageiro
  rationale: Embora o substantivo também possa significar “mensageiro”, a atuação sobrenatural da figura neste episódio favorece “anjo”, sem acrescentar uma identificação teológica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A sequência narrativa hebraica foi preservada sem rigidez artificial; “rochedo” distingue a superfície rochosa de uma pedra pequena.
