revisions:
- from: Eu os livrei do poder do Egito e do poder de todos os que os oprimiam. Expulsei-os da presença de vocês e lhes dei a terra deles.
  to: Eu livrei vocês do poder do Egito e do poder de todos os que os oprimiam; expulsei estes de diante de vocês e lhes dei a terra deles.
  rationale: A revisão explicita os destinatários como “vocês” e usa “estes” para retomar os opressores, preservando a distinção referencial presente no hebraico. “De diante de vocês” aproxima a formulação do sentido espacial do original. Não são necessárias notas, pois não há variante textual nem ambiguidade relevante que a tradução não possa conservar de modo claro.
