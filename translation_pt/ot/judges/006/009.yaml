base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: pt
  text: Eu livrei vocês do poder do Egito e do poder de todos os que os oprimiam; expulsei estes de diante de vocês e lhes dei a terra deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: Eu os livrei
  rationale: O verbo נצל expressa resgate ou libertação do perigo ou do domínio de alguém. “Livrei” é claro, digno e natural em português.
- source_word: מִיַּד
  choice: do poder de
  rationale: Embora a expressão hebraica diga literalmente “da mão de”, aqui “do poder de” comunica diretamente a ideia idiomática de domínio ou controle e evita uma formulação menos natural em português corrente.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome geográfico e nacional.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: todos os que os oprimiam
  rationale: O particípio de לחץ designa os que pressionavam ou oprimiam Israel. A oração relativa é mais natural e imediatamente compreensível do que o substantivo abstrato “opressores” neste contexto.
- source_word: וָאֲגָרֵשׁ
  choice: Expulsei-os
  rationale: גרש significa expulsar ou pôr para fora. “Expulsei-os” preserva a força do ato e se ajusta ao contexto da posse da terra.
- source_word: מִפְּנֵיכֶם
  choice: da presença de vocês
  rationale: Representa a imagem hebraica de remover alguém de diante da face ou presença de outro, com linguagem compreensível em português moderno.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: e lhes dei a terra deles
  rationale: Reproduz de forma direta a ação divina de dar a Israel a terra anteriormente ocupada pelos opressores, mantendo distintos os referentes dos pronomes.
theological_decisions:
- issue: Ação divina na libertação de Israel e na concessão da terra
  choice: Deus permanece o sujeito explícito das ações de livrar, expulsar e dar.
  alternative: Reformular com construções passivas ou impessoais.
  rationale: Os verbos hebraicos na primeira pessoa enfatizam a ação direta do SENHOR. A tradução conserva essa ênfase sem acrescentar uma explicação teológica ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e evita arcaísmos. A divisão em duas frases preserva a sequência retórica e melhora a fluidez sem alterar as relações sintáticas.
