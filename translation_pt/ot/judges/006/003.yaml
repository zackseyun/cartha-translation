source:
  edition: WLC
  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: pt
  text: E, sempre que Israel semeava, Midiã, Amaleque e os povos do Oriente vinham atacá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “contra ele”. O sufixo está no singular e se refere coletivamente a Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: sempre que
  rationale: A construção introduz uma circunstância recorrente; “sempre que” comunica naturalmente o valor habitual no contexto narrativo.
- source_word: זָרַע
  choice: semeava
  rationale: O verbo significa lançar ou semear a semente; o imperfeito português expressa adequadamente a ação repetida no passado.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio do povo, mantido na forma portuguesa convencional.
- source_word: וְעָלָה ... וְעָלוּ עָלָיו
  choice: vinham atacá-lo
  rationale: עלה com על descreve aqui um avanço hostil. “Vinham atacá-lo” transmite de modo claro tanto o movimento contra Israel quanto o caráter recorrente, sem uma repetição pouco natural em português.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Forma portuguesa convencional do nome próprio, que neste contexto designa coletivamente o povo de Midiã.
- source_word: וַעֲמָלֵק
  choice: Amaleque
  rationale: O hebraico emprega o nome próprio, não o gentílico; conserva-se essa forma, com referência coletiva ao povo.
- source_word: וּבְנֵי קֶדֶם
  choice: os povos do Oriente
  rationale: Literalmente “filhos do Oriente”; a expressão portuguesa comunica o sentido coletivo regional de maneira natural e digna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O aspecto habitual é expresso por “sempre que” e pelos verbos no imperfeito. O pronome singular em “atacá-lo” preserva a concordância coletiva do hebraico com Israel; a nota explicita essa característica.
