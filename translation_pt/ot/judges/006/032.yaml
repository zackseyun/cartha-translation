base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: pt
  text: 'Naquele dia ele lhe deu o nome de Jerubaal[a], dizendo: “Que Baal contenda contra ele[b], pois ele derrubou o altar de Baal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O nome Jerubaal soa como uma formação ligada ao verbo hebraico traduzido por “contenda”; a explicação dada é: “Que Baal contenda contra ele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Baal contenderá contra ele”. O verbo hebraico pode expressar um desejo ou desafio, mas também pode ser entendido como uma afirmação.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: ele lhe deu o nome de
  rationale: O verbo קרא com ל e sufixo pronominal indica aqui atribuir um nome ou apelido. A formulação é natural em português e mantém o sujeito masculino singular do hebraico sem identificar além do que o texto permite.
- source_word: בַיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal direto e idiomático para a expressão hebraica com ב.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Translitera o nome próprio segundo uma forma corrente em português. O jogo sonoro com ריב é explicado na fala e na nota, sem traduzir artificialmente o nome.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a explicação do nome.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: Que Baal contenda contra ele
  rationale: Representa o provável valor volitivo/jussivo do verbo e preserva seu sentido amplo de disputar ou contender, bem como o vínculo verbal com Jerubaal.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural a razão da declaração, sem alterar a relação causal expressa pelo hebraico.
- source_word: נָתַץ
  choice: derrubou
  rationale: נתץ descreve a destruição ou demolição de uma estrutura, especialmente um altar; “derrubou” é claro e corrente em português.
- source_word: אֶת מִזְבְּחוֹ
  choice: o altar de Baal
  rationale: O sufixo masculino singular remete naturalmente a Baal. Repetir o nome elimina uma possível ambiguidade pronominal em português sem mudar o referente contextual.
theological_decisions:
- issue: Sentido de בַּעַל no contexto de confronto com a idolatria
  choice: Baal
  alternative: o senhor
  rationale: Neste contexto, בעל designa a divindade cananeia e funciona como nome ou título próprio. “Baal” preserva a polêmica narrativa e evita confusão com o SENHOR.
- issue: Modalidade de יָרֶב
  choice: Que Baal contenda contra ele
  alternative: Baal contenderá contra ele
  rationale: A forma verbal pode ser entendida como desejo ou desafio jussivo, embora também admita leitura indicativa. O texto principal adota a leitura volitiva mais provável, e a nota conserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por isso” explicita de forma natural a consequência narrativa presente no contexto; “contenda” conserva o registro jurídico-adversarial e o jogo de palavras, enquanto “derrubou” permanece corrente. As duas notas são marcadas no texto principal.
