  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: pt
  text: 'Mas ele lhe disse: “Por favor, meu senhor, como poderei salvar Israel? Veja: meu clã[a] é o mais fraco[b] de Manassés, e eu sou o mais jovem[c] da casa de meu pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu grupo familiar”; literalmente, “meu milhar”. O termo hebraico pode designar uma divisão de clã.
    reason: lexical_alternative
  - marker: b
    text: Ou “o mais pobre” ou “o menor” de Manassés.
    reason: lexical_alternative
  - marker: c
    text: Ou “o menor” na casa de meu pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Por favor
  rationale: Partícula de súplica cortês; esta forma comunica com naturalidade a deferência de Gideão.
- source_word: אֲדֹנָי
  choice: meu senhor
  rationale: Forma respeitosa de tratamento que mantém a ambiguidade narrativa quanto à identidade daquele a quem Gideão se dirige.
- source_word: בַּמָּה
  choice: como poderei
  rationale: Expressa idiomaticamente a pergunta pelos meios ou pela capacidade de realizar a ação.
- source_word: אוֹשִׁיעַ
  choice: salvar
  rationale: O hifil de יָשַׁע significa salvar, livrar ou resgatar; “salvar” preserva a amplitude do verbo e é claro no contexto.
- source_word: הִנֵּה
  choice: Veja
  rationale: Chama a atenção para a explicação que segue, sem recorrer ao arcaísmo “eis”.
- source_word: אַלְפִּי
  choice: meu clã
  rationale: Embora אֶלֶף também signifique literalmente “mil”, neste contexto social designa uma subdivisão tribal ou grupo familiar.
- source_word: הַדַּל
  choice: o mais fraco
  rationale: דַּל pode indicar fraqueza, pobreza ou pouca importância; “mais fraco” comunica aqui a alegada falta de recursos e posição do clã.
- source_word: בִּמְנַשֶּׁה
  choice: de Manassés
  rationale: A relação comparativa ou de pertencimento dentro da tribo soa naturalmente em português com “de Manassés”.
- source_word: הַצָּעִיר
  choice: o mais jovem
  rationale: No contexto da casa paterna, o termo naturalmente aponta para menor idade, embora também possa sugerir menor importância.
- source_word: בְּבֵית אָבִי
  choice: da casa de meu pai
  rationale: Preserva a expressão hebraica para a família ou unidade doméstica paterna e continua compreensível em português atual.
theological_decisions:
- issue: Sentido de אֲדֹנָי na forma de tratamento de Gideão
  choice: “meu senhor”, em minúsculas, como tratamento respeitoso
  alternative: “Senhor”, como título divino
  rationale: A cena ainda mantém tensão narrativa sobre a identidade do interlocutor. A forma em minúsculas evita decidir antecipadamente que Gideão já o reconhece explicitamente como Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a deferência e a autodepreciação de Gideão sem linguagem arcaica; as notas preservam a amplitude lexical dos termos sociais hebraicos.
