  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: pt
  text: 'Então Yahweh enviou um homem, um profeta, aos filhos de Israel[a], e ele lhes disse: “Assim diz Yahweh, o Deus de Israel: Eu os fiz subir do Egito e os tirei da casa de escravos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “aos descendentes de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da casa de escravidão”. O hebraico diz literalmente “da casa de escravos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa em português atual a sequência dos acontecimentos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אִישׁ נָבִיא
  choice: um homem, um profeta
  rationale: Mantém os dois substantivos hebraicos em aposição, sem reduzir a expressão simplesmente a “um profeta”.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a designação coletiva e pactual בְּנֵי יִשְׂרָאֵל; a forma mais idiomática “aos israelitas” é registrada em nota.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz a fórmula profética convencional de mensageiro de maneira digna e reconhecível.
- source_word: אָנֹכִי הֶעֱלֵיתִי אֶתְכֶם
  choice: Eu fiz vocês subirem
  rationale: Preserva tanto o pronome independente enfático quanto o sentido causativo de עלה no hifil, usado para a saída do Egito.
- source_word: וָאֹצִיא אֶתְכֶם
  choice: e os tirei
  rationale: Expressa naturalmente o hifil de יצא, isto é, fazer sair ou tirar, e evita repetição pesada em português.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Mantém a imagem concreta do hebraico, cujo substantivo plural significa literalmente “escravos”; “casa de escravidão” é uma alternativa idiomática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pactual em vez de substituí-lo por um título.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha conserva a formulação masculina plural convencional do hebraico sem negar que o povo inteiro está em vista.
- issue: Ênfase do pronome אָנֹכִי
  choice: Eu fiz vocês subirem
  alternative: Fui eu que fiz vocês subirem
  rationale: O pronome explícito foi mantido, mas sem intensificação adicional; a construção hebraica permite perceber ênfase, embora seu grau exato não precise ser explicitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a fórmula profética, o nome Yahweh e as imagens concretas do hebraico, recorrendo a notas apenas onde uma alternativa idiomática é útil.
