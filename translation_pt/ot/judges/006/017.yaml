base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: pt
  text: 'E ele lhe disse: “Se achei favor aos teus olhos, peço-te que me dês um sinal de que és tu quem fala comigo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: achei favor aos teus olhos
  rationale: Mantém a expressão idiomática hebraica, que é compreensível e digna em português, sem reduzi-la simplesmente a ‘se me aprovas’.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: dá-me um sinal
  rationale: O verbo עשה, literalmente ‘fazer’, em combinação com אוֹת expressa aqui a concessão ou realização de um sinal; ‘dá-me um sinal’ comunica naturalmente esse sentido.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: de que és tu quem fala comigo
  rationale: 'Preserva a ênfase do pronome אַתָּה: Gideão pede confirmação da identidade daquele que está falando com ele.'
theological_decisions:
- issue: Identidade do interlocutor
  choice: de que és tu quem fala comigo
  alternative: de que é o SENHOR quem fala comigo
  rationale: O hebraico diz literalmente ‘que tu falas comigo’ e mantém a identificação do interlocutor no desenvolvimento narrativo; a tradução não explicita além do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com o discurso direto bíblico. O elemento נָא foi representado pela formulação cortês e condicional do pedido, sem um ‘por favor’ que soaria mais coloquial.
