source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: pt
  text: Eis que vou colocar um velo de lã na eira. Se houver orvalho somente sobre o velo, enquanto todo o chão[a] estiver seco, saberei que salvarás Israel por minha mão, conforme disseste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra”; a palavra hebraica pode indicar o chão local ou uma extensão territorial mais ampla. Aqui, provavelmente se refere ao chão ao redor do velo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a força dêitica e enfática da expressão hebraica de chamada de atenção em português atual, sem recorrer ao mais arcaico “eis que”.
- source_word: מַצִּיג
  choice: vou colocar
  rationale: O particípio com אָנֹכִי apresenta a ação como presente ou iminente; “vou colocar” soa natural no contexto da proposta do sinal.
- source_word: גִּזַּת הַצֶּמֶר
  choice: um velo de lã
  rationale: “Velo” designa a lã retirada de uma ovelha e corresponde de modo conciso à imagem concreta do hebraico.
- source_word: בַּגֹּרֶן
  choice: na eira
  rationale: É o termo português tradicional e preciso para a superfície preparada onde se debulhavam cereais.
- source_word: טַל יִהְיֶה
  choice: houver orvalho
  rationale: Reproduz naturalmente a construção existencial hebraica sem especificar indevidamente que o orvalho cairá.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: somente sobre o velo
  rationale: Expressa com clareza a exclusividade marcada por לְבַדָּהּ.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: enquanto todo o chão estiver seco
  rationale: Converte a construção nominal hebraica em uma oração portuguesa natural e entende הָאָרֶץ localmente como a superfície ao redor do velo.
- source_word: וְיָדַעְתִּי
  choice: saberei
  rationale: No contexto, a forma verbal indica o resultado esperado caso a condição se cumpra.
- source_word: כִּי תוֹשִׁיעַ
  choice: que salvarás
  rationale: O hifil de יָשַׁע significa salvar ou livrar; “salvarás” conserva a formulação direta e o valor futuro no contexto.
- source_word: בְּיָדִי
  choice: por minha mão
  rationale: Preserva a imagem hebraica de mão como instrumento ou agência, ainda compreensível em português.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: conforme disseste
  rationale: Traduz o verbo “falar/dizer” sem reforçá-lo para “prometer”, embora o contexto contenha uma garantia divina.
theological_decisions:
- issue: Alcance de הָאָרֶץ no sinal pedido por Gideão
  choice: chão
  alternative: terra; país
  rationale: O contraste imediato é entre o velo e a superfície ao redor dele, provavelmente na eira; “chão” evita ampliar o sinal para o mundo inteiro ou necessariamente para toda a terra de Israel.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Velo” e “eira” são termos concretos e precisos; o restante da sintaxe foi mantido corrente. A expressão “por minha mão” conserva deliberadamente a imagem semítica de agência.
