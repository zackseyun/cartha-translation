base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: pt
  text: 'Naquela noite, Yahweh lhe disse: “Pegue o touro de seu pai e o segundo touro, de sete anos, derrube o altar de Baal que pertence a seu pai e corte a Aserá[a] que está sobre ele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o poste de Aserá” ou “o poste sagrado”. O termo hebraico pode designar um objeto cultual associado a Aserá.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que está sobre ele”. A expressão pode indicar que a Aserá ficava sobre o altar ou em estreita associação com ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Naquela noite
  rationale: Expressa de modo natural em português a transição narrativa e a indicação temporal, sem recorrer ao arcaico “E aconteceu que”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino como nome próprio e segue a forma adotada pelo projeto, em vez de substituí-lo por um título.
- source_word: קַח
  choice: Pegue
  rationale: Imperativo direto, corrente e claro em português moderno.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: o touro de seu pai
  rationale: Representa de forma idiomática a expressão hebraica e sua relação possessiva.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: e o segundo touro, de sete anos
  rationale: Conserva a coordenação explícita e a referência a um segundo animal, sem fundi-lo silenciosamente com o primeiro.
- source_word: וְהָרַסְתָּ
  choice: derrube
  rationale: Verbo vigoroso e natural para a destruição deliberada de um altar.
- source_word: מִזְבַּח הַבַּעַל
  choice: o altar de Baal
  rationale: Tradução direta e clara da construção hebraica.
- source_word: הָאֲשֵׁרָה
  choice: a Aserá
  rationale: A transliteração preserva a ambiguidade entre a divindade e o objeto cultual associado a ela; a alternativa explicativa aparece em nota.
- source_word: אֲשֶׁר עָלָיו
  choice: que está sobre ele
  rationale: Mantém o sentido espacial mais direto de עַל, deixando em nota a possível ideia de estreita associação com o altar.
- source_word: תִּכְרֹת
  choice: corte
  rationale: Reproduz o verbo usado para cortar ou abater um objeto de madeira, sem acrescentar uma forma específica não explicitada no hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: A forma escolhida trata o tetragrama como nome próprio e evita substituí-lo por um título; mantém também a convenção do projeto.
- issue: Identidade e natureza de הָאֲשֵׁרָה
  choice: a Aserá
  alternative: o poste de Aserá; o poste sagrado
  rationale: A forma transliterada evita decidir indevidamente se o termo designa aqui a deusa, um símbolo cultual de madeira ou outro objeto associado a ela.
- issue: Relação espacial expressa por אֲשֶׁר עָלָיו
  choice: que está sobre ele
  alternative: que está junto dele; que está associado a ele
  rationale: A tradução principal conserva o valor mais direto da preposição, enquanto a nota reconhece que o contexto pode indicar proximidade ou associação cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi simplificada na abertura, mas a coordenação dos dois touros e as ambiguidades cultual e espacial do hebraico foram preservadas.
