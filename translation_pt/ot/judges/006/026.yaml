  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: pt
  text: Então construa um altar a Yahweh, seu Deus, no alto deste lugar fortificado, com tudo devidamente disposto. Pegue o segundo touro e ofereça-o como holocausto, usando como lenha a Aserá[a] que você derrubar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o poste de Aserá”. O termo hebraico pode designar um objeto cultual de madeira associado à deusa Aserá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: Então construa
  rationale: O perfeito qal com conjunção dá continuidade à sequência de instruções; em português, o imperativo precedido de “Então” expressa naturalmente essa força.
- source_word: מִזְבֵּחַ לַיהוָה אֱלֹהֶיךָ
  choice: um altar a Yahweh, seu Deus
  rationale: “Altar” é o equivalente sacrificial normal; a preposição indica dedicação, e o nome divino e a expressão relacional “seu Deus” são mantidos explicitamente.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: no alto deste lugar fortificado
  rationale: רֹאשׁ indica o topo ou alto, enquanto מָעוֹז designa um lugar de força, proteção ou defesa. “Lugar fortificado” preserva o sentido sem pressupor uma fortaleza arquitetônica específica.
- source_word: בַּמַּעֲרָכָה
  choice: com tudo devidamente disposto
  rationale: מַעֲרָכָה denota disposição ou arranjo ordenado. A formulação portuguesa é natural e evita especificar indevidamente pedras, lenha ou outra parte concreta do altar.
- source_word: וְלָקַחְתָּ אֶת־הַפָּר הַשֵּׁנִי
  choice: Pegue o segundo touro
  rationale: A forma verbal continua a instrução, e הַפָּר הַשֵּׁנִי distingue literalmente este animal do primeiro mencionado no contexto.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: ofereça-o como holocausto
  rationale: A combinação do hifil de עלה com עֹלָה é uma expressão sacrificial técnica. “Holocausto” comunica a oferta inteiramente queimada no uso bíblico português.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה אֲשֶׁר תִּכְרֹת
  choice: usando como lenha a Aserá[a] que você derrubar
  rationale: עֲצֵי pode designar a madeira usada como combustível. אֲשֵׁרָה é mantido como nome transliterado, pois a forma exata do objeto cultual é discutida; “derrubar” corresponde ao corte de um objeto de madeira em pé.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Identificação de אֲשֵׁרָה
  choice: Aserá
  alternative: poste de Aserá; objeto de madeira ligado a Aserá
  rationale: O termo pode designar um objeto cultual de madeira associado à deusa Aserá, mas sua forma física exata não é segura. O texto principal conserva a ambiguidade, e a nota oferece a explicação comum.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém o vocabulário sacrificial tradicional “altar” e “holocausto”, mas evita construções excessivamente literais. O marcador [a] foi colocado junto a “Aserá”, termo ao qual a nota efetivamente se refere.
