  source_fidelity: A tradução preserva adequadamente a sequência injuntiva, o altar dedicado a Yahweh como “seu Deus”, a localização no alto do maoz, o “segundo touro”, o holocausto e o emprego da madeira da Aserá. “Lugar fortificado” é uma solução prudente para מָעוֹז, e “com tudo devidamente disposto” comunica sem especificar em excesso o sentido debatido de בַּמַּעֲרָכָה.
  naturalness: O português é moderno, claro e digno. “Então construa”, “Pegue” e “ofereça-o” formam uma sequência instrucional fluente. “Usando como lenha” torna explícita de modo natural a função da madeira no holocausto.
  terminology: “Yahweh”, “altar” e “holocausto” são consistentes com o hebraico e com o registro bíblico em português. “Aserá” mantém corretamente a ambiguidade do termo hebraico; a nota explica a alternativa “poste de Aserá” sem a impor ao texto.
