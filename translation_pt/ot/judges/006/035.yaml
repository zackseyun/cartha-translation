  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: pt
  text: Ele enviou mensageiros por todo o território de Manassés, e Manassés também foi convocado para segui-lo. Enviou ainda mensageiros por Aser, Zebulom e Naftali, e eles subiram ao encontro deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “ao encontro deles”, mas não identifica expressamente a quem o pronome se refere. Pode indicar as forças inimigas ou Gideão acompanhado de seus homens.
    reason: Preservar a ambiguidade do referente do sufixo plural hebraico.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto de mobilização militar, refere-se a agentes humanos que levam uma convocação, não a anjos.
- source_word: בְּכָל מְנַשֶּׁה
  choice: por todo o território de Manassés
  rationale: A expressão indica que os mensageiros percorreram amplamente a região ou agrupamento tribal de Manassés; a explicitação de “território” torna esse sentido natural em português.
- source_word: וַיִּזָּעֵק גַּם הוּא
  choice: Manassés também foi convocado
  rationale: O nifal tem sentido passivo de convocação ou mobilização militar. A repetição de “Manassés” evita o pronome masculino ambíguo e mantém a tribo como entidade coletiva.
- source_word: אַחֲרָיו
  choice: para segui-lo
  rationale: Expressa que Manassés foi mobilizado para juntar-se a Gideão e segui-lo, de modo mais natural em português do que o literal “atrás dele”.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: por Aser, Zebulom e Naftali
  rationale: A preposição repetida indica o envio de mensageiros pelas áreas ou grupos tribais nomeados.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido básico do verbo hebraico e sua possível nuance de deslocamento ou avanço militar.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: Mantém o sufixo plural do hebraico sem determinar no corpo do texto um antecedente que a fonte não explicita.
theological_decisions:
- issue: Referente do sufixo plural em לִקְרָאתָם
  choice: Manter “deles” e deixar o referente sem identificação explícita
  alternative: Interpretar como as forças inimigas, ou como Gideão acompanhado de seus homens
  rationale: O hebraico traz um objeto plural, mas não declara seu antecedente. A tradução preserva essa ambiguidade real em vez de impor uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Território” explicita o valor geográfico ou tribal de Manassés, enquanto “foi convocado” conserva a imagem de mobilização militar. O marcador da nota foi colocado junto à expressão efetivamente ambígua.
