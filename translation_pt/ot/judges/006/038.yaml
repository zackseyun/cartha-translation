base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: pt
  text: 'E assim aconteceu. No dia seguinte, Gideão se levantou de madrugada, apertou a lã[a] e dela espremeu orvalho: uma tigela cheia de água.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comprimiu o velo de lã” / “torceu a lã”. O hebraico emprega dois verbos em sequência para descrever a compressão da lã e a extração do orvalho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: E assim aconteceu
  rationale: Expressa de modo natural a confirmação de que o sinal ocorreu conforme solicitado, preservando a função narrativa do hebraico.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: No dia seguinte, Gideão se levantou de madrugada
  rationale: שׁכם indica levantar-se cedo, e מִמָּחֳרָת situa a ação no dia seguinte. O nome Gideão explicita em português o sujeito implícito sem alterar o referente contextual.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: apertou a lã
  rationale: O verbo descreve a compressão da lã para extrair o líquido. “Apertou” é corrente e evita antecipar por completo o resultado expresso pelo verbo seguinte.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: e dela espremeu orvalho
  rationale: Preserva a segunda ação verbal, a extração do orvalho da lã, em formulação natural e compacta.
- source_word: הַגִּזָּה
  choice: a lã
  rationale: Aqui o substantivo designa a porção de lã tosquiada usada por Gideão. “Lã” é mais acessível no português atual; a nota registra a alternativa mais específica “velo de lã”.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: uma tigela cheia de água
  rationale: Comunica idiomaticamente a quantidade — água suficiente para encher o recipiente — e conserva a imagem concreta de uma tigela ou vasilha.
