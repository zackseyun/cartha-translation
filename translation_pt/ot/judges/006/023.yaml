  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: pt
  text: 'Mas Yahweh lhe disse: “Paz seja com você.[a] Não tenha medo; você não morrerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Paz com você”. O hebraico shalom pode transmitir paz, bem-estar ou tranquilização.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר; “disse” é a tradução natural e direta em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: שָׁלוֹם לְךָ
  choice: Paz seja com você
  rationale: Preserva a fórmula de bênção e, no contexto, sua função de tranquilizar Gideão; a nota registra uma alternativa mais literal.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Expressão corrente e natural em português para a fórmula hebraica de encorajamento.
- source_word: לֹא תָּמוּת
  choice: você não morrerá
  rationale: O imperfeito comunica uma garantia futura enfática, expressa naturalmente pelo futuro do indicativo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Força de שָׁלוֹם no contexto
  choice: Paz seja com você
  alternative: Tudo está bem com você
  rationale: A formulação mantém a amplitude de “paz, bem-estar, segurança” e a função contextual de tranquilização, sem restringi-la a uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna explícito o destinatário singular masculino indicado pelo hebraico, enquanto a fala divina permanece solene e natural.
