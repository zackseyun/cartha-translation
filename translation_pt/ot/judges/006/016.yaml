  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה כִּ֥י אֶהְיֶ֖ה עִמָּ֑/ךְ וְ/הִכִּיתָ֥ אֶת מִדְיָ֖ן כְּ/אִ֥ישׁ אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: pt
  text: 'E Yahweh lhe disse: “Certamente estarei com você, e você ferirá Midiã como se fosse um só homem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um só homem”. A expressão hebraica compara Midiã a um único homem e pode enfatizar que a ação contra ele seria decisiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: E Yahweh lhe disse
  rationale: Mantém o avanço narrativo do waw consecutivo e traduz naturalmente o pronome indireto em português.
- source_word: כִּי
  choice: Certamente
  rationale: No contexto da promessa, comunica a força enfática e asseguradora da partícula sem impor uma relação causal rígida.
- source_word: אֶהְיֶה עִמָּךְ
  choice: estarei com você
  rationale: O imperfeito de היה tem aqui valor futuro em uma promessa; a formulação conserva a garantia da presença divina.
- source_word: וְהִכִּיתָ
  choice: e você ferirá
  rationale: Conserva o sentido básico de נכה e o valor futuro resultante da promessa, sem reduzir o verbo antecipadamente a apenas 'derrotar'.
- source_word: אֶת מִדְיָן
  choice: Midiã
  rationale: Preserva o nome coletivo singular do texto hebraico, que representa o povo ou a força midianita.
- source_word: כְּאִישׁ אֶחָד
  choice: como a um só homem
  rationale: Mantém a imagem masculina singular e permite entender que Midiã seria ferido como se constituísse um único homem, sem eliminar outras nuances possíveis da expressão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o nome pessoal de Deus; a transliteração 'Yahweh' o preserva em vez de substituí-lo por um título.
- issue: Sentido da expressão כְּאִישׁ אֶחָד
  choice: como a um só homem
  alternative: como se fosse um único homem
  rationale: 'A redação conserva a metáfora hebraica e sua tensão interpretativa: pode realçar que toda a força de Midiã seria tratada como um único adversário e, por extensão, a natureza decisiva da vitória.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “ferirá Midiã” conserva deliberadamente o caráter coletivo do nome e a imagem concreta do hebraico; a nota esclarece a expressão menos comum sem resolver em excesso sua ambiguidade.
