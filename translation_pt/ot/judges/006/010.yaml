base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: pt
  text: 'E eu lhes disse: “Eu sou Yahweh, o Deus de vocês. Não temam[a] os deuses dos amorreus, em cuja terra vocês habitam. Mas vocês não deram ouvidos à minha voz[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tenham medo dos deuses” ou “não reverenciem os deuses”. O hebraico expressa uma proibição, e o verbo pode envolver medo ou reverência.'
    reason: lexical_alternative
  - marker: b
    text: “Dar ouvidos à minha voz” também pode ser entendido como “obedecer à minha voz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: E eu lhes disse
  rationale: O verbo אמר introduz a fala anterior de Yahweh, e a conjunção preserva a continuidade com o contexto precedente. “Lhes disse” é natural em português e representa o complemento plural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Embora אֱלֹהִים tenha forma plural, aqui se refere no singular ao Deus de Israel; a construção explicita naturalmente o referente plural do sufixo.
- source_word: לֹא תִירְאוּ
  choice: Não temam
  rationale: A negação com o imperfeito tem força proibitiva. “Não temam” preserva diretamente o verbo “temer” e a forma de ordem.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: os deuses dos amorreus
  rationale: O gentílico hebraico singular tem sentido coletivo; o plural português é a forma idiomática para o povo e seus deuses.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: em cuja terra vocês habitam
  rationale: A oração relativa liga a terra aos amorreus, enquanto “habitam” conserva o sentido de residência estabelecida de ישב.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: Mas vocês não deram ouvidos à minha voz
  rationale: שמע בקול é um idioma que pode indicar tanto escutar quanto atender ou obedecer. “Dar ouvidos à voz” preserva a imagem hebraica e comunica a falta de obediência; “mas” expressa a oposição contextual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Sentido de temer os deuses dos amorreus
  choice: Não temam
  alternative: Não reverenciem; não tenham medo de
  rationale: O verbo ירא pode abranger medo e reverência religiosa. A tradução “temam” conserva essa amplitude sem decidir indevidamente entre as nuances.
- issue: Sentido de ouvir a voz divina
  choice: não deram ouvidos à minha voz
  alternative: não obedeceram à minha voz
  rationale: A expressão hebraica implica obediência, mas a redação escolhida mantém a metáfora da voz e não elimina sua dimensão auditiva.
translation_notes:
  register: Português atual, digno e de fácil leitura, com “vocês” para o plural e sem arcaísmos. A estrutura da fala e as imagens centrais do hebraico foram mantidas, com notas onde a expressão admite mais de uma nuance.
