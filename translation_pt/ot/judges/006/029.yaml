base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: pt
  text: 'E disseram uns aos outros[a]: “Quem fez esta coisa[b]?” E investigaram e procuraram, e disseram: “Gideão, filho de Joás, fez esta coisa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um homem ao seu próximo”. Também pode ser traduzido por “um ao outro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “este ato” ou “este feito”. Aqui, a palavra hebraica se refere à ação praticada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: uns aos outros
  rationale: A expressão idiomática hebraica, literalmente “um homem ao seu próximo”, descreve uma conversa mútua entre os habitantes. “Uns aos outros” comunica naturalmente esse sentido distributivo em português.
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo direto que pergunta quem praticou a ação.
- source_word: עָשָׂה
  choice: fez
  rationale: Neste contexto, “fez” é a forma portuguesa natural para uma ação já realizada e mantém a amplitude semântica do verbo hebraico.
- source_word: הַדָּבָר הַזֶּה
  choice: esta coisa
  rationale: דָּבָר pode indicar coisa, assunto, ato ou feito. Aqui se refere ao ocorrido que acabavam de descobrir; “esta coisa” conserva a formulação ampla do hebraico sem especificar além do texto.
- source_word: וַיִּדְרְשׁוּ
  choice: investigaram
  rationale: דרשׁ expressa aqui o ato de indagar ou investigar para descobrir o responsável.
- source_word: וַיְבַקְשׁוּ
  choice: procuraram
  rationale: בקשׁ significa buscar ou procurar. A tradução preserva um segundo verbo distinto após “investigaram”, como no hebraico.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: Gideão, filho de Joás
  rationale: Emprega as formas portuguesas tradicionais dos nomes e apresenta claramente o patronímico hebraico.
- source_word: וַיֹּאמְרוּ
  choice: disseram
  rationale: Mantém o sentido simples do verbo אמר, sem transformá-lo interpretativamente em “concluíram” ou “responderam”.
