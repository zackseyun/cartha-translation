base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: pt
  text: 'Então Gideão disse a Deus: “Se vais salvar Israel por minha mão, como disseste,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa de modo natural a sequência dos acontecimentos.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: No contexto, Gideão dirige-se ao Deus de Israel. O artigo hebraico não precisa ser reproduzido diante do nome referencial “Deus” em português.
- source_word: אִם
  choice: Se
  rationale: Introduz a condição cuja conclusão aparece no versículo seguinte, preservando a estrutura aberta da fala.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: vais salvar
  rationale: A construção com יֵשׁ, sufixo pronominal e particípio comunica ação prospectiva ou intenção. “Vais salvar” é corrente e preserva essa nuance.
- source_word: בְּיָדִי
  choice: por minha mão
  rationale: Mantém a imagem hebraica concreta de Gideão como instrumento da libertação, sem impedir a compreensão em português.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: O marcador de objeto direto não é traduzido; Israel permanece como objeto da ação de salvar.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: como disseste
  rationale: Reproduz com naturalidade a referência de Gideão à promessa já pronunciada por Deus.
theological_decisions:
- issue: Sentido de אֱלֹהִים na fala de Gideão
  choice: Deus
  alternative: o Deus; um deus
  rationale: O contexto identifica o destinatário como o Deus de Israel; a inicial maiúscula comunica essa referência específica sem acrescentar conteúdo doutrinário.
- issue: Agência expressa por בְּיָדִי
  choice: por minha mão
  alternative: por meio de mim
  rationale: A formulação conserva a metáfora hebraica de agência e a tensão entre a ação salvadora de Deus e o papel instrumental de Gideão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final e a fala não encerrada preservam a continuidade sintática da condição no versículo 37.
