  text: וַ/יַּ֧עַשׂ אֱלֹהִ֛ים כֵּ֖ן בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יְהִי חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ הָ֥יָה טָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: pt
  text: 'E Deus fez assim naquela noite: somente a lã ficou seca, e havia orvalho sobre todo o chão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre toda a terra”. A palavra hebraica אֶרֶץ pode significar “chão”, “terra” ou “país”; aqui, “chão” se ajusta melhor ao cenário imediato do sinal de Gideão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: E Deus fez assim
  rationale: Mantém a forma concisa da narrativa e a referência de כֵּן ao sinal solicitado por Gideão no versículo anterior.
- source_word: בַּלַּיְלָה הַהוּא
  choice: naquela noite
  rationale: Equivalente temporal natural e preciso em português.
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: somente a lã ficou seca
  rationale: Embora חֹרֶב seja um substantivo, a construção verbal é mais natural em português e comunica com clareza que a secura se limitou à lã.
- source_word: הַגִּזָּה
  choice: a lã
  rationale: No contexto, designa a porção de lã tosquiada usada por Gideão; “a lã” é claro e corrente em português.
- source_word: וְעַל כָּל הָאָרֶץ הָיָה טָל
  choice: e havia orvalho sobre todo o chão
  rationale: Preserva a coordenação hebraica e o contraste com a lã; “chão” representa o terreno ao redor no cenário imediato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O dois-pontos introduz o modo como Deus realizou o sinal, enquanto a coordenação interna conserva o contraste narrativo do hebraico.
