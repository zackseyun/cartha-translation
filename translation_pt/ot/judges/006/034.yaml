id: JDG.6.34
reference: Judges 6:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/ר֣וּחַ יְהוָ֔ה לָבְשָׁ֖ה אֶת גִּדְע֑וֹן וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יִזָּעֵ֥ק אֲבִיעֶ֖זֶר אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: pt
  text: Então o Espírito de Yahweh revestiu Gideão[a]. Ele tocou a trombeta[b], e os abiezritas foram convocados para segui-lo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “veio sobre Gideão”. Literalmente, “vestiu-se de Gideão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: shofar, trombeta de chifre usada para dar sinais.'
    reason: cultural_note
  - marker: c
    text: Literalmente, “Abiezer foi convocado após ele”; isto é, o clã de Abiezer reuniu-se para segui-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: Neste contexto de capacitação divina, רוּחַ significa “Espírito”, e o nome יהוה é transliterado como “Yahweh”.
- source_word: לָבְשָׁה אֶת־גִּדְעוֹן
  choice: revestiu Gideão
  rationale: Preserva a metáfora vívida de לבשׁ, em que o Espírito toma Gideão como aquilo de que se reveste, sem reduzi-la simplesmente a “veio sobre”.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: tocou a trombeta
  rationale: Expressão portuguesa natural para o ato de soar o שׁוֹפָר; uma nota esclarece que se trata de uma trombeta de chifre.
- source_word: וַיִּזָּעֵק אֲבִיעֶזֶר
  choice: os abiezritas foram convocados
  rationale: O nifal de זעק comunica convocação ou mobilização. Embora o hebraico use o nome do clã no singular, em português o gentílico plural deixa claro que se trata dos membros do clã de Abiezer.
- source_word: אַחֲרָיו
  choice: para segui-lo
  rationale: Transmite naturalmente tanto a direção quanto a ideia contextual de reunir-se em apoio a Gideão.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto o nome pessoal da aliança expresso pelo Tetragrama, sem o substituir por um título.
- issue: A metáfora do Espírito revestindo Gideão
  choice: revestiu Gideão
  alternative: veio sobre Gideão
  rationale: Mantém a formulação incomum e teologicamente sugestiva do hebraico, sem resolver a imagem em uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Revestiu Gideão” conserva a metáfora hebraica, enquanto “os abiezritas” explicita de modo natural que Abiezer designa aqui o clã.
