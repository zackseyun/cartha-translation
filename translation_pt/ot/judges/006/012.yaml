  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: pt
  text: 'Então o anjo de Yahweh[a] apareceu a ele e lhe disse: “Yahweh está com você, guerreiro valente[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”. A palavra hebraica pode significar tanto “mensageiro” como “anjo”; nesta cena de manifestação, “anjo” se ajusta melhor ao contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “homem valente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה é a forma narrativa habitual para uma manifestação visível. “Apareceu” é natural em português e evita a formulação rígida “foi visto”.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode designar um mensageiro humano ou celestial; nesta cena de manifestação, “anjo” é a opção mais natural, sem identificar teologicamente a figura além do que o hebraico afirma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: e lhe disse
  rationale: Mantém o pronome do hebraico sem acrescentar o nome de Gideão, e emprega uma construção idiomática em português.
- source_word: יְהוָה עִמְּךָ
  choice: Yahweh está com você
  rationale: A oração nominal é entendida naturalmente no contexto como declaração presente, não como mero desejo ou saudação optativa.
- source_word: גִּבּוֹר הֶחָיִל
  choice: guerreiro valente
  rationale: A expressão descreve alguém forte, capaz e valoroso, com evidente força marcial neste contexto. A formulação é atual e preserva o efeito do tratamento dirigido a Gideão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Identidade do מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: A tradução conserva a expressão hebraica e sua tensão narrativa, sem impor uma identificação cristológica ou outra conclusão doutrinária.
- issue: Valor da oração nominal יְהוָה עִמְּךָ
  choice: 'declaração: “Yahweh está com você”'
  alternative: 'desejo ou saudação: “Que Yahweh esteja com você”'
  rationale: No fluxo da cena, a leitura declarativa é a mais natural, embora a construção hebraica, isoladamente, não contenha verbo expresso.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “você” para o singular de segunda pessoa. A ordem narrativa foi mantida, e os marcadores foram colocados junto às expressões a que suas notas se referem.
