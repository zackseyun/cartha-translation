id: JDG.6.13
reference: Judges 6:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: pt
  text: 'Gideão lhe disse: “Por favor, meu senhor,[a] se Yahweh está conosco, por que tudo isso nos aconteceu? E onde estão todas as suas maravilhas[b], das quais nossos pais nos falaram, dizendo: ‘Não foi Yahweh quem nos tirou do Egito?’ Mas agora Yahweh nos abandonou e nos entregou nas mãos de Midiã.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Perdão, meu senhor”. O hebraico emprega uma forma cortês de tratamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus feitos maravilhosos” ou “seus milagres”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “na mão de Midiã”, expressão que significa sob o poder de Midiã.
    reason: idiom_explanation
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Por favor, meu senhor
  rationale: בִּי é uma interjeição cortês, e אֲדֹנִי funciona aqui como forma respeitosa de tratamento. A formulação preserva a deferência sem definir o mensageiro como divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: se Yahweh está conosco
  rationale: Embora a construção seja formalmente existencial e coordenada, no contexto introduz a premissa condicional do questionamento de Gideão.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: por que tudo isso nos aconteceu?
  rationale: מצא, tendo a calamidade como sujeito, pode indicar aquilo que sobrevém a alguém. A tradução é natural e mantém o sentido do infortúnio que atingiu Israel.
- source_word: נִפְלְאֹתָיו
  choice: suas maravilhas
  rationale: O termo designa feitos extraordinários que despertam admiração, especialmente atos divinos na história da salvação, sem exigir a especificação exclusiva de “milagres”.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: das quais nossos pais nos falaram
  rationale: Mantém o ato de transmitir e narrar os feitos de Yahweh e preserva a referência aos antepassados de Israel como portadores dessa tradição.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: Não foi Yahweh quem nos tirou do Egito?
  rationale: A pergunta retórica espera resposta afirmativa. “Tirou do Egito” expressa de modo corrente em português a saída conduzida por Yahweh, enquanto a construção enfática “não foi... quem” preserva a força retórica.
- source_word: נְטָשָׁנוּ
  choice: nos abandonou
  rationale: Expressa em linguagem moderna a ideia de deixar, desamparar ou rejeitar e mantém a força emocional da queixa de Gideão.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: nos entregou nas mãos de Midiã
  rationale: Preserva a imagem hebraica da “mão” como poder ou domínio, usando uma expressão idiomática compreensível em português.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo ou território.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Referência de אֲדֹנִי na fala de Gideão
  choice: 'forma respeitosa de tratamento: “meu senhor”'
  alternative: 'título divino: “Senhor”'
  rationale: Neste ponto da narrativa, a expressão pode ser entendida como tratamento deferente dirigido ao mensageiro. A inicial minúscula evita antecipar uma identificação teológica que a cláusula, isoladamente, não exige.
- issue: Força de וְיֵשׁ na pergunta de Gideão
  choice: 'condicional: “se Yahweh está conosco”'
  alternative: 'coordenativa ou asseverativa: “e Yahweh está conosco”'
  rationale: O contexto argumentativo favorece a leitura condicional, mas ela continua sendo a formulação retórica de Gideão, não uma negação editorial da presença de Yahweh.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A sintaxe acompanha o movimento retórico da queixa de Gideão, preservando a repetição de Yahweh e a tensão entre a tradição do êxodo e o sofrimento presente. “Nas mãos de Midiã” mantém a imagem sem soar excessivamente literal.
