base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: pt
  text: Pois eles e seus rebanhos subiam, e suas tendas chegavam em multidão, como gafanhotos.[a] Eles e seus camelos eram incontáveis; vinham à terra para devastá-la.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “numerosos como gafanhotos” ou “como enxames de gafanhotos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para destruí-la”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de como os invasores empobreciam Israel, preservando a ligação causal com o contexto anterior.
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: eles subiam com seus rebanhos
  rationale: O imperfeito indica ação habitual e repetida no passado. Embora o hebraico coordene literalmente as pessoas e os animais como sujeitos, 'com seus rebanhos' comunica isso com naturalidade em português.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: e suas tendas, chegando
  rationale: Mantém a imagem concreta das tendas em movimento, uma metonímia dos acampamentos invasores, sem produzir uma formulação excessivamente rígida.
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: em multidão como gafanhotos
  rationale: Preserva a comparação explícita e a ideia de enorme quantidade, sem decidir se a expressão significa especificamente 'enxames'.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Nem eles nem seus camelos podiam ser contados
  rationale: Reproduz idiomaticamente a afirmação hebraica de que os invasores e seus camelos eram incontáveis.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: entravam na terra
  rationale: No contexto descritivo de incursões repetidas, o imperfeito português comunica a ação costumeira; 'entravam' traduz naturalmente o movimento para dentro da terra.
- source_word: לְשַׁחֲתָהּ
  choice: para devastá-la
  rationale: No contexto de invasão, consumo das colheitas e empobrecimento, 'devastar' expressa adequadamente o propósito de arruinar a terra, sem exigir aniquilação absoluta.
theological_decisions: []
