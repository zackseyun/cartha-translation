    text: 'Ou: “numerosos como gafanhotos” ou “como enxames de gafanhotos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para destruí-la”.'
    reason: lexical_alternative
  revision_rationale: A revisão substitui o particípio solto por um verbo finito, preservando a representação hebraica das tendas que chegam — isto é, dos acampamentos invasores. Também torna explícita e idiomática a afirmação de que os invasores e seus camelos eram incontáveis, e mantém o aspecto habitual da narrativa com “subiam” e “vinham”.
