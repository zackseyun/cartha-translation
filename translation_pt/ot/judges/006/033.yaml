base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: pt
  text: Então todos os midianitas, os amalequitas e os povos do Oriente[a] se reuniram, atravessaram e acamparam no vale de Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, «filhos do Oriente», expressão que designa povos orientais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: todo o Midiã
  rationale: Mantém a forma coletiva do hebraico, literalmente «todo Midiã», em vez de explicitar interpretativamente «todos os midianitas».
- source_word: וַ/עֲמָלֵק
  choice: Amaleque
  rationale: Preserva o etnônimo usado coletivamente no hebraico; «os amalequitas» seria possível, mas mais explícito.
- source_word: וּ/בְנֵי קֶדֶם
  choice: os povos do Oriente
  rationale: Expressa em português natural o idiomatismo hebraico «filhos do Oriente», referente a povos ou tribos orientais.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: se reuniram
  rationale: Reproduz de modo natural a ideia de ajuntamento expressa pelo nifal de אסף e por יַחְדָּו; o sentido conjunto já está implícito em «se reuniram».
- source_word: וַ/יַּעַבְרוּ
  choice: atravessaram
  rationale: Mantém o objeto não expresso, como no hebraico, e comunica naturalmente o deslocamento militar.
- source_word: וַֽ/יַּחֲנוּ
  choice: acamparam
  rationale: Equivalente corrente e claro para חנה em contexto militar.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: no vale de Jezreel
  rationale: Traduz עֵמֶק como «vale», designação geográfica tradicional e natural em português.
theological_decisions: []
