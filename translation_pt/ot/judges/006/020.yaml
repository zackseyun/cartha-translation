  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: pt
  text: 'Então o anjo de Deus lhe disse[a]: “Pegue a carne e os pães sem fermento, coloque-os sobre esta rocha e derrame o caldo.” E ele fez assim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Deus”. A palavra hebraica pode se referir tanto a um mensageiro humano quanto a um mensageiro angelical; aqui, o contexto favorece um enviado sobrenatural.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: o anjo de Deus
  rationale: מַלְאַךְ pode designar um mensageiro humano ou angelical; neste contexto narrativo, a figura é um enviado sobrenatural, por isso “anjo” é a formulação mais natural, sem eliminar a alternativa lexical indicada em nota.
- source_word: קַח
  choice: Pegue
  rationale: O imperativo de לקח significa diretamente “tomar/pegar”. “Pegue” é corrente e claro em português, sem acrescentar a ideia direcional de “traga”.
- source_word: הַבָּשָׂר
  choice: a carne
  rationale: Em contexto alimentar, בָּשָׂר corresponde naturalmente a “carne”.
- source_word: הַמַּצּוֹת
  choice: os pães sem fermento
  rationale: מַצּוֹת designa produtos de pão não levedados. A expressão comunica o sentido com clareza e conserva o plural hebraico.
- source_word: וְהַנַּח
  choice: coloque-os
  rationale: O imperativo hifil de נוח significa pôr ou deixar em determinado lugar. O pronome plural retoma conjuntamente a carne e os pães.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: sobre esta rocha
  rationale: סֶלַע é “rocha/rochedo”; com o verbo de colocação, “sobre” expressa naturalmente a relação espacial pretendida, e הַלָּז tem valor demonstrativo.
- source_word: הַמָּרַק
  choice: o caldo
  rationale: מָרָק designa caldo ou líquido de cozimento; “caldo” é exato e natural em português.
- source_word: שְׁפֹוךְ
  choice: derrame
  rationale: O imperativo de שפך significa derramar. Em português, “derrame” comunica por si só o esvaziamento do líquido, sem necessidade de complemento adverbial.
- source_word: וַיַּעַשׂ כֵּן
  choice: E ele fez assim
  rationale: A expressão relata de modo conciso que Gideão cumpriu a instrução; “fez assim” preserva a estrutura e o sentido do hebraico.
theological_decisions:
- issue: Designação do enviado divino em contexto teofânico
  choice: o anjo de Deus
  alternative: o mensageiro de Deus
  rationale: O termo hebraico admite os dois sentidos, mas o contexto de Juízes 6 apresenta a figura como um enviado sobrenatural. “Anjo” preserva esse peso narrativo sem definir além do texto todos os aspectos da manifestação divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Pães sem fermento” evita jargão religioso menos transparente; “rocha” e “caldo” mantêm concretude e naturalidade.
