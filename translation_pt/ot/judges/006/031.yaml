  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: pt
  text: 'Mas Joás disse a todos os que se levantaram contra ele: “Vocês vão defender Baal? Vão salvá-lo? Quem o defender será morto antes do amanhecer. Se ele é um deus, que ele mesmo se defenda, pois o seu altar foi derrubado[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pois ele derrubou o seu altar”; o sujeito implícito pode ser Gideão.
    reason: Preservar a forma ativa do hebraico e a ambiguidade de seu sujeito não expresso.
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: se levantaram contra ele
  rationale: 'A expressão tem sentido adversativo no contexto: os homens confrontam Joás por causa do que Gideão fez. A formulação preserva a imagem verbal sem reduzi-la a uma posição espacial.'
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: defender / defender / que ele mesmo se defenda
  rationale: A repetição de “defender” reproduz a estrutura retórica da raiz ריב e permite tanto a ideia de assumir a causa de Baal como a de agir em seu favor, sem impor um cenário estritamente jurídico ou militar.
- source_word: תּוֹשִׁיעוּן
  choice: salvá-lo
  rationale: 'Traduz diretamente o hifil de ישׁע e conserva a ironia da pergunta: os próprios adoradores teriam de salvar o deus que veneram.'
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: Quem o defender
  rationale: Expressa de modo natural a construção relativa indefinida e mantém a ligação lexical com as demais ocorrências de ריב.
- source_word: יוּמַת
  choice: será morto
  rationale: O hofal é passivo-causativo; “será morto” comunica que a pessoa sofrerá a pena de morte, em vez de apenas morrer.
- source_word: עַד הַבֹּקֶר
  choice: antes do amanhecer
  rationale: No contexto da ameaça, a expressão indica o limite de tempo para a execução. “Antes do amanhecer” é claro e natural em português.
- source_word: אֱלֹהִים הוּא
  choice: ele é um deus
  rationale: אֱלֹהִים refere-se aqui à alegada divindade de Baal, não ao Deus de Israel. O artigo indefinido deixa isso claro.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: pois o seu altar foi derrubado
  rationale: A forma passiva em português mantém em primeiro plano a destruição do altar e evita identificar no texto principal um sujeito que o hebraico não nomeia explicitamente, embora o verbo hebraico esteja no masculino singular. A nota registra a alternativa formal.
- source_word: וַיֹּאמֶר
  choice: Mas Joás disse
  rationale: Embora ו possa simplesmente prosseguir a narrativa, o contexto apresenta uma resposta contrária à exigência da multidão; “Mas” comunica naturalmente essa virada.
theological_decisions:
- issue: Referência de אֱלֹהִים a Baal
  choice: “um deus”, com inicial minúscula
  alternative: “Deus” ou “divino”
  rationale: Joás fala condicionalmente da pretensão de Baal à divindade, sem identificá-lo com o Deus de Israel nem afirmar que ele seja realmente divino.
- issue: Agente da destruição do altar
  choice: Não identificar o agente no texto principal
  alternative: “pois ele derrubou o altar de Baal”, entendendo Gideão como sujeito implícito
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas o sujeito não é expresso. A tradução principal evita resolver silenciosamente essa referência, e a nota preserva a leitura mais formal com Gideão subentendido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto usa “vocês”, natural no português brasileiro e inteligível internacionalmente. A repetição de “defender” conserva a força retórica do hebraico sem recorrer a vocabulário jurídico excessivamente técnico.
