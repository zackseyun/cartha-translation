id: JDG.6.22
reference: Judges 6:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: pt
  text: 'Então Gideão viu que ele era o anjo de Yahweh[a] e disse: “Ah, Senhor Yahweh! Pois vi o anjo de Yahweh face a face.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”. A palavra hebraica pode significar tanto “anjo” como “mensageiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Então ... viu
  rationale: O waw consecutivo faz a narrativa avançar, e ראה significa literalmente “ver”. O contexto também envolve reconhecimento, mas “viu que” preserva a formulação hebraica e comunica essa percepção naturalmente.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo da percepção de Gideão: ele viu ou percebeu que a figura era o anjo de Yahweh.'
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode designar um anjo ou mensageiro. Neste contexto, a figura é um enviado sobrenatural; “anjo” é natural em português, enquanto a nota preserva a alternativa lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוּא
  choice: ele era
  rationale: O pronome identifica a figura que Gideão encontrou; o português pede a cópula explícita.
- source_word: אֲהָהּ
  choice: Ah
  rationale: Interjeição de alarme e consternação; “Ah” mantém concisão e dignidade.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: 'Preserva os dois elementos do tratamento hebraico: o título אֲדֹנָי e o nome divino יְהוָה.'
- source_word: כִּי עַל כֵּן
  choice: Pois
  rationale: Introduz a razão da consternação de Gideão de maneira idiomática, sem sobrecarregar as partículas hebraicas.
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito hebraico relata o encontro recém-ocorrido; o pretérito perfeito é a forma mais natural em português.
- source_word: פָּנִים אֶל פָּנִים
  choice: face a face
  rationale: Equivalente português natural e próximo do idioma hebraico para um encontro direto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem o substituir por um título.
- issue: Identidade e sentido de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: “Anjo” se ajusta ao caráter sobrenatural da cena, mas a nota registra o sentido igualmente possível de “mensageiro”, sem resolver além do texto a tensão sobre a identidade da figura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem narrativa e a repetição de “anjo de Yahweh” foram preservadas; o marcador [a] aparece imediatamente após a expressão pertinente.
