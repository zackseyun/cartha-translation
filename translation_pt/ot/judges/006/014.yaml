base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: pt
  text: 'Então Yahweh voltou-se para ele e disse: “Vá com essa sua força[a] e salve Israel da mão de Midiã[b]. Não fui eu que enviei você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá nesta sua força”. A preposição hebraica pode ter sentido instrumental (“com”) ou locativo/esferal (“em” ou “nesta”); o demonstrativo acrescenta ênfase.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “da mão de Midiã” significa ser libertado do poder ou domínio de Midiã.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: voltou-se para ele
  rationale: Preserva o movimento narrativo indicado por פנה e a direção expressa por אֵלָיו, em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, sem substituí-lo por um título.
- source_word: לֵךְ
  choice: Vá
  rationale: Traduz diretamente o imperativo e mantém a força da comissão dada a Gideão.
- source_word: בְּכֹחֲךָ זֶה
  choice: com essa força que você tem
  rationale: Expressa de modo claro e corrente tanto a força pertencente a Gideão quanto a ênfase do demonstrativo זֶה; a nota preserva a possibilidade de entender בְּ como esfera ou condição.
- source_word: וְהוֹשַׁעְתָּ
  choice: e salve
  rationale: Após o imperativo לֵךְ, a forma funciona naturalmente como continuação da ordem; 'salve' comunica o resgate de Israel sem acrescentar explicação.
- source_word: מִכַּף מִדְיָן
  choice: da mão de Midiã
  rationale: Mantém a imagem hebraica de 'mão' como poder ou domínio, esclarecida em nota.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: Por acaso não enviei você?
  rationale: Conserva a pergunta retórica que espera resposta afirmativa e traduz שלח pelo sentido básico de enviar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; a transliteração preserva o nome próprio sem transformá-lo em título.
- issue: Fonte da missão e da capacidade de Gideão
  choice: Preservar juntas a referência à força de Gideão e a declaração de envio divino
  alternative: Explicitar que a força é exclusivamente divina ou exclusivamente humana
  rationale: O hebraico mantém uma tensão entre 'essa sua força' e 'não enviei você?'. A tradução não resolve essa relação além do que o próprio verso afirma.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O tratamento por “você” favorece a leitura corrente; “voltou-se” e “Por acaso não...” preservam o tom narrativo e retórico sem arcaísmo excessivo.
