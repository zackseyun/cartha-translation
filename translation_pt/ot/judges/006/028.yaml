  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: pt
  text: Quando os homens da cidade se levantaram cedo pela manhã, eis que o altar de Baal estava derrubado, a Aserá que ficava sobre ele havia sido cortada[a], e o segundo touro havia sido oferecido sobre o altar que fora construído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o poste de Aserá”. Em hebraico, literalmente, “a Aserá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: se levantaram cedo
  rationale: O hifil de שׁכם expressa levantar-se cedo; a formulação é natural em português e conserva a ênfase temporal.
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Reproduz o substantivo masculino plural do hebraico sem o neutralizar como “habitantes” ou “povo”.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a vivacidade da descoberta repentina marcada pela partícula hebraica.
- source_word: נֻתַּץ
  choice: estava derrubado
  rationale: O passivo de נתץ indica que o altar fora demolido; em português, “estava derrubado” comunica naturalmente o estado constatado naquela manhã.
- source_word: מִזְבַּח הַבַּעַל
  choice: o altar de Baal
  rationale: Representa diretamente a relação construta do hebraico.
- source_word: הָאֲשֵׁרָה
  choice: a Aserá
  rationale: Mantém o termo hebraico transliterado para não restringir indevidamente o referente a um simples poste; o contexto mostra tratar-se de um objeto cultual que podia ser cortado.
- source_word: אֲשֶׁר עָלָיו
  choice: que ficava sobre ele
  rationale: Conserva o sentido normal de עַל, “sobre”, e o pronome referente ao altar, sem substituí-lo pela interpretação contextual “ao lado dele”.
- source_word: כֹּרָתָה
  choice: havia sido cortada
  rationale: O passivo de כרת descreve o corte do objeto cultual e o mais-que-perfeito explicita sua anterioridade em relação à descoberta.
- source_word: הַפָּר הַשֵּׁנִי
  choice: o segundo novilho
  rationale: פַּר designa um bovino macho, frequentemente jovem; “novilho” é corrente no registro sacrificial e “segundo” preserva a ligação com o contexto anterior.
- source_word: הֹעֲלָה
  choice: havia sido oferecido
  rationale: O hofal de עלה, neste contexto sacrificial, indica que o animal foi feito subir como oferta; “oferecido” comunica o ato sem acrescentar explicitamente uma modalidade que o verbo isolado não nomeia.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: o altar que fora construído
  rationale: A oração relativa traduz de modo natural o particípio passivo e identifica o altar previamente construído.
theological_decisions:
- issue: Referente de אֲשֵׁרָה
  choice: a Aserá
  alternative: o poste de Aserá; o poste sagrado
  rationale: O termo pode nomear a deusa por associação ou seu objeto cultual. A transliteração preserva essa amplitude, enquanto a nota informa a interpretação concreta comum.
- issue: Sentido de עָלָיו
  choice: sobre ele
  alternative: junto dele; ao lado dele
  rationale: Embora a disposição cultual talvez sugira proximidade lateral, o hebraico diz literalmente “sobre ele”. A tradução mantém essa relação espacial e não resolve a possível dificuldade arqueológica ou contextual.
- issue: Valor sacrificial de הֹעֲלָה
  choice: havia sido oferecido
  alternative: havia sido oferecido em holocausto; havia sido sacrificado
  rationale: O contexto aponta para uma oferta queimada, mas a formulação principal evita explicitar mais do que o verbo nesta frase, preservando a ligação sacrificial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva deliberadamente a vivacidade narrativa do hebraico. A única nota está marcada no texto e esclarece a ambiguidade lexical de אֲשֵׁרָה.
