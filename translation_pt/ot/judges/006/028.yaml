revisions:
- from: Quando os homens da cidade se levantaram cedo pela manhã, eis que o altar de Baal estava derrubado, a Aserá que ficava sobre ele havia sido cortada[a], e o segundo novilho havia sido oferecido sobre o altar que fora construído.
  to: Quando os homens da cidade se levantaram cedo pela manhã, eis que o altar de Baal estava derrubado, a Aserá que ficava sobre ele havia sido cortada[a], e o segundo touro havia sido oferecido sobre o altar que fora construído.
  rationale: Substitui-se somente “novilho” por “touro”, a fim de evitar introduzir a noção de idade não especificada por פַּר. Conservam-se a relação “sobre ele”, a ordem narrativa e a nota lexical ancorada em “Aserá”.
