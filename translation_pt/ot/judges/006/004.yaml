  text: וַ/יַּחֲנ֣וּ עֲלֵי/הֶ֗ם וַ/יַּשְׁחִ֨יתוּ֙ אֶת יְב֣וּל הָ/אָ֔רֶץ עַד בּוֹאֲ/ךָ֖ עַזָּ֑ה וְ/לֹֽא יַשְׁאִ֤ירוּ מִֽחְיָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/שֶׂ֥ה וָ/שׁ֖וֹר וַ/חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: pt
  text: Eles acampavam contra os israelitas e destruíam a produção da terra até Gaza[a]. Não deixavam em Israel nenhum meio de subsistência, nem ovelha, nem boi, nem jumento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “até a sua chegada a Gaza”, expressão idiomática que indica a extensão alcançada na direção de Gaza.
    reason: lexical_alternative
  - marker: b
    text: 'Os termos hebraicos no singular podem ter sentido coletivo: rebanhos de ovelhas, gado bovino e jumentos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: Eles acampavam contra os israelitas
  rationale: O imperfeito português expressa naturalmente a ação habitual das incursões descritas no contexto. O referente pronominal foi explicitado como “os israelitas” para evitar ambiguidade em um versículo isolado; עַל tem aqui sentido adversativo.
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: destruíam a produção da terra
  rationale: שׁחת no hifil indica destruir ou devastar, e יְבוּל abrange a produção ou rendimento agrícola, não apenas uma cultura específica.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: até Gaza
  rationale: A expressão hebraica, literalmente ligada à chegada ou aproximação a Gaza, funciona idiomaticamente para indicar a extensão territorial alcançada. A forma concisa é natural em português, enquanto a nota preserva a formulação literal.
- source_word: לֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: Não deixavam em Israel nenhum meio de subsistência
  rationale: מִחְיָה pode designar sustento, subsistência ou aquilo que permite conservar a vida. “Meio de subsistência” mantém sua amplitude econômica e vital sem sugerir necessariamente o extermínio de todos os seres vivos.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: nem ovelha, nem boi, nem jumento
  rationale: Os substantivos singulares têm valor coletivo ou representativo. A repetição de “nem” reproduz com clareza a enumeração enfática do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito imperfeito comunica as ações repetidas no contexto. A formulação mantém a abrangência de מִחְיָה e evita uma leitura excessivamente estreita como apenas “alimento”.
