  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: pt
  text: Os filhos de Israel fizeram o que era mau aos olhos de Yahweh[a], e Yahweh os entregou nas mãos de Midiã por sete anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica e sua forma masculina plural, sendo também uma formulação bíblica compreensível em português.
- source_word: הָרַע
  choice: o que era mau
  rationale: Com o verbo עשה, expressa de modo natural e fiel a ação moralmente reprovável.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a imagem do idioma hebraico e comunica a avaliação feita por Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיִּתְּנֵם ... בְּיַד מִדְיָן
  choice: os entregou nas mãos de Midiã
  rationale: Traduz naturalmente o idioma hebraico de sujeição ao poder ou domínio de alguém; o plural 'mãos' é idiomático em português.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: שֶׁבַע שָׁנִים
  choice: por sete anos
  rationale: A preposição 'por' expressa naturalmente a duração indicada no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o caráter de nome pessoal sem substituir o termo por um título.
- issue: Designação coletiva בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A escolha conserva a forma masculina plural e o idioma recorrente do hebraico, sem impedir a compreensão corporativa da expressão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A construção conserva a fórmula narrativa de Juízes e a imagem avaliativa 'aos olhos de', enquanto 'nas mãos de' torna natural em português o idioma hebraico de poder e controle.
