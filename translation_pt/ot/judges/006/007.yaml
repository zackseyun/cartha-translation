  text: וַ/יְהִ֕י כִּֽי זָעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה עַ֖ל אֹד֥וֹת מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: pt
  text: E aconteceu que, quando os filhos de Israel[a] clamaram a Yahweh por causa de Midiã[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os israelitas». O hebraico diz literalmente «os filhos de Israel».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «devido a Midiã».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva o marcador hebraico de desenvolvimento narrativo, usando linguagem atual e sem a formulação arcaica «e sucedeu».
- source_word: כִּי
  choice: quando
  rationale: Neste contexto, introduz a oração temporal ligada a וַיְהִי.
- source_word: זָעֲקוּ
  choice: clamaram
  rationale: Expressa um grito urgente por socorro dirigido a Deus.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão hebraica; «os israelitas» é uma alternativa mais idiomática.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição indica a pessoa a quem o clamor foi dirigido, e o nome divino é transliterado.
- source_word: עַל אֹדוֹת
  choice: por causa de
  rationale: Indica aqui o motivo do clamor e produz uma formulação portuguesa clara e natural.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Forma portuguesa tradicional do nome do povo e território.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração conserva o nome de aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo forma uma oração dependente cuja continuação vem no versículo seguinte.
