  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: pt
  text: Quando o anjo[a] de Yahweh falou estas palavras a todos os filhos de Israel[b], o povo levantou a voz e chorou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a todos os israelitas”; literalmente, “a todos os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Quando ... falou
  rationale: A construção com וַיְהִי e o infinitivo construto introduz uma oração temporal. “Quando ... falou” comunica com naturalidade a progressão narrativa sem reproduzir de modo rígido “e aconteceu que”.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro humano ou celestial. Neste contexto e segundo o uso bíblico consagrado da expressão, “anjo” é a opção principal mais natural, enquanto a nota preserva a alternativa lexical “mensageiro”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: דְּבָרִים refere-se aqui ao discurso pronunciado; “estas palavras” mantém essa referência verbal direta.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: a todos os filhos de Israel
  rationale: A tradução preserva a forma concreta e tradicional do hebraico, literalmente “filhos de Israel”; a nota oferece a formulação coletiva mais idiomática “israelitas”.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: o povo levantou a voz
  rationale: “Levantar a voz” reproduz de modo natural o idioma hebraico. O singular em português concorda com o substantivo coletivo “povo” e mantém a imagem do texto.
- source_word: וַיִּבְכּוּ
  choice: e chorou
  rationale: בכה significa chorar ou prantear. “Chorou” é claro, solene e não acrescenta uma intensidade que o verbo isoladamente não explicita.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o tetragrama. “Yahweh” preserva o nome pessoal no corpo do texto, sem substituí-lo por um título.
- issue: Identidade e natureza do מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: A tradução mantém a expressão bíblica sem definir além do texto a identidade ou a natureza precisa dessa figura; a alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe evita literalismo excessivo, mas preserva as imagens centrais e as ambiguidades lexicais relevantes do hebraico.
