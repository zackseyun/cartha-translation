base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: pt
  text: 'Também eu disse[a]: “Não os expulsarei da presença de vocês; eles se tornarão adversários de vocês, e os deuses deles se tornarão uma armadilha para vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “lados”. Algumas versões antigas e passagens paralelas trazem ou entendem a expressão como “espinhos nos lados de vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Por isso, eu também
  rationale: Liga a declaração à repreensão anterior e comunica tanto continuidade quanto consequência em português natural.
- source_word: אָמַרְתִּי
  choice: disse
  rationale: O pretérito perfeito corresponde ao verbo comum de fala e se ajusta ao contexto narrativo.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: Não os expulsarei
  rationale: גרש significa expulsar ou fazer sair; a forma escolhida é clara e adequada ao contexto da conquista.
- source_word: מִפְּנֵיכֶם
  choice: da presença de vocês
  rationale: Expressa naturalmente o idioma hebraico 'de diante de vocês', preservando seu sentido espacial.
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: eles se tornarão adversários de vocês
  rationale: O texto massorético traz literalmente 'lados', leitura difícil. 'Adversários' comunica em português o provável sentido de hostilidade exercida junto a Israel sem introduzir no texto principal a leitura alternativa 'espinhos'.
- source_word: וֵאלֹהֵיהֶם
  choice: e os deuses deles
  rationale: Tradução direta e corrente do substantivo com sufixo plural neste contexto de idolatria.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: se tornarão uma armadilha para vocês
  rationale: Preserva a metáfora de מוקש como dispositivo que prende e, figuradamente, como perigo que leva ao pecado.
theological_decisions:
- issue: Leitura difícil לְצִדִּים no Texto Massorético
  choice: adversários de vocês
  alternative: espinhos nos lados de vocês
  rationale: A fonte hebraica tem literalmente 'lados', não 'espinhos'. O texto principal comunica o provável sentido hostil sem harmonizar silenciosamente com versões antigas ou passagens paralelas; a nota registra a dificuldade e a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para a segunda pessoa do plural e mantém as metáforas quando são claras, explicando em nota a leitura hebraica difícil.
