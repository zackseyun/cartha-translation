base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: pt
  text: Então a ira de Yahweh ardeu contra Israel[a], e ele os entregou nas mãos de saqueadores, que os saquearam. Ele os vendeu ao poder[b] de seus inimigos ao redor[c], de modo que já não conseguiam resistir diante de seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a ira de Yahweh se acendeu contra Israel».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «nas mãos de», expressão que significa estar sob o poder de alguém.'
    reason: cultural_note
  - marker: c
    text: 'Ou: «a seus inimigos por todos os lados».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... ardeu
  rationale: Preserva a metáfora hebraica vívida da ira que arde, em português natural e digno, sem reduzi-la à paráfrase simples «ficou irado».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: os entregou nas mãos de
  rationale: Mantém o conhecido idioma hebraico de sujeição ao poder de alguém e continua compreensível em português.
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  choice: saqueadores, que os saquearam
  rationale: Conserva a ligação lexical enfática entre o particípio e o verbo cognato no hebraico.
- source_word: וַיִּמְכְּרֵם
  choice: os vendeu
  rationale: Retém o sentido concreto de «vender» e a força da imagem de julgamento, em vez de suavizá-la como mera entrega.
- source_word: בְּיַד אֹיְבֵיהֶם
  choice: ao poder dos seus inimigos
  rationale: Neste segundo uso, verte o idioma «na mão de» pelo seu sentido em português natural, evitando a construção pouco idiomática «vendeu às mãos de»; a imagem literal é registrada em nota.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: Comunica que os inimigos estavam ao redor de Israel, preservando a possibilidade de entender a expressão em sentido espacial amplo.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: já não conseguiam resistir diante de
  rationale: Expressa naturalmente a incapacidade de manter posição perante o inimigo, conservando a imagem espacial de estar diante dele.
theological_decisions:
- issue: Linguagem antropopática sobre a ira divina
  choice: a ira de Yahweh ardeu contra Israel
  alternative: Yahweh ficou irado com Israel
  rationale: A formulação mantém a imagem forte do hebraico sem acrescentar uma explicação especulativa sobre a natureza da ira divina.
- issue: Metáfora de Israel ser vendido por Yahweh
  choice: Ele os vendeu
  alternative: Ele os entregou
  rationale: Preserva a metáfora judicial e pactual contundente do verbo hebraico, sem atenuar a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição «saqueadores, que os saquearam» é deliberada para reproduzir o efeito cognato do hebraico. A colocação pronominal favorece a fluidez corrente sem perder solenidade.
