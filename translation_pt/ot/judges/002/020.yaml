id: JDG.2.20
reference: Judges 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: pt
  text: 'Então a ira de Yahweh se acendeu contra Israel, e ele disse: “Visto que esta nação violou a minha aliança, que ordenei aos seus antepassados, e não deu ouvidos à minha voz,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: Preserva a metáfora hebraica do ardor da ira em uma expressão natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל
  choice: contra Israel
  rationale: Com o verbo de ira, a preposição indica o alvo da indignação.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz de modo natural a razão da declaração divina e se ajusta à continuação sintática do versículo seguinte.
- source_word: עָבְרוּ
  choice: violou
  rationale: No contexto de aliança, o verbo significa ultrapassar os limites pactuados e, portanto, violar. O singular concorda com o coletivo 'nação'.
- source_word: הַגּוֹי הַזֶּה
  choice: esta nação
  rationale: Mantém a escolha marcada de גוי, sem suavizá-la para 'povo'.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: '''Aliança'' é a tradução corrente e adequada para ברית neste contexto da relação pactuada entre Yahweh e Israel.'
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: que ordenei aos seus antepassados
  rationale: 'Expressa naturalmente a construção hebraica comprimida: a aliança foi dada como mandamento aos antepassados de Israel.'
- source_word: וְלֹא שָׁמְעוּ לְקוֹלִי
  choice: e não deu ouvidos à minha voz
  rationale: Conserva a imagem auditiva do hebraico e também comunica sua implicação de obediência; o singular acompanha o sujeito coletivo 'esta nação'.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem pactual e judicial
  choice: violou a minha aliança ... não deu ouvidos à minha voz
  alternative: quebrou a minha aliança ... não me obedeceu
  rationale: A formulação conserva tanto o vocabulário da aliança quanto a metáfora hebraica de ouvir, sem reduzir a frase a uma paráfrase geral sobre desobediência.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno, mas acessível. 'Antepassados' evita a leitura exclusivamente masculina que 'pais' pode sugerir em português atual, embora represente אבותם no sentido ancestral. A vírgula final foi mantida porque a fala e a oração iniciadas neste versículo continuam no versículo seguinte.
