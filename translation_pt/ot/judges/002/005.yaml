  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: pt
  text: Por isso, deram àquele lugar o nome de Boquim[a] e ali ofereceram sacrifícios a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Boquim soa como a palavra hebraica que significa “os que choram” ou “choradores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: deram ... o nome
  rationale: A construção hebraica significa literalmente “chamaram o nome”, mas a expressão portuguesa natural e fiel para nomear um lugar é “deram ... o nome”.
- source_word: הַמָּקוֹם הַהוּא
  choice: àquele lugar
  rationale: Representa tanto o substantivo definido quanto o demonstrativo הַהוּא de modo idiomático em português.
- source_word: בֹּכִים
  choice: Boquim
  rationale: Por funcionar como nome de lugar, foi transliterado; a forma “Boquim” é legível em português e sua relação com o choro é explicada em nota.
- source_word: וַיִּזְבְּחוּ
  choice: ofereceram sacrifícios
  rationale: Expressa com clareza o sentido cultual do verbo זבח; é mais natural em português neste contexto do que simplesmente “sacrificaram”.
- source_word: שָׁם
  choice: ali
  rationale: Retoma diretamente o lugar recém-nomeado e soa natural em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Conserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem o substituir por um título.
- issue: Traduzir ou transliterar בֹּכִים
  choice: Boquim
  alternative: Os que choram; Choradores
  rationale: O termo funciona como topônimo. A transliteração preserva seu papel de nome próprio, enquanto a nota comunica o sentido lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita literalismo pouco natural em “chamaram o nome”, mas mantém o topônimo, o demonstrativo e o nome divino presentes no hebraico.
