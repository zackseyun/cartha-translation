  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: pt
  text: Quanto a vocês, não deviam fazer aliança[a] com os habitantes desta terra; deviam derrubar os altares deles. Mas vocês não deram ouvidos à minha voz. O que é isso que vocês fizeram?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “cortar uma aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: fazer aliança
  rationale: O hebraico emprega literalmente o verbo “cortar” com “aliança”. “Fazer aliança” é a expressão natural em português e preserva a força pactual de בְּרִית, sem reduzi-la a um tratado meramente político.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: com os habitantes desta terra
  rationale: “Habitantes” traduz de modo conciso o particípio substantivado יֹשְׁבֵי, e “desta terra” mantém a força do demonstrativo הַזֹּאת.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: deviam derrubar os altares deles
  rationale: נתץ indica derrubar ou demolir estruturas, especialmente altares. “Derrubar” é claro e vigoroso; “deviam” apresenta a ordem anterior como obrigação recordada no contexto da repreensão.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: Mas vocês não deram ouvidos à minha voz
  rationale: שמע בְּקוֹל envolve ouvir de maneira obediente. “Dar ouvidos à minha voz” conserva a imagem hebraica e comunica naturalmente a desobediência; “mas” explicita o contraste contextual.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: O que é isso que vocês fizeram?
  rationale: A formulação preserva a estrutura enfática e o tom de espanto e censura do hebraico, sem transformar a pergunta sobre o ato em uma pergunta sobre o motivo.
- source_word: וְאַתֶּם לֹא ... תִכְרְתוּ ... תִּתֹּצוּן
  choice: Quanto a vocês, não deviam fazer ... deviam derrubar
  rationale: Os imperfeitos retomam mandamentos anteriores e antecedem a declaração da falha de Israel. A obrigação passada com “deviam” se ajusta à repreensão, enquanto “Quanto a vocês” representa a ênfase do pronome אַתֶּם.
theological_decisions:
- issue: Terminologia pactual para a relação proibida de Israel com os habitantes cananeus
  choice: fazer aliança
  alternative: fazer um tratado
  rationale: “Aliança” preserva a categoria bíblico-teológica de בְּרִית e não restringe a relação a um acordo exclusivamente político.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O plural “vocês” reproduz a referência coletiva sem regionalismo marcado. A formulação mantém a imagem de “voz” e a tensão entre ordem anterior e desobediência posterior.
