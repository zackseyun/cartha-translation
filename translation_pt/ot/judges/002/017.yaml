id: JDG.2.17
reference: Judges 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: pt
  text: Mesmo assim, eles não deram ouvidos nem aos seus juízes, pois se prostituíram seguindo outros deuses e se curvaram diante deles. Depressa se desviaram do caminho em que seus antepassados haviam andado, obedecendo aos mandamentos de Yahweh; eles não fizeram assim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles não agiram assim”. A expressão retoma de forma elíptica o modo como os antepassados andaram: obedecendo aos mandamentos de Yahweh.'
    reason: Esclarece a referência contextual da expressão hebraica final sem transformar no texto principal uma inferência interpretativa em explicitação definitiva.
lexical_decisions:
- source_word: וְגַם
  choice: Mesmo assim ... nem
  rationale: Expressa o contraste com o contexto anterior e a força intensificadora da combinação hebraica.
- source_word: אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: não deram ouvidos nem aos seus juízes
  rationale: Preserva a imagem hebraica de escutar, com o sentido contextual de atender ou obedecer.
- source_word: שֹׁפְטֵיהֶם
  choice: seus juízes
  rationale: Mantém o termo histórico específico para os líderes levantados por Deus nesse período.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão da recusa em ouvir.
- source_word: זָנוּ אַחֲרֵי
  choice: se prostituíram seguindo
  rationale: Conserva a metáfora forte de infidelidade sexual, enquanto 'seguindo' comunica naturalmente a ideia hebraica de ir atrás.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta da expressão para divindades distintas de Yahweh.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: e se curvaram diante deles
  rationale: Preserva o gesto físico de prostração que, no contexto, expressa culto.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Depressa se desviaram do caminho
  rationale: Mantém tanto a rapidez indicada pelo advérbio quanto a metáfora do caminho.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: em que seus antepassados haviam andado
  rationale: Conserva a metáfora de andar e emprega 'antepassados', mais natural e inclusivo em português para ancestrais.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: obedecendo aos mandamentos de Yahweh
  rationale: Aqui, ouvir mandamentos significa obedecer; o gerúndio liga a obediência ao modo como os antepassados andaram.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לֹא עָשׂוּ כֵן
  choice: eles não fizeram como seus antepassados
  rationale: Explicita de maneira concisa o referente contextual de 'assim', evitando uma formulação obscura em português.
theological_decisions:
- issue: Metáfora de infidelidade da aliança em זָנוּ
  choice: se prostituíram seguindo outros deuses
  alternative: foram infiéis ao seguir outros deuses
  rationale: A formulação mantém a imagem sexual deliberadamente forte usada pelo hebraico para descrever idolatria e infidelidade à aliança.
- issue: Referente de לֹא עָשׂוּ כֵן
  choice: eles não fizeram como seus antepassados
  alternative: eles não fizeram assim
  rationale: O sentido aponta para o exemplo dos antepassados que obedeceram aos mandamentos; a explicitação dá clareza sem resolver uma controvérsia teológica.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Preserva no texto o nome pessoal representado pelo Tetragrama.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva as imagens do ouvir, prostituir-se, curvar-se, desviar-se do caminho e andar, evitando linguagem arcaica.
