  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: pt
  text: Assim, Yahweh deixou essas nações[a], sem expulsá-las rapidamente, e não as entregou nas mãos de Josué.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixou esses povos permanecer”; o verbo hebraico pode significar “permitiu que permanecessem” ou “deixou onde estavam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: deixou
  rationale: O hifil de נוח pode indicar deixar permanecer ou não remover. “Deixou” preserva a concisão e a ambiguidade do hebraico, enquanto a nota explicita a alternativa contextual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: essas nações
  rationale: גּוֹיִם pode significar “nações” ou “povos”; no contexto, refere-se aos grupos étnico-nacionais que permaneciam em Canaã. “Nações” é claro e convencional.
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: sem expulsá-las
  rationale: A construção negativa com o infinitivo causativo de ירשׁ indica que elas não foram desapossadas ou expulsas. “Sem expulsá-las” é natural em português e mantém a ligação com a ação principal.
- source_word: מַהֵר
  choice: rapidamente
  rationale: Equivalente direto e atual do advérbio que indica rapidez.
- source_word: וְלֹא נְתָנָם
  choice: e não as entregou
  rationale: נתן seguido de “na mão de” forma um idioma de entrega ao poder ou controle de alguém; “entregou” comunica esse sentido no contexto militar.
- source_word: בְּיַד יְהוֹשֻׁעַ
  choice: na mão de Josué
  rationale: Mantém a imagem hebraica da mão como esfera de poder ou controle, numa formulação compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino por transliteração, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “na mão de Josué” conserva deliberadamente a imagem do idioma hebraico; a nota mantém abertas as nuances de וַיַּנַּח e גּוֹיִם.
