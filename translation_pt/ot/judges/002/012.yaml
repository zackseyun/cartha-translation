  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: pt
  text: Eles abandonaram Yahweh, o Deus de seus pais, que os havia tirado da terra do Egito, e seguiram outros deuses dentre os deuses dos povos que estavam ao redor deles; curvaram-se diante deles e provocaram Yahweh à ira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonaram
  rationale: O verbo עזב expressa aqui deserção relacional e pactual, não simples afastamento físico; “abandonaram” é atual e preserva essa força.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: o Deus de seus pais
  rationale: Reproduz de modo natural o construto hebraico e conserva o conhecido idioma pactual, especificamente masculino no texto.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: que os havia tirado da terra do Egito
  rationale: O particípio definido identifica Yahweh pelo êxodo; o mais-que-perfeito situa naturalmente essa ação antes do abandono narrado.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: seguiram
  rationale: O idioma hebraico indica adesão ou lealdade. “Seguiram” comunica isso com naturalidade em português, sem o possível sentido meramente espacial de “foram atrás de”.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Traduz diretamente o adjetivo אֲחֵרִים sem interpretar os deuses como simplesmente estrangeiros.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: dentre os deuses dos povos que estavam ao redor deles
  rationale: “Dentre” expressa a leitura partitiva mais provável de מִן, mantendo a referência aos deuses associados aos povos vizinhos.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: curvaram-se diante deles
  rationale: Preserva a ação concreta de prostrar-se, que no contexto constitui culto idólatra, sem substituir a imagem por uma explicação.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: provocaram Yahweh à ira
  rationale: Reflete o valor causativo do Hifil de כעס e mantém a força teológica da reação divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor ou Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal, sem trocá-lo por um título.
- issue: Caráter pactual da apostasia de Israel
  choice: Preservar a linguagem relacional sem explicitação doutrinária adicional
  alternative: Acrescentar no texto que houve quebra da aliança
  rationale: “Abandonaram”, “seguiram outros deuses”, “curvaram-se” e “provocaram ... à ira” comunicam o peso da apostasia, enquanto qualquer expansão sobre quebra da aliança iria além da formulação explícita do versículo.
- issue: Relação de מֵאֱלֹהֵי com “outros deuses”
  choice: 'Leitura partitiva: “dentre os deuses”'
  alternative: 'Leitura geral: “os deuses dos povos ao redor”'
  rationale: A preposição מִן admite valor partitivo neste contexto. A escolha conserva essa relação sintática sem afirmar mais do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o nome Yahweh, o paralelismo narrativo e a imagem concreta da prostração. Não se inseriu a nota [a] da camada inglesa porque ela parece estar ligada ao nome divino, embora seu conteúdo trate de outra expressão; a alternativa relevante foi registrada nas decisões, evitando um marcador editorialmente incoerente.
