source:
  edition: WLC
  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: pt
  text: Também eu não continuarei a expulsar de diante deles nenhuma das nações que Josué deixou quando morreu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não continuarei a expulsar de diante deles nem sequer uma das nações que Josué deixou; e ele morreu”. O hebraico diz mais literalmente “e morreu”; “quando morreu” expressa de maneira mais fluente a relação temporal.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Também eu
  rationale: Preserva a ênfase do pronome independente e a ligação com a declaração divina anterior, em português natural.
- source_word: לֹא אוֹסִיף לְהוֹרִישׁ
  choice: não continuarei a expulsar
  rationale: Na construção negativa, יסף seguido de infinitivo indica cessação ou não continuação da ação; “expulsar” comunica com clareza o sentido de remover os povos da terra.
- source_word: אִישׁ מִן הַגּוֹיִם
  choice: nenhuma das nações
  rationale: אִישׁ tem aqui valor distributivo, isto é, “nem sequer uma”; a formulação escolhida expressa naturalmente o sentido partitivo em português.
- source_word: מִפְּנֵיהֶם
  choice: de diante deles
  rationale: Mantém a imagem hebraica de retirar alguém da presença de outro e combina naturalmente com “expulsar”.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: que Josué deixou
  rationale: Traduz עזב de modo simples e direto, sem acrescentar se Josué deliberadamente permitiu que essas nações permanecessem.
- source_word: וַיָּמֹת
  choice: quando morreu
  rationale: Expressa em português fluente a relação temporal sugerida pelo contexto, enquanto a nota preserva a coordenação mais literal do hebraico.
theological_decisions:
- issue: Identificação do locutor divino
  choice: Manter a primeira pessoa do singular, sem acrescentar “o SENHOR”
  alternative: Explicitar “o SENHOR” como sujeito
  rationale: O hebraico apresenta apenas a fala em primeira pessoa neste versículo; o contexto já identifica o locutor, e acrescentar o nome divino iria além do texto.
- issue: Relação sintática entre as ações de Josué
  choice: Traduzir וַיָּמֹת temporalmente como “quando morreu”
  alternative: Manter a coordenação formal “e morreu”
  rationale: A opção principal comunica com naturalidade a sequência temporal sem resolver além do necessário quais nações foram deixadas; a forma mais literal permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “continuarei a expulsar” conserva a noção de cessação de uma ação em curso; “de diante deles” mantém a imagem do original sem soar excessivamente arcaica.
