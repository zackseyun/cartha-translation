  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: pt
  text: Então Josué, filho de Num, servo de Yahweh, morreu aos cento e dez anos de idade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Então ... morreu
  rationale: O wayyiqtol dá sequência à narrativa. Em português, “Então” expressa naturalmente essa progressão, enquanto “morreu” traduz o Qal de מות.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בִּן נוּן
  choice: filho de Num
  rationale: A cadeia construta indica filiação; esta é a formulação portuguesa natural e transparente.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: עֶבֶד pode designar servo ou escravo, mas aqui funciona como título honorífico de Josué em sua relação com Yahweh; “servo” preserva essa força sem destacar indevidamente a condição de escravidão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: aos cento e dez anos de idade
  rationale: A expressão hebraica de idade, literalmente “filho de cento e dez anos”, é vertida por um equivalente idiomático e preciso em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação do projeto.
- issue: Tradução de עֶבֶד no título de Josué
  choice: servo
  alternative: escravo
  rationale: Embora עֶבֶד comporte ambos os sentidos, neste contexto é um título honorífico estabelecido. “Servo” comunica adequadamente lealdade e submissão sem impor uma ênfase não exigida pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, sem perda de conteúdo. Não se incluiu nota, pois “servo” representa adequadamente o título no contexto; a ambiguidade lexical foi registrada nas decisões.
