revisions:
- from: Sempre que Yahweh levantava juízes para eles, Yahweh estava com o juiz e os salvava das mãos de seus inimigos durante todos os dias do juiz, pois Yahweh se movia de compaixão[a] ao ouvir os gemidos deles por causa dos que os oprimiam e os afligiam.
  to: Sempre que Yahweh lhes levantava juízes, Yahweh estava com o juiz e os salvava das mãos de seus inimigos durante todos os dias do juiz, pois Yahweh se compadecia[a] por causa dos gemidos deles, causados pelos que os oprimiam e os afligiam.
  rationale: A revisão substitui uma expressão pouco idiomática por “se compadecia”, elimina o acréscimo explícito de “ao ouvir” e ajusta a nota para preservar a amplitude lexical de נִחָם sem a conotação inadequada de “cedia”. A oração final deixa claro que os opressores são a causa dos gemidos, conforme a sintaxe e o sentido do hebraico.
