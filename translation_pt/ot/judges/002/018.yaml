  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: pt
  text: Sempre que Yahweh lhes levantava juízes, Yahweh estava com o juiz e os salvava das mãos de seus inimigos durante todos os dias do juiz, pois Yahweh se compadecia[a] por causa dos gemidos deles, causados pelos que os oprimiam e os afligiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reconsiderava” ou “mudava de atitude”. O verbo hebraico pode indicar uma mudança de disposição ou uma resposta compassiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Sempre que
  rationale: No resumo de um padrão recorrente, a combinação introduz cada ocasião repetida em que Yahweh levantava um juiz.
- source_word: הֵקִים ... שֹׁפְטִים
  choice: levantava juízes
  rationale: Mantém a imagem verbal hebraica e a designação tradicional dessas lideranças, deixando que o restante da frase expresse sua função libertadora.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: Yahweh estava com o juiz
  rationale: Expressa diretamente a presença e o apoio divinos sem acrescentar uma explicação interpretativa.
- source_word: וְהוֹשִׁיעָם מִיַּד אֹיְבֵיהֶם
  choice: e os salvava das mãos de seus inimigos
  rationale: O imperfeito combina com o padrão habitual; “das mãos” conserva a imagem concreta do domínio exercido pelos inimigos.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: durante todos os dias do juiz
  rationale: Preserva a formulação hebraica e não define além do texto se o período corresponde estritamente à vida ou ao exercício da liderança do juiz.
- source_word: יִנָּחֵם
  choice: se movia de compaixão
  rationale: Comunica a resposta compassiva de Yahweh ao sofrimento, preservando por nota as possibilidades de mudança de disposição ou de ação sugeridas pelo verbo.
- source_word: מִנַּאֲקָתָם
  choice: ao ouvir os gemidos deles
  rationale: Torna natural em português a relação causal entre os gemidos e a resposta divina, sem sugerir que o simples som tenha efeito mecânico.
- source_word: לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: os que os oprimiam e os afligiam
  rationale: Reproduz os dois particípios ativos e sua sobreposição enfática sem reduzi-los a um único termo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; a transliteração preserva sua função pessoal e pactual sem substituí-lo por um título.
- issue: Linguagem antropopática em יִנָּחֵם יְהוָה
  choice: Yahweh se movia de compaixão
  alternative: Yahweh reconsiderava; Yahweh cedia; Yahweh se compadecia
  rationale: A escolha mantém a resposta afetiva de Deus diante dos gemidos, enquanto a nota reconhece a amplitude do verbo hebraico e evita resolver silenciosamente sua tensão.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. Os imperfeitos foram vertidos como ações habituais, de acordo com o caráter recorrente deste resumo narrativo. A expressão “todos os dias do juiz” foi mantida para não explicitar como “toda a vida” aquilo que o hebraico deixa implícito.
