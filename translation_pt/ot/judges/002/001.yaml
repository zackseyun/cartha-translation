source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: pt
  text: 'Então o anjo de Yahweh[a] subiu de Gilgal a Boquim[b] e disse: “Eu os fiz subir do Egito e os trouxe para a terra que jurei aos seus pais; e eu disse: ‘Nunca quebrarei a minha aliança com vocês’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Boquim provavelmente significa “os que choram” ou indica um lugar de pranto.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro humano ou celestial. Neste contexto, “anjo” é a forma convencional e provável, enquanto a nota preserva a alternativa “mensageiro”. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido direcional de עלה de modo natural e conciso em português.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: O topônimo é mantido em transliteração tradicional.
- source_word: הַבֹּכִים
  choice: Boquim
  rationale: O topônimo é transliterado numa forma legível em português; seu sentido, ligado aos que choram ou ao pranto, é informado em nota.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: Eu tirei vocês do Egito
  rationale: Embora a forma verbal seja formalmente imperfeita, o contexto recapitula uma ação passada, seguida por “os trouxe”. “Tirei” comunica com naturalidade o êxodo do Egito sem perder o sentido contextual de fazer subir.
- source_word: וָאָבִיא אֶתְכֶם
  choice: e os trouxe
  rationale: O hifil de בוא significa fazer entrar ou trazer; o destino expresso em seguida torna “trouxe” claro e idiomático.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém a ressonância pactual da terra prometida e corresponde diretamente ao substantivo hebraico.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: que prometi sob juramento aos seus pais
  rationale: Expressa de forma natural o juramento referente à terra e conserva o masculino plural explícito “seus pais”, associado aos patriarcas.
- source_word: וָאֹמַר
  choice: Eu disse
  rationale: Dá continuidade direta à fala divina e introduz a declaração da aliança.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: Nunca quebrarei a minha aliança com vocês
  rationale: “Quebrar a aliança” é uma expressão portuguesa clara para הפר em contexto pactual; “nunca” comunica naturalmente a negação duradoura de לְעוֹלָם.
theological_decisions:
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: “o anjo de Yahweh”, sem definir sua natureza
  alternative: “o mensageiro de Yahweh”, entendido como um agente criado, ou o anjo como manifestação do próprio Yahweh
  rationale: O mensageiro fala na primeira pessoa como aquele que realizou os atos divinos. A tradução mantém essa tensão narrativa e teológica, sem determinar se ele é um anjo criado ou uma manifestação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa, conserva os topônimos e o nome divino e evita linguagem excessivamente técnica ou confessional.
