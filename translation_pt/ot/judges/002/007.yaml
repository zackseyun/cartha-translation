  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: pt
  text: O povo serviu a Yahweh durante toda a vida de Josué e durante toda a vida dos anciãos que continuaram vivos depois de Josué, os quais tinham visto toda a grande obra[a] que Yahweh havia realizado em favor de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser traduzida como “o grande feito” ou “o grande ato”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: serviu
  rationale: O verbo עבד, tendo Yahweh como objeto, expressa serviço em lealdade à aliança, sentido mais amplo que somente adoração cultual.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa coletivamente a comunidade de Israel; “o povo” é a forma natural e precisa em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֹּל יְמֵי
  choice: durante toda a vida de
  rationale: O idioma hebraico indica todo o período de vida ou atuação da pessoa; esta formulação comunica esse sentido com naturalidade em português.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: O termo se refere aos homens mais velhos reconhecidos como líderes da comunidade, e “anciãos” preserva tanto a designação tradicional quanto a função social.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: continuaram vivos depois de
  rationale: A expressão significa literalmente prolongar os dias depois de alguém, isto é, continuar vivendo após a morte de Josué.
- source_word: רָאוּ
  choice: tinham visto
  rationale: O mais-que-perfeito situa a experiência desses anciãos antes do período em que continuaram servindo a Yahweh.
- source_word: מַעֲשֵׂה ... הַגָּדוֹל
  choice: a grande obra
  rationale: Preserva o substantivo singular coletivo e o adjetivo do hebraico, referindo-se ao conjunto do que Yahweh realizou por Israel.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: havia realizado em favor de Israel
  rationale: 'A preposição ל tem sentido benefactivo neste contexto: a obra foi realizada em benefício de Israel.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “durante toda a vida” conserva o paralelismo temporal hebraico; “continuaram vivos depois de” mantém o sentido do idioma sem recorrer a uma formulação excessivamente literal.
