  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: pt
  text: Então Josué despediu o povo, e os filhos de Israel[a] foram, cada um para a sua herança, a fim de tomar posse da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Literalmente, “os filhos de Israel”.
    reason: Alternativa lexical que esclarece o sentido coletivo da expressão hebraica.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: despediu
  rationale: Neste contexto, שׁלח indica mandar o povo embora ou dispensá-lo. “Despediu” expressa isso de modo natural e conciso em português.
- source_word: הָעָם
  choice: o povo
  rationale: Reproduz o substantivo hebraico sem explicitar “de Israel”, informação que o contexto já fornece.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica tradicional e sua forma masculina coletiva; a alternativa idiomática “os israelitas” é indicada em nota.
- source_word: אִישׁ
  choice: cada um
  rationale: אִישׁ tem aqui força distributiva. “Cada um” comunica essa função com naturalidade em português, sem sugerir indevidamente que apenas homens adultos participaram.
- source_word: לְנַחֲלָתוֹ
  choice: para a sua herança
  rationale: “Herança” mantém a dimensão de porção territorial recebida e a ressonância pactual do termo נַחֲלָה.
- source_word: לָרֶשֶׁת
  choice: a fim de tomar posse de
  rationale: A locução explicita a finalidade expressa pelo infinitivo e conserva o sentido ativo de ocupar ou possuir.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da conquista e distribuição territorial, refere-se à terra concedida a Israel.
theological_decisions:
- issue: Designação coletiva de Israel com forma masculina
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A formulação principal conserva o idioma hebraico e sua forma masculina coletiva, enquanto a nota oferece a equivalência corrente sem alterar o referente corporativo.
- issue: Terminologia da distribuição da terra
  choice: herança
  alternative: porção; propriedade
  rationale: “Herança” preserva a associação da terra com a concessão recebida por Israel, em vez de reduzi-la a mera propriedade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Então” acompanha a progressão narrativa; “a fim de” mantém clara a relação de finalidade. O marcador foi colocado junto à expressão a que a nota efetivamente se refere.
