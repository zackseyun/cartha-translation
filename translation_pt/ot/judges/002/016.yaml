  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: pt
  text: Então Yahweh levantou juízes, e eles os salvaram das mãos dos que os saqueavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os livraram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: levantou
  rationale: O hifil de קום indica que Yahweh fez surgir esses líderes. “Levantou” preserva a iniciativa divina e é natural no contexto de comissionamento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שֹׁפְטִים
  choice: juízes
  rationale: É a correspondência lexical direta e preserva a terminologia característica do livro, sem reduzir esses líderes apenas à função militar de libertadores.
- source_word: וַיּוֹשִׁיעוּם
  choice: eles os salvaram
  rationale: O verbo ישׁע denota salvar ou livrar. “Salvaram” expressa diretamente o resgate efetuado pelos juízes; “livraram” permanece como alternativa lexical em nota.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Mantém a metáfora hebraica de estar sob o poder ou controle de alguém e continua compreensível em português.
- source_word: שֹׁסֵיהֶם
  choice: os que os saqueavam
  rationale: Expressa a ação predatória e repetida de despojar ou saquear, sem diluí-la no termo mais amplo “oprimiam”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome pessoal em vez de o substituir por um título.
- issue: Destacar a função judicial ou libertadora dos שֹׁפְטִים
  choice: Manter “juízes” e descrever sua ação com “eles os salvaram”
  alternative: Traduzir שֹׁפְטִים como “libertadores”
  rationale: O hebraico conserva conjuntamente a designação dos líderes e sua função salvadora; a tradução mantém ambas sem reduzir uma à outra.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A locução “das mãos” preserva a imagem hebraica; “saqueavam” comunica de modo natural a ação contínua dos espoliadores.
