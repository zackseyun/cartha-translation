revisions:
- from: Quando o juiz morria, eles voltavam atrás e se corrompiam ainda mais do que seus antepassados, seguindo outros deuses para servi-los e prostrar-se diante deles. Não abandonavam nenhuma de suas práticas nem seu caminho obstinado.[a]
  to: Quando o juiz morria, eles voltavam e agiam de modo ainda mais corrupto do que seus antepassados, seguindo outros deuses, servindo-os e prostrando-se diante deles. Não abandonavam nenhuma de suas práticas nem sua conduta obstinada.[a]
  rationale: 'A revisão é estritamente estilística e sintática: substitui uma expressão potencialmente ambígua para recaída, harmoniza a coordenação das ações de culto e torna idiomática a metáfora de «caminho» como conduta. Mantêm-se a comparação com os antepassados, a distinção entre servir e prostrar-se e a nota lexical.'
