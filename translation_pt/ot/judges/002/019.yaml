review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a sequência temporal, a recaída após a morte do juiz, o agravamento da corrupção, o seguimento de outros deuses e as duas ações cultuais distintas. Contudo, «voltavam atrás» pode sugerir principalmente a revogação de uma decisão, e a coordenação «para servi-los e prostrar-se» fica sintaticamente menos clara quanto ao sujeito. Uma pequena revisão torna a recaída e as ações subsequentes mais naturais sem alterar o sentido.
  naturalness: O registro é moderno e compreensível. «Voltavam» exprime de modo mais direto o retorno à conduta anterior, e «sua conduta obstinada» é mais idiomático em português do que «seu caminho obstinado», preservando o uso metafórico de «caminho» como modo de viver.
  terminology: «Juiz», «outros deuses», «servi-los» e «prostrar-se diante deles» são escolhas fiéis e adequadas. «Antepassados» é uma explicitação contextual aceitável de אֲבוֹתָם. A nota preserva corretamente a imagem incomum de «deixar cair».
  issues:
  - severity: low
    issue: «Voltavam atrás»
    rationale: A expressão é possível, mas em português costuma evocar desistir ou reverter uma decisão. «Voltavam» comunica mais diretamente a recaída indicada por יָשֻׁבוּ.
  - severity: low
    issue: Coordenação dos infinitivos após «para»
    rationale: Em «para servi-los e prostrar-se diante deles», o segundo infinitivo reflexivo sem flexão pode soar menos claramente ligado a «eles». A reformulação com gerúndios paralelos deixa as duas ações cultuais coordenadas e explicitamente atribuídas ao mesmo sujeito.
  - severity: low
    issue: «Caminho obstinado»
    rationale: Embora mantenha a metáfora hebraica, atribuir obstinação a «caminho» soa menos natural. «Conduta obstinada» verte o valor metafórico de דֶּרֶךְ e a dureza de הַקָּשָׁה com maior fluência.
  revised_text: Quando o juiz morria, eles voltavam e agiam de modo ainda mais corrupto do que seus antepassados, seguindo outros deuses, servindo-os e prostrando-se diante deles. Não abandonavam nenhuma de suas práticas nem sua conduta obstinada.[a]
