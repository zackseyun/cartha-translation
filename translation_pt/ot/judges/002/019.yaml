base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: pt
  text: Quando o juiz morria, eles voltavam e agiam de modo ainda mais corrupto do que seus antepassados, seguindo outros deuses, servindo-os e prostrando-se diante deles. Não abandonavam nenhuma de suas práticas nem sua conduta obstinada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Não deixavam cair nada de suas ações nem de sua conduta obstinada”, isto é, não abandonavam suas práticas nem sua conduta obstinada.'
    reason: Preserva a imagem literal incomum do hifil de נפל com מִן e esclarece seu sentido idiomático no contexto.
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: Quando o juiz morria
  rationale: A construção narrativa com וְהָיָה e infinitivo temporal é expressa naturalmente em português por uma oração temporal. O imperfeito comunica o padrão recorrente descrito no contexto.
- source_word: יָשֻׁבוּ
  choice: eles voltavam atrás
  rationale: O verbo שׁוב indica aqui recaída ou retorno à conduta anterior; “voltavam atrás” transmite essa reversão de modo natural.
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: e se corrompiam ainda mais do que seus antepassados
  rationale: O hifil de שׁחת descreve conduta corrupta, e מִן tem força comparativa. “Antepassados” evita restringir a referência aos pais imediatos.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: seguindo outros deuses
  rationale: A expressão idiomática “andar após” denota adesão e lealdade; “seguindo” preserva esse sentido em português corrente.
- source_word: לְעָבְדָם
  choice: para servi-los
  rationale: “Servir” é o equivalente direto de עבד e mantém distinta a ação de prostrar-se mencionada em seguida.
- source_word: וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: e prostrar-se diante deles
  rationale: A forma reflexiva indica inclinar-se ou prostrar-se em homenagem cultual; a tradução conserva tanto o gesto físico quanto sua dimensão religiosa.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: Não abandonavam nenhuma de suas práticas
  rationale: O hifil de נפל com מִן traz a imagem de deixar cair ou largar. “Abandonavam” comunica idiomaticamente a recusa em deixar tais ações, enquanto “nenhuma” explicita o alcance da negação.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: nem seu caminho obstinado
  rationale: דֶּרֶךְ funciona como metáfora da conduta, e קָשֶׁה exprime dureza ou obstinação. “Caminho obstinado” preserva a metáfora hebraica.
theological_decisions:
- issue: Sentido de אֱלֹהִים אֲחֵרִים no contexto da apostasia de Israel
  choice: outros deuses
  alternative: deuses estrangeiros
  rationale: “Outros deuses” preserva o contraste pactual com o SENHOR sem acrescentar a ideia mais estreita de origem étnica estrangeira.
- issue: Distinção entre servir e prostrar-se no culto
  choice: servi-los e prostrar-se diante deles
  alternative: adorá-los e prestar-lhes culto
  rationale: A opção mantém distintas as duas ações hebraicas, sem reduzir ambas ao termo geral “adorar”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “antepassados” em vez de “pais” para indicar gerações anteriores e mantém “juiz” como termo literário próprio do livro. O imperfeito apresenta o comportamento como ciclo recorrente.
