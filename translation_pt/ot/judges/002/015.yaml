  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: pt
  text: Sempre que saíam[a], a mão de Yahweh estava contra eles para lhes causar desgraça[b], conforme Yahweh tinha dito e conforme lhes tinha jurado. E ficaram muito angustiados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Onde quer que saíssem”; a expressão pode ter o sentido de sair para a batalha ou para uma campanha.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dano”, “calamidade” ou “mal”. Aqui, o hebraico רָעָה se refere à desgraça sofrida, não necessariamente ao mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: Sempre que saíam
  rationale: A expressão abrange todas as ocasiões em que Israel saía para alguma ação ou expedição. A formulação é natural em português e não limita indevidamente o sentido à batalha, embora o contexto permita essa nuance.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Mantém a metáfora antropomórfica hebraica para o poder e a intervenção ativa de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: הָיְתָה בָם לְרָעָה
  choice: estava contra eles para lhes causar desgraça
  rationale: Expressa a ação divina adversa e seu resultado calamitoso. “Desgraça” evita atribuir a רָעָה o sentido necessário de mal moral.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: conforme Yahweh tinha dito
  rationale: O mais-que-perfeito remete naturalmente às advertências anteriormente pronunciadas por Yahweh.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: e conforme lhes tinha jurado
  rationale: Preserva o juramento dirigido a Israel sem acrescentar um conteúdo que o versículo não repete.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: E ficaram muito angustiados
  rationale: Comunica de modo corrente a aflição severa sofrida por Israel e representa מְאֹד por “muito”.
theological_decisions:
- issue: A oposição divina no juízo da aliança
  choice: a mão de Yahweh estava contra eles para lhes causar desgraça
  alternative: a mão de Yahweh estava contra eles para o mal
  rationale: A tradução mantém Yahweh como agente ativo do juízo, sem fazer רָעָה significar necessariamente maldade moral. Assim, preserva a tensão teológica do texto sem amenizá-la nem ampliá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a metáfora “mão de Yahweh”, usa o nome divino e mantém a repetição de Yahweh na primeira oração, evitando explicitação denominacional.
