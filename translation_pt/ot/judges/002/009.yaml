  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: pt
  text: E o sepultaram no território da sua herança[a], em Timnate-Heres, na região montanhosa de Efraim, ao norte do monte Gaás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Josué 24:30 traz “Timnate-Sera” em vez de “Timnate-Heres”. A diferença é preservada aqui como uma variação do nome do lugar nos relatos paralelos do sepultamento.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: E o sepultaram
  rationale: O wayyiqtol dá continuidade à narrativa, e o sufixo de terceira pessoa masculina singular é expresso pelo pronome objeto “o”.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: no território da sua herança
  rationale: גְּבוּל indica aqui a área ou território, não apenas a linha de fronteira; נַחֲלָה conserva a ideia da propriedade recebida como herança.
- source_word: בְּתִמְנַת חֶרֶס
  choice: em Timnate-Heres
  rationale: O topônimo é transliterado em forma legível em português, mantendo a variante apresentada pelo texto hebraico de Juízes.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: Nesta expressão geográfica, הַר designa a região montanhosa, e não necessariamente um monte isolado.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: ao norte do monte Gaás
  rationale: A construção indica localização relativa; “ao norte de” é natural em português, e הַר com o topônimo é vertido como “monte Gaás”.
