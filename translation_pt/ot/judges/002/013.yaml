base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: pt
  text: Eles abandonaram Yahweh e serviram a Baal e às Astartes.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixaram Yahweh e adoraram Baal e as Astartes”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega aqui uma forma plural de Astarte; ela pode se referir a diversas manifestações locais ou imagens dessa deusa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonaram
  rationale: O verbo עזב significa deixar, abandonar ou desamparar. “Abandonaram” é natural no português atual e comunica a deslealdade de Israel sem recorrer a uma forma arcaica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: עבד pode significar servir e, em contexto cúltico, prestar culto. “Serviram” conserva a amplitude do verbo hebraico; os objetos deixam claro o sentido religioso.
- source_word: לַבַּעַל
  choice: a Baal
  rationale: Embora o hebraico use o artigo, “Baal” funciona naturalmente como nome próprio em português. A preposição “a” reproduz o complemento de “serviram”.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: às Astartes
  rationale: A forma hebraica é plural. “Astartes” preserva essa pluralidade e usa em português o nome reconhecível da deusa Astarte; pode designar manifestações locais, imagens ou representações cultuais.
theological_decisions:
- issue: Plural de עַשְׁתָּרוֹת
  choice: às Astartes
  alternative: a Astarte; às Astarotes
  rationale: A tradução mantém o plural morfológico sem decidir se ele indica várias deusas, manifestações locais ou imagens da deusa.
- issue: Nuance cúltica de עבד
  choice: serviram
  alternative: adoraram; prestaram culto a
  rationale: “Serviram” conserva a extensão semântica do original, ao passo que o contexto comunica sua dimensão religiosa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém o paralelismo verbal direto e a ambiguidade do plural hebraico; evita vocabulário arcaico.
