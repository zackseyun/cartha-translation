base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: pt
  text: Também toda aquela geração foi reunida aos seus antepassados[a]. Depois deles surgiu outra geração que não conhecia Yahweh[b], nem sequer a obra que ele havia realizado em favor de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “foi reunida aos seus antepassados” é uma maneira de dizer que aquela geração morreu e se juntou aos que vieram antes dela.
    reason: cultural_note
  - marker: b
    text: Ou “não reconhecia Yahweh”. No hebraico, “conhecer” pode indicar conhecimento relacional ou ligado à aliança, e não apenas estar informado sobre alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: Também toda aquela geração
  rationale: Preserva a força aditiva de וְגַם e apresenta de modo natural a totalidade da geração mencionada.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: foi reunida aos seus antepassados
  rationale: Mantém o idioma hebraico, mas usa 'antepassados' para evitar que 'pais' seja entendido apenas como progenitores imediatos; a nota esclarece que se refere à morte e à união com os que vieram antes.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: Depois deles surgiu outra geração
  rationale: Expressa claramente a sucessão temporal e o aparecimento de um novo grupo geracional.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: não conhecia Yahweh
  rationale: O singular coletivo em português concorda naturalmente com 'geração'. 'Conhecia' preserva a amplitude de יָדַע, que pode envolver conhecimento factual, experiencial, relacional e pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino segundo a convenção do projeto, sem substituí-lo por um título.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה
  choice: nem sequer a obra
  rationale: Após a negação, 'nem sequer' transmite com naturalidade a força aditiva e enfática de וְגַם; 'obra' conserva o singular coletivo de מַעֲשֶׂה.
- source_word: אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: que ele havia realizado em favor de Israel
  rationale: O mais-que-perfeito situa a ação antes do surgimento da nova geração, e 'em favor de' comunica o valor benefactivo de לְ no contexto.
theological_decisions:
- issue: Sentido de 'não conhecia Yahweh'
  choice: Manter 'conhecia' amplo e acrescentar uma nota sobre seu possível sentido relacional ou pactual
  alternative: Traduzir como 'não reconhecia Yahweh' ou limitar a ideia à falta de informação sobre ele
  rationale: O hebraico יָדַע admite conhecimento factual, experiencial e relacional. O paralelo com o desconhecimento da obra divina não permite reduzir com segurança a frase nem à mera ignorância intelectual nem exclusivamente à infidelidade pactual.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A forma 'Yahweh' preserva o nome próprio no texto e segue a convenção declarada do projeto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. A expressão idiomática hebraica foi preservada em forma inteligível, e as ambiguidades lexical e teológica foram mantidas por meio da tradução e das notas.
