  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: pt
  text: Os filhos de Israel fizeram o que era mau aos olhos de Yahweh e serviram[a] aos baalins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adoraram os baalins”. O verbo hebraico também pode indicar o serviço prestado no culto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: Traduz diretamente o verbo comum עשה e forma, com “o que era mau”, uma expressão natural em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar literal do hebraico; “os israelitas” seria uma alternativa mais idiomática, mas menos formalmente próxima.
- source_word: אֶת הָרַע
  choice: o que era mau
  rationale: Expressa em português natural o idiomatismo hebraico “fazer o mal”, mantendo a ideia da avaliação moral das ações.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica de avaliação divina e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: Mantém a amplitude de עבד, que neste contexto inclui serviço cultual e pode ser entendido como adoração.
- source_word: הַבְּעָלִים
  choice: os baalins
  rationale: Mantém o plural hebraico, que se refere aos diversos baais ou às manifestações locais de Baal; “baalins” é uma forma portuguesa reconhecível para esse plural.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” conserva o nome próprio sem substituí-lo por um título.
- issue: Sentido cultual de עבד
  choice: serviram
  alternative: adoraram
  rationale: O contexto envolve idolatria, portanto “adoraram” é possível; “serviram”, porém, reflete mais diretamente o verbo e preserva o contraste bíblico mais amplo entre servir a Yahweh e servir a outros deuses.
- issue: Plural de הַבְּעָלִים
  choice: os baalins
  alternative: os Baais; as manifestações de Baal
  rationale: A tradução conserva o plural genuíno do hebraico sem reduzi-lo ao singular nem decidir de modo excessivo entre divindades, imagens e manifestações locais.
translation_notes:
  register: Português moderno, claro e digno, com proximidade formal ao hebraico. A construção “filhos de Israel” conserva o caráter familiar da expressão original. “Baalins” retém o plural do nome cultual; embora menos corrente que “Baais”, evita a possível leitura do substantivo português comum “bais” e tem tradição de uso bíblico.
