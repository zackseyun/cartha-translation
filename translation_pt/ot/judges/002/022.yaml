base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: pt
  text: a fim de pôr Israel à prova por meio delas[a], para ver se eles guardariam o caminho de Yahweh, andando nele, como seus pais o guardaram, ou não.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por elas”. O pronome hebraico se refere às nações deixadas na terra, conforme o contexto anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: a fim de
  rationale: Expressa naturalmente a finalidade indicada pela preposição hebraica.
- source_word: נַסּוֹת
  choice: pôr à prova
  rationale: Comunica com clareza a ideia de testar ou provar Israel.
- source_word: בָּם
  choice: por meio delas
  rationale: O pronome retoma as nações deixadas na terra e admite sentido instrumental; a formulação é natural em português.
- source_word: הֲשֹׁמְרִים הֵם
  choice: para saber se guardariam
  rationale: Explicita idiomaticamente o conteúdo da prova, sem eliminar a força interrogativa do hebraico.
- source_word: דֶּרֶךְ יְהוָה
  choice: o caminho de Yahweh
  rationale: Preserva a metáfora bíblica do modo de vida ordenado por Yahweh e mantém o nome divino.
- source_word: לָלֶכֶת בָּם
  choice: andando nele
  rationale: Mantém a metáfora de andar no caminho; o singular em português concorda naturalmente com 'caminho'.
- source_word: שָׁמְרוּ אֲבוֹתָם
  choice: seus pais o guardaram
  rationale: Conserva a repetição de שמר e o termo genealógico masculino do hebraico.
- source_word: אִם לֹא
  choice: ou não
  rationale: Completa de modo idiomático a alternativa da pergunta indireta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Translitera o nome pessoal presente no texto, em vez de substituí-lo por um título.
- issue: Referente de אֲבוֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: Preserva a forma masculina e genealógica do hebraico, embora 'antepassados' também seja semanticamente possível.
- issue: Finalidade e conteúdo da prova
  choice: a fim de... pôr Israel à prova, para saber se
  alternative: para provar Israel... se
  rationale: Distingue em português a finalidade da ação e o conteúdo da prova, sem resolver a tensão teológica sobre conhecimento divino e teste humano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora bíblica de guardar o caminho e andar nele foi preservada.
