  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: pt
  text: Sansão ficou deitado até a meia-noite. À meia-noite, levantou-se, agarrou as portas do portão da cidade e os dois batentes e os arrancou[a] junto com a tranca. Depois, pôs tudo sobre os ombros e levou até o alto do monte que fica diante de Hebrom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os tirou do lugar junto com a tranca”. O verbo hebraico pode indicar arrancar ou retirar algo de seu lugar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que fica de frente para Hebrom”. A expressão hebraica também pode ser entendida como “voltado para Hebrom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: ficou deitado
  rationale: Preserva o sentido físico de שׁכב sem afirmar além do texto que Sansão dormiu.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: até a meia-noite / à meia-noite
  rationale: É a forma portuguesa natural de expressar a metade da noite e mantém clara a repetição temporal da narrativa.
- source_word: וַיֶּאֱחֹז
  choice: agarrou
  rationale: Expressa de modo corrente e vigoroso o ato de tomar firmemente.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: as portas do portão da cidade
  rationale: Comunica que se trata das duas folhas que fechavam o portão urbano.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: e os dois batentes
  rationale: Batentes é um termo arquitetônico claro para os elementos laterais do vão, sem sugerir as mezuzot posteriores.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: e os arrancou junto com a tranca
  rationale: נסע neste contexto indica retirar os componentes de seu lugar; 'junto com a tranca' deixa claro que ela também foi levada.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: pôs tudo sobre os ombros
  rationale: Forma natural em português; 'tudo' retoma coletivamente as partes do portão já mencionadas.
- source_word: וַיַּעֲלֵם
  choice: levou até o alto
  rationale: O contexto de pôr a carga nos ombros torna o transporte claro, enquanto 'até o alto' preserva o movimento ascendente.
- source_word: אֶל רֹאשׁ הָהָר
  choice: até o alto do monte
  rationale: Reproduz naturalmente a ideia de chegar ao topo da elevação.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: que fica diante de Hebrom
  rationale: Mantém a relação espacial do idioma hebraico sem precisar se o monte estava diretamente oposto ou apenas voltado na direção de Hebrom.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativamente vigoroso, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Evitou-se dizer que Sansão dormiu, pois o hebraico afirma apenas que ele se deitou. Os marcadores das notas foram posicionados junto às expressões que efetivamente explicam.
