base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: pt
  text: Então os filisteus o agarraram, arrancaram-lhe os olhos[a], levaram-no descendo até Gaza e o prenderam com algemas de bronze; e ele ficou moendo no cárcere[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “furaram-lhe os olhos”. O verbo hebraico descreve concretamente a mutilação dos olhos.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “na casa dos prisioneiros”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: o agarraram
  rationale: אחז indica agarrar ou apoderar-se de alguém. “Agarraram” preserva a ação física e hostil sem reduzir o verbo à ideia mais ampla de capturar.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa consagrada para o povo mencionado no texto.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: arrancaram-lhe os olhos
  rationale: נקר descreve aqui a mutilação concreta dos olhos. A expressão é gráfica, natural em português e evita o eufemismo de simplesmente dizer que o cegaram.
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: levaram-no para Gaza
  rationale: O hifil de ירד comunica fazer descer ou levar para baixo, e o ה direcional em עַזָּתָה indica movimento rumo a Gaza. Em português corrente, “levaram-no para Gaza” expressa naturalmente o movimento; a nuance topográfica de descida não é essencial neste contexto.
- source_word: וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם
  choice: o prenderam com algemas de bronze
  rationale: אסר significa amarrar ou prender, e נְחֻשְׁתַּיִם designa um par ou conjunto de restrições metálicas. “Algemas de bronze” é claro e preserva tanto a contenção física quanto o material.
- source_word: וַיְהִי טוֹחֵן
  choice: ele ficou moendo
  rationale: A construção apresenta a atividade contínua resultante. “Ficou moendo” comunica trabalho prolongado sem acrescentar o objeto “grãos”, ausente no hebraico.
- source_word: בְּבֵית הָאֲסִירִים
  choice: no cárcere
  rationale: A expressão significa literalmente “na casa dos prisioneiros”. “No cárcere” é uma formulação portuguesa natural e digna para o local de encarceramento.
