  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: pt
  text: Então Sansão agarrou as duas colunas centrais[a], sobre as quais a casa se sustentava, e apoiou-se nelas[b], uma com a mão direita e a outra com a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as duas colunas do meio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “firmou-se contra elas”. O verbo hebraico pode indicar apoiar-se, encostar-se ou firmar-se em algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: agarrou
  rationale: O verbo expressa a ação de segurar com firmeza. “Agarrou” é claro, vigoroso e natural em português.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: as duas colunas centrais
  rationale: עַמּוּדֵי significa “colunas”, e הַתָּוֶךְ indica o meio ou a parte central. “Colunas centrais” comunica com naturalidade a localização arquitetônica.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: sobre as quais a casa se sustentava
  rationale: נָכוֹן, neste contexto, indica que a construção estava estabelecida ou sustentada sobre as colunas. A formulação explicita sua função estrutural sem acrescentar detalhes.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: e apoiou-se nelas
  rationale: O verbo סמך pode indicar apoiar-se, encostar-se ou firmar-se em algo. “Apoiou-se nelas” preserva essa amplitude sem definir excessivamente a postura de Sansão.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: uma com a mão direita e a outra com a esquerda
  rationale: A construção distributiva associa uma coluna a cada lado de Sansão. A menção às mãos, embora implícita no hebraico, torna a ação corporal clara e idiomática em português.
- source_word: הַבַּיִת
  choice: a casa
  rationale: “Casa” preserva o sentido básico do termo hebraico. No contexto, refere-se à edificação, mas não é necessário substituir a designação da fonte por “templo” ou “prédio”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. “Casa” mantém a designação hebraica, enquanto “se sustentava” esclarece a função estrutural das colunas. Os marcadores foram associados às respectivas questões lexicais.
