base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: pt
  text: Então seus irmãos e toda a família de seu pai desceram, carregaram-no, subiram e o sepultaram entre Zorá e Estaol, no túmulo de Manoá, seu pai. Ele julgou Israel durante vinte anos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ora, ele havia julgado Israel durante vinte anos.” O hebraico também pode ser entendido como um resumo retrospectivo.'
    reason: Leitura temporal alternativa da oração final.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: Preserva diretamente o movimento descendente indicado por ירד, sem fixar de modo desnecessário o ponto de vista narrativo como “vieram” ou “foram”.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: O sentido normal é o de irmãos; o contexto não exige o termo mais amplo “parentes”.
- source_word: כָּל בֵּית אָבִיהוּ
  choice: toda a família de seu pai
  rationale: A expressão hebraica designa a casa ou unidade familiar paterna. “Família” comunica o sentido social com naturalidade em português moderno.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: carregaram-no
  rationale: No contexto do sepultamento, נשא indica que transportaram o corpo. A forma escolhida é direta e não acrescenta ao texto o substantivo “corpo”.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Mantém o movimento ascendente, provavelmente topográfico. O objeto continua implícito como no hebraico, mas é facilmente recuperado do contexto.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: Equivalente claro e digno para o verbo comum de sepultar.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: entre Zorá e Estaol
  rationale: Reproduz diretamente a localização entre as duas cidades, usando formas portuguesas legíveis dos nomes próprios.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: no túmulo de Manoá, seu pai
  rationale: קבר pode indicar sepultura ou túmulo; “túmulo” convém ao local de sepultamento familiar, e a aposição “seu pai” é preservada.
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: Ele julgou Israel
  rationale: “Julgou” conserva a terminologia recorrente do livro para a função dos juízes, sem reduzir o papel a governar nem ampliar explicitamente para libertar.
- source_word: עֶשְׂרִים שָׁנָה
  choice: durante vinte anos
  rationale: Expressa com naturalidade portuguesa a duração indicada pela construção hebraica.
theological_decisions:
- issue: Resumo narrativo do período de Sansão como juiz
  choice: Ele julgou Israel durante vinte anos
  alternative: Ora, ele havia julgado Israel durante vinte anos
  rationale: A forma hebraica após o relato do sepultamento admite tanto um resumo em passado simples quanto uma leitura retrospectiva semelhante ao mais-que-perfeito. O texto principal mantém a fórmula recorrente de Juízes, enquanto a nota conserva a alternativa temporal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência concisa de verbos preserva o ritmo narrativo hebraico; evitam-se explicitações desnecessárias e terminologia denominacional.
