base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: pt
  text: 'Quando o povo o viu, louvou o seu deus, pois disseram: “Nosso deus entregou em nossas mãos o nosso inimigo, o devastador da nossa terra, aquele que multiplicou os nossos mortos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתַן ... בְיָדֵנוּ
  choice: entregou em nossas mãos
  rationale: Expressa naturalmente em português a fórmula hebraica de pôr alguém sob o poder de outro, preservando a imagem das mãos.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: o devastador da nossa terra
  rationale: Mantém o particípio substantivado e a força de destruição ampla do termo hebraico.
- source_word: הִרְבָּה אֶת־חֲלָלֵינוּ
  choice: multiplicou os nossos mortos
  rationale: Conserva a formulação enfática do hebraico, segundo a qual Sansão fez aumentar o número dos filisteus mortos.
theological_decisions:
- issue: Referência a Dagom como אֱלֹהֵינוּ / אֱלֹהֵיהֶם
  choice: “nosso deus” / “seu deus”, com inicial minúscula
  alternative: “nosso Deus” / “seu Deus”
  rationale: O contexto identifica uma divindade filisteia; a inicial minúscula evita sugerir que o narrador a equipare ao Deus de Israel, sem acrescentar juízo explícito ao texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação do paralelismo descritivo do hebraico. O singular coletivo הָעָם é vertido por “o povo” seguido de verbo no singular.
