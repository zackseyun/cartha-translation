base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: pt
  text: Depois disso, ele amou uma mulher no vale de Soreque[a], e o nome dela era Dalila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao ribeiro de Soreque”. O termo hebraico נַחַל pode indicar um vale, o leito de um ribeiro ou um curso de água sazonal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa de modo natural a sequência temporal da fórmula narrativa hebraica, sem reproduzir desnecessariamente o literalismo “e aconteceu”.
- source_word: וַיֶּאֱהַב
  choice: ele amou
  rationale: Traduz diretamente o verbo אָהַב e evita acrescentar a nuance específica de “apaixonar-se”, que o hebraico não exige.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O contexto não indica casamento; por isso, “mulher” preserva o sentido neutro, em vez de “esposa”.
- source_word: בְּנַחַל שֹׂרֵק
  choice: no vale de Soreque
  rationale: נַחַל pode designar vale, leito de ribeiro ou curso de água sazonal. “Vale” é claro e natural em português, enquanto a nota preserva a amplitude geográfica do termo.
- source_word: וּשְׁמָהּ
  choice: e o nome dela era
  rationale: Mantém a estrutura explícita do hebraico e soa natural em português moderno.
- source_word: דְּלִילָה
  choice: Dalila
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem rigidez. O marcador da nota foi colocado após “Soreque”, termo ao qual a alternativa lexical se refere.
