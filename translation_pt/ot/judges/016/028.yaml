revisions:
- from: 'Então Sansão clamou a Yahweh e disse: “Senhor Yahweh, por favor, lembra-te de mim e fortalece-me apenas esta vez, ó Deus, para que eu me vingue dos filisteus por um dos meus dois olhos”.[a]'
  to: 'Então Sansão clamou a Yahweh e disse: “Senhor Yahweh, lembra-te de mim, por favor, e fortalece-me, por favor, só desta vez, ó Deus, para que eu me vingue dos filisteus pelos meus dois olhos, de uma só vez.”[a]'
  rationale: 'A revisão corrige o erro substantivo na cláusula final: Sansão não pede vingança por apenas um de seus olhos. Ele pede vingança contra os filisteus pelos seus dois olhos, com a limitação expressa por אַחַת, vertida idiomaticamente como “de uma só vez”. A nota mantém o esclarecimento contextual necessário para a expressão literal, sem introduzir uma ambiguidade sintática indevida.'
