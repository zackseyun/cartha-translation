base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: pt
  text: 'Então Sansão clamou a Yahweh e disse: “Senhor Yahweh, lembra-te de mim, por favor, e fortalece-me, por favor, só desta vez, ó Deus, para que eu me vingue dos filisteus pelos meus dois olhos, de uma só vez.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pelos meus dois olhos”; isto se refere ao fato de os filisteus terem cegado Sansão.
    reason: esclarecimento_contextual
lexical_decisions:
- source_word: וַיִּקְרָא שִׁמְשׁוֹן אֶל־יְהוָה
  choice: Então Sansão clamou a Yahweh
  rationale: קרא אל, dirigido a Deus, indica invocação ou clamor. “Clamou a” é natural em português e preserva a intensidade da oração sem acrescentar desespero ao texto.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: Senhor Yahweh
  rationale: Mantém distintos o título אֲדֹנָי e o nome divino יהוה, evitando substituir o segundo por um título genérico.
- source_word: זָכְרֵנִי נָא
  choice: por favor, lembra-te de mim
  rationale: O imperativo com נָא expressa súplica cortês e urgente. A colocação pronominal é digna e amplamente compreensível.
- source_word: וְחַזְּקֵנִי נָא אַךְ הַפַּעַם הַזֶּה
  choice: e fortalece-me apenas esta vez
  rationale: חזק no piel pede que Deus lhe conceda força; אַךְ limita o pedido à ocasião presente.
- source_word: הָאֱלֹהִים
  choice: ó Deus
  rationale: O artigo acompanha o vocativo divino no hebraico; “ó Deus” comunica claramente a invocação direta.
- source_word: וְאִנָּקְמָה
  choice: para que eu me vingue
  rationale: A forma volitiva expressa o propósito do pedido. A voz reflexiva portuguesa corresponde bem à ideia de obter vingança para si.
- source_word: נְקַם אַחַת מִשְּׁתֵי עֵינַי מִפְּלִשְׁתִּים
  choice: dos filisteus por um dos meus dois olhos
  rationale: A leitura sintática mais direta liga אַחַת a “um” dentre os dois olhos e usa “vingar-se de alguém por algo”, construção idiomática em português. A formulação hebraica compacta permite uma análise alternativa, registrada em nota.
theological_decisions:
- issue: Distinção entre o nome divino e o título na oração de Sansão
  choice: Yahweh; Senhor Yahweh
  alternative: SENHOR; Senhor DEUS
  rationale: A tradução conserva יהוה como nome pessoal e representa separadamente אֲדֹנָי no endereço composto, sem fundir os dois elementos.
- issue: Objeto e alcance da vingança pedida por Sansão
  choice: vingança contra os filisteus por um dos seus dois olhos
  alternative: um único ato de vingança pelos dois olhos
  rationale: A leitura escolhida segue de perto אַחַת מִשְּׁתֵי עֵינַי (“um dos meus dois olhos”) e não justifica moralmente o pedido; apenas o relata. A possível leitura alternativa da construção condensada é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa singular na oração (“lembra-te”, “fortalece-me”). “Yahweh” preserva o nome divino; “Senhor Yahweh” mantém os dois elementos do endereço hebraico. A nota explicita, sem resolver à força, a ambiguidade da cláusula final.
