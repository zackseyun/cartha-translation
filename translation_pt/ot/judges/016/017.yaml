  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: pt
  text: 'Então ele lhe revelou tudo o que havia em seu coração[a] e disse: “Nunca passou navalha sobre a minha cabeça, pois sou nazireu de Deus[b] desde o ventre de minha mãe. Se raparem a minha cabeça, minha força me deixará; ficarei fraco e serei como qualquer outro homem[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “contou-lhe todo o seu coração”.
    reason: lexical_alternative
  - marker: b
    text: “Nazireu” é o termo para uma pessoa especialmente consagrada a Deus.
    reason: cultural_note
  - marker: c
    text: Mais literalmente, “como todo homem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לָהּ אֶת כָּל לִבּוֹ
  choice: ele lhe revelou tudo o que havia em seu coração
  rationale: Expressa de modo natural o idioma hebraico de plena revelação, preservando a imagem do coração sem reduzi-la simplesmente a “contou-lhe tudo”.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: Nunca passou navalha sobre a minha cabeça
  rationale: Mantém tanto o instrumento quanto a imagem verbal do hebraico, em português claro e corrente.
- source_word: נְזִיר אֱלֹהִים
  choice: nazireu de Deus
  rationale: Preserva o termo técnico e sua ligação com a consagração descrita no restante das Escrituras, bem como a relação explícita com Deus.
- source_word: מִבֶּטֶן אִמִּי
  choice: desde o ventre de minha mãe
  rationale: Reproduz com naturalidade o idioma hebraico que indica uma condição existente desde antes do nascimento.
- source_word: אִם גֻּלַּחְתִּי
  choice: Se raparem a minha cabeça
  rationale: 'Torna explícita a cabeça, já indicada pelo contexto imediato, e conserva o sentido passivo: outra pessoa faria isso a Sansão.'
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: minha força me deixará
  rationale: Comunica em português moderno o afastamento da força expresso pelo verbo hebraico.
- source_word: וְחָלִיתִי
  choice: ficarei fraco
  rationale: No contexto, o verbo indica perda de vigor, não enfermidade física.
- source_word: כְּכָל הָאָדָם
  choice: como qualquer outro homem
  rationale: Expressa naturalmente o contraste entre a força extraordinária de Sansão e a condição de um homem comum; a nota conserva a forma mais literal.
theological_decisions:
- issue: Designação da consagração de Sansão
  choice: nazireu de Deus
  alternative: consagrado a Deus
  rationale: “Nazireu” mantém a designação técnica de נְזִיר e a ligação canônica com a instituição nazireia, sem transformar o termo em uma explicação teológica genérica.
- issue: Sentido de הָאָדָם na comparação final
  choice: homem
  alternative: ser humano
  rationale: No contexto narrativo, Sansão compara sua condição física à de qualquer homem comum. A tradução mantém a referência masculina pertinente ao personagem sem ampliar o texto para uma afirmação abstrata sobre a humanidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos, conserva a metáfora hebraica do coração por meio de uma expressão natural e mantém “nazireu” como termo técnico.
