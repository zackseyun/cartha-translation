revisions:
- from: 'Então Dalila pegou cordas novas e o amarrou com elas[a]. Depois lhe disse: “Os filisteus estão atacando você, Sansão!” A emboscada estava à espera no quarto interior[b]. Mas ele arrebentou as cordas de seus braços como se fossem um fio.'
  to: 'Então Dalila pegou cordas novas e o amarrou com elas[a]. E lhe disse: “Os filisteus estão atacando você, Sansão!” A emboscada estava à espera no quarto interior[b]. Mas ele as arrebentou e as tirou de seus braços como um fio.'
  rationale: A revisão conserva as escolhas lexicais e a nota de ambiguidade do rascunho, mas explicita corretamente que Sansão rompeu os vínculos e os retirou de sobre os braços. Também restaura a comparação simples “como um fio” e evita um conector temporal não exigido pelo hebraico.
