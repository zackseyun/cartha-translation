review_pass:
  verdict: revise
  source_fidelity: 'O texto transmite corretamente a sequência narrativa, as cordas novas, o alerta aos filisteus, a presença oculta e o rompimento dos vínculos. Contudo, “arrebentou as cordas de seus braços” pode sugerir que as cordas pertenciam aos braços, em vez de indicar que ele as rompeu e removeu de sobre os braços. A comparação final também deve permanecer direta, como no hebraico: “como um fio”.'
  naturalness: O português é claro e atual. A revisão elimina o conector temporal “Depois”, que não está expresso no hebraico, e torna mais natural e preciso o desfecho.
  terminology: “Dalila”, “filisteus”, “Sansão”, “cordas novas” e “quarto interior” são adequados. A nota preserva apropriadamente a ambiguidade funcional do particípio singular הָאֹרֵב e a alternativa para חֶדֶר.
  issues:
  - severity: medium
    issue: “Arrebentou as cordas de seus braços” é sintaticamente ambíguo.
    rationale: A construção pode ser entendida como “as cordas que seus braços têm”, não como a ação de romper os vínculos que estavam sobre os braços. O hebraico afirma que ele as rompeu de sobre os braços.
  - severity: low
    issue: “como se fossem um fio” altera a comparação direta.
    rationale: O hebraico diz literalmente “como um fio”; não requer a construção hipotética nem a concordância plural.
  - severity: low
    issue: “Depois” acrescenta uma progressão temporal que não é necessária no texto-fonte.
    rationale: A conjunção hebraica liga as ações de forma simples; “e lhe disse” é mais próximo e igualmente natural.
