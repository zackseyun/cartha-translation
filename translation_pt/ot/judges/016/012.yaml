  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: pt
  text: 'Então Dalila pegou cordas novas e o amarrou com elas[a]. E lhe disse: “Os filisteus estão atacando você, Sansão!” A emboscada estava à espera no quarto interior[b]. Mas ele as arrebentou e as tirou de seus braços como um fio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cordões novos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Quem estava de tocaia permanecia no quarto interior”. O hebraico emprega um particípio singular, que pode indicar uma pessoa escondida ou funcionar coletivamente para a emboscada. “Quarto interior” também pode ser traduzido por “câmara”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים חֲדָשִׁים
  choice: cordas novas
  rationale: עֲבֹתִים designa cordas grossas usadas para prender; “cordas” é natural em português e mantém o contraste com o fio no fim do versículo. חֲדָשִׁים é traduzido diretamente por “novas”.
- source_word: וַתַּאַסְרֵהוּ
  choice: o amarrou
  rationale: Expressa de modo claro e atual o ato de prendê-lo com as cordas, sem acrescentar detalhes ausentes no hebraico.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Os filisteus estão atacando você
  rationale: Reproduz em português natural a urgência da fórmula hebraica, literalmente “os filisteus sobre você”, evitando a construção pouco idiomática “estão sobre você”.
- source_word: וְהָאֹרֵב יֹשֵׁב
  choice: A emboscada estava à espera
  rationale: O particípio singular הָאֹרֵב pode indicar quem está de tocaia ou, coletivamente, a emboscada. A formulação conserva esse valor funcional e torna explícita a espera implícita em יֹשֵׁב no contexto.
- source_word: בֶּחָדֶר
  choice: no quarto interior
  rationale: חֶדֶר pode designar um cômodo privado ou interior, adequado ao esconderijo da emboscada.
- source_word: וַיְנַתְּקֵם מֵעַל זְרֹעֹתָיו
  choice: arrebentou as cordas de seus braços
  rationale: O verbo descreve rompimento ou arrancamento vigoroso. Repetir “as cordas” evita em português uma referência pronominal pouco clara.
- source_word: כַּחוּט
  choice: como se fossem um fio
  rationale: Mantém a imagem singular do hebraico e comunica a facilidade com que Sansão rompeu várias cordas.
