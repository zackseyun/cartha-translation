base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: pt
  text: Então os governantes dos filisteus[a] levaram a ela sete cordas de arco frescas, que ainda não tinham secado, e ela o amarrou com elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os senhores dos filisteus”. O termo hebraico se refere aos principais dirigentes filisteus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: levaram a ela
  rationale: O hifil de עלה pode significar literalmente “fazer subir” ou “levar para cima”. No contexto, os governantes fornecem a Dalila os objetos pedidos; “levaram a ela” comunica naturalmente essa ação sem impor uma direção geográfica incerta.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: os governantes dos filisteus
  rationale: סְרָנִים designa os principais dirigentes políticos filisteus. “Governantes” é claro e atual, evitando a conotação feudal que “senhores” pode ter.
- source_word: יְתָרִים
  choice: cordas de arco
  rationale: O substantivo pode designar cordas, especialmente cordas usadas em arcos. “Cordas de arco” preserva o provável referente sem sugerir cordas grossas comuns.
- source_word: לַחִים
  choice: frescas
  rationale: O adjetivo indica material ainda fresco ou úmido, não ressecado. “Frescas”, junto da oração seguinte, expressa o estado não seco de modo natural.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: que ainda não tinham secado
  rationale: A expressão descreve as cordas como não secas. A formulação portuguesa preserva o estado resultante e a anterioridade narrativa sem exigir uma leitura estritamente passiva.
- source_word: וַתַּאַסְרֵהוּ
  choice: ela o amarrou
  rationale: אסר significa amarrar ou prender. “Amarrou” é direto, natural e adequado à ação concreta da narrativa.
- source_word: בָּהֶם
  choice: com elas
  rationale: A preposição indica instrumento, e o pronome retoma naturalmente “cordas” no feminino plural em português.
