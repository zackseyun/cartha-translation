  to: Então ela o fez adormecer no colo dela[a], chamou um homem[b] e rapou as sete mechas da cabeça dele[c]. Depois começou a afligi-lo, e sua força o abandonou.
  rationale: A revisão limita-se a dois ajustes idiomáticos seguros. «No colo dela» é a expressão portuguesa normal para o sentido contextual de «sobre os joelhos dela», enquanto a nota preserva a formulação literal. «Sua força o abandonou» torna a conclusão natural sem acrescentar uma referência explícita ao SENHOR nem alterar a ambiguidade narrativa quanto ao agente material do corte.
