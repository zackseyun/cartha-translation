base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: pt
  text: Então ela o fez adormecer no colo dela[a], chamou um homem[b] e rapou as sete mechas da cabeça dele[c]. Depois começou a afligi-lo, e sua força o abandonou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre os joelhos dela”.
    reason: lexical_alternative
  - marker: b
    text: Ou “convocou um homem”. O hebraico pode referir-se tanto a chamar um homem quanto a convocá-lo para a tarefa.
    reason: alternative_reading
  - marker: c
    text: Ou “as sete tranças da cabeça dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: ela o fez adormecer
  rationale: Preserva o valor causativo do hifil de ישׁן sem especificar de que modo Dalila o induziu ao sono.
- source_word: עַל בִּרְכֶּיהָ
  choice: sobre os seus joelhos
  rationale: Traduz literalmente בִּרְכֶּיהָ, mantendo uma formulação compreensível em português; a alternativa idiomática é registrada em nota.
- source_word: וַתִּקְרָא לָאִישׁ
  choice: chamou um homem
  rationale: Mantém אִישׁ indefinido e deixa em aberto se ela chamou ou convocou o homem para realizar a tarefa.
- source_word: וַתְּגַלַּח
  choice: rapou
  rationale: A forma verbal é feminina singular e mantém Dalila como sujeito gramatical, sem excluir que tenha agido por intermédio do homem chamado.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: as sete mechas da cabeça dele
  rationale: Mechas é natural em português e preserva o sentido amplo de מַחְלְפוֹת; tranças permanece como alternativa lexical possível.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: Depois começou a afligi-lo
  rationale: Preserva o aspecto ingressivo de וַתָּחֶל e a amplitude semântica de ענה, sem definir um mecanismo específico de tormento ou enfraquecimento.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: a força dele o deixou
  rationale: Expressa em português corrente o idioma hebraico de que sua força se afastou ou partiu dele.
theological_decisions:
- issue: Natureza da força perdida por Sansão
  choice: a força dele o deixou
  alternative: a força do SENHOR o deixou
  rationale: O versículo afirma apenas que a força de Sansão o deixou. Embora o contexto mais amplo relacione sua força à ação do SENHOR e à sua condição de nazireu, explicitar isso aqui acrescentaria algo não declarado neste versículo.
- issue: Agente imediato do corte do cabelo
  choice: manter Dalila como sujeito gramatical de “rapou”
  alternative: o homem rapou as mechas
  rationale: A forma massorética וַתְּגַלַּח é feminina singular. A tradução segue essa forma, mas não resolve se Dalila executou pessoalmente a ação ou a fez realizar pelo homem que chamou.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação narrativa é fluida, e as notas preservam alternativas lexicais reais sem sobrecarregar o texto.
