  terminology: «Mechas» é uma boa opção para מַחְלְפוֹת, com «tranças» devidamente registrada como alternativa. «Afligi-lo» é semanticamente fiel ao amplo ענה piel e não introduz uma interpretação específica sobre como Sansão foi enfraquecido.
