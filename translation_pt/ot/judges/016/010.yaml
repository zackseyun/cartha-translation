base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: pt
  text: 'Então Dalila disse a Sansão: “Veja, você zombou de mim[a] e me contou mentiras. Agora, por favor, diga-me com que você pode ser amarrado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “você fez de mim uma boba”; o verbo hebraico pode transmitir a ideia de zombar de alguém ou de brincar com essa pessoa por meio de engano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: הִנֵּה
  choice: Veja
  rationale: Funciona como chamada de atenção antes da acusação de Dalila, em linguagem moderna e direta.
- source_word: הֵתַלְתָּ בִּי
  choice: você zombou de mim
  rationale: O verbo התל pode indicar fazer pouco de alguém ou brincar com a pessoa por meio de engano. “Zombou de mim” preserva a afronta sem se confundir com a menção seguinte às mentiras.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: e me disse mentiras
  rationale: Expressa naturalmente em português a construção hebraica “falou para mim mentiras” e conserva o substantivo plural.
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a passagem da acusação ao novo pedido.
- source_word: הַגִּידָה נָּא לִי
  choice: por favor, diga-me
  rationale: A partícula נָא suaviza o imperativo e lhe dá tom de súplica ou insistência cortês.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: com que você pode ser amarrado
  rationale: “Com que” preserva o valor instrumental da preposição, enquanto a forma passiva de אסר é mantida em “ser amarrado”; “pode” comunica a possibilidade sugerida pelo contexto.
