  to: 'Então Dalila disse a Sansão: “Até agora você zombou de mim e me contou mentiras. Diga-me com que você pode ser amarrado.” Ele lhe respondeu: “Se você tecer as sete mechas da minha cabeça com a trama[a]...”'
  rationale: A revisão limita-se a substituir “junto com a trama” por “com a trama”, refletindo mais diretamente a preposição hebraica e melhorando a fluência. A nota é ajustada para que a alternativa referente ao tear não introduza uma relação espacial ausente do hebraico. A ambiguidade técnica de מַסָּכֶת e a frase condicional incompleta são preservadas.
