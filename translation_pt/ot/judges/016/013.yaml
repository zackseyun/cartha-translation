base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: pt
  text: 'Então Dalila disse a Sansão: “Até agora você zombou de mim e me contou mentiras. Diga-me com que você pode ser amarrado.” Ele lhe respondeu: “Se você tecer as sete mechas da minha cabeça com a trama[a]...”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no tecido” ou “com o tear”. O termo hebraico pertence à linguagem da tecelagem, e sua referência exata aqui é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַלְתָּ בִּי
  choice: você zombou de mim
  rationale: Expressa a ideia de brincar enganosamente com alguém ou fazê-lo de tolo; a menção seguinte às mentiras já explicita o engano.
- source_word: כְּזָבִים
  choice: mentiras
  rationale: Equivalente direto, natural e atual para o substantivo plural.
- source_word: הַגִּידָה לִּי
  choice: Diga-me
  rationale: Forma imperativa natural em português, correspondente ao sentido comum de declarar ou contar.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: com que você pode ser amarrado
  rationale: Preserva tanto o valor instrumental de בַּמֶּה, literalmente “com quê”, quanto a construção passiva.
- source_word: תַּאַרְגִי
  choice: você tecer
  rationale: O verbo ארג significa tecer e pertence ao campo especializado da tecelagem neste contexto.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: as sete mechas da minha cabeça
  rationale: “Mechas” comunica de modo natural os cachos, madeixas ou tranças do cabelo, sem decidir além do que o termo hebraico exige.
- source_word: עִם הַמַּסָּכֶת
  choice: junto com a trama
  rationale: Mantém a preposição “com” e usa um termo de tecelagem plausível, sem definir com certeza se o substantivo indica a trama, o tecido ou alguma parte do tear.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fala direta usa “você”, natural no português brasileiro. As reticências refletem que, no texto hebraico preservado deste versículo, a resposta parece ficar sintaticamente incompleta e prossegue na cena seguinte.
