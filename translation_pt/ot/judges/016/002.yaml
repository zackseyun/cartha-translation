base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: pt
  text: 'Os habitantes de Gaza foram avisados[a]: “Sansão veio para cá”. Então eles o cercaram e ficaram à espreita dele a noite toda, junto ao portão da cidade. Ficaram quietos[b] a noite toda, dizendo: “Ao raiar da manhã[c], nós o mataremos”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi dito aos habitantes de Gaza”.'
    reason: O hebraico traz literalmente uma construção elíptica, “aos habitantes de Gaza, dizendo”, cujo verbo passivo é suprido pelo contexto.
  - marker: b
    text: 'Ou: “permaneceram em silêncio” ou “ficaram imóveis”; o hebraico sugere discrição silenciosa durante a emboscada.'
    reason: A forma verbal pode destacar tanto o silêncio quanto a quietude furtiva.
  - marker: c
    text: 'Literalmente: “até a luz da manhã”.'
    reason: A tradução no texto expressa em português natural o limite temporal da locução hebraica.
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: os habitantes de Gaza
  rationale: O gentílico plural designa os moradores de Gaza. A expressão é clara e natural em português amplo, sem recorrer ao pouco usual “gazitas”.
- source_word: לֵאמֹר
  choice: 'foram avisados:'
  rationale: A construção introduz a notícia transmitida aos habitantes de Gaza. O passivo suprido em português expressa naturalmente a elipse hebraica, e os dois-pontos evitam o redundante “dizendo”.
- source_word: בָּא ... הֵנָּה
  choice: veio para cá
  rationale: Expressa a chegada de Sansão ao lugar dos falantes como fato recém-constatado, em linguagem direta e corrente.
- source_word: וַיָּסֹבּוּ
  choice: o cercaram
  rationale: O verbo indica rodear ou cercar; o objeto masculino é inferido do contexto imediato e se refere a Sansão.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: ficaram de tocaia contra ele
  rationale: Traduz a espera oculta e hostil de uma emboscada, preservando a referência explícita a Sansão.
- source_word: כָל הַלַּיְלָה
  choice: a noite toda
  rationale: Equivalente português natural que mantém a ideia de duração completa.
- source_word: בְּשַׁעַר הָעִיר
  choice: junto ao portão da cidade
  rationale: Indica a área da entrada fortificada da cidade, ponto estratégico para a emboscada; “portão” é prontamente compreensível ao leitor moderno.
- source_word: וַיִּתְחָרְשׁוּ
  choice: ficaram quietos
  rationale: Mantém a amplitude contextual entre silêncio e imobilidade discreta, adequada a homens que aguardam em emboscada.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Ao raiar da manhã
  rationale: Converte de modo natural em português o limite temporal expresso literalmente como “até a luz da manhã”, sem alterar a sequência planejada.
- source_word: וַהֲרְגְנֻהוּ
  choice: nós o mataremos
  rationale: Reproduz a primeira pessoa do plural e o objeto masculino; a relação sequencial com o amanhecer fica clara pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Habitantes de Gaza” evita um gentílico raro; “ficaram de tocaia” comunica de modo corrente a emboscada; as notas preservam as elipses e alternativas genuínas do hebraico.
