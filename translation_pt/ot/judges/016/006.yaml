base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: pt
  text: 'Então Dalila disse a Sansão: “Por favor, diga-me em que está a sua grande força e como você poderia ser amarrado para ser subjugado[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para ser afligido” ou “para ser humilhado”. O verbo hebraico pode significar “afligir”, “humilhar” ou, neste contexto, “subjugar, dominar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O consecutivo narrativo faz a ação avançar; “Então” preserva a sequência com fluidez em português.
- source_word: דְּלִילָה אֶל שִׁמְשׁוֹן
  choice: Dalila disse a Sansão
  rationale: Emprega as formas tradicionais dos nomes em português e a construção natural para introduzir discurso direto.
- source_word: הַגִּידָה נָּא לִי
  choice: Por favor, diga-me
  rationale: הגיד significa “dizer, contar, declarar”, e נא confere à solicitação tom de pedido ou apelo.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: em que está a sua grande força
  rationale: Mantém a imagem hebraica de perguntar em que reside a força, sem acrescentar explicitamente a ideia de “segredo”.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: e como você poderia ser amarrado
  rationale: O segundo בַּמֶּה pergunta pelo meio, e o nifal de אסר indica ser amarrado ou preso. “Poderia” expressa naturalmente a possibilidade em questão.
- source_word: לְעַנּוֹתֶךָ
  choice: para ser subjugado
  rationale: Neste contexto, o piel de ענה aponta para subjugar ou dominar Sansão, embora também possa significar afligir ou humilhar; a nota preserva essa amplitude lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação evita introduzir “segredo”, termo não expresso no hebraico, e conserva em nota a ambiguidade de ענה.
