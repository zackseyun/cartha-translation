base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: pt
  text: 'A emboscada estava à espera dela no aposento. Então ela lhe disse: “Os filisteus estão sobre você, Sansão!” Mas ele arrebentou as cordas como se arrebenta um fio de estopa ao sentir o fogo. Assim, não se descobriu a sua força.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹרֵב
  choice: a emboscada
  rationale: O particípio substantivado singular pode designar coletivamente os homens escondidos para atacar; “a emboscada” preserva essa forma concisa.
- source_word: לָהּ
  choice: à espera dela
  rationale: Mantém explícito o pronome feminino do texto massorético, indicando que a emboscada estava posicionada para ela ou a seu serviço, sem substituir pelo sentido mais genérico “ali”.
- source_word: בַּחֶדֶר
  choice: no aposento
  rationale: חֶדֶר designa um cômodo interior ou privado; “aposento” é natural e não especifica além do hebraico.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Os filisteus estão sobre você
  rationale: Preserva a imagem idiomática e urgente de inimigos “sobre” Sansão, sem acrescentar um verbo de ataque ausente no texto.
- source_word: הַיְתָרִים
  choice: as cordas
  rationale: No contexto, refere-se às sete cordas novas com que Sansão foi amarrado; “cordas” é claro e evita impor a identificação mais específica “cordas de arco”.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: um fio de estopa
  rationale: Expressa um fio feito de fibras vegetais preparadas, provavelmente de linho; “estopa” preserva a comparação tradicional e concreta.
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: ao sentir o fogo
  rationale: Traduz a personificação literal “ao cheirar/sentir fogo” de modo inteligível, preservando a vivacidade da imagem sem convertê-la silenciosamente em “ao tocar o fogo”.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: não se descobriu a sua força
  rationale: Mantém a construção passiva e a concisão do hebraico, sem explicar de modo mais estreito que não se descobriu “o segredo” ou “a origem” da força.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A tradução conserva imagens marcantes do hebraico, especialmente “sobre você”, “fio de estopa” e “sentir o fogo”, e evita explicitar além do texto o segredo ou a fonte da força de Sansão.
