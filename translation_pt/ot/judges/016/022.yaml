translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a expressão hebraica “o cabelo de sua cabeça” e assinala em notas tanto a explicitação contextual “de novo” quanto a ambiguidade do referente na oração passiva.
