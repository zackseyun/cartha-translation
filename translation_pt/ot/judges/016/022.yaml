  yaml_path: translation/ot/judges/016/022.yaml
  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: pt
  text: Mas o cabelo de sua cabeça começou a crescer de novo, depois de ter sido raspado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou simplesmente “começou a crescer”. O verbo hebraico não diz explicitamente “de novo”; essa ideia vem do contexto da raspagem anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “quando foi raspado” ou “depois que ele foi rapado”. O hebraico permite pequenas diferenças na forma de expressar a relação temporal e o referente implícito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: começou
  rationale: O verbo, nesta construção com infinitivo, significa “começar”; “começou” é natural e preserva o aspecto inicial da ação.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: o cabelo de sua cabeça
  rationale: Reproduz a cadeia construta hebraica e mantém a ênfase narrativa no cabelo da cabeça de Sansão.
- source_word: לְצַמֵּחַ
  choice: a crescer de novo
  rationale: צמח significa “crescer” ou “brotar”. “De novo” é inferido do contexto da raspagem anterior e torna a sequência natural em português, sem ser apresentado como parte explícita do verbo hebraico.
- source_word: כַּאֲשֶׁר
  choice: depois de
  rationale: Neste contexto, expressa com clareza a relação temporal entre a raspagem e o início do novo crescimento, embora “quando” também seja possível.
- source_word: גֻּלָּח
  choice: ter sido raspado
  rationale: Preserva a voz passiva do hebraico. Em português, o sujeito elíptico pode ser entendido como o cabelo, embora a frase hebraica também permita entender que Sansão foi rapado.
