  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: pt
  text: 'Ele lhe disse: “Se me amarrarem firmemente com cordas novas que nunca tenham sido usadas em trabalho algum[a], ficarei fraco e serei como qualquer outro homem[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com as quais não se fez trabalho algum”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como um dos homens”, isto é, como um homem comum, sem força extraordinária.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Ele lhe disse
  rationale: O wayyiqtol introduz a resposta de Sansão; a formulação é natural em português sem precisar reproduzir mecanicamente o וְ inicial.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: Se me amarrarem firmemente
  rationale: O infinitivo absoluto seguido do verbo finito da mesma raiz confere ênfase à ação. “Firmemente” comunica essa força sem repetir artificialmente o verbo em português.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: com cordas novas
  rationale: עֲבֹתִים designa cordas ou cabos de amarração, possivelmente grossos; “cordas” é claro e natural, e חֲדָשִׁים significa “novas”.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: que nunca tenham sido usadas em trabalho algum
  rationale: A expressão passiva indica que nenhum trabalho havia sido feito com as cordas, ou seja, que ainda não tinham sido usadas. A tradução preserva esse sentido em português corrente.
- source_word: וְחָלִיתִי
  choice: ficarei fraco
  rationale: חלה, neste contexto, expressa tornar-se ou ficar fraco, em contraste com a força extraordinária de Sansão.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: e serei como qualquer outro homem
  rationale: A expressão compara Sansão a um ser humano comum, sem sua força incomum. “Qualquer outro homem” comunica naturalmente esse contraste, enquanto a nota registra a forma mais literal.
theological_decisions:
- issue: Sentido de כְּאַחַד הָאָדָם
  choice: como qualquer outro homem
  alternative: como um dos homens
  rationale: O contexto contrasta a força extraordinária de Sansão com a condição de um homem comum. A tradução principal explicita apenas o valor idiomático da comparação, e a nota preserva a construção partitiva mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da fala foi mantida, e os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
