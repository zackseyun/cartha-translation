base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: pt
  text: 'Então Sansão disse[a]: “Que eu morra com os filisteus!” Em seguida, inclinou-se com toda a sua força, e a casa[c] caiu sobre os governantes[b] e sobre todo o povo que estava nela. Assim, os que matou ao morrer foram mais numerosos do que os que havia matado durante a sua vida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Que minha alma morra com os filisteus”. A expressão hebraica refere-se idiomaticamente ao próprio Sansão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os chefes” ou “os senhores” dos filisteus.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o edifício”. O hebraico usa a palavra comum para “casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: Que eu morra
  rationale: נַפְשִׁי, literalmente “minha vida/minha pessoa”, funciona aqui de modo idiomático como referência ao próprio Sansão. “Que eu morra” preserva a força volitiva sem sugerir uma separação antropológica entre Sansão e sua alma.
- source_word: עִם פְּלִשְׁתִּים
  choice: com os filisteus
  rationale: Traduz diretamente עִם e expressa que Sansão aceita morrer junto com seus inimigos.
- source_word: וַיֵּט בְּכֹחַ
  choice: inclinou-se com toda a sua força
  rationale: נטה pode significar inclinar-se ou curvar-se; no contexto dos pilares, descreve o esforço corporal de Sansão. “Toda” comunica naturalmente em português a intensidade contextual de בְּכֹחַ.
- source_word: הַבַּיִת
  choice: a casa
  rationale: בַּיִת é o termo hebraico comum para casa ou edifício. A tradução mantém o termo básico, sem especificar “templo”, embora o contexto permita entendê-lo como a construção do culto filisteu.
- source_word: הַסְּרָנִים
  choice: os governantes
  rationale: סְרָנִים designa os dirigentes políticos filisteus. “Governantes” é claro e atual, sem as possíveis associações feudais de “senhores”.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: todo o povo que estava nela
  rationale: Preserva a totalidade indicada por כָּל e a referência às pessoas dentro da casa.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: os que matou ao morrer
  rationale: A expressão relaciona diretamente as mortes causadas por Sansão ao momento de sua própria morte. A formulação é concisa e natural em português.
- source_word: רַבִּים מֵאֲשֶׁר
  choice: foram mais numerosos do que os que
  rationale: Explicita naturalmente a comparação numérica indicada pela construção hebraica, sem acrescentar intensidade indevida.
- source_word: בְּחַיָּיו
  choice: durante a vida
  rationale: Expressa o período da vida de Sansão e mantém o contraste com “ao morrer”.
theological_decisions:
- issue: Tradução da declaração final de Sansão sem importar uma doutrina específica da alma
  choice: Que eu morra com os filisteus
  alternative: Que minha alma morra com os filisteus
  rationale: נֶפֶשׁ refere-se aqui idiomaticamente à própria pessoa ou vida de Sansão. A tradução escolhida comunica o sentido narrativo e preserva a volição sem transformar a frase em uma afirmação metafísica sobre a alma.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem dos marcadores foi normalizada no texto: [a] após a fala, [c] após “casa” e [b] após “governantes”. Evitou-se “templo” no texto principal por ser mais interpretativo que o substantivo hebraico.'
