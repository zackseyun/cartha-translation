base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: pt
  text: 'Então ela a prendeu com a cavilha[a] e lhe disse: “Os filisteus vêm contra você, Sansão!” Ele despertou do sono e arrancou a cavilha do tear e o tecido[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a estaca” ou “com o pino”. O termo hebraico pode designar uma estaca, um pino ou uma cavilha.
    reason: lexical_alternative
  - marker: b
    text: Ou “a trama”. O termo hebraico se refere ao material tecido no tear.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: prendeu
  rationale: תקע pode significar cravar, fincar ou prender. No contexto do tear, “prendeu” comunica com naturalidade que Dalila fixou o cabelo tecido, sem especificar além do texto o mecanismo exato.
- source_word: בַּיָּתֵד
  choice: com a cavilha
  rationale: יָתֵד designa uma estaca, pino ou cavilha. “Cavilha” é adequada para uma peça que fixa algo no tear e evita a possível imagem moderna de um pequeno alfinete.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Os filisteus vêm contra você
  rationale: A expressão é uma fórmula de alarme recorrente na narrativa. “Vêm contra você” preserva a ideia direcional e hostil de עַל, soa urgente e é mais natural no português atual do que “estão sobre você”.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: despertou do sono
  rationale: Tradução direta e digna da locução hebraica, adequada ao registro narrativo.
- source_word: וַיִּסַּע
  choice: arrancou
  rationale: Neste contexto, נסע indica remover ou puxar com força. “Arrancou” transmite a remoção vigorosa dos elementos do tear, sem sugerir o sentido de viajar.
- source_word: הַיְתַד הָאֶרֶג
  choice: a cavilha do tear
  rationale: A expressão associa a cavilha ao equipamento de tecelagem. “Do tear” é clara, concisa e acompanha de perto a relação do hebraico.
- source_word: הַמַּסָּכֶת
  choice: o tecido
  rationale: מַסָּכֶת refere-se aqui ao material tecido no tear. “Tecido” é natural e compreensível, enquanto “urdidura” seria mais técnico e específico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fórmula de alarme foi vertida de modo idiomático, preservando sua urgência; os termos do tear foram mantidos compreensíveis sem excesso de tecnicismo.
