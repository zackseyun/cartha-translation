base_translation:
  language: en
  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: pt
  text: 'Então Sansão disse ao rapaz que o segurava pela mão: “Deixe-me descansar; deixe que eu apalpe as colunas sobre as quais a casa está firmada, para que eu me apoie nelas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: Termo natural e amplo para um jovem do sexo masculino, sem especificar uma idade que o hebraico não define.
- source_word: הַנִּיחָה אוֹתִי
  choice: Deixe-me descansar
  rationale: Preserva o sentido causativo de permitir repouso, conforme a vocalização massorética, sem substituí-lo pela ideia de apalpar.
- source_word: ו/הימש/ני
  choice: e guie-me até
  rationale: A forma textual é difícil, mas no contexto expressa condução ou aproximação às colunas; esta tradução comunica isso naturalmente sem sugerir que Sansão enxergava o caminho.
- source_word: נָכוֹן עֲלֵיהֶם
  choice: sobre as quais a casa se sustenta
  rationale: Expressa que o edifício está estabelecido ou firmemente apoiado nas colunas.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: para que eu me apoie nelas
  rationale: Reproduz a finalidade e o sentido reflexivo de encostar o próprio peso nas colunas.
