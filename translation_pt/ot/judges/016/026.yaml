  source_fidelity: A tradução de הַנִּיחָה אוֹתִי como «Deixe-me descansar» é defensável, embora o verbo também possa ter a nuance de deixar/permitir. Contudo, «guie-me até» não corresponde bem a וַהֲמִישֵׁנִי, forma difícil que, no contexto e na tradição textual predominante, pede que o rapaz permita a Sansão tocar ou apalpar as colunas. A revisão restaura essa ação sem acrescentar explicações sobre a condição física ou as intenções de Sansão.
  naturalness: «Deixe-me descansar; deixe que eu apalpe as colunas» é claro, moderno e mantém a sequência de dois pedidos. «A casa está firmada» é uma formulação natural para o edifício estabelecido sobre as colunas.
  terminology: «Rapaz», «colunas» e «apoiar-me» são adequados ao registro narrativo. «Apalpar» comunica de modo preciso o tato intencional implicado pelo verbo, sem reduzir a ação a mera condução.
