base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: pt
  text: 'Então Sansão lhe disse: “Se me amarrarem com sete cordas de arco frescas, que ainda não secaram, ficarei fraco e serei como um dos homens[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como qualquer outro homem”.'
    reason: Alternativa idiomática para a expressão hebraica כְּאַחַד הָאָדָם.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: Então Sansão lhe disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão de modo natural em português, sem acrescentar uma relação causal.
- source_word: אִם יַאַסְרֻנִי
  choice: Se me amarrarem
  rationale: A terceira pessoa do plural tem sentido indefinido no contexto. A construção portuguesa sem sujeito expresso preserva essa indefinição com naturalidade.
- source_word: בְּשִׁבְעָה יְתָרִים
  choice: com sete cordas de arco
  rationale: A preposição tem valor instrumental, e יְתָרִים designa aqui cordas usadas em arcos, não cordas genéricas.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: novas, que ainda não secaram
  rationale: לַחִים indica que as cordas estão frescas ou úmidas; “novas” é idiomático em português neste contexto, enquanto a oração seguinte explicita que não secaram.
- source_word: וְחָלִיתִי
  choice: ficarei fraco
  rationale: חלה expressa aqui perda de força, não enfermidade. “Ficarei fraco” comunica claramente a mudança resultante.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: e serei como um dos homens
  rationale: A tradução conserva de perto a comparação hebraica e sua referência humana masculina no contexto, sem explicar além do que o texto diz.
theological_decisions:
- issue: Sentido de אָדָם na expressão comparativa כְּאַחַד הָאָדָם
  choice: como um dos homens
  alternative: como qualquer outro homem
  rationale: A formulação principal preserva a estrutura e a forma masculina do hebraico. A nota registra a equivalência idiomática provável sem eliminar a leve estranheza ou restringir indevidamente a expressão no texto principal.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Cordas de arco” favorece precisão lexical; “me amarrarem” e “ficarei fraco” mantêm fluidez oral sem perder a forma condicional do original.
