  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: pt
  text: Sansão foi a Gaza e ali viu uma prostituta. Então foi até ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teve relações sexuais com ela”. O hebraico diz literalmente “foi a ela”, expressão que, neste contexto, funciona como eufemismo sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Na sequência narrativa, הלך é o verbo comum de movimento; “foi” é natural e não acrescenta nuances ausentes do hebraico.
- source_word: שִׁמְשׁוֹן
  choice: Sansão
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַזָּתָה
  choice: a Gaza
  rationale: O hê direcional ligado ao nome da cidade indica movimento em direção a Gaza; em português, isso se expressa naturalmente com “a Gaza”.
- source_word: וַיַּרְא שָׁם
  choice: e ali viu
  rationale: שָׁם significa “ali/lá”; “ali viu” mantém o valor do advérbio em ordem natural no português.
- source_word: אִשָּׁה זוֹנָה
  choice: uma prostituta
  rationale: זוֹנָה designa uma prostituta. A formulação concisa é atual e preserva o sentido sexual do termo sem recorrer a vocabulário arcaico.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Então entrou na casa dela
  rationale: A expressão בוא אל pode funcionar aqui como eufemismo sexual. Em português, a tradução literal “entrou a ela” seria artificial; “entrou na casa dela” conserva no texto principal uma formulação indireta, enquanto a nota explicita o sentido contextual provável.
theological_decisions:
- issue: Se o sentido sexual de וַיָּבֹא אֵלֶיהָ deve ser explicitado no texto principal ou mantido de modo eufemístico
  choice: 'Manter uma formulação indireta no texto principal: “entrou na casa dela”'
  alternative: “teve relações sexuais com ela” ou “dormiu com ela”
  rationale: O contexto aponta fortemente para relações sexuais, mas o hebraico emprega uma expressão eufemística. A tradução conserva esse grau de explicitude no texto e registra a interpretação sexual na nota, sem eliminar a tensão entre forma e sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação narrativa foi suavemente variada com “Então” para evitar repetição mecânica, sem alterar a sequência dos acontecimentos. A nota preserva a literalidade e esclarece o eufemismo.
