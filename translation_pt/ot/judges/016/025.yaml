base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: pt
  text: 'Quando o coração deles estava alegre, disseram: “Chamem Sansão para que nos divirta[a]”. Então chamaram Sansão da prisão, e ele os divertiu[b]. Depois, fizeram-no ficar de pé entre as colunas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que se apresente para nós” ou “para que sirva de diversão para nós”. O verbo hebraico pode indicar diversão, espetáculo ou zombaria.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele se apresentou diante deles” ou “ele lhes serviu de espetáculo”. O hebraico também pode sugerir que Sansão era objeto de zombaria; não especifica exatamente o que ele fez.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: quando o coração deles estava alegre
  rationale: A expressão idiomática diz literalmente que o coração deles estava “bom”, isto é, alegre ou bem-disposto. A tradução conserva a imagem hebraica e soa natural em português.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: Chamem Sansão
  rationale: O verbo קרא com ל indica mandar chamar ou convocar alguém. “Chamem Sansão” comunica isso de modo direto e natural.
- source_word: וִישַׂחֶק לָנוּ
  choice: para que nos divirta
  rationale: שׂחק pode indicar divertir, servir de espetáculo ou tornar-se objeto de zombaria. “Divirta” expressa a finalidade imediata sem eliminar as conotações mais humilhantes, registradas em nota.
- source_word: מִבֵּית הָאֲסִירִים
  choice: da prisão
  rationale: A expressão significa literalmente “da casa dos prisioneiros”. “Da prisão” transmite com clareza o referente em português atual.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: e ele se apresentou diante deles
  rationale: O verbo צחק, neste contexto, descreve Sansão proporcionando diversão ou espetáculo diante da multidão, possivelmente como alvo de zombaria. “Se apresentou diante deles” preserva o caráter público sem definir de maneira indevida a natureza exata da atuação.
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: fizeram-no ficar de pé entre as colunas
  rationale: 'O hifil de עמד tem sentido causativo: fizeram Sansão ficar em determinada posição. A formulação conserva tanto a postura quanto o controle exercido sobre ele.'
