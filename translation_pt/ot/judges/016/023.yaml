  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: pt
  text: 'Os governantes dos filisteus se reuniram para oferecer um grande sacrifício a Dagom, seu deus, e para festejar; e disseram: “Nosso deus entregou Sansão, nosso inimigo, em nossas mãos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “em nossas mãos” significa sob nosso poder ou controle.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: governantes
  rationale: Designa os principais dirigentes das cidades-Estado filisteias. “Governantes” comunica sua autoridade em português atual sem o tom arcaico ou feudal de “senhores”.
- source_word: נֶאֱסְפוּ
  choice: se reuniram
  rationale: O nifal de אסף indica que vieram e formaram uma assembleia; “se reuniram” é claro e natural.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: oferecer um grande sacrifício
  rationale: A construção com verbo e substantivo cognatos enfatiza o ato sacrificial; a formulação evita uma repetição pouco natural em português.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: a Dagom, seu deus
  rationale: Identifica Dagom como a divindade destinatária do sacrifício, mantendo a aposição de modo natural.
- source_word: וּלְשִׂמְחָה
  choice: e para celebrar
  rationale: No contexto de uma festividade pública pela vitória, a expressão final indica a finalidade de festejar ou alegrar-se.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: entregou em nossas mãos
  rationale: Preserva a imagem do idioma hebraico e comunica que Sansão foi colocado sob o poder e controle dos filisteus.
- source_word: אֵת שִׁמְשׁוֹן
  choice: Sansão
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: אוֹיְבֵינוּ
  choice: nosso inimigo
  rationale: Embora a forma hebraica apresente terminação plural, o referente no contexto é o indivíduo Sansão; o singular exprime corretamente o sentido.
theological_decisions:
- issue: Tradução de אֱלֹהֵיהֶם / אֱלֹהֵינוּ em contexto pagão
  choice: seu deus / Nosso deus
  alternative: seus deuses / Nossos deuses
  rationale: As duas ocorrências se referem especificamente a Dagom, a divindade nomeada no versículo. O singular acompanha a sintaxe e não introduz uma pluralidade que não está em foco.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A coordenação extensa do hebraico foi dividida em duas frases para maior clareza, sem alterar a sequência dos acontecimentos. Conservou-se a metáfora hebraica “em nossas mãos”, explicada em nota.
