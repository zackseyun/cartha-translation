base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: pt
  text: E aconteceu que, quando ela o atormentava com suas palavras todos os dias e o pressionava, ele ficou tão angustiado que desejava morrer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: «sua alma se tornou curta para morrer»; um idioma que expressa angústia, impaciência ou exaustão extremas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: E aconteceu que, como
  rationale: Preserva a transição narrativa hebraica sem recorrer ao arcaico «sucedeu que»; «como» introduz naturalmente a circunstância repetida.
- source_word: הֵצִיקָה לוֹ
  choice: ela o pressionava
  rationale: Expressa a pressão e aflição causadas pela insistência verbal de Dalila, em português atual.
- source_word: בִּדְבָרֶיהָ
  choice: com suas palavras
  rationale: Mantém a expressão concreta e o valor instrumental da preposição hebraica.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Comunica de modo natural a persistência diária indicada pela expressão hebraica.
- source_word: וַתְּאַלֲצֵהוּ
  choice: insistia com ele
  rationale: Transmite a coerção persistente do verbo e evita repetir «pressionava».
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: sua alma se angustiou
  rationale: Traduz o efeito interior extremo do idioma «sua alma ficou curta» de modo inteligível, preservando «alma» e deixando a formulação literal na nota.
- source_word: לָמוּת
  choice: até a morte
  rationale: Conserva a intensidade extrema da expressão sem afirmar, além do texto, que Sansão desejasse suicidar-se.
theological_decisions:
- issue: Natureza da expressão «até a morte»
  choice: Estado extremo de angústia ou exaustão
  alternative: Desejo explícito de morrer
  rationale: O infinitivo לָמוּת intensifica o estado descrito, mas não exige interpretar a frase como declaração de intenção suicida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém parte do ritmo cumulativo do hebraico, enquanto a nota preserva seu idioma vívido.
