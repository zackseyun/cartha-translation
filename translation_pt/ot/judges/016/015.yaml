  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: pt
  text: 'Então ela lhe disse: “Como você pode dizer: ‘Eu amo você’, se o seu coração não está comigo? Por três vezes você zombou de mim[a] e não me contou em que consiste a sua grande força.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brincou comigo”, “me enganou” ou “fez de mim uma tola”. O verbo hebraico transmite a ideia de tratar alguém com zombaria enganosa, fazendo dessa pessoa objeto de brincadeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como você pode
  rationale: Expressa de modo natural a força retórica e incrédula da pergunta de Dalila.
- source_word: אֲהַבְתִּיךְ
  choice: Eu amo você
  rationale: No discurso direto, o perfeito hebraico expressa aqui a alegação de amor presente e contínuo de Sansão.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: o seu coração não está comigo
  rationale: Preserva a imagem hebraica do coração como lealdade e compromisso interior, sem explicá-la além do texto.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: Já é a terceira vez
  rationale: Equivalente idiomático em português para a expressão hebraica que conta as ocasiões repetidas até o presente.
- source_word: הֵתַלְתָּ בִּי
  choice: você zomba de mim
  rationale: Comunica o ato de brincar enganosamente com alguém e fazê-lo de objeto de escárnio; a nota registra alternativas plausíveis.
- source_word: הִגַּדְתָּ לִּי
  choice: não me conta
  rationale: Forma conversacional e natural de traduzir o verbo no contexto da fala de Dalila.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: de onde vem a sua grande força
  rationale: Comunica em português corrente a pergunta pela base ou fonte da força extraordinária de Sansão, em vez de sugerir mera localização.
