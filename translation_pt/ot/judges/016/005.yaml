  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: pt
  text: 'Então os governantes dos filisteus foram até ela e lhe disseram: “Atraia-o e descubra em que consiste a sua grande força e como poderemos vencê-lo, para que o amarremos e o façamos sofrer. Cada um de nós lhe dará mil e cem peças de prata[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “mil e cem de prata”. Provavelmente se refere a mil e cem peças ou siclos de prata dados por cada governante filisteu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: foram até ela
  rationale: Expressa naturalmente o movimento em direção a ela; o valor contextual de עלה não exige que se explicite uma subida física.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: os governantes dos filisteus
  rationale: סרן é o título dos dirigentes das cidades filisteias. “Governantes” é claro e atual, sem sugerir nobreza feudal.
- source_word: פַּתִּי
  choice: Atraia-o
  rationale: O piel de פתה pede que Dalila o induza ardilosamente a revelar o segredo. “Atraia-o” conserva a ideia de levar alguém por persuasão ou engodo sem impor um sentido sexual.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: e descubra em que consiste a sua grande força
  rationale: במה pergunta pela base ou pelo segredo da força; “descubra em que consiste” comunica isso em português natural e mantém explícita a grandeza da força.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: e como poderemos vencê-lo
  rationale: A expressão יכל ל significa prevalecer contra ou superar alguém. “Vencê-lo” é conciso e adequado ao plano hostil.
- source_word: וַאֲסַרְנֻהוּ
  choice: para que o amarremos
  rationale: A sequência indica a finalidade do plano, e “amarrar” traduz אסר de maneira corrente no contexto de captura.
- source_word: לְעַנֹּתוֹ
  choice: e o façamos sofrer
  rationale: O piel de ענה pode significar afligir, humilhar, subjugar ou maltratar. “Fazê-lo sofrer” preserva o sentido amplo de infligir sofrimento sem restringi-lo a uma modalidade específica.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: Cada um de nós lhe dará mil e cem peças de prata
  rationale: איש tem valor distributivo, “cada um”. O hebraico traz literalmente “mil e cem prata”; “peças de prata” completa a expressão de modo claro, deixando para a nota a possibilidade de siclos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se “senhores dos filisteus”, que pode soar feudal, e também “seduza-o”, que acrescentaria uma conotação sexual não exigida pelo verbo hebraico.
