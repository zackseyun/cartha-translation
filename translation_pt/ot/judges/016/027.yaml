base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: pt
  text: A casa estava cheia de homens e mulheres, e todos os governantes dos filisteus estavam ali. No terraço havia cerca de três mil homens e mulheres, que observavam Sansão enquanto ele se apresentava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto Sansão atuava”; mais literalmente, “na diversão de Sansão”. A expressão hebraica usa uma palavra que pode se referir a rir, brincar, divertir-se ou servir de entretenimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: a casa
  rationale: Preserva o sentido básico de 'casa/edifício' sem especificar além do hebraico que se tratava do templo ou do complexo de Dagom.
- source_word: מָלֵא
  choice: estava cheia de
  rationale: Expressa naturalmente em português o sentido estativo de estar cheio.
- source_word: הָאֲנָשִׁים ... וְהַנָּשִׁים
  choice: homens e mulheres
  rationale: Mantém a referência explícita aos dois sexos com formulação corrente.
- source_word: וְשָׁמָּה
  choice: estavam ali
  rationale: Conserva a indicação locativa em português natural.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: todos os governantes dos filisteus
  rationale: סְרָנִים designa os dirigentes característicos das cidades filisteias; 'governantes' comunica claramente a função política sem recorrer ao pouco corrente 'sátrapas'.
- source_word: וְעַל הַגָּג
  choice: No terraço havia
  rationale: Em construções antigas de cobertura plana, 'terraço' comunica melhor em português o espaço sobre o teto onde a multidão podia permanecer; a localização continua em destaque.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: cerca de três mil
  rationale: O כְּ indica aproximação neste contexto.
- source_word: אִישׁ וְאִשָּׁה
  choice: homens e mulheres
  rationale: As formas singulares têm valor distributivo e descrevem uma multidão de ambos os sexos.
- source_word: הָרֹאִים
  choice: que observavam
  rationale: O particípio indica a ação contínua da multidão que assistia à cena.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: enquanto ele os divertia
  rationale: No contexto imediato, a construção com שׂחק apresenta Sansão como diversão pública. A formulação é natural, mas a nota preserva a amplitude e a dificuldade da expressão hebraica.
