base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: pt
  text: 'Quando Dalila viu que ele lhe havia contado tudo o que tinha no coração, mandou chamar os governantes dos filisteus[b], dizendo: “Venham desta vez, pois ele contou a ela tudo o que tinha no coração[a].” Então os governantes dos filisteus foram até ela e trouxeram a prata em suas mãos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “a ela”. Dentro da fala de Dalila, seria mais esperado “a mim”, mas a tradução preserva a terceira pessoa feminina do texto hebraico recebido.
    reason: textual_variant
  - marker: b
    text: Ou “os senhores dos filisteus”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, a prata destinada ao pagamento.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quando Dalila viu
  rationale: A construção temporal dá fluidez à narrativa e mantém o sentido básico de ראה, sem ampliar para o interpretativo “percebeu”.
- source_word: הִגִּיד
  choice: havia revelado / revelou
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. “Revelar” comunica aqui a divulgação completa de um segredo; o mais-que-perfeito composto na primeira ocorrência situa a revelação antes da percepção de Dalila.
- source_word: אֶת כָּל לִבּוֹ
  choice: todo o coração
  rationale: 'Preserva a imagem hebraica e sua força narrativa: Sansão abriu plenamente o íntimo e não ocultou mais o segredo. A formulação evita explicar demais o idioma como “tudo o que tinha no coração”.'
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: mandou chamar
  rationale: Em português, a combinação idiomática “mandou chamar” expressa naturalmente os dois verbos hebraicos — enviar e convocar — sem produzir uma sequência artificial.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: os governantes dos filisteus
  rationale: סרן designa os altos dirigentes filisteus. “Governantes” é claro e atual; a nota registra a alternativa tradicional “senhores”.
- source_word: עֲלוּ הַפַּעַם
  choice: Venham desta vez
  rationale: Mantém הַפַּעַם e expressa de modo natural o movimento dos governantes até o local onde Dalila estava.
- source_word: כִּי הִגִּיד לָהּ אֶת כָּל לִבּוֹ
  choice: pois ele revelou a ela todo o coração
  rationale: Conserva deliberadamente a terceira pessoa feminina do texto hebraico recebido (“a ela”), embora, dentro da fala de Dalila, fosse mais esperado “a mim”.
- source_word: וְעָלוּ אֵלֶיהָ
  choice: foram até ela
  rationale: Comunica o movimento em direção a Dalila em português natural; traduzir mecanicamente עלה como “subiram” poderia sugerir uma elevação não explicitada pelo contexto imediato.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: levaram consigo a prata
  rationale: Mantém “prata”, em vez de substituir diretamente por “dinheiro”, e transmite de forma idiomática que eles a trouxeram em sua posse como pagamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva o idioma hebraico “todo o coração” e a forma inesperada “a ela”, mas emprega construções narrativas naturais como “mandou chamar”, “foram até ela” e “levaram consigo”.
