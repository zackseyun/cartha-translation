revisions:
- from: 'Quando Dalila viu que ele lhe havia revelado todo o coração, mandou chamar os governantes dos filisteus[b], dizendo: “Venham desta vez, pois ele revelou a ela todo o coração[a]”. Então os governantes dos filisteus foram até ela e levaram consigo a prata[c].'
  to: 'Quando Dalila viu que ele lhe havia contado tudo o que tinha no coração, mandou chamar os governantes dos filisteus[b], dizendo: “Venham desta vez, pois ele contou a ela tudo o que tinha no coração[a].” Então os governantes dos filisteus foram até ela e trouxeram a prata em suas mãos[c].'
  rationale: A revisão substitui um calque pouco natural do idiomatismo hebraico por uma expressão portuguesa clara que conserva sua extensão semântica («tudo o que tinha no coração»). Também restaura explicitamente o complemento «em suas mãos». A anomalia textual de «a ela» é mantida no texto e explicada pela nota.
