review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha adequadamente a sequência narrativa e preserva, com nota, a forma inesperada de terceira pessoa feminina («a ela») no discurso direto. Contudo, «todo o coração» não é uma reprodução natural nem clara do idiomatismo hebraico em português, e «levaram consigo a prata» deixa de explicitar que a traziam «em suas mãos».
  naturalness: «Revelado todo o coração» soa pouco idiomático e pode sugerir um sentido físico. «Contado tudo o que tinha no coração» é português moderno e natural, mantendo o sentido de revelação integral. «Trouxeram a prata em suas mãos» é claro e preserva o detalhe narrativo.
  terminology: «Dalila», «filisteus», «governantes» e «prata» são adequados. A alternativa «senhores dos filisteus» deve permanecer na nota lexical.
  issues:
  - severity: medium
    issue: «lhe havia revelado todo o coração» / «revelou a ela todo o coração»
    rationale: A expressão é excessivamente literal e pouco inteligível em português moderno. O hebraico «todo o seu coração» é um idiomatismo para a revelação completa do que alguém guarda no íntimo; «tudo o que tinha no coração» o transmite sem acrescentar interpretação doutrinária.
  - severity: medium
    issue: «levaram consigo a prata»
    rationale: A formulação comunica posse ou acompanhamento, mas não reproduz o detalhe de que os governantes trouxeram a prata «em suas mãos» (בידם).
