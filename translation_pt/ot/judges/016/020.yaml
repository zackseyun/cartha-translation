base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: pt
  text: 'Então, ela disse: “Os filisteus vêm contra você, Sansão!” Ele acordou do sono e disse: “Sairei como nas outras vezes e me sacudirei para me soltar[a].” Mas não sabia que Yahweh havia se retirado dele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e me sacudirei”; o sentido provável é que Sansão esperava sacudir-se para ficar livre, como nas ocasiões anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Os filisteus estão sobre você
  rationale: Preserva a imagem vívida da construção hebraica com עַל, que neste contexto anuncia ataque ou captura iminente, sem acrescentar uma ação não expressa diretamente.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: despertou do sono
  rationale: Tradução direta e natural do verbo יקץ com a expressão preposicional, em registro narrativo digno e atual.
- source_word: אֵצֵא
  choice: Sairei
  rationale: Mantém o sentido básico de יצא sem explicitar que Sansão sairia para enfrentar os atacantes, detalhe apenas implícito no contexto.
- source_word: כְּפַעַם בְּפַעַם
  choice: como das outras vezes
  rationale: Expressa naturalmente a ideia de ocasiões anteriores repetidas e a expectativa de Sansão de que tudo ocorreria como antes.
- source_word: וְאִנָּעֵר
  choice: e me sacudirei para me soltar
  rationale: 'Conserva a imagem corporal do verbo נער e explicita com moderação o provável resultado do movimento: desvencilhar-se ou ficar livre.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: סָר מֵעָלָיו
  choice: havia se retirado dele
  rationale: Reproduz a ideia de afastamento ou retirada divina sem definir sua duração nem explicar teologicamente sua natureza.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Natureza da retirada divina
  choice: Yahweh havia se retirado dele
  alternative: o poder de Yahweh o havia deixado
  rationale: O versículo afirma a retirada de Yahweh, mas não a restringe explicitamente à perda de poder nem explica seu mecanismo. A tradução preserva essa tensão teológica.
- issue: Verbo de fala em וַיֹּאמֶר
  choice: pensou
  alternative: disse
  rationale: Embora o hebraico use o verbo comum 'dizer', neste contexto ele pode introduzir fala interior. 'Pensou' torna natural a narrativa sem alterar o conteúdo da deliberação de Sansão.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tom permanece narrativo e digno; usa-se “você” na advertência direta e preserva-se a imagem incomum, mas inteligível, de os filisteus estarem “sobre” Sansão.
