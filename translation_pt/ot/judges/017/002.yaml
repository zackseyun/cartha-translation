base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: pt
  text: 'Ele disse à sua mãe: “As mil e cem peças de prata que lhe foram tiradas, a respeito das quais você proferiu uma maldição[a] e também falou na minha presença — veja, a prata está comigo; fui eu que a peguei”. E sua mãe disse: “Que meu filho seja abençoado por Yahweh[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pronunciou um juramento”. O verbo hebraico pode referir-se a um juramento ou a uma maldição; neste contexto, “maldição” parece mais provável.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Bendito seja meu filho para/por Yahweh”, uma fórmula compacta de bênção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: as mil e cem peças de prata
  rationale: O hebraico quantifica a prata sem nomear explicitamente uma unidade monetária. “Peças de prata” evita acrescentar “siclos”, embora essa unidade seja possível no contexto.
- source_word: לֻקַּח לָךְ
  choice: lhe foram tiradas
  rationale: O passivo de לקח indica que a prata foi tomada. “Tiradas” preserva essa formulação sem explicitar “roubadas”, nuance sugerida pelo contexto, mas não declarada pelo verbo.
- source_word: וְאַתִּי אָלִית
  choice: a respeito das quais você proferiu uma maldição
  rationale: אלה pode designar juramento ou maldição. O contexto da prata desaparecida favorece “maldição”, enquanto a alternativa é preservada em nota.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: e também falou na minha presença
  rationale: A expressão hebraica é literalmente “falou aos meus ouvidos” e indica que ele ouviu pessoalmente as palavras da mãe. A formulação escolhida é idiomática e mantém esse sentido.
- source_word: הִנֵּה
  choice: veja
  rationale: O marcador chama a atenção para a revelação imediata de que a prata está com ele; “veja” conserva essa força em português atual.
- source_word: הַכֶּסֶף אִתִּי
  choice: a prata está comigo
  rationale: Reproduz de modo claro a estrutura concreta do hebraico, “a prata está comigo”.
- source_word: אֲנִי לְקַחְתִּיו
  choice: fui eu que a peguei
  rationale: O pronome explícito אֲנִי é enfático. A construção “fui eu” torna essa ênfase natural em português e deixa clara a confissão.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: Que meu filho seja abençoado por Yahweh!
  rationale: Expressa em português natural a fórmula compacta de bênção. A preposição ligada ao nome divino admite relação ou agência; “por Yahweh” é adequada ao contexto sem ocultar a concisão do original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de אלה no pronunciamento da mãe
  choice: maldição
  alternative: juramento
  rationale: O verbo pode referir-se tanto a juramento quanto a maldição. O desaparecimento da prata e a resposta posterior da mãe favorecem uma maldição dirigida ao responsável, mas a alternativa lexical genuína é mantida em nota.
- issue: Forma da bênção בָּרוּךְ בְּנִי לַיהוָה
  choice: Que meu filho seja abençoado por Yahweh!
  alternative: Bendito seja meu filho para Yahweh!
  rationale: A construção hebraica é uma fórmula breve, e o ל diante do nome divino pode indicar agência ou relação. A tradução principal oferece a leitura portuguesa mais natural, enquanto a nota registra a forma compacta e sua possível amplitude.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o tetragrama como nome próprio. A transliteração preserva essa função e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “você” na fala familiar, “mil e cem” em vez de uma unidade monetária não explicitada e uma construção enfática natural (“fui eu”) para representar o pronome hebraico expresso. O nome divino é transliterado como “Yahweh”.
