base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: pt
  text: Mica tinha um santuário[a]. Ele fez um éfode e ídolos domésticos, consagrou um de seus filhos[b], e este se tornou seu sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma casa de Deus” ou “uma casa de deuses”. A expressão pode designar aqui um santuário particular.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “encheu a mão de um de seus filhos”, expressão usada para instalar ou consagrar alguém ao serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: um santuário
  rationale: A expressão significa literalmente “casa de Deus/deuses”, mas, neste contexto, designa o local de culto particular de Mica. “Santuário” comunica naturalmente essa função sem decidir no texto principal se אֱלֹהִים deve ser entendido como singular ou plural; a nota preserva a ambiguidade lexical.
- source_word: אֵפוֹד
  choice: um éfode
  rationale: O termo designa um objeto ou vestimenta de culto sem equivalente português exato; a transliteração mantém a especificidade histórica.
- source_word: תְרָפִים
  choice: ídolos domésticos
  rationale: O termo se refere a imagens ligadas ao culto familiar ou doméstico. A tradução comunica sua função com clareza e se ajusta ao contexto de culto irregular.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: consagrou
  rationale: A expressão idiomática, literalmente “encheu a mão de”, indica instalação ou consagração para o serviço sacerdotal. “Consagrou” é natural em português e mantém a dimensão cultual.
- source_word: אַחַד מִבָּנָיו
  choice: um de seus filhos
  rationale: Reproduz diretamente a construção partitiva e conserva a referência masculina explícita do hebraico.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: e este se tornou seu sacerdote
  rationale: Expressa o resultado da consagração e usa “este” para deixar claro que o sujeito é o filho, não Mica.
- source_word: וְהָאִישׁ מִיכָה
  choice: Esse homem, Mica
  rationale: Mantém o substantivo articulado e o nome em aposição, ao mesmo tempo que apresenta de modo natural a retomada do personagem no discurso.
theological_decisions:
- issue: Se בֵּית אֱלֹהִים deve ser traduzido de modo a sugerir o culto legítimo ao verdadeiro Deus ou um local de culto privado e irregular
  choice: um santuário
  alternative: uma casa de Deus; uma casa de deuses
  rationale: O contexto menciona um éfode, ídolos domésticos e a nomeação particular de um filho como sacerdote. “Santuário” descreve o local cultual sem legitimar esse culto nem resolver indevidamente a ambiguidade semântica de אֱלֹהִים; a nota registra as traduções literais possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Éfode” conserva o termo cultual antigo; “ídolos domésticos” evita o tecnicismo pouco transparente “terafins”. A divisão em duas frases e o pronome “este” eliminam uma possível ambiguidade de sujeito sem alterar a sequência narrativa.
