  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: pt
  text: 'Então Mica disse: “Agora sei que Yahweh me fará bem, pois tenho um levita[a] como sacerdote.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o levita”. O hebraico emprega o artigo definido e pode estar apontando para o levita específico já apresentado; em português, “um levita” expressa naturalmente a importância que Mica atribui à condição levítica do homem.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: מִיכָה
  choice: Mica
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: עַתָּה יָדַעְתִּי
  choice: Agora sei
  rationale: O perfeito יָדַעְתִּי descreve o estado presente decorrente de uma conclusão; “Agora sei” é natural e preserva esse sentido.
- source_word: יֵיטִיב יְהוָה לִי
  choice: Yahweh me fará bem
  rationale: O hifil de יטב com לִי indica que Yahweh agirá para o bem de Mica. A formulação mantém a amplitude da expressão hebraica sem restringi-la a prosperidade material.
- source_word: כִּי
  choice: pois
  rationale: A segunda ocorrência introduz a razão da confiança declarada por Mica.
- source_word: הָיָה לִי
  choice: tenho
  rationale: A construção hebraica com היה e ל expressa posse ou relação estabelecida; “tenho” é seu equivalente idiomático em português.
- source_word: הַלֵּוִי
  choice: um levita
  rationale: Embora o hebraico empregue o artigo definido, neste contexto a identidade levítica do homem fundamenta a conclusão de Mica; “um levita” comunica naturalmente essa função classificadora. A leitura formal “o levita” é preservada em nota.
- source_word: לְכֹהֵן
  choice: como sacerdote
  rationale: O לְ marca a função exercida pelo levita; “como sacerdote” é claro e idiomático.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, em vez de substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A declaração registra a conclusão de Mica sem endossar sua avaliação religiosa.
