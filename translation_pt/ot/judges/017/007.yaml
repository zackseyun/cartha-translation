id: JDG.17.7
reference: Judges 17:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: pt
  text: Havia um jovem de Belém de Judá, do clã de Judá[a]. Ele era levita e vivia ali como forasteiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da família de Judá”. O termo hebraico pode designar uma família extensa ou um clã.
    reason: lexical_alternative
  - marker: b
    text: Ou “residia temporariamente ali”. O verbo hebraico costuma descrever alguém que vive em um lugar como forasteiro ou residente não nativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Havia
  rationale: Introduz uma nova figura na narrativa de modo natural, sem acrescentar um advérbio temporal que não está explícito no hebraico.
- source_word: נַעַר
  choice: jovem
  rationale: Neste contexto, designa um jovem do sexo masculino, sem indicar função servil; em português, “jovem” é claro e natural.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Belém de Judá
  rationale: Judá qualifica o topônimo Belém e o distingue de outras localidades com o mesmo nome. A forma tradicional “Belém de Judá” é clara e corrente em português.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: do clã de Judá
  rationale: מִשְׁפָּחָה pode indicar uma família extensa ou um agrupamento dentro da tribo. “Clã” expressa essa dimensão melhor que “família” e é mais específico que “tribo”.
- source_word: לֵוִי
  choice: levita
  rationale: Identifica diretamente o jovem como levita e mantém, sem harmonização, a tensão com a afirmação anterior de que ele era do clã de Judá.
- source_word: גָר שָׁם
  choice: vivia ali como forasteiro
  rationale: O verbo גור descreve residência em condição de forasteiro ou residente não nativo. A formulação é compreensível em português moderno e preserva essa nuance melhor que o simples “morava ali”.
theological_decisions:
- issue: Tensão aparente entre a vinculação do jovem a Judá e sua identidade levítica
  choice: Manter no texto tanto “do clã de Judá” quanto “era levita”, sem explicação harmonizadora.
  alternative: Interpretar a vinculação a Judá apenas como geográfica ou social, ou reformular a frase para eliminar a tensão.
  rationale: O hebraico apresenta as duas afirmações lado a lado. A tradução deve conservar a ambiguidade de identidade e pertencimento presente no texto, em vez de escolher silenciosamente uma solução.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Belém de Judá” preserva a forma bíblica corrente; “vivia ali como forasteiro” mantém a nuance social e residencial do hebraico sem recorrer ao pouco usual “peregrinava”.
