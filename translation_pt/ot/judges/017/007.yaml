  source_fidelity: 'O texto traduz todos os elementos essenciais do hebraico: a introdução narrativa, o jovem, Belém de Judá, sua vinculação ao clã/família de Judá, sua condição de levita e sua residência ali como forasteiro. Mantém adequadamente a tensão textual entre «do clã de Judá» e «era levita», sem harmonizá-la.'
