base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: pt
  text: 'Mica lhe disse: “Fique comigo e seja para mim pai e sacerdote. Eu lhe darei dez peças de prata[a] por ano, um conjunto de roupas[b] e o seu sustento.” Então o levita foi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “dez de prata”, sem especificar a unidade; “dez siclos de prata” é uma interpretação comum.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma provisão de roupas”.
    reason: lexical_alternative
  - marker: c
    text: Ou, conforme o sentido sugerido pelo contexto, “entrou”. O verbo hebraico significa literalmente “foi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: Fique comigo
  rationale: O imperativo de ישׁב convida o levita a permanecer e morar com Mica. “Fique comigo” é natural em português e mantém a ideia de residência sem explicitação excessiva.
- source_word: לְאָב וּלְכֹהֵן
  choice: como pai e sacerdote
  rationale: “Pai” é mantido como metáfora honorífica para uma figura de autoridade e aconselhamento religioso, e “sacerdote” traduz diretamente כֹּהֵן. “Como” torna natural em português a função predicativa sem substituir a metáfora.
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: dez peças de prata
  rationale: O hebraico diz literalmente “dez de prata” e não nomeia a unidade. “Peças de prata” conserva essa indefinição melhor que “siclos de prata”.
- source_word: לַיָּמִים
  choice: por ano
  rationale: A expressão idiomática indica pagamento anual; “por ano” é clara e corrente.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: uma muda de roupa
  rationale: A expressão se refere a uma provisão ou conjunto de vestuário. “Uma muda de roupa” comunica concretamente esse sentido, embora “uma provisão de roupas” também seja possível.
- source_word: וּמִחְיָתֶךָ
  choice: e o seu sustento
  rationale: מִחְיָה abrange a manutenção necessária à vida, sem se limitar apenas à comida.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: Então o levita foi
  rationale: O verbo hebraico é simplesmente “foi”. A tradução preserva essa forma, embora o contexto possa sugerir que ele entrou ou acompanhou Mica.
theological_decisions:
- issue: Uso honorífico de “pai” num santuário irregular
  choice: Manter a metáfora “pai”
  alternative: conselheiro; mentor espiritual
  rationale: O texto hebraico emprega explicitamente o termo familiar. Preservá-lo mantém a linguagem social e religiosa da narrativa sem aprovar a prática nem introduzir terminologia eclesiástica posterior.
- issue: Unidade não especificada da prata
  choice: Não acrescentar “siclos” ao texto principal
  alternative: dez siclos de prata
  rationale: A unidade monetária não aparece no hebraico. “Peças de prata” evita transformar uma inferência tradicional em informação explícita.
- issue: Sentido contextual de וַיֵּלֶךְ
  choice: Traduzir literalmente “foi” e registrar a possibilidade contextual em nota
  alternative: entrou; foi com ele
  rationale: A forma verbal não explicita destino, entrada nem companhia. A formulação preserva a concisão e a tensão narrativa do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A fala direta mantém concisão narrativa; “sustento” preserva a amplitude sem soar excessivamente técnica.
