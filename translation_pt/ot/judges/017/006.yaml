base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: pt
  text: Naqueles dias, não havia rei em Israel; cada homem fazia o que era certo aos seus próprios olhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Fórmula narrativa temporal natural em português, preservando o enquadramento retrospectivo do hebraico.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: não havia rei em Israel
  rationale: Expressa de modo direto e idiomático a inexistência de um rei, sem acrescentar uma avaliação política explícita.
- source_word: אִישׁ
  choice: cada homem
  rationale: Preserva o singular masculino distributivo e representativo do hebraico, além de combinar naturalmente com o verbo no singular.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: Comunica o sentido avaliativo de יָשָׁר neste contexto sem ampliar o texto para uma explicação moral.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Mantém o conhecido idiomatismo semítico de julgamento subjetivo; “próprios” explicita naturalmente em português a referência reflexiva.
- source_word: יַעֲשֶׂה
  choice: fazia
  rationale: O imperfeito português expressa com naturalidade a ação habitual resumida pelo imperfeito hebraico neste contexto narrativo.
theological_decisions:
- issue: Avaliação narrativa da situação de Israel e relação com a ausência de um rei
  choice: Manter a declaração descritiva e sua crítica implícita por meio de “o que era certo aos seus próprios olhos”
  alternative: Explicitar que a monarquia era a solução necessária, ou tratar a frase como observação histórica inteiramente neutra
  rationale: O refrão possui força literária avaliativa, mas o versículo não formula por si só uma doutrina política completa. A redação preserva essa tensão sem endossar nem negar além do que está expresso.
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa próxima do hebraico. O ponto e vírgula preserva a estreita relação entre a ausência de rei e a conduta descrita, sem explicar essa relação além do texto.
