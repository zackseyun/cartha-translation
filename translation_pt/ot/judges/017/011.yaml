  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: pt
  text: Assim, o levita concordou em morar com o homem[a], e o jovem se tornou para ele como um de seus filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se dispôs a morar com o homem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o jovem se tornou para ele como um de seus filhos”, indicando que o homem o tratava como membro de sua casa.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: concordou
  rationale: O hifil de יאל expressa disposição ou consentimento. “Concordou” é natural em português e comunica que o levita aceitou a proposta de Mica.
- source_word: הַלֵּוִי
  choice: o levita
  rationale: Substantivo definido que retoma o levita já apresentado; esta é a designação tradicional e precisa.
- source_word: לָשֶׁבֶת
  choice: em morar
  rationale: ישׁב pode significar sentar-se, habitar, morar ou permanecer. Neste contexto, trata-se de passar a residir na casa do homem; “morar” expressa isso com clareza.
- source_word: אֶת הָאִישׁ
  choice: com aquele homem
  rationale: 'Com ישׁב, אֶת indica associação: morar com alguém. “Aquele homem” retoma de modo natural o homem mencionado no contexto sem substituir o referente pelo nome.'
- source_word: וַיְהִי
  choice: se tornou
  rationale: A forma introduz o estado resultante da permanência do levita na casa. “Se tornou” conserva a ideia de desenvolvimento, em vez de apresentar apenas um estado estático.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר abrange menino, jovem ou servo. Como o levita age de maneira independente, “o jovem” é a opção mais adequada e concisa.
- source_word: כְּאַחַד מִבָּנָיו
  choice: como um de seus filhos
  rationale: A preposição כ marca comparação, e a expressão descreve uma posição semelhante à de um filho dentro da casa, sem afirmar filiação literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Morar” comunica residência continuada melhor que “ficar” neste contexto. A ordem “se tornou para ele como um de seus filhos” preserva o dativo hebraico e a comparação familiar sem eliminar sua nuance.
