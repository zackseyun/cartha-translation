source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הָ/אִ֜ישׁ מֵ/הָ/עִ֗יר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה לָ/ג֖וּר בַּ/אֲשֶׁ֣ר יִמְצָ֑א וַ/יָּבֹ֧א הַר אֶפְרַ֛יִם עַד בֵּ֥ית מִיכָ֖ה לַ/עֲשׂ֥וֹת דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: pt
  text: O homem saiu da cidade, de Belém de Judá, para morar temporariamente onde encontrasse lugar. Seguindo seu caminho[a], chegou à região montanhosa de Efraim, até a casa de Mica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para seguir viagem” ou “enquanto fazia sua viagem”. Em hebraico, literalmente: “fazer o seu caminho”.'
    reason: A construção idiomática לַעֲשׂוֹת דַּרְכּוֹ pode ser entendida como finalidade ou como circunstância da chegada.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: saiu
  rationale: No contexto de movimento a partir de uma cidade, o verbo הלך é expresso naturalmente por “saiu”, sem perder o sentido narrativo de que o homem partiu dali.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Traduz diretamente o substantivo; embora o contexto anterior o identifique como jovem e levita, tais informações não são explicitadas nesta expressão.
- source_word: מֵהָעִיר
  choice: da cidade
  rationale: עִיר pode designar cidade ou povoado. “Cidade” mantém correspondência lexical próxima e é natural em português.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Belém de Judá
  rationale: Preserva o topônimo e o qualificativo regional que distingue esta Belém de outras localidades.
- source_word: לָגוּר
  choice: para morar temporariamente
  rationale: גור frequentemente indica residência temporária ou permanência como alguém de fora. A expressão comunica essa nuance em português corrente melhor que o arcaísmo “peregrinar”.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: onde encontrasse lugar
  rationale: A expressão aponta para qualquer local disponível; “lugar” explicita com naturalidade o objeto implícito de “encontrar”.
- source_word: וַיָּבֹא
  choice: chegou
  rationale: בוא indica vir ou chegar; aqui “chegou” expressa claramente o avanço até a região e a casa mencionadas.
- source_word: הַר אֶפְרַיִם
  choice: a região montanhosa de Efraim
  rationale: A expressão geográfica designa a zona serrana de Efraim, não necessariamente uma única montanha.
- source_word: עַד בֵּית מִיכָה
  choice: até a casa de Mica
  rationale: עַד marca o limite ou ponto alcançado durante o percurso.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: seguindo seu caminho
  rationale: A expressão, literalmente “fazer o seu caminho”, é uma locução idiomática referente ao percurso. A forma circunstancial se ajusta à sintaxe e mantém aberta a relação precisa com a chegada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. Evitou-se “peregrinar” por sua possível ambiguidade religiosa e seu tom menos corrente.
