  text: וַ/יָּ֛שֶׁב אֶת אֶֽלֶף וּ/מֵאָ֥ה הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תֹּ֣אמֶר אִמּ֡/וֹ הַקְדֵּ֣שׁ הִקְדַּ֣שְׁתִּי אֶת הַ/כֶּסֶף֩ לַ/יהוָ֨ה מִ/יָּדִ֜/י לִ/בְנִ֗/י לַֽ/עֲשׂוֹת֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וְ/עַתָּ֖ה אֲשִׁיבֶ֥/נּוּ לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: pt
  text: 'Ele devolveu as mil e cem peças de prata à sua mãe, e ela disse: “Eu havia consagrado solenemente essa prata a Yahweh, de minha própria mão[a], para o meu filho, a fim de fazer uma imagem esculpida e uma imagem de metal fundido[b]. Agora eu a devolvo a você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da minha mão”. A expressão pode enfatizar a posse da prata ou a participação pessoal da mãe em sua consagração.'
    reason: cultural_note
  - marker: b
    text: Ou “uma imagem fundida”. Os dois termos hebraicos também podem descrever aspectos de um único objeto, em vez de duas imagens distintas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: devolveu
  rationale: O hifil de שׁוב indica fazer voltar, isto é, restituir. “Devolveu” é natural e preserva o sentido de restituição.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: as mil e cem peças de prata
  rationale: O hebraico não explicita a unidade de peso neste versículo. “Peças de prata” evita acrescentar “siclos” com certeza indevida.
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: havia consagrado solenemente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a declaração. A formulação comunica tanto a ênfase quanto o sentido cultual de separar algo para uso sagrado.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִיָּדִי
  choice: de minha própria mão
  rationale: Mantém a imagem concreta do hebraico e a ênfase no envolvimento, na posse ou na agência pessoal da mãe, sem decidir de modo rígido entre essas nuances.
- source_word: לִבְנִי
  choice: para o meu filho
  rationale: A preposição indica naturalmente o beneficiário ou destinatário pretendido.
- source_word: פֶּסֶל
  choice: uma imagem esculpida
  rationale: Expressão concreta e atual que preserva o modo de fabricação sem recorrer a vocabulário arcaico.
- source_word: וּמַסֵּכָה
  choice: e uma imagem de metal fundido
  rationale: מַסֵּכָה costuma designar uma imagem produzida por fundição, geralmente de metal. A tradução explicita esse processo de modo claro.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: eu a devolvo a você
  rationale: O imperfeito hifil admite valor presente ou futuro no contexto. O presente preserva a força direta da declaração e também a tensão na sequência narrativa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome da aliança. A transliteração “Yahweh” o distingue de títulos divinos e segue a evidência do texto hebraico.
- issue: Linguagem de consagração ligada à fabricação de imagens
  choice: preservar sem atenuação a afirmação de que a prata foi consagrada a Yahweh para fazer imagens
  alternative: reformular a ação como mera intenção humana ou explicitar no corpo do texto que era idolatria
  rationale: O hebraico mantém lado a lado a linguagem cultual de consagração a Yahweh e a fabricação das imagens. A tradução conserva essa tensão teológica sem harmonizá-la nem inserir um julgamento editorial.
- issue: Relação entre פֶּסֶל e מַסֵּכָה
  choice: 'apresentar duas designações coordenadas: “uma imagem esculpida e uma imagem de metal fundido”'
  alternative: entender os termos como duas descrições de um único objeto
  rationale: A conjunção e a ausência de explicitação adicional permitem discussão sobre um ou dois objetos. O texto principal reproduz a coordenação formal, e a nota registra a possível referência a uma só imagem.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Conserva-se a repetição conceitual das duas imagens e a estranheza deliberada de a mãe devolver ao filho aquilo que ele acabara de lhe devolver. A expressão “de minha própria mão” permanece próxima do hebraico, acompanhada de nota para esclarecer sua amplitude idiomática.
