base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: pt
  text: 'Mica lhe perguntou: “De onde você vem?” Ele respondeu: “Sou levita, de Belém de Judá, e estou indo morar por algum tempo onde eu encontrar lugar[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para residir como forasteiro onde eu encontrar [lugar]”. O verbo hebraico pode indicar morar temporariamente, muitas vezes como alguém de fora ou como residente dependente. “Lugar” está implícito no hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: De onde você vem?
  rationale: Expressa naturalmente em português a pergunta pela procedência, preservando o sentido do interrogativo hebraico.
- source_word: לֵוִי
  choice: levita
  rationale: Designa a identidade tribal do homem. Em português, a construção predicativa natural é “sou levita”, sem artigo indefinido.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Belém de Judá
  rationale: Identifica a Belém situada no território de Judá e conserva a forma bíblica tradicional sem perder clareza.
- source_word: הֹלֵךְ
  choice: estou indo
  rationale: O particípio indica uma ação em curso ou uma intenção imediata; “estou indo” preserva esse aspecto sem especificar o modo de viagem.
- source_word: לָגוּר
  choice: morar por algum tempo
  rationale: O verbo גור pode indicar residência temporária, muitas vezes na condição de forasteiro ou residente dependente. A formulação é atual e compreensível, embora a nota registre a nuance social mais ampla.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: onde eu encontrar lugar
  rationale: O hebraico deixa implícito o objeto de “encontrar”. Acrescentar “lugar” torna a frase natural em português sem definir além do necessário o que ele esperava encontrar.
