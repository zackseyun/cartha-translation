  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: pt
  text: Havia um homem da região montanhosa de Efraim, e seu nome era Mikayhu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente vertido como «Mica». A forma hebraica aqui é Mikayhu.
