lexical_decisions:
- source_word: וַיְהִי
  choice: Havia
  rationale: Introduz uma nova unidade narrativa de modo natural em português, sem acrescentar um advérbio temporal ausente no hebraico.
- source_word: אִישׁ
  choice: um homem
  rationale: Expressa diretamente o sentido comum do substantivo, sem a especificidade adicional de «certo homem».
- source_word: מֵהַר אֶפְרָיִם
  choice: da região montanhosa de Efraim
  rationale: A expressão designa a zona de terras altas associada a Efraim, não um monte isolado.
- source_word: וּשְׁמוֹ
  choice: e seu nome era
  rationale: Preserva a coordenação simples da oração hebraica em português natural.
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma portuguesa reconhecível que representa adequadamente o nome hebraico Mikáyhu; a nota registra a forma exata encontrada neste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. «Região montanhosa» evita a leitura equivocada de um único monte. O marcador de nota foi colocado após o nome, ao qual a nota se refere.
