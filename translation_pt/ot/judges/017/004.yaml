  text: וַ/יָּ֥שֶׁב אֶת הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תִּקַּ֣ח אִמּ/וֹ֩ מָאתַ֨יִם כֶּ֜סֶף וַ/תִּתְּנֵ֣/הוּ לַ/צּוֹרֵ֗ף וַֽ/יַּעֲשֵׂ֨/הוּ֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽיְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: pt
  text: Então ele devolveu a prata à sua mãe, e sua mãe tomou duzentas peças de prata[a] e as entregou ao ourives. O ourives fez dela uma imagem esculpida e uma imagem de metal fundido[b], e aquilo ficou[c] na casa de Mica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “duzentos siclos de prata”; o hebraico diz literalmente apenas “duzentos de prata”, sem declarar a unidade neste versículo.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “uma imagem talhada e uma imagem fundida”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico emprega um verbo no singular (“ficou”) depois de “uma imagem esculpida e uma imagem de metal fundido”, possivelmente tratando o objeto produzido ou o conjunto como uma unidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: devolveu
  rationale: O hifil de שׁוב indica fazer retornar; “devolveu” expressa naturalmente a restituição da prata à mãe.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף pode significar prata ou dinheiro. A quantidade medida e seu uso posterior na fabricação das imagens favorecem o sentido concreto “prata”.
- source_word: מָאתַיִם כֶּסֶף
  choice: duzentas peças de prata
  rationale: O hebraico traz o número seguido de “prata”, sem explicitar a unidade neste versículo. “Peças de prata” é natural e evita inserir “siclos” no texto principal.
- source_word: לַצּוֹרֵף
  choice: ao ourives
  rationale: צֹרֵף designa quem refina ou trabalha metais; como o material é prata, “ourives” é preciso e corrente em português.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Ele fez com a prata
  rationale: O verbo masculino singular tem mais naturalmente o artesão como sujeito. A formulação portuguesa torna clara a transformação do material sem determinar se as expressões seguintes descrevem um ou dois objetos.
- source_word: פֶּסֶל
  choice: uma imagem esculpida
  rationale: פֶּסֶל designa uma imagem talhada ou esculpida, frequentemente em contexto cultual. A escolha traduz o termo sem acrescentar explicitamente a avaliação “ídolo”.
- source_word: וּמַסֵּכָה
  choice: e uma imagem de metal fundido
  rationale: מַסֵּכָה indica uma imagem produzida por fundição. A expressão é clara e atual, sem o tom arcaico de alternativas tradicionais.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: e aquilo ficou na casa de Mica
  rationale: “Aquilo” conserva o singular do verbo hebraico depois das duas designações, permitindo que o referente seja entendido como o objeto ou conjunto produzido sem forçar uma solução.
- source_word: מִיכָיְהוּ
  choice: Mica
  rationale: “Mica” é a forma portuguesa convencional do nome desta personagem em Juízes.
theological_decisions:
- issue: Se פֶּסֶל וּמַסֵּכָה deve ser traduzido com linguagem explicitamente condenatória
  choice: uma imagem esculpida e uma imagem de metal fundido
  alternative: um ídolo e uma imagem de metal fundido
  rationale: O contexto mais amplo apresenta esses objetos cultuais de modo problemático, mas o versículo pode ser traduzido lexicalmente sem antecipar essa avaliação por meio de “ídolo”.
- issue: Se as duas expressões indicam necessariamente dois objetos distintos
  choice: manter as duas expressões e usar uma retomada singular
  alternative: tratá-las inequivocamente como duas imagens separadas
  rationale: O texto nomeia “imagem esculpida e imagem fundida”, mas emprega sufixo e verbo no singular. A tradução preserva essa tensão em vez de decidir se se trata de um objeto composto, duas peças vistas como unidade ou outra construção.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa direta. “Ourives” e “metal fundido” comunicam o ofício e o processo sem arcaísmo. A retomada “aquilo” preserva de modo inteligível a singularidade gramatical e a ambiguidade do hebraico.
