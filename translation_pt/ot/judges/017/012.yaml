  text: וַ/יְמַלֵּ֤א מִיכָה֙ אֶת יַ֣ד הַ/לֵּוִ֔י וַ/יְהִי ל֥/וֹ הַ/נַּ֖עַר לְ/כֹהֵ֑ן וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: pt
  text: Então Mica consagrou o levita[a], e o jovem se tornou seu sacerdote e ficou na casa de Mica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “encheu a mão do levita”, expressão usada para investir ou consagrar alguém ao serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד הַלֵּוִי
  choice: consagrou o levita
  rationale: A expressão idiomática hebraica, literalmente «encheu a mão do levita», indica sua investidura no serviço sacerdotal. «Consagrou» é natural em português nesse contexto, sem afirmar que o ato tivesse aprovação divina; a forma literal é preservada em nota.
- source_word: הַלֵּוִי
  choice: o levita
  rationale: Identifica o homem por sua condição tribal; «o levita» é a forma corrente e natural em português.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר pode designar menino, moço, jovem ou servo. Como ele atua de modo independente como sacerdote, «o jovem» é adequado sem precisar demais sua idade.
- source_word: וַיְהִי לוֹ ... לְכֹהֵן
  choice: se tornou seu sacerdote
  rationale: A construção expressa a entrada do jovem na função sacerdotal em favor de Mica. «Se tornou seu sacerdote» comunica com clareza essa transição.
- source_word: וַיְהִי בְּבֵית מִיכָה
  choice: ficou na casa de Mica
  rationale: O hebraico afirma que o jovem passou a estar na casa de Mica. «Ficou» é natural no fluxo narrativo e preserva o sentido espacial, sem ampliar «casa» para «família» ou «domicílio».
theological_decisions:
- issue: Descrever uma investidura sacerdotal privada e irregular sem insinuar legitimidade divina
  choice: Mica consagrou o levita
  alternative: Mica encheu a mão do levita / Mica ordenou o levita
  rationale: O texto relata a ação de Mica, mas não a legitima. «Consagrou» comunica a investidura cultual sem acrescentar aprovação divina. A expressão hebraica concreta é registrada na nota, preservando sua particularidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Mica» segue a forma tradicional portuguesa do nome. A coordenação narrativa do hebraico foi mantida sem rigidez excessiva.
