  text: וַ/יְהִ֥י דָוִ֛ד לְ/כָל דָּרְכָ֖/ו מַשְׂכִּ֑יל וַֽ/יהוָ֖ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: pt
  text: Davi agia com sabedoria em todos os seus caminhos[a], e Yahweh estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “era bem-sucedido” ou “prosperava”; o termo hebraico pode indicar uma ação prudente que resulta em sucesso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דָוִד
  choice: Davi agia
  rationale: A construção introduz o padrão contínuo de conduta de Davi; em português, “Davi agia” expressa isso de modo natural.
- source_word: לְכָל דָּרְכָו
  choice: em todos os seus caminhos
  rationale: Preserva a imagem hebraica de “caminhos”, aqui referente à conduta e às atividades de Davi.
- source_word: מַשְׂכִּיל
  choice: com sabedoria
  rationale: O particípio de שכל no Hifil pode indicar agir com discernimento e, por extensão, alcançar êxito. A escolha mantém em primeiro plano a conduta sábia sem excluir o resultado bem-sucedido.
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: Translitera o nome divino יהוה, preservando o nome pactual presente no texto hebraico.
- source_word: עִמּוֹ
  choice: estava com ele
  rationale: Expressa naturalmente presença e apoio divinos, sem explicitar além do que o hebraico afirma.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” conserva o nome próprio e evita substituí-lo por um título.
- issue: Relação entre sabedoria e sucesso em מַשְׂכִּיל
  choice: com sabedoria
  alternative: com sucesso
  rationale: O termo comporta tanto ação prudente quanto êxito resultante. O texto principal preserva o núcleo ligado ao discernimento, e a nota registra a dimensão possível de sucesso.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação conserva a imagem hebraica dos “caminhos” e a ambiguidade lexical entre conduta sábia e êxito.
