base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: pt
  text: 'Então Saul disse: “Eu a darei a ele, para que ela se torne uma armadilha para ele e a mão dos filisteus venha contra ele.” Depois Saul disse a Davi: “Com a segunda, você poderá tornar-se meu genro hoje.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pela segunda vez, você poderá tornar-se meu genro hoje.” A expressão hebraica é elíptica e pode referir-se tanto à segunda filha de Saul quanto a uma segunda oportunidade de Davi casar-se com alguém da família de Saul.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: Eu a darei a ele
  rationale: No contexto matrimonial, נתן indica dar a filha em casamento. A formulação breve preserva a expressão hebraica, enquanto o contexto explicita o sentido.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: para que ela lhe sirva de armadilha
  rationale: מוֹקֵשׁ designa laço ou armadilha. “Sirva de armadilha” conserva a metáfora e expressa naturalmente a intenção de Saul.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: e a mão dos filisteus venha contra ele
  rationale: Mantém a imagem hebraica da “mão” como poder ou ação hostil, deixando clara a oposição dos filisteus.
- source_word: בִּשְׁתַּיִם
  choice: Por meio da segunda
  rationale: A expressão é elíptica e difícil. No contexto, provavelmente se refere à segunda filha de Saul, por meio de quem Davi poderia tornar-se seu genro; a alternativa temporal é registrada em nota.
- source_word: תִּתְחַתֵּן בִּי
  choice: você poderá tornar-se meu genro
  rationale: O hitpael de חתן com ב indica entrar em aliança matrimonial com alguém; aqui, especificamente, tornar-se genro de Saul.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Tradução direta que preserva a força imediata da fala.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Então Saul pensou ... Depois Saul disse
  rationale: A primeira fala expressa o propósito privado de Saul, enquanto a segunda é dirigida explicitamente a Davi. “Pensou” torna natural essa distinção discursiva sem alterar o conteúdo.
