base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: pt
  text: 'Então Saul ficou muito irado, e isso lhe desagradou. Ele disse: “A Davi deram dezenas de milhares, mas a mim deram milhares[a]. Só lhe falta o reino[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido mais explícito: “A Davi atribuíram dezenas de milhares, mas a mim atribuíram milhares”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é condensado: “e ainda para ele somente o reino”, isto é, na percepção de Saul, só faltava Davi receber o reino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: Saul ficou muito irado
  rationale: O verbo descreve ira intensa, literalmente associada à ideia de ardor; “ficou muito irado” preserva a força de מְאֹד em português natural e digno.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: lhe desagradaram
  rationale: A expressão idiomática hebraica significa literalmente que algo foi mau aos olhos de alguém. No contexto, comunica a forte desaprovação de Saul.
- source_word: הַדָּבָר הַזֶּה
  choice: essas palavras
  rationale: דָּבָר pode designar palavra, declaração, assunto ou acontecimento. Aqui retoma o refrão cantado imediatamente antes; “essas palavras” torna a referência clara sem perder o sentido contextual.
- source_word: נָתְנוּ לְדָוִד רְבָבוֹת
  choice: A Davi deram dezenas de milhares
  rationale: Mantém o verbo comum “dar” e expressa רְבָבוֹת como múltiplos de dez mil, preservando o contraste numérico do cântico.
- source_word: וְלִי נָתְנוּ הָאֲלָפִים
  choice: mas a mim deram milhares
  rationale: A construção portuguesa conserva o paralelismo e o contraste com Davi. O artigo hebraico não é reproduzido porque “os milhares” soaria artificial neste contexto.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: Agora só lhe falta o reino
  rationale: 'A oração hebraica é fortemente condensada: literalmente, algo como “e ainda para ele somente o reino”. A tradução explicita a conclusão temerosa de Saul sem transformá-la em uma pergunta que o hebraico não marca formalmente.'
theological_decisions:
- issue: Sentido de הַמְּלוּכָה
  choice: o reino
  alternative: a realeza / o poder real
  rationale: O termo pode indicar tanto a condição de rei quanto o domínio real. “O reino” preserva a formulação tradicional e natural, deixando o contexto mostrar que Saul teme a ascensão de Davi ao governo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com sintaxe natural para leitores brasileiros. O paralelismo da fala de Saul foi preservado, e a expressão final foi esclarecida no texto sem eliminar a forma hebraica, registrada em nota.
