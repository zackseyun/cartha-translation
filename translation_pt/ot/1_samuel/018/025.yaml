  text: וַ/יֹּ֨אמֶר שָׁא֜וּל כֹּֽה תֹאמְר֣וּ לְ/דָוִ֗ד אֵֽין חֵ֤פֶץ לַ/מֶּ֨לֶךְ֙ בְּ/מֹ֔הַר כִּ֗י בְּ/מֵאָה֙ עָרְל֣וֹת פְּלִשְׁתִּ֔ים לְ/הִנָּקֵ֖ם בְּ/אֹיְבֵ֣י הַ/מֶּ֑לֶךְ וְ/שָׁא֣וּל חָשַׁ֔ב לְ/הַפִּ֥יל אֶת דָּוִ֖ד בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: pt
  text: 'Então Saul disse: “Digam o seguinte a Davi: ‘O rei não deseja nenhum preço pela noiva[a], mas somente cem prepúcios de filisteus, para se vingar dos inimigos do rei’.” Saul, porém, planejava fazer Davi cair[b] pelas mãos dos filisteus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Preço pela noiva” traduz o hebraico mohar, pagamento relacionado ao casamento, normalmente entregue pelo noivo ou por sua família à família da noiva; não corresponde ao sentido moderno comum de “dote”.
    reason: cultural_note
  - marker: b
    text: “Fazer Davi cair” provavelmente significa provocar sua morte, mas a expressão hebraica é menos explícita.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: preço pela noiva
  rationale: Expressa o pagamento ligado ao casamento, normalmente feito pelo noivo ou sua família à família da noiva, sem a conotação moderna de dote como bens trazidos pela noiva.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: O rei não deseja nenhum
  rationale: חֵפֶץ pode indicar desejo, prazer ou interesse; no contexto da negociação matrimonial, “não deseja nenhum” é natural e mantém o sentido.
- source_word: כִּי בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: mas somente cem prepúcios de filisteus
  rationale: Aqui כִּי introduz aquilo que substitui o pagamento matrimonial comum. A formulação conserva a concretude chocante do hebraico.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: para se vingar dos inimigos do rei
  rationale: O infinitivo nifal admite nuance reflexiva/passiva; em português, “se vingar de” comunica naturalmente o propósito declarado e preserva a referência de Saul a si mesmo como rei.
- source_word: חָשַׁב
  choice: planejava
  rationale: No contexto, o verbo indica cálculo ou intenção deliberada, e não mero pensamento.
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: fazer Davi cair
  rationale: Preserva a metáfora causativa do hebraico sem explicitar que a queda necessariamente significa morte.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: pelas mãos dos filisteus
  rationale: Mantém o idioma hebraico de agência em uma forma compreensível e corrente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a crueza de “prepúcios”, a metáfora ambígua de “cair” e a autodesignação régia de Saul. A ordem das notas foi regularizada para que cada marcador acompanhe o elemento explicado.
