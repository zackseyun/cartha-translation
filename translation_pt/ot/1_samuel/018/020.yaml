  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: pt
  text: Mical, filha de Saul, amou Davi. Contaram isso a Saul, e o assunto lhe agradou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o assunto pareceu certo/agradável aos olhos dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: amava
  rationale: O verbo אהב denota diretamente amor. O imperfeito em sequência narrativa pode ser vertido naturalmente como “amava”, sem acrescentar a nuance incoativa de “apaixonou-se”.
- source_word: מִיכַל
  choice: Mical
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: בַּת שָׁאוּל
  choice: filha de Saul
  rationale: Reproduz com naturalidade a cadeia construta hebraica e identifica a relação familiar.
- source_word: אֶת דָּוִד
  choice: Davi
  rationale: A partícula de objeto direto אֶת não recebe tradução; o nome segue a forma portuguesa consagrada.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Quando contaram isso a Saul
  rationale: נגד no hifil significa contar ou informar. A terceira pessoa do plural permanece indefinida, como no hebraico; “isso” retoma naturalmente o fato mencionado. “Quando” expressa a progressão narrativa sem introduzir um marcador temporal lexical independente.
- source_word: וַיִּשַׁר
  choice: ficou satisfeito
  rationale: No idioma formado com “aos olhos de”, ישר comunica que algo parece bom ou agradável a alguém. Esta formulação transmite de modo claro a reação favorável de Saul.
- source_word: הַדָּבָר
  choice: isso
  rationale: דבר refere-se aqui à situação ou notícia relatada. O pronome evita a expressão menos natural “o assunto” sem alterar o referente.
- source_word: בְּעֵינָיו
  choice: ele
  rationale: O idioma hebraico “aos olhos dele” indica avaliação ou agrado pessoal; a formulação idiomática portuguesa é acompanhada de nota literal.
