  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל מִ֤י אָֽנֹכִי֙ וּ/מִ֣י חַיַּ֔/י מִשְׁפַּ֥חַת אָבִ֖/י בְּ/יִשְׂרָאֵ֑ל כִּֽי אֶהְיֶ֥ה חָתָ֖ן לַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: pt
  text: 'Então Davi disse a Saul: “Quem sou eu, e o que é a minha vida[a], ou a família de meu pai em Israel, para que eu me torne genro do rei?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “quem são os meus parentes”. A expressão hebraica é incomum e pode enfatizar a insignificância de Davi ou referir-se à sua parentela, em paralelo com “a família de meu pai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: מִי אָנֹכִי
  choice: Quem sou eu
  rationale: Reproduz diretamente a pergunta retórica e autodepreciativa de Davi, com naturalidade em português.
- source_word: וּמִי חַיַּי
  choice: e o que é a minha vida
  rationale: A expressão hebraica é incomum e literalmente se aproxima de “e quem/o que é minha vida”. A tradução conserva a referência à insignificância de Davi sem eliminar a possível relação com seus parentes, indicada em nota.
- source_word: מִשְׁפַּחַת אָבִי
  choice: a família de meu pai
  rationale: מִשְׁפָּחָה pode designar família ou clã; “família de meu pai” é claro, atual e mantém o sentido patrilinear.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Indica a posição da família de Davi dentro do povo de Israel.
- source_word: כִּי אֶהְיֶה
  choice: para que eu me torne
  rationale: 'No contexto das perguntas retóricas, expressa a perspectiva considerada extraordinária por Davi: vir a ocupar essa posição.'
- source_word: חָתָן לַמֶּלֶךְ
  choice: genro do rei
  rationale: Neste contexto, חָתָן designa o homem que se casa com a filha do rei; “genro do rei” é o equivalente português direto e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção incomum “o que é a minha vida” foi mantida para preservar a ambiguidade do hebraico, esclarecida por nota.
