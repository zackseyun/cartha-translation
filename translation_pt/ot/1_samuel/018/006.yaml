  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/ם בְּ/שׁ֤וּב דָּוִד֙ מֵ/הַכּ֣וֹת אֶת הַ/פְּלִשְׁתִּ֔י וַ/תֵּצֶ֨אנָה הַ/נָּשִׁ֜ים מִ/כָּל עָרֵ֤י יִשְׂרָאֵל֙ ל/שור וְ/הַ/מְּחֹל֔וֹת לִ/קְרַ֖את שָׁא֣וּל הַ/מֶּ֑לֶךְ בְּ/תֻפִּ֥ים בְּ/שִׂמְחָ֖ה וּ/בְ/שָׁלִשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: pt
  text: E aconteceu que, quando eles vinham chegando, ao voltar Davi depois de derrotar o filisteu, as mulheres saíram de todas as cidades de Israel, cantando e dançando, ao encontro do rei Saul, com tamborins, com alegria e com instrumentos de três cordas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido da palavra hebraica שָׁלִשִׁים é incerto. Ela pode se referir a instrumentos de três cordas, a alaúdes ou a outro tipo de acompanhamento musical.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz a nova cena narrativa de maneira natural, preservando a função discursiva da forma hebraica sem recorrer a uma expressão arcaica.
- source_word: בְּבוֹאָם
  choice: quando eles vinham chegando
  rationale: Mantém o sufixo masculino plural e o valor temporal-progressivo da construção, sem identificar além do que o verso explicita.
- source_word: בְּשׁוּב דָּוִד
  choice: ao voltar Davi
  rationale: Reproduz a oração temporal com Davi como sujeito explícito e conserva uma ordem digna e clara em português.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: depois de derrotar o filisteu
  rationale: נכה pode indicar ferir, abater ou derrotar. No contexto, 'derrotar' comunica o resultado sem tornar a formulação desnecessariamente gráfica; o singular definido é preservado.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: as mulheres saíram
  rationale: Expressa diretamente que elas saíram das cidades para ir ao encontro do rei.
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: de todas as cidades de Israel
  rationale: Mantém o sentido coletivo ou distributivo da expressão hebraica.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: cantando e dançando
  rationale: Converte a combinação formal de infinitivo e substantivo em um par verbal idiomático, preservando as duas ações.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: ao encontro do rei Saul
  rationale: לִקְרַאת indica movimento para encontrar ou receber alguém; a ordem do título e do nome é natural em português.
- source_word: בְּתֻפִּים
  choice: com tamborins
  rationale: תֹּף designa um pequeno tambor de armação, semelhante ao tamborim; a escolha é atual e compreensível.
- source_word: בְּשִׂמְחָה
  choice: com alegria
  rationale: Preserva a forma nominal e a coordenação com as expressões instrumentais adjacentes.
- source_word: וּבְשָׁלִשִׁים
  choice: com instrumentos de três cordas
  rationale: O termo é raro e de sentido incerto. A tradução apresenta uma interpretação musical plausível, enquanto a nota conserva alternativas e explicita a incerteza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva as duas indicações temporais e o pronome plural indefinido do hebraico. O marcador [a] foi colocado imediatamente após a expressão lexicalmente incerta.
