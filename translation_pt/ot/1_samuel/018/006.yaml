  source_fidelity: A tradução preserva as duas molduras temporais do hebraico, o referente singular definido «o filisteu», a saída das mulheres de todas as cidades de Israel e a finalidade de ir ao encontro do rei Saul. «Depois de derrotar» é uma formulação contextual e não gráfica adequada para מֵהַכּוֹת, sem exceder de modo indevido o sentido no contexto imediato.
  naturalness: O texto tem registro moderno, claro e digno. A sequência «quando eles vinham chegando, ao voltar Davi» conserva deliberadamente o pronome plural não especificado e as duas indicações temporais; embora seja uma construção um pouco marcada, permanece compreensível e condiz com a complexidade do original.
  terminology: «Rei Saul», «tamborins» e «alegria» são escolhas naturais. «Instrumentos de três cordas» segue uma possibilidade lexical plausível para שָׁלִשִׁים, e a nota informa corretamente que o termo é incerto e apresenta alternativas sem alegar certeza.
