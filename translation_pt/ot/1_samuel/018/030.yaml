  text: וַ/יֵּצְא֖וּ שָׂרֵ֣י פְלִשְׁתִּ֑ים וַ/יְהִ֣י מִ/דֵּ֣י צֵאתָ֗/ם שָׂכַ֤ל דָּוִד֙ מִ/כֹּל֙ עַבְדֵ֣י שָׁא֔וּל וַ/יִּיקַ֥ר שְׁמ֖/וֹ מְאֹֽד׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: pt
  text: Então os comandantes dos filisteus saíram. E, cada vez que saíam, Davi agia com mais sabedoria[a] do que todos os servos[b] de Saul, e seu nome se tornou muito estimado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Davi tinha mais êxito” ou “era mais bem-sucedido”. O verbo hebraico pode indicar uma conduta prudente que resulta em sucesso.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “servos” pode incluir oficiais e outros homens a serviço do rei.
    reason: contextual_clarification
  - marker: c
    text: Literalmente, “seu nome se tornou muito precioso” ou “muito honrado”; isto é, sua reputação passou a ser muito estimada.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: os comandantes dos filisteus
  rationale: No contexto militar, שָׂרִים designa melhor os chefes ou comandantes filisteus, sem recorrer ao sentido político mais específico de “príncipes”.
- source_word: וַיֵּצְאוּ / מִדֵּי צֵאתָם
  choice: saíram / cada vez que saíam
  rationale: 'Mantém o sentido básico de יצא e expressa com naturalidade a força iterativa da construção מִדֵּי: a ação se repetia em cada saída dos filisteus.'
- source_word: שָׂכַל
  choice: agia com mais sabedoria
  rationale: Preserva o núcleo semântico de conduta prudente, sem excluir a ideia contextual de êxito resultante dessa prudência.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: do que todos os servos de Saul
  rationale: Reproduz a comparação hebraica e conserva a designação ampla dos homens que serviam ao rei; aqui “servos” não precisa indicar escravidão.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: seu nome se tornou muito estimado
  rationale: Conserva a imagem hebraica do “nome” como reputação e traduz יקר como elevado apreço ou honra, com מְאֹד expresso por “muito”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “saíram/saíam” foi mantida para refletir a progressão e a recorrência do hebraico. Evitou-se explicitar “para a guerra” no texto principal, pois isso é contextual, não lexicalmente expresso.
