base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: pt
  text: 'Então Saul disse a Davi: “Veja, minha filha mais velha, Merabe — eu a darei a você como esposa. Apenas seja valente a meu serviço e lute nas guerras do SENHOR.” Pois Saul dizia: “Que minha mão não seja contra ele, mas que a mão dos filisteus seja contra ele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a função apresentativa e enfática da partícula hebraica em linguagem portuguesa natural.
- source_word: בִּתִּי הַגְּדוֹלָה
  choice: minha filha mais velha
  rationale: Neste contexto familiar, הַגְּדוֹלָה distingue Merabe como a filha de maior idade.
- source_word: לְבֶן־חַיִל
  choice: valente
  rationale: A expressão descreve coragem e capacidade guerreira; a formulação concisa se ajusta ao chamado militar de Saul.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: as guerras do SENHOR
  rationale: Reproduz o plural e verte o nome divino segundo a convenção portuguesa em versaletes.
- source_word: אָמַר
  choice: pensava
  rationale: O verbo introduz aqui a intenção interior de Saul, não palavras dirigidas a Davi; 'pensava' comunica naturalmente esse uso.
- source_word: יָד
  choice: mão
  rationale: Preserva a imagem hebraica de agência ou poder responsável pela morte de Davi.
theological_decisions:
- issue: Identificação das guerras como pertencentes a YHWH
  choice: guerras do SENHOR
  alternative: guerras de Yahweh
  rationale: Mantém a atribuição explícita ao Deus de Israel sem acrescentar interpretação denominacional, usando a convenção editorial portuguesa para o Tetragrama.
- issue: Propósito oculto de Saul
  choice: Pois Saul pensava
  alternative: Pois Saul dizia
  rationale: O contexto apresenta uma deliberação interna e homicida de Saul; a tradução explicita apenas o valor contextual do verbo, sem suavizar sua intenção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala preserva a ênfase de הִנֵּה e o paralelismo entre a mão de Saul e a dos filisteus. Emprega-se 'você' por naturalidade amplamente compreensível e 'por mulher' para conservar o caráter formal da promessa matrimonial.
