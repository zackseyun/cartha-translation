base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: pt
  text: Então Davi se levantou e partiu com seus homens. Eles mataram duzentos filisteus. Davi trouxe os prepúcios deles, e eles os apresentaram ao rei em número integral[a], para que Davi se tornasse genro do rei. Então Saul lhe deu sua filha Mical como esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles os contaram, completando o total exigido pelo rei”. O verbo hebraico é difícil e pode se referir tanto à apresentação da quantidade completa quanto à contagem que comprovava o total.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: se levantou e partiu com seus homens
  rationale: Preserva os dois verbos narrativos e expressa em português natural a participação enfática de Davi e seus homens.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: mataram duzentos filisteus
  rationale: No contexto militar, נכה indica ferir mortalmente; a coleta posterior dos prepúcios confirma que os homens foram mortos. A forma direta evita uma expressão portuguesa artificial.
- source_word: עָרְלֹתֵיהֶם
  choice: os prepúcios deles
  rationale: O termo anatômico direto corresponde ao hebraico e não encobre a natureza do preço nupcial exigido.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: eles os apresentaram ao rei em número completo
  rationale: A construção hebraica é difícil. Esta formulação comunica que a quantidade integral foi entregue ao rei, mantendo em nota a possibilidade de que o verbo descreva a contagem.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: para que Davi se tornasse genro do rei
  rationale: O hitpael de חתן indica entrar numa relação familiar por casamento; no contexto, tornar-se genro é a expressão mais precisa e natural.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: Então Saul lhe deu sua filha Mical como esposa
  rationale: Mantém a fórmula formal de concessão matrimonial em português moderno e claro.
