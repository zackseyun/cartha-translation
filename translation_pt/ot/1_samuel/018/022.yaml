base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: pt
  text: 'Então Saul ordenou a seus servos: “Falem em particular com Davi[a], dizendo: ‘Veja, o rei se agrada de você, e todos os servos do rei amam você. Agora, torne-se genro do rei[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em segredo” ou “discretamente”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “torne-se parente do rei por casamento” ou “alie-se ao rei por casamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa aqui uma ordem ou incumbência; “ordenou” preserva sua força diretiva.
- source_word: עֲבָדוֹ
  choice: aos seus servos
  rationale: עבד pode designar servos, auxiliares ou oficiais da corte. “Servos” é uma tradução direta e adequada ao contexto régio sem especificar uma posição não indicada.
- source_word: דַּבְּרוּ
  choice: Falem
  rationale: O imperativo plural de דבר dirige aos servos a ação de falar com Davi; “Falem” é natural e preserva a forma verbal.
- source_word: בַּלָּט
  choice: em particular
  rationale: O termo indica comunicação discreta, reservada ou secreta. “Em particular” é claro no contexto, enquanto a nota preserva alternativas de intensidade.
- source_word: הִנֵּה
  choice: Veja
  rationale: הנה chama a atenção para o que segue. “Veja” mantém essa função discursiva em português atual.
- source_word: חָפֵץ בְּךָ
  choice: se agrada de você
  rationale: חפץ com ב pode expressar prazer, satisfação ou favor por alguém. “Se agrada de você” comunica o favor do rei sem sugerir indevidamente desejo romântico.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido apresenta Saul em sua função régia e sustenta a formulação cortesã da mensagem.
- source_word: אֲהֵבוּךָ
  choice: amam você
  rationale: אהב significa diretamente “amar”. Embora no ambiente da corte possa incluir estima ou lealdade, “amam você” preserva a força lexical sem reduzi-la.
- source_word: וְעַתָּה
  choice: Portanto, ... agora
  rationale: A expressão introduz a ação recomendada com base no favor anteriormente declarado. A combinação “Portanto ... agora” torna explícito em português o fluxo inferencial e temporal.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: torne-se ... genro do rei
  rationale: O hitpael de חתן com o rei descreve entrar numa relação de parentesco por casamento. Neste contexto, Davi seria especificamente genro do rei; a nota conserva a formulação hebraica mais ampla.
