  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: pt
  text: Então Jônatas fez uma aliança[a] com Davi, porque o amava como a si mesmo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «cortou uma aliança».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «em seu amor por ele». Os pronomes hebraicos são formalmente ambíguos, mas o contexto favorece o sentido de que Jônatas amava Davi como a si mesmo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: fez
  rationale: A expressão idiomática כרת ברית significa literalmente «cortar uma aliança», mas «fazer uma aliança» comunica seu sentido de modo natural em português.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְדָוִד
  choice: com Davi
  rationale: Embora o hebraico tenha literalmente «e Davi», após o verbo singular a construção indica Davi como a outra parte da aliança; «com Davi» reproduz naturalmente essa relação sem transformar ambos em sujeito gramatical.
- source_word: בְּרִית
  choice: aliança
  rationale: Designa um compromisso formal e vinculante; «aliança» preserva melhor sua força solene e relacional do que «acordo».
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: porque o amava
  rationale: O בְּ pode ter valor causal ou circunstancial. Neste contexto, a formulação causal expressa naturalmente que a aliança se fundamentava no amor, mantendo em nota a ambiguidade formal dos pronomes.
- source_word: כְּנַפְשׁוֹ
  choice: como a si mesmo
  rationale: נֶפֶשׁ pode significar alma, vida ou a própria pessoa. Aqui, «como a si mesmo» comunica com clareza a intensidade do vínculo pessoal, sem sugerir uma oposição moderna entre corpo e alma.
theological_decisions:
- issue: Referente dos pronomes de terceira pessoa em בְּאַהֲבָתוֹ אֹתוֹ כְּנַפְשׁוֹ
  choice: Jônatas amava Davi como a si mesmo
  alternative: Davi amava Jônatas como a si mesmo; ou conservar na tradução uma formulação pronominal ambígua
  rationale: Os pronomes hebraicos são formalmente ambíguos quando considerados isoladamente, mas o contexto imediato, sobretudo 18:1, favorece fortemente Jônatas como sujeito do amor e Davi como objeto. A nota reconhece a ambiguidade sem atribuir ao relacionamento uma caracterização teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. «Jônatas» e «Davi» seguem formas bíblicas portuguesas consolidadas. A expressão «como a si mesmo» privilegia clareza corrente, enquanto as notas preservam o idioma hebraico e a ambiguidade pronominal.
