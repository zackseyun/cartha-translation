  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
translation:
  language: pt
  text: Saul continuou a temer Davi ainda mais[a], e Saul foi inimigo de Davi todos os seus dias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Saul continuou a temer Davi ainda» ou «Saul temeu Davi ainda mais». A expressão hebraica combina a ideia de continuar ou acrescentar com «temer», e עוֹד pode indicar continuação ou intensificação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o tempo todo». A expressão hebraica pode enfatizar hostilidade contínua, não necessariamente limitar-se de modo estrito à duração da vida de Saul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא
  choice: passou a temer
  rationale: A construção יָסַף com infinitivo indica continuação ou intensificação da ação. Em combinação com עוֹד e com o contexto narrativo, «passou a temer ... ainda mais» expressa com naturalidade a escalada do temor.
- source_word: מִפְּנֵי דָוִד
  choice: Davi
  rationale: Com ירא, a expressão literalmente ligada à face ou presença de alguém funciona de modo idiomático para indicar a pessoa temida; «temer Davi» é a forma natural em português.
- source_word: עוֹד
  choice: ainda mais
  rationale: Aqui עוֹד pode indicar continuidade ou aumento. O contexto favorece intensificação, mas a nota preserva a leitura possível de continuidade.
- source_word: וַיְהִי שָׁאוּל אֹיֵב אֶת דָּוִד
  choice: foi inimigo de Davi
  rationale: A formulação mantém Saul como sujeito e traduz diretamente אֹיֵב, sem decidir além do necessário se o verbo descreve estado ou mudança de estado.
- source_word: כָּל הַיָּמִים
  choice: por todos os seus dias
  rationale: A expressão hebraica indica duração contínua e pode ser entendida como «todos os seus dias» ou «o tempo todo». A redação principal conserva a forma temporal concreta, e a nota registra a alternativa.
