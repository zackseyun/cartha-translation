base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/013.yaml
  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: pt
  text: Então Saul o afastou de sua presença e o nomeou comandante de mil homens. Ele saía e entrava diante do povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “saía e entrava”, expressão que pode indicar o desempenho de atividades públicas ou militares, possivelmente com o sentido de liderar o povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: o afastou
  rationale: A forma causativa de סוּר indica remover ou afastar alguém. “O afastou” conserva a ação concreta sem explicitar um motivo não declarado.
- source_word: מֵעִמּוֹ
  choice: de sua presença
  rationale: A expressão significa literalmente “de junto de si”. “De sua presença” é natural em português e preserva o contexto relacional e cortesão.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: o nomeou
  rationale: Neste contexto, שׂוּם com objeto indireto descreve a designação para uma função oficial; “nomeou” comunica isso com clareza.
- source_word: שַׂר אָלֶף
  choice: comandante de mil homens
  rationale: שַׂר designa um chefe ou comandante. A inclusão de “homens” torna explícita em português a unidade militar subentendida, sem alterar o sentido.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: saía e entrava
  rationale: Mantém as duas ações do hebraico e o valor contextual de atividade habitual, sem reduzir o possível idioma exclusivamente a campanhas militares ou liderança.
- source_word: לִפְנֵי הָעָם
  choice: diante do povo
  rationale: Reproduz de modo natural a expressão hebraica, preservando sua possível referência tanto à visibilidade pública quanto à liderança.
