  naturalness: O texto revisto é moderno, claro e adequado ao registro narrativo-poético. «Cantavam em resposta e diziam» soa natural em português e evita explicitar como fato que as mulheres respondiam umas às outras, embora essa leitura permaneça indicada em nota.
  terminology: «Saul», «Davi», «milhares» e «dezenas de milhares» estão corretos e preservam o contraste poético. «Celebravam» continua sendo uma opção ampla e natural para מְשַׂחֲקוֹת.
