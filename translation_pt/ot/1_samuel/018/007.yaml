  text: וַֽ/תַּעֲנֶ֛ינָה הַ/נָּשִׁ֥ים הַֽ/מְשַׂחֲק֖וֹת וַ/תֹּאמַ֑רְןָ הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד בְּ/רִבְבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: pt
  text: 'As mulheres que celebravam[b] cantavam em resposta[a] e diziam: “Saul abateu os seus milhares[c], e Davi, as suas dezenas de milhares.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “respondiam”. No contexto, o sentido provavelmente é o de canto responsivo ou alternado.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode sugerir dança, folguedo ou diversão festiva.
    reason: lexical_alternative
  - marker: c
    text: Ou “feriu”. O verbo hebraico significa literalmente “feriu” e, aqui, tem sentido militar; também pode ser entendido como “matou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: cantavam em resposta umas às outras
  rationale: No contexto de canto festivo, ענה indica resposta vocal, provavelmente canto responsivo ou antifonal; a formulação explicita essa dinâmica sem impor uma estrutura musical mais específica.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: Tradução direta do substantivo plural feminino, preservando explicitamente as participantes.
- source_word: הַמְשַׂחֲקוֹת
  choice: que celebravam
  rationale: O particípio de שׂחק pode abranger diversão festiva, dança e folguedo; “celebravam” é natural e mantém essa amplitude sem especificar uma única atividade.
- source_word: וַתֹּאמַרְןָ
  choice: (introdução direta dos versos após dois-pontos)
  rationale: O sentido de “e diziam” fica naturalmente incorporado na construção portuguesa que introduz o refrão após o ato de cantar, evitando redundância sem perder a sequência narrativa.
- source_word: הִכָּה
  choice: derrotou
  rationale: Em contexto militar, נכה pode significar ferir, abater ou matar. “Derrotou” comunica o feito bélico sem decidir que cada integrante da contagem foi pessoalmente morto.
- source_word: באלפו
  choice: os seus milhares
  rationale: A preposição com o numeral funciona idiomaticamente como contagem de êxitos militares; o possessivo conserva o paralelismo poético.
- source_word: בְּרִבְבֹתָיו
  choice: as suas dezenas de milhares
  rationale: רבבה designa dez mil ou uma multidão dessa ordem; o plural é preservado como “dezenas de milhares”, em contraste com “milhares”.
theological_decisions:
- issue: Natureza da contagem militar atribuída a Saul e Davi
  choice: derrotou
  alternative: matou / abateu
  rationale: O hebraico emprega literalmente o verbo “ferir”, que no contexto pode implicar matar, mas não exige que a tradução resolva toda a contagem como mortes pessoais; “derrotou” preserva a força militar e evita sobre-especificação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem poética e o contraste numérico foram preservados; evitou-se o arcaísmo “miríades” e também uma especificação excessiva da celebração como apenas dança.
