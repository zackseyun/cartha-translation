base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/002.yaml
  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: pt
  text: Naquele dia, Saul levou Davi consigo e não permitiu que ele voltasse para a casa de seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não o deixou voltar”. O hebraico diz literalmente “não o deu para voltar”, empregando נתן de modo idiomático no sentido de dar permissão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: levou Davi consigo
  rationale: O verbo לקח significa literalmente “tomar” ou “levar”. Como o pronome retoma Davi no contexto imediato, explicitar o nome evita ambiguidade em português; “consigo” comunica naturalmente que Saul o reteve junto de si, sem inserir de modo explícito a interpretação “a seu serviço”.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Equivalente direto e natural da expressão temporal hebraica.
- source_word: וְלֹא נְתָנוֹ
  choice: e não permitiu que ele
  rationale: נתן seguido de infinitivo funciona aqui idiomaticamente com o sentido de permitir. Esta formulação comunica o sentido sem a construção artificial “não o deu para voltar”.
- source_word: לָשׁוּב
  choice: voltasse
  rationale: שׁוב significa “voltar/retornar”; o subjuntivo é exigido naturalmente em português após “não permitiu que”.
- source_word: בֵּית אָבִיו
  choice: para a casa de seu pai
  rationale: Preserva a expressão familiar hebraica de maneira clara e digna. No contexto, pode abranger tanto a residência quanto o lar paterno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O nome “Davi” foi explicitado a partir do referente contextual do pronome hebraico, e a expressão idiomática de permissão foi vertida de forma natural.
