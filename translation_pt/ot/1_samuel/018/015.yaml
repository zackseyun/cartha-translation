base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/015.yaml
  text: When Saul saw that he was very successful[b][a], he was afraid of him.
translation:
  language: pt
  text: Quando Saul viu que Davi era muito bem-sucedido[a], ficou com medo dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agia com muita sabedoria” ou “prosperava muito”. O verbo hebraico pode indicar uma conduta prudente e o sucesso que dela resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא שָׁאוּל
  choice: Quando Saul viu
  rationale: 'O wayyiqtol dá continuidade à narrativa e, em relação à oração seguinte, admite naturalmente valor temporal: a percepção de Saul antecede e provoca seu medo.'
- source_word: אֲשֶׁר הוּא
  choice: que Davi era
  rationale: A expressão introduz o conteúdo percebido por Saul. O referente pronominal é Davi; explicitar o nome em português evita uma sequência ambígua de pronomes sem alterar o sentido.
- source_word: מַשְׂכִּיל מְאֹד
  choice: muito bem-sucedido
  rationale: O particípio hifil de שׂכל pode descrever conduta prudente e também o êxito decorrente dela. Neste contexto, o sucesso observável de Davi é central, mas a nota preserva a amplitude lexical.
- source_word: וַיָּגָר מִפָּנָיו
  choice: ficou com medo dele
  rationale: גור neste contexto expressa temor, e מִפָּנָיו, literalmente 'diante dele/da presença dele', funciona idiomaticamente como o complemento da pessoa temida. A formulação é natural no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome “Davi” foi explicitado para evitar ambiguidade pronominal. A construção idiomática hebraica de medo foi vertida naturalmente, enquanto a ambiguidade de מַשְׂכִּיל foi preservada em nota.
