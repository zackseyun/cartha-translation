  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: pt
  text: 'Os servos de Saul lhe contaram: “Davi falou palavras como estas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: contaram
  rationale: O hifil de נגד significa contar, informar ou relatar; “contaram” é natural em português com o destinatário expresso por “lhe”.
- source_word: עַבְדֵי שָׁאוּל
  choice: os servos de Saul
  rationale: עבד pode designar servos, auxiliares ou oficiais; “servos” mantém a amplitude do termo sem especificar indevidamente a posição deles na corte.
- source_word: לוֹ
  choice: lhe
  rationale: O pronome retoma Saul e funciona naturalmente como objeto indireto de “contaram”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo do relato; em português atual, os dois-pontos cumprem essa função com mais naturalidade do que “dizendo”.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: mais ou menos assim
  rationale: A expressão significa literalmente “conforme/como estas palavras” e indica que os servos transmitiram o teor da resposta de Davi; esta formulação preserva o caráter aproximativo sem soar artificial.
- source_word: דִּבֶּר
  choice: falou
  rationale: “Falou” representa diretamente דבר e é idiomático na introdução do teor de uma fala.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
