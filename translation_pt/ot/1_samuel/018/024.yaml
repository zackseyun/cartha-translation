translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura brasileira. A construção “mais ou menos assim” comunica a aproximação presente em כַּדְּבָרִים הָאֵלֶּה sem exigir nota e sem resolver além do que o hebraico permite.
