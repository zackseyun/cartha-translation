  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: pt
  text: Saul viu e soube que Yahweh estava com Davi e que Mical, filha de Saul, o amava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva o sentido comum de ראה e, em sequência com וַיֵּדַע, mantém o avanço narrativo da observação para o reconhecimento.
- source_word: וַיֵּדַע
  choice: soube
  rationale: Representa o sentido básico de ידע e a certeza a que Saul chegou com base no que viu; a coordenação “viu e soube” reproduz de perto a progressão hebraica.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Saul soube.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִם
  choice: estava com
  rationale: Expressa naturalmente presença e associação, sem explicitar além do hebraico as ideias de apoio ou favor divino.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: e que Mical, filha de Saul,
  rationale: O segundo “que” é fornecido em português para deixar clara a coordenação dos dois conteúdos conhecidos por Saul. A aposição “filha de Saul” traduz naturalmente a construção hebraica.
- source_word: אֲהֵבַתְהוּ
  choice: o amava
  rationale: O particípio indica estado ou ação em curso; o pretérito imperfeito português comunica adequadamente que Mical continuava amando Davi.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino. “Yahweh” preserva-o como nome pessoal, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém a sequência enfática “viu e soube” do hebraico. Não se acrescentou nota sobre בַּת שָׁאוּל, pois “Mical, filha de Saul” é uma equivalência direta e natural em português, sem alternativa relevante que exija esclarecimento editorial.
