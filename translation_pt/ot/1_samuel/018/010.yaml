base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: pt
  text: No dia seguinte, um espírito mau da parte de Deus veio com força sobre Saul[a], e ele profetizou dentro da casa, enquanto Davi tocava música com a mão, como fazia todos os dias[c]; e a lança estava na mão de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito nocivo da parte de Deus”. Em hebraico, literalmente, “um espírito mau de Deus”.'
    reason: lexical_alternative
  - marker: c
    text: O instrumento não é mencionado neste versículo, embora seja identificado no contexto.
    reason: cross_reference
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Expressa de modo natural a sequência temporal indicada pelo hebraico.
- source_word: וַתִּצְלַח
  choice: apoderou-se violentamente de
  rationale: Com רוּחַ como sujeito, o verbo descreve uma irrupção forte e dominadora, não uma simples chegada.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: um espírito mau vindo de Deus
  rationale: Preserva tanto o valor comum de רָעָה como a procedência ou comissão divina expressa pelo hebraico, sem eliminar a tensão teológica.
- source_word: וַיִּתְנַבֵּא
  choice: entrou em estado profético
  rationale: Mantém a ligação lexical com profecia, mas permite que o contexto indique comportamento extático ou desordenado sem decidir que se tratava de profecia verdadeira.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: dentro de casa
  rationale: Tradução locativa corrente e clara.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: tocava música com a mão
  rationale: Mantém a referência explícita à mão e não acrescenta o nome do instrumento, ausente neste versículo.
- source_word: כְּיוֹם בְּיוֹם
  choice: como fazia todos os dias
  rationale: Reproduz de maneira natural o sentido habitual da expressão hebraica.
- source_word: הַחֲנִית בְּיַד שָׁאוּל
  choice: Saul segurava a lança na mão
  rationale: Português idiomático que conserva o detalhe ameaçador de a lança estar na mão de Saul.
theological_decisions:
- issue: A relação entre o espírito mau e Deus em רוּחַ אֱלֹהִים רָעָה
  choice: um espírito mau vindo de Deus
  alternative: um espírito nocivo da parte de Deus; um espírito mau de Deus
  rationale: A formulação conserva a agência ou procedência atribuída a Deus no relato, sem sugerir que a maldade seja uma qualidade moral do próprio Deus.
- issue: A natureza da ação descrita por וַיִּתְנַבֵּא
  choice: entrou em estado profético
  alternative: profetizou; delirou; entrou em frenesi profético
  rationale: O verbo pertence ao campo da profecia, mas o contexto pode indicar manifestação extática e perturbada. A tradução mantém essa ambiguidade em vez de reduzi-la a profecia autêntica ou mero delírio.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Evitou-se nomear o instrumento e procurou-se preservar a ambiguidade do verbo ligado à profecia e a tensão da procedência divina do espírito.
