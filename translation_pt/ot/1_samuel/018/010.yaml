revisions:
- from: No dia seguinte, um espírito mau vindo de Deus apoderou-se violentamente de Saul[a], e ele entrou em estado profético[b] dentro de casa, enquanto Davi tocava música com a mão[c], como fazia todos os dias. Saul segurava a lança na mão.
  to: No dia seguinte, um espírito mau da parte de Deus veio com força sobre Saul[a], e ele profetizou dentro da casa, enquanto Davi tocava música com a mão, como fazia todos os dias[c]; e a lança estava na mão de Saul.
