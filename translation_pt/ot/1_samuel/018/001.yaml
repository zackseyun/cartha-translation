id: 1SA.18.1
reference: 1 Samuel 18:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: pt
  text: E aconteceu que, quando ele acabou de falar com Saul, a alma de Jônatas ficou ligada à alma de Davi[a], e Jônatas o amou como à sua própria alma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: «foi atada à alma de Davi».'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete «alma» três vezes neste versículo: «a alma de Jônatas... a alma de Davi... sua própria alma».'
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: E aconteceu que, quando ele acabou de falar
  rationale: A construção narrativa com וַיְהִי seguida de כְּ + infinitivo situa o acontecimento ao término da fala. A formulação conserva a abertura hebraica sem recorrer ao arcaísmo «sucedeu».
- source_word: אֶל שָׁאוּל
  choice: com Saul
  rationale: Embora אֶל indique normalmente direção, em português «falar com Saul» é a expressão natural neste contexto e não altera o sentido de que Saul era o destinatário.
- source_word: נֶפֶשׁ
  choice: alma
  rationale: O substantivo aparece três vezes e descreve a pessoa ou o íntimo de alguém. «Alma» preserva tanto a repetição deliberada quanto a intensidade pessoal da ligação.
- source_word: נִקְשְׁרָה בְּנֶפֶשׁ דָּוִד
  choice: ficou ligada à alma de Davi
  rationale: O nifal de קשר apresenta a alma de Jônatas como ligada ou atada à de Davi. «Ficou ligada» mantém a metáfora e soa natural em português atual.
- source_word: וַיֶּאֱהָבוֹ יְהוֹנָתָן
  choice: e Jônatas o amou
  rationale: O sufixo de objeto masculino singular refere-se a Davi, e o sujeito expresso é Jônatas. A tradução direta evita acrescentar uma natureza específica ao amor.
- source_word: כְּנַפְשׁוֹ
  choice: como à sua própria alma
  rationale: A formulação conserva a terceira ocorrência de נֶפֶשׁ e a comparação explícita do hebraico. A crase assinala naturalmente em português o complemento de «amou» retomado pela comparação.
theological_decisions:
- issue: Natureza do amor de Jônatas por Davi
  choice: Manter a linguagem forte de ligação pessoal e amor, sem qualificá-la como erótica, romântica ou meramente política.
  alternative: Explicitar o vínculo como aliança política ou como amor romântico/sexual.
  rationale: נֶפֶשׁ e אהב comunicam profunda afeição e união pessoal, mas o versículo não define o vínculo por nenhuma dessas interpretações mais específicas. A tradução preserva a força e a abertura do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a repetição de «alma» e a metáfora hebraica da ligação, evitando tanto linguagem arcaica quanto explicações interpretativas inseridas no texto.
