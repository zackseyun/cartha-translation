  text: Daquele dia em diante, Saul passou a olhar Davi com desconfiança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Saul passou a vigiar Davi com inveja”; o termo hebraico pode indicar um olhar marcado por hostilidade, inveja ou suspeita.'
