lexical_decisions:
- source_word: וַיְהִי
  choice: passou a
  rationale: A construção narrativa com היה, ligada ao particípio/estado seguinte, introduz uma atitude contínua que começa nesse ponto; “passou a” expressa naturalmente esse aspecto em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עון
  choice: olhar ... com desconfiança
  rationale: A forma rara ou defectiva indica olhar de modo hostil, invejoso ou desconfiado. No contexto da irritação de Saul, a expressão não descreve um olhar neutro; “com desconfiança” comunica a vigilância hostil sem explicitar como certeza única a inveja.
- source_word: אֶת
  choice: —
  rationale: Marcador hebraico de objeto direto, não traduzido separadamente em português.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: Daquele dia em diante
  rationale: Expressão temporal idiomática que preserva tanto o ponto inicial quanto a continuidade da atitude de Saul.
