  text: וַ/יִּתְפַּשֵּׁ֣ט יְהוֹנָתָ֗ן אֶֽת הַ/מְּעִיל֙ אֲשֶׁ֣ר עָלָ֔י/ו וַֽ/יִּתְּנֵ֖/הוּ לְ/דָוִ֑ד וּ/מַדָּ֕י/ו וְ/עַד חַרְבּ֥/וֹ וְ/עַד קַשְׁתּ֖/וֹ וְ/עַד חֲגֹרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: pt
  text: Então Jônatas tirou o manto que vestia e o deu a Davi, junto com seus trajes militares[a], e até sua espada, seu arco e seu cinto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas vestes” ou “seu equipamento militar”. O termo hebraico pode indicar roupas, especialmente vestes oficiais ou militares.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: tirou
  rationale: O hitpael de פשט indica retirar de si uma peça de roupa. Em português, “tirou” expressa naturalmente a ação sem sugerir que Jônatas tenha ficado inteiramente despido.
- source_word: הַמְּעִיל
  choice: o manto
  rationale: מְעִיל designa uma veste exterior, possivelmente distintiva de posição. “Manto” é claro, digno e adequado ao contexto narrativo.
- source_word: אֲשֶׁר עָלָיו
  choice: que vestia
  rationale: A oração identifica o manto que estava sobre Jônatas. “Que vestia” é idiomático e conserva o sentido do hebraico.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: e o deu a Davi
  rationale: A formulação direta preserva a sequência narrativa; o pronome retoma “o manto”.
- source_word: וּמַדָּיו
  choice: junto com seus trajes militares
  rationale: מַדִּים pode designar roupas ou vestes oficiais, especialmente de caráter militar. “Trajes militares” preserva melhor essa amplitude do que “armadura”, que poderia sugerir especificamente proteção corporal.
- source_word: וְעַד
  choice: e até
  rationale: O עַד repetido amplia enfaticamente a lista dos objetos entregues. Em português, um único “e até” introduz com naturalidade a progressão culminante.
- source_word: חַרְבּוֹ
  choice: sua espada
  rationale: Equivalente português direto e padrão para חֶרֶב neste contexto.
- source_word: קַשְׁתּוֹ
  choice: seu arco
  rationale: Equivalente português direto e padrão para קֶשֶׁת neste contexto.
- source_word: חֲגֹרוֹ
  choice: seu cinto
  rationale: חֲגוֹר designa algo usado ao redor da cintura. “Cinto” é moderno e claro, sem o arcaísmo de alternativas como “cinturão” quando entendido como peça genérica.
theological_decisions:
- issue: Significado narrativo dos presentes de Jônatas
  choice: Descrever a entrega dos objetos sem explicitar no texto principal seu possível simbolismo.
  alternative: Interpretar os presentes como reconhecimento de Davi enquanto futuro rei ou apenas como sinais de amizade pactual.
  rationale: O hebraico relata as ações concretas, mas não explica neste versículo o significado simbólico delas. A tradução mantém a tensão narrativa e deixa a interpretação para o contexto.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Jônatas” segue a forma bíblica portuguesa corrente; a sintaxe conserva a progressão enfática da enumeração hebraica sem rigidez excessiva.
