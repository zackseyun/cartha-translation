  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: pt
  text: Saul teve medo de Davi[a], porque Yahweh estava com ele e havia se afastado de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Saul temia Davi”. O hebraico diz literalmente: “Saul teve medo de diante de Davi”, uma expressão em que Davi é o objeto ou a causa do medo de Saul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: tinha medo
  rationale: O verbo ירא expressa temor. No contexto narrativo, “tinha medo” é natural em português moderno e descreve o estado contínuo de Saul.
- source_word: מִלִּפְנֵי
  choice: de
  rationale: A expressão significa literalmente “de diante de”, mas, com ירא e uma pessoa, indica o objeto ou a causa do medo. “Medo de Davi” comunica naturalmente o sentido.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão do medo de Saul e tem aqui claro valor causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Mantém a forma pronominal hebraica; no contexto, o referente natural é Davi.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: e havia se afastado de Saul
  rationale: סור pode indicar afastar-se, retirar-se ou partir. O mais-que-perfeito composto mostra que esse afastamento já constituía a situação que explicava o medo de Saul, sem acrescentar ao texto o Espírito ou o favor de Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Natureza do afastamento divino de Saul
  choice: Yahweh havia se afastado de Saul
  alternative: O Espírito de Yahweh havia se afastado de Saul; o favor de Yahweh havia deixado Saul
  rationale: Este versículo afirma apenas que Yahweh estava com Davi e havia se afastado de Saul. A tradução não importa formulações de passagens próximas nem reduz a afirmação à perda do favor, preservando sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tinha medo” soa mais corrente que “temia”, enquanto a nota registra a alternativa mais formal. A estrutura causal e os pronomes do hebraico foram preservados sem rigidez artificial.
