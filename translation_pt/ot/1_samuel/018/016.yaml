- from: Mas todo o Israel e Judá amavam Davi[a], porque ele saía e entrava à frente deles.
  to: Mas todo Israel e Judá amavam Davi, porque ele saía e entrava diante deles[a].
  rationale: A revisão preserva o texto principal formalmente próximo do hebraico e desloca a interpretação de liderança para uma nota ancorada no par verbal que comporta essa leitura. Também elimina uma alternativa lexical secundária que não é exigida pelo texto nem pela trilha de auditoria.
