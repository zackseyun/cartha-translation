  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: pt
  text: Mas todo Israel e Judá amavam Davi, porque ele saía e entrava diante deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele os conduzia para fora e os trazia para dentro”, isto é, atuava como líder público deles, especialmente em batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Mas todo o
  rationale: A conjunção liga o versículo por contraste ao temor e à hostilidade de Saul no contexto anterior; “Mas” explicita essa força discursiva, e “todo” preserva a abrangência de כָל.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: Israel e Judá
  rationale: Mantém diretamente a distinção entre Israel e Judá característica de Samuel, sem acrescentar explicação ao texto principal.
- source_word: אֹהֵב
  choice: amavam
  rationale: Embora o particípio esteja formalmente no singular, o sujeito composto designa os habitantes de Israel e Judá; o plural é exigido pelo português natural e comunica o estado contínuo no contexto narrativo.
- source_word: אֶת דָּוִד
  choice: Davi
  rationale: A partícula de objeto direto אֶת não recebe tradução; o nome é vertido em sua forma portuguesa consagrada.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão pela qual o povo amava Davi.
- source_word: הוּא
  choice: ele
  rationale: Preserva o pronome independente que funciona como sujeito explícito da expressão verbal seguinte.
- source_word: יוֹצֵא וָ/בָא
  choice: saía e entrava
  rationale: Preserva de modo transparente a expressão hebraica e seu aspecto habitual, sem inserir o objeto “os”, ausente no texto.
- source_word: לִ/פְנֵי/הֶם
  choice: à frente deles
  rationale: Comunica tanto a posição diante do povo quanto a possível nuance de liderança pública, de maneira natural em português.
