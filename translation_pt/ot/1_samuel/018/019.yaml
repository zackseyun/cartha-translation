base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: pt
  text: Mas, quando chegou o momento de dar Merabe, filha de Saul, a Davi, ela foi dada como esposa a Adriel, o meolatita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Mas, quando chegou o momento
  rationale: A construção introduz um novo acontecimento no relato e estabelece o momento em que se esperava cumprir a promessa; “mas” comunica naturalmente o contraste criado pelo desfecho inesperado.
- source_word: תֵּת
  choice: de dar
  rationale: O infinitivo de נתן, regido pela expressão temporal, conserva seu sentido direto e forma uma construção natural em português.
- source_word: אֶת מֵרַב בַּת שָׁאוּל
  choice: Merabe, filha de Saul
  rationale: A aposição identifica Merabe de modo claro e mantém a relação familiar expressa no hebraico.
- source_word: לְדָוִד
  choice: a Davi
  rationale: A preposição indica Davi como o destinatário pretendido no contexto do arranjo matrimonial.
- source_word: וְהִיא נִתְּנָה
  choice: ela foi dada
  rationale: A voz passiva preserva o foco hebraico em Merabe e no que lhe aconteceu, sem explicitar um agente não mencionado.
- source_word: לְעַדְרִיאֵל
  choice: a Adriel
  rationale: Transliteração portuguesa corrente do nome pessoal, com a preposição indicando o destinatário efetivo.
- source_word: הַמְּחֹלָתִי
  choice: o meolatita
  rationale: O gentílico hebraico é vertido por uma forma portuguesa transparente, identificando Adriel como natural ou pertencente a Meolá.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: Expressão idiomática e clara para a fórmula matrimonial hebraica, sem acrescentar detalhes ausentes do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. A tradução mantém a repetição de “dar/dada” do hebraico para destacar o contraste entre a intenção anunciada e o resultado efetivo.
