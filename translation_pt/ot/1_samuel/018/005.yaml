revisions:
- from: Davi saía para cumprir todas as missões que Saul lhe confiava e era bem-sucedido[a]. Por isso, Saul o colocou no comando dos homens de guerra. Isso foi bem recebido por todo o povo e também pelos servos de Saul.[b]
