  rationale: A revisão elimina explicitações desnecessárias de tarefa e causalidade, preserva a abrangência distributiva da ordem de Saul e adota para שׂכל uma tradução principal mais próxima do seu sentido lexical. Também mantém, em nota, tanto a ambiguidade do referente de «isso» quanto a alternativa semântica de êxito.
