base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: pt
  text: Davi ia aonde quer que Saul o enviasse e agia com sabedoria[a]. Então Saul o nomeou para comandar os homens de guerra, e isso foi bom aos olhos de todo o povo e também aos olhos dos servos de Saul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «prosperava» ou «tinha êxito». O verbo hebraico pode indicar tanto conduta sábia ou prudente quanto o sucesso decorrente dela.
    reason: lexical_alternative
  - marker: b
    text: Ou «isso agradou a todo o povo e também aos servos de Saul». O hebraico pode se referir ao próprio Davi, à sua nomeação ou a toda a situação descrita.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא דָוִד בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: Davi saía para cumprir todas as missões que Saul lhe confiava
  rationale: O imperfeito narrativo e a construção distributiva descrevem a atuação de Davi nas diversas incumbências dadas por Saul. A formulação comunica naturalmente em português o sentido contextual de sair a serviço, sem restringi-lo explicitamente a campanhas militares.
- source_word: יַשְׂכִּיל
  choice: era bem-sucedido
  rationale: No hifil, שׂכל pode expressar conduta prudente e o sucesso resultante. Neste contexto de missões e promoção, “era bem-sucedido” soa natural e preserva um sentido lexical legítimo; a alternativa ligada à prudência é registrada em nota.
- source_word: וַיְשִׂמֵהוּ שָׁאוּל עַל
  choice: Saul o colocou no comando de
  rationale: שׂים com עַל indica aqui colocar alguém sobre outros, isto é, conferir-lhe autoridade. “Colocou no comando” expressa claramente essa função administrativa e militar.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Tradução próxima da expressão hebraica, preservando seu caráter militar e sua forma coletiva masculina em registro digno e compreensível.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Isso foi bem recebido por
  rationale: 'A expressão idiomática significa ser bom ou agradável aos olhos de alguém. “Foi bem recebido” é português corrente e mantém deliberadamente amplo o referente de “isso”: Davi, sua nomeação ou toda a situação descrita.'
- source_word: עַבְדֵי שָׁאוּל
  choice: servos de Saul
  rationale: “Servos” traduz diretamente עֲבָדִים e pode abranger auxiliares, cortesãos e oficiais de Saul sem estreitar indevidamente o termo.
