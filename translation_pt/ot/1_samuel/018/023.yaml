revisions:
- from: 'Então os servos de Saul disseram essas palavras aos ouvidos de Davi, e Davi respondeu: “Parece pouco aos olhos de vocês tornar-se genro do rei, sendo eu um homem pobre e de pouca importância?”'
  to: 'Então os servos de Saul falaram essas palavras de modo que Davi as ouvisse, e Davi respondeu: “Vocês consideram pouca coisa tornar-se genro do rei, sendo eu um homem pobre e de pouca importância?”'
  rationale: A revisão substitui um decalque idiomático por uma formulação portuguesa natural que preserva o sentido de que Davi ouviu as palavras. Também ajusta a pergunta retórica para maior fluência, mantendo a avaliação atribuída aos ouvintes e a ambiguidade circunstancial/contrastiva de “sendo eu”.
