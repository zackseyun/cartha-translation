review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a sequência narrativa, a pergunta retórica, a relação matrimonial com o rei e a autodescrição de Davi como pobre e socialmente pouco considerado. Contudo, “aos ouvidos de Davi” é um decalque pouco natural em português e pode sugerir fala ao pé do ouvido, não simplesmente que Davi ouviu as palavras.
  naturalness: “Disseram essas palavras aos ouvidos de Davi” soa pouco idiomático no português moderno. “Falaram essas palavras de modo que Davi as ouvisse” preserva com clareza a força do idiomatismo hebraico. A pergunta também flui melhor com “Vocês consideram pouca coisa...?”, mantendo sua força retórica.
  terminology: “Genro do rei”, “homem pobre” e “de pouca importância” são escolhas claras, fiéis ao contexto e adequadas ao registro. Não há questão teológica ou de nomes próprios.
  issues:
  - severity: low
    issue: “Aos ouvidos de Davi” é uma reprodução pouco idiomática do hebraico.
    rationale: Em português, a expressão pode evocar fala sussurrada ou muito próxima. O hebraico בְּאָזְנֵי דָוִד significa que os servos falaram de forma que Davi ouvisse.
  - severity: low
    issue: A formulação “Parece pouco aos olhos de vocês tornar-se...” é menos natural do que uma pergunta com sujeito explícito.
    rationale: A revisão torna a pergunta retórica mais direta em português sem alterar a perspectiva avaliativa expressa por “aos olhos de vocês”.
  revised_text: 'Então os servos de Saul falaram essas palavras de modo que Davi as ouvisse, e Davi respondeu: “Vocês consideram pouca coisa tornar-se genro do rei, sendo eu um homem pobre e de pouca importância?”'
