base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: pt
  text: 'Então os servos de Saul falaram essas palavras de modo que Davi as ouvisse, e Davi respondeu: “Vocês consideram pouca coisa tornar-se genro do rei, sendo eu um homem pobre e de pouca importância?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: disseram
  rationale: Em contexto narrativo, דבר descreve o ato de comunicar; “disseram” é natural em português com o objeto “essas palavras” e não acrescenta formalidade indevida.
- source_word: בְּאָזְנֵי דָוִד
  choice: aos ouvidos de Davi
  rationale: Mantém de modo inteligível a imagem idiomática hebraica e indica que as palavras foram dirigidas a Davi de forma que ele as ouvisse.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: Equivalente direto e natural no contexto de uma mensagem verbal previamente especificada.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: Parece pouco aos olhos de vocês
  rationale: Preserva tanto a pergunta retórica quanto as imagens de leveza/pequenez e de avaliação “aos olhos” dos interlocutores.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: tornar-se genro do rei
  rationale: No contexto, o hitpael de חתן designa entrar em relação matrimonial com o rei mediante o casamento com sua filha; a formulação explicita naturalmente a relação pretendida.
- source_word: וְאָנֹכִי
  choice: sendo eu
  rationale: Expressa a circunstância contrastante que fundamenta a hesitação de Davi sem impor exclusivamente uma relação causal.
- source_word: אִישׁ רָשׁ
  choice: um homem pobre
  rationale: Tradução direta da autodescrição econômica e social de Davi, mantendo a referência masculina específica.
- source_word: וְנִקְלֶה
  choice: e de pouca importância
  rationale: Comunica baixa consideração ou posição social sem intensificar o termo até “desprezado”; também conserva a relação semântica com “parece pouco” na pergunta anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “aos ouvidos de Davi” conserva a imagem hebraica sem causar obscuridade; “vocês” oferece leitura natural e internacionalmente inteligível. A ambiguidade entre circunstância, contraste e causa em וְאָנֹכִי é preservada por “sendo eu”.
