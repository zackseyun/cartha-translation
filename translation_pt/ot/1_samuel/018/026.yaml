base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: pt
  text: Então os servos de Saul transmitiram a Davi essas palavras, e Davi achou boa a proposta de se tornar genro do rei. E o prazo ainda não havia terminado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ עֲבָדָיו לְדָוִד
  choice: os servos de Saul transmitiram a Davi
  rationale: O referente de עֲבָדָיו é Saul no contexto. Explicitar o nome evita ambiguidade em português; o hifil de נגד significa comunicar ou dar a conhecer.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: דברים pode designar palavras ou assuntos; aqui se trata da mensagem verbal transmitida pelos servos.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: Davi achou boa a proposta
  rationale: A expressão idiomática indica que a questão pareceu boa ou aceitável a Davi. Esta formulação comunica naturalmente o sentido em português sem sugerir necessariamente uma avaliação moral.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: de se tornar genro do rei
  rationale: No contexto narrativo, o hitpael de חתן descreve Davi entrando em relação matrimonial com a casa real, especificamente tornando-se genro de Saul.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: E o prazo ainda não havia terminado
  rationale: Literalmente, os dias ainda não se haviam completado. No contexto, a expressão se refere ao período estabelecido, e 'o prazo ainda não havia terminado' expressa isso com clareza e naturalidade.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A tradução favorece equivalência ótima: preserva o conteúdo da expressão hebraica, mas verte os idiomas de modo natural. A conjunção final foi mantida como nova oração para conservar a progressão narrativa sem produzir uma frase excessivamente longa.'
