- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: e os dois filhos de Eli
  rationale: O contexto identifica filhos específicos e conhecidos de Eli; o artigo definido em português comunica essa especificidade.
- source_word: מֵתוּ
  choice: morreram
  rationale: Traduz diretamente o perfeito qal de מות sem acrescentar imagens ou circunstâncias não expressas.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni e Fineias
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecíveis dos nomes, preservando sua função apositiva.
