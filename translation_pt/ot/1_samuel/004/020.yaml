revisions:
- from: 'Quando ela estava para morrer, as mulheres que estavam ao seu lado lhe disseram: “Não tenha medo, pois você deu à luz um filho”. Mas ela não respondeu nem levou isso a sério.[a]'
  to: 'Quando ela estava morrendo, as mulheres que estavam ao lado dela lhe disseram: “Não tenha medo, pois você deu à luz um filho.” Mas ela não respondeu nem deu atenção ao que lhe disseram.[a]'
  rationale: A revisão substitui uma expressão que sugere “não considerar algo sério” pela expressão idiomática “não deu atenção”, que comunica o sentido de não pôr o coração/mente no que as mulheres disseram. Também ajusta o enquadramento temporal para indicar que ela estava no processo de morrer, preservando a cena narrada.
