base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: pt
  text: 'Quando ela estava morrendo, as mulheres que estavam ao lado dela lhe disseram: “Não tenha medo, pois você deu à luz um filho.” Mas ela não respondeu nem deu atenção ao que lhe disseram.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não pôs o coração nisso”; isto é, não deu atenção ao que lhe disseram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: Quando ela estava para morrer
  rationale: Expressa de modo natural o enquadramento temporal da expressão hebraica e deixa claro que as palavras foram ditas enquanto ela agonizava.
- source_word: וַתְּדַבֵּרְנָה
  choice: lhe disseram
  rationale: O feminino plural se refere às mulheres presentes, e “disseram” introduz naturalmente o discurso direto.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: as mulheres que estavam ao seu lado
  rationale: Preserva a imagem concreta de mulheres posicionadas junto dela, provavelmente prestando assistência, sem acrescentar uma função não explicitada.
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: Forma corrente e clara em português para a proibição hebraica, adequada à fala de consolo.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: pois você deu à luz um filho
  rationale: “Pois” mantém a relação explicativa, e “deu à luz” comunica com precisão e naturalidade o verbo no contexto do parto.
- source_word: וְלֹא עָנְתָה
  choice: ela não respondeu
  rationale: Tradução direta do verbo ענה no sentido de responder.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: nem levou isso a sério
  rationale: Reproduz o sentido idiomático de não dirigir o coração ou a atenção ao que foi dito; a nota conserva a imagem literal do coração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “estava para morrer” comunica a proximidade da morte sem sugerir que ela já tivesse morrido quando as mulheres falaram. O marcador da nota foi colocado junto à expressão que ele esclarece.
