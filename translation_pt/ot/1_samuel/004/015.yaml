  yaml_path: translation/ot/1_samuel/004/015.yaml
  text: Eli was ninety-eight years old[a], and his eyes were fixed so that he could not see.
translation:
  language: pt
  text: Eli tinha noventa e oito anos, e seus olhos estavam fixos[a], de modo que ele não conseguia enxergar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rígidos” ou “imóveis”; o hebraico descreve a condição dos olhos de Eli de uma forma que indica cegueira.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: tinha noventa e oito anos
  rationale: O idiomatismo hebraico literalmente diz “filho de noventa e oito anos”; em português corrente, a idade é expressa naturalmente com “tinha ... anos”.
- source_word: וְעֵינָיו
  choice: e seus olhos
  rationale: Tradução direta do substantivo plural com sufixo de terceira pessoa masculina singular; a conjunção liga esta informação à idade de Eli.
- source_word: קָמָה
  choice: estavam fixos
  rationale: Neste contexto, a forma de קום descreve os olhos como imóveis, rígidos ou fixos. A opção conserva a imagem concreta do hebraico sem substituí-la pela interpretação “fracos” ou “embaçados”.
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: de modo que ele não conseguia enxergar
  rationale: Expressa em português natural a incapacidade visual resultante da condição dos olhos. “Enxergar” é corrente e claro para leitores brasileiros, sem perda de dignidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O conectivo inicial não foi vertido por uma palavra como “Ora”, pois aqui funciona apenas como ligação narrativa. A formulação preserva a imagem incomum do hebraico e esclarece seu resultado sem apagar a alternativa lexical.
