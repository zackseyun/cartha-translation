base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: pt
  text: Sua nora, a esposa de Fineias, estava grávida e prestes a dar à luz. Quando ouviu a notícia de que a arca de Deus havia sido tomada[a] e de que seu sogro e seu marido estavam mortos[b], ela se curvou e deu à luz, pois as dores do parto vieram sobre ela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre a tomada da arca de Deus”. A construção hebraica pode indicar tanto o conteúdo da notícia quanto o assunto dela.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “haviam morrido”. A forma hebraica pode ser entendida como estado resultante (“estavam mortos”) ou como acontecimento anterior (“haviam morrido”).'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “suas dores se voltaram sobre ela”, expressão referente à chegada das dores do parto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: Sua nora
  rationale: כַּלָּה significa “nora” neste contexto. O possessivo retoma Eli no contexto anterior; o וְ inicial é absorvido naturalmente pela continuidade narrativa em português.
- source_word: אֵשֶׁת פִּינְחָס
  choice: a mulher de Fineias
  rationale: A expressão construta identifica a nora como esposa de Fineias. “A mulher de” é natural e digna em português bíblico contemporâneo.
- source_word: הָרָה לָלַת
  choice: estava grávida e prestes a dar à luz
  rationale: הָרָה expressa a gravidez, e לָלַת indica a iminência do parto; a tradução conserva ambos os elementos.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: Quando ouviu a notícia
  rationale: שְׁמוּעָה pode significar notícia ou relato. A oração temporal produz uma sequência narrativa natural sem alterar a relação dos acontecimentos.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: de que a arca de Deus havia sido tomada
  rationale: A construção introduz o conteúdo da notícia, e o infinitivo passivo indica que a arca foi tomada. O mais-que-perfeito composto marca adequadamente a anterioridade.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: e de que seu sogro e seu marido estavam mortos
  rationale: מֵת admite leitura de estado resultante (“estavam mortos”) ou de acontecimento anterior (“haviam morrido”). O texto principal preserva a forma predicativa compacta.
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: ela se curvou e deu à luz
  rationale: כרע descreve curvar-se, dobrar-se ou agachar-se; no contexto do parto, “se curvou” mantém a imagem corporal sem especificar indevidamente que ela caiu ou assumiu determinada posição.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: pois as dores do parto vieram sobre ela
  rationale: צִרֶיהָ refere-se às dores de parto. A formulação conserva algo da imagem hebraica de dores que se voltam ou sobrevêm sobre ela, permanecendo inteligível em português.
