base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: pt
  text: 'Quando Eli ouviu o som do clamor[a], disse: “Que barulho é esse?” E o homem se apressou, chegou e contou a Eli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos gritos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: som / barulho
  rationale: קוֹל designa de modo amplo som, voz ou ruído. Na primeira ocorrência, “som” combina naturalmente com “clamor”; na segunda, “barulho” evita uma repetição rígida e expressa o fenômeno audível sobre o qual Eli pergunta.
- source_word: הַצְּעָקָה
  choice: o clamor
  rationale: צְעָקָה indica um grito ou clamor, frequentemente motivado por aflição. “Clamor” preserva tanto a intensidade sonora quanto a carga emocional da reação da cidade.
- source_word: מֶה
  choice: O que significa
  rationale: A pergunta indaga a natureza ou causa do barulho. “O que significa esse barulho?” é português natural e comunica o sentido contextual sem transformar a pergunta em um simples pedido de identificação acústica.
- source_word: הֶהָמוֹן
  choice: barulho
  rationale: הָמוֹן pode indicar tumulto, agitação ou ruído coletivo. “Barulho” é claro e corrente; a nota registra alternativas que realçam mais explicitamente a agitação pública.
- source_word: וְהָאִישׁ
  choice: Então o homem
  rationale: O hebraico diz literalmente “e o homem”, referindo-se ao benjamita já mencionado. “Homem” evita inserir “mensageiro”, que aqui não está explícito, enquanto “então” dá fluidez à sequência narrativa.
- source_word: מִהַר
  choice: se apressou
  rationale: O verbo significa agir depressa ou apressar-se. “Se apressou” é uma formulação moderna, clara e fiel ao ritmo da narrativa.
- source_word: וַיָּבֹא
  choice: foi até Eli
  rationale: Embora o verbo seja literalmente “veio/chegou”, em português a perspectiva narrativa fica natural com “foi até Eli”, tornando explícito apenas o destino já dado pela sequência do texto.
- source_word: וַיַּגֵּד לְעֵלִי
  choice: lhe contou o que havia acontecido
  rationale: נגד no hifil significa contar, anunciar ou relatar. O objeto da comunicação está implícito no hebraico; “o que havia acontecido” o explicita de modo natural em português, sem determinar o conteúdo além do contexto.
- source_word: עֵלִי
  choice: Eli
  rationale: O nome próprio é transliterado segundo a forma portuguesa consagrada.
theological_decisions: []
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. A tradução mantém “o homem” em vez de interpretar como “o mensageiro” e usa encadeamento narrativo natural. O marcador [a] aparece imediatamente após o termo correspondente.
