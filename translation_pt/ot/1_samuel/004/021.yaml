  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: pt
  text: 'E ela deu ao menino o nome de Icabô[a], dizendo: “A glória se foi de Israel”, porque a arca de Deus havia sido tomada e por causa de seu sogro e de seu marido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Icabô soa como um nome formado por elementos hebraicos associados a “sem glória” ou, possivelmente, “onde está a glória?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: deu ao menino o nome de
  rationale: Em contexto de nomeação, קרא com ל indica dar um nome. A formulação é natural em português e deixa claro que נַעַר se refere ao menino recém-nascido.
- source_word: אִי כָבוֹד
  choice: Icabô
  rationale: O nome próprio é transliterado segundo a forma tradicional e reconhecível em português; sua possível composição hebraica é explicada em nota.
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: A glória se foi de Israel
  rationale: גלה expressa afastamento ou partida, podendo também evocar exílio. “Se foi” comunica naturalmente a perda sem tornar explícito aquilo que o hebraico deixa teologicamente aberto.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: porque a arca de Deus havia sido tomada
  rationale: Neste contexto, אֶל introduz a causa, e o infinitivo passivo הִלָּקַח indica que a arca fora tomada. O mais-que-perfeito composto expressa a anterioridade com clareza.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: e por causa de seu sogro e de seu marido
  rationale: O אֶל repetido continua a relação causal. אִישָׁהּ significa claramente “seu marido” neste contexto.
theological_decisions:
- issue: Sentido de “a glória” em relação a Israel
  choice: Manter “a glória” sem identificar explicitamente seu referente.
  alternative: “A glória de Deus se foi de Israel” ou “A honra se foi de Israel”.
  rationale: כָבוֹד pode envolver tanto a presença gloriosa de Deus, associada à arca, quanto a honra e a condição de Israel. A tradução preserva essa tensão do texto hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Icabô” segue a forma tradicional portuguesa. A sintaxe causal conserva a ligação entre o nome, a tomada da arca e as mortes do sogro e do marido.
