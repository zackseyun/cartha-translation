base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: pt
  text: Os filisteus se puseram em formação para enfrentar Israel, e a batalha se estendeu[a]. Israel foi derrotado diante dos filisteus, que abateram cerca de quatro mil homens nas linhas de batalha, no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e travou-se a batalha”. O verbo hebraico pode descrever tanto o começo do combate como sua expansão durante o confronto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: se puseram em formação
  rationale: Expressa o sentido militar de ערך, isto é, dispor as tropas para o combate, em português atual e claro.
- source_word: לִקְרַאת
  choice: para enfrentar
  rationale: Indica o movimento ao encontro da força adversária; no contexto bélico, “enfrentar” comunica naturalmente essa relação sem acrescentar conteúdo indevido.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: a batalha se estendeu
  rationale: Preserva a imagem incomum de נטש como desenvolvimento ou expansão do combate, sem reduzi-la silenciosamente ao início da batalha.
- source_word: וַיִּנָּגֶף
  choice: foi derrotado
  rationale: O nifal de נגף com לִפְנֵי descreve a derrota diante do inimigo; distingue o revés de Israel das mortes relatadas em seguida.
- source_word: לִפְנֵי
  choice: diante dos
  rationale: Mantém o conhecido idiomatismo hebraico militar, inteligível em português.
- source_word: וַיַּכּוּ
  choice: mataram
  rationale: No contexto da contagem de baixas em combate, נכה tem resultado letal. A forma verbal portuguesa retoma claramente os filisteus como sujeito.
- source_word: בַמַּעֲרָכָה
  choice: nas linhas de batalha
  rationale: מַעֲרָכָה designa a disposição ou formação de combate; o plural idiomático em português descreve as fileiras em que os homens lutavam.
- source_word: בַּשָּׂדֶה
  choice: em campo aberto
  rationale: Traduz o cenário do campo, em contraste implícito com cidade ou acampamento, com expressão militar natural em português.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: cerca de quatro mil homens
  rationale: כְּ marca aproximação numérica, e אִישׁ conta pessoas do sexo masculino, aqui combatentes pelo contexto.
