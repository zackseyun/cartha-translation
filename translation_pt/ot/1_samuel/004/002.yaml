  to: Os filisteus se puseram em formação para enfrentar Israel, e a batalha se estendeu[a]. Israel foi derrotado diante dos filisteus, que abateram cerca de quatro mil homens nas linhas de batalha, no campo.
  rationale: A revisão remove uma expansão interpretativa desnecessária de “campo” e adota “abateram” para refletir com maior precisão o verbo hebraico de ação militar. A ambiguidade lexical relativa ao desenvolvimento ou início da batalha continua indicada pela nota.
