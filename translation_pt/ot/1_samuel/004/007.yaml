base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: pt
  text: 'Os filisteus ficaram com medo[a], pois disseram: “Deus veio ao acampamento.” E disseram: “Ai de nós! Nada assim havia acontecido antes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um deus veio ao acampamento”. O substantivo hebraico tem forma plural, mas o verbo que o acompanha está no singular, favorecendo a tradução “Deus” no texto principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: ficaram com medo
  rationale: O wayyiqtol de ירא expressa a reação imediata dos filisteus; esta formulação é natural em português e preserva a força emocional.
- source_word: הַפְּלִשְׁתִּים
  choice: os filisteus
  rationale: Designação étnica tradicional e amplamente reconhecida em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do medo e mantém uma ligação narrativa clara e digna.
- source_word: אָמְרוּ
  choice: diziam
  rationale: No primeiro uso, o perfeito hebraico fornece a explicação do medo; o imperfeito português apresenta naturalmente o conteúdo que circulava entre eles.
- source_word: בָּא אֱלֹהִים
  choice: Deus entrou
  rationale: Embora אֱלֹהִים tenha forma morfológica plural, o verbo בָּא está no singular. O contexto indica movimento para dentro do acampamento, de modo que “entrou” é idiomático e preserva a concordância singular.
- source_word: אֶל הַמַּחֲנֶה
  choice: no acampamento
  rationale: Com o verbo “entrar”, a regência portuguesa “entrar no acampamento” comunica naturalmente o movimento para dentro.
- source_word: א֣וֹי לָנוּ
  choice: Ai de nós!
  rationale: Interjeição portuguesa corrente que conserva o tom de aflição e ameaça de ruína.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: Nunca aconteceu nada assim
  rationale: Equivalência idiomática clara para a afirmação de que não houvera ocorrência semelhante.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: antes
  rationale: A expressão funciona idiomaticamente como referência ao tempo anterior, não apenas aos dois dias precedentes.
theological_decisions:
- issue: Tradução de אֱלֹהִים na fala dos filisteus
  choice: Deus
  alternative: um deus
  rationale: O verbo singular בָּא favorece um referente singular, e o contexto aponta para o Deus de Israel. Como a fala vem de filisteus e אֱלֹהִים tem forma plural, a leitura “um deus” permanece em nota, sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ai de nós” preserva a solenidade do lamento sem arcaísmo excessivo; “acampamento” é a designação militar natural no contexto.
