  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become slaves to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: pt
  text: Sejam fortes e sejam homens, filisteus, para que não se tornem escravos dos hebreus, assim como eles foram escravos de vocês. Sejam homens e lutem!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: Sejam fortes
  rationale: O imperativo hitpael plural de חזק conclama os combatentes a demonstrarem força e coragem; “Sejam fortes” é direto, natural e mantém a forma da exortação.
- source_word: וִהְיוּ לַאֲנָשִׁים
  choice: sejam homens
  rationale: A expressão היה + לַאֲנָשִׁים é uma exortação idiomática à coragem masculina em contexto militar. A tradução preserva tanto a linguagem marcada por gênero quanto a força retórica do hebraico.
- source_word: פְּלִשְׁתִּים
  choice: filisteus
  rationale: Mantém o vocativo explícito e soa natural em português sem a necessidade do vocativo literário “ó”.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz o resultado indesejado contra o qual se faz a advertência; é uma formulação clara e corrente em português.
- source_word: תַּעַבְדוּ
  choice: se tornem escravos dos
  rationale: No contexto de derrota militar e sujeição política, עבד indica escravização ou submissão, e não mero serviço voluntário.
- source_word: לָעִבְרִים
  choice: dos hebreus
  rationale: Traduz literalmente עִבְרִים, designação usada no texto, sem harmonizá-la com “israelitas”.
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: assim como eles foram escravos de vocês
  rationale: Explicita a mesma relação de sujeição expressa pelo verbo עבד e evita qualquer dúvida sobre o sentido da comparação.
- source_word: וִהְיִיתֶם לַאֲנָשִׁים
  choice: Sejam homens
  rationale: Repete a mesma expressão para conservar a insistência e o paralelismo retórico do discurso hebraico.
- source_word: וְנִלְחַמְתֶּם
  choice: e lutem
  rationale: A forma verbal funciona como continuação imperativa da exortação; “lutem” é conciso e apropriado ao contexto de batalha.
theological_decisions:
- issue: Exortação marcada por gênero לַאֲנָשִׁים
  choice: sejam homens
  alternative: ajam como homens; mostrem que são homens; tenham coragem
  rationale: Os destinatários são guerreiros filisteus, e o hebraico formula deliberadamente a coragem em termos masculinos. Uma paráfrase neutra apagaria essa característica retórica do texto.
- issue: Sentido de עבד no contexto de subjugação militar
  choice: tornar-se escravos / ser escravos
  alternative: servir; ficar sujeitos
  rationale: A ameaça é a derrota acompanhada de sujeição, em contraste com a sujeição anterior dos hebreus aos filisteus. “Escravos” comunica de modo claro a gravidade dessa condição.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. A repetição “sejam homens” foi mantida para reproduzir a retórica enfática do original. Não se adotaram marcadores de nota porque nenhuma alternativa precisa ser registrada para preservar ambiguidade relevante neste versículo.
