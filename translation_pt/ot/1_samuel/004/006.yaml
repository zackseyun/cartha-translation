  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: pt
  text: 'Quando os filisteus ouviram o som da gritaria[a], disseram: “O que significa o som dessa grande gritaria no acampamento dos hebreus?” E ficaram sabendo que a arca de Yahweh[b] tinha chegado ao acampamento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “clamor”, “grito” ou, em contexto militar, “grito de guerra”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: divine_name
lexical_decisions:
- source_word: קוֹל
  choice: som
  rationale: Neste contexto, refere-se ao fenômeno audível produzido pela gritaria, não a uma voz individual. “Som” também permite conservar a repetição do hebraico.
- source_word: תְּרוּעָה
  choice: gritaria
  rationale: O termo pode indicar clamor, grito ou grito de guerra. Aqui descreve a forte manifestação coletiva dos israelitas quando a arca chega, sem exigir que seja entendida especificamente como sinal militar.
- source_word: מֶה
  choice: o que significa
  rationale: A pergunta busca identificar a natureza ou a causa do som. Esta formulação é natural em português e comunica a força contextual do interrogativo.
- source_word: הַגְּדוֹלָה
  choice: grande
  rationale: Preserva o sentido básico do adjetivo e, ligado a “gritaria”, expressa a grande intensidade do clamor.
- source_word: מַחֲנֶה
  choice: acampamento
  rationale: Designa o acampamento militar no cenário narrativo e funciona naturalmente nas duas ocorrências.
- source_word: הָעִבְרִים
  choice: os hebreus
  rationale: Mantém o etnônimo empregado pelos filisteus, preservando a perspectiva dos falantes em vez de normalizá-lo para “israelitas”.
- source_word: וַיֵּדְעוּ
  choice: ficaram sabendo
  rationale: 'A construção comunica a passagem para um novo estado de conhecimento: os filisteus receberam ou descobriram essa informação.'
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: “Arca” traduz אֲרוֹן, e “Yahweh” representa o nome divino יְהוָה em vez de substituí-lo por um título.
- source_word: בָּא
  choice: tinha chegado
  rationale: A ação já estava concluída quando os filisteus ficaram sabendo dela; o mais-que-perfeito composto torna essa relação temporal clara e natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio, enquanto “SENHOR” representa a tradição de substituição litúrgica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “som” e “gritaria” foi mantida para refletir a repetição enfática do hebraico, sem tornar a frase excessivamente literal. “Ficaram sabendo” é idiomático e conserva o sentido ingressivo do verbo.
