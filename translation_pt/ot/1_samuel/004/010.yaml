base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: pt
  text: Então os filisteus lutaram, e Israel foi derrotado; cada homem fugiu para a sua tenda[a]. A matança foi muito grande[b], e trinta mil soldados de infantaria de Israel caíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada homem fugiu para sua casa”. O hebraico diz literalmente “para a sua tenda”, expressão que também pode designar a moradia de alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “a derrota foi muito severa”. O hebraico diz “o golpe/a matança foi muito grande”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: os filisteus lutaram
  rationale: Traduz diretamente a ação militar e mantém a sequência narrativa de modo natural em português.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: Israel foi derrotado
  rationale: No contexto de batalha, נָגַף indica que Israel sofreu derrota; a formulação evita sugerir que todos foram mortos.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: cada homem fugiu para a sua tenda
  rationale: אִישׁ tem sentido distributivo, e 'tenda' conserva a imagem concreta do hebraico, embora também possa designar a moradia.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: A matança foi muito grande
  rationale: מַכָּה significa literalmente golpe, mas neste relato militar aponta para a mortandade confirmada pela contagem de baixas que segue.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: de Israel caíram
  rationale: '''Caíram'' preserva o uso marcial de נפל para os que morreram em combate.'
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: trinta mil soldados de infantaria
  rationale: רַגְלִי designa combatentes a pé; 'soldados de infantaria' é claro, atual e distingue esses homens de tropas montadas.
theological_decisions: []
