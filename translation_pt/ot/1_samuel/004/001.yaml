base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: pt
  text: E a palavra de Samuel chegou a todo Israel.[a] Então Israel saiu ao encontro dos filisteus para a batalha. Os israelitas acamparam em Ebenézer,[b] e os filisteus acamparam em Afeque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “A notícia sobre Samuel chegou a todo Israel”. O hebraico pode significar a palavra ou mensagem de Samuel; no contexto, provavelmente se refere à sua palavra profética.'
    reason: alternative_reading
  - marker: b
    text: Ebenézer significa “pedra de ajuda”. Aqui, a expressão funciona como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: E a palavra de Samuel chegou a todo o Israel
  rationale: Preserva o substantivo singular “palavra” e sua ligação provável com a palavra profética de Samuel no contexto anterior. “Chegou a” expressa em português natural que essa palavra alcançou o povo.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: Então Israel saiu
  rationale: Traduz diretamente o verbo יצא; “então” marca com naturalidade o avanço da narrativa sem atribuir à conjunção uma relação causal.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: ao encontro dos filisteus para a batalha
  rationale: “Ao encontro de” conserva o sentido de לקראת, enquanto “para a batalha” explicita o propósito militar expresso no hebraico.
- source_word: וַיַּחֲנוּ עַל הָאֶבֶן הָעֵזֶר
  choice: Os israelitas acamparam em Ebenézer
  rationale: O sujeito plural implícito é explicitado para evitar a possível leitura de que “Israel” se refere ao território. אֶבֶן הָעֵזֶר funciona aqui como topônimo.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: e os filisteus acamparam em Afeque
  rationale: Mantém a coordenação simples do hebraico e translitera o topônimo conforme sua forma tradicional em português.
theological_decisions:
- issue: Sentido de דְבַר שְׁמוּאֵל
  choice: a palavra de Samuel
  alternative: a notícia a respeito de Samuel
  rationale: O contexto de 1 Samuel 3 favorece a palavra ou mensagem profética de Samuel, mas a nota registra a possibilidade lexical alternativa sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “acamparam”, em vez do mais formal “se acamparam”, e mantém os nomes tradicionais Ebenézer e Afeque.
