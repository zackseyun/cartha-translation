base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: pt
  text: Quando a arca da aliança de Yahweh entrou no acampamento, todo Israel deu um grande brado, e a terra ressoou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra tremeu”. O verbo hebraico pode indicar tumulto, estrondo ou tremor; “ressoou” evita afirmar um terremoto onde o texto talvez descreva apenas a força do brado.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Quando ... entrou
  rationale: A construção narrativa introduz uma oração temporal. “Quando” comunica isso naturalmente, e “entrou” expressa o movimento para dentro do acampamento indicado por אֶל.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Mantém de modo claro a relação entre a arca, a aliança e o nome divino presente na cadeia construta hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הַמַּחֲנֶה
  choice: o acampamento
  rationale: É a forma corrente e precisa no contexto militar.
- source_word: וַיָּרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: deu um grande brado
  rationale: O verbo e o substantivo cognato intensificam a ideia de um clamor coletivo. “Deu um grande brado” preserva essa força sem especificá-lo indevidamente como grito de guerra ou aplauso.
- source_word: וַתֵּהֹם
  choice: ressoou
  rationale: O verbo pode descrever estrondo, tumulto ou tremor. “Ressoou” combina naturalmente com o efeito do grande brado e evita afirmar inequivocamente um terremoto.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a correspondência direta e mantém aberta a referência ao solo ou à terra em sentido mais amplo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o nome próprio divino; a transliteração “Yahweh” o preserva sem substituí-lo por um título.
- issue: Natureza da reação da terra
  choice: a terra ressoou
  alternative: a terra tremeu
  rationale: O hebraico admite tanto a ideia de estrondo ou tumulto quanto a de tremor. O texto principal evita decidir que houve necessariamente um abalo físico, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Brado” conserva a intensidade solene do contexto sem soar excessivamente técnico.
