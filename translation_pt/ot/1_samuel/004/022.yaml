  yaml_path: translation/ot/1_samuel/004/022.yaml
  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: pt
  text: 'E ela disse: “A glória se foi de Israel[a], porque a arca de Deus foi tomada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A glória partiu de Israel para o exílio”. O verbo hebraico pode transmitir a ideia de ir para o exílio ou de ser removido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois a arca de Deus foi tomada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ela disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “E ela disse” mantém a ligação com o contexto em português natural e digno.
- source_word: גָּלָה
  choice: se foi
  rationale: O verbo pode indicar partir, ser removido ou ir para o exílio. “Se foi” soa natural com “a glória” e preserva a ideia de afastamento sem impor uma formulação técnica.
- source_word: כָבוֹד
  choice: a glória
  rationale: No contexto, designa a honra e a presença manifesta associadas a Deus no meio de Israel, além de sustentar o tema do nome Icabô no relato próximo.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição מן indica separação ou afastamento; “de Israel” é a construção portuguesa mais natural.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da declaração, embora também possa ser vertido por “pois”.
- source_word: נִלְקַח
  choice: foi tomada
  rationale: O nifal de לקח é passivo. “Foi tomada” reproduz o sentido sem restringi-lo à interpretação mais específica de “capturada”.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz diretamente a construção hebraica e conserva uma expressão bíblica conhecida sem acrescentar terminologia ausente do texto.
theological_decisions:
- issue: O sentido da “glória” em relação a Israel e à arca
  choice: A tradução conserva “a glória” como referência teologicamente carregada à honra e à presença manifesta de Deus associadas ao seu povo.
  alternative: Entender a expressão apenas como a honra nacional de Israel ou identificar a glória de modo absoluto com o próprio Deus deixando Israel.
  rationale: O contexto vincula a declaração à tomada da arca, mas não formula uma doutrina metafísica sobre a presença de Deus nela. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A formulação é concisa e solene, preservando a ambiguidade lexical e a tensão teológica do hebraico.
