  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: pt
  text: 'Quando o povo entrou no acampamento, os anciãos de Israel disseram: “Por que Yahweh nos derrotou hoje diante dos filisteus? Vamos trazer de Siló para cá a arca da aliança de Yahweh, para que ela venha para o nosso meio e nos salve das mãos dos nossos inimigos”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que ele venha para o nosso meio e nos salve”, entendendo os verbos no singular como referência mais direta a Yahweh, cuja presença estava associada à arca.'
    reason: Leitura alternativa do referente dos verbos singulares.
lexical_decisions:
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o termo hebraico comum e, no contexto do acampamento e da batalha, deixa claro que se trata da força israelita sem explicitar além do texto.
- source_word: הַמַּחֲנֶה
  choice: o acampamento
  rationale: Equivalente natural e preciso no contexto militar.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Designação tradicional e clara para os líderes reconhecidos de Israel.
- source_word: נְגָפָנוּ
  choice: nos derrotou
  rationale: No contexto bélico, o verbo indica que Yahweh fez Israel sofrer derrota. A formulação é natural em português e mantém explícita a agência divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, em vez de substituí-lo por um título.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: diante dos filisteus
  rationale: Conserva a imagem da preposição hebraica e comunica a derrota ocorrida perante o exército filisteu.
- source_word: נִקְחָה אֵלֵינוּ מִשִּׁלֹה
  choice: Vamos trazer de Siló para cá
  rationale: Expressa naturalmente a proposta cohortativa e o movimento da arca de Siló até o acampamento israelita.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Reflete a cadeia construta hebraica e preserva a associação da arca com a aliança de Yahweh.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: para que ela venha para o nosso meio
  rationale: A arca é o antecedente gramatical imediato dos verbos no singular; o pronome feminino concorda naturalmente com “arca” em português.
- source_word: וְיֹשִׁעֵנוּ
  choice: e nos salve
  rationale: Traduz o sentido causativo de livrar ou salvar sem reduzi-lo apenas à ideia de vitória militar.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: das mãos dos nossos inimigos
  rationale: Mantém o idioma hebraico da mão como símbolo de poder ou domínio, em forma corrente no português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome próprio divino; a transliteração o preserva, sem substituí-lo por um título.
- issue: Referente dos verbos singulares וְיָבֹא e וְיֹשִׁעֵנוּ
  choice: “ela”, referindo-se gramaticalmente à arca
  alternative: “ele”, referindo-se mais diretamente a Yahweh
  rationale: A arca é o antecedente gramatical imediato, mas a forma hebraica também permite perceber Yahweh, cuja presença estava associada à arca, como agente de salvação. A nota preserva essa tensão sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Voltou ao acampamento” explicita pelo contexto narrativo o retorno após a batalha; “vamos trazer ... para cá” evita uma construção reflexiva pouco natural. A nota foi colocada após a fala inteira porque se refere às duas formas verbais no final da frase.
