source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: pt
  text: E aconteceu que, quando o mensageiro mencionou a arca de Deus, Eli caiu para trás de seu assento junto ao portão[a]. Ele quebrou o pescoço e morreu, pois era velho e pesado[b]. Ele havia julgado Israel durante quarenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao lado do portão”. A expressão hebraica diz literalmente “junto à mão do portão”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente “pesado”. O termo pode indicar que o peso de Eli, somado à sua idade, contribuiu para que a queda fosse fatal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: quando o mensageiro mencionou
  rationale: O hifil de זכר significa aqui “mencionar”. O sujeito pronominal é esclarecido pelo contexto imediato como o mensageiro, evitando ambiguidade artificial em português.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz naturalmente a construção hebraica e a terminologia estabelecida na narrativa.
- source_word: וַיִּפֹּל מֵעַל הַכִּסֵּא אֲחֹרַנִּית
  choice: caiu para trás, de seu assento
  rationale: אֲחֹרַנִּית indica a direção “para trás”, e מֵעַל marca a queda desde o assento. “Seu” é uma explicitação contextual natural.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: junto ao portão
  rationale: Expressa em português corrente a localização indicada pelo idioma hebraico, literalmente relacionado à “mão/lateral do portão”, sem impor precisão espacial ausente no texto.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: Seu pescoço se quebrou
  rationale: מַפְרֶקֶת designa o pescoço ou a nuca; a formulação comunica de modo direto e digno o ferimento fatal.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: pois era velho e pesado
  rationale: Preserva כָבֵד em seu sentido concreto de “pesado”, sem interpretar além do texto como “obeso” ou “acima do peso”.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: havia julgado Israel
  rationale: O mais-que-perfeito composto apresenta retrospectivamente o período concluído de Eli como juiz, preservando o sentido institucional do verbo שׁפט.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: Tradução direta da duração temporal, com “durante” natural em português.
theological_decisions:
- issue: Sentido de אֱלֹהִים em אֲרוֹן הָאֱלֹהִים
  choice: Deus
  alternative: os deuses
  rationale: No contexto narrativo, a expressão se refere inequivocamente ao Deus de Israel; portanto, o singular “Deus” é exigido pelo referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em frases reduz o encadeamento hebraico sem perder sua sequência narrativa. “Portão” representa uma entrada urbana ou estrutural de grandes dimensões melhor que “porta”; “julgar Israel” mantém a função tradicional de juiz sem convertê-la interpretativamente em mera liderança.
