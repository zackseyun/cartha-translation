  text: וַ/יַּ֨עַן הַֽ/מְבַשֵּׂ֜ר וַ/יֹּ֗אמֶר נָ֤ס יִשְׂרָאֵל֙ לִ/פְנֵ֣י פְלִשְׁתִּ֔ים וְ/גַ֛ם מַגֵּפָ֥ה גְדוֹלָ֖ה הָיְתָ֣ה בָ/עָ֑ם וְ/גַם שְׁנֵ֨י בָנֶ֜י/ךָ מֵ֗תוּ חָפְנִי֙ וּ/פִ֣ינְחָ֔ס וַ/אֲר֥וֹן הָ/אֱלֹהִ֖ים נִלְקָֽחָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: pt
  text: 'O mensageiro respondeu: “Israel fugiu diante dos filisteus, e houve também uma grande matança entre o povo[a]. Além disso, seus dois filhos, Hofni e Fineias, morreram, e a arca de Deus foi tomada[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “houve uma grande derrota entre o povo”. O termo hebraico pode indicar um golpe severo, uma praga ou uma matança; aqui, o contexto de batalha favorece “matança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a arca de Deus foi capturada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: o mensageiro
  rationale: O particípio designa aquele que traz a notícia; “mensageiro” é claro, natural e adequado ao contexto narrativo.
- source_word: נָס
  choice: fugiu
  rationale: Traduz diretamente o verbo “fugir” sem acrescentar a ideia interpretativa de que Israel foi posto em debandada.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: diante dos filisteus
  rationale: Reproduz o idioma hebraico para a retirada perante um inimigo e é compreensível em português.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: uma grande matança
  rationale: O substantivo pode indicar golpe, praga, derrota ou matança; no contexto de batalha, “matança” comunica naturalmente a grande perda de vidas.
- source_word: בָעָם
  choice: entre o povo
  rationale: Mantém o termo hebraico “povo”, embora no contexto se refira aos israelitas que combateram.
- source_word: שְׁנֵי בָנֶיךָ
  choice: seus dois filhos
  rationale: Tradução direta que preserva a referência explícita aos dois filhos de Eli.
- source_word: מֵתוּ
  choice: morreram
  rationale: O perfeito relata o fato consumado; o pretérito perfeito é natural no relato do mensageiro.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni e Fineias
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecíveis dos nomes bíblicos.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Tradução direta da expressão hebraica, sem expandir a relação genitiva.
- source_word: נִלְקָחָה
  choice: foi tomada
  rationale: Preserva a voz passiva e o sentido básico de “tomar”; “foi capturada” é uma alternativa contextual possível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fórmula hebraica “respondeu e disse” foi condensada para “respondeu”, mais natural em português e sem perda de conteúdo narrativo. Os marcadores foram posicionados imediatamente após as expressões às quais se referem.
