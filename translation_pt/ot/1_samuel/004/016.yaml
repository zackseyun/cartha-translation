base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: pt
  text: 'O homem disse a Eli: “Eu sou aquele que veio da linha de batalha[a] e hoje fugi da linha de batalha”. Eli perguntou: “O que aconteceu, meu filho?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da batalha”, “das fileiras” ou “do acampamento”; o termo hebraico se refere a uma disposição militar ou formação de batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: O homem
  rationale: O hebraico usa o substantivo comum para “homem”, não um termo técnico para “mensageiro”; o contexto já deixa clara sua função.
- source_word: הַבָּא
  choice: aquele que veio
  rationale: O particípio com אָנֹכִי identifica o falante; como ele já chegou à presença de Eli, o pretérito é natural em português.
- source_word: מִן הַמַּעֲרָכָה
  choice: da linha de batalha
  rationale: מַעֲרָכָה designa uma formação ou disposição militar; “linha de batalha” preserva essa nuance melhor que o sentido genérico de “batalha”.
- source_word: נַסְתִּי
  choice: fugi
  rationale: O verbo נוּס expressa fuga. “Fugi” é direto e não acrescenta a ideia de êxito implicada por “escapei”.
- source_word: הַיּוֹם
  choice: hoje mesmo
  rationale: “Hoje” é o sentido básico; “mesmo” dá naturalidade e ênfase temporal em português sem alterar a informação.
- source_word: מֶה הָיָה הַדָּבָר
  choice: O que aconteceu
  rationale: A expressão significa literalmente “qual foi a coisa/o fato?”, e a formulação escolhida comunica de modo idiomático o pedido de Eli por notícias.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva o sufixo possessivo e o tom afetuoso ou cortês de Eli ao dirigir-se ao homem mais jovem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição hebraica de “linha de batalha” foi suavizada na segunda ocorrência com “de lá”, sem perda do referente; a mudança de falante foi explicitada por “Eli perguntou” para evitar ambiguidade em português.
