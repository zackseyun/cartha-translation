  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: pt
  text: Quando ele chegou, eis que Eli estava sentado no assento à beira da estrada[a], olhando atentamente, pois seu coração tremia por causa da arca de Deus. O homem veio dar a notícia na cidade, e a cidade inteira gritou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ao lado do caminho”; expressão hebraica que significa junto à estrada ou à beira dela.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Quando ele chegou
  rationale: A forma narrativa faz a ação avançar e introduz a cena encontrada pelo mensageiro; a construção temporal é natural em português sem alterar a sequência.
- source_word: וְהִנֵּה
  choice: '[não expresso separadamente]'
  rationale: O marcador apresenta vividamente a cena diante do mensageiro. Em português corrente, essa função é transmitida pela passagem direta de “Quando ele chegou” para a descrição de Eli; “eis que” seria possível, mas soaria mais marcado e menos natural aqui.
- source_word: יֹשֵׁב עַל הַכִּסֵּא
  choice: estava sentado na cadeira
  rationale: O particípio descreve a postura contínua de Eli. “Cadeira” comunica com clareza o objeto designado por כִּסֵּא neste contexto, sem sugerir necessariamente um trono.
- source_word: יַד דֶּרֶךְ
  choice: à beira da estrada
  rationale: A expressão idiomática, literalmente associada ao “lado” ou à “mão” do caminho, indica uma posição junto à estrada.
- source_word: מְצַפֶּה
  choice: olhando atentamente
  rationale: O particípio de צפה expressa observação vigilante e expectativa. A formulação preserva a ideia de alguém que procura avistar notícias vindas pela estrada.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: pois seu coração tremia
  rationale: Mantém a imagem concreta e a intensidade emocional do hebraico, em vez de reduzi-la apenas a um estado psicológico abstrato.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: por causa da arca de Deus
  rationale: Com חָרֵד, a preposição assinala aquilo que provoca a apreensão de Eli. A expressão portuguesa deixa clara essa relação sem especificar além do texto.
- source_word: לְהַגִּיד בָּעִיר
  choice: entrou na cidade para dar a notícia
  rationale: O infinitivo indica o propósito de comunicar o ocorrido, e בָּעִיר situa a comunicação na cidade. “A notícia” explicita apenas o objeto subentendido pelo contexto imediato.
- source_word: וַתִּזְעַק כָּל הָעִיר
  choice: a cidade inteira soltou um grito
  rationale: זעק descreve um clamor de aflição ou alarme. A personificação coletiva do hebraico é preservada, assim como a ideia de um brado geral.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A imagem hebraica do coração que treme foi mantida; estruturas excessivamente literais ou arcaizantes foram evitadas.
