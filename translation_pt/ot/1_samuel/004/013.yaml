revisions:
- from: Quando ele chegou, Eli estava sentado na cadeira à beira da estrada[a], olhando atentamente, pois seu coração tremia por causa da arca de Deus. O homem entrou na cidade para dar a notícia, e a cidade inteira soltou um grito.
  to: Quando ele chegou, eis que Eli estava sentado no assento à beira da estrada[a], olhando atentamente, pois seu coração tremia por causa da arca de Deus. O homem veio dar a notícia na cidade, e a cidade inteira gritou.
  rationale: A revisão elimina a inferência de que o mensageiro entrou na cidade, preservando a localização do anúncio indicada pelo hebraico. “Eis que” recupera de modo natural a função discursiva de וְהִנֵּה, e “assento” mantém a neutralidade de כִּסֵּא. A nota continua corretamente ancorada na expressão locativa.
