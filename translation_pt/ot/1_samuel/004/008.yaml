base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: pt
  text: Ai de nós! Quem nos livrará da mão destes deuses poderosos? Estes são os deuses que feriram o Egito com toda praga no deserto[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “deste Deus poderoso”. Os filisteus falam em termos plurais, refletindo a maneira como entendiam a divindade de Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no deserto”. A expressão é difícil neste contexto, pois as pragas atingiram o Egito antes da jornada de Israel pelo deserto; a tradução mantém o Texto Massorético tal como está escrito.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: Ai de nós!
  rationale: Expressão portuguesa natural e solene para uma exclamação de aflição e desgraça iminente.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: Quem nos livrará
  rationale: O hifil de נצל significa livrar ou resgatar; o futuro preserva a forma verbal e a força retórica da pergunta.
- source_word: מִיַּ֛ד
  choice: das mãos
  rationale: Preserva a metáfora hebraica de mão como poder ou domínio; o plural concorda naturalmente em português com 'deuses'.
- source_word: הָאֱלֹהִ֥ים הָאַדִּירִ֖ים הָאֵ֑לֶּה
  choice: destes deuses poderosos
  rationale: O adjetivo e o demonstrativo plurais favorecem a leitura plural, coerente com a perspectiva politeísta dos filisteus; 'poderosos' comunica bem אַדִּירִים.
- source_word: אֵ֧לֶּה הֵ֣ם הָאֱלֹהִ֗ים
  choice: São estes os deuses
  rationale: Mantém de modo idiomático a identificação enfática do hebraico.
- source_word: הַמַּכִּ֧ים אֶת מִצְרַ֛יִם
  choice: que feriram o Egito
  rationale: O particípio funciona como oração relativa referente a atos passados; 'feriram' preserva a amplitude de נכה sem restringi-lo a um único tipo de ação.
- source_word: בְּכָל מַכָּ֖ה
  choice: com toda espécie de praga
  rationale: מַכָּה pode significar golpe ou praga; no contexto do êxodo, 'praga' é natural, e 'toda espécie de' expressa o alcance abrangente da construção.
- source_word: בַּמִּדְבָּֽר
  choice: no deserto
  rationale: Tradução corrente de מִדְבָּר em português; conserva a frase difícil do Texto Massorético sem harmonização.
theological_decisions:
- issue: Sentido de אֱלֹהִים na fala dos filisteus
  choice: deuses
  alternative: Deus; Deus(es)
  rationale: As formas plurais que acompanham אֱלֹהִים e a perspectiva dos falantes sustentam o plural. A tradução preserva a compreensão filisteia sem convertê-la silenciosamente em confissão monoteísta.
- issue: Localização das pragas em בַּמִּדְבָּר
  choice: no deserto
  alternative: omitir a expressão ou reinterpretá-la para harmonizar a narrativa
  rationale: O Texto Massorético traz explicitamente a expressão, apesar da dificuldade histórica e contextual; por isso ela é mantida e explicada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a fala alarmada dos filisteus, o plural teologicamente tenso e a dificuldade textual final.
