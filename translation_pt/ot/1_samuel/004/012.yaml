  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: pt
  text: Então um homem de Benjamim correu da linha de batalha[a] e chegou a Siló naquele mesmo dia, com as roupas rasgadas e terra sobre a cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da batalha” ou “das fileiras”; o termo hebraico se refere mais especificamente à formação de combate ou à linha de confronto.
    reason: lexical_alternative
  - marker: b
    text: Roupas rasgadas e terra sobre a cabeça eram sinais costumeiros de luto, aflição ou calamidade.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: correu
  rationale: O verbo רוץ indica movimento rápido; “correu” é direto e não acrescenta a ideia de fuga.
- source_word: אִישׁ בִּנְיָמִן
  choice: um homem de Benjamim
  rationale: Preserva de modo claro a identificação tribal expressa pela construção hebraica.
- source_word: מֵהַמַּעֲרָכָה
  choice: da linha de batalha
  rationale: מַעֲרָכָה designa aqui o dispositivo ou a linha de combate, mais especificamente que a batalha em sentido abstrato.
- source_word: וַיָּבֹא שִׁלֹה
  choice: chegou a Siló
  rationale: Expressa naturalmente em português o movimento até o destino indicado.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: Comunica a referência temporal e, no contexto narrativo, a chegada no próprio dia dos acontecimentos.
- source_word: וּמַדָּיו קְרֻעִים
  choice: com as roupas rasgadas
  rationale: מַדִּים refere-se às vestes, e o particípio de קרע descreve o estado delas; a formulação é atual e natural.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: e terra sobre a cabeça
  rationale: אֲדָמָה significa terra ou solo; “terra” mantém a precisão lexical sem substituí-la pelo termo mais específico “pó”.
