  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: pt
  text: Então o povo enviou a Siló, e eles trouxeram de lá a arca da aliança de Yahweh dos Exércitos[a], que está entronizado acima dos querubins.[b] Os dois filhos de Eli, Hofni e Fineias, estavam ali com a arca da aliança de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh das hostes”.'
    reason: Alternativa lexical para צְבָאוֹת, que pode designar exércitos ou hostes.
  - marker: b
    text: 'Também pode ser entendido como: “que está entronizado entre os querubins”.'
    reason: A expressão hebraica descreve a presença régia de Yahweh associada aos querubins, mas não explicita de modo inequívoco a relação espacial como “acima” ou “entre”.
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: Então o povo enviou alguns a Siló
  rationale: O hebraico não explicita o objeto de “enviou”, mas o contexto exige pessoas enviadas. “Alguns” torna a frase natural em português sem especificar que eram homens ou mensageiros.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: e eles trouxeram de lá
  rationale: נשא ressalta o ato de carregar; neste contexto, “trouxeram” comunica naturalmente o transporte da arca desde Siló até o acampamento.
- source_word: אֲרוֹן בְּרִית
  choice: a arca da aliança
  rationale: Expressão transparente e consagrada que preserva os dois elementos da construção hebraica.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino pessoal e traduz צְבָאוֹת por “Exércitos”, termo compreensível que conserva a imagem de forças organizadas, sem restringi-las explicitamente a exércitos terrenos ou celestiais.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: que está entronizado acima dos querubins
  rationale: No contexto cultual da arca, יֹשֵׁב expressa presença régia, não apenas o ato comum de sentar-se. “Acima” corresponde à imagem da presença divina associada à cobertura da arca sem impor “entre” ao texto hebraico.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: Os dois filhos de Eli
  rationale: Reprodução direta e natural da construção hebraica.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: com a arca da aliança de Deus
  rationale: “Com” preserva o sentido amplo de acompanhamento ou presença expresso por עִם, sem impor uma posição espacial mais específica.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni e Fineias
  rationale: Formas portuguesas reconhecíveis dos nomes próprios hebraicos.
theological_decisions:
- issue: Tradução do nome divino em יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh das hostes
  rationale: O texto contém o Tetragrama como nome próprio. “Yahweh” preserva esse nome, enquanto “dos Exércitos” mantém o título sem definir de modo excessivamente estreito a natureza das hostes.
- issue: Sentido da fórmula יֹשֵׁב הַכְּרֻבִים
  choice: que está entronizado acima dos querubins
  alternative: que está entronizado entre os querubins
  rationale: A formulação comunica a realeza e a presença divina ligadas à arca. “Acima” evita introduzir a localização mais específica “entre”, embora esta seja uma interpretação tradicional possível.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. Mantém “Yahweh” como nome divino, usa “arca da aliança” por transparência bíblica e conserva em nota a ambiguidade espacial da fórmula ligada aos querubins.
