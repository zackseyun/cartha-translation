  terminology: “Pecar”, “Deus”, “Yahweh”, “orar”, “interceder” e “a voz de seu pai” são escolhas adequadas. Mantém-se “Yahweh”, conforme a camada de consulta fornecida. A nota sobre אֱלֹהִים deve continuar a registrar a leitura alternativa “os juízes”.
