source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: pt
  text: Se um homem pecar contra outro homem, Deus julgará a causa dele[a]; mas, se um homem pecar contra Yahweh, quem orará por ele?[b] Eles, porém, não quiseram ouvir a voz de seu pai, porque Yahweh desejava matá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os juízes julgarão a causa dele”. O hebraico אֱלֹהִים também pode se referir a juízes humanos; no texto principal, “Deus” foi adotado porque o contraste com Yahweh favorece a referência divina.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “quem intercederá por ele?”. O verbo hebraico pode ter o sentido de orar ou interceder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: pecar
  rationale: Preserva a força moral e teológica usual de חטא, sem enfraquecê-la para uma formulação genérica como “fizer o mal”.
- source_word: אִישׁ לְאִישׁ
  choice: um homem ... outro homem
  rationale: Reproduz a forma masculina singular do hebraico e expressa com clareza a ofensa entre seres humanos.
- source_word: וּפִלְלוֹ
  choice: intervirá como árbitro em seu favor
  rationale: Comunica o sentido judicial e mediador do piel de פלל e mantém o valor benefactivo de לו, sem reduzir a ação apenas a uma condenação.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contraste com o pecado cometido contra Yahweh favorece aqui a referência divina, embora a leitura “juízes” seja possível e esteja registrada em nota.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: quem orará por ele?
  rationale: O hitpael de פלל pode indicar oração ou intercessão. “Orará por ele” é natural e preserva a pergunta retórica; “intercederá” consta em nota.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: Eles, porém, não quiseram ouvir a voz de seu pai
  rationale: “Não quiseram ouvir” expressa recusa, enquanto “a voz de seu pai” conserva a imagem do hebraico.
- source_word: כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: porque Yahweh desejava levá-los à morte
  rationale: “Desejava” preserva a afirmação forte de vontade divina em חפץ, e “levá-los à morte” reflete o valor causativo de מות no hiphil com formulação digna.
theological_decisions:
- issue: Sentido de אֱלֹהִים na primeira oração
  choice: Deus
  alternative: os juízes
  rationale: A contraposição com a ofensa contra Yahweh favorece a ideia de Deus como árbitro em um conflito humano. Como אֱלֹהִים também pode designar juízes humanos, a alternativa é preservada em nota.
- issue: A intenção divina em כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: Yahweh desejava levá-los à morte
  alternative: Yahweh havia decidido levá-los à morte
  rationale: A tradução mantém sem suavização a vontade divina afirmada pelo texto, mas evita transformar lexicalmente “desejava” em “havia decidido”, preservando a tensão entre o juízo divino e a recusa humana.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome divino foi transliterado como “Yahweh”, em consonância com a camada de consulta fornecida. A construção “intervirá como árbitro” torna explícita a dimensão judicial-mediadora do primeiro uso de פלל sem confundi-lo com o segundo uso, ligado à oração ou intercessão.
