revisions:
- from: 'Então um homem de Deus veio a Eli e lhe disse: “Assim diz o SENHOR: Acaso não me revelei claramente à família de seu pai, quando eles estavam no Egito, sujeitos à casa do faraó?”'
  to: 'Então um homem de Deus veio a Eli e lhe disse: “Assim diz o SENHOR: Será que não me revelei de fato à casa de teu pai, quando eles estavam no Egito, na casa do faraó?”'
  rationale: A revisão substitui uma explicitação semântica não marcada (“claramente”) por uma intensificação fiel (“de fato”) e evita resolver a construção final disputada como sujeição. Também preserva a referência direta a Eli e a ambiguidade ancestral do hebraico.
