base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: pt
  text: 'Então um homem de Deus veio a Eli e lhe disse: “Assim diz o SENHOR: Será que não me revelei de fato à casa de teu pai, quando eles estavam no Egito, na casa do faraó?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: homem de Deus
  rationale: Expressão profética tradicional e clara, correspondente direto do hebraico.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: Acaso não me revelei claramente
  rationale: A construção infinitivo absoluto + verbo finito intensifica a afirmação interrogativa; “claramente” comunica a ênfase sem tornar a frase artificial.
- source_word: בֵּית אָבִיךָ
  choice: família de seu pai
  rationale: Aqui “casa” designa linhagem ou família ancestral, não apenas uma residência.
- source_word: לְבֵית פַּרְעֹה
  choice: sujeitos à casa do faraó
  rationale: O לְ é semanticamente difícil neste contexto. A formulação preserva a relação dos antepassados de Eli com a casa real egípcia sem sugerir que fossem membros dela.
theological_decisions:
- issue: Identidade da “família de seu pai”
  choice: Manter a referência ancestral sem explicitar Arão ou Levi
  alternative: Traduzir ou explicar no texto como “família de Arão”
  rationale: Embora o contexto seguinte esclareça a linhagem sacerdotal, este versículo usa apenas “seu pai”; explicitar uma identidade resolveria no texto algo deixado implícito pelo hebraico.
- issue: Força da pergunta divina
  choice: “Acaso não me revelei claramente”
  alternative: “Eu de fato me revelei?”
  rationale: A partícula interrogativa e a construção enfática favorecem uma pergunta retórica que recorda um ato divino reconhecido, sem eliminar inteiramente a forma interrogativa.
translation_notes:
  register: Português moderno, digno e acessível, com “SENHOR” para o tetragrama. A ordem narrativa hebraica foi mantida de modo natural. “Faraó” aparece em minúscula por funcionar como título, conforme o uso corrente em português.
