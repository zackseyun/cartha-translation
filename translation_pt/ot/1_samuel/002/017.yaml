  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: pt
  text: Assim, o pecado dos jovens foi muito grave diante de Yahweh[a], pois os homens desprezaram a oferta de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica diz literalmente “diante da face de Yahweh”, modo idiomático de dizer “diante de Yahweh” ou “na presença de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “oferta” pode designar uma oferta em geral e, em alguns contextos, mais especificamente uma oferta de cereais.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: pecado
  rationale: Neste contexto, o substantivo designa a transgressão dos filhos de Eli, e não uma oferta pelo pecado.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: נַעַר pode designar um rapaz, jovem ou servidor. Aqui se refere aos filhos adultos de Eli; “os jovens” preserva o sentido sem sugerir crianças.
- source_word: גְּדוֹלָה מְאֹד
  choice: muito grave
  rationale: A expressão intensifica a avaliação do pecado. Em português, “muito grave” comunica naturalmente sua grande severidade moral.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão hebraica menciona literalmente a face de Yahweh, mas funciona idiomaticamente com o sentido de estar diante dele ou em sua presença.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da avaliação anterior; “pois” estabelece essa relação de maneira clara e digna.
- source_word: נִאֲצוּ
  choice: desprezavam
  rationale: O verbo expressa desprezo ou desdém. “Desprezavam” é direto, natural e lexicalmente preciso.
- source_word: הָאֲנָשִׁים
  choice: aqueles homens
  rationale: Retoma os jovens já mencionados. O demonstrativo torna a referência clara em português sem mudar sua identidade.
- source_word: מִנְחַת יְהוָה
  choice: a oferta de Yahweh
  rationale: מִנְחָה pode designar uma oferta em sentido amplo e, em certos contextos, especificamente uma oferta de cereais. O contexto recomenda o termo abrangente “oferta”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título e sem optar pela forma portuguesa adaptada “Javé”.
- issue: Natureza da transgressão descrita por חַטַּאת
  choice: pecado
  alternative: culpa; ofensa
  rationale: A referência é ao procedimento perverso dos filhos de Eli, não a uma oferta pelo pecado; “pecado” mantém a força moral e teológica do substantivo.
translation_notes:
  register: Português atual, claro e digno, com construção natural tanto para leitores brasileiros quanto para um público lusófono amplo. “Muito grave” evita o pouco idiomático “muito grande” aplicado a pecado, enquanto “aqueles homens” retoma com clareza os jovens mencionados.
