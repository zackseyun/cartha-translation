source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: pt
  text: 'Este será para você o sinal que sobrevirá a seus dois filhos[a], Hofni e Fineias: ambos morrerão em um só dia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que acontecerá a seus dois filhos”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em um dia”; isto é, os dois morrerão no mesmo dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: o sinal
  rationale: אוֹת designa com frequência um sinal que confirma uma palavra ou anúncio; “sinal” é claro, natural e preserva a função confirmatória sem a restringir.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: que sobrevirá a
  rationale: A formulação conserva a imagem hebraica de algo que vem sobre alguém e, em português, comunica naturalmente a chegada de um acontecimento grave.
- source_word: שְׁנֵי בָנֶיךָ
  choice: seus dois filhos
  rationale: Reproduz diretamente a construção hebraica e identifica os dois filhos de Eli.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: Hofni e Fineias
  rationale: O segundo אֶל especifica, em aposição, quem são os dois filhos; em português, os nomes seguem naturalmente a expressão anterior.
- source_word: בְּיוֹם אֶחָד
  choice: em um só dia
  rationale: Mantém a referência a um único dia e comunica de modo corrente que as duas mortes ocorrerão dentro desse mesmo dia.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: ambos morrerão
  rationale: 'Preserva a ênfase inclusiva do hebraico: nenhum dos dois filhos ficará de fora do juízo anunciado.'
theological_decisions:
- issue: Natureza do “sinal”
  choice: Um sinal confirmatório do juízo anunciado contra a casa de Eli
  alternative: Um simples presságio preditivo, sem função confirmatória
  rationale: No contexto, a morte dos dois filhos confirma que a palavra profética contra a casa de Eli se cumprirá. O texto mantém o termo amplo “sinal”, sem explicitar no corpo do versículo uma interpretação mais estreita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Sobrevirá” mantém a imagem do hebraico sem soar excessivamente arcaico; “em um só dia” torna clara a unidade temporal, enquanto a nota registra a forma mais literal.
