  source_fidelity: A tradução reproduz adequadamente o movimento de Elcana para Ramá e sua casa, o estado de serviço de Samuel a Yahweh e a relação expressa por «diante do sacerdote Eli». Contudo, «continuava servindo» introduz mais explicitamente a noção de continuação do que a construção hebraica היה + particípio exige; «estava servindo» preserva melhor o aspecto durativo sem essa inferência adicional.
  naturalness: O português é claro, moderno e de registro apropriado. «Estava servindo» é igualmente natural e mais estritamente equivalente. A duplicação «para Ramá, para sua casa» é justificável, pois reproduz os dois destinos coordenados do hebraico.
  terminology: «Yahweh», «sacerdote Eli» e «servindo» são escolhas consistentes e adequadas. A nota deve limitar-se à alternativa semântica de פני e não sugerir «supervisão», relação que o versículo não explicita.
