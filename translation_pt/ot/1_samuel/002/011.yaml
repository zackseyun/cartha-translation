    issue: «continuava servindo» explicita continuação.
    rationale: O particípio com היה apresenta ação em curso/durativa, mas não exige por si só a ideia adicional de que ela já vinha continuando antes do ponto narrativo.
  - severity: low
    issue: A nota introduz «sob a supervisão dele».
    rationale: Embora seja uma possível inferência contextual, a expressão hebraica significa literalmente presença/face e não afirma diretamente supervisão. A nota lexical deve preservar essa abertura.
