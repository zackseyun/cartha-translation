base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: pt
  text: Então Elcana foi para Ramá, para sua casa; e o menino estava servindo a Yahweh diante do sacerdote Eli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença do sacerdote Eli”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O verbo הלך descreve o deslocamento e faz a narrativa avançar. O contexto permite entender que Elcana voltou, mas o verbo não expressa por si só a ideia de retorno.
- source_word: הָרָמָתָה
  choice: para Ramá
  rationale: O hê direcional ligado ao nome do lugar indica movimento em direção a Ramá; “para Ramá” é a forma natural em português.
- source_word: עַל בֵּיתוֹ
  choice: para sua casa
  rationale: Neste uso idiomático, עַל בֵּיתוֹ indica o destino, a casa ou o lar de Elcana; uma tradução espacialmente literal seria enganosa em português.
- source_word: וְהַנַּעַר
  choice: e o menino
  rationale: נַעַר pode designar desde uma criança até um jovem. Nesta etapa da narrativa, Samuel ainda é apresentado como menino.
- source_word: הָיָה מְשָׁרֵת
  choice: continuava servindo
  rationale: A construção היה com particípio apresenta uma atividade contínua. “Continuava servindo” comunica com naturalidade que o serviço de Samuel prosseguia depois da partida de Elcana.
- source_word: אֶת יְהוָה
  choice: a Yahweh
  rationale: Com שׁרת, a partícula de objeto introduz aquele a quem Samuel servia. O nome divino é transliterado como “Yahweh”.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: diante do sacerdote Eli
  rationale: A expressão com פְּנֵי comunica presença ou proximidade pessoal. “Diante do sacerdote Eli” preserva esse valor sem transformar explicitamente a relação em supervisão hierárquica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Natureza do serviço de Samuel
  choice: servindo a Yahweh
  alternative: ministrando perante Yahweh
  rationale: O verbo שׁרת pode referir-se ao serviço no santuário, mas “servindo” mantém sua amplitude sem atribuir ao menino uma função sacerdotal que o versículo não declara explicitamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém a ordem narrativa e a distinção entre o serviço prestado a Yahweh e a presença de Eli. O marcador foi colocado junto à expressão que a nota esclarece.
