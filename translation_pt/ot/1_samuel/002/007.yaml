  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: pt
  text: Yahweh empobrece[a] e enriquece; rebaixa e também eleva[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faz perder” ou “despoja”; o verbo hebraico também pode ter o sentido mais amplo de causar perda ou despossessão.
    reason: lexical_alternative
  - marker: b
    text: Ou “exalta” ou “ergue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מוֹרִישׁ
  choice: empobrece
  rationale: No paralelismo antitético com “enriquece”, o hifil comunica causar pobreza; “empobrece” é natural e conserva a força causativa.
- source_word: וּמַעֲשִׁיר
  choice: e enriquece
  rationale: O hifil de עשׁר significa tornar rico; a formulação mantém o equilíbrio poético com “empobrece”.
- source_word: מַשְׁפִּיל
  choice: rebaixa
  rationale: Preserva a imagem vertical e o sentido de fazer alguém ficar em posição baixa, sem restringi-lo à humildade interior.
- source_word: אַף
  choice: também
  rationale: Expressa naturalmente a força aditiva e enfática da partícula neste contexto.
- source_word: מְרוֹמֵם
  choice: eleva
  rationale: Conserva a imagem vertical em oposição a “rebaixa” e pode abranger tanto levantar quanto exaltar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance da ação divina em מוֹרִישׁ
  choice: empobrece
  alternative: faz perder; despoja
  rationale: O paralelismo com “enriquece” favorece o sentido econômico, enquanto a nota conserva o campo semântico mais amplo do verbo.
translation_notes:
  register: Português moderno, claro e digno, com concisão poética. “Empobrece/enriquece” e “rebaixa/eleva” reproduzem os dois pares antitéticos do hebraico.
