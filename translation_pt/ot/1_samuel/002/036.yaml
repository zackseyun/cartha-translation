base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: pt
  text: 'E todos os que restarem da sua casa virão prostrar-se diante dele por uma pequena quantia de prata[a] e um pão, e dirão: “Inclui-me, por favor, em uma das funções sacerdotais[b], para que eu possa comer um pedaço de pão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por uma pequena moeda de prata”; o hebraico menciona uma pequena unidade de prata.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em um dos cargos sacerdotais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: aquele que restar
  rationale: Expressa quem permanece da linhagem de Eli depois do juízo, sem decidir se o sentido é apenas sobrevivência física ou permanência familiar.
- source_word: בְּבֵיתְךָ
  choice: da sua casa
  rationale: Em português, “casa” preserva naturalmente o sentido familiar e dinástico, não apenas o de edifício.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: prostrar-se diante dele
  rationale: Mantém tanto o gesto físico quanto a atitude de submissão e súplica implicados pelo verbo hebraico.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: por uma pequena quantia de prata
  rationale: אֲגוֹרָה designa uma pequena unidade ou porção de prata; a formulação comunica seu valor reduzido sem impor uma denominação monetária técnica incerta.
- source_word: כִּכַּר לָחֶם
  choice: um pão
  rationale: Aqui כִּכָּר se refere a uma unidade ou pão de formato arredondado; “um pão” é claro e natural em português moderno.
- source_word: סְפָחֵנִי נָא
  choice: Liga-me, por favor
  rationale: Preserva a imagem verbal de ser ligado ou agregado a um grupo ou serviço, enquanto נָא é vertido como uma súplica cortês.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: uma das funções sacerdotais
  rationale: O plural pode indicar encargos ou funções do serviço sacerdotal, e não sacerdócios teologicamente distintos.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: para que eu possa comer um pedaço de pão
  rationale: פַּת é um pedaço ou porção; a expressão conserva a humildade e a necessidade material do pedido.
theological_decisions:
- issue: Referente do pronome em לְהִשְׁתַּחֲוֺת לוֹ (“diante dele”)
  choice: Manter o pronome masculino singular sem identificar explicitamente a pessoa.
  alternative: Explicitar que se trata do sacerdote que então exercer a autoridade.
  rationale: O texto enfatiza a inversão da situação da casa de Eli, agora dependente de outra autoridade sacerdotal, mas não identifica de modo inequívoco o referente neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a linguagem familiar e dinástica de “casa”, a submissão física de “prostrar-se” e a ambiguidade quanto à identidade daquele diante de quem os descendentes se prostrarão.
