review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a reversão anunciada contra a casa de Eli, a submissão perante o referente masculino não especificado, a pequena unidade de prata, o pão e o pedido motivado pela necessidade de alimento. “Funções sacerdotais” representa adequadamente o plural de כְּהֻנּוֹת sem sugerir sacerdócios distintos.
  naturalness: 'Há dois pontos de melhoria segura: “todo aquele que restar” é menos natural do que o coletivo plural exigido pelo hebraico; e “Liga-me ... a uma das funções” soa pouco idiomático em português para um pedido de inclusão/atribuição num serviço. “Inclui-me ... em uma das funções” conserva o pedido de ser agregado e é claro em português moderno.'
  terminology: “Casa” preserva bem o sentido de família/linhagem; “prostrar-se diante dele” mantém o gesto e a submissão; “pequena quantia de prata”, “pão” e “pedaço de pão” são escolhas adequadas. Mantém-se o pronome “dele” sem identificação interpretativa.
  issues:
  - severity: low
    issue: Número e formulação de הַנּוֹתָר
    rationale: “Todo aquele que restar” é possível, mas “Todos os que restarem” reflete mais diretamente o coletivo “todo o restante” e evita a alternância singular distributiva no restante da frase.
  - severity: medium
    issue: “Liga-me ... a uma das funções sacerdotais”
    rationale: Embora “ligar” possa refletir a imagem de anexação de ספח, a construção é pouco natural e pode sugerir uma ligação abstrata. “Inclui-me ... em” comunica de forma idiomática o pedido de ser incorporado a um posto ou função sacerdotal, sem impor uma interpretação denominacional.
