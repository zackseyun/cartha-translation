revisions:
- from: 'E todo aquele que restar da sua casa virá prostrar-se diante dele por uma pequena quantia de prata[a] e um pão, e dirá: “Liga-me, por favor, a uma das funções sacerdotais[b], para que eu possa comer um pedaço de pão.”'
  to: 'E todos os que restarem da sua casa virão prostrar-se diante dele por uma pequena quantia de prata[a] e um pão, e dirão: “Inclui-me, por favor, em uma das funções sacerdotais[b], para que eu possa comer um pedaço de pão.”'
  rationale: A revisão limita-se a aperfeiçoar a concordância coletiva e a naturalidade idiomática do pedido de incorporação ao serviço sacerdotal. Conserva-se a ambiguidade do referente de “dele”, bem como as escolhas lexicais e os dois pontos de ancoragem das notas.
