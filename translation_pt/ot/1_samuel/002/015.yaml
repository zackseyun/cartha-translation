  text: גַּם֮ בְּ/טֶרֶם֮ יַקְטִר֣וּ/ן אֶת הַ/חֵלֶב֒ וּ/בָ֣א נַ֣עַר הַ/כֹּהֵ֗ן וְ/אָמַר֙ לָ/אִ֣ישׁ הַ/זֹּבֵ֔חַ תְּנָ֣/ה בָשָׂ֔ר לִ/צְל֖וֹת לַ/כֹּהֵ֑ן וְ/לֹֽא יִקַּ֧ח מִמְּ/ךָ֛ בָּשָׂ֥ר מְבֻשָּׁ֖ל כִּ֥י אִם חָֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: pt
  text: 'Mesmo antes de queimarem a gordura, o servo do sacerdote[a] vinha e dizia ao homem que oferecia o sacrifício: “Dê carne para o sacerdote assar, pois ele não aceitará de você carne cozida, mas somente crua.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o jovem do sacerdote” ou “o assistente do sacerdote”. O termo hebraico נַעַר pode indicar um jovem ou alguém que serve como subordinado; aqui, provavelmente se refere a alguém que agia em nome do sacerdote.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: Mesmo antes
  rationale: Expressa tanto a anterioridade temporal de בְּטֶרֶם quanto a ênfase agravante de גַּם no contexto da conduta imprópria.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: queimarem a gordura
  rationale: Refere-se à queima ritual das porções de gordura; a formulação é clara e natural, sem perder o sentido sacrificial.
- source_word: נַעַר הַכֹּהֵן
  choice: o servo do sacerdote
  rationale: נַעַר pode designar um jovem, servo ou assistente; aqui a função subordinada exercida em nome do sacerdote favorece “servo”, mantendo-se a ambiguidade lexical em nota.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: ao homem que oferecia o sacrifício
  rationale: Explicita de modo idiomático o particípio hebraico, identificando o adorador envolvido no ato sacrificial.
- source_word: תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: Dê carne para o sacerdote assar
  rationale: Conserva a força direta do imperativo e entende o infinitivo como propósito, com sintaxe natural em português.
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: pois ele não aceitará de você
  rationale: No contexto, לקח indica a recusa do sacerdote em receber a carne preparada dessa maneira; “aceitará” comunica a relação sem sugerir mera preferência.
- source_word: בָשָׂר מְבֻשָּׁל
  choice: carne cozida
  rationale: מְבֻשָּׁל designa carne preparada por cocção, provavelmente fervida; “cozida” é natural e preserva o contraste principal com carne crua.
- source_word: כִּי אִם חָי
  choice: mas somente crua
  rationale: 'Reproduz a construção exceptiva e enfática: não carne cozida, e sim exclusivamente crua.'
