source:
  edition: WLC
  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: pt
  text: Os que viviam fartos se empregaram por pão, mas os que passavam fome deixaram de passar fome[a]. Até a estéril deu à luz sete[b], mas a que tinha muitos filhos definhou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cessaram”; o complemento não é expresso. Pelo contexto, o sentido provável é que já não passam fome ou já não sofrem falta.'
    reason: lexical_alternative
  - marker: b
    text: “Sete” pode ser um número literal ou, poeticamente, sugerir plenitude e completude.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: os que viviam fartos
  rationale: O adjetivo substantivado designa pessoas antes saciadas ou prósperas; a formulação natural preserva a mudança de condição sugerida pelo contraste.
- source_word: בַּלֶּחֶם
  choice: por pão
  rationale: Mantém a imagem concreta de לֶחֶם e expressa que o trabalho era realizado em troca do sustento.
- source_word: נִשְׂכָּרוּ
  choice: se empregaram
  rationale: O nifal de שׂכר indica que passaram à condição de trabalhadores contratados; a forma pronominal comunica isso com naturalidade em português.
- source_word: וּרְעֵבִים
  choice: os que passavam fome
  rationale: Preserva o paralelismo substantivado e apresenta a fome como a condição anterior revertida no poema.
- source_word: חָדֵלּוּ
  choice: deixaram de passar fome
  rationale: O verbo significa literalmente 'cessaram', com objeto ou complemento elíptico. O contexto imediato favorece completar a ideia com a condição de fome, sem esconder a elipse em nota.
- source_word: עַד
  choice: até
  rationale: Neste contexto, עַד amplia a extensão da reversão, aproximadamente 'a ponto de até'; 'até' preserva sua forma e funciona naturalmente como partícula enfática.
- source_word: עֲקָרָה
  choice: a estéril
  rationale: O adjetivo feminino substantivado refere-se à mulher incapaz de gerar; a expressão concisa conserva o caráter poético.
- source_word: יָלְדָה שִׁבְעָה
  choice: deu à luz sete
  rationale: Reproduz a concisão do hebraico e deixa sem explicitação o substantivo contado, permitindo a ressonância literal ou simbólica do número.
- source_word: וְרַבַּת בָּנִים
  choice: a que tinha muitos filhos
  rationale: Embora בָּנִים possa indicar especificamente 'filhos homens', também é o plural convencional usado para descendentes; em português, 'filhos' preserva a forma masculina do original e é idiomático.
- source_word: אֻמְלָלָה
  choice: definhou
  rationale: O verbo comunica enfraquecimento, abatimento ou declínio; 'definhou' é conciso, poético e mantém o contraste com a fecundidade.
theological_decisions:
- issue: Se שִׁבְעָה ('sete') deve ser entendido literalmente ou como número de plenitude
  choice: Manter 'sete' sem interpretação no texto principal
  alternative: Explicitar 'sete filhos' ou interpretar como fecundidade completa
  rationale: O texto hebraico apresenta diretamente o número, e a linguagem poética admite tanto referência numérica quanto ressonância de plenitude; a tradução não resolve essa tensão.
- issue: Como representar בָּנִים no contraste poético
  choice: Traduzir por 'filhos'
  alternative: Traduzir por 'crianças' ou 'descendentes'
  rationale: '''Filhos'' é lexicalmente compatível com o masculino plural hebraico e natural em português, sem impor uma generalização interpretativa.'
- issue: Como tratar a elipse depois de חָדֵלּוּ
  choice: Completar no texto como 'deixaram de passar fome' e registrar a forma literal em nota
  alternative: Traduzir apenas 'cessaram' ou entender 'deixaram de trabalhar por pão'
  rationale: A sintaxe deixa o complemento implícito, mas o paralelismo aponta com força para o fim da fome; a nota preserva a ambiguidade formal do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência poética. Emprega 'viviam fartos' para marcar a condição anterior e 'definhou' para conservar o contraste vigoroso entre fecundidade e declínio.
