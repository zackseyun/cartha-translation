  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: pt
  text: E não o escolhi dentre todas as tribos de Israel para ser meu sacerdote, subir ao meu altar, queimar incenso e levar o éfode diante de mim? E dei à casa de seu pai todas as ofertas feitas no fogo dos filhos de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: E não o escolhi
  rationale: 'No contexto da repreensão divina, a forma hebraica tem força de afirmação retórica; a pergunta negativa comunica naturalmente em português: “não o escolhi?”'
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dentre todas as tribos de Israel
  rationale: “Dentre” preserva claramente o sentido partitivo de escolha no meio das tribos.
- source_word: לִי לְכֹהֵן
  choice: para ser meu sacerdote
  rationale: Expressa de modo conciso tanto a finalidade quanto a relação do sacerdote com Deus.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: subir ao meu altar
  rationale: Mantém a imagem concreta de עלה sem interpretá-la de maneira mais estreita como “oferecer sacrifícios”.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: queimar incenso
  rationale: É a formulação ritual clara e corrente em português.
- source_word: לָשֵׂאת אֵפוֹד לְפָנָי
  choice: levar o éfode diante de mim
  rationale: Preserva o sentido básico de נשא, “levar/carregar”, sem excluir a possibilidade contextual de o éfode ser usado como veste sacerdotal.
- source_word: לְבֵית אָבִיךָ
  choice: à casa de seu pai
  rationale: Conserva o idioma hebraico para a linhagem ancestral de Eli em português compreensível.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: todas as ofertas feitas pelo fogo pelos filhos de Israel
  rationale: Traduz diretamente o termo sacrificial amplo אִשֵּׁי, sem restringi-lo indevidamente a holocaustos; “filhos de Israel” preserva a forma da expressão hebraica.
theological_decisions:
- issue: Sentido do termo sacrificial אִשֵּׁי
  choice: ofertas feitas pelo fogo
  alternative: ofertas de alimento
  rationale: A opção escolhida torna explícito o elemento do fogo presente no termo hebraico e evita que “ofertas de alimento” seja entendido como uma categoria sacrificial mais estreita.
- issue: Função de נשא em relação ao éfode
  choice: levar o éfode
  alternative: vestir o éfode
  rationale: “Levar” preserva a amplitude lexical do verbo hebraico; “vestir” é contextualmente possível, mas resolveria uma nuance que o texto não explicita por si só.
- issue: Expressão nacional בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: Mantém a forma genealógica e pactual da expressão hebraica sem neutralizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção retórica natural. “Éfode” mantém o termo técnico tradicional; a tradução evita explicações confessionais e conserva as nuances cultuais do hebraico.
