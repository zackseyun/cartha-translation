revisions:
- from: E não o escolhi dentre todas as tribos de Israel para ser meu sacerdote, subir ao meu altar, queimar incenso e levar o éfode diante de mim? E dei à casa de seu pai todas as ofertas feitas pelo fogo pelos filhos de Israel.
  to: E não o escolhi dentre todas as tribos de Israel para ser meu sacerdote, subir ao meu altar, queimar incenso e levar o éfode diante de mim? E dei à casa de seu pai todas as ofertas feitas no fogo dos filhos de Israel.
  rationale: A única alteração é estilística e sintática na última expressão sacrificial. Ela preserva o sentido amplo de אִשֵּׁי como ofertas associadas ao fogo e a expressão «filhos de Israel», ao mesmo tempo que elimina uma ambiguidade desnecessária em português.
