review_pass:
  verdict: revise
  source_fidelity: O texto preserva bem a pergunta retórica, a escolha dentre as tribos, as funções sacerdotais e a referência à casa ancestral. «Levar o éfode» conserva adequadamente a amplitude de נשא, sem impor «vestir». A formulação final, porém, deve evitar que «pelo fogo pelos filhos de Israel» pareça atribuir o ato de fazer as ofertas ao fogo ou crie uma construção excessivamente pesada.
  naturalness: A redação é em geral clara e adequada ao português moderno. A sequência «ofertas feitas pelo fogo pelos filhos de Israel» soa pouco natural pela repetição de «pelo» e deixa ambígua a relação entre o fogo, as ofertas e os israelitas.
  terminology: «Sacerdote», «incenso», «altar» e «éfode» são apropriados. «Ofertas feitas no fogo» comunica o alcance sacrificial de אִשֵּׁי sem reduzi-lo a holocaustos nem introduzir a categoria mais específica de «ofertas de alimento».
  issues:
  - severity: low
    issue: Construção ambígua e pouco fluente na expressão sacrificial final
    rationale: «Ofertas feitas pelo fogo pelos filhos de Israel» acumula dois sintagmas introduzidos por «pelo» e pode sugerir que o fogo é o agente que faz as ofertas. «Ofertas feitas no fogo dos filhos de Israel» mantém a referência a ofertas sacrificiais por fogo e torna a relação genitiva mais legível.
  revised_text: E não o escolhi dentre todas as tribos de Israel para ser meu sacerdote, subir ao meu altar, queimar incenso e levar o éfode diante de mim? E dei à casa de seu pai todas as ofertas feitas no fogo dos filhos de Israel.
