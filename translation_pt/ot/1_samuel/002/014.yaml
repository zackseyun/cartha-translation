  text: וְ/הִכָּ֨ה בַ/כִּיּ֜וֹר א֣וֹ בַ/דּ֗וּד א֤וֹ בַ/קַּלַּ֨חַת֙ א֣וֹ בַ/פָּר֔וּר כֹּ֚ל אֲשֶׁ֣ר יַעֲלֶ֣ה הַ/מַּזְלֵ֔ג יִקַּ֥ח הַ/כֹּהֵ֖ן בּ֑/וֹ כָּ֚כָה יַעֲשׂ֣וּ לְ/כָל יִשְׂרָאֵ֔ל הַ/בָּאִ֥ים שָׁ֖ם בְּ/שִׁלֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: pt
  text: e o enfiava na bacia, ou no caldeirão, ou na panela, ou no tacho[a]; tudo o que o garfo[b] tirava, o sacerdote pegava com ele. Assim faziam a todos os israelitas que iam ali, a Siló.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Não se conhecem com certeza as diferenças exatas entre os recipientes enumerados no hebraico; trata-se de vários tipos de utensílios usados para cozinhar.
    reason: cultural_note
  - marker: b
    text: Isto é, o instrumento usado para retirar a carne da panela; o versículo anterior informa que ele tinha três dentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: e o enfiava
  rationale: O hifil de נכה descreve aqui o movimento repetido de introduzir o garfo no recipiente; o imperfeito português expressa o costume narrado no contexto.
- source_word: בַכִּיּוֹר
  choice: na bacia
  rationale: כִּיּוֹר designa uma bacia ou recipiente semelhante; “bacia” é corrente e adequado ao contexto de cozimento sacrificial.
- source_word: בַדּוּד
  choice: ou no caldeirão
  rationale: דּוּד é um recipiente de cocção, como panela grande ou caldeirão; esta opção ajuda a distinguir os vários utensílios enumerados.
- source_word: בַקַּלַּחַת
  choice: ou na panela
  rationale: O termo indica algum tipo de recipiente para cozinhar, embora sua forma exata seja incerta; “panela” comunica a função sem falsa precisão.
- source_word: בַפָּרוּר
  choice: ou no tacho
  rationale: פָּרוּר é outro recipiente culinário de identificação exata incerta; “tacho” preserva a variedade da lista.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: tudo o que o garfo tirava
  rationale: A expressão se refere à carne que o garfo prendia e fazia subir do recipiente; “tirava” é natural em português e mantém a ação habitual.
- source_word: הַמַּזְלֵג
  choice: o garfo
  rationale: מַזְלֵג é o instrumento de três dentes mencionado no versículo anterior; “garfo” é claro para leitores modernos, com nota sobre seu uso específico.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: o sacerdote pegava com ele
  rationale: בּוֹ é entendido instrumentalmente, referindo-se ao garfo com que o sacerdote retirava sua porção.
- source_word: כָּכָה יַעֲשׂוּ
  choice: Assim faziam
  rationale: Mantém o plural hebraico e resume de modo natural uma prática costumeira.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: com todo o Israel que ia ali a Siló
  rationale: Preserva o coletivo “todo o Israel” e apresenta Siló como o destino ao qual os adoradores se dirigiam.
theological_decisions:
- issue: Mudança de número na cláusula de resumo
  choice: Manter “o sacerdote” no singular e “faziam” no plural
  alternative: Uniformizar ambas as cláusulas no singular ou no plural
  rationale: O hebraico passa do sacerdote no singular para o verbo plural na síntese. Preservar essa mudança mantém a textura narrativa e não restringe artificialmente os agentes da prática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso do imperfeito comunica a ação costumeira; os termos dos recipientes permanecem diferenciados, enquanto a nota reconhece a incerteza lexical.
