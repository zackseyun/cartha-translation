  text: לָ֣/מָּה תִבְעֲט֗וּ בְּ/זִבְחִ/י֙ וּ/בְ/מִנְחָתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי מָע֑וֹן וַ/תְּכַבֵּ֤ד אֶת בָּנֶ֨י/ךָ֙ מִמֶּ֔/נִּי לְ/הַבְרִֽיאֲ/כֶ֗ם מֵ/רֵאשִׁ֛ית כָּל מִנְחַ֥ת יִשְׂרָאֵ֖ל לְ/עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: pt
  text: Por que vocês tratam com desprezo[a] o meu sacrifício e a minha oferta, que ordenei para a morada[b]? E por que você honra seus filhos mais do que a mim, para vocês se engordarem com a melhor parte[c] de cada oferta de Israel, meu povo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «dão coices contra»; também pode ser traduzido por «desprezam». O verbo hebraico retrata vividamente uma rejeição insolente.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «que ordenei para/na morada». A expressão é condensada e provavelmente se refere ao santuário como lugar da habitação de Deus.'
    reason: alternative_reading
  - marker: c
    text: Ou «com a primeira porção». A palavra hebraica pode indicar aquilo que vem primeiro ou, por extensão, a porção principal e mais escolhida.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: tratam com desprezo
  rationale: O verbo evoca literalmente dar coices, mas aqui expressa rejeição insolente. A formulação comunica naturalmente o sentido no contexto, enquanto a nota preserva a imagem concreta.
- source_word: זִבְחִי וּבְמִנְחָתִי
  choice: o meu sacrifício e a minha oferta
  rationale: זֶבַח designa um sacrifício, normalmente com abate; מִנְחָה pode indicar uma oferta específica ou uma dádiva cultual mais ampla. A dupla mantém a distinção sem restringir indevidamente a segunda palavra a uma oferta de cereais.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: que ordenei para a morada
  rationale: A construção hebraica é condensada e difícil. מָעוֹן provavelmente se refere ao santuário como lugar da habitação divina; «para a morada» conserva essa referência sem acrescentar um possessivo ausente no texto.
- source_word: וַתְּכַבֵּד אֶת־בָּנֶיךָ מִמֶּנִּי
  choice: você honra seus filhos mais do que a mim
  rationale: 'כבד significa aqui honrar, e מִמֶּנִּי estabelece uma comparação: Eli atribui aos filhos maior honra do que a Deus.'
- source_word: לְהַבְרִיאֲכֶם
  choice: fazendo com que vocês engordem
  rationale: A forma causativa e o sufixo plural descrevem Eli e os seus tornando-se bem alimentados ou gordos com as ofertas. A tradução retém tanto a imagem acusatória quanto a mudança para o plural.
- source_word: מֵרֵאשִׁית
  choice: com a melhor parte
  rationale: רֵאשִׁית pode significar a primeira porção e, por extensão, a porção principal ou melhor. No contexto do abuso sacerdotal, «a melhor parte» comunica o provável valor qualitativo, mantendo-se a alternativa mais formal em nota.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: de todas as ofertas de Israel, meu povo
  rationale: מִנְחָה tem aqui sentido coletivo amplo. «Meu povo» é entendido como aposição a Israel, solução natural que preserva a identificação feita por Deus.
theological_decisions:
- issue: Mudança de número na acusação
  choice: Preservar o plural em «vocês tratam» e «vocês engordem», mas o singular em «você honra seus filhos».
  alternative: Uniformizar toda a acusação no singular, dirigindo-a somente a Eli, ou no plural, dirigindo-a à casa sacerdotal.
  rationale: 'O hebraico passa deliberadamente do plural תִבְעֲטוּ ao singular וַתְּכַבֵּד e volta ao plural em לְהַבְרִיאֲכֶם. A tradução mantém essa tensão: a casa sacerdotal participa do desprezo e dos benefícios, enquanto Eli é pessoalmente responsabilizado por honrar seus filhos mais do que a Deus.'
- issue: Natureza da transgressão de Eli
  choice: Apresentar Eli como alguém que honra os filhos acima de Deus e participa, com sua casa, dos benefícios indevidos das ofertas.
  alternative: Restringir a acusação à tolerância passiva de Eli ou atribuir-lhe sozinho toda a apropriação das ofertas.
  rationale: A oposição explícita entre honrar os filhos e honrar a Deus, junto ao plural da cláusula sobre engordar, sustenta responsabilidade pessoal de Eli e participação coletiva, sem extrapolar para conclusões doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas pronominais naturais no Brasil. A mudança intencional entre «vocês» e «você» reproduz a alternância hebraica entre a casa sacerdotal e Eli pessoalmente. «Morada» permanece em minúscula para não transformar uma referência provável ao santuário em nome próprio.
