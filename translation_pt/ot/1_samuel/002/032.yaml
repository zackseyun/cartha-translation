  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: pt
  text: Você verá a aflição da morada em todo o bem que ele fizer a Israel[a]; e não haverá um homem idoso em sua casa todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um adversário na morada”, “aflição no santuário” ou expressão semelhante; a frase hebraica é difícil.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: Você verá
  rationale: O hifil de נבט significa olhar, contemplar ou ver. “Você verá” é natural em português e mantém a percepção futura do juízo sem acrescentar uma nuance emocional incerta.
- source_word: צַר
  choice: a aflição
  rationale: O termo pode indicar aflição, angústia ou adversário. “Aflição” se ajusta ao contexto de juízo e preserva, com a nota, a incerteza da expressão.
- source_word: מָעוֹן
  choice: da morada
  rationale: מָעוֹן designa morada ou habitação e, no contexto, provavelmente alude ao santuário. “Morada” conserva o valor lexical sem explicitar além do hebraico.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: em meio a todo o bem que ele fizer a Israel
  rationale: A formulação mantém implícito, como no hebraico, o sujeito de “fizer”, naturalmente entendido como Deus, e expressa a simultaneidade entre o bem concedido a Israel e a aflição contemplada.
- source_word: זָקֵן
  choice: um idoso
  rationale: Aqui o termo indica alguém de idade avançada, não o ocupante do cargo de ancião. “Idoso” comunica isso claramente em português atual.
- source_word: בְּבֵיתְךָ
  choice: em sua casa
  rationale: “Casa” pode designar tanto o lar quanto a linhagem familiar. A tradução preserva essa amplitude, enquanto o contexto aponta para os descendentes de Eli.
- source_word: כָּל הַיָּמִים
  choice: jamais
  rationale: No contexto de uma oração negativa, a expressão idiomática significa que em tempo algum haverá um homem que alcance a velhice na casa de Eli. “Jamais” transmite essa força com naturalidade em português.
theological_decisions:
- issue: Interpretação da difícil expressão צַר מָעוֹן
  choice: a aflição da morada
  alternative: um adversário na morada; aflição no santuário
  rationale: O hebraico é obscuro e admite mais de uma análise. A tradução principal permanece relativamente formal, sem identificar uma pessoa hostil nem substituir diretamente “morada” por “santuário”; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção mantém a solenidade do anúncio de juízo, mas usa “jamais” para expressar naturalmente a combinação hebraica de negação com “todos os dias”.
