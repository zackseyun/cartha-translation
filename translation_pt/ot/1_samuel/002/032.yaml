review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem o anúncio de juízo e mantém adequadamente implícito o sujeito de “fizer”. Contudo, “jamais” substitui a expressão temporal explícita כָּל־הַיָּמִים (“todos os dias”), e “em meio a” acrescenta uma nuance de ambientação/simultaneidade mais específica do que o פשוט בְּ (“em, em relação a”) permite.
  naturalness: O português é claro e atual. “Você verá” é aceitável no registro visado; “homem idoso” torna explícito o referente masculino de זָקֵן e soa mais natural e preciso aqui do que o substantivo genérico “idoso”.
  terminology: “Aflição da morada” preserva, com boa cautela, a expressão hebraica difícil צַר מָעוֹן. A nota mantém alternativas relevantes sem fixar uma interpretação confessional ou excessivamente específica.
  issues:
  - severity: medium
    issue: “jamais” omite a expressão “todos os dias”
    rationale: Embora possa comunicar uma consequência duradoura, “jamais” não traduz a formulação hebraica explícita וְלֹא ... כָּל־הַיָּמִים. “Não haverá ... todos os dias” conserva a forma e a cadência da fonte, sem reduzir a precisão temporal.
  - severity: low
    issue: “em meio a todo o bem” é mais interpretativo que “em todo o bem”
    rationale: “Em meio a” salienta simultaneidade ou enquadramento circunstancial. “Em todo o bem que ele fizer a Israel” fica mais próximo do hebraico e preserva sua relação sintática ampla.
  - severity: low
    issue: “um idoso” não explicita o referente masculino
    rationale: זָקֵן neste contexto designa um homem de idade avançada, não apenas uma pessoa idosa em sentido genérico. “Um homem idoso” transmite isso com clareza.
  revised_text: Você verá a aflição da morada em todo o bem que ele fizer a Israel[a]; e não haverá um homem idoso em sua casa todos os dias.
