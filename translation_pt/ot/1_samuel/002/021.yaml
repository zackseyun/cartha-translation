base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: pt
  text: Pois Yahweh visitou Ana[a], e ela engravidou e deu à luz três filhos e duas filhas. E o menino Samuel cresceu com Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “Yahweh voltou sua atenção para Ana” ou “Yahweh cuidou de Ana”. Aqui, o verbo hebraico indica uma intervenção favorável em benefício dela.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com Yahweh”. No contexto, a expressão provavelmente indica que Samuel cresceu na presença de Yahweh, no santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou causal da oração em relação ao contexto anterior, com fluidez narrativa em português.
- source_word: פָקַד
  choice: visitou
  rationale: Preserva a expressão bíblica de uma intervenção favorável de Deus sem reduzi-la simplesmente a “abençoou”; a nota esclarece o sentido neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: ela engravidou e deu à luz
  rationale: Expressa diretamente a concepção e o parto, conservando a sequência verbal hebraica em português natural.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: três filhos e duas filhas
  rationale: Tradução direta dos números e dos termos de parentesco.
- source_word: וַיִּגְדַּל הַנַּעַר שְׁמוּאֵל
  choice: E o menino Samuel crescia
  rationale: “Menino” comunica adequadamente נַעַר neste contexto, e o imperfeito português apresenta o crescimento progressivo de Samuel.
- source_word: עִם יְהוָה
  choice: com Yahweh
  rationale: Conserva a formulação incomum e literalmente relacional do hebraico, sem transformá-la silenciosamente em “diante de” ou “na presença de”; a nota registra a provável referência ao santuário.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Sentido de עִם יְהוָה no crescimento de Samuel
  choice: com Yahweh
  alternative: diante de Yahweh; na presença de Yahweh
  rationale: A tradução principal mantém a preposição hebraica e sua possível dimensão relacional, enquanto a nota indica a provável nuance cultual ligada ao crescimento de Samuel no santuário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se “visitou” como expressão bíblica explicada em nota e mantém-se o incomum “com Yahweh” para não eliminar a ambiguidade do hebraico.
