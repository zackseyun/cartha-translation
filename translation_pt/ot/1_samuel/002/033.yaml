revisions:
- from: Mas não eliminarei todos os seus homens de junto do meu altar, para que os seus olhos se consumam e a sua alma desfaleça de tristeza; e todos os descendentes da sua casa morrerão na flor da idade.[a]
  to: Mas não eliminarei do meu altar todos os homens da tua linhagem, para fazer teus olhos se consumirem e entristecer tua alma; e todos os descendentes da tua casa morrerão na flor da idade.[a]
  rationale: A revisão restaura consistentemente a segunda pessoa singular da fala dirigida a Eli, substitui uma expressão ambígua por uma referência clara à linhagem e torna mais explícita a relação causativa das orações finais. Mantém-se “na flor da idade” como leitura interpretativa prudente, com a nota que conserva o hebraico literal e sua ambiguidade.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:21:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva o sentido global do juízo: a linhagem de Eli não será removida por completo da proximidade do altar, mas permanecerá para sofrer aflição, e sua descendência morrerá prematuramente. Contudo, o tratamento da fala direta deve conservar a segunda pessoa singular do hebraico, e a oração de finalidade deve expressar mais diretamente a ação divina de causar sofrimento.'
  naturalness: “Seus homens” soa pouco idiomático e pode sugerir servos ou soldados, não membros da linhagem. “Teus homens” é mais claro, mas “todos os homens da tua linhagem” é mais natural e explicita o referente contextual. “Para que ... desfaleça de tristeza” é compreensível, porém menos direto que a construção hebraica.
  terminology: “Altar”, “alma” e “descendentes” são adequados. “Na flor da idade” é uma interpretação plausível de יָמֻתוּ אֲנָשִׁים, desde que a nota mantenha a literalidade e assinale a incerteza. Não há base textual para “pela espada” ou para morte causada por homens.
  issues:
  - severity: medium
    issue: Os pronomes do discurso divino foram vertidos na terceira pessoa (“seus”, “sua”), embora o hebraico se dirija diretamente a Eli na segunda pessoa singular.
    rationale: לְךָ, עֵינֶיךָ, נַפְשֶׁךָ e בֵּיתְךָ pedem “teu/tua” em português; a alteração preserva a enunciação direta do original.
  - severity: low
    issue: “Seus homens” é ambíguo em português.
    rationale: Pode ser entendido como homens sob a autoridade de Eli, em vez de integrantes de sua casa/linhagem. “Homens da tua linhagem” evita essa leitura sem alterar o sentido contextual.
  - severity: low
    issue: “Para que os teus olhos se consumam e a tua alma desfaleça de tristeza” dilui a construção causativa e acrescenta uma nuance física intensa a “alma”.
    rationale: 'Os infinitivos hebraicos descrevem o resultado ou propósito de Deus: causar o definhamento dos olhos e a aflição da pessoa. “Para fazer ... e entristecer ...” é mais direto e idiomático.'
