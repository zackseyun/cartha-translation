  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: pt
  text: Mas não eliminarei do meu altar todos os homens da tua linhagem, para fazer teus olhos se consumirem e entristecer tua alma; e todos os descendentes da tua casa morrerão na flor da idade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “morrerão homens”. A expressão também pode ser entendida como “morrerão em plena idade adulta”.'
    reason: A frase יָמֻתוּ אֲנָשִׁים é incomum; a nota preserva sua forma literal e sua incerteza interpretativa.
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: não eliminarei todos os seus homens de junto do meu altar
  rationale: 'A negação com o substantivo singular tem força distributiva: nem todos os homens ligados a Eli serão eliminados. “De junto do meu altar” representa מֵעִם e mantém a ideia de proximidade e serviço sacerdotal.'
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: para que os seus olhos se consumam
  rationale: Conserva a imagem hebraica de olhos consumidos ou debilitados pela aflição, em formulação digna e compreensível.
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: e a sua alma desfaleça de tristeza
  rationale: O verbo raro expressa dor ou aflição; “desfaleça de tristeza” comunica o sofrimento interior sem eliminar a linguagem antropológica de נֶפֶשׁ.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: e todos os descendentes da sua casa
  rationale: Embora מַרְבִּית denote literalmente aumento ou multiplicação, no contexto refere-se aos membros que dão continuidade à linhagem de Eli. “Descendentes” torna o referente claro em português.
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: morrerão na flor da idade
  rationale: A expressão hebraica, literalmente “morrerão homens”, provavelmente indica morte em plena idade adulta, em contraste com uma velhice longa; a nota preserva a forma literal e a ambiguidade.
theological_decisions:
- issue: Natureza do juízo sobre a linhagem sacerdotal de Eli
  choice: Nem todos os homens da linhagem são imediatamente eliminados da proximidade do altar; sobreviventes permanecem sob sofrimento e juízo.
  alternative: A linhagem é totalmente removida do serviço sacerdotal, ou a frase trata apenas de sobrevivência física sem implicar função sacerdotal.
  rationale: A construção negativa indica que a eliminação não será total, enquanto as orações seguintes apresentam a sobrevivência como ocasião de aflição. A tradução mantém essa tensão sem definir além do texto a situação sacerdotal dos sobreviventes.
- issue: Sentido de אֲנָשִׁים no fim do versículo
  choice: na flor da idade
  alternative: literalmente, “como homens” ou “homens”; também se propõe uma referência à morte causada por homens.
  rationale: No contexto de uma casa privada de longevidade, a leitura relativa à plena idade adulta é idiomática e coerente. Como o hebraico é incomum e não menciona espada, a nota registra a literalidade e evita introduzir no texto principal uma morte violenta não explicitada.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “seu/sua”. A formulação mantém as imagens de olhos consumidos e alma entristecida, mas esclarece que מַרְבִּית designa a descendência. O marcador [a] aparece no texto principal.
