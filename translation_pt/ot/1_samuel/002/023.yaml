  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: pt
  text: 'E ele lhes disse: “Por que vocês fazem coisas assim? Pois ouço de todo este povo relatos a respeito das más ações de vocês.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, mais literalmente: “ouço de todo este povo as suas más palavras/coisas”. No contexto, trata-se de relatos sobre a conduta perversa dos filhos de Eli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: E ele lhes disse
  rationale: Preserva o avanço narrativo do wayyiqtol e identifica naturalmente os filhos de Eli como destinatários.
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: Por que vocês fazem coisas assim?
  rationale: O imperfeito indica conduta corrente ou habitual; “coisas assim” transmite de modo natural o valor amplo de דְּבָרִים e a reprovação de Eli.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: Pois ouço
  rationale: A construção com pronome independente e particípio apresenta Eli como quem recebe continuamente esses relatos; “pois” explicita a força explicativa da oração.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: falar das más ações de vocês
  rationale: דְּבָרֵיכֶם pode designar palavras, assuntos ou atos. No contexto, refere-se à conduta perversa dos filhos, conhecida por meio dos relatos do povo; a formulação portuguesa conserva a ideia de ouvir falar sem tornar o hebraico artificial.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: de todo este povo
  rationale: מֵאֵת marca a fonte do que Eli ouve, enquanto אֵלֶּה acrescenta valor demonstrativo ao coletivo “povo”.
