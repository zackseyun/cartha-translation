    rationale: O hebraico diz que Eli ouve, da parte de todo o povo, os maus “assuntos/palavras” dos filhos. Em português, “ouvir alguém falar de” pode deslocar o foco para o ato de falar do povo. “Ouço ... relatos a respeito de” exprime com maior clareza a relação entre fonte, conteúdo ouvido e conduta denunciada.
