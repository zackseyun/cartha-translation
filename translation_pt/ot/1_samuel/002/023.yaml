  source_fidelity: A tradução identifica corretamente Eli como falante, preserva a pergunta de repreensão e comunica que ele recebe informação de todo o povo acerca da conduta má dos filhos. Contudo, “ouço de todo este povo falar das...” pode sugerir que Eli ouve o povo falar, em vez de explicitar que ele ouve relatos provenientes do povo; a construção também fica menos direta que o hebraico.
  naturalness: “Por que vocês fazem coisas assim?” é natural e adequado ao registro. A formulação revista com “relatos a respeito” soa mais idiomática, elimina a ambiguidade sintática e preserva o sentido contextual.
  terminology: “Más ações” é uma concretização contextual defensável de דִּבְרֵיכֶם רָעִים, desde que a nota mantenha a alternativa lexical “palavras/coisas/assuntos”. “Todo este povo” preserva o coletivo e o demonstrativo.
