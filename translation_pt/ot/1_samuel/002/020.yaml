base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: pt
  text: 'E Eli abençoava Elcana e sua mulher e dizia: “Que Yahweh lhe dê descendência por meio desta mulher, em lugar daquilo que ele pediu[a] a Yahweh[b]”. Depois, eles voltavam para o seu lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “em lugar daquilo que foi pedido”. O termo deriva da raiz “pedir” e também pode evocar o filho pedido e entregue a Yahweh, fazendo eco ao nascimento de Samuel.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido por “ele pediu” está no masculino singular. Isso pode apontar gramaticalmente para Elcana; contudo, o contexto destaca Ana como quem pediu o filho. A expressão também faz eco à entrega de Samuel a Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ ... וְאָמַר
  choice: abençoava ... e dizia
  rationale: O contexto descreve a prática repetida nas visitas anuais; o pretérito imperfeito comunica naturalmente esse valor habitual em português.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: Que Yahweh lhe dê
  rationale: Embora שׂים tenha o sentido básico de pôr ou estabelecer, com ‘descendência’ numa bênção significa conceder; ‘lhe’ conserva o destinatário singular da forma hebraica.
- source_word: זֶרַע
  choice: descendência
  rationale: O substantivo singular coletivo pode indicar filhos ou descendentes; ‘descendência’ mantém essa amplitude sem recorrer ao literalismo ‘semente’.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: por meio desta mulher
  rationale: Expressa de modo natural que a descendência viria de Ana, preservando a formulação demonstrativa ‘esta mulher’.
- source_word: תַּחַת הַשְּׁאֵלָה
  choice: em lugar do pedido
  rationale: תחת indica substituição ou compensação. השאלה deriva da raiz ‘pedir’ e pode evocar tanto o pedido quanto aquilo que foi pedido ou entregue; a nota conserva essa densidade lexical.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: que foi feito a Yahweh
  rationale: A construção passiva em português evita impor um sujeito ao verbo masculino singular, cuja referência é difícil, e mantém a direção expressa por לַיהוָה sem eliminar a alusão à entrega de Samuel.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: Depois, eles iam para casa
  rationale: O plural refere-se ao casal, e ‘para casa’ comunica naturalmente o sentido idiomático de ‘para o lugar dele’; o imperfeito mantém a ação habitual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico sem acrescentar uma interpretação denominacional.
- issue: Identidade do sujeito de שָׁאַל e relação entre pedido e entrega
  choice: 'formulação passiva: ‘que foi feito a Yahweh’'
  alternative: ‘que ela fez a Yahweh’; ‘que ele fez a Yahweh’; ‘que ela pediu a Yahweh’; ‘que foi emprestado a Yahweh’
  rationale: A forma verbal é masculina singular, mas o contexto destaca o pedido de Ana e a entrega de Samuel a Yahweh. A voz passiva e as notas preservam a tensão gramatical e narrativa sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito imperfeito marca o costume anual. ‘Para casa’ evita o pouco natural ‘para o lugar dele’, sem alterar o sentido narrativo.
