  source_fidelity: O texto transmite com precisão a prática habitual dos sacerdotes em relação ao povo. O imperfeito em “oferecia”, “vinha” e “cozinhava” comunica adequadamente o caráter recorrente expresso pelo contexto hebraico. “Ajudante do sacerdote” é uma solução funcional apropriada para נער הכהן, e “garfo de três dentes” reproduz com clareza o utensílio de três pontas/‘dentes’.
