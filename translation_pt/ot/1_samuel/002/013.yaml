  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: pt
  text: 'E este era o costume dos sacerdotes para com o povo: quando alguém oferecia um sacrifício, o ajudante do sacerdote vinha enquanto a carne cozinhava, com um garfo de três dentes[a] na mão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gancho de três pontas”; o termo hebraico designa um utensílio semelhante a um garfo, usado para retirar a carne da panela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: E este era o costume
  rationale: מִשְׁפָּט pode indicar norma, direito devido ou prática estabelecida. Neste relato, “costume” expressa com naturalidade o procedimento habitual dos sacerdotes, e “E” representa a conjunção ו sem introduzir um marcador temporal inexistente.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: dos sacerdotes para com o povo
  rationale: A expressão descreve a maneira habitual de os sacerdotes tratarem o povo; “para com” preserva a relação sem atribuir de antemão benefício ou hostilidade.
- source_word: כָּל־אִישׁ זֹבֵחַ זֶבַח
  choice: quando alguém oferecia um sacrifício
  rationale: A construção hebraica é distributiva e descreve uma situação recorrente. “Alguém” funciona naturalmente como referência humana genérica em português, enquanto “oferecia um sacrifício” evita uma repetição cognata artificial sem perder o sentido cultual.
- source_word: וּבָא
  choice: vinha
  rationale: O imperfeito português comunica a ação habitual e repetida descrita no contexto.
- source_word: נַעַר הַכֹּהֵן
  choice: o ajudante do sacerdote
  rationale: נַעַר pode designar jovem, criado ou assistente. Aqui a função de serviço é central; “ajudante” é claro, atual e não exige que se determine a idade.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: enquanto a carne cozinhava
  rationale: A preposição com o infinitivo forma uma oração temporal. “Cozinhava” preserva o sentido sem especificar além do hebraico se a carne fervia diretamente ou era cozida de outro modo.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: um garfo de três dentes
  rationale: Literalmente, o utensílio tem “três dentes”. A expressão portuguesa é concreta e inteligível, mantendo a imagem do original.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: A locução portuguesa expressa naturalmente que o ajudante carregava o utensílio; o possuidor fica claro pelo sujeito da oração.
