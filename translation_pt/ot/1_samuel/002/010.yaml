  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: pt
  text: Os adversários de Javé serão despedaçados[a]; do céu ele trovejará contra eles[b]. Javé julgará os confins da terra; dará força ao seu rei e erguerá o chifre[c] do seu ungido[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também: “os que contendem contra ele”. A tradição textual hebraica apresenta formas escritas e lidas que tornam esta expressão difícil, mas o verbo no plural favorece a referência aos adversários de Javé.'
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Hebraico: “no céu”. “Do céu” indica em português a procedência do trovão.'
    reason: lexical_alternative
  - marker: c
    text: O “chifre” é uma imagem de força, honra e poder vitorioso.
    reason: cultural_metaphor
  - marker: d
    text: Hebraico mashiach, isto é, “ungido”; é a palavra da qual vem o título “Messias”. Aqui designa o rei ungido de Javé e pode também ter ressonância messiânica.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, tratando-o como nome próprio e preservando sua referência pactual.
- source_word: יֵחַתּוּ
  choice: serão despedaçados
  rationale: O nifal de חתת, neste contexto de derrota e juízo, indica que os adversários serão quebrados ou destroçados, não apenas amedrontados.
- source_word: מְרִיבוֹ עָלָיו
  choice: os adversários de Javé
  rationale: A leitura tradicional e o verbo no plural apontam para os que contendem contra Javé. A formulação portuguesa explicita o referente e mantém a ideia de oposição.
- source_word: בַּשָּׁמַיִם יַרְעֵם
  choice: do céu ele trovejará contra eles
  rationale: A preposição hebraica é literalmente “no céu”, mas em português “do céu” expressa naturalmente a procedência do trovão; “contra eles” comunica sua direção hostil no contexto.
- source_word: יָדִין
  choice: julgará
  rationale: Preserva o sentido judicial amplo de exercer juízo sobre toda a terra.
- source_word: אַפְסֵי אָרֶץ
  choice: os confins da terra
  rationale: Expressão portuguesa natural e solene para as regiões mais remotas, conservando o alcance universal do hebraico.
- source_word: וְיִתֶּן עֹז
  choice: dará força
  rationale: Traduz diretamente עֹז como força ou poder concedido por Deus.
- source_word: לְמַלְכּוֹ
  choice: ao seu rei
  rationale: Mantém o termo real explícito do hebraico, mesmo no contexto anterior à consolidação da monarquia israelita.
- source_word: וְיָרֵם קֶרֶן
  choice: erguerá o chifre
  rationale: Conserva a metáfora hebraica do chifre como símbolo de força, honra e poder vitorioso; uma nota a esclarece ao leitor moderno.
- source_word: מְשִׁיחוֹ
  choice: do seu ungido
  rationale: Traduz o sentido lexical imediato de מָשִׁיחַ no contexto régio sem transformar silenciosamente o termo em um título exclusivamente escatológico; a nota registra sua relação com “Messias”.
theological_decisions:
- issue: Sentido régio e possível ressonância messiânica de מְשִׁיחוֹ
  choice: seu ungido
  alternative: seu Messias
  rationale: “Ungido” expressa diretamente o referente real no poema e preserva a abertura para uma leitura messiânica posterior. Traduzir apenas “Messias” poderia levar o leitor a excluir o horizonte régio imediato; a nota mantém explícita a ressonância canônica do termo.
- issue: Referência futura a um rei em um cântico situado antes da monarquia
  choice: manter “seu rei” sem explicação harmonizadora no corpo do texto
  alternative: substituir por “seu governante” ou explicar como profecia messiânica direta
  rationale: O hebraico diz claramente “seu rei”. A tradução preserva a tensão histórica e teológica do texto em vez de resolvê-la por paráfrase.
translation_notes:
  register: Português atual, solene e acessível, com boa legibilidade brasileira. “Javé” localiza naturalmente o nome divino; “confins da terra” mantém o tom poético. A metáfora do chifre foi preservada e explicada, enquanto “ungido” evita antecipar no corpo do texto uma conclusão interpretativa exclusiva.
