  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: pt
  text: 'Não há ninguém santo como Yahweh[a],

    pois não há ninguém além de ti,

    e não há rocha como o nosso Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino יהוה, tradicionalmente traduzido como “SENHOR”.
    reason: divine_name
lexical_decisions:
- source_word: אֵין
  choice: não há
  rationale: A construção existencial é natural em português e, repetida nos três membros, preserva a ênfase e o paralelismo hebraicos.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: “Santo” é a tradução corrente e mantém a ideia de singularidade e separação própria de Deus.
- source_word: כַּיהוָה
  choice: como Yahweh
  rationale: A preposição כְּ indica comparação; o nome divino יהוה é transliterado como “Yahweh”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da declaração anterior e conserva o tom poético e explicativo.
- source_word: בִּלְתֶּךָ
  choice: ninguém além de ti
  rationale: Expressa exclusão e conserva a mudança para a segunda pessoa, própria da oração de Ana. “Ninguém” deixa clara a referência pessoal sem alterar o sentido.
- source_word: צוּר
  choice: rocha
  rationale: Mantém a metáfora hebraica de firmeza, estabilidade e proteção, sem reduzi-la a uma única interpretação.
- source_word: כֵּאלֹהֵינוּ
  choice: como o nosso Deus
  rationale: Neste contexto, אֱלֹהִים designa em sentido singular o Deus de Israel, e כְּ marca a comparação.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A transliteração preserva no texto principal o nome pessoal da aliança. A nota registra a forma tradicional em traduções portuguesas sem substituir o nome por um título.
- issue: Força da afirmação בִּלְתֶּךָ
  choice: não há ninguém além de ti
  alternative: não há outro além de ti
  rationale: A formulação mantém a exclusividade afirmada pelo hebraico e a interpelação direta a Deus, sem especificar além do que o verso declara.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A disposição em três linhas evidencia o paralelismo poético; a repetição de “não há” reproduz a ênfase do original.
