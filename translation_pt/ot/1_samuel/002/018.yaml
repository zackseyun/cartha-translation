  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: pt
  text: Samuel ministrava diante de Yahweh[a]; era um menino vestido com um éfode de linho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “diante da face/presença de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: Samuel
  rationale: O nome é transliterado de forma tradicional em português. A conjunção וּ liga o versículo ao contexto, mas não precisa ser representada por um marcador artificial como “ora”.
- source_word: מְשָׁרֵת
  choice: ministrava
  rationale: O particípio indica atividade contínua; “ministrava” preserva esse aspecto e o contexto de serviço religioso.
- source_word: אֶת פְּנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão idiomática significa atuar perante ou na presença de Yahweh. “Diante de” é natural e conciso, enquanto a nota registra o valor literal de פְּנֵי.
- source_word: נַעַר
  choice: menino
  rationale: No contexto, o termo destaca a pouca idade de Samuel sem acrescentar a ideia de servo.
- source_word: חָגוּר
  choice: vestido com
  rationale: O particípio passivo significa literalmente estar cingido; “vestido com” comunica de modo claro e atual a maneira como o éfode era usado.
- source_word: אֵפוֹד
  choice: éfode
  rationale: Trata-se de uma peça cultual israelita sem equivalente português exato; a transliteração evita especificação indevida.
- source_word: בָּד
  choice: linho
  rationale: Neste contexto de vestimenta, o termo designa linho; “linho fino” acrescentaria uma qualidade não expressa no texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome divino e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O ponto e vírgula evita que “menino” pareça vocativo ou aposto ambíguo e conserva a relação circunstancial entre a atividade de Samuel e sua pouca idade.
