  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: pt
  text: Os arcos dos poderosos são despedaçados[a], mas os que tropeçam se cingem de força[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são quebrados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se revestem de força”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: os arcos
  rationale: Embora esteja no singular em hebraico, o substantivo tem sentido coletivo, acompanhado pelo genitivo plural e por um predicado plural; o plural em português comunica isso com naturalidade.
- source_word: גִּבֹּרִים
  choice: dos poderosos
  rationale: O termo pode designar homens fortes, valentes ou guerreiros. “Poderosos” preserva a amplitude poética sem limitar o referente ao campo militar.
- source_word: חַתִּים
  choice: são despedaçados
  rationale: No contexto de arcos, o termo descreve armas quebradas, não pessoas desanimadas. “Despedaçados” mantém a vivacidade da imagem poética.
- source_word: נִכְשָׁלִים
  choice: os que tropeçam
  rationale: O particípio retrata literalmente os que tropeçam ou vacilam. A tradução conserva a metáfora corporal e o contraste do cântico.
- source_word: אָזְרוּ
  choice: se cingem
  rationale: O verbo significa cingir ou prender ao corpo. A forma reflexiva comunica em português a ação de revestir-se ou equipar-se, enquanto o presente poético cria paralelismo natural com a primeira oração.
- source_word: חָיִל
  choice: força
  rationale: O substantivo pode indicar força, poder, valor ou capacidade militar. “Força” se ajusta ao amplo tema de inversão entre fraqueza e poder.
theological_decisions:
- issue: Imagens poéticas de inversão no cântico de Ana
  choice: Manter as imagens concretas dos arcos, do tropeçar e do cingir-se de força.
  alternative: 'Explicitar a ideia como: “As armas dos guerreiros são quebradas, mas os fracos ficam fortes.”'
  rationale: As imagens apresentam poeticamente a inversão entre poder humano e fraqueza. Conservá-las evita reduzir a afirmação a uma abstração ou acrescentar uma interpretação teológica não expressa diretamente no verso.
- issue: Agência em אָזְרוּ
  choice: 'Traduzir de modo reflexivo: “se cingem de força”.'
  alternative: “são cingidos de força”
  rationale: A forma verbal hebraica é ativa e pode indicar que os que tropeçam se cingem; contudo, o agente último da inversão no contexto do cântico pode ser entendido como Deus. A nota preserva a possibilidade passiva sem inseri-la de modo inequívoco no texto.
translation_notes:
  register: Português moderno, poético e digno, de leitura natural no Brasil e compreensível internacionalmente. “Cingir-se” é menos coloquial, mas preserva uma imagem central do hebraico e permanece reconhecível no registro bíblico-literário.
