base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: pt
  text: Ele guarda os pés dos seus fiéis[a], mas os perversos são silenciados nas trevas[b], pois não é pela força que o homem prevalece[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição textual hebraica também pode ser lida no singular: “seu fiel”. Adota-se aqui o sentido plural por se ajustar ao paralelismo poético e ao provável sentido coletivo.'
    reason: textual_variant
  - marker: b
    text: Ou “ficam imóveis” ou “são eliminados”; o verbo hebraico pode indicar ficar em silêncio ou ser imobilizado.
    reason: lexical_alternative
  - marker: c
    text: “O homem” traduz o masculino singular hebraico, empregado aqui em sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: os pés de
  rationale: Preserva a imagem concreta do plural construto hebraico; “passos” seria uma possibilidade idiomática, mas menos direta.
- source_word: חסידו
  choice: seus fiéis
  rationale: Expressa lealdade e devoção sem as conotações eclesiásticas que “santos” pode adquirir; adota o sentido coletivo favorecido pelo paralelismo e por testemunhos antigos.
- source_word: יִשְׁמֹר
  choice: guarda
  rationale: Verbo natural e conciso que mantém a ideia de proteção e cuidado.
- source_word: וּרְשָׁעִים
  choice: mas os perversos
  rationale: A conjunção tem função adversativa no contraste poético entre os fiéis e os perversos.
- source_word: בַּחֹשֶׁךְ
  choice: nas trevas
  rationale: Formulação portuguesa natural que preserva a imagem hebraica de obscuridade e juízo.
- source_word: יִדָּמּוּ
  choice: são silenciados
  rationale: Mantém a voz passiva e a amplitude do verbo, que pode indicar ficar em silêncio ou ser imobilizado.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, a razão para o contraste anterior.
- source_word: לֹא בְכֹחַ
  choice: não é pela força
  rationale: Reproduz com clareza a negação enfática do meio pelo qual alguém prevalece.
- source_word: יִגְבַּר
  choice: prevalece
  rationale: Comunica êxito ou superioridade, e não apenas a posse de força.
- source_word: אִישׁ
  choice: o homem
  rationale: Conserva o masculino singular genérico do hebraico e o tom proverbial da afirmação.
theological_decisions:
- issue: Número e sentido de חסידו
  choice: 'sentido coletivo/plural: “seus fiéis”'
  alternative: 'singular: “seu fiel”'
  rationale: Embora a tradição textual hebraica permita a leitura singular, o paralelismo com “os perversos” e o apoio das versões antigas favorecem o sentido coletivo, sem eliminar a variante.
- issue: Sentido de אִישׁ
  choice: “o homem” como masculino genérico e representativo
  alternative: “uma pessoa” ou “ninguém”
  rationale: A tradução conserva a forma masculina singular da fonte, entendida proverbialmente como referência geral ao ser humano.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi ajustada apenas o necessário para soar natural, mantendo o paralelismo, as imagens poéticas e as ambiguidades relevantes do hebraico.
