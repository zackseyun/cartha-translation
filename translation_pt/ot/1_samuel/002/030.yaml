base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: pt
  text: 'Por isso, declara Yahweh, o Deus de Israel: Eu de fato disse que a sua casa e a casa de seu pai caminhariam diante de mim para sempre. Mas agora, declara Yahweh, longe de mim tal coisa! Pois os que me honram, eu honrarei, mas os que me desprezam serão tidos em pouca conta[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão desonrados” ou “serão tratados como insignificantes”. O verbo hebraico transmite a ideia de se tornar leve, desprezível ou de pouca importância, em contraste com “honrarei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a conclusão judicial decorrente da acusação anterior.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula solene de pronunciamento divino em português atual e preserva o nome divino.
- source_word: אָמֹר אָמַרְתִּי
  choice: Eu de fato declarei
  rationale: Expressa a ênfase do infinitivo absoluto com o verbo finito sem reproduzir uma construção artificial em português.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: a sua casa e a casa de seu pai
  rationale: Preserva a repetição de “casa” e seu sentido familiar e dinástico.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: caminhariam diante de mim
  rationale: Conserva a imagem hebraica de conduta ou serviço contínuo na presença de Deus, sem restringi-la explicitamente ao ministério sacerdotal.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Tradução direta da linguagem duradoura da declaração anterior, cuja tensão com a revogação subsequente deve permanecer.
- source_word: חָלִילָה לִּי
  choice: longe de mim tal coisa!
  rationale: Reproduz com força e naturalidade a fórmula hebraica de repúdio.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: honrarei os que me honram
  rationale: Preserva a repetição enfática da raiz כבד e a reciprocidade expressa no hebraico.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: mas os que me desprezam serão tidos em pouca conta
  rationale: Mantém o contraste entre honra/peso e leveza/insignificância, além de evitar especificar além do necessário quem os tratará assim.
theological_decisions:
- issue: Natureza da declaração anterior a respeito da casa de Eli
  choice: Apresentar a promessa anterior como uma declaração divina real, seguida agora por uma rejeição explícita de sua continuidade.
  alternative: Entender “para sempre” como mera hipérbole desde o início ou suavizar a mudança como simples limitação de privilégio.
  rationale: O próprio versículo põe “Eu de fato declarei” em tensão direta com “Mas agora... longe de mim tal coisa” e fundamenta a mudança na resposta humana de honrar ou desprezar Deus. A tradução preserva essa tensão sem impor uma solução sistemática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As fórmulas solenes foram mantidas sem arcaísmo excessivo; “caminhariam diante de mim” conserva a imagem e a ambiguidade funcional do hebraico.
