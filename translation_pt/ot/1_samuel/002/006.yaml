id: 1SA.2.6
reference: 1 Samuel 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: pt
  text: Yahweh faz morrer e faz viver; faz descer ao Sheol[a] e faz subir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sepultura” ou “ao mundo dos mortos”. O termo hebraico Sheol designa o domínio dos mortos e não deve ser entendido automaticamente como “inferno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém a transliteração do nome divino revelado a Israel, em vez de substituí-lo por um título como “SENHOR”.
- source_word: מֵמִית
  choice: faz morrer
  rationale: Preserva de modo natural em português o valor causativo da forma hifil de מות e a ação divina expressa no poema.
- source_word: וּמְחַיֶּה
  choice: e faz viver
  rationale: Reproduz o sentido causativo de חיה e mantém o paralelismo direto com “faz morrer”, sem restringir a expressão a uma formulação específica sobre ressurreição.
- source_word: מוֹרִיד
  choice: faz descer
  rationale: Expressa o valor causativo do hifil de ירד e conserva a correspondência poética com “faz subir”.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva a amplitude do conceito hebraico do domínio dos mortos, sem o identificar automaticamente com “inferno” nem o limitar a uma sepultura individual.
- source_word: וַיָּעַל
  choice: e faz subir
  rationale: Mantém o sentido causativo e forma um par poético claro com “faz descer”, sem acrescentar uma referência explícita à ressurreição corporal.
theological_decisions:
- issue: Se o versículo deve empregar linguagem explícita de ressurreição
  choice: Usar as expressões amplas “faz viver” e “faz subir”.
  alternative: Traduzir de forma explícita como “ressuscita” ou “faz levantar dentre os mortos”.
  rationale: O hebraico afirma poeticamente a soberania de Yahweh sobre a morte e o Sheol, mas não especifica aqui a natureza da volta à vida. A tradução conserva essa amplitude e tensão teológica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo conciso. A repetição de “faz” preserva a estrutura causativa e o ritmo do hebraico. “Sheol” é mantido como termo transliterado e explicado em nota.
