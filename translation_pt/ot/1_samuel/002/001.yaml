  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: pt
  text: 'Então Ana orou e disse:


    “Meu coração exulta em Yahweh;

    meu chifre[a] se ergue em Yahweh.

    Minha boca se abre contra os meus inimigos[b],

    pois me alegro com a tua salvação[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “chifre” é uma metáfora hebraica de força, honra ou posição elevada.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Minha boca triunfa sobre os meus inimigos” ou “Falo com ousadia contra os meus inimigos”. O hebraico diz literalmente que a boca se abre ou se alarga contra eles.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “teu livramento”. O termo hebraico pode indicar salvação em sentido amplo ou resgate concreto de uma situação de aflição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: orou
  rationale: O hitpael de פלל significa normalmente “orar”. Embora o conteúdo seja poético e celebrativo, o narrador o apresenta explicitamente como oração.
- source_word: וַתֹּאמַר
  choice: disse
  rationale: É o verbo hebraico comum para “dizer”. O texto não emprega aqui um verbo específico para cantar, por isso a formulação simples preserva melhor a fonte.
- source_word: עָלַץ לִבִּי
  choice: Meu coração exulta
  rationale: עלץ expressa alegria intensa e jubilosa. “Exulta” mantém a força poética, e “meu coração” conserva a imagem e o sujeito explícitos do hebraico.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב indica aqui a esfera ou o fundamento da exultação e da elevação. “Em Yahweh” preserva essa formulação sem reduzi-la apenas a causa ou instrumento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando no texto o nome pessoal presente no hebraico, em vez de substituí-lo por um título.
- source_word: רָמָה קַרְנִי
  choice: meu chifre se ergue
  rationale: A tradução conserva a metáfora hebraica do chifre como símbolo de força, honra ou posição elevada. “Se ergue” comunica a exaltação com naturalidade poética razoável, enquanto a nota esclarece a imagem cultural.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: Minha boca se abre amplamente contra os meus inimigos
  rationale: 'A formulação mantém a imagem corporal do hebraico: a boca se alarga ou se abre contra os adversários, indicando fala ousada e triunfante. A nota registra alternativas mais interpretativas.'
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão da exultação e da fala triunfante. “Pois” é natural no registro poético e conserva a relação causal.
- source_word: שָׂמַחְתִּי
  choice: me alegro
  rationale: O perfeito hebraico pode expressar aqui um estado resultante ou uma alegria já experimentada e agora confessada. O presente português se ajusta ao tom vivo da oração sem excluir essa nuance.
- source_word: בִּישׁוּעָתֶךָ
  choice: com a tua salvação
  rationale: יְשׁוּעָה pode designar salvação em sentido amplo ou livramento concreto. “Salvação” preserva a amplitude do termo; “me alegro com” é português atual e idiomático para a alegria ligada ao ato salvador de Deus.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” conserva o nome da aliança em vez de substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
- issue: Sentido de יְשׁוּעָה no contexto de Ana
  choice: salvação
  alternative: livramento
  rationale: O substantivo admite tanto o sentido amplo de salvação quanto o de resgate concreto da aflição. “Salvação” mantém essa amplitude teológica, enquanto a nota reconhece explicitamente o sentido contextual de “livramento”.
translation_notes:
  register: Português atual, digno e poético, com leitura natural no Brasil e compreensão internacional. Mantiveram-se o paralelismo hebraico, o nome Yahweh e as imagens corporais de “coração”, “chifre” e “boca”. As notas explicam as metáforas ou alternativas sem substituir no texto a tensão e a amplitude do original.
