  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: pt
  text: Eli estava muito velho e soube de tudo o que seus filhos faziam a todo o Israel e de que eles se deitavam com as mulheres que serviam[a] à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que se reuniam à entrada da tenda do encontro». O particípio hebraico pode indicar reunir-se ou prestar serviço de forma organizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: estava muito velho
  rationale: Expressa naturalmente o adjetivo predicativo intensificado, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: וְשָׁמַע
  choice: e soube
  rationale: O qatal narrativo apresenta como fato que Eli tomou conhecimento dos relatos; «soube» é idiomático em português neste contexto.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: tudo o que seus filhos faziam
  rationale: Abrange a totalidade da conduta habitual ou continuada dos filhos, preservando o aspecto contextual sem paráfrase excessiva.
- source_word: לְכָל יִשְׂרָאֵל
  choice: a todo o Israel
  rationale: Mantém a relação expressa pela preposição ל sem intensificá-la indevidamente como «contra».
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: eles se deitavam com as mulheres
  rationale: Reproduz o eufemismo sexual convencional do hebraico de modo claro, digno e não mais explícito que a fonte.
- source_word: הַצֹּבְאוֹת
  choice: que serviam
  rationale: No contexto do santuário, o particípio pode indicar serviço organizado; «serviam» comunica essa função sem lhes atribuir uma categoria institucional não mencionada.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Tradução clara e próxima da expressão cultual, distinguindo o local destinado ao encontro sem recorrer a formulação arcaica.
theological_decisions:
- issue: Natureza da função das mulheres no santuário
  choice: mulheres que serviam à entrada da tenda do encontro
  alternative: mulheres que se reuniam à entrada da tenda do encontro
  rationale: O particípio hebraico admite serviço organizado ou reunião. O contexto cultual e o paralelo de Êxodo 38:8 favorecem «serviam», sem importar categorias posteriores como «sacerdotisas».
- issue: Grau de explicitude ao traduzir a conduta sexual
  choice: se deitavam com
  alternative: tinham relações sexuais com
  rationale: A fonte usa um eufemismo convencional. A tradução mantém tanto a clareza quanto a reserva verbal do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação longa acompanha a estrutura cumulativa do hebraico; o pronome «eles» antes de «se deitavam» evita qualquer ambiguidade quanto ao sujeito. O marcador da nota foi colocado junto a «serviam», termo ao qual a alternativa lexical se refere.
