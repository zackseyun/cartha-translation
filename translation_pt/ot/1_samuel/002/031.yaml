source:
  edition: WLC
  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: pt
  text: Eis que vêm dias em que cortarei a sua força e a força da casa de seu pai, de modo que não haverá nenhum homem idoso em sua casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o seu braço e o braço da casa de seu pai”. Aqui, “braço” é uma metáfora hebraica para força ou poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz solenemente o anúncio profético e preserva a força dêitica do hebraico em registro bíblico ainda compreensível.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de modo natural a fórmula profética hebraica que anuncia um juízo futuro.
- source_word: וְגָדַעְתִּי
  choice: cortarei
  rationale: O verbo indica cortar ou decepá-la; aqui comunica a remoção decisiva da força e continuidade da família.
- source_word: זְרֹעֲךָ ... זְרֹעַ בֵּית אָבִיךָ
  choice: a sua força ... a força da casa de seu pai
  rationale: Embora זְרוֹעַ signifique literalmente “braço”, neste contexto funciona como metáfora de força, poder e vigor familiar. A nota conserva a imagem lexical.
- source_word: בֵּית אָבִיךָ
  choice: a casa de seu pai
  rationale: Mantém a expressão hebraica de parentesco, que designa a família ou linhagem ancestral.
- source_word: מִהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: de modo que não haverá nenhum homem idoso em sua casa
  rationale: Explicita em português o resultado do corte anunciado, sem transformar זָקֵן em título ou cargo.
theological_decisions:
- issue: Sentido metafórico de זְרוֹעַ no oráculo de juízo
  choice: Traduzir como “força” nas duas ocorrências
  alternative: Traduzir literalmente como “braço”
  rationale: A imagem hebraica do braço representa força ou poder. O contexto do juízo contra a casa de Eli, seguido da ausência de homens que cheguem à velhice, favorece a expressão do sentido metafórico; a nota preserva a forma literal.
- issue: Sentido de זָקֵן
  choice: “homem idoso” como referência à idade avançada
  alternative: “ancião” como título ou função
  rationale: O contexto trata da longevidade dos homens da casa de Eli, não de um ofício comunitário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Eis que” mantém a solenidade profética; “homem idoso” evita a possível leitura institucional de “ancião”.
