  text: וּ/בְנֵ֥י עֵלִ֖י בְּנֵ֣י בְלִיָּ֑עַל לֹ֥א יָדְע֖וּ אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: pt
  text: Os filhos de Eli eram homens perversos[a]; não conheciam Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “filhos sem valor”; tradicionalmente, “filhos de Belial”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não reconheciam Yahweh” ou “não tinham consideração por Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: Os filhos de Eli
  rationale: O waw liga a frase ao contexto, mas não exige um marcador temporal explícito. בְנֵי עֵלִי é traduzido naturalmente como “os filhos de Eli”.
- source_word: בְּנֵי בְלִיָּעַל
  choice: homens perversos
  rationale: A expressão idiomática hebraica, literalmente “filhos da indignidade”, caracteriza homens moralmente vis e corruptos. “Homens perversos” comunica esse sentido em português atual sem transformar Belial em nome próprio.
- source_word: לֹא יָדְעוּ
  choice: não conheciam
  rationale: Mantém o sentido básico de ידע e preserva a possível dimensão relacional e pactual da expressão, sem reduzi-la a uma única interpretação.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como Yahweh, tornando explícito o nome pessoal presente no hebraico; אֶת é apenas o marcador do objeto direto.
theological_decisions:
- issue: Se בְלִיָּעַל deve ser entendido como substantivo comum ou como o nome próprio Belial
  choice: 'Expressão comum de caráter moral: “homens perversos”'
  alternative: “filhos de Belial” ou, literalmente, “filhos da indignidade”
  rationale: Neste contexto, a construção caracteriza a vileza moral dos filhos de Eli e não indica claramente uma figura demoníaca chamada Belial.
- issue: Se “não conheciam Yahweh” deve ser explicitado como falta de reconhecimento ou consideração
  choice: Manter “não conheciam Yahweh”
  alternative: “não reconheciam Yahweh” ou “não tinham consideração por Yahweh”
  rationale: A tradução direta preserva a tensão entre conhecimento e relacionamento implícita no verbo hebraico, evitando restringir seu alcance teológico.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Perversos” expressa a corrupção moral do idioma hebraico sem sugerir inutilidade meramente prática. O nome Yahweh preserva o nome divino do texto-fonte.
