  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: pt
  text: Não[a], meus filhos, pois não é boa a notícia que ouço. Vocês estão levando o povo de Yahweh a transgredir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra compreensão do hebraico: “Não, meus filhos, pois não é boa a notícia que ouço o povo de Yahweh espalhar.”'
    reason: Leitura alternativa da sintaxe de מַעֲבִרִים עַם יְהוָה, na qual 'o povo de Yahweh' é sujeito de 'espalhar'.
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Funciona aqui como negativa exclamativa numa repreensão direta, e não como uma proibição simples.
- source_word: בָּנַי
  choice: meus filhos
  rationale: Tradução direta e natural do vocativo dirigido especificamente aos filhos homens de Eli.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da repreensão de Eli, preservando a relação explicativa.
- source_word: לֹא טוֹבָה
  choice: não é boa
  rationale: Mantém a formulação avaliativa e o caráter contido do idioma hebraico, sem intensificá-lo para 'é má'.
- source_word: הַשְּׁמֻעָה
  choice: a notícia
  rationale: Designa o relato que circulava sobre a conduta dos filhos; 'notícia' é corrente e não sugere necessariamente algo incerto, como 'boato'.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: que ouço
  rationale: Reproduz naturalmente a oração relativa; o presente permite entender que Eli continua recebendo esses relatos.
- source_word: מַעֲבִרִים
  choice: vocês estão levando ... a transgredir
  rationale: Interpreta o particípio hifil de עבר como causativo, com os filhos interpelados como sujeito. 'Levando ... a transgredir' mantém a ideia de indução sem tornar a causalidade excessivamente mecânica.
- source_word: עַם יְהוָה
  choice: o povo de Yahweh
  rationale: Forma natural em português para a construção de posse e preserva o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, sem introduzir uma formulação denominacional.
- issue: Interpretação de מַעֲבִרִים עַם יְהוָה
  choice: vocês estão levando o povo de Yahweh a transgredir
  alternative: a notícia que ouço o povo de Yahweh espalhar
  rationale: A leitura principal toma o particípio como causativo e entende os filhos de Eli, já interpelados, como sujeito. Como a sintaxe hebraica admite outra análise, a leitura em que o povo espalha a notícia é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases torna clara a leitura principal sem ocultar a dificuldade sintática, registrada na nota.
