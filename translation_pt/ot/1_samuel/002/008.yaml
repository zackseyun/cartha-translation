  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: pt
  text: 'Ele levanta do pó o pobre;

    ergue do monte de lixo o necessitado,

    para fazê-los sentar-se entre os nobres

    e dar-lhes como herança um assento de honra.[a]

    Pois os pilares da terra pertencem a Yahweh,[b]

    e sobre eles ele estabeleceu o mundo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um trono de honra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os fundamentos da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: levanta do pó o pobre
  rationale: Preserva a imagem concreta do hebraico e o sentido causativo de fazer o socialmente abatido erguer-se.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: ergue do monte de lixo o necessitado
  rationale: אַשְׁפֹּת designa um depósito de detritos; “monte de lixo” é claro e atual. “Necessitado” distingue אֶבְיוֹן de דָּל e mantém o paralelismo.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: para fazê-los sentar-se entre os nobres
  rationale: Expressa a finalidade ou resultado da elevação e traduz נְדִיבִים como pessoas de posição elevada.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: e dar-lhes como herança um assento de honra
  rationale: Mantém tanto a ideia causativa de receber por herança em נחל quanto a amplitude de כִּסֵּא, que pode indicar assento ou trono.
- source_word: מְצֻקֵי אֶרֶץ
  choice: os pilares da terra
  rationale: Conserva a vívida imagem cosmológica dos suportes da terra, sem convertê-la silenciosamente em linguagem abstrata.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Representa explicitamente o nome divino יהוה, conforme a camada inglesa auditada fornecida.
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: e sobre eles ele estabeleceu o mundo
  rationale: “Estabeleceu” comunica a colocação firme expressa pelo verbo, enquanto “mundo” traduz de modo natural תֵּבֵל.
theological_decisions:
- issue: Imagem cosmológica em מְצֻקֵי אֶרֶץ
  choice: Manter “os pilares da terra” no texto principal.
  alternative: “os fundamentos da terra”
  rationale: A formulação preserva a linguagem poética antiga sobre a estrutura do mundo sem exigir que ela seja lida como descrição científica literal.
- issue: Amplitude semântica de כִסֵּא כָבוֹד
  choice: “um assento de honra”
  alternative: “um trono de honra”
  rationale: “Assento de honra” expressa a elevação social dos pobres e necessitados sem determinar que todos recebam realeza; a leitura mais régia permanece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético preservado. Emprega “monte de lixo” em vez do menos corrente “monturo” e mantém “Yahweh” como nome próprio divino.
