  text: וְ/הַ/נַּ֣עַר שְׁמוּאֵ֔ל הֹלֵ֥ךְ וְ/גָדֵ֖ל וָ/ט֑וֹב גַּ֚ם עִם יְהוָ֔ה וְ/גַ֖ם עִם אֲנָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: pt
  text: O menino Samuel continuava a crescer e a ser agradável tanto a Yahweh como às pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, mais literalmente: “continuava a crescer e era bom tanto com Yahweh como com as pessoas”. A expressão pode também transmitir a ideia de ser aprovado ou de gozar de favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: O menino
  rationale: נַעַר pode designar menino, jovem ou servo jovem; neste contexto, Samuel ainda é uma criança que serve no santuário. A conjunção וְ não precisa ser explicitada isoladamente em português.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הֹלֵךְ וְגָדֵל
  choice: continuava a crescer
  rationale: A construção com הֹלֵךְ indica progressão contínua; esta formulação comunica naturalmente que Samuel seguia crescendo.
- source_word: וָטוֹב
  choice: e era bem-visto
  rationale: טוֹב é predicativo e, com עִם, descreve uma avaliação ou relação favorável. “Era bem-visto” preserva esse sentido sem transformar explicitamente a expressão em concessão de favor.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: tanto por Yahweh como pelas pessoas
  rationale: A repetição גַּם ... וְגַם forma a correlação “tanto... como...”. Neste uso geral, אֲנָשִׁים se refere aos seres humanos ou às pessoas ao redor de Samuel, não necessariamente apenas a homens adultos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio.
- issue: Natureza da avaliação de Samuel
  choice: era bem-visto
  alternative: encontrava favor
  rationale: A expressão hebraica וָטוֹב ... עִם pode indicar que Samuel era considerado bom, agradável ou favorecido em sua relação com Yahweh e com as pessoas. A tradução mantém a avaliação positiva sem especificar uma doutrina de mérito ou de favor concedido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Continuava a crescer” expressa a progressão durativa; “bem-visto” torna inteligível o idiomatismo hebraico sem eliminar sua possível nuance de aprovação ou favor.
