  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: pt
  text: E levantarei para mim um sacerdote fiel, que fará conforme o que está no meu coração e na minha alma. Eu lhe edificarei uma casa duradoura[a], e ele andará diante do meu ungido[b] todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma casa firme”; isto é, uma família ou linhagem permanente.
    reason: lexical_alternative
  - marker: b
    text: “Meu ungido” também pode ser traduzido como “meu Messias” ou, neste contexto, “meu rei”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  choice: levantarei
  rationale: Preserva a imagem de fazer alguém surgir e permanecer no ofício, sem especificar além do hebraico como se dará a nomeação.
- source_word: לִי
  choice: para mim
  rationale: Expressa a iniciativa e a finalidade divinas de modo natural em português.
- source_word: כֹּהֵן נֶאֱמָן
  choice: sacerdote fiel
  rationale: Mantém o título cultual e o sentido de confiabilidade, lealdade e constância de נֶאֱמָן.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי
  choice: conforme o que está no meu coração e na minha alma
  rationale: Conserva o padrão expresso por כַּאֲשֶׁר e a linguagem antropomórfica enfática de 'coração' e 'alma'.
- source_word: וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן
  choice: Eu lhe edificarei uma casa fiel
  rationale: Retém a metáfora de construir uma 'casa' e repete 'fiel', como faz o hebraico; a possível ideia de família ou linhagem duradoura fica explicitada em nota.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: ele andará diante de
  rationale: Preserva o idioma hebraico de conduta ou serviço contínuo e evita restringi-lo interpretativamente a 'ministrará'.
- source_word: מְשִׁיחִי
  choice: meu ungido
  rationale: Traduz o sentido lexical sem impor 'Messias' como título técnico nem limitar o referente a 'rei' no texto principal.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Reproduz diretamente a expressão hebraica, que comunica continuidade duradoura.
theological_decisions:
- issue: Referente e valor de מְשִׁיחִי ('meu ungido')
  choice: meu ungido
  alternative: meu Messias; meu rei
  rationale: O contexto histórico aponta primeiramente para o governante ungido do SENHOR, enquanto o termo também permite uma leitura messiânica mais ampla. A tradução principal preserva essa tensão sem decidir por uma identificação mais estreita.
- issue: Sentido de 'casa fiel'
  choice: manter a metáfora literal no texto principal
  alternative: casa duradoura; família ou linhagem permanente
  rationale: בַּיִת pode designar casa, família, descendência ou dinastia. Manter 'casa' preserva a metáfora e a ambiguidade, enquanto a nota esclarece o provável sentido de continuidade familiar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'edificarei' para conservar a imagem de construção com solenidade natural; mantém 'alma', 'casa fiel' e 'andará diante' para preservar as imagens e tensões do hebraico. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
