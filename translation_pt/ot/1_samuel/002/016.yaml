review_pass:
  verdict: revise
  source_fidelity: 'A estrutura dialogal e o sentido central correspondem bem ao hebraico: o ofertante pede que a gordura seja queimada antes de o servo tomar sua parte, e o servo responde com uma exigência imediata e uma ameaça. Contudo, «quanto desejar» tende a significar uma quantidade («tanto quanto desejar»), enquanto כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ se refere ao que ele desejar; «tudo o que desejar» reproduz melhor o alcance da expressão.'
  naturalness: O português é moderno, claro e adequado ao registro narrativo. «Que primeiro queimem» é compreensível, mas a ordem «Que queimem primeiro» é mais fluente. «À força» é idiomático e preserva adequadamente o tom coercitivo.
  terminology: «Gordura» é o termo apropriado para הַחֵלֶב neste contexto sacrificial. «Servo» identifica de modo claro o interlocutor que responde; «entregá-la» retoma naturalmente a porção solicitada.
  issues:
  - severity: low
    issue: «quanto desejar» pode ser entendido como quantidade, não como objeto desejado.
    rationale: A expressão hebraica significa literalmente «conforme a tua alma desejar» e, no contexto, permite ao servo tomar o que quiser. «Tudo o que desejar» evita restringir indevidamente o sentido à quantidade.
