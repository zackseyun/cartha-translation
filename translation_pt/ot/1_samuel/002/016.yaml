- from: 'E o homem lhe dizia: “Que primeiro queimem a gordura hoje; depois, tome para você quanto desejar.” Mas o servo lhe dizia: “Não! Você tem de entregá-la agora; caso contrário, eu a tomarei à força.”'
  to: 'E o homem lhe dizia: “Que queimem primeiro a gordura hoje; depois, tome para você tudo o que desejar.” Mas o servo lhe dizia: “Não! Você tem de entregá-la agora; caso contrário, eu a tomarei à força.”'
  rationale: A revisão limita-se a tornar explícito, em português natural, que o servo poderia tomar qualquer coisa que desejasse, sem alterar a sequência ritual, o caráter habitual da narrativa nem a força da ameaça.
