  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: pt
  text: 'E o homem lhe dizia: “Que queimem primeiro a gordura hoje; depois, tome para você tudo o que desejar.” Mas o servo lhe dizia: “Não! Você tem de entregá-la agora; caso contrário, eu a tomarei à força.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém o substantivo definido masculino singular e identifica naturalmente o ofertante no contexto.
- source_word: קַטֵּר יַקְטִירוּן
  choice: Que primeiro queimem
  rationale: A construção com infinitivo absoluto e forma verbal finita é enfática. “Primeiro” explicita a prioridade ritual indicada pelo contexto e pela sequência do pedido.
- source_word: כַּיּוֹם
  choice: hoje
  rationale: Reproduz de modo direto e natural a expressão temporal hebraica, embora sua função exata na frase seja pouco usual.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: Designa as porções gordurosas do sacrifício que deviam ser queimadas.
- source_word: וְקַח לְךָ
  choice: depois, tome para você
  rationale: O imperativo é dirigido ao servo; “depois” torna clara a sequência implícita sem acrescentar explicação ritual ao texto.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: quanto desejar
  rationale: Expressa em português natural o idiomatismo literal “conforme desejar sua alma”. Evita que “alma” seja entendida como uma afirmação antropológica técnica onde o hebraico significa a própria pessoa ou seu apetite.
- source_word: וְאָמַר לוֹ
  choice: Mas o servo lhe dizia
  rationale: O valor habitual combina com a cena reiterada dos versículos anteriores. “Mas” marca a resposta adversativa, e “o servo” explicita o referente exigido pela fluidez em português.
- source_word: כִּי עַתָּה תִתֵּן
  choice: Não! Você tem de entregá-la agora
  rationale: כִּי tem aqui força enfática/adversativa, não causal. O “Não!” torna natural a recusa brusca, enquanto a construção modal comunica a exigência coercitiva.
- source_word: וְאִם לֹא
  choice: caso contrário
  rationale: Equivalente idiomático e conciso da condição negativa.
- source_word: לָקַחְתִּי
  choice: eu a tomarei
  rationale: Embora formalmente perfeito, no contexto da ameaça a forma tem sentido modal ou futuro.
- source_word: בְחָזְקָה
  choice: à força
  rationale: Comunica de forma direta a ideia de apreensão mediante coerção ou uso de poder.
theological_decisions:
- issue: Ordem do procedimento sacrificial
  choice: Explicitar que a gordura deve ser queimada primeiro e que só depois o servo pode tomar carne.
  alternative: 'Traduzir a construção enfática mais literalmente, sem explicitar a sequência: “Que certamente queimem hoje a gordura, e tome para você...”'
  rationale: O protesto do ofertante contrasta o procedimento sacrificial devido com o abuso dos servos. A sequência está implícita no contexto, mas não se acrescenta ao texto qualquer explicação doutrinária ou ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. O diálogo preserva a escalada entre o pedido respeitoso do ofertante e a ameaça coercitiva do servo. Não foram necessárias notas de rodapé; portanto, não há marcadores no texto principal.
