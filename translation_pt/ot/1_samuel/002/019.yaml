base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: pt
  text: Sua mãe fazia para ele um pequeno manto[a] e o levava até ele, de ano em ano[b], quando subia com o marido para oferecer o sacrifício anual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma pequena túnica” ou “uma pequena veste”. O hebraico מְעִיל se refere a uma veste exterior; “manto” representa bem essa categoria de vestimenta no provável contexto do santuário.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de dias em dias”, expressão que significa “de ano em ano” ou “ano após ano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: túnica
  rationale: Designa uma veste exterior; “túnica” é natural em português e se ajusta ao provável contexto de serviço no santuário.
- source_word: קָטֹן
  choice: pequena
  rationale: Indica que a veste tinha tamanho adequado para uma criança.
- source_word: תַּעֲשֶׂה
  choice: fazia
  rationale: O imperfeito hebraico expressa aqui uma ação habitual no passado.
- source_word: וְהַעַלְתָה לּוֹ
  choice: e a levava para ele
  rationale: Preserva o movimento de subida ao santuário e retoma naturalmente a túnica como objeto.
- source_word: מִיָּמִים יָמִימָה
  choice: de ano em ano
  rationale: A expressão hebraica, literalmente relacionada a “dias”, é um idiomatismo que indica recorrência anual.
- source_word: בַּעֲלוֹתָהּ
  choice: quando subia
  rationale: Mantém a linguagem de subida associada à peregrinação ao santuário.
- source_word: אִישָׁהּ
  choice: o marido
  rationale: Neste contexto relacional, אִישׁ com o sufixo significa “marido”.
- source_word: לִזְבֹּחַ
  choice: para oferecer
  rationale: Em combinação com “sacrifício”, expressa de modo natural o ato cultual.
- source_word: זֶבַח הַיָּמִים
  choice: o sacrifício anual
  rationale: Refere-se ao sacrifício realizado regularmente a cada ano; “anual” é claro e idiomático.
