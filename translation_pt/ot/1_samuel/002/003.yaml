  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: pt
  text: Não continuem falando com tamanha arrogância; não deixem a arrogância sair da boca de vocês, pois Yahweh é Deus que tudo sabe, e por ele os atos são pesados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais estritamente o texto consonantal: “e os atos não são pesados”. O texto principal segue a leitura tradicional segundo a qual Yahweh avalia os atos humanos.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: Não continuem falando
  rationale: A construção com רבה e um verbo finito seguinte indica ação intensificada ou repetida. A formulação preserva a proibição e expressa continuidade em português natural.
- source_word: גְּבֹהָה גְבֹהָה
  choice: com tanto orgulho
  rationale: A repetição enfatiza a altivez do discurso. A expressão adverbial comunica essa intensidade sem reproduzir de modo artificial a duplicação hebraica.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: não deixem a arrogância sair da boca de vocês
  rationale: עָתָק designa arrogância, insolência ou fala presunçosa. A proibição da oração anterior é mantida implicitamente no hebraico e explicitada em português para clareza.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: Yahweh é Deus de conhecimento
  rationale: O plural דֵּעוֹת pode indicar plenitude ou abrangência do conhecimento. 'Deus de conhecimento' preserva de perto a construção sem acrescentar 'todo', que não está expresso diretamente.
- source_word: ו/לא נִתְכְּנוּ עֲלִלוֹת
  choice: e por ele as ações são pesadas
  rationale: A leitura tradicional entende a cláusula como uma afirmação de que Deus pesa ou avalia as ações. 'Pesadas' conserva a metáfora hebraica, enquanto a nota registra a leitura mais estrita do texto consonantal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. 'Yahweh' representa o nome pessoal divino sem o substituir por um título.
- issue: Interpretação de ו/לא נִתְכְּנוּ עֲלִלוֹת
  choice: e por ele as ações são pesadas
  alternative: e as ações não são pesadas
  rationale: A leitura adotada, tradicional e contextualmente coerente, apresenta Yahweh como aquele que avalia os atos humanos. Como o texto consonantal permite a negação, a alternativa significativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural coerentes com o destinatário coletivo. A metáfora de pesar ações foi preservada, e o nome divino foi transliterado como Yahweh.
