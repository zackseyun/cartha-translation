  text: וַ/יִּכְרְת֧וּ שְׁנֵי/הֶ֛ם בְּרִ֖ית לִ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/חֹ֔רְשָׁה וִ/יהוֹנָתָ֖ן הָלַ֥ךְ לְ/בֵיתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: pt
  text: E os dois fizeram uma aliança diante de Yahweh[a]. Depois, Davi permaneceu na região de mata[b], e Jônatas foi para sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “cortaram uma aliança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em Horesa”. O hebraico pode ser entendido como um nome de lugar ou como referência a uma região de mata.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: fizeram
  rationale: O hebraico usa literalmente o verbo “cortar” na expressão idiomática כרת ברית. Em português atual, “fazer uma aliança” comunica naturalmente o ato, enquanto a forma literal é registrada em nota.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Expressa de modo claro e natural o sentido dual, referindo-se conjuntamente a Davi e Jônatas.
- source_word: בְּרִית
  choice: aliança
  rationale: “Aliança” preserva a solenidade e a dimensão relacional do termo neste contexto; “acordo” seria mais fraco, e “tratado”, excessivamente político.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Reproduz de maneira concisa a ideia de que a aliança foi firmada na presença de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: No contexto, o verbo indica que Davi continuou naquele lugar, não que literalmente se sentou.
- source_word: בַּחֹרְשָׁה
  choice: na região de mata
  rationale: A forma pode ser entendida como substantivo comum referente a bosque, mata ou região arborizada. Esta tradução mantém essa leitura sem excluir, na nota, a possibilidade de um topônimo.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: foi para sua casa
  rationale: Segue de perto a construção hebraica e permanece natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título; “Javé” é uma forma portuguesa tradicional, mas menos próxima da transliteração adotada pelo projeto.
- issue: Natureza da aliança entre Davi e Jônatas
  choice: aliança
  alternative: acordo; tratado
  rationale: A tradução mantém o termo amplo e solene do hebraico, sem definir além do texto o conteúdo teológico, político ou pessoal dessa aliança.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Região de mata” soa natural no português do Brasil e conserva a ambiguidade lexical por meio da nota. Os nomes próprios seguem as formas portuguesas Davi e Jônatas; o nome divino é apresentado como Yahweh.
