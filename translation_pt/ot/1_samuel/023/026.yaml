  text: וַ/יֵּ֨לֶךְ שָׁא֜וּל מִ/צַּ֤ד הָ/הָר֙ מִ/זֶּ֔ה וְ/דָוִ֧ד וַ/אֲנָשָׁ֛י/ו מִ/צַּ֥ד הָ/הָ֖ר מִ/זֶּ֑ה וַ/יְהִ֨י דָוִ֜ד נֶחְפָּ֤ז לָ/לֶ֨כֶת֙ מִ/פְּנֵ֣י שָׁא֔וּל וְ/שָׁא֣וּל וַ/אֲנָשָׁ֗י/ו עֹֽטְרִ֛ים אֶל דָּוִ֥ד וְ/אֶל אֲנָשָׁ֖י/ו לְ/תָפְשָֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: pt
  text: Saul avançava por um lado do monte[a], e Davi e seus homens, pelo outro. Davi se apressava para se afastar de Saul, enquanto Saul e seus homens fechavam o cerco sobre Davi e seus homens[b], a fim de capturá-los[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Saul ia pelo lado do monte deste lado, e Davi e seus homens pelo lado do monte deste lado”. A tradução expressa o contraste pretendido como “um lado” e “o outro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cercavam Davi e seus homens”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “agarrá-los” ou “prendê-los”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: avançava
  rationale: O wayyiqtol faz a narrativa prosseguir, mas, neste contexto, descreve o movimento simultâneo dos dois grupos em lados distintos do monte. O imperfeito português expressa bem essa ação em curso.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: por um lado do monte ... pelo outro
  rationale: O hebraico repete literalmente uma expressão dêitica, ‘deste lado’, para cada grupo. Em português natural, a oposição espacial pretendida fica clara com ‘um lado’ e ‘o outro’, sem sugerir que ambos estavam no mesmo lado.
- source_word: נֶחְפָּז
  choice: se apressava
  rationale: O particípio nifal indica pressa e urgência. ‘Se apressava’ mantém esse sentido sem acrescentar a ideia específica de pânico.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: para se afastar de Saul
  rationale: A expressão significa literalmente ir para longe da presença ou diante de Saul. ‘Afastar-se’ é natural em português e evita intensificar o verbo para ‘fugir’, embora o contexto seja de perseguição.
- source_word: עֹטְרִים אֶל
  choice: fechavam o cerco sobre
  rationale: O particípio descreve as forças de Saul cercando ou convergindo sobre Davi. ‘Fechavam o cerco sobre’ comunica com clareza o movimento tático em andamento, preservando ‘cercavam’ como alternativa possível.
- source_word: לְתָפְשָׂם
  choice: a fim de capturá-los
  rationale: O infinitivo com sufixo pronominal indica a finalidade da aproximação. ‘Capturar’ se ajusta ao contexto militar, enquanto ‘agarrar’ ou ‘prender’ também são possibilidades lexicais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção elíptica ‘e Davi e seus homens, pelo outro’ evita repetição pesada, e ‘monte’ preserva o termo geográfico tradicional sem soar arcaico.
