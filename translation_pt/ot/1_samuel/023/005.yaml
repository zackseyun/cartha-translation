  text: וַ/יֵּ֣לֶךְ דָּוִד֩ ו/אנש/ו קְעִילָ֜ה וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יִּנְהַג֙ אֶת מִקְנֵי/הֶ֔ם וַ/יַּ֥ךְ בָּ/הֶ֖ם מַכָּ֣ה גְדוֹלָ֑ה וַ/יֹּ֣שַׁע דָּוִ֔ד אֵ֖ת יֹשְׁבֵ֥י קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: pt
  text: Então Davi e seus homens foram a Queila. Davi lutou contra os filisteus, levou embora os rebanhos deles[a] e lhes impôs uma grande derrota[b]. Assim, Davi salvou os habitantes de Queila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o gado deles” ou “os animais de criação deles”; o termo hebraico abrange os animais possuídos como rebanhos ou manadas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “feriu-os com um grande golpe”; também pode ser traduzido como “causou-lhes uma derrota esmagadora” ou “uma grande matança”.
    reason: lexical_alternative
  - marker: c
    text: Ou “livrou” ou “resgatou” os habitantes de Queila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשׁוֹ
  choice: Davi e seus homens foram
  rationale: Preserva a sequência narrativa e entende אֲנָשׁוֹ como o grupo de combatentes que acompanhava Davi.
- source_word: קְעִילָה
  choice: Queila
  rationale: Transliteração portuguesa tradicional e facilmente reconhecível do nome do lugar.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: Davi lutou contra os filisteus
  rationale: A preposição בְּ marca aqui o adversário. A repetição de “Davi” deixa claro, em português, o sujeito singular dos verbos hebraicos seguintes.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: levou embora os rebanhos deles
  rationale: נהג descreve conduzir animais, e מִקְנֶה é um termo coletivo amplo para animais de criação. “Levou embora” comunica naturalmente sua remoção no contexto militar.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: lhes impôs uma grande derrota
  rationale: Expressa de modo idiomático a construção hebraica “feriu-os com um grande golpe”, sem determinar além do texto o número de mortos.
- source_word: וַיֹּשַׁע
  choice: salvou
  rationale: ישע denota salvar ou livrar de perigo; “salvou” é direto, atual e adequado ao contexto militar.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: os habitantes de Queila
  rationale: Representa com concisão o particípio substantivado, literalmente “os que habitavam em Queila”.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e de ampla compreensão, com boa legibilidade brasileira. A divisão em frases e a repetição de “Davi” evitam uma mudança ambígua de sujeito, preservando ao mesmo tempo os verbos hebraicos no singular. As notas mantêm abertas as nuances de מִקְנֶה, מַכָּה e ישע.
