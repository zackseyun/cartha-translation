base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: pt
  text: 'Então Davi consultou Yahweh: “Devo ir e atacar estes filisteus?” Yahweh disse a Davi: “Vá, ataque os filisteus e salve Queila[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “livre Queila”.'
    reason: Alternativa lexical legítima para וְהוֹשַׁעְתָּ no contexto de resgate militar.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consultou Yahweh
  rationale: A construção com שׁאל e בַּיהוָה indica buscar orientação divina, não apenas fazer uma pergunta casual; “consultou” comunica isso naturalmente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, em conformidade com a decisão teológica fornecida.
- source_word: הַאֵלֵךְ
  choice: Devo ir
  rationale: A forma interrogativa e o imperfeito expressam deliberação sobre o que fazer; “Devo ir” é corrente e mantém a força consultiva.
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: atacar / ataque
  rationale: Neste contexto militar, נכה descreve golpear ou atacar. “Atacar” é natural em português e não presume necessariamente a vitória, além de preservar a repetição entre pergunta e resposta.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: esses filisteus
  rationale: Mantém o demonstrativo הָאֵלֶּה e identifica o grupo específico de filisteus em questão.
- source_word: וְהוֹשַׁעְתָּ
  choice: salve
  rationale: O hifil de ישׁע significa salvar, livrar ou resgatar; “salve” é conciso e adequado ao livramento militar da cidade.
- source_word: קְעִילָה
  choice: Queila
  rationale: Transliteração tradicional e reconhecível em português do nome do lugar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” conserva o caráter de nome próprio e segue a orientação teológica fornecida, sem substituí-lo por um título.
- issue: Sentido de וְהוֹשַׁעְתָּ no contexto
  choice: salve
  alternative: livre
  rationale: “Salve” mantém a amplitude lexical do verbo, enquanto o contexto deixa claro que se trata de salvar Queila de uma ameaça militar, não de especificar uma salvação espiritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula hebraica לֵאמֹר foi incorporada naturalmente pelos dois-pontos, evitando o rígido “dizendo”. A coordenação direta dos imperativos conserva a concisão do hebraico.
