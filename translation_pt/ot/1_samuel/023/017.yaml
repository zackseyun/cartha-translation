  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: pt
  text: 'Ele lhe disse: “Não tenha medo, pois a mão de Saul, meu pai, não alcançará você.[a] Você reinará sobre Israel, e eu serei o segundo depois de você.[b] Até Saul, meu pai, sabe disso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a mão de Saul, meu pai, não encontrará você”; “mão” representa poder ou domínio. Outra tradução possível: “o poder de Saul, meu pai, não atingirá você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu ocuparei o segundo lugar ao seu lado”; isto é, estarei subordinado a você.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Forma idiomática e corrente em português para a proibição com ירא, preservando sua força direta.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: a mão de Saul, meu pai, não alcançará você
  rationale: Mantém a imagem hebraica da “mão” como poder ou domínio, enquanto “alcançará” expressa de modo natural a ameaça de Saul conseguir apoderar-se de Davi.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: Você reinará sobre Israel
  rationale: Traduz מלך como verbo e comunica claramente o futuro exercício da realeza.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: e eu serei o segundo depois de você
  rationale: Preserva a ideia de posição subordinada em segundo lugar sem introduzir um título administrativo moderno específico.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: Até Saul, meu pai, sabe disso
  rationale: “Até” expressa naturalmente o valor enfático de וְגַם no contexto, e “disso” retoma toda a afirmação anterior.
theological_decisions:
- issue: Grau de explicitação da previsão de Jônatas sobre o reinado de Davi e sua própria posição subordinada
  choice: Apresentar a declaração como expectativa direta de que Davi reinará e Jônatas ocupará o segundo lugar, sem acrescentar linguagem messiânica, pactual ou profética
  alternative: Explicitar a fala como profecia teológica da nomeação divina de Davi
  rationale: O versículo afirma a convicção de Jônatas, mas nesta frase não menciona expressamente o SENHOR nem qualifica a declaração como profecia. A tradução preserva essa tensão sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “a mão de Saul” conserva a imagem concreta do hebraico, esclarecida em nota; “o segundo depois de você” evita tanto arcaísmo quanto um título burocrático excessivamente moderno.
