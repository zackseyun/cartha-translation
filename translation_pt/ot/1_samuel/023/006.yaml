  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: pt
  text: Quando Abiatar, filho de Aimeleque, fugiu para Davi, em Queila, ele desceu com um éfode na mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um éfode desceu em sua mão”; o hebraico também pode ser entendido com “éfode” como sujeito de “desceu”.'
    reason: Preserva a ambiguidade sintática do hebraico quanto à relação entre “desceu” e “éfode”, sem definir a natureza do objeto cultual.
lexical_decisions:
- source_word: וַיְהִי
  choice: Quando
  rationale: A fórmula narrativa é integrada à oração temporal seguinte, sem acrescentar um advérbio como “então” ou recorrer ao arcaico “aconteceu que”.
- source_word: בִּבְרֹחַ
  choice: quando ... fugiu
  rationale: A preposição ב com o infinitivo construto expressa circunstância temporal; “quando ... fugiu” é natural e fiel em português.
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: Abiatar, filho de Aimeleque
  rationale: Emprega as formas portuguesas tradicionais dos nomes e preserva diretamente o patronímico.
- source_word: אֶל דָּוִד קְעִילָה
  choice: para junto de Davi em Queila
  rationale: O texto indica movimento em direção a Davi e associa Queila ao local em que ele se encontrava. A formulação evita sugerir que “Davi” seja um lugar, embora a sintaxe hebraica seja compacta.
- source_word: אֵפוֹד
  choice: colete sacerdotal
  rationale: O termo designa um objeto cultual ligado ao sacerdócio. A tradução funcional é mais compreensível ao leitor comum do que a simples transliteração “éfode”, sem definir além disso sua forma exata.
- source_word: יָרַד
  choice: desceu
  rationale: Preserva o sentido direcional básico de ירד e também a mudança abrupta de sujeito possível na oração hebraica.
- source_word: בְּיָדוֹ
  choice: levando na mão
  rationale: Mantém a imagem concreta de algo em sua mão e produz uma construção portuguesa natural.
theological_decisions:
- issue: Natureza de אֵפוֹד no contexto
  choice: “colete sacerdotal”, sem especificar função divinatória, materiais ou formato
  alternative: “éfode”
  rationale: O contexto liga o objeto ao sacerdote, mas o versículo não fornece detalhes suficientes para uma definição mais estreita. A escolha comunica sua natureza cultual sem importar uma interpretação doutrinária específica.
- issue: Sujeito de יָרַד
  choice: 'Entender Abiatar como sujeito implícito: ele desceu levando o colete sacerdotal'
  alternative: 'Entender “o colete sacerdotal” como sujeito: “um colete sacerdotal desceu em sua mão”'
  rationale: A leitura com Abiatar como sujeito é sintaticamente natural no fluxo narrativo e mais clara em português, mas a ordem hebraica permite relacionar o verbo mais diretamente ao objeto; essa ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Para junto de” expressa movimento em direção a uma pessoa. A nota conserva a ambiguidade criada pela ordem hebraica. O marcador [a] aparece no texto principal.
