base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/008.yaml
  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: pt
  text: Então Saul convocou todo o povo para a guerra[a], a fim de descer a Queila e sitiar Davi e seus homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mobilizou todo o povo para a batalha”. O verbo hebraico pode significar literalmente “fez ouvir” e, neste contexto, provavelmente se refere a convocar o povo para uma ação militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: convocou
  rationale: No hifil, o verbo pode significar literalmente “fez ouvir”; neste contexto militar, indica fazer uma convocação ou mobilizar. “Convocou” expressa naturalmente esse sentido causativo sem transformar o povo explicitamente em exército.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Preserva a expressão hebraica, embora o contexto indique as pessoas mobilizadas para a ação militar.
- source_word: לַמִּלְחָמָה
  choice: para a guerra
  rationale: A preposição indica finalidade. A formulação mantém o sentido militar amplo do hebraico.
- source_word: לָרֶדֶת
  choice: descer
  rationale: Equivalente direto e natural de ירד no relato de deslocamento.
- source_word: קְעִילָה
  choice: Queila
  rationale: Forma tradicional e inteligível do topônimo em português bíblico.
- source_word: לָצוּר
  choice: cercar
  rationale: Neste contexto, צור descreve a ação militar de sitiar ou manter o alvo cercado. “Cercar” é claro e natural, e se aplica adequadamente a Davi e seus homens dentro de Queila.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: Davi e seus homens
  rationale: Com o verbo צור, אֶל marca os alvos da ação. “Seus homens” conserva a generalidade do hebraico sem especificá-los como soldados.
theological_decisions: []
translation_notes:
