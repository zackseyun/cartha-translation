  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: pt
  text: '“Os homens de Queila me entregarão nas mãos dele[a]? Saul descerá, como teu servo ouviu? Ó Yahweh, Deus de Israel, por favor, informa teu servo.” E Yahweh disse: “Ele descerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão dele”, expressão que significa ficar sob o poder ou controle de Saul.'
    reason: A nota preserva a forma singular da expressão hebraica e explica seu sentido, enquanto o texto principal usa o plural idiomático natural em português.
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: me entregarão
  rationale: O hifil de סגר indica entregar alguém ao poder de outro. “Entregar” comunica com naturalidade a transferência hostil implícita no contexto.
- source_word: בַעֲלֵי קְעִילָה
  choice: os homens de Queila
  rationale: Embora בעלי possa significar literalmente “donos” ou “senhores”, neste contexto cívico designa os homens representativos ou habitantes da cidade; a formulação preserva essa amplitude sem especificar indevidamente apenas autoridades.
- source_word: בְיָדוֹ
  choice: nas mãos dele
  rationale: Mantém a imagem hebraica da mão como poder ou controle. O pronome se refere a Saul; o plural é a forma idiomática natural em português.
- source_word: יֵרֵד
  choice: descerá
  rationale: Traduz diretamente o movimento expresso por ירד e é repetido na pergunta e na resposta, como no hebraico.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: como este teu servo ouviu
  rationale: Conserva o apelo de Davi à notícia recebida. “Este teu servo” torna clara e natural em português a humilde autorreferência na terceira pessoa.
- source_word: עַבְדֶּךָ
  choice: teu servo
  rationale: Na linguagem de oração, עבד expressa submissão e humilde autorreferência diante de Deus, sem exigir aqui o sentido social específico de “escravo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הַגֶּד נָא
  choice: por favor, revela isso
  rationale: O imperativo de נגד com נא é um pedido respeitoso e urgente para que Deus dê a conhecer a resposta. O objeto “isso” fica implícito no hebraico, mas é natural e contextualmente explícito em português.
- source_word: וַיֹּאמֶר יְהוָה
  choice: E Yahweh respondeu
  rationale: O verbo אמר introduz a fala divina; “respondeu” explicita naturalmente sua função no diálogo, sem alterar o conteúdo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová; Iavé
  rationale: O texto traz diretamente o tetragrama. A forma “Yahweh” preserva o nome pessoal e segue a decisão terminológica fornecida, em vez de substituí-lo pelo título “SENHOR”.
- issue: A resposta divina menciona apenas a descida de Saul
  choice: Preservar somente “Ele descerá”
  alternative: Completar também a resposta à pergunta sobre os homens de Queila com base no versículo seguinte
  rationale: Neste versículo, a resposta registrada trata apenas da descida de Saul. A outra pergunta recebe resposta no versículo seguinte; não se deve antecipá-la nem harmonizar o diálogo.
translation_notes:
  register: Português atual, digno e acessível, com colocação pronominal de ampla legibilidade brasileira e vocabulário compreensível internacionalmente. O marcador [a] foi colocado junto à expressão que a nota realmente explica. A ordem das duas perguntas segue o texto hebraico.
