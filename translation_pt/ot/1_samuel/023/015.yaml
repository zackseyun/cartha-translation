base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: pt
  text: Davi percebeu que Saul tinha saído para lhe tirar a vida, enquanto Davi estava no deserto de Zife, em Horesa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na mata” ou “na região arborizada”. O hebraico pode ser entendido como substantivo comum, mas aqui provavelmente se refere ao lugar chamado Horesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: percebeu
  rationale: O verbo ראה significa literalmente “ver”, mas também pode indicar percepção ou reconhecimento. “Percebeu” comunica com naturalidade que Davi tomou conhecimento da movimentação de Saul.
- source_word: כִּי
  choice: que
  rationale: 'Aqui כִּי introduz o conteúdo percebido por Davi: Saul tinha saído em sua busca.'
- source_word: יָצָא
  choice: tinha saído
  rationale: O mais-que-perfeito composto expressa que a saída de Saul já havia ocorrido quando Davi a percebeu e preserva o sentido básico de יצא.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: para lhe tirar a vida
  rationale: A expressão hebraica é literalmente “buscar a vida dele” e, neste contexto, indica a intenção de matar. A formulação portuguesa transmite o sentido ameaçador do idioma sem recorrer a uma construção artificial.
- source_word: בְּמִדְבַּר זִיף
  choice: no deserto de Zife
  rationale: מִדְבָּר designa uma região erma ou estepe. “Deserto” é corrente e claro em português para essa paisagem, sem exigir a ideia de um mar de areia.
- source_word: בַּחֹרְשָׁה
  choice: em Horesa[a]
  rationale: Embora חֹרְשָׁה possa ser entendido como substantivo comum, “mata” ou “região arborizada”, o contexto favorece seu uso como topônimo. A nota preserva a alternativa lexical.
- source_word: וְדָוִד
  choice: enquanto ele estava
  rationale: A conjunção introduz uma oração circunstancial que informa onde Davi se encontrava. O pronome evita repetição, e “enquanto” explicita naturalmente a relação com a ação anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de leitura corrente no Brasil. A sintaxe narrativa foi tornada natural sem eliminar a alternativa entre topônimo e substantivo comum em בַּחֹרְשָׁה.
