review_pass:
  verdict: revise
  source_fidelity: O hebraico diz literalmente que um mensageiro veio a Saul e lhe disse para se apressar e ir, pois os filisteus haviam realizado uma incursão contra/sobre a terra. O rascunho preserva bem o mensageiro e a urgência, mas “venha” altera o imperativo וְלֵכָה (“vá/parte”), e “invadiram” pode sugerir uma ocupação mais ampla do que a incursão indicada por פָּשְׁטוּ.
  naturalness: A redação é clara e natural em português moderno. “Depressa, vá!” mantém a urgência e corresponde diretamente ao movimento exigido no hebraico. “Fizeram uma incursão contra a terra” é um pouco mais formal, mas apropriado ao registro narrativo e mais preciso que “invadiram a terra”.
  terminology: “Mensageiro” é correto para מַלְאָךְ neste contexto humano. “Filisteus” e “terra” são adequados. “Incursão” representa bem o ataque de saque/raide expresso pelo verbo hebraico, sem impor a noção de conquista permanente.
  issues:
  - severity: medium
    issue: “venha” para וְלֵכָה
    rationale: O imperativo hebraico é de ir/partir, não de vir. A tradução deve dizer “vá” (ou equivalente).
  - severity: low
    issue: “invadiram a terra” para פָשְׁטוּ ... עַל־הָאָרֶץ
    rationale: O verbo normalmente descreve uma incursão ou raide hostil. “Invadiram” é possível em sentido amplo, mas pode intensificar indevidamente o alcance da ação; “fizeram uma incursão contra a terra” preserva melhor a nuance.
