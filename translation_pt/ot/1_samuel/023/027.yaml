lexical_decisions:
- source_word: מַלְאָךְ
  choice: mensageiro
  rationale: No contexto, designa um mensageiro humano que traz uma notícia urgente; evita a associação indevida com um anjo.
- source_word: מַהֲרָה וְלֵכָה
  choice: Depressa, venha!
  rationale: Reproduz de modo natural e urgente a sequência imperativa hebraica, cujo sentido contextual é chamar Saul para partir ao encontro da ameaça.
- source_word: פָשְׁטוּ
  choice: invadiram
  rationale: O verbo descreve uma incursão ou ataque súbito; “invadiram” comunica com clareza que os filisteus entraram no território para atacar.
- source_word: עַל־הָאָרֶץ
  choice: a terra
  rationale: Neste contexto, a preposição expressa movimento hostil contra/sobre o território; em português, “invadiram a terra” é a formulação idiomática.
