base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: pt
  text: 'Agora, pois, ó rei, desça conforme todo o desejo da sua alma[a]; sim, desça![b] E a nós caberá entregá-lo nas mãos do rei.


    [a] “Desejo da sua alma” é uma expressão hebraica que indica um desejo profundo ou uma vontade intensa; também poderia ser traduzida por “desejo do seu coração”.


    [b] O hebraico repete o verbo “descer” — primeiro no infinitivo e depois no imperativo — para dar ênfase.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Desejo da sua alma” é uma expressão hebraica que indica um desejo profundo ou uma vontade intensa; também poderia ser traduzida por “desejo do seu coração”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete o verbo “descer” — primeiro no infinitivo e depois no imperativo — para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Marca uma transição imediata para o apelo. “Agora, pois” representa tanto a conjunção quanto a função discursiva da expressão hebraica.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: conforme todo o desejo da sua alma
  rationale: Conserva a ideia de plena conformidade com a vontade do rei e mantém a imagem hebraica da alma como sede do desejo.
- source_word: הַמֶּלֶךְ
  choice: ó rei
  rationale: O substantivo definido funciona como vocativo no discurso direto. “Ó rei” torna explícita essa função em português digno e natural.
- source_word: לָרֶדֶת רֵד
  choice: desça ... sim, desça!
  rationale: A combinação hebraica de infinitivo e imperativo intensifica o pedido. A repetição com “sim” preserva a ênfase sem produzir uma construção portuguesa obscura.
- source_word: וְלָנוּ
  choice: E a nós caberá
  rationale: 'Expressa a responsabilidade assumida pelos falantes: entregar Davi é a parte que lhes compete.'
- source_word: הַסְגִּירוֹ
  choice: entregá-lo
  rationale: O hifil de סגר significa aqui entregar alguém ao poder de outra pessoa. “Entregá-lo” é claro e adequado ao contexto hostil.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: nas mãos do rei
  rationale: Reproduz em português corrente a expressão semítica de transferência ao poder ou controle de alguém. O plural idiomático português comunica naturalmente o sentido do singular hebraico.
theological_decisions: []
