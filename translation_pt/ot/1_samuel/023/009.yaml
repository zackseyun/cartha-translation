  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּ֣י עָלָ֔י/ו שָׁא֖וּל מַחֲרִ֣ישׁ הָ/רָעָ֑ה וַ/יֹּ֨אמֶר֙ אֶל אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן הַגִּ֖ישָׁ/ה הָ/אֵפֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: pt
  text: 'Quando Davi soube que Saul tramava em segredo fazer-lhe mal[a], disse ao sacerdote Abiatar: “Traga o éfode para cá.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “maquinava o mal contra ele”.'
    reason: lexical_alternative
  - marker: b
    text: O éfode era um objeto ou veste sacerdotal associado, neste contexto narrativo, à busca da orientação de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: soube
  rationale: No fluxo narrativo, o verbo indica que Davi tomou conhecimento naquele momento; “soube” é natural e preserva esse valor contextual.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Davi soube.
- source_word: עָלָיו
  choice: fazer-lhe / contra ele
  rationale: A preposição tem sentido hostil neste contexto e é expressa idiomaticamente na construção “fazer-lhe mal”.
- source_word: מַחֲרִישׁ
  choice: tramava em segredo
  rationale: O particípio descreve uma ação em andamento de planejar ou maquinar, com nuance de ocultação; “tramava em segredo” comunica ambos os aspectos.
- source_word: הָרָעָה
  choice: mal
  rationale: “Mal” preserva a amplitude moral e concreta do hebraico, enquanto a construção “fazer-lhe mal” deixa claro que Saul pretendia prejudicar Davi.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: ao sacerdote Abiatar
  rationale: Identifica Abiatar por sua função em uma ordem natural no português contemporâneo.
- source_word: הַגִּישָׁה
  choice: Traga ... para cá
  rationale: O imperativo causativo significa aproximar ou apresentar algo; esta formulação preserva a ordem de modo natural.
- source_word: הָאֵפוֹד
  choice: o éfode
  rationale: Mantém o termo técnico tradicional para o objeto ou veste sacerdotal específico empregado neste contexto.
theological_decisions:
- issue: Natureza da intenção de Saul em מַחֲרִישׁ הָרָעָה
  choice: Saul tramava em segredo fazer mal a Davi
  alternative: Saul maquinava o mal contra Davi
  rationale: A formulação principal comunica a ameaça concreta e a nuance de planejamento oculto sem restringir “mal” a uma categoria exclusivamente moral; a alternativa registra uma tradução mais formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tramava em segredo” mantém o tom narrativo e a hostilidade implícita; “éfode” conserva a terminologia bíblica específica, explicada em nota.
