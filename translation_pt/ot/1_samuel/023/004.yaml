base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: pt
  text: 'Davi tornou a consultar o SENHOR, e o SENHOR lhe respondeu: “Levante-se e desça a Queila, pois entregarei os filisteus em suas mãos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד ... לִשְׁאֹל
  choice: tornou a consultar
  rationale: A construção hebraica indica repetição; esta formulação é natural em português e preserva o sentido de que Davi consultou novamente.
- source_word: בַּיהוָה
  choice: o SENHOR
  rationale: Representa o tetragrama יהוה segundo a convenção editorial bíblica tradicional em português, sem acrescentar nota desnecessária.
- source_word: קוּם רֵד
  choice: Levante-se e desça
  rationale: Mantém os dois imperativos do hebraico em linguagem clara e dignificada.
- source_word: אֲנִי נֹתֵן
  choice: entregarei
  rationale: O particípio hebraico expressa a ação divina iminente e assegurada; o futuro em português comunica isso naturalmente.
- source_word: בְּיָדֶךָ
  choice: em suas mãos
  rationale: Conserva a metáfora hebraica de poder e vitória, usando uma expressão corrente em português.
theological_decisions:
- issue: A declaração divina אֲנִי נֹתֵן pode ser entendida como ação já em curso ou promessa iminente.
  choice: entregarei
  alternative: estou entregando
  rationale: O futuro se ajusta ao contexto anterior à batalha sem enfraquecer a certeza da ação divina nem impor uma distinção temporal excessiva.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A sintaxe foi suavizada para evitar a redundância literal “respondeu-lhe e disse”, sem perda de conteúdo. “Queila” e “filisteus” seguem formas bíblicas correntes.
