base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: pt
  text: Então Saul deixou de perseguir Davi e foi ao encontro dos filisteus. Por isso, aquele lugar foi chamado Rocha das Divisões[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Rocha das Separações” ou “Rocha da Separação”. É provável que o nome se refira ao momento em que Saul interrompeu a perseguição e se separou de Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: desistiu
  rationale: Neste contexto, שוב com a construção seguinte indica que Saul interrompeu e abandonou a perseguição em curso; “desistiu de perseguir” comunica isso naturalmente em português.
- source_word: מִרְדֹף אַחֲרֵי דָוִד
  choice: de perseguir Davi
  rationale: A preposição מן com o infinitivo expressa afastamento ou cessação da atividade; רדף tem aqui sentido militar de perseguir.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: ao encontro dos filisteus
  rationale: לקראת indica movimento para encontrar alguém e não determina por si só se o encontro é pacífico ou hostil; a tradução preserva essa amplitude.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Fórmula etiológica que introduz a explicação do nome do lugar; “Por isso” é claro, atual e digno.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: aquele lugar foi chamado
  rationale: O plural hebraico não identifica os agentes; a voz passiva evita acrescentar um sujeito inexistente no texto.
- source_word: סֶלַע הַמַּחְלְקוֹת
  choice: Rocha das Separações
  rationale: סלע designa uma rocha ou formação rochosa, e o plural הַמַּחְלְקוֹת sugere separações ou divisões. A forma plural preserva mais de perto a morfologia e a ambiguidade do topônimo hebraico.
