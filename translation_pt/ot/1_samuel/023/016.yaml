  source_fidelity: 'A tradução preserva adequadamente a sequência verbal hebraica: Jônatas levanta-se, vai a Davi em Horesa e fortalece a mão dele em Deus. «Deus» reproduz corretamente אֱלֹהִים, sem substituir indevidamente pelo nome divino YHWH. A repetição de «Davi» explicita, sem alterar o sentido, o referente de «sua mão».'
