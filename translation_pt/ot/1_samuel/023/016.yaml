  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: pt
  text: Então Jônatas, filho de Saul, levantou-se e foi até Davi em Horesa. Ali, fortaleceu a mão de Davi em Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «encorajou Davi em Deus»; literalmente: «fortaleceu a mão dele em Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: Preserva a sequência narrativa e o início de uma ação deliberada, sem expandir o sentido para «partiu».
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: Jônatas, filho de Saul
  rationale: Reproduz diretamente a relação filial e mantém em destaque a tensão familiar e política.
- source_word: וַיֵּלֶךְ אֶל
  choice: foi até
  rationale: Expressa movimento com chegada ao destino, de modo natural em português.
- source_word: חֹרְשָׁה
  choice: em Horesa
  rationale: Entende חֹרְשָׁה como topônimo com terminação direcional/locativa, em vez de traduzi-lo como nome comum («bosque»).
- source_word: וַיְחַזֵּק
  choice: fortaleceu
  rationale: Traduz diretamente o piel de חזק, preservando a imagem e evitando reduzir o sentido apenas a encorajamento verbal.
- source_word: אֶת יָדוֹ
  choice: a mão de Davi
  rationale: Mantém a expressão idiomática hebraica; repete o nome para esclarecer naturalmente em português que o pronome se refere a Davi.
- source_word: בֵּאלֹהִים
  choice: em Deus
  rationale: Preserva a preposição e a possível ideia de esfera ou fundamento do fortalecimento, sem impor «por meio de Deus» ou «da parte de Deus».
theological_decisions:
- issue: Tradução de אֱלֹהִים sem artigo neste contexto
  choice: Deus
  alternative: SENHOR
  rationale: O texto hebraico traz אֱלֹהִים, não o nome divino יהוה; portanto, «Deus» respeita a distinção lexical do original.
- issue: Relação expressa por בֵּאלֹהִים
  choice: em Deus
  alternative: por meio de Deus
  rationale: «Em Deus» conserva a formulação e a tensão sem decidir se Deus é apresentado especificamente como meio, agente ou fundamento da coragem de Davi.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão «fortaleceu a mão» é deliberadamente preservada por refletir a imagem hebraica; a nota fornece o sentido idiomático. «Ali» foi usado para evitar que «em Horesa» pareça modificar «fortaleceu», sem alterar a sequência dos acontecimentos.
