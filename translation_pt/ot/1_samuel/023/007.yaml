  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּי בָ֥א דָוִ֖ד קְעִילָ֑ה וַ/יֹּ֣אמֶר שָׁא֗וּל נִכַּ֨ר אֹת֤/וֹ אֱלֹהִים֙ בְּ/יָדִ֔/י כִּ֚י נִסְגַּ֣ר לָ/ב֔וֹא בְּ/עִ֖יר דְּלָתַ֥יִם וּ/בְרִֽיחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: pt
  text: 'Foi informado a Saul que Davi tinha chegado a Queila. Então Saul disse: “Deus o entregou em minhas mãos[a], pois ele se trancou ao entrar numa cidade com portas duplas e uma tranca[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus o pôs em meu poder”. Saul interpreta a situação de Davi como uma entrega realizada por Deus.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico se refere às duas folhas do portão de uma cidade fortificada e à barra transversal usada para fechá-las.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: foi informado
  rationale: Mantém o valor passivo do hofal de נגד e soa natural em português narrativo.
- source_word: בָא
  choice: tinha ido a
  rationale: בוא indica ir, chegar ou entrar; o mais-que-perfeito composto situa naturalmente a chegada a Queila antes da informação dada a Saul.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: Deus o entregou na minha mão
  rationale: נכר tem aqui o sentido de entregar ou pôr sob o poder de alguém. A formulação conserva a atribuição direta a Deus e a imagem hebraica da mão.
- source_word: נִסְגַּר
  choice: ele se encerrou
  rationale: O nifal admite nuance passiva ou reflexiva. A forma escolhida comunica que, segundo Saul, Davi se colocou numa posição confinada sem resolver totalmente essa ambiguidade.
- source_word: לָבוֹא
  choice: ao entrar
  rationale: O infinitivo explica como Davi ficou encerrado; “ao entrar” expressa essa relação de modo natural.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: numa cidade com portas duplas e uma tranca
  rationale: דלתים evoca as duas folhas de um portão urbano, enquanto בריח é a barra ou tranca que as prendia. A tradução preserva a imagem concreta da cidade fortificada.
theological_decisions:
- issue: A atribuição, por Saul, da vulnerabilidade de Davi à ação divina
  choice: 'Apresentar diretamente a fala de Saul: “Deus o entregou na minha mão”.'
  alternative: Acrescentar distância interpretativa, como “Saul pensou que Deus o havia entregado”.
  rationale: O hebraico registra a afirmação direta de Saul sem endosso explícito do narrador. A tradução preserva essa tensão e não confirma nem corrige a interpretação de Saul.
- issue: A voz e a nuance de נִסְגַּר
  choice: “ele se encerrou”
  alternative: “ele ficou encerrado” ou “ele se deixou encurralar”
  rationale: A escolha conserva a possibilidade reflexiva do nifal e reproduz a avaliação de Saul sem intensificá-la com a ideia interpretativa de descuido ou erro estratégico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez brasileira. Conserva-se a expressão concreta “na minha mão” e a imagem arquitetônica do hebraico, esclarecida em nota.
