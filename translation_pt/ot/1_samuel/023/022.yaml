  text: לְכוּ נָ֞א הָכִ֣ינוּ ע֗וֹד וּ/דְע֤וּ וּ/רְאוּ֙ אֶת מְקוֹמ/וֹ֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה רַגְל֔/וֹ מִ֥י רָאָ֖/הוּ שָׁ֑ם כִּ֚י אָמַ֣ר אֵלַ֔/י עָר֥וֹם יַעְרִ֖ם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: pt
  text: 'Vão, por favor, façam ainda mais preparativos; procurem saber e verificar o lugar dele, onde ele anda, e quem o viu ali, pois me foi dito[b]: “Ele age com muita astúcia.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou: “pois ele me disse”. O hebraico não identifica expressamente o sujeito de “disse”.'
    reason: alternative_reading
  - marker: c
    text: O hebraico emprega palavras da mesma raiz para dar ênfase, algo como “com astúcia age astutamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: façam ainda mais preparativos
  rationale: O hifil de כון pode significar preparar ou deixar pronto; com עוֹד, indica preparação adicional. A formulação é natural em português e mantém a intensificação da busca.
- source_word: וּדְעוּ וּרְאוּ
  choice: procurem saber e verificar
  rationale: Mantém os dois imperativos e sua força cumulativa de investigar e confirmar, sem produzir uma sequência artificial em português.
- source_word: מְקוֹמוֹ
  choice: o lugar dele
  rationale: Preserva o substantivo concreto e o sufixo pronominal masculino singular do hebraico.
- source_word: אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: por onde anda
  rationale: A expressão literalmente menciona onde estará o pé dele, mas funciona idiomaticamente para indicar paradeiro ou deslocamentos. A imagem literal é registrada em nota.
- source_word: מִי רָאָהוּ שָׁם
  choice: quem o viu ali
  rationale: Reproduz diretamente a pergunta indireta sobre a testemunha que viu Davi naquele lugar.
- source_word: כִּי אָמַר אֵלַי
  choice: pois me foi dito
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas o sujeito não é expresso. A construção passiva conserva essa indefinição sem identificar arbitrariamente quem falou.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: Ele age com muita astúcia
  rationale: A combinação do adjetivo עָרוֹם com verbo cognato intensifica a ideia. A expressão portuguesa comunica tanto a ação quanto a ênfase, no contexto da avaliação desconfiada de Saul.
