translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais brasileiras de uso corrente. A sintaxe foi levemente reorganizada para clareza, preservando o encadeamento investigativo, o sufixo de “seu lugar” e a indefinição de quem falou a Saul.
