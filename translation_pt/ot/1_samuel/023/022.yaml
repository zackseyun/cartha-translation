review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente as ordens de intensificar a preparação, identificar o local de Davi, apurar quem o viu e a avaliação de Saul sobre sua astúcia. «Me foi dito» preserva corretamente a indeterminação do sujeito de אָמַר. Contudo, «por onde anda» fica sintaticamente solto após «o lugar dele» e torna menos clara a relação entre o lugar e a expressão idiomática hebraica referente aos movimentos/paradeiro.
  naturalness: O registro é moderno e compreensível. A sequência «Procurem saber e verificar o lugar dele, por onde anda e quem o viu ali» soa pouco natural e pode fazer «por onde anda» parecer uma oração relativa mal ligada a «lugar». Uma pontuação e formulação mais claras preservam melhor a progressão dos imperativos.
  terminology: «Astúcia» e «age com muita astúcia» são adequados para עָרוֹם יַעְרִם. «O lugar dele» conserva o sufixo possessivo de מְקוֹמוֹ. As notas são pertinentes; a nota da expressão idiomática deve corresponder à formulação revista.
