  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: pt
  text: 'Então Davi disse: “Ó Yahweh[a], Deus de Israel, teu servo de fato soube que Saul procura vir a Queila para destruir a cidade por minha causa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Informa a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Davi disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Reprodução direta e natural da construção hebraica.
- source_word: שָׁמֹעַ שָׁמַע
  choice: soube com toda a certeza
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação; esta formulação preserva a ênfase e soa natural no contexto de uma informação recebida.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: Mantém a autodesignação deferente de Davi ao dirigir-se a Deus.
- source_word: מְבַקֵּשׁ
  choice: procura
  rationale: Preserva o sentido do particípio, que indica uma ação ou intenção em curso, sem transformá-la numa decisão mais categórica.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: vir a Queila
  rationale: Mantém o valor básico de בוא e o ponto de vista de Davi, que se encontra em Queila.
- source_word: לְשַׁחֵת לָעִיר
  choice: para destruir a cidade
  rationale: Expressa com clareza o propósito militar indicado pelo hebraico.
- source_word: בַּעֲבוּרִי
  choice: por minha causa
  rationale: 'Transmite de modo idiomático a relação causal: a presença de Davi seria o motivo do ataque.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome divino; “Yahweh” o preserva como nome próprio, enquanto “SENHOR” representa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas correntes no Brasil. A ordem “o teu servo soube” conserva a autodesignação na terceira pessoa; “com toda a certeza” torna perceptível a intensificação hebraica sem recorrer a uma formulação arcaica.
