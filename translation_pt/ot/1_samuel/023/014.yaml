  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: pt
  text: Davi permaneceu nas fortalezas do deserto e ficou na região montanhosa do deserto de Zife. Saul o procurava continuamente, mas Deus não o entregou nas mãos de Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não o deu na mão dele”, expressão que significa não entregá-lo ao poder de Saul.'
    reason: Explica o idioma hebraico preservado parcialmente no texto e esclarece o referente do pronome.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: permaneceu / ficou
  rationale: O verbo pode significar sentar-se, habitar, permanecer ou ficar. As duas formas naturais em português refletem sua repetição no hebraico sem produzir uma construção pesada.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma e não necessariamente arenosa. Em português bíblico corrente, “deserto” comunica de modo natural esse ambiente inculto e pouco habitado.
- source_word: בַּמְּצָדוֹת
  choice: nas fortalezas
  rationale: O termo se refere a lugares defensáveis ou fortificados. “Fortalezas” preserva a nuance militar e se ajusta à situação de Davi como fugitivo.
- source_word: בָּהָר
  choice: na região montanhosa
  rationale: הַר pode indicar um monte, uma montanha ou uma área serrana. Neste contexto geográfico, “região montanhosa” evita sugerir que Davi permaneceu em um único pico.
- source_word: בְּמִדְבַּר זִיף
  choice: do deserto de Zife
  rationale: A expressão identifica a região erma associada a Zife; “deserto de Zife” é uma forma geográfica clara e tradicional em português.
- source_word: וַיְבַקְשֵׁהוּ
  choice: o procurava
  rationale: בקשׁ, neste contexto, descreve a busca persistente de Saul por Davi. O imperfeito português comunica adequadamente a ação continuada.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: A tradução conserva de perto a expressão hebraica e transmite a persistência da perseguição em português natural.
- source_word: וְלֹא נְתָנוֹ ... בְּיָדוֹ
  choice: não o entregou nas mãos de Saul
  rationale: A construção hebraica “dar na mão” é um idioma de entregar alguém ao poder de outra pessoa. A formulação portuguesa mantém a imagem das mãos, esclarecendo que o referente é Saul.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o contexto e a construção verbal apresentam o Deus de Israel como agente singular.
theological_decisions:
- issue: A preservação de Davi atribuída à ação divina
  choice: Deus não o entregou nas mãos de Saul
  alternative: Deus não permitiu que Saul o capturasse
  rationale: A redação mantém a atribuição direta da preservação de Davi a Deus e conserva a imagem hebraica de entrega, sem ampliar ou reduzir a afirmação providencial do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Deserto” segue o uso bíblico corrente sem implicar necessariamente terreno arenoso; “região montanhosa” expressa o valor geográfico coletivo de הַר. A repetição de וַיֵּשֶׁב é representada por verbos próximos, mas não idênticos, para manter fluidez.
