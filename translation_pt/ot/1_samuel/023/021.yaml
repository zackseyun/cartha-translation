  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: pt
  text: 'Saul disse: “Que vocês sejam abençoados por Yahweh, pois tiveram compaixão de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol de אמר introduz a fala na narrativa; em português natural, a conjunção hebraica não precisa ser reproduzida.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּרוּכִים אַתֶּם
  choice: Que vocês sejam abençoados
  rationale: Reproduz em português corrente a força performativa da fórmula de bênção, em vez de tratá-la apenas como declaração de estado.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: Na fórmula de bênção, לַיהוָה indica a relação com a fonte ou agente da bênção; “por Yahweh” expressa isso naturalmente e preserva o nome divino.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da bênção; “pois” mantém com naturalidade o valor causal no discurso direto.
- source_word: חֲמַלְתֶּם
  choice: tiveram compaixão
  rationale: חמל denota piedade ou compaixão e, em certos contextos, pode envolver poupar. Aqui, com עָלַי, o sentido relacional de compaixão é o mais adequado.
- source_word: עָלָי
  choice: de mim
  rationale: Após “ter compaixão”, a construção idiomática natural em português é “ter compaixão de alguém”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário plural indicado por אַתֶּם e חֲמַלְתֶּם. Não se acrescentou nota, pois a nuance possível de “poupar” não é necessária para compreender este contexto.
