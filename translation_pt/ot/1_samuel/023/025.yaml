base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: pt
  text: Então Saul e seus homens foram procurá-lo. Quando avisaram Davi, ele desceu até a rocha[a] e ficou no deserto de Maom. Ao saber disso, Saul perseguiu Davi no deserto de Maom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rochedo” ou “penhasco”. O hebraico provavelmente se refere a uma formação rochosa ou fortaleza natural conhecida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: procurá-lo
  rationale: O infinitivo expressa propósito, e o objeto, Davi, é recuperado do contexto. “Procurá-lo” é natural e mantém a ideia de busca.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Quando avisaram Davi
  rationale: O verbo hebraico está no plural ativo, com sujeito não especificado. “Avisaram” comunica com naturalidade que Davi recebeu a informação; a ligação temporal explicita de modo mínimo a sequência narrativa.
- source_word: וַיֵּרֶד
  choice: ele desceu
  rationale: Preserva o sentido espacial de movimento descendente, tendo Davi como sujeito pelo contexto imediato.
- source_word: הַסֶּלַע
  choice: a rocha
  rationale: É a correspondência mais direta e transparente, sem determinar se se tratava especificamente de um penhasco, rochedo ou fortificação natural.
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: No contexto, indica permanência temporária no local. “Ficou” é corrente, claro e não sugere necessariamente residência permanente.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: no deserto de Maom
  rationale: “Deserto” é a forma bíblica corrente e inteligível em português para מִדְבָּר, embora o terreno possa ser uma região erma e não necessariamente arenosa. O topônimo מָעוֹן é vertido como “Maom”, forma portuguesa tradicional.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: perseguiu
  rationale: O verbo português incorpora naturalmente a ideia da locução hebraica “perseguir atrás de”, evitando literalismo pouco idiomático.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: Então Saul e seus homens foram
  rationale: “Então” assinala a progressão narrativa do waw consecutivo de forma natural em português.
- source_word: וַיִּשְׁמַע שָׁאוּל
  choice: Ao saber disso, Saul
  rationale: Neste contexto, שׁמע indica que Saul recebeu a notícia da localização ou movimentação de Davi. “Disso” retoma o fato sem acrescentar conteúdo específico não expresso.
theological_decisions: []
