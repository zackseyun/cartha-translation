base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: pt
  text: Então Davi se levantou com seus homens, cerca de seiscentos homens, e saíram de Queila; iam de um lugar a outro, por onde podiam ir. Saul foi informado de que Davi havia escapado de Queila, e deixou de sair[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deixou de sair”. Pelo contexto, isso provavelmente significa que Saul deixou de sair em perseguição a Davi.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: Então Davi se levantou com os seus homens
  rationale: Mantém o valor narrativo de קום sem antecipar a partida expressa no verbo seguinte; a coordenação hebraica é vertida naturalmente como acompanhamento.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: cerca de seiscentos
  rationale: כְּ diante do numeral indica aproximação. Como 'os seus homens' acaba de ser mencionado, omitir a repetição de 'homens' produz português mais natural sem perda de sentido.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: e eles saíram de Queila
  rationale: Reproduz diretamente a imagem espacial de יצא e identifica sem ambiguidade o sujeito plural.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: e passaram a andar de um lugar para outro, por onde podiam
  rationale: A forma hitpael e a repetição verbal sugerem movimento contínuo e itinerante. A formulação conserva essa ideia sem atribuir ao grupo uma ausência de propósito que o hebraico não declara explicitamente.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: Quando Saul foi informado
  rationale: O passivo de נגד é preservado em português natural; 'quando' expressa a relação temporal implícita na sequência narrativa.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: de que Davi havia escapado de Queila
  rationale: נמלט indica escapar ou pôr-se a salvo; o mais-que-perfeito composto marca que a fuga precedeu a informação recebida por Saul.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: desistiu de sair em perseguição
  rationale: חדל com infinitivo significa cessar ou deixar de fazer algo. O contexto indica uma saída militar contra Davi; 'em perseguição' torna o referente inteligível, com a explicitação registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção idiomática sobre o deslocamento foi tornada natural sem eliminar sua noção de movimento contínuo. A explicitação final foi marcada por nota para preservar a forma mais breve e potencialmente ambígua do hebraico.
