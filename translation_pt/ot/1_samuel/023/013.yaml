revisions:
- from: Então Davi se levantou com os seus homens, cerca de seiscentos, e eles saíram de Queila e passaram a andar de um lugar para outro, por onde podiam. Quando Saul foi informado de que Davi havia escapado de Queila, desistiu de sair em perseguição[a].
  to: Então Davi se levantou com seus homens, cerca de seiscentos homens, e saíram de Queila; iam de um lugar a outro, por onde podiam ir. Saul foi informado de que Davi havia escapado de Queila, e deixou de sair[a].
  rationale: A revisão elimina uma nuance aspectual não expressa no original e restaura no texto a concisão e a ambiguidade de «deixou de sair», deixando a identificação da saída como perseguição a Davi na nota. Também explicita «homens» após o numeral, acompanhando a construção hebraica e evitando que «cerca de seiscentos» pareça uma aposição sem referente claro.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:21:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução representa adequadamente os principais elementos do hebraico: Davi e seu grupo de aproximadamente seiscentos homens deixam Queila; Saul recebe a notícia da fuga; e ele deixa de sair. Contudo, «passaram a andar» acrescenta uma nuance incoativa (“começaram a”) que não é expressa pela forma verbal hebraica, e «desistiu de sair em perseguição» torna explícita no texto uma aplicação contextual que permanece implícita em לָצֵאת.'
  naturalness: O português é claro e de registro apropriado. «Iam de um lugar a outro, por onde podiam ir» é mais fluente e reproduz melhor o movimento continuado sem a nuance incoativa. «Deixou de sair» preserva a concisão ambígua do hebraico; a nota esclarece a provável referência contextual.
  terminology: «Davi», «Saul» e «Queila» são formas estabelecidas em português. «Homens» é adequado para o grupo masculino em contexto militar. Não há termo teológico controverso neste versículo.
  issues:
  - severity: medium
    issue: «Passaram a andar» introduz aspecto incoativo.
    rationale: O hitpael wayyiqtol de הלך descreve movimento continuado/itinerante, mas não declara que esse movimento tenha começado naquele momento. «Iam de um lugar a outro» comunica o valor contínuo sem esse acréscimo.
  - severity: medium
    issue: «Desistiu de sair em perseguição» explicita no corpo do texto uma inferência contextual.
    rationale: וַיֶּחְדַּל לָצֵאת significa literalmente que Saul deixou de sair. A saída em perseguição a Davi é a leitura contextual provável, mas a formulação hebraica é mais breve; essa explicação deve ficar na nota.
  revised_text: Então Davi se levantou com seus homens, cerca de seiscentos homens, e saíram de Queila; iam de um lugar a outro, por onde podiam ir. Saul foi informado de que Davi havia escapado de Queila, e deixou de sair[a].
  revised_footnotes:
  - marker: a
    text: 'Hebraico: “deixou de sair”. Pelo contexto, isso provavelmente significa que Saul deixou de sair em perseguição a Davi.'
    reason: cultural_note
  revision_rationale: A revisão elimina uma nuance aspectual não expressa no original e restaura no texto a concisão e a ambiguidade de «deixou de sair», deixando a identificação da saída como perseguição a Davi na nota. Também explicita «homens» após o numeral, acompanhando a construção hebraica e evitando que «cerca de seiscentos» pareça uma aposição sem referente claro.
