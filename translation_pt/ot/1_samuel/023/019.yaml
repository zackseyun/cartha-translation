base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: pt
  text: 'Então os zifitas foram até Saul, em Gibeá, e disseram: “Davi não está se escondendo entre nós, nas fortalezas, na região de mata[a], na colina de Haquilá, que fica à direita do Jesimom[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Hores”, entendendo o termo como nome de lugar, e não como “na região de mata”.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “à direita do Jesimom”; no uso geográfico hebraico, isso provavelmente significa “ao sul do Jesimom”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: foram até
  rationale: O verbo עלה indica subida ou deslocamento para um ponto elevado; em português, “foram até” expressa naturalmente o movimento em direção a Saul sem impor uma descrição topográfica desnecessária.
- source_word: זִפִים
  choice: os zifitas
  rationale: O gentílico plural designa os habitantes de Zife; “zifitas” é claro e tradicional em português.
- source_word: הַגִּבְעָתָה
  choice: em Gibeá
  rationale: O hê direcional marca movimento rumo a Gibeá. Como Saul é o destino pessoal da expressão anterior, “até Saul, em Gibeá” comunica com naturalidade que ele estava nessa localidade.
- source_word: לֵאמֹר
  choice: e disseram
  rationale: Embora a forma hebraica seja literalmente “dizendo”, a coordenação verbal é mais natural no português contemporâneo e mantém a função de introduzir o discurso direto.
- source_word: הֲלוֹא
  choice: Será que ... não
  rationale: Introduz uma pergunta retórica que espera confirmação. Essa construção preserva o valor interrogativo e soa natural em português moderno.
- source_word: מִסְתַּתֵּר
  choice: está escondido
  rationale: O particípio hitpael descreve uma ação reflexiva e contínua de ocultar-se; “está escondido” comunica o estado em curso de modo idiomático.
- source_word: עִמָּנוּ
  choice: entre nós
  rationale: Literalmente “conosco”, mas o contexto indica que Davi se encontra no território ou no meio da comunidade dos zifitas; “entre nós” transmite melhor essa nuance.
- source_word: בַמְּצָדוֹת
  choice: nas fortalezas
  rationale: מְצָדוֹת designa lugares fortificados ou posições defensáveis; “fortalezas” é corrente, conciso e adequado ao ambiente.
- source_word: בַּחֹרְשָׁה
  choice: da região de mata
  rationale: O termo pode ser substantivo comum, “mata/região arborizada”, ou topônimo, “Hores”. A leitura descritiva é mantida no texto, com a alternativa preservada em nota.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: na colina de Haquilá
  rationale: Tradução topográfica direta e natural de גִבְעָה, conservando o nome próprio.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: que fica à direita do Jesimom
  rationale: Preserva a expressão espacial hebraica מִימִין sem resolver silenciosamente sua provável orientação geográfica como “ao sul”; essa explicação fica na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe hebraica foi suavizada onde necessário, sem eliminar as ambiguidades de חֹרְשָׁה e מִימִין; ambas são explicitadas em notas.
