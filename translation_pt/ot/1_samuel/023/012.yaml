source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/יַסְגִּ֜רוּ בַּעֲלֵ֧י קְעִילָ֛ה אֹתִ֥/י וְ/אֶת אֲנָשַׁ֖/י בְּ/יַד שָׁא֑וּל וַ/יֹּ֥אמֶר יְהוָ֖ה יַסְגִּֽירוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: pt
  text: 'Então Davi perguntou: “Os homens de Queila entregarão a mim e aos meus homens nas mãos de Saul?” E Yahweh respondeu: “Eles entregarão você[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “Eles entregarão você”, no singular. Davi é tratado como líder representativo; seus homens ficam implícitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: entregarão
  rationale: O hifil de סגר, neste contexto, indica entregar alguém ao poder de outra pessoa. “Entregar” é natural em português e mantém o sentido de dar alguém ao inimigo.
- source_word: בַּעֲלֵי קְעִילָה
  choice: os homens de Queila
  rationale: Embora בַּעֲלֵי possa significar literalmente “donos” ou “senhores”, aqui designa os homens ou responsáveis da cidade; “os homens de Queila” preserva a formulação sem restringi-la formalmente aos líderes.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: a mim e aos meus homens
  rationale: Mantém a referência explícita a Davi e a seus seguidores, sem especificá-los além do hebraico.
- source_word: בְּיַד שָׁאוּל
  choice: nas mãos de Saul
  rationale: Conserva a imagem hebraica da “mão” como poder ou domínio. O plural “nas mãos” é a forma idiomática mais natural em português nesse contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַסְגִּירוּ
  choice: Eles entregarão você
  rationale: Repete o verbo da pergunta e preserva o objeto singular hebraico, dirigido a Davi, embora os homens dele estejam implicados pelo contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional.
- issue: Número do objeto na resposta divina
  choice: “você”, no singular
  alternative: “vocês” ou “você e seus homens”
  rationale: A resposta hebraica usa objeto singular e se dirige a Davi como líder representativo. A tradução não explicita no corpo do texto aquilo que permanece apenas implícito no original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “a mim e aos meus homens” evita a ambiguidade que “me entregarão e aos meus homens” produziria em português. A imagem idiomática hebraica foi mantida em “nas mãos de Saul”.
