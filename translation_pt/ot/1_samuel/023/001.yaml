  text: וַ/יַּגִּ֥דוּ לְ/דָוִ֖ד לֵ/אמֹ֑ר הִנֵּ֤ה פְלִשְׁתִּים֙ נִלְחָמִ֣ים בִּ/קְעִילָ֔ה וְ/הֵ֖מָּה שֹׁסִ֥ים אֶת הַ/גֳּרָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: pt
  text: 'Então disseram a Davi: “Veja! Os filisteus estão atacando Queila[a] e saqueando as eiras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estão lutando em Queila”. A preposição hebraica significa literalmente “em”, mas, neste contexto militar, provavelmente indica que os filisteus estão atacando a cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: Então disseram a Davi
  rationale: O wayyiqtol dá sequência à narrativa, e o sujeito plural foi preservado. O infinitivo לֵאמֹר introduz a fala direta, mas não precisa ser traduzido separadamente em português, pois os dois-pontos cumprem essa função com maior naturalidade.
- source_word: הִנֵּה
  choice: Veja!
  rationale: A partícula chama a atenção de Davi para uma notícia urgente. “Veja!” conserva a vivacidade sem recorrer ao arcaísmo “eis”.
- source_word: פְלִשְׁתִּים נִלְחָמִים בִּקְעִילָה
  choice: Os filisteus estão atacando Queila[a]
  rationale: O particípio indica uma ação em curso. Embora בְּ seja literalmente “em”, neste contexto militar a expressão provavelmente apresenta Queila como alvo do combate; “atacando” comunica isso naturalmente sem especificar a tática.
- source_word: וְהֵמָּה שֹׁסִים
  choice: e saqueando
  rationale: O pronome independente enfatiza os mesmos agentes. Em português, a coordenação elíptica preserva com clareza a continuidade da ação, e “saqueando” expressa a pilhagem em contexto de guerra.
- source_word: אֶת הַגֳּרָנוֹת
  choice: as eiras
  rationale: גֹּרֶן designa a área onde os cereais eram debulhados. “Eiras” é a correspondência portuguesa precisa e mantém a imagem concreta do hebraico, embora o objeto visado pelo saque fosse provavelmente o produto agrícola ali reunido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Queila” segue a forma tradicional portuguesa do topônimo; “eiras” preserva o referente histórico concreto.
