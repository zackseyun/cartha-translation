base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: pt
  text: 'Mas os homens de Davi lhe disseram[a]: “Veja, estamos com medo aqui em Judá; quanto mais se formos a Queila enfrentar as fileiras dos filisteus!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “muito mais se formos a Queila, contra as fileiras dos filisteus”. A expressão hebraica apresenta um argumento do menor para o maior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mas ... disseram
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “mas” expressa naturalmente o contraste contextual entre a ordem recebida e a reação temerosa dos homens.
- source_word: אַנְשֵׁי דָוִד
  choice: os homens de Davi
  rationale: Reproduz de modo natural a relação do construto hebraico e identifica o grupo ligado a Davi.
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a força enfática e apelativa da partícula em português moderno, sem o tom arcaico de “eis”.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: já estamos com medo aqui em Judá
  rationale: “Com medo” é uma formulação corrente para o predicativo יְרֵאִים. “Já” explicita de maneira idiomática a força contextual de הִנֵּה e sustenta o raciocínio do perigo menor para o maior, sem alterar seu sentido.
- source_word: וְאַף כִּי
  choice: quanto mais se
  rationale: Equivalente português natural para o idioma hebraico que apresenta um argumento do menor para o maior.
- source_word: נֵלֵךְ קְעִלָה
  choice: formos a Queila
  rationale: O verbo de movimento seguido do topônimo indica destino; “ir a Queila” é claro e idiomático.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: enfrentar as fileiras dos filisteus
  rationale: A preposição אֶל indica movimento em direção às formações inimigas e, no contexto militar, implica confronto. “Fileiras” preserva a imagem de tropas dispostas para a batalha.
