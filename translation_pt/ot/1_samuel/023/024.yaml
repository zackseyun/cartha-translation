base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: pt
  text: Eles se levantaram e foram a Zife adiante de Saul. Davi e seus homens estavam no deserto de Maom, na Arabá, ao sul do Jesimom[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à direita do Jesimom”. A expressão hebraica usa literalmente “direita” ou “lado direito”, termo que, em indicações geográficas, pode significar “sul”.'
    reason: lexical_alternative
  - marker: b
    text: “Jesimom” também pode ser entendido como “ermo” ou “região desolada”, mas aqui provavelmente funciona como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Eles se levantaram
  rationale: O verbo קום, em sequência narrativa, descreve a ação de levantar-se e partir. A formulação conserva a progressão do hebraico sem explicitar além do texto quem são eles.
- source_word: וַיֵּלְכוּ
  choice: e foram
  rationale: הלך significa aqui simplesmente ir; a forma breve e corrente acompanha naturalmente a sequência narrativa.
- source_word: זִיפָה
  choice: a Zife
  rationale: O ה direcional ligado ao topônimo indica movimento em direção a Zife.
- source_word: לִפְנֵי שָׁאוּל
  choice: adiante de Saul
  rationale: 'לִפְנֵי tem aqui valor espacial ou temporal: eles seguiram à frente de Saul, antes de sua chegada.'
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: Davi e seus homens estavam
  rationale: A oração nominal hebraica muda o foco para a localização de Davi; em português, o verbo 'estavam' precisa ser expresso.
- source_word: בְּמִדְבַּר מָעוֹן
  choice: no deserto de Maom
  rationale: מִדְבָּר designa uma região erma ou desértica, não necessariamente um deserto de areia. 'Deserto de Maom' é claro e mantém a designação geográfica tradicional.
- source_word: בָּעֲרָבָה
  choice: na Arabá
  rationale: Com artigo e dentro de uma descrição topográfica, עֲרָבָה provavelmente designa a região geográfica da Arabá; a transliteração preserva essa força toponímica.
- source_word: אֶל יְמִין הַיְשִׁימוֹן
  choice: ao sul do Jesimom
  rationale: יָמִין significa literalmente 'direita', mas, na orientação geográfica antiga voltada para o leste, pode indicar o sul. A tradução comunica o sentido direcional provável, enquanto a nota preserva a expressão literal.
- source_word: הַיְשִׁימוֹן
  choice: o Jesimom
  rationale: Embora o termo possa significar 'ermo' ou 'região desolada', neste contexto provavelmente funciona como nome geográfico; por isso, foi transliterado.
