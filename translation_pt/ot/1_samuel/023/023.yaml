base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: pt
  text: Vejam e procurem saber todos os esconderijos em que ele se esconde. Depois, voltem a mim com informações seguras, e eu irei com vocês. Se ele estiver na terra, eu o procurarei entre todos os clãs de Judá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todos os milhares de Judá”, provavelmente uma referência às divisões de clãs ou famílias dentro de Judá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: Vejam e verifiquem
  rationale: Os dois imperativos pedem observação e averiguação. “Verifiquem” comunica o sentido investigativo de ידע neste contexto sem tornar a frase artificial.
- source_word: מִכֹּל הַמַּחֲבֹאִים
  choice: todos os esconderijos
  rationale: מַחֲבֹא designa um lugar de ocultação. Em português, “verificar todos os esconderijos” expressa naturalmente a investigação abrangente, sem reproduzir de modo rígido a preposição hebraica.
- source_word: אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: onde ele se esconde
  rationale: O reflexivo de חבא é representado por “se esconde”. O advérbio שָׁם está incluído semanticamente em “onde”; acrescentar “ali” produziria redundância pouco natural em português.
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: Depois, voltem a mim
  rationale: O perfeito com waw tem força imperativa e sequencial neste contexto. “Depois” torna clara a ordem das ações.
- source_word: אֶל נָכוֹן
  choice: com informações seguras
  rationale: נָכוֹן indica algo firme ou confirmado. A formulação explicita de modo natural que Saul espera dados confiáveis, sem afirmar certeza absoluta sobre todos os aspectos.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: e eu irei com vocês
  rationale: Tradução direta e idiomática da promessa de acompanhar os interlocutores.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: Se ele estiver nesta terra
  rationale: וְהָיָה introduz o resultado condicional e não precisa ser vertido separadamente. “Nesta terra” preserva a referência contextual ao território em questão.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: eu o procurarei
  rationale: חפשׂ expressa busca cuidadosa. “Procurarei” é claro e digno; o contexto já transmite a intensidade da busca.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: entre todos os clãs de Judá
  rationale: אַלְפֵי significa literalmente “milhares”, mas aqui provavelmente designa agrupamentos familiares ou territoriais de Judá. A leitura literal é preservada em nota.
