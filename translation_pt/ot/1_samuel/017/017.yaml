base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: pt
  text: 'Então Jessé disse a seu filho Davi: “Por favor, leve para seus irmãos esta efa de grãos torrados[a] e estes dez pães; corra ao acampamento, até seus irmãos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma efa era uma antiga medida para produtos secos, equivalente a cerca de 22 litros.
    reason: cultural_note
lexical_decisions:
- source_word: קַח נָא
  choice: Por favor, leve
  rationale: O imperativo com נָא expressa uma ordem atenuada, com cortesia ou urgência; esta formulação é natural em português.
- source_word: לְאַחֶיךָ
  choice: para seus irmãos
  rationale: A preposição ל marca aqui os destinatários da provisão.
- source_word: אֵיפַת
  choice: esta efa de
  rationale: Mantém a unidade antiga concreta, explicada em nota, sem substituí-la por uma equivalência moderna apenas aproximada.
- source_word: הַקָּלִיא
  choice: grãos torrados
  rationale: Designa cereal preparado por torrefação; a expressão é clara e corrente em português.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: e estes dez pães
  rationale: Embora לֶחֶם possa designar pão em sentido coletivo, com numeral refere-se naturalmente a unidades de pão.
- source_word: וְהָרֵץ
  choice: corra
  rationale: Preserva a força e a vivacidade do imperativo hebraico ligado ao verbo correr.
- source_word: הַמַּחֲנֶה
  choice: o acampamento
  rationale: Equivalente natural para o acampamento militar neste contexto.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Mantém a identificação apositiva de Davi em relação a Jessé.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. A repetição hebraica de “seus irmãos” foi preservada semanticamente, mas a segunda ocorrência foi integrada como oração locativa para evitar uma formulação pouco natural. A alternativa lexical “grãos tostados” não exige nota, pois não altera substancialmente o sentido.
