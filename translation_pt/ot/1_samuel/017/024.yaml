  text: And every man of Israel, when they saw the man, fled from before him and were very afraid.
translation:
  language: pt
  text: Todos os homens de Israel, ao verem aquele homem, fugiram dele e ficaram com muito medo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: Todos os homens de Israel
  rationale: A expressão distributiva hebraica está no singular, mas se refere coletivamente aos israelitas; o restante da frase usa formas plurais. O plural em português transmite naturalmente esse sentido.
- source_word: בִּרְאוֹתָם
  choice: ao verem
  rationale: Preserva a construção temporal e o sufixo plural do hebraico.
- source_word: הָאִישׁ
  choice: aquele homem
  rationale: O artigo definido retoma o homem já identificado no contexto; “aquele homem” torna essa referência clara sem inserir seu nome.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: fugiram dele
  rationale: Tradução natural da expressão hebraica “fugiram de diante dele”, mantendo a ideia de afastamento por temor.
- source_word: וַיִּירְאוּ מְאֹד
  choice: ficaram com muito medo
  rationale: Expressa em português corrente e digno a intensidade do verbo de temor reforçado por מְאֹד.
