base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: pt
  text: 'Saul lhe disse: “De quem você é filho, jovem?” Davi disse: “Sou[a] filho do seu servo Jessé, o belemita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Filho do seu servo Jessé, o belemita.” A resposta hebraica não traz explicitamente o pronome “eu” nem o verbo “ser”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: De quem você é filho
  rationale: Preserva a pergunta hebraica pela linhagem paterna e soa natural em português, sem substituí-la pela formulação mais interpretativa “Quem é seu pai?”
- source_word: הַנָּעַר
  choice: jovem
  rationale: נַעַר pode designar menino, rapaz ou jovem. Neste contexto, “jovem” mantém a amplitude do termo e funciona naturalmente como vocativo.
- source_word: עַבְדְּךָ
  choice: seu servo
  rationale: Aqui o termo funciona como expressão deferente em linguagem dirigida ao rei; “servo” preserva essa cortesia sem impor a ideia mais específica de escravidão.
- source_word: בֵּית הַלַּחְמִי
  choice: o belemita
  rationale: Reproduz de modo conciso o gentílico hebraico que identifica Jessé por sua procedência de Belém.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: disse ... disse
  rationale: Mantém o verbo hebraico comum em ambas as orações; a forma interrogativa da primeira fala já comunica que Saul fez uma pergunta.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: Sou filho do seu servo Jessé
  rationale: O hebraico apresenta uma resposta nominal sem verbo explícito. “Sou” torna a frase idiomática em português, enquanto a nota registra a forma mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento “você/seu” evita arcaísmo; “jovem” preserva o vocativo sem infantilizar Davi. A repetição de “disse” acompanha deliberadamente a estrutura hebraica.
