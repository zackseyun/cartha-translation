base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: pt
  text: 'Davi disse: “Javé, que me livrou da pata do leão e da pata do urso, ele me livrará da mão deste filisteu.” Então Saul disse a Davi: “Vá, e que Javé esteja com você.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Javé estará com você”. O imperfeito hebraico pode ser entendido como uma bênção ou um desejo, ou como uma simples afirmação sobre o futuro.'
    reason: Leitura alternativa da força do imperfeito hebraico.
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega o nome divino em sua forma tradicional e amplamente reconhecível em português, em vez de substituí-lo por um título.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: me livrou / me livrará
  rationale: Mantém a ligação verbal entre o livramento passado e a confiança de Davi no livramento futuro, com linguagem natural e digna em português.
- source_word: מִיַּד
  choice: das garras / das mãos
  rationale: O hebraico diz literalmente “da mão”. Com animais, “das garras” comunica naturalmente a imagem concreta; com o filisteu, “das mãos” preserva o idioma e o contraste do original.
- source_word: הוּא
  choice: ele
  rationale: 'Conserva a ênfase do pronome hebraico independente: é o próprio Javé quem livrará Davi.'
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: deste filisteu
  rationale: Expressa de modo natural em português a referência demonstrativa, direta e depreciativamente contundente de Davi ao adversário.
- source_word: לֵךְ
  choice: Vá
  rationale: Reproduz a ordem breve e direta de Saul.
- source_word: יִהְיֶה עִמָּךְ
  choice: que Javé esteja com você
  rationale: No contexto da despedida de Saul, o imperfeito pode ter valor volitivo, formando uma bênção ou um desejo; esta formulação é natural em português sem transformar a fala em garantia profética.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: Jeová; SENHOR
  rationale: O texto emprega o nome próprio divino. “Javé” o preserva como nome e evita substituí-lo pelo título “SENHOR”.
- issue: Força da declaração final de Saul
  choice: “que Javé esteja com você” como desejo ou bênção
  alternative: “Javé estará com você” como afirmação futura
  rationale: A forma verbal hebraica admite ambas as leituras. O contexto favorece uma bênção de despedida, enquanto a nota preserva a possibilidade de uma afirmação simples sobre o futuro.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “me livrou... me livrará” e o pronome enfático “ele” preservam a estrutura retórica e a confiança expressa por Davi. O marcador da nota foi colocado junto à oração final a que se refere.
