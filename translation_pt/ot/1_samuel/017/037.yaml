  revision_rationale: A revisão troca “garras” por “pata” para refletir com maior precisão o uso de “mão” para os animais e restabelece o singular em “da mão deste filisteu”. Também ajusta a nota para uma apresentação mais fluida da ambiguidade entre desejo/bênção e afirmação futura, sem resolvê-la. O nome “Javé”, a ênfase em “ele” e o tom de bênção final foram preservados.
