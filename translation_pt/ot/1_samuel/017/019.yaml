  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: pt
  text: Saul, eles e todos os homens de Israel estavam no vale de Elá, lutando contra os filisteus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com os filisteus”. Em contextos de batalha, a preposição hebraica traduzida aqui como “contra” pode indicar confronto hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל וְ/הֵמָּה
  choice: Saul, eles
  rationale: Mantém o pronome independente hebraico, que retoma os filhos de Jessé mencionados no contexto, e expressa a coordenação de modo natural em português.
- source_word: וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: e todos os homens de Israel
  rationale: Reproduz o sentido coletivo e distributivo da expressão hebraica em português corrente, sem reduzir a referência aos combatentes a um singular pouco natural.
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: no vale de Elá
  rationale: עֵמֶק significa “vale”, e Elá é a transliteração corrente do topônimo hebraico.
- source_word: נִלְחָמִים
  choice: estavam ... lutando
  rationale: O particípio hebraico descreve uma ação em andamento; a locução portuguesa preserva esse valor durativo.
- source_word: עִם פְּלִשְׁתִּים
  choice: contra os filisteus
  rationale: Embora עִם signifique literalmente “com”, em contexto de combate indica envolvimento hostil. “Contra” comunica sem ambiguidade o sentido contextual em português.
