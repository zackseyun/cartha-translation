base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: pt
  text: Quando Saul e todo o Israel ouviram essas palavras do filisteu, ficaram abalados[a] e tiveram muito medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram consternados”. O verbo hebraico também pode transmitir a ideia de terem ficado aterrorizados ou desanimados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviram
  rationale: O qal de שׁמע significa normalmente “ouvir”; o plural em português concorda naturalmente com o sujeito composto “Saul e todo o Israel”.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Preserva a expressão coletiva do hebraico, que neste contexto se refere ao povo ou exército israelita.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: essas palavras do filisteu
  rationale: Tradução direta e natural da expressão; “o filisteu” identifica o guerreiro filisteu já mencionado no contexto.
- source_word: וַיֵּחַתּוּ
  choice: ficaram abalados
  rationale: חתת pode comunicar a ideia de ser quebrantado, perder o ânimo ou ficar consternado. “Ficaram abalados” conserva parte da força figurada e se distingue da declaração explícita de medo que vem em seguida.
- source_word: וַיִּרְאוּ מְאֹד
  choice: e com muito medo
  rationale: Expressa de modo atual e idiomático tanto o sentido de ירא, “ter medo”, quanto a intensificação de מְאֹד, “muito”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Todo o Israel” mantém o caráter coletivo da formulação hebraica, e “abalados” preserva a imagem forte de חתת sem se confundir com o medo expresso na oração seguinte.
