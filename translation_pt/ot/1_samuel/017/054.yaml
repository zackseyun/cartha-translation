  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: pt
  text: Davi pegou a cabeça do filisteu e a levou para Jerusalém[b], e pôs as armas dele[a] em sua tenda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o equipamento dele” ou “os seus apetrechos”. O termo hebraico é amplo e pode incluir armas, armadura e outros artigos militares.
    reason: lexical_alternative
  - marker: b
    text: Alguns leitores veem aqui uma tensão cronológica, pois, neste ponto da narrativa mais ampla, Jerusalém ainda não estava inteiramente sob o domínio israelita. A tradução preserva a redação hebraica sem harmonizá-la.
    reason: cultural_note
  - marker: c
    text: O hebraico diz literalmente “em sua tenda”. Pelo contexto, geralmente se entende que é a tenda de Davi, mas o sufixo possessivo não permite determinar com certeza a quem ele se refere.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: Verbo narrativo comum de tomar; “pegou” é natural e claro em português, sem acrescentar a ideia de violência de “apoderou-se”.
- source_word: רֹאשׁ
  choice: cabeça
  rationale: O sentido literal de parte do corpo é inequívoco no contexto da morte de Golias.
- source_word: הַפְּלִשְׁתִּי
  choice: o filisteu
  rationale: Designação étnica substantivada que se refere a Golias; esta é a forma corrente em português.
- source_word: וַיְבִאֵהוּ
  choice: a levou
  rationale: O sufixo masculino hebraico retoma “cabeça”, substantivo masculino em hebraico; em português, o pronome feminino concorda naturalmente com “cabeça”. “Levou” expressa bem o movimento até Jerusalém.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma tradicional e corrente do nome do lugar em português.
- source_word: כֵּלָיו
  choice: as armas dele
  rationale: כְּלִי é um termo amplo para objetos, utensílios, armas ou equipamento. No contexto militar, “armas” é conciso e adequado; “dele” deixa claro que os objetos pertenciam ao filisteu, sem usar dois possessivos portugueses potencialmente ambíguos.
- source_word: שָׂם
  choice: pôs
  rationale: Equivalente simples e digno para o verbo de colocar.
- source_word: בְּאָהֳלוֹ
  choice: em sua tenda
  rationale: אָהֶל significa normalmente “tenda”. O sufixo permite ambiguidade contextual quanto ao possuidor; o texto principal mantém a forma possessiva natural e uma nota registra a questão.
theological_decisions:
- issue: Referentes dos sufixos possessivos na oração final
  choice: As armas pertencem ao filisteu; “sua tenda” é entendida contextualmente como a de Davi, mas a ambiguidade formal é preservada e explicada em nota.
  alternative: Tanto os objetos quanto a tenda pertencem a Davi; ou a tenda é comunitária/militar.
  rationale: O contexto apresenta os objetos militares como troféus tomados de Golias. Já o último sufixo, isoladamente, não identifica de modo inequívoco o dono da tenda; por isso a tradução evita uma expansão interpretativa no corpo do versículo.
- issue: Aparente tensão cronológica na menção a Jerusalém
  choice: Traduzir diretamente “a levou para Jerusalém”.
  alternative: “Mais tarde a levaria para Jerusalém” ou “a levou na direção de Jerusalém”.
  rationale: O hebraico apresenta a ação diretamente. A tradução não acrescenta uma indicação temporal nem harmoniza a tensão com o controle posterior de Jerusalém por Israel.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação com “e” segue o hebraico sem introduzir contraste. “As armas dele” evita a ambiguidade que “suas armas” criaria em português; a ambiguidade real do último possessivo é mantida no texto e explicitada em nota.
