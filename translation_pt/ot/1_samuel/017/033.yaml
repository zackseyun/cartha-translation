base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: pt
  text: 'Saul disse a Davi: “Você não pode enfrentar este filisteu e lutar com ele, pois você é um jovem[a], e ele é guerreiro desde a juventude.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um rapaz”. O termo hebraico pode designar um menino, um rapaz ou um jovem, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: você não pode
  rationale: Expressa incapacidade, não simples proibição; em português atual, “não pode” comunica isso de modo natural no contexto.
- source_word: לָלֶכֶת אֶל
  choice: enfrentar
  rationale: No contexto militar, a expressão indica avançar contra um adversário; “enfrentar” evita uma tradução espacial pouco natural e preserva o sentido hostil.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: este filisteu
  rationale: Reproduz naturalmente o gentílico substantivado com o demonstrativo.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: lutar com ele
  rationale: Mantém a construção com עִם e expressa claramente o combate direto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada por Saul e conserva um registro digno e corrente.
- source_word: נַעַר
  choice: apenas um jovem
  rationale: “Jovem” preserva a amplitude de נַעַר sem definir Davi como criança; “apenas” torna explícita em português a força contrastiva e depreciativa do argumento de Saul.
- source_word: אִישׁ מִלְחָמָה
  choice: guerreiro
  rationale: É a forma portuguesa idiomática e concisa para o hebraísmo “homem de guerra”, indicando experiência militar.
- source_word: מִנְּעֻרָיו
  choice: desde a juventude
  rationale: Expressa uma atividade iniciada na juventude e mantida ao longo do tempo.
