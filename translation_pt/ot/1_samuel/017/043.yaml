base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: pt
  text: 'O filisteu disse a Davi: “Por acaso sou um cão, para você vir até mim com paus[a]?” E o filisteu amaldiçoou Davi pelos seus deuses[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com cajados” ou “com varas”. A palavra hebraica pode designar paus, varas ou cajados; o plural aqui transmite o desprezo do filisteu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em nome de seus deuses”. A forma hebraica também pode ser entendida no singular: “pelo seu deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: o filisteu
  rationale: Designa a identidade étnica de Golias; a forma simples acompanha o estilo narrativo sem acrescentar “guerreiro”.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: Por acaso sou um cão
  rationale: Mantém literalmente a imagem insultuosa e expressa com naturalidade a indignação da pergunta retórica.
- source_word: כִּי
  choice: para
  rationale: Neste contexto, introduz a circunstância que provoca a pergunta indignada; “para” produz uma construção natural em português sem alterar o sentido.
- source_word: בָא אֵלַי
  choice: você vir contra mim
  rationale: O particípio apresenta a ação em curso. “Contra mim” explicita apenas a direção hostil já evidente no confronto e soa natural no discurso direto.
- source_word: בַּמַּקְלוֹת
  choice: com paus
  rationale: מַקֵּל pode indicar vara, cajado ou pau. “Paus” preserva o plural e comunica o desprezo do filisteu, sem sugerir armas especializadas.
- source_word: וַיְקַלֵּל
  choice: amaldiçoou
  rationale: O verbo קלל descreve aqui a invocação de uma maldição, não apenas um insulto.
- source_word: בֵּאלֹהָיו
  choice: por seus deuses
  rationale: A preposição ב pode indicar o meio ou a autoridade invocada na maldição. O plural é apropriado ao contexto filisteu, embora a forma hebraica também admita leitura singular.
theological_decisions:
- issue: Número de אֱלֹהִים com sufixo masculino singular no contexto filisteu
  choice: seus deuses
  alternative: seu deus
  rationale: אֱלֹהִים pode ser plural ou funcionar como singular. O contexto religioso filisteu favorece o plural, mas a nota preserva a ambiguidade gramatical em vez de eliminá-la.
- issue: Sentido da preposição ב em בֵּאלֹהָיו
  choice: por seus deuses
  alternative: em nome de seus deuses
  rationale: A tradução principal conserva de modo conciso a ideia de invocar as divindades ao amaldiçoar; a alternativa explicita essa relação sem mudar o referente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Por acaso” marca a pergunta retórica; “paus” conserva o tom depreciativo. O tratamento “você” torna a fala direta natural sem perder solenidade.
