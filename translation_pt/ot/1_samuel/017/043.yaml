  naturalness: O português é moderno e fluente. «Vir até mim» é igualmente natural e evita o acréscimo interpretativo de «contra». «Pelos seus deuses» comunica com mais idiomaticidade o valor instrumental/invocatório de בֵּאלֹהָיו do que «por seus deuses».
  terminology: «Filisteu», «Davi», «cão», «paus» e «amaldiçoou» são escolhas adequadas. A nota mantém apropriadamente tanto a alternativa «em nome de seus deuses» quanto a possível leitura singular de אֱלֹהִים.
