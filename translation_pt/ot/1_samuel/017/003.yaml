base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: pt
  text: Os filisteus estavam num monte de um lado[a], e Israel estava num monte do outro lado, com o vale entre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “colina” ou “montanha”, aqui e na ocorrência seguinte. O termo hebraico pode designar diferentes tipos de elevação.
    reason: lexical_alternative
  - marker: b
    text: Ou “ravina”. O termo hebraico pode designar um vale de lados íngremes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Os filisteus
  rationale: O gentílico tradicional traduz o nome do povo. O וּ conecta a cena ao contexto, mas não exige um marcador explícito no início da frase em português.
- source_word: עֹמְדִים
  choice: estavam posicionados
  rationale: O particípio descreve um estado contínuo. No contexto militar, “posicionados” comunica naturalmente a disposição das tropas sem sugerir apenas postura corporal.
- source_word: אֶל הָהָר מִזֶּה
  choice: numa encosta, de um lado
  rationale: Com עמד, אֶל indica posição junto à elevação. הַר pode designar monte ou montanha; “encosta” expressa com naturalidade a posição topográfica dos exércitos, enquanto a nota preserva a amplitude lexical do substantivo.
- source_word: וְיִשְׂרָאֵל
  choice: e Israel
  rationale: Mantém o nome coletivo empregado no hebraico para representar o povo ou exército israelita.
- source_word: עֹמְדִים
  choice: estava posicionado
  rationale: Preserva o aspecto descritivo do particípio; o singular concorda naturalmente em português com o sujeito coletivo “Israel”.
- source_word: אֶל הָהָר מִזֶּה
  choice: na outra encosta, do outro lado
  rationale: A formulação paralela expressa a oposição espacial entre os dois exércitos de modo claro e idiomático.
- source_word: וְהַגַּיְא
  choice: com o vale
  rationale: גַּיְא pode indicar vale ou ravina. “Vale” é a opção corrente e abrangente; “com” integra naturalmente a circunstância espacial à frase.
- source_word: בֵּינֵיהֶם
  choice: entre eles
  rationale: Tradução direta da localização do vale entre os dois grupos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Encosta” evita uma imagem excessivamente grandiosa de “montanha” e torna explícita a posição topográfica, sem eliminar em nota a amplitude do hebraico. A repetição estrutural preserva o paralelismo da cena.
