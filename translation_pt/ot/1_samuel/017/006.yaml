base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/006.yaml
  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
translation:
  language: pt
  text: Usava caneleiras de bronze nas pernas e trazia um dardo[a] de bronze entre os ombros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma lança de bronze”. O termo hebraico pode indicar uma arma mais leve, semelhante a uma lança. Também já foi entendido como outro tipo de arma, mas “dardo” parece ajustar-se melhor ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: caneleiras
  rationale: Designa a proteção militar usada na parte inferior das pernas. “Caneleiras” é preciso, natural e amplamente compreensível em português moderno.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Em contexto militar antigo, o termo normalmente se refere ao bronze empregado em armas e armaduras; “latão” seria anacrônico e “cobre” é menos provável aqui.
- source_word: עַל רַגְלָיו
  choice: nas pernas
  rationale: Embora רֶגֶל possa designar o pé ou a perna, o uso de caneleiras indica especificamente a parte inferior das pernas.
- source_word: כִידוֹן
  choice: dardo
  rationale: O termo pode designar uma arma leve semelhante a uma lança, possivelmente própria para arremesso. “Dardo” mantém a provável distinção em relação à lança maior mencionada no contexto, sem ocultar a incerteza lexical.
- source_word: בֵּין כְּתֵפָיו
  choice: entre os ombros
  rationale: Preserva de modo direto a expressão hebraica e evita acrescentar que a arma estava presa ou atravessada nas costas, detalhes não explícitos no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura corrente. “Usava” e “trazia” tornam natural a construção nominal hebraica sem especificar de que modo a arma era carregada. O marcador da nota foi colocado após “ombros”, junto à expressão referente à arma cuja identificação lexical é incerta.
