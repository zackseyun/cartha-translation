base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: pt
  text: Trazia na cabeça um capacete de bronze e vestia uma couraça de escamas[a]. A couraça pesava cinco mil siclos de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se traduz tradicionalmente por “cota de malha”, mas o hebraico descreve mais precisamente uma armadura feita de placas sobrepostas semelhantes a escamas.
    reason: lexical_alternative
  - marker: b
    text: Cinco mil siclos correspondem aproximadamente a 57 quilogramas.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: capacete
  rationale: No contexto militar, designa uma proteção para a cabeça; “capacete” é o equivalente moderno, claro e natural.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode designar cobre ou bronze, mas, no contexto de armamento antigo, “bronze” é a tradução convencional e mais provável.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: couraça de escamas
  rationale: A expressão descreve uma proteção corporal feita de pequenas placas sobrepostas semelhantes a escamas. “Couraça de escamas” comunica essa construção com clareza e evita a possível associação de “cota de malha” com anéis entrelaçados.
- source_word: הוּא לָבוּשׁ
  choice: vestia
  rationale: Expressa de modo natural em português o estado de estar trajado com a armadura, sem perder o sentido do hebraico.
- source_word: מִשְׁקַל
  choice: pesava
  rationale: A formulação verbal é mais natural em português do que “o peso era”, preservando integralmente a informação da construção hebraica.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: cinco mil siclos
  rationale: Mantém no texto principal a unidade antiga usada no hebraico; a equivalência moderna aproximada é fornecida em nota.
