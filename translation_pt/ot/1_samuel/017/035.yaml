base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: pt
  text: Eu ia atrás dele, o golpeava e resgatava a ovelha de sua boca.[a] Quando ele se levantava contra mim, eu o agarrava pela barba[b], o golpeava e o matava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega pronomes masculinos singulares para o predador: literalmente, “atrás dele” e “da boca dele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “barba”. Algumas traduções interpretam a expressão como “juba” ou “mandíbula”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: Eu saía atrás dele
  rationale: No relato de ações habituais introduzido no versículo anterior, o imperfeito em português comunica naturalmente o que Davi fazia quando vinha um predador. “Atrás dele” preserva os sufixos masculinos singulares do hebraico.
- source_word: וְהִכִּתִיו
  choice: o golpeava
  rationale: נכה indica golpear; a tradução não antecipa a morte, expressa somente no verbo final.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: resgatava o animal da sua boca
  rationale: נצל no hifil significa resgatar ou livrar, e מִפִּיו diz literalmente “da sua boca”. A explicitação de “o animal” esclarece que o objeto resgatado era a presa do predador, sem especificar além do contexto anterior se era o cordeiro.
- source_word: וַיָּקָם עָלַי
  choice: Quando ele se levantava contra mim
  rationale: קום על descreve levantar-se hostilmente contra alguém. “Quando” torna natural em português a relação circunstancial sem eliminar a imagem hebraica.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: eu o agarrava pela barba
  rationale: O hifil de חזק expressa segurar com firmeza, enquanto זקן significa normalmente “barba”. Mantém-se a imagem concreta e incomum do original.
- source_word: וַהֲמִיתִּיו
  choice: o matava
  rationale: O hifil de מות significa causar a morte. “Matava” distingue claramente o desfecho letal dos golpes anteriores.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O aspecto habitual do contexto foi expresso pelo pretérito imperfeito. Os pronomes masculinos preservam a forma hebraica, enquanto “o animal” evita a possível confusão de que Davi teria resgatado o próprio predador.
