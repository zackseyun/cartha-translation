  to: 'Os homens de Israel disseram: “Vocês viram esse homem que está subindo? Pois ele está subindo para desafiar Israel. O homem que o abater, o rei o fará muito rico, lhe dará sua filha e tornará livre, em Israel, a casa de seu pai[a].”'
  rationale: A revisão corrige o tempo verbal da narração e da pergunta, preserva o aspecto em curso do particípio “está subindo” e transfere para a nota a explicação administrativa que excede o sentido literal de “livre”. Também substitui a repetição pouco natural “enriquecido ... com grandes riquezas” por “fará muito rico”, que comunica a intensidade do verbo cognato com seu substantivo.
