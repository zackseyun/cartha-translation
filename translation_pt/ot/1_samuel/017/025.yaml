  source_fidelity: A pergunta hebraica usa perfeito interrogativo (“Have you seen?”), e a narrativa abre com wayyiqtol no passado; por isso “disseram” e “Vocês viram?” representam melhor o texto que “diziam” e “Vocês estão vendo”. A expressão final deve conservar “livre” no texto principal, pois o alcance administrativo específico de חָפְשִׁי é provável, mas não inteiramente explícito.
  naturalness: A revisão mantém português moderno e claro. “Vocês viram esse homem que está subindo?” é idiomático e reflete tanto a pergunta plural quanto o particípio. A repetição enfática hebraica é expressa naturalmente por “o rei o fará muito rico”.
  terminology: “Desafiar Israel”, “abater”, “casa de seu pai” e “livre” são escolhas adequadas. A nota explica, com a devida reserva, a provável isenção de impostos ou deveres de serviço.
