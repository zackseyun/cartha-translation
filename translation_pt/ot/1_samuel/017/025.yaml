  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: pt
  text: 'Os homens de Israel disseram: “Vocês viram esse homem que está subindo? Pois ele está subindo para desafiar Israel. O homem que o abater, o rei o fará muito rico, lhe dará sua filha e tornará livre, em Israel, a casa de seu pai[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “isentará a casa de seu pai em Israel”; provavelmente significa isenção de impostos ou de outras obrigações de serviço ao rei.
    reason: Esclarece o provável sentido administrativo de חָפְשִׁי, preservando no texto principal o sentido mais literal, “livre”.
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: Os homens de Israel
  rationale: Embora אִישׁ esteja no singular, a expressão tem sentido coletivo ou distributivo no contexto dos soldados que repetem entre si a informação; o plural produz português natural sem mudar o referente.
- source_word: הַרְּאִיתֶם
  choice: Vocês estão vendo
  rationale: A forma é uma pergunta dirigida a vários ouvintes. O presente progressivo comunica com naturalidade a cena imediata em que Golias se aproxima.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: esse homem que vem subindo
  rationale: O particípio descreve uma ação em curso. “Vem subindo” preserva o movimento indicado por עֹלֶה e soa natural na cena narrativa.
- source_word: כִּי לְחָרֵף אֶת יִשְׂרָאֵל עֹלֶה
  choice: Ele vem para desafiar Israel!
  rationale: כִּי introduz aqui uma explicação enfática, e לְחָרֵף expressa afronta ou desafio público. A frase direta conserva a ênfase sem impor uma relação causal rígida.
- source_word: יַכֶּנּוּ
  choice: o abater
  rationale: נכה pode significar ferir, golpear ou abater. “Abater” comunica a derrota decisiva de Golias sem substituir explicitamente o verbo por “matar”.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: será enriquecido pelo rei com grandes riquezas
  rationale: A construção conserva o verbo causativo e a repetição enfática entre עשר e עֹשֶׁר, mantendo a solenidade da promessa.
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: o rei lhe dará sua filha
  rationale: Tradução direta e clara da recompensa matrimonial, com o sujeito repetido para evitar ambiguidade em português.
- source_word: בֵּית אָבִיו
  choice: a casa de seu pai
  rationale: A expressão designa o grupo familiar ou doméstico paterno. A forma literal é transparente e preserva a linguagem social do texto.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: tornará livre de obrigações, em Israel
  rationale: חָפְשִׁי significa “livre”, mas neste contexto provavelmente indica isenção de tributos ou serviços devidos ao rei. “Livre de obrigações” torna inteligível o provável sentido administrativo, enquanto a nota registra a incerteza específica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” adequado à pergunta no plural. A repetição “enriquecido... com grandes riquezas” foi mantida para refletir a ênfase do hebraico. O marcador da nota foi colocado junto à expressão que ele esclarece.
