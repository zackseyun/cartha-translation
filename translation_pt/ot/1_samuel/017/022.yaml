  text: וַ/יִּטֹּשׁ֩ דָּוִ֨ד אֶת הַ/כֵּלִ֜ים מֵ/עָלָ֗י/ו עַל יַד֙ שׁוֹמֵ֣ר הַ/כֵּלִ֔ים וַ/יָּ֖רָץ הַ/מַּעֲרָכָ֑ה וַ/יָּבֹ֕א וַ/יִּשְׁאַ֥ל לְ/אֶחָ֖י/ו לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: pt
  text: Então, Davi deixou os mantimentos que levava aos cuidados do encarregado da bagagem[a] e correu para a linha de batalha[b]. Quando chegou, perguntou aos seus irmãos como estavam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a bagagem” ou “o equipamento”. O termo hebraico כֵּלִים é amplo e pode designar objetos, pertences ou provisões. Neste contexto, provavelmente se refere aos mantimentos que Davi levava.
    reason: lexical_alternative
  - marker: b
    text: Ou “as fileiras”; isto é, a formação organizada das tropas.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “perguntou aos seus irmãos pela paz”. Essa expressão hebraica significa perguntar pelo bem-estar deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: deixou
  rationale: No contexto, Davi não abandona os itens, mas os deixa temporariamente sob os cuidados de outra pessoa.
- source_word: הַכֵּלִים
  choice: os mantimentos que carregava
  rationale: כֵּלִים é um termo amplo para objetos, utensílios ou equipamento. Aqui, o contexto imediato indica as provisões que Davi havia levado; a explicitação também comunica מֵעָלָיו, aquilo que estava sobre ele.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: com o responsável pela bagagem
  rationale: A expressão עַל יַד indica que os itens foram deixados aos cuidados de alguém. 'Responsável pela bagagem' é natural e evita sugerir necessariamente um guarda armado.
- source_word: וַיָּרָץ
  choice: correu
  rationale: Preserva diretamente o sentido e a urgência do verbo hebraico.
- source_word: הַמַּעֲרָכָה
  choice: a linha de batalha
  rationale: Refere-se à formação organizada das tropas e é uma expressão militar clara em português atual.
- source_word: וַיָּבֹא
  choice: Quando chegou
  rationale: A subordinação temporal reproduz naturalmente em português a sequência narrativa hebraica.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: perguntou aos seus irmãos como estavam
  rationale: A expressão hebraica significa indagar pelo bem-estar de alguém, não pedir literalmente 'paz'.
theological_decisions: []
