base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: pt
  text: Quando Davi voltou depois de matar o filisteu, Abner o tomou e o levou à presença de Saul. Davi estava com a cabeça do filisteu na mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “e a cabeça do filisteu estava na mão dele”. O hebraico traz uma oração sem verbo, que também pode ser entendida como uma circunstância concomitante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: Quando Davi voltou
  rationale: A conjunção com o infinitivo construto de שׁוב introduz uma oração temporal; esta formulação é natural e preserva a relação temporal.
- source_word: מֵהַכּוֹת
  choice: depois de matar
  rationale: נכה designa ferir ou abater e, neste contexto, o golpe foi fatal. “Matar” comunica claramente o resultado sem reduzir a expressão a uma derrota genérica.
- source_word: הַפְּלִשְׁתִּי
  choice: o filisteu
  rationale: Mantém a designação do hebraico, sem substituir pelo nome Golias nem acrescentar “campeão”.
- source_word: וַיִּקַּח אֹתוֹ ... וַיְבִאֵהוּ
  choice: Abner o levou
  rationale: Em português, “levou” expressa naturalmente a ação conjunta de tomar Davi e conduzi-lo, evitando a repetição pouco idiomática “tomou-o e o trouxe”.
- source_word: לִפְנֵי שָׁאוּל
  choice: à presença de Saul
  rationale: Equivalente claro e corrente de “diante de Saul” no sentido de apresentação pessoal.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: Davi estava com a cabeça do filisteu na mão
  rationale: A oração nominal hebraica descreve uma circunstância concomitante. Explicitar Davi evita que, em português, o possessivo seja atribuído a Abner, embora o hebraico não repita o nome.
