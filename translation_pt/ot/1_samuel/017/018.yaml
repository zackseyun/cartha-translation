  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: pt
  text: Leve também estes dez pedaços de queijo ao comandante da unidade de mil soldados, veja como estão seus irmãos e traga algum sinal da parte deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pegue o penhor deles”. O termo hebraico pode indicar um penhor, uma garantia ou algum objeto ou sinal recebido como prova da situação dos irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: pedaços de queijo
  rationale: A expressão designa porções ou peças cortadas de um produto lácteo; “pedaços de queijo” é concreto, claro e natural em português.
- source_word: שַׂר הָאָלֶף
  choice: comandante da unidade de mil soldados
  rationale: שַׂר indica um chefe militar, e אֶלֶף, neste contexto, uma unidade tradicionalmente associada a mil homens. A formulação explicita a estrutura militar sem recorrer a linguagem arcaica.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: veja como estão seus irmãos
  rationale: A combinação expressa a verificação do estado ou bem-estar deles. Esta formulação é idiomática e compreensível, sem transformar שָׁלוֹם numa simples saudação.
- source_word: עֲרֻבָּתָם
  choice: algum sinal da parte deles
  rationale: O substantivo pode indicar penhor, garantia ou sinal. No contexto, trata-se provavelmente de algo recebido dos irmãos como confirmação de sua situação; “algum sinal” preserva a abertura sem impor a natureza exata do objeto.
- source_word: וְאֵת
  choice: também
  rationale: O waw acrescenta estes queijos aos mantimentos já mencionados, e “também” transmite naturalmente essa força aditiva.
- source_word: תָּבִיא
  choice: leve
  rationale: Embora o verbo básico seja “trazer”, em português a entrega de algo a um destino distante do falante é expressa naturalmente por “levar”.
- source_word: תִּקָּח
  choice: traga
  rationale: O sentido básico é “tomar/pegar”, mas o contexto implica obter algo dos irmãos e levá-lo de volta a Jessé; “traga” torna essa direção natural em português.
