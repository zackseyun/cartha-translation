  terminology: Os topônimos Ecrom, Gate e Saaraim são formas portuguesas adequadas. «Grito de guerra» representa bem a alternativa marcial para וַיָּרִיעוּ. A nota sobre Gai preserva a incerteza textual e sintática sem resolver a questão de modo indevido.
