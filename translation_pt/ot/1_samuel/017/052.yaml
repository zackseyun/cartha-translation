base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: pt
  text: Então os homens de Israel e de Judá se levantaram, gritaram[a] e perseguiram os filisteus até Gai[b] e até os portões de Ecrom. Os filisteus caíram mortos pelo caminho de Saaraim, até Gate e até Ecrom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “soltaram um grito de guerra”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “até a entrada do vale”. A expressão é textual e sintaticamente difícil; alguns entendem Gai como nome de lugar, enquanto outros traduzem a expressão como referência à entrada do vale.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: O qal narrativo de קום descreve a mobilização imediata das tropas após a queda de Golias; a expressão é natural e preserva a sequência da ação.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: os homens de Israel e de Judá
  rationale: Mantém o sentido literal de אַנְשֵׁי e é adequado ao contexto militar.
- source_word: וַיָּרִעוּ
  choice: gritaram
  rationale: רוע denota aqui um forte brado de combate; a tradução principal é clara e natural, enquanto a nuança militar é explicitada em nota.
- source_word: וַיִּרְדְּפוּ
  choice: perseguiram
  rationale: רדף tem o sentido habitual de perseguir um inimigo em contexto militar.
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: até Gai
  rationale: Trata גַיְא como possível topônimo, sem ocultar que a construção é difícil e também pode ser entendida como referência à entrada do vale; a ambiguidade é preservada em nota.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: e até os portões de Ecrom
  rationale: Reproduz o limite espacial expresso pelo hebraico e usa a forma portuguesa tradicional do topônimo.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: Os filisteus abatidos caíram
  rationale: חַלְלֵי designa os mortos ou mortalmente atingidos em combate, não apenas feridos; “abatidos” conserva o caráter militar e permite manter o verbo “caíram”.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: ao longo do caminho de Saaraim
  rationale: Expressa naturalmente a distribuição das baixas pela rota associada a Saaraim, sem impor uma direção geográfica além do texto.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: até Gate e até Ecrom
  rationale: Preserva a repetição de עַד, que enfatiza a extensão da perseguição e das baixas.
