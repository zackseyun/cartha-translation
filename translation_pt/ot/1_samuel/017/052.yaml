  source_fidelity: A tradução acompanha de perto a sequência narrativa hebraica, preserva «homens de Israel e de Judá», o brado, a perseguição e a repetição de «até». «Gai» é uma opção defensável para a expressão difícil עַד בּוֹאֲךָ גַיְא, desde que a nota mantenha explícita a alternativa de entendê-la como «entrada do vale», como faz a proposta.
