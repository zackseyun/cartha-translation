base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: pt
  text: Os filisteus reuniram suas forças para a batalha[a]. Eles se concentraram em Socó[b], que pertence a Judá, e acamparam entre Socó e Azeca, em Efes-Damim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus acampamentos”; o termo hebraico pode designar acampamentos militares ou forças armadas.
    reason: lexical_alternative
  - marker: b
    text: Socó era uma cidade no território de Judá.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: reuniram
  rationale: O verbo אָסַף significa reunir ou ajuntar; aqui descreve a mobilização militar dos filisteus.
- source_word: מַחֲנֵיהֶם
  choice: suas forças
  rationale: מַחֲנֶה pode designar acampamento ou contingente militar. No contexto de preparação para a batalha, “forças” comunica naturalmente o sentido coletivo sem excluir a imagem de tropas acampadas.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: מִלְחָמָה pode significar guerra ou batalha; o movimento de tropas para um confronto específico favorece “batalha”.
- source_word: וַיֵּאָסְפוּ
  choice: se concentraram
  rationale: É outra forma de אָסַף, agora descrevendo a reunião das tropas em determinado local. “Concentraram-se” evita repetição pouco natural e preserva o sentido militar.
- source_word: שֹׂכֹה
  choice: Socó
  rationale: Forma portuguesa clara e tradicional do topônimo hebraico.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: que pertence a Judá
  rationale: A construção com ל indica associação ou pertencimento territorial; a tradução mantém essa relação explícita.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: חנה significa acampar ou estabelecer acampamento; “acamparam” é corrente e direto.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e
  rationale: Correspondência espacial direta e idiomática.
- source_word: עֲזֵקָה
  choice: Azeca
  rationale: Forma portuguesa corrente do topônimo.
- source_word: בְּאֶפֶס דַּמִּים
  choice: em Efes-Damim
  rationale: A expressão é tratada como nome de lugar; “em” indica naturalmente a localização do acampamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação hebraica foi dividida em duas frases para fluidez. Os topônimos seguem formas portuguesas usuais. A segunda ocorrência de אָסַף foi vertida por “se concentraram” para evitar repetição e expressar a reunião militar em um local.
