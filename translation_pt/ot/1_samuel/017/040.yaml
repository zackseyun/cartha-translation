revisions:
- from: Pegou seu cajado na mão, escolheu para si cinco pedras lisas do leito do riacho[a] e as colocou na bolsa de pastor que levava, isto é, no alforje[b]. Com a funda na mão, aproximou-se do filisteu.
  to: Pegou o seu cajado e o tomou na mão; escolheu para si cinco pedras lisas do riacho[a] e as colocou na bolsa de pastor que ele tinha, no alforje[b]. Com a funda na mão, aproximou-se do filisteu.
  rationale: A revisão esclarece a ação de tomar o cajado na mão, restitui a relação de posse não marcada do recipiente e ajusta a nota sobre נַחַל. Mantém-se a estrutura narrativa, a especificação do alforje e a concisão do hebraico, sem resolver além do necessário a relação entre o recipiente do pastor e o יַלְקוּט.
