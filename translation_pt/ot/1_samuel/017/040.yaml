base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: pt
  text: Pegou o seu cajado e o tomou na mão; escolheu para si cinco pedras lisas do riacho[a] e as colocou na bolsa de pastor que ele tinha, no alforje[b]. Com a funda na mão, aproximou-se do filisteu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do leito do riacho” ou “de um uádi”. O termo hebraico נַחַל pode indicar um curso de água, o seu leito ou um vale por onde a água corre, muitas vezes sazonalmente.
    reason: lexical_alternative
  - marker: b
    text: Ou “na sacola”. O termo hebraico יַלְקוּט designa algum tipo de pequena bolsa ou recipiente para transportar objetos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: seu cajado
  rationale: מַקֵּל pode designar vara ou bastão; “cajado” é natural no contexto de um pastor e mantém a imagem concreta.
- source_word: וַיִּבְחַר לוֹ
  choice: escolheu para si
  rationale: Preserva o valor benefactivo/reflexivo de לוֹ e a seleção deliberada feita por Davi.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: cinco pedras lisas
  rationale: Expressa de modo idiomático a qualidade das pedras alisadas pela água.
- source_word: מִן הַנַּחַל
  choice: do leito do riacho
  rationale: נַחַל pode indicar tanto o curso de água quanto o vale ou leito sazonal; a formulação é clara em português e mantém a dimensão geográfica.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ
  choice: na bolsa de pastor que levava
  rationale: כְּלִי é amplo, mas o contexto requer um recipiente; “que levava” comunica posse circunstancial sem sugerir além do texto.
- source_word: וּבַיַּלְקוּט
  choice: isto é, no alforje
  rationale: Trata o segundo termo como especificação do recipiente anterior; “alforje” designa uma bolsa para transportar objetos, embora a identificação exata seja incerta.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: Com a funda na mão
  rationale: Reproduz naturalmente a oração nominal hebraica e conserva a repetição concreta de “na mão”.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: aproximou-se do filisteu
  rationale: נגשׁ indica aproximar-se ou chegar perto, sem exigir a nuance mais forte de atacar ou avançar.
