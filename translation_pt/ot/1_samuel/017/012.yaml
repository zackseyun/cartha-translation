source:
  edition: WLC
  text: וְ/דָוִד֩ בֶּן אִ֨ישׁ אֶפְרָתִ֜י הַ/זֶּ֗ה מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וּ/שְׁמ֣/וֹ יִשַׁ֔י וְ/ל֖/וֹ שְׁמֹנָ֣ה בָנִ֑ים וְ/הָ/אִישׁ֙ בִּ/ימֵ֣י שָׁא֔וּל זָקֵ֖ן בָּ֥א בַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: pt
  text: Davi era filho de um efrateu de Belém de Judá. Esse homem se chamava Jessé e tinha oito filhos. Nos dias de Saul, ele era velho, de idade avançada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é incomum; literalmente, “velho, chegado entre os homens”. Em geral, ela é entendida como uma referência à idade avançada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: efrateu
  rationale: No contexto de Belém de Judá, designa alguém de Efrata/Belém, não um membro da tribo de Efraim. “Efrateu” preserva a designação geográfica tradicional.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Belém de Judá
  rationale: Reproduz de modo direto a relação geográfica e distingue esta cidade de outra Belém.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: Esse homem se chamava Jessé
  rationale: Expressa naturalmente em português a identificação do pai de Davi e evita ambiguidade quanto ao referente.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: e tinha oito filhos
  rationale: É a forma idiomática portuguesa de expressar a construção hebraica de posse.
- source_word: בִּימֵי שָׁאוּל
  choice: Nos dias de Saul
  rationale: Mantém o conhecido idioma temporal hebraico em português claro e digno.
- source_word: וְהָאִישׁ
  choice: ele
  rationale: O pronome retoma Jessé com naturalidade depois de ele ter sido explicitamente identificado na frase anterior.
- source_word: זָקֵן בָּא בַאֲנָשִׁים
  choice: era velho, de idade avançada
  rationale: Comunica a compreensão contextual mais provável da expressão hebraica incomum, sem reproduzir no texto principal uma formulação opaca; a imagem literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação hebraica foi dividida em frases curtas para esclarecer que Jessé, e não Davi, tinha oito filhos. Não se acrescentou um marcador inicial como “Ora” ou “Agora”, pois o hebraico não contém uma palavra temporal correspondente.
