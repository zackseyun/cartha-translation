base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: pt
  text: E, quando o filisteu se levantou, foi e se aproximou ao encontro de Davi, Davi se apressou e correu em direção à linha de batalha[a], ao encontro do filisteu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em direção às fileiras”. O substantivo hebraico pode designar uma linha de batalha ou uma formação militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: A fórmula narrativa introduz o acontecimento seguinte; em português, “Quando” preserva naturalmente a relação temporal sem reproduzir de modo rígido a construção hebraica.
- source_word: קָם
  choice: se levantou
  rationale: Expressa diretamente o ato de levantar-se e inicia a sequência de movimentos do filisteu.
- source_word: הַפְּלִשְׁתִּי
  choice: o filisteu
  rationale: O hebraico diz apenas “o filisteu”; acrescentar “campeão” importaria informação do contexto.
- source_word: וַיֵּלֶךְ
  choice: avançou
  rationale: Embora o verbo tenha o sentido básico de “ir”, neste contexto militar indica o movimento do filisteu na direção de Davi; “avançou” é natural e não acrescenta um título ou uma ação alheia ao texto.
- source_word: וַיִּקְרַב
  choice: se aproximou
  rationale: Preserva o movimento concreto de chegar mais perto e distingue esta ação do avanço anterior.
- source_word: לִקְרַאת
  choice: para enfrentar
  rationale: Nos dois casos, a expressão indica movimento rumo a um encontro hostil. “Para enfrentar” comunica com naturalidade o sentido contextual sem eliminar a ideia de encontro.
- source_word: וַיְמַהֵר
  choice: se apressou
  rationale: Transmite que Davi agiu rapidamente, em linguagem atual e digna.
- source_word: וַיָּרָץ
  choice: correu
  rationale: É a tradução direta e natural do verbo hebraico.
- source_word: הַמַּעֲרָכָה
  choice: em direção à linha de batalha
  rationale: O substantivo pode designar a linha, formação ou fileiras de combate. A construção hebraica aqui indica o destino ou direção da corrida de Davi; “linha de batalha” se ajusta ao cenário militar.
theological_decisions: []
