  naturalness: O texto é claro e fluente em português moderno. A revisão mantém essa fluência, usando «foi ao encontro de» e «correu em direção à linha de batalha, ao encontro do filisteu» para evitar uma interpretação excessivamente especificada.
  terminology: «Filisteu», «Davi» e «linha de batalha» são apropriados. A nota lexical continua necessária, pois הַמַּעֲרָכָה pode referir-se à linha, às fileiras ou à formação de combate.
