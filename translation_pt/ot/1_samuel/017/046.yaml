  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: pt
  text: Hoje mesmo, Yahweh entregará você em minha mão; eu o derrubarei e tirarei sua cabeça. E hoje mesmo darei os cadáveres do acampamento dos filisteus às aves do céu e aos animais selvagens da terra, para que toda a terra saiba que há um Deus para Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que há um Deus em Israel”. O hebraico diz literalmente “para Israel”, expressão que pode indicar relação de aliança ou atuação em favor de Israel.'
    reason: Leitura alternativa plausível de לְיִשְׂרָאֵל, preservando sua ambiguidade relacional e locativa.
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: entregará você em minhas mãos
  rationale: O hifil de סגר indica entregar alguém ao poder de outro. A expressão conserva a imagem hebraica da mão e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: וְהִכִּיתִךָ
  choice: eu o derrubarei
  rationale: Neste contexto de combate, נכה indica golpear de modo a abater. “Derrubarei” comunica o resultado fatal iminente sem simplesmente substituir o verbo por “matarei”.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: tirarei de você a sua cabeça
  rationale: Preserva o emprego de סור, “tirar/remover”, sem tornar o verbo mais explícito do que o hebraico, embora o contexto indique decapitação.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: os cadáveres do acampamento dos filisteus
  rationale: O singular פֶּגֶר pode ter sentido coletivo diante do acampamento inteiro; o plural português expressa naturalmente os corpos dos combatentes mortos.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: às aves do céu
  rationale: Mantém a expressão imagética hebraica em formulação corrente e digna.
- source_word: וּלְחַיַּת הָאָרֶץ
  choice: aos animais selvagens da terra
  rationale: Na combinação presente, חַיָּה designa os animais terrestres selvagens que devoram cadáveres.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: para que toda a terra saiba
  rationale: No encadeamento da declaração, o imperfeito com ו pode exprimir resultado visado; a formulação portuguesa torna clara essa relação sem perder a amplitude retórica de “toda a terra”.
- source_word: כִּי יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: que há um Deus para Israel
  rationale: Traduz diretamente a relação marcada por ל, permitindo a ideia de pertença, compromisso ou atuação em favor de Israel, sem eliminar a leitura idiomática alternativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino. A transliteração preserva essa forma em vez de substituí-la por um título.
- issue: Relação expressa por לְיִשְׂרָאֵל
  choice: há um Deus para Israel
  alternative: há um Deus em Israel; Israel tem um Deus
  rationale: “Para Israel” mantém mais diretamente a preposição ל e sua possível força relacional ou de atuação em favor de Israel. Como “em Israel” é uma leitura idiomática plausível, ela é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “hoje mesmo” reproduz a ênfase do hebraico. A violência concreta do discurso foi mantida sem eufemismo nem explicitação além do texto-fonte.
