    rationale: A formulação tenta reproduzir מֵעָלֶיךָ, mas a combinação do possessivo com “de você” resulta em redundância pouco idiomática. “Tirarei sua cabeça” comunica fielmente a remoção pretendida no contexto, sem explicitar um método que o hebraico não nomeia.
  - severity: low
    issue: “em minhas mãos” pluraliza a imagem hebraica.
    rationale: O texto-fonte traz בְּיָדִי, literalmente “em minha mão”. “Em minha mão” permanece compreensível e preserva a imagem singular do original.
