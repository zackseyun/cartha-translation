source:
  edition: WLC
  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: pt
  text: E toda esta assembleia saberá que Yahweh não salva por meio de espada nem de lança[a], pois a batalha pertence a Yahweh[b], e ele entregará vocês em nossas mãos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não livra por meio de espada e lança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a batalha é de Yahweh”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “em nossa mão”; a expressão significa “sob nosso poder” ou “entregues a nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: E ... saberá
  rationale: O imperfeito qal indica aqui o resultado futuro anunciado por Davi. Como o núcleo coletivo “assembleia” é singular em português, emprega-se “saberá”.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: toda esta assembleia
  rationale: קהל designa o grupo reunido no local. “Assembleia” é natural no contexto público e militar e evita uma conotação eclesiástica indevida.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  choice: não salva por meio de espada nem de lança
  rationale: As preposições indicam instrumento ou meio. Em uma construção negativa portuguesa, “nem” reproduz com naturalidade o par de armas ligado por ו.
- source_word: יְהוֹשִׁיעַ
  choice: salva
  rationale: O hifil de ישׁע pode significar salvar ou livrar. “Salvar” cabe no contexto militar e conserva a amplitude teológica do verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: pois a batalha pertence a Yahweh
  rationale: O segundo כִּי é explicativo ou causal, e a construção com ל expressa posse ou pertencimento. A formulação é clara em português e preserva a afirmação de que a batalha é de Yahweh.
- source_word: וְנָתַן
  choice: e ele entregará
  rationale: Embora a forma seja qatal, no discurso profético e orientado ao futuro ela anuncia o resultado esperado; o futuro português comunica adequadamente essa força.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: vocês em nossas mãos
  rationale: A expressão hebraica significa colocar alguém sob o poder de outro. O plural idiomático em português soa natural, enquanto a nota registra a forma singular do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Amplitude de יְהוֹשִׁיעַ no contexto militar
  choice: salva
  alternative: livra; dá a vitória
  rationale: “Salva” mantém tanto a referência concreta ao livramento militar quanto a amplitude semântica e teológica do verbo hebraico.
- issue: Posse divina da batalha
  choice: a batalha pertence a Yahweh
  alternative: a batalha é de Yahweh
  rationale: A construção hebraica afirma pertencimento e, por implicação contextual, domínio sobre o resultado, sem exigir uma explicitação interpretativa adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém “Yahweh” como nome divino, usa “vocês” para o plural dirigido aos filisteus e conserva em nota a forma literal dos principais idiomatismos hebraicos.
