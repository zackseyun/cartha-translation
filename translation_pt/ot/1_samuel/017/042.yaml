base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: pt
  text: Quando o filisteu olhou e viu Davi, desprezou-o, pois era jovem, avermelhado[a] e de bela aparência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ruivo”; o adjetivo hebraico pode indicar uma coloração avermelhada em sentido mais geral, não necessariamente apenas a cor do cabelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: olhou
  rationale: Expressa naturalmente o ato de dirigir o olhar e preserva a sequência hebraica entre olhar e ver.
- source_word: הַפְּלִשְׁתִּי
  choice: o filisteu
  rationale: Mantém a designação étnica usada no hebraico, sem acrescentar aqui o título contextual de campeão.
- source_word: וַיִּרְאֶה אֶת־דָּוִד
  choice: viu Davi
  rationale: Tradução direta do verbo comum ראה, preservando a progressão narrativa.
- source_word: וַיִּבְזֵהוּ
  choice: desprezou-o
  rationale: Reproduz de modo conciso a ideia de considerar alguém indigno ou com desprezo e mantém o objeto pessoal.
- source_word: כִּי
  choice: pois
  rationale: Introduz com naturalidade, em registro narrativo digno, a razão do desprezo do filisteu.
- source_word: הָיָה נַעַר
  choice: Davi era jovem
  rationale: Jovem comunica a idade relativa sem fazer de Davi necessariamente uma criança; a repetição do nome evita ambiguidade pronominal em português.
- source_word: אַדְמֹנִי
  choice: de aspecto avermelhado
  rationale: Preserva a referência genérica a uma coloração avermelhada sem restringi-la indevidamente ao cabelo ou à pele.
- source_word: עִם יְפֵה מַרְאֶה
  choice: e boa aparência
  rationale: Expressa em português corrente e digno que Davi tinha aparência bela ou atraente, sem uma formulação excessivamente literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A redação mantém a sequência hebraica “olhou e viu” e conserva, por meio de nota, a ambiguidade de אַדְמֹנִי.
