base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: pt
  text: A haste de sua lança era como a barra de um tear, e a ponta de ferro de sua lança pesava seiscentos siclos. O portador do escudo ia à sua frente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escudo grande»; o termo hebraico pode designar um escudo corporal, em vez de um escudo menor.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: a haste de sua lança
  rationale: Neste contexto, חץ designa a parte longa da lança, comparada à barra de um tear, e não uma flecha. “Haste” comunica isso de modo claro e natural.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: como a barra de um tear
  rationale: A expressão compara a haste da lança a uma peça estrutural pesada do tear. “Barra de um tear” preserva a imagem e evita a tradução imprecisa “lançadeira”.
- source_word: לַהֶבֶת חֲנִיתוֹ
  choice: a ponta de ferro da lança
  rationale: לַהֶבֶת pode indicar lâmina ou parte cortante; no caso de uma lança, “ponta” identifica naturalmente sua parte metálica ofensiva. “De ferro” traduz o material expresso em seguida.
- source_word: שֵׁשׁ מֵאוֹת שְׁקָלִים בַּרְזֶל
  choice: pesava seiscentos siclos
  rationale: O hebraico é elíptico, literalmente “seiscentos siclos de ferro”. O verbo “pesava” explicita em português a medida de peso sem alterar o sentido.
- source_word: נֹשֵׂא הַצִּנָּה
  choice: o homem que carregava o escudo grande
  rationale: A formulação corrente explicita o portador, e “escudo grande” preserva a provável referência de צִנָּה a um escudo que protegia boa parte do corpo.
- source_word: הֹלֵךְ לְפָנָיו
  choice: À sua frente ia
  rationale: Reproduz o movimento contínuo do particípio hebraico em uma ordem natural e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário militar acessível. A imagem concreta do tear e a antiga unidade de peso foram preservadas; evitou-se “lançadeira”, que não corresponde à peça pesada sugerida pelo hebraico.
