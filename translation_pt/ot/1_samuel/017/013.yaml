  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: pt
  text: 'Os três filhos mais velhos de Jessé tinham seguido Saul para a batalha. Os nomes dos três filhos de Jessé que tinham ido para a batalha eram: Eliabe, o primogênito; Abinadabe, o segundo; e Samá, o terceiro.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: tinham seguido / tinham ido
  rationale: O mais-que-perfeito composto apresenta a informação como pano de fundo narrativo. Na primeira ocorrência, “seguido” expressa naturalmente o acompanhamento de Saul; na oração relativa, “tinham ido” evita repetição pesada.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: os três filhos mais velhos de Jessé
  rationale: No contexto familiar, הַגְּדֹלִים indica idade ou senioridade, não tamanho físico nem grandeza social.
- source_word: אַחֲרֵי שָׁאוּל
  choice: seguido Saul
  rationale: אַחֲרֵי significa literalmente “atrás de/depois de”, mas aqui descreve os filhos acompanhando Saul na campanha; “seguir Saul” é natural em português e conserva esse sentido.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: para a batalha
  rationale: מִלְחָמָה pode significar guerra ou batalha. O contexto imediato aponta para uma ação militar específica, e “batalha” mantém essa concretude.
- source_word: וְשֵׁם
  choice: Estes eram os nomes
  rationale: Embora שֵׁם esteja no singular hebraico, a construção introduz uma lista de vários nomes; o plural é idiomático e claro em português.
- source_word: בָּנָיו
  choice: filhos dele
  rationale: O sufixo remete a Jessé. “Dele” mantém a coesão com o referente mencionado na frase anterior sem introduzir ambiguidade relevante.
- source_word: הַבְּכוֹר
  choice: o primogênito
  rationale: בְּכוֹר designa especificamente o status de primeiro filho, não apenas o mais velho.
- source_word: וּמִשְׁנֵהוּ
  choice: o segundo
  rationale: O termo indica o segundo na ordem dos irmãos; a formulação simples é natural em português e se harmoniza com a sequência ordinal.
- source_word: וְהַשְּׁלִשִׁי
  choice: e Samá, o terceiro
  rationale: Preserva explicitamente a enumeração ordinal do hebraico.
- source_word: שַׁמָּה
  choice: Samá
  rationale: Forma tradicional e legível em português para o nome hebraico שַׁמָּה.
theological_decisions: []
