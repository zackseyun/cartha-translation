  text: אִם יוּכַ֞ל לְ/הִלָּחֵ֤ם אִתִּ/י֙ וְ/הִכָּ֔/נִי וְ/הָיִ֥ינוּ לָ/כֶ֖ם לַ/עֲבָדִ֑ים וְ/אִם אֲנִ֤י אֽוּכַל ל/וֹ֙ וְ/הִכִּיתִ֔י/ו וִ/הְיִ֤יתֶם לָ֨/נוּ֙ לַ/עֲבָדִ֔ים וַ/עֲבַדְתֶּ֖ם אֹתָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your slaves. But if I prevail against him and strike him down[c][b], then you will be our slaves and serve us.
translation:
  language: pt
  text: Se ele for capaz de lutar comigo e me abater[c], seremos seus escravos[a]. Mas, se eu prevalecer contra ele[b] e o abater[c], vocês serão nossos escravos e nos servirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servos», nas duas ocorrências de עֲבָדִים. Aqui se usa «escravos» porque o contexto envolve a sujeição de um povo e seu serviço compulsório após o combate.
    reason: lexical_alternative
  - marker: b
    text: O verbo יכל, em «se eu prevalecer contra ele», pode ser traduzido mais literalmente como «se eu for capaz contra ele»; neste contexto de combate, porém, transmite a ideia de vencer ou prevalecer.
    reason: lexical_alternative
  - marker: c
    text: O verbo נכה, nas duas orações, também pode ser traduzido como «matar» ou «derrotar». «Abater» preserva a força decisiva da ação sem eliminar a amplitude do termo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל
  choice: for capaz
  rationale: O verbo יכל expressa capacidade; «for capaz» preserva de modo natural a condição formulada no desafio.
- source_word: לְהִלָּחֵם אִתִּי
  choice: de lutar comigo
  rationale: O infinitivo nifal de לחם com אֵת descreve combate mútuo; «lutar comigo» comunica claramente o duelo.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: me abater / o abater
  rationale: נכה pode indicar golpear, derrotar ou matar. «Abater» mantém o caráter decisivo do golpe sem explicitar além do hebraico se o resultado é necessariamente a morte.
- source_word: וְהָיִינוּ לָכֶם לַעֲבָדִים / וִהְיִיתֶם לָנוּ לַעֲבָדִים
  choice: seremos seus escravos / vocês serão nossos escravos
  rationale: עֲבָדִים designa aqui a sujeição de um povo ao outro após o combate; «escravos» torna explícita essa condição de domínio e serviço compulsório.
- source_word: אֲנִי אוּכַל לוֹ
  choice: eu prevalecer contra ele
  rationale: יכל com ל, neste contexto de combate, expressa conseguir vencer ou levar vantagem sobre o adversário; «prevalecer contra» conserva essa nuance contextual.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: e nos servirão
  rationale: O verbo עבד denota prestar serviço; a expressão complementa naturalmente a condição de escravidão mencionada na oração anterior.
