base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: pt
  text: Assim, Davi venceu o filisteu com uma funda e uma pedra; feriu o filisteu e o matou, embora não houvesse espada na mão de Davi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não havia espada na mão de Davi”. A conjunção hebraica pode ser traduzida mais formalmente pelo simples “e”; o texto principal usa “embora” para expressar o sentido concessivo da oração no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: Davi venceu o filisteu
  rationale: Nesta construção, חזק com מִן indica prevalecer ou mostrar-se mais forte que o adversário. “Venceu” é natural em português e adequado ao contexto de combate.
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: com uma funda e uma pedra
  rationale: A preposição בְּ indica instrumento. Mantém-se o singular “uma pedra”, correspondente ao hebraico.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: feriu o filisteu
  rationale: נכה significa golpear ou ferir. “Feriu” é claro, digno e evita uma formulação arcaica.
- source_word: וַיְמִיתֵהוּ
  choice: e o matou
  rationale: O hifil de מות expressa causar a morte; “matou” comunica diretamente esse sentido.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: embora não houvesse espada na mão de Davi
  rationale: A conjunção introduz aqui uma circunstância de valor concessivo. “Embora” explicita naturalmente o contraste contextual, enquanto a nota preserva a alternativa formal com “e”.
- source_word: בְּיַד דָּוִד
  choice: na mão de Davi
  rationale: A imagem concreta de “mão” é mantida, em vez de ser generalizada como mera posse, pois é natural no contexto do combate.
