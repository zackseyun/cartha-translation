  terminology: «O filisteu» preserva corretamente a designação hebraica sem acrescentar «campeão». «Vinha à frente» comunica adequadamente o avanço/aproximação no cenário do desafio; «tomava posição» é uma boa representação de וַיִּתְיַצֵּב.
