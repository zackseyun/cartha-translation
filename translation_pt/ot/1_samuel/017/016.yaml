  yaml_path: translation/ot/1_samuel/017/016.yaml
  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: pt
  text: Por quarenta dias, o filisteu vinha à frente pela manhã e ao entardecer e tomava posição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por quarenta dias, o filisteu se aproximava [...] e se posicionava”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: avançava
  rationale: O verbo נגשׁ significa aproximar-se ou chegar perto. Neste contexto militar e iterativo, “avançava” expressa naturalmente que o filisteu vinha à frente repetidas vezes.
- source_word: הַפְּלִשְׁתִּי
  choice: O filisteu
  rationale: O hebraico diz simplesmente “o filisteu”. Acrescentar “campeão” importaria uma designação de versículos próximos.
- source_word: הַשְׁכֵּם
  choice: de manhã
  rationale: O infinitivo adverbial indica o período da manhã, possivelmente cedo. “De manhã” forma uma expressão temporal natural com “à tarde” e preserva o ritmo diário.
- source_word: וְהַעֲרֵב
  choice: e à tarde
  rationale: A forma indica o período do entardecer. “De manhã e à tarde” é idiomático e compreensível em português amplo.
- source_word: וַיִּתְיַצֵּב
  choice: e tomava sua posição
  rationale: O hitpael de יצב significa posicionar-se, apresentar-se ou tomar posição. A escolha preserva a nuance reflexiva e se ajusta ao desafio militar repetido.
- source_word: אַרְבָּעִים יוֹם
  choice: durante quarenta dias
  rationale: A expressão indica duração; “durante” torna essa relação explícita e natural em português.
