translation_notes:
  register: Português moderno, digno e de leitura ampla, com pretérito imperfeito para comunicar a ação habitual indicada pelo contexto e pelas expressões temporais. A tradução mantém “o filisteu” sem explicitar Goliath nem acrescentar seu papel de campeão.
