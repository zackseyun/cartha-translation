  source_fidelity: 'A estrutura iterativa do pretérito imperfeito é defensável no contexto: o filisteu repetia essa ação em dois momentos do dia ao longo de quarenta dias. Contudo, «à tarde» é menos preciso para וְהַעֲרֵב, que se refere à tarde que chega/ao entardecer (isto é, à noite em sentido amplo), não simplesmente ao período vespertino.'
