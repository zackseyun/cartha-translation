base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: pt
  text: 'Quando Saul viu Davi saindo ao encontro do filisteu, perguntou a Abner, comandante do exército: “Abner, de quem esse jovem é filho?” Abner respondeu: “Tão certo como você vive, ó rei, eu não sei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: Quando ... viu
  rationale: A conjunção seguida do infinitivo construto introduz uma oração temporal; esta forma é natural em português e preserva a sequência narrativa.
- source_word: יֹצֵא לִ/קְרַאת
  choice: saindo ao encontro de
  rationale: Mantém o movimento expresso pelo particípio e o sentido usual de לקראת, sem acrescentar a ideia interpretativa de confronto.
- source_word: הַ/פְּלִשְׁתִּי
  choice: o filisteu
  rationale: Reproduz o gentílico singular definido do hebraico sem inserir “campeão”, termo não presente nesta oração.
- source_word: שַׂר הַ/צָּבָא
  choice: comandante do exército
  rationale: Expressa de modo claro e atual o título da principal autoridade militar.
- source_word: בֶּן מִי זֶה הַ/נַּעַר
  choice: de quem esse jovem é filho?
  rationale: Conserva a pergunta sobre a filiação de Davi em português natural; “jovem” é adequado a נער neste contexto.
- source_word: חֵי נַפְשְׁ/ךָ
  choice: Tão certo como você vive
  rationale: Comunica em português corrente a força da fórmula hebraica de juramento, literalmente ligada à vida da pessoa interpelada.
- source_word: אִם יָדָעְתִּי
  choice: eu não sei
  rationale: Em uma fórmula de juramento, אִם introduz elipticamente uma declaração negativa; a tradução explicita seu sentido pragmático.
