translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Abner, de quem...” preserva o vocativo do hebraico. A fórmula de juramento é vertida idiomaticamente no texto, dispensando nota.
