  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: pt
  text: Davi era o mais novo[a], e os três mais velhos tinham seguido Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E Davi era o mais novo, e os três mais velhos seguiram Saul». A conjunção hebraica pode ser traduzida simplesmente por «e», e o verbo pode ser vertido sem o mais-que-perfeito.'
    reason: alternativa lexical e narrativa
lexical_decisions:
- source_word: וְ/דָוִד
  choice: Davi
  rationale: O וְ liga a frase ao contexto, mas o português narrativo não exige que se explicite «e» no início; a ligação permanece clara.
- source_word: הוּא הַ/קָּטָן
  choice: era o mais novo
  rationale: No contraste entre irmãos, קָטָן designa idiomaticamente o mais jovem; o pronome independente hebraico não precisa ser reproduzido separadamente em português.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: e os três mais velhos
  rationale: Em contexto familiar, גְּדֹלִים refere-se aos irmãos de maior idade. «Mais velhos» é natural e não sugere necessariamente que fossem os três filhos mais velhos de toda a família além do contraste contextual.
- source_word: הָלְכוּ אַחֲרֵי
  choice: tinham seguido
  rationale: A expressão significa literalmente «foram atrás de» e, neste contexto militar, comunica acompanhar ou seguir Saul. O mais-que-perfeito composto apresenta a ação como anterior ao pano de fundo narrativo.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
