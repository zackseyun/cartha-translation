  yaml_path: translation/ot/1_samuel/017/056.yaml
  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: pt
  text: 'E o rei disse: “Pergunte você[a] de quem este rapaz é filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Procure saber de quem este rapaz é filho.”'
    reason: Alternativa lexical que expressa de forma idiomática o sentido de indagar ou averiguar presente em שְׁאַל.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva esse fluxo sem acrescentar uma nuance discursiva ausente do hebraico.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o substantivo definido e o título usado no texto hebraico, sem substituí-lo pelo nome de Saul.
- source_word: שְׁאַל
  choice: Pergunte
  rationale: O imperativo de שׁאל significa “perguntar” ou “indagar”. “Pergunte” é direto, atual e conserva a forma concreta da ordem; “procure saber” é uma alternativa idiomática que explicita o resultado pretendido.
- source_word: אַתָּה
  choice: você
  rationale: O pronome independente está expresso no hebraico e confere ênfase ao destinatário. A colocação após o imperativo preserva essa ênfase em português corrente.
- source_word: בֶּן מִי
  choice: de quem ... é filho
  rationale: Reproduz de modo idiomático a pergunta hebraica sobre a filiação paterna sem ampliar o sentido para uma identificação genealógica mais geral.
- source_word: זֶה
  choice: este
  rationale: Mantém o valor dêitico próximo do demonstrativo masculino singular, referindo-se ao rapaz presente ou imediatamente em vista.
- source_word: הָעָלֶם
  choice: rapaz
  rationale: Designa de modo natural e contemporâneo um jovem do sexo masculino; evita tanto o tom mais infantil de “menino” quanto uma formulação excessivamente formal.
