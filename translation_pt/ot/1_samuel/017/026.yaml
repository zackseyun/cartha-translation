base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: pt
  text: 'Davi perguntou aos homens que estavam com ele: “O que será feito pelo homem que matar este filisteu e livrar Israel dessa desonra? Pois quem é este filisteu incircunciso, este que afrontou as linhas de batalha do Deus vivo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: matar
  rationale: Neste contexto de combate, o verbo ‘ferir/golpear’ implica abater Golias; ‘matar’ comunica naturalmente o resultado pretendido em português.
- source_word: חֶרְפָּה
  choice: desonra
  rationale: Expressa a vergonha e afronta públicas impostas a Israel, com linguagem corrente e digna.
- source_word: מַעַרְכוֹת
  choice: linhas de batalha
  rationale: O plural designa as fileiras ou formações militares de Israel; a formulação preserva a imagem bélica.
- source_word: חֵרֵף
  choice: desafiar
  rationale: No contexto, indica afrontar com desprezo e provocações; ‘desafiar’ mantém a força e soa natural.
theological_decisions:
- issue: A caracterização de Golias como הֶעָרֵל (‘incircunciso’)
  choice: filisteu incircunciso
  alternative: filisteu não circuncidado
  rationale: Mantém a linguagem pactual e a carga retórica do hebraico sem acrescentar explicação doutrinária.
- issue: Construção כִּי מִי ... כִּי חֵרֵף
  choice: “Pois quem é este ... para desafiar...”
  alternative: “Pois quem é este ..., este que desafiou...”
  rationale: A construção portuguesa transmite a indignação retórica e a relação entre a identidade desprezada do filisteu e sua afronta, sem resolver além do necessário a flexibilidade sintática hebraica.
- issue: אֱלֹהִים חַיִּים
  choice: Deus vivo
  alternative: Deus vivente
  rationale: ‘Deus vivo’ é a expressão natural e tradicional em português e preserva o contraste teológico implícito com deuses sem vida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente naturalizada, preservando a pergunta retórica, a linguagem pactual e a imagem militar.
