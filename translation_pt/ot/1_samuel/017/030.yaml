base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/030.yaml
  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: pt
  text: Então ele se afastou dele, voltou-se para outro e disse a mesma coisa; e o povo lhe respondeu como antes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o povo lhe respondeu uma palavra como a primeira palavra”, isto é, deu-lhe a mesma resposta de antes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: se afastou dele, voltou-se
  rationale: A combinação expressa tanto o movimento de deixar Eliabe quanto o ato de dirigir-se a outra pessoa; a formulação portuguesa torna ambos os aspectos claros.
- source_word: אֶל מוּל אַחֵר
  choice: para outro
  rationale: No contexto, indica que Davi passou a dirigir-se a outra pessoa; esta é uma expressão natural e preserva a orientação do movimento.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: disse a mesma coisa
  rationale: דבר pode significar palavra, assunto ou coisa; aqui se refere à repetição da pergunta anterior de Davi.
- source_word: וַיְשִׁבֻהוּ
  choice: lhe respondeu
  rationale: O hifil de שוב tem aqui o sentido idiomático de dar ou devolver uma resposta.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém a amplitude do substantivo hebraico עם, embora no contexto se refira às pessoas presentes entre as tropas.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: como antes
  rationale: A expressão literalmente compara a resposta à primeira; em português, 'como antes' comunica isso com clareza e concisão.
