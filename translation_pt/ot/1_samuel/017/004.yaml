  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: pt
  text: Então saiu dos acampamentos dos filisteus um campeão[a], chamado Golias, de Gate. Sua altura era de seis côvados e um palmo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um homem do espaço entre”, provavelmente um guerreiro que se apresentava entre as linhas de batalha para representar seu exército em combate; daí, “campeão”.'
    reason: lexical_alternative
  - marker: b
    text: Seis côvados e um palmo correspondem a aproximadamente 2,9 metros, dependendo do côvado adotado.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: um campeão
  rationale: A expressão significa literalmente “homem do espaço entre”; no contexto, designa o guerreiro que se apresenta entre as linhas para combate representativo. “Campeão” comunica essa função de modo claro e natural.
- source_word: וַיֵּצֵא
  choice: Então saiu
  rationale: O verbo indica que ele saiu ou emergiu; “saiu” é natural na narrativa e mantém o ponto de vista sem acrescentar direção não explícita.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: dos acampamentos dos filisteus
  rationale: Mantém o plural hebraico מַחֲנוֹת e usa a forma portuguesa convencional para o povo.
- source_word: גָּלְיָת שְׁמוֹ
  choice: chamado Golias
  rationale: Equivale naturalmente à expressão hebraica “seu nome era Golias”, sem perda de conteúdo.
- source_word: מִגַּת
  choice: de Gate
  rationale: Expressa diretamente a procedência indicada no hebraico, em vez de empregar um gentílico.
- source_word: גָּבְהוֹ
  choice: Sua altura era
  rationale: Reproduz com clareza o substantivo hebraico referente à altura ou estatura.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: seis côvados e um palmo
  rationale: Conserva no texto as unidades antigas do original; a equivalência moderna aproximada aparece em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi ajustada para soar natural, preservando o plural “acampamentos”, a procedência “de Gate” e as medidas antigas. A nota métrica foi vinculada à medida, corrigindo a aparente troca de marcador presente na camada inglesa.
