base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: pt
  text: Então Davi correu, pôs-se junto ao filisteu[a], pegou a espada dele, tirou-a da bainha e o matou. Depois, com ela, cortou-lhe a cabeça. Quando os filisteus viram que o guerreiro deles estava morto[b], fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pôs-se sobre o filisteu”. A expressão hebraica pode indicar que Davi tomou posição junto dele; “sobre” corresponde à provável cena de Davi em pé por cima do filisteu caído.
    reason: lexical_alternative
  - marker: b
    text: Ou “o homem poderoso deles”, “o valente deles” ou “o campeão deles”. Neste contexto, o termo hebraico designa o grande guerreiro que representava os filisteus no combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: correu
  rationale: O verbo רוץ é o verbo narrativo comum para correr; a tradução simples preserva o ritmo da ação.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: pôs-se junto ao filisteu
  rationale: עמד com אֶל pode indicar tomar posição junto de alguém. A escolha conserva a relação espacial sem impor com certeza a imagem de estar por cima do filisteu caído.
- source_word: חַרְבּוֹ
  choice: a espada dele
  rationale: O sufixo possessivo refere-se ao filisteu. A formulação evita a possível ambiguidade de “sua espada” em português.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: tirou-a da bainha
  rationale: שלף descreve sacar ou tirar uma arma, e תער designa sua bainha; a expressão é natural e clara em português.
- source_word: וַיְמֹתְתֵהוּ
  choice: o matou
  rationale: A forma de מות apresenta Davi causando a morte do filisteu. A tradução mantém a sequência narrativa, mesmo após o golpe mortal relatado no versículo anterior.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: com ela, cortou-lhe a cabeça
  rationale: כרת com רֹאשׁ descreve cortar ou decepar a cabeça, e o pronome feminino remete à espada.
- source_word: גִּבּוֹרָם
  choice: o guerreiro deles
  rationale: גבור pode significar homem poderoso, valente ou guerreiro. “Guerreiro” preserva o sentido lexical sem transformar explicitamente a função contextual de combate representativo no próprio texto.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: נוס é o verbo habitual para fuga, especialmente em contexto militar.
