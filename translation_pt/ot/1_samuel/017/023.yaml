  text: וְ/ה֣וּא מְדַבֵּ֣ר עִמָּ֗/ם וְ/הִנֵּ֣ה אִ֣ישׁ הַ/בֵּנַ֡יִם עוֹלֶ֞ה גָּלְיָת֩ הַ/פְּלִשְׁתִּ֨י שְׁמ֤/וֹ מִ/גַּת֙ מ/מערות פְּלִשְׁתִּ֔ים וַ/יְדַבֵּ֖ר כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וַ/יִּשְׁמַ֖ע דָּוִֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: pt
  text: Enquanto Davi falava com eles, eis que subiu das fileiras dos filisteus[b] o campeão[a], o filisteu de Gate chamado Golias. Ele disse estas palavras, e Davi ouviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “o homem entre [os dois lados/as duas linhas]”, expressão que designa um guerreiro representante em combate individual.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é textualmente difícil e provavelmente se refere às linhas de batalha ou fileiras dos filisteus; alguns traduzem “dos acampamentos dos filisteus”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא מְדַבֵּר עִמָּם
  choice: Enquanto Davi falava com eles
  rationale: O particípio com o pronome indica uma ação em andamento. O nome “Davi” explicita naturalmente o referente sem alterar o sentido, e “com eles” preserva o caráter de conversa expresso por עִם.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém o marcador narrativo que introduz de modo vívido e repentino a aparição de Golias.
- source_word: אִישׁ הַבֵּנַיִם
  choice: o campeão
  rationale: A expressão idiomática designa o guerreiro representante que se coloca entre os dois lados para combate individual. A forma literal é registrada em nota.
- source_word: עוֹלֶה
  choice: subiu
  rationale: Embora seja particípio, no fluxo narrativo descreve a entrada de Golias em cena. “Subiu” é natural em português e conserva o movimento indicado pelo verbo.
- source_word: גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: o filisteu de Gate chamado Golias
  rationale: Reproduz de maneira clara e natural a identificação do guerreiro, sua origem e seu nome.
- source_word: מ/מערות פְּלִשְׁתִּים
  choice: das fileiras dos filisteus
  rationale: A tradição textual é difícil, mas a leitura contextual mais provável aponta para as linhas ou formações militares filisteias. A dificuldade e a alternativa “acampamentos” são preservadas em nota.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: Ele disse estas palavras
  rationale: Conserva a referência demonstrativa às palavras ou ao desafio anteriormente proferido por Golias, sem substituir o texto por uma explicação.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: e Davi ouviu
  rationale: Mantém a construção narrativa simples e deixa implícito o objeto da audição, como no hebraico.
theological_decisions: []
