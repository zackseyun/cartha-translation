base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: pt
  text: 'E o filisteu disse a Davi: “Venha até mim, e eu darei a sua carne às aves do céu e aos animais do campo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: o filisteu
  rationale: O substantivo com artigo identifica Golias de modo convencional, sem acrescentar “guerreiro”, ideia presente no contexto, mas não explícita aqui.
- source_word: לְכָה אֵלַי
  choice: Venha até mim
  rationale: O imperativo de הלך seguido da expressão direcional funciona como desafio direto; “Venha até mim” é natural e preserva essa força.
- source_word: וְאֶתְּנָה
  choice: e eu darei
  rationale: A forma expressa forte determinação de primeira pessoa e, nesta ameaça, é bem representada pelo futuro “eu darei”.
- source_word: בְּשָׂרְךָ
  choice: a sua carne
  rationale: Mantém a imagem literal, vívida e brutal de בשר, sem substituí-la por termos mais interpretativos como “corpo” ou “cadáver”.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: às aves do céu
  rationale: “Aves” é o equivalente natural de עוף neste contexto, e “do céu” reproduz de modo corrente a expressão hebraica.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: e aos animais do campo
  rationale: בהמה pode designar animais ou feras; “animais do campo” preserva a formulação hebraica com linguagem clara e digna, sem especificar uma ferocidade que o termo isolado não exige.
theological_decisions: []
