revisions:
- from: 'Ele se pôs de pé, gritou às fileiras de batalha de Israel e lhes disse: “Por que vocês saem para se pôr em formação de batalha?[a] Não sou eu o filisteu, e não são vocês escravos de Saul?[b] Escolham um homem entre vocês, e que ele desça até mim.”'
  to: 'Ele se pôs de pé e gritou para as fileiras de Israel, dizendo-lhes: “Por que vocês saem para se posicionar em ordem de batalha?[a] Não sou eu o filisteu, e vocês não são escravos de Saul?[b] Escolham um homem dentre vocês, e que ele desça até mim.”'
  rationale: A revisão é estilística e lexicalmente conservadora. Ela conserva todas as relações sintáticas e o tom provocador do hebraico, melhora a fluência em português moderno e mantém as duas notas ancoradas exatamente nas expressões a que se referem.
