base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not slaves of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: pt
  text: 'Ele se pôs de pé e gritou para as fileiras de Israel, dizendo-lhes: “Por que vocês saem para se posicionar em ordem de batalha?[a] Não sou eu o filisteu, e vocês não são escravos de Saul?[b] Escolham um homem dentre vocês, e que ele desça até mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para se alinhar para a batalha”. A expressão hebraica se refere literalmente a organizar ou dispor as tropas para o combate.
    reason: lexical_alternative
  - marker: b
    text: Ou “servos de Saul”. O termo hebraico עֲבָדִים pode significar “servos” ou “escravos”; aqui, “escravos” preserva a força insultuosa da provocação de Golias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Ele se pôs de pé
  rationale: Expressa naturalmente a ação e a postura confrontadora de עמד no contexto narrativo.
- source_word: וַיִּקְרָא
  choice: gritou
  rationale: O verbo descreve aqui um chamado público e audível de um lado do campo de batalha ao outro.
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: fileiras de batalha de Israel
  rationale: Preserva a ideia de tropas dispostas em formação militar, em vez do sentido mais amplo de exército.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: se pôr em formação de batalha
  rationale: Mantém a imagem concreta de organizar ou alinhar as tropas para o combate e soa natural em português atual.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: Não sou eu o filisteu
  rationale: O artigo definido apresenta Golias como o representante ou campeão dos filisteus; a pergunta retórica conserva o tom de provocação.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: escravos de Saul
  rationale: עֲבָדִים pode designar servos ou escravos; neste insulto, “escravos” preserva melhor a força depreciativa da subordinação imposta por Golias aos israelitas.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: Escolham um homem entre vocês
  rationale: Conserva o masculino singular explícito e comunica com naturalidade a escolha de um combatente para o duelo representativo.
- source_word: וְיֵרֵד אֵלָי
  choice: e que ele desça até mim
  rationale: A construção com “que” representa o valor volitivo do hebraico após o imperativo, enquanto “desça” preserva a direção expressa por ירד.
theological_decisions:
- issue: Amplitude semântica de עֲבָדִים na provocação de Golias
  choice: escravos de Saul
  alternative: servos de Saul
  rationale: Nenhuma doutrina específica depende da escolha. “Escravos” retém a linguagem deliberadamente humilhante da provocação, enquanto a alternativa é registrada em nota para preservar a amplitude lexical.
- issue: Masculino singular de אִישׁ
  choice: um homem
  alternative: uma pessoa ou um guerreiro
  rationale: O texto especifica um combatente masculino singular para um duelo representativo; não há razão textual para neutralizar ou ampliar o termo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. A fala direta mantém o tom público e provocador de Golias sem arcaísmos desnecessários. As notas foram posicionadas junto às expressões a que se referem e ordenadas conforme sua ocorrência no texto.
