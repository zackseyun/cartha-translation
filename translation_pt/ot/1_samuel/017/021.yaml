translation:
  language: pt
  text: Israel e os filisteus se posicionaram em formação de batalha, formação contra formação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “formação diante de formação” ou “linha de batalha contra linha de batalha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: se puseram em formação de batalha
  rationale: O verbo ערך, neste contexto militar, descreve a disposição ordenada das tropas para o combate. A formulação é natural em português moderno e conserva o sentido militar.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio nacional em sua forma portuguesa consagrada.
- source_word: וּפְלִשְׁתִּים
  choice: e os filisteus
  rationale: Designação étnica tradicional e amplamente compreensível em português.
- source_word: מַעֲרָכָה
  choice: linha de frente
  rationale: O substantivo designa aqui uma formação ou linha militar disposta para a batalha. 'Linha de frente' comunica claramente a imagem no português atual.
- source_word: לִקְרַאת
  choice: diante da outra
  rationale: A preposição indica que as duas formações estavam voltadas uma para a outra. 'Diante da outra' preserva a relação espacial sem explicitar além do hebraico o confronto já evidente no contexto.
- source_word: מַעֲרָכָה
  choice: linha de frente
  rationale: A repetição da mesma expressão preserva a repetição enfática e a simetria da construção hebraica.
