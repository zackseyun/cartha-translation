  text: וַ/יַּלְבֵּ֨שׁ שָׁא֤וּל אֶת דָּוִד֙ מַדָּ֔י/ו וְ/נָתַ֛ן ק֥וֹבַע נְחֹ֖שֶׁת עַל רֹאשׁ֑/וֹ וַ/יַּלְבֵּ֥שׁ אֹת֖/וֹ שִׁרְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/038.yaml
  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: pt
  text: Então Saul vestiu Davi com as próprias vestes de Saul[a], pôs-lhe na cabeça um capacete de bronze e o vestiu com uma armadura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com seu traje militar”. O termo hebraico pode designar vestes ligadas à posição oficial ou ao combate.
    reason: lexical_alternative
  - marker: b
    text: Ou “com uma couraça”. O termo hebraico designa uma proteção para o corpo, mas sua construção exata não é especificada aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: vestiu
  rationale: O hifil de לבשׁ indica fazer alguém usar determinada peça. “Vestiu” expressa naturalmente esse sentido causativo e, por ocorrer duas vezes no hebraico, foi repetido no texto.
- source_word: מַדָּיו
  choice: suas vestes
  rationale: מַד pode designar roupas, inclusive traje oficial ou militar. A tradução ampla evita confundir essas vestes com a armadura mencionada separadamente; o sufixo masculino singular remete a Saul.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: um capacete de bronze
  rationale: קוֹבַע designa um capacete, e נְחֹשֶׁת, no contexto de armamento antigo, é traduzido de modo apropriado por “bronze”.
- source_word: עַל רֹאשׁוֹ
  choice: na cabeça
  rationale: A construção “pôs-lhe na cabeça” é idiomática em português e transmite diretamente a relação espacial do hebraico.
- source_word: שִׁרְיוֹן
  choice: uma armadura
  rationale: O termo indica proteção corporal, mas não especifica de forma inequívoca sua construção. “Armadura” é atual, clara e preserva essa generalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “vestiu” acompanha deliberadamente a repetição do verbo hebraico. O pronome em “suas vestes” refere-se a Saul pelo contexto e pelo sufixo do texto-fonte.
