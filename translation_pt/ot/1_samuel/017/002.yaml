base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: pt
  text: Saul e os homens de Israel se reuniram e acamparam no vale de Elá. Então se posicionaram em formação de batalha diante dos filisteus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁאוּל
  choice: Saul
  rationale: A conjunção liga o versículo à narrativa anterior, mas em português a continuidade é transmitida naturalmente sem iniciar a frase com “E”.
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: e os homens de Israel
  rationale: O singular אִישׁ tem sentido coletivo neste contexto militar; “os homens de Israel” preserva esse valor sem substituí-lo pela interpretação mais específica “exército”.
- source_word: נֶאֶסְפוּ
  choice: se reuniram
  rationale: Expressa de modo natural o nifal com sentido de reunião ou concentração coletiva.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: Tradução direta e corrente para o ato de estabelecer acampamento.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: no vale de Elá
  rationale: עֵמֶק significa “vale”, e הָאֵלָה funciona aqui como nome geográfico, transliterado de forma legível em português.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: se posicionaram em formação de batalha
  rationale: A expressão idiomática descreve a disposição organizada das tropas para o combate; esta formulação torna explícito o sentido militar sem recorrer a linguagem arcaica.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: diante dos filisteus
  rationale: לִקְרַאת pode indicar encontro, posição frontal ou oposição. “Diante dos filisteus” preserva a imagem espacial e, no contexto, deixa clara a confrontação sem reduzir a expressão apenas a “contra”.
