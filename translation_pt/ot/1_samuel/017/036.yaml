  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: pt
  text: O teu servo abateu tanto o leão como o urso, e este filisteu incircunciso será como um deles, pois desafiou as linhas de batalha[a] do Deus vivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os exércitos do Deus vivo”. O termo hebraico pode significar “linhas de batalha”, “fileiras” ou, por extensão, “exércitos”.
    reason: alternativa lexical
lexical_decisions:
- source_word: הִכָּה
  choice: abateu
  rationale: O verbo נכה expressa golpear ou derrubar. Neste contexto, “abateu” comunica naturalmente que Davi venceu os predadores, sem substituir o verbo por uma explicitação mais estreita como “matou”.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: Na fala dirigida a Saul, a expressão é uma forma respeitosa de Davi referir-se a si mesmo; “servo” preserva esse uso de deferência.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: o leão ... o urso
  rationale: Os dois substantivos têm artigo no hebraico. A formulação definida apresenta os animais que Davi enfrentou em sua recordação.
- source_word: וְהָיָה
  choice: será
  rationale: A forma verbal tem valor preditivo no contexto e expressa de modo conciso a confiança de Davi quanto ao destino do filisteu.
- source_word: הֶעָרֵל
  choice: incircunciso
  rationale: Mantém a referência literal ao sinal físico da aliança e conserva a força retórica e teológica da descrição de Davi.
- source_word: כְּאַחַד מֵהֶם
  choice: como um deles
  rationale: Preserva a comparação distributiva entre o destino do filisteu e o dos dois predadores.
- source_word: חֵרֵף
  choice: desafiou
  rationale: O verbo חרף pode significar afrontar, insultar ou desafiar. “Desafiou” expressa com clareza o desprezo hostil no contexto militar e teológico.
- source_word: מַעַרְכֹת
  choice: as linhas de batalha
  rationale: O substantivo designa formações, fileiras ou linhas dispostas para o combate. “Linhas de batalha” preserva a imagem militar concreta; a alternativa “exércitos” é registrada em nota.
- source_word: אֱלֹהִים חַיִּים
  choice: o Deus vivo
  rationale: É a expressão hebraica convencional que ressalta que Deus é vivo e atuante. Embora אֱלֹהִים tenha forma plural, o sentido aqui é singular.
theological_decisions:
- issue: Força pactual de הֶעָרֵל na descrição do filisteu
  choice: Manter “incircunciso” literalmente no texto principal
  alternative: “fora da aliança” ou “ímpio”
  rationale: O hebraico emprega o sinal físico da aliança como descrição depreciativa. A tradução literal preserva o contraste pactual sem transformá-lo em paráfrase interpretativa.
- issue: Sentido de מַעַרְכֹת em relação a Deus
  choice: Traduzir por “linhas de batalha”
  alternative: “exércitos” ou “fileiras” do Deus vivo
  rationale: A expressão provavelmente se refere às formações de combate de Israel como pertencentes ao Deus vivo. “Linhas de batalha” conserva a imagem concreta e a nota mantém disponível a extensão semântica tradicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento “teu” preserva a fala direta e respeitosa a Saul. “Abateu” evita tanto o arcaísmo de “feriu de morte” quanto a explicitação excessiva de “matou”. O marcador da nota foi colocado junto à expressão a que a nota se refere.
