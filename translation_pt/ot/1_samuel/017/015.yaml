  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: pt
  text: Davi ia e voltava da presença de Saul para pastorear o rebanho de seu pai em Belém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Davi ia e tornava de junto de Saul para apascentar o rebanho de seu pai em Belém.”'
    reason: Alternativa lexical mais próxima da forma do hebraico para הֹלֵךְ וָשָׁב, מֵעַל e לִרְעוֹת.
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: ia e voltava
  rationale: A combinação verbal indica movimento repetido ou habitual. “Ia e voltava” conserva esse aspecto iterativo em português natural, sem reduzi-lo a uma única viagem.
- source_word: מֵעַל שָׁאוּל
  choice: da presença de Saul
  rationale: A preposição indica aqui o afastamento do lugar ou da companhia de Saul. “Da presença de Saul” torna explícito o sentido contextual sem acrescentar uma função não declarada no hebraico.
- source_word: לִרְעוֹת
  choice: para pastorear
  rationale: O infinitivo de רעה descreve a atividade própria do pastor. “Pastorear” preserva sua força verbal e o contexto pecuário.
- source_word: צֹאן
  choice: o rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanho” mantém essa abrangência melhor do que “ovelhas”.
- source_word: אָבִיו
  choice: de seu pai
  rationale: Esta é a forma possessiva natural em português e mantém clara a relação do rebanho com o pai de Davi.
- source_word: בֵּית לָחֶם
  choice: Belém
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do lugar.
- source_word: וְ
  choice: sem conectivo explícito
  rationale: O waw liga a frase ao contexto narrativo, mas um “e” inicial seria dispensável e menos natural neste versículo explicativo; sua função discursiva é preservada pela continuidade do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o caráter habitual do movimento de Davi e evita introduzir um marcador temporal sem correspondente explícito no hebraico.
