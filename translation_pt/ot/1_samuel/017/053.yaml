  text: וַ/יָּשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/דְּלֹ֖ק אַחֲרֵ֣י פְלִשְׁתִּ֑ים וַ/יָּשֹׁ֖סּוּ אֶת מַחֲנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: pt
  text: Os israelitas voltaram de perseguir os filisteus e saquearam os acampamentos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltaram da perseguição aos filisteus e saquearam o acampamento deles”.
    reason: Alternativa de construção para «de perseguir» e possível emprego coletivo do singular para o hebraico plural referente ao acampamento.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: Expressa naturalmente o sentido básico de שוב, indicando o retorno após a perseguição.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Equivalente português corrente e coletivo para a expressão hebraica literalmente traduzida por “filhos de Israel”; evita uma formulação pouco natural sem alterar o referente.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: da perseguição aos
  rationale: Reproduz de modo fluente a ideia de cessar a perseguição cerrada e voltar dela.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional e corrente em português para o nome desse povo.
- source_word: וַיָּשֹׁסּוּ
  choice: saquearam
  rationale: Verbo moderno e apropriado ao contexto militar para a ação de tomar os bens do inimigo vencido.
- source_word: מַחֲנֵיהֶם
  choice: o acampamento deles
  rationale: Embora a forma massorética possa ser entendida morfologicamente como plural, no contexto o coletivo singular é idiomático e preserva a possível referência ao acampamento filisteu; a alternativa plural é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Israelitas” é preferido a “filhos de Israel” por ser idiomático em português; a nota preserva as alternativas relevantes da construção hebraica.
