  yaml_path: translation/ot/1_samuel/017/041.yaml
  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: pt
  text: O filisteu continuou avançando[a] e se aproximando de Davi, enquanto o homem que carregava o escudo[b] ia à sua frente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “avançou, indo e se aproximando de Davi”. O hebraico emprega um verbo conjugado seguido de particípios para retratar um avanço contínuo.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida como “escudo” (צִנָּה) pode designar especificamente um escudo grande.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב
  choice: O filisteu continuou avançando e se aproximando
  rationale: A combinação do verbo finito com os particípios retrata movimento contínuo para a frente. A formulação portuguesa preserva o aspecto progressivo e o contexto de confronto sem acrescentar a ideia de “campeão”, ausente neste versículo.
- source_word: אֶל דָּוִד
  choice: de Davi
  rationale: Com “se aproximando”, a regência natural em português é “aproximar-se de”; isso expressa a direção marcada por אֶל.
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  choice: enquanto o homem que carregava o escudo
  rationale: A oração descreve uma circunstância simultânea ao avanço do filisteu. “Carregava” traduz naturalmente o particípio נֹשֵׂא, e “escudo” mantém no texto principal a designação geral de צִנָּה.
- source_word: לְפָנָיו
  choice: ia à sua frente
  rationale: Indica que o escudeiro se deslocava diante do filisteu. O verbo “ia” torna explícito, de modo natural, que ele acompanhava o avanço.
