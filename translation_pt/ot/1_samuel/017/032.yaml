  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל אַל יִפֹּ֥ל לֵב אָדָ֖ם עָלָ֑י/ו עַבְדְּ/ךָ֣ יֵלֵ֔ךְ וְ/נִלְחַ֖ם עִם הַ/פְּלִשְׁתִּ֥י הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: pt
  text: 'Então Davi disse a Saul: “Que ninguém perca a coragem por causa dele.[a] Seu servo irá lutar com este filisteu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “por causa deste filisteu”. O hebraico diz “por causa dele”, e o contexto identifica a pessoa referida.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: Que ninguém perca a coragem
  rationale: A expressão hebraica diz literalmente que o coração de alguém não deve cair. “Perder a coragem” comunica de modo natural o sentido do idioma sem alterar sua força.
- source_word: אָדָם
  choice: ninguém
  rationale: Aqui o substantivo singular tem sentido humano genérico. Na construção negativa, “ninguém” é claro, abrangente e idiomático em português.
- source_word: עָלָיו
  choice: por causa dele
  rationale: Mantém o pronome hebraico e sua referência contextual ao filisteu, sem explicitar no texto principal o que o original deixa implícito.
- source_word: עַבְדְּךָ
  choice: Seu servo
  rationale: É a forma natural de autorreferência respeitosa diante do rei neste contexto; “escravo” enfatizaria indevidamente uma condição que não está em primeiro plano.
- source_word: יֵלֵךְ וְנִלְחַם
  choice: irá lutar
  rationale: Os verbos exprimem a decisão de Davi de ir e combater. Em português, “irá lutar” transmite naturalmente a intenção; o deslocamento fica implícito no uso de “ir” como auxiliar.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: contra esse filisteu
  rationale: Embora עִם signifique normalmente “com”, em contexto de combate indica confronto com um adversário; “contra” torna essa relação inequívoca em português.
