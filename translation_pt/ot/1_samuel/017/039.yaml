base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: pt
  text: 'Davi prendeu a espada por cima do equipamento[a] e tentou ir, pois não o tinha testado. Então Davi disse a Saul: “Não posso ir com estas coisas[b], pois não as testei.” E Davi as tirou de si.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo também pode significar vestes ou traje; no contexto militar, pode referir-se à armadura ou ao equipamento de combate.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “estes”. O demonstrativo retoma o conjunto do equipamento que Davi estava usando.
    reason: source_fidelity
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: prendeu
  rationale: חגר descreve o ato de cingir ou prender uma arma ao corpo; “prendeu” é natural em português moderno e conserva a ação concreta.
- source_word: חַרְבּוֹ
  choice: a espada
  rationale: Tradução direta de חֶרֶב com sufixo possessivo, cujo possuidor já está claro pelo sujeito Davi.
- source_word: מֵעַל לְמַדָּיו
  choice: por cima da armadura
  rationale: לְמַדִּים pode designar vestes ou traje; no contexto militar imediato, refere-se à armadura que Saul colocou em Davi.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: tentou andar
  rationale: A construção יאל com infinitivo pode significar empreender ou aventurar-se a fazer algo. Aqui indica que Davi ensaiou mover-se com o equipamento antes de rejeitá-lo.
- source_word: כִּי לֹא נִסָּה
  choice: pois ainda não a tinha experimentado
  rationale: נסה no piel denota testar ou experimentar pelo uso. O objeto está implícito no hebraico; o singular coletivo “armadura” fornece em português um referente natural.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: Não consigo andar com isto
  rationale: הלך aqui trata da capacidade de mover-se, e בָּאֵלֶּה aponta para o equipamento que Davi está usando. “Com isto” mantém o demonstrativo sem restringi-lo indevidamente.
- source_word: לֹא נִסִּיתִי
  choice: pois não o experimentei
  rationale: Mantém o mesmo núcleo lexical de נסה empregado anteriormente e expressa a falta de experiência prática, sem expandir para “não estou acostumado” no texto principal.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: E Davi tirou tudo aquilo
  rationale: O hiphil de סור significa remover. “Tirou tudo aquilo” é português natural e deixa claro que ele retirou de si o conjunto do equipamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construções de ampla compreensão no Brasil e no restante do mundo lusófono. A repetição do verbo “experimentar” preserva a correspondência com o hebraico, enquanto pronomes singulares tratam “armadura” como referente coletivo.
