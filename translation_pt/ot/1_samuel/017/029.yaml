  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: pt
  text: 'Davi disse: “O que foi que eu fiz agora? Não foi apenas uma palavra?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não era apenas um assunto?” A palavra hebraica דָּבָר pode significar “palavra”, “assunto” ou “coisa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר que introduz discurso direto; “disse” é o equivalente natural em português.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: O que foi que eu fiz agora?
  rationale: Preserva a pergunta de protesto e a exasperação de Davi; a construção com “foi que” é natural no português atual e dá ênfase sem acrescentar conteúdo.
- source_word: הֲלוֹא
  choice: Não foi
  rationale: Mantém a pergunta retórica que espera resposta afirmativa e se ajusta ao protesto sobre o que Davi acabara de fazer.
- source_word: דָּבָר
  choice: uma palavra
  rationale: O termo pode significar “palavra”, “assunto” ou “coisa”. “Uma palavra” conserva o sentido lexical mais direto e a possível ideia de que Davi apenas falou, sem eliminar a ambiguidade.
- source_word: הוּא
  choice: foi
  rationale: 'O pronome copulativo hebraico é expresso naturalmente em português pela construção verbal da pergunta: “Não foi apenas uma palavra?”'
