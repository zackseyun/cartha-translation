base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: pt
  text: 'Então o filisteu disse: “Hoje[c], desafiei[a] as fileiras de Israel[b]. Deem-me um homem, e lutemos um contra o outro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido por “insultei”, “zombei de” ou “afrontei”. “Desafiei” expressa a provocação hostil no contexto militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “as linhas de batalha de Israel” ou, por extensão, “os exércitos de Israel”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “neste dia”; também pode ser traduzido simplesmente por “hoje”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: o filisteu
  rationale: O substantivo com artigo identifica Golias por sua origem; “campeão” não faz parte deste termo e seria informação importada do contexto.
- source_word: חֵרַפְתִּי
  choice: afrontei
  rationale: O verbo expressa desprezo insultuoso e provocação aberta. “Afrontar” preserva tanto a ofensa quanto o desafio militar, sem reduzir o sentido a mero combate.
- source_word: מַעַרְכוֹת
  choice: as fileiras
  rationale: O plural designa formações militares organizadas. “Fileiras” mantém essa imagem mais específica, embora por extensão possa referir-se aos exércitos.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje mesmo
  rationale: A expressão é literalmente “este dia”. “Hoje mesmo” é natural em português e preserva a ênfase demonstrativa da declaração.
- source_word: תְּנוּ לִי אִישׁ
  choice: Deem-me um homem
  rationale: A tradução mantém a construção direta “dar a mim” e a força provocadora da exigência por um representante para o combate.
- source_word: וְנִלָּחֲמָה
  choice: e lutemos
  rationale: A forma coortativa expressa convite ou desafio volitivo; “lutemos” preserva melhor essa força do que um simples futuro.
- source_word: יָחַד
  choice: um contra o outro
  rationale: Embora o sentido básico seja “juntos”, no contexto de combate singular a expressão indica confronto mútuo. “Um contra o outro” torna clara essa relação sem acrescentar participantes.
