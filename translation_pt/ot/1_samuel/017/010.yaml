  terminology: “O filisteu”, “fileiras de Israel”, “um homem” e a forma coortativa “lutemos” são escolhas adequadas. A nota de “fileiras” preserva corretamente as alternativas militares. A nota temporal deve indicar literalmente “neste dia”, refletindo mais precisamente הַיּוֹם הַזֶּה.
