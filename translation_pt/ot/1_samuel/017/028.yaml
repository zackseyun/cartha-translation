  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: pt
  text: 'Eliabe, o irmão mais velho de Davi, ouviu-o falando aos homens. E a ira de Eliabe se acendeu contra Davi, e ele disse: “Por que você desceu até aqui? Com quem deixou aquelas poucas ovelhas no deserto? Eu conheço a sua arrogância[a] e a maldade do seu coração[b], pois você desceu para ver a batalha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua presunção” ou “a sua insolência”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a perversidade do seu coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַבְּרוֹ
  choice: ouviu-o falar
  rationale: 'O infinitivo construto com ב e sufixo de terceira pessoa indica a circunstância em curso: Eliabe ouviu Davi enquanto este falava.'
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Mantém o sentido comum do substantivo sem explicitar “soldados”, embora o contexto seja militar.
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: Preserva de modo natural a imagem hebraica da ira que arde.
- source_word: לָמָּה זֶּה יָרַדְתָּ
  choice: Por que você desceu até aqui?
  rationale: “Desceu” reflete ירד, e “até aqui” comunica de maneira idiomática a força contextual de זֶה.
- source_word: וְעַל־מִי נָטַשְׁתָּ
  choice: Com quem deixou
  rationale: Expressa o sentido prático de deixar o rebanho aos cuidados de alguém, sem intensificar o verbo como abandono absoluto.
- source_word: מְעַט הַצֹּאן הָהֵנָּה
  choice: aquelas poucas ovelhas
  rationale: Reproduz a referência demonstrativa e o tom depreciativo de Eliabe quanto ao pequeno número de ovelhas.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: É a tradução tradicional e ampla para a região não cultivada usada como pastagem, embora “sertão” ou “campo aberto” também sejam possíveis conforme o contexto.
- source_word: זְדֹנְךָ
  choice: a sua arrogância
  rationale: O termo pode indicar arrogância, insolência ou presunção; “arrogância” é claro e atual em português.
- source_word: רֹעַ לְבָבֶךָ
  choice: a maldade do seu coração
  rationale: Mantém tanto a avaliação moral negativa quanto a referência ao coração como centro interior da pessoa.
- source_word: לְמַעַן רְאוֹת הַמִּלְחָמָה
  choice: só para ver a batalha
  rationale: A construção indica propósito. “Só” torna natural em português o tom acusatório e depreciativo da fala, sem alterar o propósito declarado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A repetição do nome de Eliabe foi mantida na segunda oração para acompanhar a ênfase narrativa hebraica; na primeira, “de Davi” esclarece sem ambiguidade a referência do pronome hebraico “seu”. As notas foram posicionadas junto aos termos a que efetivamente se referem.
