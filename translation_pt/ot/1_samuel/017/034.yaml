  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: pt
  text: 'Davi disse a Saul: “Este seu servo cuidava das ovelhas de seu pai. Quando vinha um leão ou um urso[a] e levava uma ovelha[b] do rebanho,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente, “o leão e o urso”. O hebraico usa “e”, mas o sentido provavelmente é distributivo: um ou outro predador vinha.'
    reason: lexical_alternative
  - marker: b
    text: Ou “um cordeiro” ou, em sentido mais amplo, “um animal do rebanho”; o termo hebraico não indica necessariamente um animal jovem e pode abranger ovelhas ou cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: cuidava das ovelhas
  rationale: A construção com particípio e הָיָה descreve a atividade habitual de Davi. Em português, “cuidava das ovelhas” é mais natural do que uma formulação ocupacional rígida e preserva o sentido de pastorear.
- source_word: עַבְדְּךָ
  choice: este seu servo
  rationale: É uma forma convencional e humilde de Davi referir-se a si mesmo diante do rei. “Este seu servo” conserva a deferência cortesã sem sugerir necessariamente escravidão.
- source_word: לְאָבִיו בַּצֹּאן
  choice: das ovelhas de seu pai
  rationale: A expressão indica que Davi pastoreava para o pai, junto ao rebanho. A formulação portuguesa reúne naturalmente a relação de posse e a atividade pastoral.
- source_word: וּבָא
  choice: quando vinha
  rationale: 'No relato de uma prática passada, a forma tem valor habitual: Davi descreve o que ocorria quando um predador atacava. O imperfeito “vinha” comunica essa repetição.'
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: um leão ou um urso
  rationale: 'Embora o hebraico empregue formalmente a conjunção “e”, o sentido provável é distributivo: qualquer um dos dois predadores podia vir. “Ou” expressa isso com naturalidade em português.'
- source_word: וְנָשָׂא
  choice: levava
  rationale: Neste contexto, נשא descreve o predador tomando e carregando sua presa. “Levava” é claro e combina com a descrição habitual no passado.
- source_word: שֶׂה
  choice: uma ovelha
  rationale: O termo pode designar um animal do rebanho miúdo e não exige que seja jovem. “Ovelha” evita restringir o sentido a “cordeiro”, embora a abrangência lexical seja registrada em nota.
- source_word: מֵהָעֵדֶר
  choice: do rebanho
  rationale: “Rebanho” é o termo português adequado para o conjunto de animais pastoreados e traduz com precisão a origem da presa.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A fala mantém a deferência de Davi diante de Saul. O aspecto habitual foi preservado por “cuidava” e “vinha”, e as ambiguidades relativas aos predadores e ao tipo de animal foram explicitadas em notas.
