  yaml_path: translation/ot/1_samuel/017/031.yaml
  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: pt
  text: Quando ouviram as palavras que Davi havia dito, contaram-nas a Saul, e ele mandou buscar Davi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e ele o tomou”. O hebraico provavelmente significa que Saul mandou trazer Davi à sua presença.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: Quando ouviram
  rationale: Mantém a forma ativa plural do hebraico sem precisar identificar os ouvintes, que permanecem indefinidos no contexto.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: as palavras que Davi havia dito
  rationale: “Palavras” preserva o contexto de fala, e o mais-que-perfeito situa naturalmente a fala antes do relato a Saul.
- source_word: וַיַּגִּדוּ
  choice: contaram-nas
  rationale: Expressa o ato de comunicar a Saul as palavras de Davi em português corrente e narrativo.
- source_word: לִפְנֵי שָׁאוּל
  choice: a Saul
  rationale: A expressão literalmente significa “diante de Saul”, mas neste contexto funciona idiomaticamente como indicação do destinatário do relato.
- source_word: וַיִּקָּחֵהוּ
  choice: ele mandou buscar Davi
  rationale: 'Comunica o provável sentido causativo no contexto da corte: Saul fez com que Davi fosse levado à sua presença. A repetição do nome evita ambiguidade pronominal em português.'
