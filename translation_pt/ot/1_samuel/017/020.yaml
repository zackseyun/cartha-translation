  text: וַ/יַּשְׁכֵּ֨ם דָּוִ֜ד בַּ/בֹּ֗קֶר וַ/יִּטֹּ֤שׁ אֶת הַ/צֹּאן֙ עַל שֹׁמֵ֔ר וַ/יִּשָּׂ֣א וַ/יֵּ֔לֶךְ כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יִשָׁ֑י וַ/יָּבֹא֙ הַ/מַּעְגָּ֔לָ/ה וְ/הַ/חַ֗יִל הַ/יֹּצֵא֙ אֶל הַ/מַּ֣עֲרָכָ֔ה וְ/הֵרֵ֖עוּ בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: pt
  text: Davi levantou-se cedo pela manhã, deixou as ovelhas com um cuidador, pegou as provisões e partiu, conforme Jessé lhe havia ordenado. Chegou ao acampamento[a] quando o exército saía para a linha de batalha e dava o grito de guerra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à formação circular do acampamento” ou “à barreira de carroças”; o termo hebraico pode designar mais especificamente a disposição circular ou o perímetro defensivo do acampamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e gritaram na/para a batalha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: levantou-se bem cedo pela manhã
  rationale: Reproduz a ideia de levantar-se cedo e preserva a referência explícita à manhã em português natural.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: deixou as ovelhas com um responsável
  rationale: Expressa que Davi deixou o rebanho sob os cuidados de outra pessoa, sem sugerir necessariamente um segundo pastor permanente.
- source_word: וַיִּשָּׂא
  choice: pegou as provisões
  rationale: O objeto está elíptico no hebraico e é recuperado do versículo anterior; explicitá-lo evita obscuridade em português.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: conforme Jessé lhe havia ordenado
  rationale: Preserva tanto a conformidade da ação de Davi quanto a força de צוה, 'ordenar'.
- source_word: הַמַּעְגָּלָה
  choice: o acampamento
  rationale: É a designação contextual mais clara, enquanto a possível referência à formação circular ou ao perímetro defensivo é preservada em nota.
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: o exército saía para a linha de batalha
  rationale: A forma participial descreve a ação em curso quando Davi chegou; 'linha de batalha' comunica a disposição militar.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: soltando o grito de guerra
  rationale: Comunica o brado militar do verbo רוע neste contexto, sem reduzir a expressão a gritos genéricos.
