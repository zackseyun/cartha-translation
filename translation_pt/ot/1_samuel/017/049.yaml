base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: pt
  text: Então Davi pôs a mão na bolsa[a], tirou dali uma pedra, lançou-a com a funda e atingiu o filisteu na testa. A pedra se cravou na testa dele[b], e ele caiu com o rosto por terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no recipiente” ou “na sacola”. O termo hebraico é amplo e, neste contexto, refere-se ao recipiente em que Davi levava as pedras.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “A pedra afundou na testa dele” ou “ficou incrustada na testa dele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “ele caiu sobre sua face, para a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: meteu a mão na bolsa
  rationale: A expressão hebraica diz literalmente que Davi 'enviou/estendeu a mão para dentro do recipiente'. Em português corrente, 'meteu a mão na bolsa' comunica de modo natural o gesto de alcançar a pedra.
- source_word: הַכֶּלִי
  choice: a bolsa
  rationale: כְּלִי é um termo amplo para recipiente, objeto ou utensílio; neste contexto, designa o recipiente em que Davi guardava as pedras. 'Bolsa' é claro e adequado ao equipamento de pastor mencionado na narrativa.
- source_word: אֶבֶן
  choice: uma pedra
  rationale: '''Pedra'' é o equivalente normal e preciso para o projétil escolhido por Davi.'
- source_word: וַיְקַלַּע
  choice: lançou-a com a funda
  rationale: O verbo indica lançar mediante uma funda. A explicitação 'com a funda' evita a possível ambiguidade de 'atirou-a' e preserva a ação específica do hebraico.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: atingiu o filisteu na testa
  rationale: A preposição אֶל marca aqui o ponto de impacto. 'Atingiu ... na testa' é idiomático e fiel em português.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: A pedra se cravou na testa dele
  rationale: O verbo טבע descreve algo que afunda, fica enterrado ou se incrusta. 'Se cravou' transmite a penetração e fixação sem acrescentar pormenores anatômicos.
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: ele caiu com o rosto por terra
  rationale: A construção significa literalmente cair 'sobre o rosto, em direção à terra'. A formulação escolhida mantém a postura e o movimento em português digno e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A sequência rápida dos verbos narrativos hebraicos foi preservada. 'Filisteu' permanece em minúscula por designar o indivíduo pela sua origem étnica; 'com o rosto por terra' conserva a imagem hebraica sem soar excessivamente arcaico.
