source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: pt
  text: 'Então Davi disse ao filisteu: “Você vem contra mim com espada, lança e dardo, mas eu vou contra você em nome de Yahweh dos Exércitos[a], o Deus das fileiras de Israel[b], a quem você desafiou[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh das hostes”; tradicionalmente, “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o Deus dos exércitos de Israel” ou “o Deus das linhas de batalha de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo também pode ser traduzido por “afrontou”, “insultou” ou “provocou com desprezo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Davi disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַפְּלִשְׁתִּי
  choice: ao filisteu
  rationale: Identifica Golias por sua origem, sem acrescentar “guerreiro”, palavra não explícita no hebraico.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: vem contra mim / vou contra você
  rationale: A construção significa literalmente vir a/alguém, mas o contexto de confronto torna “contra” natural e claro em português; o paralelismo verbal é preservado.
- source_word: בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן
  choice: com espada, lança e dardo
  rationale: ב marca instrumento. “Lança” traduz חֲנִית, enquanto “dardo” distingue כִּידוֹן como arma de arremesso ou lança mais leve.
- source_word: בְּשֵׁם
  choice: em nome de
  rationale: Mantém o conhecido idioma bíblico de autoridade, representação e dependência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Comunica de modo transparente o sentido militar e soberano de צְבָאוֹת; a inicial maiúscula sinaliza que integra o título divino.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: o Deus das fileiras de Israel
  rationale: מַעַרְכוֹת designa forças dispostas, linhas de batalha ou fileiras; “fileiras” conserva essa imagem concreta sem reduzi-la ao termo mais genérico “exércitos”.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: a quem você desafiou
  rationale: Neste contexto, חרף exprime afronta e provocação desdenhosa contra o Deus de Israel; “desafiou” reproduz bem a força confrontadora.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva o nome no texto sem o substituir pelo título tradicional.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh das hostes
  rationale: “Dos Exércitos” é claro em português atual e conserva tanto a imagem militar quanto a afirmação da soberania divina.
- issue: Referente de אֲשֶׁר em אֲשֶׁר חֵרַפְתָּ
  choice: a quem você desafiou, referindo-se a Deus
  alternative: que você desafiou, entendido como as fileiras de Israel
  rationale: A sintaxe admite tensão por causa do antecedente imediato, mas o contexto próximo apresenta a afronta às tropas de Israel como afronta ao Deus delas. A formulação adotada segue essa força contextual sem apagar a alternativa em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “você” evita solenidade artificial; “vou contra você” é natural e mantém o paralelismo do confronto. As notas preservam as alternativas lexicais e a ambiguidade sintática genuína do final do versículo.
