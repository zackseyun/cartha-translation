  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: pt
  text: Por que, então, você não obedeceu à voz de Yahweh, mas se lançou sobre o despojo[a] e fez o que era mau aos olhos de Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «se precipitou sobre o saque» ou «caiu avidamente sobre o despojo»; o verbo hebraico sugere um movimento impetuoso e ávido em direção aos bens tomados na guerra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Por que, então
  rationale: A pergunta introduz a repreensão de Samuel; «então» expressa naturalmente a força contextual da conjunção וְ.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: obedeceu à voz
  rationale: Neste contexto de ordem divina, שׁמע בְּקוֹל significa obedecer, não apenas ouvir; a formulação também preserva a imagem concreta do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַתַּעַט אֶל
  choice: se lançou sobre
  rationale: O verbo sugere movimento impetuoso e ávido em direção ao despojo; a expressão é vívida e natural em português.
- source_word: הַשָּׁלָל
  choice: o despojo
  rationale: Termo corrente e digno para os bens tomados em guerra, adequado ao registro narrativo.
- source_word: וַתַּעַשׂ הָרַע
  choice: fez o que era mau
  rationale: Traduz naturalmente o idiomatismo e representa o artigo de הָרַע sem produzir uma construção rígida.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora avaliativa hebraica, transparente e compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama; «Yahweh» preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em «se lançou» é natural, e «despojo» mantém o contexto militar sem coloquialismo.
