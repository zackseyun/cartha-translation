- from: 'Então Samuel disse: “Tragam-me Agague, rei de Amaleque”. Agague aproximou-se dele trêmulo[a] e disse: “Certamente passou a amargura da morte”.'
  to: 'Então Samuel disse: “Tragam-me Agague, rei de Amaleque.” Agague aproximou-se dele com delicadeza[a] e disse: “Certamente a amargura da morte se afastou.”'
  rationale: A revisão substitui a interpretação não assinalada “trêmulo” por “com delicadeza”, uma reprodução portuguesa prudente da leitura lexical tradicional de מַעֲדַנֹּת, e conserva as principais alternativas na nota. Também explicita, em português natural, o movimento figurado de “a amargura da morte se afastou”.
