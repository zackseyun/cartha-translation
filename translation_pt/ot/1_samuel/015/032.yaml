base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: pt
  text: 'Então Samuel disse: “Tragam-me Agague, rei de Amaleque.” Agague aproximou-se dele com delicadeza[a] e disse: “Certamente a amargura da morte se afastou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com confiança”. O sentido do termo hebraico é incerto; outra interpretação possível é “acorrentado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ אֵלַי
  choice: Tragam-me
  rationale: O imperativo hifil plural ordena aos presentes que façam Agague aproximar-se de Samuel. “Tragam-me” é direto e natural em português.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agague, rei de Amaleque
  rationale: Emprega as formas portuguesas tradicionais dos nomes e mantém a identificação de Agague como rei de Amaleque.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: aproximou-se dele
  rationale: Embora הלך tenha o sentido básico de “ir”, a expressão indica aqui o movimento de Agague até Samuel; “aproximou-se dele” preserva esse movimento com naturalidade.
- source_word: מַעֲדַנֹּת
  choice: trêmulo
  rationale: O termo hebraico é raro e de sentido incerto. “Trêmulo” reflete uma antiga interpretação que entende Agague como temeroso, mas a incerteza e as principais alternativas são mantidas em nota.
- source_word: אָכֵן
  choice: Certamente
  rationale: Expressa a convicção ou conclusão enfática de Agague.
- source_word: סָר מַר הַמָּוֶת
  choice: passou a amargura da morte
  rationale: 'Mantém a imagem do texto massorético: aquilo que é amargo na morte afastou-se ou passou. A formulação portuguesa é concisa e conserva a possível referência ao perigo de morrer.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais de ampla legibilidade brasileira. A fala de Agague foi mantida próxima da metáfora hebraica, sem explicar se ele acreditava que o perigo já havia passado. A nota preserva a incerteza lexical de מַעֲדַנֹּת.
