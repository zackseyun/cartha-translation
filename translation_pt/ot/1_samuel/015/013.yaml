  text: וַ/יָּבֹ֥א שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יֹּ֧אמֶר ל֣/וֹ שָׁא֗וּל בָּר֤וּךְ אַתָּה֙ לַֽ/יהוָ֔ה הֲקִימֹ֖תִי אֶת דְּבַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: pt
  text: 'Então Samuel foi até Saul, e Saul lhe disse: “Bendito seja você por Yahweh![a] Cumpri[b] a palavra de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Bendito é você para Yahweh”. A preposição hebraica pode indicar Yahweh como fonte da bênção ou uma relação de pertencimento/referência.'
    reason: lexical_alternative
  - marker: b
    text: 'Também: “executei” ou “levei a efeito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שְׁמוּאֵל אֶל שָׁאוּל
  choice: Então Samuel foi até Saul
  rationale: O verbo בוא descreve aqui o deslocamento de Samuel para junto de Saul. “Foi até” soa natural na narrativa em português e evita a dependência do ponto de vista espacial implícita em “veio”.
- source_word: וַיֹּאמֶר לוֹ שָׁאוּל
  choice: e Saul lhe disse
  rationale: Mantém explicitamente o objeto indireto לוֹ e emprega uma construção corrente e digna em português.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: Que Yahweh abençoe você!
  rationale: Expressa de modo natural em português a fórmula hebraica de bênção, na qual Yahweh é a fonte da bênção. Uma nota preserva a forma mais literal e a possível nuance da preposição לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֲקִימֹתִי
  choice: Cumpri
  rationale: O hifil de קום, tendo “a palavra de Yahweh” como objeto, significa fazer essa palavra vigorar ou levá-la a efeito. “Cumpri” é conciso, natural e adequado à alegação de obediência feita por Saul.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva o substantivo amplo דָּבָר e sua expressão tradicional, sem restringi-lo desnecessariamente a “ordem”, embora o contexto envolva uma ordem divina.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo pelo título “SENHOR”.
- issue: Sentido da fórmula בָּרוּךְ אַתָּה לַיהוָה
  choice: Que Yahweh abençoe você!
  alternative: Bendito seja você por Yahweh; bendito é você para Yahweh
  rationale: A tradução principal comunica naturalmente uma saudação de bênção sem impor uma leitura doutrinária. A nota registra a forma mais próxima da estrutura hebraica e a ambiguidade da preposição.
- issue: Alegação de Saul sobre sua obediência
  choice: Cumpri a palavra de Yahweh
  alternative: Executei; levei a efeito a palavra de Yahweh
  rationale: A frase é apresentada como declaração do próprio Saul, sem validá-la nem corrigi-la à luz do contexto posterior.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Você” torna a fala direta natural sem perder dignidade; a pontuação apresenta a bênção como saudação enfática e a afirmação seguinte como a alegação segura de Saul.
