  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: pt
  text: 'Então Samuel lhe disse: “Hoje Yahweh rasgou de você o reino de Israel e o deu ao seu próximo[a], que é melhor do que você[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao seu companheiro” ou “a um associado seu”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “melhor do que você”, referindo-se à pessoa a quem o reino é dado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Então Samuel lhe disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa com naturalidade a progressão do relato sem acrescentar uma relação causal.
- source_word: קָרַע
  choice: arrancou ... de
  rationale: O verbo significa literalmente “rasgar” e retoma o rasgo do manto no versículo anterior. Em português, “arrancou de você” conserva a imagem vigorosa e comunica claramente a retirada do reino, embora a correspondência com o ato de rasgar fique menos explícita do que em “rasgou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: o reino de Israel
  rationale: מַמְלְכוּת pode indicar reino ou realeza. “O reino de Israel” é claro e idiomático no contexto da autoridade real retirada de Saul e entregue a outro.
- source_word: מֵעָלֶיךָ
  choice: de você
  rationale: A expressão marca a remoção daquilo que estava sob a posse ou autoridade de Saul; a construção com “arrancou” comunica a separação de modo natural.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: Equivalente moderno e direto que preserva a imediatez do juízo pronunciado.
- source_word: וּנְתָנָהּ
  choice: e o deu
  rationale: O perfeito hebraico apresenta a transferência como decisão divina consumada e irrevogável, ainda que sua realização histórica plena venha depois.
- source_word: לְרֵעֲךָ
  choice: ao seu próximo
  rationale: רֵעַ pode designar próximo, companheiro ou semelhante. “Seu próximo” mantém a amplitude relacional do hebraico sem pressupor amizade íntima.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: que é melhor do que você
  rationale: O adjetivo com מִן forma uma comparação direta. A oração relativa deixa claro em português que a expressão descreve a pessoa a quem o reino é dado, sem converter “melhor” em uma noção interpretativa mais específica, como “mais digno”.
theological_decisions:
- issue: Apresentar o juízo divino como consumado ou futuro
  choice: 'Consumado/decretivo: “arrancou ... deu”'
  alternative: 'Orientado ao futuro: “arrancará ... dará”'
  rationale: Os perfeitos hebraicos, neste pronunciamento profético de juízo, apresentam a perda e a transferência do reino como atos divinos decididos e efetivamente consumados, embora seu desdobramento histórico ainda prossiga. O pretérito preserva a força irrevogável da sentença.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para iniciar com “Hoje”, realçando a imediatez sem alterar o sentido. O paralelismo verbal no pretérito preserva o caráter decretivo da declaração.
