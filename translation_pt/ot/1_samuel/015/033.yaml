base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: pt
  text: 'Samuel disse: “Assim como a sua espada deixou mulheres sem filhos, também a sua mãe ficará sem filhos entre as mulheres.”[a] Então Samuel cortou Agague em pedaços[b] diante de Yahweh, em Gilgal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim como a sua espada privou mulheres de seus filhos, também a sua mãe será privada de seus filhos entre as mulheres”. O hebraico emprega o mesmo verbo nas duas partes, ressaltando a retribuição na mesma medida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “despedaçou Agague”; tradicionalmente, “esquartejou Agague”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל (שׁכל)
  choice: deixou mulheres sem filhos / ficará sem filho
  rationale: O verbo descreve a perda de filhos e aparece nas duas orações. A formulação preserva em português a correspondência verbal que ressalta a retribuição na mesma medida.
- source_word: חַרְבֶּךָ
  choice: a sua espada
  rationale: Tradução direta; a espada representa naturalmente os atos violentos praticados por Agague.
- source_word: מִנָּשִׁים
  choice: entre as mulheres
  rationale: Nesta construção, מן tem sentido comparativo ou partitivo, expresso de modo natural por “entre”.
- source_word: וַיְשַׁסֵּף
  choice: despedaçou
  rationale: O verbo raro e forte indica cortar ou esquartejar. “Despedaçou” conserva a violência explícita sem acrescentar detalhes que não estejam no hebraico.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa de forma direta que o ato ocorreu na presença de Yahweh, com possível dimensão judicial ou cultual deixada sem explicação adicional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, em conformidade com a prática do projeto.
- source_word: בַּגִּלְגָּל
  choice: em Gilgal
  rationale: Forma idiomática em português para indicar o local onde ocorreu o ato.
theological_decisions:
- issue: Descrição da execução violenta de Agague
  choice: Samuel despedaçou pessoalmente Agague
  alternative: Samuel cortou Agague em pedaços; Samuel matou Agague
  rationale: O hebraico atribui diretamente a ação a Samuel e emprega um verbo intenso. A tradução não suaviza a violência como faria “matou”, nem acrescenta uma justificativa teológica ausente do versículo.
- issue: Retribuição expressa pelo verbo שׁכל
  choice: Repetir a ideia de ficar sem filhos nas duas orações
  alternative: Usar verbos diferentes, como “privou” e “ficará enlutada”
  rationale: A repetição lexical no hebraico vincula os atos de Agague ao destino de sua mãe e comunica retribuição proporcional sem precisar explicitá-la interpretativamente.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama, e a transliteração preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “sua” em vez de “tua”, mantém a repetição semântica central do hebraico e conserva a força do verbo final sem linguagem arcaica nem suavização.
