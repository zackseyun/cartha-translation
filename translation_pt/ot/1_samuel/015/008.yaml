  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: pt
  text: E capturou Agague, rei de Amaleque, vivo, e consagrou todo o povo à destruição, ao fio da espada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destruiu completamente todo o povo”. O verbo hebraico se refere a consagrar algo à destruição sob o anátema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: Capturou
  rationale: O verbo indica agarrar ou tomar alguém; no contexto militar, “capturou” é preciso e natural.
- source_word: אֲגַג
  choice: Agague
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: rei de Amaleque
  rationale: Reproduz diretamente a relação construta hebraica em português natural.
- source_word: חָי
  choice: vivo
  rationale: Adjetivo predicativo que contrasta a captura de Agague com a morte do restante do povo.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Preserva a amplitude de עָם sem restringi-lo indevidamente a soldados ou à população civil.
- source_word: הֶחֱרִים
  choice: consagrou à destruição
  rationale: Expressa o sentido causativo de colocar sob ḥerem, isto é, destinar irrevogavelmente à destruição, preservando o peso religioso e militar do termo.
- source_word: לְפִי חָרֶב
  choice: passando-o ao fio da espada
  rationale: Equivalente idiomático português da expressão hebraica literalmente ligada à “boca da espada”; mantém a imagem e explicita naturalmente a execução do povo.
theological_decisions:
- issue: Linguagem de guerra associada a חרם
  choice: consagrou à destruição todo o povo
  alternative: destruiu completamente todo o povo; colocou todo o povo sob anátema
  rationale: A formulação escolhida preserva a dimensão de destinação religiosa para destruição, sem reduzir o verbo à simples ação militar nem empregar o tecnicismo menos transparente “anátema”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Mas” torna explícito o contraste marcado pela coordenação hebraica entre Agague, preservado vivo, e o povo, destinado à destruição. O pronome em “passando-o” retoma “todo o povo” e evita ambiguidade.
