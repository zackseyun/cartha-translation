base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: pt
  text: 'Então Samuel disse a Saul: “Pare! Vou lhe contar o que Yahweh me disse na noite passada.” E ele lhe disse[a]: “Fale.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A forma escrita em hebraico diz “e eles lhe disseram”; o contexto indica que quem responde é Saul, por isso o sentido é singular: “e ele lhe disse”.'
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: Pare!
  rationale: O imperativo de רפה é uma ordem incisiva para Saul cessar de falar. “Pare!” é natural, direto e conserva o tom de repreensão.
- source_word: וְאַגִּידָה לְּךָ
  choice: Vou lhe contar
  rationale: O hifil de נגד significa “contar, declarar”. Após o imperativo, esta formulação comunica naturalmente a intenção imediata de Samuel.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: o que ... disse
  rationale: A construção introduz o conteúdo da fala divina; “o que ... disse” é idiomático e fiel ao sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הַלָּיְלָה
  choice: na noite passada
  rationale: Com o verbo perfeito precedente, refere-se à noite imediatamente anterior no contexto narrativo.
- source_word: ויאמרו לוֹ
  choice: E ele lhe disse
  rationale: Embora a forma escrita seja plural, o contexto identifica Saul como o único interlocutor que responde; traduz-se o sentido singular e registra-se a forma escrita em nota.
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo simples é breve e direto, como no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Preserva o nome pessoal representado pelo Tetragrama sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem abrupta “Pare!” conserva a força da repreensão, e “Fale” mantém a concisão da resposta.
