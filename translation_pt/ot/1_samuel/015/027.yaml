  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: pt
  text: Quando Samuel se virou para partir, Saul agarrou a ponta do manto de Samuel[a], e ela se rasgou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a extremidade do manto de Samuel” ou “a bainha do manto de Samuel”. A palavra hebraica pode designar a parte extrema de uma roupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: se virou
  rationale: O verbo סבב indica aqui que Samuel se voltou em preparação para sair; “se virou” é direto e natural.
- source_word: לָלֶכֶת
  choice: para partir
  rationale: O infinitivo de הלך expressa a intenção de ir embora. “Partir” comunica com clareza o sentido de saída neste contexto.
- source_word: וַיַּחֲזֵק
  choice: agarrou
  rationale: No Hifil, חזק pode significar segurar ou agarrar com firmeza; “agarrou” transmite a ação súbita e vigorosa.
- source_word: בִּכְנַף
  choice: a ponta
  rationale: כָּנָף, literalmente “asa”, designa por extensão uma extremidade da roupa. “Ponta” preserva essa amplitude sem especificar indevidamente uma bainha.
- source_word: מְעִילוֹ
  choice: do manto dele
  rationale: מְעִיל é uma veste externa. “Manto” é corrente e digno; “dele” mantém explícita a referência masculina sem recorrer ao potencialmente ambíguo “seu”.
- source_word: וַיִּקָּרַע
  choice: ela se rasgou
  rationale: A forma Nifal é passiva ou intransitiva. “Ela se rasgou” é idiomático em português e retoma “a ponta”, sem especificar além do hebraico como ocorreu o rasgo.
theological_decisions:
- issue: Identidade do sujeito de וַיַּחֲזֵק
  choice: Saul agarrou
  alternative: ele agarrou
  rationale: O verbo hebraico não repete o nome do sujeito, mas o contexto narrativo identifica Saul como quem agarra o manto de Samuel. Repor o nome evita que o leitor em português atribua naturalmente a ação a Samuel, sujeito da oração anterior, sem introduzir uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e narrativo, com leitura natural no Brasil e compreensão internacional. A formulação evita arcaísmos e conserva a sequência rápida das ações do hebraico.
