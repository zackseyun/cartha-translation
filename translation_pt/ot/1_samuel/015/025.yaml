  text: וְ/עַתָּ֕ה שָׂ֥א נָ֖א אֶת חַטָּאתִ֑/י וְ/שׁ֣וּב עִמִּ֔/י וְ/אֶֽשְׁתַּחֲוֶ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: pt
  text: Agora, por favor, perdoa o meu pecado[a] e volta comigo, para que eu me prostre diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “levanta/carrega o meu pecado”, expressão idiomática que significa “perdoa o meu pecado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz o apelo imediato de Saul; em português atual, “Agora” transmite naturalmente a transição, sem exigir a reprodução do waw inicial.
- source_word: שָׂא נָא
  choice: por favor, perdoa
  rationale: נָשָׂא significa literalmente levantar, carregar ou levar, mas, com חַטָּאת, forma aqui uma expressão idiomática de perdão. “Por favor” preserva a súplica marcada por נָא.
- source_word: אֶת חַטָּאתִי
  choice: o meu pecado
  rationale: חַטָּאת designa aqui o pecado confessado por Saul, não uma oferta pelo pecado; “pecado” mantém a força moral e teológica do termo.
- source_word: וְשׁוּב עִמִּי
  choice: e volta comigo
  rationale: שׁוּב expressa voltar ou retornar. No contexto, Saul pede que Samuel volte em sua companhia; “volta comigo” é fiel e natural.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: para que eu me prostre
  rationale: A forma verbal indica inclinar-se profundamente ou prostrar-se. A construção de finalidade “para que” representa bem a relação com o imperativo precedente, preservando o ato físico associado à adoração.
- source_word: לַיהוָה
  choice: diante de Yahweh
  rationale: O nome divino é transliterado como “Yahweh”. Com o verbo de prostração, “diante de” comunica em português natural a direção e o destinatário do gesto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de וְאֶשְׁתַּחֲוֶה
  choice: me prostre
  alternative: adore
  rationale: “Prostrar-se” preserva a imagem corporal explícita do verbo, enquanto “adorar” expressa uma implicação contextual mais ampla e pode ocultar essa concretude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “perdoa” e “volta” trata Samuel na segunda pessoa do singular, conforme o discurso direto hebraico. Mantém-se “Yahweh” como nome próprio e “me prostre” para conservar a concretude do gesto.
