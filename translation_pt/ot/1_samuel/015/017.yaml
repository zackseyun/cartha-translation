source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: pt
  text: 'E Samuel disse[a]: “Embora você fosse pequeno aos seus próprios olhos, não era você a cabeça das tribos de Israel? E Yahweh ungiu você como rei sobre Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mesmo que você fosse pequeno aos seus próprios olhos”. O hebraico admite uma nuance ligeiramente diferente, mas o sentido é que Saul se considerava insignificante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: não era você
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; em português, esta formulação comunica naturalmente essa força no contexto passado.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: Embora você fosse pequeno aos seus próprios olhos
  rationale: Expressa a provável nuance concessiva e preserva a imagem hebraica da baixa avaliação que Saul fazia de si mesmo, sem reduzi-la apenas a humildade ou posição social.
- source_word: קָטֹן
  choice: pequeno
  rationale: Mantém a metáfora direta do hebraico e evita interpretar em excesso como exclusivamente 'insignificante'.
- source_word: בְּעֵינֶיךָ
  choice: aos seus próprios olhos
  rationale: Reproduz de modo claro e idiomático a ideia de avaliação pessoal contida na expressão hebraica.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: o chefe das tribos de Israel
  rationale: ‘Chefe’ preserva o sentido metafórico de רֹאשׁ como autoridade principal e soa natural em português.
- source_word: וַיִּמְשָׁחֲךָ
  choice: ungiu você
  rationale: Preserva o ato específico de ungir, com sua importância régia e teológica, em vez de nivelá-lo para ‘nomeou’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: Expressa de maneira concisa e natural a condição régia resultante da unção.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; ‘Yahweh’ preserva o nome pessoal e evita substituí-lo por um título.
- issue: Relação lógica de אִם קָטֹן אַתָּה בְּעֵינֶיךָ com a pergunta principal
  choice: Embora você fosse pequeno aos seus próprios olhos
  alternative: Mesmo que você fosse pequeno aos seus próprios olhos
  rationale: A leitura concessiva se ajusta ao contraste entre a antiga autoavaliação de Saul e sua posição como chefe de Israel, mas a construção hebraica admite uma nuance ligeiramente diferente, registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação ‘ungiu você’ evita uma mesóclise ou ênclise excessivamente formal; ‘aos seus próprios olhos’ preserva o idioma hebraico de maneira compreensível.
