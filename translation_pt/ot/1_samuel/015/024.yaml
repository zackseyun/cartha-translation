  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל שְׁמוּאֵל֙ חָטָ֔אתִי כִּֽי עָבַ֥רְתִּי אֶת פִּֽי יְהוָ֖ה וְ/אֶת דְּבָרֶ֑י/ךָ כִּ֤י יָרֵ֨אתִי֙ אֶת הָ/עָ֔ם וָ/אֶשְׁמַ֖ע בְּ/קוֹלָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: pt
  text: 'Então Saul disse a Samuel: “Pequei, pois transgredi a ordem de Yahweh[a] e as suas palavras, porque tive medo do povo e dei ouvidos à voz deles[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a boca de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e obedeci a eles”; hebraico, literalmente, “e ouvi a voz deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Pequei
  rationale: O perfeito hebraico expressa aqui a confissão direta de uma falta já cometida; o pretérito perfeito é a forma natural e precisa em português.
- source_word: עָבַרְתִּי
  choice: transgredi
  rationale: O verbo significa literalmente passar além ou ultrapassar; no contexto de violação de uma ordem divina, “transgredi” conserva sua força moral e jurídica.
- source_word: פִּי יְהוָה
  choice: a ordem de Yahweh
  rationale: A expressão significa literalmente “a boca de Yahweh”, mas funciona como referência ao que Yahweh ordenou. “A ordem” comunica claramente o sentido idiomático neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דְּבָרֶיךָ
  choice: as suas palavras
  rationale: Mantém o plural hebraico e se refere às instruções pronunciadas por Samuel.
- source_word: יָרֵאתִי אֶת הָעָם
  choice: tive medo do povo
  rationale: Expressa de modo natural em português o temor que Saul apresenta como motivo de sua conduta, sem restringir “povo” a tropas ou exército.
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: e dei ouvidos à voz deles
  rationale: Preserva tanto a ideia de acatar quanto a imagem hebraica da “voz”, importante no contraste contextual entre ouvir Yahweh e ouvir o povo.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o conserva de modo transparente, sem substituí-lo por um título.
- issue: Sentido de פִּי יְהוָה
  choice: a ordem de Yahweh
  alternative: a boca de Yahweh; a palavra de Yahweh
  rationale: A tradução idiomática esclarece que Saul violou uma instrução divina específica, enquanto a nota registra a forma concreta do hebraico.
- issue: Força de וָאֶשְׁמַע בְּקוֹלָם
  choice: dei ouvidos à voz deles
  alternative: obedeci a eles; ouvi a voz deles
  rationale: A formulação mantém a tensão entre ouvir e obedecer sem reduzir completamente a expressão a uma interpretação única.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Transgredi” preserva o tom moral solene; “tive medo” e “dei ouvidos” mantêm naturalidade. Os marcadores [a] e [b] foram posicionados junto às expressões que explicam.
