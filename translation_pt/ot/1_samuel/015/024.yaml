  source_fidelity: 'O texto reproduz com precisão a confissão de Saul: חָטָאתִי é bem vertido por “Pequei”; עָבַרְתִּי por “transgredi”; פִּי יהוה é adequadamente expresso de modo idiomático como “a ordem de Yahweh”, com nota para a formulação literal; e וָאֶשְׁמַע בְּקוֹלָם conserva a imagem hebraica de ouvir a voz do povo. As duas ocorrências de כִּי podem introduzir a explicação; “pois” e “porque” são escolhas portuguesas naturais e fiéis.'
