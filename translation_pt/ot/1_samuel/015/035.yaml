  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: pt
  text: Samuel não tornou a ver Saul até o dia de sua própria morte, pois ficou de luto por Saul. E Yahweh lamentou[a] ter feito Saul rei sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrependeu-se” ou “teve pesar”. O verbo hebraico pode ter diferentes sentidos conforme o contexto; aqui expressa o pesar de Yahweh por ter feito Saul rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: não tornou a ver
  rationale: A construção יָסַף + infinitivo sob negação indica que a ação não voltou a ocorrer. “Não tornou a ver” expressa o idioma de modo natural e digno em português.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: ver Saul
  rationale: Mantém o sentido comum de ראה, embora o contexto implique que não houve outro encontro pessoal.
- source_word: עַד יוֹם מוֹתוֹ
  choice: até o dia da morte dele
  rationale: Preserva a construção solene do hebraico e evita atribuir equivocadamente a morte a Samuel; “dele” retoma Saul no contexto imediato.
- source_word: הִתְאַבֵּל
  choice: pranteava
  rationale: O Hitpael de אבל denota luto ou profunda lamentação. “Pranteava” distingue a dor contínua de Samuel do verbo aplicado a Yahweh na frase seguinte.
- source_word: אֶל שָׁאוּל
  choice: por Saul
  rationale: Embora אֶל tenha sentido básico direcional, com verbo de luto o português idiomático pede “por”, indicando que Saul era o objeto da lamentação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: נִחָם
  choice: lamentou
  rationale: Neste contexto, o verbo expressa pesar pelo fato de Saul ter sido constituído rei. “Lamentou” comunica esse pesar sem eliminar a tensão do texto nem sugerir necessariamente confissão de falta moral.
- source_word: הִמְלִיךְ
  choice: ter feito ... rei
  rationale: O Hifil de מלך significa fazer alguém rei; a construção infinitiva é natural após “lamentou” em português.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Expressa de modo direto a autoridade régia indicada por עַל.
theological_decisions:
- issue: Linguagem afetiva aplicada a Deus em נִחָם
  choice: lamentou
  alternative: arrependeu-se; voltou atrás
  rationale: A tradução mantém a afirmação de pesar divino e sua tensão teológica, sem reduzi-la a mera mudança administrativa. Ao mesmo tempo, “lamentou” evita impor a ideia de arrependimento por culpa moral, que o verbo hebraico não exige neste contexto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Não tornou a ver” preserva o valor idiomático da construção hebraica; “pranteava” mantém o tom de luto. O marcador da nota foi colocado junto a “lamentou”, termo ao qual a nota lexical se refere.
