base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: pt
  text: Saul e o povo, porém, pouparam Agague, o melhor das ovelhas e do gado, os animais de segunda cria[a], os carneiros e tudo o que era bom; não quiseram consagrá-los à destruição[b]. Mas tudo o que era desprezado e sem valor eles consagraram à destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é difícil e sua interpretação é incerta. Também pode ser entendido como “animais engordados”.
    reason: lexical_alternative
  - marker: b
    text: “Consagrar à destruição” traduz um termo técnico hebraico que indica colocar pessoas ou coisas sob interdição, destinando-as à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: pouparam
  rationale: No contexto, o verbo descreve a decisão prática de não executar a destruição ordenada; “pouparam” comunica esse resultado sem excluir a ideia de compaixão indevida.
- source_word: עַל אֲגָג
  choice: Agague
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio hebraico.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: o melhor das ovelhas e do gado
  rationale: Preserva o valor superlativo de מֵיטַב e distingue naturalmente os rebanhos ovinos dos bovinos.
- source_word: הַמִּשְׁנִים
  choice: os animais de segunda cria
  rationale: O termo hebraico é raro e incerto, mas está ligado lexicalmente à ideia de “segundo” ou “duplo”. A tradução mantém essa ligação sem especificar, sem base segura, que se tratava de bezerros ou de animais engordados; a incerteza é registrada em nota.
- source_word: הַכָּרִים
  choice: os carneiros
  rationale: O substantivo normalmente designa carneiros ou ovinos machos; “carneiros” é preciso e natural no inventário de animais.
- source_word: כָּל הַטּוֹב
  choice: tudo o que era bom
  rationale: Amplia a referência para além dos animais já enumerados e conserva o juízo qualitativo do hebraico.
- source_word: לֹא אָבוּ
  choice: não quiseram
  rationale: Expressa a falta deliberada de disposição, e não incapacidade.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: consagrá-los à destruição / consagraram à destruição
  rationale: 'Reproduz a força técnica de חרם: colocar algo sob interdição, destinando-o irrevogavelmente à destruição, sem reduzir o sentido ao simples ato de matar.'
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: tudo o que era desprezado e sem valor
  rationale: Neste contexto, מְלָאכָה se refere coletivamente aos bens ou despojos. Os adjetivos indicam aquilo que era tido em desprezo e considerado imprestável ou de pouco valor.
theological_decisions:
- issue: Tradução de חרם no contexto da guerra
  choice: consagrar à destruição
  alternative: destruir completamente; colocar sob interdição
  rationale: A formulação conserva tanto a destinação religiosa/judicial quanto a consequência destrutiva do termo, sem suavizar a gravidade nem inserir terminologia denominacional.
translation_notes:
  register: Português atual, digno e de leitura natural, com vocabulário acessível no Brasil e inteligível internacionalmente. A ordem das listas e o contraste entre o que foi poupado e o que foi destruído foram preservados; a ambiguidade de הַמִּשְׁנִים foi mantida e explicitada em nota.
