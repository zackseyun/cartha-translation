  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: pt
  text: “Lamento ter feito Saul rei[a], pois ele deixou de me seguir[b] e não cumpriu as minhas palavras[c].” Samuel ficou ardendo de ira[d] e clamou a Yahweh durante toda a noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estou pesaroso por ter feito Saul rei”. O hebraico expressa pesar ou arrependimento diante do reinado de Saul.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “voltou de após mim”, expressão que significa afastar-se de seguir Yahweh.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não realizou as minhas palavras” ou “não obedeceu às minhas palavras”.'
    reason: lexical_alternative
  - marker: d
    text: 'Expressão idiomática hebraica: “Samuel ardeu de ira”. Neste contexto, alguns entendem também a ideia de profundo desgosto ou tristeza.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: Lamento
  rationale: O nifal de נחם expressa aqui pesar ou arrependimento diante do resultado do reinado de Saul. “Lamento” comunica pesar genuíno sem sugerir falha moral da parte de Deus.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: ter feito Saul rei
  rationale: O hifil de מלך com לְמֶלֶךְ indica fazer ou constituir alguém rei. A formulação é natural e preserva a relação causal do hebraico.
- source_word: שָׁב מֵאַחֲרַי
  choice: ele deixou de me seguir
  rationale: A expressão idiomática significa voltar atrás ou afastar-se do seguimento de alguém. Esta formulação natural preserva a ideia de abandono da lealdade a Yahweh.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: e não cumpriu as minhas palavras
  rationale: הקים, tendo “palavras” como objeto, significa fazê-las valer mediante sua realização. “Cumpriu” conserva esse sentido concreto melhor que uma simples explicitação como “obedeceu”.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: Samuel ficou ardendo de ira
  rationale: A expressão com חרה comunica ira acesa. A tradução retém a imagem vívida do hebraico, enquanto a possível nuance contextual de profundo desgosto fica registrada em nota.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: clamou a Yahweh
  rationale: זעק denota um clamor intenso, frequentemente motivado por aflição ou urgência. “Clamou” é corrente, digno e conciso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração conserva no texto o nome pessoal divino em vez de substituí-lo por um título.
- source_word: כָּל־הַלַּיְלָה
  choice: durante toda a noite
  rationale: Expressa naturalmente a duração completa indicada pelo hebraico.
theological_decisions:
- issue: O pesar divino expresso por נִחַמְתִּי
  choice: Lamento
  alternative: Estou pesaroso; arrependo-me; voltei atrás
  rationale: A escolha preserva a força real do pesar divino e a tensão narrativa sem atribuir pecado ou erro moral a Deus nem explicar a tensão dentro do próprio texto.
- issue: A reação emocional de Samuel em וַיִּחַר לִשְׁמוּאֵל
  choice: Samuel ficou ardendo de ira
  alternative: Samuel ficou profundamente desgostoso; Samuel se entristeceu
  rationale: O valor lexical do idioma aponta para ira, embora o contexto possa envolver tristeza ou profundo desgosto. A tradução mantém a força lexical e registra a nuance alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase segue o movimento do hebraico sem produzir construção artificial; o nome Yahweh é preservado, e as ambiguidades relevantes são apresentadas em notas.
