base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: pt
  text: 'E Yahweh enviou você numa missão e disse: “Vá e consagre os pecadores — os amalequitas[b] — à destruição[a] e lute contra eles até que sejam exterminados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destrua completamente”. O verbo hebraico se refere a colocar algo sob interdição, destinando-o à destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os pecadores, Amaleque”; “Amaleque” identifica, por aposição, quem são “os pecadores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  choice: enviou você
  rationale: Traduz diretamente o verbo שלח e preserva a comissão dirigida pessoalmente a Saul.
- source_word: בְּדָרֶךְ
  choice: numa missão
  rationale: Embora דֶּרֶךְ signifique literalmente “caminho”, após “enviar” a expressão indica o encargo ou percurso comissionado, não apenas uma viagem.
- source_word: לֵךְ
  choice: Vá
  rationale: Equivalente direto e natural do imperativo de הלך.
- source_word: וְהַחֲרַמְתָּה
  choice: consagre ... à destruição
  rationale: O Hifil de חרם designa colocar alguém ou algo sob a interdição para destruição; esta formulação conserva o caráter técnico e religioso do termo.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: os pecadores — os amalequitas
  rationale: Mantém o qualificativo moral substantivado e apresenta os amalequitas como sua identificação apositiva, de modo claro em português.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: lute contra eles
  rationale: O sufixo hebraico é singular por se referir coletivamente a Amaleque; o plural é mais natural em português quando se fala do povo.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: até que sejam exterminados
  rationale: Expressa o resultado total indicado por כלה sem acrescentar explicitamente um sujeito agente onde a construção hebraica é compacta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido técnico de חרם
  choice: consagre ... à destruição
  alternative: destrua completamente
  rationale: A opção principal preserva tanto a ideia de consagração/interdição quanto seu resultado destrutivo, sem reduzir o verbo a uma descrição meramente militar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Missão” comunica naturalmente o valor idiomático de בְּדָרֶךְ; os travessões tornam explícita a aposição sem suavizar o juízo moral do hebraico.
