  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: pt
  text: Então Samuel voltou, seguindo Saul, e Saul se prostrou perante o SENHOR.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adorou o SENHOR”. O verbo hebraico pode indicar tanto o ato de prostrar-se como o de adorar, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב indica aqui o retorno de Samuel, em sequência narrativa, retomando a situação do versículo 26.
- source_word: אַחֲרֵי
  choice: seguindo
  rationale: A preposição significa literalmente “atrás de/depois de”. Neste contexto, indica que Samuel voltou na companhia de Saul, indo atrás dele; “seguindo” preserva essa relação sem tornar a frase pouco natural em português.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prostrou
  rationale: O verbo שׁחה descreve o ato corporal de curvar-se ou prostrar-se e, conforme o contexto, pode expressar adoração. “Se prostrou” mantém em primeiro plano o gesto concreto sem eliminar sua dimensão cultual.
- source_word: לַיהוָה
  choice: diante do SENHOR
  rationale: A preposição לְ marca aquele a quem se dirige a prostração. “Diante do” é uma formulação portuguesa natural para o gesto reverente, e o nome divino יהוה é representado pela convenção “SENHOR”.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Se וַיִּשְׁתַּחוּ deve ser explicitado como adoração ou traduzido como o gesto corporal de prostração
  choice: se prostrou diante do SENHOR
  alternative: adorou o SENHOR
  rationale: Embora a menção explícita do SENHOR dê ao ato sentido religioso, o verbo hebraico destaca concretamente o curvar-se ou prostrar-se. A tradução principal conserva essa imagem e a nota registra a interpretação cultual natural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “voltou seguindo Saul” conserva a direção expressa por אַחֲרֵי sem acrescentar uma interpretação teológica. “Se prostrou” mantém a concretude do hebraico, enquanto a nota preserva a alternativa “adorou”.
