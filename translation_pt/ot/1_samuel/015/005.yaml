  text: Saul chegou à cidade de Amaleque e ficou de tocaia no uádi[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «armou uma emboscada no uádi». O verbo hebraico é difícil e também pode ser entendido como «contendeu» ou «lutou», mas o contexto favorece uma ação de emboscada.'
    reason: lexical_alternative
  - marker: b
    text: «Uádi» é o leito ou ravina de um curso de água que pode ficar seco fora da estação chuvosa.
    reason: cultural_note
  - marker: c
    text: 'Ou: «a cidade dos amalequitas».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: בוא pode significar vir, ir, entrar ou chegar conforme o ponto de vista. Aqui, «chegou» expressa naturalmente o movimento até o objetivo.
- source_word: עַד
  choice: à
  rationale: Com verbo de movimento e um destino, עַד indica chegada até determinado lugar; em português, «chegou à» é a formulação mais natural.
- source_word: עִיר עֲמָלֵק
  choice: a cidade de Amaleque
  rationale: A construção hebraica é traduzida diretamente, sem decidir no texto principal se Amaleque designa o epônimo ou o povo.
- source_word: וַיָּרֶב
  choice: armou uma emboscada
  rationale: A forma hebraica é difícil e, tomada isoladamente, pode ser relacionada a contender; o contexto militar e versões antigas favorecem a ideia de posicionar-se para uma emboscada.
- source_word: בַּנָּחַל
  choice: no leito do riacho
  rationale: נחל designa um curso de água, muitas vezes sazonal, bem como seu leito ou ravina. «Leito do riacho» é claro em português e evita sugerir necessariamente água corrente.
