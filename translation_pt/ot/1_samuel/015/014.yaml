    rationale: «Bois» normalmente designa machos adultos, muitas vezes castrados ou usados para tração, enquanto בָּקָר é um coletivo mais amplo para gado bovino. «Gado» mantém a extensão do termo-fonte.
  - severity: low
    issue: Acréscimo de «este» antes do segundo «som»
    rationale: O demonstrativo הַזֶּה modifica apenas o primeiro «som» no hebraico. Sua repetição em português não é necessária e ligeiramente reforça o segundo membro além do texto-fonte.
