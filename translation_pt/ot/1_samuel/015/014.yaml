base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: pt
  text: 'Mas Samuel disse: “Então, que é este som de ovelhas que chega aos meus ouvidos e o som de gado que estou ouvindo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Samuel disse
  rationale: 'O waw consecutivo dá continuidade à narrativa, enquanto “mas” expressa naturalmente o contraste contextual: Samuel contesta a alegação anterior de Saul.'
- source_word: וּמֶה
  choice: Então, que é
  rationale: A combinação introduz uma pergunta que exige explicação; “então” preserva a força conectiva e o tom de contestação.
- source_word: קוֹל
  choice: som
  rationale: Embora קוֹל também possa significar “voz”, aqui designa os ruídos audíveis produzidos pelos animais; “som” é amplo e natural nas duas ocorrências.
- source_word: הַצֹּאן
  choice: ovelhas
  rationale: O termo coletivo pode abranger ovelhas e cabras, mas “ovelhas” é a tradução convencional e adequada neste contexto, em paralelo com o gado bovino.
- source_word: הַזֶּה
  choice: este
  rationale: O demonstrativo aponta para o som perceptível naquele momento; “este” mantém essa força dêitica.
- source_word: בְּאָזְנָי
  choice: que chega aos meus ouvidos
  rationale: A formulação portuguesa conserva a imagem vívida do hebraico sem a rigidez pouco natural de “em meus ouvidos”.
- source_word: וְקוֹל הַבָּקָר
  choice: e este som de bois
  rationale: בָּקָר é coletivo para bovinos. “Bois” é uma designação corrente no português bíblico e comum, sem limitar necessariamente a referência a animais de trabalho.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: que estou ouvindo
  rationale: O presente progressivo expressa a percepção em curso. O pronome explícito אָנֹכִי recebe expressão suficiente na forma verbal de primeira pessoa e no contexto retórico.
