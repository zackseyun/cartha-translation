  naturalness: O texto é em geral claro e de registro apropriado. “Vocês trataram com bondade todos os filhos de Israel” é pouco natural em português; “vocês demonstraram bondade para com todos os filhos de Israel” é mais idiomático e preserva a construção hebraica.
  terminology: “Queneus”, “amalequitas”, “filhos de Israel” e “bondade” são escolhas adequadas. A nota sobre ḥésed preserva alternativas pertinentes sem impor a noção de uma aliança formal. A nota sobre o verbo de juízo deve manter a forma singular do hebraico, mas explicar que ela se refere coletivamente aos queneus.
