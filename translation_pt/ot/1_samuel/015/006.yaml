  to: 'Então Saul disse aos queneus[a]: “Vão! Afastem-se, desçam do meio dos amalequitas, para que eu não os destrua junto com eles[b], pois vocês demonstraram bondade para com todos os filhos de Israel quando eles saíram do Egito[c].” E os queneus se afastaram do meio dos amalequitas.'
