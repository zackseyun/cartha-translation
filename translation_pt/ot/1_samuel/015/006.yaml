source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: pt
  text: 'Então Saul disse aos queneus[a]: “Vão! Afastem-se, desçam do meio dos amalequitas, para que eu não os destrua junto com eles[b], pois vocês demonstraram bondade para com todos os filhos de Israel quando eles saíram do Egito[c].” E os queneus se afastaram do meio dos amalequitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega um gentílico singular, “o queneu”, com sentido coletivo; os imperativos dirigidos a ele estão no plural.
    reason: grammatical_clarification
  - marker: b
    text: 'Hebraico: “para que eu não reúna você com ele”. Os sufixos estão no singular e se referem coletivamente aos queneus. No contexto, a expressão pode significar levá-los ou eliminá-los juntamente no mesmo juízo.'
    reason: lexical_alternative
  - marker: c
    text: Ou “quando eles subiram do Egito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: os queneus
  rationale: O gentílico singular hebraico tem sentido coletivo no contexto, como mostram os imperativos plurais; o plural explícito é natural e claro em português.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: Vão! Afastem-se, saiam
  rationale: Mantém a sequência enfática de três imperativos, mas traduz רְדוּ de modo contextual como saída do meio dos amalequitas; a alternativa literal 'desçam' consta em nota.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: do meio dos amalequitas
  rationale: Expressa com naturalidade a separação de um grupo que vivia entre os amalequitas e mantém a coesão entre as duas ocorrências.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: para que eu não os destrua junto com eles
  rationale: No contexto de juízo, אסף indica ser eliminado ou levado juntamente com outro grupo. O plural português acompanha o referente coletivo explicitado como 'os queneus'.
- source_word: חֶסֶד
  choice: trataram com bondade
  rationale: Neste contexto humano e histórico, 'bondade' comunica a benevolência leal sem acrescentar a ideia explícita de uma aliança formal não declarada no versículo.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Preserva a forma tradicional e semanticamente transparente do hebraico, que funciona como designação nacional.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: quando eles saíram do Egito
  rationale: Traduz o sentido idiomático do movimento do êxodo em português corrente; 'subiram do Egito' permanece como alternativa formal possível.
theological_decisions:
- issue: Sentido de חֶסֶד na ação dos queneus para com Israel
  choice: bondade
  alternative: lealdade; amor leal; lealdade de aliança
  rationale: O termo envolve bondade relacional e lealdade, mas o texto não afirma uma aliança formal entre os queneus e Israel. 'Bondade', com nota lexical, evita resolver excessivamente essa nuance.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel; israelitas
  rationale: A expressão é uma designação coletiva do povo, não uma limitação aos homens; a forma hebraica é preservada no texto e esclarecida em nota.
- issue: Natureza da ameaça em פֶּן אֹסִפְךָ עִמּוֹ
  choice: para que eu não os destrua junto com eles
  alternative: para que eu não os leve junto com eles; para que eu não os varra junto com eles
  rationale: O contexto militar favorece a ideia de perecer juntamente no juízo, sem atribuir ao verbo uma precisão técnica além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos plurais tornam explícito o sentido coletivo do gentílico hebraico. Evitou-se 'lealdade de aliança' no texto principal por ser mais interpretativo do que o contexto exige.
