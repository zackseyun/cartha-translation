  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: pt
  text: Então Samuel foi para Ramá, e Saul subiu para sua casa em Gibeá de Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico preserva o nome do lugar na forma “Gibeá de Saul”, que também pode ser entendido como “a Gibeá de Saul”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Na sequência narrativa, o wayyiqtol de הלך expressa naturalmente o avanço da ação com o sentido simples de “foi”.
- source_word: הָרָמָתָה
  choice: para Ramá
  rationale: O ה direcional acrescentado ao nome do lugar indica movimento em direção a Ramá; “para Ramá” é a forma natural em português.
- source_word: עָלָה
  choice: subiu
  rationale: עלה significa com frequência “subir” e pode conservar aqui uma nuance topográfica; “subiu” é claro e natural em português.
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: בית com sufixo de terceira pessoa masculina singular significa literalmente “sua casa”; o referente Saul está claro no contexto imediato.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibeá de Saul
  rationale: A tradução conserva a forma genitiva do topônimo hebraico sem decidir se ela expressa posse ou um nome geográfico estabelecido.
