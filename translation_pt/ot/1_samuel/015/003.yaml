base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: pt
  text: Agora, vá e ataque Amaleque; consagrem à destruição[a] tudo o que lhe pertence. Não o poupe, mas mate tanto homem como mulher, tanto criança pequena como bebê que mama, tanto boi como ovelha, tanto camelo como jumento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa aqui o plural “consagrem”, embora os verbos imediatamente antes e depois estejam no singular. “Consagrar à destruição” traduz um termo técnico para destinar irrevogavelmente à destruição sob juízo divino.
    reason: textual_grammar_and_lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição imediata para a ordem e mantém sua força direta.
- source_word: לֵךְ
  choice: vá
  rationale: Equivalente simples e natural do imperativo hebraico.
- source_word: וְהִכִּיתָה
  choice: ataque
  rationale: Neste contexto militar, נכה indica desferir um golpe contra um povo; “ataque” comunica isso naturalmente sem o tom arcaico de “fira”.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Mantém o nome coletivo no singular, conforme o hebraico, referindo-se corporativamente ao povo amalequita.
- source_word: וְהַחֲרַמְתֶּם
  choice: consagre à destruição
  rationale: Preserva a dimensão sacral e judicial de חרם, que vai além da ideia genérica de destruir.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tudo o que lhe pertence
  rationale: Expressa de forma abrangente e idiomática o domínio indicado pela frase hebraica.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: Não o poupe
  rationale: חמל pode significar ter compaixão ou poupar; no contexto da ordem de guerra, “poupar” é conciso e exato.
- source_word: וְהֵמַתָּה
  choice: mate
  rationale: O hifil de מות significa causar a morte. “Mate” é direto, atual e preserva a gravidade explícita da ordem.
- source_word: מֵאִישׁ עַד אִשָּׁה
  choice: tanto homem como mulher
  rationale: Representa o merismo inclusivo sem recorrer à formulação portuguesa pouco natural “desde homem até mulher”.
- source_word: מֵעֹלֵל וְעַד יוֹנֵק
  choice: tanto criança como bebê de colo
  rationale: Distingue a criança pequena do lactente em linguagem moderna e amplamente compreensível.
- source_word: מִשּׁוֹר וְעַד שֶׂה
  choice: tanto boi como ovelha
  rationale: Mantém as categorias animais da lista; “ovelha” é uma representação contextual natural de שֶׂה, embora o termo hebraico possa abranger ovino ou caprino.
- source_word: מִגָּמָל וְעַד חֲמוֹר
  choice: tanto camelo como jumento
  rationale: Preserva o último par distributivo da enumeração com vocabulário corrente.
theological_decisions:
- issue: Linguagem de חרם na guerra
  choice: consagre à destruição
  alternative: destrua completamente; coloque sob anátema
  rationale: A expressão mantém o caráter de entrega irrevogável à destruição sob juízo divino, sem reduzir o termo a mera ação militar nem introduzir terminologia denominacional.
- issue: Singular coletivo de Amaleque
  choice: Amaleque ... lhe ... o
  alternative: os amalequitas ... lhes ... os
  rationale: O hebraico personifica o povo como entidade coletiva singular. A tradução conserva essa forma e sua tensão corporativa.
- issue: Estrutura totalizante dos pares
  choice: tanto X como Y
  alternative: desde X até Y; X e Y
  rationale: A construção portuguesa torna clara a abrangência dos merismos repetidos, ao mesmo tempo que evita uma sequência artificial.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. O texto não suaviza a violência da ordem. “Bebê de colo” é mais corrente que “lactente”; “jumento” é amplamente inteligível. Nenhum marcador de nota foi usado porque não há notas no rascunho.
