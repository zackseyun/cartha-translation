review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem o sentido central, o nome coletivo singular e a linguagem técnica de חרם. Contudo, o hebraico massorético muda para o imperativo plural em וְהַחֲרַמְתֶּם (“consagrem”), antes de retornar ao singular; o rascunho uniformiza indevidamente essa forma como singular (“consagre”). “Bebê de colo” não exprime especificamente um lactente que mama (יוֹנֵק).
  naturalness: O registro é moderno, claro e sóbrio. “Tanto ... como ...” comunica adequadamente a abrangência das duplas. A mudança de número em “consagrem” é incomum em português, mas reproduz uma dificuldade real do texto hebraico e pode ser esclarecida por nota.
  terminology: “Amaleque”, “consagrem à destruição”, “não o poupe”, “boi”, “ovelha”, “camelo” e “jumento” são escolhas adequadas. “Bebê que mama” é mais exato que “bebê de colo” para יוֹנֵק e continua acessível em português internacional.
  issues:
  - severity: medium
    issue: O imperativo plural de וְהַחֲרַמְתֶּם foi convertido em singular.
    rationale: O texto hebraico traz “vá/ataque” no singular, “consagrem” no plural e novamente formas singulares. Ainda que a alternância seja estilisticamente abrupta e sua explicação seja discutida, ela não deve ser nivelada sem indicação.
  - severity: low
    issue: “Bebê de colo” não traduz com precisão יוֹנֵק.
    rationale: O termo hebraico designa especificamente uma criança que mama; estar no colo não implica necessariamente amamentação.
