base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: pt
  text: 'Saul disse a Samuel: “Mas eu obedeci, sim, à voz de Yahweh[a] e segui pelo caminho para o qual Yahweh me enviou. Trouxe Agague, rei de Amaleque, e consagrei Amaleque à destruição.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ouvi a voz de Yahweh”, expressão que, neste contexto, significa obedecer-lhe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “destruí completamente Amaleque” ou “coloquei Amaleque sob interdição”. O verbo hebraico expressa a ideia de destinar algo irrevogavelmente à destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: obedeci, sim, à voz de
  rationale: A construção שׁמע בְּקוֹל significa ouvir de modo obediente, isto é, obedecer. “Sim” transmite em português a insistência defensiva de Saul no contexto, enquanto “à voz de” preserva o idioma hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ
  choice: segui pelo caminho
  rationale: Preserva a imagem do caminho ou percurso designado e soa natural em português; “cumpri a missão” seria mais interpretativo.
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: para o qual Yahweh me enviou
  rationale: Faz a oração relativa modificar “caminho”, de acordo com a sintaxe e a imagem do hebraico.
- source_word: וָאָבִיא
  choice: Trouxe
  rationale: O hifil de בוא indica fazer vir ou trazer. O verbo não expressa por si só a ideia de “trazer de volta”.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agague, rei de Amaleque
  rationale: Reproduz de modo claro a aposição hebraica, usando as formas portuguesas correntes dos nomes.
- source_word: הֶחֱרַמְתִּי
  choice: consagrei ... à destruição
  rationale: O hifil de חרם designa colocar algo sob interdição, destinando-o à destruição. “Consagrei à destruição” conserva tanto a dimensão de dedicação irrevogável quanto o resultado destrutivo.
- source_word: וְאֶת עֲמָלֵק
  choice: Amaleque
  rationale: Mantém o nome próprio singular do hebraico, empregado coletivamente para o povo ou a nação.
theological_decisions:
- issue: Sentido de חרם no contexto de guerra sagrada
  choice: consagrei Amaleque à destruição
  alternative: destruí completamente Amaleque; coloquei Amaleque sob interdição
  rationale: A formulação conserva a força judicial e cultual do verbo sem reduzi-lo apenas ao ato físico de matar nem inserir uma explicação extensa no texto.
- issue: Insistência defensiva de Saul
  choice: Mas eu obedeci, sim, à voz de Yahweh
  alternative: Mas eu obedeci à voz de Yahweh; De fato, obedeci à voz de Yahweh
  rationale: O contexto dá à declaração força de contestação enfática. “Mas” e “sim” comunicam essa defesa em português natural sem decidir se a alegação de Saul era verdadeira.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a metáfora hebraica do caminho sem soar artificial. “Agague” e “Amaleque” seguem formas portuguesas correntes. Os marcadores foram ordenados conforme sua primeira ocorrência no texto, corrigindo a associação invertida observada na camada inglesa de consulta.
