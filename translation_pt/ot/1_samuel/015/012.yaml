base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: pt
  text: 'Samuel se levantou de madrugada para ir ao encontro de Saul, e lhe informaram: “Saul chegou ao Carmelo e lá está ele, erguendo para si um monumento[a]. Depois, deu meia-volta, seguiu adiante e desceu a Gilgal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “uma mão para si”. Aqui, “mão” designa uma marca memorial ou um monumento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: se levantou de madrugada
  rationale: O hifil com waw consecutivo expressa levantar-se cedo; a formulação é natural em português e mantém a ênfase temporal.
- source_word: לִקְרַאת שָׁאוּל
  choice: para ir ao encontro de Saul
  rationale: A preposição ל com o infinitivo indica finalidade; esta expressão reproduz claramente a ideia de Samuel sair para encontrar Saul.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: e foi informado
  rationale: A forma passiva deixa sem identificação quem trouxe a notícia. Como Samuel acabou de ser mencionado, o sujeito elíptico fica claro e evita repetição pesada.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: Saul foi ao Carmelo
  rationale: O he direcional indica movimento rumo ao Carmelo; em português, 'foi ao Carmelo' é natural a partir da perspectiva do relato.
- source_word: וְהִנֵּה
  choice: e, veja
  rationale: Preserva a função de chamar a atenção, em linguagem moderna, sem recorrer ao arcaísmo 'eis que'.
- source_word: מַצִּיב
  choice: ergueu
  rationale: No contexto de הִנֵּה mais particípio, apresenta vividamente a ação e seu resultado; o pretérito perfeito se integra com naturalidade ao relato comunicado.
- source_word: יָד
  choice: um monumento
  rationale: Embora signifique literalmente 'mão', aqui o termo designa uma marca memorial ou monumento; a tradução pelo sentido evita uma leitura obscura.
- source_word: לּוֹ
  choice: para si
  rationale: 'Comunica de modo conciso o valor reflexivo: o monumento foi erguido em honra do próprio Saul.'
- source_word: וַיִּסֹּב
  choice: deu meia-volta
  rationale: Expressa mudança de direção de forma clara dentro da sequência de viagem.
- source_word: וַיַּעֲבֹר
  choice: seguiu adiante
  rationale: No encadeamento dos verbos de movimento, indica que Saul prosseguiu viagem.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: desceu a Gilgal
  rationale: Mantém a ideia topográfica de descida e a direção até Gilgal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção passiva preserva o agente não identificado; 'veja' mantém a força de וְהִנֵּה, e a nota registra o sentido literal do idiomatismo יָד.
