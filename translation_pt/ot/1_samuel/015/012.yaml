revisions:
- from: 'Samuel se levantou de madrugada para ir ao encontro de Saul, e foi informado: “Saul foi ao Carmelo e, veja, ergueu para si um monumento[a]. Depois, deu meia-volta, seguiu adiante e desceu a Gilgal”.'
  to: 'Samuel se levantou de madrugada para ir ao encontro de Saul, e lhe informaram: “Saul chegou ao Carmelo e lá está ele, erguendo para si um monumento[a]. Depois, deu meia-volta, seguiu adiante e desceu a Gilgal.”'
  rationale: A revisão torna natural a comunicação recebida por Samuel e representa a construção hebraica «e eis que» mais particípio por «lá está ele, erguendo», que mantém sua força apresentativa e aspectual. A nota continua assinalando o sentido literal de יָד e sua interpretação contextual, sem eliminar a ambiguidade lexical do hebraico.
