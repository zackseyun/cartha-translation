  text: וַ/יִּקַּ֨ח הָ/עָ֧ם מֵ/הַ/שָּׁלָ֛ל צֹ֥אן וּ/בָקָ֖ר רֵאשִׁ֣ית הַ/חֵ֑רֶם לִ/זְבֹּ֛חַ לַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/גִּלְגָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: pt
  text: Mas o povo tomou do despojo ovelhas e bois, o melhor daquilo que fora destinado à destruição[a], para sacrificar ao SENHOR[b], seu Deus, em Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o melhor — ou a primeira parte — daquilo que fora destinado à destruição”. A expressão refere-se a animais que estavam sob o herém, isto é, destinados a Deus para destruição, e não deveriam ter sido preservados.'
    reason: lexical_alternative
  - marker: b
    text: “SENHOR” traduz o nome divino YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Mas ... pegou
  rationale: O verbo לָקַח significa aqui “pegar/tomar”. “Mas” representa o contraste discursivo introduzido pelo waw e preserva a tentativa de Saul de transferir a culpa para o povo.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém a designação coletiva hebraica e sua força retórica, embora, no contexto, se refira aos homens de Saul.
- source_word: מֵהַשָּׁלָל
  choice: do despojo
  rationale: שָׁלָל designa bens capturados na guerra. “Despojo” é preciso e corrente no registro bíblico, sem ampliar o sentido.
- source_word: צֹאן וּבָקָר
  choice: ovelhas e bois
  rationale: Traduz concretamente os animais de pequeno e grande porte mencionados no hebraico.
- source_word: רֵאשִׁית הַחֵרֶם
  choice: o melhor do que havia sido consagrado à destruição
  rationale: רֵאשִׁית tem aqui o sentido contextual de parte melhor ou mais escolhida; חֵרֶם indica aquilo que fora irrevogavelmente destinado a Deus e, neste contexto, devia ser destruído.
- source_word: לִזְבֹּחַ
  choice: para oferecer em sacrifício
  rationale: O infinitivo expressa propósito; a formulação é natural em português e explicita corretamente o ato sacrificial.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a convenção portuguesa tradicional para o nome divino YHWH, com nota que torna transparente o hebraico.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: 'Preserva o sufixo de segunda pessoa do singular: Saul diz a Samuel “seu Deus”, sem transformar a expressão em “nosso Deus”.'
- source_word: בַּגִּלְגָּל
  choice: em Gilgal
  rationale: Preposição natural em português diante do nome desse lugar.
theological_decisions:
- issue: Sentido de חֵרֶם no contexto da guerra
  choice: o que havia sido consagrado à destruição
  alternative: o que estava sob a proibição; as coisas consagradas
  rationale: A tradução preserva simultaneamente a dedicação religiosa e a exigência de destruição, sem reduzir o termo a despojo comum nem resolver a tensão teológica do texto.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh; Javé
  rationale: A forma em versaletes segue a convenção bíblica portuguesa amplamente reconhecida, enquanto a nota informa de modo transparente que o texto hebraico traz o nome próprio YHWH.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem sacrificar a naturalidade. “Pegou” evita o tom excessivamente arcaico de “tomou”, e “oferecer em sacrifício” comunica com clareza o propósito expresso pelo infinitivo hebraico.
