base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Levei em conta[a] o que Amaleque fez a Israel[c], como se opôs a ele[b] no caminho, quando Israel subia do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lembrei-me do que Amaleque fez”, “atentei para o que Amaleque fez” ou, neste contexto de juízo, “decidi castigá-lo pelo que fez”. O verbo hebraico pode indicar dar atenção, lembrar-se ou visitar com juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como se colocou contra ele”; possivelmente, “como armou uma emboscada contra ele”. A expressão hebraica descreve a ação hostil de Amaleque contra Israel durante a jornada do êxodo.'
    reason: lexical_alternative
  - marker: c
    text: No hebraico, os pronomes correspondentes a “ele” e ao sujeito de “subia” estão no singular masculino e referem-se a Israel como coletivo singular.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética e mensageira reconhecível, em português atual e solene.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz o título tradicional sem restringir os exércitos a forças apenas humanas ou apenas celestiais.
- source_word: פָּקַדְתִּי
  choice: Atentei para
  rationale: Expressa que Yahweh voltou sua atenção para a antiga ofensa com intenção consequente, sem antecipar explicitamente a punição ordenada no versículo seguinte.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: o que Amaleque fez a Israel
  rationale: Formulação natural que conserva a amplitude da ação hostil sem acrescentar detalhes.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: como se opôs a ele no caminho
  rationale: Comunica de modo claro a ação hostil de Amaleque contra Israel, sem limitar a expressão hebraica à ideia específica de emboscada.
- source_word: לוֹ ... בַּעֲלֹתוֹ
  choice: a ele ... quando este subia
  rationale: Conserva a referência masculina singular a Israel como entidade coletiva, usando “este” para tornar o referente mais claro em português.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Integra-se à expressão idiomática bíblica “subir do Egito” de forma direta e natural.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh das hostes
  rationale: Mantém o nome próprio divino e a amplitude do título, sem substituí-lo por um título nem adotar o termo menos corrente “hostes”.
- issue: Nuance de lembrança e juízo em פָּקַדְתִּי
  choice: Atentei para
  alternative: Lembrei-me de; castigarei por; levei em conta
  rationale: Preserva a tensão entre recordar, dar atenção e intervir em juízo, sem reduzir o verbo a uma única dessas dimensões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula “Assim diz” conserva o tom profético; “atentei para” evita tanto linguagem arcaica quanto uma explicitação prematura do castigo. O singular coletivo foi preservado e esclarecido em nota.
