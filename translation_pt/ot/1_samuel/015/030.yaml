  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: pt
  text: 'E ele disse: “Pequei. Agora, por favor, honra-me diante dos anciãos do meu povo e diante de Israel. Volta comigo, para que eu me curve diante de Yahweh, teu Deus.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eu me curvarei diante de Yahweh, teu Deus”. A forma hebraica pode ser entendida como simples continuação (“e eu me curvarei”) ou como expressão de finalidade depois do pedido anterior (“para que eu me curve”).'
    reason: alternativa sintática
lexical_decisions:
- source_word: חָטָאתִי
  choice: Pequei
  rationale: O qal perfeito na primeira pessoa do singular expressa uma confissão direta de pecado; o pretérito perfeito é a forma natural em português.
- source_word: עַתָּה
  choice: Agora
  rationale: Preserva o advérbio temporal que introduz o pedido imediato de Saul.
- source_word: כַּבְּדֵנִי נָא
  choice: por favor, honra-me
  rationale: O imperativo piel pede que Samuel confira honra pública a Saul; “por favor” representa נָא.
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: diante dos anciãos do meu povo e diante de Israel
  rationale: “Diante de” comunica visibilidade e reconhecimento públicos, mantendo tanto “meu povo” quanto a ausência de “todo” antes de Israel.
- source_word: וְשׁוּב עִמִּי
  choice: Volta comigo
  rationale: שׁוב denota voltar ou retornar; no contexto, Saul pede que Samuel volte acompanhando-o.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: para que eu me curve
  rationale: Mantém o gesto corporal de prostração expresso pelo verbo e entende a conjunção como finalidade após o pedido precedente, sem ocultar a alternativa gramatical.
- source_word: לַיהוָה
  choice: diante de Yahweh
  rationale: A preposição indica a pessoa perante quem Saul se curvará, e o nome da aliança é transliterado como “Yahweh”.
- source_word: אֱלֹהֶיךָ
  choice: teu Deus
  rationale: Preserva explicitamente o sufixo de segunda pessoa singular e a tensão narrativa da fala de Saul a Samuel.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: A expressão de Saul אֱלֹהֶיךָ
  choice: teu Deus
  alternative: nosso Deus; Deus
  rationale: O hebraico diz literalmente “teu Deus”. Manter a segunda pessoa conserva a tensão narrativa e teológica, sem harmonizar a formulação de Saul.
- issue: Relação sintática de וְהִשְׁתַּחֲוֵיתִי
  choice: para que eu me curve
  alternative: e eu me curvarei
  rationale: A sequência pode exprimir finalidade depois de “volta comigo” ou simples continuação. A tradução principal adota a leitura final, mais natural no pedido, e a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes (“honra-me”, “teu”). A colocação pronominal preserva um tom bíblico moderado sem recorrer a linguagem arcaica. O marcador [a] aparece no texto principal e remete à ambiguidade real do hebraico.
