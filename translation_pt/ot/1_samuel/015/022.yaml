  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: pt
  text: 'Então Samuel disse: “Será que o SENHOR tem tanto prazer em holocaustos e sacrifícios quanto em que se obedeça à voz do SENHOR? Veja: obedecer é melhor do que sacrificar, e dar ouvidos é melhor do que a gordura de carneiros.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: tem tanto prazer
  rationale: Expressa o substantivo חֵפֶץ no contexto da pergunta comparativa, preservando a ideia de prazer ou agrado sem sugerir que os sacrifícios fossem intrinsecamente ilícitos.
- source_word: כִּשְׁמֹעַ בְּקוֹל יְהוָה
  choice: quanto em que se obedeça à voz do SENHOR
  rationale: A expressão idiomática שׁמע בקול significa escutar de modo obediente; a formulação conserva também a imagem hebraica da 'voz'.
- source_word: הִנֵּה
  choice: Veja
  rationale: Marcador de atenção claro e atual, que mantém a força discursiva da interjeição hebraica.
- source_word: שְׁמֹעַ
  choice: obedecer
  rationale: No contraste com o sacrifício, o infinitivo absoluto implica escuta obediente, não mera percepção auditiva.
- source_word: לְהַקְשִׁיב
  choice: dar ouvidos
  rationale: Mantém a imagem auditiva e comunica atenção receptiva, em paralelo com 'obedecer'.
- source_word: מֵחֵלֶב אֵילִים
  choice: do que a gordura de carneiros
  rationale: Tradução concreta da porção sacrificial especialmente valorizada e oferecida no altar.
theological_decisions:
- issue: Relação entre obediência e sacrifício
  choice: 'Preservar a comparação: a obediência é melhor do que o sacrifício.'
  alternative: Interpretar como rejeição absoluta de todo sacrifício.
  rationale: O hebraico formula uma pergunta comparativa e duas comparações explícitas; no contexto, condena o uso do sacrifício como substituto da obediência, sem exigir uma negação geral do culto sacrificial.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida para o tetragrama, em versalete editorial representado aqui por maiúsculas.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e ampla inteligibilidade internacional. O paralelismo poético foi preservado, assim como a transição enfática introduzida por הִנֵּה.
