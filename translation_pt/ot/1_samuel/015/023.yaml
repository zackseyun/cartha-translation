  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: pt
  text: Pois a rebeldia é como o pecado da adivinhação[a], e a obstinação, como a maldade e os ídolos domésticos[b]. Já que você rejeitou a palavra de Yahweh, ele também rejeitou você como rei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pecado da feitiçaria”. O termo hebraico קֶסֶם refere-se, de modo mais amplo, à adivinhação ou à busca de conhecimento oculto por meios proibidos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico תְּרָפִים (terafins): imagens ou ídolos de culto doméstico.'
    reason: lexical_alternative
  - marker: c
    text: Ou “ele rejeitou você do reinado”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão explicativa da repreensão anterior, enquanto יַעַן inicia depois a causa específica da sentença contra Saul.
- source_word: חַטַּאת קֶסֶם
  choice: o pecado da adivinhação
  rationale: Traduz naturalmente a cadeia construta e identifica uma prática proibida de busca de conhecimento oculto sem recorrer ao termo mais estreito e potencialmente anacrônico 'feitiçaria'.
- source_word: מֶרִי
  choice: rebeldia
  rationale: Expressa a resistência deliberada de Saul à autoridade e à ordem divina, em linguagem clara e forte.
- source_word: וְאָוֶן
  choice: a maldade
  rationale: No paralelismo com os terafins, comunica o sentido moral de perversidade ou iniquidade de modo acessível.
- source_word: וּתְרָפִים
  choice: os ídolos domésticos
  rationale: Explicita para o leitor moderno que os terafins eram imagens de culto ligadas ao ambiente doméstico; o termo técnico é conservado na nota.
- source_word: הַפְצַר
  choice: a obstinação
  rationale: Capta a insistência arrogante e inflexível de quem se recusa a ceder, com registro digno e corrente.
- source_word: יַעַן
  choice: Porque
  rationale: Marca claramente a causa explícita da sentença pronunciada contra Saul.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: você rejeitou a palavra de Yahweh
  rationale: Preserva o sentido de rejeição e a repetição retórica do verbo מָאַס na oração seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino no texto hebraico, conforme a prática do projeto.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: ele também rejeitou você como rei
  rationale: É português natural e comunica a destituição de Saul da condição régia; a alternativa mais literal é registrada em nota.
theological_decisions:
- issue: Estrutura comparativa do primeiro período
  choice: A rebeldia é comparada ao pecado da adivinhação, e a obstinação, à maldade e aos ídolos domésticos.
  alternative: A rebeldia é o pecado da adivinhação, e a obstinação é maldade e terafins.
  rationale: Embora o hebraico não expresse uma partícula equivalente a 'como', o paralelismo apresenta uma equiparação retórica. A formulação comparativa preserva a força proverbial sem transformar desnecessariamente as práticas em identidades lexicais estritas.
- issue: Sentido da rejeição de Saul em relação ao reinado
  choice: ele também rejeitou você como rei
  alternative: ele rejeitou você, impedindo que continuasse sendo rei
  rationale: A preposição מִן pode indicar afastamento da condição real. A tradução principal mantém concisão e ambiguidade razoável quanto ao processo e ao momento da perda efetiva do reino.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega 'você' por coerência discursiva e mantém 'Yahweh' para o tetragrama. A elipse em 'e a obstinação, como...' reproduz de maneira natural o paralelismo hebraico.
