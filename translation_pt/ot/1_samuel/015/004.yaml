base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: pt
  text: 'Então Saul convocou o povo e passou revista às tropas em Telaim: duzentos mil soldados de infantaria[a] e dez mil homens de Judá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com cordeiros”, caso בַּטְּלָאִים seja entendido literalmente, em vez de como o nome do lugar Telaim.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: convocou
  rationale: O hifil de שׁמע, neste contexto militar, significa chamar ou reunir; “convocou” expressa o sentido de modo natural.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o sentido literal do substantivo, embora o contexto deixe claro que se trata do contingente reunido para a guerra.
- source_word: וַיִּפְקְדֵם
  choice: passou revista às tropas
  rationale: פקד em contexto militar indica inspecionar, contar ou registrar um contingente. A expressão portuguesa comunica naturalmente a ideia de muster sem reduzi-la apenas à contagem.
- source_word: בַּטְּלָאִים
  choice: em Telaim
  rationale: A forma é entendida no contexto como topônimo, indicando o lugar onde Saul reuniu e inspecionou as tropas; a leitura literal alternativa é preservada em nota.
- source_word: מָאתַיִם אֶלֶף רַגְלִי
  choice: duzentos mil soldados de infantaria
  rationale: O numeral é direto, e רַגְלִי designa combatentes a pé no contexto militar.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אֶת אִישׁ יְהוּדָה
  choice: e dez mil homens de Judá
  rationale: Representa naturalmente o número e a identificação tribal coletiva expressos no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia militar compreensível. “Passou revista às tropas” explicita idiomaticamente a função militar de פקד, enquanto “o povo” preserva a formulação hebraica inicial. A ambiguidade de בַּטְּלָאִים é mantida em nota.
