base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: pt
  text: Então Saul feriu Amaleque[a], desde Havilá, na direção de Sur[b], que fica diante do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os amalequitas”; em hebraico, “Amaleque”, nome do antepassado usado coletivamente para designar o povo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao ires para Sur”. A expressão também pode ser entendida como “em direção a Sur”. “Que fica diante do Egito” também pode ser traduzido como “que fica a leste do Egito” ou “em frente ao Egito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: feriu
  rationale: O verbo נכה pode significar ferir, atacar ou derrotar. “Feriu” preserva sua força concreta sem afirmar além do que esta oração explicita.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: O nome singular é usado coletivamente para designar o povo amalequita; manter “Amaleque” reproduz de perto a forma hebraica.
- source_word: מֵחֲוִילָה
  choice: desde Havilá
  rationale: A preposição מִן assinala o ponto inicial da extensão geográfica; “desde” combina naturalmente com o limite expresso a seguir.
- source_word: בּוֹאֲךָ שׁוּר
  choice: até a região de Sur
  rationale: A expressão geográfica idiomática significa literalmente “ao entrares/indo para Sur”. Em português, “até a região de Sur” comunica com naturalidade o limite do percurso sem sugerir necessariamente a entrada na localidade.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: que fica diante do Egito
  rationale: “Diante do Egito” conserva a imagem espacial e a possível amplitude de עַל־פְּנֵי, evitando especificar uma direção cardinal que o hebraico não torna inequívoca.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal em português.
