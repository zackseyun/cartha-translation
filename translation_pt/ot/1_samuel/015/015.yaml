base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: pt
  text: 'Saul disse: “Eles os trouxeram dos amalequitas, porque o povo poupou o melhor das ovelhas e do gado para sacrificá-los a Yahweh, o seu Deus; mas o restante nós destinamos à destruição[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destruímos completamente”. O hebraico emprega uma forma de חָרַם, termo técnico para destinar algo à destruição sob uma proibição sagrada.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: Eles os trouxeram
  rationale: O hifil de בוא, com sufixo de objeto na terceira pessoa do plural, indica que eles fizeram os animais vir, isto é, os trouxeram. O pretérito perfeito se ajusta à sequência narrativa.
- source_word: מֵעֲמָלֵקִי
  choice: dos amalequitas
  rationale: A forma gentílica refere-se naturalmente ao povo amalequita, e não apenas ao território de Amaleque.
- source_word: חָמַל ... עַל
  choice: poupou
  rationale: Neste contexto militar, a expressão descreve o ato concreto de não destruir aquilo que estava sob a condenação, mais do que apenas um sentimento de compaixão.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: o melhor das ovelhas e do gado
  rationale: מֵיטַב designa a parte superior ou mais escolhida. A formulação portuguesa mantém o valor coletivo das categorias de animais e soa natural.
- source_word: לְמַעַן זְבֹחַ
  choice: para sacrificá-los
  rationale: לְמַעַן marca finalidade. O pronome explicita, sem alterar o sentido, que os animais poupados seriam os objetos do sacrifício.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto traz diretamente o tetragrama יהוה; a transliteração preserva o nome divino revelado, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: 'O sufixo está na segunda pessoa masculina singular: Saul fala a Samuel e diz literalmente “seu Deus”. A presença do artigo antes do possessivo ajuda a sinalizar a referência direta ao interlocutor.'
- source_word: הַיּוֹתֵר
  choice: o restante
  rationale: Refere-se ao que sobrou além dos melhores animais que foram poupados.
- source_word: הֶחֱרַמְנוּ
  choice: nós destinamos à destruição
  rationale: O hifil de חרם, neste contexto, é um termo técnico para colocar algo sob a proibição que exige sua destruição. “Destinamos à destruição” conserva essa dimensão sem recorrer a jargão pouco transparente.
theological_decisions:
- issue: Sentido de חרם no contexto de guerra e juízo
  choice: destinamos à destruição
  alternative: destruímos completamente; colocamos sob a proibição
  rationale: O verbo não expressa mera destruição comum, mas a entrega irrevogável ao juízo mediante destruição. A tradução principal preserva esse aspecto técnico, e a nota registra a alternativa mais direta.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A forma “Yahweh” representa diretamente o nome próprio no texto hebraico e o distingue do título “Senhor”.
- issue: Distanciamento retórico em אֱלֹהֶיךָ
  choice: o seu Deus
  alternative: nosso Deus
  rationale: O hebraico usa a segunda pessoa singular. Preservar “seu” evita apagar a maneira significativa como Saul se dirige a Samuel.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem da fala e o contraste entre “o povo” e “nós” foram preservados. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
