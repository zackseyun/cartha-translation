id: 1SA.15.29
reference: 1 Samuel 15:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: pt
  text: Além disso, a Glória de Israel[a] não mentirá nem voltará atrás, pois ele não é homem para voltar atrás.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Eterno de Israel”, “a Força de Israel” ou “a Vitória de Israel”. O título hebraico tem um amplo campo de sentidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “não mudará de ideia” ou “não se arrependerá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Expressa de modo natural a conjunção com força aditiva e enfática, ligando esta afirmação à repreensão anterior.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: a Glória de Israel
  rationale: Preserva o caráter elevado de título divino sem restringir o amplo campo semântico de נֵצַח; alternativas legítimas são registradas em nota.
- source_word: יְשַׁקֵּר
  choice: não mentirá
  rationale: Traduz diretamente o piel de שקר e ressalta a veracidade e confiabilidade de Deus em contraste com a inconstância humana.
- source_word: וְלֹא יִנָּחֵם
  choice: nem voltará atrás
  rationale: No contexto da rejeição de Saul, comunica a ideia de não revogar a decisão, sem impor a noção de arrependimento moral.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira concisa e natural a razão da afirmação anterior.
- source_word: לֹא אָדָם הוּא
  choice: ele não é homem
  rationale: Mantém o contraste explícito do hebraico entre Deus e um ser humano, com formulação corrente e dignificada em português.
- source_word: לְהִנָּחֵם
  choice: para voltar atrás
  rationale: Repete a mesma escolha lexical usada para יִנָּחֵם, preservando a coesão e completando naturalmente a comparação.
theological_decisions:
- issue: Linguagem sobre a constância divina sem ampliar a afirmação para além do contexto
  choice: não mentirá nem voltará atrás
  alternative: não se arrependerá / não mudará de ideia
  rationale: A formulação enfatiza a confiabilidade de Deus e a não revogação da sentença contra Saul, sem transformar o versículo numa definição filosófica exaustiva da imutabilidade divina.
- issue: Sentido do título divino נֵצַח יִשְׂרָאֵל
  choice: a Glória de Israel
  alternative: o Eterno de Israel / a Força de Israel / a Vitória de Israel
  rationale: O substantivo possui amplo campo semântico. A opção principal conserva a dignidade titular, enquanto a nota preserva alternativas plausíveis em vez de resolver indevidamente a ambiguidade.
- issue: Relação com outras passagens em que Deus parece mudar de curso
  choice: Preservar a afirmação contextual de que Deus não voltará atrás nesta decisão
  alternative: Generalizar como incapacidade absoluta de qualquer mudança de ação
  rationale: O texto declara a firmeza da decisão divina a respeito de Saul. A tradução mantém essa força sem eliminar a tensão literária e teológica criada pelo uso de נחם em outros contextos.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e compreensão internacional. “Voltar atrás” é idiomático e adequado ao contexto judicial, enquanto as notas preservam a amplitude lexical do hebraico. Todos os marcadores de nota aparecem no texto principal.
