base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: pt
  text: 'Então Samuel disse a Saul: “Yahweh me enviou para ungir você como rei sobre o seu povo, sobre Israel. Agora, dê ouvidos às palavras de Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “escute a voz das palavras de Yahweh”. A expressão hebraica implica não apenas ouvir, mas também atender ao que foi dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa essa progressão de modo natural em português.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: Yahweh me enviou
  rationale: A ordem hebraica põe “a mim” em destaque, mas o português corrente comunica com clareza a comissão passada pela ordem natural da frase, sem introduzir um contraste mais forte do que o contexto exige.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִמְשָׁחֳךָ
  choice: para ungir você
  rationale: O verbo משׁח designa a unção para o exercício de um ofício; “ungir” preserva a terminologia e o sentido da instalação real.
- source_word: לְמֶלֶךְ
  choice: como rei
  rationale: A preposição indica a função para a qual Saul foi ungido; “como rei” é claro e idiomático.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: sobre o seu povo, sobre Israel
  rationale: Mantém a repetição de עַל e a cadência enfática pela qual Israel identifica mais precisamente o povo de Yahweh.
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Marca tanto a transição temporal-discursiva quanto a consequência prática da comissão anteriormente recebida.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: dê ouvidos às palavras de Yahweh
  rationale: A expressão hebraica, literalmente relacionada a ouvir “a voz das palavras”, exige atenção obediente. “Dê ouvidos” conserva a dimensão auditiva e a convocação a atender, com naturalidade em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva esse nome no corpo da tradução, sem substituí-lo pelo título “SENHOR”.
- issue: Força da ordem שְׁמַע
  choice: dê ouvidos
  alternative: escute; obedeça
  rationale: “Dê ouvidos” preserva a tensão entre ouvir e atender obedientemente. “Escute” pode parecer apenas auditivo, enquanto “obedeça” explicita uma consequência implícita e elimina a imagem verbal hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” de modo respeitoso e natural no discurso direto, preserva a repetição retórica de “sobre” e evita tanto o literalismo pouco idiomático quanto a explicitação excessiva.
