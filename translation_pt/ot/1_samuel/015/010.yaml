  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמוּאֵ֖ל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/010.yaml
  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh[a] veio a Samuel, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa introduz um novo acontecimento na sequência. “Então ... veio” expressa isso em português atual sem recorrer ao arcaico “e aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, “a palavra” mantém a expressão tradicional e a ligação explícita com a revelação divina; “mensagem” seria possível, mas menos formalmente correspondente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica Samuel como destinatário da palavra divina; “a” é a formulação natural nesta construção.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Emprega a forma portuguesa convencional do nome pessoal.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva o infinitivo hebraico que introduz o conteúdo da fala divina e deixa aberta a continuação no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da fórmula profética hebraica. “Dizendo” foi mantido para representar לֵאמֹר, embora a simples pontuação com dois-pontos também fosse idiomática.
