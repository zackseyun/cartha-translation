source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: pt
  text: 'Então Samuel disse a Saul: “Não voltarei com você, porque você rejeitou a palavra de Yahweh, e Yahweh rejeitou você como rei sobre Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: Não voltarei com você
  rationale: שׁוב significa voltar ou retornar, e עִם indica companhia. A formulação é direta e natural.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão da recusa de Samuel.
- source_word: מָאַסְתָּה ... וַיִּמְאָסְךָ
  choice: você rejeitou ... rejeitou você
  rationale: A repetição de “rejeitar” preserva a correspondência deliberada criada pela repetição da raiz מאס.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” mantém a amplitude de דָּבָר e a expressão bíblica, embora no contexto se refira à ordem comunicada por Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵהְיוֹת מֶלֶךְ
  choice: como rei
  rationale: Neste contexto, a construção indica rejeição quanto ao exercício ou condição de rei; “como rei” comunica isso de modo idiomático sem sugerir que Saul deixou imediatamente de ocupar o trono.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Preserva o valor de עַל e expressa naturalmente o âmbito do governo real.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada.
- issue: Reciprocidade expressa pela raiz מאס
  choice: Repetir “rejeitou” nas duas orações
  alternative: Variar entre “desprezou”, “recusou” e “rejeitou”
  rationale: A repetição mantém a relação enfática entre Saul rejeitar a palavra de Yahweh e Yahweh rejeitar Saul como rei.
- issue: Natureza da rejeição de Saul
  choice: “rejeitou você como rei”
  alternative: “rejeitou você, para que não seja rei”; “rejeitou você de ser rei”
  rationale: A tradução natural indica rejeição para a função régia sem resolver além do texto a tensão entre a sentença divina e a permanência temporária de Saul no trono.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a repetição retórica central e evita uma construção excessivamente literal e pouco idiomática em “מֵהְיוֹת”.
