  source_fidelity: 'O texto traduz adequadamente todos os elementos centrais do hebraico: a progressão narrativa, a recusa de Samuel em voltar com Saul, a relação causal, a repetição intencional de מאס («rejeitou»), «a palavra de Yahweh», e a destituição de Saul quanto à realeza sobre Israel. «Rejeitou você como rei» é uma formulação portuguesa idiomática que comunica, sem extrapolação, a rejeição de Saul para a função real.'
