language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: pt
  text: 'E digam assim: “Vida longa para você![a] Paz para você,[b] paz para a sua casa e paz para tudo o que é seu”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente algo próximo de “à vida” ou “ao vivente”. Provavelmente se trata de uma saudação ou bênção, daí “Vida longa para você”; também pode ser entendido de modo mais geral como “Saudações”.
    reason: alternative_reading
  - marker: b
    text: A palavra hebraica traduzida como “paz” também pode indicar bem-estar, plenitude ou prosperidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: E digam
  rationale: O waw seguido do perfeito dá continuidade à instrução de Davi com força de ordem. “E digam” reproduz essa função de modo natural em português.
- source_word: כֹּה
  choice: assim
  rationale: Introduz a mensagem citada; “assim” é a forma corrente e direta de expressar o demonstrativo hebraico.
- source_word: לֶחָי
  choice: Vida longa para você
  rationale: A expressão hebraica, literalmente próxima de “à vida” ou “ao vivente”, é difícil e provavelmente funciona como saudação ou bênção. A tradução comunica o provável desejo de vida sem esconder a incerteza, registrada em nota.
- source_word: וְאַתָּה שָׁלוֹם
  choice: Paz para você
  rationale: A oração nominal expressa uma saudação ou desejo de bem-estar. A formulação concisa conserva a estrutura hebraica e inicia a repetição de שָׁלוֹם.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: paz para a sua casa
  rationale: “Casa” preserva a imagem hebraica e pode abranger tanto a residência como as pessoas que compõem a família ou unidade doméstica.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: e paz para tudo o que é seu
  rationale: A expressão estende a bênção a tudo o que pertence à pessoa ou está sob seus cuidados, sem restringi-la apenas aos bens materiais.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” é a correspondência tradicional e concisa, preserva a repetição do original e, neste contexto, inclui bem-estar, integridade e prosperidade, conforme esclarecido em nota.
theological_decisions:
- issue: Sentido da expressão obscura לֶחָי
  choice: Traduzir como a bênção “Vida longa para você” e registrar a dificuldade em nota
  alternative: “Ao vivente”, “À vida” ou simplesmente “Saudações”
  rationale: O contexto favorece uma saudação ou bênção, mas o hebraico admite mais de uma análise. A tradução oferece um sentido provável sem apresentar a interpretação como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a repetição tríplice de “paz”, central à forma do hebraico, e usa-se “casa” em sentido suficientemente amplo para incluir o lar e seus integrantes.
