  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָר֥וּךְ טַעְמֵ֖/ךְ וּ/בְרוּכָ֣ה אָ֑תְּ אֲשֶׁ֨ר כְּלִתִ֜/נִי הַ/יּ֤וֹם הַ/זֶּה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הֹשֵׁ֥עַ יָדִ֖/י לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: pt
  text: Bendito seja o seu discernimento[a], e bendita seja você, que hoje me impediu de chegar ao derramamento de sangue[b] e de me salvar com minhas próprias mãos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu bom senso” ou “o seu juízo”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “chegar a sangues”; a expressão também pode transmitir a ideia de incorrer em culpa de sangue.
    reason: lexical_alternative
  - marker: c
    text: Ou “de me vingar com minhas próprias mãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Bendito seja
  rationale: Conserva a fórmula exclamativa de bênção expressa pelo particípio passivo hebraico e soa natural em registro bíblico atual.
- source_word: טַעְמֵךְ
  choice: o seu discernimento
  rationale: טַעַם pode indicar discernimento, juízo ou bom senso. No contexto, Davi elogia a sensatez com que Abigail o fez recuar; “discernimento” comunica isso com clareza sem reduzir o termo à mera opinião.
- source_word: וּבְרוּכָה אָתְּ
  choice: e bendita seja você
  rationale: Reproduz a bênção dirigida pessoalmente a Abigail e mantém o paralelismo com a oração anterior, em português moderno e compreensível.
- source_word: אֲשֶׁר כְּלִתִנִי
  choice: que hoje me impediu
  rationale: O verbo neste contexto expressa impedir ou deter alguém de uma ação. “Impediu” liga-se naturalmente às duas construções seguintes.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Traduz de modo natural a expressão temporal enfática, sem perder sua referência imediata ao acontecimento daquele dia.
- source_word: מִבּוֹא בְדָמִים
  choice: de chegar ao derramamento de sangue
  rationale: Mantém a imagem verbal de “entrar/chegar” envolvida em בוא e traduz o plural idiomático דמים como derramamento de sangue; a possível nuance de culpa de sangue fica registrada em nota.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: e de me salvar com minhas próprias mãos
  rationale: Preserva o sentido lexical de ישׁע, “salvar/livrar”, e a imagem da própria mão. No contexto, a expressão aponta para obter reparação por vingança pessoal, interpretação indicada em nota sem substituir a formulação hebraica no texto principal.
theological_decisions:
- issue: דמים pode indicar tanto o ato de derramar sangue como a culpa resultante
  choice: derramamento de sangue
  alternative: culpa de sangue
  rationale: A ação violenta que Davi pretendia praticar está em primeiro plano, mas o possível sentido moral e jurídico de culpa não deve ser apagado; por isso, aparece em nota.
- issue: וְהֹשֵׁעַ יָדִי לִי pode ser entendido literalmente como salvar-se pela própria mão ou contextualmente como vingar-se
  choice: me salvar com minhas próprias mãos
  alternative: me vingar com minhas próprias mãos
  rationale: A tradução principal conserva a linguagem de salvação/livramento do hebraico e sua tensão irônica, enquanto a nota explicita o sentido contextual de vingança pessoal sem impor essa interpretação como única.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “Bendito... bendita...” preserva o paralelismo da bênção hebraica. A formulação principal mantém as imagens de chegar ao sangue e salvar-se pela própria mão, enquanto as notas registram sentidos contextuais legítimos sem resolver indevidamente as ambiguidades.
