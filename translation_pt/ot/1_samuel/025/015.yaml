  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: pt
  text: Mas aqueles homens foram muito bons conosco. Não fomos maltratados[a], nem demos falta de coisa alguma[b] durante todo o tempo em que andamos com eles, enquanto estávamos no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não fomos humilhados” ou “não sofremos insulto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nada desapareceu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Mas aqueles homens
  rationale: אֲנָשִׁים significa “homens”; o waw é vertido por “Mas” para expressar o contraste contextual com a avaliação hostil de Nabal, e “aqueles” retoma naturalmente os homens de Davi.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: foram muito bons conosco
  rationale: A construção טוֹב com לְ descreve conduta benéfica para com alguém. A formulação conserva a simplicidade e a intensidade do hebraico.
- source_word: הָכְלַמְנוּ
  choice: Não fomos maltratados
  rationale: A forma passiva comunica que eles não foram envergonhados, insultados ou tratados de modo abusivo. “Maltratados” transmite o sentido prático no contexto, enquanto a nota preserva alternativas mais formais.
- source_word: פָקַדְנוּ מְאוּמָה
  choice: nem demos falta de coisa alguma
  rationale: Com a negação e מְאוּמָה, פקד indica que nada foi percebido como ausente ou perdido. A expressão é idiomática e clara em português.
- source_word: כָּל יְמֵי
  choice: durante todo o tempo
  rationale: Expressa naturalmente em português a duração completa indicada literalmente por “todos os dias”.
- source_word: הִתְהַלַּכְנוּ אִתָּם
  choice: em que andamos com eles
  rationale: O Hitpael de הלך sugere movimento ou convivência contínua; “andamos com eles” preserva essa noção melhor do que simplesmente “estivemos com eles”.
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: enquanto estávamos no campo
  rationale: A oração temporal situa a convivência na região de pastagem ou campo aberto, mantendo a imagem do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A tradução mantém o contraste inicial, a passividade de הָכְלַמְנוּ e a ideia de que nenhuma posse se perdeu.
