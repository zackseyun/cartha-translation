  text: וַ/יַּ֨עַן נָבָ֜ל אֶת עַבְדֵ֤י דָוִד֙ וַ/יֹּ֔אמֶר מִ֥י דָוִ֖ד וּ/מִ֣י בֶן יִשָׁ֑י הַ/יּוֹם֙ רַבּ֣וּ עֲבָדִ֔ים הַ/מִּתְפָּ֣רְצִ֔ים אִ֖ישׁ מִ/פְּנֵ֥י אֲדֹנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: pt
  text: 'Nabal respondeu aos servos de Davi: “Quem é Davi? E quem é o filho de Jessé? Hoje em dia, muitos servos rompem com seus senhores[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Hoje em dia, multiplicaram-se os servos que rompem, cada um da presença de seu senhor”.'
    reason: A alternativa explicita o sentido de «multiplicaram-se» para רַבּוּ e conserva mais de perto a expressão espacial hebraica «da presença de seu senhor».
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 'respondeu ...:'
  rationale: A construção hebraica reúne “respondeu” e “disse”. Em português, introduzir a fala com dois-pontos preserva naturalmente a fórmula narrativa sem redundância artificial.
- source_word: עַבְדֵי דָוִד
  choice: servos de Davi
  rationale: “Servos” mantém a correspondência lexical com עבד e se ajusta aos mensageiros ou subordinados de Davi neste contexto.
- source_word: מִי דָוִד וּמִי בֶן יִשָׁי
  choice: Quem é Davi? E quem é o filho de Jessé?
  rationale: A repetição da pergunta preserva a retórica desdenhosa de Nabal, sem transformar a expressão em simples pedido de informação.
- source_word: הַיּוֹם
  choice: Hoje em dia
  rationale: Aqui o termo não indica apenas o dia corrente, mas introduz uma generalização sobre a época; “hoje em dia” é idiomático e claro.
- source_word: רַבּוּ עֲבָדִים
  choice: muitos servos
  rationale: רבו expressa que os servos se tornaram numerosos ou se multiplicaram. A formulação “muitos servos” transmite esse valor quantitativo de modo natural.
- source_word: הַמִּתְפָּרְצִים
  choice: rompem com
  rationale: O particípio hitpael de פרץ sugere desprender-se ou romper para fora. “Rompem com” comunica a separação deliberada sem explicitar uma rebelião formal.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: cada um com o seu senhor
  rationale: איש tem valor distributivo, e מִפְּנֵי indica afastamento da presença ou autoridade do senhor. Em português, “romper com” exige a preposição “com”; a nota registra a imagem espacial do hebraico.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: O termo designa aqui um superior humano. “Senhor” é natural em português para a relação social retratada, sem referência divina.
