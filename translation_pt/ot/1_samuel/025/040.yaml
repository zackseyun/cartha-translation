  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: pt
  text: 'Os servos de Davi foram até Abigail, no Carmelo, e lhe disseram: “Davi nos enviou para tomá-la como esposa dele[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para se casar com você”. Literalmente, “para tomar você para ele como esposa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: foram até
  rationale: O verbo בוא pode ser traduzido por “vir” ou “ir”, conforme o ponto de vista. “Foram até” expressa com naturalidade o deslocamento dos servos em direção a Abigail.
- source_word: עַבְדֵי דָוִד
  choice: os servos de Davi
  rationale: עֶבֶד pode designar servo, escravo ou oficial. Aqui se refere aos homens enviados por Davi, sem ênfase em condição de escravidão.
- source_word: הַכַּרְמֶלָה
  choice: no Carmelo
  rationale: A terminação direcional indica movimento rumo ao Carmelo; depois do verbo de chegada, o português expressa naturalmente o local onde Abigail estava como “no Carmelo”.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: e lhe disseram
  rationale: A fórmula hebraica de introdução da fala é vertida de modo idiomático e claro, sem reproduzir o redundante “falaram... dizendo”.
- source_word: שְׁלָחָנוּ
  choice: nos enviou
  rationale: O perfeito relata a ação já realizada que explica a presença dos emissários. O pretérito perfeito é natural em português.
- source_word: לְקַחְתֵּךְ לוֹ לְאִשָּׁה
  choice: para tomá-la por esposa
  rationale: A expressão com לקח e לְאִשָּׁה é uma fórmula matrimonial. “Tomá-la por esposa” mantém a imagem e a estrutura do hebraico, enquanto comunica claramente a intenção de casamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A fala direta conserva a formalidade própria de emissários que apresentam uma proposta de casamento.
