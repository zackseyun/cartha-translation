reference: 1 Samuel 25:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: pt
  text: Mas, tão certo como vive Yahweh, o Deus de Israel, que me impediu de fazer mal a você, se você não tivesse se apressado e vindo ao meu encontro, certamente, até o amanhecer, não teria restado a Nabal sequer um homem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “quem urina contra a parede”, expressão grosseira que significa “qualquer indivíduo do sexo masculino”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Marca o contraste discursivo e introduz a declaração solene de Davi de forma natural em português.
- source_word: חַי יְהוָה
  choice: tão certo como vive Yahweh
  rationale: Reproduz a força da fórmula hebraica de juramento em português corrente e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção que identifica Yahweh como o Deus de Israel.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: que me impediu
  rationale: O verbo indica impedir ou refrear; esta formulação liga-se naturalmente ao complemento seguinte.
- source_word: מֵהָרַע אֹתָךְ
  choice: de fazer mal a você
  rationale: Mantém a noção hebraica de praticar o mal contra Abigail sem restringi-la indevidamente a uma modalidade específica de dano.
- source_word: כִּי לוּלֵי
  choice: se ... não tivesse
  rationale: Expressa a condição contrafactual por meio da construção verbal natural em português.
- source_word: מִהַרְתְּ
  choice: você não tivesse se apressado
  rationale: Preserva a segunda pessoa feminina singular dirigida a Abigail e a relação contrafactual com o resultado.
- source_word: וַתָּבֹאתִי לִקְרָאתִי
  choice: e vindo ao meu encontro
  rationale: Traduz de modo idiomático a expressão hebraica comum para sair ou vir ao encontro de alguém.
- source_word: כִּי אִם
  choice: certamente
  rationale: Comunica a ênfase e a certeza da consequência apresentada na oração principal.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: até o amanhecer
  rationale: Equivalente natural da expressão literalmente relacionada à luz da manhã.
- source_word: מַשְׁתִּין בְּקִיר
  choice: sequer um homem
  rationale: O idioma grosseiro, literalmente 'quem urina contra a parede', designa os indivíduos do sexo masculino; a tradução comunica o referente e a nota preserva a forma concreta do original.
- source_word: לְנָבָל
  choice: a Nabal
  rationale: A preposição marca a relação com Nabal, isto é, os homens pertencentes à sua casa ou grupo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome divino em vez de substituí-lo por um título.
- issue: Agência divina e responsabilidade humana
  choice: Yahweh impediu Davi por meio da ação apressada de Abigail
  alternative: Atribuir a intervenção apenas a Abigail ou apenas a uma ação divina sem mediação
  rationale: A frase relativa atribui o impedimento a Yahweh, enquanto a condição subsequente reconhece a ação concreta de Abigail; a tradução conserva ambas as afirmações sem eliminar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A fórmula de juramento mantém solenidade; “fazer mal a você” conserva a amplitude moral e concreta do hebraico. A expressão grosseira do original é apresentada em nota para evitar estranheza no corpo do texto sem ocultar a evidência lexical.
