base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: pt
  text: Que Deus faça assim aos inimigos de Davi[a], e ainda mais, se eu deixar restar, até de manhã, sequer um homem[b] de todos os que lhe pertencem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns intérpretes entendem “aos inimigos de Davi” como um eufemismo de escriba em lugar de “a Davi” ou “a mim”, pois essa fórmula de juramento normalmente invoca uma maldição sobre quem fala.
    reason: textual_variant
  - marker: b
    text: 'Hebraico: “quem urina contra a parede”, expressão grosseira que significa “homem” ou “indivíduo do sexo masculino”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: Que Deus faça assim ... e ainda mais
  rationale: Reproduz de modo natural a fórmula hebraica de juramento e maldição, preservando sua força imprecatória sem uma repetição artificial em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo está no singular e o referente é Deus em uma fórmula de juramento.
- source_word: לְאֹיְבֵי דָוִד
  choice: aos inimigos de Davi
  rationale: Mantém a leitura do Texto Massorético, apesar da dificuldade contextual, sem corrigi-la silenciosamente para “a Davi” ou “a mim”.
- source_word: אִם
  choice: se
  rationale: Em juramentos, introduz a condição sobre a qual recai a maldição; “se” conserva a estrutura e a tensão do hebraico.
- source_word: אַשְׁאִיר
  choice: deixar restar
  rationale: Expressa o hifil de שׁאר, “deixar permanecer”, sem recorrer ao mais interpretativo “poupar”.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: de todos os que pertencem a ele
  rationale: O idioma subsequente especifica pessoas do sexo masculino; por isso, a formulação pessoal é mais clara que “de tudo o que é dele”.
- source_word: עַד הַבֹּקֶר
  choice: até amanhã
  rationale: No contexto noturno da narrativa, comunica naturalmente o limite temporal de “até a manhã”.
- source_word: מַשְׁתִּין בְּקִיר
  choice: sequer um homem
  rationale: O idiomatismo grosseiro designa um indivíduo do sexo masculino. A tradução comunica o referente com clareza, enquanto a expressão literal é registrada em nota.
theological_decisions:
- issue: A expressão massorética “aos inimigos de Davi” na fórmula de juramento
  choice: Manter “aos inimigos de Davi” no texto principal
  alternative: Entender a expressão como eufemismo ou alteração de escriba e traduzir “a Davi” ou “a mim”
  rationale: A fonte fornecida traz a leitura massorética. Sua dificuldade contextual é genuína e deve ser preservada no texto, com a interpretação alternativa indicada em nota, em vez de ser resolvida silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula de juramento conserva seu tom solene; “deixar restar sequer” mantém a intensidade da ameaça. Os marcadores foram vinculados às expressões que efetivamente explicam.
