  text: וַ/תְּמַהֵ֣ר אבוגיל וַ/תִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּ/שְׁנַ֣יִם נִבְלֵי יַ֗יִן וְ/חָמֵ֨שׁ צֹ֤אן עשוות וְ/חָמֵ֤שׁ סְאִים֙ קָלִ֔י וּ/מֵאָ֥ה צִמֻּקִ֖ים וּ/מָאתַ֣יִם דְּבֵלִ֑ים וַ/תָּ֖שֶׂם עַל הַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: pt
  text: Então Abigail se apressou e pegou duzentos pães, dois odres de vinho, cinco ovelhas já preparadas, cinco seás[a] de grãos torrados, cem cachos de passas e duzentos bolos de figos secos; e pôs tudo sobre os jumentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cinco medidas de grãos torrados”; o seá era uma antiga medida de capacidade para secos.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Então Abigail se apressou
  rationale: O verbo expressa pressa ou urgência. “Então” apresenta com naturalidade a sequência narrativa marcada pelo waw consecutivo.
- source_word: וַתִּקַּח
  choice: pegou
  rationale: Traduz diretamente לקח em português corrente e introduz de modo natural a lista de provisões.
- source_word: מָאתַיִם לֶחֶם
  choice: duzentos pães
  rationale: Embora לֶחֶם possa significar “pão” coletivamente, o numeral exige aqui unidades contáveis; “duzentos pães” é claro e natural.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: dois odres de vinho
  rationale: נֵבֶל designa aqui um recipiente antigo para líquidos, provavelmente feito de pele. “Odres” evita recipientes modernos anacrônicos.
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: cinco ovelhas já preparadas
  rationale: O particípio indica que os animais haviam sido preparados para servir de alimento, sem especificar se estavam apenas abatidos, limpos ou cozidos.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: cinco seás de grãos torrados
  rationale: סְאָה é uma medida antiga de capacidade para secos; a transliteração preserva a unidade específica, explicada em nota. קָלִי refere-se a cereal torrado.
- source_word: מֵאָה צִמֻּקִים
  choice: cem cachos de passas
  rationale: צִמֻּקִים refere-se a passas. Como o item é contado em centenas no contexto de provisões, “cachos de passas” comunica agrupamentos ou porções prensadas sem confundi-los com os bolos de figos seguintes.
- source_word: מָאתַיִם דְּבֵלִים
  choice: duzentos bolos de figos secos
  rationale: דְּבֵלָה designa uma porção ou massa de figos secos prensados; “bolos de figos secos” expressa sua forma e composição.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: e pôs tudo sobre os jumentos
  rationale: Mantém o sentido básico de “pôr/colocar”. “Tudo” retoma naturalmente as provisões enumeradas, e “sobre os jumentos” conserva a imagem do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. Mantêm-se os elementos culturais antigos “odres” e “seás”, sendo este último explicado em nota.
