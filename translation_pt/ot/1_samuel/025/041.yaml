base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your slave is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: pt
  text: 'Ela se levantou, prostrou-se com o rosto em terra[a] e disse: “Aqui está a sua serva, como escrava[b], para lavar os pés dos servos do meu senhor”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inclinou-se profundamente, com o rosto no chão”. O hebraico descreve uma postura de profunda reverência.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico usa aqui dois termos próximos para uma mulher em condição de servidão: “serva” e “escrava”. Também se pode traduzir mais literalmente: “a sua serva, como escrava, para lavar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Ela se levantou
  rationale: O qal consecutivo de קום dá continuidade direta à narrativa; “levantou-se” é natural e exato em português.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: prostrou-se com o rosto em terra
  rationale: A expressão descreve uma reverência profunda, com o rosto voltado ao chão. “Prostrou-se” comunica a postura física sem reduzir o gesto a uma simples inclinação.
- source_word: הִנֵּה
  choice: Aqui está
  rationale: A interjeição apresenta Abigail a si mesma em atitude de disponibilidade e submissão. “Aqui está” soa atual e digna, sendo mais natural no contexto do que o arcaizante “eis”.
- source_word: אֲמָתְךָ
  choice: a sua serva
  rationale: אָמָה designa uma serva ou escrava. Na fórmula deferente de autorreferência, “sua serva” preserva o gênero e soa natural em português.
- source_word: לְשִׁפְחָה
  choice: para servir como escrava
  rationale: שִׁפְחָה é um segundo termo feminino de servidão. A formulação distingue os dois vocábulos hebraicos e expressa a intensificação da humildade de Abigail, evitando a construção pouco natural “sua serva é uma escrava”.
- source_word: לִרְחֹץ רַגְלֵי
  choice: e lavar os pés
  rationale: O infinitivo expressa a finalidade concreta do serviço humilde. A coordenação com “servir” produz português natural sem perder a relação de propósito.
- source_word: עַבְדֵי אֲדֹנִי
  choice: dos servos do meu senhor
  rationale: עֶבֶד refere-se aqui aos homens que servem a Davi, e אֲדֹנִי é um título respeitoso. “Servos” e “meu senhor” preservam o registro social e cortês.
theological_decisions:
- issue: Distinção entre os termos femininos de servidão אָמָה e שִׁפְחָה
  choice: “sua serva, para servir como escrava”
  alternative: “sua serva, como serva” ou “sua escrava é uma serva”
  rationale: O hebraico emprega dois termos próximos, mas distintos, na autodescrição de Abigail. A tradução mantém a diferença e o rebaixamento retórico sem impor uma hierarquia técnica entre os termos além do que o contexto permite.
- issue: Natureza do gesto de וַתִּשְׁתַּחוּ
  choice: “prostrou-se com o rosto em terra”
  alternative: “inclinou-se até o chão”
  rationale: O complemento “com o rosto em terra” indica profunda deferência física. A tradução descreve o gesto social de submissão sem lhe atribuir necessariamente sentido de adoração religiosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a forte deferência social de Abigail. “Aqui está” evita arcaísmo excessivo; “meu senhor” conserva o tratamento respeitoso, sem identificar o título como referência divina.
