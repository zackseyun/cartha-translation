  naturalness: O registro é adequadamente digno e claro. A substituição de «aos seus ouvidos» por «ao senhor» torna o pedido natural em português contemporâneo, sem alterar sua força comunicativa; o imperativo seguinte continua a expressar explicitamente o pedido para que Davi escute.
  terminology: «Meu senhor» preserva a deferência social sem sugerir um título divino. «Serva» é a escolha apropriada para a auto-humilhação feminina de Abigail e deve ser mantida nas duas ocorrências.
