base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: pt
  text: 'Ela caiu aos pés dele e disse: “A culpa é minha[a], meu senhor. Por favor, permita que sua serva[b] fale ao senhor e ouça as palavras da sua serva.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Sobre mim, meu senhor, a culpa”, expressão concisa pela qual Abigail assume a culpa ou a responsabilidade.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “serva” é especificamente feminino e expressa a maneira humilde como Abigail se dirige a Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: Ela caiu aos pés dele
  rationale: Reproduz com naturalidade o gesto de súplica e submissão expresso literalmente por ‘cair sobre os pés dele’, sem intensificá-lo como se ela tivesse se lançado ao chão.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: A culpa é minha, meu senhor
  rationale: A frase hebraica é compacta e enfática, atribuindo a culpa à própria Abigail. A formulação portuguesa comunica claramente essa autoatribuição sem acrescentar que ela fosse de fato culpada.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Expressa a deferência social de Abigail para com Davi, sem confundir o título com uma referência ao Senhor Deus.
- source_word: וּתְדַבֶּר נָא
  choice: Por favor, permita que ... fale
  rationale: O pedido com נָא é cortês; em português, a construção permissiva explicita de modo natural a súplica dirigida a Davi.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: sua serva
  rationale: O substantivo hebraico é especificamente feminino. ‘Sua serva’ preserva tanto o gênero quanto o modo humilde pelo qual Abigail se apresenta, e a repetição mantém a ênfase do hebraico.
- source_word: בְּאָזְנֶיךָ
  choice: aos seus ouvidos
  rationale: Mantém a imagem concreta do hebraico, que significa falar de modo que Davi ouça, e continua inteligível em português formal.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: e ouça as palavras de
  rationale: Conserva o imperativo e a referência explícita às ‘palavras’, preservando o tom formal da súplica.
theological_decisions:
- issue: A autoatribuição da culpa por Abigail
  choice: 'Traduzir como declaração de culpa assumida no discurso: ‘A culpa é minha’'
  alternative: Que a culpa recaia sobre mim
  rationale: O hebraico permite entender a expressão como Abigail tomando sobre si a responsabilidade, mas o versículo não determina se ela confessa culpa moral pessoal ou se assume retoricamente a responsabilidade para interceder. A tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Meu senhor’ e ‘sua serva’ preservam a deferência social do diálogo; ‘aos seus ouvidos’ conserva deliberadamente a imagem hebraica, embora seja um pouco mais formal que ‘em sua presença’.
