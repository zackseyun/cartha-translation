  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: pt
  text: Então os jovens de Davi deram meia-volta, voltaram pelo caminho e, quando chegaram, contaram-lhe todas essas palavras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas essas coisas”. A palavra hebraica pode referir-se tanto a palavras faladas como a coisas ou assuntos; aqui, “palavras” é preferível porque os jovens relatam a resposta de Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: deram meia-volta
  rationale: Neste contexto, הפך indica uma mudança de direção. “Deram meia-volta” comunica isso com naturalidade, sem sugerir o sentido literal de virar ou derrubar algo.
- source_word: נַעֲרֵי דָוִד
  choice: os jovens de Davi
  rationale: נַעַר pode designar um jovem, ajudante ou servo. “Os jovens de Davi” preserva o sentido lexical sem definir de modo indevido a posição social deles.
- source_word: לְדַרְכָּם
  choice: pelo mesmo caminho
  rationale: A expressão hebraica, literalmente “para o caminho deles”, indica que retomaram a rota pela qual haviam vindo. “Pelo mesmo caminho” torna essa ideia clara em português.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ
  choice: retornaram ... e, quando chegaram
  rationale: A formulação mantém os dois movimentos da sequência hebraica — voltar e chegar — mas os expressa de maneira fluente e não redundante em português.
- source_word: וַיַּגִּדוּ לוֹ
  choice: contaram-lhe
  rationale: נגד, nesta construção, significa contar ou relatar. “Contaram-lhe” é claro, atual e adequado ao registro narrativo.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: todas essas palavras
  rationale: דְּבָרִים pode significar “palavras” ou “coisas/assuntos”. Como o relato diz respeito à resposta verbal de Nabal, “palavras” preserva melhor o foco imediato, enquanto a alternativa é registrada em nota.
