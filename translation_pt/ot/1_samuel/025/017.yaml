  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: pt
  text: Agora, saiba disso e pense bem no que deve fazer, pois a desgraça está decidida contra o nosso senhor e contra toda a sua casa. Ele é um homem tão desprezível[a] que ninguém consegue falar com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “filho da indignidade”; tradicionalmente, “filho de Belial”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz com naturalidade a transição urgente na fala do servo.
- source_word: דְּעִי וּרְאִי
  choice: saiba disso e pense bem
  rationale: Os imperativos femininos são dirigidos a Abigail. O sentido literal de ראה, “ver”, neste contexto é deliberativo; “pense bem” comunica a necessidade de avaliar a situação.
- source_word: מַה תַּעֲשִׂי
  choice: no que deve fazer
  rationale: O imperfeito apresenta a ação a ser considerada; “deve fazer” transmite a urgência prática sem convertê-la numa ordem explícita.
- source_word: כָלְתָה הָרָעָה
  choice: a desgraça já está decidida
  rationale: A expressão indica que o dano iminente está resolvido ou se tornou certo. “Desgraça” comunica a calamidade prevista, e “já está decidida” preserva o caráter determinado do resultado.
- source_word: אֶל אֲדֹנֵינוּ
  choice: contra o nosso senhor
  rationale: A preposição indica aqui direção hostil. “Senhor” é uma forma corrente e digna de designar o chefe da casa no contexto narrativo.
- source_word: וְעַל כָּל בֵּיתוֹ
  choice: e contra toda a sua casa
  rationale: “Casa” preserva a imagem hebraica e, no contexto, abrange a família, os servos e os demais integrantes da casa de Nabal.
- source_word: וְהוּא בֶּן בְּלִיַּעַל
  choice: Ele é um homem tão desprezível
  rationale: A expressão idiomática caracteriza alguém moralmente vil e intratável. “Homem desprezível” transmite o sentido sem tratar Belial como nome próprio, o que o contexto não exige.
- source_word: מִדַּבֵּר אֵלָיו
  choice: que ninguém consegue falar com ele
  rationale: 'A construção expressa a consequência do caráter de Nabal: é impossível abordá-lo ou argumentar com ele. A formulação mantém o sujeito genérico.'
theological_decisions:
- issue: Sentido de בְּלִיַּעַל
  choice: homem desprezível
  alternative: filho de Belial
  rationale: Aqui בְּלִיַּעַל integra uma expressão idiomática para uma pessoa vil ou sem valor; vertê-la como nome próprio poderia introduzir uma referência demonológica não exigida pelo texto.
- issue: Alcance de בֵּיתוֹ
  choice: toda a sua casa
  alternative: todos os da sua casa
  rationale: Mantém-se a metáfora hebraica, que no contexto pode incluir tanto o grupo doméstico quanto tudo o que está sob a autoridade de Nabal, sem restringir indevidamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pense bem” torna natural o valor deliberativo de “ver”, e “toda a sua casa” conserva a amplitude e a imagem do hebraico.
