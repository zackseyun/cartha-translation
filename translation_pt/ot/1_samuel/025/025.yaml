base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: pt
  text: 'Por favor, meu senhor, não leve a sério esse homem indigno, Nabal, pois ele é como o seu nome: Nabal é o seu nome, e a insensatez está com ele.[a] Eu, porém, sua serva, não vi os jovens que meu senhor enviou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome «Nabal» soa como a palavra hebraica relacionada a «insensato» ou «insensatez»; Abigail faz aqui um jogo de palavras intencional.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Por favor
  rationale: Expressa de modo natural o pedido enfático e cortês introduzido por אַל נָא.
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: leve a sério
  rationale: O hebraísmo descreve voltar o coração ou a atenção para alguém; em português atual, «levar a sério» comunica bem a advertência para não dar importância a Nabal.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: homem indigno
  rationale: בְּלִיַּעַל caracteriza aqui a vileza ou falta de valor moral do homem, sem funcionar como nome próprio.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: pois ele é como o seu nome
  rationale: Preserva a estrutura proverbial e a ligação explícita entre o nome de Nabal e seu caráter.
- source_word: נָבָל ... וּנְבָלָה
  choice: Nabal ... insensatez
  rationale: Mantém o nome pessoal transliterado e representa por «insensatez» o jogo de palavras hebraico, explicado na nota.
- source_word: אֲמָתְךָ
  choice: sua serva
  rationale: Preserva tanto o gênero feminino quanto a fórmula humilde de autodesignação de Abigail, com naturalidade em português.
- source_word: נַעֲרֵי
  choice: os jovens
  rationale: Traduz o sentido lexical direto, adequado aos jovens enviados por Davi no contexto.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Reproduz o tratamento respeitoso dirigido por Abigail a Davi.
