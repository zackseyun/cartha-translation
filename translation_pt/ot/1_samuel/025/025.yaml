  source_fidelity: O texto representa com fidelidade a súplica cortês de Abigail (אַל־נָא), o idiomatismo de não dar consideração a Nabal, a caracterização depreciativa de אִישׁ הַבְּלִיַּעַל, a formulação proverbial que associa nome e caráter, e a autodesignação feminina e humilde de Abigail. «A insensatez está com ele» preserva de modo deliberadamente próximo a construção hebraica וּנְבָלָה עִמּוֹ, sem resolver além do necessário a amplitude de «folly/disgraceful conduct».
