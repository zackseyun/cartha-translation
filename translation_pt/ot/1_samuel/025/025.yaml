  terminology: «Nabal» é corretamente mantido como nome próprio. «Homem indigno» transmite a avaliação moral de «homem de belial» sem tratar Belial como nome próprio. «Insensatez» permite conservar o jogo verbal com Nabal, que a nota explica de forma suficiente. «Meu senhor», «sua serva» e «os jovens» estão de acordo com o hebraico e com o contexto narrativo.
