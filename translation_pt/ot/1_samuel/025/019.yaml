base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: pt
  text: 'Ela disse aos seus servos: “Vão adiante de mim. Eu vou atrás de vocês.”[a] Mas não contou a Nabal, seu marido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que venho atrás de vocês.”'
    reason: Preserva de modo mais formal o valor de הִנְנִי e o aspecto participial de בָּאָה.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ela disse
  rationale: O wayyiqtol dá continuidade à narrativa; em português, a sequência fica natural sem explicitar a conjunção.
- source_word: לִנְעָרֶיהָ
  choice: aos seus servos
  rationale: נַעַר pode designar um jovem, servo ou assistente. Neste contexto, refere-se aos homens encarregados de levar as provisões; “servos” comunica com clareza sua função sem exigir que se enfatize a idade.
- source_word: עִבְרוּ לְפָנַי
  choice: Vão adiante de mim
  rationale: A combinação expressa movimento para uma posição à frente da pessoa que fala. A formulação é natural e preserva a relação espacial.
- source_word: הִנְנִי אַחֲרֵיכֶם בָּאָה
  choice: Eu vou logo atrás de vocês
  rationale: הִנְנִי chama atenção para a ação da própria Abigail, e a construção seguinte indica que ela os seguirá. “Logo” ajuda a transmitir a prontidão e o relevo discursivo sem tornar a frase arcaica; a alternativa mais formal é registrada em nota.
- source_word: וּלְאִישָׁהּ נָבָל לֹא הִגִּידָה
  choice: Mas não contou isso a Nabal, seu marido
  rationale: A conjunção introduz contraste entre o que Abigail disse aos servos e o que ocultou do marido. אִישָׁהּ significa “seu marido” neste contexto, e הִגִּידָה é expresso naturalmente por “contou”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Eis que” foi reservado à nota por ser uma reprodução mais formal do deítico hebraico.
