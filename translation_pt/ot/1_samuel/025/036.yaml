revisions:
- from: Quando Abigail chegou até Nabal, eis que ele dava em sua casa um banquete digno de rei. Nabal estava com o coração alegre e muito bêbado. Por isso, ela não lhe contou absolutamente nada, nem pequeno nem grande,[a] até a luz da manhã.[b]
  to: Quando Abigail foi até Nabal, eis que ele dava em sua casa um banquete como o banquete de um rei. O coração de Nabal estava alegre, e ele estava muito bêbado. Por isso, ela não lhe contou absolutamente nada, nem coisa pequena nem grande,[a] até a luz da manhã.[b]
  rationale: A revisão elimina a interpretação acrescentada por «digno de rei», restituindo a comparação explícita com um banquete real. Também explicita a estrutura hebraica que distingue o coração alegre de Nabal de sua embriaguez, preservando ao mesmo tempo um português moderno e natural. As notas permanecem semanticamente adequadas e com as âncoras corretas.
