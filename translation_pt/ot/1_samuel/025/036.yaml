  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção “eis que” preserva o relevo narrativo do hebraico; “com o coração alegre” mantém a imagem antropológica original sem soar excessivamente literal.
