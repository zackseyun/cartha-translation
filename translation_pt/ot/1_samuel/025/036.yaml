base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: pt
  text: Quando Abigail foi até Nabal, eis que ele dava em sua casa um banquete como o banquete de um rei. O coração de Nabal estava alegre, e ele estava muito bêbado. Por isso, ela não lhe contou absolutamente nada, nem coisa pequena nem grande,[a] até a luz da manhã.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pequeno e grande”, expressão que significa “absolutamente nada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até o raiar do dia”. Hebraico: “até a luz da manhã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Quando Abigail chegou
  rationale: A forma narrativa faz a ação avançar e, neste contexto, introduz naturalmente a circunstância temporal do que Abigail encontrou ao chegar.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a função dêitica e cênica da interjeição hebraica, chamando atenção para a situação encontrada por Abigail.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: O substantivo indica uma festa ou banquete, frequentemente acompanhado de bebida. “Banquete” combina naturalmente com a comparação régia, enquanto a embriaguez é explicitada em seguida.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: um banquete digno de rei
  rationale: Expressa de modo natural em português a comparação hebraica com a fartura e a ostentação de um banquete real, sem sugerir que se tratava do banquete de um rei específico.
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: Nabal estava com o coração alegre
  rationale: Conserva a imagem hebraica do coração e comunica em português corrente o estado de euforia de Nabal, sem reduzir a expressão apenas à embriaguez.
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: e muito bêbado
  rationale: Tradução direta e clara do adjetivo com seu intensificador; mantém o grau elevado da embriaguez em linguagem moderna.
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: absolutamente nada, nem pequeno nem grande
  rationale: Torna explícito o sentido negativo total do merismo e, ao mesmo tempo, conserva a dupla expressão hebraica “pequeno e grande”.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: até a luz da manhã
  rationale: Preserva a imagem literal do hebraico, permanecendo compreensível e digna em português; “até o raiar do dia” seria uma alternativa idiomática.
