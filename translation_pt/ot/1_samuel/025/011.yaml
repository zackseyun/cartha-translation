base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: pt
  text: Acaso vou pegar o meu pão, a minha água e a carne que abati para os tosquiadores[a] e dar tudo isso a homens que não conheço nem sei de onde são?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os trabalhadores que tosquiavam as ovelhas.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “E tomarei... e darei?”, pois o hebraico usa formas verbais perfeitas numa pergunta retórica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Acaso vou pegar
  rationale: O qatal com conjunção ocorre aqui numa pergunta retórica indignada. A formulação expressa em português natural a ideia deliberativa sem transformar a declaração em futuro simples.
- source_word: לַחְמִי וְאֶת־מֵימַי
  choice: o meu pão, a minha água
  rationale: Mantém os substantivos concretos e a repetição possessiva, que destaca a atitude egoísta de Nabal.
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: a carne que abati
  rationale: Traduz o produto do abate de modo natural e preserva o verbo da mesma raiz, embora a repetição etimológica hebraica não possa ser reproduzida integralmente sem artificialidade.
- source_word: לְגֹזְזָי
  choice: para os tosquiadores
  rationale: Designa os trabalhadores que tosquiavam as ovelhas; o contexto supre o objeto da tosquia.
- source_word: וְנָתַתִּי
  choice: e dar tudo isso
  rationale: A expressão retoma coletivamente pão, água e carne, tornando explícito em português o objeto implícito no hebraico.
- source_word: לַאֲנָשִׁים
  choice: a homens
  rationale: Preserva o plural masculino e o tom de distanciamento de Nabal.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה
  choice: que nem sei de onde são
  rationale: Formulação idiomática e atual que comunica tanto o alegado desconhecimento quanto a origem desconhecida dos homens.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Acaso” conserva o tom retórico e indignado; “tosquiadores” é preciso e recebe explicação cultural. A ordem das notas segue a ocorrência dos marcadores no texto.
