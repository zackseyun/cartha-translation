base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: pt
  text: Davi ouviu, no deserto, que Nabal estava tosquiando suas ovelhas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais abrangente, “seu rebanho”. O termo hebraico pode designar coletivamente animais de pequeno porte, embora “ovelhas” se ajuste melhor ao contexto da tosquia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O imperfeito consecutivo de שׁמע relata aqui um acontecimento passado simples. “Ouviu” é direto e preserva o modo pelo qual Davi recebeu a informação, sem explicitar a inferência “soube”.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma ou pouco habitada, não necessariamente arenosa. “No deserto” é a expressão bíblica corrente e natural em português, indicando onde Davi estava ao receber a notícia.
- source_word: כִּי
  choice: que
  rationale: כִּי introduz o conteúdo do que Davi ouviu; por isso, a conjunção portuguesa “que” corresponde naturalmente à sintaxe.
- source_word: גֹזֵז
  choice: estava tosquiando
  rationale: O particípio indica uma ação em andamento ou contemporânea à notícia. “Estava tosquiando” preserva esse aspecto.
- source_word: נָבָל
  choice: Nabal
  rationale: O nome próprio é transliterado segundo a forma tradicional em português, sem traduzir seu possível significado lexical.
- source_word: אֶת צֹאנוֹ
  choice: suas ovelhas
  rationale: צֹאן pode designar coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. No contexto de tosquia, “ovelhas” é a opção mais natural e específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente pontuada para evitar que “no deserto” pareça modificar Nabal ou a tosquia, preservando-o como indicação do lugar onde Davi recebeu a notícia.
