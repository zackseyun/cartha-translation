  text: וְ/שָׁא֗וּל נָתַ֛ן אֶת מִיכַ֥ל בִּתּ֖/וֹ אֵ֣שֶׁת דָּוִ֑ד לְ/פַלְטִ֥י בֶן לַ֖יִשׁ אֲשֶׁ֥ר מִ/גַּלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: pt
  text: Saul tinha dado Mical, sua filha, esposa de Davi, a Palti[a], filho de Laís, que era de Galim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Palti. Em 2 Samuel 3:15, ele é chamado Paltiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: Saul, porém
  rationale: O ו liga a oração ao contexto e, aqui, introduz um contraste com a informação anterior sobre as mulheres de Davi. “Porém” expressa essa relação discursiva sem acrescentar um marcador temporal.
- source_word: נָתַן
  choice: tinha dado
  rationale: O perfeito hebraico relata uma ação já concluída em relação ao fio narrativo; o mais-que-perfeito composto comunica com naturalidade que Saul já havia entregue Mical.
- source_word: מִיכַל בִּתּוֹ
  choice: Mical, sua filha
  rationale: Mantém a aposição direta do hebraico e usa a forma portuguesa corrente do nome.
- source_word: אֵשֶׁת דָּוִד
  choice: mulher de Davi
  rationale: Reproduz a expressão de estado conjugal sem explicar ou suavizar a tensão criada pelo fato de Saul tê-la dado a outro homem.
- source_word: לְפַלְטִי
  choice: a Palti
  rationale: Translitera diretamente a forma hebraica פַלְטִי e emprega a preposição portuguesa exigida pelo verbo “dar”.
- source_word: בֶן לַיִשׁ
  choice: filho de Laís
  rationale: Tradução natural da fórmula patronímica hebraica.
- source_word: אֲשֶׁר מִגַּלִּים
  choice: que era de Galim
  rationale: Expressa com clareza a procedência indicada pela preposição מִן e preserva o valor da oração relativa.
theological_decisions:
- issue: A condição conjugal de Mical depois de Saul entregá-la a Palti
  choice: manter “mulher de Davi” como aposição direta
  alternative: explicar como “que tinha sido mulher de Davi” ou “ex-mulher de Davi”
  rationale: O hebraico a chama de אֵשֶׁת דָּוִד, “mulher de Davi”, sem resolver a situação jurídica ou teológica. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas de boa legibilidade brasileira. A ordem apositiva foi preservada para manter a concisão e a tensão do hebraico.
