revisions:
- from: 'E isto não será para você motivo de remorso[a] nem tropeço para o coração[b] de meu senhor: ter derramado sangue sem motivo ou meu senhor ter feito justiça com as próprias mãos[c]. E, quando Yahweh fizer o bem a meu senhor, lembre-se de sua serva[d].'
  to: 'E isto não será para meu senhor motivo de remorso[a] nem motivo de tropeço para o coração[b]: nem por ter derramado sangue sem motivo nem por meu senhor ter buscado reparação por si mesmo[c]. E, quando Yahweh fizer o bem a meu senhor, lembre-se de sua serva[d].'
  rationale: A revisão resolve a oscilação referencial e melhora a fluência sem abandonar o registro respeitoso. Mantém-se «motivo de remorso» como leitura contextual prudente de um termo raro; a metáfora de «tropeço do coração» permanece visível no texto e explícita em nota. A cláusula sobre Davi evita transformar «salvar-se a si mesmo» em uma afirmação judicial inequívoca, enquanto a nota registra tanto a formulação literal quanto a leitura contextual de autovindicação.
