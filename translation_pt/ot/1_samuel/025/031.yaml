base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: pt
  text: 'E isto não será para meu senhor motivo de remorso[a] nem motivo de tropeço para o coração[b]: nem por ter derramado sangue sem motivo nem por meu senhor ter buscado reparação por si mesmo[c]. E, quando Yahweh fizer o bem a meu senhor, lembre-se de sua serva[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e também pode indicar uma causa de abalo, pesar ou doloroso arrependimento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tropeço do coração”.
    reason: literal_rendering
  - marker: c
    text: Literalmente, “meu senhor ter salvado a si mesmo”. No contexto, a expressão pode referir-se a Davi obter reparação ou vingança por conta própria.
    reason: lexical_alternative
  - marker: d
    text: A expressão hebraica é feminina e constitui a autodesignação humilde de Abigail.
    reason: lexical_clarification
lexical_decisions:
- source_word: לְפוּקָה
  choice: motivo de remorso
  rationale: O substantivo raro parece indicar algo que posteriormente causa abalo, pesar ou doloroso arrependimento. “Motivo de remorso” comunica a consequência moral futura no contexto, sem apagar a incerteza lexical, registrada em nota.
- source_word: מִכְשׁוֹל לֵב
  choice: tropeço para o coração
  rationale: Preserva a metáfora hebraica de um obstáculo interior ou peso de consciência, numa formulação compreensível em português atual.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: meu senhor
  rationale: Reproduz o tratamento respeitoso e deferente de Abigail a Davi sem sugerir referência divina.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: ter derramado sangue sem motivo
  rationale: חִנָּם indica aqui falta de causa ou justificativa. A formulação exprime de modo conciso o derramamento injustificado de sangue.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: meu senhor ter feito justiça com as próprias mãos
  rationale: Embora יָשַׁע normalmente signifique salvar ou livrar, a construção reflexiva no contexto aponta para Davi obter por si mesmo sua reparação mediante violência. A tradução natural explicita essa ideia, mantendo em nota a leitura mais literal.
- source_word: וְהֵיטִב יְהוָה
  choice: quando Yahweh fizer o bem
  rationale: A sequência verbal tem referência futura no discurso de Abigail e funciona naturalmente como oração temporal em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲמָתֶךָ
  choice: sua serva
  rationale: O substantivo é feminino e constitui a autodesignação humilde de Abigail; “sua serva” preserva tanto o gênero quanto a deferência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de לְהוֹשִׁיעַ ... לוֹ no contexto da vingança
  choice: ter feito justiça com as próprias mãos
  alternative: ter salvado a si mesmo; ter vingado a si mesmo
  rationale: A tradução comunica a ação autônoma e violenta que Abigail procura impedir, sem pressupor que toda busca de justiça seja vingança ilegítima; a ambiguidade do verbo é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “meu senhor” mantém a deferência social do discurso de Abigail. A metáfora “tropeço para o coração” foi preservada, enquanto a expressão idiomática sobre salvar a si mesmo foi vertida de forma contextual e acompanhada de nota.
