  terminology: «Yahweh», «meu senhor» e «sua serva» são apropriados. «Feito justiça com as próprias mãos» pode sugerir uma avaliação jurídica mais definida do que o hebraico «salvar-se a si mesmo»; «buscado reparação por si mesmo» mantém a aplicação contextual e deixa a nota explicitar a alternativa literal.
