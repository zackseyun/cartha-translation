  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: pt
  text: Samuel morreu, e todo o Israel se reuniu e o pranteou[a]. Eles o sepultaram em sua casa[b], em Ramá. Então Davi se levantou e desceu para o deserto de Parã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico se refere ao pranto ou aos ritos de lamento pelos mortos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «junto à sua casa»; a expressão pode indicar a propriedade associada à casa, não necessariamente o interior da residência.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: Samuel morreu
  rationale: Traduz diretamente o verbo «morrer»; o waw consecutivo faz avançar a narrativa, sem exigir um marcador temporal explícito em português.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: todo o Israel se reuniu
  rationale: Preserva a expressão coletiva nacional כָל יִשְׂרָאֵל e traduz naturalmente a forma nifal de קבץ.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: o pranteou
  rationale: ספד designa o lamento ou pranto pelos mortos, inclusive seus ritos públicos; «pranteou» conserva esse sentido específico com registro digno.
- source_word: וַיִּקְבְּרֻהוּ
  choice: Eles o sepultaram
  rationale: Tradução direta do verbo com o sufixo de objeto; «sepultaram» é claro e adequado ao contexto funerário.
- source_word: בְּבֵיתוֹ
  choice: em sua casa
  rationale: Mantém a formulação concreta e ambígua do hebraico, sem decidir no texto principal se o sepultamento ocorreu dentro da residência ou na propriedade ligada à casa.
- source_word: בָּרָמָה
  choice: em Ramá
  rationale: Emprega a preposição locativa natural e a transliteração portuguesa tradicional do topônimo.
- source_word: וַיָּקָם
  choice: Então Davi se levantou
  rationale: Preserva o verbo de movimento e sua função de introduzir a ação seguinte; «Então» expressa naturalmente a progressão narrativa.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: desceu para o deserto de Parã
  rationale: Mantém o sentido topográfico de ירד e traduz מִדְבָּר por «deserto», termo corrente em português para essa região erma, sem pressupor necessariamente um mar de areia.
