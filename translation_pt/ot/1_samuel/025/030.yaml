  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: pt
  text: E, quando Yahweh tiver feito por meu senhor tudo o que de bom falou a seu respeito[a] e tiver nomeado você líder sobre Israel[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o bem que prometeu a você”. Literalmente, o hebraico diz “o bem” que Yahweh falou a respeito de Davi.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tiver encarregado você de ser líder sobre Israel”. O verbo pode significar “ordenar”, mas aqui provavelmente tem o sentido de nomear ou comissionar para governar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Reproduz a fórmula hebraica que introduz uma situação futura, mantendo a ligação sintática com o versículo seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לַאדֹנִי
  choice: por meu senhor
  rationale: Preserva a forma respeitosa com que Abigail se dirige a Davi; a preposição pertence ao que Yahweh fará em benefício dele.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: todo o bem que falou a seu respeito
  rationale: Mantém o verbo genérico 'falar' e a expressão substantivada 'o bem', sem explicitar além do hebraico a ideia contextual de promessa.
- source_word: וְצִוְּךָ לְנָגִיד
  choice: e tiver nomeado você líder
  rationale: Neste complemento de função, צוה pode indicar designação ou comissão para o cargo; 'líder' comunica a autoridade de נָגִיד sem o tom monárquico mais específico de 'príncipe'.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: A preposição indica exercício de autoridade sobre o povo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz o nome próprio divino; 'Yahweh' conserva essa distinção e é uma transliteração amplamente reconhecida.
- issue: Sentido de וְצִוְּךָ no contexto da liderança de Davi
  choice: tiver nomeado você
  alternative: tiver ordenado a você que fosse
  rationale: O verbo costuma significar 'ordenar', mas, com לְנָגִיד, pode expressar comissão ou designação para uma função. A alternativa literal permanece indicada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas amplamente compreensíveis no Brasil. A oração permanece incompleta, como no hebraico, pois continua no versículo seguinte. Emprega-se 'você' em referência a Davi para evitar a ambiguidade de 'o senhor' junto ao vocativo 'meu senhor'.
