base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: pt
  text: E agora soube que estão tosquiando suas ovelhas. Agora, seus pastores estiveram conosco; não os maltratamos[a], e nada do que era deles se perdeu durante todo o tempo em que estiveram no Carmelo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “não os humilhamos”. O verbo hebraico pode indicar causar vergonha ou desonra; neste contexto, refere-se a não prejudicar nem maltratar os pastores de Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto o conectivo hebraico quanto a transição temporal que introduz o apelo de Davi.
- source_word: שָׁמַעְתִּי
  choice: soube
  rationale: O perfeito hebraico relata uma informação recebida recentemente e ainda relevante; em português, “soube” é natural nesse contexto.
- source_word: גֹזְזִים לָךְ
  choice: estão tosquiando suas ovelhas
  rationale: A construção participial com dativo indica que a tosquia de Nabal está em andamento. “Suas ovelhas” explicita apenas o objeto necessariamente implícito no verbo, de maneira natural em português.
- source_word: עַתָּה
  choice: Pois bem
  rationale: A segunda ocorrência funciona como marcador de retomada e aplicação imediata. “Pois bem” preserva a progressão retórica sem a repetição pouco natural de “agora”.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: seus pastores
  rationale: Expressa de forma idiomática a relação possessiva indicada pelo hebraico.
- source_word: הָיוּ עִמָּנוּ
  choice: estiveram conosco
  rationale: Mantém a afirmação relacional simples, sem acrescentar a ideia de hospedagem ou permanência fixa.
- source_word: לֹא הֶכְלַמְנוּם
  choice: não os maltratamos
  rationale: O hifil de כלם pode significar causar vergonha, desonra ou humilhação; neste contexto de convivência e proteção, “maltratamos” comunica adequadamente o efeito prático sem restringir o verbo à humilhação verbal.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: e nada do que era deles desapareceu
  rationale: O nifal de פקד indica que nada ficou faltando ou deixou de estar presente. A formulação possessiva esclarece que nenhum bem dos pastores se perdeu.
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: durante todo o tempo em que estiveram
  rationale: Reproduz naturalmente o alcance temporal completo da expressão hebraica.
- source_word: בַּכַּרְמֶל
  choice: no Carmelo
  rationale: Trata כַּרְמֶל como o topônimo de Judá e emprega a forma portuguesa consagrada “Carmelo”.
