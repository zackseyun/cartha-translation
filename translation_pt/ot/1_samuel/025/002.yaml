base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: pt
  text: Havia um homem em Maom cujos bens estavam no Carmelo[a]. Esse homem era muito rico[b] e possuía três mil ovelhas e mil cabras. Ele estava tosquiando suas ovelhas no Carmelo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cujo trabalho estava no Carmelo” ou “cujos negócios estavam no Carmelo”. O termo hebraico pode se referir ao trabalho, às atividades ou aos bens de uma pessoa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “era muito grande”, isto é, rico ou socialmente importante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: Introdução narrativa indefinida, traduzida de modo natural sem acrescentar um marcador temporal ausente no hebraico.
- source_word: בְּמָעוֹן
  choice: em Maom
  rationale: Topônimo transliterado; indica o local associado à residência do homem.
- source_word: מַעֲשֵׂהוּ
  choice: cujas propriedades ficavam
  rationale: O substantivo pode designar trabalho, atividade, empreendimento ou bens. No contexto pecuário, “propriedades” comunica bem os bens ou a exploração econômica situada no Carmelo, sem restringir indevidamente o sentido.
- source_word: בַכַּרְמֶל
  choice: no Carmelo
  rationale: Trata-se do topônimo Carmelo, não do substantivo comum referente a pomar ou terra cultivada.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: Esse homem era muito rico
  rationale: Literalmente, “muito grande”; os números do rebanho indicam grandeza econômica e social, expressa naturalmente em português como riqueza.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: e possuía três mil ovelhas e mil cabras
  rationale: A construção possessiva hebraica é vertida naturalmente por “possuía”, mantendo as quantidades e as espécies.
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: Ele estava tosquiando suas ovelhas
  rationale: A fórmula narrativa com infinitivo apresenta uma ação em andamento; o imperfeito perifrástico preserva esse aspecto em português.
