  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: pt
  text: Quando Abigail viu Davi, desceu depressa do jumento, lançou-se com o rosto em terra diante de Davi e curvou-se até o chão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prostrou-se por terra”. O verbo hebraico pode indicar uma reverência profunda ou prostração; aqui descreve a homenagem de Abigail diante de Davi, não necessariamente adoração.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: viu
  rationale: ראה é o verbo comum para ver; “viu” é a equivalência direta e natural neste contexto narrativo.
- source_word: וַתְּמַהֵר
  choice: depressa
  rationale: מהר indica ação rápida. Ligado a “desceu”, “desceu depressa” comunica com naturalidade a urgência da sequência hebraica.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: desceu do jumento
  rationale: ירד significa descer, e מֵעַל indica o ponto de onde ela desceu. A formulação é clara e menos técnica que “desmontou”.
- source_word: הַחֲמוֹר
  choice: o jumento
  rationale: חמור designa um asno/jumento. “Jumento” é corrente e facilmente compreendido em português.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד
  choice: lançou-se ... diante de Davi
  rationale: A expressão descreve Abigail caindo diante de Davi em atitude de submissão. “Lançou-se” preserva o movimento voluntário e repentino sem introduzir “aos pés”, que não consta no hebraico.
- source_word: עַל פָּנֶיהָ
  choice: com o rosto em terra
  rationale: A expressão indica concretamente que ela caiu sobre o rosto. “Com o rosto em terra” comunica a postura de modo natural em português.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: curvou-se até o chão
  rationale: שׁחה pode descrever uma reverência profunda ou prostração. Neste encontro humano, a expressão retrata homenagem e submissão, sem necessariamente indicar adoração religiosa.
theological_decisions:
- issue: Sentido de שׁחה numa reverência prestada a um ser humano
  choice: curvou-se até o chão
  alternative: prostrou-se por terra; adorou
  rationale: O objeto da reverência é Davi. A tradução deve preservar a postura profunda de homenagem sem importar a noção específica de culto divino. A nota conserva a alternativa física mais intensa.
translation_notes:
  register: Português moderno, digno e narrativamente fluido, com ampla legibilidade brasileira. A ordem das ações e a postura corporal do hebraico foram preservadas, evitando linguagem arcaica e interpretações teológicas indevidas.
