  to: Pergunte a seus jovens, e eles lhe contarão. Assim, que os jovens encontrem favor a seus olhos, pois chegamos em um dia de festa[a]. Por favor, dê tudo o que sua mão encontrar[b] a seus servos e a seu filho Davi.
