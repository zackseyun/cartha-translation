base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: pt
  text: Pergunte a seus jovens, e eles lhe contarão. Assim, que os jovens encontrem favor a seus olhos, pois chegamos em um dia de festa[a]. Por favor, dê tudo o que sua mão encontrar[b] a seus servos e a seu filho Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em um dia bom”; aqui, a expressão se refere ao caráter festivo da ocasião da tosquia das ovelhas.
    reason: cultural_note
  - marker: b
    text: Isto é, tudo o que puder oferecer ou tiver disponível; literalmente, “tudo o que sua mão encontrar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת־נְעָרֶיךָ
  choice: Pergunte aos seus jovens
  rationale: O imperativo é direto, e “jovens” preserva a amplitude de נַעַר e sua repetição mais adiante, sem definir excessivamente a condição social dos homens de Nabal.
- source_word: וְיַגִּידוּ לָךְ
  choice: e eles lhe contarão
  rationale: O hifil de נגד significa informar ou contar; esta formulação é corrente e mantém a força afirmativa da resposta esperada.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: Portanto, que estes jovens encontrem favor aos seus olhos
  rationale: Mantém a imagem hebraica de “encontrar favor aos olhos” e expressa a nuance volitiva do verbo. “Estes” ajuda a distinguir os mensageiros de Davi dos jovens de Nabal mencionados antes, sem apagar a repetição lexical.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: pois chegamos em um dia de festa
  rationale: יוֹם טוֹב é literalmente “dia bom”, mas, no contexto celebrativo da tosquia, designa naturalmente um dia festivo. A nota registra a forma literal.
- source_word: תְּנָה־נָּא
  choice: Por favor, dê
  rationale: O imperativo acompanhado de נָא comunica um pedido cortês; a formulação portuguesa preserva tanto o pedido quanto a polidez.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: tudo o que sua mão encontrar
  rationale: Conserva a imagem concreta do hebraico e deixa aberta a extensão da dádiva, enquanto a nota esclarece o sentido idiomático de disponibilidade.
- source_word: לַעֲבָדֶיךָ
  choice: aos seus servos
  rationale: Davi emprega עֶבֶד como autodesignação deferente; “servos” expressa essa cortesia sem impor a ideia de escravidão formal.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: e ao seu filho Davi
  rationale: Preserva a autodesignação humilde de Davi como “filho” de Nabal, sem interpretá-la como parentesco literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva as imagens hebraicas “encontrar favor aos seus olhos” e “o que sua mão encontrar”, esclarecendo em notas as expressões culturais e idiomáticas. “Portanto” explicita de modo natural a ligação do waw com o pedido volitivo.
