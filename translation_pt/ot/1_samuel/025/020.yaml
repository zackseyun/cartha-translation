  text: וְ/הָיָ֞ה הִ֣יא רֹכֶ֣בֶת עַֽל הַ/חֲמ֗וֹר וְ/יֹרֶ֨דֶת֙ בְּ/סֵ֣תֶר הָ/הָ֔ר וְ/הִנֵּ֤ה דָוִד֙ וַ/אֲנָשָׁ֔י/ו יֹרְדִ֖ים לִ/קְרָאתָ֑/הּ וַ/תִּפְגֹּ֖שׁ אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: pt
  text: Enquanto ela, montada no jumento, descia pelo lado encoberto do monte[a], eis que Davi e seus homens vinham descendo ao encontro dela, e ela os encontrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por uma parte escondida do monte”. A expressão hebraica pode indicar um lugar oculto ou protegido do monte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: Enquanto ela
  rationale: A construção narrativa com וְהָיָה e o particípio estabelece uma ação em andamento que serve de contexto temporal; “Enquanto ela” reproduz essa função com naturalidade.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: montada no jumento
  rationale: רכב indica montar ou cavalgar, e חמור é o termo comum para jumento. A formulação é atual e natural em português.
- source_word: וְיֹרֶדֶת
  choice: descia
  rationale: O particípio expressa ação contínua; o imperfeito português mantém esse valor no contexto narrativo.
- source_word: בְּסֵתֶר הָהָר
  choice: pelo lado encoberto do monte
  rationale: סֵתֶר denota ocultação, abrigo ou lugar escondido. No contexto topográfico, a expressão provavelmente indica uma parte do monte fora de vista ou protegida; a nota preserva a alternativa.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: הִנֵּה chama vividamente a atenção para o novo acontecimento. “Eis que” conserva essa força discursiva em registro narrativo digno.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: vinham descendo ao encontro dela
  rationale: ירד indica descer, enquanto לִקְרַאת expressa movimento em direção a alguém, frequentemente para encontrá-lo. A tradução mantém tanto a direção quanto o encontro iminente.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: e ela se encontrou com eles
  rationale: פגש significa encontrar ou deparar-se com alguém. A forma pronominal é natural em português e evita sugerir que Abigail tenha planejado o encontro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” foi mantido para representar a vivacidade narrativa de הִנֵּה; “monte” é preferido a “montanha” por se ajustar naturalmente ao cenário topográfico sem definir em excesso sua escala.
