  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: pt
  text: 'Quando Davi soube que Nabal havia morrido, disse: “Bendito seja Yahweh, que defendeu a causa da afronta que sofri da parte de Nabal[a] e impediu seu servo de praticar o mal[b]. Yahweh fez o mal de Nabal recair sobre a própria cabeça dele[c]”. Então Davi mandou falar com Abigail para tomá-la por esposa[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “defendeu a causa da minha afronta da mão de Nabal”. A expressão hebraica emprega linguagem de disputa judicial e também pode ser entendida como “vingou a afronta que sofri”.
    reason: lexical_alternative
  - marker: b
    text: Ou “conteve seu servo para que não causasse dano”.
    reason: lexical_alternative
  - marker: c
    text: '“Fazer o mal recair sobre a cabeça” é uma expressão de retribuição: o mal praticado volta contra quem o praticou.'
    reason: cultural_note
  - marker: d
    text: Isto é, para casar-se com ela. A expressão hebraica diz literalmente “tomá-la para si por esposa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Bendito seja Yahweh
  rationale: Preserva a fórmula hebraica de bênção e o nome divino, com expressão natural e solene em português.
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: defendeu a causa da afronta que sofri
  rationale: Mantém a imagem forense de ריב e expressa חֶרְפָּה como afronta pessoal sem tornar a frase artificial em português.
- source_word: מִיַּד נָבָל
  choice: da parte de Nabal
  rationale: Comunica naturalmente a origem ou agência indicada pelo idioma hebraico literalmente formulado como 'da mão de Nabal'.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: e impediu seu servo de praticar o mal
  rationale: Explicita o sentido de contenção de חָשַׂךְ e preserva a força moral de רָעָה no contexto da vingança planejada por Davi.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: Yahweh fez o mal de Nabal recair sobre a própria cabeça dele
  rationale: Conserva a imagem hebraica de retribuição, esclarecendo o referente do pronome para leitura corrente.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: Davi mandou falar com Abigail
  rationale: Representa o envio de mensageiros e o ato de falar com Abigail sem acrescentar explicitamente a ideia de proposta ao verbo.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: para tomá-la por esposa
  rationale: Mantém a expressão matrimonial hebraica de modo claro, digno e natural em português.
theological_decisions:
- issue: Juízo divino e providência na morte de Nabal
  choice: Conservar a declaração de Davi de que Yahweh defendeu sua causa e fez o mal de Nabal recair sobre ele.
  alternative: Explicitar que Deus matou Nabal como execução direta de uma sentença.
  rationale: O texto atribui a vindicação e a retribuição a Yahweh, mas a fala de Davi não deve ser ampliada para além do que afirma neste contexto narrativo.
- issue: Força moral de רָעָה na ação evitada de Davi
  choice: praticar o mal
  alternative: causar dano
  rationale: No contexto, Davi reconhece que a vingança sangrenta pretendida seria moralmente errada; 'mal' preserva essa avaliação.
- issue: Natureza da comunicação com Abigail
  choice: mandou falar com Abigail
  alternative: mandou pedi-la em casamento
  rationale: A finalidade matrimonial aparece na oração seguinte, enquanto o verbo principal significa falar; a formulação evita inserir no verbo uma interpretação que o contexto apenas torna implícita.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é narrativo e digno, com estruturas naturais; conserva o nome Yahweh, a linguagem forense e a imagem hebraica de retribuição, explicando alternativas relevantes em notas.
