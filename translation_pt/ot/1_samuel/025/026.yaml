  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: pt
  text: Agora, meu senhor, tão certo como vive Yahweh e como você mesmo vive, visto que Yahweh o impediu de incorrer em culpa de sangue e de salvar a si mesmo com as próprias mãos[a], que agora os seus inimigos e os que procuram fazer mal ao meu senhor sejam como Nabal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito neste contexto: “de vingar-se com as próprias mãos”.'
    reason: lexical_alternative
  - marker: b
    text: “Como Nabal” provavelmente se refere ao homem chamado Nabal, embora o nome também evoque a palavra hebraica para “insensato”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora / agora
  rationale: A expressão temporal ocorre duas vezes no hebraico. Ambas são representadas, preservando a progressão do discurso de Abigail.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Forma respeitosa com que Abigail se dirige a Davi; mantém a deferência sem sugerir referência divina.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: tão certo como vive Yahweh e como você mesmo vive
  rationale: Reproduz a fórmula de juramento em português natural. 'Você mesmo' comunica o valor idiomático de 'sua vida/sua pessoa' sem introduzir uma afirmação antropológica sobre a alma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מְנָעֲךָ
  choice: o impediu de
  rationale: Expressa diretamente a ideia de deter ou impedir alguém de realizar uma ação.
- source_word: מִבּוֹא בְדָמִים
  choice: de incorrer em culpa de sangue
  rationale: A expressão literalmente ligada a 'entrar em sangues' aponta, no contexto, não apenas para derramamento de sangue, mas para a culpa resultante dele.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: de salvar a si mesmo com as próprias mãos
  rationale: Mantém no texto principal o sentido lexical de ישׁע, 'salvar/livrar', e representa o papel da própria mão de Davi. A leitura contextual mais explícita, 'vingar-se', fica registrada em nota.
- source_word: יִהְיוּ כְנָבָל
  choice: sejam como Nabal
  rationale: Nabal é primeiramente o nome do marido de Abigail no contexto imediato, embora também produza um jogo de sentido com a palavra hebraica associada a 'insensato'.
- source_word: אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: os seus inimigos e os que procuram fazer mal ao meu senhor
  rationale: Traduz a expressão idiomática de buscar o mal de alguém em linguagem portuguesa clara e atual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico e evita substituí-lo silenciosamente por um título.
- issue: Natureza da ação da qual Davi foi impedido
  choice: culpa de sangue e salvar a si mesmo com as próprias mãos
  alternative: derramamento de sangue e vingar-se com as próprias mãos
  rationale: A tradução mantém tanto a dimensão moral-jurídica de דמים no contexto quanto o sentido lexical de 'salvar/livrar' do verbo ישׁע, sem ocultar que, narrativamente, a ação seria uma vingança violenta.
- issue: Sentido de נָבָל
  choice: o nome próprio Nabal
  alternative: um insensato
  rationale: O referente imediato é o marido de Abigail, mas a nota conserva o jogo de palavras perceptível em hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula de juramento foi vertida de modo idiomático, e as duas ocorrências explícitas de וְעַתָּה foram preservadas. Os marcadores [a] e [b] aparecem no texto principal junto às expressões explicadas.
