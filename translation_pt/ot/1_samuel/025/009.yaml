  text: וַ/יָּבֹ֨אוּ֙ נַעֲרֵ֣י דָוִ֔ד וַ/יְדַבְּר֧וּ אֶל נָבָ֛ל כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/שֵׁ֣ם דָּוִ֑ד וַ/יָּנֽוּחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: pt
  text: Quando os jovens de Davi chegaram, disseram a Nabal todas essas palavras em nome de Davi e ficaram esperando[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descansaram” ou “fizeram uma pausa”. O verbo hebraico pode significar “descansar”, mas, neste contexto, provavelmente indica que os homens de Davi terminaram de falar e aguardaram a resposta de Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי דָוִד
  choice: os jovens de Davi
  rationale: נַעַר pode designar um jovem, servo ou acompanhante. Aqui se refere aos emissários de Davi; “jovens” preserva a forma do hebraico sem reduzi-los apenas à função de servos.
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: בוא significa normalmente “vir/entrar”. Neste contexto narrativo, “chegaram” expressa de modo natural a chegada dos emissários ao seu destino.
- source_word: וַיְדַבְּרוּ אֶל נָבָל
  choice: disseram a Nabal
  rationale: דבר com אֶל indica fala dirigida a alguém. Em português, “disseram a Nabal” combina naturalmente com o objeto “todas essas palavras” e mantém o sentido direcional.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: todas essas palavras
  rationale: A construção é formalmente “conforme todas estas palavras”. A formulação escolhida comunica que os emissários transmitiram integralmente a mensagem anterior e preserva דְּבָרִים como “palavras”.
- source_word: בְּשֵׁם דָּוִד
  choice: em nome de Davi
  rationale: A expressão indica representação ou autorização e possui equivalente direto e idiomático em português.
- source_word: וַיָּנוּחוּ
  choice: ficaram esperando
  rationale: נוח significa em geral “descansar”, “repousar” ou “parar”. Depois de entregarem a mensagem, o contexto sugere que eles pararam de falar e aguardaram a resposta; a nota preserva os sentidos mais literais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A ordem narrativa do hebraico foi preservada, enquanto o último verbo recebeu uma tradução contextual acompanhada de nota para manter sua ambiguidade lexical.
