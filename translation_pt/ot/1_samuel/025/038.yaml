id: 1SA.25.38
reference: 1 Samuel 25:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: pt
  text: E, cerca de dez dias depois[a], Yahweh feriu Nabal, e ele morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de cerca de dez dias”. A expressão hebraica indica um período aproximado de dez dias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E, ... depois
  rationale: O wayyiqtol de היה introduz o acontecimento seguinte na sequência narrativa. Em português, a transição temporal integrada à frase soa natural sem perder a progressão do hebraico.
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: cerca de dez dias depois
  rationale: O prefixo כְּ confere valor aproximativo a “dez”; “cerca de dez dias depois” preserva tanto a aproximação quanto a relação temporal.
- source_word: וַיִּגֹּף
  choice: feriu
  rationale: נָגַף indica golpear ou atingir, muitas vezes em ação divina. “Feriu” mantém a força e a indeterminação do verbo, sem especificar o meio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת נָבָל
  choice: Nabal
  rationale: A partícula de objeto direto אֶת não recebe tradução; o nome próprio é transliterado segundo a forma convencional.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Reproduz diretamente o segundo verbo narrativo e mantém a sequência entre o ato de Yahweh e a morte de Nabal, sem fundi-los numa formulação mais interpretativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Grau de causalidade no juízo divino
  choice: Yahweh feriu Nabal, e ele morreu
  alternative: Yahweh matou Nabal; Yahweh feriu Nabal mortalmente
  rationale: 'O hebraico apresenta dois verbos sucessivos: Yahweh atingiu Nabal, e Nabal morreu. A formulação preserva a clara relação narrativa sem condensá-la em uma expressão que especifique além do texto como ocorreu a morte.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Feriu” é corrente e suficientemente abrangente para o verbo hebraico; a ordem narrativa e a aproximação temporal foram preservadas.
