base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: pt
  text: 'Davi tinha dito: “Foi para nada que protegi tudo o que pertencia a esse homem no deserto, sem que faltasse coisa alguma de tudo o que era dele; ele me retribuiu mal em lugar de bem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: Foi para nada
  rationale: A expressão enfatiza que, diante da resposta de Nabal, Davi considera inútil ou sem recompensa toda a proteção que lhe prestou.
- source_word: שָׁמַרְתִּי
  choice: protegi
  rationale: No contexto, o verbo não indica apenas vigiar, mas preservar os bens e homens de Nabal contra perdas e ataques.
- source_word: וְלֹא נִפְקַד ... מְאוּמָה
  choice: sem que faltasse coisa alguma
  rationale: Reproduz naturalmente em português a ideia de que nenhum dos bens de Nabal foi dado por ausente ou perdido.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: ele me retribuiu o bem com o mal
  rationale: 'Expressa idiomaticamente a troca injusta descrita pelo hebraico: mal em lugar de bem.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. O mais-que-perfeito composto preserva a relação temporal retrospectiva indicada pelo contexto, e a fala mantém o tom indignado de Davi.
