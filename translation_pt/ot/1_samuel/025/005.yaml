  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד עֲשָׂרָ֣ה נְעָרִ֑ים וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/נְּעָרִ֗ים עֲל֤וּ כַרְמֶ֨לָ/ה֙ וּ/בָאתֶ֣ם אֶל נָבָ֔ל וּ/שְׁאֶלְתֶּם ל֥/וֹ בִ/שְׁמִ֖/י לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: pt
  text: 'Então Davi enviou dez jovens e lhes disse: “Subam a Carmelo, procurem Nabal e, em meu nome, perguntem como ele está[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “perguntem-lhe, em meu nome, pelo bem-estar”; ou, “saúdem-no, em meu nome, com votos de paz”.
    reason: Preserva a formulação e a ambiguidade idiomática de לְשָׁלוֹם, que pode descrever uma pergunta pelo bem-estar dentro de uma saudação de paz.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente narrativo comum e direto para שׁלח.
- source_word: עֲשָׂרָה נְעָרִים
  choice: dez jovens
  rationale: Preserva a referência primária à idade sem especificar indevidamente que eram servos, embora atuem como mensageiros.
- source_word: עֲלוּ כַרְמֶלָה
  choice: Subam a Carmelo
  rationale: Mantém o movimento expresso por עלה e o destino indicado pelo ה direcional, em português natural.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: procurem Nabal
  rationale: Expressa naturalmente a instrução de ir até Nabal e apresentar-se a ele, evitando o pouco idiomático 'venham a Nabal' na perspectiva de Davi.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: perguntem como ele está
  rationale: Traduz o valor idiomático da pergunta pelo shalom, isto é, uma saudação que indaga pelo bem-estar.
- source_word: בִשְׁמִי
  choice: em meu nome
  rationale: Conserva de modo formal e natural a ideia de representação presente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição explícita de 'Davi' antes da fala foi reduzida a 'lhes disse', pois o referente permanece inequívoco; o sentido narrativo não se altera.
