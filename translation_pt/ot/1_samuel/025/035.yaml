  text: וַ/יִּקַּ֤ח דָּוִד֙ מִ/יָּדָ֔/הּ אֵ֥ת אֲשֶׁר הֵבִ֖יאָה ל֑/וֹ וְ/לָ֣/הּ אָמַ֗ר עֲלִ֤י לְ/שָׁלוֹם֙ לְ/בֵיתֵ֔/ךְ רְאִי֙ שָׁמַ֣עְתִּי בְ/קוֹלֵ֔/ךְ וָ/אֶשָּׂ֖א פָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: pt
  text: 'Então Davi pegou da mão dela o que ela lhe havia trazido e lhe disse: “Suba em paz para a sua casa. Veja, dei ouvidos à sua voz e mostrei favor a você[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aceitei você”; literalmente, “levantei o seu rosto”.
    reason: A expressão idiomática hebraica pode indicar mostrar favor ou acolher alguém favoravelmente; a nota preserva a alternativa pessoal e a imagem literal.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: Mantém o sentido concreto e básico de לקח, sem substituí-lo pelo mais interpretativo “recebeu”.
- source_word: מִיָּדָהּ
  choice: da mão dela
  rationale: Preserva a imagem explícita do hebraico e indica o recebimento direto do que Abigail trouxe.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: o que ela lhe havia trazido
  rationale: Expressa naturalmente a anterioridade da ação de Abigail em relação ao gesto de Davi.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: Suba em paz para a sua casa
  rationale: Conserva o movimento de subida expresso por עלה e a fórmula de partida segura לְשָׁלוֹם.
- source_word: רְאִי
  choice: Veja
  rationale: Imperativo atual e claro que mantém a função de chamar a atenção, sem recorrer ao arcaico “eis”.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: dei ouvidos à sua voz
  rationale: Mantém a imagem hebraica da voz e comunica que Davi escutou e levou em conta o apelo de Abigail.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: atendi ao seu pedido
  rationale: Comunica no contexto o efeito da expressão idiomática — Davi acolheu favoravelmente o apelo de Abigail — sem reproduzir literalmente uma construção obscura em português.
theological_decisions:
- issue: Sentido da expressão idiomática וָאֶשָּׂא פָּנָיִךְ
  choice: atendi ao seu pedido
  alternative: mostrei favor a você; aceitei você; literalmente, levantei o seu rosto
  rationale: A expressão pode destacar tanto o favor concedido à pessoa quanto a aceitação de seu apelo. A tradução principal explicita o resultado no contexto, enquanto a nota conserva as alternativas e a imagem literal, sem impor uma distinção teológica inexistente no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “dei ouvidos à sua voz” preserva a vivacidade sem soar excessivamente arcaica; “Suba” conserva a indicação espacial do hebraico.
