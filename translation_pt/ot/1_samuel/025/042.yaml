base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: pt
  text: Abigail se apressou, levantou-se e montou no jumento, com cinco de suas jovens mulheres seguindo-a. Ela seguiu os mensageiros de Davi e se tornou esposa dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: se levantou depressa
  rationale: Reproduz de modo natural a ideia de que Abigail se apressou e se levantou, sem o tom arcaico de “ergueu-se às pressas”.
- source_word: נַעֲרֹתֶיהָ
  choice: suas servas
  rationale: No contexto doméstico, o termo designa jovens mulheres que serviam Abigail; “servas” é claro e conciso em português.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: a acompanhavam a pé
  rationale: A expressão idiomática indica que as cinco mulheres seguiam junto dela, enquanto Abigail ia montada; a tradução evita o literal pouco natural “aos pés dela”.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: se tornou esposa dele
  rationale: Neste contexto matrimonial, אִשָּׁה significa “esposa”; a formulação preserva a construção relacional do hebraico em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com frases curtas para tornar transparente a sequência narrativa. A tradução segue diretamente o hebraico e não requer nota textual ou interpretativa.
