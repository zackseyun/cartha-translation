base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: pt
  text: Ainda que um homem se levante para persegui-lo e procurar tirar-lhe a vida, a vida de meu senhor ficará atada no feixe dos vivos[a], junto de Yahweh, seu Deus; mas ele lançará para longe a vida dos seus inimigos, da cavidade da funda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará bem guardada no feixe da vida”. A imagem hebraica é a de algo firmemente atado ou embrulhado para ser mantido em segurança.'
    reason: lexical_alternative
  - marker: b
    text: 'O verbo hebraico evoca especificamente o movimento de uma funda: a vida dos inimigos será arremessada como uma pedra para fora da cavidade da funda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: Ainda que um homem se levante
  rationale: A construção introduz uma circunstância concessiva na fala de Abigail. “Um homem” conserva o singular masculino e a referência concreta ao perseguidor de Davi.
- source_word: לִרְדָפְךָ
  choice: para persegui-lo
  rationale: “Perseguir” expressa com naturalidade a ação hostil de רדף e mantém a forma respeitosa de tratamento usada por Abigail.
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: e procurar tirar-lhe a vida
  rationale: נֶפֶשׁ designa aqui a vida da pessoa ameaçada. A formulação portuguesa torna explícita a intenção letal sem recorrer ao sentido inadequado de “alma”.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: a vida de meu senhor
  rationale: Mantém o tratamento respeitoso de Abigail e o paralelismo entre a vida de Davi e a de seus inimigos.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: ficará atada no feixe dos vivos
  rationale: Preserva a imagem concreta de algo amarrado e guardado em segurança. “Dos vivos” reflete a forma plural hebraica sem transformar a metáfora numa afirmação explícita sobre a vida após a morte.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: junto de Yahweh, seu Deus
  rationale: אֵת tem aqui valor associativo. “Junto de” comunica a ideia de preservação na presença de Deus, e “Yahweh” translitera o nome divino.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: mas a vida dos seus inimigos
  rationale: O singular נֶפֶשׁ tem sentido coletivo em relação aos inimigos no plural. “Mas” explicita o contraste forte entre preservação e expulsão.
- source_word: יְקַלְּעֶנָּה
  choice: ele lançará para longe
  rationale: O verbo deriva da ação de uma funda. A tradução é natural em português, enquanto a nota registra a força imagética específica do hebraico. O sujeito implícito continua sendo Deus.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: da cavidade da funda
  rationale: כַּף denota a palma ou concavidade; no contexto, indica a parte côncava da funda onde se coloca a pedra. A expressão conserva o quadro concreto do arremesso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome pessoal divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Contraste metafórico entre a preservação de Davi e a destruição dos inimigos
  choice: Conservar as imagens do feixe em que a vida fica atada e da funda que lança a vida dos inimigos para longe.
  alternative: Interpretar “feixe dos vivos” como referência explícita à vida eterna ou reduzir ambas as imagens a proteção e derrota em termos abstratos.
  rationale: O hebraico apresenta imagens concretas de guarda segura e remoção violenta, mas não desenvolve neste versículo uma doutrina explícita da vida após a morte.
- issue: Identidade do perseguidor em אָדָם
  choice: um homem
  alternative: alguém ou uma pessoa
  rationale: A forma hebraica é singular masculina e, no contexto, aponta concretamente para um adversário masculino, sem necessidade de neutralização.
- issue: Sujeito de יְקַלְּעֶנָּה
  choice: Manter o pronome “ele”, cujo referente contextual é Yahweh.
  alternative: Repetir explicitamente “Yahweh”.
  rationale: O hebraico deixa o sujeito implícito; o português permite conservar essa ligação contextual sem acrescentar uma repetição inexistente no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento respeitoso em terceira pessoa. A formulação preserva as duas imagens concretas do hebraico e usa “Yahweh” para o Tetragrama. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
