base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: pt
  text: 'Então Davi disse aos seus homens: “Cada um prenda a sua espada à cintura.” Cada um prendeu a sua espada à cintura, e Davi também prendeu a sua espada à cintura. Cerca de quatrocentos homens subiram seguindo Davi, enquanto duzentos ficaram junto à bagagem[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto aos suprimentos” ou “junto ao equipamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: prenda/prendeu ... à cintura
  rationale: חגר descreve colocar ou cingir uma arma ao corpo. A formulação explicita de modo natural em português moderno a ação concreta, sem recorrer ao menos comum “cingir”.
- source_word: אִישׁ ... אֶת־חַרְבּוֹ
  choice: cada um ... sua espada
  rationale: Mantém a construção distributiva do hebraico e a referência individual à espada de cada homem.
- source_word: חֶרֶב
  choice: espada
  rationale: O substantivo designa especificamente uma espada, não uma arma em sentido genérico.
- source_word: גַּם
  choice: também
  rationale: Assinala que o próprio Davi participou do ato de se armar.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: subiram seguindo Davi
  rationale: Preserva tanto o movimento ascendente expresso por עלה quanto a ideia de seguir atrás de Davi expressa por אַחֲרֵי.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: cerca de quatrocentos homens
  rationale: O prefixo כְּ indica aproximação diante do número.
- source_word: יָשְׁבוּ
  choice: ficaram
  rationale: Embora o verbo possa significar literalmente “sentaram-se”, aqui indica que os duzentos permaneceram para trás.
- source_word: עַל־הַכֵּלִים
  choice: junto à bagagem
  rationale: כֵּלִים é um termo amplo para objetos, utensílios ou equipamento; neste contexto de deslocamento do grupo, “bagagem” comunica naturalmente os bens deixados sob guarda.
- source_word: לַאֲנָשָׁיו
  choice: aos seus homens
  rationale: No contexto militar, refere-se aos homens que acompanhavam Davi, e não genericamente a pessoas ou necessariamente a servos domésticos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição da ação de prender a espada foi mantida por refletir a estrutura enfática da narrativa hebraica. O marcador da nota foi colocado após “bagagem”, termo ao qual a alternativa lexical se refere.
