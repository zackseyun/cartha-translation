revisions:
- from: 'Então Davi disse aos seus homens: “Cada um prenda sua espada à cintura”. Cada um prendeu sua espada à cintura, e Davi também prendeu a dele. Cerca de quatrocentos homens subiram seguindo Davi, enquanto duzentos ficaram junto à bagagem[a].'
  to: 'Então Davi disse aos seus homens: “Cada um prenda a sua espada à cintura.” Cada um prendeu a sua espada à cintura, e Davi também prendeu a sua espada à cintura. Cerca de quatrocentos homens subiram seguindo Davi, enquanto duzentos ficaram junto à bagagem[a].'
  rationale: A revisão apenas substitui a expressão elíptica «a dele» pela repetição explícita de «a sua espada à cintura», refletindo mais de perto a repetição do hebraico e produzindo uma formulação mais clara em português moderno. A nota lexical é preservada.
