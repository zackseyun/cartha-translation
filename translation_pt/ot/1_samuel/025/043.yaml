base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: pt
  text: Davi também tomou Ainoã de Jezreel, e ambas se tornaram suas esposas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: tomou
  rationale: Preserva o sentido básico do verbo hebraico; neste contexto, a oração seguinte esclarece que se trata de tomá-la como mulher.
- source_word: אֲחִינֹעַם
  choice: Ainoã
  rationale: Forma tradicional e legível em português para a transliteração do nome hebraico.
- source_word: מִיִּזְרְעֶאל
  choice: de Jezreel
  rationale: A preposição מִן com o topônimo indica procedência ou associação geográfica; “de Jezreel” é natural e mantém essa amplitude.
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: e ambas se tornaram
  rationale: O verbo feminino plural e “ambas” remetem conjuntamente a Abigail e Ainoã; “se tornaram” conserva o valor verbal de היה.
- source_word: לְנָשִׁים
  choice: suas mulheres
  rationale: A construção לּוֹ לְנָשִׁים significa que elas passaram a ser mulheres dele, isto é, esposas; “suas mulheres” preserva o plural e o tom narrativo.
- source_word: גַּם
  choice: também
  rationale: 'Marca adição: além de Abigail, Davi tomou Ainoã.'
theological_decisions:
- issue: Descrição de casamento poligínico
  choice: O versículo declara de modo descritivo que as duas eram mulheres de Davi.
  alternative: Empregar uma formulação eufemística que atenue a referência ao casamento plural.
  rationale: O hebraico apresenta claramente ambas as mulheres nessa relação com Davi; a tradução não deve ocultar nem moralizar a afirmação.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A formulação acompanha de perto a ordem e o sentido do hebraico sem sacrificar a naturalidade.
