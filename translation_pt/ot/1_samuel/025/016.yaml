  text: חוֹמָה֙ הָי֣וּ עָלֵ֔י/נוּ גַּם לַ֖יְלָה גַּם יוֹמָ֑ם כָּל יְמֵ֛י הֱיוֹתֵ֥/נוּ עִמָּ֖/ם רֹעִ֥ים הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/016.yaml
  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: pt
  text: Eles foram uma muralha ao nosso redor[a], tanto de noite como de dia, durante todo o tempo em que estivemos com eles, cuidando do rebanho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma muralha sobre nós”, preservando mais literalmente a preposição hebraica; no contexto, a imagem expressa uma presença protetora ao nosso redor.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “rebanho” é coletivo e pode incluir ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: uma muralha
  rationale: Mantém a imagem concreta e vívida do substantivo hebraico, usado metaforicamente para expressar proteção.
- source_word: הָיוּ
  choice: foram
  rationale: O perfeito qal de היה funciona aqui como cópula no passado, descrevendo o papel contínuo desempenhado pelos homens de Davi.
- source_word: עָלֵינוּ
  choice: ao nosso redor
  rationale: Embora על signifique literalmente “sobre”, com “muralha” o contexto comunica proteção circundante; “ao nosso redor” expressa esse sentido em português natural.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: tanto de noite como de dia
  rationale: Reproduz a construção correlativa גם...גם e ressalta a proteção contínua durante todo o ciclo diário.
- source_word: כָּל יְמֵי
  choice: durante todo o tempo
  rationale: Transmite naturalmente em português a duração abrangente da expressão hebraica “todos os dias de”.
- source_word: הֱיוֹתֵנוּ עִמָּם
  choice: em que estivemos com eles
  rationale: Converte o infinitivo construto com sufixo pronominal em uma oração temporal clara, sem alterar o sentido.
- source_word: רֹעִים
  choice: cuidando
  rationale: O particípio de רעה indica a atividade de pastorear ou apascentar; “cuidando” é natural no contexto do rebanho.
- source_word: הַצֹּאן
  choice: o rebanho
  rationale: צאן é um termo coletivo que pode abranger ovelhas e cabras; “rebanho” preserva essa amplitude melhor que “ovelhas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A metáfora concreta da muralha foi preservada, enquanto a relação espacial foi expressa de modo idiomático; a alternativa mais literal consta em nota.
