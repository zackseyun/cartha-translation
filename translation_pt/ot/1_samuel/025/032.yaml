  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: pt
  text: 'Davi disse a Abigail: “Bendito seja Yahweh, o Deus de Israel, que enviou você neste dia[a] ao meu encontro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “hoje”.'
    reason: Alternativa lexical para הַיּוֹם הַזֶּה, literalmente “este dia”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol dá continuidade à sequência narrativa; em português atual, “disse” comunica naturalmente o evento sem exigir a repetição de “e”.
- source_word: לַאֲבִיגַל
  choice: a Abigail
  rationale: A preposição ל marca a pessoa a quem Davi dirige suas palavras; “a Abigail” é a construção portuguesa natural.
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo integra uma fórmula doxológica. “Bendito seja” preserva seu tom solene e continua claro no português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: A expressão construta identifica Yahweh como o Deus de Israel; o artigo produz uma aposição idiomática em português.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo retoma Yahweh e introduz a oração que descreve sua ação; “que” é natural e não altera a referência pessoal.
- source_word: שְׁלָחֵךְ
  choice: enviou você
  rationale: O perfeito com sufixo feminino singular descreve a ação concluída de Deus ao enviar Abigail. A forma explícita “você” tem ampla legibilidade brasileira e evita a possível ambiguidade de “a enviou”.
- source_word: הַיּוֹם הַזֶּה
  choice: neste dia
  rationale: Reproduz de perto a expressão demonstrativa hebraica e mantém o tom solene; “hoje” é uma alternativa mais concisa.
- source_word: לִקְרָאתִי
  choice: ao meu encontro
  rationale: A expressão indica que Abigail foi enviada para encontrar-se com Davi; “ao meu encontro” é idiomático e conserva a ideia direcional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. Conservou-se a fórmula solene “Bendito seja” e a expressão mais formal “neste dia”, enquanto a alternativa corrente “hoje” aparece em nota.
