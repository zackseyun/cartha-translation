base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: pt
  text: 'Mas um dos rapazes contou a Abigail, mulher de Nabal, dizendo: “Veja, Davi enviou mensageiros do deserto para cumprimentar[a] nosso senhor, e ele os atacou com palavras[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abençoar”. O verbo hebraico geralmente significa “abençoar”, mas aqui provavelmente se refere a uma saudação cortês acompanhada de votos de bem-estar.
    reason: lexical_alternative
  - marker: b
    text: Ou “investiu contra eles”, “esbravejou contra eles” ou “os insultou”. O verbo hebraico é vívido e pode sugerir uma investida agressiva ou uma explosão hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: Mas ... a Abigail
  rationale: A conjunção dá continuidade à narrativa e, no contexto, introduz o contraste entre a recusa de Nabal e o relato feito a Abigail.
- source_word: אֵשֶׁת נָבָל
  choice: mulher de Nabal
  rationale: Reproduz naturalmente em português a identificação de Abigail pela relação com Nabal.
- source_word: הִגִּיד
  choice: contou
  rationale: O Hifil de נגד significa informar ou relatar; “contou” é claro e natural neste contexto narrativo.
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: um dos rapazes
  rationale: Preserva o sentido amplo de נער sem explicitar “servo” além do que o termo exige, embora o contexto doméstico indique que faziam parte dos servos.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso direto.
- source_word: הִנֵּה
  choice: Veja
  rationale: Expressa de modo atual o chamado de atenção feito pela partícula hebraica.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: No contexto, refere-se inequivocamente a enviados humanos.
- source_word: מֵהַמִּדְבָּר
  choice: do deserto
  rationale: Designa a região erma onde Davi e seus homens estavam; “deserto” é uma forma corrente e ampla em português.
- source_word: לְבָרֵךְ
  choice: para cumprimentar
  rationale: Embora o verbo costume significar “abençoar”, aqui descreve a saudação cortês levada pelos mensageiros; a alternativa mais literal é mantida em nota.
- source_word: אֶת אֲדֹנֵינוּ
  choice: nosso senhor
  rationale: Expressa a maneira como os servos se referem ao chefe da casa, sem indicar um título divino.
- source_word: וַיָּעַט בָּהֶם
  choice: e ele investiu contra eles
  rationale: Preserva a imagem vívida e agressiva do raro verbo hebraico sem restringir a reação de Nabal a gritos; a possível força verbal é explicada em nota.
