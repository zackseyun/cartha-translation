lexical_decisions:
- source_word: הַבְּרָכָה
  choice: presente
  rationale: Embora o sentido básico seja “bênção”, neste contexto a palavra designa concretamente a oferta levada por Abigail; “presente” comunica esse uso idiomático com naturalidade.
- source_word: שִׁפְחָתְךָ
  choice: sua serva
  rationale: Preserva a autodesignação humilde de Abigail ao dirigir-se a Davi.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: Equivalente contextual amplo para os homens jovens que serviam e acompanhavam Davi.
- source_word: הַמִּתְהַלְּכִים בְּרַגְלֵי אֲדֹנִי
  choice: que acompanham o meu senhor
  rationale: A expressão hebraica literalmente relacionada a andar aos pés de alguém é idiomática e indica acompanhar ou seguir.
