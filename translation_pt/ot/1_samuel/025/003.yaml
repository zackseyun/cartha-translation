base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: pt
  text: O homem se chamava Nabal, e sua mulher se chamava Abigail. Ela era inteligente e de bela aparência, mas ele era duro e mau em suas ações; era calebita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico provavelmente significa “calebita”, isto é, membro do clã de Calebe. A forma escrita é incomum, e alguns consideram possível lê-la de outra maneira.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: Nabal
  rationale: Nome próprio, transliterado segundo a forma tradicional em português.
- source_word: אֲבִגָיִל
  choice: Abigail
  rationale: Nome próprio, vertido segundo a forma tradicional em português.
- source_word: טוֹבַת שֶׂכֶל
  choice: inteligente
  rationale: A expressão denota bom entendimento ou discernimento; “inteligente” é natural e mantém o elogio à capacidade de compreensão.
- source_word: וִיפַת תֹּאַר
  choice: de bela aparência
  rationale: A construção se refere concretamente à beleza física ou à formosura, sem reduzir a expressão a um elogio genérico.
- source_word: קָשֶׁה
  choice: duro
  rationale: Descreve uma pessoa de temperamento difícil e severo; “duro” preserva a concisão e funciona naturalmente no contraste com Abigail.
- source_word: רַע מַעֲלָלִים
  choice: mau em suas ações
  rationale: מַעֲלָלִים designa atos, práticas ou conduta; a formulação conserva a avaliação moral do hebraico sem restringi-la apenas a relações comerciais ou sociais.
- source_word: כלבו
  choice: calebita
  rationale: A leitura tradicional entende a forma como designação de pertencimento ao clã de Calebe. Como a forma escrita é incomum, a incerteza textual é registrada em nota.
theological_decisions:
- issue: Interpretação de וְהוּא כלבו
  choice: era calebita
  alternative: era da casa de Calebe; a forma escrita pode admitir outra leitura
  rationale: Trata-se sobretudo de uma questão textual e lexical. A interpretação gentílica ou clânica se ajusta ao contexto e à tradição antiga, mas a forma hebraica incomum não deve ser ocultada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição inicial de “o homem” e “sua mulher” acompanha a estrutura hebraica; na frase seguinte, os pronomes evitam rigidez desnecessária. O marcador da nota foi colocado junto de “calebita”, expressão à qual a variante textual efetivamente se refere.
