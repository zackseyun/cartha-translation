source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: pt
  text: Por favor, perdoe a transgressão da sua serva, pois Yahweh certamente fará para o meu senhor uma casa duradoura[a], porque o meu senhor luta as batalhas de Yahweh, e não haverá mal em você durante todos os seus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma casa firme” ou “uma dinastia duradoura”. Aqui, “casa” se refere a uma linhagem estável, não apenas a uma residência ou família doméstica.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: Por favor, perdoe a transgressão
  rationale: A expressão idiomática 'levantar/suportar' uma transgressão significa perdoá-la; 'por favor' preserva a força suplicante de נָא, e 'transgressão' mantém a seriedade moral de פֶּשַׁע.
- source_word: אֲמָתֶךָ
  choice: da sua serva
  rationale: אמה designa especificamente uma serva; a forma feminina é natural em português e preserva a autodepreciação respeitosa de Abigail.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: certamente fará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação.
- source_word: לַאדֹנִי
  choice: para o meu senhor
  rationale: É a forma respeitosa com que Abigail se dirige a Davi; 'senhor' é natural e adequado ao contexto.
- source_word: בַּיִת נֶאֱמָן
  choice: uma casa duradoura
  rationale: Preserva a metáfora hebraica de 'casa' enquanto 'duradoura' comunica estabilidade e continuidade dinástica.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: as batalhas de Yahweh
  rationale: A construção indica batalhas travadas pela causa de Yahweh; a formulação mantém o nome divino e a relação genitiva sem explicá-la em excesso.
- source_word: נִלְחָם
  choice: luta
  rationale: O particípio exprime atividade característica ou contínua; o presente simples comunica isso naturalmente.
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: e nenhum mal será encontrado em você
  rationale: Mantém a amplitude semântica e moral de רָעָה e reproduz a construção passiva do hebraico, sem decidir de modo indevido entre maldade, culpa ou dano.
- source_word: מִיָּמֶיךָ
  choice: durante todos os seus dias
  rationale: Expressa de modo claro o sentido temporal de toda a vida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido dinástico de בַּיִת נֶאֱמָן
  choice: uma casa duradoura
  alternative: uma dinastia duradoura; uma casa firme
  rationale: O contexto aponta para linhagem ou dinastia estável, mas conservar 'casa' mantém a metáfora bíblica e suas conexões intertextuais; a nota esclarece o sentido.
- issue: Amplitude de רָעָה
  choice: mal
  alternative: maldade; desgraça; dano
  rationale: O termo pode abranger mal moral e calamidade. 'Mal' conserva essa ambiguidade, evitando restringir a fala de Abigail a culpa moral ou infortúnio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “meu senhor” preserva o tom respeitoso da fala de Abigail; “casa” mantém a metáfora hebraica, esclarecida em nota.
