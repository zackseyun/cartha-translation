base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: pt
  text: Pela manhã, quando o vinho já havia deixado Nabal[a], sua mulher lhe contou tudo isso. Então, seu coração morreu dentro dele[b], e ele ficou como pedra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quando o vinho saiu de Nabal”; isto é, quando Nabal ficou sóbrio ou quando o efeito do vinho passou.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu coração desfaleceu dentro dele”. O hebraico usa uma imagem vívida, não uma descrição médica técnica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: Pela manhã
  rationale: Expressão temporal natural em português, correspondente ao hebraico.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: quando o vinho já havia deixado Nabal
  rationale: Preserva a imagem concreta do hebraico — literalmente, o vinho saindo de Nabal — sem substituir no texto principal a figura pela explicação interpretativa de que ele ficou sóbrio.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: sua mulher lhe contou
  rationale: Verbo corrente e natural para o hifil de נגד neste contexto narrativo.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: essas coisas
  rationale: Mantém a amplitude semântica de דְּבָרִים, que pode designar palavras, fatos ou acontecimentos.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: o coração dele morreu dentro do peito
  rationale: Conserva a imagem intensa do hebraico sem convertê-la em diagnóstico médico; 'dentro do peito' comunica naturalmente a localização interior expressa por בְּקִרְבּוֹ.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: ele ficou como pedra
  rationale: Reproduz de modo idiomático a comparação hebraica e evita especificar paralisia, coma ou outro quadro clínico.
theological_decisions:
- issue: Se a condição de Nabal deve ser interpretada como diagnóstico médico
  choice: 'Preservar a linguagem figurada: “o coração dele morreu dentro do peito, e ele ficou como pedra”'
  alternative: Explicitar que ele sofreu um ataque cardíaco, um derrame ou ficou paralisado
  rationale: O narrador emprega imagens vívidas, não terminologia clínica. A tradução mantém em aberto a natureza médica exata do acontecimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva as imagens concretas do hebraico; as notas esclarecem o sentido sem impor um diagnóstico médico.
