base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: pt
  text: 'E disse[a]: “Por que o meu senhor persegue assim o seu servo? Pois o que foi que eu fiz[b], e que mal há em minha mão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «seu servo». Algumas traduções trazem «teu servo» para tornar mais direta a interlocução, mas o Texto Massorético tem a forma de terceira pessoa.'
    reason: alternative_reading
  - marker: b
    text: «Em minha mão» é uma expressão hebraica que pode indicar culpa, intenção ou poder para fazer mal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico de modo natural e conciso em português.
- source_word: לָמָּה זֶּה
  choice: Por que... assim
  rationale: O demonstrativo זֶה reforça a pergunta e, neste contexto, é expresso naturalmente por “assim”, sem perder a ênfase do hebraico.
- source_word: אֲדֹנִי
  choice: o meu senhor
  rationale: Título respeitoso dirigido a Saul como superior humano; “senhor” mantém o registro cortês sem sugerir referência divina.
- source_word: רֹדֵף אַחֲרֵי
  choice: persegue
  rationale: Comunica a perseguição ativa e hostil de forma idiomática, sem acrescentar a nuance interpretativa de perseguição religiosa.
- source_word: עַבְדּוֹ
  choice: o seu servo
  rationale: Mantém a forma de terceira pessoa do Texto Massorético e a autodesignação respeitosa de Davi. Em português, “seu” pode referir-se ao senhor mencionado, preservando a construção sem corrigi-la para primeira pessoa.
- source_word: כִּי מֶה עָשִׂיתִי
  choice: O que foi que eu fiz
  rationale: כִּי introduz aqui a justificativa da pergunta anterior; em português, a sequência retórica dispensa um “pois” explícito. “Foi que” dá ênfase natural à indagação.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: e que mal há em minhas mãos
  rationale: Preserva a metáfora hebraica daquilo que está nas mãos da pessoa, associada à culpa, intenção ou capacidade de causar dano, e mantém a força de רָעָה como “mal”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A terceira pessoa em “o seu servo” segue o Texto Massorético; a metáfora “em minhas mãos” é preservada por ser clara no contexto e por carregar mais de uma nuance possível.
