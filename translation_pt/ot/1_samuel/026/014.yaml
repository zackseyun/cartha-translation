  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: pt
  text: 'Então Davi gritou para as tropas e para Abner, filho de Ner: “Você não vai responder, Abner?” Abner respondeu: “Quem é você, que está gritando para o rei?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: as tropas
  rationale: No contexto do acampamento militar de Saul, o coletivo designa os homens armados presentes; “as tropas” comunica naturalmente esse referente.
- source_word: וַיִּקְרָא ... אֶל
  choice: gritou para
  rationale: Davi fala à distância, de modo que “gritou para” expressa melhor a ação contextual do que o simples “chamou”.
- source_word: קָרָאתָ אֶל־הַמֶּלֶךְ
  choice: está gritando para o rei
  rationale: Mantém a repetição lexical de קרא e exprime uma ação em curso dirigida ao rei.
- source_word: הֲלוֹא תַעֲנֶה
  choice: Você não vai responder?
  rationale: Reproduz a pergunta que espera resposta afirmativa, em português corrente.
