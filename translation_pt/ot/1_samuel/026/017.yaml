  text: וַ/יַּכֵּ֤ר שָׁאוּל֙ אֶת ק֣וֹל דָּוִ֔ד וַ/יֹּ֕אמֶר הֲ/קוֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יֹּ֣אמֶר דָּוִ֔ד קוֹלִ֖/י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: pt
  text: 'Então Saul reconheceu a voz de Davi e perguntou: “É a sua voz, meu filho Davi?” Davi respondeu: “É a minha voz, meu senhor, o rei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: reconheceu
  rationale: O verbo נכר indica aqui reconhecer ou identificar por meio da percepção; Saul reconhece que a voz é de Davi.
- source_word: קוֹל
  choice: voz
  rationale: Embora קוֹל também possa significar som, o contexto identifica quem fala, e o termo é repetido no diálogo.
- source_word: הֲקוֹלְךָ זֶה
  choice: É a sua voz?
  rationale: Reproduz naturalmente em português a pergunta hebraica formada pela partícula interrogativa, 'sua voz' e o demonstrativo.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva a forma masculina e o peso relacional da maneira como Saul se dirige a Davi.
- source_word: קוֹלִי
  choice: É a minha voz
  rationale: Mantém o foco lexical do hebraico em 'voz' e explicita apenas a cópula subentendida na frase nominal.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: אֲדֹנִי é aqui tratamento respeitoso dirigido a uma pessoa, não título divino; a aposição com vírgula comunica com clareza o título real.
- source_word: דָּוִד / שָׁאוּל
  choice: Davi / Saul
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
theological_decisions:
- issue: Tratamento relacional בְּנִי na fala de Saul
  choice: meu filho
  alternative: meu jovem; meu rapaz
  rationale: A tradução literal conserva a tensão narrativa de Saul usar linguagem familiar para Davi apesar de sua hostilidade, sem neutralizar o substantivo masculino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de 'voz' foi preservada por corresponder à estrutura e à ênfase do hebraico. 'Perguntou' e 'respondeu' explicitam a função discursiva natural dos dois וַיֹּאמֶר sem alterar o conteúdo.
