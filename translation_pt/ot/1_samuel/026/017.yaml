  source_fidelity: 'O texto traduz com precisão a sequência hebraica: Saul reconhece a voz de Davi, pergunta se é a voz dele e recebe a confirmação de Davi. A repetição de "voz" preserva adequadamente קוֹל/קוֹלִי. "Meu filho Davi" reproduz בְּנִי דָוִד sem atenuar o tratamento masculino e relacional. "Meu senhor, o rei" comunica corretamente o tratamento humano respeitoso אֲדֹנִי הַמֶּלֶךְ.'
