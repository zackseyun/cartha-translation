  terminology: Os nomes "Saul" e "Davi" seguem o uso português estabelecido. "Voz", "meu filho" e "meu senhor, o rei" são escolhas consistentes com o contexto narrativo e com o registro respeitoso da cena; não introduzem leitura teológica indevida.
