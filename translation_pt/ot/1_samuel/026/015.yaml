base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: pt
  text: 'Davi disse a Abner: “Você não é homem? E quem é como você em Israel?[a] Por que, então, não vigiou o seu senhor, o rei? Pois um do povo[b] veio para destruir o rei, seu senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E quem se iguala a você em Israel?”'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “um do povo”, isto é, uma pessoa dentre os que estavam no acampamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: Você não é homem?
  rationale: Preserva a pergunta retórica direta e o sentido literal de אִישׁ, sem acrescentar qualificativos como “valente” que não estão expressos no hebraico.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: E quem é como você em Israel?
  rationale: Mantém a forma comparativa do hebraico e sua implicação contextual de que Abner não tinha igual em Israel.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: Então, por que não ficou de guarda junto a
  rationale: Comunica a vigilância protetora exigida no contexto militar, preservando também a relação expressa pela preposição אֶל.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: seu senhor, o rei
  rationale: “Senhor” expressa a relação hierárquica de Abner com Saul, e a aposição identifica esse senhor como o rei.
- source_word: כִּי בָא אַחַד הָעָם
  choice: Pois um do povo veio
  rationale: Reproduz de perto a expressão hebraica אַחַד הָעָם, sem especificar além do texto que se tratava de soldado ou guerreiro.
- source_word: לְהַשְׁחִית
  choice: para destruir
  rationale: Verte diretamente o hifil de שׁחת. Embora no contexto a destruição implicasse matar o rei, evita substituir o termo por uma explicitação interpretativa.
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: o rei, seu senhor
  rationale: Conserva a ordem e a repetição enfática do hebraico, que reforçam a responsabilidade de Abner para com o rei.
theological_decisions: []
