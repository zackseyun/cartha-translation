source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: pt
  text: 'Então Saul disse: “Pequei. Volte, meu filho Davi, pois não lhe farei mais mal, porque hoje a minha vida foi preciosa aos seus olhos. Veja, agi como um insensato e errei muitíssimo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָטָאתִי
  choice: Pequei
  rationale: O perfeito qal na confissão direta de Saul é expresso naturalmente pelo pretérito perfeito em português.
- source_word: שׁוּב
  choice: Volte
  rationale: Preserva o imperativo e a convocação direta, sem especificar além do texto o lugar ao qual Davi deveria voltar.
- source_word: בְּנִי דָוִד
  choice: meu filho Davi
  rationale: Mantém tanto a linguagem relacional quanto o nome no vocativo.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: não lhe farei mais mal
  rationale: Expressa de forma idiomática o hifil de רעע, que aqui significa causar ou fazer mal a alguém.
- source_word: תַּחַת אֲשֶׁר
  choice: porque
  rationale: A construção introduz a razão da promessa de Saul neste contexto.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: a minha vida foi preciosa aos seus olhos
  rationale: נֶפֶשׁ designa concretamente a vida de Saul, poupada por Davi; a formulação também preserva a imagem hebraica de algo precioso aos olhos de alguém.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Forma natural e atual em português para a expressão temporal hebraica.
- source_word: הִנֵּה
  choice: Veja
  rationale: Funciona como marcador discursivo que chama atenção para a admissão final de Saul, sem arcaísmo.
- source_word: הִסְכַּלְתִּי
  choice: agi como um insensato
  rationale: Comunica comportamento insensato, e não apenas falta abstrata de inteligência.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: errei muitíssimo
  rationale: שגה pode significar errar ou desviar-se; o advérbio intensivo duplo é representado claramente por “muitíssimo”, sem reduzir a gravidade a um simples engano.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na confissão de Saul
  choice: a minha vida
  alternative: a minha alma
  rationale: No contexto narrativo, Davi poupou a vida física de Saul. A escolha evita introduzir uma afirmação antropológica sobre uma alma imaterial que o versículo não exige.
- issue: Força da admissão final de Saul
  choice: agi como um insensato e errei muitíssimo
  alternative: fui insensato e me desviei muito
  rationale: A tradução mantém a confissão de conduta insensata e de erro grave, sem decidir se Saul descreve apenas um engano pontual ou um desvio moral mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o tom direto da confissão e da promessa de Saul, evitando tanto arcaísmos como explicitações doutrinárias.
