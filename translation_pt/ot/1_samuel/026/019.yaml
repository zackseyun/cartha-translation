  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: pt
  text: 'Agora, pois, que o meu senhor, o rei, ouça, por favor, as palavras do seu servo. Se foi o SENHOR que o incitou contra mim, que ele aceite uma oferta[a]. Mas, se foram homens, eles são amaldiçoados diante do SENHOR, pois hoje me expulsaram, impedindo-me de ter parte na herança do SENHOR[b], dizendo: “Vá servir outros deuses”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “que ele cheire uma oferta”, expressão idiomática que significa aceitar favoravelmente um sacrifício ou uma oferta.
    reason: lexical_alternative
  - marker: b
    text: Ou “impedindo-me de me associar à herança do SENHOR”. A expressão hebraica pode destacar estar ligado ou incluído no povo e na terra que constituem a porção do SENHOR.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Mantém a transição temporal e a força conectiva do hebraico em português natural.
- source_word: יִשְׁמַע נָא
  choice: que ... ouça, por favor
  rationale: Expressa o pedido deferente do jussivo acompanhado de נָא, sem convertê-lo numa ordem brusca.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o meu senhor, o rei
  rationale: Preserva a forma respeitosa de tratamento da corte; aqui “senhor” se refere a Saul, não à divindade.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: as palavras do seu servo
  rationale: Conserva o modo humilde de Davi falar de si mesmo na terceira pessoa diante do rei.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: Se foi o SENHOR que o incitou contra mim
  rationale: O verbo causativo pode significar incitar, instigar ou impelir. “Incitou” preserva sua força sem explicar a relação entre ação divina e responsabilidade humana.
- source_word: יָרַח מִנְחָה
  choice: que ele aceite uma oferta
  rationale: Traduz o sentido idiomático de “cheirar uma oferta”, isto é, recebê-la favoravelmente, deixando a imagem literal em nota.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: Mas, se foram seres humanos
  rationale: Marca o contraste entre a ação do SENHOR e a de agentes humanos, com formulação inclusiva e natural.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: eles são amaldiçoados diante do SENHOR
  rationale: Mantém a construção como declaração, e não como pedido ou imprecação, preservando também a expressão judicial “diante do SENHOR”.
- source_word: גֵרְשׁוּנִי
  choice: me expulsaram
  rationale: Comunica a exclusão forçada de Davi de sua terra e comunidade.
- source_word: מֵהִסְתַּפֵּחַ
  choice: impedindo-me de ter parte
  rationale: Expressa no contexto o efeito de ser excluído da associação e participação na herança, enquanto a alternativa mais formal fica registrada em nota.
- source_word: בְּנַחֲלַת יְהוָה
  choice: na herança do SENHOR
  rationale: Preserva a amplitude da expressão, que pode abranger tanto a terra como o povo da aliança pertencentes ao SENHOR.
- source_word: לֵאמֹר
  choice: como quem diz
  rationale: Mostra que a expulsão equivalia, em seus efeitos, à ordem citada, sem exigir que os adversários tenham pronunciado literalmente essas palavras.
- source_word: לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: Vá servir outros deuses
  rationale: Reproduz os imperativos no singular dirigidos a Davi em português atual.
theological_decisions:
- issue: O SENHOR incitar Saul contra Davi
  choice: Manter a afirmação condicional de possível ação divina sem explicar seu modo.
  alternative: Interpretar a frase como causação divina direta ou apenas como permissão providencial.
  rationale: O hebraico não resolve a relação entre causalidade divina e agência humana; a tradução conserva essa tensão.
- issue: A exclusão da “herança do SENHOR”
  choice: Empregar linguagem ampla de participação na herança do SENHOR.
  alternative: Restringir a expressão somente à terra física ou somente ao acesso ao culto.
  rationale: No contexto, a expressão pode englobar a terra, o povo e a vida religiosa da aliança; não convém estreitá-la sem apoio explícito.
- issue: A ordem para servir outros deuses
  choice: Apresentá-la como a implicação prática da expulsão, introduzida por “como quem diz”.
  alternative: Entendê-la necessariamente como citação literal dos perseguidores de Davi.
  rationale: לֵאמֹר pode introduzir o sentido ou efeito da ação; a formulação mantém essa abertura contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A deferência cortesã aparece em “meu senhor, o rei” e “seu servo”. O nome divino é representado por “SENHOR” em versaletes convencionais. As notas foram posicionadas junto às expressões que de fato explicam.
