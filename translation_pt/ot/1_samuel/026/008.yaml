  text: וַ/יֹּ֤אמֶר אֲבִישַׁי֙ אֶל דָּוִ֔ד סִגַּ֨ר אֱלֹהִ֥ים הַ/יּ֛וֹם אֶת אוֹיִבְ/ךָ֖ בְּ/יָדֶ֑/ךָ וְ/עַתָּה֩ אַכֶּ֨/נּוּ נָ֜א בַּ/חֲנִ֤ית וּ/בָ/אָ֨רֶץ֙ פַּ֣עַם אַחַ֔ת וְ/לֹ֥א אֶשְׁנֶ֖ה לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: pt
  text: 'Então Abisai disse a Davi: “Hoje Deus entregou o seu inimigo em suas mãos.[a] Agora, por favor, deixe-me cravá-lo ao chão com a lança, de uma só vez,[b] e não o golpearei uma segunda vez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Hoje Deus pôs o seu inimigo sob o seu poder”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “com a lança e na terra, uma vez”; o sentido parece ser prendê-lo ao chão com a lança em uma única estocada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: entregou
  rationale: No contexto, o verbo indica que alguém foi colocado sob o poder de outro. “Entregou” é natural em português e preserva o sentido militar e providencial.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto e a construção verbal apontam para Deus como agente singular.
- source_word: אוֹיִבְךָ
  choice: o seu inimigo
  rationale: Equivalente direto e corrente do substantivo com sufixo de segunda pessoa masculina singular.
- source_word: בְּיָדֶךָ
  choice: em suas mãos
  rationale: Preserva a imagem idiomática hebraica de estar sob o poder de alguém, em formulação natural no português.
- source_word: אַכֶּנּוּ נָא
  choice: por favor, deixe-me atravessá-lo
  rationale: A forma volitiva expressa o pedido de Abisai. “Atravessá-lo” explicita, no contexto da lança e do chão, um golpe que perfura, sem reduzir a ação a um golpe superficial.
- source_word: בַּחֲנִית
  choice: com a lança
  rationale: O artigo definido aponta para a lança presente na cena.
- source_word: וּבָאָרֶץ
  choice: até o chão
  rationale: Em combinação com o golpe de lança, indica que a vítima seria transpassada e presa ao chão; “até o chão” conserva essa direção sem tornar a frase artificial.
- source_word: פַּעַם אַחַת
  choice: de um só golpe
  rationale: Expressa de modo idiomático que uma única estocada seria suficiente.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: e não precisarei golpeá-lo uma segunda vez
  rationale: O verbo significa repetir ou fazer novamente; o objeto implícito é o golpe. “Não precisarei” comunica a afirmação de Abisai de que um único golpe bastaria.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Então Abisai disse a Davi
  rationale: “Então” representa naturalmente o avanço da narrativa marcado pelo waw consecutivo.
theological_decisions:
- issue: Ação divina na vulnerabilidade de Saul
  choice: Hoje Deus entregou o seu inimigo em suas mãos
  alternative: Hoje Deus pôs o seu inimigo sob o seu poder
  rationale: A tradução mantém a interpretação providencial expressa por Abisai, sem acrescentar que Deus aprovava a morte de Saul. Assim, preserva-se a tensão entre a alegação de Abisai e a resposta posterior de Davi.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem concreta da mão, da lança e do chão, esclarecendo apenas as elipses necessárias para uma leitura natural.
