- from: Então Davi passou para o outro lado e ficou no topo do monte, à distância[a]; havia um grande espaço entre eles.
  to: Então Davi atravessou para o outro lado e ficou de pé no alto do monte, a certa distância[a]; havia uma grande distância entre eles.
