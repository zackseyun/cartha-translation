translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição semântica entre “à distância” e “um grande espaço entre eles” foi mantida por refletir a formulação enfática do hebraico.
