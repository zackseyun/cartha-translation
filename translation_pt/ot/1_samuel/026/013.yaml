  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: pt
  text: Então Davi atravessou para o outro lado e ficou de pé no alto do monte, a certa distância[a]; havia uma grande distância entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então Davi atravessou para o outro lado e ficou de pé no alto do monte, de longe; grande era o espaço entre eles”. O hebraico diz literalmente: “grande era o espaço/lugar entre eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passou
  rationale: O verbo עבר indica aqui o movimento de um lado para outro. “Passou” é natural em português e, com o complemento “para o outro lado”, preserva claramente esse sentido.
- source_word: הָעֵבֶר
  choice: o outro lado
  rationale: A expressão designa o lado oposto ou além. “O outro lado” é idiomático e adequado à geografia da narrativa.
- source_word: וַיַּעֲמֹד
  choice: ficou
  rationale: Embora o sentido básico seja “pôs-se de pé” ou “permaneceu”, neste contexto o verbo descreve Davi tomando posição no topo do monte. “Ficou” comunica isso com naturalidade, sem acrescentar intenção não explicitada.
- source_word: עַל רֹאשׁ הָהָר
  choice: no topo do monte
  rationale: רֹאשׁ, literalmente “cabeça”, tem aqui o sentido topográfico de “topo” ou “cume”. “Monte” é uma tradução corrente de הָר neste contexto.
- source_word: מֵרָחֹק
  choice: à distância
  rationale: A expressão indica separação espacial. “À distância” é clara e natural em português moderno.
- source_word: רַב הַמָּקוֹם
  choice: havia um grande espaço
  rationale: O hebraico diz literalmente “grande era o lugar/espaço”. A formulação escolhida conserva a imagem concreta de uma ampla separação e soa natural em português.
- source_word: בֵּינֵיהֶם
  choice: entre eles
  rationale: A expressão assinala que o espaço separava Davi do grupo do outro lado, sem explicitar além do que o hebraico afirma.
