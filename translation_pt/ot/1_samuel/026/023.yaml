  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: pt
  text: E Yahweh retribuirá a cada homem a sua retidão e a sua fidelidade,[a] pois Yahweh hoje entregou você em minha mão, mas eu não quis estender a minha mão contra o ungido de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh fará voltar a cada homem a sua retidão e a sua fidelidade”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o rei ungido por Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: Mantém a ligação discursiva da conjunção e representa diretamente o nome divino יהוה como “Yahweh”.
- source_word: יָשִׁיב לָאִישׁ
  choice: retribuirá a cada homem
  rationale: O hifil de שוב expressa aqui fazer voltar algo em forma de recompensa ou retribuição. “A cada homem” preserva o singular masculino genérico do hebraico.
- source_word: אֶת צִדְקָתוֹ וְאֶת אֱמֻנָתוֹ
  choice: a sua justiça e a sua fidelidade
  rationale: צְדָקָה indica a conduta reta ou integridade demonstrada, enquanto אֱמוּנָה denota fidelidade e confiabilidade na conduta.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: pois hoje Yahweh entregou você em minhas mãos
  rationale: A oração explica a ocasião em que a retidão e a fidelidade de Davi foram demonstradas. “Em minhas mãos” comunica naturalmente o idioma hebraico de colocar alguém sob o poder de outra pessoa.
- source_word: וְלֹא אָבִיתִי
  choice: mas eu não quis
  rationale: אבה com negação exprime falta de disposição ou recusa. “Não quis” preserva essa nuance, e “mas” explicita o contraste entre a oportunidade e a contenção.
- source_word: לִשְׁלֹחַ יָדִי
  choice: estender a mão
  rationale: Conserva a imagem do idioma hebraico, que neste contexto significa agir com violência contra alguém.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: contra o ungido de Yahweh
  rationale: מָשִׁיחַ significa “ungido” e aqui designa Saul em sua condição de rei ungido por Yahweh, sem impor ao contexto o sentido posterior do título “Messias”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Masculino genérico em אִישׁ
  choice: cada homem
  alternative: cada pessoa
  rationale: A escolha preserva a forma masculina singular e seu valor representativo no hebraico, sem restringir indevidamente a máxima a um indivíduo específico.
- issue: Sentido de מָשִׁיחַ aplicado a Saul
  choice: o ungido de Yahweh
  alternative: o Messias de Yahweh
  rationale: No contexto histórico, a expressão é uma designação régia de Saul. “Ungido” evita introduzir uma especificidade cristológica que este uso imediato não exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva expressões hebraicas reconhecíveis, como “estender a mão”, sem sacrificar a compreensão. A vírgula antes de [a] encerra o primeiro membro da frase, e a nota [b] foi colocada junto à expressão que explica.
