  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד מְרַגְּלִ֑ים וַ/יֵּ֕דַע כִּֽי בָ֥א שָׁא֖וּל אֶל נָכֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/004.yaml
  text: So David sent out scouts[a], and he learned that Saul had indeed come.
translation:
  language: pt
  text: Então Davi enviou batedores e ficou sabendo que Saul realmente havia chegado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e confirmou que Saul havia chegado”. O termo hebraico final é difícil e provavelmente acrescenta uma ideia de certeza ou confirmação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O verbo שׁלח significa “enviar”; a forma narrativa dá continuidade direta aos acontecimentos.
- source_word: מְרַגְּלִים
  choice: batedores
  rationale: No contexto militar, designa homens enviados para observar ou reconhecer o terreno; “batedores” é natural e evita a conotação predominantemente política de “espiões”.
- source_word: וַיֵּדַע
  choice: ficou sabendo
  rationale: Embora ידע possa significar “saber”, aqui expressa a obtenção de informação após o envio dos batedores.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da informação obtida por Davi.
- source_word: בָא
  choice: havia chegado
  rationale: O perfeito apresenta a chegada de Saul como fato já consumado quando Davi recebeu a informação.
- source_word: אֶל נָכוֹן
  choice: realmente
  rationale: A expressão difícil é entendida adverbialmente, com nuance de certeza ou confirmação; a nota preserva a dificuldade e a alternativa sem sobrecarregar o texto.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
