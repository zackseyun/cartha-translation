  text: וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּ֨רֶד֙ אֶל מִדְבַּר זִ֔יף וְ/אִתּ֛/וֹ שְׁלֹֽשֶׁת אֲלָפִ֥ים אִ֖ישׁ בְּחוּרֵ֣י יִשְׂרָאֵ֑ל לְ/בַקֵּ֥שׁ אֶת דָּוִ֖ד בְּ/מִדְבַּר זִֽיף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: pt
  text: Então Saul se levantou e desceu ao deserto de Zife; com ele estavam três mil homens escolhidos de Israel, para procurar Davi no deserto de Zife.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal narrativo de קום marca o início de uma ação decidida. “Se levantou” conserva o modo de expressão hebraico e é natural em português neste contexto.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva diretamente o sentido direcional de ירד e se liga com naturalidade ao destino introduzido por “ao”.
- source_word: אֶל מִדְבַּר זִיף
  choice: ao deserto de Zife
  rationale: מִדְבָּר designa uma região erma e pouco habitada, não necessariamente arenosa. “Deserto” é a designação bíblico-geográfica corrente e inteligível em português; “Zife” segue a forma tradicional portuguesa do topônimo.
- source_word: וְאִתּוֹ
  choice: com ele estavam
  rationale: Expressa a circunstância de acompanhamento e mantém a frase inicial em destaque, sem a redundância de formulações como “com três mil homens consigo”.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: três mil homens
  rationale: Reproduz a construção hebraica sem acrescentar “soldados”, embora o contexto militar seja evidente.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: homens escolhidos de Israel
  rationale: O termo designa homens selecionados, provavelmente tropas de elite. “Escolhidos” preserva a ideia lexical sem explicitar além do texto.
- source_word: לְבַקֵּשׁ
  choice: para procurar
  rationale: No contexto de perseguição e localização de uma pessoa, “procurar” comunica naturalmente o sentido de בקש em português moderno.
- source_word: אֶת דָּוִד
  choice: Davi
  rationale: A partícula de objeto direto אֶת não recebe tradução; o nome segue sua forma portuguesa consagrada.
- source_word: בְּמִדְבַּר זִיף
  choice: no deserto de Zife
  rationale: Mantém a repetição geográfica do hebraico, em vez de suprimi-la como estilisticamente redundante.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A ordem da oração circunstancial foi preservada de modo natural, e a repetição de “deserto de Zife” foi mantida por corresponder ao texto hebraico.
