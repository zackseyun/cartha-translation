  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: pt
  text: 'Davi disse: “Tão certo como vive Yahweh, certamente Yahweh o ferirá[a]; ou chegará o seu dia, e ele morrerá; ou ele descerá à batalha e perecerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o abaterá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz de modo natural e solene a fórmula hebraica de juramento, mantendo a afirmação de que Yahweh vive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי אִם
  choice: certamente
  rationale: No contexto do juramento, introduz enfaticamente a convicção de Davi; a escolha evita tratá-lo como uma exceção lógica rígida.
- source_word: יִגָּפֶנּוּ
  choice: o ferirá
  rationale: Mantém em aberto o modo pelo qual Yahweh atingirá Saul, sem acrescentar explicitamente a morte, embora ela esteja implícita no contexto.
- source_word: יוֹמוֹ יָבוֹא
  choice: chegará o seu dia
  rationale: Preserva a expressão hebraica e seu tom ominoso, referindo-se ao tempo da morte de Saul.
- source_word: וָמֵת
  choice: e ele morrerá
  rationale: Expressa com clareza a oração coordenada hebraica, sem fundi-la com a expressão anterior.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: ele descerá à batalha
  rationale: Conserva o verbo de movimento יָרַד e usa uma construção portuguesa concisa e compreensível.
- source_word: וְנִסְפָּה
  choice: e perecerá
  rationale: Preserva a nuance distinta de סָפָה em relação ao verbo anterior 'morrer', comunicando destruição em batalha.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Agência divina na morte de Saul
  choice: Yahweh o ferirá
  alternative: Yahweh o matará
  rationale: A formulação conserva a amplitude lexical de נָגַף e não torna mais explícito do que o hebraico o modo da ação divina.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A estrutura em três possibilidades foi mantida, assim como a diferença lexical entre “morrerá” e “perecerá”.
