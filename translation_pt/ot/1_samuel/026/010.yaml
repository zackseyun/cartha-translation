  source_fidelity: O texto preserva com precisão a fórmula solene de juramento חי יהוה, a ênfase asseverativa de כי אם e as três possibilidades coordenadas apresentadas por Davi. “O ferirá” reproduz adequadamente יגפנו sem especificar o meio do golpe; “chegará o seu dia, e ele morrerá” mantém a sequência יוֹמוֹ יָבוֹא וָמֵת; e “descerá à batalha e perecerá” conserva tanto o movimento de ירד como a nuance de consumação em נספה.
