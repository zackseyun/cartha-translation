  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: pt
  text: Então Davi pegou a lança e o jarro de água de junto à cabeça de Saul[a], e os dois foram embora. Ninguém viu, ninguém percebeu e ninguém acordou, pois todos dormiam, porque um sono profundo vindo de Yahweh[b] havia caído sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica se refere à área junto à cabeça de Saul, ou à sua cabeceira, enquanto ele dormia.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “um sono profundo de Yahweh havia caído sobre eles”. A expressão indica que o sono procedia da ação de Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: a lança
  rationale: חֲנִית designa uma lança; esta é a palavra portuguesa comum e natural no contexto militar.
- source_word: צַפַּחַת הַמַּיִם
  choice: o jarro de água
  rationale: צַפַּחַת designa um recipiente, como jarro ou cantil. “Jarro de água” é concreto, claro e corrente.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: que estavam junto à cabeça de Saul
  rationale: A expressão hebraica indica o lugar à cabeceira ou junto da cabeça de Saul enquanto ele dormia, não objetos literalmente sobre sua cabeça. O plural verbal implícito em português foi explicitado para ligar naturalmente os dois objetos ao local.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: e os dois foram embora
  rationale: O verbo plural refere-se a Davi e Abisai. “Os dois” esclarece o sujeito recuperável do contexto, e “foram embora” transmite naturalmente a partida.
- source_word: וְאֵין רֹאֶה
  choice: Ninguém viu
  rationale: A construção אֵין mais particípio é vertida de forma idiomática como uma negação indefinida.
- source_word: וְאֵין יוֹדֵעַ
  choice: ninguém percebeu
  rationale: יָדַע neste contexto expressa conhecimento ou consciência do ocorrido; “percebeu” comunica essa falta de percepção sem exigir objeto explícito.
- source_word: וְאֵין מֵקִיץ
  choice: ninguém acordou
  rationale: O particípio de קיץ significa despertar; “acordou” é a forma corrente no português moderno.
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: pois todos dormiam
  rationale: A formulação preserva a explicação imediata e o estado contínuo expresso pelo particípio.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: um sono profundo vindo de Yahweh
  rationale: תַּרְדֵּמָה é sono profundo. O genitivo com o nome divino pode indicar origem ou ação; “vindo de” comunica a procedência sem transformar a construção nominal em uma afirmação causativa mais explícita que o hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico em vez de substituí-lo por um título.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: havia caído sobre eles
  rationale: Preserva a imagem hebraica de o sono cair sobre alguém, usando o mais-que-perfeito composto para indicar que o estado já vigorava durante a ação de Davi.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Relação entre Yahweh e o sono profundo em תַּרְדֵּמַת יְהוָה
  choice: um sono profundo vindo de Yahweh
  alternative: Yahweh fez cair sobre eles um sono profundo; um sono profundo de Yahweh
  rationale: A formulação escolhida conserva a origem divina indicada pelo genitivo, sem apagar a construção do original nem tornar a causalidade mais explícita do que ela é.
translation_notes:
  register: Português moderno, digno e narrativo, com ampla legibilidade brasileira. A repetição tripla de “ninguém” preserva a ênfase do hebraico. O nome Yahweh é mantido, e a nota lexical esclarece o hebraísmo espacial.
