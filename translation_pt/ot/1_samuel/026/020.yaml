  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: pt
  text: Agora, não permita que o meu sangue caia por terra longe da presença de Yahweh, pois o rei de Israel saiu em busca de uma única pulga, como quem persegue uma perdiz[a] pelos montes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico designa uma ave conhecida por seu chamado, tradicionalmente identificada como a perdiz.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: דָּמִי
  choice: o meu sangue
  rationale: Mantém a imagem concreta do hebraico, que evoca morte violenta e culpa de sangue; “a minha vida” atenuaria essa força.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: não permita que ... caia por terra
  rationale: Expressa de modo natural em português a súplica dirigida a Saul e conserva a imagem do sangue derramado no chão.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: longe da presença de Yahweh
  rationale: “Presença” traduz idiomaticamente פְּנֵי, enquanto “longe de” comunica a separação espacial indicada por מִנֶּגֶד sem a rigidez de uma tradução palavra por palavra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: יָצָא
  choice: saiu
  rationale: Conserva o verbo de movimento e é natural para descrever o rei que partiu em perseguição.
- source_word: לְבַקֵּשׁ
  choice: em busca de
  rationale: Preserva o sentido amplo de procurar sem introduzir antecipadamente a ideia interpretativa mais forte de “caçar” ou “eliminar”.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: uma única pulga
  rationale: Mantém a metáfora autodepreciativa de Davi e a ênfase de אֶחָד.
- source_word: הַקֹּרֵא
  choice: uma perdiz
  rationale: Segue a identificação tradicional e contextualmente adequada da ave, deixando em nota a incerteza lexical.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: persegue ... pelos montes
  rationale: Mantém o verbo de perseguição e o cenário montanhoso em português corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; a transliteração preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Sentido de מִנֶּגֶד פְּנֵי יְהוָה
  choice: longe da presença de Yahweh
  alternative: fora da presença de Yahweh
  rationale: A formulação mantém a dimensão espacial e relacional do hebraico, possivelmente associada ao afastamento da terra e do santuário, sem tornar essa associação contextual explícita no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. “Não permita” evita o tom excessivamente arcaico de “não deixes”; “pelos montes” preserva o cenário sem rigidez literal.
