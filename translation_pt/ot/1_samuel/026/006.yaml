base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: pt
  text: 'Então Davi respondeu e disse a Aimeleque, o hitita, e a Abisai, filho de Zeruia e irmão de Joabe: “Quem descerá comigo até Saul, até o acampamento?[a]” Abisai respondeu: “Eu descerei com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “Quem descerá comigo até Saul, no acampamento?” O hebraico repete “até” antes de “Saul” e de “o acampamento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Então Davi tomou a palavra e disse
  rationale: A fórmula narrativa hebraica combina ‘respondeu’ e ‘disse’. ‘Tomou a palavra e disse’ conserva a ideia de uma resposta ou intervenção verbal sem produzir a construção pouco natural ‘respondeu e disse’ em português.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: Aimeleque, o hitita
  rationale: O nome próprio é transliterado segundo a forma portuguesa corrente, e o gentílico é traduzido como identificação étnica.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abisai, filho de Zeruia e irmão de Joabe
  rationale: Expressa com clareza e naturalidade as duas relações familiares presentes no hebraico.
- source_word: מִי יֵרֵד אִתִּי
  choice: Quem descerá comigo
  rationale: Mantém o sentido direcional de ירד, relevante para o movimento até o acampamento.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: até Saul, até o acampamento
  rationale: Preserva a repetição de אֶל antes de ‘Saul’ e de ‘acampamento’, bem como o destino duplo expresso pela construção hebraica.
- source_word: הַמַּחֲנֶה
  choice: o acampamento
  rationale: É uma tradução corrente e natural de מַחֲנֶה no contexto militar.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: Eu descerei com você
  rationale: Repete o verbo direcional da pergunta de Davi e traduz עִמָּךְ em português moderno de ampla compreensão.
