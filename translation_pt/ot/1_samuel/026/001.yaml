  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: pt
  text: 'Então os zifeus foram até Saul, em Gibeá, e disseram: “Não está Davi escondido na colina de Haquilá, em frente ao deserto[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante de Jesimom” ou “em frente à região desolada”. A expressão hebraica pode empregar o termo como substantivo comum (“deserto” ou “região desolada”) ou como o nome regional Jesimom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então ... foram
  rationale: O wayyiqtol faz a narrativa avançar. “Então” marca naturalmente a progressão, e “foram até Saul” expressa o movimento em direção a ele.
- source_word: הַזִּפִים
  choice: os zifeus
  rationale: O plural gentílico designa os habitantes de Zife; “zifeus” preserva de modo conciso a identidade geográfica.
- source_word: הַגִּבְעָתָה
  choice: em Gibeá
  rationale: O hê direcional indica movimento para Gibeá. Depois de “foram até Saul”, “em Gibeá” identifica naturalmente onde Saul se encontrava sem repetir a ideia de direção.
- source_word: לֵאמֹר
  choice: e disseram
  rationale: O infinitivo introduz o discurso direto. Em português narrativo, “e disseram” é mais natural do que o decalque “dizendo” e mantém a função do hebraico.
- source_word: הֲלוֹא
  choice: Não está ...?
  rationale: A partícula introduz uma pergunta retórica que espera confirmação; a construção negativa preserva essa força em português corrente.
- source_word: מִסְתַּתֵּר
  choice: escondido
  rationale: O particípio hitpael de סתר descreve Davi mantendo-se oculto. “Está ... escondido” comunica com clareza o estado contínuo implicado.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: na colina de Haquilá
  rationale: גִּבְעָה normalmente significa “colina”, e a preposição בְּ é adequadamente representada por “na” neste contexto topográfico.
- source_word: עַל־פְּנֵי הַיְשִׁימֹן
  choice: em frente ao deserto
  rationale: A expressão geográfica עַל־פְּנֵי pode significar “diante de” ou “em frente a”. A tradução evita acrescentar a direção específica “a leste de”, enquanto “deserto” comunica o sentido comum de יְשִׁימוֹן; a nota preserva a possibilidade de nome regional.
