  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: pt
  text: 'Veja[a]: assim como a sua vida foi preciosa aos meus olhos neste dia, que também a minha vida seja preciosa aos olhos de Yahweh, e que ele me livre de toda aflição.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua vida foi grande aos meus olhos [...] que a minha vida seja grande aos olhos de Yahweh”. O idioma hebraico usa “grande” para expressar elevado valor ou preciosidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E veja
  rationale: Introduz com ênfase o que segue. “E veja” comunica essa função discursiva em português atual, sem o tom arcaico de “eis que”.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: assim como ... também
  rationale: Preserva claramente a estrutura comparativa entre a atitude de Davi para com Saul e o desejo dirigido a Yahweh.
- source_word: גָּדְלָה נַפְשְׁךָ ... בְּעֵינַי
  choice: a sua vida foi preciosa aos meus olhos
  rationale: 'Embora גָּדְלָה signifique literalmente “foi grande”, o idioma expressa aqui elevado valor: Davi poupou a vida de Saul por considerá-la preciosa.'
- source_word: נֶפֶשׁ
  choice: vida
  rationale: No contexto de poupar Saul e ser livrado do perigo, נֶפֶשׁ designa a vida da pessoa, não especificamente uma alma imaterial.
- source_word: הַיּוֹם הַזֶּה
  choice: neste dia
  rationale: Mantém a ênfase temporal do hebraico em registro digno e natural.
- source_word: תִּגְדַּל נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: que também a minha vida seja preciosa aos olhos de Yahweh
  rationale: O imperfeito expressa desejo ou oração. A repetição de “preciosa” conserva o paralelo com a primeira oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino presente no texto hebraico.
- source_word: וְיַצִּלֵנִי
  choice: e que ele me livre
  rationale: O hifil de נצל expressa livramento ou resgate; a construção com “que” preserva o valor volitivo ligado ao pedido anterior.
- source_word: מִכָּל צָרָה
  choice: de toda aflição
  rationale: צָרָה abrange angústia, adversidade e situação de perigo. “Toda aflição” preserva a amplitude e a gravidade da expressão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Valor dos imperfeitos תִּגְדַּל e וְיַצִּלֵנִי
  choice: 'desejo ou oração: “que ... seja” e “que ... me livre”'
  alternative: 'afirmação futura: “será” e “ele me livrará”'
  rationale: O contexto e o paralelismo favorecem um desejo dirigido a Deus, mas a forma hebraica também pode ser lida com nuance de expectativa futura; a tradução não transforma a frase em promessa divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “A sua vida” evita ambiguidade imediata e “aos meus olhos” preserva o idioma bíblico ainda corrente. A formulação mantém o paralelismo e a tensão entre desejo e expectativa.
