base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: pt
  text: 'Mas Davi disse a Abisai: “Não o destrua, pois quem pode estender a mão contra o ungido de Yahweh[a] e ficar sem culpa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ungido” está na origem da palavra “Messias”. Aqui ele se refere a Saul como rei ungido por Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Davi disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Mas” explicita o contraste contextual, pois Davi se opõe à proposta de Abisai.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Não o destrua
  rationale: O hifil de שׁחת pode significar destruir ou arruinar. No contexto, implica matar Saul, mas “destrua” preserva a amplitude do verbo hebraico sem tornar implícito o sentido letal.
- source_word: כִּי מִי
  choice: pois quem pode
  rationale: כִּי introduz a razão da proibição, e a pergunta retórica com מִי trata da possibilidade de agir assim sem culpa.
- source_word: שָׁלַח יָדוֹ
  choice: estender a mão
  rationale: Mantém a imagem do idioma hebraico, que aqui significa agir contra alguém, especialmente de modo violento.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: contra o ungido de Yahweh
  rationale: מָשִׁיחַ significa “ungido” e, neste contexto histórico, designa Saul como rei consagrado por Yahweh. A preposição é naturalmente vertida por “contra” dentro desta expressão.
- source_word: וְנִקָּה
  choice: e ficar sem culpa
  rationale: נקה comunica estar livre de culpa ou responsabilidade. “Ficar sem culpa” preserva o foco moral sem limitar o sentido à ausência de castigo.
theological_decisions:
- issue: Sentido de מְשִׁיחַ em referência a Saul
  choice: o ungido de Yahweh
  alternative: o Messias de Yahweh
  rationale: Aqui o termo se refere ao rei Saul, ungido por Yahweh, e não funciona diretamente como o título escatológico “Messias”. A nota preserva a ligação lexical sem importar uma afirmação cristológica alheia ao contexto.
- issue: Força de וְנִקָּה
  choice: ficar sem culpa
  alternative: ficar impune
  rationale: A formulação conserva a dimensão de culpa objetiva; embora a impunidade possa estar implícita, o hebraico não deve ser reduzido apenas à consequência judicial.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A construção “estender a mão contra” preserva deliberadamente o idioma hebraico, enquanto “ficar sem culpa” comunica com naturalidade a força moral da pergunta retórica. O marcador da nota foi colocado junto de “ungido de Yahweh”, expressão à qual a nota se refere.
