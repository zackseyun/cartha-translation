  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: pt
  text: Que Yahweh me livre de estender a mão contra o ungido de Yahweh![a][b] Agora, porém, por favor, pegue a lança que está junto à cabeça dele e a vasilha de água,[c] e vamos embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Longe de mim, da parte de Yahweh”. Trata-se de uma expressão de forte recusa ou repulsa; a menção de Yahweh também pode ter força semelhante à de um juramento: “Longe de mim, por Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “o ungido de Yahweh”. A palavra traduzida como “ungido” está relacionada a “Messias”, mas aqui se refere a Saul como rei ungido por Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Ou “jarro de água” ou “cantil de água”; o termo hebraico indica um pequeno recipiente para líquidos, sem definir com precisão sua forma.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: Que Yahweh me livre
  rationale: A expressão hebraica comunica forte repulsa e recusa solene, com apelo a Yahweh. Esta formulação é natural em português e preserva a força religiosa do idioma; a nota registra a forma mais literal e a possível nuance de juramento.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: estender a mão
  rationale: Mantém a imagem idiomática hebraica de agir hostilmente contra alguém, sem substituir a figura por uma explicação.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: contra o ungido de Yahweh
  rationale: O contexto identifica Saul como o rei que Yahweh ungiu. “Ungido” preserva a ligação lexical com “Messias” sem transformar Saul em referente messiânico.
- source_word: וְעַתָּה
  choice: Agora, porém
  rationale: Marca com naturalidade a transição contrastiva entre a recusa de ferir Saul e a instrução seguinte.
- source_word: קַח נָא
  choice: por favor, pegue
  rationale: O imperativo é atenuado pela partícula נָא; a formulação transmite pedido cortês ou insistente em português corrente.
- source_word: הַחֲנִית
  choice: a lança
  rationale: Equivalente comum e claro para a arma indicada pelo termo hebraico.
- source_word: אֲשֶׁר מראשתו
  choice: que está junto à cabeça dele
  rationale: Expressa a localização da lança perto da cabeça de Saul enquanto ele dorme.
- source_word: צַפַּחַת הַמַּיִם
  choice: a vasilha de água
  rationale: O substantivo designa um pequeno recipiente. “Vasilha” evita especificar além da evidência se era jarro, cântaro ou cantil.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: e vamos embora
  rationale: Reproduz de modo natural o cohortativo plural que propõe a partida imediata.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Translitera o nome divino presente duas vezes no texto e mantém coerência com a orientação do projeto.
- issue: Sentido de מָשִׁיחַ neste contexto real
  choice: ungido
  alternative: Messias
  rationale: Aqui o termo se refere diretamente a Saul como rei ungido por Yahweh. “Ungido” conserva o sentido lexical e evita impor ao relato um título messiânico posterior.
- issue: Força de חָלִילָה לִּי מֵיהוָה
  choice: Que Yahweh me livre
  alternative: Longe de mim, por Yahweh
  rationale: A construção hebraica admite análise como fórmula de repulsa acompanhada de apelo solene ao nome divino. A tradução escolhida comunica essa força em português natural, enquanto a nota preserva a forma e a ambiguidade do idioma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe evita arcaísmos, conserva a imagem hebraica de “estender a mão” e usa “vamos embora” para expressar naturalmente a proposta de partida.
