revisions:
- from: Assim, Davi e Abisai foram de noite até as tropas[a]. Saul estava deitado, dormindo no meio do acampamento, com sua lança fincada no chão junto à cabeça; Abner e as tropas estavam deitados ao redor dele.
  to: Assim, Davi e Abisai foram de noite até as tropas. E eis que Saul estava deitado, dormindo dentro do acampamento[a], com sua lança fincada no chão junto à cabeça; Abner e as tropas estavam deitados ao redor dele.
  rationale: A revisão substitui «no meio do acampamento» por «dentro do acampamento», preservando a referência à formação circular sem impor que Saul estivesse no centro. Também torna explícita, de modo idiomático, a força narrativa de וְהִנֵּה e move a âncora da nota para o termo que ela esclarece.
