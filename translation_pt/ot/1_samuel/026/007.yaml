base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: pt
  text: Assim, Davi e Abisai foram de noite até as tropas. E eis que Saul estava deitado, dormindo dentro do acampamento[a], com sua lança fincada no chão junto à cabeça; Abner e as tropas estavam deitados ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dentro do círculo» — o hebraico provavelmente se refere à formação circular do acampamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: as tropas
  rationale: No contexto militar, refere-se aos homens que compunham a força de Saul, não ao povo em geral.
- source_word: לַיְלָה
  choice: de noite
  rationale: Expressa de modo natural em português o valor adverbial temporal do hebraico.
- source_word: וְהִנֵּה
  choice: Saul estava
  rationale: A construção apresenta vividamente a cena encontrada por Davi; em português corrente, a transição direta preserva o foco visual sem recorrer ao menos natural «e eis que».
- source_word: שֹׁכֵב יָשֵׁן
  choice: estava deitado, dormindo
  rationale: Preserva tanto a postura de Saul quanto seu estado de sono.
- source_word: בַּמַּעְגָּל
  choice: no meio do acampamento
  rationale: No contexto, designa a área protegida ou formação circular do acampamento; a formulação comunica essa posição central de modo claro.
- source_word: חֲנִיתוֹ
  choice: sua lança
  rationale: É o termo português comum e adequado para a arma de Saul.
- source_word: מְעוּכָה בָאָרֶץ
  choice: fincada no chão
  rationale: Comunica que a lança estava cravada ou firmemente introduzida no solo.
- source_word: מראשתו
  choice: junto à cabeça
  rationale: O termo hebraico indica idiomaticamente o lugar próximo à cabeça de alguém.
- source_word: סביבתו
  choice: ao redor dele
  rationale: Reproduz claramente a disposição espacial de Abner e das tropas em torno de Saul.
