base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: pt
  text: 'Davi respondeu e disse: “Aqui está a lança do rei. Que um dos jovens[b] passe para cá[a] e a pegue.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atravesse” ou “venha até aqui”; o verbo hebraico significa literalmente “passar” ou “atravessar”.
    reason: lexical_alternative
  - marker: b
    text: “Jovens” também pode ser traduzido como “servos” ou “assistentes”, pois o termo hebraico pode indicar tanto idade quanto posição subordinada, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Davi respondeu e disse
  rationale: Preserva os dois verbos da fórmula narrativa hebraica sem perder clareza em português.
- source_word: הִנֵּה
  choice: Aqui está
  rationale: Expressa de modo natural e atual a força dêitica da partícula, chamando atenção para a lança presente.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: a lança do rei
  rationale: “Lança” é o equivalente comum e acessível de חֲנִית; a construção com “do rei” reproduz naturalmente a relação possessiva.
- source_word: וְיַעֲבֹר
  choice: passe para cá
  rationale: O verbo עבר significa passar ou atravessar; “passe para cá” comunica tanto o deslocamento quanto a direção contextual em relação a Davi.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: um dos jovens
  rationale: Mantém o numeral substantivado e o sentido etário básico de נַעַר, sem excluir por nota os possíveis sentidos funcionais de servo ou assistente.
- source_word: וְיִקָּחֶהָ
  choice: e a pegue
  rationale: Traduz diretamente לקח; o pronome feminino retoma corretamente “lança” em português.
