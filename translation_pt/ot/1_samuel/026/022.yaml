translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A fórmula “respondeu e disse” conserva a estrutura hebraica, enquanto “passe para cá” evita uma formulação excessivamente literal ou arcaica.
