  naturalness: O português é moderno, claro e apropriado ao registro narrativo. «Davi viu ... e também Abner» é compreensível, mas repetir «viu» torna a coordenação elíptica do hebraico mais fluente e inequívoca em português.
  terminology: Davi, Saul, Abner e Ner estão bem grafados. «Comandante do exército de Saul» explicita de modo natural o referente do sufixo hebraico «seu exército», evitando uma ambiguidade portuguesa desnecessária.
