base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: pt
  text: Então Davi se levantou e foi ao lugar onde Saul estava acampado. Davi viu o lugar onde Saul estava deitado e viu também Abner, filho de Ner, comandante do exército de Saul. Saul estava deitado no círculo do acampamento[a], e o povo estava acampado ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «no círculo». A expressão provavelmente se refere à área interna ou central de um acampamento disposto em círculo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal narrativo de קום marca a ação seguinte; «se levantou» é natural e mantém a sequência do hebraico.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: foi ao lugar
  rationale: בוא com אֶל indica deslocamento até um local. Em português narrativo, «foi ao lugar» é mais natural do que «veio ao lugar» quando o ponto de vista acompanha Davi.
- source_word: חָנָה
  choice: estava acampado
  rationale: O qatal na oração relativa descreve a situação de Saul naquele lugar; esta formulação evita sugerir que ele já tivesse levantado o acampamento.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: viu o lugar
  rationale: ראה tem aqui o sentido direto de perceber visualmente ou observar o local.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: estava deitado ... estava deitado
  rationale: No contexto, ambas as formas descrevem o lugar e a postura atual de Saul. A repetição mantém a ligação lexical, embora o português não expresse naturalmente a diferença formal entre perfeito e particípio neste caso.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: e também Abner, filho de Ner, comandante do seu exército
  rationale: «E também» preserva a coordenação hebraica e deixa claro que Abner é outra pessoa vista por Davi, sem afirmar além do texto que estivesse deitado com Saul.
- source_word: בַּמַּעְגָּל
  choice: no centro do acampamento
  rationale: מַעְגָּל sugere literalmente um círculo ou disposição circular; no contexto militar, indica provavelmente a área interna ou central do acampamento. A nota conserva a imagem literal e a incerteza.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: estava acampado ao redor dele
  rationale: O particípio descreve a disposição contínua das tropas em torno de Saul; o singular coletivo «o povo estava» é idiomático em português.
