translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A tradução conserva a repetição enfática do hebraico por meio de “com certeza” e “certamente”, ao mesmo tempo que torna idiomática a primeira oração verbal.
