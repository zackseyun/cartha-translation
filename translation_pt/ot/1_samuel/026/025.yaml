base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: pt
  text: 'Então Saul disse a Davi: “Você é bendito, meu filho Davi! Certamente fará e certamente prevalecerá.”[a] Davi seguiu o seu caminho, e Saul voltou para o seu lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “fazendo, você fará; e sendo capaz, você será capaz”. As duas construções intensificam a certeza do futuro êxito de Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: Bendito seja você
  rationale: Preserva a fórmula de bênção dirigida diretamente a Davi. Em português corrente, o subjuntivo é a forma idiomática e digna de expressá-la, embora o hebraico use uma construção participial.
- source_word: בְּנִי דָוִד
  choice: meu filho Davi
  rationale: Mantém a forma de tratamento familiar ou patronal de Saul sem acrescentar uma interpretação afetiva.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: Com certeza realizará o que empreender
  rationale: A combinação do infinitivo absoluto com o imperfeito intensifica a afirmação. O objeto não está expresso; a formulação portuguesa comunica realização eficaz sem inserir explicitamente “grandes coisas”.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: e certamente prevalecerá
  rationale: A segunda construção intensiva significa literalmente que Davi certamente será capaz; no contexto, “prevalecerá” expressa sua capacidade efetiva de vencer ou ter êxito.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: Davi seguiu o seu caminho
  rationale: Expressão portuguesa natural para a partida de Davi, correspondente ao idiomatismo hebraico.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: e Saul voltou para o seu lugar
  rationale: Segue de perto o hebraico e evita especificar “casa”, algo que o texto não diz.
