  source_fidelity: A fórmula בָּרוּךְ אַתָּה é declarativa (“você é bendito”), não uma fórmula optativa; por isso, “Bendito seja você” altera levemente a força do enunciado. Além disso, “realizará o que empreender” introduz “o que empreender”, elemento que o hebraico não expressa. A tradução revista preserva a ênfase das duas construções de infinitivo absoluto sem acrescentar objeto ou atividade.
  naturalness: “Você é bendito, meu filho Davi” é português moderno, claro e digno, preservando o tom solene da fala. “Certamente fará” é elíptico como o hebraico, mas aceitável no registro narrativo elevado; “certamente prevalecerá” comunica naturalmente a segunda expressão enfática.
  terminology: “Bendito”, “meu filho Davi”, “prevalecerá”, “seguiu o seu caminho” e “voltou para o seu lugar” são adequados e não introduzem interpretação doutrinária ou geográfica. A nota é mantida e reposicionada junto às duas expressões que explica.
