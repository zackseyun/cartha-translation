source:
  edition: WLC
  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: pt
  text: 'Não foi bom o que você fez. Tão certo como Yahweh vive, vocês merecem morrer[a], porque não montaram guarda junto ao seu senhor, o ungido de Yahweh. Agora, veja: onde estão a lança do rei e o jarro de água que ficavam junto à cabeça dele?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “vocês são filhos da morte”, expressão que indica que são passíveis de morte ou merecem morrer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: Não foi bom o que você fez
  rationale: Reproduz de modo natural a avaliação hebraica לֹא טוֹב e a ação já concluída, sem intensificá-la para “foi mau”.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Expressa em português corrente a fórmula solene de juramento e mantém o nome divino.
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: vocês merecem morrer
  rationale: Comunica claramente a força judicial do idiomatismo hebraico, literalmente “vocês são filhos da morte”; a forma literal é preservada em nota.
- source_word: לֹא שְׁמַרְתֶּם עַל
  choice: não montaram guarda junto a
  rationale: No contexto militar, indica a falha dos homens encarregados de vigiar e proteger Saul.
- source_word: אֲדֹנֵיכֶם
  choice: seu senhor
  rationale: Designa Saul como superior dos guardas; “senhor” preserva a relação hierárquica sem ser confundido com Yahweh, nomeado explicitamente.
- source_word: מְשִׁיחַ יְהוָה
  choice: o ungido de Yahweh
  rationale: Mantém o título régio-sacral sem impor ao contexto uma identificação messiânica posterior.
- source_word: וְעַתָּה רְאֵה אֵי
  choice: 'Agora, vejam: onde estão'
  rationale: O hebraico traz imperativo singular, dirigido provavelmente a Abner, seguido de objetos coordenados; o plural em português abrange naturalmente Abner e os homens declarados culpados, mas a alteração de número é registrada em nota teológica como alternativa relevante.
- source_word: חֲנִית הַמֶּלֶךְ וְאֶת צַפַּחַת הַמַּיִם
  choice: a lança do rei e o jarro de água
  rationale: Equivalentes concretos e correntes dos dois objetos retirados do acampamento.
- source_word: אֲשֶׁר מְרַאֲשֹׁתָיו
  choice: que ficavam junto à cabeça dele
  rationale: Traduz a localização à cabeceira de Saul em linguagem clara e natural.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome pessoal presente no texto e o distingue do título humano אֲדֹנֵיכֶם.
- issue: Sentido de מְשִׁיחַ יְהוָה
  choice: o ungido de Yahweh
  alternative: o messias de Yahweh
  rationale: “Ungido” preserva o sentido imediato de Saul como rei consagrado sem transformar aqui o substantivo em título cristológico.
- issue: Força de בְנֵי מָוֶת
  choice: vocês merecem morrer
  alternative: vocês são filhos da morte
  rationale: A expressão é um idiomatismo de condenação ou sujeição à morte; a tradução principal oferece o sentido, e a nota conserva a forma hebraica.
- issue: Número do imperativo רְאֵה
  choice: vejam
  alternative: veja
  rationale: A forma hebraica é singular e se dirige primariamente a Abner; o contexto imediato, porém, acusa o grupo no plural. “Vejam” dá continuidade natural a esse destinatário coletivo, sem excluir a referência principal a Abner.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém a alternância do singular dirigido a Abner (“você fez”) para o plural dirigido aos guardas (“vocês merecem”), presente no hebraico; no último imperativo, usa o plural por continuidade discursiva.
