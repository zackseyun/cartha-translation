base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: pt
  text: Saul acampou na colina de Haquilá, que fica em frente a Jesimom[a], junto à estrada. Davi, porém, permanecia no deserto e viu que Saul tinha vindo atrás dele para o deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesimom também pode ser entendido genericamente como “a terra desolada” ou “o deserto”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּחַן
  choice: acampou
  rationale: No contexto de deslocamento militar, חנה indica estabelecer acampamento; “acampou” é claro, natural e concreto.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: na colina de Haquilá
  rationale: גִּבְעָה significa “colina”, enquanto חֲכִילָה é preservado como nome próprio; a preposição “na” expressa adequadamente a localização.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: que fica diante de Jesimom
  rationale: עַל־פְּנֵי pode indicar uma posição diante de ou em frente a algo. Jesimom é mantido como nome geográfico, sem excluir em nota a leitura genérica do termo.
- source_word: עַל הַדָּרֶךְ
  choice: junto à estrada
  rationale: Neste quadro topográfico, עַל indica proximidade; “junto à estrada” evita sugerir que o acampamento estava literalmente sobre a via.
- source_word: יֹשֵׁב
  choice: permanecia
  rationale: O particípio de ישב descreve uma situação contínua de permanência ou residência; “permanecia” comunica esse aspecto durativo com naturalidade.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma ou desértica; “deserto” é corrente em português e não exige que se trate especificamente de dunas de areia.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: e viu que Saul tinha vindo atrás dele
  rationale: A formulação conserva o verbo concreto “ver” e a expressão “vir atrás”, que pode comunicar tanto movimento subsequente quanto intenção de perseguição, sem explicitar mais do que o hebraico.
- source_word: הַמִּדְבָּרָה
  choice: para o deserto
  rationale: O ה direcional indica movimento em direção ao deserto; “para o deserto” preserva essa nuance.
theological_decisions: []
