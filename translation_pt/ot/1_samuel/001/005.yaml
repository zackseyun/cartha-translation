source:
  edition: WLC
  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: pt
  text: Mas a Ana ele dava uma porção dupla[a], porque amava Ana, e Yahweh havia fechado seu ventre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “uma porção de duas faces/narinas”. A expressão é difícil e pode significar “uma porção dupla” ou “uma porção especial”.
    reason: Alternativa lexical devido à obscuridade da expressão hebraica אַחַת אַפָּיִם.
lexical_decisions:
- source_word: וּ/לְ/חַנָּה
  choice: Mas a Ana
  rationale: A conjunção com a preposição significa literalmente “e/a Ana”; “Mas a Ana” expressa com naturalidade o contraste com as porções dadas a Penina e a seus filhos no versículo anterior.
- source_word: יִתֵּן
  choice: ele dava
  rationale: O imperfeito, neste contexto narrativo passado, descreve uma ação habitual de Elcana durante o sacrifício.
- source_word: מָנָה
  choice: porção
  rationale: Designa a parte atribuída a alguém na refeição sacrificial.
- source_word: אַחַת אַפָּיִם
  choice: uma porção dupla
  rationale: A expressão é difícil e literalmente se aproxima de “uma porção de duas faces/narinas”. “Porção dupla” comunica uma interpretação provável e corrente, enquanto a nota preserva a incerteza lexical.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão do tratamento especial dispensado por Elcana a Ana.
- source_word: אֶת חַנָּה אָהֵב
  choice: amava Ana
  rationale: Traduz diretamente a afirmação do amor de Elcana por Ana.
- source_word: וַֽ/יהוָה
  choice: Yahweh
  rationale: Preserva no texto principal o nome divino representado pelo Tetragrama.
- source_word: סָגַר רַחְמָהּ
  choice: tivesse fechado o seu ventre
  rationale: O verbo significa “fechar”; a forma verbal portuguesa ajusta-se à construção concessiva e apresenta a condição como circunstância anterior ou vigente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Relação entre o amor de Elcana e a esterilidade de Ana
  choice: embora Yahweh tivesse fechado o seu ventre
  alternative: e Yahweh tinha fechado o seu ventre
  rationale: '“Embora” torna explícita a leitura concessiva sugerida pela justaposição: Elcana amava Ana apesar de sua esterilidade. Como o hebraico traz apenas a conjunção וְ, a leitura coordenada continua possível e merece ser reconhecida como alternativa.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem “a Ana ele dava” conserva a ênfase contrastiva do hebraico sem soar excessivamente arcaica.
