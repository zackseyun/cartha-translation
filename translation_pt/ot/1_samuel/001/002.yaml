  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: pt
  text: 'Ele tinha duas esposas: uma se chamava Ana, e a outra, Penina. Penina tinha filhos, mas Ana não tinha filhos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹו
  choice: Ele tinha
  rationale: A construção possessiva hebraica, literalmente «e para ele», é expressa de modo natural em português com «ele tinha»; o conectivo é absorvido pelo fluxo narrativo.
- source_word: שְׁתֵּי נָשִׁים
  choice: duas mulheres
  rationale: No contexto, «mulheres» designa claramente as esposas de Elcana e preserva com naturalidade o cenário familiar poligínico explicitado pelo hebraico.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: uma se chamava ... e a outra
  rationale: Formulação portuguesa corrente que comunica a identificação paralela das duas mulheres sem reproduzir de forma rígida a repetição hebraica de «nome».
- source_word: חַנָּה
  choice: Ana
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico חַנָּה.
- source_word: פְּנִנָּה
  choice: Penina
  rationale: Transliteração portuguesa tradicional e facilmente legível do nome hebraico פְּנִנָּה.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: Penina tinha filhos
  rationale: A oração existencial/possessiva é vertida idiomaticamente. «Filhos» pode abranger descendentes de ambos os sexos, como יְלָדִים, sem especificar aqui filhos e filhas.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: mas Ana não tinha filhos
  rationale: «Mas» explicita o contraste presente na justaposição hebraica, enquanto «não tinha filhos» expressa naturalmente a construção de inexistência com אֵין.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. «Mulheres» é compreensível no contexto como «esposas» e evita uma formulação excessivamente técnica; os nomes seguem as formas portuguesas consagradas.
