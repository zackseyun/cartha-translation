reference: 1 Samuel 1:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: pt
  text: Depois de desmamá-lo, ela o levou consigo, com três touros[a], uma efa de farinha e um odre de vinho, e o trouxe à casa de Yahweh, em Siló. O menino ainda era muito novo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico massorético traz “três touros”; alguns testemunhos antigos e intérpretes entendem “um touro de três anos”.
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: ela o levou consigo
  rationale: Expressa de modo natural o ato de Ana levar o menino em sua peregrinação; o contexto de subida ao santuário permanece implícito, sem confundir este verbo com o posterior וַתְּבִאֵהוּ, “trouxe”.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: Depois de desmamá-lo
  rationale: Neste contexto, גמל designa o desmame da criança, e a construção temporal indica que a viagem ocorreu após isso.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: com três touros
  rationale: Segue diretamente o texto massorético, que apresenta o plural “touros” e o numeral “três”; a variante antiga é registrada em nota.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: uma efa de farinha
  rationale: Mantém o nome da antiga unidade de medida, sem impor uma conversão moderna aproximada, e traduz קֶמַח por “farinha”.
- source_word: וְנֵבֶל יַיִן
  choice: um odre de vinho
  rationale: “Odre” comunica de forma concisa o recipiente portátil normalmente associado a נֵבֶל neste contexto.
- source_word: וַתְּבִאֵהוּ
  choice: e o trouxe
  rationale: O hifil de בוא significa “trazer” e marca a chegada do menino ao santuário.
- source_word: בֵית יְהוָה שִׁלוֹ
  choice: à casa de Yahweh, em Siló
  rationale: Preserva tanto a designação do santuário como o nome divino e identifica Siló como sua localização.
- source_word: וְהַנַּעַר נָעַר
  choice: O menino ainda era muito novo
  rationale: Comunica em português natural a repetição enfática de נַעַר, salientando a pouca idade de Samuel sem reproduzir a formulação hebraica de maneira artificial.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino; “Yahweh” o translitera em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha o movimento narrativo do hebraico, enquanto “ainda era muito novo” transmite naturalmente a ênfase final na pouca idade do menino.
