  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: pt
  text: 'E assim acontecia, ano após ano[a]: sempre que Ana subia à casa de Yahweh[b], Penina a provocava, e Ana chorava e não comia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E assim ele fazia, ano após ano”. O verbo hebraico está no masculino singular (“ele fazia”) e pode ter Elcana como sujeito implícito; também pode resumir de modo idiomático a situação que se repetia.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “na casa de Yahweh”. A preposição hebraica significa literalmente “em/na”, embora, com o verbo “subir”, o contexto naturalmente indique destino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: E assim acontecia
  rationale: O verbo está formalmente no masculino singular, mas, no contexto, pode resumir de modo idiomático a situação que se repetia. A alternativa literal, com Elcana como sujeito implícito, é preservada em nota.
- source_word: שָׁנָה בְשָׁנָה
  choice: ano após ano
  rationale: A expressão distributiva hebraica indica repetição anual; esta formulação é natural e mantém a ênfase iterativa.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: sempre que Ana subia
  rationale: מִדֵּי com o infinitivo expressa repetição, 'sempre que'. O sufixo feminino aponta para Ana; explicitar o nome evita ambiguidade em português.
- source_word: בְּבֵית יְהוָה
  choice: à casa de Yahweh
  rationale: Embora בְּ signifique literalmente 'em/na', junto ao verbo de movimento a construção indica destino; 'subia à casa' é idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: כֵּן תַּכְעִסֶנָּה
  choice: Penina a provocava
  rationale: O hifil de כעס comunica causar irritação ou aflição de modo hostil. O contexto identifica Penina como sujeito e Ana como objeto; os nomes e o pronome tornam a relação clara em português.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: e ela chorava e não comia
  rationale: As formas verbais descrevem consequências habituais dentro da moldura de repetição anual; o imperfeito português transmite adequadamente esse aspecto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
- issue: Sujeito de יַעֲשֶׂה
  choice: 'Construção impessoal: ''acontecia'''
  alternative: 'Elcana como sujeito implícito: ''ele fazia assim'''
  rationale: A forma hebraica é masculina singular e permite entender Elcana como sujeito; contudo, a oração também pode resumir idiomaticamente toda a situação recorrente. A tradução mantém essa leitura contextual sem excluir a alternativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega o imperfeito para o padrão habitual e explicita Ana e Penina onde a sequência de pronomes poderia causar ambiguidade.
