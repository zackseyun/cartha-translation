  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: pt
  text: Sua rival[a] costumava provocá-la intensamente, para irritá-la[b], pois Yahweh havia fechado o ventre de Ana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sua coesposa»; o termo hebraico indica aqui outra mulher na mesma relação conjugal, vista como rival dentro da família.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é raro; também pode ser entendido como «perturbá-la», «afligi-la» ou «deixá-la transtornada».
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: costumava provocá-la
  rationale: O piel de כעס tem sentido causativo, «provocar, irritar». No contexto narrativo, a forma descreve uma ação habitual e repetida, expressa naturalmente por «costumava».
- source_word: צָרָתָהּ
  choice: sua rival
  rationale: צָרָה designa aqui Penina como rival de Ana dentro de uma relação conjugal compartilhada. «Rival» é claro e natural, enquanto a nota preserva o sentido cultural mais específico de coesposa.
- source_word: גַּם כַּעַס
  choice: intensamente
  rationale: A construção reforça a ideia de provocação. «Intensamente» comunica a força enfática sem reproduzir de modo artificial a repetição da raiz ligada à irritação.
- source_word: בַּעֲבוּר
  choice: a fim de
  rationale: 'A expressão introduz a finalidade da provocação: causar agitação ou aflição em Ana.'
- source_word: הַרְּעִמָהּ
  choice: agitá-la
  rationale: O verbo raro parece indicar que se causa perturbação, agitação ou aflição. «Agitá-la» preserva essa amplitude melhor que uma opção excessivamente específica.
- source_word: כִּי
  choice: porque
  rationale: 'Introduz a causa que tornava Ana vulnerável à provocação: sua esterilidade.'
- source_word: סָגַר
  choice: havia fechado
  rationale: O mais-que-perfeito apresenta a ação divina como circunstância anterior que explica a situação narrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעַד רַחְמָהּ
  choice: fechado o seu ventre
  rationale: Com סגר, a expressão forma o idioma «fechar o ventre», isto é, impedir a concepção. A formulação portuguesa conserva a imagem hebraica e continua compreensível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e evita substituí-lo por um título.
- issue: Atribuição da esterilidade à ação divina
  choice: Yahweh havia fechado o seu ventre
  alternative: ela não podia ter filhos
  rationale: A redação mantém a afirmação teologicamente forte e explícita do hebraico, sem suavizar a agência divina nem transformá-la numa mera descrição fisiológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita regionalismos e conserva tanto a ação habitual da rival quanto a imagem hebraica de Deus fechar o ventre.
