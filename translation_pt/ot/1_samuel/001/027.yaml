  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: pt
  text: Foi por este menino que orei[a], e Yahweh me concedeu o meu pedido[b] que lhe fiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi a respeito deste menino que orei”. A preposição hebraica pode indicar o assunto acerca do qual Ana orou.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a minha petição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: por este menino
  rationale: Com הִתְפַּלָּלְתִּי, a preposição אֶל pode indicar aquilo pelo qual ou a respeito do qual Ana orou. “Por este menino” comunica naturalmente que ele era o objeto de sua oração, enquanto “menino” preserva o sentido masculino de נַעַר no contexto.
- source_word: הִתְפַּלָּלְתִּי
  choice: orei
  rationale: O perfeito hebraico relembra a oração feita anteriormente; o pretérito perfeito é direto e natural em português.
- source_word: וַיִּתֵּן
  choice: me concedeu
  rationale: Embora o verbo básico signifique “dar”, “conceder” expressa naturalmente a ação de dar em resposta a um pedido. O pronome “me” representa לִי e mantém o beneficiário explícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁאֵלָתִי
  choice: o pedido
  rationale: O substantivo denota o pedido de Ana. Junto de “me concedeu”, a construção portuguesa expressa naturalmente que se tratava do pedido dela, sem a formulação pesada “me concedeu o meu pedido”.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: que lhe fiz
  rationale: “Fazer um pedido a alguém” é a expressão idiomática em português. O pronome “lhe” identifica Yahweh como aquele a quem Ana dirigiu o pedido, embora a repetição da raiz hebraica שאל não possa ser reproduzida com igual naturalidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome próprio divino; “Yahweh” preserva essa identificação pessoal sem substituí-la por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção focal “Foi por este menino que orei” preserva a ênfase inicial do hebraico; “me concedeu o pedido que lhe fiz” evita rigidez excessiva sem apagar a relação entre pedido e resposta.
