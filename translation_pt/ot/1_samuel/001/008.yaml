  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: pt
  text: 'Então Elcana, seu marido, lhe disse: “Ana, por que você está chorando? Por que não come? E por que seu coração está triste?[a] Não sou eu melhor para você do que dez filhos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu coração está aflito?” Literalmente: “por que seu coração está mal?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez natural em português.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: Elcana, seu marido
  rationale: Mantém explícita a identificação apositiva do hebraico em ordem natural no português.
- source_word: לָמֶה
  choice: por que
  rationale: O interrogativo é repetido três vezes no hebraico; a repetição é preservada por seu efeito retórico.
- source_word: תִבְכִּי
  choice: você está chorando
  rationale: A forma verbal descreve adequadamente a aflição em curso de Ana; a construção progressiva é natural e clara.
- source_word: לֹא תֹאכְלִי
  choice: não come
  rationale: Expressa a recusa ou ausência atual de alimentação sem acrescentar uma nuance volitiva como “não quer comer”.
- source_word: יֵרַע לְבָבֵךְ
  choice: seu coração está triste
  rationale: A expressão é literalmente “seu coração está mal”; no contexto, refere-se à tristeza ou aflição interior. A imagem do coração é preservada, e a alternativa mais literal consta em nota.
- source_word: הֲלוֹא אָֽנֹכִי טוֹב לָךְ
  choice: Não sou eu melhor para você
  rationale: Preserva a pergunta retórica negativa, que espera resposta afirmativa, e a comparação do valor de Elcana para Ana.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: do que dez filhos
  rationale: Mantém o substantivo masculino específico do hebraico; “dez” pode sugerir abundância, mas isso não é explicitado no texto.
theological_decisions:
- issue: Substantivo masculino específico בָּנִים
  choice: filhos
  alternative: crianças
  rationale: O hebraico diz especificamente “filhos” no masculino, refletindo também o contexto social da narrativa; uma formulação neutra apagaria essa especificidade.
- issue: Sentido da aflição do coração
  choice: seu coração está triste
  alternative: seu coração está mal / seu coração está aflito
  rationale: O idioma hebraico descreve o coração como estando “mal”. “Triste” comunica o sentido contextual sem atribuir culpa moral a Ana, enquanto a nota preserva a forma literal e a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala conjugal por naturalidade contemporânea, preserva as três perguntas e mantém a imagem hebraica do coração.
