translation_notes:
  register: Português moderno, claro e digno, com tratamento por “sua”. A ordem das notas foi regularizada para que cada marcador siga imediatamente a expressão que explica. A tradução conserva a amplitude semântica dos termos de sofrimento por meio de uma alternativa em nota.
