base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: pt
  text: Não considere a sua serva uma mulher indigna[a], pois, por causa da abundância da minha queixa e da minha aflição[b], tenho falado até agora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “uma filha da indignidade”, expressão que designa uma mulher moralmente desprezível ou de má reputação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pela abundância da minha queixa e do meu desgosto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: Não considere ...
  rationale: A construção idiomática não descreve o ato literal de dar ou pôr, mas o de considerar ou tratar alguém como algo.
- source_word: אֲמָתְךָ
  choice: a sua serva
  rationale: Mantém a autodesignação humilde e feminina de Ana, em português natural.
- source_word: בַּת בְּלִיָּעַל
  choice: uma mulher indigna
  rationale: Traduz de modo idiomático a expressão hebraica literalmente formada por “filha de indignidade”, que caracteriza uma mulher moralmente desprezível ou de má reputação.
- source_word: מֵרֹב שִׂיחִי וְכַעְסִי
  choice: por causa da minha grande angústia e aflição
  rationale: מֵרֹב indica grande quantidade ou intensidade e, neste contexto, também a causa da fala. שִׂיחַ pode ser queixa, lamento ou reflexão atribulada; כַּעַס exprime aflição, desgosto ou irritação. A formulação comunica o sofrimento interior sem sugerir necessariamente ira pecaminosa.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: tenho falado até agora
  rationale: O perfeito com a expressão temporal apresenta a fala que se estendeu até o momento presente; o pretérito perfeito composto é natural neste contexto.
