source:
  edition: WLC
  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: pt
  text: 'Ela fez um voto e disse: “Ó Yahweh dos Exércitos, se de fato olhares para a aflição da tua serva, te lembrares de mim e não te esqueceres da tua serva, mas deres à tua serva um filho[a], então eu o darei a Yahweh todos os dias da vida dele, e nenhuma navalha passará sobre a cabeça dele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “semente” ou “descendência de homens”, expressão que aqui significa um filho do sexo masculino.'
    reason: lexical_alternative
  - marker: b
    text: A frase “nenhuma navalha passará sobre a cabeça dele” evoca a linguagem de uma consagração especial associada ao voto de nazireu; aqui, porém, o texto declara expressamente apenas a restrição quanto ao cabelo, sem usar o termo “nazireu”.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: Ela fez um voto
  rationale: O hebraico emprega um cognato enfático, literalmente “votou um voto”. “Fez um voto” expressa com naturalidade o ato formal em português.
- source_word: יְהוָה צְבָאוֹת
  choice: Ó Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo concreto, mantendo o título militar e cósmico. “Ó” marca a invocação na oração.
- source_word: אִם רָאֹה תִרְאֶה
  choice: se de fato olhares
  rationale: A construção com infinitivo absoluto intensifica o verbo. “De fato” transmite essa ênfase sem tornar a frase artificial.
- source_word: בָּעֳנִי
  choice: a aflição
  rationale: O termo pode abranger sofrimento, miséria e humilhação. “Aflição” conserva essa amplitude sem especificar indevidamente a natureza da dor de Ana.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: tua serva / à tua serva
  rationale: O substantivo hebraico designa especificamente uma serva. A forma feminina portuguesa preserva o gênero e soa natural no registro de oração.
- source_word: וּזְכַרְתַּנִי וְלֹא תִשְׁכַּח אֶת אֲמָתֶךָ
  choice: te lembrares de mim e não te esqueceres da tua serva
  rationale: Mantém o paralelismo deliberado entre lembrar e não esquecer, bem como a progressão cumulativa da súplica.
- source_word: זֶרַע אֲנָשִׁים
  choice: um filho
  rationale: A expressão é literalmente “semente/descendência de homens” e, no contexto, pede uma criança do sexo masculino. “Um filho” comunica o sentido idiomático com clareza; a forma literal é registrada em nota.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: então eu o darei a Yahweh
  rationale: O verbo significa simplesmente “dar”. Evita-se inserir “consagrar” no texto principal, embora essa seja a implicação contextual do voto.
- source_word: כָּל יְמֵי חַיָּיו
  choice: por todos os dias da vida dele
  rationale: Preserva a expressão temporal totalizante do hebraico e deixa explícita a duração vitalícia do voto.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: e nenhuma navalha passará sobre a cabeça dele
  rationale: Conserva a imagem concreta do hebraico. “Navalha” é o sentido contextual mais provável de מוֹרָה, e a formulação evita substituir a imagem por uma explicação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto usa diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Possível consagração nazireia indicada pela proibição da navalha
  choice: Manter no texto principal somente a linguagem concreta do voto
  alternative: Identificar explicitamente o menino como nazireu
  rationale: A proibição evoca a linguagem da consagração nazireia, mas o versículo não emprega o termo “nazireu”. A tradução preserva a alusão sem transformar uma associação forte em identificação explícita.
- issue: Sentido de זֶרַע אֲנָשִׁים
  choice: um filho
  alternative: descendência de homens; uma criança do sexo masculino
  rationale: A expressão idiomática refere-se aqui a um descendente masculino. “Um filho” é natural e preciso em português, enquanto a nota preserva a forma incomum do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento em segunda pessoa do singular (“tua”, “olhares”, “deres”) mantém a solenidade íntima da oração sem recorrer a formas arcaicas excessivas. A sintaxe acumulativa preserva a intensidade da súplica hebraica.
