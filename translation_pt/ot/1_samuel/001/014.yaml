base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/014.yaml
  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
translation:
  language: pt
  text: 'Então Eli lhe disse: “Até quando você ficará embriagada?[a] Afaste de você o seu vinho.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até quando você continuará se embriagando?” O verbo hebraico pode indicar tanto ficar embriagada como estar em estado de embriaguez.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Retire de sobre você o seu vinho”. A expressão pode se referir a afastar o vinho ou a livrar-se de sua influência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: Então Eli lhe disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” é natural em português, e “lhe disse” traduz de modo idiomático אֵלֶיהָ sem alterar o referente feminino.
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Equivalente português direto e corrente da expressão temporal hebraica, preservando o tom de censura.
- source_word: תִּשְׁתַּכָּרִין
  choice: você ficará embriagada
  rationale: O hitpael imperfeito de שׁכר pode apontar tanto para entrar em estado de embriaguez como para permanecer nele. A tradução é natural e mantém parte dessa abertura, explicitada na nota.
- source_word: הָסִירִי אֶת יֵינֵךְ
  choice: Afaste de você o seu vinho
  rationale: Traduz o imperativo feminino e seu objeto de modo compreensível, conservando a imagem concreta de remover o vinho de si.
- source_word: מֵעָלָיִךְ
  choice: de você
  rationale: Equivalente idiomático de “de sobre você”; evita uma formulação artificial sem decidir se Eli se refere à presença física do vinho ou à sua influência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A acusação direta de Eli é preservada sem confirmar que Ana estivesse realmente embriagada.
