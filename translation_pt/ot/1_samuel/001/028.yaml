base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: pt
  text: “Também eu o entreguei a Yahweh[a]; durante todos os dias que ele viver, ele estará entregue a Yahweh.” E ele adorou Yahweh ali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega aqui a mesma raiz usada antes para dizer que Ana “pediu” o menino. Também pode ser traduzido: “eu o cedi” ou “eu o dediquei a Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “E eles adoraram Yahweh ali”. O texto hebraico massorético traz uma forma singular, mas a tradição de tradução também registra a leitura no plural.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: eu também o entrego
  rationale: O hifil de שׁאל retoma o verbo usado para o pedido de Ana e pode sugerir ceder ou dedicar alguém. “Entrego” comunica com naturalidade a dedicação de Samuel por toda a vida; a nota preserva a repetição e o jogo de palavras hebraico, difíceis de reproduzir sem tornar o português artificial.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição marca o destinatário da entrega, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: Por todos os dias que viver
  rationale: Expressão idiomática de duração vitalícia, vertida em português corrente sem enfraquecer a abrangência de “todos os dias”.
- source_word: שָׁאוּל
  choice: ficará entregue
  rationale: O particípio passivo da mesma raiz שׁאל indica que Samuel permanece cedido ou dedicado a Yahweh. “Ficará entregue” expressa o estado contínuo e mantém ligação verbal com “entrego”.
- source_word: וַיִּשְׁתַּחוּ
  choice: ele adorou
  rationale: A forma massorética é singular e o contexto é cultual; “adorou” comunica o sentido religioso, enquanto a possível leitura plural é registrada em nota.
- source_word: שָׁם
  choice: ali
  rationale: Equivalente locativo natural, referindo-se ao lugar em que Samuel foi apresentado a Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” preserva o nome próprio da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Sujeito de וַיִּשְׁתַּחוּ
  choice: ele adorou Yahweh ali
  alternative: eles adoraram Yahweh ali
  rationale: A morfologia do texto massorético favorece o singular, embora o referente não seja explicitado e parte da tradição de tradução entenda o verbo no plural. A ambiguidade tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A repetição de “entrego/entregue” procura refletir parcialmente a repetição da raiz hebraica, enquanto a nota esclarece o jogo de palavras com o pedido de Ana. Mantém-se “Yahweh” como nome próprio e registra-se em nota a incerteza tradicional sobre o sujeito da frase final.
