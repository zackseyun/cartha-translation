  text: וַ/תַּ֨עַן חַנָּ֤ה וַ/תֹּ֨אמֶר֙ לֹ֣א אֲדֹנִ֔/י אִשָּׁ֤ה קְשַׁת ר֨וּחַ֙ אָנֹ֔כִי וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שָׁתִ֑יתִי וָ/אֶשְׁפֹּ֥ךְ אֶת נַפְשִׁ֖/י לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: pt
  text: 'Ana, porém, respondeu: “Não, meu senhor! Sou uma mulher de espírito angustiado.[a] Não bebi vinho nem bebida forte; mas derramei minha alma diante de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mulher de espírito entristecido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: Ana, porém, respondeu
  rationale: O português não precisa reproduzir a fórmula narrativa com dois verbos (‘respondeu e disse’). ‘Porém’ explicita adequadamente o contraste contextual com a acusação de Eli.
- source_word: לֹא אֲדֹנִי
  choice: Não, meu senhor!
  rationale: אֲדֹנִי é aqui uma forma respeitosa de Ana se dirigir a Eli, não um título divino. ‘Meu senhor’ conserva a deferência e o possessivo singular.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: uma mulher de espírito angustiado
  rationale: A expressão descreve aflição interior. A tradução preserva a referência a רוּחַ, sem sugerir teimosia ou dureza moral.
- source_word: וְיַיִן וְשֵׁכָר לֹא שָׁתִיתִי
  choice: Não bebi vinho nem bebida forte
  rationale: A construção com ‘nem’ expressa naturalmente a negação dos dois tipos de bebida. ‘Bebida forte’ mantém שֵׁכָר distinto do vinho sem identificar de modo excessivamente específico a bebida antiga.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: mas derramei minha alma
  rationale: Mantém a imagem hebraica de profunda entrega e expressão pessoal em oração; ‘alma’ corresponde mais diretamente a נֶפֶשׁ do que ‘coração’.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: ‘Diante de’ representa לִפְנֵי como oração na presença de Deus, e ‘Yahweh’ translitera o nome divino יהוה.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama. ‘Yahweh’ preserva o nome pessoal da aliança, em vez de substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na oração de Ana
  choice: alma
  alternative: coração / eu mesma
  rationale: ‘Alma’ preserva a metáfora do texto e sua força devocional sem reduzir נֶפֶשׁ a uma definição técnica da constituição humana.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fórmula hebraica ‘respondeu e disse’ foi condensada para evitar rigidez, enquanto as imagens centrais — ‘espírito angustiado’ e ‘derramei minha alma’ — foram preservadas.
