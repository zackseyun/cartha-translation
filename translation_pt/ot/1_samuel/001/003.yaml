reference: 1 Samuel 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: pt
  text: Esse homem costumava subir da sua cidade, ano após ano, para adorar e oferecer sacrifícios a Yahweh dos Exércitos[a], em Siló. Ali, os dois filhos de Eli, Hofni e Fineias, eram sacerdotes de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais tradicional: “SENHOR dos Exércitos”.'
    reason: Registra a convenção tradicional para o nome divino e o título צְבָאוֹת sem substituir a tradução principal.
lexical_decisions:
- source_word: וְעָלָה
  choice: costumava subir
  rationale: O qatal com waw descreve aqui uma ação habitual no passado; “costumava subir” comunica tanto a recorrência quanto o sentido concreto de peregrinação expresso por עלה.
- source_word: הָאִישׁ הַהוּא
  choice: esse homem
  rationale: O demonstrativo retoma de modo específico Elcana, já apresentado no contexto; “esse homem” conserva essa referência anafórica em português natural.
- source_word: מֵעִירוֹ
  choice: da sua cidade
  rationale: עִיר pode designar cidade ou povoado; “cidade” é a correspondência direta e mantém a formulação sem restringir indevidamente o tamanho do lugar.
- source_word: מִיָּמִים יָמִימָה
  choice: ano após ano
  rationale: A expressão idiomática indica recorrência anual; “ano após ano” é clara, corrente e preserva a repetição enfatizada no hebraico.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: para adorar
  rationale: Embora o verbo possa denotar prostrar-se, no contexto cultual sua função é prestar adoração; “adorar” transmite naturalmente o sentido contextual.
- source_word: וְלִזְבֹּחַ
  choice: e oferecer sacrifícios
  rationale: O verbo se refere à realização de sacrifícios cultuais. “Oferecer sacrifícios” é idiomático e evita a possível leitura moderna de “sacrificar” como simples renúncia.
- source_word: לַיהוָה צְבָאוֹת
  choice: a Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de forma lexicalmente transparente como “Exércitos”, em vez de substituir o título por uma interpretação como “Todo-Poderoso”.
- source_word: בְּשִׁלֹה
  choice: em Siló
  rationale: A preposição e o topônimo são vertidos pela forma locativa natural em português.
- source_word: וְשָׁם
  choice: Ali
  rationale: O advérbio retoma Siló e introduz com fluidez a informação sobre os sacerdotes que se encontravam naquele lugar.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: os dois filhos de Eli
  rationale: Preserva a indicação explícita do número e a relação de filiação na ordem básica do hebraico.
- source_word: חָפְנִי וּפִנְחָס
  choice: Hofni e Fineias
  rationale: Emprega formas portuguesas tradicionais e reconhecíveis para os nomes hebraicos.
- source_word: כֹּהֲנִים לַיהוָה
  choice: sacerdotes de Yahweh
  rationale: A expressão indica o serviço sacerdotal prestado a Yahweh; “sacerdotes de Yahweh” é concisa e preserva essa relação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” conserva o caráter de nome próprio e evita substituí-lo silenciosamente por um título; a forma tradicional é registrada em nota quando integra o título completo.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos Exércitos celestiais; SENHOR Todo-Poderoso
  rationale: “Dos Exércitos” representa de modo transparente o plural צְבָאוֹת e preserva a amplitude do título sem especificar se os exércitos são humanos, celestiais ou ambos, nem trocar o termo por uma interpretação de poder absoluto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe explicita a ação habitual sem soar arcaica. O marcador [a] foi colocado junto ao título divino ao qual a nota efetivamente se refere.
