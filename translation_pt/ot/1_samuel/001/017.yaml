  text: וַ/יַּ֧עַן עֵלִ֛י וַ/יֹּ֖אמֶר לְכִ֣י לְ/שָׁל֑וֹם וֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל יִתֵּן֙ אֶת שֵׁ֣לָתֵ֔/ךְ אֲשֶׁ֥ר שָׁאַ֖לְתְּ מֵ/עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: pt
  text: 'Então Eli respondeu: “Vá em paz, e que o Deus de Israel lhe conceda o pedido[a] que você fez a ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a petição”. O termo hebraico se refere àquilo que foi pedido em oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A combinação hebraica literalmente significa “respondeu e disse”, mas, em português atual, “respondeu” seguido de discurso direto comunica naturalmente as duas formas verbais sem produzir um hebraísmo desnecessário.
- source_word: לְכִי
  choice: Vá
  rationale: É o imperativo feminino singular de הלך, dirigido a Ana. “Vá” é a forma direta e natural em português.
- source_word: לְשָׁלוֹם
  choice: em paz
  rationale: A expressão idiomática é uma fórmula de despedida e bênção que deseja paz, bem-estar e segurança. “Vá em paz” preserva seu sentido e seu tom solene.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente em português a construção hebraica que identifica o Deus de Israel.
- source_word: יִתֵּן
  choice: que ... conceda
  rationale: Embora נתן signifique literalmente “dar”, aqui a forma expressa um desejo ou bênção. “Que ... conceda” comunica essa força e se ajusta ao objeto pedido.
- source_word: שֵׁלָתֵךְ
  choice: o pedido
  rationale: O substantivo designa aquilo que foi solicitado, neste contexto em oração. “Pedido” é claro e corrente, enquanto “petição” é uma alternativa mais formal.
- source_word: אֲשֶׁר שָׁאַלְתְּ
  choice: que você fez
  rationale: Com “pedido” como antecedente, “o pedido que você fez” expressa de modo idiomático a ação de pedir sem a repetição pouco natural “o pedido que você pediu”.
- source_word: מֵעִמּוֹ
  choice: a ele
  rationale: A preposição com o pronome indica de quem Ana pediu algo. “Fez a ele” é idiomático em português e mantém o pronome masculino do hebraico, cujo referente contextual é Deus.
theological_decisions:
- issue: Referente do pronome em מֵעִמּוֹ
  choice: O pronome é mantido como “a ele”, referindo-se contextualmente a Deus.
  alternative: Explicitar “a Deus” ou deixar a construção ainda mais ambígua.
  rationale: O contexto anterior mostra que Ana orava ao SENHOR, e o sujeito imediatamente mencionado é “o Deus de Israel”. Manter o pronome preserva a forma do hebraico sem obscurecer indevidamente seu referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula “Vá em paz” conserva o tom tradicional e natural da bênção. Evitou-se o hebraísmo rígido “respondeu e disse”, e o pronome de מֵעִמּוֹ foi preservado sem inserir uma identificação ausente do texto.
