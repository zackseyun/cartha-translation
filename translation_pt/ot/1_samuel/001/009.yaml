source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: pt
  text: Depois que Ana comeu em Siló e bebeu, ela se levantou. Eli, o sacerdote, estava sentado no assento junto ao batente da porta do templo de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou: “santuário de Yahweh”.'
    reason: הֵיכָל pode designar um templo ou, de modo mais geral, um santuário.
lexical_decisions:
- source_word: וַתָּקָם
  choice: se levantou
  rationale: O wayyiqtol de קום indica que Ana se ergueu para agir; “se levantou” é natural e conserva o movimento narrativo.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: Depois que comeram ... e depois que beberam
  rationale: As duas expressões temporais são mantidas em paralelo. O plural se ajusta ao contexto da refeição familiar, enquanto a possível referência singular a Ana é preservada em nota.
- source_word: בְשִׁלֹה
  choice: em Siló
  rationale: Tradução direta e idiomática da preposição ב com o topônimo.
- source_word: וְעֵלִי הַכֹּהֵן יֹשֵׁב
  choice: Eli, o sacerdote, estava sentado
  rationale: O particípio יֹשֵׁב apresenta uma circunstância de fundo e uma postura contínua; o imperfeito perifrástico português comunica esse valor.
- source_word: עַל הַכִּסֵּא
  choice: num assento
  rationale: כִּסֵּא pode designar assento, cadeira ou trono. “Assento” mantém a referência geral sem acrescentar conotação régia.
- source_word: עַל מְזוּזַת
  choice: junto ao batente da porta
  rationale: מְזוּזָה é o batente ou umbral; neste uso locativo, עַל é expresso naturalmente por “junto a”.
- source_word: הֵיכַל יְהוָה
  choice: templo de Yahweh
  rationale: הֵיכָל pode significar templo ou santuário. “Templo” é claro no texto principal, e “santuário” é registrado como alternativa lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” representa o nome pessoal no texto hebraico sem substituí-lo pelo título “SENHOR”.
- issue: Sentido de הֵיכַל no santuário de Siló
  choice: templo
  alternative: santuário
  rationale: O substantivo admite ambos os sentidos. “Templo” traduz seu sentido arquitetônico normal, mas a alternativa “santuário” é mantida em nota por se tratar do local de culto pré-salomônico.
- issue: Sujeito das ações de comer e beber
  choice: 'plural coletivo: “comeram ... beberam”'
  alternative: 'singular referente a Ana: “ela comeu ... bebeu”'
  rationale: O contexto imediato é uma refeição familiar e permite a leitura coletiva, mas as formas hebraicas e sua construção não eliminam a leitura singular; a nota preserva essa ambiguidade.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A repetição “depois que” conserva o paralelismo temporal hebraico; “batente da porta” evita o caráter excessivamente técnico de “umbral”, e “assento” evita sugerir indevidamente um trono.
