base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: pt
  text: E aconteceu que, enquanto ela continuava a orar[a] diante de Yahweh, Eli observava sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto ela orava longamente”.'
    reason: Alternativa lexical para a ideia de oração continuada ou prolongada expressa por הִרְבְּתָה לְהִתְפַּלֵּל.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E aconteceu que, enquanto
  rationale: Preserva a fórmula narrativa e sua força circunstancial-temporal sem tornar a frase excessivamente rígida em português.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: ela prolongava sua oração
  rationale: O hifil de רבה combinado com o infinitivo expressa oração extensa ou continuada; esta formulação natural conserva a ideia de duração.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Traduz o idioma espacial-relacional como oração feita na presença de Deus e mantém o nome divino.
- source_word: שֹׁמֵר
  choice: observava
  rationale: O particípio qal indica ação contínua; 'observava' comunica a atenção persistente de Eli.
- source_word: אֶת פִּיהָ
  choice: a boca dela
  rationale: Mantém o sentido literal de פֶּה; o versículo seguinte especifica o movimento dos lábios.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção principal preserva algo da forma narrativa hebraica, enquanto a nota oferece uma opção mais idiomática.
