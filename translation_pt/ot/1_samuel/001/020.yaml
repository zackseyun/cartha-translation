base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: pt
  text: 'E, no devido tempo,[a] Ana engravidou e deu à luz um filho. Ela lhe deu o nome de Samuel, pois disse: “Eu o pedi a Yahweh”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “ao completar-se o ciclo dos dias”, expressão que indica a chegada do tempo apropriado.
    reason: lexical_alternative
  - marker: b
    text: O texto relaciona o nome “Samuel” ao verbo hebraico traduzido como “pedi” (שׁאל). Essa associação é um jogo de palavras, não necessariamente uma explicação etimológica exata do nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: no devido tempo
  rationale: Expressa naturalmente o sentido idiomático de chegada ou cumprimento do período apropriado, sem reproduzir de modo obscuro a imagem literal do ciclo dos dias.
- source_word: וַתַּהַר
  choice: engravidou
  rationale: Forma corrente e clara em português para a concepção ou início da gravidez no contexto da narrativa de nascimento.
- source_word: וַתֵּלֶד בֵּן
  choice: deu à luz um filho
  rationale: Construção portuguesa natural, digna e semanticamente precisa.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Equivalente idiomático em português da fórmula hebraica de nomeação, evitando a construção menos natural 'chamou o nome dele'.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: 'pois disse: “Eu o pedi a Yahweh”'
  rationale: Preserva a explicação dada por Ana e a associação verbal entre o nome Samuel e o verbo hebraico שאל, 'pedir'. 'Disse' explicita naturalmente a fala implícita na explicação do nome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Reproduz o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; 'Yahweh' preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Relação entre o nome Samuel e o verbo שאל
  choice: Manter no texto a declaração 'Eu o pedi' e explicar o jogo de palavras em nota
  alternative: Apresentar no texto uma etimologia direta como 'seu nome significa pedido a Deus'
  rationale: O versículo associa Samuel ao verbo 'pedir', mas a etimologia exata do nome é discutida. A tradução conserva a associação textual sem transformá-la numa afirmação etimológica mais precisa do que o hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação mantém o ritmo narrativo e conserva em nota tanto o idioma temporal hebraico quanto o jogo de palavras ligado ao nome Samuel.
