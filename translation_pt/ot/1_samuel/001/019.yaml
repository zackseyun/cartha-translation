base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: pt
  text: Eles se levantaram de manhã cedo e se prostraram diante de Yahweh. Depois, voltaram e chegaram à sua casa, em Ramá. Elcana conheceu Ana, sua mulher[a], e Yahweh se lembrou dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “conheceu” é um eufemismo hebraico tradicional para relações sexuais no casamento.
    reason: lexical_alternative
  - marker: b
    text: 'No hebraico, Deus “lembrar-se” de alguém muitas vezes significa mais do que recordar mentalmente: pode indicar que ele voltou para ela sua atenção fiel e eficaz.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: levantaram de manhã cedo
  rationale: A forma verbal de שׁכם indica levantar-se cedo, e בַבֹּקֶר explicita que isso ocorreu pela manhã. A expressão escolhida é natural em português e preserva a ênfase temporal.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: se prostraram diante de Yahweh
  rationale: השתחוה descreve concretamente o ato de curvar-se ou prostrar-se em reverência. “Prostraram-se” conserva a ação corporal, sem reduzi-la ao termo mais geral “adoraram”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: Depois, voltaram para sua casa, em Ramá
  rationale: A formulação comunica com naturalidade o retorno e a chegada à casa da família situada em Ramá, sem reproduzir de modo rígido a sequência verbal hebraica.
- source_word: הָרָמָתָה
  choice: Ramá
  rationale: Forma portuguesa corrente do nome geográfico hebraico רָמָה, com o sufixo direcional incorporado ao sentido do movimento para o lugar.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: Elcana conheceu Ana, sua mulher
  rationale: Mantém o eufemismo hebraico ידע para relações sexuais conjugais e seu registro discreto; a nota esclarece o sentido para o leitor moderno.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: Yahweh se lembrou dela
  rationale: Preserva o verbo זכר e sua formulação narrativa, deixando a nota explicar que, neste contexto, não se trata de simples recordação mental.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não apenas um título. “Yahweh” procura representar diretamente o Tetragrama sem recorrer à substituição tradicional por “SENHOR”.
- issue: Explicitação do eufemismo sexual ידע
  choice: Manter “conheceu” no texto principal e esclarecer em nota
  alternative: teve relações com; teve intimidade com
  rationale: O hebraico emprega deliberadamente um eufemismo discreto. Conservá-lo respeita a forma literária do texto, enquanto a nota impede incompreensão.
- issue: Alcance da lembrança divina
  choice: Preservar “se lembrou dela”
  alternative: voltou sua atenção para ela; atendeu ao pedido dela
  rationale: Em narrativas hebraicas, a lembrança divina frequentemente implica atenção fiel e eficaz, mas o versículo ainda não declara de modo explícito o resultado. A tradução evita antecipá-lo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe narrativa foi suavizada sem eliminar os elementos semânticos do hebraico. Os marcadores foram colocados junto às expressões que efetivamente explicam.
