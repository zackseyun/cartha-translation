  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: pt
  text: Havia um homem de Ramataim-Zofim, da região montanhosa de Efraim. Seu nome era Elcana, filho de Jeroão, filho de Eliú, filho de Toú, filho de Zufe, um efrateu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “efraimita”. O hebraico diz “efrateu”, termo que aqui pode funcionar como designação regional ligada a Efraim.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Havia
  rationale: Introduz a narrativa de modo natural em português, sem acrescentar um marcador temporal ausente do hebraico.
- source_word: אִישׁ אֶחָד
  choice: um homem
  rationale: Em português narrativo, a expressão apresenta naturalmente uma personagem específica ainda não identificada; “certo homem” seria possível, mas menos fluente neste contexto.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: de Ramataim-Zofim
  rationale: Trata a expressão como topônimo composto e evita interpretar de modo excessivo seus elementos internos.
- source_word: מֵהַר אֶפְרָיִם
  choice: da região montanhosa de Efraim
  rationale: Em expressão territorial, הַר designa a região de colinas ou montanhas, não necessariamente um monte específico.
- source_word: וּשְׁמוֹ
  choice: Seu nome era
  rationale: Mantém a cláusula nominal hebraica em forma clara e natural, sem perder a progressão narrativa.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: filho de ... filho de ... filho de ... filho de
  rationale: Reproduz a sequência genealógica; embora genealogias possam omitir gerações, o contexto não exige a generalização “descendente de”.
- source_word: אֶפְרָתִי
  choice: efrateu
  rationale: Preserva no texto principal a forma lexical do hebraico e deixa a possível interpretação regional “efraimita” para a nota.
theological_decisions:
- issue: Designação étnica ou geográfica אֶפְרָתִי
  choice: efrateu
  alternative: efraimita
  rationale: A forma hebraica corresponde formalmente a “efrateu”, mas, em vista da localização anterior na região montanhosa de Efraim, pode funcionar aqui como designação regional equivalente a “efraimita”. A ambiguidade é preservada em nota, sem ser resolvida silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A primeira frase foi dividida em duas para evitar uma cadeia pesada de coordenações, preservando todas as informações e a ordem geral do hebraico.
