base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: pt
  text: 'Ela disse: “Que tua serva encontre favor aos teus olhos.” Então a mulher seguiu seu caminho, comeu e seu rosto já não estava abatido.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e seu rosto já não era mais para ela”; a expressão hebraica é elíptica e provavelmente indica que sua aparência já não demonstrava aflição.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא שִׁפְחָתְךָ חֵן בְּעֵינֶיךָ
  choice: Que esta sua serva encontre favor aos seus olhos
  rationale: A forma verbal expressa um desejo cortês; “esta sua serva” reproduz de modo natural a autorreferência feminina e deferente de Ana, enquanto “encontre favor aos seus olhos” preserva a imagem do idioma hebraico.
- source_word: לְדַרְכָּהּ
  choice: seguiu seu caminho
  rationale: Expressa de maneira corrente a ideia idiomática de partir e prosseguir.
- source_word: וַתֹּאכַל
  choice: comeu
  rationale: O wayyiqtol apresenta a ação narrativa simples; o contexto mostra a retomada do ato de comer após a aflição.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: seu rosto já não estava abatido
  rationale: A construção hebraica é elíptica e indica que sua aparência já não era como antes; “abatido” comunica a mudança visível causada pelo alívio sem explicitar mais do que o contexto permite.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. Conserva-se o idioma bíblico compreensível “favor aos seus olhos”, e a elipse hebraica final é esclarecida em nota.
