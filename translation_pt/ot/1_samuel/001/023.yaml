base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: pt
  text: 'Então Elcana, seu marido, lhe disse: “Faça o que parecer melhor aos seus olhos. Fique até que você o desmame; apenas que Yahweh confirme a palavra dele[a].” Assim, a mulher ficou e amamentou seu filho até desmamá-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estabeleça” ou “cumpra a palavra dele”. O hebraico pode se referir à promessa de Yahweh ou ao assunto mencionado no contexto imediato.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: seu marido
  rationale: No contexto, אִישׁ com sufixo indica a relação conjugal de Elcana com Ana; “seu marido” é natural e preciso em português.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: Faça o que parecer melhor aos seus olhos
  rationale: Preserva a imagem do idioma hebraico, ao mesmo tempo que comunica naturalmente a ideia de agir conforme o próprio julgamento.
- source_word: שְׁבִי
  choice: Fique
  rationale: Aqui o imperativo significa permanecer onde está, e não sentar-se; “fique” é claro e corrente.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: até que você o tenha desmamado / até desmamá-lo
  rationale: Neste contexto de cuidado materno, גמל se refere especificamente ao desmame.
- source_word: אַךְ
  choice: apenas
  rationale: Marca uma ressalva ou qualificação à permissão anterior, preservando a função discursiva do hebraico.
- source_word: יָקֵם
  choice: que ... confirme
  rationale: A forma expressa desejo ou oração. “Confirme” comunica o causativo de קום aplicado a uma palavra, sem exigir que se trate exclusivamente do cumprimento de uma promessa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דְּבָרוֹ
  choice: a palavra dele
  rationale: דבר pode significar palavra, assunto ou promessa. A tradução direta preserva a ambiguidade do referente.
- source_word: וַתֵּינֶק
  choice: amamentou
  rationale: O verbo denota alimentar ao peito; “amamentou” é claro, atual e natural em português.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Mantém o substantivo comum definido do hebraico, sem substituí-lo interpretativamente pelo nome Ana.
theological_decisions:
- issue: Referente de “a palavra dele” na declaração de Elcana
  choice: Mantida a expressão “a palavra dele”, sem especificar seu referente
  alternative: “sua promessa”, “a palavra a respeito do menino” ou “a palavra/voto de Ana confirmado por Yahweh”
  rationale: O hebraico traz literalmente “a palavra dele” e permite mais de uma compreensão contextual. A tradução conserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “aos seus olhos” conserva o sabor do idioma hebraico; “parecer melhor” evita rigidez excessivamente literal.
