    issue: Perda do sentido de “estar de pé” em “a mulher que esteve”.
    rationale: הַנִּצֶּבֶת é um particípio que descreve Ana como estando de pé junto de Eli; “esteve” apenas afirma presença e elimina esse elemento semântico.
  - severity: low
    issue: Alternância de tratamento entre “meu senhor” e “você”.
    rationale: “Meu senhor” estabelece deferência; “tão certo como o senhor vive” mantém esse registro de forma mais natural em português.
  - severity: medium
    issue: Marcador da nota posicionado após “Yahweh”, embora a nota explique a fórmula “tão certo como ... vive”.
    rationale: O marcador deve seguir a expressão à qual a nota lexical se refere, para não sugerir que ela comenta o nome divino.
