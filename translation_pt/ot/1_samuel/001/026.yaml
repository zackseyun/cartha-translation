base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: pt
  text: 'E ela disse: “Por favor, meu senhor, tão certo como o senhor vive,[a] meu senhor, eu sou a mulher que estava de pé aqui ao seu lado, orando a Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “pela vida da sua alma”; trata-se de uma fórmula de juramento que expressa um apelo enfático.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Por favor
  rationale: A partícula funciona aqui como expressão respeitosa de súplica; “Por favor” é natural e mantém a deferência.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de se dirigir a Eli, não um título divino; “meu senhor” preserva a deferência social do hebraico.
- source_word: חֵי נַפְשְׁךָ
  choice: tão certo como você vive
  rationale: Traduz de modo idiomático a fórmula de juramento que apela à vida da pessoa interpelada.
- source_word: הָאִשָּׁה הַנִּצֶּבֶת
  choice: a mulher que esteve
  rationale: Identifica Ana como a mulher específica anteriormente presente naquele lugar; em português, “que esteve” comunica naturalmente a referência à cena passada.
- source_word: עִמְּכָה בָּזֶה
  choice: aqui ao seu lado
  rationale: No contexto, indica proximidade física no mesmo local, não companhia em sentido amplo.
- source_word: לְהִתְפַּלֵּל
  choice: orando
  rationale: O gerúndio expressa naturalmente a atividade que Ana realizava enquanto estava naquele lugar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “meu senhor” foi mantida por refletir a insistência respeitosa do hebraico. O marcador foi colocado junto à fórmula explicada pela nota.
