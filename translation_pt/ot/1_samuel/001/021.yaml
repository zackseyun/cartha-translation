base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: pt
  text: Então Elcana subiu com toda a sua casa para oferecer a Yahweh o sacrifício anual e o seu voto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e para cumprir o seu voto». O hebraico diz literalmente «e o seu voto», deixando implícita a ação relacionada ao voto.'
    reason: alternativa sintática e lexical
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido normal de עלה e a linguagem de peregrinação ao santuário em Siló.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: Elcana
  rationale: O nome identifica o homem já conhecido no contexto; omitir a redundância pouco natural 'o homem Elcana' produz português corrente sem perda referencial.
- source_word: וְכָל בֵּיתוֹ
  choice: com toda a sua família
  rationale: בַּיִת designa aqui os membros da casa, não o edifício; 'família' é claro e natural em português.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: para oferecer a Yahweh
  rationale: No contexto cultual, זבח significa oferecer em sacrifício; o objeto 'o sacrifício' completa naturalmente a expressão em português. O nome divino é transliterado como Yahweh.
- source_word: זֶבַח הַיָּמִים
  choice: o sacrifício anual
  rationale: A expressão idiomática indica o sacrifício recorrente de cada ano.
- source_word: וְאֶת נִדְרוֹ
  choice: e o seu voto
  rationale: Mantém a coordenação e a elipse do hebraico, sem explicitar no corpo do texto como o voto seria cumprido.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio da aliança presente no texto hebraico.
- issue: Relação sintática entre o sacrifício anual e o voto
  choice: preservar a expressão elíptica 'e o seu voto'
  alternative: e para cumprir o seu voto
  rationale: O hebraico coordena os dois elementos por meio do marcador de objeto; explicitar 'cumprir' é plausível, mas resolve uma elipse que o texto deixa implícita.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. Emprega 'subiu' para conservar a linguagem de peregrinação e mantém na tradução principal a concisão ambígua do hebraico.
