base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: pt
  text: Então eles abateram o touro[a] e levaram o menino a Eli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sacrificaram». O verbo hebraico também pode ser traduzido mais genericamente como «mataram»; neste contexto, refere-se ao abate do animal para o sacrifício.
    reason: lexical_alternative
  - marker: b
    text: Ou «a criança». O termo hebraico pode designar uma criança, um menino ou um jovem, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Então eles sacrificaram
  rationale: O wayyiqtol faz a narrativa avançar. Em português, «sacrificaram» comunica naturalmente o abate ritual indicado pelo contexto, embora o verbo hebraico também possa ser traduzido de modo mais geral.
- source_word: הַפָּר
  choice: o touro
  rationale: פַּר designa com frequência um touro, especialmente em contextos sacrificiais. O versículo usa o substantivo singular definido, sem repetir aqui a idade do animal.
- source_word: וַיָּבִיאוּ
  choice: e levaram
  rationale: O segundo wayyiqtol continua a sequência narrativa. «Levaram» expressa de modo natural em português o movimento da criança até Eli.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נַעַר pode designar criança, menino ou jovem. Como Samuel ainda era muito novo neste contexto, «menino» é a opção mais precisa e natural.
- source_word: אֶל עֵלִי
  choice: a Eli
  rationale: אֶל indica movimento em direção a uma pessoa; «a Eli» preserva diretamente esse sentido.
theological_decisions:
- issue: Nuance sacrificial do abate
  choice: Traduzir por «sacrificaram» para tornar natural e perceptível o contexto ritual.
  alternative: «mataram» ou «abateram»
  rationale: O contexto imediato trata de culto e oferta em Siló. «Sacrificaram» mantém a dimensão cultual sem acrescentar uma explicação extensa ao texto; a nota registra a alternativa lexical mais geral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem sequencial da narrativa foi preservada por «Então... e...». Todas as notas têm marcadores correspondentes no texto principal.
