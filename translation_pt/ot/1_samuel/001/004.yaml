  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: pt
  text: Quando chegava o dia[a], Elcana oferecia o sacrifício e dava porções a Penina, sua mulher, e a todos os filhos e filhas dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando chegou o dia, Elcana ofereceu o sacrifício e deu porções a Penina, sua mulher, e a todos os filhos e filhas dela.” As formas hebraicas podem ser entendidas como uma sequência narrativa no passado, mas o contexto favorece a ideia de uma prática costumeira na refeição sacrificial recorrente.'
    reason: alternativa gramatical e contextual
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Quando chegava o dia
  rationale: A fórmula narrativa estabelece o momento da ação. O imperfeito habitual em português comunica com naturalidade que se tratava de uma ocasião recorrente, conforme o contexto, sem eliminar a possibilidade formal de uma referência pontual, registrada na nota.
- source_word: וַיִּזְבַּח
  choice: oferecia o sacrifício
  rationale: זבח designa o ato de sacrificar, incluindo o abate ou a oferta sacrificial. Esta formulação é clara e idiomática no contexto de culto.
- source_word: וְנָתַן
  choice: dava
  rationale: Embora a forma possa integrar uma sequência narrativa no passado, o contexto descreve uma prática recorrente de Elcana; o imperfeito expressa esse valor habitual naturalmente em português.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: a Penina, sua mulher
  rationale: Preserva a ordem do hebraico e identifica explicitamente a relação, com pontuação natural em português.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: e a todos os filhos e filhas dela
  rationale: Mantém a menção explícita tanto aos filhos quanto às filhas e deixa claro que os pronomes se referem a Penina.
- source_word: מָנוֹת
  choice: porções
  rationale: O termo indica partes ou porções distribuídas, aqui no contexto da refeição sacrificial. “Porções” é preciso e natural.
