base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: pt
  text: Ana falava em seu coração; apenas seus lábios se moviam[a], mas não se ouvia sua voz. Por isso, Eli pensou que ela estava bêbada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «falava consigo mesma» / «orava em silêncio, dentro de si». Literalmente, o hebraico diz «falava em seu coração».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: falava em seu coração
  rationale: Preserva a imagem hebraica de fala interior e, no contexto, comunica uma oração não vocalizada sem explicitar além do texto.
- source_word: רַק
  choice: apenas
  rationale: 'Marca a limitação: o movimento dos lábios era o único sinal exterior perceptível.'
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: seus lábios se moviam
  rationale: Traduz naturalmente o movimento visível e contínuo dos lábios em contraste com a voz inaudível.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: mas sua voz não era ouvida
  rationale: Mantém a construção passiva do hebraico; «mas» expressa em português o contraste contextual entre lábios em movimento e voz não ouvida.
- source_word: וַיַּחְשְׁבֶהָ
  choice: Eli pensou que ela estivesse
  rationale: Expressa de modo claro e corrente a ideia de considerar ou julgar alguém como estando em certa condição.
- source_word: לְשִׁכֹּרָה
  choice: bêbada
  rationale: Equivalente predicativo natural para a condição de embriaguez indicada pelo adjetivo hebraico.
- source_word: וְחַנָּה הִיא
  choice: Ana
  rationale: O nome como tópico basta em português; não se acrescenta um advérbio temporal inexistente no original, e o pronome enfático hebraico não exige tradução separada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a imagem semítica «em seu coração» no texto principal e esclarece na nota o sentido de fala ou oração interior. O pretérito imperfeito reproduz adequadamente a ação em curso; «estivesse bêbada» é a construção idiomática após «pensou que».
