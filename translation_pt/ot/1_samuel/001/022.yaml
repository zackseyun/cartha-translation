source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: pt
  text: 'Ana, porém, não subiu, pois disse ao marido: “Só o levarei quando o menino for desmamado, para que ele se apresente diante de Yahweh[a] e fique ali para sempre[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra interpretação ou tradição textual: “e eu me apresentarei diante de Yahweh, e ele ficará ali para sempre”.'
    reason: alternative_reading
  - marker: b
    text: “Para sempre” refere-se aqui à dedicação permanente de Samuel ao serviço de Yahweh, isto é, por toda a sua vida.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: subiu
  rationale: Preserva o sentido usual de עלה, “subir”, que neste contexto se refere à ida ao santuário em Siló.
- source_word: כִּי אָמְרָה
  choice: pois disse
  rationale: Introduz naturalmente, em português, a razão pela qual Ana não subiu.
- source_word: לְאִישָׁהּ
  choice: ao marido
  rationale: Neste contexto, אִישׁ com o sufixo possessivo designa claramente o marido de Ana.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: Só quando o menino for desmamado
  rationale: Reproduz de modo natural a ideia temporal e restritiva de que Ana não o levaria antes do desmame.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נַעַר pode designar criança, menino ou jovem; aqui se refere a Samuel ainda pequeno.
- source_word: וַהֲבִאֹתִיו
  choice: eu o levarei
  rationale: Expressa a ação que Ana pretende realizar depois do desmame, mantendo explícito o menino como objeto.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: para que ele se apresente diante de Yahweh
  rationale: O nifal de ראה nesta fórmula cultual tem o sentido de comparecer ou apresentar-se diante de Deus. O menino é tomado como sujeito, em continuidade com a ação de levá-lo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְיָשַׁב שָׁם
  choice: e fique ali
  rationale: ישב pode significar sentar-se, habitar, permanecer ou ficar; aqui indica a permanência de Samuel no santuário.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Mantém a expressão hebraica concisa; no contexto, refere-se à dedicação permanente de Samuel durante toda a vida.
theological_decisions:
- issue: Sujeito de “se apresente diante de Yahweh” e “fique ali”
  choice: Samuel é o sujeito de ambas as ações.
  alternative: Ana pode ser entendida como sujeito de “eu me apresentarei”, enquanto Samuel continua como sujeito de “ele ficará ali”.
  rationale: A sequência após “eu o levarei” favorece naturalmente o menino como sujeito das ações seguintes e corresponde à sua dedicação ao serviço no santuário. A tradição textual ou construção alternativa é preservada em nota, sem eliminar a ambiguidade relevante.
- issue: Sentido de “para sempre”
  choice: Manter a formulação temporal abrangente no texto principal.
  alternative: Traduzir diretamente como “por toda a vida”.
  rationale: “Para sempre” representa de perto עַד עוֹלָם, enquanto a nota esclarece que, neste contexto, a expressão aponta para a dedicação vitalícia de Samuel.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Só quando... eu o levarei” preserva a força restritiva de עַד sem soar artificial. O nome divino é apresentado como “Yahweh”, e a ambiguidade textual relevante é documentada em nota.
