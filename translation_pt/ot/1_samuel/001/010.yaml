  text: וְ/הִ֖יא מָ֣רַת נָ֑פֶשׁ וַ/תִּתְפַּלֵּ֥ל עַל יְהוָ֖ה וּ/בָכֹ֥ה תִבְכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: pt
  text: Ela estava com a alma amargurada[a]; orou a Yahweh e chorou muito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “amargurada de alma”, expressão que indica profunda angústia interior.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “chorando, chorou”, construção que intensifica a ação; também pode ser entendida como “continuou chorando”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: com a alma amargurada
  rationale: Preserva a imagem hebraica, literalmente ligada à amargura da alma, em uma expressão portuguesa natural que comunica profunda angústia interior.
- source_word: וַתִּתְפַּלֵּל
  choice: orou
  rationale: O hitpael de פלל significa aqui simplesmente orar; a intensidade emocional já é comunicada pela angústia e pelo choro.
- source_word: עַל יְהוָה
  choice: a Yahweh
  rationale: Com o verbo 'orar', a preposição indica a pessoa a quem a oração é dirigida. Em português, 'orar a Yahweh' é direto e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וּבָכֹה תִבְכֶּה
  choice: chorou muito
  rationale: A construção com infinitivo absoluto e verbo finito intensifica o ato de chorar. 'Chorou muito' transmite essa ênfase sem acrescentar ao verbo a ideia de amargura nem afirmar necessariamente duração contínua.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. 'Yahweh' o conserva por transliteração, sem substituí-lo pelo título 'SENHOR'.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A metáfora hebraica da alma amargurada foi preservada; a intensificação do choro foi expressa de modo natural e sua forma literal foi registrada em nota.
