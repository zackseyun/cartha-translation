  text: וְ/עַתָּ֗ה מַה יֵּ֧שׁ תַּֽחַת יָדְ/ךָ֛ חֲמִשָּׁה לֶ֖חֶם תְּנָ֣/ה בְ/יָדִ֑/י א֖וֹ הַ/נִּמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: pt
  text: Agora, o que você tem à mão? Dê-me cinco pães, ou o que houver disponível.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ou o que puder ser encontrado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição para o pedido prático e imediato de Davi; em português, “Agora” comunica naturalmente essa função temporal e discursiva.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: o que você tem à mão?
  rationale: A expressão hebraica literalmente fala do que está “debaixo da mão”, isto é, do que alguém possui ou tem imediatamente disponível. “Ter à mão” preserva bem a imagem e o sentido idiomático.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: cinco pães
  rationale: Embora לֶחֶם possa designar pão coletivamente, o numeral pede uma forma contável; “cinco pães” é claro e natural em português.
- source_word: תְּנָה בְיָדִי
  choice: Dê-me
  rationale: A construção significa literalmente “dê na minha mão”. O pronome oblíquo expressa de modo idiomático o destinatário da entrega, sem reproduzir uma formulação artificial.
- source_word: אוֹ הַנִּמְצָא
  choice: ou o que houver disponível
  rationale: O particípio passivo de מצא pode significar “o que for encontrado” ou, no contexto, aquilo que estiver disponível. A formulação mantém a abertura do pedido sem especificar algo ausente do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. A tradução conserva a concisão e a urgência do pedido, empregando equivalência ótima para os idiomatismos hebraicos.
