  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: pt
  text: 'O sacerdote respondeu a Davi: “Não tenho pão comum à mão, mas há pão santo, desde que os jovens tenham se abstido de mulheres[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de uma mulher”, isto é, abstendo-se de relações sexuais para manter a pureza ritual.
    reason: Alternativa lexical para o singular מֵאִשָּׁה e esclarecimento contextual limitado.
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: pão comum
  rationale: חֹל contrasta com קֹדֶשׁ e designa pão não consagrado, não algo moralmente profano. “Pão comum” é natural e mantém o contraste cultual.
- source_word: אֶל תַּחַת יָדִי
  choice: tenho à mão
  rationale: A expressão hebraica significa aquilo que está disponível ou em posse; “ter à mão” comunica o idioma com naturalidade.
- source_word: כִּי אִם
  choice: mas
  rationale: 'Na construção contrastiva, introduz a exceção: não há pão comum, mas há pão santo.'
- source_word: לֶחֶם קֹדֶשׁ
  choice: pão santo
  rationale: Expressa diretamente o caráter cultualmente separado do pão, sem recorrer a terminologia excessivamente técnica.
- source_word: אִם נִשְׁמְרוּ
  choice: desde que ... tenham se abstido
  rationale: O nifal de שׁמר indica aqui guardar-se de algo. “Desde que” torna clara a condição, e “tenham se abstido” transmite o sentido contextual com naturalidade.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: נְעָרִים pode designar jovens ou acompanhantes. “Os jovens” preserva o valor lexical sem especificar uma função não declarada.
- source_word: אַךְ
  choice: sem equivalente lexical separado
  rationale: Aqui a partícula restringe o âmbito da condição. Essa força já é comunicada pela construção “tenham se abstido de mulher”; acrescentar “ao menos” poderia introduzir uma nuance pragmática excessiva.
- source_word: מֵאִשָּׁה
  choice: de mulher
  rationale: Mantém o singular formal do hebraico e sua ambiguidade genuína; a nota explica o sentido contextual provável sem incorporá-lo de modo expansivo ao texto.
theological_decisions:
- issue: Condição de pureza ritual para receber o pão santo
  choice: Apresentar a abstinência dos jovens como condição para o acesso ao pão santo, sem ampliar a formulação hebraica.
  alternative: Explicitar no texto principal que se trata de abstinência de relações sexuais para manter a pureza ritual.
  rationale: O contexto envolve categorias cultuais de santidade, não uma afirmação geral sobre mulheres ou sexualidade. A nota esclarece a referência provável, enquanto o texto preserva a concisão e a tensão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala foi tornada natural sem perder o contraste entre pão comum e pão santo. O marcador [a] aparece no texto principal.
