base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: pt
  text: Davi levou a sério aquelas palavras[a] e ficou com muito medo de Aquis, rei de Gate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Davi pôs aquelas palavras no coração». A expressão hebraica indica que ele as considerou interiormente e lhes deu séria atenção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: levou a sério
  rationale: A expressão hebraica, literalmente «pôs ... no coração», indica que Davi acolheu interiormente as palavras e lhes deu séria consideração. «Levou a sério» comunica esse sentido com naturalidade em português.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: aquelas palavras
  rationale: דְּבָרִים pode significar «palavras», «coisas» ou «assuntos». No contexto, refere-se ao que os servos de Aquis acabavam de dizer; «aquelas palavras» torna claro esse referente discursivo.
- source_word: וַיִּרָא מְאֹד
  choice: ficou com muito medo
  rationale: Preserva a forte intensificação de מְאֹד em linguagem atual, clara e natural.
- source_word: מִפְּנֵי
  choice: de
  rationale: Na construção hebraica que expressa temor, a forma idiomática em português é «ter medo de».
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Transliteração tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: מֶלֶךְ גַּת
  choice: rei de Gate
  rationale: Reproduz diretamente a cadeia construta hebraica; «Gate» é a forma tradicional do topônimo em português.
