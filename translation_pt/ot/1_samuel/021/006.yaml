  text: וַ/יַּעַן֩ דָּוִ֨ד אֶת הַ/כֹּהֵ֜ן וַ/יֹּ֣אמֶר ל֗/וֹ כִּ֣י אִם אִשָּׁ֤ה עֲצֻֽרָה לָ֨/נוּ֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם בְּ/צֵאתִ֕/י וַ/יִּהְי֥וּ כְלֵֽי הַ/נְּעָרִ֖ים קֹ֑דֶשׁ וְ/הוּא֙ דֶּ֣רֶךְ חֹ֔ל וְ/אַ֕ף כִּ֥י הַ/יּ֖וֹם יִקְדַּ֥שׁ בַּ/כֶּֽלִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: pt
  text: 'Davi respondeu ao sacerdote e lhe disse: “De fato, as mulheres têm sido mantidas afastadas de nós[a] desde ontem e anteontem, desde que parti[b]; os utensílios dos moços estão consagrados[c], embora esta seja uma viagem comum. E, mais ainda, hoje será consagrado no utensílio[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma mulher foi retida de nós”. A expressão se refere à abstinência sexual; também pode ser entendida como “temos nos mantido afastados de mulheres”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “como ontem, três dias atrás”. O idiomatismo remete aos dias anteriores; alguns o entendem mais especificamente como “há cerca de três dias”.
    reason: lexical_alternative
  - marker: c
    text: “Utensílios” pode indicar objetos ou equipamento; alguns entendem a palavra aqui, de modo eufemístico, como os corpos ou as próprias pessoas dos moços.
    reason: lexical_alternative
  - marker: d
    text: 'O hebraico desta cláusula é difícil. O sujeito de “será consagrado” e o referente de “utensílio” permanecem incertos. Também se pode entender: “embora a viagem seja comum, hoje ele estará consagrado no utensílio”, ou formulação semelhante.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: temos nos mantido afastados de mulheres
  rationale: Expressa naturalmente em português a abstinência sexual indicada pelo hebraico, sem limitar a referência a uma única mulher nem sugerir mera separação involuntária.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: como de costume
  rationale: O idiomatismo remete aos dias anteriores e pode indicar uma prática habitual; a nota preserva a possibilidade de referência mais específica a cerca de três dias.
- source_word: בְּצֵאתִי
  choice: quando saio em missão
  rationale: O infinitivo marca a ocasião da partida. O contexto favorece uma saída em missão, e o presente habitual combina com a leitura de כִּתְמוֹל שִׁלְשֹׁם como costume.
- source_word: כְלֵי הַנְּעָרִים
  choice: os pertences dos moços
  rationale: כְּלִי pode designar objetos, utensílios ou equipamento. “Pertences” é corrente e mantém aberta, em nota, a possível referência eufemística aos corpos ou às pessoas.
- source_word: קֹדֶשׁ
  choice: consagrados
  rationale: Comunica o estado ritual de pertença à esfera sagrada sem reduzir o termo à limpeza física ou moral.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: embora esta seja uma viagem comum
  rationale: Preserva o contraste cultual entre o sagrado e o comum; חֹל não significa necessariamente pecaminoso ou impuro.
- source_word: וְאַף כִּי
  choice: Quanto mais
  rationale: Conserva a força intensificadora ou inferencial da expressão, sem apagar a dificuldade sintática da cláusula.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: hoje estarão consagrados
  rationale: Representa o valor passivo ou reflexivo possível do verbo e concorda em português com “pertences”, embora o sujeito exato permaneça obscuro no hebraico.
- source_word: בַּכֶּלִי
  choice: junto com os pertences
  rationale: Oferece uma formulação portuguesa inteligível sem esconder que a preposição e o referente de כְּלִי são incertos; a nota registra alternativas mais literais.
theological_decisions:
- issue: Linguagem de pureza ritual ligada à abstinência e aos pães consagrados
  choice: Traduzir em termos de consagração ritual, mantendo o contraste entre sagrado e comum.
  alternative: Interpretar a declaração sobretudo como pureza moral ou apenas como higiene prática.
  rationale: O contexto trata da aptidão para receber pão consagrado. A tradução conserva a moldura cultual do hebraico sem importar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Moços”, “consagrados” e “viagem comum” preservam o ambiente narrativo e cultual sem arcaísmo excessivo. As quatro marcas de nota aparecem no texto principal e documentam as ambiguidades reais do hebraico.
