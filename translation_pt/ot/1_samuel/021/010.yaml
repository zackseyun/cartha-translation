revisions:
- from: 'E o sacerdote disse: “A espada de Golias, o filisteu, a quem você abateu no vale de Elá, está ali, envolvida num manto[a], atrás do éfode. Se quiser levá-la para você, leve-a, pois não há outra além dela aqui”. E Davi disse: “Não há outra igual; dê-a a mim”.'
  to: 'E o sacerdote disse: “A espada de Golias, o filisteu, a quem você abateu no vale de Elá — veja, ela está envolvida num manto[a], atrás do éfode. Se quiser levá-la para você, leve-a, pois não há outra além dela aqui”. E Davi disse: “Não há outra igual; dê-a a mim”.'
  rationale: A única alteração substitui «está ali» por «veja, ela está envolvida», a fim de representar a função apresentativa de הִנֵּה e evitar acrescentar uma indicação locativa independente. A nota e todas as demais escolhas foram mantidas.
