base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: pt
  text: 'E o sacerdote disse: “A espada de Golias, o filisteu, a quem você abateu no vale de Elá — veja, ela está envolvida num manto[a], atrás do éfode. Se quiser levá-la para você, leve-a, pois não há outra além dela aqui”. E Davi disse: “Não há outra igual; dê-a a mim”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico designa uma veste exterior e também pode ser traduzido como “capa” ou “vestimenta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: A espada de Golias, o filisteu
  rationale: Expressa naturalmente a relação de posse e preserva a identificação étnica em aposição.
- source_word: הִכִּיתָ
  choice: você abateu
  rationale: נכה pode significar golpear e, em contexto de combate, derrubar ou matar. “Abateu” conserva a força marcial sem tornar o verbo desnecessariamente explícito.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: no vale de Elá
  rationale: Forma clara e corrente para o topônimo, com transliteração portuguesa do nome.
- source_word: הִנֵּה הִיא
  choice: está ali
  rationale: Representa de modo natural a função dêitica de הִנֵּה, chamando atenção para a localização da espada, sem recorrer ao mais arcaico “eis”.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: envolvida num manto
  rationale: O particípio indica que a espada estava coberta ou envolta; שׂמלה designa normalmente uma veste exterior ou manto, não apenas tecido genérico.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: atrás do éfode
  rationale: Emprega o sentido espacial de אַחֲרֵי e mantém o termo cultual tradicional, sem explicação intrusiva no texto.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: Se quiser levá-la para você, leve-a
  rationale: Reproduz de maneira idiomática a condição volitiva e a permissão enfática, preservando o valor de לְךָ, “para você”.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: pois não há outra além dela aqui
  rationale: Mantém a exceção marcada por זוּלָתָהּ e entende בָּזֶה contextualmente como referência ao lugar.
- source_word: אֵין כָּמוֹהָ
  choice: Não há outra igual
  rationale: Expressa a singularidade ou excelência da espada e conserva a referência feminina em português.
- source_word: תְּנֶנָּה לִּי
  choice: dê-a a mim
  rationale: Tradução direta do imperativo com objeto feminino, em registro digno e inteligível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O discurso direto mantém alguma solenidade narrativa sem arcaísmos; “você” torna explícito o singular do hebraico.
