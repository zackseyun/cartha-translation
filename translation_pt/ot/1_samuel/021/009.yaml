  text: וַ/יֹּ֤אמֶר דָּוִד֙ לַ/אֲחִימֶ֔לֶךְ וְ/אִ֛ין יֶשׁ פֹּ֥ה תַֽחַת יָדְ/ךָ֖ חֲנִ֣ית אוֹ חָ֑רֶב כִּ֣י גַם חַרְבִּ֤/י וְ/גַם כֵּלַ/י֙ לֹֽא לָקַ֣חְתִּי בְ/יָדִ֔/י כִּֽי הָיָ֥ה דְבַר הַ/מֶּ֖לֶךְ נָחֽוּץ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: pt
  text: 'Então Davi disse a Aimeleque: “Você não tem aqui à sua disposição[a] alguma lança ou espada? É que não trouxe comigo nem a minha espada nem o meu equipamento[b], pois o assunto do rei[c] era urgente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “debaixo da sua mão”; expressão que pode significar “à sua disposição” ou “em sua posse”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os meus apetrechos” ou “as minhas armas”. O termo hebraico pode designar de modo amplo utensílios ou equipamento; neste contexto, provavelmente se refere a equipamento militar.
    reason: lexical_alternative
  - marker: c
    text: Ou “a incumbência do rei”, “a ordem do rei” ou “o negócio do rei”. O termo hebraico é amplo e também pode significar “palavra” ou “questão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” é natural em português e não acrescenta uma relação temporal forte.
- source_word: לַאֲחִימֶלֶךְ
  choice: a Aimeleque
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: וְאִין יֶשׁ
  choice: Você não tem ... alguma
  rationale: Expressa em português corrente a pergunta existencial negativa do hebraico, que no contexto procura confirmar a disponibilidade de uma arma.
- source_word: פֹּה
  choice: aqui
  rationale: Equivalente locativo direto e natural.
- source_word: תַחַת יָדְךָ
  choice: à sua disposição
  rationale: Traduz o sentido idiomático de “debaixo da sua mão”; evita um decalque pouco natural em português, preservando a imagem literal em nota.
- source_word: חֲנִית אוֹ חָרֶב
  choice: alguma lança ou espada
  rationale: Mantém os dois tipos de arma no singular; “alguma” torna natural a pergunta negativa em português.
- source_word: כִּי
  choice: É que
  rationale: Introduz naturalmente, na fala direta, a explicação de Davi para o pedido.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: nem a minha espada nem o meu equipamento
  rationale: Com a negação verbal, a correlação “nem... nem...” reproduz idiomaticamente a ênfase de גַם...וְגַם. כְּלִי é amplo e pode designar utensílio, equipamento ou arma.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: não trouxe comigo
  rationale: Equivalente português natural da expressão concreta “não tomei na minha mão”, indicando que Davi saiu sem esses objetos.
- source_word: דְבַר הַמֶּלֶךְ
  choice: o assunto do rei
  rationale: “Assunto” conserva melhor a amplitude de דָּבָר, sem decidir se se trata especificamente de ordem, missão ou negócio.
- source_word: נָחוּץ
  choice: urgente
  rationale: Comunica com clareza moderna a ideia de algo premente, que exigia pressa.
theological_decisions: []
