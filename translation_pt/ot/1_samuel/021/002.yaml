  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: pt
  text: 'Davi chegou a Nobe, ao sacerdote Aimeleque. Aimeleque tremeu ao encontrar Davi e lhe perguntou: “Por que você está sozinho, sem ninguém com você?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: tremeu
  rationale: Preserva a força concreta do verbo hebraico, que pode expressar tremor causado por medo ou apreensão, sem explicitar uma causa não declarada.
- source_word: לִקְרַאת דָּוִד
  choice: ao encontrar Davi
  rationale: Expressa naturalmente a ideia de sair ou vir ao encontro de alguém no contexto, sem tornar a frase pesada.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: sem ninguém com você
  rationale: Traduz idiomaticamente a construção hebraica, cujo sentido é que nenhuma outra pessoa acompanhava Davi; evita o uso marcado de 'homem' quando o foco é a ausência de companhia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “você” torna a fala direta natural sem perder o respeito contextual; a repetição do nome Davi acompanha a estrutura narrativa hebraica.
