base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: pt
  text: Então ele mudou seu comportamento diante dos olhos deles e passou a agir como louco enquanto estava nas mãos deles[a]; fez marcas[b] nas portas do portão e deixou a saliva escorrer sobre a barba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fingiu estar louco”. O verbo hebraico descreve um comportamento de loucura, e o contexto mais amplo indica que foi deliberado.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é difícil e também pode ser entendido como “rabiscou” ou “arranhou” nas portas do portão.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: mudou seu comportamento
  rationale: טַעַם pode indicar discernimento ou juízo, mas, neste contexto narrativo, refere-se à conduta ou aparência observável de Davi. A tradução evita afirmar que houve uma mudança mental real.
- source_word: בְּעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Preserva a imagem vívida do idioma hebraico e comunica naturalmente 'à vista deles'.
- source_word: וַיִּתְהֹלֵל
  choice: se fez de louco
  rationale: O hitpael descreve comportamento de loucura; o contexto mostra que Davi o adotou deliberadamente. A expressão portuguesa comunica tanto a aparência de loucura quanto seu caráter intencional.
- source_word: בְּיָדָם
  choice: enquanto estava nas mãos deles
  rationale: Mantém a imagem literal hebraica, ao mesmo tempo que explicita a relação circunstancial; a expressão pode indicar que Davi estava sob o poder ou controle deles.
- source_word: ויתו
  choice: rabiscou
  rationale: A forma verbal é difícil e sua leitura exata é incerta. No contexto, descreve a produção de marcas nas portas; 'rabiscou' é natural em português, sem especificar em excesso o tipo de marca.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: as portas do portão
  rationale: Tradução direta da expressão, referente às folhas ou portas do portão.
- source_word: וַיּוֹרֶד רִירוֹ
  choice: deixou a saliva escorrer
  rationale: Expressa em português natural a ação causativa descrita pelo hebraico, sem recorrer ao termo mais coloquial 'baba'.
- source_word: אֶל־זְקָנוֹ
  choice: sobre a barba
  rationale: Comunica o movimento da saliva até a barba e sobre ela, de modo idiomático em português.
