  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: pt
  text: Então o sacerdote lhe deu pão sagrado, pois não havia ali pão, a não ser o pão da Presença[a], que havia sido retirado de diante de Yahweh para colocar ali pão quente no dia em que era retirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “pães da proposição”. Literalmente, “pão da Presença”.
    reason: Registra a tradução tradicional e esclarece a forma literal da expressão cultual hebraica.
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: pão sagrado
  rationale: Embora o substantivo signifique literalmente “coisa sagrada” ou “santidade”, o contexto identifica claramente o referente como pão consagrado; explicitar “pão” produz português natural sem acrescentar conteúdo estranho ao texto.
- source_word: לֶחֶם הַפָּנִים
  choice: pão da Presença
  rationale: Preserva de modo transparente a expressão cultual hebraica para o pão colocado diante de Yahweh, evitando depender do termo tradicional menos claro “pães da proposição”.
- source_word: הַמּוּסָרִים
  choice: que havia sido retirado
  rationale: A oração relativa expressa naturalmente em português o particípio passivo atributivo. O singular acompanha “pão” como substantivo coletivo, embora a forma hebraica do particípio seja plural.
- source_word: מִלִּפְנֵי יְהוָה
  choice: de diante de Yahweh
  rationale: Mantém a imagem espacial e cultual do hebraico, segundo a qual o pão permanecia diante de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לָשׂוּם
  choice: para colocar
  rationale: Expressa de forma direta e idiomática o infinitivo de propósito.
- source_word: לֶחֶם חֹם
  choice: pão quente
  rationale: Reproduz o sentido lexical direto de חֹם. Embora o contexto implique pão recém-assado, “quente” preserva a formulação concreta do hebraico.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: no dia em que era retirado
  rationale: Conserva a referência temporal e a voz passiva do infinitivo hebraico sem explicitar além do texto qual ocorrência ritual está em foco.
- source_word: כִּי לֹא הָיָה שָׁם לֶחֶם כִּי אִם
  choice: pois não havia ali outro pão, a não ser
  rationale: A formulação comunica claramente tanto a explicação quanto a exceção. “Outro” torna natural em português a ideia contextual de que não havia pão comum disponível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título “SENHOR”.
- issue: Relação ritual entre o pão retirado e o pão quente
  choice: para colocar ali pão quente no dia em que era retirado
  alternative: para colocar pão quente em seu lugar no dia em que era retirado
  rationale: “Ali” segue de perto o texto, que não contém um possessivo equivalente a “em seu lugar”, e preserva sem expansão a relação entre retirada e reposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “pão” como coletivo e mantém a repetição ritual do original sem transformar “quente” em “fresco” nem acrescentar explicitamente “em seu lugar”.
