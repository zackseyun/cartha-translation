  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: pt
  text: Então ele se levantou e partiu, e Jônatas entrou na cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Então ele se levantou
  rationale: O qal wayyiqtol de קום indica a sequência narrativa e significa levantar-se. “Então” exprime naturalmente o avanço da narrativa, e “se levantou” é claro e digno em português atual.
- source_word: וַיֵּלַךְ
  choice: e partiu
  rationale: O qal wayyiqtol de הלך significa ir/andar. No contexto da despedida, “partiu” comunica de modo conciso que ele foi embora, sem acrescentar destino ou intenção.
- source_word: וִיהוֹנָתָן
  choice: e Jônatas
  rationale: O nome próprio é transliterado segundo a forma portuguesa consagrada.
- source_word: בָּא
  choice: entrou
  rationale: O qal perfeito de בוא pode significar vir, chegar ou entrar conforme a construção. Diante de “a cidade”, “entrou” reproduz naturalmente o movimento para dentro dela e evita uma escolha dêitica artificial entre “veio” e “foi”.
- source_word: הָעִיר
  choice: na cidade
  rationale: עִיר designa cidade ou povoado. “Cidade” é a correspondência portuguesa tradicional e direta; com “entrou”, a preposição “em” contraída em “na” é idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, de ampla compreensão internacional e boa legibilidade brasileira. A tradução conserva a concisão e a progressão da narrativa hebraica. O pronome “ele” mantém a referência implícita do texto-fonte, identificável pelo contexto anterior como Davi.
