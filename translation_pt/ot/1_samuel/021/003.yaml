base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: pt
  text: 'Davi disse a Aimeleque, o sacerdote: “O rei me encarregou de uma missão e me disse: ‘Que ninguém[a] saiba coisa alguma sobre a missão para a qual envio você e da qual o encarreguei.’ Quanto aos jovens, indiquei-lhes certo lugar[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente, “nenhum homem saiba coisa alguma”. Aqui, “homem” tem sentido indefinido: ninguém.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “um lugar tal e tal”, expressão idiomática para um local não especificado ou não revelado.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: me encarregou de uma missão
  rationale: A combinação de צוה com דָבָר comunica uma incumbência ou missão recebida do rei. A formulação preserva a força de autoridade sem recorrer ao pouco natural “ordenou-me uma coisa”.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: Ninguém deve saber coisa alguma
  rationale: אִישׁ, embora literalmente “homem”, funciona aqui de modo indefinido e negativo. “Ninguém” expressa naturalmente em português a proibição geral, enquanto “coisa alguma” conserva a ênfase de מְאוּמָה.
- source_word: הַדָּבָר
  choice: a missão
  rationale: דָּבָר retoma aqui a incumbência real, não apenas uma palavra ou declaração. “Missão” mantém a referência clara no discurso.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: para a qual envio você
  rationale: A expressão apresenta a incumbência como a finalidade do envio de Davi. O presente “envio” reproduz o discurso direto hebraico.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: e da qual o encarreguei
  rationale: A tradução mantém a repetição conceitual de צוה e liga a ordem à missão, com sintaxe natural em português.
- source_word: וְאֶת־הַנְּעָרִים
  choice: Quanto aos jovens
  rationale: נְעָרִים pode designar jovens, servos ou acompanhantes. “Jovens” conserva a designação mais direta e evita definir indevidamente a função social deles.
- source_word: יוֹדַעְתִּי
  choice: indiquei-lhes
  rationale: O hifil de ידע significa fundamentalmente “fazer saber”. Neste contexto, com um lugar como complemento, “indiquei-lhes” comunica que Davi lhes deu a conhecer o local sem acrescentar que necessariamente os enviou até lá.
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: certo lugar
  rationale: A expressão idiomática dupla aponta para um lugar não especificado ou deliberadamente não revelado. “Certo lugar” é claro e natural; a forma mais literal fica registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural. “Você” representa o singular no discurso direto e favorece a legibilidade brasileira sem regionalismo marcado. A repetição de “missão” conserva a coesão do hebraico, e as notas registram literalidades que soariam artificiais no texto principal.
