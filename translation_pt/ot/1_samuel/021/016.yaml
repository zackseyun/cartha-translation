  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: pt
  text: Será que me faltam loucos? Por que vocês trouxeram este homem para agir como louco diante de mim? Este homem há de entrar na minha casa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: Será que me faltam loucos
  rationale: Preserva a pergunta retórica e o sarcasmo incisivo de Aquis. “Loucos” é natural em português atual e mantém o uso substantivado do plural hebraico.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: vocês terem trazido este homem
  rationale: Expressa com naturalidade o perfeito hebraico dentro da queixa retórica. “Este homem” conserva a referência demonstrativa e depreciativa sem soar artificial em português.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: para se comportar como louco
  rationale: O infinitivo hitpael descreve comportamento de loucura; a formulação preserva a possibilidade de comportamento representado, coerente com o contexto, sem inserir explicitamente a ideia de fingimento no versículo.
- source_word: עָלָי
  choice: diante de mim
  rationale: Neste contexto, a preposição indica comportamento ocorrido na presença e dirigido à atenção do rei, mais naturalmente expresso por “diante de mim”.
- source_word: הֲזֶה יָבוֹא אֶל־בֵּיתִי
  choice: Este homem há de entrar na minha casa?
  rationale: Mantém a repetição enfática do demonstrativo e a força indignada da pergunta. “Entrar na minha casa” comunica claramente o movimento para dentro da casa ou corte real.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As duas perguntas retóricas e o tom sarcástico e desdenhoso de Aquis foram preservados. Não se acrescentou nota, pois a tradução “se comportar como louco” já comunica a amplitude lexical relevante sem resolver além do texto a tensão entre loucura real e fingida.
