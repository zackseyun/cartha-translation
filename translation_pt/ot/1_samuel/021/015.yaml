    text: 'Ou: “um homem que está enlouquecido” ou “um louco”. O particípio hebraico pode descrever tanto loucura real quanto um comportamento apresentado como loucura.'
    reason: Alternativa lexical que preserva a ambiguidade entre condição real e comportamento representado.
  revision_rationale: A revisão elimina uma repetição pouco idiomática, sem perder a força de הִנֵּה תִרְאוּ, e substitui o gerúndio por uma oração relativa mais natural. Não há alteração do sentido, da ambiguidade lexical nem do registro.
