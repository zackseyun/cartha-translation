  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: pt
  text: 'E Aquis disse aos seus servos: “Vejam só: há um homem que se comporta como um louco.[a] Por que o trazem até mim?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um homem que está enlouquecido” ou “um louco”. O particípio hebraico pode descrever tanto loucura real quanto um comportamento apresentado como loucura.'
    reason: Alternativa lexical que preserva a ambiguidade entre condição real e comportamento representado.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Preserva o fluxo narrativo do waw consecutivo de modo natural em português.
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Tradução direta que, no contexto da corte, abrange os homens a serviço do rei.
- source_word: הִנֵּה תִרְאוּ
  choice: Vejam! Vocês estão vendo
  rationale: Mantém tanto a partícula que chama a atenção quanto o verbo explícito na segunda pessoa do plural, sem recorrer ao arcaico “eis”.
- source_word: אִישׁ
  choice: um homem
  rationale: Conserva a referência específica do substantivo hebraico.
- source_word: מִשְׁתַּגֵּעַ
  choice: se comportando como louco
  rationale: Expressa o valor participial e comportamental da forma hitpael, sem decidir se a loucura era real ou simulada.
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: Por que o trazem até mim?
  rationale: Reproduz a pergunta direta com o imperfeito hebraico e soa natural no discurso; “até mim” deixa claro o destino do movimento.
theological_decisions:
- issue: Se a loucura de Davi era real ou simulada
  choice: se comportando como louco
  alternative: um homem louco
  rationale: A formulação preserva a ambiguidade do particípio hebraico, que pode descrever comportamento de louco sem afirmar que o homem realmente sofria de insanidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “Vejam! Vocês estão vendo” é deliberada para conservar a combinação enfática de הִנֵּה com תִרְאוּ. O marcador da nota foi colocado junto à expressão que ele explica.
