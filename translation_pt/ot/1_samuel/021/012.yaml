reference: 1 Samuel 21:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: pt
  text: 'E os servos de Aquis lhe disseram: “Não é este Davi, o rei da terra? Não é a respeito dele que cantavam[a] nas danças, dizendo: ‘Saul abateu os seus milhares, e Davi, as suas dezenas de milhares[b]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “respondiam uns aos outros nas danças”, isto é, cantavam de modo responsivo enquanto dançavam.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “suas miríades” ou “seus dez milhares”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: O termo é amplo e, no construto com Aquis, designa membros de sua casa ou corte. “Servos” preserva essa amplitude sem restringi-los necessariamente a autoridades.
- source_word: הֲלוֹא
  choice: Não é... ?
  rationale: Mantém a forma de pergunta retórica que espera resposta afirmativa.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: o rei da terra
  rationale: Tradução direta que preserva a maneira possivelmente hiperbólica ou perceptiva pela qual os servos filisteus descrevem Davi, sem convertê-la numa explicação política.
- source_word: לָזֶה
  choice: a respeito dele
  rationale: No contexto da canção, indica Davi como a pessoa celebrada. A formulação é natural em português e conserva a referência.
- source_word: יַעֲנוּ
  choice: cantavam
  rationale: No contexto musical e coreográfico, o verbo indica cantar ou responder em canto; “cantavam” comunica claramente o sentido principal.
- source_word: בַמְּחֹלוֹת
  choice: nas danças
  rationale: Reproduz de perto a expressão hebraica e situa o canto nas celebrações com dança.
- source_word: הִכָּה
  choice: abateu
  rationale: No cântico de vitória, o verbo se refere a derrotar e matar em combate. “Abateu” é vívido, digno e menos arcaico que opções como “feriu de morte”.
- source_word: באלפו
  choice: os seus milhares
  rationale: Expressa a contagem de inimigos atribuída a Saul e preserva o paralelismo poético.
- source_word: ברבבתו
  choice: as suas dezenas de milhares
  rationale: רְבָבָה designa dez mil ou, em uso coletivo, miríades. “Dezenas de milhares” é português natural e mantém o contraste com “milhares”.
theological_decisions:
- issue: Se a descrição de Davi deve ser apresentada como título objetivo ou como percepção dos servos filisteus
  choice: o rei da terra
  alternative: o rei do país, entendido explicitamente como descrição hiperbólica ou popular
  rationale: O hebraico registra as palavras dos servos sem esclarecer se consideram Davi rei em sentido formal ou apenas a principal figura de Israel. A tradução conserva essa tensão narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservam-se as perguntas retóricas e o paralelismo do cântico; as notas registram as nuances lexicais sem sobrecarregar o texto principal.
