  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: pt
  text: Naquele dia, estava ali um dos servos de Saul, retido diante de Yahweh[a]. Seu nome era Doegue, o edomita, chefe dos pastores de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “impedido diante de Yahweh” ou “mantido diante de Yahweh”. O hebraico não informa por que Doegue estava retido.
    reason: alternativa lexical e preservação de ambiguidade
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: estava ali um dos servos de Saul
  rationale: Expressa naturalmente a existência e localização do homem, enquanto o partitivo מִן é explicitado por “um dos”.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: É a forma temporal corrente em português e mantém a referência ao dia já situado pela narrativa.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: retido diante de Yahweh
  rationale: “Retido” preserva a ideia passiva de alguém impedido de sair ou obrigado a permanecer, sem especificar a razão; “diante de” conserva o idioma de presença.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: Seu nome era Doegue, o edomita
  rationale: Reproduz naturalmente a fórmula de identificação; “Doegue” é uma adaptação portuguesa legível do nome, e “edomita” traduz o gentílico.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: chefe dos pastores de Saul
  rationale: No contexto do serviço real, אַבִּיר provavelmente indica posição de destaque ou autoridade; a relativa possessiva é incorporada de modo idiomático.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino. A transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido de נֶעְצָר לִפְנֵי יְהוָה
  choice: retido diante de Yahweh
  alternative: impedido diante de Yahweh; mantido diante de Yahweh
  rationale: A causa da permanência de Doegue não é informada. A tradução mantém a ambiguidade e não introduz uma explicação ritual específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil. O versículo é dividido em duas frases para clareza, sem perder a relação narrativa. O marcador [a] aparece imediatamente após a expressão explicada.
