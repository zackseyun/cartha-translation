  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: pt
  text: Então Davi se levantou e, naquele dia, fugiu de Saul. Ele foi até Aquis, rei de Gate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Preserva o sentido básico de קום e a sequência narrativa, em linguagem natural e digna.
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: É o equivalente direto e idiomático de ברח, mantendo a urgência da ação.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: Expressa com naturalidade a referência temporal definida; «mesmo» explicita a continuidade imediata sugerida pelo contexto sem alterar o sentido.
- source_word: מִפְּנֵי שָׁאוּל
  choice: de Saul
  rationale: A expressão literalmente relacionada à face ou presença de Saul significa aqui fugir dele; a formulação é clara e idiomática.
- source_word: וַיָּבֹא אֶל
  choice: foi até
  rationale: בוא com אֶל pode indicar vir ou ir até alguém. «Foi até» soa natural em português segundo a perspectiva do narrador e evita a estranheza de «veio a».
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Adota a forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: מֶלֶךְ גַּת
  choice: rei de Gate
  rationale: Reproduz diretamente a construção que identifica o cargo e o domínio de Aquis, usando a forma portuguesa corrente do topônimo.
