  text: שְׁבָ֤/ה אִתִּ/י֙ אַל תִּירָ֔א כִּ֛י אֲשֶׁר יְבַקֵּ֥שׁ אֶת נַפְשִׁ֖/י יְבַקֵּ֣שׁ אֶת נַפְשֶׁ֑/ךָ כִּֽי מִשְׁמֶ֥רֶת אַתָּ֖ה עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: pt
  text: Fique comigo e não tenha medo, pois quem procura tirar a minha vida procura também tirar a sua. Comigo você estará protegido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Comigo você estará em segurança”. A expressão hebraica é literalmente algo como “pois você é guarda/proteção comigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: Fique comigo
  rationale: O imperativo de יָשַׁב, neste contexto, pede que Abiatar permaneça na companhia de Davi, não que literalmente se sente. “Fique comigo” é natural e fiel ao sentido contextual.
- source_word: אַל תִּירָא
  choice: não tenha medo
  rationale: Expressa de modo corrente e digno a proibição hebraica; “não tema” seria possível, mas tem registro mais solene.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: quem procura tirar a minha vida
  rationale: No idioma hebraico, procurar a נֶפֶשׁ de alguém significa procurar matá-lo. A formulação portuguesa comunica esse sentido sem sugerir uma busca pela alma imaterial.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: procura também tirar a sua
  rationale: Preserva o paralelismo e evita repetir “vida” de forma pesada. “Também” explicita a relação paralela implícita, embora não corresponda a uma partícula hebraica separada.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: Comigo você estará protegido
  rationale: מִשְׁמֶרֶת pode indicar guarda, custódia ou proteção. A frase nominal hebraica é incomum; esta tradução transmite naturalmente a promessa de segurança sem ocultar a forma mais literal, registrada em nota.
theological_decisions:
- issue: Natureza da promessa de Davi
  choice: “Comigo você estará protegido” apresenta a declaração como garantia de proteção pessoal.
  alternative: “Comigo você estará em segurança” ou, mais literalmente, “você é guarda/proteção comigo”.
  rationale: O contexto favorece proteção ou custódia, mas a construção nominal hebraica é compacta e pouco usual. A nota conserva essa tensão lexical sem atribuir à frase uma garantia teológica mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” corresponde ao singular hebraico e evita uma formulação excessivamente arcaica; “tirar a vida” torna explícito o valor idiomático de נֶפֶשׁ neste contexto.
