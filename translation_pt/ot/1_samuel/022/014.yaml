base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: pt
  text: 'Aimeleque respondeu ao rei: “E quem, entre todos os teus servos, é tão fiel como Davi, genro do rei, que atende às tuas ordens[a] e é honrado em tua casa[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está às tuas ordens”. A expressão hebraica sugere alguém que se volta prontamente para ouvir e obedecer.'
    reason: lexical_alternative
  - marker: b
    text: “Tua casa” pode referir-se mais especificamente à casa real, isto é, à família, ao séquito ou à corte do rei.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: Aimeleque respondeu ao rei
  rationale: A construção narrativa introduz a resposta de Aimeleque. Em português, “respondeu ao rei” expressa naturalmente tanto וַיַּעַן quanto a função introdutória de וַיֹּאמַר, sem a redundância pouco idiomática “respondeu... e disse”.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ כְּדָוִד נֶאֱמָן
  choice: E quem, entre todos os teus servos, é tão fiel como Davi
  rationale: “Entre” comunica o valor partitivo de בְכָל, e “tão fiel como” reproduz a comparação retórica marcada por כְּ. “Fiel” preserva as ideias contextuais de lealdade e confiabilidade de נֶאֱמָן.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: genro do rei
  rationale: 'Tradução direta da relação familiar indicada por חָתָן no contexto: Davi era genro de Saul.'
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: que atende às tuas ordens
  rationale: A expressão combina a ideia de voltar-se ou apresentar-se prontamente com a de ouvir, obedecer ou cumprir uma determinação. “Atende às tuas ordens” comunica essa pronta submissão em português natural, sem adotar como texto principal a interpretação mais específica de acesso ao conselho real.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: e é honrado em tua casa
  rationale: “Honrado” traduz o sentido passivo de נִכְבָּד, enquanto “em tua casa” conserva a imagem e a amplitude de בְּבֵיתֶךָ, que pode abranger a casa, a corte ou o círculo doméstico do rei.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas de segunda pessoa coerentes (“teus”, “tua”). A pergunta retórica e a sequência de qualificações de Davi foram preservadas; a pontuação evita coordenação excessivamente pesada.
