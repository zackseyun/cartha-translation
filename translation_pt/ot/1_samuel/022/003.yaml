  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: pt
  text: 'Então Davi foi dali para Mispá de Moabe e disse ao rei de Moabe: “Deixe, por favor, que meu pai e minha mãe saiam e fiquem com vocês[a], até que eu saiba o que Deus fará por mim[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saiam para junto de vocês”. O verbo hebraico significa literalmente “sair”, e o contexto indica que os pais de Davi ficariam sob os cuidados do rei de Moabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fará a mim” ou “fará comigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... מִשָּׁם
  choice: foi dali
  rationale: Expressa de modo natural a sequência narrativa e o ponto de partida indicados pelo hebraico.
- source_word: מִצְפֵּה מוֹאָב
  choice: Mispá de Moabe
  rationale: Emprega as formas portuguesas reconhecíveis dos topônimos, refletindo a vocalização hebraica Miṣpê e a relação com Moabe.
- source_word: מֶלֶךְ מוֹאָב
  choice: rei de Moabe
  rationale: Reproduz diretamente a construção hebraica que identifica o governante a quem Davi se dirige.
- source_word: יֵצֵא נָא
  choice: Deixe, por favor, que ... saiam
  rationale: Preserva tanto a força volitiva do jussivo quanto a partícula cortês נָא e mantém o sentido básico de יצא, ‘sair’.
- source_word: אָבִי וְאִמִּי
  choice: meu pai e minha mãe
  rationale: Mantém a menção explícita e enfática dos dois pais, sem reduzi-la a ‘meus pais’.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Preserva o plural do pronome hebraico, provavelmente abrangendo o rei e sua casa ou corte.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: até que eu saiba
  rationale: Conserva com clareza a relação temporal e o verbo de conhecimento do original.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: o que Deus fará por mim
  rationale: ‘Por mim’ é uma leitura contextual natural de לִי, sem ocultar em nota as possibilidades igualmente literais ‘a mim’ e ‘comigo’.
theological_decisions:
- issue: Referência de אֱלֹהִים na fala de Davi
  choice: Deus
  alternative: um deus / deuses
  rationale: Embora a forma seja morfologicamente plural, o verbo singular e o contexto narrativo indicam o Deus de Israel.
- issue: Valor da preposição לִי na expectativa de Davi
  choice: fará por mim
  alternative: fará a mim / fará comigo
  rationale: A escolha exprime naturalmente a expectativa da ação providencial de Deus, enquanto a nota preserva a abertura semântica da construção hebraica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém cortesia explícita sem arcaísmo; “vocês” preserva o plural hebraico e evita tratar o rei como único referente.
