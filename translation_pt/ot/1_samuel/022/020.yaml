base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: pt
  text: Mas um filho de Aimeleque, filho de Aitube, escapou[a]. Seu nome era Abiatar, e ele fugiu seguindo Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conseguiu fugir”.'
    reason: Alternativa lexical que explicita o valor de escape bem-sucedido do nifal de מלט.
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: escapou
  rationale: O nifal de מלט indica que ele conseguiu escapar da matança narrada anteriormente. “Escapou” expressa de modo direto tanto a sobrevivência quanto o ato de fugir do perigo.
- source_word: בֵּן אֶחָד
  choice: um dos filhos
  rationale: Embora a construção seja literalmente “um filho”, o português natural identifica aqui um integrante entre os filhos de Aimeleque; o singular mantém a informação de que apenas um deles escapou.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: de Aimeleque, filho de Aitube
  rationale: O לְ marca a relação familiar, adequadamente expressa por “de”. A identificação genealógica de Aimeleque como filho de Aitube é preservada.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: Seu nome era Abiatar
  rationale: Reproduz com clareza a oração hebraica de nomeação. A divisão em nova frase evita uma coordenação excessivamente pesada em português.
- source_word: וַיִּבְרַח
  choice: ele fugiu
  rationale: ברח significa “fugir”. A escolha preserva a distinção em relação a וַיִּמָּלֵט, anteriormente traduzido por “escapou”.
- source_word: אַחֲרֵי דָוִד
  choice: seguindo Davi
  rationale: אַחֲרֵי significa literalmente “atrás de/depois de”. “Seguindo Davi” preserva essa imagem e admite, sem impor, o sentido contextual de ir juntar-se a ele.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: אֲחִימֶלֶךְ
  choice: Aimeleque
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: אֲחִטוּב
  choice: Aitube
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: וַ
  choice: Mas
  rationale: O waw inicial liga o versículo à matança anterior e, no contexto, introduz o contraste de que um filho conseguiu escapar.
