translation_notes:
  register: Português moderno, digno e acessível, com nomes bíblicos em formas correntes no uso lusófono. A redação mantém a sequência narrativa e preserva a nuance espacial de אַחֲרֵי sem reduzir a expressão ao interpretativo “para junto de Davi”.
