  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: pt
  text: 'Então Doegue, o edomita, que estava entre os servos de Saul[a], respondeu: “Vi o filho de Jessé dirigir-se a Nobe, a Aimeleque, filho de Aitube.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estava encarregado dos servos de Saul”. A expressão hebraica pode indicar tanto a posição de Doegue entre os servos de Saul quanto uma função de supervisão sobre eles.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu
  rationale: Em diálogo narrativo, ענה introduz uma resposta. Em português, reunir a fórmula dupla hebraica em “respondeu” evita a expressão pouco natural “respondeu e disse” sem perder sua função discursiva.
- source_word: דֹּאֵג הָאֲדֹמִי
  choice: Doegue, o edomita
  rationale: O artigo hebraico marca a designação étnica em aposição ao nome. “Doegue” segue uma forma portuguesa corrente do nome.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: que estava entre os servos de Saul
  rationale: נִצָּב pode indicar estar em pé, estar presente ou estar designado; עַל pode expressar posição junto ao grupo ou autoridade sobre ele. O texto principal adota a leitura contextual de presença entre os servos, preservando a alternativa de supervisão em nota.
- source_word: עַבְדֵי שָׁאוּל
  choice: servos de Saul
  rationale: עֲבָדִים pode designar servos, assistentes ou oficiais reais. “Servos” é a correspondência mais direta e não determina em excesso sua categoria funcional.
- source_word: רָאִיתִי
  choice: Vi
  rationale: A forma perfeita relata uma observação passada; o pretérito perfeito é natural em português.
- source_word: בֶּן יִשַׁי
  choice: o filho de Jessé
  rationale: Preserva a designação relacional deliberada do hebraico, em vez de substituí-la pelo nome Davi.
- source_word: בָּא
  choice: chegar
  rationale: O particípio ligado ao verbo de percepção descreve a ação observada. Em português, “vi ... chegar” é idiomático e comunica o movimento completado até o destino.
- source_word: נֹבֶה
  choice: a Nobe
  rationale: O hê direcional indica movimento rumo a Nobe; em português, a preposição “a” expressa naturalmente esse destino.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: até Aimeleque, filho de Aitube
  rationale: אֶל aponta para a pessoa a quem o filho de Jessé se dirigiu. “Até” mantém a relação direcional e evita a sequência ambígua “a Nobe, a Aimeleque”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formas onomásticas portuguesas correntes. A ordem narrativa e a designação “filho de Jessé” foram preservadas, enquanto a fórmula verbal hebraica foi apresentada de modo natural em português.
