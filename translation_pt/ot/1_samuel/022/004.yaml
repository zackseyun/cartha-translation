base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/004.yaml
  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: pt
  text: Ele os levou à presença do rei de Moabe[a], e eles ficaram com ele durante todo o tempo em que Davi esteve na fortaleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele os conduziu até o rei de Moabe». O verbo hebraico pode ter o sentido de conduzir ou levar alguém à presença de outra pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Ele os levou
  rationale: No contexto, a forma verbal com sufixo de terceira pessoa do plural indica que Davi conduziu ou levou seus pais até o rei; «levou» é natural em português e mantém o movimento implícito.
- source_word: אֶת־פְּנֵי
  choice: à presença de
  rationale: A expressão idiomática indica comparecer diante de alguém ou ser levado à sua presença. Esta formulação combina clareza moderna com dignidade narrativa.
- source_word: מֶלֶךְ מוֹאָב
  choice: rei de Moabe
  rationale: Tradução direta da cadeia construta, usando a forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: eles ficaram com ele
  rationale: ישב pode indicar morar, permanecer ou ficar. Aqui, «ficaram» comunica uma estadia contínua sem afirmar mais do que o texto.
- source_word: כָּל יְמֵי
  choice: durante todo o tempo em que
  rationale: A expressão abrange integralmente o período indicado pela oração seguinte; esta construção é mais natural em português atual do que o literal «todos os dias em que».
- source_word: הֱיוֹת דָּוִד
  choice: Davi esteve
  rationale: O infinitivo construto de היה com sujeito próprio tem função temporal. A oração finita portuguesa expressa naturalmente esse valor.
- source_word: בַּמְּצוּדָה
  choice: na fortaleza
  rationale: מְצוּדָה designa um lugar fortificado usado como refúgio. «Fortaleza» preserva esse sentido concreto e narrativo.
