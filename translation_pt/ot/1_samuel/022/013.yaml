base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: pt
  text: 'Saul lhe disse: “Por que você e o filho de Jessé conspiraram contra mim, dando-lhe pão e uma espada e consultando Deus em favor dele, para que ele se levantasse contra mim e ficasse à espreita, como hoje se vê?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: conspiraram
  rationale: Neste contexto, קשר designa uma conspiração contra o rei; “conspiraram” preserva o sentido político e hostil.
- source_word: בֶן־יִשָׁי
  choice: o filho de Jessé
  rationale: Mantém o patronímico usado por Saul, com sua distância retórica, em vez de substituí-lo pelo nome “Davi”.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: dando-lhe pão e uma espada
  rationale: O infinitivo com בְּ apresenta o ato como meio ou circunstância da suposta conspiração.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: e consultando Deus em favor dele
  rationale: No contexto sacerdotal e oracular, שׁאל בֵּאלֹהִים indica buscar orientação divina; “consultando Deus” é claro e natural em português.
- source_word: בֵּאלֹהִים
  choice: Deus
  rationale: O texto hebraico traz אֱלֹהִים, não o nome divino YHWH.
- source_word: לָקוּם אֵלַי
  choice: para que ele se levantasse contra mim
  rationale: Preserva a possível nuance de propósito ou resultado do infinitivo, apresentada como acusação de Saul.
- source_word: לְאֹרֵב
  choice: e ficasse de emboscada
  rationale: Expressa naturalmente em português a ação de espreitar ou aguardar ocultamente para atacar.
- source_word: כַּיּוֹם הַזֶּה
  choice: como acontece hoje
  rationale: Comunica o sentido idiomático de que a situação alegada por Saul estaria manifesta no presente.
theological_decisions:
- issue: Referência à divindade em בֵּאלֹהִים
  choice: Deus
  alternative: o SENHOR
  rationale: A tradução segue a forma lexical efetivamente presente, אֱלֹהִים, sem harmonizá-la com o nome divino YHWH.
- issue: Valor de לָקוּם אֵלַי לְאֹרֵב
  choice: para que ele se levantasse contra mim e ficasse de emboscada
  alternative: de modo que ele se levantou contra mim para ficar de emboscada
  rationale: A construção pode indicar propósito ou resultado. A formulação escolhida preserva a acusação de Saul sem declarar como fato objetivo que Davi tenha conspirado contra ele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” porque Saul se dirige diretamente a Aimeleque, enquanto o plural de “conspiraram” inclui Aimeleque e o filho de Jessé. Evita literalismos pouco naturais como “como neste dia”.
