- from: 'Saul lhe disse: “Por que você e o filho de Jessé conspiraram contra mim, dando-lhe pão e uma espada e consultando Deus em favor dele, para que ele se levantasse contra mim e ficasse de emboscada, como acontece hoje?”'
  to: 'Saul lhe disse: “Por que você e o filho de Jessé conspiraram contra mim, dando-lhe pão e uma espada e consultando Deus em favor dele, para que ele se levantasse contra mim e ficasse à espreita, como hoje se vê?”'
  rationale: 'A revisão é limitada a duas expressões: substitui uma paráfrase temporal que deslocava o sentido de כַּיּוֹם הַזֶּה e emprega uma formulação portuguesa mais natural para לְאֹרֵב. Mantém-se o modo subjuntivo em “para que ... se levantasse”, que apresenta a fala como acusação de Saul e não como endosso narratorial da alegação.'
