base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: pt
  text: E todos os que estavam em aflição, todos os que tinham um credor[a] e todos os de alma amargurada[b] se reuniram a ele. Ele se tornou comandante deles, e cerca de quatrocentos homens estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “estavam endividados”. O hebraico diz literalmente “tinham um credor” ou alguém que lhes exigia pagamento.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “de alma amargurada” indica profunda amargura interior ou angústia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: se reuniram a ele
  rationale: O hitpael de קבץ descreve pessoas que se ajuntam, e אֵלָיו indica movimento em direção a Davi. A formulação conserva tanto o valor coletivo/reflexivo quanto a direção expressa no hebraico.
- source_word: כָּל אִישׁ מָצוֹק
  choice: todos os que estavam em aflição
  rationale: מָצוֹק denota aperto, angústia ou circunstâncias difíceis. “Em aflição” mantém a amplitude do termo sem o limitar à pobreza ou ao endividamento.
- source_word: כָל אִישׁ אֲשֶׁר לוֹ נֹשֶׁא
  choice: todos os que tinham um credor
  rationale: A expressão hebraica é elíptica e literalmente apresenta alguém que “tinha um credor/exator”. Esta tradução preserva essa forma mais concreta, enquanto a nota registra a interpretação idiomática “estavam endividados”.
- source_word: כָל אִישׁ מַר נֶפֶשׁ
  choice: todos os de alma amargurada
  rationale: A expressão mantém a imagem antropológica hebraica de amargura na נֶפֶשׁ, mas com uma ordem de palavras natural e digna em português.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: Ele se tornou comandante deles
  rationale: שַׂר pode indicar chefe, líder ou comandante. No contexto do grupo armado de Davi, “comandante” comunica adequadamente sua função, sem recorrer ao mais antiquado “capitão”.
- source_word: וַיִּהְיוּ עִמּוֹ
  choice: ficaram com ele
  rationale: A construção expressa a presença e associação contínua do grupo com Davi. “Ficaram com ele” é natural no contexto narrativo e evita a rigidez de uma tradução puramente copulativa.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: cerca de quatrocentos homens
  rationale: O prefixo כְּ marca aproximação, e אִישׁ aqui conta os homens adultos que compunham o grupo de Davi.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “todos os” reproduz a estrutura enfática do hebraico. As imagens concretas “tinham um credor” e “de alma amargurada” foram preservadas, com notas para esclarecer seu sentido.
