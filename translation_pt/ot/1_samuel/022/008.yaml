base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: pt
  text: Pois todos vocês conspiraram contra mim, e ninguém me informa[a] quando meu filho faz uma aliança com o filho de Jessé[c]. Nenhum de vocês se preocupa comigo nem me informa de que meu filho suscitou o meu servo contra mim, para me emboscar[b], como acontece hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “descobre o meu ouvido”, expressão idiomática que significa “me informa” ou “me revela”.
    reason: lexical_alternative
  - marker: c
    text: “O filho de Jessé” é Davi; Saul usa o patronímico em vez do nome de Davi.
    reason: cultural_note
  - marker: b
    text: 'Ou: “para ficar de emboscada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: conspiraram
  rationale: O verbo, neste contexto, expressa uma conspiração hostil ou traiçoeira contra Saul, não uma associação neutra.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: me informa
  rationale: A expressão idiomática hebraica significa revelar uma informação a alguém; “me informa” é natural em português e comunica claramente o sentido.
- source_word: בִּכְרָת
  choice: quando ... faz
  rationale: A preposição com o infinitivo marca a circunstância temporal, enquanto “faz uma aliança” traduz naturalmente o idioma hebraico de cortar uma aliança.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: meu filho faz uma aliança com o filho de Jessé
  rationale: Preserva tanto a referência de Saul a Jônatas como “meu filho” quanto sua maneira distanciada de chamar Davi de “filho de Jessé”.
- source_word: חֹלֶה ... עָלַי
  choice: se compadece de mim
  rationale: Aqui o particípio indica pesar, solidariedade ou preocupação em favor de Saul, e não doença literal.
- source_word: הֵקִים
  choice: levantou contra mim
  rationale: “Levantou” preserva a amplitude do hebraico, que pode indicar pôr, suscitar ou instigar alguém contra outra pessoa, sem decidir além do texto como isso ocorreu.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Saul apresenta Davi como seu subordinado real; “servo” preserva essa relação sem sugerir necessariamente escravidão.
- source_word: לְאֹרֵב
  choice: para ficar de emboscada
  rationale: A forma expressa a finalidade ou função de espreitar para atacar; esta tradução é idiomática e mantém a imagem da emboscada.
- source_word: כַּיּוֹם הַזֶּה
  choice: como acontece hoje
  rationale: A expressão aponta para a situação vigente no momento da fala, e esta formulação é clara em português moderno.
