revisions:
- from: Pois todos vocês conspiraram contra mim, e ninguém me informa[a] quando meu filho faz uma aliança com o filho de Jessé[c]. Nenhum de vocês se compadece de mim nem me informa de que meu filho levantou contra mim o meu servo, para ficar de emboscada[b], como acontece hoje.
  to: Pois todos vocês conspiraram contra mim, e ninguém me informa[a] quando meu filho faz uma aliança com o filho de Jessé[c]. Nenhum de vocês se preocupa comigo nem me informa de que meu filho suscitou o meu servo contra mim, para me emboscar[b], como acontece hoje.
  rationale: A revisão melhora a clareza sintática e a naturalidade do português no trecho sobre a suposta ação de Jônatas contra Saul, sem alterar o caráter acusatório da fala nem resolver além do necessário a amplitude de הֵקִים. Também ajusta a expressão de preocupação e ordena as notas conforme os seus marcadores aparecem no texto.
