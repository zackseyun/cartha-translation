base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: pt
  text: 'Então Saul disse aos seus servos que estavam ao redor dele: “Escutem, por favor, filhos de Benjamim! Será que o filho de Jessé também dará campos e vinhedos a todos vocês? Será que fará de todos vocês comandantes de milhares e comandantes de centenas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Preserva o sentido amplo de pessoas a serviço do rei; no contexto, trata-se de seus oficiais ou cortesãos, mas o termo hebraico é mais abrangente.
- source_word: הַנִּצָּבִים עָלָיו
  choice: que estavam ao redor dele
  rationale: Expressa naturalmente a posição dos servos presentes junto a Saul, sem excluir a possível nuance de estarem a seu serviço.
- source_word: שִׁמְעוּ נָא
  choice: Escutem, por favor
  rationale: Mantém tanto o imperativo quanto a partícula נָא, aqui usada para dar ênfase ou tom de apelo à fala.
- source_word: בְּנֵי יְמִינִי
  choice: filhos de Benjamim
  rationale: Reproduz a designação tribal literalmente e conserva a ênfase de Saul na solidariedade benjamita.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: comandantes de milhares e comandantes de centenas
  rationale: Conserva as categorias militares e administrativas do texto hebraico sem redefinir o tamanho efetivo das unidades.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com perguntas retóricas preservadas. A repetição de “todos vocês” e “comandantes” reflete a insistência do hebraico e a estratégia de Saul de apelar ao interesse tribal de seus ouvintes.
