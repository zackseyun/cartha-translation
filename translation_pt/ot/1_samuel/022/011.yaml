base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: pt
  text: Então o rei mandou chamar Aimeleque, filho de Aitube, o sacerdote, e toda a família de seu pai[a], os sacerdotes que estavam em Nobe; e todos eles vieram ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “família de seu pai” refere-se à família paterna extensa ou ao clã, não apenas aos parentes mais próximos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: mandou chamar
  rationale: A combinação de שׁלח com o infinitivo de קרא expressa o ato de enviar uma ordem para que alguém compareça; “mandou chamar” é natural em português e preserva o caráter oficial da convocação real.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  choice: Aimeleque, filho de Aitube
  rationale: Os nomes seguem formas portuguesas reconhecíveis, e “filho de” traduz diretamente a relação filial.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: O substantivo em aposição identifica o ofício de Aimeleque de modo direto.
- source_word: כָּל בֵּית אָבִיו
  choice: toda a família de seu pai
  rationale: A expressão hebraica designa a casa paterna em sentido coletivo, incluindo a família extensa ou clã. “Família de seu pai” evita que “casa” seja entendida apenas como edifício, enquanto a nota preserva a amplitude cultural do termo.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: os sacerdotes que estavam em Nobe
  rationale: A frase identifica os membros da família paterna como o grupo sacerdotal localizado em Nobe.
- source_word: וַיָּבֹאוּ כֻלָּם
  choice: e todos eles vieram
  rationale: A formulação natural conserva a ênfase de כֻּלָּם na totalidade dos convocados.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: Traduz diretamente o movimento em direção ao rei, sem acrescentar a ideia não explícita de comparecer “diante” dele.
theological_decisions: []
