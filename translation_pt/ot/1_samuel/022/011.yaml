  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção “mandou chamar” comunica uma convocação oficial sem rigidez excessiva; o ponto e vírgula preserva a progressão da frase hebraica.
