base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: pt
  text: 'Davi disse a Abiatar: “Naquele dia, quando Doegue, o edomita, estava lá,[a] eu sabia que ele certamente contaria a Saul.[b] Eu sou responsável por todas as vidas da família de seu pai.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Naquele dia, eu sabia que Doegue, o edomita, estava lá”. A conjunção hebraica pode introduzir o conteúdo do que Davi sabia, em vez de ter sentido temporal.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega um infinitivo absoluto junto ao verbo finito, literalmente algo como “contando, contaria”, uma construção enfática com o sentido de “certamente contaria”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Eu causei a morte de todos os membros da família de seu pai” ou “Eu sou a causa da morte de todos os membros da família de seu pai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: eu sabia
  rationale: O perfeito de ידע expressa o conhecimento prévio de Davi; “eu sabia” é direto e natural em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Preserva a referência definida a um dia específico no passado.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: quando Doegue, o edomita, estava lá
  rationale: A oração é entendida em sentido temporal-circunstancial, sem ocultar em nota a possibilidade de כִּי introduzir o conteúdo do que Davi sabia.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: que ele certamente contaria tudo a Saul
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “Certamente contaria” reproduz a ênfase; “tudo” explicita idiomaticamente em português o conteúdo implícito no contexto, sem especificá-lo.
- source_word: אָנֹכִי
  choice: eu
  rationale: O pronome independente é enfático; a presença explícita de “eu” antes de “sou responsável” transmite essa ênfase em português.
- source_word: סַבֹּתִי
  choice: sou responsável por
  rationale: Expressa de modo natural a admissão de culpa causal por Davi, preservando em nota as formulações mais diretamente causativas.
- source_word: בְּכָל נֶפֶשׁ
  choice: por todas as vidas
  rationale: נֶפֶשׁ designa aqui as vidas ou pessoas mortas; “vidas” conserva a gravidade da perda e evita uma leitura indevidamente espiritualizada de “almas”.
- source_word: בֵּית אָבִיךָ
  choice: da família de seu pai
  rationale: O hebraísmo “casa de seu pai” refere-se ao grupo familiar ou doméstico; “família de seu pai” é claro e natural para leitores modernos.
theological_decisions:
- issue: Extensão e natureza da responsabilidade confessada por Davi
  choice: “Eu sou responsável por todas as vidas”
  alternative: “Eu causei a morte de todos” / “Eu sou a causa da morte de todos”
  rationale: A formulação principal comunica a confissão de culpa sem determinar além do hebraico se Davi reivindica causalidade direta ou responsabilidade indireta; a alternativa mais forte é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Doegue” segue uma forma portuguesa corrente do nome. A expressão hebraica “casa de seu pai” foi vertida idiomaticamente como “família de seu pai”; a ambiguidade sintática e a força causativa de סַבֹּתִי foram preservadas em notas.
