base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: pt
  text: 'Mas o rei disse: “Você certamente morrerá, Aimeleque[a], você e toda a casa de seu pai[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você morrerá sem falta” ou “você tem de morrer”. O hebraico combina um infinitivo absoluto com um verbo finito para dar forte ênfase.'
    reason: lexical_alternative
  - marker: b
    text: “A casa de seu pai” refere-se à família paterna, à casa familiar ou à linhagem de Aimeleque.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” é a tradução natural no relato histórico.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido identifica diretamente quem fala.
- source_word: מוֹת תָּמוּת
  choice: você certamente morrerá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente morrerá” preserva a ênfase solene e admite tanto o tom de sentença quanto o de certeza.
- source_word: אֲחִימֶלֶךְ
  choice: Aimeleque
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: אַתָּה
  choice: você
  rationale: O pronome explícito é mantido após o nome para reproduzir a ênfase do hebraico.
- source_word: וְכָל
  choice: e toda
  rationale: A conjunção e כָּל estendem a sentença à totalidade do grupo mencionado.
- source_word: בֵּית אָבִיךָ
  choice: a casa de seu pai
  rationale: Preserva o idioma hebraico, explicado em nota como referência à família ou linhagem paterna.
theological_decisions:
- issue: Força modal de מוֹת תָּמוּת
  choice: você certamente morrerá
  alternative: você tem de morrer / você morrerá sem falta
  rationale: A construção hebraica marca forte ênfase, mas por si só não exige escolher exclusivamente entre previsão certa e sentença judicial; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para refletir o pronome hebraico explícito e mantém “casa de seu pai” para conservar a imagem cultural do original, esclarecida em nota.
