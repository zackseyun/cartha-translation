  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: pt
  text: Abiatar contou a Davi que Saul havia matado os sacerdotes de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O hifil de נגד significa aqui dar a conhecer ou contar. “Contou” é natural em português e se encaixa bem na construção com o destinatário introduzido por לְ.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Forma convencional do nome pessoal em português.
- source_word: לְדָוִד
  choice: a Davi
  rationale: O prefixo לְ marca o destinatário da informação; em português, a regência natural é “contou a Davi”.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da notícia comunicada por Abiatar.
- source_word: הָרַג
  choice: havia matado
  rationale: O perfeito relata uma ação anterior ao ato de Abiatar contar; o mais-que-perfeito composto explicita naturalmente essa anterioridade em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma convencional do nome pessoal em português.
- source_word: כֹּהֲנֵי יְהוָה
  choice: os sacerdotes de Yahweh
  rationale: A cadeia construta é vertida de modo direto, preservando a relação entre os sacerdotes e Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A frase mantém a sequência temporal do relato sem acrescentar interpretação.
