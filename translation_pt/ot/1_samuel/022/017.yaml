  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: pt
  text: 'Então o rei disse aos corredores que estavam de pé ao seu redor[a]: “Voltem-se e matem os sacerdotes de Yahweh, pois a mão deles também está com Davi[b], e porque sabiam que ele estava fugindo e não me informaram[c].” Mas os servos do rei não quiseram estender a mão para atacar os sacerdotes de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “corredores” eram servidores da corte real, que podiam atuar como mensageiros ou guardas.
    reason: contextual_clarification
  - marker: b
    text: A expressão hebraica “a mão deles também está com Davi” significa que eles apoiam Davi ou estão do lado dele.
    reason: idiom_explanation
  - marker: c
    text: 'Hebraico: “não descobriram o ouvido”, expressão que significa “não informaram”.'
    reason: idiom_explanation
lexical_decisions:
- source_word: לָרָצִים
  choice: aos corredores
  rationale: O particípio de רוץ significa literalmente “corredores”. No contexto da corte, designa servidores reais que também podiam atuar como mensageiros ou guardas. Mantém-se o termo concreto do hebraico, com nota explicativa.
- source_word: הַנִּצָּבִים עָלָיו
  choice: que estavam de pé ao seu redor
  rationale: A construção נצב com על pode indicar pessoas postadas junto de alguém ou a seu serviço. A formulação comunica tanto a posição física quanto o contexto de corte.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: Voltem-se e matem
  rationale: Os imperativos ordenam que os servidores se voltem contra os sacerdotes e os matem. “Matem” preserva a violência direta da ordem sem acrescentar a nuance jurídica de “executem”.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: pois a mão deles também está com Davi
  rationale: A tradução conserva a imagem hebraica da mão, que neste contexto expressa apoio, aliança ou cumplicidade, sem decidir além do que a acusação de Saul afirma.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: Eles sabiam que ele estava fugindo
  rationale: O particípio בֹרֵחַ apresenta Davi em fuga; “estava fugindo” preserva esse aspecto sem convertê-lo simplesmente em ação concluída.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: e não me informaram
  rationale: A expressão idiomática hebraica fala em “descobrir o ouvido” e significa revelar ou informar. O português corrente explicita o sentido, enquanto a nota preserva a imagem original.
- source_word: וְלֹא אָבוּ
  choice: não quiseram
  rationale: O verbo אבה expressa disposição ou consentimento; na negativa, indica que os servos se recusaram a cumprir a ordem.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: estender a mão para atacar
  rationale: A formulação mantém a imagem hebraica de estender a mão e traduz פגע conforme seu sentido hostil neste contexto. “Atacar” é natural e não sugere que os servos tenham chegado a ferir os sacerdotes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” representa o nome da aliança sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha a progressão do hebraico, mas evita construções artificiais. As imagens de “mão” foram preservadas onde continuam compreensíveis; os idiomas menos transparentes foram explicados em notas.
