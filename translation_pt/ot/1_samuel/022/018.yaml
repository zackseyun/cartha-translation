  terminology: «Doegue», «edomita», «sacerdotes» e «linho» são adequados. «Éfode» é o equivalente técnico estabelecido e deve permanecer no texto; uma nota pode explicar o termo sem redefini-lo. A nota lexical deve acompanhar «ataque», que traduz o verbo hebraico de sentido mais amplo.
