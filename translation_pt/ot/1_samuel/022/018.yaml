base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: pt
  text: 'Então o rei disse a Doegue: “Vire-se e ataque os sacerdotes.”[a] Doegue, o edomita, virou-se e atacou os sacerdotes; naquele dia, matou oitenta e cinco homens que vestiam éfode de linho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “invista contra os sacerdotes” ou “caia sobre os sacerdotes”. O verbo hebraico pode indicar um ataque violento de modo mais amplo; “ataque” preserva a ação antes da afirmação de que Doegue matou oitenta e cinco homens.'
    reason: alternativa lexical para פגע
lexical_decisions:
- source_word: סֹב
  choice: Vire-se / virou-se
  rationale: O imperativo e sua retomada narrativa indicam voltar-se para executar a ordem; a formulação mantém a brusquidão do comando e a repetição hebraica.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: ataque / atacou
  rationale: פגע pode indicar encontrar, investir contra ou atacar. “Atacar” preserva a ação violenta sem antecipar o resultado expresso depois por וַיָּמֶת.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do substantivo definido no plural.
- source_word: הָאֲדֹמִי
  choice: o edomita
  rationale: Traduz o gentílico que identifica a origem de Doegue.
- source_word: וַיָּמֶת
  choice: matou
  rationale: A forma causativa de מות expressa que Doegue causou a morte dos sacerdotes; “matou” é direto, natural e distingue o resultado do ataque anteriormente narrado.
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: oitenta e cinco homens
  rationale: איש após o numeral refere-se aqui aos sacerdotes do sexo masculino; “homens” preserva essa especificidade.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: que vestiam um colete sacerdotal de linho
  rationale: נשא pode indicar portar ou vestir; no contexto de uma peça sacerdotal, “vestiam” é natural. “Colete sacerdotal” torna a função do éfode compreensível, enquanto a nota preserva o termo técnico.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei disse
  rationale: A construção narrativa faz a sequência avançar; “Então” comunica esse encadeamento em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “Vire-se... virou-se” conserva a estrutura deliberada do hebraico. “Ataque” mantém a amplitude semântica de פגע e evita confundi-lo com o verbo posterior que resume as mortes.
