lexical_decisions:
- source_word: שְׁמַע־נָא
  choice: Escute, por favor
  rationale: שְׁמַע é um imperativo singular, e נָא acrescenta uma partícula de apelo ou cortesia; a tradução preserva ambos de modo natural em português.
- source_word: בֶּן אֲחִיטוּב
  choice: filho de Aitube
  rationale: Reproduz diretamente a identificação patronímica do hebraico, usando a forma portuguesa corrente do nome.
- source_word: הִנְנִי
  choice: Aqui estou
  rationale: Fórmula hebraica de prontidão e resposta à convocação; esta expressão portuguesa preserva seu valor idiomático.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Forma de tratamento respeitosa dirigida a Saul; a inicial minúscula evita confusão com um título divino.
