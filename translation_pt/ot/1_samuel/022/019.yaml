  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: pt
  text: Também feriu Nobe, a cidade dos sacerdotes, ao fio da espada[a], desde o homem até a mulher, desde a criança até o bebê de peito, e também bois, jumentos e ovelhas, ao fio da espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “à boca da espada”, expressão idiomática que significa matar pela espada.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: Nobe
  rationale: Nome próprio de lugar, transliterado segundo a forma tradicional e natural em português.
- source_word: עִיר הַכֹּהֲנִים
  choice: a cidade dos sacerdotes
  rationale: Reproduz com clareza a construção que identifica Nobe como cidade associada aos sacerdotes.
- source_word: הִכָּה
  choice: feriu
  rationale: Mantém o sentido amplo de נכה; a expressão seguinte, “ao fio da espada”, deixa claro que se trata de ação letal.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: ao fio da espada
  rationale: Equivalente idiomático corrente que comunica morte pela espada e preserva a imagem concreta do hebraico; a repetição foi mantida.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: desde o homem até a mulher
  rationale: Conserva os substantivos singulares e a fórmula hebraica de totalidade, sem neutralizar os termos sexuados.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: desde a criança até o bebê de peito
  rationale: עוֹלֵל designa uma criança pequena, enquanto יוֹנֵק especifica um bebê que ainda mama; a formulação preserva a progressão e é compreensível em português corrente.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: e também bois, jumentos e ovelhas
  rationale: Apresenta naturalmente em português as classes de animais domésticos enumeradas; “ovelhas” funciona como equivalente contextual de שֶׂה, termo que pode abranger animal miúdo do rebanho.
theological_decisions:
- issue: Termos humanos sexuados numa expressão de totalidade
  choice: desde o homem até a mulher
  alternative: homens e mulheres
  rationale: A tradução mantém a forma singular e a estrutura do hebraico. A expressão indica a abrangência indiscriminada da matança, não uma afirmação doutrinária sobre gênero.
- issue: Retenção formal da fórmula de massacre
  choice: manter as duas ocorrências de “ao fio da espada” e as fórmulas “desde... até...”
  alternative: condensar como “matou todos à espada”
  rationale: A repetição e a sequência das vítimas intensificam retoricamente a devastação total; preservá-las transmite a gravidade do texto sem ampliar sua interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nobe” segue a forma portuguesa tradicional; “bebê de peito” explicita de modo natural a idade indicada por יוֹנֵק. A ordem e a repetição do hebraico foram preservadas sempre que não comprometiam a clareza.
