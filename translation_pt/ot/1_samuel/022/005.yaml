base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: pt
  text: 'Então o profeta Gade disse a Davi: “Não fique na fortaleza. Vá e entre na terra de Judá[a].” Assim, Davi foi e entrou na floresta de Herete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vá para a terra de Judá”. O verbo hebraico pode significar “entrar” ou, conforme o contexto, indicar de modo mais geral o movimento para um destino.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: נָבִיא é o termo hebraico usual para profeta; não corresponde ao termo específico traduzido por “vidente”.
- source_word: לֹא תֵשֵׁב
  choice: Não fique
  rationale: Neste contexto, יָשַׁב indica permanecer em determinado local; “não fique” comunica a ordem de modo natural e direto.
- source_word: בַּמְּצוּדָה
  choice: na fortaleza
  rationale: מְצוּדָה designa um lugar fortificado ou de difícil acesso usado como refúgio; “fortaleza” preserva esse sentido.
- source_word: לֵךְ וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: Vá e entre na terra de Judá
  rationale: לֵךְ é o imperativo “vá”, enquanto בוא pode indicar entrar ou chegar. “Entre” explicita o movimento para dentro do território. O לְךָ tem valor idiomático de direção ou ênfase pessoal e não exige um pronome reflexivo em português.
- source_word: אֶרֶץ יְהוּדָה
  choice: a terra de Judá
  rationale: A expressão preserva o sentido territorial de אֶרֶץ seguido do nome tribal.
- source_word: יַעַר חָרֶת
  choice: a floresta de Herete
  rationale: יַעַר significa floresta ou região arborizada; Herete é mantido como nome próprio do lugar.
- source_word: וַיָּבֹא
  choice: entrou
  rationale: O verbo בוא pode significar vir, chegar ou entrar. Diante de uma floresta como destino, “entrou” expressa naturalmente o movimento para dentro do lugar.
