base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: pt
  text: Foi hoje a primeira vez que consultei Deus em favor dele?[a] Longe de mim! Que o rei não faça acusação alguma contra o seu servo nem contra toda a casa de meu pai, pois o seu servo nada sabia de tudo isso, nem coisa pequena nem grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Comecei hoje a consultar Deus em favor dele?” A pergunta retórica em hebraico dá a entender que esta não foi a primeira vez que Aimeleque fez isso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: Foi hoje a primeira vez que
  rationale: Expressa em português natural a pergunta retórica idiomática, sem perder a referência temporal nem a ideia de que aquela não era a primeira consulta.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: consultei Deus em favor dele
  rationale: O verbo neste contexto indica buscar orientação ou resposta divina; “em favor dele” preserva o beneficiário indicado por לוֹ.
- source_word: חָלִילָה לִּי
  choice: Longe de mim!
  rationale: Fórmula enfática de repúdio, natural e digna em português.
- source_word: אַל יָשֵׂם ... בְּעַבְדּוֹ דָבָר
  choice: Que o rei não atribua culpa alguma ao seu servo
  rationale: Comunica o sentido contextual de lançar sobre alguém uma matéria acusatória. “Culpa” torna clara a força forense sem especificar uma acusação além do contexto.
- source_word: בְּכָל בֵּית אָבִי
  choice: nem a toda a casa de meu pai
  rationale: Mantém a expressão hebraica para a família ou clã inteiro e coordena naturalmente os dois alvos da acusação.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: o seu servo nada sabia de tudo isso
  rationale: Preserva a autodesignação deferente e a negação completa de conhecimento sobre o caso.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: nem coisa pequena nem grande
  rationale: Conserva o merismo hebraico, que abrange qualquer detalhe, sem reduzir a expressão a uma paráfrase.
