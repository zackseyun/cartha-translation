base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: pt
  text: Então Davi partiu dali e escapou para a caverna de Adulão.[a] Quando seus irmãos e toda a família de seu pai souberam disso, desceram até ele ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fugiu para a caverna de Adulão”. O verbo hebraico pode indicar tanto fuga como escape; “escapou” destaca que Davi conseguiu livrar-se do perigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: partiu dali
  rationale: Expressa de modo natural a saída de Davi do lugar anterior e preserva a sequência narrativa.
- source_word: וַיִּמָּלֵט
  choice: escapou
  rationale: O nifal de מלט destaca que Davi conseguiu livrar-se do perigo; “escapou” preserva melhor esse aspecto resultativo do que uma simples indicação de movimento.
- source_word: מְעָרַת עֲדֻלָּם
  choice: a caverna de Adulão
  rationale: Mantém a relação de construção entre “caverna” e o topônimo, usando a forma portuguesa tradicional do nome.
- source_word: וַיִּשְׁמְעוּ
  choice: souberam disso
  rationale: Embora o verbo signifique literalmente “ouviram”, aqui o objeto está implícito e o sentido contextual é receber a notícia do paradeiro de Davi; esta formulação é clara e idiomática em português.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: Preserva o plural masculino do hebraico e sua referência aos irmãos de Davi.
- source_word: כָל־בֵּית אָבִיו
  choice: toda a família de seu pai
  rationale: A expressão idiomática hebraica denota a unidade familiar ou doméstica, não apenas uma residência física.
- source_word: וַיֵּרְדוּ אֵלָיו שָׁמָּה
  choice: desceram até lá para junto dele
  rationale: Conserva a nuance topográfica de ירד e comunica tanto o destino quanto o movimento em direção a Davi.
