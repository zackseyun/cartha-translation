  to: Saul soube que Davi e os homens que estavam com ele haviam se tornado conhecidos[a]. Saul estava sentado em Gibeá, debaixo da tamargueira, no alto[b], com a lança na mão, e todos os seus servos estavam de pé ao redor dele.
  rationale: A revisão elimina a ambiguidade sintática que fazia «no alto» qualificar somente a árvore e adota para נוֹדַע a formulação portuguesa mais próxima do sentido básico hebraico. As alternativas de descoberta e de leitura toponímica permanecem assinaladas em notas.
