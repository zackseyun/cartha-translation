  source_fidelity: A estrutura narrativa e os elementos principais são bem preservados. Contudo, «que ficava no alto» faz com que a expressão locativa hebraica parecer qualificar somente a tamargueira, enquanto o hebraico situa a cena de Saul sob a árvore, no lugar elevado. A revisão mantém essa relação espacial sem a restringir indevidamente.
  naturalness: O texto é claro e moderno. «Soube que» é uma forma narrativa portuguesa mais direta para a receção de uma notícia; «no alto» após «tamargueira» evita a relativa algo pesada e ambígua.
  terminology: «Gibeá», «tamargueira», «lança» e «servos» são adequados. «Tornaram-se conhecidos» reproduz o valor básico de נוֹדַע; a nota preserva a possibilidade contextual de «foram descobertos».
  issues:
