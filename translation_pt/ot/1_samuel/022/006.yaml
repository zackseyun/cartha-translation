base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: pt
  text: Saul soube que Davi e os homens que estavam com ele haviam se tornado conhecidos[a]. Saul estava sentado em Gibeá, debaixo da tamargueira, no alto[b], com a lança na mão, e todos os seus servos estavam de pé ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haviam sido descobertos” ou “haviam sido encontrados”. O verbo hebraico pode indicar que o paradeiro de Davi e de seus homens se tornou conhecido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, possivelmente: “em Ramá”, se בָּרָמָה for entendido como o nome do lugar Ramá, e não como “no alto”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu dizer
  rationale: Expressa naturalmente, em narrativa portuguesa, o recebimento de uma notícia, preservando o sentido básico de שׁמע.
- source_word: כִּי נוֹדַע דָּוִד
  choice: que Davi ... haviam sido descobertos
  rationale: O nifal de ידע pode significar tornar-se conhecido ou ser descoberto. A concordância com Davi e seus homens explicita que o grupo já não permanecia oculto, sem especificar além do texto se foram revelados apenas o paradeiro ou a presença deles.
- source_word: וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: e os homens que estavam com ele
  rationale: Tradução direta e natural da comitiva masculina de Davi.
- source_word: יוֹשֵׁב
  choice: estava sentado
  rationale: O particípio cria uma cena de fundo durativa; o imperfeito perifrástico é natural em português.
- source_word: בַּגִּבְעָה
  choice: em Gibeá
  rationale: Trata גבעה como o topônimo Gibeá e usa a preposição portuguesa idiomática para localização numa cidade ou povoado.
- source_word: תַּחַת הָאֶשֶׁל
  choice: debaixo da tamargueira
  rationale: אשל é geralmente identificado como tamargueira; o nome corrente da árvore é mais claro do que uma transliteração.
- source_word: בָּרָמָה
  choice: que ficava no alto
  rationale: Toma רמה como substantivo comum, 'altura/lugar elevado', leitura favorecida pelo artigo e pelo contexto, e liga a expressão à localização da árvore de modo natural.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: com a lança na mão
  rationale: Reproduz de modo idiomático a oração nominal hebraica e preserva a imagem marcial de Saul.
- source_word: וְכָל עֲבָדָיו
  choice: e todos os seus servos
  rationale: Servos mantém a amplitude de עבד no ambiente régio, onde pode incluir auxiliares, cortesãos ou oficiais.
- source_word: נִצָּבִים עָלָיו
  choice: estavam de pé ao redor dele
  rationale: Comunica a disposição dos servos na presença de Saul, evitando o sentido português potencialmente enganoso de estarem literalmente sobre ele.
