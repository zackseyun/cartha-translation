base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: pt
  text: E ele consultou Yahweh em favor dele[a], deu-lhe provisões e lhe deu a espada de Golias, o filisteu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscou a orientação de Yahweh para ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: consultou Yahweh em favor dele
  rationale: A construção שׁאל com ב e o nome divino expressa consulta ou busca de orientação junto à divindade; לּוֹ indica que a consulta foi feita em benefício de Davi. “Em favor dele” explicita esse valor sem identificar novamente o referente.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino יהוה, de acordo com a decisão teológica fornecida, em vez de substituí-lo por um título.
- source_word: צֵידָה
  choice: provisões
  rationale: O termo denota mantimentos ou suprimentos, especialmente para viagem; “provisões” preserva essa amplitude.
- source_word: נָתַן לוֹ
  choice: deu-lhe / lhe deu
  rationale: Traduz diretamente נתן com o objeto indireto pronominal. A repetição do verbo é mantida, com pequena variação de ordem pronominal para naturalidade em português.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: e a espada de Golias, o filisteu
  rationale: Preserva a cadeia de posse e apresenta הַפְּלִשְׁתִּי como aposto identificador de Golias, de modo claro em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” preserva essa distinção e segue a decisão teológica atual indicada nos dados fornecidos.
- issue: Natureza da ação de Aimeleque diante de Yahweh
  choice: consultou Yahweh em favor dele
  alternative: buscou uma resposta de Yahweh para ele
  rationale: A formulação preserva o caráter cultual da consulta sem especificar o meio empregado nem o conteúdo da resposta, aspectos que o versículo não declara.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva a repetição acusatória de “deu” e mantém o pronome “dele” sem resolver silenciosamente seu referente contextual.
