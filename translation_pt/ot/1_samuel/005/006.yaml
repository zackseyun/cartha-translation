  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: pt
  text: 'A mão de Yahweh pesou sobre os habitantes de Asdode: ele os devastou e os atingiu com tumores[a], tanto em Asdode como em seu território.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inchações”; tradicionalmente, alguns traduzem de modo mais específico por “hemorroidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: A mão de Yahweh pesou
  rationale: Preserva a imagem concreta do hebraico e expressa naturalmente a ação opressiva e julgadora de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: sobre os habitantes de Asdode
  rationale: O gentílico hebraico se refere aos moradores de Asdode; neste idioma, a mão divina pesa 'sobre' eles.
- source_word: וַיְשִׁמֵּם
  choice: ele os devastou
  rationale: Comunica a forte ideia de arruinar e assolar presente no verbo.
- source_word: וַיַּךְ אֹתָם
  choice: os atingiu
  rationale: Verbo corrente que transmite o golpe ou flagelo divino sem tom arcaico.
- source_word: בָּעֳפָלִים
  choice: com tumores
  rationale: Representa de modo amplo as inchações corporais indicadas pelo termo, sem adotar no texto principal uma identificação anatômica incerta.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: tanto em Asdode como em seu território
  rationale: Explicita naturalmente que o flagelo alcançou a cidade e a região sob seu domínio, preservando o alcance geográfico da frase final.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: Mantém o nome pessoal do Deus de Israel mediante transliteração amplamente reconhecível, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção conserva a metáfora hebraica da mão que pesa, enquanto a formulação final evita a ambiguidade sintática de repetir “Asdode” como objeto direto.
