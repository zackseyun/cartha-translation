revisions:
- from: Depois que a levaram para lá, a mão de Yahweh veio contra a cidade, provocando um pânico muito grande. Ele feriu os homens da cidade, desde o menor até o maior, e tumores irromperam neles.[a]
  to: Depois que a transferiram, a mão de Yahweh se voltou contra a cidade, causando um pânico muito grande; ele feriu os homens da cidade, do menor ao maior, e tumores surgiram neles.[a]
  rationale: A revisão elimina a referência adicional de destino em «para lá», torna a expressão da ação da mão de Yahweh mais idiomática em português e ajusta a descrição do aparecimento dos tumores para uma formulação natural. A ambiguidade da expressão hebraica rara e a não especificação médica da aflição são preservadas.
