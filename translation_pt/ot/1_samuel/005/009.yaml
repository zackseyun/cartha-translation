  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: pt
  text: Depois que a transferiram, a mão de Yahweh se voltou contra a cidade, causando um pânico muito grande; ele feriu os homens da cidade, do menor ao maior, e tumores surgiram neles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles tiveram tumores”. A expressão hebraica rara descreve o surgimento ou a erupção de inchaços no corpo.'
    reason: Alternativa lexical para a construção rara וַיִּשָּׂתְרוּ לָהֶם עפלים.
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: a levaram para lá
  rationale: O hifil de סבב com o pronome objeto descreve a transferência da arca para outro lugar. A formulação portuguesa é natural no contexto e não acrescenta um destino que o versículo não nomeia.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Mantém a metáfora hebraica da atuação poderosa de Deus em juízo, em vez de reduzi-la a uma expressão abstrata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e o distingue de um título como “Senhor”.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: um pânico muito grande
  rationale: מְהוּמָה pode indicar pânico, tumulto ou confusão; “pânico” se ajusta ao terror provocado pelo castigo divino, enquanto a intensificação hebraica é preservada.
- source_word: וַיַּךְ
  choice: Ele feriu
  rationale: O verbo no singular retoma Yahweh como agente. “Feriu” conserva a força concreta do hebraico em português atual.
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: O substantivo hebraico designa especificamente os homens, não os habitantes de modo genericamente inclusivo.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: desde o menor até o maior
  rationale: Reproduz o merismo hebraico sem decidir se a gradação se refere a idade, posição social ou importância.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: tumores irromperam neles
  rationale: A expressão rara descreve o aparecimento ou a erupção de inchaços corporais. “Tumores” é compreensível e evita a identificação médica excessivamente específica com hemorroidas.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura clara e vocabulário não técnico. A metáfora “mão de Yahweh” e a ambiguidade de “do menor ao maior” foram preservadas; evitou-se especificar os tumores como hemorroidas.
