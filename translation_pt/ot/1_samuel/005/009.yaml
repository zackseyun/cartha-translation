    issue: «Para lá» acrescenta um destino demonstrativo não expresso.
    rationale: O pronome hebraico se refere à arca e o verbo indica que a moveram ou transferiram; o versículo não contém um equivalente de «para lá». A formulação pode sugerir um destino indicado no próprio enunciado.
  - severity: low
    issue: Algumas formulações são pouco idiomáticas em português.
    rationale: «A mão ... veio contra» e «tumores irromperam neles» são compreensíveis, mas «a mão ... se voltou contra» e «tumores surgiram neles» leem de modo mais natural e conservam o sentido.
  - severity: low
