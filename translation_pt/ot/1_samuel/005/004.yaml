revisions:
- from: Quando se levantaram cedo na manhã seguinte, eis que Dagom estava caído com o rosto em terra diante da arca de Yahweh. A cabeça de Dagom e as palmas de suas duas mãos estavam cortadas sobre a soleira; somente Dagom havia restado sobre ele.[a]
  to: Quando se levantaram cedo, na manhã seguinte, eis que Dagom estava caído com o rosto em terra diante da arca de Yahweh. A cabeça de Dagom e as palmas das duas mãos jaziam cortadas sobre a soleira; somente Dagom restou.[a]
  rationale: A revisão elimina o pronome sem referente claro na cláusula final, enquanto a nota conserva a forma incomum do hebraico e sua provável leitura contextual, sem tornar «tronco» uma afirmação do texto principal. «Jaziam cortadas sobre a soleira» esclarece que as partes separadas estavam na soleira.
