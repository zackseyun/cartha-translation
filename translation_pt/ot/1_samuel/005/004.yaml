base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: pt
  text: Quando se levantaram cedo, na manhã seguinte, eis que Dagom estava caído com o rosto em terra diante da arca de Yahweh. A cabeça de Dagom e as palmas das duas mãos jaziam cortadas sobre a soleira; somente Dagom restou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “somente Dagom restou sobre ele”. A expressão é incomum; no contexto, provavelmente significa que apenas o corpo ou tronco do ídolo restou depois que sua cabeça e suas mãos foram cortadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: Quando se levantaram cedo na manhã seguinte
  rationale: Expressa de modo natural a ação sequencial e o período indicado pelas duas expressões temporais hebraicas.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a força de surpresa e de descoberta repentina do marcador discursivo.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: estava caído com o rosto em terra
  rationale: Descreve o estado em que o ídolo foi encontrado e preserva a imagem de prostração, sem tratar לְפָנָיו apenas como simples localização.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: diante da arca de Yahweh
  rationale: Tradução espacial direta, com o nome divino representado como nome próprio.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: as palmas de suas duas mãos
  rationale: Preserva a especificidade de כַּפּוֹת, 'palmas', e a referência explícita às duas mãos.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: estavam cortadas sobre a soleira
  rationale: Representa o estado resultante do corte e a localização das partes separadas.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: somente Dagom havia restado sobre ele
  rationale: Mantém a formulação difícil e ambígua do hebraico no texto principal, sem inserir interpretativamente 'tronco' ou 'torso'; a provável referência é esclarecida em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido da cláusula final sobre Dagom
  choice: Manter literalmente 'somente Dagom havia restado sobre ele' com nota explicativa
  alternative: Somente o tronco de Dagom havia restado
  rationale: A redação hebraica é incomum. O contexto favorece a interpretação de que restou o corpo do ídolo, mas a tradução principal não deve eliminar a ambiguidade textual.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe narrativa natural. Preservam-se o enfático “eis que”, a imagem de prostração e a dificuldade da cláusula final; a nota oferece a interpretação contextual provável sem incorporá-la silenciosamente ao texto.
