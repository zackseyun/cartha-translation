  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: pt
  text: Os filisteus haviam tomado a arca de Deus e a levaram de Ebenézer para Asdode.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, a frase começa com «E os filisteus»; aqui, o conectivo marca a continuidade ou transição da narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Os filisteus
  rationale: O nome do povo recebe a forma tradicional em português. O וּ inicial marca a continuidade ou transição narrativa e não precisa ser representado por um «e» rígido no início da frase.
- source_word: לָקְחוּ
  choice: haviam tomado
  rationale: O perfeito qal de לקח significa «tomar». O mais-que-perfeito composto situa essa ação como antecedente à ação narrativa seguinte e retoma o resultado da batalha anterior.
- source_word: אֵת
  choice: '[marcador de objeto direto não traduzido]'
  rationale: O marcador hebraico de objeto direto definido não tem equivalente lexical necessário em português.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: A construção genitiva é vertida diretamente e conserva a designação teológica do objeto sem explicitação adicional.
- source_word: וַיְבִאֻהוּ
  choice: e a levaram
  rationale: O hifil narrativo de בוא com sufixo masculino singular significa que eles a fizeram ir ou a trouxeram/levaram. «Levaram» é natural em português com o ponto de partida e o destino expressos; o pronome «a» retoma «arca» segundo o gênero gramatical português.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: de Ebenézer
  rationale: A preposição מִן indica procedência. «Ebenézer» segue a forma bíblica tradicional e inteligível em português para o topônimo hebraico.
- source_word: אַשְׁדּוֹדָה
  choice: para Asdode
  rationale: O ה direcional indica movimento em direção à cidade; «para» expressa isso naturalmente. «Asdode» é a forma tradicional portuguesa do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas bíblicas correntes no uso lusófono. O mais-que-perfeito composto evita o tom literário mais marcado de «tinham tomado»? Na realidade, «haviam tomado» mantém clareza e solenidade moderada; «a levaram» preserva a sequência sem repetição desnecessária do sujeito.
