base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: pt
  text: 'Então enviaram a arca de Deus para Ecrom. Mas, quando a arca de Deus chegou a Ecrom, os ecronitas gritaram: “Trouxeram até mim a arca do Deus de Israel, para me matar e ao meu povo!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Então enviaram
  rationale: Reproduz o envio da arca e a progressão narrativa marcada pelo waw consecutivo.
- source_word: הֵסַבּוּ אֵלַי
  choice: Fizeram chegar até mim
  rationale: Expressa o causativo de סבב no contexto de deslocar a arca de uma cidade para outra e preserva o pronome singular אֵלַי.
- source_word: וַיִּזְעֲקוּ
  choice: gritaram
  rationale: Comunica o clamor intenso dos ecronitas em linguagem portuguesa natural e direta.
theological_decisions:
- issue: Alternância entre o sujeito plural “os ecronitas” e a fala em primeira pessoa do singular
  choice: Preservar “mim” e “meu povo”
  alternative: Regularizar para “nós” e “nosso povo”
  rationale: O hebraico muda deliberadamente do plural הָעֶקְרֹנִים para os sufixos singulares אֵלַי, הֲמִיתֵנִי e עַמִּי, provavelmente apresentando a cidade ou a comunidade como uma voz coletiva. A tradução mantém essa tensão sem corrigi-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a repetição de “arca de Deus” foram mantidas para acompanhar o ritmo narrativo do hebraico; a incomum primeira pessoa singular foi preservada por fidelidade textual.
