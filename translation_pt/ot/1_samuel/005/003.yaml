id: 1SA.5.3
reference: 1 Samuel 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: pt
  text: Quando os habitantes de Asdode se levantaram cedo no dia seguinte, viram que Dagom estava caído com o rosto em terra diante da arca de Yahweh. Então pegaram Dagom e o puseram de volta no seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: se levantaram cedo
  rationale: O hifil de שׁכם indica levantar-se cedo; a expressão é natural em português e preserva a ênfase temporal.
- source_word: אַשְׁדּוֹדִים
  choice: os habitantes de Asdode
  rationale: O gentílico plural designa os moradores de Asdode. Esta forma é clara e mais imediatamente compreensível do que um gentílico português raro.
- source_word: מִמָּחֳרָת
  choice: no dia seguinte
  rationale: Expressa de maneira idiomática que isso ocorreu no dia posterior.
- source_word: וְהִנֵּה
  choice: viram que
  rationale: No contexto da descoberta, transmite naturalmente a súbita percepção introduzida por הִנֵּה, sem o tom arcaizante de 'eis que'.
- source_word: נֹפֵל
  choice: estava caído
  rationale: O particípio descreve o estado em que Dagom foi encontrado, resultante de uma queda anterior.
- source_word: לְפָנָיו אַרְצָה
  choice: com o rosto em terra
  rationale: Preserva a imagem concreta e humilhante da estátua prostrada, com a face voltada para o chão.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: diante da arca de Yahweh
  rationale: לִפְנֵי tem sentido espacial, e יְהוָה é mantido como o nome divino Yahweh.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: pegaram Dagom
  rationale: לקח significa tomar ou pegar; em português, 'pegaram' comunica naturalmente o manuseio e levantamento da imagem.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: o puseram de volta no seu lugar
  rationale: O hifil de שׁוב indica fazer voltar ou recolocar. A formulação expressa de modo natural a restauração da imagem à posição habitual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. 'Yahweh' preserva esse nome em vez de substituí-lo por um título.
- issue: Referência pessoal a Dagom
  choice: o
  alternative: a imagem; isso
  rationale: O hebraico emprega sufixos masculinos em referência a Dagom. O pronome português mantém essa personificação narrativa sem afirmar que o ídolo tenha vida real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evita tanto arcaísmos como 'eis que' quanto um gentílico pouco familiar; conserva a força visual de Dagom prostrado diante da arca.
