base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: pt
  text: 'Então mandaram chamar todos os governantes dos filisteus e os reuniram junto deles. Disseram: “O que faremos com a arca do Deus de Israel?” Eles responderam: “Que a arca do Deus de Israel seja levada para Gate.[a]” Assim, levaram a arca do Deus de Israel para lá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que a arca do Deus de Israel passe para Gate”. O verbo pode enfatizar o movimento ou a transferência, sem especificar exatamente como a arca foi transportada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: mandaram reunir
  rationale: A sequência verbal indica que enviaram mensageiros ou deram ordens para convocar os governantes. A formulação portuguesa é natural e não acrescenta explicitamente mensageiros, que o hebraico deixa implícitos.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: os governantes dos filisteus
  rationale: סֶרֶן é o título dos dirigentes das cidades filisteias. “Governantes” comunica a função sem sugerir necessariamente nobreza hereditária, como poderia ocorrer com “príncipes”.
- source_word: אֲלֵיהֶם
  choice: junto deles
  rationale: Expressa que os governantes foram reunidos na presença ou no local daqueles que os convocaram, preservando a referência espacial do hebraico.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: O que faremos com a arca
  rationale: O imperfeito na primeira pessoa plural tem sentido deliberativo; “com a arca” é a forma idiomática correspondente à preposição ל neste contexto.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção nominal hebraica.
- source_word: גַּת
  choice: Gate
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo filisteu.
- source_word: יִסֹּב
  choice: seja levada para
  rationale: O verbo סבב descreve movimento ou transferência, literalmente com a ideia de voltar-se ou passar ao redor. No contexto, a arca é enviada de uma cidade a outra; a formulação natural preserva o destino sem definir o modo de transporte.
- source_word: וַיַּסֵּבּוּ
  choice: levaram para lá
  rationale: A forma causativa indica que fizeram a arca deslocar-se. “Para lá” retoma Gate e evita o português pouco natural “fizeram circular”, enquanto a nota registra a nuance lexical.
