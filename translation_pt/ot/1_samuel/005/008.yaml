translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Governantes” evita o arcaísmo potencial de “senhores” como título político; “mandaram reunir” reproduz naturalmente a sequência de enviar e congregar. O marcador da nota foi colocado após a unidade que contém as duas ocorrências correlatas do verbo de movimento.
