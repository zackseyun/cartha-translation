base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: pt
  text: Por isso, até hoje, os sacerdotes de Dagom e todos os que entram no templo de Dagom, em Asdode, não pisam na soleira de Dagom.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “não calcam a soleira de Dagom”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “casa de Dagom”; aqui traduzido como “templo” porque o contexto se refere a um santuário pagão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz naturalmente a consequência do acontecimento anterior e preserva a força causal da expressão hebraica.
- source_word: לֹא יִדְרְכוּ
  choice: não pisam
  rationale: O verbo דרך significa pisar ou calcar. O presente expressa adequadamente um costume que permanecia até o tempo do narrador.
- source_word: כֹהֲנֵי דָגוֹן
  choice: os sacerdotes de Dagom
  rationale: Reproduz de modo direto e claro a construção hebraica.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: e todos os que entram no templo de Dagom
  rationale: Nesse contexto, בית דגון designa o edifício de culto dedicado a Dagom; 'templo' comunica essa função com clareza em português atual.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: na soleira de Dagom
  rationale: מִפְתָּן significa 'soleira' ou 'limiar'; 'pisar na soleira' é uma formulação natural e precisa em português.
- source_word: בְּאַשְׁדּוֹד
  choice: em Asdode
  rationale: A preposição indica o local do templo e do costume relatado.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Expressão portuguesa idiomática que preserva a continuidade do costume até o presente do narrador.
