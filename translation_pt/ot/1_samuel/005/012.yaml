id: 1SA.5.12
reference: 1 Samuel 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָֽ/אֲנָשִׁים֙ אֲשֶׁ֣ר לֹא מֵ֔תוּ הֻכּ֖וּ ב/עפלים וַ/תַּ֛עַל שַֽׁוְעַ֥ת הָ/עִ֖יר הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/012.yaml
  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: pt
  text: E os homens que não morreram foram atingidos por tumores[a], e o clamor da cidade subiu até os céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por inchaços”. O termo hebraico se refere a um inchaço ou tumor no corpo. Traduções tradicionais às vezes especificam “hemorroidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: E os homens
  rationale: אֲנָשִׁים designa aqui, de modo mais natural, os homens; mantém-se a referência masculina explícita sem ampliá-la para toda a população.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: que não morreram
  rationale: A oração relativa distingue diretamente os sobreviventes daqueles que morreram; o pretérito perfeito é claro e natural em português.
- source_word: הֻכּוּ
  choice: foram atingidos
  rationale: O hofal de נכה é passivo. “Foram atingidos” preserva a imagem vívida sem recorrer a linguagem arcaica nem transformar o verbo em uma explicação.
- source_word: בָעֳפָלִים
  choice: por tumores
  rationale: O termo indica inchaços ou tumores corporais, mas não permite identificar com segurança uma enfermidade mais específica. “Tumores” é claro e evita a precisão excessiva de “hemorroidas”.
- source_word: וַתַּעַל
  choice: subiu
  rationale: עלה expressa movimento ascendente; “subiu” reproduz de modo natural a imagem concreta do clamor que alcança os céus.
- source_word: שַׁוְעַת
  choice: o clamor
  rationale: שַׁוְעָה é um grito angustiado, frequentemente um pedido de socorro. “Clamor” comunica essa intensidade em registro digno e corrente.
- source_word: הָעִיר
  choice: da cidade
  rationale: A construção nominal é vertida diretamente como “o clamor da cidade”, preservando seu caráter coletivo sem convertê-la em “clamor vindo da cidade”.
- source_word: הַשָּׁמָיִם
  choice: até os céus
  rationale: שָׁמַיִם tem forma plural e, nesta imagem espacial, “até os céus” é natural em português. “Até” explicita o ponto alcançado sem identificar expressamente Deus, que não aparece no hebraico.
theological_decisions:
- issue: Destino do clamor que sobe
  choice: até os céus
  alternative: até o céu / até Deus
  rationale: O texto diz literalmente que o clamor subiu aos céus. A tradução conserva a imagem e não resolve teologicamente o destino como “Deus”, embora isso possa estar implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação repetida com “e” conserva o andamento narrativo hebraico; “clamor” mantém a intensidade do pedido de socorro.
