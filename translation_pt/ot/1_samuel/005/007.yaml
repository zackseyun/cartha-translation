base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: pt
  text: 'Quando os homens de Asdode viram que era assim, disseram: “A arca do Deus de Israel não deve permanecer conosco[a], pois sua mão pesa sobre nós[b] e sobre Dagom, nosso deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não deve ficar conosco”. O verbo hebraico pode significar “sentar-se”, “habitar” ou “permanecer”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sua mão pesa sobre nós”, expressão que descreve a ação severa de Deus em juízo.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד כִּי כֵן
  choice: Quando os homens de Asdode viram que era assim
  rationale: A oração temporal expressa naturalmente a progressão narrativa do waw consecutivo; “homens de Asdode” mantém o masculino plural do hebraico, e “era assim” retoma a situação descrita anteriormente.
- source_word: לֹא יֵשֵׁב
  choice: não deve permanecer
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer. Tendo a arca como sujeito, “permanecer” comunica sua presença continuada, enquanto “não deve” expressa a decisão enfática dos falantes.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל עִמָּנוּ
  choice: a arca do Deus de Israel ... conosco
  rationale: A formulação conserva a designação hebraica e o contraste narrativo com “Dagom, nosso deus”; “conosco” traduz diretamente עִמָּנוּ.
- source_word: קָשְׁתָה יָדוֹ עָלֵינוּ
  choice: a mão dele tem sido dura contra nós
  rationale: Preserva a metáfora antropomórfica da “mão” e traduz קָשְׁתָה por “tem sido dura”, sem substituir a imagem por uma explicação interpretativa. “Contra nós” comunica o sentido adversativo de עָלֵינוּ neste contexto de juízo.
- source_word: וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: e contra Dagom, nosso deus
  rationale: A repetição de “contra” mantém o paralelismo. “Nosso deus” reproduz o ponto de vista dos filisteus sem acrescentar uma qualificação ausente no hebraico.
theological_decisions:
- issue: A imagem da mão divina em קָשְׁתָה יָדוֹ
  choice: a mão dele tem sido dura contra nós
  alternative: ele nos castigou severamente
  rationale: A tradução mantém a imagem concreta da mão de Deus agindo em juízo e evita reduzir a tensão teológica do relato a uma paráfrase explicativa.
- issue: A designação de Dagom como אֱלֹהֵינוּ
  choice: Dagom, nosso deus
  alternative: Dagom, nosso ídolo
  rationale: A fala é apresentada segundo a perspectiva dos habitantes de Asdode. Traduzir “deus” conserva o contraste narrativo sem inserir uma avaliação polemicamente explícita que não aparece nesta frase.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construções naturais para leitores brasileiros. A metáfora hebraica da mão foi preservada, e as notas esclarecem alternativas lexicais sem resolver indevidamente a força teológica do texto.
