revisions:
- from: 'Quando os homens de Asdode viram que era assim, disseram: “A arca do Deus de Israel não deve permanecer conosco[a], pois a mão dele tem sido dura contra nós[b] e contra Dagom, nosso deus.”'
  to: 'Quando os homens de Asdode viram que era assim, disseram: “A arca do Deus de Israel não deve permanecer conosco[a], pois sua mão pesa sobre nós[b] e sobre Dagom, nosso deus.”'
  rationale: A revisão elimina a nuance progressiva não marcada de “tem sido” e substitui “dura” por “pesa”, expressão portuguesa natural que conserva a metáfora de uma mão divina pesada/opressiva. A repetição de “sobre” mantém o paralelismo de עָלֵינוּ ... וְעַל־דָּגוֹן sem interpretar a imagem além do necessário.
