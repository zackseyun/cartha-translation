source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ וַ/יַּאַסְפ֜וּ אֶת כָּל סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּֽאמְרוּ֙ שַׁלְּח֞וּ אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ וְ/יָשֹׁ֣ב לִ/מְקֹמ֔/וֹ וְ/לֹֽא יָמִ֥ית אֹתִ֖/י וְ/אֶת עַמִּ֑/י כִּֽי הָיְתָ֤ה מְהֽוּמַת מָ֨וֶת֙ בְּ/כָל הָ/עִ֔יר כָּבְדָ֥ה מְאֹ֛ד יַ֥ד הָ/אֱלֹהִ֖ים שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: pt
  text: 'Então mandaram chamar e reuniram todos os governantes dos filisteus e disseram: “Mandem embora a arca do Deus de Israel, e que ela volte ao seu lugar, para que não mate a mim e ao meu povo”. Pois havia um pânico mortal em toda a cidade[a]; a mão de Deus pesava muito ali[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um terror de morte”, “uma confusão mortal” ou “um tumulto mortífero”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a mão de Deus era muito pesada ali”, metáfora da intensa ação divina em juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: governantes
  rationale: O termo designa os governantes reconhecidos das cidades filisteias. “Governantes” comunica a função política com clareza no português atual.
- source_word: שַׁלְּחוּ
  choice: Mandem embora
  rationale: O imperativo exige que a arca seja retirada da cidade; “mandem embora” expressa naturalmente essa ideia de remoção.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: a arca do Deus de Israel
  rationale: Preserva a construção genitiva e a identificação explícita da arca com o Deus de Israel.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: e que ela volte ao seu lugar
  rationale: Representa o valor volitivo da forma hebraica após o imperativo e mantém a referência ao lugar próprio da arca.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: para que não mate a mim e ao meu povo
  rationale: Conserva o sentido causativo de מות e, sobretudo, os sufixos singulares do hebraico, provavelmente a fala de um representante da cidade.
- source_word: מְהוּמַת מָוֶת
  choice: um pânico mortal
  rationale: A expressão descreve terror ou tumulto associado à morte. “Pânico mortal” é natural e preserva tanto a intensidade quanto a consequência letal, sem eliminar a amplitude semântica em nota.
- source_word: בְּכָל הָעִיר
  choice: em toda a cidade
  rationale: Expressa de forma direta e idiomática a extensão do pânico pela cidade inteira.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: a mão de Deus pesava muito
  rationale: Mantém a metáfora bíblica da mão como poder ativo de Deus e reproduz a intensidade de כָּבְדָה מְאֹד em português natural.
theological_decisions:
- issue: Preservar ou interpretar a metáfora antropomórfica “a mão de Deus”
  choice: 'Preservar a metáfora: “a mão de Deus pesava muito ali”'
  alternative: Deus castigava severamente aquele lugar
  rationale: O hebraico menciona explicitamente a “mão”, metáfora bíblica importante para a ação divina. Mantê-la conserva as conexões literárias e teológicas sem impor uma interpretação além do texto.
- issue: Alternância entre os falantes plurais e os pronomes singulares “a mim” e “meu povo”
  choice: Manter o singular na fala direta
  alternative: “a nós e ao nosso povo”
  rationale: O texto hebraico traz sufixos singulares, possivelmente representando a voz do governante da cidade. Ajustá-los ao plural apagaria uma característica real e significativa do texto-fonte.
- issue: Agência expressa na oração “para que não mate”
  choice: Manter o sujeito implícito ligado à arca no fluxo da frase
  alternative: “para que Deus não mate a mim e ao meu povo”
  rationale: O hebraico não nomeia Deus como sujeito nessa oração. A tradução preserva a formulação e sua tensão narrativa, sem explicitar uma agência que o texto deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora bíblica da mão de Deus, a singularidade inesperada de “a mim e ao meu povo” e a ambiguidade relativa à agência da arca, evitando harmonizações interpretativas.
