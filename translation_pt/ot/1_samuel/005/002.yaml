base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: pt
  text: Assim, os filisteus pegaram a arca de Deus, levaram-na para a casa de Dagom[a] e a colocaram ao lado de Dagom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo de Dagom”. Literalmente, “a casa de Dagom”.
    reason: alternativa lexical e esclarecimento contextual
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: pegaram
  rationale: לקח é o verbo comum para “pegar” ou “tomar”. “Pegaram” soa natural em português e não acrescenta a ideia de violência expressa por “apoderaram-se”.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse povo.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: “Arca” é o termo consagrado para אֲרוֹן neste contexto sagrado. O texto usa הָאֱלֹהִים, “Deus”, e não o nome divino YHWH.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: levaram-na
  rationale: O hifil de בוא significa “levar/trazer”. Como o movimento é descrito da perspectiva dos filisteus rumo à casa de Dagom, “levaram-na” é natural em português; o pronome retoma “arca”.
- source_word: בֵּית דָּגוֹן
  choice: a casa de Dagom
  rationale: Preserva literalmente a expressão hebraica, que no contexto designa o santuário ou templo de Dagom. A alternativa contextual é registrada em nota.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: a colocaram
  rationale: O hifil de יצג significa pôr, colocar ou posicionar. “Colocaram” expressa com naturalidade o ato de posicionar a arca.
- source_word: אֵצֶל דָּגוֹן
  choice: ao lado de Dagom
  rationale: אֵצֶל indica proximidade espacial, “ao lado de” ou “junto de”. O hebraico diz apenas “Dagom”; por isso, não se explicita no texto principal que se trata da imagem do deus.
theological_decisions:
- issue: Designação divina em “arca de Deus”
  choice: Deus
  alternative: SENHOR
  rationale: O hebraico traz הָאֱלֹהִים, não YHWH. A tradução preserva a designação efetivamente usada no versículo, sem harmonizá-la com outras passagens.
- issue: Referente de “Dagom” na colocação da arca
  choice: Manter simplesmente “Dagom”
  alternative: a estátua ou imagem de Dagom
  rationale: No contexto, o referente provavelmente é a imagem cultual de Dagom, mas o texto hebraico conserva a ambiguidade metonímica ao dizer apenas “Dagom”. A tradução não acrescenta uma explicação ausente do original.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A estrutura narrativa foi suavemente ajustada à sintaxe portuguesa, preservando a repetição de “Dagom” e a expressão hebraica “casa de Dagom”.
