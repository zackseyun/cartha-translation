  naturalness: «Então os homens de Bete-Semes disseram» e «Quem poderá permanecer diante de Yahweh» são claros, solenes e naturais. «E para junto de quem subirá, afastando-se de nós?» é compreensível, mas fica mais pesado e menos direto que uma formulação com «para longe de nós».
  terminology: «Bete-Semes», «Yahweh» e «Deus santo» são adequados ao português moderno e mantêm os termos relevantes. A nota deve conservar a alternativa feminina exigida por «arca» em português, esclarecendo que o hebraico mantém o sujeito implícito.
