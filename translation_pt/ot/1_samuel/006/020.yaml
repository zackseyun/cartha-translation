  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: pt
  text: 'Então os homens de Bete-Semes disseram: “Quem poderá permanecer diante de Yahweh, este Deus santo? E para junto de quem subirá[a], para longe de nós?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E para junto de quem ela subirá, para longe de nós?” Provavelmente se refere à arca de Yahweh.'
    reason: O sujeito de יַעֲלֶה não está expresso no hebraico. Pelo contexto, a arca é o referente mais provável; em hebraico, a palavra para “arca” é masculina, ao passo que em português é feminina.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: os homens de Bete-Semes
  rationale: אַנְשֵׁי significa literalmente “homens de”; a tradução mantém a referência masculina do hebraico e translitera o topônimo de modo corrente em português.
- source_word: מִי יוּכַל
  choice: Quem poderá
  rationale: Preserva a pergunta sobre capacidade expressa por יכל e comunica a percepção de incapacidade humana diante da santidade divina.
- source_word: לַעֲמֹד לִפְנֵי
  choice: permanecer diante de
  rationale: O verbo עמד pode significar ficar de pé ou permanecer. Neste contexto, “permanecer diante de” comunica melhor a ideia de suportar ou continuar na presença divina, sem perder a imagem básica do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: este Deus santo
  rationale: Formulação natural em português que preserva tanto a santidade atribuída a Deus quanto a força imediata do demonstrativo הַזֶּה.
- source_word: וְאֶל מִי
  choice: E para junto de quem
  rationale: “Para junto de” expressa o destino indicado por אֶל e soa natural com o verbo de movimento da oração seguinte.
- source_word: יַעֲלֶה
  choice: subirá
  rationale: Mantém o sentido básico de עלה, “subir”, e deixa o sujeito implícito, como no hebraico. A omissão do pronome em português preserva melhor a ambiguidade do original.
- source_word: מֵעָלֵינוּ
  choice: afastando-se de nós
  rationale: Expressa o movimento para longe da comunidade indicado pelo contexto e pela combinação preposicional, evitando o português pouco natural “de sobre nós”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sujeito implícito de יַעֲלֶה
  choice: 'sujeito não expresso: “subirá”'
  alternative: “ela subirá”, com referência explícita à arca
  rationale: Embora o contexto indique provavelmente a arca, o hebraico não nomeia o sujeito. Como o português permite sujeito oculto, a tradução conserva essa indeterminação no texto principal e registra a referência provável em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem e a cadência das duas perguntas preservam o temor solene dos habitantes de Bete-Semes; o sujeito oculto da segunda pergunta mantém uma ambiguidade real do hebraico.
