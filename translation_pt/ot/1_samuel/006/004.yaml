base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: pt
  text: 'Eles perguntaram: “Que oferta pela culpa[a] devemos devolver a ele?” Responderam: “Conforme o número dos governantes filisteus[b]: cinco tumores de ouro[c] e cinco ratos de ouro, pois uma só praga atingiu todos eles e os governantes de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “oferta de reparação” ou “oferta pelo delito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “chefes filisteus”. O termo hebraico é um título dado aos principais dirigentes dos filisteus.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico provavelmente se refere a inchaços relacionados à praga; algumas traduções usam o termo mais específico “hemorroidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: oferta pela culpa
  rationale: No contexto cultual e reparador, אָשָׁם designa uma oferta apresentada para reparar uma ofensa. “Oferta pela culpa” é uma expressão clara e já reconhecível em português, sem eliminar o aspecto de reparação.
- source_word: נָשִׁיב לוֹ
  choice: devemos devolver a ele
  rationale: O hifil de שׁוב tem o sentido de fazer voltar ou devolver. O pronome masculino singular foi mantido como referência pessoal ao Deus de Israel, em vez de ser convertido em referência impessoal à arca.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: conforme o número dos governantes filisteus
  rationale: A construção indica correspondência com o número dos dirigentes filisteus. “Conforme o número” explicita naturalmente essa relação em português.
- source_word: סַרְנֵי
  choice: governantes
  rationale: O termo é um título próprio dos principais dirigentes filisteus. “Governantes” comunica sua autoridade sem sugerir indevidamente uma categoria feudal posterior.
- source_word: עפלי זָהָב
  choice: tumores de ouro
  rationale: O substantivo indica inchaços ou tumores associados à praga. A tradução permanece concreta, mas não especifica além da evidência textual que se tratava de hemorroidas.
- source_word: עַכְבְּרֵי זָהָב
  choice: ratos de ouro
  rationale: עַכְבָּר designa rato ou camundongo. “Ratos” é o termo corrente e natural em português para as figuras feitas de ouro.
- source_word: מַגֵּפָה אַחַת
  choice: uma só praga
  rationale: A formulação preserva a ênfase hebraica na unidade da praga que atingiu a todos.
- source_word: לְכֻלָּם
  choice: atingiu todos eles
  rationale: Com מַגֵּפָה, a preposição assinala aqueles sobre quem recaiu a praga. O verbo “atingiu” produz português natural sem alterar a relação semântica.
- source_word: וּלְסַרְנֵיכֶם
  choice: e os governantes de vocês
  rationale: O sufixo de segunda pessoa do plural foi preservado, refletindo a fala dirigida coletivamente aos filisteus, e “governantes” mantém a coerência lexical no versículo.
theological_decisions:
- issue: Referente do pronome לוֹ na pergunta sobre a oferta
  choice: “a ele”, com referência pessoal ao Deus de Israel
  alternative: “a ela” ou “a isso”, com referência à arca
  rationale: Embora o contexto imediato envolva a devolução da arca, a lógica reparadora da oferta aponta para o Deus de Israel como aquele a quem a compensação é apresentada. A forma masculina singular do hebraico também é representada diretamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros e inteligíveis internacionalmente. A repetição hebraica de “disseram” foi vertida como “perguntaram” e “responderam” para tornar explícita a função discursiva já presente no diálogo, sem mudar seu conteúdo.
