base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: pt
  text: Agora, peguem e façam uma carroça nova e duas vacas que amamentam[a], sobre as quais nunca tenha sido posto jugo[b]. Atrelem as vacas à carroça, mas levem os bezerros delas para casa, afastando-os de suas mães.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “duas vacas leiteiras”, isto é, vacas que dão leite.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre as quais não subiu jugo”; isto é, vacas que nunca haviam sido usadas em trabalho de tração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca com naturalidade a transição para a próxima instrução; o contexto comunica a força conclusiva/procedimental.
- source_word: קְחוּ וַעֲשׂוּ
  choice: peguem e preparem
  rationale: Mantém os dois imperativos, entendendo עשה no sentido contextual de providenciar ou preparar a carroça, sem sugerir necessariamente que devam construí-la.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: uma carroça nova
  rationale: Carroça é uma equivalência corrente para o veículo; o numeral אֶחָת funciona naturalmente em português no artigo indefinido singular.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: duas vacas que estejam amamentando
  rationale: Expressa que são vacas em lactação e que têm bezerros, como confirma a oração final.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: sobre as quais nunca tenha sido posto jugo
  rationale: Preserva a imagem hebraica do jugo sobre os animais, em português claro, e explicita corretamente que nunca foram usadas sob jugo.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: Atrelem as vacas à carroça
  rationale: Atrelar é o verbo português específico e natural para prender animais de tração a um veículo.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם
  choice: levem os bezerros delas para casa
  rationale: O hifil de שוב é causativo, e בְּנֵיהֶם, aplicado a vacas, refere-se naturalmente aos bezerros.
- source_word: מֵאַחֲרֵיהֶם
  choice: afastando-os de suas mães
  rationale: Comunica a separação dos bezerros das vacas; 'suas mães' torna o referente feminino inequívoco em português.
- source_word: הַבָּיְתָה
  choice: para casa
  rationale: Reproduz a forma direcional de 'casa' sem importar uma construção específica, como estábulo ou curral.
