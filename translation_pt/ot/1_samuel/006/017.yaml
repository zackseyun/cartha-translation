  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ טְחֹרֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֨ר הֵשִׁ֧יבוּ פְלִשְׁתִּ֛ים אָשָׁ֖ם לַֽ/יהוָ֑ה לְ/אַשְׁדּ֨וֹד אֶחָ֜ד לְ/עַזָּ֤ה אֶחָד֙ לְ/אַשְׁקְל֣וֹן אֶחָ֔ד לְ/גַ֥ת אֶחָ֖ד לְ/עֶקְר֥וֹן אֶחָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: pt
  text: 'Estes são os tumores de ouro que os filisteus devolveram como oferta pela culpa a Yahweh: um por Asdode[a], um por Gaza, um por Ascalom, um por Gate e um por Ecrom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inchaços de ouro”. O termo hebraico se refere à aflição corporal representada por essas ofertas votivas e, tradicionalmente, também é traduzido de modo mais específico como “hemorroidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A expressão introduz uma lista explicativa ligada ao contexto anterior. Em português, a omissão de um 'E' inicial é mais natural sem perder a continuidade narrativa.
- source_word: טְחֹרֵי הַזָּהָב
  choice: os tumores de ouro
  rationale: טְחֹרִים designa a aflição corporal representada pelos objetos votivos. 'Tumores' mantém a referência relativamente ampla e evita impor a identificação médica tradicional mais específica; 'de ouro' reproduz com naturalidade a construção hebraica.
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: que ... devolveram
  rationale: O hifil de שׁוב tem aqui o sentido de devolver ou mandar de volta. 'Devolveram' expressa adequadamente a restituição associada à arca e à oferta.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa corrente para o nome desse povo.
- source_word: אָשָׁם
  choice: como oferta pela culpa
  rationale: אָשָׁם indica uma oferta ligada à culpa e à reparação. Esta formulação é clara em português e conserva ambos os aspectos sem tornar a frase excessivamente técnica.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto traz diretamente o Tetragrama; a transliteração 'Yahweh' preserva o nome divino em vez de substituí-lo por um título.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: um por Asdode ... um por Ecrom
  rationale: A repetição de לְ com אֶחָד indica um objeto correspondente a cada cidade filisteia. 'Um por' comunica essa distribuição de modo natural e conciso.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega o Tetragrama, a tradução mantém o nome divino por transliteração, sem convertê-lo em título.
- issue: Sentido sacrificial e reparador de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: A expressão escolhida conserva o vínculo explícito com a culpa, enquanto o contexto da devolução mantém perceptível a dimensão reparadora. A alternativa é possível, mas enfatizaria mais a reparação do que a designação sacrificial tradicional.
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas correntes no uso bíblico lusófono. A redação conserva a estrutura enumerativa do hebraico e mantém a relativa indeterminação do termo referente à aflição.
