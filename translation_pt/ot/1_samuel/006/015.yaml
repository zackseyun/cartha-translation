source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: pt
  text: Os levitas baixaram a arca de Yahweh[a] e a caixa que estava com ela, na qual estavam os objetos de ouro[b], e as colocaram sobre a grande pedra. Naquele dia, os homens de Bete-Semes ofereceram holocaustos e sacrifícios[c] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido como “o SENHOR”.
    reason: alternative_reading
  - marker: b
    text: Ou “utensílios de ouro” ou “artigos de ouro”; o termo hebraico pode designar amplamente objetos, recipientes ou implementos.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sacrificaram sacrifícios”; o hebraico emprega um verbo e um substantivo da mesma raiz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Os levitas
  rationale: Designa os membros da tribo de Levi; esta é a forma consagrada, clara e natural em português.
- source_word: הוֹרִידוּ
  choice: retiraram
  rationale: O hifil de ירד indica que fizeram a arca e a caixa descer, isto é, que as tiraram do veículo mencionado no contexto. “Retiraram” expressa a ação naturalmente sem acrescentar “carroça” ao versículo.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: אֲרוֹן é a arca cultual; o nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio no texto.
- source_word: הָאַרְגַּז
  choice: a caixa
  rationale: Refere-se ao recipiente que acompanhava a arca e era distinto dela. “Caixa” é atual e não sugere indevidamente outra arca.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estava com ela
  rationale: Mantém de modo simples a relação expressa pelo hebraico, sem especificar uma posição que o texto não declara.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: na qual estavam os objetos de ouro
  rationale: כְלֵי é amplo e pode designar objetos, utensílios ou artigos; “objetos” evita especificar uma forma ou função ausente do texto.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: e as colocaram sobre a grande pedra
  rationale: No contexto, שׂים com אֶל indica colocar os dois itens junto à superfície da pedra; “sobre” representa a leitura contextual mais provável, embora a preposição isoladamente também possa significar “junto a” ou “em direção a”.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: os homens de Bete-Semes
  rationale: אַנְשֵׁי é a forma masculina “homens de”. A tradução a preserva, pois o contexto não exige generalizá-la para toda a população.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: ofereceram holocaustos
  rationale: É a expressão sacrificial usual para ofertas totalmente queimadas. “Holocaustos” é o termo bíblico estabelecido e distingue essa oferta dos demais sacrifícios mencionados em seguida.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: e sacrifícios
  rationale: Na coordenação com “ofereceram”, a forma portuguesa natural é “ofereceram holocaustos e sacrifícios”. Uma nota registra a construção cognata enfática do hebraico.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Equivalente temporal direto e idiomático em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário dos atos sacrificiais; “a Yahweh” conserva tanto essa relação quanto o nome divino.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e uma vocalização acadêmica amplamente aceita, enquanto a nota informa a tradição de substituí-lo por “SENHOR”.
- issue: Referência masculina em אַנְשֵׁי
  choice: os homens de Bete-Semes
  alternative: o povo de Bete-Semes; os habitantes de Bete-Semes
  rationale: A forma hebraica é masculina e, neste contexto de ação sacrificial pública, não há base suficiente para neutralizá-la.
- issue: Relação entre holocaustos e outros sacrifícios
  choice: ofereceram holocaustos e sacrifícios
  alternative: ofereceram holocaustos e sacrificaram sacrifícios
  rationale: A tradução distingue as duas categorias indicadas por עֹלוֹת e זְבָחִים, mas evita uma repetição pouco natural em português; a construção literal fica registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas amplamente reconhecíveis no Brasil e no espaço lusófono. “Bete-Semes” segue a grafia bíblica corrente em português. A sintaxe evita arcaísmos e conserva as distinções sacrificiais do hebraico.
