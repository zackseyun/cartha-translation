  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: pt
  text: Então puseram sobre a carroça a arca de Yahweh, a caixa, os ratos de ouro e as imagens de seus tumores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus inchaços”; possivelmente “suas hemorroidas”.
    reason: Alternativas lexicais para טְחֹרֵיהֶם, cuja identificação médica exata é incerta.
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Então puseram
  rationale: O wayyiqtol de שׂים faz a narrativa avançar. “Então” expressa a sequência, e “puseram” é natural e fiel ao ato descrito.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Neste contexto, אֲרוֹן designa o objeto sagrado conhecido como a arca. O nome divino יהוה é transliterado como “Yahweh”, preservando o nome pessoal presente no hebraico.
- source_word: אֶל הָעֲגָלָה
  choice: sobre a carroça
  rationale: A preposição אֶל indica o movimento ou a colocação em direção ao veículo; “sobre a carroça” é idiomático em português e adequado a uma plataforma de transporte.
- source_word: הָאַרְגַּז
  choice: a caixa
  rationale: O termo designa o recipiente no qual estavam os objetos da oferta. “Caixa” é claro e evita confundi-lo com a arca.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: os ratos de ouro
  rationale: A construção significa literalmente “ratos de ouro”; a expressão comunica com clareza que eram representações feitas desse material.
- source_word: צַלְמֵי
  choice: as imagens de
  rationale: צֶלֶם indica uma imagem ou representação. “Imagens” descreve adequadamente as réplicas confeccionadas.
- source_word: טְחֹרֵיהֶם
  choice: seus tumores
  rationale: O termo se refere à aflição narrada no contexto, mas sua identificação médica exata é discutida. “Tumores” mantém no texto principal uma formulação ampla, deixando alternativas mais específicas para a nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” translitera o nome pessoal sem substituí-lo por um título e sem adotar a forma híbrida tradicional “Jeová”.
- issue: Identificação da aflição טְחֹרִים
  choice: tumores
  alternative: inchaços; hemorroidas
  rationale: A natureza exata da aflição não é inequívoca. A tradução principal preserva essa cautela lexical, enquanto a nota registra as interpretações alternativas.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. O marcador da nota foi colocado após “tumores”, termo ao qual a nota lexical efetivamente se refere.
