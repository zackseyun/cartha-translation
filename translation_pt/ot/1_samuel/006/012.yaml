  to: As vacas seguiram em linha reta pela estrada que levava a Bete-Semes, por uma única via[a]. Continuaram seguindo, mugindo[b], sem se desviar nem para a direita nem para a esquerda. Os governantes dos filisteus seguiam atrás delas até a divisa de Bete-Semes.
  rationale: A revisão reposiciona a nota sobre o mugido junto ao termo que ela explica e traduz o acompanhamento dos governantes com um imperfeito progressivo. Também substitui “mantendo-se numa única via” por “por uma única via”, formulação mais direta e idiomática, mantendo a ênfase hebraica em uma rota única.
