  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: pt
  text: As vacas seguiram em linha reta pela estrada que levava a Bete-Semes, por uma única via[a]. Continuaram seguindo, mugindo[b], sem se desviar nem para a direita nem para a esquerda. Os governantes dos filisteus seguiam atrás delas até a divisa de Bete-Semes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por uma só estrada”. O hebraico enfatiza que as vacas permaneceram numa única rota definida.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica indica que elas continuavam mugindo enquanto avançavam.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: seguiram em linha reta
  rationale: Expressa o movimento direto e contínuo indicado pelo verbo ישר em português natural.
- source_word: הַפָּרוֹת
  choice: as vacas
  rationale: O contexto fala de vacas leiteiras atreladas ao carro; “vacas” é preciso e corrente.
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: pela estrada em direção a Bete-Semes
  rationale: Preserva a rota definida e o destino indicado pela repetição de דרך sem reproduzir uma redundância pouco natural em português.
- source_word: בִּמְסִלָּה אַחַת
  choice: mantendo-se numa única via
  rationale: Conserva a ênfase em uma só rota fixa, evitando que “rodovia” sugira uma estrada moderna.
- source_word: הָלְכוּ הָלֹוךְ
  choice: continuaram andando
  rationale: Comunica a força durativa da construção com infinitivo absoluto.
- source_word: וְגָעוֹ
  choice: mugindo
  rationale: É a forma corrente e digna de descrever o som emitido pelo gado.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: sem se desviar nem para a direita nem para a esquerda
  rationale: Preserva o idioma hebraico de não abandonar a rota.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: os governantes dos filisteus
  rationale: סְרָנִים designa os dirigentes reconhecidos das cidades filisteias; “governantes” evita que “senhores” pareça uma referência social ou religiosa genérica.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: foram atrás delas
  rationale: Expressa o acompanhamento físico das vacas em português natural.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: até a divisa de Bete-Semes
  rationale: “Divisa” transmite aqui o limite territorial indicado por גְּבוּל.
