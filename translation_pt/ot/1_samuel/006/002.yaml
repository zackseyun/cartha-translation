  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: pt
  text: 'Então os filisteus chamaram os sacerdotes e os adivinhos e perguntaram: “O que faremos com a arca de Yahweh? Digam-nos com que devemos enviá-la ao seu lugar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: chamaram
  rationale: Neste contexto, o verbo introduz a convocação de especialistas para aconselhamento; “chamaram” é natural e preserva esse sentido sem explicitação desnecessária.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma consagrada em português para o nome desse povo, com artigo definido natural na narrativa.
- source_word: לַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Mantém o artigo definido hebraico e designa os oficiais cultuais filisteus sem acrescentar uma qualificação ausente no texto.
- source_word: וְלַקֹּסְמִים
  choice: e os adivinhos
  rationale: קֹסְמִים designa praticantes de adivinhação; “adivinhos” é preciso, corrente e compreensível.
- source_word: לֵאמֹר
  choice: e perguntaram
  rationale: A fórmula hebraica introduz aqui uma fala interrogativa. A tradução natural em português integra a coordenação e explicita a função discursiva sem alterar o conteúdo.
- source_word: מַה נַּעֲשֶׂה
  choice: O que faremos
  rationale: Expressa de modo direto a pergunta deliberativa na primeira pessoa do plural.
- source_word: לַאֲרוֹן יְהוָה
  choice: com a arca de Yahweh
  rationale: A preposição é representada idiomaticamente por “com” na pergunta; “arca” conserva o referente cultual e Yahweh translitera o nome divino.
- source_word: הוֹדִיעֻנוּ
  choice: Digam-nos
  rationale: O imperativo causativo de ידע significa “façam-nos saber”; “Digam-nos” é a formulação natural em português, no plural por se dirigir aos sacerdotes e adivinhos.
- source_word: בַּמֶּה
  choice: com que
  rationale: Preserva de perto o sentido instrumental da expressão hebraica, “com o quê/por que meio”, sem reduzi-la simplesmente a uma pergunta de modo.
- source_word: נְשַׁלְּחֶנּוּ
  choice: devemos enviá-la
  rationale: O imperfeito no contexto consultivo exprime a ação proposta; o pronome feminino retoma naturalmente “arca” em português.
- source_word: לִמְקוֹמוֹ
  choice: ao seu lugar
  rationale: Mantém a referência literal ao lugar da arca. Não se acrescenta “de volta”, embora isso esteja implícito no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a formulação foram ajustadas à fala natural, enquanto “com que” conserva a nuance instrumental e a possível estranheza significativa do hebraico.
