  text: וַ/יְהִ֧י אֲרוֹן יְהוָ֛ה בִּ/שְׂדֵ֥ה פְלִשְׁתִּ֖ים שִׁבְעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/001.yaml
  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: pt
  text: A arca de Yahweh ficou no território dos filisteus durante sete meses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “no campo dos filisteus”; a expressão pode significar “na região” ou “no território dos filisteus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ficou
  rationale: A forma narrativa de היה dá continuidade ao relato. Em português, “ficou” expressa naturalmente a permanência da arca no território filisteu, sem recorrer à fórmula pouco idiomática “e aconteceu que estava”.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Reproduz diretamente a cadeia construta. “Arca” é o termo consagrado e adequado neste contexto cultual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: no território dos filisteus
  rationale: Embora שָׂדֶה signifique literalmente “campo”, neste contexto a expressão designa de modo mais natural a região ou o território controlado pelos filisteus.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: durante sete meses
  rationale: Tradução direta da duração; “durante” torna explícita em português uma relação temporal já clara no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico sem substituí-lo por um título nem adotar outra forma tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção concisa conserva o andamento narrativo, enquanto “território” comunica o sentido geográfico contextual.
