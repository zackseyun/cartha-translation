  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: pt
  text: e ratos de ouro, em número igual ao de todas as cidades dos filisteus sob os cinco governantes, desde a cidade fortificada até o povoado sem muralhas, e até a grande pedra[a] sobre a qual colocaram a arca de Yahweh. Ela permanece até hoje no campo de Josué, de Bete-Semes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico massorético diz literalmente “Grande Abel”, possivelmente como nome de lugar. “A grande pedra” segue uma leitura contextual, apoiada pela menção da pedra nos versículos 14–15.
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: ratos de ouro
  rationale: עַכְבָּר pode designar rato ou camundongo. “Ratos” é a forma tradicional e abrangente em português, enquanto “de ouro” reproduz naturalmente a construção hebraica.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: em número igual ao de todas as cidades dos filisteus
  rationale: A expressão indica correspondência numérica. Esta formulação conserva o sentido e soa mais natural em português do que uma reprodução rígida de “segundo o número”.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: sob os cinco governantes
  rationale: סְרָנִים é o título característico dos principais dirigentes filisteus. “Governantes” é claro e evita associações feudais de “senhores”; “sob” expressa a relação das cidades com eles.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: desde a cidade fortificada até o povoado sem muralhas
  rationale: A frase abrange assentamentos de todos os tipos e preserva o contraste entre o lugar fortificado e o povoado aberto.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: e até a grande pedra[a]
  rationale: Embora o texto consonantal massorético aponte para o topônimo “Grande Abel”, o contexto imediato e a pedra mencionada nos versículos 14–15 favorecem a leitura contextual “a grande pedra”. A leitura formal do hebraico é preservada em nota.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: sobre a qual colocaram a arca de Yahweh
  rationale: הִנִּיחוּ descreve o ato de pôr ou deixar algo repousar; “colocaram” é claro, natural e adequado ao contexto narrativo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Ela permanece até hoje
  rationale: O idioma hebraico assinala a permanência da pedra até a época do narrador. A oração independente torna explícita em português a referência à pedra.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: no campo de Josué, natural de Bete-Semes
  rationale: A forma gentílica identifica Josué como homem de Bete-Semes. “Natural de Bete-Semes” comunica isso com mais clareza ao leitor comum do que um gentílico raro.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura coordenada com “e” foi mantida porque o versículo continua a enumeração do versículo anterior. Usou-se “Bete-Semes”, forma portuguesa corrente do topônimo.
