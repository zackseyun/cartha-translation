reference: 1 Samuel 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: pt
  text: Então, peguem a arca de Yahweh e coloquem-na na carroça. Ponham os objetos de ouro[a] que vocês estão devolvendo a ele como oferta pela culpa numa caixa[b], ao lado da arca. Depois, mandem-na embora e deixem que siga seu caminho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “utensílios de ouro” ou “artigos de ouro”. O termo hebraico é amplo e pode designar vários tipos de objetos ou recipientes.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “num cofre” ou “num baú”.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, “e ela irá”. No contexto, a expressão funciona como a etapa final da instrução: enviem a arca e deixem que ela siga seu caminho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: אֲרוֹן designa a arca sagrada, e a construção com o nome divino expressa associação ou posse. Mantém-se Yahweh conforme a política do projeto para o nome divino.
- source_word: הָעֲגָלָה
  choice: a carroça
  rationale: עֲגָלָה designa uma carroça ou veículo semelhante; “carroça” é claro e natural no contexto narrativo.
- source_word: כְּלֵי הַזָּהָב
  choice: os objetos de ouro
  rationale: כְּלִי é um termo amplo para objeto, utensílio ou recipiente. “Objetos” evita especificar indevidamente a forma dos itens.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: que vocês estão devolvendo a ele
  rationale: O hifil de שׁוב significa devolver ou mandar de volta. A forma progressiva combina com as instruções ainda em execução, e “a ele” preserva o pronome referente a Yahweh.
- source_word: אָשָׁם
  choice: como oferta pela culpa
  rationale: אָשָׁם é o termo cultual para uma oferta ligada à culpa ou reparação. A expressão preserva essa ligação sem impor uma interpretação doutrinária adicional.
- source_word: בָאַרְגַּז
  choice: numa caixa
  rationale: אַרְגָּז designa uma caixa, arca pequena ou cofre. “Caixa” é a opção moderna mais ampla e acessível.
- source_word: מִצִּדּוֹ
  choice: ao lado da arca
  rationale: O sufixo masculino singular retoma mais naturalmente a arca, também masculina em hebraico. A explicitação evita uma referência pronominal confusa em português.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: mandem-na embora
  rationale: שׁלח aqui significa enviar, despachar ou deixar partir. O pronome masculino hebraico retoma mais naturalmente a arca; em português, usa-se o feminino exigido por “arca”.
- source_word: וְהָלָךְ
  choice: e deixem que siga seu caminho
  rationale: A forma significa literalmente “e irá”, mas, após a ordem de enviar, funciona naturalmente como a etapa final da instrução. A formulação portuguesa preserva o movimento sem soar mecânica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio apresentado no texto hebraico e segue a política de termos contestados fornecida para o projeto.
- issue: Sentido cultual de אָשָׁם em contexto filisteu
  choice: oferta pela culpa
  alternative: oferta de reparação; oferta compensatória
  rationale: Embora os falantes sejam filisteus, o narrador hebraico emprega vocabulário sacrificial israelita. A tradução mantém essa conexão lexical e a tensão entre culpa e reparação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais no plural dirigidas aos ouvintes. Evitou-se linguagem arcaica. As referências pronominais foram esclarecidas apenas onde o gênero gramatical diferente entre hebraico e português poderia causar confusão.
