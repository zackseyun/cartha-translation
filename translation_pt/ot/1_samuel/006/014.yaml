source:
  edition: WLC
  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: pt
  text: A carroça entrou no campo de Josué, o betesemita[a], e parou ali[b]. Havia naquele lugar uma grande pedra. Então racharam a madeira da carroça e ofereceram as vacas como holocausto a Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no campo de Josué, de Bete-Semes”. O hebraico identifica Josué por sua ligação com Bete-Semes.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ficou de pé ali”. Referindo-se à carroça, o verbo indica que ela parou.'
    reason: lexical_alternative
  - marker: c
    text: Muitas traduções representam o nome divino יהוה por “SENHOR”.
    reason: translation_tradition
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: a carroça
  rationale: No contexto, designa o veículo que transportava a arca. “Carroça” é uma forma corrente e clara em português.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: o campo de Josué, o betesemita
  rationale: A expressão identifica Josué por sua ligação com Bete-Semes. O gentílico “betesemita” conserva de modo conciso a forma hebraica.
- source_word: וַתַּעֲמֹד שָׁם
  choice: e parou ali
  rationale: Embora עמד signifique literalmente “ficar de pé”, aplicado a uma carroça em movimento indica de modo idiomático que ela parou.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: Havia naquele lugar uma grande pedra
  rationale: Mantém tanto a localização quanto a presença da pedra, evitando uma repetição pouco natural de “ali” em português.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: partiram a madeira da carroça
  rationale: בקע comunica partir ou rachar; a formulação indica que a madeira do veículo foi dividida para ser usada no sacrifício, sem acrescentar detalhes ausentes do texto.
- source_word: הַפָּרוֹת
  choice: as vacas
  rationale: O termo designa bovinos fêmeas. “Vacas” é mais exato neste contexto do que “novilhas”, pois o relato anterior informa que tinham crias.
- source_word: הֶעֱלוּ עֹלָה
  choice: ofereceram ... como holocausto
  rationale: A construção pertence à linguagem sacrificial e descreve a oferta integralmente queimada.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, distinguindo-o do título “Senhor”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva sua função como nome próprio; a tradição de substituí-lo por “SENHOR” é registrada em nota sem ocultar a leitura do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe narrativa foi mantida direta; termos sacrificiais tradicionais, como “holocausto”, foram preservados por sua precisão e ampla compreensão bíblica.
