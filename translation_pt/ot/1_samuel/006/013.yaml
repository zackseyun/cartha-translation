  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: pt
  text: Os habitantes de Bete-Semes estavam colhendo o trigo no vale. Quando levantaram os olhos[a] e viram a arca, alegraram-se ao vê-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica que significa que olharam para cima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Os habitantes de Bete-Semes
  rationale: O topônimo funciona metonimicamente como sujeito de verbos no plural; “os habitantes” explicita o referente humano sem especificar gênero. A forma portuguesa tradicional e transparente do nome é “Bete-Semes”.
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: estavam colhendo o trigo
  rationale: O particípio plural apresenta uma ação em curso ao fundo da narrativa. Em português, “colhendo o trigo” é mais natural do que a repetição etimológica “colhendo a colheita do trigo”.
- source_word: בָּעֵמֶק
  choice: no vale
  rationale: עֵמֶק designa um vale ou terreno baixo; “vale” é a equivalência direta e natural neste contexto.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: levantaram os olhos
  rationale: Mantém a imagem do idioma hebraico de erguer os olhos, ao mesmo tempo que soa natural em português.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: viram a arca
  rationale: A referência definida é à arca já conhecida no contexto de 1 Samuel 4–6; “a arca” é suficiente e evita inserir uma especificação ausente neste versículo.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: alegraram-se ao vê-la
  rationale: O infinitivo indica a ocasião ou causa da alegria. O pronome feminino retoma naturalmente “a arca”, cujo objeto está implícito no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A construção foi dividida em duas frases para evitar uma longa sequência de coordenações. “Quando” torna natural em português a progressão narrativa dos wayyiqtol sem introduzir uma ideia temporal estranha ao contexto. A nota preserva a percepção do idioma hebraico associado a “levantaram os olhos”.
