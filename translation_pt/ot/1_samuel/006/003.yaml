  source_fidelity: 'A tradução preserva os elementos centrais do hebraico: o envio/devolução da arca, a proibição de enviá-la vazia, a ênfase de הָשֵׁב תָּשִׁיבוּ, a oferta אָשָׁם, a cura e a metáfora da mão divina. “A ele” mantém adequadamente o referente pessoal mais provável de לוֹ, sem introduzir interpretação doutrinária.'
