source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: pt
  text: 'Eles disseram: “Se vocês vão mandar de volta a arca do Deus de Israel, não a mandem vazia, pois devem, sem falta, devolver a ele uma oferta pela culpa[a]. Então vocês serão curados, e ficará claro para vocês por que a mão dele[b] não se afasta de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma oferta de reparação”; tradicionalmente, “uma oferta pela transgressão”.
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “a mão dele”, imagem comum do poder de Deus atuando em juízo.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: vão mandar de volta / não a mandem
  rationale: Neste contexto, שׁלח descreve a devolução da arca pelos filisteus. “Mandar de volta” explicita esse movimento na primeira ocorrência; a forma abreviada na segunda evita repetição pesada sem perder o sentido.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: a arca do Deus de Israel
  rationale: Reproduz diretamente a relação genitiva e não introduz “da aliança”, expressão ausente no hebraico deste versículo.
- source_word: רֵיקָם
  choice: vazia
  rationale: 'Mantém a imagem concreta do hebraico: a arca não deveria ser enviada sem uma oferta reparadora que a acompanhasse.'
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: devem, sem falta, devolver
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a obrigação. “Sem falta” comunica essa ênfase em português corrente.
- source_word: לּוֹ
  choice: a ele
  rationale: O sufixo masculino singular refere-se mais naturalmente ao Deus de Israel, embora gramaticalmente também possa ser relacionado à arca; a formulação conserva a referência pessoal favorecida pelo contexto sacrificial.
- source_word: אָשָׁם
  choice: oferta pela culpa
  rationale: אָשָׁם designa uma oferta ligada à culpa e à reparação. “Oferta pela culpa” é clara e reconhecível, enquanto a nota registra a nuance reparadora.
- source_word: תֵּרָפְאוּ
  choice: vocês serão curados
  rationale: Preserva a voz passiva do nifal e se ajusta ao contexto da aflição sofrida pelos filisteus.
- source_word: וְנוֹדַע לָכֶם
  choice: e ficará claro para vocês
  rationale: Expressa de modo natural o sentido passivo ou impessoal, “será conhecido por vocês”, sem transformar a frase numa afirmação excessivamente ativa.
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: por que a mão dele não se afasta de vocês
  rationale: Preserva a metáfora hebraica da “mão” e usa um presente aspectualmente aberto para não resolver em excesso o valor temporal do imperfeito תָסוּר.
theological_decisions:
- issue: Referente do pronome em לּוֹ
  choice: A oferta é devolvida “a ele”, isto é, ao Deus de Israel.
  alternative: A oferta é devolvida “a ela”, isto é, junto com a arca.
  rationale: A menção imediatamente anterior ao Deus de Israel e o caráter de אָשָׁם favorecem o referente divino pessoal. A alternativa permanece gramaticalmente possível, mas é menos provável no contexto.
- issue: Sentido de “a mão dele”
  choice: A metáfora da mão divina como poder atuante em juízo é preservada literalmente.
  alternative: Explicitar como “o castigo dele” ou “a praga enviada por ele”.
  rationale: A imagem é recorrente e teologicamente significativa no texto hebraico. Preservá-la evita restringir seu alcance a uma única manifestação do juízo.
- issue: Valor temporal de לֹא תָסוּר
  choice: “não se afasta”, formulação aberta que pode descrever a persistência da mão divina.
  alternative: “não se afastou” ou “não se afastará”.
  rationale: O imperfeito hebraico admite leitura durativa ou prospectiva no contexto. O presente em português conserva melhor essa abertura do que uma escolha rigidamente passada ou futura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A sintaxe mantém a solenidade da fala sacerdotal sem arcaísmos. Os marcadores foram posicionados junto aos termos efetivamente explicados pelas notas.
