  terminology: “Arca do Deus de Israel” reproduz a designação do texto sem acrescentar “da aliança”. “Oferta pela culpa” é uma tradução estabelecida e inteligível de אָשָׁם; a nota oferece apropriadamente a alternativa reparadora. A nota sobre “a mão dele” explica a imagem sem substituí-la no texto.
