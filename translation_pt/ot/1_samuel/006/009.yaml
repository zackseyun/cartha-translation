  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: pt
  text: 'Observem: se subir pelo caminho do seu território até Bete-Semes, foi ele quem nos causou esta grande calamidade[a]. Mas, se não, saberemos que não foi a mão dele que nos atingiu; isso nos aconteceu por acaso[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este grande dano”, “esta grande desgraça” ou “este grande mal”. A palavra hebraica pode indicar dano grave ou calamidade, não necessariamente maldade moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi um acontecimento fortuito para nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Observem
  rationale: O imperativo plural introduz a observação pela qual os filisteus pretendem testar a causa da calamidade. “Observem” é natural e mantém a ideia de olhar atentamente o percurso.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: pelo caminho do seu território
  rationale: Preserva a construção hebraica, que pode indicar o caminho pertencente ao território ou que conduz a ele, sem especificar além do que o texto permite.
- source_word: יַעֲלֶה
  choice: subir
  rationale: Mantém o sentido comum de עלה e é adequado ao deslocamento em direção a Bete-Semes. O sujeito fica implícito, como é natural em português, evitando impor o gênero da carroça ou da arca.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: Transliteração tradicional e legível em português do nome geográfico hebraico.
- source_word: הוּא עָשָׂה לָנוּ
  choice: foi ele quem nos causou
  rationale: A construção clivada preserva a ênfase do pronome independente הוּא, identificando o agente em contraste com o acaso.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: esta grande calamidade
  rationale: רָעָה, neste contexto, designa dano, desgraça ou calamidade sofrida, sem necessariamente expressar maldade moral. “Calamidade” comunica com clareza a gravidade do acontecimento.
- source_word: וְאִם לֹא
  choice: Mas, se não
  rationale: Expressa naturalmente o resultado alternativo do teste e conserva o contraste do hebraico.
- source_word: וְיָדַעְנוּ
  choice: saberemos
  rationale: O futuro em português transmite a conclusão a que chegarão depois de observar o percurso.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: a mão dele que nos atingiu
  rationale: Mantém a imagem da “mão” como poder atuante e traduz נגע de modo suficientemente forte para o contexto de aflição.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: isso nos aconteceu por acaso
  rationale: Forma corrente em português para a afirmação de que o ocorrido teria sido fortuito, preservando o contraste teológico entre ação divina e acaso.
theological_decisions:
- issue: Sentido de רָעָה quando a calamidade é atribuída à ação divina
  choice: esta grande calamidade
  alternative: este grande mal; este grande dano; esta grande desgraça
  rationale: “Calamidade” preserva a severidade do juízo sem transformar רָעָה, neste contexto, numa afirmação de maldade moral por parte de Deus.
- issue: Contraste entre ação divina e acaso
  choice: foi ele quem nos causou... não foi a mão dele... por acaso
  alternative: ele fez... sua mão não nos tocou... foi um acontecimento fortuito
  rationale: 'A redação mantém sem resolver o raciocínio dos filisteus: o percurso serviria, na perspectiva deles, para distinguir a ação do Deus de Israel de uma ocorrência casual.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O sujeito de “subir” foi deixado implícito para soar natural e não forçar em português a identificação gramatical entre a carroça e a arca. Os marcadores de nota foram posicionados junto às expressões que explicam.
