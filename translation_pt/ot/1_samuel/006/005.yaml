review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a instrução de fazer imagens, a atribuição de glória ao Deus de Israel e a possibilidade expressa por אולי. Contudo, «ratos» é menos preciso que o referente mais usual de עכבר neste versículo («camundongos»), e «alivie o peso da sua mão sobre» torna menos explícito que o hebraico diz que a mão seja aliviada/retirada de sobre os três referentes.
  naturalness: O português é claro e de registro apropriado. «Talvez ele torne mais leve a sua mão, que pesa sobre...» é natural e conserva melhor a imagem e a sintaxe do original.
  terminology: «Tumores» é uma escolha prudentemente ampla para עפלים, com nota apropriada para «hemorroidas». «Camundongos» corresponde melhor à escolha lexical de base («mice»), sem excluir que o termo hebraico possa ter alcance mais amplo.
  issues:
  - severity: medium
    issue: O termo עכבר é vertido por «ratos».
    rationale: Embora possa haver sobreposição semântica entre roedores em usos antigos, a opção de base e mais direta neste contexto é «camundongos»; «ratos» introduz uma especificação diferente sem necessidade.
  - severity: medium
    issue: A formulação «alivie o peso da sua mão sobre vocês» não traduz com plena nitidez a preposição repetida מֵעַל («de sobre») nem a ação de tornar leve a mão.
    rationale: O hebraico pede que a mão se torne mais leve de sobre eles, seus deuses e sua terra. Uma oração relativa com «que pesa sobre» mantém em português a imagem da mão e o paralelismo sem sugerir apenas alívio enquanto ela permanece sobre os objetos.
  - severity: low
    issue: A chamada da nota lexical está após «terra», embora a nota explique «tumores».
    rationale: A âncora deve seguir imediatamente o termo anotado, para que o leitor identifique sem ambiguidade o seu referente.
