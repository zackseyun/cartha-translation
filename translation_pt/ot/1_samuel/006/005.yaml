  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: pt
  text: Portanto, façam imagens dos seus tumores[a] e imagens dos seus camundongos, que estão devastando a terra, e deem glória ao Deus de Israel. Talvez ele torne mais leve a sua mão, que pesa sobre vocês, sobre os seus deuses e sobre a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas hemorroidas”. O termo hebraico se refere a inchaços ou tumores no corpo; a tradução tradicional mais específica é possível, mas não é certa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Portanto, façam
  rationale: O wayyiqtol qal na segunda pessoa masculina plural funciona aqui como instrução decorrente do conselho anterior. “Portanto, façam” expressa com naturalidade essa relação consequencial.
- source_word: צַלְמֵי
  choice: imagens
  rationale: O termo צלם designa uma imagem ou representação; “imagens” comunica de modo direto que se trata de réplicas confeccionadas.
- source_word: עפליכם
  choice: seus tumores
  rationale: O termo indica inchaços ou tumores corporais, mas sua localização e natureza exatas são incertas. “Tumores” mantém a amplitude do hebraico, enquanto a leitura tradicional mais específica é registrada em nota.
- source_word: וְצַלְמֵי עַכְבְּרֵיכֶם
  choice: e imagens dos ratos
  rationale: עכבר pode designar camundongos ou ratos de modo mais amplo. “Ratos” é corrente e natural em português neste contexto de animais que devastam a terra.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: que estão devastando a terra
  rationale: O particípio expressa uma ação destrutiva em curso. A locução “estão devastando” preserva esse aspecto e a intensidade do verbo.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: e deem glória
  rationale: A expressão significa reconhecer e prestar honra ao Deus de Israel. “Dar glória” preserva a formulação bíblica e seu peso teológico.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ao Deus de Israel
  rationale: Tradução direta da construção hebraica, com referência definida pelo contexto.
- source_word: אוּלַי
  choice: Talvez
  rationale: Expressa possibilidade ou esperança sem afirmar que o resultado ocorrerá.
- source_word: יָקֵל אֶת יָדוֹ
  choice: ele alivie o peso da sua mão
  rationale: O hifil de קלל significa tornar mais leve. A formulação explicita em português a metáfora do peso sem substituir a imagem hebraica da mão divina.
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: sobre vocês, sobre os seus deuses e sobre a sua terra
  rationale: A repetição de “sobre” preserva o paralelismo e a imagem da mão pesada que repousa sobre os três objetos da aflição.
theological_decisions:
- issue: Natureza da aflição indicada por עפלים
  choice: tumores
  alternative: hemorroidas; inchaços
  rationale: O hebraico não exige uma identificação anatômica precisa. “Tumores” preserva a referência geral a inchaços corporais; “hemorroidas”, embora tradicional e possível, é interpretativamente mais específica e por isso aparece em nota.
- issue: Metáfora antropomórfica da mão divina
  choice: alivie o peso da sua mão
  alternative: retire seu poder; alivie seu castigo
  rationale: A tradução conserva a imagem da mão de Deus como expressão de sua ação poderosa e aflitiva. Acrescentar “o peso” torna natural em português o sentido de tornar leve, sem reduzir a metáfora a uma explicação abstrata.
- issue: A mão de Deus também sobre os deuses filisteus
  choice: sobre os seus deuses
  alternative: contra os seus deuses
  rationale: O texto inclui explicitamente os deuses filisteus entre aqueles sobre os quais pesa a mão do Deus de Israel. A tradução mantém essa afirmação sem explicar de que modo divindades estrangeiras seriam afetadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Deem” segue a ortografia vigente. A construção “alivie o peso da sua mão” mantém a metáfora hebraica de maneira idiomática; a repetição de “sobre” conserva o ritmo retórico do original.
