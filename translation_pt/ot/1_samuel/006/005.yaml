- from: Portanto, façam imagens dos seus tumores e imagens dos ratos que estão devastando a terra[a] e deem glória ao Deus de Israel. Talvez ele alivie o peso da sua mão sobre vocês, sobre os seus deuses e sobre a sua terra.
  to: Portanto, façam imagens dos seus tumores[a] e imagens dos seus camundongos, que estão devastando a terra, e deem glória ao Deus de Israel. Talvez ele torne mais leve a sua mão, que pesa sobre vocês, sobre os seus deuses e sobre a sua terra.
  rationale: A revisão usa «camundongos» para o sentido mais direto de עכבר e reformula a última oração para preservar tanto a metáfora da mão divina quanto o movimento «de sobre» os filisteus, seus deuses e sua terra. A nota é mantida, mas sua chamada é deslocada para junto de «tumores», o termo que ela esclarece.
