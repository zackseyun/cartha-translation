  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: pt
  text: 'Os homens fizeram assim: pegaram duas vacas que amamentavam[a], atrelaram-nas à carroça e mantiveram seus bezerros[b] presos dentro de casa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “duas vacas em lactação”. O hebraico descreve vacas que ainda davam leite e tinham bezerros.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seus filhos”; tratando-se de vacas, isto é, seus bezerros.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: fizeram assim
  rationale: Expressão hebraica concisa que indica que eles seguiram as instruções dadas; a formulação é natural e preserva o ritmo narrativo.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O substantivo se refere aos homens que executaram a ação no contexto, sem necessidade de generalizá-lo como “as pessoas”.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: duas vacas que amamentavam
  rationale: עָלוֹת descreve vacas em lactação, com bezerros dependentes. A expressão explicita esse dado relevante para a narrativa em português corrente.
- source_word: וַיַּאַסְרוּם בָּעֲגָלָה
  choice: atrelaram-nas à carroça
  rationale: Embora אסר tenha o sentido básico de prender ou amarrar, aqui designa a ligação dos animais ao veículo; “atrelar” é o termo funcional preciso. עֲגָלָה é vertido por “carroça”.
- source_word: וְאֶת בְּנֵיהֶם
  choice: seus bezerros
  rationale: בָּנִים significa literalmente “filhos”, mas, tendo vacas como referente, designa naturalmente os bezerros.
- source_word: כָּלוּ בַבָּיִת
  choice: mantiveram ... presos dentro de casa
  rationale: Nesse contexto, o verbo transmite a ideia de reter ou confinar. “Dentro de casa” conserva o sentido direto de בַּבָּיִת sem substituí-lo por uma identificação conjectural como “curral” ou “estábulo”.
theological_decisions: []
