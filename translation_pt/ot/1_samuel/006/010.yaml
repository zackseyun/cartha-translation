  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe narrativa permanece concisa; “atrelaram-nas” mantém precisão formal sem recorrer a linguagem arcaica, e as notas preservam os aspectos lexicais concretos do hebraico.
