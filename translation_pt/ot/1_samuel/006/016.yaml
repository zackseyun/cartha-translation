  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: pt
  text: Quando os cinco governantes dos filisteus viram isso, voltaram para Ecrom naquele mesmo dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה סַרְנֵי פְלִשְׁתִּים
  choice: os cinco governantes dos filisteus
  rationale: O numeral definido identifica o grupo já conhecido no contexto. סֶרֶן é o título dos governantes das cidades filisteias; “governantes” comunica sua autoridade política em português atual sem o tom feudal ou arcaizante de “senhores”.
- source_word: רָאוּ
  choice: viram isso
  rationale: O hebraico diz literalmente “viram”, sem objeto expresso. Em português, “isso” retoma naturalmente os acontecimentos imediatamente anteriores e evita uma construção truncada.
- source_word: וַ/יָּשֻׁבוּ
  choice: voltaram
  rationale: O wayyiqtol de שׁוב dá continuidade à sequência narrativa; “voltaram” é conciso e natural.
- source_word: עֶקְרוֹן
  choice: para Ecrom
  rationale: O destino aparece em hebraico sem preposição, construção possível com verbo de movimento; o português requer “para”. O topônimo segue a forma portuguesa tradicional “Ecrom”.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: naquele mesmo dia
  rationale: A expressão significa literalmente “naquele dia”; o acréscimo idiomático de “mesmo” realça, sem alterar o sentido, que o retorno ocorreu ainda naquele dia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. Não se acrescentaram notas porque as alternativas “senhores” e “naquele dia” não são necessárias para preservar ambiguidade relevante neste versículo.
