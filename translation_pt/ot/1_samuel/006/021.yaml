  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: pt
  text: 'Então enviaram mensageiros aos habitantes de Quiriate-Jearim, dizendo: “Os filisteus devolveram a arca de Yahweh. Desçam e levem-na para vocês.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Desçam e façam-na subir até vocês”. Os verbos hebraicos indicam movimento para baixo e para cima, provavelmente em referência ao relevo entre Bete-Semes e Quiriate-Jearim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Então enviaram
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O contexto é de comunicação humana; “anjos” seria inadequado.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: aos habitantes de Quiriate-Jearim
  rationale: Reproduz com clareza o particípio substantivado em construção e translitera o topônimo de forma corrente em português.
- source_word: הֵשִׁבוּ פְלִשְׁתִּים
  choice: Os filisteus devolveram
  rationale: O hifil de שוב indica fazer retornar, isto é, devolver; o pretérito perfeito é natural no discurso relatado.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Mantém diretamente a relação de posse e representa o nome divino יהוה como Yahweh.
- source_word: רְדוּ
  choice: Desçam
  rationale: Preserva o imperativo plural e o verbo topográfico ירד sem decidir entre “venham” e “vão”, distinção não explicitada na forma hebraica.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: levem-na para a cidade de vocês
  rationale: Comunica o movimento ascendente rumo aos destinatários de modo natural; a nota registra a forma topográfica mais literal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio segundo a política indicada e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Levem-na para a cidade de vocês” evita o pouco natural “façam-na subir até vocês”, enquanto a nota preserva a imagem topográfica do hebraico.
