  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: pt
  text: E ele feriu alguns dos homens de Bete-Semes, porque tinham olhado para dentro da arca de Yahweh.[a] Feriu, entre o povo, setenta homens, cinquenta mil homens;[b] e o povo ficou de luto, porque Yahweh havia ferido o povo com um grande golpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «porque tinham olhado para a arca de Yahweh». A preposição hebraica pode ter sentido mais geral, embora «olhado para dentro» provavelmente expresse a transgressão neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz: «setenta homens, cinquenta mil homens», uma formulação difícil. Pode significar «setenta homens dentre cinquenta mil», «cinquenta mil e setenta homens» ou refletir um problema textual; alguns testemunhos antigos apoiam um número muito menor.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: feriu
  rationale: Mantém o verbo recorrente נכה e sua ligação com מַכָּה no fim do versículo. O contexto e o número de atingidos deixam claro o resultado mortal sem exigir a explicitação «matou».
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: alguns dos homens de Bete-Semes
  rationale: Expressa naturalmente em português o provável sentido partitivo da preposição בְּ e preserva o substantivo masculino אַנְשֵׁי.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: porque tinham olhado para dentro da arca de Yahweh
  rationale: No contexto, ראה com ב pode indicar olhar para dentro; essa leitura explica melhor a transgressão, enquanto a alternativa mais geral é registrada em nota.
- source_word: אֲרוֹן יְהוָה
  choice: arca de Yahweh
  rationale: Reproduz a relação construta e mantém o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: setenta homens, cinquenta mil homens
  rationale: Preserva de modo transparente a difícil sequência numérica do Texto Massorético, sem escolher silenciosamente entre interpretações concorrentes.
- source_word: בָּעָם
  choice: entre o povo
  rationale: É a forma idiomática de indicar que os homens atingidos pertenciam ao conjunto do povo.
- source_word: וַיִּתְאַבְּלוּ
  choice: ficou de luto
  rationale: Comunica naturalmente o sentido reflexivo/coletivo de entrar em luto após mortes ou calamidade.
- source_word: מַכָּה גְדוֹלָה
  choice: um grande golpe
  rationale: Preserva a amplitude lexical de מַכָּה e a ligação verbal com «feriu», sem especificar indevidamente peste ou massacre.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal e não o substitui por um título.
- issue: A difícil cifra de mortos no Texto Massorético
  choice: Manter no texto «setenta homens, cinquenta mil homens» e explicar as possibilidades em nota
  alternative: setenta homens dentre cinquenta mil; cinquenta mil e setenta homens; um total menor conforme alguns testemunhos antigos
  rationale: A formulação hebraica e a evidência textual são difíceis. A tradução não resolve silenciosamente uma tensão que permanece genuína.
- issue: Natureza da transgressão diante da arca
  choice: olhado para dentro da arca
  alternative: olhado para a arca
  rationale: A primeira opção é plausível e se ajusta ao contexto da infração, mas a preposição hebraica também admite a leitura mais geral, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com grafia brasileira de «Bete-Semes». A sintaxe conserva deliberadamente a estranheza da cifra hebraica, esclarecida por nota, e evita vocabulário excessivamente arcaico.
