base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: pt
  text: Por que, então, vocês endurecem o coração[a], como o Egito e o faraó endureceram o coração? Não foi quando ele os tratou duramente que eles os deixaram ir[b], e eles partiram?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornam pesado o coração”, como fizeram o Egito e o faraó. No hebraico, “tornar pesado o coração” é uma expressão que significa endurecê-lo.'
    reason: lexical_alternative
  - marker: b
    text: Em “ele os tratou duramente”, “os” se refere ao Egito e ao faraó; em “eles os deixaram ir”, o primeiro pronome se refere ao Egito e ao faraó, e o segundo, aos israelitas.
    reason: referent_clarification
lexical_decisions:
- source_word: תְכַבְּדוּ ... לְבַבְכֶם
  choice: vocês endurecem o coração
  rationale: O piel de כבד com “coração” forma a expressão idiomática “tornar pesado”, isto é, endurecer a disposição interior. O singular coletivo “o coração” é natural em português com o pronome plural “vocês”.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: o Egito e o faraó
  rationale: Mantém o topônimo usado coletivamente no hebraico e dá ao título a forma natural em português.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: ele os tratou duramente
  rationale: Comunica o tratamento severo e punitivo no contexto do êxodo sem especificar além do texto a maneira desse tratamento.
- source_word: וַיְשַׁלְּחוּם
  choice: eles os deixaram ir
  rationale: No contexto, שלח descreve a libertação de Israel pelo Egito e pelo faraó; “deixaram ir” é claro e idiomático em português.
- source_word: וַיֵּלֵכוּ
  choice: eles partiram
  rationale: Preserva a sequência breve do hebraico e expressa naturalmente que os israelitas foram embora.
theological_decisions:
- issue: Sujeito implícito de הִתְעַלֵּל
  choice: “ele”, entendido contextualmente como Deus, sem nomeá-lo no corpo do versículo
  alternative: Explicitar “Deus” ou empregar uma construção impessoal
  rationale: O contexto remete às ações de Deus contra o Egito, mas o hebraico deixa o sujeito sem nome explícito. O pronome preserva essa relativa abertura.
- issue: Referentes dos pronomes em הִתְעַלֵּל בָּהֶם e וַיְשַׁלְּחוּם
  choice: Manter “os” em ambos os casos e esclarecer a mudança de referente em nota
  alternative: Substituir os pronomes por “os egípcios” e “os israelitas” no texto principal
  rationale: A nota evita a ambiguidade confusa para o leitor sem eliminar do texto principal a concisão pronominal do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa do plural. A formulação conserva a pergunta retórica e a mudança de referentes pronominais do hebraico, esclarecida em nota.
