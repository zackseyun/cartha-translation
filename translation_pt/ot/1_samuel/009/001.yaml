base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: pt
  text: Havia um homem de Benjamim, chamado Quis, filho de Abiel, filho de Zeror, filho de Becorate, filho de Afia, filho de um benjamita, homem poderoso e influente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guerreiro valente”, “homem de grande prestígio” ou “homem rico e influente”. A expressão hebraica pode indicar força militar, posição social ou recursos econômicos, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Havia
  rationale: Introduz uma nova unidade narrativa de modo natural em português, sem acrescentar um advérbio temporal ausente do hebraico.
- source_word: אִישׁ מִבֶּן־יָמִין
  choice: um homem de Benjamim
  rationale: Identifica um indivíduo do povo ou da tribo de Benjamim, preservando a formulação concisa do hebraico.
- source_word: וּשְׁמוֹ
  choice: chamado
  rationale: Expressa naturalmente em português a fórmula hebraica de apresentação do nome, sem perda de conteúdo.
- source_word: קִישׁ / אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: Quis / Abiel / Zeror / Becorate / Afia
  rationale: Emprega formas portuguesas tradicionais ou transliterações transparentes dos nomes próprios hebraicos.
- source_word: בֶּן ... בֶּן ...
  choice: filho de
  rationale: Mantém a repetição e a forma genealógica do texto hebraico; embora בֶּן possa designar um descendente mais remoto, não é necessário resolver isso no texto principal.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: filho de um benjamita
  rationale: Preserva a conclusão da genealogia e explicita de maneira idiomática a identidade tribal indicada por יְמִינִי.
- source_word: גִּבּוֹר חָיִל
  choice: homem poderoso e influente
  rationale: A expressão pode envolver poder, capacidade, destaque social, riqueza ou valor militar. Esta formulação funciona no contexto da apresentação da família de Saul sem restringir o sentido exclusivamente à guerra.
theological_decisions:
- issue: Alcance semântico de גִּבּוֹר חָיִל
  choice: homem poderoso e influente
  alternative: guerreiro valente; homem de grande prestígio; homem rico e influente
  rationale: O contexto imediato não exige que Quis seja retratado especificamente como guerreiro. A tradução mantém abertas as dimensões social, econômica e militar da expressão, e a nota registra as principais possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadeia genealógica repetitiva foi mantida para refletir a estrutura hebraica. O marcador da nota foi colocado após a expressão a que efetivamente se refere.
