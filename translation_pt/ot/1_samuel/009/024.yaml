base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: pt
  text: 'Então o cozinheiro pegou a perna[a] e o que estava sobre ela[b] e a colocou diante de Saul. Então ele disse: “Veja, o que foi guardado[c] está diante de você. Coma, pois isso foi guardado para você até esta ocasião, quando eu disse: ‘Convidei[d] o povo’”. E, naquele dia, Saul comeu com Samuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a coxa”; o hebraico שׁוֹק se refere à porção da perna do animal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a perna e o que estava sobre ela”. O texto não identifica de modo explícito a porção acompanhante.
    reason: lexical_alternative
  - marker: c
    text: Ou “o que restou”. O hebraico pode indicar tanto o que sobrou como o que foi reservado; o contexto favorece uma porção especialmente guardada para Saul.
    reason: alternative_reading
  - marker: d
    text: Ou “Chamei o povo”. No contexto desta refeição, “convidei” expressa melhor o sentido provável do verbo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: o cozinheiro
  rationale: No contexto da refeição sacrificial, designa quem prepara e serve a carne; “cozinheiro” é mais natural aqui do que “açougueiro”.
- source_word: הַשּׁוֹק
  choice: a perna
  rationale: O termo indica a porção da perna do animal sem especificar com certeza um corte mais preciso.
- source_word: וְהֶעָלֶיהָ
  choice: e o que estava sobre ela
  rationale: Mantém a formulação ampla do hebraico e não identifica indevidamente a porção acompanhante.
- source_word: הַנִּשְׁאָר
  choice: o que foi guardado
  rationale: O particípio pode indicar o que restou ou o que foi conservado; o contexto favorece uma porção separada de propósito para Saul.
- source_word: שִׂים לְפָנֶיךָ
  choice: está diante de você
  rationale: A formulação idiomática evita uma ordem pouco natural para Saul colocar diante de si a porção que o cozinheiro acabara de servir.
- source_word: לַמּוֹעֵד
  choice: para a ocasião marcada
  rationale: Expressa um tempo ou uma ocasião previamente determinados sem transformar o termo em referência técnica a uma festa religiosa.
- source_word: שָׁמוּר לְךָ
  choice: foi guardado para você
  rationale: Conserva o sentido resultativo de uma porção previamente separada para Saul sem tornar explícito mais do que o hebraico diz.
- source_word: הָעָם קָרָאתִי
  choice: Convidei o povo
  rationale: Embora קרא também possa significar “chamar”, o contexto de uma refeição favorece “convidar”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A repetição de “foi guardado” preserva o vínculo lexical do hebraico. “Então ele disse” mantém a referência pronominal do texto sem nomear explicitamente o falante. A construção temporal final permanece deliberadamente compacta para não eliminar a dificuldade sintática do hebraico.
