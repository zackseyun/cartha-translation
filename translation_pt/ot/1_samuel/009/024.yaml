  to: 'Então o cozinheiro pegou a perna[a] e o que estava sobre ela[b] e a colocou diante de Saul. Então ele disse: “Veja, o que foi guardado[c] está diante de você. Coma, pois isso foi guardado para você até esta ocasião, quando eu disse: ‘Convidei[d] o povo’”. E, naquele dia, Saul comeu com Samuel.'
