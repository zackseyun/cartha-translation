lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: aproximou-se de
  rationale: Expressa naturalmente o movimento de Saul em direção a Samuel, preservando o sentido comum de נגשׁ.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: no meio do portão
  rationale: Mantém a concretude de בְּתוֹךְ e reconhece que שַׁעַר pode designar a passagem ou o complexo da entrada da cidade, não apenas uma porta.
- source_word: הַגִּידָה נָּא לִי
  choice: Por favor, diga-me
  rationale: Reproduz o imperativo de נגד e a cortesia comunicada pela partícula נָא em português natural.
- source_word: אֵי זֶה
  choice: onde fica
  rationale: No contexto de um pedido de localização, esta é uma formulação idiomática e clara em português.
- source_word: בֵּית הָרֹאֶה
  choice: a casa do vidente
  rationale: Preserva o termo histórico רֹאֶה e traduz diretamente a construção de estado construto.
