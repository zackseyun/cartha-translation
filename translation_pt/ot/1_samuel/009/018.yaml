  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: pt
  text: 'Então, Saul aproximou-se de Samuel na passagem do portão e disse: “Por favor, diga-me onde fica a casa do vidente[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vidente” é um termo antigo para alguém que, mais tarde, passou a ser mais comumente chamado de “profeta”; o próprio relato explica isso em 1 Samuel 9:9.
