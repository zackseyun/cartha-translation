base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: pt
  text: 'Então Samuel disse ao cozinheiro: “Traga[a] a porção que lhe dei, a respeito da qual lhe disse: ‘Guarde-a consigo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Dê a porção que lhe dei, a respeito da qual lhe disse: ‘Ponha-a junto de você.’”'
    reason: Registra a equivalência mais literal de תְּנָה (“dê”) e de שִׂים אֹתָהּ עִמָּךְ (“ponha-a junto de você”), cuja formulação é menos idiomática em português.
lexical_decisions:
- source_word: טַּבָּח
  choice: cozinheiro
  rationale: No contexto de uma refeição sacrificial, designa o responsável por preparar e servir a carne; “cozinheiro” é natural e adequado, embora o termo também possa indicar quem abate a carne.
- source_word: תְּנָה
  choice: Traga
  rationale: O verbo significa literalmente “dê”, mas aqui Samuel ordena que o cozinheiro apresente a porção previamente reservada; “traga” comunica essa força contextual em português natural.
- source_word: מָּנָה
  choice: porção
  rationale: Refere-se a uma parte de alimento destinada a alguém numa refeição, sentido preservado com precisão por “porção”.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: que lhe dei
  rationale: 'Mantém o sentido simples e retrospectivo do verbo נתן: Samuel havia entregado a porção ao cozinheiro.'
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: aquela sobre a qual eu lhe disse
  rationale: Preserva a segunda oração relativa do hebraico e deixa claro que as palavras seguintes se referem à porção.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: Deixe-a guardada com você
  rationale: Expressa o ato de colocar ou manter a porção consigo, ao mesmo tempo que torna explícita, sem exagero, a ideia contextual de reservá-la.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. A repetição das orações relativas foi mantida para refletir a estrutura do hebraico, enquanto “Traga” e “Deixe-a guardada” transmitem naturalmente a ação no contexto do banquete.
