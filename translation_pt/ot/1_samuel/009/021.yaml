  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: pt
  text: 'Saul respondeu: “Não sou eu benjamita, de entre as menores tribos de Israel? E não é o meu clã o menor de todos os clãs da tribo de Benjamim? Então, por que me disse uma coisa dessas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não sou eu...? / E não é...?
  rationale: A partícula introduz uma pergunta retórica que espera concordância; essa construção é natural em português e preserva a força retórica.
- source_word: בֶן־יְמִינִי
  choice: benjamita
  rationale: O termo identifica Saul como membro da tribo de Benjamim; “benjamita” é a forma portuguesa corrente.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: de uma das menores tribos de Israel
  rationale: O plural construto com a preposição מן favorece a ideia de pertencimento ao grupo das tribos menores, sem afirmar necessariamente que Benjamim era a única menor.
- source_word: וּמִשְׁפַּחְתִּי
  choice: o meu clã
  rationale: Neste contexto, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo, mais ampla que a família nuclear.
- source_word: הַצְּעִרָה
  choice: o menos importante
  rationale: O adjetivo pode indicar pequenez de posição ou importância; esta formulação comunica a modéstia social de Saul sem repetir “menor” de modo mecânico.
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: de todos os clãs da tribo de Benjamim
  rationale: Embora a forma hebraica de “tribos” seja plural, o contexto compara o clã de Saul com os demais clãs pertencentes a Benjamim; o singular em português evita sugerir várias tribos benjamitas.
- source_word: וְלָמָּה
  choice: Então, por que
  rationale: A conjunção liga a alegada insignificância de Saul à sua pergunta conclusiva e tem aqui valor inferencial natural.
- source_word: דִּבַּרְתָּ אֵלַי
  choice: o senhor me falou
  rationale: O pretérito perfeito é idiomático no diálogo, e “o senhor” explicita com respeito o sujeito singular dirigido a Samuel.
- source_word: כַּדָּבָר הַזֶּה
  choice: uma coisa dessas
  rationale: A expressão se refere ao conteúdo surpreendente das palavras de Samuel; esta tradução é natural e conserva a referência ao que foi dito.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A fala preserva a humildade retórica de Saul e a organização social de tribo e clã, evitando tanto literalismo obscuro quanto expansão interpretativa.
