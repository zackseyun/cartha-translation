base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: pt
  text: 'As jumentas de Quis, pai de Saul, tinham se perdido. Então Quis disse a seu filho Saul: “Por favor, leve com você um dos jovens[a], levante-se e vá procurar as jumentas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dos servos” ou “um dos ajudantes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: tinham se perdido
  rationale: O verbo אבד, nesta forma e neste contexto, indica que os animais estavam perdidos, não que haviam morrido. O mais-que-perfeito composto situa naturalmente o fato antes da ordem dada por Quis.
- source_word: הָאֲתֹנוֹת
  choice: as jumentas
  rationale: O substantivo hebraico designa especificamente jumentas, isto é, animais fêmeas; em português, a especificação é natural e não prejudica a leitura.
- source_word: לְקִישׁ
  choice: de Quis
  rationale: O לְ marca aqui posse ou associação. A construção portuguesa concisa expressa adequadamente que os animais pertenciam a Quis.
- source_word: אֲבִי שָׁאוּל
  choice: pai de Saul
  rationale: Tradução direta e idiomática da cadeia construta hebraica.
- source_word: וַיֹּאמֶר
  choice: Então Quis disse
  rationale: A forma narrativa introduz a ação seguinte; “então” expressa em português a progressão do relato sem acrescentar um marcador temporal como “agora”.
- source_word: בְּנוֹ
  choice: a seu filho Saul
  rationale: A formulação portuguesa integra naturalmente a relação filial e o nome, preservando ambos os elementos do hebraico.
- source_word: קַח נָא אִתְּךָ
  choice: Por favor, leve com você
  rationale: נָא atenua a ordem e é bem representado por “por favor”; “com você” preserva אִתְּךָ.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: um dos servos
  rationale: נְעָרִים pode significar jovens, servos ou ajudantes. No contexto doméstico, alguém levado como acompanhante numa busca é naturalmente entendido como servo, mas a alternativa literal é registrada em nota.
- source_word: וְקוּם לֵךְ
  choice: levante-se e vá
  rationale: Preserva os dois imperativos hebraicos e seu impulso de ação imediata em linguagem portuguesa corrente.
- source_word: בַּקֵּשׁ
  choice: procurar
  rationale: בקש significa buscar ou procurar; “procurar” é a expressão corrente e precisa para localizar animais perdidos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos imperativos foi preservada sem reproduzir de modo artificial a justaposição hebraica. A pontuação segue o uso corrente em português.
