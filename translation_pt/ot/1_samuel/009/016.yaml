source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: pt
  text: Amanhã, por volta desta hora, enviarei a você um homem da terra de Benjamim. Você o ungirá como governante[a] sobre o meu povo Israel, e ele salvará o meu povo da mão dos filisteus. Pois vi o meu povo, já que o clamor dele[b] chegou até mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: nāgîd; também pode ser traduzido como “líder” ou, tradicionalmente, “príncipe”. O termo designa alguém nomeado para governar, não uma figura meramente cerimonial.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz um sufixo singular, literalmente “o clamor dele”, em referência ao substantivo coletivo “meu povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: Amanhã, por volta desta hora
  rationale: Expressa de modo natural o ponto temporal aproximado indicado pelo hebraico, sem perder a referência específica ao dia seguinte.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: enviarei a você
  rationale: Mantém explicitamente a direção do envio indicada pela preposição אֶל e é corrente em português.
- source_word: אִישׁ מֵאֶרֶץ בִּנְיָמִן
  choice: um homem da terra de Benjamim
  rationale: Preserva tanto a referência masculina singular quanto o sentido geográfico de אֶרֶץ.
- source_word: וּמְשַׁחְתּוֹ
  choice: Você o ungirá
  rationale: O perfeito com waw, neste contexto de instrução divina, tem valor prospectivo e injuntivo; o futuro comunica ambos de maneira natural.
- source_word: לְנָגִיד
  choice: como governante
  rationale: נָגִיד designa alguém nomeado para exercer autoridade e liderança. “Governante” preserva a função política sem identificá-la automaticamente com o título pleno de rei nem sugerir o sentido dinástico moderno de “príncipe”.
- source_word: וְהוֹשִׁיעַ
  choice: e ele salvará
  rationale: O verbo יָשַׁע denota resgate ou libertação. “Salvará” mantém sua força e a apresenta como resultado da nomeação.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: das mãos dos filisteus
  rationale: Conserva a imagem hebraica da mão como poder ou domínio; o plural é idiomático em português ao referir-se a um povo composto por muitas pessoas.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: Pois vi o meu povo
  rationale: Mantém a formulação direta e a repetição de “meu povo”, deixando intacta a ideia de que Deus tomou conhecimento de sua aflição.
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: porque o clamor dele chegou até mim
  rationale: O pronome singular retoma naturalmente o substantivo coletivo singular “povo” em português e corresponde ao sufixo masculino singular do hebraico.
theological_decisions:
- issue: A função indicada por נָגִיד no início da monarquia de Israel
  choice: governante
  alternative: líder; príncipe
  rationale: “Governante” comunica autoridade conferida por Deus sem antecipar indevidamente terminologia monárquica posterior. “Líder” pode enfraquecer a dimensão governamental, e “príncipe” tem conotações dinásticas modernas ausentes do termo.
- issue: O referente do sufixo singular em צַעֲקָתוֹ
  choice: o clamor dele
  alternative: o seu clamor; o clamor deles
  rationale: O sufixo singular retoma o coletivo “meu povo”. Como “povo” também é singular em português, “dele” preserva a concordância e a forma do hebraico sem prejudicar a compreensão.
- issue: Relação lógica de וְהוֹשִׁיעַ com a unção
  choice: e ele salvará
  alternative: para que ele salve; e que ele salve
  rationale: A forma admite matiz de consequência ou propósito. O futuro coordenado preserva a formulação profética sem excluir que a libertação seja a finalidade da nomeação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se a imagem das “mãos” dos filisteus, a repetição de “meu povo” e a distinção lexical entre נָגִיד e o título explícito de rei. Os marcadores foram posicionados junto aos termos que efetivamente explicam.
