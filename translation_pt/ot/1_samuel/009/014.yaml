source:
  edition: WLC
  text: וַֽ/יַּעֲל֖וּ הָ/עִ֑יר הֵ֗מָּה בָּאִים֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וְ/הִנֵּ֤ה שְׁמוּאֵל֙ יֹצֵ֣א לִ/קְרָאתָ֔/ם לַ/עֲל֖וֹת הַ/בָּמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: pt
  text: Assim, eles subiram à cidade. Quando estavam entrando na cidade[a], eis que Samuel vinha saindo ao encontro deles, para subir ao lugar alto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no meio da cidade” ou “no interior da cidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido direcional de עלה e é natural no contexto da subida até a cidade.
- source_word: הָעִיר
  choice: a cidade
  rationale: עיר pode designar cidade ou povoado; “cidade” é a correspondência tradicional e adequada ao contexto narrativo.
- source_word: הֵמָּה בָּאִים
  choice: quando estavam entrando
  rationale: O pronome independente com o particípio comunica ação em andamento; no contexto, בוא descreve a entrada na cidade.
- source_word: בְּתוֹךְ הָעִיר
  choice: na cidade
  rationale: Tradução idiomática de “no meio/interior da cidade”; evita sugerir sem necessidade o centro geográfico exato. A forma mais literal é preservada em nota.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a função de הנה de chamar vividamente a atenção para uma ocorrência significativa e repentina.
- source_word: יֹצֵא
  choice: vinha saindo
  rationale: Reproduz o aspecto progressivo do particípio e o movimento de Samuel para fora, na direção dos dois viajantes.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: Equivalente português natural da expressão que indica movimento para encontrar alguém.
- source_word: לַעֲלוֹת
  choice: para subir
  rationale: Expressa naturalmente o infinitivo de propósito e preserva o sentido direcional de עלה.
- source_word: הַבָּמָה
  choice: o lugar alto
  rationale: Preserva a categoria histórico-cultual de במה sem substituí-la por uma explicação mais interpretativa como “santuário”.
theological_decisions:
- issue: Tradução do local cultual במה
  choice: o lugar alto
  alternative: o santuário; o santuário no alto
  rationale: “Lugar alto” conserva o termo histórico-religioso e não introduz neste versículo uma avaliação teológica nem uma localização mais específica do que o hebraico afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” preserva a vivacidade narrativa do hebraico, enquanto “lugar alto” mantém a terminologia cultual sem explicação denominacional.
