base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: pt
  text: 'Antigamente, em Israel,[a] quando um homem ia consultar a Deus, dizia: “Venham, vamos até o vidente”, pois ao que hoje se chama profeta, antigamente se chamava vidente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nos tempos antigos, em Israel, quando um homem ia buscar a Deus, dizia: ‘Venham, vamos até o vidente’.”'
    reason: Registra alternativas legítimas para לְפָנִים e para לִדְרֹשׁ אֱלֹהִים; neste contexto, a última expressão também pode ter o sentido mais amplo de “buscar a Deus”.
lexical_decisions:
- source_word: לְפָנִים
  choice: antigamente
  rationale: Advérbio temporal claro e corrente, usado nas duas ocorrências para conservar o contraste com הַיּוֹם, “hoje”.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Expressa diretamente o âmbito em que vigorava o costume descrito.
- source_word: כֹּה אָמַר
  choice: dizia
  rationale: O imperfeito português comunica naturalmente a fala habitual em um contexto passado.
- source_word: הָאִישׁ
  choice: um homem
  rationale: O substantivo masculino singular tem sentido genérico, mas sua forma é preservada sem neutralização desnecessária.
- source_word: בְּלֶכְתּוֹ
  choice: quando um homem ia
  rationale: A construção infinitiva com sufixo tem valor temporal; a repetição implícita do sujeito torna a frase natural em português.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: consultar a Deus
  rationale: Neste contexto, דרש indica buscar orientação divina, especialmente por intermédio de uma figura profética; “consultar” preserva o sentido específico sem o reduzir a uma busca devocional genérica.
- source_word: לְכוּ וְנֵלְכָה
  choice: Venham, vamos
  rationale: Preserva tanto o imperativo plural quanto a forma exortativa inclusiva, em português moderno e natural.
- source_word: עַד הָרֹאֶה
  choice: até o vidente
  rationale: עַד indica aqui movimento em direção a uma pessoa, e “vidente” é o título tradicional e preciso para רֹאֶה.
- source_word: לַנָּבִיא
  choice: o profeta
  rationale: Tradução usual de נָבִיא, com preservação do artigo definido.
- source_word: הַיּוֹם
  choice: de hoje
  rationale: Mantém explícito o contraste temporal entre a designação corrente para o narrador e a designação antiga.
- source_word: יִקָּרֵא
  choice: era chamado
  rationale: A forma passiva é apresentada retrospectivamente como explicação de um uso terminológico anterior.
- source_word: הָרֹאֶה
  choice: vidente
  rationale: Conserva o antigo título profético; em português, o predicativo após “chamado” dispensa naturalmente o artigo.
theological_decisions:
- issue: Forma masculina genérica de הָאִישׁ
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: A tradução conserva o masculino singular do hebraico em uma descrição histórica de fala costumeira, sem ampliar nem restringir teologicamente o referente.
- issue: Sentido de דָּרַשׁ אֱלֹהִים no contexto profético
  choice: consultar a Deus
  alternative: buscar a Deus; procurar orientação de Deus
  rationale: O contexto é a procura de orientação divina por meio do vidente. “Consultar a Deus” comunica esse valor sem introduzir uma teoria específica sobre mediação profética.
- issue: Relação entre “profeta” e “vidente”
  choice: o profeta de hoje antigamente era chamado vidente
  alternative: aquele que hoje é chamado profeta antigamente era chamado vidente
  rationale: A redação preserva o contraste histórico e a forma definida de לַנָּבִיא, sem afirmar que os termos sejam teologicamente idênticos em todos os contextos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Venham, vamos” evita o arcaísmo “vinde” e mantém as duas formas exortativas do hebraico. A repetição de “hoje” e “antigamente” é intencional para preservar o contraste explicativo do original.
