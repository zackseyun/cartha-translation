base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: pt
  text: 'O jovem respondeu novamente a Saul e disse: “Veja, tenho aqui, em minha mão, um quarto de siclo de prata. Eu o darei ao homem de Deus, e ele nos indicará o caminho[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o caminho que devemos seguir”. O hebraico diz literalmente “nosso caminho”, expressão que pode se referir tanto à rota adiante quanto ao curso de ação a tomar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף הַנַּעַר לַעֲנוֹת
  choice: O jovem respondeu novamente
  rationale: A construção יסף + infinitivo expressa repetição ou continuação. “Respondeu novamente” é natural em português e mantém o sentido iterativo; “jovem” preserva a amplitude de נַעַר sem explicitar aqui sua função de servo.
- source_word: הִנֵּה
  choice: Olhe
  rationale: A interjeição chama a atenção para o que o jovem tem consigo. “Olhe” é corrente e digna, sem o tom arcaico de “eis”.
- source_word: נִמְצָא בְיָדִי
  choice: tenho comigo
  rationale: Embora a expressão hebraica diga literalmente que algo “se encontra em minha mão”, “tenho comigo” comunica de modo idiomático a posse imediata, sem sugerir necessariamente que a prata esteja fisicamente na mão naquele instante.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: um quarto de siclo de prata
  rationale: Mantém a unidade antiga de peso e o valor fracionário explícito no hebraico.
- source_word: וְנָתַתִּי
  choice: Eu o darei
  rationale: O perfeito com waw expressa aqui a ação que o jovem se propõe a realizar. O pronome “o” retoma naturalmente o quarto de siclo.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: ao homem de Deus
  rationale: É a tradução transparente e tradicional do título hebraico para uma pessoa reconhecida como representante ou mensageiro de Deus.
- source_word: וְהִגִּיד לָנוּ
  choice: e ele nos indicará
  rationale: O hifil de נגד significa informar, declarar ou tornar conhecido. Neste contexto de orientação, “indicará” liga-se naturalmente ao caminho sem tornar o sentido excessivamente específico.
- source_word: אֶת דַּרְכֵּנוּ
  choice: o caminho
  rationale: דֶּרֶךְ pode indicar tanto a rota a seguir quanto o curso de ação. O artigo definido em português torna a frase natural; a nota conserva a ambiguidade do possessivo hebraico “nosso caminho”.
