base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: pt
  text: 'Levantaram-se cedo e, ao romper da aurora[a], Samuel chamou Saul, que estava no terraço, e disse: “Levante-se, e eu o despedirei[b].” Saul se levantou, e os dois — ele e Samuel — saíram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “ao subir da aurora”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu o deixarei partir” ou “eu o mandarei seguir viagem”. O verbo hebraico pode indicar despedir alguém ou fazê-lo seguir seu caminho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: Levantaram-se cedo
  rationale: O hifil de שׁכם indica agir ou levantar-se cedo; a formulação mantém o sujeito plural e a ênfase temporal do hebraico em português natural.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: ao romper da aurora
  rationale: Expressa de modo corrente a imagem hebraica de a aurora estar subindo ou surgindo, sem reduzir a referência a uma hora exata.
- source_word: הַגָּג
  choice: no terraço
  rationale: Refere-se à cobertura plana da casa, usada como espaço habitável; “terraço” comunica esse cenário com mais precisão ao leitor moderno do que o genérico “telhado”.
- source_word: קוּמָה
  choice: Levante-se
  rationale: Imperativo claro e contemporâneo que preserva o sentido direto de קום e é adequado ao tratamento respeitoso em português.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: eu o encaminharei
  rationale: Neste contexto, שׁלח indica despedir ou fazer alguém seguir viagem. “Encaminharei” preserva o tom cortês sem sugerir expulsão.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: saíram
  rationale: O verbo com o advérbio direcional indica sair para fora; “saíram” é idiomático e não especifica um destino ausente do texto.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: os dois — ele e Samuel —
  rationale: Mantém a aposição enfática e um pouco incomum do hebraico, deixando que “ele” retome Saul, sem substituí-lo silenciosamente pelo nome.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O discurso direto usa “o” como objeto de “encaminharei”, evitando regionalismos marcados. “Terraço” representa a cobertura plana da casa no contexto antigo. Os travessões preservam a aposição enfática do hebraico sem tornar a frase obscura.
