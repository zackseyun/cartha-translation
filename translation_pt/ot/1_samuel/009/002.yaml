base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: pt
  text: Ele tinha um filho chamado Saul, jovem e de boa aparência. Entre os filhos de Israel não havia homem de melhor aparência do que ele; dos ombros para cima, era mais alto do que todo o povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵן
  choice: filho
  rationale: 'O sentido familiar imediato é inequívoco: Quis tinha um filho.'
- source_word: וּשְׁמוֹ שָׁאוּל
  choice: chamado Saul
  rationale: Expressão natural em português que transmite com precisão a identificação pelo nome.
- source_word: בָּחוּר
  choice: jovem
  rationale: No contexto, designa um homem jovem, no vigor da vida; o substantivo 'filho' já explicita o sexo.
- source_word: טוֹב / וָטוֹב
  choice: de boa aparência / de melhor aparência
  rationale: Neste retrato pessoal, טוֹב provavelmente se refere à aparência física. A formulação conserva a repetição lexical e evita restringir o sentido exclusivamente à beleza facial.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Preserva a expressão hebraica tradicional e seu caráter coletivo, sem a generalizar silenciosamente como 'israelitas'.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: dos ombros para cima
  rationale: Equivalente idiomático português da expressão hebraica que destaca quanto Saul sobressaía em altura.
- source_word: גָּבֹהַּ מִכָּל הָעָם
  choice: era mais alto do que todo o povo
  rationale: Explicita naturalmente a comparação de estatura presente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira ampla. A sintaxe foi suavemente reorganizada para fluência, mantendo o paralelismo descritivo e a expressão hebraica 'filhos de Israel'. Nenhuma nota é necessária, pois as alternativas lexicais não alteram substancialmente o sentido do versículo.
