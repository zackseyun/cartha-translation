  to: 'Enquanto desciam até a extremidade da cidade, Samuel disse a Saul: “Diga ao jovem[a] que siga adiante de nós”. E ele seguiu adiante. “Mas você, fique parado agora[b], e eu lhe farei ouvir a palavra de Deus.”'
