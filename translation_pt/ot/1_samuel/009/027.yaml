base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: pt
  text: 'Enquanto desciam até a extremidade da cidade, Samuel disse a Saul: “Diga ao jovem[a] que siga adiante de nós”. E ele seguiu adiante. “Mas você, fique parado agora[b], e eu lhe farei ouvir a palavra de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criado” ou “servo”. A palavra hebraica pode se referir a um jovem, criado ou servo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “fique de pé agora/como neste dia”. A expressão é idiomática e, no contexto, indica que Saul devia parar e permanecer ali por ora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹרְדִים
  choice: Enquanto desciam
  rationale: O particípio expressa uma ação em andamento; a construção temporal é natural em português e mantém a simultaneidade narrativa.
- source_word: בִּקְצֵה הָעִיר
  choice: até a extremidade da cidade
  rationale: קָצֶה indica a extremidade ou o limite de um lugar. A tradução evita interpretar mais especificamente como “arredores”.
- source_word: אֱמֹר לַנַּעַר
  choice: Diga ao jovem
  rationale: נַעַר pode designar um jovem, criado ou ajudante. “Jovem” preserva a amplitude lexical, enquanto a nota registra a opção contextual “ajudante”.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: que siga adiante de nós
  rationale: עבר com לִפְנֵי indica passar ou avançar à frente de alguém; esta formulação é clara e idiomática.
- source_word: וַיַּעֲבֹר
  choice: Ele seguiu adiante
  rationale: A forma narrativa relata o cumprimento imediato da ordem e retoma sua linguagem.
- source_word: עֲמֹד כַּיּוֹם
  choice: pare aqui por um momento
  rationale: A expressão é idiomática e, no contexto, ordena a Saul que fique no lugar naquele momento. “Aqui” é inferido da situação, e “por um momento” comunica a força temporal sem reproduzir uma literalidade obscura.
- source_word: וְאַשְׁמִיעֲךָ
  choice: eu lhe anunciarei
  rationale: O hifil de שׁמע é causativo, literalmente “farei você ouvir”. Em português, “anunciarei” expressa naturalmente a comunicação oral, embora “farei você ouvir” permaneça uma alternativa mais formal.
- source_word: דְּבַר אֱלֹהִים
  choice: a palavra de Deus
  rationale: A expressão mantém o peso profético e revelatório do hebraico sem especificar além do texto se se trata de palavra, mensagem ou assunto.
theological_decisions:
- issue: Tradução da fórmula revelatória דְּבַר אֱלֹהִים
  choice: a palavra de Deus
  alternative: a mensagem de Deus
  rationale: “A palavra de Deus” conserva a ressonância profética da expressão e sua formulação tradicional, sem determinar antecipadamente o conteúdo da revelação.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta e o discurso marcado por aspas favorecem a fluidez. O marcador [a] foi colocado junto de “jovem”, termo ao qual a nota lexical efetivamente se refere.
