base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: pt
  text: Assim que entrarem na cidade, vocês o encontrarão, antes que ele suba ao lugar alto[a] para comer. Pois o povo não comerá até que ele chegue, porque é ele quem abençoa o sacrifício[b]; depois disso, os convidados comerão. Portanto, subam agora, pois hoje[c] vocês o encontrarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lugar alto” designa um local elevado de culto onde se ofereciam sacrifícios e se realizavam refeições sacrificiais.
    reason: cultural_note
  - marker: b
    text: “Abençoa o sacrifício” provavelmente significa que ele pronunciava a bênção ligada à refeição sacrificial antes que os convidados comessem.
    reason: cultural_note
  - marker: c
    text: 'Ou: “neste momento”. A expressão hebraica כְהַיּוֹם pode enfatizar a ocasião imediata, e não apenas o dia do calendário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: Assim que entrarem na cidade
  rationale: A preposição כְּ com o infinitivo construto de בוא forma uma expressão temporal. “Assim que” comunica com naturalidade a proximidade imediata sugerida pelo contexto.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: vocês o encontrarão
  rationale: כֵּן reforça aqui o resultado ou sua certeza; em português, a sequência temporal já torna desnecessário traduzir o advérbio separadamente.
- source_word: בְּטֶרֶם יַעֲלֶה הַבָּמָתָה
  choice: antes que ele suba ao lugar alto
  rationale: בְּטֶרֶם indica anterioridade, e עלה conserva a ideia de subir. במה designa um local elevado ligado ao culto e aos sacrifícios.
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: o povo não comerá até que ele chegue
  rationale: O imperfeito tem sentido futuro no contexto, e a construção com עַד é expressa naturalmente em português por “até que”.
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: porque é ele quem abençoa o sacrifício
  rationale: A construção preserva a ênfase do pronome הוּא. “Sacrifício” mantém o valor direto de זבח, sem apagar sua relação contextual com a refeição.
- source_word: הַקְּרֻאִים
  choice: os convidados
  rationale: O particípio passivo de קרא significa literalmente “os chamados”, isto é, as pessoas convidadas para a refeição.
- source_word: וְעַתָּה עֲלוּ
  choice: Portanto, subam agora
  rationale: “Portanto” comunica a força contextual da conjunção, enquanto “subam” conserva o movimento indicado por עלה.
- source_word: כְהַיּוֹם
  choice: hoje
  rationale: “Hoje” preserva a referência temporal mais direta, enquanto a nota registra a possível nuance de imediatidade da expressão hebraica.
