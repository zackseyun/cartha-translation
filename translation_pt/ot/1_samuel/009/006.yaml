base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: pt
  text: 'Ele lhe disse: “Veja, há nesta cidade um homem de Deus, e ele é muito respeitado. Tudo o que diz certamente acontece. Vamos até lá agora. Talvez ele nos indique o caminho que devemos seguir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: homem de Deus
  rationale: Expressão hebraica tradicional e clara para alguém reconhecido como porta-voz de Deus.
- source_word: נִכְבָּד
  choice: muito respeitado
  rationale: Comunica naturalmente a ideia de alguém honrado e estimado, sem sugerir necessariamente posição oficial.
- source_word: בּוֹא יָבוֹא
  choice: certamente acontece
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza de que suas palavras se cumprem.
- source_word: יַגִּיד לָנוּ
  choice: nos indique
  rationale: No contexto, o verbo significa dar a conhecer ou apontar a direção a ser tomada.
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: o caminho que devemos seguir
  rationale: Expressa em português natural a busca de orientação, embora a formulação hebraica seja literalmente retrospectiva.
theological_decisions:
- issue: Certeza das palavras do homem de Deus
  choice: Tudo o que diz certamente acontece
  alternative: Tudo o que ele diz se cumpre sem falta
  rationale: Mantém a força enfática do hebraico sem acrescentar uma formulação doutrinária sobre inspiração ou infalibilidade.
- issue: Sentido da frase final sobre o caminho
  choice: o caminho que devemos seguir
  alternative: o caminho pelo qual temos andado
  rationale: O contexto aponta para orientação quanto ao próximo passo da busca. A alternativa preserva mais literalmente a forma hebraica, mas soa retrospectiva e pouco natural neste contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O diálogo é direto e natural; “homem de Deus” preserva a expressão bíblica estabelecida.
