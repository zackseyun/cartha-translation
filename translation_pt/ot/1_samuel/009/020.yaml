base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: pt
  text: Quanto às jumentas que se perderam há três dias, não se preocupe com elas, pois já foram encontradas. E para quem é todo o desejo de Israel?[a] Não é para você e para toda a casa de seu pai?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E a quem pertence tudo o que é desejável em Israel?” A expressão hebraica pode indicar tanto aquilo que Israel deseja como aquilo que é precioso ou desejável em Israel.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “casa de seu pai” designa a família extensa ou o clã, não apenas a família nuclear imediata.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: jumentas
  rationale: O substantivo hebraico designa especificamente jumentas; o termo é natural em português e mantém essa precisão sem dificultar a leitura.
- source_word: הָאֹבְדוֹת
  choice: que se perderam
  rationale: Expressa de modo idiomático o estado das jumentas desaparecidas, preservando o sentido resultante do particípio.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: há três dias
  rationale: É a forma idiomática portuguesa para a expressão temporal hebraica, que indica três dias antes do momento da fala.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: não se preocupe com elas
  rationale: Traduz naturalmente o idioma hebraico literal 'não ponha seu coração nelas', cujo sentido contextual é não dedicar preocupação ou atenção às jumentas.
- source_word: נִמְצָאוּ
  choice: já foram encontradas
  rationale: O perfeito nifal tem sentido passivo e resultativo; 'já' explicita naturalmente em português que a busca terminou, sem alterar o conteúdo.
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: E para quem é todo o desejo de Israel?
  rationale: Mantém a formulação compacta e a ambiguidade de חֶמְדַּת entre aquilo que Israel deseja e aquilo que é desejável ou precioso em Israel.
- source_word: הֲלוֹא
  choice: Não é
  rationale: Preserva a pergunta retórica que espera resposta afirmativa.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: para você e para toda a casa de seu pai
  rationale: Conserva a expressão social e familiar hebraica, mais ampla que a família nuclear imediata.
theological_decisions:
- issue: Sentido da declaração de Samuel sobre 'o desejo de Israel'
  choice: Manter uma declaração retórica elevada e ambígua que aponta para Saul e a casa de seu pai, sem inserir explicitamente a realeza.
  alternative: Traduzir como referência direta ao reinado desejado por Israel ou como afirmação de que tudo o que é precioso em Israel pertence a Saul.
  rationale: O contexto antecipa a escolha de Saul, mas o versículo não menciona explicitamente a realeza. A redação preserva a tensão e a polissemia do hebraico em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção principal é natural, enquanto a expressão deliberadamente ambígua 'todo o desejo de Israel' conserva a densidade retórica do hebraico; as notas esclarecem alternativas sem resolver a ambiguidade no texto.
