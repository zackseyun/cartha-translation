  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: pt
  text: Então Samuel levou Saul e seu ajudante para o salão[a] e lhes deu um lugar à cabeceira dos convidados[b], que eram cerca de trinta homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a sala” ou “para a câmara”. O termo hebraico pode designar diferentes tipos de recinto, mas aqui provavelmente se refere ao salão onde ocorreu a refeição.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “à cabeça dos convidados”. A expressão indica o lugar principal ou de maior honra. O pronome na frase seguinte provavelmente se refere aos convidados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: seu ajudante
  rationale: נַעַר pode designar um jovem, servo ou auxiliar. No contexto, trata-se do subordinado que acompanha Saul; “ajudante” comunica essa função sem definir em excesso sua condição social.
- source_word: לִשְׁכָּתָה
  choice: para o salão
  rationale: לִשְׁכָּה designa uma sala, câmara ou salão. O contexto de uma refeição com cerca de trinta convidados favorece “salão”, espaço amplo para o banquete.
- source_word: מָקוֹם בְּרֹאשׁ
  choice: um lugar de honra
  rationale: Literalmente, a expressão é “um lugar à cabeça/no primeiro lugar”. No contexto da disposição dos convidados à mesa, indica uma posição destacada e honrosa; a formulação natural explicita essa função.
- source_word: הַקְּרוּאִים
  choice: os convidados
  rationale: O particípio passivo de קרא significa os chamados ou convidados. Em contexto de banquete, “os convidados” é a equivalência mais clara e natural.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: que eram cerca de trinta homens
  rationale: O pronome provavelmente retoma os convidados mencionados imediatamente antes. A oração relativa conserva essa referência provável e integra a informação com naturalidade, enquanto “homens” representa אִישׁ.
- source_word: וַיִּקַּח ... וַיְבִיאֵם
  choice: levou ... para
  rationale: A sequência literal “tomou... e os fez entrar” descreve Samuel conduzindo os dois ao salão. “Levou... para” evita uma repetição pouco natural em português sem perder a ação resultante.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Ajudante” evita o pouco idiomático “seu jovem” e não impõe a condição mais específica de “servo”. A ordem das notas foi ajustada para que cada marcador apareça no ponto correspondente do texto.
