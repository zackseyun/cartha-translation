  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לְ/נַעֲר֗/וֹ וְ/הִנֵּ֣ה נֵלֵךְ֮ וּ/מַה נָּבִ֣יא לָ/אִישׁ֒ כִּ֤י הַ/לֶּ֨חֶם֙ אָזַ֣ל מִ/כֵּלֵ֔י/נוּ וּ/תְשׁוּרָ֥ה אֵין לְ/הָבִ֖יא לְ/אִ֣ישׁ הָ/אֱלֹהִ֑ים מָ֖ה אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: pt
  text: 'Então Saul disse ao jovem que o acompanhava[a]: “Mas veja: se formos, o que levaremos ao homem? O pão acabou em nossas bolsas[b], e não temos nenhum presente[c] para levar ao homem de Deus. O que temos conosco?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao seu servo”. O termo hebraico pode designar um jovem ou um jovem ajudante.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o pão se acabou de nossos recipientes”. “Pão” pode representar os mantimentos, e o termo traduzido por “bolsas” designa, de modo geral, recipientes ou utensílios.
    reason: lexical_alternative
  - marker: c
    text: Ou “oferta”. Trata-se de algo levado como demonstração de respeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: jovem que o acompanhava
  rationale: O substantivo pode designar um jovem ou um ajudante. A formulação conserva a noção de idade sem definir sua condição como escravo ou servo doméstico e explicita com naturalidade a relação indicada pelo sufixo possessivo.
- source_word: וְהִנֵּה
  choice: Mas veja
  rationale: A expressão chama a atenção para uma dificuldade prática e, no contexto, introduz uma objeção. “Mas veja” reproduz ambas as funções em português atual.
- source_word: נֵלֵךְ
  choice: se formos
  rationale: O imperfeito integra aqui uma construção de sentido condicional; “se formos” é a forma natural e fiel em português.
- source_word: נָּבִיא
  choice: levaremos / levar
  rationale: O hifil de בוא significa fazer chegar ou trazer algo. Como o movimento é apresentado da perspectiva de Saul e seu acompanhante rumo ao homem, “levar” soa mais natural em português, sem alterar o sentido.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém o referente concreto do hebraico, embora no contexto possa representar de modo mais amplo os mantimentos.
- source_word: אָזַל
  choice: acabou
  rationale: O verbo indica que algo se esgotou. “Acabou” é direto, atual e adequado ao suprimento de pão.
- source_word: כְּלִי
  choice: bolsas
  rationale: O termo geral significa utensílios ou recipientes; no contexto de viagem, “bolsas” comunica naturalmente os recipientes em que levavam as provisões.
- source_word: תְּשׁוּרָה
  choice: presente
  rationale: Designa algo oferecido a uma pessoa respeitada. “Presente” evita as possíveis conotações cultuais de “oferta”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título hebraico tradicional sem substituí-lo pelo termo mais interpretativo “profeta”.
- source_word: מָה אִתָּנוּ
  choice: O que temos conosco?
  rationale: Reproduz o sentido idiomático da pergunta acerca do que ainda possuem e podem oferecer, preservando a ideia explícita de algo que está com eles.
theological_decisions:
- issue: Título אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  alternative: profeta
  rationale: O texto emprega o título “homem de Deus”; vertê-lo como “profeta” identificaria corretamente Samuel no contexto, mas eliminaria a designação específica usada neste versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tom prático e imediato de Saul. Evitaram-se tanto o arcaísmo “eis” quanto termos que poderiam introduzir indevidamente uma oferta cultual.
