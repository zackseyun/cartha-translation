  text: וַֽ/יהוָ֔ה גָּלָ֖ה אֶת אֹ֣זֶן שְׁמוּאֵ֑ל י֣וֹם אֶחָ֔ד לִ/פְנֵ֥י בֽוֹא שָׁא֖וּל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/015.yaml
  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: pt
  text: 'Yahweh havia revelado a Samuel, um dia antes de Saul chegar[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “havia descoberto o ouvido de Samuel”, expressão idiomática hebraica que significa revelar ou comunicar algo a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido pelo nome divino “Yahweh”. O waw narrativo não recebe um marcador independente, pois a progressão é suficientemente indicada pelo contexto e pelo mais-que-perfeito composto.
- source_word: גָּלָה אֶת אֹזֶן שְׁמוּאֵל
  choice: havia revelado a Samuel
  rationale: A expressão hebraica literalmente fala em “descobrir o ouvido” de alguém, um idioma para revelar ou comunicar algo. A tradução natural conserva o sentido sem introduzir um objeto inexistente no texto.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: um dia antes de Saul chegar
  rationale: A expressão temporal e o infinitivo construto são vertidos por uma oração portuguesa natural, preservando com precisão que a revelação ocorreu no dia anterior à chegada de Saul.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Fórmula hebraica que introduz o discurso direto; os dois-pontos sinalizam naturalmente em português que a fala continua no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação do projeto, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O mais-que-perfeito composto “havia revelado” explicita a anterioridade indicada pelo contexto. A ordem foi levemente ajustada para fluência, e o versículo termina com dois-pontos por introduzir a fala do versículo seguinte.
