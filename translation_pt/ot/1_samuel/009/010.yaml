base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: pt
  text: 'Então Saul disse ao jovem: “O que você disse é bom. Venha, vamos!” E foram à cidade onde estava o homem de Deus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Homem de Deus” é um título hebraico usado com frequência para um profeta ou alguém que fala em nome de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: jovem servo
  rationale: O substantivo designa basicamente um jovem, mas, neste contexto, trata-se do subordinado que acompanha Saul. “Jovem servo” preserva tanto a idade quanto a função narrativa.
- source_word: טוֹב דְּבָרְךָ
  choice: O que você disse é bom
  rationale: A expressão literalmente se refere à “palavra” do acompanhante, isto é, à sugestão apresentada no versículo anterior. Esta formulação é natural em português e mantém a referência ao que foi dito.
- source_word: לְכָה נֵלֵכָה
  choice: Venha, vamos
  rationale: A combinação expressa convite e decisão conjunta. “Venha, vamos” reproduz de modo idiomático a força exortativa.
- source_word: הָעִיר
  choice: a cidade
  rationale: עִיר pode indicar cidade ou povoado; “cidade” é a equivalência tradicional e adequada à forma definida.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém diretamente o título hebraico, em vez de substituí-lo pela interpretação “profeta”.
- source_word: אֲשֶׁר שָׁם
  choice: onde estava
  rationale: A construção relativa com o advérbio שָׁם é expressa naturalmente em português por “onde estava”.
theological_decisions:
- issue: Tradução do título אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  alternative: o profeta
  rationale: Embora o título frequentemente designe um profeta ou porta-voz divino, a tradução direta preserva a linguagem teológica própria do texto sem substituir o título por uma explicação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Você” corresponde ao singular do hebraico e evita a rigidez regional de “tu” em boa parte do público-alvo. A pontuação conserva o ritmo breve do diálogo e da ação narrativa.
