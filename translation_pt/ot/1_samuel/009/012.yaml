base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: pt
  text: 'Elas lhes responderam: “Sim, ele está logo à sua frente. Vá depressa, pois ele chegou hoje à cidade; hoje há um sacrifício para o povo no lugar alto[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lugar alto” refere-se a um local de culto, geralmente situado numa elevação.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: Elas lhes responderam
  rationale: A combinação hebraica literal 'responderam e disseram' introduz a resposta. Em português atual, 'responderam' transmite naturalmente as duas formas verbais sem produzir uma construção pesada.
- source_word: יֵשׁ הִנֵּה לְפָנֶיךָ
  choice: Sim, ele está logo ali adiante de vocês
  rationale: יֵשׁ funciona como resposta afirmativa, הִנֵּה chama a atenção para a localização, e לְפָנֶיךָ indica que Samuel está adiante deles. 'Logo ali' comunica proximidade sem tom arcaico.
- source_word: מַהֵר עַתָּה
  choice: Vão depressa
  rationale: O imperativo singular pode dirigir-se a Saul como representante do grupo, mas o contexto inclui Saul e seu servo; o plural em português torna natural a exortação às pessoas interrogadas e preserva a urgência de מַהֵר עַתָּה.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: pois ele chegou hoje à cidade
  rationale: O perfeito בָּא descreve a chegada ocorrida naquele dia. 'Chegou hoje' é natural e aspectualmente adequado em português.
- source_word: זֶבַח הַיּוֹם לָעָם
  choice: hoje o povo oferecerá um sacrifício
  rationale: A frase nominal afirma a existência de um sacrifício destinado à comunidade. Esta formulação portuguesa explicita de modo natural a participação do povo, embora o hebraico diga mais literalmente 'há hoje um sacrifício para o povo'.
- source_word: בַּבָּמָה
  choice: no lugar alto
  rationale: בָּמָה é o termo cultual para um local elevado de culto. 'Lugar alto' conserva a terminologia histórica sem pressupor aqui uma avaliação negativa.
theological_decisions:
- issue: Sentido cultual de בָּמָה antes da construção do templo
  choice: lugar alto
  alternative: santuário no alto
  rationale: A tradução preserva o termo histórico e sua possível associação topográfica sem importar para este episódio a condenação de certos lugares altos em contextos posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Evitou-se a fórmula rígida 'responderam e disseram' e manteve-se o termo histórico 'lugar alto', explicado em nota.
