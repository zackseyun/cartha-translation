  source_fidelity: A tradução transmite adequadamente a resposta afirmativa, a proximidade de Samuel, sua chegada naquele dia e o contexto sacrificial. Contudo, o imperativo hebraico e os pronomes são singulares, e a oração final é nominal ('há ... um sacrifício para o povo'), não uma previsão de que o povo o oferecerá.
  naturalness: O português é claro e atual. A revisão preserva essa fluência, evitando a mudança injustificada para o plural e expressando naturalmente a oração existencial final.
  terminology: “Lugar alto” é uma boa equivalência estabelecida para בָּמָה e a nota cultural é apropriada. A nota pode ser ligeiramente ajustada para não definir o sítio exclusivamente pela elevação física nem acrescentar pormenores desnecessários.
