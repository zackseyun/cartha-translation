  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: pt
  text: 'Enquanto subiam pela ladeira que levava à cidade, encontraram moças que saíam para tirar água e lhes perguntaram: “O vidente[a] está aqui?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o profeta. O hebraico diz especificamente “o vidente”, termo antigo para o que mais tarde se chamou “profeta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: enquanto subiam
  rationale: O particípio, acompanhado do pronome הֵמָּה, apresenta a ação em andamento; a oração temporal é natural em português narrativo.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: pela ladeira que levava à cidade
  rationale: מַעֲלֶה indica uma subida ou acesso íngreme. A formulação preserva o sentido topográfico de modo claro e corrente.
- source_word: מָצְאוּ
  choice: encontraram
  rationale: Mantém o sentido básico do verbo e, no contexto, comunica naturalmente um encontro pelo caminho.
- source_word: נְעָרוֹת
  choice: moças
  rationale: Designa jovens do sexo feminino; “moças” é conciso, atual e amplamente compreensível, sem o tom arcaico de “donzelas”.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: saíam para tirar água
  rationale: O particípio seguido do infinitivo expressa ação em curso e finalidade. “Tirar água” é uma expressão portuguesa natural para recolhê-la de uma fonte ou poço.
- source_word: הֲיֵשׁ בָּזֶה
  choice: está por aqui?
  rationale: A expressão pergunta pela presença da pessoa naquele lugar; “por aqui” transmite de forma idiomática a referência local de בָּזֶה.
- source_word: הָרֹאֶה
  choice: o vidente
  rationale: Preserva o termo histórico específico do hebraico, cuja relação com “profeta” é explicitada pelo próprio contexto narrativo em 1 Samuel 9:9.
