base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: pt
  text: Ele passou pela região montanhosa de Efraim e pela terra de Salisa, mas não as encontraram[a]. Depois, eles passaram pela terra de Saalim, mas elas não estavam lá[b]. Em seguida, ele passou pela terra de Benjamim, mas não as encontraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não declara o objeto de “encontraram”; pelo contexto, trata-se das jumentas perdidas.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “mas não havia” ou “mas nada havia”; a expressão é elíptica e indica que as jumentas não estavam ali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: passou / passaram por
  rationale: Com a preposição בְ, o verbo descreve o deslocamento por sucessivas regiões. “Passar por” é natural em português e preserva a alternância hebraica entre singular e plural.
- source_word: בְּהַר אֶפְרַיִם
  choice: pela região montanhosa de Efraim
  rationale: Nesta expressão geográfica, הַר designa uma região de montes, não necessariamente um monte isolado.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: a terra de Salisa
  rationale: אֶרֶץ indica aqui um território nomeado; “terra” mantém a formulação geográfica sem definir indevidamente seu estatuto político.
- source_word: וְלֹא מָצָאוּ
  choice: mas não as encontraram
  rationale: O verbo plural inclui Saul e seu servo. O objeto está implícito no hebraico e, pelo contexto anterior, refere-se às jumentas perdidas; o pronome feminino plural torna a frase natural em português.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: a terra de Saalim
  rationale: Mantém o nome próprio do território e reproduz a construção paralela à terra de Salisa.
- source_word: וָאַיִן
  choice: mas elas não estavam lá
  rationale: A expressão hebraica é elíptica, literalmente “e não havia” ou “e nada havia”. No contexto, indica que as jumentas não se encontravam naquele lugar.
- source_word: אֶרֶץ יְמִינִי
  choice: a terra de Benjamim
  rationale: יְמִינִי é uma forma gentílica ligada a Benjamim; no contexto geográfico, “terra de Benjamim” é clara e idiomática.
