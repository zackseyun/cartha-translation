base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: pt
  text: 'Samuel respondeu a Saul: “Eu sou o vidente.[a] Suba adiante de mim ao lugar alto, e vocês comerão comigo hoje.[b] Pela manhã, eu o mandarei seguir viagem e lhe contarei tudo o que está no seu coração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “profeta”. O hebraico emprega o termo mais antigo “vidente”, que 1 Samuel 9:9 explica como uma designação anterior do profeta.
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico está no plural, provavelmente incluindo o servo de Saul junto com ele.
    reason: grammatical_clarification
lexical_decisions:
- source_word: הָרֹאֶה
  choice: o vidente
  rationale: Preserva o sentido literal de ‘aquele que vê’ e a designação antiga da figura profética, explicada no próprio contexto em 1 Samuel 9:9, sem nivelá-la simplesmente a ‘profeta’.
- source_word: הַבָּמָה
  choice: o lugar alto
  rationale: Mantém a imagem espacial do hebraico e o termo histórico para um local elevado de culto; ‘santuário’ explicitaria mais do que o texto.
- source_word: עֲלֵה לְפָנַי
  choice: Suba adiante de mim
  rationale: Conserva tanto o movimento ascendente quanto a ideia de Saul preceder Samuel, sem especificar além do necessário se ele deveria liderá-lo.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: e vocês comerão comigo hoje
  rationale: O verbo está na segunda pessoa masculina plural, provavelmente incluindo Saul e seu servo. O futuro em português expressa com naturalidade o anúncio-convite de Samuel.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: eu o deixarei seguir viagem
  rationale: Comunica naturalmente, no contexto, que Samuel permitirá que Saul prossiga na manhã seguinte, evitando que ‘mandarei embora’ sugira rejeição.
- source_word: בַבֹּקֶר
  choice: Pela manhã
  rationale: Traduz o hebraico sem acrescentar explicitamente ‘amanhã’, embora o contexto indique a manhã seguinte.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: tudo o que está no seu coração
  rationale: Preserva a expressão antropológica hebraica, que pode abranger pensamentos, preocupações e intenções, sem reduzi-la apenas à mente ou aos sentimentos.
- source_word: אַגִּיד לָךְ
  choice: lhe contarei
  rationale: Expressa de modo atual e natural o causativo de נגד, ‘dar a conhecer, contar’.
theological_decisions:
- issue: Designação de Samuel como הָרֹאֶה
  choice: vidente
  alternative: profeta
  rationale: ‘Vidente’ mantém a terminologia histórica e a distinção narrativa explicitada em 1 Samuel 9:9; ‘profeta’ seria correto quanto à função, mas apagaria essa nuance.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais no Brasil. Mantiveram-se ‘vidente’, ‘lugar alto’ e ‘coração’ para preservar as imagens e a terminologia do hebraico. O plural explícito ‘vocês’ reproduz uma distinção gramatical que ficaria invisível com um tratamento exclusivamente singular.
