  text: וּ/שְׁמוּאֵ֖ל רָאָ֣ה אֶת שָׁא֑וּל וַ/יהוָ֣ה עָנָ֔/הוּ הִנֵּ֤ה הָ/אִישׁ֙ אֲשֶׁ֣ר אָמַ֣רְתִּי אֵלֶ֔י/ךָ זֶ֖ה יַעְצֹ֥ר בְּ/עַמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: pt
  text: 'Quando Samuel viu Saul, Yahweh lhe respondeu: “Veja, este é o homem de quem lhe falei. Este governará[a] o meu povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “manterá o meu povo sob controle” ou “conterá o meu povo”. O verbo hebraico pode significar conter, restringir, controlar ou governar.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: viu
  rationale: Expressa diretamente a percepção visual e soa natural na sequência narrativa.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יְהוָה, preservando-o como nome próprio.
- source_word: עָנָהוּ
  choice: lhe respondeu
  rationale: Mantém o sentido normal de ענה, mesmo sem uma fala imediatamente anterior neste versículo; o contexto mais amplo contém comunicação divina prévia.
- source_word: הִנֵּה
  choice: Veja
  rationale: Reproduz de modo atual e natural a função dêitica da partícula, que chama a atenção de Samuel para Saul.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: o homem de quem lhe falei
  rationale: Transmite com clareza a referência à comunicação divina anterior e permanece próxima da construção hebraica.
- source_word: זֶה
  choice: Ele
  rationale: O pronome retoma naturalmente o homem recém-identificado; a força demonstrativa já aparece em “este é o homem”.
- source_word: יַעְצֹר
  choice: governará
  rationale: No contexto da designação de Saul para a liderança, comunica o exercício de autoridade, sem apagar a nuança lexical mais concreta de conter ou manter sob controle, registrada em nota.
- source_word: בְּעַמִּי
  choice: o meu povo
  rationale: Com יַעְצֹר, identifica o povo como objeto ou esfera do exercício da autoridade; em português, “governar” é transitivo direto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de יַעְצֹר em relação à função de Saul
  choice: governará o meu povo
  alternative: conterá / manterá sob controle o meu povo
  rationale: O contexto imediato aponta para liderança régia, mas o verbo possui uma nuança genuína de conter, restringir ou controlar; a tradução principal comunica a função contextual e a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “lhe” para o objeto indireto e mantém “Yahweh” como nome próprio. A nota conserva a tensão entre o sentido lexical concreto de יַעְצֹר e sua função régia no contexto.
