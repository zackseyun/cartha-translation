base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/025.yaml
  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: pt
  text: Quando desceram do lugar alto para a cidade,[a] Samuel falou com Saul no terraço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles desceram do lugar alto para a cidade, e Samuel falou com Saul no terraço.”'
    reason: Alternativa sintática que reproduz mais diretamente a sequência narrativa das formas hebraicas.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Quando desceram
  rationale: A forma narrativa com waw consecutivo faz a ação avançar. A oração temporal liga naturalmente a descida ao verbo singular seguinte, sem perder o sentido de ירד.
- source_word: מֵהַבָּמָה
  choice: do lugar alto
  rationale: בָּמָה designa aqui o local elevado associado ao culto e ao sacrifício; “lugar alto” preserva esse sentido sem reduzi-lo a mero monte nem interpretá-lo como santuário formal.
- source_word: הָעִיר
  choice: para a cidade
  rationale: No contexto do verbo de movimento e da origem marcada por מִן, a expressão indica a passagem do lugar alto para a área urbana.
- source_word: וַיְדַבֵּר
  choice: Samuel conversou
  rationale: O verbo está no singular e עִם favorece a ideia de falar com alguém. Samuel é explicitado como o sujeito recuperado do contexto para evitar ambiguidade pouco natural em português.
- source_word: עִם שָׁאוּל
  choice: com Saul
  rationale: A preposição עִם significa normalmente “com” e sugere interação verbal, não apenas uma fala unilateral dirigida a Saul.
- source_word: עַל הַגָּג
  choice: no terraço
  rationale: גָּג refere-se ao teto plano utilizado como espaço da casa. “Terraço” comunica essa realidade arquitetônica com naturalidade ao leitor moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lugar alto” mantém o termo cultual tradicional; “terraço” evita que “telhado” sugira uma cobertura inclinada. O nome “Samuel” explicita o sujeito singular implícito no hebraico.
