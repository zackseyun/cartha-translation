base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: pt
  text: 'Quando chegaram à terra de Zufe, Saul disse ao jovem que o acompanhava: “Venha, vamos voltar, para que meu pai não deixe de se ocupar com as jumentas[a] e se preocupe conosco[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixe de se preocupar com as jumentas”. O hebraico diz literalmente “cesse das jumentas”; a expressão indica deixar de ocupar-se com elas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e fique ansioso por nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: chegaram à terra de Zufe
  rationale: Com בוא seguido de ב, a expressão indica chegada a uma região. “Chegaram à” é natural em português, e “Zufe” preserva o nome geográfico hebraico em forma legível.
- source_word: נַעֲרוֹ אֲשֶׁר עִמּוֹ
  choice: o jovem que o acompanhava
  rationale: נַעַר significa basicamente “jovem”, embora possa designar um servo ou ajudante. A formulação mantém o sentido lexical sem definir além do texto a posição social do acompanhante.
- source_word: לְכָה וְנָשׁוּבָה
  choice: Venha, vamos voltar
  rationale: O imperativo seguido do coortativo expressa um convite ou exortação para regressarem juntos. A construção escolhida é corrente e conserva essa força.
- source_word: פֶּן
  choice: para que ... não
  rationale: פֶּן introduz aqui uma consequência indesejada que Saul pretende evitar. “Para que ... não” comunica naturalmente essa relação em português.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: não deixe de se ocupar com as jumentas
  rationale: חדל com מן significa cessar ou afastar-se de determinada ocupação. A tradução conserva a ideia de que o pai deixaria de dedicar atenção à procura das jumentas, sem reduzir necessariamente o sentido a falta de afeto.
- source_word: וְדָאַג לָנוּ
  choice: e passe a se preocupar conosco
  rationale: דאג denota preocupação ou ansiedade, e לָנוּ indica as pessoas que se tornam objeto dessa preocupação. “Passe a” torna explícita, de modo natural, a mudança de foco já implícita na sequência hebraica.
