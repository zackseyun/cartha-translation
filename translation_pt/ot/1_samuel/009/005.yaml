    issue: A nota a caracteriza de modo impreciso uma paráfrase como tradução literal.
    rationale: Em חדל מן, מן é normalmente vertido literalmente por “de/desde”, mas a construção tem valor idiomático de cessar de ocupar-se com o objeto. “Cesse em relação às jumentas” não é uma boa formulação literal nem idiomática em português.
  - severity: low
    issue: “Passe a se preocupar” explicita uma transição que o hebraico deixa apenas sugerida pela coordenação.
    rationale: A transição de preocupação é evidente no contexto, mas o texto hebraico diz simplesmente “e se preocupe conosco”. Uma redação mais direta preserva melhor essa concisão.
