source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: pt
  text: E, meu pai, veja — sim, veja a borda do seu manto na minha mão.[a] Pois, quando cortei a borda do seu manto, não o matei. Saiba e veja que não há maldade nem rebelião na minha mão,[b] e que não pequei contra você, embora você esteja caçando a minha vida para tirá-la.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a ponta do seu manto” ou “a aba do seu manto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não há maldade nem transgressão na minha mão”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “você está caçando a minha vida para tomá-la”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבִי
  choice: E, meu pai
  rationale: Mantém a conjunção e a forma de tratamento deferente e familiar-política usada por Davi ao dirigir-se a Saul.
- source_word: רְאֵה גַּם רְאֵה
  choice: veja — sim, veja
  rationale: A repetição com גַּם é enfática; esta formulação conserva a insistência sem soar arcaica.
- source_word: כְּנַף מְעִילְךָ
  choice: a ponta do seu manto
  rationale: כָּנָף designa aqui a extremidade da veste; “ponta” é concreta e natural em português, enquanto “manto” representa adequadamente מְעִיל no contexto.
- source_word: בְּיָדִי
  choice: na minha mão
  rationale: Preserva tanto a prova física que Davi exibe quanto a repetição posterior da imagem da mão como esfera de ação ou poder.
- source_word: כִּי בְּכָרְתִי
  choice: Pois, quando cortei
  rationale: כִּי introduz a explicação, e a construção é expressa naturalmente em português por “quando cortei”.
- source_word: וְלֹא הֲרַגְתִּיךָ
  choice: não o matei
  rationale: Tradução direta e corrente do perfeito negado, com o pronome retomando Saul.
- source_word: דַּע וּרְאֵה
  choice: Saiba e veja
  rationale: Conserva os dois imperativos e o apelo de Davi para que Saul reconheça a evidência e sua implicação moral.
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: não há maldade nem rebelião na minha mão
  rationale: “Na minha mão” preserva o vínculo verbal com a prova física mencionada antes. פֶשַׁע admite “transgressão” ou “rebelião”; diante do rei, “rebelião” expressa bem a dimensão política sem eliminar a dimensão moral.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: não pequei contra você
  rationale: Mantém o peso moral-religioso de חטא e expressa de modo claro a ofensa dirigida contra uma pessoa.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: embora você esteja caçando a minha vida para tirá-la
  rationale: Preserva a metáfora de caça de צדה, a referência de נֶפֶשׁ à vida e o pronome feminino que a retoma.
theological_decisions:
- issue: Nuance moral e política de פֶשַׁע na negação de Davi diante de Saul
  choice: rebelião
  alternative: transgressão
  rationale: O contexto envolve a acusação implícita de deslealdade ao rei, de modo que “rebelião” preserva a dimensão político-moral do termo. A alternativa “transgressão” permanece lexicalmente possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem arcaísmos. A repetição enfática dos imperativos e a imagem recorrente da “mão” foram mantidas. “Você” torna a referência pessoal clara sem introduzir um título ausente no hebraico; o tratamento respeitoso já aparece em “meu pai”.
