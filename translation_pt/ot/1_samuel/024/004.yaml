base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: pt
  text: Ele chegou aos currais de ovelhas junto ao caminho, onde havia uma caverna. Saul entrou para fazer suas necessidades[a]. Davi e seus homens estavam sentados nas partes mais profundas da caverna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cobrir os pés”, expressão idiomática hebraica para fazer as necessidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: currais de ovelhas
  rationale: A expressão designa cercados destinados às ovelhas. “Currais de ovelhas” é concreta, clara e natural em português.
- source_word: עַל הַדֶּרֶךְ
  choice: junto ao caminho
  rationale: A expressão situa os currais ao lado da rota percorrida por Saul; “junto ao caminho” conserva essa relação espacial.
- source_word: מְעָרָה
  choice: uma caverna
  rationale: É o equivalente comum e direto do substantivo hebraico neste contexto.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: para fazer suas necessidades
  rationale: O hebraico traz literalmente “cobrir os pés”, um eufemismo cujo sentido é fazer as necessidades fisiológicas. A tradução comunica o significado com discrição e clareza, enquanto a nota preserva a forma literal.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: nas partes mais profundas da caverna
  rationale: יַרְכְּתֵי indica as regiões mais remotas ou interiores. A formulação preserva a força espacial e esclarece que Davi e seus homens estavam longe da entrada.
- source_word: יֹשְׁבִים
  choice: estavam sentados
  rationale: O particípio descreve a posição ou situação imediata dos homens dentro da caverna, não residência prolongada.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: Ele chegou ... Saul entrou
  rationale: O primeiro verbo dá continuidade ao deslocamento; o segundo descreve a entrada de Saul na caverna. A variação é natural em português e mantém a sequência narrativa.
