base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: pt
  text: 'Hoje você mostrou o bem que me fez: Yahweh me entregou em sua mão[a], e você não me matou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh me entregou em suas mãos”. O hebraico diz literalmente “Yahweh me entregou em sua mão”; “mão” é singular e pode representar o poder ou controle de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: mostrou
  rationale: Embora o hifil de נגד normalmente signifique “contar, declarar, dar a conhecer”, neste contexto a ação de Davi tornou evidente o bem praticado; “mostrou” expressa naturalmente esse valor em português.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto e natural.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: o bem que fez a mim
  rationale: Preserva de perto a construção hebraica e o sentido de ação benéfica, sem restringi-la interpretativamente a “bondade” ou “misericórdia”.
- source_word: סִגְּרַנִי
  choice: me entregou
  rationale: Neste contexto, סגר descreve colocar alguém sob o poder de outra pessoa. “Entregou” comunica isso com clareza, enquanto a nota preserva a metáfora hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיָדְךָ
  choice: em suas mãos
  rationale: Conserva a metáfora hebraica de estar sob o poder de alguém e soa natural em português.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: você não me matou
  rationale: Tradução direta, clara e contemporânea do verbo הרג negado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Agência divina na entrega de Saul
  choice: quando Yahweh me entregou em suas mãos
  alternative: quando Yahweh permitiu que eu caísse em suas mãos
  rationale: Mantém a afirmação direta do hebraico sobre a ação de Yahweh, sem atenuá-la para mera permissão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” explicita a segunda pessoa masculina singular do contexto. A ordem foi ajustada levemente para fluidez, preservando a relação entre a demonstração do bem e o fato de Davi não matar Saul.
