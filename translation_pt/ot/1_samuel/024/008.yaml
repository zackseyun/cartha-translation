base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: pt
  text: Davi conteve seus homens com palavras e não permitiu que se levantassem contra Saul.[a] Então Saul se levantou da caverna e seguiu seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Davi repreendeu severamente seus homens com palavras”. O verbo hebraico é raro e pode ter um sentido mais forte do que simplesmente conter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: conteve
  rationale: O verbo é raro e difícil. No contexto, Davi impede energicamente seus homens de agir contra Saul; “conteve” comunica o resultado sem impor ao texto uma imagem literal incerta.
- source_word: אֲנָשָׁיו
  choice: seus homens
  rationale: Refere-se aos seguidores de Davi que estavam com ele na caverna; esta é a forma mais natural e precisa em português.
- source_word: בַּדְּבָרִים
  choice: com palavras
  rationale: 'Preserva o sentido instrumental: Davi os conteve por meio de uma intervenção verbal.'
- source_word: וְלֹא נְתָנָם
  choice: e não permitiu
  rationale: נתן seguido de infinitivo pode expressar permissão; a formulação é clara e atual.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: que se levantassem contra Saul
  rationale: Mantém a imagem verbal de קום e o sentido hostil de אֶל neste contexto, sem reduzir a expressão necessariamente a um ataque já iniciado.
- source_word: קָם מֵהַמְּעָרָה
  choice: saiu da caverna
  rationale: Embora literalmente contenha “levantou-se”, no fluxo narrativo a expressão indica que Saul se levantou e deixou a caverna. “Saiu” soa mais natural em português, ainda que não preserve a repetição de קום.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: seguiu seu caminho
  rationale: Equivalente idiomático natural de “foi pelo/no caminho”, comunicando que Saul retomou sua jornada.
