reference: 1 Samuel 24:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: pt
  text: Agora, jure-me por Yahweh que você não eliminará os meus descendentes depois de mim[a] e que não apagará o meu nome da casa de meu pai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “se eliminares”; na fórmula de juramento, “se” introduz o compromisso que Saul pede a David, aqui expresso como “que não eliminará”. “Descendentes” também pode ser traduzido por “posteridade”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “meu nome” se refere à continuidade e à memória da linhagem de Saul dentro de sua família ou clã paterno.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição para o pedido conclusivo de Saul; em português atual, “Agora” é natural, sem necessidade de reproduzir mecanicamente a conjunção inicial.
- source_word: הִשָּׁבְעָה לִּי
  choice: jure-me
  rationale: O imperativo nifal de שבע com objeto indireto exprime diretamente o pedido para prestar juramento; “jure-me” é conciso e idiomático.
- source_word: בַּיהוָה
  choice: por Yahweh
  rationale: A preposição introduz aquele por quem se presta o juramento, e o nome divino é transliterado como “Yahweh”.
- source_word: אִם ... וְאִם
  choice: que não ... e que não
  rationale: Nesta fórmula de juramento, אִם introduz o compromisso negativo solicitado, não uma condição comum. A construção portuguesa explicita esse valor sem criar uma frase incompleta.
- source_word: תַּכְרִית
  choice: eliminará
  rationale: O hifil de כרת significa literalmente “cortar” e, neste contexto dinástico, refere-se a fazer desaparecer ou exterminar uma linhagem. “Eliminar” comunica isso naturalmente.
- source_word: זַרְעִי
  choice: os meus descendentes
  rationale: זֶרַע designa aqui a posteridade de Saul, não semente literal; “descendentes” é claro e preciso.
- source_word: אַחֲרָי
  choice: depois de mim
  rationale: A expressão tem sentido temporal, referindo-se ao período posterior à morte de Saul.
- source_word: תַּשְׁמִיד
  choice: apagará
  rationale: O hifil de שמד indica destruição completa; com “nome”, “apagar” preserva a imagem de extinguir a memória e continuidade familiar.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: Mantém a expressão hebraica, que abrange identidade, memória e continuidade da linhagem.
- source_word: מִבֵּית אָבִי
  choice: da casa de meu pai
  rationale: Preserva a expressão de parentesco hebraica para a família ou clã paterno de Saul em linguagem portuguesa compreensível.
theological_decisions:
- issue: Representação do nome divino יהוה na fórmula de juramento
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Força negativa da fórmula com אִם
  choice: que não eliminará ... e que não apagará
  alternative: se eliminar ... e se apagar
  rationale: Em fórmulas de juramento, אִם pode introduzir de modo elíptico aquilo que se jura não fazer. Como Saul pede a David uma garantia, a forma negativa expressa o sentido contextual sem transformar o pedido em condição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as imagens familiares do hebraico, mas verte idiomaticamente a fórmula elíptica de juramento.
