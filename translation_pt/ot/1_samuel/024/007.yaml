base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: pt
  text: 'E disse aos seus homens: “Longe de mim, por causa de Yahweh[a], que eu faça tal coisa ao meu senhor, ao ungido de Yahweh, que eu estenda a mão contra ele, pois ele é o ungido de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais tradicional: “Yahweh me livre de fazer isso”. O idioma hebraico expressa forte repulsa diante de tal ato em relação a Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Longe de mim, por causa de Yahweh
  rationale: A expressão idiomática comunica forte repulsa e recusa. “Por causa de Yahweh” expressa que a reverência a Yahweh fundamenta a recusa de Davi, sem atribuir ao hebraico uma ideia espacial pouco natural em português.
- source_word: אִם אֶעֱשֶׂה
  choice: fazer
  rationale: Depois de חָלִילָה, אִם integra uma fórmula enfática de repúdio; a construção portuguesa “Longe de mim... fazer” transmite naturalmente esse valor.
- source_word: הַדָּבָר הַזֶּה
  choice: tal coisa
  rationale: דָּבָר designa aqui a ação cogitada. “Tal coisa” é idiomático em português e conserva a referência ampla do hebraico.
- source_word: לַאדֹנִי
  choice: ao meu senhor
  rationale: Preserva o tratamento respeitoso dado por Davi a Saul, sem antecipar a noção hostil, explicitada na frase seguinte.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: o ungido de Yahweh
  rationale: מָשִׁיחַ refere-se ao rei consagrado por unção. “Ungido” mantém a força régia e sacral sem introduzir associações messiânicas posteriores indevidas.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: estendendo a mão contra ele
  rationale: Mantém a imagem concreta do idioma hebraico e deixa claro seu sentido de ação hostil ou violenta.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: pois ele é o ungido de Yahweh
  rationale: כִּי apresenta a razão da recusa. A repetição de “ungido de Yahweh” reproduz a ênfase do texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução de מְשִׁיחַ com referência a Saul
  choice: o ungido de Yahweh
  alternative: o Messias de Yahweh
  rationale: Neste contexto, o termo indica Saul como rei consagrado por Yahweh. “Messias” poderia sugerir associações cristológicas posteriores que o contexto imediato não exige.
- issue: Relação de מֵיְהוָה com a recusa de Davi
  choice: por causa de Yahweh
  alternative: da parte de Yahweh / Yahweh me livre
  rationale: A formulação apresenta a relação com Yahweh como fundamento da forte recusa, preservando a tensão do idioma sem afirmar mais especificamente que se trata de uma proibição verbal direta de Deus.
translation_notes:
  register: Português atual, digno e de leitura natural, com ampla inteligibilidade brasileira. A construção conserva a repetição enfática do hebraico e o tratamento reverente de Saul como “meu senhor”.
