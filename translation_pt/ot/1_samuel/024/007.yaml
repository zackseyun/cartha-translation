revisions:
- from: 'E disse aos seus homens: “Longe de mim, por causa de Yahweh, fazer tal coisa ao meu senhor, o ungido de Yahweh, estendendo a mão contra ele, pois ele é o ungido de Yahweh”.[a]'
  to: 'E disse aos seus homens: “Longe de mim, por causa de Yahweh[a], que eu faça tal coisa ao meu senhor, ao ungido de Yahweh, que eu estenda a mão contra ele, pois ele é o ungido de Yahweh.”'
  rationale: A revisão preserva a leitura adotada para חָלִילָה לִּי מֵיְהוָה («por causa de Yahweh»), mas dá à frase uma forma portuguesa mais idiomática. Substitui-se o gerúndio por uma oração com «que eu estenda», para refletir o infinitivo hebraico que identifica a ação recusada. A repetição de «o ungido de Yahweh» e o tratamento respeitoso «meu senhor» são mantidos.
