    issue: «estendendo a mão contra ele» usa gerúndio onde o hebraico emprega o infinitivo לִשְׁלֹחַ.
    rationale: O infinitivo especifica o ato repudiado, em coordenação explicativa com «fazer tal coisa». «Que eu estenda a mão» reproduz melhor essa relação e é mais claro em português.
  - severity: low
    issue: A construção «Longe de mim, por causa de Yahweh, fazer...» é pouco natural.
    rationale: O hebraico é uma fórmula idiomática de repúdio. Em português, «Longe de mim ... que eu faça» expressa naturalmente a mesma força sem resolver de modo excessivo a nuance de מִן.
  - severity: low
    issue: A âncora da nota aparece no fim do versículo, embora a nota explique a fórmula inicial.
    rationale: A âncora deve seguir «Yahweh» na expressão idiomática, facilitando a identificação do trecho comentado.
