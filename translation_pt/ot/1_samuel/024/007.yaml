  source_fidelity: 'O sentido central está bem preservado: Davi rejeita agir contra Saul em razão de Yahweh e repete deliberadamente que Saul é «o ungido de Yahweh». Contudo, o gerúndio «estendendo a mão» enfraquece a relação sintática do infinitivo hebraico לִשְׁלֹחַ, que explicita o ato que ele se recusa a praticar.'
  naturalness: «Longe de mim, por causa de Yahweh, fazer...» é compreensível, mas fica truncado no português atual. A construção com «que eu faça» é mais fluente e mantém o valor enfático de repúdio. A pontuação e a posição da nota também foram ajustadas para ancorar a nota no idiomatismo a que ela se refere.
  terminology: «Yahweh», «meu senhor» e «o ungido de Yahweh» são adequados. «Ungido» evita corretamente introduzir associações messiânicas posteriores no título de Saul.
  issues:
