reference: 1 Samuel 24:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: pt
  text: Que Yahweh julgue entre mim e você e que Yahweh me vingue de você[a]; mas eu não levantarei a mão contra você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: «execute vingança por mim contra você».'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «mas a minha mão não estará contra você», expressão hebraica que indica abster-se de uma ação hostil.'
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Que ... julgue
  rationale: O yiqtol tem força volitiva neste apelo de Davi; «Que ... julgue» expressa um desejo ou invocação, não uma simples previsão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre mim e você
  rationale: Mantém o contraste pessoal explícito e a linguagem judicial do hebraico.
- source_word: וּנְקָמַנִי ... מִמֶּךָּ
  choice: e que Yahweh me vingue de você
  rationale: Preserva o sentido forte de נקם e apresenta Yahweh como aquele a quem Davi entrega a vingança; em português, «vingar alguém de alguém» comunica que a vingança é exercida em favor da pessoa ofendida.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: mas eu não levantarei a mão contra você
  rationale: Expressa com naturalidade o idiomatismo hebraico pelo qual a «mão» representa ação hostil ou violência pessoal, mantendo a imagem corporal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino; a transliteração preserva o caráter pessoal do nome sem o substituir por um título.
- issue: Natureza do apelo de Davi por נקם
  choice: Davi pede que Yahweh o vingue, enquanto renuncia à violência pessoal
  alternative: Davi pede apenas uma vindicação judicial abstrata
  rationale: נקם possui sentido de vingança, e o contraste com a mão de Davi que não se levantará contra Saul deve permanecer, sem suavizar a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Você» evita regionalizar excessivamente a fala; a repetição de «Yahweh» acompanha a ênfase do hebraico. A expressão idiomática final foi tornada natural no texto, com a forma literal registrada em nota.
