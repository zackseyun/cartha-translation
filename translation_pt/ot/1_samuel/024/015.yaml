  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: pt
  text: Atrás de quem saiu o rei de Israel? A quem você está perseguindo[a]? Atrás de um cão morto, atrás de uma única pulga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Contra quem saiu o rei de Israel? A quem você está perseguindo?” O hebraico repete “atrás de” com o sentido de perseguição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: Atrás de quem
  rationale: אַחֲרֵי significa literalmente “atrás de” e, neste contexto, indica o alvo de uma perseguição. A formulação preserva a repetição retórica do hebraico sem perder a clareza em português.
- source_word: יָצָא
  choice: saiu
  rationale: O verbo significa “sair”. A tradução direta também sugere que o rei partiu em campanha, sentido dado pelo contexto.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: A formulação direta conserva a dignidade do título e reforça o contraste irônico entre a posição de Saul e a insignificância com que Davi se descreve.
- source_word: אַתָּה רֹדֵף
  choice: você está indo [atrás de]
  rationale: A construção portuguesa com “ir atrás de” comunica perseguição e permite conservar o אַחֲרֵי repetido, embora “perseguir” seja uma alternativa mais explícita.
- source_word: כֶּלֶב מֵת
  choice: um cão morto
  rationale: A tradução literal preserva a forte autodepreciação de Davi e é clara em português atual.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: uma única pulga
  rationale: “Única” expressa a ênfase de אֶחָד na pequenez e insignificância do alvo.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: Atrás de ... Atrás de ... Atrás de ... atrás de ...
  rationale: A repetição cria a cadência retórica do versículo e ressalta o absurdo da perseguição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição deliberada de “atrás de” conserva a estrutura e a ironia do hebraico; “cão” mantém um tom ligeiramente mais solene que “cachorro”.
