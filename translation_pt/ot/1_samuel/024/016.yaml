base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/016.yaml
  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: pt
  text: Que o SENHOR seja juiz e julgue entre mim e você; que ele veja, defenda a minha causa e me faça justiça, livrando-me da sua mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה יְהוָה לְדַיָּן
  choice: Que o SENHOR seja juiz
  rationale: Reproduz a invocação volitiva do hebraico em português natural e verte o nome divino segundo a convenção editorial em versalete.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: e julgue entre mim e você
  rationale: Mantém a repetição jurídica da raiz שׁפט e a formulação relacional do original, sem substituir o segundo verbo por uma interpretação mais específica.
- source_word: וְיֵרֶא וְיָרֵב אֶת רִיבִי
  choice: que ele veja, defenda a minha causa
  rationale: 'Preserva os dois verbos coordenados: Deus vê a situação e assume a defesa da causa de Davi.'
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: e me faça justiça, livrando-me da sua mão
  rationale: Expressa o sentido judicial de שׁפט com o complemento idiomático מִיָּדֶךָ; 'livrando-me' explicita naturalmente a força de resgate ou vindicação sem atribuir culpa além do texto.
theological_decisions:
- issue: Papel de Deus no conflito entre Davi e Saul
  choice: Manter Deus como juiz, defensor da causa e agente de justiça
  alternative: Reduzir a frase a um simples pedido de libertação
  rationale: A linguagem jurídica tripla do hebraico é teologicamente significativa e deve permanecer visível.
- issue: Força de וְיִשְׁפְּטֵנִי
  choice: me faça justiça
  alternative: me vingue
  rationale: '''Fazer justiça'' preserva a vindicação judicial sem sugerir necessariamente vingança pessoal, sentido que o contexto não exige.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de 'juiz/julgue' foi mantida por refletir deliberadamente a raiz hebraica; 'você' comunica com naturalidade o singular de segunda pessoa no português brasileiro.
