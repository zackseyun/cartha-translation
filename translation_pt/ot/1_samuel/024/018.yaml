base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: pt
  text: 'E ele disse a Davi: “Você é mais justo do que eu[a], pois você me retribuiu com o bem, enquanto eu lhe retribuí com o mal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você tem mais razão do que eu.”'
    reason: Alternativa lexical que explicita o sentido forense ou relacional possível de צַדִּיק neste contexto.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: E ele disse a Davi
  rationale: Mantém a forma narrativa e o pronome do hebraico; embora o contexto identifique Saul, a oração diz apenas “ele”.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: Você é mais justo do que eu
  rationale: Expressa naturalmente a comparação com מִן e preserva a dimensão moral de צַדִּיק, sem excluir o sentido contextual de estar mais com a razão.
- source_word: כִּי
  choice: pois
  rationale: Introduz o fundamento explicativo da declaração anterior em português natural e digno.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: você me retribuiu com o bem
  rationale: “Retribuiu” comunica o valor de גמל e permite conservar o paralelismo lexical e a oposição entre “bem” e “mal”.
- source_word: וַאֲנִי גְּמַלְתִּיךָ הָרָעָה
  choice: enquanto eu lhe retribuí com o mal
  rationale: “Enquanto” explicita o contraste presente na coordenação, e a repetição de “retribuí” reproduz a estrutura retórica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “você” evita arcaísmo, e “lhe” mantém naturalidade na segunda oração. A repetição de “retribuiu/retribuí” e o contraste “bem/mal” preservam o paralelismo do hebraico.
