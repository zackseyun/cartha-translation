base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: pt
  text: 'Quando Davi terminou de dizer essas palavras a Saul, Saul disse: “É esta a sua voz, meu filho Davi?” Então Saul ergueu a voz e chorou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת דָּוִד לְדַבֵּר
  choice: Quando Davi terminou de dizer
  rationale: A construção temporal com היה, כְּ e o infinitivo de כלה indica que a ação seguinte ocorreu quando Davi concluiu sua fala. A formulação é natural em português e preserva a sequência narrativa.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: דְּבָרִים pode significar “palavras”, “coisas” ou “assuntos”; neste contexto de discurso, “palavras” expressa com precisão o referente verbal. “Essas” retoma naturalmente em português o que Davi acabara de dizer.
- source_word: הֲקֹלְךָ זֶה
  choice: É esta a sua voz?
  rationale: קוֹל designa aqui a voz reconhecível de Davi. A pergunta mantém o demonstrativo proximal זֶה e o tom de reconhecimento emocionado.
- source_word: בְּנִי דָוִד
  choice: meu filho Davi
  rationale: Preserva literalmente a linguagem filial usada por Saul, com ordem natural em português.
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ
  choice: Saul ergueu a voz
  rationale: Mantém a imagem do idioma hebraico, que neste contexto introduz uma manifestação audível de forte emoção.
- source_word: וַיֵּבְךְּ
  choice: e chorou
  rationale: O verbo בכה denota especificamente chorar ou derramar lágrimas; “chorou” é preciso e corrente em português.
theological_decisions:
- issue: 'A forma de tratamento de Saul: “meu filho Davi”'
  choice: Mantida como linguagem relacional e retórica
  alternative: Entendê-la apenas como fórmula política de favor ou patronagem
  rationale: O hebraico emprega explicitamente linguagem filial. A tradução preserva seu valor afetivo e social no contexto, sem convertê-la em afirmação de filiação literal nem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A expressão “ergueu a voz” conserva o colorido do idioma hebraico sem impedir a compreensão pelo contexto imediato (“e chorou”).
