base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: pt
  text: Pois, quando um homem encontra seu inimigo, será que o deixa seguir seu caminho em segurança?[a] Que Yahweh te retribua com o bem[b] pelo que fizeste por mim neste dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o manda embora em paz” / “o deixa ir em segurança”. O hebraico diz literalmente “por/em um bom caminho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh te retribuirá com o bem”. A forma hebraica pode ser entendida como desejo ou bênção, ou como declaração do que acontecerá.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Pois, quando... será que...?
  rationale: No contexto, introduz uma pergunta retórica que fundamenta as palavras de Saul; “pois” mantém a ligação explicativa, e “quando” apresenta a situação geral.
- source_word: יִמְצָא אִישׁ
  choice: um homem encontra
  rationale: Mantém o singular masculino genérico do hebraico em português natural.
- source_word: אֶת אֹיְבוֹ
  choice: seu inimigo
  rationale: Correspondência direta e idiomática do substantivo com sufixo masculino singular.
- source_word: וְשִׁלְּחוֹ
  choice: o deixa seguir
  rationale: Expressa naturalmente a ideia contextual de poupar e liberar alguém que estava em seu poder.
- source_word: בְּדֶרֶךְ טוֹבָה
  choice: seguir seu caminho em segurança
  rationale: Traduz o sentido idiomático da expressão, literalmente “por um bom caminho”, preservando também a imagem de deixar alguém prosseguir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: Que Yahweh lhe retribua com o bem
  rationale: Lê o yiqtol como desejo ou bênção no discurso de Saul; “retribua” preserva o sentido de dar em retorno, e “com o bem” mantém o substantivo hebraico.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: pelo que você fez por mim hoje
  rationale: Formula em português corrente a ideia de recompensa correspondente à ação de Davi naquele dia; “por mim” comunica que Saul foi beneficiado pela clemência.
theological_decisions:
- issue: Forma verbal יְשַׁלֶּמְךָ como bênção ou previsão
  choice: Que Yahweh lhe retribua com o bem
  alternative: Yahweh lhe retribuirá com o bem
  rationale: No discurso de Saul, a forma pode ser entendida como desejo de recompensa ou como afirmação futura. O texto principal adota a bênção, e a nota conserva a leitura preditiva.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome pessoal divino; a tradução o representa diretamente por transliteração.
- issue: Força interrogativa da primeira oração
  choice: será que o deixa seguir seu caminho em segurança?
  alternative: e o deixa seguir seu caminho em segurança
  rationale: 'O contexto favorece uma pergunta retórica: normalmente, quem encontra o inimigo em seu poder não o libera ileso. A formulação não transforma a frase em uma regra afirmativa.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais tanto no Brasil como em outros contextos lusófonos. A pergunta retórica foi explicitada por “será que”, e as notas preservam a expressão hebraica e a ambiguidade modal do verbo.
