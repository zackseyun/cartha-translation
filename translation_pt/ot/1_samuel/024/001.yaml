lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido direcional de עלה e soa natural na sequência narrativa.
- source_word: מִשָּׁם
  choice: dali
  rationale: Equivalente português conciso e idiomático para o advérbio dêitico 'de lá'.
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: Neste contexto de deslocamento, expressa permanência temporária sem sugerir estabelecimento definitivo.
- source_word: בִּמְצָדוֹת
  choice: nas fortalezas
  rationale: מצדות designa lugares defensáveis ou redutos; 'fortalezas' preserva essa ideia sem acrescentar que fossem necessariamente estruturas militares construídas.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Transliteração corrente do topônimo hebraico, em vez de tradução do nome.
