base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: pt
  text: 'Depois disso, Davi se levantou, saiu da caverna e chamou Saul, que estava à frente: “Meu senhor, o rei!” Quando Saul olhou para trás, Davi se curvou com o rosto em terra e se prostrou.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prestou-lhe homenagem”. O verbo hebraico pode indicar prostração em profunda reverência ou submissão; aqui descreve a postura de Davi diante de Saul, não adoração divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד אַחֲרֵי כֵן
  choice: Depois disso, Davi se levantou
  rationale: Mantém a sequência temporal e o sentido narrativo comum de קום, em português natural.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: saiu da caverna
  rationale: Traduz diretamente יצא e מן־המערה, sem acrescentar perspectiva ausente no hebraico.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: chamou Saul por trás
  rationale: אַחֲרֵי indica que Davi chamou Saul quando este estava adiante; a formulação preserva essa relação espacial de modo compreensível.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Meu senhor, o rei!
  rationale: Preserva tanto o tratamento pessoal respeitoso אֲדֹנִי quanto o título real הַמֶּלֶךְ.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: Quando Saul olhou para trás
  rationale: A oração temporal liga naturalmente o olhar de Saul à reação de Davi; 'para trás' expressa אַחֲרָיו no contexto.
- source_word: וַיִּקֹּד ... וַיִּשְׁתָּחוּ
  choice: se curvou ... e se prostrou
  rationale: Distingue as duas ações sucessivas e conserva a intensidade corporal da segunda.
- source_word: אַפַּיִם אַרְצָה
  choice: com o rosto em terra
  rationale: Reproduz de maneira idiomática a postura de profunda deferência indicada pela expressão hebraica.
theological_decisions:
- issue: Natureza do gesto de Davi diante de Saul
  choice: Profunda reverência e submissão expressas corporalmente, sem implicar adoração divina
  alternative: “adorou” ou “prestou homenagem”
  rationale: שׁחה pode designar adoração a Deus ou reverência diante de seres humanos, conforme o contexto. Como o destinatário aqui é Saul, 'se prostrou' preserva o gesto físico sem resolver o verbo como culto divino.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva a repetição espacial de “por trás/para trás” presente no hebraico e distingue os dois verbos de inclinação corporal.
