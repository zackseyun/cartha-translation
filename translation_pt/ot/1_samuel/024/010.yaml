reference: 1 Samuel 24:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: pt
  text: 'E Davi disse a Saul: “Por que você dá ouvidos às palavras de um homem[a] que diz: ‘Veja, Davi procura fazer mal a você[b]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às palavras humanas”. O singular hebraico pode ter sentido humano mais geral, embora aqui provavelmente se refira a um acusador.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “busca o seu mal”. A expressão hebraica pode indicar buscar o mal ou o dano de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “E ... disse” conserva o fluxo hebraico sem especificar uma relação temporal ou lógica mais forte.
- source_word: לְשָׁאוּל
  choice: a Saul
  rationale: A preposição לְ marca o destinatário da fala; “Saul” é a forma tradicional do nome em português.
- source_word: לָמָּה
  choice: Por que
  rationale: É a forma interrogativa direta, natural e fiel ao hebraico.
- source_word: תִשְׁמַע
  choice: você dá ouvidos
  rationale: Neste contexto, שׁמע significa prestar atenção ou aceitar o que é dito, não apenas perceber sons. “Dar ouvidos” expressa esse sentido em português corrente.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: às palavras de um homem
  rationale: Mantém o singular אָדָם e sua provável referência a um acusador, sem eliminar a possível leitura mais geral de palavras humanas.
- source_word: לֵאמֹר
  choice: que diz
  rationale: O infinitivo introduz o conteúdo citado. Depois de “um homem”, a oração relativa é mais natural em português e preserva a relação sintática provável.
- source_word: הִנֵּה
  choice: Veja
  rationale: Funciona como chamada de atenção em linguagem moderna, sem o tom arcaico de “eis” ou “eis que”.
- source_word: מְבַקֵּשׁ
  choice: procura
  rationale: O verbo comunica busca ou intenção persistente; o presente português expressa naturalmente a ação caracterizadora do particípio hebraico.
- source_word: רָעָתֶךָ
  choice: fazer mal a você
  rationale: רָעָה pode indicar mal, dano ou desgraça. A expressão verbal comunica em português natural a acusação de que Davi pretende prejudicar Saul.
theological_decisions:
- issue: Sentido de אָדָם
  choice: um homem
  alternative: ser humano; pessoas
  rationale: A forma hebraica é singular e, no contexto, pode apontar para um acusador individual. A nota preserva a possibilidade de um sentido humano mais geral sem transformar silenciosamente o singular em plural.
- issue: Amplitude semântica de רָעָה
  choice: fazer mal a você
  alternative: buscar o seu mal; procurar prejudicar você
  rationale: A escolha não define se a acusação é sobretudo moral, física ou política; apenas comunica que Davi estaria buscando dano contra Saul.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Dar ouvidos” comunica o sentido de acolher ou seguir uma fala; “fazer mal a você” evita linguagem arcaica e mantém clara a acusação.
