  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: pt
  text: E agora, veja, sei que certamente reinará, e o reino de Israel será estabelecido em sua mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva a ligação discursiva e temporal de forma natural em português.
- source_word: הִנֵּה
  choice: não representado por uma palavra isolada
  rationale: Aqui funciona como marcador enfático do reconhecimento de Saul; em português, sua tradução literal como “eis” ou “veja” soaria artificial neste contexto, e a ênfase permanece em “eu sei”.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: certamente reinará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação; “certamente” reproduz essa força.
- source_word: וְקָמָה
  choice: será estabelecido
  rationale: Expressa a ideia de o reino ficar firme, confirmado ou consolidado.
- source_word: בְּיָדְךָ
  choice: em suas mãos
  rationale: Mantém a metáfora hebraica de domínio e responsabilidade, usando uma expressão idiomática natural em português.
theological_decisions:
- issue: Certeza da futura realeza de Davi
  choice: “certamente reinará”
  alternative: “há de reinar”
  rationale: Mantém a forte certeza gramatical do hebraico sem acrescentar uma explicação sobre o modo da providência divina.
- issue: Estabelecimento do reino
  choice: 'voz passiva: “será estabelecido”'
  alternative: “se firmará”
  rationale: Preserva a abertura quanto ao agente que estabelece o reino e evita explicitar no texto o que o hebraico deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome “você” torna explícito o destinatário singular masculino indicado pelas formas hebraicas; “em suas mãos” conserva a imagem original.
