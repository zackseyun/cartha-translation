  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: pt
  text: 'Quando Saul voltou de perseguir os filisteus, disseram-lhe: “Olhe, Davi está no deserto de En-Gedi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: de perseguir os filisteus
  rationale: A expressão idiomática indica que Saul estava seguindo os filisteus em perseguição; a tradução explicita naturalmente esse sentido em português.
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: disseram-lhe
  rationale: O infinitivo לֵאמֹר introduz o conteúdo da fala e não precisa ser reproduzido como “dizendo” em português corrente.
- source_word: הִנֵּה
  choice: Olhe
  rationale: Preserva a função de chamar a atenção do ouvinte, em linguagem moderna e direta.
- source_word: מִדְבַּר עֵין גֶּדִי
  choice: deserto de En-Gedi
  rationale: מִדְבָּר designa aqui a região árida ou desértica associada a En-Gedi; “deserto” é claro e tradicional sem acrescentar informação.
