  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: pt
  text: Depois disso, o coração de Davi o feriu porque Davi havia cortado a ponta do manto de Saul.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o coração de Davi o feriu”, uma expressão que indica perturbação interior ou de consciência.'
    reason: lexical_alternative
  - marker: b
    text: Ou “a extremidade”, “a borda” ou “a bainha” do manto de Saul; o termo hebraico pode designar a extremidade de uma peça de roupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa com naturalidade a sequência temporal da fórmula narrativa hebraica, sem reproduzi-la de maneira rígida.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: o coração de Davi o acusou
  rationale: Mantém o coração como sujeito e comunica em português atual o sentido idiomático de uma consciência perturbada; uma tradução estritamente literal, como “feriu-o”, seria pouco clara neste contexto.
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem concreta hebraica e sua abrangência como centro da vida interior e da percepção moral.
- source_word: עַל אֲשֶׁר
  choice: por ter
  rationale: Introduz de modo idiomático a causa da acusação interior de Davi.
- source_word: כָּרַת
  choice: ter cortado
  rationale: O infinitivo composto situa corretamente o corte antes da reação interior de Davi e transmite o sentido de cortar ou separar.
- source_word: כָּנָף
  choice: ponta
  rationale: No contexto de uma peça de roupa, o termo designa uma extremidade; “ponta” preserva a amplitude do hebraico sem especificar indevidamente uma bainha.
- source_word: אֶת כְּנַף אֲשֶׁר לְשָׁאוּל
  choice: a ponta do manto de Saul
  rationale: “Manto” é suprido com base no contexto imediato, tornando explícito em português o referente que o hebraico deixa implícito.
