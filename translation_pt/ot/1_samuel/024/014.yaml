  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: pt
  text: 'Como diz o provérbio antigo[a]: “Dos perversos vem a perversidade”. Mas a minha mão não será contra você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como diz o provérbio dos antigos”. O adjetivo hebraico pode significar “antigo” ou referir-se aos “antigos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: Como diz
  rationale: A fórmula introduz uma citação proverbial; o presente expressa naturalmente o valor genérico do imperfeito hebraico.
- source_word: מְשַׁל הַקַּדְמֹנִי
  choice: o provérbio antigo
  rationale: מְשַׁל designa aqui uma máxima tradicional breve. הַקַּדְמֹנִי pode qualificar o provérbio como antigo ou relacioná-lo aos antigos; a primeira leitura é natural no texto, e a segunda é preservada em nota.
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: Dos perversos vem a perversidade
  rationale: A preposição marca a origem, e a formulação mantém a relação lexical e o efeito proverbial entre רְשָׁעִים e רֶשַׁע.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: Mas a minha mão não será contra você
  rationale: Mantém a imagem hebraica da mão como ação ou violência pessoal. O valor adversativo de וְ explicita o contraste contextual sem eliminar a metáfora.
