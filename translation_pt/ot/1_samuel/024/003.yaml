base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: pt
  text: Então Saul tomou três mil homens escolhidos de todo o Israel e foi procurar Davi e seus homens diante dos rochedos das cabras selvagens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Penhascos das cabras selvagens”; o animal talvez seja especificamente o íbex.'
    reason: Registra uma alternativa para צוּרֵי e a identificação zoológica mais específica possível para יְעֵלִים.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: No contexto da expedição militar, o verbo indica que Saul tomou consigo ou reuniu os homens; “tomou” mantém a forma direta do hebraico.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: três mil homens
  rationale: É a forma natural em português de expressar a contagem hebraica, preservando o referente humano e o contexto militar.
- source_word: בָּחוּר
  choice: escolhidos
  rationale: Aqui descreve homens selecionados para a missão, e não apenas jovens ou guerreiros em sentido genérico.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: de todo o Israel
  rationale: Indica que os homens foram escolhidos dentre o conjunto de Israel.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: foi procurar
  rationale: Expressa naturalmente em português tanto o movimento quanto a finalidade da ação, sem enfraquecer a ideia de busca.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: Davi e seus homens
  rationale: Tradução direta e idiomática para Davi e seus seguidores.
- source_word: עַל פְּנֵי
  choice: diante de
  rationale: A expressão espacial é literalmente “sobre a face de”, mas “diante de” comunica com naturalidade sua provável relação topográfica sem especificar excessivamente a posição.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: Rochedos das Cabras Selvagens
  rationale: A expressão parece designar um local conhecido. “Rochedos” representa a formação escarpada, e “cabras selvagens” é compreensível, enquanto a nota preserva as alternativas lexical e zoológica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção narrativa é concisa; as iniciais maiúsculas em “Rochedos das Cabras Selvagens” tratam a expressão como designação geográfica.
