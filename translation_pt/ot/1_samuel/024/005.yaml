review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a sequência narrativa, a dupla ênfase de הִנֵּה, o inimigo no singular, a natureza reportada da fala dos homens de Davi e o caráter furtivo da ação. Contudo, «nas suas mãos» pluraliza a expressão hebraica בְּיָדְךָ, que está no singular. «Em sua mão» preserva a imagem e o idiomatismo de entregar alguém ao poder de outra pessoa.
  naturalness: O registro é moderno, claro e adequado. «O dia sobre o qual Javé lhe disse» é compreensível, mas «o dia a respeito do qual Javé lhe disse» é mais natural e preciso em português neste contexto.
  terminology: «Javé», «manto», «ponta» e «às escondidas» são escolhas adequadas. A nota mantém de modo útil a alternativa idiomática para a expressão «aos seus olhos».
  issues:
