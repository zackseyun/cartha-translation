    issue: Número em «nas suas mãos»
    rationale: O hebraico בְּיָדְךָ significa literalmente «em tua mão», no singular. A forma singular pode ser mantida em português sem perda de clareza.
  - severity: low
    issue: Formulação «sobre o qual Javé lhe disse»
    rationale: Embora não esteja errada, «a respeito do qual Javé lhe disse» soa mais idiomático e explicita melhor a relação entre «o dia» e a fala citada.
