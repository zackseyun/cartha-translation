base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: pt
  text: 'Então os homens de Davi lhe disseram: “Veja! Este é o dia a respeito do qual Javé lhe disse: ‘Veja! Estou entregando seu inimigo em sua mão, e você poderá fazer com ele o que parecer bem aos seus olhos[a]’”. Então Davi se levantou e, às escondidas, cortou a ponta do manto de Saul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “o que você achar melhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד
  choice: Então os homens de Davi lhe disseram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez. A construção nominal designa os seguidores de Davi.
- source_word: הִנֵּה
  choice: Veja!
  rationale: A forma chama a atenção e dá ênfase dêitica. “Veja!” é atual e expressivo, sem o tom arcaico de “Eis”.
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, distinguindo-o do título “Senhor”.
- source_word: נֹתֵן אֶת איביך בְּיָדֶךָ
  choice: Estou entregando o seu inimigo nas suas mãos
  rationale: O particípio comunica ação vívida ou iminente. “Entregar nas mãos” reproduz de modo natural o idioma hebraico de colocar alguém sob o poder de outra pessoa; o contexto e os pronomes seguintes apontam para um inimigo singular.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: e você poderá fazer com ele
  rationale: No contexto, a oração apresenta a liberdade de agir após a entrega do inimigo, não necessariamente uma ordem; “poderá” preserva esse valor permissivo.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: o que parecer bem aos seus olhos
  rationale: Mantém a imagem hebraica e a ideia do que alguém considera bom ou apropriado, enquanto a nota oferece uma formulação mais idiomática.
- source_word: בַּלָּט
  choice: às escondidas
  rationale: O advérbio indica ação secreta ou furtiva; a expressão portuguesa comunica isso com naturalidade.
- source_word: כְּנַף הַמְּעִיל
  choice: a ponta do manto
  rationale: כָּנָף designa aqui uma extremidade, aba ou ponta da veste; “ponta” é clara sem especificar além do que o texto permite.
theological_decisions:
- issue: Se as palavras citadas constituem um oráculo anterior efetivamente pronunciado por Javé ou a interpretação dos homens de Davi
  choice: 'Preservar a afirmação dentro da fala dos homens: “o dia sobre o qual Javé lhe disse”.'
  alternative: Distanciar narrativamente a afirmação ou apresentá-la como promessa divina comprovada.
  rationale: O hebraico apenas relata o que os homens de Davi disseram. A tradução não confirma nem nega, por conta própria, a existência de um oráculo anterior específico, preservando a tensão narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O tratamento por “você” torna o discurso direto natural; a repetição enfática de “Veja!” e a imagem “aos seus olhos” preservam traços relevantes do hebraico.
