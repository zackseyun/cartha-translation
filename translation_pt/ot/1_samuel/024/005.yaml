  to: 'Então os homens de Davi lhe disseram: “Veja! Este é o dia a respeito do qual Javé lhe disse: ‘Veja! Estou entregando seu inimigo em sua mão, e você poderá fazer com ele o que parecer bem aos seus olhos[a]’”. Então Davi se levantou e, às escondidas, cortou a ponta do manto de Saul.'
