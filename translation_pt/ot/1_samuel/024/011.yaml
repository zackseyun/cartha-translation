  naturalness: O português é moderno, claro e de registro apropriado. «Foi dito para matar você» é uma impessoalidade natural o bastante neste contexto narrativo e conserva melhor a abertura sintática do hebraico do que «foi dito que eu matasse você».
  terminology: «Yahweh», «meu senhor» e «o ungido de Yahweh» são escolhas contextualmente adequadas. «Ungido» evita impor à referência régia de Saul um sentido messiânico posterior.
  issues:
