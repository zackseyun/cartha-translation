source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: pt
  text: 'Veja: hoje os seus próprios olhos viram que Yahweh entregou você em minha mão, na caverna, e foi dito para matar você.[a] Mas eu poupei você.[b] Eu disse: “Não estenderei a mão contra o meu senhor, pois ele é o ungido de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele disse para matar você”, “e alguém disse que eu deveria matar você” ou “e eu disse que mataria você”. O verbo hebraico está no singular, mas seu sujeito não é expresso.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “mas tive compaixão de você”. A forma hebraica é feminina e pode pressupor “meu olho” como sujeito: “mas meu olho poupou você”, isto é, olhei para você com compaixão e não o matei.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz um chamado enfático à atenção; “Veja” é atual e preserva a força dêitica sem o tom arcaico de “Eis”.
- source_word: רָאוּ עֵינֶיךָ
  choice: os seus próprios olhos viram
  rationale: Mantém a referência explícita aos olhos como testemunhas e comunica naturalmente a ênfase do hebraico.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: Yahweh entregou você nas minhas mãos
  rationale: A construção expressa colocar alguém sob o poder de outro. “Entregou ... nas minhas mãos” é idiomático em português e conserva a imagem hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: בַּמְּעָרָה
  choice: na caverna
  rationale: Tradução locativa direta e natural.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: e foi dito que eu matasse você
  rationale: O verbo singular não traz sujeito explícito. A construção impessoal conserva essa indeterminação sem introduzir com certeza um falante que o hebraico não identifica.
- source_word: וַתָּחָס עָלֶיךָ
  choice: mas eu poupei você
  rationale: No contexto, o verbo comunica que Davi não matou Saul; “poupei” exprime claramente o resultado, enquanto a nota registra a nuance de compaixão e a forma incomum do hebraico.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: Não estenderei a mão
  rationale: Preserva a imagem idiomática hebraica de agir hostilmente contra alguém e permanece compreensível em português.
- source_word: בַּאדֹנִי
  choice: contra o meu senhor
  rationale: Refere-se a Saul como superior humano e rei; “meu senhor” mantém o respeito político e cortesão do contexto.
- source_word: מְשִׁיחַ יְהוָה
  choice: o ungido de Yahweh
  rationale: Designa o rei consagrado por Yahweh. “Ungido” conserva a linguagem da unção real sem transformar aqui o termo em título escatológico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança segundo a convenção do projeto.
- issue: Sentido de מְשִׁיחַ יְהוָה na narrativa real
  choice: o ungido de Yahweh
  alternative: o Messias de Yahweh
  rationale: Neste contexto, a expressão se refere a Saul como rei consagrado. “Ungido” preserva a relevância teológica da unção sem impor ao versículo uma referência messiânica escatológica direta.
- issue: Agente de וְאָמַר e sujeito implícito de וַתָּחָס
  choice: Manter a indeterminação do primeiro verbo no texto e explicitar Davi como agente do ato de poupar
  alternative: “eu disse que mataria você, mas tive compaixão de você”; “alguém disse que eu deveria matar você, mas meu olho poupou você”
  rationale: 'A sintaxe hebraica é difícil: וְאָמַר é singular sem sujeito expresso, e וַתָּחָס apresenta uma forma feminina que pode pressupor “meu olho”. A tradução não identifica dogmaticamente o primeiro agente e comunica o sentido contextual do segundo, registrando as alternativas em notas.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” de modo coerente para o singular e preserva as imagens centrais de olhos, mãos e mão estendida. As notas foram colocadas junto às expressões a que realmente se referem, evitando a associação deslocada dos marcadores na camada inglesa.
