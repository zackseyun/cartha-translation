base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: pt
  text: Então Davi jurou a Saul. Depois, Saul foi para casa, mas Davi e seus homens subiram para a fortaleza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e Davi e seus homens subiram para a fortaleza». A conjunção hebraica significa simplesmente «e»; «mas» no texto torna explícito o contraste narrativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: fez um juramento
  rationale: O nifal de שׁבע significa jurar ou prestar juramento. A expressão é natural em português e explicita com clareza o ato solene de Davi.
- source_word: לְשָׁאוּל
  choice: a Saul
  rationale: A preposição ל indica aqui a pessoa perante quem ou a quem o juramento foi feito.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל בֵּיתוֹ
  choice: Depois, Saul foi para casa
  rationale: ביתו pode referir-se à casa ou ao lar de Saul. «Foi para casa» é a formulação narrativa mais natural em português moderno.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: mas Davi e seus homens
  rationale: Embora וְ signifique formalmente «e», «mas» torna explícito o contraste narrativo entre o destino de Saul e o de Davi. אֲנָשָׁיו refere-se aos homens que acompanhavam Davi.
- source_word: עָלוּ
  choice: subiram
  rationale: עלה expressa movimento ascendente; «subiram» preserva esse sentido de modo conciso e natural.
- source_word: הַמְּצוּדָה
  choice: a fortaleza
  rationale: מְצוּדָה designa um lugar fortificado ou refúgio defensivo. «Fortaleza» é claro, corrente e adequado ao contexto no deserto.
