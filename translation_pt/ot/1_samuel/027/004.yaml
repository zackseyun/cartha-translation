lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: Saul foi informado
  rationale: Preserva a construção passiva e não identifica quem transmitiu a notícia, em português natural.
- source_word: כִּי בָרַח דָּוִד גַּת
  choice: de que Davi havia fugido para Gate
  rationale: A oração apresenta o conteúdo da informação; o mais-que-perfeito situa a fuga antes da notícia, e «para» explicita naturalmente o destino implícito no hebraico.
- source_word: וְלֹא יֹסֶף עוֹד לְבַקְשׁוֹ
  choice: deixou de procurá-lo
  rationale: Expressa de modo corrente a cessação indicada pelo idioma יסף + עוד, sem a redundância pouco natural de «não continuou mais»; «procurar» mantém o sentido amplo de buscar localizar Davi.
