base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: pt
  text: Naquele dia, Aquis lhe deu Ziclague. Por isso, Ziclague tem pertencido aos reis de Judá até o dia de hoje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ziclague tem sido dos reis de Judá”; a expressão hebraica indica que a cidade permaneceu sob posse dos reis de Judá até o tempo do narrador.'
    reason: alternativa lexical e esclarecimento aspectual
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: deu
  rationale: No contexto narrativo, נתן tem o sentido comum de dar; a tradução é direta e natural.
- source_word: לּוֹ
  choice: lhe
  rationale: O sufixo pronominal masculino singular se refere a Davi no contexto imediato.
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal idiomática que preserva a referência específica do hebraico.
- source_word: צִקְלָג
  choice: Ziclague
  rationale: Forma tradicional e reconhecível do topônimo em português.
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo claro e natural a consequência da concessão feita por Aquis.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: passou a pertencer aos reis de Judá
  rationale: A construção com היה e ל indica aqui uma condição de posse resultante e continuada; esta formulação explicita naturalmente em português o início dessa relação sem perder sua continuidade.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente idiomático que conserva a perspectiva temporal retrospectiva do narrador.
theological_decisions:
- issue: Perspectiva histórica sugerida por “até o dia de hoje” e “reis de Judá”
  choice: Manter a observação retrospectiva do narrador sem explicar a história da composição.
  alternative: Explicitar que a frase reflete uma perspectiva posterior da monarquia de Judá.
  rationale: O hebraico apenas registra o fato retrospectivo; acrescentar uma teoria de autoria ou redação iria além do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Empregam-se as formas tradicionais Aquis e Ziclague. A formulação “passou a pertencer” equilibra o evento inicial com a posse continuada indicada por “até o dia de hoje”.
