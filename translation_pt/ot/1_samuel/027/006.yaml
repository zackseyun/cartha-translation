  naturalness: “Naquele dia, Aquis lhe deu Ziclague” é natural e clara. “Tem pertencido aos reis de Judá até o dia de hoje” é um pouco mais formal, mas é idiomática, clara e preserva adequadamente a continuidade indicada pelo texto.
  terminology: Aquis, Ziclague e Judá são formas portuguesas estabelecidas e adequadas. “Reis de Judá” mantém a formulação histórica e política do hebraico.
