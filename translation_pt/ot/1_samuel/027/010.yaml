base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: pt
  text: 'Então Aquis disse[a]: “Onde vocês fizeram uma incursão hoje?” Davi respondeu: “Contra o Neguebe de Judá, contra o Neguebe dos jerameelitas[b] e contra o Neguebe dos queneus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico diz literalmente algo como: “Vocês não fizeram uma incursão hoje?”. Contudo, pelo contexto, a frase tem sentido interrogativo: “Onde vocês fizeram uma incursão hoje?”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “o sul de Judá, o sul dos jerameelitas e o sul dos queneus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: Onde vocês fizeram uma incursão hoje?
  rationale: Embora o texto consonantal traga אַל, normalmente uma partícula negativa, o contexto narrativo e as versões antigas indicam uma pergunta sobre o lugar da incursão. “Fizeram uma incursão” comunica o sentido militar de פשט e mantém a segunda pessoa do plural do hebraico.
- source_word: נֶגֶב
  choice: Neguebe
  rationale: O termo pode significar “sul” ou designar a região árida meridional conhecida como Neguebe. Sua repetição com nomes territoriais e gentílicos favorece aqui a leitura geográfica, sem eliminar a alternativa lexical indicada em nota.
- source_word: עַל
  choice: contra
  rationale: No relato enganoso de Davi sobre os alvos de suas incursões, a preposição expressa ação hostil, e não apenas direção ou localização.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome tribal e territorial.
- source_word: הַיַּרְחְמְאֵלִי
  choice: os jerameelitas
  rationale: O gentílico designa o povo ou clã ligado a Jerameel; o plural é natural em português.
- source_word: הַקֵּינִי
  choice: os queneus
  rationale: O gentílico designa o povo queneu; “queneus” é a forma portuguesa bíblica amplamente reconhecida.
- source_word: וַיֹּאמֶר
  choice: disse / respondeu
  rationale: Na primeira ocorrência, “disse” preserva a formulação hebraica; na segunda, “respondeu” torna natural em português a sequência de pergunta e resposta sem alterar o conteúdo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e claro, com legibilidade brasileira. “Incursão” preserva o caráter militar da ação; “Neguebe” mantém a referência geográfica. A alternância entre “disse” e “respondeu” evita rigidez em português, enquanto o plural “vocês” reflete a forma verbal hebraica.
