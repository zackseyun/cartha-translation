translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A metáfora hebraica, pouco natural se reproduzida literalmente no corpo do versículo, é explicada em nota; a intensidade da construção original é mantida por “completamente”.
