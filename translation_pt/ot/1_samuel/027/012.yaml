base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: pt
  text: 'Aquis confiou em Davi, dizendo: “Ele certamente se fez odioso ao seu povo, Israel[a]; por isso, será meu servo para sempre[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “fez-se cheirar mal ao seu povo, Israel”, uma expressão idiomática para tornar-se detestável ou odioso.
    reason: lexical_alternative
  - marker: b
    text: “Servo” também pode ser traduzido por “escravo”; neste contexto, porém, a palavra pode enfatizar o serviço ou a dependência permanente de Davi em relação a Aquis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן אָכִישׁ בְּדָוִד
  choice: Aquis confiou em Davi
  rationale: O hifil de אמן com ב indica depositar confiança em alguém. Em português, “confiou em Davi” preserva naturalmente essa relação.
- source_word: לֵאמֹר
  choice: e disse
  rationale: O infinitivo quotativo introduz a fala ou o raciocínio de Aquis. “E disse” é natural no contexto narrativo e mantém a apresentação do conteúdo como discurso direto.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: se tornou completamente repulsivo
  rationale: A construção com infinitivo absoluto intensifica o verbo. O hebraico emprega literalmente a imagem de exalar mau cheiro como expressão idiomática de tornar-se detestável; a tradução principal comunica o sentido com naturalidade, enquanto a nota preserva a imagem.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: para o seu povo em Israel
  rationale: A preposição marca a relação de repulsa perante o grupo, e “em Israel” mantém o qualificativo nacional ou geográfico do texto hebraico.
- source_word: וְהָיָה לִי
  choice: por isso, será meu
  rationale: Neste contexto, a conjunção introduz a consequência que Aquis deduz da suposta ruptura de Davi com Israel.
- source_word: לְעֶבֶד
  choice: servo
  rationale: עבד pode significar servo ou escravo. Aqui, Aquis prevê a dependência e o serviço duradouros de Davi, possivelmente em sentido político ou vassálico, sem destacar necessariamente a condição de propriedade pessoal.
- source_word: עוֹלָם
  choice: para sempre
  rationale: A expressão comunica uma duração futura indefinida e permanente na expectativa de Aquis; “para sempre” é a equivalência portuguesa mais direta e idiomática.
