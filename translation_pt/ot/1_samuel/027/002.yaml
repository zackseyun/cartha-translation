base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/002.yaml
  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: pt
  text: Então Davi se levantou e atravessou, ele e os seiscentos homens que estavam com ele, para junto de Aquis, filho de Maoque, rei de Gate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal wayyiqtol de קום frequentemente introduz o início de uma ação decidida. “Se levantou” preserva o idioma narrativo hebraico sem reduzi-lo a “partiu”.
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: עבר expressa a ideia de atravessar ou passar para o outro lado; aqui, o contexto indica a passagem de Davi para território filisteu.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: ele e os seiscentos homens
  rationale: O pronome independente explicita Davi como integrante do grupo em movimento, e o artigo em português identifica naturalmente o grupo já conhecido na narrativa.
- source_word: אֲשֶׁר עִמּוֹ
  choice: que estavam com ele
  rationale: Tradução direta da oração relativa, sem acrescentar a interpretação mais específica de que o acompanhavam naquele momento apenas.
- source_word: אֶל אָכִישׁ
  choice: até Aquis
  rationale: אֶל indica movimento em direção a uma pessoa ou destino. Neste contexto de chegada à esfera de Aquis, “até” é natural em português.
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶּן מָעוֹךְ
  choice: filho de Maoque
  rationale: Preserva diretamente a relação patronímica hebraica e emprega uma transliteração natural em português.
- source_word: מֶלֶךְ גַּת
  choice: rei de Gate
  rationale: A cadeia construta identifica o cargo de Aquis; “rei de Gate” é a forma idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa próxima do hebraico. A aposição “ele e os seiscentos homens” preserva a ênfase do pronome independente sem tornar a frase artificial.
