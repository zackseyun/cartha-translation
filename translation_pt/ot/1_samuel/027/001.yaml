  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala interior foi vertida idiomaticamente, enquanto as imagens hebraicas das “mãos” e da “terra dos filisteus” foram preservadas. As notas mantêm as principais alternativas lexicais e a ênfase do infinitivo absoluto.
