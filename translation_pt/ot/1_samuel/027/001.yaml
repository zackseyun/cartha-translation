source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: pt
  text: 'Então Davi disse consigo mesmo: “Perecerei um dia pela mão de Saul.[a] Não há nada melhor para mim do que certamente escapar para a terra dos filisteus.[b] Assim, Saul desistirá de continuar me procurando por todo o território de Israel,[c] e eu escaparei da mão dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um dia serei eliminado pela mão de Saul”. O verbo hebraico pode significar “perecer” ou, de modo mais vívido, “ser varrido”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “escapar, escaparei”, construção que dá ênfase à ação de escapar.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Assim, Saul perderá a esperança de continuar me procurando por todo o território de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: consigo mesmo
  rationale: O idiomatismo hebraico descreve fala interior. “Consigo mesmo” comunica isso com naturalidade em português, sem sugerir uma declaração audível.
- source_word: אֶסָּפֶה
  choice: acabarei perecendo
  rationale: O nifal de ספה pode indicar ser eliminado, arrebatado ou perecer. “Acabarei perecendo” preserva o resultado fatal e se ajusta naturalmente ao receio de Davi.
- source_word: יוֹם אֶחָד
  choice: um dia
  rationale: Expressão temporal idiomática que indica um momento futuro indefinido.
- source_word: בְּיַד שָׁאוּל
  choice: pelas mãos de Saul
  rationale: Mantém a imagem hebraica da mão como agência ou poder; o plural é a forma idiomática mais corrente em português neste contexto.
- source_word: אֵין לִי טוֹב כִּי
  choice: Não há nada melhor para mim do que
  rationale: Preserva a construção comparativa e a avaliação deliberativa de Davi sem reduzi-la simplesmente a “o melhor é”.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: fugir de uma vez
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “De uma vez” expressa uma fuga decidida e efetiva em português natural; a nota registra a forma hebraica.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: para a terra dos filisteus
  rationale: Tradução direta e transparente da designação geográfica hebraica.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: Assim, Saul desistirá
  rationale: יאשׁ denota perder a esperança ou desistir. No contexto, o complemento seguinte define aquilo de que Saul desistirá.
- source_word: לְבַקְשֵׁנִי עוֹד
  choice: de continuar me procurando
  rationale: עוד indica que Saul deixará de prosseguir com a busca já em curso.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: por todo o território de Israel
  rationale: גְּבוּל aqui se refere à extensão territorial, não apenas à linha de fronteira. “Por todo” combina naturalmente com a procura.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: e eu escaparei das mãos dele
  rationale: Preserva tanto o motivo reiterado da fuga quanto a metáfora da mão como poder ou domínio.
