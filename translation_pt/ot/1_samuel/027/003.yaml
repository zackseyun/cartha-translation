base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: pt
  text: Assim, Davi ficou com Aquis em Gate[a], ele e os seus homens, cada um com a sua família[b] — Davi com suas duas esposas, Ainoã, a jezreelita, e Abigail, mulher de Nabal, a carmelita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morou com Aquis em Gate”. O verbo hebraico pode indicar tanto habitar como permanecer por algum tempo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cada homem e a sua casa”; é uma expressão distributiva que significa cada homem acompanhado dos membros de sua casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: O verbo יָשַׁב pode indicar sentar-se, habitar ou permanecer. Neste contexto narrativo, “ficou” comunica residência por certo período sem sugerir necessariamente permanência definitiva.
- source_word: עִם אָכִישׁ בְּגַת
  choice: com Aquis em Gate
  rationale: A preposição עִם indica associação com Aquis, e בְּ com o nome da cidade indica localização em Gate.
- source_word: הוּא וַאֲנָשָׁיו
  choice: ele e os seus homens
  rationale: A expressão designa os homens que acompanhavam Davi. A tradução preserva a formulação ampla do hebraico sem explicitar além do texto que eram soldados ou seguidores.
- source_word: אִישׁ וּבֵיתוֹ
  choice: cada um com a sua família
  rationale: אִישׁ tem aqui valor distributivo, “cada um”, e בַּיִת designa os membros da casa, não o edifício. “Família” é natural e claro em português neste contexto.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: com suas duas esposas
  rationale: A frase especifica quem compunha a casa de Davi. “Esposas” expressa com clareza o sentido conjugal de נָשִׁים no contexto.
- source_word: הַיִּזְרְעֵאלִית
  choice: a jezreelita
  rationale: O gentílico feminino identifica Ainoã como mulher de Jezreel. “Jezreelita” é a forma portuguesa natural e mantém a estrutura adjetiva do hebraico.
- source_word: אֵשֶׁת נָבָל
  choice: mulher de Nabal
  rationale: A construção significa literalmente “mulher de Nabal”. Neste contexto, “mulher” tem o sentido inequívoco de esposa e preserva a formulação direta do original.
- source_word: הַכַּרְמְלִית
  choice: a carmelita
  rationale: O gentílico está no feminino e, portanto, qualifica Abigail como mulher de Carmel. A tradução preserva essa concordância, evitando fazê-lo modificar Nabal.
