base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: pt
  text: Então Davi e seus homens subiram e fizeram incursões contra os gesuritas, os girzitas[a] e os amalequitas, pois esses povos habitavam a terra desde tempos antigos, desde o caminho para Sur até a terra do Egito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se encontra “gezritas”. A forma hebraica do nome deste povo é textualmente incerta e recebe diferentes transliterações.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “ao chegares a Sur”. Trata-se de uma expressão geográfica, aqui entendida como o limite inicial da região; também pode ser traduzida por “pelo caminho de Sur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiram
  rationale: O verbo עלה significa normalmente “subir”. O plural em português concorda naturalmente com o sujeito composto “Davi e seus homens”, embora o verbo hebraico esteja no singular e tenha Davi como núcleo inicial.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: fizeram incursões contra
  rationale: Neste contexto militar, פשט descreve uma expedição de ataque ou saque; com o alvo introduzido por אֶל, “contra” é a construção portuguesa natural.
- source_word: הַגְּשׁוּרִי
  choice: os gesuritas
  rationale: Forma portuguesa corrente para o nome desse povo.
- source_word: הגרזי
  choice: os girzitas
  rationale: Transliteração próxima da forma consonantal גרזי apresentada no texto hebraico, tratada como nome de povo; a incerteza textual é indicada em nota.
- source_word: וְהָעֲמָלֵקִי
  choice: e os amalequitas
  rationale: Forma portuguesa consagrada para o povo de Amaleque.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: pois esses povos habitavam aquela terra
  rationale: O feminino plural hebraico provavelmente retoma coletivamente os grupos mencionados. “Esses povos” torna explícito o referente sem alterar o sentido, e “habitavam” expressa com naturalidade o particípio.
- source_word: מֵעוֹלָם
  choice: desde a antiguidade
  rationale: Aqui עוֹלָם aponta para um passado remoto, não para eternidade.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: na direção de Sur
  rationale: A expressão geográfica idiomática com infinitivo e sufixo de segunda pessoa indica o rumo ou acesso a Sur. A tradução evita o pouco natural “ao ires” sem apagar o valor direcional.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: e até a terra do Egito
  rationale: Preserva explicitamente a ideia de extensão territorial marcada por עַד.
