- from: 'Davi não deixava com vida homem algum nem mulher alguma para levá-los a Gate, pois dizia: “Do contrário, eles poderão nos denunciar, dizendo: ‘Foi isso que Davi fez, e esse foi o seu costume[b] durante todo o tempo em que viveu no território dos filisteus[a]’”.'
  to: 'Davi não deixava com vida homem algum nem mulher alguma, para que ninguém fosse levado a Gate, pois dizia: “Do contrário, poderiam contar a nosso respeito, dizendo: ‘Foi isso que Davi fez, e esse foi o seu costume[b] durante todo o tempo em que viveu no território dos filisteus[a]’”.'
  rationale: A revisão corrige a ambiguidade sintática criada pelo pronome em “para levá-los a Gate” e substitui “denunciar” por uma formulação neutra, fiel ao verbo hebraico de relatar. Mantêm-se o aspecto habitual, o discurso citado, os nomes, o registro e os dois marcadores de nota em seus respectivos pontos de ancoragem.
