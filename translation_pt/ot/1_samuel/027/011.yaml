    issue: “para levá-los a Gate”
    rationale: O pronome e o infinitivo, em português, sugerem que Davi levaria as pessoas a Gate. No hebraico, o propósito é impedir que qualquer sobrevivente fosse levado a Gate e pudesse relatar o caso.
  - severity: medium
    issue: “eles poderão nos denunciar”
    rationale: יַגִּידוּ עָלֵינוּ significa que poderiam contar ou informar a respeito de Davi e dos seus. “Denunciar” pode introduzir indevidamente a noção de acusação formal; o subjuntivo corresponde melhor ao contexto narrativo e preventivo.
