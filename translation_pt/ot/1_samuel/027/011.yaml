base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: pt
  text: 'Davi não deixava com vida homem algum nem mulher alguma, para que ninguém fosse levado a Gate, pois dizia: “Do contrário, poderiam contar a nosso respeito, dizendo: ‘Foi isso que Davi fez, e esse foi o seu costume[b] durante todo o tempo em que viveu no território dos filisteus[a]’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no campo dos filisteus”, expressão que aqui se refere ao território ou à região dos filisteus.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “esse foi o seu modo de agir” ou “essa foi a sua prática”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: homem algum nem mulher alguma
  rationale: O par singular hebraico tem sentido distributivo e abrangente. A formulação portuguesa preserva a referência explícita a ambos os sexos e deixa claro que não havia sobreviventes.
- source_word: לֹא יְחַיֶּה
  choice: não deixava com vida
  rationale: O piel de חיה significa preservar vivo ou poupar. “Não deixava com vida” é natural em português e mantém o aspecto habitual sugerido pelo contexto narrativo.
- source_word: לְהָבִיא גַת
  choice: para levá-los a Gate
  rationale: O infinitivo expressa finalidade. O pronome “-los”, implícito no hebraico, esclarece em português que os possíveis sobreviventes seriam levados a Gate.
- source_word: לֵאמֹר
  choice: pois dizia
  rationale: Introduz a justificativa de Davi em discurso direto. “Pois dizia” conserva a estrutura discursiva e comunica naturalmente que se trata de sua razão para agir assim.
- source_word: פֶּן
  choice: Do contrário
  rationale: פֶּן introduz uma consequência indesejada que se procura evitar. “Do contrário” preserva esse valor preventivo em português corrente.
- source_word: יַגִּדוּ עָלֵינוּ
  choice: eles poderão nos denunciar
  rationale: O hifil de נגד significa contar ou informar; com עַל, neste contexto, indica revelar algo contra Davi e seus homens. “Denunciar” expressa a divulgação comprometedora sem especificar formalmente a quem seria feita.
- source_word: כֹּה עָשָׂה דָוִד
  choice: Foi isso que Davi fez
  rationale: A tradução mantém a força demonstrativa de כֹּה e soa natural no relato citado.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: e esse foi o seu costume
  rationale: מִשְׁפָּט pode significar juízo, norma, modo estabelecido ou costume. Aqui designa a maneira habitual de Davi agir, mas uma nota preserva alternativas lexicais legítimas.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: durante todo o tempo em que viveu
  rationale: A expressão hebraica indica toda a duração da permanência de Davi; a formulação escolhida é clara e idiomática em português moderno.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: no território dos filisteus
  rationale: שָׂדֶה significa literalmente “campo”, mas nesta expressão geográfica refere-se ao território ou à região rural sob domínio filisteu.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O texto conserva o discurso direto e a dura descrição narrativa sem suavizá-la. Os marcadores foram posicionados junto às expressões que efetivamente explicam: [a] após “território dos filisteus” e [b] após “costume”.'
