    issue: “Aquela terra” introduz uma nuance não expressa no hebraico.
    rationale: הָאָרֶץ traz artigo definido (“a terra/o território”), sem demonstrativo. “A terra” preserva melhor a referência sem acrescentar distância dêitica.
  - severity: medium
    issue: “Ia até Aquis” não exprime tão claramente a chegada indicada por וַיָּבֹא.
    rationale: A sequência וַיָּשָׁב וַיָּבֹא descreve retorno e vinda/chegada a Aquis. “Voltava e chegava a Aquis” conserva ambos os movimentos em português natural.
  - severity: low
    issue: A nota de rodapé tem concordância inadequada em “homem ou mulher continuasse vivo”.
    rationale: Com sujeito composto alternativo, a formulação pode ser evitada com “não deixava nenhum homem ou mulher viver”, que também reproduz bem a alternativa lexical.
