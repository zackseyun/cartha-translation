  source_fidelity: O emprego do imperfeito é defensável à luz do contexto imediato, que descreve as incursões repetidas de Davi (vv. 8–11). Contudo, “aquela terra” acrescenta uma nuance dêitica que não está no definido hebraico (“a terra”), e “ia até Aquis” enfraquece levemente o segundo verbo, que indica chegada a Aquis.
  naturalness: A redação é em geral clara e moderna. “Não deixava com vida nem homem nem mulher” é compreensível, mas “não deixava vivos nem homem nem mulher” é mais idiomático. A nota apresenta problema de concordância em “homem ou mulher continuasse vivo”.
  terminology: “Davi”, “jumentos”, “gado”, “camelos”, “roupas” e “Aquis” são adequados ao português bíblico moderno. A tradução mantém explicitamente “homem” e “mulher”, como no hebraico.
