base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: pt
  text: Davi atacava a terra e não deixava vivos nem homem nem mulher[a]. Tomava ovelhas, gado, jumentos, camelos e roupas; depois voltava e chegava a Aquis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixava nenhum homem ou mulher viver”.'
    reason: Alternativa lexical para o hifil de חיה, que pode ser expresso como “deixar com vida”, “manter vivo” ou “permitir que viva”.
lexical_decisions:
- source_word: וְהִכָּה
  choice: atacava
  rationale: O hifil de נכה pode indicar golpear ou atacar. O valor iterativo do contexto narrativo de 1 Samuel 27:8–11 favorece o imperfeito português “atacava”, sem acrescentar pormenores ao hebraico.
- source_word: הָאָרֶץ
  choice: aquela terra
  rationale: אֶרֶץ designa aqui o território atacado. “Aquela terra” é natural em português e mantém a referência espacial do texto.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: não deixava com vida nem homem nem mulher
  rationale: O hifil de חיה significa manter vivo ou deixar viver. A formulação conserva tanto a ação letal quanto o par explícito “homem e mulher”.
- source_word: וְלָקַח
  choice: Tomava
  rationale: לקח significa “tomar”. O contexto mostra que se trata de despojos, mas a tradução evita tornar o verbo mais específico que o original.
- source_word: צֹאן וּבָקָר
  choice: ovelhas, gado
  rationale: צֹאן é gado miúdo e pode abranger ovelhas e cabras; “ovelhas” segue a referência concreta tradicional, enquanto בָקָר é adequadamente expresso pelo coletivo “gado”.
- source_word: חֲמֹרִים וּגְמַלִּים וּבְגָדִים
  choice: jumentos, camelos e roupas
  rationale: Equivalentes atuais e claros para os animais e bens enumerados como despojos.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: depois voltava e ia até
  rationale: 'Preserva os dois verbos sucessivos: Davi retornava da incursão e se dirigia a Aquis. O aspecto habitual harmoniza com a sequência contextual.'
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio.
theological_decisions:
- issue: Descrição da violência praticada por Davi
  choice: Traduzir de modo direto que ele não deixava vivos homens nem mulheres.
  alternative: Suavizar a ação com uma expressão genérica ou ampliá-la com linguagem mais sensacionalista.
  rationale: O hebraico descreve de maneira crua uma incursão letal. A tradução não deve ocultar nem intensificar moralmente o que o narrador afirma.
- issue: Aspecto verbal da narrativa
  choice: 'Empregar formas habituais: “atacava”, “não deixava”, “tomava”, “voltava” e “ia”.'
  alternative: Empregar apenas o pretérito perfeito como se o versículo descrevesse uma única incursão.
  rationale: Embora as formas hebraicas sejam sequenciais, o contexto imediato apresenta as práticas repetidas de Davi durante sua permanência entre os filisteus. O português expressa naturalmente esse caráter habitual pelo pretérito imperfeito.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa compreensão no Brasil e em âmbito internacional. A redação mantém a dureza do relato sem arcaísmos, e usa o pretérito imperfeito para explicitar o caráter habitual indicado pelo contexto.
