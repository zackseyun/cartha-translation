  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: pt
  text: O tempo que Davi viveu no território dos filisteus foi de um ano e quatro meses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “dias e quatro meses”; nesta fórmula de duração, “dias” é uma maneira idiomática de dizer “um ano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: O tempo ... foi de
  rationale: A expressão hebraica diz literalmente “o número dos dias ... foi”, mas, neste resumo de duração, “o tempo ... foi de” comunica o sentido com naturalidade em português.
- source_word: אֲשֶׁר יָשַׁב
  choice: que Davi viveu
  rationale: Aqui, יָשַׁב indica residir ou permanecer num lugar, não o ato literal de sentar-se; “viveu” é claro e adequado à permanência prolongada.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: no território dos filisteus
  rationale: Embora שָׂדֶה possa significar literalmente “campo”, neste contexto designa a terra ou região controlada pelos filisteus.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: um ano e quatro meses
  rationale: Em fórmulas hebraicas de duração, יָמִים pode designar idiomaticamente “um ano”; a tradução explicita esse sentido, enquanto a nota preserva a forma literal.
