  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ יִתְּנוּ לִ֣/י מָק֗וֹם בְּ/אַחַ֛ת עָרֵ֥י הַ/שָּׂדֶ֖ה וְ/אֵ֣שְׁבָה שָּׁ֑ם וְ/לָ֨/מָּה יֵשֵׁ֧ב עַבְדְּ/ךָ֛ בְּ/עִ֥יר הַ/מַּמְלָכָ֖ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: pt
  text: 'Então Davi disse a Aquis: “Se encontrei favor aos seus olhos, por favor, que me deem um lugar em uma das cidades do interior[a], para que eu more ali[b]. Por que o seu servo haveria de morar com o senhor na cidade real[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “em uma das cidades do campo”, isto é, numa cidade do interior, em contraste com a cidade real.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e morarei ali”.'
    reason: lexical_alternative
  - marker: c
    text: Hebraico, literalmente, “cidade do reino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: encontrei favor aos seus olhos
  rationale: Preserva a expressão idiomática hebraica de obter aprovação, com uma formulação clara e corrente em português.
- source_word: נָא
  choice: por favor
  rationale: A partícula suaviza o pedido; em português, “por favor” transmite diretamente o tom cortês e deferente.
- source_word: יִתְּנוּ לִי
  choice: que me deem
  rationale: Mantém o plural indefinido e o valor volitivo do imperfeito hebraico, referindo-se aos encarregados de conceder o lugar sob a autoridade de Aquis.
- source_word: מָקוֹם
  choice: um lugar
  rationale: Equivalente amplo e natural, sem especificar mais do que o texto hebraico.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: em uma das cidades do interior
  rationale: Comunica de modo natural a ideia literal de uma das “cidades do campo”, em contraste com a cidade real.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: para que eu more ali
  rationale: Expressa a finalidade contextual e traduz ישב no sentido de residir, sem eliminar em nota a possibilidade de coordenação simples.
- source_word: לָמָּה יֵשֵׁב
  choice: Por que ... haveria de morar
  rationale: Reproduz a pergunta retórica e seu tom deferente com fluidez em português.
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: Trata-se de uma autodesignação cortês em discurso dirigido a um governante, não de uma ênfase na condição de escravo.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: na cidade real
  rationale: Traduz de forma idiomática “cidade do reino”, indicando a cidade onde reside o rei sem impor o termo mais específico “capital”.
- source_word: עִמָּךְ
  choice: com o senhor
  rationale: Mantém a ideia de proximidade pessoal e usa uma forma de tratamento respeitosa adequada ao contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O discurso de Davi conserva o tom cortês e deferente diante de Aquis; “o senhor” evita a ambiguidade moderna de “você” e mantém o respeito contextual.
