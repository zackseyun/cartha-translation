base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: pt
  text: 'Se ele disser: “Está bem”, haverá paz para o seu servo. Mas, se ele ficar muito irado, saiba que o mal já foi determinado por ele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mal está plenamente determinado da parte dele”, isto é, Saul resolveu firmemente fazer o mal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Está bem
  rationale: Representa a resposta breve e favorável de Saul de modo natural em português, preservando o uso elíptico do adjetivo hebraico.
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: haverá paz para o seu servo
  rationale: Preserva o termo שָׁלוֹם e seu sentido contextual de segurança e bem-estar, além da orientação futura inferida no contexto. “Seu servo” mantém a autodesignação deferente de Jônatas.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: ele ficar muito irado
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ira; “muito irado” comunica essa ênfase em português atual e digno.
- source_word: דַּע
  choice: saiba
  rationale: Traduz diretamente o imperativo dirigido a Davi.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: o mal está decidido da parte dele
  rationale: Comunica a ideia contextual de uma intenção nociva que chegou a uma resolução firme, enquanto “da parte dele” conserva melhor que uma construção puramente agentiva a noção de procedência em מֵעִמּוֹ.
theological_decisions:
- issue: Natureza do mal mencionado
  choice: o mal está decidido da parte dele
  alternative: ele está firmemente decidido a fazer o mal
  rationale: A formulação escolhida preserva a construção abstrata e a tensão do hebraico, sem explicitar além do texto que Saul resolveu praticar determinado ato nocivo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O diálogo permanece digno e direto; a expressão “seu servo” conserva a deferência própria do contexto sem recorrer a linguagem arcaica.
