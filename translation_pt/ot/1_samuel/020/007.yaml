  naturalness: O registro é geralmente claro e digno. «Está bem», «seu servo» e «ficar muito irado» funcionam bem. A substituição por «o mal já foi determinado por ele» torna a última oração mais natural sem perder a construção impessoal e abstrata do hebraico.
  terminology: «Paz», «servo» e «mal» preservam termos importantes e são adequados ao contexto. «Determinado» expressa bem a intenção já estabelecida de כלתה, sem especificar indevidamente o ato nocivo.
