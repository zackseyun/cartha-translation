base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: pt
  text: 'Mas Saul não disse nada naquele dia, pois pensou: “Alguma coisa aconteceu; ele não está puro[a] — certamente não está puro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele está ritualmente impuro”. Neste contexto, o hebraico se refere à pureza ritual exigida para participar da refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא דִבֶּר שָׁאוּל מְאוּמָה
  choice: Mas Saul não disse nada
  rationale: A expressão idiomática significa que Saul não fez comentário algum. “Não disse nada” é natural em português e preserva o sentido do hebraico.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal direta e corrente, correspondente ao hebraico.
- source_word: כִּי אָמַר
  choice: pois pensou
  rationale: Embora אָמַר signifique literalmente “disse”, o contexto apresenta o raciocínio interior de Saul; “pensou” o comunica naturalmente.
- source_word: מִקְרֶה הוּא
  choice: Foi algum imprevisto
  rationale: מִקְרֶה designa uma ocorrência ou eventualidade, muitas vezes fortuita. A formulação mantém a referência não especificada do hebraico, sem acrescentar “com ele”.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: ele não está puro
  rationale: Mantém de perto a forma negativa do hebraico e deixa que a nota explicite o sentido ritual indicado pelo contexto da refeição.
- source_word: כִּי לֹא טָהוֹר
  choice: sim, não está puro
  rationale: A repetição reforça a conclusão de Saul. “Sim” expressa a força confirmatória de כִּי sem transformar a frase em uma explicação causal.
theological_decisions:
- issue: Natureza da impureza indicada por טָהוֹר
  choice: Pureza ritual relacionada à participação na refeição
  alternative: Pureza moral geral
  rationale: No contexto da refeição da lua nova e da explicação de Saul para a ausência, a linguagem se refere mais naturalmente à condição ritual. O texto principal conserva “puro”, enquanto a nota esclarece esse sentido contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a repetição enfática do hebraico e não especifica a natureza do imprevisto.
