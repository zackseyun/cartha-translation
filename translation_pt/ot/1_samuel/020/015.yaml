  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: pt
  text: E não retire para sempre da minha casa o seu amor leal[a], nem mesmo quando Yahweh eliminar da face da terra cada um dos inimigos de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sua lealdade à aliança»; ou «seu amor fiel». O hebraico חֶסֶד muitas vezes indica amor fiel dentro de uma relação de aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: retire / eliminar
  rationale: Em português, repetir literalmente «cortar» nos dois contextos soaria pouco natural. «Retirar» preserva a ideia de fazer cessar o amor leal, enquanto «eliminar» expressa com clareza a remoção dos inimigos. A conexão semântica permanece no paralelismo das duas ações, embora o jogo lexical hebraico não seja reproduzido integralmente.
- source_word: חַסְדְּךָ
  choice: seu amor leal
  rationale: חֶסֶד designa aqui amor fiel e lealdade no contexto de uma aliança. «Amor leal» é natural, digno e mantém juntas as dimensões afetiva e pactual sem transformar o termo em expressão jurídica técnica.
- source_word: מֵעִם בֵּיתִי
  choice: da minha casa
  rationale: «Casa» conserva o sentido familiar e dinástico de בַּיִת e se ajusta ao pedido de Jônatas em favor de seus descendentes.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português corrente e solene para a duração contínua expressa pelo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֹיְבֵי דָוִד
  choice: os inimigos de Davi
  rationale: Reproduz naturalmente a relação construta hebraica e mantém o foco nos que se opõem a Davi.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular distributivo após o plural individualiza os inimigos. «Cada um» comunica essa força com naturalidade em português sem acrescentar uma referência masculina que o contexto já torna desnecessária.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face da terra
  rationale: Preserva o idioma hebraico solene e é uma expressão estabelecida e inteligível em português.
- source_word: וְלֹא ... וְלֹא
  choice: E não ... nem mesmo quando
  rationale: A segunda negativa amplia enfaticamente o pedido de Jônatas até o tempo em que Yahweh eliminar os inimigos de Davi.
theological_decisions:
- issue: Natureza de חֶסֶד no contexto da aliança
  choice: «amor leal», com conotações pactuais sem restringir o termo a uma fórmula jurídica
  alternative: «lealdade à aliança», «amor fiel» ou «bondade»
  rationale: O contexto da aliança entre Jônatas e Davi dá ao termo um sentido de afeto constante e fidelidade. «Amor leal» preserva ambas as dimensões.
- issue: Relação da segunda oração com o pedido de Jônatas
  choice: O pedido continua válido mesmo quando Yahweh eliminar os inimigos de Davi
  alternative: Entender a segunda oração como observação parentética menos diretamente ligada ao pedido
  rationale: A sequência negativa e a construção temporal favorecem uma extensão enfática do pedido, preservando a tensão entre o juízo contra os inimigos de Davi e a misericórdia solicitada para a casa de Jônatas.
- issue: Força distributiva de אִישׁ
  choice: «cada um»
  alternative: «cada homem» ou «todos eles»
  rationale: «Cada um» expressa de modo direto a individualização distributiva sem alterar o referente plural, os inimigos de Davi.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém «casa» e «face da terra» pelo peso familiar/dinástico e solene do hebraico. O marcador [a] aparece imediatamente após a expressão anotada.
