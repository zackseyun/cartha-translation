  verdict: approve
  source_fidelity: 'A tradução transmite com precisão o pedido de Jônatas: que o amor leal de Davi não seja retirado de sua casa perpetuamente, inclusive no momento em que Yahweh eliminar os inimigos de Davi. «Cada um dos inimigos de Davi» representa adequadamente o uso distributivo de אִישׁ. A alternância entre «retire» e «eliminar» não reproduz o jogo verbal de כרת, mas preserva os sentidos contextuais sem introduzir uma formulação portuguesa artificial.'
  naturalness: O texto é claro, solene e natural em português moderno de ampla compreensão. «Da minha casa», «amor leal» e «da face da terra» mantêm o registro bíblico e são inteligíveis. A construção «nem mesmo quando» expressa bem a extensão enfática da negação.
  terminology: «Yahweh» corresponde à política indicada para o tetragrama. «Amor leal» é uma escolha adequada para חֶסֶד no contexto de aliança, e a nota oferece alternativas úteis sem restringir indevidamente o termo. Os nomes e os termos teológicos estão consistentes.
  issues:
