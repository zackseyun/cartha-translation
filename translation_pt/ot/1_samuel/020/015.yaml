    issue: O jogo lexical hebraico de כרת nas duas ocorrências não é mantido com o mesmo verbo em português.
    rationale: «Retirar» para o amor leal e «eliminar» para os inimigos são escolhas semanticamente exatas e mais naturais em português do que uma repetição literal de «cortar». A ligação temática entre as ações permanece clara; não é necessária revisão.
