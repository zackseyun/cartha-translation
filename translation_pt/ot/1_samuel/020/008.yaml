base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: pt
  text: Portanto, trate seu servo com bondade[a], pois você fez seu servo entrar com você na aliança de Yahweh. Mas, se há culpa em mim, mate-me você mesmo; por que me levar ao seu pai?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trate seu servo com lealdade de aliança”. O termo hebraico חֶסֶד pode expressar bondade, amor leal e fidelidade no âmbito de uma aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: seja leal
  rationale: Neste apelo entre pessoas unidas por uma aliança, חֶסֶד expressa bondade fiel ou lealdade. “Seja leal” é natural em português e torna perceptível a dimensão relacional reforçada pela menção imediata à aliança.
- source_word: עַל עַבְדֶּךָ
  choice: ao seu servo
  rationale: Após עשה חסד, עַל indica a pessoa em favor de quem se demonstra lealdade ou bondade. “Ao seu servo” preserva também a autodesignação respeitosa de Davi.
- source_word: בִּבְרִית יְהוָה
  choice: na aliança de Yahweh
  rationale: A expressão descreve uma aliança feita sob a autoridade e perante o testemunho de Yahweh. “Na aliança” combina naturalmente com o verbo português “fazer entrar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: você fez seu servo entrar com você
  rationale: O hifil de בוא significa “fazer entrar/trazer”, e עִמָּךְ mantém a ideia de que Jônatas incluiu Davi juntamente consigo nessa relação de aliança.
- source_word: וְאִם יֶשׁ בִּי עָוֺן
  choice: Mas, se há culpa em mim
  rationale: עָוֺן pode indicar perversidade, culpa ou consequência da culpa. Aqui, “culpa” se ajusta ao contexto de possível culpabilidade de Davi perante Saul.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: mate-me você mesmo
  rationale: A forma causativa significa fazer morrer ou matar; o pronome explícito אַתָּה é enfático e fica preservado por “você mesmo”.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: por que me levar até seu pai?
  rationale: A pergunta retórica contrasta a ação direta de Jônatas com entregar Davi a Saul. “Até seu pai” representa o valor direcional de וְעַד.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome pessoal divino; a transliteração “Yahweh” preserva essa distinção sem substituí-la por um título.
- issue: Natureza de חֶסֶד no contexto da aliança
  choice: seja leal
  alternative: trate com bondade
  rationale: A proximidade da expressão “aliança de Yahweh” favorece a nuance de lealdade relacional, mas a nota conserva a amplitude semântica de bondade fiel.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você”, adequado à legibilidade brasileira e amplamente compreensível no mundo lusófono. A formulação mantém a autodesignação respeitosa “seu servo”, o nome divino Yahweh e a ambiguidade semântica de חֶסֶד por meio de nota.
