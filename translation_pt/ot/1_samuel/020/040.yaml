  text: וַ/יִּתֵּ֤ן יְהֽוֹנָתָן֙ אֶת כֵּלָ֔י/ו אֶל הַ/נַּ֖עַר אֲשֶׁר ל֑/וֹ וַ/יֹּ֣אמֶר ל֔/וֹ לֵ֖ךְ הָבֵ֥יא הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: pt
  text: 'Então Jônatas entregou suas armas[a] ao rapaz que o servia[b] e lhe disse: “Vá, leve-as[c] para a cidade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu equipamento”. O termo hebraico pode designar utensílios, equipamento ou armas; o contexto do arco e das flechas favorece “armas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao jovem que estava com ele” ou “ao seu jovem ajudante”. A expressão hebraica indica que o rapaz estava ligado a Jônatas como seu subordinado.
    reason: lexical_alternative
  - marker: c
    text: O objeto do verbo está implícito no hebraico; “-as” foi acrescentado em português e se refere às armas ou ao equipamento de Jônatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: entregou
  rationale: O verbo נתן significa normalmente “dar”; neste contexto, “entregou” expressa de modo natural a transferência das armas ao ajudante, sem acrescentar pormenores.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כֵּלָיו
  choice: suas armas
  rationale: כְּלִי pode designar utensílios, equipamento ou armas. O contexto imediato do arco e das flechas favorece “armas”, embora o termo hebraico seja mais amplo.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: o rapaz que o servia
  rationale: נַעַר pode significar rapaz, jovem ou servo; אֲשֶׁר לוֹ indica que ele estava ligado a Jônatas como seu subordinado ou ajudante. “O rapaz que o servia” comunica essa relação de modo natural sem definir um cargo específico.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: Tradução direta e idiomática do verbo comum אמר com objeto indireto.
- source_word: לֵךְ
  choice: Vá
  rationale: Imperativo direto de הלך.
- source_word: הָבֵיא
  choice: leve-as
  rationale: Embora o hifil de בוא costume significar “trazer”, em português o deslocamento da perspectiva do falante para a cidade pede naturalmente “levar”. O pronome retoma as armas, objeto implícito no hebraico.
- source_word: הָעִיר
  choice: para a cidade
  rationale: A forma definida significa “a cidade”; a preposição “para” explicita em português a direção exigida pelo contexto.
theological_decisions: []
