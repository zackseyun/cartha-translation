base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: pt
  text: 'Jônatas disse a Davi: “Vá em paz, pois nós dois juramos em nome do SENHOR: ‘Que o SENHOR esteja entre mim e você, e entre os meus descendentes e os seus descendentes, para sempre.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: Vá em paz
  rationale: Reproduz de modo natural a fórmula hebraica de despedida, preservando seu sentido de bem-estar e segurança.
- source_word: זַרְעִי ... זַרְעֲךָ
  choice: meus descendentes ... seus descendentes
  rationale: Neste contexto de compromisso duradouro entre famílias, o coletivo hebraico זֶרַע refere-se à posteridade; “descendentes” comunica isso com clareza em português atual.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o nome divino, distinguindo-o graficamente do título comum “Senhor”.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português direto e idiomático da expressão hebraica de duração indefinida ou perpétua.
theological_decisions:
- issue: Valor modal de יִהְיֶה na fórmula do juramento
  choice: Que o SENHOR esteja
  alternative: O SENHOR estará
  rationale: A forma pode ser entendida como afirmação futura ou desejo solene. No discurso citado que explicita o juramento, a formulação optativa em português preserva bem a força invocativa sem transformar a frase numa explicação doutrinária.
- issue: Relação expressa por אֲשֶׁר após “Vá em paz”
  choice: pois nós dois juramos
  alternative: quanto ao que nós dois juramos
  rationale: O hebraico é sintaticamente condensado. “Pois” exprime com naturalidade que o juramento fundamenta a despedida pacífica, sem acrescentar conteúdo ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. Mantém a solenidade do juramento sem arcaísmos desnecessários.
