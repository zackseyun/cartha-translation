base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: pt
  text: 'Jônatas respondeu: “Longe de você essa ideia! Se eu soubesse com certeza que meu pai já tinha decidido fazer-lhe mal[a], será que eu não lhe contaria?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mal estava consumado” ou “o dano estava definido”. A expressão hebraica pode indicar que a intenção nociva de Saul já se tornara firme ou plenamente formada.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: Longe de você tal ideia!
  rationale: A expressão idiomática rejeita energicamente a suspeita de Davi. A formulação conserva a segunda pessoa de לָּךְ sem sugerir, de modo enganoso, que Jônatas diga literalmente ‘longe de mim’.
- source_word: כִּי אִם
  choice: Se
  rationale: No contexto, a sequência introduz a condição que fundamenta a pergunta retórica.
- source_word: יָדֹעַ אֵדַע
  choice: soubesse com certeza
  rationale: O infinitivo absoluto seguido do verbo finito intensifica o conhecimento; ‘com certeza’ comunica essa ênfase em português natural.
- source_word: כָלְתָה הָרָעָה
  choice: o mal contra você já estava decidido
  rationale: A expressão pode indicar que a intenção nociva chegou a um ponto consumado ou definido. ‘Já estava decidido’ expressa o caráter estabelecido do mal sem eliminar a ambiguidade lexical, registrada em nota.
- source_word: מֵעִם אָבִי
  choice: da parte de meu pai
  rationale: Preserva a noção de origem ou procedência expressa pela preposição, sem tornar explícita além do texto a forma exata da participação de Saul.
- source_word: לָבוֹא עָלֶיךָ
  choice: contra você
  rationale: Em conexão com ‘o mal’, esta formulação comunica naturalmente a direção da ameaça, embora compacte a imagem literal de algo que ‘vem sobre’ Davi.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: será que eu não lhe contaria?
  rationale: Mantém a pergunta retórica, que espera resposta afirmativa, e traduz נגד de maneira natural neste diálogo pessoal.
theological_decisions: []
