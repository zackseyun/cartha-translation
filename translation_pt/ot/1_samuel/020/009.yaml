    issue: A expressão “o mal contra você já estava decidido” não traduz explicitamente o infinitivo לָבוֹא (“vir”) em לָבוֹא עָלֶיךָ.
    rationale: Embora “contra você” indique direção hostil, a construção hebraica apresenta o mal como algo que viria sobre Davi. “Decidido fazer-lhe mal” recupera essa dimensão de ação ameaçadora em português natural.
  - severity: low
    issue: “Longe de você tal ideia!” tem ordem marcada e soa menos natural no registro-alvo.
    rationale: “Longe de você essa ideia!” conserva o mesmo efeito idiomático e a segunda pessoa, com leitura mais fluente para leitores brasileiros e internacionais.
