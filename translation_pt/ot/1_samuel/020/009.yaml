  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A fala preserva a forte rejeição inicial de Jônatas e a força enfática da construção hebraica, evitando resolver indevidamente a ambiguidade de כָלְתָה הָרָעָה.
