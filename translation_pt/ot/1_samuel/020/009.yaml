  source_fidelity: A cláusula principal e a pergunta retórica são bem transmitidas. Contudo, “o mal contra você já estava decidido” comprime e enfraquece לָבוֹא עָלֶיךָ (“vir sobre/contra você”); uma formulação que explicite a ação danosa preserva melhor o movimento e a ameaça do hebraico. A nota mantém adequadamente a ambiguidade de כָלְתָה הָרָעָה.
  naturalness: “Longe de você tal ideia!” é compreensível, mas soa invertido e pouco idiomático no português atual. “Longe de você essa ideia!” é mais natural, conserva a referência de segunda pessoa e mantém a rejeição enfática. A revisão da oração condicional também melhora a fluência sem reduzir o sentido.
  terminology: “O mal” é apropriado para הָרָעָה neste contexto, e “com certeza” transmite bem a intensificação de יָדֹעַ אֵדַע. “Fazer-lhe mal” comunica de modo natural a ameaça expressa por “o mal ... vir contra você”, sem especificar indevidamente a modalidade do dano.
  issues:
