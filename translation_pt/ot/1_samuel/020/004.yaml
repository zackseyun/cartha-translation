  yaml_path: translation/ot/1_samuel/020/004.yaml
  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: pt
  text: 'Então Jônatas disse a Davi: “O que você desejar, eu farei por você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל דָּוִד
  choice: a Davi
  rationale: A preposição introduz o destinatário da fala; esta é a construção idiomática em português.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: O que você desejar
  rationale: Literalmente, “o que disser a sua alma”. Aqui נֶפֶשׁ designa o íntimo da pessoa, especialmente sua vontade ou desejo; a formulação escolhida comunica o sentido da oferta sem impor ao português um hebraísmo obscuro.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: eu farei por você
  rationale: Preserva o verbo comum “fazer” e entende לְ em sentido benefactivo. O objeto permanece implícito, como no hebraico, mas é recuperável pela oração anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas brasileiras amplamente compreensíveis. O hebraísmo “sua alma disser” foi traduzido pelo sentido contextual “você desejar”, evitando uma formulação artificial sem reduzir נֶפֶשׁ a uma doutrina técnica da alma.
