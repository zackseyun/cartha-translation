  source_fidelity: A tradução comunica com precisão a oferta abrangente de Jônatas. A expressão hebraica מַה תֹּאמַר נַפְשְׁךָ, literalmente próxima de “o que a tua alma disser”, é idiomática e refere-se ao desejo ou à vontade de Davi; “O que você desejar” a reproduz naturalmente sem introduzir uma leitura doutrinária de נֶפֶשׁ. “Eu farei por você” representa adequadamente וְאֶעֱשֶׂה לָּךְ.
