base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: pt
  text: 'Ele disse: “Por favor, deixe-me ir, pois temos um sacrifício da família na cidade, e foi meu irmão quem me mandou. Agora, se achei favor aos seus olhos, por favor, deixe-me escapar[a] e ver meus irmãos[b].” Por isso, ele não veio à mesa do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico pode ter o sentido de escapar ou de se retirar discretamente.
    reason: lexical_alternative
  - marker: b
    text: “Meus irmãos” pode se referir aos irmãos de Davi ou, em sentido mais amplo, aos seus parentes homens dentro do grupo familiar.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: Por favor, deixe-me ir
  rationale: O imperativo de שלח com sufixo de primeira pessoa pede permissão para partir; esta formulação transmite com naturalidade a cortesia de נָא.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: um sacrifício de família
  rationale: זֶבַח designa um sacrifício, normalmente acompanhado de uma refeição comunitária, e מִשְׁפָּחָה o associa à família ou ao clã. A tradução conserva o sentido cultual sem reduzi-lo a uma simples festa.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Tradução locativa direta e natural, sem identificar a cidade além do que o versículo declara.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: e meu próprio irmão me ordenou
  rationale: “Meu próprio irmão” procura conservar a ênfase do pronome הוּא, enquanto “me ordenou” reflete a força de צוה sem acrescentar o conteúdo não expresso da ordem.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: se achei favor aos seus olhos
  rationale: Mantém a fórmula hebraica de cortesia e sua imagem, que continua compreensível em português.
- source_word: אִמָּלְטָה נָּא
  choice: por favor, deixe-me escapar
  rationale: O cohortativo de מלט pode indicar escapar ou retirar-se discretamente. “Deixe-me escapar” preserva sua força lexical e a forma de pedido.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: e ver meus irmãos
  rationale: Conserva o sentido direto de ראה e a designação masculina de אֶחָי, sem decidir se se trata apenas de irmãos biológicos ou também de parentes próximos.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz de modo claro e digno a consequência que explica a ausência de Davi.
- source_word: לֹא בָא אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: ele não veio à mesa do rei
  rationale: Reproduz naturalmente a ausência em relação à refeição real, sem explicitação adicional.
theological_decisions: []
