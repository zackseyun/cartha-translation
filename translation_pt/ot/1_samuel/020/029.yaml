  source_fidelity: 'O texto transmite adequadamente a explicação atribuída a Davi: o sacrifício da família, a ordem do irmão, o pedido de partir discretamente e a razão da ausência à mesa real. A ênfase de הוּא é melhor expressa em português por uma construção focalizadora do que por “meu próprio irmão”, expressão que pode sugerir apenas contraste entre irmão literal e outra pessoa.'
  naturalness: 'Há pequenos ajustes seguros de idiomaticidade: “sacrifício da família” soa mais natural que “sacrifício de família” neste contexto, e “foi meu irmão quem me mandou” é mais corrente do que “meu próprio irmão me ordenou”. A pontuação do discurso direto também foi regularizada.'
