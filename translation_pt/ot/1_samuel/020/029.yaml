  to: 'Ele disse: “Por favor, deixe-me ir, pois temos um sacrifício da família na cidade, e foi meu irmão quem me mandou. Agora, se achei favor aos seus olhos, por favor, deixe-me escapar[a] e ver meus irmãos[b].” Por isso, ele não veio à mesa do rei.'
