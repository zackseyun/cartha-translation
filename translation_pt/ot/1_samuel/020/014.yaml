  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: pt
  text: E, se eu ainda estiver vivo, você não me demonstrará a fidelidade à aliança de Yahweh[a], para que eu não morra?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o amor leal de Yahweh”. A expressão hebraica também pode referir-se mais diretamente ao próprio amor leal de Yahweh, e não à fidelidade à aliança demonstrada em nome dele.'
    reason: Alternativa lexical e ambiguidade na relação genitiva de חֶסֶד יְהוָה.
lexical_decisions:
- source_word: וְלֹא אִם
  choice: E, se
  rationale: A sequência funciona idiomaticamente neste pedido solene; “E, se” comunica a condição sem reproduzir de modo artificial a negação hebraica.
- source_word: עוֹדֶנִּי חָי
  choice: eu ainda estiver vivo
  rationale: Preserva a nuance temporal de עוֹד e se encaixa naturalmente na oração condicional em português.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: você não demonstrará para comigo
  rationale: Com חֶסֶד como complemento, o idiomatismo de “fazer com” é expresso de maneira clara e digna por “demonstrar para comigo”.
- source_word: חֶסֶד
  choice: fidelidade à aliança
  rationale: No contexto do compromisso entre Jônatas e Davi, o termo designa lealdade firme vinculada a uma relação pactuada, não mera bondade ocasional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְלֹא אָמוּת
  choice: para que eu não morra
  rationale: Expressa naturalmente a finalidade ou o resultado pretendido no pedido de Jônatas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o preserva por transliteração.
- issue: Sentido de חֶסֶד יְהוָה
  choice: a fidelidade à aliança de Yahweh
  alternative: a bondade de Yahweh; o amor leal de Yahweh; uma lealdade digna de Yahweh
  rationale: A formulação principal torna visível o caráter pactuado da lealdade solicitada, enquanto a nota conserva a possibilidade de a expressão apontar mais diretamente para o próprio amor leal de Yahweh.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade ampla. A ordem foi ajustada à sintaxe natural do português, sem eliminar a força interrogativa do pedido nem a ambiguidade de חֶסֶד יְהוָה.
