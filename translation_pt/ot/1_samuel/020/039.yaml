  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: pt
  text: Mas o rapaz não sabia de nada; somente Jônatas e Davi sabiam do assunto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “daquilo” ou “do acordo”. A palavra hebraica דָּבָר é ampla e pode referir-se a uma coisa, questão ou assunto em pauta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Mas o rapaz
  rationale: נַעַר pode designar menino, jovem ou ajudante. Neste contexto, refere-se ao jovem ajudante de Jônatas; “rapaz” é natural e não especifica uma idade além do que o hebraico permite. O וְ recebe valor adversativo por causa do contraste com o conhecimento de Jônatas e Davi.
- source_word: לֹא יָדַע מְאוּמָה
  choice: não sabia de nada
  rationale: A combinação negativa idiomática expressa ausência total de conhecimento. “Não sabia de nada” preserva o sentido direto e corrente em português.
- source_word: אַךְ
  choice: somente
  rationale: 'Aqui a partícula tem força restritiva: o conhecimento do assunto se limitava a Jônatas e Davi.'
- source_word: יְהוֹנָתָן וְדָוִד
  choice: Jônatas e Davi
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: יָדְעוּ
  choice: sabiam
  rationale: Mantém o mesmo campo lexical de יָדַע na primeira oração e ressalta o contraste entre a ignorância do rapaz e o conhecimento dos dois.
- source_word: אֶת־הַדָּבָר
  choice: do assunto
  rationale: דָּבָר é amplo e pode significar palavra, coisa, assunto ou questão. “Assunto” é natural no contexto e evita definir excessivamente se se trata do sinal combinado, da situação ou de todo o acordo entre eles.
