  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: pt
  text: 'E eis que enviarei o rapaz, dizendo: “Vá procurar as flechas.” Se eu disser claramente ao rapaz: “Veja, as flechas estão deste lado de você[a]; pegue-as e venha”, então você estará em segurança, e não haverá perigo — tão certo como Yahweh vive.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as flechas estão mais perto do que você”. O hebraico indica que elas caíram aquém do rapaz, e não além dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Yahweh vive”, fórmula de juramento que confirma solenemente a veracidade da declaração.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E então
  rationale: Aqui a expressão introduz o próximo passo do plano de sinais de Jônatas. “E então” mantém a progressão e a vivacidade do discurso sem recorrer ao arcaico “eis”.
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: enviarei o rapaz
  rationale: נַעַר pode designar menino, jovem ou auxiliar. “Rapaz” preserva a referência à idade sem definir além do necessário sua condição social.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: Vá procurar as flechas
  rationale: A ordem indica que o rapaz deve ir localizar e recolher as flechas. “Procurar” expressa naturalmente מָצָא neste contexto.
- source_word: אִם אָמֹר אֹמַר
  choice: Se eu disser claramente
  rationale: O infinitivo absoluto seguido do verbo finito dá ênfase ao ato de dizer. “Disser claramente” comunica que esse será o sinal inequívoco, sem reproduzir de modo artificial a repetição hebraica.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: Veja, as flechas estão deste lado de você
  rationale: A frase situa as flechas aquém do rapaz, em contraste com “além de você” no versículo seguinte. “Deste lado de você” conserva a orientação espacial e a ambiguidade exata da distância.
- source_word: קָחֶנּוּ
  choice: pegue-as
  rationale: Embora o sufixo tenha forma singular, seu referente contextual são as flechas. O português ajusta naturalmente a concordância ao plural.
- source_word: וָבֹאָה
  choice: e venha
  rationale: A forma verbal indica movimento de volta em direção a quem fala. “Venha” preserva essa direção sem acrescentar um objeto não expresso.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: então você estará em segurança
  rationale: שָׁלוֹם designa aqui a integridade e segurança de Davi, não apenas ausência de conflito. A formulação comunica o sentido contextual em português corrente.
- source_word: וְאֵין דָּבָר
  choice: e não haverá perigo
  rationale: דָּבָר é literalmente “coisa”, “assunto” ou “questão”, mas neste plano de sinais indica que não há ameaça ou ocorrência adversa. “Perigo” torna explícita essa força contextual.
- source_word: חַי יְהוָה
  choice: tão certo como Yahweh vive
  rationale: É uma fórmula hebraica de juramento que confirma solenemente a veracidade da declaração. Esta forma é natural em português e mantém a imagem original.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Força da fórmula חַי יְהוָה
  choice: tão certo como Yahweh vive
  alternative: Yahweh vive; pela vida de Yahweh
  rationale: A expressão funciona como juramento, não apenas como afirmação abstrata de que Deus vive. A tradução conserva tanto o conteúdo quanto a função solene da fórmula.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “você” porque Jônatas se dirige diretamente a Davi e porque essa forma é amplamente inteligível no português internacional contemporâneo. As aspas e o travessão organizam as falas e destacam a fórmula final de juramento.
