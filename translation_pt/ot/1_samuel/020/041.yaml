  naturalness: «De junto ao lado sul» é compreensível, mas soa redundante e pouco natural em português. «De junto do sul» conserva deliberadamente a estranheza da expressão hebraica e é mais conciso; a nota esclarece a dificuldade. «Caiu com o rosto em terra» é natural, digno e mais próximo do original. A construção final com infinitivo é fluente.
  terminology: «Rapaz», «Davi», «Jônatas», «beijaram» e «choraram juntos» são adequados ao registro narrativo. «Curvou-se» evita interpretar o gesto como ato religioso. A nota deve falar de «um monte ou uma pedra», sem converter indevidamente a alternativa em uma identificação definida.
