base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: pt
  text: Quando o rapaz chegou, Davi se levantou de junto do sul[a], caiu com o rosto em terra e curvou-se três vezes. Então os dois se beijaram e choraram juntos, até Davi chorar mais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “de junto do Neguebe/sul”. A expressão é difícil; muitos a entendem como referência a um monte ou a uma pedra perto do esconderijo de Davi no contexto imediato.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “até Davi chorar mais”, isto é, o choro dele superou o de Jônatas ou se tornou mais intenso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: Quando o rapaz chegou
  rationale: נַעַר pode designar rapaz, jovem ou servo. Aqui se refere ao ajudante de Jônatas mencionado no contexto anterior; “rapaz” é natural e mantém a referência sem especificar demais sua função.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: de junto ao lado sul
  rationale: A expressão hebraica é difícil. נֶגֶב normalmente significa “sul” ou “Neguebe”, e מֵאֵצֶל indica procedência de junto a algo. A tradução conserva o sentido espacial mais direto, enquanto a nota registra a dificuldade e outra interpretação contextual.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: lançou-se com o rosto em terra
  rationale: A expressão descreve literalmente a queda com o rosto voltado para o chão. “Lançou-se” comunica uma ação deliberada e solene sem fundi-la com o ato seguinte de curvar-se.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: e curvou-se três vezes
  rationale: O verbo expressa inclinar-se ou prostrar-se. “Curvou-se” preserva o gesto sem interpretar explicitamente sua finalidade social ou religiosa.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: Então os dois se beijaram
  rationale: A construção recíproca significa que um beijou o outro. O beijo é mantido literalmente como gesto de afeto e despedida.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: e choraram juntos
  rationale: A construção recíproca indica o choro compartilhado dos dois. “Choraram juntos” é idiomático e preserva a mutualidade.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: até Davi chorar ainda mais
  rationale: גדל significa literalmente “tornar-se grande/crescer”, mas, neste contexto, refere-se ao choro de Davi. A formulação portuguesa deixa em aberto se o choro dele aumentou em intensidade ou superou o de Jônatas; a nota explicita essa ambiguidade.
