  to: Quando o rapaz chegou, Davi se levantou de junto do sul[a], caiu com o rosto em terra e curvou-se três vezes. Então os dois se beijaram e choraram juntos, até Davi chorar mais[b].
  rationale: A revisão torna a expressão espacial menos redundante, preservando sua dificuldade por meio da nota, substitui um verbo mais interpretativo por «caiu», que corresponde diretamente ao hebraico, e ajusta a nota para não definir como certa a alternativa contextual. O restante do texto traduz adequadamente a narrativa e mantém a ambiguidade de «Davi chorar mais».
