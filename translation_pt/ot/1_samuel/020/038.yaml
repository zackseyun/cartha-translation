  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: pt
  text: 'E Jônatas gritou para o rapaz: “Depressa! Apresse-se! Não pare!” Então o rapaz de Jônatas recolheu as flechas[a] e foi até seu senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma hebraica de “flechas” está escrita de um modo que pode parecer singular, mas o contexto se refere às flechas que Jônatas havia disparado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: gritou para o rapaz
  rationale: קרא com אַחֲרֵי indica chamar em voz alta alguém que se afasta. “Gritou para” comunica de modo natural a distância e a urgência; “rapaz” preserva a nuance de נַעַר sem ocultar sua função de ajudante.
- source_word: מְהֵרָה
  choice: Depressa!
  rationale: O advérbio funciona como ordem urgente. A forma breve e exclamativa é natural em português atual.
- source_word: חוּשָׁה
  choice: Corra!
  rationale: O imperativo exige ação rápida. “Corra!” cabe à situação concreta e mantém a segunda ordem de urgência distinta de מְהֵרָה.
- source_word: אַל תַּעֲמֹד
  choice: Não pare!
  rationale: Embora עמד signifique literalmente “ficar de pé/parado”, aqui a ordem pede que o rapaz continue em movimento; “Não pare!” expressa o sentido contextual.
- source_word: וַיְלַקֵּט
  choice: recolheu
  rationale: לקט denota juntar ou apanhar itens. “Recolheu” descreve com clareza a recuperação das flechas.
- source_word: נַעַר יְהוֹנָתָן
  choice: o rapaz de Jônatas
  rationale: A construção identifica o jovem ajudante ligado a Jônatas. A repetição de “rapaz” preserva o vocabulário hebraico e evita acrescentar formalmente “servo”.
- source_word: החצי
  choice: as flechas
  rationale: Apesar da forma gráfica que pode parecer singular, o contexto se refere coletivamente às flechas disparadas por Jônatas; o plural é necessário em português.
- source_word: אֶל אֲדֹנָיו
  choice: ao seu senhor
  rationale: אָדוֹן com o sufixo refere-se a Jônatas como superior humano do rapaz. “Seu senhor” mantém a relação social expressa pelo hebraico sem conotação necessariamente divina.
theological_decisions: []
translation_notes:
  register: Português moderno, narrativo e digno, com boa legibilidade brasileira. As três ordens curtas preservam a urgência enfática do hebraico. Optou-se por “rapaz” em vez de “servo” para manter a nuance de idade/status de נַעַר.
