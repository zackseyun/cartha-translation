  naturalness: «E eu atirarei as três flechas para o lado dela» é natural e claro. «Como se eu estivesse atirando em um alvo» é português moderno, internacionalmente compreensível e preserva melhor a construção da frase do que «praticando tiro ao alvo».
  terminology: «Atirarei» é apropriado para flechas. A nota deve evitar «por mim mesmo», que em português tende a significar «pessoalmente/sem ajuda» e não reproduz bem o dativo idiomático; «para mim» conserva a formulação com a devida explicação contextual.
