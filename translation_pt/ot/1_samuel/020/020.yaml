translation:
  language: pt
  text: E eu atirarei as três flechas para o lado dela[a][b], como se eu estivesse atirando em um alvo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “dela” provavelmente se refere à pedra ou ao marco mencionado no contexto anterior.
    reason: cross_reference
  - marker: b
    text: 'Ou: “ao lado dela”.'
    reason: lexical_alternative
  - marker: c
    text: 'A expressão hebraica é idiomática; mais literalmente: “para atirar para mim em um alvo”. No contexto, indica agir como quem pratica arco e flecha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: E eu
  rationale: A conjunção seguida do pronome independente assinala a passagem para a ação de Jônatas. “E eu” preserva tanto a progressão do discurso quanto a ênfase no sujeito.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: as três flechas
  rationale: O numeral em construção com o substantivo definido indica três flechas específicas, usadas como sinal previamente combinado.
- source_word: צִדָּה
  choice: para o lado dela
  rationale: A expressão tem sentido direcional e inclui um sufixo feminino singular, provavelmente referente à pedra ou ao marco mencionado no contexto. A tradução conserva essa referência sem identificar explicitamente o objeto no texto principal.
- source_word: אוֹרֶה
  choice: atirarei
  rationale: A forma hifil de ירה, em contexto de arco e flecha, significa naturalmente “atirar” ou “disparar”. O futuro corresponde à ação planejada.
- source_word: לְשַׁלַּח לִי
  choice: como se estivesse praticando
  rationale: A construção com o infinitivo de שלח e o dativo לִי é idiomática. No contexto, Jônatas pretende dar a aparência de estar atirando por conta própria, como exercício; a formulação portuguesa comunica essa intenção com naturalidade.
- source_word: לְמַטָּרָה
  choice: tiro ao alvo
  rationale: מַטָּרָה designa um alvo ou uma marca. Na expressão portuguesa “praticando tiro ao alvo”, o sentido da atividade de arquearia fica claro e corrente.
