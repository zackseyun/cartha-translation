  text: וַ/יִּשָּׁבַ֨ע ע֜וֹד דָּוִ֗ד וַ/יֹּ֨אמֶר֙ יָדֹ֨עַ יָדַ֜ע אָבִ֗י/ךָ כִּֽי מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וַ/יֹּ֛אמֶר אַל יֵֽדַע זֹ֥את יְהוֹנָתָ֖ן פֶּן יֵֽעָצֵ֑ב וְ/אוּלָ֗ם חַי יְהוָה֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ כִּ֣י כְ/פֶ֔שַׂע בֵּינִ֖/י וּ/בֵ֥ין הַ/מָּֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: pt
  text: 'Mas Davi tornou a jurar e disse: “Seu pai sabe muito bem que encontrei favor aos seus olhos e disse: ‘Jônatas não deve saber disso, para que não fique triste.’ Mas, tão certo como vive o SENHOR e como você vive, há apenas um passo entre mim e a morte.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע עוֹד
  choice: tornou a jurar
  rationale: Expressa naturalmente a ideia de que Davi jurou de novo ou acrescentou um juramento.
- source_word: יָדֹעַ יָדַע
  choice: sabe muito bem
  rationale: A construção intensiva hebraica reforça a certeza do conhecimento.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: encontrei favor aos seus olhos
  rationale: Mantém a imagem hebraica tradicional e compreensível, indicando que Davi desfrutava da estima de Jônatas.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: Jônatas não deve saber disso
  rationale: Representa a proibição na fala atribuída a Saul sem acrescentar um agente não expresso no hebraico.
- source_word: וְחֵי נַפְשֶׁךָ
  choice: e como você vive
  rationale: Verte de modo natural a fórmula de juramento; נֶפֶשׁ aqui designa a própria vida ou pessoa de Jônatas.
- source_word: כְפֶשַׂע
  choice: apenas um passo
  rationale: O substantivo indica uma pequena distância ou passo, metáfora da proximidade imediata da morte.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida para o Tetragrama, sem alterar o referente divino.
- issue: Forma do juramento pela vida de Jônatas
  choice: tão certo como vive o SENHOR e como você vive
  alternative: pela vida do SENHOR e pela vida da sua alma
  rationale: Preserva o juramento duplo em português idiomático, sem sugerir uma doutrina específica sobre a constituição da pessoa.
- issue: Fala interior ou fala efetiva de Saul
  choice: pensou
  alternative: disse
  rationale: O hebraico usa literalmente “disse”, mas no contexto pode introduzir a deliberação de Saul; “pensou” torna clara a inferência de Davi. A ambiguidade não afeta o conteúdo da alegação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais (“você”, “seu pai”). Conservam-se a intensidade do hebraico, a fórmula solene do juramento e a metáfora do único passo até a morte.
