review_pass:
  verdict: revise
  source_fidelity: 'A tradução conserva adequadamente os elementos centrais: o imperativo para correr, o pedido cortês, as flechas, o lançamento da flecha e o sinal de ela passar além do rapaz. Contudo, «seu jovem» não é uma designação idiomática em português contemporâneo e torna a relação expressa por נַעַר menos clara.'
  naturalness: «Disse ao seu jovem» soa pouco natural no português moderno. «Seu rapaz» é uma alternativa simples e amplamente compreensível que mantém a referência a um jovem sob os cuidados ou a serviço de Jônatas, sem afirmar de modo rígido que fosse escravo. Também é preferível retirar a conjunção adicional entre os dois imperativos.
  terminology: «Rapaz» é apropriado para נַעַר neste contexto narrativo e evita tanto o pouco idiomático «seu jovem» quanto a especificação potencialmente excessiva de «servo» ou «ajudante». «Flechas» e «atirou a flecha» são fiéis. A nota deve explicitar que o pronome final se refere ao rapaz.
  issues:
  - severity: medium
    issue: «ao seu jovem» é formulação pouco idiomática.
    rationale: Embora «jovem» possa traduzir נַעַר, o possessivo com o substantivo nominalizado soa artificial em português atual. «Ao seu rapaz» comunica naturalmente a mesma referência sem alterar o sentido.
  - severity: low
    issue: A conjunção «e» em «Corra, por favor, e encontre» não corresponde a uma conjunção explícita no hebraico.
    rationale: Não produz erro semântico, mas a sequência de imperativos fica mais direta e natural sem esse acréscimo.
  - severity: low
    issue: A nota usa «passar por ele», expressão que pode ser menos precisa em português.
    rationale: «Passar além dele» preserva com maior clareza a direção indicada pelo causativo de עבר e evita a possível leitura de passagem através de alguém.
  revised_text: 'Disse ao seu rapaz: “Corra, por favor, encontre as flechas que vou atirar.” O rapaz correu, e ele atirou a flecha para além dele.[a]'
  revised_footnotes:
