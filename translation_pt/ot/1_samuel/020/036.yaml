  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: pt
  text: 'Disse ao seu rapaz: “Corra, por favor, encontre as flechas que vou atirar.” O rapaz correu, e ele atirou a flecha para além dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fazê-la passar além dele”, isto é, além do rapaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: ao seu jovem / O jovem
  rationale: נַעַר pode designar um jovem, ajudante ou servo. “Jovem” preserva a indicação de idade e posição sem especificar além do hebraico; a repetição do substantivo é mantida.
- source_word: רוּץ
  choice: Corra
  rationale: O imperativo de רוץ indica concretamente correr, e não apenas apressar-se.
- source_word: מְצָא נָא
  choice: por favor, e encontre
  rationale: מְצָא significa “encontre”, e נָא acrescenta uma nuance de pedido ou cortesia. A conjunção torna natural em português a sequência de imperativos.
- source_word: הַחִצִּים
  choice: as flechas
  rationale: Mantém diretamente o substantivo plural definido do hebraico.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: que vou atirar
  rationale: O particípio מוֹרֶה expressa aqui uma ação iminente no contexto; “vou atirar” é natural e deixa claro que o jovem deve buscar as flechas à medida que forem lançadas.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: e ele atirou a flecha
  rationale: Preserva o pronome enfático e o singular definido do hebraico, apesar do plural anterior.
- source_word: לְהַעֲבִירוֹ
  choice: para além dele
  rationale: O infinitivo causativo de עבר com sufixo masculino provavelmente indica fazer a flecha passar além do jovem. A formulação conserva a referência pronominal e a direção narrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Jovem” evita regionalismos e não introduz explicitamente a condição de servo. O referente de “ele” permanece formalmente ambíguo no corpo do texto, enquanto a nota esclarece o sentido contextual provável.
