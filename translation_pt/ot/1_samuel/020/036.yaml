revisions:
- from: 'Disse ao seu jovem: “Corra, por favor, e encontre as flechas que vou atirar”. O jovem correu, e ele atirou a flecha para além dele.[a]'
  to: 'Disse ao seu rapaz: “Corra, por favor, encontre as flechas que vou atirar.” O rapaz correu, e ele atirou a flecha para além dele.[a]'
  rationale: A revisão substitui a expressão pouco natural «seu jovem» por «seu rapaz», mantém a repetição do termo e preserva a margem semântica de נַעַר. A construção dos imperativos foi simplificada, e a nota foi ajustada para expressar mais claramente o sentido direcional de לְהַעֲבִירוֹ. A ambiguidade pronominal formal do texto foi mantida, enquanto a nota identifica o referente contextual.
