translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “você” para a segunda pessoa singular, evita arcaísmos e conserva a repetição de “meu pai”, o merismo “grande ou pequena” e a concisão da negação final.
