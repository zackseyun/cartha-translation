base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: pt
  text: 'Ele lhe disse: “De modo nenhum! Você não morrerá. Veja, meu pai não faz coisa alguma, grande ou pequena, sem me revelar isso.[a] Por que, então, meu pai esconderia de mim esse assunto? Não é assim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e não descobre o meu ouvido”, uma expressão idiomática que significa “e não me revela isso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: De modo nenhum!
  rationale: Expressa uma negação enfática e natural em português, sem introduzir uma referência explícita a Deus que não aparece no hebraico.
- source_word: לֹא תָמוּת
  choice: Você não morrerá
  rationale: Preserva a afirmação direta e tranquilizadora em linguagem atual e digna.
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a função discursiva de chamar a atenção para a explicação seguinte, evitando o tom arcaico de “eis”.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: coisa alguma, grande ou pequena
  rationale: Conserva o merismo hebraico, que abrange qualquer coisa, e se integra naturalmente à negação da oração.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: sem revelá-la a mim
  rationale: Traduz o sentido do idioma hebraico “descobrir o ouvido” em português claro; a imagem literal é registrada em nota.
- source_word: יַסְתִּיר
  choice: esconderia
  rationale: O condicional português transmite naturalmente a força da pergunta retórica no contexto.
- source_word: הַדָּבָר הַזֶּה
  choice: esse assunto
  rationale: דבר se refere aqui ao plano ou caso mencionado, e não apenas a uma palavra falada.
- source_word: אֵין זֹאת
  choice: Não é assim
  rationale: Mantém a negação conclusiva breve e preserva sua formulação relativamente aberta, sem explicitar além do hebraico.
- source_word: אָבִי
  choice: meu pai
  rationale: Retém as duas ocorrências explícitas do hebraico, preservando a ênfase relacional do argumento de Jônatas.
