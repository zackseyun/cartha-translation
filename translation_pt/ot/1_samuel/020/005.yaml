  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוֹנָתָ֗ן הִֽנֵּה חֹ֨דֶשׁ֙ מָחָ֔ר וְ/אָנֹכִ֛י יָשֹׁב אֵשֵׁ֥ב עִם הַ/מֶּ֖לֶךְ לֶ/אֱכ֑וֹל וְ/שִׁלַּחְתַּ֨/נִי֙ וְ/נִסְתַּרְתִּ֣י בַ/שָּׂדֶ֔ה עַ֖ד הָ/עֶ֥רֶב הַ/שְּׁלִשִֽׁית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: pt
  text: 'Davi disse a Jônatas: “Veja, amanhã é lua nova[a], e espera-se que eu me sente com o rei para comer. Mas deixe-me ir, para que eu me esconda no campo até a terceira tarde[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lua nova” refere-se à celebração mensal da lua nova, muitas vezes marcada por uma refeição especial.
    reason: cultural_note
  - marker: b
    text: Ou “até a tarde do terceiro dia”. A expressão hebraica é elíptica.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Chama a atenção de Jônatas para a situação de modo natural no português atual, preservando a força dêitica da expressão hebraica.
- source_word: חֹדֶשׁ מָחָר
  choice: amanhã é lua nova
  rationale: Neste contexto de refeição na corte, חֹדֶשׁ designa a lua nova e, por extensão, a celebração mensal; a nota explicita o dado cultural sem sobrecarregar o texto.
- source_word: יָשֹׁב אֵשֵׁב
  choice: espera-se que eu me sente
  rationale: A construção com infinitivo absoluto e verbo finito reforça a expectativa de que Davi compareça e tome seu lugar, sem necessariamente expressar dever moral pessoal.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: com o rei para comer
  rationale: Mantém a imagem concreta e a estrutura simples do hebraico.
- source_word: וְשִׁלַּחְתַּנִי
  choice: Mas deixe-me ir
  rationale: No contexto, Davi pede a Jônatas que permita sua partida ou ausência; esta formulação é idiomática e preserva o caráter de pedido.
- source_word: וְנִסְתַּרְתִּי
  choice: para que eu me esconda
  rationale: Expressa a nuance volitiva e final que acompanha o pedido precedente.
- source_word: בַשָּׂדֶה
  choice: no campo
  rationale: Equivalente direto e natural para o substantivo singular hebraico.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: até a terceira tarde
  rationale: Preserva no texto a formulação elíptica do hebraico, enquanto a nota apresenta a interpretação temporal mais explícita.
theological_decisions: []
