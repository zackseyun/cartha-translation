  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: pt
  text: 'Então Davi disse a Jônatas[a]: “Quem me contará? Ou e se seu pai lhe responder com dureza?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Quem me contará? Ou o que seu pai lhe responderá — com dureza?” A construção hebraica é condensada; “Ou e se” explicita o sentido provável sem eliminar a alternativa introduzida por “ou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: A forma narrativa com waw consecutivo faz a narrativa avançar; “Então ... disse” expressa naturalmente essa sequência em português.
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: Davi disse a Jônatas
  rationale: Emprega as formas tradicionais dos nomes em português e traduz אֶל pela regência natural do verbo “dizer”.
- source_word: מִי יַגִּיד לִי
  choice: Quem me contará?
  rationale: O hifil de נגד significa “contar, informar, comunicar”. A pergunta independente preserva a estrutura interrogativa e a compressão inicial do hebraico.
- source_word: אוֹ מַה
  choice: Ou o que acontecerá se
  rationale: אוֹ mantém o valor disjuntivo “ou”, enquanto מַה introduz uma construção elíptica. “O que acontecerá se” torna a preocupação inteligível sem apagar o caráter comprimido do original.
- source_word: יַעַנְךָ אָבִיךָ
  choice: seu pai lhe responder
  rationale: ענה no qal significa “responder”; “lhe” representa o objeto de segunda pessoa masculino singular e soa natural em português amplamente compreensível.
- source_word: קָשָׁה
  choice: com dureza
  rationale: O adjetivo “duro, severo” funciona aqui de modo adverbial, caracterizando a resposta. “Com dureza” conserva a força sem exigir uma resposta apenas verbalmente ríspida.
theological_decisions: []
