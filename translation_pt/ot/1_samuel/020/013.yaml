  text: כֹּֽה יַעֲשֶׂה֩ יְהוָ֨ה לִֽ/יהוֹנָתָ֜ן וְ/כֹ֣ה יֹסִ֗יף כִּֽי יֵיטִ֨ב אֶל אָבִ֤/י אֶת הָֽ/רָעָה֙ עָלֶ֔י/ךָ וְ/גָלִ֨יתִי֙ אֶת אָזְנֶ֔/ךָ וְ/שִׁלַּחְתִּ֖י/ךָ וְ/הָלַכְתָּ֣ לְ/שָׁל֑וֹם וִ/יהִ֤י יְהוָה֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אָבִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: pt
  text: Que Yahweh faça assim a Jônatas, e ainda mais, se meu pai pretender fazer-lhe mal[a], e eu não[b] lhe revelar isso[c] nem mandá-lo embora, para que você vá em paz. Que Yahweh esteja com você, assim como esteve com meu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “se parecer bom a meu pai fazer o mal contra você”, isto é, se ele estiver inclinado ou decidido a prejudicar você.'
    reason: lexical_alternative
  - marker: b
    text: 'A negação não aparece expressamente nesta oração hebraica, mas está implícita na fórmula abreviada do juramento: a maldição recairia sobre Jônatas se ele não avisasse Davi nem o mandasse embora.'
    reason: source_ambiguity
  - marker: c
    text: Hebraico, literalmente, “descobrir o seu ouvido”, expressão idiomática que significa informar ou revelar algo a alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: Que Yahweh faça isto a Jônatas, e ainda mais
  rationale: Reproduz a fórmula hebraica de juramento e automaldição em português claro, mantendo a referência de Jônatas a si mesmo na terceira pessoa.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: se meu pai tiver a intenção de fazer mal a você
  rationale: A construção hebraica é elíptica e significa que Saul estaria inclinado ou decidido a causar mal a Davi. A formulação preserva a ideia sem sugerir que o mal seja moralmente bom.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: e eu não lhe revelar isso
  rationale: O hebraico diz literalmente 'descobrir o seu ouvido', expressão idiomática para informar alguém. A negação, embora não expressa nessa oração hebraica, é exigida pelo sentido da fórmula de juramento comprimida.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: nem mandar você partir
  rationale: 'Mantém a nuance causativa do verbo: Jônatas não apenas permitiria a partida de Davi, mas providenciaria que ele partisse.'
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: para que vá em paz
  rationale: Expressa naturalmente a finalidade ou o resultado da advertência e do envio, preservando a fórmula hebraica 'ir em paz'.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: Que Yahweh esteja com você
  rationale: O valor volitivo é expresso por 'que ... esteja', e o nome divino é transliterado como Yahweh.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: assim como esteve com meu pai
  rationale: Traduz diretamente a comparação com o apoio que Yahweh havia dado a Saul, sem determinar além do texto se esse apoio continuava no momento da fala.
theological_decisions:
- issue: Negação implícita na fórmula de juramento
  choice: Explicitar 'eu não ... revelar ... nem mandar você partir' no texto principal
  alternative: 'Omitir a negação e traduzir formalmente: ''e eu lhe revelar isso e mandar você partir'''
  rationale: A oração de maldição está comprimida no hebraico. Pelo contexto, Jônatas invoca a punição divina caso deixe de avisar Davi e de fazê-lo partir em segurança. Tornar a negação explícita comunica a lógica do juramento sem alterar seu conteúdo.
- issue: Situação do favor de Yahweh para com Saul
  choice: assim como esteve com meu pai
  alternative: assim como tem estado com meu pai
  rationale: O perfeito hebraico admite uma referência passada com possível relevância presente. O pretérito preserva a comparação sem afirmar explicitamente que o favor divino ainda permanece sobre Saul.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “você” de modo coerente para o singular e conserva “Yahweh” como nome próprio. A sintaxe mantém a solenidade do juramento sem reproduzir de forma obscura a elipse hebraica.
