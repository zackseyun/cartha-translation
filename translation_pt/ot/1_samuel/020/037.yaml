base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: pt
  text: 'Quando o rapaz chegou ao lugar da flecha que Jônatas havia atirado, Jônatas gritou para o rapaz: “A flecha não está além de você?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais adiante que você” ou “depois de você, mais adiante”. Em hebraico, literalmente, “a partir de você e adiante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O wayyiqtol de בוא descreve a chegada do rapaz ao ponto indicado; “chegou” é natural na narrativa portuguesa.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: נַעַר pode designar menino, jovem ou ajudante. “Rapaz” comunica sua juventude sem infantilizá-lo nem transformar sua função em parte explícita do texto.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: ao lugar da flecha
  rationale: Preserva a referência espacial de עַד מְקוֹם de modo claro e conciso.
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: que Jônatas tinha atirado
  rationale: ירה, neste contexto, é lançar ou disparar uma flecha. O mais-que-perfeito composto deixa clara a anterioridade do disparo em relação à chegada do rapaz.
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: Jônatas gritou para ele
  rationale: קרא com אַחֲרֵי indica chamar em voz alta alguém que segue adiante. “Gritou para ele” soa natural em português e o pronome evita repetição pesada.
- source_word: הֲלוֹא
  choice: não está
  rationale: A partícula introduz uma pergunta retórica que espera confirmação; a formulação negativa preserva essa força.
- source_word: הַחֵצִי
  choice: a flecha
  rationale: É a equivalência comum e inequívoca de חֵץ neste contexto.
- source_word: מִמְּךָ וָהָלְאָה
  choice: mais adiante que você
  rationale: A expressão indica um ponto que fica a partir do rapaz e para além dele. Esta formulação é natural em português e mantém a relação espacial usada como sinal para Davi.
