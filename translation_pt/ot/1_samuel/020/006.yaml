base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: pt
  text: 'Se seu pai realmente notar minha ausência,[a] diga: “Davi me pediu com muita insistência permissão para ir depressa a Belém, sua cidade,[b] porque ali se realiza o sacrifício anual para toda a família.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “realmente sentir minha falta”. A construção hebraica repete a raiz verbal para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “correr para Belém, sua cidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: realmente notar minha ausência
  rationale: A combinação do infinitivo absoluto com o verbo finito dá ênfase. No contexto da refeição, Saul perceberia que Davi não estava presente; a formulação explicita naturalmente essa ideia sem reduzir o verbo apenas a 'sentir falta'.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Tradução direta da forma com sufixo de segunda pessoa masculina singular, dirigida a Jônatas.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: me pediu com muita insistência permissão
  rationale: A construção enfática indica um pedido insistente ou urgente. 'Pediu ... permissão' expressa com clareza que Davi solicitou licença para partir.
- source_word: מִמֶּנִּי
  choice: me pediu
  rationale: O pronome de primeira pessoa é expresso de modo idiomático em português como objeto da pessoa a quem se faz o pedido.
- source_word: לָרוּץ
  choice: ir depressa
  rationale: O sentido concreto é 'correr', mas aqui descreve uma ida apressada. 'Ir depressa' conserva a ideia de urgência e soa natural em português.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: Belém, sua cidade
  rationale: Mantém a aposição literal do hebraico. 'Sua cidade' pode referir-se à cidade de origem de Davi, sem acrescentar uma explicação ausente do texto.
- source_word: זֶבַח הַיָּמִים
  choice: sacrifício anual
  rationale: A expressão indica um sacrifício recorrente no ciclo dos dias, provavelmente anual; 'anual' é claro e idiomático, embora a nota preserve a possibilidade mais literal.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: de toda a família
  rationale: מִשְׁפָּחָה pode designar família ou clã. 'Toda a família' é natural no contexto e preserva o valor abrangente de כָל.
