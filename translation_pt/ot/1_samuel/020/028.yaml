  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: pt
  text: 'Jônatas respondeu a Saul: “Davi me pediu com insistência permissão para ir a Belém.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Forma narrativa comum de ענה em diálogo; “respondeu” é natural e direto em português.
- source_word: אֶת שָׁאוּל
  choice: a Saul
  rationale: O marcador de objeto direto seguido do nome identifica Saul como a pessoa a quem Jônatas respondeu.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: pediu com insistência
  rationale: O infinitivo absoluto junto ao verbo finito intensifica o pedido. A expressão comunica a ênfase sem determinar indevidamente se o pedido foi repetido ou apenas urgente.
- source_word: מֵעִמָּדִי
  choice: me pediu ... permissão
  rationale: A preposição indica que a autorização foi solicitada a Jônatas; a construção com pronome oblíquo é idiomática em português.
- source_word: עַד בֵּית לָחֶם
  choice: para ir a Belém
  rationale: O destino pressupõe o movimento solicitado no contexto. Tornar “ir” explícito produz português claro sem alterar o sentido.
- source_word: בֵּית לָחֶם
  choice: Belém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
