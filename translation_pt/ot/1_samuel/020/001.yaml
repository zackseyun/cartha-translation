  - severity: low
    issue: O presente do particípio hebraico pode ser expresso mais claramente como ação em andamento.
    rationale: «Está procurando tirar a minha vida» reflete naturalmente o valor progressivo de מְבַקֵּשׁ, sem acrescentar interpretação.
