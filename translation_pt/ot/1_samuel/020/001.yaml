base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: pt
  text: 'Então Davi fugiu de Naiote, em Ramá,[a] foi até Jônatas e lhe disse: “O que foi que eu fiz? Qual é a minha culpa e qual é o meu pecado diante de seu pai, para ele estar procurando tirar a minha vida?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Naiote, junto a Ramá”. O hebraico provavelmente se refere ao conhecido lugar chamado Naiote, associado a Ramá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: O verbo ברח expressa fuga ou escape; “fugiu” comunica de modo conciso a urgência da ação.
- source_word: מִנָּוֹת בָּרָמָה
  choice: de Naiote, em Ramá
  rationale: No contexto, נוות é mais provavelmente um topônimo ligado a Ramá. A transliteração preserva o nome próprio, e “em Ramá” mantém a relação locativa sem identificar os dois lugares de forma excessivamente rígida.
- source_word: וַיָּבֹא ... לִפְנֵי יְהוֹנָתָן
  choice: foi até Jônatas
  rationale: A formulação natural em português representa o movimento de Davi até a presença de Jônatas. Traduzir literalmente por “veio diante de Jônatas” seria menos idiomático no português corrente.
- source_word: מֶה עָשִׂיתִי
  choice: O que foi que eu fiz?
  rationale: A pergunta enfática soa natural em português e preserva o tom angustiado e defensivo de Davi.
- source_word: עֲוֺנִי
  choice: minha culpa
  rationale: עָוֹן pode indicar iniquidade, delito ou culpa. “Culpa” convém ao contexto de autodefesa e não se confunde completamente com o termo seguinte.
- source_word: חַטָּאתִי
  choice: meu pecado
  rationale: “Pecado” conserva a força moral de חַטָּאת e mantém a distinção lexical em relação a “culpa”.
- source_word: לִפְנֵי אָבִיךָ
  choice: diante de seu pai
  rationale: 'A tradução conserva a imagem relacional de לִפְנֵי e sua possível abrangência: à vista do pai de Jônatas ou em relação a ele.'
- source_word: כִּי
  choice: para que
  rationale: Neste contexto, a locução liga a suposta culpa de Davi à reação de Saul e expressa naturalmente em português a consequência ou justificativa questionada, sem afirmar que tal culpa realmente exista.
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: procure tirar a minha vida
  rationale: A expressão hebraica significa buscar a vida de alguém, isto é, tentar matá-lo. “Tirar a minha vida” mantém parte da imagem original e deixa claro o sentido em português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição paralela de “minha culpa” e “meu pecado” foi mantida para refletir a intensidade retórica e a distinção entre os dois substantivos hebraicos.
