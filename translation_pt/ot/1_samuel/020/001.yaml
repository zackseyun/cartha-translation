  to: 'Então Davi fugiu de Naiote, em Ramá,[a] foi até Jônatas e lhe disse: “O que foi que eu fiz? Qual é a minha culpa e qual é o meu pecado diante de seu pai, para ele estar procurando tirar a minha vida?”'
  rationale: A revisão substitui a oração com «para que» por «para ele estar procurando», que em português liga mais diretamente a suposta culpa à ação de Saul como consequência ou justificativa questionada, em vez de sugerir finalidade. A forma progressiva também representa bem o particípio hebraico.
