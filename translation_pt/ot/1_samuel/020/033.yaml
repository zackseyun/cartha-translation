lexical_decisions:
- source_word: וַיָּטֶל
  choice: arremessou
  rationale: Expressa com naturalidade a ação forte e hostil de lançar uma arma.
- source_word: הַחֲנִית
  choice: a lança
  rationale: Equivalente amplo e tradicional para a arma mencionada, sem especificar desnecessariamente um dardo mais leve.
- source_word: עָלָיו
  choice: contra ele
  rationale: No contexto de agressão, comunica claramente a direção hostil do arremesso.
- source_word: לְהַכֹּתוֹ
  choice: para feri-lo
  rationale: Mantém a construção de finalidade e indica a intenção violenta; o verbo hebraico pode significar golpear ou ferir.
- source_word: וַיֵּדַע
  choice: soube
  rationale: Preserva o sentido básico de conhecer, aqui como conclusão confirmada pelo ato de Saul.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do que Jônatas passou a saber.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: seu pai estava decidido
  rationale: Verte de modo idiomático a expressão hebraica que apresenta a decisão como completa ou firmemente estabelecida da parte de Saul.
- source_word: לְהָמִית אֶת דָּוִד
  choice: a matar Davi
  rationale: Tradução direta, clara e natural do propósito de causar a morte de Davi.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma portuguesa consagrada do nome.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma portuguesa consagrada do nome.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma corrente no português brasileiro e amplamente reconhecida.
