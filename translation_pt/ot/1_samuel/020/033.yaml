  verdict: revise
  source_fidelity: 'A tradução acompanha bem a sequência e o sentido do hebraico: Saul lança a lança contra Jônatas, e este reconhece a decisão resoluta de seu pai de matar Davi. A expressão idiomática כָלָה הִיא מֵעִם אָבִיו é adequadamente comunicada por “seu pai estava decidido”. Contudo, “para feri-lo” pode sugerir especificamente causar um ferimento, enquanto לְהַכֹּתוֹ diz mais literalmente “para atingi-lo/golpeá-lo”; “para atingi-lo” preserva melhor essa amplitude.'
