  terminology: Os nomes Saul, Jônatas e Davi seguem as formas portuguesas consagradas. “Lança” é uma escolha apropriada para חֲנִית. A nota explica de modo útil a construção hebraica referente à decisão de Saul, sem impor uma leitura doutrinária ou excessivamente interpretativa.
