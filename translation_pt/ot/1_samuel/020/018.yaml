  text: וַ/יֹּֽאמֶר ל֥/וֹ יְהוֹנָתָ֖ן מָחָ֣ר חֹ֑דֶשׁ וְ/נִפְקַ֕דְתָּ כִּ֥י יִפָּקֵ֖ד מוֹשָׁבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/018.yaml
  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: pt
  text: 'Jônatas lhe disse: “Amanhã é lua nova, e sua ausência será notada[a], pois o seu lugar estará vazio.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você será notado ... porque o seu lugar estará desocupado”. O hebraico repete o verbo פקד nas duas orações, criando um jogo de palavras que não se preserva naturalmente em português.'
    reason: Registra a repetição lexical e alternativas de sentido do verbo hebraico, sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: lhe disse
  rationale: Forma narrativa corrente de אמר com objeto indireto; em português, a colocação antes do verbo é natural nesta introdução de fala.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מָחָר
  choice: Amanhã
  rationale: Advérbio temporal direto que situa a celebração no dia seguinte.
- source_word: חֹדֶשׁ
  choice: Festa da Lua Nova
  rationale: Neste contexto, refere-se à celebração da lua nova ligada à refeição real, e não simplesmente ao mês; explicitar “Festa” torna a referência clara ao leitor moderno.
- source_word: וְנִפְקַדְתָּ
  choice: sua ausência será notada
  rationale: O nifal de פקד indica aqui que a falta de Davi chamará atenção. Esta formulação natural preserva melhor a ideia de constatação da ausência do que “sentirão sua falta”, que poderia sugerir principalmente saudade.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual a ausência será percebida, em registro natural e digno.
- source_word: יִפָּקֵד
  choice: estará vazio
  rationale: Com מוֹשָׁבֶךָ como sujeito, expressa que o lugar de Davi ficará desocupado. O português não reproduz com naturalidade a repetição hebraica de פקד.
- source_word: מוֹשָׁבֶךָ
  choice: o seu lugar
  rationale: No contexto da refeição real, designa o lugar reservado a Davi à mesa; “lugar” é natural e mantém a amplitude do substantivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução explicita que חֹדֶשׁ é a Festa da Lua Nova e verte o jogo verbal hebraico por duas expressões idiomáticas complementares. Não se acrescentou nota porque a perda do jogo de palavras não altera o sentido básico do versículo.
