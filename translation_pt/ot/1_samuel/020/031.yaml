    text: 'Expressão idiomática hebraica: “filho da morte”, isto é, alguém passível de morte ou condenado à morte.'
    reason: lexical_alternative
  revision_rationale: A revisão explicita «agora» em וְעַתָּה e torna inequívoca a ordem de enviar alguém para buscar e levar Davi a Saul. Também simplifica «firmemente estabelecidos» sem perda do valor de estabilidade do nifal de כון. A expressão idiomática hebraica e seu marcador são preservados.
