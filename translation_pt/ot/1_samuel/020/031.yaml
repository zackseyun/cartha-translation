  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: pt
  text: Pois, enquanto o filho de Jessé viver sobre a terra, nem você nem o seu reino estarão estabelecidos. Agora, mande buscá-lo e trazê-lo até mim, pois ele é filho da morte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expressão idiomática hebraica: “filho da morte”, isto é, alguém passível de morte ou condenado à morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Saul para sua ira e para a ordem que vem em seguida, preservando o valor causal.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: enquanto
  rationale: 'Expressa de modo natural em português a duração indicada pelo idioma hebraico: “durante todo o tempo em que”.'
- source_word: בֶּן יִשַׁי
  choice: o filho de Jessé
  rationale: Mantém o patronímico usado por Saul em vez de substituir pelo nome Davi, preservando o distanciamento e o tom depreciativo.
- source_word: חַי עַל הָאֲדָמָה
  choice: viver sobre a terra
  rationale: Segue de perto a formulação hebraica sem restringir אֲדָמָה ao território de Israel, embora “na terra” também seja possível.
- source_word: לֹא תִכּוֹן
  choice: nem ... estarão firmemente estabelecidos
  rationale: Preserva o sentido passivo-resultativo do nifal de כון, isto é, estar estabelecido ou firme, com concordância natural para os dois elementos coordenados em português.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: nem você nem o seu reino
  rationale: Reproduz a coordenação negativa de maneira idiomática; “reino” comunica adequadamente o contexto político e dinástico de מַלְכוּת.
- source_word: וְעַתָּה
  choice: Portanto
  rationale: Marca a inferência urgente que Saul tira da afirmação anterior; o sentido de “agora” fica pragmaticamente presente na ordem imediata, sem tornar a frase pesada.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: mande buscá-lo e traga-o até mim
  rationale: Conserva os dois imperativos e comunica naturalmente a ordem de enviar alguém para buscar Davi e fazê-lo comparecer diante de Saul.
- source_word: בֶּן מָוֶת הוּא
  choice: ele é filho da morte
  rationale: Mantém no texto a expressão hebraica forte e concreta, deixando a nota esclarecer que ela indica alguém sujeito ou condenado à morte.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “você” corresponde ao singular dirigido a Jônatas. A expressão incomum “filho da morte” foi preservada por transparência ao hebraico e explicada em nota; o marcador foi colocado junto à expressão a que pertence.
