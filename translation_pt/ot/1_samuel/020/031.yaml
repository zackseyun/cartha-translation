revisions:
- from: Pois, enquanto o filho de Jessé viver sobre a terra, nem você nem o seu reino estarão firmemente estabelecidos. Portanto, mande buscá-lo e traga-o até mim, pois ele é filho da morte[a].
  to: Pois, enquanto o filho de Jessé viver sobre a terra, nem você nem o seu reino estarão estabelecidos. Agora, mande buscá-lo e trazê-lo até mim, pois ele é filho da morte[a].
  rationale: A revisão explicita «agora» em וְעַתָּה e torna inequívoca a ordem de enviar alguém para buscar e levar Davi a Saul. Também simplifica «firmemente estabelecidos» sem perda do valor de estabilidade do nifal de כון. A expressão idiomática hebraica e seu marcador são preservados.
