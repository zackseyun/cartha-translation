  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: pt
  text: Pela manhã, Jônatas saiu para o campo, para o encontro marcado[a] com Davi, e um menino ainda pequeno[b] estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na hora marcada com Davi”. A palavra hebraica מוֹעֵד pode indicar tanto um tempo determinado quanto um encontro marcado; o contexto do encontro combinado favorece a tradução no texto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um menino de pouca idade” ou “um criado jovem”. A palavra hebraica נַעַר pode se referir a um menino, um jovem ou um criado, conforme o contexto; קָטֹן significa “pequeno” ou “jovem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Pela manhã
  rationale: A forma narrativa וַיְהִי introduz o acontecimento seguinte, enquanto בַבֹּקֶר indica o momento. Em português, “Pela manhã” expressa naturalmente a sequência temporal sem o acréscimo pouco informativo de “e aconteceu”.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Preserva o sentido direcional comum de יצא e soa natural na narrativa.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַשָּׂדֶה
  choice: para o campo
  rationale: שָׂדֶה designa campo ou área aberta; a formulação mantém o artigo definido e se ajusta ao cenário do contexto.
- source_word: לְמוֹעֵד דָּוִד
  choice: para o encontro marcado com Davi
  rationale: מוֹעֵד pode indicar um tempo determinado ou um encontro combinado. O contexto do sinal e do encontro previamente acertados favorece “encontro marcado”, sem eliminar a alternativa lexical, registrada em nota.
- source_word: וְנַעַר קָטֹן
  choice: e um menino ainda pequeno
  rationale: נַעַר pode significar menino, jovem ou criado, e קָטֹן destaca pouca idade ou pequenez. “Menino ainda pequeno” preserva essa ênfase sem afirmar no texto principal que sua função era a de criado.
- source_word: עִמּוֹ
  choice: estava com ele
  rationale: O verbo “estava” é suprido naturalmente em português para formar a oração que expressa acompanhamento.
