  text: וְ/שִׁלַּשְׁתָּ֙ תֵּרֵ֣ד מְאֹ֔ד וּ/בָאתָ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁר נִסְתַּ֥רְתָּ שָּׁ֖ם בְּ/י֣וֹם הַֽ/מַּעֲשֶׂ֑ה וְ/יָ֣שַׁבְתָּ֔ אֵ֖צֶל הָ/אֶ֥בֶן הָ/אָֽזֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: pt
  text: No terceiro dia[a], desça depressa[b] e vá ao lugar onde você se escondeu no dia daquele acontecimento[c]. Fique junto à pedra de Ezel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “quando você fizer isso pela terceira vez” ou “por três dias”. O hebraico é incomum; o contexto favorece “no terceiro dia”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desça muito”. A expressão também pode significar “desça bastante” ou “desça para mais longe”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “no dia do feito”; também pode ser entendido como “no dia do assunto” ou “no dia da atividade”. A expressão provavelmente se refere à ocasião ou ao assunto anteriormente combinado.'
    reason: lexical_alternative
  - marker: d
    text: “Ezel” provavelmente é um nome de lugar ou uma designação fixa da pedra. O termo hebraico pode estar relacionado a “ir” ou “partida”, mas seu sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: No terceiro dia
  rationale: A forma intensiva de שׁלשׁ é incomum, mas, no fluxo das instruções e da sequência combinada, indica mais naturalmente o terceiro dia. A nota preserva outras análises possíveis.
- source_word: תֵּרֵד מְאֹד
  choice: desça depressa
  rationale: יָרַד significa “descer”, e מְאֹד intensifica a ação. “Desça depressa” expressa com naturalidade a urgência contextual, embora a expressão também possa indicar descer bastante ou para mais longe; essa incerteza é registrada em nota.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: e vá ao lugar
  rationale: Embora בוא possa ser vertido literalmente por “vir”, em uma instrução dirigida a Davi, “vá ao lugar” é mais natural em português e mantém o movimento até o local indicado.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: onde você se escondeu
  rationale: O nifal tem aqui sentido reflexivo ou passivo; o contexto mostra Davi ocultando-se deliberadamente, de modo que “se escondeu” é claro e idiomático.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: no dia daquele acontecimento
  rationale: מַעֲשֶׂה pode designar feito, ato, assunto ou acontecimento. “Daquele acontecimento” retoma de modo natural a ocasião anterior sem especificar excessivamente a expressão obscura.
- source_word: וְיָשַׁבְתָּ
  choice: Fique
  rationale: יָשַׁב pode significar sentar-se, habitar ou permanecer. Neste contexto de espera em um esconderijo, “fique” comunica naturalmente a instrução.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: junto à pedra de Ezel
  rationale: אֶבֶן é “pedra”, e הָאָזֶל é melhor entendido como nome ou designação fixa. A transliteração “Ezel” evita impor uma etimologia incerta.
