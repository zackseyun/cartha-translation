translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O tratamento por “você” torna as instruções naturais sem coloquialismo excessivo. As ambiguidades lexicais reais foram mantidas em notas, especialmente na expressão do terceiro dia, no intensificador ligado a “descer”, em “dia daquele acontecimento” e no nome Ezel.
