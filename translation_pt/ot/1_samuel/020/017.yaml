base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: pt
  text: Por causa do amor que tinha por ele, Jônatas fez Davi jurar novamente[a], pois o amava como à própria vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuou fazendo Davi jurar”; também pode ser entendido como “pôs Davi novamente sob juramento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “com o amor de sua própria alma”, expressão que indica profunda dedicação pessoal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: novamente
  rationale: Com o infinitivo seguinte, יסף indica repetição ou continuação da ação; “novamente” comunica com naturalidade que Jônatas renovou a exigência do juramento.
- source_word: לְהַשְׁבִּיעַ
  choice: fez Davi jurar
  rationale: 'O hifil de שבע tem sentido causativo: fazer alguém jurar ou colocá-lo sob juramento. A formulação preserva essa força de modo claro e idiomático.'
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: Por causa do amor que tinha por ele
  rationale: O בְּ pode indicar aqui a base ou motivação do ato. A formulação explicita naturalmente essa relação sem acrescentar uma espécie de amor que o hebraico não especifica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da ação de Jônatas e mantém uma ligação literária natural em português.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: como à própria vida
  rationale: נֶפֶשׁ pode denotar alma, vida ou a própria pessoa. Neste idioma de intensa afeição pessoal, “a própria vida” é claro em português e conserva a força da expressão.
- source_word: אֲהֵבוֹ
  choice: o amava
  rationale: Preserva diretamente o verbo אהב e sua intensidade, sem reduzi-lo a mera amizade nem lhe impor uma interpretação adicional.
theological_decisions:
- issue: Natureza do amor de Jônatas por Davi
  choice: Manter a linguagem explícita de amor e sua intensidade, sem classificá-la além do que o texto afirma.
  alternative: Substituir “amor” por “amizade” ou empregar linguagem que especifique uma relação romântica ou sexual.
  rationale: O hebraico repete a raiz אהב e descreve amor profundo. A tradução deve conservar essa força e, ao mesmo tempo, não importar uma caracterização que o versículo não torna explícita.
- issue: Sentido de נֶפֶשׁ na comparação
  choice: “própria vida” no texto, com a alternativa literal “própria alma” em nota.
  alternative: “própria alma” no texto principal.
  rationale: “Vida” exprime de modo natural o valor da própria pessoa neste contexto, enquanto a nota preserva a forma tradicional e a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem inicial destaca naturalmente a motivação expressa por בְּאַהֲבָתוֹ, e o texto mantém “amor” sem resolver além do hebraico a natureza da relação.
