  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: pt
  text: Assim, Davi se escondeu no campo. Quando chegou a lua nova, o rei sentou-se para comer a refeição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sentou-se sobre o pão para comer”; aqui, “pão” representa a refeição inteira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: se escondeu
  rationale: 'O nifal de סתר tem aqui sentido reflexivo ou intransitivo: Davi ocultou a si mesmo. “Se escondeu” expressa com naturalidade sua ação intencional.'
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: שָׂדֶה significa normalmente “campo”; a forma definida é preservada por “no campo”.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: Quando chegou a lua nova
  rationale: Neste contexto, הַחֹדֶשׁ designa a ocasião da lua nova, não apenas o mês. A construção temporal comunica naturalmente a progressão narrativa.
- source_word: וַיֵּשֶׁב
  choice: sentou-se
  rationale: ישב, no contexto de uma refeição, indica que o rei tomou seu lugar para comer.
- source_word: עַל הַלֶּחֶם
  choice: para tomar a refeição
  rationale: Embora a expressão seja literalmente “sobre o pão”, לֶחֶם funciona metonimicamente para a refeição. A formulação evita uma tradução artificial e preserva o sentido contextual.
- source_word: לֶאֱכֹל
  choice: para tomar
  rationale: O infinitivo expressa finalidade. Em português, “tomar a refeição” reúne naturalmente a ideia de sentar-se para comer.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido usado no hebraico, sem substituí-lo pelo nome de Saul.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Lua nova” preserva a referência à ocasião festiva, e “tomar a refeição” oferece uma expressão natural sem apagar a imagem hebraica, registrada na nota.
