base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/032.yaml
  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: pt
  text: 'Jônatas respondeu a Saul, seu pai, e lhe disse: “Por que ele deve ser morto?[a] O que foi que ele fez?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que ele deve ser executado?” O verbo hebraico indica que alguém é levado à morte, não simplesmente que morre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: No diálogo narrativo, ענה tem o sentido comum de responder; a forma portuguesa é natural e preserva a relação com a fala anterior.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: a Saul, seu pai
  rationale: Mantém Saul como objeto direto e explicita a aposição אָבִיו de modo claro e natural em português.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: e lhe disse
  rationale: Conserva tanto o verbo de fala quanto o destinatário expresso no hebraico, evitando a formulação menos natural 'disse a ele'.
- source_word: לָמָּה
  choice: Por que
  rationale: Equivalente interrogativo direto, corrente e preciso.
- source_word: יוּמַת
  choice: deve ser morto
  rationale: O hofal de מות expressa a ação causativa passiva de ser levado à morte, e não apenas morrer. 'Deve' preserva no contexto a força modal da pergunta.
- source_word: מֶה עָשָׂה
  choice: O que foi que ele fez?
  rationale: Formulação idiomática em português que enfatiza a exigência de indicar qual ato justificaria a sentença.
