  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: pt
  text: E, quanto ao assunto de que eu e você falamos[a], eis que Yahweh está entre mim e você para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto à palavra que eu e você falamos”. O termo hebraico דָּבָר pode significar “palavra”, “assunto” ou “coisa”; aqui se refere ao que foi previamente discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: E quanto ao que
  rationale: A construção introduz como tópico o assunto já tratado. Em português corrente, “quanto ao que” retoma naturalmente o acordo sem exigir o substantivo mais rígido “assunto”.
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: eu e você combinamos
  rationale: No contexto, o que ambos falaram constitui um acordo. “Combinamos” comunica essa força relacional em português natural; a nota preserva a alternativa mais formal e a amplitude lexical de דָּבָר.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a chamada solene de atenção do hebraico e se ajusta ao registro bíblico digno sem ser obscuro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּינִי וּבֵינְךָ
  choice: entre mim e você
  rationale: Preserva a ordem hebraica e não explicita além do texto se Yahweh é testemunha, garantidor ou presença entre os dois.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa natural para duração contínua e solene.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” conserva o nome pessoal em transliteração.
- issue: Sentido de Yahweh estar “entre” os dois homens
  choice: manter literalmente “está entre mim e você”
  alternative: explicitar “é testemunha/garantidor entre nós”
  rationale: O contexto permite a noção de testemunha ou garantidor da aliança, mas o hebraico não a declara expressamente; a formulação preserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Você” torna a relação pessoal natural; “eis que” preserva a solenidade do marcador hebraico. A redação evita acrescentar ao texto a interpretação de Yahweh como testemunha ou garantidor, embora o contexto a sugira.
