  to: 'Jônatas disse a Davi: “Tão certo como vive Yahweh, o Deus de Israel,[a] amanhã, por volta desta hora, ou no terceiro dia,[b] sondarei meu pai. Se ele estiver bem-disposto para com Davi, não lhe mandarei então uma mensagem para lhe revelar isso?[c][d]”'
