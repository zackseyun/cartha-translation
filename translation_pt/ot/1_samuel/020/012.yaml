    rationale: O verbo “enviar” está sem objeto expresso no hebraico. “Alguém” fixa um mensageiro humano, ao passo que o texto pode referir-se ao envio de uma comunicação; uma formulação com “mensagem” torna a frase portuguesa gramatical sem alegar que o hebraico nomeia uma pessoa.
