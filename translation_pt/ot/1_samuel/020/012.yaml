base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: pt
  text: 'Jônatas disse a Davi: “Tão certo como vive Yahweh, o Deus de Israel,[a] amanhã, por volta desta hora, ou no terceiro dia,[b] sondarei meu pai. Se ele estiver bem-disposto para com Davi, não lhe mandarei então uma mensagem para lhe revelar isso?[c][d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação hebraica é elíptica e invoca solenemente Yahweh. “Tão certo como vive” explicita o sentido juratório provável; também se pode entender: “Yahweh, o Deus de Israel, é testemunha”.'
    reason: textual_difficulty
  - marker: b
    text: A expressão temporal hebraica é comprimida e difícil; também pode ser entendida como “amanhã, por volta desta hora, no terceiro dia”.
    reason: alternative_reading
  - marker: c
    text: 'A pergunta negativa tem força de garantia enfática: “certamente lhe mandarei uma mensagem para lhe revelar isso”. O objeto de “mandar” não é expresso no hebraico.'
    reason: textual_difficulty
  - marker: d
    text: Hebraico, literalmente, “descobrirei o seu ouvido”, expressão idiomática que significa contar ou revelar algo a alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, o Deus de Israel
  rationale: Mantém o nome divino e traduz diretamente a expressão em construção, com naturalidade em português.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: sondarei meu pai
  rationale: No contexto, Jônatas procurará descobrir a disposição de Saul; “sondar” preserva o caráter exploratório do verbo sem sugerir uma investigação formal.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: amanhã, por volta desta hora — no terceiro dia —
  rationale: Conserva a expressão temporal comprimida e sua tensão interna, sem inserir silenciosamente uma alternativa que não está expressa no hebraico.
- source_word: טוֹב אֶל דָּוִד
  choice: bem-disposto para com Davi
  rationale: Expressa a atitude favorável de Saul em relação a Davi, que é o sentido contextual da construção טוֹב + אֶל.
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: não mandarei então alguém até você?
  rationale: Preserva a forma negativa de valor retórico do texto massorético. “Alguém” é explicitado em português como objeto implícito de “mandar”.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: e lhe revelarei isso?
  rationale: Traduz naturalmente o sentido do idioma hebraico, literalmente “descobrir o ouvido”, enquanto a imagem original é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Invocação divina em uma oração hebraica elíptica
  choice: Por Yahweh, o Deus de Israel
  alternative: Yahweh, o Deus de Israel, é testemunha; Tão certo como vive Yahweh, o Deus de Israel
  rationale: O hebraico invoca solenemente o nome divino, mas não contém de forma explícita “vive” nem “é testemunha”. A formulação escolhida comunica o caráter de juramento e a nota preserva a elipse.
- issue: Força da oração negativa וְלֹא אָז אֶשְׁלַח
  choice: pergunta retórica negativa
  alternative: 'afirmação enfática: “certamente mandarei alguém até você”'
  rationale: A pergunta retórica mantém mais de perto a forma difícil do texto massorético sem eliminar sua provável força de promessa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Empregou-se “você” para a segunda pessoa singular e “para com” apenas na expressão relacional “bem-disposto para com Davi”. Os travessões marcam a natureza parentética e comprimida da indicação temporal.
