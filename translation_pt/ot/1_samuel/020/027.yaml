base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: pt
  text: 'No dia seguinte, o segundo dia da lua nova, o lugar de Davi estava vazio. Então Saul perguntou a Jônatas, seu filho: “Por que o filho de Jessé não veio para a refeição[a], nem ontem nem hoje?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ao pão”, uma forma comum de se referir à refeição ou à comunhão à mesa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת הַחֹדֶשׁ הַשֵּׁנִי
  choice: No dia seguinte, o segundo dia da lua nova
  rationale: A formulação preserva a sequência temporal e entende חֹדֶשׁ, conforme o contexto da celebração à mesa, como a lua nova. A aposição identifica esse dia seguinte como o segundo dia da observância.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: o lugar de Davi estava vazio
  rationale: O nifal de פקד indica aqui que o lugar de Davi foi achado desocupado ou que sua ausência se tornou evidente. A expressão escolhida é natural em português no contexto de uma refeição.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Mantém explicitamente a relação filial indicada no hebraico.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente direto e corrente da pergunta causal hebraica.
- source_word: בֶן יִשַׁי
  choice: o filho de Jessé
  rationale: Preserva o patronímico empregado por Saul em vez de substituí-lo por “Davi”, mantendo a possível distância ou hostilidade retórica sem torná-la explícita na tradução.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: nem ontem nem hoje
  rationale: Em uma pergunta negativa, esta é a forma idiomática em português de expressar os dois momentos abrangidos pela construção hebraica “também ontem, também hoje”.
- source_word: אֶל הַלָּחֶם
  choice: para a refeição
  rationale: Embora לֶחֶם signifique literalmente “pão”, neste contexto funciona por metonímia para a refeição à mesa. A tradução comunica o sentido contextual, e a nota preserva a forma literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservou-se “filho de Jessé” por seu efeito narrativo e evitou-se explicitar uma intenção depreciativa que permanece apenas possível no contexto.
