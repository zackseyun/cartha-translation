base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: pt
  text: O rei sentou-se em seu lugar, como de costume, junto à parede. Jônatas se levantou, e Abner sentou-se ao lado de Saul; mas o lugar de Davi estava vazio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o lugar de Davi estava desocupado”.'
    reason: A construção hebraica pode ser expressa em português como a ausência ou desocupação do lugar que cabia a Davi.
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Preserva o título definido empregado no hebraico; no contexto, refere-se a Saul.
- source_word: מוֹשָׁבוֹ
  choice: seu lugar
  rationale: No contexto da refeição, designa o lugar em que o rei se sentava. “Lugar” é natural em português e mantém a relação lexical com מְקוֹם no fim do versículo.
- source_word: כְּפַעַם בְּפַעַם
  choice: como de costume
  rationale: Expressão idiomática que indica repetição conforme as ocasiões anteriores.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: junto à parede
  rationale: A expressão localiza o assento do rei em relação à parede. A formulação evita o pouco natural “assento da parede” sem perder a imagem espacial.
- source_word: וַיָּקָם יְהוֹנָתָן
  choice: Jônatas se levantou
  rationale: Tradução direta da forma narrativa de קום, preservando a ação do texto massorético sem tentar harmonizar a disposição dos lugares.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: Abner sentou-se ao lado de Saul
  rationale: מִצַּד expressa posição ao lado de alguém; a formulação é clara e corrente em português.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: o lugar de Davi ficou vazio
  rationale: No contexto, a forma de פקד indica que o lugar esperado de Davi estava desocupado, evidenciando sua ausência. A nota registra uma alternativa mais explícita.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. Mantém “o rei” em vez de substituir o título por “Saul” e conserva a sequência narrativa e a aparente tensão espacial do hebraico.
