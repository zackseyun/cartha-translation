  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: pt
  text: 'Então Jônatas disse a Davi[a]: “Venha, vamos sair para o campo”. E os dois saíram para o campo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá, e vamos sair para o campo”. O imperativo לְכָה pode ser traduzido mais literalmente por “vá”, mas, neste contexto de convite para irem juntos, “venha” é mais natural em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” preserva a sequência de modo natural em português.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל דָּוִד
  choice: a Davi
  rationale: Equivalente português natural da preposição direcional אֶל diante do nome próprio.
- source_word: לְכָה
  choice: Venha
  rationale: Embora o imperativo de הלך signifique literalmente “vá”, aqui ele introduz um convite para uma ação conjunta; “Venha” comunica naturalmente essa função em português.
- source_word: וְנֵצֵא
  choice: vamos sair
  rationale: O coortativo na primeira pessoa do plural expressa proposta ou convite; “vamos sair” é a formulação corrente em português.
- source_word: הַשָּׂדֶה
  choice: para o campo
  rationale: שׂדה pode designar campo ou área aberta. Com o verbo de movimento, “para o campo” é direto e natural; a repetição do destino foi preservada.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: E os dois saíram
  rationale: O wayyiqtol prossegue a ação narrativa, e שְׁנֵיהֶם enfatiza que ambos foram juntos; “os dois” preserva isso com clareza.
