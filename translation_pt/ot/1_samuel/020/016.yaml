  text: וַ/יִּכְרֹ֥ת יְהוֹנָתָ֖ן עִם בֵּ֣ית דָּוִ֑ד וּ/בִקֵּ֣שׁ יְהוָ֔ה מִ/יַּ֖ד אֹיְבֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: pt
  text: Assim, Jônatas fez uma aliança com a casa de Davi, e que o SENHOR peça contas aos inimigos de Davi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: fez uma aliança com
  rationale: A expressão hebraica emprega literalmente o verbo “cortar”, mas a formulação portuguesa natural para o ato formal é “fazer uma aliança com”.
- source_word: בֵּית דָּוִד
  choice: casa de Davi
  rationale: Preserva a expressão dinástica hebraica, que abrange Davi e sua linhagem.
- source_word: וּבִקֵּשׁ יְהוָה מִיַּד
  choice: Que o SENHOR peça contas a
  rationale: O verbo pode significar buscar, requerer ou exigir; junto de “da mão de”, aqui forma uma fórmula de responsabilização. A construção volitiva se ajusta ao contexto da aliança e evita o obscuro “buscou isso”.
- source_word: אֹיְבֵי דָוִד
  choice: os inimigos de Davi
  rationale: Tradução direta, mantendo o plural e a relação explícita com Davi.
theological_decisions:
- issue: Força verbal de וּבִקֵּשׁ e relação com a fórmula da aliança
  choice: 'oração imprecatória: “Que o SENHOR peça contas...”'
  alternative: 'declaração narrativa: “e o SENHOR pediu contas...”'
  rationale: Embora a forma possa ser lida como perfeito consecutivo, o contexto e a construção da aliança favorecem entendê-la como uma invocação elíptica de sanção contra quem violar o compromisso. A tradução não identifica além do texto o conteúdo exato da cobrança.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH / Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes.
translation_notes:
  register: Português moderno, claro e solene. A pontuação e as aspas explicitam a leitura da segunda oração como sanção invocada na celebração da aliança, sem acrescentar um objeto ausente no hebraico.
