base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: pt
  text: Então Jônatas se levantou da mesa, ardendo de ira, e não comeu nada no segundo dia do mês[a], pois estava entristecido por causa de Davi, porque o pai de Jônatas o havia humilhado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no segundo dia da lua nova”. A palavra hebraica חֹדֶשׁ pode significar “mês” ou “lua nova”; aqui, o contexto é a refeição real da lua nova.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Expressa naturalmente o wayyiqtol de קום no contexto de Jônatas deixar a mesa.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: da mesa
  rationale: Forma idiomática em português para o movimento de afastar-se do lugar da refeição.
- source_word: בָּחֳרִי אָף
  choice: ardendo de ira
  rationale: Preserva a imagem hebraica do calor ou ardor da ira e sua forte intensidade.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: não comeu nada
  rationale: Neste contexto de refeição, לֶחֶם designa alimento em geral; a formulação comunica que Jônatas se absteve de comer.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: no segundo dia do mês
  rationale: Mantém o sentido mais direto de חֹדֶשׁ como mês, sem eliminar a possibilidade contextual de referência à festa da lua nova, registrada em nota.
- source_word: נֶעְצַב
  choice: estava profundamente entristecido
  rationale: O nifal de עצב indica dor ou aflição; o advérbio explicita em português a força emocional sugerida pelo contexto.
- source_word: אֶל דָּוִד
  choice: por causa de Davi
  rationale: Representa Davi como objeto ou motivo da tristeza de Jônatas sem especificar além do hebraico a natureza exata dessa relação causal.
- source_word: הִכְלִמוֹ
  choice: o havia humilhado
  rationale: O hifil de כלם significa envergonhar ou humilhar; a escolha transmite a desonra pessoal causada pelo pai.
- source_word: אָבִיו
  choice: seu pai
  rationale: Conserva a referência do sufixo hebraico ao pai de Jônatas e a tensão familiar do relato.
theological_decisions:
- issue: Referente do pronome em הִכְלִמוֹ ('o havia humilhado')
  choice: Mantido como pronome masculino ambíguo na tradução
  alternative: Explicitar 'havia humilhado Davi' ou 'havia humilhado Jônatas'
  rationale: A forma hebraica permite discussão sobre o referente; explicitar um nome resolveria uma ambiguidade que o texto não resolve formalmente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluência brasileira. A expressão imagética “ardendo de ira” preserva o hebraísmo sem soar excessivamente literal; a ambiguidade do pronome final foi deliberadamente mantida.
