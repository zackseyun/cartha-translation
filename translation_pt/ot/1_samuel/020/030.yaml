base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: pt
  text: 'Então a ira de Saul se acendeu contra Jônatas, e ele lhe disse: “Filho de mulher perversa e rebelde![a] Por acaso não sei que você está escolhendo o filho de Jessé[b], para a sua vergonha e para a vergonha da nudez de sua mãe?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Filho da perversidade e da rebeldia!” O insulto hebraico é difícil e fortemente idiomático.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está tomando o partido do filho de Jessé”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “vergonha da nudez de sua mãe” é uma forma hebraica severa de falar de desonra familiar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל
  choice: a ira de Saul se acendeu
  rationale: Preserva a imagem vívida do idioma hebraico para a ira intensa, sem reproduzir literalmente אַף como “nariz”.
- source_word: בִּיהוֹנָתָן
  choice: contra Jônatas
  rationale: A preposição indica o alvo da ira; “contra” expressa naturalmente essa direção hostil.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: Seu filho de mulher perversa e rebelde!
  rationale: Trata a expressão difícil como um insulto dirigido a Jônatas por meio de sua mãe. “Mulher” é explicitado para tornar a construção inteligível, sem atenuar sua violência.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Você acha que eu não sei
  rationale: Mantém o caráter retórico e confrontador da pergunta hebraica em português corrente.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: está escolhendo o filho de Jessé
  rationale: Conserva o sentido lexical de בחר, “escolher”, embora no contexto a ação implique tomar o partido de Davi.
- source_word: לְבָשְׁתְּךָ
  choice: para vergonha sua
  rationale: Expressa de modo natural a vergonha ou desonra resultante indicada pela construção hebraica.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: e para vergonha da nudez de sua mãe
  rationale: Mantém “nudez”, o sentido concreto de עֶרְוָה, e preserva a força ofensiva e a conotação de desonra familiar da expressão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação preserva a aspereza do insulto de Saul, a pergunta retórica e a imagem hebraica da nudez materna, acrescentando notas onde o idioma original admite outra representação natural.
