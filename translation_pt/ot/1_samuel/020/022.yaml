source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: pt
  text: 'Mas, se eu disser ao jovem: “Veja, as flechas estão além de você”, então vá, pois Yahweh mandou você embora.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz, em contraste com o sinal descrito no versículo anterior, a segunda possibilidade condicional.
- source_word: כֹּה אֹמַר לָעֶלֶם
  choice: eu disser ao jovem
  rationale: Expressa de modo natural em português a fórmula hebraica de introdução da fala; עֶלֶם designa um jovem, sem explicitar por si só a função de servo.
- source_word: הִנֵּה
  choice: Olhe
  rationale: Partícula que chama a atenção do ouvinte; esta forma é atual e preserva sua força dêitica.
- source_word: הַחִצִּים מִמְּךָ וָהָלְאָה
  choice: as flechas estão além de você
  rationale: Indica que as flechas se encontram mais adiante, depois do jovem. A formulação concisa preserva o sentido espacial do sinal.
- source_word: לֵךְ
  choice: vá
  rationale: Imperativo direto de הלך, adequado ao contexto em que Davi deve partir.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem anterior.
- source_word: שִׁלַּחֲךָ
  choice: está mandando você embora
  rationale: O perfeito hebraico pode apresentar a decisão divina como estabelecida; no contexto, a expressão significa mandar partir. O presente progressivo soa natural e comunica que a partida de Davi é a providência indicada pelo sinal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Agência divina na partida de Davi
  choice: Yahweh está mandando você embora
  alternative: Yahweh mandou você embora; Yahweh o enviou
  rationale: Preserva a afirmação de que a necessidade de Davi partir está sob a agência divina, sem explicar de que maneira essa providência se relaciona com a ação de Saul ou de Jônatas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A fala direta mantém a concisão do sinal combinado entre Jônatas e Davi; não foi necessária nota, pois “além de você” preserva de modo inteligível a expressão espacial hebraica.
