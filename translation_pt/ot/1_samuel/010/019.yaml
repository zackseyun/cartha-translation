  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: pt
  text: 'Mas hoje vocês rejeitaram o seu Deus, aquele que os salva de todas as suas calamidades[a] e aflições, e lhe disseram: “Não, mas ponha um rei sobre nós.” Agora, portanto, apresentem-se diante de Yahweh por suas tribos e seus milhares[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “de todos os seus males”, “de todas as suas desgraças” ou “de todas as suas dificuldades”. O termo hebraico se refere aqui aos males ou danos sofridos.
    reason: lexical_alternative
  - marker: b
    text: Ou “por seus clãs” ou “por suas unidades de mil”. A palavra hebraica para “milhares” também pode designar subdivisões sociais ou militares, não apenas uma quantidade literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: rejeitaram
  rationale: O verbo מָאַס indica rejeitar ou repudiar. “Rejeitaram” é claro, atual e mantém a força da acusação de Samuel.
- source_word: אֱלֹהֵיכֶם
  choice: o seu Deus
  rationale: Embora אֱלֹהִים tenha forma plural, o contexto e a referência singular indicam inequivocamente o Deus de Israel.
- source_word: מוֹשִׁיעַ
  choice: salva
  rationale: O particípio apresenta a ação característica e contínua de Deus. O presente “salva” expressa bem essa atuação habitual.
- source_word: מִכָּל רָעוֹתֵיכֶם
  choice: de todas as suas calamidades
  rationale: רָעוֹת pode designar males sofridos, desgraças ou calamidades. Neste contexto de livramento, “calamidades” evita sugerir principalmente maldade moral.
- source_word: וְצָרֹתֵיכֶם
  choice: e aflições
  rationale: צָרוֹת designa angústias, apertos ou adversidades. “Aflições” distingue o segundo termo sem romper o paralelismo.
- source_word: כִּי
  choice: Não!
  rationale: Neste resumo da insistência do povo, כִּי tem força enfática ou adversativa. “Não!” torna explícita em português a recusa contrastante indicada pelo contexto, sem alterar o conteúdo do pedido.
- source_word: תָּשִׂים
  choice: Ponha
  rationale: שׂוּם significa pôr, colocar ou estabelecer. “Ponha um rei sobre nós” é natural e permanece próximo da imagem hebraica.
- source_word: הִתְיַצְּבוּ
  choice: apresentem-se
  rationale: A forma reflexiva descreve o ato formal de tomar posição diante de Yahweh para o processo de escolha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְשִׁבְטֵיכֶם
  choice: segundo as suas tribos
  rationale: A preposição לְ indica aqui organização ou agrupamento; “segundo” comunica a disposição por tribos.
- source_word: וּלְאַלְפֵיכֶם
  choice: e os seus milhares
  rationale: אֲלָפִים significa literalmente “milhares”, mas também pode nomear subdivisões sociais, clânicas ou militares. O texto principal mantém a forma transparente, e a nota registra a ambiguidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Força da resposta citada do povo
  choice: “Não! Ponha um rei sobre nós”
  alternative: “Ao contrário, ponha um rei sobre nós”; “Certamente, ponha um rei sobre nós”
  rationale: כִּי pode assumir força enfática ou adversativa. O contexto apresenta a exigência de um rei como recusa do governo salvador de Deus; “Não!” expressa essa oposição, sem resolver a questão por uma formulação doutrinária adicional.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com formas correntes no Brasil. Emprega “vocês” para o plural e mantém concisão solene. As notas foram posicionadas junto aos termos a que de fato se referem: “calamidades” e “milhares”.'
