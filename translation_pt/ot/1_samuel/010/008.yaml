  text: וְ/יָרַדְתָּ֣ לְ/פָנַ/י֮ הַ/גִּלְגָּל֒ וְ/הִנֵּ֤ה אָֽנֹכִי֙ יֹרֵ֣ד אֵלֶ֔י/ךָ לְ/הַעֲל֣וֹת עֹל֔וֹת לִ/זְבֹּ֖חַ זִבְחֵ֣י שְׁלָמִ֑ים שִׁבְעַ֨ת יָמִ֤ים תּוֹחֵל֙ עַד בּוֹאִ֣/י אֵלֶ֔י/ךָ וְ/הוֹדַעְתִּ֣י לְ/ךָ֔ אֵ֖ת אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: pt
  text: Desça antes de mim a Gilgal. Eis que descerei até você para oferecer holocaustos e sacrificar ofertas de comunhão[a]. Espere sete dias, até que eu chegue até você e lhe diga o que deverá fazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de paz” ou “ofertas de bem-estar”. O termo hebraico se refere a sacrifícios associados à paz, à integridade e à comunhão compartilhada.
    reason: Alternativas lexicais legítimas para שְׁלָמִים e explicação breve de seu campo semântico.
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: Desça
  rationale: O perfeito com waw integra uma sequência de instruções. O imperativo em português comunica de modo natural a força diretiva, preservando o sentido espacial de ירד.
- source_word: לְפָנַי
  choice: à minha frente
  rationale: Expressa que Saul deve seguir adiante de Samuel, preservando a nuance espacial e temporal da expressão hebraica literalmente ligada à ideia de estar diante da face de alguém.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Nome de lugar transliterado segundo o uso consagrado em português.
- source_word: וְהִנֵּה
  choice: também
  rationale: No contexto, הִנֵּה introduz com vivacidade a ação correspondente de Samuel. Em português moderno, a construção com “também” mantém a ligação enfática sem recorrer ao mais arcaizante “eis que”.
- source_word: יֹרֵד אֵלֶיךָ
  choice: descerei até você
  rationale: O particípio indica ação pretendida ou iminente. O futuro é natural em português, e “até você” reflete o movimento na direção de Saul.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: para oferecer holocaustos
  rationale: A expressão idiomática designa a apresentação de sacrifícios inteiramente queimados. “Holocaustos” é o termo sacrificial tradicional e reconhecível em português.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: sacrificar ofertas de comunhão
  rationale: “Sacrificar” preserva o verbo e a construção cognata. “Ofertas de comunhão” comunica a dimensão de participação e relacionamento associada a שְׁלָמִים; outras nuances legítimas são registradas em nota.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: Espere sete dias
  rationale: No contexto de uma instrução prática, יחל significa esperar, não simplesmente ter esperança. O imperativo é claro e natural.
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: até eu chegar até você
  rationale: O infinitivo construto com sufixo é vertido naturalmente como oração finita em português.
- source_word: וְהוֹדַעְתִּי לְךָ אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: e lhe dizer o que deverá fazer
  rationale: O hiphil de ידע tem sentido causativo, “fazer saber”. “Lhe dizer” expressa esse resultado de maneira natural, enquanto “deverá” conserva a força orientadora da instrução futura.
theological_decisions:
- issue: Sentido do termo sacrificial שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: O termo designa sacrifícios ligados à paz, integridade, bem-estar e refeição compartilhada. “Ofertas de comunhão” é claro ao leitor moderno e destaca seu caráter participativo sem excluir as demais nuances, que são preservadas em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “você” para manter clareza no discurso direto, imperativos naturais para as instruções e terminologia sacrificial reconhecível. Evita arcaísmos desnecessários e preserva a sequência de movimentos e ações do hebraico.
