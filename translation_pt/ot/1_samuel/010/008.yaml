  naturalness: A redação é em geral clara e moderna. “Desça antes de mim a Gilgal” é mais direta e idiomática do que “Desça à minha frente até Gilgal”, e “Eis que” é compreensível em registro bíblico moderno sem ser excessivamente arcaico.
  terminology: “Holocaustos” é terminologia bíblica portuguesa estabelecida para עֹלוֹת. “Ofertas de comunhão” é uma opção legítima para זִבְחֵי שְׁלָמִים, com alternativas semânticas úteis na nota.
