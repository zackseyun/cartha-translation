translation:
  language: pt
  text: Eles perguntarão como você está[a] e lhe darão dois pães[b]; e você os receberá da mão deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles o saudarão”. A expressão hebraica significa literalmente perguntar a respeito da paz ou do bem-estar de alguém.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente em hebraico, “dois pão”; em português idiomático, “dois pães”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “você os tomará da mão deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: perguntarão como você está
  rationale: A expressão idiomática hebraica descreve uma pergunta pelo bem-estar da pessoa e também pode funcionar como saudação. A formulação escolhida é natural em português e preserva explicitamente a ideia de indagar por seu estado.
- source_word: שָׁלוֹם
  choice: como você está
  rationale: Neste contexto, שָׁלוֹם se refere ao bem-estar pessoal, não apenas à ausência de conflito. A expressão portuguesa comunica esse sentido dentro do idioma completo.
- source_word: וְנָתְנוּ לְךָ
  choice: e lhe darão
  rationale: A sequência verbal prossegue a predição de Samuel; o futuro do indicativo expressa isso de maneira clara e natural.
- source_word: שְׁתֵּי לֶחֶם
  choice: dois pães
  rationale: Embora a expressão seja literalmente 'dois pão', o substantivo é contável neste contexto. 'Dois pães' é a forma idiomática e amplamente compreensível em português.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: e você os receberá das mãos deles
  rationale: לקח significa basicamente 'tomar/pegar', mas, no contexto de algo oferecido, 'receber' expressa naturalmente a ação sem perder o sentido. O futuro mantém a sequência preditiva.
- source_word: מִיָּדָם
  choice: das mãos deles
  rationale: O hebraico usa 'mão' no singular com sufixo plural como expressão coletiva. O plural 'das mãos deles' conserva a imagem e soa natural em português.
