base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: pt
  text: 'Então Samuel disse a todo o povo: “Vocês estão vendo aquele que Yahweh escolheu?[a] Não há ninguém como ele entre todo o povo.” Todo o povo gritou e disse: “Viva o rei!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês viram aquele que Yahweh escolheu?”'
    reason: A forma hebraica também pode ser traduzida mais diretamente como uma pergunta no pretérito perfeito.
  - marker: b
    text: 'Hebraico: “Que o rei viva!”'
    reason: Registra a forma mais literal do desejo expresso pelo jussivo hebraico.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português.
- source_word: הַרְּאִיתֶם
  choice: Vocês estão vendo
  rationale: Embora a forma hebraica seja perfeita na segunda pessoa do plural, no discurso direto ela chama a atenção dos presentes para Saul. A forma progressiva é natural em português e conserva o sentido contextual, enquanto a leitura morfológica mais direta é registrada em nota.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: aquele que Yahweh escolheu
  rationale: A oração relativa identifica Saul de maneira clara e direta. O pretérito perfeito traduz a escolha já realizada.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: Não há ninguém como ele
  rationale: A frase expressa que Saul não tem igual entre o povo. A relação explicativa de כִּי fica clara pela sequência das frases, sem exigir um conectivo pesado.
- source_word: בְּכָל הָעָם
  choice: entre todo o povo
  rationale: A preposição indica comparação dentro do conjunto do povo reunido; “entre” é a formulação portuguesa mais natural.
- source_word: וַיָּרִעוּ
  choice: deu um forte grito
  rationale: O verbo descreve a emissão coletiva de um clamor alto. Esta formulação preserva a força vocal sem pressupor um tom emocional mais específico.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Viva o rei!
  rationale: É a aclamação idiomática portuguesa correspondente ao jussivo hebraico, que expressa o desejo de que o rei viva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícita a segunda pessoa do plural; “Viva o rei!” conserva a aclamação régia idiomática.
