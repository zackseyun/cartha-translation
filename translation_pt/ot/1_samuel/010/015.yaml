  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: pt
  text: 'Então o tio de Saul disse: “Por favor, conte-me o que Samuel disse a vocês[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico está no plural, provavelmente referindo-se a Saul e ao servo dele juntos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: דּוֹד שָׁאוּל
  choice: o tio de Saul
  rationale: דּוֹד significa “tio” neste contexto de parentesco, e a construção de posse é vertida naturalmente como “de Saul”.
- source_word: הַגִּידָה נָּא לִי
  choice: Por favor, conte-me
  rationale: O imperativo hifil de נגד pede que se conte ou relate algo, enquanto נָא acrescenta cortesia ou súplica, expressa por “Por favor”.
- source_word: מָה
  choice: o que
  rationale: O interrogativo introduz o conteúdo que o tio deseja saber e é naturalmente traduzido por “o que”.
- source_word: אָמַר
  choice: disse
  rationale: Preserva o sentido simples e comum do verbo אמר, sem acrescentar interpretação.
- source_word: לָכֶם
  choice: a vocês
  rationale: A forma hebraica está no masculino plural. “A vocês” torna explícita em português essa pluralidade, provavelmente abrangendo Saul e seu servo.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “conte-me” mantém a cortesia e a naturalidade; “a vocês” preserva no texto a forma plural do hebraico.
