  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: pt
  text: Então o Espírito de Yahweh virá poderosamente sobre você[a]; você profetizará com eles e será transformado em outro homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se apoderará de você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: virá poderosamente sobre você
  rationale: Com רוּחַ יְהוָה como sujeito, צלח descreve uma vinda impetuosa e eficaz sobre alguém. A expressão transmite a força da ação sem sugerir mero sucesso ou prosperidade.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: רוּחַ designa aqui o Espírito de Deus, e o nome próprio יהוה é transliterado como “Yahweh”, em continuidade com a camada inglesa fornecida.
- source_word: וְהִתְנַבִּיתָ עִמָּם
  choice: você profetizará com eles
  rationale: O hitpael de נבא indica participação na atividade profética do grupo; “profetizará com eles” é claro, natural e próximo do hebraico.
- source_word: וְנֶהְפַּכְתָּ לְאִישׁ אַחֵר
  choice: e será transformado em outro homem
  rationale: O nifal de הפך expressa mudança de estado. “Será transformado” conserva a voz passiva e a força da mudança, enquanto “outro homem” mantém o gênero e a formulação aberta do original.
theological_decisions:
- issue: Natureza da mudança de Saul
  choice: Afirmar que Saul será transformado em outro homem, sem definir a extensão nem a permanência dessa mudança.
  alternative: Interpretar a frase como simples experiência extática externa ou como plena renovação espiritual interior.
  rationale: O hebraico anuncia uma mudança real ligada à atuação do Espírito e à atividade profética, mas não especifica regeneração, transformação moral completa nem permanência. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal e o futuro simples mantêm fluidez narrativa; “Yahweh” preserva o nome divino usado na camada de consulta. O ponto e vírgula organiza as consequências sem alterar sua sequência.
