  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: pt
  text: 'Então consultaram Yahweh novamente: “O homem já chegou aqui?” E Yahweh disse: “Eis que ele está escondido entre a bagagem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “entre os objetos” ou “entre os utensílios”; o termo pode designar artigos, equipamentos ou suprimentos. Aqui, provavelmente se refere à bagagem das pessoas reunidas.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: consultaram novamente a Yahweh
  rationale: O verbo שׁאל com בַּיהוָה descreve uma consulta feita a Deus em busca de resposta, não uma pergunta casual. “Consultaram novamente” conserva tanto o caráter formal da ação quanto a repetição indicada por עוֹד.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: O homem já chegou aqui?
  rationale: A forma perfeita de בוא pergunta se a chegada já ocorreu; em português, “já chegou” expressa naturalmente esse valor. אִישׁ refere-se, no contexto, ao homem específico que procuravam.
- source_word: וַיֹּאמֶר יְהוָה
  choice: E Yahweh disse
  rationale: Embora a fala seja uma resposta, o hebraico emprega o verbo comum “dizer”; a tradução preserva a forma narrativa simples.
- source_word: הִנֵּה
  choice: Eis que
  rationale: A expressão chama enfaticamente a atenção para a revelação que segue. “Eis que” mantém essa força em registro bíblico digno e inteligível.
- source_word: נֶחְבָּא
  choice: está escondido
  rationale: A forma nifal apresenta Saul em estado de ocultação. “Está escondido” conserva esse estado sem especificar além do necessário se ele próprio se escondeu ou foi ocultado.
- source_word: אֶל הַכֵּלִים
  choice: entre a bagagem
  rationale: כֵּלִים é um termo amplo para objetos, utensílios ou equipamentos. No cenário da assembleia, “bagagem” comunica de modo claro os pertences e suprimentos acumulados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe narrativa permanece próxima do hebraico, enquanto “já chegou aqui” e “entre a bagagem” oferecem equivalência natural em português.
