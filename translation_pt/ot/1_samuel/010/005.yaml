  naturalness: O texto é claro e de registro moderno. A formulação «À frente deles haverá harpa...» é um pouco rígida e soa como uma previsão independente; «com ... à frente deles» expressa de modo mais natural a construção hebraica.
  terminology: «Lugar alto», «guarnição», «tamborim», «lira» e «profetizando» são escolhas adequadas. Na nota c, «tubo» não é uma alternativa portuguesa apropriada para o instrumento; a incerteza de חָלִיל pode ser indicada por «instrumento de sopro» (ou «flauta»/«pífano», conforme a tradição), sem especificação indevida.
