source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: pt
  text: Depois disso, você chegará a Gibeá de Deus[a], onde fica a guarnição dos filisteus[b]. Quando você entrar ali na cidade, encontrará um grupo de profetas descendo do lugar alto, com harpa, tamborim, flauta e lira à frente deles[c]; eles estarão profetizando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a colina de Deus”; o hebraico pode ser entendido como nome de lugar ou como descrição do local.
    reason: alternative_reading
  - marker: b
    text: Ou “o posto avançado dos filisteus” ou “os oficiais dos filisteus”; o termo hebraico pode referir-se tanto a uma instalação militar quanto a autoridades, embora o contexto favoreça “guarnição”.
    reason: alternative_reading
  - marker: c
    text: A identificação exata dos instrumentos antigos é incerta. “Harpa” também pode ser traduzido por “alaúde”, e “flauta”, por “instrumento de sopro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: Gibeá de Deus
  rationale: A expressão pode funcionar como nome de lugar ou como descrição, “colina de Deus”. A forma portuguesa conserva o provável valor toponímico e permite registrar a ambiguidade em nota.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: a guarnição dos filisteus
  rationale: נְצִיב pode designar um posto militar ou autoridades instaladas. O contexto geográfico e narrativo favorece o sentido militar, sem eliminar a alternativa em nota.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: Quando você entrar ali na cidade
  rationale: Reproduz de modo natural a oração temporal hebraica e mantém tanto a referência a “ali” quanto a entrada na cidade.
- source_word: וּפָגַעְתָּ
  choice: encontrará
  rationale: Neste contexto, פגע indica deparar-se ou encontrar-se com alguém; “encontrará” é claro e natural em português.
- source_word: חֶבֶל נְבִיאִים
  choice: um grupo de profetas
  rationale: חֶבֶל designa aqui uma companhia ou grupo. “Grupo” é atual e evita associações musicais involuntárias de “banda”.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: descendo do lugar alto
  rationale: בָּמָה é um local elevado de culto. “Lugar alto” preserva o termo cultual tradicional sem reduzi-lo simplesmente a “santuário”.
- source_word: נֵבֶל
  choice: harpa
  rationale: É uma aproximação moderna e compreensível para um antigo instrumento de cordas cuja identificação exata é incerta.
- source_word: תֹף
  choice: tamborim
  rationale: Designa normalmente um instrumento portátil de percussão, provavelmente um tambor de mão; “tamborim” é uma equivalência acessível.
- source_word: חָלִיל
  choice: flauta
  rationale: Trata-se de um instrumento de sopro; “flauta” é uma aproximação clara, embora “flautim” ou “tubo” também sejam possíveis.
- source_word: כִּנּוֹר
  choice: lira
  rationale: O termo costuma designar um instrumento de cordas do tipo lira. A escolha também o distingue de נֵבֶל, traduzido como “harpa”.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: e eles estarão profetizando
  rationale: Mantém o aspecto contínuo da atividade profética e a ligação lexical com “profeta”, sem definir indevidamente sua forma concreta.
theological_decisions:
- issue: Natureza da atividade profética em מִתְנַבְּאִים
  choice: “estarão profetizando”, sem especificar comportamento extático
  alternative: “estarão em êxtase profético” ou “estarão entoando louvores inspirados”
  rationale: O verbo indica atividade profética, mas o texto não determina se ela consistia em fala extática, proclamação, canto inspirado ou outra manifestação. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular dirigido a Saul, evita arcaísmos e conserva termos bíblicos transparentes como “lugar alto” e “profetizando”.
