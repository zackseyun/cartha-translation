  - severity: medium
    issue: A nota c apresenta «tubo» como alternativa para חָלִיל.
    rationale: «Pipe» em inglês, no contexto de instrumento musical, não corresponde naturalmente a «tubo» em português. «Instrumento de sopro» preserva a incerteza lexical sem introduzir uma falsa equivalência.
