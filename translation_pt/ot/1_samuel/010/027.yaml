base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: pt
  text: 'Mas homens perversos disseram: “Como este homem poderá nos salvar?” Eles o desprezaram e não lhe trouxeram nenhum presente. Mas Saul ficou como alguém que se mantinha calado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se fosse surdo”. A expressão hebraica pode descrever silêncio deliberado diante de uma provocação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: alguns homens perversos
  rationale: A expressão idiomática, literalmente “filhos da indignidade”, caracteriza pessoas moralmente vis ou sem caráter. “Homens perversos” comunica essa força moral em português natural, sem reproduzir literalmente um hebraísmo obscuro.
- source_word: מַה יֹּשִׁעֵנוּ זֶה
  choice: Como este homem poderá nos salvar?
  rationale: A pergunta expressa dúvida desdenhosa quanto à capacidade de Saul. “Este homem” representa זֶה de modo natural, e “poderá nos salvar” preserva a ideia de livramento no contexto da função real.
- source_word: וַיִּבְזֻהוּ
  choice: Eles o desprezaram
  rationale: O verbo בזה indica desprezar ou considerar insignificante. A formulação é direta e corresponde ao tom conciso da narrativa.
- source_word: מִנְחָה
  choice: presente algum
  rationale: Neste contexto régio, מִנְחָה designa um presente oferecido ao governante, possivelmente como reconhecimento ou homenagem. “Presente” evita a conotação exclusivamente cultual de “oferta” e não torna explícita a ideia de tributo além do que o texto exige.
- source_word: וַיְהִי כְּמַחֲרִישׁ
  choice: ficou como quem se mantinha calado
  rationale: A tradução conserva tanto o valor comparativo de כְּ quanto o sentido participial de חרשׁ, apresentando Saul como alguém que não reagiu verbalmente, sem definir além do texto sua motivação.
theological_decisions:
- issue: Caracterização da reação de Saul ao desprezo
  choice: Saul ficou como quem se mantinha calado
  alternative: Saul agiu como se não tivesse ouvido
  rationale: A expressão כְּמַחֲרִישׁ pode retratar silêncio deliberado ou a atitude de quem se faz de surdo. O texto principal mantém o sentido mais direto de permanecer calado, enquanto a nota preserva a alternativa legítima sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e o contraste final foram preservados; o nome “Saul” foi explicitado na última oração para evitar ambiguidade pronominal em português.
