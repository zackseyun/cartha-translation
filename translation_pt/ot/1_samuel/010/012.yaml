  text: וַ/יַּ֨עַן אִ֥ישׁ מִ/שָּׁ֛ם וַ/יֹּ֖אמֶר וּ/מִ֣י אֲבִי/הֶ֑ם עַל כֵּן֙ הָיְתָ֣ה לְ/מָשָׁ֔ל הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: pt
  text: 'Então um homem dali respondeu: “E quem é o pai deles?”[a] Por isso, tornou-se um provérbio: “Também Saul está entre os profetas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E quem é o pai dele?” Algumas traduções entendem que a pergunta se refere especificamente a Saul, mas o Texto Massorético traz “deles”.'
    reason: Leitura alternativa quanto ao número e ao referente do sufixo pronominal.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה no wayyiqtol introduz normalmente uma resposta na narrativa. Em português, “respondeu” expressa isso com naturalidade, sem a redundância de “respondeu e disse”.
- source_word: אִישׁ מִשָּׁם
  choice: um homem dali
  rationale: אִישׁ é singular, “homem”, e מִשָּׁם significa “de lá/dali”. A formulação identifica de modo direto um morador ou alguém daquele lugar.
- source_word: וּמִי אֲבִיהֶם
  choice: E quem é o pai deles?
  rationale: O texto massorético traz o sufixo masculino plural, “deles”. A tradução conserva a forma plural e sua ambiguidade contextual, em vez de ajustá-la silenciosamente para Saul no singular.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: A expressão introduz a consequência ou a origem do dito proverbial. “Por isso” é clara e natural em português contemporâneo.
- source_word: הָיְתָה לְמָשָׁל
  choice: tornou-se um provérbio
  rationale: מָשָׁל designa aqui uma expressão proverbial. “Tornou-se um provérbio” mantém a estrutura e o sentido do hebraico em linguagem corrente.
- source_word: הֲגַם
  choice: Também ...?
  rationale: 'A combinação da partícula interrogativa com גַּם exprime inclusão marcada por surpresa: “Também Saul...?”'
- source_word: בַּנְּבִאִים
  choice: entre os profetas
  rationale: A preposição בְּ com o artigo indica aqui inclusão no grupo. “Entre os profetas” transmite essa relação com precisão.
theological_decisions:
- issue: Referente de “o pai deles” na pergunta retórica
  choice: Manter o plural massorético, “o pai deles”, entendendo a referência imediata como o grupo dos profetas, sem explicitar essa interpretação no versículo.
  alternative: “o pai dele”, com a pergunta referida especificamente a Saul.
  rationale: A morfologia do Texto Massorético sustenta o plural. A pergunta pode indicar que a atividade profética não depende da linhagem familiar, mas o texto não desenvolve explicitamente essa conclusão; por isso, a tradução preserva a formulação e a tensão do original. A leitura singular é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se o hebraísmo redundante “respondeu e disse”; conservaram-se a pergunta retórica, o plural massorético e a forma proverbial.
