id: 1SA.10.20
reference: 1 Samuel 10:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: pt
  text: Então Samuel fez todas as tribos de Israel se aproximarem, e a tribo de Benjamim foi escolhida por sorteio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “foi tomada”. Aqui, a expressão se refere à seleção por sorteio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fez ... se aproximarem
  rationale: O hifil de קרב expressa fazer chegar ou apresentar. A formulação preserva a ideia de aproximação, de modo natural em português, no contexto da apresentação das tribos para o sorteio.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: todas as tribos de Israel
  rationale: Tradução direta e idiomática da cadeia construta com כָּל, mantendo o alcance coletivo.
- source_word: וַיִּלָּכֵד
  choice: foi escolhida por sorteio
  rationale: O nifal de לכד significa literalmente «foi tomada/capturada», mas neste contexto descreve o resultado da seleção por sortes. A tradução explicita o mecanismo contextual e evita que «foi tomada» seja entendido como conquista militar, enquanto a nota preserva o sentido literal.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: a tribo de Benjamim
  rationale: Forma definida e natural em português para identificar a tribo selecionada dentre as tribos apresentadas.
theological_decisions:
- issue: Agência implícita na seleção por sortes
  choice: Uso da passiva «foi escolhida por sorteio», sem nomear quem escolheu
  alternative: «o Senhor escolheu a tribo de Benjamim»
  rationale: O hebraico emprega uma forma passiva e não explicita o agente neste versículo. A tradução mantém essa abertura e não acrescenta uma identificação teológica ausente da frase.
translation_notes:
  register: Português moderno, digno e claro, com ampla legibilidade brasileira. «Fez ... se aproximarem» conserva a imagem hebraica sem soar excessivamente literal; «escolhida por sorteio» comunica com clareza o sentido contextual, e a nota registra a formulação literal.
