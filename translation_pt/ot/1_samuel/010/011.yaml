    issue: Tempo verbal de «Então o povo dizia»
    rationale: O hebraico וַיֹּאמֶר introduz a fala como evento narrativo pontual. «Então o povo disse» é a correspondência portuguesa natural; «dizia» sugere ação habitual ou durativa não expressa pelo texto.
