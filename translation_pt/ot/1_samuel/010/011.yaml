base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: pt
  text: 'E aconteceu que todos os que já o conheciam[a] viram, e eis que ele estava profetizando com os profetas. Então o povo disse, cada um ao seu companheiro: “O que aconteceu com o filho de Quis? Será que Saul também[b] está entre os profetas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os que o conheciam desde ontem e anteontem”, expressão hebraica que significa que já o conheciam anteriormente.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Será que até Saul está entre os profetas?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: os que já o conheciam
  rationale: A expressão temporal hebraica, literalmente ligada a “ontem e anteontem”, funciona idiomaticamente como referência ao passado. “Já o conheciam” comunica com naturalidade que conheciam Saul antes dessa mudança observada.
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a fórmula de continuação narrativa do hebraico em linguagem portuguesa atual e digna.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: viram, e eis que
  rationale: Preserva tanto o ato de ver quanto a vivacidade e a surpresa introduzidas por וְהִנֵּה, sem reduzir a construção a uma oração neutra.
- source_word: עִם נְבִאִים
  choice: com os profetas
  rationale: Traduz diretamente a preposição עִם por “com” e mantém a distinção em relação a בַּנְּבִיאִים, traduzida depois por “entre os profetas”.
- source_word: נִבָּא
  choice: estava profetizando
  rationale: Expressa a atividade profética em andamento que as pessoas observaram, sem afirmar que Saul recebeu um ofício profético permanente.
- source_word: הָעָם
  choice: o povo
  rationale: É a correspondência direta e natural para o coletivo hebraico neste contexto.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: cada um ao seu companheiro
  rationale: Conserva a construção distributiva do hebraico e evita uma formulação excessivamente literal ou pouco natural em português.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: O que aconteceu com o filho de Quis?
  rationale: Transmite a surpresa diante da mudança de Saul sem acrescentar uma explicação para seu comportamento.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: Será que Saul também está entre os profetas?
  rationale: “Também” representa o valor inclusivo de גַּם, enquanto “será que” comunica naturalmente o caráter surpreso da pergunta; a alternativa “até Saul” é registrada em nota.
theological_decisions:
- issue: Atividade profética de Saul sem pressupor um ofício profético permanente
  choice: ele estava profetizando com os profetas
  alternative: ele estava em êxtase profético com os profetas; ele agia como profeta entre os profetas
  rationale: A tradução descreve a atividade relatada pelo texto sem defini-la como mero frenesi e sem concluir que Saul tenha sido instituído de modo permanente no ofício de profeta.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção “e eis que” foi mantida por sua força narrativa e por ainda ser compreensível em registro bíblico digno; “companheiro” preserva o valor relacional de רֵעֵהוּ sem soar excessivamente coloquial.
