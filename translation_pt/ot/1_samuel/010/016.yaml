  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דּוֹד֔/וֹ הַגֵּ֤ד הִגִּיד֙ לָ֔/נוּ כִּ֥י נִמְצְא֖וּ הָ/אֲתֹנ֑וֹת וְ/אֶת דְּבַ֤ר הַ/מְּלוּכָה֙ לֹֽא הִגִּ֣יד ל֔/וֹ אֲשֶׁ֖ר אָמַ֥ר שְׁמוּאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: pt
  text: 'Saul disse ao tio: “Ele nos disse claramente que as jumentas tinham sido encontradas.” Mas Saul não lhe contou sobre a questão da realeza[a] de que Samuel havia falado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a questão do reino”. Aqui, o hebraico provavelmente se refere à realeza de Saul, e não ao reino como território.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: ao tio
  rationale: No contexto narrativo, דּוֹד com sufixo de terceira pessoa masculina singular indica o parentesco de tio; a construção portuguesa já identifica naturalmente que se trata do tio de Saul.
- source_word: הַגֵּד הִגִּיד
  choice: nos garantiu
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Garantiu” comunica em português natural que Samuel lhes disse isso de modo enfático e seguro.
- source_word: נִמְצְאוּ
  choice: tinham sido encontradas
  rationale: Preserva o sentido passivo e expressa, no discurso relatado, que o encontro das jumentas antecedeu a resposta de Saul.
- source_word: הָאֲתֹנוֹת
  choice: as jumentas
  rationale: O substantivo hebraico designa especificamente jumentas, isto é, asininos fêmeas; em português, “jumentas” é natural e mantém essa informação lexical.
- source_word: דְּבַר הַמְּלוּכָה
  choice: a questão da realeza
  rationale: דָּבָר tem aqui o sentido de assunto ou questão, e מְלוּכָה se refere à condição ou dignidade régia anunciada a Saul, não principalmente a um território.
- source_word: לֹא הִגִּיד לוֹ
  choice: não lhe contou nada
  rationale: Expressa idiomaticamente a negação de que Saul tenha comunicado ao tio esse assunto; “nada sobre” explicita o escopo já presente no objeto hebraico sem alterar o sentido.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: de que Samuel havia falado
  rationale: A oração relativa é ligada naturalmente à questão da realeza e conserva a referência geral ao que Samuel dissera.
theological_decisions:
- issue: Sentido de מְלוּכָה no contexto da unção de Saul
  choice: realeza
  alternative: reino
  rationale: “Realeza” preserva o foco provável no status e governo régios conferidos a Saul. “Reino” poderia ser entendido sobretudo como território ou entidade política, embora seja uma tradução lexical possível.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e legibilidade brasileira. A repetição explícita de “Saul” na segunda frase evita ambiguidade quanto ao sujeito. O marcador [a] aparece imediatamente após o termo explicado.
