lexical_decisions:
- source_word: וַיְכַל
  choice: Quando terminou
  rationale: O verbo indica a conclusão da atividade anterior; a oração temporal é natural em português e mantém a sequência dos acontecimentos.
- source_word: מֵהִתְנַבּוֹת
  choice: de profetizar
  rationale: O infinitivo de נבא com מִן completa a ideia de terminar ou cessar uma atividade. “Profetizar” é direto e preserva a amplitude do termo.
- source_word: וַיָּבֹא
  choice: foi
  rationale: בוא pode ser traduzido por “vir” ou “ir” conforme a perspectiva narrativa. Aqui, “foi” expressa naturalmente o deslocamento até o lugar alto sem acrescentar que ele necessariamente chegou ao destino.
- source_word: הַבָּמָה
  choice: o lugar alto
  rationale: במה designa um lugar elevado usado para culto. “Lugar alto” mantém o termo convencional e não decide implicitamente a legitimidade desse local de adoração.
theological_decisions:
- issue: Significado cultual de הַבָּמָה
  choice: o lugar alto
  alternative: o santuário no alto; o local de culto elevado
  rationale: O termo se refere a um local de culto, mas o versículo não avalia sua legitimidade. A tradução conserva a expressão transparente e deixa a explicação cultual para a nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação concisa acompanha a estrutura narrativa hebraica sem introduzir avaliação teológica do lugar de culto.
