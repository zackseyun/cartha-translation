  text: Quando terminou de profetizar, foi ao lugar alto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao santuário no alto”. Em hebraico, “ao lugar alto”, isto é, um local elevado usado para culto.
