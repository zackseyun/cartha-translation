  text: וְ/הָיָ֗ה כִּ֥י תבאינה הָ/אֹת֥וֹת הָ/אֵ֖לֶּה לָ֑/ךְ עֲשֵׂ֤ה לְ/ךָ֙ אֲשֶׁ֣ר תִּמְצָ֣א יָדֶ֔/ךָ כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: pt
  text: Quando esses sinais acontecerem com você, faça tudo o que a sua mão encontrar para fazer[a], pois Deus está com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faça tudo o que estiver ao seu alcance”. O idioma hebraico diz literalmente: “tudo o que a sua mão encontrar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: A construção introduz uma circunstância futura; “quando” transmite isso de modo natural, sem a rigidez de “e acontecerá que”.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: esses sinais se cumprirem para você
  rationale: Com “sinais” já anunciados, בוא descreve sua ocorrência ou concretização. “Se cumprirem” comunica esse sentido naturalmente, enquanto “para você” preserva a relação expressa por לָךְ sem sugerir que os sinais ocorram dentro de Saul.
- source_word: עֲשֵׂה לְךָ
  choice: faça
  rationale: O dativo לְךָ acrescenta envolvimento pessoal, mas vertê-lo como “faça para si mesmo” seria pouco natural e poderia sugerir benefício próprio. O imperativo simples preserva adequadamente a ordem no contexto.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: tudo o que a sua mão encontrar para fazer
  rationale: Mantém a imagem concreta do idioma hebraico e explicita naturalmente a ação subentendida. A nota oferece o sentido idiomático.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי introduz a razão para a ordem; “pois” é conciso e digno.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora tenha artigo em hebraico, a expressão refere-se de modo definido ao Deus de Israel e é idiomaticamente traduzida apenas como “Deus”.
- source_word: עִמָּךְ
  choice: está com você
  rationale: Tradução direta da presença divina que fundamenta e sustenta a ação de Saul.
theological_decisions:
- issue: Sentido da presença de Deus na ordem dada a Saul
  choice: Deus está com você
  alternative: Deus estará com você
  rationale: O hebraico emprega uma oração nominal que afirma a presença de Deus. O presente preserva essa afirmação sem transformá-la apenas em promessa futura.
- issue: Artigo em הָאֱלֹהִים
  choice: Deus
  alternative: o Deus
  rationale: O artigo hebraico marca a referência definida ao Deus de Israel, mas “o Deus” seria artificial em português neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva no texto a imagem idiomática hebraica, explicando seu sentido em nota; evita tanto formulações arcaicas como “te sobrevierem” quanto a leitura potencialmente equívoca de “faça para si mesmo”.
