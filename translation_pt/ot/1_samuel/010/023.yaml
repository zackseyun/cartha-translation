  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: pt
  text: Então correram e o trouxeram de lá[a]. Ele se pôs de pé no meio do povo e era mais alto do que todo o povo, dos ombros para cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram buscá-lo de lá”. O verbo hebraico geralmente significa “tomar” ou “pegar”, mas, neste contexto, pode indicar que foram buscar Saul onde ele havia se escondido (ver v. 22).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: correram
  rationale: Traduz diretamente רוץ e preserva a vivacidade da narrativa.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: o tiraram de lá
  rationale: לקח significa normalmente tomar ou levar; com מִשָּׁם, a expressão portuguesa comunica naturalmente que foram buscar Saul no lugar onde estava escondido, sem explicitar além do contexto.
- source_word: וַיִּתְיַצֵּב
  choice: se pôs de pé
  rationale: O hitpael de יצב indica colocar-se ou tomar posição; esta formulação é natural no contexto e não acrescenta uma nuance cerimonial.
- source_word: בְּתוֹךְ הָעָם
  choice: no meio do povo
  rationale: Reproduz de modo claro e corrente o sentido espacial de בְּתוֹךְ.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: era mais alto do que todos os outros
  rationale: Expressa idiomaticamente a comparação de altura; “os outros” evita a impressão de que Saul não fazia parte do povo.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: dos ombros para cima
  rationale: Equivalente português natural do idioma hebraico que descreve quanto Saul excedia os demais em altura.
