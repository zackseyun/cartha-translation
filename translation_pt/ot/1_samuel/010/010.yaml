  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: pt
  text: Quando chegaram ali, ao monte[a], eis que um grupo de profetas veio ao encontro dele. E o Espírito de Deus irrompeu sobre ele, e ele profetizou no meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Gibeá”. A forma hebraica pode ser entendida como nome de lugar ou como “ao monte”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: ao monte
  rationale: A forma, com terminação direcional, pode designar o monte ou o topônimo Gibeá. O artigo favorece aqui o substantivo comum, enquanto a nota preserva a leitura alternativa.
- source_word: חֶבֶל נְבִאִים
  choice: um grupo de profetas
  rationale: חֶבֶל designa aqui um agrupamento de profetas, não uma corda. “Grupo” é claro e natural em português atual.
- source_word: לִקְרָאתוֹ
  choice: veio ao encontro dele
  rationale: Expressa movimento em direção a Saul com a finalidade de encontrá-lo.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a função de chamar a atenção para o aparecimento súbito do grupo, em registro bíblico ainda compreensível.
- source_word: רוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  rationale: No contexto do sinal e da capacitação de Saul, a expressão refere-se mais naturalmente ao Espírito pertencente a Deus.
- source_word: וַתִּצְלַח עָלָיו
  choice: apoderou-se dele
  rationale: Com רוּחַ, o verbo descreve uma atuação súbita e poderosa sobre alguém. A expressão portuguesa comunica força sem acrescentar a ideia de possessão demoníaca.
- source_word: וַיִּתְנַבֵּא
  choice: ele profetizou
  rationale: O hitpael de נבא indica atividade profética, sem especificar se consistiu em fala, canto ou outro modo de expressão.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Indica que Saul participou da atividade profética dentro do grupo.
theological_decisions:
- issue: Interpretação de רוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  alternative: um espírito vindo de Deus
  rationale: O contexto apresenta a ação como sinal e capacitação divina. A tradução escolhida preserva essa força narrativa, sem impor ao texto toda a formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” mantém a ênfase narrativa do hebraico; “apoderou-se dele” transmite a força de צלח sem recorrer a uma formulação excessivamente literal.
