  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: pt
  text: Então ele apresentou a tribo de Benjamim por seus clãs[a], e o clã dos matritas foi indicado[b]. Em seguida, Saul, filho de Quis, foi indicado. Procuraram-no, mas não foi encontrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “segundo as suas famílias”. O termo hebraico pode designar famílias extensas ou clãs dentro de uma tribo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “foi tomado”. Aqui a expressão se refere a ser indicado ou escolhido por sorteio, não a ser capturado.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fez ... se aproximar
  rationale: Reproduz o sentido causativo do hifil de קרב e preserva a linguagem do procedimento de apresentação diante do Senhor.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: a tribo de Benjamim
  rationale: É a designação natural da unidade tribal no contexto.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui grupos familiares extensos dentro da tribo; 'clãs' deixa clara a sequência tribo–clã–indivíduo.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: foi indicado
  rationale: Neste contexto de escolha por sorteio, o nifal de לכד não descreve captura militar. 'Foi indicado' comunica naturalmente o resultado do procedimento sem especificar além do contexto como ele ocorreu.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: o clã dos matritas
  rationale: Mantém o gentílico coletivo hebraico הַמַּטְרִי e o vincula à unidade social expressa por מִשְׁפָּחָה.
- source_word: שָׁאוּל בֶּן קִישׁ
  choice: Saul, filho de Quis
  rationale: Segue a forma portuguesa corrente do patronímico hebraico e as grafias bíblicas tradicionais dos nomes.
- source_word: וַיְבַקְשֻׁהוּ
  choice: Procuraram-no
  rationale: בקשׁ significa procurar ou buscar; 'procuraram-no' é direto, atual e adequado à busca por uma pessoa ausente.
- source_word: וְלֹא נִמְצָא
  choice: mas não foi encontrado
  rationale: Preserva a construção passiva do nifal de מצא; 'mas' expressa naturalmente o contraste entre a procura e seu resultado.
