translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a progressão formal do procedimento — tribo, clã, indivíduo — e usa 'foi indicado' para evitar que o sentido contextual de escolha por sorteio seja confundido com captura militar.
