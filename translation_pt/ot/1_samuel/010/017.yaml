base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: pt
  text: Então Samuel convocou o povo diante de Yahweh, em Mispá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit. “para Yahweh”. Ou: “Samuel reuniu o povo diante de Yahweh, em Mispá”. O verbo hebraico pode indicar a convocação de uma assembleia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: convocou
  rationale: Com objeto direto (“o povo”), o verbo descreve aqui a convocação de uma assembleia, não um clamor. “Convocou” comunica isso de modo natural e preciso.
- source_word: אֶת הָעָם
  choice: o povo
  rationale: עם designa o povo de Israel reunido; “o povo” é a correspondência direta e adequada ao contexto.
- source_word: אֶל
  choice: para junto de
  rationale: A preposição indica movimento ou orientação em direção a Yahweh. “Para junto de” preserva essa relação sem sugerir que Yahweh seja um lugar geográfico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
- source_word: הַמִּצְפָּה
  choice: em Mispá
  rationale: מִצְפָּה é aqui um topônimo. “Em Mispá” expressa naturalmente, em português, o local da convocação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o tetragrama; a transliteração mantém o nome divino e evita substituí-lo por um título.
- issue: Relação da assembleia com Yahweh
  choice: para junto de Yahweh
  alternative: diante de Yahweh
  rationale: “Para junto de” conserva o valor direcional de אֶל e a formulação incomum do hebraico, sem definir mais precisamente se a expressão tem sentido cultual, representativo ou locativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Convocou” é corrente em contexto de assembleia; “Mispá” segue a forma tradicional do topônimo em português.
