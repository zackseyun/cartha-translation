  source_fidelity: 'A tradução transmite adequadamente a sequência verbal hebraica: Samuel comunica ao povo o mishpat relativo à realeza, registra-o por escrito, coloca o registro diante de Yahweh e dispensa o povo. “Os direitos e deveres da realeza” é uma explicitação interpretativa defensável de מִשְׁפַּט הַמְּלֻכָה, e a nota preserva alternativas importantes, incluindo “normas” e “costume”. A alternância entre “escreveu-os” (as disposições) e “o colocou” (o registro/livro) é inteligível em português e corresponde à progressão de referentes adotada no histórico inglês.'
