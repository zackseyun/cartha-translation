  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: pt
  text: Então Samuel expôs ao povo os direitos e deveres da realeza[a], escreveu-os no livro e o colocou diante de Yahweh. Depois, Samuel mandou todo o povo embora, cada homem para sua casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as normas da realeza” ou “o costume da realeza”. A expressão hebraica pode se referir às disposições legais ou à prática estabelecida do governo monárquico.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “cada homem para sua casa”, expressão distributiva que indica que eles voltaram, cada qual, para a própria casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: expôs
  rationale: Com אֶל e um conteúdo expresso, o verbo indica que Samuel comunicou e explicou ao povo as normas da realeza; “expôs” é natural e dignificado em português.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: os direitos e deveres da realeza
  rationale: מִשְׁפַּט pode designar norma, direito, obrigação ou prática estabelecida. A expressão aqui trata das disposições que regem a instituição monárquica; “realeza” preserva o sentido institucional de מְלֻכָה.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: escreveu-os no livro
  rationale: O pronome plural retoma em português “os direitos e deveres”. סֵפֶר pode ser livro, documento ou rolo; “livro” evita especificar indevidamente o suporte material.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: o colocou diante de Yahweh
  rationale: O objeto retomado é o registro escrito, singular em português. “Colocou diante de” preserva o ato de depositá-lo na presença de Yahweh sem acrescentar detalhes cultuais não explicitados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיְשַׁלַּח
  choice: mandou todo o povo embora
  rationale: Neste contexto, o verbo descreve a dispensa da assembleia, não o envio do povo em alguma missão.
- source_word: אִישׁ לְבֵיתוֹ
  choice: cada homem para sua casa
  rationale: Mantém a construção distributiva masculina singular do hebraico e sua referência aos integrantes do povo que voltaram às respectivas casas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Amplitude de מִשְׁפַּט הַמְּלֻכָה
  choice: os direitos e deveres da realeza
  alternative: a norma da realeza; o costume da realeza; o procedimento da realeza
  rationale: A formulação principal comunica a dimensão normativa da instituição sem decidir que se trata apenas de prerrogativas reais ou apenas de costumes. A nota preserva a amplitude lexical.
- issue: Expressão distributiva אִישׁ לְבֵיתוֹ
  choice: cada homem para sua casa
  alternative: cada um para sua casa
  rationale: A tradução conserva a forma masculina distributiva do hebraico, sem ampliar ou neutralizar silenciosamente sua expressão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Realeza” é usado no sentido institucional de poder ou governo monárquico. Os pronomes distinguem as disposições escritas (“escreveu-os”) do registro material que foi colocado diante de Yahweh (“o colocou”).
