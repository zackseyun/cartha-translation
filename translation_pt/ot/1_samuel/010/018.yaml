  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: pt
  text: 'E ele disse aos filhos de Israel[a]: “Assim diz Yahweh, o Deus de Israel: Eu fiz Israel subir do Egito e livrei vocês do poder dos egípcios e do poder de todos os reinos que oprimiam vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”.
    reason: Registra a alternativa idiomática para o etnônimo hebraico; o texto principal mantém a formulação formal «filhos de Israel».
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz de modo formal o construto masculino plural hebraico e mantém a expressão histórica; a alternativa idiomática é registrada em nota.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula solene e reconhecível de mensageiro ou profeta, natural em português bíblico atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta do sintagma construto.
- source_word: הֶעֱלֵיתִי
  choice: fiz Israel subir
  rationale: Preserva o valor causativo do hifil e a imagem espacial tradicional do êxodo, sem trocar o verbo por 'tirar' ou 'conduzir'.
- source_word: וָאַצִּיל
  choice: livrei
  rationale: Expressa resgate ou libertação de um poder hostil e se ajusta ao registro histórico-teológico do contexto.
- source_word: מִיַּד
  choice: do poder de
  rationale: Comunica naturalmente em português o sentido idiomático de estar sob a mão, isto é, sob o domínio ou controle de alguém.
- source_word: מִצְרַיִם
  choice: os egípcios
  rationale: Neste contexto, o nome designa metonimicamente o povo ou poder egípcio; 'poder dos egípcios' evita a formulação pouco natural 'poder do Egito' após a menção ao país.
- source_word: כָּל הַמַּמְלָכוֹת
  choice: todos os reinos
  rationale: Mantém o plural e a abrangência do hebraico sem acrescentar localização não expressa no texto.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: que oprimiam vocês
  rationale: O particípio indica opressão contínua ou característica; o imperfeito em português transmite esse aspecto durativo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal, sem substituí-lo por um título.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; filhos e filhas de Israel
  rationale: A opção principal conserva a forma masculina plural do hebraico como etnônimo convencional, sem inserir uma explicitação de gênero ausente do texto.
- issue: Imagem idiomática מִיַּד
  choice: do poder de
  alternative: da mão de
  rationale: A expressão hebraica descreve domínio ou controle. A tradução semântica comunica a ideia com clareza, embora a imagem literal seja possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a solenidade da fórmula divina e algumas imagens próprias do hebraico, mas traduz idiomaticamente מִיַּד como “do poder de”. O uso de “vocês” torna explícita a segunda pessoa do plural de modo natural no português brasileiro e inteligível internacionalmente.
