base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: pt
  text: Saul também foi para sua casa, em Gibeá, e com ele foram os homens valentes[a] cujos corações Deus havia tocado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os homens de valor” ou “os guerreiros”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cujos corações Deus havia tocado”; a expressão indica que Deus moveu a disposição interior deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: também
  rationale: Marca acréscimo e continuidade na narrativa de modo conciso e natural.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: foi para sua casa, em Gibeá
  rationale: Preserva tanto a casa de Saul como destino quanto Gibeá como localidade, incluindo o sentido direcional da forma hebraica.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: e com ele foram
  rationale: Mantém a sequência narrativa e realça naturalmente o acompanhamento.
- source_word: הַחַיִל
  choice: os homens valentes
  rationale: No contexto, designa homens capazes e valorosos que acompanharam Saul, não necessariamente um exército institucional.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: cujo coração Deus havia tocado
  rationale: Preserva a metáfora hebraica e o singular coletivo 'coração' com o referente plural, sem definir além do texto a natureza da ação divina.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Refere-se claramente ao Deus de Israel.
- source_word: לֵב
  choice: coração
  rationale: Representa o interior humano, incluindo disposição, vontade e pensamento, e conserva a imagem tradicional do hebraico.
theological_decisions:
- issue: Natureza da ação de Deus ao tocar o coração dos homens
  choice: Manter a expressão metafórica 'Deus havia tocado', afirmando a iniciativa divina sem especificar seu mecanismo.
  alternative: Deus havia movido ou despertado o coração deles.
  rationale: O texto atribui a Deus uma ação sobre a disposição interior desses homens, mas não a define como regeneração, coerção irresistível ou simples emoção.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A formulação conserva a ordem narrativa e a metáfora hebraica sem impor uma interpretação doutrinária específica.
