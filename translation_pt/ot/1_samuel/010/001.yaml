source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: pt
  text: 'Então Samuel pegou o frasco de óleo, derramou-o sobre a cabeça dele e o beijou. Depois disse: “Não foi Yahweh que ungiu você como governante[a] sobre sua herança?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder” ou “príncipe”. O termo hebraico se refere a alguém designado para governar e não tem exatamente a mesma nuance do título posterior “rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: frasco de óleo
  rationale: פַּךְ designa um recipiente pequeno. “Frasco” é concreto, atual e natural em português, sem o tom arcaico de “vaso” ou a especificidade indevida de “ampola”.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: derramou-o sobre a cabeça de Saul
  rationale: יצק significa “derramar”, e עַל רֹאשׁוֹ indica o lugar da ação. O nome “Saul”, recuperado do contexto imediato, torna claro o referente do pronome sem alterar o sentido.
- source_word: וַיִּשָּׁקֵהוּ
  choice: o beijou
  rationale: נשׁק significa claramente “beijar” neste contexto; a tradução preserva sem eufemismo o gesto que acompanha a unção.
- source_word: הֲלוֹא כִּי
  choice: Não foi ... que
  rationale: A construção introduz uma pergunta retórica que afirma enfaticamente o ato de Yahweh. Esta formulação conserva essa força em português natural.
- source_word: מְשָׁחֲךָ
  choice: ungiu você
  rationale: משׁח é o verbo próprio da unção ritual e da designação para um ofício. “Ungiu você” preserva ambas as dimensões e tem ampla legibilidade brasileira.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino יהוה; a transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- source_word: נַחֲלָתוֹ
  choice: a sua herança
  rationale: נַחֲלָה denota herança ou propriedade recebida por porção. “A sua herança” mantém o sentido pactual de que Israel pertence a Yahweh.
- source_word: לְנָגִיד
  choice: como governante
  rationale: נָגִיד designa alguém posto à frente para governar. “Governante” comunica a função sem equiparar o termo diretamente ao título posterior e mais específico de “rei”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” conserva o nome pactual e evita substituí-lo por um título.
- issue: Sentido de נָגִיד no comissionamento de Saul
  choice: governante
  alternative: líder; príncipe; rei
  rationale: O termo enfatiza a pessoa designada para estar à frente e governar. “Governante” preserva essa função sem antecipar ou fundir a palavra com o título explícito מֶלֶךְ, “rei”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil. “Você” evita a ambiguidade regional de formas pronominais mais marcadas. O marcador da nota foi colocado junto de “governante”, termo ao qual a nota lexical efetivamente se refere.
