base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: pt
  text: 'Então o tio de Saul perguntou a ele e ao rapaz que o acompanhava: “Aonde vocês foram?” Saul respondeu: “Fomos procurar as jumentas[a]. Quando vimos que não estavam em lugar nenhum, fomos até Samuel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa o termo específico para jumentas, isto é, fêmeas do jumento.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “chegamos até Samuel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: o tio de Saul
  rationale: דּוֹד designa normalmente o tio em contextos familiares narrativos; a tradução específica é mais natural e adequada do que o termo amplo “parente”.
- source_word: אֵלָיו וְאֶל נַעֲרוֹ
  choice: a ele e ao rapaz que o acompanhava
  rationale: נַעַר pode significar jovem, ajudante ou servo. “O rapaz que o acompanhava” comunica com naturalidade sua função no contexto sem afirmar uma condição servil que o termo, por si só, não exige.
- source_word: אָן הֲלַכְתֶּם
  choice: Aonde vocês foram?
  rationale: אָן pergunta pelo destino ou lugar do movimento, e הֲלַכְתֶּם está na segunda pessoa masculina plural. “Aonde” explicita de modo idiomático o movimento expresso por “foram”.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: Fomos procurar as jumentas
  rationale: בקשׁ significa procurar ou buscar, e אֲתֹנוֹת é o plural feminino específico para jumentas. “Procurar” é corrente e natural em português.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: Quando vimos que não estavam em lugar nenhum
  rationale: A expressão hebraica é literalmente “e vimos que não havia/não estavam”. A formulação escolhida deixa claro, sem alterar o referente, que as jumentas não foram encontradas.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: fomos até Samuel
  rationale: בוא descreve a chegada ou ida até alguém conforme a perspectiva narrativa. “Fomos até Samuel” soa natural no relato retrospectivo de Saul e preserva o movimento em direção a Samuel indicado por אֶל.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural e legibilidade brasileira. A repetição explícita de “Saul” na resposta evita uma possível ambiguidade do pronome, embora o hebraico diga apenas “ele respondeu”. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
