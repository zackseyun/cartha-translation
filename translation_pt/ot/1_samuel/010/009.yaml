base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: pt
  text: Quando Saul virou as costas para se afastar de Samuel, Deus lhe mudou o coração, dando-lhe um coração diferente[a], e todos aqueles sinais aconteceram naquele dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Deus mudou para ele um coração diferente”. A expressão descreve uma mudança interior realizada por Deus, sem especificar aqui a natureza exata dessa mudança.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Quando
  rationale: A construção introduz a circunstância temporal que leva ao verbo narrativo principal. Em português, integrá-la como oração temporal evita um calque pesado sem perder a sequência do hebraico.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: virou as costas
  rationale: O hebraico diz literalmente 'virou o ombro', expressão corporal que, neste contexto, indica voltar-se para partir. 'Virou as costas' reproduz o sentido de modo natural em português.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: para se afastar de Samuel
  rationale: Expressa tanto a ação de partir quanto a preposição de separação, em português corrente e claro.
- source_word: וַיַּהֲפָךְ לוֹ אֱלֹהִים לֵב אַחֵר
  choice: Deus lhe mudou o coração, dando-lhe um coração diferente
  rationale: Mantém o valor de mudança do verbo הפך e o sentido literal de לֵב אַחֵר, mas explicita em português a relação sintática difícil da expressão hebraica sem reduzi-la a mera coragem nem importar a fórmula teológica 'novo coração'.
- source_word: כָּל הָאֹתוֹת הָאֵלֶּה
  choice: todos aqueles sinais
  rationale: O demonstrativo retoma os sinais que Samuel acabara de anunciar; 'aqueles' é a retomada mais natural em português neste contexto narrativo.
- source_word: וַיָּבֹאוּ
  choice: aconteceram
  rationale: Com 'sinais' como sujeito, comunica que os acontecimentos preditos se realizaram, sem acrescentar a noção técnica de cumprimento.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: '''Naquele dia'' corresponde diretamente ao hebraico; ''mesmo'' torna natural a ênfase temporal contextual sem alterar a referência.'
theological_decisions:
- issue: Natureza da mudança interior de Saul
  choice: Deus lhe mudou o coração, dando-lhe um coração diferente
  alternative: Deus lhe deu um novo coração; Deus o tornou corajoso para reinar
  rationale: A tradução afirma uma ação divina real sobre a disposição interior de Saul, mas não a identifica especificamente com regeneração, conversão ou simples coragem política. Também evita 'novo coração', expressão que poderia importar associações de outros contextos bíblicos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome 'Saul' foi explicitado para evitar ambiguidade pronominal na abertura do versículo. A formulação conserva a tensão teológica do hebraico e evita terminologia denominacional.
