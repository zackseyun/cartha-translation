- from: 'Então você seguirá adiante dali e chegará ao carvalho de Tabor[a]. Ali, três homens que estarão subindo a Betel para se aproximar de Deus[b] encontrarão você: um levará três cabritos, outro, três pães, e o terceiro, um odre de vinho.'
