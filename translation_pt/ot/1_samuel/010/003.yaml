base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: pt
  text: 'Então você passará dali para mais adiante e chegará ao carvalho de Tabor[a]. Ali, três homens que estarão subindo para Deus em Betel[b] encontrarão você: um levará três cabritos, outro, três pães, e o terceiro, um odre de vinho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao terebinto de Tabor”. A palavra hebraica pode designar uma árvore grande, como um carvalho ou terebinto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “subindo para Deus, Betel”. A construção provavelmente se refere a uma ida a um local de culto em Betel, sem especificar o rito.'
    reason: cultural_note
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: você seguirá adiante dali
  rationale: Expressa de modo natural o movimento contínuo para além do local anterior, preservando tanto a sequência quanto a ideia de prosseguir.
- source_word: אֵלוֹן תָּבוֹר
  choice: o carvalho de Tabor
  rationale: אֵלוֹן designa uma árvore grande, tradicionalmente entendida como carvalho ou terebinto. “Carvalho” é claro e corrente; a alternativa é registrada em nota.
- source_word: וּמְצָאוּךָ
  choice: encontrarão você
  rationale: Embora o verbo tenha o sentido básico de “achar”, neste contexto descreve o encontro dos homens com Saul.
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: subindo a Betel para se aproximar de Deus
  rationale: Mantém a subida a Betel e sua orientação religiosa para Deus, sem especificar sacrifício nem outro rito não declarado no texto.
- source_word: גְדָיִים
  choice: cabritos
  rationale: O substantivo se refere a bodes jovens; “cabritos” é a designação portuguesa natural e precisa.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: pães
  rationale: No contexto, כִּכָּר designa um pão ou bolo de formato arredondado. “Três pães” é natural e suficiente em português.
- source_word: נֵבֶל יָיִן
  choice: um odre de vinho
  rationale: נֵבֶל designa aqui um recipiente para líquido, tradicionalmente entendido como odre; a construção hebraica especifica que ele contém vinho.
theological_decisions:
- issue: Sentido de “subindo a Deus em Betel”
  choice: subindo a Betel para se aproximar de Deus
  alternative: subindo a Betel para adorar a Deus
  rationale: A formulação comunica que a viagem a Betel se dirige religiosamente a Deus, mas evita acrescentar explicitamente “adorar”, atividade provável no contexto, porém não expressa pelo verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição hebraica de “um... outro... um” foi vertida como “um... outro... o terceiro” para clareza, sem alterar a enumeração.
