  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: pt
  text: 'Quando você partir hoje da minha presença, encontrará dois homens perto do túmulo de Raquel, no território[a] de Benjamim, em Zelza. Eles lhe dirão: “As jumentas que você foi procurar foram encontradas. E eis que seu pai deixou de lado a questão das jumentas[b] e está preocupado com vocês[c], dizendo: ‘O que farei por meu filho?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na fronteira de Benjamim”. A palavra hebraica pode indicar tanto a fronteira como o território delimitado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “deixou a questão das jumentas”.
    reason: literal_rendering
  - marker: c
    text: O pronome hebraico está no plural, provavelmente referindo-se a Saul e ao servo que viajava com ele.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: Quando você partir hoje da minha presença
  rationale: A construção com infinitivo introduz uma oração temporal. “Partir da minha presença” expressa com naturalidade a saída de junto de Samuel sem perder o sentido locativo.
- source_word: וּמָצָאתָ
  choice: encontrará
  rationale: Embora a forma hebraica seja qatal, no discurso profético ela indica o encontro futuro anunciado por Samuel.
- source_word: עִם קְבֻרַת רָחֵל
  choice: perto do túmulo de Raquel
  rationale: Neste contexto locativo, עִם tem o sentido de “junto de/perto de”; “túmulo” é uma forma natural de designar o local de sepultamento identificado.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: no território de Benjamim
  rationale: גְּבוּל pode designar tanto um limite quanto a região delimitada. “Território” produz uma localização clara, enquanto a alternativa “fronteira” é preservada em nota.
- source_word: בְּצֶלְצַח
  choice: em Zelza
  rationale: O topônimo é transliterado segundo forma portuguesa legível e tradicional.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: As jumentas que você foi procurar foram encontradas
  rationale: אָתוֹנוֹת especifica animais fêmeas, adequadamente traduzidos por “jumentas”; a forma passiva comunica o estado resultante expresso pelo perfeito hebraico.
- source_word: וְהִנֵּה
  choice: Agora
  rationale: A partícula chama a atenção para uma nova situação. “Agora” preserva essa mudança discursiva em português corrente, sem o tom arcaico de “eis que”.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: seu pai deixou de lado a questão das jumentas
  rationale: A expressão significa literalmente que o pai abandonou ou deixou a questão das jumentas. A tradução mantém a imagem verbal e evita sugerir falta de cuidado com os animais.
- source_word: וְדָאַג לָכֶם
  choice: e está preocupado com vocês
  rationale: דאג expressa preocupação ansiosa. O pronome hebraico é plural e provavelmente inclui Saul e o servo que o acompanhava; “vocês” torna esse dado explícito.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: O que vou fazer quanto ao meu filho?
  rationale: A preposição ל pode indicar a pessoa a respeito de quem se age ou se preocupa. “Quanto ao meu filho” comunica a inquietação do pai sem definir de modo excessivo a ação pretendida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você/vocês” para distinguir o singular dirigido a Saul do plural que inclui seu acompanhante. As falas encaixadas usam aspas e apóstrofos para manter transparente a estrutura do discurso direto.
