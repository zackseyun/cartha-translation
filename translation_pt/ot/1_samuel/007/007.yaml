base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: pt
  text: Quando os filisteus souberam que os filhos de Israel se haviam reunido em Mispá[a], os governantes dos filisteus avançaram contra Israel. Quando os filhos de Israel souberam disso, ficaram com medo dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para Mispá”. A forma hebraica inclui uma terminação que indica direção, embora o contexto apresente o povo reunido naquele lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: souberam
  rationale: No contexto narrativo, שׁמע indica receber uma notícia. “Souberam” é natural em português nas duas ocorrências e preserva a repetição do verbo.
- source_word: פְלִשְׁתִּים
  choice: filisteus
  rationale: Forma portuguesa consagrada para o nome desse povo.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da notícia recebida pelos filisteus.
- source_word: הִתְקַבְּצוּ
  choice: se haviam reunido
  rationale: O hitpael de קבץ expressa reunião conjunta; o mais-que-perfeito composto deixa clara a anterioridade em relação à notícia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão formal hebraica e continua compreensível em português moderno.
- source_word: הַמִּצְפָּתָה
  choice: em Mispá
  rationale: Embora a terminação direcional possa sugerir “para Mispá”, o contexto apresenta o povo já reunido no local.
- source_word: וַיַּעֲלוּ
  choice: avançaram
  rationale: עלה descreve aqui movimento militar hostil. “Avançaram” comunica isso naturalmente sem acrescentar uma modalidade específica de marcha.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: os governantes dos filisteus
  rationale: סרנים designa os dirigentes político-militares reconhecidos das cidades filisteias; “governantes” é claro e evita as conotações modernas ou religiosas de “senhores”.
- source_word: אֶל יִשְׂרָאֵל
  choice: contra Israel
  rationale: Neste contexto militar, אֶל indica movimento hostil dirigido contra Israel.
- source_word: וַיִּשְׁמְעוּ
  choice: souberam disso
  rationale: O objeto implícito é o avanço dos governantes filisteus. “Disso” torna a frase natural em português sem alterar o referente contextual.
- source_word: וַיִּירְאוּ
  choice: ficaram com medo
  rationale: Expressa de modo natural o surgimento do temor narrado por ירא.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: dos filisteus
  rationale: A locução idiomática indica que os filisteus eram a causa ou objeto do medo; “com medo dos filisteus” é a formulação idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se “filhos de Israel” por transparência formal; a repetição de שׁמע é refletida por “souberam”. O marcador [a] aparece no texto. Não se incluiu nota em “governantes”, pois a alternativa lexical pode ser registrada nas decisões sem necessidade editorial; a nota [b] da camada inglesa parece estar associada ao segmento errado.
