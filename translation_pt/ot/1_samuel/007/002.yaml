  rationale: A revisão substitui a formulação temporal menos natural por uma expressão portuguesa clara que conserva os muitos dias e sua duração de vinte anos. Também evita explicitar “busca” como sentido principal da construção final, preservando na nota as possibilidades interpretativas da expressão hebraica. A nota sobre “os dias se tornaram muitos” foi retirada porque a redação revista já comunica diretamente esse sentido e não requer âncora lexical.
