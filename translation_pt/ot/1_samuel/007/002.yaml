base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: pt
  text: Desde o dia em que a arca permaneceu em Quiriate-Jearim, passaram-se muitos dias—vinte anos—; e toda a casa de Israel se lamentou por Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “lamentou-se após Yahweh”. A expressão pode indicar lamento por Yahweh, anseio por ele ou um voltar-se para ele.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת
  choice: permaneceu
  rationale: O infinitivo construto de ישׁב indica a permanência da arca naquele lugar; “permaneceu” é natural para um objeto e preserva a ideia de continuidade.
- source_word: הָאָרוֹן
  choice: a arca
  rationale: O hebraico traz apenas “a arca”, sem complemento; a forma consagrada é clara no contexto narrativo.
- source_word: בְּקִרְיַת יְעָרִים
  choice: em Quiriate-Jearim
  rationale: A preposição marca localização, e o topônimo é transliterado numa forma legível e tradicional em português.
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: os dias se acumularam
  rationale: A expressão hebraica significa literalmente que “os dias se tornaram muitos”. “Se acumularam” conserva a imagem do aumento dos dias com maior naturalidade em português.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: chegando a vinte anos
  rationale: A formulação liga naturalmente os vinte anos aos dias acumulados, sem perder a duração expressa pelo hebraico.
- source_word: וַיִּנָּהוּ
  choice: se lamentou
  rationale: O verbo נהה comunica lamento ou pranto. O singular concorda naturalmente com o coletivo “toda a casa de Israel” em português.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Mantém a expressão nacional e pactual do hebraico, em vez de reduzi-la simplesmente a “todo Israel”.
- source_word: אַחֲרֵי יְהוָה
  choice: em busca de Yahweh
  rationale: אַחֲרֵי significa literalmente “atrás de/após”; no contexto, aponta para uma orientação em direção a Yahweh. “Em busca de” evita o sentido temporal indevido de “após” em português, enquanto a nota preserva outras nuances possíveis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de וַיִּנָּהוּ ... אַחֲרֵי יְהוָה
  choice: Israel se lamentou orientando-se ou buscando Yahweh, sem declarar explicitamente uma fórmula plena de arrependimento.
  alternative: Israel ansiou por Yahweh; ou Israel chorou voltando-se para Yahweh.
  rationale: A combinação de נהה com אַחֲרֵי admite as nuances de lamento, anseio e movimento em direção a Yahweh. O texto principal conserva o lamento e a orientação para ele, enquanto a nota registra a ambiguidade sem impor uma leitura confessional mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura temporal do hebraico foi mantida sem reproduzir uma formulação excessivamente rígida; a expressão final conserva sua tensão semântica por meio do texto e da nota.
