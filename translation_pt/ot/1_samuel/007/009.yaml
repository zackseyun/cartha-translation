  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: pt
  text: Então Samuel pegou um cordeiro ainda mamando[a] e o ofereceu inteiro como holocausto a Yahweh. Samuel clamou a Yahweh em favor de Israel, e Yahweh lhe respondeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um cordeiro de leite”, isto é, um cordeiro que ainda se alimentava de leite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: um cordeiro ainda mamando
  rationale: A expressão designa um cordeiro jovem que ainda se alimenta de leite. A formulação é clara e natural em português e preserva essa informação específica do hebraico.
- source_word: וַיַּעֲלֵה
  choice: o ofereceu
  rationale: O hifil de עלה funciona aqui como verbo sacrificial. “Ofereceu” comunica naturalmente a ação no contexto, sem reproduzir de modo artificial a imagem etimológica de fazer subir.
- source_word: עוֹלָה כָּלִיל
  choice: inteiro como holocausto
  rationale: עוֹלָה é o termo sacrificial tradicionalmente vertido por “holocausto”, e כָּלִיל indica que o animal foi oferecido por inteiro. A ordem portuguesa deixa clara a totalidade da oferta.
- source_word: לַיהוָה / אֶל־יְהוָה / יְהוָה
  choice: a Yahweh / Yahweh
  rationale: A transliteração “Yahweh” preserva o nome divino expresso diretamente pelo tetragrama no texto hebraico.
- source_word: וַיִּזְעַק
  choice: clamou
  rationale: זעק denota um apelo intenso e urgente por socorro. “Clamou” mantém essa força e se ajusta ao registro bíblico atual.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: em favor de Israel
  rationale: בְּעַד indica que Samuel intercede em benefício do povo. “Em favor de” é natural e não explicita além do que o texto afirma.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: Yahweh lhe respondeu
  rationale: O sufixo pronominal refere-se a Samuel. “Lhe respondeu” reproduz essa relação com concisão e clareza.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Natureza integral do sacrifício
  choice: o ofereceu inteiro como holocausto
  alternative: ofereceu um holocausto completo
  rationale: A redação mantém tanto a categoria sacrificial עוֹלָה quanto a afirmação de כָּלִיל de que o cordeiro foi oferecido em sua totalidade, sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Holocausto” é mantido como termo sacrificial estabelecido; “clamou” preserva a urgência da intercessão. O marcador da nota foi colocado junto à expressão que ela esclarece.
