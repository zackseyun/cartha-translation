  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: pt
  text: Enquanto Samuel oferecia o holocausto, os filisteus se aproximaram para lutar contra Israel. Mas, naquele dia, Yahweh trovejou com grande estrondo[a] contra os filisteus e os confundiu; eles foram derrotados diante de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com um grande som”. Também pode ser traduzido por “com poderoso trovão” ou “com forte estrondo”.'
    reason: A expressão קוֹל גָּדוֹל permite certa amplitude lexical; a nota preserva a formulação literal e alternativas adequadas ao contexto.
lexical_decisions:
- source_word: מַעֲלֶה
  choice: oferecia
  rationale: O particípio hifil de עלה descreve a ação sacrificial em andamento; no contexto narrativo, o imperfeito português expressa naturalmente essa simultaneidade.
- source_word: הָעוֹלָה
  choice: o holocausto
  rationale: עֹלָה é o termo sacrificial usual para a oferta inteiramente queimada; “holocausto” é a designação bíblica consagrada e compreensível em português.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: se aproximaram para lutar contra Israel
  rationale: A formulação comunica tanto o movimento de aproximação quanto a finalidade militar e o sentido adversativo da preposição ב neste contexto.
- source_word: וַיַּרְעֵם
  choice: trovejou
  rationale: O verbo רעם denota trovejar; a escolha mantém Yahweh como sujeito direto da ação.
- source_word: בְּקוֹל גָּדוֹל
  choice: com grande estrondo
  rationale: A expressão significa literalmente “com um grande som”. “Grande estrondo” é natural em português no contexto do trovão, sem transformar o som em fala articulada.
- source_word: וַיְהֻמֵּם
  choice: os lançou em confusão
  rationale: O verbo causativo המם descreve a provocação de confusão, pânico ou desordem, especialmente em combate; esta tradução preserva a força causativa sem antecipar a derrota mencionada em seguida.
- source_word: וַיִּנָּגְפוּ
  choice: foram derrotados
  rationale: O nifal de נגף, em contexto militar, indica sofrer derrota ou ser abatido; “foram derrotados” expressa o resultado sem necessariamente implicar a morte de todos.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: diante de Israel
  rationale: Preserva o idioma hebraico de derrota perante um adversário e soa natural no registro bíblico português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Agência divina na derrota dos filisteus
  choice: Yahweh trovejou e os lançou em confusão
  alternative: Uma tempestade confundiu os filisteus
  rationale: A gramática hebraica apresenta Yahweh explicitamente como sujeito das duas ações; a tradução mantém essa agência sem explicar o mecanismo além do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A abertura com “Enquanto” reproduz a simultaneidade narrativa sem a fórmula pesada “E aconteceu que”. “Assim” explicita apenas a progressão resultante já presente na sequência hebraica.
