base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: pt
  text: 'Então Samuel disse: “Reúnam todo o Israel para Mispá, e eu orarei a Yahweh em favor de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: קִבְצוּ
  choice: Reúnam
  rationale: O imperativo plural de קבץ convoca os destinatários a ajuntar o povo; “Reúnam” é direto e natural.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Preserva o sentido coletivo e nacional da expressão hebraica.
- source_word: הַמִּצְפָּתָה
  choice: em Mispá
  rationale: Embora o hebraico tenha terminação direcional, em português o verbo “reunir” rege naturalmente “em” para indicar o local de encontro, sem perder a ideia de deslocamento até ali.
- source_word: וְאֶתְפַּלֵּל
  choice: e eu orarei
  rationale: O imperfeito na primeira pessoa após o imperativo indica a ação que Samuel pretende realizar em seguida.
- source_word: בַּעַדְכֶם
  choice: em favor de vocês
  rationale: Explicita o valor intercessório de בעד em linguagem portuguesa corrente.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição אֶל com o verbo “orar” é expressa naturalmente por “a”; o nome divino é transliterado como “Yahweh”, conforme a evidência direta do texto hebraico e a decisão doutrinária atualizada fornecida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a decisão teológica atualizada apresentada, apesar da inconsistência existente na nota da camada inglesa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” evita regionalismo excessivo; “Mispá” segue a forma tradicional portuguesa do topônimo.
