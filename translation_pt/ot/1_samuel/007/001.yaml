  terminology: “Arca”, “consagraram”, “guardar” e “Yahweh” são escolhas adequadas e consistentes. “Quiriate-Jearim” e “Abinadabe” são formas aceitáveis em português. A nota sobre Gibeá preserva corretamente a alternativa interpretativa de בַּגִּבְעָה.
