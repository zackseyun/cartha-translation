  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: pt
  text: Então os homens de Quiriate-Jearim vieram, levaram a arca de Yahweh[a] para cima e a levaram para a casa de Abinadabe, na colina[b]. E consagraram Eleazar, seu filho, para guardar a arca de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH, aqui representado como “Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, “em Gibeá”, caso a expressão hebraica seja entendida como nome de lugar, e não como “na colina”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: O qal narrativo de בוא indica a chegada dos homens e faz avançar a sequência do relato.
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  choice: os homens de Quiriate-Jearim
  rationale: אַנְשֵׁי significa especificamente “homens de”; o topônimo é transliterado em forma corrente e reconhecível em português.
- source_word: וַיַּעֲלוּ אֶת אֲרוֹן יְהוָה
  choice: subiram com a arca de Yahweh
  rationale: A construção transitiva de עלה expressa fazer subir ou transportar para um lugar mais elevado. “Subiram com” conserva a direção sem produzir uma formulação artificial em português.
- source_word: וַיָּבִאוּ אֹתוֹ אֶל בֵּית אֲבִינָדָב
  choice: a levaram para a casa de Abinadabe
  rationale: ביא com objeto significa “trazer/levar”; em português, “levaram para” expressa naturalmente o transporte até o destino, sem afirmar de modo indevido que a arca foi posta no interior do edifício.
- source_word: בַּגִּבְעָה
  choice: na colina
  rationale: A forma com artigo é mais naturalmente entendida como o substantivo comum “a colina”, embora a leitura como topônimo permaneça possível e seja registrada em nota.
- source_word: וְאֶת אֶלְעָזָר בְּנוֹ
  choice: Também consagraram Eleazar, filho dele
  rationale: A ordem foi ajustada ao português natural. “Dele” remete a Abinadabe, o antecedente masculino singular imediato, sem acrescentar o nome ao texto.
- source_word: קִדְּשׁוּ
  choice: consagraram
  rationale: קדשׁ aqui significa separar alguém para uma função sagrada; “consagraram” preserva essa força cultual.
- source_word: לִשְׁמֹר
  choice: para guardar
  rationale: שׁמר abrange guardar, vigiar e proteger; “guardar” transmite de modo conciso a responsabilidade de custódia da arca.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: “Yahweh” representa o nome próprio presente no hebraico em vez de substituí-lo por um título. A nota identifica explicitamente a forma hebraica e permite ao leitor reconhecer a tradição alternativa.
- issue: Interpretação de בַּגִּבְעָה
  choice: na colina
  alternative: em Gibeá
  rationale: O artigo favorece a leitura como substantivo comum, mas a possibilidade de um topônimo é genuína e, por isso, não é ocultada.
- issue: Referente de בְּנוֹ, “seu filho”
  choice: filho dele, com referência contextual a Abinadabe
  alternative: seu filho, com referente formalmente menos explícito
  rationale: Abinadabe é o antecedente imediato e a leitura natural do hebraico. A formulação portuguesa evita inserir novamente o nome, mas mantém a relação indicada pelo sufixo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluida. “Subiram com” evita o literalismo pouco natural “fizeram subir”, enquanto conserva a ideia de movimento ascendente. Os marcadores [a] e [b] foram posicionados junto aos termos que suas notas explicam.
