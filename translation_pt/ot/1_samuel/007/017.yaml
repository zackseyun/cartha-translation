  text: וּ/תְשֻׁבָת֤/וֹ הָ/רָמָ֨תָ/ה֙ כִּֽי שָׁ֣ם בֵּית֔/וֹ וְ/שָׁ֖ם שָׁפָ֣ט אֶת יִשְׂרָאֵ֑ל וַ/יִּֽבֶן שָׁ֥ם מִזְבֵּ֖חַ לַֽ/יהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: pt
  text: Depois, ele voltava para Ramá[a], pois ali ficava a sua casa, e ali julgava Israel. E construiu ali um altar a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E o seu retorno era para Ramá”.'
    reason: alternativa lexical que preserva a construção nominal do hebraico
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: Depois, ele voltava
  rationale: A expressão nominal significa literalmente “e o seu retorno”. À luz do circuito habitual descrito no versículo anterior, a formulação verbal no imperfeito comunica com naturalidade a ação recorrente, sem perder o sentido do hebraico.
- source_word: הָרָמָתָה
  choice: para Ramá
  rationale: O ה direcional ligado ao nome do lugar indica movimento em direção a Ramá; “para Ramá” é a forma portuguesa natural.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão de Samuel retornar a Ramá, preservando a relação explicativa do texto.
- source_word: שָׁם בֵּיתוֹ
  choice: ali ficava a sua casa
  rationale: Mantém o sentido concreto de בַּיִת e expressa de modo idiomático a localização permanente da casa.
- source_word: וְשָׁם שָׁפַט אֶת־יִשְׂרָאֵל
  choice: e ali julgava Israel
  rationale: Preserva a repetição enfática de “ali” e traduz שׁפט segundo a função reconhecida de Samuel como juiz de Israel, mais ampla que uma atividade exclusivamente judicial.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: E construiu ali um altar
  rationale: A forma narrativa faz avançar o relato. Não se acrescenta “também”, pois essa noção não está explicitada no hebraico; a repetição de “ali” é mantida.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica que o altar foi erguido e dedicado a YHWH; o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido de שׁפט aplicado a Samuel
  choice: julgava Israel
  alternative: governava Israel; administrava justiça a Israel
  rationale: “Julgava” conserva o termo tradicional e a amplitude do papel de Samuel como juiz, sem reduzi-lo apenas ao governo político ou a decisões em tribunais.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O imperfeito (“voltava”, “julgava”) apresenta o caráter habitual do circuito de Samuel no contexto. A repetição de “ali” reproduz a estrutura espacial do hebraico.
