translation_notes:
  register: Português moderno, digno e acessível, com preferência por uma formulação fluente. O aspecto habitual é expresso pelos imperfeitos “percorria” e “julgava” e pela locução “Todos os anos”. Não foram necessárias notas, pois as alternativas lexicais não alteram substancialmente o sentido.
