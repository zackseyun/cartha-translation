base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: pt
  text: Todos os anos, Samuel fazia o circuito por Betel, Gilgal e Mispá e julgava Israel em todos esses lugares.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: Samuel percorria
  rationale: O verbo, unido à expressão temporal habitual, descreve uma prática repetida. O nome “Samuel”, recuperado do contexto, evita um início pronominal pouco natural em português.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: Todos os anos
  rationale: A expressão idiomática indica recorrência anual regular; esta formulação é clara e natural em português moderno.
- source_word: וְסָבַב
  choice: percorria
  rationale: No contexto, o verbo descreve um itinerário regular que passava pelas cidades enumeradas. “Percorria” comunica esse circuito habitual sem sugerir apenas movimento circular.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Transliteração tradicional e amplamente reconhecida do topônimo em português.
- source_word: הַמִּצְפָּה
  choice: Mispá
  rationale: Forma tradicional portuguesa do topônimo, com acento para indicar a pronúncia.
- source_word: וְשָׁפַט
  choice: julgava
  rationale: Preserva a ligação lexical com a atividade judicial de Samuel e mantém aberto o sentido mais amplo de exercer liderança como juiz.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Designa o povo de Israel como objeto da atividade judicial de Samuel.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: em todos esses lugares
  rationale: Embora introduzida por אֵת, a expressão funciona aqui de modo adverbial, indicando os locais onde Samuel julgava Israel.
