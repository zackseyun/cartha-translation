source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: pt
  text: As cidades que os filisteus haviam tomado de Israel foram devolvidas a Israel, desde Ecrom até Gate; e Israel libertou o território delas do domínio dos filisteus. E houve paz entre Israel e os amorreus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “os cananeus”, caso “amorreus” seja entendido aqui como um termo mais amplo para os povos da terra.
    reason: Leitura interpretativa alternativa do alcance do etnônimo hebraico.
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: foram devolvidas
  rationale: O verbo שׁוב tem as cidades como sujeito e indica que elas voltaram à posse de Israel. A construção passiva é natural em português e evita personificar as cidades.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: Tradução comum de עָרִים, adequada ao contexto de centros urbanos sob controle territorial.
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים
  choice: que os filisteus haviam tomado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da tomada em relação à devolução.
- source_word: מֵאֵת יִשְׂרָאֵל ... לְיִשְׂרָאֵל
  choice: de Israel ... a Israel
  rationale: Mantém a repetição enfática do hebraico e seu sentido nacional e territorial.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: desde Ecrom até Gate
  rationale: Expressa diretamente a extensão geográfica indicada pela construção hebraica.
- source_word: וְאֶת גְּבוּלָן
  choice: o território delas
  rationale: גְּבוּל pode designar fronteira ou território. O sufixo feminino plural retoma naturalmente as cidades, por isso 'delas' preserva a referência gramatical do hebraico.
- source_word: הִצִּיל
  choice: libertou
  rationale: No hifil, נצל indica livrar ou arrancar do poder de alguém. 'Libertou' preserva o sentido de recuperação diante de domínio hostil.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: do domínio dos filisteus
  rationale: Traduz idiomaticamente a imagem hebraica 'da mão dos filisteus' como sujeição ao poder deles, com clareza para leitores modernos.
- source_word: וַיְהִי שָׁלוֹם
  choice: E houve paz
  rationale: Reproduz de modo simples a construção existencial e o sentido de cessação de hostilidades.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: Preserva no texto principal o etnônimo específico presente no hebraico, embora a forma esteja no singular coletivo.
theological_decisions:
- issue: Alcance do etnônimo הָאֱמֹרִי no fim do versículo
  choice: os amorreus
  alternative: os cananeus
  rationale: O texto hebraico nomeia especificamente o amorreu, em uso coletivo. Alguns entendem o termo como designação mais ampla dos povos da terra; essa possibilidade é preservada em nota, sem substituir o sentido lexical direto no texto principal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a repetição 'Israel ... Israel' e emprega-se 'território delas' para refletir o antecedente feminino plural do sufixo hebraico. O marcador da nota foi colocado junto de 'amorreus', expressão à qual a nota se refere.
