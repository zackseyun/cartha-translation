  text: וַ/יָּסִ֨ירוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּרֹ֑ת וַ/יַּעַבְד֥וּ אֶת יְהוָ֖ה לְ/בַדּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: pt
  text: Então, os filhos de Israel removeram os Baalins e as Astartes e serviram somente a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adoraram somente a Yahweh”. Quando Deus é o objeto, o verbo hebraico pode indicar tanto serviço quanto adoração.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: removeram
  rationale: O hifil de סוּר indica tirar ou eliminar; “removeram” expressa claramente o abandono concreto dos objetos de culto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica tradicional e seu caráter de designação pactual do povo, permanecendo compreensível em português.
- source_word: הַבְּעָלִים
  choice: os baalins
  rationale: Mantém o plural hebraico, que pode designar manifestações locais de Baal ou suas representações cultuais, sem decidir entre essas possibilidades.
- source_word: הָעַשְׁתָּרֹת
  choice: as astartes
  rationale: Emprega a forma portuguesa reconhecível do nome próprio no plural e conserva a referência cultual específica.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: עבד, tendo Deus como objeto, pode abranger serviço e culto; “serviram” preserva o sentido lexical mais amplo de lealdade e devoção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְבַדּוֹ
  choice: somente a Yahweh
  rationale: A colocação de “somente” junto ao objeto comunica naturalmente a exclusividade da devoção em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de עבד neste contexto
  choice: serviram somente a Yahweh
  alternative: adoraram somente a Yahweh
  rationale: “Serviram” mantém o alcance mais amplo de lealdade pactual, enquanto a nota registra explicitamente o possível sentido cultual de adoração.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantêm-se os nomes cultuais no plural e a formulação tradicional “filhos de Israel”; a nota preserva a amplitude semântica de עבד.
