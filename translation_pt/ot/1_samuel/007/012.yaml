base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: pt
  text: 'Então Samuel pegou uma pedra e a colocou entre Mispá e Sem. Ele lhe deu o nome de Ebenézer[a], pois disse: “Até aqui o SENHOR nos ajudou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ebenézer significa “pedra de ajuda”.
    reason: Torna acessível o jogo semântico entre o nome dado à pedra e a afirmação de que o SENHOR ajudou Israel.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: uma pedra
  rationale: Em português, o artigo indefinido já expressa naturalmente a unidade; traduzir por “uma única pedra” acrescentaria uma ênfase ausente do contexto.
- source_word: הַמִּצְפָּה
  choice: Mispá
  rationale: Transliteração portuguesa corrente do topônimo hebraico, cujo artigo faz parte da forma contextual, sem necessidade de ser vertido separadamente.
- source_word: הַשֵּׁן
  choice: Sem
  rationale: Tratado como topônimo conforme o contexto e a tradição textual; a forma portuguesa preserva o nome sem explicar de modo incerto seu referente.
- source_word: אֶבֶן הָעָזֶר
  choice: Ebenézer
  rationale: Transliteração tradicional e reconhecível do nome memorial, cuja composição hebraica significa “pedra de ajuda”; a nota explicita o sentido.
- source_word: עַד הֵנָּה
  choice: Até aqui
  rationale: Expressão portuguesa natural que preserva a referência espacial ou temporal potencialmente aberta do hebraico.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Representação portuguesa tradicional do tetragrama, em versaletes simuladas por maiúsculas.
theological_decisions:
- issue: Alcance de “até aqui”
  choice: Preservar a formulação aberta “Até aqui”
  alternative: “Até este ponto” ou uma explicitação exclusivamente temporal
  rationale: O hebraico pode apontar ao lugar alcançado e, por extensão, ao percurso histórico até aquele momento; a tradução não deve restringir desnecessariamente a tensão.
- issue: Sentido do nome Ebenézer
  choice: Manter o nome no texto e explicar seu significado em nota
  alternative: Traduzir o nome diretamente como “Pedra de Ajuda”
  rationale: O texto apresenta um nome próprio memorial, mas sua transparência semântica em hebraico é relevante para compreender a declaração de Samuel.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A divisão em duas frases evita uma cadeia excessiva de coordenações sem perder a sequência narrativa hebraica.
