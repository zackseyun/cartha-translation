base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: pt
  text: Então os homens de Israel saíram de Mispá, perseguiram os filisteus e os derrotaram[a] até um ponto abaixo de Bete-Car[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os feriram». O verbo hebraico pode indicar golpear ou abater em batalha e, por extensão, derrotar.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «abaixo de Bete-Car», provavelmente indicando um local de menor altitude que Bete-Car.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: O qal narrativo de יצא exprime a saída de um lugar; «saíram» é natural e preciso no contexto.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Preserva a formulação masculina do hebraico e, no contexto militar, refere-se aos combatentes de Israel.
- source_word: מִן הַמִּצְפָּה
  choice: de Mispá
  rationale: Trata-se do topônimo tradicionalmente transliterado em português como «Mispá».
- source_word: וַיִּרְדְּפוּ אֶת פְּלִשְׁתִּים
  choice: perseguiram os filisteus
  rationale: רדף é o verbo usual para perseguir um inimigo, e «filisteus» é o etnônimo corrente em português.
- source_word: וַיַּכּוּם
  choice: os derrotaram
  rationale: נכה, em contexto de batalha, pode indicar ferir ou abater com o resultado de vencer; «derrotaram» comunica o sentido militar sem afirmar que todos foram mortos.
- source_word: עַד מִתַּחַת
  choice: até um ponto abaixo de
  rationale: A expressão marca o limite espacial da perseguição e uma posição topograficamente inferior; a explicitação «um ponto» produz português natural.
- source_word: לְבֵית כָּר
  choice: Bete-Car
  rationale: Nome de lugar transliterado segundo formas correntes de topônimos hebraicos em português.
