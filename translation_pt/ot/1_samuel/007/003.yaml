  naturalness: O português é claro e de registro adequado. “Preparem o coração de vocês para Yahweh” é uma formulação mais natural e mais diretamente correspondente a הָכִינוּ לְבַבְכֶם אֶל־יְהוָה do que “orientem o coração para Yahweh”.
  terminology: “Yahweh”, “casa de Israel”, “deuses estrangeiros”, “Astarotes”, “sirvam somente a ele” e “da mão dos filisteus” são escolhas adequadas. A nota sobre Astarotes mantém corretamente a indefinição quanto ao referente preciso do plural hebraico.
