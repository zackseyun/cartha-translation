  to: 'Então Samuel disse a toda a casa de Israel: “Se vocês estão voltando para Yahweh de todo o coração[a], removam do meio de vocês os deuses estrangeiros e as Astarotes[b], preparem o coração de vocês para Yahweh[c] e sirvam somente a ele, e ele os livrará da mão dos filisteus[d].”'
