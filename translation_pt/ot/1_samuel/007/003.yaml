source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: pt
  text: 'Então Samuel disse a toda a casa de Israel: “Se vocês estão voltando para Yahweh de todo o coração[a], removam do meio de vocês os deuses estrangeiros e as Astarotes[b], preparem o coração de vocês para Yahweh[c] e sirvam somente a ele, e ele os livrará da mão dos filisteus[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Se vocês voltarem para Yahweh de todo o coração”.'
    reason: lexical_alternative
  - marker: b
    text: O plural hebraico “Astarotes” provavelmente se refere a manifestações, imagens ou formas cultuais ligadas à deusa Astarte.
    reason: cultural_note
  - marker: c
    text: 'Ou: “dirijam o coração de vocês para Yahweh” ou “firmem o coração de vocês em Yahweh”.'
    reason: lexical_alternative
  - marker: d
    text: “Da mão dos filisteus” é uma expressão hebraica que significa ser libertado do domínio ou poder deles.
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Samuel disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa a sequência com naturalidade em português.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Preserva a imagem corporativa e familiar do hebraico, em vez de reduzi-la simplesmente a “todo o Israel”.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: Se vocês estão voltando para Yahweh de todo o coração
  rationale: “Estão voltando” reflete a forma participial de שׁוב e seu sentido de retorno à lealdade da aliança; “de todo o coração” é a forma idiomática natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal e preserva sua função pactual no texto.
- source_word: הָסִירוּ אֶת אֱלֹהֵי הַנֵּכָר מִתּוֹכְכֶם
  choice: removam do meio de vocês os deuses estrangeiros
  rationale: Expressa claramente a ordem de eliminar da comunidade as divindades alheias, preservando o sentido comunitário de מִתּוֹכְכֶם.
- source_word: וְהָעַשְׁתָּרֹת
  choice: e as Astarotes
  rationale: Mantém em português a forma plural do nome hebraico, sem decidir no corpo do texto se ela designa manifestações, imagens ou formas cultuais da deusa.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: orientem o coração para Yahweh
  rationale: Comunica a ideia de estabelecer ou dirigir firmemente a disposição interior para Yahweh, evitando uma formulação excessivamente literal.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: e sirvam somente a ele
  rationale: “Sirvam” conserva a amplitude de עבד, que inclui culto, obediência e lealdade exclusiva, sem restringi-lo apenas à adoração ritual.
- source_word: וְיַצֵּל אֶתְכֶם
  choice: Então ele os livrará
  rationale: O futuro apresenta de modo natural o resultado esperado das ordens anteriores; “livrará” traduz o causativo de נצל.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: da mão dos filisteus
  rationale: Preserva a imagem hebraica transparente da “mão” como domínio ou poder opressor.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido do retorno expresso por שָׁבִים
  choice: estão voltando para Yahweh
  alternative: voltam para Yahweh; estão se convertendo a Yahweh
  rationale: “Voltando” preserva tanto o aspecto participial quanto o chamado à renovação da lealdade, sem importar uma formulação doutrinária posterior por meio de “converter-se”.
- issue: Alcance de עבד no contexto
  choice: sirvam somente a ele
  alternative: adorem somente a ele
  rationale: O verbo abrange serviço, obediência e culto; “sirvam” mantém essa amplitude e a exigência de lealdade exclusiva.
- issue: Relação entre obediência e livramento
  choice: Então ele os livrará
  alternative: para que ele os livre; e ele os livrará
  rationale: A formulação apresenta o livramento como resultado prometido no fluxo da exortação, sem desenvolver além do texto uma teoria sobre causalidade meritória.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e mantém imagens hebraicas transparentes, explicando em notas os elementos culturais ou idiomáticos menos imediatos.
