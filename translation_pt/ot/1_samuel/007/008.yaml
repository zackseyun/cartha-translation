  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: pt
  text: 'Então os filhos de Israel disseram a Samuel: “Não deixe de clamar a Yahweh, nosso Deus, por nós,[a] para que ele nos salve da mão dos filisteus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Não te cales por nós de clamar a Yahweh, nosso Deus”, uma construção pouco natural em português. Também pode ser traduzido: “Não pare de clamar a Yahweh, nosso Deus, por nós”.'
    reason: A construção hebraica combina “calar-se” com “por nós” e “clamar”, expressando o apelo para que Samuel não interrompa sua intercessão.
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar e pactual do hebraico sem deixar de ser compreensível em português bíblico corrente.
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: Não deixe de clamar por nós
  rationale: Expressa naturalmente em português o sentido contextual de não se calar nem interromper o clamor em favor do povo. A construção hebraica mais literal, incomum em português, é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Preserva diretamente o possessivo e o apelo pactual de Israel.
- source_word: וְיֹשִׁעֵנוּ
  choice: para que ele nos salve
  rationale: O imperfeito ligado por waw, depois do pedido, pode exprimir a finalidade ou o resultado esperado do clamor de Samuel.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: da mão dos filisteus
  rationale: Conserva a imagem hebraica da mão como poder ou domínio, sem impedir a compreensão em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração preserva essa forma e evita substituí-la silenciosamente por um título.
- issue: Relação entre o clamor de Samuel e a salvação
  choice: para que ele nos salve
  alternative: e nos salve
  rationale: A formulação preserva a finalidade esperada sem afirmar que o ato de Samuel produz mecanicamente a salvação; Yahweh continua sendo o agente que salva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi ajustada para soar natural, enquanto “filhos de Israel”, “Yahweh” e “da mão” preservam imagens e termos relevantes do hebraico.
