source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: pt
  text: Assim, os filisteus foram subjugados e não voltaram a entrar no território de Israel. E a mão de Yahweh esteve contra os filisteus[a] durante todos os dias de Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a mão de Yahweh esteve sobre os filisteus”. A expressão é uma metáfora para o poder atuante de Yahweh, aqui exercido contra eles.'
    reason: alternativa lexical e esclarecimento de expressão idiomática
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: foram subjugados
  rationale: O nifal de כנע indica que os filisteus foram dominados ou postos em sujeição após a derrota. “Foram subjugados” preserva o sentido passivo e se ajusta ao contexto militar.
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: não voltaram a entrar
  rationale: A combinação יסף + עוד nega a repetição da ação. Em português corrente, “não voltaram a entrar” expressa naturalmente que não tornaram a invadir o território.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: no território de Israel
  rationale: גְּבוּל pode designar fronteira, limite ou território. Aqui se refere à entrada em terras israelitas, não apenas à chegada a uma linha de fronteira.
- source_word: וַתְּהִי יַד יְהוָה
  choice: a mão de Yahweh esteve
  rationale: Mantém a metáfora hebraica da “mão” como manifestação do poder atuante de Deus, em vez de substituí-la por uma explicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: בַּפְּלִשְׁתִּים
  choice: contra os filisteus
  rationale: Nesse contexto de derrota e contenção militar, a preposição com a expressão “mão de Yahweh” indica ação hostil dirigida aos filisteus.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: durante todos os dias de Samuel
  rationale: Reproduz de perto a expressão temporal hebraica sem decidir além do texto se ela se refere estritamente à vida de Samuel ou ao período de sua atuação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Sentido da expressão “a mão de Yahweh esteve sobre os filisteus”
  choice: esteve contra os filisteus
  alternative: esteve sobre os filisteus
  rationale: A construção hebraica conserva a imagem da mão, enquanto “contra” comunica a força adversativa evidente no contexto. A nota registra a forma mais literal e o caráter idiomático da expressão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva-se a metáfora bíblica da mão divina e a expressão temporal deliberadamente aberta do hebraico.
