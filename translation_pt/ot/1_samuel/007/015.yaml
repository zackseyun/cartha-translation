  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ט שְׁמוּאֵל֙ אֶת יִשְׂרָאֵ֔ל כֹּ֖ל יְמֵ֥י חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/015.yaml
  text: And Samuel judged Israel all the days of his life[a].
translation:
  language: pt
  text: Samuel julgou Israel durante toda a sua vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governou Israel” ou “liderou Israel como juiz”; o verbo hebraico inclui nuances judiciais e de governo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: O Qal de שׁפט pode significar exercer a função de juiz, governar ou liderar. “Julgou” preserva a nuance judicial e a função histórica de Samuel sem restringir o verbo apenas ao governo político.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: A partícula אֶת marca o objeto direto e não recebe tradução; o nome próprio é mantido na forma portuguesa tradicional.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: durante toda a sua vida
  rationale: Expressa naturalmente em português a totalidade do período indicado pelo idioma hebraico “todos os dias de sua vida”, sem perder a ideia de duração completa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação mantém o sentido completo do idioma temporal hebraico e conserva a nuance canônica de “julgar”.
