  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: pt
  text: 'Então eles se reuniram em Mispa[a], tiraram água e a derramaram diante de Yahweh.[b] Naquele dia, jejuaram e disseram ali: “Pecamos contra Yahweh.” E Samuel julgou o povo de Israel[c] em Mispa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reuniram-se em Mispa”; a forma hebraica da primeira ocorrência contém uma terminação que indica movimento para Mispa.
    reason: lexical_alternative
  - marker: b
    text: Derramar água diante de Yahweh parece ser um ato ritual ligado ao arrependimento ou à lamentação, mas o texto não explica explicitamente seu simbolismo.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: eles se reuniram
  rationale: 'O nifal de קבץ tem aqui sentido intransitivo: o povo se ajuntou. “Reuniram-se” é natural em português e não especifica um agente externo.'
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  choice: em Mispa
  rationale: Na primeira ocorrência, a terminação direcional indica movimento para Mispa; na última, a preposição indica localização em Mispa. No texto corrido, “reuniram-se em Mispa” soa natural, enquanto a nota preserva a nuance direcional da primeira forma.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: tiraram água
  rationale: שׁאב designa o ato de tirar ou buscar água. “Tiraram água” mantém a ação concreta sem acrescentar uma fonte não mencionada, como poço ou cisterna.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: a derramaram diante de Yahweh
  rationale: O pronome “a” retoma “água”; שׁפך significa “derramar”, e לִפְנֵי é adequadamente expresso por “diante de”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: Naquele dia, jejuaram
  rationale: A formulação direta reproduz o verbo צום e a expressão temporal, com ordem natural em português.
- source_word: חָטָאנוּ לַיהוָה
  choice: Pecamos contra Yahweh
  rationale: חטא com ל expressa pecado cometido contra alguém. O pretérito perfeito é a forma idiomática de confissão em português e mantém a culpa reconhecida como fato consumado.
- source_word: וַיִּשְׁפֹּט
  choice: julgou
  rationale: שׁפט pode abranger julgar, governar e exercer liderança judicial. “Julgou” preserva a amplitude e a terminologia bíblica sem reduzir a função de Samuel a um processo judicial específico.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: o povo de Israel
  rationale: Embora a expressão seja literalmente “os filhos de Israel”, neste contexto ela designa coletivamente o povo israelita. “O povo de Israel” comunica o referente com clareza em português moderno; a forma literal é registrada em nota.
theological_decisions:
- issue: Sentido do derramamento de água
  choice: Manter literalmente a ação no texto principal, sem explicar seu simbolismo.
  alternative: Interpretá-la como sinal de arrependimento, lamentação, autoesvaziamento ou uma espécie de libação.
  rationale: O texto relata o ato ritual, mas não explica expressamente seu significado. A tradução evita impor uma interpretação teológica específica; a nota informa apenas as possibilidades gerais.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração mantém o caráter de nome próprio do Tetragrama e segue a orientação do projeto, sem substituí-lo por um título.
- issue: Alcance da função de Samuel expressa por שׁפט
  choice: julgou
  alternative: governou ou administrou justiça
  rationale: O verbo pode incluir liderança e administração da justiça. “Julgou” preserva essa tensão lexical sem escolher de modo indevido apenas uma dimensão do ofício.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “Mispa”, forma tradicional portuguesa do topônimo, e “Yahweh” para o nome divino. Mantém concisão narrativa e paralelismo verbal, sem explicar no corpo do versículo aquilo que o hebraico deixa implícito.
