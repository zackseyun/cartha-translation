base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: pt
  text: Agora, volte e vá em paz; não faça o que é mau aos olhos dos governantes filisteus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não faça nada que seja considerado errado pelos governantes filisteus”. A expressão hebraica pode indicar aquilo que eles julgariam mau ou inaceitável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Expressa tanto a ligação conclusiva de וְ quanto a força temporal e discursiva de עַתָּה em português natural.
- source_word: שׁוּב וְלֵךְ
  choice: volte e vá
  rationale: Mantém os dois imperativos hebraicos, preservando a ênfase da ordem sem reduzi-los a um único verbo.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Reproduz a expressão hebraica tradicional, que neste contexto também pode sugerir uma partida segura.
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: não faça o que é mau
  rationale: Conserva a conotação avaliativa e moral de רָע, sem restringi-la a causar dano.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva de modo claro e corrente o idioma hebraico de percepção ou julgamento.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: governantes filisteus
  rationale: Comunica em linguagem moderna que os סְרָנִים eram os altos dirigentes das cidades-Estado filisteias, evitando o sentido feudal que 'senhores' pode sugerir em português.
