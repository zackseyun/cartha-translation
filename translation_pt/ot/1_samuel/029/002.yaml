  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: pt
  text: Os governantes dos filisteus avançavam em grupos de centenas e de milhares[a], e Davi e seus homens avançavam na retaguarda, junto com Aquis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “às centenas e aos milhares”; provavelmente se refere a agrupamentos militares organizados em centenas e milhares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: governantes dos filisteus
  rationale: סֶרֶן designa os dirigentes de mais alta posição das cidades-Estado filisteias. “Governantes” comunica sua autoridade político-militar em português atual sem recorrer ao menos natural “senhores”.
- source_word: עֹבְרִים
  choice: avançavam
  rationale: O particípio retrata movimento contínuo numa formação militar. “Avançavam” é natural no contexto e preserva o aspecto progressivo.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: com suas unidades de cem e de mil homens
  rationale: A expressão provavelmente descreve a organização militar em agrupamentos de centenas e milhares. A formulação torna esse sentido inteligível, enquanto a nota preserva a forma mais literal e sua possível ambiguidade.
- source_word: אֲנָשָׁיו
  choice: seus homens
  rationale: Refere-se aos companheiros e combatentes de Davi; “seus homens” é natural e não restringe indevidamente o grupo a soldados formais.
- source_word: בָּאַחֲרֹנָה
  choice: na retaguarda
  rationale: Expressa a posição final ou traseira na coluna em marcha, com precisão espacial e militar.
- source_word: עִם אָכִישׁ
  choice: junto com Aquis
  rationale: Comunica de maneira clara a relação simples de acompanhamento expressa por עִם.
