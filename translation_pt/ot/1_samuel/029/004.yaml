  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: pt
  text: 'Mas os comandantes filisteus ficaram indignados com ele e lhe disseram: “Mande esse homem de volta, para que retorne ao lugar que você lhe designou. Que ele não desça conosco para a batalha, nem se torne nosso adversário na batalha.[a] Pois como esse homem poderia voltar a ter o favor de seu senhor?[b] Não seria com as cabeças daqueles homens?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “adversário” também pode significar “oponente”; aqui não é o nome próprio “Satanás”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “reconciliar-se com seu senhor?”. A expressão hebraica indica tornar-se novamente aceitável ao superior ou recuperar seu favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: ficaram indignados com ele
  rationale: קצף expressa ira forte; “ficaram indignados” é natural, digno e comunica intensidade sem exagerá-la.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: os comandantes filisteus
  rationale: No contexto militar imediato, שָׂרִים designa líderes ou comandantes, não necessariamente príncipes hereditários.
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: Mande esse homem de volta
  rationale: O imperativo causativo de שוב significa fazer alguém retornar; esta formulação preserva a força da ordem em português corrente.
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: para que retorne ao lugar que você lhe designou
  rationale: A sequência exprime o resultado pretendido, e הפקיד admite o sentido amplo de designar ou colocar alguém em determinado posto.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: Ele não deve descer conosco para a batalha
  rationale: Mantém o verbo espacial ירד, relevante ao movimento da campanha, em construção natural e clara.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן בַּמִּלְחָמָה
  choice: para que não se volte contra nós durante o combate
  rationale: Comunica idiomaticamente o sentido contextual de tornar-se adversário no meio da batalha; a nota registra a forma lexical hebraica.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: como esse homem poderia voltar a ter o favor de seu senhor?
  rationale: O Hitpael de רצה indica tornar-se novamente aceitável ao superior ou recuperar seu favor; a formulação esclarece esse sentido sem impor reconciliação em acepção teológica.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: Não seria à custa das cabeças destes homens?
  rationale: A expressão hebraica é elíptica e alude à obtenção do favor de Saul mediante a morte dos soldados filisteus; “à custa das cabeças” preserva a imagem e torna a implicação inteligível.
theological_decisions:
- issue: Sentido de שָׂטָן
  choice: substantivo comum com o sentido de adversário
  alternative: nome próprio “Satanás”
  rationale: Neste relato histórico, o termo descreve um oponente militar e não identifica o ser pessoal maligno; tratá-lo como nome próprio importaria uma afirmação ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” representa o singular dirigido a Aquis; “seu senhor” conserva a relação política entre Davi e Saul. A repetição de “comandantes filisteus” do hebraico foi reduzida após a coordenação para evitar peso desnecessário, sem perda de referente.
