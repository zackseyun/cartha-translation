  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: pt
  text: 'Então Aquis chamou Davi e lhe disse: “Tão certo como Yahweh vive, você é íntegro, e seu sair e entrar comigo no acampamento é bom aos meus olhos[a], pois não encontrei mal algum em você desde o dia em que veio a mim até hoje. Mas, aos olhos dos governantes filisteus[b], você não é aceitável[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua conduta comigo no acampamento é boa aos meus olhos”. O hebraico diz literalmente: “seu sair e seu entrar comigo no acampamento é bom aos meus olhos”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é um título próprio dos governantes filisteus.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “você não é bom”; isto é, não é aprovado ou bem-visto por eles.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Reproduz em português natural a força da fórmula hebraica de juramento e conserva o nome divino.
- source_word: יָשָׁר
  choice: íntegro
  rationale: Expressa retidão moral e confiabilidade pessoal de modo atual e digno.
- source_word: טוֹב בְּעֵינַי
  choice: é bom aos meus olhos
  rationale: Mantém a imagem avaliativa do hebraico sem prejudicar a compreensão em português.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: que saia e entre
  rationale: Preserva o par idiomático hebraico e sua possível referência às atividades de Davi no contexto militar; a nota esclarece o sentido mais amplo de conduta.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: comigo no acampamento
  rationale: Traduz diretamente a expressão e mantém visível o cenário militar.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: não encontrei mal algum em você
  rationale: Conserva a força moral de רָעָה e produz uma formulação idiomática em português.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: desde o dia em que veio a mim até hoje
  rationale: Transmite com naturalidade a extensão temporal exata da construção hebraica.
- source_word: הַסְּרָנִים
  choice: governantes filisteus
  rationale: Comunica claramente a função dos סְרָנִים, título distintivo dos dirigentes das cidades filisteias, sem sugerir que fossem apenas comandantes militares.
- source_word: לֹא טוֹב אָתָּה
  choice: você não é aceitável
  rationale: Explicita em português o valor contextual da expressão hebraica elíptica, sem atribuir a Davi uma avaliação moral absoluta; a nota preserva a forma mais literal.
theological_decisions:
- issue: O nome divino יְהוָה em um juramento pronunciado por um rei filisteu
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A tradução conserva o nome pessoal, sem tentar explicar por que Aquis o utiliza.
- issue: A avaliação dos governantes sobre Davi em לֹא טוֹב אָתָּה
  choice: você não é aceitável
  alternative: você não é bom
  rationale: No contexto, a frase indica que Davi não conta com a aprovação dos governantes filisteus, e não resolve a questão como um juízo teológico ou moral sobre ele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea, preserva o paralelismo hebraico quando inteligível e usa notas para registrar literalidade e ambiguidades relevantes.
