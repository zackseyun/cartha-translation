  text: וַ/יֹּֽאמְרוּ֙ שָׂרֵ֣י פְלִשְׁתִּ֔ים מָ֖ה הָ/עִבְרִ֣ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר אָכִ֜ישׁ אֶל שָׂרֵ֣י פְלִשְׁתִּ֗ים הֲ/לֽוֹא זֶ֨ה דָוִ֜ד עֶ֣בֶד שָׁא֣וּל מֶֽלֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הָיָ֤ה אִתִּ/י֙ זֶ֤ה יָמִים֙ אוֹ זֶ֣ה שָׁנִ֔ים וְ/לֹֽא מָצָ֤אתִי ב/וֹ֙ מְא֔וּמָה מִ/יּ֥וֹם נָפְל֖/וֹ עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: pt
  text: 'Então os comandantes dos filisteus perguntaram: “O que fazem estes hebreus?” Aquis respondeu aos comandantes dos filisteus: “Não é este Davi, servo de Saul, o rei de Israel, que tem estado comigo há dias ou há anos? Não encontrei nada contra ele desde o dia em que passou para o meu lado[a] até hoje.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “desde o dia de sua queda”; isto é, desde o dia em que ele passou para o lado de Aquis ou desertou.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: os comandantes dos filisteus
  rationale: No contexto militar, שָׂרִים designa dirigentes de alta patente; “comandantes” é atual, claro e adequado à cena de guerra.
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: O que estes hebreus estão fazendo aqui?
  rationale: A expressão hebraica é elíptica, literalmente algo como “Que [são] estes hebreus?”. Em português, a explicitação transmite naturalmente a pergunta hostil sobre a presença deles, sem alterar sua referência.
- source_word: הָעִבְרִים
  choice: estes hebreus
  rationale: Mantém a designação étnica usada pelos filisteus, em vez de substituí-la por “israelitas”.
- source_word: הֲלוֹא זֶה
  choice: Não é este
  rationale: Preserva a pergunta retórica que espera concordância.
- source_word: עֶבֶד
  choice: servo
  rationale: No contexto da relação político-cortesã de Davi com Saul, “servo” é mais apropriado do que “escravo”.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: há dias, ou até anos
  rationale: Reproduz de modo compreensível a formulação enfática e incomum do hebraico, indicando que a permanência pode ser contada não apenas em dias, mas em anos.
- source_word: מְאוּמָה
  choice: nada contra ele
  rationale: A palavra significa literalmente “coisa alguma”; no contexto, Aquis afirma não ter encontrado motivo de acusação ou queixa contra Davi.
- source_word: מִיּוֹם נָפְלוֹ
  choice: desde o dia em que passou para o meu lado
  rationale: נפל pode funcionar, neste contexto político-militar, como expressão de passar para o lado de alguém. A tradução evita decidir se a mudança deve ser caracterizada de forma mais carregada como deserção.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português natural para a expressão temporal hebraica, sem perda do limite enfático até o presente.
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: דָוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
theological_decisions:
- issue: Caracterização da mudança de lealdade de Davi
  choice: passou para o meu lado
  alternative: desertou
  rationale: O idioma hebraico admite a ideia de passar ou desertar para o lado de alguém. A opção no texto preserva a dimensão político-militar sem impor uma avaliação moral mais forte do ato de Davi.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A elipse da pergunta inicial foi explicitada para soar idiomática; a ambiguidade do idioma relativo à mudança de lado de Davi foi preservada por uma formulação neutra e explicada em nota.
