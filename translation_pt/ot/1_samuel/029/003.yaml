revisions:
- from: 'Então os comandantes dos filisteus perguntaram: “O que estes hebreus estão fazendo aqui?” Aquis respondeu aos comandantes dos filisteus: “Não é este Davi, servo de Saul, rei de Israel, que está comigo há dias, ou até anos? Não encontrei nada contra ele desde o dia em que passou para o meu lado[a] até hoje”.'
  to: 'Então os comandantes dos filisteus perguntaram: “O que fazem estes hebreus?” Aquis respondeu aos comandantes dos filisteus: “Não é este Davi, servo de Saul, o rei de Israel, que tem estado comigo há dias ou há anos? Não encontrei nada contra ele desde o dia em que passou para o meu lado[a] até hoje.”'
  rationale: A revisão retira a intensificação não presente em «ou até anos», reduz a expansão contextual da pergunta inicial e torna mais natural a duração da permanência de Davi. A nota conserva a ambiguidade do idiomatismo hebraico נָפְלוֹ, sem impor que a ação seja necessariamente uma deserção.
