base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: pt
  text: Agora, levante-se cedo pela manhã, você e os servos do seu senhor que vieram com você. Quando vocês se levantarem cedo pela manhã e já estiver claro[a], vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e houver luz para vocês”; também pode ser traduzido por “assim que amanhecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a instrução imediata com naturalidade, sem explicitar além do necessário o valor da conjunção.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: levante-se cedo pela manhã
  rationale: O imperativo hifil de שׁכם indica levantar-se cedo ou começar cedo; a formulação preserva tanto a ação quanto a referência temporal.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: você e os servos do seu senhor
  rationale: Torna explícita em português a coordenação entre Davi e os homens que o acompanhavam. “Senhor”, em minúscula, mantém o sentido humano de אֲדֹנֶיךָ neste contexto.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: que vieram com você
  rationale: Reproduz diretamente a oração relativa que identifica os servos acompanhantes.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: Quando vocês se levantarem cedo pela manhã
  rationale: A forma plural abrange Davi e seus acompanhantes; “quando” expressa a função temporal da sequência sem eliminar a repetição presente no hebraico.
- source_word: וְאוֹר לָכֶם
  choice: e já estiver claro
  rationale: Expressa em português natural a chegada da luz do dia, enquanto a nota registra a construção hebraica incomum e sua alternativa.
- source_word: וָלֵכוּ
  choice: vão
  rationale: Equivalente direto do imperativo plural de הלך, mantendo a ordem breve e incisiva.
