base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: pt
  text: 'Não é este Davi, sobre quem cantavam em resposta, nas danças, dizendo: “Saul derrotou os seus milhares, e Davi, as suas dezenas de milhares”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: Não é este Davi
  rationale: Preserva a forma de pergunta retórica que espera concordância e a identificação enfática de Davi.
- source_word: אֲשֶׁר יַעֲנוּ לוֹ
  choice: sobre quem cantavam em resposta umas às outras
  rationale: O verbo ענה, neste contexto festivo, descreve canto responsivo ou antifonal. A formulação explicita a reciprocidade sem reduzir o sentido a uma resposta falada.
- source_word: בַּמְּחֹלוֹת
  choice: nas danças
  rationale: Mantém o plural concreto e o cenário de dança festiva comunitária.
- source_word: הִכָּה
  choice: derrotou
  rationale: No cântico militar, נכה indica abater ou vencer inimigos. “Derrotou” comunica naturalmente a derrota em combate sem afirmar de modo desnecessário que cada indivíduo foi morto.
- source_word: בַּאֲלָפָיו
  choice: os seus milhares
  rationale: Reproduz o paralelismo numérico e o sufixo possessivo do refrão hebraico.
- source_word: בְרִבְבֹתָיו
  choice: as suas dezenas de milhares
  rationale: רבבה designa dez mil e, no plural, dezenas de milhares; esta escolha preserva o contraste quantitativo com “milhares”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura retórica natural. “Cantavam em resposta umas às outras” conserva o caráter antifonal do hebraico; “dezenas de milhares” mantém a força numérica de רבבות sem recorrer ao menos comum “miríades”.
