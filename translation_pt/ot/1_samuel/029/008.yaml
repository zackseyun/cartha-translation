base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: pt
  text: 'Davi disse a Aquis: “Mas o que foi que eu fiz? Que falta você encontrou neste seu servo, desde o dia em que entrei para o seu serviço até hoje,[a] para que eu não possa ir lutar contra os inimigos do rei, meu senhor?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o dia em que passei a estar diante de você até hoje”. Mais literalmente, o hebraico diz: “desde o dia em que estive diante de você”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “o rei, meu senhor” foi mantida como Davi a pronunciou. Suas palavras podem referir-se diretamente a Aquis ou conter uma ambiguidade intencional no contexto da narrativa.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Mas o que foi que eu fiz?
  rationale: כִּי introduz aqui o protesto de Davi em resposta à decisão anterior de Aquis. “Mas” reproduz naturalmente essa força discursiva, enquanto “o que foi que eu fiz?” expressa a ênfase da pergunta.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: Que falta você encontrou neste seu servo
  rationale: מצא com ב pode indicar a descoberta de algo censurável numa pessoa. A inclusão de “falta” explicita a acusação implícita sem alterar o sentido, e “neste seu servo” preserva a autodesignação deferente.
- source_word: בְעַבְדְּךָ
  choice: neste seu servo
  rationale: עבד, neste contexto de fala dirigida a um rei, funciona como fórmula cortês de autodesignação; “servo” mantém o registro social sem sugerir necessariamente escravidão.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: desde o dia em que entrei para o seu serviço até hoje
  rationale: A expressão significa literalmente “desde o dia em que estive diante de você”. No contexto, refere-se ao período em que Davi esteve ligado a Aquis; “entrei para o seu serviço” comunica esse valor idiomático em português corrente, com a forma literal registrada em nota.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: para que eu não possa ir lutar
  rationale: 'A oração apresenta o resultado que motiva o protesto de Davi: ser impedido de acompanhar a batalha. A formulação portuguesa transmite esse nexo de maneira natural.'
- source_word: בְּאֹיְבֵי
  choice: contra os inimigos
  rationale: Com נלחם, a preposição ב marca normalmente o adversário no combate; “lutar contra” é a correspondência idiomática clara.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: do rei, meu senhor
  rationale: אֲדֹנִי é aqui um título humano de deferência, não um título divino. A ordem “do rei, meu senhor” é natural em português e conserva a referência sem determinar além do hebraico quem Davi tinha em mente.
theological_decisions:
- issue: Referente e força retórica de “os inimigos do rei, meu senhor”
  choice: Manter a expressão tal como proferida, sem identificar de modo conclusivo o referente pretendido por Davi.
  alternative: Entendê-la exclusivamente como referência sincera a Aquis, ou como ambiguidade deliberada que permitiria outro referente no contexto narrativo.
  rationale: O hebraico não declara a intenção interior de Davi. A tradução preserva a tensão narrativa e deixa abertas as possibilidades permitidas pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O diálogo emprega “você” para representar a segunda pessoa no português corrente, enquanto “neste seu servo” e “meu senhor” preservam a deferência cortesã. As notas conservam tanto a forma mais literal da expressão temporal quanto a ambiguidade narrativa final.
