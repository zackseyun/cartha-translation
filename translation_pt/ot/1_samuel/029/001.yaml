  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְבְּצ֧וּ פְלִשְׁתִּ֛ים אֶת כָּל מַחֲנֵי/הֶ֖ם אֲפֵ֑קָ/ה וְ/יִשְׂרָאֵ֣ל חֹנִ֔ים בַּ/עַ֖יִן אֲשֶׁ֥ר בְּ/יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: pt
  text: Os filisteus reuniram todos os seus acampamentos[a] em Afeque, enquanto Israel estava acampado junto à fonte[b] que fica em Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as suas forças” ou “todos os seus exércitos”; mais literalmente, o hebraico diz “todos os seus acampamentos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nascente”; a palavra hebraica pode designar uma fonte ou nascente de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: reuniram
  rationale: קבץ descreve o ato de ajuntar ou reunir. “Reuniram” é natural em português e não especifica além do texto um procedimento militar formal.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma consagrada e amplamente compreensível do nome desse povo em português.
- source_word: כָּל מַחֲנֵיהֶם
  choice: todos os seus acampamentos
  rationale: מַחֲנֶה significa literalmente “acampamento” e, neste contexto militar, pode também designar tropas ou divisões. A tradução mantém a imagem concreta do hebraico e registra as alternativas em nota.
- source_word: אֲפֵקָה
  choice: em Afeque
  rationale: O nome geográfico é vertido pela forma portuguesa tradicional “Afeque”; o hê direcional é expresso idiomaticamente pela preposição “em”.
- source_word: וְיִשְׂרָאֵל
  choice: enquanto Israel
  rationale: A conjunção introduz uma circunstância simultânea e contrastante; “enquanto” comunica essa relação com naturalidade.
- source_word: חֹנִים
  choice: estava acampado
  rationale: Embora o particípio esteja no plural hebraico, Israel funciona como nome coletivo. O singular é natural em português, e “estava acampado” preserva o caráter circunstancial e militar.
- source_word: בַּעַיִן
  choice: junto à fonte
  rationale: עַיִן pode indicar uma nascente ou fonte de água. “Fonte” é clara e corrente, sem eliminar a alternativa “nascente”, registrada em nota.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: que fica em Jezreel
  rationale: A oração relativa localiza a fonte. “Que fica em Jezreel” expressa de modo natural a construção hebraica sem ampliar seu sentido.
