base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: pt
  text: Assim, Davi e seus homens se levantaram cedo para partir pela manhã e voltar à terra dos filisteus.[a] E os filisteus subiram[b] a Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “para ir pela manhã, para voltar à terra dos filisteus”. Os infinitivos hebraicos permitem essa tradução mais formal.'
    reason: lexical_alternative
  - marker: b
    text: '“Subiram” reproduz a expressão hebraica usada para o deslocamento a um lugar, por vezes com nuance topográfica ou militar. Outra tradução possível: “marcharam para Jezreel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: se levantaram cedo
  rationale: O hifil de שׁכם costuma indicar levantar-se ou começar a jornada cedo. A forma plural concorda naturalmente em português com o sujeito composto “Davi e seus homens”.
- source_word: הוּא וַאֲנָשָׁיו
  choice: Davi e seus homens
  rationale: A expressão identifica Davi juntamente com seu grupo de combatentes; “homens” é natural e não os apresenta indevidamente como servos domésticos.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: para partir pela manhã e voltar
  rationale: “Partir” comunica o ato de sair do acampamento, enquanto “voltar” preserva a finalidade do movimento. A menção explícita à manhã é mantida apesar da proximidade de “cedo”, pois ambas aparecem no hebraico.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: à terra dos filisteus
  rationale: Mantém o substantivo concreto “terra” e a designação étnica, referindo-se de modo geral ao território filisteu.
- source_word: עָלוּ
  choice: subiram
  rationale: Preserva o verbo hebraico עלה e sua possível nuance topográfica ou militar, sem explicitar além do texto que eles marcharam.
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
