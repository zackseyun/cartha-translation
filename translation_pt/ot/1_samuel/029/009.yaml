base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: pt
  text: 'Aquis respondeu a Davi: “Eu sei que você é bom aos meus olhos, como um anjo de Deus.[a] No entanto, os comandantes dos filisteus disseram: ‘Ele não deve ir conosco à batalha.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um mensageiro de Deus”. A palavra hebraica מַלְאָךְ pode significar tanto “mensageiro” como “anjo”, embora “anjo de Deus” seja o sentido mais natural nesta expressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: Em português, a fórmula hebraica literalmente redundante “respondeu e disse” é expressa de modo natural pelo verbo “respondeu”, sem perda da função narrativa de introduzir a réplica.
- source_word: יָדַעְתִּי
  choice: Eu sei
  rationale: O perfeito indica aqui a avaliação firme de Aquis no momento da fala; o presente português comunica isso naturalmente.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: você é bom aos meus olhos
  rationale: Preserva a imagem avaliativa hebraica “aos meus olhos” e a amplitude de טוֹב, sem restringi-la a lealdade, inocência ou favor.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: como um anjo de Deus
  rationale: מַלְאָךְ pode designar mensageiro ou anjo; nesta expressão, “anjo de Deus” é a leitura contextual mais natural. A alternativa lexical é registrada em nota.
- source_word: אַךְ
  choice: No entanto
  rationale: Marca claramente o contraste concessivo entre a avaliação favorável de Aquis e a decisão dos comandantes filisteus.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: os comandantes dos filisteus
  rationale: No contexto militar, “comandantes” comunica melhor a função dos שָׂרִים do que “príncipes” ou “senhores”.
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: Ele não irá conosco à batalha
  rationale: O imperfeito em discurso citado expressa a decisão proibitiva dos líderes. Em português, o futuro negativo transmite essa determinação com naturalidade; “à batalha” conserva o destino militar sem reproduzir de modo artificial o movimento ascendente de עלה.
theological_decisions:
- issue: Sentido de מַלְאַךְ אֱלֹהִים na comparação feita por Aquis
  choice: “como um anjo de Deus”, entendido como comparação retórica de elevada estima
  alternative: “como um mensageiro de Deus”
  rationale: A construção é explicitamente comparativa e expressa a alta consideração de Aquis por Davi, sem fazer uma afirmação ontológica sobre ele. A ambiguidade lexical de מַלְאָךְ é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea; evita arcaísmos e preserva o idioma hebraico “aos meus olhos”. O marcador [a] aparece após a expressão a que se refere.
