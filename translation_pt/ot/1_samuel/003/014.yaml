reference: 1 Samuel 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: pt
  text: 'Por isso, jurei a respeito da casa de Eli: a iniquidade da casa de Eli jamais será expiada por sacrifício ou oferta[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a iniquidade da casa de Eli certamente não será expiada”. Depois de “jurei”, o hebraico emprega uma fórmula de juramento com “se” para expressar forte negação.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida por “oferta” muitas vezes se refere especificamente a uma oferta de cereais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a consequência do anúncio de juízo anterior e preserva a força inferencial do hebraico.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei
  rationale: O perfeito hebraico apresenta o juramento divino como ato concluído e solene; em português, o pretérito perfeito é natural e seu efeito vigente fica claro pelo contexto.
- source_word: לְבֵית עֵלִי
  choice: a respeito da casa de Eli
  rationale: A preposição marca o alvo ou assunto do juramento. Esta formulação evita sugerir que o juramento foi dirigido verbalmente à família, sem antecipar além do texto a ideia de hostilidade.
- source_word: אִם
  choice: jamais será
  rationale: Depois de um verbo de juramento, אִם integra uma fórmula de forte negação, não uma condição comum. “Jamais” comunica essa força idiomática em português.
- source_word: יִתְכַּפֵּר
  choice: será expiada
  rationale: A forma verbal tem sentido passivo e se refere à remoção sacrificial da culpa; “expiada” preserva com clareza o teor cultual e teológico.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: עָוֹן pode abranger tanto a transgressão quanto a culpa decorrente dela. “Iniquidade” conserva a gravidade e parte dessa amplitude.
- source_word: בֵּית עֵלִי
  choice: casa de Eli
  rationale: “Casa” mantém o sentido dinástico e familiar da expressão hebraica, comum e compreensível no registro bíblico em português.
- source_word: בְּזֶבַח
  choice: por sacrifício
  rationale: A preposição indica o meio pelo qual se buscaria a expiação; “por” expressa isso de forma direta.
- source_word: וּבְמִנְחָה
  choice: ou oferta
  rationale: Embora מִנְחָה frequentemente designe uma oferta de cereais no contexto cultual, “oferta” preserva a possível amplitude lexical; a acepção mais específica consta em nota.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: No contexto da negação juramentada, a expressão indica permanência. “Jamais” reúne naturalmente em português a negação enfática e a duração ilimitada.
theological_decisions:
- issue: Alcance do juízo sobre a casa de Eli
  choice: O texto afirma que sacrifício ou oferta jamais expiarão a iniquidade da casa de Eli.
  alternative: Entender a declaração como uma negação absoluta de toda e qualquer possibilidade de misericórdia ou perdão divino.
  rationale: O versículo exclui explicitamente a eficácia dos meios cultuais mencionados. A tradução não amplia essa afirmação para resolver questões sobre a misericórdia divina que o próprio texto não aborda.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa de Eli” conserva o sentido familiar e dinástico; “expiada” mantém a precisão sacrificial sem acrescentar conclusões doutrinárias alheias ao versículo.
