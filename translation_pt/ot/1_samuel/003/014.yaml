  source_fidelity: A tradução reproduz adequadamente a inferência de וְלָכֵן, o caráter solene e consumado do juramento, a fórmula hebraica de negação enfática após juramento e a permanência expressa por עַד־עוֹלָם. “A respeito da casa de Eli” é uma representação prudente de לְבֵית עֵלִי, sem introduzir uma interpretação além do texto. “Será expiada por sacrifício ou oferta” transmite com precisão o sentido cultual passivo de יִתְכַּפֵּר e os meios indicados por בְּזֶבַח וּבְמִנְחָה.
