  text: וּ/שְׁמוּאֵ֕ל טֶ֖רֶם יָדַ֣ע אֶת יְהוָ֑ה וְ/טֶ֛רֶם יִגָּלֶ֥ה אֵלָ֖י/ו דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: pt
  text: Samuel ainda não conhecia[a] Yahweh[b], e a palavra de Yahweh ainda não lhe havia sido revelada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ainda não reconhecia”. O verbo hebraico traduzido como “conhecia” pode indicar conhecimento experiencial ou relacional, especialmente em conexão com a revelação divina.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido como “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: ainda não
  rationale: Expressa naturalmente em português um estado ou acontecimento que, naquele ponto da narrativa, ainda não se havia realizado.
- source_word: יָדַע אֶת־יְהוָה
  choice: conhecia Yahweh
  rationale: Mantém o verbo hebraico amplo, que neste contexto pode indicar conhecimento relacional ou reconhecimento decorrente de uma experiência de revelação, sem reduzi-lo a mera informação factual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יִגָּלֶה
  choice: havia sido revelada
  rationale: Reproduz o sentido passivo do nifal de גלה e, com o mais-que-perfeito composto, apresenta a revelação como ainda não ocorrida naquele momento passado.
- source_word: אֵלָיו
  choice: lhe
  rationale: O pronome indireto é uma forma clara e natural de expressar em português ‘a ele’.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a expressão profética hebraica e sua ressonância bíblica, sem interpretá-la de modo mais restrito como apenas ‘mensagem’.
- source_word: וּשְׁמוּאֵל
  choice: Samuel
  rationale: O waw introduz aqui uma explicação narrativa; em português, a transição é natural sem acrescentar um marcador temporal inexistente no hebraico.
theological_decisions:
- issue: Sentido de Samuel ainda não conhecer Yahweh
  choice: Manter ‘conhecia’ no texto e esclarecer em nota sua possível dimensão experiencial ou relacional ligada à revelação profética.
  alternative: Traduzir diretamente como ‘ainda não reconhecia Yahweh’ ou entender que Samuel ignorava completamente quem era Yahweh.
  rationale: A oração paralela sobre a palavra de Yahweh ainda não lhe ter sido revelada orienta o sentido para a falta de experiência ou reconhecimento profético direto. Contudo, o verbo hebraico continua amplo, por isso a tradução não transforma essa leitura contextual em uma afirmação mais específica que o original.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A repetição de “Yahweh” e a expressão “a palavra de Yahweh” preservam a forma e a ênfase do hebraico.
