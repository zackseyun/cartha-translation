- source_word: כִּי
  choice: porque
  rationale: Aqui introduz a razão pela qual Samuel foi até Eli, preservando o nexo causal explícito do hebraico.
- source_word: שׁוּב שְׁכָב
  choice: Volte e deite-se
  rationale: Reproduz os dois imperativos hebraicos de modo claro e natural em português.
- source_word: וַיֵּלֶךְ וַיִּשְׁכָּב
  choice: Então Samuel voltou e se deitou
  rationale: O nome é explicitado para clareza em português; 'voltou' comunica naturalmente o retorno implícito no contexto, embora o primeiro verbo signifique literalmente 'foi'.
