  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: pt
  text: 'Ele correu até Eli e disse: “Aqui estou, porque o senhor me chamou”. Mas Eli respondeu: “Eu não chamei. Volte e deite-se”. Então Samuel foi e se deitou.'
