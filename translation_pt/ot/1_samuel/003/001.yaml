id: 1SA.3.1
reference: 1 Samuel 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: pt
  text: O menino Samuel servia a Yahweh na presença de Eli. Naqueles dias, a palavra de Yahweh era rara, e as visões não eram comuns[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia visões frequentes” ou “a visão não irrompia”. A expressão hebraica indica que as visões reveladoras eram incomuns e não se manifestavam amplamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: O menino
  rationale: הַנַּעַר designa um menino ou jovem. No estágio narrativo de Samuel, “menino” é a opção mais adequada. O וְ inicial funciona como conexão narrativa e não exige uma conjunção explícita em português.
- source_word: מְשָׁרֵת אֶת־יְהוָה
  choice: servia a Yahweh
  rationale: O particípio מְשָׁרֵת indica atividade contínua. “Servia” comunica isso com naturalidade e mantém, no contexto do santuário, a dimensão religiosa do serviço. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: לִפְנֵי עֵלִי
  choice: na presença de Eli
  rationale: לִפְנֵי significa literalmente “diante de/na presença de”. A formulação preserva a imagem hebraica e permite a noção contextual de que Samuel servia sob a supervisão de Eli, sem transformá-la numa interpretação explícita.
- source_word: וּדְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Tradução transparente da construção hebraica, preservando a expressão teológica para a revelação divina.
- source_word: יָקָר
  choice: era rara
  rationale: Embora יָקָר também possa significar “preciosa” ou “valiosa”, o paralelo com a falta de visões indica aqui escassez.
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Equivalente temporal natural em português; sua colocação no início da segunda frase melhora a fluidez sem alterar o sentido.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: as visões não eram comuns
  rationale: חָזוֹן refere-se à visão reveladora e pode ter sentido coletivo. נִפְרָץ sugere algo que irrompe ou se difunde; no contexto, a expressão indica que tais visões não ocorriam com frequência nem se manifestavam amplamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama. “Yahweh” preserva o nome pactual em forma amplamente reconhecida, em vez de substituí-lo por um título.
- issue: Sentido de יָקָר aplicado à palavra de Yahweh
  choice: rara
  alternative: preciosa
  rationale: A cláusula paralela sobre a ausência de visões frequentes favorece o sentido de escassez. A tradução não exclui associações de valor, mas expressa o sentido contextual predominante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases e a antecipação de “Naqueles dias” evitam uma sequência excessivamente coordenada. “Na presença de Eli” mantém a formulação espacial do hebraico sem explicitar além do texto a ideia de supervisão.
