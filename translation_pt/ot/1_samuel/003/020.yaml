  source_fidelity: 'A tradução preserva adequadamente o sentido do hebraico: o conhecimento/reconhecimento público de todo Israel, a extensão geográfica expressa por «desde Dã até Berseba» e a autenticação de Samuel em sua função profética. «Estava confirmado como profeta de Yahweh» é uma formulação bíblica compreensível para o particípio nifal נֶאֱמָן e condiz com o contexto imediato.'
