source:
  edition: WLC
  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: pt
  text: Todo o Israel, desde Dã até Berseba, reconheceu que Samuel estava confirmado como profeta de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava estabelecido como profeta de Yahweh”. O termo hebraico pode transmitir a ideia de alguém que se mostrou digno de confiança, foi estabelecido ou foi confirmado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: reconheceu
  rationale: O verbo ידע aqui descreve o conhecimento público, por todo o Israel, da autenticidade do ministério profético de Samuel. “Reconheceu” comunica esse sentido melhor do que o simples “soube”.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva nacional do hebraico em uma formulação bíblica natural em português.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: desde Dã até Berseba
  rationale: Preserva os topônimos e o merismo geográfico que abrange a terra de norte a sul, sem substituí-lo por uma paráfrase.
- source_word: כִּי
  choice: que
  rationale: Introduz naturalmente em português o conteúdo daquilo que todo o Israel reconheceu.
- source_word: נֶאֱמָן
  choice: estava confirmado
  rationale: O particípio nifal de אמן pode indicar algo comprovado, estabelecido ou digno de confiança. No contexto, o cumprimento das palavras de Samuel confirma publicamente sua condição de profeta.
- source_word: לְנָבִיא
  choice: como profeta
  rationale: A preposição לְ marca aqui função ou condição; “como profeta” expressa isso de modo conciso e natural.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: A relação expressa pela preposição é a de Samuel como profeta pertencente a, comissionado por e representante de Yahweh; “de Yahweh” é idiomático e preserva o nome divino.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de נֶאֱמָן na condição profética de Samuel
  choice: estava confirmado como profeta
  alternative: estava estabelecido como profeta; mostrou-se digno de confiança como profeta
  rationale: O contexto imediato salienta que as palavras de Samuel se cumpriam, autenticando publicamente seu ministério. A tradução escolhida preserva essa força sem introduzir uma noção técnica posterior de ordenação, enquanto a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Dã” e “Berseba” seguem formas portuguesas correntes; a estrutura geográfica do hebraico foi preservada.
