  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: pt
  text: Naquele dia, Eli estava deitado em seu lugar, e seus olhos[a] haviam começado a enfraquecer; ele não conseguia enxergar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seu olho havia começado a enfraquecer». A forma hebraica pode ser entendida coletivamente como referência à visão, daí «seus olhos» no texto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[incorporado à abertura narrativa, sem expressão autônoma]'
  rationale: A forma narrativa de היה com waw introduz a circunstância. Em português atual, acrescentar «aconteceu que» seria pesado e desnecessário neste contexto.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Tradução direta e natural da expressão temporal formada pela preposição, o substantivo e o demonstrativo.
- source_word: שֹׁכֵב
  choice: estava deitado
  rationale: O particípio descreve o estado contínuo de Eli e combina naturalmente com o cenário noturno.
- source_word: בִּמְקֹמוֹ
  choice: em seu lugar
  rationale: Preserva o sentido amplo de מָקוֹם sem especificar indevidamente «quarto» ou outro local.
- source_word: וְעֵינוֹ
  choice: seus olhos
  rationale: Embora a forma possa ser entendida literalmente no singular, a referência coletiva à visão é expressa com naturalidade pelo plural em português.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: haviam começado a enfraquecer
  rationale: Mantém tanto o aspecto inicial de «começar» quanto a perda progressiva da capacidade visual.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: ele já não conseguia enxergar
  rationale: Expressa de modo claro e idiomático a incapacidade resultante; «já não» evidencia a mudança de condição sem acrescentar uma causa.
