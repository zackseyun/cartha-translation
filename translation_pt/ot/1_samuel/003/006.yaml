base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: pt
  text: 'Então o SENHOR chamou Samuel outra vez. Samuel se levantou, foi até Eli e disse: “Aqui estou, pois o senhor me chamou”. Mas Eli respondeu: “Eu não chamei, meu filho. Volte e deite-se”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino com SENHOR em versaletes, sem inserir uma vocalização discutida no corpo do texto.
- source_word: עוֹד
  choice: outra vez
  rationale: Expressa naturalmente a repetição indicada pelo hebraico.
- source_word: הִנְנִי
  choice: Aqui estou
  rationale: Equivalente idiomático e tradicional para a fórmula hebraica de disponibilidade ou resposta à chamada.
- source_word: כִּי
  choice: pois
  rationale: 'Mantém o valor causal da conjunção: Samuel foi a Eli porque julgava ter sido chamado por ele.'
- source_word: שׁוּב שְׁכָב
  choice: Volte e deite-se
  rationale: Reproduz os dois imperativos de modo claro e natural em português.
theological_decisions:
- issue: Representação do Tetragrama
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção bíblica portuguesa mais difundida e conserva a identificação do nome divino por meio da forma gráfica, sem decidir no texto principal a pronúncia histórica.
- issue: Referente do sujeito na resposta final
  choice: Eli respondeu
  alternative: ele respondeu
  rationale: O hebraico usa apenas a forma verbal, mas explicitar Eli evita ambiguidade involuntária em português sem alterar o referente contextual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa direta. Emprega “o senhor” na fala de Samuel para marcar de forma natural o tratamento respeitoso dirigido a Eli e distingui-lo de “o SENHOR”, o nome divino.
