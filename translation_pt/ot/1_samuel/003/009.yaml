source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: pt
  text: 'Então Eli disse a Samuel: “Vá, deite-se e, se ele chamar você, diga: ‘Fala, Yahweh[a], pois o teu servo está ouvindo.’” Então Samuel foi e se deitou no seu lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH, aqui transliterado “Yahweh”. Muitas traduções o representam por “SENHOR”.
    reason: Explica a forma adotada para o tetragrama e registra a alternativa tradicional.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Eli disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: לֵךְ שְׁכָב
  choice: Vá, deite-se
  rationale: Preserva os dois imperativos sucessivos e sua concisão, sem acrescentar a ideia explícita de dormir.
- source_word: וְהָיָה אִם
  choice: Se
  rationale: Introduz de modo idiomático a condição expressa pelo hebraico, sem transformá-la em certeza temporal com “quando”.
- source_word: יִקְרָא אֵלֶיךָ
  choice: ele chamar você
  rationale: Mantém o sujeito masculino implícito, identificável pelo contexto, e traduz a ação de chamar dirigida a Samuel em português corrente.
- source_word: וְאָמַרְתָּ
  choice: diga
  rationale: O verbo constitui a instrução consequente à condição; o imperativo português transmite claramente essa força diretiva.
- source_word: דַּבֵּר
  choice: Fala
  rationale: Imperativo direto dirigido a Yahweh. A forma de segunda pessoa concorda com “teu servo” e preserva o tom pessoal da fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo silenciosamente por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de forma concisa e digna a razão do pedido.
- source_word: שֹׁמֵעַ
  choice: está ouvindo
  rationale: O particípio indica uma atitude presente e contínua de atenção e disponibilidade.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: Neste contexto, é uma autodesignação reverente diante de Deus; “servo” é mais adequado do que “escravo”.
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: Então Samuel foi e se deitou
  rationale: Reproduz a progressão dos verbos narrativos e mostra que Samuel cumpriu a instrução.
- source_word: בִּמְקוֹמוֹ
  choice: no seu lugar
  rationale: Segue de perto o hebraico sem acrescentar que esse seria seu lugar habitual ou exclusivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio, enquanto a nota registra a convenção tradicional sem inseri-la no texto principal.
- issue: Sujeito implícito de יִקְרָא
  choice: ele chamar você
  alternative: alguém chamar você
  rationale: Embora o sujeito não seja expresso no verbo hebraico, o contexto imediato mostra que Eli reconheceu Yahweh como aquele que chamava. O pronome mantém essa inferência sem repetir o nome divino.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem perder ampla inteligibilidade internacional. A fala combina as formas “Fala” e “teu”, coerentes entre si na segunda pessoa, enquanto a narração e a instrução de Eli usam formas correntes no português brasileiro.
