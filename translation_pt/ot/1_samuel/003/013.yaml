  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: pt
  text: 'Eu lhe declarei que estou julgando a sua casa para sempre, por causa da iniquidade que ele conhecia: seus filhos atraíam maldição sobre si mesmos[a], e ele não os conteve.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns testemunhos antigos e muitas traduções refletem uma leitura alternativa: “seus filhos amaldiçoavam a Deus” ou “blasfemavam”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: Eu lhe declarei
  rationale: O hifil de נגד expressa tornar conhecido ou declarar. O pretérito perfeito comunica uma declaração já feita, ainda vigente no contexto.
- source_word: שֹׁפֵט אֲנִי
  choice: estou julgando
  rationale: O particípio acompanhado do pronome explícito transmite ação em curso ou iminente, preservando a solenidade e a urgência do anúncio.
- source_word: בֵּיתוֹ
  choice: a sua casa
  rationale: Mantém o amplo idioma hebraico, que pode abranger tanto a família imediata quanto a linhagem de Eli.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressa duração permanente ou indefinidamente duradoura em linguagem portuguesa clara e solene.
- source_word: בַּעֲוֺן
  choice: por causa da iniquidade
  rationale: עָוֹן pode designar tanto o ato perverso quanto a culpa dele resultante; “iniquidade” preserva esse peso moral.
- source_word: אֲשֶׁר יָדַע
  choice: da qual ele tinha conhecimento
  rationale: Torna natural em português a ideia de conhecimento culpável, sem acrescentar que Eli aprovava o comportamento.
- source_word: מְקַלְלִים לָהֶם
  choice: atraíam maldição sobre si mesmos
  rationale: Representa o sentido natural do texto consonantal massorético, literalmente relacionado a amaldiçoar ou trazer maldição para si, sem inserir no texto principal a leitura alternativa referente a Deus.
- source_word: וְלֹא כִהָה בָּם
  choice: e ele não os conteve
  rationale: O verbo pode significar enfraquecer, embotar ou reprimir; no contexto, comunica que Eli não refreou eficazmente seus filhos.
theological_decisions:
- issue: Se a ofensa dos filhos deve seguir o texto massorético ou a leitura alternativa preservada por testemunhos antigos
  choice: O texto principal diz “atraíam maldição sobre si mesmos”.
  alternative: “amaldiçoavam a Deus” ou “blasfemavam”.
  rationale: A formulação principal segue prioritariamente o texto hebraico consonantal e conserva sua dificuldade; a variante antiga e teologicamente significativa é apresentada em nota, sem ser silenciada.
- issue: Alcance do juízo sobre a “casa” de Eli
  choice: Mantém-se “a sua casa” sem especificar o alcance.
  alternative: “a sua família” ou “a sua linhagem”.
  rationale: O idioma hebraico pode incluir o núcleo familiar e a descendência duradoura; especificar apenas um desses sentidos reduziria a ambiguidade do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo o aspecto verbal, o idioma “casa” e a tensão da difícil leitura hebraica.
