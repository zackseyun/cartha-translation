  text: וַ/יַּגֶּד ל֤/וֹ שְׁמוּאֵל֙ אֶת כָּל הַ/דְּבָרִ֔ים וְ/לֹ֥א כִחֵ֖ד מִמֶּ֑/נּוּ וַ/יֹּאמַ֕ר יְהוָ֣ה ה֔וּא הַ/טּ֥וֹב בְּ/עֵינָ֖/ו יַעֲשֶֽׂה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: pt
  text: 'Então Samuel lhe contou tudo e não lhe ocultou nada. Ele disse: “Ele é Yahweh; que faça[a] o que é bom aos seus olhos[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele fará”. O imperfeito hebraico pode ser entendido como um desejo submisso (“que faça”) ou como futuro simples.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “aos seus olhos”, expressão que significa segundo o seu próprio juízo ou conforme lhe parece bom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: Samuel lhe contou
  rationale: O hifil de נגד significa contar, comunicar ou dar a conhecer. “Contou” é natural em português e se ajusta à comunicação direta de Samuel a Eli.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: todas as palavras
  rationale: Mantém a correspondência lexical com דְּבָרִים, que pode significar “palavras” ou “coisas”, e aqui se refere à mensagem recebida por Samuel.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: e não lhe ocultou nada
  rationale: כחד expressa ocultar ou reter. A formulação preserva tanto o destinatário quanto a totalidade enfática da revelação feita por Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: הוּא
  choice: Ele é
  rationale: Conserva o pronome hebraico enfático e a identificação explícita de Yahweh como aquele que falou e agirá.
- source_word: הַטּוֹב
  choice: o que é bom
  rationale: Representa diretamente o adjetivo substantivado e deixa a expressão seguinte indicar de quem é a avaliação.
- source_word: בְּעֵינָיו
  choice: aos seus olhos
  rationale: Preserva o idioma hebraico, compreensível em português, que significa aquilo que parece bom ou correto segundo o próprio juízo de alguém.
- source_word: יַעֲשֶׂה
  choice: que faça
  rationale: No contexto, o imperfeito pode ter força volitiva e expressar a submissão de Eli. A nota mantém disponível a leitura como futuro simples.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto traz o nome pessoal divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Força de יַעֲשֶׂה na resposta de Eli
  choice: 'expressão volitiva de submissão: “que faça”'
  alternative: 'declaração futura: “ele fará”'
  rationale: A reação de Eli favorece uma aceitação resignada, mas a forma hebraica também admite valor futuro; essa ambiguidade é explicitada em nota.
- issue: Sentido de בְּעֵינָיו
  choice: manter o idioma “aos seus olhos”
  alternative: “como lhe parecer melhor”
  rationale: A expressão literal preserva a perspectiva do juízo divino sem explicar demais no corpo do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conservam-se o nome divino “Yahweh” e o idioma hebraico “aos seus olhos”; a ambiguidade verbal do enunciado final é preservada por nota.
