base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: pt
  text: 'Então Eli chamou Samuel e disse: “Samuel, meu filho.” E ele disse: “Aqui estou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto narrativo, קרא indica que Eli chamou Samuel verbalmente. “Chamou” é natural, conciso e não acrescenta a ideia mais específica de convocação formal.
- source_word: עֵלִי
  choice: Eli
  rationale: O nome pessoal é transliterado segundo a forma consagrada em português.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: A partícula de objeto direto אֶת não recebe representação própria em português; o nome segue a forma tradicional.
- source_word: וַיֹּאמֶר
  choice: disse / respondeu
  rationale: אמר é o verbo narrativo comum de fala. Na primeira ocorrência, “disse” reproduz diretamente seu valor; na segunda, “respondeu” expressa naturalmente em português a função da fala de Samuel no diálogo, sem alterar o conteúdo.
- source_word: שְׁמוּאֵל בְּנִי
  choice: Samuel, meu filho
  rationale: בְּנִי significa literalmente “meu filho” e funciona aqui como tratamento afetuoso ou relacional de Eli para com Samuel. A tradução preserva tanto o sentido lexical quanto o tom.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: הִנֵּנִי é uma resposta hebraica convencional que comunica presença e prontidão. “Aqui estou” conserva essa força idiomática em português.
- source_word: וַ
  choice: Então
  rationale: A sequência narrativa introduzida pelo waw consecutivo é expressa naturalmente por “Então” no início do versículo; a ligação posterior é representada pela continuidade sintática do diálogo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o conteúdo do hebraico foram preservados, enquanto “respondeu” evita uma repetição pouco natural de “disse” e explicita apenas a função discursiva evidente.
