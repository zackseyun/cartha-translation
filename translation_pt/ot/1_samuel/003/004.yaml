  text: וַ/יִּקְרָ֧א יְהוָ֛ה אֶל שְׁמוּאֵ֖ל וַ/יֹּ֥אמֶר הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/004.yaml
  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: pt
  text: 'Então Yahweh[a] chamou Samuel, e ele disse: “Aqui estou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, vertido aqui como “Yahweh”; “Jeová” é uma forma alternativa tradicional.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O qal wayyiqtol de קרא dá continuidade à narrativa e, neste contexto, descreve um chamado audível; “chamou” é natural e fiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: אֶל שְׁמוּאֵל
  choice: Samuel
  rationale: Com o verbo português “chamar”, o destinatário pode aparecer diretamente, sem a preposição hebraica אֶל; o nome segue a forma portuguesa consagrada.
- source_word: וַיֹּאמֶר
  choice: e ele respondeu
  rationale: Embora אמר signifique literalmente “disse”, “respondeu” explicita naturalmente a função da fala de Samuel no diálogo. O pronome preserva a referência contextual a Samuel.
- source_word: הִנֵּנִי
  choice: Aqui estou!
  rationale: Equivalente idiomático da fórmula hebraica de presença e prontidão, mantendo um registro bíblico digno e corrente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e é uma transliteração amplamente aceita, enquanto a nota registra a alternativa tradicional.
- issue: Identidade do sujeito de וַיֹּאמֶר
  choice: Samuel é o referente de “ele”
  alternative: Repetir explicitamente “Samuel”
  rationale: O hebraico deixa o sujeito implícito, mas o contexto mostra que a fala “Aqui estou!” é a resposta de Samuel. O pronome mantém a fluidez sem acrescentar uma identificação além do contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Então” marca a progressão narrativa; a exclamação comunica a prontidão presente na fórmula hebraica sem exagerar seu sentido.
