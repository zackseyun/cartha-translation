  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל הִנֵּ֧ה אָנֹכִ֛י עֹשֶׂ֥ה דָבָ֖ר בְּ/יִשְׂרָאֵ֑ל אֲשֶׁר֙ כָּל שֹׁ֣מְע֔/וֹ תְּצִלֶּ֖ינָה שְׁתֵּ֥י אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: pt
  text: 'Então o SENHOR disse a Samuel: “Eis que estou para fazer algo em Israel que fará os ouvidos de todos os que ouvirem falar disso tinirem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: Expressa naturalmente a progressão narrativa do hebraico.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa tradicional para o nome divino, em versalete textual.
- source_word: הִנֵּה
  choice: Veja
  rationale: Preserva a função de chamar a atenção para o anúncio iminente em linguagem corrente.
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: estou para fazer algo
  rationale: O particípio com הִנֵּה apresenta a ação como iminente; 'algo' traduz דָבָר sem especificar além do texto.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: fará retinir os dois ouvidos
  rationale: Mantém a imagem corporal forte do hebraico e sua construção causativa no contexto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma convencional evita impor uma vocalização reconstruída, sem obscurecer que o texto traz o nome divino.
- issue: Natureza do que Deus fará
  choice: algo
  alternative: uma coisa
  rationale: Preserva a generalidade de דָבָר e não antecipa nem suaviza o conteúdo do juízo revelado nos versículos seguintes.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão proverbial dos ouvidos foi mantida de modo vívido, sem explicação inserida no corpo do versículo.
