  text: בַּ/יּ֤וֹם הַ/הוּא֙ אָקִ֣ים אֶל עֵלִ֔י אֵ֛ת כָּל אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל בֵּית֑/וֹ הָחֵ֖ל וְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: pt
  text: Naquele dia, cumprirei contra Eli tudo o que falei a respeito da casa dele[a], do começo ao fim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “casa” pode significar a família, a linhagem ou a casa sacerdotal de Eli.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “começando e terminando”, expressão que indica cumprimento completo.'
    reason: translation_clarity
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal natural em português, preservando a referência a um dia futuro específico.
- source_word: אָקִים
  choice: cumprirei
  rationale: O hifil de קום, tendo por objeto tudo o que Deus falou, indica fazer a palavra anunciada permanecer, realizar-se ou cumprir-se.
- source_word: אֶל עֵלִי
  choice: contra Eli
  rationale: Embora אֶל costume significar “a/para”, o contexto de juízo favorece a direção adversativa “contra”, sem alterar o objeto da ação divina.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: tudo o que falei
  rationale: Reproduz de modo claro a abrangência de כָּל אֲשֶׁר e o sentido verbal de דבר.
- source_word: אֶל בֵּיתוֹ
  choice: a respeito da casa dele
  rationale: Com דבר, אֶל pode indicar o assunto da fala; “a respeito de” comunica essa relação naturalmente.
- source_word: בֵּיתוֹ
  choice: a casa dele
  rationale: Mantém a amplitude de בַּיִת, que pode abranger família, descendência e casa sacerdotal, sem restringir o sentido no texto principal.
- source_word: הָחֵל וְכַלֵּה
  choice: do começo ao fim
  rationale: 'A expressão combinada comunica totalidade e conclusão: tudo o que foi anunciado será integralmente executado.'
theological_decisions:
- issue: Alcance do juízo sobre Eli e sua casa
  choice: Preservar “a casa dele” como designação ampla da casa familiar e sacerdotal de Eli.
  alternative: Restringir a expressão à família imediata de Eli ou ampliá-la explicitamente para toda a instituição sacerdotal.
  rationale: O hebraico בֵּיתוֹ comporta família, linhagem e casa sacerdotal. A formulação escolhida mantém essa amplitude e evita resolver no texto uma questão que o termo original deixa aberta.
- issue: Relação de אָקִים e אֶל עֵלִי
  choice: “cumprirei contra Eli”
  alternative: “cumprirei para Eli” ou “farei cumprir sobre Eli”
  rationale: O contexto é de juízo, por isso “contra” expressa a direção adversa da palavra anunciada; a nota preserva a possibilidade de uma tradução mais formal da construção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cumprirei contra Eli” conserva o tom judicial e a ligação com a palavra divina anteriormente anunciada; “casa” preserva a amplitude do hebraico.
