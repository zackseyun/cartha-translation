  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: pt
  text: E Yahweh continuou a aparecer em Siló, pois Yahweh se revelou a Samuel em Siló por meio da palavra de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela palavra de Yahweh”.'
    reason: alternativa lexical para a expressão instrumental בִּדְבַר יְהוָה
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: continuou
  rationale: A construção יָסַף com infinitivo indica continuação ou repetição; “continuou” expressa naturalmente a ação reiterada no contexto.
- source_word: לְהֵרָאֹה
  choice: a aparecer
  rationale: O nifal de ראה denota aqui uma manifestação perceptível; “aparecer” é claro, natural e não especifica além do texto o modo dessa manifestação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: em Siló
  rationale: A preposição ב tem sentido locativo; “em Siló” é a formulação natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, ligação que “pois” conserva de modo claro.
- source_word: נִגְלָה
  choice: se revelou
  rationale: O nifal de גלה comunica manifestação ou autodesvelamento. “Se revelou” mantém uma distinção lexical em relação a “aparecer” sem definir indevidamente a modalidade.
- source_word: אֶל שְׁמוּאֵל
  choice: a Samuel
  rationale: Representa de modo direto e idiomático a relação indicada pela preposição אֶל.
- source_word: בִּדְבַר יְהוָה
  choice: por meio da palavra de Yahweh
  rationale: Entende בְּ em sentido instrumental e explicita esse valor em português corrente, preservando “palavra de Yahweh” como o meio da revelação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Natureza da manifestação divina
  choice: Manter tanto “aparecer” como “se revelar ... por meio da palavra”, sem definir o modo exato
  alternative: Interpretar a manifestação como exclusivamente visionária ou necessariamente corporal
  rationale: O hebraico combina linguagem de aparição e de revelação pela palavra. A tradução conserva ambas as expressões e não resolve uma questão que o versículo deixa aberta.
- issue: Valor de בְּ em בִּדְבַר יְהוָה
  choice: 'Instrumental: “por meio da palavra de Yahweh”'
  alternative: “pela palavra de Yahweh” ou, mais literalmente, “na palavra de Yahweh”
  rationale: O sentido instrumental se ajusta melhor ao contexto, mas a forma compacta do hebraico permite uma tradução portuguesa igualmente concisa; a nota registra essa alternativa sem alterar o conteúdo central.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição de “Yahweh” e “em Siló” foi mantida por corresponder à ênfase e à estrutura do hebraico.
