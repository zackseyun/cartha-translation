  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: pt
  text: Samuel ficou deitado até de manhã; então abriu as portas da casa de Yahweh. Mas Samuel teve medo de contar a visão[a] a Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aparição”. O termo hebraico pode indicar uma aparição ou uma revelação em forma de visão; neste contexto, “visão” se refere à revelação noturna recebida por Samuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: ficou deitado
  rationale: Preserva o sentido básico de שׁכב, “deitar-se/ficar deitado”, sem afirmar que Samuel dormiu depois da revelação.
- source_word: עַד הַבֹּקֶר
  choice: até de manhã
  rationale: Expressão temporal natural em português, correspondente ao hebraico.
- source_word: וַיִּפְתַּח
  choice: então abriu
  rationale: Representa com naturalidade a sequência narrativa indicada pelo waw consecutivo, sem acrescentar deslocamento.
- source_word: דַּלְתוֹת
  choice: as portas
  rationale: Equivalente direto e claro do plural hebraico, adequado à entrada do santuário.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica sem usar “templo”, termo potencialmente específico demais para este contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a convenção do projeto.
- source_word: יָרֵא
  choice: teve medo
  rationale: Forma idiomática e corrente que conserva a força emocional do hebraico.
- source_word: מֵהַגִּיד
  choice: de contar
  rationale: Após “teve medo”, traduz naturalmente a construção hebraica com מן e infinitivo.
- source_word: הַמַּרְאָה
  choice: a visão
  rationale: No contexto da revelação noturna recebida por Samuel, “visão” é a equivalência mais adequada, embora o termo também possa significar “aparição”.
- source_word: אֶל עֵלִי
  choice: a Eli
  rationale: Complemento indireto natural do verbo “contar” em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança e segue a convenção declarada do projeto.
- issue: Natureza de הַמַּרְאָה
  choice: visão
  alternative: aparição
  rationale: “Visão” se ajusta à revelação noturna do contexto, mas a alternativa lexical genuína é preservada em nota, sem definir além do que o termo permite.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ficou deitado” evita a inferência não expressa de que Samuel dormiu; “casa de Yahweh” evita o possível anacronismo de “templo”.
