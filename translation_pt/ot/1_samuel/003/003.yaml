base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: pt
  text: E a lâmpada de Deus ainda não havia se apagado, e Samuel estava deitado no templo de Yahweh[a], onde estava a arca de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «santuário de Yahweh». O hebraico heikhal pode designar um templo ou santuário; aqui se refere ao lugar de habitação de Yahweh em Siló.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: a lâmpada de Deus
  rationale: נֵר designa uma lâmpada, não apenas uma luz em sentido geral. A construção «de Deus» preserva de modo natural a forma hebraica e sua associação com o culto no santuário.
- source_word: טֶרֶם יִכְבֶּה
  choice: ainda não havia se apagado
  rationale: טֶרֶם indica que a ação ainda não havia ocorrido, e כבה, quando se refere a uma lâmpada, significa naturalmente «apagar-se». O mais-que-perfeito composto expressa com clareza a relação temporal da cena.
- source_word: שֹׁכֵב
  choice: estava deitado
  rationale: O particípio descreve Samuel em posição reclinada. A tradução evita interpretar o termo especificamente como «dormindo», algo que o verbo por si só não exige.
- source_word: הֵיכַל יְהוָה
  choice: o templo de Yahweh
  rationale: הֵיכַל pode designar templo, santuário ou palácio. Neste contexto de culto, «templo» é uma equivalência lexical clara, embora se trate do santuário de Siló, anterior ao templo de Salomão; por isso, «santuário» é registrado em nota como alternativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando sua condição de nome pessoal no texto hebraico.
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: onde estava a arca de Deus
  rationale: A oração relativa identifica o lugar pela presença da arca. A formulação é natural em português e mantém o valor locativo de שָׁם e a construção «arca de Deus».
theological_decisions:
- issue: Tradução de הֵיכַל יְהוָה no contexto do santuário pré-monárquico de Siló
  choice: o templo de Yahweh
  alternative: o santuário de Yahweh
  rationale: Embora a cena seja anterior ao templo de Salomão, הֵיכַל admite lexicalmente «templo». Essa escolha não identifica necessariamente o edifício com o templo posterior; a alternativa «santuário» é mantida em nota para evitar que a ambiguidade histórica e lexical seja ocultada.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente e ampla legibilidade brasileira. Conserva-se «Yahweh» como nome próprio e evita-se interpretar שֹׁכֵב como sono. O marcador da nota foi colocado junto de «templo de Yahweh», termo ao qual a alternativa lexical se refere.
