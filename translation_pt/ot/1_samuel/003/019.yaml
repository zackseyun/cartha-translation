base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: pt
  text: Samuel cresceu, e Yahweh estava com ele, e não deixou que nenhuma de suas palavras caísse por terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixou que nenhuma de suas palavras falhasse”. A expressão hebraica diz literalmente que Yahweh não deixou nenhuma das palavras de Samuel “cair por terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: crescia
  rationale: O verbo גדל indica o crescimento e amadurecimento contínuo de Samuel. “Crescia” conserva a concisão e não limita o sentido ao desenvolvimento físico nem o amplia para aquisição de grandeza ou prestígio.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הָיָה עִמּוֹ
  choice: estava com ele
  rationale: Reproduz de modo direto a expressão hebraica da presença e do favor de Yahweh para com Samuel.
- source_word: וְלֹא הִפִּיל
  choice: e não deixou que ... caísse
  rationale: 'Expressa a força causativa do hifil de נפל sob negação: Yahweh não permitiu que as palavras de Samuel falhassem.'
- source_word: מִכָּל דְּבָרָיו
  choice: nenhuma de suas palavras
  rationale: Verte idiomaticamente “de todas as suas palavras” sem restringir o referente a previsões ou profecias.
- source_word: אָרְצָה
  choice: por terra
  rationale: A expressão portuguesa “cair por terra” preserva a imagem do hebraico e comunica naturalmente a ideia de algo que falha ou fica sem efeito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido da expressão “não deixou nenhuma de suas palavras cair por terra”
  choice: Preservar a imagem idiomática hebraica em português corrente
  alternative: não deixou que nenhuma de suas palavras falhasse; fez com que todas as suas palavras se cumprissem
  rationale: “Caísse por terra” mantém a textura literária e a amplitude do original. O contexto aponta para a confirmação de Samuel como profeta, mas uma paráfrase sobre o cumprimento de profecias estreitaria explicitamente o que o hebraico deixa mais amplo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade no Brasil e em outros contextos lusófonos. A coordenação simples acompanha o ritmo narrativo hebraico; “caísse por terra” conserva a metáfora original sem soar arcaica.
