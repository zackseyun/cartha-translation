  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: pt
  text: 'E Yahweh chamou Samuel pela terceira vez. Ele se levantou, foi até Eli e disse: “Aqui estou, pois o senhor me chamou”. Então Eli entendeu que Yahweh estava chamando o menino.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: chamou ... pela terceira vez
  rationale: A construção com יָסַף e infinitivo indica repetição. Em português, a própria expressão “pela terceira vez” já comunica que a ação ocorreu novamente, evitando a redundância de “chamou novamente pela terceira vez”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בַּשְּׁלִשִׁית
  choice: pela terceira vez
  rationale: Expressão adverbial natural em português para indicar a terceira ocorrência.
- source_word: וַיָּקָם
  choice: Ele se levantou
  rationale: Formulação corrente e digna que representa diretamente a ação narrativa.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: foi até Eli
  rationale: Expressa de maneira natural o movimento de Samuel em direção a Eli.
- source_word: הִנְנִי
  choice: Aqui estou
  rationale: Equivalente idiomático tradicional e ainda atual em contextos de chamado e resposta, preservando a ideia de presença e prontidão.
- source_word: כִּי קָרָאתָ לִי
  choice: pois o senhor me chamou
  rationale: כִּי introduz a razão pela qual Samuel foi até Eli. O pronome de tratamento “o senhor” explicita com naturalidade em português que Samuel se dirige respeitosamente a Eli, sem confundi-lo com o título divino.
- source_word: וַיָּבֶן
  choice: entendeu
  rationale: O verbo indica que Eli chegou a compreender quem estava chamando Samuel; “entendeu” preserva o sentido sem ampliar a interpretação.
- source_word: קֹרֵא
  choice: estava chamando
  rationale: O particípio apresenta a ação em curso ou reiterada, adequadamente expressa pelo pretérito imperfeito progressivo.
- source_word: לַנָּעַר
  choice: o menino
  rationale: נַעַר pode designar um menino ou jovem; neste contexto, Samuel está sob os cuidados de Eli, e “menino” se ajusta à apresentação narrativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição é indicada por “pela terceira vez”, sem pleonasmo. No discurso de Samuel, “o senhor” funciona como pronome respeitoso dirigido a Eli e aparece em minúscula para não ser confundido com uma designação divina.
