base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: pt
  text: 'Então Yahweh veio, pôs-se ali e chamou como nas outras vezes[a]: “Samuel, Samuel!” Samuel respondeu: “Fala, pois o teu servo está ouvindo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como antes”. A expressão hebraica compara este chamado com as vezes anteriores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o de títulos como “Senhor” e preservando sua presença explícita no hebraico.
- source_word: וַיָּבֹא
  choice: veio
  rationale: Reproduz de modo direto e natural o sentido narrativo de בוא, que indica vir ou chegar.
- source_word: וַיִּתְיַצַּב
  choice: pôs-se ali
  rationale: Expressa a ideia de tomar posição ou permanecer de pé em determinado lugar, mantendo a concretude da cena sem tornar o português artificial.
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto, קרא descreve o ato de dirigir a voz a Samuel; “chamou” é claro e não acrescenta uma intensidade ausente do texto.
- source_word: כְפַעַם בְּפַעַם
  choice: como das outras vezes
  rationale: A expressão idiomática compara este chamado com os chamados anteriores narrados no contexto.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: Samuel! Samuel!
  rationale: Mantém a repetição enfática e pessoal do nome; a exclamação sinaliza naturalmente o chamado direto em português.
- source_word: דַּבֵּר
  choice: Fala
  rationale: Traduz diretamente o imperativo singular e conserva a resposta breve e solene de Samuel.
- source_word: כִּי
  choice: pois
  rationale: Introduz de forma natural em português a razão da prontidão de Samuel para ouvir.
- source_word: שֹׁמֵעַ
  choice: está ouvindo
  rationale: O particípio indica atenção em curso; a locução verbal comunica a disposição ativa para escutar.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: No contexto de uma resposta reverente a Deus, “servo” expressa adequadamente serviço, submissão e humildade, sem impor o sentido social mais restrito de “escravo”.
theological_decisions:
- issue: Descrição antropomórfica da manifestação de Yahweh
  choice: 'Manter a linguagem concreta: “veio, pôs-se ali”'
  alternative: Atenuar a descrição com “apareceu” ou “manifestou sua presença”
  rationale: O hebraico apresenta as ações de Yahweh de maneira vívida e pessoal. A tradução preserva essa concretude sem tentar resolver ou suavizar a tensão teológica.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração representa o nome pessoal presente no texto hebraico e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português atual, claro e digno, com formas amplamente compreensíveis no Brasil e no restante do mundo lusófono. Emprega “teu” em fala direta reverente, sem arcaísmo excessivo, e conserva a concisão narrativa do hebraico.
