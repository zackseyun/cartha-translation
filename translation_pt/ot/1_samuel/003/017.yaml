  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: pt
  text: 'E ele disse: “Qual foi a palavra que ele falou a você? Por favor, não a esconda de mim. Que Deus lhe faça isso e ainda mais, se você esconder de mim uma palavra sequer[a] de tudo o que ele falou a você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “se você esconder de mim uma palavra de toda a palavra que ele falou a você”.'
    reason: Registra a repetição singular de דָּבָר no hebraico, que seria pouco natural no corpo do texto em português.
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: Qual foi a palavra
  rationale: “Palavra” preserva o valor de דָּבָר e o vínculo temático com a fala divina no contexto; o pretérito “foi” soa natural em português ao perguntar pelo conteúdo já comunicado.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: ele falou a você
  rationale: Mantém a ligação lexical e retórica entre “palavra” e o ato de falar, sem tornar a frase excessivamente formal.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: Por favor, não a esconda de mim
  rationale: “Por favor” representa a partícula de súplica נָא; o pronome “a” retoma naturalmente “a palavra”.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: Que Deus faça isso com você e ainda mais
  rationale: Reproduz a fórmula hebraica de juramento e maldição de modo compreensível, conservando sua força imprecatória e sua referência deliberadamente não especificada ao castigo.
- source_word: אִם
  choice: se
  rationale: Conserva a estrutura elíptica do juramento hebraico, em que a consequência invocada precede a condição.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: se você esconder de mim uma palavra sequer de tudo o que ele falou a você
  rationale: “Uma palavra sequer” expressa a proibição de omitir qualquer parte. “De tudo o que” oferece português corrente e inteligível, enquanto a nota registra a repetição singular e mais formal do hebraico.
theological_decisions:
- issue: Sentido de אֱלֹהִים na fórmula de juramento
  choice: Deus
  alternative: os deuses
  rationale: No contexto, Eli invoca o Deus de Israel mediante uma fórmula hebraica convencional; o plural morfológico não indica aqui várias divindades.
- issue: Força da fórmula imprecatória
  choice: Que Deus faça isso com você e ainda mais
  alternative: Que Deus o castigue, e ainda mais
  rationale: A tradução mantém sem explicitar o conteúdo do castigo, preservando a indeterminação retórica da fórmula hebraica em vez de interpretá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A repetição temática de “palavra/falou” foi preservada onde não prejudica seriamente a fluidez; a formulação hebraica mais rígida da última oração foi documentada em nota.
