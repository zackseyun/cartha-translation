  text: וַ/יִּזָּעֵ֣ק שָׁא֗וּל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד הַ/מִּלְחָמָ֑ה וְ/הִנֵּ֨ה הָיְתָ֜ה חֶ֤רֶב אִישׁ֙ בְּ/רֵעֵ֔/הוּ מְהוּמָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: pt
  text: Então Saul e todo o povo que estava com ele foram convocados e chegaram ao campo de batalha.[a] E eis que a espada de cada um estava contra o seu companheiro, em meio a uma confusão imensa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Então Saul e todo o povo que estava com ele deram um grito” ou “reuniram-se”. O verbo hebraico pode ser entendido de mais de uma maneira aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou “em meio a um pânico imenso” ou “em meio a um tumulto imenso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: foram convocados
  rationale: O nifal de זעק pode ser entendido aqui em sentido passivo ou reflexivo, indicando que Saul e os seus homens foram reunidos para responder ao tumulto. A formulação preserva essa leitura sem convertê-la em ação causativa.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: todo o povo que estava com ele
  rationale: Mantém o sentido básico de עָם e a construção relativa do hebraico; o contexto deixa claro que se trata da força que acompanhava Saul.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: chegaram ao campo de batalha
  rationale: בוא com עד expressa chegar até o lugar da batalha. “Campo de batalha” é natural em português e não afirma que já tenham entrado diretamente no combate.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o efeito vívido de הִנֵּה, que chama a atenção para a cena inesperada diante deles.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: a espada de cada um estava contra o seu companheiro
  rationale: Reproduz de perto a expressão hebraica e comunica que os combatentes do acampamento inimigo se atacavam mutuamente, sem tornar explícito além do texto quem eram eles.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: em meio a uma confusão imensa
  rationale: מְהוּמָה pode indicar confusão, pânico ou tumulto. “Confusão imensa” preserva a amplitude semântica e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. Conserva o passivo possível em וַיִּזָּעֵק, a vivacidade de וְהִנֵּה e a ambiguidade de מְהוּמָה por meio de nota.
