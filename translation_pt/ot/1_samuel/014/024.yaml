base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: pt
  text: 'Naquele dia, os homens de Israel estavam sob forte pressão[a], e Saul impôs um juramento ao povo, dizendo: “Maldito seja o homem que comer alguma coisa antes do anoitecer, antes que eu me vingue dos meus inimigos.” Por isso, ninguém do povo provou alimento algum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: estavam exaustos. O sentido exato do termo hebraico neste contexto é discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: estavam exaustos
  rationale: Neste contexto, o nifal indica aflição ou desgaste, não aproximação espacial. “Estavam exaustos” comunica naturalmente o estado penoso das tropas e se ajusta ao jejum imposto por Saul.
- source_word: וַיֹּאֶל
  choice: havia imposto um juramento
  rationale: O verbo assume aqui o sentido contextual de sujeitar o povo a um juramento acompanhado de maldição. “Imposto” preserva seu caráter coercitivo sem recorrer ao pouco corrente “conjurou”.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o termo hebraico comum, embora, neste contexto militar, designe a força combatente de Saul.
- source_word: אָרוּר הָאִישׁ
  choice: Maldito seja o homem
  rationale: Reproduz a declaração formal de maldição e conserva o singular masculino genérico do hebraico.
- source_word: יֹאכַל לֶחֶם
  choice: comer alguma coisa
  rationale: לֶחֶם significa literalmente “pão”, mas aqui funciona idiomaticamente como alimento em geral. A formulação portuguesa deixa claro que a proibição abrangia qualquer comida.
- source_word: עַד הָעֶרֶב
  choice: antes do anoitecer
  rationale: Expressa com naturalidade o limite temporal da proibição.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: antes que eu me vingue dos meus inimigos
  rationale: Preserva a primeira pessoa e o tom pessoal da vingança de Saul, além de comunicar a relação temporal pretendida no enunciado.
- source_word: לֹא טָעַם ... לָחֶם
  choice: ninguém do povo provou alimento algum
  rationale: Conserva a imagem verbal de “provar” e verte o coletivo negado em português idiomático. “Alimento” representa o sentido amplo de לֶחֶם.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem inicial “Naquele dia” é natural em português e corresponde ao adjunto temporal hebraico, sem acrescentar um marcador discursivo. A relação entre o estado dos israelitas e o juramento foi vertida com “pois”, leitura favorecida pelo contexto e pela construção hebraica; a nota preserva a incerteza lexical em נִגַּשׂ.
