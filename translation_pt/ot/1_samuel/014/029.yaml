base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/029.yaml
  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: pt
  text: 'Então Jônatas disse: “Meu pai trouxe aflição sobre a terra. Vejam, por favor, como meus olhos brilharam[a], pois provei um pouco deste mel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão idiomática hebraica, literalmente «meus olhos se iluminaram», que indica que Jônatas recuperou as forças ou ficou mais alerta depois de comer.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: trouxe perturbação a
  rationale: Expressa o sentido de perturbar, causar transtorno ou trazer calamidade, mantendo a força causativa sem intensificá-la para ‘desastre’.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a correspondência mais direta e preserva a possibilidade contextual de se referir tanto ao território quanto à população afetada.
- source_word: רְאוּ נָא
  choice: Vejam
  rationale: O imperativo plural chama a atenção dos ouvintes; em português, o tom apelativo de נָא pode ser transmitido naturalmente pelo contexto, sem o pouco idiomático ‘vejam, por favor’.
- source_word: אֹרוּ עֵינַי
  choice: meus olhos se iluminaram
  rationale: Preserva a imagem hebraica dos olhos e sugere a recuperação de vigor e lucidez depois de comer.
- source_word: טָעַמְתִּי
  choice: provei
  rationale: Traduz especificamente o ato de provar, importante porque Jônatas consumiu apenas uma pequena quantidade.
- source_word: מְעַט
  choice: um pouco
  rationale: Representa de modo simples e natural a pequena quantidade mencionada.
- source_word: דְּבַשׁ הַזֶּה
  choice: deste mel
  rationale: Mantém o substantivo ‘mel’ e o demonstrativo, sem acrescentar ‘favo’, que não aparece neste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada; ‘só porque’ comunica a relação causal e ressalta que uma quantidade mínima de mel produziu efeito perceptível. A metáfora dos olhos foi preservada e explicada em nota.
