base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: pt
  text: O primeiro ataque de Jônatas e de seu escudeiro abateu cerca de vinte homens, em aproximadamente meio sulco de uma junta de campo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “em cerca de meio sulco de uma junta de campo”. A expressão é obscura; provavelmente se refere à área de terra que uma junta de bois podia lavrar.
    reason: A medida agrária hebraica é incerta e não possui equivalente moderno exato. A nota preserva a formulação literal aproximada e indica o sentido provável sem o impor ao texto.
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: Nesse primeiro ataque
  rationale: O substantivo מַכָּה pode indicar golpe, ataque ou matança. Aqui, “primeiro ataque” introduz com naturalidade o episódio militar, enquanto o resultado letal fica explícito em “abateram”.
- source_word: הִכָּה
  choice: abateram
  rationale: No contexto militar e diante da contagem de homens atingidos, נכה tem sentido letal. “Abateram” preserva a imagem de derrubar e comunica a morte sem recorrer a uma formulação excessivamente gráfica.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: e seu escudeiro
  rationale: É a designação portuguesa tradicional e compreensível do auxiliar militar que carregava as armas ou o equipamento do guerreiro.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: cerca de vinte homens
  rationale: O prefixo כ־ indica aproximação; “cerca de” transmite isso de modo natural.
- source_word: כְּבַחֲצִי מַעֲנָה צֶמֶד שָׂדֶה
  choice: num espaço de aproximadamente meio sulco de uma área de terra que uma junta de bois podia lavrar
  rationale: A expressão hebraica combina “meio sulco” com uma antiga medida agrária baseada no trabalho de uma junta de bois. A tradução conserva a imagem agrícola e a aproximação sem substituir a medida por um equivalente moderno inexato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Evitou-se o termo pouco corrente “jeira”; a antiga medida de terreno foi explicada no próprio versículo e sua formulação literal foi mantida na nota.
