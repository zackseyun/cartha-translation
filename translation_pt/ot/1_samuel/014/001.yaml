base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: pt
  text: 'Certo dia, Jônatas, filho de Saul, disse ao jovem que carregava suas armas: “Venha, vamos atravessar até o posto avançado[a] dos filisteus que fica do outro lado[b].” Mas não contou isso a seu pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a guarnição”. O termo hebraico pode designar um posto militar ou a força estacionada nele.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “que está do outro lado deste”, expressão dêitica que provavelmente aponta para o local de travessia descrito nos versículos seguintes.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Certo dia
  rationale: A expressão introduz um episódio na narrativa. “Certo dia” comunica naturalmente o valor temporal sem reproduzir de modo rígido o idiomatismo hebraico.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר pode designar menino, jovem ou servo. Aqui se trata do homem que acompanha Jônatas em uma ação militar; “o jovem” preserva a indicação de idade sem sugerir que fosse uma criança.
- source_word: נֹשֵׂא כֵלָיו
  choice: que carregava suas armas
  rationale: A expressão significa literalmente aquele que carregava seus utensílios, equipamentos ou armas. A forma descritiva reflete o particípio hebraico e é clara em português.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Venha, vamos atravessar
  rationale: O imperativo singular é seguido de uma forma exortativa na primeira pessoa do plural. A tradução mantém tanto o convite dirigido ao jovem quanto a proposta de atravessarem juntos.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: o posto avançado dos filisteus
  rationale: No contexto militar, מַצָּב pode indicar um posto, uma posição ou a força ali estacionada. “Posto avançado” é natural em português e se ajusta ao movimento de Jônatas em direção a um local ocupado pelos filisteus; a alternativa é registrada em nota.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: que fica do outro lado
  rationale: A expressão é dêitica e um tanto elíptica, indicando o lado de lá em relação à posição dos personagens. A tradução preserva essa relativa indeterminação, sem acrescentar “desfiladeiro” ao texto.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: Mas não contou isso a seu pai
  rationale: A conjunção introduz aqui uma observação narrativa contrastante. “Contou” traduz com naturalidade o ato de informar, e “isso” explicita apenas o objeto já fornecido pelo contexto.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Emprega “Jônatas” e “filisteus” nas formas bíblicas correntes. Evita acrescentar “desfiladeiro” ao texto principal e conserva em nota a ambiguidade militar de מַצָּב.
