base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: pt
  text: 'Os homens do posto militar responderam a Jônatas e ao seu escudeiro: “Subam até nós, e lhes diremos algo.” Então Jônatas disse ao seu escudeiro: “Suba atrás de mim, pois Yahweh os entregou nas mãos de Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: os homens do posto militar
  rationale: No contexto, מַצָּבָה designa uma posição militar guarnecida. “Posto militar” é claro em português e evita a possível ideia de que todos os homens constituíam uma guarnição permanente.
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: A expressão significa literalmente o portador dos equipamentos ou das armas de Jônatas; “escudeiro” é a designação tradicional e natural dessa função militar.
- source_word: עֲלוּ אֵלֵינוּ
  choice: Subam até nós
  rationale: O imperativo plural indica movimento ascendente em direção aos filisteus, que ocupavam uma posição elevada.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: e lhes mostraremos uma coisa
  rationale: O hifil de ידע significa fazer saber ou dar a conhecer. Neste contexto de provocação hostil, “mostraremos” preserva a vagueza ameaçadora de דָּבָר sem explicá-la em excesso.
- source_word: עֲלֵה אַחֲרַי
  choice: Suba atrás de mim
  rationale: O imperativo está no singular e mantém tanto o movimento para cima quanto a instrução para que o escudeiro siga Jônatas.
- source_word: כִּי נְתָנָם יְהוָה
  choice: pois Yahweh os entregou
  rationale: Com inimigos como objeto e a expressão subsequente “nas mãos de”, נתן comunica entrega ao poder do adversário; “entregou” expressa naturalmente esse sentido em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיַד יִשְׂרָאֵל
  choice: nas mãos de Israel
  rationale: A expressão idiomática hebraica indica submissão ao poder de Israel. O plural “nas mãos” é a forma idiomática corrente em português e conserva a imagem do original.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente e evita substituí-lo pelo título “Senhor”.
- issue: O perfeito נְתָנָם como declaração de vitória
  choice: os entregou
  alternative: os entregará
  rationale: 'Mantém-se o aspecto perfeito do hebraico: Jônatas fala da entrega como fato consumado ou certo, sem converter explicitamente a forma em futuro.'
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com legibilidade brasileira ampla. A coordenação hebraica redundante “responderam... e disseram” foi condensada em “responderam:”, sem perda de conteúdo. Não foram necessárias notas de rodapé.
