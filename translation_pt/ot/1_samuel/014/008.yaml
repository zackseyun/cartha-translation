lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר para introduzir fala direta; “disse” é o equivalente natural em português.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הִנֵּה
  choice: Veja!
  rationale: Interjeição que chama a atenção para o plano imediato; “Veja!” comunica essa força discursiva em português moderno.
- source_word: אֲנַחְנוּ עֹבְרִים
  choice: Nós vamos atravessar
  rationale: O pronome explícito preserva a ênfase, e a construção com o particípio indica ação iminente no contexto.
- source_word: אֶל הָאֲנָשִׁים
  choice: até aqueles homens
  rationale: Refere-se aos homens do posto filisteu que estão diante deles; “aqueles” torna a referência contextual natural sem alterar o sentido.
- source_word: וְנִגְלִינוּ אֲלֵיהֶם
  choice: e nos mostraremos a eles
  rationale: O nifal de גלה indica tornar-se visível ou dar-se a conhecer intencionalmente; “nos mostraremos” é idiomático e preserva a ação deliberada.
