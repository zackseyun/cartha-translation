base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: pt
  text: Mas Jônatas não tinha ouvido quando seu pai pôs o povo sob juramento. Então estendeu a ponta do cajado que tinha na mão, mergulhou-a no favo de mel[a], levou a mão à boca, e seus olhos se iluminaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “na floresta” ou “no matagal de mel”; a expressão hebraica provavelmente se refere a um favo ou a uma massa densa de mel.
    reason: lexical_alternative
  - marker: b
    text: “Seus olhos se iluminaram” é uma expressão idiomática hebraica que indica que ele recuperou as forças ou ficou mais alerta depois de comer.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: não tinha ouvido
  rationale: No contexto, o verbo indica que Jônatas não tomou conhecimento do juramento, e não que se recusou a obedecer. O mais-que-perfeito esclarece a sequência narrativa.
- source_word: בְּהַשְׁבִּיעַ אָבִיו אֶת־הָעָם
  choice: quando seu pai pôs o povo sob juramento
  rationale: O hifil de שבע significa fazer alguém jurar ou colocá-lo sob juramento. A formulação preserva a força solene e jurídica sem recorrer a linguagem arcaica.
- source_word: וַיִּשְׁלַח אֶת קְצֵה הַמַּטֶּה
  choice: estendeu a ponta do cajado
  rationale: Com a ponta do cajado como objeto, o verbo descreve o ato de estendê-lo. “Cajado” é natural para o objeto portátil nesta cena.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: mergulhou-a
  rationale: O pronome feminino retoma naturalmente “a ponta” em português e mantém explícita a ação descrita no hebraico.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: no favo de mel
  rationale: A expressão hebraica é incomum e evoca literalmente um bosque ou uma massa densa de mel; no contexto, “favo de mel” comunica de modo claro o referente provável, com a imagem literal registrada em nota.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: levou a mão à boca
  rationale: A expressão descreve o movimento de levar à boca o mel recolhido; esta formulação é natural e permanece próxima da forma hebraica.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: seus olhos se iluminaram
  rationale: A tradução preserva a imagem idiomática hebraica, que no contexto indica recuperação de energia ou vivacidade depois de comer.
