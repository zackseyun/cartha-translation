  source_fidelity: O texto traduz fielmente וַיִּבֶן ... מִזְבֵּחַ לַיהוָה como “Saul construiu um altar para Yahweh”. A segunda oração adota de modo legítimo a compreensão idiomática predominante de אֹתוֹ הֵחֵל לִבְנוֹת, isto é, que este foi o primeiro altar de Saul dedicado a Yahweh. A nota registra a alternativa mais literal e preserva a dificuldade sintática do hebraico.
