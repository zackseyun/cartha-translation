base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/035.yaml
  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: pt
  text: Saul construiu um altar para Yahweh; esse foi o primeiro altar que ele construiu para Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “ele começou a construí-lo como altar para Yahweh”. A expressão hebraica é geralmente entendida como uma indicação de que esse foi o primeiro altar que Saul construiu para Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O verbo בנה significa aqui construir; “construiu” é a forma natural e precisa em português no contexto da construção de um altar.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico שָׁאוּל.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Equivalente português estabelecido para מִזְבֵּחַ, lugar destinado a sacrifícios ou ofertas.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica dedicação ou relação; “para Yahweh” expressa naturalmente que o altar foi dedicado a Yahweh e preserva o nome divino.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: esse foi o primeiro altar que ele construiu
  rationale: A construção hebraica é sintaticamente incomum. No contexto, é geralmente entendida como a indicação de que esse foi o primeiro altar construído por Saul para Yahweh; a nota preserva a leitura mais literal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome divino pessoal sem substituí-lo por um título.
- issue: Sentido de אֹתוֹ הֵחֵל לִבְנוֹת
  choice: esse foi o primeiro altar que ele construiu
  alternative: ele começou a construí-lo como altar
  rationale: A leitura principal comunica a interpretação idiomática mais comum, enquanto a nota registra a possibilidade de entender הֵחֵל em seu sentido lexical direto, “começou”, preservando a ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Para Yahweh” soa mais natural do que “a Yahweh” no português corrente e comunica dedicação. A repetição de “altar” e “Yahweh” acompanha a ênfase do hebraico.
