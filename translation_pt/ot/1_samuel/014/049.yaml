  text: וַ/יִּֽהְיוּ֙ בְּנֵ֣י שָׁא֔וּל יוֹנָתָ֥ן וְ/יִשְׁוִ֖י וּ/מַלְכִּי שׁ֑וּעַ וְ/שֵׁם֙ שְׁתֵּ֣י בְנֹתָ֔י/ו שֵׁ֤ם הַ/בְּכִירָה֙ מֵרַ֔ב וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה מִיכַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: pt
  text: 'Os filhos de Saul eram Jônatas, Isvi e Malquisua. Os nomes de suas duas filhas eram: Merabe, a primogênita,[a] e Mical, a mais nova.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mais velha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: Os filhos de Saul eram
  rationale: Traduz de modo direto a construção copulativa e omite um conectivo inicial desnecessário em português, sem acrescentar uma ideia temporal ausente do hebraico.
- source_word: יוֹנָתָן וְיִשְׁוִי וּמַלְכִּי שׁוּעַ
  choice: Jônatas, Isvi e Malquisua
  rationale: Emprega as formas portuguesas tradicionais ou transliterações claras dos nomes próprios; o nome hebraico composto מַלְכִּי שׁוּעַ é apresentado como uma só unidade onomástica.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: Os nomes de suas duas filhas eram
  rationale: Embora שֵׁם esteja no singular, seguem-se dois nomes; o plural é a forma idiomática e inequívoca em português.
- source_word: הַבְּכִירָה
  choice: a primogênita
  rationale: Preserva a referência explícita à ordem de nascimento, sem excluir a tradução contextual 'a mais velha'.
- source_word: הַקְּטַנָּה
  choice: a mais nova
  rationale: No contraste entre as duas irmãs, o adjetivo indica idade relativa, não tamanho físico.
- source_word: מֵרַב ... מִיכַל
  choice: Merabe ... Mical
  rationale: Usa formas portuguesas reconhecíveis e correntes para os nomes próprios.
theological_decisions: []
