source:
  edition: WLC
  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: pt
  text: Assim, naquele dia, Yahweh salvou Israel, e a batalha avançou para além de Bete-Áven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a batalha passou por Bete-Áven” ou “a batalha prosseguiu além de Bete-Áven”.
    reason: O hebraico permite diferentes maneiras de entender o movimento da batalha em relação a Bete-Áven.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: salvou
  rationale: O hifil de ישׁע apresenta Yahweh como aquele que causa a salvação ou livramento. “Salvou” é direto, natural e conserva o peso teológico do verbo sem restringi-lo à ideia de vitória militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal natural e fiel em português.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: O marcador de objeto direto introduz o nome coletivo do povo de Israel.
- source_word: וְהַמִּלְחָמָה
  choice: e a batalha
  rationale: No contexto da narrativa, מִלְחָמָה designa o confronto militar específico em andamento, mais naturalmente “batalha” do que “guerra”.
- source_word: עָבְרָה
  choice: avançou para além
  rationale: עבר indica movimento que passa por ou ultrapassa um lugar. “Avançou para além” comunica o deslocamento da batalha e preserva a provável nuance militar, sem eliminar outras possibilidades.
- source_word: אֶת בֵּית אָוֶן
  choice: para além de Bete-Áven
  rationale: Com עבר, אֶת pode assinalar o lugar atravessado ou ultrapassado. A formulação mantém a noção espacial provável; “passou por Bete-Áven” continua possível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino. “Yahweh” o representa diretamente, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com grafia portuguesa do topônimo “Bete-Áven”. A ordem foi ajustada para fluência, mantendo Yahweh como agente enfático da salvação e a ambiguidade espacial da oração final em nota.
