  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: pt
  text: Todo o povo da terra[a] entrou na floresta, e havia mel sobre o chão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «toda a terra»; a expressão parece ter sentido coletivo, isto é, o povo da terra.
    reason: lexical_alternative
  - marker: b
    text: Ou «sobre a face do campo». Neste contexto, a expressão hebraica pode referir-se ao mel visível sobre o chão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָ֖רֶץ
  choice: Todo o povo daquela terra
  rationale: Embora a expressão hebraica diga literalmente «toda a terra», o verbo no plural e o contexto indicam um uso metonímico coletivo, referente às pessoas. A formulação explicita esse sentido em português natural sem reduzir o alcance apenas aos soldados.
- source_word: בָּ֣אוּ
  choice: entrou
  rationale: Com o complemento «na floresta», בוא tem aqui o sentido natural de entrar. O singular concorda em português com o substantivo coletivo «povo».
- source_word: בַ/יָּ֑עַר
  choice: na floresta
  rationale: יַעַר designa uma área arborizada ou floresta; «floresta» é claro e adequado ao registro narrativo.
- source_word: וַ/יְהִ֥י
  choice: e havia
  rationale: Nesse contexto, היה introduz a existência de algo na cena; «havia» reproduz naturalmente essa função em português.
- source_word: דְבַ֖שׁ
  choice: mel
  rationale: דְּבַשׁ significa normalmente «mel». Embora o cenário possa sugerir mel silvestre, o hebraico não o especifica.
- source_word: עַל פְּנֵ֥י הַ/שָּׂדֶֽה
  choice: sobre a superfície do chão
  rationale: עַל־פְּנֵי descreve algo sobre a face ou superfície, e שָׂדֶה pode designar aqui o terreno ou chão. Esta tradução conserva a imagem sem sugerir indevidamente um campo cultivado dentro da floresta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil como em outros contextos lusófonos. A tradução explicita a metonímia de «terra» por seus habitantes, mas registra a forma literal em nota; também preserva em nota a alternativa mais formal para שָׂדֶה.
