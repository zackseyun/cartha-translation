source:
  edition: WLC
  text: וְ/שָׁא֛וּל לָכַ֥ד הַ/מְּלוּכָ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּלָּ֣חֶם סָבִ֣יב בְּֽ/כָל אֹיְבָ֡י/ו בְּ/מוֹאָ֣ב וּ/בִ/בְנֵי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וּ/בְ/מַלְכֵ֤י צוֹבָה֙ וּ/בַ/פְּלִשְׁתִּ֔ים וּ/בְ/כֹ֥ל אֲשֶׁר יִפְנֶ֖ה יַרְשִֽׁיעַ־׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: pt
  text: 'Saul consolidou seu reinado sobre Israel e guerreou, por todos os lados, contra todos os seus inimigos: contra Moabe, contra os amonitas, contra Edom, contra os reis de Zobá e contra os filisteus. Aonde quer que se voltasse, impunha-lhes castigo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “declarava-os culpados”. O verbo hebraico também pode significar tratar alguém como culpado; aqui, provavelmente se refere a impor aos inimigos uma derrota punitiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה עַל יִשְׂרָאֵל
  choice: consolidou seu reinado sobre Israel
  rationale: Embora לָכַד tenha o sentido básico de capturar ou tomar, neste contexto a expressão descreve Saul firmando o domínio real que já exercia. “Consolidou seu reinado” comunica esse sentido sem sugerir uma usurpação não indicada pelo texto.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: guerreou contra todos os inimigos ao seu redor
  rationale: A preposição ב com o verbo de combate indica os adversários, e סָבִיב apresenta os povos inimigos que cercavam Israel. A formulação é clara, natural e preserva a abrangência da expressão hebraica.
- source_word: בִבְנֵי עַמּוֹן
  choice: contra os amonitas
  rationale: “Amonitas” é o equivalente corrente e natural de “filhos de Amom” em português moderno.
- source_word: בְמַלְכֵי צוֹבָה
  choice: contra os reis de Zobá
  rationale: Preserva-se o plural explícito מַלְכֵי, sem harmonizá-lo com traduções ou tradições textuais que apresentam o singular.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: Aonde quer que se voltasse
  rationale: 'Reproduz o sentido distributivo da expressão: em qualquer direção ou contra qualquer adversário para o qual Saul se voltasse.'
- source_word: יַרְשִׁיעַ
  choice: impunha-lhes castigo
  rationale: O hifil de רשע é difícil neste contexto. A escolha conserva a ideia de declarar ou tratar alguém como culpado e a expressa como ação punitiva no contexto militar, sem reduzi-la simplesmente a “vencia”.
theological_decisions:
- issue: Caráter moral ou judicial da ação expressa por יַרְשִׁיעַ
  choice: impunha-lhes castigo
  alternative: agia perversamente; declarava-os culpados; derrotava-os
  rationale: A forma hebraica admite tensão lexical. O contexto favorece uma ação punitiva contra os inimigos, mas não autoriza apagar completamente o componente judicial de “declarar culpado”. A nota preserva essa ambiguidade sem atribuir ao narrador uma avaliação moral de Saul que o versículo talvez não faça.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a repetição de “contra” na enumeração e o plural “reis de Zobá”. O marcador da nota foi colocado junto à expressão verbal difícil a que de fato se refere.
