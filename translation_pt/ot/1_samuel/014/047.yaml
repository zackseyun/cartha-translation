    issue: Escopo de סָבִיב em “todos os inimigos ao seu redor”
    rationale: A expressão pode ser entendida como descrição espacial dos inimigos, e não como “por todos os lados” em referência à extensão das campanhas de Saul. A reposição do adjunto junto ao verbo reproduz melhor a sintaxe e o sentido.
