- from: Entre as passagens pelas quais Jônatas procurava atravessar até o posto avançado dos filisteus, havia uma ponta de rocha[a] de um lado e outra ponta de rocha do outro. Uma se chamava Bozez, e a outra, Sené.
  to: Entre as passagens por onde Jônatas procurava passar para chegar ao posto avançado dos filisteus, havia uma ponta de rocha[a] de um lado e outra ponta de rocha do outro. Uma se chamava Bozez, e a outra, Sené.
