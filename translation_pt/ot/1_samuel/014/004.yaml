  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: pt
  text: Entre as passagens por onde Jônatas procurava passar para chegar ao posto avançado dos filisteus, havia uma ponta de rocha[a] de um lado e outra ponta de rocha do outro. Uma se chamava Bozez, e a outra, Sené.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “um dente de rocha ... e um dente de rocha”; imagem de pontas ou saliências rochosas agudas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: as passagens
  rationale: O substantivo designa lugares de passagem ou travessia. “Passagens” preserva a amplitude do termo e se ajusta ao terreno rochoso sem pressupor uma travessia de água.
- source_word: בִּקֵּשׁ ... לַעֲבֹר עַל
  choice: procurava atravessar até
  rationale: A construção expressa intenção deliberada de atravessar em direção ao posto filisteu. A formulação portuguesa mantém tanto o movimento de travessia quanto o destino, sem sugerir que Jônatas já o tivesse alcançado.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: o posto avançado dos filisteus
  rationale: No contexto militar, מַצָּב pode indicar uma força estacionada ou o posto que ela ocupa. “Posto avançado” é claro e natural aqui.
- source_word: שֵׁן הַסֶּלַע
  choice: uma ponta de rocha
  rationale: A expressão significa literalmente “dente da rocha” e descreve uma saliência rochosa aguda. “Ponta de rocha” comunica a forma do acidente geográfico em português corrente.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: de um lado ... do outro
  rationale: A repetição hebraica situa as duas formações em lados opostos da passagem; a expressão portuguesa transmite isso com clareza.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: Uma se chamava ... e a outra
  rationale: Formulação idiomática em português que conserva a correspondência entre as duas formações e seus nomes.
- source_word: בּוֹצֵץ
  choice: Bozez
  rationale: Nome próprio transliterado em forma clara e próxima do hebraico.
- source_word: סֶנֶּה
  choice: Sené
  rationale: Nome próprio transliterado; o acento gráfico orienta a pronúncia natural em português.
- source_word: וּבֵין
  choice: Entre
  rationale: A conjunção hebraica liga o versículo ao fluxo narrativo, mas não exige um “e” inicial em português. A abertura direta evita um marcador discursivo artificial.
theological_decisions: []
