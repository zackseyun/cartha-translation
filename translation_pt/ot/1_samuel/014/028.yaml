  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: pt
  text: 'Então um homem do povo respondeu: “Teu pai fez o povo jurar solenemente, dizendo: ‘Maldito seja o homem que comer alimento[a] hoje!’” E o povo estava exausto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pão”; aqui, o termo é usado em sentido mais amplo, referindo-se a alimento em geral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o povo ficou cansado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Preserva o verbo narrativo hebraico de resposta e se encaixa naturalmente no contexto de diálogo.
- source_word: אִישׁ מֵהָעָם
  choice: um homem do povo
  rationale: Mantém o indivíduo masculino e sua procedência dentre o povo, em formulação clara e natural em português.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: fez o povo jurar solenemente
  rationale: A construção causativa com infinitivo absoluto intensifica o ato; “solenemente” comunica essa ênfase sem recorrer a linguagem arcaica.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Reproduz diretamente a fala dirigida a Jônatas.
- source_word: אָרוּר
  choice: Maldito seja
  rationale: Expressa com naturalidade e força solene a fórmula hebraica de maldição.
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: o homem que comer
  rationale: Mantém o masculino singular representativo da fórmula de maldição e o valor eventual do verbo.
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora o sentido lexical básico seja “pão”, aqui o termo abrange comida em geral, como confirma o mel comido por Jônatas no contexto imediato.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto do advérbio temporal hebraico.
- source_word: וַיָּעַף
  choice: estava exausto
  rationale: Comunica o estado de fraqueza e cansaço do povo, agravado pela privação de alimento; a nota registra a nuance ingressiva possível.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o termo hebraico de modo transparente, embora no contexto ele designe as tropas.
