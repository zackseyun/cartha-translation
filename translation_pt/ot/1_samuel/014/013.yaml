base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: pt
  text: Então Jônatas subiu, apoiando-se nas mãos e nos pés, e seu escudeiro vinha atrás dele. Eles caíram diante de Jônatas, e seu escudeiro, atrás dele, ia matando-os.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os matava”. O particípio hebraico pode destacar uma ação contínua ou sucessiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: O verbo עלה significa subir; o contexto e a menção das mãos e dos pés deixam claro que se trata de uma escalada, sem ser necessário explicitar isso no próprio verbo.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: apoiando-se nas mãos e nos pés
  rationale: Conserva a imagem corporal concreta do hebraico e soa mais natural em português do que a formulação estritamente literal 'sobre as mãos e sobre os pés'.
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: É a designação portuguesa tradicional e inteligível para o ajudante militar que carregava as armas ou o equipamento do guerreiro.
- source_word: אַחֲרָיו
  choice: atrás dele
  rationale: Expressa o sentido espacial natural no contexto e preserva sua repetição na segunda metade do versículo.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: Eles caíam diante de Jônatas
  rationale: Preserva a expressão militar 'cair diante de' sem determinar além do hebraico exatamente como cada adversário foi derrubado.
- source_word: מְמוֹתֵת
  choice: ia matando-os
  rationale: O particípio descreve a ação em curso do escudeiro enquanto seguia Jônatas; a locução portuguesa comunica naturalmente essa progressão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “atrás dele” foi mantida por corresponder à estrutura hebraica, e “Eles” evita inserir no versículo um substantivo que está apenas implícito no contexto.
