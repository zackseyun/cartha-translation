revisions:
- from: Então Jônatas subiu, apoiando-se nas mãos e nos pés, e seu escudeiro vinha atrás dele. Eles caíam diante de Jônatas, e seu escudeiro, atrás dele, ia matando-os.[a]
  to: Então Jônatas subiu, apoiando-se nas mãos e nos pés, e seu escudeiro vinha atrás dele. Eles caíram diante de Jônatas, e seu escudeiro, atrás dele, ia matando-os.[a]
  rationale: A única alteração é «caíam» para «caíram», a fim de refletir a progressão narrativa do wayyiqtol hebraico. Mantêm-se «ia matando-os» e a nota, pois o particípio מְמוֹתֵת pode salientar ação em andamento ou repetida/sucessiva.
