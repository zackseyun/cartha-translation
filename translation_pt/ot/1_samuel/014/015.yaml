revisions:
- from: Então houve tremor no acampamento, no campo e entre todo o povo; tanto a guarnição como o grupo de ataque também tremeram. A terra estremeceu, e aquilo se tornou um tremor vindo de Deus.[a]
  to: Então houve tremor no acampamento, no campo e entre todo o povo; a guarnição e o grupo de incursão também tremeram. A terra estremeceu, de modo que houve um tremor vindo de Deus.[a]
  rationale: A revisão elimina uma redundância sintática, torna mais clara a relação resultativa da última oração e especifica com cautela a função da unidade militar. Mantém-se a ambiguidade da expressão final na nota, sem resolver dogmaticamente se o genitivo indica origem divina ou intensidade extraordinária.
