base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: pt
  text: Então houve tremor no acampamento, no campo e entre todo o povo; a guarnição e o grupo de incursão também tremeram. A terra estremeceu, de modo que houve um tremor vindo de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um tremor imenso” ou “um terror divino”. A expressão hebraica pode indicar tanto a origem (“vindo de Deus”) como a intensidade.'
    reason: Leitura alternativa da construção לְחֶרְדַּת אֱלֹהִים.
lexical_decisions:
- source_word: חֲרָדָה
  choice: tremor
  rationale: Expressa o estremecimento causado pelo medo e permite conservar, em português, a repetição sonora e semântica da raiz חרד ao lado de “tremeram”.
- source_word: בַמַּחֲנֶה
  choice: no acampamento
  rationale: Tradução locativa direta e natural no contexto militar.
- source_word: בַשָּׂדֶה
  choice: no campo
  rationale: Mantém o sentido comum de שָׂדֶה sem restringi-lo indevidamente; aqui pode abranger a área aberta fora do acampamento.
- source_word: וּבְכָל הָעָם
  choice: e entre todo o povo
  rationale: Preserva o termo amplo עָם, embora o contexto permita entendê-lo como as tropas.
- source_word: הַמַּצָּב
  choice: a guarnição
  rationale: Designa adequadamente a força militar estacionada em um posto.
- source_word: הַמַּשְׁחִית
  choice: o grupo de ataque
  rationale: O particípio substantivado pode designar coletivamente a unidade que devastava ou fazia incursões; “grupo de ataque” comunica essa função militar sem recorrer à forma excessivamente literal “o destruidor”.
- source_word: חָרְדוּ גַּם הֵמָּה
  choice: também tremeram
  rationale: Conserva a ênfase de גַּם הֵמָּה e a ligação lexical com חֲרָדָה.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: A terra estremeceu
  rationale: Reproduz de modo vívido e natural o abalo físico indicado por רגז e mantém a progressão do tremor humano para o da terra.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: um tremor vindo de Deus
  rationale: Representa a leitura do genitivo como fonte, sem ocultar na nota a possibilidade de uma construção intensificadora.
theological_decisions:
- issue: Sentido de לְחֶרְדַּת אֱלֹהִים
  choice: um tremor vindo de Deus
  alternative: um tremor imenso; um terror divino
  rationale: A construção hebraica pode indicar que o tremor procedia de Deus ou empregar אֱלֹהִים para intensificar sua grandeza. O texto principal preserva a possível causalidade divina, enquanto a nota registra a leitura intensificadora legítima.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura narrativa clara. A sequência “tremor / tremeram / estremeceu / tremor” procura reproduzir a insistência sonora e temática do hebraico sem soar artificial.
