base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: pt
  text: 'Então informaram a Saul: “Veja, o povo está pecando contra Yahweh, comendo carne ainda com o sangue[a]”. Ele disse: “Vocês agiram com infidelidade. Rolem hoje para cá uma pedra grande”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “comendo sobre/com o sangue”, expressão que, neste contexto, indica comer carne sem que o sangue tenha sido devidamente escoado.
    reason: Esclarece o idiomatismo hebraico e preserva sua formulação literal.
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: Então informaram a Saul
  rationale: O verbo narrativo introduz o acontecimento seguinte, e לֵאמֹר funciona como fórmula de introdução da fala. Em português, os dois elementos podem ser expressos naturalmente por “informaram ...:” sem reproduzir o redundante “informaram ... dizendo”.
- source_word: הִנֵּה
  choice: Veja
  rationale: A partícula chama a atenção de Saul para o fato relatado; “Veja” conserva essa força em linguagem moderna.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o substantivo coletivo definido, que no contexto se refere aos homens sob o comando de Saul.
- source_word: חֹטִאים לַיהוָה
  choice: está pecando contra Yahweh
  rationale: חטא com ל indica aqui uma ofensa contra alguém. O singular “está” concorda naturalmente com o coletivo “povo” em português.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: comendo carne ainda com o sangue
  rationale: A expressão hebraica é literalmente “comer sobre/com o sangue” e, no contexto, descreve o consumo da carne sem que o sangue tenha sido devidamente escoado. A formulação explicita apenas o necessário para ser compreensível em português; a imagem literal fica registrada em nota.
- source_word: בְּגַדְתֶּם
  choice: Vocês agiram com infidelidade
  rationale: בגד comunica quebra grave de lealdade ou dever. “Agiram com infidelidade” preserva a gravidade moral sem restringir o sentido a traição interpessoal.
- source_word: גֹּלּוּ אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: Rolem hoje para cá uma pedra grande
  rationale: O imperativo plural de גלל significa literalmente “rolar”, apropriado para uma pedra grande. “Para cá” exprime de modo natural a direção אֵלַי, e “hoje” mantém הַיּוֹם sem convertê-lo interpretativamente em “agora”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Natureza da transgressão em לֶאֱכֹל עַל־הַדָּם
  choice: comer carne ainda com o sangue
  alternative: comer sobre o sangue
  rationale: O contexto imediato e as proibições da Torá sustentam a referência ao consumo de carne cujo sangue não foi devidamente escoado. A tradução evita transformar a frase numa referência certa a comer fisicamente sobre uma poça de sangue, mas a construção literal e sua possível amplitude são preservadas na nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula hebraica לֵאמֹר foi absorvida pelos dois-pontos para evitar redundância pouco natural; a ordem narrativa e a severidade da repreensão foram mantidas.
