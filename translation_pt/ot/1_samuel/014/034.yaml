  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: pt
  text: 'Saul disse: “Espalhem-se entre o povo e digam a eles: ‘Cada um traga a mim o seu boi e a sua ovelha. Abatam os animais aqui e comam, para que vocês não pequem contra Yahweh, comendo a carne com o sangue[a]’”. Naquela noite, todo o povo trouxe os animais, cada um o seu boi em sua mão[b], e os abateram ali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “comendo com/sobre o sangue”; no contexto, refere-se a comer a carne antes que o sangue tivesse sido devidamente drenado.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “cada um o seu boi em sua mão”; também pode significar “cada um conduzindo seu boi pela mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: Espalhem-se entre o povo
  rationale: O imperativo de פוץ pede que os encarregados se distribuam pelo meio do povo. “Espalhem-se” conserva a imagem concreta e soa natural em português.
- source_word: הַגִּישׁוּ אֵלַי
  choice: traga a mim
  rationale: O hifil de נגשׁ significa fazer chegar ou trazer para perto. “Traga a mim” expressa diretamente a ordem de levar os animais até Saul.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: Cada um traga a mim o seu boi e a sua ovelha
  rationale: O valor distributivo da repetição de אִישׁ é comunicado por “cada um”. שֶׂה pode designar um animal de pequeno porte, ovelha ou cabra; “ovelha” segue a leitura contextual tradicional sem acrescentar uma categoria técnica.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: Abatam os animais aqui
  rationale: שׁחט denota abater para alimentação ou sacrifício, não simplesmente matar. “Aqui” comunica o valor locativo de בָּזֶה; “os animais” explicita o objeto já mencionado.
- source_word: וַאֲכַלְתֶּם
  choice: e comam
  rationale: Mantém a sequência direta entre o abate e a refeição.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: para que vocês não pequem contra Yahweh
  rationale: A formulação expressa a finalidade preventiva da ordem, e לַיהוָה tem sentido ético-direcional, adequadamente traduzido por “contra Yahweh”.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: comendo a carne com o sangue
  rationale: O hebraico diz literalmente comer “com/sobre o sangue”. A inclusão de “a carne” torna a expressão inteligível em português sem eliminar a formulação concreta; a nota esclarece a prática em vista.
- source_word: וַיַּגִּשׁוּ כָל־הָעָם
  choice: todo o povo trouxe os animais
  rationale: O mesmo verbo נגשׁ aparece em forma narrativa. “Trouxe” é idiomático, e “os animais” retoma o objeto do mandamento sem sugerir que o texto especifique novamente as duas espécies.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: cada um o seu boi em sua mão
  rationale: A formulação conserva a expressão incomum e vívida do hebraico, deixando em nota a possibilidade de que se refira a conduzir o animal pela mão.
- source_word: הַלַּיְלָה
  choice: Naquela noite
  rationale: O termo funciona adverbialmente e situa toda a ação na noite em questão; a antecipação temporal produz narrativa natural em português.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: e os abateram ali
  rationale: “Abateram” preserva o sentido específico de שׁחט, enquanto o pronome explicita em português o objeto recuperável do contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva explicitamente o nome da aliança sem substituí-lo por um título.
- issue: Natureza do pecado ao comer אֶל־הַדָּם
  choice: Manter “com o sangue” e explicar que se trata da carne cujo sangue não havia sido devidamente drenado
  alternative: Interpretar diretamente como um rito de comer sobre sangue derramado
  rationale: A expressão hebraica admite formulação espacial ou associativa. O contexto imediato favorece carne ainda com sangue, mas a tradução e a nota evitam transformar a inferência contextual em paráfrase excessivamente dogmática.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas verbais brasileiras de uso comum (“vocês”) e vocabulário não técnico. A ordem de algumas expressões foi ajustada para fluidez narrativa, sem apagar as ambiguidades lexicais relevantes.
