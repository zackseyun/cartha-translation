  text: וַ/יֹּ֣אמֶר שָׁא֔וּל כֹּֽה יַעֲשֶׂ֥ה אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף כִּֽי מ֥וֹת תָּמ֖וּת יוֹנָתָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/044.yaml
  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: pt
  text: 'Então Saul disse[a]: “Que Deus faça assim e ainda mais, pois você certamente morrerá, Jônatas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Fórmula hebraica de juramento; literalmente: “Assim faça Deus e assim acrescente”. O texto hebraico não declara sobre quem recairia a ação ameaçada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa. “Então” expressa com naturalidade a progressão do relato em português, sem acrescentar uma relação causal.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: Que Deus faça assim e acrescente ainda mais
  rationale: Preserva a fórmula hebraica de juramento e maldição, inclusive a ausência de um objeto expresso para a ação ameaçada, em linguagem portuguesa clara e solene.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o verbo singular e o contexto indicam o Deus invocado no juramento.
- source_word: כִּי
  choice: pois
  rationale: Liga a fórmula de juramento à declaração que lhe dá conteúdo ou fundamento.
- source_word: מוֹת תָּמוּת
  choice: você certamente morrerá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da morte; “certamente morrerá” reproduz essa ênfase de modo natural.
- source_word: יוֹנָתָן
  choice: Jônatas
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
theological_decisions:
- issue: Objeto implícito na fórmula de juramento
  choice: Que Deus faça assim e acrescente ainda mais
  alternative: Que Deus faça isso comigo e ainda mais
  rationale: O hebraico não explicita “comigo”. A tradução conserva essa elipse e evita acrescentar uma autoimprecação que, embora convencionalmente subentendida, não está expressa no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” para comunicar diretamente a fala dirigida a Jônatas. A fórmula do juramento mantém deliberadamente a concisão e a ambiguidade do hebraico.
