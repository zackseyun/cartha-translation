  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: pt
  text: Ele lutou com bravura[a] e feriu Amaleque[b], e livrou Israel da mão de quem o saqueava.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “fez valor/força”, expressão idiomática que pode indicar agir valentemente ou alcançar êxito militar.'
    reason: lexical_alternative
  - marker: b
    text: “Amaleque” designa aqui, coletivamente, o povo amalequita.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “da mão de seu saqueador”. O singular pode ter sentido coletivo, tendo Israel como referente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: lutou com bravura
  rationale: A expressão idiomática significa literalmente algo como “fez força/valor” e, neste contexto militar, comunica ação valente ou êxito em combate. “Lutou com bravura” transmite o sentido com naturalidade sem reduzir a expressão simplesmente a vitória.
- source_word: וַיַּךְ
  choice: feriu
  rationale: O verbo נכה pode significar ferir, golpear ou derrotar. “Feriu” conserva a imagem verbal hebraica e deixa em aberto a extensão da vitória.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Mantém o etnônimo singular do hebraico, usado coletivamente para o povo amalequita.
- source_word: וַיַּצֵּל
  choice: livrou
  rationale: No hifil, נצל expressa retirar do perigo, resgatar ou livrar. “Livrou” é claro, tradicional e adequado ao contexto militar.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Preserva a metáfora hebraica da mão como poder ou domínio, ainda natural em português.
- source_word: שֹׁסֵהוּ
  choice: quem o saqueava
  rationale: O particípio designa o saqueador, e o sufixo masculino singular retoma Israel. A construção portuguesa “quem o saqueava” preserva o número indefinido do agente e a referência singular a Israel.
