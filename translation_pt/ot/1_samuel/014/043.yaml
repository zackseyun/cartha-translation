base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: pt
  text: 'Então Saul disse a Jônatas: “Conte-me o que você fez”. Jônatas lhe contou e disse: “De fato, provei um pouco de mel com a ponta do cajado que estava em minha mão. E aqui estou: vou morrer!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De fato, provei um pouco de mel com a ponta do cajado que estava em minha mão — e agora tenho de morrer?” O hebraico enfatiza o verbo “provar”, e a frase final pode ser entendida como uma declaração resignada ou como um protesto retórico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Conte-me
  rationale: O imperativo de נגד com pronome dativo pede uma ordem direta; “Conte-me” é natural, claro e preserva o tom exigente de Saul.
- source_word: מֶה עָשִׂיתָה
  choice: o que você fez
  rationale: Expressa de modo idiomático uma ação concluída cujas consequências estão sendo apuradas.
- source_word: וַיַּגֶּד לוֹ
  choice: lhe contou
  rationale: Mantém a correspondência lexical com o verbo anterior sem tornar a narrativa excessivamente formal.
- source_word: טָעֹם טָעַמְתִּי
  choice: De fato, provei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica ou confirma a ação. “De fato” preserva essa ênfase sem impor que a expressão signifique apenas minimização.
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: com a ponta do cajado
  rationale: No contexto, a ponta do cajado é o instrumento com que Jônatas tomou e provou o mel; “com” comunica naturalmente essa relação em português.
- source_word: הַמַּטֶּה
  choice: cajado
  rationale: Designa com naturalidade o bastão comprido que Jônatas levava na mão nesta cena.
- source_word: מְעַט דְּבַשׁ
  choice: um pouco de mel
  rationale: É a equivalência direta, clara e idiomática da expressão quantitativa hebraica.
- source_word: הִנְנִי
  choice: E aqui estou
  rationale: Preserva a força dêitica e exclamativa de הִנְנִי em português atual e digno.
- source_word: אָמֽוּת
  choice: vou morrer
  rationale: O imperfeito, à luz da sentença iminente, pode exprimir futuro próximo; a formulação também permite ouvir resignação ou protesto retórico.
theological_decisions:
- issue: Tom da declaração final de Jônatas
  choice: 'Manter no texto uma afirmação exclamativa: “E aqui estou: vou morrer!”'
  alternative: 'Ler como pergunta retórica: “E agora tenho de morrer?”'
  rationale: O hebraico não traz marca interrogativa e admite tanto resignação quanto protesto. O texto principal conserva a forma declarativa, enquanto a nota registra a ambiguidade real sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso permanece direto e solene sem arcaísmos. A repetição narrativa “lhe contou e disse” foi mantida para refletir a estrutura hebraica, e a ambiguidade do desfecho foi preservada por meio de nota.
