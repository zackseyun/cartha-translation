  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: pt
  text: 'Se eles nos disserem: “Fiquem aí[a] até chegarmos a vocês”, então permaneceremos onde estamos[b] e não subiremos até eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Fiquem parados” ou “Esperem”. O imperativo hebraico pode indicar permanecer imóvel ou em silêncio no mesmo lugar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ficaremos de pé sob nós mesmos”, expressão idiomática que significa permanecer no próprio lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Partícula condicional padrão que introduz o sinal proposto por Jônatas.
- source_word: כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: eles nos disserem
  rationale: Em português, a introdução direta da fala torna desnecessária uma tradução isolada de כֹּה como “assim”, cujo valor introdutório permanece expresso pelos dois-pontos.
- source_word: דֹּמּוּ
  choice: Fiquem aí
  rationale: O imperativo de דמם pode indicar ficar imóvel, calado ou no mesmo lugar; neste contexto militar, “Fiquem aí” comunica naturalmente a ordem de não avançar, sem excluir totalmente a ideia de esperar.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: até chegarmos a vocês
  rationale: Expressa de modo natural o movimento dos filisteus em direção a Jônatas e ao seu escudeiro.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: então permaneceremos onde estamos
  rationale: O waw após a condição indica o resultado; תַחְתֵּינוּ integra uma expressão idiomática de permanência na própria posição.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: e não subiremos até eles
  rationale: Preserva o movimento ascendente indicado por עלה e a topografia da cena, sem explicitar indevidamente a ideia de ataque.
