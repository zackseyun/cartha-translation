translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto no Brasil quanto em outros contextos lusófonos. A fala direta mantém o plural dirigido a Jônatas e ao seu escudeiro; “subiremos” conserva a dimensão topográfica do hebraico.
