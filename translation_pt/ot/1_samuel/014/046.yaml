base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/046.yaml
  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: pt
  text: Então Saul deixou de perseguir os filisteus[a], e os filisteus foram para o seu próprio lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Então Saul se afastou da perseguição aos filisteus». O hebraico diz literalmente «subiu de após os filisteus», expressão que, neste contexto, indica o fim da perseguição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: deixou
  rationale: Embora עלה signifique literalmente «subir», a construção com מֵאַחֲרֵי, neste contexto militar, indica afastar-se da perseguição. «Deixou de perseguir» comunica naturalmente o sentido da expressão inteira em português.
- source_word: מֵאַחֲרֵי
  choice: de perseguir
  rationale: A expressão significa literalmente «de detrás de». No contexto militar, refere-se a cessar a perseguição; «de perseguir» preserva esse valor idiomático sem sugerir que Saul simplesmente caminhava atrás deles.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa consagrada para o nome do povo, com artigo definido natural neste contexto.
- source_word: הָלְכוּ
  choice: foram
  rationale: Tradução direta do verbo הלך, «ir». Evita acrescentar a ideia mais específica de «voltaram», embora ela seja possível no contexto.
- source_word: לִמְקוֹמָם
  choice: para o seu próprio lugar
  rationale: מָקוֹם significa «lugar», e o sufixo indica posse plural. «Seu próprio lugar» é natural e mantém a formulação relativamente aberta, sem especificá-la como «casa» ou «terra».
