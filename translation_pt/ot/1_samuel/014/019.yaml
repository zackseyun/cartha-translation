base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: pt
  text: 'Enquanto Saul falava ao sacerdote, o tumulto no acampamento dos filisteus ia aumentando cada vez mais. Então Saul disse ao sacerdote: “Retire a mão”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ajunte a sua mão”. Saul manda o sacerdote interromper o ato que estava realizando.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: Enquanto Saul ainda falava
  rationale: A fórmula narrativa וַיְהִי, unida a עַד דִּבֶּר, introduz uma ação simultânea que segue até ser interrompida. Em português, “enquanto ... ainda falava” transmite naturalmente essa progressão sem exigir a reprodução mecânica de “e aconteceu”.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta de כֹּהֵן; o artigo definido é mantido porque o sacerdote já está identificado no contexto.
- source_word: הֶהָמוֹן
  choice: a confusão
  rationale: המון designa aqui a agitação ruidosa e desordenada no acampamento filisteu. “Confusão” comunica tanto o tumulto quanto a desordem em linguagem corrente.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: no acampamento dos filisteus
  rationale: Reprodução clara e natural da construção hebraica, preservando a referência ao acampamento pertencente aos filisteus.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: aumentava cada vez mais
  rationale: A combinação do verbo finito com o infinitivo absoluto expressa intensificação progressiva. A formulação portuguesa mantém esse desenvolvimento contínuo.
- source_word: אֱסֹף יָדֶךָ
  choice: Recolha a mão
  rationale: Preserva a imagem concreta da expressão hebraica, literalmente “reúna/recolha sua mão”, enquanto a nota esclarece que Saul ordena ao sacerdote que interrompa o que fazia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura foi integrada à oração temporal para evitar uma fórmula narrativa artificial em português. A expressão final conserva a imagem hebraica e recebe esclarecimento em nota.
