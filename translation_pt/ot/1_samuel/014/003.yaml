  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: pt
  text: Aías, filho de Aitube, irmão de Icabô, filho de Fineias, filho de Eli, sacerdote de Yahweh em Siló, levava um éfode.[a] O povo não sabia que Jônatas tinha partido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vestia um éfode”. O hebraico diz literalmente “levava/carregava um éfode”.'
    reason: Alternativa lexical que preserva a ambiguidade sobre a maneira como Aías portava o éfode.
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Aías
  rationale: O waw dá continuidade à narrativa, sem exigir um marcador temporal como “Ora”. O nome segue a forma portuguesa tradicional e inteligível.
- source_word: בֶן אֲחִטוּב
  choice: filho de Aitube
  rationale: Preserva diretamente a construção genealógica hebraica.
- source_word: אֲחִי אִיכָבוֹד
  choice: irmão de Icabô
  rationale: “Irmão” é o sentido direto de אֲחִי; não há razão contextual para ampliá-lo para “parente”.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: filho de Fineias, filho de Eli
  rationale: Mantém explícita a cadeia de descendência do texto hebraico.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: sacerdote de Yahweh em Siló
  rationale: A aposição identifica Aías e mantém a ligação locativa com Siló sem acrescentar uma definição ausente no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נֹשֵׂא אֵפוֹד
  choice: levava um éfode
  rationale: נשא significa fundamentalmente levar ou carregar. “Levava” preserva essa amplitude sem decidir se o éfode estava vestido ou transportado.
- source_word: וְ/הָ/עָם לֹא יָדַע
  choice: O povo não sabia
  rationale: O substantivo coletivo singular e o verbo singular são vertidos naturalmente em português; a continuidade narrativa dispensa “E”.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: que Jônatas tinha partido
  rationale: A oração introduz o conteúdo do desconhecimento, e o mais-que-perfeito composto indica que a partida antecedeu esse estado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino. “Yahweh” preserva essa forma como nome e evita substituí-la por um título.
- issue: Função do éfode
  choice: levava um éfode
  alternative: vestia um éfode
  rationale: O contexto sacerdotal permite entender que o éfode era usado como vestimenta, mas o verbo hebraico não determina inequivocamente a maneira de portá-lo; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas onomásticas correntes em português. A longa genealogia foi mantida, e a ambiguidade cultual de נֹשֵׂא אֵפוֹד foi explicitada em nota.
