  text: וְ/הָ/עִבְרִ֗ים הָי֤וּ לַ/פְּלִשְׁתִּים֙ כְּ/אֶתְמ֣וֹל שִׁלְשׁ֔וֹם אֲשֶׁ֨ר עָל֥וּ עִמָּ֛/ם בַּֽ/מַּחֲנֶ֖ה סָבִ֑יב וְ/גַם הֵ֗מָּה לִֽ/הְיוֹת֙ עִם יִשְׂרָאֵ֔ל אֲשֶׁ֥ר עִם שָׁא֖וּל וְ/יוֹנָתָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: pt
  text: Os hebreus que anteriormente tinham estado com os filisteus[a] e haviam subido com eles ao acampamento nas redondezas[b] — também eles passaram a estar com Israel[c], que estava com Saul e Jônatas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “como ontem e anteontem”, expressão idiomática que significa “anteriormente” ou “outrora”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida como “ao acampamento nas redondezas” é difícil. Também pode ser entendida como “ao acampamento, ao redor” ou como referência aos hebreus que acompanhavam os filisteus em seu acampamento pela região circundante.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “também eles, para estar com Israel”. A construção sugere uma mudança de associação; também se pode traduzir “também vieram a estar com Israel”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: Os hebreus
  rationale: Mantém a designação específica “hebreus”, em vez de substituí-la por “israelitas”. A conjunção narrativa não exige um marcador como “Ora” no início da frase.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: tinham estado com os filisteus
  rationale: A construção indica associação com os filisteus; “com” evita afirmar posse ou submissão formal além do que o hebraico diz. O mais-que-perfeito situa essa associação antes da mudança descrita a seguir.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: anteriormente
  rationale: Traduz naturalmente o idioma hebraico que, de forma literal, remete a “ontem e anteontem” e significa “antes” ou “outrora”.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: e haviam subido com eles
  rationale: Preserva o verbo direcional עלה e identifica os hebreus que acompanharam os filisteus.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: ao acampamento nas redondezas
  rationale: Oferece uma formulação portuguesa inteligível para uma expressão hebraica sintaticamente difícil, mantendo a ideia espacial de um acampamento na área ao redor sem definir além do necessário a relação exata de סָבִיב.
- source_word: וְגַם הֵמָּה
  choice: também
  rationale: Comunica a inclusão enfática desses hebreus no grupo que passou a estar com Israel; a própria menção explícita do sujeito fornece parte da ênfase em português.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: passaram a ficar com Israel
  rationale: Conserva o sentido básico de “estar/ficar com” e torna natural em português a mudança de associação implícita no contexto, sem explicitar uma deserção ou conversão política que o texto não nomeia.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: que estava com Saul e Jônatas
  rationale: O relativo modifica naturalmente “Israel” como coletivo; por isso, a concordância singular é adequada em português.
theological_decisions:
- issue: Natureza da mudança dos hebreus para Israel
  choice: passaram a ficar com Israel
  alternative: juntaram-se a Israel / mudaram para o lado de Israel
  rationale: A tradução expressa a mudança contextual de associação, mas evita determinar se ela foi uma deserção militar formal, uma restauração de lealdade étnica ou outra espécie de realinhamento.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. Empregou-se “acampamento”, “anteriormente” e “passaram a ficar com” para evitar arcaísmos, mantendo em notas as dificuldades e alternativas reais do hebraico.
