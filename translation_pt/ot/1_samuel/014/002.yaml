  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: pt
  text: Saul estava nos arredores de Gibeá[a], debaixo da romãzeira[b] que fica em Migrom, e o povo que estava com ele somava cerca de seiscentos homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estava sentado na extremidade de Gibeá”. O particípio hebraico pode indicar tanto estar sentado como permanecer ou estar em determinado lugar.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “debaixo da romã”; “romãzeira” explicita que se trata da árvore.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: estava
  rationale: O particípio de ישׁב pode indicar estar sentado, habitar ou permanecer em um lugar. No contexto narrativo e militar, “estava” comunica naturalmente a localização continuada de Saul sem limitar o sentido à sua postura; a possibilidade de “estava sentado” é registrada em nota.
- source_word: בִּקְצֵה
  choice: nos arredores de
  rationale: קָצֶה designa uma extremidade, borda ou limite. “Nos arredores de” é natural em português para a localização periférica junto a uma cidade, sem impor um ponto geográfico excessivamente preciso.
- source_word: הַגִּבְעָה
  choice: Gibeá
  rationale: Embora גִּבְעָה possa significar “colina”, o contexto aponta para o topônimo ligado a Saul; por isso, conserva-se o nome próprio tradicional em português.
- source_word: תַּחַת הָרִמּוֹן
  choice: debaixo da romãzeira
  rationale: רִמּוֹן significa literalmente “romã”, mas nesta expressão locativa se refere naturalmente à árvore. “Romãzeira” torna o referente claro e idiomático em português.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: que fica em Migrom
  rationale: A oração relativa identifica a localização da romãzeira. O presente “fica” é idiomático para descrição geográfica dentro de uma narrativa no passado.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: e o povo que estava com ele
  rationale: עָם é “povo” e, neste contexto, pode referir-se ao contingente que acompanhava Saul. Mantém-se o termo amplo do hebraico, sem estreitá-lo explicitamente para “tropas”.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: somava cerca de seiscentos homens
  rationale: O prefixo כְּ indica aproximação, preservada por “cerca de”. O verbo “somava” permite expressar de modo natural em português a quantidade do substantivo coletivo “povo”, e אִישׁ após o numeral é vertido por “homens”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas toponímicas usuais em português (“Gibeá”, “Migrom”). A construção com “somava” evita a falta de naturalidade de fazer o coletivo “povo” concordar diretamente com “seiscentos homens”. Os dois marcadores de nota aparecem junto às expressões a que se referem.
