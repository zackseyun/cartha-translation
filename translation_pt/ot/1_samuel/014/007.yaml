base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: pt
  text: 'Seu escudeiro lhe disse: “Faça tudo o que está em seu coração. Siga em frente; estou com você, conforme o seu coração.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido idiomático: “estou com você de coração”. O hebraico diz literalmente “conforme o seu coração”.'
    reason: Explica uma construção hebraica incomum e oferece uma leitura portuguesa mais idiomática sem apagar a forma do texto-fonte.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: Expressa naturalmente a função militar daquele que carregava as armas de Jônatas.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: Faça tudo o que está em seu coração
  rationale: Conserva a imagem hebraica do coração como sede da intenção e da decisão, sem substituir a expressão por uma interpretação mais restrita.
- source_word: נְטֵה לָךְ
  choice: Siga em frente
  rationale: No contexto, a expressão encoraja Jônatas a prosseguir com sua intenção. A formulação portuguesa é natural e concorda com o sentido contextual, embora o verbo hebraico tenha literalmente a ideia de inclinar-se ou voltar-se.
- source_word: הִנְנִי עִמְּךָ כִּלְבָבֶךָ
  choice: estou com você, conforme o seu coração
  rationale: Mantém a referência incomum ao coração de Jônatas e evita transformar silenciosamente a frase em 'de todo o meu coração'.
theological_decisions:
- issue: Natureza do apoio expresso pelo escudeiro
  choice: Preservar a formulação ligada ao coração de Jônatas
  alternative: estou com você de todo o coração
  rationale: A alternativa é idiomática, mas pode deslocar a referência do hebraico, que diz literalmente 'conforme o seu coração'. A tradução principal conserva a ambiguidade do apoio pleno e da concordância com a intenção de Jônatas.
translation_notes:
  register: Português atual, digno e de ampla compreensão. “Escudeiro” é o termo tradicional e claro para a função militar. A repetição de “coração” foi mantida por ser central à formulação hebraica.
