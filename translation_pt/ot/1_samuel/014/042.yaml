  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַפִּ֕ילוּ בֵּינִ֕/י וּ/בֵ֖ין יוֹנָתָ֣ן בְּנִ֑/י וַ/יִּלָּכֵ֖ד יוֹנָתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: pt
  text: 'Então Saul disse[a]: “Lancem sortes entre mim e meu filho Jônatas”. E Jônatas foi escolhido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Façam cair entre mim e meu filho Jônatas”, no sentido de decidir a questão por sorteio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  choice: Lancem sortes
  rationale: O imperativo hifil de נפל significa literalmente “façam cair”, mas, no contexto da consulta por sortes, a expressão idiomática em português é “lancem sortes”. O objeto implícito é explicitado para dar clareza.
- source_word: בֵּינִי וּבֵין
  choice: entre mim e
  rationale: A construção preposicional correlativa distingue as duas partes entre as quais a sorte deve decidir.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva de modo direto a relação filial masculina indicada por בֵּן com o sufixo da primeira pessoa.
- source_word: וַיִּלָּכֵד
  choice: foi escolhido
  rationale: O nifal de לכד significa literalmente “foi apanhado” ou “foi capturado”; neste contexto, indica que Jônatas foi aquele sobre quem recaiu a sorte. “Foi escolhido” comunica naturalmente o resultado sem acrescentar condenação ou culpa.
- source_word: יוֹנָתָן
  choice: Jônatas
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמֶר
  choice: Então Saul disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem “meu filho Jônatas” evita a possível leitura de que “Jônatas, meu filho” seja uma terceira parte da escolha.
