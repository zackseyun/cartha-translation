base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: pt
  text: 'Então ele disse a todo o Israel: “Vocês fiquem de um lado[a], e eu e meu filho Jônatas ficaremos do outro lado.” O povo disse a Saul: “Faça o que parecer bom aos seus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estejam para um lado”. No contexto, a expressão indica que os dois grupos deviam tomar posições em lados opostos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: de um lado / do outro lado
  rationale: עֵבֶר designa um lado ou região além de algo. Neste contexto de lançamento de sortes, a expressão contrapõe claramente dois grupos; a formulação portuguesa conserva essa imagem espacial sem acrescentar uma interpretação.
- source_word: תִּהְיוּ / נִהְיֶה
  choice: ficarão / ficaremos
  rationale: Embora היה signifique normalmente “ser/estar”, em combinação com לְעֵבֶר אֶחָד indica que cada grupo deve ocupar sua posição. “Ficar de um lado” é natural em português e mantém o paralelismo das duas orações.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a designação coletiva do povo reunido e corresponde a uma expressão bíblica corrente e inteligível em português.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva explicitamente a relação filial indicada pelo hebraico.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: o que parecer bom aos seus olhos
  rationale: Conserva a imagem do idioma hebraico, que expressa aquilo que alguém considera bom ou correto, sem tornar a frase obscura em português atual.
- source_word: עֲשֵׂה
  choice: Faça
  rationale: Imperativo direto e natural, cujo objeto é a oração anterior.
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: Então ele disse / O povo disse
  rationale: Reproduz a progressão narrativa de modo fluente em português, evitando repetição mecânica da conjunção hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “vocês” torna explícito o plural dirigido a todo o Israel; “seus olhos” preserva o idioma hebraico de forma compreensível.
