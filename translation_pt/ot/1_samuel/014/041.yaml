base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: pt
  text: 'Então Saul disse a Yahweh, o Deus de Israel: “Dá uma decisão perfeita[a]”. E Jônatas e Saul foram escolhidos, mas o povo saiu livre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Dá perfeito/íntegro”. Provavelmente se trata de um pedido por uma decisão inequívoca mediante sorteio. Compare a leitura antiga mais longa preservada na Septuaginta: “Por que não respondeste hoje ao teu servo? Se esta culpa está em mim ou em Jônatas, meu filho, ó Yahweh, Deus de Israel, dá Urim; mas, se está em teu povo Israel, dá Tumim”.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: הָבָה
  choice: Dá
  rationale: Reproduz de modo direto e natural o pedido imperativo dirigido a Deus.
- source_word: תָמִים
  choice: uma indicação perfeita
  rationale: O adjetivo significa literalmente completo, íntegro ou irrepreensível. No contexto de sorteio, “indicação” explicita com cautela o resultado solicitado sem inserir no texto a palavra “sorte”, ausente do hebraico.
- source_word: וַיִּלָּכֵד
  choice: foram apontados
  rationale: No contexto judicial de lançamento de sortes, o verbo indica ser identificado ou escolhido. “Foram apontados” comunica esse sentido sem sugerir captura física.
- source_word: יָצָאוּ
  choice: ficou livre
  rationale: Em contraste com os que foram apontados, o povo não foi selecionado pela sorte. A formulação transmite essa consequência contextual em português corrente.
theological_decisions:
- issue: Forma textual da oração de Saul
  choice: 'Seguir no texto principal a forma breve do Texto Massorético: “Dá uma indicação perfeita”.'
  alternative: Adotar a leitura antiga mais longa preservada na Septuaginta, que menciona explicitamente Urim e Tumim.
  rationale: A fonte hebraica fornecida contém a leitura breve e difícil. A variante longa é relevante para compreender a passagem, mas não deve substituir silenciosamente o texto-base; por isso, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva a concisão e a dificuldade do hebraico, enquanto a nota apresenta a principal variante textual antiga.
