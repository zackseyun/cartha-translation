base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: pt
  text: Os vigias de Saul, em Gibeá de Benjamim, olharam, e eis que a multidão se desfazia e se movia de um lado para outro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a massa se desfazia e ia para cá e para lá”. A formulação hebraica é concisa e retrata a confusão visível entre os filisteus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: os vigias
  rationale: O particípio de צפה designa homens encarregados de observar. “Vigias” é natural em português e adequado ao contexto militar.
- source_word: לְשָׁאוּל
  choice: de Saul
  rationale: 'Aqui, a preposição ל marca associação: eram os vigias ligados a Saul.'
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: em Gibeá de Benjamim
  rationale: Reproduz de modo claro a localização e a identificação do lugar.
- source_word: וַיִּרְאוּ
  choice: olharam
  rationale: No contexto dos vigias, o verbo descreve o ato deliberado de observar, não apenas a percepção de algo.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva o marcador hebraico que chama vividamente a atenção para a cena observada.
- source_word: הֶהָמוֹן
  choice: a multidão
  rationale: הָמוֹן pode indicar multidão, massa de gente ou tropel. “Multidão” mantém o sentido coletivo sem identificar explicitamente o grupo além do que o versículo diz.
- source_word: נָמוֹג
  choice: se desfazia
  rationale: O verbo מוג evoca algo que derrete ou perde coesão. “Se desfazia” conserva a imagem de desintegração e soa natural em referência a uma força militar.
- source_word: וַיֵּלֶךְ וַהֲלֹם
  choice: e se movia de um lado para outro
  rationale: A construção hebraica é breve e incomum, mas no contexto retrata movimento desordenado. Esta formulação comunica a confusão visível sem especificar sua causa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se “e eis que” para reproduzir a vivacidade narrativa do hebraico, enquanto “se movia de um lado para outro” comunica naturalmente sua expressão final incomum.
