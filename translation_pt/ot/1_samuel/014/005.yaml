  - marker: b
    text: Algumas traduções trazem “Gibeá” neste ponto, mas o topônimo hebraico é Geba.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: penhascos
  rationale: Literalmente, “dente”; neste contexto topográfico, é uma metáfora para uma saliência rochosa aguda. “Penhasco” comunica naturalmente a formação rochosa sem apagar por completo a força da imagem.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: um ... o outro
  rationale: A repetição distributiva distingue as duas formações rochosas; “um ... o outro” é a construção portuguesa natural.
- source_word: מָצוּק
  choice: erguia-se
  rationale: O termo descreve uma formação íngreme, destacada ou firmemente situada. “Erguia-se” exprime sua presença e proeminência topográfica em português natural.
- source_word: מִצָּפוֹן
  choice: ao norte
  rationale: A expressão indica a localização no lado norte da passagem, em contraste paralelo com o sul.
- source_word: מוּל
  choice: em frente a
  rationale: Indica posição frontal ou correspondente; “em frente a” é claro e natural na descrição geográfica.
- source_word: מִכְמָשׂ
  choice: Micmás
  rationale: Forma portuguesa corrente do topônimo bíblico.
- source_word: מִנֶּגֶב
  choice: ao sul
  rationale: Aqui נגב designa o lado sul, em contraste com o norte.
- source_word: גָּבַע
  choice: Geba
  rationale: A forma hebraica e o contexto geográfico sustentam o topônimo “Geba”, distinto de “Gibeá”.
