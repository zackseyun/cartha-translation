  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: pt
  text: Um penhasco[a] erguia-se ao norte, em frente a Micmás; o outro, ao sul, em frente a Geba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “dente”, metáfora para uma saliência rochosa aguda; daí “penhasco”.
