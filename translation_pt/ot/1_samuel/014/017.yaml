base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: pt
  text: 'Então Saul disse ao povo que estava com ele: “Por favor, façam a contagem[a] e vejam quem saiu do nosso meio.” Eles fizeram a contagem, e eis que Jônatas e seu escudeiro não estavam ali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “passem em revista” ou “contem”; o verbo hebraico pode indicar a inspeção ou contagem dos presentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: façam a contagem / fizeram a contagem
  rationale: Neste contexto, פקד se refere a verificar o pessoal presente para descobrir quem faltava. “Fazer a contagem” é natural e preserva a repetição do verbo hebraico.
- source_word: נָא
  choice: Por favor
  rationale: A partícula suaviza a ordem; “por favor” comunica sua força de pedido em português atual.
- source_word: וּרְאוּ
  choice: e vejam
  rationale: Mantém a sequência das ordens e o sentido de verificar ou descobrir, sem explicitar além do hebraico.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: quem saiu do nosso meio
  rationale: A expressão indica afastamento do grupo; “do nosso meio” preserva o sentido coletivo de מֵעִמָּנוּ.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Conserva a força narrativa de uma descoberta digna de atenção, em registro elevado mas compreensível.
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: Jônatas e seu escudeiro não estavam ali
  rationale: Expressa de modo idiomático a ausência indicada pela construção hebraica com אֵין.
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: É o equivalente tradicional e claro para a função militar literalmente descrita como aquele que carrega suas armas ou seus equipamentos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém a repetição lexical do hebraico e preserva “e eis que” para marcar a descoberta narrativa.
