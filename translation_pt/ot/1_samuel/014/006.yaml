  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: pt
  text: 'Então Jônatas disse ao jovem que carregava suas armas: “Venha, vamos atravessar até o posto avançado[a] destes incircuncisos[b]. Talvez Yahweh aja em nosso favor, pois nada pode impedir[c] Yahweh de salvar, seja com muitos, seja com poucos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guarnição” ou “posição militar”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “estes incircuncisos”; aqui, uma expressão de censura com forte conotação ligada à aliança.
    reason: cultural_note
  - marker: c
    text: Literalmente, “não há impedimento para Yahweh salvar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: o jovem que carregava suas armas
  rationale: Reproduz a construção participial hebraica e comunica com naturalidade a função militar, sem depender do termo tradicional mais técnico “escudeiro”.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Venha, vamos atravessar
  rationale: Mantém o imperativo seguido do coortativo, expressando convite e decisão conjunta; “atravessar” se ajusta ao movimento no terreno.
- source_word: מַצַּב
  choice: posto avançado
  rationale: No contexto militar, designa uma posição ocupada pelos filisteus. “Posto avançado” é claro e natural; “guarnição” também é possível.
- source_word: הָעֲרֵלִים
  choice: estes incircuncisos
  rationale: Preserva o adjetivo substantivado e sua força de censura ligada à aliança, sem substituí-lo pelo nome étnico “filisteus”.
- source_word: אוּלַי
  choice: Talvez
  rationale: Conserva a esperança de Jônatas sem transformar sua expectativa em certeza.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: Yahweh aja em nosso favor
  rationale: O verbo hebraico é amplo, “fazer/agir”; esta formulação expressa uma intervenção favorável sem especificar além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַעְצוֹר
  choice: nada pode impedir
  rationale: Expressa em português corrente a ausência de barreira ou restrição à ação salvadora de Yahweh.
- source_word: לְהוֹשִׁיעַ
  choice: de salvar
  rationale: Mantém o sentido amplo do verbo, que neste contexto inclui libertação militar.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: seja com muitos, seja com poucos
  rationale: Preserva o contraste numérico e apresenta muitos ou poucos como os meios humanos por meio dos quais Yahweh pode salvar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Grau de certeza em אוּלַי
  choice: Talvez Yahweh aja em nosso favor
  alternative: Yahweh agirá em nosso favor
  rationale: A partícula expressa possibilidade e esperança, não certeza explícita; a tradução evita atribuir a Jônatas uma presunção que o texto não afirma.
- issue: Força de הָעֲרֵלִים
  choice: estes incircuncisos
  alternative: estes filisteus
  rationale: A expressão tem carga pactual e depreciativa. Preservá-la mantém a tensão teológica e retórica do texto, em vez de reduzi-la a uma identificação étnica neutra.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A fala conserva o tom resoluto de Jônatas, mas também a incerteza genuína de “talvez”. Emprega “armas” em sentido abrangente para o equipamento militar e mantém “incircuncisos” por sua importância retórica e pactual.
