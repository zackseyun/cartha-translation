  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: pt
  text: O nome da esposa de Saul era Ainoã, filha de Aimaás; e o nome do comandante do seu exército era Abner, filho de Ner, que era tio de Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parente de Saul”. O termo hebraico pode designar de modo mais amplo um parente próximo do sexo masculino. No contexto genealógico, “tio” é o sentido mais provável; o versículo seguinte indica que a expressão se refere a Ner.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: O nome ... era
  rationale: A construção nominal hebraica introduz informações de identificação; esta formulação conserva seu caráter e soa natural em português.
- source_word: אֵשֶׁת
  choice: esposa
  rationale: No estado construto com o nome de Saul, o termo indica claramente a relação matrimonial.
- source_word: בַּת
  choice: filha de
  rationale: É a forma genealógica padrão e natural em português.
- source_word: שַׂר צְבָאוֹ
  choice: comandante do seu exército
  rationale: No contexto militar, שַׂר designa o chefe das forças, e צְבָאוֹ refere-se ao exército de Saul.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente português normal da fórmula patronímica hebraica.
- source_word: דּוֹד
  choice: tio
  rationale: No contexto genealógico, o sentido mais provável é um parente masculino da geração anterior, especificamente o tio; a genealogia do versículo seguinte favorece a identificação de Ner como tio de Saul.
theological_decisions:
- issue: Sentido e referente de דּוֹד na genealogia de Saul
  choice: Ner, tio de Saul
  alternative: parente de Saul; ou Abner como tio/parente de Saul
  rationale: A ordem hebraica permite alguma incerteza de vinculação, mas o versículo seguinte apresenta Quis, pai de Saul, e Ner, pai de Abner, como filhos de Abiel, favorecendo que Ner seja o tio de Saul. O sentido mais amplo de 'parente' permanece lexicalmente possível e é registrado em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Empregou-se “esposa” e “comandante do seu exército” por naturalidade contemporânea; o ponto e vírgula preserva as duas identificações paralelas do hebraico.
