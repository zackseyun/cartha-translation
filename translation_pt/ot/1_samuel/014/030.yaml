  to: Quanto mais, se hoje o povo tivesse comido do despojo de seus inimigos que o povo encontrou! Então a matança entre os filisteus teria sido muito maior.[a]
  rationale: Foi corrigida a relação sintática de “despojo”, “inimigos” e “encontrou”, sem alterar o sentido contrafactual nem a avaliação de que as perdas filisteias teriam sido maiores. A repetição de “o povo” é deliberada para deixar explícito o sujeito de “encontrou” e evitar que a oração relativa pareça modificar “inimigos”.
