  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: pt
  text: Quanto mais, se hoje o povo tivesse comido do despojo de seus inimigos que o povo encontrou! Então a matança entre os filisteus teria sido muito maior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De fato, se ao menos o povo tivesse comido hoje do despojo de seus inimigos que o povo encontrou, então o golpe contra os filisteus teria sido maior!”'
    reason: Alternativa que representa אַף כִּי לוּא como desejo contrafactual enfático e מַכָּה como “golpe”.
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: Quanto mais se
  rationale: A combinação introduz enfaticamente uma possibilidade contrária aos fatos e estabelece contraste com o resultado real; a formulação preserva o movimento argumentativo de Jônatas.
- source_word: אָכֹל אָכַל
  choice: tivesse comido
  rationale: O infinitivo absoluto intensifica o verbo, mas o contexto e a construção exclamativa já comunicam a ênfase; acrescentar “à vontade” introduziria uma ideia não explicitada lexicalmente.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: do despojo ... entre os seus inimigos
  rationale: שָׁלָל é o despojo ou saque de guerra. O sufixo singular pode concordar com o coletivo “povo”; “seus” mantém em português a referência sem forçar uma distinção numérica.
- source_word: אֲשֶׁר מָצָא
  choice: que encontrou
  rationale: O verbo hebraico está no singular, concordando com o coletivo “povo”; o singular coletivo é natural e formalmente fiel em português.
- source_word: מַכָּה
  choice: matança
  rationale: No contexto militar, מַכָּה designa o golpe que causa baixas, podendo denotar matança ou derrota; “matança” combina naturalmente com “entre os filisteus” e expressa a extensão das perdas.
- source_word: לֹא רָבְתָה
  choice: teria sido muito maior
  rationale: A pergunta retórica negativa hebraica, dentro da condição irreal, afirma que as baixas teriam aumentado muito; a forma condicional composta é idiomática em português.
- source_word: בַּפְּלִשְׁתִּים
  choice: entre os filisteus
  rationale: A preposição בְּ pode marcar a esfera em que ocorreu o golpe; “entre” retrata as baixas nas fileiras filisteias, sem excluir o sentido de ação contra eles.
