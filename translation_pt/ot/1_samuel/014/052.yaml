    rationale: גִּבּוֹר pode designar homem poderoso, forte ou valente; o contexto favorece uma leitura militar, mas o substantivo «guerreiro» acrescenta uma especificação que pode permanecer implícita.
  - severity: medium
    issue: «ele o reunia a si» é uma construção pouco idiomática em português moderno.
    rationale: Embora calcada em וַיַּאַסְפֵהוּ אֵלָיו, a formulação é estranha em português. «Tomava-o para si» preserva a orientação pessoal da expressão e, com a nota, comunica o sentido de recrutamento.
