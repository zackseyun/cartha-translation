revisions:
- from: A guerra contra os filisteus foi intensa[a] durante todos os dias de Saul. Sempre que Saul via algum guerreiro poderoso ou algum homem valente[b], ele o reunia a si[c].
  to: A guerra contra os filisteus foi intensa[a] durante todos os dias de Saul. Sempre que Saul via algum homem poderoso ou algum homem valente[b], tomava-o para si[c].
  rationale: A revisão evita acrescentar «guerreiro» à designação de גִּבּוֹר e substitui uma construção portuguesa pouco natural por uma formulação idiomática que conserva a ideia de Saul trazer tais homens para junto de si. Mantêm-se a leitura habitual de «sempre que», a tradução contextual de חֲזָקָה e as notas necessárias.
