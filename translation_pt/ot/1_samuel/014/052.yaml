base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: pt
  text: A guerra contra os filisteus foi intensa[a] durante todos os dias de Saul. Sempre que Saul via algum homem poderoso ou algum homem valente[b], tomava-o para si[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «feroz» ou «dura». O adjetivo hebraico significa literalmente «forte».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «todo homem poderoso e todo filho de valor».'
    reason: lexical_alternative
  - marker: c
    text: Isto é, Saul recrutava esses homens para o seu serviço.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: A guerra ... foi
  rationale: A forma narrativa de היה dá continuidade ao relato, e o substantivo descreve uma situação prolongada de guerra, não apenas uma batalha isolada.
- source_word: חֲזָקָה
  choice: intensa
  rationale: O adjetivo significa literalmente «forte»; aplicado à guerra, «intensa» comunica de modo natural sua força e persistência sem restringir o sentido apenas à ferocidade.
- source_word: עַל פְּלִשְׁתִּים
  choice: contra os filisteus
  rationale: Com o substantivo «guerra», a preposição עַל identifica o adversário.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: durante todos os dias de Saul
  rationale: A formulação conserva o idioma hebraico e sua referência abrangente ao período de Saul, sem decidir explicitamente entre vida e reinado.
- source_word: וְרָאָה
  choice: Sempre que Saul via
  rationale: No contexto, a ação é habitual e repetida, ligada ao recrutamento descrito em seguida.
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: algum guerreiro poderoso
  rationale: גִּבּוֹר designa aqui um homem de força e capacidade militar; «guerreiro poderoso» torna explícita essa nuance contextual.
- source_word: וְכָל בֶּן חַיִל
  choice: ou algum homem valente
  rationale: A expressão idiomática «filho de valor» pode indicar valentia, capacidade ou mérito; no contexto militar, «homem valente» é natural e adequado.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: ele o reunia a si
  rationale: A tradução mantém a imagem do verbo אָסַף, «reunir, ajuntar», enquanto o contexto indica que Saul incorporava esses homens ao seu serviço.
