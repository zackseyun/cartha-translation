base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: pt
  text: 'Então Saul disse a Aías: “Traga para cá a arca de Deus”[a], pois naquele dia a arca de Deus estava com os filhos de Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas tradições textuais e alguns intérpretes leem “Traga o éfode” em vez de “Traga para cá a arca de Deus”. O texto hebraico aqui diz “arca de Deus”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “estava ali naquele dia com os filhos de Israel”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa a sequência com naturalidade em português.
- source_word: לַאֲחִיָּה
  choice: a Aías
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico אֲחִיָּה.
- source_word: הַגִּישָׁה
  choice: Traga para cá
  rationale: O imperativo causativo de נגשׁ significa fazer chegar, aproximar ou apresentar; esta formulação é clara e idiomática no contexto.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz a expressão hebraica sem acrescentar “da aliança”, ausente do texto-fonte.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação do narrador para a ordem de Saul.
- source_word: הָיָה ... וּבְנֵי יִשְׂרָאֵל
  choice: estava com os filhos de Israel
  rationale: “Estava com” comunica naturalmente a presença da arca junto ao grupo, preservando a construção hebraica com בְּ.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente português direto e natural da expressão temporal hebraica.
theological_decisions:
- issue: “Arca de Deus” em contraste com a variante contextual “éfode”
  choice: a arca de Deus
  alternative: o éfode
  rationale: O texto massorético fornecido traz אֲרוֹן הָאֱלֹהִים duas vezes. A leitura alternativa é registrada em nota, sem substituir o texto-fonte.
- issue: Sentido da presença da arca naquele dia
  choice: estava com os filhos de Israel
  alternative: estava ali naquele dia com os filhos de Israel
  rationale: O hebraico não contém um advérbio explícito equivalente a “ali”. A tradução principal evita acrescentá-lo, enquanto a nota registra essa possível explicitação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém “filhos de Israel” por transparência formal ao hebraico, embora “israelitas” também seja possível. Os marcadores de nota aparecem no texto principal junto aos elementos relevantes.
