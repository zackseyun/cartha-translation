id: 1SA.14.10
reference: 1 Samuel 14:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: pt
  text: 'Mas, se eles disserem: “Subam até nós”[a], então subiremos, porque Yahweh os entregou em nossas mãos[b]. Este será o sinal para nós.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Subam contra nós”. O hebraico destaca a subida em direção à posição dos filisteus; o contexto militar pode implicar movimento hostil.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em nossa mão”, expressão que significa “sob nosso poder”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Liga esta condição à possibilidade anterior e assinala o contraste de modo natural em português.
- source_word: כֹּה יֹאמְרוּ
  choice: eles disserem
  rationale: No período condicional, o futuro do subjuntivo é a forma idiomática em português; o demonstrativo כֹּה funciona como introdutor da fala e não precisa ser traduzido separadamente.
- source_word: עֲלוּ עָלֵינוּ
  choice: Subam até nós
  rationale: Preserva em primeiro plano o movimento ascendente em direção à posição dos filisteus, sem eliminar a possível nuance hostil do contexto militar.
- source_word: וְעָלִינוּ
  choice: então subiremos
  rationale: Explicita naturalmente a consequência da condição; o verbo mantém o movimento de subida.
- source_word: כִּי נְתָנָם
  choice: porque ... os entregou
  rationale: כִּי introduz a razão, e o perfeito נְתָנָם expressa a certeza de Jônatas como uma ação divina já decidida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיָדֵנוּ
  choice: em nossas mãos
  rationale: Reproduz com naturalidade em português o idioma hebraico que significa colocar sob o poder ou controle de alguém.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: Este será o sinal para nós
  rationale: A cópula futura, implícita no hebraico, é necessária em português e apresenta o acontecimento esperado como sinal confirmador.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino; “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Valor do perfeito נְתָנָם
  choice: os entregou
  alternative: os entregará
  rationale: O perfeito apresenta a vitória como certa da perspectiva de Jônatas, embora sua realização histórica ainda seja futura; a tradução preserva essa certeza sem explicá-la no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “vocês” de forma implícita no imperativo plural “subam”; mantém o nome Yahweh e conserva, em forma portuguesa natural, a imagem idiomática da mão.
