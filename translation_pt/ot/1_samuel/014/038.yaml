  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: pt
  text: 'Então Saul disse: “Aproximem-se aqui, todos os líderes do povo, e descubram e vejam como este pecado aconteceu hoje.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: Aproximem-se
  rationale: O imperativo plural com o advérbio dêitico convoca os líderes a se aproximarem do lugar onde Saul está; a formulação é natural e preserva a ideia de aproximação.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: todos vocês, líderes do povo
  rationale: Literalmente, “todos os cantos do povo”; no contexto, a expressão designa os líderes ou representantes dos diversos setores do povo. A tradução idiomática comunica esse referente sem obscurecer o sentido.
- source_word: וּדְעוּ וּרְאוּ
  choice: e procurem saber e ver
  rationale: Os dois imperativos são mantidos. “Procurem saber” expressa o valor investigativo de ידע neste contexto, enquanto “ver” conserva o segundo verbo e a ênfase hebraica.
- source_word: בַּמָּה
  choice: como
  rationale: A combinação da preposição ב com מה pergunta pela maneira ou pelo meio; “como” é a forma mais clara e natural em português neste contexto.
- source_word: הָיְתָה
  choice: aconteceu
  rationale: Embora o verbo signifique formalmente “foi” ou “veio a existir”, aqui se refere ao modo como o pecado ocorreu; “aconteceu” transmite isso com naturalidade.
- source_word: הַחַטָּאת הַזֹּאת
  choice: este pecado
  rationale: חטאת designa aqui o ato pecaminoso que explica o silêncio divino no contexto narrativo. “Pecado” preserva diretamente seu peso moral e teológico.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto, claro e corrente em português.
theological_decisions:
- issue: Sentido idiomático de כֹּל פִּנּוֹת הָעָם
  choice: líderes do povo
  alternative: chefes do povo; literalmente, “cantos do povo”
  rationale: A imagem dos “cantos” aponta para pessoas proeminentes ou representativas do povo, não para cantos literais. “Líderes” comunica o sentido contextual sem impor uma estrutura política mais específica do que o hebraico exige.
- issue: Força moral de חטאת
  choice: pecado
  alternative: ofensa; transgressão; culpa
  rationale: A narrativa trata de uma falta diante de Deus. “Pecado” conserva essa dimensão teológica sem acrescentar uma interpretação além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “saber e ver” foi preservada por fidelidade à ênfase do hebraico, mas “procurem saber” torna natural o sentido investigativo. Não se acrescentou nota, pois a expressão idiomática foi traduzida diretamente no texto.
