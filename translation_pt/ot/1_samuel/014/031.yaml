base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: pt
  text: Naquele dia, eles feriram os filisteus desde Micmás até Aijalom, e o povo ficou muito cansado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: O verbo נכה descreve o ataque militar e suas baixas sem exigir que se acrescente explicitamente “mataram” ou se reduza o sentido a uma vitória completa.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Equivalente temporal natural e fiel à expressão hebraica.
- source_word: בַּפְּלִשְׁתִּים
  choice: os filisteus
  rationale: Designação direta do povo que sofreu o ataque; a preposição hebraica integra a construção verbal hostil.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: desde Micmás até Aijalom
  rationale: Expressa o percurso geográfico; a terminação direcional de אַיָּלֹנָה indica movimento em direção a Aijalom.
- source_word: וַיָּעַף
  choice: ficou ... cansado
  rationale: O verbo comunica cansaço ou fraqueza. A concordância no singular acompanha naturalmente o coletivo “o povo” em português.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o substantivo coletivo singular do hebraico.
- source_word: מְאֹד
  choice: muito
  rationale: Intensificador comum, expresso de modo natural em português.
