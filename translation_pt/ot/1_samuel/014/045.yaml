  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: pt
  text: 'Mas o povo disse a Saul: “Jônatas deve morrer, ele que realizou esta grande libertação[a] em Israel? De modo nenhum![b] Tão certo como Yahweh vive, nem um fio de cabelo da cabeça dele cairá por terra, pois foi com Deus que ele agiu hoje.”[c] Assim, o povo resgatou Jônatas,[d] e ele não morreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “esta grande salvação” ou “esta grande vitória”. O termo hebraico יְשׁוּעָה pode indicar libertação, salvação ou vitória, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Longe disso!”. É uma forte expressão de rejeição; também pode ser traduzida por “Certamente não!” ou “Que isso jamais aconteça!”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “pois com Deus ele agiu hoje”. A formulação ressalta que a ação de Jônatas ocorreu em associação com a ajuda ou o favor divino, sem especificar mais precisamente essa relação.
    reason: lexical_alternative
  - marker: d
    text: Ou “remiu Jônatas” ou “livrou Jônatas”. O verbo hebraico traz a ideia de obter a libertação de alguém de uma reivindicação ou sentença.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: Jônatas deve morrer
  rationale: A partícula interrogativa com o verbo expressa uma pergunta retórica indignada. A formulação preserva tanto a pergunta quanto o protesto do povo.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: esta grande libertação
  rationale: יְשׁוּעָה pode significar libertação, salvação ou vitória. No contexto militar, “libertação” mantém a ideia de livramento sem reduzir o sentido apenas ao êxito na batalha.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Mantém o valor mais direto da preposição ב e apresenta Israel como a esfera em que ocorreu a libertação.
- source_word: חָלִילָה
  choice: De modo nenhum!
  rationale: Expressa uma rejeição enfática em português atual, sem inserir uma referência a Deus que não está explícita nessa expressão hebraica.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Equivalente natural e solene da fórmula hebraica de juramento, preservando o nome divino.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: nem um só cabelo da cabeça dele cairá por terra
  rationale: No contexto da fórmula de juramento, אִם tem força negativa enfática. A expressão comunica proteção completa e mantém a imagem hebraica.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: pois foi com Deus que ele agiu hoje
  rationale: Conserva o sentido básico de עִם, “com”, e a amplitude de עָשָׂה, sem explicar excessivamente a relação entre a ação de Jônatas e a atuação divina.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: Assim, o povo resgatou Jônatas
  rationale: “Resgatou” pode indicar tanto livramento quanto a obtenção de soltura de uma reivindicação ou sentença, adequando-se à intervenção do povo para livrá-lo da morte.
- source_word: וְלֹא מֵת
  choice: e ele não morreu
  rationale: Reproduz diretamente o resultado declarado pelo texto, sem transformar a oração em voz passiva interpretativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido de עִם אֱלֹהִים na descrição da ação de Jônatas
  choice: foi com Deus que ele agiu
  alternative: agiu com a ajuda de Deus; agiu em favor de Deus
  rationale: A preposição עִם significa naturalmente “com”. A tradução conserva a tensão do texto sobre a ação humana em associação com Deus, sem definir além do hebraico a natureza dessa cooperação ou auxílio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica e o juramento mantêm sua força oral; “De modo nenhum!” evita arcaísmo, e “resgatou” preserva a dimensão jurídica de פדה sem soar excessivamente técnica.
