base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: pt
  text: Pois, tão certo como Yahweh vive, que salva Israel, mesmo que isso se encontre em Jônatas, meu filho,[a] ele certamente morrerá». Mas ninguém dentre todo o povo lhe respondeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “se encontre em Jônatas, meu filho”. O objeto fica implícito; o contexto sugere a culpa ou a transgressão sob investigação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: tão certo como vive Yahweh
  rationale: Expressa em português natural a fórmula hebraica solene de juramento, preservando a referência à vida de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino conforme o padrão do projeto, em vez de substituí-lo por um título.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: que salva Israel
  rationale: O particípio com artigo caracteriza Yahweh como aquele que salva Israel; o presente preserva esse valor contínuo.
- source_word: כִּי אִם
  choice: mesmo que
  rationale: No contexto do juramento, introduz um caso hipotético extremo.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: isso esteja em Jônatas, meu filho
  rationale: Mantém a elipse do hebraico sem especificar indevidamente se o referente implícito é culpa, pecado ou transgressão.
- source_word: מוֹת יָמוּת
  choice: ele certamente morrerá
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a certeza da sentença.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: Mas ninguém dentre todo o povo lhe respondeu
  rationale: 'Reproduz o contraste discursivo e o sentido partitivo: nenhuma pessoa de todo o povo respondeu a Saul.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome próprio divino segundo a convenção declarada do projeto, sem convertê-lo em título.
- issue: Referente implícito em יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: 'manter a elipse: “isso esteja em Jônatas”'
  alternative: “a culpa esteja em Jônatas”
  rationale: O contexto aponta para a culpa ou infração investigada, mas o texto hebraico não explicita o substantivo; a tradução preserva essa indeterminação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A fórmula de juramento recebe uma forma idiomática digna; a ambiguidade do referente implícito é preservada e explicada em nota.
