  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: pt
  text: 'Quando os dois se mostraram à guarnição dos filisteus[a], os filisteus disseram: “Vejam! Os hebreus estão saindo dos buracos onde haviam se escondido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao posto avançado dos filisteus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: se mostraram
  rationale: 'O nifal de גלה tem aqui sentido reflexivo: Jônatas e seu escudeiro deliberadamente se tornam visíveis. “Se mostraram” expressa isso de modo natural e preserva a alternativa mais literal em nota.'
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Retoma explicitamente Jônatas e seu escudeiro e preserva a ênfase em ambos com formulação portuguesa natural.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: guarnição dos filisteus
  rationale: מַצָּב pode designar uma força militar estacionada ou seu posto. “Guarnição” é claro no contexto, enquanto “posto avançado” permanece como alternativa possível.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: A partícula chama enfaticamente a atenção dos demais filisteus. O plural é natural na fala dirigida ao grupo e evita o arcaísmo de “Eis”.
- source_word: עִבְרִים
  choice: os hebreus
  rationale: Mantém a designação étnica usada pelos filisteus para os israelitas, preservando a perspectiva externa do discurso.
- source_word: יֹצְאִים
  choice: estão saindo
  rationale: O particípio apresenta a ação em andamento do ponto de vista dos filisteus.
- source_word: מִן הַחֹרִים
  choice: dos buracos
  rationale: חֹרִים denota literalmente buracos ou cavidades. A tradução mantém a imagem concreta e possivelmente depreciativa, sem especificar “cavernas”.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: onde se esconderam
  rationale: O hitpael de חבא é adequadamente expresso pelo reflexivo “se esconderam”; o perfeito indica a ação de se ocultarem anterior à saída agora observada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vejam!” preserva a força exclamativa de הִנֵּה; “os hebreus” conserva a perspectiva étnica dos filisteus sem acrescentar interpretação denominacional.
