base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: pt
  text: 'Então Saul disse: “Desçamos durante a noite em perseguição aos filisteus e os saqueemos até o clarear da manhã; não deixemos entre eles homem algum.” Eles responderam: “Faça tudo o que parecer bom aos seus olhos.” Mas o sacerdote disse: “Aproximemo-nos de Deus aqui[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aproximemo-nos aqui de Deus”. No contexto, as palavras do sacerdote provavelmente implicam buscar a orientação divina antes de prosseguir.'
    reason: Registra a possível posição de “aqui” e a implicação contextual sem substituir o sentido lexical do verbo por “consultar” no texto principal.
lexical_decisions:
- source_word: נֵרְדָה
  choice: Desçamos
  rationale: Preserva tanto a forma exortativa da primeira pessoa do plural quanto a nuance direcional do verbo ירד.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: em perseguição aos filisteus
  rationale: Expressa naturalmente em português o sentido militar de ir atrás deles, sem reduzir a frase a um simples ataque.
- source_word: לַיְלָה
  choice: durante a noite
  rationale: Indica o período da ação sem explicitar “esta noite”, elemento não declarado no hebraico.
- source_word: וְנָבֹזָה בָהֶם
  choice: e os saqueemos
  rationale: O verbo בזז significa saquear ou tomar despojos; a formulação é natural em português e mantém o alvo pronominal.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: até o clarear da manhã
  rationale: Conserva a imagem do surgimento da luz matinal com uma expressão corrente e digna.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: não deixemos nenhum homem entre eles
  rationale: Mantém a sequência volitiva e o substantivo singular אִישׁ, sem acrescentar explicitamente “vivo”, embora isso esteja implícito no contexto.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Faça tudo o que parecer bom aos seus olhos
  rationale: Preserva a metáfora hebraica dos olhos e comunica com clareza a ideia de agir segundo o próprio parecer.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: Aproximemo-nos de Deus aqui
  rationale: Mantém a forma exortativa, o verbo de aproximação e o advérbio הֲלֹם, sem especificar um rito não mencionado no texto.
theological_decisions:
- issue: Possível consulta a Deus antes da batalha
  choice: Traduzir as palavras do sacerdote como um convite para se aproximarem de Deus.
  alternative: Consultemos Deus aqui.
  rationale: O contexto sugere a busca de orientação divina, mas o hebraico usa o verbo “aproximar-se”, não o verbo técnico “consultar” ou “indagar”; a tradução evita tornar explícito o que permanece implícito.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A tradução conserva as exortações coletivas, a imagem idiomática “aos seus olhos” e a formulação teologicamente discreta da fala sacerdotal.
