source:
  edition: WLC
  text: וַ/יָּבֹ֤א הָ/עָם֙ אֶל הַ/יַּ֔עַר וְ/הִנֵּ֖ה הֵ֣לֶךְ דְּבָ֑שׁ וְ/אֵין מַשִּׂ֤יג יָד/וֹ֙ אֶל פִּ֔י/ו כִּֽי יָרֵ֥א הָ/עָ֖ם אֶת הַ/שְּׁבֻעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: pt
  text: Quando o povo entrou na floresta, eis que havia mel escorrendo[a]; mas ninguém levou a mão à boca[b], porque o povo temia o juramento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um fluxo de mel”; também pode ser traduzido por “o mel escorria” ou “havia uma corrente de mel”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ninguém levou a mão à boca”, isto é, ninguém comeu daquele mel.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “o juramento” se refere ao juramento anterior de Saul, que impunha uma maldição a quem comesse antes do anoitecer (ver 1 Samuel 14:24).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entrou
  rationale: O wayyiqtol de בוא indica movimento passado simples; com floresta como destino, “entrou” é natural em português.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o sentido amplo de עם e sua repetição no versículo, embora o contexto seja militar.
- source_word: הַיַּעַר
  choice: a floresta
  rationale: יער designa uma área arborizada; “floresta” é claro e corrente.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a função de הנה de chamar vividamente a atenção para a cena.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: havia mel escorrendo
  rationale: A construção incomum descreve um fluxo de mel. A forma verbal é natural em português e mantém a imagem sem pressupor necessariamente um riacho.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: mas ninguém levou a mão à boca
  rationale: Mantém a imagem concreta do hebraico e comunica de modo natural que ninguém comeu o mel.
- source_word: כִּי יָרֵא הָעָם
  choice: porque o povo temia
  rationale: כי apresenta a causa, e ירא expressa aqui o medo de transgredir o juramento imposto.
- source_word: הַשְּׁבֻעָה
  choice: o juramento
  rationale: שבועה significa propriamente “juramento”; embora no contexto envolva uma maldição, essa nuance não deve substituir o termo no texto principal.
theological_decisions:
- issue: Relação entre o juramento de Saul e a maldição imposta aos que comessem
  choice: juramento
  alternative: maldição
  rationale: O texto hebraico emprega הַשְּׁבֻעָה, “o juramento”. O contexto de 1 Samuel 14:24 mostra que ele tinha força de maldição, informação preservada em nota sem alterar a designação lexical do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Eis que” preserva a vivacidade narrativa do hebraico; “mel escorrendo” exprime naturalmente a construção hebraica incomum, e a imagem concreta de levar a mão à boca foi mantida.
