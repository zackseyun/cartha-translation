base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: pt
  text: Então o povo se lançou sobre o despojo[a], pegou ovelhas, gado e bezerros, abateu-os no chão e comeu a carne com o sangue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se precipitou sobre o saque”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, comeram a carne com o sangue ainda nela, sem que ele tivesse sido devidamente drenado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל־שָׁלָל
  choice: o povo se lançou sobre o despojo
  rationale: A construção incomum descreve uma ação impetuosa em direção ao despojo. “Se lançou sobre” comunica a pressa e o descontrole sugeridos pelo contexto, sem transformar a expressão em uma descrição excessivamente explícita.
- source_word: שָׁלָל
  choice: despojo
  rationale: Termo claro e digno para os bens e animais tomados após a batalha; preserva o contexto militar.
- source_word: צֹאן
  choice: ovelhas
  rationale: Nesta enumeração de animais, o termo concreto é mais natural do que o coletivo “rebanho”.
- source_word: בָּקָר
  choice: bois
  rationale: בקר designa genericamente gado bovino. “Bois” é corrente e natural neste contexto, embora não especifique necessariamente sexo ou idade.
- source_word: בְּנֵי בָקָר
  choice: bezerros
  rationale: A expressão literalmente significa “filhos do gado” e é uma designação idiomática de bovinos jovens.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: abateu-os no chão
  rationale: אָרְצָה indica que os animais foram abatidos diretamente no chão. O pronome retoma naturalmente os animais mencionados.
- source_word: עַל־הַדָּם
  choice: com o sangue
  rationale: Mantém a formulação breve e concreta do hebraico. “A carne” foi explicitada como objeto natural de “comeu” em português, sem resolver no corpo do texto todos os pormenores do modo como o sangue permaneceu nela.
theological_decisions:
- issue: Grau de explicitação da infração associada a עַל־הַדָּם
  choice: comeu a carne com o sangue
  alternative: comeu a carne ainda com sangue; comeu sobre o sangue
  rationale: O hebraico é conciso e admite uma tradução formal como “com o sangue”. O texto principal conserva essa concisão e a tensão legal e teológica, enquanto a nota explica a compreensão contextual de que a carne não havia sido devidamente sangrada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A repetição hebraica de “o povo” foi reduzida na sequência verbal para evitar peso desnecessário em português, sem mudar o sujeito.
