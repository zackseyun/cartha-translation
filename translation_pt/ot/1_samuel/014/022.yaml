base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: pt
  text: E todos os homens de Israel que tinham se escondido na região montanhosa de Efraim ouviram que os filisteus tinham fugido; então eles também os perseguiram de perto na batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “apegaram-se a eles, seguindo-os, na batalha”; a expressão é um idioma que indica perseguir de perto os filisteus em fuga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: E todos os homens de Israel
  rationale: Embora a expressão hebraica seja literalmente distributiva, “todo homem de Israel”, o particípio e os verbos no plural favorecem em português a forma coletiva natural “todos os homens de Israel”.
- source_word: הַמִּתְחַבְּאִים
  choice: que estavam escondidos
  rationale: O particípio descreve o estado em que esses homens se encontravam; a formulação é natural em português e preserva a relação temporal com o momento em que ouviram a notícia.
- source_word: בְּהַר אֶפְרַיִם
  choice: na região montanhosa de Efraim
  rationale: הַר designa aqui a zona elevada de Efraim, não um monte isolado. “Região montanhosa” comunica com clareza o sentido geográfico.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: ouviram que os filisteus tinham fugido
  rationale: O mais-que-perfeito composto esclarece que a fuga dos filisteus precedeu a notícia recebida pelos israelitas.
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: os perseguiram de perto
  rationale: דבק significa literalmente “apegar-se”, mas, com אַחֲרֵי em contexto militar, exprime perseguição cerrada. A tradução conserva o objeto explícito e a intensidade do idioma hebraico.
- source_word: גַם הֵמָּה
  choice: eles também
  rationale: A expressão destaca que os homens antes escondidos passaram a participar da ação juntamente com os demais.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: O substantivo se refere ao combate em curso, e não à guerra inteira.
