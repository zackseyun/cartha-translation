  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: pt
  text: 'Então Saul consultou a Deus: “Devo descer atrás dos filisteus? Tu os entregarás nas mãos de Israel?” Mas ele não lhe respondeu naquele dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: consultou a Deus
  rationale: A construção com שׁאל e בֵּאלֹהִים descreve a busca de orientação divina. “Consultou a Deus” comunica esse ato formal com naturalidade em português, melhor do que o simples “perguntou”.
- source_word: הַאֵרֵד
  choice: Devo descer
  rationale: A forma interrogativa com o imperfeito na primeira pessoa expressa deliberação e pedido de direção. “Devo descer” preserva tanto esse valor quanto o movimento indicado por ירד.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: atrás dos filisteus
  rationale: A tradução conserva o sentido básico de אַחֲרֵי e, no contexto militar, permite entender naturalmente a ideia de perseguição sem explicitá-la além do hebraico.
- source_word: הֲתִתְּנֵם
  choice: Tu os entregarás
  rationale: Em contexto de batalha, נתן pode significar colocar o inimigo sob o poder de alguém. “Entregarás” torna claro esse sentido idiomático sem eliminar a imagem da frase seguinte.
- source_word: בְּיַד יִשְׂרָאֵל
  choice: nas mãos de Israel
  rationale: A expressão hebraica significa colocar alguém sob o poder de outro. O plural idiomático em português mantém a imagem da mão e soa mais natural do que “na mão de Israel”.
- source_word: וְלֹא עָנָהוּ
  choice: Mas ele não lhe respondeu
  rationale: “Mas” explicita a oposição contextual entre a consulta e a ausência de resposta. O pronome mantém implícito, como no hebraico, o sujeito que o contexto identifica como Deus.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: É a forma direta, clara e idiomática de reproduzir a expressão temporal hebraica.
theological_decisions:
- issue: Sujeito implícito da ausência de resposta
  choice: 'Manter o sujeito pronominal: “ele não lhe respondeu”'
  alternative: 'Explicitar: “Deus não lhe respondeu”'
  rationale: O contexto indica fortemente que Deus é o sujeito, mas o hebraico não o repete. O pronome preserva a concisão e a pequena medida de implicitude do texto-fonte sem criar obscuridade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o tom narrativo conciso e a linguagem de consulta divina, evitando explicações doutrinárias ou paráfrases excessivas.
