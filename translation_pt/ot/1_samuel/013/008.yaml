  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: pt
  text: Ele esperou sete dias, até o tempo determinado por Samuel[a], mas Samuel não chegou a Gilgal, e o povo se dispersava, afastando-se dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz uma oração relativa condensada, literalmente algo como “até o tempo determinado que Samuel”; o sentido implícito é que Samuel havia fixado esse tempo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, afastando-se de Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: Ele esperou
  rationale: Neste contexto, o verbo indica esperar durante certo período, e não ter esperança em sentido abstrato. O pronome retoma Saul no contexto anterior.
- source_word: שִׁבְעַת יָמִים
  choice: sete dias
  rationale: Expressão direta de duração.
- source_word: לַמּוֹעֵד אֲשֶׁר שְׁמוּאֵל
  choice: até o tempo determinado por Samuel
  rationale: מוֹעֵד designa um tempo previamente fixado. A oração relativa hebraica é elíptica; a formulação portuguesa explicita de modo mínimo que Samuel havia determinado esse tempo.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: mas Samuel não chegou a Gilgal
  rationale: 'Embora וְ seja formalmente aditivo, o contexto é adversativo: Samuel não chegou no tempo esperado. “Chegou a Gilgal” é idiomático em português.'
- source_word: וַיָּפֶץ הָעָם
  choice: e o povo estava se dispersando
  rationale: A forma progressiva comunica que a dispersão estava em curso no momento narrado, sem apresentá-la apenas como ato concluído.
- source_word: מֵעָלָיו
  choice: e se afastando dele
  rationale: A expressão indica que o povo se retirava da presença ou liderança de Saul. Mantém-se o pronome hebraico, com o referente esclarecido em nota.
theological_decisions: []
