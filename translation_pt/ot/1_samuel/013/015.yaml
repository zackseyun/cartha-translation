base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: pt
  text: 'Então Samuel se levantou e subiu de Gilgal a Gibeá de Benjamim[a]. Saul contou o povo que estava com ele: cerca de seiscentos homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas testemunhas textuais e traduções trazem “Geba de Benjamim” em vez de “Gibeá de Benjamim”. O texto hebraico aqui traz “Gibeá de Benjamim”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal narrativo de קום significa “levantar-se”; a expressão preserva a sequência da narrativa sem reduzi-la apenas à partida.
- source_word: וַיַּעַל
  choice: subiu
  rationale: עלה conserva a ideia direcional de subir, apropriada ao deslocamento para um lugar mais elevado.
- source_word: מִן הַגִּלְגָּל
  choice: de Gilgal
  rationale: Expressa diretamente o ponto de partida.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: a Gibeá de Benjamim
  rationale: O texto hebraico massorético vocalizado traz Gibeá; a preposição “a” indica o destino exigido pelo contexto verbal.
- source_word: וַיִּפְקֹד
  choice: contou
  rationale: Em contexto militar, פקד pode significar contar ou passar em revista; “contou” é claro e não acrescenta a ideia de organização formal.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva a amplitude de עם, embora o contexto mostre que se trata dos homens que acompanhavam Saul.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: que estava com ele
  rationale: A expressão significa idiomaticamente os que se encontravam ou estavam presentes com Saul; esta formulação é natural em português.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: cerca de seiscentos homens
  rationale: O prefixo כ־ indica aproximação, e אִישׁ designa homens no contexto da contagem militar.
