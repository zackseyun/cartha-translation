source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: pt
  text: 'Então Saul disse: “Tragam-me o holocausto e as ofertas de comunhão[a]”. E ele ofereceu o holocausto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de paz”. O termo hebraico pode indicar ofertas associadas à paz, ao bem-estar ou à comunhão compartilhada.
    reason: lexical_alternative
  - marker: b
    text: A frase significa mais naturalmente que o próprio Saul ofereceu o holocausto; alguns a entendem de modo mais indireto, no sentido de que ele mandou apresentar ou oferecer o sacrifício.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Saul disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: הַגִּשׁוּ אֵלַי
  choice: Tragam-me
  rationale: O imperativo hifil de נגשׁ significa fazer chegar, aproximar ou apresentar. “Tragam-me” é natural em português e, no contexto sacrificial, comunica que as ofertas deveriam ser levadas até Saul.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה designa a oferta inteiramente queimada; “holocausto” é o termo cultual consagrado e reconhecível em português bíblico.
- source_word: וְהַשְּׁלָמִים
  choice: e as ofertas de comunhão
  rationale: שְׁלָמִים pode designar ofertas ligadas à paz, ao bem-estar e à comunhão compartilhada. “Ofertas de comunhão” é claro para leitores modernos, enquanto a alternativa mais formal é preservada em nota.
- source_word: וַיַּעַל
  choice: E ele ofereceu
  rationale: No contexto sacrificial, עלה significa oferecer ou fazer subir em oferta. O sujeito singular retoma naturalmente Saul, sem tornar explícito no corpo do texto mais do que o hebraico.
theological_decisions:
- issue: Agente da ação na oração final
  choice: O pronome “ele” retoma Saul, indicando que ele próprio ofereceu o holocausto.
  alternative: Saul mandou que o holocausto fosse oferecido ou apresentado.
  rationale: A leitura direta do verbo singular, cujo sujeito anterior é Saul, atribui a ação a ele e se ajusta à repreensão subsequente. Uma compreensão causativa mais indireta é possível no idioma sacrificial e, por isso, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Holocausto” preserva a terminologia sacrificial tradicional; “ofertas de comunhão” privilegia a compreensão atual, com “ofertas de paz” em nota. Os marcadores aparecem imediatamente após os termos ou orações a que se referem.
