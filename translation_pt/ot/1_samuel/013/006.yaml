  source_fidelity: 'A tradução acompanha adequadamente o hebraico: o sujeito coletivo é expresso por “os homens de Israel”, a aflição é comunicada de modo idiomático, e a repetição de הָעָם é compreensivelmente evitada na segunda oração. A lista de locais de esconderijo é preservada, inclusive as incertezas lexicais de חֲוָחִים e צְרִחִים. “Cisternas” é uma opção lexical defensável para בּוֹרוֹת, com a alternativa mais ampla devidamente anotada.'
