source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: pt
  text: Quando os homens de Israel viram que estavam em perigo, pois o povo estava sob forte pressão, esconderam-se em cavernas, entre espinheiros[a], entre rochedos, em esconderijos subterrâneos[b] e em cisternas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre matagais”; o termo hebraico é raro e provavelmente se refere a vegetação espinhosa.
    reason: lexical_alternative
  - marker: b
    text: Ou “em buracos”, “em câmaras subterrâneas” ou, possivelmente, “em fortalezas”; o termo hebraico é incerto.
    reason: lexical_alternative
  - marker: c
    text: Ou “em covas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: O singular אִישׁ tem sentido coletivo/distributivo, confirmado pelo verbo plural רָאוּ. A formulação preserva a referência masculina do hebraico e soa natural em português.
- source_word: רָאוּ
  choice: viram
  rationale: Mantém o sentido perceptivo básico do verbo, enquanto a oração seguinte explicita o que reconheceram.
- source_word: כִּי צַר לוֹ
  choice: que estavam em perigo
  rationale: A construção hebraica é condensada e passa do coletivo ao singular. O plural em português comunica naturalmente a situação aflitiva dos homens de Israel sem reproduzir uma concordância obscura.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: pois o povo estava sob forte pressão
  rationale: O nifal de נגשׂ indica estar pressionado, acuado ou oprimido. A expressão preserva a intensidade e se ajusta ao contexto militar.
- source_word: וַיִּתְחַבְּאוּ הָעָם
  choice: esconderam-se
  rationale: O pronome reflexivo representa bem o hitpael. Em português, a omissão do sujeito repetido evita a redundância pesada sem perder a referência ao povo.
- source_word: בַּמְּעָרוֹת
  choice: em cavernas
  rationale: Equivalente direto, claro e corrente de מְעָרָה.
- source_word: וּבַחֲוָחִים
  choice: entre espinheiros
  rationale: O termo raro provavelmente designa vegetação espinhosa. 'Espinheiros' expressa essa especificidade, com nota registrando a alternativa mais ampla.
- source_word: וּבַסְּלָעִים
  choice: entre rochedos
  rationale: סֶלַע pode designar rocha, rochedo ou penhasco. 'Entre rochedos' é natural como lugar de esconderijo e conserva o caráter rochoso do terreno.
- source_word: וּבַצְּרִחִים
  choice: em esconderijos subterrâneos
  rationale: O termo raro e incerto parece referir-se a cavidades, câmaras ou depósitos subterrâneos. A escolha oferece ao leitor uma imagem funcional sem confundi-lo com o termo seguinte.
- source_word: וּבַבֹּרוֹת
  choice: em cisternas
  rationale: בּוֹר designa com frequência uma cisterna ou cavidade escavada. 'Cisternas' distingue o local do item precedente, enquanto a nota preserva a alternativa genérica 'covas'.
