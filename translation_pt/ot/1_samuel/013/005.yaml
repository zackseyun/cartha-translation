  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: pt
  text: 'Os filisteus se reuniram para lutar contra Israel: trinta mil carros de guerra[a], seis mil cavaleiros e tropas tão numerosas como a areia que há à beira-mar. Eles subiram e acamparam em Micmás, a leste de Bete-Áven.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “trinta mil carros de guerra”. Alguns intérpretes, com base em testemunhos antigos, propõem um número menor — por exemplo, “três mil” — porque trinta mil parece excepcionalmente elevado neste contexto; o texto principal, porém, segue o hebraico massorético.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: se reuniram
  rationale: O nifal de אסף indica aqui a concentração de forças para a batalha; “se reuniram” é natural e conserva o sentido militar sem acrescentar detalhes.
- source_word: לְהִלָּחֵם עִם
  choice: para lutar contra
  rationale: O infinitivo de לחם com עִם expressa neste contexto confronto hostil; “lutar contra” é claro e idiomático.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: trinta mil carros de guerra
  rationale: רֶכֶב pode designar carros ou a força de carros. A tradução segue de modo direto o texto hebraico massorético, enquanto a dificuldade do número é registrada em nota.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: seis mil cavaleiros
  rationale: פָּרָשִׁים designa tropas montadas; “cavaleiros” é preciso, corrente e adequado ao contexto militar.
- source_word: וְעָם
  choice: e tropas
  rationale: Embora עָם signifique literalmente “povo”, no inventário militar refere-se às forças de combate; “tropas” comunica esse sentido contextual sem especificar além do texto.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: tão numerosas como a areia que há à beira-mar
  rationale: A formulação preserva a imagem hebraica de uma multidão incontável em português atual e inteligível.
- source_word: וַיַּעֲלוּ
  choice: Eles subiram
  rationale: עלה é um verbo direcional frequente na narrativa militar. “Subiram” mantém a expressão do hebraico sem substituí-la por uma interpretação como “avançaram”.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: חנה significa montar acampamento; “acamparam” é conciso e natural.
- source_word: בְמִכְמָשׂ
  choice: em Micmás
  rationale: O topônimo é transliterado de modo compatível com a ortografia portuguesa; a preposição “em” indica naturalmente o local do acampamento.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: a leste de Bete-Áven
  rationale: קִדְמַת indica uma posição oriental em relação ao lugar mencionado; “a leste de” é a forma geográfica mais clara em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a sequência narrativa e a hipérbole imagética do hebraico; usa topônimos em formas portuguesas correntes e assinala, sem corrigir silenciosamente, a dificuldade textual do número de carros.
