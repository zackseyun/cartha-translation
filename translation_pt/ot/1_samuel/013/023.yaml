  yaml_path: translation/ot/1_samuel/013/023.yaml
  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: pt
  text: E uma guarnição dos filisteus saiu para a passagem de Micmás.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um posto avançado dos filisteus saiu para a passagem de Micmás”.'
    reason: Alternativa lexical legítima para מַצָּב; «passagem» traduz de modo amplo מַעֲבָר.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O wayyiqtol de יצא indica movimento para fora ou para diante; “saiu” preserva o sentido narrativo simples sem acrescentar uma ideia militar específica.
- source_word: מַצַּב
  choice: uma guarnição
  rationale: No contexto militar, designa uma força ou posição estacionada. “Guarnição” é uma equivalência corrente e mantém o singular hebraico; “posto avançado” também é possível.
- source_word: פְּלִשְׁתִּים
  choice: dos filisteus
  rationale: Forma portuguesa tradicional e amplamente reconhecida para o nome do povo, expressando naturalmente a relação construta com מַצַּב.
- source_word: אֶל
  choice: para
  rationale: A preposição indica direção; “para” é natural em português e não exige decidir entre chegada efetiva e simples movimento em direção ao lugar.
- source_word: מַעֲבַר
  choice: o desfiladeiro
  rationale: O substantivo designa um lugar de passagem ou travessia. Neste cenário topográfico e militar, “desfiladeiro” comunica uma passagem estreita, embora “passagem” permaneça uma alternativa lexical legítima.
- source_word: מִכְמָשׂ
  choice: Micmás
  rationale: Transliteração portuguesa tradicional e inteligível do topônimo hebraico.
