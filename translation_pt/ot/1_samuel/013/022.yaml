  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: pt
  text: Assim, no dia da batalha, não se encontrou espada nem lança nas mãos de nenhum dos homens que estavam com Saul e Jônatas; somente Saul e seu filho Jônatas as possuíam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Assim
  rationale: Introduz a situação resultante e a liga naturalmente à explicação anterior, preservando o fluxo narrativo.
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: no dia da batalha
  rationale: Mantém o sentido temporal concreto da expressão hebraica e soa natural em português.
- source_word: לֹא נִמְצָא
  choice: não se encontrou
  rationale: Reproduz de modo natural a construção passiva/impessoal do nifal, sem acrescentar a ideia de impossibilidade.
- source_word: חֶרֶב וַחֲנִית
  choice: espada nem lança
  rationale: Depois de uma negação, «nem» expressa em português a força distributiva do hebraico, embora o conectivo hebraico seja literalmente «e».
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a imagem hebraica de posse ou disponibilidade e permanece idiomática em português.
- source_word: כָּל הָעָם
  choice: nenhum dos homens
  rationale: 'Sob negação, כָּל tem aqui sentido distributivo: nenhum integrante do contingente possuía essas armas. «Homens» esclarece no contexto que se trata dos combatentes, não de toda a população.'
- source_word: אֲשֶׁר אֶת־שָׁאוּל וְאֶת־יוֹנָתָן
  choice: que estavam com Saul e Jônatas
  rationale: A partícula אֶת indica associação nesta construção elíptica; a formulação portuguesa comunica que esses homens acompanhavam os dois líderes.
- source_word: וַתִּמָּצֵא
  choice: somente ... as possuíam
  rationale: O verbo feminino singular retoma coletivamente o par de armas. A formulação explicita a posse e o contraste implícito de maneira clara.
- source_word: לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: Saul e seu filho Jônatas
  rationale: O לְ marca posse ou disponibilidade; a ordem foi ajustada para um português natural, preservando a identificação filial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a imagem «nas mãos», mas evita uma reprodução rígida da sintaxe hebraica. «Somente» torna explícito o contraste entre todo o contingente desarmado e os dois únicos homens que possuíam espada e lança.
