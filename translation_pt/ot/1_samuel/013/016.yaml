base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: pt
  text: Saul, seu filho Jônatas e o povo que estava com eles[a] permaneciam em Geba de Benjamim[b], enquanto os filisteus estavam acampados em Micmás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o povo encontrado com eles”, provavelmente referindo-se aos que ainda permaneciam com Saul e Jônatas depois que outros se dispersaram.
    reason: lexical_alternative
  - marker: b
    text: O nome do lugar no hebraico é Geba, não Gibeá; embora relacionados, são locais distintos neste contexto narrativo.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: permaneciam
  rationale: O particípio de ישׁב, neste contexto militar e locativo, indica permanência ou estadia, não apenas o ato físico de sentar-se.
- source_word: הַנִּמְצָא עִמָּם
  choice: que estava com eles
  rationale: Embora o hebraico diga literalmente 'que era encontrado com eles', a expressão designa naturalmente o contingente ainda presente ao lado de Saul e Jônatas; a nota preserva a nuance lexical.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: em Geba de Benjamim
  rationale: O texto massorético traz Geba, localidade distinta de Gibeá; a preposição é traduzida naturalmente por 'em'.
- source_word: חָנוּ
  choice: estavam acampados
  rationale: חנה é o termo militar usual para acampar. A construção portuguesa expressa o estado resultante e contrasta naturalmente com a permanência do grupo de Saul.
- source_word: בְמִכְמָשׂ
  choice: em Micmás
  rationale: A preposição locativa é vertida idiomaticamente por 'em', e o topônimo recebe transliteração corrente em português.
- source_word: וְ
  choice: e / enquanto
  rationale: As conjunções coordenam os participantes e, na última oração, marcam o contraste simultâneo entre as posições dos israelitas e dos filisteus, sem acrescentar um marcador temporal inexistente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi ajustada para evitar a construção pesada 'Saul e Jônatas, seu filho, e o povo', sem alterar as relações do hebraico. Não se introduziu um 'Ora' ou 'Então' inicial, pois o וְ apenas dá continuidade à narrativa.
