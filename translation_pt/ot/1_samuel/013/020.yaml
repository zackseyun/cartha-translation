  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: pt
  text: Assim, todo o Israel desceu até os filisteus, cada um para afiar a relha do seu arado, sua enxada, seu machado e sua foice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «a relha do arado» ou outro instrumento de arar; o termo hebraico traduzido por «foice» é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceu
  rationale: O qal narrativo de ירד expressa movimento descendente. Em português, a concordância no singular com o coletivo «todo o Israel» é natural e preserva o sentido direcional.
- source_word: כָל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva hebraica, em vez de convertê-la em «todos os israelitas».
- source_word: הַפְּלִשְׁתִּים
  choice: até os filisteus
  rationale: O hebraico indica o povo ao qual os israelitas iam, não explicitamente a Filístia nem os ferreiros filisteus; «até» torna natural em português o destino do movimento.
- source_word: לִלְטוֹשׁ
  choice: para afiar
  rationale: Neste contexto, לטש se refere a dar fio a utensílios metálicos; «afiar» é claro e adequado à lista.
- source_word: אִישׁ
  choice: cada um
  rationale: Reproduz o valor distributivo do singular depois do sujeito coletivo sem tornar a frase pesada.
- source_word: מַחֲרַשְׁתּוֹ
  choice: a relha de seu arado
  rationale: O termo designa provavelmente uma peça ou instrumento de arar. «Relha do arado» identifica de modo compreensível a peça metálica que podia ser afiada.
- source_word: אֵתוֹ
  choice: sua enxada
  rationale: אֵת designa um instrumento de cavar ou capinar; «enxada» é corrente e facilmente compreensível em português.
- source_word: קַרְדֻּמּוֹ
  choice: seu machado
  rationale: O substantivo denota normalmente uma ferramenta cortante semelhante a um machado; esta é a equivalência portuguesa mais direta.
- source_word: מַחֲרֵשָׁתוֹ
  choice: sua foice
  rationale: A identificação exata do último utensílio é incerta. «Foice» é plausível no contexto agrícola e evita repetir o primeiro instrumento, mas a incerteza lexical é explicitada em nota.
