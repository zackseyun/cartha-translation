  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem inicial foi ajustada para preservar o verbo hebraico no singular e apresentar a tropa como uma unidade coletiva que depois se divide em três grupos. Os marcadores das notas foram colocados junto às expressões que efetivamente explicam.
