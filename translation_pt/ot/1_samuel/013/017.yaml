  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: pt
  text: Do acampamento dos filisteus saiu uma tropa de saqueadores[a], dividida em três grupos[b]. Um dos grupos tomou a estrada para Ofra, rumo à terra de Sual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “o destruidor” ou “a força destruidora”; neste contexto, refere-se a uma tropa de saqueadores que saiu do acampamento filisteu.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “três cabeças” e, em seguida, “uma cabeça”; isto é, três divisões ou grupos e um desses grupos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: uma tropa de saqueadores
  rationale: O substantivo singular com artigo significa literalmente “o destruidor” ou “a força destruidora”, mas, neste contexto militar e em vista de sua divisão em três grupos, designa coletivamente uma tropa que saía para saquear e destruir.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: dividida em três grupos
  rationale: A expressão significa literalmente “três cabeças” e funciona aqui como um modo de designar três divisões ou destacamentos da tropa.
- source_word: הָרֹאשׁ אֶחָד
  choice: um dos grupos
  rationale: Retoma no singular a imagem de “cabeça”; “um dos grupos” expressa naturalmente em português que se trata da primeira das três divisões.
- source_word: יִפְנֶה
  choice: tomou a direção
  rationale: O verbo pode significar “virar-se” ou “dirigir-se”; no relato militar, indica a direção seguida pelo grupo.
- source_word: דֶּרֶךְ עָפְרָה
  choice: a estrada de Ofra
  rationale: דֶּרֶךְ designa caminho ou estrada, e a construção indica a rota associada a Ofra ou que seguia em sua direção.
- source_word: אֶרֶץ שׁוּעָל
  choice: a terra de Sual
  rationale: אֶרֶץ pode significar “terra” ou “território”; aqui se refere a uma região chamada Sual.
- source_word: פְלִשְׁתִּים
  choice: filisteus
  rationale: Forma consagrada e amplamente reconhecida em português para o nome desse povo.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: שׁוּעָל
  choice: Sual
  rationale: Transliteração em português do nome regional hebraico.
