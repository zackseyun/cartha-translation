base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: pt
  text: 'E todo o Israel ouviu a notícia: “Saul feriu a guarnição dos filisteus[a], e Israel também se tornou detestável para os filisteus[b].” Então o povo foi convocado para seguir Saul em Gilgal[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o governador filisteu” ou “o posto avançado dos filisteus”. O termo hebraico pode designar tanto um oficial quanto uma força ou posição estacionada; o contexto militar favorece “guarnição”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Israel também se tornou um mau cheiro entre os filisteus”, expressão que significa que Israel se tornou repulsivo ou detestável para eles.
    reason: lexical_alternative
  - marker: c
    text: Ou “o povo foi reunido atrás de Saul em Gilgal”. A expressão hebraica provavelmente descreve a mobilização do povo para seguir Saul na batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: ouviu dizer
  rationale: A expressão introduz uma notícia divulgada; “ouviu dizer” é natural em português e preserva a fórmula de relato.
- source_word: הִכָּה
  choice: atacou
  rationale: O verbo significa literalmente “golpeou/feriu”; neste contexto militar, “atacou” comunica a ação contra a posição filisteia sem afirmar de modo indevido que todos foram mortos.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: a guarnição dos filisteus
  rationale: נְצִיב pode designar um oficial ou um posto/contingente estacionado. O contexto militar favorece “guarnição”, mas a ambiguidade é registrada em nota.
- source_word: נִבְאַשׁ
  choice: se tornou detestável
  rationale: O verbo evoca literalmente mau cheiro e, em sentido figurado, repulsa. “Tornou-se detestável” transmite o sentido idiomático com dignidade e clareza.
- source_word: בַּפְּלִשְׁתִּים
  choice: para os filisteus
  rationale: A preposição indica a relação com aqueles que passaram a considerar Israel detestável.
- source_word: וַיִּצָּעֲקוּ
  choice: foi convocado
  rationale: Embora a raiz frequentemente signifique “clamar”, aqui o contexto militar indica a convocação ou mobilização do povo.
- source_word: אַחֲרֵי שָׁאוּל
  choice: para seguir Saul
  rationale: Literalmente “atrás de Saul”; no contexto, refere-se a reunir-se sob sua liderança, provavelmente para a batalha.
- source_word: הַגִּלְגָּל
  choice: em Gilgal
  rationale: O hebraico apresenta Gilgal como o local onde o povo se reuniu com Saul; “em Gilgal” é a forma natural em português.
