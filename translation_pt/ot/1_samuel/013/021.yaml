base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: pt
  text: O preço era um pim[a] para afiar as relhas dos arados, as enxadas, os garfos de três pontas e os machados[b], e para ajustar as aguilhadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um pim era provavelmente uma pequena unidade de peso ou pagamento, em geral calculada em cerca de dois terços de um siclo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “O trabalho de limar ou afiar custava um pim”. A redação hebraica é difícil, e o versículo pode descrever tanto o preço cobrado quanto o próprio serviço de afiação.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: O preço
  rationale: O substantivo raro, seguido de פִים como quantia, provavelmente indica o preço cobrado pelo serviço; a nota preserva a possibilidade de se referir ao próprio ato de limar ou afiar.
- source_word: פִים
  choice: um pim
  rationale: Mantém transliterada a antiga unidade de peso ou pagamento, cujo valor provável é explicado em nota.
- source_word: מַחֲרֵשֹׁת
  choice: relhas dos arados
  rationale: Designa de modo claro as peças metálicas cortantes do arado que precisavam ser afiadas.
- source_word: אֵתִים
  choice: enxadas
  rationale: Termo comum e compreensível para implementos agrícolas usados para cavar ou cortar, embora a identificação exata seja incerta.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: garfos de três pontas
  rationale: Reproduz naturalmente a imagem literal de um instrumento agrícola com três pontas.
- source_word: קַּרְדֻּמִּים
  choice: machados
  rationale: É a tradução mais direta para ferramentas de corte, embora o termo possa abranger instrumentos semelhantes a enxós.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: para ajustar as aguilhadas
  rationale: A expressão provavelmente indica pôr em condições, endireitar ou reparar as aguilhadas; 'ajustar' preserva essa amplitude sem restringir o sentido a afiar.
