    text: 'Ou: “Você agiu de modo insensato.”'
    reason: lexical_alternative
  revision_rationale: A revisão retira a condição explícita acrescentada e conserva a força contrafactual por meio de «teria firmado», em conformidade com o contexto e com a forma concisa do hebraico. Também substitui «lhe deu» por «lhe ordenou», correspondendo mais precisamente a צוה. A nota lexical permanece adequadamente ancorada após «insensato».
