revisions:
- from: 'Então Samuel disse a Saul: “Você agiu como um insensato.[a] Não guardou o mandamento de Yahweh, seu Deus, que ele lhe deu. Pois, se tivesse obedecido, Yahweh teria firmado para sempre o seu reino sobre Israel.”'
  to: 'Então Samuel disse a Saul: “Você agiu como um insensato.[a] Não guardou o mandamento de Yahweh, seu Deus, que ele lhe ordenou. Pois agora Yahweh teria firmado para sempre o seu reino sobre Israel.”'
  rationale: A revisão retira a condição explícita acrescentada e conserva a força contrafactual por meio de «teria firmado», em conformidade com o contexto e com a forma concisa do hebraico. Também substitui «lhe deu» por «lhe ordenou», correspondendo mais precisamente a צוה. A nota lexical permanece adequadamente ancorada após «insensato».
