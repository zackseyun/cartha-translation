source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: pt
  text: 'Então Samuel disse a Saul: “Você agiu como um insensato.[a] Não guardou o mandamento de Yahweh, seu Deus, que ele lhe ordenou. Pois agora Yahweh teria firmado para sempre o seu reino sobre Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você agiu de modo insensato.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: Você agiu como um insensato
  rationale: O nifal de סכל avalia a conduta de Saul como insensata, não apenas seu estado mental. A formulação é natural em português e mantém a força moral da censura.
- source_word: שָׁמַרְתָּ
  choice: Não guardou
  rationale: שׁמר, tendo um mandamento por objeto, significa guardar ou observar. “Guardou” preserva a linguagem pactual e implica obediência sem transformar o verbo em paráfrase.
- source_word: מִצְוַת
  choice: o mandamento
  rationale: O singular indica a ordem específica dada a Saul. “Mandamento” mantém o peso normativo do termo e é claro no registro bíblico moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente a construção possessiva ligada ao nome divino.
- source_word: צִוָּךְ
  choice: que ele lhe deu
  rationale: Em português, “dar um mandamento” evita a repetição pouco elegante de “mandamento que ele lhe mandou”, preservando o sentido de צוה no contexto.
- source_word: כִּי עַתָּה
  choice: Pois, se tivesse obedecido
  rationale: O contexto exige uma consequência contrafactual. A condição implícita é explicitada com economia para que a relação lógica seja natural e inequívoca em português.
- source_word: הֵכִין
  choice: teria firmado
  rationale: O hifil de כון comunica tornar firme ou estabelecer. O futuro do pretérito composto expressa o resultado agora perdido pela desobediência de Saul.
- source_word: מַמְלַכְתְּךָ
  choice: o seu reino
  rationale: ממלכה designa aqui a monarquia ou domínio real de Saul; “reino” é a correspondência direta e corrente.
- source_word: אֶל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Embora אֶל normalmente indique direção, nesta construção a relação é de domínio régio; “sobre Israel” é a expressão idiomática portuguesa.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a expressão portuguesa corrente para duração indefinidamente contínua ou perpétua.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional.
- issue: Força contrafactual de כִּי עַתָּה הֵכִין יְהוָה
  choice: Pois, se tivesse obedecido, Yahweh teria firmado
  alternative: Pois agora Yahweh firmou / teria firmado
  rationale: À luz da censura anterior e da continuação no versículo seguinte, Samuel descreve o resultado que a desobediência de Saul impediu. A tradução explicita a condição implícita, sem afirmar que o reino já havia sido estabelecido perpetuamente.
- issue: Alcance de עַד עוֹלָם
  choice: para sempre
  alternative: por muito tempo; perpetuamente
  rationale: Mantém a força temporal ampla da expressão hebraica sem explicar no corpo do versículo se ela se refere à dinastia de Saul ou ao seu governo pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “guardar o mandamento” por seu valor bíblico e pactual; explicita apenas a condição contrafactual exigida pelo contexto.
