base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: pt
  text: 'Então Samuel disse: “O que você fez?” E Saul disse: “Porque vi que o povo estava se dispersando de mim, você não tinha vindo no tempo marcado[a], e os filisteus estavam se reunindo[b] em Micmás,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no tempo marcado dos dias”, provavelmente uma referência ao período combinado anteriormente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estavam se concentrando”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: O que você fez?
  rationale: Reproduz de modo natural a pergunta direta e incisiva de Samuel sobre uma ação já realizada.
- source_word: כִּי רָאִיתִי כִּי
  choice: Foi porque vi que
  rationale: O primeiro כִּי introduz a justificativa de Saul, enquanto o segundo apresenta aquilo que ele viu; a formulação portuguesa preserva essa relação sem rigidez artificial.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: o povo estava se dispersando para longe de mim
  rationale: Expressa o movimento contínuo de dispersão das tropas e mantém Saul como o ponto do qual elas se afastavam.
- source_word: לֹא בָאתָ לְמוֹעֵד הַיָּמִים
  choice: você não tinha chegado no tempo marcado
  rationale: O mais-que-perfeito composto situa a ausência de Samuel antes da ação de Saul; “tempo marcado” comunica naturalmente a ocasião ou prazo previamente estabelecido.
- source_word: נֶאֱסָפִים
  choice: estavam se reunindo
  rationale: O particípio nifal descreve uma concentração militar em andamento; a forma progressiva preserva esse aspecto.
- source_word: מִכְמָשׂ
  choice: Micmás
  rationale: Transliteração tradicional e clara do topônimo hebraico em português.
