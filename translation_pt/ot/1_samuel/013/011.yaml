revisions:
- from: 'Então Samuel perguntou: “O que você fez?” Saul respondeu: “Foi porque vi que o povo estava se dispersando para longe de mim, que você não tinha chegado no tempo marcado[a] e que os filisteus estavam se reunindo[b] em Micmás,”'
  to: 'Então Samuel disse: “O que você fez?” E Saul disse: “Porque vi que o povo estava se dispersando de mim, você não tinha vindo no tempo marcado[a], e os filisteus estavam se reunindo[b] em Micmás,”'
  rationale: A revisão restaura a coordenação dos três motivos apresentados por Saul, conserva o caráter incompleto de sua fala no final do versículo e aproxima os verbos introdutórios da formulação hebraica. As notas e seus marcadores permanecem vinculados às expressões que esclarecem.
