base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: pt
  text: Hebreus atravessaram o Jordão para a terra de Gade e Gileade[a]. Saul, porém, ainda estava em Gilgal, e todo o povo tremia atrás dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “israelitas”. O texto hebraico diz literalmente “hebreus”, designação que pode refletir neste contexto uma identificação étnica mais marcada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seguindo-o”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: hebreus
  rationale: Reproduz a designação étnica do texto hebraico sem a substituir interpretativamente por “israelitas”; “alguns” torna natural em português o substantivo plural sem artigo neste contexto, sem pretender quantificá-lo com precisão.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: atravessaram o Jordão
  rationale: Expressão idiomática e clara em português para a travessia do rio; o movimento para a região seguinte fica explícito pela continuação da frase.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: para a terra de Gade e Gileade
  rationale: Preserva אֶרֶץ como “terra” e apresenta Gade e Gileade como a região transjordânica para a qual fugiram.
- source_word: עוֹדֶנּוּ בַגִּלְגָּל
  choice: ainda estava em Gilgal
  rationale: Expressa naturalmente a ideia de permanência ou continuidade contida em עוֹדֶנּוּ.
- source_word: חָרְדוּ
  choice: tremia de medo
  rationale: Mantém a imagem física intensa do verbo e explicita sua causa contextual, evitando que “tremia” pareça indicar frio.
- source_word: אַחֲרָיו
  choice: que o seguia
  rationale: No contexto de um grupo ligado a Saul, expressa de modo natural a relação de acompanhamento; a alternativa mais literal “atrás dele” é registrada em nota.
