    issue: «Alguns hebreus» acrescenta uma quantificação não expressa.
    rationale: עִבְרִים é simplesmente um plural sem artigo; embora possa ser idiomático em alguns contextos, «alguns» sugere um subconjunto definido que o hebraico não especifica.
  - severity: medium
    issue: «todo o povo que o seguia» resolve interpretativamente אַחֲרָיו.
    rationale: A expressão pode indicar posição («atrás dele») ou acompanhamento («seguindo-o»). A oração relativa faz da segunda leitura uma informação inequívoca, em vez de preservar a ambiguidade do texto-fonte.
  - severity: low
    issue: «de medo» explicita uma causa não lexicalmente formulada na oração hebraica.
    rationale: O verbo comunica tremor associado ao temor, mas «tremia» já preserva a expressão física concisa do original.
  revised_text: Hebreus atravessaram o Jordão para a terra de Gade e Gileade[a]. Saul, porém, ainda estava em Gilgal, e todo o povo tremia atrás dele[b].
