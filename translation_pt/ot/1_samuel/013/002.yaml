base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: pt
  text: Saul escolheu para si três mil homens de Israel. Dois mil estavam com Saul em Micmás e na região montanhosa de Betel[a], e mil estavam com Jônatas em Gibeá de Benjamim. Quanto ao restante do povo, Saul o mandou embora, cada homem para a sua tenda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no monte de Betel”. A expressão hebraica pode indicar tanto a região montanhosa ao redor de Betel como uma elevação específica próxima à cidade.
    reason: lexical_alternative
  - marker: b
    text: Isto é, cada um para a sua moradia. “Cada homem para a sua tenda” é uma expressão hebraica comum para dispensar as pessoas e mandá-las de volta para casa.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: escolheu para si
  rationale: Preserva tanto o sentido básico de בחר, “escolher”, como o pronome dativo לוֹ, que indica a seleção feita por Saul para si mesmo.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: três mil homens de Israel
  rationale: O numeral designa pessoas recrutadas de Israel; “homens” torna explícito em português o referente humano e militar implícito no contexto.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: ficaram com Saul
  rationale: Expressa de modo natural a distribuição e permanência das tropas junto a Saul, sem acrescentar uma ação militar não indicada no hebraico.
- source_word: בְּמִכְמָשׂ
  choice: em Micmás
  rationale: A preposição ב marca a localização das tropas; “em” é a forma natural em português diante do topônimo.
- source_word: וּבְהַר בֵּית אֵל
  choice: e na região montanhosa de Betel
  rationale: הַר pode designar monte, montanha ou região montanhosa. O sentido regional se ajusta bem à disposição geográfica das tropas, enquanto a nota preserva a leitura mais específica.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: em Gibeá de Benjamim
  rationale: A vocalização massorética favorece Gibeá; “de Benjamim” identifica a localidade no território benjaminita.
- source_word: וְיֶתֶר הָעָם
  choice: Quanto ao restante do povo
  rationale: Mantém o termo amplo הָעָם, “povo”, em vez de restringi-lo explicitamente a “exército” ou “tropas”; a construção introduz com naturalidade o grupo restante.
- source_word: שִׁלַּח
  choice: mandou embora
  rationale: No contexto, o verbo indica que Saul dispensou e fez partir os demais, não apenas que os enviou em alguma missão.
- source_word: אִישׁ לְאֹהָלָיו
  choice: cada homem para a sua tenda
  rationale: Conserva os elementos concretos do hebraico, inclusive אִישׁ, “homem”, e אֹהֶל, “tenda”, ao mesmo tempo que a nota explica o valor idiomático.
