translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Os topônimos seguem formas portuguesas correntes. A repetição de “Saul” na última frase evita uma possível ambiguidade pronominal após a menção de Jônatas.
