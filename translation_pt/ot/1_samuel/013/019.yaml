reference: 1 Samuel 13:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: pt
  text: 'Não havia nenhum ferreiro em toda a terra de Israel, pois os filisteus tinham dito: “Do contrário, os hebreus poderiam fabricar espada ou lança.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que os hebreus não fabricassem espada nem lança”. No hebraico, “espada” e “lança” estão no singular com sentido genérico.'
    reason: Registra uma tradução mais formal de פֶּן e esclarece o uso genérico dos substantivos singulares.
lexical_decisions:
- source_word: חָרָשׁ
  choice: ferreiro
  rationale: Neste contexto de fabricação de armas e manutenção de instrumentos, o termo designa especificamente um artesão que trabalha com metal, não um artesão em sentido genérico.
- source_word: לֹא יִמָּצֵא
  choice: não havia nenhum
  rationale: O nifal expressa que tal profissional não era encontrado ou não estava presente; esta formulação é natural em português e comunica sua total ausência.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: em toda a terra de Israel
  rationale: Mantém de modo direto a extensão geográfica e o tom bíblico sem recorrer a linguagem arcaica.
- source_word: כִּי אמר פְלִשְׁתִּים
  choice: pois os filisteus tinham dito
  rationale: כִּי introduz a causa da ausência dos ferreiros. O mais-que-perfeito composto deixa claro que a decisão filisteia antecedeu a situação descrita.
- source_word: פֶּן
  choice: Do contrário
  rationale: No discurso direto, exprime naturalmente a consequência temida que a política filisteia pretendia evitar, sem o tom pouco corrente de uma tradução como “para que não” neste encaixe sintático.
- source_word: הָעִבְרִים
  choice: os hebreus
  rationale: Preserva a designação étnica do texto, particularmente apropriada na fala atribuída aos filisteus, em vez de harmonizá-la com “israelitas”.
- source_word: יַעֲשׂוּ
  choice: poderiam fabricar
  rationale: Após פֶּן, a forma verbal indica uma possibilidade temida; “poderiam” comunica essa modalidade, e “fabricar” é preciso para a produção de armas.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: espada ou lança
  rationale: Mantém os substantivos singulares e a alternativa do hebraico; aqui o singular tem valor genérico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva “hebreus” e a imagem concreta do ferreiro, enquanto explicita de modo natural a lógica preventiva da política filisteia.
