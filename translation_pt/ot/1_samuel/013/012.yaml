source:
  edition: WLC
  text: וָ/אֹמַ֗ר עַ֠תָּה יֵרְד֨וּ פְלִשְׁתִּ֤ים אֵלַ/י֙ הַ/גִּלְגָּ֔ל וּ/פְנֵ֥י יְהוָ֖ה לֹ֣א חִלִּ֑יתִי וָֽ/אֶתְאַפַּ֔ק וָ/אַעֲלֶ֖ה הָ/עֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: pt
  text: 'Então eu disse: “Agora os filisteus descerão contra mim em Gilgal, e eu ainda não busquei o favor de Yahweh[a]”. Por isso, forcei-me[b] e ofereci o holocausto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não supliquei a face de Yahweh”. A expressão hebraica significa buscar ou implorar o favor dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dominei-me”. O verbo hebraico pode indicar conter-se ou exercer domínio sobre si mesmo; aqui, Saul parece dizer que se obrigou a agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O waw consecutivo dá prosseguimento à explicação de Saul. A formulação preserva o verbo explícito “dizer” e soa natural na sequência narrativa.
- source_word: עַתָּה
  choice: Agora
  rationale: Expressa a urgência temporal percebida por Saul.
- source_word: יֵרְדוּ פְלִשְׁתִּים אֵלַי
  choice: os filisteus descerão contra mim
  rationale: Mantém o sentido direcional de ירד e explicita pelo contexto militar que אֵלַי indica movimento hostil.
- source_word: הַגִּלְגָּל
  choice: em Gilgal
  rationale: Translitera o topônimo e indica o lugar onde Saul esperava o confronto.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: e eu ainda não busquei o favor de Yahweh
  rationale: A combinação idiomática de חלה com “face” significa suplicar ou buscar o favor de alguém. “Ainda” torna natural em português a noção de algo que Saul julgava necessário fazer antes do ataque, sem alterar o sentido central.
- source_word: וָאֶתְאַפַּק
  choice: Por isso, forcei-me
  rationale: O hitpael de אפק pode indicar dominar-se, conter-se ou compelir-se. No contexto, Saul alega que agiu sob pressão e contra a própria relutância; “forcei-me” comunica essa nuance, enquanto a nota preserva a alternativa lexical.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: e ofereci o holocausto
  rationale: עלה com עֹלָה é linguagem sacrificial. “Ofereci o holocausto” é a expressão portuguesa corrente e digna.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz o nome divino pessoal. “Yahweh” o translitera, em vez de substituí-lo por um título.
- issue: Sentido da alegação de Saul em וָאֶתְאַפַּק
  choice: forcei-me
  alternative: contive-me; dominei-me
  rationale: A forma verbal admite a ideia de autocontrole, mas, neste contexto, Saul está justificando por que tomou a iniciativa de oferecer o sacrifício. A tradução mantém essa alegação sem endossá-la nem resolver a tensão moral do relato.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a direção espacial de “descer”, o nome divino e a ambiguidade relevante do verbo וָאֶתְאַפַּק. Os marcadores foram posicionados junto às expressões que explicam.
