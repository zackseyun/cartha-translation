revisions:
- from: 'Jônatas atacou a guarnição filisteia que estava em Geba[a], e os filisteus ficaram sabendo disso. Então Saul tocou a trombeta de chifre por toda a terra, dizendo: “Que os hebreus ouçam!”[b]'
  to: 'Jônatas atacou a guarnição filisteia que estava em Geba[a], e os filisteus ficaram sabendo disso. Então Saul tocou o chifre de carneiro[b] por toda a terra, dizendo: “Que os hebreus ouçam!”'
  rationale: A revisão substitui a expressão pouco natural “trombeta de chifre” por “chifre de carneiro”, que representa diretamente o shofar e mantém o registro bíblico em português contemporâneo. A nota b é deslocada para o termo que explica e passa a registrar tanto a alternativa tradicional “trombeta” quanto a possível formulação imperativa da proclamação. O restante do texto preserva as escolhas seguras do rascunho e a ambiguidade de נְצִיב.
