  naturalness: “Jônatas atacou”, “ficaram sabendo disso” e “Que os hebreus ouçam!” são naturais e adequados ao registro. “Tocou a trombeta de chifre”, porém, soa híbrido e pouco idiomático; “tocou o chifre de carneiro” é claro, moderno e mais fiel.
  terminology: 'Os nomes e etnônimos estão corretos: Jônatas, Saul, Geba, filisteus e hebreus. “Guarnição” é uma boa escolha contextual para נְצִיב, desde que a nota preserve as alternativas de autoridade ou posto militar. “Chifre de carneiro” traduz adequadamente שׁוֹפָר sem assimilá-lo a uma trombeta metálica.'
