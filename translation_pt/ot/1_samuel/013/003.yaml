base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: pt
  text: 'Jônatas atacou a guarnição filisteia que estava em Geba[a], e os filisteus ficaram sabendo disso. Então Saul tocou o chifre de carneiro[b] por toda a terra, dizendo: “Que os hebreus ouçam!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o governador filisteu” ou “o oficial filisteu”. O termo hebraico pode designar tanto uma autoridade quanto um posto ou destacamento militar; neste contexto, “guarnição” parece mais provável.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico shofar designa um chifre, tradicionalmente de carneiro; também é traduzido por “trombeta”. A convocação final também pode ser entendida como: “Ouçam, hebreus!”'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: atacou
  rationale: O verbo נכה significa golpear e, em contexto militar, pode indicar atacar, derrotar ou matar. Como o objeto pode ser uma guarnição ou um oficial, “atacou” preserva a ação sem definir indevidamente o resultado.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: a guarnição filisteia
  rationale: נְצִיב pode designar tanto um oficial instalado quanto um posto ou destacamento militar. O contexto bélico favorece “guarnição”, mantendo-se a alternativa em nota.
- source_word: בְּגֶבַע
  choice: em Geba
  rationale: Geba é o topônimo indicado pelo texto massorético; a preposição “em” é natural em português para localizar a guarnição.
- source_word: וַיִּשְׁמְעוּ פְלִשְׁתִּים
  choice: os filisteus ficaram sabendo disso
  rationale: O hebraico diz literalmente que os filisteus ouviram; “ficaram sabendo disso” explicita de modo idiomático o objeto subentendido.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: tocou a trombeta de chifre
  rationale: שׁוֹפָר é um instrumento feito de chifre, tradicionalmente de carneiro. A tradução evita confundi-lo com uma trombeta metálica e permanece compreensível ao leitor moderno.
- source_word: בְּכָל הָאָרֶץ
  choice: por toda a terra
  rationale: Neste contexto, הָאָרֶץ se refere ao território do povo, não ao planeta; a expressão comunica a ampla difusão do chamado.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: É a fórmula hebraica comum que introduz discurso direto.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: Que os hebreus ouçam!
  rationale: O imperfeito tem força volitiva ou jussiva no anúncio. “Que ... ouçam” preserva essa forma sem substituir “hebreus” por “israelitas”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jônatas”, “filisteus” e “hebreus” seguem formas correntes. A formulação preserva a ambiguidade de נְצִיב em nota e evita afirmar que Jônatas matou alguém ou destruiu completamente o posto.
