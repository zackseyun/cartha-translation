  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/הַעֲל֣וֹת הָ/עֹלָ֔ה וְ/הִנֵּ֥ה שְׁמוּאֵ֖ל בָּ֑א וַ/יֵּצֵ֥א שָׁא֛וּל לִ/קְרָאת֖/וֹ לְ/בָרֲכֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: pt
  text: E aconteceu que, assim que ele terminou de oferecer o holocausto, eis que Samuel chegou. Então Saul saiu ao encontro dele para abençoá-lo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumprimentá-lo” ou “saudá-lo”. O verbo hebraico significa literalmente “abençoar”, mas, neste contexto de encontro, pode designar uma saudação formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz o acontecimento seguinte na sequência narrativa sem recorrer à fórmula portuguesa mais arcaica “e sucedeu que”.
- source_word: כְּכַלֹּתוֹ
  choice: assim que ele terminou
  rationale: A preposição כְּ com o infinitivo construto e o sufixo estabelece uma relação temporal e, neste contexto, destaca que a chegada ocorreu logo após a conclusão da ação.
- source_word: לְהַעֲלוֹת
  choice: de oferecer
  rationale: O hiphil de עלה com um sacrifício como objeto tem o sentido técnico de apresentar ou oferecer uma oferta; em português, “oferecer” expressa isso naturalmente.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה é o termo sacrificial técnico para a oferta inteiramente queimada; “holocausto” é a designação bíblica tradicional e concisa em português.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a vivacidade e o caráter repentino assinalados por הִנֵּה na chegada de Samuel.
- source_word: בָּא
  choice: chegou
  rationale: No contexto, o verbo descreve a chegada de Samuel; “chegou” é mais preciso e natural em português do que o genérico “veio”.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Mantém o sentido concreto de movimento para fora expresso pelo verbo hebraico.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: Corresponde à expressão idiomática hebraica para sair a fim de encontrar alguém.
- source_word: לְבָרֲכוֹ
  choice: para abençoá-lo
  rationale: Mantém o sentido lexical básico de ברך e não elimina a ambiguidade entre pronunciar uma bênção e oferecer uma saudação formal; a alternativa contextual é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “eis que” foi mantida por seu valor narrativo de surpresa, enquanto “holocausto” preserva o termo sacrificial consagrado. A nota conserva a ambiguidade contextual de ברך sem substituir seu sentido lexical no texto principal.
