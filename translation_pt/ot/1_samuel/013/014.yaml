  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: pt
  text: Mas agora o seu reino não permanecerá.[a] Yahweh buscou para si um homem segundo o seu coração[b] e o designou como governante sobre o seu povo,[c] porque você não guardou o que Yahweh lhe ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ficará de pé”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “segundo o coração dele”. O pronome se refere mais naturalmente a Yahweh no contexto.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, o povo de Yahweh.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: No contexto, introduz uma transição contrastiva entre a situação anterior de Saul e o juízo anunciado.
- source_word: מַמְלַכְתְּךָ
  choice: o seu reino
  rationale: Designa a realeza de Saul e sua continuidade dinástica; “reino” é natural e mantém a amplitude do hebraico.
- source_word: לֹא תָקוּם
  choice: não permanecerá
  rationale: O sentido literal é “não ficará de pé”, mas, aplicado ao reino, indica que ele não continuará estabelecido.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: Yahweh buscou para si
  rationale: Preserva a ação apresentada como realizada e o valor de לוֹ, indicando a escolha feita por Yahweh para seus próprios propósitos.
- source_word: אִישׁ כִּלְבָבוֹ
  choice: um homem segundo o seu coração
  rationale: Mantém de perto a expressão hebraica e sua concisão, sem acrescentar uma explicação teológica ausente do versículo.
- source_word: וַיְצַוֵּהוּ יְהוָה
  choice: e o designou
  rationale: Embora o verbo frequentemente signifique “ordenar”, com לְנָגִיד expressa aqui a designação para uma função de autoridade. O sujeito “Yahweh” permanece claro na oração anterior, evitando repetição pesada em português.
- source_word: לְנָגִיד
  choice: como governante
  rationale: Comunica uma função de autoridade sem importar conotações técnicas posteriores de “príncipe”.
- source_word: עַל עַמּוֹ
  choice: sobre o seu povo
  rationale: Preserva o pronome hebraico; no contexto, o povo pertence a Yahweh.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: você não guardou o que Yahweh lhe ordenou
  rationale: “Guardar” conserva o sentido de observar fielmente uma ordem, enquanto “ordenou” traduz naturalmente o verbo no complemento.
theological_decisions:
- issue: Referente do sufixo em כִּלְבָבוֹ (“seu coração”)
  choice: O pronome é mantido na expressão “segundo o seu coração”, tendo Yahweh como antecedente contextual mais natural.
  alternative: Entender o pronome como referente ao homem buscado, ou explicitar interpretativamente “de acordo com a vontade de Yahweh”.
  rationale: A sintaxe e o sentido narrativo favorecem Yahweh como referente, mas a tradução não expande a frase para uma paráfrase doutrinária e conserva a forma concisa do hebraico.
- issue: Sentido de נָגִיד
  choice: governante
  alternative: líder; príncipe
  rationale: O termo indica alguém designado para exercer autoridade sobre o povo, sem exigir aqui um título dinástico ou messiânico técnico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O nome divino é transliterado como “Yahweh”. A redação preserva a imagem do coração e evita explicações confessionais; “você” corresponde ao discurso direto singular dirigido a Saul.
