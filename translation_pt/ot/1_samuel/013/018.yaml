base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: pt
  text: Um destacamento[a] tomou o caminho de Bete-Horom, e outro destacamento tomou o caminho da fronteira que domina o vale de Zeboim[b], em direção ao deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma divisão» ou «uma tropa»; literalmente, «uma cabeça».
    reason: lexical_alternative
  - marker: b
    text: «Zeboim» provavelmente é um nome de lugar; o termo hebraico pode estar relacionado a «hienas».
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: um destacamento / outro destacamento
  rationale: Embora רֹאשׁ signifique literalmente «cabeça», neste contexto militar designa cada uma das unidades do grupo de saqueadores mencionado no versículo anterior. «Destacamento» comunica com naturalidade uma tropa separada para uma missão.
- source_word: יִפְנֶה
  choice: tomou
  rationale: O verbo פנה expressa voltar-se numa direção. Com «caminho», a formulação portuguesa «tomou o caminho» comunica de modo natural o movimento direcional.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: דֶּרֶךְ indica aqui uma rota concreta de deslocamento; «caminho» é claro e idiomático em português.
- source_word: בֵּית חֹרוֹן
  choice: Bete-Horom
  rationale: Nome geográfico transliterado segundo uma forma portuguesa reconhecível e próxima do hebraico.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: גְּבוּל pode indicar limite, território limítrofe ou fronteira. «Fronteira» se ajusta à descrição topográfica sem especificar além do texto.
- source_word: הַנִּשְׁקָף
  choice: que domina
  rationale: O particípio nifal de שׁקף descreve algo elevado com vista sobre uma área. «Que domina» preserva a relação topográfica de estar acima e ter vista para o vale.
- source_word: גֵּי הַצְּבֹעִים
  choice: o vale de Zeboim
  rationale: A expressão funciona como topônimo. Mantém-se «Zeboim» por transliteração, enquanto «vale» traduz גֵּי.
- source_word: הַמִּדְבָּרָה
  choice: em direção ao deserto
  rationale: O sufixo direcional -ָה indica movimento rumo ao deserto; «em direção ao» torna essa nuance explícita em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A repetição hebraica foi preservada por «um destacamento» e «outro destacamento»; o segundo «outro» representa idiomaticamente אֶחָד na enumeração de unidades distintas.
