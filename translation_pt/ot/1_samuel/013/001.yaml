  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: pt
  text: Saul tinha um ano de idade quando se tornou rei[a] e reinou dois anos sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico aqui é difícil e provavelmente está incompleto. Literalmente: “Saul era filho de um ano ao tornar-se rei, e reinou dois anos sobre Israel”. Algumas testemunhas antigas e propostas posteriores apresentam números maiores, como “trinta” para a idade de Saul e “quarenta e dois” para a duração de seu reinado.'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: tinha um ano de idade
  rationale: O idiomatismo hebraico significa normalmente “ter um ano de idade”. A tradução preserva a redação massorética, apesar da evidente dificuldade histórica, explicada na nota.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּמָלְכוֹ
  choice: quando se tornou rei
  rationale: A construção indica a ocasião da ascensão ao trono; esta formulação é natural em português e adequada ao contexto régio.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: e ... dois anos
  rationale: Traduz diretamente a duração indicada no texto massorético e mantém a conjunção.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo hebraico significa “reinar” ou “ser rei”; “reinou” é a forma mais natural nesta fórmula régia.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Equivalente português corrente para a preposição usada com o exercício de governo.
theological_decisions:
- issue: Fórmula régia difícil ou textualmente deficiente no Texto Massorético
  choice: Manter no texto principal a redação massorética sem completar os números por conjectura
  alternative: Traduzir com números propostos, como trinta anos para a idade de Saul e quarenta e dois anos para a duração do reinado, ou deixar lacunas explícitas
  rationale: O hebraico transmitido é notoriamente difícil e provavelmente apresenta perda ou corrupção textual. Como a fonte indicada é o texto massorético da WLC, a tradução conserva seus números no texto principal e registra o problema e as propostas relevantes em nota, sem impor uma harmonização.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação idiomática no texto principal evita um decalque artificial, enquanto a nota preserva transparência quanto à dificuldade textual.
