base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: pt
  text: 'E os servos de Saul lhe disseram: “Veja, um espírito mau[a], vindo de Deus, está aterrorizando você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito nocivo/aflitivo vindo de Deus”. O hebraico pode caracterizar o espírito como mau ou como nocivo/aflitivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E ... disseram
  rationale: O wayyiqtol dá continuidade à narrativa; “E ... disseram” preserva essa sequência de modo natural.
- source_word: עַבְדֵי שָׁאוּל
  choice: os servos de Saul
  rationale: No contexto da corte, “servos” é uma tradução ampla, digna e direta, sem destacar uma condição jurídica específica.
- source_word: אֵלָיו
  choice: lhe
  rationale: 'Traduz de forma idiomática a preposição com o sufixo pronominal: disseram a ele.'
- source_word: הִנֵּה נָא
  choice: Veja
  rationale: A expressão chama a atenção do ouvinte com certa urgência; “Veja” é corrente e evita o arcaísmo de “Eis”.
- source_word: רוּחַ אֱלֹהִים
  choice: um espírito ... vindo de Deus
  rationale: “Vindo de Deus” expressa a relação de origem ou comissão indicada no contexto sem identificar esse espírito com o Espírito de Deus.
- source_word: רָעָה
  choice: mau
  rationale: O adjetivo pode significar moralmente mau ou nocivo/aflitivo. “Mau” mantém a tradução lexical direta, e a nota preserva a alternativa contextual.
- source_word: מְבַעִתֶּךָ
  choice: está aterrorizando você
  rationale: O particípio indica ação em curso, e o verbo comunica terror intenso, não apenas perturbação genérica.
theological_decisions:
- issue: Como traduzir רוּחַ אֱלֹהִים רָעָה sem eliminar a tensão teológica do texto
  choice: um espírito mau vindo de Deus
  alternative: um espírito nocivo/aflitivo vindo de Deus; um espírito mau de Deus
  rationale: A tradução conserva a afirmação de que o espírito vem de Deus em algum sentido, mas não o identifica automaticamente com o próprio Espírito de Deus. A possível nuance de algo nocivo ou aflitivo é registrada em nota, sem resolver dogmaticamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” comunica naturalmente o singular de segunda pessoa neste contexto; a formulação mantém a força do terror e a tensão da origem divina sem recorrer a linguagem arcaica.
