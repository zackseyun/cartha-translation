  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: pt
  text: Que o nosso senhor diga, por favor, aos seus servos aqui presentes que procurem um homem que saiba tocar lira. Quando um espírito nocivo vindo de Deus estiver sobre o senhor[a], esse homem tocará com a mão, e isso lhe fará bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito mau vindo de Deus”; em hebraico, “um espírito mau/nocivo de/vindo de Deus”.
    reason: Preservar a amplitude de רָעָה e a relação sintaticamente ambígua expressa pela construção hebraica.
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: Que ... diga, por favor
  rationale: O imperfeito volitivo acompanhado de נָא expressa um pedido cortês; a formulação mantém tanto a deferência quanto o sentido volitivo.
- source_word: אֲדֹנֵינוּ
  choice: o nosso senhor
  rationale: É um título respeitoso dirigido a Saul no ambiente da corte, sem confundi-lo com um título divino.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: aos seus servos aqui presentes
  rationale: A expressão identifica os cortesãos que servem na presença do rei. A formulação natural em português comunica essa relação sem conservar uma construção espacial pouco idiomática.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: que procurem um homem
  rationale: O verbo plural propõe que os servos busquem uma pessoa adequada para a tarefa.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: que saiba tocar
  rationale: A construção participial indica capacidade ou competência musical.
- source_word: כִּנּוֹר
  choice: lira
  rationale: O termo designa mais precisamente uma antiga lira de cordas do que a harpa moderna.
- source_word: וְהָיָה בִּהְיוֹת
  choice: Quando
  rationale: A construção temporal hebraica introduz a circunstância em que o músico deverá agir; em português, a conjunção simples transmite o sentido com naturalidade.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: um espírito nocivo vindo de Deus
  rationale: רָעָה pode indicar algo mau ou prejudicial; aqui, “nocivo” destaca o efeito aflitivo sem excluir a alternativa lexical “mau”. “Vindo de Deus” preserva a atribuição de origem expressa pelo texto.
- source_word: עָלֶיךָ
  choice: estiver sobre o senhor
  rationale: Mantém a imagem hebraica do espírito que vem sobre Saul e evita uma paráfrase interpretativa.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: ele tocará com a mão
  rationale: Conserva a expressão concreta do hebraico para a execução instrumental.
- source_word: וְטוֹב לָךְ
  choice: o senhor ficará bem
  rationale: Expressa o resultado benéfico de modo natural, sem restringi-lo apenas a uma emoção ou a um sintoma específico.
theological_decisions:
- issue: Como traduzir רוּחַ אֱלֹהִים רָעָה sem eliminar a tensão teológica do texto
  choice: um espírito nocivo vindo de Deus
  alternative: um espírito mau vindo de Deus; um espírito mau de Deus
  rationale: O texto associa explicitamente o espírito a Deus. “Vindo de Deus” preserva essa atribuição sem explicar seu mecanismo, enquanto “nocivo” representa uma possibilidade contextual de רָעָה. A nota mantém a tradução mais diretamente moral, “mau”, e a possibilidade sintática “de Deus”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento repetido “o senhor” evita a ambiguidade pronominal ao dirigir-se ao rei, e “aqui presentes” comunica naturalmente o contexto cortesão de לְפָנֶיךָ.
