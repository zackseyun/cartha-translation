  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: pt
  text: 'Então Saul enviou mensageiros a Jessé e disse: “Mande-me seu filho Davi, que está com o rebanho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O wayyiqtol de שׁלח expressa uma ação passada na sequência narrativa; “enviou” é a equivalência natural em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto humano, מַלְאָכִים designa pessoas encarregadas de levar uma mensagem; “mensageiros” é claro e não acrescenta formalidade diplomática.
- source_word: אֶל יִשָׁי
  choice: a Jessé
  rationale: A preposição אֶל indica direção; “a Jessé” é uma formulação portuguesa natural e fiel.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: אמר introduz a fala direta de Saul; “disse” preserva de modo transparente essa estrutura.
- source_word: שִׁלְחָה אֵלַי
  choice: Mande-me
  rationale: A forma imperativa de שׁלח, seguida de אֵלַי, pede que Jessé envie Davi até Saul. “Mande-me” comunica isso de forma corrente, sem tornar a ordem excessivamente solene.
- source_word: אֶת דָּוִד בִּנְךָ
  choice: seu filho Davi
  rationale: A aposição hebraica identifica Davi como filho de Jessé; esta ordem é natural em português e conserva toda a informação.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: que está com o rebanho
  rationale: A expressão identifica Davi por sua localização junto ao rebanho. “Com o rebanho” preserva a abertura semântica da preposição בְּ sem especificar se ele está dentro, entre ou apenas cuidando dos animais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mande-me” é natural na fala de uma autoridade e “rebanho” representa o coletivo צֹאן sem acrescentar explicitamente a atividade de pastorear.
