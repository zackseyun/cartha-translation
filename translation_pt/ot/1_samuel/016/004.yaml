  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: pt
  text: 'Samuel fez o que Yahweh havia dito e foi a Belém. Os anciãos da cidade tremeram ao encontrá-lo e perguntaram: “Você vem em paz?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Equivalente narrativo direto de עשה, expressando a obediência de Samuel sem acrescentar a ideia explícita de ordem.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: o que Yahweh havia dito
  rationale: Mantém o sentido de דִּבֶּר, “falou/disse”, e o mais-que-perfeito situa naturalmente a fala divina antes da ação de Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: foi a Belém
  rationale: בוא pode significar “ir” ou “vir”; “foi” é natural em português quando a narração acompanha Samuel desde o lugar anterior até Belém.
- source_word: וַיֶּחֶרְדוּ ... לִקְרָאתוֹ
  choice: saíram tremendo ao encontro dele
  rationale: Reproduz a forte reação expressa por חרד e liga לִקְרָאתוֹ ao movimento dos anciãos para receber Samuel. “Saíram” fica implícito no ato de ir ao encontro e torna a frase natural em português.
- source_word: זִקְנֵי הָעִיר
  choice: os anciãos da cidade
  rationale: Mantém a função social reconhecida dos líderes locais e segue de perto a construção hebraica.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: Você vem em paz?
  rationale: Expressa em português corrente a pergunta elíptica hebraica sobre o caráter pacífico da chegada de Samuel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” conserva o nome próprio no corpo do texto, sem substituí-lo pelo título “SENHOR”; “Javé” é uma adaptação portuguesa possível, mas a forma escolhida mantém a transliteração adotada pelo projeto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. O discurso direto usa “você” para representar a segunda pessoa singular sem introduzir um título honorífico ausente do hebraico. Embora o verbo hebraico que introduz a fala esteja no singular, o sujeito coletivo plural favorece “perguntaram” em português.
