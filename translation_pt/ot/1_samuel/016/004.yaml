revisions:
- from: 'Samuel fez o que Yahweh havia dito e foi a Belém. Os anciãos da cidade saíram tremendo ao encontro dele[a] e perguntaram: “Você vem em paz?”'
  to: 'Samuel fez o que Yahweh havia dito e foi a Belém. Os anciãos da cidade tremeram ao encontrá-lo e perguntaram: “Você vem em paz?”'
  rationale: A revisão remove o verbo adicional “saíram” e traduz a relação de לִקְרָאתוֹ de modo idiomático por “ao encontrá-lo”. Assim, preserva-se a reação de temor dos anciãos no encontro com Samuel sem especificar um deslocamento não expresso. A nota é removida porque não há uma variante textual nem uma ambiguidade lexical que exija esclarecimento ao leitor.
