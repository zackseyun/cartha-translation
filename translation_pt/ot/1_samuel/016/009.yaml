  text: וַ/יַּעֲבֵ֥ר יִשַׁ֖י שַׁמָּ֑ה וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹא בָחַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: pt
  text: 'Então Jessé fez Samá passar, e Samuel disse: “Yahweh também não escolheu este.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: fez ... passar diante de Samuel
  rationale: 'O hifil de עבר é causativo: Jessé fez Samá passar para ser avaliado. O complemento “diante de Samuel” é recuperado do contexto imediato e torna a cena natural em português.'
- source_word: יִשַׁי
  choice: Jessé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: שַׁמָּה
  choice: Samá
  rationale: Transliteração portuguesa clara do nome hebraico, com acento para indicar a tonicidade final.
- source_word: וַיֹּאמֶר
  choice: Samuel disse
  rationale: Embora o hebraico diga literalmente “ele disse”, o contexto identifica Samuel como o falante. Repetir o nome evita uma ambiguidade indesejada em português, pois Jessé é o sujeito da oração anterior.
- source_word: גַּם בָּזֶה לֹא
  choice: também não ... este
  rationale: Em uma oração negativa, גַּם acrescenta Samá aos candidatos já rejeitados; “também não” expressa naturalmente essa força aditiva.
- source_word: בָּזֶה
  choice: este
  rationale: O demonstrativo aponta para o filho que está sendo examinado naquele momento.
- source_word: לֹא בָחַר
  choice: não escolheu
  rationale: בחר significa escolher ou selecionar. O perfeito hebraico apresenta a decisão como definida; o pretérito perfeito é direto e natural no diálogo narrativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” preserva essa função e corresponde de modo próximo à forma academicamente reconstruída, sem substituí-la pelo título “Senhor”.
- issue: Identidade do sujeito de וַיֹּאמֶר
  choice: Samuel disse
  alternative: ele disse
  rationale: A forma verbal não nomeia o sujeito, mas o contexto narrativo identifica Samuel como quem avalia os filhos de Jessé. Explicitá-lo evita que o leitor português atribua a fala a Jessé, sujeito da oração precedente, sem alterar o conteúdo da cena.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa simples. A explicitação de Samuel ocorre duas vezes para impedir ambiguidade referencial; não há notas de rodapé, portanto nenhum marcador é necessário.
