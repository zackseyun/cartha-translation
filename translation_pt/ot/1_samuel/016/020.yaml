  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: pt
  text: Então Jessé pegou um jumento carregado de pão[a], um odre de vinho e um cabrito, e enviou tudo a Saul por intermédio de seu filho Davi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um jumento, pão”; isto é, um jumento que levava ou estava carregado de pão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pela mão de Davi, seu filho”; a expressão hebraica indica agência ou entrega.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então Jessé pegou
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: חֲמוֹר לֶחֶם
  choice: um jumento carregado de pão
  rationale: O hebraico justapõe “jumento” e “pão” sem explicitar a relação. O contexto indica que o animal transportava o pão; a nota preserva a forma literal e a concisão ambígua do original.
- source_word: נֹאד יַיִן
  choice: um odre de vinho
  rationale: נֹאד designa um recipiente feito de pele, normalmente usado para vinho; “odre” é preciso, corrente no registro bíblico e inteligível.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: um cabrito
  rationale: A expressão denota um único filhote de cabra. Em português, “um cabrito” comunica naturalmente tanto a espécie quanto a idade e o número.
- source_word: וַיִּשְׁלַח
  choice: e enviou tudo
  rationale: O objeto está implícito e retoma o conjunto das provisões. “Tudo” torna essa retomada clara sem sugerir que o próprio jumento foi apenas um item separado da carga.
- source_word: בְּיַד
  choice: por intermédio de
  rationale: Literalmente “pela mão de”, a expressão hebraica é um idioma de agência ou entrega. “Por intermédio de” transmite seu sentido natural em português.
- source_word: דָּוִד בְּנוֹ
  choice: seu filho Davi
  rationale: A ordem portuguesa identifica Davi naturalmente como filho de Jessé, preservando a relação expressa no hebraico.
- source_word: אֶל שָׁאוּל
  choice: a Saul
  rationale: Reprodução direta e natural da direção indicada pela preposição hebraica.
