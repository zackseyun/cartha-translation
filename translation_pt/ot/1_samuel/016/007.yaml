  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: pt
  text: 'Mas Yahweh disse a Samuel: “Não olhe para a aparência dele nem para a sua estatura elevada, porque eu o rejeitei. Pois Yahweh não vê como o ser humano vê:[a] o ser humano vê o que está diante dos olhos,[b] mas Yahweh vê o coração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o hebraico diz algo como: “Pois não o que o ser humano vê”. A construção é elíptica; o contexto indica que a maneira de Yahweh ver difere da maneira humana.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, aquilo que é visível aos olhos; também pode ser traduzido como “a aparência exterior”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: תַּבֵּט
  choice: olhe
  rationale: Expressa naturalmente a proibição de avaliar o candidato com base em seus traços externos.
- source_word: מַרְאֵהוּ
  choice: a aparência dele
  rationale: Designa aquilo que é visível e mantém a referência pronominal clara em português.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: a altura de sua estatura
  rationale: Preserva a formulação enfática do hebraico, embora de modo um pouco formal.
- source_word: מְאַסְתִּיהוּ
  choice: eu o rejeitei
  rationale: No contexto da escolha de um rei, מאס indica recusa ou rejeição como candidato.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: O substantivo é genérico neste contexto; esta forma inclui a humanidade em geral e evita que 'homem' seja entendido apenas como sexo masculino.
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: Yahweh não vê como o ser humano vê
  rationale: A frase hebraica é elíptica; a expansão explicita o contraste já dado pelo contexto sem mudar seu sentido.
- source_word: לַעֵינַיִם
  choice: o que está diante dos olhos
  rationale: Mantém a imagem literal dos olhos, em vez de reduzi-la à paráfrase 'aparência exterior'.
- source_word: לַלֵּבָב
  choice: o coração
  rationale: Conserva a imagem hebraica do centro interior do pensamento, da vontade e da disposição.
theological_decisions:
- issue: Contraste entre a percepção humana e a divina
  choice: Yahweh não vê como o ser humano vê
  alternative: Não é segundo o que o ser humano vê
  rationale: A sintaxe hebraica é elíptica. A formulação escolhida torna explícito o contraste implícito, sem sugerir que Deus não veja o exterior, mas que seu modo e critério de avaliação diferem dos humanos.
- issue: Sentido de לֵבָב
  choice: coração
  alternative: interior da pessoa
  rationale: “Coração” preserva a metáfora bíblica e sua amplitude sem restringi-la apenas às emoções.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal é natural, o nome Yahweh é preservado e a repetição de “vê” reproduz a força retórica do hebraico.
