base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: pt
  text: O Espírito de Yahweh havia se afastado de Saul, e um espírito mau[a] da parte de Yahweh o aterrorizou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito nocivo” ou “um espírito aflitivo”. O adjetivo hebraico pode designar aquilo que é mau, nocivo ou calamitoso em seus efeitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: O Espírito de Yahweh
  rationale: רוּחַ pode significar espírito, vento ou sopro; neste contexto narrativo, refere-se à presença divina capacitadora anteriormente concedida a Saul. A inicial maiúscula deixa claro que se trata do Espírito de Deus. O nome divino é representado por “Yahweh”.
- source_word: סָרָה מֵעִם
  choice: havia se afastado de
  rationale: סוּר significa afastar-se, retirar-se ou partir. O mais-que-perfeito composto expressa naturalmente, em português, que essa retirada antecede a ação seguinte no relato.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּבִעֲתַתּוּ
  choice: o aterrorizava
  rationale: O verbo בעת comunica medo intenso ou terror. O imperfeito em português apresenta a experiência como recorrente ou continuada no contexto, sem recorrer ao sentido mais interpretativo de “atormentar”.
- source_word: רוּחַ רָעָה
  choice: um espírito mau
  rationale: רָעָה pode indicar maldade, nocividade ou efeito calamitoso. “Espírito mau” é uma tradução direta e natural; a amplitude semântica é preservada em nota.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: מֵאֵת marca procedência ou origem. “Da parte de Yahweh” conserva essa relação sem acrescentar que o espírito foi explicitamente “enviado”.
theological_decisions:
- issue: Como expressar a procedência divina do espírito mau sem suavizar nem ampliar o hebraico
  choice: um espírito mau da parte de Yahweh
  alternative: um espírito nocivo/aflitivo da parte de Yahweh; um espírito mau enviado por Yahweh
  rationale: O hebraico atribui explicitamente a Yahweh a procedência do espírito. A tradução mantém essa tensão teológica. Não adota “enviado”, pois isso explicitaria uma ação que a preposição de origem não afirma por si só; a possível nuance de dano ou aflição em רָעָה fica registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “da parte de” preserva a ideia de procedência e a tensão do texto. O marcador da nota foi colocado após “espírito mau”, expressão à qual a alternativa lexical se refere.
