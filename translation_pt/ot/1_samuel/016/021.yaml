base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: pt
  text: Assim, Davi foi até Saul e apresentou-se diante dele. Saul o amou muito, e ele se tornou seu escudeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “carregador de armas”. O hebraico refere-se literalmente a alguém que carrega equipamento militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi até
  rationale: בוא com אֶל indica movimento em direção a Saul. Em português narrativo, “foi até Saul” é natural e não depende da perspectiva dêitica exigida por “veio”.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: ficou a seu serviço
  rationale: A expressão עמד לפני alguém de posição superior frequentemente denota comparecer e servir em sua presença. A tradução comunica o sentido cortesão do idioma com clareza, sem sugerir apenas postura física.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: Saul gostou muito dele
  rationale: O contexto identifica Saul como sujeito. Aqui אהב pode expressar forte afeição e favor pessoal; “gostou muito dele” soa natural em português e evita uma leitura sentimental excessiva.
- source_word: וַיְהִי לוֹ
  choice: tornou-se seu
  rationale: A construção indica o estado ou função que Davi passou a ocupar junto a Saul.
- source_word: נֹשֵׂא כֵלִים
  choice: escudeiro
  rationale: É o título português convencional para o assistente militar que carregava o equipamento ou as armas de um guerreiro, embora o hebraico seja mais amplo que “escudo”.
