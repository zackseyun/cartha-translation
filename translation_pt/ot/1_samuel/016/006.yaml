source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֔/ם וַ/יַּ֖רְא אֶת אֱלִיאָ֑ב וַ/יֹּ֕אמֶר אַ֛ךְ נֶ֥גֶד יְהוָ֖ה מְשִׁיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: pt
  text: 'Quando eles chegaram, ele viu Eliabe e disse: “Certamente, o ungido[a] de Yahweh está diante de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Messias”. A palavra hebraica é a mesma que mais tarde passou a ser usada como o título “Messias”; aqui, refere-se àquele que Samuel supõe que Yahweh escolheu para ser ungido rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: Quando eles chegaram
  rationale: A construção narrativa com וַיְהִי seguida de בְּ mais o infinitivo de בוא estabelece a circunstância temporal. Esta forma é natural em português moderno e evita a fórmula arcaica “e aconteceu que”.
- source_word: וַיַּרְא אֶת־אֱלִיאָב
  choice: ele viu Eliabe
  rationale: Traduz diretamente o verbo ראה e o objeto próprio, sem acrescentar que Samuel apenas olhou para Eliabe ou o examinou.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: אמר significa normalmente “dizer”. Embora possa tratar-se de uma fala consigo mesmo, o hebraico não explicita isso.
- source_word: אַךְ
  choice: Certamente
  rationale: Neste contexto, a partícula expressa a forte convicção imediata de Samuel.
- source_word: נֶגֶד יְהוָה
  choice: diante de Yahweh
  rationale: נֶגֶד indica posição ou presença diante de alguém. A repetição do nome divino preserva a formulação explícita e enfática do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído pelo título “SENHOR”.
- source_word: מְשִׁיחוֹ
  choice: o ungido de Yahweh
  rationale: O substantivo מָשִׁיחַ com sufixo significa literalmente “seu ungido”. A explicitação de Yahweh como referente do possessivo é natural em português e evita ambiguidade, sem alterar o sentido.
theological_decisions:
- issue: Sentido de מְשִׁיחוֹ no contexto da escolha de um rei
  choice: o ungido de Yahweh
  alternative: o Messias de Yahweh
  rationale: Aqui, Samuel supõe estar vendo aquele que Yahweh escolheu para ser ungido rei. “Ungido” preserva o sentido histórico imediato sem impor uma identificação messiânica posterior; a relação lexical com “Messias” é indicada em nota.
- issue: Referente de נֶגֶד יְהוָה
  choice: diante de Yahweh
  alternative: diante dele
  rationale: O texto hebraico traz expressamente o nome Yahweh. Repeti-lo em português conserva a referência explícita e evita que “dele” seja entendido como Samuel, Jessé ou Eliabe.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem da frase foi ajustada ao português, mas a concisão, a certeza de Samuel e a repetição de Yahweh foram preservadas.
