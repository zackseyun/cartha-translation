  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: pt
  text: 'Yahweh disse a Samuel: “Até quando você continuará a lamentar Saul, já que o rejeitei como rei de Israel? Encha seu chifre de óleo e vá. Eu o envio a Jessé, o belemita, pois vi para mim um rei entre os filhos dele[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vi para mim”. Neste contexto, a expressão pode indicar que Yahweh identificou, escolheu ou providenciou um rei para si.
    reason: Preserva o verbo hebraico “vi” na tradução e registra, sem impor uma única interpretação, os sentidos contextuais possíveis.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִתְאַבֵּל
  choice: continuará lamentando
  rationale: Expressa luto ou profundo pesar; a forma continuativa comunica naturalmente a força de עַד־מָתַי no contexto, embora Saul ainda esteja vivo.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל־יִשְׂרָאֵל
  choice: eu o rejeitei como rei sobre Israel
  rationale: Comunica a desqualificação de Saul para o reinado sem ampliar a rejeição para além do cargo real em questão.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: Encha de óleo o seu chifre
  rationale: Mantém a imagem concreta do recipiente feito de chifre usado para levar o óleo da unção.
- source_word: אֶשְׁלָחֲךָ
  choice: Eu o envio
  rationale: O presente em português transmite com naturalidade a comissão divina imediata e decidida.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: Jessé, o belemita
  rationale: Usa a forma portuguesa tradicional do nome e preserva o gentílico hebraico que identifica sua origem.
- source_word: רָאִיתִי לִי
  choice: escolhi para mim
  rationale: Embora ראה signifique literalmente “ver”, neste contexto a expressão indica que Yahweh identificou ou escolheu o rei para si; a nota preserva a imagem e as alternativas possíveis.
- source_word: בְּבָנָיו
  choice: entre os filhos dele
  rationale: A preposição indica que o futuro rei é um dentre o grupo dos filhos de Jessé.
- source_word: מֶלֶךְ
  choice: um rei
  rationale: O substantivo é indefinido e o personagem ainda não é nomeado neste versículo.
theological_decisions:
- issue: Alcance da rejeição divina de Saul
  choice: eu o rejeitei como rei sobre Israel
  alternative: eu o rejeitei, para que não reine sobre Israel
  rationale: A formulação mantém o foco explícito do texto na realeza de Saul, sem concluir nada além disso sobre sua condição diante de Deus.
- issue: Sentido de רָאִיתִי לִי na escolha do novo rei
  choice: escolhi para mim
  alternative: vi para mim / providenciei para mim
  rationale: O contexto favorece escolha ou designação divina, mas a nota registra o sentido literal e a possibilidade de entender a expressão como provisão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea; mantém “Yahweh”, “chifre” e “belemita” para conservar elementos específicos do hebraico. O marcador da nota foi colocado na oração a que efetivamente se refere.
