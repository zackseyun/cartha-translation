  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֣ל אֶל יִשַׁי֮ הֲ/תַ֣מּוּ הַ/נְּעָרִים֒ וַ/יֹּ֗אמֶר ע֚וֹד שָׁאַ֣ר הַ/קָּטָ֔ן וְ/הִנֵּ֥ה רֹעֶ֖ה בַּ/צֹּ֑אן וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל יִשַׁי֙ שִׁלְחָ֣/ה וְ/קָחֶ֔/נּוּ כִּ֥י לֹא נָסֹ֖ב עַד בֹּא֥/וֹ פֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: pt
  text: 'Então Samuel perguntou a Jessé: “Estão aqui todos os rapazes?” Ele respondeu: “Ainda falta o mais novo; ele está cuidando do rebanho[a]”. Então Samuel disse a Jessé: “Mande buscá-lo, pois não nos sentaremos[b] até que ele chegue aqui”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “pastoreando o rebanho”; também pode ser traduzido por “cuidando das ovelhas”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não tomaremos nossos lugares”. Provavelmente significa que não começariam a refeição ou a reunião formal antes que ele chegasse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: Estão aqui todos os rapazes?
  rationale: Expressa de modo idiomático a pergunta sobre se todos os filhos jovens de Jessé já haviam sido apresentados, sem reproduzir de forma artificial a ideia literal de estarem “completos”.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: Ainda falta o mais novo
  rationale: Preserva a ideia de que um filho ainda não havia sido apresentado; no contexto familiar, הַקָּטָן designa naturalmente o filho mais novo.
- source_word: וְהִנֵּה
  choice: ele está
  rationale: Neste relato, a partícula introduz e realça a informação sobre onde o filho se encontra. Em português corrente, essa função pode ser transmitida naturalmente sem o formalismo pouco idiomático de “eis que”.
- source_word: רֹעֶה בַּצֹּאן
  choice: cuidando do rebanho
  rationale: Comunica a ação contínua de pastorear e mantém a referência coletiva de צֹאן. A nota registra a formulação mais literal.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: Mande buscá-lo
  rationale: Equivalente idiomático português da sequência hebraica “envie e traga-o”, indicando que alguém deve ir buscá-lo e trazê-lo.
- source_word: לֹא נָסֹב
  choice: não nos sentaremos
  rationale: Reflete a interpretação contextual provável de que o grupo não tomaria seu lugar nem iniciaria a refeição ou reunião antes da chegada do filho.
- source_word: עַד בֹּאוֹ פֹה
  choice: até que ele chegue aqui
  rationale: Reprodução natural e direta da oração temporal hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Rapazes” evita tanto o tom infantil de “meninos” quanto a rigidez de “jovens homens”. A sintaxe narrativa permanece clara e próxima do hebraico, enquanto expressões idiomáticas são vertidas naturalmente.
