base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: pt
  text: Convide Jessé para o sacrifício[a], e eu lhe darei a conhecer o que você deverá fazer[b]; você ungirá para mim aquele de quem eu lhe falar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Chame Jessé para o sacrifício”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu lhe mostrarei o que você deverá fazer”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “aquele que eu lhe indicar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ
  choice: Convide
  rationale: Neste contexto, קרא significa chamar alguém para participar de uma ocasião; “convide” é natural e adequado ao contexto sacrificial.
- source_word: לְיִשַׁי
  choice: Jessé
  rationale: Forma consagrada do nome pessoal em português.
- source_word: בַּזָּבַח
  choice: para o sacrifício
  rationale: זבח pode designar o sacrifício ou a ocasião sacrificial; com קרא, indica o convite para participar dela.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: Eu lhe mostrarei
  rationale: O hifil de ידע expressa fazer saber ou dar a conhecer. “Mostrarei” comunica isso com naturalidade em português, enquanto o pronome explícito “Eu” preserva a ênfase de אָנֹכִי.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: o que você deverá fazer
  rationale: A forma verbal tem sentido futuro e instrutivo; “deverá” expressa a orientação divina sem exagerar sua força.
- source_word: וּמָשַׁחְתָּ
  choice: e você ungirá
  rationale: “Ungir” preserva o termo convencional para o ato formal de consagração e sua relevância narrativa.
- source_word: לִי
  choice: para mim
  rationale: Indica que a unção será realizada em favor de Deus, segundo seu propósito e por sua autoridade.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: aquele que eu indicar
  rationale: A expressão hebraica literalmente envolve aquele a respeito de quem Deus falará a Samuel; “indicar” transmite de modo natural que Deus identificará a pessoa, sem explicitar o cargo.
theological_decisions:
- issue: Natureza da unção
  choice: Manter “ungirá” sem especificar o cargo da pessoa ungida.
  alternative: Traduzir explicitamente como a unção de um rei.
  rationale: O contexto aponta para uma unção real, mas este versículo não nomeia o cargo; a tradução deixa que a narrativa forneça essa informação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A pontuação divide naturalmente as instruções sem alterar sua sequência. O tratamento por “você” favorece ampla compreensão contemporânea; “Jessé”, “sacrifício” e “ungirá” preservam o registro bíblico corrente.
