translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “tragam-no” conserva um tom escrito e solene sem arcaísmo excessivo. O marcador da nota foi colocado junto à expressão que ela explica.
