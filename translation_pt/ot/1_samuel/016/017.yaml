base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: pt
  text: 'Então Saul disse aos seus servos: “Por favor, procurem para mim um homem que toque bem[a] e tragam-no até mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “um homem que faz bem ao tocar”; isto é, alguém que toca com habilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Saul disse
  rationale: O consecutivo narrativo faz a ação avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Mantém o sentido comum de עֶבֶד e se ajusta ao contexto da corte de Saul sem restringi-lo a “oficiais” ou “assistentes”.
- source_word: רְאוּ נָא
  choice: Por favor, procurem
  rationale: O imperativo de ראה acompanhado de נָא funciona aqui como pedido cortês para localizar ou identificar alguém. O plural corresponde aos destinatários.
- source_word: לִי
  choice: para mim
  rationale: 'A preposição indica benefício ou interesse: Saul quer que encontrem o homem para seu serviço.'
- source_word: אִישׁ
  choice: um homem
  rationale: Reproduz o substantivo masculino singular do hebraico, sem neutralizá-lo desnecessariamente.
- source_word: מֵיטִיב לְנַגֵּן
  choice: que toque bem
  rationale: A expressão, literalmente próxima de “que faz bem ao tocar”, descreve competência musical. O subjuntivo é natural depois de “procurem ... um homem que” e não especifica um instrumento ausente neste versículo.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: e tragam-no até mim
  rationale: Preserva a ordem dirigida a vários servos e o objeto masculino singular retomado pelo pronome. “Até mim” comunica naturalmente o movimento em direção a Saul.
