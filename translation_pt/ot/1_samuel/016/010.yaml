  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: pt
  text: 'Assim, Jessé fez sete de seus filhos passarem diante de Samuel. E Samuel disse a Jessé: “Yahweh não escolheu nenhum destes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: fez ... passarem
  rationale: 'O hifil de עבר tem sentido causativo: Jessé fez com que os filhos passassem diante de Samuel. A formulação preserva esse valor e soa natural em português.'
- source_word: שִׁבְעַת בָּנָיו
  choice: sete de seus filhos
  rationale: A construção indica sete filhos pertencentes a Jessé. Esta formulação também evita sugerir que esses fossem todos os seus filhos, já que Davi ainda não havia sido apresentado.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Equivalente idiomático e digno para a relação espacial e formal de apresentação perante Samuel.
- source_word: לֹא בָחַר
  choice: não escolheu
  rationale: בחר significa escolher ou selecionar. O pretérito perfeito expressa naturalmente em português a conclusão de Samuel sobre os filhos já apresentados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בָּאֵלֶּה
  choice: nenhum destes
  rationale: No contexto negativo, a preposição ב com o demonstrativo exclui todos os candidatos apresentados. “Nenhum destes” comunica o sentido idiomático com clareza.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção causativa foi preservada, e a divisão em duas frases evita um período excessivamente carregado.
