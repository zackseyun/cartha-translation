base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: pt
  text: 'Ele respondeu[a]: “Paz. Vim para oferecer um sacrifício a Yahweh. Consagrem-se e venham comigo ao sacrifício.” Então ele consagrou Jessé e seus filhos e os convidou para o sacrifício.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Está tudo bem” ou “Em paz”. O hebraico diz simplesmente “Paz”, assegurando que a chegada de Samuel não tinha intenção hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Paz
  rationale: O substantivo isolado responde à pergunta do versículo anterior e assegura que a chegada de Samuel não é hostil. “Paz” preserva a concisão e a amplitude do hebraico; a nota registra alternativas idiomáticas.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: para oferecer um sacrifício a Yahweh
  rationale: O infinitivo expressa propósito. Em português, “oferecer um sacrifício” soa mais natural e explícito do que “sacrificar” sem objeto, sem acrescentar conteúdo substancial.
- source_word: בָּאתִי
  choice: Vim
  rationale: O perfeito hebraico declara a chegada já realizada e seu propósito presente. O pretérito perfeito é a forma natural no diálogo em português.
- source_word: הִתְקַדְּשׁוּ
  choice: Consagrem-se
  rationale: O hitpael de קדשׁ indica preparação ritual e dedicação para participar do sacrifício. “Consagrem-se” mantém o sentido cultual sem o restringir apenas à purificação.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: e venham comigo ao sacrifício
  rationale: A forma verbal, após o imperativo, funciona como instrução ou convite. A tradução conserva o movimento expresso por בוא e o caráter definido da ocasião sacrificial.
- source_word: וַיְקַדֵּשׁ
  choice: ele consagrou
  rationale: O piel de קדשׁ descreve a ação de Samuel ao preparar ritualmente Jessé e seus filhos. A repetição de “consagrou” mantém a ligação lexical com “Consagrem-se”.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: os convidou para o sacrifício
  rationale: קרא com ל pode significar chamar, convocar ou convidar. Neste contexto de inclusão na cerimônia, “convidou” é natural e evita sugerir coerção não explicitada.
- source_word: יִשַׁי
  choice: Jessé
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica descendentes do sexo masculino, elemento relevante para a narrativa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome pessoal da aliança e evita substituí-lo por um título, em conformidade com a orientação do projeto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preserva-se a concisão da resposta hebraica “Paz” e a terminologia cultual “consagrar”, esclarecida pelo contexto. A pontuação trata a fala como resposta direta de Samuel.
