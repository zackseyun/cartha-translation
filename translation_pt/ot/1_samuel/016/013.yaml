base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: pt
  text: Então Samuel tomou o chifre de óleo e ungiu Davi no meio de seus irmãos. Daquele dia em diante, o Espírito[b] de Yahweh veio impetuosamente sobre Davi[a]. Depois, Samuel se levantou e foi para Ramá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “veio com poder sobre Davi”. O verbo hebraico pode indicar uma vinda intensa e capacitadora do Espírito.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o espírito de Yahweh”. O hebraico não distingue entre letras maiúsculas e minúsculas; a capitalização reflete uma interpretação.'
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: o chifre com óleo
  rationale: Preserva a imagem concreta de um chifre, provavelmente de animal, usado como recipiente. Em português, “com óleo” evita a possível impressão de que o chifre era feito de óleo.
- source_word: וַיִּמְשַׁח אֹתוֹ
  choice: ungiu Davi
  rationale: “Ungir” é o verbo consagrado e ainda compreensível para o ato ritual. A repetição do nome torna claro o referente do pronome hebraico sem alterar o sentido.
- source_word: בְּקֶרֶב אֶחָיו
  choice: no meio dos seus irmãos
  rationale: Reproduz a localização expressa por בְּקֶרֶב e identifica corretamente os irmãos homens de Davi, sem acrescentar conclusões sobre o alcance público da cerimônia.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: o Espírito de Yahweh veio impetuosamente sobre Davi
  rationale: A construção em Samuel descreve uma vinda intensa e capacitadora. “Veio impetuosamente sobre” conserva a vivacidade do verbo e a direção indicada por אֶל, evitando a conotação potencialmente possessiva de “apoderou-se”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: daquele dia em diante
  rationale: Expressão portuguesa natural que comunica o início e a continuidade do estado descrito.
- source_word: וַיָּקָם שְׁמוּאֵל
  choice: Samuel se levantou
  rationale: Representa de modo direto o verbo קום na sequência narrativa, em registro atual e digno.
- source_word: הָרָמָתָה
  choice: foi para Ramá
  rationale: A preposição “para” expressa a direção indicada pelo ה locativo, e “Ramá” é a forma portuguesa corrente do topônimo.
theological_decisions:
- issue: Interpretação de רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  alternative: o espírito de Yahweh
  rationale: A maiúscula reflete a leitura contextual de que se trata da presença capacitadora do próprio Deus. Como o hebraico não distingue maiúsculas de minúsculas, a alternativa permanece explicitamente disponível em nota.
- issue: Caráter da unção diante dos irmãos
  choice: no meio dos seus irmãos
  alternative: entre os seus irmãos
  rationale: A tradução conserva o dado explícito do texto sem deduzir se a unção foi privada ou reconhecida publicamente em sentido político.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem narrativa foi mantida, e o nome divino foi transliterado como “Yahweh”. Os marcadores foram posicionados junto às expressões que explicam.
