reference: 1 Samuel 16:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֗ה בִּֽ/הְי֤וֹת רֽוּחַ אֱלֹהִים֙ אֶל שָׁא֔וּל וְ/לָקַ֥ח דָּוִ֛ד אֶת הַ/כִּנּ֖וֹר וְ/נִגֵּ֣ן בְּ/יָד֑/וֹ וְ/רָוַ֤ח לְ/שָׁאוּל֙ וְ/ט֣וֹב ל֔/וֹ וְ/סָ֥רָה מֵ/עָלָ֖י/ו ר֥וּחַ הָ/רָעָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: pt
  text: E, sempre que o espírito de Deus vinha sobre Saul[c], Davi pegava a lira[a] e a tocava com a mão; então Saul sentia alívio e ficava bem, e o espírito nocivo[b] se afastava dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “harpa”. O hebraico kinnor designa um antigo instrumento de cordas, provavelmente mais semelhante a uma lira do que a uma harpa moderna.
    reason: lexical_alternative
  - marker: b
    text: Ou “espírito mau”. O termo hebraico pode significar “mau” ou “nocivo”; aqui, o contexto pode destacar o efeito aflitivo do espírito sobre Saul.
    reason: lexical_alternative
  - marker: c
    text: A primeira oração diz “o espírito de Deus”, enquanto a última diz “o espírito nocivo”. A tradução preserva essa diferença de formulação presente no hebraico, sem harmonizar as duas expressões.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: E, sempre que ... vinha
  rationale: A construção com היה e infinitivo construto introduz uma circunstância recorrente. “Sempre que” comunica essa repetição com naturalidade em português.
- source_word: רוּחַ אֱלֹהִים
  choice: o espírito de Deus
  rationale: O hebraico desta primeira oração diz simplesmente “espírito de Deus”; não se acrescenta aqui o adjetivo “nocivo” ou “mau”, que só aparece no fim do versículo.
- source_word: אֶל שָׁאוּל
  choice: vinha sobre Saul
  rationale: No contexto, a expressão descreve a manifestação do espírito que passava a afetar Saul; “vinha sobre” preserva esse movimento sem importar a redação dos versículos próximos.
- source_word: הַכִּנּוֹר
  choice: a lira
  rationale: כִּנּוֹר designa um antigo instrumento de cordas, provavelmente mais semelhante a uma lira do que a uma harpa moderna.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: e a tocava com a mão
  rationale: נגן indica tocar um instrumento de cordas. O pronome “a” retoma naturalmente “lira”, e “com a mão” conserva a expressão hebraica.
- source_word: וְרָוַח לְשָׁאוּל
  choice: então Saul sentia alívio
  rationale: O verbo expressa alívio ou trégua. Esta formulação é clara e mantém Saul como aquele que experimentava o alívio.
- source_word: וְטוֹב לוֹ
  choice: e ficava bem
  rationale: A expressão indica melhora da condição ou bem-estar de Saul. “Ficava bem” é natural em português e evita especificar se a melhora era apenas emocional ou também física.
- source_word: רוּחַ הָרָעָה
  choice: o espírito nocivo
  rationale: רָעָה pode indicar maldade moral ou algo mau, danoso e aflitivo. Neste contexto, “nocivo” ressalta o efeito prejudicial sobre Saul sem definir de modo indevido a natureza moral do espírito.
- source_word: וְסָרָה מֵעָלָיו
  choice: se afastava dele
  rationale: סור denota afastamento ou retirada. A forma pronominal expressa com naturalidade em português a partida do espírito.
theological_decisions:
- issue: Relação entre רוּחַ אֱלֹהִים na primeira oração e רוּחַ הָרָעָה na última
  choice: Traduzir a primeira expressão como “o espírito de Deus” e a última como “o espírito nocivo”, preservando a diferença de formulação do hebraico.
  alternative: Harmonizar as duas expressões, traduzindo a primeira como “o espírito nocivo vindo de Deus”, ou verter a última como “o espírito maligno”.
  rationale: O texto hebraico emprega expressões diferentes nas duas orações. Mantê-las evita resolver na tradução a tensão entre elas. “Nocivo” preserva a possibilidade contextual de um espírito aflitivo sem impor uma afirmação desnecessária sobre seu caráter moral.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A sintaxe narrativa é fluente, enquanto termos teologicamente sensíveis permanecem próximos do hebraico. Emprega-se “espírito” com inicial minúscula para não resolver pela capitalização a identidade ou natureza do espírito mencionado.
