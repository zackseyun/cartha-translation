base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: pt
  text: 'Samuel disse: “Como poderei ir? Se Saul ficar sabendo, ele me matará.” Yahweh disse: “Leve com você uma novilha[a] e diga: ‘Vim oferecer um sacrifício a Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma vaca jovem”.'
    reason: Alternativa lexical mais transparente para leitores que não conheçam o termo específico “novilha”.
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: Como poderei ir?
  rationale: A expressão pergunta pela possibilidade prática de Samuel cumprir a ordem. A formulação é natural em português e preserva sua apreensão.
- source_word: וְשָׁמַע שָׁאוּל
  choice: Se Saul souber disso
  rationale: Embora a construção hebraica use literalmente o verbo 'ouvir', no contexto ela introduz uma condição e significa que Saul toma conhecimento da viagem. 'Souber disso' comunica esse sentido com naturalidade.
- source_word: וַהֲרָגָנִי
  choice: ele me matará
  rationale: Expressa a consequência que Samuel espera caso Saul tome conhecimento da missão, mantendo a ameaça como real e iminente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֶגְלַת בָּקָר
  choice: uma novilha
  rationale: Designa uma fêmea bovina jovem; 'novilha' é uma equivalência portuguesa precisa e concisa.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Leve com você
  rationale: Reproduz de modo idiomático o sentido da expressão hebraica literalmente formulada como 'tomar em sua mão'.
- source_word: לִזְבֹּחַ לַיהוָה בָּאתִי
  choice: Vim oferecer um sacrifício a Yahweh
  rationale: Expressa com clareza o propósito cultual da vinda e mantém Yahweh como destinatário do sacrifício.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Possível tensão moral na instrução dada a Samuel
  choice: Traduzir diretamente a fala sem explicá-la ou harmonizá-la
  alternative: Acrescentar linguagem que apresente a declaração como pretexto, ocultação ou descrição completa da missão
  rationale: O versículo realmente apresenta o sacrifício como propósito declarado, mas não explica aqui sua relação com a missão de ungir. A tradução preserva essa tensão sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O discurso direto e a concisão do hebraico foram preservados; o marcador [a] foi colocado junto ao termo a que a nota lexical se refere.
