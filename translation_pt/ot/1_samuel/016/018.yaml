  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: pt
  text: 'Então um dos jovens respondeu: “Eis que vi um filho de Jessé, o belemita,[a] que sabe tocar,[b] é homem valente e capaz,[c] homem de guerra, sensato no falar e de boa aparência, e Yahweh está com ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o belemita”, gentílico que significa “de Belém”.'
    reason: Esclarece o gentílico sem resolver além do necessário sua ligação sintática na expressão hebraica.
  - marker: b
    text: 'Ou: “é habilidoso ao tocar”. O instrumento não é mencionado neste versículo, embora o contexto fale de tocar para Saul.'
    reason: Registra a nuance de habilidade e evita inserir no texto principal um instrumento não nomeado.
  - marker: c
    text: A expressão hebraica também pode significar “guerreiro valente”, “homem poderoso” ou, em sentido mais amplo, “homem capaz”.
    reason: Preserva a amplitude lexical de גִּבּוֹר חַיִל.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: Em narrativa dialogal, a combinação introduz a fala como resposta; em português, “respondeu” é natural e evita o redundante “respondeu e disse”.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: um dos jovens
  rationale: Mantém o sentido lexical de נְעָרִים sem definir além do texto se eram servos ou cortesãos.
- source_word: הִנֵּה רָאִיתִי
  choice: Vi
  rationale: הִנֵּה chama atenção para a informação apresentada, mas sua tradução explícita como “Veja” seria menos natural nesta recomendação em português; o perfeito é adequadamente expresso pelo pretérito perfeito.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: um filho de Jessé, o belemita
  rationale: O gentílico singular masculino modifica mais naturalmente Jessé, identificando-o como natural de Belém, e preserva a forma compacta do hebraico.
- source_word: יֹדֵעַ נַגֵּן
  choice: que sabe tocar
  rationale: Expressa habilidade musical sem acrescentar um instrumento que não é nomeado neste versículo.
- source_word: גִּבּוֹר חַיִל
  choice: homem valente e capaz
  rationale: A expressão pode indicar bravura, vigor ou capacidade; esta formulação conserva sua amplitude e evita duplicá-la inteiramente com “homem de guerra”.
- source_word: אִישׁ מִלְחָמָה
  choice: homem de guerra
  rationale: Preserva a expressão marcial e a estrutura nominal enfática do original.
- source_word: נְבוֹן דָּבָר
  choice: sensato no falar
  rationale: Representa discernimento ou prudência manifestada na fala, sem reduzir a expressão apenas à eloquência.
- source_word: אִישׁ תֹּאַר
  choice: de boa aparência
  rationale: תֹּאַר se refere à forma ou aparência; a expressão portuguesa é digna, clara e não intensifica indevidamente como “muito bonito”.
- source_word: וַיהוָה עִמּוֹ
  choice: E Yahweh está com ele
  rationale: Translitera o nome divino e verte naturalmente a oração nominal hebraica no presente.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal, enquanto “SENHOR” representa a tradição de leitura substitutiva.
- issue: Amplitude de גִּבּוֹר חַיִל
  choice: homem valente e capaz
  alternative: guerreiro valente
  rationale: Como a expressão seguinte já diz “homem de guerra”, a escolha mantém tanto a possível bravura quanto a capacidade geral, sem resolver a expressão exclusivamente em sentido militar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A lista mantém o ritmo cumulativo da recomendação, sem forçar paralelismo artificial. “Yahweh” conserva o nome divino, e as notas registram ambiguidades lexicais genuínas.
