  naturalness: O português é claro e de registro bíblico moderno. «Eis que» é uma forma ainda compreensível e apropriada ao tom da fala. Manter a última oração ligada por vírgula integra melhor «Yahweh está com ele» à enumeração hebraica.
  terminology: «Homem valente e capaz», «homem de guerra», «sensato no falar» e «de boa aparência» são soluções defensáveis. A nota sobre «belemita» deve limitar-se ao valor do gentílico, pois a construção hebraica compacta não exige que a nota resolva de modo excessivamente categórico a qual elemento ele se vincula.
  issues:
  - severity: low
    issue: A partícula הִנֵּה não é representada.
    rationale: Embora possa por vezes ser implicitada em português, ela introduz enfaticamente a recomendação; «Eis que» a reproduz de maneira clara e apropriada ao registro.
  - severity: low
    issue: A nota a afirma que o gentílico se refere mais naturalmente a Jessé.
    rationale: A nota lexical deve explicar «o belemita» sem fixar desnecessariamente uma relação sintática que a expressão compacta pode deixar em aberto para o leitor.
