base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: pt
  text: 'Então mandou buscá-lo e o trouxe para dentro. Ele era avermelhado,[a] tinha belos olhos e boa aparência. Yahweh disse: “Levante-se e unja-o, pois este é ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico descreve uma coloração avermelhada, sem especificar necessariamente cabelo ruivo.
    reason: clarificação lexical
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: Então ele mandou buscá-lo e o fez entrar
  rationale: A sequência narrativa é expressa naturalmente em português. A construção causativa de וַיְבִיאֵהוּ permite entender que ele providenciou que o rapaz fosse trazido; “mandou buscá-lo e o fez entrar” mantém essa progressão sem identificar explicitamente o sujeito além do hebraico.
- source_word: אַדְמוֹנִי
  choice: tinha a pele avermelhada
  rationale: O termo indica coloração avermelhada, provavelmente da compleição, mas não exige que o cabelo fosse ruivo. A formulação evita essa especificação indevida.
- source_word: עִם יְפֵה עֵינַיִם
  choice: belos olhos
  rationale: Reproduz de modo claro e idiomático a descrição física literal do hebraico.
- source_word: וְטוֹב רֹאִי
  choice: boa aparência
  rationale: Expressa a ideia de uma aparência agradável sem acrescentar qualidades morais ao retrato físico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: קוּם מְשָׁחֵהוּ
  choice: Levante-se e unja-o
  rationale: Mantém os dois imperativos diretos, em linguagem atual e digna.
- source_word: כִּי זֶה הוּא
  choice: pois é este
  rationale: Conserva a identificação breve e enfática do hebraico; a nota registra uma reprodução mais literal da estrutura pronominal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Descrição da aparência de Davi
  choice: Manter a descrição estritamente física
  alternative: Interpretar אַדְמוֹנִי como cabelo ruivo ou atribuir valor moral à boa aparência
  rationale: O hebraico descreve a aparência externa, sem especificar cabelo ruivo nem transformar os traços físicos em qualidades espirituais ou morais.
- issue: Identificação divina de Davi
  choice: pois é este
  alternative: pois este é ele
  rationale: As duas formas refletem a expressão enfática כִּי זֶה הוּא. O texto principal prioriza naturalidade em português, e a nota preserva a estrutura mais literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O rapaz” explicita apenas o referente masculino jovem já presente no contexto e evita uma sucessão pouco natural de pronomes. A descrição permanece física e sóbria.
