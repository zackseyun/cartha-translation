  naturalness: O texto revisto é claro, moderno e fluente em português internacional com boa legibilidade brasileira. «Avermelhado» mantém a concisão do hebraico e evita uma interpretação corporal excessivamente específica.
  terminology: «Yahweh» corresponde ao Tetragrama. «Ungir» é o termo tradicional e preciso para משׁח neste contexto. «Boa aparência» traduz naturalmente וְטוֹב רֹאִי sem importar avaliação moral.
