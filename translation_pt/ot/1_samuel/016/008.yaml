base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: pt
  text: 'Então Jessé chamou Abinadabe e o fez passar diante de Samuel. Então Samuel disse: “Yahweh também não escolheu este.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: Então Jessé chamou Abinadabe
  rationale: “Chamou” expressa naturalmente קרא neste contexto; a preposição אֶל é absorvida pela construção portuguesa, e “então” dá continuidade à sequência narrativa.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: e o fez passar diante de Samuel
  rationale: Preserva o valor causativo do hifil de עבר e a imagem concreta de Abinadabe passando diante de Samuel.
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém o sujeito implícito do hebraico. Pelo contexto, o referente é Samuel, mas a tradução não explicita o que o texto deixa implícito.
- source_word: גַּם בָּזֶה לֹא בָחַר
  choice: também não escolheu este
  rationale: Reproduz de modo natural em português a força aditiva de גַּם dentro da oração negativa, sem alterar o foco demonstrativo de בָּזֶה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome próprio divino; “Yahweh” preserva essa distinção, enquanto “SENHOR” o substitui por um título.
- issue: Identidade do sujeito de וַיֹּאמֶר
  choice: ele disse
  alternative: Samuel disse
  rationale: Embora o contexto indique Samuel, o hebraico não repete seu nome. A formulação escolhida conserva essa característica narrativa sem criar ambiguidade grave em português.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem e as relações verbais do hebraico foram preservadas sem produzir uma formulação artificial.
