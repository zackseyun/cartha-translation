  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: pt
  text: 'Então Saul mandou dizer a Jessé: “Por favor, permita que Davi esteja diante de mim,[a] pois ele encontrou favor aos meus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “permaneça diante de mim”, no sentido de continuar a serviço de Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי לֵאמֹר
  choice: Então Saul mandou dizer a Jessé
  rationale: O wayyiqtol dá prosseguimento à narrativa, representado naturalmente por “Então”. A construção “mandou dizer” comunica em português corrente o envio de uma mensagem introduzida por לֵאמֹר, sem precisar explicitar um mensageiro.
- source_word: יַעֲמָד נָא
  choice: Por favor, deixe Davi ficar
  rationale: O jussivo de עמד com נָא expressa um pedido cortês. “Deixe ... ficar” conserva tanto a ideia básica de estar quanto a possibilidade contextual de permanecer no serviço real.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Mantém a imagem hebraica e continua inteligível em português; no contexto da corte, também sugere estar à disposição e a serviço do rei.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do pedido de Saul e se encaixa com naturalidade no discurso direto.
- source_word: מָצָא חֵן בְּעֵינָי
  choice: encontrou favor aos meus olhos
  rationale: Preserva o idioma hebraico de obter aprovação pessoal e sua imagem visual. “Favor” evita uma conotação teológica indevida neste contexto cortesão.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: Davi / Saul / Jessé
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
