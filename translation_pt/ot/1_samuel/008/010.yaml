  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י יְהוָ֑ה אֶל הָ/עָ֕ם הַ/שֹּׁאֲלִ֥ים מֵ/אִתּ֖/וֹ מֶֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/010.yaml
  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: pt
  text: Então Samuel comunicou todas as palavras de Yahweh ao povo que lhe pedia um rei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que lhe havia pedido um rei”. O particípio hebraico pode indicar uma ação em andamento ou caracterizar o povo como aqueles que fizeram esse pedido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: comunicou
  rationale: Embora o verbo signifique formalmente “disse”, “comunicou todas as palavras” expressa com naturalidade que Samuel transmitiu integralmente a mensagem divina.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: todas as palavras de Yahweh
  rationale: Mantém a ênfase de כָּל na totalidade e preserva a expressão bíblica concreta “palavras de Yahweh”, sem parafraseá-la como “tudo o que Yahweh disse”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: אֶל הָעָם
  choice: ao povo
  rationale: Reproduz de modo direto e natural o destinatário indicado por אֶל.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: que lhe pedia um rei
  rationale: O particípio caracteriza o povo por seu pedido e pode indicar ação em curso. O singular “pedia” concorda naturalmente com o coletivo “povo”; “lhe” indica que o pedido era dirigido a Samuel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Aspecto do particípio הַשֹּׁאֲלִים
  choice: que lhe pedia um rei
  alternative: que lhe havia pedido um rei
  rationale: A forma participial admite tanto uma solicitação vista como em andamento quanto a caracterização do povo por um pedido já feito. O texto principal conserva a leitura durativa ou característica, e a nota registra a alternativa anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comunicou” evita a rigidez de “disse todas as palavras”, enquanto a formulação “todas as palavras de Yahweh” mantém a textura e a ênfase do hebraico.
