- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Designação social e política tradicional para os líderes mais velhos e representativos de Israel.
- source_word: וַיָּבֹאוּ אֶל
  choice: foram até
  rationale: בוא com אֶל indica movimento em direção a Samuel; «foram até» é idiomático em português e mantém a perspectiva narrativa.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma consagrada do nome próprio em português.
- source_word: הָרָמָתָה
  choice: em Ramá
  rationale: O ה direcional marca movimento rumo a Ramá, enquanto a construção portuguesa identifica naturalmente o lugar onde Samuel se encontrava; a nota registra a forma literal.
