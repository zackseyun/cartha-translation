  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל שְׁמוּאֵל֙ שְׁמַ֣ע בְּ/קוֹלָ֔/ם וְ/הִמְלַכְתָּ֥ לָ/הֶ֖ם מֶ֑לֶךְ וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לְכ֖וּ אִ֥ישׁ לְ/עִירֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: pt
  text: 'E Yahweh disse a Samuel: “Atenda ao que eles pedem[a] e constitua um rei para eles”. Então Samuel disse aos homens de Israel: “Vá cada um para a sua cidade”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “escute a voz deles”. A expressão hebraica pode significar dar ouvidos a alguém e atender ao que essa pessoa pede.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: שְׁמַע בְּקוֹלָם
  choice: Atenda ao que eles pedem
  rationale: O idioma hebraico, literalmente “escute a voz deles”, significa aqui dar ouvidos e agir de acordo com o pedido; a formulação portuguesa comunica esse sentido com naturalidade.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: constitua um rei para eles
  rationale: O hifil de מלך indica instalar ou estabelecer alguém como rei. “Constitua” preserva o sentido causativo e régio sem sugerir que o rei seja criado.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Mantém a forma masculina explícita do hebraico e sua referência aos israelitas reunidos.
- source_word: אִישׁ לְעִירוֹ
  choice: cada um para a sua cidade
  rationale: אִישׁ tem uso distributivo nesta fórmula de despedida; em português, “cada um” evita a repetição pesada de “homens... cada homem” sem apagar o referente masculino já expresso.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio divino; a transliteração preserva sua função no texto.
- issue: Força de שְׁמַע בְּקוֹלָם
  choice: Atenda ao que eles pedem
  alternative: Escute a voz deles; obedeça à voz deles
  rationale: A expressão implica aquiescência ao pedido, mas “obedeça” poderia sugerir de modo excessivo que o povo exerce autoridade sobre Deus; a escolha mantém a tensão narrativa sem essa inferência.
- issue: Masculino em אַנְשֵׁי יִשְׂרָאֵל
  choice: os homens de Israel
  alternative: os israelitas; o povo de Israel
  rationale: Conserva o gênero gramatical e referencial explícito do original, reconhecendo que o grupo reunido pode representar Israel de modo mais amplo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem narrativa e o discurso direto foram preservados; evitou-se uma tradução excessivamente literal do idioma hebraico em שְׁמַע בְּקוֹלָם.
