base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: pt
  text: 'E Javé disse a Samuel: “Atenda ao que o povo diz em tudo o que disserem a você, pois não foi a você que rejeitaram, mas a mim como rei sobre eles.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas rejeitaram que eu reine sobre eles”.'
    reason: Alternativa que explicita verbalmente a construção hebraica מִמְּלֹךְ עֲלֵיהֶם, sem convertê-la em uma oração de finalidade.
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, em vez de substituí-lo pelo título “SENHOR”.
- source_word: שְׁמַע
  choice: Atenda
  rationale: No contexto, o imperativo não pede apenas percepção auditiva, mas que Samuel dê ouvidos ao pedido do povo e aja de acordo com ele; “atenda” comunica isso naturalmente sem tornar explícita uma obediência absoluta.
- source_word: בְּקוֹל הָעָם
  choice: ao que o povo diz
  rationale: Traduz de modo idiomático a expressão hebraica literalmente relacionada à “voz do povo”, preservando seu sentido contextual.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: em tudo o que disserem a você
  rationale: Mantém a abrangência de כֹל e a referência direta ao que o povo dirá a Samuel.
- source_word: מָאַס
  choice: rejeitaram
  rationale: “Rejeitar” expressa adequadamente a recusa pessoal e política presente nas duas ocorrências do verbo.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: para que eu não reine sobre eles
  rationale: Conserva a construção hebraica com o infinitivo de מלך e sua força verbal de exercer o reinado, sem reduzi-la apenas a um título.
theological_decisions:
- issue: A rejeição do reinado divino no pedido por um rei humano
  choice: O contraste declara que, em última análise, o povo rejeitou Javé e seu reinado sobre eles.
  alternative: Entender que o povo rejeitou somente a liderança de Samuel.
  rationale: O hebraico contrasta explicitamente “você” com “mim” e relaciona a rejeição ao ato de Javé reinar sobre o povo; a tradução mantém essa tensão sem acrescentar explicação doutrinária.
- issue: Relação sintática de מִמְּלֹךְ עֲלֵיהֶם
  choice: “para que eu não reine sobre eles”
  alternative: “como rei sobre eles”
  rationale: A formulação principal preserva mais diretamente a construção verbal hebraica, enquanto a nota registra a leitura idiomática alternativa sem eliminar a ambiguidade da relação expressa por מִן.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “A você” evita formas regionais menos amplas; “Javé” preserva o nome divino em forma portuguesa corrente. A repetição de “rejeitaram” reproduz a ênfase contrastiva do hebraico.
