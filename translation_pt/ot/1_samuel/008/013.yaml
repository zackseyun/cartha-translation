  text: He will take your daughters to be perfumers[a], cooks, and bakers.
translation:
  language: pt
  text: Ele tomará as filhas de vocês para serem perfumistas[a], cozinheiras e padeiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preparadoras de unguentos”. O termo hebraico pode designar, de modo amplo, mulheres que preparavam misturas aromáticas, incluindo perfumes e unguentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: '[marcador de objeto direto, sem tradução independente]'
  rationale: Marca “as filhas de vocês” como objeto direto de “tomará”; o português não o representa com uma palavra separada.
- source_word: בְּנוֹתֵיכֶם
  choice: as filhas de vocês
  rationale: O plural construto de “filha” com sufixo de segunda pessoa masculina plural indica primariamente uma relação familiar; “de vocês” é amplamente compreensível e natural.
- source_word: יִקָּח
  choice: tomará
  rationale: O imperfeito qal tem valor futuro na advertência de Samuel. “Tomará” conserva a ideia de apropriação ou recrutamento coercivo, sem suavizá-la como faria “empregará”.
- source_word: לְרַקָּחוֹת
  choice: para serem perfumistas
  rationale: O termo feminino plural designa preparadoras de misturas aromáticas, como perfumes ou unguentos. “Perfumistas” é conciso e adequado ao provável serviço da corte.
- source_word: וּלְטַבָּחוֹת
  choice: cozinheiras
  rationale: O substantivo feminino plural designa mulheres encarregadas de preparar alimentos; “cozinheiras” é a forma corrente e explícita em português.
- source_word: וּלְאֹפוֹת
  choice: padeiras
  rationale: A forma feminina plural substantivada deriva do verbo “assar” e designa mulheres que assam pão; “padeiras” é a equivalência ocupacional mais natural.
