  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: pt
  text: Naquele dia, vocês clamarão por causa do rei de vocês, que escolheram para si, mas Yahweh não lhes responderá naquele dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: vocês clamarão
  rationale: O verbo זעק indica um clamor intenso em situação de aflição, muitas vezes como pedido de socorro. “Clamarão” preserva essa força sem explicitar além do texto o conteúdo do apelo.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal natural em português, repetida no versículo para conservar a ênfase solene do hebraico.
- source_word: מִלִּפְנֵי
  choice: por causa de
  rationale: 'Embora a expressão tenha o sentido literal de “de diante da presença de”, aqui indica a causa do clamor: o rei e as consequências de seu governo.'
- source_word: מַלְכְּכֶם
  choice: do rei
  rationale: O possessivo hebraico é recuperado pelo contexto da oração relativa, “que escolheram para si”; em português, evitar “do seu rei que vocês...” torna a frase mais fluida sem perder a referência ao rei deles.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: que escolheram para si
  rationale: Preserva tanto a responsabilidade de Israel pela escolha quanto a nuance reflexiva de לָכֶם.
- source_word: וְלֹא יַעֲנֶה
  choice: mas ... não lhes responderá
  rationale: “Mas” expressa naturalmente o contraste entre o clamor do povo e a ausência de resposta divina. “Lhes responderá” é idiomático e corresponde ao objeto אֶתְכֶם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e segue uma transliteração acadêmica amplamente reconhecida.
- issue: Natureza da ausência de resposta divina
  choice: não lhes responderá
  alternative: não os atenderá
  rationale: A tradução mantém a formulação direta e a tensão teológica do hebraico, sem explicar se isso significa silêncio, recusa do pedido ou falta de livramento.
translation_notes:
  register: Português moderno, claro e solene, com uso de “vocês” para o plural. A ordem foi levemente ajustada para maior naturalidade, mantendo a repetição enfática de “naquele dia”.
