  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: pt
  text: Assim como em todas as ações que praticaram desde o dia em que os tirei do Egito até hoje[a] — abandonando-me e servindo outros deuses[b] —, também estão agindo com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “até este dia”.
    reason: lexical_alternative
  - marker: b
    text: “Servindo outros deuses” também pode ser expresso como “adorando outros deuses”; o verbo hebraico significa literalmente “servir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: Assim como têm agido
  rationale: Expressa de modo natural em português a comparação introduzida por כְּ e resume a construção literalmente repetitiva, “todos os atos que praticaram”, sem perder a referência ao padrão contínuo de conduta.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: desde o dia em que os fiz sair do Egito
  rationale: O hifil de עלה indica que o Senhor fez Israel subir/sair do Egito. “Fiz sair” conserva a causalidade e soa mais natural em português internacional do que reproduzir literalmente “fiz subir”.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente idiomático da expressão temporal hebraica, mantendo todo o intervalo desde o êxodo até o momento da fala.
- source_word: וַיַּעַזְבֻנִי
  choice: abandonando-me
  rationale: Preserva a ideia de deixar ou abandonar o Senhor e, na estrutura da frase, explicita em que consistiu a conduta mencionada.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: servindo a outros deuses
  rationale: Mantém o sentido básico de עבד, “servir”, que neste contexto inclui culto e lealdade religiosa.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: também estão agindo com você
  rationale: Conserva a analogia e o aspecto presente da ação, sem especificar além do hebraico exatamente o que o povo faz a Samuel.
theological_decisions:
- issue: Relação entre a rejeição do Senhor e o modo como o povo trata Samuel
  choice: Manter a analogia como um padrão contínuo de conduta, sem caracterizá-la adicionalmente como rebelião.
  alternative: “Também estão se rebelando contra você como se rebelaram contra mim.”
  rationale: O texto menciona explicitamente o abandono do Senhor e o serviço a outros deuses, mas deixa aberta a formulação do que o povo está fazendo a Samuel. A tradução preserva essa tensão e não acrescenta uma interpretação psicológica ou doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os travessões delimitam a explicação da conduta histórica do povo sem transformar a frase em uma paráfrase doutrinária.
