  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: pt
  text: Quando Samuel envelheceu, nomeou seus filhos como juízes sobre Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “designou seus filhos como juízes para Israel”. O verbo hebraico significa literalmente “pôs”, e a preposição diante de “Israel” pode ser entendida como “para” ou “sobre”, conforme se compreenda a nomeação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa hebraica introduz uma circunstância temporal; “Quando” comunica essa função com naturalidade, sem reproduzir de modo rígido o idiomatismo “e aconteceu quando”.
- source_word: זָקֵן
  choice: envelheceu
  rationale: O verbo expressa o processo de tornar-se velho, e não apenas uma condição estática; “envelheceu” preserva esse aspecto em português corrente.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיָּשֶׂם
  choice: nomeou
  rationale: Embora o sentido básico seja “pôr/colocar”, neste contexto o verbo descreve a designação para uma função; “nomeou” expressa a ação institucional com clareza.
- source_word: אֶת בָּנָיו
  choice: seus filhos
  rationale: O hebraico se refere especificamente aos filhos homens de Samuel; a formulação portuguesa é exata e natural.
- source_word: שֹׁפְטִים
  choice: juízes
  rationale: Preserva o título tradicional da função judicial e governante no contexto de Samuel, sem reduzi-la a uma categoria moderna mais estreita.
- source_word: לְיִשְׂרָאֵל
  choice: sobre Israel
  rationale: A preposição pode indicar relação ou esfera de atuação; “sobre Israel” comunica de modo natural o exercício de autoridade judicial, sem eliminar a alternativa “para Israel”.
