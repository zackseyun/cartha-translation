base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: pt
  text: Mas os filhos dele não seguiram o caminho dele; desviaram-se em busca de lucro desonesto, aceitaram subornos e perverteram a justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכוֹ
  choice: não seguiram os seus caminhos
  rationale: A construção הלך com בְּ + דֶּרֶךְ descreve conduta ou modo de viver. “Seguiram os seus caminhos” comunica naturalmente o idioma hebraico em português, mantendo a imagem de um caminho moral.
- source_word: וַיִּטּוּ
  choice: desviaram-se
  rationale: נטה indica afastamento do rumo correto; a forma pronominal é natural em português e preserva a metáfora moral.
- source_word: אַחֲרֵי הַבָּצַע
  choice: em busca de lucro desonesto
  rationale: בצע designa ganho procurado ou obtido de modo injusto ou explorador. A expressão conserva tanto a ideia de proveito material quanto seu caráter ilícito.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: aceitaram subornos
  rationale: שֹׁחַד é especificamente pagamento corruptor, sobretudo em contexto judicial. O plural descreve uma prática habitual ou reiterada.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: perverteram a justiça
  rationale: O idioma hebraico significa distorcer decisões judiciais. Esta formulação é clara, concisa e preserva a força forense da expressão.
- source_word: בָּנָיו
  choice: os filhos dele
  rationale: O substantivo hebraico refere-se especificamente aos filhos homens de Samuel; “dele” evita uma possível leitura momentânea de que os caminhos pertenciam aos filhos.
theological_decisions:
- issue: Descrição moral e jurídica dos filhos de Samuel
  choice: Apresentar o versículo como denúncia explícita de corrupção judicial.
  alternative: Empregar linguagem moral genérica, como “foram gananciosos” ou “agiram injustamente”.
  rationale: 'O hebraico acumula termos ligados à corrupção: busca de ganho ilícito, aceitação de suborno e distorção da justiça. A tradução mantém essa especificidade jurídica sem reduzir a acusação a mau caráter em geral.'
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução usa equivalência ótima: torna natural o idioma “andar no caminho” como “seguir os caminhos”, mas conserva a metáfora do desvio e a terminologia jurídica incisiva do original.'
