reference: 1 Samuel 8:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֤רַע הַ/דָּבָר֙ בְּ/עֵינֵ֣י שְׁמוּאֵ֔ל כַּ/אֲשֶׁ֣ר אָמְר֔וּ תְּנָ/ה לָּ֥/נוּ מֶ֖לֶךְ לְ/שָׁפְטֵ֑/נוּ וַ/יִּתְפַּלֵּ֥ל שְׁמוּאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: pt
  text: 'Mas aquilo pareceu errado aos olhos de Samuel quando disseram: “Dê-nos um rei para nos julgar[a]”. Então Samuel orou a Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Julgar” também pode ter aqui o sentido mais amplo de “governar” ou “reger”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: pareceu errado
  rationale: Preserva a força avaliativa de רעע sem sugerir que a questão fosse ontologicamente má; em conjunto com “aos olhos de Samuel”, expressa claramente a avaliação negativa dele.
- source_word: הַדָּבָר
  choice: aquilo
  rationale: Retoma de modo natural, em português, o que os anciãos acabavam de dizer, sem restringir דבר a “pedido”.
- source_word: בְּעֵינֵי שְׁמוּאֵל
  choice: aos olhos de Samuel
  rationale: Mantém a imagem do idioma hebraico e deixa explícito que se trata da perspectiva de Samuel.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: quando disseram
  rationale: Representa naturalmente o valor temporal de כַּאֲשֶׁר e evita tornar explícita uma causalidade maior do que a forma hebraica exige.
- source_word: תְּנָה לָּנוּ
  choice: Dê-nos
  rationale: Equivalente direto e idiomático do imperativo de נתן com o pronome dativo.
- source_word: מֶלֶךְ
  choice: um rei
  rationale: Correspondência comum e inequívoca no contexto.
- source_word: לְשָׁפְטֵנוּ
  choice: para nos julgar
  rationale: Preserva o vínculo lexical com o tema dos juízes em Samuel, embora o verbo também possa abranger governar ou reger.
- source_word: וַיִּתְפַּלֵּל
  choice: orou
  rationale: Equivalente natural do hitpael de פלל, sem especificar indevidamente que se tratava de intercessão.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: Traduz a preposição conforme o contexto de oração e translitera o nome divino de maneira explícita e consistente com a camada inglesa fornecida.
theological_decisions:
- issue: Força da avaliação negativa de Samuel em וַיֵּרַע
  choice: pareceu errado aos olhos de Samuel
  alternative: desagradou a Samuel; foi mau aos olhos de Samuel
  rationale: A formulação conserva tanto a linguagem avaliativa forte quanto a perspectiva expressa por “aos olhos de Samuel”, sem reduzir a frase a mera emoção nem afirmar além do texto que o pedido era mau em sentido absoluto.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração mantém o nome próprio presente no hebraico e segue a orientação explícita do material de consulta fornecido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “aos olhos de Samuel” foi mantida por ser transparente em português e preservar a perspectiva do hebraico; “aquilo pareceu errado” evita uma formulação excessivamente rígida.
