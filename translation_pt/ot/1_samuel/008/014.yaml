  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: pt
  text: Ele tomará os campos de vocês, as vinhas de vocês e os melhores olivais[a] de vocês e os dará aos seus servos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as suas melhores oliveiras” ou “os seus melhores pomares de oliveiras”; o hebraico provavelmente se refere a plantações de oliveiras como propriedade agrícola.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos seus escravos”; a palavra hebraica pode designar servos ou escravos, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: os campos de vocês
  rationale: שָׂדֶה designa normalmente um campo ou uma extensão de terra cultivada. “Campos” é direto, natural e adequado à lista de propriedades agrícolas.
- source_word: כַּרְמֵיכֶם
  choice: as vinhas de vocês
  rationale: כֶּרֶם refere-se normalmente a uma vinha. “Vinhas” é a equivalência portuguesa corrente e precisa.
- source_word: זֵיתֵיכֶם
  choice: os olivais de vocês
  rationale: זַיִת pode designar oliveiras coletivamente ou uma plantação de oliveiras. Em paralelo com campos e vinhas, “olivais” comunica melhor uma propriedade agrícola produtiva.
- source_word: הַטּוֹבִים
  choice: os melhores
  rationale: Embora טוֹבִים signifique literalmente “bons”, neste contexto de apropriação régia indica os bens mais desejáveis ou de melhor qualidade; “melhores” expressa esse valor contextual sem exagero.
- source_word: יִקָּח
  choice: tomará
  rationale: לָקַח é o verbo comum para “tomar”. A forma simples preserva o léxico hebraico e deixa que o contexto transmita o caráter coercivo da ação.
- source_word: וְנָתַן
  choice: e os dará
  rationale: נָתַן significa normalmente “dar”. O pronome “os” retoma com naturalidade os três tipos de propriedade enumerados.
- source_word: לַעֲבָדָיו
  choice: aos seus servos
  rationale: עֶבֶד pode significar “servo” ou “escravo”. No contexto da corte real, “servos” pode abranger oficiais e dependentes do rei sem definir além do texto a condição jurídica deles.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem da lista hebraica foi mantida, enquanto a expressão possessiva “de vocês” foi colocada ao fim da série para evitar repetição pesada. Os marcadores foram posicionados junto aos termos a que suas notas realmente se referem.
