  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: pt
  text: para que nós também sejamos como todas as nações[a], e o nosso rei nos julgue[b], saia à nossa frente e lute as nossas batalhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e nós também seremos como todas as nações”. A forma hebraica pode ser traduzida mais literalmente como uma sequência futura, embora neste contexto provavelmente expresse o propósito do povo ao pedir um rei.'
    reason: lexical_alternative
  - marker: b
    text: “Julgue” também pode ter o sentido mais amplo de “governe” ou “reja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ
  choice: para que ... sejamos
  rationale: No contexto, a forma verbal dá continuidade ao propósito do pedido por um rei. A construção portuguesa com «para que» comunica esse valor com naturalidade, sem ocultar a possibilidade de uma sequência futura mais literal.
- source_word: גַם אֲנַחְנוּ
  choice: também nós
  rationale: Preserva a ênfase de que Israel deseja, ele próprio, igualar-se aos demais povos.
- source_word: כְּכָל הַגּוֹיִם
  choice: como todas as outras nações
  rationale: «Nações» representa o sentido contextual de povos politicamente distintos, sem introduzir o sentido técnico posterior de «gentios». «Outras» torna explícita em português a comparação entre Israel e as nações ao redor.
- source_word: וּשְׁפָטָנוּ
  choice: nos julgue
  rationale: Mantém o vínculo lexical com o tema dos juízes no livro, embora o verbo também possa abranger governar e administrar justiça.
- source_word: מַלְכֵּנוּ
  choice: o nosso rei
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo e destaca a estrutura política desejada pelo povo.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: saia à nossa frente
  rationale: Preserva a imagem hebraica de liderança, especialmente militar, em formulação portuguesa natural.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: lute nas nossas batalhas
  rationale: Expressa naturalmente a construção cognata hebraica e conserva o contexto militar imediato.
theological_decisions:
- issue: Sentido de גּוֹיִם no pedido de Israel por uma monarquia
  choice: nações
  alternative: gentios
  rationale: O contraste é político e cultural entre Israel e os povos circundantes. «Nações» evita importar um uso técnico posterior e mantém a tensão do desejo de Israel de se assemelhar a esses povos.
- issue: Amplitude da função real expressa por שׁפט
  choice: julgue
  alternative: governe
  rationale: «Julgue» conserva a ligação literária com os juízes e a administração da justiça, enquanto uma nota registra o sentido governamental mais amplo sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o paralelismo do hebraico, e as notas mantêm abertas as principais alternativas sem sobrecarregar o texto.
