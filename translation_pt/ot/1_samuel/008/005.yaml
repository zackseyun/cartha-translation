base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: pt
  text: 'Disseram-lhe: “Veja, você envelheceu, e seus filhos não têm andado nos seus caminhos. Agora, estabeleça para nós um rei que nos julgue[a], como todas as nações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos governe” ou “reine sobre nós”; neste contexto, o verbo hebraico traduzido como “julgar” pode incluir uma autoridade governamental mais ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Funciona como marcador discursivo atual e conserva a força demonstrativa e enfática do hebraico, sem recorrer ao arcaico “eis”.
- source_word: זָקַנְתָּ
  choice: você envelheceu
  rationale: Expressa tanto o processo indicado pelo perfeito quanto o estado presente resultante, em português natural.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: não têm andado nos seus caminhos
  rationale: Preserva a metáfora ética hebraica de andar nos caminhos de alguém e comunica uma conduta continuada até o presente.
- source_word: שִׂימָה לָּנוּ
  choice: estabeleça para nós
  rationale: No contexto político, comunica a instalação ou designação de um monarca com mais precisão do que o literal “ponha”.
- source_word: מֶלֶךְ
  choice: um rei
  rationale: Equivalente direto do substantivo hebraico para monarca; o artigo indefinido é natural neste pedido.
- source_word: לְשָׁפְטֵנוּ
  choice: que nos julgue
  rationale: Mantém o sentido lexical básico de שׁפט e deixa a nota registrar sua extensão política mais ampla neste contexto.
- source_word: כְּכָל הַגּוֹיִם
  choice: como todas as nações
  rationale: Preserva a comparação de Israel com os povos ao redor, sem importar o sentido étnico-religioso posterior que “gentios” pode sugerir.
theological_decisions:
- issue: O pedido de monarquia é formulado pela comparação política com os povos vizinhos.
  choice: como todas as nações
  alternative: como todos os gentios
  rationale: “Nações” conserva o contraste entre Israel e os demais povos sem introduzir terminologia étnico-religiosa posterior; também não explicita no texto mais do que o hebraico afirma.
- issue: A função solicitada ao rei pode abranger julgamento e governo.
  choice: que nos julgue
  alternative: que nos governe
  rationale: O texto principal conserva o valor básico do verbo hebraico, enquanto a nota reconhece sua abrangência governamental sem resolver indevidamente a amplitude semântica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Veja” evita o arcaísmo de “eis”; “você” oferece tratamento claro sem a possível confusão de “o senhor” com o título divino. A construção conserva a imagem bíblica de andar nos caminhos de alguém.
