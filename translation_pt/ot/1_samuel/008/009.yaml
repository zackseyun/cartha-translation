  text: וְ/עַתָּ֖ה שְׁמַ֣ע בְּ/קוֹלָ֑/ם אַ֗ךְ כִּֽי הָעֵ֤ד תָּעִיד֙ בָּ/הֶ֔ם וְ/הִגַּדְתָּ֣ לָ/הֶ֔ם מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: pt
  text: Agora, escute o que eles dizem; mas advirta-os solenemente e faça-lhes saber a prática do rei que reinará sobre eles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o direito do rei” ou “o modo de agir do rei”. A palavra hebraica também pode significar “juízo”, “direito” ou “prática estabelecida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: escute o que eles dizem
  rationale: A expressão idiomática significa ouvir ou atender alguém. Esta formulação é natural em português e, sem indicar aprovação, comunica que Samuel deve acolher o pedido do povo.
- source_word: אַךְ כִּי
  choice: Mas
  rationale: A combinação introduz uma forte ressalva à ordem anterior; “Mas” expressa com clareza esse contraste em português atual.
- source_word: הָעֵד תָּעִיד
  choice: advirta-os solenemente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação, e o hifil de עוּד tem aqui caráter formal de advertência ou testemunho. “Solenemente” preserva a ênfase e a seriedade jurídica.
- source_word: בָּהֶם
  choice: -os
  rationale: Com עוּד, a preposição assinala as pessoas a quem ou contra quem se dirige a advertência. O objeto direto é a forma mais idiomática em português.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: e explique-lhes
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. “Explique-lhes” se ajusta ao contexto, no qual Samuel deve expor em detalhes a atuação do rei.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: qual será a prática do rei
  rationale: מִשְׁפָּט pode indicar juízo, direito, prerrogativa ou prática costumeira. Como os versículos seguintes descrevem o que o rei fará e exigirá, “prática” mantém o sentido descritivo sem legitimar moralmente tais atos.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: que reinará sobre eles
  rationale: O verbo מלך designa especificamente reinar como rei; a tradução conserva tanto o matiz régio quanto a relação de domínio expressa por עַל.
theological_decisions:
- issue: Se מִשְׁפַּט הַמֶּלֶךְ designa um direito régio legitimado ou a prática/prerrogativa do rei
  choice: “a prática do rei”, em sentido descritivo
  alternative: “o direito do rei” ou “a justiça do rei”
  rationale: O contexto imediato apresenta exigências opressivas do futuro rei. “Prática” preserva a advertência e a ambiguidade lexical sem sugerir que todas essas ações tenham aprovação divina ou validade moral.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção idiomática “escute o que eles dizem” evita o pouco natural “escute a voz deles”; “advirta-os solenemente” conserva a intensidade formal do hebraico.
