  text: He will take your male slaves[a], your female slaves, your best young men, and your donkeys, and use them for his work.
translation:
  language: pt
  text: Ele tomará os escravos e as escravas de vocês[a], os melhores jovens de vocês e os jumentos de vocês, e os usará para o seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os servos e as servas de vocês”. Os termos hebraicos também podem designar servos em sentido mais amplo, mas o contexto de apropriação coercitiva pelo rei favorece “escravos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: os escravos de vocês
  rationale: עֶבֶד pode significar servo ou escravo; neste contexto de apropriação coercitiva pelo rei, “escravos” comunica melhor a condição e preserva o contraste de gênero com שִׁפְחוֹתֵיכֶם.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: as escravas de vocês
  rationale: שִׁפְחָה designa uma serva ou escrava. “Escravas” combina com o contexto de trabalho compulsório e mantém o paralelismo com o termo masculino.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: os melhores jovens
  rationale: בָּחוּר denota normalmente um jovem em pleno vigor, e הַטּוֹבִים o qualifica como pertencente aos melhores; a formulação preserva idade e qualidade sem restringir o substantivo além do que a forma hebraica permite.
- source_word: חֲמוֹרֵיכֶם
  choice: os jumentos de vocês
  rationale: “Jumentos” é uma tradução comum, clara e atual de חֲמוֹרִים.
- source_word: יִקָּח
  choice: tomará
  rationale: O futuro expressa naturalmente a ação prevista na sequência de advertências sobre as práticas do rei.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: e os usará em seus trabalhos
  rationale: A expressão indica que pessoas e animais serão destinados às tarefas do rei. “Usará” exprime de modo natural a apropriação de todos os elementos da lista, enquanto o plural “trabalhos” comunica o âmbito das tarefas reais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A repetição de “de vocês” foi mantida onde ajuda a marcar a perda dos bens e dependentes do povo, sem reproduzir mecanicamente cada sufixo hebraico.
