  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: pt
  text: Ele nomeará para si comandantes de mil e comandantes de cinquenta[a], e outros para lavrar suas terras e colher sua safra[b], e para fabricar suas armas de guerra e o equipamento de seus carros de guerra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de mil e chefes de cinquenta”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “lavrar sua lavoura e colher sua colheita”, construção que ressalta o trabalho feito para o rei.
    reason: lexical_alternative
  - marker: c
    text: Ou “seu equipamento militar e o equipamento de seus carros de guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: Ele nomeará para si
  rationale: O infinitivo com conjunção dá continuidade à descrição do que o rei fará no contexto anterior. Em português, a forma finita explicita naturalmente essa continuidade; “para si” preserva a ideia de serviço em benefício do rei.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: comandantes de mil e comandantes de cinquenta
  rationale: שַׂר designa aqui um chefe ou comandante militar. A formulação conserva os agrupamentos numéricos do hebraico sem recorrer a linguagem arcaica.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: e outros para lavrar suas terras
  rationale: A construção cognata significa literalmente “lavrar sua lavoura”. “Lavrar suas terras” comunica de modo natural o trabalho agrícola realizado para o rei, sem reproduzir uma repetição pouco idiomática.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: e colher sua safra
  rationale: A construção cognata é vertida de forma idiomática. “Safra” representa o produto da colheita pertencente ao rei e se harmoniza com o contexto agrícola.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: e para fabricar suas armas de guerra
  rationale: כְּלֵי pode indicar utensílios, implementos, equipamento ou armas. No contexto bélico, “armas de guerra” preserva com clareza a força marcial da expressão, embora “equipamento militar” também seja possível.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: e o equipamento de seus carros de guerra
  rationale: רֶכֶב pode designar carros ou a força de carros. A tradução mantém a relação genitiva do hebraico e explicita “de guerra” para evitar a leitura moderna de automóveis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Carros de guerra” evita a ambiguidade moderna de “carros”; “comandantes” conserva o caráter militar sem tom arcaizante.
