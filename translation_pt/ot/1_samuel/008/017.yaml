  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his slaves.
translation:
  language: pt
  text: Ele tomará a décima parte dos rebanhos de vocês, e vocês se tornarão escravos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O termo hebraico pode designar pessoas que prestam serviço, mas, neste contexto de cobranças reais e perda de liberdade, “escravos” expressa melhor a sujeição coerciva.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: dos rebanhos de vocês
  rationale: צֹאן designa coletivamente o gado miúdo, sobretudo ovelhas e cabras. “Rebanhos” é natural em português e evita restringir o sentido apenas a ovelhas.
- source_word: יַעְשֹׂר
  choice: tomará a décima parte
  rationale: O verbo indica retirar ou exigir um décimo. No contexto das cobranças impostas pelo rei, esta formulação explicita a exação e evita a possível conotação cultual ou voluntária de “dizimará”.
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: e vocês se tornarão ... dele
  rationale: Embora o hebraico use o verbo simples “ser”, o contexto apresenta essa condição como resultado das exigências reais. “Se tornarão” comunica naturalmente essa progressão sem acrescentar uma ideia estranha ao texto.
- source_word: לַעֲבָדִים
  choice: escravos
  rationale: עֲבָדִים pode significar servos ou escravos. Aqui, a advertência sobre exação real e perda de liberdade favorece “escravos”, que preserva a severidade da sujeição coerciva.
theological_decisions:
- issue: Sentido de עֲבָדִים no contexto da sujeição ao rei
  choice: escravos
  alternative: servos; servos sujeitos ao rei
  rationale: A série de advertências culmina na submissão coerciva do povo ao rei. “Escravos” expressa a gravidade dessa perda de liberdade, enquanto a nota preserva a amplitude lexical do hebraico sem importar categorias teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e evita “dizimará”, cuja associação religiosa poderia obscurecer o caráter de exação real.
