  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: pt
  text: 'Ele disse: “Este será o modo de agir[a] do rei que reinará sobre vocês: ele tomará os filhos de vocês[b] e os designará para servir nos seus carros de guerra e entre os seus cavaleiros; e eles correrão à frente do seu carro[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o direito do rei”. O termo hebraico mishpat pode indicar uma prática habitual, uma reivindicação legal ou uma norma judicial; aqui descreve como o rei agirá para com o povo.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz especificamente “filhos”, isto é, descendentes do sexo masculino, de acordo com o contexto de serviço militar ao rei.
    reason: cultural_note
  - marker: c
    text: 'O hebraico traz “carro” no singular. O termo também pode ser entendido coletivamente: “carros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: modo de agir
  rationale: Neste contexto, מִשְׁפַּט descreve como o rei procederá para com o povo. “Modo de agir” comunica a prática régia sem afirmar inequivocamente que ela seja um direito legítimo.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: o rei que reinará sobre vocês
  rationale: Preserva o sentido régio do verbo מלך e a ideia de autoridade exercida sobre o povo.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: ele tomará os filhos de vocês
  rationale: בְּנֵיכֶם se refere especificamente aos filhos homens, em harmonia com o contexto de recrutamento para o serviço militar do rei.
- source_word: וְשָׂם לוֹ
  choice: e os designará para servir
  rationale: O verbo שׂים indica aqui colocar ou destinar alguém a uma função. A expressão explicita de maneira natural em português a imposição do serviço régio, enquanto “para si” fica compreendido pelo contexto.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: nos seus carros de guerra
  rationale: מֶרְכָּבָה está no singular morfológico, mas pode ter sentido coletivo. O plural idiomático identifica com clareza o corpo de carros de guerra do rei.
- source_word: וּבְפָרָשָׁיו
  choice: entre os seus cavaleiros
  rationale: פָרָשִׁים designa cavaleiros ou a cavalaria. “Entre os seus cavaleiros” preserva a referência às pessoas e se encaixa naturalmente na estrutura portuguesa.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: e eles correrão à frente do seu carro
  rationale: A tradução mantém o singular do hebraico nesta ocorrência e retrata os corredores que precediam o carro real.
theological_decisions:
- issue: Se מִשְׁפַּט afirma um direito legítimo do rei ou descreve sua prática
  choice: modo de agir
  alternative: direito do rei
  rationale: O termo hebraico admite tanto uma dimensão jurídica quanto o sentido de costume ou procedimento. O contexto é uma advertência sobre aquilo que o rei fará; por isso, o texto principal evita legitimar explicitamente essas ações, e a alternativa jurídica é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade ampla, especialmente brasileira. “Carros de guerra” evita que “carros” seja entendido como automóveis. A formulação conserva o tom de advertência e mantém em nota a ambiguidade jurídica de מִשְׁפַּט.
