  source_fidelity: 'A estrutura e os principais sentidos do hebraico são preservados: o rei tomará um décimo dos bens agrícolas do povo e o dará a seus oficiais e servos. Contudo, os possessivos «suas» podem, em português, referir-se ao rei, sujeito da frase, em vez de aos destinatários plurais do discurso hebraico.'
