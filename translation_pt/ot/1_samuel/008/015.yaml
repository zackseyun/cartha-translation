  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: pt
  text: Ele tomará a décima parte das sementes de vocês e dos vinhedos de vocês e a dará aos seus oficiais[a] e aos seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus eunucos”; o termo hebraico סָרִיסָיו pode se referir tanto a eunucos como, em sentido mais amplo, a oficiais da corte real.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: suas sementes
  rationale: זֶרַע significa literalmente “semente” e, neste contexto agrícola, pode abranger aquilo que é semeado ou sua produção. “Sementes” preserva a imagem concreta do hebraico sem substituir o termo por uma interpretação mais ampla.
- source_word: כַרְמֵיכֶם
  choice: suas vinhas
  rationale: כֶּרֶם designa normalmente uma vinha ou vinhedo. “Vinhas” é uma tradução direta e natural em português, e o contexto indica que a décima parte diz respeito à produção agrícola.
- source_word: יַעְשֹׂר
  choice: tomará a décima parte
  rationale: No hifil, עשר indica cobrar, retirar ou destinar um décimo. A formulação explicita a imposição do rei e evita a conotação predominantemente religiosa de “dizimar”.
- source_word: וְנָתַן
  choice: e a dará
  rationale: O perfeito com waw dá sequência à descrição futura iniciada pelo imperfeito. O pronome “a” retoma naturalmente “a décima parte” em português.
- source_word: לְסָרִיסָיו
  choice: aos seus oficiais
  rationale: סָרִיס pode designar um eunuco ou, de modo mais amplo, um oficial da corte. Neste contexto administrativo, “oficiais” comunica a função sem afirmar uma condição física que o texto não torna inequívoca; a alternativa é preservada em nota.
- source_word: וְלַעֲבָדָיו
  choice: aos seus servos
  rationale: עֶבֶד pode significar servo ou escravo conforme o contexto. Aqui designa pessoas a serviço do rei, e “servos” mantém a amplitude do termo sem resolver além da evidência o seu estatuto social.
