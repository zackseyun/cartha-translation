  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: pt
  text: O nome de seu primogênito era Joel, e o nome do seu segundo era Abias; eles eram juízes em Berseba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: O nome ... era
  rationale: A fórmula hebraica introduz o nome por meio de uma construção copulativa; esta formulação é natural em português e preserva a estrutura do original.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: seu primogênito
  rationale: בֵּן especifica a relação filial, enquanto הַבְּכוֹר indica o primeiro filho em ordem de nascimento; em português, “primogênito” já comunica naturalmente que se trata do filho.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: מִשְׁנֵהוּ
  choice: do segundo
  rationale: Indica o segundo em ordem; “filho” fica subentendido pelo paralelismo, como no hebraico.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: שֹׁפְטִים
  choice: eles eram juízes
  rationale: O particípio masculino plural descreve a função contínua exercida pelos dois filhos.
- source_word: בִּבְאֵר שָׁבַע
  choice: em Berseba
  rationale: Emprega a forma tradicional do topônimo em português e traduz naturalmente a preposição locativa.
