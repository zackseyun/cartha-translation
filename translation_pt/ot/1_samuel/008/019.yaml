  text: וַ/יְמָאֲנ֣וּ הָ/עָ֔ם לִ/שְׁמֹ֖עַ בְּ/ק֣וֹל שְׁמוּאֵ֑ל וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י אִם מֶ֖לֶךְ יִֽהְיֶ֥ה עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: pt
  text: 'Mas o povo se recusou a ouvir a voz de Samuel[a] e disse: “Não! Haverá um rei sobre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se recusou a obedecer a Samuel”. A expressão hebraica “ouvir a voz de” pode significar dar ouvidos ou obedecer, não apenas escutar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: se recusou
  rationale: O verbo מאן expressa recusa ou falta de disposição. A forma singular concorda naturalmente em português com o coletivo “o povo” e preserva a resistência ativa do hebraico.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa coletivamente os israelitas que pediam um rei; “o povo” é a forma corrente e natural em português.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: ouvir a voz de
  rationale: A expressão preserva a imagem do idioma hebraico, embora neste contexto também implique dar ouvidos ou obedecer; essa nuance é explicitada em nota.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמְרוּ
  choice: e disse
  rationale: אמר é o verbo comum de fala. Em português, o singular concorda com o substantivo coletivo “o povo” e produz uma narrativa natural.
- source_word: לֹא
  choice: Não!
  rationale: A negação isolada expressa rejeição enfática; o ponto de exclamação comunica sua força no diálogo.
- source_word: כִּי אִם
  choice: antes
  rationale: Após a negação enfática, a locução introduz a alternativa insistida pelo povo. “Antes” exprime o contraste corretivo de modo digno e conciso.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: Teremos um rei sobre nós
  rationale: A formulação conserva a força assertiva do imperfeito hebraico e a expressão relacional “sobre nós”, que indica o governo do rei, em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Conserva-se o idioma hebraico “ouvir a voz de Samuel” no texto, enquanto a nota registra sua possível força de obediência. O coletivo “o povo” rege verbos no singular. A fala enfática evita o pouco natural “Não, mas” e representa כִּי אִם por “antes”.
