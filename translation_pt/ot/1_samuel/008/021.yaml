base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: pt
  text: Samuel ouviu tudo o que o povo disse e o disse aos ouvidos de Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aos ouvidos de Yahweh”, expressão que significa em sua presença ou de modo que ele ouvisse.'
    reason: lexical_alternative
  - marker: b
    text: O nome divino é YHWH, aqui representado por “Yahweh”; tradicionalmente, traduz-se “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O verbo שׁמע, nesta forma narrativa, indica de modo direto que Samuel ouviu o que o povo disse; “ouviu” é natural e não acrescenta a nuance interpretativa de atenção deliberada presente em “escutou atentamente”.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: tudo o que o povo disse
  rationale: A formulação traduz com naturalidade כָּל, “tudo”, e דִּבְרֵי, “palavras/coisas ditas”, preservando a totalidade sem produzir em português a expressão menos idiomática “todas as palavras do povo”.
- source_word: וַיְדַבְּרֵם
  choice: repetiu essas palavras
  rationale: O sufixo pronominal retoma as palavras do povo. “Repetiu essas palavras” torna explícito o referente exigido em português e comunica o ato de dizê-las novamente diante de Yahweh, sem introduzir a nuance administrativa de “relatou”.
- source_word: בְּאָזְנֵי
  choice: aos ouvidos de
  rationale: Conserva a imagem concreta do idioma hebraico, que significa falar na presença ou ao alcance da audição de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título; uma nota registra a forma tradicional portuguesa.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio YHWH. “Yahweh” procura representá-lo diretamente, enquanto “SENHOR” é a substituição tradicional; a alternativa é preservada em nota, sem transformar a escolha em afirmação denominacional.
- issue: Imagem antropomórfica em בְּאָזְנֵי יְהוָה
  choice: aos ouvidos de Yahweh
  alternative: diante de Yahweh / a Yahweh
  rationale: A tradução mantém a metáfora hebraica sem resolver a expressão em linguagem abstrata; a nota esclarece seu valor idiomático.
translation_notes:
  register: 'Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. A ordem das notas acompanha sua relação com o texto: [a] explica o idioma “aos ouvidos de”, e [b] registra a alternativa tradicional para o nome divino.'
