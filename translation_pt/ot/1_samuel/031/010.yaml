source:
  edition: WLC
  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: pt
  text: Puseram as armas de Saul[a] no templo de Astarote[b] e prenderam seu corpo à muralha de Bete-Seã.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a armadura de Saul” ou, de modo mais amplo, “o equipamento de Saul”. O termo hebraico pode abranger diferentes tipos de apetrechos militares.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na casa de Astarote”. O nome hebraico está na forma plural e também pode ser traduzido por “Astarotes”.
    reason: lexical_alternative
  - marker: c
    text: Ou “cravaram seu corpo na muralha de Bete-Seã”. O verbo hebraico pode significar cravar, fincar ou prender, e não especifica com precisão como o corpo foi exposto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Puseram
  rationale: שׂוּם significa pôr, colocar ou depositar; “puseram” é direto e natural no fluxo narrativo.
- source_word: כֵּלָיו
  choice: as armas de Saul
  rationale: כְּלִי pode designar armas, armadura ou equipamento. O contexto militar favorece “armas”; explicitar Saul evita a possível leitura de que se trata das armas dos filisteus.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: no templo de Astarote
  rationale: בֵּית, literalmente “casa”, designa aqui um santuário. עַשְׁתָּרוֹת tem forma plural, mas neste contexto cultual pode funcionar como nome ou título da deusa; “Astarote” segue a forma portuguesa bíblica amplamente reconhecível sem impor uma pluralidade de divindades.
- source_word: גְּוִיָּתוֹ
  choice: seu corpo
  rationale: גְּוִיָּה designa o corpo, neste contexto já sem vida. “Corpo” é claro e menos carregado do que “cadáver”.
- source_word: תָּקְעוּ
  choice: prenderam
  rationale: תָּקַע pode significar cravar, fincar ou fixar. “Prenderam” expressa a afixação do corpo sem especificar indevidamente o método.
- source_word: בְּחוֹמַת
  choice: à muralha
  rationale: Com o verbo de fixação e a preposição בְּ, “à muralha” comunica ligação à estrutura fortificada; “muralha” distingue o muro da cidade de uma parede comum.
- source_word: בֵּית שָׁן
  choice: Bete-Seã
  rationale: Transliteração portuguesa tradicional e inteligível do topônimo hebraico.
theological_decisions:
- issue: Forma plural עַשְׁתָּרוֹת e identidade cultual
  choice: Astarote no texto, com nota sobre a forma plural hebraica
  alternative: Astarotes
  rationale: O verso pode referir-se ao templo da deusa conhecida como Astarote, enquanto a morfologia hebraica admite a tradução plural. A nota preserva a tensão lexical e histórico-religiosa sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “templo” para tornar explícito o sentido cultual de “casa”, conserva as alternativas genuínas em notas e usa “Bete-Seã”, forma portuguesa tradicional do topônimo.
