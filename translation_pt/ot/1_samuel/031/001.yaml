base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: pt
  text: Os filisteus estavam lutando contra Israel, e os homens de Israel fugiram de diante dos filisteus e caíram mortos no monte Gilboa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Os filisteus
  rationale: O ו liga a cena ao contexto anterior, mas não exige que o versículo comece com «E» em português. «Filisteus» é a forma consagrada do nome do povo.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: estavam lutando contra Israel
  rationale: O particípio apresenta a batalha como ação em andamento; «estavam lutando» conserva esse aspecto, e בְּ com o verbo לחם tem sentido adversativo, expresso por «contra».
- source_word: וַ/יָּנֻסוּ
  choice: fugiram
  rationale: No contexto militar, «fugiram» transmite diretamente o sentido de נוּס, sem coloquialismo.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Preserva a referência masculina explícita de אַנְשֵׁי e evita ampliar a expressão para todos os israelitas.
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: diante dos filisteus
  rationale: A expressão significa literalmente «da presença/face dos filisteus». Em português, «fugiram diante dos filisteus» conserva a imagem de retirada perante o inimigo e permanece natural no registro narrativo.
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: caíram mortos
  rationale: A combinação descreve homens que tombaram como mortos em combate. «Caíram mortos» mantém a imagem vívida e concisa do hebraico.
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: no monte Gilboa
  rationale: É a forma portuguesa natural para indicar o local da batalha, preservando o topônimo.
