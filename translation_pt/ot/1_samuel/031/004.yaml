base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: pt
  text: 'Então Saul disse ao seu escudeiro: “Desembainhe sua espada e atravesse-me com ela, para que estes incircuncisos não venham e me atravessem e maltratem[a].” Mas seu escudeiro não quis, pois estava com muito medo. Então Saul pegou a espada e caiu sobre ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abusem de mim”, “zombem de mim” ou “me tratem de modo humilhante”.'
    reason: Alternativas lexicais que refletem a amplitude de וְהִתְעַלְּלוּ בִי sem especificar indevidamente a forma do abuso.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: A expressão designa o assistente militar que carregava as armas de um guerreiro. “Escudeiro” é o equivalente tradicional, conciso e natural em português.
- source_word: שְׁלֹף
  choice: Desembainhe
  rationale: O imperativo manda tirar a espada da bainha; “desembainhe” comunica isso com precisão e se ajusta ao contexto militar.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: atravesse-me com ela / me atravessem
  rationale: דקר indica perfurar com uma arma. A repetição de “atravessar” preserva a repetição deliberada do verbo hebraico e a intenção letal.
- source_word: פֶּן
  choice: para que ... não
  rationale: A construção expressa o desfecho que Saul deseja evitar. Esta formulação é clara e idiomática em português atual.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: estes incircuncisos
  rationale: Preserva a designação depreciativa e ligada à aliança usada literalmente no hebraico, sem substituí-la pela identificação contextual “filisteus”.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: me maltratem
  rationale: O verbo comunica tratamento abusivo e humilhante, mas não especifica sua forma. “Me maltratem” conserva essa amplitude sem acrescentar tortura, escárnio ou violência sexual.
- source_word: וְלֹא אָבָה
  choice: não quis
  rationale: Expressa de maneira direta e natural a falta de disposição ou recusa indicada pelo verbo hebraico.
- source_word: כִּי יָרֵא מְאֹד
  choice: pois estava com muito medo
  rationale: Mantém tanto a relação causal quanto a intensificação de מְאֹד em português corrente.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: caiu sobre ela
  rationale: Segue de perto a expressão hebraica e evita a expansão interpretativa “lançou-se sobre ela”.
theological_decisions:
- issue: Natureza do tratamento temido por Saul
  choice: me maltratem
  alternative: zombem de mim; abusem de mim; me tratem de modo humilhante
  rationale: O texto indica tratamento degradante e abusivo, mas não define sua forma exata. A tradução preserva essa ambiguidade em vez de impor um cenário específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala mantém concisão militar; “incircuncisos” conserva a carga cultural do original, e a repetição de “atravessar” reproduz a repetição hebraica.
