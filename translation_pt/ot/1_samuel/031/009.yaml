base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: pt
  text: Cortaram-lhe a cabeça, despojaram-no de suas armas[a] e enviaram mensageiros[b] por toda a terra dos filisteus para anunciar as boas-novas na casa de seus ídolos[c] e ao povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de sua armadura” ou “de seu equipamento”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz apenas “enviaram”, sem explicitar o que ou quem foi enviado; também pode referir-se aos despojos.
    reason: source_ambiguity
  - marker: c
    text: Isto é, no templo de seus ídolos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: Cortaram-lhe a cabeça
  rationale: Com רֹאשׁוֹ como objeto, כּרת significa cortar ou decepar. A construção portuguesa com pronome dativo é natural e inequívoca.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: despojaram-no de suas armas
  rationale: פשׁט descreve o ato de retirar à força, enquanto כֵּלִים pode designar armas, armadura ou equipamento. No contexto da batalha, “armas” é claro e corrente, sem restringir necessariamente o termo à armadura defensiva.
- source_word: וַיְשַׁלְּחוּ
  choice: enviaram mensageiros
  rationale: O hebraico diz literalmente “enviaram”, sem declarar o objeto. O propósito expresso por “para anunciar” permite entender o envio de mensageiros; a nota preserva a forma e a ambiguidade do original.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: por toda a terra dos filisteus
  rationale: “Por toda” comunica de modo idiomático o alcance distributivo de סָבִיב, isto é, ao redor ou por toda a região filisteia.
- source_word: לְבַשֵּׂר
  choice: para anunciar as boas-novas
  rationale: O piel de בשׂר denota anunciar boas notícias. Aqui são boas do ponto de vista dos filisteus vitoriosos, sem que a tradução aprove moralmente o acontecimento.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: na casa de seus ídolos
  rationale: בֵּית significa literalmente “casa”, mas em contexto cultual pode indicar templo ou santuário; עֲצַבִּים designa ídolos ou imagens cultuais.
- source_word: וְאֶת־הָעָם
  choice: e ao povo
  rationale: O marcador de objeto אֵת apresenta “o povo” como destinatário adicional do anúncio. A combinação “na casa ... e ao povo” conserva a irregularidade sintática e a tensão do hebraico sem forçar os dois complementos a terem a mesma relação.
theological_decisions:
- issue: Designação do local e dos objetos de culto filisteus
  choice: casa de seus ídolos
  alternative: templo de suas imagens
  rationale: “Casa” mantém a expressão concreta do hebraico e “ídolos” transmite o sentido cultual de עֲצַבִּים sem reconhecer essas divindades como reais. A nota registra o sentido contextual “templo”.
- issue: Valor de “boas-novas” na vitória filisteia
  choice: boas-novas
  alternative: notícia
  rationale: A expressão reproduz o valor lexical de בשׂר como notícia favorável do ponto de vista dos anunciantes; não constitui aprovação teológica da morte de Saul.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. “Despojaram-no” mantém a gravidade narrativa; “por toda” evita o pouco idiomático “ao redor” sem perder o alcance de סָבִיב. Todos os marcadores de nota aparecem no texto.
