  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: pt
  text: Os filisteus alcançaram Saul e seus filhos[a], e os filisteus abateram Jônatas, Abinadabe e Malquisua[b], filhos de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alcançaram Saul e seus filhos depois de persegui-los de perto” ou “apertaram a perseguição a Saul e seus filhos”. O verbo hebraico descreve uma perseguição cerrada que chega ao alvo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “feriram Jônatas, Abinadabe e Malquisua”. Neste contexto de batalha, o verbo pode implicar que eles foram mortos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: alcançaram
  rationale: Neste contexto militar, דבק descreve uma perseguição cerrada que chega ao alvo. “Alcançaram” expressa isso com naturalidade, sem recorrer ao sentido literal inadequado de “apegaram-se”.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para esse povo.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: Saul e seus filhos
  rationale: בָּנָיו designa especificamente os filhos homens de Saul, como confirma a enumeração seguinte.
- source_word: וַיַּכּוּ
  choice: mataram
  rationale: Embora נכה tenha o sentido básico de “golpear”, no contexto desta batalha e dos homens nomeados como baixas, o resultado letal é claramente indicado pela narrativa. A nota preserva a formulação mais literal.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲבִינָדָב
  choice: Abinadabe
  rationale: Forma tradicional do nome em português, adaptada à fonologia e à ortografia da língua.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malquisua
  rationale: Transliteração portuguesa clara do nome hebraico composto, coerente com formas bíblicas correntes.
- source_word: בְּנֵי שָׁאוּל
  choice: filhos de Saul
  rationale: Mantém a expressão apositiva hebraica que identifica os três homens mencionados.
