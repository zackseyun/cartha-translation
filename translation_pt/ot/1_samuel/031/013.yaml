  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: pt
  text: Pegaram os ossos deles e os sepultaram debaixo da tamargueira em Jabes[a], e jejuaram por sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Jabes” é a forma abreviada de Jabes-Gileade, mencionada no contexto anterior.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: os ossos deles
  rationale: עֶצֶם significa literalmente “osso”. Como os corpos haviam sido queimados no versículo anterior, a tradução concreta preserva melhor a referência do que “restos mortais”.
- source_word: וַיִּקְבְּרוּ
  choice: e os sepultaram
  rationale: קבר é o verbo comum para sepultar ou enterrar. “Sepultaram” é natural e digno neste contexto funerário.
- source_word: תַחַת
  choice: debaixo de
  rationale: תַחַת indica posição inferior. “Debaixo de” é claro e idiomático em português.
- source_word: הָאֶשֶׁל
  choice: a tamargueira
  rationale: אֶשֶׁל designa especificamente a tamargueira; o termo português identifica a espécie sem generalizá-la como simples árvore.
- source_word: בְּיָבֵשָׁה
  choice: em Jabes
  rationale: É o topônimo Jabes, forma abreviada de Jabes-Gileade no contexto imediato. A preposição “em” expressa naturalmente a localização.
- source_word: וַיָּצֻמוּ
  choice: Depois, jejuaram
  rationale: צום significa “jejuar”. “Depois” comunica a progressão narrativa do wayyiqtol sem exigir a repetição de “e”.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A expressão indica a duração do jejum; “durante” torna essa relação explícita e natural em português.
- source_word: וַיִּקְחוּ
  choice: Pegaram
  rationale: לקח significa “pegar” ou “tomar”. “Pegaram” é corrente e direto no português moderno.
