- source_word: אֵת אֲשֶׁר עָשׂוּ פְלִשְׁתִּים לְשָׁאוּל
  choice: do que os filisteus tinham feito a Saul
  rationale: O mais-que-perfeito composto situa a ação dos filisteus antes da notícia recebida; “feito a Saul” preserva o valor adversativo da preposição לְ no contexto.
