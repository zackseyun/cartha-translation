base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: pt
  text: No dia seguinte, os filisteus vieram para despojar os mortos[a] e encontraram Saul e seus três filhos caídos no monte Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para tirar as roupas e as armas dos mortos”. O verbo hebraico se refere a retirar dos que morreram em combate aquilo que levavam consigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Expressa naturalmente o valor temporal do hebraico, indicando o dia posterior aos acontecimentos narrados.
- source_word: לְפַשֵּׁט
  choice: para despojar
  rationale: Neste contexto de pós-batalha, o verbo se refere a retirar dos mortos roupas, armas e outros objetos; “despojar” preserva essa ação específica sem ampliar o sentido para um saque geral.
- source_word: הַחֲלָלִים
  choice: os mortos
  rationale: Designa os que foram mortos em combate. “Os mortos” é claro e natural em português, enquanto o contexto militar conserva o sentido de baixas de guerra.
- source_word: וַיִּמְצְאוּ
  choice: e encontraram
  rationale: Reproduz de forma direta e fluente a sequência narrativa do hebraico.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: seus três filhos
  rationale: Tradução natural da construção hebraica, mantendo explícita a relação familiar com Saul.
- source_word: נֹפְלִים
  choice: caídos
  rationale: Preserva a imagem hebraica dos que tombaram em batalha, sem substituí-la simplesmente por “mortos”.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: no monte Gilboa
  rationale: Forma geográfica corrente e idiomática em português para o topônimo hebraico.
