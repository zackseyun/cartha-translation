base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: pt
  text: Quando seu escudeiro viu que Saul estava morto[a], também ele se lançou sobre a própria espada e morreu com Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tinha morrido”. O hebraico permite tanto a descrição do estado de Saul como a referência à sua morte já consumada, que motivou a ação do escudeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: A expressão designa literalmente quem carregava as armas ou o equipamento de Saul. “Escudeiro” é o equivalente tradicional, natural e compreensível em português para essa função militar.
- source_word: וַיַּרְא ... כִּי
  choice: Quando ... viu que
  rationale: כִּי introduz o conteúdo percebido, enquanto a oração temporal com “quando” comunica com naturalidade a sequência narrativa marcada por וַיַּרְא.
- source_word: מֵת
  choice: estava morto
  rationale: A forma pode descrever o estado de Saul constatado pelo escudeiro. A tradução preserva esse valor estativo sem excluir a leitura do evento já concluído.
- source_word: גַּם הוּא
  choice: também ele
  rationale: 'Mantém a ênfase aditiva do hebraico: o escudeiro repete contra si a ação de Saul.'
- source_word: עַל חַרְבּוֹ
  choice: sobre a própria espada
  rationale: “Lançar-se sobre a espada” expressa de modo natural o movimento e o meio indicados pelo hebraico. “Própria” esclarece o sufixo possessivo reflexivo sem acrescentar conteúdo.
- source_word: וַיָּמָת עִמּוֹ
  choice: e morreu com Saul
  rationale: עִם indica associação. Repetir o nome evita uma possível ambiguidade pronominal em português e não acrescenta informação ao texto.
