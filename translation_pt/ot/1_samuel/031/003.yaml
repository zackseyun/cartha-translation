  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: pt
  text: A batalha se intensificou contra Saul, e os arqueiros o encontraram[a]. E ele ficou gravemente ferido pelos arqueiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os atiradores, homens com o arco”.'
    reason: previous_rendering
  - marker: b
    text: 'Ou: “ficou profundamente angustiado por causa dos arqueiros”. O verbo hebraico é difícil e pode indicar dor intensa, tremor ou angústia, em vez de declarar explicitamente um ferimento físico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: A batalha se intensificou contra Saul
  rationale: O verbo כבד significa literalmente “tornar-se pesado”, mas, neste contexto militar, descreve o agravamento do combate ou o aumento da pressão sobre Saul. “Intensificou-se contra” comunica naturalmente o valor idiomático sem perder a direção hostil de אֶל.
- source_word: וַיִּמְצָאֻהוּ
  choice: o encontraram
  rationale: Mantém o sentido básico de מצא. No contexto, pode também significar que os arqueiros o alcançaram ou deram com ele, mas “encontraram” preserva a formulação hebraica e continua compreensível.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: os arqueiros
  rationale: A expressão hebraica diz literalmente “os atiradores, homens com o arco”. “Arqueiros” reúne os dois elementos em português natural; a forma mais plena é registrada em nota.
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  choice: ficou gravemente ferido pelos arqueiros
  rationale: A forma verbal é lexicalmente difícil e pode indicar ferimento físico, dor intensa, tremor ou angústia. O contexto imediato do ataque dos arqueiros e o paralelo de 1 Crônicas 10:3 favorecem “gravemente ferido”, sem excluir a alternativa em nota.
theological_decisions:
- issue: Natureza do estado de Saul expresso por וַיָּחֶל
  choice: ferimento físico grave
  alternative: grande angústia, dor ou tremor por causa dos arqueiros
  rationale: A tradução principal acompanha o desenvolvimento narrativo e o paralelo em 1 Crônicas 10:3, mas a nota preserva a ambiguidade real do verbo hebraico, sem transformar uma decisão lexical em afirmação teológica certa.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com sintaxe narrativa fluente. “Arqueiros” evita a redundância pouco natural de “atiradores, homens com o arco”, enquanto a nota conserva a forma mais explícita do hebraico. A ambiguidade decisiva de וַיָּחֶל é mantida em nota.
