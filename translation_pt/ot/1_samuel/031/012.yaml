  text: וַ/יָּק֜וּמוּ כָּל אִ֣ישׁ חַיִל֮ וַ/יֵּלְכ֣וּ כָל הַ/לַּיְלָה֒ וַ/יִּקְח֞וּ אֶת גְּוִיַּ֣ת שָׁא֗וּל וְ/אֵת֙ גְּוִיֹּ֣ת בָּנָ֔י/ו מֵ/חוֹמַ֖ת בֵּ֣ית שָׁ֑ן וַ/יָּבֹ֣אוּ יָבֵ֔שָׁ/ה וַ/יִּשְׂרְפ֥וּ אֹתָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: pt
  text: Então todos os homens valentes se levantaram e viajaram a noite inteira. Retiraram da muralha de Bete-Seã o corpo[a] de Saul e os corpos de seus filhos, foram a Jabes[b] e ali os queimaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cadáver”; no plural, “cadáveres”. O termo hebraico se refere especificamente a corpos sem vida.
    reason: lexical_alternative
  - marker: b
    text: No contexto mais amplo, Jabes é Jabes-Gileade.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: todos os homens valentes
  rationale: A expressão designa homens de coragem e capacidade em contexto militar. A tradução preserva a referência masculina e soa natural em português.
- source_word: וַיָּק֜וּמוּ
  choice: se levantaram
  rationale: Reproduz o sentido básico do verbo e a sequência narrativa sem recorrer a linguagem arcaica.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: caminharam a noite inteira
  rationale: O contexto descreve uma jornada noturna; “caminharam” expressa naturalmente o deslocamento a pé sugerido pela narrativa, e “a noite inteira” preserva a duração.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: o corpo ... os corpos
  rationale: Os termos hebraicos se referem especificamente a corpos sem vida. “Corpo/corpos” é claro e digno no texto principal, enquanto a nota registra a alternativa mais explícita.
- source_word: מֵחוֹמַת
  choice: da muralha
  rationale: Traduz diretamente a preposição e o substantivo; “muralha” deixa claro que se trata da fortificação da cidade.
- source_word: בֵּית שָׁן
  choice: Bete-Seã
  rationale: Adota uma forma portuguesa reconhecível para o topônimo hebraico.
- source_word: יָבֵשָׁה
  choice: a Jabes
  rationale: A terminação direcional indica movimento para Jabes. O texto hebraico traz apenas o nome abreviado, preservado no corpo da tradução.
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: e ali os queimaram
  rationale: Mantém o verbo geral “queimar” e o pronome do hebraico, sem especificar além do texto o modo ou a finalidade da queima.
theological_decisions:
- issue: Forma masculina coletiva para os responsáveis pelo resgate
  choice: todos os homens valentes
  alternative: todos os guerreiros valentes
  rationale: As formas hebraicas são masculinas e, neste contexto militar, apontam para homens aptos e corajosos. A opção escolhida conserva essa especificidade sem acrescentar que todos tivessem uma função militar formal.
- issue: Natureza da queima dos corpos
  choice: ali os queimaram
  alternative: ali os cremaram
  rationale: O hebraico afirma que os queimaram, mas não emprega um termo técnico equivalente a “cremar”. A tradução preserva a formulação ampla e evita resolver questões sobre o rito ou a extensão da queima.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência excessivamente longa sem alterar a progressão narrativa. Os marcadores foram colocados junto aos termos que efetivamente explicam: [a] junto de “corpo” e [b] junto de “Jabes”.'
