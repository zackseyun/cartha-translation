  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: pt
  text: Quando os homens de Israel que estavam do outro lado do vale[a] e os que estavam do outro lado do Jordão[a] viram que os homens de Israel tinham fugido e que Saul e seus filhos estavam mortos, abandonaram as cidades e fugiram. Então os filisteus vieram e se estabeleceram nelas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além do vale” e “além do Jordão”. A expressão hebraica indica o lado oposto ou a região situada além de um ponto de referência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e passaram a morar nelas”. O verbo hebraico pode significar habitar ou estabelecer-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: viram
  rationale: Preserva o sentido concreto de ראה e introduz naturalmente, em português, o conteúdo percebido.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Mantém a formulação masculina explícita do hebraico, adequada ao contexto militar e regional.
- source_word: בְּעֵבֶר הָעֵמֶק / בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do vale / do outro lado do Jordão
  rationale: Reproduz a expressão espacial repetida עֵבֶר sem determinar de modo indevido a perspectiva geográfica exata.
- source_word: כִּי נָסוּ
  choice: que ... tinham fugido
  rationale: O mais-que-perfeito esclarece que a fuga já havia ocorrido quando foi percebida pelos habitantes das outras regiões.
- source_word: מֵתוּ
  choice: estavam mortos
  rationale: Expressa o resultado da morte sem acrescentar aqui uma indicação explícita sobre como morreram.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: abandonaram as cidades
  rationale: עזב indica deixar para trás; 'abandonaram' comunica a retirada urgente e a perda das cidades.
- source_word: וַיָּנֻסוּ
  choice: e fugiram
  rationale: Tradução direta e natural do verbo נוס.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Então os filisteus vieram
  rationale: בוא significa vir ou entrar; 'vieram' preserva a formulação ampla, enquanto 'então' torna clara a sequência narrativa.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: e se estabeleceram nelas
  rationale: No contexto de cidades abandonadas e ocupadas, ישב denota habitar ou estabelecer-se; a escolha comunica a tomada de residência sem exigir permanência definitiva.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A repetição geográfica do hebraico foi preservada, e a nota registra a ambiguidade de perspectiva de עֵבֶר. Corrige-se a aparente inversão dos marcadores nas notas da camada inglesa: a alternativa geográfica acompanha o vale e o Jordão, enquanto a alternativa lexical de habitar acompanha o verbo final.'
