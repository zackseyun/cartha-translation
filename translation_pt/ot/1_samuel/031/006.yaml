translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “morreram” em uma segunda frase evita uma enumeração pesada e deixa explícito, sem alterar o sentido, que todos os mencionados morreram juntos naquele dia.
