  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: pt
  text: Assim, Saul, seus três filhos, seu escudeiro e também todos os seus homens[a][b] morreram juntos naquele dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus soldados”. O hebraico diz literalmente “todos os seus homens”, expressão que, neste contexto de batalha, provavelmente se refere à tropa ou aos seguidores militares de Saul, e não a todas as pessoas ligadas a ele.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos gregos trazem “todas as suas armas” em vez de “todos os seus homens”. O texto hebraico apoia “todos os seus homens”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: Assim, ... morreu
  rationale: A forma narrativa com waw faz o relato avançar e apresenta a morte de Saul como desfecho dos acontecimentos anteriores. “Assim” expressa essa progressão com naturalidade em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: e também seus três filhos
  rationale: Reproduz com clareza o numeral, o substantivo e o sufixo possessivo. “Também” ajuda a representar a inclusão dos demais na afirmação iniciada pelo verbo singular.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: A expressão significa literalmente “o que carregava suas armas ou seu equipamento”. “Escudeiro” é o equivalente militar tradicional, claro e conciso em português.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: e todos os seus homens
  rationale: גַּם inclui o último grupo da enumeração; a coordenação portuguesa transmite adequadamente essa força. “Seus homens” preserva a formulação ampla do hebraico sem restringi-la explicitamente a soldados.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal direto, natural e preciso.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Preserva a ideia de que todos os mencionados morreram no mesmo acontecimento e dia.
