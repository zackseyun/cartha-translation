  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: pt
  text: 'Mas Saul disse: “Ninguém será morto neste dia, pois hoje Yahweh trouxe salvação em Israel.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh realizou livramento em Israel” ou “Yahweh deu vitória a Israel”.'
    reason: Registra alternativas contextualmente válidas para עָשָׂה תְּשׁוּעָה e para a nuance da preposição בְּ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Saul disse
  rationale: O waw consecutivo faz a narrativa avançar, enquanto “mas” expressa naturalmente o contraste com a proposta de execução feita no versículo anterior.
- source_word: לֹא יוּמַת אִישׁ
  choice: Ninguém será morto
  rationale: A forma passiva causativa de מות indica que ninguém deverá ser submetido à morte; esta formulação preserva o tom declarativo e jurídico sem sugerir mera morte natural.
- source_word: בַּיּוֹם הַזֶּה
  choice: neste dia
  rationale: Reproduz a expressão temporal enfática e a distingue do הַיּוֹם seguinte, traduzido por “hoje”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada por Saul para impedir as execuções.
- source_word: הַיּוֹם
  choice: hoje
  rationale: É a equivalência portuguesa direta e natural do advérbio temporal.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: Yahweh trouxe salvação
  rationale: O idiomatismo atribui a Yahweh a realização do resgate. “Trouxe salvação” é natural em português e mantém a amplitude teológica de תְּשׁוּעָה, sem reduzir o sentido à vitória militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Preserva o valor locativo mais direto da preposição בְּ, embora “para Israel” seja possível como sentido beneficiário.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” conserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido de תְּשׁוּעָה no contexto de uma batalha
  choice: salvação
  alternative: livramento; vitória
  rationale: O contexto militar admite “livramento” ou “vitória”, mas “salvação” preserva a amplitude do termo hebraico e a atribuição central da ação a Yahweh.
- issue: Valor de בְּיִשְׂרָאֵל
  choice: em Israel
  alternative: para Israel
  rationale: “Em Israel” mantém o valor locativo formal; “para Israel” explicitaria o beneficiário e, por isso, resolveria uma nuance que o hebraico permite deixar aberta.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Ninguém será morto” mantém o caráter solene da proibição sem recorrer a uma formulação excessivamente arcaica. O marcador [a] aparece no texto principal junto à oração que esclarece.
