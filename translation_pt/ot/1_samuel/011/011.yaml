  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: pt
  text: No dia seguinte, Saul dividiu o povo em três grupos[a]. Durante a vigília da manhã[b], eles entraram no meio do acampamento e atacaram os amonitas até o dia esquentar[c]. Os sobreviventes se dispersaram, de modo que não ficaram sequer dois deles juntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “três cabeças”, expressão que aqui significa três divisões ou companhias.'
    reason: lexical_alternative
  - marker: b
    text: A vigília da manhã era o período de guarda militar nas primeiras horas da manhã, antes ou por volta do amanhecer.
    reason: cultural_note
  - marker: c
    text: Literalmente, “até o calor do dia”; provavelmente, até perto do meio-dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Expressa de modo natural a sequência temporal indicada pelo hebraico, sem recorrer à fórmula arcaica “no dia seguinte aconteceu que”.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: dividiu o povo em três grupos
  rationale: O hebraico diz literalmente “três cabeças”, expressão idiomática para divisões ou companhias. “Grupos” é claro e não especifica uma estrutura militar além do que o texto afirma.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: entraram no meio do acampamento
  rationale: Preserva a ideia de penetração no interior do acampamento inimigo.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: Durante a vigília da manhã
  rationale: Mantém a referência ao período militar de guarda nas primeiras horas da manhã.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: atacaram os amonitas
  rationale: “Amom” representa coletivamente a força amonita. “Atacaram os amonitas” comunica em português corrente a ação militar do verbo נכה sem sugerir que cada integrante do povo tenha sido morto.
- source_word: עַד חֹם הַיּוֹם
  choice: até o dia esquentar
  rationale: Reproduz naturalmente a imagem hebraica do calor crescente do dia, sem convertê-la de forma categórica em “meio-dia”.
- source_word: הַנִּשְׁאָרִים וַיָּפֻצוּ
  choice: Os sobreviventes se dispersaram
  rationale: O contexto militar favorece “sobreviventes”; a forma verbal descreve a dispersão dos que restaram após o ataque.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: não ficaram sequer dois deles juntos
  rationale: Preserva a imagem enfática da desintegração completa da força inimiga; “sequer” torna explícita em português a força da negação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. As fórmulas narrativas hebraicas com וַיְהִי foram vertidas com fluidez, sem fórmulas portuguesas arcaicas. A metáfora temporal do aquecimento do dia e a imagem final de dispersão total foram preservadas.
