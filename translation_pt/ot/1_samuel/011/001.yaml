base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: pt
  text: 'Então Naás, o amonita, subiu e acampou contra Jabes-Gileade. Todos os homens de Jabes disseram a Naás: “Faça uma aliança conosco[a], e nós o serviremos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Corte uma aliança conosco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: avançou
  rationale: No contexto militar, עלה descreve o movimento de Naás contra a cidade. “Avançou” comunica esse movimento naturalmente sem pressupor uma subida topográfica específica.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: Naás, o amonita
  rationale: O nome próprio e o gentílico seguem formas portuguesas tradicionais e imediatamente compreensíveis.
- source_word: וַיִּחַן עַל
  choice: acampou contra
  rationale: חנה com עַל, neste contexto militar, indica estabelecer acampamento contra um adversário; evita acrescentar a ideia mais específica de cerco.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Jabes-Gileade
  rationale: Forma portuguesa reconhecível do topônimo composto, com hífen para preservar sua unidade.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: todos os homens de Jabes
  rationale: Mantém o sentido explícito de אַנְשֵׁי, especialmente pertinente numa negociação cívico-militar.
- source_word: כְּרָת לָנוּ בְרִית
  choice: Faça uma aliança conosco
  rationale: Traduz de modo natural o idioma hebraico literalmente expresso como “cortar uma aliança”, preservando o sentido de בְּרִית.
- source_word: וְנַעַבְדֶךָּ
  choice: e nós o serviremos
  rationale: Representa diretamente עבד com objeto pessoal, sem tornar explícitas noções adicionais como rendição ou escravidão.
