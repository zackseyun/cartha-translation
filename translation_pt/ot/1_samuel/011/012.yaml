  text: וַ/יֹּ֤אמֶר הָ/עָם֙ אֶל שְׁמוּאֵ֔ל מִ֣י הָ/אֹמֵ֔ר שָׁא֖וּל יִמְלֹ֣ךְ עָלֵ֑י/נוּ תְּנ֥וּ הָ/אֲנָשִׁ֖ים וּ/נְמִיתֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: pt
  text: 'Então o povo disse a Samuel: “Quem foi que disse[a]: ‘Saul reinará sobre nós?’ Entreguem esses homens, e nós os mataremos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Saul reinará sobre nós.” O imperfeito hebraico pode ser entendido como pergunta de sentido futuro ou, menos provavelmente neste contexto, como uma declaração.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente coletivo padrão para עָם neste contexto, referindo-se aos israelitas presentes.
- source_word: אֶל שְׁמוּאֵל
  choice: a Samuel
  rationale: אֶל indica o destinatário da fala; “Samuel” é a forma tradicional e amplamente reconhecida em português.
- source_word: מִי הָאֹמֵר
  choice: Quem foi que disse
  rationale: O interrogativo seguido do particípio substantivado identifica “aquele que disse”. Esta construção é natural em português e remete à oposição anteriormente expressa.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: ‘Saul reinará sobre nós?’
  rationale: O imperfeito pode ter valor futuro numa pergunta que recorda a contestação anterior. “Reinará sobre nós” mantém a nuance régia de מלך e a ambiguidade entre indagação e desafio.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: Entreguem esses homens
  rationale: O imperativo pede que os opositores sejam postos à disposição do povo; o demonstrativo explicita de modo natural a referência definida pelo contexto.
- source_word: וּנְמִיתֵם
  choice: e nós os mataremos
  rationale: O hifil de מות significa causar a morte. “Nós os mataremos” comunica diretamente a ameaça, sem acrescentar uma formalidade judicial que o hebraico não explicita.
theological_decisions:
- issue: Valor modal de יִמְלֹךְ na citação
  choice: 'pergunta futura: “Saul reinará sobre nós?”'
  alternative: 'afirmação: “Saul reinará sobre nós”'
  rationale: O contexto de 1 Samuel 10:27 favorece uma pergunta desdenhosa que recorda a resistência ao reinado de Saul, mas a forma hebraica isolada também permite leitura declarativa; a tradução preserva a leitura contextual sem impor uma interpretação doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A formulação direta preserva o tom exaltado da exigência popular e evita linguagem excessivamente jurídica.
