base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: pt
  text: 'E eis que Saul vinha do campo, atrás do gado. Então Saul perguntou: “O que há com o povo, que está chorando?” E lhe contaram as palavras dos homens de Jabes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém o marcador discursivo e a vivacidade da mudança de cena; embora elevado, é claro e tradicionalmente inteligível em português.
- source_word: בָּא
  choice: vinha
  rationale: O particípio hebraico apresenta a ação em curso como circunstância de fundo; o imperfeito português reproduz esse valor naturalmente.
- source_word: אַחֲרֵי הַבָּקָר
  choice: atrás do gado
  rationale: Preserva o sentido espacial de אַחֲרֵי e a amplitude de בָּקָר, que designa bovinos coletivamente, sem restringi-los necessariamente a bois de trabalho.
- source_word: מִן הַשָּׂדֶה
  choice: do campo
  rationale: Expressa de maneira direta o ponto de origem indicado pela preposição hebraica.
- source_word: מַה לָעָם
  choice: O que aconteceu com o povo
  rationale: Equivalente idiomático atual para a pergunta hebraica sobre o motivo do estado ou comportamento do povo.
- source_word: כִּי יִבְכּוּ
  choice: para estarem chorando
  rationale: Liga naturalmente a pergunta à circunstância observada e conserva o aspecto contínuo do choro.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: E lhe contaram
  rationale: Verbo narrativo simples e natural que mantém explicitamente o destinatário.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: as palavras dos homens de Jabes
  rationale: Tradução formal de דִּבְרֵי e אַנְשֵׁי, preservando a referência provável aos homens ou representantes masculinos de Jabes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “E eis que” conserva a vivacidade narrativa do hebraico; “Jabes” segue a forma portuguesa tradicional do topônimo. Não foram necessárias notas, pois as alternativas lexicais não afetam de modo relevante a compreensão do versículo.
