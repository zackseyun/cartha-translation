  source_fidelity: 'O sentido central está correto: trata-se de mensageiros humanos, da localidade de Gibeá de Saul, da comunicação pública da mensagem e do choro coletivo. Contudo, “para que o povo ouvisse” introduz uma formulação final que não está explicitamente no hebraico; a expressão indica que falaram a mensagem ao alcance/aos ouvidos do povo. A repetição explícita de “todo o povo” reproduz melhor o sujeito de וַיִּשְׂאוּ ... וַיִּבְכּוּ.'
