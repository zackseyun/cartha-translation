translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação evita o decalque “aos ouvidos do povo”, mas conserva a dimensão pública e auditiva da mensagem; a nota registra o singular coletivo do idioma hebraico.
