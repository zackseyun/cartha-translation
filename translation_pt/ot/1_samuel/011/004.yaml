  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: pt
  text: Quando os mensageiros chegaram a Gibeá de Saul e disseram essas palavras ao povo, todo o povo levantou a voz[a] e chorou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ergueu suas vozes”. Em hebraico, literalmente: “levantaram a sua voz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: No contexto, são enviados humanos de Jabes; “mensageiros” comunica o sentido comum de מַלְאָךְ sem sugerir seres angelicais.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibeá de Saul
  rationale: Mantém a forma construta hebraica que associa a cidade a Saul e corresponde ao nome geográfico tradicional em português.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: disseram essas palavras
  rationale: Preserva a concretude de דְּבָרִים e retoma naturalmente, por meio de “essas”, a mensagem mencionada no contexto anterior.
- source_word: בְּאָזְנֵי הָעָם
  choice: para que o povo ouvisse
  rationale: Expressa em português corrente o idioma hebraico “aos ouvidos do povo”, conservando sua nuance auditiva sem recorrer a um decalque pouco natural.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: todos levantaram a voz
  rationale: “Levantar a voz” é um idioma natural em português e reproduz a imagem hebraica; o singular coletivo “a voz” acompanha קוֹל, embora o sufixo possessivo se refira ao povo.
- source_word: וַיִּבְכּוּ
  choice: e choraram
  rationale: O verbo בכה indica choro de tristeza ou lamentação; “choraram” é claro, atual e adequado ao contexto.
- source_word: כָל הָעָם
  choice: todos
  rationale: Depois de “o povo”, o pronome evita repetição pesada e transmite de modo natural a abrangência de כָל הָעָם.
