  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: pt
  text: 'Então Samuel disse ao povo: “Venham, vamos a Gilgal e renovemos ali o reinado[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confirmemos o reinado”, “renovemos o reino” ou “renovemos a monarquia”.
    reason: O verbo חדש no piel pode ter a nuance contextual de renovar ou confirmar, e מְלוּכָה pode referir-se ao reinado, ao reino ou à instituição monárquica.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל הָעָם
  choice: ao povo
  rationale: עָם designa aqui o povo reunido de Israel; “povo” é a opção mais direta e contextual.
- source_word: לְכוּ וְנֵלְכָה
  choice: Venham, vamos
  rationale: A combinação do imperativo com o coortativo convida o grupo a uma ação conjunta. Esta formulação é natural em português e preserva tanto o chamado quanto a proposta inclusiva.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Transliteração tradicional do topônimo em português, sem reproduzir o artigo hebraico.
- source_word: וּנְחַדֵּשׁ
  choice: renovemos
  rationale: O piel de חדש significa tornar novo ou renovar. O contexto sugere uma reafirmação pública após a vitória de Saul, mas “renovemos” preserva a formulação e a amplitude semântica do hebraico.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que retoma Gilgal; “ali” é idiomático neste contexto.
- source_word: הַמְּלוּכָה
  choice: o reinado
  rationale: מְלוּכָה pode indicar o governo, a dignidade real ou a instituição monárquica. “Reinado” é corrente e mantém o foco no exercício da realeza de Saul, embora “reino” e “monarquia” também sejam possíveis conforme a nuance.
theological_decisions:
- issue: Sentido de renovar הַמְּלוּכָה
  choice: renovar o reinado, preservando a ideia de reafirmação da autoridade real de Saul
  alternative: confirmar o reinado; renovar o reino; renovar a monarquia
  rationale: Após a libertação de Jabes-Gileade, o povo demonstra apoio renovado a Saul. A tradução evita especificar um segundo rito de coroação ou reduzir o termo ao território nacional, mantendo a tensão entre confirmação do rei e renovação da instituição monárquica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Venham, vamos” reproduz naturalmente a fórmula hebraica de convite coletivo. A nota conserva as alternativas lexicais e a ambiguidade contextual sem impor uma interpretação ritual ou denominacional.
