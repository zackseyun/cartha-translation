base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: pt
  text: 'Eles disseram aos mensageiros que vinham chegando: “Digam o seguinte aos homens de Jabes-Gileade[a]: ‘Amanhã, no calor do sol[b], haverá livramento para vocês.’” Então os mensageiros chegaram e transmitiram a mensagem aos homens de Jabes, e eles se alegraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ao homem de Jabes-Gileade”; o singular provavelmente é coletivo e se refere aos habitantes da cidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando o sol estiver quente”, isto é, por volta da parte mais quente do dia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: mensageiros
  rationale: No contexto, refere-se a portadores humanos de uma mensagem, não a seres celestiais.
- source_word: הַבָּאִים
  choice: que vinham chegando
  rationale: Preserva o valor participial e apresenta os mensageiros como aqueles que estavam chegando, sem transformar explicitamente a ação em anterior.
- source_word: כֹּה תֹאמְרוּן
  choice: Digam o seguinte
  rationale: Expressa em português moderno e natural a fórmula hebraica que introduz o discurso direto.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: aos homens de Jabes-Gileade
  rationale: O singular hebraico parece ter sentido coletivo, como confirma a referência plural posterior aos habitantes da cidade.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: haverá livramento para vocês
  rationale: Mantém a construção existencial do hebraico e comunica resgate concreto diante de uma ameaça militar, sem restringir o sentido a vitória em combate.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: no calor do sol
  rationale: Conserva a imagem e a expressão temporal do hebraico; a nota esclarece a provável referência à parte quente do dia.
- source_word: וַיַּגִּידוּ
  choice: deram a notícia
  rationale: É uma formulação portuguesa natural para a comunicação da promessa recebida.
- source_word: לְאַנְשֵׁי יָבֵישׁ
  choice: aos homens de Jabes
  rationale: Reflete de perto a expressão hebraica, que pode designar os homens ou, por extensão, os habitantes da cidade.
- source_word: וַיִּשְׂמָחוּ
  choice: eles se alegraram
  rationale: Preserva de modo claro e digno a reação de alegria narrada pelo verbo hebraico.
