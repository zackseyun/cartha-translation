base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: pt
  text: 'Os anciãos de Jabes lhe disseram: “Deixe-nos em paz por sete dias, e enviaremos mensageiros por todo o território de Israel. Se não houver ninguém que nos salve, sairemos ao seu encontro.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: Deixe-nos em paz
  rationale: Reproduz de modo natural o pedido para que Naás suspenda sua ação contra eles, sem acrescentar a ideia de uma trégua formal.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: por todo o território de Israel
  rationale: Aqui גְּבוּל designa a extensão territorial de Israel, e não apenas sua fronteira.
- source_word: מוֹשִׁיעַ
  choice: ninguém que nos salve
  rationale: Mantém o sentido amplo de alguém que venha libertá-los ou socorrê-los.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: sairemos e nos entregaremos a você
  rationale: A expressão literal 'sairemos a você' indica, no contexto de cerco, sair da cidade para render-se; a explicitação evita obscuridade em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com discurso direto natural. 'Jabes' segue a forma bíblica corrente em português. A coordenação hebraica foi vertida com finalidade ('para que') na primeira oração e condição direta na segunda, preservando a progressão do pedido.
