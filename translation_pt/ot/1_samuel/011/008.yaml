  text: וַֽ/יִּפְקְדֵ֖/ם בְּ/בָ֑זֶק וַ/יִּהְי֤וּ בְנֵֽי יִשְׂרָאֵל֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וְ/אִ֥ישׁ יְהוּדָ֖ה שְׁלֹשִׁ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: pt
  text: Ele passou-lhes revista em Bezeque. Os filhos de Israel[a] eram trezentos mil, e os homens de Judá, trinta mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: Ele passou-lhes revista
  rationale: Em contexto militar, פקד indica reunir, registrar ou contar as tropas. “Passou-lhes revista” comunica de modo natural a realização de um recenseamento militar, e os totais seguintes confirmam esse sentido.
- source_word: בְּבָזֶק
  choice: em Bezeque
  rationale: O nome do lugar é transliterado segundo a forma tradicional em português; a preposição בְּ indica aqui o local onde a revista ocorreu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: A expressão familiar hebraica é preservada, mantendo também o contraste literário entre Israel e Judá. Uma formulação coletiva mais idiomática é registrada em nota.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: trezentos mil
  rationale: Tradução direta da expressão numérica hebraica.
- source_word: וְאִישׁ יְהוּדָה
  choice: os homens de Judá
  rationale: Embora אִישׁ esteja no singular, seu uso é coletivo e designa os homens pertencentes a Judá.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: trinta mil
  rationale: Tradução direta da expressão numérica hebraica.
theological_decisions:
- issue: Forma da designação coletiva בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: Não há questão doutrinária em jogo. A escolha conserva a forma masculina representativa e a linguagem de parentesco do hebraico, sem impedir que a nota apresente a alternativa idiomática.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário compreensível em âmbito internacional. “Passou-lhes revista” preserva o contexto militar sem reduzir o verbo a uma contagem abstrata.
