source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: pt
  text: Então todo o povo foi a Gilgal, e ali constituíram Saul rei diante de Yahweh, em Gilgal. Ali ofereceram sacrifícios de comunhão[a] diante de Yahweh, e ali Saul e todos os homens de Israel se alegraram muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “ofertas pacíficas” ou “ofertas de bem-estar”. O termo hebraico designa uma categoria de sacrifícios comunitários associada à paz, à integridade e à celebração compartilhada.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foi
  rationale: Na sequência narrativa, הלך expressa movimento de modo comum; em concordância com o sujeito coletivo singular em português, “todo o povo foi” é natural.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: עָם designa aqui o povo reunido como coletividade, não apenas as tropas.
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: Gilgal / em Gilgal
  rationale: O nome próprio do lugar é transliterado; a repetição presente no hebraico é preservada.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: fizeram Saul rei
  rationale: O hifil de מלך significa fazer alguém reinar ou torná-lo rei. A formulação mantém esse valor causativo sem acrescentar uma unção, que não é mencionada no texto.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica presença, aqui em contexto público e cultual; “diante de” preserva de modo conciso essa relação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é representado pela transliteração do nome divino, em vez de ser substituído por um título.
- source_word: וַיִּזְבְּחוּ זְבָחִים שְׁלָמִים
  choice: ofereceram sacrifícios de comunhão
  rationale: O verbo é sacrificial, e a expressão שְׁלָמִים designa uma categoria de sacrifícios ligada à paz, integridade e refeição celebrativa compartilhada. “Ofereceram” evita a repetição pouco natural “sacrificaram sacrifícios”.
- source_word: וַיִּשְׂמַח
  choice: se alegraram
  rationale: Embora a forma verbal hebraica seja singular, ela precede o sujeito composto Saul e todos os homens de Israel; o plural é a concordância natural em português.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: e todos os homens de Israel
  rationale: אַנְשֵׁי significa especificamente “homens de”; a tradução conserva a expressão masculina do hebraico.
- source_word: עַד מְאֹד
  choice: muito
  rationale: A expressão intensifica a alegria; “muito” é corrente e reproduz sua força sem artificialidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o caráter de nome pessoal e evita substituí-lo por um título.
- issue: Expressão masculina אַנְשֵׁי יִשְׂרָאֵל
  choice: todos os homens de Israel
  alternative: todos os israelitas; todo o povo de Israel
  rationale: A expressão hebraica é lexicalmente masculina. Mantê-la evita neutralizar um dado explícito do texto, sem decidir além dele quem mais poderia estar incluído na celebração.
- issue: Natureza dos זְבָחִים שְׁלָמִים
  choice: sacrifícios de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo pode destacar paz, integridade, bem-estar e participação comunitária. A tradução principal comunica a dimensão compartilhada, enquanto a nota conserva alternativas legítimas sem restringir o sentido a uma única nuance.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Preservam-se a repetição de “Gilgal” e de “ali”, características da progressão narrativa hebraica. O marcador [a] foi colocado junto à expressão sacrificial a que a nota efetivamente se refere.
