base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: pt
  text: Então o Espírito de Deus veio com poder sobre Saul quando ele ouviu essas palavras, e sua ira ardeu intensamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: veio com poder
  rationale: No contexto do Espírito agindo sobre uma pessoa, o verbo צלח indica uma vinda poderosa e capacitadora. A formulação é natural em português e evita a possível conotação negativa de “irrompeu” ou “se apoderou”.
- source_word: רוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  rationale: A expressão construta designa naturalmente o Espírito divino e preserva o peso teológico da capacitação de Saul.
- source_word: עַל
  choice: sobre
  rationale: “Sobre” corresponde à preposição hebraica e combina naturalmente com a expressão portuguesa “veio com poder sobre Saul”.
- source_word: בְּשָׁמְעוֹ
  choice: quando ele ouviu
  rationale: A preposição ב com infinitivo construto e sufixo tem sentido temporal, expresso de modo claro e corrente.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: aquelas palavras
  rationale: דברים pode significar palavras, coisas ou assuntos; neste contexto de uma mensagem relatada, “palavras” preserva bem o sentido discursivo. “Aquelas” soa mais natural em português como referência ao relato já mencionado.
- source_word: וַיִּחַר אַפּוֹ
  choice: sua ira ardeu
  rationale: Preserva a metáfora hebraica da ira ardente sem reproduzir literalmente o idiomatismo anatômico “seu nariz ardeu”, que seria obscuro em português.
- source_word: מְאֹד
  choice: intensamente
  rationale: Transmite a forte intensificação do hebraico e forma uma colocação natural com “sua ira ardeu”.
theological_decisions:
- issue: Natureza de רוּחַ אֱלֹהִים na narrativa
  choice: “o Espírito de Deus”, entendido como o Espírito divino vindo poderosamente sobre Saul
  alternative: “um espírito vindo de Deus”
  rationale: O contexto de capacitação para liderança e libertação favorece a referência ao próprio Espírito de Deus. A tradução não especifica além do que o texto afirma nem elimina a tensão posterior da narrativa sobre Saul.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a metáfora da ira ardente e expressa a força de צלח de maneira natural, sem exigir nota lexical.
