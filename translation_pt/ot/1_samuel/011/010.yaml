  text: וַֽ/יֹּאמְרוּ֙ אַנְשֵׁ֣י יָבֵ֔ישׁ מָחָ֖ר נֵצֵ֣א אֲלֵי/כֶ֑ם וַ/עֲשִׂיתֶ֣ם לָּ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: pt
  text: 'Então os homens de Jabes disseram: “Amanhã sairemos até vocês[a], e poderão fazer conosco tudo o que parecer bom aos seus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sairmos até vocês”. O hebraico não diz explicitamente “nós nos renderemos”, embora o contexto implique submissão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar e, no contexto, também introduz a resposta decorrente da situação; “Então” expressa naturalmente essa sequência.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: os homens de Jabes
  rationale: אַנְשֵׁי significa especificamente “homens de”, e o versículo traz a forma abreviada do topônimo, יָבֵישׁ, sem acrescentar “Gileade”.
- source_word: מָחָר
  choice: Amanhã
  rationale: O advérbio temporal indica diretamente o dia seguinte.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: sairemos até vocês
  rationale: יצא significa “sair”. A formulação conserva o movimento expresso no hebraico e evita explicitar “render-nos”, ideia sugerida pelo contexto, mas não lexicalizada.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: e poderão fazer conosco
  rationale: Neste discurso, a forma verbal apresenta o que os destinatários ficarão livres para fazer após a saída; “poderão” comunica essa permissão implícita sem convertê-la em ordem.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: tudo o que parecer bom aos seus olhos
  rationale: A tradução mantém a imagem idiomática hebraica dos “olhos” e comunica que se trata do que parecer bom ou conveniente aos destinatários.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o idioma “bom aos seus olhos” e a ambiguidade de נֵצֵא, sem inserir explicitamente a ideia de rendição.
