  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: pt
  text: 'Naás, o amonita, lhes disse: “Farei uma aliança com vocês sob esta condição: arrancarei o olho direito de cada um de vocês e assim trarei desonra sobre todo o Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶכְרֹת לָכֶם
  choice: farei uma aliança com vocês
  rationale: A expressão idiomática hebraica literalmente significa ‘cortarei para vocês’; em contexto, refere-se a firmar uma aliança ou acordo.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: arrancarei o olho direito de cada um de vocês
  rationale: O verbo נקר indica furar ou arrancar um olho. A formulação preserva a violência concreta da ameaça, e ‘de cada um’ comunica naturalmente a distribuição expressa pelo hebraico.
- source_word: חֶרְפָּה
  choice: desonra
  rationale: O termo denota vergonha, afronta ou opróbrio público; ‘desonra’ é claro, digno e adequado à dimensão coletiva da ameaça.
- source_word: וְשַׂמְתִּיהָ ... עַל
  choice: e assim trarei ... sobre
  rationale: Reproduz de modo natural a ideia hebraica de impor ou colocar essa desonra sobre todo Israel, sem eliminar a ligação entre a mutilação e a afronta nacional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A sintaxe mantém as duas ações coordenadas da ameaça de Naás, sem acrescentar interpretação doutrinária.
