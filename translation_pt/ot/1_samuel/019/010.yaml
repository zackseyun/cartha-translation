base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: pt
  text: Saul tentou cravar Davi na parede com a lança, mas Davi se esquivou de Saul, e Saul cravou a lança na parede. Então Davi fugiu e escapou naquela noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: cravar Davi na parede com a lança
  rationale: A construção combina a intenção de atingir Davi com a parede; em português, esta formulação comunica naturalmente a tentativa de atravessá-lo e prendê-lo à parede, sem perder a violência concreta da cena.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: Davi se esquivou da presença de Saul
  rationale: O verbo indica que Davi se soltou ou escapou diante de Saul. “Se esquivou” expressa o movimento evasivo imediato, enquanto “da presença de Saul” preserva o elemento explícito מִפְּנֵי.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: a lança ficou fincada na parede
  rationale: Embora a forma hebraica diga literalmente que ele atingiu a lança na parede, o sujeito muda de modo abrupto e o sentido contextual é que Saul lançou a arma, que atingiu e se cravou na parede. A formulação portuguesa evita a impressão equivocada de que Saul golpeou a própria lança.
- source_word: נָס וַיִּמָּלֵט
  choice: fugiu e escapou
  rationale: Mantém os dois verbos coordenados do hebraico, distinguindo a fuga do êxito em escapar.
