base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: pt
  text: 'Então Saul disse a Mical: “Por que você me enganou desse jeito e mandou o meu inimigo embora, de modo que ele escapou?” Mical respondeu a Saul: “Ele me disse: ‘Mande-me embora. Por que eu deveria matar você?’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “Deixe-me ir, senão eu mato você.” O hebraico diz literalmente: “Mande-me embora. Por que eu deveria matar você?”'
    reason: Leitura alternativa que explicita a ameaça implícita sem inseri-la no texto principal.
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: me enganou
  rationale: O verbo רמה denota engano. “Enganou” é claro e atual, sem acrescentar a ideia mais forte de traição.
- source_word: כָּכָה
  choice: desse jeito
  rationale: Expressa a maneira da ação em português natural e preserva a ênfase da pergunta de Saul.
- source_word: וַתְּשַׁלְּחִי
  choice: mandou o meu inimigo embora
  rationale: שלח significa enviar ou mandar embora. A formulação preserva a força do verbo e descreve a ação pela qual Mical possibilitou a fuga de Davi.
- source_word: אֹיְבִי
  choice: o meu inimigo
  rationale: Mantém a designação hostil usada pelo próprio Saul para se referir a Davi.
- source_word: וַיִּמָּלֵט
  choice: de modo que ele escapou
  rationale: O nifal de מלט significa escapar. A expressão explicita de maneira idiomática a relação de resultado presente no contexto.
- source_word: שַׁלְּחִנִי
  choice: Mande-me embora
  rationale: Mantém o sentido direto do imperativo de שלח e a correspondência lexical com o verbo usado anteriormente no versículo.
- source_word: לָמָה אֲמִיתֵךְ
  choice: Por que eu deveria matar você?
  rationale: Reproduz a pergunta hebraica sem inserir a expressão interpretativa “senão”. O pronome “você” corresponde ao sufixo feminino singular dirigido a Mical.
- source_word: מִיכַל
  choice: Mical
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Discurso atribuído a Davi na resposta de Mical
  choice: 'Preservar as duas orações: “Mande-me embora. Por que eu deveria matar você?”'
  alternative: “Deixe-me ir, senão eu mato você.”
  rationale: O hebraico traz um imperativo seguido de uma pergunta com לָמָה, sem uma expressão equivalente a “senão”. A tradução mantém a formulação e a tensão do texto, enquanto a nota apresenta a ameaça provavelmente implícita.
translation_notes:
  register: Português contemporâneo, digno e de leitura ampla, com boa legibilidade brasileira. O tratamento por “você” torna a fala direta natural e permite indicar com clareza que a ameaça relatada se dirige a Mical. A repetição de “mandar embora” preserva a recorrência de שלח.
