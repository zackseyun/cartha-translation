  text: וַ/יִּשְׁמַ֥ע שָׁא֖וּל בְּ/ק֣וֹל יְהוֹנָתָ֑ן וַ/יִּשָּׁבַ֣ע שָׁא֔וּל חַי יְהוָ֖ה אִם יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: pt
  text: 'Saul deu ouvidos a Jônatas e jurou: “Tão certo como Yahweh vive, ele não será morto[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A fórmula hebraica do juramento diz: “Tão certo como Yahweh vive, se ele for morto...”. Nesse tipo de juramento, a partícula “se” introduz uma imprecação deixada implícita e expressa forte negação: “ele certamente não será morto”.'
    reason: Explicar a fórmula elíptica do juramento hebraico e preservar sua particularidade.
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: deu ouvidos a Jônatas
  rationale: A construção שׁמע בקול indica não apenas ouvir, mas atender ao que alguém diz. A expressão portuguesa comunica de modo natural que Saul acolheu o apelo de Jônatas.
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: Expressa de maneira concisa e corrente o ato solene de prestar juramento.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Preserva a fórmula hebraica de juramento e sua força solene em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אִם יוּמָת
  choice: ele não será morto
  rationale: Na fórmula elíptica de juramento, אִם transmite forte negação; o hofal de מות é passivo-causativo e significa ser morto ou executado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino; a transliteração o preserva sem trocá-lo por um título.
- issue: Força da fórmula elíptica אִם יוּמָת
  choice: ele não será morto
  alternative: se ele for morto
  rationale: Em juramentos hebraicos, a oração introduzida por אִם pode omitir a consequência da imprecação e funcionar como negação enfática. A tradução comunica o sentido contextual sem apagar a forma incomum, explicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Deu ouvidos” conserva o sentido responsivo do idioma hebraico sem soar excessivamente técnico; “será morto” mantém a voz passiva do original.
