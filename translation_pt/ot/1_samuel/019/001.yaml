translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A divisão em duas frases evita ambiguidade sintática e destaca o contraste narrativo. “Tinha grande afeição” soa natural em português contemporâneo e preserva a intensidade de מְאֹד sem importar uma terminologia teológica específica.
