  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: pt
  text: Saul falou a seu filho Jônatas e a todos os seus servos para pôr Davi à morte[a]. Jônatas, porém, filho de Saul, tinha grande afeição por Davi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para matar Davi”. O verbo hebraico está na forma causativa, com o sentido de “pôr à morte”; o infinitivo pode expressar a finalidade ou o conteúdo da fala de Saul.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se agradava muito de Davi” ou “gostava muito de Davi”. O hebraico expressa que Jônatas tinha grande agrado ou deleite em Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, nesta forma narrativa, é naturalmente traduzido por “falou”; evita especificar além do texto se Saul deu uma ordem direta.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Em contexto régio, o termo pode designar servos, oficiais ou cortesãos. “Servos” preserva de modo transparente o vocábulo hebraico e continua natural em português.
- source_word: לְהָמִית אֶת דָּוִד
  choice: sobre matar Davi
  rationale: O infinitivo com ל pode indicar o assunto ou propósito da fala. “Sobre matar Davi” expressa naturalmente seu conteúdo sem impor que a frase seja uma ordem explícita; a nota registra a nuance causativa do verbo.
- source_word: וִיהוֹנָתָן
  choice: Jônatas, porém
  rationale: O waw introduz contraste entre a intenção de Saul e a disposição de Jônatas para com Davi; “porém” explicita essa função discursiva.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: tinha grande afeição por Davi
  rationale: חפץ aqui comunica agrado, estima ou prazer em alguém. A formulação expressa forte afeição de maneira natural, sem equiparar automaticamente o verbo a אהב, “amar”.
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: seu filho / filho de Saul
  rationale: As duas expressões de filiação são mantidas, acompanhando a repetição deliberada do hebraico e preservando a clareza narrativa.
