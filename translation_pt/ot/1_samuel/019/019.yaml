  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: pt
  text: 'E foi comunicado a Saul: “Veja, Davi está em Naiote, em Ramá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: foi comunicado
  rationale: Preserva a forma passiva e não especifica quem levou a informação, em português natural.
- source_word: לְשָׁאוּל
  choice: a Saul
  rationale: Expressa o objeto indireto e mantém a forma tradicional do nome próprio em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem com naturalidade o conteúdo da comunicação; traduzir literalmente por “dizendo” seria menos idiomático neste contexto.
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a função de chamar a atenção para o fato comunicado, sem recorrer ao mais arcaico “Eis”.
- source_word: דָוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּנוָיֹת
  choice: em Naiote
  rationale: Translitera o topônimo e traduz בְּ com seu sentido locativo normal.
- source_word: בָּרָמָה
  choice: em Ramá
  rationale: Identifica Ramá como a localidade mais ampla; a repetição de “em” conserva claramente a relação locativa.
