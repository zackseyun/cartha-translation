lexical_decisions:
- source_word: וַתֹּרֶד
  choice: fez Davi descer
  rationale: 'O hifil de ירד expressa ação causativa: Mical ajudou ou fez Davi descer. A formulação é natural em português e não acrescenta o meio pelo qual isso ocorreu.'
- source_word: בְּעַד הַחַלּוֹן
  choice: pela janela
  rationale: בְּעַד, neste contexto espacial, indica passagem através da abertura da janela.
- source_word: וַיֵּלֶךְ וַיִּבְרַח וַיִּמָּלֵט
  choice: Ele foi embora, fugiu e escapou
  rationale: Preserva a sequência de três verbos coordenados do hebraico, inclusive sua progressão narrativa e sua aparente redundância enfática.
