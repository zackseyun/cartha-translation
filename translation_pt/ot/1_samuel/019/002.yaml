base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: pt
  text: 'Jônatas contou a Davi: “Saul, meu pai, está procurando matar você. Agora, pela manhã, tenha cuidado, por favor. Fique num lugar escondido[a] e esconda-se.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “permaneça em segredo” ou “fique escondido”. O hebraico combina o verbo “ficar” com um substantivo que pode significar “segredo” ou “esconderijo” e, em seguida, acrescenta “esconda-se” para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O hifil de נגד significa comumente contar, informar ou declarar. “Contou” introduz a fala direta de modo natural e fiel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica de introdução da fala é representada naturalmente pelos dois-pontos em português, sem perder sua função discursiva.
- source_word: מְבַקֵּשׁ
  choice: está procurando
  rationale: O particípio expressa uma intenção atual ou contínua. “Está procurando” preserva esse aspecto sem afirmar que uma tentativa concreta já esteja em curso.
- source_word: לַהֲמִיתֶךָ
  choice: matar você
  rationale: O hifil de מות significa causar a morte; neste contexto, “matar” é direto e não sugere indevidamente uma execução formal.
- source_word: הִשָּׁמֶר נָא
  choice: tenha cuidado, por favor
  rationale: 'O imperativo nifal de שמר tem aqui sentido reflexivo: guardar-se, tomar cuidado. “Por favor” representa נָא e mantém o tom de apelo.'
- source_word: בַבֹּקֶר
  choice: pela manhã
  rationale: Traduz o sentido temporal direto do hebraico sem acrescentar “amanhã”, que é possível pelo contexto, mas não está explícito.
- source_word: וְיָשַׁבְתָּ
  choice: fique
  rationale: ישב pode significar sentar-se, permanecer ou habitar. No contexto de ocultação, “fique” comunica naturalmente a ideia de permanecer.
- source_word: בַסֵּתֶר
  choice: num lugar escondido
  rationale: סֵתֶר pode designar segredo, esconderijo ou lugar protegido. A formulação preserva o sentido locativo e a ambiguidade lexical é registrada em nota.
- source_word: וְנַחְבֵּאתָ
  choice: esconda-se
  rationale: O verbo חבא expressa esconder a si mesmo. A repetição após “lugar escondido” mantém a ênfase do hebraico.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: Jônatas ... a Davi ... Saul, meu pai
  rationale: Os nomes seguem suas formas portuguesas consagradas. “Meu pai” é mantido expressamente e na ordem do discurso hebraico, ressaltando a tensão pessoal sem explicá-la.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta e as frases curtas preservam a urgência do aviso; a repetição ligada ao esconderijo foi mantida por ser enfática no hebraico.
