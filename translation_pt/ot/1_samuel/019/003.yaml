base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: pt
  text: Eu sairei e ficarei ao lado do meu pai, no campo onde você está. Falarei com meu pai a seu respeito; então verei o que acontece[a] e contarei a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “verei o quê”, expressão elíptica que pode significar “verei o que acontece” ou “verei qual é a situação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Eu sairei
  rationale: O qal imperfeito na primeira pessoa do singular expressa a ação que Jônatas pretende realizar. “Sairei” é direto e preserva o sentido direcional do verbo.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: e ficarei ao lado do meu pai
  rationale: עמד, seguido da expressão idiomática לְיַד, indica que Jônatas se colocará ou permanecerá junto ao pai. “Ficarei ao lado” soa natural em português e comunica bem a ação planejada.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: no campo onde você estiver
  rationale: A oração relativa identifica o campo em que Davi estará. “Onde você estiver” expressa naturalmente em português a localização prevista no plano, sem reproduzir de modo redundante o advérbio שָׁם.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: Falarei com meu pai a seu respeito
  rationale: Nesta construção, דבר ב indica falar acerca de alguém. A formulação distingue com clareza o interlocutor, o pai, da pessoa sobre quem se fala, Davi.
- source_word: וְרָאִיתִי מָה
  choice: então verei o que acontece
  rationale: A expressão hebraica é elíptica, literalmente “verei o quê”. A complementação “o que acontece” transmite em português o resultado ou a situação que Jônatas pretende averiguar, enquanto a nota preserva a forma incompleta do original.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: e contarei a você
  rationale: O hifil de נגד significa dar a conhecer ou informar. “Contarei a você” é corrente, claro e adequado à conversa entre Jônatas e Davi.
theological_decisions: []
