  text: וַ/יִּשְׁלַ֤ח שָׁאוּל֙ אֶת הַ/מַּלְאָכִ֔ים לִ/רְא֥וֹת אֶת דָּוִ֖ד לֵ/אמֹ֑ר הַעֲל֨וּ אֹת֧/וֹ בַ/מִּטָּ֛ה אֵלַ֖/י לַ/הֲמִתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: pt
  text: 'Então Saul enviou os mensageiros para ver Davi[a], dizendo: “Tragam-no até mim na cama, para que eu o mate.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a cama” ou “com a cama”. A preposição hebraica pode ser entendida de mais de uma maneira; a ordem de Saul provavelmente era que Davi fosse carregado enquanto permanecia deitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então Saul enviou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: מַלְאָךְ designa aqui os homens enviados por Saul, não seres celestiais; “mensageiros” preserva o sentido básico.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: Mantém o sentido direto de ראה sem decidir se a intenção específica era verificar a presença ou inspecionar o estado de Davi.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz a fórmula hebraica que introduz o discurso direto, em registro digno e compreensível.
- source_word: הַעֲלוּ
  choice: Tragam-no até mim
  rationale: O hifil de עלה significa fazer subir ou trazer para cima. Em português, “tragam-no até mim” é natural; a nuance direcional de subida não é indispensável neste contexto.
- source_word: בַמִּטָּה
  choice: na cama
  rationale: A preposição ב permite mais de uma leitura. “Na cama” conserva a imagem de Davi sendo transportado enquanto supostamente permanecia deitado, sem eliminar as alternativas indicadas em nota.
- source_word: אֵלַי
  choice: até mim
  rationale: Expressa de modo natural o destino pessoal do movimento ordenado por Saul.
- source_word: לַהֲמִתוֹ
  choice: para que eu o mate
  rationale: O infinitivo com ל indica propósito. A formulação é direta e natural, preservando que o próprio Saul apresenta a morte como objetivo.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom narrativo digno, evita arcaísmos e preserva na nota a ambiguidade da preposição hebraica.
