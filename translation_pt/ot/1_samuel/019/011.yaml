base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: pt
  text: 'Então Saul enviou mensageiros à casa de Davi para vigiá-lo e matá-lo pela manhã. E Mical, sua mulher, avisou Davi: “Se você não salvar a sua vida[a] esta noite, amanhã será morto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você não escapar com vida esta noite, amanhã será morto.”'
    reason: Alternativa lexical para מְמַלֵּט אֶת־נַפְשְׁךָ, expressão que pode indicar escapar com vida ou pôr a própria vida a salvo.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto narrativo, refere-se a emissários humanos enviados por Saul, não a anjos.
- source_word: לְשָׁמְרוֹ
  choice: para vigiá-lo
  rationale: O verbo indica vigilância hostil junto à casa de Davi; “vigiar” evita o sentido protetor que “guardar” poderia sugerir.
- source_word: וְלַהֲמִיתוֹ
  choice: e matá-lo
  rationale: O hifil de מות expressa causar a morte; a forma direta combina com o plano de Saul.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Expressa naturalmente em português o momento planejado para a morte de Davi.
- source_word: וַתַּגֵּד
  choice: avisou
  rationale: No contexto, Mical não apenas transmite informação, mas alerta Davi sobre um perigo imediato.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: Mical, sua mulher
  rationale: Conserva a aposição hebraica e identifica claramente a relação de Mical com Davi.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: salvar a sua vida
  rationale: Reproduz de modo claro e idiomático a expressão hebraica que literalmente envolve pôr a própria vida a salvo.
- source_word: הַלַּיְלָה
  choice: esta noite
  rationale: Transmite o valor temporal da noite presente em português corrente.
- source_word: מוּמָת
  choice: será morto
  rationale: Preserva a forma passiva e indica, no contexto, que a morte será causada pelos agentes de Saul.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A coordenação simples com “E” preserva o fluxo narrativo hebraico; “você” dá naturalidade à advertência direta de Mical.
