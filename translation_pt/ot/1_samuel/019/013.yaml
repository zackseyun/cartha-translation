  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: pt
  text: Então Mical pegou o ídolo doméstico[a], colocou-o na cama, pôs uma peça feita de pelo de cabra[b] junto à cabeça dele e o cobriu com a veste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os terafins”, “os deuses domésticos” ou “a imagem”. O termo hebraico se refere a objetos de culto doméstico; aqui, embora tenha forma plural, parece designar uma única figura colocada na cama.
    reason: lexical_alternative
  - marker: b
    text: O sentido exato da expressão hebraica é incerto. Pode indicar uma trama, cobertura, almofada ou objeto semelhante feito de pelo de cabra e posto na região da cabeça.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: o ídolo doméstico
  rationale: O termo designa objetos de culto doméstico e tem forma morfologicamente plural, mas, nesta cena, funciona como uma única figura colocada na cama. A tradução comunica o sentido ao leitor moderno sem depender da transliteração.
- source_word: אֶל הַמִּטָּה
  choice: na cama
  rationale: Com o verbo שׂוּם, a preposição indica aqui a colocação do objeto na cama como parte do disfarce.
- source_word: כְּבִיר הָעִזִּים
  choice: uma peça de pelos de cabra
  rationale: כְּבִיר é raro e seu significado exato é incerto. A formulação genérica evita decidir indevidamente entre almofada, trama, cobertura ou objeto semelhante.
- source_word: מְרַאֲשֹׁתָיו
  choice: na cabeceira dele
  rationale: A expressão indica a região destinada à cabeça. O pronome retoma naturalmente o ídolo, embora a disposição procure representar Davi deitado.
- source_word: בַּבָּגֶד
  choice: com a roupa
  rationale: בֶּגֶד é um termo geral para roupa ou veste; o artigo definido foi preservado sem especificar indevidamente um manto ou cobertor.
- source_word: וַתְּכַס
  choice: o cobriu
  rationale: O verbo כסה significa diretamente cobrir; o objeto pronominal explícito em português torna natural a sequência da ação.
