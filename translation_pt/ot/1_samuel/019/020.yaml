reference: 1 Samuel 19:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: pt
  text: Então Saul enviou mensageiros para prender Davi. Quando eles viram o grupo de profetas[a] profetizando, com Samuel de pé, à frente deles[b], o Espírito de Deus veio sobre os mensageiros de Saul, e eles também profetizaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bando de profetas”. O termo hebraico se refere a um agrupamento reunido.
    reason: lexical_alternative
  - marker: b
    text: Ou “no meio deles”. O hebraico também pode indicar que Samuel estava em posição de liderança ou supervisão sobre eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: mensageiros
  rationale: No contexto, são emissários humanos enviados por Saul, não anjos; “mensageiros” é claro e preserva o termo recorrente.
- source_word: לָקַחַת
  choice: prender
  rationale: Embora o verbo tenha o sentido amplo de “tomar”, aqui indica a captura de Davi por ordem de Saul; “prender” expressa naturalmente essa intenção hostil.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: o grupo de profetas
  rationale: O substantivo designa um agrupamento reunido; “grupo” é corrente e compreensível, enquanto a nota preserva a alternativa “bando”.
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: profetizando / profetizaram
  rationale: Mantém a atividade profética em curso na primeira ocorrência e a repetição verbal deliberada quando os mensageiros passam a participar dela.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: de pé, à frente deles
  rationale: Expressa de modo natural a posição destacada de Samuel e a possível nuance de liderança, sem eliminar a ambiguidade espacial, registrada em nota.
- source_word: רוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  rationale: A expressão apresenta a ação divina que produz a atividade profética; esta formulação preserva sua força teológica sem acrescentar precisão doutrinária posterior.
- source_word: וַתְּהִי עַל
  choice: veio sobre
  rationale: Reproduz o caráter eventivo da expressão hebraica e é idiomático em português bíblico contemporâneo.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: e eles também profetizaram
  rationale: Preserva a ênfase de גַּם no fato inesperado de que os próprios mensageiros de Saul participaram da atividade profética.
theological_decisions:
- issue: Natureza de רוּחַ אֱלֹהִים nesta narrativa
  choice: “o Espírito de Deus veio sobre os mensageiros de Saul”
  alternative: “um espírito da parte de Deus veio sobre os mensageiros de Saul”
  rationale: Neste contexto de Samuel, a expressão aponta naturalmente para o Espírito de Deus agindo poderosamente. A tradução mantém a agência divina sem importar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “profetizar” foi mantida para refletir a coesão verbal do hebraico. Os marcadores foram colocados junto às expressões a que as notas realmente se referem.
