base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: pt
  text: Quando os mensageiros entraram, eis que os terafins[a] estavam na cama, com uma coberta de pelos de cabra[b] na cabeceira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o ídolo doméstico” ou “a imagem de ídolo”. O hebraico terafins designa uma imagem ou objeto cultual doméstico.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “coberta” é raro e pode indicar, de modo mais geral, uma peça tecida; “coberta de pelos de cabra” expressa sua provável função neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: No contexto, são homens enviados por Saul para prender Davi; “mensageiros” é amplo e natural, sem sugerir seres angelicais.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a força vívida e repentina da descoberta no relato hebraico.
- source_word: הַתְּרָפִים
  choice: os terafins
  rationale: A transliteração conserva o termo cultural específico para imagens cultuais domésticas e evita determinar além do texto seu tamanho ou função exata. A forma plural também acompanha a morfologia hebraica.
- source_word: אֶל הַמִּטָּה
  choice: na cama
  rationale: Embora אֶל costume indicar direção, aqui o contexto de descoberta requer em português uma expressão locativa idiomática.
- source_word: וּכְבִיר
  choice: uma coberta
  rationale: O substantivo raro parece designar algum tipo de peça tecida ou cobertura; “coberta” expressa sua provável função sem precisão indevida.
- source_word: הָעִזִּים
  choice: de pelos de cabra
  rationale: Explicita de maneira natural o provável material da cobertura.
- source_word: מְרַאֲשֹׁתָיו
  choice: na cabeceira
  rationale: Traduz de modo natural o lugar onde ficaria a cabeça, sem forçar um referente humano ou resolver a referência pronominal incerta.
theological_decisions:
- issue: Sentido de תְּרָפִים, objeto cultual ligado à religião doméstica
  choice: os terafins
  alternative: o ídolo doméstico; a imagem de ídolo
  rationale: O verso nomeia o objeto sem acrescentar avaliação explícita. A transliteração preserva sua especificidade cultural e evita importar julgamento ou função mais definidos que os indicados no texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Eis que” mantém deliberadamente a vivacidade narrativa do hebraico. A concordância plural de “os terafins estavam” segue a forma hebraica, enquanto as notas esclarecem que o objeto funciona no relato como um substituto de Davi.
