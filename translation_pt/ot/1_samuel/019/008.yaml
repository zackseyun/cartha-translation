base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: pt
  text: A guerra recomeçou[a]. Davi saiu, lutou contra os filisteus e lhes infligiu uma grande derrota; então eles fugiram de diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A guerra continuou” ou “Houve guerra novamente”. A expressão hebraica diz literalmente que “a guerra tornou a existir” e pode indicar a retomada ou a continuação dos combates.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: A guerra recomeçou
  rationale: O idioma com יסף seguido do infinitivo de היה indica recorrência ou retomada. “A guerra recomeçou” comunica com naturalidade a renovação das hostilidades, sem excluir totalmente a ideia de continuação, registrada em nota.
- source_word: וַיֵּצֵא דָוִד
  choice: Davi saiu
  rationale: Mantém o sentido direto de יצא e deixa que o contexto militar indique que ele saiu para combater, sem acrescentar um destino ou propósito não expresso.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: lutou contra os filisteus
  rationale: O verbo לחם com ב indica combate hostil; “contra” torna essa relação inequívoca em português atual.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: lhes infligiu uma grande derrota
  rationale: A combinação נכה + מכה descreve um golpe severo ou uma derrota imposta. A formulação portuguesa é natural e evita especificar mortandade que o texto não declara explicitamente.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: eles fugiram de diante dele
  rationale: Preserva a imagem do idioma מִפָּנָיו, indicando retirada diante da presença e do avanço de Davi.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução combina naturalidade sintática com proximidade às imagens do hebraico; a ambiguidade entre retomada e continuação da guerra é preservada em nota.
