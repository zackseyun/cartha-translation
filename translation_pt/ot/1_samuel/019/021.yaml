base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: pt
  text: Quando contaram isso a Saul, ele enviou outros mensageiros, e eles também profetizaram. Saul tornou a enviar mensageiros pela terceira vez, e eles também profetizaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Quando contaram isso a Saul
  rationale: נגד no hifil significa contar ou informar. A construção narrativa liga o relato à reação seguinte de Saul; “isso” retoma naturalmente os acontecimentos anteriores sem acrescentar conteúdo novo.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: outros mensageiros
  rationale: מַלְאָכִים designa aqui representantes humanos enviados por Saul, e אֲחֵרִים os distingue do grupo anterior.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: e eles também profetizaram
  rationale: O hitpael de נבא descreve atividade ou estado profético. “Profetizaram” preserva o termo amplo, enquanto גַּם הֵמָּה enfatiza que esse grupo teve a mesma experiência que o anterior.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: Saul tornou a enviar
  rationale: יסף seguido de nova ação expressa repetição; “tornou a enviar” comunica isso de modo natural e digno.
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: mensageiros pela terceira vez
  rationale: שְׁלִשִׁים funciona no contexto com sentido ordinal, indicando uma terceira remessa, não o número cardinal “trinta”. A formulação portuguesa explicita naturalmente que se trata da terceira tentativa de Saul.
theological_decisions:
- issue: Natureza da atividade profética dos mensageiros
  choice: profetizaram
  alternative: entraram em êxtase profético; comportaram-se como profetas
  rationale: O texto apresenta um fenômeno profético que atinge os enviados, mas não especifica sua manifestação exata. O verbo amplo evita identificar indevidamente a experiência com êxtase, fala inspirada ou louvor.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “eles também profetizaram” foi mantida para preservar a ênfase e o paralelismo do hebraico.
