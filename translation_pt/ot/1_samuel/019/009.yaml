base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: pt
  text: Então um espírito mau[a] da parte de Yahweh veio sobre Saul, enquanto ele estava sentado em sua casa, com a lança na mão; e Davi tocava a lira com a mão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito nocivo” ou “um espírito aflitivo”. O adjetivo hebraico pode significar tanto “mau” como “nocivo” ou “aflitivo”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “tocava com a mão” e não menciona aqui o instrumento; pelo contexto, tratava-se da lira.
    reason: contextual_explicitness
lexical_decisions:
- source_word: וַתְּהִי
  choice: veio
  rationale: O verbo, com אֶל שָׁאוּל indicando direção, introduz a chegada ou atuação do espírito sobre Saul; “veio” expressa naturalmente esse início de ação em português.
- source_word: רוּחַ יְהוָה רָעָה
  choice: um espírito mau da parte de Yahweh
  rationale: רוּחַ significa “espírito”, e רָעָה pode significar “mau” ou “nocivo/aflitivo”. “Da parte de Yahweh” representa a relação do construto sem atribuir maldade moral ao próprio Yahweh.
- source_word: אֶל שָׁאוּל
  choice: sobre Saul
  rationale: Embora אֶל tenha o sentido básico de “a/para”, “sobre Saul” comunica de modo idiomático o acometimento por uma força aflitiva.
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: enquanto ele estava sentado em sua casa
  rationale: O particípio descreve uma ação contínua que serve de pano de fundo para a chegada do espírito.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: com a lança na mão
  rationale: A oração nominal descreve a postura de Saul; a formulação escolhida é natural e fiel em português.
- source_word: מְנַגֵּן בְּיָד
  choice: tocava a lira com a mão
  rationale: מְנַגֵּן indica tocar um instrumento. Embora o instrumento não seja repetido neste versículo, o contexto imediato identifica a lira; a nota registra essa explicitação, enquanto “com a mão” preserva בְּיָד.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio divino sem substituí-lo por um título.
- issue: Relação entre o espírito mau e Yahweh
  choice: um espírito mau da parte de Yahweh
  alternative: um espírito mau de Yahweh; um espírito nocivo da parte de Yahweh
  rationale: “Da parte de” comunica procedência ou envio e conserva a afirmação teológica difícil do texto, sem sugerir que o adjetivo “mau” qualifique Yahweh. A possível acepção “nocivo/aflitivo” permanece em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Lança na mão” evita repetição possessiva desnecessária. A explicitação de “lira” torna a frase completa em português, e a nota preserva a forma mais enxuta e ambígua do hebraico.
