source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: pt
  text: Pois ele arriscou a própria vida[a], matou o filisteu, e Yahweh realizou uma grande libertação[b] para todo o Israel. Você viu isso e se alegrou. Então, por que você pecaria, derramando sangue inocente ao matar Davi sem motivo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pôs a sua vida na palma da mão”.
    reason: Preserva a imagem do idioma hebraico por trás da tradução natural “arriscou a própria vida”.
  - marker: b
    text: Ou “uma grande salvação” ou “uma grande vitória”.
    reason: תְּשׁוּעָה pode designar libertação, salvação ou vitória neste contexto militar.
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: arriscou a própria vida
  rationale: O idioma hebraico diz literalmente que ele pôs sua vida na palma da mão, isto é, expôs-se a perigo mortal. A formulação idiomática em português comunica esse sentido com clareza, enquanto a nota preserva a imagem original.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: matou o filisteu
  rationale: Neste contexto, נכה descreve o golpe pelo qual Davi derrotou e matou Golias. “Matou” expressa de modo natural e inequívoco o resultado narrativo.
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahweh realizou uma grande libertação
  rationale: עשה indica que Yahweh efetuou ou realizou o acontecimento, e תְּשׁוּעָה, no contexto militar, denota libertação ou vitória salvadora. “Libertação” mantém tanto o sentido concreto quanto a ação divina.
- source_word: לְכָל־יִשְׂרָאֵל
  choice: para todo o Israel
  rationale: A preposição ל indica benefício; a expressão portuguesa é clara e mantém Israel como designação coletiva do povo.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: Você viu isso e se alegrou
  rationale: O pronome “isso” explicita naturalmente em português o acontecimento que Saul viu, sem acrescentar conteúdo interpretativo.
- source_word: וְלָמָּה תֶחֱטָא בְּדָם נָקִי
  choice: Então, por que pecaria contra sangue inocente
  rationale: A pergunta retórica confronta Saul com a incoerência de matar um inocente. O condicional “pecaria” é natural em português e preserva o caráter deliberativo, enquanto “contra sangue inocente” mantém a ressonância jurídica da expressão hebraica.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: matando Davi sem motivo
  rationale: O infinitivo explica como Saul incorreria em culpa de sangue; חִנָּם significa aqui sem causa ou justificativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, sem impor uma leitura denominacional.
- issue: Sentido de תְּשׁוּעָה em contexto militar
  choice: uma grande libertação
  alternative: uma grande salvação; uma grande vitória
  rationale: A cena envolve uma vitória militar que livrou Israel. “Libertação” comunica esse referente concreto e conserva a dimensão salvadora do termo; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta de Jônatas usa “você”, natural no português do Brasil, sem coloquialismo excessivo. A tradução prioriza equivalência ótima, deixando as imagens ou alternativas lexicalmente relevantes nas notas.
