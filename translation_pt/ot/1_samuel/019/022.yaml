base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: pt
  text: 'Ele também foi a Ramá e chegou até o grande poço[a] que fica em Secu. Perguntou: “Onde estão Samuel e Davi?” E alguém respondeu: “Veja, eles estão em Naiote, em Ramá.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a grande cisterna» ou «a grande cova»; o termo hebraico בּוֹר pode ter esses sentidos.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz «E ele disse»; o sujeito da resposta não é especificado. «Veja» traduz o termo hebraico הִנֵּה, que também pode ser traduzido por «Eis».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: a Ramá
  rationale: O hê direcional ligado ao nome do lugar indica movimento em direção a Ramá; em português, a preposição «a» expressa isso naturalmente.
- source_word: בּוֹר הַגָּדוֹל
  choice: o grande poço
  rationale: בּוֹר pode designar poço, cisterna ou cova. Como o local serve de ponto de referência na rota, «poço» é uma tradução natural, sem ocultar as alternativas lexicais registradas em nota.
- source_word: בַּשֶּׂכוּ
  choice: em Secu
  rationale: O nome próprio é transliterado, e a preposição locativa é vertida de modo idiomático como «em».
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: Então perguntou
  rationale: A combinação hebraica introduz diretamente a pergunta. Em português corrente, «perguntou» comunica a ação completa sem a redundância pouco natural de «perguntou e disse».
- source_word: אֵיפֹה
  choice: Onde estão
  rationale: O interrogativo significa «onde»; o plural de «estão» concorda naturalmente com o sujeito composto «Samuel e Davi».
- source_word: הִנֵּה
  choice: Eles estão
  rationale: Neste contexto, הִנֵּה introduz e destaca a informação de localização. A formulação direta é natural em português, enquanto a nota preserva a força de atenção possível em «Veja» ou «Eis».
- source_word: בנוית
  choice: em Naiote
  rationale: O nome próprio é transliterado; «em» é a preposição portuguesa natural para indicar localização.
- source_word: בָּרָמָה
  choice: em Ramá
  rationale: A expressão localiza Naiote em Ramá, preservando a relação geográfica do hebraico.
- source_word: וַיֹּאמֶר
  choice: E alguém respondeu
  rationale: O verbo hebraico está no singular, mas seu sujeito não é especificado. «Alguém respondeu» conserva essa indefinição e explicita naturalmente que se trata da resposta à pergunta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «Ramá», «Secu» e «Naiote» como transliterações correntes; evita construções excessivamente literais quando soariam artificiais, preservando em notas as ambiguidades lexicais e sintáticas relevantes.
