base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: pt
  text: 'Então Saul enviou mensageiros para prender Davi, e ela[a] disse: “Ele está doente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “e ela disse”; pelo contexto, “ela” se refere a Mical.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto, o termo designa emissários humanos enviados por Saul, não seres celestiais.
- source_word: לָקַחַת
  choice: prender
  rationale: Embora o verbo tenha o sentido amplo de “tomar”, aqui os homens são enviados para deter Davi; “prender” comunica esse propósito hostil sem exagerá-lo.
- source_word: וַתֹּאמֶר
  choice: e ela disse
  rationale: A conjunção simples é preservada como “e”, sem introduzir um contraste não expresso. A forma verbal feminina indica que quem fala é uma mulher, identificada pelo contexto como Mical.
- source_word: חֹלֶה הוּא
  choice: Ele está doente
  rationale: A construção com adjetivo predicativo e pronome é vertida de maneira direta e idiomática.
