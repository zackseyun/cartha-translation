base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: pt
  text: 'Ele também tirou as suas roupas[a] e também profetizou diante de Samuel. Ficou caído, nu[b], todo aquele dia e toda a noite. Por isso dizem: “Saul também está entre os profetas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas vestes”.'
    reason: lexical_alternative
  - marker: b
    text: “Nu” pode indicar nudez completa ou que Saul estava sem as vestes exteriores; o hebraico não especifica mais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: tirou as suas roupas
  rationale: פשט com בגדים indica remover a roupa. “Tirou as suas roupas” é claro e natural em português moderno, sem especificar quais peças foram removidas.
- source_word: גַּם הוּא
  choice: também ele
  rationale: A repetição dá ênfase ao fato de que o próprio Saul passou pela mesma experiência dos mensageiros anteriores; a ordem marcada preserva essa ênfase.
- source_word: וַיִּתְנַבֵּא
  choice: profetizou
  rationale: O hitpael de נבא descreve atividade profética, mas não define se houve fala, comportamento extático ou ambos. “Profetizou” mantém essa abertura.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: diante de Samuel
  rationale: לִפְנֵי expressa presença; “diante de Samuel” é fiel, corrente e dignificado.
- source_word: וַיִּפֹּל עָרֹם
  choice: Ficou caído, nu
  rationale: נפל significa literalmente cair, enquanto a indicação de longa duração mostra que Saul permaneceu prostrado. A formulação preserva tanto a queda quanto o estado prolongado; עָרֹם é traduzido diretamente como “nu”.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: todo aquele dia e toda aquela noite
  rationale: Reproduz naturalmente a duração completa e a repetição enfática de כָּל.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Por isso dizem
  rationale: Introduz de modo idiomático a explicação de um dito proverbial e preserva o presente hebraico.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: Está Saul também entre os profetas?
  rationale: “Entre os profetas” traduz diretamente a expressão hebraica, e “também” conserva a força proverbial da pergunta.
theological_decisions:
- issue: Sentido do estado de Saul descrito por עָרֹם
  choice: Traduzir por “nu”, sem explicar a extensão da nudez no texto principal.
  alternative: “Sem as roupas de cima” ou “parcialmente despido”.
  rationale: O adjetivo hebraico significa normalmente “nu”, mas o contexto não esclarece se Saul estava inteiramente nu ou apenas sem as vestes exteriores. A tradução direta preserva a força narrativa, e a nota registra a ambiguidade contextual.
- issue: Natureza da atividade profética de Saul
  choice: Traduzir וַיִּתְנַבֵּא por “profetizou”.
  alternative: “Entrou em estado profético” ou “comportou-se como profeta”.
  rationale: O versículo associa Saul à atividade dos profetas, mas não define se ela consistiu em proclamação, êxtase ou ambos. “Profetizou” evita restringir o fenômeno.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “também ele” acompanha a ênfase hebraica. “Ficou caído” evita apagar o sentido literal de נפל e, ao mesmo tempo, expressa o estado prolongado indicado pelo restante da oração.
