base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: pt
  text: Davi fugiu e conseguiu escapar. Ele foi até Samuel, em Ramá, e lhe contou tudo o que Saul lhe havia feito. Depois, Davi e Samuel foram e ficaram em Naiote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naiote é um nome de lugar hebraico, provavelmente relacionado a moradias ou a um assentamento associado a Ramá.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: fugiu e conseguiu escapar
  rationale: Os dois verbos descrevem tanto a fuga quanto seu resultado bem-sucedido. “Conseguiu escapar” conserva essa progressão sem atribuir explicitamente o livramento à ação divina.
- source_word: וַיָּבֹא אֶל שְׁמוּאֵל הָרָמָתָה
  choice: foi até Samuel, em Ramá
  rationale: A terminação direcional em הָרָמָתָה indica movimento rumo a Ramá; a formulação portuguesa apresenta Samuel como destino pessoal e Ramá como sua localização.
- source_word: וַיַּגֶּד לוֹ
  choice: lhe contou
  rationale: O hifil de נגד neste contexto narrativo significa contar ou relatar; “lhe contou” é natural e claro.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: tudo o que Saul tinha feito contra ele
  rationale: “Tudo” preserva a abrangência de כָּל. Neste contexto hostil, “contra ele” expressa naturalmente o sentido adversativo de עָשָׂה לוֹ em português.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: Depois, Davi e Samuel foram
  rationale: “Depois” comunica a sequência narrativa do wayyiqtol. A repetição de “Davi” evita uma referência pronominal pouco clara em português, preservando os dois sujeitos explicitamente destacados no hebraico.
- source_word: וַיֵּשְׁבוּ
  choice: ficaram
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer. No contexto da viagem, “ficaram” indica estadia sem definir sua duração.
- source_word: בְנוית
  choice: em Naiote
  rationale: O termo funciona como nome de lugar. “Naiote” segue uma transliteração tradicional e reconhecível em português.
