source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוֹנָתָ֤ן בְּ/דָוִד֙ ט֔וֹב אֶל שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֣אמֶר אֵ֠לָי/ו אַל יֶחֱטָ֨א הַ/מֶּ֜לֶךְ בְּ/עַבְדּ֣/וֹ בְ/דָוִ֗ד כִּ֣י ל֤וֹא חָטָא֙ לָ֔/ךְ וְ/כִ֥י מַעֲשָׂ֖י/ו טוֹב לְ/ךָ֥ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: pt
  text: 'Jônatas falou bem de Davi a Saul, seu pai[a], e lhe disse: “Que o rei não peque contra seu servo, contra Davi[b], pois ele não pecou contra o senhor, e suas ações têm sido muito benéficas ao senhor”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falou favoravelmente sobre Davi”. A expressão hebraica diz literalmente “falou bem acerca de Davi”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete a preposição: “contra seu servo, contra Davi”, identificando Davi com o servo e dando ênfase à declaração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... טוֹב בְּדָוִד
  choice: falou bem de Davi
  rationale: A expressão hebraica significa falar favoravelmente a respeito de alguém. “Falou bem de Davi” é natural em português e conserva a ideia da defesa positiva feita por Jônatas.
- source_word: אֶל־שָׁאוּל אָבִיו
  choice: a Saul, seu pai
  rationale: Mantém a ordem e a relação expressas no hebraico, com pontuação natural em português.
- source_word: אַל־יֶחֱטָא הַמֶּלֶךְ
  choice: Que o rei não peque
  rationale: Reproduz a proibição de forma respeitosa e preserva a referência ao interlocutor na terceira pessoa, própria do tom cortesão.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: contra seu servo, contra Davi
  rationale: O verbo com בְּ indica pecar contra alguém. A repetição da preposição identifica Davi como o servo e também produz ênfase, por isso foi mantida.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: pois ele não pecou contra o senhor
  rationale: Conserva o mesmo verbo “pecar” da oração anterior e, assim, o contraste retórico entre a possível culpa de Saul e a inocência de Davi. “O senhor” comunica com naturalidade brasileira o tratamento respeitoso dirigido ao rei.
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: e suas ações têm sido muito benéficas ao senhor
  rationale: Expressa o valor positivo das ações de Davi em relação a Saul. “Benéficas” deixa claro que elas lhe fizeram bem, sem alterar o sentido do hebraico.
theological_decisions:
- issue: Manutenção do vocabulário moral de חטא
  choice: pecar contra
  alternative: fazer mal a / prejudicar
  rationale: O texto repete a raiz חטא para contrastar a conduta que Saul deve evitar com o fato de Davi não ter pecado contra ele. Manter “pecar” preserva esse contraste e não reduz a linguagem moral a mero prejuízo.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. O tratamento “o senhor” preserva o respeito devido ao rei sem acrescentar um título ausente do hebraico. A repetição “contra seu servo, contra Davi” foi mantida deliberadamente, embora seja menos compacta, para refletir a ênfase da construção original.
