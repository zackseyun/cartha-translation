base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: pt
  text: Então Jônatas chamou Davi e lhe contou tudo isso. Depois, Jônatas levou Davi a Saul, e Davi ficou na presença de Saul como antes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como ontem e anteontem”, uma expressão idiomática hebraica que significa “como antes” ou “como outrora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא יְהוֹנָתָן לְדָוִד
  choice: Jônatas chamou Davi
  rationale: קרא com לְ seguido de pessoa significa chamar ou convocar. “Chamou” é natural e não especifica se o chamado foi formal.
- source_word: וַיַּגֶּד לוֹ ... אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: lhe contou tudo isso
  rationale: O hifil de נגד significa dar a conhecer ou contar; דבר pode indicar palavras, acontecimentos ou assuntos. A formulação transmite de modo natural todo o conteúdo comunicado por Jônatas.
- source_word: וַיָּבֵא יְהוֹנָתָן אֶת דָּוִד אֶל שָׁאוּל
  choice: Jônatas levou Davi a Saul
  rationale: O hifil de בוא tem sentido causativo, “fazer vir” ou “levar/trazer”. Em português, “levou ... a” expressa naturalmente o movimento até Saul.
- source_word: וַיְהִי לְפָנָיו
  choice: Davi voltou a estar na presença de Saul
  rationale: Literalmente, a expressão diz que “ele esteve diante dele”. Os nomes explícitos evitam a ambiguidade pronominal em português; “voltou a estar” decorre da comparação subsequente e indica a restauração da situação anterior, sem restringi-la formalmente a serviço cortesão.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: como antes
  rationale: A locução hebraica, literalmente ligada a “ontem” e ao tempo anterior, é um idiomatismo que significa “como anteriormente”. “Como antes” comunica esse sentido em português atual.
