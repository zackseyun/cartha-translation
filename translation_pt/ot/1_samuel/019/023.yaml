base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: pt
  text: Ele foi para lá, para Naiote, em Ramá[a]. Então o Espírito de Deus também veio sobre ele[b], e ele continuou a caminhar e a profetizar, até chegar a Naiote, em Ramá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Naiote de Ramá”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o espírito de Deus estava sobre ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: Naiote, em Ramá
  rationale: O nome do lugar é transliterado segundo o uso consolidado em português; a preposição ב é expressa naturalmente por “em”.
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: o Espírito de Deus veio também sobre ele
  rationale: A construção היה על com רוּחַ descreve naturalmente a ação do Espírito que vem sobre alguém. “Espírito” com inicial maiúscula indica a provável referência ao poder atuante de Deus no contexto, sem tornar explícito o que o hebraico deixa implícito.
- source_word: גַּם הוּא
  choice: também sobre ele
  rationale: 'Preserva a força aditiva: Saul passou pela mesma experiência que seus mensageiros.'
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: seguiu caminho
  rationale: A combinação do verbo finito com o infinitivo absoluto comunica ação continuada; a formulação escolhida preserva esse valor de modo idiomático.
- source_word: וַיִּתְנַבֵּא
  choice: profetizando
  rationale: Mantém o sentido amplo da atividade profética sem especificar se envolvia fala, comportamento extático ou outra manifestação.
- source_word: עַד בֹּאוֹ
  choice: até chegar
  rationale: O infinitivo construto com sufixo é vertido naturalmente como oração temporal.
- source_word: שָׁם
  choice: para lá
  rationale: Conserva o apontamento discursivo para o destino mencionado no contexto anterior.
theological_decisions:
- issue: Identidade e forma de expressão de רוּחַ אֱלֹהִים
  choice: o Espírito de Deus veio também sobre ele
  alternative: o espírito de Deus esteve sobre ele
  rationale: O contexto favorece a referência ao Espírito divino que capacita, mas a nota preserva tanto uma tradução mais estática do idioma hebraico quanto a possibilidade gráfica de “espírito”.
- issue: Natureza da atividade profética de Saul
  choice: profetizando
  alternative: agindo como profeta
  rationale: O texto não descreve a forma exata da experiência; “profetizando” evita reduzi-la a frenesi, discurso preditivo ou mero comportamento exterior.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantêm-se a repetição do topônimo, a progressão narrativa e a ambiguidade quanto à forma da atividade profética.
