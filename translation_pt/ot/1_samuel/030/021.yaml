base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: pt
  text: Davi chegou até os duzentos homens que estavam exaustos demais para continuar seguindo Davi[a] e que tinham sido deixados junto ao ribeiro de Besor[b]. Eles saíram ao encontro de Davi e do grupo que estava com ele. Davi se aproximou deles e perguntou como estavam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tinham ficado para trás e não puderam seguir Davi”. O verbo hebraico pode indicar fraqueza ou esgotamento que impede alguém de prosseguir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que os fizeram permanecer junto ao ribeiro de Besor”. A forma hebraica pode expressar que alguém fez os homens permanecerem ali; o agente não é explicitado.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “perguntou-lhes a respeito da paz”. Trata-se de uma expressão hebraica para perguntar pelo bem-estar de alguém.
    reason: idiom
lexical_decisions:
- source_word: פִּגְּרוּ
  choice: estavam exaustos demais
  rationale: O verbo indica fraqueza, esgotamento ou incapacidade de prosseguir. A formulação comunica naturalmente que os homens já não conseguiam continuar, sem reduzir o sentido apenas a terem ficado para trás.
- source_word: מִלֶּכֶת אַחֲרֵי דָוִד
  choice: para continuar seguindo Davi
  rationale: A construção expressa a impossibilidade de prosseguir acompanhando Davi. “Continuar seguindo” preserva tanto o movimento subsequente quanto a ideia de ir atrás dele.
- source_word: וַיֹּשִׁיבֻם
  choice: tinham sido deixados
  rationale: O hifil de ישׁב pode significar fazer ficar, instalar ou deixar em determinado lugar. A voz passiva evita impor uma identificação excessivamente específica do agente e produz uma frase clara em português.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: junto ao ribeiro de Besor
  rationale: נחל pode designar um ribeiro, leito de torrente ou uádi. “Ribeiro de Besor” é legível e adequado como designação geográfica tradicional.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: A expressão descreve a saída para encontrar ou receber alguém. “Sair ao encontro de” é a equivalência portuguesa direta e idiomática.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: o grupo que estava com ele
  rationale: עָם designa aqui o contingente que acompanhava Davi, não todo o povo de Israel. “Grupo” mantém a referência coletiva sem restringi-la desnecessariamente a uma categoria militar formal.
- source_word: וַיִּגַּשׁ ... אֶת הָעָם
  choice: Davi se aproximou deles
  rationale: נגשׁ significa aproximar-se ou chegar perto. O pronome retoma naturalmente os duzentos homens e evita repetir “grupo” ou “homens” em português.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: perguntou como estavam
  rationale: A expressão idiomática hebraica significa perguntar pelo bem-estar de alguém. Esta formulação é natural no português moderno e preserva o caráter pessoal da pergunta.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do nome “Davi” foi mantida na primeira frase por refletir o texto hebraico; “grupo” traduz coletivamente עָם no contexto da tropa que o acompanhava. As notas preservam as principais alternativas lexicais e a forma idiomática da saudação.
