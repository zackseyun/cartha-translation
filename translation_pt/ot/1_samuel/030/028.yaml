lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: aos que estavam
  rationale: A fórmula combina a conjunção, a preposição e o relativo. No contexto, designa os destinatários situados em cada cidade; em português, “aos que estavam em” expressa isso com clareza. A conjunção é explicitada naturalmente apenas antes do último item da série.
- source_word: בַּעֲרֹעֵר
  choice: em Aroer
  rationale: O prefixo hebraico indica localização. O topônimo é transliterado, e “em” é a preposição natural em português para uma cidade.
- source_word: בְּשִׂפְמוֹת
  choice: em Sifmote
  rationale: Topônimo transliterado segundo formas legíveis em português; o prefixo locativo é traduzido por “em”.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: em Estemoa
  rationale: Topônimo transliterado segundo formas legíveis em português; o prefixo locativo é traduzido por “em”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A repetição hebraica foi preservada lexicalmente em “aos que estavam”, mas as conjunções foram ajustadas à coordenação natural do português. Não foram necessárias notas, pois “em” transmite adequadamente o valor locativo e a estrutura não apresenta ambiguidade relevante para o leitor.
