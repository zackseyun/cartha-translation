base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: pt
  text: Davi prosseguiu na perseguição, ele e quatrocentos homens; duzentos homens, porém, ficaram para trás, exaustos demais para atravessar o ribeiro de Besor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o uádi de Besor”. O termo hebraico pode designar um ribeiro, uma torrente, um uádi ou um leito de curso de água sazonal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: continuou a perseguição
  rationale: רדף significa perseguir. No contexto imediato, a perseguição já havia começado; a formulação natural em português explicita sua continuação sem perder o sentido militar.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: ele e quatrocentos homens
  rationale: Mantém a construção enfática e aposicional ligada a Davi, em português claro.
- source_word: וַיַּעַמְדוּ מָאתַיִם אִישׁ
  choice: duzentos ficaram para trás
  rationale: Embora עמד tenha o sentido básico de ficar de pé ou parar, aqui indica que esse grupo não prosseguiu com os demais.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: pois estavam exaustos demais para atravessar
  rationale: פגרו, nesta construção, descreve os homens como debilitados, exaustos ou atrasados a ponto de não conseguirem fazer a travessia. A tradução comunica naturalmente a condição e seu resultado.
- source_word: נַחַל הַבְּשׂוֹר
  choice: o ribeiro de Besor
  rationale: נחל pode indicar um ribeiro, torrente, uádi ou leito sazonal. “Ribeiro de Besor” é legível e preserva o nome próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A relação adversativa entre os quatrocentos que prosseguiram e os duzentos que ficaram foi expressa por “mas”. O ponto e vírgula preserva a unidade narrativa do versículo.
