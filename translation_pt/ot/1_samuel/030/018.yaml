  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: pt
  text: Davi recuperou tudo o que Amaleque havia levado[a], e Davi resgatou suas duas esposas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livrou”, nas duas orações; o hebraico emprega o mesmo verbo em ambas, mas o uso natural do português favorece “recuperou” para aquilo que havia sido levado e “resgatou” para as esposas de Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: recuperou / resgatou
  rationale: A mesma raiz hebraica aparece nas duas orações. Com “tudo o que Amaleque havia levado”, “recuperou” expressa naturalmente a retomada do que fora capturado; com “suas duas mulheres”, “resgatou” é a formulação contextual mais natural. A nota registra a unidade lexical do hebraico.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: tudo o que Amaleque havia levado
  rationale: כָּל אֲשֶׁר significa naturalmente “tudo o que”. O mais-que-perfeito composto esclarece que a ação de levar precedeu o resgate, e “Amaleque” preserva a forma coletiva singular do hebraico.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Mantém o nome próprio singular empregado coletivamente no texto hebraico, em vez de explicitar “os amalequitas” no corpo do versículo.
- source_word: שְׁתֵּי נָשָׁיו
  choice: suas duas mulheres
  rationale: Preserva explicitamente o numeral e traduz נָשִׁים de modo natural no contexto matrimonial já estabelecido; “esposas” também seria possível, mas “mulheres” mantém maior proximidade lexical e é claro em português.
- source_word: דָּוִד ... דָּוִד
  choice: Davi ... Davi
  rationale: A repetição do nome no início e no fim do versículo é preservada, refletindo a ênfase e a estrutura do hebraico em vez de substituir a segunda ocorrência por um pronome.
theological_decisions: []
