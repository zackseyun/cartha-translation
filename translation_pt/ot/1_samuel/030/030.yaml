  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: pt
  text: e aos que estavam em Hormá, aos que estavam em Bor-Asã e aos que estavam em Ataca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: e aos que estavam
  rationale: A combinação de וְ, לְ e אֲשֶׁר introduz, no contexto da lista de distribuição, os destinatários situados nas localidades mencionadas. A forma portuguesa explicita naturalmente a relação locativa subentendida.
- source_word: בְּחָרְמָה
  choice: em Hormá
  rationale: O prefixo בְּ tem sentido locativo, e חָרְמָה é um topônimo; emprega-se a forma portuguesa tradicional Hormá.
- source_word: בְּבוֹר עָשָׁן
  choice: em Bor-Asã
  rationale: Trata-se de um topônimo composto, transliterado em vez de traduzido. O hífen indica que os dois elementos formam um único nome de lugar.
- source_word: בַּעֲתָךְ
  choice: em Ataque
  rationale: O prefixo בְּ é locativo e עֲתָךְ é nome de lugar. A transliteração Ataque oferece leitura natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição reduzida para dar naturalidade à enumeração sem perder a identificação dos destinatários. Os topônimos são transliterados segundo formas legíveis em português.
