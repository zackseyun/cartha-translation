base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: pt
  text: 'Davi tomou todo o rebanho e todo o gado. Conduziram-nos à frente daquele outro gado e disseram[a]: “Este é o despojo de Davi”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico provavelmente indica que os animais recém-tomados eram conduzidos à frente dos animais recuperados anteriormente, enquanto o grupo os declarava despojo de Davi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: O verbo לקח, nesta forma narrativa, significa normalmente “tomou”; evita acrescentar uma ideia de violência não explicitada.
- source_word: כָּל הַצֹּאן וְהַבָּקָר
  choice: todos os rebanhos de ovelhas e cabras e as manadas de gado
  rationale: צאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras, enquanto בקר designa gado bovino. A explicitação torna a distinção clara em português corrente.
- source_word: נָהֲגוּ
  choice: conduziram
  rationale: נהג descreve o ato de fazer os animais avançarem; “conduziram” é natural em português e não sugere necessariamente que fossem puxados ou guiados individualmente.
- source_word: לִפְנֵי
  choice: à frente de
  rationale: Preserva o sentido espacial de “diante de/em frente de” no contexto do deslocamento dos animais.
- source_word: הַמִּקְנֶה הַהוּא
  choice: daqueles outros animais
  rationale: מקנה é um coletivo para animais ou rebanhos pertencentes a alguém. “Outros” expressa naturalmente a distinção contextual provável, enquanto “daqueles” preserva o demonstrativo hebraico.
- source_word: וַיֹּאמְרוּ
  choice: e diziam
  rationale: O plural é preservado. O imperfeito português representa naturalmente a declaração feita durante a condução dos animais, sem identificar sujeitos que o hebraico não nomeia.
- source_word: זֶה שְׁלַל דָּוִד
  choice: Este é o despojo de Davi
  rationale: Mantém o demonstrativo singular e a relação construta. “Despojo” é o termo português corrente para bens tomados em guerra ou numa incursão.
