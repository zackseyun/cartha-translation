  rationale: A revisão substitui o imperfeito «diziam» pelo pretérito narrativo «disseram» e simplifica os coletivos pecuários para uma formulação portuguesa natural e fiel. «Daquele outro gado» mantém o demonstrativo e a distinção contextual, enquanto a nota preserva o caráter provável dessa identificação.
