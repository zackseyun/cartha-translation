source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: pt
  text: Assim, Davi partiu, ele e os seiscentos homens que estavam com ele, e chegaram ao ribeiro de Besor[b], onde permaneceram os que ficaram para trás[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde os restantes pararam”; literalmente, “e os que restaram ficaram de pé”.'
    reason: lexical_alternative
  - marker: b
    text: “Ribeiro de Besor” também pode ser traduzido por “uádi de Besor”, isto é, um leito de rio ou vale que pode ter água apenas em certas épocas.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Assim, Davi partiu
  rationale: O wayyiqtol dá prosseguimento à narrativa. “Assim” expressa a progressão natural, e “partiu” comunica com clareza o movimento de Davi.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: ele e os seiscentos homens que estavam com ele
  rationale: O pronome independente הוּא é mantido em sua função enfática e apositiva. אִישׁ designa aqui os homens do grupo de combate.
- source_word: וַיָּבֹאוּ
  choice: e chegaram
  rationale: O verbo plural inclui Davi e seus homens. “Chegaram” é uma formulação portuguesa natural para בוא neste contexto de deslocamento.
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: ao ribeiro de Besor
  rationale: נַחַל pode indicar um curso de água, ravina ou leito sazonal. “Ribeiro” é acessível e preserva a referência geográfica tradicional, enquanto a nota registra a nuance de uádi.
- source_word: וְהַנּוֹתָרִים עָמָדוּ
  choice: onde permaneceram os que ficaram para trás
  rationale: O particípio הַנּוֹתָרִים identifica os que não prosseguiram, e עָמָדוּ, literalmente “ficaram de pé/pararam”, tem aqui o sentido contextual de permanecer no local. A ordem foi ajustada para fluência em português.
