  text: וַ/יִּשְׁבּ֨וּ אֶת הַ/נָּשִׁ֤ים אֲשֶׁר בָּ/הּ֙ מִ/קָּטֹ֣ן וְ/עַד גָּד֔וֹל לֹ֥א הֵמִ֖יתוּ אִ֑ישׁ וַ/יִּֽנְהֲג֔וּ וַ/יֵּלְכ֖וּ לְ/דַרְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: pt
  text: Levaram cativas as mulheres que estavam nela, do menor ao maior.[a] Não mataram ninguém, mas as conduziram para longe e seguiram seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos mais jovens aos mais velhos”. A expressão hebraica “do menor ao maior” pode indicar todo o grupo, sem exceção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Levaram cativas
  rationale: O verbo שׁבה descreve a captura de pessoas como prisioneiras de guerra. A formulação mantém esse sentido militar e soa natural em português.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: O substantivo significa de modo amplo “mulheres”; traduzi-lo como “esposas” restringiria o sentido além do que o hebraico expressa.
- source_word: אֲשֶׁר בָּהּ
  choice: que estavam nela
  rationale: O pronome feminino singular retoma a cidade de Ziclague, mencionada no versículo anterior, sem precisar repetir o nome.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: do menor ao maior
  rationale: A expressão hebraica abrange toda a extensão de um grupo, sem exceção, e pode envolver idade, condição ou importância. A tradução preserva essa abertura sem a limitar a “jovens e idosos”.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: Não mataram ninguém
  rationale: אִישׁ funciona aqui de modo indefinido, com o sentido de pessoa alguma, e não especificamente de homem adulto.
- source_word: וַיִּנְהֲגוּ
  choice: as conduziram para longe
  rationale: נהג pode significar conduzir ou fazer avançar. O pronome retoma as mulheres capturadas, e “para longe” comunica o afastamento forçado implícito no contexto.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: seguiram seu caminho
  rationale: A expressão idiomática indica que partiram e continuaram viagem; esta é uma equivalência natural e concisa em português.
