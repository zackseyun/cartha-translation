revisions:
- from: Nós atacamos o Neguebe dos queretitas[a], o território que pertence a Judá e o Neguebe de Calebe; e queimamos Ziclague.
  to: Fizemos uma incursão no Neguebe dos queretitas[a], no território pertencente a Judá e no Neguebe de Calebe; e incendiamos Ziclague.
  rationale: A revisão substitui o verbo genérico «atacamos» por uma expressão que representa com maior precisão a incursão militar indicada pelo hebraico. «Incendiamos» mantém naturalmente o sentido de queimar Ziclague com fogo. Os demais elementos geográficos, a estrutura da lista e a nota de variante são preservados.
