base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: pt
  text: Fizemos uma incursão no Neguebe dos queretitas[a], no território pertencente a Judá e no Neguebe de Calebe; e incendiamos Ziclague.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ceretitas”.'
    reason: Variante de transliteração do nome do povo.
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: atacamos
  rationale: No contexto militar, o verbo descreve uma incursão de saque. “Atacamos” é natural e claro em português, sem sugerir o sentido literal inadequado de simplesmente se espalhar.
- source_word: נֶגֶב
  choice: Neguebe
  rationale: O termo designa aqui a região árida meridional, e não apenas a direção sul. A forma geográfica tradicional “Neguebe” preserva esse valor nas duas ocorrências.
- source_word: הַכְּרֵתִי
  choice: queretitas
  rationale: Trata-se do nome de um povo. “Queretitas” é a forma consolidada e inteligível em português.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: o território que pertence a Judá
  rationale: A preposição continua a lista dos alvos da incursão, enquanto a oração relativa indica posse ou associação. “Território” explicita naturalmente o referente geográfico implícito.
- source_word: נֶגֶב כָּלֵב
  choice: o Neguebe de Calebe
  rationale: A expressão aponta para a porção do Neguebe associada a Calebe ou ao seu clã; a tradução conserva a estrutura e a nuance geográfica do hebraico.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: queimamos
  rationale: Em português, “queimamos” já inclui naturalmente o uso do fogo; reproduzir “com fogo” seria redundante sem acrescentar conteúdo relevante.
- source_word: צִקְלַג
  choice: Ziclague
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
theological_decisions: []
