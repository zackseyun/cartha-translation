  register: Português moderno, claro e digno, com sintaxe narrativa natural. Conserva-se “Neguebe” como nome geográfico e a sequência dos três territórios atacados. O ponto e vírgula marca a passagem da incursão regional para a declaração específica sobre Ziclague.
