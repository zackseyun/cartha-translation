revisions:
- from: Nada do que lhes pertencia faltou, desde o menor até o maior, nem filhos, nem filhas, nem despojo, nem coisa alguma do que os amalequitas haviam tomado para si[a]. Davi trouxe tudo de volta.
  to: Nada lhes faltou, do menor ao maior, filhos e filhas, despojo e tudo o que os amalequitas haviam tomado para si[a]. Davi recuperou tudo.
  rationale: A revisão substitui a formulação possessiva por «Nada lhes faltou», que abrange naturalmente pessoas e bens e se aproxima da sintaxe e do sentido do hebraico. Mantém-se o sujeito contextual «os amalequitas» e «para si» no texto, enquanto a nota esclarece o sentido contextual sem ocultar a redação literal. «Recuperou tudo» expressa de forma natural a ação de Davi de trazer/restaurar integralmente o que fora tomado.
