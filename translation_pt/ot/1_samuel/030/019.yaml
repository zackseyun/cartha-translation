base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: pt
  text: Nada lhes faltou, do menor ao maior, filhos e filhas, despojo e tudo o que os amalequitas haviam tomado para si[a]. Davi recuperou tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “tudo o que haviam tomado para si”. Pelo contexto, o sujeito são os amalequitas; isto é, tudo o que haviam tomado deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: faltou
  rationale: O nifal de עדר indica estar em falta ou ausente. “Faltou” é natural em português e comunica que nenhuma pessoa ou bem deixou de ser recuperado.
- source_word: לָהֶם
  choice: do que lhes pertencia
  rationale: O dativo com נֶעְדַּר expressa aqui a relação com as pessoas e os bens do grupo de Davi. A formulação portuguesa explicita idiomaticamente essa relação sem restringi-la apenas a propriedades.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: desde o menor até o maior
  rationale: Conserva o merismo hebraico e sua possível abrangência quanto a idade, posição ou importância, sem decidir entre essas nuances.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos, nem filhas
  rationale: Mantém a menção explícita do hebraico a descendentes masculinos e femininos e integra naturalmente os termos na série negativa em português.
- source_word: מִשָּׁלָל
  choice: despojo
  rationale: Termo corrente e digno para bens tomados numa incursão, adequado ao registro narrativo bíblico.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: coisa alguma do que os amalequitas haviam tomado para si
  rationale: Segue de perto o hebraico, cujo sujeito contextual são os amalequitas e cuja expressão לָהֶם significa literalmente “para si”. A explicitação do sujeito evita ambiguidade pronominal em português.
- source_word: הַכֹּל הֵשִׁיב
  choice: trouxe tudo de volta
  rationale: Expressa concretamente o hifil de שוב, “fazer voltar”, no contexto da recuperação das pessoas e dos bens.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
