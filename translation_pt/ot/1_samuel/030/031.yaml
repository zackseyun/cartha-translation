base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/031.yaml
  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: pt
  text: e aos que estavam em Hebrom, e a todos os lugares por onde Davi e seus homens haviam andado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “haviam viajado” ou “haviam circulado”. O verbo hebraico sugere deslocamento repetido de um lugar para outro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר
  choice: e aos que estavam
  rationale: A preposição com o relativo dá continuidade à lista de destinatários do versículo anterior; o plural implícito é expresso naturalmente em português.
- source_word: בְּ/חֶבְר֑וֹן
  choice: em Hebrom
  rationale: Emprega a forma portuguesa tradicional do topônimo e a preposição locativa natural.
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמ֛וֹת
  choice: e a todos os lugares
  rationale: Preserva a continuação da lista de destinatários e o sentido abrangente de כָל com o substantivo plural.
- source_word: אֲשֶׁר ... שָׁם
  choice: por onde
  rationale: A locução relativa portuguesa reúne naturalmente o relativo e o advérbio locativo hebraicos, evitando a redundância de “onde... ali”.
- source_word: הִתְהַלֶּךְ
  choice: haviam andado
  rationale: O hitpael de הלך indica aqui deslocamento por diversos lugares; o mais-que-perfeito composto situa esse percurso antes do envio dos presentes, enquanto a nota preserva as nuances itinerativas possíveis.
- source_word: דָּוִד הוּא וַ/אֲנָשָׁי/ו
  choice: Davi e seus homens
  rationale: O pronome independente após “Davi” funciona de modo a retomar o sujeito em conjunto com seus homens; acrescentar “ele mesmo” em português sugeriria uma ênfase reflexiva excessiva. אֲנָשָׁיו designa os homens que acompanhavam Davi.
theological_decisions: []
translation_notes:
  register: Português atual, digno e claro, com boa legibilidade brasileira. O versículo mantém a ligação sintática com a lista iniciada no contexto anterior. O marcador da nota foi colocado após o verbo a que ela se refere, e não após “Hebrom”.
