  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: pt
  text: Davi ficou profundamente angustiado, pois o povo falava em apedrejá-lo, porque a alma de todo o povo estava amargurada[a], cada homem por causa de seus filhos e de suas filhas. Mas Davi se fortaleceu em Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o espírito de todo o povo estava amargurado”; isto é, todos estavam profundamente amargurados.'
    reason: Alternativa lexical para נֶפֶשׁ e esclarecimento do idioma hebraico, sem introduzir a conotação mais estreita de ressentimento.
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: Davi ficou profundamente angustiado
  rationale: A construção impessoal com לְדָוִד indica que a situação se tornou extremamente aflitiva para Davi. A formulação portuguesa é natural e conserva a intensidade de מְאֹד.
- source_word: הָעָם
  choice: o povo
  rationale: Embora se trate do grupo de combatentes de Davi, o hebraico emprega o termo geral עָם; a tradução evita especificação desnecessária.
- source_word: אָמְרוּ ... לְסָקְלוֹ
  choice: falava em apedrejá-lo
  rationale: O infinitivo após אָמְרוּ expressa a ação cogitada pelo povo. A expressão portuguesa comunica deliberação ou intenção, sem sugerir que o apedrejamento já havia começado.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: a alma de todo o povo estava amargurada
  rationale: Mantém a imagem concreta e o singular coletivo do hebraico, sem reduzir a expressão a uma paráfrase emocional.
- source_word: אִישׁ
  choice: cada homem
  rationale: O substantivo é distributivo e se refere a cada integrante masculino do grupo, formado pelos homens de combate.
- source_word: עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: por causa de seus filhos e de suas filhas
  rationale: עַל indica aqui a causa da amargura; a formulação é clara em português e conserva a referência explícita a filhos e filhas.
- source_word: וַיִּתְחַזֵּק
  choice: se fortaleceu
  rationale: O hitpael tem força reflexiva ou média. A tradução preserva a resposta ativa de Davi sem explicar além do que o texto afirma.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: em Yahweh, seu Deus
  rationale: Conserva a preposição, o nome divino pessoal e o possessivo do texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome pessoal da aliança sem substituí-lo por um título.
- issue: Agência no fortalecimento de Davi
  choice: Davi se fortaleceu em Yahweh
  alternative: Davi foi fortalecido por Yahweh; Davi encontrou forças em Yahweh
  rationale: A forma reflexiva ou média apresenta Davi como sujeito ativo, enquanto בַּיהוָה identifica Yahweh como a esfera ou fonte dessa força. A tradução conserva essa tensão sem transformá-la em passiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preserva-se o paralelismo “filhos e filhas”, a imagem hebraica da alma amargurada e a forma pessoal “Yahweh”.
