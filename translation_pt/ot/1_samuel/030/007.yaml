base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: pt
  text: 'Então Davi disse ao sacerdote Abiatar, filho de Aimeleque: “Por favor, traga-me[a] o éfode[b].” E Abiatar levou o éfode a Davi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresente-me”. O verbo hebraico significa fazer chegar perto ou apresentar.'
    reason: lexical_alternative
  - marker: b
    text: O éfode era um objeto sagrado ou uma vestimenta sacerdotal usada no culto de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” preserva a sequência com fluidez em português.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Traduz diretamente o título definido que identifica o ofício de Abiatar.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: filho de Aimeleque
  rationale: A construção hebraica indica filiação; a forma sem artigo é natural em aposição em português.
- source_word: הַגִּישָׁה נָּא לִי
  choice: Por favor, traga-me
  rationale: O imperativo hifil de נגשׁ expressa fazer chegar ou apresentar, e נָא comunica uma solicitação cortês.
- source_word: הָאֵפֹד
  choice: o éfode
  rationale: Mantém, em forma aportuguesada, o termo técnico hebraico para um objeto ou vestimenta sacerdotal sem definir além do que o contexto permite.
- source_word: וַיַּגֵּשׁ
  choice: E ... levou
  rationale: O mesmo radical verbal indica que Abiatar fez o éfode chegar até Davi; “levou ... a” é claro e natural neste contexto.
- source_word: אֶל דָּוִד
  choice: a Davi
  rationale: A preposição indica movimento em direção a Davi.
theological_decisions:
- issue: Natureza e função do אֵפוֹד neste relato
  choice: Manter “éfode” no texto principal
  alternative: vestimenta sacerdotal; objeto sagrado sacerdotal
  rationale: O termo designa uma realidade cultual israelita específica e, neste contexto, está associado à consulta sacerdotal que se segue. A transliteração evita decidir indevidamente se aqui se enfatiza uma vestimenta ou outro objeto ligado a ela.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Éfode” preserva o vocabulário histórico-religioso; “Por favor” comunica naturalmente a partícula de cortesia נָא. Os marcadores foram colocados junto às expressões que suas notas explicam.
