- from: 'Davi lhe perguntou: “Você pode me levar até esse bando de saqueadores?” Ele respondeu: “Jure-me por Deus que não me matará nem me entregará nas mãos do meu senhor, e eu o levarei até esse bando de saqueadores.”'
  to: 'Davi lhe perguntou: “Você me fará descer até este bando de saqueadores?” Ele respondeu: “Jure-me por Deus que não me matará nem me entregará nas mãos do meu senhor, e eu o farei descer até este bando de saqueadores.”'
  rationale: A revisão conserva todo o conteúdo do rascunho, mas substitui «pode me levar» e «levarei» por formulações que refletem o hifil de ירד e sua direção descendente nas duas ocorrências. «Este» acompanha o demonstrativo hebraico, sem prejudicar a fluidez.
