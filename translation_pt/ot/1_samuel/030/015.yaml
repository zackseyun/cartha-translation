base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: pt
  text: 'Davi lhe perguntou: “Você me fará descer até este bando de saqueadores?” Ele respondeu: “Jure-me por Deus que não me matará nem me entregará nas mãos do meu senhor, e eu o farei descer até este bando de saqueadores.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי / וְאוֹרִדְךָ
  choice: levar até / levarei até
  rationale: O hifil de ירד tem sentido causativo, literalmente ‘fazer descer’. Em português, ‘levar até’ comunica naturalmente a condução ao local do grupo; explicitar ‘descer’ sem informação topográfica clara soaria menos natural.
- source_word: הַגְּדוּד
  choice: bando de saqueadores
  rationale: גדוד designa aqui um grupo armado que realizava incursões e saques. ‘Bando de saqueadores’ preserva o caráter móvel e predatório do grupo amalequita.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: Jure-me por Deus
  rationale: Reproduz de modo direto e idiomático o imperativo de jurar com invocação explícita de Deus.
- source_word: אִם תְּמִיתֵנִי
  choice: que não me matará
  rationale: Na fórmula hebraica de juramento, אִם introduz elipticamente a condição proibida. A negação deve ser explicitada em português para transmitir o sentido.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: me entregará nas mãos do meu senhor
  rationale: O hifil de סגר significa entregar alguém ao poder de outro. ‘Nas mãos’ conserva a metáfora hebraica de domínio e controle.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Refere-se ao amo humano do servo egípcio. ‘Senhor’ é natural no registro bíblico e mantém a relação de subordinação sem sugerir referência divina no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O diálogo foi mantido direto; ‘você’ torna a pergunta natural, enquanto as formas verbais evitam repetição excessiva do pronome. Não foi necessária nota textual ou lexical.
