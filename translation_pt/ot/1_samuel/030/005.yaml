base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: pt
  text: 'E as duas esposas de Davi tinham sido levadas cativas: Ainoã, de Jezreel, e Abigail, esposa de Nabal, de Carmelo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: E as duas mulheres de Davi
  rationale: O waw liga o versículo à narrativa anterior; a construção hebraica significa literalmente “as duas mulheres de Davi”. Em português bíblico atual, “mulheres” comunica naturalmente o sentido de esposas neste contexto.
- source_word: נִשְׁבּוּ
  choice: tinham sido levadas cativas
  rationale: O nifal perfeito de שׁבה indica que elas foram capturadas. O mais-que-perfeito situa a captura antes do momento narrado.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: Ainoã, de Jezreel
  rationale: O gentílico feminino identifica a procedência de Ainoã. “De Jezreel” é mais natural e claro em português moderno do que um gentílico raro.
- source_word: וַ/אֲבִיגַיִל
  choice: e Abigail
  rationale: Mantém a conjunção e translitera o nome pessoal em sua forma portuguesa corrente.
- source_word: אֵשֶׁת נָבָל
  choice: mulher de Nabal
  rationale: A cadeia construta identifica Abigail por sua relação matrimonial com Nabal. “Mulher de Nabal” preserva o paralelismo lexical com “mulheres de Davi” e é compreensível no registro bíblico.
- source_word: הַֽ/כַּרְמְלִי
  choice: de Carmelo
  rationale: O gentílico masculino caracteriza Nabal como natural ou residente de Carmelo. A expressão geográfica evita a associação equivocada com a posterior ordem religiosa carmelita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação conserva a ligação narrativa, explicita naturalmente a anterioridade da captura e verte os gentílicos por expressões de procedência, evitando termos raros ou potencialmente anacrônicos.
