  revision_rationale: A revisão restabelece a progressão sintática do hebraico e melhora a fluência em português atual. Mantém-se “Davi” como explicitação contextual segura do sujeito implícito, bem como “estatuto e norma” no texto principal para refletir o caráter prescritivo de חֹק וּמִשְׁפָּט sem impor um sentido judicial estreito.
