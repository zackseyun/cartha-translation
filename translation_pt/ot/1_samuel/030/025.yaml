  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: pt
  text: 'E assim foi, daquele dia em diante: Davi estabeleceu isso como estatuto e norma para Israel, até o dia de hoje.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Davi estabeleceu isso como estatuto e ordenança para Israel”.'
    reason: “Ordenança” é uma alternativa formal para מִשְׁפָּט no seu emprego normativo, em paralelo com “estatuto”.
lexical_decisions:
- source_word: וַיְהִי
  choice: E assim ficou estabelecido
  rationale: No contexto, a expressão introduz a consolidação duradoura da prática recém-declarada, e não apenas um acontecimento pontual.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: daquele dia em diante
  rationale: Equivalente português natural para a expressão temporal que indica continuidade a partir daquele momento.
- source_word: וַיְשִׂמֶהָ
  choice: Davi fez disso
  rationale: O sujeito implícito é Davi, identificado pelo contexto; explicitá-lo evita ambiguidade em português. O pronome feminino hebraico retoma a prática ou decisão anterior, expressa naturalmente por “disso”.
- source_word: לְחֹק
  choice: um estatuto
  rationale: Preserva o sentido formal de algo fixado ou prescrito.
- source_word: וּלְמִשְׁפָּט
  choice: e uma norma
  rationale: מִשְׁפָּט possui ampla gama semântica, incluindo juízo, decisão e regra. Em paralelo com חֹק, “norma” comunica uma disposição vinculante sem sugerir necessariamente uma decisão judicial específica.
- source_word: לְיִשְׂרָאֵל
  choice: para Israel
  rationale: Mantém diretamente a referência ao povo ao qual a disposição se aplicava.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressão idiomática que conserva a perspectiva temporal do narrador e a permanência da prática.
