base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/003.yaml
  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: pt
  text: Quando Davi e seus homens chegaram à cidade, viram que ela tinha sido queimada pelo fogo e que suas mulheres, seus filhos e suas filhas tinham sido levados cativos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: viram que
  rationale: Neste contexto narrativo, introduz a descoberta feita por Davi e seus homens; esta formulação natural em português preserva a força perceptiva do hebraico sem recorrer ao pouco corrente «e eis que».
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: havia sido incendiada
  rationale: O particípio passivo indica o estado resultante de a cidade ter sido queimada. «Incendiada» comunica de modo idiomático tanto o fogo quanto a ação anterior, sem a redundância de «queimada pelo fogo».
- source_word: נִשְׁבּוּ
  choice: tinham sido levados como prisioneiros
  rationale: O verbo hebraico significa ser capturado e levado cativo. A expressão escolhida é clara e natural, preservando a anterioridade em relação à chegada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência «suas mulheres, seus filhos e suas filhas» mantém as três categorias explícitas do hebraico; os possessivos repetidos evitam ambiguidade.
