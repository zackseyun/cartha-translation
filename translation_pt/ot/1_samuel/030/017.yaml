base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: pt
  text: Davi os abateu desde o crepúsculo até o entardecer do dia seguinte[a]. Nenhum homem dentre eles escapou, exceto quatrocentos rapazes que montaram em camelos e fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde o amanhecer”; a palavra hebraica pode referir-se ao crepúsculo tanto da manhã quanto da tarde. Alguns entendem aqui o crepúsculo matutino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: os abateu
  rationale: O verbo נכה, neste contexto militar, indica golpear e vencer com violência. “Abateu” conserva essa força de modo natural e digno, sem o arcaísmo de “feriu-os” em sentido bélico.
- source_word: מֵהַנֶּשֶׁף
  choice: desde o crepúsculo
  rationale: נשף pode designar o crepúsculo da manhã ou da tarde. “Crepúsculo” preserva no texto principal a ambiguidade lexical, explicitada na nota.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: até o entardecer do dia seguinte
  rationale: A expressão estende a ação até o período vespertino do dia seguinte. “Entardecer” representa הָעֶרֶב com mais precisão temporal do que “noite”.
- source_word: נִמְלַט מֵהֶם אִישׁ
  choice: Nenhum deles escapou
  rationale: O singular distributivo hebraico comunica totalidade. Esta formulação é idiomática em português e mantém a ênfase sem sugerir que o referente possa ser uma pessoa externa ao grupo.
- source_word: כִּי אִם
  choice: exceto
  rationale: A locução introduz a única exceção à afirmação absoluta anterior; “exceto” é seu equivalente moderno e claro.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: quatrocentos jovens
  rationale: נַעַר pode significar menino, jovem, rapaz ou servo. Como se trata de combatentes capazes de fugir montados, “jovens” é adequado sem impor infância nem condição servil.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: montaram nos camelos
  rationale: A expressão reproduz naturalmente em português o ato de subir nos camelos e cavalgar para fugir, preservando a preposição עַל.
- source_word: וַיָּנֻסוּ
  choice: e fugiram
  rationale: נוס significa fugir. “Fugiram” mantém a distinção em relação a נמלט, anteriormente traduzido por “escapou”.
