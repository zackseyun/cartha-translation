base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/004.yaml
  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: pt
  text: Então Davi e o povo que estava com ele ergueram a voz e choraram até ficarem sem forças para chorar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «levantaram a voz e choraram até que não houvesse mais força neles para chorar».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: ergueram a voz
  rationale: A construção נָשָׂא + קוֹל é uma expressão idiomática que significa erguer a voz. O singular coletivo «a voz» preserva de modo natural em português a forma e a força do hebraico.
- source_word: וַיִּבְכּוּ
  choice: choraram
  rationale: בכה denota chorar ou verter lágrimas; «choraram» é corrente, claro e apropriado ao tom solene da narrativa.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: até não terem mais forças
  rationale: A formulação comunica de maneira natural o esgotamento completo expresso literalmente por «até que não havia força neles».
- source_word: לִבְכּוֹת
  choice: para chorar
  rationale: Mantém a repetição enfática do verbo בכה presente no texto hebraico.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: o povo que estava com ele
  rationale: עָם significa amplamente «povo» ou «gente». Embora o contexto seja o grupo combatente de Davi, o hebraico não emprega aqui um termo específico para homens ou tropas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o referente amplo de עָם, a repetição de «chorar» e, no texto principal, apresenta de forma idiomática a ideia hebraica de esgotamento.
