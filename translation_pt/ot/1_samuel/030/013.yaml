base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a slave of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: pt
  text: 'Davi lhe perguntou: “A quem você pertence e de onde você é?” Ele respondeu: “Sou um jovem egípcio, escravo de um amalequita. Meu senhor me abandonou porque adoeci há três dias.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: A quem você pertence
  rationale: Expressa naturalmente em português a pergunta literal sobre a quem o jovem estava vinculado ou pertencia, preservando o contexto de servidão.
- source_word: נַעַר מִצְרִי
  choice: um jovem egípcio
  rationale: Mantém tanto a indicação de juventude quanto a origem egípcia.
- source_word: עֶבֶד
  choice: escravo
  rationale: No contexto, designa alguém pertencente a um senhor, não apenas um empregado ou servidor voluntário.
- source_word: וַיַּעַזְבֵנִי
  choice: me abandonou
  rationale: Transmite que o senhor o deixou para trás, com a nuance de desamparo presente no contexto.
- source_word: הַיּוֹם שְׁלֹשָׁה
  choice: há três dias
  rationale: Converte o idiomatismo temporal hebraico em uma expressão portuguesa clara e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A formulação conserva a relação de posse/servidão da pergunta e evita suavizar עֶבֶד como mero empregado.
