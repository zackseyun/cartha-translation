base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: pt
  text: 'Então todos os homens maus e sem caráter[a], dentre os que tinham ido com Davi, responderam: “Já que eles não foram comigo[b], não lhes daremos nada do despojo[c] que recuperamos, exceto que cada um leve consigo sua esposa e seus filhos e parta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “indignos” ou “transgressores”. O termo hebraico descreve aqui o caráter dessas pessoas, não usa “Belial” como nome próprio.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “comigo”. Embora os falantes sejam um grupo, o texto preserva aqui a forma singular.'
    reason: source_ambiguity
  - marker: c
    text: 'Ou: “saque”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: responderam
  rationale: Os dois verbos introduzem coletivamente a resposta e a fala direta. A forma plural em português produz narrativa natural, enquanto o sujeito conserva a totalidade do grupo descrito.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: todos os homens maus e sem caráter
  rationale: רָע expressa maldade moral, e בְלִיַּעַל caracteriza pessoas vis ou sem caráter. A expressão evita tratar o termo como o nome próprio posterior “Belial”.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: dentre os que tinham ido com Davi
  rationale: '“Dentre” comunica a força partitiva de מִן: os falantes eram um subconjunto dos homens que acompanharam Davi.'
- source_word: יַעַן אֲשֶׁר
  choice: Já que
  rationale: Introduz de modo natural a razão alegada para a recusa.
- source_word: לֹא הָלְכוּ עִמִּי
  choice: eles não foram comigo
  rationale: Preserva a primeira pessoa do singular do texto hebraico, apesar de o grupo falar em seguida na primeira pessoa do plural.
- source_word: לֹא נִתֵּן לָהֶם
  choice: não lhes daremos
  rationale: O imperfeito da primeira pessoa plural expressa a decisão ou determinação do grupo.
- source_word: מֵהַשָּׁלָל
  choice: nada do despojo
  rationale: שָׁלָל designa bens tomados em contexto militar; “nada do” representa naturalmente a construção partitiva.
- source_word: אֲשֶׁר הִצַּלְנוּ
  choice: que recuperamos
  rationale: Embora נצל no hiphil possa significar salvar ou livrar, aqui os bens haviam sido retomados dos invasores, tornando “recuperamos” a expressão contextual mais clara.
- source_word: כִּי אִם אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: exceto a esposa e os filhos de cada um
  rationale: כִּי אִם introduz a única concessão; אִישׁ tem valor distributivo, e בָּנָיו pode abranger os filhos como conjunto familiar.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: Que os levem consigo e partam
  rationale: 'Mantém as duas ações do hebraico em português corrente: conduzir consigo os familiares e ir embora.'
theological_decisions:
- issue: Sentido de בְלִיַּעַל
  choice: sem caráter
  alternative: Belial; indignos; transgressores
  rationale: Neste contexto, o termo caracteriza moralmente certos homens e não exige referência a um ser demoníaco. A tradução evita importar associações teológicas posteriores.
- issue: Alternância entre singular e plural na fala
  choice: comigo, seguido de daremos
  alternative: conosco, seguido de daremos
  rationale: A tradução conserva o singular explícito עִמִּי e, ao mesmo tempo, o plural נִתֵּן, sem harmonizar a tensão gramatical do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. Conserva-se a mudança significativa de “comigo” para “daremos”, e evita-se linguagem arcaica ou uma leitura posterior de בְלִיַּעַל como nome próprio.
