revisions:
- from: 'Então todos os homens maus e sem caráter[a], dentre os que tinham ido com Davi, responderam: “Já que eles não foram comigo[b], não lhes daremos nada do despojo[c] que recuperamos, exceto a esposa e os filhos de cada um. Que os levem consigo e partam.”'
  to: 'Então todos os homens maus e sem caráter[a], dentre os que tinham ido com Davi, responderam: “Já que eles não foram comigo[b], não lhes daremos nada do despojo[c] que recuperamos, exceto que cada um leve consigo sua esposa e seus filhos e parta.”'
  rationale: Apenas a oração concessiva final foi reformulada. «Exceto que cada um leve consigo sua esposa e seus filhos e parta» preserva a concessão limitada, explicita o valor distributivo de «cada um» e mantém as duas ações finais — conduzir/levar e partir — em português natural. As notas permanecem corretamente ancoradas e pertinentes.
