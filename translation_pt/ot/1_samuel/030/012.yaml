base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: pt
  text: Deram-lhe um pedaço de figos secos prensados[a] e duas porções de uvas-passas[b]. Ele comeu, e seu ânimo voltou[c], pois não havia comido pão nem bebido água durante três dias e três noites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico se refere a figos secos prensados em uma massa compacta.
    reason: cultural_note
  - marker: b
    text: Ou, possivelmente, “dois bolos de uvas-passas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “suas forças voltaram” ou “ele recobrou as forças”; literalmente, “seu espírito voltou a ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: um pedaço de pasta de figos secos
  rationale: פֶלַח indica um pedaço ou porção, e דְּבֵלָה designa figos secos prensados numa massa ou pasta. A formulação é natural em português e explicita o alimento antigo sem sugerir um bolo assado.
- source_word: שְׁנֵי צִמֻּקִים
  choice: duas porções de uvas-passas
  rationale: צִמֻּקִים significa uvas-passas, mas a forma exata das duas unidades contadas não é clara. “Porções” preserva essa incerteza melhor do que “cachos”, que poderia sugerir uvas ainda presas aos ramos, ou “bolos”, que especificaria prensagem não expressa inequivocamente.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: seu ânimo voltou
  rationale: A expressão diz literalmente que seu espírito voltou a ele e, no contexto, comunica que ele recobrou a vitalidade. “Seu ânimo voltou” mantém algo da imagem hebraica sem soar como retorno metafísico da alma; a tradução literal e outras possibilidades constam na nota.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém o termo concreto hebraico, que forma um par natural com “água”, sem generalizá-lo para “comida”.
- source_word: שָׁתָה מַיִם
  choice: bebido água
  rationale: Reproduz a especificidade da expressão hebraica em vez de ampliá-la para qualquer bebida.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: três dias e três noites
  rationale: Tradução direta da expressão temporal hebraica, sem ajuste interpretativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das notas foi regularizada para que cada marcador acompanhe a expressão correspondente. “Pasta de figos secos” evita a conotação moderna de bolo assado; “porções” não resolve indevidamente a forma incerta das unidades de passas.
