source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: pt
  text: 'Mas Davi disse: “Não façam isso, meus irmãos, com aquilo que Yahweh nos deu.[a] Ele nos protegeu[b] e entregou em nossas mãos[c] o grupo de saqueadores que veio contra nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto ao que Yahweh nos deu”. A construção hebraica é condensada e introduz o assunto de que Davi está tratando.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “nos guardou” ou “nos preservou”.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, literalmente “em nossa mão”, expressão que significa colocar alguém sob o poder de outra pessoa.
    reason: idiom_explanation
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: Não façam isso
  rationale: Expressa em português atual a proibição direta dirigida a vários homens, preservando a firmeza da repreensão de Davi.
- source_word: אֶחָי
  choice: meus irmãos
  rationale: Mantém o termo fraternal literal com que Davi se dirige aos seus homens.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: com aquilo que Yahweh nos deu
  rationale: A construção hebraica é condensada e introduz o objeto a respeito do qual Davi proíbe determinada conduta; esta formulação é natural e mantém a ligação com os bens concedidos por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: Ele nos protegeu
  rationale: Neste contexto de combate, שׁמר comunica que Yahweh guardou e preservou o grupo; “protegeu” é claro e corrente.
- source_word: וַיִּתֵּן
  choice: entregou
  rationale: No contexto militar, o verbo indica que Yahweh pôs o inimigo sob o poder de Davi e seus homens; “entregou” transmite esse resultado sem ampliar o sentido.
- source_word: הַגְּדוּד
  choice: o grupo de saqueadores
  rationale: Identifica com clareza a força hostil envolvida em incursões e saques, evitando o sentido excessivamente genérico de “tropa”.
- source_word: הַבָּא עָלֵינוּ
  choice: que veio contra nós
  rationale: Preserva tanto o movimento expresso pelo particípio quanto seu sentido hostil neste contexto.
- source_word: בְּיָדֵנוּ
  choice: em nossas mãos
  rationale: Reproduz de modo inteligível a expressão hebraica que representa domínio ou poder sobre alguém, ajustando o número ao uso natural do português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem o substituir pelo título “Senhor”.
- issue: Agência divina na vitória
  choice: Ele nos protegeu e entregou em nossas mãos o grupo de saqueadores
  alternative: Ele nos guardou e deu em nossa mão o bando
  rationale: Mantém as duas ações atribuídas a Yahweh — proteção e concessão da vitória — sem fundi-las nem introduzir uma explicação teológica adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala mantém a repreensão firme de Davi e o tratamento fraternal dirigido aos seus homens. O nome Yahweh é preservado, e o idioma hebraico da “mão” é apresentado naturalmente no texto e esclarecido em nota.
