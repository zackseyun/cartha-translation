base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: pt
  text: E quem dará ouvidos a vocês neste assunto? Pois a parte de quem desce à batalha será igual à parte de quem fica junto à bagagem[a]; juntos, farão a partilha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto aos suprimentos” ou “junto ao equipamento”. O termo hebraico pode designar objetos, utensílios, equipamento ou bagagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: E quem
  rationale: Mantém a ligação introduzida pela conjunção e apresenta naturalmente a pergunta retórica de Davi.
- source_word: יִשְׁמַע לָכֶם
  choice: dará ouvidos a vocês
  rationale: שׁמע com ל pode significar escutar, atender ou obedecer. A expressão portuguesa comunica aqui a ideia de aceitar ou atender à proposta deles.
- source_word: לַדָּבָר הַזֶּה
  choice: neste assunto
  rationale: דבר designa aqui a questão ou proposta em debate, não apenas uma palavra falada.
- source_word: כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים
  choice: a parte de quem desce à batalha será igual à parte de quem fica junto à bagagem
  rationale: Preserva o idiomatismo hebraico 'desce à batalha' e torna explícita, sem exceder o paralelismo, a equivalência entre as duas partes. 'Bagagem' representa כֵּלִים no contexto de bens e equipamento guardados.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: juntos a repartirão
  rationale: Conserva tanto o advérbio 'juntos' quanto o sentido concreto de dividir ou repartir a parte do despojo.
theological_decisions: []
