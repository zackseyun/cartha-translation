base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: pt
  text: Quando o levou para baixo, eis que eles estavam espalhados[a] por toda a terra, comendo, bebendo e festejando por causa de todo o grande despojo[b] que haviam tomado da terra dos filisteus e da terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dispersos”. O particípio hebraico pode ressaltar tanto a dispersão como a ampla distribuição pelo lugar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “festejando com todo o grande despojo”. A preposição hebraica pode indicar a causa ou ocasião da festa, ou associá-la ao despojo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: Quando ele o fez descer
  rationale: O hifil de ירד significa fazer descer ou levar para baixo. A formulação conserva o sentido direcional e apresenta naturalmente a ação como anterior à cena avistada.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a função vívida do marcador hebraico, que chama a atenção para a cena repentinamente revelada.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: espalhados por toda a região
  rationale: O particípio passivo descreve o grupo distribuído por uma área ampla. 'Região' comunica o sentido local de אֶרֶץ no contexto e evita sugerir o planeta inteiro; 'por toda' representa de modo natural o idioma עַל־פְּנֵי.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: comendo, bebendo e festejando
  rationale: Os três particípios retratam ações simultâneas e em andamento. A sequência foi preservada sem reduzir tudo a uma paráfrase como 'banqueteando'.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: por causa de todo o grande despojo
  rationale: A preposição ב pode indicar a causa ou ocasião da festa. 'Despojo' é claro no contexto militar e preserva a referência aos bens tomados.
- source_word: אֲשֶׁר לָקְחוּ
  choice: que haviam tomado
  rationale: O mais-que-perfeito esclarece naturalmente que a tomada do despojo precedeu a celebração.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים
  choice: da terra dos filisteus
  rationale: Preserva tanto o sentido territorial de אֶרֶץ quanto a construção genitiva.
- source_word: וּמֵאֶרֶץ יְהוּדָה
  choice: e da terra de Judá
  rationale: Mantém o paralelismo territorial com a expressão anterior.
