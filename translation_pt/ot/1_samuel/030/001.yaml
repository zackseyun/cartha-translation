base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: pt
  text: Quando Davi e seus homens chegaram a Ziclague, no terceiro dia, os amalequitas já tinham feito uma incursão contra o Neguebe[a] e contra Ziclague; tinham atacado Ziclague e a incendiado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sul”. O hebraico néguebe pode indicar tanto o sul em geral quanto a região específica conhecida como Neguebe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: Quando ... chegaram
  rationale: A construção introduz a circunstância temporal da chegada de Davi; esta formulação é natural em português moderno e evita uma expressão narrativa arcaica.
- source_word: וַאֲנָשָׁיו
  choice: e seus homens
  rationale: No contexto, refere-se ao grupo de combatentes e companheiros de Davi, não ao povo em geral.
- source_word: צִקְלַג
  choice: Ziclague
  rationale: Forma tradicional e amplamente reconhecível do topônimo em português.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Equivalente direto e idiomático da expressão temporal hebraica.
- source_word: וַעֲמָלֵקִי
  choice: os amalequitas
  rationale: Embora a forma hebraica seja morfologicamente singular/coletiva, os verbos plurais indicam o grupo.
- source_word: פָשְׁטוּ
  choice: já tinham feito uma incursão
  rationale: Em contexto militar, o verbo indica uma incursão ou ataque de saque. O mais-que-perfeito composto deixa claro que isso ocorreu antes da chegada de Davi.
- source_word: אֶל נֶגֶב
  choice: contra o Neguebe
  rationale: Preserva a provável referência geográfica e o sentido hostil decorrente do contexto, sem ocultar a possibilidade lexical de 'sul', registrada em nota.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: Eles atacaram Ziclague
  rationale: נכה tem sentido amplo de golpear ou atacar; 'atacaram' é claro e natural para uma cidade alvo de incursão.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: e a incendiaram
  rationale: Expressa naturalmente em português a ação explícita de queimar a cidade com fogo, sem a redundância pouco idiomática de 'queimaram com fogo'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A narrativa foi dividida em duas frases para maior clareza. O marcador da nota foi colocado junto de “Neguebe”, termo ao qual a alternativa lexical efetivamente se refere.
