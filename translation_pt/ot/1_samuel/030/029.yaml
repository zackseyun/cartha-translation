  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: pt
  text: e aos que estavam em Racal[a], e aos que estavam nas cidades dos jerameelitas, e aos que estavam nas cidades dos queneus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Racal também é grafada «Rakal» em algumas tradições de transliteração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: e aos que estavam
  rationale: A construção repetida com waw, lamed e partícula relativa introduz os destinatários da distribuição. Em português, «aos que estavam» preserva o sentido dativo e explicita naturalmente a localização indicada por בְ.
- source_word: בְּרָכָל
  choice: em Racal
  rationale: Nome de lugar transliterado segundo uma forma corrente e transparente em português; o hebraico רָכָל corresponde a Racal.
- source_word: בְּעָרֵי
  choice: nas cidades de
  rationale: עִיר pode designar cidade ou povoado. «Cidades» é a formulação bíblica natural em português para os assentamentos associados a esses grupos, sem determinar indevidamente seu tamanho exato.
- source_word: הַיְּרַחְמְאֵלִי
  choice: os jerameelitas
  rationale: Embora o gentílico hebraico esteja morfologicamente no singular, aqui tem sentido coletivo depois de «cidades de»; o plural português expressa o povo associado a elas.
- source_word: הַקֵּינִי
  choice: os queneus
  rationale: O gentílico singular hebraico tem valor coletivo. «Queneus» é a forma tradicional e reconhecível em português para esse povo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição sintática mantida para refletir a estrutura da lista hebraica. Os gentílicos seguem formas bíblicas reconhecíveis em português.
