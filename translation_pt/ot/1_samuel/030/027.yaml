  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: pt
  text: aos que estavam em Betel, aos que estavam em Ramote-Neguebe[a] e aos que estavam em Jatir —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Ramote do Neguebe”, isto é, “em Ramote do Sul”.
    reason: Registra as alternativas possíveis para a relação entre רָמוֹת e נֶגֶב sem resolver no texto principal a ambiguidade do topônimo.
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: aos que estavam
  rationale: A combinação de לְ com אֲשֶׁר introduz, nesta lista distributiva, os destinatários que se encontravam em cada localidade. “Aos que estavam” expressa com naturalidade tanto a relação dativa quanto a localização implícita.
- source_word: בְּבֵית אֵל
  choice: em Betel
  rationale: O contexto indica o topônimo Betel, e não a tradução do sentido etimológico “casa de Deus”. A preposição בְּ é representada naturalmente por “em”.
- source_word: בְּרָמוֹת נֶגֶב
  choice: em Ramote-Neguebe
  rationale: A expressão é tratada como topônimo composto, preservando Neguebe como nome regional e evitando decidir no texto principal se נֶגֶב funciona como qualificativo geográfico ou como ideia de “sul”.
- source_word: בְּיַתִּר
  choice: em Jatir
  rationale: Jatir é a forma portuguesa convencional do topônimo; “em” traduz naturalmente a preposição locativa בְּ.
- source_word: וְ
  choice: e
  rationale: A conjunção coordena o último elemento da lista de destinatários.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecíveis dos topônimos. A repetição de “aos que estavam” preserva a estrutura distributiva hebraica sem soar excessivamente literal. O travessão final mantém a continuidade sintática da lista no contexto maior.
