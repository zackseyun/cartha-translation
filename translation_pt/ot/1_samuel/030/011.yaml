base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: pt
  text: Encontraram um homem egípcio no campo e o levaram a Davi. Deram-lhe pão, e ele comeu; e lhe deram água para beber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Encontraram
  rationale: O wayyiqtol dá continuidade à narrativa; em português, o pretérito perfeito sem conjunção inicial é natural e preserva a sequência.
- source_word: אִישׁ מִצְרִי
  choice: um egípcio
  rationale: Em português, o gentílico substantivado identifica naturalmente um homem egípcio; traduzir também אִישׁ como «homem» resultaria em formulação menos idiomática sem acrescentar informação necessária.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução direta de שָׂדֶה, sem acrescentar a ideia não explícita de campo aberto ou inculto.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: e o levaram a Davi
  rationale: לקח com uma pessoa e um destino exprime levá-la até esse destino; «levaram» é natural em português e mantém a perspectiva do grupo que o conduziu.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: Deram-lhe pão
  rationale: Preserva o sentido específico de לֶחֶם, «pão», e expressa naturalmente o objeto indireto.
- source_word: וַיֹּאכַל
  choice: e ele comeu
  rationale: Mantém o sujeito explícito e, como no hebraico, não acrescenta objeto ao verbo.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: também lhe deram água para beber
  rationale: O hifil de שׁקה significa dar de beber; esta formulação idiomática conserva o valor causativo sem sugerir coerção.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A pontuação organiza a sequência sem alterar os acontecimentos; «também» liga de modo natural a segunda provisão à primeira.
