base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: pt
  text: 'Quando Davi chegou a Ziclague, enviou parte dos despojos aos anciãos de Judá, seus amigos, dizendo: “Aqui está um presente[a] para vocês, tirado dos despojos dos inimigos de Yahweh”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma bênção para vocês”. A palavra hebraica pode significar “bênção”, mas aqui se refere a um presente material enviado dos despojos.'
    reason: Alternativa lexical de בְּרָכָה, preservando seu sentido literal ao mesmo tempo que esclarece seu referente concreto no contexto.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Quando Davi chegou
  rationale: O wayyiqtol dá continuidade à narrativa; a oração temporal liga naturalmente a chegada de Davi à ação seguinte.
- source_word: צִקְלַג
  choice: Ziclague
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome do lugar.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: enviou parte dos despojos
  rationale: A preposição מִן indica que o que foi enviado procedia do total dos bens capturados; “parte” torna essa relação clara, e “despojos” conserva o contexto militar.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: aos anciãos de Judá
  rationale: Expressa os líderes reconhecidos de Judá em linguagem bíblica corrente e compreensível.
- source_word: לְרֵעֵהוּ
  choice: seus amigos
  rationale: רֵעַ pode indicar amigo, companheiro, associado ou próximo; “seus amigos” preserva a relação favorável sem especificar além do hebraico.
- source_word: הִנֵּה לָכֶם
  choice: Aqui está ... para vocês
  rationale: Reproduz a função dêitica de הִנֵּה em português natural e atual, chamando a atenção para aquilo que Davi envia.
- source_word: בְּרָכָה
  choice: um presente
  rationale: Embora o sentido lexical básico seja “bênção”, neste contexto a palavra designa concretamente um presente material; a alternativa literal é preservada em nota.
- source_word: מִשְּׁלַל
  choice: tirado dos despojos
  rationale: Mantém o sentido de bens capturados e deixa clara a origem do presente.
- source_word: אֹיְבֵי יְהוָה
  choice: dos inimigos de Yahweh
  rationale: Reproduz diretamente a cadeia construta e preserva a caracterização teológica dos inimigos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de בְּרָכָה neste contexto
  choice: um presente
  alternative: uma bênção
  rationale: O referente imediato é uma porção material dos despojos. “Presente” comunica essa função no texto principal, enquanto “bênção” é mantida em nota para preservar a ressonância lexical e teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. Emprega “vocês” no discurso direto e evita formas arcaicas como “eis” e “vós”. O marcador [a] foi colocado junto de “presente”, termo ao qual a nota efetivamente se refere.
