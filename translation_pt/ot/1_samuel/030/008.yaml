base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: pt
  text: 'Então Davi consultou o SENHOR, dizendo: “Devo perseguir este bando de saqueadores? Conseguirei alcançá-lo?” Ele lhe respondeu: “Persiga-o, pois certamente o alcançará e certamente resgatará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consultou o SENHOR
  rationale: Expressa naturalmente o ato de buscar orientação divina; SENHOR segue a convenção portuguesa para o nome divino.
- source_word: הַגְּדוּד
  choice: bando de saqueadores
  rationale: No contexto, designa o grupo invasor que saqueou Ziclague, não uma unidade militar regular.
- source_word: הַשֵּׂג תַּשִּׂיג
  choice: certamente os alcançará
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a certeza da ação.
- source_word: וְהַצֵּל תַּצִּיל
  choice: e certamente resgatará os cativos
  rationale: Preserva a ênfase enfática hebraica; o objeto implícito é explicitado de modo contextual e natural em português.
theological_decisions:
- issue: Identidade de quem responde a Davi
  choice: Ele lhe respondeu
  alternative: O SENHOR lhe respondeu
  rationale: Mantém a referência pronominal do hebraico sem especificar um mecanismo de revelação não declarado no versículo.
- issue: Resultado do resgate
  choice: certamente resgatará os cativos
  alternative: certamente salvará tudo
  rationale: O hebraico não traz objeto explícito neste versículo. A formulação preserva o foco contextual em pessoas capturadas sem introduzir a ideia mais ampla de recuperar todos os bens.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. As duas construções enfáticas hebraicas foram reproduzidas por “certamente”.
