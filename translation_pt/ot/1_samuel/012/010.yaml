base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: pt
  text: 'Então eles clamaram ao SENHOR e disseram: “Pecamos, porque abandonamos o SENHOR e servimos aos Baalins e às Astarotes. Agora, porém, livra-nos da mão de nossos inimigos, e te serviremos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: clamaram
  rationale: Expressa o pedido intenso dirigido a Deus, preservando o valor do verbo hebraico sem soar arcaico.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o nome divino no texto do Antigo Testamento.
- source_word: הַבְּעָלִים
  choice: os baalins
  rationale: Mantém o plural hebraico, que se refere às manifestações ou imagens locais de Baal, em forma tradicional e inteligível em português.
- source_word: הָעַשְׁתָּרוֹת
  choice: as astartes
  rationale: Conserva o plural do hebraico e emprega a forma portuguesa tradicional do nome da divindade.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: das mãos de nossos inimigos
  rationale: Preserva a metáfora hebraica de poder ou domínio, natural também em português.
theological_decisions:
- issue: Relação expressa por כִּי após a confissão de pecado
  choice: porque
  alternative: pois
  rationale: Mantém explicitamente a razão dada pelos israelitas para sua confissão, sem acrescentar uma interpretação teológica.
- issue: Promessa final וְנַעַבְדֶךָ
  choice: e nós te serviremos
  alternative: para que te sirvamos
  rationale: Preserva a formulação volitiva/promissória coordenada do hebraico, sem transformá-la explicitamente em finalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os plurais cultuais do original e a metáfora hebraica “das mãos”. Não há marcadores de nota, pois nenhuma nota é necessária.
