reference: 1 Samuel 12:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: pt
  text: Não é hoje a colheita do trigo? Clamarei a Yahweh, e ele enviará[a] trovões[b] e chuva. Então, saibam e vejam quão grande é a maldade que vocês cometeram aos olhos de Yahweh ao pedirem um rei para si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “dará”. Em português, “enviará” é mais natural com fenômenos meteorológicos.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “vozes” ou “sons”; neste contexto meteorológico, refere-se a trovões.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não é
  rationale: Preserva a pergunta retórica, que espera uma resposta afirmativa, sem convertê-la numa simples declaração.
- source_word: קְצִיר חִטִּים
  choice: a colheita do trigo
  rationale: Expressão portuguesa natural para a cadeia nominal hebraica e clara como indicação da estação agrícola.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: Clamarei a Yahweh
  rationale: קרא אל indica dirigir um chamado ou apelo a alguém; “clamarei a” comunica o caráter solene da invocação.
- source_word: וְיִתֵּן
  choice: ele enviará
  rationale: Embora נתן signifique literalmente “dar”, “enviar” é mais idiomático em português quando o complemento são fenômenos meteorológicos, sem alterar a causalidade divina.
- source_word: קֹלוֹת
  choice: trovões
  rationale: O sentido literal básico é “vozes/sons”, mas, em contexto de tempestade, o termo designa trovões.
- source_word: וּדְעוּ וּרְאוּ
  choice: Então, saibam e vejam
  rationale: As duas formas hebraicas são imperativos plurais. “Então” expressa a ligação consequencial com o sinal anunciado sem transformar os verbos em indicativos.
- source_word: רָעַתְכֶם רַבָּה
  choice: quão grande é a maldade
  rationale: רעה tem aqui sentido moral, e רבה intensifica a gravidade da conduta.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: 'Mantém a imagem hebraica e seu sentido avaliativo: a ação é má segundo o juízo de Yahweh.'
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: ao pedirem um rei para si
  rationale: Reproduz tanto o ato de pedir quanto o interesse reflexivo indicado por לָכֶם.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” distingue o nome pessoal divino de um título e segue a evidência lexical fornecida.
- issue: Força verbal de וּדְעוּ וּרְאוּ
  choice: saibam e vejam
  alternative: vocês saberão e verão
  rationale: As formas massoréticas são imperativos, por isso a tradução preserva a exortação de Samuel em vez de convertê-la silenciosamente numa previsão.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e internacionalmente. Emprega “vocês” para o plural dirigido ao povo, mantém a pergunta retórica e preserva os imperativos do hebraico.
