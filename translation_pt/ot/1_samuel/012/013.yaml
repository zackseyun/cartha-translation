  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: pt
  text: 'E agora, aqui está o rei que vocês escolheram, aquele que pediram; e vejam: Yahweh pôs um rei sobre vocês.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh lhes deu um rei”.'
    reason: Registra a alternativa que traduz נתן por “deu”; o texto principal explicita, com “sobre vocês”, a relação de autoridade indicada por על.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto o conectivo ו quanto o marcador temporal עַתָּה, introduzindo a conclusão presente de Samuel.
- source_word: הִנֵּה הַמֶּלֶךְ
  choice: aqui está o rei
  rationale: Expressa de modo natural e atual a função dêitica de הִנֵּה, chamando atenção para o rei presente diante do povo.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: que vocês escolheram
  rationale: Mantém o sentido comum de בחר e apresenta como concluída a escolha atribuída ao povo.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: aquele que pediram
  rationale: שׁאל, neste contexto, significa pedir ou solicitar. A formulação é natural em português e retoma o pedido de um rei sem acrescentar uma preposição ausente no hebraico.
- source_word: וְהִנֵּה
  choice: e vejam
  rationale: Conserva a segunda chamada enfática de atenção, usando uma forma plural adequada ao discurso dirigido ao povo e evitando repetição pouco natural de 'aqui está'.
- source_word: נָתַן יְהוָה
  choice: Yahweh pôs
  rationale: Embora נתן signifique literalmente 'dar', com עַל e 'rei' comunica aqui a colocação de alguém em posição de autoridade. 'Pôs' preserva essa ideia sem transformar o verbo em 'nomeou'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵיכֶם מֶלֶךְ
  choice: um rei sobre vocês
  rationale: עַל indica autoridade ou governo sobre o povo; o artigo indefinido produz uma frase natural em português sem negar que se trata do rei já mencionado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em vez de substituí-lo pelo título tradicional.
- issue: Agência divina na instituição do rei
  choice: Yahweh pôs um rei sobre vocês
  alternative: Yahweh lhes deu um rei
  rationale: A tradução principal conserva tanto a ação divina quanto a relação de autoridade expressa por עַל, sem resolver a tensão narrativa entre a escolha do povo e o ato de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural dirigido ao povo. O ponto e vírgula preserva as duas partes paralelas do enunciado, e os dois-pontos após 'vejam' introduzem naturalmente o fato ao qual Samuel chama atenção.
