id: 1SA.12.15
reference: 1 Samuel 12:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: pt
  text: Mas, se vocês não ouvirem a voz de Yahweh e se rebelarem contra a ordem de Yahweh, então a mão de Yahweh será contra vocês e contra os seus pais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico massorético traz “seus pais”. Algumas versões antigas e muitos intérpretes leem “seu rei”, leitura que se ajusta ao contexto imediato da advertência de Samuel tanto ao povo quanto ao rei.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o versículo anterior; “Mas, se” comunica naturalmente tanto a ligação quanto a força adversativa.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: vocês não ouvirem a voz de Yahweh
  rationale: Preserva a expressão hebraica de ouvir a voz, que neste contexto implica dar ouvidos e obedecer, sem reduzir a formulação ao sentido interpretativo de “obedecer”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e mantém sua distinção em relação aos títulos divinos.
- source_word: וּמְרִיתֶם
  choice: e se rebelarem
  rationale: O verbo מרה expressa rebeldia ou desafio deliberado, não apenas uma falha em cumprir uma ordem.
- source_word: אֶת פִּי יְהוָה
  choice: contra a ordem de Yahweh
  rationale: Literalmente, “a boca de Yahweh”; no contexto, é uma expressão idiomática para aquilo que Yahweh ordenou. “Ordem” comunica o sentido com clareza em português.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: então a mão de Yahweh será
  rationale: Mantém a metáfora bíblica da “mão” como poder ativo em juízo; “então” torna explícita e natural a consequência da condição.
- source_word: בָּכֶם
  choice: contra vocês
  rationale: No contexto de juízo, a preposição tem sentido adversativo, expresso naturalmente por “contra”.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: e contra os seus pais
  rationale: Segue o texto massorético, que traz literalmente “seus pais”, deixando a variante contextual “seu rei” para a nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” representa diretamente o nome divino no texto hebraico e evita substituí-lo por um título.
- issue: Leitura da expressão final וּבַאֲבֹתֵיכֶם
  choice: e contra os seus pais
  alternative: e contra o seu rei
  rationale: O texto massorético da WLC diz “seus pais” e, por isso, essa leitura permanece no texto principal. A leitura “seu rei”, encontrada em algumas versões antigas e adotada por muitos intérpretes devido ao contexto imediato, é preservada em nota sem corrigir silenciosamente o texto-base.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, de ampla compreensão no Brasil e no português internacional. A sintaxe conserva o paralelismo e a metáfora hebraica sem soar artificial.
