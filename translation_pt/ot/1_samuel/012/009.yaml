  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: pt
  text: Mas eles se esqueceram de Yahweh, seu Deus, e ele os vendeu[a] nas mãos de Sísera, comandante do exército de Hazor, nas mãos dos filisteus e nas mãos do rei de Moabe; e estes lutaram contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os entregou”. O hebraico diz literalmente “os vendeu”, expressão de juízo que indica entregar um povo ao poder de seus inimigos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: eles se esqueceram
  rationale: Preserva o sentido básico de שׁכח, sem explicitar no texto principal as implicações contextuais de negligência e deslealdade à aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Expressa naturalmente a construção com sufixo possessivo e preserva a relação pactual indicada no hebraico.
- source_word: וַיִּמְכֹּר
  choice: ele os vendeu
  rationale: Mantém a metáfora literal de מכר, usada aqui para a entrega judicial de Israel ao poder de inimigos.
- source_word: בְּיַד
  choice: às mãos de
  rationale: Conserva a imagem hebraica de estar sob a mão, isto é, sob o poder de alguém, em formulação portuguesa inteligível.
- source_word: סִיסְרָא
  choice: Sísera
  rationale: Segue a forma tradicional e reconhecível do nome em português.
- source_word: שַׂר צְבָא חָצוֹר
  choice: comandante do exército de Hazor
  rationale: Comunica com clareza moderna a função militar e preserva a relação sintática com Hazor.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Emprega o etnônimo convencional em português.
- source_word: מֶלֶךְ מוֹאָב
  choice: o rei de Moabe
  rationale: Tradução direta da cadeia construta hebraica.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: estes lutaram contra eles
  rationale: O demonstrativo esclarece de modo discreto que o sujeito plural mais natural são os poderes opressores recém-mencionados, enquanto o objeto é Israel.
theological_decisions:
- issue: Sujeito de “ele os vendeu”
  choice: Yahweh é o sujeito singular implícito.
  alternative: 'Formulação impessoal: “eles foram entregues”.'
  rationale: O nome Yahweh aparece na oração anterior, e o verbo hebraico singular continua naturalmente com ele como sujeito, apresentando a sujeição de Israel como juízo divino.
- issue: Sentido de “esqueceram-se de Yahweh”
  choice: Manter o verbo literal “esqueceram-se”, permitindo que o contexto comunique a deslealdade pactual.
  alternative: Explicitar a interpretação com “abandonaram” ou “negligenciaram”.
  rationale: Embora o contexto dê ao esquecimento uma força moral e pactual, a tradução literal preserva a formulação e a tensão do texto sem intensificá-la por paráfrase.
- issue: Referente do sujeito em “lutaram”
  choice: Os opressores mencionados são o sujeito; Israel é o alvo.
  alternative: Deixar a ambiguidade pronominal sem qualquer auxílio contextual.
  rationale: A forma verbal plural aponta naturalmente para os inimigos enumerados. “Estes” torna essa referência inteligível em português sem identificar um agente além do que a sintaxe sustenta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição parcial de “às mãos de” conserva a imagem e o ritmo enumerativo do hebraico; “Yahweh” mantém o nome divino.
