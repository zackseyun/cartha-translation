  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: pt
  text: Apenas temam Yahweh e sirvam-no fielmente, de todo o coração, pois considerem as grandes coisas que ele fez com vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com vocês”; também pode ser entendido como “por vocês” ou “entre vocês”.'
    reason: A preposição עִם significa literalmente “com”, mas, neste contexto, pode referir-se aos atos de Deus em favor do povo ou em seu meio.
lexical_decisions:
- source_word: אַךְ
  choice: Apenas
  rationale: Expressa a força restritiva e enfática da exortação, indicando a única resposta apropriada do povo.
- source_word: יְרָאוּ
  choice: temam
  rationale: Preserva o idioma bíblico e abrange temor reverente, lealdade e obediência diante de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: e sirvam-no
  rationale: Traduz diretamente o sentido amplo de עבד, que inclui serviço leal e culto sem reduzi-lo somente a atos de adoração.
- source_word: בֶּאֱמֶת
  choice: fielmente
  rationale: Neste contexto, comunica serviço verdadeiro, íntegro e constante; a forma adverbial é natural em português.
- source_word: בְּכָל לְבַבְכֶם
  choice: de todo o coração
  rationale: Equivalente idiomático natural para a dedicação interior completa indicada pela expressão hebraica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a exortação anterior.
- source_word: רְאוּ
  choice: considerem
  rationale: O imperativo pede não apenas percepção visual, mas reconhecimento refletido dos atos de Deus.
- source_word: אֵת אֲשֶׁר הִגְדִּל
  choice: as grandes coisas que ele fez
  rationale: Expressa de modo natural o uso idiomático do hifil de גדל para realizar feitos grandiosos.
- source_word: עִמָּכֶם
  choice: por vocês
  rationale: No contexto dos grandes atos de Deus em benefício de Israel, esta é a formulação mais natural em português; a tradução mais literal, 'com vocês', é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome pessoal. A transliteração preserva esse nome sem substituí-lo por um título.
- issue: Sentido do temor de Yahweh
  choice: temam
  alternative: reverenciem
  rationale: “Temam” mantém a tensão e o peso do idioma bíblico; no contexto da aliança, inclui reverência e obediência, mas não elimina o componente de temor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o plural dirigido ao povo e conserva o nome divino Yahweh. A colocação pronominal em “sirvam-no” corresponde ao registro escrito e solene sem ser arcaica.
