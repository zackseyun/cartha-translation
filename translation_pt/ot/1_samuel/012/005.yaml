  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: pt
  text: 'E ele lhes disse[a]: “Yahweh é testemunha contra vocês, e o seu ungido[b] é testemunha hoje de que vocês não encontraram coisa alguma em minha mão.” E eles disseram[c]: “Ele é testemunha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, “Yahweh é testemunha entre vocês” ou “com vocês”. No contexto, o sentido é forense: Yahweh é testemunha no caso que os envolve.'
    reason: lexical_alternative
  - marker: b
    text: “Seu ungido” refere-se aqui ao rei Saul, não diretamente ao título messiânico posterior.
    reason: cultural_note
  - marker: c
    text: O verbo hebraico final está no singular (“e ele disse”), mas, pelo contexto, expressa a resposta coletiva do povo; por isso, “eles disseram”.
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: testemunha
  rationale: O substantivo tem sentido jurídico e pactual. “Testemunha” corresponde naturalmente ao contexto da defesa pública de Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בָּכֶם
  choice: contra vocês
  rationale: Com עֵד neste contexto forense, a preposição indica que Yahweh serve de testemunha no caso que envolve os ouvintes. A ambiguidade mais literal, “entre vocês” ou “com vocês”, é preservada em nota.
- source_word: מְשִׁיחוֹ
  choice: seu ungido
  rationale: Refere-se aqui ao rei Saul. “Ungido” preserva o valor lexical sem transformar a expressão diretamente no título messiânico posterior.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: É a expressão portuguesa corrente para a declaração temporal hebraica, mantendo o caráter público e presente do testemunho.
- source_word: מְצָאתֶם
  choice: vocês não encontraram
  rationale: O perfeito descreve o resultado da avaliação já realizada pelos ouvintes; o pretérito perfeito é natural em português.
- source_word: בְּיָדִי
  choice: em minhas mãos
  rationale: Mantém a imagem concreta do hebraico, referente ao que estava na posse ou sob o controle de Samuel.
- source_word: מְאוּמָה
  choice: coisa alguma
  rationale: Sob negação, significa “nada” ou “qualquer coisa”; “não encontraram coisa alguma” é idiomático e preserva a ênfase.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: ele lhes disse ... eles disseram
  rationale: O primeiro singular refere-se a Samuel. Embora o último verbo também seja singular na forma hebraica, o contexto apresenta a resposta coletiva do povo; isso é explicitado em nota.
theological_decisions:
- issue: Sentido de מְשִׁיחוֹ em contexto régio não escatológico
  choice: seu ungido
  alternative: seu Messias
  rationale: No contexto imediato, a expressão designa Saul, o rei que havia sido ungido. A tradução mantém a ligação lexical com a unção sem impor ao versículo uma referência messiânica direta.
- issue: Função de Yahweh e do rei como testemunhas
  choice: testemunha contra vocês
  alternative: testemunha entre vocês/com vocês
  rationale: 'O contexto é judicial: Samuel convoca Yahweh e o rei como testemunhas de que o povo nada encontrou contra ele. A formulação principal torna clara essa função, enquanto a nota conserva a amplitude da preposição hebraica.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e as imagens jurídicas do hebraico foram preservadas quando naturais; ambiguidades relevantes foram mantidas em notas.
