  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: pt
  text: Pois Yahweh não abandonará o seu povo[a], por causa do seu grande nome, porque Yahweh se agradou de fazer de vocês um povo para si[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não deixará” ou “não rejeitará”.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque Yahweh quis fazer de vocês o seu povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: não abandonará
  rationale: O verbo נטש indica deixar ou abandonar. “Não abandonará” é claro, atual e mantém o peso relacional e pactual do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: עַם designa aqui Israel como povo pertencente a Yahweh; “o seu povo” expressa naturalmente essa relação.
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: por causa do seu grande nome
  rationale: A expressão apresenta o grande nome de Yahweh — sua honra e reputação revelada — como motivo de sua fidelidade.
- source_word: הוֹאִיל
  choice: se agradou
  rationale: הוֹאִיל comunica disposição voluntária ou decisão favorável. “Se agradou” preserva a nuance de vontade benevolente sem reduzir o verbo a uma escolha meramente técnica.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: fazer de vocês um povo para si
  rationale: A formulação explicita o pronome לוֹ (“para si”) e comunica que Yahweh constituiu os israelitas como povo pertencente a ele.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” preserva esse nome pessoal sem substituí-lo por um título.
- issue: Nuance da vontade divina em הוֹאִיל
  choice: se agradou de fazer
  alternative: quis fazer; decidiu fazer; dispôs-se a fazer
  rationale: A opção conserva a ideia de disposição favorável e voluntária, sem impor ao verso uma formulação técnica sobre eleição que o verbo, por si só, não exige.
- issue: Relação expressa por לוֹ לְעָם
  choice: um povo para si
  alternative: seu povo
  rationale: “Um povo para si” torna explícita a construção hebraica e destaca pertencimento, sem acrescentar uma definição denominacional dessa relação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural אֶתְכֶם e conserva o nome divino “Yahweh”. A repetição de “Yahweh” acompanha o hebraico.
