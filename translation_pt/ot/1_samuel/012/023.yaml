  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: pt
  text: Quanto a mim, longe de mim pecar contra Yahweh[a], deixando de orar por vocês! Eu os instruirei[b] no caminho bom e reto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino YHWH.
    reason: alternative_reading
  - marker: b
    text: Ou “ensinarei”. O verbo hebraico pode incluir tanto ensinar como orientar.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Quanto a mim
  rationale: Expressa com naturalidade a ênfase e o contraste marcados pelo pronome hebraico no contexto.
- source_word: חָלִילָה לִּי
  choice: longe de mim
  rationale: Equivalente idiomático que preserva a forte repulsa de Samuel diante dessa possibilidade.
- source_word: מֵחֲטֹא לַיהוָה
  choice: pecar contra Yahweh
  rationale: Mantém explicitamente a ideia de uma ofensa cometida contra Deus, e não apenas de negligência ministerial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: deixando de orar por vocês
  rationale: Apresenta a interrupção da intercessão em favor do povo como o modo pelo qual Samuel pecaria contra Yahweh.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: Eu os instruirei
  rationale: O hifil de ירה abrange ensinar e orientar; “instruirei” conserva ambas as nuances.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: no caminho bom e reto
  rationale: Preserva a metáfora hebraica do caminho como modo de viver e o sentido moral dos dois adjetivos.
theological_decisions:
- issue: Natureza da omissão da intercessão de Samuel
  choice: É explicitamente pecado contra Yahweh
  alternative: É apenas negligência de uma responsabilidade de liderança
  rationale: O hebraico declara diretamente que deixar de interceder seria pecar contra Yahweh; a tradução não atenua esse peso teológico.
- issue: Forma portuguesa do nome יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome próprio divino; a transliteração o preserva sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A exclamação preserva a força da rejeição expressa pelo idioma hebraico.
