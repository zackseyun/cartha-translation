base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: pt
  text: Quando Jacó chegou ao Egito, os antepassados de vocês[a] clamaram a Yahweh. Então Yahweh enviou Moisés e Arão, que tiraram os antepassados de vocês do Egito e os estabeleceram[b] neste lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os pais de vocês”; também pode ser traduzido por “seus ancestrais”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os fizeram habitar neste lugar” ou “os instalaram aqui”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Quando
  rationale: Introduz uma circunstância temporal e liga naturalmente a ida de Jacó ao Egito ao clamor posterior dos antepassados.
- source_word: בָּא יַעֲקֹב מִצְרָיִם
  choice: Jacó foi para o Egito
  rationale: בוא indica movimento em direção ao Egito. Em português, “foi para o Egito” é mais natural neste ponto de vista narrativo do que o literal “veio ao Egito”.
- source_word: וַיִּזְעֲקוּ
  choice: clamaram
  rationale: Preserva a ideia de um pedido urgente de socorro dirigido a Deus.
- source_word: אֲבוֹתֵיכֶם
  choice: os antepassados de vocês
  rationale: Embora literalmente signifique “os pais de vocês”, aqui designa as gerações ancestrais de Israel. “Antepassados” comunica essa referência histórica com clareza, enquanto a nota registra a forma literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em consonância com a camada inglesa auditada.
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Tradução direta e natural do verbo de envio ou comissionamento.
- source_word: וַיּוֹצִיאוּ
  choice: tiraram ... do Egito
  rationale: O hifil de יצא expressa fazer sair ou conduzir para fora; o sujeito plural remete naturalmente a Moisés e Arão.
- source_word: וַיֹּשִׁבוּם
  choice: os estabeleceram
  rationale: A forma causativa de ישׁב significa fazer habitar ou fixar alguém num lugar. “Estabeleceram” é conciso, natural e preserva a ideia de assentamento.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Mantém a referência dêitica concreta do discurso de Samuel ao território em que o povo então habitava.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Agência na saída do Egito e no assentamento
  choice: Moisés e Arão são o referente gramatical imediato de “tiraram” e “estabeleceram”
  alternative: Explicitar Yahweh como agente direto
  rationale: Os verbos hebraicos estão no plural e retomam Moisés e Arão, enviados por Yahweh. A tradução preserva tanto a iniciativa divina expressa no envio quanto a agência instrumental deles, sem harmonização explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “os antepassados de vocês” conserva a retórica histórica do hebraico. A longa coordenação hebraica foi dividida em duas frases, e “Então” torna explícita apenas a progressão narrativa já marcada pelos verbos consecutivos. Os marcadores foram posicionados junto às expressões que suas notas explicam.
