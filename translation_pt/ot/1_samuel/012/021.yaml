id: 1SA.12.21
reference: 1 Samuel 12:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: pt
  text: E não se desviem para seguir coisas sem valor[a], que não podem beneficiar nem livrar[b], pois elas não valem nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «coisas vazias», «coisas inúteis» ou «ídolos». O hebraico tohu indica aquilo que é vazio, fútil ou inconsistente.
    reason: lexical_alternative
  - marker: b
    text: Ou «salvar» ou «resgatar».
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: se desviem
  rationale: O verbo סור expressa afastar-se ou desviar-se. A forma pronominal conserva a metáfora de abandonar o caminho da lealdade correta e soa natural em português.
- source_word: אַחֲרֵי
  choice: para seguir
  rationale: Embora signifique literalmente «atrás de», neste contexto indica seguir ou buscar algo. «Para seguir» comunica com clareza a direção do desvio.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: coisas sem valor / não valem nada
  rationale: תֹהוּ designa vazio, futilidade ou algo inconsistente. A formulação preserva a amplitude do termo sem explicitar «ídolos», embora estes sejam o provável referente contextual, e mantém sua repetição enfática.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: que não podem beneficiar
  rationale: A oração descreve essas coisas como incapazes de proporcionar proveito. «Não podem beneficiar» explicita sua impotência prática sem acrescentar um objeto ausente no hebraico.
- source_word: וְלֹא יַצִּילוּ
  choice: nem livrar
  rationale: No hiphil, נצל significa livrar ou resgatar. «Livrar» preserva o uso bíblico amplo e a ideia de libertação de perigo.
- source_word: הֵמָּה
  choice: elas
  rationale: O pronome retoma «coisas», substantivo feminino plural em português; por isso, a concordância natural exige «elas».
theological_decisions:
- issue: Referente de «coisas sem valor»
  choice: Referência geral a realidades vazias e inúteis nas quais se deposita confiança, provavelmente ídolos, sem torná-los explícitos no texto.
  alternative: Traduzir diretamente por «ídolos».
  rationale: O contexto favorece os ídolos ou outros objetos de confiança indevida, mas תֹהוּ é mais abrangente e caracteriza sua vacuidade e inutilidade. A tradução conserva essa amplitude e não introduz uma especificidade lexical ausente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Não se desviem para seguir» evita uma construção excessivamente literal e pouco natural, enquanto «não valem nada» reproduz enfaticamente a repetição de תֹהוּ.
