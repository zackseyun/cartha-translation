base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: pt
  text: 'Então Samuel disse ao povo: “Não tenham medo. Vocês fizeram todo este mal. Contudo, não deixem de seguir Yahweh, mas sirvam a Yahweh de todo o coração.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל־הָעָם
  choice: Então Samuel disse ao povo
  rationale: O wayyiqtol dá continuidade à narrativa. “Então” é natural em português e não acrescenta uma relação causal; עָם designa aqui os israelitas reunidos.
- source_word: אַל־תִּירָאוּ
  choice: Não tenham medo
  rationale: A proibição plural de ירא é expressa de modo corrente e direto em português.
- source_word: אַתֶּם עֲשִׂיתֶם
  choice: Vocês fizeram
  rationale: O pronome independente אַתֶּם torna explícito e enfático o sujeito plural. “Vocês” oferece ampla legibilidade brasileira, e o pretérito perfeito corresponde à ação concluída com relevância no contexto imediato.
- source_word: כָּל־הָרָעָה הַזֹּאת
  choice: todo este mal
  rationale: רָעָה possui aqui força moral. “Mal” mantém a gravidade da repreensão sem reduzir o ato a simples engano.
- source_word: אַךְ
  choice: Contudo
  rationale: Marca forte qualificação adversativa após o reconhecimento do pecado; “contudo” conserva o contraste em registro digno e atual.
- source_word: אַל־תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: não deixem de seguir Yahweh
  rationale: A construção idiomática é literalmente não se desviar de após Yahweh. A tradução comunica naturalmente a ideia de abandonar o seguimento, preservando a imagem relacional central.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino indicado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַעֲבַדְתֶּם אֶת־יְהוָה
  choice: mas sirvam a Yahweh
  rationale: עבד significa servir e, no contexto da aliança, inclui culto e lealdade sem se limitar a “adorar”. “Mas” torna claro o contraste entre não abandonar e servir, embora o hebraico use a conjunção waw.
- source_word: בְּכָל־לְבַבְכֶם
  choice: de todo o coração
  rationale: Expressão portuguesa natural para a devoção integral indicada pelo idioma hebraico, no qual “coração” abrange vontade, pensamento e lealdade interior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto apresenta o nome pessoal da aliança. “Yahweh” o preserva por transliteração e evita substituí-lo silenciosamente por um título.
- issue: Força moral de רָעָה
  choice: mal
  alternative: maldade; coisa errada
  rationale: “Mal” conserva a avaliação moral explícita de Samuel; “coisa errada” a enfraqueceria, enquanto “maldade” poderia soar como caracterização mais abstrata ou intensificada.
- issue: Relação entre pecado passado e fidelidade futura
  choice: manter tanto a afirmação do mal cometido quanto a ordem de continuar seguindo e servindo
  alternative: parafrasear como promessa de perdão ou condenação definitiva
  rationale: O versículo sustenta em tensão a culpa real do povo e o chamado presente à fidelidade, sem explicitar aqui uma doutrina completa de perdão ou rejeição.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade especialmente natural no Brasil. O plural “vocês” evita formas regionais ou arcaizantes. Não foram incluídas notas porque as alternativas relevantes podem ser representadas adequadamente no próprio texto sem perda substancial de ambiguidade.
