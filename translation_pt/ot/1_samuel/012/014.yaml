  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: pt
  text: Se temerem a Yahweh, servirem a ele, ouvirem a sua voz[b] e não se rebelarem contra a ordem de Yahweh, então tanto vocês como o rei que reina sobre vocês seguirão Yahweh, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em tradução mais literal: “e vocês estarão, tanto vocês como o rei que reina sobre vocês, depois de Yahweh, seu Deus”. A construção hebraica é incomum; o sentido provável é que o povo e o rei permanecerão leais a Yahweh, seguindo-o.'
    reason: alternative_reading
  - marker: b
    text: “Ouvirem a sua voz” também pode ser entendido como “obedecerem à sua voz”, pois a expressão hebraica frequentemente inclui a ideia de ouvir com obediência.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição expressa pela prótase hebraica.
- source_word: תִּירְאוּ
  choice: temerem
  rationale: Preserva o peso pactual de ירא, que nesse contexto abrange temor reverente diante de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: servirem a ele
  rationale: עבד inclui serviço leal e cultual; a formulação mantém sua amplitude sem reduzi-lo apenas a adoração ritual.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: ouvirem a sua voz
  rationale: Conserva a imagem hebraica de escutar a voz, embora a expressão também implique obediência.
- source_word: וְלֹא תַמְרוּ
  choice: não se rebelarem
  rationale: מרה indica rebelião ou resistência deliberada, mais forte do que simples desobediência.
- source_word: אֶת־פִּי יְהוָה
  choice: contra a ordem de Yahweh
  rationale: Literalmente 'a boca de Yahweh'; no contexto, a expressão designa aquilo que ele ordena.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: tanto vocês como o rei
  rationale: Reproduz de modo natural a correlação גַּם ... וְגַם.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: que reina sobre vocês
  rationale: Embora מָלַךְ tenha forma perfeita, identifica o rei atualmente no exercício de seu governo.
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: seguirão Yahweh, seu Deus
  rationale: אַחַר pode expressar seguir alguém em lealdade. A formulação é natural em português, enquanto a nota registra a construção hebraica incomum.
theological_decisions:
- issue: Sentido da oração final וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: então tanto vocês como o rei ... seguirão Yahweh, seu Deus
  alternative: e vocês estarão, tanto vocês como o rei ... depois de Yahweh, seu Deus
  rationale: A leitura positiva de lealdade a Yahweh se ajusta ao uso de אַחַר para seguimento, mas o hebraico é sintaticamente abrupto; por isso, a tradução clara é acompanhada de nota que preserva a dificuldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural dirigidas ao povo. Emprega “vocês” para legibilidade brasileira e mantém “Yahweh” como nome divino. As notas preservam tanto a nuance obediencial de ouvir quanto a dificuldade sintática da oração final.
