base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: pt
  text: 'E eles disseram: “Você não nos oprimiu, não nos maltratou e não tomou coisa alguma da mão de ninguém.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da mão de homem algum”. A expressão provavelmente se refere a receber de alguém algum pagamento, presente ou suborno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: Mantém a sequência narrativa do wayyiqtol sem acrescentar uma nuance temporal mais específica.
- source_word: עֲשַׁקְתָּנוּ
  choice: você não nos oprimiu
  rationale: O verbo pode indicar opressão, exploração ou fraude mediante abuso de poder; “oprimiu” preserva sua amplitude no contexto de justiça pública.
- source_word: רַצּוֹתָנוּ
  choice: não nos maltratou
  rationale: Neste contexto, o verbo descreve tratamento abusivo ou injusto; “maltratou” comunica a força metafórica com naturalidade, sem sugerir necessariamente esmagamento físico.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: não tomou coisa alguma das mãos de ninguém
  rationale: Conserva a imagem concreta hebraica de tomar algo da mão de alguém, ao mesmo tempo que soa clara em português.
- source_word: אִישׁ
  choice: ninguém
  rationale: Sob negação, traduz naturalmente a referência distributiva a qualquer indivíduo, sem restringi-la indevidamente a homens adultos.
- source_word: מְאוּמָה
  choice: coisa alguma
  rationale: Expressa de modo idiomático o indefinido enfático em uma oração negativa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “não” preserva a estrutura enfática da declaração hebraica; a nota mantém visível o idioma concreto e sua provável implicação jurídica.
