base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: pt
  text: 'E agora, vejam: o rei anda à frente de vocês[a]. Eu envelheci e fiquei de cabelos brancos[b], e aqui estão meus filhos com vocês. E tenho andado à frente de vocês[c] desde a minha juventude até o dia de hoje.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o rei vai adiante de vocês» ou «o rei os lidera». A expressão hebraica traduzida por «anda à frente» pode indicar liderança pública.
    reason: lexical_alternative
  - marker: b
    text: Ou «envelheci e fiquei grisalho».
    reason: lexical_alternative
  - marker: c
    text: Ou «tenho andado diante de vocês» ou «tenho liderado vocês». Samuel estabelece intencionalmente um paralelo entre sua própria atuação pública e a do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conexão com o discurso anterior quanto a referência ao momento presente.
- source_word: הִנֵּה
  choice: vejam
  rationale: Comunica a força dêitica e enfática da partícula em português atual, sem recorrer ao mais arcaico «eis».
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: anda à frente de vocês
  rationale: Mantém a imagem hebraica de caminhar à frente, que neste contexto pode indicar atuação pública ou liderança, sem reduzir a expressão a apenas um desses sentidos.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: envelheci e fiquei de cabelos brancos
  rationale: Reproduz os dois verbos e conserva a imagem concreta dos cabelos brancos como sinal da idade avançada.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: e aqui estão meus filhos com vocês
  rationale: «Aqui estão» expressa naturalmente a ênfase apresentativa de הִנָּם.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: andei à frente de vocês
  rationale: Repete a mesma imagem usada para o rei e preserva o paralelo retórico entre a função pública de Samuel e a do monarca.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: desde a minha juventude até o dia de hoje
  rationale: Expressa claramente todo o período que vai da juventude de Samuel ao momento de sua fala.
