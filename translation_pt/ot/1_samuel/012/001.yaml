base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: pt
  text: 'Então Samuel disse a todo o Israel: “Vejam, atendi a tudo o que vocês me disseram e fiz um rei reinar sobre vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Interjeição que chama a atenção dos ouvintes; o plural concorda naturalmente com o discurso dirigido a todo o Israel.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: atendi ao que vocês me disseram
  rationale: A expressão idiomática hebraica significa escutar com assentimento ou obedecer, não apenas ouvir sons; esta formulação comunica o sentido em português corrente.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: fiz um rei reinar sobre vocês
  rationale: Preserva a construção causativa do verbo hebraico e a ênfase explícita no reinado do rei sobre o povo.
theological_decisions:
- issue: Agência de Samuel na instituição da monarquia
  choice: fiz um rei reinar sobre vocês
  alternative: estabeleci um rei sobre vocês
  rationale: Mantém a agência expressa na forma causativa hebraica sem explicar nem harmonizar aqui a relação entre a atuação de Samuel e a soberania divina.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Vocês” torna natural a referência plural; “Vejam” preserva a função discursiva de הִנֵּה. A repetição enfática do hebraico em “fiz um rei reinar” foi mantida por sua relevância retórica.
