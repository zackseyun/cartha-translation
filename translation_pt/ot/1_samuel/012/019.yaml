base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: pt
  text: 'Então todo o povo disse a Samuel: “Ore a Yahweh, seu Deus, em favor de seus servos, para que não morramos, pois acrescentamos a todos os nossos pecados este mal: pedir um rei para nós mesmos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: Então todo o povo disse
  rationale: O waw consecutivo dá sequência à narrativa; “então” expressa essa progressão com naturalidade. “Todo o povo” preserva o sentido coletivo.
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: Ore ... em favor de seus servos
  rationale: O imperativo הִתְפַּלֵּל significa “orar”, e בְּעַד explicita o caráter intercessório. “Em favor de” comunica isso sem substituir o verbo por uma interpretação mais específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a forma de segunda pessoa singular e a tensão retórica do apelo dirigido a Samuel.
- source_word: וְאַל נָמוּת
  choice: para que não morramos
  rationale: No contexto do pedido de oração, expressa naturalmente em português o resultado negativo que o povo deseja evitar, sem alterar o sentido.
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: pois acrescentamos a todos os nossos pecados este mal
  rationale: “Acrescentamos a” conserva a ideia cumulativa de יסף com עַל, enquanto “este mal” mantém a gravidade moral de רָעָה.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: pedir um rei para nós mesmos
  rationale: O infinitivo indica em que consistiu o mal, e “para nós mesmos” torna explícito o valor de לָנוּ.
theological_decisions:
- issue: Força relacional de אֱלֹהֶיךָ no apelo do povo
  choice: seu Deus
  alternative: nosso Deus
  rationale: A segunda pessoa deve ser mantida para preservar a tensão textual do povo recorrendo a Samuel como intercessor, sem sugerir nem negar além do que o texto afirma sobre sua relação pactual com Yahweh.
- issue: Avaliação do pedido de um rei
  choice: 'este mal: pedir um rei para nós mesmos'
  alternative: o mal de termos pedido um rei
  rationale: A formulação preserva a confissão explícita do povo e a relação explicativa entre “este mal” e o pedido de um rei, sem acrescentar uma harmonização teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “ore” como forma natural do imperativo e mantém “Yahweh” como nome próprio. Não há marcador de nota, pois a alternativa lexical “interceda” já é comunicada pela expressão “em favor de” e não exige nota para preservar o sentido.
