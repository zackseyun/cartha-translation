source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: pt
  text: 'Quando vocês viram que Naás, rei dos amonitas, vinha contra vocês, disseram-me: “Não, mas um rei reinará sobre nós”, embora o SENHOR, seu Deus, fosse o rei de vocês.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “embora o SENHOR, seu Deus, seja o rei de vocês”. A oração hebraica não tem verbo explícito; pelo contexto, pode-se suprir tanto o passado como o presente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: Quando vocês viram
  rationale: O waw consecutivo introduz a circunstância temporal que levou Israel a responder; a formulação é natural em português e mantém o sentido de percepção direta.
- source_word: כִּי
  choice: que
  rationale: Introduz aqui o conteúdo daquilo que os israelitas viram.
- source_word: נָחָשׁ
  choice: Naás
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: rei dos amonitas
  rationale: Expressão idiomática para a cadeia construta hebraica de sentido étnico-nacional.
- source_word: בָּא עֲלֵיכֶם
  choice: vinha contra vocês
  rationale: בוא com עַל, em contexto militar, indica avanço hostil; o imperfeito perifrástico comunica a ação em curso que motivou a exigência.
- source_word: וַתֹּאמְרוּ לִי
  choice: disseram-me
  rationale: Reproduz de maneira direta e digna a fala dirigida a Samuel.
- source_word: לֹא כִּי
  choice: Não!
  rationale: A construção expressa rejeição enfática seguida da alternativa exigida; a pontuação comunica naturalmente essa força em português sem acrescentar uma conjunção ausente da formulação resultante.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: Um rei reinará sobre nós
  rationale: Preserva a repetição enfática entre o substantivo e o verbo cognato, bem como a insistência do povo na monarquia.
- source_word: וַיהוָה
  choice: o SENHOR
  rationale: Segue a convenção reverente e amplamente reconhecida em Bíblias portuguesas para o tetragrama YHWH.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Mantém a designação pactual sem expansão interpretativa.
- source_word: מַלְכְּכֶם
  choice: fosse o rei de vocês
  rationale: A oração nominal hebraica não explicita tempo verbal. O pretérito imperfeito do subjuntivo ajusta-se à concessiva portuguesa e ao contexto narrativo passado, sem eliminar em nota a leitura presente.
theological_decisions:
- issue: Cópula implícita em וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: fosse o rei de vocês
  alternative: é o rei de vocês
  rationale: A oração nominal hebraica não marca explicitamente o tempo. O passado se harmoniza com a retrospectiva de Samuel sobre a exigência de um rei humano; a possibilidade de uma afirmação presente e contínua é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural e mantém a repetição enfática “rei reinará”. O marcador [a] aparece no texto principal e corresponde à nota.
