  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: pt
  text: 'Então Samuel disse ao povo: “Yahweh é quem designou Moisés e Arão[a] e quem fez subir os seus antepassados[b] da terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “fez Moisés e Arão”. Aqui, o verbo hebraico provavelmente se refere a Yahweh constituí-los ou estabelecê-los em suas funções.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seus pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Samuel disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade, e “disse” traduz diretamente אמר.
- source_word: אֶל הָעָם
  choice: ao povo
  rationale: Tradução direta e idiomática da preposição com o substantivo definido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: é quem designou Moisés e Arão
  rationale: A oração hebraica não tem cópula expressa; “é quem” identifica Yahweh como agente. Neste contexto, עשה indica que ele constituiu Moisés e Arão em suas funções; “designou” evita a impressão equivocada de que os criou como pessoas, enquanto a nota preserva o sentido mais literal.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: e quem fez subir
  rationale: Preserva o valor causativo do hifil de עלה e a imagem tradicional do êxodo como subida.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: os seus antepassados
  rationale: No contexto do êxodo, אבות se refere às gerações anteriores do povo. “Antepassados” comunica isso claramente, enquanto a nota registra o equivalente mais literal.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Reproduz de perto a formulação hebraica e mantém a referência geográfica completa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome pactual, por isso ele é transliterado sem ser substituído por um título.
- issue: Sentido de עָשָׂה em relação a Moisés e Arão
  choice: designou Moisés e Arão
  alternative: fez Moisés e Arão
  rationale: O contexto enfatiza a ação de Yahweh ao constituí-los como líderes, não sua criação como seres humanos. A alternativa formal permanece indicada em nota, pois o verbo hebraico é genuinamente amplo.
- issue: Referente de אֲבֹתֵיכֶם
  choice: seus antepassados
  alternative: seus pais
  rationale: A referência histórica é às gerações israelitas que saíram do Egito. “Antepassados” torna esse referente claro sem alterar a relação genealógica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “é quem” explicita naturalmente a identificação enfática da oração nominal hebraica; “fez subir” conserva a imagem do texto-fonte, ainda que seja ligeiramente mais formal.
