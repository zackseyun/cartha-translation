source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: pt
  text: 'Aqui estou. Testemunhem contra mim diante de Yahweh e diante do seu ungido: de quem tomei o boi? De quem tomei o jumento? A quem oprimi? A quem maltratei[a]? Da mão de quem aceitei suborno[b] para fechar os olhos por causa dele? Eu o restituirei a vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A quem esmaguei?” ou “A quem prejudiquei?” O verbo hebraico é difícil e parece indicar tratamento duro, abuso ou dano.'
    reason: lexical_alternative
  - marker: b
    text: A palavra também pode significar “resgate” ou “pagamento compensatório”; neste contexto, a referência a fechar os olhos favorece o sentido de um pagamento corrupto que perverte a justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Aqui estou
  rationale: Expressão natural de apresentação pública e disponibilidade, preservando a força direta do hebraico.
- source_word: עֲנוּ בִי
  choice: Testemunhem contra mim
  rationale: O cenário é público e forense; a expressão pede que o povo apresente testemunho contra Samuel.
- source_word: נֶגֶד
  choice: diante de
  rationale: Indica prestação pública de contas na presença de Yahweh e do rei.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְשִׁיחוֹ
  choice: seu ungido
  rationale: Neste contexto histórico, refere-se ao rei ungido por Yahweh; evita importar diretamente o título messiânico posterior.
- source_word: שׁוֹר
  choice: boi
  rationale: Equivalente corrente e preciso para o animal singular mencionado numa questão de propriedade.
- source_word: חֲמוֹר
  choice: jumento
  rationale: Termo claro, digno e amplamente compreensível em português para o animal de carga.
- source_word: לָקַחְתִּי
  choice: tomei
  rationale: Mantém a repetição verbal das perguntas retóricas e pode abranger apropriação indevida sem acrescentar essa conclusão ao verbo.
- source_word: עָשַׁקְתִּי
  choice: oprimi
  rationale: Conserva o sentido amplo de exploração ou opressão social e econômica.
- source_word: רַצּוֹתִי
  choice: maltratei
  rationale: O verbo é textualmente ou lexicalmente difícil; 'maltratei' comunica abuso severo sem impor a imagem física possivelmente excessiva de 'esmaguei'.
- source_word: כֹפֶר
  choice: suborno
  rationale: Embora possa significar resgate ou pagamento compensatório, o contexto de fechar os olhos favorece um pagamento corrupto que impede a justiça.
- source_word: אַעְלִים עֵינַי בּוֹ
  choice: para fechar os olhos por causa dele
  rationale: Preserva a metáfora dos olhos e explicita de modo natural que o pagamento levaria Samuel a ignorar a injustiça.
- source_word: וְאָשִׁיב לָכֶם
  choice: Eu o restituirei a vocês
  rationale: Mantém a promessa direta de devolver aquilo que pudesse ter sido tomado injustamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; 'Yahweh' o representa diretamente e o distingue de títulos.
- issue: Sentido de מְשִׁיחוֹ no contexto monárquico
  choice: seu ungido
  alternative: seu Messias
  rationale: O referente imediato é o rei historicamente ungido. 'Seu ungido' preserva a ligação lexical sem transformar o versículo numa referência messiânica direta.
- issue: Relação entre o pagamento e o ato de fechar os olhos
  choice: suborno ... para fechar os olhos por causa dele
  alternative: resgate ... e fechar os olhos com ele
  rationale: A formulação escolhida preserva a imagem hebraica e expressa a provável corrupção judicial, sem eliminar em nota a amplitude semântica de כֹפֶר.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira e compreensão internacional. As perguntas curtas preservam o caráter público e judicial da declaração. O marcador [a] foi colocado no verbo difícil correspondente, e não em “Aqui estou”.
