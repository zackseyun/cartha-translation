  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: pt
  text: E Yahweh enviou Jerubaal[a], Bedã[b], Jefté e Samuel; ele livrou vocês das mãos dos inimigos que os cercavam, e vocês viveram em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jerubaal é outro nome de Gideão (ver Juízes 6:32; 7:1).
    reason: cross_reference
  - marker: b
    text: O hebraico traz «Bedã». Sua identidade é incerta; alguns intérpretes entendem o nome como uma referência a Baraque ou, menos frequentemente, a Abdom.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como «Senhor» e preservando sua função no texto hebraico.
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente direto e natural de שׁלח neste contexto.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Mantém no texto principal o nome presente no hebraico; sua identificação com Gideão é esclarecida em nota.
- source_word: בְּדָן
  choice: Bedã
  rationale: Preserva a leitura do texto massorético sem emendá-la para Baraque ou Abdom.
- source_word: יִפְתָּח
  choice: Jefté
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma consagrada e corrente em português.
- source_word: וַיַּצֵּל
  choice: livrou
  rationale: Expressa naturalmente a libertação de perigo ou domínio indicada por נצל.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: das mãos dos inimigos
  rationale: Conserva a metáfora hebraica de mão como poder ou domínio, inteligível em português.
- source_word: מִסָּבִיב
  choice: que os cercavam
  rationale: Comunica de modo natural a ideia espacial de inimigos ao redor, sem sugerir uma categoria diferente de inimigos.
- source_word: וַתֵּשְׁבוּ
  choice: vocês viveram
  rationale: Neste contexto, ישׁב descreve a permanência do povo na terra, e «viveram» é claro e corrente.
- source_word: בֶּטַח
  choice: em segurança
  rationale: Expressa o estado de proteção e ausência de ameaça indicado pelo advérbio hebraico.
theological_decisions:
- issue: Identidade de בְּדָן
  choice: Manter «Bedã» no texto principal como o nome próprio do texto massorético.
  alternative: Baraque; menos frequentemente, Abdom.
  rationale: A evidência hebraica fornecida lê Bedã. Como a identidade permanece incerta, a tradução não harmoniza nem emenda silenciosamente o nome.
translation_notes:
  register: 'Português moderno, digno e acessível, com legibilidade brasileira. Emprega «vocês» para o plural de segunda pessoa e mantém os nomes próprios conforme o hebraico ou suas formas portuguesas reconhecidas. Os marcadores foram posicionados junto às informações que explicam: [a] após Samuel, encerrando a lista, e [b] após a referência aos inimigos ao redor.'
