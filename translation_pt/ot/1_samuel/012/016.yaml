  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: pt
  text: Agora, pois, fiquem firmes e vejam esta grande coisa que Yahweh[a] está fazendo diante dos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Agora, portanto
  rationale: A expressão funciona como marcador de transição para uma convocação solene. “Agora, portanto” conserva essa força em português natural.
- source_word: הִתְיַצְּבוּ
  choice: fiquem onde estão
  rationale: O imperativo hitpael de יצב chama o povo a manter sua posição, atento ao que será mostrado. A formulação evita sugerir apenas o ato físico de se levantar.
- source_word: וּרְאוּ
  choice: vejam
  rationale: O imperativo convida os ouvintes a presenciarem diretamente o sinal.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: esta grande coisa
  rationale: דבר tem sentido amplo, podendo indicar coisa, acontecimento ou feito. A tradução preserva essa amplitude sem definir antecipadamente a natureza do sinal.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: que Yahweh está fazendo
  rationale: O particípio עֹשֶׂה apresenta a ação de modo vívido, como iminente ou já em curso; o presente progressivo português reproduz bem essa perspectiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעֵינֵיכֶם
  choice: diante dos seus olhos
  rationale: Mantém a imagem concreta do hebraico e ressalta que o acontecimento será público e diretamente observável.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” preserva esse nome; a forma tradicional portuguesa é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A colocação do marcador [a] ao fim da frase liga a nota ao nome divino sem interromper a convocação.
