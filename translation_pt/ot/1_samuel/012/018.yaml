  text: וַ/יִּקְרָ֤א שְׁמוּאֵל֙ אֶל יְהוָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה קֹלֹ֥ת וּ/מָטָ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּירָ֨א כָל הָ/עָ֥ם מְאֹ֛ד אֶת יְהוָ֖ה וְ/אֶת שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: pt
  text: Então Samuel clamou a Yahweh, e Yahweh enviou trovões[a] e chuva naquele dia. E todo o povo temeu muito a Yahweh e a Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vozes” ou “sons”; neste contexto de tempestade, a palavra se refere a trovões.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: clamou a Yahweh
  rationale: קרא com אֶל־יְהוָה descreve um apelo dirigido a Deus, provavelmente em oração. “Clamou a” conserva a força e a direção do ato sem explicitar além do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּתֵּן
  choice: enviou
  rationale: Embora o sentido básico seja “deu”, “enviou” expressa naturalmente, neste contexto, que Yahweh fez ocorrer a tempestade.
- source_word: קֹלוֹת
  choice: trovões
  rationale: O plural de קוֹל significa literalmente “vozes” ou “sons”, mas, em contexto de tempestade e junto de “chuva”, refere-se idiomaticamente a trovões.
- source_word: וּמָטָר
  choice: e chuva
  rationale: Tradução direta de מָטָר, sem acrescentar uma intensidade que o substantivo não explicita.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Forma corrente em português que mantém a referência temporal específica.
- source_word: וַיִּירָא כָל־הָעָם מְאֹד
  choice: todo o povo temeu muito
  rationale: Mantém o sujeito coletivo, o sentido forte de ירא e a intensificação de מְאֹד em linguagem natural.
- source_word: אֶת־יְהוָה וְאֶת־שְׁמוּאֵל
  choice: a Yahweh e a Samuel
  rationale: Preserva ambos como objetos do mesmo verbo, sem explicar de modo diferente a natureza do temor em relação a cada um.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o caráter de nome pessoal sem substituí-lo por um título.
- issue: O povo teme tanto Yahweh quanto Samuel
  choice: temeu muito a Yahweh e a Samuel
  alternative: temeu a Yahweh e respeitou Samuel
  rationale: O hebraico emprega um único verbo para os dois objetos. A tradução conserva essa tensão e não impõe uma distinção interpretativa ausente da formulação original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação em duas frases evita um período excessivamente longo, e a repetição de “Yahweh” acompanha a ênfase do hebraico.
