  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: pt
  text: Agora, portanto, apresentem-se, e eu entrarei em juízo com vocês[a] diante de Yahweh, a respeito de todos os atos de justiça de Yahweh[b] que ele realizou em favor de vocês e de seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “julgarei vocês”, “argumentarei com vocês” ou “apresentarei minha causa a vocês”. O hebraico tem sentido forense, isto é, de entrar em uma causa diante de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: “Atos de justiça” são os feitos justos e fiéis à aliança que Yahweh realizou em favor de seu povo.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Expressa tanto a transição temporal quanto a conclusão retórica que introduz a convocação de Samuel.
- source_word: הִתְיַצְּבוּ
  choice: apresentem-se
  rationale: O imperativo plural convoca os ouvintes a tomar formalmente seu lugar; esta formulação é natural em português e preserva o tom solene do contexto judicial.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: e eu entrarei em juízo com vocês
  rationale: A construção tem sentido forense de instaurar ou conduzir uma causa, sem necessariamente significar que Samuel já esteja pronunciando condenação.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a expressão judicial e pactual de comparecer na presença divina, mantendo o nome próprio do texto hebraico.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: a respeito de todos os atos de justiça de Yahweh
  rationale: O plural designa feitos concretos que manifestam a justiça e a fidelidade pactual de Yahweh; evita restringir o sentido somente a atos de salvação.
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: que ele realizou em favor de vocês e de seus antepassados
  rationale: Explicita de modo idiomático que os feitos divinos beneficiaram tanto a geração presente quanto as gerações anteriores; 'antepassados' comunica naturalmente o sentido ancestral de אָבוֹת.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o tetragrama; 'Yahweh' preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Sentido de צִדְקוֹת יְהוָה
  choice: atos de justiça de Yahweh
  alternative: atos salvadores de Yahweh; feitos justos de Yahweh
  rationale: A expressão abrange os feitos históricos que demonstram a justiça e a fidelidade de Yahweh à aliança. A tradução escolhida mantém a ligação lexical com justiça sem reduzir seu alcance à salvação.
- issue: Força judicial de וְאִשָּׁפְטָה אִתְּכֶם
  choice: entrarei em juízo com vocês
  alternative: julgarei vocês; argumentarei com vocês; defenderei minha causa diante de vocês
  rationale: A formulação preserva a ambiguidade entre julgar, discutir uma causa e pleitear, sem pressupor antecipadamente uma sentença condenatória.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento plural por “vocês”. “Apresentem-se” e “entrar em juízo” preservam o cenário formal sem recorrer a linguagem jurídica excessivamente técnica. “Antepassados” é mais claro no português internacional contemporâneo do que o uso literal de “pais” em sentido genealógico.
