  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: pt
  text: Mas, se vocês continuarem praticando o mal[a], tanto vocês como o seu rei serão varridos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se vocês fizerem o mal” ou “se agirem perversamente”. O hebraico intensifica o verbo por meio de um infinitivo absoluto.
    reason: lexical_alternative
  - marker: b
    text: Ou “perecerão” ou “serão destruídos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção introduz uma condição em contraste com a promessa do contexto anterior; “Mas, se” expressa naturalmente essa força discursiva.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: vocês continuarem praticando o mal
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. Esta formulação natural comunica a ênfase, possivelmente persistente, sem reproduzir de modo artificial a repetição hebraica.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: tanto vocês como o seu rei
  rationale: A repetição de גַּם inclui enfaticamente as duas partes na advertência.
- source_word: תִּסָּפוּ
  choice: serão eliminados
  rationale: O nifal de ספה indica ser levado, eliminado, destruído ou perecer sob juízo. “Serão eliminados” preserva a voz passiva e não restringe a forma específica do juízo.
theological_decisions:
- issue: Natureza do juízo anunciado contra o povo e o rei
  choice: Advertência coletiva de juízo e remoção que alcança tanto o povo como o rei
  alternative: Derrota militar apenas ou ruína espiritual apenas
  rationale: O versículo não especifica o modo exato do juízo. A tradução mantém a advertência abrangente sem reduzi-la a uma única forma de punição.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural por “vocês”. A redação conserva a concisão e a gravidade da advertência hebraica.
