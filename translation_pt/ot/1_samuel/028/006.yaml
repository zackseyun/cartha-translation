base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: pt
  text: Saul consultou Yahweh, mas Yahweh não lhe respondeu, nem por sonhos, nem pelo Urim[a], nem pelos profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Urim era um meio sacerdotal de buscar orientação divina.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: consultou
  rationale: Com ב e o nome divino, שׁאל indica buscar orientação ou resposta divina, não apenas fazer uma pergunta; “consultou” expressa isso de modo natural e conciso.
- source_word: בַּיהוָה / יְהוָה
  choice: Yahweh
  rationale: Mantém como nome próprio o tetragrama presente duas vezes no texto; a preposição ב é traduzida idiomaticamente na construção portuguesa “consultou Yahweh”.
- source_word: וְלֹא עָנָהוּ
  choice: não lhe respondeu
  rationale: Reproduz diretamente a ausência de resposta à consulta de Saul.
- source_word: גַּם ... גַּם ... גַּם
  choice: nem ... nem ... nem
  rationale: Após a oração negativa, a correlação “nem... nem... nem” comunica naturalmente que nenhum dos três meios produziu resposta.
- source_word: בַּחֲלֹמוֹת
  choice: por sonhos
  rationale: A preposição ב apresenta os sonhos como meio pelo qual uma resposta poderia ser dada.
- source_word: בָּאוּרִים
  choice: pelo Urim
  rationale: Preserva por transliteração o termo técnico referente ao meio sacerdotal de consulta, sem lhe impor uma tradução etimológica incerta.
- source_word: בַּנְּבִיאִם
  choice: pelos profetas
  rationale: Apresenta os profetas como agentes por meio dos quais poderia vir a resposta, mantendo o paralelismo da enumeração.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico emprega diretamente o tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Motivo de Yahweh não responder a Saul
  choice: Não explicitar o motivo
  alternative: Acrescentar que Deus rejeitou Saul ou explicar por que se calou
  rationale: O versículo afirma apenas que não houve resposta por nenhum dos meios enumerados; a tradução preserva essa tensão sem introduzir uma explicação externa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Consultou” evita a impressão de uma pergunta comum; a sequência “nem... nem... nem” conserva a força distributiva do hebraico. O marcador [a] aparece no texto junto à enumeração à qual a nota cultural se refere.
