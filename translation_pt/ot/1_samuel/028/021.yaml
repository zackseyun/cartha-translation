  - severity: medium
    issue: “Tomado de grande pavor” estreita o sentido de נִבְהַל.
    rationale: Embora o contexto comporte medo intenso, o verbo também pode indicar perturbação, alarme ou abalo. “Muito perturbado” preserva melhor a amplitude lexical sem diminuir a intensidade de מְאֹד.
