base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: pt
  text: 'A mulher foi até Saul e, ao ver que ele estava muito perturbado, disse-lhe: “Veja, a sua serva obedeceu ao que você disse[a]. Arrisquei a minha vida[b] e dei ouvidos às palavras que você me disse.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “a sua serva ouviu a sua voz”. A expressão significa atender ou obedecer ao que alguém diz.'
    reason: lexical_alternative
  - marker: b
    text: 'Em hebraico, literalmente: “pus a minha vida na palma da minha mão”, expressão que significa expor ou arriscar a própria vida.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּבֹא הָאִשָּׁה אֶל שָׁאוּל
  choice: A mulher aproximou-se de Saul
  rationale: O verbo faz a narrativa avançar e descreve o movimento da mulher em direção a Saul. “Aproximou-se” é natural em português e não acrescenta ao versículo a identificação contextual da mulher como médium.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: ao ver que ele estava tomado de grande pavor
  rationale: נבהל pode indicar perturbação, alarme ou terror, e מְאֹד intensifica o estado. A formulação comunica forte medo em português natural, sem reduzir a expressão a mero desconforto.
- source_word: הִנֵּה
  choice: Veja
  rationale: Funciona como marcador discursivo que chama a atenção de Saul para o apelo da mulher. “Veja” preserva essa força em linguagem moderna, sem o tom arcaizante de “eis”.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: a sua serva obedeceu à sua voz
  rationale: שִׁפְחָה marca a autodesignação feminina e deferente da mulher. A construção שׁמע בְּקוֹל significa atender ou obedecer; a versão mantém a imagem hebraica da “voz”, esclarecida em nota.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: Arrisquei a minha vida
  rationale: O idioma hebraico, literalmente “pus a minha vida na palma da minha mão”, significa expor a própria vida ao perigo. A tradução idiomática evita que a imagem seja entendida em português como assumir controle sobre a própria vida; a forma literal fica registrada em nota.
- source_word: וָאֶשְׁמַע אֶת דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: e dei ouvidos às palavras que você me disse
  rationale: “Dar ouvidos” expressa escuta receptiva e consequente, preservando a distinção formal em relação à construção anterior com בְקוֹל. “Que você me disse” verte naturalmente a oração relativa.
