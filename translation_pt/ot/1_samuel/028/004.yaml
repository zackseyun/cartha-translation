base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: pt
  text: Os filisteus se reuniram, vieram e acamparam em Suném. Saul reuniu todo o Israel, e eles acamparam em Gilboa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Em Gilboa” também pode ser traduzido como “no monte Gilboa”, pois o nome se refere à região montanhosa de Gilboa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: se reuniram
  rationale: O verbo קבץ indica reunir-se ou ajuntar-se; a forma reflexiva natural em português preserva aqui o sentido de concentração das forças sem explicitar além do hebraico a ideia de convocação militar.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional e amplamente compreendida em português para esse povo.
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: Mantém o sentido básico e a progressão narrativa do verbo בוא, sem acrescentar a noção interpretativa de avanço militar.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: Tradução atual e direta de חנה no contexto de tropas que estabelecem acampamento.
- source_word: בְשׁוּנֵם
  choice: em Suném
  rationale: A preposição בְּ com o topônimo indica o lugar do acampamento; 'em Suném' é natural em português.
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: Preserva a correspondência lexical com קבץ na primeira oração e não intensifica o verbo para 'convocou' ou 'mobilizou'.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Conserva a expressão coletiva do hebraico sem restringi-la explicitamente aos homens ou soldados.
- source_word: וַיַּחֲנוּ
  choice: eles acamparam
  rationale: O pronome explícito esclarece em português que o sujeito plural são as forças de Israel reunidas por Saul.
- source_word: בַּגִּלְבֹּעַ
  choice: em Gilboa
  rationale: Mantém o topônimo como aparece no hebraico, sem acrescentar 'monte'; a ambiguidade topográfica é registrada em nota.
