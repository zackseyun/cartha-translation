  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: pt
  text: E Javé entregará também Israel, junto com você, nas mãos dos filisteus; amanhã você e seus filhos estarão comigo.[a] Javé entregará também o acampamento de Israel nas mãos dos filisteus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comigo na morte” ou “comigo no Sheol”. O hebraico diz simplesmente “comigo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o exército de Israel”. O termo hebraico pode significar “acampamento” ou, neste contexto, “exército”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino YHWH, preservando o nome próprio em vez de substituí-lo por um título.
- source_word: וְיִתֵּן / יִתֵּן
  choice: entregará
  rationale: Com בְּיַד, o verbo נתן expressa a entrega ao poder de alguém. “Entregará ... nas mãos” comunica naturalmente em português o sentido hostil da expressão.
- source_word: גַּם
  choice: também
  rationale: 'Conserva a força cumulativa presente nas duas ocorrências: Israel e seu acampamento compartilharão o destino anunciado a Saul.'
- source_word: עִמְּךָ
  choice: junto com você
  rationale: Explicita de modo natural que Israel será entregue juntamente com Saul, sem acrescentar conteúdo ausente do hebraico.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: nas mãos dos filisteus
  rationale: Preserva a imagem hebraica da mão como poder ou domínio e continua sendo uma expressão clara em português.
- source_word: וּמָחָר
  choice: amanhã
  rationale: Mantém a indicação temporal enfática; o ponto e vírgula reproduz em português a progressão solene sem exigir a repetição pouco natural de “e”.
- source_word: וּבָנֶיךָ
  choice: e seus filhos
  rationale: בָּנִים designa especificamente os filhos homens de Saul neste contexto.
- source_word: עִמִּי
  choice: comigo
  rationale: Mantém a formulação breve e ambígua do hebraico, sem especificar morte, sepultura ou Sheol.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: o acampamento de Israel
  rationale: “Acampamento” é o sentido concreto e lexicalmente direto de מַחֲנֶה; no contexto militar, o termo também pode referir-se ao exército reunido.
theological_decisions:
- issue: Sentido de “amanhã você e seus filhos estarão comigo”
  choice: Manter apenas “comigo” no texto principal.
  alternative: “comigo na morte”, “comigo no Sheol” ou “onde eu estou”.
  rationale: A fala implica que Saul e seus filhos se juntarão a Samuel após morrerem, mas o hebraico não define explicitamente o lugar nem a condição deles. A tradução preserva essa concisão e tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” corresponde ao singular dirigido a Saul. A construção “nas mãos dos filisteus” conserva a imagem do original sem soar excessivamente arcaica. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
