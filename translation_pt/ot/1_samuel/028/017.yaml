  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: pt
  text: 'E Yahweh fez para si mesmo[a] exatamente como havia falado por meu intermédio[b]: Yahweh arrancou o reino da sua mão e o deu ao seu próximo, a Davi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “fez para ele” ou “fez para si mesmo”. Muitas traduções trazem “fez a você” ou “fez por você”, aplicando a frase a Saul; o Texto Massorético, porém, diz “para ele/para si mesmo”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “pela minha mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor” e seguindo a forma adotada pelo projeto.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: fez para si mesmo
  rationale: Preserva diretamente o Texto Massorético לוֹ, “para ele/para si mesmo”, sem emendá-lo para לְךָ, “para você”, apesar da dificuldade contextual.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: exatamente como havia falado por meu intermédio
  rationale: בְּיַדִי exprime aqui a agência profética. “Por meu intermédio” comunica naturalmente o sentido em português; a nota registra a imagem hebraica literal.
- source_word: וַיִּקְרַע
  choice: arrancou
  rationale: Conserva a força da metáfora de rasgar ou retirar violentamente, em português natural no contexto da perda do reino.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: É a forma corrente e clara para o domínio real retirado de Saul.
- source_word: מִיָּדֶךָ
  choice: da sua mão
  rationale: Mantém a imagem hebraica da mão como posse e controle.
- source_word: וַיִּתְּנָהּ
  choice: e o deu
  rationale: O pronome retoma “o reino”; o passado simples coordena naturalmente as ações narradas.
- source_word: לְרֵעֲךָ
  choice: ao seu próximo
  rationale: רֵעַ pode indicar próximo, companheiro ou semelhante. “Próximo” mantém a amplitude lexical, e a aposição identifica Davi.
- source_word: לְדָוִד
  choice: a Davi
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
theological_decisions:
- issue: Leitura massorética לוֹ na primeira oração
  choice: Traduzir “fez para si mesmo”.
  alternative: “fez a você” ou “fez por você”
  rationale: O texto hebraico fornecido traz לוֹ, não לְךָ. A tradução preserva essa leitura e sua tensão contextual, explicando em nota a alternativa adotada por muitas versões.
- issue: Agência profética em בְיָדִי
  choice: Traduzir “por meu intermédio”.
  alternative: “pela minha mão”
  rationale: A expressão idiomática indica que Samuel foi o mediador da palavra divina. A redação principal é natural em português, enquanto a nota conserva a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a estranheza genuína da primeira oração hebraica, mas verte o idioma de mediação profética de modo natural. Todos os marcadores de nota aparecem junto às expressões correspondentes.
