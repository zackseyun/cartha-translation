base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: pt
  text: 'Mas a mulher lhe disse: “Veja, você mesmo sabe o que Saul fez: baniu do país os médiuns e os que consultam espíritos.[a] Então, por que você está armando uma cilada contra a minha vida, para me matar?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que têm espíritos familiares e os adivinhos”.'
    reason: Alternativa lexical para הָאֹבוֹת e הַיִּדְּעֹנִי, preservando uma formulação mais literal e tradicional.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Mas ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Mas” expressa naturalmente a resposta cautelosa e contrária da mulher ao pedido.
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz um apelo enfático à atenção em português atual, sem o tom arcaico de “Eis”.
- source_word: אַתָּה יָדַעְתָּ
  choice: você mesmo sabe
  rationale: O pronome explícito enfatiza o sujeito, valor preservado por “você mesmo”.
- source_word: הִכְרִית
  choice: eliminou
  rationale: Expressa a remoção rigorosa desses praticantes do país; em português, é mais natural neste contexto do que reproduzir literalmente a imagem de “cortar”.
- source_word: הָאֹבוֹת
  choice: os médiuns
  rationale: No contexto, designa pessoas associadas à consulta dos mortos ou de espíritos; “médiuns” é uma equivalência moderna, clara e sem definir como a prática funcionava.
- source_word: הַיִּדְּעֹנִי
  choice: os que consultam espíritos
  rationale: Torna compreensível a referência a praticantes ocultistas ligados à obtenção de conhecimento por meio de espíritos, evitando associações fantasiosas de “feiticeiros”.
- source_word: מִן הָאָרֶץ
  choice: do país
  rationale: Aqui הָאָרֶץ se refere ao território sob o governo de Saul; “do país” comunica esse sentido com naturalidade.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: está armando uma cilada contra a minha vida
  rationale: Preserva a metáfora da armadilha e apresenta a vida da mulher como alvo da ação.
- source_word: לַהֲמִיתֵנִי
  choice: para me matar
  rationale: Reproduz diretamente a finalidade expressa pelo infinitivo hebraico.
theological_decisions:
- issue: Tradução dos termos ligados a práticas ocultistas sem suavizá-los nem importar folclore posterior
  choice: os médiuns e os que consultam espíritos
  alternative: os que têm espíritos familiares e os adivinhos
  rationale: A formulação identifica de modo acessível os praticantes proibidos e removidos por Saul, sem afirmar uma teoria específica sobre a realidade ou o funcionamento dessas práticas. A alternativa mais literal/tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Veja” e “você mesmo sabe” preservam a força discursiva; “armando uma cilada” mantém a metáfora hebraica sem soar arcaico.
