base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: pt
  text: 'Naqueles dias, os filisteus reuniram seus acampamentos para a guerra, a fim de lutar contra Israel. Aquis disse a Davi: “Saiba com certeza que você e seus homens sairão comigo junto ao exército.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no acampamento”. A palavra hebraica pode indicar tanto o próprio acampamento como, por extensão, a força militar nele reunida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: A fórmula narrativa introduz a nova cena; a expressão é direta e natural em português, sem acrescentar um marcador temporal ausente do hebraico.
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם
  choice: os filisteus reuniram seus acampamentos
  rationale: Mantém o sentido concreto e plural de מַחֲנֶה, embora no contexto os acampamentos representem as forças neles reunidas.
- source_word: לַצָּבָא לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: para a guerra, a fim de lutar contra Israel
  rationale: Expressa com clareza tanto a finalidade militar como a ação hostil dirigida contra Israel.
- source_word: יָדֹעַ תֵּדַע
  choice: Saiba com certeza
  rationale: A construção com infinitivo absoluto intensifica o verbo; esta formulação preserva a ênfase e também acomoda o valor pragmático de uma declaração exigente.
- source_word: אִתִּי תֵּצֵא
  choice: sairão comigo
  rationale: O futuro preserva a forma verbal hebraica e, no contexto da fala de Aquis, comunica uma expectativa firme sem converter explicitamente a frase em uma ordem modal.
- source_word: בַמַּחֲנֶה
  choice: junto ao exército
  rationale: Neste contexto militar, מַחֲנֶה pode designar o contingente ou força em campanha; 'junto ao exército' é natural em português e evita sugerir apenas permanência física dentro de um acampamento.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: você e seus homens
  rationale: Preserva a menção enfática de Davi pessoalmente e de seus seguidores, em linguagem moderna e amplamente compreensível.
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Adota a forma portuguesa tradicional e reconhecível do nome.
