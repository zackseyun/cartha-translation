    reason: lexical_alternative
  revision_rationale: A revisão substitui "expulsado" por "removido", solução que corresponde de maneira mais direta e menos restritiva ao verbo hebraico. Também explicita naturalmente "por ele" no lamento e reduz "sua própria cidade" a "sua cidade", pois o sufixo hebraico marca posse, sem exigir a ênfase adicional de "própria".
