base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: pt
  text: Samuel já havia morrido, e todo o Israel havia pranteado por ele e o sepultado em Ramá, sua cidade. Saul havia removido da terra os médiuns e os que consultavam espíritos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os necromantes e os adivinhos”. Os termos hebraicos designam praticantes de consulta aos espíritos, mas sua distinção exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: já havia morrido
  rationale: O mais-que-perfeito situa a morte de Samuel como circunstância anterior à narrativa seguinte; “já” torna essa relação temporal clara e natural em português.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: o tinha pranteado
  rationale: ספד indica luto público, especialmente funerário. “Pranteado” conserva essa nuance com dignidade e concisão.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva nacional do hebraico, corrente no registro bíblico em português.
- source_word: וַיִּקְבְּרֻהוּ
  choice: sepultado
  rationale: Tradução direta de קבר; compartilha naturalmente o auxiliar de “tinha pranteado”.
- source_word: בָרָמָה
  choice: em Ramá
  rationale: Transliteração portuguesa tradicional e clara do topônimo.
- source_word: וּבְעִירוֹ
  choice: sua própria cidade
  rationale: Entende a expressão como aposição a Ramá e explicita idiomaticamente a posse, sem repetir de modo rígido a conjunção.
- source_word: הֵסִיר
  choice: havia expulsado
  rationale: O mais-que-perfeito apresenta outra circunstância anterior. “Expulsado” expressa a retirada dessas pessoas do território, sem especificar um método além do texto.
- source_word: הָאֹבוֹת
  choice: os médiuns
  rationale: אוֹב, neste uso plural pessoal, designa praticantes ligados à consulta dos mortos; “médiuns” é claro no português atual.
- source_word: הַיִּדְּעֹנִים
  choice: os que consultavam espíritos
  rationale: A perífrase comunica a função desses praticantes sem recorrer a “feiticeiros”, termo amplo e carregado de associações posteriores.
- source_word: מֵהָאָרֶץ
  choice: da terra
  rationale: Tradução direta que preserva a linguagem territorial e nacional do contexto.
theological_decisions:
- issue: Designação dos praticantes ocultistas sem impor categorias folclóricas posteriores
  choice: os médiuns e os que consultavam espíritos
  alternative: os necromantes e os adivinhos; os que tinham espíritos familiares e os feiticeiros
  rationale: Os dois termos hebraicos estão associados a práticas proibidas de consulta sobrenatural, mas sua taxonomia exata permanece incerta. A tradução comunica a distinção básica sem introduzir imagens modernas de fantasia nem afirmar mais do que o texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os mais-que-perfeitos compostos marcam o caráter retrospectivo do versículo. Evitou-se uma conjunção inicial sem equivalente temporal explícito no hebraico.
