  naturalness: “Quem devo fazer subir para você?” e “Faça Samuel subir para mim” são compreensíveis e conservam bem a imagem hebraica. Contudo, a pontuação da nota deve ficar imediatamente após a expressão a que se refere, e o ponto final deve ficar dentro das aspas na convenção editorial adotada.
  terminology: “Fazer subir” é uma solução adequada, não doutrinária e lexicalmente consistente para ambas as ocorrências de עלה. A alternativa “evocar” deve ser apresentada como alternativa idiomática, sem substituir o sentido principal. “Consulta aos mortos” descreve o contexto de modo suficiente e sóbrio.
