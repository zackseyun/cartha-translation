base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: pt
  text: 'Então a mulher perguntou: “Quem devo fazer subir[a] para você?” Ele disse: “Faça Samuel subir para mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “evocar”. O verbo hebraico significa literalmente “fazer subir” ou “trazer para cima”, conforme o modo de falar empregado neste contexto de consulta aos mortos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então a mulher perguntou
  rationale: O wayyiqtol faz a narrativa avançar; “então” expressa a sequência com naturalidade. Como a fala é interrogativa, “perguntou” é a forma idiomática de traduzir אמר neste contexto.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: No contexto, refere-se à médium de En-Dor; “a mulher” é a tradução direta e apropriada de אִשָּׁה.
- source_word: אֶת מִי
  choice: Quem
  rationale: אֶת marca o interrogativo como objeto direto. Em português, “quem” desempenha naturalmente essa função sem forma oblíqua distinta.
- source_word: אַעֲלֶה
  choice: devo fazer subir
  rationale: O hifil de עלה tem sentido causativo, “fazer subir”. A formulação preserva a imagem espacial do hebraico e evita explicar além do texto os mecanismos do episódio.
- source_word: לָךְ
  choice: para você
  rationale: 'A preposição ל tem aqui valor benefactivo: a ação seria realizada em favor de Saul. “Você” oferece legibilidade ampla no português moderno.'
- source_word: וַיֹּאמֶר
  choice: Ele respondeu
  rationale: Embora o hebraico diga literalmente “e ele disse”, “respondeu” representa naturalmente a função da fala no diálogo, sem alterar seu conteúdo.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: A marca de objeto אֶת não é traduzida, e o nome שְׁמוּאֵל recebe sua forma portuguesa consagrada, “Samuel”.
- source_word: הַעֲלִי
  choice: Faça Samuel subir
  rationale: O imperativo hifil feminino singular de עלה é dirigido à mulher. “Faça ... subir” conserva tanto a força causativa como a imagem presente na pergunta anterior.
- source_word: לִי
  choice: para mim
  rationale: 'Como em לָךְ, a preposição ל é entendida em sentido benefactivo: Saul pede que a ação seja feita em seu favor.'
theological_decisions:
- issue: Sentido da expressão necromântica construída com עלה
  choice: fazer subir
  alternative: evocar; trazer à tona
  rationale: O hebraico emprega o verbo comum “subir” em forma causativa. A tradução mantém esse modo de falar e não define a natureza ou o mecanismo do acontecimento, preservando a tensão teológica do relato.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “subir” preserva deliberadamente a correspondência lexical e a imagem do hebraico; “fazer subir” soa menos convencional que “evocar”, mas evita interpretação excessiva.
