base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: pt
  text: 'Davi disse a Aquis: “Então você mesmo saberá o que o seu servo é capaz de fazer[a].” Aquis respondeu a Davi: “Muito bem, farei de você meu guarda pessoal[b] por toda a sua vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que o seu servo fará”. As palavras de Davi são deliberadamente ambíguas.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “guarda para a minha cabeça”, isto é, um guarda pessoal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Então
  rationale: Na fala de Davi, introduz a consequência do que Aquis declarou no versículo anterior; “Então” é natural e mantém a progressão do discurso.
- source_word: אַתָּה תֵדַע
  choice: você mesmo saberá
  rationale: O pronome explícito אַתָּה dá ênfase ao sujeito; “você mesmo” reproduz essa ênfase de modo claro.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: o que ... é capaz de fazer
  rationale: Embora a forma verbal possa ser traduzida literalmente por “fará”, no contexto a declaração de Davi permanece intencionalmente ambígua quanto à ação concreta e pode funcionar como afirmação de capacidade.
- source_word: עַבְדֶּךָ
  choice: seu servo
  rationale: É uma forma convencional e deferente de Davi referir-se a si mesmo perante um governante, não necessariamente uma indicação de escravidão.
- source_word: לָכֵן
  choice: Muito bem
  rationale: Na resposta de Aquis, o termo expressa aceitação e conclusão prática; “Muito bem” comunica naturalmente essa função.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: meu guarda pessoal
  rationale: A expressão significa literalmente “guardião para a minha cabeça” e designa alguém encarregado de proteger pessoalmente o rei; “guarda pessoal” transmite o sentido sem conservar um idiomatismo opaco.
- source_word: אֲשִׂימְךָ
  choice: farei de você
  rationale: שׂים pode significar pôr, estabelecer ou nomear; aqui se refere à atribuição de uma função.
- source_word: כָּל הַיָּמִים
  choice: por toda a vida
  rationale: A expressão hebraica, literalmente “todos os dias”, indica duração permanente; em português, “por toda a vida” é idiomático e adequado ao contexto.
theological_decisions:
- issue: Ambiguidade da declaração de Davi
  choice: Manter no texto a ideia de capacidade, com nota indicando a tradução literal futura
  alternative: “o que o seu servo fará”
  rationale: O contexto narrativo permite que Aquis entenda as palavras como promessa de serviço militar, enquanto Davi não especifica contra quem agirá. A formulação e a nota preservam essa tensão sem atribuir a Davi uma intenção não expressa.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “você” apropriado à ampla legibilidade brasileira. “Guarda pessoal” evita o anglicismo potencial de “guarda-costas” e comunica claramente a função. A segunda nota foi colocada após a expressão temporal para não interromper o complemento nominal, embora explique “guarda pessoal”.
