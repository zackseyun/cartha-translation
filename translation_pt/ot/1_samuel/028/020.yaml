base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: pt
  text: Saul caiu imediatamente no chão, estendido de corpo inteiro, e ficou com muito medo por causa das palavras de Samuel. Ele também estava sem forças, pois não tinha comido pão[a] durante todo aquele dia e toda aquela noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “pão” também pode referir-se de modo mais amplo a alimento; a tradução mantém “pão” para refletir a formulação do texto-fonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: imediatamente
  rationale: Embora o verbo denote agir com rapidez, aqui funciona naturalmente para apresentar o caráter súbito da queda de Saul, sem sugerir uma ação deliberada.
- source_word: וַיִּפֹּל
  choice: caiu
  rationale: Preserva o sentido básico e direto do verbo hebraico, sem tornar explícita a interpretação contextual de que Saul desabou.
- source_word: מְלֹא קוֹמָתוֹ
  choice: estendido de corpo inteiro
  rationale: Expressa idiomaticamente que Saul ficou no chão em toda a extensão do corpo, e não que apenas tropeçou ou caiu de joelhos.
- source_word: אַרְצָה
  choice: no chão
  rationale: A forma direcional de 'terra' é vertida pela expressão portuguesa natural para este contexto narrativo.
- source_word: וַיִּרָא מְאֹד
  choice: ficou com muito medo
  rationale: Comunica com clareza a intensidade do medo e o desenvolvimento narrativo do estado de Saul.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: por causa das palavras de Samuel
  rationale: A preposição tem valor causal no contexto; a formulação conserva a referência explícita às palavras de Samuel.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: Ele também estava sem forças
  rationale: Formulação portuguesa natural que preserva tanto a adição marcada por גַּם quanto a afirmação de que não havia força nele, sem acrescentar 'restava'.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão de Saul estar sem forças.
- source_word: לֹא אָכַל לֶחֶם
  choice: não tinha comido pão
  rationale: Mantém o termo concreto 'pão' do hebraico, embora ele também possa designar alimento de modo mais amplo.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: durante todo aquele dia e toda aquela noite
  rationale: Preserva a totalidade temporal e explicita de modo natural que se trata do dia e da noite específicos da narrativa.
