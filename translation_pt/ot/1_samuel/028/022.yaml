source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: pt
  text: Agora, por favor, escute também o que diz a sua serva[a]. Deixe-me pôr diante de você um pedaço de pão[b]. Coma, para que você tenha forças, pois você precisa seguir viagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “escute a voz da sua serva”. Trata-se de uma expressão hebraica que significa atender ao que alguém diz. O termo hebraico traduzido por “serva” é especificamente feminino.
    reason: lexical_alternative
  - marker: b
    text: Ou “um bocado de pão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição para um apelo urgente; em português, “Agora” comunica naturalmente a força temporal e discursiva.
- source_word: שְׁמַע נָא
  choice: por favor, escute
  rationale: O imperativo com נָא é um pedido cortês e insistente; “por favor” preserva essa nuance.
- source_word: גַם אַתָּה
  choice: também
  rationale: 'Conserva a reciprocidade enfática: Saul, por sua vez, deve atender ao pedido dela.'
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: o que diz a sua serva
  rationale: Expressa em português natural o idioma hebraico “escutar a voz de”, isto é, atender ao que alguém diz, preservando o gênero feminino de שִׁפְחָה.
- source_word: וְאָשִׂימָה לְפָנֶיךָ
  choice: Deixe-me pôr diante de você
  rationale: O coortativo de primeira pessoa apresenta uma oferta ou pedido; “Deixe-me” reproduz sua força volitiva.
- source_word: פַּת לֶחֶם
  choice: um pedaço de pão
  rationale: פַּת designa um pedaço ou bocado; esta formulação é clara e corrente.
- source_word: וֶאֱכֹל
  choice: Coma
  rationale: Mantém o imperativo direto; a ausência de “e” torna a sequência natural em português sem alterar o sentido.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: para que recupere as forças
  rationale: Verte naturalmente a cláusula de resultado ou propósito. No contexto, trata-se de obter força física para partir.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: pois você precisa seguir viagem
  rationale: כִּי introduz a razão, e o imperfeito aponta para a partida iminente. “Seguir viagem” comunica naturalmente o idioma hebraico sem especificar destino.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção idiomática “escute o que diz” evita um literalismo pouco natural, enquanto a nota preserva a forma hebraica. “Recupere as forças” explicita de modo idiomático o resultado físico pretendido, e “seguir viagem” conserva a referência à partida iminente.
