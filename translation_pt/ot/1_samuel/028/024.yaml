  text: וְ/לָ/אִשָּׁ֤ה עֵֽגֶל מַרְבֵּק֙ בַּ/בַּ֔יִת וַ/תְּמַהֵ֖ר וַ/תִּזְבָּחֵ֑/הוּ וַ/תִּקַּח קֶ֣מַח וַ/תָּ֔לָשׁ וַ/תֹּפֵ֖/הוּ מַצּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: pt
  text: A mulher tinha em casa um bezerro cevado[a]. Ela se apressou, abateu-o[b], pegou farinha, amassou-a e assou pães sem fermento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bezerro engordado no curral”; tradicionalmente, “bezerro gordo”.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser usado para o abate sacrificial em certos contextos, mas aqui se refere ao abate do animal para uma refeição.
    reason: lexical_alternative
  - marker: c
    text: Ou “bolos sem fermento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: bezerro cevado
  rationale: עֵגֶל designa um bovino jovem, e מַרְבֵּק indica que era engordado, provavelmente no curral. “Bezerro cevado” é uma expressão clara e consagrada em português.
- source_word: בַּבַּיִת
  choice: em casa
  rationale: Preserva o sentido locativo concreto da expressão hebraica de modo natural em português.
- source_word: וַתְּמַהֵר
  choice: se apressou
  rationale: Expressa diretamente a rapidez e a urgência indicadas pelo verbo.
- source_word: וַתִּזְבָּחֵהוּ
  choice: abateu-o
  rationale: Neste contexto, o verbo descreve o abate do animal para preparar uma refeição, sem exigir a ideia de sacrifício cultual.
- source_word: קֶמַח
  choice: farinha
  rationale: É o equivalente comum e preciso para a farinha empregada no preparo do pão.
- source_word: וַתָּלָשׁ
  choice: amassou-a
  rationale: O verbo se refere a amassar a farinha ou massa; o pronome retoma naturalmente “farinha” em português.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: assou pães sem fermento
  rationale: Comunica com naturalidade tanto a ação de assar quanto o produto, מַצּוֹת, isto é, pães não fermentados.
theological_decisions:
- issue: Possível sentido sacrificial de זבח
  choice: abateu-o
  alternative: sacrificou-o
  rationale: Embora זבח possa indicar abate sacrificial em outros contextos, aqui a sequência narrativa trata da preparação de uma refeição. A tradução não introduz uma ação cultual ausente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação hebraica foi dividida em duas frases para fluidez narrativa, sem acrescentar marcador temporal inexistente no texto-fonte.
