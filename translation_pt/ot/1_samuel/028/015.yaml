  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: pt
  text: 'Então Samuel disse a Saul: “Por que você me perturbou, fazendo-me subir?” Saul respondeu: “Estou muito angustiado. Os filisteus estão lutando contra mim, e Deus se afastou de mim e já não me responde, nem por meio dos profetas[a] nem por sonhos. Por isso chamei você, para que me diga o que devo fazer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão dos profetas”, expressão que significa “por meio dos profetas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: você me perturbou
  rationale: O verbo רגז no hifil expressa causar inquietação, agitação ou perturbação. “Perturbou” é natural em português e não especifica além do texto a natureza da experiência.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: fazendo-me subir
  rationale: Preserva a imagem espacial explícita de עלה no contexto da evocação, sem usar “ressuscitar”, que acrescentaria uma associação teológica não exigida pelo hebraico.
- source_word: צַר לִי מְאֹד
  choice: Estou muito angustiado
  rationale: Expressa de modo idiomático a intensa aflição e pressão pessoal comunicada pela construção hebraica.
- source_word: נִלְחָמִים בִּי
  choice: estão lutando contra mim
  rationale: Mantém tanto o sentido militar de לחם quanto a direção hostil indicada pela preposição.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: Deus se afastou de mim
  rationale: Traduz סור מעל como afastamento ou retirada, sem ampliar a afirmação para uma ausência metafísica.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: e já não me responde
  rationale: “Já não” comunica naturalmente a cessação indicada por עוד, enquanto o presente retrata a situação contínua de Saul.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: nem por meio dos profetas nem por sonhos
  rationale: A correlação “nem... nem...” se ajusta à oração negativa e ביד é explicitada como expressão de agência, “por meio de”. O artigo de הַנְּבִיאִים é preservado em “dos profetas”.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: Por isso chamei você
  rationale: קרא com ל pode significar chamar ou convocar. “Chamei você” é claro no contexto e evita inserir terminologia técnica de necromancia ausente desta frase.
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: para que me diga o que devo fazer
  rationale: O hifil de ידע significa tornar conhecido; “diga” comunica isso com naturalidade, e “o que devo fazer” expressa a busca de orientação presente na pergunta hebraica.
theological_decisions:
- issue: Identidade de Samuel na narrativa de necromancia
  choice: Apresentar diretamente Samuel falando com Saul, como faz o narrador hebraico.
  alternative: Acrescentar qualificações como “suposto Samuel”, “aparição” ou “espírito que se fazia passar por Samuel”.
  rationale: O versículo afirma simplesmente que Samuel falou com Saul. A tradução deve preservar essa apresentação narrativa sem resolver debates teológicos mais amplos mediante acréscimos interpretativos.
- issue: Imagem de Samuel sendo trazido para cima
  choice: Preservar a linguagem espacial com “fazendo-me subir”.
  alternative: Traduzir como “ressuscitando-me” ou eliminar a imagem com “invocando-me”.
  rationale: O hebraico usa עלה, “subir/fazer subir”. Manter a imagem conserva a cosmologia narrativa sem identificar o acontecimento como ressurreição nem substituí-lo por uma explicação técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento “você” favorece naturalidade contemporânea; “fazendo-me subir” conserva a imagem concreta do hebraico. A única nota esclarece um idioma hebraico sem sobrecarregar o texto principal.
