base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: pt
  text: 'Mas ele recusou e disse: “Não vou comer”. Contudo, seus servos e também a mulher insistiram com ele, e ele lhes deu ouvidos. Então se levantou do chão e sentou-se na cama.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no divã” ou “no leito”; o termo hebraico pode designar uma cama ou um móvel usado para sentar-se e reclinar-se.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: ele recusou
  rationale: Expressa diretamente a recusa de Saul, com naturalidade no fluxo narrativo.
- source_word: לֹא אֹכַל
  choice: Não vou comer
  rationale: Reproduz a recusa em discurso direto sem acrescentar um objeto ausente no hebraico.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: insistiram com ele
  rationale: O idioma hebraico indica pressão insistente, não uma ação literal de romper ou irromper.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto da comitiva real, designa os homens que serviam e acompanhavam Saul, sem exigir aqui uma definição de sua condição jurídica.
- source_word: וְגַם הָאִשָּׁה
  choice: e também a mulher
  rationale: Preserva com clareza a força aditiva da expressão hebraica.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: ele lhes deu ouvidos
  rationale: Expressão portuguesa natural que conserva o sentido idiomático de escutar e atender à insistência deles, sem tornar explícita uma ideia mais forte de obediência.
- source_word: מֵהָאָרֶץ
  choice: do chão
  rationale: No contexto, refere-se ao lugar onde Saul estava prostrado, e não à terra em sentido geográfico.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: sentou-se na cama
  rationale: מִטָּה pode designar cama ou móvel reclinável; “cama” é claro e tradicional, mantendo-se a alternativa em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A locução “deu ouvidos” preserva parte da textura do idioma hebraico sem soar excessivamente literal. A pontuação do discurso direto segue uso corrente em português.
