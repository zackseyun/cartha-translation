  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַֽה תָּאֳר֔/וֹ וַ/תֹּ֗אמֶר אִ֤ישׁ זָקֵן֙ עֹלֶ֔ה וְ/ה֥וּא עֹטֶ֖ה מְעִ֑יל וַ/יֵּ֤דַע שָׁאוּל֙ כִּֽי שְׁמוּאֵ֣ל ה֔וּא וַ/יִּקֹּ֥ד אַפַּ֛יִם אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: pt
  text: 'Ele lhe perguntou: “Qual é a aparência dele?” Ela respondeu: “Um homem idoso está subindo[a], envolto em um manto[b].” Então Saul reconheceu que era Samuel, inclinou-se com o rosto em terra e prostrou-se[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “está ascendendo” ou “está se levantando”. O particípio hebraico ressalta o movimento para cima.
    reason: lexical_alternative
  - marker: b
    text: Ou “vestindo um manto”. O hebraico sugere mais vividamente que ele estava coberto ou envolto no manto.
    reason: lexical_alternative
  - marker: c
    text: O verbo também pode ser traduzido por “curvou-se” e, em certos contextos, por “adorou”. Aqui descreve uma prostração profunda diante da figura que Saul identificou como Samuel.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: a aparência dele
  rationale: תֹּאַר indica a forma ou aparência visível. A expressão é clara, natural e mantém o pedido de Saul por uma descrição que permita identificar a figura.
- source_word: אִישׁ זָקֵן
  choice: um homem idoso
  rationale: A expressão designa diretamente um homem de idade avançada. “Idoso” é atual, respeitoso e amplamente compreensível em português.
- source_word: עֹלֶה
  choice: está subindo
  rationale: O particípio descreve uma ação em andamento e conserva o movimento ascendente indicado pelo hebraico, sem explicar além do que o texto afirma.
- source_word: עֹטֶה מְעִיל
  choice: envolto num manto
  rationale: עֹטֶה sugere estar coberto ou envolvido, não apenas vestir; מְעִיל designa um manto ou veste exterior. A formulação preserva a força visual da descrição.
- source_word: וַיֵּדַע
  choice: Saul reconheceu
  rationale: Embora ידע signifique normalmente “saber” ou “conhecer”, neste contexto descreve a identificação feita por Saul com base na aparência relatada. “Reconheceu” torna esse sentido contextual explícito sem acrescentar informação.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: que era Samuel
  rationale: Esta é a forma idiomática em português de expressar a identificação contida no hebraico, literalmente “que ele era Samuel”.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: inclinou-se com o rosto em terra
  rationale: A tradução comunica claramente a postura física do idioma hebraico, no qual o rosto é dirigido para o chão.
- source_word: וַיִּשְׁתָּחוּ
  choice: e prostrou-se
  rationale: O verbo descreve inclinação profunda ou prostração reverente. “Prostrou-se” distingue a ação do verbo anterior e evita impor a noção mais específica de adoração cultual.
theological_decisions:
- issue: Se o gesto de Saul deve ser traduzido explicitamente como adoração a Samuel
  choice: prostrou-se
  alternative: adorou; curvou-se; prestou homenagem
  rationale: שׁחה pode indicar adoração ou prostração reverente, conforme o contexto. Aqui o texto descreve a reação corporal de Saul diante da figura identificada como Samuel. “Prostrou-se” preserva a intensidade do gesto sem decidir que se tratava de adoração cultual.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outras comunidades lusófonas. A ordem foi levemente ajustada para fluidez, preservando a progressão do hebraico e a ambiguidade teológica do gesto final.
