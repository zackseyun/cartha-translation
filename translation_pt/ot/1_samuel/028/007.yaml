base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: pt
  text: 'Então Saul disse aos seus servos: “Procurem para mim uma mulher que invoque espíritos, para que eu vá até ela e faça uma consulta por meio dela.” Seus servos lhe disseram: “Há uma mulher que invoca espíritos em En-Dor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: uma mulher que invoque espíritos
  rationale: A expressão designa uma mulher associada à prática de consultar ou invocar os mortos/espíritos. A formulação verbal é natural em português e evita o sentido moderno amplo e potencialmente anacrônico de “médium”, sem afirmar como genuína a capacidade alegada.
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: e a consulte por meio dela
  rationale: 'O uso de בְּ com a mulher indica mediação: Saul pretende obter uma consulta por intermédio dela, não simplesmente pedir informações a ela.'
- source_word: הִנֵּה
  choice: Há
  rationale: Neste contexto, introduz a informação de que tal mulher se encontra em En-Dor; “Há” transmite isso com naturalidade em português corrente.
- source_word: עֵין דּוֹר
  choice: En-Dor
  rationale: Transliteração tradicional e reconhecível do topônimo hebraico.
theological_decisions:
- issue: Natureza da prática atribuída à mulher
  choice: “que invoque espíritos” descreve a atividade procurada por Saul sem confirmar que ela detenha poder autônomo real sobre os mortos.
  alternative: “médium” ou “necromante”
  rationale: O hebraico identifica a mulher por sua ligação com אוֹב, termo de interpretação discutida. A tradução preserva o caráter ocultista da prática sem antecipar a interpretação do episódio nem impor terminologia técnica moderna.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível a leitores brasileiros e inteligível internacionalmente. Mantém a repetição do hebraico sobre a mulher e explicita de modo natural a mediação indicada por בָּהּ.
