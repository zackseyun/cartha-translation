    issue: «Chegaram à casa da mulher» acrescenta «casa».
    rationale: O hebraico diz que eles vieram «à mulher», sem mencionar uma casa. A tradução não deve introduzir esse detalhe narrativo.
  - severity: medium
    issue: «Por meio de um espírito» não representa a opção contextual mais provável de בָּאוֹב no texto principal.
    rationale: Neste contexto, o termo designa mais naturalmente um médium ou uma prática mediúnica ligada à consulta necromântica. A alternativa ligada a «espírito familiar» pode ser mantida em nota, sem impor uma leitura doutrinária.
