base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: pt
  text: 'Então Saul se disfarçou, vestiu outras roupas, e ele e dois homens que o acompanhavam partiram. Foram até a mulher durante a noite, e ele disse: “Por favor, adivinhe para mim por meio de um médium e faça subir para mim aquele que eu lhe disser.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: se disfarçou
  rationale: O hitpael expressa ação reflexiva pela qual Saul altera a aparência para ocultar a identidade; “se disfarçou” é natural e preciso em português.
- source_word: בְּגָדִים אֲחֵרִים
  choice: vestiu outras roupas
  rationale: A expressão descreve a troca de vestimenta como parte do disfarce, em linguagem simples e atual.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: partiu com dois homens
  rationale: Reproduz com naturalidade o sentido da construção hebraica, na qual Saul vai acompanhado de dois homens.
- source_word: לָיְלָה
  choice: durante a noite
  rationale: Preserva o cenário noturno e se encaixa naturalmente na narrativa.
- source_word: קָסֳמִי נָא לִי
  choice: Por favor, pratique a adivinhação para mim
  rationale: “Pratique a adivinhação” representa explicitamente o verbo קסם, enquanto “por favor” transmite a partícula de súplica נָא.
- source_word: בָּאוֹב
  choice: por meio de um espírito
  rationale: אוֹב pode designar o espírito consultado ou o meio necromântico associado a ele. A tradução mantém a referência espiritual sem identificar diretamente a mulher como o instrumento.
- source_word: וְהַעֲלִי לִי
  choice: faça subir
  rationale: Preserva a imagem espacial do hifil de עלה, segundo a linguagem conceitual da narrativa, sem explicar ou validar o mecanismo.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: aquele que eu indicar
  rationale: Expressa de modo natural que Saul ainda especificará a pessoa que deseja fazer subir.
theological_decisions:
- issue: Terminologia necromântica sem afirmar nem negar sua eficácia
  choice: 'Relatar diretamente o pedido de Saul: “pratique a adivinhação”, “por meio de um espírito” e “faça subir”.'
  alternative: Acrescentar linguagem cética, como “finja fazer subir”, ou linguagem mais afirmativa, como “contate o espírito morto”.
  rationale: O texto relata o pedido dentro de seu próprio mundo conceitual. A tradução não deve antecipar um juízo sobre a natureza ou a eficácia da prática.
- issue: Ambiguidade lexical de אוֹב
  choice: No texto, “espírito”, com nota registrando a possibilidade de referência ao médium ou espírito familiar.
  alternative: Traduzir diretamente como “médium”.
  rationale: O termo hebraico admite associação tanto com o espírito necromântico quanto com quem o consulta; a opção evita eliminar essa tensão lexical e a nota apresenta a alternativa relevante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe narrativa foi tornada natural sem perder as imagens hebraicas centrais; a terminologia da necromancia permanece descritiva e não confessional.
