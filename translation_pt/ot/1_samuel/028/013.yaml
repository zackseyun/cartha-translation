  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: pt
  text: 'O rei lhe disse: “Não tenha medo. O que você está vendo[a]?” A mulher respondeu a Saul: “Estou vendo um ser divino[b] subindo da terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “O que você viu?” O verbo está formalmente no perfeito/passado, embora no contexto possa indicar o que ela está vendo naquele instante.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica אֱלֹהִים e o particípio que a acompanha têm forma plural, podendo ser traduzidos literalmente por “deuses subindo”; no contexto, também podem descrever um ser divino.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Preserva o substantivo comum com artigo usado no hebraico e o estilo narrativo; Saul é nomeado na oração seguinte.
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: Forma natural e corrente em português para a proibição com ירא, sem perder a força do original.
- source_word: כִּי מָה רָאִית
  choice: O que você está vendo?
  rationale: Embora רָאִית seja formalmente perfeito, o presente progressivo exprime com naturalidade a percepção visionária imediata no contexto. A leitura passada é preservada em nota.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Traduz diretamente o substantivo hebraico, sem inserir neste versículo o rótulo interpretativo “médium”.
- source_word: אֱלֹהִים
  choice: um ser divino
  rationale: A expressão comunica a natureza sobrenatural da aparição sem identificá-la com Deus nem impor uma referência politeísta. A forma plural do hebraico é registrada em nota.
- source_word: עֹלִים
  choice: subindo
  rationale: Representa o movimento ascendente de עלה e se ajusta naturalmente à cena. A concordância singular segue a leitura contextual de אֱלֹהִים como um ser divino, enquanto a forma plural do texto é indicada em nota.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: Mantém a amplitude de אֶרֶץ e a imagem de uma aparição que sobe de baixo.
theological_decisions:
- issue: Como traduzir אֱלֹהִים no relato da mulher
  choice: um ser divino
  alternative: deuses
  rationale: A fala relata a percepção da mulher, não uma afirmação doutrinária do narrador. “Um ser divino” preserva o caráter sobrenatural e a ambiguidade referencial sem sugerir politeísmo nem identificar a aparição como o próprio Deus; a forma plural permanece documentada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento “você” torna o diálogo natural; “lhe disse” evita repetição. A pontuação separa a ordem tranquilizadora da pergunta. Todas as ambiguidades relevantes do hebraico são preservadas em notas.
