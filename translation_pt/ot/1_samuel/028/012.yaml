  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: pt
  text: 'Quando a mulher viu Samuel[a], gritou bem alto e disse a Saul: “Por que você me enganou? Você é Saul!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que parecia ser Samuel”. O texto hebraico diz simplesmente “Samuel”, sem explicar a natureza da aparição.'
    reason: Leitura alternativa que preserva a discussão sobre a natureza do que a mulher viu.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: viu
  rationale: O verbo ראה, nesta forma narrativa, indica naturalmente percepção visual direta; “viu” preserva a formulação simples do hebraico.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: O hebraico emprega o substantivo comum “mulher”, não o título contextual “médium”; a tradução mantém essa escolha.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: O texto apresenta Samuel diretamente como objeto do verbo “ver”, sem qualificar a natureza da aparição.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: gritou bem alto
  rationale: A combinação expressa um grito forte. A formulação é natural em português atual e conserva a intensidade.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: disse
  rationale: Em português, reproduzir literalmente “disse, dizendo” seria redundante; “disse” comunica de modo idiomático a introdução da fala.
- source_word: לָמָּה רִמִּיתָנִי
  choice: Por que você me enganou?
  rationale: “Enganou” traduz claramente o piel de רמה, e o pretérito perfeito é natural para o engano anterior que acaba de ser descoberto.
- source_word: וְאַתָּה שָׁאוּל
  choice: Você é Saul!
  rationale: O pronome explícito tem força enfática. A formulação e a exclamação transmitem essa ênfase sem o pouco natural “e você é Saul”.
theological_decisions:
- issue: Se “Samuel” deve ser qualificado no texto principal como aparição, espírito ou suposto Samuel
  choice: Manter a referência direta “Samuel”
  alternative: “o que parecia ser Samuel” ou “o espírito de Samuel”
  rationale: O hebraico simplesmente diz que a mulher viu Samuel. Qualificá-lo no texto principal resolveria uma questão interpretativa que o versículo deixa sem explicação; a nota registra essa cautela sem alterar a afirmação narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna a fala direta natural e preserva a ênfase do pronome hebraico; “gritou bem alto” evita a rigidez de “clamou com grande voz”.
