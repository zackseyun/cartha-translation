    text: 'Ou: “nem levou a efeito o ardor da sua ira contra Amaleque”.'
    reason: Alternativa mais formal que reproduz de perto a expressão hebraica “fazer o ardor da ira dele”.
  revision_rationale: A revisão elimina a ambiguidade de “fez isso com você”, substituindo-a por uma expressão natural que deixa claro que o juízo de Yahweh recai sobre Saul. Também ajusta o possessivo para uma forma mais fluente em português, mantendo Yahweh como referente e preservando a imagem de intensidade em “ira ardente”.
