source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: pt
  text: Porque você não obedeceu à voz de Yahweh nem executou sua ira ardente contra Amaleque[a], por isso Yahweh trouxe isso sobre você hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem levou a efeito o ardor da sua ira contra Amaleque”.'
    reason: Alternativa mais formal que reproduz de perto a expressão hebraica “fazer o ardor da ira dele”.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Porque
  rationale: Neste contexto, a conjunção introduz a causa do juízo de Saul; “Porque” expressa com clareza essa força causal.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: você não obedeceu à voz de Yahweh
  rationale: שׁמע com בְּקוֹל indica dar ouvidos no sentido de obedecer. A formulação preserva tanto o sentido quanto a imagem da “voz”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: executou a ira ardente dele
  rationale: O hebraico diz literalmente “fazer o ardor da ira dele” e, no contexto, refere-se a cumprir contra Amaleque o juízo ordenado por Yahweh. “Executou” torna clara essa ação sem eliminar a imagem de intensidade.
- source_word: חֲרוֹן אַפּוֹ
  choice: a ira ardente dele
  rationale: “Ira ardente” preserva a metáfora hebraica do calor ou ardor da ira. “Dele” identifica Yahweh como referente sem usar uma construção possessiva potencialmente menos clara.
- source_word: בַּעֲמָלֵק
  choice: contra Amaleque
  rationale: A preposição introduz o alvo contra o qual a ira divina deveria ter sido executada.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca de modo natural em português a consequência da desobediência de Saul.
- source_word: הַדָּבָר הַזֶּה
  choice: isso
  rationale: דָּבָר refere-se aqui ao juízo ou acontecimento anunciado. “Isso” é mais natural no português atual do que o literal “esta coisa”.
- source_word: עָשָׂה לְךָ יְהוָה
  choice: Yahweh fez isso com você
  rationale: Mantém Yahweh como sujeito e Saul como aquele sobre quem recai a ação judicial.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente direto e corrente da expressão hebraica “neste dia”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Agente e alvo da ira em חֲרוֹן אַפּוֹ בַּעֲמָלֵק
  choice: Saul deveria executar contra Amaleque a ira de Yahweh
  alternative: Saul deveria apenas demonstrar sua própria ira contra Amaleque
  rationale: O sufixo “dele” retoma Yahweh, e o contexto de 1 Samuel 15 apresenta Saul como responsável por cumprir o juízo divino. A tradução mantém essa relação sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção causal foi mantida, assim como a repetição explícita de “Yahweh”. “Ira ardente” conserva a imagem concreta do hebraico, enquanto “executou” comunica que se tratava do cumprimento de um juízo ordenado.
