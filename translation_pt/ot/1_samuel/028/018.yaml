revisions:
- from: Porque você não obedeceu à voz de Yahweh nem executou a ira ardente dele contra Amaleque[a], por isso Yahweh fez isso com você hoje.
  to: Porque você não obedeceu à voz de Yahweh nem executou sua ira ardente contra Amaleque[a], por isso Yahweh trouxe isso sobre você hoje.
  rationale: A revisão elimina a ambiguidade de “fez isso com você”, substituindo-a por uma expressão natural que deixa claro que o juízo de Yahweh recai sobre Saul. Também ajusta o possessivo para uma forma mais fluente em português, mantendo Yahweh como referente e preservando a imagem de intensidade em “ira ardente”.
