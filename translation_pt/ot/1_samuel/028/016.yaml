  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: pt
  text: 'Então Samuel disse: “Por que você me consulta, se Javé se afastou de você e se tornou seu inimigo[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu adversário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: Então Samuel disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência e introduz a resposta de Samuel.
- source_word: וְלָמָּה
  choice: Por que
  rationale: 'Em português, “Então Samuel disse: ‘Por que...?’” já comunica a conexão e a força retórica, sem a formulação pouco natural “E por que”.'
- source_word: תִּשְׁאָלֵנִי
  choice: você me consulta
  rationale: Neste contexto de busca por orientação sobrenatural, “consultar” expressa melhor do que o genérico “perguntar” o sentido contextual de שאל.
- source_word: יְהוָה
  choice: Javé
  rationale: Transliteração tradicional e amplamente reconhecível em português do nome divino, em vez de substituí-lo por um título.
- source_word: סָר מֵעָלֶיךָ
  choice: se afastou de você
  rationale: Reproduz o afastamento relacional indicado por סור com מֵעַל em português atual e natural.
- source_word: וַיְהִי עָרֶךָ
  choice: se tornou seu inimigo
  rationale: עָר designa quem se opõe como inimigo ou adversário; “inimigo” preserva de maneira clara a gravidade da declaração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome próprio divino; a tradução o preserva em forma portuguesa reconhecível, sem substituí-lo por um título.
- issue: A relação de Javé com Saul expressa por עָרֶךָ
  choice: se tornou seu inimigo
  alternative: se tornou seu adversário
  rationale: A tradução mantém sem atenuação a afirmação severa de oposição divina. “Adversário” é igualmente possível e aparece na nota.
translation_notes:
  register: Português moderno, digno e direto, com tratamento por “você” para ampla legibilidade brasileira. A pergunta conserva o tom incisivo de Samuel, e a nota registra uma alternativa lexical genuína sem enfraquecer o texto principal.
