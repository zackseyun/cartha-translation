  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: pt
  text: 'Então Saul jurou a ela por Yahweh: “Tão certo como vive Yahweh, nenhum castigo virá sobre você por causa disso.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhuma culpa recairá sobre você por causa disso”. A palavra hebraica pode significar “iniquidade”, “culpa” ou o castigo decorrente da culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: O nifal de שׁבע significa prestar juramento; “jurou” é natural, solene e direto em português.
- source_word: לָהּ
  choice: a ela
  rationale: Expressa de modo claro o objeto indireto feminino, evitando a possível ambiguidade de “lhe” para leitores de diferentes regiões.
- source_word: בַּיהוָה
  choice: por Yahweh
  rationale: A preposição ב introduz aquele por quem Saul presta o juramento, e o nome divino é transliterado.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Equivalente português natural da fórmula hebraica de juramento, preservando sua força asseverativa.
- source_word: אִם
  choice: nenhum
  rationale: Em uma fórmula de juramento, אִם introduz uma imprecação elíptica e funciona como forte negação; uma tradução literal por “se” ocultaria o sentido.
- source_word: יִקְּרֵךְ
  choice: virá sobre você
  rationale: קרא aqui descreve algo que sucede ou sobrevém à mulher; a formulação mantém a imagem e é compreensível.
- source_word: עָוֺן
  choice: castigo
  rationale: Neste contexto, עָוֺן aponta provavelmente para a consequência penal da culpa; a nota preserva a possibilidade lexical de “culpa”.
- source_word: בַּדָּבָר הַזֶּה
  choice: por causa disso
  rationale: Expressa em português corrente a relação entre o ato em questão e a consequência que Saul nega.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome da aliança; a transliteração “Yahweh” o distingue de títulos e segue a camada de consulta fornecida.
- issue: Sentido de עָוֺן no juramento de Saul
  choice: castigo
  alternative: culpa; iniquidade
  rationale: A garantia dada à mulher diz respeito, no contexto, à consequência que poderia recair sobre ela. Como o termo também pode designar culpa ou iniquidade, essa ambiguidade é registrada em nota, sem declarar moralmente inocente o ato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula “Tão certo como vive Yahweh” comunica naturalmente a força do juramento hebraico; “você” torna explícita a referência feminina pelo contexto sem recorrer a formas regionais ou arcaicas.
