  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: pt
  text: Então ela pôs a comida diante de Saul e diante de seus servos[a], e eles comeram. Depois se levantaram e foram embora naquela noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “ela pôs [isto] diante de Saul e diante de seus servos”. O objeto fica implícito e é entendido pelo contexto anterior como a refeição preparada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: ela pôs a comida diante de
  rationale: O hifil de נגשׁ aqui significa aproximar ou colocar diante de alguém. O objeto não está expresso no hebraico, mas é retomado do contexto anterior; explicitar “a comida” produz português natural e identifica corretamente a refeição preparada.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A preposição significa literalmente “diante de/na presença de” e, neste contexto de servir uma refeição, “diante de” conserva a imagem do hebraico sem soar artificial.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עבד pode designar servo, escravo ou auxiliar. Aqui se refere aos homens que acompanhavam Saul a seu serviço; “servos” é direto e não afirma indevidamente uma condição de escravidão.
- source_word: וַיֹּאכֵלוּ
  choice: e eles comeram
  rationale: O verbo não traz objeto expresso. Em português, “comeram” retoma naturalmente a comida já mencionada.
- source_word: וַיָּקֻמוּ
  choice: Depois se levantaram
  rationale: A forma narrativa marca a ação seguinte. “Se levantaram” é corrente e digna; “Depois” torna clara a sequência sem alterar o sentido.
- source_word: וַיֵּלְכוּ
  choice: e foram embora
  rationale: הלך significa ir ou andar. No contexto, Saul e seus homens deixam a casa da mulher, por isso “foram embora” comunica naturalmente a partida implícita.
- source_word: בַּלַּיְלָה הַהוּא
  choice: naquela mesma noite
  rationale: A expressão significa “naquela noite”. A inclusão de “mesma” transmite em português a força contextual de que partiram ainda naquela noite, sem sugerir uma noite posterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição hebraica de “diante de” foi condensada de modo idiomático, sem perda de referente; o objeto implícito foi explicitado como “a comida” e documentado em nota.
