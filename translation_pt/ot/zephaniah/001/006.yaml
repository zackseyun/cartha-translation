  verdict: approve
  source_fidelity: A tradução representa adequadamente a estrutura enumerativa e as duas negações do hebraico. «Os que deixam de seguir Yahweh» comunica de forma idiomática o particípio הַנְּסוֹגִים com o idiomatismo מֵאַחֲרֵי יְהוָה, sem introduzir terminologia confessional. «Não buscam Yahweh nem o consultam» preserva tanto a repetição do nome divino em בִקְשׁוּ אֶת־יְהוָה quanto o sufixo pronominal em דְרָשֻׁהוּ e distingue apropriadamente os dois verbos.
  naturalness: O português é moderno, claro e apropriado ao registro profético. «Deixam de seguir» é uma solução natural e inteligível internacionalmente; «nem o consultam» é fluente e mantém a diferenciação retórica entre buscar e consultar.
  terminology: «Yahweh» segue de modo consistente a decisão editorial de representar o Tetragrama como nome próprio. «Buscam» e «consultam» são escolhas semanticamente defensáveis para בקש e דרש neste contexto e não impõem uma interpretação doutrinária.
