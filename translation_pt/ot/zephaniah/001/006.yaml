source:
  edition: WLC
  text: וְ/אֶת הַ/נְּסוֹגִ֖ים מֵ/אַחֲרֵ֣י יְהוָ֑ה וַ/אֲשֶׁ֛ר לֹֽא בִקְשׁ֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א דְרָשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/006.yaml
  text: and those who turn back from following Yahweh[c][b][a], and who do not seek Yahweh or inquire of him.
translation:
  language: pt
  text: e os que deixam de seguir Yahweh, e os que não buscam Yahweh nem o consultam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּסוֹגִים
  choice: os que deixam de seguir
  rationale: O particípio de נסוג/סוג descreve os que recuam ou voltam atrás. Em combinação com מֵאַחֲרֵי, a formulação natural «deixam de seguir» comunica a retirada da lealdade sem recorrer ao termo eclesiástico «apóstatas».
- source_word: מֵאַחֲרֵי יְהוָה
  choice: de seguir Yahweh
  rationale: O hebraísmo literal «de detrás de Yahweh» indica deixar de acompanhá-lo ou segui-lo; a tradução explicita naturalmente essa relação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando seu caráter de nome próprio em vez de substituí-lo por um título.
- source_word: בִקְשׁוּ
  choice: buscam
  rationale: בקש significa procurar ou buscar; «buscar Yahweh» preserva a expressão profética de orientação e devoção a Deus.
- source_word: דְרָשֻׁהוּ
  choice: o consultam
  rationale: דרש pode significar buscar, indagar ou consultar. Depois de בקש, «consultam» mantém a distinção entre os verbos sem afirmar uma separação teológica rígida.
- source_word: וַאֲשֶׁר לֹא... וְלֹא
  choice: e os que não... nem
  rationale: A coordenação «não... nem» reproduz com clareza as duas ações negadas; repetir «os que» torna explícita a possível leitura de mais um grupo na enumeração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz o Tetragrama como nome próprio. «Yahweh» o representa diretamente, sem substituí-lo pelo título tradicional.
- issue: Relação entre בקש e דרש
  choice: buscam... consultam
  alternative: buscam... buscam; procuram... indagam
  rationale: Os verbos têm campos semânticos parcialmente sobrepostos. Empregar dois verbos relacionados preserva a plenitude retórica, sem criar uma distinção doutrinária excessiva.
- issue: Identidade dos grupos coordenados
  choice: repetir «os que»
  alternative: «e que não buscam», entendendo uma única caracterização contínua
  rationale: וַאֲשֶׁר pode introduzir outro grupo da lista ou acrescentar uma descrição ao anterior. A repetição acompanha mais de perto a coordenação hebraica, embora a relação exata permaneça sintaticamente aberta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Deixam de seguir» evita tanto o literalismo pouco natural «recuam de detrás» quanto terminologia confessional como «apóstatas». A repetição de «Yahweh» conserva a ênfase do hebraico; «nem o consultam» retém o pronome masculino referente a Yahweh.
