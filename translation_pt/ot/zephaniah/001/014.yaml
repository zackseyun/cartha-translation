id: ZEP.1.14
reference: Zephaniah 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קָר֤וֹב יוֹם יְהוָה֙ הַ/גָּד֔וֹל קָר֖וֹב וּ/מַהֵ֣ר מְאֹ֑ד ק֚וֹל י֣וֹם יְהוָ֔ה מַ֥ר צֹרֵ֖חַ שָׁ֥ם גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/014.yaml
  text: 'The great day of Yahweh is near—near and coming very quickly. The sound of the day of Yahweh: there the warrior cries out bitterly.'
translation:
  language: pt
  text: 'O grande dia de Yahweh está próximo — próximo e vem muito depressa. O som[a] do dia de Yahweh: ali o guerreiro grita amargamente.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “A voz do dia de Yahweh” ou “O ruído do dia de Yahweh”; o termo hebraico pode significar “som”, “voz” ou “ruído”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ali o homem valente grita amargamente”.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרוֹב
  choice: está próximo
  rationale: Adjetivo predicativo que expressa iminência; a repetição de “próximo” preserva a ênfase do hebraico.
- source_word: יוֹם יְהוָה
  choice: dia de Yahweh
  rationale: Mantém a expressão profética e a relação genitiva do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַגָּדוֹל
  choice: grande
  rationale: Traduz diretamente o adjetivo sem acrescentar ideias como “terrível”, ausentes neste texto.
- source_word: וּמַהֵר מְאֹד
  choice: e vem muito depressa
  rationale: Comunica de modo natural a rapidez com que o dia se aproxima, preservando a forte intensificação de מְאֹד.
- source_word: קוֹל
  choice: som
  rationale: É uma opção ampla que preserva a ambiguidade entre som, voz e ruído no contexto.
- source_word: מַר
  choice: amargamente
  rationale: Entendido adverbialmente com o particípio “grita”, expressa a aflição intensa do clamor.
- source_word: צֹרֵחַ
  choice: grita
  rationale: Representa o clamor alto e intenso do particípio hebraico em português corrente e digno.
- source_word: שָׁם
  choice: ali
  rationale: Preserva o sentido espacial mais natural do advérbio, apontando para a cena do juízo.
- source_word: גִּבּוֹר
  choice: guerreiro
  rationale: No contexto de conflito e juízo, designa com clareza um combatente forte ou valente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de o substituir por um título.
- issue: Sentido de גִּבּוֹר na oração final
  choice: guerreiro
  alternative: homem valente; poderoso
  rationale: “Guerreiro” preserva a imagem contextual de até um combatente forte clamando em aflição, sem ampliar a afirmação teológica.
- issue: Relação sintática da oração final
  choice: ali o guerreiro grita amargamente
  alternative: o guerreiro grita amargamente ali
  rationale: A ordem escolhida mantém o valor espacial de שָׁם e reproduz a concisão abrupta do hebraico sem eliminar sua tensão.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição enfática de “próximo” e a construção abrupta da segunda frase refletem a força profética do hebraico; “vem muito depressa” evita uma formulação artificial sem enfraquecer a urgência.
