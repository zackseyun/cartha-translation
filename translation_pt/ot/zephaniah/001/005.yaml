  text: וְ/אֶת הַ/מִּשְׁתַּחֲוִ֥ים עַל הַ/גַּגּ֖וֹת לִ/צְבָ֣א הַ/שָּׁמָ֑יִם וְ/אֶת הַ/מִּֽשְׁתַּחֲוִים֙ הַ/נִּשְׁבָּעִ֣ים לַֽ/יהוָ֔ה וְ/הַ/נִּשְׁבָּעִ֖ים בְּ/מַלְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/005.yaml
  text: those who bow down on the rooftops to the host of heaven[a], and those who bow down, who swear by Yahweh and swear by Milcom.
translation:
  language: pt
  text: os que se prostram nos telhados diante do exército dos céus, e os que se prostram, os que juram por Yahweh e juram por Milcom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por seu rei”; alguns entendem o nome aqui como “Moloque”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּשְׁתַּחֲוִים
  choice: os que se prostram
  rationale: O particípio de שׁחה descreve o ato físico de curvar-se ou prostrar-se em culto; “prostram” preserva tanto o gesto quanto seu sentido cultual.
- source_word: עַל הַגַּגּוֹת
  choice: nos terraços
  rationale: As coberturas planas das casas eram usadas como terraços. A expressão é natural em português e conserva o cenário do culto praticado no alto das casas.
- source_word: לִצְבָא הַשָּׁמָיִם
  choice: diante do exército dos céus
  rationale: A expressão designa o conjunto dos corpos ou poderes celestes venerados. “Exército dos céus” mantém a imagem coletiva e evita reduzi-la apenas às estrelas.
- source_word: הַנִּשְׁבָּעִים לַיהוָה
  choice: juram por Yahweh
  rationale: Neste paralelismo, נשׁבע com ל indica juramento que invoca Yahweh ou expressa lealdade a ele; “juram por” é idiomático e corresponde à construção seguinte com ב.
- source_word: בְּמַלְכָּם
  choice: juram por Milcom
  rationale: A leitura como nome da divindade amonita Milcom ajusta-se à denúncia de lealdade religiosa dividida, sem ocultar em nota as demais análises possíveis da forma hebraica.
theological_decisions:
- issue: Identidade de מַלְכָּם
  choice: Milcom, a divindade estrangeira, no texto principal
  alternative: “seu rei”; alguns entendem o nome como “Moloque”
  rationale: Milcom explica bem o paralelismo entre jurar por Yahweh e por outra divindade, dentro da condenação do sincretismo. Como a forma consonantal também admite “seu rei” e foi relacionada a Moloque, as alternativas são preservadas em nota.
- issue: Relação entre os dois juramentos
  choice: “mas também” explicita o contraste implícito da lealdade dividida
  alternative: ligação simples com “e”
  rationale: 'O hebraico coordena as expressões com ו, mas o contexto condenatório torna adversativa a relação pragmática: as mesmas pessoas juram por Yahweh e por Milcom. A formulação não elimina a tensão nem transforma a coordenação em grupos distintos.'
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Terraços” comunica as coberturas planas usadas no antigo Oriente Próximo. O nome divino é transliterado como “Yahweh”, em consonância com a camada inglesa fornecida. O marcador [a] aparece junto de “Milcom”, termo ao qual a nota efetivamente se refere.
