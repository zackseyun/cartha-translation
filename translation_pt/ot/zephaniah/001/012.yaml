  text: וְ/הָיָה֙ בָּ/עֵ֣ת הַ/הִ֔יא אֲחַפֵּ֥שׂ אֶת יְרוּשָׁלִַ֖ם בַּ/נֵּר֑וֹת וּ/פָקַדְתִּ֣י עַל הָ/אֲנָשִׁ֗ים הַ/קֹּֽפְאִים֙ עַל שִׁמְרֵי/הֶ֔ם הָ/אֹֽמְרִים֙ בִּ/לְבָבָ֔/ם לֹֽא יֵיטִ֥יב יְהוָ֖ה וְ/לֹ֥א יָרֵֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/012.yaml
  text: 'And it will happen at that time: I will search Jerusalem with lamps, and I will punish the men who have grown thick on their dregs, who say in their hearts, ''The LORD will not do good, nor will he do harm.'''
translation:
  language: pt
  text: 'E acontecerá, naquele tempo, que vasculharei Jerusalém com lâmpadas e castigarei os homens que engrossaram sobre as suas borras[a], os que dizem no coração: “O SENHOR não fará o bem nem fará o mal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem é a do vinho deixado por muito tempo sem ser mexido sobre as borras, tornando-se espesso; retrata pessoas estagnadas e acomodadas.
    reason: A metáfora hebraica é pouco familiar em português e pode não ser compreendida sem uma breve explicação.
lexical_decisions:
- source_word: אֲחַפֵּשׂ
  choice: vasculharei
  rationale: Expressa uma busca minuciosa e ativa, adequada à imagem de examinar Jerusalém à luz de lâmpadas.
- source_word: וּפָקַדְתִּי עַל
  choice: castigarei
  rationale: Neste contexto de juízo, o verbo פקד com עַל indica intervenção punitiva, não mera inspeção.
- source_word: הַקֹּפְאִים עַל שִׁמְרֵיהֶם
  choice: que engrossaram sobre a própria borra
  rationale: Preserva a metáfora vinícola e o sentido de קפא, tornar-se espesso ou coagular por permanecer sem perturbação, sem substituir a imagem por uma interpretação abstrata como 'acomodados'.
- source_word: יְהוָה
  choice: O SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o Tetragrama, em versalete conceitual por meio de letras maiúsculas.
- source_word: לֹא יֵיטִיב ... וְלֹא יָרֵעַ
  choice: não fará o bem nem fará o mal
  rationale: Mantém o paralelismo e a tensão da afirmação dos indiferentes, sem atenuar o segundo membro para apenas 'causar dano'.
theological_decisions:
- issue: A alegação de que YHWH não intervém moralmente
  choice: Preservar a fala como “não fará o bem nem fará o mal”
  alternative: Explicitar como “não recompensará nem castigará”
  rationale: O texto apresenta a própria formulação cética dos homens; explicitar recompensa e castigo resolveria interpretativamente uma expressão deliberadamente abrangente.
- issue: Metáfora da borra
  choice: Conservar a imagem concreta e explicá-la em nota
  alternative: Traduzir diretamente como “os complacentes” ou “os acomodados”
  rationale: A imagem comunica estagnação e autossuficiência, mas o texto hebraico faz isso por metáfora; mantê-la evita apagar sua força poética.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Vasculharei” comunica busca rigorosa; a incomum metáfora da borra foi mantida por fidelidade poética e esclarecida em nota.
