id: ZEP.1.1
reference: Zephaniah 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל צְפַנְיָה֙ בֶּן כּוּשִׁ֣י בֶן גְּדַלְיָ֔ה בֶּן אֲמַרְיָ֖ה בֶּן חִזְקִיָּ֑ה בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֥לֶךְ יְהוּדָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/001.yaml
  text: 'The word of Yahweh that came to Zephaniah son of Cushi[a], son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon[b], king of Judah:'
translation:
  language: pt
  text: 'A palavra de Yahweh que veio a Sofonias, filho de Cusi[a], filho de Gedalias, filho de Amarias, filho de Ezequias[b], nos dias de Josias, filho de Amom, rei de Judá:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cusi também pode ser entendido como “cuxita”, mas aqui é apresentado como nome próprio na genealogia.
    reason: lexical_alternative
  - marker: b
    text: Ezequias pode referir-se ao rei Ezequias, o que faria de Sofonias alguém de ascendência real; o texto, porém, não identifica explicitamente esse antepassado como o rei.
    reason: cross_reference
lexical_decisions:
- source_word: דְּבַר
  choice: palavra
  rationale: Preserva a fórmula profética דְּבַר־יְהוָה em português natural e mantém sua ligação verbal com a revelação divina; “mensagem” seria possível, mas menos formalmente correspondente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Expressa de modo idiomático e fiel a fórmula hebraica usada para a palavra profética dirigida a alguém.
- source_word: צְפַנְיָה
  choice: Sofonias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: בֶּן
  choice: filho de
  rationale: Mantém o marcador genealógico singular repetido no hebraico, sem pressupor que a genealogia omita ou inclua gerações intermediárias.
- source_word: כּוּשִׁי
  choice: Cusi
  rationale: Trata o termo como nome próprio dentro da genealogia. A possível leitura étnica é preservada em nota.
- source_word: גְּדַלְיָה
  choice: Gedalias
  rationale: Usa a forma portuguesa corrente do nome próprio.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Usa a forma portuguesa corrente do nome próprio.
- source_word: חִזְקִיָּה
  choice: Ezequias
  rationale: Usa a forma portuguesa tradicional do nome sem acrescentar o título “rei”, ausente do texto neste ponto.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Conserva de perto a expressão temporal hebraica e soa natural no registro bíblico português.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Usa a forma portuguesa tradicional do nome do rei.
- source_word: אָמֹון
  choice: Amom
  rationale: Usa a forma portuguesa tradicional do nome próprio.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reproduz diretamente o título e o domínio real expressos no hebraico.
theological_decisions:
- issue: Possível identificação de חִזְקִיָּה com o rei Ezequias
  choice: Manter apenas “Ezequias” no texto principal.
  alternative: Identificá-lo explicitamente como o rei Ezequias e, assim, apresentar Sofonias como membro da linhagem real.
  rationale: Embora a extensão incomum da genealogia possa favorecer essa identificação histórica, o hebraico não chama esse antepassado de rei. A tradução conserva a ambiguidade e registra a possibilidade em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos reconhecíveis no Brasil e em outras comunidades lusófonas. A construção “A palavra de Yahweh que veio a” preserva o caráter formulaico da abertura profética sem recorrer a sintaxe arcaica. Os marcadores foram colocados junto aos nomes a que suas respectivas notas se referem.
source_grounding:
  english_pob_role: consult_only
