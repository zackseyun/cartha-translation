  text: וְ/נָטִ֤יתִי יָדִ/י֙ עַל יְהוּדָ֔ה וְ/עַ֖ל כָּל יוֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/הִכְרַתִּ֞י מִן הַ/מָּק֤וֹם הַ/זֶּה֙ אֶת שְׁאָ֣ר הַ/בַּ֔עַל אֶת שֵׁ֥ם הַ/כְּמָרִ֖ים עִם הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/004.yaml
  text: And I will stretch out my hand against Judah and against all the inhabitants of Jerusalem[a], and I will cut off from this place the remnant of Baal, the name of the idolatrous priests along with the priests[b],
translation:
  language: pt
  text: Estenderei a minha mão contra Judá e contra todos os habitantes de Jerusalém; eliminarei deste lugar o que resta de Baal e o nome[a] dos sacerdotes idólatras[b], junto com os sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a memória”. A expressão hebraica “o nome” indica que até a lembrança deles seria eliminada.
    reason: lexical_alternative
  - marker: b
    text: “Sacerdotes idólatras” traduz o hebraico kemarim, termo aplicado a sacerdotes de cultos pagãos ou sincréticos, aqui diferenciados dos “sacerdotes” mencionados em seguida.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָטִיתִי יָדִי
  choice: Estenderei a minha mão
  rationale: Preserva a imagem hebraica de uma ação divina decisiva em juízo. O futuro se ajusta à sequência profética do contexto.
- source_word: עַל יְהוּדָה וְעַל כָּל יוֹשְׁבֵי יְרוּשָׁלָם
  choice: contra Judá e contra todos os habitantes de Jerusalém
  rationale: Com o gesto hostil de estender a mão, עַל tem sentido adversativo; “habitantes” expressa naturalmente יוֹשְׁבֵי neste contexto urbano.
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: O hifil de כרת indica fazer desaparecer ou exterminar em contexto de juízo. “Eliminarei” comunica o resultado com clareza em português atual, sem especificar um modo de destruição que o texto não explicita.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: deste lugar
  rationale: Mantém a referência dêitica do hebraico sem restringi-la explicitamente apenas à cidade ou a toda a terra.
- source_word: שְׁאָר הַבַּעַל
  choice: o que resta de Baal
  rationale: Expressa de modo natural o sentido de שְׁאָר e preserva a formulação condensada, que pode abranger os vestígios da presença ou do culto de Baal.
- source_word: שֵׁם הַכְּמָרִים
  choice: o nome dos sacerdotes idólatras
  rationale: “Nome” conserva a imagem do hebraico, enquanto “sacerdotes idólatras” torna acessível o valor específico de כְּמָרִים, sem recorrer a uma transliteração obscura.
- source_word: עִם הַכֹּהֲנִים
  choice: junto com os sacerdotes
  rationale: Traduz עִם naturalmente e mantém a distinção lexical entre כְּמָרִים e o termo comum כֹּהֲנִים.
theological_decisions:
- issue: Distinção entre כְּמָרִים e כֹּהֲנִים
  choice: Traduzir כְּמָרִים por “sacerdotes idólatras” e כֹּהֲנִים por “sacerdotes”.
  alternative: Traduzir ambos apenas por “sacerdotes” ou transliterar כְּמָרִים.
  rationale: O hebraico distingue deliberadamente os dois grupos. A tradução mantém o contraste entre ministros de culto pagão ou sincrético e a classe sacerdotal designada pelo termo comum, sem definir além do que o versículo afirma a culpa exata de cada indivíduo.
- issue: Sentido de “o nome”
  choice: Manter “o nome” no texto principal e explicar o idioma em nota.
  alternative: Parafrasear no texto como “a memória” ou “toda lembrança”.
  rationale: A expressão evoca uma erradicação tão completa que até o nome desaparece. Preservar a imagem mantém a força e a tensão do texto, enquanto a nota esclarece seu sentido idiomático.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O ponto e vírgula conserva a unidade do pronunciamento, e as notas são colocadas exatamente junto às expressões que esclarecem.
