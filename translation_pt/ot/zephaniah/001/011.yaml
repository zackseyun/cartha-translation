source:
  edition: WLC
  text: הֵילִ֖ילוּ יֹשְׁבֵ֣י הַ/מַּכְתֵּ֑שׁ כִּ֤י נִדְמָה֙ כָּל עַ֣ם כְּנַ֔עַן נִכְרְת֖וּ כָּל נְטִ֥ילֵי כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/011.yaml
  text: Wail[a], inhabitants of the Mortar, for all the merchant people are destroyed[b]; all who weigh out silver are cut off.
translation:
  language: pt
  text: Lamentem, moradores do Almofariz[a], pois todo o povo de mercadores foi destruído[b]; todos os que pesam prata foram eliminados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, Maktesh, literalmente “almofariz”; provavelmente era o nome de um bairro comercial de Jerusalém, talvez assim chamado por ficar numa depressão do terreno.
    reason: alternative_reading
  - marker: b
    text: Ou “todo o povo de Canaã”. Aqui, “Canaã” provavelmente tem o sentido de “mercadores”, um uso hebraico conhecido em contextos comerciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Lamentem
  rationale: O imperativo plural de ילל expressa um clamor intenso de dor diante do desastre; “Lamentem” é natural, digno e adequado à linguagem profética.
- source_word: יֹשְׁבֵי
  choice: moradores do
  rationale: O particípio em construto de ישב designa coletivamente os que habitam o lugar; “moradores” é claro e corrente em português.
- source_word: הַמַּכְתֵּשׁ
  choice: o Pilão
  rationale: O termo significa literalmente “pilão” ou “almofariz” e provavelmente funciona como nome de um bairro de Jerusalém; a inicial maiúscula preserva esse valor toponímico sem ocultar o sentido hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do lamento e mantém de modo conciso a relação causal.
- source_word: נִדְמָה
  choice: foi destruído
  rationale: O nifal de דמה pode indicar ser reduzido ao silêncio, arruinado ou destruído. Neste contexto de juízo, “foi destruído” corresponde ao paralelismo com נִכְרְתוּ, preservando o singular do coletivo עַם.
- source_word: כָּל עַם כְּנַעַן
  choice: todo o povo de mercadores
  rationale: כְּנַעַן pode significar literalmente “Canaã”, mas em contextos comerciais também designa mercadores. A referência à prata favorece o sentido mercantil, enquanto “povo” preserva עַם.
- source_word: נִכְרְתוּ
  choice: foram eliminados
  rationale: O nifal de כרת significa ser cortado ou eliminado. “Foram eliminados” comunica com naturalidade a fórmula de juízo sem repetir “destruído”.
- source_word: כָּל נְטִילֵי כָסֶף
  choice: todos os que pesam prata
  rationale: No contexto comercial, a expressão provavelmente se refere aos que pesavam prata nas transações, quando o metal funcionava como meio de pagamento; a tradução mantém a imagem concreta.
