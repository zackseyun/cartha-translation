base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/018.yaml
  text: Neither their silver nor their gold will be able to deliver them on the day of Yahweh’s wrath[a], and in the fire of his jealousy all the earth will be consumed; for he will make a complete, indeed sudden[c][b], end of all the inhabitants of the earth.
translation:
  language: pt
  text: Nem a prata deles nem o ouro deles poderão livrá-los no dia da ira de Yahweh; e, no fogo do seu ciúme[a], toda a terra[b] será consumida, pois ele dará um fim completo — sim, repentino[c] — a todos os habitantes da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no fogo do seu zelo”. O termo hebraico pode expressar tanto ciúme quanto zelo ardente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todo o país” e “todos os habitantes do país”. A palavra hebraica אֶרֶץ pode significar “terra”, em sentido amplo, ou “país/território”.'
    reason: alternative_reading
  - marker: c
    text: 'A expressão hebraica é difícil. Outras traduções possíveis incluem: “um fim completo — sim, aterrador” e “um fim total e terrível”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם ... לֹא
  choice: Nem ... nem ... poderá
  rationale: A construção correlativa, seguida de negação, exclui enfaticamente tanto a prata quanto o ouro como meios de livramento.
- source_word: כַּסְפָּם ... זְהָבָם
  choice: a prata ... o ouro deles
  rationale: Os termos designam aqui os metais preciosos e, por extensão, a riqueza; a associação entre ambos favorece o sentido material.
- source_word: יוּכַל לְהַצִּילָם
  choice: poderá livrá-los
  rationale: Preserva tanto a ideia explícita de capacidade quanto o sentido de resgate diante do juízo.
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: no dia da ira de Yahweh
  rationale: עֶבְרָה expressa ira intensa, e o nome divino é transliterado como Yahweh.
- source_word: וּבְאֵשׁ קִנְאָתוֹ
  choice: No fogo do seu zelo ciumento
  rationale: קִנְאָה pode indicar ciúme ou zelo. A expressão portuguesa reúne os dois matizes sem reduzir o termo apenas a emoção possessiva nem apenas a ardor abstrato.
- source_word: תֵּאָכֵל
  choice: será consumida
  rationale: A forma passiva combina naturalmente com a imagem do fogo e comunica destruição completa.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: אֶרֶץ admite tanto 'terra' em sentido amplo quanto 'território'. A tradução mantém a amplitude sem eliminar a ambiguidade, explicitada em nota.
- source_word: כָּלָה אַךְ נִבְהָלָה
  choice: um fim completo — sim, repentino
  rationale: A expressão hebraica é difícil. כָּלָה comunica término total; אַךְ intensifica; נִבְהָלָה pode sugerir rapidez súbita ou caráter aterrador. O texto principal adota 'repentino' e registra a alternativa.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Tradução direta que preserva a repetição de אֶרֶץ e a abrangência retórica do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino; a transliteração o distingue de um título e segue a orientação lexical fornecida.
- issue: Sentido de קִנְאָה aplicado a Deus
  choice: zelo ciumento
  alternative: ciúme; zelo
  rationale: A formulação preserva simultaneamente a exclusividade relacional da aliança e o ardor ativo, sem resolver indevidamente a polissemia.
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país; território
  rationale: A linguagem abrangente pode apontar para toda a terra, mas o contexto profético também permite referência ao território em julgamento. A tradução e a nota conservam essa tensão.
- issue: Sentido de נִבְהָלָה
  choice: repentino
  alternative: aterrador
  rationale: A forma é lexicalmente difícil e pode caracterizar o fim como súbito ou pavoroso. Adota-se uma leitura provável no texto e mantém-se a outra em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Mantém-se 'Yahweh' como nome próprio. A expressão 'zelo ciumento' é deliberadamente marcada para conservar a sobreposição semântica do hebraico. Os travessões reproduzem a intensificação da cláusula final.
