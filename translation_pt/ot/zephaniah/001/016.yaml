translation:
  language: pt
  text: dia de toque de trombeta e grito de guerra[a] contra as cidades fortificadas e contra as altas fortificações nos cantos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dia de toque de trombeta e alarme» ou «dia de toque de trombeta e clamor». O termo hebraico traduzido como «grito de guerra» pode indicar um forte clamor, um sinal de alarme ou um brado de guerra; o sentido militar é favorecido pelo contexto de ataque a cidades fortificadas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «os cantos altos». É provável que a expressão se refira a fortificações elevadas nos cantos das muralhas das cidades, possivelmente torres de esquina.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹם
  choice: dia de
  rationale: Mantém a sequência de descrições em aposição do dia do SENHOR no contexto imediato; em português, a expressão sem artigo é natural nessa enumeração.
- source_word: שׁוֹפָר
  choice: toque de trombeta
  rationale: O termo designa o chifre usado como instrumento de sinalização; «toque de trombeta» comunica naturalmente tanto o instrumento quanto seu som de alarme.
- source_word: תְרוּעָה
  choice: grito de guerra
  rationale: Pode indicar clamor, alarme ou brado; o contexto de ataque a cidades fortificadas favorece o sentido militar, sem eliminar as outras possibilidades, registradas em nota.
- source_word: עַל
  choice: contra
  rationale: No quadro de ataque e juízo, expressa de modo claro a força hostil da preposição.
- source_word: הֶעָרִים הַבְּצֻרוֹת
  choice: as cidades fortificadas
  rationale: Tradução direta e corrente da expressão que descreve cidades protegidas por obras defensivas.
- source_word: הַפִּנּוֹת הַגְּבֹהוֹת
  choice: as altas fortificações de esquina
  rationale: «Esquinas/cantos» provavelmente designa, por metonímia, estruturas defensivas elevadas nos cantos das muralhas; esta formulação evita especificar indevidamente que eram torres.
