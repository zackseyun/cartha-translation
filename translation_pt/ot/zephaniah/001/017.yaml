id: ZEP.1.17
reference: Zephaniah 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/הֲצֵרֹ֣תִי לָ/אָדָ֗ם וְ/הָֽלְכוּ֙ כַּֽ/עִוְרִ֔ים כִּ֥י לַֽ/יהוָ֖ה חָטָ֑אוּ וְ/שֻׁפַּ֤ךְ דָּמָ/ם֙ כֶּֽ/עָפָ֔ר וּ/לְחֻמָ֖/ם כַּ/גְּלָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/017.yaml
  text: And I will bring distress on mankind[a], and they will walk like the blind, because they have sinned against Yahweh; their blood will be poured out like dust[b], and their flesh like dung.
translation:
  language: pt
  text: Trarei angústia sobre a humanidade[a], e eles andarão como cegos, porque pecaram contra Yahweh. Seu sangue será derramado como pó, e sua carne[b], como esterco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o gênero humano”. O hebraico traz “ser humano” no singular, empregado aqui em sentido coletivo.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas entranhas” ou “seus intestinos”; o termo hebraico é raro e sua acepção exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצֵרֹתִי
  choice: Trarei angústia
  rationale: O hifil de צרר expressa causar aflição ou aperto. A formulação mantém a ação divina e o tom de juízo em português natural.
- source_word: לָאָדָם
  choice: sobre a humanidade
  rationale: אָדָם está no singular, mas tem sentido coletivo neste contexto; “a humanidade” comunica esse alcance sem restringi-lo ao sexo masculino.
- source_word: וְהָלְכוּ כַּעִוְרִים
  choice: e eles andarão como cegos
  rationale: Preserva o verbo concreto הלך e a imagem de desorientação e impotência presente na comparação.
- source_word: כִּי לַיהוָה חָטָאוּ
  choice: porque pecaram contra Yahweh
  rationale: כִּי introduz a causa do juízo, e חטא com ל indica pecado cometido contra alguém. O nome divino é transliterado como “Yahweh”.
- source_word: וְשֻׁפַּךְ דָּמָם כֶּעָפָר
  choice: Seu sangue será derramado como pó
  rationale: Mantém a construção passiva, a violência da imagem judicial e a comparação com עָפָר, “pó”.
- source_word: וּלְחֻמָם
  choice: sua carne
  rationale: O termo é raro e discutido; “carne” se ajusta ao paralelismo com “sangue” e preserva uma leitura abrangente, enquanto a alternativa mais anatômica é registrada em nota.
- source_word: כַּגְּלָלִים
  choice: como esterco
  rationale: גְּלָלִים designa esterco ou excremento. “Esterco” conserva a força depreciativa da imagem sem recorrer a linguagem técnica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pactual e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido coletivo de אָדָם
  choice: a humanidade
  alternative: o ser humano; o homem
  rationale: Embora a forma hebraica seja singular, a retomada no plural e o contexto indicam referência coletiva. “A humanidade” torna esse valor claro e natural.
- issue: Identificação de לְחֻמָם
  choice: sua carne
  alternative: suas entranhas; seus intestinos
  rationale: A palavra admite análise lexical incerta. O texto principal adota a leitura abrangente “carne”, mas a nota conserva a possibilidade de uma referência específica às entranhas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva as imagens concretas e severas do juízo. O pronome plural “eles” explicita a retomada plural presente no hebraico após o coletivo “humanidade”.
