  text: וּ/פָקַדְתִּ֗י עַ֧ל כָּל הַ/דּוֹלֵ֛ג עַל הַ/מִּפְתָּ֖ן בַּ/יּ֣וֹם הַ/ה֑וּא הַֽ/מְמַלְאִ֛ים בֵּ֥ית אֲדֹנֵי/הֶ֖ם חָמָ֥ס וּ/מִרְמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/009.yaml
  text: And on that day I will punish all who leap over the threshold[b][a], who fill their masters’ house with violence and deceit.
translation:
  language: pt
  text: Naquele dia, castigarei todos os que saltam por cima da soleira[a] e enchem a casa de seus senhores[b] de violência e engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dão um pulo por cima da soleira”. A expressão pode se referir a uma prática ritual ou supersticiosa conhecida, talvez relacionada ao tabu da soleira em 1 Samuel 5:5; outros a entendem figuradamente como referência a invasores violentos.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “a casa de seus senhores”. Algumas traduções trazem “a casa de seu senhor” ou “a casa do Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: castigarei
  rationale: Em contextos proféticos de juízo, פקד frequentemente significa chamar alguém a prestar contas ou puni-lo. “Castigarei” comunica essa força judicial de modo claro e natural.
- source_word: הַדּוֹלֵג עַל הַמִּפְתָּן
  choice: os que saltam por cima da soleira
  rationale: דָּלַג descreve saltar ou dar um pulo. A formulação concreta preserva a imagem vívida e a ambiguidade cultural da expressão, sem impor uma interpretação ritual ou figurada.
- source_word: הַמִּפְתָּן
  choice: a soleira
  rationale: מִפְתָּן designa a parte inferior do vão de uma porta. “Soleira” é o equivalente português preciso e corrente.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: É a formulação profética temporal habitual; “naquele dia” é idiomático em português e conserva o tom de juízo.
- source_word: הַמְמַלְאִים
  choice: e enchem
  rationale: O particípio caracteriza o mesmo grupo por uma ação habitual. A coordenação produz uma frase natural em português sem perder essa relação.
- source_word: בֵּית אֲדֹנֵיהֶם
  choice: a casa de seus senhores
  rationale: אֲדֹנֵיהֶם tem forma plural com sufixo de terceira pessoa do plural. “Seus senhores” respeita essa morfologia e evita sugerir, sem apoio explícito, um referente divino singular.
- source_word: חָמָס
  choice: violência
  rationale: חָמָס denota violência, opressão ou grave injustiça. “Violência” é a correspondência mais direta e preserva sua amplitude moral.
- source_word: מִרְמָה
  choice: engano
  rationale: מִרְמָה pode indicar engano, fraude ou traição. “Engano” mantém a categoria moral sem especificar além do que o texto afirma.
theological_decisions:
- issue: Sentido de “saltar por cima da soleira”
  choice: Manter no texto principal a imagem literal de uma prática concreta.
  alternative: Explicá-la como tabu ritual ligado a 1 Samuel 5:5 ou como descrição figurada de invasores violentos.
  rationale: A expressão hebraica é culturalmente obscura e o próprio versículo não explica a prática. A tradução deve conservar essa ambiguidade, deixando as principais possibilidades para a nota.
- issue: Referente de “a casa de seus senhores”
  choice: Traduzir a forma plural diretamente como “a casa de seus senhores”.
  alternative: “A casa de seu senhor” ou “a casa do Senhor”.
  rationale: A morfologia hebraica favorece o possessivo plural, e o texto não identifica aqui um referente divino. A tradução não deve introduzir essa identificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a imagem concreta, a força judicial e as ambiguidades do hebraico.
