  text: י֥וֹם עֶבְרָ֖ה הַ/יּ֣וֹם הַ/ה֑וּא י֧וֹם צָרָ֣ה וּ/מְצוּקָ֗ה י֤וֹם שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה י֥וֹם חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/015.yaml
  text: That day is a day of wrath[a], a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom[c][b], a day of clouds and thick darkness.
translation:
  language: pt
  text: Aquele dia será dia de ira[a], dia de aflição e angústia, dia de ruína e devastação, dia de escuridão e trevas, dia de nuvens e densa escuridão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dia de furor”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dia de nuvem e densa escuridão”; os substantivos aparecem no singular na sequência poética.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם עֶבְרָ֖ה
  choice: dia de ira
  rationale: עֶבְרָה expressa ira intensa ou furor. “Ira” é natural, solene e adequado ao contexto profético de juízo.
- source_word: הַ/יּ֣וֹם הַ/ה֑וּא
  choice: Aquele dia
  rationale: A expressão demonstrativa aponta enfaticamente para o dia específico já em vista; “Aquele dia” preserva essa referência de modo idiomático.
- source_word: צָרָ֣ה וּ/מְצוּקָ֗ה
  choice: aflição e angústia
  rationale: צָרָה indica aflição ou adversidade, enquanto מְצוּקָה comunica aperto e pressão severa. O par mantém a intensificação poética sem fundir os termos.
- source_word: שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה
  choice: ruína e devastação
  rationale: Os substantivos próximos acumulam imagens de destruição catastrófica; “ruína e devastação” conserva o paralelismo sinonímico.
- source_word: חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה
  choice: escuridão e trevas
  rationale: חֹשֶׁךְ significa escuridão, e אֲפֵלָה denota trevas profundas ou obscuridade. A combinação é corrente e preserva a intensificação.
- source_word: עָנָ֖ן וַ/עֲרָפֶֽל
  choice: nuvens e densa escuridão
  rationale: Embora עָנָן esteja no singular, o plural “nuvens” é natural em português neste quadro atmosférico. עֲרָפֶל pode designar escuridão espessa ou nuvem sombria; “densa escuridão” mantém sua força culminante.
theological_decisions:
- issue: Natureza do “dia” na linguagem profética de juízo
  choice: Manter a estrutura repetida “dia de...” como descrição do dia do juízo do SENHOR, sem determinar um referente exclusivamente histórico ou exclusivamente escatológico.
  alternative: Restringir o texto ao juízo histórico sobre Judá ou exclusivamente ao juízo escatológico final.
  rationale: O hebraico acumula descrições poéticas, mas não resolve neste versículo se o referente é próximo, tipológico ou final. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição de “dia de” reproduz a cadência enfática do hebraico. “Será” torna natural em português a predicação nominal hebraica sem restringir o sentido profético.
