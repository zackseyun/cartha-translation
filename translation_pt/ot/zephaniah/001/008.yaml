base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/008.yaml
  text: And on the day of Yahweh’s sacrifice[a], I will punish the officials, the king’s sons[c][b], and all who wear foreign clothing.
translation:
  language: pt
  text: E acontecerá que, no dia do sacrifício de Yahweh[a], castigarei as autoridades[b], os filhos do rei e todos os que vestem trajes estrangeiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser vertida “o sacrifício de Yahweh”; no contexto, pode evocar um banquete sacrificial preparado por Yahweh para o juízo; compare Sofonias 1:7.
    reason: alternativa lexical e ambiguidade contextual
  - marker: b
    text: Ou “os príncipes” ou “os governantes”.
    reason: alternativa lexical
  - marker: c
    text: Isto é, trajes associados a povos estrangeiros. A expressão pode sugerir a adoção de costumes ou lealdades estrangeiras, não apenas o uso de tecido vindo de outro país.
    reason: nota cultural
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Preserva a fórmula hebraica que introduz um acontecimento futuro, em linguagem portuguesa clara e solene.
- source_word: בְּיוֹם
  choice: no dia
  rationale: É a correspondência temporal direta e natural em português.
- source_word: זֶבַח יְהוָה
  choice: o sacrifício de Yahweh
  rationale: 'Mantém a relação genitiva concisa do hebraico e sua possível amplitude: o sacrifício pertencente a Yahweh ou preparado por ele no cenário de juízo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּפָקַדְתִּי עַל
  choice: castigarei
  rationale: Neste contexto de juízo, פקד com עַל indica uma intervenção punitiva; 'castigarei' comunica esse sentido com clareza.
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: שׂרים designa pessoas de alto escalão político ou governamental. 'Autoridades' evita que 'oficiais' seja entendido apenas em sentido militar e que 'príncipes' sugira necessariamente descendência real.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: os filhos do rei
  rationale: Reproduz diretamente a relação familiar e conserva a referência masculina do hebraico.
- source_word: כָּל הַלֹּבְשִׁים
  choice: todos os que vestem
  rationale: Transforma naturalmente o particípio hebraico em oração relativa, sem alterar sua abrangência.
- source_word: מַלְבּוּשׁ נָכְרִי
  choice: trajes estrangeiros
  rationale: Expressa de modo atual e digno a roupa associada a povos estrangeiros; 'trajes' também acomoda a possível dimensão cultural e social da expressão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal, sem substituí-lo por um título.
- issue: Sentido de זֶבַח יְהוָה
  choice: sacrifício de Yahweh
  alternative: sacrifício oferecido a Yahweh; banquete sacrificial preparado por Yahweh
  rationale: A construção hebraica é concisa, e o contexto de Sofonias 1:7 permite que Yahweh seja entendido como aquele que prepara o sacrifício de juízo. A tradução principal preserva a tensão, e a nota registra as possibilidades sem escolher silenciosamente entre elas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e profético, sem arcaísmos. 'Autoridades' evita uma leitura exclusivamente militar, e 'trajes estrangeiros' conserva tanto o sentido concreto quanto a possível conotação cultural.
