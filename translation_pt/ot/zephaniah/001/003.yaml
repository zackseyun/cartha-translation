source:
  edition: WLC
  text: אָסֵ֨ף אָדָ֜ם וּ/בְהֵמָ֗ה אָסֵ֤ף עוֹף הַ/שָּׁמַ֨יִם֙ וּ/דְגֵ֣י הַ/יָּ֔ם וְ/הַ/מַּכְשֵׁל֖וֹת אֶת הָ/רְשָׁעִ֑ים וְ/הִכְרַתִּ֣י אֶת הָ/אָדָ֗ם מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/003.yaml
  text: I will sweep away man and beast[a]; I will sweep away the birds of the heavens and the fish of the sea, and the stumbling blocks with the wicked[d][c][b]. And I will cut off man from the face of the ground,” declares Yahweh.
translation:
  language: pt
  text: '“Varrerei os seres humanos e os animais[a];

    varrerei as aves dos céus[b] e os peixes do mar,

    e as causas de tropeço junto com os perversos[c].

    Exterminarei os seres humanos da face do solo[d]”,

    declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ser humano e animal”, ambos empregados em sentido coletivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as aves do céu”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os obstáculos junto com os perversos”. A relação exata entre as “causas de tropeço” e os perversos é condensada no hebraico.'
    reason: textual_ambiguity
  - marker: d
    text: 'Ou: “da face da terra”. “Solo” pode evocar deliberadamente a linguagem de juízos anteriores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֵף
  choice: Varrerei
  rationale: No contexto de juízo, o hifil de אסף indica remoção abrangente, não simples ajuntamento. “Varrerei” preserva a força da imagem e a repetição enfática do hebraico.
- source_word: אָדָם
  choice: os seres humanos
  rationale: O substantivo é coletivo nas duas ocorrências e se refere à humanidade. A forma plural é natural e inclusiva em português sem perder o sentido representativo do hebraico.
- source_word: בְהֵמָה
  choice: os animais
  rationale: Aqui designa coletivamente os animais terrestres. “Animais” é mais corrente e abrangente em português moderno do que “bestas”.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves dos céus
  rationale: Mantém a construção hebraica e a ressonância da ordem da criação; “céus” conserva o plural da fonte.
- source_word: דְגֵי הַיָּם
  choice: os peixes do mar
  rationale: Equivalência direta que preserva a sequência terra, céus e mar.
- source_word: הַמַּכְשֵׁלוֹת
  choice: as causas de tropeço
  rationale: O termo denota aquilo que faz alguém tropeçar, literal ou figuradamente. A formulação evita identificar de modo indevido esses elementos como ídolos, ruínas ou outro referente específico.
- source_word: אֶת הָרְשָׁעִים
  choice: junto com os perversos
  rationale: A sintaxe é condensada. “Junto com” apresenta os perversos como também alcançados pelo juízo, sem definir rigidamente a relação sintática com “causas de tropeço”.
- source_word: וְהִכְרַתִּי
  choice: Exterminarei
  rationale: O hifil de כרת expressa a eliminação decisiva em contexto de juízo. “Exterminarei” comunica com naturalidade a força de “cortar/eliminar” em português.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face do solo
  rationale: Preserva o idioma hebraico “face de” e distingue אֲדָמָה, solo ou chão, do termo mais amplo para terra, mantendo possível eco da linguagem primeva de juízo.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Traduz a fórmula profética de modo solene e corrente, conservando o nome divino pessoal expresso no texto hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido coletivo de אָדָם
  choice: os seres humanos
  alternative: o homem; a humanidade
  rationale: Nas duas ocorrências, אָדָם tem referência coletiva. “Os seres humanos” torna esse alcance explícito sem introduzir distinção de sexo inexistente no juízo anunciado.
- issue: Relação entre הַמַּכְשֵׁלוֹת e הָרְשָׁעִים
  choice: as causas de tropeço junto com os perversos
  alternative: os obstáculos dos perversos; as causas de tropeço, isto é, os perversos
  rationale: A construção hebraica é comprimida e admite mais de uma análise. O texto principal mantém ambos sob o mesmo juízo sem tornar os perversos possuidores ou aposto das causas de tropeço.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com cadência profética preservada pela repetição de “Varrerei”. O paralelismo foi disposto em linhas para tornar visível a progressão do juízo sobre humanidade, animais, aves e peixes. As escolhas evitam arcaísmos como “bestas” e preservam a ambiguidade da expressão relativa às causas de tropeço e aos perversos.
