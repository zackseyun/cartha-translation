  text: אָסֹ֨ף אָסֵ֜ף כֹּ֗ל מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/002.yaml
  text: I will utterly sweep away everything from the face of the earth[a], declares Yahweh.
translation:
  language: pt
  text: “Vou remover completamente tudo da face da terra[a]”, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vou retirar por completo tudo da face do solo/território”. O hebraico emprega uma construção verbal enfática; literalmente: “Recolhendo, recolherei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֹף אָסֵף
  choice: Vou remover completamente
  rationale: A combinação do infinitivo absoluto com o verbo finito de אסף intensifica a certeza e a abrangência da ação. Neste contexto de juízo, “remover completamente” comunica a retirada total sem impor ao verbo uma imagem destrutiva mais específica do que o hebraico exige.
- source_word: כֹּל
  choice: tudo
  rationale: O termo é usado de modo absoluto e abrangente; “tudo” é natural em português e preserva seu alcance.
- source_word: מֵעַל פְּנֵי
  choice: da face de
  rationale: Mantém de forma compreensível a expressão hebraica que indica remoção da superfície da terra.
- source_word: הָאֲדָמָה
  choice: a terra
  rationale: אֲדָמָה também pode significar “solo” ou “território”. “Terra” preserva aqui a possível abrangência universal do anúncio, sem eliminar as alternativas em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética assinala uma declaração divina solene e autorizada; “declara” é atual, claro e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Alcance de הָאֲדָמָה
  choice: terra
  alternative: solo; território
  rationale: O anúncio inicial pode ter alcance universal, mas o substantivo admite sentidos mais concretos ou locais; a tradução principal usa “terra” e a nota conserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção enfática hebraica foi expressa idiomaticamente, enquanto a nota preserva tanto a forma literal quanto a ambiguidade de אֲדָמָה.
