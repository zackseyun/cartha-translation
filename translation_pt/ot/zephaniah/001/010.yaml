    rationale: Embora «ouvir-se-á» preserve a dimensão auditiva, «o som de um grito» representa explicitamente o substantivo קוֹל (“som/voz”) e mantém a estrutura da fonte.
  - severity: medium
    issue: A nota b traz «um grande quebrantamento» como alternativa para שבר גדול.
    rationale: «Quebrantamento» em português tende a significar aflição, contrição ou debilidade, e não a quebra, o desabamento ou a ruína expressos por שבר neste versículo.
  - severity: low
    issue: «Bairro Segundo» é uma ordem nominal pouco idiomática em português corrente.
    rationale: «Segundo Bairro» comunica com mais naturalidade a designação traduzida de Mishneh; a nota mantém o hebraico e a identificação histórica cautelosa.
