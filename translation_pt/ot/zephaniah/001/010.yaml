  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה ק֤וֹל צְעָקָה֙ מִ/שַּׁ֣עַר הַ/דָּגִ֔ים וִֽ/ילָלָ֖ה מִן הַ/מִּשְׁנֶ֑ה וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/הַ/גְּבָעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/010.yaml
  text: And on that day[a], declares Yahweh, there will be the sound of a cry from the Fish Gate, and a wail from the Second Quarter[c][b], and a great crash from the hills.
translation:
  language: pt
  text: Naquele dia, declara Yahweh, ouvir-se-á o som de um grito vindo da Porta dos Peixes, um lamento vindo do Segundo Bairro[a] e um grande estrondo vindo das colinas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Segundo Bairro” provavelmente era um distrito de Jerusalém; em hebraico, Mishneh.
    reason: cultural_note
  - marker: b
    text: Ou “uma grande destruição” ou “uma grande quebra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Naquele dia ... ouvir-se-á
  rationale: Reproduz com naturalidade a fórmula profética temporal e introduz a sequência de sons que serão ouvidos, sem o arcaísmo de uma tradução como “e acontecerá naquele dia”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula solene de oráculo profético e translitera o nome divino conforme a orientação do projeto.
- source_word: קוֹל צְעָקָה
  choice: um grito
  rationale: Em português, “ouvir-se-á um grito” comunica naturalmente tanto קוֹל, a voz ou som, quanto צְעָקָה, o clamor de aflição; “o som de um grito” seria possível, mas menos fluido.
- source_word: מִשַּׁעַר הַדָּגִים
  choice: vindo da Porta dos Peixes
  rationale: Trata a expressão como nome próprio de um portão de Jerusalém e explicita idiomaticamente a origem do som.
- source_word: וִילָלָה
  choice: um lamento
  rationale: Expressa um brado audível de dor e aflição com linguagem digna e corrente; “uivo” poderia sugerir indevidamente um som animal.
- source_word: מִן הַמִּשְׁנֶה
  choice: vindo do Bairro Segundo
  rationale: Entende Mishneh como o nome ou a designação de um setor de Jerusalém. “Bairro Segundo” é claro em português, enquanto a nota preserva a forma hebraica e a incerteza histórica.
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: um grande estrondo
  rationale: No paralelismo com grito e lamento, שֶׁבֶר provavelmente evoca o ruído de algo que se quebra ou desaba. “Estrondo” preserva essa dimensão sonora sem excluir a ideia de destruição.
- source_word: מֵהַגְּבָעוֹת
  choice: vindo das colinas
  rationale: Traduz o sentido comum de גְּבָעוֹת e mantém aberta a possibilidade de se referir às elevações da cidade ou de seus arredores.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. A forma “Yahweh” preserva a referência ao nome próprio da aliança sem substituí-lo por um título.
- issue: Força profética de בַּיּוֹם הַהוּא
  choice: Naquele dia
  alternative: No dia do juízo final
  rationale: A fórmula aponta para o dia de intervenção e juízo anunciado no contexto, mas a tradução não o identifica mais precisamente do que o próprio versículo permite.
translation_notes:
  register: Português contemporâneo, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção “ouvir-se-á” preserva a ênfase auditiva da sequência sem repetir “som”. Os marcadores foram colocados junto às expressões que efetivamente explicam.
