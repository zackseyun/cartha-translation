revisions:
- from: Naquele dia, declara Yahweh, ouvir-se-á um grito vindo da Porta dos Peixes, um lamento vindo do Bairro Segundo[a] e um grande estrondo[b] vindo das colinas.
  to: Naquele dia, declara Yahweh, ouvir-se-á o som de um grito vindo da Porta dos Peixes, um lamento vindo do Segundo Bairro[a] e um grande estrondo vindo das colinas[b].
  rationale: A revisão explicita o «som» presente em קוֹל צְעָקָה, melhora a naturalidade da designação do distrito e substitui uma alternativa lexical enganosa por opções que preservam o campo semântico de quebra, colapso ou ruína de שבר. Os marcadores permanecem ligados às expressões que as notas explicam.
