id: ZEP.1.7
reference: Zephaniah 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ֕ס מִ/פְּנֵ֖י אֲדֹנָ֣/י יְהוִ֑ה כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה כִּֽי הֵכִ֧ין יְהוָ֛ה זֶ֖בַח הִקְדִּ֥ישׁ קְרֻאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/007.yaml
  text: Be silent before the Lord GOD[a], for the day of Yahweh is near; for Yahweh has prepared a sacrifice; he has consecrated his invited ones.
translation:
  language: pt
  text: Silêncio diante do Senhor Yahweh, pois o dia de Yahweh está próximo! Yahweh preparou um sacrifício e consagrou os seus convidados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que ele convocou”, “os seus chamados” ou “os seus hóspedes”. No contexto, provavelmente são aqueles que Yahweh convocou para o juízo retratado como sacrifício.
    reason: alternativa lexical e preservação da ambiguidade contextual
lexical_decisions:
- source_word: הַס
  choice: Silêncio
  rationale: A interjeição exige silêncio com força solene e imediata. “Silêncio” é natural em português e evita acrescentar número gramatical ao imperativo.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Neste contexto, indica presença e reverência perante a autoridade divina; “diante de” é conciso e idiomático.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי como o nome divino יְהוִה, sem produzir a repetição artificial “Senhor SENHOR”.
- source_word: כִּי
  choice: pois / relação causal expressa pela sequência da frase
  rationale: A primeira ocorrência fundamenta a ordem de silêncio. Na segunda, a justaposição em português evita a repetição pesada de “pois”, mantendo clara a progressão causal.
- source_word: קָרוֹב
  choice: está próximo
  rationale: Expressa de forma direta a iminência do acontecimento profético.
- source_word: יוֹם יְהוָה
  choice: o dia de Yahweh
  rationale: Mantém a expressão profética e verte diretamente o nome divino.
- source_word: הֵכִין
  choice: preparou
  rationale: O perfeito hebraico apresenta a preparação como realizada e certa; o pretérito perfeito transmite isso naturalmente.
- source_word: זֶבַח
  choice: um sacrifício
  rationale: Conserva a imagem cultual e sombria sem explicitar no texto quem será sacrificado.
- source_word: הִקְדִּישׁ
  choice: consagrou
  rationale: Preserva o sentido cultual de separar ou tornar santo, em paralelo com a imagem do sacrifício.
- source_word: קְרֻאָיו
  choice: os seus convidados
  rationale: O particípio passivo pode designar os chamados ou convidados. “Convidados” preserva a possível imagem de um banquete sacrificial sem identificar prematuramente o papel deles.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino no título composto e na expressão profética “dia de Yahweh”.
- issue: Identidade dos קְרֻאָיו na imagem sacrificial
  choice: Manter “os seus convidados” sem identificá-los no texto principal
  alternative: Identificá-los explicitamente como agentes estrangeiros do juízo ou como vítimas
  rationale: O hebraico não define aqui de modo inequívoco a função dos chamados. A tradução conserva a ambiguidade e a tensão da metáfora.
translation_notes:
  register: Português moderno, solene e amplamente compreensível. A exclamação após “está próximo” comunica a urgência profética sem ampliar o conteúdo. O marcador [a] foi colocado após “convidados”, termo ao qual a nota efetivamente se refere.
