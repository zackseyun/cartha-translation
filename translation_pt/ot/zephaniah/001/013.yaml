  text: וְ/הָיָ֤ה חֵילָ/ם֙ לִ/מְשִׁסָּ֔ה וּ/בָתֵּי/הֶ֖ם לִ/שְׁמָמָ֑ה וּ/בָנ֤וּ בָתִּים֙ וְ/לֹ֣א יֵשֵׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/לֹ֥א יִשְׁתּ֖וּ אֶת יֵינָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/013.yaml
  text: Their wealth will become plunder[a], and their houses a desolation; they will build houses but not inhabit them[b], and plant vineyards but not drink their wine.
translation:
  language: pt
  text: A riqueza deles se tornará despojo[a], e as suas casas, uma desolação[b]. Construirão casas, mas não morarão nelas; plantarão vinhedos, mas não beberão o seu vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os bens deles”; neste contexto, é menos provável: “a força deles” ou “o exército deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz uma expressão compacta: “as suas casas, uma desolação”, isto é, suas casas ficarão arruinadas e desertas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: a riqueza deles
  rationale: חַיִל pode significar força, recursos, riqueza ou exército. O paralelismo com casas e vinhedos favorece aqui o sentido de bens ou recursos materiais.
- source_word: לִמְשִׁסָּה
  choice: se tornará despojo
  rationale: A construção indica resultado, e מְשִׁסָּה designa aquilo que é tomado por saque. “Despojo” conserva a imagem concreta e o tom de juízo.
- source_word: וּבָתֵּיהֶם לִשְׁמָמָה
  choice: e as suas casas, uma desolação
  rationale: A frase nominal hebraica é compacta e indica o estado resultante das casas. A elipse do verbo em português preserva sua força abrupta.
- source_word: וּבָנוּ בָתִּים וְלֹא יֵשֵׁבוּ
  choice: Construirão casas, mas não morarão nelas
  rationale: No contexto profético, as formas expressam acontecimentos futuros. “Morarão nelas” é natural em português e explicita apenas o referente já presente, as casas.
- source_word: וְנָטְעוּ כְרָמִים וְלֹא יִשְׁתּוּ אֶת יֵינָם
  choice: plantarão vinhedos, mas não beberão o seu vinho
  rationale: A tradução mantém o paralelismo e a ironia de não desfrutarem o fruto do próprio trabalho. “Seu vinho” preserva a forma possessiva do hebraico.
