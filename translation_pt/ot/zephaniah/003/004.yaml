id: ZEP.3.4
reference: Zephaniah 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נְבִיאֶ֨י/הָ֙ פֹּֽחֲזִ֔ים אַנְשֵׁ֖י בֹּֽגְד֑וֹת כֹּהֲנֶ֨י/הָ֙ חִלְּלוּ קֹ֔דֶשׁ חָמְס֖וּ תּוֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/004.yaml
  text: Her prophets are reckless[a], treacherous men; her priests have profaned the holy[b]; they have done violence to the law.
translation:
  language: pt
  text: Seus profetas são imprudentes, homens traiçoeiros; seus sacerdotes profanam o que é santo[a] e violam a lei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o santuário” ou “as coisas santas”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “a instrução” (hebraico: torá).'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֶיהָ
  choice: seus profetas
  rationale: O plural construto com sufixo de terceira pessoa feminina singular refere-se à cidade personificada; “seus profetas” preserva de modo natural essa relação.
- source_word: פֹּחֲזִים
  choice: imprudentes
  rationale: O termo descreve conduta precipitada, desenfreada e moralmente instável. “Imprudentes” é atual e claro, sem restringir o sentido a arrogância ou instabilidade.
- source_word: אַנְשֵׁי בֹּגְדוֹת
  choice: homens traiçoeiros
  rationale: A expressão é literalmente “homens de traições”; a forma escolhida é idiomática e conserva tanto o elemento masculino explícito quanto a ideia de traição habitual.
- source_word: כֹּהֲנֶיהָ
  choice: seus sacerdotes
  rationale: Mantém o plural com sufixo feminino singular e o paralelismo com “seus profetas”.
- source_word: חִלְּלוּ
  choice: profanam
  rationale: No contexto cultual, o piel de חלל significa profanar ou dessacralizar. O presente português exprime naturalmente a denúncia profética hebraica, cujo perfeito apresenta as ações como constatadas.
- source_word: קֹדֶשׁ
  choice: o que é santo
  rationale: O substantivo pode indicar a esfera sagrada, coisas santas ou o santuário. A formulação ampla preserva a indeterminação do hebraico.
- source_word: חָמְסוּ
  choice: violam
  rationale: O verbo comunica violência, injustiça ou violação. “Violam a lei” mantém a força da acusação em português natural, embora seja menos imagético que “fazem violência à lei”.
- source_word: תּוֹרָה
  choice: a lei
  rationale: No contexto sacerdotal e pactual, “a lei” comunica adequadamente תּוֹרָה aos leitores modernos; “instrução” permanece uma alternativa lexical válida.
theological_decisions:
- issue: Amplitude de קֹדֶשׁ na acusação contra os sacerdotes
  choice: o que é santo
  alternative: o santuário; as coisas santas
  rationale: O hebraico não especifica exclusivamente o edifício do santuário. A tradução ampla conserva a ambiguidade e evita limitar a acusação sem apoio textual.
- issue: Sentido de תּוֹרָה
  choice: a lei
  alternative: a instrução
  rationale: A referência pode abranger instrução, mas o contexto dos sacerdotes favorece a dimensão normativa e pactual sem excluir totalmente o campo semântico mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela da denúncia foi preservada. Os marcadores foram posicionados nos termos realmente explicados pelas notas, corrigindo a aparente inversão presente na camada inglesa fornecida.
