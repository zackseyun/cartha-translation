  text: שָׂרֶ֣י/הָ בְ/קִרְבָּ֔/הּ אֲרָי֖וֹת שֹֽׁאֲגִ֑ים שֹׁפְטֶ֨י/הָ֙ זְאֵ֣בֵי עֶ֔רֶב לֹ֥א גָרְמ֖וּ לַ/בֹּֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/003.yaml
  text: Her officials within her are roaring lions[a]; her judges are evening wolves that leave nothing for the morning.
translation:
  language: pt
  text: No meio dela, seus líderes são leões que rugem; seus juízes são lobos do entardecer, que não deixam nada para a manhã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conservando a imagem hebraica: “não deixam osso algum para a manhã”. A expressão retrata um consumo voraz e total.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: seus líderes
  rationale: שַׂר pode designar príncipe, chefe, governante ou autoridade. “Líderes” comunica de modo natural as autoridades dirigentes da cidade sem sugerir necessariamente membros da família real.
- source_word: בְקִרְבָּהּ
  choice: no meio dela
  rationale: A expressão indica o interior ou o meio da cidade personificada; a formulação preserva essa imagem com clareza em português.
- source_word: אֲרָיוֹת שֹׁאֲגִים
  choice: leões que rugem
  rationale: A oração nominal com particípio retrata os líderes como predadores ameaçadores em plena atividade; “que rugem” é natural e mantém a força da imagem.
- source_word: שֹׁפְטֶיהָ
  choice: seus juízes
  rationale: Tradução direta do termo para as autoridades judiciais.
- source_word: זְאֵבֵי עֶרֶב
  choice: lobos do entardecer
  rationale: A construção significa literalmente “lobos da tarde/do entardecer” e evoca predadores que saem famintos quando cai a noite.
- source_word: לֹא גָרְמוּ לַבֹּקֶר
  choice: não deixam nada para a manhã
  rationale: A expressão hebraica é difícil e está ligada à ideia de roer ossos. No contexto, comunica consumo voraz e completo; esta formulação transmite o sentido de modo claro, deixando a imagem óssea na nota.
