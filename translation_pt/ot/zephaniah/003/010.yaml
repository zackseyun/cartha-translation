  text: מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כ֑וּשׁ עֲתָרַ/י֙ בַּת פוּצַ֔/י יוֹבִל֖וּ/ן מִנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/010.yaml
  text: From beyond the rivers of Cush, my worshipers, the daughter of my dispersed ones, will bring my offering.
translation:
  language: pt
  text: De além dos rios de Cuxe[c], os que me suplicam[a], a filha dos meus dispersos[b], trarão a minha oferta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus adoradores”. O termo hebraico provavelmente designa os que oram ou suplicam e, por extensão, os que adoram.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a filha dos meus espalhados”. A expressão hebraica é compacta e pode funcionar como título poético de uma comunidade dispersa.'
    reason: alternative_reading
  - marker: c
    text: “Cuxe” designa a antiga região ao sul do Egito; não corresponde precisamente à Etiópia moderna.
    reason: cultural_note
lexical_decisions:
- source_word: מֵעֵבֶר
  choice: do outro lado de
  rationale: Expressa a origem situada além ou na margem oposta de um limite geográfico, sem acrescentar uma ideia de distância que o hebraico não exige.
- source_word: לְנַהֲרֵי כוּשׁ
  choice: dos rios de Cuxe
  rationale: Mantém o nome histórico Cuxe, cujo referente antigo não corresponde exatamente a um país moderno, e traduz naturalmente o plural construto נַהֲרֵי.
- source_word: עֲתָרַי
  choice: os que me suplicam
  rationale: Reflete de modo transparente o sentido provável de pessoas que oram ou dirigem súplicas a Deus, sem ampliar o termo para a noção mais geral de adoradores.
- source_word: בַּת
  choice: a filha de
  rationale: Preserva a personificação coletiva e a imagem poética compacta do hebraico, em vez de substituí-la por uma paráfrase explicativa.
- source_word: פוּצַי
  choice: meus dispersos
  rationale: Conserva tanto a ideia de dispersão quanto a relação possessiva, sem decidir se são apenas pessoas pertencentes ao Senhor ou pessoas dispersas por ele.
- source_word: יוֹבִלוּן
  choice: trarão
  rationale: Com uma oferta como objeto, 'trarão' é a forma portuguesa mais natural de expressar o movimento causativo do Hifil de יבל.
- source_word: מִנְחָתִי
  choice: minha oferta
  rationale: Abrange o sentido religioso de uma dádiva apresentada a Deus sem restringi-la indevidamente a uma modalidade sacrificial específica.
theological_decisions:
- issue: Relação sintática de עֲתָרַי בַּת פוּצַי
  choice: 'A sequência é mantida como uma descrição poética em aposição: ''os que me suplicam, a filha dos meus dispersos''.'
  alternative: Entender a expressão como dois grupos distintos, ou parafrasear בַּת como 'comunidade/povo' dos dispersos.
  rationale: O hebraico é compacto e sintaticamente difícil. A tradução conserva a tensão entre o plural do primeiro termo e a personificação coletiva feminina do segundo, sem impor uma solução interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva deliberadamente a imagem poética e a sintaxe tensa do hebraico, enquanto 'os que me suplicam' comunica com clareza o valor lexical de עֲתָרַי.
