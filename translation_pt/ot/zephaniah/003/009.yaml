  text: כִּֽי אָ֛ז אֶהְפֹּ֥ךְ אֶל עַמִּ֖ים שָׂפָ֣ה בְרוּרָ֑ה לִ/קְרֹ֤א כֻלָּ/ם֙ בְּ/שֵׁ֣ם יְהוָ֔ה לְ/עָבְד֖/וֹ שְׁכֶ֥ם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/009.yaml
  text: For then I will change the speech of the peoples to a pure speech[c][b][a], so that all of them may call on the name of Yahweh and serve him with one accord.
translation:
  language: pt
  text: Pois então transformarei a fala dos povos em fala pura[a], para que todos invoquem o nome de Yahweh e o sirvam ombro a ombro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “transformarei para os povos um lábio puro”. A expressão pode indicar lábios purificados, fala pura ou uma linguagem pura restaurada.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “com um só ombro”; isto é, unidos no serviço ou agindo ombro a ombro.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְפֹּךְ
  choice: darei
  rationale: Na construção אֶהְפֹּךְ אֶל־עַמִּים, o verbo expressa a ação divina de mudar a condição dos povos; em português, “darei aos povos lábios puros” reproduz naturalmente a construção resultativa sem sugerir destruição.
- source_word: עַמִּים
  choice: os povos
  rationale: Mantém o plural e o alcance multiétnico do hebraico, sem a conotação predominantemente política de “nações”.
- source_word: שָׂפָה בְרוּרָה
  choice: lábios puros
  rationale: “Lábios” preserva a imagem corporal do singular hebraico coletivo שָׂפָה, enquanto “puros” comunica a dimensão moral e cultual de בְרוּרָה. A nota registra que a expressão também pode referir-se à fala ou linguagem purificada.
- source_word: לִקְרֹא ... בְּשֵׁם יְהוָה
  choice: para que todos invoquem o nome de Yahweh
  rationale: “Invocar o nome” é uma expressão portuguesa natural para a invocação em adoração; a construção final com לְ é representada por “para que”.
- source_word: לְעָבְדוֹ
  choice: e o sirvam
  rationale: “Servir” preserva a amplitude de עבד, que aqui inclui adoração, mas não se limita à atividade litúrgica.
- source_word: שְׁכֶם אֶחָד
  choice: ombro a ombro
  rationale: A expressão traduz de modo inteligível a imagem literal “um só ombro” e comunica serviço unido sem eliminar a metáfora hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto apresenta diretamente o nome divino. “Yahweh” o representa como nome próprio e evita substituí-lo por um título; “Javé” é uma adaptação portuguesa tradicional, e “SENHOR” segue a convenção de muitas Bíblias.
- issue: Natureza da transformação prometida
  choice: darei aos povos lábios puros
  alternative: mudarei a fala dos povos para uma fala pura; devolverei aos povos uma linguagem pura
  rationale: A tradução mantém a metáfora dos lábios e deixa aberta a referência à purificação da fala, da linguagem ou da adoração, sem afirmar a restauração de uma única língua histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue sua ocorrência no texto. A metáfora “lábios puros” e a imagem “ombro a ombro” conservam elementos concretos do hebraico, apoiadas por notas para clareza.
