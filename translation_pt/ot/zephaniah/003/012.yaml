source:
  edition: WLC
  text: וְ/הִשְׁאַרְתִּ֣י בְ/קִרְבֵּ֔/ךְ עַ֥ם עָנִ֖י וָ/דָ֑ל וְ/חָס֖וּ בְּ/שֵׁ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/012.yaml
  text: But I will leave in your midst a people humble and lowly[a], and they will take refuge in the name of Yahweh.
translation:
  language: pt
  text: Mas deixarei no seu meio um povo humilde e pobre[a], e eles se refugiarão no nome de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um povo aflito e necessitado”, ou “um povo pobre e fraco”. Os termos hebraicos podem destacar tanto a aflição e a pobreza social quanto a humildade e a condição modesta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Mas deixarei
  rationale: O hifil de שׁאר expressa fazer permanecer ou deixar como remanescente. “Deixarei” é natural e mantém a ação divina; “mas” explicita o contraste contextual, embora o waw isoladamente também possa ser traduzido por “e”.
- source_word: בְקִרְבֵּךְ
  choice: no seu meio
  rationale: A expressão indica localização dentro da comunidade de Sião/Jerusalém, tratada no hebraico na segunda pessoa feminina singular. “No seu meio” é claro e preserva o referente coletivo.
- source_word: עַם
  choice: um povo
  rationale: Designa aqui um grupo coletivo que permanecerá em Jerusalém; “povo” é mais adequado que o sentido político de “nação”.
- source_word: עָנִי
  choice: humilde
  rationale: O termo pode significar aflito, pobre ou humilde. “Humilde” comunica a condição rebaixada e a postura de dependência, sem eliminar os sentidos sociais, registrados na nota.
- source_word: וָדָל
  choice: e pobre
  rationale: דַּל denota alguém pobre, fraco ou de condição baixa. “Pobre” preserva de modo mais direto a dimensão material e social do termo, enquanto a combinação com “humilde” mantém a amplitude do par hebraico.
- source_word: וְחָסוּ
  choice: e eles se refugiarão
  rationale: חסה traz a imagem de buscar abrigo ou proteção em Deus. “Se refugiarão” conserva essa metáfora melhor que o simples “confiarão”.
- source_word: בְּשֵׁם
  choice: no nome de
  rationale: A construção expressa recurso e confiança no caráter e na autoridade revelados de Deus. “No nome de” é uma formulação transparente e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal no texto, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de עָנִי וָדָל na descrição do remanescente
  choice: humilde e pobre
  alternative: aflito e necessitado; pobre e fraco; humilde e de condição modesta
  rationale: O par pode descrever tanto sofrimento e pobreza social quanto humildade e dependência de Deus. A tradução distribui essas dimensões entre os dois adjetivos, e a nota preserva explicitamente as alternativas sem reduzir a expressão a uma condição apenas espiritual ou apenas econômica.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: “Yahweh” representa o nome próprio hebraico e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo simples do hebraico e conserva a metáfora de buscar refúgio. O pronome “seu” retoma Sião/Jerusalém no contexto; o nome divino é transliterado como “Yahweh”.
