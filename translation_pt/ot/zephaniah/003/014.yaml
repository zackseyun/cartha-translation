  text: רָנִּי֙ בַּת צִיּ֔וֹן הָרִ֖יעוּ יִשְׂרָאֵ֑ל שִׂמְחִ֤י וְ/עָלְזִי֙ בְּ/כָל לֵ֔ב בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/014.yaml
  text: Sing for joy[a], daughter Zion; shout aloud, Israel! Rejoice and exult with all your heart, daughter Jerusalem!
translation:
  language: pt
  text: Cante de alegria, filha de Sião; grite bem alto, Israel! Alegre-se e exulte de todo o coração, filha de Jerusalém!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָנִּי
  choice: Cante de alegria
  rationale: O imperativo feminino singular de רנן expressa uma manifestação vocal jubilosa; a formulação preserva tanto a ideia de canto quanto a de alegria.
- source_word: בַּת צִיּוֹן
  choice: filha de Sião
  rationale: Mantém a expressão hebraica que personifica a cidade e funciona aqui como vocativo, em linguagem profética natural e reconhecível em português.
- source_word: הָרִיעוּ
  choice: grite bem alto
  rationale: O imperativo plural do hifil de רוע/ריע indica um brado forte e jubiloso; esta expressão comunica de modo corrente a intensidade pública do chamado.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Conserva o nome próprio, usado como vocativo e em paralelo com as cidades personificadas.
- source_word: שִׂמְחִי
  choice: Alegre-se
  rationale: O imperativo de שמח convoca à alegria; a escolha é digna, clara e natural para leitores modernos.
- source_word: וְעָלְזִי
  choice: e exulte
  rationale: O verbo עלז denota alegria exuberante. “Exulte” preserva a intensificação e evita repetir simplesmente “alegre-se”.
- source_word: בְּכָל לֵב
  choice: de todo o coração
  rationale: Equivalente idiomático natural em português para a expressão hebraica de sentimento integral, preservando o singular “coração”.
- source_word: בַּת יְרוּשָׁלִָם
  choice: filha de Jerusalém
  rationale: Preserva a personificação e o vocativo em paralelo com “filha de Sião”, mantendo a simetria poética.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira. A tradução mantém os quatro imperativos, o paralelismo poético e a personificação das cidades. A flexão feminina singular em “cante”, “alegre-se” e “exulte” corresponde às cidades personificadas; o plural subjacente a “grite” é naturalmente compatível com o coletivo “Israel” em português.
