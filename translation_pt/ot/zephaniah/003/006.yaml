  text: הִכְרַ֣תִּי גוֹיִ֗ם נָשַׁ֨מּוּ֙ פִּנּוֹתָ֔/ם הֶחֱרַ֥בְתִּי חֽוּצוֹתָ֖/ם מִ/בְּלִ֣י עוֹבֵ֑ר נִצְדּ֧וּ עָרֵי/הֶ֛ם מִ/בְּלִי אִ֖ישׁ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/006.yaml
  text: I have cut off nations[a]; their corner towers are laid waste. I have made their streets desolate, with no one passing through. Their cities are devastated, without a man[c][b], with no inhabitant.
translation:
  language: pt
  text: Eliminei nações; suas torres de esquina[a] ficaram em ruínas. Deixei suas ruas[b] desoladas, sem ninguém que passasse por elas. Suas cidades foram devastadas, sem homem algum[c], sem nenhum habitante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus cantos”; possivelmente uma referência a fortificações ou torres situadas nos cantos.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas praças” ou “seus espaços públicos”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “sem homem”; aqui, uma expressão que indica despovoamento completo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְרַתִּי
  choice: Eliminei
  rationale: O hifil de כרת pode significar cortar, eliminar ou destruir. “Eliminei” comunica com naturalidade o juízo consumado, sem exigir em português a reprodução literal da imagem de cortar.
- source_word: גוֹיִם
  choice: nações
  rationale: גּוֹיִם designa aqui povos organizados como entidades coletivas ou políticas; “nações” é o equivalente corrente e adequado ao contexto.
- source_word: נָשַׁמּוּ
  choice: ficaram em ruínas
  rationale: A forma de שמם descreve o estado resultante de devastação. “Ficaram em ruínas” é natural em português e se ajusta às estruturas urbanas mencionadas.
- source_word: פִּנּוֹתָם
  choice: suas torres de esquina
  rationale: O sentido literal é “seus cantos”, mas, no contexto da destruição de cidades, pode indicar estruturas defensivas situadas nos cantos, provavelmente torres. A nota preserva a leitura mais literal.
- source_word: הֶחֱרַבְתִּי
  choice: Deixei ... desoladas
  rationale: O hifil de חרב expressa fazer ficar deserto ou devastado. A formulação escolhida descreve adequadamente ruas esvaziadas.
- source_word: חוּצוֹתָם
  choice: suas ruas
  rationale: O plural de חוּץ pode designar ruas, praças ou espaços públicos. “Ruas” é claro no contexto, enquanto a nota registra as alternativas.
- source_word: מִבְּלִי עוֹבֵר
  choice: sem ninguém que passasse por elas
  rationale: A expressão retrata a ausência completa de transeuntes e preserva o valor do particípio עוֹבֵר.
- source_word: נִצְדּוּ
  choice: foram devastadas
  rationale: O verbo é raro e de interpretação difícil, mas o paralelismo deixa claro o resultado de ruína. “Foram devastadas” evita precisão lexical indevida.
- source_word: עָרֵיהֶם
  choice: Suas cidades
  rationale: עִיר significa normalmente cidade ou povoação; “cidades” se encaixa no cenário urbano do versículo.
- source_word: מִבְּלִי אִישׁ
  choice: sem homem algum
  rationale: A expressão hebraica contém o substantivo masculino singular אִישׁ. A tradução conserva essa forma, e a nota esclarece que, no contexto, ela descreve despovoamento total.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem nenhum habitante
  rationale: A frase intensifica a imagem da ausência de população. “Sem nenhum habitante” é conciso e idiomático.
theological_decisions:
- issue: O termo masculino אִישׁ numa fórmula de despovoamento
  choice: sem homem algum
  alternative: sem ninguém; sem pessoa alguma
  rationale: 'A tradução mantém o substantivo masculino presente no hebraico, sem restringir o sentido contextual: a cláusula seguinte, “sem nenhum habitante”, mostra que se trata da ausência completa de seres humanos.'
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e leitura natural no Brasil. A repetição de “sem” preserva a progressão enfática do hebraico, e as notas mantêm visíveis as principais ambiguidades lexicais.
