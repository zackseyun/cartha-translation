  terminology: “Yahweh” segue a decisão lexical do projeto. “Poderoso para salvar” é uma equivalência idiomática aceitável para גִּבּוֹר יוֹשִׁיעַ, embora apresente a ideia como capacidade; o conjunto comunica fielmente a força e a ação salvadora. “Cânticos” representa bem a expressão jubilosa de רִנָּה.
