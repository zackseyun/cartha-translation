base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/017.yaml
  text: Yahweh your God is in your midst[a], a mighty one who saves; he will rejoice over you with gladness; he will be quiet in his love; he will exult over you with singing.
translation:
  language: pt
  text: Yahweh, seu Deus, está em seu meio, poderoso para salvar. Ele se alegrará por você com alegria; ficará em silêncio em seu amor[a]; exultará por você com cânticos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acalmará você com seu amor”. Outra interpretação, menos provável, é: “renovará você em seu amor”.'
    reason: Registra leituras interpretativas tradicionais de uma expressão hebraica difícil sem inseri-las no texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהַיִךְ
  choice: seu Deus
  rationale: O sufixo de segunda pessoa feminina singular se dirige corporativamente à filha de Sião/Jerusalém; a formulação portuguesa mantém o tratamento direto e a referência pactual.
- source_word: בְּקִרְבֵּךְ
  choice: está em seu meio
  rationale: Expressa a presença de Yahweh no centro da comunidade e soa natural em português.
- source_word: גִּבּוֹר יוֹשִׁיעַ
  choice: poderoso para salvar
  rationale: Comunica tanto a força de גִּבּוֹר quanto a ação salvadora de יוֹשִׁיעַ, sem restringir o termo à imagem militar de um guerreiro.
- source_word: יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה
  choice: Ele se alegrará por você com grande alegria
  rationale: Reproduz a alegria intensa da expressão hebraica em linguagem clara e enfática.
- source_word: יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: ficará em silêncio em seu amor
  rationale: Mantém o sentido direto do verbo sem introduzir um objeto ausente no hebraico e preserva a tensão da formulação.
- source_word: יָגִיל עָלַיִךְ בְּרִנָּה
  choice: exultará por você com cânticos
  rationale: Distingue יָגִיל do verbo anterior de alegria e representa רִנָּה como expressão jubilosa cantada.
theological_decisions:
- issue: Sentido de יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: ficará em silêncio em seu amor
  alternative: acalmará você com seu amor; renovará você em seu amor
  rationale: O texto hebraico não apresenta objeto explícito para o verbo. A leitura principal conserva essa sintaxe e sua tensão; as interpretações conhecidas e teologicamente relevantes são registradas em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O paralelismo poético foi preservado por orações separadas por ponto e vírgula. O tratamento “você” corresponde à destinatária coletiva feminina, Sião/Jerusalém; a flexão de gênero não aparece nessa forma portuguesa.
