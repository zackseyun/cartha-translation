  naturalness: O texto é claro e de registro apropriado. Ajustam-se a colocação da chamada de nota em relação à pontuação e “eliminada”, cuja combinação com “morada” soa menos natural em português do que “destruída”.
  terminology: “Temer”, “aceitar a correção”, “morada”, “determinei contra ela” e “atos” são escolhas adequadas e não impõem interpretação confessional. As notas preservam tanto a ambiguidade sintática quanto o valor idiomático de “levantar-se cedo”.
