  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָמַ֜רְתִּי אַךְ תִּירְאִ֤י אוֹתִ/י֙ תִּקְחִ֣י מוּסָ֔ר וְ/לֹֽא יִכָּרֵ֣ת מְעוֹנָ֔/הּ כֹּ֥ל אֲשֶׁר פָּקַ֖דְתִּי עָלֶ֑י/הָ אָכֵן֙ הִשְׁכִּ֣ימוּ הִשְׁחִ֔יתוּ כֹּ֖ל עֲלִילוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/007.yaml
  text: I said[a], ‘Surely you will fear me; you will accept correction. Then her dwelling would not be cut off, according to all that I had appointed against her.’ But instead, they rose early[b]; they corrupted all their deeds.
translation:
  language: pt
  text: 'Eu disse: “Certamente você me temerá e aceitará a correção. Assim, a morada dela não seria destruída, conforme tudo o que determinei contra ela”[a]. Mas, em vez disso, eles se levantaram cedo[b] e corromperam todos os seus atos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Assim, a morada dela não seria destruída, apesar de tudo o que determinei contra ela”.'
    reason: alternative_reading
  - marker: b
    text: “Levantar-se cedo” é uma expressão hebraica que pode indicar empenho ou persistência.
    reason: cultural_note
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: Preserva o perfeito de אמר e introduz diretamente a fala divina; “pensei” seria possível em sentido idiomático, mas é menos direto.
- source_word: אַךְ
  choice: Certamente
  rationale: Expressa aqui expectativa enfática, e não mera limitação.
- source_word: תִּירְאִי אוֹתִי
  choice: você me temerá
  rationale: Mantém o sentido direto de ירא diante de Deus, que pode abranger temor e reverência, sem suavizá-lo.
- source_word: תִּקְחִי מוּסָר
  choice: aceitará a correção
  rationale: Verte naturalmente a expressão לקח + מוסר, conservando seu sentido moral e disciplinar.
- source_word: וְלֹא יִכָּרֵת
  choice: não seria eliminada
  rationale: Expressa o resultado condicional não realizado no contexto. “Eliminada” comunica o nifal de כרת de modo claro, sem restringi-lo necessariamente à destruição física.
- source_word: מְעוֹנָהּ
  choice: a morada dela
  rationale: Preserva o substantivo “morada” e o sufixo feminino, mantendo a personificação da cidade sem substituir o referente pelo nome “Jerusalém”.
- source_word: כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  choice: conforme tudo o que determinei contra ela
  rationale: פקד é semanticamente amplo; “determinei contra ela” conserva a ideia de juízo estabelecido sem afirmar que ele já havia sido plenamente executado.
- source_word: אָכֵן
  choice: Mas, em vez disso
  rationale: Torna natural e explícita a forte virada entre a resposta esperada e a conduta efetiva.
- source_word: הִשְׁכִּימוּ
  choice: eles se levantaram cedo
  rationale: Retém a imagem concreta do hebraico; uma nota esclarece sua possível conotação de empenho ou persistência.
- source_word: הִשְׁחִיתוּ
  choice: corromperam
  rationale: Conserva o uso transitivo do hifil de שׁחת e sua carga moral.
- source_word: כֹּל עֲלִילוֹתָם
  choice: todos os seus atos
  rationale: “Atos” é atual, claro e suficientemente amplo para עלילות neste contexto.
theological_decisions:
- issue: Referente do feminino singular e passagem posterior ao plural
  choice: Manter “a morada dela” e depois “eles”, refletindo a cidade personificada e seus habitantes coletivamente.
  alternative: Identificar expressamente o feminino como Jerusalém, Sião ou a nação.
  rationale: O hebraico apresenta a mudança gramatical; preservá-la evita resolver no texto uma referência que permanece implícita.
- issue: Sentido da oração sobre o juízo determinado contra ela
  choice: 'Tomá-la como qualificação do resultado não realizado: a morada não seria eliminada conforme os juízos determinados.'
  alternative: 'Entendê-la concessivamente: a morada não seria eliminada apesar de tudo o que Deus havia determinado contra ela.'
  rationale: A sintaxe hebraica é comprimida e admite debate. A leitura principal acompanha o fluxo da expectativa divina frustrada, enquanto a alternativa genuína é registrada em nota.
- issue: Valor de “temer” em relação a Deus
  choice: Usar “temer”, deixando no termo a tensão entre medo e reverência.
  alternative: Usar “reverenciar”.
  rationale: “Temer” corresponde mais diretamente ao hebraico e evita reduzir antecipadamente sua amplitude teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” por se tratar de uma cidade personificada. A formulação preserva a mudança do singular feminino para o plural e mantém visível a ambiguidade sintática da oração sobre o juízo por meio da nota [a].
