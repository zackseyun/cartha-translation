base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/015.yaml
  text: Yahweh has taken away your judgments[a]; he has turned away your enemy. The King of Israel, Yahweh, is in your midst[b]; you will fear evil no more.
translation:
  language: pt
  text: Yahweh retirou as sentenças contra você[a]; afastou o seu inimigo. O Rei de Israel, Yahweh, está em seu meio; você não temerá mais o mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os seus julgamentos” ou “a sua sentença”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “mal” também pode significar “desgraça”, “calamidade” ou “desastre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: retirou
  rationale: O hifil de סור indica remover ou tirar. O pretérito perfeito apresenta a ação divina como realizada, de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִשְׁפָּטַיִךְ
  choice: as sentenças contra você
  rationale: מִשְׁפָּט pode significar julgamento, decisão judicial ou sentença. No contexto de restauração, refere-se às decisões judiciais adversas que pesavam sobre Sião; a formulação explicita a direção sem reduzi-las simplesmente a 'castigos'.
- source_word: פִּנָּה
  choice: afastou
  rationale: O verbo comunica a remoção ou o desvio do inimigo. 'Afastou' é conciso, natural e não acrescenta um modo específico de derrota.
- source_word: אֹיְבֵךְ
  choice: o seu inimigo
  rationale: Mantém o singular do hebraico, que também pode ter valor coletivo.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: O Rei de Israel
  rationale: Reproduz diretamente a construção nominal e sua função de título divino.
- source_word: בְּקִרְבֵּךְ
  choice: no meio de você
  rationale: Expressa a presença de Yahweh junto de Sião, destinatária feminina singular, com linguagem clara e atual.
- source_word: לֹא תִירְאִי
  choice: você não temerá
  rationale: Traduz o imperfeito feminino singular como futuro declarativo, sem introduzir a nuance modal de uma ordem ou permissão.
- source_word: רָע
  choice: o mal
  rationale: Preserva a amplitude de רָע, que pode indicar tanto mal quanto desgraça ou calamidade; o provável sentido contextual é informado em nota.
- source_word: עוֹד
  choice: mais
  rationale: Com a negação, forma a expressão portuguesa idiomática 'não... mais'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. 'Yahweh' o preserva como nome, sem substituí-lo pelo título tradicional.
- issue: Sentido de מִשְׁפָּטַיִךְ no anúncio de salvação
  choice: as sentenças contra você
  alternative: os seus julgamentos; o seu castigo
  rationale: O contexto aponta para decisões judiciais adversas removidas de Sião. 'Sentenças contra você' torna essa relação clara sem limitar o termo a castigo executado.
- issue: Sentido de רָע na cláusula final
  choice: o mal
  alternative: desgraça; calamidade; desastre
  rationale: A palavra hebraica conserva amplitude semântica. O texto principal mantém essa tensão, enquanto a nota apresenta o sentido circunstancial provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por 'você' corresponde ao feminino singular dirigido a Sião; os possessivos com artigo favorecem clareza. A tradução mantém o singular de 'inimigo', o futuro declarativo e a amplitude de 'mal'.
