base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/020.yaml
  text: At that time I will bring you in[a], and at that time I will gather you; for I will make you a name and a praise among all the peoples of the earth, when I restore your fortunes before your eyes, says Yahweh.
translation:
  language: pt
  text: Naquele tempo, eu os trarei[a] e, naquele tempo, os reunirei; pois farei com que tenham renome e sejam motivo de louvor entre todos os povos da terra, quando eu restaurar a sua sorte diante dos seus olhos, diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme o contexto implícito, “eu os trarei de volta” ou “eu os farei entrar”. O hebraico diz simplesmente “eu os trarei”, sem indicar aqui o destino.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Preserva a fórmula temporal profética e sua repetição enfática no versículo, em português natural.
- source_word: אָבִיא אֶתְכֶם
  choice: eu os trarei
  rationale: O hifil de בוא significa fazer vir ou trazer. Como o destino não está expresso, a tradução evita acrescentar explicitamente “de volta” ou “para dentro”.
- source_word: וּבָעֵת קַבְּצִי אֶתְכֶם
  choice: e, naquele tempo, os reunirei
  rationale: Expressa naturalmente o valor temporal do infinitivo com sufixo e conserva o paralelismo com בָּעֵת הַהִיא.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ou fundamento da promessa anterior.
- source_word: אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  choice: farei com que tenham renome e sejam louvados
  rationale: Comunica o sentido idiomático de dar ao povo nome, reputação honrosa e louvor, evitando em português a construção pouco natural “fazer de vocês um nome e um louvor”.
- source_word: בְּכֹל עַמֵּי הָאָרֶץ
  choice: entre todos os povos da terra
  rationale: “Entre” corresponde ao âmbito em que o povo receberá renome; “povos” mantém o plural, e “terra” tem aqui alcance amplo.
- source_word: בְּשׁוּבִי אֶת שְׁבוּתֵיכֶם
  choice: quando eu restaurar a sua sorte
  rationale: A expressão idiomática שוב שבות designa restauração após exílio ou calamidade. A nota preserva as leituras mais literais e a amplitude lexical.
- source_word: לְעֵינֵיכֶם
  choice: diante dos seus próprios olhos
  rationale: Mantém a imagem hebraica e enfatiza que o povo testemunhará abertamente a restauração.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: Reproduz a fórmula profética no presente e translitera o nome divino expresso pelo Tetragrama.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Alcance da fórmula de restauração שׁוּב שְׁבוּת
  choice: restaurar a sua sorte
  alternative: restaurar o seu cativeiro; trazer de volta os seus cativos
  rationale: A expressão pode abranger retorno do exílio e reversão mais ampla da calamidade. A tradução principal comunica o idioma sem restringi-lo indevidamente, e a nota registra as alternativas literais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a repetição de “naquele tempo”, a fórmula profética e a imagem de testemunho ocular, enquanto verte os idiomas hebraicos de maneira natural.
