revisions:
- from: Eis que[a], naquele tempo, agirei contra todos os seus opressores. Salvarei a que manca e reunirei a que foi expulsa[b]; farei deles motivo de louvor e de renome em toda terra[c] onde foram envergonhados[d].
  to: Eis que[a], naquele tempo, agirei contra todos os teus opressores. Salvarei a que manca e reunirei a que foi afastada[b]; farei deles motivo de louvor e de renome em todas as terras[c] onde foram envergonhados[d].
  rationale: A revisão torna explícita a segunda pessoa do hebraico, melhora a legibilidade e a utilidade da alternativa geográfica e torna a nota sobre a cláusula final difícil mais fiel à sua ambiguidade. A interpretação contextual «onde foram envergonhados» é preservada no texto, mas não é apresentada pela nota como uma resolução indiscutível da sintaxe massorética.
