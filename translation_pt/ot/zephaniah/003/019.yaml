  text: הִנְ/נִ֥י עֹשֶׂ֛ה אֶת כָּל מְעַנַּ֖יִ/ךְ בָּ/עֵ֣ת הַ/הִ֑יא וְ/הוֹשַׁעְתִּ֣י אֶת הַ/צֹּלֵעָ֗ה וְ/הַ/נִּדָּחָה֙ אֲקַבֵּ֔ץ וְ/שַׂמְתִּי/ם֙ לִ/תְהִלָּ֣ה וּ/לְ/שֵׁ֔ם בְּ/כָל הָ/אָ֖רֶץ בָּשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/019.yaml
  text: Behold[a], at that time I will deal with all your oppressors, and I will save the lame and gather the outcast[d][c][b], and I will make them a praise and a name in every land where they were put to shame.
translation:
  language: pt
  text: Eis que[a], naquele tempo, agirei contra todos os teus opressores. Salvarei a que manca e reunirei a que foi afastada[b]; farei deles motivo de louvor e de renome em todas as terras[c] onde foram envergonhados[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Vejam». A expressão introduz solenemente o anúncio divino.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir «a que coxeia» e «a que foi expulsa» ou «afastada». O hebraico usa formas femininas singulares, provavelmente personificando a comunidade aflita.
    reason: lexical_alternative
  - marker: c
    text: Ou «em toda a terra».
    reason: lexical_alternative
  - marker: d
    text: A frase hebraica final é difícil. Mais literalmente, pode ser entendida como «em todas as terras de sua vergonha» ou «em todas as terras, sua vergonha». A tradução no texto expressa o sentido contextual provável.
    reason: textual_difficulty
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz com solenidade um anúncio divino e preserva a força profética da expressão hebraica.
- source_word: עֹשֶׂה אֶת כָּל מְעַנַּיִךְ
  choice: agirei contra todos os seus opressores
  rationale: Embora עֹשֶׂה signifique literalmente “fazendo”, a construção indica ação decisiva contra aqueles que afligem ou oprimem a comunidade personificada.
- source_word: בָּעֵת הַהִיא
  choice: naquele tempo
  rationale: Reproduz diretamente a fórmula temporal profética sem substituí-la pela fórmula distinta “naquele dia”.
- source_word: וְהוֹשַׁעְתִּי
  choice: Salvarei
  rationale: Expressa o sentido comum de ישׁע, salvar ou livrar, e mantém sua ressonância teológica no contexto de restauração.
- source_word: הַצֹּלֵעָה
  choice: a que manca
  rationale: Preserva a imagem concreta e a forma feminina singular do hebraico, que provavelmente personifica a comunidade aflita.
- source_word: הַנִּדָּחָה
  choice: a que foi expulsa
  rationale: Comunica o sentido de alguém que foi impelido para longe, sem limitar a expressão a uma categoria jurídica específica como “exilada”.
- source_word: אֲקַבֵּץ
  choice: reunirei
  rationale: Verbo natural em português para a restauração e o ajuntamento de pessoas dispersas.
- source_word: וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם
  choice: farei deles motivo de louvor e de renome
  rationale: Traduz a transformação de condição indicada por שׂים; “motivo de louvor” esclarece a função de תְהִלָּה, e “renome” expressa o valor idiomático de שֵׁם.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda terra
  rationale: Mantém a amplitude e a ambiguidade de אֶרֶץ, que pode designar a terra inteira ou cada território onde o povo sofreu vergonha.
- source_word: בָּשְׁתָּם
  choice: onde foram envergonhados
  rationale: Oferece uma leitura contextualmente coerente da difícil frase final, relacionando a antiga vergonha aos lugares em que será substituída por louvor e renome.
theological_decisions:
- issue: A identidade da que manca e da que foi expulsa
  choice: Manter as formas femininas singulares como personificação coletiva
  alternative: 'Converter diretamente em plurais: “os que mancam” e “os dispersos”'
  rationale: O hebraico emprega particípios femininos singulares, provavelmente personificando Sião ou a comunidade aflita. A tradução conserva essa forma sem negar seu referente coletivo.
- issue: A extensão geográfica de בְּכָל הָאָרֶץ
  choice: em toda terra
  alternative: em toda a terra
  rationale: A ausência do artigo em português permite que “terra” conserve melhor a oscilação contextual entre os diversos territórios da dispersão e a terra inteira.
- issue: Relação entre vergonha passada e restauração
  choice: onde foram envergonhados
  alternative: em meio à vergonha deles
  rationale: A sintaxe final do texto massorético é difícil. A opção escolhida comunica o provável contraste de restauração sem apresentar como indiscutível uma reconstrução sintática, e a nota registra a leitura mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a solenidade profética, evita vocabulário excessivamente arcaico e conserva por meio de notas as ambiguidades de gênero coletivo, extensão geográfica e sintaxe da frase final.
