  yaml_path: translation/ot/zephaniah/003/016.yaml
  text: On that day it will be said to Jerusalem[a], “Do not fear”; to Zion, “Do not let your hands grow weak.”
translation:
  language: pt
  text: 'Naquele dia, será dito a Jerusalém: “Não tenha medo”; e a Sião: “Não deixe suas mãos enfraquecerem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal profética natural em português, sem tom arcaizante.
- source_word: יֵאָמֵר
  choice: será dito
  rationale: O nifal imperfeito é vertido como passiva impessoal, preservando o fato de que o falante não é identificado.
- source_word: לִירוּשָׁלַם
  choice: a Jerusalém
  rationale: A preposição ל marca Jerusalém como destinatária da fala.
- source_word: אַל תִּירָאִי
  choice: Não tenha medo
  rationale: Mantém a força da proibição dirigida a uma destinatária personificada no singular feminino e soa natural em português atual.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Preserva o vocativo sem acrescentar uma preposição ausente no hebraico; Jerusalém e Sião designam a cidade personificada.
- source_word: אַל יִרְפּוּ יָדַיִךְ
  choice: não deixe suas mãos perderem as forças
  rationale: Conserva a imagem das mãos e comunica a expressão idiomática de perda de força, ânimo ou coragem.
theological_decisions:
- issue: Personificação de Jerusalém/Sião como destinatária feminina singular
  choice: Manter a fala dirigida diretamente à cidade personificada.
  alternative: Explicitar os habitantes ou o povo de Jerusalém/Sião.
  rationale: O hebraico se dirige diretamente a Jerusalém e Sião no feminino singular; não se introduz uma expansão interpretativa.
- issue: Relação sintática entre Jerusalém e Sião
  choice: Tratar “Sião” como vocativo dentro da única fala anunciada a Jerusalém.
  alternative: Repetir “será dito a Sião” para tornar explícito o paralelismo.
  rationale: O hebraico não repete a preposição nem o verbo antes de צִיּוֹן. A pontuação adotada preserva a concisão e identifica naturalmente Jerusalém com Sião, sem alterar o conteúdo da exortação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção passiva conserva o agente não especificado, e a imagem hebraica das mãos é mantida com esclarecimento em nota.
