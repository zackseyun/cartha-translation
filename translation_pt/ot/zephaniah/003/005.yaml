  text: יְהוָ֤ה צַדִּיק֙ בְּ/קִרְבָּ֔/הּ לֹ֥א יַעֲשֶׂ֖ה עַוְלָ֑ה בַּ/בֹּ֨קֶר בַּ/בֹּ֜קֶר מִשְׁפָּט֨/וֹ יִתֵּ֤ן לָ/אוֹר֙ לֹ֣א נֶעְדָּ֔ר וְ/לֹֽא יוֹדֵ֥עַ עַוָּ֖ל בֹּֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/005.yaml
  text: Yahweh is righteous in her midst; he does no injustice[a]. Morning by morning he brings his justice to light; it does not fail. But the unjust knows no shame.
translation:
  language: pt
  text: Yahweh é justo no meio dela; não comete injustiça. Manhã após manhã, ele traz sua justiça à luz; ela não deixa de se manifestar. Mas o injusto não conhece vergonha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu juízo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צַדִּיק
  choice: justo
  rationale: Em português, “justo” expressa naturalmente o caráter moral e judicial atribuído a Yahweh e se liga ao campo semântico de justiça e injustiça no versículo.
- source_word: בְּקִרְבָּהּ
  choice: no meio dela
  rationale: Preserva o sufixo feminino hebraico, que retoma a cidade personificada no contexto.
- source_word: לֹא יַעֲשֶׂה עַוְלָה
  choice: não comete injustiça
  rationale: Formulação natural que mantém a afirmação ética e judicial de que Yahweh não pratica o que é injusto.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Manhã após manhã
  rationale: Reproduz o valor distributivo da repetição hebraica e destaca a constância da ação.
- source_word: מִשְׁפָּטוֹ
  choice: a sua justiça
  rationale: No contexto, designa a ação judicial justa de Yahweh; “justiça” reforça o contraste com injustiça e com o injusto, sem excluir a alternativa “juízo”.
- source_word: יִתֵּן לָאוֹר
  choice: traz à luz
  rationale: Conserva a imagem do hebraico e comunica de modo idiomático a manifestação pública da justiça divina.
- source_word: לֹא נֶעְדָּר
  choice: sem jamais faltar
  rationale: Expressa a ideia de que a manifestação matinal da justiça divina nunca está ausente, evitando em português uma referência pronominal de gênero pouco clara.
- source_word: וְלֹא יוֹדֵעַ עַוָּל בֹּשֶׁת
  choice: Mas o injusto não conhece a vergonha
  rationale: Mantém o contraste com a justiça de Yahweh e reproduz de modo claro o idioma hebraico sobre a ausência de vergonha no transgressor.
theological_decisions:
- issue: Referente e gênero do sufixo em בְּקִרְבָּהּ
  choice: “no meio dela”, referindo-se à cidade personificada
  alternative: “no meio da cidade”
  rationale: O hebraico emprega um sufixo feminino que retoma a cidade personificada no contexto; a tradução conserva essa personificação.
- issue: Sentido de מִשְׁפָּטוֹ no contexto
  choice: “a sua justiça”
  alternative: “o seu juízo”
  rationale: “Justiça” se harmoniza com o caráter justo de Yahweh e com o contraste explícito entre injustiça e o injusto; “juízo” continua sendo uma alternativa lexical legítima e é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição hebraica foi preservada por “Manhã após manhã”, e a personificação feminina da cidade foi mantida.
