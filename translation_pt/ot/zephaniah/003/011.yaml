reference: Zephaniah 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִ/כֹּ֣ל עֲלִילֹתַ֔יִ/ךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ בִּ֑/י כִּי אָ֣ז אָסִ֣יר מִ/קִּרְבֵּ֗/ךְ עַלִּיזֵי֙ גַּאֲוָתֵ֔/ךְ וְ/לֹֽא תוֹסִ֧פִי לְ/גָבְהָ֛ה ע֖וֹד בְּ/הַ֥ר קָדְשִֽׁ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/011.yaml
  text: On that day you will not be put to shame because of all your deeds by which you rebelled against me[a], for then I will remove from your midst those who exult in your pride[b], and you will no longer be haughty on my holy mountain.
translation:
  language: pt
  text: Naquele dia, você não será envergonhada por causa de todas as ações com que se rebelou contra mim[a], pois então retirarei do seu meio os que exultam em sua arrogância[b], e você nunca mais se mostrará orgulhosa no meu santo monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você não se envergonhará”. O verbo hebraico pode indicar tanto sentir vergonha como ficar envergonhada ou desonrada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os seus orgulhosos exultantes”. A expressão hebraica refere-se a pessoas marcadas por exultação arrogante; a relação entre “exultam” e “arrogância” é concisa no original.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵבֹושִׁי
  choice: você não será envergonhada
  rationale: Preserva o sentido de vergonha ou desonra no contexto da restauração de Sião, sem reduzi-lo apenas a um sentimento subjetivo; o feminino singular representa Sião/Jerusalém personificada.
- source_word: מִכֹּל עֲלִילֹתַיִךְ
  choice: por causa de todas as ações
  rationale: A preposição após o verbo de vergonha é expressa idiomaticamente como causa; 'ações' mantém a amplitude de עֲלִילָה, cujo caráter pecaminoso é esclarecido pela oração seguinte.
- source_word: פָּשַׁעַתְּ בִּי
  choice: com que se rebelou contra mim
  rationale: פשע indica rebelião ou ruptura deliberada, mais especificamente do que o termo genérico 'pecar'.
- source_word: אָסִיר מִקִּרְבֵּךְ
  choice: retirarei do seu meio
  rationale: O hifil de סור exprime remoção, e 'do seu meio' conserva a dimensão comunitária da cidade ou do povo.
- source_word: עַלִּיזֵי גַּאֲוָתֵךְ
  choice: os que exultam em sua arrogância
  rationale: Mantém o particípio substantivado referente a pessoas que exultam e lê גַּאֲוָה negativamente conforme o contexto; a relação exata do construto permanece aberta em nota.
- source_word: וְלֹא תוֹסִפִי לְגָבְהָה עוֹד
  choice: e você nunca mais se mostrará orgulhosa
  rationale: A construção 'não tornar/continuar a' com עוֹד significa 'nunca mais'; גבה descreve altivez moral, aqui vertida em linguagem portuguesa corrente.
- source_word: בְּהַר קָדְשִׁי
  choice: no meu santo monte
  rationale: A formulação natural em português preserva a referência locativa a Sião como monte santo de Deus.
theological_decisions:
- issue: Se a promessa inicial nega toda vergonha subjetiva ou anuncia o fim da desonra ligada às antigas rebeliões após a purificação divina.
  choice: A tradução apresenta o fim da desonra decorrente das rebeliões passadas, no contexto da restauração.
  alternative: Entender apenas que o povo já não sentirá vergonha.
  rationale: As ações rebeldes continuam sendo reconhecidas como reais, enquanto a oração seguinte atribui a mudança à ação purificadora de Deus; assim, culpa passada e restauração permanecem em tensão.
- issue: A identidade do destinatário feminino singular.
  choice: Manter o feminino singular, entendido contextualmente como Sião/Jerusalém personificada, sem inserir o nome no corpo do versículo.
  alternative: Substituir o pronome por 'Jerusalém' ou dirigir a fala explicitamente ao povo.
  rationale: As formas hebraicas são femininas singulares e o contexto fornece a personificação; explicitá-la no texto acrescentaria material interpretativo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O feminino singular foi preservado por representar Sião/Jerusalém personificada. 'Nunca mais se mostrará orgulhosa' evita o pouco corrente 'ser altiva' sem enfraquecer a censura moral.
