  yaml_path: translation/ot/zephaniah/003/001.yaml
  text: Woe to the rebellious and defiled city[b][a], the oppressing one!
translation:
  language: pt
  text: Ai da cidade rebelde e contaminada, a opressora![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a pomba”. Neste contexto, o termo é geralmente entendido como uma descrição figurada da cidade como opressora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai de
  rationale: Introduz uma denúncia profética de juízo e preserva a força exclamativa da expressão hebraica.
- source_word: מֹרְאָה
  choice: rebelde
  rationale: Reflete a raiz מרה, ligada à rebeldia e à resistência à correção ou à autoridade.
- source_word: וְנִגְאָלָה
  choice: e contaminada
  rationale: No contexto da denúncia, descreve corrupção moral ou cultual; o sentido comum de 'redimida' não se ajusta ao paralelismo.
- source_word: הָעִיר
  choice: cidade
  rationale: Equivalente natural e direto de עִיר em português.
- source_word: הַיּוֹנָה
  choice: a opressora
  rationale: Segue a leitura contextual tradicional que entende o termo como uma caracterização da cidade que oprime, preservando sua função substantivada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concisão profética. “Ai da” conserva a fórmula de denúncia; “contaminada” comunica corrupção moral e cultual sem restringir o sentido apenas à sujeira física.
