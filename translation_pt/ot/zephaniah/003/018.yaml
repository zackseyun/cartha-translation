  yaml_path: translation/ot/zephaniah/003/018.yaml
  text: I have gathered those grieving over the appointed festival from you[a]; they were a reproach upon her[c][b], a burden.
translation:
  language: pt
  text: Reuni[a], do teu meio, os que lamentavam por causa da festa marcada[b]; eles eram uma carga sobre ela[c], uma vergonha[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, no contexto profético: “reunirei”. A forma hebraica é perfectiva e também pode ter sentido futuro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os aflitos afastados da assembleia festiva”. O hebraico é difícil e pode falar tanto dos que lamentam por estarem privados da festa como dos que foram retirados da reunião festiva.'
    reason: alternative_reading
  - marker: c
    text: O pronome feminino provavelmente se refere a Sião ou Jerusalém.
    reason: cross_reference
  - marker: d
    text: 'A cláusula final é muito condensada. Também pode ser entendida como: “a vergonha sobre ela era uma carga para eles”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נוּגֵי
  choice: os que lamentavam
  rationale: A forma descreve pessoas afligidas ou entristecidas. “Os que lamentavam” mantém a referência pessoal e a força emocional sem definir em excesso a causa.
- source_word: מִמּוֹעֵד
  choice: por causa da festa marcada
  rationale: מוֹעֵד pode designar um tempo determinado ou uma assembleia festiva. No contexto, a expressão provavelmente indica tristeza ligada à festa da qual o povo estava privado; a nota preserva outras possibilidades da preposição מִן.
- source_word: אָסַפְתִּי
  choice: Reuni
  rationale: O qatal na primeira pessoa do singular é formalmente perfectivo. O pretérito perfeito reproduz essa forma, enquanto a nota reconhece o possível valor futuro no discurso profético.
- source_word: מִמֵּךְ
  choice: dentre os seus
  rationale: O sufixo de segunda pessoa feminina singular se dirige provavelmente a Sião/Jerusalém. Esta formulação transmite a procedência ou relação com a cidade de modo natural, sem trocar o referente por um nome ausente do texto.
- source_word: מַשְׂאֵת
  choice: carga
  rationale: Neste contexto, o substantivo indica algo pesado ou um fardo, não um oráculo.
- source_word: עָלֶיהָ
  choice: para ela
  rationale: A preposição עַל com sufixo feminino é expressa idiomaticamente em relação a “carga”; o pronome permanece explícito, pois seu referente não é nomeado neste versículo.
- source_word: חֶרְפָּה
  choice: vergonha
  rationale: חֶרְפָּה abrange vergonha, desonra e opróbrio público. “Vergonha” é corrente e conserva a dimensão social da palavra.
theological_decisions:
- issue: Sintaxe e referente dos que lamentavam
  choice: O versículo fala de pessoas ligadas a Sião que lamentavam por causa da festa marcada e que foram reunidas por Deus.
  alternative: A frase pode indicar os aflitos afastados da assembleia festiva ou pessoas retiradas da própria celebração.
  rationale: O hebraico é comprimido e admite mais de uma relação entre נוּגֵי, מִמּוֹעֵד e מִמֵּךְ. A tradução principal oferece uma leitura coerente, enquanto a nota mantém abertas as alternativas reais.
- issue: Tempo de אָסַפְתִּי
  choice: 'Pretérito perfeito: “Reuni”.'
  alternative: 'Futuro profético: “Reunirei”.'
  rationale: A forma hebraica é perfectiva, mas o contexto profético de restauração pode dar-lhe referência futura. A nota evita transformar uma possibilidade contextual em certeza gramatical.
- issue: Relação entre carga, vergonha e o pronome feminino
  choice: “Eles eram para ela uma carga de vergonha.”
  alternative: “A vergonha sobre ela era uma carga para eles” ou “eles eram sobre ela uma vergonha, uma carga”.
  rationale: A ordem e as relações sintáticas da cláusula final são difíceis. A redação principal é inteligível em português, mas uma nota registra que o hebraico não determina inequivocamente quem suporta a carga.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Festa marcada” evita o tom burocrático de “festival designado” e comunica o caráter de ocasião estabelecida. “Dentre os seus” torna natural a referência à destinatária feminina singular sem inserir explicitamente “Sião” no corpo do versículo. As notas preservam a dificuldade sintática e o possível valor futuro do verbo.
