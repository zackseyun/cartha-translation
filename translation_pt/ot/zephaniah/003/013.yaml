  text: שְׁאֵרִ֨ית יִשְׂרָאֵ֜ל לֹֽא יַעֲשׂ֤וּ עַוְלָה֙ וְ/לֹא יְדַבְּר֣וּ כָזָ֔ב וְ/לֹֽא יִמָּצֵ֥א בְּ/פִי/הֶ֖ם לְשׁ֣וֹן תַּרְמִ֑ית כִּֽי הֵ֛מָּה יִרְע֥וּ וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/013.yaml
  text: The remnant of Israel will do no wrong and speak no lies[a], and no deceitful tongue will be found in their mouth; for they will graze and lie down[b], with no one to make them afraid.
translation:
  language: pt
  text: O remanescente de Israel não praticará injustiça nem falará mentiras; não se encontrará em suas bocas nenhuma língua enganosa. Pois eles pastarão e se deitarão[a], e ninguém os amedrontará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão retrata o remanescente como um rebanho que pasta e repousa em segurança.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: O remanescente de Israel
  rationale: “Remanescente” expressa o grupo sobrevivente ou preservado e mantém a conhecida nuance profética do termo hebraico שְׁאֵרִית.
- source_word: יַעֲשׂוּ עַוְלָה
  choice: não praticará o mal
  rationale: עַוְלָה abrange maldade, injustiça e perversidade. “Praticar o mal” é natural em português e conserva a amplitude moral da expressão.
- source_word: יְדַבְּרוּ כָזָב
  choice: nem dirá mentiras
  rationale: כָזָב designa mentira ou falsidade; a formulação é direta e corrente em português.
- source_word: יִמָּצֵא בְּפִיהֶם לְשׁוֹן תַּרְמִית
  choice: não se achará na boca deles língua enganosa
  rationale: A tradução conserva a imagem concreta da boca e da língua presente no hebraico, em vez de reduzi-la simplesmente a “fala enganosa”.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a afirmação explicativa e tranquilizadora que conclui o versículo.
- source_word: יִרְעוּ וְרָבְצוּ
  choice: eles pastarão e se deitarão
  rationale: Os verbos evocam um rebanho que pasta e repousa em segurança; a tradução mantém deliberadamente essa imagem pastoril.
- source_word: וְאֵין מַחֲרִיד
  choice: e ninguém os amedrontará
  rationale: מַחֲרִיד é aquele que causa medo ou terror. “Ninguém os amedrontará” reproduz com clareza a ausência de qualquer agente ameaçador.
theological_decisions:
- issue: Terminologia do remanescente
  choice: O remanescente de Israel
  alternative: Os sobreviventes de Israel
  rationale: “Remanescente” preserva a dimensão profética do termo sem definir além do texto a identidade ou o papel desse grupo.
- issue: Imagem pastoril na conclusão
  choice: eles pastarão e se deitarão
  alternative: eles se alimentarão e descansarão em segurança
  rationale: O hebraico emprega verbos concretos associados ao rebanho. Manter a metáfora conserva a textura profética e a promessa de segurança sem transformá-la numa formulação teológica abstrata.
- issue: Concordância com o coletivo “remanescente”
  choice: Retomada pelo pronome plural “eles” na segunda frase
  alternative: Manter todos os verbos no singular
  rationale: O hebraico trata o remanescente como um conjunto de pessoas e usa formas verbais plurais. A retomada plural torna essa dimensão coletiva perceptível e permanece natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém as três negações enfáticas do hebraico e preserva tanto a imagem concreta da “língua enganosa” quanto a metáfora pastoril final.
