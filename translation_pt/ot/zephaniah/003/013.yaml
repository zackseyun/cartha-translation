  terminology: “Remanescente”, “mentiras”, “língua enganosa”, “pastarão” e “se deitarão” são escolhas adequadas. “Injustiça” comunica melhor a amplitude moral e social de עַוְלָה do que o mais genérico “mal”, sem restringi-la a um contexto jurídico.
