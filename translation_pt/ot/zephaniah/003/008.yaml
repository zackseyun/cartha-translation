id: ZEP.3.8
reference: Zephaniah 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֤ן חַכּוּ לִ/י֙ נְאֻם יְהוָ֔ה לְ/י֖וֹם קוּמִ֣/י לְ/עַ֑ד כִּ֣י מִשְׁפָּטִ/י֩ לֶ/אֱסֹ֨ף גּוֹיִ֜ם לְ/קָבְצִ֣/י מַמְלָכ֗וֹת לִ/שְׁפֹּ֨ךְ עֲלֵי/הֶ֤ם זַעְמִ/י֙ כֹּ֚ל חֲר֣וֹן אַפִּ֔/י כִּ֚י בְּ/אֵ֣שׁ קִנְאָתִ֔/י תֵּאָכֵ֖ל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/008.yaml
  text: Therefore wait for me[a], declares Yahweh, for the day when I rise up for plunder; for my judgment is to gather nations, to assemble kingdoms, to pour out on them my indignation, all my burning anger[c][b]; for in the fire of my jealousy all the earth will be consumed.
translation:
  language: pt
  text: Portanto, esperem por mim — declara Yahweh — até o dia em que eu me levantar para tomar a presa.[a] Pois decidi reunir nações e ajuntar reinos, a fim de derramar sobre eles a minha indignação, todo o ardor da minha ira. Pois, no fogo do meu zelo,[b] toda a terra[c] será consumida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta expressão é difícil. Outra tradução possível é: “até o dia em que eu me levantar como testemunha” ou “para testemunhar”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “do meu ciúme”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “todo o país” ou “todo o território”. O contexto de nações e reinos favorece aqui o sentido mais amplo, “toda a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Preserva a conexão conclusiva com o contexto anterior de modo natural e digno.
- source_word: חַכּוּ לִי
  choice: esperem por mim
  rationale: Reproduz o imperativo plural e mantém Yahweh como aquele por quem se deve esperar.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa naturalmente a fórmula profética e translitera o nome divino.
- source_word: לְיוֹם קוּמִי לְעַד
  choice: até o dia em que eu me levantar para tomar a presa
  rationale: Entende לְעַד no provável sentido de presa ou despojo neste contexto, sem ocultar em nota a leitura alternativa ligada a testemunho.
- source_word: כִּי מִשְׁפָּטִי
  choice: Pois decidi
  rationale: Aqui מִשְׁפָּטִי pode designar a decisão judicial de Yahweh; a forma verbal resulta clara em português e introduz naturalmente os infinitivos seguintes.
- source_word: לֶאֱסֹף גּוֹיִם לְקָבְצִי מַמְלָכוֹת
  choice: reunir nações e ajuntar reinos
  rationale: Mantém o paralelismo quase sinonímico do hebraico sem repetição rígida.
- source_word: לִשְׁפֹּךְ עֲלֵיהֶם זַעְמִי
  choice: derramar sobre eles a minha indignação
  rationale: Conserva a metáfora de derramar e distingue זַעַם da expressão intensificadora seguinte.
- source_word: כֹּל חֲרוֹן אַפִּי
  choice: todo o ardor da minha ira
  rationale: Preserva a imagem de calor intenso própria da expressão hebraica e produz português idiomático.
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: no fogo do meu zelo
  rationale: קִנְאָה admite zelo ou ciúme; 'zelo' comunica aqui a intensidade da ação divina, enquanto a alternativa relacional é registrada em nota.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: O contexto internacional de nações e reinos favorece o alcance amplo de 'terra', embora 'país' ou 'território' seja lexicalmente possível.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração identifica diretamente o nome próprio no texto hebraico sem substituí-lo por um título.
- issue: Sentido do difícil לְעַד
  choice: para tomar a presa
  alternative: como testemunha; para testemunho
  rationale: A leitura como presa ou despojo forma uma expressão inteligível com o levantar-se divino e tem forte apoio tradutório; a possível leitura judicial é preservada em nota por causa da ambiguidade textual.
- issue: Sentido de קִנְאָה
  choice: zelo
  alternative: ciúme
  rationale: Ambos pertencem ao campo semântico do termo. 'Zelo' soa mais natural neste anúncio de juízo universal, enquanto 'ciúme' preserva mais explicitamente a dimensão relacional e por isso consta na nota.
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país; território
  rationale: A reunião de nações e reinos aponta para um alcance universal, mas o valor territorial mais restrito continua lexicalmente possível.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A estrutura profética e as imagens fortes do hebraico foram mantidas, evitando arcaísmos. As ambiguidades relevantes de לְעַד, קִנְאָה e הָאָרֶץ foram explicitadas em notas.
