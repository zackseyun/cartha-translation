base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/002.yaml
  text: She did not obey the voice[a]; she did not accept correction. She did not trust in Yahweh[d][c][b]; she did not draw near to her God.
translation:
  language: pt
  text: Ela não obedeceu à voz[a], não aceitou a correção[b]. Não confiou em Yahweh[c], não se aproximou do seu Deus[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não ouviu a voz» ou «não deu ouvidos à voz». No idioma hebraico, ouvir pode incluir a ideia de obedecer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não recebeu disciplina» ou «não acolheu instrução».'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: YHWH, o nome divino, aqui representado como «Yahweh».'
    reason: alternative_reading
  - marker: d
    text: 'Ou: «não se achegou». A expressão pode ter conotações tanto relacionais quanto ligadas ao culto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה בְּקוֹל
  choice: não ouviu a voz
  rationale: A construção שׁמע בְּקוֹל pode significar ouvir com atenção e obedecer. Em português, «ouvir a voz» preserva a imagem e a ambiguidade do hebraico; a nota explicita a força possível de obediência.
- source_word: לָקְחָה מוּסָר
  choice: não aceitou a correção
  rationale: O idioma significa receber ou acolher instrução disciplinadora. «Aceitou a correção» é natural, atual e adequado ao contexto de repreensão profética.
- source_word: בַּיהוָה ... בָטָחָה
  choice: não confiou em Yahweh
  rationale: ב marca o objeto da confiança, e בטח expressa confiança ou dependência. O nome divino é transliterado como «Yahweh», preservando o nome pactual presente no texto.
- source_word: אֶל אֱלֹהֶיהָ לֹא קָרֵבָה
  choice: não se aproximou do seu Deus
  rationale: קרב com אֶל indica aproximar-se de alguém. A formulação pode abranger aproximação relacional e cultual sem escolher exclusivamente uma delas.
theological_decisions:
- issue: Referente do sujeito feminino singular
  choice: Manter «ela», com o antecedente implícito
  alternative: Explicitar «Jerusalém» ou «a cidade»
  rationale: As formas verbais hebraicas são femininas singulares e retomam a cidade personificada no contexto. O pronome preserva a construção literária sem inserir um substantivo ausente do versículo.
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o Tetragrama. «Yahweh» representa diretamente o nome próprio e evita substituí-lo por um título.
- issue: Amplitude de קָרֵבָה
  choice: não se aproximou
  alternative: não chegou perto ou não se achegou
  rationale: A tradução mantém em aberto se a aproximação é sobretudo relacional, devocional ou ligada ao culto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. O paralelismo em quatro negativas foi preservado. «Ela» conserva a personificação feminina da cidade; «se aproximou» evita um biblicismo excessivo sem eliminar as possíveis conotações cultuais.
