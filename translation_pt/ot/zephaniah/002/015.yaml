base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/015.yaml
  text: This is the exultant city that lived securely[a], that said in her heart, ‘I am, and there is none besides me.’ How she has become a desolation[b], a resting place for wild animals! Everyone who passes by her will hiss and wave his hand.
translation:
  language: pt
  text: 'Esta é a cidade exultante, que vivia em segurança, que dizia em seu coração: “Eu sou, e não há ninguém além de mim”. Como se tornou uma desolação[a], lugar de repouso para os animais selvagens! Todo aquele que passar por ela assobiará[b] e agitará a mão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um objeto de horror”. O termo hebraico pode indicar uma devastação que causa espanto ou horror, e não apenas ruína física.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “soltará um silvo”. O verbo hebraico pode designar um som agudo de espanto ou de escárnio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִיר הָעַלִּיזָה
  choice: a cidade exultante
  rationale: “Cidade” corresponde ao centro urbano em vista, e “exultante” conserva a alegria ostensiva e autossatisfeita ligada à arrogância de Nínive.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: que vivia em segurança
  rationale: Expressa de modo natural e atual o estado contínuo de habitação confiante indicado pelo particípio.
- source_word: הָאֹמְרָה בִּלְבָבָהּ
  choice: que dizia no coração
  rationale: Preserva a imagem hebraica da fala interior e a personificação feminina da cidade.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Eu sou, e não há ninguém além de mim
  rationale: Mantém a afirmação de exclusividade e a ressonância irônica da linguagem de soberania exclusiva, sem explicá-la dentro do texto.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: É uma formulação ampla que comunica devastação; a possível nuance de horror é registrada em nota.
- source_word: מַרְבֵּץ לַחַיָּה
  choice: lugar de repouso para os animais selvagens
  rationale: Comunica claramente um lugar onde animais silvestres se deitam entre as ruínas, sem restringir a expressão a covil de predadores.
- source_word: יִשְׁרֹק
  choice: assobiará
  rationale: O verbo pode indicar assobio ou silvo como reação de espanto ou escárnio; “assobiará” é natural em português, e a alternativa é preservada em nota.
- source_word: יָנִיעַ יָדוֹ
  choice: agitará a mão
  rationale: Mantém o gesto visível de desprezo ou assombro sem definir além do hebraico sua forma exata.
theological_decisions:
- issue: A jactância da cidade em אֲנִי וְאַפְסִי עוֹד
  choice: Eu sou, e não há ninguém além de mim
  alternative: Eu sou, e não existe nada além de mim
  rationale: A tradução preserva a surpreendente reivindicação de exclusividade e sua possível ressonância com declarações da soberania única do SENHOR, agora empregadas ironicamente por uma cidade orgulhosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a personificação feminina da cidade, o paralelismo profético e a ambiguidade dos gestos finais. Os marcadores [a] e [b] aparecem no texto exatamente onde incidem as alternativas lexicais.
