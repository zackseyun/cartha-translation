source:
  edition: WLC
  text: נוֹרָ֤א יְהוָה֙ עֲלֵי/הֶ֔ם כִּ֣י רָזָ֔ה אֵ֖ת כָּל אֱלֹהֵ֣י הָ/אָ֑רֶץ וְ/יִשְׁתַּֽחֲווּ ל/וֹ֙ אִ֣ישׁ מִ/מְּקוֹמ֔/וֹ כֹּ֖ל אִיֵּ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/011.yaml
  text: Yahweh will be fearsome against them[a], for he will make all the gods of the earth waste away; and they will bow down to him, each from his own place[b], all the coastlands of the nations.
translation:
  language: pt
  text: Yahweh será temível contra eles, pois fará definhar todos os deuses da terra; e eles se prostrarão diante dele, cada um a partir do seu próprio lugar — todas as regiões costeiras das nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as ilhas das nações”. “Regiões costeiras” é uma expressão profética comum para povos e regiões marítimas distantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: temível
  rationale: Como predicativo derivado de ירא, expressa que Yahweh inspira temor e assombro; “temível” preserva esse sentido ativo em português atual e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: No contexto de juízo contra as nações, עַל tem valor adversativo, não meramente espacial.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual Yahweh será temível contra eles.
- source_word: רָזָה
  choice: fará definhar
  rationale: O verbo evoca tornar-se magro ou emaciado. “Fará definhar” conserva a imagem e funciona naturalmente com os deuses como objeto.
- source_word: אֵת כָּל אֱלֹהֵי הָאָרֶץ
  choice: todos os deuses da terra
  rationale: Mantém a linguagem polêmica explícita do hebraico e o alcance universal de הָאָרֶץ.
- source_word: וְיִשְׁתַּחֲווּ לוֹ
  choice: e eles se prostrarão diante dele
  rationale: A forma verbal denota prostração e pode ter sentido cultual; esta formulação preserva o gesto e sua dimensão de adoração.
- source_word: אִישׁ מִמְּקוֹמוֹ
  choice: cada um desde o seu lugar
  rationale: Preserva o valor distributivo de אִישׁ e a preposição מִן, retratando adoração oferecida a partir de lugares dispersos.
- source_word: כֹּל אִיֵּי הַגּוֹיִם
  choice: todos os litorais das nações
  rationale: אִיִּים pode indicar ilhas ou regiões costeiras e, na linguagem profética, povos marítimos distantes; “litorais” comunica essa amplitude sem restringir a ilhas literais.
theological_decisions:
- issue: Como traduzir o juízo sobre “todos os deuses da terra” sem acrescentar uma afirmação metafísica além do texto
  choice: Manter “todos os deuses da terra” e dizer que Yahweh os fará definhar.
  alternative: Interpretar “deuses” apenas como ídolos ou parafrasear como a destruição de toda religião falsa.
  rationale: O hebraico diz explicitamente “deuses”; a tradução direta preserva a retórica sobre a supremacia de Yahweh sem inserir uma explicação sistemática.
- issue: Se a oração final indica peregrinação centralizada ou adoração mundial descentralizada
  choice: Traduzir “cada um desde o seu lugar”.
  alternative: “Cada um em seu lugar” ou uma interpretação explícita como peregrinação a Sião.
  rationale: A preposição מִן normalmente significa “de/desde”, e a expressão apresenta os povos adorando a partir de seus diversos lugares, sem tornar explícita uma centralização que o versículo não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da oração final mantém o pronome verbal e deixa “todos os litorais das nações” em aposição, como no hebraico. O marcador [a] aparece no texto principal.
