review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o juízo de Yahweh, a imagem de fazer os deuses definharem e a adoração prestada de locais dispersos. Contudo, “litorais” tende a designar faixas costeiras físicas e, na aposição final, produz uma construção pouco natural em português; “regiões costeiras” comunica melhor o emprego profético coletivo de אִיִּים sem restringi-lo a ilhas literais.
  naturalness: “Cada um desde o seu lugar” é compreensível, mas “cada um a partir do seu próprio lugar” é mais idiomático e torna explícito o valor distributivo de אִישׁ e a procedência indicada por מִן. O travessão esclarece que a expressão final está em aposição a “eles”.
  terminology: “Yahweh”, “temível”, “deuses da terra”, “fará definhar” e “prostrarão diante dele” são escolhas fiéis, dignas e adequadas ao português moderno. A nota deve acompanhar a revisão de “litorais” para manter correspondência terminológica.
  issues:
  - severity: low
    issue: “Todos os litorais das nações” é uma aposição semanticamente e estilisticamente áspera.
    rationale: Embora reflita literalmente a ordem final, “litorais” em português normalmente evoca trechos físicos de costa; “regiões costeiras” reproduz de modo mais natural o valor coletivo e profético de אִיִּים. O travessão torna a aposição inequívoca.
  - severity: low
    issue: “Cada um desde o seu lugar” soa menos idiomático no registro moderno.
    rationale: “A partir do seu próprio lugar” preserva o sentido de מִן (“de, desde”) e o possessivo enfático implícito no sufixo hebraico, com maior fluência.
  revised_text: Yahweh será temível contra eles, pois fará definhar todos os deuses da terra; e eles se prostrarão diante dele, cada um a partir do seu próprio lugar — todas as regiões costeiras das nações.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “todas as ilhas das nações”. “Regiões costeiras” é uma expressão profética comum para povos e regiões marítimas distantes.'
    reason: lexical_alternative
  revision_rationale: A revisão melhora a legibilidade portuguesa da aposição final e da expressão distributiva, sem alterar o sentido, o alcance universal ou a ambiguidade lexical entre “ilhas” e “regiões costeiras”.
