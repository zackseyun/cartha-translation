revisions:
- from: Yahweh será temível contra eles, pois fará definhar todos os deuses da terra; e eles se prostrarão diante dele, cada um desde o seu lugar, todos os litorais das nações.[a]
  to: Yahweh será temível contra eles, pois fará definhar todos os deuses da terra; e eles se prostrarão diante dele, cada um a partir do seu próprio lugar — todas as regiões costeiras das nações.[a]
