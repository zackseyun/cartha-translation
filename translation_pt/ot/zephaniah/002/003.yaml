  text: בַּקְּשׁ֤וּ אֶת יְהוָה֙ כָּל עַנְוֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר מִשְׁפָּט֖/וֹ פָּעָ֑לוּ בַּקְּשׁוּ צֶ֨דֶק֙ בַּקְּשׁ֣וּ עֲנָוָ֔ה אוּלַי֙ תִּסָּ֣תְר֔וּ בְּ/י֖וֹם אַף יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/003.yaml
  text: Seek Yahweh[a], all you humble of the land, who have carried out his justice; seek righteousness, seek humility[d][c][b]; perhaps you will be hidden in the day of Yahweh’s anger.
translation:
  language: pt
  text: Busquem Yahweh, todos vocês, humildes da terra[a], que põem em prática o seu juízo[b]. Busquem a justiça[c], busquem a humildade. Talvez vocês sejam escondidos[d] no dia da ira de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “humildes do país”.
    reason: lexical_alternative
  - marker: b
    text: Ou “que cumprem o seu preceito”; também “que praticam a sua justiça”.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por “retidão”.
    reason: lexical_alternative
  - marker: d
    text: Ou “sejam ocultados”; pelo sentido, “sejam protegidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקְּשׁוּ
  choice: Busquem
  rationale: O imperativo plural de בקשׁ é uma convocação direta. “Busquem” é corrente e preserva a repetição enfática do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עַנְוֵי הָאָרֶץ
  choice: humildes desta terra
  rationale: עַנְוֵי designa os humildes, mansos ou socialmente abatidos. “Humildes” mantém a ligação lexical e temática com “humildade” mais adiante. Neste contexto profético, הָאָרֶץ provavelmente se refere à terra onde vive o povo interpelado, embora “terra” em sentido mais amplo também seja possível.
- source_word: אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ
  choice: que põem em prática o seu juízo
  rationale: A expressão conserva o sentido ativo de פּעל, “fazer, realizar, praticar”, e a amplitude de מִשְׁפָּט, que pode indicar juízo, justiça ou determinação. “Põem em prática” soa natural em português sem transformar a frase apenas em obediência abstrata.
- source_word: צֶדֶק
  choice: justiça
  rationale: צֶדֶק abrange retidão e justiça. “Justiça” é claro e idiomático no contexto de conduta moral, enquanto “retidão” permanece uma alternativa legítima.
- source_word: עֲנָוָה
  choice: humildade
  rationale: O substantivo denota humildade, mansidão ou modéstia. “Humildade” é natural e retoma “humildes” no início do versículo.
- source_word: אוּלַי
  choice: Talvez
  rationale: אוּלַי expressa possibilidade, não certeza. “Talvez” preserva explicitamente essa tensão.
- source_word: תִּסָּתְרוּ
  choice: vocês sejam escondidos
  rationale: O nifal de סתר indica ser escondido ou ocultado. O subjuntivo após “talvez” é exigido pelo português e mantém a incerteza do hebraico; “protegidos” seria uma interpretação possível, mas menos literal.
- source_word: בְּיוֹם אַף יְהוָה
  choice: no dia da ira de Yahweh
  rationale: אַף aqui designa ira ou cólera. “Ira” preserva a intensidade profética e a expressão “no dia” traduz naturalmente בְּיוֹם.
theological_decisions:
- issue: Se o versículo promete proteção certa ou somente possível aos humildes
  choice: “Talvez vocês sejam escondidos” expressa possibilidade, não garantia.
  alternative: Entender a frase como promessa segura de livramento para o remanescente justo.
  rationale: O advérbio אוּלַי marca expressamente a contingência. A tradução preserva essa tensão em vez de convertê-la numa garantia.
translation_notes:
  register: Português moderno, digno e acessível, com concordância brasileira amplamente compreensível. A repetição de “Busquem” reproduz a força retórica do original. “Vocês” torna explícito o plural do hebraico sem recorrer a formas regionais ou arcaizantes. A formulação preserva tanto a incerteza de אוּלַי quanto a imagem passiva de ser escondido.
