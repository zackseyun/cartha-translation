  terminology: “Yahweh”, “justiça”, “humildade”, “juízo” e “ira” são escolhas defensáveis. A nota b deve usar alternativas mais diretamente ligadas a מִשְׁפָּט, como “preceito” ou “justiça”, em vez de “determinação”, que é menos precisa neste contexto.
