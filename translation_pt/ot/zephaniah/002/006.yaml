lexical_decisions:
- source_word: חֶבֶל הַיָּם
  choice: a região do litoral
  rationale: חֶבֶל indica aqui uma faixa ou região territorial, e הַיָּם especifica a costa marítima; a formulação é natural e mantém o sentido geográfico.
- source_word: נְוֹת
  choice: pastagens
  rationale: O plural designa lugares de pastoreio ou pastos, adequado ao contexto de pastores e rebanhos.
- source_word: כְּרֹת
  choice: poços
  rationale: Termo raro e de interpretação incerta, provavelmente relacionado a lugares escavados; 'poços' preserva essa imagem concreta e segue a leitura da camada de consulta, sem ocultar outras possibilidades.
- source_word: גִדְרוֹת צֹאן
  choice: cercados para os rebanhos
  rationale: גִדְרוֹת são recintos murados ou cercados, e צֹאן se refere coletivamente ao gado miúdo, sobretudo ovelhas e cabras; 'rebanhos' é claro e idiomático.
