  text: E a região do litoral se tornará pastagens, com poços[a] para os pastores e cercados para os rebanhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e incerto; também pode indicar cisternas, cavernas ou abrigos escavados.
