base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/008.yaml
  text: I have heard the reproach of Moab and the insults of the sons of Ammon[b][a], with which they reproached my people and magnified themselves against their border.
translation:
  language: pt
  text: “Ouvi as afrontas de Moabe e os insultos dos filhos de Amom[a], com os quais afrontaram o meu povo e se engrandeceram contra a sua fronteira[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os amonitas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se gabaram contra o seu território”. O possessivo provavelmente se refere ao território do meu povo, mas o hebraico permite alguma ambiguidade.'
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito na primeira pessoa expressa a ação concluída de ouvir; em português, o pretérito perfeito comunica naturalmente que a ofensa chegou ao conhecimento do Senhor.
- source_word: חֶרְפַּת
  choice: as afrontas
  rationale: O substantivo indica ultraje, escárnio ou reprovação dirigida contra alguém. “Afrontas” conserva tanto a dimensão verbal quanto a desonra causada.
- source_word: גִדּוּפֵי
  choice: os insultos
  rationale: O termo designa fala abusiva ou injuriosa. “Insultos” é claro e atual, sem especificar indevidamente blasfêmia dirigida diretamente a Deus.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Mantém a expressão gentílica hebraica de modo inteligível e relativamente formal; “os amonitas” é uma alternativa natural.
- source_word: אֲשֶׁר חֵרְפוּ
  choice: com os quais afrontaram
  rationale: A oração relativa retoma naturalmente as afrontas e os insultos como meios pelos quais Moabe e Amom atacaram o povo do Senhor.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Preserva diretamente a linguagem de pertencimento e aliança, sem expansão interpretativa.
- source_word: וַיַּגְדִּילוּ
  choice: se engrandeceram
  rationale: Reproduz a metáfora do hifil de גדל para autoexaltação arrogante, sem reduzi-la simplesmente a “se gabaram” ou “agiram com arrogância”.
- source_word: עַל גְּבוּלָם
  choice: contra as suas fronteiras
  rationale: “Contra” expressa o sentido hostil de עַל. O possessivo permanece formalmente ambíguo em português, enquanto “fronteiras” comunica os limites territoriais do povo recém-mencionado.
theological_decisions:
- issue: Referente do sufixo de terceira pessoa plural em גְּבוּלָם
  choice: Manter “suas fronteiras”, com referência contextual provável às fronteiras do meu povo
  alternative: Entender como as fronteiras dos próprios moabitas e amonitas, ou como território em sentido geral
  rationale: O antecedente imediato é “o meu povo”, e o contexto favorece a agressão territorial contra Judá. A tradução, porém, conserva a ambiguidade gramatical do possessivo em vez de inserir “do meu povo” no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo profético e a metáfora de autoengrandecimento sem soar arcaica. Todos os marcadores de nota aparecem no texto.
