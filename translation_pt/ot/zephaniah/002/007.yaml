  text: וְ/הָ֣יָה חֶ֗בֶל לִ/שְׁאֵרִ֛ית בֵּ֥ית יְהוּדָ֖ה עֲלֵי/הֶ֣ם יִרְע֑וּ/ן בְּ/בָתֵּ֣י אַשְׁקְל֗וֹן בָּ/עֶ֨רֶב֙ יִרְבָּצ֔וּ/ן כִּ֧י יִפְקְדֵ֛/ם יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/שָׁ֥ב שבות/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/007.yaml
  text: And the coastland shall belong to the remnant of the house of Judah; on it they shall pasture. In the houses of Ashkelon they shall lie down at evening, for Yahweh their God will attend to them and restore their fortunes.
translation:
  language: pt
  text: A faixa litorânea pertencerá ao remanescente da casa de Judá; nela apascentarão seus rebanhos. Ao entardecer, repousarão nas casas de Ascalom, pois Yahweh, seu Deus, cuidará deles[a] e restaurará a sorte deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os visitará” ou “voltará a atenção para eles”. O verbo hebraico pode indicar uma intervenção atenta, para bênção ou juízo; aqui, o contexto favorece o cuidado restaurador.
    reason: lexical_alternative
  - marker: b
    text: Ou “trará de volta os seus cativos”. A expressão hebraica muitas vezes significa restaurar a condição ou a sorte anterior de um povo.
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: faixa litorânea
  rationale: O substantivo designa uma extensão territorial; no contexto imediato da costa filisteia, “faixa litorânea” expressa com naturalidade o referente geográfico.
- source_word: שְׁאֵרִית
  choice: remanescente
  rationale: Preserva o sentido profético de um grupo de Judá que sobrevive e é preservado, sem reduzi-lo a uma simples sobra numérica.
- source_word: עֲלֵיהֶם יִרְעוּן
  choice: nela apascentarão seus rebanhos
  rationale: O pronome plural hebraico retoma coletivamente a região mencionada. A explicitação de “seus rebanhos” torna natural em português o uso pastoril de רעה sem sugerir que as próprias pessoas pastarão.
- source_word: בְּבָתֵּי אַשְׁקְלוֹן
  choice: nas casas de Ascalom
  rationale: Mantém de forma direta a imagem de habitação e descanso na antiga cidade filisteia.
- source_word: בָּעֶרֶב יִרְבָּצוּן
  choice: Ao entardecer, repousarão
  rationale: Reproduz o cenário temporal e a imagem concreta de se acomodar para descansar, com formulação corrente em português.
- source_word: יִפְקְדֵם
  choice: cuidará deles
  rationale: פקד pode indicar visitar, atentar para ou intervir. O contexto de restauração favorece uma intervenção benevolente, expressa naturalmente por “cuidará deles”, enquanto a nota registra a amplitude lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְשָׁב שְׁבוּתָם
  choice: e restabelecerá a sorte deles
  rationale: O idioma hebraico indica reversão da condição adversa e restauração; esta formulação preserva essa abrangência sem restringi-la necessariamente ao retorno de cativos.
theological_decisions:
- issue: Sentido da expressão restauradora וְשָׁב שְׁבוּתָם
  choice: restabelecerá a sorte deles
  alternative: trará de volta os seus cativos
  rationale: A expressão pode evocar o retorno de cativos, mas frequentemente designa de modo mais amplo a reversão da desgraça de um povo. O contexto enfatiza posse, pastoreio e segurança restaurados, por isso a tradução não a restringe ao exílio.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração o preserva e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ascalom” segue a forma portuguesa tradicional do topônimo. O paralelismo e as imagens pastorais foram preservados, com explicitação mínima de “seus rebanhos” para evitar uma leitura involuntária segundo a qual as próprias pessoas comeriam pasto.
