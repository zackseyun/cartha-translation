  text: וְ/רָבְצ֨וּ בְ/תוֹכָ֤/הּ עֲדָרִים֙ כָּל חַיְת/וֹ ג֔וֹי גַּם קָאַת֙ גַּם קִפֹּ֔ד בְּ/כַפְתֹּרֶ֖י/הָ יָלִ֑ינוּ ק֠וֹל יְשׁוֹרֵ֤ר בַּֽ/חַלּוֹן֙ חֹ֣רֶב בַּ/סַּ֔ף כִּ֥י אַרְזָ֖ה עֵרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/014.yaml
  text: Herds will lie down in her midst[a], every beast of the nations; both the desert owl and the hedgehog will spend the night among her capitals. A voice will sing in the window; devastation will be on the threshold[c][b], for her cedarwork has been laid bare.
translation:
  language: pt
  text: 'Rebanhos se deitarão no meio dela,

    animais de toda espécie[a].

    Tanto a coruja-do-deserto[b] como o ouriço[c]

    passarão a noite entre os seus capitéis.

    Uma voz cantará à janela;

    a desolação estará na soleira,

    pois seu revestimento de cedro ficou exposto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente algo como “todo animal de uma nação”; a expressão é difícil e provavelmente significa “animais de toda espécie”.
    reason: alternative_reading
  - marker: b
    text: A identificação do animal hebraico é incerta; também pode ser traduzido por “pelicano”.
    reason: lexical_alternative
  - marker: c
    text: A espécie indicada pelo termo hebraico é incerta; outra tradução possível é “porco-espinho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָבְצוּ ... עֲדָרִים
  choice: Rebanhos se deitarão
  rationale: רבץ descreve animais deitados ou repousando, e עֲדָרִים designa grupos de animais. A formulação mantém a cena concreta de animais ocupando a cidade arruinada.
- source_word: בְתוֹכָהּ
  choice: no meio dela
  rationale: O sufixo feminino retoma a cidade e preserva sua personificação.
- source_word: כָּל חַיְתוֹ גוֹי
  choice: animais de toda espécie
  rationale: A expressão hebraica é difícil e, tomada idiomaticamente, parece abranger toda sorte de animais. A nota registra sua forma mais literal sem impor certeza indevida.
- source_word: קָאַת
  choice: coruja-do-deserto
  rationale: A identificação zoológica é incerta. Esta opção combina com o cenário de desolação, enquanto a alternativa tradicional 'pelicano' é preservada em nota.
- source_word: קִפֹּד
  choice: ouriço
  rationale: A espécie exata é discutida. 'Ouriço' é uma equivalência tradicional plausível, com 'porco-espinho' registrado como alternativa.
- source_word: בְּכַפְתֹּרֶיהָ
  choice: em seus capitéis
  rationale: כפתור provavelmente se refere aos capitéis, isto é, às partes superiores ornamentadas das colunas.
- source_word: יָלִינוּ
  choice: passarão a noite
  rationale: לין significa pernoitar ou passar a noite; a expressão portuguesa é natural e mantém a imagem vívida.
- source_word: קוֹל יְשׁוֹרֵר
  choice: Uma voz cantará
  rationale: A tradução conserva tanto o substantivo 'voz' quanto o verbo ligado a cantar, sem identificar o emissor do som.
- source_word: חֹרֶב בַּסַּף
  choice: a desolação estará na soleira
  rationale: חֹרֶב pode indicar secura, ruína ou desolação; no contexto da cidade destruída, 'desolação' comunica melhor a imagem, enquanto סף é mantido concretamente como 'soleira'.
- source_word: כִּי אַרְזָה עֵרָה
  choice: pois seu revestimento de cedro ficou exposto
  rationale: A frase retrata a madeira de cedro descoberta pela destruição. 'Revestimento de cedro' explicita de modo natural o elemento arquitetônico sem alterar a imagem.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com paralelismo poético. A tradução mantém a cidade no feminino, conserva as imagens arquitetônicas e registra em notas as incertezas zoológicas e a dificuldade sintática.
