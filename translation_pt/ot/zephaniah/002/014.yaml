  source_fidelity: A tradução transmite adequadamente a cena de ruína, o repouso dos rebanhos, a expressão hebraica difícil לגבי toda sorte de animais, as duas identificações zoológicas incertas, a voz que canta na janela e a exposição do elemento de cedro. A locução בְּכַפְתֹּרֶיהָ admite uma relação espacial que, no contexto, é melhor expressa como animais alojados entre os capitéis, não dentro deles.
  naturalness: O português é poético, claro e de registro apropriado. A alteração de “em seus capitéis” para “entre os seus capitéis” elimina uma imagem espacial pouco natural em português, pois capitéis não são normalmente lugares em cujo interior animais pernoitam.
  terminology: “Coruja-do-deserto”, “ouriço”, “soleira”, “desolação” e “revestimento de cedro” são escolhas adequadas, com as incertezas lexicais importantes preservadas em notas. “Capitéis” é o termo arquitetônico correto.
