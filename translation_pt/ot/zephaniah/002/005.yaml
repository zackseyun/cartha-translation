source:
  edition: WLC
  text: ה֗וֹי יֹֽשְׁבֵ֛י חֶ֥בֶל הַ/יָּ֖ם גּ֣וֹי כְּרֵתִ֑ים דְּבַר יְהוָ֣ה עֲלֵי/כֶ֗ם כְּנַ֨עַן֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךְ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/005.yaml
  text: Woe[a], inhabitants of the seacoast, nation of the Cherethites! The word of Yahweh is against you, Canaan, land of the Philistines; and I will destroy you until no inhabitant remains.
translation:
  language: pt
  text: 'Ai dos habitantes do litoral,

    nação dos quereteus![a]


    A palavra de Yahweh está contra vocês,

    Canaã, terra dos filisteus;

    e eu destruirei você,

    a ponto de não restar habitante algum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico כְּרֵתִים, um etnônimo também transliterado como “queretitas”. Sua possível relação com Creta é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética que introduz ameaça e lamento de juízo; “Ai” conserva sua força oracular em português.
- source_word: יֹשְׁבֵי חֶבֶל הַיָּם
  choice: habitantes do litoral
  rationale: Expressa de modo natural os moradores da faixa costeira junto ao mar, sem reproduzir literalmente a construção hebraica.
- source_word: גּוֹי כְּרֵתִים
  choice: nação dos quereteus
  rationale: Mantém גּוֹי como entidade coletiva e translitera o etnônimo כְּרֵתִים segundo a forma tradicional em português.
- source_word: דְּבַר יְהוָה
  choice: A palavra de Yahweh
  rationale: Preserva a fórmula profética e representa diretamente o nome divino do texto hebraico.
- source_word: עֲלֵיכֶם
  choice: está contra vocês
  rationale: No contexto de juízo, a preposição indica que a palavra divina se dirige de modo adverso aos destinatários.
- source_word: כְּנַעַן אֶרֶץ פְּלִשְׁתִּים
  choice: Canaã, terra dos filisteus
  rationale: Conserva a aposição geográfica e retórica pela qual a região filisteia é chamada Canaã.
- source_word: וְהַאֲבַדְתִּיךְ
  choice: e eu destruirei você
  rationale: Traduz diretamente o hifil de אבד e preserva a mudança do plural anterior para o singular feminino, em que Canaã é interpelada como uma entidade.
- source_word: מֵאֵין יוֹשֵׁב
  choice: até não restar habitante algum
  rationale: Comunica com clareza o resultado de despovoamento completo indicado pela expressão hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Mudança do destinatário plural para o singular
  choice: “vocês” seguido de “você”
  alternative: Uniformizar todo o discurso no plural ou no singular
  rationale: O hebraico passa do sufixo plural em עֲלֵיכֶם ao sufixo singular feminino em וְהַאֲבַדְתִּיךְ, provavelmente personificando Canaã; a tradução preserva essa tensão gramatical.
translation_notes:
  register: Português moderno, claro e solene, com disposição poética. “Litoral” e “habitante algum” são amplamente compreensíveis; a alternância entre “vocês” e “você” é intencional para refletir a mudança de número no hebraico.
