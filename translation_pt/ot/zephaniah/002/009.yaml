source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֡נִי נְאֻם֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כִּֽי מוֹאָ֞ב כִּ/סְדֹ֤ם תִּֽהְיֶה֙ וּ/בְנֵ֤י עַמּוֹן֙ כַּֽ/עֲמֹרָ֔ה מִמְשַׁ֥ק חָר֛וּל וּ/מִכְרֵה מֶ֥לַח וּ/שְׁמָמָ֖ה עַד עוֹלָ֑ם שְׁאֵרִ֤ית עַמִּ/י֙ יְבָזּ֔וּ/ם וְ/יֶ֥תֶר גוי יִנְחָלֽוּ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/009.yaml
  text: Therefore[a], as I live, declares Yahweh of hosts, the God of Israel, Moab will surely become like Sodom, and the sons of Ammon like Gomorrah—a place overgrown with weeds, a salt pit, and a perpetual desolation. The remnant of my people will plunder them[b], and the remainder of my nation will inherit them.
translation:
  language: pt
  text: 'Por isso, tão certo como eu vivo — declara Yahweh dos Exércitos, o Deus de Israel — Moabe se tornará como Sodoma, e os amonitas[a], como Gomorra: um terreno coberto de urtigas[b], uma cova de sal e uma desolação perpétua. O remanescente do meu povo os saqueará, e o restante da minha nação tomará posse deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Amom”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “uma possessão de urtigas”. A expressão hebraica é difícil e pode descrever um terreno abandonado tomado por plantas espinhosas.
    reason: textual_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Mantém a conclusão lógica que decorre da acusação precedente, em português corrente.
- source_word: חַי אָנִי
  choice: tão certo como eu vivo
  rationale: Expressa naturalmente a fórmula solene do juramento divino sem reduzir sua força.
- source_word: נְאֻם יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  choice: declara Yahweh dos Exércitos, o Deus de Israel
  rationale: Verte נְאֻם como fórmula profética de declaração, preserva o nome divino Yahweh e traduz o título צְבָאוֹת de modo reconhecível.
- source_word: כִּי מוֹאָב כִּסְדֹם תִּהְיֶה
  choice: Moabe se tornará como Sodoma
  rationale: O contexto do juramento comunica certeza, enquanto תִּהְיֶה permite 'se tornará' no cenário de transformação pelo juízo.
- source_word: וּבְנֵי עַמּוֹן
  choice: e os amonitas
  rationale: É a designação coletiva natural em português; a forma literal 'filhos de Amom' é preservada em nota.
- source_word: מִמְשַׁק חָרוּל
  choice: um terreno coberto de urtigas
  rationale: A expressão hebraica é difícil e exclusiva; esta formulação comunica terra abandonada e tomada por vegetação espinhosa sem alegar certeza sobre o sentido exato de מִמְשַׁק.
- source_word: וּמִכְרֵה מֶלַח
  choice: uma cova de sal
  rationale: Preserva a imagem concreta de uma escavação ou depósito salino e evita a conotação industrial mais forte de 'mina de sal'.
- source_word: וּשְׁמָמָה עַד עוֹלָם
  choice: e uma desolação perpétua
  rationale: Reproduz de forma concisa a duração indefinida e enfática da devastação.
- source_word: שְׁאֵרִית עַמִּי
  choice: O remanescente do meu povo
  rationale: Conserva o importante termo profético 'remanescente'.
- source_word: יְבָזּוּם
  choice: os saqueará
  rationale: O verbo בזז indica tomar despojos; 'saquear' é claro e vigoroso em português moderno.
- source_word: וְיֶתֶר גוי יִנְחָלוּם
  choice: e o restante da minha nação tomará posse deles
  rationale: Expressa o sentido de receber ou ocupar como herança sem exigir que o objeto sejam pessoas, podendo referir-se aos povos ou aos seus territórios.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; 'Yahweh' preserva o nome pactual e segue a orientação fornecida.
- issue: Referente dos sufixos plurais em יְבָזּוּם e יִנְחָלוּם
  choice: os/deles, sem explicitar se são os povos ou seus territórios
  alternative: saqueará suas terras e as herdará
  rationale: Os pronomes hebraicos admitem referência a Moabe e Amom, aos habitantes ou, por extensão, aos territórios. A tradução mantém essa abertura em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A pontuação destaca o juramento e a fórmula profética sem alterar sua relação sintática. Os marcadores [a] e [b] aparecem junto às expressões a que suas notas se referem.
