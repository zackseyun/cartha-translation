  text: וְ/יֵ֤ט יָד/וֹ֙ עַל צָפ֔וֹן וִֽ/יאַבֵּ֖ד אֶת אַשּׁ֑וּר וְ/יָשֵׂ֤ם אֶת נִֽינְוֵה֙ לִ/שְׁמָמָ֔ה צִיָּ֖ה כַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/013.yaml
  text: And he will stretch out his hand against the north and destroy Assyria[a], and he will make Nineveh a desolation, dry like the wilderness.
translation:
  language: pt
  text: Ele estenderá a mão contra o norte e destruirá a Assíria; fará de Nínive uma desolação, árida como o deserto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como o ermo”. O hebraico midbar pode designar uma região desabitada, uma área de pastagem ou uma terra semelhante ao deserto, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵט יָדוֹ
  choice: estenderá a mão
  rationale: Mantém a imagem concreta do hebraico, em que נטה com “mão” comunica uma ação deliberada de juízo.
- source_word: עַל צָפוֹן
  choice: contra o norte
  rationale: No contexto hostil, עַל indica oposição; “o norte” designa a região onde ficava a Assíria em relação a Judá.
- source_word: וִיאַבֵּד אֶת אַשּׁוּר
  choice: destruirá a Assíria
  rationale: O hifil de אבד expressa causar destruição, e אַשּׁוּר se refere aqui ao território ou império assírio.
- source_word: וְיָשֵׂם אֶת נִינְוֵה לִשְׁמָמָה
  choice: fará de Nínive uma desolação
  rationale: Reproduz de modo natural a construção resultativa do hebraico e preserva a força nominal de שְׁמָמָה.
- source_word: צִיָּה
  choice: uma terra seca
  rationale: O termo descreve aridez extrema; a explicitação de “terra” permite uma formulação portuguesa natural sem reduzir a imagem a mero adjetivo.
- source_word: כַּמִּדְבָּר
  choice: como o deserto
  rationale: “Deserto” comunica de forma clara a região erma e inabitada pretendida no contexto, enquanto a nota preserva a amplitude semântica de מִדְבָּר.
theological_decisions:
- issue: Representação antropomórfica do juízo divino
  choice: Manter “estenderá a mão”
  alternative: “agirá contra o norte”
  rationale: O hebraico emprega deliberadamente uma imagem corporal para a ação judicial de Deus; preservá-la mantém a força da retórica profética sem convertê-la em abstração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção fluente tanto no Brasil quanto em outros contextos lusófonos. A pontuação separa os dois movimentos do juízo, e a nota foi colocada junto a “deserto”, termo ao qual se refere.
