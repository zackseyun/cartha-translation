  text: כִּ֤י עַזָּה֙ עֲזוּבָ֣ה תִֽהְיֶ֔ה וְ/אַשְׁקְל֖וֹן לִ/שְׁמָמָ֑ה אַשְׁדּ֗וֹד בַּֽ/צָּהֳרַ֨יִם֙ יְגָ֣רְשׁ֔וּ/הָ וְ/עֶקְר֖וֹן תֵּעָקֵֽר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/004.yaml
  text: For Gaza will be abandoned[a], and Ashkelon a desolation; Ashdod—they will drive her out at noon[b], and Ekron will be uprooted.
translation:
  language: pt
  text: Pois Gaza será abandonada[a], e Ascalom ficará desolada; Asdode — ao meio-dia a expulsarão[b] —, e Ecrom será arrancada pela raiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No hebraico, há provavelmente um jogo de palavras: “Gaza” (ʿAzzah) e “abandonada” (ʿazuvah) têm sons semelhantes.'
    reason: lexical_alternative
  - marker: b
    text: A expressão indica que a expulsão de Asdode acontecerá em plena luz do dia, não às escondidas.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a exortação anterior, preservando a ligação causal de modo natural em português.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forma consagrada do nome geográfico em português.
- source_word: עֲזוּבָה תִהְיֶה
  choice: será abandonada
  rationale: Expressa o sentido passivo e resultativo de עזב e mantém, tanto quanto possível, a proximidade sonora do jogo de palavras hebraico sem criar um trocadilho artificial.
- source_word: אַשְׁקְלוֹן לִשְׁמָמָה
  choice: Ascalom ficará desolada
  rationale: Torna explícita em português a predicação elíptica do hebraico e comunica o estado de devastação indicado por שׁממה.
- source_word: אַשְׁדּוֹד
  choice: Asdode
  rationale: Forma tradicional e reconhecível do topônimo em português.
- source_word: בַּצָּהֳרַיִם
  choice: ao meio-dia
  rationale: Tradução direta da expressão temporal, com sua imagem vívida de uma expulsão realizada em plena luz do dia.
- source_word: יְגָרְשׁוּהָ
  choice: a expulsarão
  rationale: Preserva o sujeito plural indefinido e o sufixo feminino referente à cidade, com formulação natural em português.
- source_word: וְעֶקְרוֹן
  choice: e Ecrom
  rationale: Emprega a forma portuguesa tradicional do nome e conserva a coordenação simples.
- source_word: תֵּעָקֵר
  choice: será arrancada pela raiz
  rationale: Mantém de maneira clara e idiomática a metáfora de desenraizamento presente no nifal de עקר.
