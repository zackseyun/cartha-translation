id: ZEP.2.10
reference: Zephaniah 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֹ֥את לָ/הֶ֖ם תַּ֣חַת גְּאוֹנָ֑/ם כִּ֤י חֵֽרְפוּ֙ וַ/יַּגְדִּ֔לוּ עַל עַ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/010.yaml
  text: This will be their lot in return for their pride[a], because they taunted and magnified themselves against the people of Yahweh of Armies.
translation:
  language: pt
  text: Isso lhes acontecerá em retribuição por seu orgulho, pois insultaram e se engrandeceram contra o povo de Yahweh dos Exércitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “SENHOR dos Exércitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת לָהֶם
  choice: Isso lhes acontecerá
  rationale: A construção nominal aponta para o juízo anunciado anteriormente como o resultado que lhes caberá; a formulação portuguesa explicita de modo natural a cópula implícita sem alterar o referente.
- source_word: תַּחַת גְּאוֹנָם
  choice: em retribuição por seu orgulho
  rationale: תַּחַת expressa aqui compensação punitiva, e גָּאוֹן denota orgulho arrogante no contexto do juízo.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do juízo; “pois” preserva com clareza a relação causal.
- source_word: חֵרְפוּ
  choice: insultaram
  rationale: O verbo comunica afronta e desprezo verbal. “Insultaram” é corrente e digno, sem restringir o sentido apenas à zombaria.
- source_word: וַיַּגְדִּלוּ עַל
  choice: e se engrandeceram contra
  rationale: Preserva a imagem hebraica de fazer-se grande diante de ou contra alguém e torna explícito o valor reflexivo implícito no idioma.
- source_word: עַם
  choice: o povo de
  rationale: “Povo” expressa naturalmente o sentido coletivo e pactual neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Traduz de maneira transparente o título divino e conserva sua força militar e cósmica; em português, a contração “dos” produz uma expressão natural.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; tradicionalmente, SENHOR dos exércitos/hostes
  rationale: O texto traz diretamente o nome יְהוָה. “Yahweh” preserva o nome pessoal, enquanto “dos Exércitos” comunica o sentido de צְבָאוֹת em português atual.
- issue: Sentido de וַיַּגְדִּילוּ עַל
  choice: se engrandeceram contra
  alternative: se exaltaram sobre; vangloriaram-se contra
  rationale: A escolha mantém tanto a metáfora de grandeza quanto a orientação hostil marcada por עַל, sem decidir além do necessário entre arrogância verbal e pretensão de superioridade.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom é solene sem ser arcaico. “Retribuição” conserva a ideia judicial de correspondência, e “se engrandeceram contra” mantém a imagem e a tensão do hebraico.
