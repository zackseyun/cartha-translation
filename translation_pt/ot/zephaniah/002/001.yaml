  text: הִֽתְקוֹשְׁשׁ֖וּ וָ/ק֑וֹשּׁוּ הַ/גּ֖וֹי לֹ֥א נִכְסָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/001.yaml
  text: Gather yourselves together[a], yes, gather, O shameless nation,
translation:
  language: pt
  text: Reúnam-se, sim, reúnam-se, ó nação sem vergonha[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “ó nação não desejada” ou “ó nação sem anseio”. A expressão hebraica é difícil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְקוֹשְׁשׁוּ
  choice: Reúnam-se
  rationale: O imperativo hitpolel plural de קשׁשׁ é reflexivo e, neste contexto, convoca o povo a reunir-se. Embora a raiz possa designar literalmente o ato de recolher palha, o sentido figurado se ajusta melhor ao paralelismo.
- source_word: וָקֹושּׁוּ
  choice: sim, reúnam-se
  rationale: O segundo imperativo repete e intensifica o primeiro. “Sim” comunica em português a força enfática do waw, preservando a repetição retórica.
- source_word: הַגּוֹי
  choice: nação
  rationale: גּוֹי designa coletivamente uma nação ou um povo; “nação” preserva bem o caráter coletivo da interpelação profética.
- source_word: לֹא נִכְסָף
  choice: sem vergonha
  rationale: A expressão hebraica é difícil. “Sem vergonha” transmite uma leitura contextual possível da censura profética, enquanto a nota preserva os sentidos mais literais ligados ao desejo ou anseio.
theological_decisions:
- issue: Sentido de לֹא נִכְסָף
  choice: sem vergonha
  alternative: não desejada; sem anseio
  rationale: O contexto admite uma caracterização moral da nação, mas a forma hebraica pode ser entendida mais literalmente em relação a ser desejada ou sentir anseio. A tradução mantém a leitura contextual no texto e registra a ambiguidade lexical em nota, sem a resolver dogmaticamente.
translation_notes:
  register: Português moderno, claro e solene, com forma verbal corrente no Brasil e amplamente compreensível no mundo lusófono. A repetição enfática do original foi preservada.
