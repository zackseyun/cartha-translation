base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/012.yaml
  text: You Cushites also will be slain by my sword[a][b].
translation:
  language: pt
  text: Também vocês, cuxitas, serão mortos pela minha espada.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Também vocês, cuxitas — eles são os mortos pela minha espada.”'
    reason: lexical_alternative
  - marker: b
    text: “Cuxitas” também pode ser traduzido como “etíopes”; refere-se ao povo de Cuxe.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: também
  rationale: Preserva a força aditiva, incluindo os cuchitas entre as nações alcançadas pelo juízo.
- source_word: אַתֶּם
  choice: vocês
  rationale: Reproduz a interpelação direta na segunda pessoa do plural em português atual e amplamente compreensível.
- source_word: כּוּשִׁים
  choice: cuchitas
  rationale: Mantém o etnônimo ligado a Cuxe sem identificá-lo de modo impreciso com uma nação moderna.
- source_word: חַֽלְלֵי
  choice: mortos
  rationale: Expressa naturalmente o substantivo que designa os mortos por violência; a formulação verbal evita uma construção rígida em português.
- source_word: חַרְבִּי
  choice: pela minha espada
  rationale: Conserva a imagem concreta da espada e traduz a relação instrumental que a construção comunica no contexto.
- source_word: הֵמָּה
  choice: serão
  rationale: A cláusula nominal hebraica é apresentada em português com valor futuro, adequado ao anúncio profético de juízo, enquanto a nota preserva a forma mais literal.
theological_decisions:
- issue: Valor temporal implícito na cláusula sem verbo
  choice: 'futuro: “serão mortos”'
  alternative: 'forma mais literal, semelhante ao presente: “eles são os mortos pela minha espada”'
  rationale: O contexto profético aponta para um juízo anunciado. O futuro torna essa força natural em português sem ocultar, graças à nota, que o hebraico não traz verbo expresso.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. “Vocês” torna natural a interpelação plural; “cuchitas” preserva o nome étnico antigo. As notas registram tanto a estrutura nominal hebraica quanto a tradução geográfica tradicional.
