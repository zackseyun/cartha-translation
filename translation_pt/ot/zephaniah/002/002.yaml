base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/002.yaml
  text: before the decree gives birth—before the day passes away like chaff—before the burning anger of Yahweh comes upon you[c][b][a], before the day of Yahweh’s anger comes upon you.
translation:
  language: pt
  text: antes que o decreto dê à luz[a] — antes que o dia passe como a palha[b] — antes que venha sobre vocês a ira ardente de Yahweh,[c] antes que venha sobre vocês o dia da ira de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «antes que o decreto entre em vigor». O hebraico diz literalmente «antes que o decreto dê à luz», usando a imagem do parto para o surgimento ou a execução do que foi decretado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «antes que o dia passe depressa como a palha». O hebraico é compacto e poético, e a relação exata entre «o dia» e «como a palha» admite mais de uma compreensão.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: «a ira ardente de Yahweh»; na frase seguinte: «o dia da ira de Yahweh».'
    reason: source_form
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: antes que
  rationale: A locução temporal se repete três vezes e cria uma advertência urgente; «antes que» é natural em português e preserva a anáfora.
- source_word: לֶדֶת
  choice: dê à luz
  rationale: O infinitivo de ילד pertence ao campo semântico do parto. A expressão mantém a imagem vívida do hebraico, embora seja metafórica e incomum com «decreto».
- source_word: חֹק
  choice: decreto
  rationale: Neste contexto profético, indica uma determinação fixada, não uma lei em sentido geral.
- source_word: כְּמֹץ
  choice: como a palha
  rationale: Preserva a comparação com a palha leve que é rapidamente levada embora; em português bíblico corrente, «palha» comunica a imagem melhor que termos técnicos como «restolho».
- source_word: עָבַר יוֹם
  choice: o dia passe
  rationale: Expressa de modo idiomático o rápido transcorrer do dia e mantém a concisão poética.
- source_word: חֲרוֹן אַף
  choice: ira ardente
  rationale: O idioma hebraico descreve uma ira intensa, figurada como calor; «ira ardente» conserva tanto a força quanto a metáfora.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: venha sobre vocês
  rationale: Mantém a fórmula de juízo e a força direcional de עַל, em português claro e natural.
- source_word: יוֹם אַף יְהוָה
  choice: o dia da ira de Yahweh
  rationale: Reproduz diretamente a cadeia construta sem transformá-la na expressão técnica mais ampla «dia de Yahweh».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e evita substituí-lo silenciosamente por um título.
- issue: Força metafórica de לֶדֶת חֹק
  choice: manter a imagem de parto em «o decreto dê à luz»
  alternative: «o decreto entre em vigor» ou «a decisão seja executada»
  rationale: O hebraico emprega linguagem explícita de nascimento. A tradução conserva a estranheza poética e apresenta em nota a interpretação abstrata, sem resolver uma imagem ambígua.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. A repetição de «antes que» preserva a urgência retórica, e os travessões mantêm a estrutura poética compacta. A expressão deliberadamente incomum «o decreto dê à luz» conserva a metáfora hebraica, esclarecida em nota.
