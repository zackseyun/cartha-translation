source:
  edition: WLC
  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: pt
  text: Coloque a tampa da expiação[a] sobre a arca do testemunho[b], no Lugar Santíssimo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o propiciatório».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «a arca do testemunho»; muitas traduções trazem «a arca da aliança».'
    reason: alternative_reading
  - marker: c
    text: Ou «no Santo dos Santos».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Coloque
  rationale: O qal perfeito na segunda pessoa masculina singular, com a conjunção, integra uma sequência de instruções e tem força de ordem. O imperativo é natural e inequívoco em português.
- source_word: הַכַּפֹּרֶת
  choice: a tampa da expiação
  rationale: Designa a tampa sagrada da arca, associada ao rito de expiação. A expressão comunica tanto a natureza concreta do objeto quanto sua função cultual, enquanto a alternativa tradicional «propiciatório» é preservada em nota.
- source_word: עַל
  choice: sobre
  rationale: Indica a posição da tampa em cima da arca; «sobre» é claro e natural neste contexto.
- source_word: אֲרוֹן הָעֵדֻת
  choice: a arca do testemunho
  rationale: Reproduz o hebraico de modo direto, sem substituí-lo pela expressão tradicional «arca da aliança». «Arca» permanece como o termo consagrado para esse cofre sagrado.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: no Lugar Santíssimo
  rationale: O idioma hebraico expressa o grau superlativo de santidade e se refere ao recinto mais interior do santuário. «Lugar Santíssimo» é claro, digno e amplamente compreensível.
theological_decisions:
- issue: Como traduzir o nome da tampa sagrada da arca sem impor uma interpretação doutrinária excessiva
  choice: Usar «tampa da expiação» no texto principal
  alternative: Usar «propiciatório»
  rationale: «Tampa da expiação» identifica o objeto e sua associação cultual sem desenvolver uma teoria específica da expiação. «Propiciatório», embora tradicional, é menos transparente para muitos leitores e pode sugerir uma interpretação mais delimitada.
- issue: Preservar a designação hebraica da arca ou harmonizá-la com a expressão mais conhecida
  choice: Usar «arca do testemunho»
  alternative: Usar «arca da aliança»
  rationale: O texto hebraico diz explicitamente «testemunho». A tradução mantém essa formulação e registra a expressão tradicional apenas como informação comparativa.
- issue: Traduzir literalmente o superlativo hebraico ou empregar a designação corrente do recinto
  choice: Usar «Lugar Santíssimo»
  alternative: Usar «Santo dos Santos»
  rationale: A escolha transmite com clareza o sentido superlativo do hebraico, enquanto a forma tradicional é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. O imperativo evita uma leitura meramente futura; a terminologia cultual combina transparência no texto principal com formas tradicionais nas notas.
