  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: pt
  text: Faça cinco colunas de madeira de acácia para a cortina da entrada[a] e revista-as de ouro. Seus ganchos serão de ouro, e funda para elas cinco bases de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também traduzido como “véu” ou “reposteiro”; o termo hebraico se refere aqui à cortina da entrada, distinta do véu interior do Lugar Santíssimo.
    reason: lexical_alternative
  - marker: b
    text: Ou “encaixes de bronze” ou “pedestais de bronze”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: cortina da entrada
  rationale: Neste contexto, designa a cortina que fechava a entrada do tabernáculo, distinta do véu interior; a explicitação funcional evita confusão em português.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: colunas de madeira de acácia
  rationale: עַמּוּדִים designa suportes verticais, e שִׁטִּים é a madeira de acácia usada nas instruções do tabernáculo.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: revista-as de ouro
  rationale: O verbo צפה, nesta construção, indica cobrir ou revestir um objeto com metal; 'revestir de ouro' é natural e preciso em português.
- source_word: וָוֵיהֶם
  choice: seus ganchos
  rationale: No contexto das cortinas do tabernáculo, וָוִים provavelmente se refere aos ganchos ligados às colunas.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: você fundirá para elas
  rationale: יצק descreve a fundição de objetos metálicos, e לָהֶם indica que as bases seriam feitas para as colunas.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: bases de bronze
  rationale: אַדָן é o suporte ou encaixe inferior de uma coluna; נְחֹשֶׁת é adequadamente vertido como 'bronze' neste contexto de metalurgia antiga.
