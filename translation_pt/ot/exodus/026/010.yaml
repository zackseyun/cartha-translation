base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: pt
  text: Faça cinquenta laços na borda da cortina que está na extremidade do conjunto unido[a], e cinquenta laços na borda da cortina do segundo conjunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na união”. O termo hebraico se refere à unidade formada pela junção de várias cortinas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com waw, neste contexto instrutivo, expressa uma ordem. O imperativo singular é direto e natural em português moderno.
- source_word: לֻלָאֹת
  choice: laços
  rationale: Designa laçadas de tecido usadas para prender as cortinas. “Laços” é conciso e compreensível no contexto de montagem.
- source_word: שְׂפַת
  choice: borda
  rationale: Embora o sentido literal seja “lábio”, para uma peça de tecido o equivalente idiomático é “borda”.
- source_word: הַיְרִיעָה
  choice: cortina
  rationale: No contexto do tabernáculo, o termo designa uma grande peça de tecido; “cortina” preserva a terminologia tradicional e permanece clara.
- source_word: הָאֶחָת
  choice: um dos conjuntos
  rationale: O hebraico emprega “uma”, em contraste com “o segundo”. A formulação portuguesa identifica um conjunto sem converter indevidamente o numeral em “primeiro”.
- source_word: הַקִּיצֹנָה
  choice: que fica na extremidade
  rationale: Expressa a posição da cortina na ponta externa do conjunto de cortinas unidas.
- source_word: בַּחֹבָרֶת
  choice: conjuntos
  rationale: O substantivo se refere à unidade formada por várias cortinas ligadas entre si; “conjunto” comunica isso com clareza.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: do segundo conjunto
  rationale: A expressão distingue a outra unidade de cortinas unidas. Esta leitura corresponde à estrutura material descrita no contexto e evita a ideia enganosa de que se trata apenas da segunda cortina individual.
