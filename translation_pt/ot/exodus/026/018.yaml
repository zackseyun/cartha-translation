  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: pt
  text: 'Faça as armações para o tabernáculo: vinte armações para o lado sul, voltado para o sul.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tábuas”. O termo hebraico refere-se às peças estruturais do tabernáculo e pode ser entendido como “armações” ou “tábuas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito qal com conjunção, neste contexto de instruções, tem força de ordem. O imperativo em português transmite a diretiva com naturalidade, e «também» mantém a continuidade do וְ.
- source_word: הַקְּרָשִׁים
  choice: as armações
  rationale: קֶרֶשׁ designa aqui elementos estruturais verticais do tabernáculo. «Armações» comunica sua função sem restringir indevidamente a forma; a alternativa tradicional «tábuas» é registrada em nota.
- source_word: לַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: מִשְׁכָּן é o termo usual para a estrutura do santuário em Êxodo. Em português, «armações do tabernáculo» expressa de modo idiomático que elas pertencem à construção, embora a preposição hebraica seja לְ.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: vinte armações
  rationale: A construção hebraica usa o substantivo no singular após o numeral, mas o português exige o plural.
- source_word: לִפְאַת
  choice: para o lado
  rationale: פֵאָה pode significar lado, borda ou extremidade; na descrição arquitetônica, «lado» é a opção espacial mais clara.
- source_word: נֶגְבָּה תֵימָנָה
  choice: sul, voltado para o sul
  rationale: A formulação conserva os dois termos direcionais do hebraico, em vez de reduzi-los a um único adjetivo, e soa natural em português.
