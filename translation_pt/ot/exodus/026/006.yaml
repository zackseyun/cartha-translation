  text: וְ/עָשִׂ֕יתָ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וְ/חִבַּרְתָּ֨ אֶת הַ/יְרִיעֹ֜ת אִשָּׁ֤ה אֶל אֲחֹתָ/הּ֙ בַּ/קְּרָסִ֔ים וְ/הָיָ֥ה הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: pt
  text: Faça também cinquenta colchetes de ouro e una com eles as cortinas umas às outras, para que o tabernáculo forme uma só unidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito qal com waw, nesta sequência de instruções, tem força diretiva. O imperativo em português é claro e natural; “também” liga a ordem ao contexto precedente.
- source_word: קַרְסֵי זָהָב
  choice: colchetes de ouro
  rationale: קֶרֶס designa as peças de conexão usadas para prender as cortinas. “Colchetes” comunica um dispositivo de união sem definir excessivamente seu formato.
- source_word: וְחִבַּרְתָּ
  choice: una
  rationale: O verbo חבר significa juntar ou conectar. “Unir” é corrente e adequado às instruções de montagem.
- source_word: הַיְרִיעֹת
  choice: as cortinas
  rationale: יְרִיעָה designa aqui os grandes painéis de tecido do tabernáculo; “cortinas” é a tradução técnica tradicional e continua compreensível.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: umas às outras
  rationale: A expressão idiomática hebraica, literalmente “uma mulher à sua irmã”, indica correspondência e união recíproca entre objetos. A formulação portuguesa preserva o sentido sem introduzir estranheza indevida.
- source_word: בַּקְּרָסִים
  choice: com eles
  rationale: A preposição ב tem valor instrumental. O pronome retoma naturalmente os colchetes e evita repetição pesada.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: para que o tabernáculo forme uma só unidade
  rationale: A cláusula apresenta o resultado pretendido da união. “Tabernáculo” mantém o sentido técnico de מִשְׁכָּן, enquanto “forme uma só unidade” expressa com clareza que a estrutura composta deve tornar-se una.
theological_decisions:
- issue: Tradução de הַמִּשְׁכָּן
  choice: o tabernáculo
  alternative: a Habitação
  rationale: “Tabernáculo” é o termo técnico mais reconhecível no contexto do santuário de Êxodo. “Habitação” reflete mais diretamente a raiz hebraica, mas pode soar genérico neste versículo.
- issue: Sentido de וְהָיָה ... אֶחָד
  choice: para que ... forme uma só unidade
  alternative: e o tabernáculo será um
  rationale: A tradução escolhida explicita o resultado funcional da montagem sem atribuir ao texto qualquer simbolismo teológico adicional; a alternativa conserva mais de perto a sintaxe hebraica, porém é menos natural em português.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção é direta e instrutiva. Não se acrescentou nota para o idioma אִשָּׁה אֶל אֲחֹתָהּ porque “umas às outras” comunica integralmente o sentido e a literalidade semítica não altera a interpretação do versículo.
