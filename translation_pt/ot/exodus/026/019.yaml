base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: pt
  text: 'Faça quarenta bases de prata[a] debaixo das vinte armações[b]: duas bases debaixo de uma armação, para as suas duas espigas[c], e duas bases debaixo da armação seguinte, para as suas duas espigas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encaixes de prata”; o termo hebraico designa uma base que também servia de receptáculo na estrutura do santuário.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “tábuas”. O termo hebraico provavelmente se refere às peças estruturais verticais do santuário.
    reason: lexical_alternative
  - marker: c
    text: Isto é, as duas projeções de encaixe na parte inferior de cada armação.
    reason: clarification
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: bases de prata
  rationale: No contexto da construção do santuário, אֶדֶן designa a peça inferior de sustentação, provavelmente em forma de receptáculo. “Bases” é claro e arquitetonicamente adequado em português.
- source_word: תַּעֲשֶׂה
  choice: faça
  rationale: O imperfeito qal de segunda pessoa masculina singular tem aqui força diretiva. O imperativo em português comunica naturalmente a instrução dada a Moisés.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Expressa diretamente a posição das bases sob as peças verticais.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: armação
  rationale: No contexto do tabernáculo, קֶרֶשׁ se refere a uma peça estrutural vertical. “Armação” comunica sua função melhor que o tradicional “tábua”, sem limitar indevidamente sua forma.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: para as suas duas espigas
  rationale: Embora יָדוֹת signifique literalmente “mãos”, aqui é um termo arquitetônico para as projeções inferiores que se encaixavam nas bases. “Espigas” é o termo técnico apropriado de marcenaria.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: uma armação ... a armação seguinte
  rationale: A repetição hebraica tem sentido distributivo. Esta formulação natural em português deixa claro que cada armação recebe duas bases.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem é expressa pelo imperativo natural “faça”. Mantêm-se termos arquitetônicos suficientemente precisos, explicados em notas quando podem não ser familiares ao leitor comum.
