base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: pt
  text: Coloque a mesa do lado de fora do véu[a], e o candelabro diante da mesa, no lado sul do tabernáculo[b]; ponha a mesa no lado norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do lado de fora da cortina”. O hebraico פָּרֹכֶת designa a divisória interna do tabernáculo; “véu” foi mantido como equivalente tradicional mais específico.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico menorá; aqui traduzido como “candelabro” para comunicar o sentido do termo em português.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Coloque
  rationale: O verbo שׂוּם significa pôr, colocar ou dispor. O imperativo em português expressa naturalmente a instrução hebraica com valor prescritivo.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O substantivo significa simplesmente “mesa”. A identificação mais completa, conhecida pelo contexto, não foi acrescentada ao texto.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: do lado de fora do véu
  rationale: מִחוּץ indica o espaço exterior, e פָּרֹכֶת designa a divisória interna do tabernáculo. “Véu” preserva o termo tradicional e específico.
- source_word: הַמְּנֹרָה
  choice: o candelabro
  rationale: “Candelabro” traduz o nome do utensílio de iluminação de maneira clara e consagrada em português, sem recorrer à transliteração “menorá”.
- source_word: נֹכַח
  choice: diante de
  rationale: נֹכַח pode indicar posição em frente, face a face ou do lado oposto. “Diante de” é natural em português e conserva a relação espacial sem exigir contato ou orientação explícita.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: no lado sul do tabernáculo
  rationale: צֶלַע designa o lado ou flanco, e תֵּימָנָה indica a direção sul. A formulação é precisa e idiomática.
- source_word: וְהַשֻּׁלְחָן תִּתֵּן
  choice: ponha a mesa
  rationale: נָתַן tem sentido amplo de dar, pôr ou colocar. “Ponha” é natural neste contexto e evita repetição rígida sem alterar o sentido.
- source_word: עַל צֶלַע צָפוֹן
  choice: no lado norte
  rationale: A expressão identifica o lado norte do tabernáculo; “no lado norte” comunica diretamente a disposição espacial.
