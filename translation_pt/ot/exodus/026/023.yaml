  yaml_path: translation/ot/exodus/026/023.yaml
  text: And you shall make two boards for the corners of the tabernacle at the rear[a].
translation:
  language: pt
  text: Faça também duas tábuas para os cantos do tabernáculo, na parte de trás.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para as peças de canto do tabernáculo, nas duas partes posteriores”. Os termos hebraicos são arquitetônicos e um tanto técnicos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: também duas
  rationale: A conjunção dá continuidade à sequência de instruções; em português, “também” expressa naturalmente essa adição, enquanto “duas” preserva a forma numeral.
- source_word: קְרָשִׁים
  choice: tábuas
  rationale: No contexto da construção do tabernáculo, o termo designa as peças estruturais de madeira que formavam suas paredes. “Tábuas” é tradicional, claro e menos interpretativo que “armações”.
- source_word: תַּעֲשֶׂה
  choice: Faça
  rationale: O imperfeito na instrução tem força diretiva. O imperativo português comunica isso de modo natural e direto.
- source_word: לִ/מְקֻצְעֹת
  choice: para os cantos
  rationale: A expressão se refere aos cantos ou pontos angulares da estrutura. “Para os cantos” preserva o sentido sem definir indevidamente as tábuas como peças especiais de canto.
- source_word: הַ/מִּשְׁכָּן
  choice: do tabernáculo
  rationale: “Tabernáculo” é o termo português estabelecido para a habitação-santuário de Êxodo e distingue adequadamente essa estrutura sagrada.
- source_word: בַּ/יַּרְכָתָיִם
  choice: na parte de trás
  rationale: A forma dual indica as duas extremidades ou partes posteriores. Como o número de cantos já é dado por “duas tábuas”, esta formulação localiza os cantos com naturalidade e evita a repetição de “cantos”.
