  yaml_path: translation/ot/exodus/026/016.yaml
  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
translation:
  language: pt
  text: O comprimento de cada armação será de dez côvados, e a largura de cada armação, de um côvado e meio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “tábua” em vez de “armação” para o hebraico קֶרֶשׁ.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: armação
  rationale: No contexto da construção do tabernáculo, designa um elemento estrutural vertical. “Armação” comunica sua função provável em português moderno sem especificar além do hebraico; a alternativa tradicional “tábua” é registrada em nota.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dez côvados
  rationale: Preserva a antiga unidade de medida e traduz diretamente a expressão hebraica.
- source_word: אֹרֶךְ
  choice: comprimento
  rationale: Equivalente português usual para essa dimensão em descrições de construção.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: um côvado e meio
  rationale: Forma natural em português que preserva exatamente a medida hebraica.
- source_word: רֹחַב
  choice: largura
  rationale: Equivalente moderno e claro para a dimensão indicada.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: cada armação
  rationale: O singular definido com אֶחָד indica a medida de cada peça individual; “cada armação” expressa naturalmente esse sentido distributivo.
