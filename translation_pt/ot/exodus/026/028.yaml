  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: pt
  text: E a barra central[a], no meio das armações, se estenderá de uma extremidade à outra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”, em vez de “armações”. O termo hebraico se refere às peças estruturais verticais do tabernáculo; “armações” evita sugerir simples pranchas planas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: barra
  rationale: No contexto da construção do tabernáculo, designa uma peça horizontal que mantém unidas as estruturas verticais; “barra” é o termo arquitetônico mais natural em português.
- source_word: הַתִּיכֹן
  choice: central
  rationale: Identifica a barra situada no meio das demais; “central” é claro e natural neste contexto construtivo.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Preserva o sentido espacial de localização no interior ou entre as peças, sem especificar indevidamente o modo mecânico de instalação.
- source_word: הַקְּרָשִׁים
  choice: armações
  rationale: O termo se refere às peças estruturais verticais do tabernáculo. “Armações” evita sugerir simples tábuas planas e comunica sua função estrutural.
- source_word: מַבְרִחַ
  choice: se estenderá
  rationale: O particípio descreve a barra atravessando toda a extensão da estrutura. “Se estenderá” expressa o alcance sem acrescentar a ideia não explícita de passar por aberturas.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: de uma extremidade à outra
  rationale: Reproduz de modo natural e preciso a ideia de extensão completa entre os dois extremos.
