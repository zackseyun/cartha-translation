base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: pt
  text: Faça cortinas de pelos de cabra para servirem de tenda sobre o tabernáculo; faça onze cortinas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O qatal com waw integra a sequência de instruções dirigidas a Moisés. O imperativo em português transmite a ordem de modo natural e digno.
- source_word: יְרִיעֹת
  choice: cortinas
  rationale: No contexto da construção do tabernáculo, o termo designa grandes peças de tecido; “cortinas” é claro, corrente e preserva o vocabulário do contexto.
- source_word: עִזִּים
  choice: de pelos de cabra
  rationale: Literalmente, o hebraico diz “cabras”, mas aqui o nome indica o material empregado. “Pelos de cabra” explicita o sentido contextual sem alterar a referência.
- source_word: לְאֹהֶל
  choice: para servirem de tenda
  rationale: A preposição לְ expressa finalidade ou função. Esta formulação deixa claro que as cortinas formam a cobertura externa em forma de tenda.
- source_word: עַל הַמִּשְׁכָּן
  choice: sobre o tabernáculo
  rationale: עַל indica posição sobre a estrutura, e מִשְׁכָּן é mantido como o termo técnico tradicional “tabernáculo” neste contexto cultual.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: faça onze cortinas
  rationale: A repetição hebraica especifica o número total das cortinas. A formulação portuguesa evita o pouco natural “faça-as como onze cortinas” e preserva claramente a instrução.
