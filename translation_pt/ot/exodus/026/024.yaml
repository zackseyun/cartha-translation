revisions:
- from: As duas tábuas serão emparelhadas embaixo[a] e, juntas, ficarão completas no alto, até a mesma argola[b]. Assim será com ambas; formarão os dois cantos.
  to: As duas tábuas serão emparelhadas na parte inferior[a] e, juntas, ficarão completas na parte superior, até a única argola[b]. Assim será com ambas; serão destinadas aos dois cantos.
  rationale: A revisão elimina a inferência indevida de “mesma” e traduz הָאֶחָת por “a única”, mantendo a alternativa interpretativa na nota. Também torna as referências espaciais mais precisas e reduz a expansão interpretativa em “formarão os dois cantos”, sem alterar o sentido construtivo do versículo.
