base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: pt
  text: As duas tábuas serão emparelhadas na parte inferior[a] e, juntas, ficarão completas na parte superior, até a única argola[b]. Assim será com ambas; serão destinadas aos dois cantos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “geminadas” ou “correspondentes”; o hebraico descreve as duas tábuas como um par combinado.
    reason: lexical_alternative
  - marker: b
    text: Ou “até uma argola” ou “até a primeira argola”. A expressão hebraica pode indicar a argola que une o par de tábuas na parte superior.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: emparelhadas
  rationale: Expressa que as duas tábuas formam um par correspondente, de modo natural no contexto de construção.
- source_word: מִלְּמַטָּה
  choice: embaixo
  rationale: Indica com clareza a extremidade inferior das tábuas.
- source_word: וְיַחְדָּו
  choice: juntas
  rationale: Preserva a ideia de que as duas tábuas funcionam em união.
- source_word: תַמִּים
  choice: completas
  rationale: Mantém a noção de integridade ou acabamento estrutural, sem sugerir perfeição moral nem especificar um método de encaixe incerto.
- source_word: עַל רֹאשׁוֹ
  choice: no alto
  rationale: Traduz idiomaticamente a referência à extremidade superior da estrutura; o sufixo singular hebraico é entendido coletivamente.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: até a mesma argola
  rationale: O numeral pode assinalar a única e mesma argola na qual as duas peças convergem. A formulação preserva a função provável sem adotar a interpretação menos segura de 'primeira argola'.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: Assim será com ambas
  rationale: Resume de maneira concisa e idiomática a disposição prescrita para as duas tábuas.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: formarão os dois cantos
  rationale: No contexto, apresenta as tábuas descritas como os elementos destinados aos dois cantos, em português mais natural que uma reprodução rígida da preposição hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com terminologia concreta de construção. A ordem foi levemente ajustada para explicitar o referente plural implícito no hebraico. A ambiguidade de הָאֶחָת foi preservada em nota; evitou-se interpretar תַמִּים como perfeição moral.
