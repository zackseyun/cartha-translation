base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: pt
  text: A parte excedente que restar das cortinas da tenda[a] — a metade da cortina que sobrar — penderá sobre a parte de trás do tabernáculo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sobra que restar das cortinas da tenda”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega termos distintos: “tenda” para a camada de cobertura e “tabernáculo” para a estrutura.'
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: parte excedente
  rationale: O substantivo indica a porção de material que sobra e se projeta além da estrutura; “parte excedente” comunica o excesso material sem antecipar o verbo que descreve como ela ficará pendurada.
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: que restar / que sobrar
  rationale: Os particípios de עודף designam aquilo que fica além do necessário. A pequena variação em português evita repetição pesada, mantendo o mesmo sentido nas duas ocorrências.
- source_word: יְרִיעֹת
  choice: cortinas
  rationale: No contexto do tabernáculo, refere-se a grandes peças de tecido usadas como cobertura; “cortinas” é claro e tradicional sem deixar de ser corrente.
- source_word: הָאֹהֶל
  choice: da tenda
  rationale: Preserva a referência à camada de cobertura chamada “tenda” e sua distinção em relação ao מִשְׁכָּן mencionado no fim do versículo.
- source_word: חֲצִי הַיְרִיעָה
  choice: a metade da cortina
  rationale: Expressa diretamente metade de uma única cortina, preservando o singular do hebraico.
- source_word: תִּסְרַח
  choice: penderá
  rationale: Neste contexto arquitetônico, o verbo descreve a porção excedente estendendo-se para baixo na parte posterior; “penderá” reproduz essa imagem física com concisão.
- source_word: עַל אֲחֹרֵי
  choice: sobre a parte de trás de
  rationale: A expressão localiza o tecido por cima da região posterior da estrutura; a formulação portuguesa mantém tanto a ideia espacial de עַל quanto a referência à parte traseira.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É o termo técnico estabelecido para a estrutura-santuário, aqui distinta da “tenda” ou camada de cobertura.
theological_decisions:
- issue: Distinção entre אֹהֶל e מִשְׁכָּן
  choice: tenda e tabernáculo
  alternative: traduzir ambos por “tabernáculo”
  rationale: O hebraico emprega dois termos diferentes no mesmo versículo. Preservar essa distinção evita identificar silenciosamente a cobertura com toda a estrutura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O travessão delimita a explicação interna do hebraico, e o futuro verbal conserva o caráter prescritivo da passagem.
