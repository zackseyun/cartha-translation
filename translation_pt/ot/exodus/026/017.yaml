review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura distributiva de «cada tábua», o número de duas peças e a instrução para todas as tábuas. Contudo, «encaixes» normalmente designa em português a cavidade, o ajuste ou a junção como um todo, enquanto יָדוֹת neste contexto designa as partes salientes da tábua. «Espigas» é o equivalente técnico usual para esses tenões/projeções e é mais fiel sem precisar definir o mecanismo além do que o hebraico permite.
  naturalness: '«Dois encaixes unidos um ao outro» é pouco natural e semanticamente impreciso: encaixes não são normalmente as peças salientes que se unem. «Duas espigas, unidas uma à outra» é claro, digno e compreensível no registro instrucional.'
  terminology: «Tábua» e «tabernáculo» são adequados e consistentes. A nota deve conservar o literal «para uma tábua», em vez de introduzir o distributivo «para cada tábua» sob a rubrica «literalmente».
  issues:
  - severity: medium
    issue: «Encaixes» para יָדוֹת
    rationale: No contexto construtivo, o termo se refere às projeções/tenões da tábua, não primariamente aos encaixes ou cavidades. «Espigas» comunica a peça saliente de modo tecnicamente apropriado.
  - severity: low
    issue: A nota chama de literal «para cada tábua»
    rationale: O hebraico traz formalmente «para a/uma tábua»; o sentido distributivo está corretamente expresso no texto principal, mas não deve ser apresentado como literal na nota.
  revised_text: Cada tábua terá duas espigas, unidas uma à outra[a]; assim você fará com todas as tábuas do tabernáculo.
  revised_footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “duas mãos para uma tábua, unidas, uma mulher à sua irmã”. Aqui, “mãos” se refere às partes salientes usadas para encaixe.'
    reason: lexical_alternative
  revision_rationale: Substitui-se «encaixes» por «espigas», pois o hebraico descreve as projeções de madeira da tábua. Também se ajusta a nota para que seu enunciado literal reflita o singular formal hebraico, mantendo no texto principal a força distributiva natural do contexto.
