translation:
  language: pt
  text: Cada tábua terá duas espigas, unidas uma à outra[a]; assim você fará com todas as tábuas do tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “duas mãos para uma tábua, unidas, uma mulher à sua irmã”. Aqui, “mãos” se refere às partes salientes usadas para encaixe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: encaixes
  rationale: Literalmente, “mãos”; no contexto da carpintaria do tabernáculo, designa as saliências destinadas a ajustar a tábua às bases. “Encaixes” é claro em português e evita impor uma configuração técnica mais precisa do que o hebraico permite.
- source_word: מְשֻׁלָּבֹת
  choice: unidos
  rationale: O particípio passivo indica que as duas partes são ligadas ou ajustadas entre si, sem definir com exatidão o mecanismo.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: um ao outro
  rationale: O idioma hebraico, literalmente “uma mulher à sua irmã”, expressa correspondência entre duas partes semelhantes. A formulação portuguesa preserva essa relação de modo inteligível.
- source_word: קֶרֶשׁ
  choice: tábua
  rationale: Designa cada peça vertical de madeira da estrutura do tabernáculo. “Tábua” é tradicional, transparente e não transforma indevidamente a peça em uma armação completa.
- source_word: מִשְׁכָּן
  choice: tabernáculo
  rationale: Embora relacionado ao sentido de “morada”, neste contexto é a designação estabelecida do santuário portátil.
- source_word: כֵּן תַּעֲשֶׂה
  choice: assim você fará
  rationale: Reproduz de forma natural e digna tanto o modo prescrito como a força diretiva da construção hebraica.
- source_word: שְׁתֵּי
  choice: dois
  rationale: Numeral que quantifica os encaixes; emprega-se o masculino em concordância com “encaixes”.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: cada tábua
  rationale: A expressão formalmente singular, “para a tábua, uma”, tem força distributiva no contexto e se aplica a cada peça individual.
