  text: וַ/חֲמִשָּׁ֣ה בְרִיחִ֔ם לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הַ/שֵּׁנִ֑ית וַ/חֲמִשָּׁ֣ה בְרִיחִ֗ם לְ/קַרְשֵׁי֙ צֶ֣לַע הַ/מִּשְׁכָּ֔ן לַ/יַּרְכָתַ֖יִם יָֽמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/027.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: pt
  text: e cinco travessas para as tábuas do segundo lado do tabernáculo[a], e cinco travessas para as tábuas do lado do tabernáculo na parte de trás, a oeste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do outro lado do tabernáculo”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “para a parte de trás, rumo ao oeste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: travessas
  rationale: No contexto da construção do tabernáculo, designa as peças horizontais que mantinham unidas as tábuas. “Travessas” é claro e mais específico em português do que o genérico “barras”.
- source_word: קַרְשֵׁי
  choice: tábuas
  rationale: Refere-se às peças estruturais de madeira do tabernáculo. “Tábuas” é uma tradução tradicional, clara e sem impor a interpretação mais específica de que fossem armações vazadas.
- source_word: צֶלַע
  choice: lado
  rationale: No contexto arquitetônico, indica um dos lados do tabernáculo.
- source_word: הַשֵּׁנִית
  choice: segundo
  rationale: Reproduz diretamente o ordinal hebraico, embora no contexto possa ter o sentido de “outro”, isto é, o lado oposto ao mencionado antes.
- source_word: מִּשְׁכָּן
  choice: tabernáculo
  rationale: Embora o termo esteja ligado à ideia de habitação, aqui funciona como a designação estabelecida do santuário portátil de Israel.
- source_word: לַיַּרְכָתַיִם
  choice: na parte de trás
  rationale: Comunica naturalmente a extremidade posterior do tabernáculo neste contexto arquitetônico.
- source_word: יָמָּה
  choice: a oeste
  rationale: O advérbio direcional significa “rumo ao mar” e, geograficamente, “para o oeste”; neste contexto, “a oeste” expressa com clareza a orientação da parte traseira.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: e cinco ... e cinco
  rationale: Mantém a coordenação repetida e o caráter enumerativo das instruções hebraicas.
theological_decisions: []
