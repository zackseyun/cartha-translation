base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: pt
  text: Para a parte de trás do tabernáculo[a], no lado oeste, faça seis tábuas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «armações», caso se entenda que as peças estruturais eram estruturas abertas, e não pranchas maciças.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Para a parte de trás de
  rationale: O termo designa a parte mais distante ou posterior da estrutura; «parte de trás» é natural e arquitetonicamente claro em português.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É o termo consagrado e reconhecível para a estrutura sagrada descrita em Êxodo.
- source_word: יָמָּה
  choice: no lado oeste
  rationale: Embora literalmente relacionado à direção do mar, o advérbio indica o oeste; aqui, «no lado oeste» expressa com clareza a localização da parte posterior.
- source_word: תַּעֲשֶׂה
  choice: faça
  rationale: O imperfeito de segunda pessoa masculina singular tem força diretiva neste conjunto de instruções; o imperativo português é natural e fiel.
- source_word: שִׁשָּׁה
  choice: seis
  rationale: Tradução direta do numeral cardinal.
- source_word: קְרָשִׁים
  choice: tábuas
  rationale: O substantivo indica as peças estruturais de madeira das paredes do tabernáculo. «Tábuas» é a tradução tradicional e clara, embora a forma exata das peças permaneça discutida.
theological_decisions: []
