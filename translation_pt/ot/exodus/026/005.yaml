base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: pt
  text: Faça cinquenta laçadas em uma cortina e faça cinquenta laçadas na borda da cortina que está no segundo conjunto; as laçadas devem ficar umas em frente às outras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma mulher para sua irmã”, expressão hebraica que indica que as laçadas deviam corresponder e ficar alinhadas com as do outro conjunto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: laçadas
  rationale: Designa presilhas em forma de laço usadas para unir as cortinas. “Laçadas” distingue essas peças dos colchetes metálicos mencionados no versículo seguinte.
- source_word: יְרִיעָה
  choice: cortina
  rationale: No contexto do tabernáculo, refere-se a uma grande peça de tecido; “cortina” é claro, tradicional e natural em português.
- source_word: הָאֶחָת
  choice: a primeira
  rationale: Embora o hebraico diga literalmente “a uma”, o contraste com o “segundo conjunto” e o contexto anterior tornam “a primeira” a formulação portuguesa mais clara, sem alterar a relação entre as peças.
- source_word: קְצֵה
  choice: borda
  rationale: Indica o limite exterior da cortina e se ajusta bem ao contexto de costura e união.
- source_word: מַחְבֶּרֶת
  choice: conjunto
  rationale: Refere-se ao agrupamento de cortinas já unidas descrito nos versículos anteriores; “conjunto” comunica naturalmente a unidade resultante.
- source_word: הַשֵּׁנִית
  choice: segundo
  rationale: Identifica diretamente o segundo dos dois conjuntos de cortinas.
- source_word: מַקְבִּילֹת
  choice: devem ficar umas diante das outras
  rationale: Preserva o sentido espacial de correspondência e alinhamento entre as laçadas dos dois conjuntos.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: umas diante das outras
  rationale: Traduz idiomaticamente a expressão hebraica literal “uma mulher diante de sua irmã”, aplicada aqui a objetos correspondentes; a imagem literal é preservada em nota.
