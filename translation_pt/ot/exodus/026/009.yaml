  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: pt
  text: Você unirá as cinco cortinas umas às outras e as seis cortinas umas às outras; depois dobrará a sexta cortina sobre si mesma, na frente da tenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: unirá
  rationale: O verbo חָבַר indica juntar ou ligar. “Unirá” é natural em português e expressa a formação de cada conjunto de cortinas.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: cortinas
  rationale: No contexto da construção da tenda, יְרִיעָה designa grandes peças de tecido. “Cortinas” é claro, tradicional e acessível.
- source_word: לְבָד
  choice: separadamente
  rationale: 'O termo distingue os dois conjuntos: cinco cortinas em um grupo e seis em outro.'
- source_word: כָפַלְתָּ
  choice: dobrará ... sobre si mesma
  rationale: כָּפַל transmite a ideia de duplicar mediante dobra. A expressão portuguesa esclarece que a sexta cortina fica dobrada em duas partes.
- source_word: הַשִּׁשִּׁית
  choice: a sexta cortina
  rationale: Tradução direta do ordinal que modifica “cortina”.
- source_word: אֶל מוּל פְּנֵי
  choice: diante da entrada de
  rationale: A expressão espacial aponta para a parte frontal da tenda. Como פְּנֵי pode indicar a frente ou face, “entrada” torna natural a referência arquitetônica, sem alterar a posição indicada.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: O hebraico usa אֹהֶל, “tenda”. Mantê-lo evita substituir o termo do texto por “tabernáculo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma verbal prescritiva no futuro. A repetição de “separadamente” preserva a distinção explícita entre os dois conjuntos; “as outras seis” evita a possível leitura de que as cinco já mencionadas estejam incluídas nas seis.
