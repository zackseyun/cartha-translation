- from: Você unirá separadamente as cinco cortinas e, separadamente, as outras seis; depois dobrará a sexta cortina sobre si mesma diante da entrada da tenda.
  to: Você unirá as cinco cortinas umas às outras e as seis cortinas umas às outras; depois dobrará a sexta cortina sobre si mesma, na frente da tenda.
  rationale: A revisão elimina a especificação não expressa de «entrada», não acrescenta «outras» e torna inequívoca a união das cortinas em dois grupos. Mantém a dobra da sexta cortina e a localização na parte frontal da tenda.
