base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: pt
  text: Você a pendurará em quatro colunas de madeira de acácia revestidas de ouro, com ganchos de ouro, sobre quatro bases[a] de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encaixes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: Você a pendurará
  rationale: Embora נתן tenha o sentido amplo de “pôr” ou “colocar”, o objeto feminino é o véu do versículo anterior; neste contexto, “pendurar” expressa de modo natural a ação indicada.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי שִׁטִּים
  choice: em quatro colunas de madeira de acácia
  rationale: עַמּוּדִים designa suportes verticais, e שִׁטִּים indica a madeira de acácia. A preposição “em” é idiomática em português para algo pendurado em suportes.
- source_word: מְצֻפִּים זָהָב
  choice: revestidas de ouro
  rationale: O particípio passivo de צפה indica que as colunas eram cobertas ou chapeadas com ouro; “revestidas” é claro e preciso.
- source_word: וָוֵיהֶם זָהָב
  choice: com ganchos de ouro
  rationale: וָוִים refere-se aos ganchos usados para sustentar o véu. A formulação preserva a referência aos ganchos pertencentes às colunas sem produzir uma construção pesada.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: sobre quatro bases de prata
  rationale: אֲדָנִים são peças inferiores de sustentação, possivelmente encaixes. “Bases” é natural e compreensível, enquanto a alternativa técnica é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. O pronome feminino “a” retoma o véu do versículo anterior. O marcador foi colocado junto a “bases”, termo ao qual a alternativa lexical se refere.
