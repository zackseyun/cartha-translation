  text: וּ/לְ/צֶ֧לַע הַ/מִּשְׁכָּ֛ן הַ/שֵּׁנִ֖ית לִ/פְאַ֣ת צָפ֑וֹן עֶשְׂרִ֖ים קָֽרֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: pt
  text: E, para o segundo lado do tabernáculo, no lado norte, vinte armações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”. O termo hebraico pode designar as peças estruturais verticais do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: E, para o ... lado
  rationale: A conjunção e a preposição introduzem naturalmente a especificação seguinte. Neste contexto arquitetônico, צֶלַע designa um lado ou parede lateral, não uma costela literal.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן é o termo habitual em Êxodo para a tenda-santuário; “tabernáculo” é tradicional, preciso e compreensível neste contexto.
- source_word: הַשֵּׁנִית
  choice: o segundo
  rationale: O adjetivo identifica o segundo dos dois lados longitudinais correspondentes, em sequência ao lado descrito no versículo anterior.
- source_word: לִפְאַת צָפוֹן
  choice: o lado norte
  rationale: A expressão indica a orientação da estrutura. A aposição “o lado norte” é natural em português e preserva a construção nominal e elíptica do hebraico.
- source_word: עֶשְׂרִים
  choice: vinte
  rationale: Equivalente cardinal direto.
- source_word: קָרֶשׁ
  choice: armações
  rationale: No relato do tabernáculo, קֶרֶשׁ designa peças estruturais verticais que formavam as paredes. “Armações” comunica essa função melhor que a tradução tradicional “tábuas”, embora esta continue lexicalmente possível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A frase nominal sem verbo preserva a forma elíptica da instrução hebraica e sua continuidade com o versículo anterior.
