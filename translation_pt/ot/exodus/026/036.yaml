base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: pt
  text: Faça uma cortina para a entrada da tenda,[a] de tecido azul, púrpura e escarlate e de linho fino retorcido, trabalho de bordador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reposteiro” ou “véu” que cobria a entrada. Aqui se usa “cortina” para distingui-la do véu interno descrito anteriormente neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: cortina
  rationale: Designa uma peça pendente que cobre ou fecha uma abertura. Em português, “cortina” expressa naturalmente sua função na entrada da tenda; a nota registra alternativas e a distingue do véu interno.
- source_word: לְפֶתַח הָאֹהֶל
  choice: para a entrada da tenda
  rationale: פֶתַח é a abertura ou entrada, e אֹהֶל significa “tenda”. A formulação é clara e evita substituir o termo por “tabernáculo”, que seria mais interpretativo.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: fios de tecido azul, púrpura e escarlate
  rationale: Os termos indicam materiais tingidos nessas cores. “Fios de tecido” explicita de modo natural o referente têxtil implícito na enumeração sem repetir “fio” após cada cor.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto a qualidade do linho quanto a indicação de que seus fios eram retorcidos.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: trabalho de bordador
  rationale: Mantém o foco no trabalho artesanal especializado e corresponde diretamente à construção hebraica.
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: No encadeamento de instruções, a forma verbal tem força diretiva. O imperativo português é atual, claro e digno.
