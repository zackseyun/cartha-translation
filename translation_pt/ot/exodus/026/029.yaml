translation_notes:
  register: 'Português moderno, claro e digno, com formas imperativas adequadas a instruções diretas. Os marcadores foram colocados junto aos termos que efetivamente explicam: [a] após “armações” e [b] após “travessas” na expressão sobre os suportes.'
