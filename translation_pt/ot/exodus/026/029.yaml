  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: pt
  text: Revista de ouro as armações[a], faça de ouro as suas argolas como receptáculos[b] para as travessas e revista de ouro as travessas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas” ou “pranchas”. O termo hebraico se refere às peças estruturais do tabernáculo.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “casas para as travessas”, isto é, receptáculos ou suportes para elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: as armações
  rationale: No contexto do tabernáculo, קֶרֶשׁ designa as peças estruturais verticais. “Armações” comunica sua função sem limitar a forma a simples tábuas ou pranchas.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: revista
  rationale: O piel de צפה indica revestir uma peça com determinado material. “Revestir de ouro” é natural em português e preserva o sentido artesanal.
- source_word: זָהָב
  choice: ouro
  rationale: Termo direto para o material. A repetição do hebraico é mantida nas duas unidades verbais, sem tornar a primeira oração artificial.
- source_word: טַבְּעֹתֵיהֶם
  choice: as argolas delas
  rationale: טַבַּעַת designa argolas metálicas; o pronome retoma as armações de modo claro.
- source_word: תַּעֲשֶׂה
  choice: faça
  rationale: עשה é o verbo comum para fazer. O imperativo em português expressa naturalmente a força instrutiva do imperfectivo hebraico neste contexto.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: para servirem de suportes para as travessas
  rationale: A expressão significa literalmente “casas para as travessas”. “Suportes” comunica a função receptora das argolas em português atual; a imagem literal é preservada em nota.
- source_word: הַבְּרִיחִם
  choice: as travessas
  rationale: בְּרִיחַ refere-se às barras horizontais que mantinham unidas as peças estruturais. “Travessas” torna essa função mais clara do que o genérico “barras”.
