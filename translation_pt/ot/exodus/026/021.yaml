revisions:
- from: 'e suas quarenta bases[a] serão de prata: duas bases debaixo de uma armação[b] e duas bases debaixo da outra armação.'
  to: 'e suas quarenta bases[a] serão de prata: duas bases debaixo de cada tábua.'
  rationale: 'A revisão substitui «armação» por «tábua», que identifica com maior precisão cada elemento vertical mencionado pelo hebraico. A expressão «duas bases debaixo de cada tábua» explicita, sem alterar o sentido, o valor distributivo das duas cláusulas paralelas: cada uma das vinte tábuas recebe duas bases, totalizando quarenta. A nota b foi removida porque «tábua» passou a ser a tradução adotada.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:47Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva o número, o material e a distribuição de duas bases por peça. Contudo, «armação» normalmente designa uma estrutura ou conjunto de peças, ao passo que קֶרֶשׁ neste contexto designa cada elemento vertical individual, tradicionalmente uma tábua/prancha.
  naturalness: A frase é clara, mas «uma armação ... a outra armação» pode sugerir apenas duas estruturas inteiras. «Cada tábua» expressa naturalmente em português o sentido distributivo da repetição hebraica no contexto.
  terminology: «Bases» é uma boa opção para אַדָנִים e «prata» traduz corretamente כָּסֶף. «Tábua» é mais preciso e idiomático do que «armação» para קֶרֶשׁ; por isso a nota lexical correspondente deixa de ser necessária.
  issues:
  - severity: medium
    issue: «armação» para קֶרֶשׁ
    rationale: Uma armação é geralmente um arcabouço completo, não cada peça vertical apoiada em duas bases. O termo pode obscurecer a referência arquitetônica concreta do hebraico.
  - severity: low
    issue: Contraste «uma ... a outra»
    rationale: A formulação é possível, mas, aplicada à série de tábuas, pode ser lida como se o versículo tratasse de somente duas armações. A construção distributiva com «cada» comunica melhor a função da repetição hebraica.
  revised_text: 'e suas quarenta bases[a] serão de prata: duas bases debaixo de cada tábua.'
  revised_footnotes:
  - marker: a
    text: Ou “encaixes”; o termo hebraico se refere aos suportes de prata nos quais eram fixadas as tábuas do tabernáculo.
    reason: lexical_alternative
  revision_rationale: 'A revisão substitui «armação» por «tábua», que identifica com maior precisão cada elemento vertical mencionado pelo hebraico. A expressão «duas bases debaixo de cada tábua» explicita, sem alterar o sentido, o valor distributivo das duas cláusulas paralelas: cada uma das vinte tábuas recebe duas bases, totalizando quarenta. A nota b foi removida porque «tábua» passou a ser a tradução adotada.'
