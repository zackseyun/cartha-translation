base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: pt
  text: 'e suas quarenta bases[a] serão de prata: duas bases debaixo de cada tábua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encaixes”; o termo hebraico se refere aos suportes de prata nos quais eram fixadas as tábuas do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: e ... quarenta
  rationale: A conjunção dá continuidade à descrição do versículo anterior, e o numeral é mantido diretamente.
- source_word: אַדְנֵי/הֶם
  choice: suas ... bases
  rationale: No contexto do tabernáculo, אֶדֶן designa os suportes de prata nos quais as peças verticais eram encaixadas. “Bases” é claro e natural em português.
- source_word: כָּסֶף
  choice: de prata
  rationale: O substantivo indica o material de que seriam feitas as bases; “de prata” é a formulação idiomática em português.
- source_word: שְׁנֵי אֲדָנִים
  choice: duas bases
  rationale: A expressão indica dois suportes para cada peça estrutural e mantém a mesma escolha lexical feita anteriormente.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Expressa diretamente a posição física dos suportes sob cada peça.
- source_word: הַ/קֶּרֶשׁ
  choice: armação
  rationale: No contexto arquitetônico do tabernáculo, קֶרֶשׁ se refere a cada peça estrutural vertical. “Armação” comunica melhor essa função ao leitor moderno do que o tradicional “tábua”.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: uma armação ... a outra armação
  rationale: Embora o hebraico repita formalmente “a uma armação”, o paralelismo distributivo no contexto contrapõe as peças sucessivas. A formulação portuguesa torna essa relação clara sem alterar o número de bases por armação.
