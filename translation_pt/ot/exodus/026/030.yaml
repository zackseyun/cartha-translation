  source_fidelity: O verbo causativo וַהֲקֵמֹתָ é adequadamente expresso por “montará”, e “tabernáculo” mantém o referente cultual de הַמִּשְׁכָּן. כְּמִשְׁפָּטוֹ, em contexto de construção, refere-se ao modelo, arranjo ou modo prescrito. “O modelo” comunica isso com maior precisão do que “a disposição dele”. A relativa ativa “que você viu no monte” preserva corretamente אֲשֶׁר הָרְאֵיתָ בָּהָר.
  naturalness: “Conforme a disposição dele” soa pouco idiomático e o pronome “dele” é desnecessário e menos claro em português moderno. “Conforme o modelo que você viu no monte” é fluente, conciso e natural para o registro bíblico contemporâneo.
  terminology: “Tabernáculo” é apropriado e estabelecido. “Modelo” é um equivalente contextual sólido para מִשְׁפָּט, sem excluir em nota os matizes de maneira ou norma prescrita.
