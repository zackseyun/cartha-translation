  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: pt
  text: Você montará o tabernáculo conforme o modelo[a] que você viu no monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme a maneira prescrita para ele” ou “conforme a norma prescrita para ele”.'
    reason: A palavra hebraica מִשְׁפָּט pode designar um modelo, uma maneira determinada ou uma norma prescrita; neste contexto, refere-se à forma prescrita para montar o tabernáculo.
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: Você levantará
  rationale: O hifil de קום significa fazer ficar de pé, levantar ou montar. “Levantará” conserva a imagem hebraica e é natural para a montagem de uma estrutura.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן designa aqui a tenda-santuário de Israel. “Tabernáculo” é o termo bíblico consagrado e mantém precisão referencial.
- source_word: כְּמִשְׁפָּטוֹ
  choice: conforme a disposição dele
  rationale: מִשְׁפָּט pode indicar norma, determinação ou modo prescrito. Neste contexto de montagem, “disposição” comunica a configuração determinada sem limitar o sentido apenas a um desenho visual.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: que você viu
  rationale: A forma hebraica é ativa, literalmente “que você viu”. A tradução preserva essa formulação, sem explicitar no texto principal o agente que possibilitou a visão.
- source_word: בָּהָר
  choice: no monte
  rationale: A preposição בְּ tem sentido locativo; “no monte” é a expressão portuguesa natural no contexto de Moisés no Sinai.
theological_decisions:
- issue: Se o texto deve explicitar que Deus mostrou a disposição a Moisés
  choice: manter a formulação ativa “que você viu”
  alternative: “que lhe foi mostrada”
  rationale: O hebraico afirma diretamente que Moisés a viu. Embora o contexto implique revelação divina, a tradução não deve inserir no texto principal uma voz passiva ausente da forma fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “você” para o singular dirigido a Moisés e preserva a concisão e a sequência do hebraico.
