base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: pt
  text: E o côvado que sobrar de um lado e o côvado que sobrar do outro lado[a], no comprimento das cortinas da tenda, ficará pendente sobre os dois lados do tabernáculo[b], de um lado e do outro, para cobri-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um côvado de um lado e um côvado do outro”. O hebraico repete “o côvado” com expressões demonstrativas, referindo-se à medida que sobra em cada lado.'
    reason: lexical_alternative
  - marker: b
    text: “Tabernáculo” traduz o hebraico mishkan, a estrutura sagrada que servia de morada sob a cobertura da tenda.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה מִזֶּה וְהָאַמָּה מִזֶּה
  choice: o côvado que sobrar de um lado e o côvado que sobrar do outro lado
  rationale: Mantém a repetição hebraica de «o côvado» e explicita, com base em בָּעֹדֵף, que essa medida corresponde à sobra em cada lado.
- source_word: בָּעֹדֵף
  choice: que sobrar
  rationale: O termo indica o excedente ou o que resta; em português, a construção verbal integra-se naturalmente à descrição da medida restante.
- source_word: בְּאֹרֶךְ יְרִיעֹת הָאֹהֶל
  choice: no comprimento das cortinas da tenda
  rationale: Reproduz diretamente a relação espacial e identifica as cortinas como pertencentes à cobertura da tenda.
- source_word: יִהְיֶה סָרוּחַ
  choice: ficará pendente
  rationale: Expressa a ideia física de tecido excedente que pende sobre as laterais, em linguagem clara e arquitetonicamente adequada.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: os dois lados do tabernáculo
  rationale: O plural se refere às laterais opostas da estrutura; «tabernáculo» é o termo português tradicional e reconhecível para מִשְׁכָּן neste contexto.
- source_word: מִזֶּה וּמִזֶּה
  choice: de um lado e do outro
  rationale: Traduz idiomaticamente os demonstrativos repetidos que apontam para lados opostos.
- source_word: לְכַסֹּתוֹ
  choice: para cobri-lo
  rationale: 'Preserva o infinitivo de finalidade: a parte pendente das cortinas serve para cobrir o tabernáculo.'
theological_decisions: []
