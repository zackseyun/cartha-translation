  terminology: “Tabernáculo” é o termo técnico apropriado. “Armações” é uma opção possível para elementos estruturais; a nota “Ou ‘tábuas’” preserva a alternativa tradicional e lexicalmente plausível. “Madeira de acácia” é idiomático e preciso.
