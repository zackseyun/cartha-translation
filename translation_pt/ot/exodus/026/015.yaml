  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֲצֵ֥י שִׁטִּ֖ים עֹמְדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/015.yaml
  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: pt
  text: Faça para o tabernáculo armações[a] verticais de madeira de acácia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”; o termo hebraico se refere aos elementos estruturais de madeira do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com waw, nesta sequência de instruções, tem força de ordem. O imperativo em português é atual e direto; a sequência já é indicada pelo contexto, sem necessidade de reproduzir mecanicamente a conjunção.
- source_word: הַקְּרָשִׁים
  choice: armações
  rationale: O termo designa os elementos estruturais verticais do tabernáculo. “Armações” comunica sua função arquitetônica, enquanto “tábuas” permanece uma alternativa lexical legítima.
- source_word: לַמִּשְׁכָּן
  choice: para o tabernáculo
  rationale: “Tabernáculo” é o termo técnico consagrado e preciso para a estrutura sagrada descrita em Êxodo.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A cadeia construta indica madeira proveniente da acácia. Esta formulação é idiomática e clara em português moderno.
- source_word: עֹמְדִים
  choice: colocadas de pé
  rationale: O particípio plural descreve a posição vertical das armações. A expressão preserva explicitamente a ideia de estarem em pé e concorda sem ambiguidade com “armações”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem dos constituintes evita que “de madeira de acácia” pareça modificar “tabernáculo”, e a expressão final conserva separadamente o valor descritivo do particípio hebraico.
