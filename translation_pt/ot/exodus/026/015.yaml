  source_fidelity: 'O imperativo “Faça” transmite adequadamente a força injuntiva de וְעָשִׂיתָ. “Para o tabernáculo”, “armações”, “madeira de acácia” e a nota alternativa para קְרָשִׁים refletem de modo defensável os elementos estruturais, o destino, o material e a alternativa lexical do hebraico. Contudo, “colocadas de pé” tende a apresentar as armações como objeto de uma ação de instalação, enquanto עֹמְדִים descreve principalmente sua posição/orientação: estando em pé, isto é, verticais.'
