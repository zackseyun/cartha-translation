  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: pt
  text: Faça um véu[a] de fios tingidos de azul, púrpura e escarlate[b] e de linho fino retorcido. Será uma obra de artista habilidoso, com figuras de querubins[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cortina”. O termo hebraico designa a cortina interna que separava o Lugar Santo do Lugar Santíssimo.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica se refere mais literalmente a material tingido de escarlate, tradicionalmente associado a corante obtido de insetos.
    reason: cultural_note
  - marker: c
    text: Ou “obra de tecelão artístico” ou “trabalho artisticamente elaborado”. A expressão hebraica indica habilidade artesanal especializada.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: véu
  rationale: Designa a cortina interna que separava o Lugar Santo do Lugar Santíssimo. “Véu” é o termo cultual consagrado e preciso em português, embora “cortina” também seja possível.
- source_word: תְּכֵלֶת
  choice: fios azuis
  rationale: O termo denota um material têxtil tingido de cor azul ou azul-arroxeada. “Fios azuis” explicita naturalmente o sentido material no contexto da confecção do véu.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: É a tradução corrente para esse corante ou tecido luxuoso; “fios” rege coletivamente os três termos de cor.
- source_word: תוֹלַעַת שָׁנִי
  choice: escarlate
  rationale: A expressão designa material tingido de escarlate, historicamente relacionado a corante obtido de insetos. O sentido têxtil é comunicado pelo substantivo coletivo “fios”.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto o material de qualidade quanto a característica de seus fios terem sido retorcidos.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: um artesão habilidoso
  rationale: A expressão indica trabalho artístico especializado. A formulação identifica de modo natural o profissional pressuposto pela construção hebraica, sem restringir a técnica a bordado.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: o fará
  rationale: Mantém a mudança do mandamento na segunda pessoa para o verbo na terceira pessoa do singular, entendendo como sujeito o artesão mencionado pela expressão precedente.
- source_word: כְּרֻבִים
  choice: com querubins
  rationale: Indica que querubins integravam o desenho do véu, sem especificar uma técnica que o texto não declara.
theological_decisions:
- issue: Linguagem do culto e da confecção do tabernáculo sem inserção de simbolismo posterior
  choice: Traduzir como instrução concreta para a confecção do véu, com querubins integrados ao trabalho artístico.
  alternative: Empregar linguagem simbólica que antecipe associações teológicas posteriores do véu.
  rationale: O versículo apresenta uma ordem arquitetônica e artesanal. A tradução não deve incorporar ao texto interpretações teológicas desenvolvidas em outros contextos bíblicos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “Faça” em vez do futuro injuntivo mais solene “Farás”. A sequência “fios azuis, púrpura e escarlate” evita repetições pesadas e comunica que os termos de cor representam materiais têxteis. A segunda frase conserva de modo natural a mudança hebraica para a terceira pessoa do singular.
