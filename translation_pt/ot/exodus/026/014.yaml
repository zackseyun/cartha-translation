  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: pt
  text: Faça para a tenda uma cobertura de peles de carneiros tingidas de vermelho e, por cima, uma cobertura de peles de táhax[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico táhax é incerto. Pode designar um animal específico ou um tipo de couro resistente; entre as traduções propostas estão “couro fino”, “peles de toninha” e “peles de dugongo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito qal com waw, na sequência de instruções, tem força diretiva. O imperativo em português transmite a ordem com naturalidade; “também” liga esta instrução às anteriores.
- source_word: מִכְסֶה לָאֹהֶל
  choice: para a tenda uma cobertura
  rationale: מִכְסֶה designa uma cobertura protetora, e אֹהֶל é literalmente “tenda”. A formulação mantém a relação expressa por ל e evita substituir o termo por “tabernáculo”.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: peles de carneiros tingidas de vermelho
  rationale: A expressão descreve peles de carneiros submetidas a avermelhamento; “tingidas de vermelho” comunica de modo claro e idiomático o provável processamento das peles.
- source_word: וּמִכְסֵה
  choice: e ... uma cobertura
  rationale: A repetição de “cobertura” preserva a segunda ocorrência do substantivo e apresenta uma camada distinta sem acrescentar “outra”, que não está explícito.
- source_word: עֹרֹת תְּחָשִׁים
  choice: peles de táhax
  rationale: A identificação de תְּחָשִׁים é incerta. A transliteração preserva a ambiguidade lexical do hebraico, enquanto a nota apresenta possibilidades sem privilegiar uma hipótese especulativa.
- source_word: מִלְמָעְלָה
  choice: por cima
  rationale: No contexto das camadas da tenda, a expressão indica a posição superior da segunda cobertura. “Por cima” é natural em português e não introduz um demonstrativo ausente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo direto reflete a força instrutiva do hebraico; “tenda” mantém o substantivo concreto do texto-fonte. A transliteração “táhax” evita resolver indevidamente uma incerteza lexical antiga.
