  text: וְ/עָשִׂ֛יתָ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים וְ/הֵבֵאתָ֤ אֶת הַ/קְּרָסִים֙ בַּ/לֻּ֣לָאֹ֔ת וְ/חִבַּרְתָּ֥ אֶת הָ/אֹ֖הֶל וְ/הָיָ֥ה אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: pt
  text: Faça também cinquenta colchetes de bronze[a], introduza os colchetes nas alças e una a tenda, para que ela forme uma só unidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «colchetes de cobre». A palavra hebraica נְחֹשֶׁת pode se referir ao cobre ou ao bronze, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: colchetes de bronze
  rationale: קַרְסִים designa peças de fixação que ligam as coberturas; «colchetes» comunica essa função com mais precisão do que «ganchos». נְחֹשֶׁת pode indicar cobre ou bronze, e «bronze» é a tradução convencional e contextualmente provável para os metais do santuário.
- source_word: חֲמִשִּׁים
  choice: cinquenta
  rationale: Número cardinal que quantifica diretamente os colchetes.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: introduza os colchetes nas alças
  rationale: O hifil de בוא expressa aqui fazer entrar ou colocar no interior; «introduza ... nas» traduz naturalmente a inserção dos colchetes nas לֻלָאֹת, as alças das bordas.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: una a tenda
  rationale: חבר significa unir ou conectar. «Una a tenda» preserva o objeto explícito do hebraico e descreve a reunião das partes da cobertura.
- source_word: וְהָיָה אֶחָד
  choice: para que ela forme uma só unidade
  rationale: A oração indica o resultado da união. Esta formulação natural em português torna claro que as partes passam a constituir uma única tenda, sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa adequada ao discurso instrutivo. «Faça também» representa naturalmente o waw sequencial no contexto da série de ordens. Evitou-se uma nota redundante sobre a inserção dos colchetes, pois essa ação já está explícita no texto; a unidade final foi expressa no próprio corpo do versículo.
