base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: pt
  text: Coloque o véu debaixo dos fechos e leve para lá, para o interior, além do véu, a arca do testemunho[a]. O véu separará para vocês o Lugar Santo do Lugar Santíssimo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também é conhecida como “arca da aliança”; aqui, porém, o hebraico diz literalmente “arca do testemunho”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Santo dos Santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: véu
  rationale: Designa a cortina interna que separava o compartimento mais sagrado. “Véu” é tradicional, claro e adequado ao contexto do santuário.
- source_word: קְרָסִים
  choice: colchetes
  rationale: O termo se refere às peças que uniam as cortinas do tabernáculo. “Colchetes” expressa essa função sem especificar indevidamente um mecanismo moderno.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: para dentro do véu
  rationale: A expressão indica o espaço no lado interior, além do véu. Esta formulação preserva tanto o movimento de levar a arca quanto a localização pretendida.
- source_word: אֲרוֹן הָעֵדוּת
  choice: a arca do testemunho
  rationale: O hebraico traz explicitamente עֵדוּת, “testemunho”, e não “aliança”; por isso, a tradução mantém a expressão do texto-fonte.
- source_word: וְהִבְדִּילָה
  choice: fará ... a separação
  rationale: A forma causativa expressa a função do véu de estabelecer uma separação. A construção é natural em português e retém a força verbal.
- source_word: לָכֶם
  choice: para vocês
  rationale: Mantém o pronome dativo presente no hebraico, indicando a função dessa separação no arranjo de culto dado ao povo.
- source_word: הַקֹּדֶשׁ
  choice: o Lugar Santo
  rationale: No contexto, designa o compartimento sagrado exterior, em contraste com o compartimento interior. A maiúscula sinaliza seu uso como denominação espacial.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: o Lugar Santíssimo
  rationale: Comunica em português natural o valor superlativo da construção hebraica, literalmente “santo dos santos”, e mantém a distinção entre os dois compartimentos.
theological_decisions:
- issue: Terminologia cultual para o santuário interior
  choice: Lugar Santíssimo
  alternative: Santo dos Santos
  rationale: “Lugar Santíssimo” transmite com clareza a força superlativa do hebraico e funciona como denominação espacial compreensível, enquanto a tradução literal é registrada em nota.
- issue: Tradução de עֵדוּת no título da arca
  choice: arca do testemunho
  alternative: arca da aliança
  rationale: A redação específica do versículo usa “testemunho”. A tradução evita harmonizá-la silenciosamente com o título tradicional “arca da aliança”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “Ponha” reflete naturalmente a instrução divina dirigida a Moisés; a terminologia cultual tradicional é mantida onde continua clara. Todos os marcadores de nota aparecem no texto principal.
