base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: pt
  text: O comprimento de cada cortina será de vinte e oito côvados, e a largura de cada cortina, de quatro côvados; todas as cortinas terão a mesma medida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ
  choice: comprimento
  rationale: Termo dimensional natural em português e adequado às instruções de construção do santuário.
- source_word: הַיְרִיעָה
  choice: cortina
  rationale: No contexto do tabernáculo, designa uma grande peça de tecido usada na cobertura; “cortina” é claro e tradicional sem ser arcaico.
- source_word: הָאַחַת / הָאֶחָת
  choice: cada
  rationale: Embora a forma hebraica seja literalmente “a uma”, ela tem valor distributivo e especifica as dimensões de cada cortina individualmente.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: vinte e oito
  rationale: Correspondência direta do numeral cardinal hebraico.
- source_word: בָּאַמָּה
  choice: côvados
  rationale: “Côvado” é a designação portuguesa convencional da antiga unidade linear אַמָּה.
- source_word: וְרֹחַב
  choice: e a largura
  rationale: Forma natural de emparelhar a segunda dimensão com “comprimento” em português moderno.
- source_word: אַרְבַּע
  choice: quatro
  rationale: Correspondência direta do numeral cardinal hebraico.
- source_word: מִדָּה אַחַת
  choice: a mesma medida
  rationale: O hebraico diz literalmente “uma medida”; no contexto comparativo, a formulação portuguesa comunica com naturalidade que a medida era uniforme.
- source_word: לְכָל הַיְרִיעֹת
  choice: todas as cortinas
  rationale: 'Preserva o alcance coletivo da expressão: o padrão dimensional se aplica ao conjunto inteiro.'
