  text: וְ/עָשִׂ֥יתָ בְרִיחִ֖ם עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/026.yaml
  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
translation:
  language: pt
  text: Faça também cinco travessas de madeira de acácia para as armações de um dos lados do tabernáculo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”, em vez de “armações”; o termo hebraico se refere aos elementos estruturais do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força de ordem. O imperativo é natural em português, e “também” mantém a continuidade do procedimento.
- source_word: בְרִיחִם
  choice: travessas
  rationale: No contexto da construção, são peças horizontais destinadas a unir e firmar os elementos verticais. “Travessas” é arquitetonicamente claro sem impor a ideia específica de ferrolhos.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: Reproduz naturalmente a cadeia construta hebraica e emprega o nome moderno e conhecido da madeira.
- source_word: חֲמִשָּׁה
  choice: cinco
  rationale: Número cardinal que quantifica as travessas.
- source_word: לְקַרְשֵׁי
  choice: para as armações
  rationale: קֶרֶשׁ designa os elementos estruturais verticais do tabernáculo. “Armações” comunica sua função, embora “tábuas” seja uma alternativa lexical tradicional.
- source_word: צֶלַע
  choice: lados
  rationale: Neste contexto, צֶלַע indica a face lateral da estrutura, para a qual “lado” é a tradução portuguesa natural.
- source_word: הַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: “Tabernáculo” é o termo consagrado e contextualmente preciso para a estrutura sagrada descrita em Êxodo.
- source_word: הָאֶחָד
  choice: um dos
  rationale: Em português, “um dos lados” expressa com naturalidade a referência a um lado específico, em contraste com o lado oposto mencionado no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo procedural natural. Conserva o termo tradicional “tabernáculo” e registra em nota a incerteza lexical relativa aos membros estruturais.
