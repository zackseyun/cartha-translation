base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: pt
  text: O comprimento de cada cortina será de trinta côvados[a], e a largura de cada cortina, de quatro côvados; as onze cortinas terão a mesma medida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um côvado correspondia aproximadamente à distância do cotovelo à ponta dos dedos; seu valor exato variava na Antiguidade.
    reason: unidade_antiga
lexical_decisions:
- source_word: אֹרֶךְ
  choice: comprimento
  rationale: Termo dimensional natural em português, em paralelo com רֹחַב, “largura”.
- source_word: יְרִיעָה
  choice: cortina
  rationale: No contexto do tabernáculo, designa uma grande peça de tecido usada como cobertura; “cortina” é clara e tradicional sem perder naturalidade.
- source_word: הָאַחַת / הָאֶחָת
  choice: cada
  rationale: Embora a forma seja literalmente “a uma”, aqui tem valor distributivo e indica cada cortina individualmente.
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: trinta côvados
  rationale: Mantém a unidade antiga do texto, em vez de impor uma conversão moderna incerta.
- source_word: רֹחַב
  choice: largura
  rationale: Equivalente moderno e direto, formando o par dimensional natural com “comprimento”.
- source_word: אַרְבַּע בָּאַמָּה
  choice: quatro côvados
  rationale: Tradução direta que conserva a unidade antiga.
- source_word: מִדָּה אַחַת
  choice: a mesma medida
  rationale: A expressão é literalmente “uma medida”, mas neste contexto afirma a uniformidade das dimensões das onze cortinas; “a mesma medida” comunica isso naturalmente.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: as onze cortinas terão
  rationale: Transforma naturalmente em português a construção com לְ, identificando o conjunto ao qual se aplica a medida uniforme.
