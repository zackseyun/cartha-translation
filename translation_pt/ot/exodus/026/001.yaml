  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: pt
  text: Faça o tabernáculo com dez cortinas de linho fino retorcido e fios azuis, roxos e escarlates. Faça-as com querubins em trabalho de artista.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com querubins artisticamente tecidos nelas”. A expressão hebraica מַעֲשֵׂה חֹשֵׁב indica trabalho artístico e planejado no tecido, mas não especifica com certeza a técnica empregada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo técnico consagrado e ainda compreensível para a tenda-santuário que serve de habitação sagrada.
- source_word: יְרִיעֹת
  choice: cortinas
  rationale: No contexto da construção do tabernáculo, designa grandes peças ou painéis de tecido; “cortinas” é claro e natural.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto o material fino quanto a indicação de fios torcidos.
- source_word: תְכֵלֶת וְאַרְגָּמָן וְתֹלַעַת שָׁנִי
  choice: fios azuis, roxos e escarlates
  rationale: Explicita o sentido têxtil da sequência de cores sem alterar os três termos tradicionais.
- source_word: כְּרֻבִים
  choice: querubins
  rationale: Mantém o termo bíblico e cultual, evitando associações populares inadequadas com figuras infantis.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: obra de um artesão habilidoso
  rationale: Expressa o trabalho artístico, planejado e especializado envolvido na confecção do desenho no tecido, sem determinar além do hebraico a técnica exata.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: Faça
  rationale: O imperativo português comunica de modo natural a força injuntiva do hebraico no fluxo das instruções divinas.
- source_word: אֹתָם
  choice: nelas
  rationale: Retoma explicitamente as dez cortinas e indica que os querubins fazem parte de sua ornamentação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A frase longa do hebraico foi dividida em duas para maior clareza, preservando a ordem dos materiais, o referente plural das cortinas e a ambiguidade quanto à técnica usada para representar os querubins.
