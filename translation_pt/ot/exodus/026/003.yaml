lexical_decisions:
- source_word: יְרִיעֹת
  choice: cortinas
  rationale: No contexto da construção do tabernáculo, o termo designa grandes peças de tecido usadas como cobertura; “cortinas” é claro, natural e tradicional em português.
- source_word: תִּהְיֶיןָ
  choice: serão
  rationale: O imperfeito de היה tem aqui valor instrutivo, dentro das orientações para a construção. O futuro em português transmite adequadamente essa prescrição.
- source_word: חֹבְרֹת
  choice: unidas
  rationale: O particípio de חבר expressa a ideia de juntar ou conectar. “Unidas” é idiomático e preciso neste contexto.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: umas às outras
  rationale: A expressão significa literalmente “uma mulher à sua irmã”, mas funciona como idioma de reciprocidade entre substantivos femininos; em português natural, “umas às outras” preserva o sentido.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: Cinco ... e cinco
  rationale: Mantém a estrutura paralela do hebraico, que divide as dez cortinas em dois conjuntos de cinco, sem acrescentar elementos ausentes do texto.
