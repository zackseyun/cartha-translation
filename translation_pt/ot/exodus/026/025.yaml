base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: pt
  text: 'Serão oito armações[a], com suas bases de prata: dezesseis bases[b], duas bases debaixo de uma armação e duas bases debaixo da outra armação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “encaixes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: armações
  rationale: No contexto da construção do tabernáculo, designa elementos estruturais verticais. “Armações” comunica sua função arquitetônica em português atual; “tábuas” permanece uma alternativa lexical legítima.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: bases
  rationale: O substantivo designa as peças de sustentação situadas sob as armações. “Bases” é claro e amplamente compreensível; “encaixes” representa uma alternativa possível.
- source_word: כֶּסֶף
  choice: prata
  rationale: Designação direta do material de que eram feitas as bases.
- source_word: שִׁשָּׁה עָשָׂר
  choice: dezesseis
  rationale: Forma cardinal corrente e de ampla legibilidade brasileira.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Expressa diretamente a relação espacial exigida pelas instruções de construção.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: uma armação ... a outra armação
  rationale: A repetição hebraica tem valor distributivo. A formulação portuguesa conserva a distribuição de duas bases para cada armação sem introduzir uma sequência ausente do texto.
- source_word: וְהָיוּ
  choice: Serão
  rationale: Formulação natural em português para uma especificação de quantidade; o valor conjuntivo é adequadamente absorvido pela continuidade do contexto.
