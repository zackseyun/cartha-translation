  text: וְ/עָשִׂ֜יתָ לֻֽלְאֹ֣ת תְּכֵ֗לֶת עַ֣ל שְׂפַ֤ת הַ/יְרִיעָה֙ הָ/אֶחָ֔ת מִ/קָּצָ֖ה בַּ/חֹבָ֑רֶת וְ/כֵ֤ן תַּעֲשֶׂה֙ בִּ/שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/קִּ֣יצוֹנָ֔ה בַּ/מַּחְבֶּ֖רֶת הַ/שֵּׁנִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: pt
  text: Faça laçadas de tecido azul[a] na borda de uma das cortinas, na extremidade do primeiro conjunto unido[b]; faça o mesmo na borda da cortina da extremidade[c] do segundo conjunto unido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “azul” ou “violeta”. O hebraico תְּכֵלֶת designa o característico material tingido de azul usado no tabernáculo.
    reason: lexical_alternative
  - marker: b
    text: Os termos hebraicos traduzidos por “conjunto unido” (חֹבָרֶת / מַחְבֶּרֶת) referem-se a um grupo de cortinas acopladas para formar uma unidade. Tradicionalmente, também se traduz por “acoplamento”.
    reason: lexical_alternative
  - marker: c
    text: Ou “cortina mais externa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: laçadas
  rationale: Designa elementos em forma de laço usados para prender e unir as cortinas; “laçadas” é natural e preciso no contexto têxtil.
- source_word: תְּכֵלֶת
  choice: tecido azul
  rationale: O termo designa o material tingido de azul característico dos tecidos do santuário. “Tecido azul” expressa o sentido material sem restringir indevidamente a tonalidade.
- source_word: שְׂפַת
  choice: borda
  rationale: No contexto de uma peça têxtil, “borda” é o equivalente idiomático mais claro.
- source_word: יְרִיעָה
  choice: cortina
  rationale: No contexto de Êxodo 26, refere-se aos painéis de tecido do tabernáculo; “cortina” é tradicional, claro e acessível.
- source_word: הָאֶחָת
  choice: uma das cortinas
  rationale: Preserva o valor de “uma” sem transformar explicitamente a expressão em numeral ordinal.
- source_word: מִקָּצָה
  choice: na extremidade
  rationale: Indica a localização na ponta ou limite do conjunto, de modo natural em português.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: conjunto unido
  rationale: Os termos se referem a grupos de cortinas acopladas em uma unidade; a mesma formulação mantém sua relação lexical e comunica sua função.
- source_word: וְכֵן
  choice: faça o mesmo
  rationale: Transmite de forma natural e concisa a instrução correspondente introduzida pela expressão hebraica.
- source_word: הַקִּיצוֹנָה
  choice: da extremidade
  rationale: Identifica a cortina situada no extremo do conjunto, sem impor a ideia menos segura de que seja exterior em relação a toda a estrutura.
- source_word: הַשֵּׁנִית
  choice: segundo
  rationale: Identifica claramente o segundo dos dois conjuntos unidos.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “Faça” reproduz naturalmente a instrução hebraica dirigida no singular. A redação conserva a distinção entre uma cortina e a cortina situada na extremidade, evitando explicar além do que o texto afirma.
