  source_fidelity: 'A tradução conserva adequadamente os elementos do hebraico: as laçadas de תְּכֵלֶת, a borda das cortinas, a localização na extremidade dos dois conjuntos acoplados e a instrução paralela. “Uma das cortinas” reproduz de modo aceitável a referência a “a uma [cortina]”, sem introduzir uma numeração que o versículo não explicita.'
