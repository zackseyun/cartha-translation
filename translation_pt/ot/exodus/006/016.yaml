  yaml_path: translation/ot/exodus/006/016.yaml
  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: pt
  text: 'Estes são os nomes dos filhos de Levi, segundo as suas gerações: Gérson, Coate e Merari. Levi viveu cento e trinta e sete anos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: segundo as suas gerações
  rationale: Mantém a expressão genealógica do hebraico e sua possível referência às linhagens ou aos registros de descendência, sem reduzi-la a uma única interpretação.
- source_word: גֵּרְשׁוֹן וּקְהָת וּמְרָרִי
  choice: Gérson, Coate e Merari
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecíveis dos nomes próprios.
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: Levi viveu
  rationale: Expressa em português natural o idiomatismo hebraico literalmente equivalente a 'os anos da vida de Levi foram', preservando integralmente o sentido.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: cento e trinta e sete anos
  rationale: Reordena o número conforme o uso normal do português, sem alterar o valor numérico.
