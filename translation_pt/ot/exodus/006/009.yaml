  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֤א שָֽׁמְעוּ֙ אֶל מֹשֶׁ֔ה מִ/קֹּ֣צֶר ר֔וּחַ וּ/מֵ/עֲבֹדָ֖ה קָשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: pt
  text: Assim Moisés falou aos filhos de Israel, mas eles não deram ouvidos a Moisés, por causa do desânimo[a] e da dura escravidão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “brevidade de espírito” ou “espírito curto”; a expressão também pode indicar angústia, abatimento ou impaciência.
    reason: lexical_alternative
  - marker: b
    text: Ou “trabalho pesado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O piel de דבר significa normalmente “falar”; “falou” é natural e apropriado ao relato narrativo.
- source_word: כֵּן
  choice: Assim
  rationale: Retoma o conteúdo da mensagem divina anterior e preserva de modo idiomático o valor anafórico de כֵּן.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma tradicional e transparente do hebraico, sem restringir a referência apenas aos homens.
- source_word: שָׁמְעוּ אֶל
  choice: deram ouvidos a
  rationale: A construção idiomática expressa escutar com receptividade ou atender; “dar ouvidos a” conserva essa força em português corrente.
- source_word: מִקֹּצֶר רוּחַ
  choice: por causa do desânimo
  rationale: A expressão literalmente descreve “brevidade/estreiteza de espírito” e, no contexto, comunica abatimento e incapacidade emocional de acolher a mensagem.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: e da dura escravidão
  rationale: Embora עֲבֹדָה possa significar trabalho ou serviço, o contexto egípcio torna evidente seu caráter compulsório e opressivo; “dura escravidão” comunica essa realidade.
theological_decisions:
- issue: Natureza da condição de Israel expressa por עֲבֹדָה קָשָׁה
  choice: dura escravidão
  alternative: trabalho pesado
  rationale: O contexto de Êxodo descreve trabalho forçado sob domínio egípcio. A tradução “escravidão” explicita essa realidade sem introduzir uma conclusão doutrinária alheia ao texto.
- issue: Sentido de קֹצֶר רוּחַ
  choice: desânimo
  alternative: espírito angustiado; impaciência
  rationale: A expressão admite mais de uma nuance, mas aqui o sofrimento opressivo favorece abatimento ou angústia interior. A nota preserva a imagem literal e a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Assim” mantém a conexão com a fala anterior; “deram ouvidos” reproduz o valor idiomático de escutar/atender. As notas preservam alternativas genuínas do hebraico.
