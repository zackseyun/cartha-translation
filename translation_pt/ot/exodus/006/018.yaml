base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: pt
  text: 'Os filhos de Coate: Anrão, Isar, Hebrom e Uziel. Coate viveu cento e trinta e três anos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: בְּנֵי é o plural construto de “filhos”. Aqui introduz os filhos imediatos de Coate. A conjunção inicial é omitida em português para que a frase funcione naturalmente como item genealógico.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico קְהָת em português bíblico.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Anrão, Isar, Hebrom e Uziel
  rationale: Os quatro nomes próprios são apresentados em uma lista simples, com as conjunções hebraicas representadas de modo idiomático por vírgulas e um “e” antes do último nome.
- source_word: וּשְׁנֵי חַיֵּי
  choice: Os anos da vida de ... foram
  rationale: Preserva de perto o idioma hebraico “os anos da vida de”, mantendo uma formulação clara e digna em português. A conjunção inicial não precisa ser expressa separadamente na sequência genealógica.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: cento e trinta e três anos
  rationale: A ordem dos componentes numéricos é ajustada ao uso natural do português, e o substantivo é corretamente vertido no plural.
