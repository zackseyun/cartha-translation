  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: pt
  text: 'Mas Moisés falou diante de Yahweh, dizendo: “Eis que os filhos de Israel não me deram ouvidos; como, então, o faraó me ouvirá, pois tenho lábios incircuncisos[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “incircunciso de lábios”, expressão que indica fala impedida ou inadequada; compare Êxodo 4:10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Mas Moisés falou
  rationale: O wayyiqtol dá continuidade à narrativa, enquanto “mas” explicita de modo natural o contraste contextual entre a ordem divina anterior e a objeção de Moisés.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a expressão espacial-relacional hebraica, mais precisamente do que reduzi-la simplesmente a “a Yahweh”.
- source_word: הֵן
  choice: Eis que
  rationale: Mantém a função enfática de chamar a atenção, em registro digno e ainda corrente no português bíblico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão familiar coletiva do hebraico, sem substituí-la pela forma interpretativamente mais fluida “os israelitas”.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: não me deram ouvidos
  rationale: Expressa naturalmente em português o sentido de ouvir com atenção ou acolher a mensagem, sem intensificá-lo para “não me obedeceram”.
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: como, então, o faraó me ouvirá
  rationale: “Então” comunica a inferência retórica, e “me ouvirá” mantém a repetição lexical do verbo שׁמע presente no hebraico.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: se tenho lábios incircuncisos
  rationale: “Se” comunica aqui a circunstância usada por Moisés como fundamento de sua objeção, enquanto “lábios incircuncisos” preserva a metáfora deliberadamente vívida e sua ambiguidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” o representa por transliteração e evita substituí-lo silenciosamente por “SENHOR”.
- issue: Sentido da expressão עֲרַל שְׂפָתָיִם
  choice: lábios incircuncisos
  alternative: dificuldade para falar; fala inadequada; lábios incircuncidados
  rationale: A tradução mantém a metáfora hebraica de impedimento ou inadequação sem convertê-la em diagnóstico específico nem eliminar sua tensão literária e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi suavizada onde necessário, mas a expressão familiar “filhos de Israel”, a repetição de “ouvir” e a metáfora dos lábios foram preservadas.
