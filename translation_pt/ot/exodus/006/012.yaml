revisions:
- from: 'Mas Moisés falou diante de Yahweh: “Eis que os filhos de Israel não me deram ouvidos; como, então, o faraó me ouvirá, se tenho lábios incircuncisos[a]?”'
  to: 'Mas Moisés falou diante de Yahweh, dizendo: “Eis que os filhos de Israel não me deram ouvidos; como, então, o faraó me ouvirá, pois tenho lábios incircuncisos[a]?”'
  rationale: 'Foram feitas somente duas correções seguras: restaurou-se «dizendo», que traduz לֵאמֹר, e substituiu-se a condicional «se tenho» por «pois tenho», que comunica a força causal contextual sem resolver a ambiguidade da expressão hebraica. A nota e seu marcador foram preservados.'
