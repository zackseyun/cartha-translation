source:
  edition: WLC
  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: pt
  text: Também estabeleci a minha aliança com eles, para lhes dar a terra de Canaã, a terra onde moraram como estrangeiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “a terra de suas estadas como estrangeiros, na qual viveram como estrangeiros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Expressa de modo natural a força aditiva da combinação hebraica e liga a declaração ao contexto anterior.
- source_word: הֲקִמֹתִי
  choice: estabeleci
  rationale: No idioma de aliança formado com בְּרִית, “estabelecer” preserva a solenidade e o sentido de firmar a aliança, sem recorrer ao literalismo inadequado de “levantar”.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: Tradução corrente de בְּרִית no contexto, com o sufixo possessivo explicitamente preservado.
- source_word: אִתָּם
  choice: com eles
  rationale: Reproduz diretamente a relação expressa pela preposição e seu sufixo, cujo referente contextual são os patriarcas.
- source_word: לָתֵת לָהֶם
  choice: para lhes dar
  rationale: Mantém o infinitivo de finalidade e expressa o objeto indireto em português natural.
- source_word: אֶרֶץ כְּנָעַן
  choice: a terra de Canaã
  rationale: Conserva tanto o substantivo “terra” quanto o nome próprio na construção hebraica.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: a terra onde moraram como estrangeiros
  rationale: Comunica que a residência deles era a de estrangeiros sem direitos permanentes sobre a terra, em linguagem portuguesa clara e atual.
- source_word: אֲשֶׁר גָּרוּ בָהּ
  choice: onde moraram como estrangeiros
  rationale: 'Integra naturalmente a oração relativa e preserva o sentido social de גּוּר: residir em determinado lugar como estrangeiro.'
theological_decisions:
- issue: Expressão de aliança קום + ברית
  choice: estabeleci a minha aliança
  alternative: confirmei a minha aliança
  rationale: “Estabeleci” representa adequadamente o compromisso vinculante de Deus com os patriarcas e mantém a linguagem solene da aliança sem impor uma distinção teológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita “peregrinar”, que em português pode sugerir principalmente deslocamento ou devoção religiosa, e preserva a condição de residentes estrangeiros indicada pela família lexical מָגוּר/גּוּר.
