base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: pt
  text: Então Yahweh falou a Moisés e a Arão e lhes deu ordens a respeito dos filhos de Israel e do faraó, rei do Egito,[a] para tirar os filhos de Israel[b] da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos filhos de Israel e ao faraó, rei do Egito”. A preposição hebraica pode indicar os destinatários da ordem; neste contexto, porém, provavelmente indica que a ordem dada a Moisés e Arão dizia respeito tanto a Israel quanto ao faraó.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “os filhos de Israel”; também pode ser traduzido como “os israelitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência, e “falou” traduz diretamente דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: וַיְצַוֵּם
  choice: e lhes deu ordens
  rationale: Preserva a força autoritativa de צוה e deixa claro que o sufixo pronominal se refere a Moisés e Arão; em português, a construção também se liga naturalmente a “a respeito de”.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה
  choice: a respeito dos filhos de Israel e do faraó
  rationale: Após צוה, אֶל pode indicar aqueles a respeito dos quais a ordem foi dada. Esta leitura contextual evita apresentar Israel e o faraó como destinatários imediatos da fala, sem ocultar a alternativa sintática.
- source_word: לְהוֹצִיא
  choice: para que tirassem
  rationale: O infinitivo hifil de יצא é causativo. A oração final em português comunica naturalmente que a incumbência dada a Moisés e Arão era fazer Israel sair.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de forma transparente a expressão familiar e nacional hebraica, embora “os israelitas” seja uma alternativa idiomática.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Conserva o substantivo אֶרֶץ e a referência geográfica concreta do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Mantém o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de אֶל após וַיְצַוֵּם
  choice: a respeito dos filhos de Israel e do faraó
  alternative: aos filhos de Israel e ao faraó
  rationale: O contexto favorece entender Moisés e Arão como os receptores da ordem, enquanto Israel e o faraó são aqueles a quem ela diz respeito; a nota conserva a ambiguidade gramatical genuína.
- issue: Tradução da designação בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: Preserva a forma masculina e a imagem genealógica da designação nacional hebraica sem transformá-la silenciosamente em um coletivo neutro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos elementos foi levemente ajustada para fluidez, e a ambiguidade de אֶל foi preservada em nota. Todos os marcadores de nota aparecem no texto principal.
