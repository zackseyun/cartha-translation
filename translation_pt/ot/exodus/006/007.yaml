  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַחְתִּ֨י אֶתְ/כֶ֥ם לִ/י֙ לְ/עָ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם הַ/מּוֹצִ֣יא אֶתְ/כֶ֔ם מִ/תַּ֖חַת סִבְל֥וֹת מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: pt
  text: Eu os tomarei como meu povo e serei o seu Deus. Então vocês saberão que eu sou Yahweh, seu Deus, aquele que os tira[a] de debaixo das cargas do Egito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que os tirou”; o hebraico emprega um particípio, que pode destacar uma ação em curso ou característica, ou o ato visto como aquilo que identifica Yahweh.
    reason: alternativa lexical e aspectual
  - marker: b
    text: Ou “dos trabalhos forçados impostos pelo Egito”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Eu os tomarei
  rationale: O perfeito qal com וְ nesta sequência de promessas tem valor futuro. “Tomarei” preserva a ação deliberada e o sentido relacional da aliança.
- source_word: לִי לְעָם
  choice: como meu povo
  rationale: 'A construção com לִי e לְעָם expressa pertencimento e identidade: Israel será o povo que pertence a Deus. A formulação é natural em português e preserva a fórmula da aliança.'
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: serei o seu Deus
  rationale: Reproduz de maneira idiomática a fórmula relacional da aliança, sem acrescentar uma sistematização teológica posterior.
- source_word: וִידַעְתֶּם
  choice: vocês saberão
  rationale: O futuro simples comunica tanto conhecimento quanto reconhecimento pela experiência, conforme o contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal revelado a Israel.
- source_word: הַמּוֹצִיא
  choice: aquele que os tira
  rationale: O particípio apresenta Yahweh como o libertador em ação ou caracteristicamente identificado por essa ação. O presente português preserva essa força, enquanto a nota registra a leitura contextual no passado.
- source_word: מִתַּחַת
  choice: de debaixo de
  rationale: Mantém a imagem espacial hebraica de libertação da sujeição opressiva.
- source_word: סִבְלֹת
  choice: cargas
  rationale: O substantivo pode indicar cargas, fardos ou, por extensão, trabalhos forçados. “Cargas” preserva a imagem concreta e deixa a alternativa contextual em nota.
- source_word: מִצְרָיִם
  choice: Egito
  rationale: Nome convencional do país em português; no contexto, pode funcionar metonimicamente para a opressão egípcia.
theological_decisions:
- issue: Fórmula da aliança
  choice: “Eu os tomarei como meu povo e serei o seu Deus”
  alternative: “Eu os tomarei para mim por povo e serei Deus para vocês”
  rationale: A redação escolhida conserva a reciprocidade relacional da fórmula hebraica com naturalidade em português, sem desenvolver implicações confessionais além do texto.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o tetragrama יְהוָה. A transliteração “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Valor temporal do particípio הַמּוֹצִיא
  choice: “aquele que os tira”
  alternative: “aquele que os tirou”
  rationale: O particípio admite a apresentação da ação como em curso ou característica de Yahweh, embora o ponto de vista da promessa cumprida permita entendê-la como ato passado. A tradução mantém a forma participial e registra a alternativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” evita formas regionais excessivamente marcadas; “os” mantém clareza como objeto. A repetição “de debaixo” foi conservada por refletir com precisão a imagem hebraica, embora seja menos leve que uma paráfrase como “da opressão”.
