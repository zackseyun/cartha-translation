base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés: “Eu sou Yahweh. Diga ao Faraó, rei do Egito, tudo o que eu lhe digo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade, e “falou” traduz o sentido de דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: Em português, os dois-pontos introduzem a fala de maneira mais natural e concisa do que a reprodução literal de “dizendo”.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: A cópula “sou” torna explícita em português a identificação formulada como oração nominal no hebraico.
- source_word: דַּבֵּר
  choice: Diga
  rationale: Neste contexto, o imperativo manda Moisés transmitir ao faraó o conteúdo recebido; “Diga” é mais idiomático em português do que “Fale ... tudo”.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ao faraó, rei do Egito
  rationale: Preserva a aposição hebraica com pontuação natural em português.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: Expressa de modo claro e idiomático a totalidade do conteúdo a ser comunicado.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: eu lhe disser
  rationale: O futuro do subjuntivo é natural após “tudo o que” e, no contexto da ordem, comunica aquilo que Yahweh vier a dizer a Moisés. A alternativa mais formal “eu lhe digo” preservaria mais diretamente o particípio presente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama como nome pessoal e na autodeclaração divina. “Yahweh” o preserva por transliteração, sem trocar o nome por um título.
- issue: Valor temporal do particípio דֹּבֵר
  choice: eu lhe disser
  alternative: eu lhe digo; estou lhe dizendo
  rationale: O particípio admite valor presente ou progressivo. No contexto prospectivo da ordem, o português idiomático favorece “disser”; a escolha não limita a fala divina a uma única ocasião.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição da raiz דבר não foi reproduzida mecanicamente, pois “Fale ... tudo o que eu falo” soa pouco natural; “falou” e “diga” mantêm o campo semântico da comunicação. Nenhum marcador de nota foi inserido, pois a redação adotada não exige nota indispensável.
