  yaml_path: translation/ot/exodus/006/028.yaml
  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: pt
  text: E aconteceu no dia em que Yahweh falou a Moisés na terra do Egito —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aconteceu” ou “E sucedeu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: A forma narrativa de היה com waw introduz a transição e pode ser representada naturalmente por “E aconteceu”, sem recorrer ao arcaísmo “E sucedeu”.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Preserva a expressão temporal hebraica e liga de modo idiomático a oração seguinte em português.
- source_word: דִּבֶּר ... אֶל מֹשֶׁה
  choice: falou a Moisés
  rationale: דבר com אֶל indica falar a alguém; esta construção é clara, digna e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Mantém o substantivo explícito אֶרֶץ, sem condensar a expressão para apenas “no Egito”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O travessão final preserva o caráter suspenso da frase, que é retomada no versículo seguinte.
