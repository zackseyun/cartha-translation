base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também transliterado como “Jeová”.'
    reason: Registra uma forma alternativa tradicional em português para o Tetragrama hebraico.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar; “então” expressa naturalmente a sequência, e “falou” preserva o sentido usual de דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica a pessoa a quem a fala é dirigida; “falou a Moisés” é natural e claro em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo hebraico anuncia o discurso direto. Em português atual, os dois-pontos comunicam essa função com mais naturalidade do que o literal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e a nota registra uma transliteração alternativa, sem substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula narrativa hebraica foi vertida de modo natural; os dois-pontos introduzem a fala que começa no versículo seguinte.
