base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: pt
  text: Anrão tomou Joquebede[a], sua tia, por mulher, e ela lhe deu à luz Arão e Moisés. Anrão viveu 137 anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, «irmã de seu pai», se o termo de parentesco for entendido em seu sentido mais restrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o verbo hebraico e, com “por mulher”, reproduz de modo claro e digno a expressão matrimonial.
- source_word: דֹּדָתוֹ
  choice: sua tia
  rationale: O feminino do termo de parentesco designa aqui uma tia. A forma concisa preserva a relação sem impor no texto principal uma especificação genealógica maior do que a forma lexical isolada exige.
- source_word: לְאִשָּׁה
  choice: por mulher
  rationale: Expressão portuguesa tradicional, ainda inteligível, que indica inequivocamente o casamento e corresponde à construção hebraica.
- source_word: וַתֵּלֶד לוֹ
  choice: e ela lhe deu à luz
  rationale: Verte naturalmente o verbo de gerar/dar à luz com o objeto indireto לוֹ, preservando o sentido genealógico.
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: Anrão viveu
  rationale: Expressa em português corrente a fórmula hebraica que declara a duração da vida, sem perda de conteúdo.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 anos
  rationale: Conserva exatamente o valor numérico em formato moderno e de leitura imediata.
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: Anrão / Joquebede / Arão / Moisés
  rationale: Emprega as formas portuguesas bíblicas consagradas e amplamente reconhecidas.
theological_decisions:
- issue: Relação de parentesco em um casamento que seria posteriormente proibido pela legislação da Torá
  choice: sua tia
  alternative: irmã de seu pai
  rationale: O versículo relata o parentesco e o casamento sem avaliação moral explícita. “Sua tia” comunica a proximidade familiar sem suavizá-la nem intensificá-la por explicação doutrinária; a identificação mais específica pode ser sustentada pelo contexto genealógico, mas não precisa substituir o termo natural no texto.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas consagradas. “Tomou ... por mulher” preserva o sabor da fórmula hebraica sem prejudicar a compreensão; a frase final foi formulada idiomaticamente.
