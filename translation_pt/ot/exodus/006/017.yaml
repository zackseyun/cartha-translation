  text: 'The sons of Gershon: Libni and Shimei[a], by their clans.'
translation:
  language: pt
  text: 'Os filhos de Gérson: Libni e Simei, segundo os seus clãs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן introduz uma lista genealógica; “os filhos de” preserva o sentido filial imediato e é natural em português.
- source_word: גֵרְשׁוֹן
  choice: Gérson
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecível em português.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nome próprio transliterado, sem tradução de seu possível significado etimológico.
- source_word: וְשִׁמְעִי
  choice: e Simei
  rationale: A conjunção é traduzida diretamente, e o nome próprio recebe a forma tradicional em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה, neste contexto genealógico e tribal, designa grupos de parentesco maiores que a família nuclear; “clãs” expressa essa unidade social com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa adequada a uma fórmula genealógica. Os nomes seguem formas bíblicas reconhecíveis em português; “clãs” evita a possível leitura excessivamente estreita de “famílias”.
