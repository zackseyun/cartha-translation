base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: pt
  text: Eu os levarei à terra que jurei[a] dar a Abraão, a Isaque e a Jacó; e a darei a vocês como herança. Eu sou Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «para a qual levantei minha mão, para dá-la». Esta é uma expressão hebraica de juramento.
    reason: oath_idiom
  - marker: b
    text: Yahweh é o nome pessoal de Deus, representado em hebraico pelas quatro consoantes YHWH.
    reason: divine_name
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Eu os levarei
  rationale: O hifil de בוא, com sujeito na primeira pessoa e objeto na segunda pessoa do plural, expressa de modo natural a ação de levar ou conduzir alguém a um lugar. “Eu os levarei” preserva o sentido causativo e é corrente em português.
- source_word: הָאָרֶץ
  choice: à terra
  rationale: Neste contexto de promessa pactual, אֶרֶץ designa a terra específica prometida aos patriarcas, não a terra em sentido universal.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: que jurei
  rationale: A expressão hebraica significa literalmente “para a qual levantei minha mão” e funciona como uma fórmula de juramento. “Que jurei” comunica naturalmente o sentido em português, enquanto a imagem literal é registrada em nota.
- source_word: לָתֵת אֹתָהּ
  choice: dar
  rationale: נתן nesta construção tem o sentido direto de “dar”.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: Os nomes seguem formas portuguesas bíblicas amplamente reconhecidas. A preposição hebraica repetida é expressa de forma natural em português sem repetição obrigatória.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: e a darei a vocês
  rationale: A formulação mantém direta a promessa divina e representa claramente o pronome feminino que retoma “terra”.
- source_word: מוֹרָשָׁה
  choice: como propriedade
  rationale: מוֹרָשָׁה denota uma posse recebida e mantida por direito, com possível nuance hereditária. “Como propriedade” preserva o foco na terra concedida como posse, sem impor exclusivamente a ideia de sucessão hereditária.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: A cláusula nominal é uma solene autoidentificação divina. “Yahweh” representa o nome pessoal יהוה, em vez de substituí-lo por um título.
theological_decisions:
- issue: Expressão de juramento נָשָׂאתִי אֶת יָדִי
  choice: que jurei
  alternative: para a qual levantei minha mão para dá-la
  rationale: A expressão concreta é um conhecido gesto de juramento. O texto principal comunica sua função idiomática em português natural, e a nota preserva a imagem hebraica sem sugerir que se trate apenas de levantar fisicamente a mão.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama como nome pactual. A transliteração “Yahweh” preserva a autoidentificação pelo nome, enquanto “SENHOR” seria uma substituição tradicional por título.
- issue: Nuance de מוֹרָשָׁה
  choice: como propriedade
  alternative: como herança
  rationale: O termo pode envolver posse hereditária, mas neste contexto destaca a terra concedida por Deus a Israel como posse duradoura. A tradução evita limitar o termo à transmissão após a morte de um proprietário humano.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “vocês” para a segunda pessoa do plural. A sintaxe mantém o caráter solene e direto da promessa. O ponto e vírgula evita uma sequência excessiva de orações ligadas por “e”.
