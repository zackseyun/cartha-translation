base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: pt
  text: 'Deus falou a Moisés e lhe disse: “Eu sou Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH (יהוה), o nome divino; tradicionalmente representado por “SENHOR” e também transliterado “Javé”.'
    reason: Esclarece a forma hebraica do nome e registra traduções ou transliterações tradicionais relevantes.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, nesta forma narrativa, introduz a fala divina. “Falou” é natural e mantém a distinção em relação ao verbo seguinte, “disse”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo no singular mostra que, neste contexto, o termo designa o Deus de Israel.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; “a Moisés” é uma construção clara e corrente em português.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: e lhe disse
  rationale: A formulação preserva o segundo verbo de fala do hebraico, enquanto o pronome “lhe” retoma Moisés de modo natural e evita repetição pesada.
- source_word: אֲנִי
  choice: Eu sou
  rationale: A oração nominal hebraica não expressa a cópula no presente; “Eu sou” fornece em português a forma natural da autodeclaração enfática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração apresenta o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio, enquanto a nota informa a forma hebraica e as convenções alternativas sem impor uma tradição denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “lhe disse” evita repetição sem apagar os dois verbos de fala do hebraico.
