base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: pt
  text: 'Estes são os chefes de suas casas paternas: os filhos de Rúben, o primogênito de Israel: Enoque, Palu, Hezrom e Carmi. Estes são os clãs de Rúben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי
  choice: Estes são os chefes
  rationale: Mantém a fórmula hebraica que introduz a lista e preserva a imagem concreta de líderes ou representantes principais.
- source_word: בֵית אֲבֹתָם
  choice: das casas de seus antepassados
  rationale: Expressa as unidades familiares extensas organizadas pela linhagem paterna; é mais compreensível no português atual do que o decalque rígido “casas de seus pais”.
- source_word: בְּנֵי רְאוּבֵן
  choice: os filhos de Rúben
  rationale: A lista apresenta os filhos imediatos de Rúben, de modo que “filhos” é mais preciso do que o termo mais amplo “descendentes”.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: o primogênito de Israel
  rationale: Conserva a aposição que identifica Rúben e a terminologia genealógica do hebraico.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: Enoque, Palu, Hezrom e Carmi
  rationale: Emprega formas portuguesas reconhecíveis dos nomes, com pontuação natural para uma enumeração.
- source_word: מִשְׁפְּחֹת
  choice: clãs
  rationale: No contexto tribal e genealógico, designa grupos de parentesco mais amplos do que a família nuclear; “clãs” comunica essa estrutura com precisão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia genealógica preservada sem rigidez excessiva. O verbo “eram” foi explicitado na segunda oração para tornar natural em português a enumeração nominal do hebraico. Não se adotou a nota inglesa “famílias de Rúben” após “filhos de Rúben”, pois o hebraico distingue בְּנֵי (“filhos”) de מִשְׁפְּחֹת (“clãs/famílias”) e não apresenta ali uma ambiguidade genuína.
