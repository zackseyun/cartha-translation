base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: pt
  text: Os filhos de Corá foram Assir, Elcana e Abiasafe. Esses são os clãs[a] dos coraítas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “famílias”. O termo hebraico pode designar grupos familiares extensos dentro de uma tribo; “clãs” reflete mais precisamente o contexto genealógico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: בְּנֵי é o plural construto de “filhos”. O contexto enumera três indivíduos, por isso “filhos de” é mais preciso que “descendentes de”. A conjunção inicial não foi explicitada, pois em português a frase funciona naturalmente como uma nova linha genealógica.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: אַסִּיר
  choice: Assir
  rationale: Nome próprio no contexto genealógico. Mantém-se a transliteração com consoante dupla, sem traduzi-lo segundo o substantivo homógrafo que pode significar “prisioneiro”.
- source_word: וְאֶלְקָנָה
  choice: Elcana
  rationale: Forma portuguesa corrente do nome próprio; a conjunção hebraica é representada naturalmente na coordenação da lista.
- source_word: וַאֲבִיאָסָף
  choice: Abiasafe
  rationale: Forma portuguesa clara e tradicional do nome próprio hebraico.
- source_word: אֵלֶּה
  choice: Esses são
  rationale: O demonstrativo introduz uma oração identificadora; o verbo de ligação, implícito em hebraico, é expresso em português.
- source_word: מִשְׁפְחֹת
  choice: os clãs
  rationale: No contexto tribal e genealógico, מִשְׁפָּחָה designa grupos de parentesco mais amplos que a família doméstica. “Clãs” comunica melhor essa estrutura, embora “famílias” também seja possível.
- source_word: הַקָּרְחִי
  choice: dos coraítas
  rationale: A forma gentílica designa os integrantes da linhagem de Corá; “coraítas” é a forma portuguesa concisa e usual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis no uso lusófono. A construção “foram” torna natural a lista nominal em português sem alterar a relação genealógica do hebraico.
