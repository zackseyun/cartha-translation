  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: pt
  text: 'E os filhos de Simeão: Jemuel, Jamim, Oade, Jaquim, Zoar e Shaul[a], filho da mulher cananeia. Esses são os clãs de Simeão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, Shaul é vertido como “Saul”. A forma hebraica aqui é שָׁאוּל (Shaul).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Preserva a conjunção que dá continuidade à genealogia e traduz o plural construto בְּנֵי de modo natural.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְמוּאֵל
  choice: Jemuel
  rationale: Transliteração bíblica convencional em português.
- source_word: וְיָמִין
  choice: Jamim
  rationale: Forma tradicional portuguesa do nome hebraico יָמִין.
- source_word: וְאֹהַד
  choice: Oade
  rationale: Forma portuguesa convencional do nome próprio hebraico.
- source_word: וְיָכִין
  choice: Jaquim
  rationale: Forma bíblica portuguesa tradicional, inteligível e próxima da pronúncia hebraica convencional.
- source_word: וְצֹחַר
  choice: Zoar
  rationale: Forma portuguesa convencional deste nome no contexto genealógico.
- source_word: וְשָׁאוּל
  choice: Shaul
  rationale: Representa diretamente a forma hebraica שָׁאוּל e evita confundi-la silenciosamente com a forma portuguesa tradicional Saul; a alternativa tradicional é registrada em nota.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: filho da mulher cananeia
  rationale: Explicita corretamente o feminino de הַכְּנַעֲנִית em português moderno.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: Esses são os clãs de Simeão
  rationale: Supre naturalmente a cópula implícita e traduz מִשְׁפְּחֹת como grupos de parentesco dentro da tribo.
