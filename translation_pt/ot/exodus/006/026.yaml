base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: pt
  text: 'Estes são Arão e Moisés[a], a quem Yahweh disse: “Tirem os filhos de Israel[b] da terra do Egito segundo seus agrupamentos[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foram estes Arão e Moisés” ou “Foram Arão e Moisés”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o povo de Israel; também se pode traduzir por “os israelitas” ou “os descendentes de Israel”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por suas hostes”, “segundo suas divisões” ou “em seus grupos organizados”. O termo hebraico pode designar hostes, exércitos ou outros agrupamentos organizados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: Foram estes Arão e Moisés
  rationale: A fórmula de identificação retoma enfaticamente as pessoas mencionadas na genealogia. O singular hebraico הוּא diante do sujeito composto é idiomaticamente expresso em português pelo plural demonstrativo, sem alterar a referência.
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: a quem Yahweh disse
  rationale: A construção relativa e o pronome dativo לָהֶם são representados de modo natural por “a quem”; o nome divino é transliterado como Yahweh.
- source_word: הוֹצִיאוּ
  choice: Tirem ... da
  rationale: 'O imperativo masculino plural no hifil de יצא tem sentido causativo: fazer sair, tirar para fora. “Tirem ... da terra” comunica esse movimento de maneira clara e corrente.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão genealógica hebraica e sua forma masculina plural, que aqui funciona como designação coletiva tradicional do povo descendente de Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Preserva a menção explícita à terra e expressa naturalmente em português a origem do movimento indicada por מִן.
- source_word: עַל צִבְאֹתָם
  choice: segundo os seus agrupamentos
  rationale: צְבָאוֹת pode designar exércitos, hostes ou grupos organizados. “Agrupamentos” preserva a ideia de organização coletiva sem impor exclusivamente uma leitura militar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome pessoal divino, não apenas um título. “Yahweh” o representa por transliteração e evita substituí-lo silenciosamente.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A tradução mantém a metáfora familiar do hebraico. No contexto, a expressão nomeia coletivamente o povo e não deve ser entendida como exclusão das mulheres.
- issue: Nuance de צִבְאֹתָם
  choice: segundo os seus agrupamentos
  alternative: por suas hostes; segundo suas divisões
  rationale: O termo admite uma conotação militar, mas também denota conjuntos organizados. A escolha conserva esse núcleo sem decidir que Israel já esteja sendo descrito estritamente como exército.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Arão e Moisés” e a fórmula identificadora foram preservadas. As notas registram alternativas reais sem resolver indevidamente a amplitude semântica do hebraico.
