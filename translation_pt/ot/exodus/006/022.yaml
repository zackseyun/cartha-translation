lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: A conjunção וּ é preservada como “E” para manter a continuidade da lista genealógica; בְנֵי é a forma construta plural, naturalmente traduzida por “filhos de”.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: מִישָׁאֵל
  choice: Misael
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: וְ/אֶלְצָפָן
  choice: Elzafã
  rationale: Transliteração aportuguesada que representa o nome hebraico e segue o uso bíblico corrente em português; a conjunção prefixada é traduzida na coordenação da lista.
- source_word: וְ/סִתְרִי
  choice: e Sitri
  rationale: Forma aportuguesada próxima do hebraico סִתְרִי, com a conjunção וְ traduzida por “e”.
