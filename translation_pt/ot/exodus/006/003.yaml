  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: pt
  text: E apareci a Abraão, a Isaque e a Jacó como Deus Todo-Poderoso[a], mas, pelo meu nome, Yahweh[b], não me dei a conhecer a eles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: El Shaddai; tradicionalmente traduzido por «Deus Todo-Poderoso».'
    reason: lexical_alternative
  - marker: b
    text: Yahweh representa o nome divino escrito em hebraico com as quatro consoantes YHWH.
    reason: lexical_clarification
  - marker: c
    text: 'Ou: «mas pelo meu nome, Yahweh, não fui conhecido por eles». O hebraico pode não indicar que os patriarcas ignoravam o nome divino em si, mas que ainda não conheciam plenamente sua significação na experiência da aliança.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: E apareci
  rationale: O nifal de ראה, na primeira pessoa do singular, expressa diretamente «apareci» no contexto das manifestações divinas aos patriarcas; «revelei-me» seria mais interpretativo.
- source_word: אֶל אַבְרָהָם אֶל יִצְחָק וְאֶל יַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: A repetição hebraica da preposição pode ser condensada naturalmente em português sem perda do paralelismo entre os três patriarcas.
- source_word: בְּאֵל שַׁדָּי
  choice: como Deus Todo-Poderoso
  rationale: A preposição בְּ tem aqui valor de identificação, bem expresso por «como»; «Deus Todo-Poderoso» é a tradução tradicional e inteligível do título, enquanto a forma hebraica é registrada em nota.
- source_word: וּשְׁמִי יְהוָה
  choice: mas, pelo meu nome, Yahweh
  rationale: «Pelo meu nome» conserva a construção hebraica e o contraste. Yahweh translitera o nome pessoal divino, em vez de substituí-lo por um título.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: não me dei a conhecer a eles
  rationale: O nifal de ידע pode assumir nuance reflexiva ou medial. Esta formulação é natural em português e preserva a ligação sintática entre o ato de dar-se a conhecer e o nome divino; a leitura mais formalmente passiva é mantida em nota.
theological_decisions:
- issue: Sentido da afirmação de que Deus não se deu a conhecer aos patriarcas pelo nome Yahweh
  choice: não me dei a conhecer a eles
  alternative: não fui conhecido por eles
  rationale: O hebraico permite tanto uma formulação passiva quanto uma nuance medial/reflexiva. A tradução não especifica se os patriarcas desconheciam o nome em si ou se ainda não conheciam plenamente sua significação na experiência da aliança; essa tensão é explicitada na nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Mantém «Yahweh» como nome pessoal e conserva em nota a ambiguidade do nifal hebraico e a tensão com as ocorrências do nome nas narrativas patriarcais.
