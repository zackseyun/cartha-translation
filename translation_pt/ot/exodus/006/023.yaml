  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: pt
  text: Arão tomou por mulher Eliseba, filha de Aminadabe e irmã de Naassom; ela lhe deu à luz Nadabe, Abiú, Eleazar e Itamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido básico de לקח, enquanto “por mulher” explicita naturalmente o contexto matrimonial.
- source_word: אֱלִישֶׁבַע
  choice: Eliseba
  rationale: Transliteração portuguesa que reflete de perto a forma hebraica e é reconhecível ao leitor bíblico.
- source_word: בַּת
  choice: filha de
  rationale: Reproduz diretamente a relação filial expressa pelo construto hebraico.
- source_word: אֲחוֹת
  choice: irmã de
  rationale: Traduz de modo direto a relação familiar indicada no hebraico.
- source_word: לּוֹ לְאִשָּׁה
  choice: por mulher
  rationale: Expressão portuguesa digna e concisa para a fórmula matrimonial hebraica, sem reduzir וַיִּקַּח simplesmente a “casou-se”.
- source_word: וַתֵּלֶד לוֹ
  choice: ela lhe deu à luz
  rationale: Forma natural em português para ילד com objeto indireto pessoal, preservando a ideia de que ela lhe deu filhos.
- source_word: נָדָב
  choice: Nadabe
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: אֲבִיהוּא
  choice: Abiú
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma portuguesa convencional do nome.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Forma portuguesa convencional do nome.
