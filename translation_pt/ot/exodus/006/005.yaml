  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: pt
  text: E também eu ouvi o gemido dos filhos de Israel[a], a quem os egípcios escravizam, e me lembrei da minha aliança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: 'Aqui, “lembrei” é linguagem de aliança: não significa que Deus tivesse esquecido, mas que se volta para sua aliança a fim de agir.'
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: E também eu
  rationale: Mantém a ligação aditiva com o discurso anterior e a ênfase do pronome explícito hebraico, em ordem natural e inteligível em português.
- source_word: שָׁמַעְתִּי
  choice: ouvi
  rationale: O perfeito hebraico apresenta a ação como realizada e relevante para a resposta divina; o pretérito perfeito é a forma mais natural em português.
- source_word: נַאֲקַת
  choice: o gemido
  rationale: Expressa o clamor doloroso produzido pela opressão sem recorrer a linguagem arcaica.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de perto a expressão hebraica e seu valor corporativo; uma formulação mais idiomática é indicada em nota.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: a quem os egípcios escravizam
  rationale: O particípio plural favorece entender os egípcios como agentes, e o hifil de עבד comunica trabalho compulsório e escravização.
- source_word: וָאֶזְכֹּר
  choice: e me lembrei
  rationale: Preserva o idioma bíblico de lembrar, sem explicá-lo dentro do texto nem sugerir que seja mera recuperação de informação esquecida.
- source_word: בְּרִיתִי
  choice: da minha aliança
  rationale: Aliança é o equivalente corrente e teologicamente adequado para בְּרִית neste contexto.
theological_decisions:
- issue: Sentido corporativo de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução retém a forma concreta do hebraico, enquanto a nota esclarece que ela designa corporativamente o povo de Israel, não apenas os homens.
- issue: O ato divino de lembrar a aliança
  choice: me lembrei da minha aliança
  alternative: voltei-me para cumprir minha aliança; agi segundo minha aliança
  rationale: Mantém a linguagem da fonte e sua tensão teológica, sem transformar a implicação de ação pactual em paráfrase no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a ênfase do pronome divino e o paralelismo das duas ações, sem soar excessivamente arcaica.
