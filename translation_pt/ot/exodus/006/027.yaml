base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: pt
  text: São eles que falaram ao faraó, rei do Egito, para tirar do Egito os filhos de Israel — são Moisés e Arão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «São eles os que falavam ao faraó, rei do Egito». O hebraico usa um particípio que os caracteriza por essa ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: Foram eles
  rationale: O pronome independente dá ênfase à identificação retomada dos homens mencionados anteriormente; em português, «foram eles» expressa isso com naturalidade.
- source_word: הַמְדַבְּרִים
  choice: que falaram
  rationale: O particípio substantivado caracteriza Moisés e Arão por sua ação diante do faraó. A oração relativa no passado é natural em português; a nuance participial é registrada em nota.
- source_word: אֶל
  choice: ao
  rationale: 'Com o verbo «falar», a preposição indica o destinatário: falar ao faraó.'
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: faraó, rei do Egito
  rationale: Mantém o título real em aposição, com pontuação natural em português.
- source_word: לְהוֹצִיא
  choice: para tirar
  rationale: O infinitivo hifil de יצא tem sentido causativo, «fazer sair»; «tirar ... do Egito» é conciso e idiomático sem acrescentar a ideia específica de condução.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de modo transparente a expressão hebraica masculina plural, preservando a forma tradicional e a referência genealógica.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Com «tirar», a preposição «de» expressa naturalmente a saída desde o Egito.
- source_word: הוּא
  choice: eles são
  rationale: Embora o hebraico empregue formalmente o pronome singular הוּא antes dos dois nomes, a retomada plural em português produz uma identificação clara e gramatical, sem alterar os referentes.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Emprega as formas portuguesas consagradas dos nomes bíblicos.
