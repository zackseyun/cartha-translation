lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filho”; neste contexto genealógico, “filhos de” é a forma mais direta. O ו inicial é representado por “E”, preservando a continuidade da lista.
- source_word: יִצְהָר
  choice: Isar
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português bíblico.
- source_word: קֹרַח
  choice: Corá
  rationale: Nome próprio transliterado na forma tradicional em português, com acento para indicar a pronúncia.
- source_word: וָ/נֶפֶג
  choice: Nefegue
  rationale: Nome próprio transliterado de modo natural em português; a conjunção hebraica é expressa pela coordenação portuguesa antes do último item da lista.
- source_word: וְ/זִכְרִי
  choice: e Zicri
  rationale: Nome próprio transliterado de modo reconhecível em português, mantendo também a conjunção que encerra a enumeração.
