  text: וְ/אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן לָקַֽח ל֨/וֹ מִ/בְּנ֤וֹת פּֽוּטִיאֵל֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת פִּֽינְחָ֑ס אֵ֗לֶּה רָאשֵׁ֛י אֲב֥וֹת הַ/לְוִיִּ֖ם לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: pt
  text: Eleazar, filho de Arão, tomou para si uma das filhas de Putiel como esposa[a], e ela lhe deu à luz Fineias. Estes são os chefes das casas paternas[b] dos levitas, segundo os seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “das filhas de Putiel”. A expressão hebraica pode referir-se a uma mulher da família de Putiel, sem especificar qual filha.
    reason: lexical_alternative
  - marker: b
    text: “Casas paternas” é uma expressão de parentesco que designa unidades familiares ancestrais dentro dos clãs levíticos.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: tomou para si como esposa
  rationale: Preserva de modo natural o idioma matrimonial hebraico, sem reduzi-lo ao mais interpretativo «casou-se».
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: uma das filhas de Putiel
  rationale: O hebraico indica procedência ou pertencimento ao grupo das filhas de Putiel; em português, a forma partitiva explícita evita a leitura pouco natural de que Eleazar tomou várias filhas.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: e ela lhe deu à luz Fineias
  rationale: Mantém a esposa como sujeito feminino e representa o pronome dativo לוֹ em português corrente.
- source_word: רָאשֵׁי אֲבוֹת
  choice: os chefes das casas paternas
  rationale: Expressa o sentido genealógico e social de líderes de unidades familiares ancestrais, em vez de se referir apenas a pais biológicos.
- source_word: הַלְוִיִּם
  choice: dos levitas
  rationale: Designação portuguesa tradicional e precisa para o grupo tribal descendente de Levi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto genealógico, מִשְׁפָּחָה designa agrupamentos de parentesco mais amplos; «clãs» comunica essa estrutura com clareza.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: Eleazar / Arão / Putiel / Fineias
  rationale: Empregam-se as formas portuguesas bíblicas correntes dos nomes próprios.
