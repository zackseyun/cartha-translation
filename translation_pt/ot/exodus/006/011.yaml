  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: pt
  text: Vá, fale ao faraó, rei do Egito, para que ele deixe os filhos de Israel[a] sair da sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Vá
  rationale: O imperativo de בוא pode significar literalmente “venha”, mas, neste contexto, ordena que Moisés se dirija ao faraó; “Vá” é a forma idiomática em português.
- source_word: דַבֵּר אֶל
  choice: fale ao
  rationale: O imperativo intensivo de דבר com אֶל indica fala dirigida a alguém. “Fale ao” conserva de modo conciso a estrutura e o sentido do hebraico.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: faraó, rei do Egito
  rationale: A aposição identifica o faraó por seu título e domínio; as vírgulas tornam a construção natural e clara em português.
- source_word: וִישַׁלַּח
  choice: para que ele deixe ... sair
  rationale: Depois dos imperativos, a forma verbal expressa o resultado ou objetivo da fala de Moisés. “Deixe ... sair” comunica a libertação e a partida pretendidas sem reduzi-la a mera previsão.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar explícita do hebraico; “os israelitas” é uma alternativa contextual mais compacta.
- source_word: מֵאַרְצוֹ
  choice: da terra dele
  rationale: אֶרֶץ designa aqui o território sob o domínio do faraó. “Dele” evita a possível ambiguidade referencial de “sua terra” em português.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A escolha preserva a formulação familiar e masculina do texto hebraico, sem transformar silenciosamente a expressão em um simples gentílico. Não há diferença doutrinária substancial entre as alternativas.
- issue: Valor de וִישַׁלַּח após os imperativos
  choice: para que ele deixe ... sair
  alternative: e ele os mandará embora; e que ele deixe ... sair
  rationale: O contexto favorece finalidade ou resultado pretendido, embora a coordenação hebraica também possa ser lida de maneira mais formal como sequência verbal. A tradução escolhida preserva a exigência dirigida ao faraó sem apresentá-la apenas como previsão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Faraó” aparece em minúscula por funcionar como título; “terra dele” explicita que o território é o do faraó. A vírgula entre os dois imperativos preserva o ritmo direto do hebraico.
