  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: pt
  text: 'E os filhos de Merari: Mali e Musi. Estas são as famílias de Levi[a], segundo as suas gerações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as famílias do levita”. O hebraico traz “o levita” no singular, provavelmente em sentido coletivo, referindo-se à linhagem de Levi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filho”; em contexto genealógico, “os filhos de” é a formulação portuguesa mais direta. A conjunção וּ foi mantida para preservar a continuidade da lista.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nome próprio transliterado segundo a forma consagrada em português.
- source_word: מַחְלִי
  choice: Mali
  rationale: Nome próprio transliterado na forma tradicional e legível em português.
- source_word: וּ/מוּשִׁי
  choice: e Musi
  rationale: Nome próprio transliterado, com a conjunção expressa naturalmente em português.
- source_word: אֵלֶּה
  choice: Estas são
  rationale: O demonstrativo introduz uma oração de identificação; o verbo de ligação, implícito no hebraico, é necessário em português.
- source_word: מִשְׁפְּחֹת
  choice: as famílias
  rationale: מִשְׁפָּחוֹת designa grupos de parentesco no contexto tribal e genealógico. “Famílias” é natural e amplamente compreensível em português, embora “clãs” também seja possível.
- source_word: הַ/לֵּוִי
  choice: do levita
  rationale: A tradução conserva o substantivo gentílico singular com artigo do hebraico. O singular provavelmente tem valor coletivo, razão pela qual a ambiguidade é esclarecida em nota sem ser eliminada do texto.
- source_word: לְ/תֹלְדֹתָם
  choice: segundo as suas gerações
  rationale: תּוֹלְדוֹת refere-se a gerações ou linhas de descendência em fórmulas genealógicas. A expressão mantém o registro formal e a estrutura do hebraico.
