base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: pt
  text: 'Mas Moisés disse diante do SENHOR: “Eis que tenho lábios incircuncisos; como o faraó me ouvirá?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: diante do SENHOR
  rationale: Reproduz a expressão relacional hebraica de modo natural e mantém a convenção editorial reverente para o nome divino.
- source_word: הֵן
  choice: Veja
  rationale: Conserva a força discursiva que chama atenção para a objeção de Moisés, em linguagem portuguesa atual.
- source_word: עֲרַל שְׂפָתַיִם
  choice: tenho lábios incircuncisos
  rationale: Preserva a metáfora hebraica deliberadamente concreta e sua ambiguidade, sem reduzi-la interpretativamente a mera falta de eloquência.
- source_word: יִשְׁמַע אֵלַי
  choice: me ouvirá
  rationale: Expressa naturalmente o sentido contextual de dar ouvidos a Moisés, sem acrescentar explicitamente 'obedecer' ou 'atender'.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Usa a forma portuguesa convencional do título egípcio com artigo definido.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH / Javé
  rationale: Segue a tradição editorial portuguesa amplamente reconhecida e o texto de consulta auditado, sem inserir uma vocalização disputada no corpo do versículo.
- issue: Interpretação da metáfora 'lábios incircuncisos'
  choice: Manter a metáfora literalmente
  alternative: sou incapaz de falar / tenho dificuldade para falar
  rationale: O hebraico conserva uma imagem teologicamente e literariamente carregada; paráfrases resolveriam uma ambiguidade que o texto não explica aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente naturalizada na pergunta, enquanto a metáfora central e a tensão da objeção de Moisés foram preservadas.
