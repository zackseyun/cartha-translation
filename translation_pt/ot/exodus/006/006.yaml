language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: pt
  text: 'Por isso, diga aos filhos de Israel[a]: “Eu sou Yahweh[b], e os tirarei de debaixo das cargas do Egito[c]; eu os livrarei da escravidão que os egípcios lhes impõem[d] e os redimirei com braço estendido e com grandes juízos[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, o nome divino; tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
  - marker: c
    text: Ou “de debaixo dos trabalhos forçados do Egito”. O hebraico diz literalmente “de debaixo das cargas do Egito”.
    reason: lexical_alternative
  - marker: d
    text: Ou “da servidão deles”. O termo hebraico pode significar serviço ou trabalho, mas aqui se refere à servidão opressiva imposta pelos egípcios.
    reason: lexical_alternative
  - marker: e
    text: Ou “com grandes atos de juízo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente da fala divina anterior, preservando a relação inferencial.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a expressão familiar hebraica e sua forma masculina plural; “aos israelitas” seria mais fluente, mas menos transparente ao original.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Conserva a autodeclaração enfática e representa o nome divino יהוה por transliteração, em vez de substituí-lo por um título.
- source_word: וְהוֹצֵאתִי
  choice: Eu os tirarei
  rationale: O hifil de יצא indica que Yahweh fará o povo sair da opressão; a formulação é idiomática em português e preserva o motivo do êxodo.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: de debaixo dos trabalhos pesados impostos pelo Egito
  rationale: Preserva a imagem espacial de מִתַּחַת, “de debaixo”, enquanto explicita pelo contexto que as “cargas” são trabalhos opressivos impostos pelo poder egípcio.
- source_word: וְהִצַּלְתִּי
  choice: os livrarei
  rationale: Transmite a ideia de resgate da dominação ou do perigo e distingue este verbo do גאל subsequente.
- source_word: מֵעֲבֹדָתָם
  choice: da escravidão sob o domínio dos egípcios
  rationale: עֲבֹדָה pode significar trabalho ou serviço, mas neste contexto designa servidão coerciva. A formulação esclarece o referente do sufixo “deles” sem suavizar a realidade da escravidão.
- source_word: וְגָאַלְתִּי
  choice: os resgatarei
  rationale: גאל pertence ao campo do resgate por um redentor ligado por dever familiar. “Resgatarei” comunica essa ação em português corrente sem pressupor aqui um mecanismo de pagamento.
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: com braço estendido
  rationale: Mantém a imagem antropomórfica tradicional da intervenção poderosa de Deus, sem acrescentar um adjetivo ausente do hebraico.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: e com grandes juízos
  rationale: Conserva o sentido judicial de שְׁפָטִים e sua provável referência aos atos punitivos de Deus contra o Egito.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto apresenta diretamente o nome da aliança. “Yahweh” o preserva como nome próprio, sem substituí-lo pelo título tradicional “SENHOR”.
- issue: Forma coletiva de לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A tradução mantém a linguagem familiar do hebraico, que identifica o povo da aliança coletivamente, sem ampliar nem restringir o referente.
- issue: Sentido contextual de עֲבֹדָה
  choice: escravidão
  alternative: servidão; serviço; trabalho
  rationale: No contexto da coerção egípcia, o termo não descreve trabalho neutro, mas sujeição opressiva. “Escravidão” torna explícita essa realidade histórica.
- issue: Relação entre נצל e גאל
  choice: livrarei ... resgatarei
  alternative: salvarei ... redimirei
  rationale: 'Dois verbos distintos são mantidos: o primeiro destaca a libertação da dominação; o segundo evoca a ação de quem reivindica e recupera alguém. A tradução evita fundi-los em um único conceito.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a sequência solene das promessas divinas, mas evita construções excessivamente arcaicas. As repetições conceituais de libertação e resgate foram mantidas porque refletem verbos hebraicos distintos.
