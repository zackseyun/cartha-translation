  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Agora você verá o que farei ao faraó, pois, por mão forte, ele os deixará ir e, por mão forte, os expulsará da sua terra”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob compulsão, ele os deixará ir e, sob compulsão, os expulsará”. A expressão repetida “por mão forte” pode indicar que o faraó agirá por causa de uma força irresistível — em última instância, o poder de Deus.'
    reason: Registra uma alternativa lexical e explica a possível ideia de compulsão sem eliminar a ambiguidade do texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa sequência de modo natural em português.
- source_word: עַתָּה תִרְאֶה
  choice: Agora você verá
  rationale: Mantém tanto a ênfase temporal de עַתָּה quanto o sentido futuro simples de תִרְאֶה.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: o que farei ao faraó
  rationale: Formulação idiomática em português que conserva a relação ampla indicada por לְ, sem explicitar além do texto “contra” ou “com” o faraó.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a explicação que se segue.
- source_word: בְיָד חֲזָקָה
  choice: por mão forte
  rationale: Conserva a imagem hebraica e sua repetição, sem decidir no texto principal se a expressão destaca diretamente a mão poderosa de Deus ou a compulsão sob a qual o faraó agirá.
- source_word: יְשַׁלְּחֵם
  choice: ele os deixará ir
  rationale: No contexto do êxodo, expressa de modo claro e corrente a libertação de Israel pelo faraó.
- source_word: יְגָרְשֵׁם
  choice: os expulsará
  rationale: Reproduz a força maior de גרש e a progressão entre permitir a saída e expulsar com urgência.
- source_word: מֵאַרְצוֹ
  choice: da sua terra
  rationale: “Terra” preserva a amplitude semântica e a ressonância bíblica de אֶרֶץ; o possessivo retoma o faraó.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Mantém o nome da aliança como nome próprio e evita substituí-lo por um título.
- issue: Referente e sentido de בְיָד חֲזָקָה nas ações do faraó
  choice: Manter o idioma “por mão forte” nas duas ocorrências
  alternative: “sob compulsão”; “pela força de uma mão poderosa”
  rationale: A expressão sugere que o faraó agirá vencido por força irresistível, em última instância pelo poder de Deus, mas sua construção junto aos verbos do faraó preserva uma tensão que não deve ser resolvida silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada de “por mão forte” reproduz o paralelismo enfático do hebraico, embora a expressão seja menos comum na fala cotidiana.
