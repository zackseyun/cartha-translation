  terminology: «Yahweh», «Moisés», «faraó», «terra» e «expulsará» são consistentes com o texto-fonte e com as decisões do projeto. «Ele os deixará ir» e «os expulsará» reproduzem bem a mudança de liberação para expulsão forçada.
