  source_fidelity: O texto preserva adequadamente a sequência narrativa, o futuro de «você verá», a relação ampla de «farei ao faraó», a dupla repetição de «por mão forte», a progressão de «deixará ir» para «expulsará» e «da sua terra». Não resolve indevidamente a ambiguidade do agente ou da força implicada em בְּיָד חֲזָקָה.
