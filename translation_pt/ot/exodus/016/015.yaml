base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: pt
  text: 'Quando os filhos de Israel viram aquilo, disseram uns aos outros[a]: “O que é isto?”[b] Pois não sabiam o que era. Então Moisés lhes disse: “Este é o pão que Yahweh deu a vocês para comer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “cada homem ao seu irmão”; trata-se de uma expressão idiomática com o sentido de “uns aos outros”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida por “O que é isto?” é tradicionalmente relacionada ao nome “maná”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de modo formal a expressão hebraica e permanece clara em português, sem substituir o gentílico interpretativamente mais fluido “os israelitas”.
- source_word: אִישׁ אֶל אָחִיו
  choice: uns aos outros
  rationale: Expressa naturalmente em português o sentido recíproco do idioma hebraico, cujo teor literal é preservado em nota.
- source_word: מָן הוּא
  choice: O que é isto?
  rationale: Toma מָן como expressão interrogativa, conforme exige a explicação seguinte de que eles não sabiam o que aquilo era. “Isto” é natural para algo que acaba de ser visto e preserva a pergunta narrativa.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: não sabiam o que era
  rationale: Tradução direta e idiomática da oração explicativa, sem acrescentar uma finalidade não expressa no hebraico.
- source_word: הוּא הַלֶּחֶם
  choice: Este é o pão
  rationale: O pronome identifica aquilo que estava diante deles; “este” produz uma referência demonstrativa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְאָכְלָה
  choice: para comer
  rationale: Comunica de forma concisa e natural a finalidade indicada pela construção hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Se מָן deve ser tratado aqui como o substantivo próprio “maná”
  choice: Traduzir contextualmente como a pergunta “O que é isto?”
  alternative: É maná; Maná?
  rationale: A oração seguinte afirma que eles não sabiam o que aquilo era, favorecendo a leitura interrogativa. Usar “maná” neste ponto anteciparia o nome posterior e ocultaria o jogo narrativo, cuja associação tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém “filhos de Israel” por proximidade formal ao hebraico, mas usa construções correntes como “uns aos outros” e “para comer”. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
