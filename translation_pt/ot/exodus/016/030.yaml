  text: So the people rested on the seventh day[a].
translation:
  language: pt
  text: Assim, o povo descansou no sétimo dia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cessou”; o verbo está relacionado ao descanso sabático, de modo que “guardou o sábado” seria uma ampliação interpretativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: descansou
  rationale: O qal wayyiqtol de שׁבת tem o sentido básico de cessar ou descansar. No contexto imediato do sábado, “descansou” expressa a ação com naturalidade em português sem ampliar interpretativamente para “guardou o sábado”.
- source_word: הָעָם
  choice: o povo
  rationale: עָם designa coletivamente o povo e é a forma natural no contexto da narrativa do deserto.
- source_word: בַּיּוֹם הַשְּׁבִעִי
  choice: no sétimo dia
  rationale: A preposição בְּ com יוֹם, seguida do ordinal, é expressa naturalmente em português por “no sétimo dia”.
- source_word: וַ
  choice: Assim
  rationale: O waw consecutivo faz avançar a narrativa e, neste contexto, apresenta a ação como resultado da instrução anterior. “Assim” preserva esse fluxo de modo natural.
theological_decisions:
- issue: Explicitar no verbo a observância do sábado
  choice: Traduzir como “descansou”, sem acrescentar “guardou o sábado”.
  alternative: “cessou” ou “guardou o sábado”
  rationale: O verbo hebraico afirma que o povo cessou ou descansou; o significado sabático já está indicado pelo contexto e pela expressão “no sétimo dia”. Isso evita introduzir formulação litúrgica ou doutrinária além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O singular “descansou” concorda com o substantivo coletivo “o povo”.
