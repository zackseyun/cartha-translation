base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: pt
  text: 'Então Moisés e Arão disseram a todos os filhos de Israel[a]: “Ao entardecer, vocês saberão que Yahweh os tirou da terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a todos os israelitas”. O hebraico diz literalmente “a todos os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar. Embora o verbo hebraico esteja no singular, ele introduz o discurso conjunto de Moisés e Arão; o plural é natural e claro em português.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: a todos os filhos de Israel
  rationale: Preserva de perto a expressão hebraica בְּנֵי יִשְׂרָאֵל, literalmente 'filhos de Israel'; a nota registra a alternativa idiomática 'israelitas'.
- source_word: עֶרֶב
  choice: Ao entardecer
  rationale: O substantivo funciona como indicação temporal. 'Ao entardecer' é natural em português e não acrescenta a especificação 'hoje'.
- source_word: וִידַעְתֶּם
  choice: vocês saberão
  rationale: Expressa diretamente o valor futuro da forma verbal e usa uma forma de segunda pessoa plural de ampla legibilidade brasileira.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que o povo saberá.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוֹצִיא אֶתְכֶם
  choice: os tirou
  rationale: O hifil de יצא tem aqui o sentido causativo idiomático de 'tirar' ou 'fazer sair'. O pretérito perfeito remete ao êxodo já realizado.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém explicitamente אֶרֶץ, 'terra', e reproduz a expressão hebraica completa de modo natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o caráter de nome próprio sem substituí-lo por um título; 'Jeová' representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega 'vocês' para a segunda pessoa plural e conserva a formulação bíblica 'filhos de Israel', esclarecida em nota.
