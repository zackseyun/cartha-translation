base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: pt
  text: Os filhos de Israel[a] comeram o maná durante quarenta anos, até chegarem a uma terra habitada[b]; comeram o maná até chegarem à fronteira[c] da terra de Canaã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Em hebraico, literalmente, “os filhos de Israel”, designação coletiva tradicional do povo de Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma terra povoada”. A expressão contrasta o deserto com uma terra onde havia população estabelecida.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ao limite” ou “à borda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Preserva a forma hebraica da designação coletiva e pactual, mantendo linguagem compreensível em português; a alternativa idiomática é registrada em nota.
- source_word: אָכְלוּ
  choice: comeram
  rationale: O perfeito qal resume uma ação passada ao longo do período mencionado; o pretérito perfeito é natural e fiel em português.
- source_word: הַמָּן
  choice: o maná
  rationale: Mantém o artigo definido e emprega a forma tradicional e corrente em português para מָן.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: A preposição 'durante' explicita de modo idiomático o valor de duração da expressão hebraica, sem alterar seu conteúdo.
- source_word: עַד בֹּאָם
  choice: até chegarem
  rationale: Reproduz o limite temporal expresso por עַד com infinitivo construto e evita o mais interpretativo 'até entrarem'.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: a uma terra habitada
  rationale: O particípio nifal de ישׁב descreve uma terra habitada ou povoada, em contraste com o deserto.
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: à fronteira da terra de Canaã
  rationale: Em contexto geográfico, 'fronteira' comunica naturalmente קְצֵה como limite ou borda de um território.
