base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: pt
  text: Partiram de Elim, e toda a comunidade dos filhos de Israel[a] chegou ao deserto de Sim[b], que fica entre Elim e o Sinai, no décimo quinto dia do segundo mês depois de terem saído da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é “filhos de Israel”, designação nacional que pode abranger todo o povo de Israel, não apenas os homens.
    reason: lexical_alternative
  - marker: b
    text: “Sim” é aqui um nome de lugar — o deserto de Sim —, não a palavra afirmativa portuguesa “sim”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵילִם
  choice: Partiram de Elim
  rationale: נסע, no contexto das jornadas pelo deserto, indica levantar acampamento e seguir viagem. “Partiram” expressa naturalmente o movimento sem acrescentar detalhes não explícitos.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a comunidade dos filhos de Israel
  rationale: “Toda a comunidade” comunica o sentido coletivo de כָּל עֲדַת, enquanto “filhos de Israel” preserva a expressão familiar e nacional do hebraico.
- source_word: וַיָּבֹאוּ
  choice: chegou
  rationale: בוא é um verbo comum de movimento. O singular concorda em português com o núcleo coletivo “comunidade” e “chegou” representa com clareza a conclusão da viagem.
- source_word: אֶל מִדְבַּר סִין
  choice: ao deserto de Sim
  rationale: מִדְבָּר designa uma região árida ou erma; “deserto” é claro e corrente em português. סִין é transliterado como o topônimo tradicional português “Sim”.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: que fica entre Elim e o Sinai
  rationale: A oração relativa localiza geograficamente o deserto. “Fica” soa natural em português, e o artigo em “o Sinai” segue o uso português corrente para esse topônimo.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: no décimo quinto dia do segundo mês
  rationale: Equivalência idiomática direta da fórmula hebraica de datação.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: depois de terem saído da terra do Egito
  rationale: O infinitivo com לְ estabelece a saída do Egito como ponto temporal de referência. A formulação mantém “terra do Egito” e explicita de modo natural a relação temporal.
