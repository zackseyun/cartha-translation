  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: pt
  text: A casa de Israel deu-lhe o nome de maná[a]. Ele era semelhante à semente branca de coentro[b], e seu sabor era como o de uma bolacha fina com mel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico man; tradicionalmente traduzido como “maná” em português.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “semelhante à semente de coentro, que era branca”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “como o de uma bolacha com mel” ou “como o de bolos finos feitos com mel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל אֶת־שְׁמוֹ
  choice: A casa de Israel deu àquele alimento o nome de
  rationale: Preserva a expressão coletiva hebraica “casa de Israel” e o ato explícito de dar nome. “Àquele alimento” explicita de modo natural em português o referente do sufixo hebraico, sem acrescentar uma identificação estranha ao contexto.
- source_word: מָן
  choice: maná
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o hebraico man.
- source_word: וְהוּא כְּזֶרַע גַּד לָבָן
  choice: Ele era semelhante à semente branca de coentro
  rationale: Traduz זֶרַע como “semente”, identifica גַּד pela equivalência usual “coentro” e mantém לָבָן como qualificação da semente, sem eliminar a possível diferença de construção indicada em nota.
- source_word: וְטַעְמוֹ
  choice: e seu sabor
  rationale: “Sabor” é a equivalência portuguesa direta e natural de טַעַם na descrição de um alimento.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: como o de uma torta fina feita com mel
  rationale: צַפִּיחִת designa provavelmente um bolo, torta ou lâmina fina assada; “torta fina” é compreensível em português internacional, e “feita com mel” expressa naturalmente a relação indicada por בְּ.
