    issue: “tiverem de assar/cozinhar”
    rationale: A locução pode comunicar obrigação ou necessidade. O hebraico emprega uma oração relativa com imperfeito seguida de imperativo enfático; “o que forem assar, assem” preserva essa estrutura sem acrescentar modalidade.
  - severity: low
    issue: “guardem até a manhã”
    rationale: O hebraico traz um imperativo (“separem”) seguido de uma expressão de finalidade (“para guarda/conservação até a manhã”), não um segundo imperativo. A revisão preserva essa relação.
  - severity: low
    issue: Redação da nota b
    rationale: 'A nota deve refletir precisamente a construção: o hebraico repete cada verbo, com uma forma verbal na oração relativa seguida de imperativo.'
