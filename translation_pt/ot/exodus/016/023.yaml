  source_fidelity: 'Revisão necessária para representar mais diretamente a construção hebraica repetitiva: imperfeito seguido de imperativo em cada par (“o que forem assar, assem”). A formulação “tiverem de” pode sugerir necessidade não expressa. A finalidade de לְמִשְׁמֶרֶת é mais bem mantida como “para guardar”, em vez de convertê-la em um segundo imperativo coordenado.'
  naturalness: O português é claro, atual e de registro apropriado. “Isto é o que Yahweh disse” é mais idiomático e discursivamente direto do que “Foi isto que Yahweh falou”, sem perda de sentido.
  terminology: “Yahweh”, “descanso solene” e “sábado santo dedicado a Yahweh” são escolhas adequadas. “Cozinhar” é uma opção segura para בשל, que pode ter sentido mais específico de “ferver”, mas não exige essa especificação no texto principal.
