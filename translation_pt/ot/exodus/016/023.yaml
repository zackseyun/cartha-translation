base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: pt
  text: 'Então ele lhes disse: “Isto é o que Yahweh disse: amanhã será um descanso solene, um sábado santo dedicado a Yahweh.[a] O que forem assar, assem; e o que forem cozinhar, cozinhem;[b] e tudo o que sobrar, separem para vocês, para guardar até a manhã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sábado consagrado a Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete os verbos para dar ênfase: literalmente, “o que assarem, assem; e o que cozinharem, cozinhem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Então ele lhes disse
  rationale: O wayyiqtol dá continuidade à narrativa; “disse” mantém a introdução direta da fala, e “Então” soa natural em português.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Foi isto que Yahweh falou
  rationale: A construção aponta enfaticamente para a instrução em questão. O perfeito דִּבֶּר é representado por um passado concluído, natural no contexto português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שַׁבָּתוֹן
  choice: um descanso solene
  rationale: Expressa uma cessação especial e cultualmente significativa, sem reduzi-la a mero descanso comum.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: um sábado santo dedicado a Yahweh
  rationale: Preserva tanto a santidade do sábado quanto sua orientação a Yahweh; “dedicado a” explicita de modo natural o valor relacional de לְ.
- source_word: מָחָר
  choice: amanhã será
  rationale: A cópula futura, ausente na oração nominal hebraica, é necessária para uma formulação portuguesa natural.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Assem o que tiverem de assar
  rationale: Mantém o verbo específico “assar” e transmite a relação entre a oração relativa e a ordem sem produzir repetição artificial em português.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: e cozinhem o que tiverem de cozinhar
  rationale: בשל pode significar cozinhar ou ferver. “Cozinhar” preserva a amplitude lexical; a repetição verbal mantém o paralelismo enfático do hebraico.
- source_word: כָּל הָעֹדֵף
  choice: tudo o que sobrar
  rationale: Representa de maneira idiomática o particípio que designa a porção remanescente ou excedente.
- source_word: הַנִּיחוּ לָכֶם
  choice: separem para vocês
  rationale: Comunica a ação intencional de reservar e preserva o beneficiário indicado por לָכֶם.
- source_word: לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: e guardem até a manhã
  rationale: Converte naturalmente o substantivo de finalidade “para guarda/conservação” em instrução verbal, mantendo o limite temporal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio sem substituí-lo por um título ou adotar a forma híbrida tradicional “Jeová”.
- issue: Relação expressa em שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: um sábado santo dedicado a Yahweh
  alternative: um sábado santo para Yahweh; um sábado consagrado a Yahweh
  rationale: “Dedicado a” comunica a orientação cultual do sábado sem especificar uma teoria teológica além do que a preposição e o contexto sustentam.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “vocês” por clareza internacional e naturalidade no Brasil. A repetição hebraica foi parcialmente suavizada no texto principal, mas registrada em nota; “cozinhar” preserva a amplitude de בשל, que também pode significar “ferver”.
