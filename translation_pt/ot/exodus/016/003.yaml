  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: pt
  text: 'E os filhos de Israel disseram a eles: “Quem dera tivéssemos morrido pela mão de Yahweh na terra do Egito, quando nos sentávamos junto à panela de carne[a] e comíamos pão até ficarmos satisfeitos! Pois vocês nos trouxeram para este deserto a fim de matar de fome toda esta assembleia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto ao caldeirão de carne”. O hebraico traz «panela/caldeirão» no singular e evoca um recipiente usado para cozinhar carne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico, que está no masculino plural e tem força representativa.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: Quem dera tivéssemos morrido
  rationale: מִי יִתֵּן é uma expressão idiomática de desejo; em português, “quem dera” transmite naturalmente o desejo contrafactual ligado à morte passada.
- source_word: בְיַד יְהוָה
  choice: pela mão de Yahweh
  rationale: Mantém a imagem hebraica da mão como agente e translitera o nome divino.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: quando nos sentávamos junto às panelas de carne
  rationale: Reproduz a oração temporal e a imagem concreta das panelas associadas à carne, em português natural.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: e comíamos pão até ficarmos satisfeitos
  rationale: Expressa com clareza a ideia de comer até a saciedade e preserva o paralelismo temporal.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: este deserto
  rationale: “Deserto” é a equivalência corrente e inteligível de מִדְבָּר neste contexto geográfico, sem exigir que o lugar fosse apenas arenoso.
- source_word: לְהָמִית ... בָּרָעָב
  choice: a fim de matar de fome
  rationale: Torna explícita em português a relação de finalidade e o meio indicado pelo hebraico, sem atenuar a acusação.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: toda esta assembleia
  rationale: “Assembleia” conserva o sentido coletivo de קָהָל sem introduzir desnecessariamente uma associação eclesiástica posterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Designação pactual בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A tradução formal conserva a formulação familiar masculina e representativa do hebraico; as alternativas são mais idiomáticas, mas menos transparentes quanto à forma da expressão.
- issue: Agência divina na expressão בְיַד יְהוָה
  choice: pela mão de Yahweh
  alternative: por Yahweh
  rationale: A formulação conserva a imagem e a atribuição de agência presentes na queixa dos israelitas, sem explicar se a morte imaginada seria juízo, providência ou outro ato divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tom hiperbólico e acusatório do original. “Quem dera” comunica o desejo contrafactual; “assembleia” preserva o caráter coletivo; e “Yahweh” representa diretamente o nome divino.
