  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: pt
  text: No sexto dia, quando prepararem o que trouxerem, será o dobro[a] do que recolhem dia após dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será uma porção dupla em relação ao que recolhem a cada dia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: será
  rationale: O perfeito com waw introduz aqui uma circunstância ou resultado futuro; o futuro simples é natural em português.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: no sexto dia
  rationale: Reproduz a expressão temporal sem acrescentar “da semana”, que não está explícito no hebraico.
- source_word: וְהֵכִינוּ
  choice: quando prepararem
  rationale: A oração temporal liga o preparo ao sexto dia e exprime com clareza a ação futura no contexto da instrução.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: o que trouxerem
  rationale: Refere-se ao material recolhido e levado para dentro; a formulação é corrente e mantém a relação indefinida do hebraico.
- source_word: וְהָיָה מִשְׁנֶה
  choice: será o dobro
  rationale: מִשְׁנֶה indica quantidade dupla; “o dobro” é preciso, conciso e natural em português.
- source_word: עַל אֲשֶׁר
  choice: do que
  rationale: Neste contexto, עַל introduz a base de comparação ou medida; “do que” expressa naturalmente essa relação.
- source_word: יִלְקְטוּ
  choice: recolhem
  rationale: לקט descreve apanhar ou recolher o maná; “recolher” é claro e idiomático.
- source_word: יוֹם יוֹם
  choice: dia após dia
  rationale: A repetição tem sentido distributivo e iterativo; “dia após dia” preserva esse aspecto e parte do ritmo hebraico.
theological_decisions: []
