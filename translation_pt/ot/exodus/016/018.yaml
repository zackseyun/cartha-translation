  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: pt
  text: Quando mediram o que haviam recolhido com o ômer, quem havia recolhido muito não teve sobra, e quem havia recolhido pouco não teve falta; cada um recolheu conforme o que podia comer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֹדּוּ בָעֹמֶר
  choice: Quando mediram o que haviam recolhido com o ômer
  rationale: O waw consecutivo dá prosseguimento à narrativa, mas a oração funciona naturalmente como circunstância temporal do resultado. בָעֹמֶר indica o ômer como medida; explicitar o objeto implícito evita em português a impressão de que as pessoas foram medidas.
- source_word: הֶעְדִּיף
  choice: não teve sobra
  rationale: O hifil de יתר exprime exceder ou ter em excesso. A formulação é concisa, natural e mantém o contraste com não ter falta.
- source_word: הַמַּרְבֶּה
  choice: quem havia recolhido muito
  rationale: O particípio significa formalmente quem aumentava ou fazia muito, mas o contexto imediato é a coleta do maná. O mais-que-perfeito composto deixa claro que a coleta antecedeu a medição.
- source_word: הֶחְסִיר
  choice: não teve falta
  rationale: O verbo exprime deficiência ou falta. Esta escolha preserva o paralelismo compacto do hebraico com não teve sobra.
- source_word: הַמַּמְעִיט
  choice: quem havia recolhido pouco
  rationale: O particípio é entendido à luz da coleta de maná e forma paralelo direto com quem havia recolhido muito.
- source_word: אִישׁ
  choice: cada um
  rationale: Aqui אִישׁ tem força distributiva e se refere a cada pessoa, não exclusivamente a homens adultos. Cada um preserva essa distribuição em português corrente.
- source_word: לְפִי אָכְלוֹ
  choice: conforme o que podia comer
  rationale: A expressão, literalmente relacionada à medida do comer de cada pessoa, indica a quantidade adequada ao consumo. A tradução comunica essa noção sem reduzi-la necessariamente a apetite.
- source_word: לָקָטוּ
  choice: recolheu
  rationale: לקט é o verbo normal da narrativa para recolher o maná. O singular concorda distributivamente com cada um, embora o hebraico retome o plural.
theological_decisions:
- issue: Singular distributivo com formas masculinas em אִישׁ ... אָכְלוֹ
  choice: cada um ... o que podia comer
  alternative: cada homem ... segundo o seu comer
  rationale: O masculino singular hebraico funciona distributivamente para os integrantes do grupo. A formulação portuguesa preserva o valor individual sem introduzir uma exclusividade masculina que o contexto não exige.
- issue: Natureza do equilíbrio entre quem recolheu muito e quem recolheu pouco
  choice: não teve sobra ... não teve falta
  alternative: não sobrou ao que recolheu muito ... não faltou ao que recolheu pouco
  rationale: O texto afirma o resultado observado após a medição, mas não explica o mecanismo. A tradução mantém essa tensão e não acrescenta uma interpretação sobre redistribuição ou milagre.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva-se o termo técnico ômer, já apresentado no contexto anterior, e evita-se converter a medida antiga. O paralelismo hebraico é mantido em não teve sobra / não teve falta.
