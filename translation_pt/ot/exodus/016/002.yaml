  text: ו/ילינו כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: pt
  text: E toda a comunidade dos filhos de Israel[a] murmurou contra Moisés e contra Arão no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: murmurou
  rationale: O verbo לון/לין, neste contexto, descreve uma queixa coletiva e hostil contra os líderes. “Murmurou” conserva essa conotação negativa e é natural no registro bíblico moderno.
- source_word: כָּל
  choice: toda
  rationale: Com o substantivo coletivo עֵדָה, כָּל enfatiza a totalidade da comunidade; “toda a comunidade” é idiomático em português.
- source_word: עֲדַת
  choice: comunidade
  rationale: עֵדָה designa aqui o povo de Israel como corpo coletivo. “Comunidade” comunica isso com clareza atual, sem sugerir necessariamente uma reunião formal ou uma instituição religiosa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: A expressão hebraica é um construto masculino plural e designa corporativamente o povo descendente de Israel. “Filhos de Israel” preserva de perto a forma da fonte, enquanto “israelitas” permanece como alternativa mais concisa em nota.
- source_word: עַל
  choice: contra
  rationale: Neste contexto de queixa dirigida a pessoas, עַל tem força adversativa; “contra” expressa adequadamente a oposição a Moisés e Arão.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר indica uma região erma ou desabitada, não necessariamente arenosa. “Deserto” é a forma portuguesa consagrada e compreensível neste relato do Êxodo.
theological_decisions:
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução principal conserva a forma masculina e genealógica da expressão hebraica sem restringir o referente apenas aos homens, pois ela nomeia corporativamente o povo da aliança. A alternativa é registrada sem apagar a forma da fonte.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O singular “murmurou” segue a concordância natural com o coletivo “toda a comunidade”, embora o verbo hebraico esteja no plural.
