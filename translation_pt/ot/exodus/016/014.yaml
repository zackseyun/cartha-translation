  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: pt
  text: Quando a camada de orvalho se levantou, eis que sobre a superfície do deserto havia uma coisa fina e escamosa[a], fina como a geada sobre o chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma coisa fina, semelhante a flocos»; o raro termo hebraico traduzido por «escamosa» tem nuance incerta e pode descrever a textura ou a aparência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: se levantou
  rationale: Preserva o sentido literal de עלה, «subir/levantar-se», sem explicitar «evaporou», que seria uma interpretação contextual.
- source_word: שִׁכְבַת הַטָּל
  choice: a camada de orvalho
  rationale: שִׁכְבָה indica uma camada ou massa depositada; a expressão é clara e natural em português.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a função do marcador discursivo, chamando atenção para a descoberta repentina.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: sobre a superfície do deserto
  rationale: Expressa naturalmente o idioma hebraico «sobre a face de» e emprega «deserto» no sentido amplo de região erma.
- source_word: דַּק
  choice: fina
  rationale: Conserva nas duas ocorrências a repetição hebraica e comunica pequenez ou delicadeza.
- source_word: מְחֻסְפָּס
  choice: escamosa
  rationale: O termo é raro e de nuance incerta; «escamosa» representa uma possível aparência ou textura em forma de flocos sem excessiva especificação.
- source_word: דַּק כַּכְּפֹר
  choice: fina como a geada
  rationale: Preserva tanto a comparação com כְּפֹר quanto a repetição de דַּק.
- source_word: עַל הָאָרֶץ
  choice: sobre o chão
  rationale: No contexto físico imediato, «chão» traduz אֶרֶץ de modo natural e concreto.
