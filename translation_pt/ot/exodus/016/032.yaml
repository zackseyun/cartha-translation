  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: pt
  text: 'E Moisés disse: “Isto é o que Yahweh ordenou: Que se guarde um ômer cheio dele[a] para as suas gerações, para que vejam o pão com que alimentei vocês no deserto, quando tirei vocês da terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um ômer era uma antiga unidade de medida de capacidade; a expressão hebraica significa literalmente “a quantidade que enche um ômer”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: E Moisés disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico em português natural.
- source_word: זֶה הַדָּבָר
  choice: Isto é o que
  rationale: דָּבָר pode significar palavra, assunto ou coisa; a formulação escolhida introduz naturalmente o conteúdo da ordem sem restringir indevidamente o sentido.
- source_word: אֲשֶׁר צִוָּה יְהוָה
  choice: Yahweh ordenou
  rationale: Mantém o nome divino presente no hebraico e expressa de modo direto a ordem dada.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: um ômer cheio dele
  rationale: Conserva a antiga unidade de medida e representa מְלֹא como a quantidade completa que cabe em um ômer; “dele” retoma o maná do contexto.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: seja guardado por todas as suas gerações
  rationale: Comunica tanto a preservação do maná quanto sua função contínua entre as gerações futuras.
- source_word: לְמַעַן יִרְאוּ
  choice: para que vejam
  rationale: Mantém a oração de finalidade e deixa implícito, como no hebraico, que o sujeito são as gerações mencionadas anteriormente.
- source_word: הַלֶּחֶם
  choice: o pão
  rationale: Preserva o sentido concreto de לֶחֶם e sua associação textual com o maná, em vez de generalizá-lo como “alimento”.
- source_word: אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: com que alimentei vocês
  rationale: Expressa naturalmente o hifil causativo de אכל, isto é, dar de comer ou alimentar.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, “deserto” é a designação bíblica clara e consagrada para a região erma indicada por מִדְבָּר.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: quando os tirei da terra do Egito
  rationale: Traduz a construção temporal com infinitivo e preserva a referência explícita à libertação do Egito.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Referente implícito de יִרְאוּ (“vejam”)
  choice: Manter o sujeito implícito
  alternative: “para que as suas gerações vejam”
  rationale: O contexto aponta para as gerações futuras, mas o hebraico não repete o sujeito. A formulação portuguesa preserva essa concisão sem criar uma identificação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e conserva “ômer” como medida antiga, explicado em nota.
