  yaml_path: translation/ot/exodus/016/017.yaml
  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: pt
  text: Os filhos de Israel fizeram assim e recolheram, uns mais, outros menos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “quem recolheu muito e quem recolheu pouco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram assim
  rationale: A expressão retoma a instrução anterior; “fizeram assim” reproduz de modo natural e fiel o sentido idiomático de עשה com כֵן.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar hebraica, tradicional e compreensível em português, em vez de reduzi-la ao gentílico “israelitas”.
- source_word: וַיִּלְקְטוּ
  choice: recolheram
  rationale: לקט indica apanhar ou juntar alimento; “recolheram” é natural no contexto do maná e evita sugerir uma colheita agrícola regular.
- source_word: הַמַּרְבֶּה וְהַמַּמְעִיט
  choice: uns mais, outros menos
  rationale: Os particípios substantivados formam um contraste distributivo entre quem recolheu em maior e em menor quantidade. A formulação portuguesa é clara e idiomática, enquanto a nota conserva a estrutura mais formal.
