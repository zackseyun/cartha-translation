base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: pt
  text: Durante seis dias vocês o recolherão, mas, no sétimo dia, que é sábado[a], não haverá nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, nesse dia não haverá maná para recolher. Literalmente, a construção hebraica diz: “no sétimo dia, sábado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Durante seis dias
  rationale: A expressão construta significa idiomaticamente “seis dias”; “durante” comunica com naturalidade a extensão temporal no contexto da instrução.
- source_word: תִּלְקְטֻהוּ
  choice: vocês o recolherão
  rationale: A forma verbal tem sujeito na segunda pessoa masculina plural e sufixo de objeto na terceira masculina singular. “Recolher” descreve naturalmente a coleta do maná, e o futuro mantém a força diretiva/preditiva.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mas, no sétimo dia
  rationale: Embora o waw possa ser traduzido por “e”, o contexto estabelece contraste entre os seis dias e o sétimo; “mas” expressa essa relação em português natural.
- source_word: שַׁבָּת
  choice: que é sábado
  rationale: O substantivo está em aposição a “o sétimo dia”. A oração explicativa reproduz essa identificação de modo claro e natural, sem reduzi-lo apenas a um genérico “dia de descanso”.
- source_word: לֹא יִהְיֶה בּוֹ
  choice: não haverá nada
  rationale: Literalmente, “não haverá nele”. O referente elíptico é o que vinha sendo recolhido, isto é, o maná; “não haverá nada” preserva a elipse de modo inteligível, enquanto a nota esclarece o sentido contextual.
theological_decisions:
- issue: Sentido de שַׁבָּת antes da legislação do Sinai
  choice: sábado
  alternative: dia de descanso
  rationale: “Sábado” conserva o termo reconhecível e a identificação nominal do sétimo dia, sem transformar o texto em uma paráfrase funcional nem acrescentar conclusões confessionais sobre seu alcance posterior.
- issue: Referente implícito em לֹא יִהְיֶה בּוֹ
  choice: Manter o objeto implícito no texto e esclarecê-lo em nota
  alternative: não haverá maná
  rationale: O hebraico não repete “maná”; preservar a elipse respeita a forma textual, enquanto a nota impede ambiguidade desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e “sábado” em minúscula como designação do dia. O marcador [a] aparece no texto principal.
