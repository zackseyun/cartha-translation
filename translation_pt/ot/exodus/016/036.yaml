lexical_decisions:
- source_word: הָעֹמֶר
  choice: o ômer
  rationale: Preserva por transliteração a antiga unidade hebraica de medida para secos. O artigo definido do hebraico é mantido de modo natural em português numa afirmação que define a unidade.
- source_word: עֲשִׂירִית
  choice: a décima parte
  rationale: Expressa com clareza e naturalidade a fração indicada pelo substantivo numeral hebraico.
- source_word: הָאֵיפָה
  choice: de um efa
  rationale: Preserva por transliteração a unidade antiga, sem substituí-la por uma equivalência moderna imprecisa; o indefinido é idiomático em português ao indicar a relação entre unidades.
- source_word: הוּא
  choice: é
  rationale: O pronome exerce função copulativa na oração nominal e é adequadamente representado pelo verbo ser em português.
- source_word: וְ
  choice: (não expresso)
  rationale: A conjunção introduz uma observação explicativa. Sua omissão evita um conectivo artificial em português sem perder conteúdo proposicional.
