base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: pt
  text: E pela manhã vocês verão a glória de Yahweh[a], porque ele ouviu as murmurações de vocês contra Yahweh. E quem somos nós, para vocês murmurarem contra nós?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele ouvir as murmurações de vocês contra Yahweh”. A construção hebraica pode ter sentido temporal, além de causal.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: E pela manhã
  rationale: A conjunção mantém a sequência do discurso, e o substantivo com valor adverbial indica o momento.
- source_word: וּ/רְאִיתֶם
  choice: vocês verão
  rationale: Nesse contexto, a forma verbal comunica uma previsão futura; a formulação é natural e clara em português moderno.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Preserva a expressão hebraica e sua referência à presença esplendorosa e manifesta de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּ/שָׁמְע/וֹ
  choice: porque ele ouviu
  rationale: A construção com ב e infinitivo pode ser causal ou temporal. No contexto, a leitura causal explica por que o povo verá a glória de Yahweh; a alternativa temporal é registrada em nota.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: as murmurações de vocês
  rationale: “Murmurações” expressa queixas reiteradas e hostis, preservando a conotação negativa do termo e sua ligação com o verbo seguinte.
- source_word: עַל יְהוָה
  choice: contra Yahweh
  rationale: Com a linguagem de queixa, עַל indica oposição dirigida a Yahweh, e não apenas o assunto da fala.
- source_word: וְנַחְנוּ מָה
  choice: E nós, quem somos
  rationale: Mantém a conjunção hebraica e comunica naturalmente a pergunta retórica que ressalta a pouca importância de Moisés e Arão diante de Yahweh.
- source_word: כִּי תלונו
  choice: para que vocês murmurem
  rationale: A formulação introduz idiomaticamente em português o conteúdo da pergunta retórica, sem impor ao כִּי um valor causal inadequado neste contexto.
- source_word: עָלֵינוּ
  choice: contra nós
  rationale: Preserva o sentido adversativo e o paralelo com “contra Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Valor causal ou temporal de בְּשָׁמְעוֹ
  choice: porque ele ouviu
  alternative: quando ele ouvir
  rationale: A leitura causal se ajusta à lógica imediata do versículo, mas a construção hebraica também admite uma leitura temporal, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e mantém “Yahweh” como nome divino. “Murmurações/murmurem” preserva a coesão lexical e o tom de descontentamento hostil do hebraico.
