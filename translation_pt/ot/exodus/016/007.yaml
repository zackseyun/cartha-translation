  naturalness: «E nós, quem somos, para que vocês murmurem contra nós?» é compreensível, mas «para que» tende a introduzir finalidade em português moderno. «E quem somos nós, para vocês murmurarem contra nós?» conserva melhor a pergunta retórica e soa natural em português internacional com boa legibilidade brasileira.
  terminology: «Yahweh», «glória» e «contra» são escolhas consistentes com o hebraico e com as decisões fornecidas. «Murmurações» tem registro bíblico digno e conserva a ligação lexical com «murmurem».
