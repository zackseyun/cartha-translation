base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: pt
  text: No sexto dia, eles recolheram o dobro de pão[a], dois ômeres por pessoa. Então todos os líderes da comunidade vieram e contaram a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ômer era uma unidade de medida de capacidade para produtos secos usada no antigo Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: No sexto dia
  rationale: A fórmula narrativa introduz o acontecimento situado no sexto dia. Em português, a expressão temporal direta é natural e preserva a progressão narrativa sem recorrer ao pouco idiomático «e aconteceu que».
- source_word: לָקְטוּ
  choice: recolheram
  rationale: No contexto do maná, o verbo לקט descreve a ação de recolher o alimento espalhado; «recolheram» é claro e corrente.
- source_word: לֶחֶם מִשְׁנֶה
  choice: o dobro de pão
  rationale: Mantém «pão» para לֶחֶם e expressa naturalmente a quantidade dupla indicada por מִשְׁנֶה, esclarecida em seguida como dois ômeres.
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  choice: dois ômeres por pessoa
  rationale: Translitera a medida antiga e comunica de modo idiomático o valor distributivo de לָאֶחָד, literalmente «para um».
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: todos os líderes da comunidade
  rationale: «Líderes» traduz a função dos נְשִׂיאִים sem sugerir um título moderno específico; «comunidade» comunica aqui a coletividade de Israel de modo amplamente compreensível.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: foram contar isso a Moisés
  rationale: Representa a sequência de ir até Moisés e informá-lo em português natural; «isso» explicita apenas o objeto já dado pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa. O termo cultural «ômer» é preservado e explicado em nota.
