  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: pt
  text: Eles o deixaram até a manhã, conforme Moisés havia ordenado. O maná não cheirou mal, nem havia vermes nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “larvas”. O termo hebraico pode designar, de modo geral, criaturas vermiformes associadas à decomposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: Eles o deixaram
  rationale: No contexto, o verbo indica que reservaram ou deixaram o maná guardado durante a noite; a formulação preserva o pronome singular e soa natural em português.
- source_word: עַד הַבֹּקֶר
  choice: até a manhã
  rationale: Expressão temporal direta, mantendo o artigo presente no hebraico e adequada ao registro narrativo.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: conforme Moisés havia ordenado
  rationale: Reproduz a relação de conformidade e deixa clara a anterioridade da ordem em relação à ação.
- source_word: הִבְאִישׁ
  choice: cheirou mal
  rationale: Expressa de modo claro e vívido o sentido de exalar mau cheiro ou tornar-se fétido, em contraste com o maná anteriormente estragado.
- source_word: רִמָּה
  choice: larva
  rationale: O substantivo designa uma criatura vermiforme associada à decomposição; 'larva' é natural e não força a identificação mais específica 'larva de mosca'.
- source_word: לֹא הָיְתָה בּוֹ
  choice: nem havia larva alguma nele
  rationale: Preserva a construção existencial negativa e coordena naturalmente a segunda negação com a primeira.
