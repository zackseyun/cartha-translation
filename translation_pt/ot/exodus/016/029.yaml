base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: pt
  text: 'Vejam: Yahweh lhes deu o sábado; por isso, no sexto dia, ele lhes dá pão para dois dias. Cada um[a] permaneça em seu lugar; ninguém saia do seu lugar no sétimo dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega “homem” nas duas cláusulas: a primeira tem sentido distributivo (“cada um”), e a segunda é uma proibição (“ninguém”). A forma masculina refere-se aos indivíduos da comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Vejam
  rationale: O imperativo plural pode indicar tanto visão quanto reconhecimento. “Vejam” conserva a força direta e permite que a oração seguinte esclareça o que deve ser reconhecido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: lhes deu o sábado
  rationale: Expressa de modo natural a ação concluída e preserva a ideia do sábado como dádiva concedida à comunidade.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca claramente a consequência lógica em português corrente.
- source_word: נֹתֵן
  choice: ele lhes dá
  rationale: O particípio apresenta a provisão divina como ação presente ou padrão recorrente; o presente simples conserva essa nuance.
- source_word: לֶחֶם יוֹמָיִם
  choice: pão para dois dias
  rationale: Mantém o termo concreto “pão” e comunica naturalmente a quantidade suficiente para dois dias.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Cada um permaneça onde está
  rationale: Neste contexto, ישב significa permanecer, e תַּחְתָּיו funciona idiomaticamente como “onde está” ou “em seu lugar”. A formulação portuguesa preserva o sentido distributivo.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: ninguém saia do seu lugar
  rationale: O subjuntivo com negação transmite a proibição com naturalidade, mantendo a repetição do conceito de lugar.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: Reproduz a referência temporal sem acrescentar explicações ausentes do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Masculino distributivo de אִישׁ
  choice: cada um / ninguém
  alternative: cada homem / nenhum homem
  rationale: Embora אִישׁ seja morfologicamente masculino, aqui é empregado distributivamente para os indivíduos da comunidade. As formas portuguesas escolhidas comunicam essa abrangência sem apagar a forma hebraica, que é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sábado” permanece em minúscula conforme o uso ortográfico comum. Os dois-pontos após “Vejam” tornam natural a função explicativa de כִּי sem enfraquecer o imperativo.
