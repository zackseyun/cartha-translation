base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Eis que farei chover pão do céu para vocês.[a] O povo sairá e recolherá, a cada dia, a porção necessária para aquele dia.[b] Assim, eu o porei à prova e verei se seguirá a minha instrução ou não.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que estou fazendo chover pão do céu para vocês”. O particípio hebraico pode descrever uma ação iminente.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a porção de um dia no seu dia”, isto é, a porção necessária para cada dia, recolhida naquele mesmo dia.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “se andará na minha lei ou não”. A palavra hebraica também pode significar “lei”, “ensino” ou “orientação”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança em vez de substituí-lo por um título.
- source_word: הִנְנִי מַמְטִיר
  choice: Eis que farei chover
  rationale: הִנְנִי introduz enfaticamente o anúncio, e o particípio causativo pode expressar uma ação iminente; o futuro é mais natural em português neste contexto.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: pão do céu
  rationale: Mantém o substantivo concreto 'pão' e a procedência celestial expressa no hebraico.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: a cada dia, a porção necessária para aquele dia
  rationale: Explicita com naturalidade o sentido distributivo do idioma hebraico sem perder a limitação diária.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: Assim, eu o porei à prova
  rationale: O sufixo hebraico é singular e retoma o substantivo coletivo 'povo'; o singular também é natural em português.
- source_word: הֲיֵלֵךְ
  choice: se seguirá
  rationale: O singular concorda com o coletivo 'povo'. 'Seguir' comunica naturalmente a metáfora hebraica de andar conforme uma orientação, enquanto a nota preserva a forma mais literal.
- source_word: בְּתוֹרָתִי
  choice: a minha instrução
  rationale: Neste contexto anterior ao Sinai, 'instrução' expressa adequadamente o sentido amplo de תּוֹרָה e evita restringi-lo indevidamente a um código legal já promulgado.
- source_word: אִם לֹא
  choice: ou não
  rationale: Completa de maneira idiomática a pergunta indireta introduzida por 'se'.
theological_decisions:
- issue: Sentido de תּוֹרָה antes da aliança no Sinai
  choice: minha instrução
  alternative: minha lei
  rationale: '''Instrução'' preserva a amplitude lexical de תּוֹרָה e se ajusta ao mandamento específico sobre a coleta diária; ''lei'' continua sendo uma alternativa legítima e é registrada em nota.'
- issue: Metáfora de caminhar em הֲיֵלֵךְ בְּתוֹרָתִי
  choice: seguirá a minha instrução
  alternative: andará na minha instrução
  rationale: A tradução principal comunica em português corrente a ideia de conduta orientada pela instrução divina; a nota conserva a metáfora formalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa 'vocês' para o plural לָכֶם, mantém o nome Yahweh e evita linguagem excessivamente arcaica. As notas preservam a força aspectual do particípio, o idioma da porção diária e as alternativas legítimas para a metáfora de caminhar e para תּוֹרָה.
