  to: 'Então Yahweh disse a Moisés: “Eis que farei chover pão do céu para vocês.[a] O povo sairá e recolherá, a cada dia, a porção necessária para aquele dia.[b] Assim, eu o porei à prova e verei se seguirá a minha instrução ou não.[c]”'
