  source_fidelity: A tradução transmite corretamente a ordem de pôr uma quantidade completa de um ômer de maná no recipiente e colocá-lo diante de Yahweh para preservação através das gerações. «Ômer cheio» preserva adequadamente o valor de מְלֹא הָעֹמֶר. A substituição contextual de «ali» por «nele» é clara e fiel.
  naturalness: O português é moderno e natural. «Ao longo das gerações de vocês» expressa com mais precisão a duração continuada de לְדֹרֹתֵיכֶם do que «por todas as gerações de vocês».
  terminology: «Recipiente», «ômer», «maná» e «Yahweh» são escolhas adequadas. A nota lexical deve estar ancorada em «recipiente», o termo a que se refere, e não em «Arão».
  issues:
