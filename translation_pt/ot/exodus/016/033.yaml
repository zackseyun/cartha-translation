    issue: A âncora [a] está ligada a «Arão», embora a nota trate do tipo de recipiente.
    rationale: A nota deve seguir imediatamente o termo anotado, para que o leitor identifique sem ambiguidade que «jarro» é alternativa para «recipiente».
  - severity: low
    issue: «Por todas as gerações de vocês» pode sugerir distributivamente cada geração, em vez de duração continuada.
    rationale: «Ao longo das gerações de vocês» representa de modo mais idiomático a preservação através das gerações indicada por לְדֹרֹתֵיכֶם.
