base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: pt
  text: 'Moisés disse a Arão: “Pegue um recipiente[a] e ponha nele um ômer cheio de maná. Depois, coloque-o diante de Yahweh, para que seja guardado ao longo das gerações de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jarro”, para o recipiente mencionado aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: recipiente
  rationale: O substantivo designa um vaso ou contentor, sem especificar com certeza o formato ou o material. “Recipiente” preserva essa amplitude; “jarro” é uma alternativa possível.
- source_word: מְלֹא הָעֹמֶר
  choice: um ômer cheio
  rationale: Preserva tanto a antiga unidade de medida quanto a ideia explícita de plenitude expressa por מְלֹא.
- source_word: מָן
  choice: maná
  rationale: Forma tradicional e amplamente compreendida em português para a substância mencionada no contexto.
- source_word: וְתֶן שָׁמָּה
  choice: ponha nele
  rationale: Embora שָׁמָּה signifique literalmente “ali”, o referente contextual é o recipiente recém-mencionado; a formulação explicita essa relação de modo natural em português.
- source_word: וְהַנַּח אֹתוֹ
  choice: coloque-o
  rationale: Traduz de modo natural o ato de pôr ou depositar o recipiente com o maná no lugar indicado.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” reproduz a expressão espacial e cultual לִפְנֵי, enquanto “Yahweh” translitera o nome divino.
- source_word: לְמִשְׁמֶרֶת
  choice: para que seja guardado
  rationale: Expressa a finalidade de conservação ou preservação indicada pelo substantivo hebraico.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as gerações de vocês
  rationale: Comunica a continuidade da preservação através das sucessivas gerações dos destinatários.
- source_word: קַח ... אַחַת
  choice: Pegue um recipiente
  rationale: O numeral feminino concorda com o recipiente e indica um único exemplar; em português corrente, o artigo indefinido transmite isso naturalmente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém “ômer” como medida antiga e usa “Yahweh” para o nome divino. A nota preserva a alternativa lexical para o tipo de vaso.
