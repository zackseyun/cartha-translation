  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Até quando vocês se recusarão a guardar os meus mandamentos e as minhas leis[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minhas instruções”. O hebraico torot (plural de torah) pode designar instruções revestidas de autoridade, além de leis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então ... disse” expressa a sequência de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַד אָנָה
  choice: Até quando
  rationale: É a forma idiomática natural de expressar a duração da desobediência contínua nesta pergunta de repreensão.
- source_word: מֵאַנְתֶּם
  choice: vocês se recusarão
  rationale: O verbo significa “recusar-se, não estar disposto”; nesta pergunta retórica, o futuro em português transmite a persistência da recusa. O plural “vocês” preserva a segunda pessoa masculina plural do hebraico.
- source_word: לִשְׁמֹר
  choice: guardar
  rationale: Com mandamentos, שׁמר significa observá-los ou cumpri-los; “guardar” preserva o vocabulário bíblico e continua compreensível no português atual.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: Mantém o registro pactual e jurídico do substantivo hebraico.
- source_word: וְתוֹרֹתָי
  choice: e as minhas leis
  rationale: No paralelismo com “meus mandamentos” e no contexto normativo, “leis” comunica bem a força obrigatória; a amplitude semântica de torah como “instrução” é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por um título.
- issue: Sentido de תּוֹרָה no plural com sufixo de primeira pessoa
  choice: minhas leis
  alternative: minhas instruções; meus ensinamentos
  rationale: “Leis” preserva a força normativa no contexto e no paralelismo com “mandamentos”, enquanto a nota registra o sentido mais amplo de instrução sem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para marcar claramente o plural do hebraico e mantém “guardar” no sentido bíblico corrente de observar ou cumprir mandamentos.
