id: EXO.16.9
reference: Exodus 16:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: pt
  text: 'Então Moisés disse a Arão: “Diga a toda a comunidade dos filhos de Israel[a]: ‘Aproximem-se de Yahweh[b], pois ele ouviu as murmurações de vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, de todo o povo de Israel.
    reason: A expressão hebraica é literalmente “filhos de Israel” e designa aqui a comunidade israelita inteira.
  - marker: b
    text: 'Ou: “Venham à presença de Yahweh”.'
    reason: A expressão hebraica pode indicar aproximar-se diante de alguém ou comparecer à sua presença.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O consecutivo narrativo dá sequência aos acontecimentos; “Então” mantém essa progressão com fluidez em português.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a comunidade dos filhos de Israel
  rationale: “Comunidade” comunica o caráter coletivo de עֵדָה, enquanto “filhos de Israel” preserva a expressão hebraica tradicional sem limitar a referência apenas aos homens.
- source_word: קִרְבוּ
  choice: Aproximem-se e venham
  rationale: O imperativo plural de קרב convoca o povo a se aproximar. A formulação explicita de modo natural em português o movimento de aproximação pressuposto pelo contexto.
- source_word: לִפְנֵי יְהוָה
  choice: para diante de Yahweh
  rationale: לִפְנֵי indica estar diante de alguém ou em sua presença; a construção conserva a imagem espacial e a dimensão da presença divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, distinguindo-o de um título como “Senhor”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da convocação com uma ligação causal natural e digna.
- source_word: שָׁמַע
  choice: ele ouviu
  rationale: O perfeito hebraico apresenta a ação como realizada. O pretérito perfeito português é claro e não acrescenta uma nuance aspectual além do necessário.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: as murmurações de vocês
  rationale: “Murmurações” preserva tanto a ideia de queixa repetida quanto o tom de descontentamento presente no contexto do deserto; “de vocês” expressa naturalmente o sufixo de segunda pessoa plural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido de comparecer לִפְנֵי יְהוָה
  choice: para diante de Yahweh
  alternative: à presença de Yahweh
  rationale: A opção principal mantém a imagem espacial do hebraico sem excluir a noção teológica de comparecer à presença divina.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se “Yahweh” como nome divino e “murmurações” pelo peso contextual de queixa persistente. A fala dentro da fala é marcada por aspas duplas e simples.
