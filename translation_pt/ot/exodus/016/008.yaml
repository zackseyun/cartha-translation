- from: 'E Moisés disse: “Quando Yahweh lhes der carne para comer à tarde e pão pela manhã até ficarem satisfeitos, vocês verão que Yahweh ouviu as queixas que têm feito contra ele.[a] Afinal, o que somos nós? As queixas de vocês não são contra nós, mas contra Yahweh.”'
  to: 'E Moisés disse: “Quando Yahweh lhes der carne para comer à tarde e pão pela manhã, para se saciarem, ao ouvir Yahweh as queixas de vocês[a] contra ele — o que somos nós? As queixas de vocês não são contra nós, mas contra Yahweh.”'
  rationale: A revisão elimina a conclusão interpretativa “vocês verão” e a mudança temporal para o passado em “ouviu”. “Ao ouvir Yahweh” reproduz de forma natural a construção circunstancial hebraica, preservando sua margem de ambiguidade. A âncora foi colocada junto de “queixas de vocês”, expressão à qual se refere a observação sobre a repetição cognata.
