  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: pt
  text: 'E Moisés disse: “Quando Yahweh lhes der carne para comer à tarde e pão pela manhã, para se saciarem, ao ouvir Yahweh as queixas de vocês[a] contra ele — o que somos nós? As queixas de vocês não são contra nós, mas contra Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as queixas de vocês que vocês se queixam contra ele”. A repetição do substantivo e do verbo da mesma raiz reforça a acusação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: Quando ... der
  rationale: A preposição ב com o infinitivo construto de נתן introduz aqui uma circunstância temporal; a formulação é natural em português e mantém a perspectiva futura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּשָׂר לֶאֱכֹל
  choice: carne para comer
  rationale: No contexto alimentar, בָּשָׂר significa naturalmente “carne”, e o infinitivo expressa finalidade.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém o sentido concreto e comum do termo no contexto da provisão do maná.
- source_word: לִשְׂבֹּעַ
  choice: até ficarem satisfeitos
  rationale: Expressa de modo corrente a ideia de saciedade contida na raiz שבע.
- source_word: בִּשְׁמֹעַ
  choice: vocês verão que ... ouviu
  rationale: 'O infinitivo בִּשְׁמֹעַ depende da construção iniciada por בְּתֵת e pode ser entendido como outra circunstância temporal: a provisão demonstrará que Yahweh ouviu as queixas. A explicitação “vocês verão” torna a frase completa em português sem apagar a ligação circunstancial.'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: as queixas que têm feito
  rationale: “Queixas” é natural e digno em português; a locução verbal comunica a ação reiterada, enquanto a nota registra a repetição enfática do substantivo e do verbo cognato no hebraico.
- source_word: וְנַחְנוּ מָה
  choice: Afinal, o que somos nós?
  rationale: Preserva o interrogativo “o que”, que salienta a insignificância de Moisés e Arão como alvos das queixas; “afinal” dá fluidez ao giro discursivo.
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: As queixas de vocês não são contra nós, mas contra Yahweh
  rationale: Explicita a cópula exigida pelo português e comunica claramente o contraste introduzido por כִּי.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Relação entre a provisão e Yahweh ouvir as queixas
  choice: A provisão funciona como ocasião e evidência de que Yahweh ouviu
  alternative: A provisão ocorre porque Yahweh ouve as queixas
  rationale: A repetição da construção ב + infinitivo favorece a coordenação circunstancial (“quando der... quando/ou ao ouvir”). A redação adotada evita definir de maneira excessiva a causalidade, que a sintaxe hebraica deixa aberta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento brasileiras (“vocês”, “lhes”). A frase longa do hebraico foi mantida como um único discurso, mas recebeu “vocês verão” para completar naturalmente a construção temporal e ligar a provisão à audição das queixas. O marcador [a] aparece no texto principal junto à expressão explicada.
