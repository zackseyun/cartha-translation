  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: pt
  text: E aconteceu que, enquanto Arão falava a toda a comunidade dos filhos de Israel[a], eles se voltaram em direção ao deserto; e eis que a glória de Yahweh apareceu na nuvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a toda a comunidade dos israelitas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a função narrativa da forma wayyiqtol de היה, introduzindo o acontecimento seguinte sem recorrer à fórmula arcaica «e sucedeu que».
- source_word: כְּדַבֵּר אַהֲרֹן
  choice: enquanto Arão falava
  rationale: A preposição כ com o infinitivo construto expressa simultaneidade; «enquanto» comunica com naturalidade que os eventos se sobrepõem.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a comunidade dos filhos de Israel
  rationale: «Comunidade» expressa o grupo coletivo designado por עֵדָה, e «filhos de Israel» conserva de modo transparente a formulação filial de בְּנֵי יִשְׂרָאֵל.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: eles se voltaram em direção ao deserto
  rationale: פנה com אֶל indica movimento ou orientação para algo; a expressão escolhida preserva esse sentido sem afirmar mais do que o hebraico.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a força deíctica e o efeito de súbita chamada de atenção da partícula hebraica, em registro digno e ainda corrente na linguagem bíblica portuguesa.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כָּבוֹד designa aqui a manifestação visível da glória divina, e a construção genitiva é reproduzida diretamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִרְאָה
  choice: apareceu
  rationale: O nifal de ראה tem aqui sentido intransitivo de tornar-se visível; «apareceu» é natural e adequado ao contexto de manifestação divina.
- source_word: בֶּעָנָן
  choice: na nuvem
  rationale: O artigo hebraico indica uma nuvem definida, coerente com a nuvem já conhecida no contexto narrativo.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal da aliança sem substituí-lo pelo título «SENHOR» nem adotar a forma híbrida tradicional «Jeová».
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha conserva a expressão filial masculina plural do hebraico. A alternativa idiomática é registrada em nota, sem apagar a forma concreta do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a progressão narrativa hebraica; «e eis que» mantém a solenidade e o impacto retórico sem tornar o restante do versículo arcaico.
