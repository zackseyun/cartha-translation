  text: And Moses said to them[a], “Let no one leave any of it until morning.”
translation:
  language: pt
  text: 'E Moisés lhes disse: “Ninguém guarde nada disso até a manhã.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “E ... disse” preserva essa ligação de modo natural em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲלֵהֶם
  choice: lhes
  rationale: Reproduz de forma concisa o sentido direto de “a eles”, sem explicitar interpretativamente quem são.
- source_word: אִישׁ אַל
  choice: Ninguém
  rationale: 'אִישׁ tem aqui valor distributivo sob a negação: a proibição se aplica a cada pessoa. “Ninguém” é a formulação portuguesa mais natural e exata.'
- source_word: יוֹתֵר
  choice: guarde
  rationale: No contexto do maná, o verbo significa deixar ou conservar uma porção para depois; “guarde” expressa naturalmente a ação proibida.
- source_word: מִמֶּנּוּ
  choice: nada disso
  rationale: O pronome retoma coletivamente o maná. Com a construção negativa portuguesa, “nada disso” comunica que nenhuma porção deveria ser conservada.
- source_word: עַד בֹּקֶר
  choice: até a manhã
  rationale: Tradução temporal direta e idiomática, indicando que nada deveria permanecer guardado até a manhã seguinte.
