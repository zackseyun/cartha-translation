id: EXO.16.12
reference: Exodus 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: pt
  text: '“Ouvi as queixas dos filhos de Israel. Fale com eles e diga: ‘Ao entardecer[a], vocês comerão carne e, pela manhã, se fartarão de pão. Então saberão que eu sou Yahweh, o Deus de vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as duas tardes”, expressão que designa o período do crepúsculo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito na primeira pessoa expressa uma ação concluída com relevância imediata; em português, o pretérito perfeito é a forma mais natural.
- source_word: תְּלוּנֹּת
  choice: murmurações
  rationale: Preserva a ideia de queixas reiteradas e descontentes no contexto do deserto, com registro bíblico ainda compreensível.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém de modo transparente a expressão masculina hebraica, sem substituí-la pela forma mais geral 'israelitas'.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: Fale com eles e diga
  rationale: Reproduz os dois elementos da fórmula hebraica de introdução da fala em português natural.
- source_word: בֵּין הָעַרְבַּיִם
  choice: Ao entardecer
  rationale: Comunica naturalmente o período crepuscular indicado pelo idioma hebraico; a forma literal é registrada em nota.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: vocês comerão carne
  rationale: No contexto alimentar, בָשָׂר significa naturalmente 'carne'; o futuro expressa a promessa divina.
- source_word: וּבַבֹּקֶר
  choice: e pela manhã
  rationale: Indica de modo idiomático em português o momento da segunda provisão.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: se fartarão de pão
  rationale: Expressa o sentido de comer até ficar plenamente saciado, preservando a imagem concreta do pão.
- source_word: וִידַעְתֶּם
  choice: Então saberão
  rationale: 'Torna explícita a força resultativa da sequência: a provisão levará ao reconhecimento de quem é Deus.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O plural pronominal é expresso com clareza no português internacional de leitura brasileira; אֱלֹהִים tem aqui referência singular.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega o Tetragrama como nome próprio; 'Yahweh' preserva essa função sem substituí-lo por um título.
- issue: Forma masculina de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A redação mantém a forma explícita do hebraico, enquanto 'israelitas' seria mais idiomático, porém menos formalmente transparente.
- issue: Relação entre a provisão e o conhecimento de Yahweh
  choice: Então saberão
  alternative: e saberão
  rationale: 'A forma escolhida comunica a provável força resultativa sem ampliar o conteúdo teológico: os sinais providos conduzem ao reconhecimento de Yahweh.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. Usa 'vocês' para o plural, evita construções excessivamente arcaicas e conserva 'filhos de Israel' e 'Yahweh' por transparência ao hebraico.
