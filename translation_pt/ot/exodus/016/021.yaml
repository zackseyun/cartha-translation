translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição hebraica foi conservada de forma idiomática em 'manhã após manhã'; o aspecto habitual foi refletido pelos verbos no imperfeito.
