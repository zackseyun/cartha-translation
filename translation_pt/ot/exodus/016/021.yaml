base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: pt
  text: E eles o recolhiam manhã após manhã, cada um conforme o que podia comer; mas, quando o sol esquentava, o maná derretia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: recolhiam
  rationale: O verbo לקט denota recolher ou juntar, especialmente alimento. O imperfeito narrativo, junto da expressão distributiva seguinte, descreve aqui uma ação habitual.
- source_word: אֹתוֹ
  choice: o
  rationale: Mantém o pronome objeto hebraico, cujo referente é o maná mencionado no contexto anterior, sem repetir o substantivo.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: A repetição tem valor distributivo e iterativo; esta formulação natural preserva de modo perceptível a repetição do hebraico.
- source_word: אִישׁ
  choice: cada um
  rationale: אִישׁ é masculino singular, mas funciona distributivamente neste contexto. 'Cada um' é natural em português, conserva essa distribuição individual e não restringe desnecessariamente a ação aos homens adultos.
- source_word: כְּפִי אָכְלוֹ
  choice: conforme o que podia comer
  rationale: A expressão literalmente relacionada à 'boca de seu comer' indica a quantidade correspondente à capacidade ou necessidade alimentar de cada pessoa.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: quando o sol esquentava
  rationale: Expressa naturalmente a circunstância temporal e o aquecimento do sol dentro da sequência narrativa.
- source_word: וְנָמָס
  choice: aquilo derretia
  rationale: מסס significa derreter ou dissolver. 'Aquilo' retoma claramente o alimento recolhido e evita a ambiguidade pronominal que 'ele' produziria em português com 'sol'.
