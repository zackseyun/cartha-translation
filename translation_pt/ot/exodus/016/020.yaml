- from: Mas eles não deram ouvidos a Moisés[a], e alguns homens deixaram uma parte daquilo até a manhã. Então surgiram vermes naquilo, e ficou com mau cheiro[b]; e Moisés ficou irado com eles.
  to: Mas eles não deram ouvidos a Moisés[a], e alguns homens deixaram parte dele até a manhã; surgiram vermes nele, e ele cheirou mal[b]. Moisés ficou irado com eles.
  rationale: 'A revisão corrige a nota b para refletir a ordem e o sentido dos dois verbos hebraicos: primeiro os vermes surgem; depois o maná cheira mal. Também substitui as repetições de “naquilo” por pronomes que retomam naturalmente o maná, preservando o sentido e a simplicidade narrativa.'
