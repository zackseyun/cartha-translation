base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: pt
  text: Mas eles não deram ouvidos a Moisés[a], e alguns homens deixaram parte dele até a manhã; surgiram vermes nele, e ele cheirou mal[b]. Moisés ficou irado com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deram atenção a Moisés”. O hebraico pode indicar uma recusa em escutar que implica desobediência.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “vermes surgiram nele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: deram ouvidos a Moisés
  rationale: A expressão portuguesa “dar ouvidos a” traduz naturalmente שׁמע com אֶל e conserva tanto a ideia de escutar quanto a implicação contextual de atender ao que foi dito, sem explicitar “obedecer” no texto principal.
- source_word: וַיּוֹתִרוּ
  choice: deixaram uma parte
  rationale: O hifil de יתר indica deixar algo restante ou de sobra. “Deixaram uma parte” comunica com clareza que retiveram uma porção do maná.
- source_word: אֲנָשִׁים
  choice: alguns homens
  rationale: Mantém o substantivo masculino plural e expressa naturalmente o sentido de um grupo indefinido dentro do povo.
- source_word: מִמֶּנּוּ
  choice: daquilo
  rationale: Retoma o maná mencionado no contexto; “uma parte daquilo” é idiomático em português e preserva a referência pronominal do hebraico.
- source_word: עַד בֹּקֶר
  choice: até a manhã
  rationale: Tradução temporal direta e natural do hebraico.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: surgiram vermes naquilo
  rationale: Conserva de perto a imagem hebraica de vermes que surgem, evitando explicar além do que o texto afirma.
- source_word: וַיִּבְאַשׁ
  choice: ficou com mau cheiro
  rationale: Expressa de modo claro e corrente o sentido de feder ou tornar-se malcheiroso, em registro digno e acessível.
- source_word: וַיִּקְצֹף
  choice: ficou irado
  rationale: Comunica a força do verbo de ira sem intensificá-lo para “enfureceu-se”.
- source_word: עֲלֵהֶם
  choice: com eles
  rationale: Com o adjetivo “irado”, a regência “com eles” é natural em português e representa adequadamente a relação expressa por עַל.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativo, com ampla legibilidade brasileira. A tradução mantém a coordenação simples do relato hebraico, mas divide a sequência em duas frases para fluidez. “Dar ouvidos” preserva a tensão entre escutar e obedecer; “alguns homens” mantém a forma masculina do original.
