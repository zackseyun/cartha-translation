  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: pt
  text: Ao entardecer, as codornizes vieram e cobriram o acampamento; pela manhã, havia uma camada de orvalho ao redor do acampamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Ao entardecer
  rationale: A construção narrativa introduz o acontecimento seguinte e seu momento. “Ao entardecer” é natural e conciso em português, sem reproduzir de modo rígido “e aconteceu”.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: as codornizes vieram
  rationale: שְׂלָו designa a codorniz e funciona coletivamente no hebraico; o plural é mais natural em português. Embora עלה tenha o sentido básico de “subir”, neste contexto “vieram” comunica com clareza o movimento das aves em direção ao acampamento.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: e cobriram o acampamento
  rationale: Mantém diretamente a imagem concreta do hebraico. O verbo fica no plural para concordar naturalmente com “as codornizes” em português.
- source_word: וּבַבֹּקֶר
  choice: pela manhã
  rationale: Expressa de modo idiomático a nova referência temporal na sequência narrativa.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: havia uma camada de orvalho
  rationale: שִׁכְבַת indica uma camada ou massa estendida. A construção existencial com “havia” é clara e natural em português.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: ao redor do acampamento
  rationale: Reproduz com precisão a localização circundante indicada pela expressão hebraica.
