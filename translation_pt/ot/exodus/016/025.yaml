  text: 'Então Moisés disse: “Comam isso hoje, porque hoje é sábado dedicado ao SENHOR; hoje vocês não o encontrarão no campo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: Comam isso
  rationale: O imperativo é plural e o sufixo retoma o maná; “isso” mantém a referência natural em português sem repetir o substantivo.
- source_word: כִּי
  choice: porque
  rationale: Expressa a razão para comer naquele dia, conforme o nexo causal do contexto.
- source_word: שַׁבָּת הַיּוֹם לַיהוָה
  choice: hoje é sábado dedicado ao SENHOR
  rationale: “Dedicado ao SENHOR” comunica de modo natural a relação indicada por לַיהוָה, preservando o caráter sagrado do sábado.
- source_word: לֹא תִמְצָאֻהוּ בַּשָּׂדֶה
  choice: vocês não o encontrarão no campo
  rationale: Preserva o plural do verbo e o pronome que retoma o maná.
- source_word: יהוה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consagrada de representar o Tetragrama em versaletes tipográficos, aqui indicado por maiúsculas.
theological_decisions:
- issue: Relação do sábado com YHWH
  choice: sábado dedicado ao SENHOR
  alternative: sábado para o SENHOR
  rationale: A formulação escolhida esclarece em português corrente a força relacional de לַיהוָה sem acrescentar uma definição denominacional do sábado.
translation_notes:
  register: Português moderno, claro e digno, com plural explícito em “Comam” e “vocês”. A repetição de “hoje” foi mantida por corresponder à ênfase do hebraico.
