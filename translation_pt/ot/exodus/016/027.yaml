  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: pt
  text: E aconteceu que, no sétimo dia, alguns do povo saíram para recolher, mas não encontraram nada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Fórmula narrativa que dá continuidade à sequência dos acontecimentos, preservada em português corrente e digno.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: Reproduz diretamente a expressão temporal hebraica, sem acrescentar “da semana”.
- source_word: יָצְאוּ
  choice: saíram
  rationale: Expressa naturalmente o movimento para fora do acampamento ou local de permanência.
- source_word: מִן הָעָם
  choice: alguns do povo
  rationale: O uso partitivo de מִן indica que apenas uma parte do povo saiu; esta formulação comunica isso de modo conciso.
- source_word: לִלְקֹט
  choice: para recolher
  rationale: O verbo לקט significa recolher ou apanhar; o objeto, o maná, permanece implícito como no hebraico e é claro pelo contexto.
- source_word: וְלֹא מָצָאוּ
  choice: mas não encontraram nada
  rationale: Embora a conjunção seja literalmente “e”, “mas” explicita naturalmente o contraste entre a intenção de recolher e o resultado frustrado; “nada” traduz em português idiomático o objeto implícito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e o objeto implícito do hebraico foram preservados; não se acrescentou “maná” nem “da semana”.
