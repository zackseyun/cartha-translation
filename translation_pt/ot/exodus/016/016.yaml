  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: pt
  text: '“Isto é o que Yahweh ordenou: ‘Recolham dele, cada um conforme o que come: um ômer por pessoa[a], conforme o número de pessoas de vocês. Cada um tomará para os que estão em sua tenda.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “por cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: Isto é o que ... ordenou
  rationale: A fórmula introduz o conteúdo de uma ordem. Em português, “Isto é o que ... ordenou” comunica naturalmente o sentido de דָּבָר sem impor aqui apenas uma de suas acepções possíveis (“palavra”, “coisa” ou “assunto”).
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: Recolham dele
  rationale: לקט indica recolher alimento disperso; o pronome retoma o maná mencionado no contexto.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: cada um conforme o que puder comer
  rationale: Preserva o valor distributivo de אִישׁ e expressa em português corrente o idiomatismo referente à quantidade que cada pessoa consegue consumir.
- source_word: עֹמֶר
  choice: ômer
  rationale: Trata-se de uma medida seca israelita específica; a transliteração evita uma equivalência moderna incerta.
- source_word: לַגֻּלְגֹּלֶת
  choice: por pessoa
  rationale: O sentido literal é “por cabeça”, empregado como modo de contar indivíduos. “Por pessoa” é a formulação natural em português, com a imagem literal registrada em nota.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: conforme o número de pessoas que vocês têm
  rationale: נֶפֶשׁ designa aqui pessoas contadas, não especificamente uma alma imaterial; a formulação também preserva a referência ao total sob a responsabilidade dos destinatários.
- source_word: אִישׁ לַאֲשֶׁר בְּאָהֳלוֹ תִּקָּחוּ
  choice: Cada um pegará o necessário para os que estiverem na sua tenda
  rationale: Mantém a distribuição individual e a imagem concreta da tenda. “O necessário” explicita o objeto elíptico à luz da quantidade de maná acabada de determinar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ no recenseamento doméstico
  choice: pessoas
  alternative: almas
  rationale: Neste contexto, o termo se refere aos indivíduos que devem receber uma porção; “almas” poderia sugerir indevidamente uma afirmação antropológica que o versículo não está fazendo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa plural. A sintaxe foi levemente reorganizada para soar natural sem perder a estrutura distributiva da ordem nem a imagem concreta da tenda.
