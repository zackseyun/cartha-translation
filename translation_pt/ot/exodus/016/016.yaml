revisions:
- from: '“Isto é o que Yahweh ordenou: ‘Recolham dele, cada um conforme o que puder comer: um ômer por pessoa[a], conforme o número de pessoas que vocês têm. Cada um pegará o necessário para os que estiverem na sua tenda.’”'
  to: '“Isto é o que Yahweh ordenou: ‘Recolham dele, cada um conforme o que come: um ômer por pessoa[a], conforme o número de pessoas de vocês. Cada um tomará para os que estão em sua tenda.’”'
  rationale: A revisão elimina a explicitação interpretativa “o necessário”, preservando a elipse do objeto no hebraico; ajusta a referência ao número de pessoas e traduz o particípio “os que estão” de modo mais direto. Mantêm-se o nome Yahweh, a medida ômer e a nota lexical ancorada em “pessoa”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:41Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a ordem de recolher o maná, a medida de um ômer por pessoa e a distribuição conforme os ocupantes de cada tenda. Contudo, “o necessário” introduz uma explicitação que não está no hebraico, cujo objeto de “tomar” permanece elíptico e retoma o maná. “Pessoas que vocês têm” também soa possessivo e menos direto do que a referência hebraica ao número de pessoas.
  naturalness: O português é claro e atual. A revisão torna o fechamento mais próximo da construção distributiva do hebraico e evita a expressão um tanto coloquial “pessoas que vocês têm”.
  terminology: “Yahweh”, “ômer” e “por pessoa”, com nota para o sentido literal de לַגֻּלְגֹּלֶת, são escolhas adequadas. “Por pessoa” não exige alteração; a nota preserva a imagem lexical de “cabeça”.
  issues:
  - severity: medium
    issue: “o necessário” foi acrescentado no fim do versículo.
    rationale: O hebraico diz literalmente que cada homem deve tomar para os que estão em sua tenda, deixando o objeto implícito pelo contexto (o maná). Embora a inferência seja evidente, “o necessário” transforma a elipse em uma formulação interpretativa.
  - severity: low
    issue: “o número de pessoas que vocês têm” é uma formulação possessiva e pouco direta.
    rationale: מִסְפַּר נַפְשֹׁתֵיכֶם se refere ao número de pessoas a serem consideradas na distribuição. “O número de pessoas de vocês” preserva a relação sem sugerir que as pessoas são possuídas.
  - severity: low
    issue: “os que estiverem” pode sugerir uma condição futura.
    rationale: O particípio hebraico descreve os que estão na tenda. “Os que estão” comunica mais diretamente essa referência.
  revised_text: '“Isto é o que Yahweh ordenou: ‘Recolham dele, cada um conforme o que come: um ômer por pessoa[a], conforme o número de pessoas de vocês. Cada um tomará para os que estão em sua tenda.’”'
  revised_footnotes:
