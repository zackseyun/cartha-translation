  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֥י אַקְשֶׁ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/הִרְבֵּיתִ֧י אֶת אֹתֹתַ֛/י וְ/אֶת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: pt
  text: Mas eu endurecerei o coração do faraó[a] e multiplicarei os meus sinais e as minhas maravilhas na terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornarei duro o coração do faraó” ou “tornarei obstinado o coração do faraó”. O verbo hebraico é causativo e apresenta diretamente o endurecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome explícito assinala contraste ou ênfase após a comissão anterior; “Mas eu” expressa isso naturalmente em português.
- source_word: אַקְשֶׁה
  choice: endurecerei
  rationale: 'O hifil de קשׁה é causativo: tornar duro, endurecer. A escolha preserva de modo conciso a ação direta expressa pelo hebraico.'
- source_word: לֵב פַּרְעֹה
  choice: o coração do faraó
  rationale: Mantém a imagem hebraica do coração, que pode abranger vontade e entendimento, sem interpretá-la no corpo do texto.
- source_word: וְהִרְבֵּיתִי
  choice: e multiplicarei
  rationale: A forma verbal, na sequência contextual, tem sentido futuro; “multiplicarei” preserva a relação lexical com רבה e soa natural com sinais e maravilhas.
- source_word: אֹתֹתַי
  choice: os meus sinais
  rationale: אוֹת designa normalmente um sinal; aqui se refere a atos que manifestam o poder e a mensagem de Deus.
- source_word: מוֹפְתַי
  choice: as minhas maravilhas
  rationale: מוֹפֵת pode significar maravilha ou prodígio. “Maravilhas” forma um par claro e tradicional com “sinais” sem restringir indevidamente o sentido.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Conserva o substantivo “terra”, explicitamente presente no hebraico, em formulação portuguesa natural.
theological_decisions:
- issue: Ação divina no endurecimento do coração do faraó
  choice: eu endurecerei o coração do faraó
  alternative: eu tornarei obstinado o coração do faraó; eu permitirei que o coração do faraó se endureça
  rationale: O hifil hebraico apresenta diretamente a ação causativa de Deus. A tradução conserva essa tensão teológica e não a atenua mediante uma paráfrase permissiva, que vai além do sentido direto da forma verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a imagem tradicional de “coração” e o paralelismo “sinais e maravilhas”, evitando explicar no texto principal aquilo que o hebraico deixa em tensão.
