lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “então” expressa essa sequência de modo natural em português.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção editorial de representar o nome divino YHWH por “SENHOR” em versaletes/maiúsculas.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz a fala que vem no versículo seguinte; em português atual, os dois-pontos cumprem naturalmente essa função, sem o calque pouco idiomático “dizendo”.
theological_decisions:
- issue: Representação do Tetragrama
  choice: SENHOR
  alternative: Yahweh
  rationale: “SENHOR” preserva a tradição de tradução adotada pela camada inglesa revisada e é amplamente reconhecível, sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Mantém explicitamente ambos os destinatários, Moisés e Arão, e usa pontuação para introduzir a fala subsequente.
