base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: pt
  text: Então o faraó também mandou chamar os sábios e os feiticeiros; e também eles, os magos do Egito, fizeram o mesmo por meio de seus encantamentos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de suas artes ocultas”. O termo hebraico pode designar artes ocultas ou encantamentos; seu sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: mandou chamar
  rationale: No contexto, קרא descreve a convocação de pessoas à presença do faraó; “mandou chamar” expressa isso com naturalidade em português.
- source_word: גַּם
  choice: também
  rationale: Indica que o faraó, por sua vez, reagiu ao sinal narrado anteriormente.
- source_word: חֲכָמִים
  choice: sábios
  rationale: Refere-se a homens instruídos ou especialistas da corte; “sábios” é claro e tradicional sem acrescentar uma função não explicitada.
- source_word: מְכַשְּׁפִים
  choice: feiticeiros
  rationale: O termo designa praticantes de feitiçaria e deve permanecer distinto de חַרְטֻמִּים, traduzido como “magos”.
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: fizeram o mesmo
  rationale: A expressão remete ao sinal anterior e é reproduzida de modo idiomático e fiel.
- source_word: גַם הֵם
  choice: eles também
  rationale: Preserva a ênfase de que os especialistas egípcios igualmente reproduziram o ato.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: os magos do Egito
  rationale: Identifica os especialistas rituais da corte egípcia e mantém a relação construta do hebraico.
- source_word: בְּלַהֲטֵיהֶם
  choice: por meio de seus encantamentos
  rationale: Expressa o meio empregado segundo o relato, sem definir se houve poder sobrenatural, ilusão ou fraude; “encantamentos” reflete adequadamente a provável nuance ocultista, embora o termo hebraico não seja inteiramente preciso.
theological_decisions:
- issue: Natureza do poder dos especialistas egípcios
  choice: Afirmar apenas que fizeram o mesmo por meio de seus encantamentos.
  alternative: Especificar que realizaram um milagre demoníaco real ou que recorreram somente a truques e ilusionismo.
  rationale: O hebraico relata a reprodução do ato e menciona o meio empregado, mas não explica seu mecanismo metafísico; a tradução preserva essa tensão sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mandou chamar” evita rigidez; “feiticeiros” e “magos” preservam a distinção lexical do hebraico. O ponto e vírgula organiza a frase sem recorrer a travessões.
