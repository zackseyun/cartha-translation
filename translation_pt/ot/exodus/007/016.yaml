  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: pt
  text: 'E você lhe dirá: “Yahweh, o Deus dos hebreus, enviou-me a você para dizer: ‘Deixe o meu povo ir, para que me sirva[a] no deserto’. Mas eis que, até agora, você não ouviu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me adore”. O verbo hebraico pode indicar serviço em sentido geral ou adoração em sentido religioso.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: o Deus dos hebreus
  rationale: Mantém a designação étnica específica do hebraico, sem substituí-la por 'israelitas'.
- source_word: שְׁלָחַנִי
  choice: enviou-me
  rationale: O perfeito hebraico indica o comissionamento já realizado; o pretérito perfeito é natural em português neste discurso relatado.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Deixe o meu povo ir
  rationale: Expressa de modo claro e idiomático a exigência de libertação contida no imperativo de שׁלח.
- source_word: וְיַעַבְדֻנִי
  choice: para que me sirva
  rationale: A construção comunica propósito, e 'servir' conserva a amplitude de עבד, que pode incluir culto sem se limitar a ele.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, 'deserto' é a forma natural para a região erma indicada por מִדְבָּר, sem exigir que se entenda apenas um mar de areia.
- source_word: וְהִנֵּה
  choice: Mas
  rationale: No contexto, a partícula chama atenção para o contraste com a ordem anterior. A adversativa transmite esse valor naturalmente; traduzir também por 'eis que' deixaria a frase mais marcada e menos corrente.
- source_word: לֹא שָׁמַעְתָּ
  choice: você não ouviu
  rationale: Preserva a formulação de שׁמע e sua tensão semântica entre ouvir e dar ouvidos/obedecer, evitando resolver implicitamente a expressão como 'não obedeceu'.
- source_word: עַד כֹּה
  choice: até agora
  rationale: Equivalente temporal direto e idiomático da expressão hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A fonte traz o nome divino, não um título. 'Yahweh' preserva essa distinção e corresponde à transliteração adotada.
- issue: Sentido de וְיַעַבְדֻנִי na fórmula da exigência do êxodo
  choice: me sirva
  alternative: me adore
  rationale: '''Servir'' conserva o alcance amplo do verbo hebraico, que neste contexto inclui serviço religioso e adoração, mas não precisa ser reduzido exclusivamente ao ato cultual.'
- issue: Sentido de לֹא שָׁמַעְתָּ
  choice: você não ouviu
  alternative: você não obedeceu; você não deu ouvidos
  rationale: A tradução mantém a polissemia do hebraico entre escutar, atender e obedecer, permitindo que o contexto comunique a recusa do faraó sem explicitá-la além da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta mantém a estrutura do hebraico sem rigidez excessiva; emprega-se 'você' para o singular, e a locução 'para dizer' introduz naturalmente a mensagem citada.
