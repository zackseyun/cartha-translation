  text: וַ/יִּמָּלֵ֖א שִׁבְעַ֣ת יָמִ֑ים אַחֲרֵ֥י הַכּוֹת יְהוָ֖ה אֶת הַ/יְאֹֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/025.yaml
  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: pt
  text: E passaram-se sete dias depois que Yahweh feriu o Nilo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E completaram-se sete dias depois que Yahweh feriu o Nilo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o Nilo”, às vezes traduzido de modo mais geral como “o rio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: completaram-se
  rationale: O nifal consecutivo de מלא indica que um período chegou ao fim. “Completaram-se” preserva o valor resultativo e soa natural em português.
- source_word: שִׁבְעַת יָמִים
  choice: sete dias
  rationale: Tradução direta da expressão numeral, que designa um período de sete dias.
- source_word: אַחֲרֵי
  choice: depois que
  rationale: Com o infinitivo הַכּוֹת, introduz uma relação temporal; em português, “depois que” seguido de verbo finito é claro e natural.
- source_word: הַכּוֹת
  choice: feriu
  rationale: O infinitivo construto de נכה descreve o golpe de Yahweh contra o Nilo. “Feriu” mantém o teor de juízo e evita linguagem arcaica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: הַיְאֹר
  choice: o Nilo
  rationale: No contexto do Êxodo, יְאֹר refere-se especificamente ao rio Nilo; a tradução explicita corretamente o referente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “completaram-se sete dias” conserva o aspecto resultativo do hebraico, enquanto as notas registram a alternativa mais idiomática e a possível tradução geral de יְאֹר.
