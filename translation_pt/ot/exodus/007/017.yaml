source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Com isto você saberá que eu sou Yahweh: eis que vou ferir, com o cajado que está em minha mão, as águas que estão no Nilo, e elas se transformarão em sangue.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula solene de mensageiro profético e traduz o nome divino como nome próprio.
- source_word: בְּזֹאת
  choice: Com isto
  rationale: O בְּ instrumental aponta para o sinal que servirá de meio para o reconhecimento de quem Yahweh é.
- source_word: תֵּדַע
  choice: você saberá
  rationale: O imperfeito tem valor futuro neste contexto. O singular corresponde à fala dirigida ao faraó.
- source_word: הִנֵּה אָנֹכִי מַכֶּה
  choice: eis que vou ferir
  rationale: A construção apresenta uma ação vívida e iminente. Em português atual, “vou ferir” comunica melhor essa iminência do que o progressivo literal “estou ferindo”.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: com o cajado que está em minha mão
  rationale: “Cajado” é uma equivalência natural de מַטֶּה neste contexto, e a oração relativa conserva a ênfase hebraica no instrumento empunhado.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: as águas que estão no Nilo
  rationale: Embora עַל possa ser traduzido por “sobre” ou “contra”, o verbo “ferir” admite objeto direto de modo natural em português. יְאֹר designa especificamente o Nilo no contexto do Êxodo.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: e elas se transformarão em sangue
  rationale: Mantém o plural hebraico que concorda com “águas” e expressa o resultado transformativo da forma nifal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e a autoidentificação repetida no versículo, sem substituí-lo por um título.
- issue: Agente da ação de ferir as águas
  choice: 'Preservar a primeira pessoa divina: “vou ferir”'
  alternative: Explicitar Moisés como agente humano
  rationale: A fala citada atribui gramaticalmente a ação a Yahweh, embora o cajado seja empunhado no desenrolar narrativo por Moisés ou Arão. A tradução não resolve essa tensão entre agência divina e instrumento humano.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “eis que” pelo destaque retórico, “águas” no plural conforme o hebraico e a repetição de “Yahweh” por sua importância literária e teológica.
