    issue: A expressão “na sua cama” não preserva a preposição על.
    rationale: O hebraico diz literalmente que as rãs virão “sobre” a cama. Embora “na cama” seja idiomático, a formulação perde a localização explícita e a imagem de invasão da cama.
  - severity: low
    issue: A alternativa de nota “gamelas de amassar” especifica mais o formato do recipiente do que o hebraico permite com segurança.
    rationale: Uma alternativa genérica, como “recipientes para amassar massa”, comunica a incerteza lexical sem restringir o objeto a uma gamela.
  revised_text: O Nilo fervilhará de rãs. Elas subirão e entrarão na sua casa, no seu quarto e sobre a sua cama, nas casas dos seus servos, no meio do seu povo, nos seus fornos e nas suas vasilhas de amassar[a].
  revised_footnotes:
