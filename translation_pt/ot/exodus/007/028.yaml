base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: pt
  text: O Nilo fervilhará de rãs. Elas subirão e entrarão na sua casa, no seu quarto e sobre a sua cama, nas casas dos seus servos, no meio do seu povo, nos seus fornos e nas suas vasilhas de amassar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recipientes para amassar massa”.
    reason: O termo hebraico designa recipientes usados no preparo da massa, mas não determina com segurança seu formato.
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: fervilhará
  rationale: O verbo שׁרץ retrata grande quantidade de pequenos seres em movimento. “Fervilhará” conserva a imagem vívida e rege naturalmente “de rãs” em português.
- source_word: הַיְאֹר
  choice: O Nilo
  rationale: No contexto egípcio de Êxodo, יְאֹר designa especificamente o rio Nilo, não um rio indeterminado.
- source_word: צְפַרְדְּעִים
  choice: rãs
  rationale: Equivalente português direto do substantivo hebraico no plural.
- source_word: וְעָלוּ
  choice: subirão
  rationale: עלה descreve o movimento das rãs para cima, saindo do Nilo em direção à terra e às habitações.
- source_word: וּבָאוּ
  choice: entrarão
  rationale: בוא, seguido das expressões locativas introduzidas por ב, indica a entrada das rãs nos diversos lugares enumerados.
- source_word: בְּבֵיתֶךָ
  choice: na sua casa
  rationale: Aqui בַּיִת se refere à residência física do faraó, como mostra a sequência de espaços domésticos.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: no seu quarto
  rationale: A expressão significa literalmente “no aposento do seu repouso”; “quarto” é o equivalente moderno, claro e natural.
- source_word: וְעַל מִטָּתֶךָ
  choice: na sua cama
  rationale: Embora עַל tenha o sentido literal de “sobre”, em português “na sua cama” expressa de modo idiomático a invasão da própria cama.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: nas casas dos seus servos
  rationale: 'O singular construto בֵית com o plural “seus servos” tem sentido distributivo: as respectivas casas dos servos.'
- source_word: וּבְעַמֶּךָ
  choice: no meio do seu povo
  rationale: A preposição ב com um grupo humano é representada naturalmente por “no meio de”, evitando a impressão de que as rãs entram fisicamente dentro das pessoas.
- source_word: וּבְתַנּוּרֶיךָ
  choice: nos seus fornos
  rationale: תַּנּוּר designa fornos domésticos usados para assar.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: nas suas vasilhas de amassar
  rationale: מִשְׁאֶרֶת designa recipientes em que se preparava ou amassava a massa. “Vasilhas de amassar” é claro para leitores modernos sem especificar indevidamente formato ou tamanho.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição hebraica das preposições foi preservada de modo natural, e a mudança de frase após “rãs” evita um período excessivamente carregado sem alterar a progressão do anúncio.
