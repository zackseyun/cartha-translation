review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz corretamente o anúncio, o Nilo, as rãs, sua subida e a sequência de espaços atingidos. Contudo, וְעַל מִטָּתֶךָ significa explicitamente “e sobre a sua cama”; “na sua cama” atenua a preposição hebraica e deve ser corrigido.
  naturalness: O português é moderno, claro e adequado a leitores brasileiros e internacionais. “Fervilhará de rãs”, “no meio do seu povo” e “vasilhas de amassar” são naturais. “Sobre a sua cama” permanece inteiramente idiomático neste contexto.
  terminology: “Nilo”, “rãs”, “servos”, “fornos” e “vasilhas de amassar” são escolhas adequadas. A nota deve oferecer uma alternativa que não imponha um formato específico ao recipiente, pois o termo hebraico não o define com precisão.
  issues:
