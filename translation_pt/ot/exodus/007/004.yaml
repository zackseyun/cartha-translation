source:
  edition: WLC
  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: pt
  text: O faraó não dará ouvidos a vocês, e eu porei a minha mão sobre o Egito e tirarei da terra do Egito as minhas tropas — o meu povo, os filhos de Israel — por meio de grandes atos de juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com grandes juízos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: dará ouvidos a vocês
  rationale: שׁמע com אֶל significa aqui escutar ou atender. A expressão portuguesa comunica a recusa em acolher a mensagem sem explicitar além do texto a ideia de obedecer.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרַיִם
  choice: porei a minha mão sobre o Egito
  rationale: Preserva de perto a expressão hebraica de intervenção divina decisiva e evita introduzir o verbo 'estender', que não ocorre neste versículo.
- source_word: צִבְאֹתַי
  choice: as minhas tropas
  rationale: צָבָא pode indicar exército, hoste ou corpo organizado. 'Tropas' mantém a imagem corporativa e militar, mas no contexto designa o povo organizado que Deus fará sair.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: o meu povo, os filhos de Israel
  rationale: Mantém a aposição do hebraico e a expressão genealógica literal, em português corrente e reconhecível.
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: por meio de grandes atos de juízo
  rationale: O plural שְׁפָטִים refere-se, neste contexto, a ações judiciais executadas contra o Egito. 'Atos de juízo' torna explícito o valor concreto sem perder a dimensão judicial.
theological_decisions:
- issue: Designação de Israel como צִבְאֹתַי
  choice: as minhas tropas
  alternative: os meus exércitos; as minhas hostes; os meus contingentes
  rationale: A escolha preserva a imagem de grupos organizados sob a autoridade de Deus sem afirmar que todo o povo já constituía um exército combatente.
- issue: Forma de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A forma familiar do hebraico foi preservada porque identifica o povo em termos genealógicos e pactuais; as alternativas mais idiomáticas reduziriam essa imagem.
- issue: Sentido de בִּשְׁפָטִים גְּדֹלִים
  choice: por meio de grandes atos de juízo
  alternative: com grandes juízos
  rationale: A tradução expressa que a saída será realizada mediante intervenções judiciais de Deus, sem decidir de modo indevido entre sentença e sua execução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural 'vocês' corresponde aos destinatários Moisés e Arão. A ordem da oração foi levemente ajustada para fluência, sem alterar as relações sintáticas principais.
