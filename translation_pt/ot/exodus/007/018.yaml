  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: pt
  text: Os peixes que estão no Nilo[a] morrerão, o Nilo ficará com mau cheiro, e os egípcios não conseguirão[b] beber água do Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o rio”; neste contexto, refere-se especificamente ao Nilo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficarão exaustos ao tentar beber água do Nilo”. O verbo hebraico pode indicar cansaço ou esgotamento que resulta em incapacidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: os peixes
  rationale: O substantivo hebraico singular tem sentido coletivo. “Os peixes” é a forma mais natural e clara de expressá-lo em português.
- source_word: יְאֹר
  choice: Nilo
  rationale: Embora o termo possa significar “rio”, em Êxodo ele se refere especificamente ao Nilo; explicitar o nome torna o referente claro sem alterar o sentido contextual.
- source_word: תָּמוּת
  choice: morrerão
  rationale: Tradução direta do verbo מות, com concordância natural com o coletivo vertido no plural em português.
- source_word: וּבָאַשׁ
  choice: ficará malcheiroso
  rationale: O verbo באש indica tornar-se fétido ou exalar mau cheiro. A formulação mantém o sentido concreto e é natural em português atual.
- source_word: וְנִלְאוּ
  choice: não conseguirão
  rationale: No nifal, לאה pode expressar cansaço ou esgotamento que resulta em incapacidade. Neste contexto, “não conseguirão” comunica de modo claro o resultado prático, enquanto a nota preserva a nuance de exaustão.
- source_word: לִשְׁתּוֹת מַיִם
  choice: beber água
  rationale: Mantém o objeto explícito do hebraico e enfatiza a perda de uma fonte de água potável.
- source_word: מִן הַיְאֹר
  choice: do Nilo
  rationale: Forma idiomática e precisa em português para indicar a origem da água.
