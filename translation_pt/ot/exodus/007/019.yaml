  to: 'Então Yahweh disse a Moisés: “Diga a Arão: ‘Pegue o seu cajado e estenda a mão sobre as águas do Egito — sobre os seus rios, os seus canais do Nilo, as suas lagoas e toda acumulação de suas águas — para que se tornem sangue. Haverá sangue por toda a terra do Egito, até nos recipientes de madeira e de pedra[a].’”'
