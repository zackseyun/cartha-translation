  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Diga a Arão: ‘Pegue o seu cajado e estenda a mão sobre as águas do Egito — sobre os seus rios, os seus canais do Nilo, as suas lagoas e toda acumulação de suas águas — para que se tornem sangue. Haverá sangue por toda a terra do Egito, até nos recipientes de madeira e de pedra[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “e na madeira e na pedra”; provavelmente uma referência a recipientes feitos desses materiais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: מַטְּךָ
  choice: o seu cajado
  rationale: “Cajado” é uma forma concreta, corrente e adequada ao instrumento empregado na narrativa.
- source_word: וּנְטֵה יָדְךָ
  choice: estenda a mão
  rationale: Reproduz naturalmente o gesto simbólico expresso pelo idioma hebraico.
- source_word: מֵימֵי מִצְרַיִם
  choice: as águas do Egito
  rationale: Mantém a construção abrangente, posteriormente especificada pela enumeração das diversas águas.
- source_word: נַהֲרֹתָם
  choice: os seus rios
  rationale: Traduz o termo geral para rios ou correntes de água e o distingue do termo egípcio seguinte.
- source_word: יְאֹרֵיהֶם
  choice: os seus canais do Nilo
  rationale: No contexto egípcio, o termo designa cursos de água ligados ao Nilo; a tradução explicita essa referência e o distingue de “rios”.
- source_word: אַגְמֵיהֶם
  choice: as suas lagoas
  rationale: Expressa de modo claro e atual águas paradas ou represadas, sem restringir indevidamente o termo a pântanos.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: todos os lugares onde suas águas se acumulam
  rationale: Comunica em português natural a ideia de toda reunião ou acumulação de água, sem limitar o texto a reservatórios construídos.
- source_word: וְיִהְיוּ דָם
  choice: para que se tornem sangue
  rationale: A construção apresenta o resultado pretendido das ordens anteriores; “para que” transmite essa relação com clareza.
- source_word: וְהָיָה דָם בְּכָל אֶרֶץ מִצְרַיִם
  choice: Haverá sangue por toda a terra do Egito
  rationale: Expressa de forma idiomática tanto a condição resultante quanto sua extensão por toda a terra.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: até nos recipientes de madeira e de pedra
  rationale: Entende os materiais como referência metonímica a recipientes que continham água. “Até” destaca a extensão surpreendente da praga, enquanto a leitura estritamente literal é preservada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no hebraico e evita substituí-lo por um título.
- issue: Sentido da expressão וּבָעֵצִים וּבָאֲבָנִים
  choice: recipientes de madeira e de pedra
  alternative: na madeira e na pedra
  rationale: O contexto trata da água em todo o Egito, de modo que a expressão provavelmente usa os materiais para designar recipientes. Como o hebraico é elíptico, a formulação literal permanece registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de ampla compreensão internacional e boa legibilidade brasileira. A enumeração mantém as distinções lexicais do hebraico sem recorrer a formulações excessivamente técnicas.
