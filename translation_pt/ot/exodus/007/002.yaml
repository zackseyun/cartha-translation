source:
  edition: WLC
  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: pt
  text: Você dirá tudo o que eu lhe ordenar, e Arão, seu irmão, falará ao faraó, para que ele deixe os filhos de Israel[a] sair da sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: Você dirá
  rationale: O piel de דבר tem aqui o sentido direto de falar. O futuro em português preserva a força de instrução e mantém o paralelismo com o verbo atribuído a Arão.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: tudo o que eu lhe ordenar
  rationale: A formulação expressa de modo natural e abrangente a totalidade das instruções divinas; o futuro do subjuntivo corresponde bem ao caráter continuado ou prospectivo da ordem.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Arão, seu irmão
  rationale: Conserva a ordem do hebraico e soa natural em português, com a aposição devidamente marcada por vírgulas.
- source_word: יְדַבֵּר אֶל פַּרְעֹה
  choice: falará ao faraó
  rationale: Traduz diretamente דבר com אֶל sem especificar além do texto o conteúdo exato da fala.
- source_word: וְשִׁלַּח
  choice: para que ele deixe ... sair
  rationale: O piel de שׁלח neste contexto significa permitir a partida ou libertar. A construção final preserva a relação pretendida entre a fala de Arão e a saída de Israel sem apresentar a reação do faraó como resultado garantido.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão hebraica literalmente e preserva a textura genealógica do nome coletivo; a alternativa idiomática é indicada em nota.
- source_word: מֵאַרְצוֹ
  choice: da sua terra
  rationale: A preposição מִן indica movimento para fora ou afastamento, e 'da sua terra' expressa isso de maneira concisa. No contexto, o possessivo remete ao faraó.
theological_decisions:
- issue: Relação entre a fala de Arão e a libertação de Israel
  choice: para que ele deixe
  alternative: e ele deixará
  rationale: A tradução final evita transformar a construção hebraica em promessa categórica de obediência imediata do faraó, preservando a tensão narrativa e a nuance de propósito ou resultado pretendido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você' por naturalidade contemporânea, 'faraó' em minúscula como título e conserva 'filhos de Israel' para refletir a forma do hebraico.
