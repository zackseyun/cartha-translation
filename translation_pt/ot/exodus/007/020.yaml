  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: pt
  text: Moisés e Arão fizeram assim, exatamente como Yahweh havia ordenado. Ele ergueu o cajado e feriu a água do Nilo[a] diante dos olhos do faraó e dos olhos de seus servos, e toda a água do Nilo se transformou em sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o rio”; em Êxodo, esse termo geralmente se refere especificamente ao Nilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram assim
  rationale: Expressa de modo natural a obediência à instrução anterior e conserva o advérbio hebraico כֵן.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: exatamente como ... havia ordenado
  rationale: Preserva a força comparativa da expressão e usa o mais-que-perfeito composto para indicar que a ordem precedeu a ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּרֶם
  choice: Ele ergueu
  rationale: Reproduz o verbo no singular sem identificar explicitamente o agente, preservando a referência pronominal implícita e potencialmente ambígua do hebraico.
- source_word: בַּמַּטֶּה
  choice: o cajado
  rationale: Termo moderno e claro para מַטֶּה neste contexto narrativo.
- source_word: וַיַּךְ אֶת הַמַּיִם
  choice: feriu a água
  rationale: Mantém o sentido de golpear de נכה; o singular coletivo 'a água' é idiomático em português.
- source_word: הַיְאֹר
  choice: o Nilo
  rationale: Em Êxodo, יְאֹר designa normalmente o rio Nilo; a nota registra a forma lexical mais geral.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: diante dos olhos ... e dos olhos
  rationale: Conserva a repetição enfática do hebraico e destaca o caráter público do sinal.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Traduz diretamente o termo sem especificar uma posição oficial que o hebraico não explicita.
- source_word: וַיֵּהָפְכוּ כָּל הַמַּיִם
  choice: toda a água ... se transformou
  rationale: Usa uma construção portuguesa natural com substantivo coletivo, preservando a mudança resultante expressa pelo hebraico.
- source_word: לְדָם
  choice: em sangue
  rationale: A expressão 'transformar-se em sangue' verte naturalmente a construção hebraica de resultado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto apresenta diretamente o tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Identidade do sujeito singular em וַיָּרֶם e וַיַּךְ
  choice: Ele
  alternative: Arão
  rationale: Embora o contexto anterior favoreça Arão como agente que empunha o cajado, o hebraico deste versículo emprega apenas verbos singulares sem nomear o sujeito. O pronome preserva essa tensão em vez de resolvê-la no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição 'diante dos olhos ... e dos olhos' foi mantida por sua função enfática, apesar de uma formulação mais curta ser possível em português.
