  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: pt
  text: Mas o coração do faraó se endureceu[a], e ele não os ouviu, conforme Yahweh havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o coração do faraó ficou obstinado”. O verbo hebraico significa mais literalmente “tornou-se forte/firme”, aqui com o sentido de endurecimento ou obstinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: se endureceu
  rationale: O verbo חזק está no qal e não explicita um agente externo; neste contexto, descreve o coração tornando-se firme ou obstinado. A forma pronominal é natural em português e evita impor uma agência que o versículo não declara.
- source_word: לֵב פַּרְעֹה
  choice: o coração do faraó
  rationale: Mantém a imagem hebraica do coração como centro da vontade e do entendimento; “faraó” funciona naturalmente como título em minúscula.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: e ele não os ouviu
  rationale: שׁמע com אֶל pode significar ouvir, escutar ou dar ouvidos. “Não os ouviu” é claro e conserva a possível nuance tanto de escuta quanto de obediência.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa a correspondência entre o acontecimento narrado e a declaração anterior de Yahweh de modo natural e digno.
- source_word: דִּבֶּר
  choice: havia dito
  rationale: O mais-que-perfeito composto deixa clara, em português corrente, a anterioridade da fala divina em relação ao acontecimento narrado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Agência no endurecimento do coração do faraó
  choice: “o coração do faraó se endureceu”, sem indicar um agente externo
  alternative: “o coração do faraó foi endurecido” ou “o faraó endureceu o coração”
  rationale: A forma hebraica é ativa/intransitiva e afirma que o coração se tornou forte, firme ou obstinado, sem nomear aqui quem causou isso. A tradução preserva a tensão teológica existente nas diversas passagens do Êxodo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita linguagem excessivamente arcaica e preserva a imagem hebraica e a ambiguidade quanto à agência.
