  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: pt
  text: Moisés e Arão fizeram exatamente como Yahweh lhes havia ordenado[a]; assim fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Leitura tradicional alternativa para o nome divino.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fizeram
  rationale: O verbo עשה tem o sentido amplo de “fazer”. Aqui descreve o cumprimento de uma ordem e permite preservar a repetição verbal do hebraico.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Formas tradicionais e amplamente reconhecidas em português para os nomes próprios.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Expressa com naturalidade a correspondência entre a ordem dada e a ação realizada, reforçada pela cláusula final.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: צוה indica dar uma ordem. O mais-que-perfeito composto torna explícita, em português corrente, a anterioridade da ordem em relação ao cumprimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֹתָם
  choice: lhes
  rationale: Embora marque o objeto direto de “ordenar” no hebraico, o pronome indireto é a construção idiomática em português com “ordenar”, referindo-se a Moisés e Arão.
- source_word: כֵּן עָשׂוּ
  choice: assim fizeram
  rationale: Preserva a retomada enfática do verbo עשה e o sentido de que agiram em conformidade com a ordem.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal mediante transliteração, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais reconhecíveis no Brasil e no espaço lusófono. A repetição final do hebraico foi mantida, apesar de soar enfática, porque destaca a obediência exata de Moisés e Arão.
