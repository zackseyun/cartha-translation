  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: pt
  text: Vá até o faraó pela manhã. Veja, ele está saindo em direção à água. Fique à espera dele à margem do Nilo[a] e leve na mão o cajado que se transformou em serpente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do rio”. Em Êxodo, o hebraico יְאֹר geralmente se refere especificamente ao Nilo.
    reason: lexical_alternative
  - marker: b
    text: Ou “cobra”. O hebraico נָחָשׁ pode ser traduzido por “serpente” ou “cobra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: Vá até o faraó
  rationale: O imperativo de הלך seguido de אֶל expressa uma ordem direta de ir ao encontro do faraó; “vá até” é natural e preciso em português.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Expressa de modo corrente a circunstância temporal do hebraico.
- source_word: הִנֵּה יֹצֵא הַמַּיְמָה
  choice: Ele estará saindo em direção às águas
  rationale: הִנֵּה introduz uma circunstância que Moisés deve ter em vista, e o particípio יֹצֵא apresenta a ação esperada ou em curso. A terminação direcional de הַמַּיְמָה indica movimento rumo às águas. Em português, o futuro perifrástico transmite isso naturalmente sem exigir um interjeitivo artificial.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: Coloque-se diante dele
  rationale: O nifal de יצב indica tomar posição, e לִקְרָאתוֹ sugere posicionar-se para encontrá-lo. A formulação preserva tanto a postura deliberada como o encontro iminente.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: à margem do Nilo
  rationale: שָׂפָה designa a margem ou borda; no contexto do Êxodo, יְאֹר refere-se especificamente ao Nilo.
- source_word: וְהַמַּטֶּה ... תִּקַּח בְּיָדֶךָ
  choice: e leve na mão o cajado
  rationale: O imperfeito tem força injuntiva na sequência de ordens. “Leve na mão” conserva a expressão concreta hebraica e soa mais natural do que uma reprodução rígida de “tome em sua mão”.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: que se transformou em serpente
  rationale: O nifal de הפך pode ser expresso naturalmente como “se transformou”. “Serpente” mantém um registro digno e corresponde ao sentido de נָחָשׁ, sem acrescentar especificidade zoológica.
theological_decisions:
- issue: Referente de יְאֹר
  choice: Nilo
  alternative: rio
  rationale: Em Êxodo, יְאֹר é o termo usado para o Nilo no cenário egípcio. A forma específica esclarece o referente histórico sem introduzir interpretação doutrinária.
- issue: Descrição da transformação do cajado
  choice: se transformou em serpente
  alternative: foi transformado em serpente
  rationale: O nifal נֶהְפַּךְ permite uma formulação de mudança de estado sem explicitar o agente. “Se transformou” preserva essa não explicitação; a alternativa passiva poderia salientar um agente implícito além da forma imediata da oração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Evitou-se o arcaísmo “eis que”; a força contextual de הִנֵּה foi integrada à frase. Os dois marcadores das notas aparecem no texto principal junto aos termos correspondentes.
