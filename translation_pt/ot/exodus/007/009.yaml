revisions:
- from: 'Quando o faraó disser a vocês: “Apresentem um sinal da parte de vocês”, você dirá a Arão: “Pegue o seu cajado e lance-o diante do faraó; que ele se torne uma serpente[a]”.'
  to: 'Quando o faraó disser a vocês: “Apresentem um sinal”, você dirá a Arão: “Pegue o seu cajado e lance-o diante do faraó; que ele se torne uma serpente[a]”.'
  rationale: A revisão elimina a interpretação de procedência introduzida por «da parte de vocês», mantendo uma formulação portuguesa natural para a exigência de produzir um sinal. Também torna a alternativa da nota lexicalmente mais específica, sem fechar o sentido discutido de tannín.
