base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: pt
  text: 'Quando o faraó disser a vocês: “Apresentem um sinal”, você dirá a Arão: “Pegue o seu cajado e lance-o diante do faraó; que ele se torne uma serpente[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dragão”. O termo hebraico tannín pode designar uma serpente, uma criatura aquática ou uma criatura semelhante a um dragão, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יְדַבֵּר
  choice: Quando ... disser
  rationale: A construção introduz uma circunstância futura prevista nas instruções; “quando” e o futuro do subjuntivo são naturais em português.
- source_word: אֲלֵיכֶם
  choice: a vocês
  rationale: Preserva o plural hebraico, pois o faraó se dirige a Moisés e Arão.
- source_word: תְּנוּ לָכֶם מוֹפֵת
  choice: Apresentem um sinal da parte de vocês
  rationale: Expressa de modo natural a exigência de fornecer ou produzir um sinal, sem apagar por completo a nuance reflexiva de לָכֶם.
- source_word: וְאָמַרְתָּ אֶל אַהֲרֹן
  choice: você dirá a Arão
  rationale: O singular mostra que a instrução se dirige especificamente a Moisés, e o futuro comunica a sequência ordenada.
- source_word: מַטְּךָ
  choice: o seu cajado
  rationale: “Cajado” é atual, claro e adequado ao objeto levado por Arão.
- source_word: וְהַשְׁלֵךְ לִפְנֵי פַרְעֹה
  choice: lance-o diante do faraó
  rationale: Mantém a ação de arremessar e a linguagem digna da cena oficial, sem tom arcaico excessivo.
- source_word: יְהִי
  choice: que ele se torne
  rationale: Preserva a força volitiva do jussivo, apresentando a transformação como resultado ordenado.
- source_word: תַנִּין
  choice: serpente
  rationale: No contexto da transformação do cajado, “serpente” é uma leitura plausível e compreensível; uma nota preserva a amplitude semântica do termo hebraico.
theological_decisions:
- issue: Sentido de תַנִּין no sinal do cajado
  choice: serpente
  alternative: monstro, grande réptil ou criatura semelhante a um dragão
  rationale: O contexto favorece uma criatura serpentiforme, mas o termo hebraico é mais amplo que a palavra comum para cobra e pode designar outras criaturas grandes ou temíveis. A nota mantém essa ambiguidade lexical sem impor uma identificação precisa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “a vocês” e o singular “você dirá” reproduzem a mudança de número presente no hebraico. O marcador [a] está ligado diretamente a “serpente”, termo ao qual a nota se refere.
