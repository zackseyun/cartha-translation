  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ הִנֵּ֣ה אָנֹכִ֗י נֹגֵ֛ף אֶת כָּל גְּבוּלְ/ךָ֖ בַּֽ/צְפַרְדְּעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/027.yaml
  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: pt
  text: Mas, se você se recusar a deixá-los partir, eis que vou ferir todo o seu território com rãs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, se você se recusar a deixá-los partir, eis que ferirei toda a sua terra com rãs.” O particípio hebraico pode indicar uma ação iminente (“vou ferir”) ou ser traduzido pelo futuro simples (“ferirei”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção seguida da partícula condicional introduz uma condição em contraste com a ordem anterior; “Mas, se” expressa essa relação com naturalidade.
- source_word: מָאֵן
  choice: se recusar
  rationale: O verbo indica recusa deliberada, e não mera incapacidade ou hesitação.
- source_word: לְשַׁלֵּחַ
  choice: deixá-los partir
  rationale: No contexto do êxodo, o infinitivo se refere a libertar os israelitas para que partam; a formulação é clara e idiomática em português.
- source_word: הִנֵּה
  choice: eis que
  rationale: A partícula chama solenemente a atenção para o juízo iminente, preservando o tom elevado da advertência.
- source_word: אָנֹכִי
  choice: vou
  rationale: A primeira pessoa explícita está incorporada na locução verbal portuguesa; o contexto mantém o destaque no próprio Deus como agente.
- source_word: נֹגֵף
  choice: vou ferir
  rationale: O particípio com הִנֵּה pode apresentar a ação como iminente ou como futuro anunciado. “Vou ferir” comunica a proximidade sem excluir o valor futuro, enquanto “ferir” preserva a imagem de um golpe de juízo.
- source_word: כָּל גְּבוּלְךָ
  choice: todo o seu território
  rationale: גְּבוּל designa aqui toda a extensão do domínio do faraó, não apenas sua linha de fronteira.
- source_word: בַּצְפַרְדְּעִים
  choice: com rãs
  rationale: A preposição indica o meio ou instrumento pelo qual o território será atingido; “com rãs” é a expressão natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por “você” evita uma flexão de segunda pessoa pouco corrente no português brasileiro, sem tornar a fala informal. A nota preserva as ambiguidades genuínas da conjunção, do aspecto verbal e do alcance lexical de גְּבוּל.
