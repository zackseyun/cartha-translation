base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/023.yaml
  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: pt
  text: O faraó virou-se, entrou em sua casa e nem mesmo isso levou a sério.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não pôs o coração nem mesmo nisso” ou “não deu atenção nem mesmo a isso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: virou-se
  rationale: O verbo פנה indica que o faraó se virou ou se afastou. “Virou-se” preserva de modo conciso o movimento narrativo sem explicitar uma direção que o hebraico não determina.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma consagrada em português para o título do soberano egípcio; o artigo definido é natural neste contexto narrativo.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: entrou em seu palácio
  rationale: בוא com אֶל expressa movimento para dentro ou em direção à residência. Embora בַּיִת signifique literalmente “casa”, no caso do faraó “palácio” comunica naturalmente sua residência oficial, enquanto “entrou” preserva a ideia de ingresso.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: mas ... não levou a sério
  rationale: A expressão idiomática שׁית לב descreve dar atenção ou consideração séria a algo. “Não levou a sério” é claro e atual em português, embora não reproduza literalmente a imagem do coração.
- source_word: גַּם לָזֹאת
  choice: nem mesmo isso
  rationale: גַּם tem aqui força inclusiva ou enfática, e לָזֹאת aponta para o sinal ou juízo recém-narrado. “Nem mesmo isso” expressa naturalmente que o acontecimento não o levou a reagir.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A tradução principal verte idiomaticamente a expressão hebraica ligada ao coração; a nota preserva sua forma mais literal e a alternativa semântica. O ponto e vírgula evita uma sequência excessivamente coordenada, e “mas” explicita o contraste já natural no contexto.
