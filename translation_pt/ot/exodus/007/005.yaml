source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: pt
  text: E os egípcios saberão que eu sou Yahweh[a], quando eu estender a minha mão contra o Egito e tirar os filhos de Israel[b] do meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino YHWH, tradicionalmente traduzido por “SENHOR” em muitas versões.
    reason: alternative_reading
  - marker: b
    text: Ou “os israelitas” ou “os descendentes de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E ... saberão
  rationale: O perfeito qal com conjunção, neste contexto preditivo, aponta para um acontecimento futuro. “Saberão” preserva de modo direto a fórmula de reconhecimento.
- source_word: מִצְרַיִם
  choice: os egípcios / o Egito
  rationale: Na primeira ocorrência, o plural verbal indica o povo, por isso “os egípcios”; após עַל, o referente é a terra ou nação atingida, por isso “o Egito”.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo do conhecimento dos egípcios: eles saberão que o falante é Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בִּנְטֹתִי
  choice: quando eu estender
  rationale: A preposição בְּ com o infinitivo construto tem valor temporal neste contexto. “Estender a mão” conserva a imagem concreta hebraica.
- source_word: יָדִי
  choice: a minha mão
  rationale: Mantém a imagem antropomórfica do texto, que comunica a ação e o poder divinos sem substituir “mão” por uma explicação.
- source_word: עַל מִצְרָיִם
  choice: contra o Egito
  rationale: No contexto de juízo, עַל indica ação adversa; “contra” é natural e semanticamente adequado.
- source_word: וְהוֹצֵאתִי
  choice: e tirar
  rationale: 'O hifil de יצא é causativo: fazer sair. Coordenado com a oração temporal anterior, o infinitivo português produz uma construção natural: “quando eu estender... e tirar...”.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar masculina do hebraico e é corrente na linguagem bíblica portuguesa.
- source_word: מִתּוֹכָם
  choice: do meio deles
  rationale: Expressa naturalmente a retirada dos israelitas de entre os egípcios, conservando a referência pronominal masculina plural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto contém o nome pessoal divino. “Yahweh” o apresenta como nome, sem substituí-lo pelo título “SENHOR”; a nota informa a prática tradicional e a forma hebraica.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel; os filhos e filhas de Israel
  rationale: “Filhos de Israel” mantém a forma familiar e gramatical do hebraico sem ampliar nem restringir explicitamente o referente; a nota registra alternativas naturais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador siga imediatamente a expressão comentada. Conservam-se a imagem da mão estendida, o nome divino e a expressão familiar “filhos de Israel”.
