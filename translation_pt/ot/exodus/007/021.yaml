base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: pt
  text: Os peixes que estavam no Nilo morreram, e o Nilo ficou com mau cheiro, de modo que os egípcios não podiam beber da água do Nilo. E havia sangue por toda a terra do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּגָה
  choice: os peixes
  rationale: O substantivo singular coletivo se refere aos peixes do rio; o plural é a forma natural de preservar esse sentido em português.
- source_word: יְאֹר
  choice: Nilo
  rationale: Embora o termo possa significar rio ou canal, no contexto de Êxodo designa especificamente o Nilo; explicitar o referente produz uma tradução clara e historicamente adequada.
- source_word: מֵתָה
  choice: morreram
  rationale: Traduz diretamente a forma verbal e concorda naturalmente em português com o coletivo vertido como “os peixes”.
- source_word: וַיִּבְאַשׁ
  choice: começou a cheirar mal
  rationale: Expressa de modo corrente o desenvolvimento do mau cheiro indicado pelo verbo, sem recorrer ao coloquial “fedeu” nem ao menos acessível “tornou-se fétido”.
- source_word: וְלֹא יָכְלוּ
  choice: não podiam
  rationale: Forma idiomática que comunica a incapacidade dos egípcios no contexto narrativo.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: beber da água do Nilo
  rationale: Mantém explícitos tanto o ato de beber quanto a água como objeto, com construção natural em português.
- source_word: וַיְהִי הַדָּם
  choice: havia sangue
  rationale: A construção existencial traduz naturalmente ויהי neste contexto sem impor uma explicação adicional sobre a origem ou a forma do sangue.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: por toda a terra do Egito
  rationale: Preserva a extensão distributiva de בְּכָל em linguagem corrente e digna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Começou a cheirar mal” comunica vividamente o efeito do verbo hebraico sem soar excessivamente coloquial. Não se acrescentou nota a “Nilo”, pois a tradução direta identifica corretamente o referente contextual e não há ambiguidade relevante para o leitor neste versículo.
