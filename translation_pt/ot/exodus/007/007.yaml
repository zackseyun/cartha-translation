base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: pt
  text: Moisés tinha oitenta anos[a], e Arão, oitenta e três, quando falaram ao faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Moisés era filho de oitenta anos, e Arão, filho de três e oitenta anos, quando falaram ao faraó”.'
    reason: Alternativa lexical que reproduz mais de perto o modo hebraico de expressar a idade e a ordem dos números.
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: tinha ... anos
  rationale: O hebraico expressa a idade literalmente como “filho de ... anos”; em português atual, “tinha ... anos” comunica o mesmo sentido de modo natural.
- source_word: שְׁמֹנִים שָׁנָה
  choice: oitenta anos
  rationale: Expressão cardinal comum para indicar a idade de Moisés.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: oitenta e três
  rationale: O hebraico apresenta literalmente “três e oitenta”; a ordem foi ajustada ao uso normal do português. A elipse de “anos” evita repetição sem perder clareza.
- source_word: בְּדַבְּרָם
  choice: quando falaram
  rationale: 'A preposição בְּ com o infinitivo construto e sufixo pronominal tem aqui valor temporal: indica a ocasião em que tinham essas idades.'
- source_word: אֶל פַּרְעֹה
  choice: ao faraó
  rationale: No contexto de fala dirigida a alguém, “falar ao faraó” traduz naturalmente a direção expressa por אֶל e preserva o título régio.
- source_word: וּמֹשֶׁה
  choice: Moisés
  rationale: O waw inicial liga a frase ao contexto narrativo, mas não exige um conectivo explícito em português; omiti-lo produz uma abertura natural sem acrescentar um marcador temporal inexistente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução usa a expressão idiomática portuguesa para idade, preservando em nota a forma hebraica literal. “Faraó” aparece em minúscula por funcionar como título, conforme o uso ortográfico corrente.
