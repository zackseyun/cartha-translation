  source_fidelity: A tradução preserva adequadamente a ação distributiva, a transformação dos cajados, a oposição introduzida por “mas” e o fato de o cajado de Arão engolir os cajados dos demais. “Serpentes” é uma opção contextual defensável para תַּנִּינִם, com a amplitude lexical devidamente indicada em nota.
