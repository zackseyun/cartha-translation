  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: pt
  text: Cada um lançou ao chão o seu cajado, e os cajados se tornaram serpentes[a]; mas o cajado de Arão engoliu os cajados deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dragões” ou “grandes répteis”; o hebraico tannin pode designar uma criatura serpentiforme de modo mais amplo que a palavra usual para “serpente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: lançou ao chão
  rationale: O verbo שׁלך indica lançar ou atirar; no contexto, “lançou ao chão” expressa de modo natural o movimento dos cajados diante de faraó.
- source_word: אִישׁ
  choice: cada um
  rationale: 'O substantivo tem aqui sentido distributivo: cada indivíduo lançou o próprio cajado. “Cada um” é natural em português e não explicita além do necessário a identidade masculina já dada pelo contexto.'
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: seu cajado / cajado / cajados deles
  rationale: מַטֶּה pode significar vara ou cajado. “Cajado” preserva o objeto concreto da narrativa e mantém as distinções de singular e plural.
- source_word: וַיִּהְיוּ
  choice: se tornaram
  rationale: A forma de היה descreve aqui o resultado ou a transformação. “Se tornaram” comunica isso diretamente sem ampliar o texto.
- source_word: לְתַנִּינִם
  choice: serpentes
  rationale: תַּנִּין pode designar uma criatura serpentiforme, dragão ou grande réptil, conforme o contexto. Nesta cena, “serpentes” é a tradução contextual mais clara, enquanto a amplitude lexical é preservada em nota.
- source_word: וַיִּבְלַע
  choice: engoliu
  rationale: בלע significa engolir ou tragar. “Engoliu” é direto e natural em português e expressa a consumição dos outros cajados.
- source_word: אֶת
  choice: '[marcador de objeto direto não traduzido]'
  rationale: אֶת assinala o objeto direto definido em hebraico e não requer equivalente lexical em português.
