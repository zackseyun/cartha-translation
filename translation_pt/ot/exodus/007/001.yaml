  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Veja, eu fiz de você Deus para o faraó[a], e Arão, seu irmão, será o seu profeta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, Moisés atuaria diante do faraó como representante de Deus, enquanto Arão seria seu profeta. O hebraico diz literalmente: “fiz de você Deus para o faraó”.'
    reason: Esclarece a formulação incomum sem enfraquecê-la no texto principal nem sugerir que Moisés fosse Deus por natureza.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português.
- source_word: רְאֵה
  choice: Veja
  rationale: Mantém o imperativo que chama a atenção de Moisés para a declaração seguinte.
- source_word: נְתַתִּיךָ
  choice: eu fiz de você
  rationale: Embora נתן tenha o sentido básico de “dar”, nesta construção predicativa comunica que Moisés foi colocado ou constituído nessa função; “fiz de você” é claro e natural.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Reproduz diretamente o predicativo hebraico, sem acrescentar a comparação explícita “como”. O contexto e a nota esclarecem que se trata da posição representativa de Moisés diante do faraó, não de uma afirmação sobre sua natureza.
- source_word: לְפַרְעֹה
  choice: para o faraó
  rationale: Expressa a relação indicada pela preposição לְ e soa natural em português.
- source_word: יִהְיֶה
  choice: será
  rationale: Expressa de modo direto o valor futuro da forma verbal no contexto.
- source_word: נְבִיאֶךָ
  choice: o seu profeta
  rationale: Mantém o termo hebraico comum para “profeta” e preserva o paralelo deliberado entre Deus e profeta estabelecido pelo versículo.
theological_decisions:
- issue: Moisés é chamado אֱלֹהִים em relação ao faraó
  choice: “Deus para o faraó”, com nota explicativa
  alternative: “como Deus para o faraó” ou “um deus para o faraó”
  rationale: O hebraico não contém partícula comparativa nem artigo indefinido. A tradução direta preserva a formulação forte e sua tensão, enquanto o contexto — Arão como profeta de Moisés — indica uma função representativa de autoridade divina, sem identificar Moisés ontologicamente com Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Faraó” é usado com artigo, conforme o uso natural em português; “Arão, seu irmão” preserva a relação familiar sem rigidez desnecessária.
