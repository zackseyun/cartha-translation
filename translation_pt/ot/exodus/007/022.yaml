  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּ/לָטֵי/הֶ֑ם וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: pt
  text: Mas os magos do Egito fizeram o mesmo com suas artes secretas[a]. O coração do faraó se endureceu[b], e ele não lhes deu ouvidos, conforme Yahweh havia falado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com seus encantamentos” ou “com suas artes ocultas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o coração do faraó ficou duro”. O hebraico não declara explicitamente, neste versículo, quem causou o endurecimento.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram o mesmo
  rationale: Expressa naturalmente o sentido idiomático de “fizeram assim” e liga a ação dos magos ao sinal anterior.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: os magos do Egito
  rationale: Designa com clareza os especialistas rituais egípcios que imitam os sinais, em linguagem corrente e digna.
- source_word: בְּלָטֵיהֶם
  choice: com suas artes secretas
  rationale: Preserva tanto o valor instrumental da preposição quanto a ideia de práticas mágicas ocultas, sem especificar indevidamente o método.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: O coração do faraó se endureceu
  rationale: A construção pronominal expressa mudança ou estado resultante sem identificar um agente externo, de acordo com a formulação hebraica.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: ele não lhes deu ouvidos
  rationale: É uma expressão portuguesa natural para “não escutou/atendeu a eles” e comunica que o faraó não acolheu as palavras de Moisés e Arão.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: conforme Yahweh havia falado
  rationale: A fórmula remete à declaração anterior de Yahweh; o mais-que-perfeito composto deixa clara essa anterioridade narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Agência no endurecimento do coração do faraó
  choice: O coração do faraó se endureceu
  alternative: O coração do faraó foi endurecido; o faraó endureceu o coração
  rationale: O hebraico deste versículo não identifica explicitamente quem causa o endurecimento. A forma escolhida preserva essa ambiguidade e evita atribuir a ação diretamente a Deus ou ao próprio faraó.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. “Faraó” é usado com artigo, conforme o uso natural em português. A redação mantém tom narrativo digno, evita arcaísmos e preserva a ambiguidade do hebraico quanto à agência no endurecimento.
