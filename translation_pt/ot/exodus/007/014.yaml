base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “O coração do faraó está pesado[a]; ele se recusa a deixar o povo ir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O coração do faraó está endurecido”. O adjetivo hebraico significa literalmente “pesado” e, neste contexto, retrata obstinação ou falta de receptividade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: כָּבֵד
  choice: está pesado
  rationale: Preserva a metáfora concreta do hebraico, que neste contexto comunica obstinação ou falta de receptividade sem uniformizá-la com outros termos do motivo do endurecimento.
- source_word: לֵב פַּרְעֹה
  choice: O coração do faraó
  rationale: Reproduz naturalmente em português a relação construta hebraica, tratando “faraó” como título.
- source_word: מֵאֵן
  choice: ele se recusa
  rationale: Expressa o estado ou a disposição contínua indicada pela forma hebraica.
- source_word: לְשַׁלַּח
  choice: a deixar ... ir
  rationale: No contexto do Êxodo, indica permitir que o povo parta; a expressão é corrente e precisa em português.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém a formulação explícita do hebraico sem acrescentar “de Israel”, embora o referente seja claro pelo contexto.
theological_decisions:
- issue: Descrição da condição do faraó sem eliminar a tensão do motivo do endurecimento
  choice: O coração do faraó está pesado
  alternative: O coração do faraó está endurecido
  rationale: O hebraico usa aqui o adjetivo “pesado”. Preservar essa imagem respeita a variedade lexical do texto e evita substituir a formulação específica por uma expressão teológica convencional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura narrativa é natural, enquanto a metáfora hebraica incomum é mantida no texto principal e esclarecida em nota.
