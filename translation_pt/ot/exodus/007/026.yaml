base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Vá ao faraó e diga-lhe: ‘Assim diz Yahweh: Deixe o meu povo ir, para que me sirvam[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que me adorem”. O verbo hebraico pode indicar o serviço prestado a Deus, incluindo a adoração.'
    reason: Alternativa lexical que esclarece a dimensão cultual possível de עבד sem restringir o texto principal a esse sentido.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa com naturalidade essa sequência no português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Vá ao faraó
  rationale: בוא pode significar vir, ir ou entrar, conforme o ponto de vista. Neste contexto, a ordem é dirigir-se à presença do faraó; “Vá ao faraó” comunica isso de modo claro e natural sem acrescentar detalhes.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: e diga-lhe
  rationale: A construção dá continuidade à ordem anterior. Esta formulação mantém a força imperativa e é idiomática em português.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém o tom formal e autorizado da fórmula hebraica de mensageiro.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Deixe o meu povo ir
  rationale: No contexto, שׁלח exige que o faraó liberte o povo. A formulação preserva tanto a ordem quanto a imagem concreta de deixá-lo partir.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Reproduz a posse de primeira pessoa e preserva a reivindicação relacional e pactual expressa no hebraico.
- source_word: וְיַעַבְדֻנִי
  choice: para que me sirva
  rationale: A conjunção e a forma verbal exprimem aqui finalidade. “Servir” conserva a amplitude de עבד, que, quando dirigido a Deus, pode incluir adoração. A concordância no singular com o coletivo “povo” é natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título nem adotar outra forma tradicional de transliteração.
- issue: Sentido de וְיַעַבְדֻנִי no propósito da libertação
  choice: para que me sirva
  alternative: para que me adore
  rationale: עבד pode designar o serviço prestado a Deus, incluindo a adoração, mas “sirva” preserva sua extensão sem limitar a referência apenas ao culto. Assim também permanece perceptível o contraste entre servir ao faraó e servir a Yahweh.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conservou-se a fórmula solene “Assim diz Yahweh”. “Faraó” foi usado com artigo e inicial minúscula por funcionar aqui como título. A colocação “diga-lhe” mantém um registro corrente sem perder formalidade.
