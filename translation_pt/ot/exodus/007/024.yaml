base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: pt
  text: E todos os egípcios cavaram ao redor do Nilo em busca de água para beber[a], porque não podiam beber da água do Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “o rio” (ye’or); em Êxodo, esse termo se refere especificamente ao Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: cavaram
  rationale: O verbo חפר significa cavar ou escavar. “Cavaram” é direto e natural, sem acrescentar “poços”, que não aparece explicitamente no hebraico.
- source_word: כָל מִצְרַיִם
  choice: todos os egípcios
  rationale: Embora a expressão seja literalmente “todo o Egito”, o contexto se refere coletivamente aos habitantes do país; “todos os egípcios” comunica esse sentido com clareza.
- source_word: סְבִיבֹת הַיְאֹר
  choice: ao redor do Nilo
  rationale: סְבִיבֹת indica os arredores ou a área circundante, e יְאֹר neste contexto designa especificamente o Nilo.
- source_word: מַיִם לִשְׁתּוֹת
  choice: em busca de água para beber
  rationale: A formulação torna explícita em português a finalidade da escavação, preservando o sentido de “água para beber” sem sugerir que o texto mencione poços.
- source_word: כִּי לֹא יָכְלוּ
  choice: porque não podiam
  rationale: כִּי introduz a razão pela qual cavaram; “porque não podiam” é uma formulação moderna e direta.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: beber da água do Nilo
  rationale: A preposição מִן indica a fonte da qual tentariam beber. A expressão portuguesa é clara e preserva a relação com as águas do Nilo.
