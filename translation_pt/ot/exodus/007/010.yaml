source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יַּ֣עַשׂוּ כֵ֔ן כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַ/יַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת מַטֵּ֗/הוּ לִ/פְנֵ֥י פַרְעֹ֛ה וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יְהִ֥י לְ/תַנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: pt
  text: Moisés e Arão foram até o faraó e fizeram exatamente como Yahweh havia ordenado. Arão lançou seu cajado diante do faraó e diante dos seus servos, e o cajado se tornou uma serpente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico tannín também pode designar uma criatura semelhante a um dragão ou um grande réptil; aqui, provavelmente se refere a uma serpente no sinal realizado diante do faraó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foram até
  rationale: Embora o verbo hebraico esteja morfologicamente no singular antes do sujeito composto, ele abrange Moisés e Arão. “Foram até o faraó” expressa com naturalidade o movimento para a presença dele.
- source_word: וַיַּעַשׂוּ כֵן כַּאֲשֶׁר צִוָּה
  choice: fizeram exatamente como ... havia ordenado
  rationale: A formulação preserva tanto o cumprimento da ordem quanto a correspondência precisa com a ordem anterior; o mais-que-perfeito situa naturalmente o mandamento antes da ação narrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיַּשְׁלֵךְ
  choice: lançou
  rationale: Expressa o ato deliberado de atirar o cajado diante da corte, em linguagem atual e digna.
- source_word: מַטֵּהוּ
  choice: seu cajado
  rationale: “Cajado” é uma designação portuguesa natural para o objeto levado por Arão e usado no sinal.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: diante de ... e diante de
  rationale: Mantém a repetição hebraica e destaca que o sinal ocorreu publicamente tanto perante o faraó quanto perante seus servos.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Preserva o sentido lexical básico, sem excluir a possível função cortesã desses homens no contexto real.
- source_word: וַיְהִי לְתַנִּין
  choice: o cajado se tornou uma serpente
  rationale: “Serpente” se ajusta ao sinal neste contexto. A repetição explícita de “o cajado” evita uma referência pronominal pouco clara em português, enquanto a nota conserva a amplitude semântica de תַנִּין.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Tradução de תַנִּין
  choice: serpente
  alternative: criatura semelhante a um dragão; grande réptil
  rationale: No sinal realizado com o cajado diante do faraó, “serpente” é a leitura contextual mais clara, mas o termo hebraico possui alcance semântico mais amplo; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “diante ... diante” reproduz a ênfase pública do hebraico; “exatamente como” comunica a conformidade expressa por כַּאֲשֶׁר sem tornar a frase excessivamente literal.
