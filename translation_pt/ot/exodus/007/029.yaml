  yaml_path: translation/ot/exodus/007/029.yaml
  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: pt
  text: As rãs subirão sobre você[a], sobre o seu povo e sobre todos os seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra você”; na segunda expressão, também se pode traduzir “entre o seu povo”. A mesma preposição hebraica ocorre nas três expressões, mas o contexto favorece a ideia de que as rãs vêm sobre o faraó e seu domínio como uma aflição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: sobre você
  rationale: A preposição בְּ com יַעֲלוּ, no contexto da praga, indica que as rãs virão sobre o faraó como aflição. “Sobre você” preserva tanto a direção quanto o efeito hostil sem recorrer ao pouco natural “em você”.
- source_word: וּבְעַמְּךָ
  choice: sobre o seu povo
  rationale: Mantém a repetição da mesma preposição hebraica e o paralelismo da frase. “Entre o seu povo” também é lexicalmente possível, mas torna menos explícita a ideia de que a praga virá sobre as pessoas.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: sobre todos os seus servos
  rationale: עֶבֶד pode designar servo, escravo ou oficial da corte. “Servos” é amplo e adequado ao discurso dirigido ao faraó, sem especificar indevidamente condição jurídica ou cargo administrativo.
- source_word: יַעֲלוּ
  choice: subirão
  rationale: O verbo עָלָה expressa movimento ascendente. “Subirão” é natural neste contexto, em que as rãs emergem e avançam desde as águas.
- source_word: הַצְפַרְדְּעִים
  choice: As rãs
  rationale: O artigo definido hebraico identifica as rãs da praga já anunciada; o artigo é natural e apropriado em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “sobre” conserva o paralelismo enfático do hebraico.
