    rationale: A ideia é compatível com o contexto, mas «para encontrá-los» reproduz mais diretamente o propósito/direção do encontro e conserva a neutralidade da expressão.
  revised_text: Eles encontraram Moisés e Arão[a], que estavam de pé para encontrá-los quando saíram da presença do faraó.
