  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: pt
  text: Eles encontraram Moisés e Arão[a], que estavam de pé para encontrá-los quando saíram da presença do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «depararam-se com Moisés e Arão». Em alguns contextos, o verbo também pode ter o sentido de «confrontaram», mas o texto principal mantém o sentido mais amplo de «encontraram».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: Eles encontraram
  rationale: O verbo פגע pode significar encontrar ou deparar-se com alguém e, em certos contextos, pode sugerir confronto. Aqui, a tradução ampla «encontraram» não antecipa a hostilidade expressa no versículo seguinte.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Moisés e Arão
  rationale: Os marcadores hebraicos de objeto direto não são reproduzidos em português; os nomes seguem suas formas portuguesas tradicionais e amplamente reconhecidas.
- source_word: נִצָּבִים
  choice: que estavam ali
  rationale: O particípio de נצב descreve Moisés e Arão em posição, parados no local. «Estavam ali» soa natural em português, enquanto a ideia de que aguardavam os capatazes é completada pela expressão seguinte.
- source_word: לִקְרָאתָם
  choice: à espera deles
  rationale: A expressão indica que Moisés e Arão haviam tomado posição para receber ou encontrar os que saíam. «À espera deles» comunica com naturalidade a cena sem atribuir intenção hostil.
- source_word: בְּצֵאתָם
  choice: quando saíram
  rationale: O infinitivo construto com בְּ estabelece a circunstância temporal; «quando saíram» preserva essa relação de modo claro e corrente.
- source_word: מֵאֵת פַּרְעֹה
  choice: da presença do faraó
  rationale: מֵאֵת indica afastamento de junto de uma pessoa. «Da presença do faraó» explicita esse valor e evita a possível impressão de que saíam de dentro do próprio faraó.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por sintaxe natural. «Faraó» aparece com inicial minúscula por funcionar aqui como título. A formulação preserva a possível tensão do encontro sem transformar em confronto explícito o que o verbo hebraico não exige.
