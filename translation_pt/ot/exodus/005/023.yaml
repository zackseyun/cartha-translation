base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: pt
  text: Pois, desde que fui falar com o faraó em teu nome[a], ele fez mal a este povo[b], e de modo algum livraste o teu povo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com tua autoridade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “piorou a situação deste povo”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico combina o infinitivo absoluto com o verbo conjugado — literalmente, “livrar, não livraste” — para intensificar a negação.
    reason: source_language_explanation
lexical_decisions:
- source_word: וּמֵאָז
  choice: Pois, desde que
  rationale: מֵאָז indica o tempo decorrido desde uma ação anterior; “desde que” é natural em português. A conjunção וּ introduz aqui a explicação da queixa de Moisés, bem expressa por “Pois”.
- source_word: בָּאתִי אֶל־פַּרְעֹה לְדַבֵּר
  choice: fui falar com o faraó
  rationale: Embora בוא seja literalmente “vir/chegar”, em português a perspectiva narrativa pede naturalmente “fui”; o infinitivo לְדַבֵּר expressa propósito. “Falar com o faraó” evita a construção menos idiomática “ir ao faraó para falar” sem alterar o sentido.
- source_word: בִּשְׁמֶךָ
  choice: em teu nome
  rationale: Preserva a expressão hebraica e seu sentido de representação e autoridade divina, que permanece claro em português.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: ele tem feito mal a este povo
  rationale: O hifil de רעע pode indicar fazer o mal, causar dano ou piorar uma situação. “Tem feito mal” conserva tanto a dimensão moral quanto a prejudicial e combina com a ação contínua desde a ida de Moisés ao faraó.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: e de modo algum livraste
  rationale: O infinitivo absoluto הַצֵּל junto do verbo finito הִצַּלְתָּ intensifica a negação. “De modo algum” reproduz essa ênfase de maneira natural e vigorosa.
- source_word: אֶת־עַמֶּךָ
  choice: o teu povo
  rationale: Tradução direta do objeto definido; “teu” mantém o discurso dirigido pessoalmente a Deus em registro digno e corrente.
theological_decisions:
- issue: A força da acusação de Moisés a Deus
  choice: e de modo algum livraste o teu povo
  alternative: e não livraste o teu povo
  rationale: A formulação mantém a ousadia da queixa e a intensidade gramatical do hebraico, sem amenizá-la nem transformá-la numa afirmação teológica além do momento narrativo.
- issue: O sentido de agir בִּשְׁמֶךָ
  choice: em teu nome
  alternative: com tua autoridade
  rationale: A forma literal é clara em português e preserva simultaneamente as ideias de representação, autoridade e vínculo com o nome divino, sem reduzir a expressão a apenas uma delas.
- issue: A ambiguidade de הֵרַע
  choice: tem feito mal a este povo
  alternative: tem piorado a situação deste povo
  rationale: A escolha principal conserva a possível carga moral de “mal” e o dano causado, enquanto a nota registra a leitura contextual possível de agravamento das condições do povo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. O tratamento por “tu” aparece apenas nas formas possessiva e verbal, comuns no registro bíblico amplo. A ordem e a força retórica da queixa foram preservadas, com ajustes idiomáticos mínimos.
