  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה הֵן רַבִּ֥ים עַתָּ֖ה עַ֣ם הָ/אָ֑רֶץ וְ/הִשְׁבַּתֶּ֥ם אֹתָ֖/ם מִ/סִּבְלֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: pt
  text: 'O faraó disse: “Vejam! O povo da terra agora é numeroso, e vocês os estão fazendo parar de trabalhar[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fazendo-os deixar o trabalho pesado” ou “fazendo-os descansar de seus fardos”. O verbo hebraico é causativo e significa fazê-los cessar ou parar; o termo seguinte pode designar tanto os fardos quanto o trabalho pesado imposto a eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam!
  rationale: Introduz com ênfase a observação do faraó. “Vejam!” conserva a força exclamativa e é natural em português moderno.
- source_word: רַבִּים
  choice: numeroso
  rationale: Expressa de modo natural a grande quantidade do povo no singular coletivo.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Mantém a expressão hebraica sem decidir silenciosamente se ela designa os habitantes do país em geral ou, neste contexto, a população israelita submetida ao trabalho.
- source_word: עַתָּה
  choice: já
  rationale: No contexto da queixa, “já” comunica naturalmente a situação presente ressaltada pelo faraó; “agora” seria uma alternativa mais formalmente direta.
- source_word: וְהִשְׁבַּתֶּם
  choice: vocês os estão fazendo parar
  rationale: A forma causativa de שׁבת indica que Moisés e Arão fazem o povo cessar sua atividade. A construção conserva essa causalidade sem atribuir ao verbo uma ideia necessariamente positiva de repouso.
- source_word: מִסִּבְלֹתָם
  choice: de trabalhar
  rationale: Neste contexto, os “fardos” são os trabalhos pesados impostos aos israelitas. A formulação é idiomática em português, enquanto a nota registra alternativas mais formais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” corresponde aos interlocutores Moisés e Arão. A expressão “povo da terra” foi mantida para preservar a formulação e a possível amplitude do hebraico.
