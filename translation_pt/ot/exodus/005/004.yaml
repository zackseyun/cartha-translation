base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: pt
  text: 'Mas o rei do Egito lhes disse: “Moisés e Arão, por que vocês estão afastando o povo do seu trabalho?[a] Vão para as suas cargas.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por que vocês estão fazendo o povo parar o seu trabalho?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Vão para o seu trabalho forçado.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O consecutivo faz a narrativa avançar; “Mas” expressa naturalmente o contraste da resposta do faraó ao pedido anterior.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: o rei do Egito
  rationale: Reproduz de modo claro e corrente a construção hebraica.
- source_word: לָמָּה
  choice: por que
  rationale: Mantém diretamente a pergunta causal do hebraico.
- source_word: תַּפְרִיעוּ
  choice: estão afastando
  rationale: O hifil de פרע indica aqui fazer cessar ou desviar o povo de sua atividade; “afastando ... do trabalho” preserva a força causativa sem sugerir libertação positiva.
- source_word: הָעָם
  choice: o povo
  rationale: Conserva a designação ampla empregada no texto, em vez de restringi-la a “trabalhadores”.
- source_word: מִמַּעֲשָׂיו
  choice: do seu trabalho
  rationale: O sufixo singular concorda com o coletivo “povo”; em português, “seu trabalho” mantém essa construção de modo natural.
- source_word: לְכוּ
  choice: Voltem
  rationale: No contexto, a ordem de ir às cargas equivale naturalmente a mandar que retomem o trabalho; “Voltem” comunica o destino implícito sem perder o caráter imperativo.
- source_word: לְסִבְלֹתֵיכֶם
  choice: às suas cargas
  rationale: Preserva a imagem concreta de cargas e o tom opressivo de סבלות, sem explicitar além do hebraico que se trata de trabalho forçado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e no espaço lusófono. A fala direta mantém o tom incisivo do rei; “cargas” conserva a metáfora e a opressão do hebraico.
