  text: תִּכְבַּ֧ד הָ/עֲבֹדָ֛ה עַל הָ/אֲנָשִׁ֖ים וְ/יַעֲשׂוּ בָ֑/הּ וְ/אַל יִשְׁע֖וּ בְּ/דִבְרֵי שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/009.yaml
  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: pt
  text: Que o trabalho pese sobre os homens, para que trabalhem nele e não deem atenção[a] a palavras mentirosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palavras falsas” ou “palavras enganosas”. O verbo hebraico também pode ser traduzido por “considerem”, “deem ouvidos” ou “se voltem para”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: pese
  rationale: O qal imperfeito de כבד, com “o trabalho” como sujeito, expressa que o trabalho deve ser pesado ou opressivo sobre os homens. “Pese sobre” preserva diretamente a imagem hebraica e soa natural em português.
- source_word: הָעֲבֹדָה
  choice: o trabalho
  rationale: עֲבֹדָה designa trabalho, labor ou serviço; no contexto da fabricação forçada de tijolos, “o trabalho” é claro e concreto.
- source_word: עַל
  choice: sobre
  rationale: A preposição retrata o trabalho como um peso que recai sobre os homens.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O hebraico especifica os homens, referindo-se no contexto aos trabalhadores israelitas; a tradução mantém essa referência em vez de generalizá-la.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: para que se ocupem com ele
  rationale: A construção significa literalmente que façam ou trabalhem nele. “Ocupem-se com ele” comunica o propósito de mantê-los aplicados ao trabalho sem sugerir apenas que o concluam.
- source_word: וְאַל יִשְׁעוּ
  choice: e não deem atenção
  rationale: שעה pode significar voltar-se para, considerar ou prestar atenção. A formulação mantém o valor proibitivo ou de resultado pretendido de אַל no encadeamento da ordem.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: a palavras mentirosas
  rationale: דִּבְרֵי significa “palavras” ou “declarações”, e שָׁקֶר caracteriza-as, na fala de Faraó, como falsas ou enganosas. “Palavras mentirosas” preserva essa acusação.
theological_decisions:
- issue: A qualificação da mensagem como falsa
  choice: Manter “palavras mentirosas” como caracterização feita por Faraó
  alternative: Suavizar para “palavras vãs” ou indicar no corpo do versículo que essa é apenas a opinião de Faraó
  rationale: O texto registra sem correção explícita a avaliação hostil de Faraó. A tradução deve preservar a tensão narrativa, sem endossar sua afirmação nem inserir uma explicação interpretativa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pese sobre” conserva a metáfora hebraica do fardo; “se ocupem com ele” evita uma formulação excessivamente literal e pouco idiomática. O marcador [a] aparece no texto principal.
