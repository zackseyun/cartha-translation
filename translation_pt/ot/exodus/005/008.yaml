  source_fidelity: 'O texto traduz com precisão os principais elementos do hebraico: a cota prescrita de tijolos, a referência temporal literal “ontem e anteontem”, a imposição da exigência sem redução, a acusação de que os israelitas estão “ociosos”, e o apelo para ir sacrificar ao seu Deus. “A mesma cota” explicita legitimamente a continuidade da exigência já pressuposta pelo contexto e pela construção hebraica.'
