source:
  edition: WLC
  text: וְ/אֶת מַתְכֹּ֨נֶת הַ/לְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵי/הֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ כִּֽי נִרְפִּ֣ים הֵ֔ם עַל כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵ/אמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵ/אלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: pt
  text: 'E vocês lhes imporão a mesma cota de tijolos que faziam ontem e anteontem[a]; não diminuam nada dela, pois eles estão ociosos. Por isso clamam: “Vamos oferecer sacrifícios ao nosso Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “anteriormente” ou “como antes”, em lugar de “ontem e anteontem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: cota
  rationale: No contexto de trabalho forçado, designa a quantidade fixada de produção; “cota” é clara e combina naturalmente com a ordem de não a diminuir.
- source_word: הַלְּבֵנִים
  choice: tijolos
  rationale: Equivalente concreto e direto no contexto da fabricação de tijolos.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: ontem e anteontem
  rationale: Preserva de modo conciso e natural a expressão hebraica referente aos dias anteriores, sem excluir seu possível sentido idiomático mais amplo.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: lhes imporão
  rationale: A construção descreve a imposição de uma obrigação aos trabalhadores e conserva a força coercitiva da ordem.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: não diminuam nada dela
  rationale: Expressa claramente que nenhuma parte da cota deve ser reduzida.
- source_word: נִרְפִּים
  choice: ociosos
  rationale: Reproduz a acusação de Faraó de que eles não trabalham o suficiente, sem acrescentar uma avaliação moral mais específica como “preguiçosos”.
- source_word: צֹעֲקִים
  choice: clamam
  rationale: Comunica a intensidade do apelo vocal e introduz com naturalidade o discurso direto.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Vamos oferecer sacrifícios
  rationale: Traduz os dois coortativos como apelo na primeira pessoa do plural em português corrente; “oferecer sacrifícios” explicita naturalmente o sentido cultual do verbo.
- source_word: לֵאלֹהֵינוּ
  choice: ao nosso Deus
  rationale: Expressa diretamente o destinatário dos sacrifícios.
theological_decisions: []
