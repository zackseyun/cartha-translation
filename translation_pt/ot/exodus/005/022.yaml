base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: pt
  text: 'Então Moisés voltou a Yahweh e disse: “Senhor, por que trouxeste desgraça sobre este povo? Por que foi que me enviaste?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Por que isto: enviaste-me?” A expressão é enfática e equivale a “Por que foi que me enviaste?”'
    reason: A nota registra a forma incomum de לָמָּה זֶּה e explica sua tradução idiomática.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוּב, nesta forma narrativa, indica que Moisés retornou para dirigir-se novamente a Deus; “voltou” é natural e direto em português.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição אֶל indica direção, e o nome divino יהוה é transliterado como “Yahweh” para preservar o nome pessoal presente no texto hebraico.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É uma forma reverente de tratamento dirigida a Deus. “Senhor” é clara, digna e natural no discurso direto.
- source_word: הֲרֵעֹתָה
  choice: trouxeste desgraça sobre
  rationale: O hifil de רעע expressa causar mal, dano ou calamidade. “Trouxeste desgraça sobre” preserva a força causativa e a acusação intensa de Moisés sem afirmar de modo inequívoco que Deus praticou mal moral.
- source_word: לָעָם הַזֶּה
  choice: este povo
  rationale: עָם designa Israel coletivamente; “este povo” corresponde de forma direta e idiomática.
- source_word: לָמָּה זֶּה
  choice: Por que foi que
  rationale: A construção combina “por quê” com o elemento enfático זֶה. A locução portuguesa “por que foi que” transmite a ênfase sem reproduzir de maneira artificial a sintaxe hebraica.
- source_word: שְׁלַחְתָּנִי
  choice: me enviaste
  rationale: 'A forma verbal é a segunda pessoa masculina singular com sufixo de primeira pessoa singular: “enviaste-me/me enviaste”. A colocação “me enviaste” é amplamente compreensível e tem boa naturalidade brasileira.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal e o distingue do título אֲדֹנָי, traduzido por “Senhor” na fala de Moisés.
- issue: Sentido da acusação expressa por הֲרֵעֹתָה
  choice: trouxeste desgraça sobre
  alternative: fizeste mal a; prejudicaste
  rationale: A fala de Moisés atribui a Deus a calamidade sofrida pelo povo após sua missão. A tradução conserva a tensão teológica da queixa, mas evita determinar que o verbo necessariamente acusa Deus de maldade moral.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe amplamente compreensível e boa legibilidade brasileira. O uso de “trouxeste” e “enviaste” mantém o discurso dirigido diretamente a Deus sem recorrer a construções excessivamente arcaicas.
