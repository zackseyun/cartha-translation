  text: וַ/יְצַ֥ו פַּרְעֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֶת הַ/נֹּגְשִׂ֣ים בָּ/עָ֔ם וְ/אֶת שֹׁטְרָ֖י/ו לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/006.yaml
  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
translation:
  language: pt
  text: 'Naquele dia[a], o faraó ordenou aos feitores[b] do povo e aos seus oficiais[c], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “naquele mesmo dia”. A expressão hebraica pode enfatizar a imediatidade da ordem.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa os que impunham e cobravam o trabalho; também pode ser traduzido por “supervisores do trabalho”.
    reason: lexical_alternative
  - marker: c
    text: Ou “seus capatazes”. O termo hebraico se refere a funcionários subordinados no sistema de trabalho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O imperfeito consecutivo de צוה faz a narrativa avançar com sentido de passado simples; “ordenou” preserva de modo natural a força autoritativa do verbo.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma consagrada em português para o título do rei do Egito.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Tradução direta da expressão temporal; no contexto, ela também pode realçar que a ordem foi dada naquele mesmo dia.
- source_word: הַנֹּגְשִׂים
  choice: os feitores
  rationale: No contexto do trabalho forçado no Êxodo, o termo designa os que impunham e cobravam o trabalho. “Feitores” expressa essa função sem recorrer ao termo mais geral “opressores”.
- source_word: בָּעָם
  choice: do povo
  rationale: A construção com ב relaciona os feitores ao povo submetido ao trabalho. “Do povo” é conciso e natural, embora “entre o povo” ou “sobre o povo” sejam possíveis conforme a relação enfatizada.
- source_word: שֹׁטְרָיו
  choice: seus oficiais
  rationale: O termo designa funcionários subordinados envolvidos na administração do trabalho. “Oficiais” conserva a amplitude institucional do hebraico; “capatazes” explicitaria mais a função laboral.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a fala direta do versículo seguinte; os dois-pontos tornam essa ligação natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Feitores” preserva a distinção entre os agentes que exigiam o trabalho e os funcionários subordinados; “dizendo” mantém a ligação formal com a fala que começa no versículo seguinte.
