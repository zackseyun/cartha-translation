    rationale: לַתֶּבֶן liga o material recolhido à palha como finalidade ou substituição. «Em vez de palha» conserva essa relação de modo mais próximo e conciso.
  - severity: medium
    issue: A alternativa da nota, «para recolher palha como restolho», não representa claramente a alternativa lexical indicada e soa semanticamente invertida em português.
    rationale: A nota deve apenas informar que os dois substantivos podem ser entendidos com menor distinção, sem sugerir que a palha é recolhida na qualidade de restolho.
