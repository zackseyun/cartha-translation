  source_fidelity: O texto principal comunica adequadamente a dispersão do povo por todo o Egito e a coleta de קַשׁ como material destinado a suprir a falta de תֶּבֶן. Contudo, «e usá-lo» introduz uma ação consecutiva que não está expressa no hebraico; a relação é mais diretamente de finalidade/substituição.
  naturalness: «Então o povo se espalhou por toda a terra do Egito» é natural e claro. «Para recolher restolho em vez de palha» é igualmente idiomático e exprime a relação contextual sem acrescentar uma oração verbal.
  terminology: «Restolho» e «palha» preservam, de modo útil, a provável distinção entre קַשׁ e תֶּבֶן. Como a diferenciação lexical exata é debatida, a nota deve apresentar a alternativa sem inverter ou tornar incoerente a relação entre os termos.
