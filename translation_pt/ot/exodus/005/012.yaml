  yaml_path: translation/ot/exodus/005/012.yaml
  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
translation:
  language: pt
  text: Então o povo se espalhou por toda a terra do Egito para recolher restolho em vez de palha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com menor distinção entre os termos hebraicos: “para recolher palha”. O texto principal preserva o provável contraste entre o restolho recolhido e a palha normalmente fornecida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: se espalhou
  rationale: A forma narrativa de פוץ descreve a dispersão do povo por uma área extensa. Em português, a construção pronominal expressa naturalmente o movimento coletivo imposto pelas circunstâncias, sem exigir uma passiva pesada.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa coletivamente o povo, aqui a força de trabalho israelita; “o povo” é simples, digno e não acrescenta especificações ausentes no hebraico.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: por toda a terra do Egito
  rationale: A expressão preserva a abrangência distributiva de בְּכָל e é idiomática no português contemporâneo.
- source_word: לְקֹשֵׁשׁ
  choice: para recolher
  rationale: קשש indica juntar material pequeno ou disperso; “recolher” comunica adequadamente essa ação neste contexto.
- source_word: קַשׁ
  choice: restolho
  rationale: Como קַשׁ e תֶּבֶן aparecem juntos, “restolho” mantém uma provável distinção entre os resíduos secos recolhidos no campo e a palha normalmente fornecida.
- source_word: לַתֶּבֶן
  choice: e usá-lo como palha
  rationale: O ל pode indicar finalidade ou função. A formulação explicita de modo natural que o restolho recolhido serviria como palha na fabricação de tijolos, sem alterar o sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Restolho” é um termo agrícola preciso e mantém a distinção lexical do hebraico; “e usá-lo como palha” torna explícita, em português natural, a relação funcional indicada por לַתֶּבֶן.
