base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: pt
  text: Vocês mesmos vão buscar palha para vocês onde quer que a encontrem[a], pois nada do trabalho de vocês será reduzido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “de onde a encontrarem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser expresso assim: “pois não se reduzirá em nada o trabalho de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: Vocês mesmos
  rationale: O pronome independente antes dos imperativos é enfático; “vocês mesmos” conserva essa ênfase.
- source_word: לְכוּ
  choice: vão
  rationale: Imperativo plural de הלך; “vão” é direto, natural e adequado à sequência de ordens.
- source_word: קְחוּ
  choice: buscar
  rationale: Embora o sentido básico seja “tomar”, no contexto de obter palha que precisa ser encontrada, “buscar” comunica naturalmente a ação exigida sem ampliar indevidamente o texto.
- source_word: לָכֶם
  choice: para vocês
  rationale: 'Preserva o valor dativo/reflexivo: os próprios israelitas devem providenciar a palha de que necessitam.'
- source_word: תֶּבֶן
  choice: palha
  rationale: No contexto da fabricação de tijolos, designa a palha empregada no processo.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: onde quer que a encontrem
  rationale: 'Expressa de modo natural a procedência aberta ou indeterminada: eles devem obtê-la de qualquer lugar em que consigam encontrá-la.'
- source_word: כִּי
  choice: pois
  rationale: Mantém o valor explicativo ou causal mais direto da conjunção, ligando a ordem à declaração de que o trabalho não sofrerá redução.
- source_word: אֵין נִגְרָע
  choice: não se reduzirá
  rationale: Reproduz o sentido passivo de que nenhuma redução será feita; o futuro harmoniza com a ordem e sua aplicação imediata.
- source_word: מֵעֲבֹדַתְכֶם
  choice: o trabalho de vocês
  rationale: עֲבֹדָה refere-se aqui ao trabalho imposto aos israelitas; “trabalho” é claro e não introduz conotações religiosas indevidas.
- source_word: דָּבָר
  choice: em nada
  rationale: 'Na construção negativa, דָּבָר intensifica a negação: o trabalho não será reduzido nem sequer em parte.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “vocês” preserva a ênfase e o valor reflexivo do hebraico, enquanto “não se reduzirá em nada” evita uma formulação portuguesa rígida demais.
