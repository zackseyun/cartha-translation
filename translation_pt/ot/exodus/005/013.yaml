  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: pt
  text: 'E os feitores os pressionavam, dizendo: “Terminem o trabalho de vocês, a tarefa de cada dia no seu dia,[a] como quando havia palha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quantidade exigida de cada dia, naquele dia”. A expressão hebraica diz literalmente “a coisa de um dia no seu dia” e, neste contexto, refere-se à tarefa ou cota exigida diariamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: os feitores
  rationale: No contexto do trabalho forçado no Egito, designa os agentes que exigiam dos israelitas o trabalho e a produção; “feitores” é uma equivalência contextual clara e coerciva em português.
- source_word: אָצִים
  choice: os pressionavam
  rationale: O particípio expressa ação contínua e insistente; “pressionavam” comunica a pressão coerciva sem exagerar o sentido.
- source_word: כַּלּוּ
  choice: Terminem
  rationale: Imperativo que exige a conclusão do trabalho determinado; a forma é direta e natural.
- source_word: מַעֲשֵׂיכֶם
  choice: o trabalho de vocês
  rationale: Refere-se ao trabalho exigido dos israelitas, especialmente à fabricação de tijolos; a expressão mantém a abrangência do hebraico.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: a tarefa de cada dia no seu próprio dia
  rationale: A formulação preserva a estrutura temporal do idioma hebraico e comunica, sem tornar explícita demais a interpretação, a quantidade ou tarefa diária exigida.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz de modo natural a comparação com a situação anterior.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: quando havia palha
  rationale: Representa com concisão a construção infinitiva e deixa ao contexto a inferência de que antes a palha estava disponível ou era fornecida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Feitores” mantém o cenário de trabalho coercivo; “a tarefa de cada dia no seu próprio dia” conserva algo da forma idiomática hebraica, enquanto a nota esclarece o sentido provável de cota diária.
