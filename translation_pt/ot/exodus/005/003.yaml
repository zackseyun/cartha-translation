  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: pt
  text: 'E eles disseram: “O Deus dos hebreus veio ao nosso encontro.[a] Por favor, deixe-nos ir numa viagem de três dias pelo deserto, para oferecermos sacrifícios a Yahweh, nosso Deus, para que ele não nos atinja com peste ou com a espada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos chamou”. A expressão hebraica pode indicar que Deus veio ao encontro deles ou que os convocou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: O Deus dos hebreus
  rationale: Preserva a construção e a designação étnico-social ‘hebreus’, própria desta narrativa, sem substituí-la por ‘israelitas’.
- source_word: נִקְרָא עָלֵינוּ
  choice: veio ao nosso encontro
  rationale: O nifal de קרא com עַל pode indicar encontro ou convocação. A formulação escolhida é natural em português e mantém em nota a possibilidade de ‘nos chamou’.
- source_word: נֵלֲכָה נָּא
  choice: Por favor, deixe-nos fazer
  rationale: O coortativo expressa um pedido para que possam ir, e נָא acrescenta a ideia de súplica cortês.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: uma jornada de três dias
  rationale: Reproduz de modo claro o idioma hebraico de duração ou distância de viagem.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: Em português corrente, ‘deserto’ pode designar a região erma e pouco habitada pretendida por מִדְבָּר, sem exigir a imagem de dunas arenosas.
- source_word: וְנִזְבְּחָה
  choice: para oferecermos sacrifícios
  rationale: O segundo coortativo, no contexto do pedido de partida, comunica sua finalidade. ‘Oferecer sacrifícios’ é natural e explicita corretamente o sentido cultual do verbo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, distinguindo-o de um título como ‘Senhor’.
- source_word: פֶּן
  choice: caso contrário
  rationale: Expressa em português atual a consequência temida introduzida por פֶּן, evitando o mais literário ‘para que não’ numa oração que descreve ameaça.
- source_word: יִפְגָּעֵנוּ
  choice: ele poderá nos ferir
  rationale: Neste contexto, פגע indica intervenção hostil ou punitiva. ‘Ferir’ combina naturalmente com os meios mencionados, enquanto ‘poderá’ comunica a consequência temida sem afirmar que ela certamente ocorrerá.
- source_word: בַּדֶּבֶר
  choice: com uma praga
  rationale: דֶּבֶר designa peste ou epidemia; ‘praga’ é claro ao leitor moderno e adequado ao contexto de juízo.
- source_word: בֶחָרֶב
  choice: com a espada
  rationale: Mantém a imagem concreta e o uso instrumental da preposição hebraica, em paralelo com ‘com uma praga’.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; ‘Yahweh’ preserva o nome próprio e evita convertê-lo em título.
- issue: Agente de יִפְגָּעֵנוּ
  choice: ele poderá nos ferir
  alternative: Yahweh poderá nos ferir; poderá nos atingir
  rationale: O sujeito implícito remete naturalmente a Yahweh, o Deus mencionado imediatamente antes. O pronome preserva a forma do hebraico sem atenuar a possibilidade de ação punitiva divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o pedido cortês e sua finalidade, e a nota preserva a ambiguidade lexical de נִקְרָא עָלֵינוּ.
