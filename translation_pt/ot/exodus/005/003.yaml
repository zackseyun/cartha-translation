  to: 'E eles disseram: “O Deus dos hebreus veio ao nosso encontro.[a] Por favor, deixe-nos ir numa viagem de três dias pelo deserto, para oferecermos sacrifícios a Yahweh, nosso Deus, para que ele não nos atinja com peste ou com a espada.”'
