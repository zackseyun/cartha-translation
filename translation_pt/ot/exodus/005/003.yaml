    issue: «caso contrário, ele poderá nos ferir» para פֶּן יִפְגָּעֵנוּ
    rationale: «Caso contrário» e o futuro modal «poderá» não refletem com precisão o receio preventivo introduzido por פֶּן. «Para que ele não nos atinja» preserva naturalmente a relação de temor/evitação, sem introduzir uma modalidade adicional.
  - severity: low
    issue: «deixe-nos fazer uma jornada»
    rationale: A formulação é possível, mas soa menos natural do que «deixe-nos ir numa viagem» e torna menos explícito o verbo de deslocamento נֵלֲכָה.
  - severity: low
    issue: «uma praga» para דֶּבֶר
    rationale: Embora aceitável, «peste» é mais preciso para pestilência/epidemia e evita a acepção comum de infestação associada a «praga».
