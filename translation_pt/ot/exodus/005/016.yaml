base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: pt
  text: 'Não se dá palha aos teus servos, mas nos dizem: “Façam tijolos!” E eis que teus servos estão sendo espancados, mas a culpa é do teu próprio povo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “e o teu povo pecou”. A cláusula hebraica é compacta e pode ser traduzida mais literalmente dessa maneira, mas, no contexto, provavelmente significa que a culpa é dos agentes do faraó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: palha
  rationale: É o equivalente português corrente para o material vegetal usado na fabricação dos tijolos.
- source_word: אֵין נִתָּן
  choice: não se dá
  rationale: A construção impessoal traduz com naturalidade a expressão existencial negativa acompanhada do particípio passivo, indicando que a palha não está sendo fornecida.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: aos teus servos / teus servos
  rationale: No discurso dirigido ao faraó, o termo funciona como fórmula respeitosa de autodesignação e também expressa a condição subordinada dos israelitas.
- source_word: לְבֵנִים
  choice: tijolos
  rationale: Equivalente direto e natural no contexto da produção exigida.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: 'nos dizem: “Façam tijolos!”'
  rationale: Mantém o discurso direto e o imperativo plural; repõe 'tijolos', subentendido no hebraico pelo substantivo imediatamente anterior, para clareza em português.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força enfática e demonstrativa da partícula em registro digno e ainda corrente.
- source_word: מֻכִּים
  choice: estão sendo espancados
  rationale: O particípio passivo descreve maus-tratos em curso; a locução progressiva comunica esse aspecto com clareza.
- source_word: וְחָטָאת עַמֶּךָ
  choice: mas a culpa é do teu próprio povo
  rationale: A cláusula hebraica é compacta e difícil. Esta formulação expressa naturalmente a acusação contextual de que a responsabilidade cabe aos agentes do faraó, sem ocultar a leitura mais formal registrada em nota.
theological_decisions:
- issue: Identificação de quem é culpado na cláusula final
  choice: a culpa é do teu próprio povo
  alternative: e o teu povo pecou
  rationale: O contexto favorece uma denúncia contra os egípcios encarregados do trabalho, mas a sintaxe hebraica permanece comprimida; a alternativa formal é preservada em nota, sem transformar a decisão em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a forma de tratamento singular 'tu' na fala dirigida ao faraó e usa 'eis que' para conservar a ênfase do hebraico.
