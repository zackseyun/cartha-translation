base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: pt
  text: 'Então os oficiais dos filhos de Israel foram ao faraó e clamaram: “Por que fazes isso com os teus servos[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teus escravos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então ... foram
  rationale: O wayyiqtol dá continuidade à narrativa. Em português, “Então” explicita naturalmente a sequência, e “foram” combina de modo idiomático com a finalidade expressa por “clamar ao faraó”.
- source_word: שֹׁטְרֵי
  choice: oficiais
  rationale: Designa os administradores israelitas subordinados às autoridades egípcias. “Oficiais” preserva a função reconhecida sem restringi-la ao sentido mais específico de “capatazes”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar literal do hebraico, que neste contexto identifica o povo de Israel.
- source_word: וַיִּצְעֲקוּ
  choice: clamaram
  rationale: O verbo expressa um apelo intenso e aflito, mais forte que um simples pedido.
- source_word: אֶל פַּרְעֹה
  choice: ao faraó
  rationale: A preposição indica a pessoa a quem se dirige o clamor; “clamar ao faraó” é natural e conserva essa direção.
- source_word: לֵאמֹר
  choice: dois-pontos antes da fala
  rationale: O infinitivo hebraico introduz a citação. Em português atual, os dois-pontos cumprem essa função com naturalidade, sem a fórmula redundante “dizendo”.
- source_word: לָמָּה
  choice: Por que
  rationale: Equivalente direto e natural da pergunta causal.
- source_word: תַעֲשֶׂה כֹה
  choice: fazes isso
  rationale: Reproduz de perto “fazes assim/isto”, preservando a referência contextual ao tratamento imposto por faraó sem explicá-la além do hebraico.
- source_word: לַעֲבָדֶיךָ
  choice: com os teus servos
  rationale: “Servos” corresponde ao tom deferente da petição dirigida ao faraó; a construção portuguesa “fazer isso com” comunica naturalmente o alvo da ação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “filhos de Israel” e o tratamento deferente “teus servos”; usa “faraó” com inicial minúscula como título. A forma “fazes” mantém a segunda pessoa presente no hebraico e harmoniza com “teus”.
