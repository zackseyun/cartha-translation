  source_fidelity: A tradução comunica corretamente a sequência temporal, a audiência diante do faraó, a fórmula profética, o nome divino, a ordem de libertação e a finalidade festiva no deserto. A formulação revista torna explícito que eles falaram ao faraó e verte de modo mais idiomático o dativo cultual de לִי.
  naturalness: “Compareceram diante do faraó e lhe disseram” é mais natural e preciso do que “foram à presença do faraó e disseram”. “Celebrem uma festa em minha honra” é uma expressão portuguesa corrente para a celebração cultual dirigida a Yahweh.
  terminology: “Yahweh”, “o Deus de Israel”, “meu povo”, “festa” e “deserto” são adequados. “Festa” preserva o sentido específico de חגג, sem o reduzir a adoração genérica.
