  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: pt
  text: 'Depois disso, Moisés e Arão compareceram diante do faraó e lhe disseram: “Assim diz Yahweh[a], o Deus de Israel: ‘Deixe o meu povo ir, para que celebrem uma festa em minha honra[b] no deserto.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, tradicionalmente traduzido por “SENHOR”.'
    reason: Esclarece a forma hebraica do nome divino e sua tradução tradicional.
  - marker: b
    text: Também pode ser traduzido por “realizem uma festa para mim” ou “celebrem para mim uma festa religiosa”. O verbo hebraico se refere à observância de uma festa.
    reason: Registra alternativas naturais para a expressão cultual hebraica sem reduzir seu sentido a uma adoração genérica.
lexical_decisions:
- source_word: וְאַחַר
  choice: Depois disso
  rationale: Marca a progressão temporal da narrativa sem especificar quanto tempo transcorreu.
- source_word: בָּאוּ
  choice: foram à presença
  rationale: No contexto de uma audiência real, expressa de modo natural que Moisés e Arão compareceram diante do faraó.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula solene e autoritativa usada para introduzir a mensagem divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz de maneira clara e convencional a construção hebraica que identifica Yahweh como Deus de Israel.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Deixe o meu povo ir
  rationale: Transmite naturalmente a ordem dada ao faraó para liberar o povo.
- source_word: וְיָחֹגּוּ לִי
  choice: para que eles celebrem uma festa para mim
  rationale: O verbo hebraico se refere especificamente à celebração de uma festa religiosa; o pronome plural reflete a forma verbal hebraica e retoma os integrantes do povo.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, designa com clareza a região erma para onde o povo deveria ir, sem exigir a ideia de um deserto exclusivamente arenoso.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. A transliteração preserva o caráter de nome próprio, enquanto a alternativa tradicional o substitui por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A fórmula “Assim diz” conserva a solenidade do discurso, enquanto “foram à presença do faraó” explicita naturalmente o contexto de audiência real.
