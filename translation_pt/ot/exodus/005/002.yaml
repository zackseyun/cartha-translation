source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: pt
  text: 'O faraó disse: “Quem é Yahweh, para que eu obedeça à sua voz e deixe Israel partir? Não conheço Yahweh e, além disso, não deixarei Israel partir.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, tradicionalmente traduzido por “o SENHOR”. Outras formas incluem “Yahweh” e “Jeová”.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma corrente em português para o título real egípcio; o artigo torna a expressão natural no contexto narrativo.
- source_word: מִי
  choice: Quem
  rationale: O interrogativo indaga a identidade e preserva o desafio desdenhoso do faraó.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: para que eu obedeça à sua voz
  rationale: שׁמע בְּקוֹל frequentemente significa ouvir com obediência; a formulação mantém a imagem hebraica da voz e comunica o sentido de obedecer.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: deixe Israel partir
  rationale: No contexto do êxodo, שׁלח significa permitir que o povo vá embora; esta expressão é clara e idiomática em português.
- source_word: לֹא יָדַעְתִּי
  choice: Não conheço
  rationale: O perfeito expressa a postura presente do faraó. A tradução preserva tanto a afirmação de desconhecimento quanto a possível nuance de não reconhecer a autoridade.
- source_word: וְגַם
  choice: e, além disso
  rationale: 'Mantém a progressão enfática: o faraó não somente nega conhecer Yahweh, mas acrescenta uma recusa explícita.'
- source_word: לֹא אֲשַׁלֵּחַ
  choice: não deixarei ... partir
  rationale: O imperfeito comunica a decisão firme do faraó, e a repetição mantém a ligação lexical com a ordem anterior.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal sem substituí-lo pelo título “SENHOR”; a nota registra as convenções alternativas.
- issue: Sentido de “não conheço Yahweh”
  choice: Preservar a formulação aberta “Não conheço Yahweh”
  alternative: Não reconheço Yahweh
  rationale: “Conheço” reproduz o sentido básico de ידע e deixa em aberto a tensão entre desconhecimento e recusa em reconhecer a autoridade divina, sem resolver a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Obedeça à sua voz” conserva deliberadamente o idioma hebraico, ainda compreensível em português. O marcador de nota foi colocado após a fala completa, onde esclarece as duas ocorrências de “Yahweh”.
