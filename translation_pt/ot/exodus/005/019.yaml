base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: pt
  text: 'Então os supervisores israelitas viram que estavam em apuros quando lhes disseram: “Não reduzam a quantidade de tijolos exigida de vocês a cada dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: viram
  rationale: Preserva o sentido básico de ראה e, no contexto, comunica também que perceberam a gravidade da situação.
- source_word: שֹׁטְרֵי
  choice: capatazes
  rationale: No contexto, eram supervisores israelitas subordinados à administração egípcia; “capatazes” é claro e específico sem implicar alto cargo oficial.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém de modo transparente a expressão hebraica e sua referência coletiva ao povo de Israel.
- source_word: אֹתָם בְּרָע
  choice: estavam em apuros
  rationale: Reformula naturalmente em português o objeto pronominal e expressa uma situação adversa, não maldade moral.
- source_word: לֵאמֹר
  choice: quando lhes disseram
  rationale: Explicita de forma idiomática que a ordem citada foi dirigida aos capatazes e revelou a situação difícil em que se encontravam.
- source_word: לֹא תִגְרְעוּ
  choice: Não reduzam
  rationale: Transmite com clareza a proibição de diminuir a produção exigida.
- source_word: מִלִּבְנֵיכֶם
  choice: o número de tijolos que vocês fazem
  rationale: Expressa em português natural a quantidade de tijolos atribuída à produção deles; “que vocês fazem” torna clara a relação possessiva idiomática.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: a quantidade exigida a cada dia
  rationale: Traduz o idiomatismo hebraico como a cota diária requerida, preservando tanto a exigência quanto a recorrência diária.
