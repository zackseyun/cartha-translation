base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: pt
  text: 'E os capatazes israelitas, que os feitores do faraó haviam colocado sobre eles, foram espancados. Os feitores perguntaram: “Por que vocês não completaram sua cota de tijolos, como antes,[a] nem ontem nem hoje?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “como ontem e anteontem”, expressão que significa “como antes” ou “como antigamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: foram espancados
  rationale: O passivo de נכה indica castigo físico; “espancados” comunica repetição ou severidade sem especificar um instrumento.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: os capatazes israelitas
  rationale: No contexto do trabalho forçado, eram subordinados israelitas encarregados das equipes; “capatazes” expressa essa função com clareza.
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: que os feitores do faraó haviam colocado sobre eles
  rationale: “Feitores” designa os agentes egípcios que impunham o trabalho, distinguindo-os dos capatazes israelitas; o mais-que-perfeito composto preserva a anterioridade da nomeação.
- source_word: לֵאמֹר
  choice: Os feitores perguntavam
  rationale: O infinitivo quotativo introduz as palavras dos agentes do faraó. A explicitação natural do sujeito evita que, em português, a pergunta seja atribuída por engano aos israelitas espancados.
- source_word: מַדּוּעַ לֹא כִלִּיתֶם
  choice: Por que vocês não completaram
  rationale: A pergunta direta e o verbo “completar” expressam o não cumprimento integral da exigência.
- source_word: חָקְכֶם לִלְבֹּן
  choice: sua cota de tijolos
  rationale: חֹק é a quantidade prescrita; junto do infinitivo “fazer tijolos”, a expressão portuguesa natural é “cota de tijolos”.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: como antes
  rationale: A expressão idiomática remete à prática anterior ou costumeira, não apenas a dois dias específicos.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: nem ontem nem hoje
  rationale: Sob a negação da pergunta, a correlação hebraica גַּם...גַּם é expressa naturalmente em português por “nem... nem”, mantendo ambos os períodos em foco.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário funcional que distingue os supervisores egípcios (“feitores”) dos responsáveis israelitas pelas equipes (“capatazes”). A pontuação divide a longa estrutura hebraica para evitar ambiguidade de sujeito. O marcador [a] aparece imediatamente após a expressão explicada.
