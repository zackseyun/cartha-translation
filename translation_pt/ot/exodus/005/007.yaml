translation:
  language: pt
  text: “Não continuem dando palha ao povo para fazer tijolos, como antes[a]. Que eles vão e recolham palha para si mesmos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como ontem e anteontem”, expressão idiomática que significa “como antes” ou “anteriormente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן
  choice: Não continuem
  rationale: A forma hifil de יסף com a negação indica a interrupção de uma prática anterior. “Não continuem” transmite com naturalidade a ordem de deixar de fornecer a palha.
- source_word: לָתֵת
  choice: dando
  rationale: נתן é o verbo comum para “dar”. O gerúndio liga naturalmente a ação à expressão “não continuem”.
- source_word: תֶּבֶן
  choice: palha
  rationale: É a designação corrente do material vegetal usado na fabricação de tijolos e mantém a repetição lexical do hebraico.
- source_word: לָעָם
  choice: ao povo
  rationale: עם significa literalmente “povo”. A tradução evita restringir o referente a “trabalhadores”, embora o contexto mostre que se trata da mão de obra israelita.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: para fazer tijolos
  rationale: O infinitivo com objeto expressa finalidade; esta formulação é clara e natural em português.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: como antes
  rationale: A expressão idiomática, literalmente ligada aos dias anteriores, significa “anteriormente” ou “como antes”. A forma literal é preservada em nota.
- source_word: הֵם יֵלְכוּ
  choice: Que eles mesmos vão
  rationale: O pronome independente dá ênfase ao sujeito, e o imperfeito tem força diretiva no contexto. “Eles mesmos” explicita naturalmente o contraste com o fornecimento feito por outros.
- source_word: וְקֹשְׁשׁוּ
  choice: buscar
  rationale: קשש descreve recolher ou juntar material espalhado. “Buscar” funciona naturalmente com “palha” neste contexto e abrange a ação de ir obtê-la.
- source_word: לָהֶם
  choice: eles mesmos
  rationale: O dativo indica que deverão obter a palha por conta própria. Em português, a ideia é expressa de modo natural por “eles mesmos”.
