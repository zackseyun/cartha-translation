  rationale: A revisão substitui «ficar repugnante» por «feder», que preserva o campo semântico concreto de cheiro/odor e a força da metáfora hebraica. O restante do texto já traduz adequadamente a sintaxe, os pronomes e a força imprecativa do versículo.
