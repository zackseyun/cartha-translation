  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: pt
  text: 'E disseram a eles: “Que Yahweh olhe para vocês e julgue, pois vocês fizeram o nosso cheiro feder[a] aos olhos do faraó e aos olhos dos seus servos, pondo-lhes uma espada na mão para nos matar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “fizeram o nosso cheiro feder”; isto é, “fizeram com que nos tornássemos repugnantes” ou “nos deixaram malvistos”.'
    reason: Explica a metáfora hebraica preservada no texto e apresenta equivalentes idiomáticos sem substituir sua vivacidade.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: E disseram a eles
  rationale: Mantém o fluxo narrativo do waw consecutivo e preserva o pronome hebraico, cujo referente contextual é Moisés e Arão, sem inserir os nomes no texto.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: Que Yahweh olhe para vocês e julgue
  rationale: Os dois imperfeitos têm força volitiva numa invocação de juízo. A formulação portuguesa transmite o pedido de que Yahweh observe a conduta deles e julgue.
- source_word: אֲשֶׁר
  choice: pois
  rationale: Introduz naturalmente em português a razão da invocação, preservando sua força causal.
- source_word: הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: fizeram o nosso cheiro ficar repugnante
  rationale: Conserva a imagem concreta e enfática do hebraico, literalmente ligada a tornar mau ou malcheiroso o odor, sem reduzi-la diretamente a uma paráfrase como “arruinaram nossa reputação”.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: aos olhos do faraó e aos olhos dos seus servos
  rationale: Preserva a repetição e o idioma hebraico de avaliação ou percepção, que também é inteligível e digno em português.
- source_word: לָתֵת חֶרֶב בְּיָדָם
  choice: pondo-lhes uma espada na mão
  rationale: Expressa o resultado da ação e mantém a figura de fornecer ao faraó e aos seus servos o meio ou a oportunidade de matar; o singular coletivo “espada” acompanha o hebraico.
- source_word: לְהָרְגֵנוּ
  choice: para nos matar
  rationale: Tradução direta, clara e atual do infinitivo com sufixo de primeira pessoa do plural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Força de יֵרֶא ... וְיִשְׁפֹּט
  choice: 'invocação volitiva: “Que Yahweh olhe ... e julgue”'
  alternative: 'declaração futura: “Yahweh olhará ... e julgará”'
  rationale: No contexto, os oficiais apelam a Yahweh contra Moisés e Arão. A leitura volitiva explica naturalmente a coordenação dos imperfeitos, sem especificar antecipadamente qual sentença divina seria proferida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se a repetição “aos olhos” e a metáfora do cheiro para conservar a força literária do hebraico; “vocês” oferece clareza internacional com naturalidade no Brasil.
