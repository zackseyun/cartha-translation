    issue: A expressão «ficar repugnante» não traduz com precisão a imagem de odor em הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ.
    rationale: O verbo hebraico tem o sentido concreto de “feder/tornar fétido”. «Repugnante» pode descrever algo ofensivo em geral, mas já não preserva especificamente a imagem do cheiro. «Fizeram o nosso cheiro feder» conserva a construção deliberadamente vívida do original.
  revised_text: 'E disseram a eles: “Que Yahweh olhe para vocês e julgue, pois vocês fizeram o nosso cheiro feder[a] aos olhos do faraó e aos olhos dos seus servos, pondo-lhes uma espada na mão para nos matar.”'
