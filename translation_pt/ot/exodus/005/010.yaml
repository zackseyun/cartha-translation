  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: pt
  text: 'Então os capatazes do povo e seus encarregados[a] saíram e disseram ao povo: “Assim diz o faraó: ‘Não vou fornecer palha a vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus oficiais”. O termo hebraico pode designar autoridades subordinadas pertencentes ao próprio povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: capatazes
  rationale: No contexto do trabalho forçado no Êxodo, o termo designa os supervisores que impunham as cotas de produção. “Capatazes” comunica de modo natural a autoridade coercitiva exercida sobre os trabalhadores.
- source_word: שֹׁטְרָיו
  choice: seus encarregados
  rationale: O sufixo remete coletivamente ao povo, e o termo indica auxiliares subordinados ligados à administração do trabalho. “Encarregados” preserva essa função sem especificá-la em excesso.
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: Tradução direta do verbo de movimento, adequada à saída da presença do faraó para a comunicação da ordem ao povo.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente coletivo direto; no contexto, refere-se à população israelita submetida ao trabalho.
- source_word: לֵאמֹר
  choice: disseram
  rationale: Em português corrente, a introdução idiomática do discurso direto expressa naturalmente a função do infinitivo hebraico “dizendo”.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula formal de mensageiro e o presente convencional da proclamação.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada para o título real egípcio; o artigo torna a expressão natural em português.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Não vou mais fornecer
  rationale: A construção com particípio expressa a recusa vigente do faraó. “Não vou mais fornecer” comunica naturalmente que o fornecimento anteriormente existente cessa a partir dessa ordem, conforme o contexto imediato.
- source_word: תֶּבֶן
  choice: palha
  rationale: Equivalente português comum para o material empregado na fabricação dos tijolos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Capatazes” mantém a força opressiva do contexto; “encarregados” distingue os auxiliares israelitas sem impor uma função técnica mais estreita. A fala do faraó foi colocada como citação interna para deixar claro que os capatazes e encarregados estão transmitindo suas palavras.
