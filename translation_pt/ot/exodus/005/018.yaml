source:
  edition: WLC
  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: pt
  text: Agora, vão trabalhar! Não lhes será dada palha, mas vocês terão de entregar a quantidade exigida de tijolos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cota de tijolos”. O hebraico תֹכֶן se refere a uma quantidade fixa ou medida exigida dos trabalhadores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a ordem conclusiva com força transitiva e enfática; “Agora” é natural e preserva bem o movimento do discurso.
- source_word: לְכוּ
  choice: vão
  rationale: Imperativo plural de הלך; a forma simples comunica de modo direto a ordem de partir e retomar o trabalho.
- source_word: עִבְדוּ
  choice: trabalhar
  rationale: Neste contexto, refere-se ao trabalho forçado imposto aos israelitas, não ao serviço cultual.
- source_word: וְתֶבֶן
  choice: mas ... palha
  rationale: 'A conjunção assume valor adversativo no contexto: eles devem trabalhar, embora a palha não lhes seja fornecida.'
- source_word: יִנָּתֵן לָכֶם
  choice: Não lhes será dada
  rationale: Mantém a voz passiva e o sentido direto de נתן com a negação.
- source_word: תֹכֶן
  choice: a quantidade exigida
  rationale: O substantivo indica uma quantidade medida ou fixada que os trabalhadores tinham de cumprir; esta formulação é clara em português moderno sem eliminar a ideia de exigência.
- source_word: לְבֵנִים
  choice: de tijolos
  rationale: Explicita naturalmente em português a relação construta com תֹכֶן.
- source_word: תִּתֵּנוּ
  choice: vocês terão de entregar
  rationale: Embora literalmente seja “vocês darão”, no contexto significa fornecer a produção exigida; “terão de entregar” expressa tanto a obrigação quanto a prestação do resultado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo já indicado pelas formas verbais hebraicas. A exclamação após a ordem reproduz sua força sem recorrer a linguagem excessivamente coloquial.
