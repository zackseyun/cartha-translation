  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: pt
  text: 'Mas ele disse: “Vocês são ociosos, ociosos![a] Por isso dizem: ‘Vamos e ofereçamos sacrifícios a Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete “ociosos” para dar ênfase; também pode ser traduzido: “preguiçosos, muito preguiçosos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ele disse
  rationale: O waw consecutivo dá sequência à narrativa, enquanto “mas” expressa naturalmente o contraste contextual da resposta do faraó à queixa.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Vocês são preguiçosos, preguiçosos!
  rationale: נִרְפִּים acusa os israelitas de indolência ou falta de disposição para o trabalho. A repetição hebraica foi mantida para preservar a ênfase e o tom cortante da acusação.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: A locução apresenta a inferência alegada pelo faraó e é clara e natural em português atual.
- source_word: אֹמְרִים
  choice: dizem
  rationale: O particípio tem função verbal presente no discurso direto; “dizem” reproduz essa função com concisão.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Vamos oferecer sacrifícios
  rationale: Os dois cohortativos exprimem uma ação proposta. A formulação idiomática em português comunica o impulso exortativo sem tornar a fala artificial.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário do sacrifício, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” torna explícito que o faraó se dirige ao grupo. A repetição enfática do original foi preservada, e a fala citada foi formulada de modo idiomático sem apagar a força cohortativa.
