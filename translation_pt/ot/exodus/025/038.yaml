translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a ordem e a concisão do hebraico, usando o futuro normativo “serão”. Os possessivos explicitam que ambos os utensílios pertencem ao candelabro.
