  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: pt
  text: Suas pinças[a] e seus recipientes para brasas[b] serão de ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aparadores de pavio”; o termo hebraico se refere a um utensílio usado para agarrar ou aparar, associado ao candelabro.
    reason: lexical_alternative
  - marker: b
    text: Ou “bandejas” ou “braseiros”; menos provavelmente neste contexto, “incensários”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: as suas pinças
  rationale: O substantivo designa um utensílio para agarrar ou aparar, associado ao candelabro. “Pinças” é natural em português e preserva a função geral sem especificar em excesso que servia para aparar pavios.
- source_word: מַחְתֹּתֶיהָ
  choice: os seus braseiros
  rationale: O termo costuma designar recipientes usados para brasas ou fogo. “Braseiros” conserva aqui o sentido de utensílios cultuais para brasas, enquanto “incensários” seria específico demais.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: A expressão indica diretamente o material de que os utensílios seriam feitos; esta formulação é clara e idiomática em português.
- source_word: וּ
  choice: e
  rationale: A conjunção prefixada coordena os dois tipos de utensílio.
- source_word: ־הָ
  choice: suas / seus
  rationale: O sufixo pronominal feminino singular retoma o candelabro; em português, o possessivo concorda com cada utensílio possuído.
