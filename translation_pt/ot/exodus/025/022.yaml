base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: pt
  text: Ali me encontrarei com você e falarei com você, de cima do propiciatório[a], do meio dos dois querubins que estão sobre a arca do testemunho, a respeito de tudo o que eu lhe ordenar para os filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tampa da expiação”. O termo hebraico designa a cobertura de ouro da arca; tradicionalmente, “propiciatório”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para os israelitas” ou “aos filhos de Israel”. O hebraico diz literalmente “aos/para os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: Ali me encontrarei com você
  rationale: O nifal de יעד expressa um encontro marcado ou determinado. A formulação mantém o sentido relacional e retoma naturalmente o lugar descrito.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: e falarei com você
  rationale: A preposição אֵת favorece a ideia de comunicação direta e pessoal, preservada por “com você”.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: de cima do propiciatório
  rationale: מֵעַל indica de onde procede a fala divina. “Propiciatório” é o termo bíblico tradicional em português para a peça de ouro que cobria a arca, enquanto a nota esclarece seu sentido concreto.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: do meio dos dois querubins
  rationale: Reproduz de modo claro a localização entre os dois seres celestiais; “querubins” é a forma portuguesa consagrada.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: que estão sobre a arca do testemunho
  rationale: Mantém a relação espacial e traduz formalmente הָעֵדֻת sem explicitar “tábuas”, elemento não declarado neste verso.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: a respeito de tudo o que eu lhe ordenar
  rationale: “A respeito de” integra o objeto de “falarei” em português natural, e “tudo” preserva a abrangência de כָּל.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Preserva tanto a orientação das ordens a Israel quanto a expressão familiar masculina do hebraico; outras construções idiomáticas são registradas em nota.
theological_decisions:
- issue: Sentido cultual de הַכַּפֹּרֶת
  choice: propiciatório
  alternative: tampa da expiação; cobertura
  rationale: “Propiciatório” mantém o referente cultual específico e a continuidade terminológica bíblica em português. A nota evita que o termo tradicional esconda o sentido concreto de tampa ou cobertura da arca.
- issue: Expressão nacional בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A tradução conserva a imagem genealógica do hebraico sem negar que a expressão designa coletivamente o povo inteiro.
- issue: Relação sintática de אֶל בְּנֵי יִשְׂרָאֵל
  choice: ordenar para os filhos de Israel
  alternative: ordenar que você transmita aos filhos de Israel; ordenar aos filhos de Israel
  rationale: O hebraico é conciso e permite entender que as ordens dadas a Moisés se destinam a Israel. A tradução mantém essa concisão sem acrescentar explicitamente o ato de transmissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se os termos bíblicos tradicionais “propiciatório”, “querubins” e “arca do testemunho”, acompanhando o termo menos transparente de nota explicativa. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
