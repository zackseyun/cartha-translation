lexical_decisions:
- source_word: תְּכֵלֶת
  choice: tecidos azuis
  rationale: O termo designa material têxtil tingido de azul ou azul-violeta. “Tecidos azuis” comunica tanto a cor quanto a natureza do material nesta lista de ofertas.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Designa um material têxtil tingido de púrpura, de alto valor. O substantivo de cor funciona naturalmente em coordenação com “tecidos”.
- source_word: תוֹלַעַת שָׁנִי
  choice: escarlates
  rationale: A expressão refere-se metonimicamente ao material tingido de escarlate com corante obtido de insetos. A tradução apresenta o resultado visível, enquanto a nota conserva a imagem literal.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: No contexto dos materiais do tabernáculo, o termo indica linho de boa qualidade; “linho fino” é claro, corrente e contextualmente preciso.
- source_word: עִזִּים
  choice: pelos de cabra
  rationale: O hebraico diz literalmente “cabras”, mas, nesta lista de materiais têxteis, refere-se aos pelos usados na tecelagem das coberturas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. “Tecidos” explicita o material implícito nos três termos de cor e evita uma enumeração abstrata. A forma fragmentária e enumerativa do versículo foi mantida, com ponto e vírgula por integrar uma lista mais ampla.
