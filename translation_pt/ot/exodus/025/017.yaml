base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: pt
  text: Faça um propiciatório[a] de ouro puro, com dois côvados e meio de comprimento e um côvado e meio de largura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tampa da expiação”. O termo hebraico כַּפֹּרֶת designa a cobertura de ouro colocada sobre a arca e está relacionado à raiz כפר, associada à expiação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com conjunção, neste contexto de instruções para o santuário, tem força diretiva. O imperativo em português transmite essa força de modo natural e claro.
- source_word: כַפֹּרֶת
  choice: propiciatório
  rationale: O termo designa especificamente a cobertura de ouro colocada sobre a arca e está ligado à raiz כפר, associada à expiação. “Propiciatório” é a designação bíblica tradicional e reconhecível em português; uma alternativa mais transparente é registrada em nota.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: A formulação expressa com naturalidade tanto o material quanto sua qualidade, sem acrescentar ao hebraico.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dois côvados e meio
  rationale: Preserva a antiga unidade de medida e reproduz com precisão a quantidade indicada no hebraico.
- source_word: אָרְכָּהּ
  choice: de comprimento
  rationale: O sufixo feminino remete ao propiciatório. Na construção portuguesa com “com”, a expressão comunica de modo conciso a dimensão longitudinal.
- source_word: וְאַמָּה וָחֵצִי
  choice: e um côvado e meio
  rationale: Mantém a medida antiga e o paralelismo com a primeira dimensão.
- source_word: רָחְבָּהּ
  choice: de largura
  rationale: Traduz de modo direto a dimensão transversal indicada pelo substantivo com sufixo feminino.
theological_decisions:
- issue: Tradução de כַפֹּרֶת em contexto cultual e teologicamente significativo
  choice: propiciatório
  alternative: tampa da expiação; cobertura
  rationale: O substantivo nomeia a peça de ouro que cobria a arca e está lexicalmente relacionado à expiação. “Propiciatório” conserva a designação bíblica tradicional do objeto, enquanto a nota apresenta uma alternativa que torna mais transparente sua forma e associação cultual, sem reduzir o termo a uma tampa genérica nem decidir além do que o hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo “Faça” evita a rigidez de “farás”, enquanto “propiciatório” preserva o vocabulário cultual reconhecível. As medidas antigas foram mantidas sem conversão.
