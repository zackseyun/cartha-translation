base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: pt
  text: Revista-a de ouro puro; revista-a por dentro e por fora e faça ao redor dela uma moldura de ouro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um aro de ouro” ou “uma borda de ouro”; tradicionalmente, “uma coroa de ouro”. O termo hebraico זֵר indica um acabamento ornamental ao redor do objeto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: revista-a / você a revestirá
  rationale: Neste contexto de fabricação do santuário, צפה indica cobrir a arca com uma camada de metal. “Revestir” comunica com precisão essa aplicação de ouro e preserva a repetição do hebraico.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: A expressão designa ouro refinado, sem mistura, e “ouro puro” é a formulação natural e consagrada em português atual.
- source_word: מִבַּיִת וּמִחוּץ
  choice: por dentro e por fora
  rationale: A formulação idiomática em português expressa claramente as superfícies interior e exterior e mantém o paralelismo do hebraico.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: Faça ao redor dela
  rationale: O imperativo mantém a sequência de instruções dirigida a uma só pessoa. O pronome feminino concorda naturalmente com “arca” em português; a ideia de colocação sobre a arca é expressa pela moldura feita ao redor dela.
- source_word: זֵר זָהָב
  choice: uma moldura de ouro
  rationale: זֵר designa aqui um acabamento elevado ou ornamental que contorna o móvel. “Moldura” é claro no contexto de marcenaria e evita a imagem enganosa de uma coroa usada na cabeça.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa que a moldura contornava a arca por todos os lados, em linguagem natural.
theological_decisions: []
translation_notes:
