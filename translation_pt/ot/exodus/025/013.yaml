  text: Faça varas de madeira de acácia e revista-as de ouro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força de ordem. O imperativo em português transmite essa força de modo natural e direto.
- source_word: בַדֵּי
  choice: varas
  rationale: Designa as varas usadas para transportar a arca. “Varas” é claro, corrente e adequado ao contexto.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: 'A cadeia construta indica o material: madeira de acácia. A formulação é transparente para leitores modernos.'
- source_word: וְצִפִּיתָ
  choice: e revista
  rationale: O verbo indica cobrir uma superfície com outro material. “Revestir de ouro” é idiomático e preciso no contexto artesanal.
- source_word: אֹתָם
  choice: -as
  rationale: O pronome objeto retoma o substantivo plural feminino “varas” em português.
- source_word: זָהָב
  choice: de ouro
  rationale: Com o verbo “revestir”, a construção idiomática portuguesa é “revestir de ouro”, expressando corretamente o material da cobertura.
