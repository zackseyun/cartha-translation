  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: pt
  text: E você colocará na arca o testemunho que eu lhe darei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais especificamente neste contexto: “as tábuas do testemunho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: E você colocará
  rationale: Embora נתן possa significar “dar”, com אֶל e um recipiente indica aqui a ação de pôr ou colocar algo dentro dele. “Colocará” é natural e mantém o valor futuro da forma verbal.
- source_word: אֶל
  choice: na
  rationale: Com o verbo “colocar” e o substantivo “arca”, a contração “na” expressa idiomaticamente a colocação no interior do recipiente; o sentido contextual equivale a “dentro da”.
- source_word: הָאָרֹן
  choice: a arca
  rationale: “Arca” é o termo consagrado e contextualmente adequado para o cofre sagrado do tabernáculo, sem reduzir sua significação cultual a uma simples caixa.
- source_word: אֵת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: אֵת assinala o objeto direto definido e não requer uma palavra correspondente em português.
- source_word: הָעֵדֻת
  choice: o testemunho
  rationale: A tradução preserva o termo hebraico sem explicitar no texto principal que se trata das tábuas, identificação fornecida pelo contexto mais amplo.
- source_word: אֲשֶׁר
  choice: que
  rationale: “Que” introduz naturalmente a oração relativa em português contemporâneo.
- source_word: אֶתֵּן
  choice: eu lhe darei
  rationale: O imperfeito qal na primeira pessoa do singular aponta naturalmente para a ação futura de Deus; “darei” conserva o sentido básico de נתן neste segundo uso.
- source_word: אֵלֶיךָ
  choice: lhe
  rationale: O pronome “lhe” expressa de modo conciso o destinatário singular daquilo que Deus dará.
theological_decisions:
- issue: Referente de “o testemunho”
  choice: Manter a designação genérica “o testemunho” no texto principal.
  alternative: Explicitar “as tábuas do testemunho”.
  rationale: O hebraico deste versículo diz apenas “o testemunho que eu lhe darei”. Embora o contexto posterior o associe às tábuas, explicitar isso no texto principal restringiria mais do que a formulação deste versículo; a nota oferece a identificação contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção conserva a coordenação inicial do hebraico e evita terminologia denominacional. O marcador [a] aparece no texto principal.
