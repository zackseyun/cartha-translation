base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: pt
  text: Faça dois querubins de ouro, feitos a martelo; faça-os nas duas extremidades da tampa da expiação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “propiciatório”. O termo hebraico designa a tampa da arca, associada ao rito de expiação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito qal com waw, neste contexto de instruções, tem força de ordem sequencial. “Faça também” soa natural em português e mantém a ligação com as instruções anteriores.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: dois querubins
  rationale: Mantém o numeral e o termo tradicional para as criaturas celestiais, sem recorrer a imagens populares associadas a “anjinhos”.
- source_word: זָהָב
  choice: de ouro
  rationale: Expressa naturalmente em português o material de que os querubins deveriam ser feitos.
- source_word: מִקְשָׁה
  choice: de obra batida
  rationale: Designa metal moldado a martelo. A formulação preserva o processo de fabricação sem acrescentar explicitamente “de uma só peça”, embora o contexto possa sugerir integração com a tampa.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: faça-os
  rationale: Conserva a repetição do verbo presente no hebraico e destaca a maneira de execução.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: nas duas extremidades
  rationale: Traduz de modo idiomático a relação espacial, sem decidir além do necessário se as figuras surgiam integralmente da tampa ou apenas ficavam posicionadas em suas extremidades.
- source_word: הַכַּפֹּרֶת
  choice: a tampa da expiação
  rationale: Identifica o objeto como a tampa da arca e torna perceptível sua associação cultual com a expiação. Evita a possível impressão, produzida por “propiciatório”, de que se trata de um assento literal.
theological_decisions:
- issue: Tradução de הַכַּפֹּרֶת no contexto do santuário
  choice: a tampa da expiação
  alternative: o propiciatório; a tampa
  rationale: “Tampa da expiação” comunica tanto a forma concreta do objeto quanto sua função cultual, sem impor uma teoria específica da expiação. A alternativa tradicional é registrada em nota para preservar a continuidade terminológica.
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa adequada a instruções. “Querubins” preserva a terminologia bíblica tradicional; “obra batida” mantém o caráter técnico sem linguagem excessivamente especializada.
