lexical_decisions:
- source_word: וְ/זֹאת
  choice: E esta é
  rationale: Preserva a conjunção e a força apresentativa do demonstrativo, com formulação natural em português.
- source_word: הַ/תְּרוּמָה
  choice: a contribuição
  rationale: No contexto, designa materiais separados e entregues para uso sagrado; “contribuição” comunica a coleta sem impor uma nuance ritual mais específica.
- source_word: אֲשֶׁר תִּקְח֖וּ מֵ/אִתָּם
  choice: que vocês receberão deles
  rationale: Embora לקח signifique literalmente “tomar”, em uma coleta de contribuições “receber” expressa naturalmente a ação autorizada sem sugerir apropriação coercitiva. O plural “vocês” preserva a segunda pessoa plural.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto e corrente do termo hebraico.
- source_word: וָ/כֶסֶף
  choice: prata
  rationale: Equivalente direto e corrente na lista de metais.
- source_word: וּ/נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos materiais do santuário, “bronze” é a designação tradicional e provável do metal trabalhado, embora o termo hebraico também possa indicar cobre.
