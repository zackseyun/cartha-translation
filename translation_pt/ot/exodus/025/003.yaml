  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: pt
  text: 'E esta é a contribuição que vocês devem tomar deles: ouro, prata e bronze.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”; o hebraico נְחֹשֶׁת pode designar cobre ou bronze, conforme o contexto.
