base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: pt
  text: Conforme tudo o que estou mostrando a você — o modelo[a] do tabernáculo e o modelo de todos os seus utensílios — assim vocês o farão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “planta”, “padrão” ou “projeto”.
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “farão” está no plural; a ordem inclui Moisés e os responsáveis pela execução do trabalho.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo exatamente de acordo com o que
  rationale: A construção כְּ com כֹּל אֲשֶׁר indica correspondência abrangente e precisa. A formulação portuguesa comunica tanto a totalidade quanto a exigência de conformidade rigorosa.
- source_word: מַרְאֶה
  choice: estou mostrando
  rationale: O particípio de ראה tem aqui força presente e durativa no contexto da revelação dada a Moisés.
- source_word: תַּבְנִית
  choice: modelo
  rationale: תַּבְנִית pode indicar forma, modelo, padrão ou projeto. “Modelo” é natural neste contexto e preserva a possibilidade de uma forma revelada sem afirmar que se tratava necessariamente de uma miniatura física.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Embora ligado lexicalmente à ideia de habitação, מִשְׁכָּן é o termo consagrado e claro para a tenda-santuário em Êxodo.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כֵּלִים abrange objetos, recipientes e instrumentos. “Utensílios” é uma designação coletiva compreensível para os objetos usados e instalados no santuário.
- source_word: וְכֵן
  choice: Façam tudo dessa maneira
  rationale: וְכֵן retoma o modo indicado e introduz a ordem correspondente. A frase explícita em português preserva a retomada enfática do hebraico.
- source_word: תַּעֲשׂוּ
  choice: Façam
  rationale: A forma verbal está na segunda pessoa masculina plural. “Façam” preserva o número plural, embora a revelação imediatamente anterior seja dirigida a Moisés no singular.
theological_decisions:
- issue: Se תַּבְנִית deve declarar explicitamente a existência de um arquétipo celestial
  choice: modelo
  alternative: planta, padrão ou projeto
  rationale: O versículo diz que Deus mostra a Moisés uma תַּבְנִית, mas não define expressamente sua natureza ontológica. “Modelo” mantém aberta a possibilidade de um padrão revelado sem acrescentar uma afirmação teológica mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção legível no Brasil. A alternância entre “a você” no singular e “façam” no plural reproduz a mudança de número presente no hebraico, esclarecida em nota. “Tabernáculo” mantém a terminologia bíblica estabelecida.
