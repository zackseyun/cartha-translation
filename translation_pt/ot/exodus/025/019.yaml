  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: pt
  text: Faça um querubim numa extremidade e outro querubim na outra extremidade[a]; da própria tampa da expiação vocês farão os querubins, nas duas extremidades dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais explicitamente: “Façam os querubins de uma só peça com a tampa da expiação, um em cada extremidade”. A preposição hebraica traduzida adiante por “da própria” indica que os querubins deveriam ser formados da tampa, e não feitos separadamente e depois fixados nela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Faça
  rationale: O imperativo singular dá continuidade à sequência de instruções. Em português, a conjunção inicial pode ser omitida para maior naturalidade sem perder a força da ordem.
- source_word: כְּרוּב ... וּכְרוּב
  choice: um querubim ... outro querubim
  rationale: As formas singulares designam individualmente cada figura. A correlação 'um... outro' reproduz com naturalidade a simetria da instrução.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: numa extremidade ... na outra extremidade
  rationale: Embora a construção hebraica contenha a preposição מִן, aqui as duas expressões identificam a localização contrastante das figuras, uma em cada ponta.
- source_word: מִן הַכַּפֹּרֶת
  choice: da própria tampa da expiação
  rationale: כַּפֹּרֶת designa a tampa da arca associada ao rito de expiação. A expressão 'da própria' comunica que os querubins deveriam ser formados a partir dela, e não fabricados separadamente.
- source_word: תַּעֲשׂוּ
  choice: vocês farão
  rationale: O imperfeito na segunda pessoa masculina plural passa a dirigir a instrução ao grupo encarregado da execução; o futuro tem valor diretivo natural em português.
- source_word: הַכְּרֻבִים
  choice: os querubins
  rationale: '''Querubins'' é o plural técnico consagrado e inteligível em português.'
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: nas duas extremidades dela
  rationale: עַל tem aqui sentido espacial, e o sufixo singular retoma a tampa da expiação; o pronome feminino explicita esse referente em português.
theological_decisions:
- issue: Sentido de כַּפֹּרֶת
  choice: tampa da expiação
  alternative: propiciatório
  rationale: '''Tampa da expiação'' preserva tanto a natureza física do objeto como sua associação cultual com a expiação, em linguagem atual. ''Propiciatório'' é tradicional, mas menos transparente e pode resolver em favor de uma formulação teológica mais específica a amplitude do termo hebraico.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A alternância entre o imperativo singular 'Faça' e o plural 'vocês farão' preserva a mudança de número presente no hebraico. A nota esclarece a relação material indicada por מִן sem sobrecarregar o texto principal.
