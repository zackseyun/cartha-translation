  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: pt
  text: E um botão sob dois braços que saem dela, e um botão sob dois braços que saem dela, e um botão sob dois braços que saem dela, para os seis braços que saem do candelabro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: botão
  rationale: Designa uma saliência ornamental arredondada no candelabro; “botão” é claro em português e preserva a imagem arquitetônica sem especificar uma forma floral não expressa neste verso.
- source_word: קָנִים
  choice: braços
  rationale: No contexto do candelabro, são as seis extensões laterais; “braços” é mais natural e visualmente preciso do que o sentido lexical genérico “ramos”.
- source_word: מְנֹרָה
  choice: candelabro
  rationale: Termo tradicional e amplamente compreensível para o objeto de iluminação descrito, sem transliterar desnecessariamente o hebraico.
- source_word: מִמֶּנָּה / מִן הַמְּנֹרָה
  choice: que saem dela / que saem do candelabro
  rationale: 'Torna explícita a relação indicada pelas preposições hebraicas: os braços procedem do próprio candelabro.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A repetição hebraica foi levemente organizada como primeiro, segundo e terceiro par para comunicar com clareza a disposição estrutural, mantendo os três botões, os pares de braços e o total de seis braços.
