  text: כִּכָּ֛ר זָהָ֥ב טָה֖וֹר יַעֲשֶׂ֣ה אֹתָ֑/הּ אֵ֥ת כָּל הַ/כֵּלִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: pt
  text: Com um talento de ouro puro, ele fará o candelabro[a] e todos estes utensílios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «a fará». O pronome feminino retoma o candelabro mencionado nos versículos anteriores.
    reason: clareza_referencial
lexical_decisions:
- source_word: כִּכָּר
  choice: um talento
  rationale: כִּכָּר designa uma medida padronizada de peso. «Talento» preserva o termo metrológico tradicional e evita substituir a medida antiga por uma estimativa moderna incerta.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: A expressão qualifica o material empregado; «ouro puro» é a formulação natural e precisa em contexto artesanal.
- source_word: יַעֲשֶׂה
  choice: ele fará
  rationale: O verbo é Qal imperfeito na terceira pessoa masculina singular. O futuro em português expressa adequadamente a instrução, e o sujeito permanece implícito no contexto.
- source_word: אֹתָהּ
  choice: o candelabro
  rationale: O pronome objeto feminino singular retoma מְנוֹרָה, «candelabro», no contexto anterior. A explicitação evita o pronome português «a», pouco claro isoladamente, sem acrescentar um referente estranho ao texto.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: e todos estes utensílios
  rationale: כֵּלִים é um termo amplo para objetos, implementos ou recipientes. «Utensílios» é claro neste contexto, e a coordenação com «e» reflete a presença de dois objetos marcados por אֵת.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial «Com um talento de ouro puro» preserva a ênfase do hebraico na quantidade total de material. «Candelabro» mantém a terminologia bíblica corrente; «utensílios» conserva a abrangência lexical de כֵּלִים.
