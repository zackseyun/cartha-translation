  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: pt
  text: Seus botões e seus braços serão feitos dela[a]; toda ela será uma única peça trabalhada a martelo[b], de ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com ela”. O sentido é que os botões e os braços seriam formados como partes integrantes do candelabro, e não fixados separadamente.
    reason: lexical_alternative
  - marker: b
    text: Ou “obra batida”. O hebraico enfatiza que o candelabro inteiro seria moldado a martelo como uma só peça de ouro puro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: seus botões
  rationale: No contexto do candelabro, כפתור designa elementos ornamentais arredondados ligados ao motivo vegetal. “Botões” preserva essa imagem e é mais claro do que termos arquitetônicos ou arcaicos.
- source_word: וּקְנֹתָם
  choice: e seus braços
  rationale: Embora קנה possa significar “cana” ou “haste”, aqui designa os braços que se projetam do candelabro. “Braços” é a designação natural e corrente em português.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: formarão uma só peça com ela
  rationale: A construção indica que os botões e braços procedem do próprio candelabro e são parte integral dele, não peças anexadas. A formulação comunica essa unidade em português natural.
- source_word: כֻּלָּהּ
  choice: ela inteira
  rationale: Mantém a ênfase hebraica na totalidade do candelabro como objeto unificado.
- source_word: מִקְשָׁה אַחַת
  choice: uma única obra feita a martelo
  rationale: מִקְשָׁה descreve metal trabalhado a martelo, e אַחַת destaca a unidade da fabricação. A tradução preserva tanto o processo quanto a ideia de uma peça única.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: É a tradução portuguesa clara e convencional desta expressão hebraica.
