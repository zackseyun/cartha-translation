  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: pt
  text: As varas permanecerão nas argolas da arca[a]; não serão retiradas dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As varas estarão nas argolas da arca; não serão tiradas dela.”'
    reason: Alternativa lexical que preserva de modo mais literal o sentido básico de יִהְיוּ (“estarão”) e uma tradução equivalente de לֹא יָסֻרוּ.
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: nas argolas
  rationale: טַבַּעַת designa as argolas fixadas à arca; בְ indica aqui a posição das varas nelas. “Nas argolas” é natural e exato em português.
- source_word: הָאָרֹן
  choice: da arca
  rationale: No contexto do santuário, אָרוֹן é o objeto sagrado convencionalmente chamado de “arca”, e não apenas um baú genérico.
- source_word: יִהְיוּ
  choice: permanecerão
  rationale: Embora היה signifique literalmente “ser/estar”, a construção, reforçada pela proibição seguinte, comunica a permanência das varas no lugar.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: בַּדִּים são as hastes usadas para transportar a arca. “Varas” é a designação bíblica corrente, clara e natural em português.
- source_word: לֹא יָסֻרוּ
  choice: não serão retiradas
  rationale: סוּר pode significar afastar-se ou ser removido; a formulação passiva expressa naturalmente a proibição de tirar as varas.
- source_word: מִמֶּנּוּ
  choice: dela
  rationale: O sufixo pronominal retoma a arca; “dela” preserva a referência sem repetição desnecessária.
