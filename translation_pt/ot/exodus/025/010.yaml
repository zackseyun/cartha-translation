  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: pt
  text: Farão uma arca[a] de madeira de acácia, com dois côvados e meio de comprimento, um côvado e meio de largura e um côvado e meio de altura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «baú» ou «caixa». O termo hebraico designa um recipiente; «arca» é mantido aqui por se tratar, neste contexto, da arca sagrada da aliança.
    reason: lexical_alternative
  - marker: b
    text: O côvado era uma antiga unidade de comprimento, aproximadamente a distância do cotovelo à ponta dos dedos.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Farão
  rationale: O qal com waw em contexto instrutivo expressa uma ordem para a comunidade; o futuro português transmite naturalmente essa força normativa, e a conjunção inicial é absorvida.
- source_word: אֲרוֹן
  choice: arca
  rationale: Embora o termo hebraico designe um baú ou caixa, «arca» é o termo consagrado e contextualmente adequado para este recipiente sagrado.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: Expressa de modo claro e idiomático o material indicado pela construção hebraica, evitando a transliteração tradicional pouco transparente.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dois côvados e meio
  rationale: Preserva a unidade antiga e representa com naturalidade a medida hebraica.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: Na formulação portuguesa «com ... de comprimento», comunica de modo natural a dimensão indicada pelo substantivo com sufixo possessivo.
- source_word: וְאַמָּה וָחֵצִי
  choice: um côvado e meio
  rationale: Reflete diretamente a construção hebraica de uma unidade mais metade e é corrente em português.
- source_word: רָחְבּוֹ
  choice: de largura
  rationale: É a designação moderna e clara da dimensão horizontal indicada por רֹחַב.
- source_word: קֹמָתוֹ
  choice: de altura
  rationale: Em referência a um objeto, קוֹמָה indica sua dimensão vertical; «altura» é a equivalência natural.
theological_decisions:
- issue: Designação do recipiente sagrado
  choice: arca
  alternative: baú ou caixa
  rationale: Mantém o termo bíblico tradicional sem negar o sentido concreto do hebraico; a alternativa lexical é registrada em nota para não apagar sua amplitude semântica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe dimensional foi naturalizada sem converter a unidade antiga. A informação correta sobre «madeira de acácia» foi incorporada ao texto; não se repetiu como nota separada, pois a alternativa tradicional por transliteração não é necessária para a compreensão.
