base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: pt
  text: Faça para ela quatro argolas de ouro e coloque as argolas nos quatro cantos[a] junto aos seus quatro pés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos quatro lados” ou “nas quatro bordas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas quatro pernas”; a palavra hebraica pode significar “pés” ou “pernas”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força diretiva. O imperativo em português comunica essa função de modo natural e claro.
- source_word: לּוֹ
  choice: para ela
  rationale: O sufixo masculino singular retoma a mesa; em português, o pronome feminino concorda com “mesa”.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: quatro argolas de ouro
  rationale: “Argolas” descreve naturalmente as peças destinadas à passagem das varas, e “de ouro” preserva a indicação do material.
- source_word: וְנָתַתָּ
  choice: e coloque
  rationale: No contexto de instruções de fabricação, “coloque” expressa de forma corrente e precisa o sentido de נתן.
- source_word: עַל
  choice: nos
  rationale: A contração de “em” com o artigo é idiomática para indicar a localização das argolas; o hebraico também admite a noção de “sobre” ou “junto a” conforme a configuração.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: os quatro cantos
  rationale: פֵּאָה pode designar lado, borda ou extremidade; “cantos” é a leitura espacial mais natural neste móvel, sem eliminar as alternativas lexicais registradas em nota.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: junto aos seus quatro pés
  rationale: A construção associa os cantos aos quatro apoios da mesa. “Junto aos” evita uma relativa pesada, e “pés” é idiomático para os apoios de um móvel, embora רֶגֶל também possa significar “perna”.
