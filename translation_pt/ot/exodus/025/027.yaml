  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: pt
  text: As argolas ficarão junto à moldura[a], como receptáculos[b] para as varas, para carregar a mesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente à moldura” ou “em correspondência com a moldura”. A expressão hebraica indica posição relativa, mas não especifica a disposição exata.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para casas para as varas”, isto é, receptáculos ou encaixes nos quais as varas eram introduzidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: junto a
  rationale: A expressão indica posição relativa à moldura, sem definir com precisão a geometria. Em português, “junto a” evita sugerir indevidamente que as argolas ficavam do lado oposto.
- source_word: הַמִּסְגֶּרֶת
  choice: a moldura
  rationale: No contexto da mobília do santuário, designa o elemento estrutural que contorna a mesa; “moldura” é claro e natural em português.
- source_word: תִּהְיֶיןָ
  choice: ficarão
  rationale: O verbo existencial, nesta instrução de construção, descreve onde as argolas deverão estar situadas.
- source_word: הַטַּבָּעֹת
  choice: as argolas
  rationale: Termo usual e concreto para os anéis metálicos destinados a receber as varas.
- source_word: לְבָתִּים
  choice: servindo de suportes
  rationale: Literalmente “como casas”, a expressão designa receptáculos ou encaixes para as varas; “suportes” comunica a função com naturalidade.
- source_word: לְבַדִּים
  choice: para as varas
  rationale: Neste contexto, בַּדִּים são as varas usadas para transportar a mesa.
- source_word: לָשֵׂאת
  choice: com que se carregará
  rationale: O infinitivo expressa a finalidade das varas e é vertido numa construção portuguesa natural.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: Equivalente direto e tradicional para o móvel descrito nesta seção.
