base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: pt
  text: Coloque a tampa da expiação sobre a arca[a] e, dentro da arca, coloque o testemunho que eu lhe darei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «propiciatório». O termo hebraico designa a tampa da arca e tem associações sacrificiais e expiatórias.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: tampa da expiação
  rationale: Designa a tampa da arca e conserva sua associação cultual com a expiação. Em português corrente, é mais transparente que o tradicional «propiciatório», preservado em nota.
- source_word: מִלְמָעְלָה
  choice: sobre
  rationale: Expressa de modo natural a posição da tampa diretamente em cima da arca.
- source_word: עֵדֻת
  choice: testemunho
  rationale: Mantém de perto o termo hebraico e seu sentido de testemunho da aliança, sem acrescentar aqui a especificação «tábuas».
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: coloque / coloque / darei
  rationale: «Colocar» convém à disposição dos objetos; «dar» preserva o sentido natural da ação futura de Deus.
- source_word: אֶל הָאָרֹן
  choice: dentro da arca
  rationale: Embora אֶל frequentemente indique direção, neste contexto a ordem é inserir o testemunho na arca.
theological_decisions:
- issue: Tradução de כַּפֹּרֶת em contexto cultual
  choice: tampa da expiação
  alternative: propiciatório
  rationale: A expressão identifica concretamente a tampa e conserva sua relação com a expiação, sem impor uma formulação doutrinária mais estreita. A alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa natural. A repetição de «arca» e «coloque» acompanha a estrutura enfática do hebraico; «lhe» oferece ampla legibilidade em português, inclusive no Brasil.
