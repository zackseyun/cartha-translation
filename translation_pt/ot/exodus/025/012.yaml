  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: pt
  text: Funda quatro argolas de ouro para ela e coloque-as sobre os seus quatro pés:[a] duas argolas sobre um lado dela e duas argolas sobre o outro lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos seus quatro cantos”. O termo hebraico é difícil, mas provavelmente se refere aos pés ou apoios inferiores da arca, e não simplesmente a cantos abstratos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: Faça ... de ouro fundido
  rationale: No contexto da fabricação de acessórios metálicos, יצק indica fundição. A formulação comunica o processo com naturalidade em português e evita a leitura inadequada de simplesmente derramar ouro.
- source_word: טַבְּעֹת
  choice: argolas
  rationale: O substantivo designa peças anulares destinadas às varas de transporte. “Argolas” é claro e idiomático em português para ferragens fixadas a um objeto.
- source_word: זָהָב
  choice: ouro
  rationale: Designação direta do material.
- source_word: וְנָתַתָּה
  choice: fixe-as
  rationale: Embora נתן seja literalmente amplo, neste contexto as argolas devem ser colocadas e presas à arca. “Fixe-as” expressa com clareza a ação construtiva implícita.
- source_word: פַּעֲמֹתָיו
  choice: seus quatro pés
  rationale: O termo é difícil, mas provavelmente se refere aos pés ou apoios inferiores da arca. “Pés” preserva a imagem concreta sem substituir o termo por uma interpretação abstrata.
- source_word: צַלְעוֹ
  choice: lado
  rationale: Em contextos arquitetônicos e de objetos, צלע significa naturalmente “lado”.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: de um lado ... do outro lado
  rationale: A expressão portuguesa é mais natural que “do segundo lado” e transmite sem perda a distribuição das argolas entre os dois lados.
