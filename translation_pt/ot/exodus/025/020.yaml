base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: pt
  text: Os querubins estenderão as asas para cima, cobrindo o propiciatório[a] com elas; seus rostos estarão voltados uns para os outros. Os rostos dos querubins estarão voltados para o propiciatório.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tampa da expiação”. O termo hebraico kappóret designa a tampa de ouro da arca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: terão / estarão
  rationale: No contexto prescritivo das instruções para o santuário, a forma verbal descreve como os querubins deverão ser feitos e posicionados; o futuro em português expressa isso naturalmente.
- source_word: הַכְּרֻבִים
  choice: os querubins
  rationale: É a forma tradicional e reconhecível em português para o plural de כְּרוּב.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: terão as asas estendidas para cima
  rationale: Reproduz a postura indicada pelo particípio e a orientação espacial de לְמַעְלָה em português claro e natural.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: cobrindo com elas
  rationale: סכך descreve as asas cobrindo ou resguardando o objeto; “com elas” comunica o valor instrumental e evita repetição pesada de “asas”.
- source_word: הַכַּפֹּרֶת
  choice: o propiciatório
  rationale: Termo tradicional em português para a tampa de ouro da arca em seu papel cultual; a nota preserva a alternativa lexical mais concreta.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Estarão de frente um para o outro
  rationale: Transmite naturalmente a expressão distributiva hebraica, segundo a qual cada querubim fica voltado para o outro.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: com o rosto voltado para o propiciatório
  rationale: Mantém a imagem concreta do rosto e especifica sua orientação para o propiciatório, sem redundância desnecessária.
theological_decisions:
- issue: Tradução de כַּפֹּרֶת nas instruções do tabernáculo
  choice: propiciatório
  alternative: tampa da expiação; tampa
  rationale: “Propiciatório” identifica de modo tradicional o objeto cultual, enquanto a nota esclarece que se trata concretamente da tampa de ouro da arca e preserva a alternativa interpretativa ligada à expiação.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação preserva a orientação simultânea dos querubins: um diante do outro e ambos inclinados ou dirigidos para o propiciatório.'
