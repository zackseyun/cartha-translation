lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente essa sequência em português, e “falou” distingue o verbo da fórmula introdutória seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica aqui o destinatário da fala; “a” é a forma natural em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto e mantém sua distinção em relação ao verbo principal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e é uma transliteração provável; a nota registra a forma alternativa tradicional.
translation_notes:
  register: Português moderno, claro e digno, com progressão narrativa natural. Mantém-se a fórmula solene “dizendo”, seguida de dois-pontos por introduzir o discurso dos versículos seguintes.
