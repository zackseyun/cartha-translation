  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: pt
  text: Diga aos filhos de Israel[a] que tragam para mim uma oferta[b]. De todo homem cujo coração o impelir[c], recebam a minha oferta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Israel”, designação tradicional do povo de Israel.'
    reason: cultural_note
  - marker: b
    text: Ou “contribuição”. O termo hebraico se refere a algo separado e entregue para uso sagrado.
    reason: lexical_alternative
  - marker: c
    text: Ou “cujo coração o tornar disposto” ou “cujo coração o estimular”. A expressão hebraica enfatiza uma disposição interior voluntária.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Diga
  rationale: O imperativo piel de דבר significa aqui “falar” ou “dizer”. “Diga aos” é direto e natural em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e pactual hebraica, em vez de substituí-la silenciosamente por “israelitas”.
- source_word: וְיִקְחוּ לִי
  choice: que tragam para mim
  rationale: O verbo após o imperativo tem força diretiva. Neste contexto de coleta, “tragam” comunica naturalmente a entrega da oferta, enquanto “para mim” preserva לִי.
- source_word: תְּרוּמָה
  choice: oferta
  rationale: Designa uma contribuição separada para uso sagrado. “Oferta” preserva sua orientação a Deus sem impor um sentido sacrificial mais específico.
- source_word: מֵאֵת כָּל אִישׁ
  choice: de todo homem
  rationale: Mantém a forma distributiva singular e o termo masculino אִישׁ do hebraico.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: cujo coração o impelir
  rationale: Reproduz a imagem hebraica do coração que leva a pessoa a agir e conserva a ideia de disposição interior voluntária sem acrescentar um advérbio ausente.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: Recebam a minha oferta
  rationale: O plural distingue os responsáveis pela coleta do singular dirigido a Moisés. “Recebam” é idiomático para aceitar contribuições e evita sugerir apropriação coercitiva.
theological_decisions:
- issue: Sentido de תְּרוּמָה na coleta para o santuário
  choice: oferta
  alternative: contribuição
  rationale: “Oferta” mantém o caráter sagrado e dirigido a Deus; “contribuição” também é possível e explicita melhor o aspecto da coleta voluntária.
- issue: Voluntariedade em אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: cujo coração o impelir
  alternative: cujo coração o tornar disposto
  rationale: A tradução conserva a metáfora e a iniciativa interior, sem transformar a voluntariedade em uma qualificação teológica mais explícita do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém “filhos de Israel” e a metáfora do coração; usa “tragam” e “recebam” para expressar com naturalidade a coleta sem perder a força diretiva.
