base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: pt
  text: Faça[a] uma mesa de madeira de acácia, com dois côvados de comprimento, um côvado de largura e um côvado e meio de altura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E você fará”. A conjunção hebraica liga esta instrução às ordens anteriores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O qal perfeito com conjunção, nesta sequência de instruções, tem força diretiva. O imperativo em português comunica essa função de modo natural; a conjunção hebraica é registrada em nota.
- source_word: שֻׁלְחָן
  choice: uma mesa
  rationale: É o termo comum para essa peça do mobiliário do santuário; o artigo indefinido é natural ao introduzi-la.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A cadeia construta designa o material, literalmente madeira proveniente da acácia; esta formulação é clara e corrente em português.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: com dois côvados de comprimento
  rationale: Mantém a unidade cultural do texto-fonte e expressa naturalmente em português a medida nominal, literalmente 'dois côvados, seu comprimento'.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: um côvado de largura
  rationale: Preserva a medida e o substantivo dimensional do hebraico em uma formulação portuguesa fluente.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: um côvado e meio de altura
  rationale: Segue de perto a expressão hebraica e usa 'altura', o equivalente natural de קֹמָה para as dimensões de um móvel.
