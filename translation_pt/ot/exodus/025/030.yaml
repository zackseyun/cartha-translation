base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: pt
  text: E você porá sobre a mesa o pão da Presença diante de mim continuamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «pão da Presença»; tradicionalmente, «pães da proposição».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: E você porá
  rationale: O verbo נתן tem sentido amplo de dar, pôr ou colocar. Neste contexto de instrução cultual, «porá» expressa de modo natural e direto a colocação do pão no lugar determinado.
- source_word: עַל הַ/שֻּׁלְחָן
  choice: sobre a mesa
  rationale: A preposição עַל indica a posição do pão em cima da mesa específica já descrita; «sobre a mesa» é claro e digno em português.
- source_word: לֶחֶם פָּנִים
  choice: o pão da Presença
  rationale: A construção significa literalmente «pão de faces/presença». «Pão da Presença» preserva o termo cultual e sua relação com a presença divina, sem substituí-lo por uma expressão tradicional menos transparente.
- source_word: לְ/פָנַ/י
  choice: diante de mim
  rationale: A expressão significa literalmente «diante da minha face» e, idiomaticamente, «diante de mim». A tradução mantém a fala divina direta e distingue esta frase do nome cultual precedente.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Em contextos sacerdotais, תָּמִיד comunica continuidade ou observância regular permanente. «Continuamente» preserva essa amplitude melhor que uma formulação que especifique uma frequência não declarada.
theological_decisions:
- issue: Termo cultual לֶחֶם פָּנִים
  choice: o pão da Presença
  alternative: os pães da proposição; o pão apresentado; o pão diante da face
  rationale: A opção conserva a imagem hebraica da presença de Deus e evita tanto jargão tradicional pouco transparente quanto uma paráfrase que fundiria a expressão com o subsequente «diante de mim».
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem soar artificial; «você» torna explícito o singular da ordem dirigida a Moisés.
