  text: וְ/עָשִׂ֨יתָ לּ֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וְ/עָשִׂ֧יתָ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: pt
  text: Faça para ela uma borda de um palmo de largura, em toda a volta, e faça uma moldura de ouro ao redor dessa borda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma coroa de ouro ao redor da sua borda”. O termo hebraico זֵר pode designar uma borda ou moldura ornamental; “coroa” é a tradução tradicional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: borda
  rationale: Designa a peça estrutural que contorna a mesa. “Borda” é clara e natural em português, sem especificar além do que o hebraico permite.
- source_word: טֹפַח
  choice: um palmo de largura
  rationale: O substantivo indica a medida de um palmo; acrescentar “de largura” explicita naturalmente a dimensão atribuída à borda.
- source_word: סָבִיב
  choice: em toda a volta / ao redor
  rationale: As duas ocorrências expressam a ideia de algo que circunda. A variação evita rigidez em português sem perder a repetição conceitual.
- source_word: זֵר
  choice: moldura
  rationale: No contexto dos móveis do santuário, refere-se a um acabamento ornamental, provavelmente saliente. “Moldura” comunica melhor essa função ao leitor moderno; a tradução tradicional “coroa” é preservada em nota.
- source_word: זָהָב
  choice: ouro
  rationale: Mantém diretamente o substantivo de material usado no hebraico.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: para ela / dessa borda
  rationale: Os sufixos retomam a mesa e sua borda. Em português, o gênero feminino de “mesa” exige “ela”; “dessa borda” torna inequívoco o referente do segundo sufixo.
- source_word: וְעָשִׂיתָ
  choice: faça
  rationale: O imperativo formal em português transmite com naturalidade a força diretiva da instrução hebraica, mantendo a repetição do verbo.
