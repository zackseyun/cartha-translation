  text: וּ/רְאֵ֖ה וַ/עֲשֵׂ֑ה בְּ/תַ֨בְנִיתָ֔/ם אֲשֶׁר אַתָּ֥ה מָרְאֶ֖ה בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: pt
  text: Veja e faça-os conforme o modelo deles[a], que está sendo mostrado a você no monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenha o cuidado de fazê-los de acordo com o modelo deles, que está sendo mostrado a você no monte.”'
    reason: Alternativa idiomática que explicita a força de advertência de וּרְאֵה e subordina naturalmente a ordem seguinte.
lexical_decisions:
- source_word: וּרְאֵה
  choice: Veja
  rationale: Mantém o imperativo e a coordenação hebraica; no contexto, também comunica a exortação a prestar cuidadosa atenção.
- source_word: וַעֲשֵׂה
  choice: e faça-os
  rationale: עשה significa aqui “fazer/fabricar”; o pronome “-os” explicita em português o referente plural indicado pelo sufixo de בְּתַבְנִיתָם, isto é, os objetos anteriormente descritos.
- source_word: בְּתַבְנִיתָם
  choice: conforme o modelo deles
  rationale: תבנית pode designar modelo, padrão ou forma. “Modelo” é natural no contexto de fabricação, enquanto “deles” preserva o sufixo masculino plural do hebraico.
- source_word: אֲשֶׁר אַתָּה מָרְאֶה
  choice: que está sendo mostrado a você
  rationale: A construção com o particípio Hophal de ראה apresenta o destinatário como aquele a quem o modelo é mostrado. A forma progressiva preserva o aspecto participial e a situação imediata da revelação.
- source_word: בָּהָר
  choice: no monte
  rationale: É a expressão portuguesa natural para a localização de Moisés no Sinai, sem inserir no versículo um nome próprio ausente do hebraico.
theological_decisions:
- issue: Natureza do modelo revelado para os objetos do santuário
  choice: modelo
  alternative: padrão; planta; forma
  rationale: “Modelo” preserva a ideia de uma referência mostrada por Deus sem definir se se trata de planta, réplica ou arquétipo celestial.
- issue: Tempo da apresentação do modelo
  choice: está sendo mostrado
  alternative: foi mostrado
  rationale: O particípio hebraico permite destacar a apresentação em curso no contexto da fala. A tradução não converte necessariamente a ação em um evento passado já concluído.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário concreto. “Monte” conserva o registro bíblico sem soar arcaico; “a você” torna explícito o destinatário enfatizado por אַתָּה. O marcador [a] aparece no texto principal.
