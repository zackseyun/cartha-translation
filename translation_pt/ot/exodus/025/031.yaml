base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: pt
  text: Faça um candelabro de ouro puro. O candelabro será feito de uma peça única, trabalhada a martelo[a]; sua base e sua haste, seus cálices, seus botões[b] e suas flores serão da própria peça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de obra batida”. O hebraico enfatiza que o candelabro devia ser moldado a martelo, a partir de uma única peça, e não montado com partes separadas.
    reason: lexical_alternative
  - marker: b
    text: “Botões” também pode ser traduzido por “saliências arredondadas”. O hebraico se refere a ornamentos arredondados no desenho floral do candelabro.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: candelabro
  rationale: Designa o suporte destinado às lâmpadas, não as próprias lâmpadas. “Candelabro” é o termo bíblico tradicional e amplamente compreensível em português, embora o objeto sustentasse lâmpadas a óleo, não velas.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Equivalente natural para ouro refinado e sem mistura.
- source_word: מִקְשָׁה
  choice: de uma só peça, trabalhada a martelo
  rationale: O termo descreve metal moldado por martelamento e, no contexto, ressalta uma obra integral, não montada com partes separadas.
- source_word: תֵּעָשֶׂה
  choice: será feito
  rationale: A forma passiva em contexto instrutivo é expressa naturalmente pelo futuro com valor prescritivo.
- source_word: יְרֵכָהּ
  choice: sua base
  rationale: Embora o sentido básico seja “coxa/lado”, aplicado ao objeto indica sua parte inferior de sustentação.
- source_word: וְקָנָהּ
  choice: sua haste
  rationale: No singular, refere-se à haste central do candelabro; “haste” mantém a imagem vegetal e distingue esse elemento dos braços laterais mencionados adiante.
- source_word: גְּבִיעֶיהָ
  choice: seus cálices
  rationale: Designa elementos ornamentais em forma de taça. “Cálices” é preciso e combina com o desenho floral, sem deixar de ser compreensível.
- source_word: כַּפְתֹּרֶיהָ
  choice: seus botões
  rationale: Refere-se a saliências arredondadas ornamentais. “Botões” preserva a possível imagem vegetal, mas a nota registra a alternativa mais estrutural.
- source_word: וּפְרָחֶיהָ
  choice: suas flores
  rationale: Representa diretamente os ornamentos florais explicitados pelo hebraico.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: formarão uma só peça com ele
  rationale: Comunica que todos os elementos saem do próprio candelabro e não são peças produzidas separadamente e depois anexadas.
