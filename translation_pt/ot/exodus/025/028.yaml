  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: pt
  text: Faça as varas de madeira de acácia e revista-as de ouro; por meio delas[a], a mesa será carregada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: com elas.'
    reason: A preposição hebraica ב expressa aqui o meio ou instrumento; ambas as formulações comunicam essa relação.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com waw, neste contexto de instruções, expressa uma ordem. O imperativo em português é natural e mantém a força diretiva.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: No contexto do mobiliário do santuário, o termo designa as varas usadas para transportar a mesa. “Varas” é claro, atual e amplamente compreensível.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: Reproduz com naturalidade a construção hebraica que identifica o material das varas.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: e revista-as de ouro
  rationale: O verbo descreve a aplicação de uma cobertura ou revestimento; “revestir de ouro” é preciso e adequado ao contexto artesanal.
- source_word: וְנִשָּׂא בָם
  choice: por meio delas, a mesa será carregada
  rationale: A forma verbal apresenta a mesa como objeto transportado, e a preposição ב marca as varas como instrumento ou meio do transporte.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: Mantém a referência simples ao móvel descrito no contexto imediato, sem acrescentar uma identificação explicativa ao texto.
