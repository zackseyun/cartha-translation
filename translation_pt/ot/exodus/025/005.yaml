  text: peles de carneiros tingidas de vermelho, peles de tahash[a] e madeira de acácia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico תְּחָשִׁים (tahash) designa um material ou animal de identificação incerta. Entre as possibilidades propostas estão peles de dugongo, de toninha ou algum tipo de couro de alta qualidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: peles
  rationale: O plural construto de עוֹר designa peles ou couros de animais usados como material. “Peles” é natural no primeiro item e não especifica além do texto o grau de processamento.
- source_word: אֵילִם
  choice: carneiros
  rationale: O substantivo plural significa “carneiros”; “peles de carneiros” expressa naturalmente a origem animal do material.
- source_word: מְאָדָּמִים
  choice: tingidas de vermelho
  rationale: A forma indica que as peles foram tornadas vermelhas, provavelmente mediante tingimento, e não apenas que tinham cor vermelha natural.
- source_word: עֹרֹת תְּחָשִׁים
  choice: couros finos
  rationale: תְּחָשִׁים é de identificação incerta. “Couros finos” oferece uma expressão clara para o material de cobertura sem afirmar como certa uma espécie animal discutida; a incerteza é registrada em nota.
- source_word: עֲצֵי
  choice: madeira
  rationale: Embora a forma hebraica seja plural construta, em português o nome massivo “madeira” é a maneira idiomática de apresentar esse material numa lista.
- source_word: שִׁטִּים
  choice: acácia
  rationale: A identificação tradicional e amplamente aceita é a acácia; “madeira de acácia” é claro e corrente em português.
theological_decisions: []
