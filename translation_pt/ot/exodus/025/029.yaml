  text: וְ/עָשִׂ֨יתָ קְּעָרֹתָ֜י/ו וְ/כַפֹּתָ֗י/ו וּ/קְשׂוֹתָי/ו֙ וּ/מְנַקִּיֹּתָ֔י/ו אֲשֶׁ֥ר יֻסַּ֖ךְ בָּ/הֵ֑ן זָהָ֥ב טָה֖וֹר תַּעֲשֶׂ֥ה אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: pt
  text: Faça também os seus pratos, as suas pequenas vasilhas, os seus jarros[a] e as suas taças[b], com os quais se derramará a oferta de bebida; faça-os de ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas jarras”; o termo hebraico é raro e designa um utensílio usado no serviço da mesa.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus copos”; os dois últimos termos designam recipientes relacionados ao derramamento da oferta de bebida.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: seus pratos
  rationale: קְעָרָה designa um recipiente plano ou prato; no contexto da mesa, “pratos” é natural e o distingue do termo seguinte.
- source_word: כַפֹּתָיו
  choice: suas pequenas vasilhas
  rationale: כַּף pode designar um objeto côncavo, semelhante à palma da mão, e por extensão uma vasilha pequena. A tradução mantém a distinção entre os utensílios sem impor uma função incerta.
- source_word: קְשׂוֹתָיו
  choice: seus jarros
  rationale: Este raro nome de utensílio cultual provavelmente se refere a recipientes associados ao serviço de libação; “jarros” comunica em português atual a capacidade de conter e verter líquido.
- source_word: מְנַקִּיֹּתָיו
  choice: suas taças
  rationale: O termo designa utensílios ligados ao derramamento de libações. “Taças” é claro e preserva a distinção em relação aos jarros.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: com os quais se derramará a oferta de bebida
  rationale: O verbo נסך tem aqui sentido cultual de derramar uma libação. “Oferta de bebida” explicita de modo natural o objeto implícito, e a construção impessoal preserva a voz passiva hebraica.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Equivalente corrente e exato para a especificação do material.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Faça também ... faça-os
  rationale: O imperativo em português expressa naturalmente a força instrutiva da forma hebraica e conserva a repetição que enquadra a lista e especifica o material.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pequenas vasilhas” evita atribuir ao segundo utensílio uma forma ou função mais específica do que o hebraico permite; as notas preservam a incerteza lexical dos raros nomes de recipientes cultuais.
