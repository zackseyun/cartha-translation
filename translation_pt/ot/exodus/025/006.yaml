  language: en
  yaml_path: translation/ot/exodus/025/006.yaml
  text: oil for the light[a], spices for the anointing oil and for the incense of spices,
translation:
  language: pt
  text: óleo para a iluminação, especiarias para o óleo da unção e para o incenso aromático[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “incenso das especiarias” ou “incenso das substâncias aromáticas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן
  choice: óleo
  rationale: O substantivo hebraico significa genericamente “óleo”. Embora o contexto sugira azeite de oliva, o versículo não especifica a matéria-prima.
- source_word: לַמָּאֹר
  choice: para a iluminação
  rationale: מָאוֹר designa luz, iluminação ou uma fonte de luz. A expressão escolhida comunica naturalmente a finalidade do óleo sem acrescentar “lâmpada” ao texto.
- source_word: בְּשָׂמִים
  choice: especiarias
  rationale: O plural indica substâncias aromáticas empregadas nas preparações sagradas; “especiarias” é claro e preserva a concisão do inventário.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: para o óleo da unção
  rationale: A formulação expressa a finalidade das especiarias e mantém a referência ao óleo específico usado para a unção.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: incenso aromático
  rationale: A expressão designa o incenso preparado com substâncias aromáticas. Esta forma é natural em português, enquanto a nota registra a construção hebraica mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa própria de uma lista de materiais. Optou-se por “óleo”, e não “azeite”, para não tornar explícito o que o hebraico deixa genérico. O marcador foi colocado junto à expressão que a nota esclarece.
