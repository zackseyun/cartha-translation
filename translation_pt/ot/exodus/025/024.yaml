  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: pt
  text: Revista-a de ouro puro e faça uma moldura de ouro em toda a volta dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma borda de ouro” ou “um friso de ouro”. O termo hebraico pode designar um remate ornamental. Tradicionalmente, alguns o traduzem por “coroa”, mas aqui se refere ao acabamento decorativo ao redor da mesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Revista
  rationale: O verbo צפה, nesta construção, indica cobrir um objeto com uma camada de metal. “Revestir” comunica com precisão e naturalidade o trabalho de recobrir a mesa de madeira com ouro.
- source_word: אֹתוֹ
  choice: a
  rationale: O pronome de objeto direto retoma “a mesa” do versículo anterior; em português, o pronome feminino “a” preserva essa referência.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: A expressão designa ouro de alta pureza; “ouro puro” é a equivalência corrente, clara e tradicional em português.
- source_word: וְעָשִׂיתָ
  choice: e faça
  rationale: עשה é o verbo comum para “fazer”. O imperativo “faça” expressa naturalmente em português a instrução dirigida a Moisés, sem acrescentar nuances ausentes do hebraico.
- source_word: לּוֹ
  choice: ao redor dela
  rationale: A preposição ל marca aquilo para o qual se faz a moldura. A formulação portuguesa integra essa relação com סָבִיב de modo natural, deixando claro que a moldura pertence à mesa e a circunda.
- source_word: זֵר
  choice: moldura
  rationale: Aqui, זֵר designa uma borda ornamental no mobiliário do santuário. “Moldura” preserva o caráter decorativo e estrutural sem sugerir indevidamente uma coroa usada na cabeça.
- source_word: זָהָב
  choice: de ouro
  rationale: Designação direta do material de que a moldura deve ser feita.
- source_word: סָבִיב
  choice: ao redor
  rationale: O advérbio indica que a moldura circunda a mesa. “Ao redor” é idiomático e transmite a abrangência espacial do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais para instruções divinas. A próclise em “Revista-a” segue a norma escrita formal, e “moldura” mantém acessível a terminologia artesanal do contexto.
