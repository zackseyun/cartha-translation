  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: pt
  text: E me farão um santuário, e habitarei no meio deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no meio deles”. O hebraico usa o plural e se refere ao povo, não apenas ao santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Façam
  rationale: Neste contexto instrucional, a forma verbal com וְ tem força diretiva. O imperativo na terceira pessoa do plural é natural em português e preserva os israelitas como agentes da construção.
- source_word: לִי
  choice: para mim
  rationale: 'A preposição לְ com o sufixo da primeira pessoa indica destinação ou benefício: o santuário deve ser feito para Deus.'
- source_word: מִקְדָּשׁ
  choice: santuário
  rationale: O termo designa um lugar sagrado, separado para a presença divina. “Santuário” é corrente, digno e adequado ao contexto do tabernáculo.
- source_word: וְשָׁכַנְתִּי
  choice: e habitarei
  rationale: O verbo שׁכן significa habitar ou estabelecer residência. A coordenação hebraica permite conservar a afirmação de resultado ou propósito sem explicitar além do texto a relação como “para que”.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: 'A expressão traduz de perto o hebraico e mantém o sufixo plural: a presença divina está no meio do povo, não meramente dentro da estrutura.'
theological_decisions:
- issue: Referente da habitação de Deus
  choice: no meio deles
  alternative: nele
  rationale: O hebraico traz um sufixo plural, “deles”, referindo-se ao povo. A tradução evita substituir esse referente pelo santuário e preserva a ênfase na presença de Deus entre os israelitas.
- issue: Relação entre a construção e a habitação divina
  choice: e habitarei
  alternative: para que eu habite
  rationale: A conjunção hebraica pode ser entendida como coordenação com nuance de propósito ou resultado. A formulação escolhida conserva sua forma direta e não elimina essa abertura contextual.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Façam” comunica diretamente a instrução; “santuário” mantém o vocabulário bíblico corrente; “no meio deles” preserva a forma e a ênfase comunitária do hebraico.
