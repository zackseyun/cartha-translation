  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: pt
  text: 'Seis braços sairão de seus lados: três braços do candelabro de um lado e três braços do candelabro do outro lado.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: braços
  rationale: Neste contexto, קָנֶה designa as extensões laterais do candelabro. “Braços” descreve com clareza essas peças projetadas e é mais natural em português do que “canas” ou “hastes”.
- source_word: יֹצְאִים
  choice: sairão
  rationale: O particípio integra a descrição prescritiva da construção. O futuro “sairão” comunica de modo natural que os braços se estendem a partir dos lados do candelabro.
- source_word: מִצִּדֶּיהָ
  choice: de seus lados
  rationale: Preserva o plural “lados” e o sufixo feminino singular que retoma o candelabro.
- source_word: מְנֹרָה
  choice: candelabro
  rationale: Traduz o substantivo comum em vez de transliterá-lo e identifica de modo compreensível o suporte de lâmpadas descrito no contexto.
- source_word: מִצִּדָּהּ הָאֶחָד ... מִצִּדָּהּ הַשֵּׁנִי
  choice: de um lado ... do outro lado
  rationale: Expressa naturalmente em português o contraste hebraico entre o primeiro lado mencionado e o segundo, sem sugerir lados adicionais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. A repetição de “três braços do candelabro” acompanha a formulação explícita do hebraico. Não se incluiu a nota da camada inglesa porque a alternativa ali registrada não corresponde a uma ambiguidade real do texto hebraico e, tal como formulada, confundiria os dois lados.
