translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação conserva a repetição técnica da descrição e torna explícita a elipse verbal inicial para produzir uma frase natural. “Num braço” e “no outro braço” comunicam a distribuição entre braços sem alterar o padrão repetido.
