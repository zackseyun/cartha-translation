    issue: A alternativa «nódulo» na nota de כַּפְתֹּר é pouco natural para o ornamento descrito.
    rationale: «Saliência ornamental» ou «protuberância» comunica melhor o valor de uma projeção arredondada e mantém a nota acessível.
