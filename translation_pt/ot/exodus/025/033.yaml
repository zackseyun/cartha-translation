  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: pt
  text: Haverá três cálices em forma de flores de amendoeira num braço[a], com botão e flor, e três cálices em forma de flores de amendoeira num braço, com botão e flor[b]; assim será nos seis braços que saem do candelabro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “três cálices feitos como flores de amendoeira num braço”.'
    reason: lexical_alternative
  - marker: b
    text: “Botão” traduz o hebraico כַּפְתֹּר, uma saliência ornamental arredondada; outra tradução possível é “protuberância”.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico מְנֹרָה também é transliterado como “menorá”. Aqui foi traduzido por “candelabro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: cálices
  rationale: O substantivo indica recipientes ou formas semelhantes a copos; no contexto ornamental do candelabro, “cálices” comunica tanto a forma quanto o registro digno.
- source_word: מְשֻׁקָּדִים
  choice: em forma de flores de amendoeira
  rationale: A forma derivada de שקד descreve o motivo ornamental dos cálices. A expressão explicita o desenho floral sem sugerir apenas o formato da amêndoa.
- source_word: קָּנֶה
  choice: braço
  rationale: Aqui designa cada haste lateral projetada do candelabro. “Braço” é claro e corrente em português para essa peça, embora “ramo” também seja possível devido ao motivo vegetal.
- source_word: כַּפְתֹּר
  choice: botão
  rationale: Designa uma saliência ornamental arredondada. “Botão” preserva a possível imagem vegetal e combina naturalmente com “flor”.
- source_word: פֶרַח / פָרַח
  choice: flor
  rationale: O substantivo significa flor ou broto floral; “flor” é direto e evita repetir desnecessariamente “floração”.
- source_word: כֵּן
  choice: assim será
  rationale: Resume e aplica o mesmo padrão a todos os seis braços, preservando a força instrutiva do hebraico.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: nos seis braços
  rationale: A preposição indica a aplicação do arranjo aos seis braços; “nos” é idiomático em português neste contexto.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: que saem do candelabro
  rationale: Representa de modo transparente o particípio e a preposição, descrevendo os braços que se projetam da estrutura central.
- source_word: מְנֹרָה
  choice: candelabro
  rationale: É um substantivo comum para o suporte de lâmpadas do santuário. “Candelabro” é a equivalência tradicional e amplamente compreensível em português; a nota registra a transliteração alternativa.
