  yaml_path: translation/ot/exodus/025/034.yaml
  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: pt
  text: E no candelabro haverá quatro taças em forma de flor de amendoeira[a], com seus botões[b] e suas flores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com formato de amêndoa» ou «decoradas com flores de amendoeira». O hebraico descreve as taças com uma imagem ligada à amendoeira e pode destacar a forma ou a ornamentação.
    reason: lexical_alternative
  - marker: b
    text: Ou «suas saliências». O termo hebraico se refere a um elemento ornamental arredondado do candelabro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמְּנֹרָה
  choice: E no candelabro
  rationale: A conjunção e a preposição são vertidas naturalmente por «E no». מְנֹרָה designa o candelabro, e não apenas uma lâmpada.
- source_word: אַרְבָּעָה
  choice: quatro
  rationale: Numeral cardinal que quantifica as taças.
- source_word: גְבִעִים
  choice: taças
  rationale: O substantivo designa formas semelhantes a taças ou cálices; «taças» é claro e natural no contexto ornamental.
- source_word: מְשֻׁקָּדִים
  choice: em forma de flor de amendoeira[a]
  rationale: A forma derivada da raiz associada à amendoeira descreve o padrão das taças, sem determinar com certeza se se trata sobretudo de formato ou decoração; a nota preserva essa amplitude.
- source_word: כַּפְתֹּרֶיהָ
  choice: seus botões[b]
  rationale: O termo indica elementos ornamentais arredondados. «Botões» integra-se à imagem vegetal, embora «saliências» também seja possível.
- source_word: וּפְרָחֶיהָ
  choice: e suas flores
  rationale: פֶּרַח significa flor ou florescência; «flores» é claro e evita repetição excessiva de «flor de amendoeira».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem acompanha de perto o hebraico, enquanto «haverá» torna natural a construção nominal. As notas preservam a ambiguidade lexical dos elementos ornamentais.
