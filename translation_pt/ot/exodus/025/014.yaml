  yaml_path: translation/ot/exodus/025/014.yaml
  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: pt
  text: Coloque[a] as varas nas argolas, nos lados da arca, para carregar a arca com elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Traga as varas para dentro das argolas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: Introduza
  rationale: O verbo בוא significa literalmente “trazer/entrar”, mas, nesta construção, descreve pôr as varas dentro das argolas. “Introduza” expressa com clareza o movimento sem soar excessivamente técnico.
- source_word: הַ/בַּדִּים
  choice: as varas
  rationale: בדים designa as varas usadas para transportar o mobiliário sagrado. “Varas” é o termo bíblico tradicional e ainda corrente em português.
- source_word: בַּ/טַּבָּעֹת
  choice: nas argolas
  rationale: A preposição ב, neste contexto, indica colocação dentro das argolas. Com o verbo “introduzir”, “nas argolas” comunica naturalmente esse sentido.
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: que ficam nos lados da arca
  rationale: צלעות refere-se aos lados ou partes laterais. A oração relativa deixa claro, em português natural, que as argolas estão localizadas nos lados da arca.
- source_word: הָ/אָרֹן
  choice: a arca
  rationale: Embora ארון também possa significar “baú” ou “cofre”, “arca” é o termo estabelecido e contextualmente adequado para este objeto sagrado.
- source_word: לָ/שֵׂאת
  choice: para carregar
  rationale: נשא indica aqui o ato físico de transportar. “Carregar” é claro, atual e direto.
- source_word: בָּ/הֶם
  choice: com elas
  rationale: O pronome retoma as varas e expressa o meio pelo qual a arca seria transportada. O feminino concorda com “varas” em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura imperativa natural. A nota preserva o sentido mais formal do hebraico וְהֵבֵאתָ, enquanto o texto principal explicita idiomaticamente a inserção das varas.
