  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: pt
  text: Faça as sete lâmpadas do candelabro. Ele[b] instalará as lâmpadas[a], para que iluminem na direção da frente do candelabro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acenderá as lâmpadas”. O verbo hebraico significa literalmente “fará subir” e, neste contexto, pode referir-se tanto a colocá-las em posição como a acendê-las.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz aqui a terceira pessoa do singular (“ele”). O sujeito não é mencionado neste versículo; possivelmente se refere ao sacerdote encarregado do candelabro.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito qal com a conjunção, neste contexto de instruções, tem força de ordem dirigida a Moisés. O imperativo em português comunica essa força com naturalidade; “também” expressa a continuidade sem reproduzir mecanicamente a conjunção.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: as sete lâmpadas do candelabro
  rationale: נֵר designa uma lâmpada, e o sufixo feminino singular remete ao candelabro (מְנוֹרָה) do contexto. Explicitar “do candelabro” evita a ambiguidade pouco natural de “suas” em português.
- source_word: וְהֶעֱלָה
  choice: Ele instalará
  rationale: O hifil masculino singular de עלה significa literalmente “fará subir” e, no uso cultual referente a lâmpadas, pode indicar colocá-las ou acendê-las. “Instalará” preserva a ação de pô-las em posição sem decidir silenciosamente que se trata apenas de acendê-las.
- source_word: וְהֵאִיר
  choice: para que iluminem
  rationale: O hifil de אור exprime aqui o resultado ou propósito da instalação das lâmpadas. O plural explícito em português retoma naturalmente “lâmpadas”, embora a forma hebraica seja masculina singular.
- source_word: עַל עֵבֶר פָּנֶיהָ
  choice: o espaço à frente dele
  rationale: A expressão aponta para a região diante da face ou parte frontal do candelabro. Esta formulação comunica tanto a localização quanto a direção da luz em português corrente.
theological_decisions:
- issue: Sujeito não expresso de וְהֶעֱלָה
  choice: Manter “Ele” no singular e explicar a provável referência ao sacerdote
  alternative: Empregar sujeito indeterminado, como “deverão instalar” ou “serão instaladas”
  rationale: A forma verbal hebraica é terceira pessoa masculina singular. O versículo não identifica expressamente o agente; por isso, a tradução conserva o singular gramatical e a nota registra a provável identificação contextual sem inseri-la no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “lâmpadas” acompanha o hebraico e mantém claro o referente. A tradução conserva o singular inesperado do segundo verbo e registra em nota tanto a ambiguidade lexical de וְהֶעֱלָה quanto a ausência de um sujeito nominal explícito.
