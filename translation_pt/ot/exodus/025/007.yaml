  text: onyx stones[a], and stones for setting[c][b], for the ephod and for the breastpiece.
translation:
  language: pt
  text: pedras de ônix[a] e pedras para engaste[b], para o éfode e para o peitoral[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ônix” talvez designe outra pedra preciosa; sua identificação exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “pedras a serem engastadas” ou “pedras para engastes”.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, “couraça” ou “peitoral”; o hebraico designa a peça usada sobre o peito, não necessariamente uma armadura.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי
  choice: pedras
  rationale: O plural construto de אֶבֶן significa de modo amplo “pedras”. Neste inventário, trata-se de pedras preciosas, mas “pedras” permanece próximo do hebraico e permite que os termos seguintes indiquem seu tipo ou uso.
- source_word: שֹׁהַם
  choice: ônix
  rationale: A identificação exata de שֹׁהַם é incerta. “Ônix” é a tradução tradicional e amplamente reconhecida neste contexto, com a incerteza registrada em nota.
- source_word: אַבְנֵי מִלֻּאִים
  choice: pedras para engaste
  rationale: מִלֻּאִים relaciona-se literalmente a preenchimentos ou engastes e, neste contexto, indica pedras destinadas a ser engastadas. “Pedras para engaste” expressa naturalmente essa função sem especificar em excesso a técnica artesanal.
- source_word: לָאֵפֹד
  choice: para o éfode
  rationale: אֵפוֹד é um termo técnico para a veste sacerdotal; a forma aportuguesada “éfode” preserva o termo tradicional sem impor uma descrição incerta.
- source_word: וְלַחֹשֶׁן
  choice: e para o peitoral
  rationale: חֹשֶׁן designa a peça sacerdotal usada sobre o peito e que recebia pedras engastadas. “Peitoral” é claro em português e evita a sugestão indevida de uma couraça militar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia cultual reconhecível. “Éfode” conserva o termo técnico; “peitoral” oferece clareza ampla. A ordem das expressões acompanha de perto o hebraico.
