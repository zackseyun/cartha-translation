  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י יִהְיֶ֨ה לָ/כֶ֥ם קֹ֛דֶשׁ שַׁבַּ֥ת שַׁבָּת֖וֹן לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֥ה ב֛/וֹ מְלָאכָ֖ה יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: pt
  text: 'Durante seis dias, poderá ser feito trabalho, mas o sétimo dia será santo para vocês: um sábado de descanso completo[a] dedicado a Yahweh[b]. Quem fizer algum trabalho nesse dia será morto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sábado de repouso solene”. A expressão hebraica literalmente reúne “sábado” e “descanso sabático” para intensificar a ideia de cessação completa do trabalho.
    reason: lexical_alternative
  - marker: b
    text: Também é possível traduzir “para Yahweh” ou “pertencente a Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: poderá ser feito
  rationale: O nifal imperfeito de עשה tem forma passiva. A tradução mantém a construção impessoal e expressa naturalmente a permissão legal para trabalhar durante os seis dias, sem transformá-la numa ordem dirigida a um sujeito específico.
- source_word: מְלָאכָה
  choice: trabalho
  rationale: No contexto das leis do sábado, מְלָאכָה designa trabalho ou atividade ocupacional. “Trabalho” é claro, abrangente e natural em português atual.
- source_word: קֹדֶשׁ
  choice: santo
  rationale: O substantivo predicativo indica que o sétimo dia é consagrado. “Será santo para vocês” preserva a estrutura e evita acrescentar “dia santo” onde o hebraico emprega apenas קֹדֶשׁ.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: um sábado de descanso completo
  rationale: A combinação intensifica a ideia de cessação do trabalho. “Descanso completo” comunica essa força em português corrente, enquanto a nota preserva uma alternativa mais próxima da repetição hebraica.
- source_word: לַיהוָה
  choice: dedicado a Yahweh
  rationale: A preposição ל pode indicar direção, destinação ou pertencimento. “Dedicado a” torna inteligível a relação cultual neste contexto, enquanto a nota registra a ambiguidade genuína.
- source_word: כָּל הָעֹשֶׂה
  choice: Quem fizer
  rationale: A construção apresenta um caso legal geral. “Quem fizer” preserva sua abrangência de modo idiomático.
- source_word: בּוֹ
  choice: nesse dia
  rationale: O pronome retoma o sétimo dia. Explicitar “dia” evita uma referência pouco natural em português sem alterar o sentido.
- source_word: יוּמָת
  choice: será morto
  rationale: O hofal de מות é causativo passivo e estabelece a pena de morte. Como não há infinitivo absoluto intensificador neste versículo, a tradução não acrescenta “certamente”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” representa o nome pactual e evita substituí-lo por um título.
- issue: Sentido da expressão לַיהוָה
  choice: dedicado a Yahweh
  alternative: para Yahweh; pertencente a Yahweh
  rationale: O ל pode exprimir dedicação, orientação ou pertencimento. A tradução principal comunica a função cultual, e a nota mantém abertas as outras relações semanticamente possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o contraste legal entre os seis dias e o sétimo, mantém a voz passiva na permissão de trabalhar e evita intensificar a pena além do que está expresso no hebraico.
