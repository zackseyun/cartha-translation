  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: pt
  text: Então toda a comunidade dos filhos de Israel saiu da presença de Moisés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a assembleia dos filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Então ... saiu
  rationale: O wayyiqtol de יצא faz a narrativa avançar. “Então” expressa a sequência, e o singular concorda naturalmente em português com o núcleo coletivo “comunidade”.
- source_word: כָּל עֲדַת
  choice: toda a comunidade
  rationale: כָּל enfatiza a totalidade, enquanto עֵדָה designa a coletividade reunida de Israel. “Comunidade” é atual, clara e preserva o sentido corporativo; “assembleia” também é possível.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém de modo transparente a forma hebraica do construto masculino plural, sem substituí-la por uma designação étnica mais interpretativa como “israelitas”.
- source_word: מִלִּפְנֵי
  choice: da presença de
  rationale: A expressão hebraica significa literalmente sair de diante de alguém. “Da presença de” comunica o idioma espacial com naturalidade e dignidade em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
