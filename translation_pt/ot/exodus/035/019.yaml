base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: pt
  text: as vestes de serviço[a] para servir no santuário[b], as vestes sagradas para Aarão, o sacerdote, e as vestes de seus filhos, para servirem como sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as vestes finamente tecidas”; o sentido do termo hebraico é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “no lugar santo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: as vestes de serviço
  rationale: A expressão hebraica é rara e seu sentido exato é incerto. “Vestes de serviço” preserva a ligação explícita com o serviço sagrado no contexto e evita apresentar como certa a interpretação têxtil “finamente tecidas”; esta é mantida em nota.
- source_word: לְשָׁרֵת
  choice: para servir
  rationale: Traduz diretamente o infinitivo de שׁרת e soa natural em português; o contexto do santuário deixa claro que se trata de serviço sagrado.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: Neste contexto do tabernáculo, קֹדֶשׁ designa o espaço sagrado. “Santuário” comunica isso com clareza, enquanto “lugar santo” permanece como alternativa possível em nota.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: as vestes sagradas
  rationale: Expressa naturalmente a construção hebraica “vestes de santidade” sem recorrer a terminologia eclesiástica posterior.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: de Aarão, o sacerdote
  rationale: A preposição לְ indica que as vestes são destinadas a Aarão; em português, “de Aarão” é idiomático neste contexto, e “o sacerdote” mantém a identificação de seu ofício.
- source_word: בִּגְדֵי בָנָיו
  choice: as vestes de seus filhos
  rationale: Mantém de forma clara e próxima a relação possessiva expressa no hebraico.
- source_word: לְכַהֵן
  choice: para exercerem o sacerdócio
  rationale: O infinitivo piel de כהן significa atuar ou servir como sacerdote. Esta formulação conserva a força verbal e deixa claro que os filhos desempenhariam a função sacerdotal.
theological_decisions:
- issue: Relação entre בִּגְדֵי הַשְּׂרָד e בִּגְדֵי הַקֹּדֶשׁ
  choice: Apresentar as “vestes de serviço” e as “vestes sagradas” como itens coordenados na enumeração, sem declarar que sejam necessariamente a mesma classe de vestes.
  alternative: Entender a primeira expressão como uma descrição geral ou apositiva das vestes sacerdotais de Aarão e de seus filhos.
  rationale: A repetição do marcador de objeto אֶת favorece uma enumeração, mas o texto não explica plenamente a relação entre os grupos. A tradução conserva a estrutura coordenada e não resolve além do necessário a possível sobreposição entre eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo da lista hebraica e evita o termo eclesiástico posterior “paramentos”.
