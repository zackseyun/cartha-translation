  text: אֶת הָ/אָרֹ֥ן וְ/אֶת בַּדָּ֖י/ו אֶת הַ/כַּפֹּ֑רֶת וְ/אֵ֖ת פָּרֹ֥כֶת הַ/מָּסָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/012.yaml
  text: the ark and its poles[a], the mercy seat, and the veil of the screen,
translation:
  language: pt
  text: a arca e suas hastes, o propiciatório[a] e o véu da cortina divisória,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tampa da expiação”.'
    reason: Alternativa lexical que explicita tanto a forma concreta do objeto quanto sua associação cultual com a expiação.
lexical_decisions:
- source_word: הָאָרֹן
  choice: a arca
  rationale: No contexto do santuário, אָרוֹן designa o recipiente sagrado tradicionalmente chamado de “arca”; “baú” ou “cofre” seriam genéricos demais.
- source_word: בַּדָּיו
  choice: suas hastes
  rationale: בַּדִּים são as peças compridas usadas para transportar a arca. “Hastes” é claro e atual, sem o tom arcaico de “varais” em parte do mundo lusófono.
- source_word: הַכַּפֹּרֶת
  choice: o propiciatório
  rationale: O termo designa a cobertura de ouro da arca e possui forte sentido cultual ligado à expiação. “Propiciatório” é a designação bíblica consagrada em português; a alternativa mais explicativa é preservada em nota.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: o véu da cortina divisória
  rationale: A expressão em cadeia construta contém dois substantivos. “Véu da cortina divisória” preserva ambos e comunica a função separadora sem acrescentar uma finalidade não expressa.
- source_word: אֶת / וְאֶת
  choice: '[marcadores de objeto direto não traduzidos]'
  rationale: Os marcadores hebraicos introduzem objetos definidos e não têm equivalente lexical necessário em português; a coordenação é indicada por vírgulas e “e”.
theological_decisions:
- issue: Tradução de הַכַּפֹּרֶת no contexto cultual do tabernáculo
  choice: o propiciatório
  alternative: a tampa da expiação
  rationale: “Propiciatório” mantém a designação cultual tradicional e sua densidade teológica, enquanto “tampa da expiação” explicita que se trata da cobertura da arca e sua associação com a expiação. A alternativa é registrada em nota para não eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração fragmentária e a vírgula final são mantidas porque o versículo integra uma lista que continua no contexto. O marcador [a] foi colocado imediatamente após “propiciatório”, termo ao qual a nota se refere.
