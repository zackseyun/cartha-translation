  yaml_path: translation/ot/exodus/035/003.yaml
  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: pt
  text: Não acendam fogo em nenhuma das suas habitações no dia de sábado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: acendam
  rationale: O Piel de בער expressa aqui o ato de atear ou acender fogo. “Acendam” é a forma corrente e precisa em português, sem ampliar a proibição para todo uso ou manutenção do fogo.
- source_word: אֵשׁ
  choice: fogo
  rationale: O substantivo singular designa o fogo que seria aceso. Em português, a locução idiomática é “acender fogo”, normalmente sem artigo neste contexto.
- source_word: בְּכֹל
  choice: em nenhuma
  rationale: Sob o alcance da negação, a expressão distributiva com כֹּל é comunicada naturalmente por “em nenhuma”, deixando claro que a proibição se aplica a cada habitação.
- source_word: מֹשְׁבֹתֵיכֶם
  choice: das suas habitações
  rationale: “Habitações” preserva a amplitude de מוֹשָׁב, que pode indicar lugares de moradia, e evita restringir o sentido a casas individuais ou ampliá-lo especificamente a povoados.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: A formulação mantém a referência explícita ao “dia” e usa a expressão natural em português para o sábado como dia de descanso.
theological_decisions:
- issue: Alcance da proibição sabática relativa ao fogo
  choice: Traduzir como proibição direta de acender fogo nas habitações, sem acrescentar outras formas de uso do fogo.
  alternative: Ampliar a redação para proibir manter, utilizar ou beneficiar-se de qualquer fogo no sábado.
  rationale: O hebraico proíbe especificamente o ato de acender fogo. A tradução não deve incorporar desenvolvimentos interpretativos posteriores nem decidir questões que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal no plural conforme o hebraico. “Habitações” conserva um tom moderadamente formal e o alcance amplo do termo de origem; “no dia de sábado” é mais natural em português atual do que a reprodução rígida “no dia do sábado”.
