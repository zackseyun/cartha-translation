  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: pt
  text: Todo homem e toda mulher cujo coração os moveu a trazer algo para toda a obra que Yahweh havia ordenado, por meio de Moisés, que se fizesse — os israelitas trouxeram uma oferta voluntária a Yahweh.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cujo coração os impulsionou” ou “cujo coração os tornou dispostos”. A expressão hebraica indica disposição ou impulso interior voluntário.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pela mão de Moisés”, expressão que significa “por meio de Moisés” ou “tendo Moisés como mediador”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Todo homem e toda mulher
  rationale: Mantém a referência explícita a homens e mulheres e a força distributiva de כָּל, sem reduzir a expressão a um genérico.
- source_word: נָדַב לִבָּם אֹתָם
  choice: cujo coração os moveu
  rationale: Reproduz de modo natural a expressão hebraica em que o coração, sede da vontade, leva a pessoa a agir espontaneamente.
- source_word: לְהָבִיא
  choice: a trazer algo
  rationale: O verbo significa literalmente “trazer”; “algo” explicita com leveza o objeto implícito no contexto, isto é, uma contribuição.
- source_word: לְכָל הַמְּלָאכָה
  choice: para toda a obra
  rationale: מְלָאכָה abrange aqui o conjunto do trabalho de construção do tabernáculo e de seus utensílios; “obra” é amplo e adequado ao contexto.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: que Yahweh havia ordenado que fosse feita por meio de Moisés
  rationale: A formulação conserva a referência à obra e traduz בְּיַד, literalmente “pela mão de”, como expressão de mediação ou agência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: os israelitas trouxeram
  rationale: בְנֵי יִשְׂרָאֵל é um etnônimo consagrado; “os israelitas” comunica seu sentido diretamente em português atual.
- source_word: נְדָבָה
  choice: uma oferta voluntária
  rationale: O substantivo designa uma oferta dada espontaneamente, sem compulsão; “oferta voluntária” é claro e preciso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino e representa de forma amplamente aceita sua provável pronúncia.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade para leitores brasileiros. O travessão preserva a retomada do sujeito presente na sintaxe hebraica, sem ocultar sua estrutura enfática.
