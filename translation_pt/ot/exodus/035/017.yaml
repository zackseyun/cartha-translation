lexical_decisions:
- source_word: קַלְעֵי
  choice: cortinas
  rationale: Designa os painéis de tecido que cercavam o pátio; “cortinas” é natural, claro e adequado ao contexto do tabernáculo.
- source_word: הֶחָצֵר / הֶחָצֵר
  choice: do pátio
  rationale: חָצֵר é a área externa cercada do tabernáculo; “pátio” é corrente e facilmente compreensível em português.
- source_word: עַמֻּדָיו
  choice: suas colunas
  rationale: Refere-se aos suportes verticais da cerca; “colunas” preserva o registro arquitetônico e é natural em português.
- source_word: אֲדָנֶיהָ
  choice: suas bases
  rationale: Indica as peças inferiores que sustentavam ou recebiam as colunas; “bases” comunica a função sem tecnicismo excessivo.
- source_word: מָסַךְ
  choice: cortina
  rationale: No contexto do tabernáculo, designa uma peça de tecido que fechava a entrada. A formulação “cortina da entrada” distingue sua função das cortinas laterais pelo contexto.
- source_word: שַׁעַר
  choice: entrada
  rationale: Embora possa ser vertido por “portão”, aqui é a abertura de acesso ao pátio; “entrada” evita sugerir uma estrutura rígida e combina naturalmente com a cortina.
