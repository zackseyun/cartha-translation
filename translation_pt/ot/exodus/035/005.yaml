  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: pt
  text: 'Tomem, dentre vocês, uma oferta para Yahweh. Todo aquele cujo coração estiver disposto[a] trará a oferta para Yahweh: ouro, prata e bronze.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo aquele de coração disposto”; a expressão descreve uma disposição interior voluntária.
    reason: lexical_alternative
  - marker: b
    text: Ou “cobre”; o termo hebraico pode designar cobre ou bronze, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Recolham
  rationale: O imperativo plural de לקח significa literalmente “tomem”; neste contexto, porém, trata-se de receber ou reunir contribuições da comunidade. “Recolham” expressa isso com naturalidade em português.
- source_word: מֵאִתְּכֶם
  choice: entre vocês
  rationale: A expressão indica que a oferta deve proceder do próprio povo, preservando o sentido comunitário da fonte.
- source_word: תְּרוּמָה
  choice: oferta
  rationale: Aqui designa uma contribuição separada para uso sagrado. “Oferta” é claro e abrangente, sem a conotação técnica inadequada de “oferta movida”.
- source_word: לַיהוָה / יְהוָה
  choice: para Yahweh / de Yahweh
  rationale: O texto emprega diretamente o nome divino יהוה. “Yahweh” preserva o nome da aliança; a preposição ל indica que a oferta é destinada a ele, e a construção seguinte é traduzida naturalmente como “a oferta de Yahweh”.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: Todo aquele cujo coração estiver disposto
  rationale: A formulação conserva a imagem hebraica do coração e comunica uma disposição interior voluntária, sem restringir a referência aos homens.
- source_word: יְבִיאֶהָ
  choice: trará
  rationale: O imperfeito hifil indica a ação esperada, e o contexto deixa claro que o ato procede de livre disposição. O objeto é explicitado na sequência como “a oferta de Yahweh”.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: ouro, prata e bronze
  rationale: “Bronze” é a tradução tradicional e contextualmente plausível de נְחֹשֶׁת em listas de materiais usados no santuário, embora o termo também possa designar cobre.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A forma “Yahweh” representa diretamente o nome divino presente no hebraico, em vez de substituí-lo por um título.
- issue: Caráter voluntário da contribuição
  choice: cujo coração estiver disposto
  alternative: de coração generoso
  rationale: A tradução preserva tanto a linguagem do coração quanto a voluntariedade, sem reduzir a expressão apenas à generosidade material nem transformar o convite em obrigação coercitiva.
translation_notes:
  register: Português moderno, claro e digno, com formas inclusivas naturais. “Recolham” evita a rigidez de “tomem” neste contexto comunitário; “Yahweh” preserva o nome divino, e a repetição de “oferta” mantém a estrutura enfática do hebraico.
