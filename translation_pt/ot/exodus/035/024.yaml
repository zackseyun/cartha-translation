source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: pt
  text: Todos os que apresentaram uma oferta de prata ou bronze[a] trouxeram a oferta para Yahweh; e todos os que tinham madeira de acácia disponível[b] para algum trabalho do serviço a trouxeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma oferta de prata e bronze”. A conjunção hebraica significa literalmente “e”, mas a frase pode ter sentido distributivo: cada pessoa trouxe o metal que possuía, fosse prata, bronze ou ambos.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “com quem se achava madeira de acácia”, expressão hebraica que significa que a pessoa a possuía ou a tinha disponível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: Todos os que apresentaram
  rationale: O particípio de רוּם junto de תְּרוּמָה é uma expressão idiomática para apresentar ou entregar uma contribuição. A forma plural é natural em português e concorda com o verbo hebraico plural הֵבִיאוּ.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: uma oferta de prata ou bronze
  rationale: 'תְּרוּמָה designa uma contribuição separada para uso sagrado. Neste contexto, נְחֹשֶׁת é tradicional e adequadamente entendido como bronze. O hebraico traz a conjunção “e”, mas a referência distributiva permite “ou”: cada pessoa oferecia prata, bronze ou ambos.'
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: trouxeram a oferta para Yahweh
  rationale: A construção hebraica associa a oferta a Yahweh como aquilo que lhe é destinado. Em português, “para Yahweh” evita a possível impressão de que a oferta procedia dele, sem alterar sua dedicação sagrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Reproduz o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: e todos os que tinham ... disponível
  rationale: Literalmente, “e todo aquele com quem se achava”. Trata-se de uma expressão hebraica de posse ou disponibilidade; a redação escolhida comunica seu sentido naturalmente.
- source_word: עֲצֵי שִׁטִּים
  choice: madeira de acácia
  rationale: É a designação moderna, clara e habitual desse material, sem recorrer à transliteração pouco conhecida “madeira de sitim”.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: para algum trabalho do serviço
  rationale: 'A tradução preserva os dois substantivos: מְלָאכָה, “trabalho”, e עֲבֹדָה, “serviço”. “Algum” expressa de modo natural o valor distributivo de כָּל, sem inserir explicitamente “tabernáculo”, que está implícito no contexto, mas não ocorre na frase.'
- source_word: הֵבִיאוּ
  choice: a trouxeram
  rationale: O pronome retoma “madeira de acácia”; a concordância feminina singular é natural em português para esse substantivo coletivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a prática do projeto, sem substituí-lo por um título.
- issue: Relação expressa em תְּרוּמַת יְהוָה
  choice: a oferta para Yahweh
  alternative: a oferta de Yahweh
  rationale: O estado construto pode ser reproduzido formalmente com “de”, mas, em português, isso pode sugerir que Yahweh é quem dá a oferta. “Para Yahweh” expressa que ela lhe é apresentada ou dedicada, mantendo a relação teológica indicada pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi tornada natural sem eliminar a alternativa da conjunção hebraica nem explicitar “tabernáculo”, ausente neste versículo.
