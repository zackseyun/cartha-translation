revisions:
- from: Encheu-os de sabedoria de coração[b] para executar todo tipo de trabalho de artífice[a], de desenhista, de bordador com fio azul, púrpura e escarlate e com linho fino, e de tecelão — executando todo tipo de trabalho e concebendo projetos[c].
  to: Encheu-os de sabedoria de coração[b] para executar todo tipo de trabalho de artífice[a], de desenhista, de bordador com fio azul, púrpura e escarlate e com linho fino, e de tecelão — todos eles executores de todo tipo de trabalho e projetistas de projetos[c].
  rationale: A revisão explicita «todos eles» e emprega substantivos plurais para refletir a função recapitulativa dos particípios hebraicos finais, eliminando a ligação ambígua dos gerúndios ao tecelão. «Projetistas de projetos» conserva deliberadamente a repetição cognata do hebraico; a nota literal foi ajustada para corresponder à nova formulação e ao sentido participial.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:52:06Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente que Deus os encheu de «sabedoria de coração» para os vários ofícios especializados. «Artífice» é uma opção prudente para חָרָשׁ, sem restringir indevidamente o termo a gravador. Os materiais têxteis e os dois particípios finais são preservados.
  naturalness: A enumeração é clara e de registro adequado. Contudo, o gerúndio singularmente encadeado após «tecelão» («— executando ... e concebendo ...») fica sintaticamente pendente e pode parecer qualificar somente o tecelão, embora o hebraico use particípios plurais que recapitulam o conjunto dos trabalhadores. Uma formulação explicitamente plural resolve isso.
  terminology: «Sabedoria de coração», «artífice», «bordador», «tecelão» e «linho fino» são adequados. «Desenhista» é compreensível para o profissional que concebe padrões; «projetos» comunica bem o segundo membro final, com a repetição cognata explicada em nota.
  issues:
  - severity: medium
    issue: Os gerúndios finais não têm referente plural sintaticamente claro.
    rationale: עֹשֵׂי ... וְחֹשְׁבֵי são particípios masculinos plurais e funcionam como recapitulação do conjunto de artífices. Em português, «de tecelão — executando» pode ligar os gerúndios apenas a «tecelão» e não representa claramente o plural.
