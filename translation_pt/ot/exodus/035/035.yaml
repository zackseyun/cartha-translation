  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: pt
  text: Encheu-os de sabedoria de coração[b] para executar todo tipo de trabalho de artífice[a], de desenhista, de bordador com fio azul, púrpura e escarlate e com linho fino, e de tecelão — todos eles executores de todo tipo de trabalho e projetistas de projetos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “gravador”. O termo hebraico pode designar um artesão especializado em sentido amplo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sabedoria de coração”, expressão hebraica que inclui habilidade, discernimento e aptidão interior para o trabalho.
    reason: cultural_note
  - marker: c
    text: Literalmente, “planejadores de planos”. O hebraico emprega palavras da mesma raiz para dar ênfase à concepção artística.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: Encheu-os
  rationale: Traduz diretamente o piel perfeito de מלא e mantém o sujeito implícito recuperável do contexto anterior.
- source_word: חָכְמַת לֵב
  choice: sabedoria de coração
  rationale: Preserva a expressão hebraica, que reúne habilidade, discernimento e aptidão interior, com nota explicativa para o leitor moderno.
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: para executar todo tipo de trabalho
  rationale: Expressa naturalmente em português a finalidade e a abrangência de כל, enquanto מלאכה designa trabalho ou ofício especializado.
- source_word: חָרָשׁ
  choice: artífice
  rationale: O termo hebraico pode designar amplamente um artesão especializado; 'artífice' evita restringi-lo sem necessidade à gravação.
- source_word: חֹשֵׁב
  choice: desenhista
  rationale: No contexto dos trabalhos do santuário, refere-se a quem concebe desenhos ou padrões artísticos.
- source_word: רֹקֵם
  choice: bordador
  rationale: Equivalente corrente para o profissional que realiza trabalho decorativo em tecido.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: fio azul, púrpura e escarlate
  rationale: Torna explícito o caráter têxtil dos materiais coloridos sem impor uma identificação mais precisa dos antigos corantes.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: Nos contextos do tabernáculo, o termo se refere ao linho de qualidade fina.
- source_word: אֹרֵג
  choice: tecelão
  rationale: Tradução direta e idiomática do particípio que designa quem tece.
- source_word: עֹשֵׂי כָּל מְלָאכָה וְחֹשְׁבֵי מַחֲשָׁבֹת
  choice: executando todo tipo de trabalho e concebendo projetos
  rationale: Mantém os dois particípios e o paralelismo final; 'concebendo projetos' comunica o jogo cognato hebraico de modo natural em português, com a forma literal registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a expressão bíblica 'sabedoria de coração', explicada em nota; a enumeração dos ofícios permanece formal, mas natural.
