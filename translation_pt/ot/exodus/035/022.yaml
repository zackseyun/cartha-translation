  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: pt
  text: Assim, os homens vieram com as mulheres[a]. Todos os que tinham o coração disposto trouxeram broches, argolas, anéis e adornos — todo tipo de joia de ouro[b]. E todo homem que apresentou a Yahweh uma oferta movida de ouro o fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica, literalmente “os homens sobre as mulheres”, é idiomática e difícil; provavelmente indica que os homens vieram junto com as mulheres ou além delas.
    reason: alternative_reading
  - marker: b
    text: O significado exato de alguns termos para joias é incerto. “Broches” também pode significar fechos ou argolas; as “argolas” podiam ser usadas nas orelhas ou no nariz; e “adornos” talvez designe um tipo específico de pingente, bracelete ou adorno de braço.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Assim, ... vieram
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Assim” expressa a sequência com fluidez em português.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: os homens vieram com as mulheres
  rationale: A preposição עַל tem aqui uso idiomático difícil; no contexto, indica mais provavelmente participação conjunta ou adicional, não posição espacial.
- source_word: כֹּל נְדִיב לֵב
  choice: todos os que tinham o coração disposto
  rationale: Preserva a expressão antropológica hebraica e comunica uma disposição interior voluntária e generosa.
- source_word: חָח
  choice: broches
  rationale: O objeto exato é incerto; “broches” oferece um equivalente moderno plausível, sem ocultar em nota outras possibilidades.
- source_word: נֶזֶם
  choice: argolas
  rationale: O termo pode designar uma argola usada na orelha ou no nariz; “argolas” mantém essa ambiguidade melhor que “brincos”.
- source_word: טַבַּעַת
  choice: anéis
  rationale: Tradução ampla e segura, evitando especificar sem necessidade que fossem anéis de sinete.
- source_word: כוּמָז
  choice: adornos
  rationale: Como o termo é raro e seu referente exato é incerto, uma designação abrangente evita falsa precisão.
- source_word: כָּל כְּלִי זָהָב
  choice: todo tipo de joia de ouro
  rationale: No contexto imediato de adornos pessoais, esta formulação natural representa o sentido coletivo de objetos de ouro.
- source_word: וְכָל אִישׁ
  choice: E todo homem
  rationale: Mantém o masculino singular explícito de אִישׁ.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: apresentou ... uma oferta de ouro movida ritualmente
  rationale: Preserva o caráter técnico de תְּנוּפָה sem sugerir ao leitor apenas um gesto informal de agitar o ouro.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Reproduz o nome pactual presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Linguagem de gênero em וְכָל אִישׁ
  choice: todo homem
  alternative: todos; toda pessoa
  rationale: Preserva a forma masculina singular explícita do original, enquanto a participação de homens e mulheres já aparece no início do versículo.
- issue: Natureza ritual de תְּנוּפָה
  choice: oferta de ouro movida ritualmente
  alternative: oferta de ouro; oferta movida de ouro
  rationale: Mantém a especificidade cultual do termo, mas usa uma formulação inteligível em português corrente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. Mantiveram-se a imagem hebraica do coração disposto, o nome Yahweh e a especificidade ritual da oferta, enquanto as incertezas lexicais foram indicadas em notas.
