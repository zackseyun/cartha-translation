  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: pt
  text: Os líderes trouxeram as pedras de ônix[a] e as pedras para engaste, para o éfode e para o peitoral[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “pedras de shoham”. A identificação exata dessa pedra preciosa é incerta; “ônix” é a tradução tradicional.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o ornamento sacerdotal usado sobre o peito, não uma peça de armadura.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: Os líderes
  rationale: נְשִׂיאִים designa os chefes ou representantes da comunidade. “Líderes” é claro e atual, sem a conotação monárquica que “príncipes” pode sugerir.
- source_word: הֵבִיאוּ
  choice: trouxeram
  rationale: O hifil de בוא significa aqui trazer ou apresentar; “trouxeram” preserva com naturalidade a ação concreta no contexto das contribuições.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: as pedras de ônix[a]
  rationale: “Ônix” é a identificação tradicional de שֹׁהַם, embora o mineral exato seja incerto; a nota preserva essa incerteza lexical.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: as pedras de engaste
  rationale: No contexto da ourivesaria cultual, מִלֻּאִים indica pedras destinadas a ser engastadas. A expressão é concisa e idiomática em português.
- source_word: לָאֵפֹד
  choice: para o colete sacerdotal
  rationale: אֵפֹד é uma peça própria da indumentária sacerdotal. “Colete sacerdotal” comunica sua natureza ao leitor comum melhor que a simples transliteração, sem pretender uma equivalência moderna exata.
- source_word: וְלַחֹשֶׁן
  choice: e para o peitoral[b]
  rationale: חֹשֶׁן designa o ornamento sacerdotal usado sobre o peito. “Peitoral” é a forma portuguesa tradicional e natural; a nota evita que seja entendido como armadura.
