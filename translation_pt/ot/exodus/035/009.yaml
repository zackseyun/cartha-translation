  text: onyx stones[a], and stones for setting, for the ephod and for the breastpiece.
translation:
  language: pt
  text: pedras de ônix[a] e pedras para engastar, para o éfode e para o peitoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico שֹׁהַם (shoham) é tradicionalmente traduzido por «ônix», mas não se sabe ao certo qual era essa pedra preciosa; outras possibilidades incluem o berilo ou simplesmente uma pedra chamada «shoham».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: pedras de ônix
  rationale: שֹׁהַם designa uma pedra preciosa cuja identificação exata é incerta. «Ônix» é a tradução tradicional e amplamente reconhecida em português; a incerteza lexical é preservada em nota.
- source_word: אַבְנֵי מִלֻּאִים
  choice: pedras para engastar
  rationale: מִלֻּאִים refere-se aqui a pedras destinadas a ser encaixadas ou fixadas nas vestes sacerdotais. «Para engastar» expressa com clareza essa função em português atual.
- source_word: לָאֵפֹד
  choice: no éfode
  rationale: אֵפֹד é um termo técnico para uma veste sacerdotal. A transliteração consagrada «éfode» preserva a especificidade cultual sem acrescentar uma interpretação.
- source_word: וְלַחֹשֶׁן
  choice: e no peitoral
  rationale: חֹשֶׁן designa a peça sacerdotal usada sobre o peito e ornamentada com pedras. «Peitoral» é claro, tradicional e não sugere necessariamente uma armadura militar.
