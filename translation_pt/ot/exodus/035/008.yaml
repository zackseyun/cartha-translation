  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן
  choice: óleo
  rationale: O substantivo designa óleo, normalmente de oliva neste contexto; “óleo” preserva a abrangência do hebraico sem acrescentar uma especificação não expressa.
- source_word: לַמָּאוֹר
  choice: para a iluminação
  rationale: מָאוֹר pode designar luz ou fonte de luz; nesta lista de materiais, a expressão indica óleo destinado a produzir luz. “Para a iluminação” é natural em português e evita sugerir uma lâmpada específica.
- source_word: בְשָׂמִים
  choice: especiarias
  rationale: O plural se refere a substâncias aromáticas usadas nas preparações sagradas. “Especiarias” é uma forma corrente e suficientemente abrangente.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: óleo da unção
  rationale: A construção é uma expressão cultual reconhecida. “Óleo da unção” é clara, digna e próxima da forma nominal hebraica.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: incenso aromático
  rationale: A expressão significa literalmente “incenso de especiarias/substâncias aromáticas”. “Incenso aromático” comunica o sentido com naturalidade e sem redundância excessiva em português.
