  text: And all the women whose hearts moved them with skill spun the goats' hair[a].
translation:
  language: pt
  text: E todas as mulheres cujo coração as impulsionou com habilidade fiaram pelos de cabra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as cabras”; aqui o hebraico emprega uma elipse para se referir aos pelos de cabra usados na fiação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: E todas as mulheres
  rationale: כָּל com o substantivo no plural tem sentido coletivo; “todas as mulheres” é natural e fiel em português.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: cujo coração as impulsionou
  rationale: A expressão hebraica descreve uma disposição interior que leva alguém a agir. “As impulsionou” conserva a imagem do coração e comunica motivação voluntária sem tradução excessivamente literal.
- source_word: בְּחָכְמָה
  choice: com habilidade
  rationale: No contexto do trabalho artesanal, חָכְמָה indica perícia prática, não apenas sabedoria abstrata.
- source_word: טָווּ
  choice: fiaram
  rationale: O verbo designa o ato de fiar fibras têxteis; “fiaram” é o equivalente direto e corrente.
- source_word: אֶת הָעִזִּים
  choice: pelos de cabra
  rationale: Literalmente, o hebraico diz “as cabras”, mas emprega uma elipse contextual para os pelos usados como fibra. A explicitação evita sugerir que as próprias cabras foram fiadas.
