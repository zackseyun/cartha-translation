revisions:
- from: Vieram todos aqueles cujo coração os impulsionou[a] e todos aqueles cujo espírito os dispôs voluntariamente. Eles trouxeram a contribuição para Yahweh[b], destinada ao trabalho da tenda do encontro, a todo o seu serviço e às vestes sagradas.
  to: Vieram todos aqueles cujo coração os impulsionou[a], e todos aqueles cujo espírito os levou a contribuir espontaneamente. Eles trouxeram a contribuição para Yahweh[b] para o trabalho da tenda do encontro, para todo o seu serviço e para as vestes sagradas.
  rationale: A revisão substitui uma expressão portuguesa ambígua e pouco natural por uma formulação atual que conserva tanto o impulso interior quanto a livre disposição para contribuir. Também explicita paralelamente as três finalidades da contribuição, sem alterar o sentido do texto nem a ambiguidade formal assinalada na nota.
