  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: pt
  text: Vieram todos aqueles cujo coração os impulsionou[a], e todos aqueles cujo espírito os levou a contribuir espontaneamente. Eles trouxeram a contribuição para Yahweh[b] para o trabalho da tenda do encontro, para todo o seu serviço e para as vestes sagradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cujo coração o elevou”. A expressão hebraica descreve um impulso interior.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “a contribuição de Yahweh” ou “a oferta de Yahweh”; no contexto, trata-se da contribuição dedicada a ele.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Vieram
  rationale: Reproduz diretamente o verbo בוא e a sequência narrativa, sem acrescentar a ideia interpretativa de “apresentar-se”.
- source_word: כָּל אִישׁ
  choice: todos aqueles
  rationale: Comunica naturalmente o valor distributivo e genérico da expressão hebraica, sem restringi-la desnecessariamente a homens.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: cujo coração os impulsionou
  rationale: Expressa em português atual o impulso interior da metáfora hebraica, literalmente “cujo coração o elevou”, sem tornar a frase obscura.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: e todos aqueles cujo espírito os dispôs voluntariamente
  rationale: Preserva tanto o estímulo interior atribuído ao espírito da pessoa quanto a disposição livre e generosa expressa por נדב.
- source_word: הֵבִיאוּ
  choice: Eles trouxeram
  rationale: Mantém a ação concreta de levar as contribuições e explicita o sujeito em uma nova frase para dar clareza ao período em português.
- source_word: תְּרוּמַת יְהוָה
  choice: a contribuição para Yahweh
  rationale: תרומה designa uma contribuição ou oferta separada para um propósito sagrado; “para Yahweh” exprime com naturalidade sua destinação, reconhecendo em nota a ambiguidade do genitivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: destinada ao trabalho da tenda do encontro
  rationale: מלאכה abrange o trabalho necessário para a tenda; “destinada” deixa clara a relação de finalidade introduzida por לְ.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: a todo o seu serviço
  rationale: “Serviço” conserva a amplitude de עבודה no contexto do santuário, incluindo suas atividades e funções.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: e às vestes sagradas
  rationale: É uma forma clara e corrente de designar as vestes consagradas para o serviço sacerdotal.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original traz o nome próprio divino; a transliteração “Yahweh” preserva essa distinção sem substituí-lo por um título.
- issue: Relação expressa em תְּרוּמַת יְהוָה
  choice: contribuição para Yahweh
  alternative: contribuição de Yahweh; oferta de Yahweh
  rationale: No contexto, a contribuição é dedicada a Yahweh. Como a construção hebraica admite mais de uma formulação genitiva, a alternativa é registrada em nota sem fazer dela uma afirmação de que Yahweh seja o doador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita um período pesado sem alterar a sequência das ações. Os pronomes plurais retomam naturalmente “todos aqueles”, enquanto as notas preservam o caráter idiomático e a ambiguidade genuína do hebraico.
