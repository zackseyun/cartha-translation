  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: pt
  text: 'Então Moisés disse aos filhos de Israel[a]: “Vejam, Yahweh chamou Bezalel pelo nome, filho de Uri, filho de Hur, da tribo de Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “aos descendentes de Israel”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então ... disse” expressa com naturalidade a sequência em português atual.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão filial masculina do hebraico, que aqui também funciona como designação coletiva do povo; alternativas idiomáticas são registradas em nota.
- source_word: רְאוּ
  choice: Vejam
  rationale: O imperativo plural chama a atenção dos ouvintes para a declaração seguinte. “Vejam” é atual e mantém o número gramatical.
- source_word: קָרָא ... בְּשֵׁם
  choice: chamou pelo nome
  rationale: Mantém o idioma hebraico de chamar ou designar pessoal e especificamente alguém, sem reduzi-lo a mero ato de dar nome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Transliteração corrente e reconhecível do nome pessoal em português.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: filho de Uri, filho de Hur
  rationale: Reproduz diretamente a estrutura genealógica hebraica e deixa explícitas as duas gerações.
- source_word: לְמַטֵּה יְהוּדָה
  choice: da tribo de Judá
  rationale: Expressa de modo natural em português a filiação tribal indicada pela preposição לְ.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” preserva essa função e evita substituí-lo silenciosamente por um título.
- issue: Expressão coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A forma escolhida conserva a linguagem de parentesco e o gênero gramatical do hebraico, enquanto a nota esclarece seu sentido étnico e coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto usa o plural “Vejam”, e a construção “chamou pelo nome” preserva o idioma hebraico sem soar arcaica.
