  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: pt
  text: no corte de pedras para engastá-las e no entalhe de madeira, para executar todo tipo de trabalho artístico.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo tipo de trabalho planejado” ou “todo tipo de trabalho habilidoso”. O termo hebraico transmite a ideia de uma obra realizada com planejamento, desenho ou perícia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: no trabalho / no entalhe
  rationale: 'חֲרֹשֶׁת designa trabalho artesanal especializado. A formulação varia de modo natural conforme o material: “trabalho” para as pedras e “entalhe” para a madeira, sem perder a correspondência entre as duas ocorrências.'
- source_word: אֶבֶן
  choice: pedras
  rationale: Embora o hebraico empregue o singular, o plural expressa naturalmente em português o sentido genérico do material trabalhado neste contexto artesanal.
- source_word: לְמַלֹּאת
  choice: para engastá-las
  rationale: No contexto da fabricação do santuário, o verbo se refere a inserir e fixar pedras em seus suportes ou encaixes, não simplesmente a “encher”. O pronome explicita de forma natural que o objeto são as pedras.
- source_word: עֵץ
  choice: madeira
  rationale: Aqui עֵץ indica madeira como matéria-prima, e não uma árvore viva.
- source_word: לַעֲשׂוֹת
  choice: para executar
  rationale: O verbo עשה é amplo; “executar” combina naturalmente com trabalhos artesanais e preserva o sentido de realizar a obra.
- source_word: בְּכָל מְלֶאכֶת
  choice: todo tipo de trabalho
  rationale: A expressão tem força abrangente e distributiva, referindo-se à variedade completa das tarefas artesanais.
- source_word: מַחֲשָׁבֶת
  choice: artístico
  rationale: O termo qualifica uma obra concebida com planejamento, desenho e habilidade. “Artístico” é claro e idiomático em português, enquanto a nota preserva as outras nuances possíveis.
