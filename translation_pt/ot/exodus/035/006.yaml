lexical_decisions:
- source_word: תְכֵלֶת
  choice: fio azul
  rationale: O termo designa material têxtil tingido de azul ou azul-arroxeado. No contexto da lista de materiais para o tabernáculo, “fio azul” comunica naturalmente tanto a cor quanto a natureza têxtil.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Refere-se a material tingido de púrpura. A forma concisa preserva o estilo de lista, ficando “fio” subentendido a partir do primeiro item.
- source_word: תוֹלַעַת שָׁנִי
  choice: escarlate
  rationale: A expressão refere-se a material tingido de escarlate com corante de inseto. “Escarlate” é natural em português e, em paralelo com “fio azul”, permite entender o material têxtil sem uma repetição pesada.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: Nos contextos do tabernáculo, o termo indica linho de qualidade fina; a tradução mantém essa distinção provável.
- source_word: עִזִּים
  choice: pelos de cabra
  rationale: O hebraico diz literalmente “cabras”, mas, nesta lista de materiais têxteis, refere-se aos pelos usados na confecção das coberturas do tabernáculo.
- source_word: וְ
  choice: e
  rationale: A conjunção liga os itens. Em português, sua repetição integral seria marcada e pouco natural; a coordenação é preservada com vírgulas e com “e” nos agrupamentos finais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A elipse de “fio” diante de “púrpura” e “escarlate” evita repetição excessiva sem perder o sentido têxtil. O fragmento mantém a forma de item dentro da lista iniciada nos versículos anteriores.
