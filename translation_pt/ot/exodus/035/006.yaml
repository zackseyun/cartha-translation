  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: pt
  text: e fio azul, púrpura e escarlate, linho fino e pelos de cabra[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “cabras”; neste contexto, refere-se aos pelos de cabra usados como material do tabernáculo.
