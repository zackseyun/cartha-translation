base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: pt
  text: o altar do incenso[a] e suas varas, o óleo da unção, o incenso aromático[b] e a cortina para a entrada do tabernáculo[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o altar para queimar incenso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o incenso de especiarias” ou “o incenso preparado com especiarias”.
    reason: lexical_alternative
  - marker: c
    text: Ou “a cortina da entrada do tabernáculo” ou “a cortina à entrada do tabernáculo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: o altar do incenso
  rationale: A cadeia construta designa o altar associado ao incenso. A formulação é clara, tradicional e mantém a especificidade cultual.
- source_word: בַּדָּיו
  choice: suas varas
  rationale: No contexto do tabernáculo, o termo se refere às varas usadas para transportar o mobiliário sagrado. “Varas” é conciso e amplamente compreensível.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: Expressão cultual que designa o óleo empregado na unção; esta formulação é natural e preserva a relação explícita do hebraico.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: o incenso aromático
  rationale: הַסַּמִּים indica substâncias aromáticas usadas no incenso. “Incenso aromático” comunica o sentido sem tornar a expressão excessivamente literal.
- source_word: מָסַךְ הַפֶּתַח
  choice: a cortina para a entrada
  rationale: מָסָךְ denota uma peça suspensa que fechava ou resguardava uma entrada. “Cortina” é mais corrente em português do que “anteparo” e se ajusta ao objeto têxtil descrito.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: para a entrada do tabernáculo
  rationale: O לְ marca a relação ou função da cortina com a entrada. A tradução conserva essa relação de modo natural em português.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Embora o sentido básico seja “morada” ou “habitação”, “tabernáculo” é o termo estabelecido para esta estrutura sagrada em Êxodo e favorece a consistência referencial.
