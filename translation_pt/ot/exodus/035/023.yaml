base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: pt
  text: E todo homem que tinha consigo fio azul, fio púrpura, fio escarlate, linho fino, pelos de cabra, peles de carneiro tingidas de vermelho e peles de táhax[a] os trouxe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico táhax designa um animal ou material cuja identificação é incerta. Entre as traduções propostas estão “couro fino”, “peles de toninha” e “peles de dugongo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: E todo homem
  rationale: אִישׁ é masculino singular e, com כָל, tem sentido distributivo. “Todo homem” preserva a forma e o referente masculino no contexto dos doadores.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: que tinha consigo
  rationale: A construção hebraica significa literalmente que os materiais foram encontrados com ele; “tinha consigo” comunica essa posse de modo natural em português.
- source_word: תְּכֵלֶת
  choice: fio azul
  rationale: No contexto do tabernáculo, designa material têxtil tingido de azul; “fio” torna concreto o sentido sem sugerir tecido já pronto.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Designa material têxtil de cor púrpura. Mantém-se o substantivo tradicional e abrangente, pois a forma exata do material não é explicitada.
- source_word: תוֹלַעַת שָׁנִי
  choice: fio escarlate
  rationale: A expressão indica material têxtil tingido de escarlate; “fio escarlate” é claro e adequado à lista de materiais.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: Em textos sacerdotais e do tabernáculo, שֵׁשׁ costuma designar linho de alta qualidade.
- source_word: עִזִּים
  choice: pelos de cabra
  rationale: Embora a palavra diga literalmente “cabras”, nesta lista refere-se ao pelo usado para tecer as coberturas; explicitar o material evita a impressão de que trouxeram animais vivos.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: peles de carneiro tingidas de vermelho
  rationale: Reproduz com clareza tanto o tipo de pele quanto o tratamento ou coloração vermelha indicado pelo particípio.
- source_word: עֹרֹת תְּחָשִׁים
  choice: peles de táhax
  rationale: A identificação de תְּחָשׁ é incerta. A transliteração preserva a incerteza lexical, que é explicada em nota.
- source_word: הֵבִיאוּ
  choice: os trouxe
  rationale: O verbo plural hebraico resume a ação dos homens que possuíam os materiais. Em português, com o sujeito distributivo singular “todo homem”, a concordância singular é natural; “os” explicita o objeto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da lista hebraica foi preservada. Empregou-se “tinha consigo” em vez de uma reprodução rígida de “foram encontrados com ele”, e manteve-se a incerteza de táhax por transliteração acompanhada de nota.
