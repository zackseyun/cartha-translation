  text: the pegs of the tabernacle[a], and the pegs of the courtyard, and their ropes—
translation:
  language: pt
  text: as estacas do tabernáculo, as estacas do pátio e suas cordas[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus tirantes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְדֹת
  choice: estacas
  rationale: Designa as peças cravadas no solo para firmar a estrutura e suas cortinas. “Estacas” é claro e natural em português; “pregos” poderia sugerir peças menores ou usadas em madeira.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É o termo consagrado para a morada sagrada móvel descrita em Êxodo e preserva sua função cultual sem tornar a expressão vaga.
- source_word: הֶחָצֵר
  choice: o pátio
  rationale: No contexto do tabernáculo, refere-se à área externa cercada. “Pátio” é corrente e facilmente compreensível.
- source_word: מֵיתְרֵיהֶם
  choice: suas cordas
  rationale: Refere-se às cordas usadas para firmar a estrutura e as cortinas por meio das estacas. “Cordas” é a opção mais transparente em português moderno, enquanto “tirantes” explicita mais a função.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: as estacas ... as estacas ... e suas cordas
  rationale: Os marcadores de objeto não são traduzidos diretamente. A coordenação foi mantida como uma lista simples, com apenas o último “e”, conforme o uso natural do português.
