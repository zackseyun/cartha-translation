  text: אֵ֣ת מִזְבַּ֣ח הָ/עֹלָ֗ה וְ/אֶת מִכְבַּ֤ר הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁר ל֔/וֹ אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּֽ/וֹ׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/016.yaml
  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: pt
  text: o altar do holocausto, a grade de bronze[a] que lhe pertence, suas varas e todos os seus utensílios, a bacia e seu suporte[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grelha de bronze” ou “treliça de bronze”.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “a pia e sua base”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: A expressão construta designa o altar destinado à oferta inteiramente queimada. “Altar do holocausto” é a forma bíblica consagrada em português e permanece clara no contexto cultual.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: a grade de bronze
  rationale: מִכְבָּר denota uma estrutura reticulada ligada ao altar. “Grade de bronze” comunica com naturalidade tanto o material quanto a forma geral, sem definir além do hebraico sua configuração exata.
- source_word: אֲשֶׁר לוֹ
  choice: que lhe pertence
  rationale: A locução relativa expressa posse ou associação com o altar. A tradução evita especificar uma posição física que o texto não declara.
- source_word: בַּדָּיו
  choice: suas varas
  rationale: בַּדִּים são as varas empregadas para transportar os objetos do santuário. “Varas” é corrente na linguagem bíblica portuguesa e não exige acrescentar no texto a função de transporte, já implícita no contexto.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כֵּלִים abrange os objetos e instrumentos associados ao altar. “Utensílios” é amplo, moderno e adequado ao equipamento ritual.
- source_word: הַכִּיֹּר
  choice: a bacia
  rationale: O termo indica o recipiente usado para lavagens no pátio do tabernáculo. “Bacia” é mais acessível no português atual do que o tradicional “pia” neste contexto.
- source_word: כַּנּוֹ
  choice: seu suporte
  rationale: כֵּן designa a peça que sustenta a bacia. “Suporte” é concreto e natural, enquanto “base” continua sendo uma alternativa possível.
theological_decisions: []
