lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: No contexto do santuário, designa a estrutura sagrada da habitação de YHWH entre Israel; “tabernáculo” é o termo consagrado e específico em português.
- source_word: אָהֳלוֹ
  choice: sua tenda
  rationale: Mantém a distinção hebraica entre o tabernáculo e o componente de tenda que lhe pertence.
- source_word: מִכְסֵהוּ
  choice: sua cobertura
  rationale: Expressa a camada protetora sem especificar material ou posição além do que o hebraico afirma.
- source_word: קְרָסָיו
  choice: seus fechos
  rationale: Indica peças que prendiam ou uniam as cortinas; é natural em português e evita precisão mecânica indevida.
- source_word: קְרָשָׁיו
  choice: suas tábuas
  rationale: É a tradução direta usual no contexto da construção, preservando em nota a possibilidade de uma estrutura em armações.
- source_word: בְּרִיחָיו
  choice: suas travessas
  rationale: Refere-se às barras horizontais que mantinham unidos os elementos estruturais; “travessas” comunica naturalmente essa função arquitetônica.
- source_word: עַמֻּדָיו
  choice: suas colunas
  rationale: Designa suportes verticais e mantém um registro arquitetônico claro e digno.
- source_word: אֲדָנָיו
  choice: suas bases
  rationale: Comunica de modo claro as peças inferiores de sustentação, sem excluir a forma mais específica de encaixes.
