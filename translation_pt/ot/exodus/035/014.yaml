  yaml_path: translation/ot/exodus/035/014.yaml
  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: pt
  text: e o candelabro para a iluminação[a], e seus utensílios, e suas lâmpadas, e o azeite para a iluminação,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “o candelabro da iluminação” e “o azeite da iluminação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: o candelabro para a iluminação
  rationale: מְנוֹרָה designa o candelabro do santuário, enquanto הַמָּאוֹר pode indicar a luz ou a iluminação. A formulação preserva a relação de construção hebraica e soa natural em português.
- source_word: כֵּלֶיהָ
  choice: seus utensílios
  rationale: כְּלִי é um termo amplo para objetos, recipientes ou instrumentos. “Utensílios” mantém essa amplitude no contexto dos objetos do santuário.
- source_word: נֵרֹתֶיהָ
  choice: suas lâmpadas
  rationale: נֵר designa normalmente uma lâmpada ou sua chama; aqui, no plural e ligado ao candelabro, refere-se às lâmpadas individuais.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: o azeite para a iluminação
  rationale: A expressão significa literalmente “o azeite da luz/iluminação”. “Para a iluminação” conserva a repetição de מָאוֹר e expressa com clareza a finalidade do azeite.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: e ... e ... e ... e
  rationale: A repetição de “e” preserva a estrutura cumulativa e o ritmo de inventário do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição deliberada da conjunção para refletir o estilo de lista do hebraico. “Candelabro” é a designação corrente e precisa do objeto do santuário; “azeite” traduz o óleo de oliva pressuposto pelo contexto bíblico.
