  text: e peles de carneiros tingidas de vermelho, peles de tahash[a] e madeira de acácia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico tahash (תְּחָשִׁים) é de significado incerto; tem sido entendido como couro fino, couro de cabra, peles de toninha, peles de dugongo ou peles de vaca-marinha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם
  choice: peles de carneiros
  rationale: A expressão designa peles de carneiros usadas como material; esta formulação é precisa e natural em português.
- source_word: מְאָדָּמִים
  choice: tingidas de vermelho
  rationale: O particípio passivo/resultativo indica que as peles foram tornadas vermelhas; no contexto de materiais preparados, “tingidas de vermelho” expressa naturalmente o sentido provável.
- source_word: עֹרֹת תְּחָשִׁים
  choice: couro fino
  rationale: Como a identificação de תְּחָשִׁים é incerta, evita-se especificar sem segurança uma espécie animal; “couro fino” comunica um material de cobertura tratado, enquanto as principais possibilidades ficam registradas em nota.
- source_word: עֲצֵי שִׂטִּים
  choice: madeira de acácia
  rationale: A expressão se refere à madeira proveniente de acácias; “madeira de acácia” é clara, atual e consagrada em português.
