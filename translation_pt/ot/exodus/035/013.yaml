lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O substantivo designa simplesmente a mesa sagrada; sua função é esclarecida pela menção posterior ao pão da Presença, sem necessidade de explicitação adicional.
- source_word: בַּדָּיו
  choice: suas varas
  rationale: No contexto do santuário, בַּדִּים são as varas usadas para transportar o mobiliário sagrado. «Varas» é a forma bíblica corrente, clara e concisa em português.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כְּלִי é um termo amplo para objetos, recipientes ou instrumentos; no serviço da mesa, «utensílios» é natural e suficientemente abrangente.
- source_word: לֶחֶם הַפָּנִים
  choice: o pão da Presença
  rationale: A expressão significa literalmente «pão da face/presença». «Pão da Presença» conserva a formulação cultual hebraica e permanece compreensível, enquanto «pães da proposição» é tradicional, mas menos transparente.
