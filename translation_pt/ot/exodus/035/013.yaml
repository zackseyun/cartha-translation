  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: pt
  text: a mesa, suas varas, todos os seus utensílios e o pão da Presença[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «os pães da proposição».
