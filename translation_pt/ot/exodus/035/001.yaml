id: EXO.35.1
reference: Exodus 35:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: pt
  text: 'Então Moisés reuniu toda a comunidade dos filhos de Israel e lhes disse: “Estas são as coisas que Yahweh ordenou que fossem feitas.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estas são as palavras” ou “Estes são os assuntos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: reuniu
  rationale: O hifil de קהל indica que Moisés fez o povo reunir-se como corpo constituído; “reuniu” é natural e preciso em português.
- source_word: כָּל עֲדַת
  choice: toda a comunidade
  rationale: עֵדָה designa a coletividade reunida de Israel. “Comunidade” comunica o sentido corporativo sem sugerir apenas uma reunião religiosa local.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém a forma masculina e a designação pactual do hebraico, que neste contexto abrange toda a comunidade de Israel.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Estas são as coisas
  rationale: דְּבָרִים pode significar palavras, coisas ou assuntos; como o contexto introduz ações ordenadas, “coisas” preserva bem sua amplitude prática.
- source_word: צִוָּה יְהוָה
  choice: Yahweh ordenou
  rationale: O perfeito hebraico remete à ordem já dada e ainda vigente; o pretérito perfeito é a formulação mais natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לַעֲשֹׂת אֹתָם
  choice: que fossem feitas
  rationale: Expressa de modo idiomático as ações que deveriam ser executadas, conservando a referência plural de אֹתָם.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Representação de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A tradução conserva a forma do hebraico e sua função pactual, sem restringir a referência aos homens, pois a expressão qualifica toda a comunidade.
- issue: Agente implícito em לַעֲשֹׂת אֹתָם
  choice: que fossem feitas
  alternative: para fazê-las
  rationale: A construção portuguesa mantém em aberto quem executará cada ordem e destaca que as coisas ordenadas devem ser realizadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada à sintaxe natural do português; “lhes disse” representa אֲלֵהֶם sem repetição pesada. A nota preserva a amplitude semântica de דְּבָרִים.
