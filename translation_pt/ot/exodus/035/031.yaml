id: EXO.35.31
reference: Exodus 35:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: pt
  text: e o encheu do Espírito de Deus[a], de sabedoria, de entendimento, de conhecimento e de toda habilidade artesanal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «espírito de Deus» ou «espírito divino». A expressão hebraica pode ser entendida de modo mais geral, mas aqui provavelmente se refere ao próprio Espírito capacitador de Deus.
    reason: alternative_reading
  - marker: b
    text: Ou «de todo tipo de trabalho» ou «em todo ofício».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: e o encheu
  rationale: O waw consecutivo com o piel imperfeito na narrativa é vertido no passado. A ordem pronominal é natural em português, e o sujeito, Deus, vem do contexto anterior.
- source_word: אֹתוֹ
  choice: o
  rationale: O pronome de objeto direto retoma Bezalel, mencionado no versículo anterior.
- source_word: רוּחַ אֱלֹהִים
  choice: Espírito de Deus
  rationale: No contexto da capacitação divina para o serviço do santuário, a expressão provavelmente designa o próprio Espírito de Deus; a nota preserva as possibilidades mais gerais da construção hebraica.
- source_word: בְּחָכְמָה
  choice: de sabedoria
  rationale: Depois de «encheu», a preposição «de» expressa naturalmente em português aquilo com que Bezalel foi cheio, mantendo o sentido de capacidade sábia concedida por Deus.
- source_word: בִּתְבוּנָה
  choice: de entendimento
  rationale: «Entendimento» preserva a distinção e a sequência conceitual entre sabedoria, entendimento e conhecimento.
- source_word: וּבְדַעַת
  choice: de conhecimento
  rationale: דַּעַת significa fundamentalmente «conhecimento»; a tradução evita reduzi-lo apenas a perícia técnica.
- source_word: וּבְכָל מְלָאכָה
  choice: e de toda habilidade artesanal
  rationale: No contexto da construção do santuário, מְלָאכָה se refere ao trabalho especializado. «Habilidade artesanal» comunica de modo natural a capacidade para todo tipo de ofício.
theological_decisions:
- issue: Se רוּחַ אֱלֹהִים deve ser entendido pessoalmente como o Espírito de Deus ou de modo mais geral
  choice: Espírito de Deus
  alternative: espírito de Deus; espírito divino
  rationale: O contexto imediato apresenta Deus capacitando Bezalel para o serviço sagrado, favorecendo a referência ao próprio Espírito de Deus. A construção hebraica, porém, admite uma leitura mais geral, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência da lista hebraica sem soar artificial; a ambiguidade de רוּחַ אֱלֹהִים e a amplitude semântica de מְלָאכָה são preservadas em notas.
