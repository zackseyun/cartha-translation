base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: pt
  text: 'E toda mulher sábia de coração[a] fiou com as mãos, e elas trouxeram o que haviam fiado: o azul, a púrpura, o fio escarlate[b] e o linho fino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sábia de coração”, expressão que indica habilidade prática fundamentada em sabedoria interior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o azul, a púrpura, o escarlate e o linho fino”; o hebraico enumera os materiais depois de “o que haviam fiado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: sábia de coração
  rationale: Preserva a expressão hebraica que associa sabedoria interior à habilidade prática; o contexto deixa claro que se trata de mulheres habilidosas.
- source_word: בְּיָדֶיהָ
  choice: com as próprias mãos
  rationale: Expressa naturalmente o beth instrumental e realça o trabalho manual, sem alterar o sentido.
- source_word: טָוּוּ
  choice: fiou
  rationale: O verbo designa o ato de fiar fibras para produzir fio; o singular concorda com o distributivo 'toda mulher'.
- source_word: וַיָּבִיאוּ
  choice: e elas trouxeram
  rationale: Mantém a mudança do singular distributivo para o plural coletivo presente no hebraico.
- source_word: מַטְוֶה
  choice: o que haviam fiado
  rationale: Traduz de modo claro o substantivo que denota o material fiado e introduz naturalmente a lista seguinte.
- source_word: תְּכֵלֶת
  choice: o azul
  rationale: Designa material têxtil tingido de azul; a formulação preserva a lista nominal hebraica sob 'o que haviam fiado'.
- source_word: אַרְגָּמָן
  choice: a púrpura
  rationale: Equivalente tradicional e preciso para o material têxtil de cor púrpura usado no santuário.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: o fio escarlate
  rationale: Torna explícito o sentido têxtil da expressão, que indica material tingido de escarlate, sem reproduzir literalmente sua referência histórica ao corante.
- source_word: שֵׁשׁ
  choice: o linho fino
  rationale: No contexto dos tecidos do santuário, o termo indica linho de qualidade fina.
