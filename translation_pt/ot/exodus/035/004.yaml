  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: pt
  text: 'Então Moisés disse a toda a congregação dos filhos de Israel[a]: “Esta é a palavra[b] que Yahweh ordenou, dizendo:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assembleia”; a expressão “filhos de Israel” também pode ser traduzida por “israelitas”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Esta é a palavra”; também é possível: “Esta é a coisa” ou, de modo mais idiomático, “Isto é o que”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Moisés disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: עֲדַת
  choice: congregação
  rationale: Designa a comunidade de Israel reunida; “congregação” preserva tanto o caráter coletivo quanto a ideia de reunião.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma masculina plural e a expressão genealógica do hebraico; “israelitas” seria uma alternativa mais idiomática.
- source_word: זֶה הַדָּבָר
  choice: Esta é a palavra
  rationale: דָּבָר pode significar “palavra”, “coisa” ou “questão”. Nesta fórmula que introduz uma ordem divina, “palavra” conserva a força declarativa e a transparência formal.
- source_word: צִוָּה
  choice: ordenou
  rationale: O pretérito perfeito é natural em português e apresenta a ordem como ação concluída, cujo conteúdo vem a seguir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz, no versículo seguinte, o conteúdo da ordem.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Expressão de gênero e identidade בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A opção conserva a forma masculina plural e a formulação genealógica do original sem neutralizá-la.
- issue: Amplitude semântica de זֶה הַדָּבָר
  choice: Esta é a palavra
  alternative: Esta é a coisa; Isto é o que
  rationale: “Palavra” preserva a formulação declarativa, mas a nota mantém visível a ambiguidade lexical genuína de דָּבָר.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção final “dizendo” foi mantida porque o versículo termina com uma fórmula introdutória cujo conteúdo continua no versículo seguinte.
