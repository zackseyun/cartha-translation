lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: para conceber projetos
  rationale: A combinação do verbo חָשַׁב com o substantivo cognato מַחֲשָׁבוֹת indica planejamento criativo e especializado no contexto artesanal. “Conceber projetos” é natural em português e comunica tanto a criação intelectual quanto sua finalidade artística.
- source_word: לַ/עֲשֹׂת
  choice: e trabalhar
  rationale: Embora עשה tenha o sentido amplo de “fazer”, nesta lista de materiais a expressão idiomática “trabalhar em” comunica melhor a execução artesanal.
- source_word: בַּ/זָּהָב
  choice: em ouro
  rationale: A preposição בְּ marca aqui o material em que o artesão trabalha; “em ouro” é a formulação portuguesa natural.
- source_word: וּ/בַ/כֶּסֶף
  choice: prata
  rationale: כֶּסֶף designa a prata como material. A preposição “em” rege de modo natural toda a série coordenada em português.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze. “Bronze” é a tradução convencional e plausível no contexto dos utensílios e materiais do tabernáculo, sem ocultar a alternativa lexical em nota.
