  text: the balsam and the oil for the light[a], and for the anointing oil and for the incense of spices[b],
translation:
  language: pt
  text: o bálsamo e o óleo para a iluminação, para o óleo da unção e para o incenso aromático.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: o bálsamo
  rationale: בֹּשֶׂם designa uma substância aromática ou especiaria. «Bálsamo» preserva aqui o sentido concreto de material aromático na lista de ofertas.
- source_word: הַשָּׁמֶן
  choice: o óleo
  rationale: שֶׁמֶן é o termo comum para óleo. O hebraico não especifica «azeite» neste versículo.
- source_word: לְמָאוֹר
  choice: para a iluminação
  rationale: מָאוֹר pode indicar luz ou fonte luminosa; no contexto, a expressão descreve a finalidade do óleo sem acrescentar uma lâmpada singular não explicitada.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: A expressão construta designa o óleo sagrado usado para ungir; esta formulação é clara e tradicional sem perder naturalidade.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: o incenso aromático
  rationale: קְטֹרֶת significa incenso, e סַמִּים refere-se a substâncias aromáticas. «Incenso aromático» comunica naturalmente a relação entre os termos em português.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: e ... e ... para ... e para
  rationale: A coordenação mantém o caráter enumerativo do hebraico, embora a preposição «para» não seja repetida antes de «o óleo da unção», pois em português ela rege naturalmente os dois itens coordenados.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém a forma de fragmento enumerativo que dá continuidade ao versículo anterior e evita especificar «azeite» onde o hebraico diz apenas «óleo».
