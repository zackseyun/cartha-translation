  text: וּ/לְ/הוֹרֹ֖ת נָתַ֣ן בְּ/לִבּ֑/וֹ ה֕וּא וְ/אָֽהֳלִיאָ֥ב בֶּן אֲחִיסָמָ֖ךְ לְ/מַטֵּה דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: pt
  text: Também pôs em seus corações a capacidade de ensinar[a], tanto nele como em Aoliabe, filho de Aisamaque, da tribo de Dã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de instruir». O infinitivo hebraico pode indicar o ensino em sentido amplo, inclusive a orientação no trabalho especializado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: a capacidade de ensinar
  rationale: O infinitivo no hifil de ירה significa aqui ensinar ou instruir. A explicitação de «capacidade» torna natural em português a construção com «pôs no coração», sem perder a ideia de uma aptidão interior concedida por Deus.
- source_word: נָתַן בְּלִבּוֹ
  choice: pôs no coração dele
  rationale: Preserva a imagem antropológica hebraica do coração como centro da disposição, compreensão e habilidade, ao mesmo tempo que o pronome evita uma leitura reflexiva indevida.
- source_word: הוּא וְאָהֳלִיאָב
  choice: tanto nele como em Aoliabe
  rationale: O pronome hebraico explícito inclui e realça o primeiro artesão, Bezalel, junto com Aoliabe. Em português, a correlação «tanto... como...» comunica essa inclusão e concorda com a construção locativa regida por «pôs».
- source_word: בֶּן אֲחִיסָמָךְ
  choice: filho de Aisamaque
  rationale: Mantém de modo direto a designação filial do hebraico e emprega uma transliteração corrente e legível em português.
- source_word: לְמַטֵּה דָן
  choice: da tribo de Dã
  rationale: Aqui, לְ com מַטֶּה indica afiliação tribal; «da tribo de Dã» é a formulação portuguesa natural e precisa.
theological_decisions:
- issue: Sujeito implícito de נָתַן
  choice: 'Manter o sujeito subentendido na continuidade do contexto: «Também pôs»'
  alternative: Explicitar «Deus também pôs» ou «O SENHOR também pôs»
  rationale: O hebraico não nomeia novamente o sujeito neste versículo. Mantê-lo implícito preserva a coesão com o contexto e evita introduzir uma designação divina ausente da frase.
- issue: Natureza do dom de ensinar
  choice: Traduzir como capacidade interior concedida, sem especificar um ofício religioso
  alternative: Interpretar como autoridade formal de mestre
  rationale: O contexto trata da transmissão de conhecimento ligado ao trabalho artesanal. A tradução preserva o sentido amplo de instruir sem converter o dom em um cargo teológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Aoliabe», «Aisamaque» e «Dã» seguem formas portuguesas tradicionais; a sintaxe conserva a imagem hebraica do coração sem soar excessivamente literal.
