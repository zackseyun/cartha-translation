id: EXO.35.10
reference: Exodus 35:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל חֲכַם לֵ֖ב בָּ/כֶ֑ם יָבֹ֣אוּ וְ/יַעֲשׂ֔וּ אֵ֛ת כָּל אֲשֶׁ֥ר צִוָּ֖ה יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: pt
  text: E todo aquele que tiver habilidade entre vocês venha e faça tudo o que Yahweh ordenou:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sábio de coração”, expressão que indica alguém hábil ou capacitado, especialmente em trabalhos artesanais.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os que tiverem habilidade entre vocês”. No hebraico, a expressão está no masculino singular, mas tem força distributiva.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: E todo aquele
  rationale: A conjunção liga o versículo ao contexto anterior, e כָל com o substantivo singular tem força distributiva.
- source_word: חֲכַם לֵב
  choice: que tiver habilidade
  rationale: A expressão significa literalmente “sábio de coração”, mas, neste contexto de construção do tabernáculo, designa aptidão prática e artesanal.
- source_word: בָּ/כֶם
  choice: entre vocês
  rationale: A preposição com o sufixo plural situa essas pessoas dentro da comunidade.
- source_word: יָבֹאוּ
  choice: venha
  rationale: O imperfeito tem aqui força de convocação ou instrução; o singular em português concorda naturalmente com o sujeito distributivo.
- source_word: וְ/יַעֲשׂוּ
  choice: e faça
  rationale: No contexto da fabricação do tabernáculo e de seus utensílios, “fazer” expressa adequadamente o sentido concreto de עשה.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: Esta formulação comunica de modo natural a totalidade das coisas especificadas pelo mandamento.
- source_word: צִוָּה יְהוָה
  choice: Yahweh ordenou
  rationale: O perfeito apresenta a ordem como já dada, e o nome divino é transliterado como Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Gênero e força distributiva de חֲכַם לֵב
  choice: todo aquele que tiver habilidade
  alternative: todo homem habilidoso; todos os que tiverem habilidade
  rationale: Embora a expressão hebraica esteja no masculino singular, ela tem força distributiva e pode designar qualquer integrante qualificado da comunidade. A redação conserva o singular sem restringir indevidamente a referência a homens.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A construção no singular preserva a distribuição individual do hebraico; as notas mantêm tanto o sentido literal do idioma quanto a alternativa coletiva.
