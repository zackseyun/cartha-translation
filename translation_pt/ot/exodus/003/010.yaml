id: EXO.3.10
reference: Exodus 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: pt
  text: Agora, vá. Eu o enviarei ao faraó; tire do Egito o meu povo, os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático, “os israelitas”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição discursiva e temporal para o comissionamento de Moisés. Em português, “Agora” expressa naturalmente a combinação sem exigir a reprodução mecânica da conjunção inicial.
- source_word: לְכָה
  choice: vá
  rationale: Embora a forma venha do verbo “ir” e possa funcionar idiomaticamente como uma convocação, o contexto espacial — Moisés sendo enviado ao faraó — favorece claramente “vá” em português.
- source_word: וְאֶשְׁלָחֲךָ
  choice: Eu o enviarei
  rationale: Preserva de modo direto o imperfeito Qal com sufixo de segunda pessoa masculina singular e a iniciativa divina no comissionamento.
- source_word: אֶל־פַּרְעֹה
  choice: ao faraó
  rationale: Representa diretamente a expressão direcional e emprega a forma portuguesa corrente do título real.
- source_word: וְהוֹצֵא
  choice: tire
  rationale: 'O imperativo Hifil de יצא tem sentido causativo: fazer sair. “Tire do Egito” é natural em português e conserva a força imperativa, sem convertê-la silenciosamente em finalidade ou futuro.'
- source_word: עַמִּי
  choice: o meu povo
  rationale: Mantém diretamente a linguagem possessiva e pactual, com formulação natural e solene em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma familiar e genealógica masculina do hebraico, bem como sua força ancestral e pactual. A alternativa étnica mais idiomática é registrada em nota.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Com o verbo causativo “tirar”, a construção “tirar do Egito” expressa naturalmente tanto a origem quanto o movimento para fora.
theological_decisions:
- issue: Designação do povo da aliança em בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal conserva a expressão familiar, genealógica e masculina do hebraico, sem neutralizar sua forma. A opção étnica mais corrente permanece disponível em nota para facilitar a leitura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação separa a promessa divina (“Eu o enviarei”) da ordem seguinte (“tire”), preservando a mudança verbal do hebraico sem produzir uma coordenação pouco natural. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
