id: EXO.3.7
reference: Exodus 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: pt
  text: 'Então Yahweh disse: “De fato, vi a aflição do meu povo que está no Egito e ouvi o seu clamor por causa dos seus opressores[a], pois conheço os seus sofrimentos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus feitores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רָאֹה רָאִיתִי
  choice: De fato, vi
  rationale: Reproduz de modo natural em português a ênfase da construção hebraica com infinitivo absoluto e verbo finito.
- source_word: עֳנִי
  choice: aflição
  rationale: Abrange a miséria e o sofrimento impostos ao povo sem limitar o termo apenas ao ato de opressão.
- source_word: עַמִּי אֲשֶׁר בְּמִצְרָיִם
  choice: meu povo que está no Egito
  rationale: Mantém a relação explícita da oração relativa com o povo e oferece sintaxe clara em português.
- source_word: צַעֲקָתָם
  choice: seu clamor
  rationale: Expressa o grito coletivo provocado pela angústia; em português, o singular concorda naturalmente com o referente coletivo “povo”.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: por causa dos seus opressores
  rationale: Traduz a relação causal e o papel daqueles que pressionavam e exigiam trabalho do povo.
- source_word: כִּי יָדַעְתִּי
  choice: pois conheço
  rationale: Conserva a ligação explicativa e apresenta o perfeito hebraico como conhecimento presente, pessoal e ativo.
- source_word: מַכְאֹבָיו
  choice: seus sofrimentos
  rationale: Comunica de maneira abrangente as dores experimentadas pelo povo; o possessivo acompanha o referente coletivo.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Mantém o nome pactual expresso no hebraico, sem trocá-lo por um título nem adotar uma forma tradicional secundária.
- issue: Linguagem sobre o conhecimento divino
  choice: conheço os seus sofrimentos
  alternative: estou ciente dos seus sofrimentos; tomei conhecimento das suas dores
  rationale: Preserva a linguagem direta e relacional do hebraico, sem reduzir o conhecimento de Deus a mera percepção abstrata.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “De fato, vi” conserva a ênfase hebraica sem recorrer à construção pouco natural “vendo, vi”. Os pronomes no singular retomam naturalmente o coletivo “meu povo”. Apenas a alternativa semanticamente relevante para נֹגְשָׂיו recebe nota.
