  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: pt
  text: 'Então Moisés disse a Deus: “Eis que vou aos filhos de Israel e lhes digo: ‘O Deus de seus antepassados me enviou a vocês.’ E eles me disserem: ‘Qual é o nome dele?’, o que lhes direi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função de chamar atenção para a situação hipotética apresentada por Moisés, em registro digno e ainda compreensível.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão genealógica tradicional do hebraico, adequada ao contexto da identidade do povo.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: O Deus de seus antepassados
  rationale: ‘Antepassados’ comunica naturalmente o sentido abrangente de אבות no português atual, sem restringi-lo aos pais imediatos.
- source_word: מַה שְּׁמוֹ
  choice: Qual é o nome dele?
  rationale: Reproduz diretamente a pergunta hebraica e prepara a revelação do versículo seguinte sem antecipar sua interpretação.
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: o que lhes direi?
  rationale: O futuro em português expressa com naturalidade a deliberação de Moisés sobre a resposta a dar.
theological_decisions:
- issue: Sentido da pergunta sobre o nome divino
  choice: 'Manter a pergunta literal: “Qual é o nome dele?”'
  alternative: Parafrasear como pergunta sobre caráter, autoridade ou identidade
  rationale: O hebraico fala explicitamente do nome; a tradução não deve resolver antecipadamente as possíveis dimensões teológicas da pergunta.
- issue: Designação dos patriarcas
  choice: “antepassados”
  alternative: “pais”
  rationale: A escolha torna claro ao leitor moderno que se trata dos ancestrais de Israel, sem acrescentar uma identificação não expressa neste versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A formulação conserva a solenidade narrativa, mas usa pronomes e construções naturais. As duas ocorrências coordenadas de וְאָמְרוּ foram vertidas por uma oração condicional (‘Se eles me perguntarem’) para evitar uma sequência pesada, preservando a situação projetada por Moisés.
