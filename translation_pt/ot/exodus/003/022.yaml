  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: pt
  text: Cada mulher pedirá à sua vizinha e à mulher que estiver morando em sua casa objetos de prata, objetos de ouro e roupas; vocês os colocarão em seus filhos e em suas filhas. Assim, despojarão o Egito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saquearão” ou “deixarão sem seus bens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: pedirá
  rationale: שׁאל significa normalmente “pedir” ou “solicitar”; “pedirá” evita importar a ideia de empréstimo e posterior devolução, ausente do verbo e do contexto.
- source_word: אִשָּׁה
  choice: Cada mulher
  rationale: O singular indefinido tem sentido distributivo; “cada mulher” o expressa naturalmente em português.
- source_word: מִשְּׁכֶנְתָּהּ
  choice: à sua vizinha
  rationale: O substantivo está no feminino e designa uma mulher vizinha; o feminino pode ser preservado de modo natural em português.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: e à mulher que estiver morando na casa dela
  rationale: O particípio de גור descreve uma mulher residente ou hóspede. A formulação mantém a referência feminina e a ideia de residência sem decidir se era hóspede, estrangeira residente ou outra moradora.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: objetos de prata, objetos de ouro
  rationale: כְּלִי é amplo e pode indicar utensílio, recipiente ou objeto; “objetos” preserva essa indeterminação melhor que “joias” ou “vasos”.
- source_word: וּשְׂמָלֹת
  choice: roupas
  rationale: Termo geral para peças de vestuário; “roupas” é atual, claro e abrangente.
- source_word: וְשַׂמְתֶּם עַל
  choice: vocês os colocarão em
  rationale: Traduz diretamente שׂים + עַל e, no contexto, permite entender que os objetos e as roupas seriam postos sobre os filhos e as filhas.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: seus filhos ... suas filhas
  rationale: Preserva a menção explícita aos dois grupos, sem reduzi-los ao termo genérico “filhos” ou “crianças”.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: Assim, despojarão o Egito
  rationale: O Piel de נצל comunica retirar bens, despojar ou saquear. “Despojarão” conserva a força do hebraico, soa digno e evita sugerir um simples empréstimo.
theological_decisions:
- issue: Possível suavização moral da retirada dos bens egípcios
  choice: Assim, despojarão o Egito
  alternative: Assim, saquearão o Egito
  rationale: A tradução mantém a forte inversão da opressão expressa por נצל, sem transformar o pedido em empréstimo nem explicar além do que o versículo afirma.
- issue: Identidade da mulher descrita por גָּרַת בֵּיתָהּ
  choice: a mulher que estiver morando na casa dela
  alternative: a estrangeira residente em sua casa
  rationale: A construção admite nuances como hóspede, residente temporária ou estrangeira residente. O texto principal conserva a ambiguidade social em vez de identificar dogmaticamente essa mulher.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no futuro para refletir a instrução profética. Emprega “vocês” pela referência plural explícita e mantém “vizinha” e “mulher” para preservar o gênero gramatical e contextual. A única nota registra a amplitude e a força de נצל; seu marcador aparece no texto principal.
