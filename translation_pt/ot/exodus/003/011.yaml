  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: pt
  text: 'Mas Moisés disse a Deus: “Quem sou eu para ir ao faraó e tirar os filhos de Israel[a] do Egito?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”; tradicionalmente, “os filhos de Israel”.
    reason: Alternativa lexical para a expressão genealógica בְּנֵי יִשְׂרָאֵל. Como a redação principal já usa a forma tradicional, a nota também registra a equivalência coletiva mais corrente.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa corrente de אמר, expressa naturalmente em português pelo pretérito perfeito “disse”.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: Embora אֱלֹהִים venha com artigo no hebraico, a referência direta ao Deus de Israel é idiomaticamente “Deus” em português, sem artigo.
- source_word: מִי אָנֹכִי
  choice: Quem sou eu
  rationale: Preserva de modo direto e natural a pergunta retórica de Moisés e seu senso de inadequação, sem explicá-lo além do texto.
- source_word: כִּי אֵלֵךְ
  choice: para ir
  rationale: Após “Quem sou eu”, a construção infinitiva é natural em português e comunica a ação contemplada expressa pelo imperfeito hebraico.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: O título régio é normalmente usado com artigo definido em português.
- source_word: וְכִי אוֹצִיא
  choice: e tirar
  rationale: Mantém o paralelismo das duas ações questionadas por Moisés. O hifil de יצא é causativo; “tirar ... do Egito” transmite de maneira concisa “fazer sair”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão genealógica e gramaticalmente masculina do hebraico, sendo também uma formulação bíblica reconhecível em português.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Com o verbo “tirar”, a preposição “de” expressa naturalmente o movimento para fora do país.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A redação principal conserva a forma genealógica masculina do hebraico sem restringi-la a menores de idade. A nota registra a alternativa coletiva mais idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Faraó” aparece em minúscula por funcionar aqui como título comum. A estrutura retórica foi mantida concisa e paralela.
