  text: וַ/יַּ֥רְא יְהוָ֖ה כִּ֣י סָ֣ר לִ/רְא֑וֹת וַ/יִּקְרָא֩ אֵלָ֨י/ו אֱלֹהִ֜ים מִ/תּ֣וֹךְ הַ/סְּנֶ֗ה וַ/יֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַ/יֹּ֥אמֶר הִנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: pt
  text: 'Quando Yahweh viu que Moisés se desviara para olhar, Deus o chamou do meio do arbusto[a] e disse: “Moisés, Moisés!” Ele respondeu: “Aqui estou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode designar mais especificamente um arbusto espinhoso, tradicionalmente chamado de “sarça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal e mantém a distinção do texto hebraico entre יְהוָה e אֱלֹהִים.
- source_word: וַיַּרְא
  choice: viu
  rationale: O verbo ראה tem aqui seu sentido narrativo comum de perceber visualmente.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do que Yahweh viu; a construção portuguesa “viu que” reproduz naturalmente essa relação.
- source_word: סָר לִרְאוֹת
  choice: se desviara para olhar
  rationale: Expressa que Moisés saiu de seu caminho com o propósito de observar; o mais-que-perfeito marca que essa ação precedeu o chamado.
- source_word: וַיִּקְרָא אֵלָיו
  choice: o chamou
  rationale: Em português, “chamar alguém” comunica naturalmente o sentido de dirigir a voz a essa pessoa, sem expansão desnecessária.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a correspondência portuguesa normal e preserva a alternância deliberada com o nome Yahweh.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: do meio do arbusto
  rationale: Mantém a imagem espacial do hebraico em linguagem atual; “arbusto” evita depender do termo tradicional menos corrente “sarça”.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Moisés, Moisés!
  rationale: Conserva a repetição enfática e pessoal do nome, com pontuação vocativa natural em português.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: É a resposta idiomática de presença e disponibilidade, sem acrescentar uma ideia explícita de submissão que o hebraico não formula.
theological_decisions:
- issue: Uso de יְהוָה e אֱלֹהִים no mesmo versículo
  choice: Traduzir יְהוָה como “Yahweh” e אֱלֹהִים como “Deus”.
  alternative: Uniformizar ambos como “Deus” ou substituir o nome por “SENHOR”.
  rationale: A distinção lexical do hebraico identifica o mesmo agente sem apagar o nome divino pessoal nem harmonizar os dois termos.
- issue: Sujeito da resposta final וַיֹּאמֶר
  choice: Explicitar “Ele respondeu”, referindo-se a Moisés.
  alternative: Traduzir literalmente “E ele disse” ou repetir “Moisés respondeu”.
  rationale: O interlocutor e o conteúdo da resposta tornam o referente claro; “respondeu” expressa naturalmente a função discursiva sem alterar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a alternância dos nomes divinos, a sequência narrativa e a resposta concisa de Moisés; o termo botânico mais específico fica em nota.
