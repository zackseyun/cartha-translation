language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: pt
  text: 'Vá, reúna os anciãos de Israel e diga-lhes: ‘Yahweh, o Deus de seus pais[a] — o Deus de Abraão, de Isaque e de Jacó —, apareceu-me, dizendo: “Certamente dei atenção[b] a vocês e ao que lhes foi feito no Egito.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus pais”; a expressão é especificada em seguida por “o Deus de Abraão, de Isaque e de Jacó”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “certamente visitei vocês”. A expressão hebraica intensifica o verbo e pode indicar atenção divina decisiva que leva à intervenção, não uma simples visita social.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Vá
  rationale: O imperativo qal masculino singular de הלך introduz diretamente a missão de Moisés; “Vá” é conciso e natural em português.
- source_word: וְאָֽסַפְתָּ
  choice: reúna
  rationale: אסף aqui significa congregar pessoas. “Reúna” expressa com naturalidade a ordem de juntar os líderes da comunidade.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Designação sociopolítica tradicional dos líderes da comunidade israelita; “anciãos de Israel” preserva seu caráter reconhecível.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Mantém o verbo comum de fala e introduz de maneira idiomática o discurso direto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Conserva a formulação patriarcal, logo especificada por Abraão, Isaque e Jacó. Em português, “seus” concorda com os anciãos como grupo e evita a ambiguidade regional de “vosso”.
- source_word: נִרְאָה אֵלַי
  choice: apareceu a mim
  rationale: O nifal de ראה constitui a expressão habitual para uma manifestação divina; “apareceu a mim” é formal, claro e próximo da estrutura hebraica.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: o Deus de Abraão, de Isaque e de Jacó
  rationale: Preserva integralmente a identificação apositiva e a relação de Deus com cada patriarca.
- source_word: לֵאמֹר
  choice: e disse
  rationale: No fluxo do português, “e disse” introduz naturalmente o conteúdo da mensagem divina, sem reproduzir de forma rígida o infinitivo hebraico “dizendo”.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: Certamente dei atenção
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente” representa a ênfase, enquanto “dei atenção” preserva a ideia de atenção divina deliberada, cujo sentido contextual aponta para ação e intervenção.
- source_word: אֶתְכֶם וְאֶת הֶעָשׂוּי לָכֶם
  choice: a vocês e ao que lhes tem sido feito
  rationale: Mantém os dois objetos coordenados do verbo e conserva a voz passiva da segunda expressão, sem acrescentar um agente não expresso no hebraico.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: Equivalente geográfico direto e convencional em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título nem adotar uma forma híbrida posterior.
- issue: Sentido da construção enfática פָּקֹד פָּקַדְתִּי
  choice: Certamente dei atenção
  alternative: Certamente visitei; certamente vim em auxílio
  rationale: A construção expressa atenção divina decisiva que conduz à intervenção. A tradução principal evita que “visitei” seja entendida como mera visita social e não explicita prematuramente como auxílio aquilo que o verbo deixa semanticamente mais amplo.
- issue: Referência patriarcal em אֲבֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A sequência identifica esses “pais” especificamente com Abraão, Isaque e Jacó. A formulação mantém a moldura patriarcal e pactual do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega “vocês” por clareza internacional e naturalidade no Brasil, sem coloquialismo excessivo. Os travessões destacam a identificação apositiva do Deus dos patriarcas; as aspas aninhadas distinguem a fala de Moisés da mensagem divina. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
