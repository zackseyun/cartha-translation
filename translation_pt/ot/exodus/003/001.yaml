source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: pt
  text: Moisés apascentava o rebanho de Jetro, seu sogro, sacerdote de Midiã. Ele conduziu o rebanho para além do deserto[a] e chegou ao monte de Deus, Horebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o outro lado do deserto”.'
    reason: Alternativa lexical para a expressão espacial אַחַר הַמִּדְבָּר.
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Moisés
  rationale: A conjunção introduz uma nova cena narrativa; em português, o nome sem um conectivo acrescentado é natural e evita inserir um valor temporal inexistente no hebraico.
- source_word: הָיָה רֹעֶה
  choice: apascentava
  rationale: O imperfeito português expressa a ação contínua no passado, e “apascentava” mantém o sentido pastoril específico de רעה.
- source_word: צֹאן
  choice: o rebanho
  rationale: O termo designa coletivamente animais de pequeno porte, em geral ovelhas e cabras; “rebanho” é a forma coletiva mais natural em português.
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: חֹתְנוֹ
  choice: seu sogro
  rationale: O contexto identifica a relação de parentesco por casamento especificamente como a de sogro.
- source_word: כֹּהֵן מִדְיָן
  choice: sacerdote de Midiã
  rationale: A expressão em aposição identifica Jetro de modo direto, sem acrescentar artigo indefinido não exigido pelo contexto.
- source_word: וַיִּנְהַג
  choice: Ele conduziu
  rationale: נהג pode significar conduzir ou tocar um rebanho; “conduziu” é claro, idiomático e não sugere força excessiva.
- source_word: אַחַר הַמִּדְבָּר
  choice: para além do deserto
  rationale: Neste uso espacial, אַחַר indica o lado mais distante ou a região além do deserto; a formulação preserva essa orientação sem especificar indevidamente um ponto cardeal.
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O verbo marca a chegada ao destino e é vertido naturalmente pelo pretérito perfeito português.
- source_word: הַר הָאֱלֹהִים
  choice: o monte de Deus
  rationale: A tradução direta conserva a forma da relação construta e não decide se o lugar já era considerado sagrado ou se a designação é retrospectiva.
- source_word: חֹרֵבָה
  choice: Horebe
  rationale: Adota-se a forma tradicional portuguesa do topônimo; a terminação direcional hebraica já é representada pelo movimento expresso em “chegou ao”.
theological_decisions:
- issue: Se הַר הָאֱלֹהִים deve ser interpretado como um monte já reconhecido como sagrado ou como uma designação narrativa retrospectiva
  choice: o monte de Deus
  alternative: o monte sagrado
  rationale: A expressão é traduzida diretamente, preservando a tensão narrativa e sem impor uma explicação sobre quando ou em que sentido o monte recebeu essa designação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico inteligível. “Apascentava” preserva a imagem pastoril sem tornar a frase arcaica. O marcador da nota foi colocado junto de “deserto”, expressão à qual a alternativa lexical se refere.
