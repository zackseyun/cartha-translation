  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: pt
  text: 'E eles darão ouvidos ao que você disser. Então você e os anciãos de Israel irão ao rei do Egito e lhe dirão: “Yahweh, o Deus dos hebreus, veio ao nosso encontro.[a] Agora, por favor, deixe-nos fazer uma viagem de três dias pelo deserto, para oferecermos sacrifícios a Yahweh, nosso Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encontrou-se conosco”. A expressão hebraica pode indicar que Yahweh veio ao encontro deles ou se manifestou a eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: E eles darão ouvidos ao que você disser
  rationale: A expressão combina שׁמע, que pode indicar ouvir, escutar ou atender, com o hebraísmo literal “à sua voz”. “Dar ouvidos ao que você disser” preserva tanto a recepção da fala quanto a ideia de acolhê-la, sem tornar explícita uma obediência que o verbo apenas pode implicar.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: Então você e os anciãos de Israel irão
  rationale: O hebraico emprega uma forma singular, seguida do pronome enfático e do sujeito coordenado. A formulação plural é natural em português; “irão” expressa adequadamente o movimento até o rei do Egito no contexto.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: o rei do Egito
  rationale: Tradução direta e natural da construção hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: o Deus dos hebreus
  rationale: Preserva de modo claro e direto a designação étnica do texto-fonte.
- source_word: נִקְרָה עָלֵינוּ
  choice: veio ao nosso encontro
  rationale: O nifal de קרא com עַל descreve aqui um encontro ou uma manifestação. A escolha mantém a ideia de encontro divino sem restringi-la a um chamado ou convocação.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca naturalmente a transição da declaração sobre o encontro com Deus para o pedido dirigido ao rei.
- source_word: נֵלֲכָה נָּא
  choice: por favor, deixe-nos fazer uma viagem
  rationale: O coortativo acompanhado de נָא comunica um pedido cortês. Em português, “por favor, deixe-nos” deixa claro que se solicita autorização ao rei.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: uma viagem de três dias
  rationale: Reproduz com clareza o idioma hebraico, que pode indicar duração ou distância de viagem, sem determinar além do texto qual aspecto predomina.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: No contexto de uma viagem, “pelo deserto” é idiomático e descreve o percurso. “Deserto” é amplamente compreensível, embora o termo hebraico também possa designar região erma ou não cultivada.
- source_word: וְנִזְבְּחָה
  choice: para oferecermos sacrifícios
  rationale: O segundo coortativo expressa a finalidade da viagem. “Oferecer sacrifícios” é natural em português e mantém o sentido cultual do verbo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido da linguagem de encontro em נִקְרָה עָלֵינוּ
  choice: veio ao nosso encontro
  alternative: encontrou-se conosco; manifestou-se a nós; chamou-nos
  rationale: A tradução escolhida preserva a ocorrência de um encontro divino e a amplitude da expressão hebraica, sem convertê-la especificamente em convocação ou aparição.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O tratamento “você” mantém clareza no discurso dirigido a Moisés; “por favor, deixe-nos” reproduz a cortesia do pedido a Faraó. A redação evita literalismos pouco naturais, mas conserva a ambiguidade semântica relevante na nota.
