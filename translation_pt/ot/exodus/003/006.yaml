  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: pt
  text: 'Então ele disse: “Eu sou o Deus de seu pai, o Deus de Abraão, o Deus de Isaque e o Deus de Jacó”. Moisés escondeu o rosto, pois teve medo de olhar para Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então ele disse” expressa naturalmente a sequência em português.
- source_word: אָנֹכִי
  choice: Eu sou
  rationale: O pronome independente é enfático, e a cópula implícita na oração nominal é naturalmente expressa em português.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: o Deus de seu pai
  rationale: Preserva o singular do hebraico e a fórmula de identificação pactual. “Seu” oferece leitura ampla e natural em português brasileiro sem alterar o referente.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: o Deus de Abraão, o Deus de Isaque e o Deus de Jacó
  rationale: Mantém a repetição explícita de “Deus de”, que dá peso retórico e pactual à declaração.
- source_word: וַיַּסְתֵּר
  choice: escondeu
  rationale: O hifil indica esconder ou ocultar; “escondeu o rosto” é uma expressão clara e natural.
- source_word: פָּנָיו
  choice: o rosto
  rationale: O sentido concreto se ajusta ao gesto físico de evitar a visão na manifestação divina.
- source_word: כִּי יָרֵא
  choice: pois teve medo
  rationale: “Pois” conserva a relação causal, e “teve medo” comunica de modo idiomático a reação de Moisés no contexto narrativo.
- source_word: מֵהַבִּיט
  choice: de olhar
  rationale: Depois do verbo de temor, o infinitivo com מִן indica a ação temida; “teve medo de olhar” é a construção idiomática em português.
- source_word: אֶל הָאֱלֹהִים
  choice: para Deus
  rationale: A preposição אֶל com o verbo de olhar pode ser expressa naturalmente por “olhar para”; o contexto identifica אֱלֹהִים como o Deus que fala.
theological_decisions:
- issue: Tradução de אֱלֹהִים na autoidentificação divina e na teofania
  choice: Deus
  alternative: o ser divino
  rationale: O contexto identifica explicitamente o falante como o Deus dos patriarcas; “Deus” preserva essa referência pactual sem acrescentar uma definição doutrinária externa.
- issue: Repetição da fórmula patriarcal
  choice: o Deus de Abraão, o Deus de Isaque e o Deus de Jacó
  alternative: o Deus de Abraão, Isaque e Jacó
  rationale: A repetição corresponde ao hebraico e conserva sua ênfase retórica e teológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem e a repetição do hebraico foram preservadas onde têm valor enfático, enquanto as relações sintáticas foram expressas de modo natural em português.
