base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: pt
  text: 'E ele disse: “Eu certamente estarei com você. Este será, para você, o sinal de que fui eu que enviei você: quando você tirar o povo do Egito, vocês servirão[a] a Deus neste monte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorarão”. O verbo hebraico pode significar tanto “servir” como, quando se refere a Deus, “adorar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: Eu certamente estarei com você
  rationale: O imperfeito אֶהְיֶה expressa aqui a promessa futura da presença divina. “Certamente” comunica a força afirmativa de כִּי no contexto da resposta à objeção de Moisés.
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: Este será o sinal
  rationale: אוֹת designa um sinal ou confirmação. A formulação é natural em português e mantém o caráter futuro da confirmação.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: de que fui eu quem enviou você
  rationale: A construção explicita o valor confirmatório da oração e preserva a ênfase do pronome אָנֹכִי, sem acrescentar conteúdo interpretativo.
- source_word: בְּהוֹצִיאֲךָ אֶת הָעָם מִמִּצְרַיִם
  choice: quando você tirar o povo do Egito
  rationale: O infinitivo construto com בְּ e sufixo de segunda pessoa é temporal; Moisés é apresentado como agente da saída do povo.
- source_word: תַּעַבְדוּן
  choice: vocês servirão
  rationale: עבד pode significar tanto servir quanto adorar quando Deus é o objeto. “Servirão” preserva essa amplitude lexical, enquanto a nota registra a alternativa cultual.
- source_word: עַל הָהָר הַזֶּה
  choice: neste monte
  rationale: “Neste monte” preserva a localização concreta e traduz de modo idiomático a preposição עַל neste contexto.
theological_decisions:
- issue: Natureza do “sinal” prometido
  choice: O sinal aponta para o futuro serviço a Deus neste monte, depois da saída do Egito.
  alternative: O sinal seria a promessa imediata da presença divina, ou abrangeria tanto essa promessa quanto seu cumprimento futuro.
  rationale: A sintaxe liga de modo mais natural o sinal à oração seguinte, sobre tirar o povo do Egito e servir a Deus no monte. A tradução mantém a confirmação voltada para o futuro sem eliminar inteiramente a tensão com a promessa precedente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “você/vocês” para distinguir Moisés, no singular, do povo, no plural. “Monte” foi preferido a “montanha” por naturalidade no registro bíblico contemporâneo.
