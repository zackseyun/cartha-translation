id: EXO.3.9
reference: Exodus 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: pt
  text: E agora, eis que o clamor dos filhos de Israel[a] chegou até mim[b]; também vi a opressão com que os egípcios os oprimem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “alcançou-me”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a continuidade indicada pela conjunção quanto a transição temporal, de modo natural em português.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a função de chamar a atenção e o tom solene do discurso, sem acrescentar conteúdo interpretativo.
- source_word: צַעֲקַת
  choice: o clamor
  rationale: Expressa um grito nascido da aflição; “clamor” é corrente em português e adequado ao contexto de pedido urgente de socorro.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão familiar e pactual do hebraico; a nota oferece a forma gentílica mais idiomática.
- source_word: בָּאָה אֵלַי
  choice: chegou até mim
  rationale: Reproduz a imagem simples do verbo “vir/chegar”, com formulação natural em português.
- source_word: וְגַם
  choice: também
  rationale: 'Preserva a força aditiva: além de ouvir o clamor, Deus viu a opressão.'
- source_word: רָאִיתִי
  choice: vi
  rationale: O pretérito perfeito português comunica adequadamente a ação concluída com relevância presente no contexto.
- source_word: הַלַּחַץ
  choice: a opressão
  rationale: Representa a pressão coerciva e social exercida contra Israel, evitando o sentido físico excessivamente estreito de “pressão”.
- source_word: מִצְרַיִם לֹחֲצִים
  choice: os egípcios ... oprimem
  rationale: O particípio plural favorece a referência aos egípcios como agentes coletivos e apresenta a opressão como contínua.
- source_word: אֹתָם
  choice: os
  rationale: Pronome objeto que retoma “os filhos de Israel” de maneira clara e econômica.
theological_decisions:
- issue: Designação familiar e pactual בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal preserva a forma concreta do hebraico e sua dimensão de descendência coletiva, enquanto a nota esclarece o equivalente gentílico natural.
- issue: Valor discursivo de הִנֵּה
  choice: eis que
  alternative: veja
  rationale: “Eis que” conserva a chamada de atenção sem transformar explicitamente a partícula em um imperativo dirigido a Moisés.
- issue: Agente de לֹחֲצִים
  choice: os egípcios
  alternative: o Egito
  rationale: Embora מִצְרַיִם seja também o nome do país, o particípio hebraico está no plural; “os egípcios” preserva essa concordância e identifica naturalmente os opressores humanos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” mantém uma solenidade deliberada e a função enfática do hebraico; o ponto e vírgula evita uma sequência excessiva de coordenações sem alterar a relação entre as orações.
