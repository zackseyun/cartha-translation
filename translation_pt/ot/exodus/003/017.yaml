  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: pt
  text: 'E eu disse[a]: ‘Eu os farei subir da opressão no Egito[b] para a terra dos cananeus, dos hititas, dos amorreus, dos perizeus, dos heveus e dos jebuseus — para uma terra que mana leite e mel.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser entendido como: “E eu declarei” ou “E eu tenho dito”. O verbo hebraico tem forma passada, mas, neste contexto, a declaração continua relevante.'
    reason: alternative_reading
  - marker: b
    text: A expressão também pode ser traduzida como “do sofrimento no Egito”, “da aflição do Egito” ou “da miséria causada pelo Egito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: O verbo hebraico tem forma passada. A tradução mantém esse valor formal; a nota registra a possível relevância presente da declaração no contexto.
- source_word: אַעֲלֶה אֶתְכֶם
  choice: Eu os farei subir
  rationale: O hifil de עלה significa fazer subir ou levar para cima. A formulação conserva a imagem de subida associada à saída do Egito, sem reduzi-la simplesmente a ‘tirar’.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: da opressão no Egito
  rationale: עֳנִי pode indicar aflição, sofrimento ou opressão. ‘Opressão no Egito’ expressa naturalmente, em português atual, a condição sofrida ali, enquanto a nota preserva alternativas possíveis para a relação construtiva.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: para a terra dos cananeus, dos hititas, dos amorreus, dos perizeus, dos heveus e dos jebuseus
  rationale: Embora os gentílicos estejam no singular em hebraico, o plural é a forma idiomática em português para designar esses povos; a construção identifica a terra por seus habitantes.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: para uma terra que mana leite e mel
  rationale: A expressão preserva a metáfora hebraica de abundância e fertilidade. ‘Mana leite e mel’ é corrente, digna e compreensível em português.
theological_decisions:
- issue: Valor temporal da declaração divina וָאֹמַר
  choice: E eu disse
  alternative: E eu tenho dito / E eu declarei
  rationale: A forma hebraica é passada, mas a declaração conserva relevância no discurso presente de Deus a Moisés. O texto principal mantém o valor formal sem transformar a fala em uma fórmula teológica mais explícita; a nota registra a nuance contextual.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega ‘os’ para evitar tanto o regionalismo de ‘vocês’ quanto o caráter hoje marcado de ‘vos’. Mantém a imagem concreta de subida e a metáfora tradicional de uma terra que mana leite e mel.
