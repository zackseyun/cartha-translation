  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: pt
  text: 'Deus disse a Moisés: “EU SOU O QUE SOU.”[a] E disse: “Assim você dirá aos filhos de Israel:[b] ‘EU SOU me enviou a vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “SEREI O QUE SEREI”, ou “SEREI QUEM SEREI”. O verbo hebraico pode ter aqui sentido futuro, além de força presente.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, neste contexto designa de modo singular o Deus de Israel; “Deus” é a tradução natural e contextualmente correta.
- source_word: אֶהְיֶה
  choice: EU SOU
  rationale: É o imperfeito Qal, primeira pessoa do singular, de היה e pode expressar valor presente ou futuro. No texto principal, “EU SOU” preserva a autoidentificação solene e sua reutilização como designação divina; a possibilidade futura é mantida em nota.
- source_word: אֲשֶׁר
  choice: o que
  rationale: O relativo hebraico é semanticamente amplo. Na fórmula “EU SOU O QUE SOU”, “o que” produz português natural, preserva a formulação tradicional e evita definir em excesso a relação entre as duas ocorrências verbais.
- source_word: כֹּה
  choice: Assim
  rationale: Introduz a fórmula de fala que Moisés deve transmitir. “Assim” conserva o tom declarativo e solene sem soar arcaico.
- source_word: תֹאמַר
  choice: você dirá
  rationale: O imperfeito de segunda pessoa masculina singular tem aqui força diretiva. “Você dirá” comunica a ordem com naturalidade e ampla legibilidade brasileira.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a imagem genealógica e a forma masculina explícita de בְּנֵי, em vez de substituí-la silenciosamente por “israelitas”.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O perfeito com sufixo de primeira pessoa apresenta o envio como ação realizada. Em português direto, “me enviou” é claro e idiomático.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: A forma narrativa faz a sequência avançar. “Disse” traduz de maneira simples e digna; a conjunção “E” preserva a conexão hebraica na segunda ocorrência.
theological_decisions:
- issue: Tradução da autoidentificação divina אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: EU SOU O QUE SOU
  alternative: SEREI O QUE SEREI; SEREI QUEM SEREI
  rationale: O imperfeito hebraico admite força presente e futura. O texto principal conserva a leitura tradicional e o caráter de autoidentificação, enquanto a nota registra as possibilidades futuras para não eliminar a ambiguidade genuína.
- issue: Uso de maiúsculas em אֶהְיֶה
  choice: EU SOU
  alternative: Eu sou; eu serei
  rationale: As maiúsculas sinalizam ao leitor a função solene e quase nominal da expressão, especialmente quando ela reaparece isoladamente. Trata-se de uma decisão tipográfica em português, não da afirmação de que o hebraico possui uma forma gráfica distinta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil. Preservou-se “filhos de Israel” por sua correspondência lexical e genealógica com o hebraico. Os marcadores de nota foram posicionados junto às expressões que explicam.
