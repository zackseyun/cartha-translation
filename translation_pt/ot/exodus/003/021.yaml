  terminology: «Favor», «este povo», «aos olhos dos egípcios» e «de mãos vazias» correspondem bem aos termos e ao idiomatismo hebraicos. A nota a deve apresentar uma alternativa real, pois o texto principal já traz «aos olhos dos egípcios».
