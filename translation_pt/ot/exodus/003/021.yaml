  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: pt
  text: E darei a este povo favor aos olhos dos egípcios[a]; e, quando vocês partirem, não irão de mãos vazias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista dos egípcios”. A expressão hebraica refere-se à maneira como os egípcios considerariam este povo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não partirão sem nada”. A expressão hebraica indica que não sairiam sem bens ou provisões.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E farei com que
  rationale: Embora נתן signifique literalmente “dar”, a construção com חֵן expressa a ação divina de fazer o povo obter favor. Esta formulação é natural em português e preserva Deus como agente.
- source_word: חֵן
  choice: favor
  rationale: חֵן indica favor, boa vontade ou acolhimento. “Favor” conserva o sentido social do contexto sem acrescentar uma conotação teológica indevida.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o substantivo coletivo singular e o demonstrativo do hebraico, referindo-se a Israel.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: aos olhos dos egípcios
  rationale: Reproduz de forma idiomática e transparente a expressão hebraica sobre como o povo será visto ou considerado pelos egípcios.
- source_word: וְהָיָה כִּי
  choice: assim, quando
  rationale: A fórmula hebraica introduz uma circunstância futura e seu resultado. “Assim, quando” liga naturalmente as duas orações sem reproduzir a rigidez formal da expressão.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: vocês partirem / não irão
  rationale: הלך significa basicamente “ir”, mas aqui descreve a partida do Egito. “Partirem” explicita o contexto na primeira ocorrência, e “irão” evita repetição pesada na segunda.
- source_word: רֵיקָם
  choice: de mãos vazias
  rationale: 'Expressa em português corrente o valor idiomático de רֵיקָם: partir sem bens, recursos ou provisões.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “vocês”. A tradução preserva a imagem hebraica “aos olhos” no texto e comunica רֵיקָם pelo equivalente idiomático “de mãos vazias”.
