base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: pt
  text: 'Então ele disse: “Não se aproxime daqui.[a] Tire as sandálias dos seus pés, pois o lugar onde você está de pé é terra sagrada.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não chegue mais perto.”'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “solo de santidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa a sequência de modo natural, enquanto “ele” preserva a referência masculina do hebraico sem explicitar a identidade do falante além do texto.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Não chegue mais perto
  rationale: 'A construção expressa uma proibição espacial: Moisés não deve continuar se aproximando. Esta formulação é idiomática em português e comunica com clareza o valor direcional de הֲלֹם.'
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: Tire as sandálias dos pés
  rationale: “Tire” traduz naturalmente o imperativo de remover, “sandálias” conserva a concretude cultural do calçado antigo, e “dos pés” mantém a especificação presente no hebraico.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão da ordem. “Pois” conserva claramente a relação causal em registro digno e corrente.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: o lugar em que você está
  rationale: A expressão identifica o local ocupado por Moisés. Em português, “em que você está” evita a rigidez de “sobre o qual você está de pé” sem perder a referência espacial.
- source_word: אַדְמַת קֹדֶשׁ
  choice: terra sagrada
  rationale: O sintagma construto significa literalmente “solo/terra de santidade”. “Terra sagrada” é claro e natural, mantendo tanto a materialidade do terreno quanto sua qualidade de santidade.
- source_word: הוּא
  choice: é
  rationale: O pronome funciona na conclusão copular da oração e é expresso naturalmente pelo verbo “é” em português.
theological_decisions:
- issue: Natureza da santidade do lugar
  choice: Afirmar simplesmente que o lugar é “terra sagrada”
  alternative: Explicar que o lugar se tornou sagrado por causa da presença de Deus
  rationale: O versículo declara a santidade do terreno, mas não formula aqui uma explicação teológica de sua causa. A tradução preserva a afirmação sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos, conserva a solenidade da fala divina e mantém a concretude espacial e material do hebraico.
