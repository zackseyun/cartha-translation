  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: pt
  text: 'Deus disse ainda a Moisés: “Assim você dirá aos filhos de Israel: Yahweh[a], o Deus de seus pais, o Deus de Abraão, o Deus de Isaque e o Deus de Jacó, enviou-me a vocês. Este é o meu nome para sempre, e este é o meu memorial[b], de geração em geração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, as quatro consoantes do nome divino; a pronúncia antiga exata não é conhecida com certeza. Também é tradicionalmente vertido como “SENHOR”.'
    reason: Informação textual e alternativa de tradução do nome divino.
  - marker: b
    text: Também pode ser entendido como “minha lembrança” ou “o nome pelo qual sou lembrado”.
    reason: O substantivo hebraico pode designar memorial, lembrança ou aquilo pelo qual alguém é lembrado.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo pelo título “SENHOR”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz a expressão hebraica de parentesco e continua clara no português bíblico moderno.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Preserva o substantivo masculino explícito no hebraico e a ligação direta com Abraão, Isaque e Jacó.
- source_word: שְׁלָחַנִי
  choice: enviou-me
  rationale: Expressa de modo natural a ação concluída do verbo hebraico, cuja comissão permanece válida no contexto.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Este é o meu nome para sempre
  rationale: Conserva a formulação enfática e traduz לְעֹלָם pelo equivalente português mais natural para duração permanente.
- source_word: זִכְרִי
  choice: a forma como serei lembrado
  rationale: Comunica em português corrente a ideia de lembrança associada ao nome, sem ocultar em nota as alternativas lexicais mais literais.
- source_word: לְדֹר דֹּר
  choice: de geração em geração
  rationale: Mantém a repetição idiomática do hebraico e a continuidade ao longo das gerações.
- source_word: כֹּה תֹאמַר
  choice: Assim você dirá
  rationale: Preserva a fórmula de instrução direta em linguagem moderna, digna e amplamente compreensível.
- source_word: עוֹד
  choice: ainda
  rationale: Marca a continuação da fala divina sem sugerir que Deus esteja simplesmente repetindo o que já disse.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto apresenta diretamente o Tetragrama como nome de Deus. A transliteração preserva essa função de nome pessoal; a nota registra a forma consonantal hebraica e a incerteza histórica da pronúncia.
- issue: Preservação dos termos masculinos de parentesco
  choice: filhos de Israel / seus pais
  alternative: israelitas / seus antepassados
  rationale: O hebraico emprega termos masculinos explícitos. A tradução os conserva sem acrescentar uma restrição teológica que o contexto não declare.
- issue: Sentido de זִכְרִי em paralelo com “meu nome”
  choice: a forma como serei lembrado
  alternative: minha lembrança; meu memorial
  rationale: O termo pode indicar lembrança, memorial ou aquilo pelo qual alguém é lembrado. A redação principal explicita o sentido contextual sem eliminar as alternativas, apresentadas em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “você” na instrução dirigida a Moisés. Mantêm-se o paralelismo hebraico, os termos de parentesco e o nome divino, enquanto a expressão pouco idiomática זִכְרִי recebe uma equivalência clara acompanhada de nota.
