  revision_rationale: A revisão restaura o sentido de desviar-se expresso por אָסֻרָה, representa a volição cortês do coortativo com נָא e evita acrescentar “descobrir”. Mantém-se “não se consome” no texto por sua adequação ao contexto, com “não arde” preservado em nota como alternativa mais diretamente lexical.
