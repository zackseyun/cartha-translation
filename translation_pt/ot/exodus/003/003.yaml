base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: pt
  text: 'Então Moisés disse: “Deixe-me desviar e ver esta grande visão: por que a sarça não se consome[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não arde” ou “não é consumida”.'
    reason: Alternativas lexicais para לֹא יִבְעַר. O verbo significa primariamente “arder/queimar”; “não se consome” explicita o resultado paradoxal indicado pelo contexto imediato.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português atual.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אָסֻרָה נָּא
  choice: Vou me aproximar
  rationale: A forma coortativa com נָא exprime a decisão voluntária de Moisés. No contexto, ele se desvia de seu caminho para chegar mais perto; esta formulação comunica o movimento com naturalidade.
- source_word: וְאֶרְאֶה
  choice: para ver
  rationale: ראה indica aqui olhar ou examinar visualmente; a construção final é idiomática em português e preserva a intenção do movimento.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: esta visão extraordinária
  rationale: מַרְאֶה é aquilo que se vê, e גָּדוֹל, neste contexto, caracteriza algo impressionante ou extraordinário, não apenas grande em dimensões.
- source_word: מַדּוּעַ
  choice: e descobrir por que
  rationale: O interrogativo pede a razão do fenômeno. “Descobrir por que” integra naturalmente a pergunta indireta ao propósito de Moisés, sem resolver sua resposta.
- source_word: לֹא יִבְעַר
  choice: não se consome
  rationale: Embora בער denote primariamente “arder/queimar”, no contexto a maravilha é a sarça permanecer apesar do fogo. “Não se consome” comunica esse resultado implícito sem acrescentar interpretação teológica; a nota preserva a alternativa lexical mais direta.
- source_word: הַסְּנֶה
  choice: a sarça
  rationale: “Sarça” é o termo português tradicional e preciso para um arbusto, provavelmente espinhoso, neste episódio.
theological_decisions:
- issue: A natureza do fenômeno da sarça em chamas
  choice: por que a sarça não se consome
  alternative: por que a sarça não queima / não acaba de queimar
  rationale: O verbo hebraico significa “arder/queimar”, mas o contexto imediato destaca que o arbusto estava em chamas sem ser consumido. O texto principal expressa esse paradoxo com clareza, enquanto a nota mantém a amplitude lexical e evita atribuir ao sinal um significado doutrinário não explicitado.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Sarça” preserva a conhecida designação bíblica; “visão extraordinária” comunica assombro sem soar arcaico. O marcador [a] aparece no texto principal.
