review_pass:
  verdict: revise
  source_fidelity: A tradução capta o assombro da cena e o sentido contextual de a sarça não ser consumida. Contudo, “me aproximar” substitui o movimento específico de desviar-se/voltar-se de lado, e “descobrir” acrescenta uma ação cognitiva que não está expressa no hebraico, onde Moisés quer ver o motivo do fenômeno.
  naturalness: O registro é claro e apropriado. “Deixe-me desviar” reproduz de modo idiomático a autoexortação volitiva; “esta grande visão” mantém o caráter de algo visto, sem especificar indevidamente que se trata de uma visão interior.
  terminology: “Moisés” e “sarça” estão corretos e adequados ao registro bíblico contemporâneo. “Não se consome” comunica o paradoxo contextual, mas a nota deve apresentar “não arde” como alternativa lexical direta; “não acaba de queimar” não é formulação natural nem uma boa alternativa para o hebraico.
  issues:
  - severity: medium
    issue: “Vou me aproximar” para אָסֻרָה נָּא
    rationale: O verbo indica voltar-se ou desviar-se para o lado, não simplesmente aproximar-se. A forma coortativa com נָא também pede uma formulação volitiva, como “Deixe-me...”.
  - severity: low
    issue: “e descobrir por que” para וְאֶרְאֶה ... מַדּוּעַ
    rationale: O texto diz literalmente que Moisés quer desviar-se e ver o grande espetáculo/visão, seguido da pergunta sobre por que a sarça não arde. “Descobrir” explicita uma inferência possível, mas não necessária.
  - severity: medium
    issue: Alternativa de nota “não acaba de queimar”
    rationale: A expressão é pouco natural em português e não representa com precisão a alternativa lexical principal de בער, “arder/queimar”.
