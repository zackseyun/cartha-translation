  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: pt
  text: E desci para livrá-lo[a] da mão do Egito[b] e para fazê-lo subir daquela terra para uma terra boa e espaçosa[c], uma terra que mana leite e mel, para o lugar dos cananeus, dos hititas, dos amorreus, dos perizeus, dos heveus e dos jebuseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega o singular tanto em “livrá-lo” como em “fazê-lo subir”, referindo-se coletivamente a Israel como povo.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “da mão do Egito” significa “do poder” ou “do domínio do Egito”.
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “uma terra boa e ampla”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: E desci
  rationale: Mantém a linguagem espacial e antropomórfica de ירד e expressa naturalmente em português a ação divina apresentada como decidida e iniciada no discurso narrativo.
- source_word: לְהַצִּילוֹ
  choice: para livrá-lo
  rationale: O hifil de נצל comunica resgate de perigo ou domínio. “Livrar” preserva o sentido concreto sem acrescentar conotações teológicas que não precisam ser explicitadas aqui.
- source_word: מִיַּד מִצְרַיִם
  choice: da mão do Egito
  rationale: Conserva a imagem hebraica da mão como poder ou controle. A expressão é compreensível em português e “Egito” permanece como entidade nacional.
- source_word: וּלְהַעֲלֹתוֹ
  choice: e para fazê-lo subir
  rationale: Reproduz o causativo de עלה e mantém o movimento vertical/geográfico próprio da linguagem do êxodo. O pronome singular representa Israel coletivamente.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: daquela terra
  rationale: Tradução direta do sintagma demonstrativo, que retoma o Egito sem repeti-lo.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: para uma terra boa e espaçosa
  rationale: “Boa” traduz טובה, e “espaçosa” comunica naturalmente a amplitude de רחבה, inclusive o contraste implícito com a opressão e a restrição no Egito.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: “Mana” conserva a imagem participial de abundância e é uma formulação clara, digna e corrente na tradição bíblica em português.
- source_word: אֶל מְקוֹם
  choice: para o lugar dos
  rationale: Mantém o sentido básico de מקום sem substituí-lo por “terra” ou “território”; a construção com “dos” identifica os povos que então ocupavam o lugar.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: os cananeus, os hititas, os amorreus, os perizeus, os heveus e os jebuseus
  rationale: Os gentílicos hebraicos estão no singular coletivo. O plural em português expressa naturalmente essa referência a povos inteiros, sem sugerir seis indivíduos específicos.
theological_decisions:
- issue: Movimento divino antropomórfico em “desci”
  choice: Conservar literalmente a linguagem espacial
  alternative: Parafrasear como “vim intervir” ou “decidi agir”
  rationale: A imagem espacial faz parte da apresentação narrativa da ação de Deus. Mantê-la preserva a vivacidade e a tensão próprias do texto, sem impor uma explicação metafísica.
- issue: Pronomes singulares referentes a Israel
  choice: Usar “-lo” em “livrá-lo” e “fazê-lo subir”
  alternative: Empregar o plural “livrá-los” e “fazê-los subir”
  rationale: Os dois sufixos hebraicos são singulares e retratam Israel como uma unidade coletiva. O singular português conserva essa perspectiva, embora uma nota esclareça o referente.
- issue: Gentílicos hebraicos no singular coletivo
  choice: Traduzir pelos plurais naturais em português
  alternative: Usar “o cananeu, o hitita...”
  rationale: Em hebraico, o singular com artigo designa coletivamente cada povo. Em português atual, a sequência no singular tenderia a indicar indivíduos; o plural preserva melhor o valor coletivo sem alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservam-se as imagens concretas do hebraico (“desci”, “mão”, “subir”, “mana”), enquanto os nomes dos povos aparecem no plural natural do português. Evitaram-se paráfrases doutrinárias e arcaísmos desnecessários.
