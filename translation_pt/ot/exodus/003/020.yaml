    issue: «Dentro dele» é menos preciso e menos natural neste contexto do que «no meio dele».
    rationale: בְּקִרְבּוֹ indica a ocorrência dos feitos no interior/em meio ao Egito; «no meio dele» preserva melhor essa imagem.
  - severity: low
    issue: A formulação principal «deixará que vocês partam» é um pouco menos próxima de יְשַׁלַּח («mandará/enviará para fora»).
    rationale: «Mandará vocês embora» conserva a ação de envio/liberação e continua idiomática, enquanto a nota pode registrar a alternativa «deixará vocês partir».
  revised_text: Estenderei[a] a minha mão e ferirei o Egito com todas as minhas maravilhas que farei no meio dele. Depois disso, ele mandará vocês embora[b].
