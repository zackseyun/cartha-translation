base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: pt
  text: Estenderei[a] a minha mão e ferirei o Egito com todas as minhas maravilhas que farei no meio dele. Depois disso, ele mandará vocês embora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Enviarei a minha mão”. A expressão hebraica significa estender a mão para agir ou exercer poder.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele deixará vocês partir”. O hebraico diz mais literalmente: “ele mandará vocês embora”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: Estenderei a minha mão
  rationale: Embora שׁלח signifique normalmente “enviar”, a expressão com “mão” descreve estendê-la para agir com poder. A tradução mantém a imagem concreta e soa natural em português.
- source_word: וְהִכֵּיתִי
  choice: e ferirei
  rationale: נכה expressa a ação de golpear ou ferir. “Ferirei” é atual e digno, e não especifica indevidamente morte ou destruição total.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: O hebraico nomeia o Egito como entidade territorial e nacional, não apenas os egípcios individualmente.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: com todas as minhas maravilhas
  rationale: נפלאות designa feitos extraordinários que causam assombro. “Maravilhas” preserva a concisão e a ressonância bíblica sem deixar de ser compreensível hoje.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: que farei
  rationale: Tradução direta e simples da oração relativa, preservando o sentido comum de עשה.
- source_word: בְּקִרְבּוֹ
  choice: dentro dele
  rationale: O sufixo singular retoma naturalmente “o Egito”. “Dentro dele” preserva tanto o singular quanto a localização dos atos no próprio Egito.
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: A expressão assinala claramente a sequência temporal e é natural em português moderno.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: ele deixará que vocês partam
  rationale: O sujeito implícito é o faraó. Neste contexto, שׁלח comunica a liberação de Israel; a formulação escolhida é idiomática em português, enquanto a nota registra a tradução mais literal.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Manter a metáfora corporal “estenderei a minha mão”
  alternative: Traduzir de modo abstrato, como “exercerei o meu poder”
  rationale: O hebraico apresenta a intervenção de Deus por meio de uma imagem concreta. Preservá-la respeita o sentido do texto sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” evita regionalismos mais marcados; “maravilhas” conserva a imagem bíblica, e “dentro dele” mantém a referência gramatical singular ao Egito.
