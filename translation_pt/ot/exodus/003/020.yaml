  naturalness: O registro é claro e moderno. «No meio dele» é mais idiomático e mais próximo da imagem espacial de בְּקִרְבּוֹ do que «dentro dele». «Mandará vocês embora» é natural em português brasileiro e comunica adequadamente a ação de liberar/expulsar.
  terminology: «Maravilhas» é uma boa equivalência para נִפְלְאוֹתַי; deve vir acompanhado de «minhas». «Ferirei» mantém a sobriedade e não especifica indevidamente a natureza do golpe.
