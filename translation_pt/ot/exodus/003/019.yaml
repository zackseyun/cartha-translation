  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: pt
  text: Mas eu sei que o rei do Egito não deixará vocês partirem[a], a não ser pela força de uma mão forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rei do Egito não deixará vocês partirem, nem mesmo pela força de uma mão forte”; também é possível: “exceto por uma mão poderosa”. A frase hebraica é elíptica e pode enfatizar que somente uma força irresistível levará o faraó a ceder.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome independente introduz uma mudança enfática e contrastiva; «Mas eu» é natural em português.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: O perfeito expressa conhecimento divino firme e atual; o presente comunica isso com naturalidade.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do que Deus sabe.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: não deixará vocês partirem
  rationale: A construção com נתן e infinitivo significa permitir. «Partirem» esclarece que se trata da saída do Egito e evita a possível leitura de simples abandono.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: o rei do Egito
  rationale: Tradução direta e natural da expressão construta.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: a não ser por uma mão forte
  rationale: Mantém a imagem instrumental e a concisão da cláusula hebraica elíptica, sem explicitar no texto quem exerce a força.
theological_decisions:
- issue: Sentido da cláusula elíptica וְלֹא בְּיָד חֲזָקָה
  choice: O rei só deixará Israel partir diante da ação de uma mão forte.
  alternative: O rei não deixará Israel partir, nem mesmo diante de uma mão forte.
  rationale: O versículo seguinte favorece a leitura de coerção por poder irresistível, mas a sintaxe comprimida admite mais de uma compreensão; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Vocês» evita uma forma regional marcada; «mão forte» preserva um motivo recorrente de Êxodo.
