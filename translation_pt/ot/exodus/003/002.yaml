language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: pt
  text: Então o anjo[a] de Yahweh lhe apareceu numa chama de fogo, do meio da sarça. Ele olhou, e eis que a sarça ardia no fogo, mas não era consumida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mensageiro de Yahweh». A palavra hebraica pode significar tanto «anjo» como «mensageiro».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה, neste contexto de manifestação, é expresso naturalmente em português pelo intransitivo «apareceu».
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar «anjo» ou «mensageiro». «Anjo» é a leitura mais natural neste contexto de manifestação divina, sem definir além do texto a identidade da figura; a alternativa lexical é preservada em nota.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino específico representado pelo Tetragrama.
- source_word: אֵלָיו
  choice: lhe
  rationale: Reproduz de modo natural a preposição com sufixo pronominal, cujo referente contextual é Moisés.
- source_word: בְּלַבַּת אֵשׁ
  choice: numa chama de fogo
  rationale: Mantém a imagem e a relação construta do hebraico em linguagem portuguesa natural.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: do meio da sarça
  rationale: Reflete o sentido espacial de מִתּוֹךְ e emprega «sarça», termo português estabelecido para סְּנֶה nesta narrativa.
- source_word: וַיַּרְא
  choice: Ele olhou
  rationale: Embora o verbo signifique literalmente «viu», «olhou» representa bem o ato de dirigir a atenção antes da observação introduzida por וְהִנֵּה.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a função discursiva de chamar a atenção para a visão surpreendente, em registro narrativo digno.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: ardia no fogo
  rationale: O imperfeito narrativo com particípio comunica ação contínua; «ardia» preserva essa duração e mantém a menção explícita ao fogo.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: não era consumida
  rationale: Expressa naturalmente o passivo de אכל e conserva o paradoxo central de a sarça arder sem ser consumida.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de מַלְאַךְ no contexto da manifestação divina
  choice: anjo
  alternative: mensageiro
  rationale: O contexto favorece «anjo», mas o termo hebraico também pode significar «mensageiro». A nota mantém essa ambiguidade lexical sem impor uma identificação teológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservam-se a imagem concreta da chama, o marcador enfático «e eis que» e a tensão narrativa da sarça que ardia sem ser consumida. O marcador da nota foi colocado após «anjo», termo ao qual a alternativa lexical se refere.
