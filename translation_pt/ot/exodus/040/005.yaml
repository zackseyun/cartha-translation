base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: pt
  text: E você colocará o altar de ouro para o incenso diante da arca do testemunho[a] e porá a cortina para a entrada do tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente traduzida como «arca da aliança»; o hebraico diz «arca do testemunho».
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: você colocará
  rationale: נתן pode significar dar, pôr ou colocar; neste contexto de posicionamento dos utensílios, «colocará» é claro e natural.
- source_word: מִזְבַּח הַזָּהָב
  choice: o altar de ouro
  rationale: A expressão hebraica descreve diretamente o material do altar; «de ouro» é idiomático em português e mantém essa precisão.
- source_word: לִקְטֹרֶת
  choice: para o incenso
  rationale: A preposição ל indica finalidade; «para o incenso» preserva essa relação sem converter a expressão em simples título tradicional.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa adequadamente a relação espacial e mantém um registro digno.
- source_word: אֲרוֹן הָעֵדֻת
  choice: a arca do testemunho
  rationale: עֵדֻת significa «testemunho» neste título; a tradução segue a formulação hebraica em vez de substituí-la pelo título tradicional «arca da aliança».
- source_word: וְשַׂמְתָּ
  choice: porá
  rationale: שׂים indica pôr ou colocar; «porá» evita repetição desnecessária sem alterar o sentido.
- source_word: מָסַךְ הַפֶּתַח
  choice: a cortina na entrada
  rationale: מָסַךְ designa aqui a cortina que fecha a entrada. Em português, «cortina na entrada» é mais natural e concreto que «tela», sem confundi-la com o véu interior.
- source_word: לַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: מִשְׁכָּן é tradicional e adequadamente traduzido por «tabernáculo» neste contexto cultual; o ל integra idiomaticamente a relação com a entrada.
theological_decisions:
- issue: Tradução de עֵדֻת no título da arca
  choice: arca do testemunho
  alternative: arca da aliança
  rationale: O texto hebraico traz עֵדֻת, «testemunho». Manter esse termo respeita a evidência original e evita importar o título tradicional mais conhecido, embora relacionado.
translation_notes:
  register: Português moderno, claro e digno, com futuro prescritivo. «Altar de ouro» preserva a construção material; «cortina» é a designação natural do tecido colocado na entrada.
