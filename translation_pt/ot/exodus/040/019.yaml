base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Então estendeu a tenda sobre o tabernáculo e, por cima, colocou sobre ele a cobertura da tenda, assim como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: estendeu
  rationale: O verbo פרשׂ descreve o ato de estender ou desdobrar algo sobre uma estrutura; “estendeu” é natural e permanece próximo do sentido básico.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: אֹהֶל significa normalmente “tenda” e aqui designa a camada colocada sobre o tabernáculo, mantendo-se distinta de מִכְסֶה, “cobertura”.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: “Tabernáculo” é o termo português tradicional, reconhecível e contextualmente preciso para a habitação sagrada de Êxodo.
- source_word: וַיָּשֶׂם
  choice: colocou
  rationale: שׂים é um verbo comum com o sentido de pôr ou colocar; “colocou” combina clareza e dignidade no português atual.
- source_word: מִכְסֵה הָאֹהֶל
  choice: a cobertura da tenda
  rationale: A tradução direta preserva a distinção lexical entre a tenda e sua cobertura externa.
- source_word: עָלָיו מִלְמָעְלָה
  choice: por cima, colocou sobre ele
  rationale: A formulação representa tanto a relação espacial expressa por עָלָיו quanto a indicação מִלְמָעְלָה, evitando omitir a ideia de que a cobertura ficava na parte superior.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: assim como Yahweh havia ordenado a Moisés
  rationale: “Assim como” realça a correspondência entre a ordem e seu cumprimento; “havia ordenado” indica naturalmente que a instrução precedeu a execução.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” o apresenta como nome pessoal e não como o título “SENHOR”, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao público brasileiro e compreensível internacionalmente. Mantém-se a distinção técnica entre “tenda”, “tabernáculo” e “cobertura”.
