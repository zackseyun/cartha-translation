base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: pt
  text: Pôs a mesa na tenda do encontro, no lado norte do tabernáculo, do lado de fora do véu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da cortina». O hebraico פָּרֹכֶת se refere à divisória interna de tecido que ocultava o Lugar Santíssimo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Pôs
  rationale: Neste contexto de disposição espacial, o verbo נתן tem o sentido de pôr ou colocar. «Pôs» é direto, natural e fiel.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O hebraico diz apenas «a mesa». Identificações mais específicas, embora conhecidas pelo contexto, não devem ser acrescentadas a este versículo.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução transparente da designação cultual אֹהֶל מוֹעֵד, em linguagem clara e corrente.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: no lado norte do tabernáculo
  rationale: יֶרֶךְ indica o lado ou flanco, e צָפֹנָה especifica a localização ao norte. A formulação reproduz com naturalidade a indicação espacial.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: «Tabernáculo» é o termo técnico consolidado para מִשְׁכָּן neste contexto arquitetônico e cultual de Êxodo.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: do lado de fora do véu
  rationale: מִחוּץ expressa posição exterior, e פָּרֹכֶת designa a peça interna de tecido que separava o Lugar Santíssimo. «Véu» é conciso, digno e amplamente reconhecível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário cultual consolidado. O marcador da nota foi colocado após «véu», termo ao qual a alternativa lexical efetivamente se refere.
