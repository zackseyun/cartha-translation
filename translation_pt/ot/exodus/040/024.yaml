translation:
  language: pt
  text: Pôs o candelabro na tenda do encontro, em frente à mesa, no lado sul do tabernáculo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Pôs
  rationale: O verbo שׂים com waw consecutivo narra uma ação concluída. “Pôs” é natural em português e expressa diretamente a colocação cuidadosa do objeto.
- source_word: הַמְּנֹרָה
  choice: o candelabro
  rationale: מְנוֹרָה designa o suporte cultual para as lâmpadas. “Candelabro” é a designação bíblica tradicional e amplamente compreensível em português, sem recorrer à transliteração “menorá”.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: A expressão designa a estrutura sagrada como lugar de encontro. “Tenda do encontro” é clara, natural e mantém a distinção em relação ao termo מִשְׁכָּן, traduzido como “tabernáculo”.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: em frente à mesa
  rationale: נֹכַח indica posição diante de ou defronte a algo. “Em frente à mesa” preserva a relação espacial sem impor mais precisão do que o hebraico oferece.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O hebraico diz simplesmente “a mesa”; a tradução não acrescenta a associação contextual com o pão da Presença.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: no lado sul do tabernáculo
  rationale: יֶרֶךְ significa literalmente “lado” ou “flanco”; junto do termo direcional seguinte, a frase localiza o candelabro no lado meridional da estrutura.
- source_word: נֶגְבָּה
  choice: sul
  rationale: A forma direcional indica a posição ao sul. Em português, “lado sul” comunica naturalmente esse valor espacial.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Embora o termo se relacione etimologicamente a uma habitação, “tabernáculo” é a designação estabelecida e contextualmente precisa para o santuário em Êxodo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. A opção “em frente à mesa” conserva a amplitude espacial de נֹכַח; não se acrescentou nota porque a própria expressão portuguesa pode indicar tanto posição defronte quanto orientação voltada para a mesa.
