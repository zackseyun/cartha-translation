source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: pt
  text: Então a nuvem cobriu a tenda do encontro, e a glória de Yahweh[a] encheu o tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, o nome divino; tradicionalmente traduzido por “SENHOR”.
    reason: Esclarece a forma hebraica e informa a alternativa tradicional sem alterar o texto principal.
lexical_decisions:
- source_word: וַיְכַס
  choice: Então ... cobriu
  rationale: O verbo כסה significa normalmente “cobrir”. A forma narrativa com וַ avança a sequência dos acontecimentos, expressa naturalmente por “Então”.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: O substantivo definido aponta para a nuvem específica já presente na narrativa de Êxodo.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Expressa de modo claro e natural a função da tenda como lugar designado para o encontro, sem acrescentar uma interpretação não presente no hebraico.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כָּבוֹד designa aqui a glória manifesta de Deus; a construção com “de” reproduz naturalmente a relação do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo silenciosamente por um título.
- source_word: מָלֵא
  choice: encheu
  rationale: Neste contexto, o verbo descreve a glória ocupando o tabernáculo; “encheu” preserva com clareza o sentido transitivo.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן é o termo técnico para a estrutura sagrada em Êxodo; “tabernáculo” é a equivalência tradicional e reconhecível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; a nota registra a convenção tradicional.
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. “Tenda do encontro” distingue אֹהֶל מוֹעֵד de “tabernáculo”, usado para הַמִּשְׁכָּן. O marcador foi colocado junto a “Yahweh”, pois a nota diz respeito ao nome divino.
