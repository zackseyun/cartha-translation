source:
  edition: WLC
  text: וְ/אִם לֹ֥א יֵעָלֶ֖ה הֶ/עָנָ֑ן וְ/לֹ֣א יִסְע֔וּ עַד י֖וֹם הֵעָלֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/037.yaml
  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: pt
  text: Mas, se a nuvem não se levantava, eles não partiam até o dia em que ela se levantava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “até o dia do seu levantar-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A combinação da conjunção com a partícula condicional introduz um contraste com o versículo anterior; “Mas, se” preserva essa relação de modo natural em português.
- source_word: לֹא יֵעָלֶה הֶעָנָן
  choice: a nuvem não se levantava
  rationale: O imperfeito hebraico, neste resumo habitual das jornadas, é expresso naturalmente pelo pretérito imperfeito. “Levantar-se” comunica o movimento ascendente da nuvem sem impor uma leitura passiva.
- source_word: וְלֹא יִסְעוּ
  choice: eles não partiam
  rationale: נסע, no contexto de acampamento e viagem, designa o ato de partir ou pôr-se em marcha. “Partiam” é claro, conciso e adequado à ação repetida.
- source_word: עַד יוֹם
  choice: até o dia
  rationale: Mantém o substantivo explícito יוֹם, “dia”, em vez de generalizá-lo como “momento”.
- source_word: הֵעָלֹתוֹ
  choice: em que ela se levantava
  rationale: O infinitivo construto com sufixo significa literalmente “do seu levantar-se”. A oração relativa é mais natural em português, e o pronome feminino retoma inequivocamente “a nuvem”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. O pretérito imperfeito preserva o caráter habitual do procedimento descrito no contexto.
