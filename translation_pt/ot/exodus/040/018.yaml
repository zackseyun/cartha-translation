  text: וַ/יָּ֨קֶם מֹשֶׁ֜ה אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּתֵּן֙ אֶת אֲדָנָ֔י/ו וַ/יָּ֨שֶׂם֙ אֶת קְרָשָׁ֔י/ו וַ/יִּתֵּ֖ן אֶת בְּרִיחָ֑י/ו וַ/יָּ֖קֶם אֶת עַמּוּדָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: pt
  text: Assim, Moisés armou o tabernáculo, colocou suas bases[a], assentou suas armações[b], instalou suas travessas e levantou suas colunas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encaixes”. Eram as peças de fundação que sustentavam as armações do tabernáculo.
    reason: lexical_alternative
  - marker: b
    text: Ou “tábuas” ou “pranchas”. O termo hebraico designa aqui os elementos estruturais verticais do tabernáculo.
    reason: lexical_alternative
  - marker: c
    text: Ou “postes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: armou
  rationale: No hifil, קום significa fazer ficar de pé ou erguer. “Armou” descreve de modo natural a montagem do tabernáculo portátil.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Embora מִשְׁכָּן signifique literalmente “morada”, em Êxodo designa o santuário portátil e “tabernáculo” é o termo português reconhecido.
- source_word: אֲדָנָיו
  choice: suas bases
  rationale: אֶדֶן designa as peças de fundação que sustentavam ou recebiam os elementos verticais. “Bases” é claro e evita tecnicismo excessivo.
- source_word: קְרָשָׁיו
  choice: suas armações
  rationale: קֶרֶשׁ pode designar tábuas ou pranchas, mas aqui se refere aos elementos estruturais verticais do tabernáculo. “Armações” comunica sua função sem definir além do necessário sua forma exata.
- source_word: בְּרִיחָיו
  choice: suas travessas
  rationale: בְּרִיחַ designa as barras horizontais que mantinham unidos os elementos da estrutura. “Travessas” expressa com clareza essa função construtiva.
- source_word: עַמּוּדָיו
  choice: suas colunas
  rationale: עַמּוּד designa suportes verticais. “Colunas” é corrente e digno no contexto de um santuário; “postes” permanece possível.
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: colocou / assentou / instalou
  rationale: Os verbos têm sentidos amplos de pôr ou colocar. A variação em português acompanha naturalmente os diferentes componentes, preservando a sequência de montagem.
theological_decisions: []
