  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: E dispôs sobre ela os pães em ordem[a], diante de Yahweh, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a disposição dos pães”; tradicionalmente, “os pães da Presença”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: pôs ... em ordem
  rationale: O verbo ערך indica dispor ou colocar ordenadamente. A expressão é natural em português e conserva a ideia de organização ritual.
- source_word: עָלָיו
  choice: sobre ela
  rationale: O pronome retoma a mesa mencionada no versículo anterior; o feminino explicita naturalmente esse referente em português.
- source_word: עֵרֶךְ לֶחֶם
  choice: os pães ... em ordem
  rationale: A construção descreve pão disposto de maneira ordenada. O plural idiomático 'os pães' condiz com os pães individuais desse rito, sem substituir a expressão deste versículo pelo título tradicional 'pães da Presença'.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Mantém o sentido espacial e cultual de estar perante ou na presença de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exatamente como Yahweh havia ordenado a Moisés
  rationale: '''Exatamente como'' realça a correspondência com a instrução divina, e ''havia ordenado'' situa naturalmente a ordem antes de seu cumprimento.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Identificação cultual de עֵרֶךְ לֶחֶם
  choice: os pães ... em ordem
  alternative: a disposição dos pães; os pães da Presença
  rationale: A tradução conserva a formulação descritiva própria deste versículo sem importar o termo técnico לֶחֶם הַפָּנִים, embora a nota registre a designação tradicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A inversão hebraica foi suavizada sem perder a ideia de disposição ordenada; 'ela' retoma a mesa do contexto imediato.
