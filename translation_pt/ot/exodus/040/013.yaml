  text: וְ/הִלְבַּשְׁתָּ֙ אֶֽת אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַ/קֹּ֑דֶשׁ וּ/מָשַׁחְתָּ֥ אֹת֛/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֖/וֹ וְ/כִהֵ֥ן לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: pt
  text: Você vestirá Arão com as vestes sagradas, o ungirá e o consagrará, e ele me servirá como sacerdote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exercerá para mim a função de sacerdote”. O verbo hebraico significa atuar ou servir no ofício sacerdotal.'
    reason: Alternativa lexical que explicita o sentido funcional do verbo כהן.
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Você vestirá
  rationale: 'O hifil de לבשׁ é causativo: Moisés deve pôr as vestes em Arão. “Vestirá” é natural em português e adequado ao contexto de investidura sacerdotal.'
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: as vestes sagradas
  rationale: A construção significa literalmente “vestes de santidade”. “Vestes sagradas” comunica de modo natural sua condição cultual sem tornar a expressão abstrata.
- source_word: וּמָשַׁחְתָּ
  choice: o ungirá
  rationale: “Ungir” é o equivalente consagrado e preciso de משׁח em contextos de instalação sacerdotal.
- source_word: וְקִדַּשְׁתָּ
  choice: o consagrará
  rationale: No piel, קדשׁ indica separar alguém para o serviço sagrado. “Consagrará” preserva o sentido ritual de modo claro.
- source_word: וְכִהֵן
  choice: ele me servirá como sacerdote
  rationale: O verbo כהן significa exercer a função sacerdotal. Esta formulação preserva o valor verbal e a sequência coordenada do hebraico sem reduzir a expressão a “ser sacerdote”.
- source_word: לִי
  choice: me
  rationale: O pronome em “me servirá” expressa de maneira idiomática o serviço prestado a Deus, correspondente ao dativo hebraico לִי.
theological_decisions:
- issue: Linguagem da instalação sacerdotal
  choice: Manter unção e consagração como atos distintos e relacionados.
  alternative: Resumir ambos em uma única expressão, como “ordená-lo”.
  rationale: O hebraico apresenta uma sequência de ações rituais — vestir, ungir, consagrar e exercer o sacerdócio. Preservá-las evita introduzir categorias eclesiásticas posteriores.
- issue: Força de וְכִהֵן לִי
  choice: 'Traduzir como sequência coordenada: “e ele me servirá como sacerdote”.'
  alternative: 'Explicitar finalidade: “para que ele me sirva como sacerdote”.'
  rationale: A forma hebraica permite entender o serviço sacerdotal como resultado das ações anteriores, mas não contém uma conjunção final explícita. A coordenação conserva essa abertura sem eliminar a relação contextual de resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para a segunda pessoa singular, mantém a cadência solene da instrução ritual e evita terminologia denominacional.
