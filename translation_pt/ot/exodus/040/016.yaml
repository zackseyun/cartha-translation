  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: pt
  text: Moisés fez tudo conforme Yahweh lhe havia ordenado[a]; assim ele fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma consonantal hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה pode significar “fazer” ou “realizar”. Aqui descreve o cumprimento obediente das ordens recebidas; “fez” é natural e preserva a repetição hebraica.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כְּכֹל
  choice: tudo conforme
  rationale: A combinação כְּ + כֹל expressa conformidade integral. Esta formulação comunica que Moisés cumpriu tudo exatamente de acordo com a ordem.
- source_word: אֲשֶׁר צִוָּה
  choice: havia ordenado
  rationale: A oração relativa apresenta aquilo que Yahweh ordenou. O mais-que-perfeito composto torna natural em português a anterioridade da ordem em relação à execução, sem alterar o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֹתוֹ
  choice: lhe
  rationale: O pronome retoma Moisés como destinatário da ordem; “lhe havia ordenado” é idiomático em português.
- source_word: כֵּן עָשָׂה
  choice: assim ele fez
  rationale: Preserva a retomada enfática do hebraico e a repetição do verbo עשה, destacando a plena correspondência entre ordem e execução.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” preserva essa função e não o substitui silenciosamente pelo título tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “fez tudo conforme” evita uma construção excessivamente calcada no hebraico, enquanto a cláusula final “assim ele fez” conserva sua repetição enfática.
