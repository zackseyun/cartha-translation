  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Ele colocou o altar do holocausto à entrada do tabernáculo da tenda do encontro e sobre ele ofereceu o holocausto e a oferta de cereal, assim como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: A expressão em estado construto identifica o altar por sua função sacrificial. “Altar do holocausto” é a designação tradicional, clara e precisa em português.
- source_word: שָׂם
  choice: colocou
  rationale: No contexto da instalação do santuário, “colocou” expressa de modo natural e direto o posicionamento do altar.
- source_word: פֶּתַח
  choice: à entrada de
  rationale: O substantivo indica a abertura ou entrada. A locução portuguesa preserva claramente a relação espacial.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: o tabernáculo da tenda do encontro
  rationale: A tradução mantém os dois termos do hebraico e sua ligação sintática, sem reduzi-los a uma única designação.
- source_word: וַיַּעַל עָלָיו
  choice: e sobre ele ofereceu
  rationale: No uso sacrificial, עלה significa oferecer ou fazer subir uma oferta; “ofereceu” comunica naturalmente a ação cultual, e “sobre ele” retém a referência ao altar.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o equivalente português estabelecido para a oferta inteiramente queimada designada por עֹלָה.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: Embora מִנְחָה possa significar presente ou tributo, no contexto sacerdotal designa a oferta vegetal preparada com cereal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: assim como Yahweh havia ordenado a Moisés
  rationale: “Assim como” ressalta a correspondência entre ordem e execução; “havia ordenado” torna natural em português a anterioridade da ordem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia cultual reconhecível. A ordem foi levemente ajustada em “sobre ele ofereceu” para eliminar uma possível leitura ambígua do pronome sem perder a estrutura narrativa. Não são necessárias notas de rodapé.
