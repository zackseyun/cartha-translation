base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: pt
  text: Você ungirá o altar do holocausto e todos os seus utensílios; consagrará o altar, e o altar será santíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “santo dos santos”; expressão superlativa que significa “santíssimo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Você ungirá
  rationale: No contexto ritual, משׁח indica ungir com óleo para dedicar ao serviço sagrado. O futuro em português mantém o tom prescritivo da sequência.
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: A construção identifica o altar destinado ao sacrifício inteiramente queimado; “altar do holocausto” é uma expressão tradicional, concisa e amplamente compreensível em português bíblico.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כֵּלִים abrange os objetos e instrumentos associados ao altar. “Utensílios” comunica com clareza esse equipamento ritual.
- source_word: וְקִדַּשְׁתָּ
  choice: consagrará
  rationale: No cenário cultual, קדשׁ significa separar e tornar santo para uso sagrado. “Consagrar” preserva esse sentido em linguagem natural.
- source_word: וְהָיָה
  choice: será
  rationale: 'O verbo apresenta o estado resultante da unção e da consagração: o altar passará a ter o estatuto declarado de santidade máxima.'
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssimo
  rationale: A combinação hebraica funciona como superlativo e atribui ao altar o grau máximo de santidade. “Santíssimo” é claro e não confunde o altar com o espaço chamado Santo dos Santos.
theological_decisions:
- issue: Sentido da fórmula cultual קֹדֶשׁ קָדָשִׁים
  choice: santíssimo
  alternative: santo dos santos
  rationale: A expressão descreve aqui o grau de santidade do altar, não sua localização no recinto interior. A tradução superlativa preserva essa distinção sem diminuir a força da fórmula hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário cultual amplamente reconhecido. O paralelismo das duas ações foi preservado, e a nota foi colocada junto de “santíssimo”, termo ao qual se refere.
