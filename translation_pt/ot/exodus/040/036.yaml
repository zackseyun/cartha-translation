  source_fidelity: A estrutura temporal iterativa e o valor habitual de "partiam" refletem bem o hebraico. "Os filhos de Israel" preserva adequadamente בְּנֵי יִשְׂרָאֵל. Contudo, "etapas de suas jornadas" torna explícita uma nuance possível de מַסְעֵיהֶם e soa redundante, onde o hebraico diz simplesmente "em todas as suas jornadas".
  naturalness: '"De sobre o tabernáculo" é pouco natural no português moderno internacional. "De cima do tabernáculo" conserva o movimento a partir da posição acima dele e é mais fluente. A retirada de "etapas" também torna a frase mais direta.'
