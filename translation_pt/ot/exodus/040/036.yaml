base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: pt
  text: Sempre que a nuvem se elevava de cima do tabernáculo, os filhos de Israel partiam em todas as suas jornadas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/הֵעָל֤וֹת הֶֽ/עָנָן֙
  choice: Sempre que a nuvem se elevava
  rationale: A conjunção com בְּ e o infinitivo construto introduz uma oração temporal; o contexto descreve uma circunstância repetida. O imperfeito português expressa naturalmente esse caráter habitual, sem impor um agente que levante a nuvem.
- source_word: מֵ/עַ֣ל הַ/מִּשְׁכָּ֔ן
  choice: de sobre o tabernáculo
  rationale: מֵעַל indica movimento a partir de uma posição acima do santuário. “Tabernáculo” é o termo tradicional, preciso e amplamente reconhecido para מִשְׁכָּן neste contexto.
- source_word: יִסְע֖וּ
  choice: partiam
  rationale: נסע designa aqui a partida para prosseguir viagem. O imperfeito combina com a oração temporal habitual introduzida por “sempre que”.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  choice: os filhos de Israel
  rationale: Preserva de perto a expressão hebraica, um nome coletivo tradicional para o povo de Israel, sem reduzi-la apenas aos homens.
- source_word: בְּ/כֹ֖ל מַסְעֵי/הֶֽם
  choice: em todas as etapas de suas jornadas
  rationale: מַסַּע pode designar tanto jornada quanto etapa ou acampamento de um itinerário. A formulação comunica a distribuição da prática por todo o percurso no deserto.
theological_decisions:
- issue: A agência na elevação da nuvem
  choice: a nuvem se elevava
  alternative: a nuvem era levantada
  rationale: A construção hebraica pode ser traduzida sem explicitar quem causa o movimento. A forma reflexiva/intransitiva portuguesa preserva essa discrição e não exclui a ação divina indicada pelo contexto.
- issue: A designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução mantém a forma tradicional e a ligação verbal com o patriarca Israel; no contexto, a expressão designa corporativamente todo o povo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe habitual clara. “Tabernáculo” conserva a terminologia bíblica reconhecida; “etapas de suas jornadas” explicita de modo moderado o sentido itinerante de מַסְעֵיהֶם.
