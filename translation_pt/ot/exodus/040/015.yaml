base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: pt
  text: Você os ungirá assim como ungiu o pai deles, para que me sirvam como sacerdotes. E a unção deles lhes conferirá um sacerdócio perpétuo[a], por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “duradouro”. O hebraico pode indicar continuidade permanente ao longo das gerações no contexto da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Você os ungirá
  rationale: O perfeito com waw na sequência de instruções tem força futura e diretiva. O futuro do indicativo expressa naturalmente a ordem solene em português.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: assim como ungiu o pai deles
  rationale: Preserva a comparação explícita e identifica Aarão, no singular, como pai dos filhos mencionados no contexto.
- source_word: וְכִהֲנוּ לִי
  choice: para que me sirvam como sacerdotes
  rationale: O verbo כהן designa o exercício do serviço sacerdotal. A formulação é clara e mantém o serviço prestado a Deus.
- source_word: מָשְׁחָתָם
  choice: A unção deles
  rationale: O substantivo aponta para a unção, com seu efeito consagratório, sem exigir que seja entendido especificamente como o óleo.
- source_word: וְהָיְתָה לִהְיוֹת לָהֶם לִכְהֻנַּת עוֹלָם
  choice: A unção deles os consagrará para um sacerdócio perpétuo
  rationale: A construção hebraica indica o estado ou resultado produzido pela unção. 'Os consagrará para' comunica esse sentido em português natural, enquanto 'sacerdócio perpétuo' conserva a força duradoura da expressão.
- source_word: לְדֹרֹתָם
  choice: por todas as suas gerações
  rationale: Expressa a continuidade do sacerdócio nas sucessivas gerações dos descendentes de Aarão.
theological_decisions:
- issue: Duração indicada por עוֹלָם na linguagem sacerdotal da aliança
  choice: sacerdócio perpétuo
  alternative: sacerdócio duradouro
  rationale: עוֹלָם pode indicar continuidade permanente dentro do horizonte da aliança e das gerações mencionadas, sem necessariamente formular uma afirmação filosófica abstrata sobre duração infinita. 'Perpétuo' preserva a força tradicional do termo; a nota registra a alternativa contextual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção direta e vocabulário litúrgico acessível. Os pronomes referentes a Deus não recebem maiúscula reverencial, de acordo com o uso contemporâneo.
