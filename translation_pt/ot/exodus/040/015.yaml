revisions:
- from: Você os ungirá assim como ungiu o pai deles, para que me sirvam como sacerdotes. A unção deles os consagrará para um sacerdócio perpétuo[a], por todas as suas gerações.
  to: Você os ungirá assim como ungiu o pai deles, para que me sirvam como sacerdotes. E a unção deles lhes conferirá um sacerdócio perpétuo[a], por todas as suas gerações.
  rationale: A revisão substitui «os consagrará para» por «lhes conferirá», preservando em português moderno a relação entre a unção e o sacerdócio sem converter a construção hebraica em uma explicitação mais forte. Mantêm-se a ordem diretiva, a comparação com a unção do pai, o serviço sacerdotal prestado a Deus, a duração perpétua e a continuidade geracional.
