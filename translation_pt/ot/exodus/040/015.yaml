review_pass:
  verdict: revise
  source_fidelity: A primeira oração reproduz adequadamente a ordem de ungir os filhos de Aarão como Aarão foi ungido, a finalidade de servirem como sacerdotes para Deus e a duração através das gerações. Contudo, «A unção deles os consagrará» explicita uma relação causal que o hebraico formula de modo mais direto como o efeito/status da unção deles «para» um sacerdócio duradouro. Uma formulação menos interpretativa preserva melhor a construção e o referente de «a unção deles».
  naturalness: O texto é claro e de registro apropriado. «Você» é compreensível internacionalmente e «me sirvam como sacerdotes» é natural. A redação revista mantém essa clareza, evitando ao mesmo tempo que «os consagrará» substitua a expressão nominal do hebraico.
  terminology: «Ungir», «unção» e «sacerdotes» são termos estabelecidos e adequados. «Sacerdócio perpétuo» traduz bem לִכְהֻנַּת עוֹלָם no contexto, e a nota oferece uma alternativa lexical sem impor uma leitura doutrinária.
  issues:
  - severity: medium
    issue: «A unção deles os consagrará para» é mais interpretativo do que a formulação hebraica.
    rationale: וְהָיְתָה ... מָשְׁחָתָם לִכְהֻנַּת עוֹלָם apresenta «a unção deles» como aquilo que lhes será/conferirá sacerdócio perpétuo. Embora a consagração esteja implicada, o verbo português introduz uma explicitação que pode ser evitada com segurança.
  revised_text: Você os ungirá assim como ungiu o pai deles, para que me sirvam como sacerdotes. E a unção deles lhes conferirá um sacerdócio perpétuo[a], por todas as suas gerações.
