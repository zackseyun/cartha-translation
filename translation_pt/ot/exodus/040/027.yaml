base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: E queimou incenso aromático sobre ele[a], como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «incenso de especiarias» ou «incenso perfumado»; a expressão hebraica se refere a incenso preparado com substâncias aromáticas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: queimou
  rationale: O hifil de קטר indica fazer uma oferta subir em fumaça, especialmente sobre um altar. Com «incenso» como objeto, «queimou» expressa de modo natural e conciso a ação ritual.
- source_word: עָלָיו
  choice: sobre ele
  rationale: A preposição עַל com sufixo masculino singular retoma o altar de incenso no contexto. «Sobre ele» preserva claramente essa referência.
- source_word: קְטֹרֶת סַמִּים
  choice: incenso aromático
  rationale: A expressão designa incenso preparado com substâncias aromáticas. «Incenso aromático» é corrente em português e mantém o sentido da combinação hebraica.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Introduz a conformidade da ação com a ordem divina; «exatamente como» torna explícita essa correspondência sem alterar o sentido.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto indica naturalmente que a ordem precedeu seu cumprimento narrado neste versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e evita substituí-lo por um título, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem «queimou sobre ele incenso aromático» mantém clara a relação do incenso com o altar e soa natural no registro bíblico.
