base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: pt
  text: E Moisés não podia entrar na tenda do encontro, porque a nuvem pousou[a] sobre ela, e a glória de Yahweh encheu o tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “habitou”, “estabeleceu-se” ou “repousou”. O verbo hebraico pode transmitir a ideia de habitar, estabelecer-se ou repousar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא יָכֹל
  choice: E Moisés não podia
  rationale: Mantém a sequência narrativa introduzida por וְ e expressa יָכֹל como incapacidade, sem acrescentar um contraste que o hebraico não explicita.
- source_word: לָ/בוֹא
  choice: entrar
  rationale: No contexto de acesso a uma estrutura, “entrar” comunica de modo direto e natural o sentido de בוא.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Preserva os dois elementos da designação hebraica e distingue a tenda do termo מִשְׁכָּן, traduzido como “tabernáculo” no mesmo versículo.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a razão pela qual Moisés não podia entrar.
- source_word: שָׁכַן עָלָיו
  choice: estava pousada sobre ela
  rationale: Retrata a nuvem em estado de repouso sobre a tenda. A formulação é natural em português e conserva, em nota, as possibilidades de habitar e permanecer em repouso.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: Preserva a determinação do hebraico e remete à nuvem divina já conhecida no contexto narrativo.
- source_word: כְבוֹד
  choice: glória
  rationale: Mantém o peso concreto e teológico de כָּבוֹד sem o substituir por uma paráfrase interpretativa.
- source_word: מָלֵא
  choice: enchia
  rationale: O imperfeito português apresenta a glória como ocupando o tabernáculo naquele momento, em paralelo com a nuvem que permanecia sobre a tenda.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É a designação estabelecida e contextualmente precisa do santuário portátil em Êxodo, preservando sua distinção lexical de אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Ressonância teológica de שָׁכַן
  choice: estava pousada
  alternative: habitava; repousava
  rationale: A tradução principal privilegia a cena concreta da nuvem sobre a tenda, sem eliminar a possível nuance de habitação, que é explicitada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a progressão causal do hebraico, enquanto “não podia” e “enchia” apresentam naturalmente os estados simultâneos descritos na cena.
