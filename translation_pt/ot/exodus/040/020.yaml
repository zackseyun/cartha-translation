base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: pt
  text: Então Moisés pegou o Testemunho e o colocou dentro da arca[a]; pôs as varas na arca e pôs o propiciatório[b] sobre a arca, por cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as tábuas do Testemunho”. O hebraico traz literalmente “o Testemunho”, termo técnico para aquilo que foi colocado na arca.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a tampa da expiação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: o Testemunho
  rationale: Preserva o termo técnico cultual hebraico, que neste contexto designa concretamente o testemunho da aliança depositado na arca, provavelmente as tábuas, sem explicitar mais do que o texto.
- source_word: הָאָרֹן
  choice: a arca
  rationale: No contexto do tabernáculo, o termo designa a arca sagrada; não se acrescenta «da aliança», ausente neste versículo.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: Designa as varas usadas para transportar a arca; «varas» é uma forma corrente e reconhecível em português bíblico.
- source_word: הַכַּפֹּרֶת
  choice: o propiciatório
  rationale: Termo consagrado em português para a peça de ouro colocada sobre a arca, preservando sua identidade cultual e sua associação com a expiação.
- source_word: מִלְמָעְלָה
  choice: por cima
  rationale: Expressa naturalmente a posição superior indicada pelo advérbio hebraico, sem acrescentar um objeto pronominal ausente do texto.
- source_word: וַיִּתֵּן ... אֶל
  choice: colocou ... dentro de
  rationale: Neste contexto físico, נתן com אֶל indica colocar algo no interior da arca.
- source_word: וַיָּשֶׂם ... עַל
  choice: pôs ... na
  rationale: Representa de modo conciso e natural a colocação das varas em sua posição junto à arca.
theological_decisions:
- issue: Referente de «o Testemunho»
  choice: Manter a designação cultual «o Testemunho», entendida concretamente como aquilo que foi depositado na arca.
  alternative: Explicitar «as tábuas do Testemunho» ou «as tábuas da aliança».
  rationale: A ação exige um referente físico, provavelmente as tábuas de pedra, mas o hebraico emprega o termo técnico עֵדוּת e não nomeia diretamente as tábuas; a tradução conserva essa tensão.
- issue: Tradução de כַּפֹּרֶת
  choice: o propiciatório
  alternative: a tampa da expiação; a cobertura
  rationale: «Propiciatório» identifica a peça cultual específica e mantém sua significação teológica sem reduzi-la a uma simples tampa; a alternativa explicativa é registrada em nota.
- issue: Sujeito das ações
  choice: Moisés
  alternative: ele
  rationale: O hebraico marca apenas a continuidade narrativa por formas verbais, mas o sujeito explícito no contexto imediato é Moisés. Nomeá-lo em português evita uma abertura pronominal pouco clara sem alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se os termos bíblico-cultuais «arca», «Testemunho» e «propiciatório»; as notas esclarecem alternativas sem resolver além do hebraico.
