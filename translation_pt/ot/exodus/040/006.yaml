base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: pt
  text: E colocarás o altar do holocausto diante da entrada do tabernáculo[a], a tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em frente à entrada do tabernáculo”.'
    reason: Alternativa lexical para לִפְנֵי, que aqui expressa localização espacial.
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: E colocarás
  rationale: Neste contexto de disposição dos objetos do santuário, נתן tem o sentido de pôr ou colocar; “colocarás” comunica com naturalidade a instrução e preserva o valor futuro-imperativo da forma hebraica.
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: מִזְבֵּחַ designa o altar, e עֹלָה é a oferta inteiramente queimada. “Altar do holocausto” é a expressão cultual consagrada em português e mantém a ideia sacrificial.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A expressão indica posição espacial à frente de algo. “Diante de” é precisa, natural e adequada ao registro das instruções.
- source_word: פֶּתַח
  choice: a entrada
  rationale: O termo designa a abertura ou acesso à estrutura; “entrada” é a opção mais clara em português moderno.
- source_word: מִשְׁכָּן
  choice: tabernáculo
  rationale: É o termo técnico para a morada-santuário móvel em Êxodo. “Tabernáculo” preserva essa referência cultual reconhecida.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: A expressão fixa designa a tenda onde se dá o encontro determinado por Deus. A tradução conserva os dois elementos do hebraico sem acrescentar uma interpretação específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual tradicional onde ela continua amplamente compreensível. A construção mantém a aposição hebraica entre “tabernáculo” e “tenda do encontro”.
