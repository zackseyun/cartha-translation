  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Sempre que entravam na tenda do encontro e sempre que se aproximavam do altar, eles se lavavam, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Sempre que entravam
  rationale: A construção ב + infinitivo construto com sufixo de terceira pessoa do plural indica circunstância temporal; “sempre que” comunica naturalmente a prática repetida neste contexto narrativo.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Expressão clara e consagrada para a estrutura cultual onde Yahweh se encontrava com Israel.
- source_word: וּבְקָרְבָתָם
  choice: e sempre que se aproximavam
  rationale: A segunda construção temporal paralela também descreve uma ação habitual; “se aproximavam” reproduz com naturalidade o movimento em direção ao altar.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Mantém a determinação do hebraico e a referência cultual direta.
- source_word: יִרְחָצוּ
  choice: eles se lavavam
  rationale: O imperfeito descreve uma ação costumeira no quadro narrativo passado. A forma pronominal portuguesa exprime de modo natural a lavagem ritual, cujo objeto corporal está indicado pelo contexto imediato.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Introduz de maneira natural a conformidade da prática com a ordem anteriormente dada.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da ordem em relação à prática narrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Com o verbo “ordenar”, o português natural introduz por “a” a pessoa que recebeu a ordem.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “sempre que” preserva o paralelismo e o caráter habitual das duas construções temporais hebraicas.
