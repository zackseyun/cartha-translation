id: EXO.40.38
reference: Exodus 40:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: pt
  text: Pois a nuvem de Yahweh ficava sobre o tabernáculo durante o dia, e à noite havia fogo nela[a], diante dos olhos de toda a casa de Israel, ao longo de todas as suas jornadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nele”, isto é, no tabernáculo. O pronome hebraico pode referir-se à nuvem ou ao tabernáculo.'
    reason: ambiguidade_do_referente
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação conclusiva ligada ao relato anterior; “Pois” preserva essa função discursiva sem tornar a frase excessivamente causal.
- source_word: עֲנַן יְהוָה
  choice: a nuvem de Yahweh
  rationale: Mantém a relação construta e associa diretamente a nuvem à presença de Yahweh, sem acrescentar uma interpretação além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo consagrado e ainda compreensível para o santuário portátil de Israel, mantendo a continuidade lexical no contexto de Êxodo.
- source_word: יוֹמָם
  choice: durante o dia
  rationale: Expressão temporal natural em português, em paralelo com “à noite”.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: e à noite havia fogo nela
  rationale: O imperfeito descreve a ocorrência habitual durante as jornadas, bem expressa por “havia”. “Nela” toma a nuvem como referente de בּוֹ, mas a possível referência ao tabernáculo é registrada em nota.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Preserva a imagem concreta do hebraico e permanece clara e digna em português.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Conserva a expressão coletiva e pactual do texto hebraico, em vez de reduzi-la simplesmente a “todo Israel”.
- source_word: בְּכָל מַסְעֵיהֶם
  choice: ao longo de todas as suas jornadas
  rationale: Comunica que o sinal acompanhou Israel durante a totalidade das etapas de sua viagem.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Referente do sufixo em בּוֹ
  choice: a nuvem (“nela”)
  alternative: o tabernáculo (“nele”)
  rationale: Tanto “nuvem” como “tabernáculo” são antecedentes masculinos possíveis em hebraico. A leitura referente à nuvem combina com a tradição da coluna de nuvem e fogo, mas a ambiguidade gramatical genuína é mantida em nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Conservam-se “tabernáculo”, “casa de Israel” e a imagem “diante dos olhos” por sua importância contextual e corporativa.
