  text: וַ/יָּ֣קֶם אֶת הֶ/חָצֵ֗ר סָבִיב֙ לַ/מִּשְׁכָּ֣ן וְ/לַ/מִּזְבֵּ֔חַ וַ/יִּתֵּ֕ן אֶת מָסַ֖ךְ שַׁ֣עַר הֶ/חָצֵ֑ר וַ/יְכַ֥ל מֹשֶׁ֖ה אֶת הַ/מְּלָאכָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: pt
  text: Depois levantou o pátio ao redor do tabernáculo e do altar, e colocou a cortina da entrada do pátio. Assim, Moisés terminou a obra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: levantou
  rationale: No contexto da montagem do santuário, o hifil de קום significa erguer ou montar. “Levantou” é natural e mantém a imagem concreta do texto.
- source_word: הֶחָצֵר
  choice: o pátio
  rationale: חָצֵר designa o recinto externo que cercava o tabernáculo. “Pátio” é claro e corrente em português.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa que o pátio circundava o tabernáculo e o altar.
- source_word: לַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: “Tabernáculo” preserva o termo técnico consagrado para a tenda-santuário em Êxodo.
- source_word: וְלַמִּזְבֵּחַ
  choice: e do altar
  rationale: Tradução direta de מִזְבֵּחַ, coordenado com o tabernáculo como elemento cercado pelo pátio.
- source_word: וַיִּתֵּן
  choice: colocou
  rationale: נתן tem o sentido básico de pôr ou colocar; aqui descreve a instalação da cortina na entrada.
- source_word: מָסַךְ
  choice: a cortina
  rationale: מָסַךְ designa uma peça têxtil que fechava a entrada. “Cortina” comunica isso com clareza e a distingue de uma porta rígida.
- source_word: שַׁעַר הֶחָצֵר
  choice: da entrada do pátio
  rationale: Embora שַׁעַר possa ser “portão”, neste contexto a abertura era fechada por uma peça de tecido; “entrada” evita sugerir uma estrutura rígida.
- source_word: וַיְכַל
  choice: terminou
  rationale: כלה assinala a conclusão integral da tarefa de construção.
- source_word: הַמְּלָאכָה
  choice: a obra
  rationale: מְלָאכָה resume todo o trabalho de construção. “A obra” é digna, natural e adequada ao motivo narrativo de conclusão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das ações e a conclusão enfática do hebraico foram preservadas; evitou-se vocabulário excessivamente técnico, exceto pelo termo cultual estabelecido “tabernáculo”.
