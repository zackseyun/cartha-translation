base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: pt
  text: E aconteceu que, no primeiro mês do segundo ano, no primeiro dia do mês[a], o tabernáculo foi erguido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no um do mês”. Trata-se de uma expressão hebraica para o primeiro dia do mês.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi levantado” ou “foi instalado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: A forma narrativa de היה com waw faz avançar o relato. A expressão mantém essa progressão em português atual, sem recorrer a uma fórmula arcaica.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro mês
  rationale: חֹדֶשׁ designa normalmente um mês em contextos de calendário, e o artigo com o ordinal indica uma data específica.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: do segundo ano
  rationale: A expressão especifica o ano da data; ligada a “primeiro mês”, a formulação “do segundo ano” é clara e natural em português.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: A expressão hebraica significa literalmente “no um do mês” e funciona idiomaticamente como indicação do primeiro dia.
- source_word: הוּקַם
  choice: foi erguido
  rationale: O hofal de קום tem sentido passivo causativo, indicando que o santuário foi posto de pé ou instalado. “Foi erguido” preserva essa imagem e se ajusta ao contexto.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן refere-se aqui ao santuário portátil descrito em Êxodo. “Tabernáculo” é o termo português consagrado e mantém a especificidade cultual.
