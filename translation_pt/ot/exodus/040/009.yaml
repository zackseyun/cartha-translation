  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: pt
  text: Depois, pegue o óleo da unção e unja o tabernáculo e tudo o que nele há; consagre-o e todos os seus utensílios, e ele será santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “santo”, não “santíssimo”.'
    reason: Evita que a tradução seja indevidamente intensificada com base em formulações de outros versículos ou na tradição.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Depois, pegue
  rationale: O perfeito qal com conjunção integra uma sequência de instruções e tem força diretiva. “Depois” explicita a progressão do procedimento, e o imperativo “pegue” soa natural em português atual.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: Reproduz com clareza a construção hebraica e mantém sua especificidade ritual.
- source_word: וּמָשַׁחְתָּ
  choice: e unja
  rationale: No contexto cultual, משׁח designa a aplicação ritual de óleo para dedicar algo ao uso sagrado.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É a designação portuguesa tradicional, precisa e amplamente compreensível para o santuário móvel no deserto.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: tudo o que nele há
  rationale: Expressa de modo abrangente e natural todo o conteúdo do tabernáculo.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: Consagre-o
  rationale: O piel de קדשׁ indica separar ou dedicar para condição e uso santos. “Consagrar” comunica bem esse sentido cultual sem paráfrase excessiva.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: com todos os seus utensílios
  rationale: כֵּלִים abrange os objetos e implementos pertencentes ao tabernáculo. “Utensílios” é corrente no contexto do santuário e evita limitar a expressão a móveis.
- source_word: וְהָיָה קֹדֶשׁ
  choice: e ele será santo
  rationale: A oração resultativa declara a condição santa do tabernáculo após a consagração. O singular masculino “ele” retoma naturalmente “tabernáculo”.
theological_decisions:
- issue: Grau de santidade atribuído ao tabernáculo
  choice: será santo
  alternative: será santíssimo
  rationale: O texto hebraico traz apenas קֹדֶשׁ, “santo”, e não a expressão superlativa קֹדֶשׁ קָדָשִׁים, “santíssimo”. A tradução não acrescenta uma intensidade tomada de passagens próximas ou da tradição.
- issue: Efeito da unção e da consagração
  choice: A consagração resulta na condição santa do tabernáculo.
  alternative: A unção é descrita apenas como cerimônia simbólica, sem relação expressa com sua condição santa.
  rationale: A sequência sintática liga os atos ordenados à declaração resultativa “será santo”, sem desenvolver além disso uma teoria sobre a eficácia do rito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Os imperativos refletem a força instrutiva da sequência hebraica; a terminologia cultual tradicional foi mantida onde permanece corrente.
