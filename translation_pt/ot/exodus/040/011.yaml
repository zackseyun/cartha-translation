  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: pt
  text: Você ungirá a bacia e o seu suporte[a] e a consagrará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “base”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a tornará santa” ou “a santificará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Você ungirá
  rationale: No contexto ritual, משׁח designa a unção com óleo para dedicar algo ao serviço sagrado. O futuro com valor de instrução mantém a sequência normativa e soa natural em português.
- source_word: הַכִּיֹּר
  choice: a bacia
  rationale: כִּיּוֹר designa a grande bacia usada no serviço do tabernáculo. “Bacia” é claro e atual, ao contrário do tradicional “lavatório”, que pode sugerir uma instalação moderna.
- source_word: כַּנּוֹ
  choice: o seu suporte
  rationale: כֵּן indica aqui a estrutura que sustenta a bacia. “Suporte” expressa essa função com clareza; “base” também é possível.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: e a consagrará
  rationale: No Piel e neste contexto cultual, קדשׁ significa separar para uso santo, isto é, consagrar. O pronome singular é vertido no feminino por concordar em português com “bacia”, entendida como o móvel principal com seu suporte.
theological_decisions:
- issue: Sentido de קדשׁ no contexto cultual do tabernáculo
  choice: consagrará
  alternative: tornará santa / santificará
  rationale: “Consagrará” comunica a separação ritual do objeto para o serviço sagrado, sem sugerir transformação moral nem introduzir uma formulação doutrinária posterior.
- issue: Referente do pronome singular אֹתוֹ
  choice: a bacia, como móvel principal que inclui seu suporte
  alternative: cada uma das duas peças separadamente
  rationale: O hebraico usa um objeto singular depois de mencionar a bacia e seu suporte. A tradução preserva o singular, sem explicitar além do texto se a consagração recai sobre a bacia isoladamente ou sobre o conjunto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. “Você” torna explícito o destinatário singular do verbo hebraico; a repetição do sujeito antes do segundo verbo foi evitada para maior naturalidade.
