  text: וַ/יָּ֛שֶׂם אֶת מִזְבַּ֥ח הַ/זָּהָ֖ב בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵ֖י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: pt
  text: E pôs o altar de ouro na tenda do encontro, diante do véu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da cortina”. O termo hebraico se refere à divisória interna do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: E pôs
  rationale: O wayyiqtol de שׂוּם dá continuidade à sequência narrativa no passado. “Pôs” é natural e direto em português, sem acrescentar uma nuance ausente no hebraico.
- source_word: מִזְבַּח הַזָּהָב
  choice: o altar de ouro
  rationale: A construção hebraica significa literalmente “altar do ouro”. “Altar de ouro” é idiomático em português e preserva a formulação nominal do original.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: אֹהֶל מוֹעֵד é a designação regular da estrutura do santuário. “Tenda do encontro” comunica de modo claro e fiel a ideia de encontro associada a מוֹעֵד.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A preposição indica a posição espacial do altar em relação ao véu. “Diante de” é conciso, natural e apropriado à descrição do santuário.
- source_word: הַפָּרֹכֶת
  choice: o véu
  rationale: פָּרֹכֶת designa a divisória interna de tecido do tabernáculo. “Véu” é preciso no contexto cultual e preserva sua ressonância bíblica, embora “cortina” também seja possível.
theological_decisions:
- issue: Terminologia cultual para הַפָּרֹכֶת
  choice: o véu
  alternative: a cortina
  rationale: “Véu” mantém a relevância intertextual da divisória do santuário sem ultrapassar o sentido concreto do termo hebraico. A alternativa lexical legítima é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa direta. “Tenda do encontro” favorece compreensão ampla e mantém a terminologia do santuário próxima do hebraico.
