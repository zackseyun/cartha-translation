  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: pt
  text: Depois, faça Arão e seus filhos se aproximarem da entrada da tenda do encontro e lave-os com água.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: faça ... se aproximarem
  rationale: O hifil de קרב expressa a ideia causativa de fazer alguém chegar perto. Esta formulação preserva esse valor e soa natural em português.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico designa os filhos homens de Arão, coerentemente com o contexto sacerdotal.
- source_word: פֶּתַח
  choice: entrada
  rationale: Termo corrente e preciso para o ponto de acesso à tenda.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente do nome do santuário, preservando a ideia de encontro expressa por מוֹעֵד.
- source_word: וְרָחַצְתָּ
  choice: lave-os
  rationale: רחץ significa lavar; a escolha evita especificar indevidamente o modo da lavagem ritual.
- source_word: אֹתָם
  choice: -os
  rationale: O pronome retoma conjuntamente Arão e seus filhos.
- source_word: בַּמָּיִם
  choice: com água
  rationale: 'A preposição ב tem aqui sentido instrumental: a água é o meio empregado na lavagem.'
