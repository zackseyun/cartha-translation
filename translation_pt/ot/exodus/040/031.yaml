  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: pt
  text: Da bacia, Moisés, Arão e seus filhos lavaram as mãos e os pés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com ela»; o hebraico diz mais literalmente «dela», referindo-se à bacia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: lavaram
  rationale: O wayyiqtol de רחץ apresenta uma ação passada na sequência narrativa; o pretérito perfeito é natural em português. O versículo seguinte explicita a circunstância recorrente.
- source_word: מִמֶּנּוּ
  choice: Dela
  rationale: 'A preposição מן com sufixo masculino singular indica mais naturalmente a origem: literalmente, «dela», retomando a bacia, substantivo feminino em português.'
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְאַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome em português; a conjunção integra a enumeração de modo natural.
- source_word: וּבָנָיו
  choice: e seus filhos
  rationale: בנים designa aqui os filhos homens de Arão no contexto sacerdotal. O sufixo singular se refere naturalmente a Arão.
- source_word: אֶת יְדֵיהֶם
  choice: as mãos
  rationale: Tradução direta do objeto plural; o referente possessivo já fica claro pelo sujeito composto.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: e os pés
  rationale: Tradução direta, preservando o par de partes do corpo especificado no hebraico.
