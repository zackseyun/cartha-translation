  yaml_path: translation/ot/exodus/040/008.yaml
  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: pt
  text: E você montará o pátio ao redor e colocará a cortina da entrada do pátio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: E você colocará
  rationale: שׂים tem o sentido amplo de pôr ou colocar. Aqui, “colocará” expressa de modo natural a disposição do pátio, sem acrescentar ao verbo a ideia específica de erguer.
- source_word: הֶחָצֵר
  choice: o pátio
  rationale: חָצֵר designa o recinto aberto que circundava o santuário. “Pátio” é claro, corrente e adequado ao contexto do tabernáculo.
- source_word: סָבִיב
  choice: ao redor
  rationale: O advérbio indica que o pátio devia circundar o tabernáculo. “Ao redor” preserva essa relação espacial de forma concisa.
- source_word: וְנָתַתָּ
  choice: e instalará
  rationale: Embora נתן normalmente signifique dar ou pôr, com a cortina da entrada o contexto pede a ideia de colocá-la em sua posição; “instalará” comunica isso naturalmente.
- source_word: מָסַךְ
  choice: a cortina
  rationale: מָסָךְ, no vocabulário do tabernáculo, é uma peça suspensa de tecido que fecha ou resguarda uma entrada. “Cortina” descreve melhor esse objeto em português corrente do que “tela” ou “biombo”.
- source_word: שַׁעַר
  choice: a entrada
  rationale: שַׁעַר pode significar portão ou entrada. Como não se trata de uma porta rígida, “entrada” evita sugerir uma estrutura diferente da cortina mencionada.
- source_word: הֶחָצֵר
  choice: do pátio
  rationale: Na construção שַׁעַר הֶחָצֵר, o substantivo identifica a entrada pertencente ao pátio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. O futuro mantém a força instrutiva da sequência hebraica. Preferiu-se “pátio” a “átrio” por sua maior acessibilidade, e “entrada” a “portão” para não sugerir uma folha rígida onde o texto menciona uma cortina.
