  text: בְּ/יוֹם הַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ תָּקִ֕ים אֶת מִשְׁכַּ֖ן אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: pt
  text: No primeiro dia do primeiro mês, você deverá montar o tabernáculo, a tenda do encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “o tabernáculo da tenda do encontro”. O hebraico une dois termos para o santuário, que podem ser entendidos em aposição ou como uma expressão mais estreitamente ligada, semelhante a uma construção genitiva.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: No primeiro dia do primeiro mês
  rationale: A construção temporal com בְּ e a fórmula de data בְּאֶחָד לַחֹדֶשׁ indicam, em português idiomático, o primeiro dia do primeiro mês.
- source_word: תָּקִים
  choice: você deverá montar
  rationale: O hifil de קום significa fazer ficar de pé, erguer ou instalar. Neste contexto, “montar” descreve naturalmente a instalação do santuário portátil, enquanto “deverá” expressa a força da instrução.
- source_word: מִשְׁכַּן
  choice: tabernáculo
  rationale: É o termo tradicional e reconhecível para a estrutura sagrada portátil de Êxodo, preservando sua função cultual.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: A expressão designa o lugar de encontro marcado entre Deus e seu povo. “Tenda do encontro” é clara, natural e semanticamente próxima do hebraico.
theological_decisions:
- issue: Relação entre מִשְׁכַּן e אֹהֶל מוֹעֵד
  choice: 'Aposição: “o tabernáculo, a tenda do encontro”'
  alternative: 'Expressão semelhante a uma construção genitiva: “o tabernáculo da tenda do encontro”'
  rationale: O hebraico coloca lado a lado duas designações do santuário sem explicitar a relação sintática. A aposição comunica com clareza que ambas caracterizam a mesma estrutura, enquanto a nota preserva a possibilidade de uma ligação mais estreita entre os termos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você deverá” torna explícita a força instrutiva da forma verbal sem recorrer a uma formulação excessivamente arcaica; “montar” é natural para uma estrutura portátil.
