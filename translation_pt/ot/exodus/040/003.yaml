  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: pt
  text: Coloque ali a arca do testemunho[a] e oculte a arca com a cortina[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções tradicionais trazem aqui «arca da aliança», mas o hebraico diz literalmente «arca do testemunho».
    reason: alternative_reading
  - marker: b
    text: Ou «véu». O termo hebraico se refere à cortina interna do santuário que ocultava a arca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Coloque
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força de ordem dirigida a Moisés. O imperativo é natural e claro em português moderno.
- source_word: שָׁם
  choice: ali
  rationale: Preserva a referência dêitica ao local anteriormente mencionado, sem explicitar além do texto hebraico.
- source_word: אֲרוֹן הָעֵדוּת
  choice: a arca do testemunho
  rationale: Reproduz o hebraico literalmente quanto ao termo עֵדוּת, sem harmonizá-lo com a expressão mais conhecida «arca da aliança».
- source_word: וְסַכֹּתָ
  choice: e oculte
  rationale: O verbo סכך pode significar cobrir, resguardar ou encobrir. Aqui a cortina funciona como anteparo, ocultando a arca, e não como tecido colocado diretamente sobre ela.
- source_word: עַל הָאָרֹן
  choice: a arca
  rationale: Embora עַל tenha sentido básico de «sobre», em combinação com סכך e neste arranjo espacial indica que a arca fica encoberta por meio da cortina. A construção transitiva é idiomática em português.
- source_word: הַפָּרֹכֶת
  choice: a cortina
  rationale: פָּרֹכֶת designa a cortina interna do santuário que separava a arca. «Cortina» é acessível em português moderno; «véu» permanece como alternativa tradicional em nota.
theological_decisions:
- issue: Terminologia da arca
  choice: arca do testemunho
  alternative: arca da aliança
  rationale: O texto hebraico deste versículo diz explicitamente «testemunho». A tradução evita substituir essa formulação pela expressão tradicional mais conhecida, preservando a associação lexical própria do original.
- issue: Tradução de פָּרֹכֶת
  choice: cortina
  alternative: véu
  rationale: «Cortina» comunica com clareza a função arquitetônica do objeto. «Véu», de forte tradição bíblica e ressonância teológica, é mantido em nota sem ser imposto ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais para a sequência de instruções. Conserva a terminologia concreta do santuário e evita formas arcaicas como «porás» e «encobrirás».
