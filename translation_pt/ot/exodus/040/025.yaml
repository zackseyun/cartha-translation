  text: וַ/יַּ֥עַל הַ/נֵּרֹ֖ת לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: E dispôs as lâmpadas diante de Yahweh[a], exatamente como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “fez subir as lâmpadas”; neste contexto, a expressão pode referir-se a dispor ou acender as lâmpadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: dispôs
  rationale: O hifil de עלה significa literalmente “fez subir”. No contexto das lâmpadas do santuário, a expressão pode indicar que elas foram colocadas ou preparadas no candelabro e também pode aludir ao ato de acendê-las. “Dispôs” comunica a ação ritual com naturalidade sem excluir silenciosamente essa ambiguidade.
- source_word: הַנֵּרֹת
  choice: as lâmpadas
  rationale: נֵרֹת designa as lâmpadas concretas do candelabro, e não a luz em sentido abstrato.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” preserva o sentido espacial e cultual de לִפְנֵי e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: A expressão introduz a plena conformidade da ação de Moisés com a ordem recebida.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa claro que a ordem de Yahweh precedeu seu cumprimento narrado neste versículo.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Embora אֶת marque o objeto direto em hebraico, o verbo português “ordenar”, neste uso, rege naturalmente a preposição “a” para indicar a pessoa que recebeu a ordem.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto e evita substituí-lo por um título.
- issue: Natureza da ação realizada com as lâmpadas
  choice: dispôs, com nota explicativa
  alternative: acendeu
  rationale: A expressão hebraica pode referir-se à colocação ou preparação das lâmpadas e, neste contexto cultual, também ao seu acendimento. O texto principal evita decidir além do que a formulação hebraica exige, e a nota conserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural para brasileiros. “Diante de” mantém o tom cultual; “exatamente como” expressa de modo corrente a conformidade precisa com a ordem divina.
