lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: E pôs
  rationale: O verbo שׂוּם significa pôr, colocar ou estabelecer. “Pôs” reproduz de modo direto e natural a ação de posicionar a cortina.
- source_word: מָסַךְ
  choice: a cortina
  rationale: No contexto do tabernáculo, מָסָךְ designa uma peça de tecido suspensa que fechava uma entrada. “Cortina” é claro em português e evita confundi-la com o véu interior (פָּרֹכֶת).
- source_word: הַפֶּתַח
  choice: na entrada
  rationale: פֶּתַח denota abertura ou entrada; “na entrada” expressa naturalmente o lugar onde a cortina foi posta.
- source_word: לַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: O ל prefixado vincula o substantivo à entrada, formando em português a expressão natural “entrada do tabernáculo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário tradicional bíblico. “Cortina” comunica de forma mais imediata que “reposteiro” ou “tela”, sem apagar a função de divisória da peça.
