  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: pt
  text: E pôs a cortina da entrada do tabernáculo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cortina na entrada do tabernáculo”.'
