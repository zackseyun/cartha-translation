base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: pt
  text: Aproxime também os filhos dele e vista-os com túnicas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresente os filhos dele” ou “traga os filhos dele para perto”. O verbo hebraico muitas vezes tem o sentido formal e cultual de aproximar alguém para o serviço sagrado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: também
  rationale: A conjunção, seguida do marcador de objeto direto, introduz a instrução seguinte e acrescenta os filhos de Arão à ação anterior; em português, o marcador não é traduzido separadamente.
- source_word: בָּנָיו
  choice: os filhos dele
  rationale: O substantivo designa especificamente filhos do sexo masculino. A forma com “dele” é clara e natural no contexto, evitando possível ambiguidade de “seus filhos”.
- source_word: תַּקְרִיב
  choice: Faça ... se aproximarem
  rationale: O hifil de קרב tem sentido causativo, “fazer chegar perto” ou “aproximar”, frequentemente com nuance formal e cultual. Esta formulação preserva essa nuance em português corrente.
- source_word: וְהִלְבַּשְׁתָּ
  choice: e vista-os
  rationale: O verbo expressa fazer alguém usar uma roupa. “Vista-os” conserva o sentido causativo de modo conciso e natural.
- source_word: אֹתָם
  choice: -os
  rationale: Pronome de objeto direto retomando os filhos de Arão, incorporado naturalmente ao verbo em português.
- source_word: כֻּתֳּנֹת
  choice: com túnicas
  rationale: O termo designa vestes corporais do tipo túnica. “Túnicas” é preciso no contexto sacerdotal; o material não é especificado neste versículo e, portanto, não foi acrescentado.
theological_decisions:
- issue: Nuance sacerdotal ou cultual de קרב
  choice: Faça ... se aproximarem
  alternative: Apresente os filhos dele / faça os filhos dele chegarem à frente
  rationale: O contexto é a investidura sacerdotal dos filhos de Arão. “Fazer se aproximarem” mantém a imagem e a formalidade cultual do hebraico sem definir além do texto exatamente de quem ou de que eles se aproximam.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para soar natural, preservando a sequência das instruções e a nuance cultual.
