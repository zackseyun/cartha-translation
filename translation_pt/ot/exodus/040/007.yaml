base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: pt
  text: Coloque a bacia[a] entre a tenda do encontro e o altar e ponha água ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, כִּיּוֹר também é traduzido como “lavatório”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Coloque
  rationale: O verbo נָתַן tem sentido amplo de dar, pôr ou colocar. Neste contexto espacial, com um utensílio do santuário como objeto, “coloque” expressa de modo natural e preciso o posicionamento deliberado.
- source_word: הַכִּיֹּר
  choice: a bacia
  rationale: כִּיּוֹר designa uma bacia usada para lavagem no serviço do tabernáculo. “Bacia” é claro e atual; “lavatório” é uma alternativa tradicional, mas pode sugerir uma instalação moderna.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: entre a tenda do encontro e o altar
  rationale: A construção בֵּין...וּבֵין indica o espaço entre dois elementos. “Tenda do encontro” traduz de maneira transparente אֹהֶל מוֹעֵד, e “altar” corresponde diretamente a מִזְבֵּחַ.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: e ponha água ali
  rationale: A ordem hebraica é literalmente “e porás ali água”. “Ponha água ali” conserva שָׁם e soa natural em português, sem acrescentar explicitamente “nela”, que não aparece no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa natural para a instrução hebraica dirigida a Moisés. Mantém-se “ali” em vez de explicitar “nela”, preservando a formulação do texto-fonte.
