  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: pt
  text: Ele colocou a bacia[a] entre a tenda do encontro e o altar e pôs ali água para lavar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções tradicionais usam “pia” para o hebraico הַכִּיּוֹר. O termo se refere a uma grande bacia destinada às lavagens; “bacia” é usado aqui por ser mais claro no português atual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ele colocou
  rationale: O verbo שׂוּם indica pôr ou posicionar algo; “colocou” é natural e expressa adequadamente a instalação da bacia.
- source_word: הַכִּיֹּר
  choice: a bacia
  rationale: כִּיּוֹר designa a grande bacia usada para lavagens no santuário. “Bacia” é claro em português moderno, ao contrário de termos tradicionais menos correntes.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: entre a tenda do encontro e o altar
  rationale: A expressão אֹהֶל מוֹעֵד é traduzida diretamente como “tenda do encontro”; a construção hebraica repetida בֵּין...וּבֵין corresponde naturalmente a “entre... e...” em português.
- source_word: וַיִּתֵּן
  choice: e pôs
  rationale: Neste contexto, נָתַן significa pôr ou colocar. “Pôs” evita repetição imediata de “colocou” e combina naturalmente com água.
- source_word: שָׁמָּה
  choice: ali
  rationale: O advérbio significa “ali/lá”. “Ali” preserva a referência locativa do hebraico sem substituí-la pela explicitação interpretativa “nela”.
- source_word: מַיִם
  choice: água
  rationale: Tradução direta do substantivo hebraico, empregado aqui com sentido coletivo.
- source_word: לְרָחְצָה
  choice: para as lavagens
  rationale: O infinitivo de רָחַץ expressa finalidade. A formulação mantém indeterminado quem se lavaria, sem acrescentar “os sacerdotes” nem um reflexivo ausente neste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A locução “tenda do encontro” mantém de modo direto a designação hebraica, e “para as lavagens” preserva a finalidade sem explicitar participantes não mencionados no texto.
