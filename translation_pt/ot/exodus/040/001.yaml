lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: A forma verbal com waw consecutivo dá continuidade à narrativa. “Então” expressa a sequência, e “falou” traduz naturalmente דבר nesta fórmula de introdução da fala divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; “a Moisés” é uma formulação natural e digna em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula, o infinitivo introduz o conteúdo da fala. Em português atual, os dois-pontos cumprem essa função com naturalidade e evitam o pouco idiomático “dizendo” antes de uma citação extensa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva o nome por transliteração, enquanto a nota registra a forma hebraica e a transliteração alternativa sem substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos introduzem de modo idiomático a fala que começa no versículo seguinte.
