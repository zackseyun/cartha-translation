base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Levou a arca para dentro do tabernáculo, colocou o véu de anteparo[a] e ocultou a arca do testemunho[b], exatamente como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cortina de separação” ou “o véu de separação”. O hebraico combina a designação do véu com um termo que destaca sua função como anteparo ou tela.
    reason: lexical_alternative
  - marker: b
    text: Ou “cobriu” ou “resguardou a arca do testemunho”. O verbo hebraico indica que a arca foi coberta ou ocultada pela cortina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Levou ... para dentro
  rationale: O hifil de בוא indica fazer entrar; a expressão portuguesa comunica naturalmente que Moisés introduziu a arca no santuário.
- source_word: הָאָרֹן
  choice: a arca
  rationale: No contexto cultual de Êxodo, אָרוֹן designa a arca sagrada, não um baú comum.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo consagrado e amplamente compreensível para o santuário portátil de Israel.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: o véu de separação
  rationale: פָּרֹכֶת designa o véu interior, e מָסָךְ destaca sua função de anteparo; a formulação preserva os dois aspectos em português natural.
- source_word: וַיָּשֶׂם
  choice: colocou
  rationale: שׂים significa pôr ou colocar; aqui descreve a instalação do véu em seu lugar.
- source_word: וַיָּסֶךְ עַל
  choice: e, com ele, ocultou
  rationale: O verbo indica cobrir, ocultar ou resguardar por meio do véu. A explicitação pronominal identifica o meio sem alterar o sentido.
- source_word: אֲרוֹן הָעֵדוּת
  choice: a arca do testemunho
  rationale: Mantém a designação cultual hebraica e sua associação com as tábuas do testemunho, sem expansão interpretativa.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exatamente como Yahweh havia ordenado a Moisés
  rationale: Reproduz a fórmula recorrente que ressalta a correspondência entre a ordem divina e a execução por Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de אֲרוֹן הָעֵדוּת
  choice: arca do testemunho
  alternative: arca da aliança; arca do documento da aliança
  rationale: “Testemunho” preserva a terminologia do hebraico e não identifica de modo interpretativo o conteúdo além do que a expressão declara.
translation_notes:
  register: Português atual, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos. “Tabernáculo”, “arca” e “testemunho” preservam a terminologia bíblica reconhecível; as notas registram a amplitude lexical ligada ao véu e à ação de ocultar.
