revisions:
- from: Levou a arca para dentro do tabernáculo, colocou o véu de separação[a] e, com ele, ocultou a arca do testemunho[b], exatamente como Yahweh havia ordenado a Moisés.
  to: Levou a arca para dentro do tabernáculo, colocou o véu de anteparo[a] e ocultou a arca do testemunho[b], exatamente como Yahweh havia ordenado a Moisés.
  rationale: A revisão conserva o sentido e o registro do rascunho, mas substitui «véu de separação» por «véu de anteparo», que representa mais precisamente a função indicada por מָסָךְ. Remove também a explicitação «com ele» e ajusta a nota b para não atribuir ao verbo uma ideia de proteção que não é explicitamente exigida pelo hebraico.
