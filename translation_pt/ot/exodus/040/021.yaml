    rationale: Embora seja contextualmente plausível que o véu seja o meio pelo qual a arca foi ocultada, o hebraico não requer essa inserção pronominal; omiti-la preserva melhor a concisão e a sequência do original.
  - severity: medium
    issue: A nota b acrescenta «protegida» como ênfase do verbo.
    rationale: וַיָּסֶךְ, neste contexto, descreve cobrir, ocultar ou separar por meio da cortina. A noção de proteção pode ser inferida da função cultual, mas não deve ser apresentada como o sentido enfatizado pelo verbo.
