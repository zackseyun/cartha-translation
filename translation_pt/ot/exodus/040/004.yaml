  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: pt
  text: Leve para dentro a mesa e disponha sobre ela o que lhe pertence. Depois, leve para dentro o candelabro e acenda as suas lâmpadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “instale as suas lâmpadas”. O verbo hebraico significa literalmente “fazer subir” e, em relação às lâmpadas, pode referir-se a fazer subir as chamas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: leve para dentro
  rationale: O hifil de בוא indica fazer entrar; no contexto da montagem do tabernáculo, a instrução é levar os utensílios para o interior da tenda. A formulação é natural e explicita o movimento implícito.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O substantivo significa simplesmente “mesa”. Sua função cultual é conhecida pelo contexto, mas não é explicitada neste versículo.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: disponha sobre ela o que lhe pertence
  rationale: A construção cognata com ערך descreve pôr em ordem a disposição prescrita da mesa. A tradução evita a repetição artificial “dispor a sua disposição” e mantém a referência aos itens que nela deviam ser colocados.
- source_word: הַמְּנֹרָה
  choice: o candelabro
  rationale: “Candelabro” traduz o substantivo comum e é amplamente compreensível em português, sem depender da transliteração “menorá”.
- source_word: וְהַעֲלֵיתָ
  choice: acenda
  rationale: O hifil de עלה, quando tem lâmpadas como objeto, pode significar fazer subir a chama, isto é, acendê-las. Essa leitura também se ajusta ao cumprimento da instrução em Êxodo 40:25; a possível nuance de instalar ou erguer as lâmpadas é preservada em nota.
- source_word: נֵרֹתֶיהָ
  choice: as suas lâmpadas
  rationale: נֵר designa uma lâmpada ou sua chama. Aqui o plural com sufixo feminino refere-se às lâmpadas pertencentes ao candelabro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais dirigidos a Moisés. “Leve para dentro” preserva o cenário de instalação no tabernáculo; “candelabro” favorece compreensão ampla, inclusive no uso brasileiro.
