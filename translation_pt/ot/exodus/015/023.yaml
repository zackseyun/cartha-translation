base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: pt
  text: Então chegaram a Mara[a], mas não puderam beber a água de Mara, porque era amarga. Por isso, aquele lugar recebeu o nome de Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mara corresponde à palavra hebraica para “amarga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então chegaram
  rationale: A forma narrativa faz a sequência avançar; “Então chegaram” expressa isso com naturalidade em português.
- source_word: מָרָתָה
  choice: a Mara
  rationale: O nome próprio vem com ה direcional; em português, o movimento é expresso naturalmente pela preposição “a”.
- source_word: וְלֹא יָכְלוּ
  choice: mas não puderam
  rationale: A conjunção introduz o contraste entre chegar ao lugar e não conseguir beber sua água.
- source_word: לִשְׁתֹּת מַיִם מִמָּרָה
  choice: beber a água de Mara
  rationale: A água é específica, e מִן indica aqui sua procedência; “a água de Mara” é claro e idiomático.
- source_word: כִּי מָרִים הֵם
  choice: porque era amarga
  rationale: Embora o predicativo hebraico esteja no plural em concordância com מַיִם, “água” é singular em português; mantém-se a relação causal de כִּי.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo atual e natural a inferência que introduz a explicação do nome.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: aquele lugar recebeu o nome de Mara
  rationale: O verbo não traz sujeito explícito e pode ter sentido impessoal. Esta formulação evita inserir uma pessoa não identificada e explicita naturalmente que o referente nomeado é o lugar.
- source_word: מָרָה / מָרִים
  choice: Mara / amarga
  rationale: Translitera-se o topônimo e traduz-se o adjetivo, preservando o jogo de palavras mediante nota.
