  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: pt
  text: Os carros de guerra do faraó e o seu exército ele lançou ao mar; e os melhores dos seus oficiais foram afundados no mar dos juncos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente traduzido como “mar Vermelho”. O hebraico diz “mar dos juncos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: carros de guerra
  rationale: O plural designa concretamente os carros militares do faraó; “carros de guerra” é claro em português moderno e evita a possível ambiguidade de “carros” isoladamente.
- source_word: פַּרְעֹה
  choice: faraó
  rationale: Forma tradicional e corrente em português para o título régio egípcio.
- source_word: וְחֵילוֹ
  choice: e o seu exército
  rationale: Neste contexto, חַיִל indica a força militar do faraó, não riqueza ou força em sentido geral.
- source_word: יָרָה
  choice: ele lançou
  rationale: O verbo exprime arremessar ou lançar. A formulação conserva a força da imagem poética e o sujeito divino implícito no contexto.
- source_word: בַיָּם
  choice: ao mar
  rationale: Com “lançou”, a construção portuguesa “ao mar” expressa de modo natural o movimento para dentro das águas.
- source_word: וּמִבְחַר
  choice: os melhores
  rationale: O termo denota os selecionados ou mais destacados; “os melhores” comunica esse valor seletivo em linguagem atual.
- source_word: שָׁלִשָׁיו
  choice: dos seus oficiais
  rationale: שָׁלִישׁ designa oficiais militares de alta posição, possivelmente ligados aos carros de guerra. “Oficiais” preserva a referência à patente sem especificar além da evidência.
- source_word: טֻבְּעוּ
  choice: foram afundados
  rationale: A forma passiva indica que foram submersos ou afundados; a tradução conserva tanto a voz passiva quanto a imagem, sem reduzi-la apenas à morte por afogamento.
- source_word: בְיַם סוּף
  choice: no mar dos Juncos
  rationale: A expressão hebraica significa literalmente “mar dos Juncos”. A tradução prioriza o sentido lexical do hebraico, deixando a forma tradicional para a nota.
theological_decisions:
- issue: Tradução de יַם סוּף
  choice: mar dos Juncos
  alternative: mar Vermelho
  rationale: A leitura principal segue diretamente o sentido da expressão hebraica. A designação tradicional “mar Vermelho” é registrada em nota para orientar o leitor sem substituir a evidência lexical do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “ele lançou” preserva a ênfase poética no agente já identificado pelo contexto. O ponto e vírgula mantém o paralelismo das duas linhas sem tornar o verso artificialmente solene.
