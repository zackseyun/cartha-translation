base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: pt
  text: Então Moisés clamou ao SENHOR, e o SENHOR lhe mostrou uma árvore. Ele a lançou nas águas, e as águas se tornaram doces. Ali estabeleceu para eles um estatuto e uma norma, e ali os pôs à prova.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵץ (ʿēṣ)
  choice: árvore
  rationale: O substantivo normalmente designa uma árvore ou madeira. O contexto permite ambas as ideias, mas, sem qualificação no hebraico, “árvore” conserva o sentido lexical direto e acompanha a evidência de consulta auditada.
- source_word: וַיִּמְתְּקוּ הַמָּיִם (wayyimteqû hammāyim)
  choice: as águas se tornaram doces
  rationale: Mantém a imagem hebraica de águas que passaram de amargas a doces, em vez de explicá-la apenas como “potáveis”.
- source_word: חֹק וּמִשְׁפָּט (ḥoq ûmišpāṭ)
  choice: um estatuto e uma norma
  rationale: “Estatuto” expressa uma determinação estabelecida; “norma” comunica aqui uma regra ou ordenança sem sugerir necessariamente uma sentença judicial.
- source_word: נִסָּהוּ (nissāhû)
  choice: os pôs à prova
  rationale: O verbo נסה significa testar ou provar. O sufixo singular coletivo retoma o povo, traduzido naturalmente no plural em português.
theological_decisions:
- issue: Sujeito dos verbos finais
  choice: Deixar o sujeito implícito, naturalmente entendido como o SENHOR
  alternative: Explicitar “o SENHOR estabeleceu... e os pôs à prova”
  rationale: O hebraico não expressa o sujeito nominal nessas orações. O contexto aponta para o SENHOR, mas a tradução preserva a forma concisa e a leve abertura sintática do original.
- issue: Identidade do que foi lançado nas águas
  choice: “árvore”, retomada por “a”
  alternative: “pedaço de madeira” ou “madeira”
  rationale: O texto não explica qualquer mecanismo nem atribui poder intrínseco ao objeto; a tradução evita acrescentar uma interpretação física ou sacramental.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência brasileira. “Águas” preserva o tom bíblico sem soar arcaico; “pôs à prova” é idiomático e fiel. O nome divino é vertido como SENHOR, conforme a convenção editorial indicada pela camada auditada.
