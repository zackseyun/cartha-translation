  text: וַ/תִּקַּח֩ מִרְיָ֨ם הַ/נְּבִיאָ֜ה אֲח֧וֹת אַהֲרֹ֛ן אֶת הַ/תֹּ֖ף בְּ/יָדָ֑/הּ וַ/תֵּצֶ֤אןָ כָֽל הַ/נָּשִׁים֙ אַחֲרֶ֔י/הָ בְּ/תֻפִּ֖ים וּ/בִ/מְחֹלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: pt
  text: Então Miriã, a profetisa, irmã de Arão, pegou o tamborim na mão, e todas as mulheres saíram atrás dela com tamborins, dançando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com danças”. O hebraico emprega um substantivo plural que pode ser expresso como a atividade de dançar ou, mais literalmente, como “danças”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Então ... pegou
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa com naturalidade a sequência, e “pegou” traduz o ato de tomar o instrumento.
- source_word: מִרְיָם
  choice: Miriã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַנְּבִיאָה
  choice: a profetisa
  rationale: O substantivo hebraico está explicitamente no feminino; “profetisa” é a forma portuguesa corrente e concisa.
- source_word: אֲחוֹת אַהֲרֹן
  choice: irmã de Arão
  rationale: Reproduz a identificação dada pelo hebraico, sem substituí-la por sua relação também conhecida com Moisés.
- source_word: הַתֹּף
  choice: o tamborim
  rationale: תֹף designa um instrumento de percussão portátil, provavelmente um tambor de moldura; “tamborim” é uma equivalência moderna clara, embora não determine com precisão sua construção antiga.
- source_word: בְּיָדָהּ
  choice: na mão
  rationale: Tradução direta e idiomática; o possessivo fica claro pelo sujeito feminino.
- source_word: וַתֵּצֶאןָ
  choice: saíram
  rationale: יצא significa sair; a forma verbal feminina plural concorda com “todas as mulheres”.
- source_word: כָל הַנָּשִׁים
  choice: todas as mulheres
  rationale: Preserva de modo direto o quantificador e a referência feminina explícita.
- source_word: אַחֲרֶיהָ
  choice: atrás dela
  rationale: Expressa naturalmente que as mulheres seguiram Miriã, possivelmente em forma de cortejo.
- source_word: בְּתֻפִּים
  choice: com tamborins
  rationale: Mantém a correspondência lexical com o singular תֹף e entende a preposição em sentido instrumental.
- source_word: וּבִמְחֹלֹת
  choice: dançando
  rationale: Expressa em português natural a atividade festiva indicada pelo substantivo plural מְחֹלֹת; a alternativa mais formalmente correspondente, “com danças”, é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das aposições preserva a apresentação hebraica de Miriã como profetisa e irmã de Arão. A vírgula antes de “dançando” deixa claro que a ação acompanha a saída das mulheres.
