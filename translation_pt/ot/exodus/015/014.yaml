  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: pt
  text: Os povos ouviram e tremeram[a]; a angústia apoderou-se dos habitantes da Filístia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os povos ouviram; estremecem. Um tremor apoderou-se dos habitantes da Filístia.” A poesia hebraica permite aqui um sentido vívido, semelhante ao presente ou ao futuro, além da leitura no passado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: ouviram
  rationale: O qal perfeito, terceira pessoa do plural, expressa diretamente “ouviram”; no contexto poético, o pretérito perfeito harmoniza-se com אָחַז.
- source_word: עַמִּים
  choice: os povos
  rationale: Preserva o plural e a referência coletiva aos grupos étnicos vizinhos, sem tornar o termo mais político com “nações”.
- source_word: יִרְגָּזוּ/ן
  choice: tremeram
  rationale: רָגַז pode indicar tremer, estremecer ou agitar-se. O pretérito oferece uma leitura natural na sequência poética, enquanto a nota preserva a possibilidade de sentido vívido presente ou prospectivo.
- source_word: חִיל
  choice: a angústia
  rationale: O substantivo pode denotar aflição intensa, contorção ou tremor. “Angústia” comunica sofrimento emocional e corporal sem impor uma imagem explícita de parto.
- source_word: אָחַז
  choice: apoderou-se de
  rationale: O verbo significa agarrar ou tomar posse de. A expressão portuguesa é natural com “angústia” como sujeito e mantém a ideia de domínio súbito.
- source_word: יֹשְׁבֵי
  choice: os habitantes de
  rationale: O particípio substantivado designa os residentes de um lugar; esta é uma formulação corrente e clara em português.
- source_word: פְּלָשֶׁת
  choice: Filístia
  rationale: É o nome próprio do território dos filisteus, não apenas uma designação do povo.
theological_decisions:
- issue: Valor temporal da sequência verbal na poesia
  choice: 'Tradução principal no passado: “ouviram e tremeram”'
  alternative: “Os povos ouviram; estremecem” ou “Os povos ouvirão e tremerão”
  rationale: O perfeito inicial e o perfeito final favorecem uma apresentação retrospectiva em português, mas o imperfeito יִרְגָּזוּ pode produzir um efeito vívido ou prospectivo. A nota mantém essa tensão poética sem fixar uma cronologia teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Filístia” conserva o topônimo tradicional; “apoderou-se” mantém a força poética sem soar arcaico. A coordenação “ouviram e tremeram” é natural em português, embora a pontuação hebraica também permita duas orações justapostas.
