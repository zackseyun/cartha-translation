  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: pt
  text: Quem é como tu entre os deuses, ó SENHOR? Quem é como tu, majestoso em santidade, temível em louvores, que faz maravilhas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: entre os deuses
  rationale: Reproduz diretamente o plural hebraico אֵלִם e preserva a afirmação comparativa do cântico sem redefinir explicitamente a natureza desses seres.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o tetragrama por SENHOR em versaletes.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: majestoso em santidade
  rationale: Expressa o particípio נֶאְדָּר como majestade ou glória e mantém a ligação direta com a santidade.
- source_word: נוֹרָא תְהִלֹּת
  choice: temível em louvores
  rationale: 'Mantém a formulação compacta e incomum do hebraico: נוֹרָא indica alguém que inspira temor reverente, enquanto תְהִלֹּת é o plural ''louvores''.'
- source_word: עֹשֵׂה פֶלֶא
  choice: autor de maravilhas
  rationale: Comunica naturalmente o particípio 'aquele que faz' e o substantivo coletivo ou singular פֶלֶא, sem limitar a referência a apenas um ato maravilhoso.
theological_decisions:
- issue: A referência a outros אֵלִם
  choice: entre os deuses
  alternative: entre os poderosos
  rationale: A tradução conserva a leitura lexical mais direta e a retórica de incomparabilidade de YHWH, sem acrescentar uma explicação ontológica ausente do verso.
- issue: A expressão נוֹרָא תְהִלֹּת
  choice: temível em louvores
  alternative: digno de reverência entre os que te louvam
  rationale: A opção escolhida preserva a tensão e a concisão do texto hebraico, evitando resolver uma construção semanticamente difícil por meio de paráfrase.
translation_notes:
  register: Português moderno, solene e acessível, com paralelismo poético preservado. A construção incomum 'temível em louvores' é mantida deliberadamente por sua proximidade ao hebraico e por não eliminar sua ambiguidade.
