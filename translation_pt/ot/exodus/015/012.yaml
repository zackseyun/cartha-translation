  text: נָטִ֨יתָ֙ יְמִ֣ינְ/ךָ֔ תִּבְלָעֵ֖/מוֹ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: pt
  text: Estendeste a tua mão direita; a terra[a] os engoliu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o solo os engoliu” ou “o chão os engoliu”.
    reason: alternativa lexical
lexical_decisions:
- source_word: נָטִיתָ
  choice: Estendeste
  rationale: O qal perfeito na segunda pessoa masculina singular dirige-se diretamente a Deus. “Estendeste” é natural e preserva a ação concreta do hebraico.
- source_word: יְמִינְךָ
  choice: a tua mão direita
  rationale: Mantém a expressão corporal concreta do hebraico e sua imagem poética, sem substituí-la pela interpretação abstrata “teu poder”.
- source_word: תִּבְלָעֵמוֹ
  choice: os engoliu
  rationale: Preserva a metáfora vívida de בלע. O sufixo indica o objeto masculino plural, enquanto “a terra” é o sujeito feminino singular.
- source_word: אָרֶץ
  choice: a terra
  rationale: “Terra” expressa bem a imagem dramática e admite, no contexto, os sentidos próximos de “solo” ou “chão”.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Manter “a tua mão direita”
  alternative: teu poder; teu braço poderoso
  rationale: A poesia hebraica apresenta a ação de Deus por meio dessa imagem concreta. Conservá-la mantém sua força literária e teológica sem explicá-la de modo excessivo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com forma verbal na segunda pessoa para refletir o discurso direto a Deus e preservar o tom poético.
