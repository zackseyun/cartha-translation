id: EXO.15.16
reference: Exodus 15:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: pt
  text: Terror e pavor cairão sobre eles; pela grandeza do teu braço, ficarão imóveis como pedra[a], até que passe o teu povo, ó Yahweh, até que passe este povo[b] que adquiriste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficarão em silêncio” ou “ficarão sem se mover”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até que o teu povo atravesse... até que este povo atravesse”.'
    reason: lexical_alternative
  - marker: c
    text: “Adquiriste” também pode ser traduzido por “compraste” ou, em sentido mais amplo de pertencimento, “fizeste teu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: Terror e pavor cairão sobre eles
  rationale: A formulação conserva os dois termos hebraicos quase sinônimos e a imagem de algo que cai sobre as nações. O plural é a concordância natural em português com o sujeito composto.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: pela grandeza do teu braço
  rationale: Mantém tanto a relação de meio ou causa expressa por בְּ quanto a metáfora bíblica do braço como manifestação de poder.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: ficarão imóveis como pedra
  rationale: No contexto, a comparação com pedra favorece a ideia de imobilidade, embora o verbo também possa indicar silêncio; a nota preserva essa amplitude lexical.
- source_word: עַד יַעֲבֹר
  choice: até que passe
  rationale: Reproduz a repetição poética do hebraico e não restringe o movimento a uma travessia de água; 'atravesse' permanece uma alternativa possível.
- source_word: עַמְּךָ / עַם זוּ
  choice: o teu povo / este povo
  rationale: Preserva a relação expressa pelo possessivo e a força demonstrativa de זוּ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: קָנִיתָ
  choice: adquiriste
  rationale: Expressa o sentido básico e amplo de קנה sem impor uma acepção mais específica como 'redimiste' ou 'criaste'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR / Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; 'Yahweh' preserva o caráter de nome pessoal.
- issue: Sentido de קָנִיתָ na relação entre Yahweh e Israel
  choice: que adquiriste
  alternative: que compraste / que fizeste teu
  rationale: '''Adquiriste'' mantém a amplitude do verbo hebraico e sua possível dimensão de pertencimento pactual sem convertê-lo, de modo indevido, em um termo técnico de redenção.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa coerentes com a linguagem poética dirigida a Deus. A ordem e a repetição do hebraico foram preservadas sempre que permaneceram naturais em português.
