  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: pt
  text: Tu os farás entrar e os plantarás no monte da tua herança[a] — o lugar, Yahweh, que fizeste para tua habitação, o santuário, Senhor[b], que tuas mãos estabeleceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “monte da tua herança” pode referir-se amplamente à terra em que Deus estabeleceria seu povo ou, mais especificamente, ao monte do santuário de Deus. “Plantarás” conserva a imagem hebraica de estabelecimento seguro.
    reason: alternative_reading
  - marker: b
    text: O hebraico traz neste verso tanto o nome divino Yahweh quanto o título “Senhor”.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Tu os farás entrar
  rationale: O hifil de בוא com sufixo de terceira pessoa masculina plural expressa movimento causativo para dentro de um lugar. “Farás entrar” preserva essa força e combina com o tratamento singular dirigido a Deus.
- source_word: וְתִטָּעֵמוֹ
  choice: e os plantarás
  rationale: נטע significa literalmente “plantar” e, aqui, retrata poeticamente o estabelecimento seguro do povo. A imagem concreta foi mantida em vez de ser reduzida a “estabelecer”.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: no monte da tua herança
  rationale: A formulação preserva a relação genitiva e a possível referência tanto ao território dado e possuído por Deus quanto, mais especificamente, ao monte do santuário, sem decidir entre elas.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: o lugar ... para tua habitação
  rationale: מָכוֹן designa um lugar estabelecido ou preparado. “Lugar” é natural em português moderno, enquanto “para tua habitação” conserva a finalidade expressa pelo hebraico.
- source_word: פָּעַלְתָּ
  choice: que fizeste
  rationale: פעל é um verbo amplo de fazer ou realizar. “Fizeste” é claro, direto e menos interpretativo do que “preparaste”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal e o distingue do título אֲדֹנָי, presente posteriormente no mesmo verso.
- source_word: מִקְּדָשׁ
  choice: o santuário
  rationale: מִקְדָּשׁ denota um lugar santo ou santuário. “Santuário” é o equivalente corrente e adequado ao contexto.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Aqui אֲדֹנָי funciona como título divino. “Senhor” mantém a distinção em relação ao nome Yahweh sem acrescentar o possessivo “meu”.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: que tuas mãos estabeleceram
  rationale: A forma poética de כון comunica fundar ou firmar. A expressão mantém tanto a ideia de estabelecimento duradouro quanto a imagem antropomórfica das mãos de Deus.
theological_decisions:
- issue: Representação de יְהוָה e אֲדֹנָי no mesmo verso
  choice: Traduzir יְהוָה por “Yahweh” e אֲדֹנָי por “Senhor”
  alternative: Traduzir ambos por “Senhor”, recorrendo ou não a diferenças tipográficas
  rationale: O hebraico emprega o nome pessoal e o título divino no mesmo verso. Formas distintas permitem ao leitor perceber essa diferença sem inserir conteúdo ausente do texto.
- issue: Referente do “monte da tua herança” e do “santuário”
  choice: Manter a linguagem poética sem identificar explicitamente o monte com Canaã, Sião ou o monte do templo
  alternative: Explicitar a referência como Sião/monte do templo ou como toda a terra de Canaã
  rationale: O texto pode abranger a herança territorial do povo e avançar poeticamente para o lugar do santuário de Deus. A tradução preserva essa amplitude e tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do singular para conservar a invocação poética direta a Deus. A ordem foi levemente ajustada à sintaxe portuguesa, sem eliminar o paralelismo nem as imagens do hebraico.
