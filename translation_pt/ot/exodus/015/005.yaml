base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/005.yaml
  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: pt
  text: As águas profundas os cobriram[a]; desceram às profundezas como uma pedra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As profundezas os cobriram; afundaram nas águas profundas como uma pedra.”'
    reason: Alternativa lexical que mantém תְּהֹמֹת como “profundezas” e traduz יָרְדוּ contextualmente por “afundaram”.
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: as águas profundas
  rationale: O plural de תְּהוֹם designa as águas profundas ou o abismo aquático. “As águas profundas” é claro em português e distingue naturalmente este termo de מְצוֹלֹת no segundo verso poético.
- source_word: יְכַסְיֻמוּ
  choice: os cobriram
  rationale: A forma de כסה com sufixo de terceira pessoa masculina plural significa diretamente que as águas os cobriram.
- source_word: יָרְדוּ
  choice: desceram
  rationale: Traduz de modo formal e poético o qal perfeito de ירד, preservando a imagem de descida sem explicitar interpretativamente “afundaram”.
- source_word: בִמְצוֹלֹת
  choice: às profundezas
  rationale: מְצוֹלָה refere-se às profundezas, especialmente às do mar. Com o verbo de movimento, “às profundezas” expressa de modo idiomático o sentido direcional da preposição.
- source_word: כְּמוֹ
  choice: como
  rationale: Equivalente comparativo corrente e natural em português.
- source_word: אָבֶן
  choice: uma pedra
  rationale: O substantivo comum significa “pedra”; o artigo indefinido é natural na comparação em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A tradução diferencia os dois termos hebraicos relacionados às profundezas aquáticas, mas a nota registra uma alternativa que inverte essa distribuição lexical.
