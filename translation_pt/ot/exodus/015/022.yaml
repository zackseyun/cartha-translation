  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: pt
  text: Então Moisés fez Israel partir do Mar dos Juncos[a], e saíram para o deserto de Sur. Caminharam três dias pelo deserto e não encontraram água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente traduzido como “Mar Vermelho”; em hebraico, “Mar dos Juncos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: fez Israel partir
  rationale: 'O hifil de נסע tem sentido causativo: Moisés fez o povo prosseguir daquele lugar. A formulação preserva essa nuance sem sugerir mais do que o hebraico afirma.'
- source_word: מִיַּם סוּף
  choice: do mar dos Juncos
  rationale: A expressão hebraica יַם־סוּף designa literalmente o 'mar dos Juncos'. A tradução tradicional é registrada em nota.
- source_word: וַיֵּצְאוּ אֶל מִדְבַּר שׁוּר
  choice: eles saíram para o deserto de Sur
  rationale: Mantém o movimento expresso por יצא e o destino introduzido por אֶל, em português natural.
- source_word: שְׁלֹשֶׁת יָמִים בַּמִּדְבָּר
  choice: três dias pelo deserto
  rationale: O acusativo indica duração. Embora בַּמִּדְבָּר seja literalmente 'no deserto', 'pelo deserto' comunica naturalmente o percurso nesse contexto.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: e não encontraram água
  rationale: Tradução direta e idiomática, preservando a coordenação e a negação do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega-se “deserto” para מִדְבָּר por ser corrente em português bíblico e adequado ao terreno árido, sem pressupor exclusivamente dunas de areia.
