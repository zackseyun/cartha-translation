  source_fidelity: 'A sequência verbal e a imagem militar correspondem bem ao hebraico: o inimigo pretende perseguir, alcançar, repartir o despojo, sacar a espada e dominar/desapossar os israelitas. «Minha mão os despojará» é uma tradução contextual aceitável para a forma causativa de ירשׁ, embora «desapossará» seja mais estritamente próximo e menos natural no português corrente.'
