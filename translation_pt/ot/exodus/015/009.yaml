base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: pt
  text: 'O inimigo disse: “Vou perseguir, vou alcançar, vou repartir o despojo; meu apetite se saciará deles.[a] Vou desembainhar minha espada; minha mão os despojará.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha alma se encherá deles”, isto é, “vou me fartar deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “minha mão os destruirá” ou “os expulsará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: O inimigo disse
  rationale: O passado simples introduz naturalmente, no contexto do cântico, a jactância do inimigo coletivo representado no singular.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: Vou perseguir, vou alcançar
  rationale: As formas imperfeitas expressam as ações pretendidas pelo inimigo; “alcançar” comunica a ideia de chegar até os fugitivos durante a perseguição.
- source_word: אֲחַלֵּק שָׁלָל
  choice: vou repartir o despojo
  rationale: Mantém a expressão militar referente à divisão dos bens tomados na guerra, em linguagem clara e digna.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: meu desejo se saciará neles
  rationale: נֶפֶשׁ designa aqui o apetite ou desejo interior. A formulação comunica a avidez hostil sem transformar “alma” em termo antropológico técnico; a imagem mais literal é preservada em nota.
- source_word: אָרִיק חַרְבִּי
  choice: Vou desembainhar minha espada
  rationale: A expressão idiomática significa tirar a espada da bainha; “desembainhar” preserva de modo claro a imagem militar.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: minha mão os despojará
  rationale: A forma causativa de ירשׁ pode indicar desapossar ou expulsar. “Despojar” preserva a ideia de privá-los do que possuem e funciona no contexto da jactância militar, enquanto outras possibilidades contextuais ficam registradas em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com a sequência breve e enfática das ameaças preservada. “Despojo” e “desembainhar” mantêm o campo semântico militar sem recorrer a linguagem excessivamente arcaica.
