  text: וַ/יָּבֹ֣אוּ אֵילִ֔מָ/ה וְ/שָׁ֗ם שְׁתֵּ֥ים עֶשְׂרֵ֛ה עֵינֹ֥ת מַ֖יִם וְ/שִׁבְעִ֣ים תְּמָרִ֑ים וַ/יַּחֲנוּ שָׁ֖ם עַל הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: pt
  text: Então chegaram a Elim[a], onde havia doze fontes de água e setenta palmeiras[b]. Acamparam ali junto à água[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então chegaram a Elim, e ali havia doze fontes de água e setenta palmeiras.”'
    reason: alternativa_sintática
  - marker: b
    text: “Palmeiras” também pode ser traduzido mais especificamente como “tamareiras”.
    reason: alternativa_lexical
  - marker: c
    text: 'Ou: “junto às águas”. Em hebraico, a palavra traduzida como “água” tem forma plural, frequentemente usada com sentido coletivo.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então chegaram
  rationale: O wayyiqtol de בוא dá continuidade à sequência narrativa. “Então chegaram” expressa essa progressão de modo natural em português.
- source_word: אֵילִמָה
  choice: a Elim
  rationale: O nome próprio é transliterado, e o ה direcional é representado pela preposição “a”.
- source_word: וְשָׁם
  choice: onde havia
  rationale: Literalmente, “e ali”. Depois do nome do lugar, “onde havia” produz uma construção portuguesa natural sem perder o sentido locativo; a forma mais literal é registrada em nota.
- source_word: עֵינֹת מַיִם
  choice: fontes de água
  rationale: עַיִן pode designar uma fonte ou nascente. “Fontes de água” é claro, corrente e adequado ao contexto de um oásis.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: e setenta palmeiras
  rationale: תָּמָר designa uma palmeira, provavelmente uma tamareira. “Palmeiras” mantém a referência geral do termo, enquanto a identificação mais específica aparece em nota.
- source_word: וַיַּחֲנוּ
  choice: Acamparam
  rationale: O verbo חנה significa montar acampamento. “Acamparam” é direto e atual em português.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio retoma Elim como o lugar em que o povo acampou.
- source_word: עַל הַמָּיִם
  choice: junto à água
  rationale: Neste contexto, עַל indica proximidade. Embora מַיִם tenha forma plural em hebraico, “água” funciona naturalmente como coletivo em português.
