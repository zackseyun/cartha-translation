  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: pt
  text: 'E o povo reclamou[a] contra Moisés, dizendo: “O que vamos beber?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “murmurou” ou “queixou-se”. O verbo hebraico se refere a uma reclamação coletiva, especialmente nas narrativas do deserto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: reclamou
  rationale: O verbo לון/לין, neste contexto das queixas no deserto, indica uma reclamação coletiva. “Reclamou” é natural no português atual e preserva o sentido negativo sem recorrer ao menos corrente “murmurou”.
- source_word: הָעָם
  choice: o povo
  rationale: Reproduz diretamente o substantivo com artigo, sem acrescentar de forma interpretativa “de Israel”.
- source_word: עַל
  choice: contra
  rationale: Com um verbo de queixa, a preposição indica o alvo da reclamação e tem força adversativa.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva de modo natural a fórmula hebraica que introduz o discurso direto.
- source_word: מַה
  choice: O que
  rationale: Equivalente direto e idiomático do pronome interrogativo.
- source_word: נִּשְׁתֶּה
  choice: vamos beber
  rationale: O imperfeito qal na primeira pessoa do plural expressa aqui necessidade ou deliberação imediata. “Vamos beber” formula a pergunta de modo natural e urgente em português, sem introduzir a ideia de capacidade.
