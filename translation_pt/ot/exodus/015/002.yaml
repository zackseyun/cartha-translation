id: EXO.15.2
reference: Exodus 15:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: pt
  text: Yah é a minha força e o meu cântico; ele se tornou a minha salvação. Este é o meu Deus, e eu o louvarei[a]; é o Deus de meu pai, e eu o exaltarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu lhe prepararei uma morada”. O verbo hebraico é de interpretação difícil e também pode estar relacionado às ideias de adornar ou glorificar.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: a minha força
  rationale: O substantivo עֹז indica força ou poder. “A minha força” é natural em português e preserva a expressão poética.
- source_word: וְזִמְרָת יָהּ
  choice: e o meu cântico; Yah
  rationale: זִמְרָה pode designar cântico ou louvor musical. No contexto do hino de vitória, “cântico” conserva a imagem poética; יָהּ é entendido como o sujeito da oração.
- source_word: יָהּ
  choice: Yah
  rationale: O texto traz a forma abreviada do nome divino, יָהּ, e não o tetragrama completo. “Yah” preserva essa forma distintiva e sua força poética.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: ele se tornou a minha salvação
  rationale: A construção היה + ל expressa que alguém se torna ou passa a ser algo para outra pessoa. A formulação mantém esse sentido resultativo em português natural.
- source_word: זֶה אֵלִי
  choice: Este é o meu Deus
  rationale: A tradução direta preserva a identificação enfática expressa pelo demonstrativo זֶה.
- source_word: וְאַנְוֵהוּ
  choice: e eu o louvarei
  rationale: O verbo é de interpretação difícil. “Eu o louvarei” se ajusta ao contexto de adoração e ao paralelismo com “eu o exaltarei”, sem ocultar em nota a leitura alternativa ligada a preparar uma morada.
- source_word: אֱלֹהֵי אָבִי
  choice: o Deus de meu pai
  rationale: A expressão construta é singular e traz sufixo de primeira pessoa. “O Deus de meu pai” é clara, natural e conserva a referência familiar.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: e eu o exaltarei
  rationale: רומם significa elevar ou exaltar. “Exaltarei” preserva a metáfora e o registro elevado próprio de um cântico de adoração.
theological_decisions:
- issue: Tradução do nome divino יָהּ
  choice: Yah
  alternative: SENHOR
  rationale: Como o original emprega a forma abreviada יָהּ, ela é mantida de modo distinto em vez de ser assimilada à tradução convencional do tetragrama completo.
- issue: Interpretação de וְאַנְוֵהוּ
  choice: eu o louvarei
  alternative: eu lhe prepararei uma morada
  rationale: A leitura adotada corresponde melhor ao paralelismo poético e ao contexto de louvor, enquanto a alternativa lexical relevante é preservada em nota para não eliminar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Emprega-se “cântico” por sua adequação ao hino e “Yah” para conservar a forma abreviada específica do nome divino. O marcador da nota foi colocado junto ao verbo cuja interpretação é debatida.
