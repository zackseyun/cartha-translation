  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: pt
  text: Ao sopro das tuas narinas[a], as águas se amontoaram; as águas correntes ficaram erguidas como um montão[b]; as profundezas se coalharam[c] no coração do mar[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pelo vento das tuas narinas». A palavra hebraica pode significar vento ou sopro.'
    reason: lexical_alternative
  - marker: b
    text: O substantivo hebraico significa «montão» ou «massa amontoada»; algumas traduções dizem «como uma parede», à luz de outras descrições da travessia do mar.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «se congelaram». O verbo hebraico pode indicar que algo se torna espesso, coalhado ou congelado.'
    reason: lexical_alternative
  - marker: d
    text: Isto é, no meio do mar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: Ao sopro das tuas narinas
  rationale: רוּחַ pode significar vento, sopro ou espírito; ligado a אַפֶּיךָ, comunica aqui uma exalação poderosa. A formulação preserva a imagem antropomórfica concreta e a força poética.
- source_word: נֶעֶרְמוּ מַיִם
  choice: as águas se amontoaram
  rationale: O verbo descreve as águas acumulando-se em monte; «se amontoaram» é direto, natural e conserva a imagem do hebraico.
- source_word: נִצְּבוּ
  choice: ficaram erguidas
  rationale: O verbo significa ficar de pé ou tomar posição. No contexto das águas, «ficaram erguidas» exprime sua posição estável sem transformá-las explicitamente numa parede.
- source_word: כְמוֹ נֵד
  choice: como um montão
  rationale: נֵד designa mais diretamente um montão ou massa acumulada. A opção evita importar «parede» apenas de passagens paralelas.
- source_word: נֹזְלִים
  choice: as águas correntes
  rationale: O particípio caracteriza aquilo que flui; «águas correntes» mantém essa força descritiva em português natural.
- source_word: קָפְאוּ
  choice: se coalharam
  rationale: O verbo pode indicar espessar-se, coalhar ou congelar. «Coalharam» conserva a imagem incomum de uma massa líquida tornando-se espessa sem impor exclusivamente a ideia física moderna de congelamento.
- source_word: תְהֹמֹת
  choice: as profundezas
  rationale: O plural refere-se às águas profundas ou aos abismos aquáticos; «as profundezas» é claro e mantém a grandeza poética.
- source_word: בְּלֶב יָם
  choice: no coração do mar
  rationale: A tradução literal preserva a metáfora poética hebraica, que no contexto significa o interior ou meio do mar.
theological_decisions:
- issue: Representação antropomórfica de Deus no Cântico do Mar
  choice: Manter a imagem concreta do sopro das narinas de Deus.
  alternative: Abstrair a expressão como referência à ira de Deus.
  rationale: O hebraico apresenta uma imagem corporal e poética para retratar a intervenção poderosa de Deus. Mantê-la respeita a forma do texto e evita uma abstração teológica desnecessária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe paralela conserva o caráter poético do cântico; imagens incomuns do hebraico são mantidas e esclarecidas em notas, sem serem niveladas.
