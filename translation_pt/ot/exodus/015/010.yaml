  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: pt
  text: Sopraste com o teu vento; o mar os cobriu.[a] Afundaram como chumbo em águas poderosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o teu sopro”. A palavra hebraica pode significar “vento”, “sopro” ou “espírito”; neste contexto da travessia do mar, “vento” parece mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: Sopraste
  rationale: O verbo expressa soprar ou exalar. A forma direta preserva a imagem poética da ação divina sobre o mar.
- source_word: בְרוּחֲךָ
  choice: com o teu vento
  rationale: רוּחַ pode significar vento, sopro ou espírito. O contexto da travessia do mar e o verbo 'soprar' favorecem 'vento', enquanto a nota preserva a alternativa 'sopro'.
- source_word: כִּסָּמוֹ יָם
  choice: o mar os cobriu
  rationale: Traduz literalmente o verbo 'cobrir' e mantém explícito o objeto plural representado pelo sufixo hebraico.
- source_word: צָלֲלוּ
  choice: Afundaram
  rationale: Expressa com clareza o movimento para baixo nas águas e combina naturalmente com a comparação ao chumbo.
- source_word: כָּעוֹפֶרֶת
  choice: como chumbo
  rationale: Preserva de modo direto a comparação e a imagem do peso do metal.
- source_word: בְּמַיִם אַדִּירִים
  choice: em águas poderosas
  rationale: אַדִּירִים comunica força ou poder. 'Águas poderosas' preserva esse sentido sem substituí-lo pela ideia menos precisa de profundidade.
theological_decisions:
- issue: Sentido de רוּחַ no contexto poético da ação divina
  choice: vento
  alternative: sopro; espírito
  rationale: A ação física sobre o mar e sua associação com 'sopraste' favorecem 'vento'. A nota mantém 'sopro' como possibilidade legítima, sem transformar o texto em referência explícita ao Espírito.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com o discurso direto a Deus. A ordem das orações e as imagens poéticas do hebraico foram preservadas.
