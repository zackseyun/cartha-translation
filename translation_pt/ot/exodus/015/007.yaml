  text: וּ/בְ/רֹ֥ב גְּאוֹנְ/ךָ֖ תַּהֲרֹ֣ס קָמֶ֑י/ךָ תְּשַׁלַּח֙ חֲרֹ֣נְ/ךָ֔ יֹאכְלֵ֖/מוֹ כַּ/קַּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: pt
  text: E na grandeza da tua majestade[a], derrubas os que se levantam contra ti; envias o teu furor[b], que os consome como palha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com a imensidão da tua grandeza”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a tua ira”. O hebraico traz literalmente a ideia do ardor da ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב
  choice: E, na grandeza de
  rationale: O וְ é mantido como ligação com o contexto anterior. A construção בְּרֹב pode indicar esfera ou meio; “na grandeza de” conserva a amplitude da expressão hebraica sem definir rigidamente essa relação.
- source_word: גְּאוֹנְךָ
  choice: tua majestade
  rationale: גָּאוֹן pode expressar exaltação, grandeza ou majestade. No cântico de vitória, “majestade” comunica dignidade soberana e superioridade sem acrescentar uma interpretação doutrinária.
- source_word: תַּהֲרֹס
  choice: derrubas
  rationale: הרס significa derrubar, demolir ou destruir. Como o objeto é pessoal, “derrubas” soa natural e preserva a imagem de fazer cair os opositores.
- source_word: קָמֶיךָ
  choice: os que se levantam contra ti
  rationale: A forma participial de קום retém a ação verbal de levantar-se em oposição, em vez de reduzi-la ao substantivo mais genérico “adversários”.
- source_word: תְּשַׁלַּח
  choice: envias
  rationale: Tradução direta de שׁלח, adequada à imagem poética de Deus enviando seu furor; evita o acréscimo interpretativo de “desencadeias”.
- source_word: חֲרֹנְךָ
  choice: teu furor
  rationale: חָרוֹן designa ira intensa e associa-se etimológica e poeticamente ao ardor. “Furor” é corrente, forte e digno; uma nota registra a imagem literal de calor.
- source_word: יֹאכְלֵמוֹ
  choice: que os consome
  rationale: O verbo singular retoma o furor e traz um sufixo plural referente aos opositores. “Consome” preserva a personificação e prepara a comparação com material seco queimado.
- source_word: כַּקַּשׁ
  choice: como palha
  rationale: קַשׁ pode indicar palha ou restolho seco. “Palha” é mais imediatamente compreensível em português amplo e mantém a imagem de algo rapidamente consumido pelo fogo.
theological_decisions:
- issue: Linguagem do juízo divino
  choice: envias o teu furor, que os consome como palha
  alternative: desencadeias a tua ira, e ela os devora como restolho
  rationale: A tradução mantém sem suavização a atribuição do juízo destrutivo a Deus e conserva a metáfora poética, sem acrescentar explicações doutrinárias posteriores.
- issue: Tratamento da segunda pessoa na referência a Deus
  choice: tua majestade ... contra ti ... teu furor
  alternative: vossa majestade ... contra vós ... vosso furor
  rationale: O singular informal “tu” corresponde ao endereço hebraico singular e é natural no registro bíblico português, preservando o caráter direto, confessional e poético do cântico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa do singular coerentes com o discurso direto a Deus. A sintaxe acompanha o paralelismo poético hebraico, e o pronome relativo “que” deixa claro que é o furor enviado que consome os opositores.
