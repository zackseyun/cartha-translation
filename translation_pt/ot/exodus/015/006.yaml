lexical_decisions:
- source_word: יְמִינְךָ
  choice: tua mão direita
  rationale: Preserva a imagem concreta da mão direita como expressão poética de força e ação vitoriosa.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino presente no hebraico, com a partícula vocativa natural em português.
- source_word: נֶאְדָּרִי
  choice: é majestosa
  rationale: Comunica majestade, glória e magnificência, preservando o tom elevado e a construção predicativa.
- source_word: בַּכֹּחַ
  choice: em poder
  rationale: Reflete de perto a preposição ב e o substantivo כֹּחַ, formando uma expressão poética clara em português.
- source_word: תִּרְעַץ
  choice: despedaça
  rationale: Reproduz a ação violenta e decisiva de esmagar ou quebrar, com força poética natural.
- source_word: אוֹיֵב
  choice: o inimigo
  rationale: Mantém o singular hebraico, que pode designar coletivamente a força hostil.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
