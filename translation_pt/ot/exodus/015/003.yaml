  text: יְהוָ֖ה אִ֣ישׁ מִלְחָמָ֑ה יְהוָ֖ה שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/003.yaml
  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: pt
  text: Yahweh é guerreiro; Yahweh é o seu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH; também vertido como «Javé», «Jeová» ou, tradicionalmente, «o SENHOR».
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando seu caráter de nome pessoal em vez de substituí-lo por um título.
- source_word: אִישׁ מִלְחָמָה
  choice: guerreiro
  rationale: A expressão hebraica, literalmente «homem de guerra», funciona idiomaticamente como designação de quem combate. «Guerreiro» é natural em português, mantém a força poética e evita a expressão pouco idiomática «homem de guerra».
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Supre a cópula exigida em português para representar a oração nominal hebraica e conserva a identificação enfática do nome.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; Jeová; o SENHOR
  rationale: O texto traz diretamente o tetragrama. A transliteração «Yahweh» conserva o nome pessoal; a nota registra formas portuguesas alternativas sem substituir o nome por um título no texto principal.
- issue: Sentido de אִישׁ מִלְחָמָה
  choice: guerreiro
  alternative: homem de guerra
  rationale: Embora a forma literal seja «homem de guerra», a expressão predicativa caracteriza Yahweh como combatente. «Guerreiro» comunica esse sentido de modo claro e digno, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, conciso e poético, com ampla legibilidade brasileira. A repetição de «Yahweh» preserva o paralelismo e a ênfase do hebraico.
