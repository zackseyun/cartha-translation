source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: pt
  text: 'Então Moisés e os filhos de Israel cantaram este cântico a Yahweh[a] e disseram:


    “Cantarei a Yahweh,

    pois triunfou gloriosamente[b];

    cavalo e seu cavaleiro

    lançou ao mar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, transliterado aqui como “Yahweh”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “é sumamente exaltado”. O hebraico intensifica o verbo por meio de uma forma repetida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência narrativa depois da travessia do mar de modo direto e natural em português.
- source_word: יָשִׁיר
  choice: cantaram
  rationale: Embora seja morfologicamente uma forma imperfeita, com אָז no contexto narrativo tem valor pretérito.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a expressão genealógica hebraica, sem sugerir que se trate de crianças.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: este cântico
  rationale: Tradução direta da expressão demonstrativa; “cântico” se ajusta ao registro poético e religioso sem acrescentar conteúdo.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: e disseram
  rationale: A fórmula hebraica introduz a citação; em português, repetir “dizendo” seria redundante e pouco natural.
- source_word: אָשִׁירָה
  choice: Cantarei
  rationale: Expressa a resolução da forma coortativa na primeira pessoa e mantém a mudança da introdução plural para a voz poética singular.
- source_word: גָאֹה גָּאָה
  choice: triunfou gloriosamente
  rationale: A construção com infinitivo absoluto intensifica o verbo; no contexto da vitória no mar, esta formulação comunica exaltação e triunfo.
- source_word: סוּס וְרֹכְבוֹ
  choice: cavalo e seu cavaleiro
  rationale: Mantém o singular coletivo e o sufixo possessivo da expressão poética hebraica.
- source_word: רָמָה בַיָּם
  choice: lançou ao mar
  rationale: Comunica com concisão o movimento vigoroso de lançar para dentro do mar, implícito no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém no texto o nome próprio representado pelo Tetragrama, em vez de substituí-lo por um título; a nota registra a tradição alternativa.
- issue: Sentido de גָאֹה גָּאָה
  choice: triunfou gloriosamente
  alternative: é sumamente exaltado
  rationale: O contexto favorece a ideia de triunfo, mas a expressão também pode destacar exaltação; a nota preserva essa possibilidade sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com disposição em versos para evidenciar o caráter poético. A tradução conserva a concisão e a mudança para a primeira pessoa singular, evitando uma reprodução redundante da fórmula hebraica de introdução da fala.
