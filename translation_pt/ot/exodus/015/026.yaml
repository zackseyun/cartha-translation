  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: pt
  text: 'Ele disse: “Se você ouvir atentamente a voz de Yahweh, seu Deus, fizer o que é correto aos olhos dele, der ouvidos aos seus mandamentos e guardar todos os seus estatutos, não colocarei sobre você nenhuma das doenças que coloquei sobre o Egito, pois eu sou Yahweh, aquele que cura você.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois eu sou Yahweh, seu curador”.'
    reason: O particípio רֹפְאֶךָ pode ser entendido verbalmente, “aquele que cura você”, ou nominalmente, “seu curador”.
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: ouvir atentamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. A formulação preserva tanto o sentido auditivo quanto a ideia de atenção obediente.
- source_word: לְקוֹל
  choice: a voz
  rationale: Mantém a expressão hebraica “ouvir a voz de”, natural e compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: fizer o que é correto aos olhos dele
  rationale: Preserva o idioma hebraico e o sentido moral de יָשָׁר sem interpretá-lo apenas como aquilo que agrada.
- source_word: וְהַאֲזַנְתָּ
  choice: der ouvidos
  rationale: Reflete a atenção cuidadosa indicada pelo hifil de אזן e distingue esta expressão do primeiro verbo “ouvir”.
- source_word: לְמִצְוֺתָיו
  choice: aos seus mandamentos
  rationale: É a equivalência covenantal e jurídica direta de מִצְוֹתָיו.
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: guardar todos os seus estatutos
  rationale: “Guardar” expressa observar fielmente, enquanto “estatutos” comunica prescrições fixadas.
- source_word: כָּל הַמַּחֲלָה
  choice: nenhuma das doenças
  rationale: O singular coletivo com כָּל é expresso naturalmente em português pelo plural dentro de uma construção negativa.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם ... לֹא אָשִׂים עָלֶיךָ
  choice: não colocarei sobre você nenhuma das doenças que coloquei sobre o Egito
  rationale: Mantém a repetição lexical de שׂים e a estrutura condicional da promessa, sem tornar “infligir” explícito além do hebraico.
- source_word: רֹפְאֶךָ
  choice: aquele que cura você
  rationale: Traduz o particípio verbalmente de modo natural em português e preserva a ação contínua ou característica sem exigir um título nominal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Natureza da promessa sobre doenças
  choice: Promessa condicional, no contexto da aliança, de não colocar sobre Israel as doenças colocadas sobre o Egito
  alternative: Garantia universal de cura física individual; afirmação puramente metafórica
  rationale: A própria sintaxe condiciona a declaração à escuta obediente e a relaciona ao juízo histórico sobre o Egito; a tradução não amplia nem espiritualiza a promessa.
- issue: Nuance de רֹפְאֶךָ
  choice: aquele que cura você
  alternative: seu curador
  rationale: O particípio admite leitura verbal ou nominal. O texto principal usa uma construção verbal natural, e a nota preserva a alternativa nominal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os paralelismos verbais e as expressões hebraicas ainda naturais em português. O singular “você” reflete os pronomes hebraicos masculinos singulares, que aqui se dirigem coletivamente a Israel.
