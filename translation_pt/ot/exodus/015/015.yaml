source:
  edition: WLC
  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: pt
  text: 'Então, os chefes de Edom ficaram apavorados;

    o tremor apoderou-se dos líderes de Moabe[a];

    todos os habitantes de Canaã se derreteram de medo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os poderosos de Moabe». A expressão hebraica significa literalmente «os fortes» ou «os carneiros de Moabe» e, neste contexto, designa homens proeminentes ou líderes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a consequência temporal dos atos salvadores cantados nos versos anteriores e mantém a progressão poética.
- source_word: נִבְהֲלוּ
  choice: ficaram apavorados
  rationale: O nifal de בהל expressa perturbação intensa, consternação ou terror; esta formulação comunica naturalmente a força do contexto.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: os chefes de Edom
  rationale: אַלּוּף designa chefes ou líderes de clãs; «chefes» preserva a função de liderança sem sugerir indevidamente um cargo régio.
- source_word: אֵילֵי מוֹאָב
  choice: os líderes de Moabe
  rationale: A expressão, literalmente associada a fortes ou carneiros, refere-se aqui aos homens proeminentes de Moabe. «Líderes» comunica o sentido contextual, enquanto a imagem lexical é registrada em nota.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: o tremor apoderou-se
  rationale: Preserva a imagem vívida do tremor como algo que toma posse deles e soa natural em português.
- source_word: נָמֹגוּ
  choice: se derreteram de medo
  rationale: Mantém a metáfora hebraica de derreter-se ou dissolver-se por perda de coragem; «de medo» torna claro em português o valor contextual da imagem.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: todos os habitantes de Canaã
  rationale: Tradução direta e idiomática da construção participial coletiva, preservando a abrangência de כֹּל.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética em três linhas. Conserva-se a metáfora hebraica de derreter-se, esclarecida pela expressão «de medo». O marcador da nota foi colocado junto de «líderes de Moabe», termo ao qual a alternativa lexical efetivamente se refere.
