lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando no texto o nome pessoal presente no hebraico, em vez de substituí-lo por um título.
- source_word: יִמְלֹךְ
  choice: reinará
  rationale: O imperfeito de מלך tem aqui sentido futuro no contexto do cântico e expressa de modo natural a continuidade da soberania real de Yahweh.
- source_word: לְעֹלָם וָעֶד
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente e solene que reproduz a locução hebraica intensificadora de duração ilimitada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome divino sem substituí-lo por um título; a nota registra as formas tradicionais.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Para todo o sempre” conserva o caráter poético e a ênfase da aclamação hebraica.
