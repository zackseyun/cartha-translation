base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: pt
  text: 'E Miriã lhes respondeu[a]: “Cantem a Yahweh, pois ele triunfou gloriosamente[b]; lançou ao mar o cavalo e seu cavaleiro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Miriã cantou-lhes em resposta”, ou “Miriã lhes respondeu em canto”, refletindo o verbo “respondeu” num contexto musical ou antifonal.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “exaltou-se sobremaneira” ou “é grandemente exaltado”. Neste cântico de vitória, “triunfou gloriosamente” expressa o sentido enfático da construção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: respondia
  rationale: Preserva o sentido básico de ענה, “responder”, enquanto o contexto musical permite entender uma resposta cantada ou antifonal. O imperfeito narrativo pode descrever aqui a ação de Miriã ao conduzir o refrão.
- source_word: לָהֶם
  choice: lhes
  rationale: Representa naturalmente a preposição com sufixo masculino plural sem especificar além do hebraico se os destinatários eram somente as mulheres mencionadas no contexto imediato ou um grupo mais amplo.
- source_word: מִרְיָם
  choice: Miriã
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Traduz diretamente o imperativo masculino plural de שׁיר, sem acrescentar o objeto interpretativo “louvores”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Conserva explicitamente o nome divino יהוה e expressa com naturalidade o destinatário do canto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do chamado para cantar, em registro poético natural.
- source_word: גָאֹה גָּאָה
  choice: triunfou gloriosamente
  rationale: A construção intensiva com infinitivo absoluto e verbo finito comunica exaltação ou majestade manifesta; no cântico de vitória, esta formulação transmite de modo natural a força enfática sem reproduzir mecanicamente a repetição hebraica.
- source_word: סוּס וְרֹכְבוֹ
  choice: o cavalo e seu cavaleiro
  rationale: Mantém o par singular de valor genérico ou coletivo. “Seu cavaleiro” reproduz a relação expressa pelo sufixo sem tornar pesada a frase.
- source_word: רָמָה בַיָּם
  choice: lançou no mar
  rationale: Traduz diretamente a ação de arremessar e usa “no mar”, construção portuguesa natural que pode expressar tanto o movimento como o destino resultante.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título, sem importar uma interpretação denominacional.
- issue: Sentido de גָאֹה גָּאָה
  choice: triunfou gloriosamente
  alternative: é grandemente exaltado; exaltou-se sobremaneira
  rationale: O paralelismo com a derrota do cavalo e do cavaleiro favorece uma expressão de majestade vitoriosa, embora a formulação hebraica também admita a ideia mais literal de elevada exaltação; essa alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A fala mantém o caráter poético por meio de uma sintaxe breve. “Respondia” deixa aberta a nuance de canto responsivo ou antifonal, sem exigir uma nota adicional.
