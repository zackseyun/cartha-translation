  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: pt
  text: Pois os cavalos do faraó entraram no mar com seus carros de guerra e seus cavaleiros[a], e Yahweh fez as águas do mar voltarem sobre eles; mas os filhos de Israel caminharam em terra seca pelo meio do mar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “o cavalo do faraó [...] com seu carro”; os singulares podem ter sentido coletivo, referindo-se aos cavalos e carros de guerra do faraó.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e os filhos de Israel”. A conjunção hebraica é simplesmente “e”; “mas” explicita o contraste presente no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada ao contexto anterior e preserva de modo natural a força conectiva do hebraico.
- source_word: בָא
  choice: entraram
  rationale: Com בַיָּם, indica movimento para dentro do mar; “entraram” é direto e idiomático em português.
- source_word: סוּס פַּרְעֹה
  choice: os cavalos do faraó
  rationale: Embora סוּס esteja no singular, pode ter sentido coletivo neste contexto militar; o plural torna esse sentido claro em português.
- source_word: בְּרִכְבּוֹ
  choice: com seus carros de guerra
  rationale: רכב, formalmente singular aqui, pode designar coletivamente os carros ou a força de carros; “carros de guerra” evita a possível associação moderna de “carros” com automóveis.
- source_word: וּבְפָרָשָׁיו
  choice: e seus cavaleiros
  rationale: Designa combatentes montados; “cavaleiros” é corrente e menos técnico que “cavalaria”.
- source_word: וַיָּשֶׁב יְהוָה
  choice: e Yahweh fez ... voltarem
  rationale: O hifil de שוב é causativo; a formulação preserva tanto a volta das águas quanto a agência divina.
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: as águas do mar voltarem sobre eles
  rationale: Mantém a imagem concreta das águas cobrindo as forças egípcias.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: mas os filhos de Israel
  rationale: “Filhos de Israel” corresponde formalmente ao hebraico; “mas” explicita o contraste contextual, embora a conjunção hebraica seja simplesmente “e”, fato registrado em nota.
- source_word: הָלְכוּ בַיַּבָּשָׁה
  choice: caminharam em terra seca
  rationale: Preserva o verbo comum “caminhar” e expressa naturalmente a condição seca do leito do mar.
- source_word: בְּתוֹךְ הַיָּם
  choice: pelo meio do mar
  rationale: Formulação natural que mantém a ideia espacial de atravessar no interior do mar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” representa o nome próprio sem substituí-lo por um título.
- issue: Valor da conjunção antes de “filhos de Israel”
  choice: mas
  alternative: e
  rationale: “Mas” expressa em português o forte contraste entre o destino das forças do faraó e a passagem segura de Israel, sem ocultar em nota que o hebraico usa a conjunção comum “e”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Carros de guerra” esclarece o referente antigo; “filhos de Israel” mantém transparência formal. As duas notas registram, respectivamente, os singulares coletivos e a conjunção hebraica sem resolver silenciosamente essas ambiguidades.
