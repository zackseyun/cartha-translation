  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: pt
  text: Em teu amor leal, conduziste o povo que resgataste[a]; com tua força, guiaste-o à tua santa morada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este povo que resgataste”.'
    reason: lexical_alternative
  - marker: b
    text: “Tua santa morada” pode referir-se, de modo amplo, ao lugar da presença santa de Deus. A expressão tem sido entendida de várias maneiras, entre elas o Sinai, a terra prometida ou Sião e o templo.
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: conduziste
  rationale: O hifil de נחה significa conduzir ou guiar. “Conduziste” expressa com naturalidade a ação divina já realizada e permite distinguir este verbo de נהל na segunda oração.
- source_word: בְחַסְדְּךָ
  choice: em teu amor leal
  rationale: חֶסֶד reúne as ideias de amor, fidelidade e compromisso constante. “Amor leal” preserva essa amplitude em português claro, e “em” mantém o paralelismo poético com a segunda oração.
- source_word: עַם זוּ
  choice: o povo
  rationale: A expressão pode ser entendida literalmente como “este povo”. No texto principal, “o povo” soa mais natural diante da oração relativa que o identifica, sem negar a possível força demonstrativa, registrada em nota.
- source_word: גָּאָלְתָּ
  choice: resgataste
  rationale: גאל descreve libertar ou reivindicar mediante resgate, com importantes associações pactuais. “Resgataste” comunica a ação concreta de libertação e conserva seu peso teológico em linguagem corrente.
- source_word: נֵהַלְתָּ
  choice: guiaste-o
  rationale: נהל indica condução cuidadosa, por vezes com matiz pastoral. “Guiaste-o” preserva esse sentido e evita repetir “conduziste”.
- source_word: בְעָזְּךָ
  choice: com tua força
  rationale: עֹז denota força ou poder. A preposição ב tem aqui sentido instrumental; “com tua força” é idiomático e mantém o equilíbrio com “em teu amor leal”.
- source_word: אֶל
  choice: à
  rationale: A preposição indica movimento em direção a um destino. “À” exprime de modo natural a condução para a morada, sem especificar além do hebraico se houve entrada nela.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: tua santa morada
  rationale: נָוֶה pode indicar morada, habitação ou lugar de pastoreio. “Santa morada” comunica o lugar da presença santa de Deus sem identificar de forma indevida uma localização específica.
theological_decisions:
- issue: Referente de “tua santa morada”
  choice: Manter uma referência ampla ao lugar da presença santa de Deus.
  alternative: Identificá-la especificamente com o Sinai, a terra prometida, Sião ou o templo.
  rationale: A expressão hebraica não determina inequivocamente o local. O cântico pode contemplar poeticamente o desdobramento da obra salvadora de Deus; por isso, a tradução preserva a abertura do texto, e a nota apresenta as principais possibilidades.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O pretérito perfeito reproduz as formas verbais hebraicas como ações celebradas poeticamente como realizadas. Os pronomes de segunda pessoa do singular mantêm o discurso direto a Deus e a concisão do paralelismo hebraico.
