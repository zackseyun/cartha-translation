base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: pt
  text: 'Isso pertencerá a Arão e a seus filhos, como estatuto permanente da parte dos israelitas, pois é uma contribuição. Será uma contribuição da parte dos israelitas, tirada dos sacrifícios das suas ofertas de paz[a]: a contribuição deles para o SENHOR.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “ofertas de comunhão” ou “ofertas de bem-estar”. O termo hebraico transmite ideias de integridade, bem-estar e relacionamento restaurado.
    reason: Alternativas lexicais para o termo cultual שְׁלָמִים e esclarecimento de sua amplitude semântica.
lexical_decisions:
- source_word: וְהָיָה
  choice: Isso pertencerá
  rationale: Embora a forma verbal signifique literalmente “e será”, o contexto legal trata da porção destinada a Arão e a seus filhos; “pertencerá” expressa essa relação de posse de modo natural.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: a Arão e a seus filhos
  rationale: A preposição hebraica indica posse ou benefício, preservando a referência à linhagem sacerdotal.
- source_word: לְחָק עוֹלָם
  choice: como estatuto permanente
  rationale: חָק designa uma prescrição estabelecida, e עוֹלָם, neste contexto legal e cultual, indica duração contínua ou permanente, sem exigir a ideia filosófica de eternidade absoluta.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: da parte dos israelitas
  rationale: Expressa naturalmente tanto a origem da porção quanto o sentido coletivo de בְּנֵי יִשְׂרָאֵל.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação para a determinação precedente.
- source_word: תְרוּמָה
  choice: contribuição
  rationale: O termo designa algo separado e apresentado a Deus. “Contribuição” conserva o sentido amplo sem recorrer a uma expressão técnica ou arcaica.
- source_word: וּתְרוּמָה יִהְיֶה
  choice: Será uma contribuição
  rationale: Mantém a repetição enfática do texto hebraico e sua classificação cultual.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: tirada dos sacrifícios das suas ofertas de paz
  rationale: “Sacrifícios” representa זִבְחֵי, enquanto “ofertas de paz” conserva a designação tradicional de שְׁלָמִים. “Tirada” torna explícita em português a relação indicada pela preposição מִן.
- source_word: תְּרוּמָתָם
  choice: a contribuição deles
  rationale: Preserva o sufixo possessivo e a repetição lexical de תְרוּמָה.
- source_word: לַיהוָה
  choice: para o SENHOR
  rationale: “Para” comunica a destinação cultual da contribuição; o nome divino é representado pela forma reverencial tradicional “SENHOR”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: o SENHOR
  alternative: Yahweh
  rationale: Adota a forma reverencial tradicional em português, sem alterar a identidade do referente.
- issue: Sentido cultual de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: A expressão tradicional é reconhecível, mas o termo hebraico também evoca integridade, bem-estar e relacionamento restaurado; a nota preserva essa amplitude sem escolher uma interpretação mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “contribuição” foi mantida por refletir a estrutura enfática do hebraico legal. O marcador [a] foi colocado junto ao termo que esclarece.
