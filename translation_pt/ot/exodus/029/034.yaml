  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: pt
  text: Se sobrar até a manhã algo da carne da oferta de ordenação[a] ou do pão, você deverá queimar no fogo o que sobrar. Não deverá ser comido, porque é santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de consagração”. O termo hebraico se refere ao rito de investidura sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: Se restar
  rationale: O nifal de יתר indica que algo permanece ou sobra. A construção condicional com “se restar” reproduz com naturalidade o sentido passivo no contexto.
- source_word: בְּשַׂר
  choice: carne
  rationale: Embora “carne” também possa corresponder literalmente a “flesh”, em português é o termo natural e concreto para a porção comestível do sacrifício.
- source_word: הַמִּלֻּאִים
  choice: oferta de ordenação
  rationale: No contexto sacerdotal, o termo designa o rito ou sacrifício ligado à investidura dos sacerdotes. “Oferta de ordenação” é claro e conciso; “oferta” é explicitada pelo contexto sacrificial.
- source_word: לֶּחֶם
  choice: pão
  rationale: Correspondência lexical direta e natural.
- source_word: עַד הַבֹּקֶר
  choice: até a manhã
  rationale: Preserva o limite temporal expresso por עַד.
- source_word: וְשָׂרַפְתָּ
  choice: você deverá queimar
  rationale: O waw com a forma verbal perfeita introduz a consequência da condição. A formulação mantém o valor prescritivo em português atual.
- source_word: הַנּוֹתָר
  choice: o que restar
  rationale: O particípio substantivado, da mesma raiz de יִוָּתֵר, refere-se de modo abrangente a tudo o que tiver sobrado.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Expressão idiomática em português para indicar o meio pelo qual o restante deve ser queimado.
- source_word: לֹא יֵאָכֵל
  choice: Não deverá ser comido
  rationale: Mantém a voz passiva e expressa claramente a proibição legal.
- source_word: קֹדֶשׁ
  choice: santo
  rationale: Termo tradicional e preciso para a condição cultual de algo separado para Deus.
theological_decisions:
- issue: Sentido cultual de הַמִּלֻּאִים no contexto da instalação sacerdotal
  choice: oferta de ordenação
  alternative: oferta de consagração
  rationale: O termo se refere ao rito de instalação dos sacerdotes em Êxodo 29. “Ordenação” explicita essa função, enquanto “consagração” continua sendo uma alternativa legítima e foi registrada em nota, sem resolver além do necessário a amplitude cultual do termo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A segunda pessoa foi expressa por “você” para evitar formas verbais arcaizantes, preservando o tom prescritivo por meio de “deverá”. O marcador da nota foi colocado junto ao termo que ela explica.
