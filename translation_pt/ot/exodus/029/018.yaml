  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: pt
  text: Queime o carneiro inteiro sobre o altar. É um holocausto para Yahweh, aroma agradável[a]. É uma oferta feita no fogo para Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aroma apaziguador”. A expressão hebraica é uma fórmula sacrificial que indica uma oferta aceita por Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “oferta de alimento”. O sentido exato do termo hebraico é discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: Queime
  rationale: No contexto sacrificial, o hifil de קטר descreve fazer a oferta subir em fumaça. “Queime” é natural em português, e a referência ao altar mantém claro o sentido ritual.
- source_word: כָּל הָאַיִל
  choice: o carneiro inteiro
  rationale: כָּל enfatiza que todo o animal, e não apenas uma parte, deve ser queimado; אַיִל designa especificamente um carneiro.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Embora a terminação direcional indique movimento em direção ao altar, com o verbo sacrificial o português idiomático descreve a queima como realizada “sobre o altar”.
- source_word: עֹלָה
  choice: holocausto
  rationale: “Holocausto” é o termo bíblico tradicional em português para a oferta inteiramente queimada. Preserva a categoria sacrificial específica sem ampliar o texto.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל marca a destinação ou dedicação da oferta. “Para Yahweh” expressa isso com naturalidade.
- source_word: רֵיחַ נִיחוֹחַ
  choice: aroma agradável
  rationale: A fórmula sacrificial indica que a oferta é aceita favoravelmente por Deus. “Aroma agradável” comunica esse sentido sem sugerir que o aroma literalmente acalma Deus.
- source_word: אִשֶּׁה
  choice: uma oferta feita no fogo
  rationale: O termo designa uma oferta apresentada por meio do fogo. A tradução mantém a ligação com o fogo e evita decidir de modo excessivo a possibilidade de também se tratar de uma oferta de alimento.
- source_word: הוּא
  choice: É / uma oferta
  rationale: O pronome tem função predicativa, identificando o carneiro sacrificado como holocausto e como oferta feita no fogo. Na segunda ocorrência, sua força é expressa naturalmente pela construção nominal em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e não o substitui por um título.
- issue: Sentido da fórmula רֵיחַ נִיחוֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador; aroma de descanso
  rationale: A escolha conserva a linguagem sacrificial antropomórfica e sua noção de aceitação, sem afirmar que Deus precisava ser acalmado.
- issue: Sentido de אִשֶּׁה
  choice: oferta feita no fogo
  alternative: oferta de alimento
  rationale: A etimologia e o uso exato do termo são discutidos. A tradução principal retém sua associação evidente com o fogo, enquanto a nota registra a leitura alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O imperativo “Queime” comunica diretamente a instrução ritual; “holocausto” mantém a terminologia sacrificial bíblica consagrada. Os marcadores de nota foram colocados junto às expressões a que efetivamente se referem.
