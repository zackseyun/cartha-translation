id: EXO.29.44
reference: Exodus 29:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: pt
  text: Consagrarei[a] a tenda do encontro e o altar; e consagrarei Arão e seus filhos para me servirem como sacerdotes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santificarei” ou “tornarei santos”, nas duas ocorrências do verbo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para exercerem o sacerdócio para mim” ou “para ministrarem como sacerdotes a mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: Consagrarei
  rationale: No piel, קדשׁ indica separar como santo, dedicar ao uso sagrado. “Consagrar” é natural no contexto ritual e permite traduzir de modo coerente as duas ocorrências.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Expressa o lugar de encontro designado por Deus e corresponde à formulação portuguesa corrente e transparente.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente direto e corrente do termo hebraico para o altar sacrificial.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica os filhos homens de Arão no contexto do serviço sacerdotal; não se generalizou para “filhos e filhas” ou “descendentes”.
- source_word: לְכַהֵן לִי
  choice: para me servirem como sacerdotes
  rationale: Comunica naturalmente a ação de exercer o sacerdócio em serviço a Deus, preservando tanto a função sacerdotal quanto o referente de לִי.
theological_decisions:
- issue: Linguagem de santidade ritual
  choice: consagrar
  alternative: santificar; tornar santo
  rationale: O contexto trata da separação ritual da tenda, do altar e dos sacerdotes para uso e serviço sagrados. “Consagrar” comunica esse sentido sem acrescentar uma transformação moral não expressa no versículo.
- issue: Referência masculina no sacerdócio aarônico
  choice: seus filhos
  alternative: seus descendentes; seus filhos e filhas
  rationale: O substantivo hebraico está no masculino e, neste contexto, designa especificamente os filhos de Arão destinados ao sacerdócio.
- issue: Relação expressa por לְכַהֵן לִי
  choice: para me servirem como sacerdotes
  alternative: para exercerem o sacerdócio para mim; para serem sacerdotes para mim
  rationale: A escolha mantém a finalidade e o serviço dirigido a Deus em português natural, enquanto a nota registra a forma mais literal e a amplitude possível da expressão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “consagrarei” preserva a estrutura e a ênfase do hebraico; “tenda do encontro” mantém a designação cultual tradicional sem arcaísmo excessivo.
