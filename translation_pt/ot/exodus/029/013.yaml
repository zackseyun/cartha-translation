base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: pt
  text: Depois, pegue toda a gordura que cobre as vísceras, o apêndice sobre o fígado[a], os dois rins e a gordura que está sobre eles, e queime tudo no altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o lobo do fígado”. O termo hebraico designa uma parte específica ligada ao fígado, mas sua identificação anatômica exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Depois, pegue
  rationale: O perfeito qal com waw, nesta sequência de instruções, tem força de ordem. “Pegue” é natural em português, e “Depois” explicita a progressão do procedimento.
- source_word: כָּל הַחֵלֶב
  choice: toda a gordura
  rationale: חֵלֶב designa as porções gordurosas do animal sacrificial. “Gordura” é claro, corrente e adequado ao contexto.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: que cobre as vísceras
  rationale: קֶרֶב refere-se aqui às partes ou aos órgãos internos. “Vísceras” é preciso e compreensível no contexto anatômico e sacrificial.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: o apêndice sobre o fígado
  rationale: יוֹתֶרֶת é um termo anatômico difícil, referente a uma parte associada ao fígado. “Apêndice” evita afirmar uma identificação moderna exata, e “sobre” preserva diretamente עַל.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: Equivalência anatômica direta e natural para כְּלָיוֹת.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: a gordura que está sobre eles
  rationale: A formulação mantém a relação espacial expressa por עֲלֵיהֶן sem substituí-la por uma interpretação mais específica.
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: e queime tudo no altar
  rationale: No contexto sacrificial, o hifil de קטר indica queimar a oferta no altar. “Tudo” reúne com clareza as partes enumeradas, e “no altar” expressa naturalmente a direção indicada pelo ה locativo/direcional.
