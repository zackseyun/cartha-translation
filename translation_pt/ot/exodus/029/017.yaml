base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: pt
  text: Depois, corte o carneiro em pedaços, lave as suas entranhas e pernas e coloque-as sobre os pedaços e sobre a cabeça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: o carneiro
  rationale: Em contexto sacrificial, אַיִל designa um carneiro adulto; esta é a forma portuguesa direta e tradicional.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: corte ... em pedaços
  rationale: O piel de נתח indica cortar ou dividir o animal em partes para o sacrifício; a expressão é clara e natural em português.
- source_word: קִרְבּוֹ
  choice: as suas entranhas
  rationale: Embora קֶרֶב possa designar genericamente o interior, nas instruções sacrificiais refere-se às partes internas que devem ser lavadas.
- source_word: כְרָעָיו
  choice: pernas
  rationale: כְּרָעַיִם refere-se às pernas, sobretudo às partes inferiores; 'pernas' é compreensível e não excessivamente técnico.
- source_word: וְנָתַתָּ עַל
  choice: coloque-as sobre
  rationale: Mantém o sentido espacial normal de עַל e o procedimento de dispor as partes lavadas sobre os pedaços e a cabeça.
- source_word: רֹאשׁוֹ
  choice: a cabeça
  rationale: Correspondência anatômica direta e natural.
theological_decisions: []
