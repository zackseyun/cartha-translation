  text: וְ/עָשִׂ֜יתָ לְ/אַהֲרֹ֤ן וּ/לְ/בָנָי/ו֙ כָּ֔כָה כְּ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֹתָ֑/כָה שִׁבְעַ֥ת יָמִ֖ים תְּמַלֵּ֥א יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: pt
  text: Faça assim com Arão e com seus filhos, conforme tudo o que lhe ordenei. Durante sete dias, você os consagrará para o sacerdócio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “encherá a mão deles”, expressão hebraica que indica consagrar ou investir alguém no serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: No contexto de instruções rituais, a forma verbal com וְ tem força diretiva. O imperativo em português comunica essa ordem de modo natural e claro.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: com Arão e com seus filhos
  rationale: A preposição לְ indica as pessoas às quais se aplica o procedimento ritual; em português, “fazer assim com” é mais idiomático do que “fazer assim para”.
- source_word: כָּכָה
  choice: assim
  rationale: O advérbio remete ao procedimento prescrito anteriormente e tem equivalente direto e natural em português.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: conforme tudo o que lhe ordenei
  rationale: Preserva tanto a ideia de conformidade quanto a abrangência de כְּכֹל. “Lhe” refere-se a Moisés, tratado no singular.
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: A expressão funciona como acusativo de duração. “Durante” explicita naturalmente em português a extensão temporal do rito, sem introduzir valor causal.
- source_word: תְּמַלֵּא יָדָם
  choice: você os consagrará para o sacerdócio
  rationale: A expressão idiomática literalmente significa “encher a mão deles”, mas neste contexto designa a investidura de Arão e seus filhos no serviço sacerdotal. A formulação escolhida comunica a consagração e a finalidade do rito sem recorrer ao idiomatismo opaco.
theological_decisions:
- issue: Tradução da expressão sacerdotal מִלֵּא יָד
  choice: consagrará para o sacerdócio
  alternative: encherá a mão deles; os investirá; os ordenará
  rationale: A expressão hebraica designa a instalação formal no ofício sacerdotal. “Consagrará para o sacerdócio” é clara para leitores atuais e evita associar o texto automaticamente a formas posteriores e denominacionais de ordenação. A imagem literal é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento “você” torna explícito o destinatário singular, Moisés. A construção evita arcaísmos e preserva a força imperativa e o caráter ritual do hebraico.
