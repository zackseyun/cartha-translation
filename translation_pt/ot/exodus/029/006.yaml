  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: pt
  text: Coloque o turbante na cabeça dele e ponha o diadema sagrado[a] sobre o turbante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a coroa sagrada”. O hebraico nézer pode designar um emblema consagrado semelhante a uma coroa; “diadema” destaca a peça ornamental sagrada usada sobre a cobertura sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Coloque
  rationale: O verbo שׂים significa pôr, colocar ou assentar. O imperativo em português expressa naturalmente a instrução ritual dada pela forma verbal hebraica neste contexto.
- source_word: הַמִּצְנֶפֶת
  choice: o turbante
  rationale: מִצְנֶפֶת designa a cobertura sacerdotal enrolada na cabeça. “Turbante” é claro e atual, sem as associações eclesiásticas potencialmente enganosas de “mitra”.
- source_word: עַל רֹאשׁוֹ
  choice: na cabeça dele
  rationale: A formulação é idiomática e inequívoca em português moderno, preservando a localização concreta indicada pelo hebraico.
- source_word: וְנָתַתָּ
  choice: e ponha
  rationale: נתן pode significar dar, pôr ou colocar. Aqui descreve o posicionamento de um objeto; “ponha” é natural e evita repetir “coloque”.
- source_word: אֵת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico de objeto direto definido e não possui equivalente lexical próprio em português.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: o diadema sagrado
  rationale: נֵזֶר denota aqui um emblema consagrado semelhante a uma coroa. “Diadema” distingue essa peça ornamental sacerdotal de uma coroa real completa; הַקֹּדֶשׁ é expresso naturalmente pelo adjetivo “sagrado”.
- source_word: עַל הַמִּצְנָפֶת
  choice: sobre o turbante
  rationale: 'Mantém a relação espacial indicada por עַל: o diadema é posto sobre a própria cobertura sacerdotal.'
