source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: pt
  text: Você oferecerá o segundo cordeiro ao entardecer[a]. Você o preparará com a oferta de cereal e a oferta de bebida correspondentes à manhã, como aroma agradável, uma oferta apresentada pelo fogo a Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “entre as tardes”, expressão que se refere ao fim da tarde ou ao período do crepúsculo.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma oferta de alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: o segundo cordeiro
  rationale: כֶּבֶשׂ designa um cordeiro ou ovino jovem próprio para o sacrifício; “segundo” mantém a sequência iniciada no versículo anterior.
- source_word: תַּעֲשֶׂה
  choice: você oferecerá / apresente
  rationale: Embora עשה signifique literalmente “fazer”, no contexto sacrificial o português idiomático pede “oferecer” ou “apresentar”.
- source_word: בֵּין הָעַרְבָּיִם
  choice: ao entardecer
  rationale: A expressão idiomática hebraica, literalmente “entre as tardes”, indica o fim da tarde ou o período do crepúsculo; a forma literal é registrada em nota.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: uma oferta de cereal, como fez pela manhã
  rationale: מִנְחָה, neste contexto ritual, é a oferta de cereal que acompanha o animal sacrificado.
- source_word: וּכְנִסְכָּהּ
  choice: uma oferta derramada
  rationale: נֶסֶךְ é uma oferta líquida vertida; “oferta derramada” comunica a ação ritual com mais clareza que o termo menos corrente “libação”.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: um aroma agradável
  rationale: Mantém a metáfora da fórmula sacrificial e expressa aceitação, sem explicitar além do que diz o hebraico.
- source_word: אִשֶּׁה
  choice: uma oferta feita pelo fogo
  rationale: A expressão preserva a designação cultual tradicional e evita confundi-la com a categoria específica do holocausto; a alternativa lexical “oferta de alimento” é indicada em nota.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino pessoal expresso pelo Tetragrama, em harmonia com a camada inglesa auditada e sem substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome da aliança, enquanto “SENHOR” representa a tradição reverencial de substituição.
- issue: Sentido da fórmula רֵיחַ נִיחֹחַ
  choice: um aroma agradável
  alternative: um aroma apaziguador
  rationale: A tradução conserva a imagem cultual e sua ambiguidade sem afirmar diretamente um mecanismo de apaziguamento ou uma doutrina específica sobre o sacrifício.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em três frases evita uma construção excessivamente pesada, sem alterar a sequência ritual. “Oferta derramada” é transparente ao leitor comum; “libação” foi evitado por ser menos corrente.
