  text: וְ/לָֽקַחְתָּ֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/נָתַתָּ֛ה עַל קַרְנֹ֥ת הַ/מִּזְבֵּ֖חַ בְּ/אֶצְבָּעֶ֑/ךָ וְ/אֶת כָּל הַ/דָּ֣ם תִּשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: pt
  text: Pegue um pouco do sangue do novilho[a] e, com o dedo, ponha-o sobre os chifres do altar[b]. Depois, derrame todo o sangue à base do altar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do sangue do novilho”; a expressão hebraica indica aqui que se pega uma porção do sangue.
    reason: lexical_alternative
  - marker: b
    text: Os “chifres” eram projeções em forma de chifre nos cantos do altar.
    reason: cultural_note
  - marker: c
    text: 'Ou: “junto à base do altar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pegue
  rationale: O perfeito qal com waw, nesta sequência de instruções rituais, tem força de ordem. O imperativo em português comunica essa função de maneira direta e natural.
- source_word: מִדַּם הַפָּר
  choice: um pouco do sangue do novilho
  rationale: 'A preposição מִן tem sentido partitivo no contexto: toma-se uma porção do sangue. “Novilho” é uma designação corrente e apropriada para o bovino sacrificial indicado por פַּר.'
- source_word: וְנָתַתָּה
  choice: ponha-o
  rationale: נתן tem o sentido amplo de dar ou pôr. “Ponha-o” é natural em português e o pronome explicita que o objeto aplicado é o sangue, sem acrescentar conteúdo ao texto.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: sobre os chifres do altar
  rationale: Mantém a imagem concreta de קַרְנוֹת, as projeções em forma de chifre nos cantos do altar, em vez de generalizá-las como meros “cantos”.
- source_word: בְּאֶצְבָּעֶךָ
  choice: com o dedo
  rationale: A preposição בְּ tem valor instrumental e especifica o meio pelo qual o sangue devia ser posto no altar.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: Depois, derrame todo o sangue
  rationale: שׁפך descreve o ato deliberado de derramar. “Todo o sangue” conserva כָּל הַדָּם sem inserir “restante”, embora o contexto indique que uma porção já foi usada.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: junto à base do altar
  rationale: יְסוֹד designa o fundamento ou a base. “Junto à base” expressa de modo natural o destino do derramamento, preservando alguma amplitude da preposição direcional אֶל.
theological_decisions:
- issue: Especificidade ritual das partes do altar
  choice: Manter “chifres” e “base” como elementos físicos concretos do altar.
  alternative: Traduzir como “cantos” e “pé” do altar.
  rationale: O versículo prescreve um rito preciso. A terminologia concreta preserva a configuração ritual e a textura teológica do sistema sacrificial sem impor uma interpretação doutrinária posterior.
- issue: Relação entre a porção aplicada e “todo o sangue” derramado
  choice: Conservar “todo o sangue” no segundo comando.
  alternative: Explicitar “todo o sangue restante”.
  rationale: Embora o contexto naturalmente suponha o sangue que sobrou após a aplicação de uma porção, “restante” não está expresso no hebraico. A tradução mantém a formulação abrangente e deixa a relação contextual implícita.
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais para a sequência de instruções. A redação conserva a terminologia ritual concreta e evita tanto arcaísmos quanto explicações interpretativas no corpo do versículo.
