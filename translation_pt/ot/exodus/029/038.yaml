lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: Isto é o que
  rationale: Reproduz de modo natural a construção introdutória e relativa hebraica, sem acrescentar um marcador temporal inexistente.
- source_word: תַּעֲשֶׂה
  choice: você oferecerá
  rationale: Embora o verbo tenha o sentido amplo de “fazer”, o contexto sacrificial e a menção do altar tornam “oferecer” a equivalência contextual mais clara.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Tradução direta e corrente da expressão preposicional no contexto de sacrifícios.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: cordeiros de um ano
  rationale: Expressa idiomaticamente em português a idade indicada pelo hebraísmo literal “filhos de um ano”.
- source_word: שְׁנַיִם לַיּוֹם
  choice: dois ... todos os dias
  rationale: Comunica naturalmente tanto o número quanto a distribuição diária.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Preserva a ideia de observância regular e ininterruptamente mantida do sacrifício diário.
