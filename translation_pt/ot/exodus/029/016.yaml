  yaml_path: translation/ot/exodus/029/016.yaml
  text: And you shall slaughter the ram, and take its blood and throw it against the altar all around.
translation:
  language: pt
  text: Você matará o carneiro, pegará o sangue dele e o lançará contra o altar, por todos os lados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Você matará
  rationale: O verbo שׁחט descreve o abate ritual do animal. Em português, “matará” comunica isso com clareza no contexto sacrificial, sem acrescentar uma especificação ausente no hebraico.
- source_word: הָאָיִל
  choice: o carneiro
  rationale: Equivalente direto e natural para אַיִל neste contexto.
- source_word: וְזָרַקְתָּ
  choice: e o lançará contra
  rationale: זרק significa lançar ou arremessar. A formulação preserva a ação vigorosa do hebraico e evita substituir o verbo por uma técnica ritual mais específica, como “aspergir”.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contra o altar, ao redor
  rationale: Neste rito, עַל admite o sentido de aplicação contra/sobre o altar, enquanto סָבִיב indica distribuição em seu entorno. A vírgula mantém “ao redor” ligado à aplicação do sangue no altar.
theological_decisions:
- issue: Modo de aplicação do sangue no altar
  choice: lançará contra o altar
  alternative: aspergirá sobre o altar
  rationale: O texto usa זרק, “lançar”, e não exige que a tradução defina a ação como aspersão. A escolha mantém a imagem concreta e não introduz uma precisão ritual além da forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com futuro prescritivo apropriado às instruções cultuais. O pronome “você” oferece ampla legibilidade brasileira; “sangue dele” evita a possível estranheza de “seu sangue” e deixa inequívoco que o sangue é do carneiro.
