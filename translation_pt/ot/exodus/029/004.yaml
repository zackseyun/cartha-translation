  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: pt
  text: Você levará Arão e seus filhos até a entrada da tenda do encontro[a] e os lavará com água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «apresentará Arão e seus filhos à entrada da tenda do encontro». O verbo hebraico também pode ter o sentido cultual formal de apresentar alguém para uma ação ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: fará ... se aproximarem
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. A formulação preserva a ideia de aproximação ritual sem tornar o português excessivamente rígido.
- source_word: אֶל
  choice: da entrada
  rationale: Na construção portuguesa «aproximar-se da entrada», a regência natural usa «de», embora o hebraico marque movimento em direção ao destino.
- source_word: פֶּתַח
  choice: entrada
  rationale: Designa a abertura ou o acesso à tenda e não pressupõe especificamente uma porta com folha.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Expressão clara e digna que conserva a noção do lugar designado para o encontro.
- source_word: וְרָחַצְתָּ
  choice: e os lavará
  rationale: O verbo רחץ significa lavar ou banhar. O futuro em sequência comunica adequadamente a instrução dirigida a Moisés.
- source_word: בַּמָּיִם
  choice: com água
  rationale: Expressa naturalmente em português o meio usado para a lavagem.
- source_word: אַהֲרֹן
  choice: Aarão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O termo se refere especificamente aos filhos homens de Aarão, relevantes no contexto da consagração sacerdotal.
theological_decisions:
- issue: Nuance cultual de קרב no contexto da ordenação sacerdotal
  choice: fará Aarão e seus filhos se aproximarem
  alternative: apresentará Aarão e seus filhos
  rationale: A escolha conserva o movimento de aproximação ao santuário e sua possível dimensão ritual, sem transformar implicitamente o verbo em um termo técnico mais específico do que o hebraico exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção «fará ... se aproximarem» mantém a nuance do causativo hebraico; «tenda do encontro» preserva a designação cultual sem recorrer a vocabulário denominacional.
