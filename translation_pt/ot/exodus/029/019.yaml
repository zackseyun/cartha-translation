  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: pt
  text: Depois, pegue o segundo carneiro, e Arão e seus filhos porão as mãos sobre a cabeça do carneiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Depois, pegue
  rationale: O perfeito qal com a conjunção prefixada integra uma sequência de instruções e tem força diretiva dirigida a Moisés. “Depois” exprime a progressão do rito, e “pegue” comunica a ordem com naturalidade no português atual.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: o segundo carneiro
  rationale: אַיִל designa um carneiro, e הַשֵּׁנִי é o ordinal “segundo”, em referência ao segundo animal dessa espécie na sequência da consagração.
- source_word: וְסָמַךְ
  choice: porão
  rationale: No contexto sacrificial, סמך descreve o ato ritual de pôr ou apoiar as mãos sobre o animal. Com o complemento explícito “as mãos”, “porão” é claro, natural e não acrescenta uma explicação simbólica.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Arão e seus filhos
  rationale: בָּנִים refere-se aqui aos filhos homens de Arão que participam da consagração sacerdotal; “filhos” preserva essa precisão contextual.
- source_word: אֶת יְדֵיהֶם
  choice: as mãos
  rationale: O hebraico emprega o plural, referente ao sujeito composto. “As mãos” mantém o número gramatical e forma a expressão idiomática “pôr as mãos sobre”.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sobre a cabeça do carneiro
  rationale: 'A expressão espacial é direta: עַל corresponde naturalmente a “sobre”, e רֹאשׁ permanece no singular porque se refere à cabeça do único carneiro.'
theological_decisions:
- issue: Representação do rito de imposição das mãos sem importar uma explicação teológica posterior
  choice: porão as mãos sobre a cabeça do carneiro
  alternative: apoiarão as mãos sobre a cabeça do carneiro
  rationale: A tradução descreve concretamente o gesto ritual, como faz o versículo, sem afirmar que ele simboliza transferência de culpa, identificação, ordenação ou qualquer outra interpretação não explicitada no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “pegue” trata Moisés no singular; o futuro “porão” distingue a ação subsequente de Arão e seus filhos. Não são necessárias notas de rodapé neste versículo.
