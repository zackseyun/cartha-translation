  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: pt
  text: e um pão redondo, um bolo de pão com azeite e um pão fino, do cesto dos pães sem fermento que está diante de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido «SENHOR».'
    reason: Esclarece a forma hebraica do nome divino e a alternativa tradicional de tradução.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: pão redondo
  rationale: כִּכָּר designa aqui um pão de formato arredondado. A explicitação do formato diferencia este item do bolo mencionado em seguida.
- source_word: אַחַת / אֶחָד
  choice: um
  rationale: O numeral identifica uma unidade de cada item. Em português, o primeiro «um» pode reger naturalmente a enumeração, sem perder a precisão ritual dos três itens individuais.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: bolo de pão com azeite
  rationale: חַלָּה indica um bolo ou pão, enquanto שֶׁמֶן especifica o uso de óleo. «Com azeite» é natural no contexto alimentar e evita afirmar, além do hebraico deste versículo, exatamente como o azeite foi incorporado.
- source_word: רָקִיק
  choice: pão fino
  rationale: רָקִיק é um pão ou bolo delgado. «Pão fino» comunica sua característica principal em linguagem corrente, evitando termos regionais ou pouco conhecidos como «coscorão» e «obreia».
- source_word: מִסַּל הַמַּצּוֹת
  choice: tirados do cesto dos pães sem fermento
  rationale: מִן indica a origem dos três itens, e סַל significa «cesto». O particípio plural «tirados» deixa clara a relação sintática da expressão com toda a enumeração.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: que está diante de Yahweh
  rationale: Preserva o sentido espacial e cultual de לִפְנֵי, sem acrescentar que o cesto foi formalmente apresentado ou colocado ali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o caráter de nome próprio; a nota informa a forma consonantal hebraica e a tradição de substituí-la por um título.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário compreensível no Brasil e em outras comunidades lusófonas. Mantém a construção coordenada do contexto anterior e a precisão da lista ritual.
