  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: pt
  text: Você abaterá o novilho diante de Yahweh, à entrada da tenda do encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”. Outras formas incluem “Yahweh” e “Jeová”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Você matará
  rationale: O perfeito qal com conjunção, dentro desta sequência de instruções rituais, tem força prescritiva. “Matará” é natural em português e, no contexto sacrificial, comunica o abate sem acrescentar uma especificação ausente do verbo.
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho, frequentemente jovem, em contextos sacrificiais. “Novilho” é a forma consagrada e clara em português bíblico para este animal.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa literalmente “diante de/na presença de”; “diante de” preserva de modo natural a dimensão espacial e sacral da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto hebraico traz o nome divino YHWH. “Yahweh” o representa como nome próprio, em vez de substituí-lo por um título.
- source_word: פֶּתַח
  choice: à entrada
  rationale: פֶּתַח indica a entrada ou abertura de um lugar. “À entrada” é idiomático e preciso para a localização ritual.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: A expressão designa o santuário onde ocorre o encontro divino. “Tenda do encontro” mantém seus componentes e é compreensível em português atual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega diretamente o Tetragrama, o texto principal preserva o nome pessoal na forma “Yahweh”. A nota registra a substituição tradicional e outra forma conhecida, sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. A ordem da frase acompanha o hebraico sem artificialidade; a conjunção inicial não foi reproduzida, pois em português isolado ela é dispensável numa sequência instrucional. O marcador [a] aparece no texto principal.
