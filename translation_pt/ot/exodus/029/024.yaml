  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: pt
  text: Ponha tudo isso sobre as palmas das mãos de Arão e sobre as palmas das mãos de seus filhos[a] e mova-as como oferta movida diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sobre as palmas de Arão e sobre as palmas de seus filhos”. Algumas traduções empregam o termo mais amplo “mãos”, mas a palavra hebraica designa mais especificamente as palmas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Ponha
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força de ordem. “Ponha” é natural, claro e digno em português moderno.
- source_word: הַכֹּל
  choice: tudo isso
  rationale: Retoma o conjunto das porções mencionadas no contexto anterior; “isso” explicita de modo natural a referência retrospectiva.
- source_word: עַל כַּפֵּי
  choice: sobre as palmas das mãos de
  rationale: כַּף designa mais especificamente a palma, embora possa representar a mão; a formulação preserva a imagem concreta do ritual sem soar incompleta em português.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בָנָיו
  choice: seus filhos
  rationale: No contexto da consagração sacerdotal, refere-se especificamente aos filhos homens de Arão.
- source_word: וְהֵנַפְתָּ
  choice: e mova
  rationale: O hifil de נוף indica o gesto ritual de mover ou agitar a oferta. “Mover”, combinado com o termo técnico “oferta movida”, comunica a ação sem especificar uma direção que o texto não informa.
- source_word: אֹתָם
  choice: essas porções
  rationale: O pronome masculino plural retoma os vários elementos colocados nas palmas. A explicitação evita a ambiguidade que “os” ou “isso” produziria em português.
- source_word: תְּנוּפָה
  choice: como oferta movida
  rationale: O substantivo designa a apresentação ritual por movimento; “oferta movida” é uma expressão cultual reconhecível e mantém a ligação lexical com o verbo.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” reproduz naturalmente a ideia de presença cultual, e “Yahweh” representa o nome divino explícito no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva essa função e evita substituí-lo por um título; “Jeová” reflete uma vocalização híbrida posterior.
- issue: Sentido ritual de נוף / תְּנוּפָה
  choice: mova ... como oferta movida
  alternative: agite ... como oferta agitada; apresente ... como oferta de apresentação
  rationale: A tradução mantém a conexão entre verbo e substantivo e não resolve além do texto a forma ou direção exata do movimento ritual.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A repetição hebraica foi levemente condensada no texto principal, enquanto a forma integral foi preservada na nota. O imperativo foi empregado para refletir a força instrucional da sequência.
