  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: pt
  text: Consagre o peito da oferta movida, que foi movido, e a coxa da contribuição[a], que foi levantada, do carneiro da ordenação[b], das porções destinadas a Arão e a seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a coxa da oferta levantada”; tradicionalmente, “oferta alçada”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o carneiro dos enchimentos”, expressão que designa o carneiro usado na ordenação ou consagração sacerdotal.'
    reason: cultural_note
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Consagre
  rationale: O piel de קדשׁ indica separar como santo. “Consagrar” é natural no contexto ritual e conserva sua força cultual.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: o peito da oferta movida
  rationale: “Peito” designa a porção do animal, e “oferta movida” conserva a relação lexical com o verbo נוף, que descreve o gesto ritual.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: a coxa da contribuição
  rationale: שׁוֹק é a coxa ou parte superior da perna; תְּרוּמָה designa uma contribuição separada e apresentada a Deus. A nota registra uma alternativa que explicita o gesto de levantar.
- source_word: אֲשֶׁר הוּנַף וַאֲשֶׁר הוּרָם
  choice: que foram movidos e levantados
  rationale: Os particípios passivos retomam, respectivamente, o peito e a coxa. O plural em português torna clara essa referência conjunta e mantém distintos os dois gestos rituais.
- source_word: אֵיל הַמִּלֻּאִים
  choice: o carneiro da ordenação
  rationale: A expressão literalmente ligada a “enchimentos” é um idioma para o carneiro empregado na investidura sacerdotal; “ordenação” comunica essa função de modo claro.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: tanto da porção de Arão como da porção de seus filhos
  rationale: A explicitação de “porção” transmite naturalmente a construção distributiva e evita a ambiguidade pouco idiomática de uma formulação possessiva literal.
theological_decisions:
- issue: Tradução dos termos técnicos do ritual sacrificial
  choice: Manter a linguagem concreta de “oferta movida”, “contribuição”, “movidos” e “levantados”.
  alternative: Generalizar como “oferta apresentada” ou “porção especial”.
  rationale: O texto vincula deliberadamente substantivos e verbos aos gestos rituais. Preservar essas distinções mantém a transparência ao hebraico sem impor interpretação teológica posterior.
- issue: Sentido de אֵיל הַמִּלֻּאִים
  choice: carneiro da ordenação
  alternative: carneiro da consagração; literalmente, carneiro dos enchimentos
  rationale: No contexto, a expressão identifica o animal usado no rito de instalação dos sacerdotes. “Ordenação” é compreensível, enquanto a nota conserva o idioma hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais tanto no Brasil como em outros contextos lusófonos. Os termos rituais concretos foram preservados, e as alternativas tradicionais ou literais foram colocadas em notas.
