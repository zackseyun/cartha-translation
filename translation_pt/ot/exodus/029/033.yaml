base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: pt
  text: Eles comerão as coisas com as quais se fez expiação[a], para ordená-los[b] e consagrá-los; mas quem não estiver autorizado[c] não comerá delas, porque são santas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também: “por meio das quais se fez expiação”. O hebraico apresenta essas coisas como o meio da expiação, sem indicar explicitamente nesta oração por quem ela foi feita.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “encher a mão deles”, expressão hebraica usada para a investidura ou ordenação sacerdotal.
    reason: lexical_alternative
  - marker: c
    text: Isto é, alguém não autorizado a participar do rito sacerdotal; não significa necessariamente uma pessoa estrangeira por etnia.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: Eles comerão as coisas
  rationale: O imperfeito com waw tem força instrutiva no contexto ritual. “As coisas” explicita de modo discreto que o pronome retoma as porções sacrificiais mencionadas anteriormente.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: com as quais se fez expiação
  rationale: A preposição ב com o passivo de כפר indica aqui o meio ou instrumento da expiação. A formulação evita acrescentar um beneficiário que não está expresso nessa oração.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: para ordená-los
  rationale: A expressão literalmente significa “encher a mão deles”, mas funciona como idioma técnico para a investidura no sacerdócio. “Ordená-los” comunica esse sentido sem reproduzir uma imagem que seria opaca em português.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: e consagrá-los
  rationale: No contexto sacerdotal, קדשׁ indica separar alguém como santo para o serviço sagrado. “Consagrar” é natural e mantém o registro cultual.
- source_word: וְזָר
  choice: mas quem não estiver autorizado
  rationale: זר designa neste contexto alguém de fora do grupo habilitado a participar do rito sacerdotal, e não necessariamente um estrangeiro em sentido étnico.
- source_word: לֹא יֹאכַל
  choice: não comerá delas
  rationale: Mantém a forma direta da proibição e explicita em português o objeto retomado do contexto.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: porque são santas
  rationale: A oração apresenta a santidade das porções como razão para a proibição. O feminino plural concorda naturalmente com “as coisas”.
theological_decisions:
- issue: Sentido de כפר no rito sacrificial
  choice: se fez expiação
  alternative: se realizou o rito de expiação
  rationale: “Expiação” conserva o peso cultual do termo sem restringi-lo silenciosamente a uma teoria específica de como o rito opera.
- issue: Relação expressa por בָהֶם
  choice: com as quais
  alternative: por meio das quais
  rationale: A tradução preserva o valor instrumental da preposição. Não se acrescenta “por eles”, pois o hebraico dessa oração não expressa de maneira inequívoca um beneficiário.
- issue: Idioma sacerdotal מִלֵּא יָד
  choice: ordená-los
  alternative: investi-los no sacerdócio
  rationale: O sentido contextual é a instalação sacerdotal. “Ordenar” é conciso e compreensível, enquanto a nota conserva a forma literal hebraica e evita associá-la exclusivamente a estruturas denominacionais posteriores.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe acompanha a sequência ritual do hebraico, enquanto os termos técnicos são traduzidos de modo acessível e esclarecidos em notas.
