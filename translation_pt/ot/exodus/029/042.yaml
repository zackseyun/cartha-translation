  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: pt
  text: Será um holocausto regular[a], por todas as suas gerações, à entrada da tenda do encontro, diante de Yahweh, onde me encontrarei com vocês[b], para falar ali com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um holocausto contínuo» ou «um holocausto perpétuo».
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa do plural («com vocês») ao singular («falar com você»), provavelmente distinguindo o grupo mais amplo de Moisés, a quem Deus se dirige especificamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: um holocausto regular
  rationale: עֹלָה é o termo sacrificial usual para uma oferta totalmente queimada, tradicionalmente chamada de “holocausto”; תָּמִיד indica regularidade contínua, isto é, uma oferta prescrita e recorrente.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão indica vigência ao longo das sucessivas gerações e soa natural em português.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: פֶּתַח designa a entrada ou abertura, e אֹהֶל מוֹעֵד é a tenda onde ocorre o encontro designado com Deus.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי tem sentido espacial e cultual de “diante de”, e o nome divino é transliterado como Yahweh.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: onde me encontrarei com vocês
  rationale: O nifal de יעד expressa um encontro marcado; “onde” incorpora naturalmente o primeiro שָׁמָּה, enquanto “vocês” preserva o plural לָכֶם.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: para ali falar com você
  rationale: O infinitivo indica finalidade; אֵלֶיךָ está no singular, provavelmente dirigindo-se especificamente a Moisés, e שָׁם é preservado por “ali”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Mudança do plural לָכֶם para o singular אֵלֶיךָ
  choice: “com vocês” e depois “com você”
  alternative: Harmonizar ambos os pronomes no plural ou no singular
  rationale: A mudança de número é explícita no hebraico e pode distinguir a comunidade mais ampla de Moisés, a quem Deus fala; por isso, não deve ser eliminada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Holocausto” mantém o termo bíblico sacrificial consolidado; “regular” evita sugerir uma ação literalmente ininterrupta. A ordem foi levemente ajustada para fluência, sem apagar a repetição locativa nem a mudança de número dos pronomes.
