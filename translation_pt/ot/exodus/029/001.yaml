  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: pt
  text: 'E isto é o que você fará para consagrá-los, a fim de que me sirvam como sacerdotes: tome um novilho do rebanho e dois carneiros sem defeito[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um touro do rebanho”. O hebraico diz literalmente “um touro, filho do gado”, expressão que designa um bovino do rebanho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem mancha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: o que
  rationale: Neste contexto, a construção portuguesa “isto é o que você fará” expressa com naturalidade o sentido de “esta é a coisa/o procedimento”, sem a rigidez de “esta é a coisa”.
- source_word: תַּעֲשֶׂה
  choice: você fará
  rationale: O imperfeito tem força instrutiva. O futuro em português mantém o tom diretivo e solene do texto.
- source_word: לְקַדֵּשׁ
  choice: consagrá-los
  rationale: No contexto sacerdotal, o verbo indica separar pessoas para o serviço sagrado; “consagrar” é claro e corrente em português.
- source_word: לְכַהֵן לִי
  choice: a fim de que me sirvam como sacerdotes
  rationale: Explicita a finalidade da consagração e preserva tanto o exercício do ofício sacerdotal quanto sua orientação para Deus.
- source_word: לְקַח
  choice: tome
  rationale: O imperativo “tome” traduz diretamente a ordem e soa natural em instruções rituais.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho do rebanho
  rationale: A expressão designa um bovino macho do gado, provavelmente jovem. “Novilho do rebanho” é natural e evita o literalismo opaco “filho do gado”.
- source_word: אֵילִם שְׁנַיִם
  choice: dois carneiros
  rationale: Traduz de modo direto o substantivo e o numeral explícito.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No uso sacrificial, descreve animais sem defeito físico. A expressão é clara e evita que “perfeitos” seja entendida em sentido absoluto ou moral.
theological_decisions:
- issue: Linguagem da função sacerdotal
  choice: a fim de que me sirvam como sacerdotes
  alternative: para exercerem o sacerdócio diante de mim
  rationale: A formulação mantém o ofício sacerdotal e o serviço prestado a Deus sem introduzir associações eclesiásticas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o caráter de instrução ritual sem soar excessivamente literal.
