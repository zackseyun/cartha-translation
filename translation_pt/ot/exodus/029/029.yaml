base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: pt
  text: E as vestes sagradas de Arão pertencerão a seus filhos depois dele, para que, vestidos com elas, sejam ungidos e investidos no sacerdócio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “encher-lhes a mão”. É uma expressão sacerdotal para investir ou instalar alguém no ofício.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: as vestes sagradas
  rationale: A expressão designa roupas separadas para o serviço sacerdotal. “Vestes sagradas” é natural, digna e conserva o sentido cultual.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: de Arão
  rationale: O לְ indica posse ou atribuição; em português, “de Arão” expressa isso com concisão.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: pertencerão a seus filhos depois dele
  rationale: Mantém a ideia de que as vestes passam aos filhos de Arão na sucessão sacerdotal, sem especificar além do hebraico quais deles as receberão.
- source_word: לְמָשְׁחָה בָהֶם
  choice: para que, vestidos com elas, sejam ungidos
  rationale: O sufixo preposicional בָהֶם indica que a unção ocorre enquanto eles usam as vestes, e não que as vestes sejam o instrumento da unção.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: e consagrados ao sacerdócio
  rationale: מִלֵּא אֶת־הַיָּד, literalmente “encher a mão”, é uma expressão técnica para instalar alguém no ofício sacerdotal. A tradução funcional é clara no texto, e a imagem hebraica é registrada em nota.
theological_decisions:
- issue: Tradução da expressão sacerdotal מִלֵּא אֶת־הַיָּד
  choice: consagrados ao sacerdócio
  alternative: tenham a mão enchida; sejam ordenados; sejam investidos
  rationale: A formulação escolhida comunica a instalação no sacerdócio em português corrente e evita que “ordenados” evoque exclusivamente práticas eclesiásticas posteriores. A nota preserva a forma literal e outras equivalências possíveis.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vestes” preserva o tom digno; “vestidos com elas” evita o pouco natural “nelas” e esclarece o valor circunstancial de בָהֶם. O marcador [a] aparece após a expressão explicada.
