translation:
  language: pt
  text: Pegue o carneiro da ordenação[a] e ferva a sua carne num lugar santo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da consagração”. O termo hebraico se refere ao rito de investidura sacerdotal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no Lugar Santo”; porém, mais literalmente, o hebraico diz “num lugar santo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: carneiro
  rationale: É o termo português comum e preciso para o animal sacrificial macho.
- source_word: הַמִּלֻּאִים
  choice: da ordenação
  rationale: No contexto sacerdotal, o termo designa o rito de investidura no ofício; “ordenação” comunica essa função técnica com clareza.
- source_word: תִּקָּח
  choice: Pegue
  rationale: O imperativo natural em português transmite adequadamente a força diretiva do imperfeito hebraico nesta sequência de instruções.
- source_word: וּבִשַּׁלְתָּ
  choice: e cozinhe em água
  rationale: O verbo indica cozinhar, particularmente por fervura; a formulação evita sugerir que a carne em si deva ser levada ao ponto de ebulição.
- source_word: בְּשָׂרוֹ
  choice: a carne dele
  rationale: “Carne” é natural em português para a parte comestível do animal e, com “dele”, mantém claro o referente.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: num lugar santo
  rationale: A expressão hebraica não tem artigo e não exige identificação com o compartimento técnico chamado Lugar Santo.
theological_decisions:
- issue: Sentido do termo cultual הַמִּלֻּאִים no contexto da instalação sacerdotal
  choice: o carneiro da ordenação
  alternative: o carneiro da consagração
  rationale: As duas opções são possíveis. “Ordenação” salienta a investidura sacerdotal específica, sem excluir o aspecto de consagração; a alternativa é preservada em nota.
- issue: Se בְּמָקוֹם קָדֹשׁ designa genericamente um local santo ou tecnicamente o Lugar Santo
  choice: num lugar santo
  alternative: no Lugar Santo
  rationale: A construção hebraica sem artigo favorece a formulação genérica e não obriga a identificar o local com o compartimento do santuário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos naturais. “Cozinhe em água” expressa com clareza o método indicado pelo verbo hebraico, enquanto as notas preservam as alternativas cultuais relevantes.
