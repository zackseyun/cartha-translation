base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: pt
  text: E você pegará do carneiro a gordura, a cauda gorda, a gordura que cobre as vísceras, o lóbulo do fígado, os dois rins com a gordura que está sobre eles e a coxa direita, pois é um carneiro de ordenação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um carneiro de consagração” ou “um carneiro de investidura”. A expressão hebraica se refere ao carneiro usado no rito que investia os sacerdotes em seu ofício.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: E você pegará
  rationale: O waw seguido do perfeito dá continuidade à sequência de instruções; o futuro em português preserva o caráter diretivo e o fluxo do procedimento.
- source_word: חֵלֶב
  choice: gordura
  rationale: No contexto sacrificial, designa as porções de gordura reservadas para a oferta; “gordura” é direto, claro e tradicional sem perder a concretude.
- source_word: אַלְיָה
  choice: cauda gorda
  rationale: O termo indica especificamente a cauda rica em gordura das ovelhas, e não apenas uma cauda genérica.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: que cobre as vísceras
  rationale: Expressa de modo natural a gordura que recobre os órgãos internos; “vísceras” é preciso e compreensível no contexto ritual.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: o lóbulo do fígado
  rationale: A identificação anatômica exata é discutida, mas “lóbulo do fígado” é uma formulação convencional e inteligível para a porção sacrificial.
- source_word: כְּלָיֹת
  choice: rins
  rationale: O substantivo denota diretamente os rins em sentido anatômico.
- source_word: שׁוֹק הַיָּמִין
  choice: a coxa direita
  rationale: No vocabulário de porções sacrificiais, שׁוֹק indica a parte superior da perna; “coxa” é mais específica que “perna”.
- source_word: אֵיל מִלֻּאִים
  choice: um carneiro de ordenação
  rationale: A expressão identifica o carneiro empregado no rito que investe os sacerdotes em seu ofício. “Ordenação” comunica esse sentido ritual de forma concisa, enquanto alternativas legítimas são preservadas em nota.
theological_decisions:
- issue: Terminologia da investidura sacerdotal em אֵיל מִלֻּאִים
  choice: um carneiro de ordenação
  alternative: um carneiro de consagração; um carneiro de investidura
  rationale: O contexto é o rito pelo qual Arão e seus filhos são introduzidos no serviço sacerdotal. “Ordenação” comunica a função do rito sem definir uma estrutura eclesiástica posterior; a nota preserva outras traduções possíveis do idioma hebraico ligado ao ato de “encher” as mãos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A enumeração anatômica foi mantida em sequência clara, e a terminologia ritual evita tanto arcaísmos desnecessários quanto especificações denominacionais.
