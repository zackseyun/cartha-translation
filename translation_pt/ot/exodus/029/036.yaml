  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: pt
  text: A cada dia, oferecerá um novilho como oferta pelo pecado, para expiação[a]. Purificará o altar ao fazer expiação por ele e o ungirá para consagrá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um novilho como oferta de purificação”. O termo hebraico חַטָּאת pode indicar tanto “pecado” como, em contextos sacrificiais, a oferta usada para purificação do pecado ou da impureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: novilho
  rationale: No contexto sacrificial, פַר designa um bovino macho; “novilho” é a formulação tradicional e corrente em português, sem exigir uma especificação etária mais precisa do que o termo permite.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: Em contexto sacrificial, חַטָּאת designa a oferta ligada à remoção ritual do pecado ou da impureza. “Oferta pelo pecado” é clara e estabelecida; a alternativa “oferta de purificação” é preservada em nota.
- source_word: לַיּוֹם
  choice: Todos os dias
  rationale: A expressão tem sentido distributivo no ritual repetido; “todos os dias” é natural e clara em português.
- source_word: עַל הַכִּפֻּרִים
  choice: para expiação
  rationale: O plural hebraico se refere aos atos ou ritos expiatórios; o singular abstrato “expiação” comunica naturalmente esse sentido em português.
- source_word: וְחִטֵּאתָ
  choice: Purificará
  rationale: O piel de חטא, tendo o altar como objeto, indica purificação ritual, não perdão moral do altar.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente padrão e inequívoco de מִזְבֵּחַ neste contexto cultual.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: ao fazer expiação por ele
  rationale: A preposição com o infinitivo admite valor temporal ou instrumental. “Ao fazer” preserva essa proximidade sem tornar rígida a relação; o pronome se refere naturalmente ao altar.
- source_word: וּמָשַׁחְתָּ
  choice: o ungirá
  rationale: “Ungir” preserva o sentido ritual específico de aplicar óleo para dedicação sagrada.
- source_word: לְקַדְּשׁוֹ
  choice: para consagrá-lo
  rationale: Aqui קדשׁ significa separar o altar como santo para uso sagrado; “consagrar” expressa isso de modo natural e digno.
theological_decisions:
- issue: Linguagem ritual de purificação e expiação sem importação de categorias doutrinárias posteriores
  choice: “oferta pelo pecado”, “purificará” e “fazer expiação” em sentido ritual ligado ao altar
  alternative: “oferta de purificação”; “limpar do pecado”; “fazer uma oferta pelo pecado em favor do altar”
  rationale: O versículo trata da consagração ritual do altar. A redação mantém as categorias cultuais hebraicas e evita sugerir que o altar tenha culpa moral.
- issue: Relação expressa por בְּכַפֶּרְךָ עָלָיו
  choice: “ao fazer expiação por ele”
  alternative: “fazendo expiação por ele” ou “quando fizer expiação sobre ele”
  rationale: A construção pode ser temporal ou instrumental, e עָלָיו pode suscitar a ideia espacial de ação sobre o altar. A opção adotada é natural e acompanha a referência mais provável ao altar sem ampliar o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém terminologia ritual bíblica reconhecível, evita arcaísmos desnecessários e preserva em nota a nuance purificatória de חַטָּאת.
