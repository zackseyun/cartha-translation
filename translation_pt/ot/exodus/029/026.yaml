base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: pt
  text: Depois, tome o peito do carneiro da ordenação destinado a Arão[a] e apresente-o como oferta movida diante de Yahweh; ele será sua porção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “carneiro da consagração”. O termo técnico hebraico se refere ao carneiro usado no rito de investidura sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: o peito
  rationale: No contexto sacrificial, חָזֶה designa a porção do peito do animal; “peito” é o termo anatômico e ritual natural em português.
- source_word: אֵיל הַמִּלֻּאִים
  choice: carneiro da ordenação
  rationale: אַיִל é “carneiro”, e מִלֻּאִים é o termo técnico do rito de investidura sacerdotal. “Ordenação” comunica a instalação de Arão no ofício sem recorrer ao literal e obscuro “enchimentos”.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: destinado a Arão
  rationale: A construção associa o carneiro especificamente a Arão. “Destinado a” expressa essa relação sem sugerir necessariamente propriedade.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: mova-o como oferta movida
  rationale: O verbo e o substantivo cognato formam uma expressão ritual. A formulação conserva a repetição lexical e identifica o gesto como oferta cultual.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” é uma tradução natural de לִפְנֵי em contexto cultual, e “Yahweh” preserva o nome divino.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: essa será a sua porção
  rationale: מָנָה denota uma parte atribuída. “Sua porção” é claro, conciso e apropriado à distribuição sacerdotal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração “Yahweh” o preserva em vez de substituí-lo por um título.
- issue: Sentido técnico de הַמִּלֻּאִים no rito sacerdotal
  choice: ordenação
  alternative: consagração
  rationale: O contexto trata da instalação de Arão no ofício sacerdotal. “Ordenação” destaca essa investidura, enquanto “consagração” continua sendo uma tradução legítima e aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativo natural para a instrução ritual. Mantém-se a terminologia cultual “oferta movida” e o nome “Yahweh”; a nota registra a alternativa lexical genuína.
