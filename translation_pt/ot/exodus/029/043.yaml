base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: pt
  text: Ali me encontrarei com os filhos de Israel[a], e será santificado pela minha glória.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”, uma expressão comum para designar o povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: O hebraico não explicita o sujeito de “será santificado”. A referência pode ser, de modo geral, ao espaço sagrado em vista ou, mais especificamente, à tenda do encontro ou ao altar.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: me encontrarei com
  rationale: O nifal de יעד, no contexto do santuário, indica um encontro marcado entre Deus e seu povo. A formulação conserva a ideia de encontro sem acrescentar a noção de mera presença ou revelação.
- source_word: שָׁמָּה
  choice: Ali
  rationale: Advérbio de lugar que retoma o local do santuário mencionado no contexto anterior; “Ali” é natural e preciso em português.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: com os filhos de Israel
  rationale: A preposição ל com יעד admite aqui o sentido relacional “com”. “Filhos de Israel” preserva a expressão hebraica pactual, enquanto a nota registra o equivalente idiomático.
- source_word: וְנִקְדַּשׁ
  choice: o lugar será santificado
  rationale: O nifal de קדש expressa ser tornado santo ou consagrado. Como o verbo hebraico não explicita o sujeito, “o lugar” oferece uma referência geral ao espaço sagrado em vista sem escolher definitivamente entre a tenda e o altar.
- source_word: בִּכְבֹדִי
  choice: pela minha glória
  rationale: A preposição ב é entendida instrumentalmente, e כבוד designa a glória manifesta de Deus como aquilo por meio do qual o local é santificado.
theological_decisions:
- issue: Sujeito implícito de וְנִקְדַּשׁ
  choice: “o lugar será santificado”, com referência geral ao espaço sagrado em vista
  alternative: “ela será santificada”, referindo-se especificamente à tenda do encontro; “ele será santificado”, referindo-se ao altar; ou referência a Arão
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas não traz sujeito expresso. O contexto aponta para o âmbito do santuário, embora não determine inequivocamente a tenda ou o altar. A formulação geral no texto e a nota preservam essa ambiguidade.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A tradução formal conserva a expressão hebraica tradicional e pactual. A nota esclarece seu sentido coletivo, que abrange o povo de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se “filhos de Israel” por transparência ao hebraico. “Santificado” mantém o valor passivo e cultual do verbo; “o lugar” evita um pronome sem antecedente claro em português, e a nota documenta a ambiguidade do original.
