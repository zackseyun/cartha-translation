base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: pt
  text: Você levará o novilho diante da tenda do encontro[a], e Arão e seus filhos colocarão as mãos sobre a cabeça do novilho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apresentará” ou “fará chegar o novilho diante da tenda do encontro”.
    reason: Alternativa lexical para וְהִקְרַבְתָּ, cujo sentido sacrificial pode ser levar para perto ou apresentar.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Você levará
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar, especialmente em contexto sacrificial. “Levará” é claro e natural, enquanto a expressão seguinte conserva a ideia de aproximação ritual.
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho, frequentemente jovem, destinado ao sacrifício. “Novilho” é corrente no português bíblico e adequado ao contexto ritual.
- source_word: לִפְנֵי
  choice: para diante de
  rationale: Expressa movimento até uma posição diante ou na presença da tenda; “para diante de” preserva tanto a direção quanto a localização.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução transparente da designação do santuário, entendendo מוֹעֵד como encontro designado, sem substituir o termo por uma interpretação institucional.
- source_word: וְסָמַךְ
  choice: colocarão
  rationale: No rito sacrificial, סמך descreve pôr ou apoiar as mãos sobre a cabeça do animal. “Colocarão as mãos” comunica o gesto concretamente em português atual.
- source_word: יְדֵיהֶם
  choice: as mãos
  rationale: Conserva o plural hebraico e a ação coletiva de Arão e seus filhos.
- source_word: עַל רֹאשׁ הַפָּר
  choice: sobre a cabeça do novilho
  rationale: Mantém a localização física precisa do gesto em linguagem natural.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Arão e seus filhos
  rationale: בָּנָיו refere-se aos filhos homens de Arão envolvidos na consagração sacerdotal.
theological_decisions:
- issue: Imposição das mãos sobre o animal sacrificial
  choice: colocarão as mãos sobre a cabeça do novilho
  alternative: apoiarão as mãos sobre a cabeça do novilho
  rationale: A tradução descreve somente o ato ritual afirmado pelo texto, sem acrescentar uma explicação sobre transferência de culpa, identificação ou outro significado teológico não explicitado neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A forma “Você levará” conserva a instrução direta no singular; “tenda do encontro” mantém a designação cultual de modo transparente. O marcador [a] aparece no texto principal.
