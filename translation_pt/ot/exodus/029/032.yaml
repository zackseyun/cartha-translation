base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: pt
  text: Arão e seus filhos comerão a carne do carneiro e o pão que está no cesto, à entrada da tenda do encontro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָכַל
  choice: comerão
  rationale: O qatal com waw, neste contexto de instruções rituais, tem valor prospectivo e prescritivo. O futuro em português preserva esse valor sem introduzir um verbo modal ausente do hebraico.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וּ/בָנָי/ו
  choice: e seus filhos
  rationale: O substantivo se refere especificamente aos filhos homens de Arão que participam do rito de ordenação sacerdotal.
- source_word: בְּשַׂר
  choice: a carne
  rationale: Embora o termo hebraico denote literalmente carne ou corpo carnal, neste contexto sacrificial refere-se à carne comestível do animal; “carne” conserva naturalmente ambos os aspectos em português.
- source_word: הָ/אַיִל
  choice: do carneiro
  rationale: אַיִל designa um carneiro, aqui o animal sacrificial mencionado no rito de ordenação.
- source_word: הַ/לֶּחֶם
  choice: o pão
  rationale: לֶחֶם significa normalmente “pão”; o singular tem sentido coletivo no contexto dos pães colocados no cesto.
- source_word: אֲשֶׁר בַּ/סָּל
  choice: que está no cesto
  rationale: A oração relativa identifica o pão por sua localização no cesto ritual.
- source_word: פֶּתַח
  choice: à entrada da
  rationale: פֶּתַח indica a entrada ou abertura de um lugar; a formulação escolhida é natural e mantém o valor locativo.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da expressão cultual hebraica, que designa a tenda onde ocorria o encontro relacionado à presença divina.
theological_decisions:
- issue: Linguagem masculina no contexto sacerdotal
  choice: e seus filhos
  alternative: e seus descendentes / e seus filhos e filhas
  rationale: O contexto trata dos filhos homens de Arão investidos no sacerdócio. A tradução mantém o referente específico do texto sem ampliá-lo para todo o núcleo familiar.
- issue: Força verbal da instrução ritual
  choice: comerão
  alternative: deverão comer
  rationale: O futuro expressa a instrução prescritiva no fluxo do ritual, sem acrescentar uma obrigação modal mais explícita do que a forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem da frase acompanha de perto o hebraico, enquanto a vírgula antes do adjunto final esclarece que a refeição ocorre à entrada da tenda do encontro. Não se acrescentou nota para בְּשַׂר, pois “carne” é simultaneamente literal e idiomático neste contexto.
