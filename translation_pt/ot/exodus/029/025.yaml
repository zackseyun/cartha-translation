base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: pt
  text: Depois, você os tomará das mãos deles e os queimará sobre o altar, sobre o holocausto, como aroma agradável diante de Yahweh. É uma oferta feita pelo fogo para Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma oferta de fogo para Yahweh».'
    reason: Alternativa lexical para אִשֶּׁה, termo sacrificial associado à apresentação da oferta por meio do fogo.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Depois, você os pegará
  rationale: O perfeito com waw em uma sequência de instruções tem força prescritiva e progressiva; «Depois» exprime naturalmente a etapa seguinte do rito.
- source_word: אֹתָם מִיָּדָם
  choice: das mãos deles
  rationale: Mantém a referência pronominal às porções previamente colocadas nas mãos dos sacerdotes e preserva a concretude da ação ritual.
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: os queimará sobre o altar
  rationale: No contexto sacrificial, o hifil de קטר indica queimar e fazer subir em fumaça; «queimar» é claro, e «sobre o altar» expressa o movimento e a localização implícitos na forma direcional.
- source_word: עַל הָעֹלָה
  choice: por cima do holocausto
  rationale: עַל indica que as porções são colocadas sobre a oferta já presente; «por cima» torna clara a disposição ritual.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: como aroma agradável
  rationale: A expressão sacrificial fixa comunica agrado e aceitação diante de Deus, preservando ao mesmo tempo a metáfora olfativa.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa presença ou relação espacial; o nome divino é transliterado como «Yahweh».
- source_word: אִשֶּׁה
  choice: oferta queimada
  rationale: O termo designa uma oferta apresentada mediante o fogo. «Oferta queimada» conserva essa associação sem confundi-la com o termo técnico distinto «holocausto» (עֹלָה).
- source_word: הוּא לַיהוָה
  choice: É ... para Yahweh
  rationale: Preserva o pronome enfático em uma oração copulativa natural e a dedicação indicada pelo lamed.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pactual presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido do termo sacrificial אִשֶּׁה
  choice: oferta queimada
  alternative: oferta feita pelo fogo; oferta de alimento
  rationale: A tradução mantém a ligação tradicional e contextualmente evidente com o fogo, mas evita identificar אִשֶּׁה com עֹלָה, já traduzido como «holocausto». «Oferta de alimento» é possível em certos contextos sacerdotais, porém aqui seria interpretativo demais.
translation_notes:
  register: Português moderno, digno e acessível, com construção procedural natural. Emprega «você» no singular para a instrução dirigida a Moisés; mantém «holocausto» como termo sacrificial amplamente reconhecido e distingue-o de «oferta queimada».
