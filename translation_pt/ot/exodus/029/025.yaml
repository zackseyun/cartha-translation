    issue: «Oferta queimada» para אִשֶּׁה
    rationale: Embora vinculada ao fogo, esta expressão em português pode funcionar como sinônimo de «holocausto», traduzindo indevidamente o termo técnico עֹלָה que aparece imediatamente antes. «Oferta feita pelo fogo» mantém a referência ao fogo e a distinção entre os dois termos.
  - severity: low
    issue: «Por cima do holocausto»
    rationale: A expressão pode sugerir apenas posição acima. «Sobre o holocausto» exprime com mais precisão a colocação das porções sobre a oferta já presente.
