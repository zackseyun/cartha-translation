review_pass:
  verdict: revise
  source_fidelity: A sequência injuntiva, a retirada das porções das mãos deles, a queima sobre o altar e sobre o holocausto, e a fórmula «aroma agradável diante de Yahweh» são bem representadas. Contudo, «oferta queimada» pode ser entendida como o termo técnico «holocausto» (עֹלָה), já empregado na mesma frase para um sacrifício distinto. Para אִשֶּׁה, uma formulação que explicite a apresentação por meio do fogo preserva melhor a distinção lexical.
  naturalness: O texto é claro e tem registro moderno e digno. «Sobre o holocausto» é mais direto e menos espacialmente ambíguo que «por cima do holocausto». «Tomará» se ajusta naturalmente ao tom instrucional ritual sem comprometer a legibilidade brasileira.
  terminology: «Yahweh» reproduz de modo consistente o Tetragrama. «Holocausto» é uma designação estabelecida para עֹלָה neste contexto. A expressão revista para אִשֶּׁה evita fundi-la com «holocausto» e a nota registra uma alternativa concisa.
  issues:
