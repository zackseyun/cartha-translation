base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: pt
  text: Você colocará faixas em Arão e em seus filhos e lhes prenderá gorros. O sacerdócio lhes pertencerá como estatuto permanente. Assim, você consagrará[a] Arão e seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “você encherá a mão de Arão e a mão de seus filhos”, expressão hebraica usada para investir ou consagrar alguém ao serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: porá cintos
  rationale: O verbo descreve cingir ou ajustar uma peça à cintura, e אַבְנֵט designa o cinto ou faixa sacerdotal. “Porá cintos” é claro e natural em português atual.
- source_word: אַהֲרֹן וּבָנָיו
  choice: em Arão e em seus filhos
  rationale: A expressão identifica de modo apositivo quem são “eles”. Na tradução, os nomes foram integrados diretamente à oração para evitar uma retomada pesada.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: prenderá gorros na cabeça deles
  rationale: חבשׁ indica prender ou envolver algo na cabeça, e מִגְבָּעוֹת são as coberturas usadas pelos sacerdotes, distintas do turbante do sumo sacerdote. “Gorros” mantém essa distinção, e “na cabeça” explicita naturalmente a ação.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: O sacerdócio lhes pertencerá
  rationale: A construção com לָהֶם expressa posse ou atribuição do ofício sacerdotal. “Lhes pertencerá” reproduz isso com clareza e dignidade.
- source_word: לְחֻקַּת עוֹלָם
  choice: por estatuto permanente
  rationale: חֻקָּה é uma norma ou estatuto fixo, enquanto עוֹלָם, neste contexto legal e cultual, indica duração contínua no âmbito da aliança. “Permanente” preserva essa força sem impor uma conclusão filosófica sobre eternidade absoluta.
- source_word: וּמִלֵּאתָ יַד
  choice: consagrará
  rationale: A expressão literal “encher a mão” é um termo técnico para investir alguém no serviço sacerdotal. “Consagrará” comunica bem a função cultual em português, e o sentido literal é preservado em nota.
theological_decisions:
- issue: Sentido da duração em לְחֻקַּת עוֹלָם
  choice: por estatuto permanente
  alternative: por estatuto perpétuo; como ordenança eterna
  rationale: “Permanente” expressa a validade duradoura da instituição sacerdotal dentro da ordem da aliança de Israel sem resolver indevidamente questões teológicas posteriores sobre duração absoluta.
- issue: Tradução do idioma de investidura sacerdotal וּמִלֵּאתָ יַד
  choice: consagrará Arão e seus filhos
  alternative: encherá a mão de Arão e de seus filhos; investirá Arão e seus filhos
  rationale: A expressão é técnica e cultual. “Consagrará” oferece uma formulação compreensível e adequada ao contexto, enquanto a nota mantém transparente a imagem hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Evitaram-se formas excessivamente arcaicas como “cingirás” e termos denominacionalmente marcados. A repetição de “Arão e seus filhos” segue o texto hebraico e preserva sua ênfase.
