review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente as ações de vestir Arão e seus filhos, a atribuição do sacerdócio, o caráter duradouro do estatuto e a investidura sacerdotal. Contudo, «por estatuto permanente» pode sugerir fundamento ou meio jurídico, enquanto לְחקת עולם qualifica mais diretamente a condição/estatuto duradouro da instituição; «como estatuto permanente» preserva melhor essa relação.
  naturalness: O português é claro e de registro apropriado. «Faixas» é mais natural e mais próximo da peça sacerdotal אַבְנֵט do que «cintos», e «lhes prenderá gorros» evita a construção um pouco pesada «prenderá gorros na cabeça deles».
  terminology: «Sacerdócio», «estatuto permanente» e «consagrará» são adequados e não impõem leitura denominacional. A nota conserva corretamente o idioma hebraico de «encher a mão», mas deve concordar com a segunda pessoa empregada no texto.
  issues:
  - severity: low
    issue: Relação de לְחקת עולם
    rationale: «Por estatuto permanente» é possível, mas em português pode indicar causa, base ou instrumento. «Como estatuto permanente» reproduz com mais transparência a qualificação legal da posse do sacerdócio.
  - severity: low
    issue: Designação de אַבְנֵט
    rationale: «Faixas» corresponde melhor ao adorno/faixa sacerdotal do que «cintos», que tende a evocar um acessório moderno rígido.
  - severity: low
    issue: Concordância verbal na nota
    rationale: A nota diz «encherá», em terceira pessoa, embora a tradução se dirija por «você». «Você encherá» mantém coerência formal.
