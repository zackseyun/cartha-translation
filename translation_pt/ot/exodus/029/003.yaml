  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: pt
  text: Coloque os itens num só cesto[a] e apresente-os no cesto[b], junto com o novilho e os dois carneiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em um único cesto”. A preposição hebraica significa literalmente “sobre”, mas, neste contexto de recipiente, o sentido é colocar os itens dentro do cesto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aproxime-os” ou “ofereça-os”. O verbo hebraico é o termo sacrificial usual para “trazer para perto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם
  choice: Coloque tudo
  rationale: נתן significa dar, pôr ou colocar; no procedimento descrito, “coloque” é natural. “Tudo” retoma coletivamente os pães e bolos do versículo anterior.
- source_word: עַל סַל אֶחָד
  choice: num só cesto
  rationale: Embora עַל costume significar “sobre”, com o verbo “colocar” e um recipiente indica aqui que os itens devem ser postos dentro dele. אֶחָד ressalta que se trata de um único cesto.
- source_word: וְהִקְרַבְתָּ
  choice: apresente
  rationale: הקריב é o verbo cultual “aproximar, trazer para perto, apresentar”. “Apresente” conserva o sentido sacrificial sem afirmar prematuramente que tudo já é oferecido no altar.
- source_word: אֹתָם בַּסָּל
  choice: no cesto
  rationale: A preposição ב indica que os itens são apresentados contidos no cesto.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: junto com o novilho e os dois carneiros
  rationale: Os marcadores repetidos de objeto acrescentam os animais àquilo que deve ser apresentado. “Junto com” explicita com naturalidade essa coordenação.
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho jovem destinado ao sacrifício; “novilho” é a designação portuguesa corrente neste contexto.
- source_word: שְׁנֵי הָאֵילִם
  choice: os dois carneiros
  rationale: O numeral em construção com o substantivo definido corresponde naturalmente a “os dois carneiros”.
theological_decisions:
- issue: Valor cultual de וְהִקְרַבְתָּ
  choice: apresente
  alternative: aproxime / ofereça
  rationale: “Apresente” comunica a ação cultual de levar diante de Deus sem reduzir o verbo à mera proximidade espacial nem identificar esta etapa, por si só, com a oferta no altar.
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa adequada à sequência de instruções. “Num só cesto” é idiomático e mantém a ênfase em um único recipiente; “novilho” oferece boa legibilidade brasileira no contexto sacrificial.
