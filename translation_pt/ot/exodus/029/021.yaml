- from: Então você pegará um pouco do sangue que está sobre o altar e um pouco do óleo da unção e os aspergirá sobre Arão, sobre as roupas dele, sobre os filhos dele e sobre as roupas dos filhos dele que estão com ele. Assim, ele, suas roupas, seus filhos e as roupas de seus filhos que estão com ele serão santos[a].
  to: Então você pegará um pouco do sangue que está sobre o altar e um pouco do óleo da unção e os aspergirá sobre Arão, sobre suas vestes, sobre seus filhos e sobre as vestes de seus filhos, juntamente com ele. Assim, ele, suas vestes, seus filhos e as vestes de seus filhos, juntamente com ele, serão santos[a].
  rationale: A revisão elimina a relativa que restringia “com ele” apenas às vestes dos filhos e emprega “juntamente com ele” para conservar, sem sobredefini-la, a relação indicada por אִתּוֹ. “Vestes” ajusta levemente o registro ao contexto sacerdotal, mantendo o sentido geral de בגד. O plural em “os aspergirá” retoma o sangue e o óleo e é natural em português.
