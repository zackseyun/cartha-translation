base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: pt
  text: Então você pegará um pouco do sangue que está sobre o altar e um pouco do óleo da unção e os aspergirá sobre Arão, sobre suas vestes, sobre seus filhos e sobre as vestes de seus filhos, juntamente com ele. Assim, ele, suas vestes, seus filhos e as vestes de seus filhos, juntamente com ele, serão santos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão consagrados”. O hebraico diz literalmente “serão santos”, expressando o estado santificado resultante da ação ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Então você pegará
  rationale: O perfeito Qal com conjunção dá continuidade às instruções rituais, com valor prospectivo e prescritivo. A forma futura preserva essa sequência em português natural.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: um pouco do sangue que está sobre o altar
  rationale: A preposição מִן indica que se toma uma porção do sangue; “um pouco do” torna explícito esse sentido partitivo sem alterar o referente.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: óleo da unção
  rationale: A construção designa o óleo usado para ungir. “Óleo da unção” é corrente, clara e próxima da forma hebraica.
- source_word: וְהִזֵּיתָ
  choice: e os aspergirá
  rationale: O Hifil de נזה, em contexto ritual, indica aspergir um líquido. O pronome plural retoma naturalmente, em português, o sangue e o óleo mencionados.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: as roupas dele / as roupas dos filhos dele
  rationale: בגד é um termo geral para roupa. Essa escolha evita introduzir terminologia eclesiástica posterior, e o uso de “dele” reduz ambiguidades de referência.
- source_word: בָּנָיו
  choice: os filhos dele
  rationale: O masculino plural refere-se especificamente aos filhos homens de Arão no contexto sacerdotal.
- source_word: אִתּוֹ
  choice: que estão com ele
  rationale: A expressão associa os filhos de Arão e suas roupas a Arão durante o rito; a oração relativa produz uma formulação clara em português.
- source_word: וְקָדַשׁ
  choice: serão santos
  rationale: O verbo descreve o estado resultante da ação ritual. O plural é exigido pela enumeração em português e preserva “santos”, a categoria expressa diretamente pela raiz קדשׁ.
- source_word: הוּא
  choice: ele
  rationale: O pronome retoma Arão. Mantê-lo preserva a estrutura do hebraico sem necessidade de repetir o nome.
theological_decisions:
- issue: Resultado da santificação ritual
  choice: serão santos
  alternative: serão consagrados
  rationale: “Serão santos” conserva a categoria explícita do hebraico e deixa visível o estado produzido pelo rito. “Serão consagrados” é possível, mas enfatiza mais o processo e pode estreitar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “dele” evita a possível ambiguidade de “seu” quando Arão e seus filhos aparecem na mesma frase. A enumeração final foi reorganizada de modo mínimo para permitir concordância natural no plural, sem mudar os participantes nem o efeito ritual.
