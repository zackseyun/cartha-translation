  source_fidelity: A tradução transmite corretamente a sequência ritual, o caráter partitivo do sangue, o óleo da unção e o resultado expresso por קדשׁ. Contudo, a oração relativa “que estão com ele” restringe-se sintaticamente às roupas dos filhos, embora אִתּוֹ esteja em posição final e sua relação com a enumeração anterior deva permanecer menos restringida.
  naturalness: O texto é compreensível e de registro apropriado, mas “as roupas dos filhos dele que estão com ele” é sintaticamente pouco natural e pode sugerir de modo estranho que apenas as roupas estão com Arão. “Vestes” mantém um registro ritual digno e é amplamente compreensível.
  terminology: “Óleo da unção”, “aspergir” e “santos” são adequados. A nota preserva corretamente “consagrados” como alternativa, sem substituir a categoria hebraica de santidade no texto principal.
