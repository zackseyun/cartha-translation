  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: pt
  text: Você oferecerá um cordeiro pela manhã, e oferecerá o segundo cordeiro entre as duas tardes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as duas tardes”, expressão tradicional muitas vezes entendida como “ao entardecer” ou como o período entre o fim da tarde e o pôr do sol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: cordeiro
  rationale: Em instruções sacrificiais, o termo designa uma ovelha jovem apropriada para a oferta; “cordeiro” é a forma mais natural e específica em português.
- source_word: הָאֶחָד
  choice: um cordeiro
  rationale: O hebraico diz literalmente “o um”. Em português, “um cordeiro”, em contraste com “o segundo cordeiro”, preserva a relação entre os dois sem produzir uma construção artificial.
- source_word: תַּעֲשֶׂה
  choice: oferecerá
  rationale: Embora o verbo signifique basicamente “fazer”, neste contexto sacrificial refere-se ao ato de apresentar ou realizar a oferta; “oferecerá” comunica naturalmente esse sentido.
- source_word: בַבֹּקֶר
  choice: pela manhã
  rationale: Expressão temporal corrente e clara em português para indicar o momento da oferta diária.
- source_word: הַשֵּׁנִי
  choice: o segundo cordeiro
  rationale: Traduz diretamente o ordinal e explicita o substantivo subentendido de modo natural em português.
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre as tardes
  rationale: Mantém no texto a formulação distintiva e ambígua do hebraico, deixando à nota as interpretações temporais mais idiomáticas.
