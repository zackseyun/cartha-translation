  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: pt
  text: Em seguida, pegue um dos carneiros[a], e Arão e seus filhos porão as mãos sobre a cabeça do carneiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o carneiro, o um”, distinguindo este carneiro do outro usado no ritual de consagração. Outras traduções trazem “o primeiro carneiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Depois
  rationale: A conjunção introduz a etapa seguinte do procedimento; “Depois” expressa naturalmente a progressão das instruções.
- source_word: הָ/אַיִל הָ/אֶחָד
  choice: o carneiro, um dos dois
  rationale: A expressão hebraica é literalmente “o carneiro, o um” e distingue este animal do outro carneiro do ritual. A formulação preserva a distinção sem converter אֶחָד diretamente em ordinal.
- source_word: תִּקָּח
  choice: pegue
  rationale: O imperfeito na instrução dirigida a Moisés tem força prescritiva; o imperativo português é natural, claro e fiel nesse contexto.
- source_word: וְ/סָמְכוּ
  choice: porão
  rationale: No contexto sacrificial, סמך designa o gesto ritual de pôr ou apoiar as mãos sobre o animal. “Porão as mãos” é idiomático e não acrescenta uma interpretação teológica do gesto.
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: Arão e seus filhos
  rationale: בנים refere-se aqui aos filhos homens de Arão que participam da consagração sacerdotal.
- source_word: אֶת יְדֵי/הֶם עַל רֹאשׁ הָ/אָיִל
  choice: as mãos sobre a cabeça do carneiro
  rationale: Mantém o plural do hebraico e expressa claramente a localização do gesto ritual.
theological_decisions:
- issue: Sentido do gesto ritual de imposição das mãos
  choice: porão as mãos sobre a cabeça do carneiro
  alternative: apoiarão as mãos sobre a cabeça do carneiro
  rationale: A tradução identifica o ato ritual expresso por סמך, mas não afirma transferência de culpa, identificação ou outra explicação teológica que este versículo não explicita.
- issue: Identificação do carneiro
  choice: o carneiro, um dos dois
  alternative: o primeiro carneiro
  rationale: O hebraico usa אֶחָד, “um”, e não uma forma ordinal explícita. A tradução distingue este carneiro do outro mencionado no ritual sem resolver a expressão como “primeiro” no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O imperativo “pegue” comunica naturalmente a instrução dirigida a Moisés; “porão as mãos” conserva o tom ritual sem recorrer a terminologia excessivamente técnica.
