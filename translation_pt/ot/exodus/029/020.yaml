revisions:
- from: Então você sacrificará o carneiro e pegará um pouco do sangue dele. Coloque-o no lóbulo da orelha direita de Arão, no lóbulo da orelha direita dos filhos dele, no polegar da mão direita deles e no dedão do pé direito deles. Depois, lance o sangue contra todos os lados do altar.[a]
  to: Então, sacrifique o carneiro, pegue parte do seu sangue e coloque-o no lóbulo da orelha direita de Arão, no lóbulo da orelha direita de seus filhos, no polegar da mão direita deles e no dedão do pé direito deles. Depois, lance o sangue contra o altar, por todos os lados.[a]
  rationale: A revisão uniformiza as instruções em imperativos, melhora a formulação portuguesa da aplicação do sangue ao altar e ajusta a nota para que sua alternativa lexical corresponda à força ritual do verbo hebraico. O sentido e a sequência do texto-fonte permanecem inalterados.
