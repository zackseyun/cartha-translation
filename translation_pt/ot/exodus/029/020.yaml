base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: pt
  text: Então, sacrifique o carneiro, pegue parte do seu sangue e coloque-o no lóbulo da orelha direita de Arão, no lóbulo da orelha direita de seus filhos, no polegar da mão direita deles e no dedão do pé direito deles. Depois, lance o sangue contra o altar, por todos os lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esguiche o sangue contra o altar, ao redor dele”. O verbo hebraico indica uma aplicação ritual vigorosa do sangue, não uma aspersão leve.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: sacrificará
  rationale: No contexto ritual, indica matar o animal para o sacrifício. “Sacrificará” comunica essa função com naturalidade e dignidade em português, evitando o sentido genérico de “matar”.
- source_word: אַיִל
  choice: carneiro
  rationale: Equivalente português comum e preciso para o macho adulto da ovelha usado no sacrifício.
- source_word: מִדָּמוֹ
  choice: um pouco do sangue dele
  rationale: O מִן partitivo indica que se toma uma porção do sangue; a formulação é clara e idiomática.
- source_word: תְּנוּךְ אֹזֶן
  choice: lóbulo da orelha
  rationale: No contexto ritual sacerdotal, תְּנוּךְ designa provavelmente o lóbulo ou a extremidade da orelha. “Lóbulo” é a identificação anatômica mais provável em português.
- source_word: הַיְמָנִית
  choice: direita / direito
  rationale: O adjetivo especifica os membros do lado direito e foi ajustado ao gênero gramatical de cada substantivo em português.
- source_word: בֹּהֶן יָד
  choice: polegar da mão
  rationale: בֹּהֶן, quando associado à mão, designa especificamente o polegar.
- source_word: בֹּהֶן רֶגֶל
  choice: dedão do pé
  rationale: בֹּהֶן, quando associado ao pé, designa o dedo maior. “Dedão do pé” é claro e corrente no português brasileiro, além de amplamente compreensível.
- source_word: זָרַק
  choice: lance ... contra
  rationale: No procedimento sacrificial, o verbo descreve uma aplicação vigorosa do sangue contra o altar, e não uma aspersão leve.
- source_word: סָבִיב
  choice: contra todos os lados
  rationale: Expressa de modo natural o sentido distributivo de aplicar o sangue ao redor do altar.
- source_word: וְ
  choice: Então / e / depois
  rationale: As conjunções fazem avançar a sequência ritual. A variação em português preserva a progressão sem produzir uma cadeia pesada de orações com “e”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sequência longa do hebraico foi dividida em três frases para maior clareza. Conservou-se a precisão ritual e evitou-se linguagem denominacional. A ambiguidade lexical de תְּנוּךְ não foi marcada em nota porque “lóbulo” é o sentido mais provável; a alternativa de זָרַק foi registrada. O único marcador, [a], aparece no texto principal.
