review_pass:
  verdict: revise
  source_fidelity: A sequência ritual, o carneiro, as aplicações de sangue à orelha, mão e pé direitos, e a ação final sobre o altar estão substancialmente corretos. Contudo, a alternância entre futuro (“você sacrificará”) e imperativo (“Coloque-o”) não representa bem uma única instrução contínua. A expressão final “contra todos os lados do altar” é pouco idiomática e imprecisa em português; o hebraico indica lançar/aplicar o sangue contra o altar em todo o seu redor.
  naturalness: O texto é claro, mas a mudança de construção verbal interrompe a fluidez. “Ao redor do altar” ou “por todos os lados do altar” é mais natural do que “contra todos os lados do altar”. “Dedão do pé” é adequado para a legibilidade brasileira e compreensível internacionalmente.
  terminology: “Carneiro”, “lóbulo da orelha”, “polegar” e “dedão do pé” são escolhas adequadas. “Sacrifique” preserva o contexto cultual de שָׁחַט. A nota deve propor uma alternativa que também mantenha a força de זָרַק; “respingue” pode sugerir uma aplicação leve, em tensão com a própria explicação da nota.
  issues:
  - severity: medium
    issue: Inconsistência de modo verbal
    rationale: “Então você sacrificará” é seguido por “Coloque-o” e “lance”. Uma série uniforme de imperativos transmite com clareza a instrução ritual do hebraico.
  - severity: medium
    issue: Formulação final pouco natural e imprecisa
    rationale: “Contra todos os lados do altar” não é uma forma idiomática de expressar a aplicação de sangue em redor do altar. “Contra o altar, por todos os lados” preserva tanto a força de זָרַק como o alcance de סָבִיב.
  - severity: low
    issue: Alternativa da nota enfraquece o verbo hebraico
    rationale: “Respingue” pode evocar gotas leves, enquanto זָרַק denota uma aplicação mais enérgica. “Esguiche” ou “lance” é alternativa mais fiel.
  revised_text: Então, sacrifique o carneiro, pegue parte do seu sangue e coloque-o no lóbulo da orelha direita de Arão, no lóbulo da orelha direita de seus filhos, no polegar da mão direita deles e no dedão do pé direito deles. Depois, lance o sangue contra o altar, por todos os lados.[a]
  revised_footnotes:
  - marker: a
    text: Ou “esguiche o sangue contra o altar, ao redor dele”. O verbo hebraico indica uma aplicação ritual vigorosa do sangue, não uma aspersão leve.
    reason: lexical_alternative
