  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: pt
  text: Depois, pegue o óleo da unção, derrame-o sobre a cabeça dele e unja-o.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Depois, pegue
  rationale: O perfeito qal com conjunção introduz a etapa seguinte da instrução ritual. “Depois” expressa naturalmente a sequência, e o imperativo “pegue” transmite em português atual a força diretiva do hebraico.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: A construção significa literalmente “óleo da unção”. A formulação é clara, digna e conserva a função ritual específica sem recorrer a uma paráfrase interpretativa.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: derrame-o sobre a cabeça dele
  rationale: יצק significa “derramar”. “Sobre” representa com naturalidade a preposição עַל, e o pronome “-o” retoma explicitamente o óleo.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: e unja-o
  rationale: משׁח é o verbo próprio para “ungir”. Mantê-lo preserva tanto o ato ritual quanto seu significado consagratório, sem substituir a ação explícita por uma explicação.
theological_decisions:
- issue: Relação entre derramar o óleo e ungir Arão
  choice: 'Manter as duas ações coordenadas: “derrame-o sobre a cabeça dele e unja-o”.'
  alternative: Fundir as ações em uma explicação, como “unja-o, derramando o óleo sobre a cabeça dele”.
  rationale: O hebraico emprega dois verbos coordenados, um para o ato físico de derramar e outro para a unção. Preservar ambos evita reduzir a formulação ritual a uma só ação explicada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo é natural em instruções diretas e evita o caráter excessivamente solene de “tomarás/derramarás/ungirás”. “A cabeça dele” evita a possível ambiguidade de “sua cabeça”.
