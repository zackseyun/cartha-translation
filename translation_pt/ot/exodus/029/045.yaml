  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: pt
  text: E habitarei entre os filhos de Israel[a][b] e serei o Deus deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio dos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”; também pode ser traduzido por “os israelitas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, mais literalmente: “serei Deus para eles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: E habitarei
  rationale: O verbo שׁכן expressa morar, habitar ou estabelecer residência. “Habitarei” é natural e digno em português, preservando a ideia da presença permanente de Deus sem introduzir a interpretação mais específica “habitarei no tabernáculo”.
- source_word: בְּתוֹךְ
  choice: entre
  rationale: Com um grupo humano, בְּתוֹךְ indica presença dentro da comunidade. “Entre” comunica isso naturalmente; “no meio de” permanece como alternativa mais espacial e formal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: A expressão hebraica significa literalmente “filhos de Israel”. A tradução conserva a metáfora familiar do texto-fonte, enquanto “os israelitas” é oferecido como alternativa idiomática.
- source_word: וְהָיִיתִי
  choice: e serei
  rationale: Neste contexto, היה exprime relação pactual, não uma mudança de estado que exigisse “me tornarei”. “Serei” é direto e adequado à fórmula da aliança.
- source_word: לָהֶם
  choice: deles
  rationale: Embora a construção seja literalmente “para eles”, a formulação portuguesa natural da relação pactual é “serei o Deus deles”.
- source_word: לֵאלֹהִים
  choice: o Deus
  rationale: Na fala do próprio Deus dirigida a Israel, אֱלֹהִים é definido pelo contexto e se refere a Deus, não a “um deus”.
theological_decisions:
- issue: Tradução da fórmula da aliança
  choice: serei o Deus deles
  alternative: serei Deus para eles
  rationale: “Serei o Deus deles” preserva de modo natural a força relacional e pactual da construção hebraica. A alternativa mais formalmente próxima é registrada em nota para não ocultar a estrutura do original.
- issue: Expressão masculina para o povo
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: O hebraico emprega explicitamente o substantivo masculino plural “filhos”. A tradução principal conserva essa forma e sua imagem familiar, sem afirmar que somente homens estejam em vista.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das palavras segue o fluxo natural do português, preservando a repetição de “E... e...” do hebraico e a linguagem pactual. As notas registram alternativas legítimas sem sobrecarregar o texto principal.
