  text: וְ/אֶת בָּנָ֖י/ו תַּקְרִ֑יב וְ/הִלְבַּשְׁתָּ֖/ם כֻּתֳּנֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/008.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: pt
  text: Depois, faça os filhos dele se aproximarem e vista-os com túnicas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apresente os filhos dele”. O verbo hebraico pode indicar fazer alguém avançar para uma apresentação ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Depois
  rationale: A conjunção introduz a ordem seguinte na sequência ritual; em português, “Depois” expressa naturalmente essa progressão, enquanto o marcador de objeto não é traduzido separadamente.
- source_word: בָּנָיו
  choice: os filhos dele
  rationale: O substantivo designa especificamente os filhos homens de Arão. A formulação evita que o possessivo “seus” seja entendido como referência a Moisés.
- source_word: תַּקְרִיב
  choice: faça ... se aproximarem
  rationale: O hifil de קרב significa fazer chegar perto, trazer para perto ou apresentar, especialmente em contexto ritual. A construção causativa preserva o valor verbal do hebraico e soa natural em português.
- source_word: וְהִלְבַּשְׁתָּם
  choice: e vista-os
  rationale: O verbo significa vestir alguém. “Vista-os” é conciso, atual e apropriado à investidura sacerdotal.
- source_word: כֻּתֳּנֹת
  choice: com túnicas
  rationale: O termo indica vestes corporais do tipo túnica. “Túnicas” é preciso e evita as associações imprecisas de “casacos” ou “mantos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi formulada no imperativo, conforme o valor injuntivo da forma hebraica no contexto. O referente foi explicitado como “dele” para evitar a ambiguidade indesejada de “seus”.
