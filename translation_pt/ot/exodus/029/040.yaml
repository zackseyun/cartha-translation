  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: pt
  text: e um décimo de efa de farinha fina, misturada com um quarto de him de azeite de azeitonas esmagadas[a], e uma oferta de bebida de um quarto de him de vinho, para um cordeiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, azeite produzido de azeitonas esmagadas ou batidas; também se pode traduzir por “azeite prensado”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “para o cordeiro, o um”. No contexto, pode referir-se ao primeiro dos dois cordeiros oferecidos diariamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹון סֹלֶת
  choice: e um décimo de efa de farinha fina
  rationale: עִשָּׂרוֹן é uma medida equivalente a um décimo de efa no contexto das ofertas. Explicitar “de efa” torna a medida compreensível em português sem alterar seu valor; סֹלֶת designa farinha fina própria para ofertas.
- source_word: בָּלוּל בְּשֶׁמֶן כָּתִית
  choice: misturada com ... azeite de azeitonas esmagadas
  rationale: בָּלוּל indica que a farinha foi misturada com azeite. כָּתִית descreve o modo de produção por esmagamento ou batimento das azeitonas; a formulação evita o pouco natural “azeite batido”.
- source_word: רֶבַע הַהִין
  choice: um quarto de him
  rationale: Mantém com precisão a fração e a unidade antiga de volume, sem conversão especulativa.
- source_word: וְנֵסֶךְ
  choice: e, como oferta derramada
  rationale: נֶסֶךְ é uma oferta líquida vertida no culto. “Oferta derramada” é clara para leitores modernos e comunica melhor a ação ritual do que o termo menos comum “libação”.
- source_word: רְבִעִית הַהִין יָיִן
  choice: um quarto de him de vinho
  rationale: Reproduz de maneira direta a medida e o conteúdo da oferta líquida.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para um dos cordeiros
  rationale: A expressão literalmente marcada pelo artigo e pelo numeral refere-se a cada cordeiro individual no esquema das duas ofertas diárias. “Um dos cordeiros” é natural em português e evita decidir no texto principal que se trata especificamente do primeiro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário ritual explicado por formulação transparente. Conservam-se as unidades antigas “efa” e “him”; a unidade elíptica após “um décimo” é explicitada para clareza. Os marcadores seguem a ordem de ocorrência no texto.
