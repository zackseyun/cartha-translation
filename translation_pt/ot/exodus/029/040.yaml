  source_fidelity: 'A medida de farinha, as duas quantidades de um quarto de him, o vinho e o azeite obtido de azeitonas esmagadas refletem adequadamente o hebraico. Contudo, «para um dos cordeiros» introduz um plural e uma relação partitiva que não estão no texto: לַכֶּבֶשׂ הָאֶחָד está no singular definido, «para um cordeiro» / «para o cordeiro, um».'
