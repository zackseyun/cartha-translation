review_pass:
  verdict: revise
  source_fidelity: A enumeração, a distinção entre os três preparados, a mistura/incorporação de azeite, a aplicação de azeite às peças finas e a exigência de farinha fina de trigo estão bem representadas. Contudo, «lâminas» não é um equivalente suficientemente natural ou preciso para רְקִיקִים, que designa pães/bolachas finos, não meras lâminas ou folhas.
  naturalness: «Amassados com azeite» e «untadas com azeite» são naturais no contexto culinário. «Bolachas sem fermento» comunica melhor ao leitor moderno peças finas de massa do que «lâminas sem fermento». A forma imperativa «faça-os» preserva o caráter instrucional sem privilegiar o brasileiro «você».
  terminology: «Pão sem fermento», «bolos sem fermento», «bolachas sem fermento», «azeite» e «farinha fina de trigo» são adequados. A nota conserva, sem impor significado ritual adicional, a possível tradução mais literal de משׁח como «ungir».
  issues:
  - severity: medium
    issue: «lâminas sem fermento» para רְקִיקֵי מַצּוֹת
    rationale: Em português, «lâminas» normalmente evoca folhas, tiras ou peças cortantes, e não um preparado de pão. רָקִיק denota uma peça fina de massa, adequadamente expressa aqui por «bolacha».
  - severity: low
    issue: «você os fará»
    rationale: É compreensível e fiel, mas «faça-os» é uma formulação prescritiva mais amplamente internacional em português e mantém a concisão própria da instrução ritual.
  revised_text: pão sem fermento, bolos sem fermento amassados com azeite e bolachas sem fermento untadas com azeite[a]; faça-os de farinha fina de trigo.
