  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: pt
  text: pão sem fermento, bolos sem fermento amassados com azeite e bolachas sem fermento untadas com azeite[a]; faça-os de farinha fina de trigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ungidas com azeite”. O verbo hebraico é o termo usual para “ungir”, mas aqui descreve o preparo das bolachas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: pães sem fermento
  rationale: Expressa naturalmente o pão caracterizado pela ausência de fermento e mantém a especificidade ritual.
- source_word: חַלֹּת מַצֹּת
  choice: bolos sem fermento
  rationale: חַלָּה designa uma peça de pão ou bolo, provavelmente mais espessa que as lâminas mencionadas em seguida; “bolos” preserva essa distinção.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: amassados com azeite
  rationale: O particípio de בלל indica mistura. Neste contexto de preparo de massa, “amassados com azeite” é claro e idiomático, sem afirmar mais que a incorporação do azeite à massa.
- source_word: רְקִיקֵי מַצּוֹת
  choice: lâminas sem fermento
  rationale: רָקִיק indica uma peça de pão fina. “Lâminas” comunica a forma delgada e distingue esse item dos bolos, embora “pães finos” também seja possível.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: untadas com azeite
  rationale: O verbo משׁח é normalmente “ungir”, mas, aplicado ao preparo dessas lâminas, descreve passar azeite sobre elas; “untadas” é natural em português e adequado ao contexto.
- source_word: סֹלֶת חִטִּים
  choice: farinha fina de trigo
  rationale: Preserva tanto a qualidade fina da farinha quanto a identificação do cereal.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: você os fará
  rationale: Mantém a força prescritiva do imperfeito no contexto das instruções rituais, em linguagem moderna e clara.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “azeite” no sentido de azeite de oliva, convencional neste contexto bíblico. A enumeração segue diretamente o versículo anterior; por isso começa sem verbo introdutório.
