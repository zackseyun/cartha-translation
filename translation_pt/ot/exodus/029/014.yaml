base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: pt
  text: Mas a carne do touro, seu couro e seus excrementos, você queimará no fogo fora do acampamento; é uma oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O hebraico חַטָּאת pode indicar tanto o pecado quanto o sacrifício oferecido em relação ao pecado. Em contextos sacrificiais como este, muitos traduzem “oferta pelo pecado”, enquanto outros preferem “oferta de purificação” para destacar a função purificadora do rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: a carne do novilho
  rationale: “Carne” comunica naturalmente o tecido corporal do animal em português, e “novilho” é uma designação clara e corrente para פַּר no contexto sacrificial.
- source_word: עֹרוֹ
  choice: seu couro
  rationale: No contexto da carcaça de um animal, “couro” é mais específico e idiomático que “pele”.
- source_word: פִּרְשׁוֹ
  choice: seus excrementos
  rationale: פֶּרֶשׁ designa excremento ou esterco; “excrementos” preserva o sentido direto sem confundi-lo com vísceras ou resíduos em geral.
- source_word: תִּשְׂרֹף
  choice: você queimará
  rationale: O imperfeito na instrução legal tem força diretiva; o futuro em português mantém essa força com linguagem moderna e digna.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Expressão natural em português para indicar o meio pelo qual a queima deve ser feita.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Formulação corrente e precisa para o lugar além dos limites do acampamento de Israel.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, o termo designa a oferta relacionada ao pecado. “Oferta pelo pecado” é reconhecível em português e mantém essa relação sem reduzir o termo ao conceito abstrato de pecado.
- source_word: הוּא
  choice: é
  rationale: A cópula identifica o animal ou rito como oferta pelo pecado de modo conciso e natural.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: a carne ..., seu couro e seus excrementos
  rationale: A enumeração dos três elementos é preservada, com coordenação natural em português.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O contexto cultual favorece o sentido de sacrifício associado ao pecado. A alternativa “oferta de purificação” ressalta a função purificadora do rito e é registrada em nota para preservar a amplitude interpretativa do termo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A estrutura conserva a sequência ritual do hebraico sem reproduzir de maneira rígida sua coordenação.
