  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: pt
  text: Por sete dias farás expiação pelo altar e o consagrarás; assim, o altar será santíssimo. Tudo o que tocar no altar se tornará santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tudo o que tocar no altar deverá ser santo”. O hebraico pode ser entendido tanto no sentido de que o contato comunica santidade como no de que somente o que já é santo pode tocar no altar.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: fará expiação
  rationale: No contexto ritual sacerdotal, כפר descreve o rito de expiação e purificação. “Fará expiação” preserva a expressão cultual consagrada sem especificar além do hebraico o mecanismo do rito.
- source_word: עַל הַמִּזְבֵּחַ
  choice: pelo altar
  rationale: Com כפר, a preposição עַל marca naturalmente aquilo em favor do qual se realiza a expiação. “Pelo altar” expressa esse uso idiomático em português.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: e o consagrará
  rationale: “Consagrar” comunica de modo claro e digno a ação ritual de separar e tornar santo o altar.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssimo
  rationale: A construção intensiva hebraica indica o grau máximo de santidade. “Santíssimo” é natural em português e adequado ao uso predicativo referente ao altar.
- source_word: כָּל הַנֹּגֵעַ
  choice: Tudo o que tocar
  rationale: A construção com כָּל e o particípio é abrangente e pode referir-se a pessoa ou objeto. “Tudo o que” evita restringir o referente apenas a seres humanos.
- source_word: יִקְדָּשׁ
  choice: se tornará santo
  rationale: 'A forma verbal admite sentido resultativo: quem ou aquilo que entra em contato com o altar passa a participar de sua santidade. A tradução conserva esse sentido direto.'
theological_decisions:
- issue: Efeito da santidade do altar sobre aquilo que o toca
  choice: O contato com o altar consagrado comunica santidade àquilo que o toca.
  alternative: Somente pessoas ou objetos já santos, ou ritualmente autorizados, podem tocar no altar.
  rationale: A sequência “tudo o que tocar... se tornará santo” favorece na leitura principal um resultado decorrente do contato. A nota preserva a interpretação normativa possível, sem impô-la ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário ritual amplamente reconhecível. O futuro verbal acompanha o caráter instrutivo do contexto. A ambiguidade interpretativa da frase final é preservada por nota.
