base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: pt
  text: Depois, pegue as vestes e vista Arão com a túnica, o manto do éfode, o éfode e o peitoral[b]. Prenda-lhe o éfode[a] com a faixa tecida do éfode.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cinja-o com o éfode por meio da faixa tecida do éfode”. O verbo hebraico é raro e pode enfatizar o ato de cingir, ajustar ou prender o éfode em Arão.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa uma peça usada sobre o peito, não necessariamente uma peça de armadura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Depois, pegue
  rationale: O perfeito com waw dá continuidade à sequência de instruções. “Depois” explicita essa progressão, e o imperativo é a forma natural de transmitir a instrução em português.
- source_word: הַבְּגָדִים
  choice: as vestes
  rationale: O termo designa roupas em geral; neste contexto, “vestes” é claro, digno e apropriado às roupas sacerdotais, sem importar terminologia eclesiástica posterior.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: e vista Arão
  rationale: O hifil de לבש significa fazer alguém vestir-se ou pôr roupas em alguém. “Vista Arão” preserva naturalmente o sentido causativo.
- source_word: הַכֻּתֹּנֶת
  choice: a túnica
  rationale: כֻּתֹּנֶת é a peça básica usada junto ao corpo; “túnica” é o equivalente português tradicional e transparente.
- source_word: מְעִיל הָאֵפֹד
  choice: o manto do éfode
  rationale: A construção hebraica identifica o manto associado ao éfode. A tradução mantém essa relação sem acrescentar que era usado por baixo, detalhe apenas implícito no contexto.
- source_word: הָאֵפֹד
  choice: o éfode
  rationale: אֵפֹד é um termo técnico para uma peça sacerdotal sem equivalente português exato; a transliteração evita uma paráfrase enganosa.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: חֹשֶׁן designa a peça ornamental presa ao peito. “Peitoral” é conciso e bem estabelecido em português, embora possa exigir esclarecimento para evitar a ideia de armadura.
- source_word: וְאָפַדְתָּ לוֹ
  choice: Prenda o éfode sobre ele
  rationale: O verbo אפד é raro e se refere a cingir ou ajustar com o éfode. A repetição explícita de “o éfode” elimina a ambiguidade do pronome e “prenda ... sobre ele” comunica o ato sem decidir de modo excessivo entre cingir, ajustar e fixar.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: com a faixa tecida do éfode
  rationale: חֵשֶׁב, neste contexto, indica a faixa trabalhada ou tecida pertencente ao éfode. “Faixa tecida” é concreta e evita sobrecarregar o texto com uma interpretação estética.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Empregou-se o imperativo para a sequência de instruções e conservaram-se os termos cultuais técnicos “éfode” e “peitoral”. A segunda oração foi iniciada como nova frase para evitar uma coordenação longa e tornar inequívoco que o objeto preso é o éfode.
