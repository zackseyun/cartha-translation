id: EXO.29.46
reference: Exodus 29:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: pt
  text: E eles saberão que eu sou Yahweh,[a] o Deus deles, que os tirei da terra do Egito a fim de habitar entre eles.[b] Eu sou Yahweh, o Deus deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH (יהוה), o nome pessoal de Deus; tradicionalmente traduzido por “SENHOR”.'
    reason: identificação do nome divino
  - marker: b
    text: Literalmente, “no meio deles”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E eles saberão
  rationale: O perfeito qal com waw, no contexto das promessas anteriores, tem sentido futuro e resultante. “Saberão” é claro, solene e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: o Deus deles
  rationale: Embora אֱלֹהִים tenha forma plural, a referência ao Deus de Israel é singular, como confirmam o nome divino e a fórmula da aliança.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: que os tirei da terra do Egito
  rationale: Mantém a primeira pessoa do verbo hebraico e reproduz a fórmula recorrente do êxodo em português natural.
- source_word: לְשָׁכְנִי
  choice: a fim de habitar
  rationale: O infinitivo com לְ expressa propósito. A formulação conserva essa finalidade sem acrescentar uma interpretação além do texto.
- source_word: בְתוֹכָם
  choice: entre eles
  rationale: É a forma corrente de expressar a presença de Deus no interior da comunidade, preservando o sentido do idioma hebraico.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: Eu sou Yahweh, o Deus deles
  rationale: Preserva a ordem enfática e a repetição da fórmula da aliança no encerramento do versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome pessoal divino. “Yahweh” o conserva por transliteração, enquanto “SENHOR” o substitui por um título e “Jeová” representa uma forma tradicional posterior.
- issue: Finalidade da saída do Egito
  choice: a fim de habitar entre eles
  alternative: para minha habitação entre eles
  rationale: A construção hebraica é mais naturalmente entendida como uma oração de propósito cujo sujeito é Deus. A tradução mantém a relação entre libertação e presença divina sem desenvolver implicações doutrinárias não expressas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva a repetição solene da fórmula da aliança, a primeira pessoa dos verbos divinos e a oração de propósito. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes.
