  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: pt
  text: Durante sete dias, o sacerdote dentre os seus filhos que lhe suceder[b] vestirá essas roupas[a], quando entrar na tenda do encontro para servir no lugar santo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porá essas roupas”. O verbo hebraico pode significar tanto vestir uma roupa quanto usá-la.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o sacerdote em seu lugar, dentre os seus filhos”, isto é, aquele que lhe suceder.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no santuário”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: Expressa naturalmente em português o acusativo de duração, indicando todo o período em que as vestes sacerdotais devem ser usadas.
- source_word: יִלְבָּשָׁם
  choice: vestirá essas roupas
  rationale: O verbo לבש pode designar tanto o ato de vestir quanto o estado de usar uma roupa. “Vestirá essas roupas” é natural em português e retoma explicitamente as vestes mencionadas no contexto anterior.
- source_word: הַכֹּהֵן תַּחְתָּיו
  choice: o sacerdote ... que lhe suceder
  rationale: Embora תַּחְתָּיו seja literalmente “em seu lugar”, o contexto trata da sucessão no ofício sacerdotal. A formulação escolhida comunica isso com clareza sem acrescentar uma interpretação doutrinária posterior.
- source_word: מִבָּנָיו
  choice: dentre os seus filhos
  rationale: Preserva o sentido partitivo da expressão e identifica o sucessor como pertencente ao grupo dos filhos do sacerdote.
- source_word: אֲשֶׁר יָבֹא
  choice: quando entrar
  rationale: No contexto, a oração relativa também possui valor circunstancial ou temporal, ligando a entrada na tenda ao exercício do serviço sacerdotal.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução direta e inteligível da designação cultual do tabernáculo, preservando a ideia de encontro sem recorrer a terminologia excessivamente tradicional.
- source_word: לְשָׁרֵת
  choice: para servir
  rationale: O verbo português “servir” comunica de modo claro o serviço oficial do sacerdote no contexto sagrado.
- source_word: בַּקֹּדֶשׁ
  choice: no lugar santo
  rationale: Mantém a referência concreta ao espaço sagrado onde se realiza o serviço sacerdotal; “no santuário” também é possível.
theological_decisions:
- issue: Linguagem de sucessão sacerdotal
  choice: o sacerdote dentre os seus filhos que lhe suceder
  alternative: o sacerdote dentre os seus filhos que ocupar o seu lugar
  rationale: A tradução explicita a sucessão no ofício indicada pelo contexto, preserva a descendência familiar e não importa concepções posteriores sobre o sacerdócio.
- issue: Local cultual indicado por בַּקֹּדֶשׁ
  choice: no lugar santo
  alternative: no santuário
  rationale: “Lugar santo” conserva a dimensão espacial e sagrada da expressão hebraica, enquanto a nota registra a alternativa legítima sem decidir além do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dentre os seus filhos” conserva a relação partitiva; “tenda do encontro” mantém a designação cultual em linguagem transparente; e as notas preservam as alternativas lexicais reais do hebraico.
