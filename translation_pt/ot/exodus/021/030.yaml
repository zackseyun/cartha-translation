  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: pt
  text: Se lhe for imposto um resgate[a], ele pagará o preço pela redenção de sua vida, conforme tudo o que lhe for imposto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se lhe for exigido um pagamento de resgate”. O hebraico emprega dois termos relacionados, mas distintos: כֹּפֶר (resgate ou pagamento de resgate) e פִּדְיֹן (preço de redenção).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma condição no desdobramento da lei anterior; “Se” preserva diretamente a estrutura condicional.
- source_word: כֹּפֶר
  choice: um resgate
  rationale: Designa um pagamento que livra da pena ou obtém liberação; “resgate” conserva o sentido jurídico sem introduzir linguagem cultual de expiação.
- source_word: יוּשַׁת עָלָיו
  choice: lhe for imposto
  rationale: O passivo de שׁית com עַל expressa uma obrigação colocada sobre alguém; a formulação é natural em português jurídico corrente.
- source_word: וְנָתַן
  choice: ele dará
  rationale: Dá continuidade à consequência legal da condição, preservando o verbo hebraico “dar” e sua força prescritiva.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: como preço pela redenção de sua vida
  rationale: Mantém a distinção lexical entre כֹּפֶר e פִּדְיֹן e entende נֶפֶשׁ, neste contexto judicial, como a vida da pessoa.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: tudo o que lhe for imposto
  rationale: Expressa que o pagamento deve corresponder integralmente ao valor determinado, preservando כֹּל e a repetição da fórmula jurídica.
theological_decisions:
- issue: Natureza do pagamento em um contexto de responsabilidade sujeita à pena de morte
  choice: Empregar “resgate” e “preço pela redenção” como termos jurídicos distintos.
  alternative: Traduzir ambos os termos por “multa” ou usar linguagem mais forte de expiação.
  rationale: O pagamento judicial livra a vida do responsável da pena aplicável. A tradução conserva a terminologia jurídico-redentora do hebraico sem sugerir inocência moral nem expiação cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita tecnicismo excessivo, preserva a estrutura condicional e mantém a distinção entre os dois termos hebraicos de resgate e redenção.
