  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יָזִ֥ד אִ֛ישׁ עַל רֵעֵ֖/הוּ לְ/הָרְג֣/וֹ בְ/עָרְמָ֑ה מֵ/עִ֣ם מִזְבְּחִ֔/י תִּקָּחֶ֖/נּוּ לָ/מֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: pt
  text: Mas, se um homem tramar contra o seu próximo[a] para matá-lo à traição[b], você o tirará do meu altar[c], para que morra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agir deliberadamente contra” ou “avançar arrogantemente contra”. O verbo hebraico expressa uma ação voluntária e deliberada.
    reason: lexical_alternative
  - marker: b
    text: Ou “com astúcia” ou “de maneira enganosa”.
    reason: lexical_alternative
  - marker: c
    text: A expressão pode aludir a alguém que busca refúgio junto ao altar; nesse caso, ele deve ser retirado dali para morrer.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Mas, se
  rationale: Introduz um caso condicional em contraste com a legislação anterior, conservando tanto a ligação quanto a força adversativa.
- source_word: יָזִד
  choice: tramar contra
  rationale: O hifil de זיד indica ação deliberada, voluntária e presunçosa. No contexto de homicídio, “tramar contra” comunica com naturalidade a premeditação, sem reduzir o termo a uma simples atitude arrogante.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém a forma masculina singular do texto hebraico e se ajusta ao estilo jurídico do contexto.
- source_word: עַל רֵעֵהוּ
  choice: contra o seu próximo
  rationale: A preposição indica ação hostil dirigida a outra pessoa da comunidade; “próximo” preserva a expressão ético-jurídica tradicional sem restringi-la a um vizinho residencial.
- source_word: לְהָרְגוֹ
  choice: para matá-lo
  rationale: Traduz diretamente o infinitivo de הרג e deixa que o restante do versículo caracterize a ação como intencional e traiçoeira.
- source_word: בְעָרְמָה
  choice: à traição
  rationale: Expressa a ideia de astúcia enganosa e deslealdade no contexto de um homicídio premeditado, em português corrente e juridicamente claro.
- source_word: מֵעִם מִזְבְּחִי
  choice: até mesmo do meu altar
  rationale: Indica que o culpado deve ser retirado da proximidade do altar. “Até mesmo” explicita a força contextual de que nem o lugar sagrado lhe oferece proteção, sem inserir essa explicação no corpo do versículo.
- source_word: תִּקָּחֶנּוּ
  choice: você o tirará
  rationale: Preserva a segunda pessoa masculina singular e a força normativa da instrução; “tirará” se liga naturalmente ao complemento “do meu altar”.
- source_word: לָמוּת
  choice: para que morra
  rationale: Representa a finalidade ou o resultado expresso pelo infinitivo hebraico sem substituir a formulação por “para ser executado”, que seria mais interpretativo.
theological_decisions:
- issue: Se o altar oferece asilo a quem mata intencionalmente
  choice: O versículo nega a proteção do santuário no caso de homicídio premeditado e traiçoeiro.
  alternative: O altar seria apenas o lugar de onde o acusado é retirado, sem referência específica ao direito de asilo.
  rationale: No contexto jurídico, a expressão “do meu altar” sugere fortemente que o espaço sagrado não protege quem mata de maneira deliberada e traiçoeira. A tradução mantém essa implicação, enquanto a nota a esclarece sem tornar explícito no texto principal mais do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom jurídico direto, usa “você” para a segunda pessoa singular e mantém “homem” e “próximo” por correspondência com a forma e o vocabulário do hebraico.
