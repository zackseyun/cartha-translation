  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: pt
  text: Mas, se ele a destinar para seu filho, deverá tratá-la conforme o direito das filhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme o costume das filhas”. A expressão hebraica pode indicar uma norma legal estabelecida ou um tratamento costumeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição contrastante na sequência de casos legais; a formulação é natural em português.
- source_word: לִבְנוֹ
  choice: a seu filho
  rationale: A preposição indica que a moça é destinada ao filho no contexto de um arranjo matrimonial.
- source_word: יִיעָדֶנָּה
  choice: a destinar
  rationale: Preserva o caráter formal e jurídico de יעד sem especificar em excesso com 'desposar' ou 'prometer em casamento'.
- source_word: כְּמִשְׁפַּט
  choice: segundo os direitos
  rationale: No contexto legal, מִשְׁפָּט pode indicar a norma ou prerrogativa devida; 'direitos' comunica bem sua força jurídica.
- source_word: הַבָּנוֹת
  choice: das filhas
  rationale: Reproduz diretamente o substantivo hebraico e aponta para a condição reconhecida às filhas.
- source_word: יַעֲשֶׂה לָּהּ
  choice: deverá tratá-la
  rationale: Expressa de modo natural a ação e as obrigações para com ela, mantendo o tom prescritivo da lei.
theological_decisions:
- issue: Natureza da obrigação para com a moça destinada ao filho
  choice: Ela deve receber o tratamento e os direitos correspondentes aos das filhas.
  alternative: A expressão se refere mais estritamente ao costume seguido nos casamentos das filhas.
  rationale: A expressão hebraica כמשפט הבנות admite força jurídica, mas também pode apontar para a prática estabelecida. O texto principal comunica a proteção legal, e a nota preserva a alternativa lexical sem impor uma elaboração doutrinária.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário jurídico acessível. A construção preserva a concisão casuística do hebraico.
