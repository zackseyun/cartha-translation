  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male slave or the eye of his female slave and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: pt
  text: Se um homem ferir o olho de seu escravo ou o olho de sua escrava e o destruir[a], deverá libertá-lo por causa do olho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o deixar cego”. O verbo hebraico pode denotar arruinar ou incapacitar permanentemente o olho.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em lugar do olho dele”; no contexto jurídico, a libertação é concedida como reparação pela lesão ao olho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Se
  rationale: Introduz uma cláusula de lei casuística; em português, “Se” expressa naturalmente a condição, sem necessidade de reproduzir mecanicamente o conectivo.
- source_word: יַכֶּה
  choice: ferir
  rationale: נכה significa golpear ou atingir. “Ferir” é natural no contexto e abrange o golpe que causa a lesão descrita, sem sugerir agressões repetidas.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o substantivo masculino singular do hebraico e a formulação do sujeito jurídico.
- source_word: עֵין
  choice: o olho
  rationale: A construção com o sufixo possessivo é vertida naturalmente como “o olho de seu...”.
- source_word: עַבְדּוֹ
  choice: seu escravo
  rationale: Neste contexto jurídico de posse e alforria, עבד indica condição escrava; “escravo” retrata essa realidade com clareza.
- source_word: אֲמָתוֹ
  choice: sua escrava
  rationale: אמה designa especificamente uma mulher em condição escrava, preservando o paralelo explícito com עבד.
- source_word: וְשִׁחֲתָהּ
  choice: e o destruir
  rationale: שחת denota arruinar ou causar dano incapacitante ao olho. “Destruir” mantém a amplitude do termo sem limitá-lo explicitamente à cegueira total.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: deverá libertar essa pessoa
  rationale: A expressão exige a soltura para a liberdade. “Deverá libertar” comunica com naturalidade a força jurídica; “essa pessoa” evita que um pronome masculino em português pareça excluir a escrava mencionada.
- source_word: תַּחַת עֵינוֹ
  choice: em compensação pelo olho
  rationale: תחת, neste contexto jurídico, expressa substituição ou reparação; a liberdade é concedida como compensação pela perda sofrida.
theological_decisions:
- issue: Terminologia da escravidão na lei israelita
  choice: escravo / escrava
  alternative: servo / serva
  rationale: O contexto envolve domínio do senhor e libertação obrigatória, tornando “escravo/escrava” mais preciso e menos eufemístico.
- issue: Referente do pronome masculino em יְשַׁלְּחֶנּוּ
  choice: essa pessoa
  alternative: ele deverá libertá-lo
  rationale: O sufixo hebraico é masculino por concordância formal, mas a norma se aplica explicitamente ao escravo ou à escrava. A formulação inclusiva preserva a abrangência contextual sem alterar o sujeito masculino da lei.
- issue: Natureza da lesão ocular
  choice: destruir o olho
  alternative: cegar
  rationale: O verbo pode implicar perda permanente da função, inclusive cegueira, mas o texto não exige que a tradução restrinja a lesão à cegueira total.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o sujeito jurídico masculino e os termos explícitos para escravidão, mas usa “essa pessoa” para deixar claro que a obrigação de libertar se aplica tanto ao escravo quanto à escrava.
