  terminology: «Escravo/escrava» é adequado ao contexto legal. «Ferir» e «destruir» refletem de modo aceitável os verbos hebraicos. «Em compensação pelo olho» comunica bem o valor jurídico de תחת, mas «por causa do olho» evita fazer da explicitação interpretativa parte excessivamente marcada do texto.
