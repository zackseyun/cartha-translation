  terminology: '«Boi», «chifrar», «advertido», «manteve preso», «apedrejado» e «será morto» são adequados ao registro jurídico-narrativo. A nota b deve citar corretamente a expressão que explica: «desde ontem e anteontem», e não «desde ontem e o dia anterior».'
