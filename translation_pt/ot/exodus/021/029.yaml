source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: pt
  text: Mas, se um boi já tinha o hábito de chifrar[a] desde ontem e anteontem[b], e seu dono havia sido advertido, mas não o manteve preso, e ele matar um homem ou uma mulher, o boi será apedrejado, e também seu dono será morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era um boi que costumava chifrar”. O particípio hebraico descreve um animal conhecido por chifrar repetidamente.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “desde ontem e anteontem”, expressão hebraica que indica um comportamento anterior já estabelecido.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: boi
  rationale: É o termo singular convencional e natural para o bovino doméstico neste contexto jurídico, sem enfatizar desnecessariamente o sexo do animal.
- source_word: נַגָּח
  choice: tinha o hábito de chifrar
  rationale: O particípio descreve uma característica habitual e conhecida, não apenas um ataque isolado.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: desde ontem e anteontem
  rationale: Preserva a expressão temporal hebraica e seu sabor jurídico, enquanto a nota esclarece que ela indica comportamento anterior já estabelecido.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: seu dono havia sido advertido
  rationale: No contexto legal, a forma passiva indica que o proprietário recebeu aviso sobre o comportamento perigoso do animal.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: não o manteve preso
  rationale: Expressa concretamente a omissão de guardar, conter ou confinar um animal cuja periculosidade já era conhecida.
- source_word: וְהֵמִית
  choice: o boi matar
  rationale: A formulação direta preserva a estrutura condicional da lei casuística e identifica claramente o animal como causador da morte.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: um homem ou uma mulher
  rationale: Mantém a referência explícita do hebraico a vítimas de ambos os sexos.
- source_word: יִסָּקֵל
  choice: será apedrejado
  rationale: Reproduz a pena prescrita pelo verbo hebraico sem acrescentar ao texto principal uma explicitação desnecessária do resultado fatal.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: e também seu dono será morto
  rationale: Preserva a fórmula jurídica passiva de pena capital, sem especificar um método de execução que o texto não informa.
theological_decisions:
- issue: Força jurídica da pena imposta ao dono
  choice: também seu dono será morto
  alternative: também seu dono morrerá
  rationale: A forma causativa passiva יוּמָת indica morte imposta como sanção judicial, e não apenas que o proprietário acabará morrendo.
- issue: Referência ao sexo da vítima
  choice: um homem ou uma mulher
  alternative: uma pessoa
  rationale: O original menciona expressamente homem e mulher; a tradução conserva essa especificidade sem neutralizá-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o caráter casuístico e jurídico do versículo. Os marcadores foram posicionados junto às expressões que cada nota explica.
