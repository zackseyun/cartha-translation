lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: E estes
  rationale: Preserva a ligação explícita de וְ com a seção anterior e traduz o demonstrativo de modo natural em português.
- source_word: הַ/מִּשְׁפָּטִים
  choice: os estatutos
  rationale: No contexto do código da aliança, o termo designa determinações legais ou normas de direito; “estatutos” comunica esse sentido com clareza, enquanto a nota preserva as alternativas mais judiciais.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo natural em português para introduzir a oração.
- source_word: תָּשִׂים
  choice: você porá
  rationale: Traduz o sentido básico de שׂוּם, “pôr/colocar”, mantendo o valor instrutivo da forma verbal dirigida a Moisés.
- source_word: לִ/פְנֵי/הֶם
  choice: diante deles
  rationale: Equivalente idiomático e formal de “perante eles”, indicando que as normas devem ser apresentadas ao povo.
theological_decisions:
- issue: Tradução de מִשְׁפָּטִים no contexto da lei da aliança
  choice: estatutos
  alternative: decisões judiciais; ordenanças; normas
  rationale: A escolha comunica a função normativa da seção sem reduzir o termo a leis genéricas; a nota registra a nuance de decisões legais ou jurisprudência, preservando a amplitude do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O conectivo inicial foi preservado porque o hebraico contém וְ; “diante deles” mantém a formulação jurídica e apresentacional do original.
