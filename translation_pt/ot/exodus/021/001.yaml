  text: These are the judgments that you shall set before them:[a]
translation:
  language: pt
  text: E estas são as decisões judiciais que você lhes apresentará:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “juízos”, “ordenanças” ou “normas”. O termo hebraico pode se referir a decisões legais ou a leis formuladas a partir de casos.
