base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: pt
  text: Se homens brigarem e atingirem uma mulher grávida, de modo que os filhos dela saiam[a], mas não houver dano grave[b], ele certamente será multado conforme o marido da mulher lhe impuser e pagará conforme decisão dos juízes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos dela saiam”. A expressão pode indicar um parto prematuro; algumas traduções a entendem como aborto espontâneo.
    reason: lexical_alternative
  - marker: b
    text: O hebraico não especifica, neste versículo isoladamente, se o dano grave diz respeito à mãe, aos filhos ou a qualquer um deles.
    reason: alternative_reading
  - marker: c
    text: Ou “por decisão judicial” ou “perante os juízes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Se
  rationale: Introduz uma situação de direito casuístico; “se” é a forma natural e precisa em português.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: alguns homens brigarem
  rationale: Mantém a referência masculina explícita e expressa uma altercação física em linguagem corrente.
- source_word: וְנָגְפוּ
  choice: atingirem
  rationale: Comunica o golpe físico sem determinar antecipadamente sua gravidade ou intenção.
- source_word: אִשָּׁה הָרָה
  choice: uma mulher grávida
  rationale: Equivalente moderno, claro e direto da expressão hebraica.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: fazendo com que os filhos dela saiam
  rationale: Preserva a formulação concreta e ambígua do hebraico, sem decidir entre parto prematuro, nascimento com vida ou aborto espontâneo.
- source_word: אָסוֹן
  choice: dano grave
  rationale: Expressa uma calamidade ou lesão séria sem restringir o termo à morte; o referente do dano permanece sem especificação.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: certamente será multado
  rationale: A construção intensiva exige uma penalidade certa; o contexto de imposição e pagamento indica uma multa.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: conforme o marido da mulher lhe impuser
  rationale: Mantém a participação do marido na fixação da penalidade e reproduz a linguagem jurídica do texto.
- source_word: וְנָתַן בִּפְלִלִים
  choice: e pagará perante os juízes
  rationale: Interpreta וְנָתַן como pagamento no contexto financeiro e preserva a ligação da quantia com a instância judicial.
theological_decisions:
- issue: Natureza da saída dos filhos e alcance do dano
  choice: Manter “os filhos dela saiam” e não especificar quem poderia sofrer o dano grave.
  alternative: Traduzir como aborto espontâneo ou parto prematuro e aplicar o dano somente à mãe, ou à mãe e aos filhos.
  rationale: O hebraico não resolve por si só se houve aborto espontâneo ou parto prematuro, nem identifica expressamente a pessoa a quem אָסוֹן se aplica. A tradução preserva essa tensão ética e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção literal controversa é mantida no texto e esclarecida em nota; “aquele que a atingiu” torna natural o sujeito singular da sanção sem atribuir a penalidade indistintamente a todos os homens envolvidos.
