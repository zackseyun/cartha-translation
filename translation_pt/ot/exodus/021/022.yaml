  naturalness: O registro é moderno e compreensível. «De modo que os filhos dela saiam» mantém a estranheza controlada necessária para uma expressão hebraica disputada, mas é sintaticamente mais fluido do que «fazendo com que ... saiam».
  terminology: «Mulher grávida», «dano grave» e «multado» são adequados. «Conforme decisão dos juízes» comunica melhor a resolução judicial implicada por בִּפְלִלִים do que «perante os juízes», que pode sugerir apenas comparecimento diante deles.
