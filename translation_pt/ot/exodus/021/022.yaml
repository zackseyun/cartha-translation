revisions:
- from: Se alguns homens brigarem e atingirem uma mulher grávida, fazendo com que os filhos dela saiam[a], mas não houver dano grave[b], aquele que a atingiu certamente será multado conforme o marido da mulher lhe impuser, e pagará perante os juízes[c].
  to: Se homens brigarem e atingirem uma mulher grávida, de modo que os filhos dela saiam[a], mas não houver dano grave[b], ele certamente será multado conforme o marido da mulher lhe impuser e pagará conforme decisão dos juízes[c].
  rationale: A revisão remove o acréscimo «alguns», melhora a fluência da cláusula relativa à saída dos filhos sem interpretar o evento e substitui «perante os juízes» por uma formulação que reflete mais diretamente a decisão judicial exigida pelo hebraico. O pronome singular «ele» conserva a sanção no singular do texto hebraico sem identificar indevidamente um dos homens envolvidos.
