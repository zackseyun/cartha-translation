  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: pt
  text: Mas, se houver dano[a], darás vida por vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ferimento grave” ou “morte”; o termo hebraico pode indicar dano grave ou desastre, e há divergência sobre se, neste contexto, ele se refere a um ferimento em geral ou especificamente à morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso anterior; “Mas, se” expressa naturalmente essa força contextual.
- source_word: אָסוֹן
  choice: dano
  rationale: O substantivo pode indicar dano grave, desastre ou resultado fatal. “Dano” mantém a formulação abrangente sem decidir uma questão que o hebraico deste versículo deixa em aberto.
- source_word: יִהְיֶה
  choice: houver
  rationale: A construção existencial “se houver” é idiomática em português e corresponde ao sentido de ocorrência expresso pela forma verbal hebraica.
- source_word: וְנָתַתָּה
  choice: darás
  rationale: Preserva o sentido básico de נתן, “dar”, e a segunda pessoa do singular da formulação legal. Evita “pagarás”, que poderia sugerir indevidamente compensação monetária.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: vida por vida
  rationale: Neste enunciado jurídico, נֶפֶשׁ significa “vida”, e תַּחַת expressa correspondência ou substituição. A repetição conserva a simetria enfática do hebraico.
theological_decisions:
- issue: Alcance e gravidade do dano indicado por אָסוֹן
  choice: Traduzir de modo abrangente como “dano”, sem especificar quem o sofre nem afirmar que seja necessariamente fatal.
  alternative: “ferimento grave” ou “morte”
  rationale: O versículo não identifica explicitamente o atingido nem restringe por si só o termo a um resultado fatal. A tradução preserva essa ambiguidade e evita resolver uma controvérsia interpretativa.
translation_notes:
  register: Português atual, claro e solene. “Darás” conserva a segunda pessoa singular do hebraico e é amplamente compreensível no mundo lusófono; a construção breve mantém o caráter formular da legislação.
