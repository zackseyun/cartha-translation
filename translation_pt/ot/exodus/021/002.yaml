  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew slave[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: pt
  text: Se você comprar um escravo hebreu[a], ele servirá durante seis anos; mas, no sétimo, sairá livre, sem pagar nada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando você comprar um escravo hebreu”. A partícula hebraica pode introduzir esta lei casuística tanto como condição quanto como situação prevista.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “sairá para a liberdade, de graça”. Isto é, sua libertação não exigirá pagamento.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz uma lei casuística. “Se” preserva o caráter condicional e é natural no estilo jurídico em português; “quando” também é possível.
- source_word: תִקְנֶה
  choice: você comprar
  rationale: O qal de קנה significa comprar ou adquirir. “Comprar” expressa com transparência a transação legal aqui descrita.
- source_word: עֶבֶד
  choice: escravo
  rationale: O contexto trata de uma pessoa comprada e sujeita a serviço compulsório por prazo determinado; “escravo” torna essa condição explícita, sem suavizá-la como “servo” poderia fazer.
- source_word: עִבְרִי
  choice: hebreu
  rationale: Reproduz o adjetivo étnico específico do hebraico sem o substituir pelo termo mais amplo “israelita”.
- source_word: שֵׁשׁ שָׁנִים
  choice: durante seis anos
  rationale: Expressa com naturalidade em português a duração do serviço.
- source_word: יַעֲבֹד
  choice: ele servirá
  rationale: עבד pode significar trabalhar ou servir. “Servirá” é adequado ao contexto legal, enquanto “escravo” já explicita a condição da pessoa.
- source_word: וּבַשְּׁבִעִת
  choice: mas, no sétimo
  rationale: Embora ו seja normalmente aditivo, aqui a relação com os seis anos anteriores é contrastiva. “Mas” comunica naturalmente essa transição; “ano” permanece elíptico como no hebraico.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: sairá livre
  rationale: Preserva a imagem hebraica de sair da condição de escravidão e resulta em português claro e idiomático.
- source_word: חִנָּם
  choice: sem pagar nada
  rationale: Indica que a libertação não exige pagamento ou preço de resgate da parte do escravo. A formulação é clara e contemporânea.
theological_decisions:
- issue: Tradução de עֶבֶד no contexto da legislação sobre escravidão
  choice: escravo
  alternative: servo; servo contratado
  rationale: A pessoa é objeto de compra e está juridicamente vinculada ao serviço. “Escravo” preserva essa realidade social e legal, ao passo que “servo” poderia sugerir apenas emprego doméstico voluntário.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A forma “você” representa o destinatário masculino singular do hebraico sem recorrer ao registro mais regional de “tu”. A estrutura legal e a dureza histórica de “escravo” foram preservadas.
