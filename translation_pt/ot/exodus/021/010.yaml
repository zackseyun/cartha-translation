base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: pt
  text: Se ele tomar outra mulher por esposa, não diminuirá o alimento, as roupas nem os direitos conjugais dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a comida, as roupas e a intimidade conjugal dela”. O último termo hebraico refere-se à obrigação do marido quanto à intimidade no casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a forma condicional característica da legislação casuística.
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: ele tomar outra mulher por esposa
  rationale: No contexto matrimonial, לקח com referência a uma mulher significa tomá-la como esposa; a formulação também representa o sentido de לוֹ de modo natural em português.
- source_word: שְׁאֵרָהּ
  choice: o alimento
  rationale: Embora o substantivo tenha associações com carne, nesta tríade de obrigações matrimoniais indica mais provavelmente a provisão de comida.
- source_word: כְּסוּתָהּ
  choice: as roupas
  rationale: Expressa em português corrente o sentido de vestimenta ou cobertura necessária.
- source_word: וְעֹנָתָהּ
  choice: os direitos conjugais
  rationale: O termo difícil designa a obrigação de intimidade matrimonial; esta tradução é clara, digna e preserva o caráter jurídico.
- source_word: לֹא יִגְרָע
  choice: não diminuirá
  rationale: Mantém o sentido de reduzir ou diminuir e aplica-se naturalmente às três obrigações enumeradas.
theological_decisions:
- issue: Referente dos sufixos femininos em שְׁאֵרָהּ, כְּסוּתָהּ e עֹנָתָהּ
  choice: Explicitar “da primeira” após a lista
  alternative: Deixar apenas os artigos definidos, sem explicitar a mulher anterior
  rationale: O contexto imediato indica que as obrigações continuam sendo devidas à mulher já mencionada; a explicitação evita ambiguidade em português sem resolver qualquer questão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. “Direitos conjugais” comunica a obrigação matrimonial sem linguagem clínica ou excessivamente eufemística.
