base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: pt
  text: Se entrar sozinho[a], sozinho sairá; se for casado[b], sua esposa sairá com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é um idiomatismo que significa “sozinho” ou “desacompanhado”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “se ele é marido de uma mulher”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: sozinho
  rationale: O idiomatismo hebraico indica que o homem entrou desacompanhado. “Sozinho” é natural em português e mantém a repetição jurídica do original.
- source_word: יָבֹא
  choice: entrou
  rationale: No contexto, refere-se à entrada na condição de servo. O pretérito expressa naturalmente em português a circunstância inicial pressuposta pela lei.
- source_word: יֵצֵא
  choice: sairá
  rationale: Refere-se à saída do serviço. “Sairá” preserva a concisão e o paralelismo jurídico com “entrou”.
- source_word: בַּעַל אִשָּׁה
  choice: era casado
  rationale: A expressão significa literalmente alguém que é marido de uma mulher, isto é, um homem casado. “Era casado” comunica com naturalidade que ele já tinha esposa ao entrar no serviço.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: sua mulher sairá com ele
  rationale: Mantém a concordância feminina e declara que a esposa que o acompanhava também deixará o serviço com ele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica concisa. “Sua mulher” preserva a relação expressa no hebraico e tem ampla compreensão, enquanto “era casado” evita uma tradução literal pouco natural.
