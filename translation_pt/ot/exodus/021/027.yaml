  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male slave or the tooth of his female slave[a], he shall let him go free in compensation for his tooth.
translation:
  language: pt
  text: E, se ele arrancar um dente de seu escravo ou um dente de sua escrava, deverá libertá-lo[a] em compensação pelo dente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, deverá libertar a pessoa escravizada, seja homem ou mulher. A fórmula jurídica hebraica usa um pronome masculino singular.
    reason: Esclarecer que o pronome gramatical masculino não restringe a aplicação da lei ao escravo homem.
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Introduz um caso condicional que dá continuidade à sequência legal do versículo anterior, preservando a força conectiva do hebraico.
- source_word: שֵׁן
  choice: um dente
  rationale: Termo anatômico direto; o singular do hebraico é preservado.
- source_word: עַבְדּוֹ
  choice: seu escravo
  rationale: Neste contexto jurídico, עבד designa uma pessoa em condição de escravidão; “escravo” comunica essa realidade com mais precisão que “servo”.
- source_word: אֲמָתוֹ
  choice: sua escrava
  rationale: É o correspondente feminino de עבד e preserva a distinção explícita de gênero presente no texto hebraico.
- source_word: יַפִּיל
  choice: arrancar
  rationale: O hifil de נפל significa aqui fazer o dente cair. “Arrancar um dente” expressa de modo natural, sem especificar indevidamente o instrumento ou mecanismo, o resultado da agressão.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: deverá deixá-lo sair livre
  rationale: No contexto legal, שלח com לַחָפְשִׁי determina a libertação da pessoa escravizada. “Deverá” comunica a obrigação jurídica, e o pronome masculino singular reproduz a forma da fórmula hebraica.
- source_word: תַּחַת שִׁנּוֹ
  choice: como compensação pelo dente
  rationale: תחת exprime aqui compensação ou reparação correspondente à lesão sofrida.
theological_decisions:
- issue: Terminologia da escravidão na legislação do Código da Aliança
  choice: escravo / escrava
  alternative: servo / serva
  rationale: A condição jurídica de sujeição é central neste caso legal. “Escravo” e “escrava” representam com clareza a realidade social indicada pelos termos hebraicos e preservam a distinção de gênero, sem suavizá-la.
- issue: Gênero do objeto na ordem de libertação
  choice: deixá-lo sair livre, com nota explicativa
  alternative: deixar essa pessoa sair livre / deixá-los sair livres
  rationale: O hebraico emprega um sufixo masculino singular na fórmula legal, embora o caso explicitamente abranja tanto o escravo quanto a escrava. A tradução conserva a forma gramatical e a nota esclarece o alcance jurídico.
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídica clara. “Sair livre” conserva a imagem verbal do hebraico; a nota evita que o masculino gramatical seja interpretado como limitação do alcance da lei.
