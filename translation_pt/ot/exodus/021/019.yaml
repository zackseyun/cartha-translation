revisions:
- from: Se ele se levantar e andar lá fora apoiado em seu bordão[a], quem o golpeou ficará livre; deverá apenas indenizá-lo pelo tempo de inatividade[b] e fazer com que seja completamente curado[c].
  to: Se ele se levantar e andar lá fora apoiado em sua bengala[a], aquele que o golpeou ficará isento; deverá apenas indenizá-lo pelo tempo em que ficou incapacitado[b] e providenciar que seja plenamente curado[c].
  rationale: A revisão melhora a inteligibilidade e a precisão jurídica em português moderno, sem alterar o sentido da lei casuística nem resolver além do necessário a natureza exata da isenção. As notas mantêm o vínculo com as expressões hebraicas e explicam a obrigação de assegurar a cura.
