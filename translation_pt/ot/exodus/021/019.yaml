  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: pt
  text: Se ele se levantar e andar lá fora apoiado em sua bengala[a], aquele que o golpeou ficará isento; deverá apenas indenizá-lo pelo tempo em que ficou incapacitado[b] e providenciar que seja plenamente curado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre seu bordão” ou “apoiado em seu bordão”. A expressão hebraica diz literalmente “sobre seu bordão” e descreve uma caminhada com apoio como evidência de recuperação parcial.'
    reason: lexical_alternative
  - marker: b
    text: O “tempo em que ficou incapacitado” é o período durante o qual o ferido não pôde exercer suas atividades normais, com a perda de trabalho correspondente.
    reason: cultural_note
  - marker: c
    text: O hebraico emprega uma construção enfática, literalmente “curar, ele o curará”. No contexto, quem causou o ferimento deve assegurar a recuperação do ferido, provavelmente arcando com o tratamento necessário.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: Se ele se levantar
  rationale: Expressa naturalmente a condição e a recuperação suficiente para que o ferido se levante após permanecer incapacitado.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: e andar lá fora
  rationale: O hitpael indica locomoção, e 'lá fora' representa o movimento para além do lugar de repouso como sinal de recuperação.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: apoiado em seu bordão
  rationale: Torna explícita, sem exceder o hebraico, a função de apoio indicada pela preposição עַל e pelo substantivo מִשְׁעֶנֶת.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: quem o golpeou ficará livre
  rationale: Preserva a formulação jurídica de isenção sem sugerir que cesse a obrigação compensatória declarada em seguida.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: deverá apenas indenizá-lo pelo tempo de inatividade
  rationale: No contexto de lesão corporal, שִׁבְתּוֹ designa o período de incapacidade e a perda correspondente; 'indenizar' comunica a função jurídica de יִתֵּן.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: e fazer com que seja completamente curado
  rationale: A construção enfática com infinitivo absoluto e verbo finito exige que o agressor assegure a cura, sem pressupor que ele próprio atue como médico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura de lei casuística. 'Bordão' preserva o cenário antigo, enquanto 'apoiado' esclarece sua função. A redação mantém a tensão entre a isenção jurídica e as obrigações remanescentes de indenizar e assegurar a cura.
