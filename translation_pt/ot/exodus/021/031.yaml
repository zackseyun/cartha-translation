  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: pt
  text: Se o boi chifrar um filho ou uma filha, será feito ao dono conforme esta mesma sentença.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, aplica-se ao dono a mesma pena legal declarada no versículo anterior quando o boi chifra um filho ou uma filha.
    reason: cross_reference
  - marker: b
    text: 'Ou: “conforme esta mesma regra” ou “conforme esta mesma decisão legal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Se
  rationale: Embora אוֹ normalmente signifique “ou”, aqui introduz um caso alternativo dentro da mesma lei casuística; em português, “Se” expressa com naturalidade essa continuidade jurídica.
- source_word: בֵן ... בַת
  choice: um filho ou uma filha
  rationale: Mantém o par específico e simétrico do hebraico, sem substituí-lo interpretativamente por “menino ou menina”.
- source_word: יִגָּח
  choice: o boi chifrar
  rationale: O verbo נגח denota ferir com os chifres. O sujeito implícito, recuperado do contexto anterior, é o boi; explicitá-lo torna a frase clara em português.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: conforme esta mesma sentença
  rationale: מִשְׁפָּט, neste contexto jurídico, indica a decisão ou pena estabelecida no caso anterior. “Mesma” torna explícita a referência anafórica de “esta”, sem alterar a norma.
- source_word: יֵעָשֶׂה לּוֹ
  choice: será feito ao dono
  rationale: Preserva a construção passiva do hebraico e identifica, pelo contexto, o referente masculino de לּוֹ como o dono do boi.
theological_decisions:
- issue: Referente de לּוֹ (“a ele”)
  choice: ao dono
  alternative: a ele
  rationale: O contexto imediato trata da responsabilidade do dono do boi. A explicitação evita que o leitor entenda que a sentença é aplicada ao filho, à filha ou ao próprio animal, embora o hebraico use apenas o pronome.
translation_notes:
  register: Português moderno, claro e digno, com terminologia jurídica acessível. A formulação conserva o paralelismo “filho ou filha” e a voz passiva da lei hebraica, explicitando apenas os referentes exigidos pela clareza em português.
