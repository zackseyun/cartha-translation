base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/024.yaml
  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: pt
  text: olho por olho[a], dente por dente, mão por mão, pé por pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «olho em lugar de olho, dente em lugar de dente, mão em lugar de mão, pé em lugar de pé».'
    reason: Alternativa lexical para תַּחַת, explicitando seu sentido substitutivo neste contexto.
lexical_decisions:
- source_word: עַיִן
  choice: olho
  rationale: O substantivo designa o olho físico. A forma sem artigo preserva em português a concisão e o paralelismo da fórmula jurídica hebraica.
- source_word: תַּחַת
  choice: por
  rationale: Neste contexto jurídico, תַּחַת indica correspondência ou substituição, não a localização espacial «debaixo de». «Por» é a formulação natural e consagrada em português e mantém a ideia de proporcionalidade sem explicá-la além do texto.
- source_word: שֵׁן
  choice: dente
  rationale: O substantivo significa «dente». A forma sem artigo acompanha a estrutura breve e paralela do hebraico.
- source_word: יָד
  choice: mão
  rationale: O sentido comum aqui é a mão física. «Mão» mantém a correspondência lexical e o ritmo da sequência.
- source_word: רֶגֶל
  choice: pé
  rationale: Embora רֶגֶל possa, em certos contextos, designar de modo mais amplo a perna ou o membro inferior, «pé» é o equivalente mais adequado nesta fórmula jurídica e neste paralelismo de partes do corpo.
theological_decisions:
- issue: Natureza da fórmula jurídica
  choice: 'Manter a declaração concisa de correspondência proporcional: «olho por olho... pé por pé».'
  alternative: 'Explicitar interpretativamente: «a pena deverá corresponder ao dano».'
  rationale: O hebraico apresenta apenas pares de partes do corpo ligados por תַּחַת. Uma paráfrase explicativa resolveria a aplicação jurídica além do que este versículo diz; por isso, preserva-se a fórmula compacta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação tradicional «olho por olho» é também natural no uso corrente e reproduz a concisão e o paralelismo do hebraico. A inicial minúscula reflete o fato de o versículo continuar a frase iniciada no versículo anterior.
