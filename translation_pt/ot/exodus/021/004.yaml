  source_fidelity: 'O sentido jurídico do hebraico está adequadamente preservado: o senhor dá uma esposa ao homem, ela lhe dá à luz filhos ou filhas, e a esposa e seus filhos pertencem ao senhor dela. Contudo, «ela lhe der filhos» é menos preciso para ילד, que se refere explicitamente ao parto; e a nota afirma de modo impreciso que o senhor deu também os filhos.'
  naturalness: «O seu senhor» é mais natural e fluente do que «o senhor dele», sem perder a clareza referencial. «Der à luz filhos ou filhas» é português moderno, claro e fiel ao verbo hebraico.
  terminology: «Senhor», «esposa», «pertencerão» e «sairá sozinho» mantêm o registro jurídico e não suavizam a relação de domínio descrita no texto. A formulação proposta preserva a linguagem sem introduzir avaliação externa.
