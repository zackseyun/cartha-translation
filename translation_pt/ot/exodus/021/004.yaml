source:
  edition: WLC
  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: pt
  text: Se o seu senhor lhe der uma esposa, e ela lhe der à luz filhos ou filhas, a esposa e os filhos dela pertencerão ao senhor dela, e ele sairá sozinho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, sairá sem a esposa que seu senhor lhe deu e sem os filhos dela.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma hipótese na formulação casuística da lei.
- source_word: אֲדֹנָיו
  choice: o senhor dele
  rationale: Expressa a autoridade do chefe sobre o escravo neste contexto jurídico; a construção com «dele» evita confundir o referente com um título divino.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: lhe der uma esposa
  rationale: אִשָּׁה pode significar mulher ou esposa; o contexto de união e geração de filhos favorece «esposa».
- source_word: וְיָלְדָה לוֹ
  choice: e ela lhe der
  rationale: Em português, «dar-lhe filhos» comunica naturalmente a ideia de gerar filhos para ele, sem a rigidez de uma reprodução literal do verbo «dar à luz».
- source_word: בָנִים אוֹ בָנוֹת
  choice: filhos ou filhas
  rationale: Mantém a especificação explícita dos descendentes masculinos e femininos no hebraico.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: a esposa e os filhos dela
  rationale: Mantém «esposa» de modo coerente e usa «filhos» no sentido abrangente de crianças de ambos os sexos, já explicitados na oração anterior.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: pertencerão ao senhor dela
  rationale: A forma verbal singular concorda formalmente com o primeiro elemento, mas o sujeito composto inclui a esposa e os filhos; o plural é natural em português. «Pertencerão» preserva sem atenuação a relação jurídica de posse/status.
- source_word: וְהוּא יֵצֵא בְגַפּוֹ
  choice: e ele sairá sozinho
  rationale: Preserva o verbo «sair» e traduz o raro idiomatismo בְגַפּוֹ pelo sentido contextual de partir desacompanhado.
theological_decisions:
- issue: Terminologia da escravidão em contexto jurídico
  choice: Manter «senhor» e a linguagem explícita de pertencimento
  alternative: Empregar «patrão», «empregador» ou «permanecerão com»
  rationale: O versículo regula uma situação de escravidão ou servidão vinculada e descreve uma relação jurídica de domínio. A tradução não deve suavizar essa realidade nem acrescentar uma avaliação moral alheia ao texto.
- issue: Alcance da saída do escravo
  choice: Traduzir «sairá sozinho» e esclarecer em nota
  alternative: Inserir no texto «será libertado sem a esposa e os filhos»
  rationale: A expressão hebraica é concisa e idiomática. O texto principal preserva essa concisão, enquanto a nota explicita a implicação contextual sem transformar a interpretação em paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Senhor dele/dela» foi preferido a formas possessivas potencialmente ambíguas. A linguagem jurídica e a dureza social do texto foram preservadas sem eufemismo.
