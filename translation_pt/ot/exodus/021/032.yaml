  text: אִם עֶ֛בֶד יִגַּ֥ח הַ/שּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽ/אדֹנָ֔י/ו וְ/הַ/שּׁ֖וֹר יִסָּקֵֽל־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male slave or a female slave[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: pt
  text: Se o boi chifrar um escravo ou uma escrava[a], seu dono dará trinta siclos de prata ao senhor do escravo ou da escrava, e o boi será apedrejado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa escravizada, homem ou mulher”. O hebraico distingue um escravo (עֶבֶד) de uma escrava (אָמָה).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: escravo
  rationale: Neste contexto jurídico, o termo indica condição de escravidão; em contraste com אָמָה, designa especificamente o escravo do sexo masculino.
- source_word: אָמָה
  choice: escrava
  rationale: Em paralelo com עֶבֶד, designa uma mulher escravizada. “Escrava” preserva de modo claro e direto a condição jurídico-social.
- source_word: יִגַּח
  choice: chifrar
  rationale: O verbo נגח, nas leis sobre bois, descreve o ato de ferir com os chifres. “Chifrar” é preciso e natural em português.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: trinta siclos de prata
  rationale: A expressão especifica uma quantidade de prata medida em siclos; a formulação é tradicional, clara e preserva o caráter de unidade de peso.
- source_word: יִתֵּן
  choice: dará
  rationale: O imperfeito, nesta lei casuística, expressa obrigação jurídica. O futuro simples mantém a forma concisa e normativa do hebraico.
- source_word: לַאדֹנָיו
  choice: ao senhor do escravo ou da escrava
  rationale: O sufixo masculino singular retoma gramaticalmente a pessoa escravizada mencionada de forma alternativa. A explicitação evita que o leitor entenda que se trata do dono do boi, sem alterar o referente mais natural.
- source_word: יִסָּקֵל
  choice: será apedrejado
  rationale: O nifal de סקל indica execução por apedrejamento. A formulação concisa preserva o registro legal do original.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concisão jurídica. “Escravo ou uma escrava” preserva a distinção sexual explícita no hebraico; “senhor do escravo ou da escrava” esclarece o referente pronominal potencialmente ambíguo em português.
