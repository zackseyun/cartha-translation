  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: pt
  text: E, se ele não fizer por ela essas três coisas[a], ela sairá livre, sem qualquer pagamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se ele não lhe providenciar essas três coisas”. O hebraico diz literalmente “não fizer por ela essas três”, em referência ao alimento, às roupas e aos direitos conjugais mencionados no versículo anterior.'
