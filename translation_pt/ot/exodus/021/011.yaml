lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Mantém a força conectiva de וְ e introduz naturalmente a condição que dá continuidade à legislação anterior.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: essas três coisas
  rationale: Retoma as três obrigações mencionadas no versículo anterior; acrescentar “coisas” torna a referência clara e natural em português.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: não fizer por ela
  rationale: Preserva a amplitude de עשה, “fazer”, sem interpretar em excesso, enquanto “por ela” expressa o beneficiário indicado por לָהּ.
- source_word: וְיָצְאָה
  choice: ela sairá
  rationale: Conserva o idioma jurídico hebraico de sair da condição de servidão; a liberdade é explicitada pela palavra seguinte.
- source_word: חִנָּם
  choice: livre
  rationale: No contexto das leis sobre servidão, indica que a mulher é libertada sem custo.
- source_word: אֵין כָּסֶף
  choice: sem pagar nada
  rationale: Expressa em português corrente que nenhum dinheiro deve ser pago por sua libertação, sem sugerir indevidamente quem faria o pagamento.
