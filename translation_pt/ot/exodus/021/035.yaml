source:
  edition: WLC
  text: וְ/כִֽי יִגֹּ֧ף שֽׁוֹר אִ֛ישׁ אֶת שׁ֥וֹר רֵעֵ֖/הוּ וָ/מֵ֑ת וּ/מָ֨כְר֜וּ אֶת הַ/שּׁ֤וֹר הַ/חַי֙ וְ/חָצ֣וּ אֶת כַּסְפּ֔/וֹ וְ/גַ֥ם אֶת הַ/מֵּ֖ת יֶֽחֱצֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: pt
  text: Se o boi de alguém ferir o boi do seu próximo, e este morrer[a], eles venderão o boi vivo e dividirão o valor da venda[b]; dividirão também o boi morto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chifrar”; o verbo hebraico pode designar o golpe forte de um boi.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dividirão o seu dinheiro”, isto é, o dinheiro obtido com a venda do boi vivo.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “o morto”, referindo-se ao boi morto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Se
  rationale: Introduz a condição de uma lei casuística. Em português, “Se” expressa naturalmente a força condicional; o וְ de ligação não precisa ser reproduzido de modo rígido no início do versículo.
- source_word: יִגֹּף
  choice: ferir
  rationale: O verbo denota um golpe forte, inclusive uma chifrada. “Ferir” é amplo o bastante para preservar essa extensão sem especificar indevidamente o modo do golpe.
- source_word: שׁוֹר אִישׁ
  choice: o boi de alguém
  rationale: Expressa com clareza a posse e mantém a formulação jurídica indefinida, em linguagem portuguesa atual.
- source_word: שׁוֹר רֵעֵהוּ
  choice: o boi do seu próximo
  rationale: רֵעַ pode designar o próximo, vizinho ou semelhante. “Seu próximo” preserva a dimensão relacional do termo e é claro no contexto legal.
- source_word: וָמֵת
  choice: e este morrer
  rationale: Mantém a sequência simples entre o golpe e a morte. O demonstrativo “este” deixa claro que quem morre é o boi atingido.
- source_word: וּמָכְרוּ
  choice: eles venderão
  rationale: Dá continuidade à consequência jurídica com valor prescritivo, sem transformar a construção em imperativo direto.
- source_word: הַשּׁוֹר הַחַי
  choice: o boi vivo
  rationale: Tradução direta, natural e concisa para o animal sobrevivente.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: dividirão o valor da venda
  rationale: כֶּסֶף significa literalmente prata ou dinheiro, mas aqui se refere ao dinheiro obtido com a venda do boi vivo. A formulação torna o referente explícito sem alterar a norma.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: dividirão também o boi morto
  rationale: O hebraico diz literalmente “o morto”. A repetição de “boi” elimina uma possível ambiguidade em português, sem especificar se a divisão visa a carcaça ou seu valor.
