  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the slave plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: pt
  text: 'Mas, se o escravo declarar enfaticamente[a]: “Eu amo meu senhor, minha mulher e meus filhos[b]; não sairei livre”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “se, dizendo, o escravo disser”; o hebraico combina o infinitivo absoluto com o verbo finito para dar ênfase à declaração.
    reason: lexical_alternative
  - marker: b
    text: Ou “meus filhos homens”; o termo hebraico está no masculino plural, mas pode referir-se aos filhos em geral neste contexto familiar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição que contrasta com a libertação prevista nos versículos anteriores; «Mas, se» comunica essa transição com naturalidade.
- source_word: אָמֹר יֹאמַר
  choice: declarar enfaticamente
  rationale: A construção com infinitivo absoluto e verbo finito intensifica o ato de dizer. «Declarar enfaticamente» expressa uma afirmação explícita e deliberada sem tentar reproduzir mecanicamente a forma hebraica.
- source_word: הָעֶבֶד
  choice: o escravo
  rationale: O contexto jurídico trata de uma pessoa em condição de servidão cuja libertação está em questão; «escravo» torna clara essa condição, ao passo que «servo» poderia atenuá-la.
- source_word: אָהַבְתִּי
  choice: Eu amo
  rationale: O perfeito hebraico exprime aqui uma afeição e lealdade estabelecidas, apresentadas como realidade atual; o presente é a forma portuguesa mais natural no discurso direto.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: No contexto doméstico e jurídico, «senhor» expressa a autoridade sobre o escravo e é uma colocação natural em português, sem exigir a interpretação mais econômica de «dono».
- source_word: אִשְׁתִּי
  choice: minha mulher
  rationale: Tradução direta e corrente de אִשְׁתִּי; «mulher» no sentido de esposa é natural no português moderno.
- source_word: בָּנָי
  choice: meus filhos
  rationale: O masculino plural pode designar especificamente filhos homens ou, no contexto familiar, os filhos em geral. «Filhos» preserva essa amplitude natural do português.
- source_word: לֹא אֵצֵא
  choice: não quero sair
  rationale: Embora a forma seja literalmente «não sairei», no contexto de uma declaração formal de opção ela comunica recusa ou decisão de não aceitar a libertação. «Não quero sair» torna explícita essa força volitiva contextual sem alterar o resultado jurídico.
- source_word: חָפְשִׁי
  choice: livre
  rationale: Adjetivo predicativo que descreve a condição em que ele sairia; «livre» é conciso e idiomático.
theological_decisions:
- issue: Tradução de עבד na legislação israelita sobre servidão
  choice: escravo
  alternative: servo; servo por dívida
  rationale: A passagem trata da libertação de uma pessoa vinculada ao serviço e de sua renúncia a essa libertação. «Escravo» mantém visível a condição jurídica e evita suavizar a relação de domínio.
- issue: Força volitiva de לֹא אֵצֵא
  choice: não quero sair livre
  alternative: não sairei livre
  rationale: A declaração ocorre no procedimento em que o escravo opta por permanecer. A tradução escolhida comunica essa decisão, enquanto a alternativa conserva mais estritamente a forma verbal hebraica; a nuance não implica uma doutrina específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Escravo» preserva a dureza jurídica do contexto; «meu senhor» e «minha mulher» são naturais no discurso direto. A pontuação mantém o versículo aberto para a continuação sintática do contexto.
