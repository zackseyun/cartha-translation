  source_fidelity: A tradução reproduz corretamente a condição contrastiva, a declaração enfática, a relação de servidão e os objetos do amor declarado. Contudo, לֹא אֵצֵא é formalmente uma negação com verbo imperfeito, «não sairei», e não exprime de modo explícito «não quero sair». Embora o contexto envolva uma decisão voluntária, «não quero» acrescenta uma modalidade volitiva que o hebraico não enuncia diretamente.
  naturalness: O texto é claro, moderno e natural em português de ampla compreensão. «Meu senhor», «minha mulher» e «meus filhos» são adequados ao registro narrativo-jurídico. «Não sairei livre» é igualmente natural e preserva melhor a formulação da fala.
  terminology: «Escravo» comunica adequadamente a condição jurídica salientada pelo contexto. «Senhor» é uma boa tradução contextual de אַדֹנִי. «Filhos» preserva em português a possível abrangência genérica de בָּנָי, cuja forma hebraica é masculina plural.
