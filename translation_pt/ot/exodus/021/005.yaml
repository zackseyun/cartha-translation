    rationale: O hebraico diz literalmente e sintaticamente «não sairei livre». O contexto permite inferir a recusa da liberdade, mas «não quero» explicita uma nuance volitiva adicional. «Não sairei livre» conserva tanto a forma quanto a força decisória da declaração.
