base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: pt
  text: Quem ferir seu pai ou sua mãe certamente será morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e sua mãe”. Aqui, “ou sua mãe” expressa o sentido jurídico de que ferir qualquer um dos pais está em vista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: ferir
  rationale: O particípio de נכה designa quem golpeia ou agride. “Ferir” expressa com dignidade e clareza o ato físico proibido, sem pressupor espancamento repetido nem ataque com arma.
- source_word: אָבִיו
  choice: seu pai
  rationale: O hebraico menciona especificamente o pai no singular, e não emprega o termo genérico “progenitor”.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: O hebraico menciona especificamente a mãe, preservando a referência distinta a ambos os pais.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a fórmula penal passiva. Esta tradução conserva tanto a certeza da pena quanto seu caráter judicial, sem reduzi-la à simples ideia de morrer.
- source_word: וּ / וְ
  choice: ou
  rationale: Embora a conjunção hebraica seja formalmente “e”, no contexto jurídico distributivo a norma se aplica a quem ferir qualquer um dos pais. “Ou” evita sugerir equivocadamente que seria necessário ferir os dois.
theological_decisions:
- issue: Formula da pena capital
  choice: certamente será morto
  alternative: terá de morrer
  rationale: A forma passiva apresenta uma pena judicial aplicada ao infrator, e não apenas o resultado de sua morte. A intensificação do hebraico também fica explícita.
- issue: Relação entre pai e mãe na condição jurídica
  choice: pai ou sua mãe
  alternative: pai e sua mãe
  rationale: O “ou” comunica o alcance distributivo da lei — ferir qualquer um dos dois — enquanto a nota preserva a forma literal da conjunção hebraica.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e leitura natural no Brasil. A formulação concisa mantém o estilo jurídico do contexto.
