  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: pt
  text: Se um homem[b] abrir um poço[a], ou se um homem cavar um poço e não o cobrir, e um boi ou um jumento cair nele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descobrir um poço”. O verbo hebraico significa literalmente “abrir” e pode referir-se a abrir ou deixar descoberto um poço já existente, em contraste com cavar um novo.
    reason: lexical_alternative
  - marker: b
    text: “Um homem” traduz a fórmula jurídica hebraica no masculino singular, usada aqui para apresentar um caso geral.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Se
  rationale: Introduz a condição de uma lei casuística. Em português, “Se” é natural; a conexão com as leis anteriores já fica clara pela sequência do texto.
- source_word: יִפְתַּח
  choice: abrir
  rationale: Preserva o sentido literal do verbo e o distingue de “cavar” na oração seguinte; pode referir-se a deixar acessível uma cisterna já existente.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém a formulação jurídica hebraica no masculino singular, que neste contexto apresenta um caso geral.
- source_word: בּוֹר
  choice: cisterna
  rationale: Designa uma escavação profunda que normalmente seria coberta. No contexto, o perigo de animais caírem nela está em foco; “poço” também é possível, mas pode sugerir uma fonte de água com abertura permanente.
- source_word: א֠וֹ כִּי
  choice: ou se
  rationale: Assinala o cenário jurídico alternativo em paralelo com a primeira oração.
- source_word: יִכְרֶה
  choice: cavar
  rationale: Verbo corrente e preciso para fazer uma escavação, distinguindo esse ato de simplesmente abri-la.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: e não a cobrir
  rationale: Refere-se à cobertura física da abertura; o pronome feminino concorda naturalmente com “cisterna”.
- source_word: וְ/נָפַל
  choice: e ... cair
  rationale: Na sequência casuística, integra naturalmente a condição iniciada por “Se” e evita uma construção temporal desnecessária.
- source_word: שָׁמָּה
  choice: nela
  rationale: Expressa em português natural o movimento para dentro do local mencionado.
- source_word: שּׁוֹר
  choice: um boi
  rationale: Termo comum e adequado para o bovino no contexto de legislação sobre animais domésticos.
- source_word: א֥וֹ חֲמוֹר
  choice: ou um jumento
  rationale: “Jumento” é claro, corrente e amplamente compreendido em português.
