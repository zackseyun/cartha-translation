  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: pt
  text: Quem sequestrar um homem e o vender[a], ou for encontrado com o homem em seu poder[b], certamente será morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “roubar um homem”. Neste contexto, a expressão se refere a sequestrar ou roubar uma pessoa.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e for encontrado com o homem em seu poder”. Hebraico: “em sua mão”, expressão idiomática que indica posse ou controle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: sequestrar
  rationale: Embora o verbo signifique literalmente “roubar”, quando tem uma pessoa como objeto e é seguido de venda ou posse, designa o rapto ou roubo de uma pessoa. “Sequestrar” comunica claramente o delito em português atual.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o substantivo hebraico singular masculino, sem neutralizar a forma do texto-fonte.
- source_word: וּמְכָרוֹ
  choice: e o vender
  rationale: Expressa diretamente o verbo “vender” e o sufixo pronominal masculino singular que retoma o homem sequestrado.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: ou for encontrado com ele em seu poder
  rationale: O nifal de מצא significa “ser encontrado”, e “em sua mão” é uma expressão idiomática de posse ou controle. A formulação portuguesa torna a relação pronominal clara e conserva a alternativa jurídica.
- source_word: מֹות יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a sentença. A formulação transmite uma pena judicial enfática, não uma simples previsão de morte.
theological_decisions:
- issue: Abrangência do delito jurídico
  choice: O texto pune o sequestro ou roubo de uma pessoa, quer a vítima já tenha sido vendida, quer ainda seja encontrada sob o poder do sequestrador.
  alternative: 'A segunda oração pode ser entendida de modo aditivo: “e for encontrado com ele em seu poder”, e não como alternativa disjuntiva.'
  rationale: No contexto da lei casuística, a sintaxe abrange tanto a venda da vítima como sua retenção. Traduzir a conjunção por “ou” explicita essa leitura jurídica comum, sem ocultar a alternativa na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Sequestrar” evita uma tradução literal obscura; “em seu poder” comunica naturalmente o idiomatismo hebraico. A construção legal e a ênfase da pena foram preservadas.
