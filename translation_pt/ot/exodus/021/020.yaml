  source_fidelity: A tradução preserva adequadamente a estrutura condicional, a distinção entre escravo e escrava, o instrumento do golpe e a fórmula enfática de vingança judicial. Contudo, em português, «sob sua mão» pode retomar o antecedente mais próximo («o escravo») em vez do homem que golpeia; o referente precisa ser explicitado. A alternativa da nota também deve explicitar que «punido» se refere ao agressor, não ao escravo.
  naturalness: O registro é claro e adequado. «E se», sem vírgula entre a conjunção e a condição, soa mais natural. «Sob a mão de quem o feriu» conserva o idiomatismo e elimina a ambiguidade pronominal.
  terminology: «Escravo/escrava», «vara» e «será vingado» são escolhas fiéis e apropriadas. A nota mantém corretamente «punido» como alternativa mais interpretativa, desde que seu sujeito seja explicitado.
