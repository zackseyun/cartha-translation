  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male slave or his female slave with a rod[a], and the slave dies under his hand, he must surely be avenged.
translation:
  language: pt
  text: E se um homem ferir seu escravo ou sua escrava com uma vara, e o escravo morrer sob a mão de quem o feriu, ele certamente será vingado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem certamente será punido”. Mais literalmente, o hebraico diz: “ele certamente será vingado”, usando uma fórmula jurídica enfática.'
    reason: Registra uma alternativa interpretativa corrente sem substituir, no texto principal, a formulação lexicalmente mais próxima do hebraico.
lexical_decisions:
- source_word: וְ/כִֽי
  choice: E, se
  rationale: Preserva tanto a ligação com as leis anteriores quanto a introdução da condição casuística.
- source_word: יַכֶּה
  choice: ferir
  rationale: Expressa o sentido amplo de golpear, sem especificar além do hebraico a maneira ou a intensidade; o instrumento é indicado em seguida.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo masculino singular do texto hebraico e seu uso no estilo jurídico.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: seu escravo ou sua escrava
  rationale: O contexto jurídico trata de pessoas em condição de escravidão, não apenas de serviço; a formulação conserva a distinção explícita entre masculino e feminino.
- source_word: בַּשֵּׁבֶט
  choice: com uma vara
  rationale: שֵׁבֶט pode designar vara, bastão ou cetro; como instrumento de golpe, “vara” é a opção portuguesa mais natural neste contexto.
- source_word: וּמֵת
  choice: e o escravo morrer
  rationale: Mantém a sequência ou resultado da ação. A repetição de “o escravo” evita que um pronome seja entendido como referência ao homem.
- source_word: תַּחַת יָדוֹ
  choice: sob sua mão
  rationale: 'Preserva a imagem hebraica e sua força jurídica: a morte ocorre sob a ação ou o controle imediato de quem golpeia.'
- source_word: נָקֹם יִנָּקֵם
  choice: ele certamente será vingado
  rationale: A construção com infinitivo absoluto intensifica o verbo finito, e o nifal de נקם indica que a vítima será vingada. A formulação evita determinar uma pena específica que o versículo não explicita.
theological_decisions:
- issue: Natureza da consequência jurídica em נָקֹם יִנָּקֵם
  choice: ele certamente será vingado
  alternative: ele certamente será punido
  rationale: O hebraico exige enfaticamente uma ação de vingança ou reparação judicial, mas não define neste versículo o mecanismo ou a pena exata. A tradução principal conserva essa abertura; a alternativa explicita o efeito sobre o agressor, porém é mais interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Escravo” e “escrava” nomeiam diretamente a condição jurídica do texto. A expressão “sob sua mão” é deliberadamente mais formal para conservar o idioma hebraico; o referente de “ele” na cláusula final é o escravo mencionado imediatamente antes.
