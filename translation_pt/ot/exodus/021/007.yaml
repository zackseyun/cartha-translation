  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female slave[b][a], she shall not go out as the male slaves go out.
translation:
  language: pt
  text: E, se um homem vender sua filha como escrava[a], ela não sairá como saem os escravos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como serva”. O hebraico אָמָה designa uma escrava; aqui, “escrava” explicita sua condição jurídica.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ela não deixa o serviço nas mesmas condições que os escravos.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: E, se
  rationale: Introduz um novo caso condicional dentro da sequência legal e conserva a força conectiva de וְ.
- source_word: יִמְכֹּר
  choice: vender
  rationale: Expressa diretamente a venda; o futuro do subjuntivo é natural em português para uma hipótese jurídica introduzida por “se”.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o masculino singular e, neste contexto, refere-se ao pai ou chefe masculino da família.
- source_word: בִּתּוֹ
  choice: sua filha
  rationale: Reproduz diretamente o substantivo de parentesco com o sufixo possessivo masculino singular.
- source_word: לְאָמָה
  choice: como escrava
  rationale: אָמָה designa uma mulher em condição servil; “escrava” torna explícita a condição jurídica de sujeição, sem suavizá-la como “serva” ou “criada”.
- source_word: לֹא תֵצֵא
  choice: ela não sairá
  rationale: Preserva a expressão jurídica hebraica de sair do serviço e mantém o paralelismo verbal da comparação seguinte.
- source_word: כְּצֵאת
  choice: como saem
  rationale: Expressa de modo natural a comparação de maneira e conserva a repetição do verbo “sair”.
- source_word: הָעֲבָדִים
  choice: os escravos homens
  rationale: O contraste com אָמָה indica escravos do sexo masculino, especialmente à luz da lei precedente; a formulação explicita essa distinção jurídica de gênero.
theological_decisions:
- issue: Terminologia da escravidão na legislação da aliança
  choice: “escrava” e “escravos homens”
  alternative: “serva”, “criada” e “servos”
  rationale: Como o texto trata de venda e libertação do serviço, a condição de escravidão é central e não deve ser atenuada por termos que possam sugerir apenas emprego doméstico.
- issue: Natureza distinta da saída da filha vendida
  choice: Manter a afirmação comparativa sem explicar no corpo do versículo quais eram as condições diferentes
  alternative: Parafrasear como “ela não será libertada nas mesmas condições que os escravos homens”
  rationale: O hebraico afirma que ela não sai do mesmo modo, mas este versículo isolado não especifica todos os termos; a tradução preserva essa abertura, e a nota esclarece o sentido jurídico básico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe jurídica natural. “E, se” mantém a ligação com a lei anterior; “não sairá como saem” conserva o paralelismo hebraico. A expressão “escravos homens” foi preferida a “escravos do sexo masculino” por ser mais concisa, embora permaneça explicitamente marcada quanto ao gênero.
