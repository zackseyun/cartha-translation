base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: pt
  text: Se um homem roubar um boi ou uma ovelha[a] e abater esse animal ou vendê-lo, restituirá[b] cinco cabeças de gado pelo boi e quatro ovelhas pela ovelha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico שֶׂה pode designar mais amplamente uma cabeça de gado miúdo, incluindo uma ovelha ou uma cabra.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pagará como compensação”. O verbo hebraico tem aqui o sentido jurídico de efetuar restituição ou pagar uma indenização.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz a condição de uma lei casuística; “se” expressa naturalmente em português a estrutura condição-consequência.
- source_word: יִגְנֹב
  choice: roubar
  rationale: É o equivalente direto e corrente de גנב neste contexto jurídico.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o masculino singular genérico do hebraico sem tornar a frase pouco natural.
- source_word: שׁוֹר
  choice: boi
  rationale: Termo tradicional e claro para שׁוֹר numa lei sobre animais domésticos, sem empregar o coletivo “gado” para o animal roubado.
- source_word: שֶׂה
  choice: ovelha
  rationale: O termo pode designar uma cabeça de gado miúdo, ovelha ou cabra; “ovelha” mantém a formulação simples e concorda com a restituição em צֹאן, com a amplitude lexical registrada em nota.
- source_word: וּטְבָחוֹ
  choice: e a abater
  rationale: טבח indica abate, não simplesmente morte; “abater” é atual, preciso e adequado ao contexto de criação animal.
- source_word: אוֹ מְכָרוֹ
  choice: ou vender
  rationale: Reproduz diretamente as duas formas alternativas de disposição do animal roubado.
- source_word: חֲמִשָּׁה בָקָר
  choice: cinco cabeças de gado
  rationale: בקר é coletivo bovino; “cabeças de gado” permite contagem clara sem afirmar que todos os animais restituídos sejam machos.
- source_word: יְשַׁלֵּם
  choice: restituirá
  rationale: No contexto jurídico, שלם expressa pagamento compensatório ou restituição; “restituirá” explicita esse sentido legal.
- source_word: תַּחַת
  choice: por
  rationale: 'Expressa de modo idiomático a correspondência substitutiva da compensação: cinco pelo boi e quatro pela ovelha.'
- source_word: וְאַרְבַּע צֹאן
  choice: e quatro ovelhas
  rationale: Embora צֹאן seja coletivo para gado miúdo, “ovelhas” produz em português uma fórmula coerente com a escolha feita para שֶׂה.
