  yaml_path: translation/ot/exodus/021/012.yaml
  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: pt
  text: Quem ferir um homem e ele morrer certamente será morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Quem ferir um homem, e este morrer, certamente será morto.”'
    reason: Alternativa sintática que torna mais explícita a referência da oração «e ele morrer» à vítima e reproduz de perto a coordenação hebraica.
lexical_decisions:
- source_word: מַכֵּה
  choice: ferir
  rationale: 'O particípio de נכה introduz o caso jurídico: aquele que desfere um golpe. “Ferir” é natural em português e não inclui antecipadamente a morte no próprio verbo.'
- source_word: אִישׁ
  choice: um homem
  rationale: אִישׁ normalmente designa um homem ou indivíduo do sexo masculino. A tradução mantém essa referência sem ampliar silenciosamente o termo para “pessoa”.
- source_word: וָמֵת
  choice: causando-lhe a morte
  rationale: A conjunção seguida da forma verbal de מות apresenta a morte como resultado do golpe. Esta formulação expressa a relação de consequência de modo idiomático, embora o hebraico diga mais literalmente “e ele morrer”.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto מוֹת junto da forma passiva יוּמָת intensifica a certeza da pena de morte. A formulação preserva tanto a ênfase quanto a construção passiva, sem interpretar além do texto com “será executado”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com formulação jurídica compreensível. O pronome enclítico em “causando-lhe” esclarece que a morte é a da vítima; a nota conserva a estrutura mais literal e sua possível rigidez.
