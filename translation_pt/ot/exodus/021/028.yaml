  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: pt
  text: Se um boi chifrar um homem ou uma mulher, e a pessoa morrer, o boi certamente será apedrejado, e sua carne não será comida; mas o dono do boi estará isento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será considerado inocente” ou “não será responsabilizado”. O hebraico emprega נָקִי, termo jurídico que indica estar livre de culpa, responsabilidade ou pena neste caso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Se
  rationale: Introduz uma lei casuística. Em português, “Se” expressa com naturalidade a condição jurídica; o valor conectivo de וְ fica implícito na sequência do texto legal.
- source_word: יִגַּח
  choice: chifrar
  rationale: O verbo indica especificamente ferir ou atacar com os chifres; “chifrar” é preciso, corrente e natural em português.
- source_word: שׁוֹר
  choice: boi
  rationale: É o equivalente singular tradicional e adequado no contexto jurídico, sem restringir indevidamente o sentido a “touro”.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: um homem ou uma mulher
  rationale: Mantém a menção explícita dos dois sexos presente no hebraico.
- source_word: וָמֵת
  choice: e a pessoa morrer
  rationale: O verbo singular se refere à vítima, seja homem, seja mulher. “A pessoa” evita que um pronome masculino pareça excluir a mulher, sem alterar o referente.
- source_word: סָקוֹל יִסָּקֵל
  choice: certamente será apedrejado
  rationale: O advérbio “certamente” representa a ênfase da construção hebraica com infinitivo absoluto e verbo finito, preservando também o tom solene da sentença legal.
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: e sua carne não será comida
  rationale: Conserva a construção passiva e traduz בָּשָׂר por “carne”, de modo formalmente próximo e compreensível.
- source_word: וּבַעַל הַשּׁוֹר
  choice: mas o dono do boi
  rationale: בַּעַל designa aqui o proprietário legal; “dono” é claro e corrente. “Mas” explicita o contraste entre o destino do animal e o do proprietário.
- source_word: נָקִי
  choice: estará isento
  rationale: “Isento” comunica que o dono fica livre de consequência ou responsabilidade neste caso, sem limitar o termo hebraico a culpa moral, responsabilidade civil ou pena específica.
theological_decisions:
- issue: A condição jurídica do dono do boi na oração final
  choice: O dono estará isento neste caso.
  alternative: O dono será considerado inocente; ou não será responsabilizado.
  rationale: O hebraico declara de forma concisa que o dono é נָקִי. A tradução evita definir se a isenção é especificamente moral, civil ou penal, sobretudo porque os versículos seguintes introduzem a hipótese de negligência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação mantém o caráter casuístico da lei, a ênfase da sentença contra o boi e a amplitude jurídica de נָקִי.
