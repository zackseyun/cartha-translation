  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: pt
  text: Então seu senhor o levará perante Deus[a] e o levará à porta ou ao batente; seu senhor lhe furará a orelha com uma sovela, e ele o servirá para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dos juízes”. Em certos contextos jurídicos, o hebraico אֱלֹהִים pode referir-se a juízes humanos ou à autoridade judicial.
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: o levará diante de
  rationale: O hifil de נגשׁ indica fazer alguém aproximar-se ou comparecer perante uma autoridade; a formulação é natural em português e preserva o caráter jurídico do procedimento.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: No contexto da legislação sobre servidão hebraica, “senhor” expressa a relação social e jurídica. “Dono” poderia reduzir a pessoa à condição de propriedade, enquanto “patrão” seria anacrônico.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O sentido lexical mais direto é “Deus”, possivelmente indicando comparecimento perante Deus num contexto sagrado e judicial. A leitura “os juízes” permanece em nota por ser plausível neste contexto legal.
- source_word: הַדֶּלֶת
  choice: a porta
  rationale: Equivalente simples e concreto para a porta junto à qual se realiza o rito.
- source_word: הַמְּזוּזָה
  choice: o batente
  rationale: Em português corrente, “batente” designa com precisão a parte fixa lateral da porta e soa mais natural que “umbral”.
- source_word: רָצַע
  choice: furará
  rationale: O verbo descreve perfurar a orelha com um instrumento pontiagudo; “furará” é claro e idiomático.
- source_word: אָזְנוֹ
  choice: a orelha dele
  rationale: Mantém a referência literal e evita a possível ambiguidade de “sua orelha” quanto ao possuidor.
- source_word: בַּמַּרְצֵעַ
  choice: com uma sovela
  rationale: מרצע é um instrumento pontiagudo usado para perfurar; “sovela” é o equivalente português específico.
- source_word: וַעֲבָדוֹ
  choice: e ele o servirá
  rationale: Traduz diretamente o verbo עבד e mantém explícito que o homem continuará servindo ao seu senhor.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: É a correspondência formal mais direta de לְעֹלָם e preserva a força duradoura da expressão; no contexto jurídico, refere-se naturalmente à duração permanente da servidão, isto é, por toda a vida.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים num contexto jurídico
  choice: Deus
  alternative: os juízes
  rationale: A forma hebraica significa primariamente “Deus” e pode indicar a apresentação perante Deus num rito pactual e judicial. Como também pode designar autoridades judiciais em certos contextos legais, a alternativa é registrada em nota sem eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “seu senhor” acompanha a estrutura jurídica do hebraico; “a orelha dele” evita ambiguidade possessiva. O marcador [a] aparece no texto principal.
