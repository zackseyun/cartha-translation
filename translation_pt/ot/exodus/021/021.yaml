  source_fidelity: A tradução preserva adequadamente a ressalva de אַךְ, a condição temporal “um ou dois dias”, o sentido contextual de יַעֲמֹד como sobrevivência, e o passivo jurídico-retaliatório de לֹא יֻקַּם. A formulação “pois ele é o dinheiro de seu senhor” mantém, sem atenuação, a justificativa econômica contundente de כִּי כַסְפּוֹ הוּא. “Seu senhor” explicita apenas o referente contextual do possessivo, já estabelecido no caso legal precedente.
  naturalness: O português é moderno, claro e suficientemente conciso para uma lei casuística. “Não se exigirá vingança por ele” é uma forma impessoal natural que comunica retribuição em favor da vítima, sem especificar uma pena que o hebraico não especifica.
  terminology: “Vingança” é apropriado para o campo semântico jurídico-retaliatório de נקם; a nota esclarece corretamente que não se trata meramente de punição genérica. A nota cultural explica a expressão econômica sem substituir o texto por “propriedade”, que seria mais interpretativo.
