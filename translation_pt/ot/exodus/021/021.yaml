  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: pt
  text: Contudo, se ele sobreviver um ou dois dias, não se exigirá vingança por ele[a], pois ele é o dinheiro de seu senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será vingado”. O hebraico fala especificamente de vingança ou retribuição legal, não apenas de punição em sentido genérico.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pois ele é seu dinheiro”, expressão que apresenta o valor econômico do escravo para o senhor como razão da decisão.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz uma ressalva ou exceção em relação à norma do versículo anterior, com força adversativa natural em português.
- source_word: אִם
  choice: se
  rationale: Partícula condicional que introduz a condição do caso jurídico.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: um ou dois dias
  rationale: Reproduz de modo idiomático e preciso o período limitado indicado pelo hebraico.
- source_word: יַעֲמֹד
  choice: sobreviver
  rationale: Embora o verbo signifique literalmente “ficar de pé” ou “permanecer”, neste contexto jurídico indica que a pessoa continua viva após o espancamento, sem implicar recuperação completa.
- source_word: לֹא יֻקַּם
  choice: não se exigirá vingança por ele
  rationale: A forma passiva de נקם expressa vingança ou retribuição judicial. A construção impessoal em português preserva esse sentido e evita sugerir apenas uma punição genérica.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira concisa a justificativa da decisão jurídica.
- source_word: כַסְפּוֹ
  choice: o dinheiro de seu senhor
  rationale: כֶּסֶף significa literalmente “prata” ou “dinheiro”. A formulação mantém a linguagem econômica contundente e explicita, a partir do contexto, que o possuidor é o senhor.
- source_word: הוּא
  choice: ele é
  rationale: Mantém a referência pessoal masculina singular à vítima, em vez de convertê-la em um objeto impessoal.
theological_decisions:
- issue: Justificativa econômica numa lei sobre escravidão
  choice: Manter a formulação contundente “ele é o dinheiro de seu senhor”.
  alternative: Suavizar como “ele é propriedade de seu senhor” ou “o prejuízo é do próprio senhor”.
  rationale: O hebraico apresenta explicitamente uma justificativa econômica. A tradução não deve amenizar a severidade ética e histórica do texto nem substituir sua linguagem por uma explicação mais aceitável ao leitor moderno.
- issue: Sentido jurídico de נקם
  choice: Traduzir como exigência de vingança ou retribuição judicial.
  alternative: Traduzir genericamente como punição ou especificar que o senhor não será executado.
  rationale: O verbo denota vingança ou retribuição, mas o texto não define aqui a modalidade exata. A redação escolhida preserva essa abertura sem impor uma pena específica.
- issue: Referência dos pronomes
  choice: Conservar a vítima no masculino singular e identificar contextualmente o possuidor como seu senhor.
  alternative: Empregar uma forma neutra ou repetir “o escravo” e “o proprietário”.
  rationale: A formulação jurídica hebraica está no masculino singular. A tradução mantém essa referência, acrescentando apenas a clareza necessária para evitar a ambiguidade do possessivo português.
translation_notes:
  register: Português moderno, claro e digno, com redação jurídica concisa. “Contudo” assinala a ressalva; “sobreviver” comunica o sentido contextual sem implicar recuperação; e a justificativa econômica deliberadamente não é suavizada.
