  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: pt
  text: Mas, se ele não armou emboscada, e Deus o entregou em suas mãos[a], designarei para você um lugar para onde ele possa fugir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Deus fez com que isso lhe viesse à mão”. A expressão hebraica apresenta a morte não premeditada como ocorrida sob a providência de Deus, por meio da ação do responsável.
    reason: Esclarece o idioma hebraico e a escolha de “o entregou em suas mãos”, preservando a tensão entre providência divina e ausência de premeditação.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Mas, se ele
  rationale: Introduz, em contraste com o versículo anterior, o caso em que a morte não foi premeditada; a construção condicional é natural em português.
- source_word: לֹא צָדָה
  choice: não ficou de tocaia
  rationale: No contexto jurídico, o verbo indica não armar uma emboscada ou não agir com premeditação; “ficar de tocaia” preserva a imagem concreta do hebraico.
- source_word: וְהָאֱלֹהִים
  choice: e Deus
  rationale: Aqui, o sentido mais provável é de ação providencial divina, e não de juízes humanos.
- source_word: אִנָּה לְיָדוֹ
  choice: fez com que isso lhe viesse à mão
  rationale: Reproduz de perto o idioma hebraico e mantém tanto a causalidade divina quanto a atuação humana, sem transformar a morte não premeditada em mero acaso.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: designarei para você um lugar
  rationale: “Designarei” comunica com clareza o estabelecimento autorizado de um lugar de refúgio.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: para onde ele possa fugir
  rationale: Expressa a direção e a possibilidade legal de fugir para refúgio.
theological_decisions:
- issue: Ação divina numa morte não premeditada
  choice: Deus fez com que isso lhe viesse à mão
  alternative: Deus permitiu que isso acontecesse por meio dele
  rationale: A tradução escolhida conserva a forte linguagem causal do hebraico e sua tensão teológica, sem atribuir premeditação ao agente humano. A alternativa é mais explicativa, mas suaviza a causalidade expressa no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficou de tocaia” conserva a imagem jurídica de emboscada; “lhe viesse à mão” mantém deliberadamente o caráter idiomático e a ambiguidade teológica do original.
