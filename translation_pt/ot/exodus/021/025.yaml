  text: כְּוִיָּה֙ תַּ֣חַת כְּוִיָּ֔ה פֶּ֖צַע תַּ֣חַת פָּ֑צַע חַבּוּרָ֕ה תַּ֖חַת חַבּוּרָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/025.yaml
  text: burn for burn[a], wound for wound, bruise for bruise.
translation:
  language: pt
  text: queimadura por queimadura, ferida por ferida, contusão por contusão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vergão por vergão”; o termo hebraico pode indicar a marca deixada por um golpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: queimadura
  rationale: O substantivo designa uma queimadura ou a marca deixada por ela. “Queimadura” é claro, conciso e mantém o paralelismo jurídico do versículo.
- source_word: תַּחַת
  choice: por
  rationale: Neste contexto legal, a preposição expressa correspondência ou compensação equivalente. “Por” reproduz com naturalidade a fórmula breve do hebraico.
- source_word: פֶּצַע
  choice: ferida
  rationale: O termo indica uma lesão corporal concreta. “Ferida” conserva esse sentido amplo sem restringi-lo a um corte.
- source_word: חַבּוּרָה
  choice: contusão
  rationale: O substantivo se refere à lesão ou marca produzida por um golpe. “Contusão” é compreensível em português moderno e se ajusta ao paralelismo com queimadura e ferida.
theological_decisions: []
translation_notes:
  register: Formulação jurídica concisa, rítmica e digna, em português moderno de ampla compreensão. O marcador da nota foi colocado junto ao termo חַבּוּרָה, ao qual a alternativa lexical se refere.
