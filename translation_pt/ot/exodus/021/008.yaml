reference: Exodus 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: pt
  text: Se ela não agradar ao seu senhor, que não a designou para si[a], ele deverá permitir que ela seja resgatada. Não terá o direito de vendê-la a um povo estrangeiro, pois agiu traiçoeiramente com ela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que a designou para si” ou “que a desposou para si”. A oração hebraica apresenta dificuldade textual e interpretativa.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “pois foi desleal com ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: não agradar
  rationale: Expressa em português natural o sentido idiomático de ser desagradável ou inaceitável para alguém, sem sugerir que a mulher seja moralmente má.
- source_word: אֲדֹנֶיהָ
  choice: seu senhor
  rationale: Representa a autoridade masculina que a adquiriu no contexto jurídico, preservando a terminologia social do texto sem usar aqui um título divino.
- source_word: יְעָדָהּ
  choice: a designou para si
  rationale: Mantém a amplitude lexical de designar ou destinar, sem impor no texto principal a especificação matrimonial de “desposar”; a dificuldade textual é registrada em nota.
- source_word: וְהֶפְדָּהּ
  choice: deverá permitir que ela seja resgatada
  rationale: O hifil de פדה indica aqui que o senhor deve possibilitar ou efetivar o resgate, sem afirmar necessariamente que ele próprio pague o preço.
- source_word: לְעַם נָכְרִי
  choice: a um povo estrangeiro
  rationale: Preserva o caráter coletivo da expressão hebraica e sua distinção social e pactual.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: Não terá o direito de vendê-la
  rationale: Comunica de modo natural a falta de autoridade ou poder jurídico para realizar a venda.
- source_word: בְּבִגְדוֹ בָהּ
  choice: pois agiu traiçoeiramente com ela
  rationale: Traduz בגד como violação desleal de uma obrigação para com ela, preservando a força moral e relacional do termo.
theological_decisions:
- issue: Ambiguidade textual e interpretativa de יְעָדָהּ na oração relativa
  choice: que não a designou para si
  alternative: que a designou/desposou para si
  rationale: O texto massorético apresenta uma conhecida dificuldade entre a leitura negativa refletida no ketiv e a tradição de leitura afirmativa associada ao qere, além da possibilidade de entender o verbo mais especificamente como “desposar”. O texto principal segue a leitura negativa fornecida, enquanto a nota preserva a alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação jurídica é clara sem modernizar excessivamente a instituição antiga; “senhor” preserva a relação social expressa no hebraico, e as notas mantêm as ambiguidades relevantes.
