  text: בַּ֤עַל הַ/בּוֹר֙ יְשַׁלֵּ֔ם כֶּ֖סֶף יָשִׁ֣יב לִ/בְעָלָ֑י/ו וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: pt
  text: 'O dono do poço fará restituição: pagará em dinheiro ao dono do animal, e o animal morto ficará para o dono do poço.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: o dono do poço
  rationale: No contexto jurídico, בַּעַל indica o responsável ou possuidor, e בּוֹר designa a escavação mencionada no versículo anterior. “Dono do poço” é claro e natural em português.
- source_word: יְשַׁלֵּם
  choice: dará a devida compensação
  rationale: O Piel de שׁלם, neste contexto legal, expressa o dever de compensar o prejuízo, não apenas um pagamento genérico.
- source_word: כֶּסֶף יָשִׁיב
  choice: pagará em dinheiro
  rationale: כֶּסֶף significa literalmente “prata”, mas aqui funciona como meio monetário de compensação; יָשִׁיב tem o sentido de restituir o valor devido.
- source_word: לִבְעָלָיו
  choice: ao dono do animal
  rationale: O sufixo remete ao proprietário do animal morto. Explicitar “do animal” evita em português a ambiguidade de “seu dono”.
- source_word: וְהַמֵּת
  choice: e o animal morto
  rationale: A expressão substantivada significa literalmente “e o morto”; o contexto permite explicitar que se trata do animal sem acrescentar informação nova.
- source_word: יִהְיֶה לוֹ
  choice: ficará para ele
  rationale: A construção atribui ao dono do poço a posse do animal morto como parte do acerto. “Ficará para ele” preserva o referente pronominal do hebraico e soa natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. A repetição de “dono” esclarece os dois proprietários envolvidos; a nota preserva a possibilidade lexical de verter וְהַמֵּת por “a carcaça” e esclarece o referente de לוֹ.
