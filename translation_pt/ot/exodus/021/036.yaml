revisions:
- from: Ou, se era sabido que o boi já costumava dar chifradas[a], e seu dono não o manteve preso, este deverá pagar integralmente boi por boi, e o animal morto ficará para ele.[b]
  to: Ou, se era sabido que o boi tinha o hábito de chifrar desde ontem e anteontem[a], e seu dono não o manteve sob controle, este deverá certamente pagar boi por boi, e o animal morto ficará para ele.[b]
  rationale: 'A revisão conserva no texto a expressão temporal hebraica e corrige duas escolhas que estreitavam ou deslocavam o sentido: a guarda do animal é expressa como controle, sem pressupor que estivesse preso, e a intensificação da obrigação é expressa por “certamente”. O pronome final permanece não especificado, preservando a formulação do hebraico.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:45Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura do caso alternativo, o conhecimento prévio da propensão do boi, a responsabilidade do dono, a compensação substitutiva e a destinação do animal morto. Contudo, “já” no corpo do texto reduz excessivamente a expressão temporal hebraica מִתְּמוֹל שִׁלְשֹׁם (“desde ontem e anteontem”), que convém conservar de modo literal, com a explicação idiomática na nota. “Manteve preso” também é mais específico que o hebraico, que requer guardar/conter o animal, sem necessariamente afirmar que ele devia estar preso.
  naturalness: A redação é clara e de registro jurídico acessível. “Tinha o hábito de chifrar” e “não o manteve sob controle” soam naturais em português moderno e evitam, respectivamente, o tom algo coloquial de “dar chifradas” e a especificação indevida de “manteve preso”.
  terminology: “Boi”, “dono”, “boi por boi” e “animal morto” são adequados. “Deverá certamente pagar” reproduz melhor a ênfase do infinitivo absoluto עם o verbo finito do que “deverá pagar integralmente”, pois o hebraico enfatiza a certeza/obrigatoriedade do pagamento, não formula explicitamente a noção de pagamento integral.
  issues:
  - severity: medium
    issue: A expressão temporal hebraica foi condensada em “já” no texto principal.
    rationale: Embora a nota explique o idiomatismo, “já” não conserva a formulação temporal explícita “desde ontem e anteontem”. Uma tradução de equivalência ótima pode manter a expressão no corpo e esclarecê-la em nota.
  - severity: medium
    issue: “Não o manteve preso” especifica um meio de contenção não indicado no hebraico.
    rationale: שׁמר, neste contexto, exige que o dono guarde ou controle o boi perigoso; não determina que ele estivesse literalmente amarrado ou preso.
  - severity: low
    issue: “Integralmente” não é a melhor representação da intensificação verbal.
    rationale: שַׁלֵּם יְשַׁלֵּם enfatiza que o dono deve de fato/certamente pagar. “Certamente” mantém essa força sem introduzir uma nuance adicional.
  revised_text: Ou, se era sabido que o boi tinha o hábito de chifrar desde ontem e anteontem[a], e seu dono não o manteve sob controle, este deverá certamente pagar boi por boi, e o animal morto ficará para ele.[b]
  revised_footnotes:
  - marker: a
    text: 'Hebraico: “desde ontem e anteontem”, expressão idiomática que indica que o boi já havia demonstrado esse comportamento anteriormente.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “e a carcaça ficará para ele”.'
    reason: lexical_alternative
  revision_rationale: 'A revisão conserva no texto a expressão temporal hebraica e corrige duas escolhas que estreitavam ou deslocavam o sentido: a guarda do animal é expressa como controle, sem pressupor que estivesse preso, e a intensificação da obrigação é expressa por “certamente”. O pronome final permanece não especificado, preservando a formulação do hebraico.'
