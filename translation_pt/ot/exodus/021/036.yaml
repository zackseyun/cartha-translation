  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: pt
  text: Ou, se era sabido que o boi tinha o hábito de chifrar desde ontem e anteontem[a], e seu dono não o manteve sob controle, este deverá certamente pagar boi por boi, e o animal morto ficará para ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “desde ontem e anteontem”, expressão idiomática que indica que o boi já havia demonstrado esse comportamento anteriormente.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “e a carcaça ficará para ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: Ou, se
  rationale: אוֹ introduz o caso alternativo em relação ao versículo anterior; em português, “Ou, se” explicita com naturalidade a estrutura condicional do caso legal.
- source_word: נוֹדַ֗ע כִּ֠י
  choice: era sabido que
  rationale: O nifal de ידע tem sentido passivo/impessoal, e כִּי introduz o conteúdo conhecido. “Era sabido que” preserva ambos.
- source_word: שׁ֣וֹר
  choice: boi
  rationale: “Boi” é a equivalência tradicional e clara neste contexto jurídico, sem restringir indevidamente o termo a “touro”.
- source_word: נַגָּ֥ח הוּא֙
  choice: costumava dar chifradas
  rationale: O adjetivo נַגָּח caracteriza o animal por sua propensão habitual a chifrar. A formulação é natural e compreensível em português.
- source_word: מִתְּמ֣וֹל שִׁלְשֹׁ֔ם
  choice: já
  rationale: A expressão literalmente menciona “ontem e anteontem”, mas funciona idiomaticamente para indicar comportamento anterior e reiterado. “Já” transmite essa anterioridade no texto, com a imagem hebraica preservada em nota.
- source_word: וְלֹ֥א יִשְׁמְרֶ֖נּוּ
  choice: não o manteve preso
  rationale: No contexto, שמר significa tomar as medidas necessárias para conter o animal perigoso. “Manteve preso” expressa claramente essa responsabilidade.
- source_word: בְּעָלָ֑יו
  choice: seu dono
  rationale: Designa o proprietário legal do animal; “dono” é corrente, claro e adequado ao registro.
- source_word: שַׁלֵּ֨ם יְשַׁלֵּ֥ם
  choice: deverá pagar integralmente
  rationale: A construção intensiva com infinitivo absoluto reforça a obrigação e a plena compensação. “Deverá pagar integralmente” conserva a força jurídica sem arcaísmo.
- source_word: שׁוֹר֙ תַּ֣חַת הַשּׁ֔וֹר
  choice: boi por boi
  rationale: תַּחַת expressa substituição ou compensação. “Boi por boi” mantém de modo conciso a fórmula legal.
- source_word: וְהַמֵּ֖ת יִֽהְיֶה לּֽוֹ
  choice: e o animal morto ficará para ele
  rationale: O hebraico diz literalmente que “o morto” será dele. “O animal morto” torna o referente explícito sem decidir no corpo do texto se a ênfase recai sobre o animal ou sua carcaça.
theological_decisions:
- issue: Referente do pronome em לּוֹ (“para ele”)
  choice: Mantido como “para ele”, sem identificar no corpo do texto qual proprietário é o beneficiário.
  alternative: Explicitar “para o dono do boi que morreu” ou “para o responsável”.
  rationale: O pronome hebraico preserva certa ambiguidade referencial. Embora o contexto jurídico possa favorecer uma identificação, a tradução não deve resolver silenciosamente o que o texto deixa pronominal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter de lei casuística e a ênfase da obrigação reparatória, evitando linguagem excessivamente arcaica.
