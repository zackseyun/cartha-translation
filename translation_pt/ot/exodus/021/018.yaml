base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: pt
  text: Se homens brigarem, e um golpear o outro com uma pedra ou com o punho, e este não morrer, mas ficar de cama,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «cair no leito»; isto é, ficar acamado por causa do ferimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Se
  rationale: Introduz uma situação de lei casuística; «se» é natural e preserva o caráter condicional.
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: alguns homens brigarem
  rationale: ריב indica contenda ou briga; «brigarem» comunica naturalmente uma disputa que se torna violenta, e «homens» mantém a referência masculina do hebraico.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: e um ferir o outro
  rationale: A formulação identifica um dos envolvidos como agressor sem repetição pouco natural de «homem»; «ferir» expressa o golpe e se ajusta ao resultado corporal descrito.
- source_word: בְּאֶבֶן אוֹ בְאֶגְרֹף
  choice: com uma pedra ou com o punho
  rationale: O בְּ é instrumental. «Punho» conserva o sentido mais provável de אֶגְרֹף sem acrescentar um possessivo ausente no hebraico.
- source_word: וְלֹא יָמוּת
  choice: e este não morrer
  rationale: «Este» esclarece que o sujeito é o homem atingido; mantém-se a coordenação hebraica com «e».
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: mas ficar de cama
  rationale: A expressão literalmente descreve cair ao leito, isto é, permanecer acamado por causa do ferimento. «Ficar de cama» é clara e corrente.
