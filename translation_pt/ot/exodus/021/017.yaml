  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: pt
  text: Quem amaldiçoar seu pai ou sua mãe certamente será morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e sua mãe”; nesta formulação legal, o sentido é distributivo e se refere a amaldiçoar qualquer um dos pais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Quem amaldiçoar
  rationale: O particípio funciona substantivamente na formulação jurídica, designando de modo geral quem comete a infração. “Amaldiçoar” preserva o sentido específico de proferir uma maldição, sem ampliá-lo para toda forma de insulto.
- source_word: אָבִיו
  choice: seu pai
  rationale: Reproduz naturalmente o substantivo com sufixo de terceira pessoa masculina singular, ligado ao infrator genérico.
- source_word: וְאִמּוֹ
  choice: ou sua mãe
  rationale: 'Embora וְ seja literalmente “e”, aqui a coordenação tem força distributiva: a proibição abrange amaldiçoar qualquer um dos pais. “Ou” expressa esse alcance com clareza no português jurídico corrente.'
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a forma passiva e prescreve uma pena de morte imposta, não apenas a consequência de morrer.
theological_decisions:
- issue: Força jurídica da referência aos pais
  choice: A infração se aplica a quem amaldiçoar o pai ou a mãe, individualmente, por isso emprega-se “ou”.
  alternative: Manter formalmente “e sua mãe”.
  rationale: A conjunção hebraica é waw, mas o par tem sentido distributivo nesta formulação legal. A tradução com “ou” comunica o alcance da norma sem exigir que ambos os pais sejam alvo da mesma ação.
- issue: Forma da sentença de morte
  choice: “certamente será morto” como declaração enfática de pena judicial.
  alternative: “terá de morrer” ou “certamente morrerá”.
  rationale: A forma passiva יוּמָת indica morte imposta, enquanto o infinitivo absoluto מוֹת acrescenta ênfase. A redação escolhida mantém ambos os elementos sem identificar além do texto quem executa a sentença.
translation_notes:
  register: Português moderno, claro e solene, com formulação jurídica concisa. “Seu” favorece legibilidade ampla; “será morto” conserva a voz passiva e a força penal do hebraico.
