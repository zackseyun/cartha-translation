  text: וַ/יֹּאמְרוּ֮ אֶל מֹשֶׁה֒ הַֽ/מִ/בְּלִ֤י אֵין קְבָרִים֙ בְּ/מִצְרַ֔יִם לְקַחְתָּ֖/נוּ לָ/מ֣וּת בַּ/מִּדְבָּ֑ר מַה זֹּאת֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/הוֹצִיאָ֖/נוּ מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: pt
  text: 'E disseram a Moisés: “Foi porque não havia sepulturas no Egito que você nos levou para morrermos no deserto?[a] O que é isso que você fez conosco ao nos tirar do Egito?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Foi por falta de sepulturas no Egito que você nos levou para morrer no deserto?”'
    reason: Registra uma tradução mais formal do idioma hebraico הֲמִבְּלִי אֵין, sem alterar o sentido sarcástico da pergunta.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: E disseram a Moisés
  rationale: A forma narrativa de אמר introduz fala direta; “disseram” é o equivalente português natural, e אֶל indica o destinatário.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Foi porque não havia sepulturas no Egito
  rationale: Reproduz a pergunta retórica sarcástica do hebraico em português corrente. “Sepulturas” preserva o sentido de קְבָרִים sem tornar a formulação excessivamente coloquial.
- source_word: לְקַחְתָּנוּ
  choice: que você nos levou
  rationale: לקח significa “tomar/levar”. “Nos levou” expressa naturalmente o deslocamento sob a perspectiva dos israelitas e mantém distinção lexical em relação a הוציא, usado depois.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: para morrermos no deserto
  rationale: O infinitivo indica finalidade ou resultado temido. “Deserto” é a designação portuguesa corrente para o מִדְבָּר do êxodo, uma região árida e não cultivada.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: O que é isso que você fez conosco
  rationale: Mantém o interrogativo exclamativo e o demonstrativo זֹאת, preservando o tom acusatório sem converter a pergunta em “Por que...?”.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: ao nos tirar do Egito
  rationale: הוציא é “fazer sair/tirar”. A construção com “ao” liga naturalmente o infinitivo à ação da qual o povo se queixa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. O tratamento “você” evita formas verbais arcaizantes; a fala conserva a ironia e o tom acusatório do hebraico.
