  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: pt
  text: Assim, naquele dia, Yahweh salvou Israel da mão do Egito[a], e Israel viu os egípcios mortos à beira do mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é literalmente “da mão do Egito”; aqui, “mão” representa o poder ou domínio do Egito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: salvou
  rationale: O hifil de ישׁע expressa o resgate efetuado por Yahweh. “Salvou” é direto, natural e conserva o peso teológico da ação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal natural e preciso em português.
- source_word: מִיַּד מִצְרָיִם
  choice: da mão do Egito
  rationale: Mantém a metáfora hebraica de estar sob a mão, isto é, sob o poder ou domínio de alguém; “Egito” representa aqui a potência nacional.
- source_word: וַיַּרְא
  choice: viu
  rationale: Tradução direta do verbo ראה no fluxo narrativo.
- source_word: מִצְרַיִם מֵת
  choice: os egípcios mortos
  rationale: Nesta oração, מִצְרַיִם designa o povo egípcio, e o adjetivo singular מֵת tem sentido coletivo.
- source_word: עַל שְׂפַת הַיָּם
  choice: à beira do mar
  rationale: Expressão portuguesa natural para a margem ou orla do mar, correspondente à imagem hebraica da “borda” ou “lábio” do mar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada sem substituí-lo por um título.
- issue: Sentido de וַיּוֹשַׁע
  choice: salvou
  alternative: livrou
  rationale: Ambas as opções podem expressar resgate, mas “salvou” reproduz de modo conciso a ação decisiva de Yahweh sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A metáfora hebraica “da mão do Egito” foi preservada e explicada em nota; “à beira do mar” evita uma formulação excessivamente literal, mas mantém com precisão o local indicado.
