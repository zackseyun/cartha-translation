base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: pt
  text: Então Moisés estendeu a mão sobre o mar, e Yahweh fez o mar recuar[a] por meio de um forte vento do leste[b] durante toda a noite, e Yahweh fez do mar terra seca[c], e as águas se dividiram[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez o mar mover-se para trás”. O verbo hebraico está na forma causativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio de um poderoso vento do leste”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “transformou o mar em terra seca”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “as águas foram fendidas” ou “foram separadas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: estendeu
  rationale: Com יָד (“mão”), o verbo נטה descreve o ato de estender a mão; “estendeu” é natural e preserva a ação física.
- source_word: יָדוֹ
  choice: a mão
  rationale: A construção hebraica traz o possessivo singular; em português, o possuidor já está claro pelo sujeito “Moisés”, e o artigo definido é a forma idiomática com partes do corpo.
- source_word: עַל הַיָּם
  choice: sobre o mar
  rationale: עַל admite “sobre”, “por cima de” ou “em direção a”; “sobre o mar” preserva de modo natural a relação espacial do gesto.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: Yahweh fez o mar recuar
  rationale: A forma causativa de הלך indica que Yahweh fez o mar mover-se; “fez o mar recuar” expressa o efeito no contexto sem especificar além do texto como isso ocorreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: por meio de um forte vento vindo do leste
  rationale: רוּחַ significa “vento” neste contexto, קָדִים indica a direção leste, e עַזָּה descreve sua força. A formulação é clara em português internacional.
- source_word: כָּל הַלַּיְלָה
  choice: durante toda a noite
  rationale: Expressa naturalmente a duração completa indicada pelo hebraico.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: fez do mar terra seca
  rationale: Mantém “o mar” como objeto e traduz חָרָבָה como “terra seca”, com formulação concisa e natural.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: as águas se dividiram
  rationale: A forma de בקע descreve as águas sendo fendidas ou separadas; “se dividiram” é clara e preserva a forma não agentiva da oração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” o conserva por transliteração, sem trocá-lo por um título; “Javé” é outra adaptação portuguesa possível.
- issue: Relação entre a ação divina e o vento
  choice: Yahweh fez o mar recuar por meio do vento
  alternative: O vento, por si só, fez o mar recuar
  rationale: A sintaxe hebraica apresenta Yahweh como agente e o vento como meio, preservando simultaneamente a ação divina e o elemento natural mencionado no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação hebraica foi dividida em duas frases para melhorar a fluidez sem alterar a sequência dos acontecimentos. Os marcadores das notas foram colocados junto às expressões a que efetivamente se referem.
