  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Estenda a mão sobre o mar, para que as águas voltem[a] sobre os egípcios, sobre os seus carros de guerra e sobre os seus cavaleiros.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e as águas voltarão sobre os egípcios”. O verbo hebraico pode ser traduzido mais literalmente como futuro simples, embora aqui provavelmente expresse o resultado pretendido da ação de Moisés.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Estenda a mão
  rationale: Traduz diretamente o imperativo e descreve de modo natural o gesto ordenado a Moisés.
- source_word: עַל הַיָּם
  choice: sobre o mar
  rationale: Preserva o sentido espacial mais provável de עַל no contexto do gesto de Moisés.
- source_word: וְיָשֻׁבוּ הַמַּיִם
  choice: para que as águas voltem
  rationale: Após o imperativo, a forma verbal pode indicar o resultado pretendido da ação; a construção portuguesa torna essa relação clara sem ocultar a alternativa de futuro simples.
- source_word: עַל מִצְרַיִם
  choice: sobre os egípcios
  rationale: Mantém a imagem das águas retornando e cobrindo os egípcios, sem intensificar a preposição como “contra”.
- source_word: עַל רִכְבּוֹ
  choice: sobre os seus carros de guerra
  rationale: רֶכֶב designa aqui os carros militares egípcios. O possessivo plural em português representa naturalmente o referente coletivo de מִצְרַיִם, apesar do sufixo hebraico singular.
- source_word: וְעַל פָּרָשָׁיו
  choice: e sobre os seus cavaleiros
  rationale: “Cavaleiros” traduz diretamente os combatentes montados; o possessivo plural acompanha o referente coletivo “os egípcios”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e representa a vocalização acadêmica mais amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Carros de guerra” evita a possível ambiguidade moderna de “carros”, e “cavaleiros” conserva a concretude do hebraico. O marcador da nota foi colocado junto à oração que ele esclarece.
