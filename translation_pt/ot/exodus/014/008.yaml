  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: pt
  text: E o SENHOR endureceu[a] o coração do faraó, rei do Egito, e ele perseguiu os filhos de Israel, enquanto os filhos de Israel saíam com a mão erguida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fortaleceu o coração do faraó”. O verbo hebraico significa literalmente “tornar forte” ou “tornar firme”, embora, no Êxodo, esta expressão costume ter o sentido de “endurecer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “com mão erguida”. Ou: “abertamente” ou “com ousadia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título אֲדֹנָי e seguindo a camada de consulta fornecida.
- source_word: וַיְחַזֵּק
  choice: endureceu
  rationale: Embora חזק signifique literalmente tornar forte ou firme, na expressão recorrente com o coração do faraó comunica o fortalecimento obstinado de sua resolução; «endureceu» preserva naturalmente esse sentido no contexto do Êxodo.
- source_word: לֵב
  choice: coração
  rationale: Mantém a imagem hebraica do centro da vontade e da disposição, plenamente compreensível em português.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: o faraó, rei do Egito
  rationale: Reproduz de modo natural a aposição hebraica e usa o artigo corrente em português diante do título.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: perseguiu
  rationale: Expressa de modo conciso o sentido hostil e militar de רדף seguido de אחרי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica e sua repetição retórica no versículo, sem substituí-la por «israelitas».
- source_word: יֹצְאִים
  choice: saíam
  rationale: O imperfeito português comunica a ação em curso indicada pelo particípio hebraico no momento da perseguição.
- source_word: בְּיָד רָמָה
  choice: de cabeça erguida
  rationale: A expressão idiomática portuguesa comunica a saída pública, confiante e sem submissão sugerida pela imagem hebraica da mão erguida; a forma literal é preservada em nota.
theological_decisions:
- issue: Ação divina no endurecimento do faraó
  choice: Yahweh endureceu o coração do faraó
  alternative: Yahweh fortaleceu o coração do faraó
  rationale: O texto atribui diretamente a ação a Yahweh. A tradução mantém essa tensão teológica, enquanto a nota registra a amplitude lexical de חזק sem atenuar a declaração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de «os filhos de Israel» foi mantida por seu efeito retórico. «De cabeça erguida» evita o pouco natural «com mão alta», enquanto a nota conserva a imagem concreta do hebraico.
