  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: pt
  text: E eu — eis que endureço o coração dos egípcios, para que entrem no mar atrás deles; e serei glorificado sobre o faraó e todo o seu exército, sobre os seus carros de guerra e os seus cavaleiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: eis que
  rationale: Preserva a ênfase e a chamada de atenção da partícula hebraica, em registro bíblico digno e ainda compreensível.
- source_word: מְחַזֵּק
  choice: endureço
  rationale: O particípio piel expressa a ação divina em curso ou iminente de tornar firme a resolução dos egípcios; no contexto de Êxodo, “endureço” comunica adequadamente esse sentido.
- source_word: לֵב מִצְרַיִם
  choice: o coração dos egípcios
  rationale: Mantém o singular coletivo do hebraico, que apresenta os egípcios como um grupo de vontade unificada.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: para que entrem no mar atrás deles
  rationale: A construção indica propósito ou resultado. “Entrem no mar” explicita o destino exigido pelo contexto imediato, sem alterar o movimento descrito pelo verbo בוא.
- source_word: וְאִכָּבְדָה
  choice: serei glorificado
  rationale: A forma niphal de כבד expressa que a honra ou glória de Deus será manifestada mediante o juízo; a formulação é natural e preserva a voz da forma hebraica.
- source_word: בְּפַרְעֹה
  choice: sobre o faraó
  rationale: Neste contexto, a preposição marca aquele sobre quem a glória divina se manifesta em triunfo e juízo.
- source_word: חֵילוֹ
  choice: todo o seu exército
  rationale: חיל designa aqui as forças militares do faraó; “exército” é o equivalente moderno mais claro.
- source_word: רִכְבּוֹ
  choice: os seus carros de guerra
  rationale: O singular coletivo hebraico refere-se à força de carros; o plural português, com “de guerra”, torna a imagem militar inequívoca.
- source_word: פָרָשָׁיו
  choice: os seus cavaleiros
  rationale: Refere-se a combatentes montados; “cavaleiros” é concreto, corrente e adequado ao cenário militar.
theological_decisions:
- issue: Ação divina no endurecimento dos egípcios
  choice: endureço
  alternative: fortaleço; permito que o coração deles seja endurecido
  rationale: O hebraico atribui diretamente a ação a Deus. A tradução preserva a tensão entre soberania divina e responsabilidade humana, sem converter a ação em mera permissão.
- issue: Manifestação da glória divina no juízo
  choice: serei glorificado sobre o faraó
  alternative: obterei glória sobre o faraó; mostrarei minha glória por meio do faraó
  rationale: “Serei glorificado” conserva naturalmente a forma passiva/reflexiva do hebraico e comunica que a glória de Deus será manifestada em seu triunfo judicial, sem definir de modo excessivo a função da preposição.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Conserva-se o singular coletivo “coração dos egípcios” e a ênfase de “eis que”. “Faraó” recebe artigo, conforme o uso natural do português, e “carros de guerra” evita que “carros” seja entendido no sentido moderno.
