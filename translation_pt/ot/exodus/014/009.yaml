base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: pt
  text: Os egípcios os perseguiram e os alcançaram, enquanto estavam acampados junto ao mar — todos os cavalos e carros de guerra do faraó, seus cavaleiros e seu exército —, perto de Pi-Hairote, em frente de Baal-Zefom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de Baal-Zefom”. A expressão hebraica pode indicar uma posição voltada para um ponto de referência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: perseguiram
  rationale: O verbo רדף descreve perseguição e, neste contexto militar, corresponde naturalmente a “perseguir”.
- source_word: מִצְרַיִם
  choice: Os egípcios
  rationale: Embora o termo também possa designar o Egito como território, o verbo no plural e o contexto indicam o povo ou as forças egípcias.
- source_word: וַיַּשִּׂיגוּ
  choice: os alcançaram
  rationale: נשׂג significa aqui chegar até os perseguidos, isto é, alcançá-los; a formulação é clara e idiomática em português.
- source_word: חֹנִים
  choice: enquanto estavam acampados
  rationale: O particípio expressa a situação em que os israelitas se encontravam quando foram alcançados.
- source_word: עַל הַיָּם
  choice: junto ao mar
  rationale: A preposição tem sentido locativo neste contexto; “junto ao mar” comunica proximidade de modo natural.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: todos os cavalos dos carros de guerra do faraó
  rationale: A construção hebraica é compacta e coletiva, referindo-se aos cavalos ligados aos carros de guerra do faraó. Esta redação preserva essa relação sem acrescentar uma categoria independente de carros.
- source_word: וּפָרָשָׁיו
  choice: seus cavaleiros
  rationale: פָּרָשׁ designa homens montados ou tropas a cavalo; “cavaleiros” é transparente e adequado ao contexto.
- source_word: וְחֵילוֹ
  choice: e seu exército
  rationale: חַיִל denota aqui a força militar do faraó; “exército” é a opção mais clara em português corrente.
- source_word: עַל פִּי הַחִירֹת
  choice: perto de Pi-Hairote
  rationale: A expressão introduz uma localização junto ao lugar chamado Pi-Hairote; “perto de” comunica naturalmente esse valor locativo.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: diante de Baal-Zefom
  rationale: לִפְנֵי pode indicar uma posição diante de, em frente a ou defronte de um ponto de referência. “Diante de” mantém a amplitude espacial do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Os travessões preservam o comentário parentético que enumera as forças do faraó. Os topônimos seguem formas portuguesas transparentes, e “faraó” permanece em minúscula por funcionar aqui como título.
