revisions:
- from: Os egípcios os perseguiram e os alcançaram enquanto estavam acampados junto ao mar — todos os cavalos dos carros de guerra do faraó, seus cavaleiros e seu exército —, perto de Pi-Hairote, diante de Baal-Zefom[a].
  to: Os egípcios os perseguiram e os alcançaram, enquanto estavam acampados junto ao mar — todos os cavalos e carros de guerra do faraó, seus cavaleiros e seu exército —, perto de Pi-Hairote, em frente de Baal-Zefom[a].
