base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: pt
  text: Mas os filhos de Israel caminharam em terra seca pelo meio do mar[a], e as águas eram para eles uma muralha[b] à sua direita e à sua esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «atravessaram o mar em terra seca».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «as águas eram para eles uma muralha»; alguns entendem: «como uma muralha».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Mas os filhos de Israel
  rationale: Preserva a expressão hebraica filial e nacional; «mas» explicita o contraste contextual com a destruição dos egípcios, embora «e» também seja possível.
- source_word: הָלְכוּ
  choice: caminharam
  rationale: Representa o sentido comum de הלך e mantém a imagem narrativa do povo avançando a pé.
- source_word: בַיַּבָּשָׁה
  choice: em terra seca
  rationale: Expressão portuguesa natural para o solo seco, destacando a condição extraordinária do leito do mar.
- source_word: בְּתוֹךְ הַיָּם
  choice: pelo meio do mar
  rationale: Conserva o sentido espacial de passagem por dentro do mar em linguagem clara e corrente.
- source_word: וְהַמַּיִם
  choice: e as águas
  rationale: Mantém o plural morfológico hebraico e sua imagem solene e vívida.
- source_word: לָהֶם חֹמָה
  choice: eram para eles uma muralha
  rationale: Traduz diretamente a relação marcada por ל e o substantivo חֹמָה, sem acrescentar uma partícula comparativa ausente no hebraico.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: à direita e à esquerda
  rationale: Formulação portuguesa equilibrada e natural; o referente possessivo permanece claro pelo contexto imediato.
theological_decisions:
- issue: Tradução de בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A opção principal preserva a formulação familiar e nacional do hebraico, sem excluir a alternativa idiomática.
- issue: Se חֹמָה deve ser traduzido de modo direto ou comparativo
  choice: uma muralha
  alternative: como uma muralha
  rationale: O hebraico não contém marcador explícito de comparação; por isso, o texto principal mantém a afirmação direta e registra a leitura comparativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Muralha» comunica melhor que «parede» uma barreira extensa e protetora. Os marcadores foram posicionados junto às expressões a que se referem.
