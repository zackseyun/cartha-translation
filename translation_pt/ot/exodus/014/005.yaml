  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: pt
  text: 'Foi informado ao rei do Egito que o povo havia fugido. Então o coração do faraó e de seus servos voltou-se contra o povo[a], e eles disseram: “Que foi isso que fizemos, deixando Israel partir e não mais nos servir?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o coração do faraó e de seus servos mudou em relação ao povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “libertando Israel do nosso serviço” ou “deixando de tê-lo como escravo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Foi informado
  rationale: O hofal expressa uma comunicação passiva feita por agente não especificado; a construção impessoal preserva esse traço.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: ao rei do Egito
  rationale: Reprodução direta e natural da relação genitiva hebraica.
- source_word: כִּי בָרַח הָעָם
  choice: que o povo havia fugido
  rationale: ברח significa fugir; o mais-que-perfeito composto esclarece que a fuga antecedeu a notícia recebida pelo rei.
- source_word: וַיֵּהָפֵךְ לְבַב
  choice: o coração ... voltou-se
  rationale: Preserva a metáfora hebraica do coração como centro da vontade e do pensamento, além da ideia de mudança ou reversão.
- source_word: לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: o coração do faraó e de seus servos
  rationale: Mantém o singular coletivo do hebraico e a imagem antropológica de לְבַב, em português claro e solene.
- source_word: אֶל הָעָם
  choice: contra o povo
  rationale: Embora אֶל seja literalmente direcional, o contexto mostra que a mudança de atitude foi hostil; a nota registra a formulação menos explícita.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: O que foi que fizemos
  rationale: Expressa naturalmente em português a pergunta hebraica de espanto e arrependimento, sem convertê-la numa pergunta causal.
- source_word: שִׁלַּחְנוּ
  choice: deixando Israel partir
  rationale: Neste contexto, שׁלח indica permitir que Israel vá embora; a formulação também conserva o motivo recorrente do êxodo.
- source_word: מֵעָבְדֵנוּ
  choice: e não mais nos servir
  rationale: Traduz a cessação do serviço exigido de Israel sem inserir no texto principal o termo mais interpretativo 'escravidão'.
theological_decisions:
- issue: Sentido antropológico de לְבַב
  choice: coração
  alternative: mente; disposição
  rationale: O termo abrange pensamento, vontade e disposição interior. Preservar 'coração' mantém a imagem literária e teológica hebraica sem reduzi-la a uma categoria psicológica moderna.
- issue: Direção da mudança indicada por אֶל הָעָם
  choice: contra o povo
  alternative: em relação ao povo
  rationale: O contexto imediato indica hostilidade renovada, mas a nota conserva a possibilidade de uma tradução direcional menos explícita.
- issue: Condição de Israel em מֵעָבְדֵנוּ
  choice: não mais nos servir
  alternative: ser libertado do nosso serviço; deixar de ser nosso escravo
  rationale: O contexto amplo é de trabalho forçado e escravidão, mas a expressão deste versículo enfoca diretamente o serviço. O texto principal evita tornar explícito mais do que a cláusula afirma.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural para brasileiros. A divisão em duas frases evita um período excessivamente longo, enquanto “Então” mantém a progressão narrativa. Conserva-se “coração” e o singular hebraico, mas a fala é apresentada em português corrente.
