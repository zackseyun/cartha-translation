  naturalness: «Veio para entre o acampamento...» soa calcado e pouco idiomático. «Veio entre...» é natural em registro narrativo-bíblico moderno e conserva a concisão do hebraico. O restante é claro e de registro adequado.
  terminology: «Acampamento», «Egito», «Israel», «nuvem», «escuridão» e «iluminou a noite» são escolhas corretas e consistentes. A nota deve conservar a formulação verbal de iluminação sem dar a impressão de que a relação entre nuvem e luz esteja decidida no texto principal.
