  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: pt
  text: Veio entre o acampamento do Egito e o acampamento de Israel[a]. Havia a nuvem e a escuridão, mas iluminou a noite; e um acampamento não se aproximou do outro durante toda a noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e havia a nuvem e a escuridão, porém ela iluminava a noite». O hebraico é conciso, e as versões antigas e as traduções divergem quanto à relação da escuridão e da luz com os dois acampamentos.'
    reason: Leitura alternativa decorrente da sintaxe ambígua e da divergência antiga sobre a relação entre nuvem, escuridão e iluminação.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Veio
  rationale: O sujeito não é expresso em português, preservando a ambiguidade contextual entre o anjo de Deus e a coluna de nuvem, sem recorrer ao pronome masculino «ele» nem explicitar um referente.
- source_word: בֵּין ... וּבֵין
  choice: para entre ... e ...
  rationale: Expressa o movimento até a posição intermediária e conserva o sentido espacial da construção hebraica.
- source_word: מַחֲנֵה
  choice: acampamento
  rationale: Termo claro que pode designar tanto o grupo acampado quanto sua posição, adequado ao contexto militar e de viagem.
- source_word: מִצְרַיִם / יִשְׂרָאֵל
  choice: do Egito / de Israel
  rationale: Mantém os nomes próprios e a forma das expressões hebraicas, sem substituir interpretativamente por «egípcios» e «israelitas».
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  choice: a nuvem e a escuridão
  rationale: Reproduz os dois substantivos definidos e sua justaposição marcante no hebraico.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: mas iluminou a noite
  rationale: «Iluminou» traduz o sentido causativo/ativo de אור com «a noite» como objeto. «Mas» torna natural o contraste implícito com a escuridão, sem definir de modo explícito o sujeito.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: e um acampamento não se aproximou do outro
  rationale: Explicita apenas os dois referentes já mencionados para tornar idiomática em português a expressão recíproca hebraica «este ao outro».
- source_word: כָּל־הַלָּיְלָה
  choice: durante toda a noite
  rationale: Forma portuguesa natural que preserva integralmente a duração indicada no hebraico.
theological_decisions:
- issue: Referente dos verbos singulares «veio» e «iluminou»
  choice: Manter o sujeito não expresso
  alternative: Empregar «ele» para o anjo de Deus ou nomear explicitamente a coluna/nuvem
  rationale: O contexto imediato menciona tanto o anjo de Deus quanto a coluna de nuvem. Como o português permite sujeito oculto, essa construção preserva a ambiguidade do hebraico sem impor uma identificação teológica.
- issue: Relação entre nuvem, escuridão e luz
  choice: 'Traduzir a sequência como contraste: «Havia a nuvem e a escuridão, mas iluminou a noite»'
  alternative: Entender que havia escuridão para um acampamento e luz para o outro, ou traduzir «a nuvem era escuridade, porém dava luz de noite»
  rationale: O hebraico é sintaticamente conciso e não especifica claramente como escuridão e iluminação se distribuem entre os acampamentos. A tradução conserva essa tensão, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O sujeito oculto evita um pronome com gênero que resolveria indevidamente a ambiguidade do referente. «Acampamento» é repetido no fim para assegurar clareza da reciprocidade.
