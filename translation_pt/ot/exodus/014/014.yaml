source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: pt
  text: Yahweh lutará por vocês, e vocês ficarão em silêncio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquem em silêncio”, “vocês devem ficar calados” ou, tradicionalmente, “aquietem-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִלָּחֵם
  choice: lutará
  rationale: O nifal imperfeito de לחם indica aqui a ação futura de entrar em combate; “lutará” é natural e preserva o sentido militar.
- source_word: לָכֶם
  choice: por vocês
  rationale: 'A preposição ל com sufixo de segunda pessoa masculina plural indica benefício ou representação: Yahweh age em favor do povo.'
- source_word: וְאַתֶּם
  choice: e vocês
  rationale: Preserva a coordenação hebraica e, com o pronome explícito, mantém o contraste entre a ação de Yahweh e a postura do povo.
- source_word: תַּחֲרִישׁוּן
  choice: ficarão em silêncio
  rationale: O hifil imperfeito de חרשׁ pode ser entendido como declaração futura ou como exortação. A forma futura conserva mais diretamente a morfologia sem eliminar a possível força injuntiva, registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração amplamente aceita.
- issue: Força modal de תַּחֲרִישׁוּן
  choice: ficarão em silêncio
  alternative: fiquem em silêncio / vocês devem ficar em silêncio
  rationale: O imperfeito hebraico admite leitura futura e, no contexto exortativo, também injuntiva. O texto principal mantém a forma futura, enquanto a nota preserva a outra possibilidade sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” adequado tanto à leitura brasileira quanto ao português internacional. A formulação concisa acompanha a estrutura do hebraico e preserva a ambiguidade modal do verbo final.
