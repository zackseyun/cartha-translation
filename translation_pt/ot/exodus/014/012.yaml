base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: pt
  text: 'Não foi isso que lhe dissemos no Egito: ‘Deixe-nos em paz, para que sirvamos aos egípcios’? Pois é melhor para nós servir aos egípcios do que morrer no deserto.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַל מִמֶּנּוּ
  choice: Deixe-nos em paz
  rationale: Expressa de modo natural o idiomatismo hebraico, literalmente “cesse de nós/afaste-se de nós”, no sentido de não interferir com eles.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: para que sirvamos aos egípcios
  rationale: O cohortativo נַעַבְדָה indica a ação desejada como resultado de serem deixados em paz; מִצְרַיִם designa aqui coletivamente os egípcios.
- source_word: כִּי טוֹב לָנוּ עֲבֹד
  choice: Pois é melhor para nós servir
  rationale: Mantém a formulação comparativa e não marcada temporalmente do hebraico, adequada à afirmação feita enquanto a morte no deserto ainda é vista como iminente.
- source_word: מִמֻּתֵנוּ בַּמִּדְבָּר
  choice: do que morrer no deserto
  rationale: Reproduz com clareza a comparação introduzida por מִן e verte o infinitivo com sufixo coletivo em português natural.
theological_decisions:
- issue: Valor temporal da comparação
  choice: é melhor para nós servir
  alternative: teria sido melhor para nós servir
  rationale: O hebraico não marca explicitamente uma comparação contrafactual passada; no contexto, os israelitas ainda consideram a morte no deserto uma ameaça iminente. A tradução conserva essa tensão temporal em vez de resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “lhe” e imperativo “Deixe-nos”. A repetição de “egípcios” e “servir” preserva a ênfase do hebraico sem soar artificial.
