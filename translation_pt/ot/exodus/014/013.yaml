base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: pt
  text: 'Moisés disse ao povo: “Não tenham medo. Fiquem firmes e vejam a salvação do SENHOR, que ele realizará por vocês hoje; pois os egípcios que vocês veem hoje vocês nunca mais verão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: Expressa de modo natural a proibição hebraica no plural, dirigida a todo o povo.
- source_word: הִתְיַצְבוּ
  choice: Fiquem firmes
  rationale: Preserva a ideia de manter posição e permanecer resoluto diante da ameaça.
- source_word: יְשׁוּעַת יְהוָה
  choice: a salvação do SENHOR
  rationale: Mantém o vocabulário teológico de libertação e representa o Tetragrama pela convenção editorial SENHOR.
- source_word: יַעֲשֶׂה לָכֶם
  choice: realizará por vocês
  rationale: Comunica que o SENHOR efetuará a libertação em benefício do povo.
- source_word: עַד עוֹלָם
  choice: nunca mais
  rationale: Neste enunciado negativo, a expressão idiomática indica que eles não tornarão a ver aqueles egípcios em tempo algum.
theological_decisions:
- issue: Agente da salvação
  choice: que ele realizará por vocês
  alternative: que será realizada hoje para vocês
  rationale: Preserva a referência gramatical ao SENHOR como aquele que age em favor de Israel, sem acrescentar uma explicação doutrinária.
- issue: Extensão temporal de עַד עוֹלָם
  choice: nunca mais voltarão a vê-los
  alternative: não tornarão a vê-los para sempre
  rationale: A construção negativa hebraica é transmitida naturalmente em português por “nunca mais”; a nota registra a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”) e paralelismo direto. A pontuação mantém a progressão entre ordem, promessa e explicação.
