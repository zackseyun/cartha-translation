revisions:
- from: 'Moisés disse ao povo: “Não tenham medo. Fiquem firmes e vejam a salvação do SENHOR, que ele realizará por vocês hoje; pois os egípcios que vocês veem hoje, nunca mais voltarão a vê-los.”[a]'
  to: 'Moisés disse ao povo: “Não tenham medo. Fiquem firmes e vejam a salvação do SENHOR, que ele realizará por vocês hoje; pois os egípcios que vocês veem hoje vocês nunca mais verão.”'
  rationale: Corrigida a sintaxe da cláusula final para que «vocês» seja inequivocamente o sujeito de «verão», como no hebraico. A nota foi removida porque sua paráfrase era sintaticamente ambígua; «nunca mais» é uma forma portuguesa idiomática que preserva a força durativa da negação.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'A oração final do rascunho altera a relação sintática do hebraico: «os egípcios ... nunca mais voltarão a vê-los» faz dos egípcios o sujeito de «ver», quando o sujeito permanece «vocês» (o povo). A revisão restaura o sentido: Israel não voltará a ver os egípcios. «Nunca mais» transmite adequadamente a permanência de עוֹד עַד עוֹלָם neste contexto negativo.'
  naturalness: «Não tenham medo», «Fiquem firmes» e «vejam» são naturais e adequados ao registro. A redação revista elimina a construção ambígua e antinatural da frase final.
  terminology: «Salvação do SENHOR» representa corretamente יְשׁוּעַת יְהוָה e mantém a convenção editorial para o Tetragrama. «Realizará por vocês» preserva o SENHOR como agente da libertação.
  issues:
  - severity: high
    issue: Inversão do sujeito na oração final
    rationale: Em «os egípcios que vocês veem hoje, nunca mais voltarão a vê-los», «os egípcios» passa a ser o sujeito de «voltarão a ver». O hebraico declara que o povo não verá novamente os egípcios.
  - severity: low
    issue: Nota de rodapé imprecisa e desnecessária
    rationale: A formulação «não tornarão a vê-los novamente para sempre» conserva a mesma ambiguidade de sujeito e é menos natural. O texto revisto já comunica o valor permanente da expressão hebraica.
  revised_text: 'Moisés disse ao povo: “Não tenham medo. Fiquem firmes e vejam a salvação do SENHOR, que ele realizará por vocês hoje; pois os egípcios que vocês veem hoje vocês nunca mais verão.”'
