  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: pt
  text: Israel viu o grande poder que Yahweh havia demonstrado contra o Egito[a]. O povo temeu Yahweh e creu em Yahweh e em Moisés, seu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a grande mão». Ou «a poderosa mão». O hebraico emprega «mão» como imagem comum de poder. A última parte também pode ser traduzida como «que Yahweh havia realizado no Egito» ou «ao Egito».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Expressa de modo direto a percepção do que acabara de acontecer, mantendo o verbo comum de visão.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Preserva o singular coletivo hebraico e sua correspondência com a expressão posterior «o povo».
- source_word: הַיָּד הַגְּדֹלָה
  choice: a grande mão
  rationale: Mantém a imagem hebraica recorrente da mão como manifestação de poder; «grande» corresponde diretamente a גְּדֹלָה.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: que Yahweh havia feito agir contra o Egito
  rationale: A formulação portuguesa conserva o verbo «fazer», dá sentido natural à imagem da mão e, pelo contexto do juízo no mar, entende בְ como ação dirigida contra o Egito, sem ocultar as alternativas na nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיִּירְאוּ
  choice: temeu
  rationale: Preserva a força ampla de ירא, que pode abranger temor, reverência e assombro; o sujeito coletivo singular «o povo» pede «temeu» em português.
- source_word: הָעָם
  choice: o povo
  rationale: Reproduz a designação explícita do texto sem especificá-la além do necessário.
- source_word: וַיַּאֲמִינוּ
  choice: creu
  rationale: Com sujeito coletivo singular, «creu» traduz naturalmente o hifil de אמן com בְ, incluindo a noção de confiança.
- source_word: בַּיהוָה וּבְמֹשֶׁה עַבְדּוֹ
  choice: em Yahweh e em Moisés, seu servo
  rationale: Mantém a mesma construção preposicional para ambos e esclarece pela aposição que Moisés ocupa a posição subordinada de servo de Yahweh.
theological_decisions:
- issue: Natureza da resposta de Israel a Moisés
  choice: O povo creu em Yahweh e em Moisés no papel de servo autorizado de Yahweh.
  alternative: O povo confiou pessoalmente tanto em Yahweh quanto em Moisés; ou creu no que ambos disseram.
  rationale: A repetição de אמן com בְ apresenta confiança dirigida a Yahweh e a Moisés, enquanto «seu servo» mantém explicitamente a subordinação de Moisés e evita sugerir igualdade entre eles.
- issue: Sentido do temor do povo
  choice: temeu Yahweh
  alternative: reverenciou Yahweh; ficou tomado de assombro diante de Yahweh
  rationale: «Temeu» preserva a tensão lexical e teológica entre medo, reverência e assombro, sem escolher silenciosamente apenas um desses matizes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A divisão em duas frases evita uma cadeia excessiva de coordenações sem apagar a progressão narrativa. O nome «Yahweh» é preservado; «grande mão» mantém a imagem concreta do hebraico.
