  source_fidelity: A tradução preserva corretamente a estrutura narrativa, os sujeitos coletivos («Israel», «o povo»), o temor de Yahweh e a confiança em Yahweh e em Moisés, seu servo. Porém, «a grande mão que Yahweh havia feito agir» não corresponde de modo claro nem natural ao hebraico. A expressão hebraica é literalmente «a grande mão que Yahweh fez/realizou em relação ao Egito», uma imagem idiomática de poder manifesto.
  naturalness: «Havia feito agir» é uma construção pouco idiomática em português e torna obscura a relação entre Yahweh, a mão e o Egito. «O grande poder que Yahweh havia demonstrado contra o Egito» é natural, preserva o sentido contextual da imagem e deixa a formulação literal registrada em nota.
  terminology: «Yahweh», «temeu», «creu», «Israel», «o povo» e «Moisés, seu servo» são adequados. «Grande poder» é uma tradução idiomática segura para «grande mão», desde que a nota mantenha a imagem literal.
  issues:
