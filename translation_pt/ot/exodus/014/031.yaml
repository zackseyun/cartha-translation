    issue: Construção «que Yahweh havia feito agir contra o Egito»
    rationale: O hebraico não diz que Yahweh fez a mão agir. A formulação introduz uma construção causal/instrumental não expressa e é pouco natural em português. A imagem de «mão» funciona idiomaticamente como poder ou ação poderosa.
  revised_text: Israel viu o grande poder que Yahweh havia demonstrado contra o Egito[a]. O povo temeu Yahweh e creu em Yahweh e em Moisés, seu servo.
