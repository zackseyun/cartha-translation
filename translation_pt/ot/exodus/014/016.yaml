source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: pt
  text: Mas você[a], levante o seu cajado, estenda a mão sobre o mar e divida-o, para que os filhos de Israel passem pelo meio do mar em terra seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quanto a você”. O pronome é enfático e destaca Moisés em contraste com o povo.'
    reason: ênfase discursiva
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: A conjunção com o pronome independente destaca Moisés em contraste com o povo, que acaba de receber a ordem de avançar.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: levante o seu cajado
  rationale: Expressa de modo natural a ordem de erguer o objeto; “cajado” é a designação corrente no contexto de Moisés.
- source_word: וּנְטֵה אֶת יָדְךָ
  choice: estenda a mão
  rationale: Reproduz diretamente o gesto indicado pelo imperativo de נטה com יָד.
- source_word: עַל הַיָּם
  choice: sobre o mar
  rationale: Preserva a relação espacial indicada por עַל sem especificar além do texto se o gesto é acima ou na direção das águas.
- source_word: וּבְקָעֵהוּ
  choice: e divida-o
  rationale: בקע descreve abrir ou partir algo. “Divida-o” é claro e digno em português e se ajusta naturalmente ao mar como objeto.
- source_word: וְיָבֹאוּ
  choice: para que ... entrem
  rationale: No encadeamento das ordens, a forma verbal comunica o resultado ou propósito da ação de Moisés.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma masculina plural explícita do hebraico e a designação histórica do povo, sem reduzir o referente apenas aos homens.
- source_word: בְּתוֹךְ הַיָּם
  choice: pelo meio do mar
  rationale: Conserva a imagem espacial do interior do mar e, pelo contexto de travessia, usa uma formulação natural em português.
- source_word: בַּיַּבָּשָׁה
  choice: em terra seca
  rationale: Expressa o contraste concreto entre o mar e o solo seco pelo qual o povo passaria.
theological_decisions:
- issue: Sentido e referente de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A tradução conserva a expressão hebraica tradicional, embora seu referente contextual seja todo o povo de Israel, não somente indivíduos do sexo masculino.
- issue: Agente implícito na divisão do mar
  choice: divida-o
  alternative: faça com que ele se divida
  rationale: Mantém a forma direta da ordem dada a Moisés sem acrescentar uma explicação sobre a relação entre a ação instrumental de Moisés e a ação divina desenvolvida no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O pronome “você” evita solenidade artificial; “filhos de Israel” preserva a forma hebraica, e a nota registra a ênfase do pronome inicial.
