  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: pt
  text: 'Pois o faraó dirá a respeito dos filhos de Israel: “Eles estão desorientados[a] na terra; o deserto os cercou.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles estão perplexos na terra” ou “Eles estão encurralados na terra”. O particípio hebraico pode indicar confusão, perplexidade ou estar desorientado e sem saída.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o deserto os deixou sem saída”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Pois ... dirá
  rationale: O waw com qatal tem sentido futuro no contexto, pois o SENHOR prediz a reação do faraó; “pois” expressa a relação explicativa com o versículo anterior.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa tradicional e natural do título régio.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: a respeito dos filhos de Israel
  rationale: Com אָמַר, a preposição ל pode introduzir aqueles sobre quem se fala. A expressão “filhos de Israel” preserva de perto o hebraico.
- source_word: נְבֻכִים
  choice: desorientados
  rationale: O particípio descreve perplexidade ou perda de direção e pode também sugerir embaraço; “desorientados” comunica naturalmente esse estado sem acrescentar explicitamente a ideia de que estão vagando.
- source_word: הֵם
  choice: eles estão
  rationale: Representa o pronome explícito e a estrutura predicativa da oração hebraica.
- source_word: בָּאָרֶץ
  choice: nesta terra
  rationale: “Terra” preserva a amplitude de אֶרֶץ; o demonstrativo torna idiomática em português a referência à região em que o faraó imagina que eles estejam desorientados, sem identificar com precisão excessiva o território.
- source_word: סָגַר עֲלֵיהֶם
  choice: os cercou
  rationale: O idioma descreve confinamento ou cerco. “Os cercou” preserva a personificação do deserto e comunica que ficaram sem saída.
- source_word: הַמִּדְבָּר
  choice: o deserto
  rationale: No contexto do êxodo, “deserto” é a forma corrente e clara em português para a região inculta designada por מִדְבָּר, sem exigir que seja apenas areia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva “filhos de Israel” e a personificação do deserto, enquanto as notas registram a amplitude lexical genuína de נְבֻכִים e סָגַר עֲלֵיהֶם.
