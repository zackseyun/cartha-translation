base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: pt
  text: Quando o faraó se aproximou, os filhos de Israel[b] levantaram os olhos e viram que o Egito[a] vinha marchando atrás deles. Então ficaram com muito medo, e os filhos de Israel clamaram a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Egito”; o nome singular representa coletivamente a força egípcia que vinha atrás deles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os israelitas”, em lugar de “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: se aproximou
  rationale: O hifil de קרב tem aqui sentido intransitivo, com o faraó como sujeito; “se aproximou” expressa naturalmente a aproximação e mantém a tensão narrativa.
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: levantaram os olhos
  rationale: Preserva a conhecida expressão idiomática hebraica e continua clara em português atual.
- source_word: וְהִנֵּה
  choice: e viram que
  rationale: No contexto, introduz a percepção súbita dos israelitas. A formulação transmite essa força discursiva com naturalidade, sem recorrer ao mais arcaizante “e eis que”.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Mantém o nome singular presente no hebraico, empregado coletivamente para a força egípcia que os perseguia.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: vinha marchando atrás deles
  rationale: נסע descreve movimento ou partida; no contexto militar, “vinha marchando” comunica o avanço da força egípcia sem substituir o sentido lexical pela ideia mais interpretativa de “perseguir”.
- source_word: וַיִּירְאוּ מְאֹד
  choice: ficaram com muito medo
  rationale: Formulação natural em português moderno que preserva a intensidade do verbo acompanhado de מְאֹד.
- source_word: וַיִּצְעֲקוּ
  choice: clamaram
  rationale: Expressa um grito urgente dirigido a Deus em situação de aflição e pertence ao registro bíblico corrente sem ser obscuro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão masculina corporativa do hebraico, que aqui designa o povo de Israel.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título tradicional.
- issue: Expressão corporativa בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha conserva a forma da designação nacional e pactual hebraica, sem impedir seu sentido coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém alguma textura hebraica em “levantaram os olhos”, “o Egito” e “filhos de Israel”, enquanto usa sintaxe narrativa natural. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
