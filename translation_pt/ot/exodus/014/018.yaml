  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: pt
  text: E os egípcios saberão que eu sou Yahweh[a], quando eu for glorificado por meio de Faraó, de seus carros de guerra e de seus cavaleiros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: divine_name
  - marker: b
    text: 'Ou: “quando eu manifestar minha glória por meio de Faraó, de seus carros de guerra e de seus cavaleiros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E os egípcios saberão
  rationale: O perfeito com waw, dentro da sequência narrativa e profética, expressa aqui o resultado futuro da ação divina. “Saberão” é claro e natural em português.
- source_word: מִצְרַיִם
  choice: os egípcios
  rationale: Embora o termo também possa designar o Egito como território ou nação, neste contexto refere-se às pessoas que reconhecerão quem é Yahweh.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Preserva a fórmula de reconhecimento e apresenta יהוה como nome próprio divino, não como título.
- source_word: בְּהִכָּבְדִי
  choice: quando eu for glorificado
  rationale: 'O infinitivo construto nifal de כבד com sufixo de primeira pessoa tem sentido passivo ou resultativo: ser glorificado, receber honra. “Quando” comunica o valor temporal de בְּ sem eliminar a tensão da forma passiva.'
- source_word: בְּפַרְעֹה
  choice: por meio de Faraó
  rationale: A preposição בְּ pode indicar esfera ou meio. “Por meio de” comunica que a derrota de Faraó será o acontecimento no qual a glória de Yahweh se tornará manifesta, sem sugerir necessariamente que Faraó o glorifique voluntariamente.
- source_word: בְּרִכְבּוֹ
  choice: de seus carros de guerra
  rationale: רכב pode ter sentido coletivo de força de carros. “Carros de guerra” é inequívoco para o leitor moderno e mantém o referente militar.
- source_word: וּבְפָרָשָׁיו
  choice: e de seus cavaleiros
  rationale: פָרָשִׁים designa cavaleiros ou cavalaria. “Cavaleiros” preserva a referência concreta e forma um par natural com “carros de guerra”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal revelado por Deus e evita substituí-lo silenciosamente por um título.
- issue: Como expressar a glorificação de Yahweh em relação a Faraó
  choice: quando eu for glorificado por meio de Faraó
  alternative: quando eu manifestar minha glória em Faraó
  rationale: A opção principal mantém a voz passiva do nifal e a ambiguidade entre receber honra e ter a glória reconhecida. A alternativa ativa explicita o sentido contextual, mas resolve uma tensão que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Carros de guerra” evita que “carros” seja entendido como automóveis; “por meio de” conserva a relação instrumental sem atribuir a Faraó uma glorificação voluntária.
