  source_fidelity: 'O texto traduz com fidelidade a fórmula de reconhecimento: os egípcios reconhecerão que Yahweh é Yahweh. «Quando eu for glorificado» reproduz adequadamente o nifal de כבד e preserva sua nuance passiva/resultativa. «Por meio de Faraó, de seus carros de guerra e de seus cavaleiros» é uma representação defensável do uso repetido de בְּ no contexto, no qual a glória de Yahweh se manifesta em conexão com a derrota dessas forças.'
