id: EXO.14.2
reference: Exodus 14:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: pt
  text: Diga aos filhos de Israel[a] que voltem e acampem diante de Pi-Hairote, entre Migdol e o mar. Diante de Baal-Zefom[b], em frente a ele[c], vocês devem acampar junto ao mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Pi-Hairote, Migdol e Baal-Zefom são nomes de lugares; por isso, são transliterados, e não traduzidos.
    reason: cultural_note
  - marker: c
    text: Ou “do lado oposto a ele”. O pronome provavelmente se refere a Baal-Zefom.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Diga a
  rationale: O imperativo piel de דבר seguido de אֶל introduz uma ordem direta a Moisés. “Diga a” é corrente e natural em português, sem perder a força do hebraico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar hebraica de modo claro e digno; “os israelitas” é uma alternativa mais idiomática, registrada em nota.
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: que voltem e acampem
  rationale: As formas volitivas após o imperativo expressam as ações ordenadas. O subjuntivo português comunica naturalmente que Moisés deve instruí-los a mudar de direção e montar acampamento.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: diante de Pi-Hairote
  rationale: לִפְנֵי indica posição diante de ou em frente a; פִּי הַחִירֹת é tratado como topônimo e transliterado segundo forma corrente em português.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: entre Migdol e o mar
  rationale: Reproduz diretamente a construção correlativa בֵּין...וּבֵין e conserva הַיָּם como o substantivo comum “o mar”.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: diante de Baal-Zefom
  rationale: Conserva o valor espacial de לִפְנֵי e translitera o topônimo em forma adequada ao português.
- source_word: נִכְחוֹ
  choice: em frente a ele
  rationale: נֹכַח com sufixo masculino singular indica posição fronteira ou oposta. “Ele” preserva a referência pronominal do hebraico, que provavelmente retoma Baal-Zefom.
- source_word: תַחֲנוּ
  choice: vocês devem acampar
  rationale: O imperfeito de segunda pessoa plural tem força diretiva neste contexto. “Devem acampar” evita que o futuro português seja entendido apenas como previsão.
- source_word: עַל הַיָּם
  choice: junto ao mar
  rationale: Neste uso locativo, עַל exprime proximidade à margem; “junto ao mar” é natural e mais preciso que o literal “sobre o mar”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe diretiva foi expressa por subjuntivo e por “devem” para evitar ambiguidade preditiva; os topônimos seguem formas portuguesas reconhecíveis.
