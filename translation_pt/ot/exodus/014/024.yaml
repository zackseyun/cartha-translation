  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: pt
  text: Durante a vigília da manhã, Yahweh olhou de cima para o acampamento dos egípcios por meio da coluna de fogo e de nuvem[a] e lançou confusão no acampamento dos egípcios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de dentro da coluna de fogo e de nuvem”.'
    reason: A preposição בְּ pode indicar o meio pelo qual Yahweh olhou ou a posição a partir da qual ele o fez.
  - marker: b
    text: 'Ou: “lançou o acampamento dos egípcios em pânico”.'
    reason: O verbo הום pode expressar confusão tumultuada ou pânico.
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: Durante a vigília da manhã
  rationale: אַשְׁמֹרֶת designa um período de guarda. A expressão preserva a referência temporal específica à última parte da noite sem acrescentar uma explicação ao texto.
- source_word: וַיַּשְׁקֵף
  choice: olhou para
  rationale: No hifil, שׁקף descreve olhar a partir de uma posição elevada ou de um ponto de observação. Em português, “olhou para” é natural; o contexto da coluna já fornece a perspectiva sem exigir “olhou para baixo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: o acampamento dos egípcios
  rationale: Representa naturalmente a construção hebraica e identifica o acampamento militar pertencente aos egípcios.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: por meio da coluna de fogo e nuvem
  rationale: Entende בְּ em sentido instrumental ou locativo-instrumental. “Por meio da” comunica a mediação da coluna, enquanto a nota preserva a leitura locativa.
- source_word: וַיָּהָם
  choice: lançou ... em confusão
  rationale: הום tem força causativa e indica tumulto, confusão ou pânico. A formulação preserva essa força sem antecipar uma derrota completa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Natureza da ação divina sobre o acampamento egípcio
  choice: lançou ... em confusão
  alternative: lançou ... em pânico
  rationale: O verbo admite tanto confusão tumultuada quanto pânico. O texto principal usa a opção mais abrangente, e a nota registra a alternativa mais intensa sem resolver indevidamente a nuance.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Vigília da manhã” conserva o termo histórico sem paráfrase excessiva. A repetição de “o acampamento dos egípcios” acompanha a ênfase estrutural do hebraico.
