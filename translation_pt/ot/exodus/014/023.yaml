base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: pt
  text: 'Os egípcios os perseguiram e entraram no meio do mar atrás deles: todos os cavalos do faraó, seus carros de guerra e seus cavaleiros.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: perseguiram
  rationale: רדף indica perseguir ou ir ao encalço; “perseguiram” é natural e adequado ao contexto militar.
- source_word: מִצְרַיִם
  choice: Os egípcios
  rationale: Embora a forma também possa designar o Egito, o verbo no plural e o contexto indicam o povo ou exército egípcio.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: entraram atrás deles
  rationale: A combinação expressa entrada em seguida aos israelitas; a formulação conserva tanto o movimento para dentro quanto a perseguição.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: todos os cavalos do faraó
  rationale: O singular סוּס tem sentido coletivo depois de כֹּל; o plural é a forma natural de exprimir esse sentido em português.
- source_word: רִכְבּוֹ
  choice: seus carros de guerra
  rationale: רכב pode designar carro, carros ou a força de carros; “carros de guerra” esclarece o referente militar sem ampliar indevidamente o texto.
- source_word: וּפָרָשָׁיו
  choice: e seus cavaleiros
  rationale: פָּרָשׁ designa cavaleiro ou integrante da cavalaria; “cavaleiros” preserva a imagem concreta.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: no meio do mar
  rationale: תּוֹךְ enfatiza o interior do mar. Com “entraram”, a preposição portuguesa “no” expressa naturalmente o movimento para dentro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Faraó” foi usado com artigo e inicial minúscula como título, conforme o uso corrente em português.
