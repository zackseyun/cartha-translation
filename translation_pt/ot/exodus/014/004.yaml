base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: pt
  text: E endurecerei o coração do faraó[a], e ele os perseguirá; serei glorificado por meio do faraó e de todo o seu exército[b], e os egípcios saberão que eu sou Yahweh”. E eles fizeram assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fortalecerei o coração do faraó”. O verbo hebraico pode significar “tornar forte ou firme”; neste contexto de Êxodo, essa firmeza se manifesta como obstinação, daí “endurecerei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “receberei glória sobre o faraó e todo o seu exército”. A expressão hebraica indica que Yahweh receberá honra ou glória em relação ao faraó e ao seu exército, por meio do que acontecerá em seguida.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: endurecerei
  rationale: O hifil de חזק apresenta Yahweh como agente e, neste contexto narrativo, a firmeza do coração do faraó se manifesta como obstinação. “Endurecerei” é natural em português e preserva a causação explícita.
- source_word: לֵב
  choice: coração
  rationale: Preserva o conhecido idioma bíblico para o centro interior da vontade e do pensamento, sem reduzi-lo apenas à mente ou às emoções.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: ele os perseguirá
  rationale: רדף seguido de אחרי descreve perseguição, aqui de caráter militar. A formulação é clara e corrente.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: serei glorificado sobre o faraó
  rationale: A forma de כבד expressa Yahweh recebendo honra ou glória em relação ao faraó mediante o juízo que virá. “Sobre” preserva no texto principal a dimensão adversativa do contexto, enquanto a nota registra a possibilidade instrumental.
- source_word: וּבְכָל חֵילוֹ
  choice: e sobre todo o seu exército
  rationale: חַיִל designa aqui as forças militares do faraó; “exército” é o equivalente moderno mais claro.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: e os egípcios saberão
  rationale: O verbo plural favorece a referência pessoal ao povo egípcio, em vez do abstrato “o Egito saberá”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino revelado, em vez de substituí-lo por um título.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: E eles fizeram assim
  rationale: Fecho narrativo direto que indica o cumprimento da instrução precedente; a formulação é digna e compreensível.
theological_decisions:
- issue: Ação divina no endurecimento do faraó
  choice: “endurecerei o coração do faraó”
  alternative: “fortalecerei o coração do faraó” ou “permitirei que o coração do faraó se endureça”
  rationale: A primeira pessoa do hifil apresenta Yahweh diretamente como sujeito causador. A tradução não atenua isso para mera permissão, mas a nota mantém o sentido lexical mais literal de tornar forte ou firme.
- issue: Sentido de כבד no contexto de juízo
  choice: “serei glorificado sobre o faraó”
  alternative: “serei glorificado por meio do faraó”
  rationale: A escolha conserva tanto a ideia de Yahweh receber glória quanto a dimensão de triunfo sobre o faraó e suas forças. A alternativa instrumental legítima é apresentada em nota para preservar a amplitude da construção hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém o idioma bíblico “coração”, o nome divino “Yahweh” e a causação divina explícita. A pontuação divide a longa coordenação hebraica para maior clareza sem alterar sua progressão lógica.
