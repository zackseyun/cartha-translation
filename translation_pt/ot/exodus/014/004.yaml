    reason: lexical_alternative
  - marker: b
    text: 'Ou: “receberei glória sobre o faraó e todo o seu exército”. A expressão hebraica indica que Yahweh receberá honra ou glória em relação ao faraó e ao seu exército, por meio do que acontecerá em seguida.'
