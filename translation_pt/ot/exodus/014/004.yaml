revisions:
- from: E endurecerei o coração do faraó[a], e ele os perseguirá. Assim, serei glorificado sobre o faraó e sobre todo o seu exército[b], e os egípcios saberão que eu sou Yahweh”. E eles fizeram assim.
  to: E endurecerei o coração do faraó[a], e ele os perseguirá; serei glorificado por meio do faraó e de todo o seu exército[b], e os egípcios saberão que eu sou Yahweh”. E eles fizeram assim.
  rationale: A revisão substitui um uso não idiomático de “sobre” por “por meio de”, que comunica naturalmente a glorificação de Yahweh em conexão com Faraó e suas forças. A nota conserva a alternativa que salienta o contexto de juízo e triunfo. Também remove “Assim”, que explicitava além do necessário a relação entre as orações. Nenhuma alteração atenua a ação divina expressa pelo hifil de חזק.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:25Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a causação divina explícita em “endurecerei”, a perseguição, o reconhecimento de Yahweh pelos egípcios e o fecho narrativo. Contudo, “serei glorificado sobre o faraó” não é uma formulação portuguesa natural para o niphal de כבד com בְּ e pode sugerir uma relação espacial. “Serei glorificado por meio do faraó” expressa de modo claro a honra/glória obtida em conexão com o juízo, sem eliminar a dimensão contextual de triunfo.
  naturalness: “Endurecerei o coração do faraó”, “ele os perseguirá” e “os egípcios saberão” são claros e adequados ao registro bíblico moderno. A substituição de “sobre o faraó” por “por meio do faraó” resolve a principal dificuldade idiomática. A retirada de “Assim” evita introduzir uma inferência explícita que não está marcada no hebraico.
  terminology: “Faraó”, “coração”, “exército”, “egípcios” e “Yahweh” são consistentes, compreensíveis e adequados. A nota de “endurecerei” preserva corretamente a alternativa lexical “fortalecerei/farei firme”. A nota sobre glória deve corresponder ao texto principal e registrar, sem impor uma leitura exclusiva, o aspecto de honra manifesta no julgamento.
  issues:
  - severity: medium
    issue: “Serei glorificado sobre o faraó” é pouco idiomático e semanticamente impreciso em português.
    rationale: Embora tente refletir a dimensão adversativa do contexto, “sobre” tende a ser entendido espacialmente ou como calque. A construção hebraica admite uma relação de glorificação em/por meio de Faraó; “por meio de” é português natural e preserva a ambiguidade relacional relevante.
  - severity: low
    issue: “Assim” acrescenta uma conexão inferencial desnecessária.
    rationale: A sequência hebraica é coordenada. A relação de consequência é compreensível pelo contexto, mas não precisa ser explicitada no texto principal.
