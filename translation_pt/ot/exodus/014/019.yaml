  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: pt
  text: Então o anjo de Deus[a], que ia adiante do acampamento de Israel, deslocou-se e foi para trás deles; e a coluna de nuvem deslocou-se da frente deles e ficou atrás deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Deus”. A palavra hebraica pode significar tanto “anjo” como “mensageiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: mudou de posição / saiu
  rationale: O verbo נסע pode significar partir ou levantar acampamento, mas aqui descreve a mudança de posição do anjo e da coluna. As escolhas expressam claramente esse movimento espacial em português natural.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: o anjo de Deus
  rationale: מַלְאָךְ pode significar “anjo” ou “mensageiro”. “Anjo de Deus” é a expressão consagrada e natural neste contexto, sem definir a natureza exata da figura.
- source_word: הַהֹלֵךְ
  choice: que ia
  rationale: O particípio indica uma ação contínua anterior à mudança de posição; “que ia” comunica isso de modo fluente e claro.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: adiante do acampamento de Israel
  rationale: A expressão é espacial. “Adiante do acampamento” é natural em português e preserva a relação do hebraico.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: foi para trás deles
  rationale: מֵאַחֲרֵי indica aqui a posição na retaguarda, não perseguição. A tradução torna explícita a mudança para essa posição.
- source_word: עַמּוּד הֶעָנָן
  choice: a coluna de nuvem
  rationale: Tradução transparente e tradicional da construção hebraica, preservando sua imagem concreta.
- source_word: מִפְּנֵיהֶם
  choice: da frente deles
  rationale: Expressa com clareza a posição espacial inicial da coluna em português atual.
- source_word: וַיַּעֲמֹד
  choice: ficou
  rationale: Embora עמד signifique literalmente “ficar de pé” ou “parar”, neste contexto indica que a coluna assumiu uma posição fixa; “ficou atrás deles” é idiomático e fiel ao sentido.
theological_decisions:
- issue: Identidade e natureza de מַלְאַךְ הָאֱלֹהִים
  choice: Traduzir como “o anjo de Deus”, sem especificar se é um anjo criado, uma manifestação de Deus ou uma cristofania.
  alternative: “o mensageiro de Deus” ou uma formulação explicitamente teofânica
  rationale: O hebraico nomeia a figura, mas não define aqui sua natureza. A tradução preserva essa tensão e deixa a identificação mais precisa para a interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mudou de posição” esclarece o movimento espacial sem tornar a frase excessivamente técnica; “também” torna natural a coordenação das duas ações paralelas.
