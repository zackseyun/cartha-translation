  yaml_path: translation/ot/exodus/014/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh[a] falou a Moisés:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também traduzido como “SENHOR” ou “Jeová”.'
    reason: Registra a forma hebraica e alternativas tradicionais de tradução do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar e indica sequência; “Então” expressa essa progressão, enquanto “falou” traduz naturalmente o caráter formal de דבר neste contexto.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Representa no texto principal o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל marca o destinatário da fala; “falou a Moisés” é uma construção natural e digna em português.
- source_word: לֵּאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz o conteúdo da fala. Em português atual, os dois-pontos desempenham essa função com mais naturalidade do que o decalque “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome da aliança presente no hebraico e segue a leitura adotada na camada de consulta, sem substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos traduzem funcionalmente a fórmula introdutória לֵאמֹר; a nota é marcada no texto imediatamente após “Moisés” para corresponder ao posicionamento fornecido, embora seu conteúdo se refira ao nome divino.
