base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: pt
  text: Os filhos de Israel entraram no meio do mar, em terra seca; e as águas eram para eles uma muralha à sua direita e à sua esquerda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: entraram
  rationale: Neste contexto narrativo, בוא descreve movimento para dentro de um lugar; “entraram” é natural e preserva essa direção.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma hebraica literal e sua referência coletiva, sem substituí-la pela expressão mais idiomática “os israelitas”.
- source_word: בְּתוֹךְ הַיָּם
  choice: pelo meio do mar
  rationale: Expressa o sentido espacial de תּוֹךְ e, com o movimento verbal, comunica de modo natural a entrada e o percurso pelo meio do mar.
- source_word: בַּיַּבָּשָׁה
  choice: em terra seca
  rationale: O substantivo designa terreno seco em contraste com a água; a expressão é clara e idiomática em português.
- source_word: וְהַמַּיִם
  choice: e as águas
  rationale: O plural preserva a forma e a força imagética do hebraico.
- source_word: חֹמָה
  choice: formavam uma muralha
  rationale: חֹמָה significa concretamente “muralha”; “formavam” torna natural em português a construção nominal hebraica sem introduzir uma comparação ausente no texto.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: à direita e à esquerda
  rationale: Reproduz com concisão e simetria as posições laterais indicadas no hebraico; “para eles” já explicita o referente possessivo.
theological_decisions:
- issue: Natureza da imagem das águas
  choice: uma muralha
  alternative: como uma muralha
  rationale: O hebraico apresenta as águas diretamente como חֹמָה, sem partícula comparativa; a tradução conserva a afirmação concreta e sua tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações e o paralelismo espacial preservam o ritmo narrativo do hebraico.
