  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: pt
  text: As águas voltaram e cobriram os carros e os cavaleiros[a], todo o exército do faraó que havia entrado no mar atrás deles; não restou nem um sequer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cavalaria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: As águas voltaram
  rationale: Mantém o plural concreto do hebraico e expressa de modo natural que as águas retomaram sua posição anterior.
- source_word: וַיְכַסּוּ
  choice: cobriram
  rationale: Reproduz o sentido direto de כסה sem explicitar além do texto a ideia, implícita no contexto, de submergir ou destruir.
- source_word: הָרֶכֶב
  choice: os carros
  rationale: O substantivo pode designar coletivamente a força de carros; “os carros” é claro, concreto e natural em português.
- source_word: הַפָּרָשִׁים
  choice: os cavaleiros
  rationale: É uma tradução direta e legível para os guerreiros montados, preservando em nota a alternativa coletiva “a cavalaria”.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: todo o exército do faraó
  rationale: חֵיל tem aqui sentido militar, e “todo” preserva a abrangência expressa por לְכֹל.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: que havia entrado no mar atrás deles
  rationale: A forma relativa situa naturalmente a entrada do exército no mar durante a perseguição; “deles” remete aos israelitas sem substituir o referente no texto.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: não restou nem um sequer
  rationale: Expressa de modo idiomático e enfático a totalidade negativa da locução hebraica.
theological_decisions:
- issue: Extensão da destruição do exército do faraó
  choice: A afirmação de que não restou nenhum se aplica a todo o exército do faraó que entrou no mar em perseguição aos israelitas.
  alternative: Entender a declaração como referente a todos os soldados egípcios, inclusive os que não participaram da perseguição.
  rationale: 'A oração relativa hebraica delimita o grupo mencionado: a totalidade é enfática, mas se refere à força que entrou no mar atrás dos israelitas, não a todos os militares do Egito.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação preserva a unidade do enunciado e a relação de aposição entre os carros e cavaleiros e o exército perseguidor.
