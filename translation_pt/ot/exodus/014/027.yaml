base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: pt
  text: Então Moisés estendeu a mão sobre o mar, e, ao amanhecer, o mar voltou ao seu estado normal[a], enquanto os egípcios fugiam em direção a ele. E Yahweh lançou[b] os egípcios no meio do mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sua força habitual”, “à sua plena força” ou “à sua condição anterior”. A expressão hebraica indica que o mar retomou sua condição permanente e habitual.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico significa literalmente “sacudir” ou “sacudir para fora”, imagem vívida da ação de Yahweh ao lançar os egípcios no mar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: estendeu
  rationale: Com יָד, o verbo נטה descreve naturalmente o ato de estender a mão; a escolha preserva a ação física em português corrente.
- source_word: הַיָּם
  choice: o mar
  rationale: É o substantivo hebraico comum para “mar”; o versículo não exige tratá-lo como nome próprio.
- source_word: וַיָּשָׁב הַיָּם
  choice: o mar voltou
  rationale: שׁוב indica retorno a uma condição anterior; “voltou” é direto e natural.
- source_word: לִפְנוֹת בֹּקֶר
  choice: ao despontar da manhã
  rationale: A expressão indica a chegada ou virada da manhã. A formulação comunica esse momento temporal sem literalismo obscuro.
- source_word: לְאֵיתָנוֹ
  choice: ao seu estado normal
  rationale: אֵיתָן pode evocar permanência, firmeza ou força constante. No contexto, indica que o mar retomou sua condição estável e habitual, sem definir de modo excessivo se o foco é nível, curso ou força.
- source_word: נָסִים לִקְרָאתוֹ
  choice: fugiam em direção a ele
  rationale: O particípio expressa ação em andamento, e לִקְרָאתוֹ tem sentido direcional, literalmente “ao encontro dele”. A tradução preserva a imagem paradoxal de que, ao fugirem, os egípcios iam na direção do mar que retornava.
- source_word: וַיְנַעֵר
  choice: lançou
  rationale: נער apresenta a imagem vívida de sacudir ou despejar algo para fora. “Lançou” comunica em português natural o movimento violento no contexto, enquanto a nota preserva a metáfora literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino pessoal é transliterado, em vez de ser substituído por um título.
- source_word: בְּתוֹךְ הַיָּם
  choice: no meio do mar
  rationale: תּוֹךְ designa o interior ou meio de algo. Com o verbo de movimento escolhido, a expressão comunica tanto o destino quanto a localização resultante.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal revelado, sem substituí-lo pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a direção surpreendente de “fugiam em direção a ele” e usa notas apenas onde a amplitude lexical ou a imagem hebraica merecem ser preservadas.
