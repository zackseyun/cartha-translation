  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Por que você clama a mim? Diga aos filhos de Israel[a] que se ponham a caminho[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “que avancem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome pessoal divino representado pelo tetragrama, em vez de substituí-lo por um título como “SENHOR”.
- source_word: מַה
  choice: Por que
  rationale: Neste uso interrogativo com o verbo, מַה questiona a razão da ação e tem força de repreensão; “Por que” comunica naturalmente esse sentido.
- source_word: תִּצְעַק אֵלָי
  choice: você clama a mim
  rationale: צעק indica clamar, especialmente em aflição ou apelo. O presente preserva a imediatez da pergunta, e “clamar” mantém sua intensidade.
- source_word: דַּבֵּר אֶל
  choice: Diga a
  rationale: Embora a construção possa ser vertida formalmente como “Fale a”, “Diga a” introduz com mais naturalidade a instrução que deve ser transmitida, sem intensificá-la para “ordene”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz a forma masculina do hebraico e a designação pactual tradicional; a alternativa idiomática “israelitas” fica registrada em nota.
- source_word: וְיִסָּעוּ
  choice: que se ponham a caminho
  rationale: נסע descreve partir ou iniciar o deslocamento. A formulação portuguesa é clara e natural, conservando a ideia de começar a marcha sem reduzi-la apenas à direção “em frente”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: “Yahweh” preserva explicitamente o nome pactual e evita substituí-lo por um título. “Javé” é uma forma aportuguesada possível, mas a transliteração adotada mantém continuidade editorial.
- issue: Forma coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A expressão formalmente masculina do texto hebraico é mantida sem decidir que o referente exclui as mulheres; a forma coletiva mais idiomática é oferecida em nota.
- issue: Sentido contextual de וְיִסָּעוּ
  choice: que se ponham a caminho
  alternative: que avancem
  rationale: A tradução principal prioriza o sentido lexical de partir/iniciar viagem. A alternativa contextual “avancem” é preservada sem inserir no texto principal uma direção que o verbo, isoladamente, não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea no singular, sem coloquialismo excessivo. A sintaxe direta conserva a brevidade e a força do diálogo hebraico.
