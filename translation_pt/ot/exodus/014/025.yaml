base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: pt
  text: 'Ele tirou as rodas dos carros deles[a] e fez os carros avançarem com dificuldade. Então os egípcios disseram[b]: “Vamos fugir de Israel, pois o SENHOR está lutando por eles contra o Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz literalmente “a roda dos carros dele”, tratando o Egito como uma entidade coletiva.
    reason: Registra os singulares formais do texto-fonte, vertidos pelo plural idiomático em português.
  - marker: b
    text: 'O texto hebraico diz literalmente “Egito disse: ‘Vou fugir’”, personificando coletivamente os egípcios.'
    reason: Preserva a forma singular e a personificação do original, enquanto o texto principal usa o plural natural em português.
lexical_decisions:
- source_word: וַיָּסַר
  choice: tirou
  rationale: Expressa naturalmente o sentido de remover, preservando a ação causadora do transtorno aos carros.
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: as rodas dos carros deles
  rationale: O sufixo hebraico é formalmente singular, mas retoma o Egito como entidade coletiva; em português, o plural concorda naturalmente com os condutores egípcios sem alterar o referente coletivo.
- source_word: וַיְנַהֲגֵהוּ בִּכְבֵדֻת
  choice: fazendo-os avançar com dificuldade
  rationale: Transmite o movimento penoso dos carros. O pronome hebraico singular pode retomar coletivamente o conjunto dos carros; o plural é idiomático em português.
- source_word: אָנֻסָה
  choice: Vamos fugir
  rationale: A forma cohortativa está no singular, mas a fala é atribuída ao Egito coletivo; o plural inclusivo reproduz em português a exortação dos egípcios entre si.
- source_word: מִפְּנֵי יִשְׂרָאֵל
  choice: de Israel
  rationale: Equivalente português natural para fugir da presença ou diante de Israel.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama por SENHOR em versaletes/maiúsculas.
- source_word: נִלְחָם לָהֶם בְּמִצְרָיִם
  choice: está lutando por eles contra o Egito
  rationale: Preserva a construção em que o SENHOR combate em favor de Israel e contra o Egito.
theological_decisions:
- issue: Número gramatical na referência ao Egito coletivo
  choice: 'Plural natural no discurso e nos pronomes: “deles”, “os” e “Vamos fugir”'
  alternative: 'Singular formal: “dele”, “o” e “Vou fugir”'
  rationale: O hebraico personifica o Egito como sujeito coletivo singular. Em português, o plural deixa claro que os soldados egípcios falam e agem coletivamente, sem introduzir interpretação doutrinária.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH ou Javé
  rationale: Mantém uma convenção bíblica portuguesa tradicional e transparente, sem optar por uma vocalização disputada.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com legibilidade brasileira. A tradução mantém a personificação coletiva do Egito nas notas, mas emprega plurais idiomáticos no texto principal. A pontuação final enfatiza a percepção urgente dos egípcios sem acrescentar conteúdo.
