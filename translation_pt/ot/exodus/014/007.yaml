  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: pt
  text: Então ele tomou seiscentos carros de guerra escolhidos e todos os carros de guerra do Egito, com oficiais para todos eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com oficiais de carros em todos eles”. O termo hebraico pode designar auxiliares militares de elite ou capitães ligados aos carros de guerra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ele levou
  rationale: O wayyiqtol de לקח dá prosseguimento à narrativa; “Então” expressa com naturalidade essa sequência, e “levou” se ajusta ao contexto de mobilização militar.
- source_word: שֵׁשׁ מֵאוֹת
  choice: seiscentos
  rationale: Tradução direta da expressão numérica cardinal.
- source_word: רֶכֶב
  choice: carros de guerra
  rationale: Embora רֶכֶב possa designar coletivamente a força de carros, o numeral explícito favorece o substantivo contável; “carros de guerra” evita a associação moderna de “carros” com automóveis.
- source_word: בָּחוּר
  choice: escolhidos
  rationale: O particípio passivo de בחר indica unidades selecionadas, possivelmente de elite; “escolhidos” preserva o sentido básico sem acrescentar uma qualificação não expressa.
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: e todos os carros de guerra do Egito
  rationale: A cadeia construta com כֹל abrange a força egípcia de carros, além dos seiscentos carros selecionados.
- source_word: וְשָׁלִשִׁם
  choice: com oficiais
  rationale: שָׁלִשִׁים é um termo militar de sentido não inteiramente certo, geralmente relacionado a oficiais, capitães ou auxiliares de elite ligados aos carros. “Oficiais” comunica a função de modo claro sem especificá-la em excesso.
- source_word: עַל כֻּלּוֹ
  choice: sobre todos eles
  rationale: Embora o sufixo hebraico seja singular, o referente coletivo permite uma tradução distributiva natural, indicando oficiais designados por toda a força de carros.
