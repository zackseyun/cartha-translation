  yaml_path: translation/ot/exodus/014/006.yaml
  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: pt
  text: Então ele atrelou seu carro e levou consigo seu povo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preparou seu carro”; o verbo hebraico significa literalmente “amarrou” ou “prendeu” e, aqui, refere-se a atrelar os animais e preparar o carro.
    reason: lexical_alternative
  - marker: b
    text: “Seu povo” provavelmente se refere à força que acompanhava o faraó; o hebraico diz “seu povo”, não explicitamente “seu exército”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: atrelou
  rationale: O verbo אסר significa literalmente “amarrar” ou “prender”; no contexto de um carro, indica atrelar os animais e preparar o conjunto para partir. “Atrelou” preserva a ação concreta em português natural.
- source_word: רִכְבּוֹ
  choice: seu carro
  rationale: Embora רכב possa designar coletivamente os carros de guerra, o singular com sufixo refere-se mais naturalmente ao carro do próprio faraó no contexto imediato.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: עם significa normalmente “povo”. Neste contexto militar, provavelmente se refere à força que acompanhava o faraó, mas o hebraico não diz explicitamente “exército”.
- source_word: לָקַח עִמּוֹ
  choice: levou consigo
  rationale: A combinação verbal e preposicional significa diretamente “levar consigo” e soa natural em português.
