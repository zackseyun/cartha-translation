  text: וְ/הִזְהַרְתָּ֣ה אֶתְ/הֶ֔ם אֶת הַ/חֻקִּ֖ים וְ/אֶת הַ/תּוֹרֹ֑ת וְ/הוֹדַעְתָּ֣ לָ/הֶ֗ם אֶת הַ/דֶּ֨רֶךְ֙ יֵ֣לְכוּ בָ֔/הּ וְ/אֶת הַֽ/מַּעֲשֶׂ֖ה אֲשֶׁ֥ר יַעֲשֽׂוּ/ן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: pt
  text: E você os advertirá acerca dos estatutos e das leis[a], e lhes dará a conhecer o caminho em que devem andar[b] e a obra que devem realizar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instruções” ou “ensinamentos”, para “leis” (hebraico torot). O termo pode designar ensino de modo mais amplo, mas aqui o contexto jurídico favorece “leis”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o caminho em que andarão”. “Andar” foi mantido para preservar a metáfora hebraica referente à conduta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: E você os advertirá
  rationale: O hifil de זהר pode significar advertir, admoestar ou instruir com uma advertência. Neste contexto judicial, “advertirá” preserva a solenidade e a responsabilidade implicadas, enquanto o futuro expressa naturalmente a orientação de Jetro.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: חֻקִּים designa prescrições ou disposições estabelecidas. “Estatutos” conserva a nuance jurídica e distingue o termo de תּוֹרֹת.
- source_word: הַתּוֹרֹת
  choice: as leis
  rationale: Embora תּוֹרָה também possa significar instrução ou ensino, o plural ao lado de חֻקִּים e o contexto judicial favorecem “leis”; a alternativa mais ampla é registrada em nota.
- source_word: וְהוֹדַעְתָּ
  choice: lhes dará a conhecer
  rationale: O hifil de ידע tem sentido causativo, “fazer saber”. “Dar a conhecer” preserva essa força e mantém um registro natural e digno.
- source_word: הַדֶּרֶךְ
  choice: o caminho
  rationale: “Caminho” preserva a metáfora hebraica para a conduta ou o modo de vida.
- source_word: יֵלְכוּ בָהּ
  choice: em que devem andar
  rationale: A formulação conserva tanto a preposição referida ao caminho quanto a metáfora bíblica de “andar” como conduta; “devem” comunica a força prescritiva do contexto.
- source_word: הַמַּעֲשֶׂה
  choice: a obra
  rationale: מַעֲשֶׂה denota aquilo que se faz. “Obra” mantém o substantivo singular e abrange a ação ou tarefa exigida, embora “ação” seja possível.
- source_word: אֲשֶׁר יַעֲשׂוּן
  choice: que devem realizar
  rationale: A oração relativa especifica a conduta requerida. “Devem realizar” expressa obrigação sem a repetição menos elegante de “obra que devem fazer”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva o paralelismo entre “o caminho” e “a obra”, bem como a metáfora bíblica de andar. Os marcadores aparecem no texto na ordem de ocorrência.
