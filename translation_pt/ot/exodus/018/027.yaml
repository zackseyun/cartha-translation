  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: pt
  text: Então Moisés despediu seu sogro[a], e ele foi para a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixou seu sogro partir”; também pode ser traduzido por “mandou seu sogro embora”.'
    reason: A forma piel de שׁלח admite as ideias próximas de despedir, deixar partir e mandar embora; o contexto não exige uma conotação hostil.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: despediu
  rationale: No piel, שׁלח com objeto pessoal pode significar mandar embora ou despedir, isto é, permitir e formalizar a partida. “Despediu” é natural em português e não sugere necessariamente hostilidade.
- source_word: חֹתְנוֹ
  choice: seu sogro
  rationale: Neste contexto, חֹתֵן designa Jetro, pai da esposa de Moisés; “sogro” expressa de modo claro e conciso essa relação.
- source_word: וַיֵּלֶךְ לוֹ
  choice: e ele foi
  rationale: O pronome לוֹ integra uma construção idiomática de partida e não precisa ser traduzido separadamente. A explicitação de “ele” mantém claro que o sujeito é o sogro.
- source_word: אֶל אַרְצוֹ
  choice: para a sua terra
  rationale: אֶרֶץ aqui indica a terra de origem ou território de Jetro. “Sua terra” preserva o sentido possessivo sem introduzir a ideia moderna de Estado-nação.
