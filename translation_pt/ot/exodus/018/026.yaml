base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: pt
  text: E julgavam o povo a todo momento. Todo caso difícil eles levavam a Moisés[a], mas todo caso menor eles mesmos julgavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todo assunto difícil [...] todo assunto menor”. O hebraico contrasta, em contexto judicial, os casos difíceis com os menores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: E julgavam
  rationale: O imperfeito com waw, neste resumo narrativo, descreve a atividade contínua dos juízes; o pretérito imperfeito em português comunica bem essa ação habitual.
- source_word: אֶת הָעָם
  choice: o povo
  rationale: עם designa aqui a comunidade de Israel; “o povo” é a formulação natural e consistente em português.
- source_word: בְּכָל־עֵת
  choice: em todo tempo
  rationale: A expressão indica disponibilidade regular e contínua para julgar, preservada de modo claro e próximo do hebraico.
- source_word: אֶת־הַדָּבָר הַקָּשֶׁה
  choice: Todo assunto difícil
  rationale: דבר, no contexto judicial, pode indicar assunto ou caso; “assunto difícil” conserva a amplitude lexical e o contraste direto com “assunto pequeno”.
- source_word: יְבִיאוּן אֶל־מֹשֶׁה
  choice: eles o levavam a Moisés
  rationale: A forma verbal expressa uma prática repetida; o pretérito imperfeito transmite essa habitualidade. O pronome retoma o assunto difícil.
- source_word: וְכָל־הַדָּבָר הַקָּטֹן
  choice: mas todo assunto pequeno
  rationale: קטן contrasta com קשה e aponta para assuntos menores ou mais simples. “Pequeno” preserva de perto o contraste lexical, enquanto “mas” explicita em português a oposição contextual marcada pela estrutura hebraica.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: eles mesmos o julgavam
  rationale: O pronome independente הֵם é enfático; “eles mesmos” mantém a ênfase nos juízes subordinados, em contraste com Moisés.
