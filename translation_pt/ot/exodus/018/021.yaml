reference: Exodus 18:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: pt
  text: Mas escolha, dentre todo o povo, homens capazes[a], que temam a Deus, homens de confiança[b] que odeiem o lucro desonesto[c]. Coloque-os sobre o povo como chefes de mil, chefes de cem, chefes de cinquenta e chefes de dez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens valentes”. A expressão hebraica pode indicar força, competência ou valentia, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “homens de verdade”; isto é, homens verdadeiros, fiéis ou confiáveis.
    reason: lexical_alternative
  - marker: c
    text: Ou “o lucro injusto”; a expressão se refere à rejeição de ganhos obtidos de forma corrupta.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: escolha
  rationale: Embora o verbo esteja ligado à ideia de ver, neste contexto significa discernir e selecionar pessoas qualificadas.
- source_word: אַנְשֵׁי חַיִל
  choice: homens capazes
  rationale: חַיִל pode indicar força, valor ou competência; no contexto judicial e administrativo, destaca sobretudo a capacidade comprovada.
- source_word: יִרְאֵי אֱלֹהִים
  choice: que temam a Deus
  rationale: Expressa reverência a Deus como qualificação moral, preservando a formulação verbal do hebraico.
- source_word: אַנְשֵׁי אֱמֶת
  choice: homens de confiança
  rationale: A expressão literal é 'homens de verdade', mas aqui אֱמֶת abrange veracidade, fidelidade e confiabilidade; 'de confiança' comunica isso naturalmente em português.
- source_word: שֹׂנְאֵי בָצַע
  choice: que odeiem o lucro desonesto
  rationale: בֶּצַע designa lucro indevido, injusto ou corrupto; a escolha conserva tanto a força de 'odiar' quanto o caráter ilícito do ganho.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: Coloque-os sobre o povo
  rationale: Torna explícito o referente do segundo pronome hebraico e evita uma repetição pronominal pouco natural em português.
- source_word: שָׂרֵי
  choice: chefes de
  rationale: Preserva o caráter formal e administrativo do termo sem impor uma conotação exclusivamente militar.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: mil ... cem ... cinquenta ... dez
  rationale: Reproduz diretamente os níveis graduados de supervisão indicados pelo texto hebraico.
theological_decisions:
- issue: Linguagem marcada por gênero nas qualificações de liderança
  choice: homens capazes ... homens de confiança
  alternative: pessoas capazes ... pessoas de confiança
  rationale: O hebraico emprega expressões masculinas plurais. A tradução preserva esse dado textual sem inferir dele uma afirmação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura imperativa foi mantida, e referentes pronominais foram explicitados apenas onde necessário para a naturalidade.
