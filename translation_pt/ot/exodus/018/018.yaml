    rationale: O verbo hebraico é amplo («fazer»); «fazê-la» mantém essa amplitude e a ligação com a tarefa sem introduzir uma nuance de execução ou conclusão.
  revised_text: Você certamente se esgotará[a], tanto você como este povo que está com você, pois esta tarefa é pesada demais para você. Você não consegue fazê-la sozinho.
