base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: pt
  text: Você certamente se esgotará[a], tanto você como este povo que está com você, pois esta tarefa é pesada demais para você. Você não consegue fazê-la sozinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você certamente ficará exausto”. O hebraico repete o verbo para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: Sem dúvida, você ficará exausto
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a afirmação. Em português natural, “sem dúvida” preserva a ênfase e “ficará exausto” comunica o desgaste causado pela sobrecarga.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: tanto você como este povo
  rationale: A repetição de גַּם inclui enfaticamente as duas partes; “tanto... como...” reproduz essa correlação, enquanto “este povo” mantém o coletivo singular.
- source_word: אֲשֶׁר עִמָּךְ
  choice: que está com você
  rationale: A concordância no singular trata “povo” como substantivo coletivo, de modo natural em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão da advertência.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: esta tarefa é pesada demais para você
  rationale: “Pesada demais” conserva a metáfora de כָבֵד e o sentido comparativo de מִמְּךָ. No contexto do trabalho judicial de Moisés, “tarefa” expressa דָּבָר com clareza sem detalhar excessivamente.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: Você não é capaz de realizá-la
  rationale: Preserva a declaração explícita de incapacidade; “realizá-la” retoma naturalmente a tarefa em português.
- source_word: לְבַדֶּךָ
  choice: sozinho
  rationale: Expressa de forma direta e atual que Moisés não poderia cumprir a tarefa sem ajuda.
