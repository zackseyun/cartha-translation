source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: pt
  text: E o nome do outro era Eliézer[a], porque o Deus de meu pai foi o meu auxílio e me livrou da espada do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Eliézer significa “Meu Deus é auxílio” ou “Deus é meu auxílio”.
    reason: Explica o jogo de sentido entre o nome hebraico e a frase “o Deus de meu pai foi o meu auxílio”.
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: E o nome do outro
  rationale: Preserva a conjunção narrativa e traduz הָאֶחָד idiomaticamente como “o outro”, em contraste com o filho mencionado no versículo anterior.
- source_word: אֱלִיעֶזֶר
  choice: Eliézer
  rationale: Emprega a forma tradicional e reconhecível do nome em português; o sentido do nome, relacionado a Deus como auxílio, ecoa na explicação subsequente.
- source_word: כִּי
  choice: porque
  rationale: Introduz naturalmente em português a razão explicativa da atribuição do nome.
- source_word: אֱלֹהֵי אָבִי
  choice: o Deus de meu pai
  rationale: Mantém de perto a construção hebraica e sua referência ao Deus adorado pelo pai de Moisés.
- source_word: בְּעֶזְרִי
  choice: foi o meu auxílio
  rationale: Conserva a imagem nominal de עֵזֶר (“auxílio, ajuda”) e exprime o sentido retrospectivo adequado ao contexto.
- source_word: וַיַּצִּלֵנִי
  choice: e me livrou
  rationale: Traduz com clareza o ato de resgatar Moisés do perigo, em linguagem bíblica natural e atual.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: da espada do faraó
  rationale: Reproduz a construção hebraica e conserva a metáfora da espada como poder ou ameaça mortal de faraó.
theological_decisions:
- issue: Ausência de fórmula explícita de fala na explicação do nome
  choice: Não acrescentar “ele disse”
  alternative: Acrescentar “pois ele disse” e apresentar a explicação como fala direta de Moisés
  rationale: O hebraico passa diretamente do nome à explicação causal, sem verbo de fala. A tradução preserva essa estrutura e evita tornar explícita uma interpretação apenas implícita.
- issue: Referência de אֱלֹהֵי אָבִי
  choice: “o Deus de meu pai”
  alternative: “o Deus do meu pai” ou “o Deus dos meus antepassados”
  rationale: O singular “meu pai” é mantido sem ampliar a referência para os antepassados, preservando a formulação e a possível ressonância familiar do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Mantém a coordenação narrativa do hebraico, evita inserir uma fórmula de fala ausente no texto-fonte e usa “faraó” como título em minúscula.
