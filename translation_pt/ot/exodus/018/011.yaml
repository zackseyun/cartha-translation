  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: pt
  text: Agora sei que Yahweh é maior do que todos os deuses, pois, naquilo em que agiram com arrogância contra eles, ele se mostrou superior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da oração final é conciso e difícil. Mais literalmente: “pois, naquilo mesmo em que agiram com arrogância contra eles”. A construção parece elíptica; provavelmente se refere ao tratamento arrogante dado pelos egípcios aos israelitas.'
    reason: Registra a elipse sintática e a ambiguidade dos referentes sem acrescentar um acontecimento não expresso no hebraico.
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a conclusão presente de Jetro diante dos acontecimentos recentes; é a forma natural e direta em português.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: O perfeito hebraico expressa aqui um estado presente resultante do que Jetro acaba de presenciar ou ouvir; “sei” preserva esse resultado sem tornar a frase pesada.
- source_word: גָדוֹל ... מִכָּל
  choice: maior do que todos
  rationale: A preposição מִן com כָּל dá ao adjetivo sentido comparativo, expresso naturalmente em português por “maior do que todos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: הָאֱלֹהִים
  choice: os deuses
  rationale: O plural definido contrasta Yahweh com as divindades reconhecidas entre os povos; “deuses” é claro e adequado ao contexto.
- source_word: בַּדָּבָר אֲשֶׁר
  choice: naquilo em que
  rationale: Expressa de modo natural o sentido de “na questão/coisa em que”, sem especificar além do que o hebraico permite.
- source_word: זָדוּ
  choice: agiram com arrogância
  rationale: O verbo denota ação orgulhosa, insolente ou presunçosa; a formulação é atual e mantém a força moral do termo.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: A preposição עַל pode indicar ação hostil contra alguém; o pronome permanece sem antecedente explícito, como no hebraico, provavelmente remetendo aos israelitas.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino. A transliteração “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Sentido da oração final difícil כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶם
  choice: pois, naquilo em que agiram com arrogância contra eles, ele se mostrou superior
  alternative: pois isso aconteceu justamente naquilo em que agiram com arrogância contra eles
  rationale: A oração hebraica é comprimida e pode ser entendida como uma construção elíptica. O texto principal explicita com moderação a superioridade de Yahweh demonstrada no mesmo âmbito da arrogância dos opressores, enquanto a nota registra uma leitura menos interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “se mostrou superior” torna legível a provável elipse hebraica, mas a nota preserva uma alternativa mais formal e a ambiguidade genuína da oração final.
