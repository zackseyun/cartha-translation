  text: וְ/אֵ֖ת שְׁנֵ֣י בָנֶ֑י/הָ אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אֶחָד֙ גֵּֽרְשֹׁ֔ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: pt
  text: 'e seus dois filhos, dos quais um se chamava Gérson, pois ele disse: “Fui estrangeiro em terra estrangeira”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fui forasteiro em terra estrangeira”. O hebraico גֵּר pode designar um residente temporário, um forasteiro ou um estrangeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: e
  rationale: A conjunção dá continuidade à frase do versículo anterior, enquanto אֵת apenas marca o objeto direto retomado; em português, esse marcador não recebe tradução independente.
- source_word: שְׁנֵי בָנֶיהָ
  choice: seus dois filhos
  rationale: Preserva o número e a referência masculina do hebraico em formulação portuguesa natural.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: dos quais um se chamava
  rationale: Expressa de modo natural a construção hebraica literalmente equivalente a “dos quais o nome de um”, sem interpretar הָאֶחָד como “o primeiro”.
- source_word: גֵּרְשֹׁם
  choice: Gérson
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: כִּי אָמַר
  choice: pois ele havia dito
  rationale: Mantém a função explicativa de כִּי e, no contexto narrativo, explicita naturalmente que a declaração precedeu a situação relatada no presente contexto.
- source_word: גֵּר
  choice: estrangeiro
  rationale: Comunica em linguagem atual a condição de alguém que vive fora de sua própria terra, embora o termo também possa designar um residente temporário ou forasteiro.
- source_word: הָיִיתִי
  choice: fui
  rationale: O perfeito hebraico admite o passado simples, que soa natural na explicação retrospectiva do nome sem impor duração continuada.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: em terra estrangeira
  rationale: Reproduz de modo conciso e idiomático a correspondência lexical entre a condição de estrangeiro e uma terra alheia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A estrutura continua a oração do versículo anterior. Conserva-se a repetição etimológica e retórica entre “estrangeiro” e “terra estrangeira”, importante para a explicação do nome.
