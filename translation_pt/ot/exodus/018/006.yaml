base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: pt
  text: 'Ele disse a Moisés: “Eu, Jetro, seu sogro, estou indo até você, com sua esposa e os dois filhos dela, que estão com ela.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e os dois filhos dela com ela”. Algumas traduções vertem “seus dois filhos”, mas o Texto Massorético traz um sufixo possessivo feminino singular, que se refere à esposa de Moisés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele disse
  rationale: O wayyiqtol dá continuidade à narrativa; em português, a conjunção inicial pode ser omitida naturalmente sem perda de sentido.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: Uso direcional normal de אֶל diante do nome próprio.
- source_word: אֲנִי
  choice: Eu
  rationale: Mantém o pronome independente, expresso no hebraico com valor enfático.
- source_word: חֹתֶנְךָ יִתְרוֹ
  choice: Jetro, seu sogro
  rationale: Identifica Jetro e explicita sua relação familiar com Moisés em ordem natural no português.
- source_word: בָּא אֵלֶיךָ
  choice: estou indo até você
  rationale: O particípio indica deslocamento em curso ou iminente na direção de Moisés; como o movimento é descrito da perspectiva de Jetro, “indo até você” é natural em português.
- source_word: וְאִשְׁתְּךָ
  choice: com sua esposa
  rationale: O contexto apresenta a esposa como acompanhante de Jetro; “com” expressa claramente essa relação.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: e os dois filhos dela
  rationale: O sufixo é de terceira pessoa feminina singular e remete à esposa de Moisés; a tradução preserva essa leitura sem harmonizá-la para “seus dois filhos”.
- source_word: עִמָּהּ
  choice: com ela
  rationale: A frase hebraica explicita que os filhos estão acompanhando a mãe; a nota registra esse elemento, cuja repetição literal deixaria a frase principal pouco natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala mantém a ênfase do pronome “Eu”; a formulação evita uma repetição pouco natural no corpo do texto, enquanto a nota preserva a forma explícita do hebraico.
