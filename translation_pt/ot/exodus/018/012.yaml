  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: pt
  text: Então Jetro, sogro de Moisés, trouxe um holocausto e sacrifícios para Deus. Arão e todos os anciãos de Israel vieram comer pão[a] com o sogro de Moisés diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “comer pão”, expressão que também pode significar “participar de uma refeição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido direto de לקח, sem substituir pelo mais interpretativo «ofereceu»; o contexto sacrificial esclarece o que foi tomado.
- source_word: חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  rationale: Neste contexto narrativo, חֹתֵן designa naturalmente o pai da esposa de Moisés; «sogro» é claro e corrente em português.
- source_word: עֹלָה
  choice: um holocausto
  rationale: É o termo sacrificial tradicional e inteligível em português para a oferta inteiramente queimada, distinguindo-a dos sacrifícios mencionados em seguida.
- source_word: זְבָחִים
  choice: sacrifícios
  rationale: Preserva o sentido plural e mais amplo de זְבָחִים, em contraste com o holocausto específico.
- source_word: לֵאלֹהִים
  choice: para Deus
  rationale: A preposição ל indica aqui destinação ou dedicação; «para Deus» é natural e não explicita além do hebraico o ato ritual.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: Arão e todos os anciãos de Israel vieram
  rationale: Embora o verbo hebraico seja singular por preceder o sujeito composto, o plural é exigido pela sintaxe natural do português.
- source_word: לֶאֱכָל לֶחֶם
  choice: comer pão
  rationale: Conserva a expressão concreta do hebraico; uma nota informa que ela pode designar a participação numa refeição.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: com o sogro de Moisés
  rationale: Mantém a repetição da designação relacional presente no texto-fonte, em vez de substituí-la pelo nome Jetro.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  rationale: Equivalente conciso e solene de לִפְנֵי, que preserva a ideia de presença divina sem acrescentar uma explicação cultual.
theological_decisions:
- issue: Sentido da expressão da refeição no contexto sacrificial
  choice: Conservar «comer pão» no texto e indicar em nota seu possível sentido idiomático de participar de uma refeição.
  alternative: Traduzir diretamente «participar de uma refeição» ou entender a frase apenas como ingestão literal de pão.
  rationale: O contexto de sacrifícios, a presença de Arão e dos anciãos e a expressão «diante de Deus» sugerem uma refeição sagrada ligada aos sacrifícios, mas o texto não a denomina explicitamente refeição de aliança. A tradução preserva tanto a formulação hebraica quanto sua possível amplitude.
- issue: Referente de אֱלֹהִים
  choice: Deus
  alternative: deuses
  rationale: O contexto narrativo e o uso com referência singular identificam o Deus de Israel; «deuses» introduziria uma ambiguidade inadequada ao contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a repetição «sogro de Moisés» e a expressão concreta «comer pão», recorrendo à nota apenas para esclarecer o valor idiomático possível.
