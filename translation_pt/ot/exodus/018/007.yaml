base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: pt
  text: Moisés saiu ao encontro de seu sogro, curvou-se e o beijou. Então cada um perguntou ao outro como estava[a], e entraram na tenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “perguntaram um ao outro pela paz”. Nessa expressão hebraica, “paz” se refere ao bem-estar da pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: Com o verbo “sair”, a expressão indica ir receber alguém que chega, e não um encontro casual.
- source_word: חֹתְנוֹ
  choice: seu sogro
  rationale: No contexto de Êxodo 18, o termo designa especificamente Jetro, sogro de Moisés.
- source_word: וַיִּשְׁתַּחוּ
  choice: curvou-se
  rationale: Preserva o gesto físico de reverência e respeito sem interpretá-lo como adoração.
- source_word: וַיִּשַּׁק לוֹ
  choice: e o beijou
  rationale: Expressa de modo natural o beijo habitual de saudação indicado pelo hebraico.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: cada um perguntou ao outro como estava
  rationale: Reproduz a reciprocidade de אִישׁ לְרֵעֵהוּ e comunica naturalmente a expressão idiomática de perguntar pelo bem-estar de alguém.
- source_word: הָאֹהֱלָה
  choice: entraram na tenda
  rationale: A terminação direcional indica movimento para dentro da tenda; não se acrescenta “de Moisés”, pois isso não está explícito no hebraico.
theological_decisions:
- issue: Sentido do ato de Moisés curvar-se diante de Jetro
  choice: gesto de honra e respeito social
  alternative: ato de adoração
  rationale: Embora o verbo possa descrever adoração em outros contextos, aqui o destinatário humano e a sequência de saudação favorecem um gesto respeitoso. “Curvou-se” mantém o ato sem impor uma interpretação cultual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em âmbito internacional. A formulação evita linguagem excessivamente formal e conserva a reciprocidade e o caráter relacional da saudação.
