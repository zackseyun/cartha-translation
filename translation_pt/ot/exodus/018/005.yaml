revisions:
- from: Então Jetro, sogro de Moisés, foi até Moisés no deserto, onde ele estava acampado, junto ao monte de Deus[b], levando consigo os filhos e a mulher de Moisés[a].
  to: Então Jetro, sogro de Moisés, veio a Moisés, no deserto onde ele estava acampado, no monte de Deus[b], com seus filhos e sua mulher[a].
  rationale: A revisão preserva todos os elementos do hebraico, substitui “foi até” por “veio” e restaura no texto a ambiguidade dos sufixos possessivos. A nota a registra tanto a possibilidade gramatical quanto a leitura contextual mais provável, sem transformar essa inferência em explicitação no corpo do versículo.
