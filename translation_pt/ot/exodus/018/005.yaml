base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: pt
  text: Então Jetro, sogro de Moisés, veio a Moisés, no deserto onde ele estava acampado, no monte de Deus[b], com seus filhos e sua mulher[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus filhos e sua mulher”. Os pronomes podem ser entendidos como referência a Jetro ou a Moisés; o contexto de 18:2–4 favorece a referência à mulher e aos filhos de Moisés.'
    reason: lexical_alternative
  - marker: b
    text: “Monte de Deus” é uma designação associada ao Sinai/Horebe.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foi até
  rationale: A forma narrativa faz a história avançar. “Então” expressa a sequência com naturalidade, e “foi até” comunica o movimento em direção a Moisés.
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  rationale: Traduz de modo natural e preciso a relação familiar indicada pela construção hebraica.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: levando consigo os filhos e a mulher de Moisés
  rationale: As conjunções introduzem as pessoas que acompanhavam Jetro. O contexto imediato favorece fortemente que os sufixos se refiram a Moisés; “levando consigo” torna clara a ideia de acompanhamento em português.
- source_word: אֶל מֹשֶׁה אֶל הַמִּדְבָּר
  choice: até Moisés no deserto
  rationale: Mantém Moisés como destino do movimento e o deserto como o lugar em que ele se encontrava.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: onde ele estava acampado
  rationale: Expressa naturalmente a oração relativa; “ele” retoma Moisés no contexto.
- source_word: הַר הָאֱלֹהִים
  choice: monte de Deus
  rationale: Preserva a designação descritiva do hebraico sem substituí-la por Sinai ou Horebe.
theological_decisions:
- issue: Referente dos sufixos em “seus filhos” e “sua mulher”
  choice: Explicitar no texto que se trata dos filhos e da mulher de Moisés.
  alternative: Manter a formulação literalmente ambígua “seus filhos e sua mulher”, que poderia ser entendida como referência a Jetro.
  rationale: Êxodo 18:2–4 identifica a mulher e os dois filhos de Moisés como as pessoas que estavam com Jetro. A nota registra a ambiguidade gramatical dos sufixos, enquanto o texto principal evita uma leitura equivocada causada pela proximidade do nome Jetro em português.
- issue: Identificação do “monte de Deus”
  choice: Conservar a designação “monte de Deus”.
  alternative: Substituir por “monte Sinai” ou “Horebe”.
  rationale: O versículo usa a expressão descritiva הַר הָאֱלֹהִים, não um desses nomes próprios; mantê-la evita acrescentar uma identificação ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural. “Mulher” foi preferido a “esposa” por corresponder diretamente ao termo hebraico e permanecer claro no contexto conjugal. A ordem final mantém o local do acampamento ligado a Moisés e deixa explícito que Jetro levou consigo a família dele.
