  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: pt
  text: Jetro, sogro de Moisés, tomou consigo Zípora, mulher de Moisés, depois que ele a havia mandado embora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois que ela havia sido mandada embora”. O hebraico diz literalmente “depois do envio dela” e não explicita quem a mandou embora.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou consigo
  rationale: O verbo לקח significa normalmente “tomar”. “Tomou consigo” soa natural no contexto e mantém aberta a nuance de acolhê-la sob seus cuidados ou levá-la consigo.
- source_word: חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  rationale: חֹתֵן designa aqui o parentesco por casamento de Jetro com Moisés; “sogro de Moisés” é direto e natural em português.
- source_word: צִפֹּרָה
  choice: Zípora
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: mulher de Moisés
  rationale: A construção identifica Zípora como esposa de Moisés. “Mulher de Moisés” é corrente, clara e digna em português bíblico moderno.
- source_word: אַחַר
  choice: depois que
  rationale: Expressa naturalmente a relação temporal indicada por אַחַר ao introduzir uma ação anterior.
- source_word: שִׁלּוּחֶיהָ
  choice: ele a havia mandado embora
  rationale: O substantivo com sufixo feminino significa literalmente “o envio dela” ou “a dispensa dela”. O contexto favorece Moisés como agente implícito, mas o hebraico não o declara; a nota preserva essa ambiguidade.
theological_decisions:
- issue: Agente implícito em אַחַר שִׁלּוּחֶיהָ
  choice: “depois que ele a havia mandado embora”, entendendo Moisés como agente implícito
  alternative: “depois que ela havia sido mandada embora”
  rationale: A forma hebraica é nominal e não identifica explicitamente quem mandou Zípora embora. O contexto torna Moisés o agente mais provável, enquanto a alternativa passiva preserva mais diretamente a indeterminação do original; por isso ela é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tomou consigo” evita a possível estranheza de “tomou Zípora” sem restringir excessivamente a ação. A ambiguidade do agente em שִׁלּוּחֶיהָ é preservada por meio de nota.
