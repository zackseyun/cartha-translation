base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: pt
  text: 'Moisés disse ao sogro: “É porque o povo vem a mim para buscar a Deus[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consultar a Deus” ou “buscar uma decisão de Deus”. A expressão hebraica pode incluir a ideia de consultar Deus em busca de orientação ou julgamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” reproduz com naturalidade a introdução da resposta de Moisés sem acrescentar uma nuance ausente do verbo.
- source_word: לְחֹתְנוֹ
  choice: ao sogro
  rationale: Neste contexto, חֹתֵן designa Jetro como sogro de Moisés; “sogro” é a expressão portuguesa específica e idiomática.
- source_word: כִּי
  choice: É porque
  rationale: כִּי introduz a razão dada em resposta à pergunta anterior. “É porque” forma uma resposta completa e natural em português atual.
- source_word: יָבֹא אֵלַי הָעָם
  choice: o povo vem a mim
  rationale: בוא com אֶל indica movimento em direção a Moisés. O presente comunica o caráter habitual ou recorrente da ação no discurso explicativo.
- source_word: לִדְרֹשׁ
  choice: para buscar
  rationale: דרשׁ pode significar buscar, consultar ou indagar. “Buscar” conserva a amplitude do termo hebraico, enquanto a nota registra os sentidos mais específicos possíveis no contexto judicial.
- source_word: אֱלֹהִים
  choice: a Deus
  rationale: O objeto explícito é Deus. A tradução mantém esse referente, em vez de substituí-lo interpretativamente por “a vontade de Deus” ou “uma decisão divina”.
theological_decisions:
- issue: Sentido da expressão לִדְרֹשׁ אֱלֹהִים
  choice: buscar a Deus
  alternative: consultar a Deus; buscar uma decisão de Deus
  rationale: A expressão pode indicar tanto buscar a Deus em sentido amplo quanto consultá-lo para obter orientação ou julgamento. O texto principal preserva a formulação mais ampla, e a nota mantém as possibilidades mais específicas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “É porque” torna natural a resposta causal em discurso direto; “a mim” preserva a direção expressa no hebraico sem soar excessivamente coloquial.
