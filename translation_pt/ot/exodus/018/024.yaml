  text: Moisés ouviu a voz de seu sogro e fez tudo o que ele disse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deu ouvidos à voz de seu sogro” ou “obedeceu à voz de seu sogro”. A expressão hebraica pode indicar uma escuta que resulta em obediência, como a oração seguinte deixa explícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: Com לְקוֹל, o verbo שׁמע pode significar ouvir, dar ouvidos ou obedecer. “Ouviu” preserva a imagem auditiva do hebraico, enquanto a oração seguinte explicita que Moisés agiu de acordo com o que ouviu.
- source_word: לְקוֹל
  choice: a voz de
  rationale: קוֹל significa literalmente “voz”. A expressão “ouvir a voz de” mantém o colorido idiomático do texto hebraico e é compreensível em português.
- source_word: חֹתְנוֹ
  choice: seu sogro
  rationale: No contexto, refere-se a Jetro, sogro de Moisés; esta é a identificação clara e natural em português.
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: עשה é o verbo comum para “fazer”. A tradução direta combina naturalmente com a oração que funciona como seu complemento.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: tudo o que ele disse
  rationale: A oração relativa significa diretamente “tudo o que ele disse”, sem exigir que se acrescente objeto indireto ou nuance temporal.
