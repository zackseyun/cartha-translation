- from: 'Quando o sogro de Moisés viu tudo o que ele fazia pelo povo, perguntou: “O que é isso que você está fazendo pelo povo? Por que você fica sentado sozinho, enquanto todo o povo fica de pé diante de você, desde a manhã até a tarde?”[a]'
  to: 'Quando o sogro de Moisés viu tudo o que ele fazia pelo povo, perguntou: “O que é isso que você faz pelo povo? Por que você se senta sozinho, enquanto todo o povo fica de pé diante de você, desde a manhã até a tarde?”'
  rationale: A revisão remove uma nota lexicalmente imprecisa e faz um ajuste leve de estilo em “você se senta”, que comunica naturalmente a posição de Moisés sem acrescentar interpretação. O restante preserva o sentido, a progressão narrativa e o registro do hebraico.
