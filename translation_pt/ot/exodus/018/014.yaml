  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: pt
  text: 'Quando o sogro de Moisés viu tudo o que ele fazia pelo povo, perguntou: “O que é isso que você faz pelo povo? Por que você se senta sozinho, enquanto todo o povo fica de pé diante de você, desde a manhã até a tarde?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: o sogro de Moisés
  rationale: חֹתֵן designa aqui o parentesco por casamento e, no contexto, refere-se ao sogro de Moisés; esta é a formulação mais natural e precisa em português.
- source_word: וַיַּרְא
  choice: viu
  rationale: Mantém o sentido narrativo direto do verbo ראה, sem acrescentar a nuance interpretativa de 'observou'.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: tudo o que ele fazia
  rationale: O particípio indica uma atividade em andamento ou habitual naquele momento; o imperfeito português expressa isso naturalmente.
- source_word: לָעָם
  choice: pelo povo
  rationale: A preposição ל indica aqui atuação em benefício do povo; 'pelo povo' é natural em português e preserva esse valor.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: O que é isso
  rationale: דָּבָר pode significar 'coisa' ou 'questão'; nesta pergunta, a formulação idiomática 'O que é isso' comunica a censura sem tornar o português rígido.
- source_word: מַדּוּעַ אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: Por que você fica sentado sozinho
  rationale: ישב descreve tanto a postura quanto a atuação de Moisés em sessão; 'fica sentado' sugere a situação prolongada, e 'sozinho' preserva לְבַדֶּךָ.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: enquanto todo o povo fica de pé diante de você
  rationale: נצב é 'ficar de pé', e עַל, neste contexto de atendimento ou julgamento, indica comparecimento diante de uma autoridade, não posição física acima dela.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: desde a manhã até a tarde
  rationale: Reproduz o intervalo temporal completo do hebraico em linguagem portuguesa corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O discurso direto usa “você”, natural no português brasileiro contemporâneo, sem perda de respeito. A nota preserva a amplitude possível de עֶרֶב, que pode ser traduzido como “tarde” ou “noite” conforme o contexto.
