  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: pt
  text: Jetro, sacerdote de Midiã e sogro de Moisés, ouviu tudo o que Deus havia feito em favor de Moisés e de Israel, seu povo[a], e que Yahweh havia tirado Israel do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O pronome em “seu povo” também pode ser entendido gramaticalmente como referência a Moisés: “Israel, povo de Moisés”. No contexto, porém, é mais provável que se refira a Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O wayyiqtol dá continuidade à narrativa; o pretérito perfeito é natural em português, sem acrescentar um marcador temporal que não está explícito no hebraico.
- source_word: כֹהֵן מִדְיָן
  choice: sacerdote de Midiã
  rationale: A construção associa Jetro ao ofício sacerdotal em Midiã; a formulação é clara e tradicional.
- source_word: חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  rationale: Neste contexto, o termo designa especificamente a relação de Jetro com Moisés por meio do casamento com Zípora.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: tudo o que Deus havia feito
  rationale: Preserva a abrangência de כָּל אֲשֶׁר; o mais-que-perfeito composto expressa naturalmente a anterioridade das ações em relação ao momento em que Jetro ouviu.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: por Moisés e por Israel
  rationale: A preposição ל indica aqui ação em benefício de Moisés e Israel, bem expressa por “por”.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Mantém o pronome masculino singular do hebraico sem explicitar no texto principal se o referente é Deus ou Moisés.
- source_word: כִּי
  choice: isto é, que
  rationale: Neste contexto, כִּי introduz a explicação ou o conteúdo principal do que Jetro ouviu; a expressão portuguesa liga essa cláusula ao que Deus havia feito sem reduzi-la simplesmente a uma causa.
- source_word: הוֹצִיא
  choice: havia tirado
  rationale: O hifil de יצא significa fazer sair ou tirar; a forma verbal indica uma ação anterior ao ato de ouvir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Com “tirar”, esta é a maneira idiomática de exprimir em português o movimento para fora do Egito.
theological_decisions:
- issue: Referente do sufixo pronominal em עַמּוֹ
  choice: “seu povo” entendido mais provavelmente como o povo de Deus
  alternative: “seu povo” entendido como o povo de Moisés
  rationale: Deus é o antecedente contextual mais coerente, e a cláusula seguinte identifica Yahweh como aquele que tirou Israel do Egito. Contudo, a gramática permite relacionar o pronome a Moisés; por isso, o texto principal preserva “seu povo” e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A aposição identifica Jetro de modo fluente; a expressão “isto é, que” preserva a função explicativa de כִּי. O marcador da nota foi colocado junto à expressão ambígua a que se refere.
