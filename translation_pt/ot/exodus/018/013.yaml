base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/013.yaml
  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: pt
  text: No dia seguinte, Moisés sentou-se para julgar o povo, e o povo ficou em pé diante de Moisés[a], desde a manhã até a tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao redor de Moisés”. A preposição hebraica também pode indicar que o povo estava junto dele; no contexto, o sentido provável é que permanecia diante de Moisés, esperando que ele julgasse suas questões.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: No dia seguinte
  rationale: A fórmula narrativa introduz o acontecimento seguinte. Em português, a expressão temporal basta para marcar com naturalidade a progressão, sem a formulação pesada “e aconteceu que”.
- source_word: וַיֵּשֶׁב מֹשֶׁה
  choice: Moisés sentou-se
  rationale: Preserva a imagem concreta de Moisés assumindo uma posição sentada para exercer a função judicial.
- source_word: לִשְׁפֹּט אֶת הָעָם
  choice: para julgar o povo
  rationale: שפט designa aqui a resolução judicial das questões trazidas pelo povo; “julgar” é direto, natural e mantém a amplitude do termo hebraico.
- source_word: וַיַּעֲמֹד הָעָם
  choice: o povo ficou em pé
  rationale: A construção comunica que o povo permaneceu de pé enquanto aguardava; “ficou em pé” expressa melhor essa duração em português do que o simples “pôs-se em pé”.
- source_word: עַל מֹשֶׁה
  choice: diante de Moisés
  rationale: Embora עַל tenha sentidos espaciais como “sobre” ou “junto a”, com עמד neste contexto indica a posição de quem comparece perante alguém; a alternativa mais literal é preservada em nota.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: desde a manhã até a tarde
  rationale: Reproduz a extensão temporal de todo o período diário em português claro e corrente.
