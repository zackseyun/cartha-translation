  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: pt
  text: 'Então Jetro disse: “Bendito seja Yahweh,[a] que livrou vocês da mão dos egípcios e da mão do faraó, e que livrou o povo de sob a mão dos egípcios.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Bendito é Yahweh”. A fórmula hebraica de bênção pode ter força de aclamação ou de declaração.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “da mão dos egípcios” e “de sob a mão dos egípcios”; “mão” é uma imagem para poder, domínio ou controle opressivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à sequência narrativa; “Então” expressa esse avanço com naturalidade em português.
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico Yitrô.
- source_word: בָּרוּךְ יְהוָה
  choice: Bendito seja Yahweh
  rationale: Reproduz de modo natural a fórmula hebraica de louvor, mantendo sua possível força declarativa ou optativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הִצִּיל
  choice: livrou
  rationale: No contexto, o hifil de נצל indica libertar alguém do poder hostil; “livrou” é natural e conserva o peso do êxodo.
- source_word: אֶתְכֶם
  choice: vocês
  rationale: Representa claramente o pronome objeto masculino plural em português de ampla legibilidade.
- source_word: מִיַּד מִצְרַיִם
  choice: das mãos dos egípcios
  rationale: Mantém a metáfora hebraica da mão como poder ou domínio; o plural “mãos” concorda naturalmente com o referente coletivo em português.
- source_word: פַּרְעֹה
  choice: faraó
  rationale: Forma portuguesa padrão do título real egípcio.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente natural para Israel considerado coletivamente.
- source_word: מִתַּחַת יַד מִצְרָיִם
  choice: de debaixo das mãos dos egípcios
  rationale: Preserva a imagem intensificada de sujeição sob o domínio egípcio e a distingue da expressão anterior.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; “Jeová” é uma forma tradicional, mas menos próxima da vocalização geralmente reconstruída.
- issue: Força da fórmula בָּרוּךְ יְהוָה
  choice: Bendito seja Yahweh
  alternative: Bendito é Yahweh
  rationale: A fórmula hebraica admite em português uma leitura de aclamação ou declaração. A opção principal é idiomática e doxológica, enquanto a nota conserva a alternativa declarativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Mantém-se a metáfora concreta da “mão”, mas usa-se o plural por naturalidade sintática com “egípcios”. O nome tradicional português “Jetro” evita uma transliteração pouco familiar sem alterar a identificação da personagem.
