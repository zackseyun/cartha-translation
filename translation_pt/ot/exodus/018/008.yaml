  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: pt
  text: Moisés contou ao sogro tudo o que Yahweh tinha feito ao faraó e ao Egito por causa de Israel[a], todas as dificuldades que lhes sobrevieram pelo caminho[b] e como Yahweh os havia livrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em razão de Israel” ou “por consideração a Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “toda a aflição que os atingiu durante a jornada” ou “toda a adversidade que os atingiu durante a jornada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: contou
  rationale: No piel, ספר significa contar ou relatar. “Contou” é natural em português moderno e adequado ao contexto narrativo.
- source_word: חֹתְנוֹ
  choice: ao sogro
  rationale: No contexto, o termo se refere a Jetro, sogro de Moisés; essa é a identificação clara e natural em português.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: tudo o que Yahweh tinha feito ao faraó e ao Egito
  rationale: Mantém a construção hebraica com לְ sem explicitar “contra”, embora as ações narradas tenham caráter adversativo para o faraó e o Egito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: por causa de Israel
  rationale: Expressa de modo natural a relação causal ou referencial da locução hebraica, sem determinar além do texto se o foco recai exclusivamente no benefício de Israel.
- source_word: הַתְּלָאָה
  choice: as dificuldades
  rationale: O substantivo coletivo abrange aflição, fadiga e adversidade. O plural idiomático em português comunica naturalmente o conjunto das provações.
- source_word: מְצָאָתַם
  choice: lhes sobrevieram
  rationale: Reproduz em português natural a ideia hebraica de dificuldades que “encontraram” ou atingiram o povo.
- source_word: בַּדֶּרֶךְ
  choice: pelo caminho
  rationale: Expressão corrente que preserva tanto a ideia do percurso quanto a da jornada.
- source_word: וַיַּצִּלֵם
  choice: os havia livrado
  rationale: נצל indica livrar ou resgatar de perigo. “Livrado” conserva o registro bíblico digno sem impor uma leitura soteriológica posterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Sentido de עַל אֹדוֹת יִשְׂרָאֵל
  choice: por causa de Israel
  alternative: em favor de Israel
  rationale: “Por causa de Israel” preserva a amplitude causal da expressão. “Em favor de Israel” explicitaria o benefício, verdadeiro no contexto, mas de forma mais interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “sogro”, “pelo caminho” e “livrado” como formas naturais; mantém “Yahweh” como nome próprio. Os marcadores [a] e [b] aparecem no texto principal e correspondem às notas.
