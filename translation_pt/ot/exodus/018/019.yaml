base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: pt
  text: Agora, escute o que eu digo; vou aconselhá-lo, e que Deus esteja com você.[a] Seja você o representante do povo diante de Deus,[b] e leve as questões a Deus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Deus esteja com você”. A forma hebraica expressa um desejo ou uma bênção.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “Seja você pelo povo diante de Deus”.'
    reason: alternative_reading
  - marker: c
    text: Neste contexto, “questões” se refere aos casos ou às controvérsias do povo levados para decisão.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Funciona como marcador temporal e discursivo que introduz a orientação seguinte de Jetro.
- source_word: שְׁמַע בְּקֹלִי
  choice: escute o que eu digo
  rationale: Expressa naturalmente em português o idioma hebraico literalmente ligado a ouvir a voz, sem intensificá-lo para uma ordem explícita de obedecer.
- source_word: אִיעָצְךָ
  choice: vou aconselhá-lo
  rationale: Traduz diretamente a ação de dar conselho e se ajusta ao português corrente.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: e que Deus esteja com você
  rationale: Torna explícito o valor volitivo do jussivo hebraico, entendido como desejo ou bênção.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: Seja você o representante do povo diante de Deus
  rationale: Comunica de modo idiomático a função de Moisés em favor do povo perante Deus; a formulação mais literal é preservada em nota.
- source_word: וְהֵבֵאתָ
  choice: leve
  rationale: O perfeito com waw após a sequência injuntiva tem força de instrução; o imperativo português produz uma sequência clara e natural.
- source_word: הַדְּבָרִים
  choice: as questões
  rationale: Preserva a amplitude de דְּבָרִים e, no contexto judicial, aponta naturalmente para assuntos ou casos levados a decisão.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: Tradução direta e idiomática do destino ao qual Moisés deve levar as questões.
theological_decisions:
- issue: Sentido de אֱלֹהִים no contexto narrativo
  choice: Deus
  alternative: o verdadeiro Deus
  rationale: O termo se refere claramente ao Deus de Israel em sentido singular; a tradução simples evita uma expansão polêmica ausente do texto.
- issue: Grau de explicitação do papel mediador de Moisés
  choice: Seja você o representante do povo diante de Deus
  alternative: Seja você pelo povo diante de Deus
  rationale: A formulação principal explicita a função representativa indicada pela construção hebraica, enquanto a nota conserva sua forma mais literal sem impor uma doutrina posterior.
- issue: Força modal de וִיהִי
  choice: que Deus esteja com você
  alternative: e Deus estará com você
  rationale: A forma hebraica expressa mais naturalmente desejo ou bênção, embora a tradição de tradução também possa entendê-la como promessa ou resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para preservar a referência singular sem recorrer a formas regionais ou arcaizantes; usa construção idiomática no texto principal e notas breves para conservar alternativas e traços formais do hebraico.
