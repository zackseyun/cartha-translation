  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: pt
  text: 'O sogro de Moisés lhe disse: “Não é bom o que você está fazendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O waw consecutivo dá continuidade à narrativa; em português corrente, não é necessário explicitar repetidamente a conjunção “e”.
- source_word: חֹתֵן מֹשֶׁה
  choice: o sogro de Moisés
  rationale: Traduz de modo direto e natural a cadeia construta, preservando claramente a relação familiar.
- source_word: אֵלָיו
  choice: lhe
  rationale: O pronome retoma Moisés; “lhe disse” é uma forma natural e concisa de expressar que falou a ele.
- source_word: לֹא טוֹב
  choice: não é bom
  rationale: Preserva a avaliação ampla e direta de טוֹב sem restringi-la a “correto” ou “vantajoso”.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: o que você está fazendo
  rationale: Expressa naturalmente em português a construção hebraica “a coisa/o assunto que você está fazendo”, enquanto o gerúndio comunica a ação em curso indicada pelo particípio.
