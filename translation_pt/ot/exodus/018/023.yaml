base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: pt
  text: Se você fizer isso[a], e Deus assim lhe ordenar, poderá se manter de pé[b]; e todo este povo também chegará em paz ao seu lugar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizer esta coisa”, “tratar deste assunto” ou “executar este plano”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “poderá ficar de pé”. No contexto, a expressão pode significar conseguir aguentar ou permanecer firme.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “chegará ao seu lugar”. Como “povo” é um coletivo singular, a expressão também pode ter sentido distributivo: cada pessoa chegará em paz ao seu próprio lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição expressa no hebraico.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: isso
  rationale: Retoma de modo natural a proposta que Jetro acabou de apresentar; o sentido literal é “esta coisa” ou “este assunto”.
- source_word: תַּעֲשֶׂה
  choice: você fizer
  rationale: Traduz o verbo עשה de maneira simples e natural dentro da oração condicional.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: e Deus assim lhe ordenar
  rationale: Preserva a coordenação e apresenta a ordem de Deus como condição adicional, sem atribuir autoridade independente ao conselho de Jetro.
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: poderá suportar a carga
  rationale: יכל indica capacidade, e עמד significa literalmente “ficar de pé”; no contexto, a expressão descreve a capacidade de Moisés de aguentar o encargo. “A carga” explicita com naturalidade o referente contextual.
- source_word: וְגַם
  choice: e também
  rationale: Mantém a força aditiva do hebraico.
- source_word: כָּל־הָעָם הַזֶּה
  choice: todo este povo
  rationale: Preserva o substantivo coletivo singular e a ênfase demonstrativa do hebraico.
- source_word: עַל־מְקֹמוֹ
  choice: ao seu lugar
  rationale: Mantém o singular ligado ao coletivo “povo”, preservando a possibilidade de sentido coletivo ou distributivo.
- source_word: יָבֹא
  choice: chegará
  rationale: בוא pode indicar vir, ir ou chegar conforme a perspectiva; “chegará” evita impor uma direção e se combina naturalmente com o destino expresso.
- source_word: בְשָׁלוֹם
  choice: em paz
  rationale: Conserva a amplitude de שָׁלוֹם, que abrange paz, segurança e bem-estar.
theological_decisions:
- issue: Relação entre o conselho de Jetro e a ordem divina
  choice: 'A ordem de Deus é apresentada como condição adicional: “e Deus assim lhe ordenar”.'
  alternative: 'Entender a oração como “e Deus lhe ordenará” ou como um desejo: “e que Deus lhe ordene”.'
  rationale: No contexto da construção iniciada por אִם, a leitura condicional preserva a subordinação do conselho de Jetro à direção de Deus sem resolver além do necessário a forma verbal hebraica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o coletivo singular “todo este povo”, conserva a condição ligada à ordem divina e usa notas apenas onde a literalidade ou a ambiguidade lexical são relevantes.
