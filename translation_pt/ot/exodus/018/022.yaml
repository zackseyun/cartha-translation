base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: pt
  text: Que eles julguem o povo em todas as ocasiões. Toda questão importante eles a trarão a você, mas toda questão menor[a] eles mesmos julgarão. Assim, alivie a carga sobre você, e eles compartilharão essa carga com você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo caso de maior importância [...] todo caso de menor importância”. Em hebraico, as questões levadas a julgamento são chamadas literalmente de “grandes” e “pequenas”.'
    reason: lexical_alternative
  - marker: b
    text: A “carga” refere-se ao trabalho de julgar o povo. O hebraico emprega a imagem de aliviar o que está sobre Moisés e, na oração seguinte, não declara explicitamente o objeto de “carregar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Que eles julguem
  rationale: No contexto, a forma verbal integra a instrução de Jetro. A construção com «que» transmite naturalmente em português a força diretiva, sem reduzi-la a uma simples previsão futura.
- source_word: הָעָם
  choice: o povo
  rationale: Designa a comunidade israelita em geral; «povo» é mais direto e adequado do que «nação» neste contexto.
- source_word: בְּכָל עֵת
  choice: em todo tempo
  rationale: Mantém de perto a expressão temporal hebraica e indica disponibilidade regular para julgar, sem acrescentar a interpretação «sempre que necessário».
- source_word: כָּל הַדָּבָר הַגָּדֹל
  choice: toda questão importante
  rationale: דבר é aqui uma questão levada a julgamento. «Importante» comunica em português natural o valor contextual de «grande», preservado literalmente na nota.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: eles a trarão a você
  rationale: Expressa o sentido causativo de levar a questão até Moisés para que ele a julgue; o pronome retoma explicitamente «questão».
- source_word: כָּל הַדָּבָר הַקָּטֹן
  choice: toda questão menor
  rationale: Mantém o contraste com a questão importante. «Menor» é natural em contexto judicial e não sugere necessariamente que o assunto seja insignificante.
- source_word: יִשְׁפְּטוּ הֵם
  choice: eles mesmos julgarão
  rationale: O pronome hebraico explícito הֵם é enfático e contrasta esses juízes com Moisés; «eles mesmos» conserva essa ênfase.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: alivie o peso que está sobre você
  rationale: A forma é um imperativo no Hifil de קל, «tornar leve, aliviar». A tradução conserva a imagem de retirar de sobre Moisés o peso da tarefa.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: e eles o carregarão com você
  rationale: נשא significa «carregar, suportar». O pronome «o» retoma o peso explicitado pela frase anterior, embora o objeto permaneça implícito no hebraico.
