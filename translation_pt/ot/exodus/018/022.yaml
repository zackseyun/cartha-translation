translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a força imperativa de וְהָקֵל, a ênfase de הֵם e a metáfora do peso compartilhado, evitando juridicismo excessivo.
