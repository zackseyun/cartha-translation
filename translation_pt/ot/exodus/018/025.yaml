  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: pt
  text: 'Moisés escolheu homens capazes dentre todo o Israel e os constituiu chefes sobre o povo: chefes de mil, chefes de cem, chefes de cinquenta e chefes de dez.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: escolheu
  rationale: O verbo בחר significa diretamente escolher ou selecionar; “escolheu” conserva a simplicidade da sequência narrativa hebraica.
- source_word: אַנְשֵׁי חַיִל
  choice: homens capazes
  rationale: Neste contexto administrativo e judicial, חַיִל aponta para capacidade, competência e valor comprovado, não especificamente para bravura militar.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: dentre todo o Israel
  rationale: Expressa que a seleção foi feita no conjunto de Israel e soa natural em português.
- source_word: וַיִּתֵּן אֹתָם
  choice: os constituiu
  rationale: Embora נתן tenha o sentido básico de dar ou colocar, aqui indica designação para uma função; “constituiu” comunica essa nomeação com registro digno.
- source_word: רָאשִׁים עַל הָעָם
  choice: chefes sobre o povo
  rationale: “Chefes” transmite a metáfora de רָאשִׁים como pessoas investidas de autoridade, enquanto “sobre” preserva a relação expressa por עַל.
- source_word: שָׂרֵי
  choice: chefes de
  rationale: שַׂר designa uma autoridade ou dirigente. “Chefes de” é claro e evita sugerir, sem necessidade, uma estrutura exclusivamente militar.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: mil, cem, cinquenta e dez
  rationale: A tradução direta dos numerais preserva os níveis da organização descrita no hebraico; o singular distributivo é idiomático em português após “chefes de”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “chefes de” reproduz a estrutura enfática do hebraico sem impor caráter militar ao cargo.
