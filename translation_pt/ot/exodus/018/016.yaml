base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: pt
  text: Quando eles têm uma questão[a], ela vem a mim, e eu julgo entre um homem e o seu próximo[b] e dou-lhes a conhecer os estatutos de Deus e as suas leis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma causa”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “entre um homem e o seu próximo”, expressão singular representativa.'
    reason: cultural_note
  - marker: c
    text: Ou “as suas instruções”. O termo hebraico pode indicar instrução em sentido mais amplo, embora aqui apareça em contexto jurídico.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz a circunstância habitual que explica a prática de Moisés; “quando” expressa naturalmente o valor temporal-condicional no contexto.
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: eles têm uma questão
  rationale: דָּבָר é amplo, mas neste contexto judicial designa uma questão, disputa ou causa; “questão” conserva alguma amplitude sem perder o sentido jurídico.
- source_word: בָּא אֵלַי
  choice: ela é trazida a mim
  rationale: O verbo hebraico está no singular e pode retomar a questão mencionada. A forma passiva em português torna clara a chegada da questão a Moisés sem inserir como sujeito explícito as partes litigantes.
- source_word: וְשָׁפַטְתִּי
  choice: eu julgo
  rationale: שׁפט descreve aqui o exercício de decidir judicialmente; “julgo” é direto e preserva a formulação do hebraico.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: entre um homem e o seu próximo
  rationale: Mantém a expressão masculina singular representativa do hebraico e traduz רֵעַ por uma designação social adequada ao contexto jurídico.
- source_word: וְהוֹדַעְתִּי
  choice: lhes dou a conhecer
  rationale: Preserva o valor causativo do hifil de ידע e explicita naturalmente em português os destinatários implícitos.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: os estatutos de Deus
  rationale: חֹק designa prescrições ou determinações estabelecidas; “estatutos” conserva o caráter normativo e o registro formal.
- source_word: תּוֹרֹתָיו
  choice: as suas leis
  rationale: Embora תּוֹרָה possa significar instrução em sentido amplo, o paralelo com “estatutos” e o cenário judicial favorecem “leis”, sem eliminar a alternativa em nota.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ ... רֵעֵהוּ
  choice: um homem e o seu próximo
  alternative: uma pessoa e outra
  rationale: A tradução conserva as formas masculinas singulares do texto hebraico e sua expressão jurídica representativa, sem restringir explicitamente a aplicação apenas a homens.
- issue: Sentido de תּוֹרֹתָיו no contexto judicial
  choice: as suas leis
  alternative: as suas instruções
  rationale: O contexto de julgamento e o paralelismo com “estatutos” realçam a força normativa, embora o substantivo hebraico também possa designar instruções de modo mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o tom jurídico do contexto e preserva o singular representativo do hebraico.
