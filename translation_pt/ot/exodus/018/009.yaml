  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: pt
  text: Jetro se alegrou[a] por todo o bem que Yahweh havia feito por Israel, a quem havia livrado da mão do Egito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficou contente”. O verbo hebraico pode indicar contentamento ou alegria.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da mão do Egito”, uma expressão idiomática para o poder ou domínio do Egito.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: se alegrou
  rationale: O verbo expressa alegria diante da ação salvadora de Deus. “Alegrou-se” é natural, digno e mantém a intensidade positiva do hebraico; “ficou contente” também é possível.
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַל כָּל הַטּוֹבָה
  choice: por todo o bem
  rationale: Com verbo de emoção, עַל indica a causa ou ocasião da alegria. O singular coletivo הַטּוֹבָה é preservado por “todo o bem”.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ... havia feito
  rationale: O mais-que-perfeito composto deixa clara, em português corrente, a anterioridade da ação de Yahweh em relação à reação de Jetro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְיִשְׂרָאֵל
  choice: a Israel
  rationale: A preposição ל marca aqui o beneficiário da ação. “Fazer bem a Israel” é idiomático em português e mantém a relação expressa no hebraico.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: a quem havia livrado
  rationale: A oração relativa retoma naturalmente Israel como entidade coletiva; o pronome singular hebraico trata Israel como um povo unitário. A alternativa causal permanece possível e é registrada em nota.
- source_word: מִיַּד מִצְרָיִם
  choice: da mão do Egito
  rationale: Preserva a imagem hebraica da “mão” como poder ou domínio, deixando sua força idiomática explícita em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Referente e função de אֲשֶׁר הִצִּילוֹ
  choice: 'oração relativa que retoma Israel: “a quem havia livrado”'
  alternative: 'oração causal: “pois o havia livrado”'
  rationale: A leitura relativa liga naturalmente a declaração a Israel, concebido coletivamente no singular. Como אֲשֶׁר pode ser entendido em sentido explicativo ou causal no contexto, a alternativa é mantida em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se a imagem concreta “mão do Egito”, explicada em nota, e usa-se “Yahweh” para o nome divino.
