  yaml_path: translation/ot/exodus/039/009.yaml
  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: pt
  text: Era quadrado; fizeram o peitoral dobrado[a], com um palmo de comprimento e um palmo de largura, dobrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em camada dupla”. O hebraico כָּפוּל indica que o peitoral foi feito duplo ou dobrado sobre si mesmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: quadrado
  rationale: O adjetivo descreve uma forma de quatro lados iguais; “quadrado” é a equivalência natural e clara em português atual.
- source_word: הָיָה
  choice: era
  rationale: O verbo funciona aqui como cópula numa descrição de estado; “era” corresponde naturalmente ao hebraico.
- source_word: כָּפוּל
  choice: dobrado
  rationale: O termo indica uma peça duplicada em camadas ou dobrada sobre si mesma. “Dobrado” preserva essa possibilidade sem especificar que se tratava de uma bolsa.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: Tradução direta e corrente do verbo comum “fazer”.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: No contexto das vestes sacerdotais, o termo designa o peitoral do sumo sacerdote. A forma breve traduz somente o que aparece neste versículo.
- source_word: זֶרֶת
  choice: um palmo
  rationale: Mantém a antiga unidade linear de medida sem convertê-la para uma medida moderna aproximada.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: Em ligação com a medida, esta construção é mais natural em português do que “seu comprimento”, sem alterar a referência ao peitoral.
- source_word: רָחְבּוֹ
  choice: de largura
  rationale: Forma idiomática em português para indicar a dimensão transversal da peça.
- source_word: כָּפוּל
  choice: dobrado
  rationale: A repetição final conserva a ênfase e a ordem do hebraico, sem introduzir a nuance temporal interpretativa de “quando dobrado”.
theological_decisions: []
