  yaml_path: translation/ot/exodus/039/015.yaml
  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: pt
  text: E fizeram sobre o peitoral correntes trançadas[a], como cordões, de ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correntes de trabalho torcido” ou “correntes trabalhadas como cordões”. O hebraico descreve correntes feitas num padrão trançado ou semelhante a cordas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: E fizeram
  rationale: O verbo עשה, na forma narrativa, é vertido de modo direto e natural.
- source_word: עַל הַחֹשֶׁן
  choice: sobre o peitoral
  rationale: עַל conserva aqui a ideia espacial de algo colocado ou preso ao peitoral; חֹשֶׁן designa a peça sacerdotal usada sobre o peito.
- source_word: שַׁרְשְׁרֹת
  choice: correntes
  rationale: O substantivo plural denota correntes; esta é a forma corrente e clara em português.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: trançadas, como cordões
  rationale: A expressão descreve correntes trabalhadas em padrão torcido ou semelhante a cordas; a tradução preserva tanto a técnica quanto a aparência sem excessiva literalidade.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: Expressão natural em português para indicar o material e sua pureza.
