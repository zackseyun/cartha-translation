  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: pt
  text: o candelabro puro, suas lâmpadas — as lâmpadas dispostas em ordem[a] —, todos os seus utensílios e o azeite para a iluminação;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as lâmpadas da disposição”. A expressão hebraica נֵרֹת הַמַּעֲרָכָה ressalta o arranjo ordenado das lâmpadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: candelabro
  rationale: מְנוֹרָה designa o suporte que sustenta as lâmpadas, não apenas uma lâmpada. “Candelabro” é o termo corrente e inteligível em português para esse objeto do santuário.
- source_word: הַטְּהֹרָה
  choice: puro
  rationale: טָהוֹר qualifica aqui o objeto do santuário em termos de pureza ritual e material. A tradução mantém o adjetivo do hebraico sem acrescentar “de ouro”, que não aparece neste versículo.
- source_word: נֵרֹתֶיהָ
  choice: suas lâmpadas
  rationale: נֵר pode indicar uma lâmpada ou sua chama; neste inventário, refere-se às lâmpadas individuais pertencentes ao candelabro.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: as lâmpadas dispostas em ordem
  rationale: מַעֲרָכָה expressa disposição ou arranjo ordenado. A formulação comunica em português natural que as lâmpadas eram colocadas segundo uma ordem, sem especificar além do texto.
- source_word: כָּל כֵּלֶיהָ
  choice: todos os seus utensílios
  rationale: כְּלִי é um termo amplo para objetos, instrumentos ou recipientes. “Utensílios” preserva essa abrangência no contexto do mobiliário do santuário.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: o azeite para a iluminação
  rationale: A expressão em estado construto indica o azeite destinado a produzir luz. “Azeite para a iluminação” é claro e mantém a finalidade expressa no hebraico.
