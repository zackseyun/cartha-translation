  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: pt
  text: 'E as pedras correspondiam aos nomes dos filhos de Israel[a][b]: eram doze, conforme os nomes deles, gravadas à maneira de um sinete[c], cada uma segundo o seu nome, para as doze tribos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “traziam os nomes dos filhos de Israel”. A preposição hebraica pode indicar associação estreita ou correspondência.'
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Israel” é uma designação tradicional do povo descendente de Israel.
    reason: cultural_note
  - marker: c
    text: Literalmente, “gravações de sinete”; a expressão descreve inscrições entalhadas como as usadas em selos ou sinetes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: E as pedras
  rationale: Mantém o substantivo simples e definido do hebraico; o contexto já indica que se trata das pedras do peitoral, sem exigir a explicitação “pedras preciosas”.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: correspondiam aos nomes dos filhos de Israel
  rationale: עַל expressa aqui associação ou correspondência, não mera posição espacial. “Correspondiam aos nomes” é natural em português e preserva essa relação.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz de perto a designação pactual tradicional e o sentido masculino do hebraico, sem substituí-la pela forma mais interpretativa “israelitas”.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: eram doze
  rationale: Explicita com naturalidade a predicação do pronome e do numeral hebraicos e conserva a ênfase na quantidade.
- source_word: עַל שְׁמֹתָם
  choice: conforme os nomes deles
  rationale: Preserva a repetição da ideia de correspondência e deixa claro que as doze pedras se relacionavam aos doze nomes.
- source_word: פִּתּוּחֵי חֹתָם
  choice: gravadas à maneira de um sinete
  rationale: Comunica que a gravação era feita no estilo das inscrições entalhadas em selos ou sinetes, sem sugerir que as pedras fossem os próprios sinetes.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: cada uma segundo o seu nome
  rationale: אִישׁ tem força distributiva. O feminino “cada uma” retoma naturalmente cada pedra, enquanto “segundo o seu nome” conserva a construção relacional do hebraico.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: para as doze tribos
  rationale: A preposição ל marca a relação representativa das pedras com as tribos; “para” é conciso, claro e natural.
