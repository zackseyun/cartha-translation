  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
translation:
  language: pt
  text: o turbante de linho fino, os toucados ornamentados de linho fino e as roupas íntimas de linho, de linho fino retorcido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as roupas íntimas de linho fino retorcido”. A ordem das palavras em hebraico permite associar de modo especial a expressão final ao último item, embora ela também retome a descrição do material empregada nas vestes sacerdotais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: o turbante
  rationale: O termo designa a cobertura sacerdotal da cabeça, especialmente a do sumo sacerdote. “Turbante” é claro, preciso e consagrado neste contexto.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: O termo indica linho de qualidade fina, não apenas linho em sentido genérico, e reaparece na descrição das vestes sacerdotais.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: os gorros ornamentados
  rationale: A construção apresenta os gorros sacerdotais como belos ou ornamentais, não como gorros acompanhados de adornos separados. “Gorros ornamentados” preserva esse sentido em português natural.
- source_word: מִכְנְסֵי הַבָּד
  choice: as roupas de baixo de linho
  rationale: O termo se refere às peças sacerdotais que cobriam a parte inferior do corpo. “Roupas de baixo” é atual e compreensível, enquanto “calções” poderia sugerir uma forma moderna mais específica.
- source_word: מָשְׁזָר
  choice: retorcido
  rationale: Descreve fios torcidos ou entrelaçados na preparação do tecido. Junto de “linho fino”, “linho fino retorcido” comunica de modo conciso a técnica têxtil.
