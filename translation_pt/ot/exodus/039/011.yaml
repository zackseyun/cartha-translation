  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: pt
  text: 'e a segunda fileira: turquesa[a], safira e diamante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de várias pedras preciosas da Antiguidade é incerta. נֹפֶךְ também pode ser traduzido como “esmeralda” ou “carbúnculo”, e יָהֲלֹם, como “jacinto” ou “jaspe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: e a ... fileira
  rationale: No contexto das pedras do peitoral, טוּר designa uma fileira ou ordem de pedras; “fileira” é natural e clara em português, e וְ é representado por “e”.
- source_word: הַ/שֵּׁנִי
  choice: segunda
  rationale: O adjetivo ordinal significa “segunda” e concorda naturalmente com “fileira”.
- source_word: נֹפֶךְ
  choice: turquesa
  rationale: A identificação exata da pedra é incerta. “Turquesa” é um equivalente moderno plausível; outras identificações tradicionais são preservadas na nota.
- source_word: סַפִּיר
  choice: safira
  rationale: “Safira” é o equivalente português estabelecido, embora não se possa garantir identidade mineralógica exata com a pedra conhecida hoje.
- source_word: וְ/יָהֲלֹם
  choice: e diamante
  rationale: “Diamante” é uma tradução tradicional e corrente, mas a identificação da antiga pedra é incerta; alternativas são registradas na nota.
