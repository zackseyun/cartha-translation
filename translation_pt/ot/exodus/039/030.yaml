  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: pt
  text: 'Fizeram de ouro puro a lâmina, o diadema sagrado, e nela escreveram, como se grava um selo: “Santo para Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Santidade para Yahweh”.'
    reason: A expressão hebraica קֹדֶשׁ לַיהוָה pode ser entendida como uma declaração qualificativa ou como uma frase nominal abstrata.
lexical_decisions:
- source_word: צִיץ
  choice: lâmina
  rationale: No contexto das vestes sacerdotais, designa a peça de ouro fixada ao turbante; “lâmina” comunica naturalmente em português uma placa fina de metal.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: o diadema sagrado
  rationale: Preserva o segundo substantivo hebraico em aposição a “lâmina” e expressa o caráter consagrado da peça.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: Tradução portuguesa natural que mantém tanto o material quanto sua qualidade.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: e nela escreveram
  rationale: Mantém o sentido básico do verbo “escrever”; a frase seguinte esclarece que a escrita foi gravada como num selo.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: como se grava um selo
  rationale: Formulação idiomática que comunica a maneira da inscrição e o trabalho de gravação, sem fundir esse detalhe com o verbo anterior.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Santo para Yahweh
  rationale: Conserva a concisão formulaica da inscrição e seu sentido de consagração ou pertença, sem transformar o substantivo hebraico em explicação extensa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada.
- issue: Sentido da inscrição קֹדֶשׁ לַיהוָה
  choice: Santo para Yahweh
  alternative: Santidade para Yahweh
  rationale: A expressão nominal hebraica é tersa e admite tanto uma formulação qualificativa/dedicatória quanto a tradução abstrata “Santidade”. A leitura principal é mais natural em português moderno, e a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A aposição “a lâmina, o diadema sagrado” preserva a estrutura do hebraico; “nela” concorda naturalmente com “lâmina”. O marcador [a] aparece imediatamente após a inscrição à qual se refere.
