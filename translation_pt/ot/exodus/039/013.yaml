translation:
  language: pt
  text: 'e a quarta fileira: berilo[a], ônix e jaspe, engastados em engastes de ouro, nos seus encaixes.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de várias pedras preciosas do peitoral do sumo sacerdote é incerta; “berilo”, “ônix” e “jaspe” refletem equivalentes tradicionais comuns.
    reason: lexical_alternative
  - marker: b
    text: A expressão final hebraica é técnica e sua formulação exata é incerta; pode referir-se aos encaixes destinados a cada pedra ou à maneira como elas eram ajustadas nos engastes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: e a quarta fileira
  rationale: No contexto da lista de pedras do peitoral, טוּר designa uma fileira; a conjunção foi mantida.
- source_word: תַּרְשִׁישׁ
  choice: berilo
  rationale: A identificação mineralógica exata é incerta; “berilo” é um equivalente tradicional plausível e reconhecível.
- source_word: שֹׁהַם
  choice: ônix
  rationale: É o equivalente tradicional mais claro neste contexto sacerdotal, embora a identificação exata da pedra seja discutida.
- source_word: וְיָשְׁפֵה
  choice: e jaspe
  rationale: “Jaspe” corresponde bem ao termo hebraico e preserva explicitamente a conjunção.
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב בְּמִלֻּאֹתָם
  choice: engastados em seus encaixes de ouro
  rationale: A formulação comunica naturalmente que as pedras estavam fixadas em peças de ouro, preservando o sentido passivo e a referência técnica às colocações destinadas a elas, sem reproduzir em português uma redundância obscura.
