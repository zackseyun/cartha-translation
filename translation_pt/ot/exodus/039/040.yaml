base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: pt
  text: as cortinas do pátio[a], suas colunas e suas bases[b], e a cortina para a entrada do pátio, suas cordas[c] e suas estacas, e todos os utensílios para o serviço do tabernáculo, para a tenda do encontro;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «átrio».
    reason: lexical_alternative
  - marker: b
    text: Ou «encaixes».
    reason: lexical_alternative
  - marker: c
    text: Ou «cabos».
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: cortinas
  rationale: No contexto do tabernáculo, designa os painéis de tecido que cercavam o pátio; «cortinas» é claro e natural em português.
- source_word: חָצֵר
  choice: pátio
  rationale: Refere-se à área externa cercada ao redor do tabernáculo; «pátio» é corrente e adequado ao contexto.
- source_word: עַמֻּדֶיהָ
  choice: suas colunas
  rationale: Designa os suportes verticais da cerca de tecido; «colunas» mantém o estilo de inventário cultual.
- source_word: אֲדָנֶיהָ
  choice: suas bases
  rationale: São as peças de fundação nas quais se encaixavam as colunas; «bases» é claro, enquanto «encaixes» explicita uma alternativa mais técnica.
- source_word: הַמָּסָךְ
  choice: a cortina
  rationale: Indica a peça de tecido que fechava a entrada. O contexto distingue esta cortina das cortinas que formavam o perímetro.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: para a entrada do pátio
  rationale: Embora שַׁעַר possa ser «portão», aqui se trata de uma entrada fechada por uma cortina; «entrada» descreve naturalmente o referente sem sugerir uma porta rígida.
- source_word: מֵיתָרָיו
  choice: suas cordas
  rationale: Designa as linhas usadas para firmar a estrutura; «cordas» é a forma portuguesa comum e direta.
- source_word: וִיתֵדֹתֶיהָ
  choice: suas estacas
  rationale: Refere-se às peças cravadas no chão para prender as cordas; «estacas» é natural e preciso.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: todos os utensílios para o serviço
  rationale: כְּלִים é abrangente, indicando objetos ou instrumentos, e עֲבֹדָה denota aqui o serviço ligado ao santuário; «utensílios para o serviço» preserva o tom de inventário.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É a designação portuguesa tradicional e específica para a morada sagrada portátil.
- source_word: לְאֹהֶל מוֹעֵד
  choice: para a tenda do encontro
  rationale: Reproduz os dois elementos da designação hebraica e mantém a relação sintática final, cuja função exata pode ser entendida como destinação ou especificação.
theological_decisions:
- issue: Relação entre «tabernáculo» e «tenda do encontro»
  choice: Manter «para a tenda do encontro» como expressão final separada por vírgula
  alternative: Fundir as expressões como «do tabernáculo da tenda do encontro»
  rationale: A construção hebraica permite tensão sintática quanto à ligação da expressão final. A tradução mantém essa estrutura em vez de identificar ou fundir silenciosamente as duas designações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o formato de lista do contexto e o ponto e vírgula por se tratar de um item dentro de uma enumeração maior.
