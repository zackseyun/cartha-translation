revisions:
- from: 'A faixa habilmente tecida do seu éfode[a], que ficava sobre ele, formava uma só peça com ele e tinha o mesmo trabalho: ouro, fios azuis, púrpura, fios escarlates e linho fino retorcido, conforme Yahweh havia ordenado a Moisés.'
  to: 'A faixa artisticamente tecida de seu éfode[a], que estava sobre ele, era uma só peça com ele e da mesma feitura: de ouro, fios azuis, púrpura, fios escarlates e linho fino retorcido, conforme Yahweh havia ordenado a Moisés.'
  rationale: A revisão substitui uma expressão portuguesa ambígua por «da mesma feitura», que representa melhor a correspondência de manufatura indicada pelo hebraico. Também ajusta a formulação da nota para refletir a alternativa lexical com maior clareza e naturalidade, preservando a nuance de integração da faixa ao éfode.
