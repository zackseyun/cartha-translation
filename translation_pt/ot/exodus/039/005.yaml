base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: pt
  text: 'A faixa artisticamente tecida de seu éfode[a], que estava sobre ele, era uma só peça com ele e da mesma feitura: de ouro, fios azuis, púrpura, fios escarlates e linho fino retorcido, conforme Yahweh havia ordenado a Moisés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A faixa decorada de seu éfode, que estava sobre ele, era dele, da mesma feitura”. O hebraico enfatiza que a faixa era parte integrante do éfode e correspondia à sua feitura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: faixa habilmente tecida
  rationale: No contexto das vestes sacerdotais, designa a faixa tecida associada ao éfode; a tradução comunica tanto sua natureza têxtil quanto o trabalho artesanal.
- source_word: אֲפֻדָּתוֹ
  choice: seu éfode
  rationale: Preserva de modo natural o construto com sufixo possessivo masculino singular, referente à veste sacerdotal.
- source_word: אֲשֶׁר עָלָיו
  choice: que ficava sobre ele
  rationale: Reproduz a localização da faixa sobre o éfode sem tornar explícita uma forma de fixação que o hebraico apenas sugere pelo contexto.
- source_word: מִמֶּנּוּ הוּא
  choice: formava uma só peça com ele
  rationale: Expressa a continuidade estrutural entre a faixa e o éfode, em vez de uma simples indicação de origem.
- source_word: כְּמַעֲשֵׂהוּ
  choice: tinha o mesmo trabalho
  rationale: Mantém a referência à correspondência de feitura ou acabamento entre a faixa e o éfode.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente comum do material mencionado.
- source_word: תְּכֵלֶת
  choice: fios azuis
  rationale: O termo de cor ocorre numa lista de materiais têxteis; 'fios' torna claro esse sentido contextual sem pretender determinar com maior precisão a tonalidade antiga.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Tradução tradicional e amplamente compreensível do corante ou material de cor púrpura.
- source_word: תּוֹלַעַת שָׁנִי
  choice: fios escarlates
  rationale: Comunica a cor escarlate e explicita naturalmente o caráter têxtil do item na enumeração.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto a qualidade do linho quanto o modo de preparação dos fios.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: Mantém a fórmula de cumprimento e verte o nome divino diretamente; o mais-que-perfeito situa a ordem antes de sua execução narrada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o caráter de nome próprio e segue a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se o termo técnico tradicional “éfode”; a nota registra a formulação mais literal e a nuance lexical de חֵשֶׁב e מִמֶּנּוּ הוּא.
