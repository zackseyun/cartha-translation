  text: They made for it shoulder pieces[a], joined to it; at its two ends it was joined.
translation:
  language: pt
  text: Fizeram-lhe ombreiras, ligadas a ele; ele estava ligado nas suas duas extremidades.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: ombreiras
  rationale: O plural designa as partes construídas do éfode que repousavam sobre os ombros. «Ombreiras» é conciso, natural no contexto de uma veste e mantém a referência concreta aos ombros.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: O qal perfeito de עשה tem o sentido comum de fazer; «fizeram» traduz diretamente a ação de confecção.
- source_word: לוֹ
  choice: para ele
  rationale: O sufixo masculino singular retoma o éfode, substantivo masculino em português; «para ele» preserva naturalmente essa referência.
- source_word: חֹבְרֹת
  choice: que se uniam a ele
  rationale: A forma derivada de חבר descreve as ombreiras como ligadas ao éfode. A oração relativa produz sintaxe portuguesa clara e mantém a ideia de união.
- source_word: עַל שְׁנֵי קצוותו
  choice: nas suas duas extremidades
  rationale: A expressão indica os dois extremos do éfode. «Extremidades» é clara e evita sugerir especificamente bordas laterais.
- source_word: חֻבָּר
  choice: ele foi unido
  rationale: O pual perfeito expressa ação passiva. Repetir «unir» conserva a ligação lexical e a ênfase do hebraico.
