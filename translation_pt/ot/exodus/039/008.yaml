base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: pt
  text: Fez o peitoral[a], obra de artesão habilidoso[b], como o trabalho do éfode, com ouro, tecidos nas cores azul, púrpura e escarlate, e linho fino retorcido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peitoral” no sentido tradicional de “peitoral sacerdotal”; também se traduz por “peitoral”. O termo designa uma peça do vestuário sacerdotal usada sobre o peito, não uma placa de armadura.
    reason: lexical_alternative
  - marker: b
    text: Ou “obra de tecelão artístico”. A expressão hebraica enfatiza trabalho especializado com desenho ou padrões elaborados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa e, em português, pode ser traduzido naturalmente pelo pretérito perfeito sem explicitar a conjunção.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: חֹשֶׁן designa a peça sacerdotal usada sobre o peito e ligada ao éfode. “Peitoral” é claro e evita sugerir necessariamente uma armadura metálica.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: como obra de artesão habilidoso
  rationale: A expressão ressalta trabalho especializado, planejado e com padrões artísticos, não apenas fabricação genérica.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: à semelhança do éfode
  rationale: Preserva a comparação entre o modo de confecção do peitoral e o do éfode em português natural.
- source_word: אֵפֹד
  choice: éfode
  rationale: Termo técnico do vestuário sacerdotal sem equivalente português exato; a forma tradicional transliterada conserva sua especificidade.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do material mencionado.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: fios azuis, púrpura e escarlates
  rationale: Os termos designam materiais têxteis tingidos. A explicitação de “fios” torna a enumeração compreensível e se aplica coordenadamente às três cores.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: שֵׁשׁ indica linho fino, enquanto מָשְׁזָר descreve fios torcidos; a formulação conserva o detalhe têxtil com naturalidade.
