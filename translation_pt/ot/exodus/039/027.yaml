  language: en
  yaml_path: translation/ot/exodus/039/027.yaml
  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: pt
  text: Fizeram para Arão e para seus filhos as túnicas de linho fino, obra de tecelão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Fizeram
  rationale: O wayyiqtol de עשה dá sequência à narrativa. Em português, a forma verbal sem «e» inicial mantém o fluxo natural, e o sujeito plural fica implícito.
- source_word: הַכָּתְנֹת
  choice: as túnicas
  rationale: כָּתְנֹת designa vestes corporais do tipo túnica; «túnicas» é preciso, atual e adequado ao contexto sacerdotal.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: No contexto do tabernáculo e das vestes sacerdotais, שֵׁשׁ designa linho fino, preservando tanto o material quanto sua qualidade.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: obra de tecelão
  rationale: A expressão construta destaca o modo artesanal de produção por tecelagem. «Obra de tecelão» conserva essa ênfase e soa digna e compreensível.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: para Arão e para seus filhos
  rationale: A repetição de «para» representa a preposição לְ diante dos dois complementos e dá clareza à destinação das túnicas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário tradicional ainda corrente. A ordem foi ajustada para evitar a leitura momentânea de que «para Arão e para seus filhos» modificaria apenas «obra de tecelão».
