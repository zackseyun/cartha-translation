  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ טַבְּעֹ֣ת זָהָ֔ב וַ/יָּשִׂ֕ימוּ עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: pt
  text: Fizeram duas argolas de ouro e as colocaram nas duas extremidades do peitoral, na borda interna voltada para o éfode.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que dava para o éfode” ou “que ficava diante do éfode”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “para dentro” (literalmente, “em direção à casa”), indicando o lado do peitoral voltado para o éfode.
    reason: cultural_note
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: argolas de ouro
  rationale: טַבָּעַת designa uma argola usada aqui para prender partes das vestes sacerdotais. “Argolas de ouro” é claro e natural em português e preserva a indicação do material.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: No contexto das vestes sacerdotais, חֹשֶׁן designa a peça ornamental usada sobre o peito. “Peitoral” é tradicional e compreensível sem sugerir necessariamente uma peça de armadura.
- source_word: שְׂפָתוֹ
  choice: sua borda
  rationale: שָׂפָה significa literalmente “lábio” e, por extensão, “borda” ou “beirada”. Para uma peça confeccionada, “borda” é a forma idiomática mais clara.
- source_word: שְׁנֵי קְצוֹת
  choice: as duas extremidades
  rationale: קָצֶה indica uma ponta, extremidade ou limite. “Extremidades” mantém a referência espacial sem especificar indevidamente que se tratava de cantos.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: voltada para o éfode
  rationale: A expressão identifica a borda situada do lado do éfode ou orientada para ele. “Voltada para o éfode” comunica essa relação espacial, enquanto a nota preserva as alternativas possíveis.
- source_word: בָּיְתָה
  choice: interna
  rationale: A forma direcional de בַּיִת significa literalmente “para dentro” ou “em direção à casa/interior”. Neste contexto, indica o lado interior do peitoral, junto ao éfode.
- source_word: וַיָּשִׂימוּ עַל
  choice: e as colocaram em
  rationale: שׂוּם é um verbo comum para pôr ou colocar. A construção portuguesa com pronome retoma naturalmente as duas argolas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantiveram-se os termos cultuais “peitoral” e “éfode”; a ordem da frase foi levemente ajustada para fluidez sem eliminar a ambiguidade espacial do hebraico, registrada nas notas.
