    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: o altar de ouro
  rationale: מִזְבַּח significa “altar”, e הַזָּהָב é o substantivo “ouro” em função atributiva. “Altar de ouro” é natural em português e reflete de perto a construção hebraica.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: A construção indica o óleo empregado no ato ritual de ungir. “Óleo da unção” é claro, corrente e preserva a formulação nominal do hebraico.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: o incenso aromático
  rationale: קְטֹרֶת significa “incenso”, enquanto הַסַּמִּים designa especiarias ou substâncias aromáticas. “Incenso aromático” comunica o sentido de modo natural sem especificar indevidamente a composição.
- source_word: מָסַךְ
  choice: a cortina
  rationale: No contexto do santuário, מָסַךְ designa uma peça têxtil que fecha ou resguarda uma entrada. “Cortina” é mais imediatamente compreensível em português do que “tela” ou “anteparo”, sem confundi-la necessariamente com o véu interior.
- source_word: פֶּתַח הָאֹהֶל
  choice: para a entrada da tenda
  rationale: פֶּתַח é “entrada” ou “abertura”, e הָאֹהֶל é “a tenda”. A expressão escolhida reproduz com naturalidade a relação entre a cortina e a entrada.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: lista separada por vírgulas, com “e” antes do último item
  rationale: A repetição da conjunção e do marcador de objeto introduz os itens do inventário. Em português moderno, uma enumeração com “e” apenas antes do último elemento preserva o conteúdo e evita rigidez desnecessária.
