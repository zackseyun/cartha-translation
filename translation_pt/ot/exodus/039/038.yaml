translation:
  language: pt
  text: o altar de ouro[a], o óleo da unção, o incenso aromático[b] e a cortina para a entrada da tenda[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o altar dourado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o incenso de especiarias”.
