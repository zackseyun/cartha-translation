  yaml_path: translation/ot/exodus/039/035.yaml
  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: pt
  text: a arca do testemunho, suas varas e o propiciatório.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tampa da expiação”. O termo hebraico designa a cobertura da arca e tem associações com a expiação.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: arca
  rationale: É a designação consagrada e clara, em português, para o recipiente sagrado do tabernáculo.
- source_word: הָעֵדֻת
  choice: do testemunho
  rationale: Traduz diretamente o sentido de עֵדוּת e mantém a relação da arca com as tábuas que serviam de testemunho, sem substituí-lo pela interpretação mais ampla “da aliança”.
- source_word: בַּדָּיו
  choice: suas varas
  rationale: No contexto do tabernáculo, בַּדִּים são as varas usadas para transportar os objetos sagrados; “varas” é uma formulação corrente e reconhecível em português bíblico.
- source_word: הַכַּפֹּרֶת
  choice: o propiciatório
  rationale: “Propiciatório” é o termo tradicional em português para a cobertura de ouro da arca e preserva suas associações cultuais de expiação, embora sua forma física não seja explícita no vocábulo português.
theological_decisions:
- issue: Tradução de כַּפֹּרֶת como peça cultual sobre a arca
  choice: o propiciatório
  alternative: a tampa da expiação
  rationale: “Propiciatório” identifica de modo conciso a peça cultual e preserva sua ressonância teológica tradicional; a nota oferece uma alternativa que torna explícito que se trata da cobertura da arca, sem definir além do texto a mecânica da expiação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com terminologia bíblica reconhecível. O fragmento mantém a estrutura de item de uma lista, conforme o contexto de Êxodo 39.
