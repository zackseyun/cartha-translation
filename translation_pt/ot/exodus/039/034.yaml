  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: pt
  text: a cobertura de peles de carneiro tingidas de vermelho, a cobertura de couro fino[a] e o véu da cortina;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תְּחָשִׁים tem referente incerto. Pode indicar a pele de um animal específico, tradicionalmente identificada como pele de golfinho ou dugongo; também pode ser transliterado como «peles de táhas» ou entendido de modo mais geral como couro de boa qualidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: cobertura
  rationale: Mantém o sentido nominal de algo que cobre, sem especificar além do hebraico a forma ou a estrutura.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: peles de carneiro tingidas de vermelho
  rationale: 'Expressa tanto o material e o animal quanto o provável sentido causativo de הַמְאָדָּמִים: peles tornadas vermelhas por tingimento.'
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: couro fino
  rationale: O referente de תְּחָשִׁים é incerto. Esta opção evita identificar sem segurança uma espécie animal e oferece uma formulação clara, com a incerteza documentada em nota.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: véu de separação
  rationale: פָּרֹכֶת designa o véu interno, e מָסָךְ ressalta sua função de anteparo ou divisória. A expressão portuguesa comunica a função cultual sem a combinação pouco natural «véu da cortina».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura de inventário preservada. O marcador da nota foi colocado após «couro fino», pois a incerteza lexical pertence a תְּחָשִׁים, e não às peles de carneiro tingidas de vermelho.
