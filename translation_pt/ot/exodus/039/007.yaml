base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: E colocou-as sobre as ombreiras do colete sacerdotal, como pedras de memorial[a] para os filhos de Israel[b], conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pedras de recordação”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “filhos de Israel” refere-se coletivamente ao povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: E colocou-as
  rationale: שׂוּם significa pôr, colocar ou assentar; “colocou” é natural no contexto da confecção da veste. O pronome feminino plural retoma as duas pedras mencionadas no versículo anterior.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: sobre as ombreiras do colete sacerdotal
  rationale: כִּתְפֹת designa as partes da veste apoiadas nos ombros; “ombreiras” é conciso e preciso. אֵפוֹד é vertido funcionalmente como “colete sacerdotal”, expressão compreensível em português moderno.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: como pedras memoriais
  rationale: A construção expressa pedras destinadas à memória ou recordação; “pedras memoriais” preserva essa função com linguagem natural e digna.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pelos filhos de Israel
  rationale: Mantém de modo transparente a expressão hebraica fixa בְּנֵי יִשְׂרָאֵל. A preposição pode indicar referência ou representação; “pelos” comunica que as pedras serviam de memorial em favor ou em representação deles.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: “Conforme” exprime adequadamente a conformidade introduzida por כַּאֲשֶׁר. “Havia ordenado” situa naturalmente a ordem antes de sua execução, e o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A tradução mantém a forma masculina da expressão hebraica tradicional, enquanto a nota esclarece que ela designa coletivamente o povo de Israel.
- issue: Relação expressa por לִ em לִבְנֵי יִשְׂרָאֵל
  choice: pelos filhos de Israel
  alternative: para os filhos de Israel; dos filhos de Israel
  rationale: A preposição admite nuances de benefício, referência e representação. “Pelos” se ajusta ao papel memorial das pedras sem eliminar completamente essa amplitude.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. “Ombreiras” evita uma descrição excessivamente longa, e “colete sacerdotal” torna a peça compreensível sem depender apenas da transliteração técnica “éfode”.
