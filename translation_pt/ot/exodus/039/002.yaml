base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/002.yaml
  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: pt
  text: Ele fez o éfode de ouro, tecido azul, púrpura, tecido escarlate[a] e linho fino retorcido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fio escarlate”. A expressão hebraica se refere a material tingido de escarlate; aqui, “tecido escarlate” reflete o contexto têxtil sem definir se era tecido ou fio.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “linho fino torcido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol de עשה dá sequência à narrativa com uma ação passada; em português, o pretérito perfeito preserva essa progressão sem exigir uma conjunção inicial.
- source_word: הָאֵפֹד
  choice: o éfode
  rationale: É o termo técnico consagrado para a peça sacerdotal específica, preferível a uma paráfrase que determinaria indevidamente seu formato.
- source_word: זָהָב
  choice: ouro
  rationale: O versículo nomeia diretamente o material; embora o contexto explique que o ouro foi trabalhado em fios, essa informação não é explicitada aqui.
- source_word: תְּכֵלֶת
  choice: tecido azul
  rationale: O termo designa material têxtil tingido de azul; 'tecido' torna natural em português a enumeração de materiais sem especificar além do contexto.
- source_word: וְאַרְגָּמָן
  choice: púrpura
  rationale: Termo corrente para o material ou cor púrpura empregado nos tecidos do santuário; a formulação mantém a concisão do hebraico.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: tecido escarlate
  rationale: A expressão indica material tingido de escarlate. 'Tecido' comunica o contexto têxtil sem restringi-lo necessariamente a fio.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: e linho fino retorcido
  rationale: שֵׁשׁ é linho fino e מָשְׁזָר o descreve como retorcido; a expressão preserva ambos os elementos em português claro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém 'éfode' como termo sacerdotal estabelecido e evita acrescentar 'fio de ouro', detalhe explicitado apenas no contexto seguinte.
