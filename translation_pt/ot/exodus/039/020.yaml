review_pass:
  verdict: revise
  source_fidelity: A tradução capta a ação e os principais componentes da veste, mas «as prenderam» é mais específico que o hebraico, que diz simplesmente que as argolas foram postas/colocadas. Além disso, לְעֻמַּת indica posição correspondente ou oposta, não mera proximidade; «junto ao» enfraquece essa relação espacial. «Éfode» preserva adequadamente o nome técnico da veste, sem a identificação funcional excessivamente precisa de «colete sacerdotal».
  naturalness: A redação revista permanece clara e fluente em português moderno. «Na parte da frente, em frente ao seu ponto de união» explicita com naturalidade a sequência de referências espaciais do hebraico.
  terminology: «Argolas», «ombreiras», «éfode» e «faixa tecida» são escolhas adequadas. «Éfode» é preferível a «colete sacerdotal», pois o original designa uma peça cultual técnica cuja forma exata não é indicada por um equivalente moderno.
  issues:
  - severity: medium
    issue: «as prenderam» traduz וַיִּתְּנֻם de maneira excessivamente específica.
    rationale: O verbo significa «puseram/colocaram»; embora as argolas tenham função de fixação no contexto, o verbo não afirma o modo de fixação.
  - severity: medium
    issue: «junto ao ponto de união» não preserva a relação de alinhamento/oposição em לְעֻמַּת.
    rationale: A expressão hebraica localiza as argolas em correspondência ou em frente ao ponto de união, e não apenas perto dele.
  - severity: low
    issue: «colete sacerdotal» interpreta o éfode como uma peça moderna determinada.
    rationale: «Éfode» conserva o termo técnico e evita sugerir uma equivalência de forma que o hebraico não define.
  revised_text: Fizeram duas argolas de ouro e as colocaram nas duas ombreiras do éfode, na parte de baixo, na parte da frente, em frente ao seu ponto de união, acima da faixa tecida do éfode.
