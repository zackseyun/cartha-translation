revisions:
- from: Fizeram duas argolas de ouro e as prenderam às duas ombreiras do colete sacerdotal, na parte de baixo, na frente, junto ao ponto de união, acima da faixa tecida do colete sacerdotal.
  to: Fizeram duas argolas de ouro e as colocaram nas duas ombreiras do éfode, na parte de baixo, na parte da frente, em frente ao seu ponto de união, acima da faixa tecida do éfode.
  rationale: A revisão substitui o verbo de fixação por «colocaram», restabelece a relação espacial expressa por לְעֻמַּת com «em frente a» e preserva o nome técnico «éfode». Não acrescenta interpretações sobre a construção precisa da veste.
  reviewer_model: gpt-5.6-terra
