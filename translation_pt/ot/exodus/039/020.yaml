  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: pt
  text: Fizeram duas argolas de ouro e as colocaram nas duas ombreiras do éfode, na parte de baixo, na parte da frente, em frente ao seu ponto de união, acima da faixa tecida do éfode.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: argolas
  rationale: Designa argolas metálicas usadas como pontos de fixação; «argolas» é natural e preciso em português.
- source_word: כִתְפֹת
  choice: ombreiras
  rationale: No contexto, refere-se às partes da veste que ficam sobre os ombros, não aos ombros anatômicos.
- source_word: אֵפֹד
  choice: colete sacerdotal
  rationale: O termo técnico hebraico designa uma peça própria da vestimenta sacerdotal. A tradução funcional torna o objeto compreensível sem identificá-lo com uma peça moderna exata.
- source_word: מִלְמַטָּה
  choice: na parte de baixo
  rationale: Expressa claramente a posição inferior indicada pelo hebraico.
- source_word: מִמּוּל פָּנָיו
  choice: na frente
  rationale: Reproduz de forma idiomática a orientação espacial, literalmente relacionada à face ou parte frontal do objeto.
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: junto ao ponto de união
  rationale: A expressão indica correspondência ou alinhamento espacial com o lugar em que as partes da veste se unem; esta formulação evita sugerir necessariamente uma costura.
- source_word: חֵשֶׁב
  choice: faixa tecida
  rationale: Designa a faixa integrada ao colete e usada para ajustá-lo; «tecida» mantém o caráter têxtil sem acrescentar ao vocábulo uma qualificação artística não explícita neste verso.
- source_word: וַיִּתְּנֻם
  choice: as prenderam
  rationale: No contexto de argolas aplicadas a uma veste, «prenderam» comunica naturalmente a colocação com função de fixação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Preferiu-se «colete sacerdotal» à transliteração «éfode» para tornar inteligível a função geral da peça, sem equipará-la precisamente a uma veste moderna. A sequência espacial do hebraico foi preservada de modo legível.
