  text: וְֽ/אֶת הָ/אַבְנֵ֞ט שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י מַעֲשֵׂ֣ה רֹקֵ֑ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: e o cinto[a] de linho fino retorcido, com fios de cor azul, púrpura e escarlate[b], trabalho de bordador, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faixa” ou “faixa da cintura”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico se refere a material tingido de escarlate; “carmesim” é outra tradução possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: o cinto
  rationale: אַבְנֵט designa a faixa ou cinto usado com as vestes sacerdotais. “Cinto” é claro e corrente em português; a nota preserva a alternativa “faixa”.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: שֵׁשׁ indica linho fino, e מָשְׁזָר descreve os fios como retorcidos; a expressão conserva tanto o material quanto o modo de preparo.
- source_word: תְכֵלֶת
  choice: fios de cor azul
  rationale: O termo designa material têxtil tingido de azul. “Fios” é explicitado pelo contexto da confecção e rege naturalmente a série de cores.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: É a tradução convencional e inteligível para o valioso corante ou material têxtil púrpura empregado no santuário.
- source_word: תוֹלַעַת שָׁנִי
  choice: escarlate
  rationale: A expressão se refere a material tingido de escarlate. A formulação concisa integra-se à série de cores, enquanto a nota registra a alternativa “carmesim”.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: trabalho de bordador
  rationale: A expressão descreve trabalho têxtil decorativo especializado e mantém em destaque o artesão, como no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino יהוה é transliterado, em vez de ser substituído por um título, preservando seu caráter de nome pessoal.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: A fórmula ressalta a correspondência entre a execução e a ordem divina; o mais-que-perfeito composto soa natural no resumo narrativo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título, e evita adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial “e” foi mantida porque o versículo continua a enumeração anterior. O marcador [b] foi colocado junto de “escarlate”, termo ao qual a nota efetivamente se refere.
