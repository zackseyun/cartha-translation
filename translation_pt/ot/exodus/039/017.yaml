translation:
  language: pt
  text: E puseram os dois cordões de ouro nas duas argolas, nas extremidades do peitoral[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as duas correntes de ouro”. O termo hebraico pode indicar cordões torcidos ou filamentos semelhantes a correntes; aqui, os objetos eram de ouro e estavam presos ao peitoral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: E puseram
  rationale: O verbo נתן, nesta construção, significa pôr ou colocar algo sobre outra coisa. “Puseram” é natural e preserva a sequência narrativa.
- source_word: שְׁתֵּי הָעֲבֹתֹת הַזָּהָב
  choice: os dois cordões de ouro
  rationale: עֲבֹתֹת pode designar cordões torcidos ou peças semelhantes a correntes. “Cordões de ouro” preserva a imagem básica e expressa claramente o material.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: nas duas argolas
  rationale: A preposição עַל indica a colocação ou fixação nos anéis; em português, “nas duas argolas” é idiomático neste contexto. טַבָּעוֹת é traduzido por “argolas”, termo corrente nas descrições do tabernáculo.
- source_word: עַל קְצוֹת
  choice: nas extremidades
  rationale: קְצוֹת indica os pontos extremos ou as pontas. “Extremidades” é claro e adequado à localização das argolas.
- source_word: הַחֹשֶׁן
  choice: do peitoral
  rationale: חֹשֶׁן designa aqui a peça sacerdotal usada sobre o peito. “Peitoral” é a tradução portuguesa corrente e concisa.
