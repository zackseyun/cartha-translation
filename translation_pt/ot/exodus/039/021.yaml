  to: Prenderam o peitoral, por meio de suas argolas, às argolas do éfode com um cordão azul[a], para que ficasse sobre a faixa habilmente tecida[b] do éfode e não se soltasse do éfode, conforme Yahweh havia ordenado a Moisés.
