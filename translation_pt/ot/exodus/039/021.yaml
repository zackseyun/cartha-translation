  source_fidelity: 'A tradução representa adequadamente os elementos centrais do hebraico: a fixação do peitoral pelas suas argolas às argolas do éfode, o cordão azul, a posição sobre a faixa do éfode, a prevenção de que o peitoral se desprendesse e a fórmula conclusiva referente à ordem de Yahweh a Moisés. A locução «de cima do éfode», embora procure refletir מֵעַל, é desnecessariamente literal e pouco idiomática em português; «do éfode» preserva neste contexto o sentido de separação da peça à qual estava presa.'
