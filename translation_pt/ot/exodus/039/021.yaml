  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Prenderam o peitoral, por meio de suas argolas, às argolas do éfode com um cordão azul[a], para que ficasse sobre a faixa habilmente tecida[b] do éfode e não se soltasse do éfode, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um fio azul”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “cinturão tecido”; o termo hebraico designa a faixa trabalhada que fazia parte do éfode.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: Prenderam
  rationale: Expressa de modo natural o ato de fixar firmemente as partes da veste; é mais abrangente que “amarraram”.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: Termo consagrado e compreensível para a peça ornamental usada sobre o peito do sumo sacerdote, sem necessariamente sugerir uma armadura.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: pelas suas argolas, às argolas do éfode
  rationale: Comunica tanto o meio da fixação quanto sua direção, em sintaxe natural portuguesa.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: com um cordão azul
  rationale: “Cordão” condiz com a função de prender, e “azul” traduz de maneira clara o termo de cor; “fio” permanece como alternativa possível.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: a faixa habilmente tecida do éfode
  rationale: Representa a faixa decorada e tecida que fazia parte do éfode, evitando restringir excessivamente o termo a um cinto moderno.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  choice: e não se soltasse de cima do éfode
  rationale: “Se soltasse” exprime a separação ou o deslocamento impedido pela fixação, enquanto “de cima” preserva a nuance espacial de מֵעַל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Função de חֵשֶׁב na veste sacerdotal
  choice: faixa habilmente tecida
  alternative: cinturão; cós tecido
  rationale: A tradução mantém o caráter técnico e decorativo da peça sem decidir de modo excessivamente específico sua forma exata ou importar simbolismo teológico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. Mantêm-se “éfode” como termo técnico bíblico e “Yahweh” como nome próprio. A repetição de “éfode” acompanha a precisão espacial do hebraico.
