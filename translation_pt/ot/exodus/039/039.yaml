  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
translation:
  language: pt
  text: o altar de bronze e a grade de bronze que lhe pertencia, suas varas e todos os seus utensílios; a bacia e seu suporte;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: altar de bronze
  rationale: מִזְבַּח significa “altar”; embora o contexto indique o altar dos holocaustos, o texto hebraico emprega aqui apenas a forma breve. נְחֹשֶׁת pode designar cobre ou bronze, e “bronze” é a designação corrente neste contexto.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: grade de bronze
  rationale: מִכְבָּר designa a estrutura reticulada associada ao altar. “Grade” é claro, concreto e natural em português.
- source_word: אֲשֶׁר לוֹ
  choice: que lhe pertencia
  rationale: A expressão relaciona a grade ao altar sem determinar mais precisamente sua localização; “lhe pertencia” preserva essa associação.
- source_word: בַּדָּיו
  choice: suas varas
  rationale: בַּדִּים são as varas usadas para transportar os objetos do santuário. “Varas” é a forma bíblica tradicional ainda compreensível e natural em português.
- source_word: כָּל־כֵּלָיו
  choice: todos os seus utensílios
  rationale: כֵּלִים é um termo amplo para objetos, instrumentos ou equipamentos; no contexto do altar, “utensílios” é preciso e idiomático.
- source_word: כִּיֹּר
  choice: bacia
  rationale: כִּיּוֹר designa o recipiente usado para lavagem. “Bacia” é moderno e acessível, ao contrário do tradicional “lavatório”, que pode sugerir uma instalação contemporânea.
- source_word: כַּנּוֹ
  choice: seu suporte
  rationale: כֵּן designa a base ou estrutura que sustenta a bacia. “Suporte” comunica claramente essa função sem especificar uma forma não indicada pelo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação e o ponto e vírgula preservam o caráter de inventário do contexto. Não se acrescentou “dos holocaustos”, pois a forma plena não aparece neste versículo.
