  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: pt
  text: Fizeram dois engastes de ouro[a] e duas argolas de ouro, e colocaram as duas argolas nas duas extremidades do peitoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “molduras”, “suportes” ou “engastes de filigrana”; o termo hebraico designa um tipo de trabalho em ouro cuja forma exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Fizeram
  rationale: O wayyiqtol de עשה dá sequência à narrativa; em português, a conjunção pode ser omitida sem perda do sentido sequencial.
- source_word: מִשְׁבְּצֹת
  choice: molduras
  rationale: O termo designa peças de ourivesaria que servem como engastes, suportes ou molduras; “molduras” é compreensível e evita especificar uma técnica incerta.
- source_word: זָהָב
  choice: de ouro
  rationale: Mantém o material e sua repetição nas duas expressões, em estrutura natural em português.
- source_word: טַבְּעֹת
  choice: argolas
  rationale: No contexto da confecção do vestuário sacerdotal, refere-se a argolas usadas como pontos de fixação.
- source_word: וַיִּתְּנוּ
  choice: prenderam
  rationale: נתן significa literalmente pôr ou colocar; neste contexto construtivo, “prenderam” expressa naturalmente a colocação funcional das argolas, sem alterar o referente.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: nas duas extremidades
  rationale: Representa a colocação sobre ou junto às duas pontas do objeto em português idiomático.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: Designação clara e tradicional da peça usada pelo sumo sacerdote, sem acrescentar aqui a qualificação “do julgamento”.
