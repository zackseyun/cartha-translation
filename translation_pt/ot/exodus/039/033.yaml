base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: pt
  text: 'Então levaram o tabernáculo a Moisés: a tenda e todos os seus componentes — seus colchetes, suas armações[a], suas travessas, suas colunas e suas bases[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”. O termo hebraico se refere às peças estruturais verticais do tabernáculo.
    reason: lexical_alternative
  - marker: b
    text: Ou “encaixes”. O termo hebraico pode designar as peças de fundação nas quais os elementos estruturais eram encaixados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Então levaram
  rationale: O wayyiqtol do hifil de בוא dá continuidade à sequência narrativa. “Então levaram” é natural em português e conserva o sentido de conduzir ou trazer algo até alguém.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן é o termo habitual para a morada sagrada em Êxodo; “tabernáculo” é consagrado, reconhecível e adequado ao contexto.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: אֶל indica direção ou destinatário. A construção “levaram ... a Moisés” expressa claramente esse sentido.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: אֹהֶל significa normalmente “tenda” e aqui especifica um componente do tabernáculo, sem necessidade de explicitação interpretativa adicional.
- source_word: כָּל כֵּלָיו
  choice: todos os seus componentes
  rationale: כֵּלִים é amplo, podendo indicar objetos, utensílios ou equipamento. Como a lista inclui peças estruturais, “componentes” é mais abrangente e natural do que “utensílios”.
- source_word: קְרָסָיו
  choice: seus colchetes
  rationale: קְרָסִים designa os fechos que uniam as cortinas. “Colchetes” comunica a função de conexão no contexto da construção do tabernáculo.
- source_word: קְרָשָׁיו
  choice: suas armações
  rationale: קְרָשִׁים designa peças estruturais verticais, tradicionalmente chamadas de tábuas. “Armações” destaca sua função estrutural; a alternativa tradicional é preservada em nota.
- source_word: בריחו
  choice: suas travessas
  rationale: בְּרִיחַ designa barras horizontais que mantinham unidas as peças verticais. “Travessas” torna essa função construtiva clara em português.
- source_word: עַמֻּדָיו
  choice: suas colunas
  rationale: עַמּוּד designa suportes verticais. “Colunas” é uma tradução clara e convencional neste contexto arquitetônico.
- source_word: אֲדָנָיו
  choice: suas bases
  rationale: אֶדֶן designa peças de fundação ou encaixe nas quais se assentavam elementos estruturais. “Bases” é claro ao leitor comum; o sentido técnico é registrado em nota.
