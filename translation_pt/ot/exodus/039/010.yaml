  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: pt
  text: 'E nele colocaram quatro fileiras de pedras: na primeira fileira, um rubi[a], um topázio e uma esmeralda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata dessas pedras preciosas é incerta. “Rubi”, “topázio” e “esmeralda” seguem traduções tradicionais. Entre as alternativas possíveis estão “cornalina” para rubi, “crisólito” para topázio e outra pedra verde ou cintilante para esmeralda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ בֹו
  choice: nele colocaram
  rationale: Embora o verbo tenha o sentido básico de “encher”, neste contexto descreve a colocação das pedras no peitoral. “Nele colocaram” é natural em português e mantém a referência ao objeto sem especificar além do texto se as pedras estavam cravadas ou montadas.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: quatro fileiras de pedras
  rationale: טוּרֵי indica fileiras, enquanto אָבֶן tem sentido coletivo. A formulação é clara e natural em português.
- source_word: טוּר ... הַטּוּר הָאֶחָד
  choice: na primeira fileira
  rationale: No contexto da enumeração de quatro fileiras, a expressão hebraica identifica a primeira. A construção portuguesa evita uma repetição pesada e introduz naturalmente a lista.
- source_word: אֹדֶם
  choice: rubi
  rationale: É uma tradução tradicional e facilmente reconhecível, embora a identificação exata da pedra seja incerta; essa incerteza é preservada em nota.
- source_word: פִּטְדָה
  choice: topázio
  rationale: Segue a identificação tradicional, mas sem reivindicar certeza mineralógica; a nota registra uma alternativa plausível.
- source_word: בָרֶקֶת
  choice: esmeralda
  rationale: É a tradução tradicional em português. O termo hebraico pode designar outra pedra brilhante ou verde, por isso a incerteza é explicitada em nota.
