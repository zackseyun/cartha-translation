base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Com fios azuis, púrpuras e escarlates, fizeram vestes finamente tecidas[a] para o serviço no santuário. Fizeram também as vestes sagradas para Arão, assim como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestes para o serviço”. A expressão hebraica é especializada e pode destacar tanto a função das vestes no serviço do tabernáculo quanto sua confecção elaborada.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: Com os fios azul, púrpura e escarlate
  rationale: Os termos designam materiais têxteis caracterizados por cores ou corantes no contexto do tabernáculo. “Fios” explicita de modo natural o sentido têxtil, sem tentar precisar além da evidência os matizes dos corantes antigos.
- source_word: בִגְדֵי שְׂרָד
  choice: vestes finamente tecidas
  rationale: A expressão especializada provavelmente descreve vestes trabalhadas para o serviço cultual. A tradução mantém a distinção em relação a בִגְדֵי הַקֹּדֶשׁ, mas a incerteza entre construção elaborada e função de serviço é preservada em nota.
- source_word: לְשָׁרֵת
  choice: para ministrar
  rationale: No contexto sacerdotal, “ministrar” comunica serviço formal no santuário melhor que o verbo mais genérico “servir”.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: O termo indica aqui o âmbito sagrado do serviço no tabernáculo, sem exigir a interpretação mais estreita de uma sala específica chamada Lugar Santo.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: as vestes sagradas
  rationale: Tradução direta da designação formal das vestes sacerdotais de Arão.
- source_word: לְאַהֲרֹן
  choice: para Arão
  rationale: A preposição indica destinação ou uso previsto; “para Arão” é claro e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: assim como Yahweh havia ordenado a Moisés
  rationale: “Assim como” preserva a correspondência enfática, e “havia ordenado” situa naturalmente a ordem divina antes de seu cumprimento narrado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e representa melhor a vocalização historicamente reconstruída, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vestes”, “ministrar” e “santuário” conservam o registro cultual sem recorrer a linguagem excessivamente arcaica. O marcador da nota foi colocado junto à expressão ambígua בִגְדֵי שְׂרָד.
