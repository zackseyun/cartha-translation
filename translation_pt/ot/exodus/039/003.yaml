base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: pt
  text: Martelaram o ouro até formar lâminas finas[a] e o cortaram em fios[b], para entretecê-lo com o tecido azul, com o tecido púrpura, com o fio escarlate e com o linho fino, num trabalho de artesão habilidoso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lâminas de ouro”. O hebraico se refere a peças finas de metal obtidas por martelamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em tiras finas”. O ouro foi preparado em filamentos que podiam ser incorporados ao tecido.'
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica indica trabalho artístico especializado; também pode ser traduzida por “trabalho de artífice” ou “trabalho de tecelão artístico”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: Martelaram o ouro até formar lâminas finas
  rationale: O verbo רקע descreve o ato de bater ou martelar metal para torná-lo fino, e פַּחֵי designa lâminas ou placas delgadas. A formulação explicita com naturalidade o processo artesanal.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: e o cortaram em fios
  rationale: No contexto têxtil, פְּתִילִים são filamentos preparados a partir das lâminas de ouro. O pronome retoma naturalmente o ouro, embora o hebraico alterne do plural para o singular.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: para entretecê-lo com
  rationale: A expressão indica a incorporação dos filamentos de ouro aos materiais têxteis. 'Entretecer' comunica o procedimento sem tornar excessivamente literal o repetido בְּתוֹךְ.
- source_word: הַתְּכֵלֶת ... הָאַרְגָּמָן
  choice: o tecido azul ... o púrpura
  rationale: Os termos designam materiais tingidos dessas cores. 'Tecido' torna o referente compreensível e pode ser compartilhado elipticamente pelo segundo adjetivo, sem afirmar que o material era necessariamente fio.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: o fio escarlate
  rationale: A expressão designa material escarlate, tingido tradicionalmente com corante de cochonilha. 'Fio' esclarece sua função neste contexto têxtil.
- source_word: הַשֵּׁשׁ
  choice: o linho fino
  rationale: Nos textos do tabernáculo, שֵׁשׁ designa linho de qualidade fina.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: num trabalho de artesão habilidoso
  rationale: A expressão técnica indica trabalho artístico, planejado e especializado. Esta tradução preserva a habilidade do executor sem restringir indevidamente sua função a 'desenhista' ou 'tecelão'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução torna explícito o processo artesanal implícito no hebraico, preserva a natureza possivelmente têxtil dos materiais coloridos e evita determinar em excesso a função exata de חֹשֵׁב.
