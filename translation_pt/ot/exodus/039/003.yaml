    issue: «com o púrpura»
    rationale: O substantivo «púrpura» normalmente é feminino em português; o masculino somente se sustenta pela elipse de «tecido», que aqui é estilisticamente pouco natural. «Com o tecido púrpura» resolve a ambiguidade e mantém o sentido.
