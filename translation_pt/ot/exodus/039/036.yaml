  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: pt
  text: a mesa, todos os seus utensílios e o pão da Presença[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “pães da proposição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: שֻׁלְחָן designa diretamente uma mesa; o contexto já deixa claro que se trata dos objetos do santuário, sem necessidade de explicitação adicional.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כְּלִי pode designar objeto, recipiente ou instrumento. “Utensílios” é natural em português e adequado aos objetos associados à mesa.
- source_word: לֶחֶם הַפָּנִים
  choice: o pão da Presença
  rationale: A expressão significa literalmente “pão da face/presença”. “Pão da Presença” preserva essa formulação e sua referência cultual sem acrescentar uma interpretação explicativa ao texto.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: não traduzido separadamente
  rationale: São marcadores de objeto direto que coordenam os elementos da lista; sua função é transmitida em português pela ordem sintática e pela conjunção.
