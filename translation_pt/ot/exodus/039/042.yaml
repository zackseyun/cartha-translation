  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: pt
  text: Conforme tudo o que Yahweh havia ordenado a Moisés, assim os filhos de Israel fizeram todo o trabalho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Em hebraico, literalmente “os filhos de Israel”, designação coletiva tradicional do povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: Conforme tudo o que
  rationale: A combinação de כְּ com כֹּל exprime conformidade com a totalidade da ordem; esta formulação preserva a correspondência e soa natural em português.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O verbo significa ordenar; o pretérito mais-que-perfeito composto indica naturalmente que a ordem precedeu a execução do trabalho.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Com o verbo 'ordenar', o português normalmente apresenta a pessoa que recebe a ordem como objeto indireto.
- source_word: כֵּן
  choice: assim
  rationale: Retoma a conformidade introduzida por 'Conforme', preservando a correlação entre a ordem e sua execução.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: O verbo עשה tem sentido amplo de fazer ou executar e combina naturalmente com 'todo o trabalho'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma literal da designação coletiva e pactual do povo, sem eliminar sua formulação masculina no hebraico.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: todo o trabalho
  rationale: No contexto da construção do tabernáculo, עֲבֹדָה designa o conjunto completo do trabalho incumbido ao povo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pactual em vez de substituí-lo por um título.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A escolha conserva a expressão hebraica tradicional e sua função coletiva, enquanto a nota esclarece que ela designa o povo de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura correlativa 'Conforme... assim...' preserva a ênfase hebraica na correspondência exata entre a ordem e sua execução.
