  text: 'and the third row: jacinth[a], agate[b], and amethyst.'
translation:
  language: pt
  text: 'e a terceira fileira: jacinto[a], ágata[b] e ametista.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de várias pedras preciosas antigas do peitoral do sumo sacerdote é incerta; “jacinto” também pode ser traduzido como “âmbar” ou, segundo uma tradição mais antiga, “ligúrio”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ônix”, como identificação da segunda pedra desta fileira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: e a ... fileira
  rationale: No contexto da disposição das pedras do peitoral, טוּר designa uma fileira; a conjunção וְ mantém a continuidade da lista.
- source_word: הַשְּׁלִישִׁי
  choice: terceira
  rationale: O ordinal identifica diretamente a terceira fileira da sequência.
- source_word: לֶשֶׁם
  choice: jacinto
  rationale: A identificação exata da pedra antiga é incerta. “Jacinto” é uma designação tradicional ainda compreensível em português, com alternativas registradas em nota.
- source_word: שְׁבוֹ
  choice: ágata
  rationale: “Ágata” é uma identificação tradicional e corrente neste contexto, embora “ônix” também seja possível; a alternativa é preservada em nota.
- source_word: וְאַחְלָמָה
  choice: e ametista
  rationale: אַחְלָמָה é geralmente identificada como ametista; a conjunção é expressa naturalmente em português.
