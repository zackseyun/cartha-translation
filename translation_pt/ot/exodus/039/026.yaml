  text: פַּעֲמֹ֤ן וְ/רִמֹּן֙ פַּעֲמֹ֣ן וְ/רִמֹּ֔ן עַל שׁוּלֵ֥י הַ/מְּעִ֖יל סָבִ֑יב לְ/שָׁרֵ֕ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: uma campainha e uma romã, uma campainha e uma romã, ao redor de toda a barra do manto, para o serviço[a], conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para servir” ou “para ministrar”. O infinitivo hebraico indica que o manto se destinava ao serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: campainha
  rationale: O substantivo designa uma pequena peça sonora. “Campainha” é natural em português para o objeto preso à veste; “de ouro” não foi acrescentado porque, embora conste do contexto anterior, não aparece neste versículo.
- source_word: רִמּוֹן
  choice: romã
  rationale: A palavra significa literalmente “romã” e, neste contexto, designa um ornamento em forma de romã. O termo literal permanece claro e concreto em português.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: ao redor de toda a barra do manto
  rationale: שׁוּלֵי indica as extremidades inferiores ou a barra da veste, enquanto סָבִיב enfatiza que os adornos a circundavam por completo. A formulação evita a redundância pouco natural de “ao redor... ao redor” sem perder essa ênfase.
- source_word: לְשָׁרֵת
  choice: para o serviço
  rationale: O infinitivo com לְ expressa finalidade. “Para o serviço” conserva a referência ampla ao exercício do serviço cultual sem especificar mais do que o hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: “Conforme” expressa adequadamente a correspondência com a ordem divina anterior, e o mais-que-perfeito composto deixa clara a anterioridade da ordem em relação à obra descrita.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo por um título, sem introduzir interpretação denominacional.
- issue: Sentido de לְשָׁרֵת no contexto da veste sacerdotal
  choice: para o serviço
  alternative: para servir; para ministrar
  rationale: A expressão indica a finalidade da veste no serviço cultual. A tradução principal mantém a formulação ampla do hebraico, enquanto a nota registra equivalentes possíveis sem resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Barra do manto” é mais corrente do que “orlas” ou “saias do manto”, e “ao redor de toda” preserva a ênfase distributiva de סָבִיב sem produzir repetição artificial.
