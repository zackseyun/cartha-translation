  text: וַ/יִּתְּנ֤וּ עָלָי/ו֙ פְּתִ֣יל תְּכֵ֔לֶת לָ/תֵ֥ת עַל הַ/מִּצְנֶ֖פֶת מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Prenderam nela um cordão de fio azul[a], para colocá-la por cima do turbante, exatamente como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um cordão azul” ou “um cordão violeta”; o hebraico תְּכֵלֶת refere-se ao característico material tingido de azul usado no santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: Prenderam nela
  rationale: Embora נתן tenha o sentido básico de “pôr”, a construção com עַל descreve aqui a fixação do cordão na lâmina mencionada no versículo anterior. O pronome feminino retoma naturalmente “lâmina” em português.
- source_word: פְּתִיל
  choice: cordão
  rationale: O termo designa um fio torcido ou cordão; “cordão” se ajusta à função de prender a lâmina ao turbante.
- source_word: תְּכֵלֶת
  choice: tecido azul
  rationale: O termo se refere ao material distintivo tingido de azul ou azul-arroxeado empregado no santuário. “Tecido azul” comunica tanto o material quanto a cor, sem eliminar a incerteza cromática, registrada em nota.
- source_word: לָתֵת
  choice: para colocá-la
  rationale: O infinitivo expressa finalidade. O objeto implícito é a lâmina, retomada por “-la” para clareza em português.
- source_word: הַמִּצְנֶפֶת
  choice: o turbante
  rationale: Designa especificamente a cobertura sacerdotal da cabeça; “turbante” é claro, corrente e tradicional.
- source_word: מִלְמָעְלָה
  choice: por cima
  rationale: Preserva a noção de posição superior sem especificar indevidamente se seria o topo ou a parte frontal.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: exatamente como Yahweh havia ordenado a Moisés
  rationale: A formulação mantém a correspondência enfática entre a execução e a ordem divina; o mais-que-perfeito situa naturalmente a ordem antes de seu cumprimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a forma adotada pela edição.
- issue: Referente do objeto implícito em לָתֵת
  choice: a lâmina, retomada por “colocá-la”
  alternative: 'deixar o objeto sem expressão: “para pôr por cima do turbante”'
  rationale: O referente contextual é a lâmina ou diadema sagrado do versículo anterior. Explicitá-lo apenas por pronome torna a frase natural sem acrescentar uma identificação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe preserva a sequência do hebraico, mas explicita por pronome feminino o referente contextual da lâmina. A nota mantém aberta a variação entre azul e violeta.
