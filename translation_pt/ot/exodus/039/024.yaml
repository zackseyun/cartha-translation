  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: pt
  text: E fizeram romãs[b] de fios azuis, roxos e escarlates, torcidos[a], na barra do manto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico enumera material azul, roxo e escarlate e o descreve como torcido; a palavra “fios” foi explicitada para maior clareza.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ornamentos em forma de romã. O hebraico diz simplesmente “romãs”, usando o nome do objeto para indicar sua forma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: E fizeram
  rationale: O wayyiqtol de עשה dá continuidade à narrativa e significa, de modo direto, “e fizeram”.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: na barra do manto
  rationale: עַל indica a localização, שׁוּלֵי designa as bordas inferiores da veste, e מְעִיל é o manto sacerdotal. “Na barra” é natural em português e conserva o sentido locativo.
- source_word: רִמּוֹנֵי
  choice: romãs
  rationale: O hebraico emprega simplesmente o nome da fruta para os ornamentos com essa forma; a tradução preserva essa concisão.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: de fios azuis, roxos e escarlates
  rationale: Os termos designam materiais têxteis tingidos. “Fios” é explicitado para tornar clara a construção em português, e os adjetivos concordam naturalmente com o substantivo plural.
- source_word: מָשְׁזָר
  choice: retorcidos
  rationale: O termo descreve fios torcidos ou trançados; “retorcidos” é claro e se liga gramaticalmente aos fios explicitados.
theological_decisions: []
translation_notes:
