  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: pt
  text: Fizeram as pedras de ônix[a], circundadas por engastes de ouro, gravadas como gravações de selo, de acordo com os nomes dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “pedras de shoham”. A identificação exata da pedra preciosa é incerta, embora “ônix” seja a tradução tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Fizeram
  rationale: O verbo עשה tem sentido amplo de fazer ou produzir; “fizeram” é direto, natural e adequado ao contexto artesanal.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: as pedras de ônix
  rationale: “Ônix” é a identificação tradicional de שֹׁהַם neste contexto, embora o mineral exato seja incerto; a nota preserva essa incerteza.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: circundadas por engastes de ouro
  rationale: A expressão descreve as pedras rodeadas ou montadas em peças de ouro; “engastes” é o termo português apropriado para a armação que prende uma gema.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: gravadas como se grava um selo
  rationale: A formulação conserva a imagem da gravação própria de um selo e transmite de modo natural a construção enfática hebraica.
- source_word: עַל שְׁמוֹת
  choice: com os nomes
  rationale: Neste contexto, עַל indica a relação entre a gravação e os nomes inscritos. “Com os nomes” expressa isso com clareza sem introduzir uma ideia de ordenação que o texto não exige.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma masculina e o idioma genealógico e pactual do hebraico, sendo também uma expressão bíblica reconhecível em português.
theological_decisions:
- issue: Designação pactual e genealógica בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A tradução preserva a forma explicitamente masculina e a referência aos filhos nomeados de Jacó/Israel, relevante no contexto das inscrições.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a linguagem artesanal do versículo e preserva em nota a incerteza mineralógica.
