  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: pt
  text: Colocaram as duas pontas das duas correntes trançadas sobre os dois engastes[a] e os colocaram sobre as ombreiras do éfode, na parte da frente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «suportes».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: pontas
  rationale: Designa as extremidades das correntes; «pontas» é natural e preciso neste contexto.
- source_word: הָעֲבֹתֹת
  choice: correntes trançadas
  rationale: No contexto da ourivesaria do santuário, refere-se a correntes trabalhadas por torção ou entrelaçamento, e não a simples cordas.
- source_word: מִּשְׁבְּצֹת
  choice: engastes
  rationale: O termo indica peças de ouro destinadas a montar ou prender elementos ornamentais; «engastes» conserva o sentido artesanal.
- source_word: נָתְנוּ
  choice: prenderam
  rationale: Embora נתן signifique literalmente pôr ou colocar, a relação das pontas das correntes com os engastes favorece o português contextual «prenderam», sem definir um mecanismo específico.
- source_word: וַיִּתְּנֻם
  choice: os colocaram
  rationale: Mantém o sentido básico de נתן. O pronome masculino plural reproduz a referência gramatical mais provável aos engastes, embora a construção hebraica admita alguma dificuldade referencial.
- source_word: כִּתְפֹת
  choice: ombreiras
  rationale: No contexto da confecção do éfode, são as partes da veste que ficam sobre os ombros; «ombreiras» é conciso e tecnicamente adequado.
- source_word: הָאֵפֹד
  choice: éfode
  rationale: Transliteração portuguesa tradicional e amplamente reconhecida para a veste sacerdotal.
- source_word: אֶל מוּל פָּנָיו
  choice: na parte da frente
  rationale: Expressa a orientação para a face frontal do éfode em português claro, tomando o sufixo masculino singular como referência ao éfode.
