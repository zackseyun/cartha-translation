id: EXO.39.32
reference: Exodus 39:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: pt
  text: Assim foi concluído todo o trabalho do tabernáculo, a Tenda do Encontro. Os filhos de Israel[b] fizeram tudo conforme Yahweh[a] havia ordenado a Moisés; assim fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH, aqui transliterado «Yahweh»; também se encontra «Javé». Muitas traduções usam «SENHOR».
    reason: alternative_reading
  - marker: b
    text: 'Ou: «os israelitas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: foi concluído
  rationale: O verbo כלה indica que o projeto chegou à conclusão; a construção passiva mantém o foco no trabalho concluído.
- source_word: כָּל עֲבֹדַת
  choice: todo o trabalho
  rationale: Preserva a abrangência de כָּל e entende עֲבֹדָה como o trabalho de confecção e montagem, não como serviço litúrgico.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: do tabernáculo, a Tenda do Encontro
  rationale: Mantém o termo tradicional «tabernáculo» e apresenta «a Tenda do Encontro» em aposição, refletindo a estreita relação dos termos hebraicos sem os transformar em dois edifícios distintos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Reproduz a expressão familiar masculina do hebraico como designação coletiva da nação; a alternativa idiomática «os israelitas» é indicada em nota.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: tudo conforme ... havia ordenado
  rationale: Expressa tanto a totalidade quanto a plena conformidade com a ordem anterior, em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: כֵּן עָשׂוּ
  choice: assim fizeram
  rationale: Conserva a repetição enfática do hebraico, que ressalta a obediência exata.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome pessoal divino; «Yahweh» o representa diretamente, enquanto a nota reconhece a transliteração portuguesa «Javé» e a substituição tradicional por «SENHOR».
- issue: Sentido coletivo de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A escolha deixa visível a forma familiar masculina da expressão hebraica, sem negar seu referente corporativo; a nota oferece a formulação idiomática equivalente.
translation_notes:
  register: Português atual, claro e solene, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A repetição final foi mantida para preservar a ênfase hebraica.
