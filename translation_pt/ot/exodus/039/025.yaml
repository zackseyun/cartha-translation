base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: pt
  text: Fizeram sinos de ouro puro e puseram os sinos em meio às romãs[a], na barra do manto, ao redor, em meio às romãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «entre as romãs». A expressão hebraica significa literalmente «no meio das romãs» e descreve a posição dos sinos em relação aos adornos em forma de romã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Fizeram
  rationale: O wayyiqtol dá continuidade à sequência narrativa; em português, o pretérito perfeito expressa isso naturalmente sem exigir a repetição de “e” no início.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: campainhas de ouro puro
  rationale: “Campainhas” designa com clareza os pequenos objetos sonoros presos à veste, enquanto “de ouro puro” conserva explicitamente o material e sua qualidade.
- source_word: וַיִּתְּנוּ
  choice: e puseram
  rationale: Neste contexto, נתן significa pôr ou colocar em determinada posição. “Puseram” é simples, atual e fiel à ação descrita.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: em meio às romãs
  rationale: A expressão mantém o sentido espacial do hebraico sem decidir de modo rígido se cada campainha ficava precisamente entre duas romãs ou distribuída no conjunto delas.
- source_word: הָרִמֹּנִים
  choice: as romãs
  rationale: O hebraico nomeia diretamente as romãs; o contexto deixa claro que se trata dos adornos em forma de romã, sem necessidade de explicitação no texto principal.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: na barra do manto
  rationale: “Barra” comunica naturalmente a borda inferior da veste, e “manto” é uma equivalência corrente para a peça sacerdotal mencionada.
- source_word: סָבִיב
  choice: ao redor
  rationale: Indica que a ornamentação circundava toda a barra do manto.
- source_word: בְּתוֹךְ הָרִמֹּנִים (repetido)
  choice: em meio às romãs
  rationale: A repetição foi preservada porque também ocorre no hebraico e reforça a disposição dos adornos.
theological_decisions: []
