  text: וַ/יַּ֛עַשׂ אֶת מְעִ֥יל הָ/אֵפֹ֖ד מַעֲשֵׂ֣ה אֹרֵ֑ג כְּלִ֖יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/022.yaml
  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: pt
  text: Ele fez o manto do éfode, trabalho de tecelão[a], inteiramente de tecido azul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “obra de tecelão”; também pode ser traduzido como “obra tecida”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa um valioso material têxtil tingido de azul, usado no tabernáculo e nas vestes sacerdotais.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O waw consecutivo dá continuidade à narrativa, e a forma verbal masculina singular é preservada por “Ele fez”.
- source_word: מְעִיל הָאֵפֹד
  choice: o manto do éfode
  rationale: “Manto” comunica uma veste externa, enquanto “éfode” preserva o termo técnico da veste sacerdotal e a relação genitiva do hebraico.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: trabalho de tecelão
  rationale: Reproduz de perto a expressão hebraica e identifica o método artesanal sem acrescentar que o tecelão era “habilidoso”, algo não explícito no texto.
- source_word: כְּלִיל
  choice: inteiramente
  rationale: Expressa a totalidade indicada pelo termo hebraico e modifica naturalmente a composição do manto.
- source_word: תְּכֵלֶת
  choice: tecido azul
  rationale: No contexto de vestes sacerdotais, o termo designa material têxtil tingido de azul, não apenas uma cor abstrata. “Tecido azul” é claro em português sem especificar indevidamente uma forma exata do fio.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Éfode” mantém o termo sacerdotal tradicional; “trabalho de tecelão” conserva a linguagem concreta do ofício, e “inteiramente de tecido azul” transmite com naturalidade a totalidade e o caráter têxtil da expressão hebraica.
