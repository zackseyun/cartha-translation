  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: pt
  text: as vestes de tecido trabalhado[a] para servir no santuário, as vestes sagradas para o sacerdote Arão e as vestes dos filhos dele para exercerem o sacerdócio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestes de serviço”; a expressão hebraica provavelmente se refere a peças têxteis especialmente confeccionadas para o serviço no santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: vestes
  rationale: בֶּגֶד designa roupas ou vestimentas; “vestes” é claro, digno e apropriado ao contexto sacerdotal, sem recorrer a terminologia eclesiástica posterior.
- source_word: הַשְּׂרָד
  choice: de tecido trabalhado
  rationale: No contexto do tabernáculo, שְׂרָד provavelmente se refere a trabalho têxtil especialmente confeccionado. A expressão preserva essa dimensão material e artesanal, enquanto a nota registra a alternativa ligada ao serviço.
- source_word: לְשָׁרֵת
  choice: para servir
  rationale: שׁרת indica serviço formal, especialmente no culto. “Servir” é natural em português e o contexto do santuário comunica seu caráter sagrado e oficial.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: קֹדֶשׁ designa aqui o espaço ou âmbito sagrado do serviço no tabernáculo, não a santidade em sentido abstrato.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: as vestes sagradas
  rationale: Tradução direta e idiomática da designação das vestes sacerdotais, preservando a noção de consagração.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: para o sacerdote Arão
  rationale: Identifica com clareza o destinatário e seu ofício; a ordem escolhida é natural no português moderno.
- source_word: בִּגְדֵי בָנָיו
  choice: as vestes dos filhos dele
  rationale: Preserva a estrutura hebraica e torna inequívoco que as vestes pertencem aos filhos de Arão.
- source_word: לְכַהֵן
  choice: para exercerem o sacerdócio
  rationale: O verbo denominativo כּהן significa atuar ou servir como sacerdote. “Exercerem o sacerdócio” expressa de modo natural a função, sem criar o pouco idiomático verbo “sacerdotar”.
theological_decisions:
- issue: Distinção entre בִּגְדֵי הַשְּׂרָד e בִּגְדֵי הַקֹּדֶשׁ
  choice: Tratar a primeira expressão como vestes especialmente confeccionadas para o serviço no santuário e a segunda como a designação específica das vestes sagradas de Arão e de seus filhos.
  alternative: Entender as duas expressões como quase sinônimas e traduzir a primeira por “vestes de serviço”.
  rationale: A repetição hebraica favorece a preservação das duas expressões, possivelmente distintas quanto à função ou designação, sem definir além do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo da enumeração hebraica, conserva a ambiguidade de הַשְּׂרָד em nota e evita vocabulário eclesiástico posterior.
