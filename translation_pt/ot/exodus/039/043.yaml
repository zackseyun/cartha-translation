base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: pt
  text: Moisés viu todo o trabalho e eis que eles o haviam feito; assim como Yahweh havia ordenado, assim o fizeram. E Moisés os abençoou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva o sentido básico de ראה e, no contexto, permite que a oração seguinte indique que Moisés constatou a conformidade do trabalho, sem explicitar demais com 'inspecionou'.
- source_word: כָּל הַמְּלָאכָה
  choice: todo o trabalho
  rationale: מְלָאכָה designa aqui o conjunto do trabalho realizado para o tabernáculo; a expressão é clara, natural e abrangente em português.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Reproduz a função de הִנֵּה de chamar a atenção para o que Moisés constatou, mantendo o tom narrativo elevado.
- source_word: עָשׂוּ אֹתָהּ
  choice: o tinham feito
  rationale: O pronome retoma 'todo o trabalho'. O mais-que-perfeito composto expressa naturalmente que o trabalho já estava feito quando Moisés o viu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: assim como Yahweh havia ordenado
  rationale: כַּאֲשֶׁר indica correspondência exata; 'assim como' comunica essa relação e 'havia ordenado' situa a ordem antes de sua execução.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֵּן עָשׂוּ
  choice: assim o fizeram
  rationale: Mantém a repetição deliberada de עשה e enfatiza que a execução correspondeu exatamente à ordem recebida.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: Então Moisés os abençoou
  rationale: ברך no piel significa 'abençoar'. 'Então' expressa de modo natural a progressão narrativa do waw consecutivo após a constatação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal divino sem substituí-lo por um título; 'Jeová' representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se 'e eis que' para refletir a marca de atenção do hebraico e a repetição de 'fazer' para preservar a ênfase na obediência exata.
