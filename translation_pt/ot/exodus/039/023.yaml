base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: pt
  text: A abertura do manto ficava no centro dele, como a abertura de uma armadura[a], com uma borda ao redor da abertura, para que não se rasgasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como a abertura de uma couraça” ou “como a abertura de uma cota de malha”; o termo hebraico תַּחְרָא é raro e provavelmente designa uma peça de armadura protetora.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: a abertura do manto
  rationale: No contexto de uma peça de roupa, פֶּה designa idiomaticamente uma abertura, aqui a abertura para a cabeça; מְעִיל é um manto ou veste exterior.
- source_word: בְּתוֹכוֹ
  choice: no centro dele
  rationale: Expressa de modo claro a localização da abertura na parte central do manto, preservando o sentido espacial do hebraico.
- source_word: כְּפִי תַחְרָא
  choice: como a abertura de uma armadura
  rationale: תַחְרָא é um termo raro para uma veste protetora armada. “Armadura” é claro e preserva a incerteza quanto ao tipo específico, explicitada na nota.
- source_word: שָׂפָה
  choice: uma borda
  rationale: Embora o sentido básico seja “lábio” ou “beira”, no contexto da confecção indica a borda reforçada da abertura.
- source_word: לְפִיו סָבִיב
  choice: ao redor da abertura
  rationale: Indica que a borda circundava por completo a abertura do manto.
- source_word: לֹא יִקָּרֵעַ
  choice: para que não se rasgasse
  rationale: A forma verbal expressa naturalmente a finalidade ou o resultado pretendido da borda reforçada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível. A formulação mantém a comparação técnica do hebraico sem especificar no texto principal um tipo de armadura que o termo raro não permite identificar com segurança.
