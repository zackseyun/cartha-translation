base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: pt
  text: Ninguém subirá com você, e também ninguém deverá aparecer em parte alguma do monte[a]. Nem mesmo o rebanho e o gado deverão pastar diante daquele monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser visto em parte alguma do monte”. Nesta forma, o verbo hebraico pode significar tanto “aparecer” como “ser visto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ninguém
  rationale: Embora o substantivo seja masculino singular, aqui tem sentido genérico sob negação; “ninguém” comunica naturalmente em português a proibição dirigida a qualquer pessoa.
- source_word: יַעֲלֶה עִמָּךְ
  choice: subirá com você
  rationale: Preserva o movimento de subida ao monte e soa natural no português moderno.
- source_word: וְגַם
  choice: e também
  rationale: Mantém tanto a continuidade quanto a força aditiva da partícula sem exagerar a ênfase.
- source_word: אַל יֵרָא
  choice: ninguém deverá aparecer
  rationale: O nifal de ראה admite os sentidos “ser visto” e “aparecer”; no contexto, “aparecer” expressa naturalmente a proibição de presença visível, enquanto a alternativa é preservada em nota.
- source_word: בְּכָל הָהָר
  choice: em parte alguma do monte
  rationale: Expressa de modo idiomático a abrangência total da proibição sobre a área do monte.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: os rebanhos de ovelhas e de gado
  rationale: Distingue claramente os animais de pequeno e grande porte; “rebanhos” torna natural a referência coletiva em português.
- source_word: אַל יִרְעוּ
  choice: não deverão pastar
  rationale: רעה, tendo animais como sujeito, significa pastar; a forma escolhida comunica claramente a proibição.
- source_word: אֶל מוּל
  choice: diante de
  rationale: Representa a relação espacial de estar em frente, defronte ou diante do monte.
- source_word: הָהָר הַהוּא
  choice: daquele monte
  rationale: Preserva a especificidade e a distância indicadas pelo demonstrativo hebraico.
