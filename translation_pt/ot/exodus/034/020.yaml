base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: pt
  text: Todo primogênito de jumenta você deverá resgatar com um animal do rebanho[a]. Se não o resgatar, deverá quebrar-lhe o pescoço. Você deverá resgatar todo primogênito entre os seus filhos. Ninguém deverá comparecer diante de mim[b] de mãos vazias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode indicar uma ovelha ou uma cabra, jovem ou adulta.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante da minha face”; expressão hebraica que significa comparecer na presença de Deus.
    reason: lexical_alternative
  - marker: c
    text: Isto é, sem levar uma dádiva ou oferta.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: o primeiro filhote de uma jumenta
  rationale: פֶטֶר designa aquele que primeiro abre o ventre. Em português corrente, “primeiro filhote” comunica com clareza a referência ao primogênito do animal, enquanto “de uma jumenta” expressa naturalmente a construção hebraica.
- source_word: תִּפְדֶּה
  choice: você deverá resgatar
  rationale: פדה, neste contexto legal e cultual, indica livrar mediante substituição ou pagamento. “Resgatar” conserva esse sentido, e “deverá” comunica a força normativa do imperfeito hebraico.
- source_word: בְשֶׂה
  choice: com um animal do rebanho
  rationale: שֶׂה pode designar uma ovelha ou uma cabra, jovem ou adulta. “Animal do rebanho” preserva essa amplitude sem restringir indevidamente o referente a um cordeiro.
- source_word: וַעֲרַפְתּוֹ
  choice: quebre-lhe o pescoço
  rationale: ערף descreve a ação de quebrar o pescoço ou a nuca do animal. A formulação escolhida é direta, precisa e natural em português.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: todo primogênito entre os seus filhos
  rationale: A expressão refere-se a cada filho primogênito. “Entre os seus filhos” torna clara a relação sintática e mantém a referência masculina explícita do hebraico.
- source_word: יֵרָאוּ פָנַי
  choice: compareça diante de mim
  rationale: A forma de ראה acompanhada de “minha face” é uma expressão idiomática para apresentar-se na presença de Deus. “Compareça diante de mim” preserva o contexto formal de culto e a fala divina direta.
- source_word: רֵיקָם
  choice: de mãos vazias
  rationale: רֵיקָם significa “vazio” e, neste contexto de comparecimento cultual, implica vir sem dádiva ou oferta. A expressão portuguesa reproduz naturalmente tanto a imagem quanto a implicação.
theological_decisions:
- issue: Referência divina em primeira pessoa na cláusula final
  choice: diante de mim
  alternative: diante da minha face
  rationale: O hebraico diz literalmente “minha face”, mas emprega uma expressão idiomática para comparecer perante Deus. “Diante de mim” mantém a fala divina direta sem acrescentar uma nuance teológica ausente do texto.
- issue: Referência masculina em בָּנֶיךָ
  choice: seus filhos
  alternative: suas crianças
  rationale: O substantivo hebraico se refere explicitamente a filhos, em conexão com o primogênito masculino. A tradução conserva essa especificidade em vez de generalizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação combina linguagem jurídica direta (“deverá resgatar”) com imperativo natural (“quebre-lhe”). A amplitude de שֶׂה foi preservada no texto principal, e as imagens hebraicas relevantes foram esclarecidas em notas.
