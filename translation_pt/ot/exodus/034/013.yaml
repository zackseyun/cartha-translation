  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: pt
  text: Em vez disso[a], derrubem os altares deles, quebrem as suas colunas sagradas e cortem os seus postes de Aserá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois derrubem os altares deles...”. A conjunção hebraica também pode significar “pois”, mas, neste contexto, introduz naturalmente a ação exigida em contraste com a proibição anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “suas asherás”. O termo designa objetos de culto associados à deusa Aserá; sua forma exata é incerta.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pelo contrário
  rationale: No contexto, a conjunção introduz a ação contrária à aliança proibida no versículo anterior. A expressão preserva a progressão contrastiva natural em português; a possibilidade causal é registrada em nota.
- source_word: מִזְבְּחֹתָם
  choice: os altares deles
  rationale: Equivalente corrente de מִזְבֵּחַ em contexto cultual, preservando o plural e o sufixo de terceira pessoa masculina plural.
- source_word: תִּתֹּצוּן
  choice: derrubem
  rationale: נתץ denota demolir ou pôr abaixo uma estrutura. “Derrubem” é direto, natural e adequado a altares.
- source_word: מַצֵּבֹתָם
  choice: as suas colunas sagradas
  rationale: מַצֵּבָה designa pedras ou colunas erigidas, aqui claramente cultuais. “Sagradas” explicita esse valor contextual sem identificar a forma mais especificamente do que o hebraico permite.
- source_word: תְּשַׁבֵּרוּן
  choice: quebrem
  rationale: O Piel de שׁבר comunica uma ação enérgica de despedaçar. “Quebrem” é idiomático e vigoroso no conjunto da ordem.
- source_word: אֲשֵׁרָיו
  choice: os seus postes de Aserá
  rationale: O termo pode designar objetos cultuais ligados à deusa Aserá. O verbo “cortar” favorece objetos provavelmente feitos de madeira; “postes de Aserá” comunica essa leitura sem apagar a ligação com o nome próprio.
- source_word: תִּכְרֹתוּן
  choice: cortem
  rationale: כרת significa cortar ou eliminar mediante corte. Com os objetos de Aserá, “cortem” preserva a ação concreta sem acrescentar uma orientação espacial ausente do verbo.
theological_decisions:
- issue: Referente de אֲשֵׁרָיו
  choice: objetos cultuais associados a Aserá, traduzidos como “postes de Aserá”
  alternative: “aserins”, “imagens de Aserá” ou outros objetos cultuais associados à deusa
  rationale: A sequência enumera objetos físicos a destruir, e o verbo “cortar” sugere objetos de madeira, não a própria divindade. A nota preserva a incerteza quanto à forma exata desses objetos.
translation_notes:
  register: Português moderno, claro e digno, com imperativos diretos coerentes com o valor injuntivo das formas hebraicas. “Pelo contrário” torna explícita a relação contextual, enquanto as notas preservam as alternativas lexicais e a incerteza referente aos objetos de Aserá.
