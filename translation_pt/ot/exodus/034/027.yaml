base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Escreva estas palavras para você, pois, de acordo com estas palavras, fiz uma aliança[a] com você e com Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “cortei uma aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: A forma narrativa introduz a fala seguinte; “Então ... disse” é natural em português e mantém a progressão do relato.
- source_word: כְּתָב לְךָ
  choice: Escreva ... para você
  rationale: Mantém tanto o imperativo direto de כתב quanto o dativo לְךָ, que destaca o envolvimento pessoal de Moisés.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: No contexto escrito e da aliança, דְּבָרִים designa adequadamente as palavras ou estipulações mencionadas; a mesma expressão é traduzida de modo uniforme nas duas ocorrências.
- source_word: כִּי עַל פִּי
  choice: pois, de acordo com
  rationale: כִּי apresenta a razão da ordem, enquanto a expressão idiomática עַל־פִּי indica conformidade ou fundamento.
- source_word: כָּרַתִּי ... בְּרִית
  choice: fiz uma aliança
  rationale: É o equivalente corrente em português para a expressão idiomática hebraica, literalmente “cortar uma aliança”; o pretérito perfeito representa naturalmente a ação concluída.
- source_word: אִתְּךָ ... וְאֶת יִשְׂרָאֵל
  choice: com você e com Israel
  rationale: Identifica Moisés e Israel como participantes da aliança e repete “com” para tornar clara a coordenação.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová; Iavé
  rationale: Mantém o nome pessoal no texto e segue a orientação do projeto sem o substituir por um título.
- issue: Sentido da expressão de aliança כָּרַתִּי ... בְּרִית
  choice: fiz uma aliança
  alternative: cortei uma aliança; estabeleci uma aliança
  rationale: “Fiz uma aliança” comunica naturalmente o sentido do idioma sem apagar sua forma concreta, registrada em nota.
- issue: Relação de Moisés e Israel com a aliança
  choice: com você e com Israel
  alternative: com você, isto é, com Israel
  rationale: A tradução conserva a coordenação do hebraico e não identifica nem separa seus referentes além do que o texto afirma.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe clara para leitores brasileiros e compreensão internacional. A repetição de “estas palavras” e de “com” foi preservada por sua função no texto hebraico. O marcador da nota foi colocado junto à expressão que ela explica.
