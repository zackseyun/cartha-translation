  text: לֹֽא תִשְׁחַ֥ט עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹא יָלִ֣ין לַ/בֹּ֔קֶר זֶ֖בַח חַ֥ג הַ/פָּֽסַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: pt
  text: Não sacrifique, com fermento, o sangue do meu sacrifício, e o sacrifício da festa da Páscoa[a] não fique até a manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sacrifício pascal” ou “o sacrifício da festa pascal”. A expressão hebraica é compacta.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: abata
  rationale: O verbo שׁחט designa propriamente o abate, sobretudo o abate ritual. “Abata” conserva essa precisão melhor que o termo mais amplo “mate” e evita interpretar o verbo simplesmente como “ofereça” ou “sacrifique”.
- source_word: עַל חָמֵץ
  choice: junto com algo fermentado
  rationale: A preposição עַל tem aqui valor idiomático no contexto ritual. A formulação expressa associação ou presença concomitante sem definir além do texto se se trata especificamente de pão ou de qualquer produto fermentado.
- source_word: דַּם זִבְחִי
  choice: o sangue do meu sacrifício
  rationale: A tradução mantém explícitos tanto “sangue” quanto o sufixo de primeira pessoa em “meu sacrifício”, preservando a formulação compacta e incomum do hebraico.
- source_word: יָלִין
  choice: não deverá ficar até a manhã
  rationale: Neste contexto, לין indica permanecer durante a noite. A expressão portuguesa é natural e, com “até a manhã”, evita redundância.
- source_word: זֶבַח חַג הַפָּסַח
  choice: o sacrifício da festa da Páscoa
  rationale: A cadeia nominal é mantida sem reduzir “sacrifício” e “festa” a um único conceito. A nota registra traduções mais concisas possíveis.
- source_word: הַפָּסַח
  choice: a Páscoa
  rationale: “Páscoa” é o termo bíblico estabelecido em português para פֶּסַח e comunica a referência no contexto cultual de Israel sem recorrer à transliteração.
theological_decisions:
- issue: Terminologia da festa da aliança sem importar associações doutrinárias posteriores
  choice: a Páscoa
  alternative: Pessach
  rationale: “Páscoa” preserva a ligação canônica e é imediatamente compreensível em português, enquanto o versículo continua situado no culto de Israel e não recebe interpretação teológica posterior.
- issue: Relação entre o sacrifício, a festa e a Páscoa na cadeia nominal hebraica
  choice: o sacrifício da festa da Páscoa
  alternative: o sacrifício pascal
  rationale: A forma escolhida mantém visíveis os três elementos da expressão hebraica e não decide se “Páscoa” qualifica mais diretamente a festa ou o sacrifício.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega imperativo negativo singular (“não abata”) e conserva a formulação hebraica incomum “abater o sangue” para não apagar sua imagem sacrificial; “algo fermentado” evita restringir חָמֵץ a pão sem apoio explícito no versículo.
