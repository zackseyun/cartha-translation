  verdict: revise
  source_fidelity: 'A versão preserva adequadamente os elementos centrais do hebraico: a proibição ligada ao fermento, «o sangue do meu sacrifício» e a expressão ampliada «o sacrifício da festa da Páscoa». Contudo, «abater o sangue» não é uma colocação viável em português, embora reproduza superficialmente a construção hebraica. O verbo שָׁחַט, no contexto sacrificial, pode ser expresso naturalmente por «sacrificar» sem perder o sentido ritual.'
  naturalness: «Não abata o sangue» soa semanticamente anômalo em português moderno, pois se abate o animal, não o sangue. «Não sacrifique ... o sangue» é formulação cultual bíblica compreensível e mantém «sangue» explícito. «Com fermento» é mais idiomático do que «junto com algo fermentado» e não exige que se especifique pão.
  terminology: «Páscoa» e «sacrifício da festa da Páscoa» são adequados. A nota preserva alternativas legítimas para a cadeia nominal hebraica. O subjuntivo em «não fique até a manhã» reflete bem a segunda proibição e evita a mudança pouco elegante para «não deverá».
  issues:
  - severity: medium
    issue: «Não abata o sangue do meu sacrifício»
    rationale: A literalidade produz uma combinação verbal inviável no português. «Sacrificar o sangue» é expressão cultual inteligível, conserva o substantivo «sangue» e representa adequadamente o contexto de abate sacrificial.
  - severity: low
    issue: «junto com algo fermentado»
    rationale: A expressão é pesada e excessivamente vaga. «Com fermento» é a formulação portuguesa usual para a proibição cultual, sem determinar indevidamente o mecanismo ritual.
  - severity: low
    issue: «não deverá ficar»
    rationale: O futuro perifrástico é menos direto e cria assimetria com a primeira proibição. «Não fique» expressa naturalmente a proibição relativa ao sacrifício.
