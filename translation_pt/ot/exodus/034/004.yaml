  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: pt
  text: Assim, Moisés talhou duas tábuas de pedra semelhantes às primeiras[a]. Levantou-se cedo pela manhã, subiu ao monte Sinai, conforme Yahweh lhe havia ordenado, pegou as duas tábuas de pedra e as levou consigo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esculpiu duas tábuas de pedra como as primeiras” ou “cortou duas tábuas de pedra como as primeiras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “tomou em sua mão”; o singular pode ter uso idiomático.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: talhou
  rationale: O verbo פסל descreve aqui o trabalho de dar forma à pedra. “Talhou” é concreto, corrente e adequado ao registro narrativo.
- source_word: לֻחֹת אֲבָנִים
  choice: tábuas de pedra
  rationale: Expressão consagrada, clara e natural para as tábuas da aliança.
- source_word: כָּרִאשֹׁנִים
  choice: semelhantes às primeiras
  rationale: Reproduz a comparação com as tábuas anteriores sem sugerir necessariamente identidade absoluta.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: levantou-se cedo pela manhã
  rationale: Mantém o valor idiomático de levantar cedo e a ênfase temporal do hebraico.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: subiu ao monte Sinai
  rationale: Expressa naturalmente o movimento ascendente indicado por עלה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: conforme Yahweh lhe havia ordenado
  rationale: “Conforme” comunica a correspondência com a ordem anterior; o mais-que-perfeito composto torna clara a sequência narrativa.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: levou consigo
  rationale: Em português natural, comunica que Moisés tomou e transportou as tábuas, sem criar a imagem pouco provável de ambas estarem literalmente em uma só mão; a forma hebraica é registrada em nota.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: as duas tábuas de pedra
  rationale: O artigo definido identifica a dupla já mencionada no início do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O nome “Moisés” foi explicitado na abertura para evitar um pronome sem antecedente dentro do versículo isolado. A coordenação hebraica foi dividida em duas frases para legibilidade, sem alterar a sequência dos acontecimentos.
