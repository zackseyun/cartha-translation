  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: pt
  text: Quando Moisés terminou de falar com eles[a], pôs um véu sobre o rosto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “parou de falar com eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: terminou
  rationale: O wayyiqtol de כלה marca aqui a conclusão da fala de Moisés. “Terminou” é natural em português e preserva o sentido de completar ou cessar a ação.
- source_word: מִדַּבֵּר
  choice: de falar
  rationale: O infinitivo construto de דבר com מִ־ depois de כלה expressa a conclusão da ação; em português, a construção idiomática é “terminou de falar”.
- source_word: אִתָּם
  choice: com eles
  rationale: A preposição אֵת com o sufixo plural significa mais diretamente “com eles”; a tradução mantém essa formulação, sem convertê-la em “a eles”.
- source_word: וַיִּתֵּן
  choice: pôs
  rationale: נתן com עַל pode significar pôr ou colocar sobre algo. “Pôs” é conciso, corrente e adequado ao registro narrativo.
- source_word: עַל פָּנָיו
  choice: sobre o rosto
  rationale: A expressão indica a colocação do véu de modo a cobrir o rosto. Em português, “sobre o rosto” comunica isso naturalmente; o possessivo é dispensável porque o referente já está claro.
- source_word: מַסְוֶה
  choice: véu
  rationale: Neste contexto, o substantivo designa uma cobertura para o rosto. “Véu” é o termo português tradicional, preciso e amplamente compreensível.
