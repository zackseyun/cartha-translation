base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Talhe[a] para você duas tábuas de pedra como as primeiras. Eu escreverei nessas tábuas as palavras que estavam nas primeiras tábuas, que você quebrou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Corte” ou “Lavre”.
    reason: Registra alternativas possíveis para o verbo que descreve a preparação das tábuas de pedra.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: É a forma narrativa mais natural e direta em português para introduzir a fala.
- source_word: פְּסָל
  choice: Talhe
  rationale: Expressa a ação de dar forma a tábuas de pedra. É concreto, atual e mais preciso neste contexto do que um termo que sugira apenas corte ou gravação decorativa.
- source_word: לְךָ
  choice: para você
  rationale: Mantém explícito o pronome dativo do hebraico, indicando que o próprio Moisés deve preparar as tábuas.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: duas tábuas de pedra
  rationale: Formulação clara e corrente que conserva tanto o objeto quanto o material indicado no hebraico.
- source_word: כָּרִאשֹׁנִים
  choice: como as primeiras
  rationale: Reproduz naturalmente a comparação com as tábuas anteriores.
- source_word: וְכָתַבְתִּי
  choice: Eu escreverei
  rationale: Apresenta de modo direto a promessa divina no futuro; a separação em nova frase torna o período mais legível sem alterar a relação do hebraico.
- source_word: עַל הַלֻּחֹת
  choice: nessas tábuas
  rationale: O demonstrativo retoma naturalmente em português as tábuas recém-mencionadas e preserva a ideia de inscrição sobre sua superfície.
- source_word: הַדְּבָרִים
  choice: as palavras
  rationale: Mantém o sentido lexical básico, sem interpretar antecipadamente o conteúdo como “mandamentos”.
- source_word: אֲשֶׁר הָיוּ עַל הַלֻּחֹת הָרִאשֹׁנִים
  choice: que estavam nas primeiras tábuas
  rationale: Identifica de forma clara o conteúdo que será novamente escrito.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: que você quebrou
  rationale: Traduz de maneira simples e suficiente a ação atribuída a Moisés, sem intensificá-la desnecessariamente como “despedaçou”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal da aliança e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O discurso direto foi dividido em duas frases para evitar um encadeamento excessivo, mantendo a progressão do hebraico. O nome Yahweh permanece transliterado.
