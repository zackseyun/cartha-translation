  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: pt
  text: Moisés se apressou, curvou-se até o chão e adorou.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiu depressa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “prostrou-se”; o verbo hebraico pode indicar curvar-se em adoração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: se apressou
  rationale: O verbo מהר expressa ação feita com pressa. A forma pronominal é natural em português e mantém a ênfase na resposta imediata de Moisés.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיִּקֹּד
  choice: curvou-se
  rationale: O verbo קדד indica inclinar ou curvar o corpo. Esta escolha preserva o gesto físico e evita confundi-lo com o ato de adoração expresso pelo verbo seguinte.
- source_word: אַרְצָה
  choice: até o chão
  rationale: A forma direcional de אֶרֶץ indica movimento em direção ao solo; “até o chão” comunica de modo natural a profundidade do gesto.
- source_word: וַיִּשְׁתָּחוּ
  choice: adorou
  rationale: Nesse contexto, o verbo שחה descreve prostração reverente diante do SENHOR. Como o verbo anterior já apresenta o gesto corporal, “adorou” preserva sua força religiosa sem repetição desnecessária.
theological_decisions:
- issue: Se o verbo final deve ser traduzido como mero gesto físico ou como adoração
  choice: adorou
  alternative: prostrou-se; inclinou-se
  rationale: Moisés responde com reverência à autorrevelação do SENHOR. Embora o verbo hebraico possa designar prostração corporal, o contexto lhe confere sentido de adoração, e o gesto físico já foi expresso pelo verbo anterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência verbal do hebraico foi mantida em três ações coordenadas, distinguindo a pressa, o gesto corporal e a adoração.
