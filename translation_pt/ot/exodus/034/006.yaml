  terminology: «Amor leal» comunica apropriadamente חֶסֶד. Contudo, «bondoso» para חַנּוּן é mais amplo e perde a noção específica de graça/favor imerecido; «gracioso» preserva melhor a distinção lexical em relação a רַחוּם, embora seja registro bíblico corrente e compreensível.
