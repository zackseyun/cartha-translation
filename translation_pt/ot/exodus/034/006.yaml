  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: pt
  text: 'Então Yahweh passou diante dele e proclamou: “Yahweh, Yahweh, Deus compassivo e gracioso, lento para a ira e rico em amor leal e fidelidade[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rico em amor leal e verdade”.
    reason: Alternativa lexical legítima para אֱמֶת, que pode significar tanto fidelidade/confiabilidade quanto verdade.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título; a repetição hebraica também é mantida.
- source_word: וַיַּעֲבֹר עַל־פָּנָיו
  choice: passou diante dele
  rationale: Expressa de modo natural a ação de passar em frente a Moisés, sem reproduzir rigidamente o idiomatismo hebraico ligado à face.
- source_word: וַיִּקְרָא
  choice: proclamou
  rationale: No contexto da solene declaração do nome e do caráter divinos, comunica melhor que uma simples chamada em voz alta.
- source_word: אֵל
  choice: Deus
  rationale: Funciona em aposição ao nome repetido e introduz a descrição do caráter de Yahweh; o português dispensa o artigo indefinido usado naturalmente no inglês.
- source_word: רַחוּם
  choice: compassivo
  rationale: Comunica a profunda compaixão ou misericórdia indicada pelo termo hebraico em linguagem atual e digna.
- source_word: חַנּוּן
  choice: bondoso
  rationale: Comunica de forma acessível a disposição de conceder favor e graça. Evita a expressão menos natural 'gracioso' para caráter moral no português corrente.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lento para a ira
  rationale: Equivalente idiomático consagrado da imagem hebraica literal 'longo de narinas', indicando que Deus não se ira rapidamente.
- source_word: רַב
  choice: rico em
  rationale: Com substantivos abstratos, expressa abundância de maneira fluente e corrente em português.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Preserva tanto a dimensão afetiva quanto a constância e lealdade relacional do termo, sem reduzi-lo apenas a misericórdia.
- source_word: אֱמֶת
  choice: fidelidade
  rationale: Nesta dupla com חֶסֶד, descreve principalmente a confiabilidade e constância de Deus; a alternativa lexical 'verdade' é preservada em nota.
theological_decisions:
- issue: Repetição do nome divino יְהוָה
  choice: Yahweh, Yahweh
  alternative: Senhor Deus
  rationale: O hebraico repete o nome da aliança para dar ênfase. A tradução não elimina a repetição nem introduz 'Deus' dentro da sequência do nome; אֵל permanece como a descrição seguinte.
- issue: Sentido de אֱמֶת na expressão חֶסֶד וֶאֱמֶת
  choice: fidelidade
  alternative: verdade
  rationale: No contexto, 'fidelidade' ressalta o caráter confiável e constante de Deus. Como 'verdade' continua sendo uma leitura lexical legítima, a nota conserva essa ambiguidade sem sobrecarregar o texto principal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e o paralelismo da autoproclamação divina foram preservados, enquanto os idiomatismos hebraicos receberam equivalentes naturais em português.
