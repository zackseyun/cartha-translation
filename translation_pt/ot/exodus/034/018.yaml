  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: pt
  text: Observe a Festa dos Pães sem Fermento[a]. Durante sete dias você comerá pães sem fermento, como lhe ordenei, no tempo determinado do mês de abibe[b], pois foi no mês de abibe que você saiu do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Festival dos Pães sem Fermento”. O termo hebraico חַג pode designar uma festa ou celebração sagrada estabelecida.
    reason: lexical_alternative
  - marker: b
    text: Abibe era o mês do início da primavera associado à saída do Egito; corresponde aproximadamente a março–abril.
    reason: cultural_note
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Festa dos Pães sem Fermento
  rationale: חַג designa uma festa ou celebração sagrada, por vezes ligada à peregrinação, e מַצּוֹת são pães preparados sem fermento. A formulação é clara, tradicionalmente reconhecível e preserva o caráter de nome da celebração.
- source_word: תִּשְׁמֹר
  choice: Observe
  rationale: Neste contexto de mandamento cultual, שׁמר significa guardar no sentido de cumprir ou observar. “Observe” comunica esse valor naturalmente em português.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Durante sete dias você comerá pães sem fermento
  rationale: A construção expressa a duração prescrita. O futuro em português mantém o caráter injuntivo do hebraico, e o plural “pães” representa מַצּוֹת sem exigir um termo técnico pouco acessível.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: como lhe ordenei
  rationale: A oração retoma a observância prescrita e mantém de modo natural a força do mandamento divino.
- source_word: לְמוֹעֵד
  choice: no tempo determinado
  rationale: מוֹעֵד indica um tempo ou período fixado, frequentemente para uma celebração sagrada. “Tempo determinado” preserva essa ideia sem sugerir apenas uma data pontual.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: mês de abibe
  rationale: אָבִיב funciona aqui como designação do mês ligado ao êxodo. “Abibe” é a transliteração consagrada em português bíblico; a inicial minúscula segue o uso moderno para nomes de meses.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão histórica para a ordem e é reproduzida por um conectivo explicativo natural e digno.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: você saiu do Egito
  rationale: יצא significa sair. A formulação portuguesa é direta e preserva a referência ao êxodo sem acrescentar interpretação.
theological_decisions:
- issue: Terminologia da celebração da aliança
  choice: Tratar “Festa dos Pães sem Fermento” como nome de uma celebração sagrada instituída
  alternative: “festival dos pães sem fermento” ou explicitação como festa de peregrinação
  rationale: A tradução conserva o peso cultual e pactual de חַג sem inserir desenvolvimentos doutrinários posteriores nem tornar explícita uma nuance de peregrinação que não precisa ser especificada neste versículo.
- issue: Segunda pessoa masculina singular dirigida a Israel
  choice: Manter a segunda pessoa singular com “você”
  alternative: Pluralizar como “vocês” ou substituir por “Israel”
  rationale: O hebraico emprega o singular, provavelmente dirigindo-se corporativamente a Israel. “Você” preserva a forma do texto e é amplamente compreensível, sobretudo para leitores brasileiros.
- issue: Ênfase temporal da saída do Egito
  choice: “foi no mês de abibe que você saiu do Egito”
  alternative: “no mês de abibe você saiu do Egito”
  rationale: A construção destacada soa natural em português e conserva a função explicativa da data, sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega “você” para reproduzir o singular hebraico sem recorrer ao mais regional ou solene “tu”. Mantém “abibe” como forma bíblica reconhecível e explica o dado cultural em nota.
