review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura injuntiva, a referência à casa de Yahweh e a proibição relativa ao cabrito. Contudo, “própria mãe” acrescenta uma ênfase possessiva que não está expressa no hebraico. A formulação de רֵאשִׁית בִּכּוּרֵי como “o primeiro dos primeiros frutos” é muito literal, mas pouco idiomática em português; “a primeira parte das primícias” transmite a prioridade/porção inicial sem impor a leitura qualitativa de “o melhor”.
  naturalness: “Você levará” é compreensível e adequado ao registro normativo moderno. “Primícias” é o termo cultual agrícola mais natural e estabelecido em português. A eliminação de “própria” torna a segunda frase mais direta e fiel.
  terminology: “Yahweh”, “casa”, “Deus”, “primícias” e “cabrito” são apropriados. “Não cozinhe” é uma formulação portuguesa corrente para a proibição; no contexto, preserva a construção de cozinhar no leite materno, embora o verbo hebraico possa ter especificamente o sentido de ferver.
  issues:
  - severity: low
    issue: Ênfase indevida em “própria mãe”
    rationale: O sufixo possessivo hebraico significa “sua mãe”; “própria” introduz uma ênfase não marcada no texto-fonte.
  - severity: low
    issue: Formulação pouco idiomática de רֵאשִׁית בִּכּוּרֵי
    rationale: “O primeiro dos primeiros frutos” reproduz a forma hebraica, mas soa truncado em português. “A primeira parte das primícias” conserva a ideia de porção prioritária sem decidir se a expressão também implica qualidade.
  revised_text: Você levará à casa de Yahweh, seu Deus, a primeira parte das primícias da sua terra.[a] Não cozinhe um cabrito no leite de sua mãe.
