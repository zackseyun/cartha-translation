  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: pt
  text: Você levará à casa de Yahweh, seu Deus, a primeira parte das primícias da sua terra.[a] Não cozinhe um cabrito no leite de sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o melhor das primícias da sua terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: o primeiro dos primeiros frutos
  rationale: Preserva de perto a construção hebraica e a ideia de prioridade temporal, sem introduzir explicitamente a noção interpretativa de “melhor” ou “mais escolhido”.
- source_word: אַדְמָתְךָ
  choice: da sua terra
  rationale: No contexto agrícola, designa o solo cultivado e sua produção; “terra” é natural e amplamente compreensível em português.
- source_word: תָּבִיא
  choice: Você levará
  rationale: O imperfeito hebraico tem força injuntiva no contexto legal. O futuro português conserva um tom normativo digno e corrente.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: à casa de Yahweh, seu Deus
  rationale: “Casa” evita a especificidade histórica de “templo”, enquanto “Yahweh” representa o nome divino presente no texto hebraico.
- source_word: לֹא תְבַשֵּׁל
  choice: Não cozinhe
  rationale: בשל pode indicar cozinhar, especialmente por fervura. “Cozinhe” é claro em português e evita sugerir que apenas o ato técnico de ferver esteja em vista.
- source_word: גְּדִי
  choice: um cabrito
  rationale: Termo português comum e preciso para um bode jovem.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: no leite da própria mãe
  rationale: Expressão natural que mantém a relação materna explícita no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto contém o nome próprio divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título; “Javé” é uma forma portuguesa tradicional possível.
- issue: Sentido de רֵאשִׁית em רֵאשִׁית בִּכּוּרֵי
  choice: o primeiro dos primeiros frutos
  alternative: o melhor dos primeiros frutos
  rationale: A tradução principal preserva a formulação e a prioridade do hebraico sem resolver a possível implicação qualitativa; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação legal direta. Mantém “casa” para o santuário e evita linguagem excessivamente arcaica.
