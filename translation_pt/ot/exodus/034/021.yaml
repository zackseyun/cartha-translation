base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: pt
  text: Durante seis dias, você trabalhará, mas, no sétimo dia, deixará de trabalhar; na época de arar e de colher, deixará de trabalhar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descansará”. O verbo hebraico significa cessar ou parar e, por extensão, descansar.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Durante seis dias
  rationale: O numeral em construção com o substantivo plural indica um período de seis dias. “Durante seis dias” expressa naturalmente em português essa extensão temporal.
- source_word: תַּעֲבֹד
  choice: você trabalhará
  rationale: O imperfeito qal de segunda pessoa masculina singular tem aqui força de instrução da aliança. O futuro em português preserva o caráter prescritivo sem reduzi-lo a mera permissão.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mas no sétimo dia
  rationale: 'Embora o waw possa ser traduzido por “e”, seu valor no contexto é contrastivo: seis dias de trabalho se contrapõem ao sétimo dia de cessação.'
- source_word: תִּשְׁבֹּת
  choice: cessará
  rationale: O sentido básico de שׁבת é cessar ou parar. “Cessará” mantém esse núcleo lexical e a associação com o sábado, sem restringir o verbo à ideia experiencial de repouso.
- source_word: בֶּחָרִישׁ
  choice: no tempo de arar
  rationale: חָרִישׁ pode indicar a atividade ou a época de arar. A expressão escolhida comunica de modo natural a referência à temporada agrícola.
- source_word: וּבַקָּצִיר
  choice: como no da colheita
  rationale: קָצִיר designa a colheita ou o tempo da colheita. Na construção correlativa “tanto... como”, “no da colheita” retoma de forma clara e concisa “tempo”.
- source_word: תִּשְׁבֹּת (segunda ocorrência)
  choice: cessará
  rationale: A repetição do verbo hebraico é preservada para enfatizar que a cessação no sétimo dia se aplica até nas épocas agrícolas mais exigentes.
theological_decisions:
- issue: Tradução do verbo sabático שׁבת
  choice: cessará nas duas ocorrências
  alternative: descansará nas duas ocorrências
  rationale: “Cessará” reflete o sentido lexical básico de interromper a atividade e destaca a suspensão do trabalho até mesmo durante a aração e a colheita, sem acrescentar uma definição mais estreita de descanso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” torna explícita a segunda pessoa masculina singular do hebraico de maneira natural. A formulação preserva o contraste, a repetição verbal e a ênfase agrícola do original.
