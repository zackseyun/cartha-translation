review_pass:
  verdict: revise
  source_fidelity: O texto preserva corretamente a estrutura temporal, o contraste entre os seis dias e o sétimo, e a repetição do verbo שבת. A referência à aração e à colheita é fiel. Contudo, em português atual, «cessará» sem complemento soa pouco natural e pode sugerir que a própria pessoa deixará de existir, em vez de interromper o trabalho.
  naturalness: «Durante seis dias» e o uso de «você» são claros e adequados ao registro-alvo. A formulação «tanto no tempo de arar como no da colheita» é compreensível, mas mais pesada e menos direta que «na época de arar e de colher». «Deixará de trabalhar» comunica de maneira idiomática o valor de cessação do verbo hebraico.
  terminology: A nota deve conservar a alternativa «descansará» e explicar que o hebraico tem o sentido básico de cessar/parar. A expressão explícita «deixará de trabalhar» é uma explicitação contextual segura, pois o contraste imediato é entre trabalhar e cessar.
  issues:
  - severity: medium
    issue: «cessará» empregado de modo absoluto
    rationale: Embora espelhe literalmente o núcleo lexical de שבת, esse uso é pouco idiomático no português moderno e pode ser semanticamente ambíguo. «Deixará de trabalhar» preserva a cessação do labor exigida pelo contexto.
  - severity: low
    issue: Construção agrícola excessivamente pesada
    rationale: «Tanto no tempo de arar como no da colheita» é correta, mas «na época de arar e de colher» é mais fluente, conserva a abrangência temporal e preserva a coordenação hebraica.
  revised_text: Durante seis dias, você trabalhará, mas, no sétimo dia, deixará de trabalhar; na época de arar e de colher, deixará de trabalhar.[a]
