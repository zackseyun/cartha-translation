- from: Durante seis dias você trabalhará, mas no sétimo dia cessará; tanto no tempo de arar como no da colheita, cessará.[a]
  to: Durante seis dias, você trabalhará, mas, no sétimo dia, deixará de trabalhar; na época de arar e de colher, deixará de trabalhar.[a]
