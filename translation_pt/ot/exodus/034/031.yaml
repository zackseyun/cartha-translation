base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: pt
  text: Mas Moisés os chamou, e Arão e todos os líderes da comunidade[a] voltaram para junto dele; então Moisés falou com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes da congregação” ou “líderes da assembleia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: Moisés os chamou
  rationale: קרא com אֶל indica que Moisés se dirigiu a eles, chamando-os para que se aproximassem. A formulação é natural em português e evita a força excessiva de “convocou”.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: voltaram para junto dele
  rationale: שׁוב expressa retorno. “Para junto dele” deixa claro que Arão e os líderes voltaram a se aproximar de Moisés.
- source_word: הַנְּשִׂאִים
  choice: os líderes
  rationale: נָשִׂיא designa aqui os principais representantes do povo. “Líderes” é claro, atual e menos arcaico que “príncipes”.
- source_word: בָּעֵדָה
  choice: da comunidade
  rationale: עֵדָה refere-se à coletividade reunida de Israel. “Comunidade” comunica essa dimensão coletiva em português corrente; “congregação” e “assembleia” também são possíveis.
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: דבר no piel é o verbo comum para falar; “falou” mantém simplicidade e dignidade.
- source_word: וַ
  choice: Mas / e / então
  rationale: Os waw encadeiam a narrativa. No início, “Mas” explicita o leve contraste com o medo e o afastamento do versículo anterior; depois, “e” e “então” apresentam a sequência dos acontecimentos com naturalidade.
theological_decisions: []
