  text: וְ/אַחֲרֵי כֵ֥ן נִגְּשׁ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יְצַוֵּ֕/ם אֵת֩ כָּל אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אִתּ֖/וֹ בְּ/הַ֥ר סִינָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: pt
  text: Depois disso, todos os filhos de Israel[a] se aproximaram, e ele lhes ordenou tudo o que Yahweh havia falado com ele no monte Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é literalmente “filhos de Israel”; aqui, designa os israelitas como povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa com naturalidade a sequência temporal indicada pela locução hebraica, ligando o versículo aos acontecimentos anteriores.
- source_word: נִגְּשׁוּ
  choice: se aproximaram
  rationale: O nifal de נגשׁ indica aproximar-se ou chegar perto; a forma escolhida preserva o movimento concreto e é corrente em português.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Mantém de perto a expressão nacional hebraica e sua forma masculina plural, sem perder a compreensão corrente; a nota registra a alternativa idiomática 'israelitas'.
- source_word: וַ/יְצַוֵּ/ם
  choice: ele lhes ordenou
  rationale: O verbo צוה comunica ordem ou mandamento; 'ordenou' preserva essa força melhor do que opções mais brandas, como 'instruiu'.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: Reproduz de modo claro e idiomático a abrangência total do conteúdo comunicado.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: Yahweh havia falado com ele
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da fala no Sinai, e 'com ele' preserva a nuance relacional de אִתּוֹ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּ/הַר סִינָי
  choice: no monte Sinai
  rationale: É a forma natural em português para indicar o local da fala divina e corresponde diretamente à expressão hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino; 'Yahweh' o conserva por transliteração, sem trocá-lo pelo título tradicional 'SENHOR'.
- issue: Representação de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha preserva a forma da designação coletiva hebraica. A nota esclarece seu sentido nacional sem neutralizar silenciosamente a expressão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe permanece próxima do hebraico sem soar artificial.
