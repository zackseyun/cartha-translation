source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: pt
  text: 'E ele disse: “Eis que estou firmando uma aliança. Diante de todo o seu povo, farei maravilhas como nunca foram criadas em parte alguma da terra nem entre nenhuma das nações. Todo o povo em cujo meio você está verá a obra do SENHOR, pois aquilo que estou fazendo com você é assombroso.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função enfática e de chamada de atenção do hebraico, em linguagem dignificada e ainda amplamente compreensível.
- source_word: כֹּרֵת בְּרִית
  choice: estou firmando uma aliança
  rationale: O hebraico usa literalmente o verbo “cortar”, mas esta é uma expressão idiomática para estabelecer ou firmar uma aliança; “firmando” comunica o sentido sem reproduzir uma construção opaca em português.
- source_word: נֶגֶד כָּל־עַמְּךָ
  choice: Diante de todo o seu povo
  rationale: Preserva a ideia de realização pública, perante os olhos do povo.
- source_word: נִפְלָאֹת אֲשֶׁר לֹא־נִבְרְאוּ
  choice: maravilhas como nunca foram criadas
  rationale: Conserva o substantivo “maravilhas” e o raro emprego passivo do verbo ברא, “criar”, em vez de substituí-lo por “realizadas” ou “feitas”.
- source_word: מַעֲשֵׂה יְהוָה
  choice: a obra do SENHOR
  rationale: Traduz מַעֲשֶׂה por “obra” e representa o nome divino segundo a convenção portuguesa amplamente reconhecida de SENHOR em versaletes.
- source_word: נוֹרָא
  choice: assombroso
  rationale: Expressa algo que provoca temor reverente e espanto, evitando tanto reduzir o termo a mero medo quanto torná-lo apenas admirável.
theological_decisions:
- issue: Sentido de עִמָּךְ na declaração final
  choice: com você
  alternative: em seu favor / por meio de você
  rationale: A preposição admite nuances contextuais, mas “com você” preserva a formulação relacional e a ambiguidade do hebraico sem definir se a ação é em favor de Moisés, por meio dele ou em relação a ele.
- issue: Referente de כָּל־הָעָם אֲשֶׁר אַתָּה בְקִרְבּוֹ
  choice: Todo o povo em cujo meio você está
  alternative: todos os povos entre os quais você está
  rationale: O hebraico traz “todo o povo” no singular e um sufixo também singular; a tradução mantém essa forma, sem harmonizá-la com a possível ideia contextual de várias nações.
translation_notes:
  register: Português moderno, dignificado e de leitura corrente, com tratamento por “você” para o singular hebraico. A sintaxe acompanha de perto a progressão do original, mas evita o literalismo idiomático de “cortar uma aliança”. “Em parte alguma da terra” explicita naturalmente em português o alcance universal de בְכָל־הָאָרֶץ, sem alterar o sentido.
