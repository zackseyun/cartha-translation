  source_fidelity: 'A tradução acompanha com precisão a estrutura e o sentido do hebraico: a aliança é estabelecida publicamente, as maravilhas são descritas com o passivo incomum de «criar», e o povo verá a obra de YHWH. «Com você» preserva adequadamente a abertura semântica de עִמָּךְ.'
