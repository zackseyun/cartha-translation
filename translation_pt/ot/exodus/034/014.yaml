  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: pt
  text: Pois você não deve se prostrar diante de outro deus,[a] porque Yahweh — Ciumento é o seu nome[b] — é um Deus ciumento.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deve adorar outro deus”. O verbo hebraico se refere literalmente a curvar-se ou prostrar-se, muitas vezes como ato de adoração.'
    reason: lexical_alternative
  - marker: b
    text: 'A ordem das palavras em hebraico é: “porque Yahweh — Ciumento é o seu nome — é um Deus ciumento”.'
    reason: lexical_alternative
  - marker: c
    text: Aqui, “ciumento” expressa a reivindicação exclusiva de Yahweh sobre a adoração de seu povo, não inveja pecaminosa.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: deve se prostrar
  rationale: O verbo שׁחה descreve literalmente o ato de curvar-se ou prostrar-se, muitas vezes como expressão de culto. A formulação preserva a ação concreta e, no contexto, seu sentido religioso.
- source_word: לְאֵל אַחֵר
  choice: diante de outro deus
  rationale: אֵל אַחֵר significa diretamente “outro deus”. “Diante de” soa natural em português com “prostrar-se” e expressa adequadamente a relação indicada pela preposição לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: קַנָּא
  choice: Zeloso / zeloso
  rationale: קַנָּא descreve a reivindicação exclusiva de Yahweh sobre a adoração de seu povo e sua intolerância à lealdade religiosa rival. “Zeloso” evita sugerir inveja pecaminosa, mas a nota registra “Ciumento” como alternativa mais literal.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Preserva a afirmação explícita de que “Zeloso” funciona como nome ou designação de Yahweh.
- source_word: אֵל קַנָּא הוּא
  choice: é Deus zeloso
  rationale: Reproduz a retomada enfática do adjetivo divino e mantém a estrutura predicativa concisa do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz o tetragrama como nome pessoal; “Yahweh” o preserva sem substituí-lo por um título.
- issue: Sentido de קַנָּא como nome e atributo de Deus
  choice: Zeloso / zeloso
  alternative: Ciumento / ciumento
  rationale: “Zeloso” comunica em português a exigência divina de fidelidade exclusiva sem atribuir a Deus inveja pecaminosa. A repetição mantém a força retórica do hebraico, e a nota conserva a alternativa lexical mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você não deve” transmite com naturalidade a proibição hebraica; “prostrar-se” preserva a imagem concreta. Os travessões destacam a fórmula nominal sem alterar sua função.
