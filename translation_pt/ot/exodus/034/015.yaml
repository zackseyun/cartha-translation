  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: pt
  text: Cuidado para não fazer uma aliança com os habitantes da terra; pois eles se prostituirão seguindo os seus deuses e oferecerão sacrifícios aos seus deuses. Então, um deles convidará você, e você comerá do sacrifício dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e você comerá da oferta sacrificial dele”, isto é, do alimento relacionado ao sacrifício que ele ofereceu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Cuidado para não
  rationale: Introduz uma advertência sobre um possível resultado. A formulação é natural em português moderno e preserva a força cautelar.
- source_word: תִּכְרֹת בְּרִית
  choice: fazer uma aliança
  rationale: O hebraísmo literal é “cortar uma aliança”, mas “fazer uma aliança” comunica naturalmente o sentido pactuai sem introduzir uma expressão estranha.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: com os habitantes da terra
  rationale: O singular coletivo hebraico designa o conjunto das pessoas que vivem na terra; o plural é idiomático e preciso em português.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: eles se prostituirão seguindo os seus deuses
  rationale: Preserva a metáfora deliberadamente forte da infidelidade sexual aplicada à idolatria, enquanto “seguindo” expressa com naturalidade אַחֲרֵי.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: oferecerão sacrifícios aos seus deuses
  rationale: Explicita de modo natural o sentido cultual do verbo זבח.
- source_word: וְקָרָא לְךָ
  choice: um deles convidará você
  rationale: O singular após os verbos no plural provavelmente individualiza um membro do grupo; a formulação torna esse sentido distributivo claro.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: você comerá do sacrifício dele
  rationale: Mantém-se perto do hebraico e deixa intacta a referência ao alimento proveniente da oferta sacrificial, sem expandi-la para “banquete sacrificial”.
theological_decisions:
- issue: A idolatria descrita pela metáfora da infidelidade sexual
  choice: Preservar explicitamente a metáfora com “se prostituirão”.
  alternative: “serão infiéis seguindo os seus deuses” ou “irão atrás dos seus deuses”
  rationale: O hebraico emprega intencionalmente uma imagem sexual forte para retratar a deslealdade religiosa; suavizá-la apagaria parte da força literária e teológica.
- issue: O singular “ele convidará você” após antecedentes plurais
  choice: Traduzir distributivamente como “um deles convidará você”.
  alternative: “ele convidará você” ou “eles convidarão você”
  rationale: A mudança para o singular parece apresentar um caso individual representativo. A tradução escolhida comunica isso com clareza sem transformar o verbo em plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora forte do hebraico foi preservada; evitou-se tanto o arcaísmo “cortar uma aliança” quanto a expansão interpretativa “banquete sacrificial” no texto principal.
