  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: pt
  text: E aconteceu que, quando Moisés desceu do monte Sinai, trazendo na mão as duas tábuas do testemunho, ao descer do monte, ele não sabia que a pele de seu rosto resplandecia[a] por ter falado com ele[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «brilhava» ou «emitia raios». O verbo hebraico pode indicar a emissão de raios. A tradução histórica «tinha chifres» deriva de uma associação com a palavra hebraica para «chifre», mas se ajusta menos ao contexto.
    reason: lexical_alternative
  - marker: b
    text: Isto é, com o SENHOR.
    reason: referent_clarification
  - marker: c
    text: 'A expressão «por ter falado com ele» também pode ser entendida em sentido temporal: «quando falou com ele».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz a nova cena narrativa de modo próximo ao hebraico, em português atual e sem recorrer à fórmula arcaica «e sucedeu».
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: quando Moisés desceu ... ao descer
  rationale: As duas construções temporais de ירד são mantidas, inclusive sua repetição enfática, com formulação natural em português.
- source_word: מֵהַר סִינַי
  choice: do monte Sinai
  rationale: Forma corrente e clara em português para o nome geográfico.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: as duas tábuas do testemunho
  rationale: «Tábuas» preserva o objeto concreto, e «testemunho» mantém o termo da aliança sem especificá-lo além do que diz o hebraico.
- source_word: בְּיַד מֹשֶׁה
  choice: na mão
  rationale: Preserva o singular concreto do hebraico. O possuidor fica claro pelo sujeito explícito da oração, evitando uma repetição pouco natural de «Moisés» em português.
- source_word: לֹא יָדַע
  choice: não sabia
  rationale: Equivalente direto e idiomático da negação de ידע.
- source_word: קָרַן
  choice: resplandecia
  rationale: Expressa a emissão de brilho ou raios indicada pelo verbo neste contexto. É claro, digno e mais adequado ao contexto do que a tradução histórica «tinha chifres».
- source_word: עוֹר פָּנָיו
  choice: a pele do seu rosto
  rationale: Mantém a referência explícita à pele, em vez de reduzi-la simplesmente a «rosto».
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: por ter falado com ele
  rationale: A leitura causal se ajusta ao contexto e soa natural em português, enquanto a possível leitura temporal é preservada em nota.
- source_word: אִתּוֹ
  choice: com ele
  rationale: Mantém o pronome do texto hebraico; seu referente contextual, o SENHOR, é esclarecido em nota sem ser inserido no texto principal.
theological_decisions:
- issue: Sentido de קָרַן aplicado ao rosto de Moisés
  choice: resplandecia, isto é, emitia brilho ou raios
  alternative: tinha chifres
  rationale: O contexto descreve a glória visível no rosto de Moisés após seu encontro com o SENHOR. A tradução por radiância corresponde melhor ao uso verbal e ao desenvolvimento narrativo, sem introduzir uma imagem física enganosa.
- issue: Referente de אִתּוֹ
  choice: manter «ele» no texto, com referência contextual ao SENHOR
  alternative: explicitar «o SENHOR» ou «Deus» no texto principal
  rationale: Embora o contexto identifique o referente, o hebraico emprega um pronome. Preservá-lo respeita a forma da fonte e evita explicitação interpretativa desnecessária.
- issue: Valor da preposição בְּ em בְּדַבְּרוֹ
  choice: 'causal: «por ter falado»'
  alternative: 'temporal: «quando falou»'
  rationale: A relação causal explica naturalmente o resplendor no contexto, mas a construção hebraica também admite valor temporal; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e narrativo, sem arcaísmos desnecessários. A repetição de «desceu/descer» foi conservada por refletir o enquadramento repetido do hebraico; a segunda ocorrência de «Moisés» foi substituída por pronome para evitar rigidez excessiva sem perda de sentido.
