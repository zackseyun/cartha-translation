source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: pt
  text: 'E ele disse: “Se agora achei favor aos teus olhos, Senhor, por favor, que o Senhor vá em nosso meio[a], embora este seja um povo obstinado; perdoa a nossa iniquidade e o nosso pecado e toma-nos como tua herança[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vá entre nós» ou «vá conosco». O hebraico diz literalmente «vá em nosso meio».
    reason: lexical_alternative
  - marker: b
    text: Ou «faze de nós tua propriedade». O verbo hebraico pode transmitir a ideia de tomar ou atribuir como herança ou propriedade.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: favor
  rationale: Preserva o sentido relacional da expressão hebraica sem acrescentar conotações teológicas posteriores que «graça» poderia sugerir.
- source_word: בְּעֵינֶיךָ
  choice: aos teus olhos
  rationale: Mantém a imagem da expressão idiomática hebraica, que também é compreensível em português.
- source_word: אֲדֹנָי
  choice: Senhor / o Senhor
  rationale: O texto emprega o título אֲדֹנָי, e não o nome divino YHWH. A primeira ocorrência é vocativa; na segunda, o artigo torna a frase natural em português sem mudar o referente.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: por favor, que o Senhor vá em nosso meio
  rationale: Conserva tanto a súplica expressa por נָא como a imagem espacial de presença e movimento no meio do povo.
- source_word: קְשֵׁה עֹרֶף
  choice: obstinado
  rationale: Comunica em português atual o sentido da metáfora hebraica, literalmente «duro de cerviz», sem recorrer a uma expressão pouco transparente para muitos leitores.
- source_word: עַם
  choice: povo
  rationale: Refere-se a Israel como povo da aliança, não principalmente como entidade geopolítica.
- source_word: עָוֹן
  choice: iniquidade
  rationale: Preserva o peso moral do termo e o distingue do חַטָּאת seguinte.
- source_word: חַטָּאת
  choice: pecado
  rationale: É a correspondência direta e corrente, adequada ao paralelismo com «iniquidade».
- source_word: וּנְחַלְתָּנוּ
  choice: toma-nos como tua herança
  rationale: Expressa a ideia de Deus tomar o povo como aquilo que lhe pertence, preservando a linguagem pactual de herança.
theological_decisions:
- issue: Tradução de אֲדֹנָי numa oração dirigida a YHWH
  choice: Senhor / o Senhor
  alternative: meu Senhor / Senhor DEUS
  rationale: Mantém o título presente no hebraico sem substituí-lo pelo nome divino nem ampliar o texto.
- issue: Relação lógica introduzida por כִּי
  choice: embora
  alternative: pois / porque
  rationale: 'O valor concessivo se ajusta ao contexto: Moisés pede que o Senhor acompanhe o povo apesar da obstinação dele. A conjunção hebraica, isoladamente, também pode ser causal, e essa possibilidade não deve ser tratada como inexistente.'
- issue: Sentido de וּנְחַלְתָּנוּ
  choice: toma-nos como tua herança
  alternative: faze de nós tua propriedade
  rationale: Preserva a noção de pertencimento pactual sem reduzir a expressão a posse meramente material.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva a repetição de «Senhor» e o idioma «aos teus olhos» do hebraico; traduz a metáfora pouco transparente «duro de cerviz» pelo sentido natural «obstinado».
