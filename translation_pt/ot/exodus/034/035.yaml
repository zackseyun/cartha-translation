base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: pt
  text: 'Os filhos de Israel viam o rosto de Moisés: a pele de seu rosto resplandecia[a]. E Moisés tornava a colocar o véu sobre o rosto, até entrar para falar com ele[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico significa «resplandecer» ou «emitir raios». A tradução tradicional «tinha chifres» reflete uma interpretação antiga do termo.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «ele» se refere ao SENHOR.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: viam
  rationale: 'O imperfeito português expressa com naturalidade a ação habitual resumida neste contexto: em cada ocasião, os israelitas viam o rosto de Moisés.'
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar hebraica, embora «os israelitas» também seja uma tradução possível e mais idiomática.
- source_word: קָרַן
  choice: resplandecia
  rationale: O verbo indica emissão de brilho ou raios de luz. «Resplandecia» comunica essa imagem em português atual e digno, sem reproduzir a antiga interpretação equivocada ligada a chifres.
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: a pele do rosto dele
  rationale: Mantém o sentido concreto de עוֹר, «pele», enquanto o pronome evita uma repetição pesada em português sem perder o referente.
- source_word: וְהֵשִׁיב
  choice: tornava a colocar
  rationale: O hifil de שוב significa fazer voltar ou recolocar; a construção escolhida também transmite a repetição habitual da ação.
- source_word: הַמַּסְוֶה
  choice: o véu
  rationale: «Véu» é o termo português tradicional e contextualmente adequado para a cobertura colocada sobre o rosto.
- source_word: עַד בֹּאוֹ לְדַבֵּר אִתּוֹ
  choice: até entrar para falar com ele
  rationale: Reproduz o limite temporal da ação e conserva o pronome masculino do hebraico, cujo referente é determinado pelo contexto imediato.
theological_decisions:
- issue: Referente de «com ele»
  choice: Manter o pronome no texto e esclarecer em nota que se refere ao SENHOR.
  alternative: Traduzir explicitamente «para falar com o SENHOR».
  rationale: O hebraico emprega um pronome. Preservá-lo evita inserir o nome divino no corpo do versículo, ao mesmo tempo que a nota oferece a clareza fornecida pelo contexto imediato.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Os imperfeitos «viam», «resplandecia» e «tornava a colocar» apresentam a cena como ação repetida, coerente com o resumo habitual dos versículos 34–35.
