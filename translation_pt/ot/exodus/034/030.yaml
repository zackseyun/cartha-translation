base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: pt
  text: Quando Arão e todos os filhos de Israel viram Moisés, eis que a pele do rosto dele resplandecia[a], e tiveram medo de se aproximar dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brilhava” ou “emitia raios”. O verbo hebraico é raro e, historicamente, também foi traduzido por “tinha chifres”, embora o contexto favoreça a ideia de resplendor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viram
  rationale: O verbo ראה, no singular antes de um sujeito composto, tem sentido narrativo simples de perceber pela vista; em português, a concordância natural com Arão e todos os filhos de Israel pede o plural.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: e todos os filhos de Israel
  rationale: Preserva a expressão familiar hebraica e sua forma masculina, mantendo uma formulação bíblica ainda clara em português.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a força de chamar a atenção para uma constatação súbita, em registro digno e corrente na narrativa bíblica.
- source_word: קָרַן
  choice: resplandecia
  rationale: O verbo raro indica aqui a emissão de brilho ou raios. O imperfeito português apresenta naturalmente o estado visível quando o povo viu Moisés.
- source_word: עוֹר פָּנָיו
  choice: a pele do rosto dele
  rationale: Mantém o substantivo concreto עוֹר, 'pele', em vez de reduzi-lo simplesmente a 'rosto', e evita possível ambiguidade possessiva.
- source_word: וַיִּירְאוּ
  choice: tiveram medo
  rationale: Expressão idiomática moderna que comunica diretamente a reação do povo.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: de se aproximar dele
  rationale: A construção com מִן e infinitivo expressa temor ou recuo diante do ato de chegar perto; a formulação portuguesa é natural e precisa.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A forma escolhida preserva a designação familiar e gramaticalmente masculina do hebraico, sem neutralizá-la nem acrescentar uma interpretação denominacional.
- issue: Sentido de קָרַן aplicado à pele do rosto de Moisés
  choice: resplandecia
  alternative: brilhava; emitia raios; tinha chifres
  rationale: O contexto favorece claramente luminosidade visível após o encontro de Moisés com o SENHOR. A associação lexical histórica com 'chifre' não é adotada no texto, mas é registrada em nota para reconhecer a raridade e a história interpretativa do verbo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e moderadamente formal; “eis que” preserva a saliência narrativa do hebraico, enquanto “tiveram medo de se aproximar” mantém clareza contemporânea.
