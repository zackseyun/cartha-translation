base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: pt
  text: e você tomar algumas de suas filhas para seus filhos[b], e essas filhas se prostituírem seguindo seus deuses[a] e levarem seus filhos a se prostituir seguindo seus deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agirem como prostitutas” / “cometerem prostituição”. O hebraico usa metaforicamente a linguagem da infidelidade sexual para falar de seguir outros deuses.
    reason: lexical_alternative
  - marker: b
    text: Isto é, essas mulheres levariam seus filhos à idolatria, fazendo-os seguir seus deuses.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: e você tomar
  rationale: Mantém o sentido direto de “tomar” no contexto de arranjos matrimoniais, sem explicitar como verbo aquilo que o contexto apenas implica. A forma portuguesa também permite que a oração continue a advertência iniciada no contexto anterior.
- source_word: מִבְּנֹתָיו
  choice: algumas das filhas dele
  rationale: 'Expressa naturalmente o valor partitivo de מִן: filhas escolhidas dentre as filhas daquele povo ou homem referido no contexto.'
- source_word: לְבָנֶיךָ
  choice: para os seus filhos
  rationale: Reproduz o valor de destinação ou benefício de לְ no contexto de casamento.
- source_word: וְזָנוּ
  choice: e as filhas dele se prostituírem
  rationale: Preserva a metáfora sexual forte de זנה para a infidelidade cultual, em vez de reduzi-la simplesmente a “praticar idolatria”.
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: indo atrás dos deuses delas
  rationale: Verte a locução hebraica de modo natural em português e conserva a imagem de seguir ou perseguir outros deuses.
- source_word: וְהִזְנוּ
  choice: e levarem os seus filhos a se prostituir
  rationale: 'Torna explícita a força causativa do hifil: essas filhas induzem os filhos de Israel à mesma infidelidade cultual.'
- source_word: אֶת בָּנֶיךָ
  choice: os seus filhos
  rationale: Tradução direta do objeto definido com sufixo de segunda pessoa masculina singular.
- source_word: אֱלֹהֵיהֶן
  choice: os deuses delas
  rationale: Mantém tanto o plural referente às divindades estrangeiras quanto o referente feminino plural do sufixo hebraico.
theological_decisions:
- issue: Tradução de זנה no contexto de idolatria
  choice: Preservar a metáfora com “se prostituir”
  alternative: “praticar idolatria” ou “ser infiel”
  rationale: O hebraico emprega deliberadamente linguagem sexual para descrever apostasia cultual. A tradução conserva essa força teológica sem substituir a imagem por sua interpretação.
- issue: Linguagem marcada por gênero em בנותיו e בניך
  choice: “filhas” e “filhos”
  alternative: “descendentes” ou “filhos e filhas”
  rationale: O texto hebraico distingue especificamente as filhas estrangeiras e os filhos israelitas no contexto de casamentos; manter esses termos é semanticamente exato.
- issue: Agência no hifil וְהִזְנוּ
  choice: “levarem os seus filhos a se prostituir”
  alternative: “fizerem os seus filhos se prostituir”
  rationale: “Levar alguém a” comunica com naturalidade a causação ou indução, sem afirmar coerção absoluta além do que a forma causativa exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ir atrás de” preserva a imagem hebraica com naturalidade; “se prostituir” mantém a metáfora cultual deliberadamente forte. Os pronomes “dele/delas” reproduzem as mudanças de referente presentes nos sufixos hebraicos.
