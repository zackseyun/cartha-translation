  naturalness: A construção está compreensível como continuação da advertência do versículo anterior, mas “indo atrás dos deuses delas” é algo coloquial para o registro. “Seguindo seus deuses” é mais fluente e digno, sem perder o sentido idiomático. A repetição de “filhas dele” pode ser esclarecida por “essas filhas”, sem mudar o referente.
  terminology: “Se prostituírem” e “levar ... a se prostituir” preservam apropriadamente a metáfora sexual de זנה e a causação de seu hifil, sem reduzi-las a uma paráfrase doutrinária. “Deuses” é correto. A nota lexical deve continuar explicitando o uso metafórico cultual.
