  yaml_path: translation/ot/exodus/034/017.yaml
  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: pt
  text: Não faça para você deuses de metal fundido[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «deuses fundidos» ou «deuses feitos de metal fundido».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: deuses de metal fundido
  rationale: A construção hebraica combina o plural «deuses» com um termo que designa algo produzido por fusão e moldagem, especialmente uma imagem metálica. A formulação preserva tanto o referente idolátrico quanto o material e o processo de fabricação.
- source_word: לֹא תַעֲשֶׂה
  choice: Não faça
  rationale: A negação com o imperfeito de segunda pessoa masculina singular tem força proibitiva. Em português atual, o imperativo negativo comunica essa força de modo natural e direto.
- source_word: לָּךְ
  choice: para você
  rationale: A preposição com sufixo de segunda pessoa indica interesse ou destinação pessoal. «Para você» conserva o sentido sem intensificar indevidamente a reflexividade.
theological_decisions:
- issue: Natureza do objeto proibido
  choice: A fabricação de «deuses de metal fundido» é proibida.
  alternative: Não faça para você imagens fundidas.
  rationale: O hebraico emprega explicitamente «deuses» em construção com o termo ligado à fundição. A tradução escolhida mantém ambos os elementos e não reduz a expressão apenas a «imagens».
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Não faça» expressa diretamente a proibição legal; «metal fundido» evita o possível sentido figurado de «deuses fundidos» no texto principal.
