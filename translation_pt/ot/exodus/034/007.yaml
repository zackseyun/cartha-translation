  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: pt
  text: que mantém o amor leal por milhares[a], perdoa a iniquidade, a transgressão e o pecado, mas de modo algum deixa sem punição[b]; que faz recair a iniquidade dos pais sobre os filhos e sobre os filhos dos filhos[c], até a terceira e a quarta geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por mil gerações”. O hebraico diz simplesmente “por milhares”, provavelmente em contraste com o juízo que alcança “a terceira e a quarta geração”.
    reason: alternative_reading
  - marker: b
    text: 'Também pode ser traduzido: “mas certamente não absolve” ou “mas certamente não deixa sem punição”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz literalmente “a iniquidade dos pais sobre os filhos e sobre os filhos dos filhos”. A expressão descreve a descendência ao longo das gerações.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: mantém
  rationale: O particípio qal expressa a ação contínua de guardar, preservar ou manter; “mantém” é natural em português e se combina bem com “amor leal”.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Preserva conjuntamente as ideias de amor e fidelidade constantes, inclusive a dimensão relacional ou de aliança, sem recorrer a linguagem arcaica.
- source_word: לָאֲלָפִים
  choice: por milhares
  rationale: Reproduz a expressão hebraica sem acrescentar “gerações”, termo não explícito neste ponto; a possível referência geracional é indicada em nota.
- source_word: נֹשֵׂא
  choice: perdoa
  rationale: Embora o sentido básico seja “carregar” ou “levar”, com termos de pecado o verbo comunica idiomaticamente o perdão.
- source_word: עָוֺן
  choice: iniquidade
  rationale: Mantém o peso moral e teológico do termo, que pode abranger a falta e suas consequências.
- source_word: פֶשַׁע
  choice: transgressão
  rationale: Expressa a violação ou rebeldia denotada pelo termo e preserva a tríade de palavras para o pecado.
- source_word: חַטָּאָה
  choice: pecado
  rationale: É o equivalente direto e corrente, completando naturalmente a tríade.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: mas de modo algum deixa sem punição
  rationale: A construção intensiva nega enfaticamente que Deus deixe a culpa sem resposta. A formulação evita inserir no texto principal um objeto como “o culpado”, que não está expresso no hebraico.
- source_word: פֹּקֵד
  choice: faz recair
  rationale: No contexto de juízo, comunica que a iniquidade alcança as gerações seguintes, sem restringir o verbo ao sentido mais estreito de “punir”.
- source_word: עֲוֺן אָבוֹת
  choice: a iniquidade dos pais
  rationale: Conserva o masculino explícito do hebraico e mantém “iniquidade” em correspondência com a ocorrência anterior.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: sobre os filhos e sobre os filhos dos filhos
  rationale: Reproduz a sequência geracional com clareza e mantém a forma masculina do texto hebraico.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: até a terceira e a quarta geração
  rationale: “Geração” está elíptico, mas é claramente inferido da sequência familiar; explicitá-lo produz português natural.
theological_decisions:
- issue: A tensão entre o perdão divino e a justiça em וְנַקֵּה לֹא יְנַקֶּה
  choice: Manter tanto a declaração plena de perdão quanto a negação enfática de que a culpa fique sem punição.
  alternative: “mas de modo algum absolve” ou “mas certamente não inocenta”
  rationale: O versículo justapõe misericórdia e justiça. A tradução não dissolve essa tensão nem acrescenta “o culpado” como objeto explícito.
- issue: Se “gerações” deve ser especificado depois de “milhares”
  choice: Não acrescentar “gerações” no texto principal.
  alternative: “por mil gerações” ou “por milhares de gerações”
  rationale: O substantivo “gerações” não aparece nessa expressão hebraica. A tradução preserva sua amplitude, enquanto a nota registra a provável leitura geracional.
- issue: O alcance intergeracional da iniquidade dos pais
  choice: Conservar a linguagem de que a iniquidade recai sobre descendentes até a terceira e a quarta geração.
  alternative: Parafrasear como consequências sociais ou limitar a afirmação à punição individual.
  rationale: O hebraico deixa a natureza exata dessa visitação sem definição completa; a tradução preserva a tensão sem impor uma harmonização doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Amor leal” evita arcaísmo e preserva a constância relacional de חֶסֶד. A sintaxe mantém o caráter solene da autodeclaração divina, e as notas seguem a ordem em que os marcadores aparecem no texto.
