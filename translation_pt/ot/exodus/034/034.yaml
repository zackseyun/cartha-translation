  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: pt
  text: Porém, sempre que Moisés entrava na presença de Yahweh para falar com ele, retirava o véu até sair. Depois saía e falava aos filhos de Israel[a] tudo o que lhe havia sido ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “ao povo de Israel”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: Alternativa lexical para uma expressão hebraica coletiva.
lexical_decisions:
- source_word: וּבְבֹא
  choice: Porém, sempre que ... entrava
  rationale: A construção com ב mais infinitivo introduz uma circunstância recorrente; “sempre que” expressa o valor habitual, e “porém” preserva o leve contraste com o versículo anterior.
- source_word: לִפְנֵי יְהוָה
  choice: na presença de Yahweh
  rationale: לִפְנֵי significa literalmente “diante de/na presença de”; esta formulação é natural em português e mantém o nome divino יהוה como “Yahweh”.
- source_word: לְדַבֵּר אִתּוֹ
  choice: para falar com ele
  rationale: O infinitivo indica finalidade, e אִתּוֹ favorece a ideia de falar com alguém, sem excluir o sentido de dirigir-lhe a palavra.
- source_word: יָסִיר אֶת הַמַּסְוֶה
  choice: retirava o véu
  rationale: O imperfeito descreve uma ação habitual no passado; “retirava” transmite isso naturalmente. מַסְוֶה é a cobertura usada sobre o rosto de Moisés.
- source_word: עַד צֵאתוֹ
  choice: até sair
  rationale: A expressão marca o limite temporal da retirada do véu; o infinitivo português mantém a referência a Moisés sem repetição desnecessária.
- source_word: וְיָצָא וְדִבֶּר
  choice: Depois saía e comunicava
  rationale: Os verbos prosseguem a sequência habitual. “Comunicava” expressa aqui o ato de transmitir ao povo o conteúdo recebido, sem acrescentar uma interpretação teológica.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva de perto a expressão hebraica tradicional e sua forma masculina coletiva; uma nota oferece equivalentes idiomáticos modernos.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: tudo o que lhe havia sido ordenado
  rationale: A forma passiva deixa implícito o agente da ordem, como no hebraico, e o mais-que-perfeito composto mostra que a ordem precedia sua comunicação ao povo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” conserva o nome da aliança sem substituí-lo por um título.
- issue: Forma coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A tradução principal preserva a forma masculina do hebraico e sua expressão pactual tradicional, enquanto a nota registra equivalentes idiomáticos sem restringir a referência somente aos homens.
- issue: Agente da ordem em יְצֻוֶּה
  choice: construção passiva sem agente explícito
  alternative: tudo o que Yahweh lhe havia ordenado
  rationale: Embora o contexto indique Yahweh como aquele que ordena, o hebraico mantém o agente implícito; a tradução preserva essa forma.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O período foi dividido em duas frases para clareza, mantendo a sequência habitual das ações e a proximidade lexical com o hebraico.
